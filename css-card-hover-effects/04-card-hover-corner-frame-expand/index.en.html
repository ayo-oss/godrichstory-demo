<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card hover — corner bracket frame</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <article class="card is-demo" tabindex="0">
    <span class="corner corner--tl" aria-hidden="true"></span>
    <span class="corner corner--tr" aria-hidden="true"></span>
    <span class="corner corner--bl" aria-hidden="true"></span>
    <span class="corner corner--br" aria-hidden="true"></span>
    <span class="card__media" aria-hidden="true"></span>
    <div class="card__body">
      <h3 class="card__title">Autumn collection</h3>
    </div>
  </article>
</main>
</body>
</html>
