<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card hover — flip to reveal back</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <article class="card is-demo" tabindex="0">
    <div class="card__flip">
      <div class="card__face card__face--front">
        <h3 class="card__title">プロプラン</h3>
        <p class="card__meta">月12,000ウォン</p>
      </div>
      <div class="card__face card__face--back">
        <p class="card__back-text">無制限エクスポート<br>メンバー5人まで</p>
      </div>
    </div>
  </article>
</main>
</body>
</html>
