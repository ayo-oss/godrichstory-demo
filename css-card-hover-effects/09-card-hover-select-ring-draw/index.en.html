<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">

<title>Card hover — selection ring draw-in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <article class="card is-demo" tabindex="0">
    <svg class="ring" viewBox="0 0 160 100" aria-hidden="true">
      <rect class="ring__rect" x="2" y="2" width="156" height="96" rx="14" ry="14"></rect>
    </svg>
    <div class="card__body">
      <h3 class="card__title">Basic plan</h3>
      <p class="card__meta">4,900 KRW/mo</p>
    </div>
  </article>
</main>
