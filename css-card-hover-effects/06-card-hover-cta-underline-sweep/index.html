<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card hover — CTA underline sweep (parent hover)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <article class="card is-demo" tabindex="0">
    <div class="card__body">
      <h3 class="card__title">브랜드 스토리</h3>
      <p class="card__meta">우리가 만드는 이유</p>
      <span class="cta">
        <span class="cta__label">자세히 보기</span>
        <span class="cta__underline" aria-hidden="true"></span>
      </span>
    </div>
  </article>
</main>
</body>
</html>
