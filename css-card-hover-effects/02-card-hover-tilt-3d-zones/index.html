<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card hover — zone-based 3D tilt (CSS only)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <article class="card is-demo" tabindex="0">
    <div class="card__zones" aria-hidden="true">
      <span class="zone zone--tl"></span>
      <span class="zone zone--tr"></span>
      <span class="zone zone--bl"></span>
      <span class="zone zone--br"></span>
    </div>
    <div class="card__inner">
      <h3 class="card__title">신규 릴리즈</h3>
      <p class="card__meta">Q3 로드맵 보기</p>
    </div>
  </article>
</main>
</body>
</html>
