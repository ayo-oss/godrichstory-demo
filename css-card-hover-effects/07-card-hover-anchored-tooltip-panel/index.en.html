<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card hover — anchor-positioned mini panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <article class="card is-demo" tabindex="0">
    <span class="card__media" aria-hidden="true"></span>
    <div class="card__body">
      <h3 class="card__title">Wireless Earbuds Pro</h3>
      <p class="card__meta">128,000 KRW</p>
    </div>
  </article>
  <div class="panel" aria-hidden="true">
    <p class="panel__row">12 in stock</p>
  </div>
</main>
</body>
</html>
