<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크레스트 거품 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cf" id="cf">
  <p class="cf__hint">
    <svg class="cf__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M16 120c24-32 48-32 72 0s48 32 72 0 48-32 72 0" opacity=".25"/><path d="M16 168c24-32 48-32 72 0s48 32 72 0 48-32 72 0" opacity=".15"/><path d="M228.92 49.09a112 112 0 1 0 14 84.91a8 8 0 0 0-15.5-4a96 96 0 1 1-12-72.91A8 8 0 0 1 216 71.63V40a8 8 0 0 1-8-8h-31.63a8 8 0 0 1-5.65-13.09ZM64 104a12 12 0 1 1 12 12a12 12 0 0 1-12-12m40 64a12 12 0 1 1 12 12a12 12 0 0 1-12-12m72-16a16 16 0 1 1 16 16a16 16 0 0 1-16-16" opacity=".9"/></g></svg>
    <span>합성 높이가 진폭의 문턱을 넘는 칸만 크림색으로 부서뜨립니다 — 바람이 세질수록 흰 꼭대기가 늘어요</span>
  </p>
  <div class="cf__field" id="field" role="application" aria-label="크레스트 거품 실험판" tabindex="0">
    <canvas class="cf__cv" id="cv"></canvas>
    <b class="cf__badge" aria-hidden="true"><span class="cf__badgeNum" id="thrVal">문턱 72%</span><span class="cf__badgeUnit" id="windVal">바람 1.0</span></b>
  </div>
</div>
</main>
<script>
// 크레스트 거품 — 01 과 같은 2D 파도장(정현파 6개 mulberry32(7) + Gerstner 처짐)이지만
// 바탕 램프를 낮게 억제해(거의 단색 파랑 — 거품이 주인공) 물밑에 묻어두고,
// 합성높이 > 실효진폭×문턱 인 칸만 smoothstep 가장자리로 크림색 whitecap 을 얹는다.
// 문턱은 바람 세기에 반비례해 0.82 → 0.55 로 낮아진다 — 바람이 세질수록 거품이 늘어난다.
var root = document.getElementById('cf');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var thrVal = document.getElementById('thrVal');
var windVal = document.getElementById('windVal');
var ctx = cv.getContext('2d');

var css = getComputedStyle(root);
function v(name) { return css.getPropertyValue(name).trim(); }
var BASE0 = v('--base0'), BASE1 = v('--base1'); // 억제된 바탕 램프 — 파랑 (거품 아닌 물)
var DEEP = v('--deep');                          // 가장 낮은 골 — 진한 파랑
var FOAM = v('--foam');                          // whitecap — 크림
var FOAM2 = v('--foam2');                        // whitecap 꼭대기 — 밝은 크림

var COLS = 110;   // 수면 격자 가로 칸 수(01 과 동일)
var STEP = 3;     // 격자 한 칸이 렌더 버퍼에서 차지하는 픽셀
var NW = 6;       // 겹칠 정현파 개수
var Q = 0.42;     // Gerstner 처짐 계수
var FOAM_EDGE = 0.16; // smoothstep 가장자리 폭(문턱 비율 단위)

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    var u = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((u ^ (u >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(7);

var WAVES = [];
(function () {
  var lam = 34;
  for (var i = 0; i < NW; i++) {
    var ang = rng() * Math.PI * 2;
    WAVES.push({
      lam: lam,
      freq: (Math.PI * 2) / lam,
      dirX: Math.cos(ang), dirY: Math.sin(ang),
      amp: 0.58 / (i * 0.62 + 1),
      spd: 0.55 + rng() * 0.25,
      ph: rng() * Math.PI * 2
    });
    lam *= 0.55;
  }
})();
for (var w = 0; w < NW; w++) {
  WAVES[w].om = WAVES[w].spd * 3.6 * Math.sqrt(1 / WAVES[w].lam) * 6;
}

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1, ROWS = 0;
var hgt = null;
var buf = null, bctx = null, out = null;
var RW = 0, RH = 0;
var raf = 0, auto = true, nowSec = 0;
var wind = 1.0, windT = 1.0;
var windAng = 0.5, windAngT = 0.5;
var lastPX = -1, lastPY = -1, lastPT = 0;

function hex2rgb(s) {
  var pm = /^\s*rgb\(\s*([\d.]+)%\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%\s*\)\s*$/.exec(s);
  if (pm) return [Math.round(pm[1] * 2.55), Math.round(pm[2] * 2.55), Math.round(pm[3] * 2.55)];
  s = s.replace('#', '');
  if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
  var n = parseInt(s, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
var RB0 = hex2rgb(BASE0), RB1 = hex2rgb(BASE1);
var RDEEP = hex2rgb(DEEP);
var RF = hex2rgb(FOAM), RF2 = hex2rgb(FOAM2);

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ROWS = Math.max(40, Math.round(COLS * H / W));
  hgt = new Float32Array(COLS * ROWS);
  RW = COLS * STEP; RH = ROWS * STEP;
  buf = document.createElement('canvas');
  buf.width = RW; buf.height = RH;
  bctx = buf.getContext('2d');
  out = bctx.createImageData(RW, RH);
}

// 파도장 높이 합성 — height(x,y,t) = Σ amp·sin(dot(k·dir,(x,y)) + t·ω + φ) (01 과 같은 뿌리)
function fieldcalc(t, wstr, wang) {
  var i = 0;
  for (var y = 0; y < ROWS; y++) {
    for (var x = 0; x < COLS; x++, i++) {
      var h = 0;
      for (var w2 = 0; w2 < NW; w2++) {
        var WV = WAVES[w2];
        var da = wang * 0.5;
        var dx = WV.dirX * Math.cos(da) - WV.dirY * Math.sin(da);
        var dy = WV.dirX * Math.sin(da) + WV.dirY * Math.cos(da);
        var ph = (x * dx + y * dy) * WV.freq * 0.62 + t * WV.om + WV.ph;
        h += WV.amp * wstr * Math.sin(ph);
      }
      hgt[i] = h;
    }
  }
}

function smoothstep(a, b, x) {
  var t = (x - a) / (b - a);
  if (t < 0) t = 0; else if (t > 1) t = 1;
  return t * t * (3 - 2 * t);
}

// 렌더 — 억제된 바탕(골 DEEP → BASE0 → BASE1, 마루 직전까지만) 위에
// 문턱을 넘은 칸을 크림 whitecap 으로. 가장자리는 smoothstep 로 부드럽게, 꼭대기는 FOAM2 로 더 밝게.
function render(thr) {
  var o = out.data;
  // 실효 진폭 — 현재 바람까지 반영한 이 파도장의 실제 스케일. 문턱은 이 배율로 작동한다.
  var eff = 0;
  for (var i = 0; i < NW; i++) eff += WAVES[i].amp;
  eff *= wind;
  var cut = eff * thr;
  for (var y = 0; y < ROWS; y++) {
    var row = y * COLS;
    for (var x = 0; x < COLS; x++) {
      var idx = row + x;
      var h = hgt[idx];
      // 억제된 바탕 램프 — h 를 0.55 배로 눌러 물색이 거의 단색에 가깝게(거품이 주인공)
      var u = h * 0.55 * 1.24 + 0.5;
      if (u < 0) u = 0; else if (u > 1) u = 1;
      var r, g, b;
      if (u > 0.5) {
        var k = (u - 0.5) * 2;
        r = RB1[0] * (1 - k) + RB0[0] * k;
        g = RB1[1] * (1 - k) + RB0[1] * k;
        b = RB1[2] * (1 - k) + RB0[2] * k;
      } else {
        var k2 = u * 2;
        r = RDEEP[0] * (1 - k2) + RB0[0] * k2;
        g = RDEEP[1] * (1 - k2) + RB0[1] * k2;
        b = RDEEP[2] * (1 - k2) + RB0[2] * k2;
      }
      // whitecap — h 가 cut 을 넘으면 크림. 가장자리 smoothstep(폭 FOAM_EDGE·eff), 꼭대기는 FOAM2 로 두 단
      var f = smoothstep(cut - FOAM_EDGE * eff, cut + FOAM_EDGE * eff, h);
      if (f > 0) {
        var top = smoothstep(cut + FOAM_EDGE * eff * 2.2, cut + eff * 0.42, h);
        var fr = RF[0] * (1 - top) + RF2[0] * top;
        var fg = RF[1] * (1 - top) + RF2[1] * top;
        var fb = RF[2] * (1 - top) + RF2[2] * top;
        r = r * (1 - f) + fr * f;
        g = g * (1 - f) + fg * f;
        b = b * (1 - f) + fb * f;
      }
      for (var sy = 0; sy < STEP; sy++) {
        var base = ((y * STEP + sy) * RW + x * STEP) * 4;
        for (var sx = 0; sx < STEP; sx++, base += 4) {
          o[base] = r;
          o[base + 1] = g;
          o[base + 2] = b;
          o[base + 3] = 255;
        }
      }
    }
  }
  bctx.putImageData(out, 0, 0);
  ctx.drawImage(buf, 0, 0, W, H);
}

// 문턱은 바람에 반비례 — 0.82(약한 바람) → 0.55(강한 바람)
function thresholdFor(w) {
  return 0.82 - 0.27 * Math.max(0, Math.min(1, (w - 0.35) / (2.1 - 0.35)));
}

function frame(now) {
  nowSec = now / 1000;
  if (auto) {
    var th = nowSec * 0.31;
    windT = 1.05 + Math.sin(th * 0.9 + 0.4) * 0.55 + Math.sin(th * 2.3) * 0.12;
    windAngT = 0.5 + Math.sin(th * 0.42) * 0.85;
  }
  wind += (windT - wind) * 0.05;
  windAng += (windAngT - windAng) * 0.05;
  fieldcalc(nowSec, wind, windAng);
  var thr = thresholdFor(wind);
  render(thr);
  thrVal.textContent = '문턱 ' + Math.round(thr * 100) + '%';
  windVal.textContent = '바람 ' + wind.toFixed(2);
  raf = requestAnimationFrame(frame);
}

function still() {
  fieldcalc(7.3, 1.35, 0.5);
  render(thresholdFor(1.35));
}

function localXY(e) {
  var r = field.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

field.addEventListener('pointermove', function (e) {
  var p = localXY(e);
  var t = performance.now();
  if (lastPX >= 0 && t > lastPT) {
    var vx = p[0] - lastPX, vy = p[1] - lastPY;
    var sp2 = Math.sqrt(vx * vx + vy * vy);
    if (sp2 > 0.5) {
      windT = Math.max(0.35, Math.min(2.1, 0.9 + sp2 * 0.02));
      windAngT = Math.atan2(vy, vx) * 0.16;
    }
  }
  lastPX = p[0]; lastPY = p[1]; lastPT = t;
  auto = false;
});
field.addEventListener('pointerleave', function () {
  auto = true;
  lastPX = -1;
});
field.addEventListener('keydown', function (e) {
  var d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!d) return;
  e.preventDefault();
  auto = false;
  windT = Math.max(0.35, Math.min(2.1, windT + d[0] * 0.18));
  windAngT = windAngT + d[1] * 0.1;
  if (reduce) {
    fieldcalc(nowSec || 3.1, windT, windAngT);
    render(thresholdFor(windT));
  }
});
window.addEventListener('resize', function () { fit(); if (reduce) still(); });

fit();
if (reduce) {
  root.classList.add('is-still');
  still();
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
