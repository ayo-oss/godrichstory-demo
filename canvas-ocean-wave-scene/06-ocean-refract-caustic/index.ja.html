<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수면 굴절 근사 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rc" id="rc">
  <p class="rc__hint">
    <svg class="rc__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M16 120c24-32 48-32 72 0s48 32 72 0 48-32 72 0" opacity=".25"/><path d="M16 168c24-32 48-32 72 0s48 32 72 0 48-32 72 0" opacity=".15"/><path d="M228.92 49.09a112 112 0 1 0 14 84.91a8 8 0 0 0-15.5-4a96 96 0 1 1-12-72.91A8 8 0 0 1 216 71.63V40a8 8 0 0 1-8-8h-31.63a8 8 0 0 1-5.65-13.09ZM64 104a12 12 0 1 1 12 12a12 12 0 0 1-12-12m40 64a12 12 0 1 1 12 12a12 12 0 0 1-12-12m72-16a16 16 0 1 1 16 16a16 16 0 0 1-16-16" opacity=".9"/></g></svg>
    <span>床のチェッカー模様を水面の勾配ぶん引き寄せて屈折を近似します — 明るいコースティクスは勾配の発散から計算します</span>
  </p>
  <div class="rc__field" id="field" role="application" aria-label="水面屈折近似お試しパネル" tabindex="0">
    <canvas class="rc__cv" id="cv"></canvas>
    <b class="rc__badge" aria-hidden="true"><span class="rc__badgeNum" id="depthVal">屈折 x34</span><span class="rc__badgeUnit" id="windVal">風 1.0</span></b>
  </div>
</div>
</main>
<script>
// 수면 굴절 근사 — 01 과 같은 뿌리(정현파 6개 mulberry32(7))의 2D 파도장에서 픽셀마다 기울기(gx,gy)를
// 구해 "빛이 그만큼 꺾여 온다"는 굴절 근사로 바닥 무늬(체커+격자선) 샘플 좌표를 오프셋한다.
// 077-07(fx-fluid-surface)의 스넬 굴절과 달리 여기선 밑그림이 정적 체커판이고, 코스틱(집광 밝기)은
// 별도 스텝으로 만들지 않고 기울기 발산(∂gx/∂x + ∂gy/∂y)의 절대값으로 근사해 밝기에 얹는다
// (빛다발이 모이는 자리 = 기울기가 급하게 수렴/발산하는 자리라는 물리적 직관의 저해상 근사).
var root = document.getElementById('rc');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var depthVal = document.getElementById('depthVal');
var windVal = document.getElementById('windVal');
var ctx = cv.getContext('2d');

var css = getComputedStyle(root);
function v(name) { return css.getPropertyValue(name).trim(); }
var TILE0 = v('--tile0'), TILE1 = v('--tile1'); // 바닥 체커 두 색(모래 계열)
var LINE = v('--line');                          // 바닥 격자선
var CAUSTIC = v('--caustic');                    // 코스틱 밝기(민트)

var COLS = 110;    // 수면 격자 가로 칸 수(01 과 동일)
var STEP = 3;      // 격자 한 칸이 렌더 버퍼에서 차지하는 픽셀
var NW = 6;        // 겹칠 정현파 개수(공통 물리, 01 과 동일 뿌리)
var REFRACT = 34;  // 굴절 오프셋 배율(버퍼 px) — 기울기 1 당 이만큼 옆 픽셀을 당겨 온다
var TILE_PX = 11;  // 바닥 체커 한 칸 크기(버퍼 px) — 칸이 작을수록 굴절로 움직이는 경계가 많아진다

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    var u = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((u ^ (u >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(7);

var WAVES = [];
(function () {
  var lam = 34;
  for (var i = 0; i < NW; i++) {
    var ang = rng() * Math.PI * 2;
    WAVES.push({
      lam: lam,
      freq: (Math.PI * 2) / lam,
      dirX: Math.cos(ang), dirY: Math.sin(ang),
      amp: 0.58 / (i * 0.62 + 1),
      spd: 0.55 + rng() * 0.25,
      ph: rng() * Math.PI * 2
    });
    lam *= 0.55;
  }
})();
for (var w = 0; w < NW; w++) {
  WAVES[w].om = WAVES[w].spd * 3.6 * Math.sqrt(1 / WAVES[w].lam) * 6;
}

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1, ROWS = 0;
var hgt = null;    // 파도장 높이(Float32Array, 격자 해상도)
var buf = null, bctx = null, out = null;
var RW = 0, RH = 0;
var raf = 0, auto = true, nowSec = 0;
var wind = 1.0, windT = 1.0;
var windAng = 0.5, windAngT = 0.5;
var lastPX = -1, lastPY = -1, lastPT = 0;

function hex2rgb(s) {
  var pm = /^\s*rgb\(\s*([\d.]+)%\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%\s*\)\s*$/.exec(s);
  if (pm) return [Math.round(pm[1] * 2.55), Math.round(pm[2] * 2.55), Math.round(pm[3] * 2.55)];
  s = s.replace('#', '');
  if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
  var n = parseInt(s, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
var RT0 = hex2rgb(TILE0), RT1 = hex2rgb(TILE1);
var RL = hex2rgb(LINE), RC = hex2rgb(CAUSTIC);

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ROWS = Math.max(40, Math.round(COLS * H / W));
  hgt = new Float32Array(COLS * ROWS);
  RW = COLS * STEP; RH = ROWS * STEP;
  buf = document.createElement('canvas');
  buf.width = RW; buf.height = RH;
  bctx = buf.getContext('2d');
  out = bctx.createImageData(RW, RH);  // getImageData 없이 밑그림을 직접 계산한다
}

// 파도장 높이 합성 — 01 과 같은 뿌리
function fieldcalc(t, wstr, wang) {
  var i = 0;
  for (var y = 0; y < ROWS; y++) {
    for (var x = 0; x < COLS; x++, i++) {
      var h = 0;
      for (var w2 = 0; w2 < NW; w2++) {
        var WV = WAVES[w2];
        var da = wang * 0.5;
        var dx = WV.dirX * Math.cos(da) - WV.dirY * Math.sin(da);
        var dy = WV.dirX * Math.sin(da) + WV.dirY * Math.cos(da);
        var ph = (x * dx + y * dy) * WV.freq * 0.62 + t * WV.om + WV.ph;
        h += WV.amp * wstr * Math.sin(ph);
      }
      hgt[i] = h;
    }
  }
}

// 바닥 무늬 색 — 체커 + 옅은 격자선. 굴절로 당겨온 "원본 좌표"에서 이 함수를 호출해 색을 얻는다.
// 좌표는 버퍼 px 단위(bx, by) — 화면 밖으로 나가면 감싸기(모듈로)로 무한 바닥처럼 보이게 한다.
function tileColor(bx, by) {
  var wx = ((bx % RW) + RW) % RW;
  var wy = ((by % RH) + RH) % RH;
  var cx = Math.floor(wx / TILE_PX), cy = Math.floor(wy / TILE_PX);
  var checker = (cx + cy) % 2 === 0;
  var lx = wx - cx * TILE_PX, ly = wy - cy * TILE_PX;
  var onLine = lx < 1.4 || ly < 1.4;
  if (onLine) return RL;
  return checker ? RT0 : RT1;
}

// 렌더 — 픽셀마다 격자 기울기(중앙차분)를 REFRACT 배로 키워 바닥 샘플 좌표를 오프셋(굴절 근사),
// 기울기 발산(수렴/확산이 급한 자리)의 절대값을 코스틱 밝기로 얹는다.
function render() {
  var o = out.data;
  for (var y = 0; y < ROWS; y++) {
    var row = y * COLS;
    var y0 = y > 0 ? y - 1 : y, y1 = y < ROWS - 1 ? y + 1 : y;
    for (var x = 0; x < COLS; x++) {
      var idx = row + x;
      var x0 = x > 0 ? x - 1 : x, x1 = x < COLS - 1 ? x + 1 : x;
      var gx = (hgt[row + x1] - hgt[row + x0]) / Math.max(1, x1 - x0);
      var gy = (hgt[y1 * COLS + x] - hgt[y0 * COLS + x]) / Math.max(1, y1 - y0);
      // 발산 근사 — 이웃 기울기와의 차이(2차 차분에 준하는 값)를 코스틱 강도로 쓴다
      var gxr = x1 < COLS - 1 ? (hgt[row + Math.min(COLS - 1, x1 + 1)] - hgt[row + x1]) : gx;
      var gyd = y1 < ROWS - 1 ? (hgt[Math.min(ROWS - 1, y1 + 1) * COLS + x] - hgt[y1 * COLS + x]) : gy;
      var div = Math.abs((gxr - gx) + (gyd - gy)) * 90;
      if (div > 1) div = 1;
      var offx = gx * REFRACT, offy = gy * REFRACT;
      var bx0 = x * STEP + STEP / 2, by0 = y * STEP + STEP / 2;
      var c = tileColor(bx0 + offx, by0 + offy);
      var r = c[0], g = c[1], b = c[2];
      // 코스틱 — 발산이 큰 자리를 밝은 민트로 가산
      if (div > 0.06) {
        var f = (div - 0.06) / 0.94;
        r = r + (RC[0] - r) * f * 0.85;
        g = g + (RC[1] - g) * f * 0.85;
        b = b + (RC[2] - b) * f * 0.85;
      }
      for (var sy = 0; sy < STEP; sy++) {
        var base = ((y * STEP + sy) * RW + x * STEP) * 4;
        for (var sx = 0; sx < STEP; sx++, base += 4) {
          o[base] = r;
          o[base + 1] = g;
          o[base + 2] = b;
          o[base + 3] = 255;
        }
      }
    }
  }
  bctx.putImageData(out, 0, 0);
  ctx.drawImage(buf, 0, 0, W, H);
  // 중앙 코스틱 밝기를 getImageData 로 되읽어 배지 발광에 되먹인다
  var samp = bctx.getImageData(Math.floor(RW / 2), Math.floor(RH / 2), 1, 1).data;
  field.style.setProperty('--glint', (samp[0] / 255).toFixed(2));
}

function frame(now) {
  nowSec = now / 1000;
  if (auto) {
    var th = nowSec * 0.31;
    windT = 1.05 + Math.sin(th * 0.9 + 0.4) * 0.55 + Math.sin(th * 2.3) * 0.12;
    windAngT = 0.5 + Math.sin(th * 0.42) * 0.85;
  }
  wind += (windT - wind) * 0.05;
  windAng += (windAngT - windAng) * 0.05;
  fieldcalc(nowSec, wind, windAng);
  render();
  windVal.textContent = '風 ' + wind.toFixed(2);
  raf = requestAnimationFrame(frame);
}

// 정지판 — 루프 없이 시드가 정한 한 시각의 파도장을 계산해 굴절·코스틱이 살아 있는 정적 한 장
function still() {
  fieldcalc(7.3, 1.35, 0.5);
  render();
}

function localXY(e) {
  var r = field.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

field.addEventListener('pointermove', function (e) {
  var p = localXY(e);
  var t = performance.now();
  if (lastPX >= 0 && t > lastPT) {
    var vx = p[0] - lastPX, vy = p[1] - lastPY;
    var sp2 = Math.sqrt(vx * vx + vy * vy);
    if (sp2 > 0.5) {
      windT = Math.max(0.35, Math.min(2.1, 0.9 + sp2 * 0.02));
      windAngT = Math.atan2(vy, vx) * 0.16;
    }
  }
  lastPX = p[0]; lastPY = p[1]; lastPT = t;
  auto = false;
});
field.addEventListener('pointerleave', function () {
  auto = true;
  lastPX = -1;
});
field.addEventListener('keydown', function (e) {
  var d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!d) return;
  e.preventDefault();
  auto = false;
  windT = Math.max(0.35, Math.min(2.1, windT + d[0] * 0.18));
  windAngT = windAngT + d[1] * 0.1;
  if (reduce) { fieldcalc(nowSec || 3.1, windT, windAngT); render(); }
});
window.addEventListener('resize', function () { fit(); if (reduce) still(); });

fit();
depthVal.textContent = '屈折 x' + REFRACT;
if (reduce) {
  root.classList.add('is-still');
  still();
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
