<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파도 소용돌이 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rp" id="rp">
  <p class="rp__hint">
    <svg class="rp__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M16 120c24-32 48-32 72 0s48 32 72 0 48-32 72 0" opacity=".25"/><path d="M16 168c24-32 48-32 72 0s48 32 72 0 48-32 72 0" opacity=".15"/><path d="M228.92 49.09a112 112 0 1 0 14 84.91a8 8 0 0 0-15.5-4a96 96 0 1 1-12-72.91A8 8 0 0 1 216 71.63V40a8 8 0 0 1-8-8h-31.63a8 8 0 0 1-5.65-13.09ZM64 104a12 12 0 1 1 12 12a12 12 0 0 1-12-12m40 64a12 12 0 1 1 12 12a12 12 0 0 1-12-12m72-16a16 16 0 1 1 16 16a16 16 0 0 1-16-16" opacity=".9"/></g></svg>
    <span>파도장에 국소 회전을 한 겹 얹어 소용돌이를 만듭니다 — 마우스를 대면 회전 중심이 그리로 갑니다</span>
  </p>
  <div class="rp__field" id="field" role="application" aria-label="파도 소용돌이 실험판" tabindex="0">
    <canvas class="rp__cv" id="cv"></canvas>
    <b class="rp__badge" aria-hidden="true"><span class="rp__badgeNum" id="swirlVal">회전 1.0</span><span class="rp__badgeUnit" id="windVal">바람 1.0</span></b>
  </div>
</div>
</main>
<script>
// 파도 소용돌이(이안류 패치) — 01 과 같은 뿌리(정현파 6개 mulberry32(7))의 파도장 위에
// 국소 와류를 한 겹 얹는다. 회전 유도체 접근: 각 셀의 좌표를 와류 중심 기준 극좌표로 바꿔
// 위상에 -각도(회전)와 반경 비례 감쇠(ramp)를 더한다. 위상이 비틀리면 정현파의 마루·골이
// 와류 주변에서 나선처럼 감기며 "파도가 뭉쳐 바깥으로 빠져나가는" 이안류의 인상을 준다.
// 와류 중심은 자동 모드에서 리사주로 천천히 옮겨 다니고, 포인터가 있으면 그 위치를 따라간다.
// 와류 주변 밝기(거품 농도)는 반경 가우시안으로 부풀려 중심이 물빛보다 밝게 뜨게 한다.
var root = document.getElementById('rp');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var swirlVal = document.getElementById('swirlVal');
var windVal = document.getElementById('windVal');
var ctx = cv.getContext('2d');

var css = getComputedStyle(root);
function v(name) { return css.getPropertyValue(name).trim(); }
var CREST = [v('--crest'), v('--crest-2')];   // 마루 색 램프 — 민트 계열
var TROUGH = [v('--trough'), v('--trough-2')]; // 골 색 램프 — 파랑 계열
var FOAM = v('--foam');                        // 와류 중심 거품 — 밝은 크림

var COLS = 110;   // 파도장 가로 칸 수(01 과 동일)
var STEP = 3;     // 격자 한 칸이 렌더 버퍼에서 차지하는 픽셀
var NW = 6;       // 겹칠 정현파 개수(공통 물리)
var SWIRL = 2.6;  // 와류 세기 — 위상을 이만큼 비튼다(라디안 스케일)
var VORTEX_R = 30;// 와류 반경(격자 칸 수) — 이 안에서 회전이 감쇠하며 살아 있다

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    var u = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((u ^ (u >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(7);

var WAVES = [];
(function () {
  var lam = 34;
  for (var i = 0; i < NW; i++) {
    var ang = rng() * Math.PI * 2;
    WAVES.push({
      lam: lam,
      freq: (Math.PI * 2) / lam,
      dirX: Math.cos(ang), dirY: Math.sin(ang),
      amp: 0.58 / (i * 0.62 + 1),
      spd: 0.55 + rng() * 0.25,
      ph: rng() * Math.PI * 2
    });
    lam *= 0.55;
  }
})();
for (var w = 0; w < NW; w++) {
  WAVES[w].om = WAVES[w].spd * 3.6 * Math.sqrt(1 / WAVES[w].lam) * 6;
}

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1, ROWS = 0;
var hgt = null;                          // 파도장 높이(위상 비틀림 반영)
var foam = null;                         // 와류 거품 농도(0..1)
var buf = null, bctx = null, out = null;
var RW = 0, RH = 0;
var raf = 0, auto = true, nowSec = 0;
var wind = 1.0, windT = 1.0;             // 바람 세기(실효 진폭)
var windAng = 0.5, windAngT = 0.5;       // 바람 방향
var vx = 0.5, vy = 0.42;                 // 와류 중심(판 비율 0..1) 현재
var vxT = 0.5, vyT = 0.42;               // 목표(포인터 또는 자동 리사주)
var swirl = 1.0, swirlT = 1.0;           // 와류 세기 배율
var lastPX = -1, lastPY = -1, lastPT = 0;

function hex2rgb(s) {
  var pm = /^\s*rgb\(\s*([\d.]+)%\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%\s*\)\s*$/.exec(s);
  if (pm) return [Math.round(pm[1] * 2.55), Math.round(pm[2] * 2.55), Math.round(pm[3] * 2.55)];
  s = s.replace('#', '');
  if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
  var n = parseInt(s, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
var C0 = hex2rgb(CREST[0]), C1 = hex2rgb(CREST[1]);
var T0 = hex2rgb(TROUGH[0]), T1 = hex2rgb(TROUGH[1]);
var FC = hex2rgb(FOAM);

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ROWS = Math.max(40, Math.round(COLS * H / W));
  var n = COLS * ROWS;
  hgt = new Float32Array(n);
  foam = new Float32Array(n);
  RW = COLS * STEP; RH = ROWS * STEP;
  buf = document.createElement('canvas');
  buf.width = RW; buf.height = RH;
  bctx = buf.getContext('2d');
  out = bctx.createImageData(RW, RH);
}

// 파도장 + 와류 — height(x,y,t) = Σ amp·sin(위상 + 비틀림(각도·반경))
// 비틀림 twist = SWIRL·세기·(1 - r/R)·θ  … θ 는 중심 기준 방위각, r 은 반경.
// 반경이 R 을 넘으면 twist=0 — 와류가 국소 패치로만 살게.
function fieldcalc(t, wstr, wang, cx, cy, sw) {
  var i = 0;
  for (var y = 0; y < ROWS; y++) {
    for (var x = 0; x < COLS; x++, i++) {
      var dxv = x - cx, dyv = y - cy;
      var r = Math.sqrt(dxv * dxv + dyv * dyv);
      var ang = Math.atan2(dyv, dxv);
      var fall = r < VORTEX_R ? 1 - r / VORTEX_R : 0;
      fall *= fall;                              // 감쇠를 가속 — 중심만 또렷하게
      var twist = SWIRL * sw * fall * ang;
      var h = 0;
      for (var w2 = 0; w2 < NW; w2++) {
        var WV = WAVES[w2];
        var da = wang * 0.5;
        var dx = WV.dirX * Math.cos(da) - WV.dirY * Math.sin(da);
        var dy = WV.dirX * Math.sin(da) + WV.dirY * Math.cos(da);
        var ph = (x * dx + y * dy) * WV.freq * 0.62 + t * WV.om + WV.ph;
        h += WV.amp * wstr * Math.sin(ph + twist);
      }
      hgt[i] = h;
      // 거품 농도 — 와류 중심 가우시안 + 파도 마루 겹침. 진폭이 뭉치는 자리가 밝다
      var foamv = fall * 0.85 + Math.max(0, h) * 0.5;
      if (foamv > 1) foamv = 1;
      foam[i] = foamv;
    }
  }
}

// 렌더 — 높이→색 램프(골 파랑 → 마루 민트) 뒤 거품 농도만큼 밝은 크림으로 당긴다.
// 와류가 옮겨 다니면 밝은 패치가 파도를 헤치고 다니는 게 눈에 띄어 누적면적이 크게 잡힌다.
function render() {
  var o = out.data;
  for (var y = 0; y < ROWS; y++) {
    var row = y * COLS;
    for (var x = 0; x < COLS; x++) {
      var i = row + x;
      var h = hgt[i];
      var u = h * 1.24 + 0.5;
      if (u < 0) u = 0; else if (u > 1) u = 1;
      var r, g, b;
      if (u > 0.5) {
        var k = (u - 0.5) * 2;
        r = C1[0] + (C0[0] - C1[0]) * k;
        g = C1[1] + (C0[1] - C1[1]) * k;
        b = C1[2] + (C0[2] - C1[2]) * k;
      } else {
        var k2 = u * 2;
        r = T0[0] + (T1[0] - T0[0]) * k2;
        g = T0[1] + (T1[1] - T0[1]) * k2;
        b = T0[2] + (T1[2] - T0[2]) * k2;
      }
      var f = foam[i];
      if (f > 0.02) {
        r = r + (FC[0] - r) * f * 0.8;
        g = g + (FC[1] - g) * f * 0.8;
        b = b + (FC[2] - b) * f * 0.8;
      }
      for (var sy = 0; sy < STEP; sy++) {
        var base = ((y * STEP + sy) * RW + x * STEP) * 4;
        for (var sx = 0; sx < STEP; sx++, base += 4) {
          o[base] = r;
          o[base + 1] = g;
          o[base + 2] = b;
          o[base + 3] = 255;
        }
      }
    }
  }
  bctx.putImageData(out, 0, 0);
  ctx.drawImage(buf, 0, 0, W, H);
}

function frame(now) {
  nowSec = now / 1000;
  if (auto) {
    var th = nowSec * 0.31;
    windT = 1.05 + Math.sin(th * 0.9 + 0.4) * 0.55 + Math.sin(th * 2.3) * 0.12;
    windAngT = 0.5 + Math.sin(th * 0.42) * 0.85;
    // 와류 중심이 판 안을 천천히 배회 — 두 주파수 리사주로 예측 불가능하게
    vxT = 0.5 + Math.sin(th * 0.37 + 1.2) * 0.3;
    vyT = 0.44 + Math.sin(th * 0.53 + 2.1) * 0.26;
    swirlT = 1.0 + Math.sin(th * 0.7) * 0.35;
  }
  wind += (windT - wind) * 0.05;
  windAng += (windAngT - windAng) * 0.05;
  vx += (vxT - vx) * 0.045;
  vy += (vyT - vy) * 0.045;
  swirl += (swirlT - swirl) * 0.04;
  fieldcalc(nowSec, wind, windAng, vx * COLS, vy * ROWS, swirl);
  render();
  swirlVal.textContent = '회전 ' + swirl.toFixed(1);
  windVal.textContent = '바람 ' + wind.toFixed(2);
  raf = requestAnimationFrame(frame);
}

// 정지판 — 루프 없이 시드가 정한 한 시각의 와류를 계산해 소용돌이가 살아 있는 정적 한 장
function still() {
  fieldcalc(7.3, 1.35, 0.5, 0.46 * COLS, 0.42 * ROWS, 1.2);
  render();
}

function localXY(e) {
  var r = field.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

field.addEventListener('pointermove', function (e) {
  var p = localXY(e);
  var t = performance.now();
  // 포인터 = 와류 중심 목표. 이동 벡터는 바람으로도 실측(01 방식)
  vxT = Math.max(0.04, Math.min(0.96, p[0] / W));
  vyT = Math.max(0.04, Math.min(0.96, p[1] / H));
  if (lastPX >= 0 && t > lastPT) {
    var dxp = p[0] - lastPX, dyp = p[1] - lastPY;
    var sp2 = Math.sqrt(dxp * dxp + dyp * dyp);
    if (sp2 > 0.5) {
      windT = Math.max(0.35, Math.min(2.1, 0.9 + sp2 * 0.02));
      windAngT = Math.atan2(dyp, dxp) * 0.16;
    }
  }
  lastPX = p[0]; lastPY = p[1]; lastPT = t;
  auto = false;
});
field.addEventListener('pointerleave', function () {
  auto = true;
  lastPX = -1;
});
field.addEventListener('keydown', function (e) {
  var d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!d) return;
  e.preventDefault();
  auto = false;
  vxT = Math.max(0.05, Math.min(0.95, vxT + d[0] * 0.06));
  vyT = Math.max(0.05, Math.min(0.95, vyT + d[1] * 0.06));
  swirlT = Math.max(0.3, Math.min(1.9, swirlT + (d[1] < 0 ? 0.12 : -0.12)));
  if (reduce) { fieldcalc(nowSec || 3.1, windT, windAngT, vxT * COLS, vyT * ROWS, swirlT); render(); }
});
window.addEventListener('resize', function () { fit(); if (reduce) still(); });

fit();
if (reduce) {
  root.classList.add('is-still');
  still();
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
