<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물거품 파티클 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fp" id="fp">
  <p class="fp__hint">
    <svg class="fp__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M16 120c24-32 48-32 72 0s48 32 72 0 48-32 72 0" opacity=".25"/><path d="M16 168c24-32 48-32 72 0s48 32 72 0 48-32 72 0" opacity=".15"/><path d="M228.92 49.09a112 112 0 1 0 14 84.91a8 8 0 0 0-15.5-4a96 96 0 1 1-12-72.91A8 8 0 0 1 216 71.63V40a8 8 0 0 1-8-8h-31.63a8 8 0 0 1-5.65-13.09ZM64 104a12 12 0 1 1 12 12a12 12 0 0 1-12-12m40 64a12 12 0 1 1 12 12a12 12 0 0 1-12-12m72-16a16 16 0 1 1 16 16a16 16 0 0 1-16-16" opacity=".9"/></g></svg>
    <span>격자 셀마다 거품 밀도를 계산합니다 — 좌표를 다시 뽑지 않고 태어난 칸에서 수명을 셉니다. 바람을 세게 불어보세요</span>
  </p>
  <div class="fp__field fp__grid-cell" id="field" role="application" aria-label="물거품 파티클 실험판" tabindex="0">
    <canvas class="fp__cv" id="cv"></canvas>
    <b class="fp__badge" aria-hidden="true"><span class="fp__badgeNum" id="foamVal">거품 0</span><span class="fp__badgeUnit" id="windVal">바람 1.0</span></b>
  </div>
</div>
</main>
<script>
// 물거품 파티클(격자 셀 기반) — 01 과 같은 뿌리(정현파 6개 mulberry32(7))의 2D 파도장에서
// 크레스트(문턱 넘는 칸)를 오일러 관점으로 스캔한다. 개별 파티클 좌표를 매 프레임 새로 뽑지 않고,
// "이 거품이 어느 격자 셀(grid-cell)에서 태어났는가"(cellId)로 밀도(density[cellId])와 수명(life[cellId])을
// 저장해 크레스트에서 발생 → 성장 → 파도 위상을 따라 흐름 이동 → 소멸하는 오일러 필드를 만든다.
// 포인터로 "바람"을 불면 발생량(spawn rate)이 커진다.
var root = document.getElementById('fp');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var foamVal = document.getElementById('foamVal');
var windVal = document.getElementById('windVal');
var ctx = cv.getContext('2d');

var css = getComputedStyle(root);
function v(name) { return css.getPropertyValue(name).trim(); }
var SEA0 = v('--sea0'), SEA1 = v('--sea1');   // 바탕 바다색 램프
var FOAM0 = v('--foam0'), FOAM1 = v('--foam1'); // 거품 밀도 낮음→높음 램프(크림 계열)

var COLS = 90;    // 오일러 격자 가로 칸 수 — 저해상 셀(파티클 좌표 아님)
var STEP = 4;     // 격자 한 칸이 렌더 버퍼에서 차지하는 픽셀
var NW = 6;       // 겹칠 정현파 개수(공통 물리, 01 과 동일 뿌리)
var LIFE_MAX = 26; // 거품 한 점의 최대 수명(프레임 단위 근사 — 시간 dt 로 감쇠)

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    var u = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((u ^ (u >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(7);
var rngSpawn = mulberry32(19);   // 발생 판정 전용 — 파도장 시드와 분리(같은 시드를 재사용하면 상관이 생긴다)

var WAVES = [];
(function () {
  var lam = 34;
  for (var i = 0; i < NW; i++) {
    var ang = rng() * Math.PI * 2;
    WAVES.push({
      lam: lam,
      freq: (Math.PI * 2) / lam,
      dirX: Math.cos(ang), dirY: Math.sin(ang),
      amp: 0.58 / (i * 0.62 + 1),
      spd: 0.55 + rng() * 0.25,
      ph: rng() * Math.PI * 2
    });
    lam *= 0.55;
  }
})();
for (var w = 0; w < NW; w++) {
  WAVES[w].om = WAVES[w].spd * 3.6 * Math.sqrt(1 / WAVES[w].lam) * 6;
}

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1, ROWS = 0;
var hgt = null;     // 파도장 높이(Float32Array)
var dens = null;    // 셀별 거품 밀도(Float32Array, 0..1) — 오일러 필드 본체
var buf = null, bctx = null, out = null;
var RW = 0, RH = 0;
var raf = 0, auto = true, nowSec = 0, lastT = 0;
var wind = 1.0, windT = 1.0;
var windAng = 0.5, windAngT = 0.5;
var lastPX = -1, lastPY = -1, lastPT = 0;
var totalFoam = 0;

function hex2rgb(s) {
  var pm = /^\s*rgb\(\s*([\d.]+)%\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%\s*\)\s*$/.exec(s);
  if (pm) return [Math.round(pm[1] * 2.55), Math.round(pm[2] * 2.55), Math.round(pm[3] * 2.55)];
  s = s.replace('#', '');
  if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
  var n = parseInt(s, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
var RS0 = hex2rgb(SEA0), RS1 = hex2rgb(SEA1);
var RF0 = hex2rgb(FOAM0), RF1 = hex2rgb(FOAM1);

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ROWS = Math.max(30, Math.round(COLS * H / W));
  var n = COLS * ROWS;
  hgt = new Float32Array(n);
  dens = new Float32Array(n);
  RW = COLS * STEP; RH = ROWS * STEP;
  buf = document.createElement('canvas');
  buf.width = RW; buf.height = RH;
  bctx = buf.getContext('2d');
  out = bctx.createImageData(RW, RH);
}

// 파도장 높이 합성 — 01 과 같은 뿌리
function fieldcalc(t, wstr, wang) {
  var i = 0;
  for (var y = 0; y < ROWS; y++) {
    for (var x = 0; x < COLS; x++, i++) {
      var h = 0;
      for (var w2 = 0; w2 < NW; w2++) {
        var WV = WAVES[w2];
        var da = wang * 0.5;
        var dx = WV.dirX * Math.cos(da) - WV.dirY * Math.sin(da);
        var dy = WV.dirX * Math.sin(da) + WV.dirY * Math.cos(da);
        var ph = (x * dx + y * dy) * WV.freq * 0.62 + t * WV.om + WV.ph;
        h += WV.amp * wstr * Math.sin(ph);
      }
      hgt[i] = h;
    }
  }
}

// 거품 오일러 스텝 — 셀마다: (1) 크레스트면 발생 확률로 밀도를 채운다(spawn),
// (2) 파도 위상 방향으로 밀도를 옆 셀에 조금 옮긴다(advect — 흐름 이동, 개별 좌표 추적 아님),
// (3) 전체를 지수 감쇠시켜 수명이 다한 거품이 자연히 사라지게 한다.
var densNext = null;
function foamStep(dt, wstr, wang) {
  if (!densNext || densNext.length !== dens.length) densNext = new Float32Array(dens.length);
  var eff = 0;
  for (var i = 0; i < NW; i++) eff += WAVES[i].amp;
  eff *= wstr;
  var cut = eff * 0.74;                       // 크레스트 문턱(03 과 같은 비율대)
  var spawnRate = 0.10 + Math.min(0.55, (wstr - 0.6) * 0.28); // 바람이 셀수록 발생량 ↑
  var decay = Math.exp(-dt * (1000 / LIFE_MAX) * 0.06);       // 수명 감쇠(지수)
  var flowX = Math.cos(windAng) * 0.9, flowY = Math.sin(windAng) * 0.9;
  var total = 0;
  for (var y = 0; y < ROWS; y++) {
    var row = y * COLS;
    for (var x = 0; x < COLS; x++) {
      var idx = row + x;
      // advect — 위상 흐름 반대 방향(이전 위치)에서 밀도를 끌어와 이 셀에 놓는다(semi-Lagrangian 근사)
      var sx = x - flowX, sy = y - flowY;
      var ix = Math.round(sx), iy = Math.round(sy);
      if (ix < 0) ix = 0; else if (ix >= COLS) ix = COLS - 1;
      if (iy < 0) iy = 0; else if (iy >= ROWS) iy = ROWS - 1;
      var carried = dens[iy * COLS + ix] * decay;
      // spawn — 크레스트 셀만 결정적 난수로 발생 판정(같은 셀·같은 프레임은 같은 판정 — 시드 고정)
      if (hgt[idx] > cut) {
        var r = rngSpawn();
        if (r < spawnRate) carried = Math.min(1, carried + 0.55 + r * 0.4);
      }
      densNext[idx] = carried;
      total += carried;
    }
  }
  var tmp = dens; dens = densNext; densNext = tmp;
  totalFoam = total;
}

// 렌더 — 바탕 바다색(높이 낮은 대비) 위에 거품 밀도를 크림 램프로 얹는다. 밀도가 진할수록 불투명.
function render() {
  var o = out.data;
  for (var y = 0; y < ROWS; y++) {
    var row = y * COLS;
    for (var x = 0; x < COLS; x++) {
      var idx = row + x;
      var u = hgt[idx] * 0.7 + 0.5;
      if (u < 0) u = 0; else if (u > 1) u = 1;
      var r = RS0[0] + (RS1[0] - RS0[0]) * u;
      var g = RS0[1] + (RS1[1] - RS0[1]) * u;
      var b = RS0[2] + (RS1[2] - RS0[2]) * u;
      var f = dens[idx];
      if (f > 0.02) {
        if (f > 1) f = 1;
        var fr = RF0[0] + (RF1[0] - RF0[0]) * f;
        var fg = RF0[1] + (RF1[1] - RF0[1]) * f;
        var fb = RF0[2] + (RF1[2] - RF0[2]) * f;
        r = r * (1 - f) + fr * f;
        g = g * (1 - f) + fg * f;
        b = b * (1 - f) + fb * f;
      }
      for (var sy = 0; sy < STEP; sy++) {
        var base = ((y * STEP + sy) * RW + x * STEP) * 4;
        for (var sx2 = 0; sx2 < STEP; sx2++, base += 4) {
          o[base] = r;
          o[base + 1] = g;
          o[base + 2] = b;
          o[base + 3] = 255;
        }
      }
    }
  }
  bctx.putImageData(out, 0, 0);
  ctx.drawImage(buf, 0, 0, W, H);
}

function frame(now) {
  nowSec = now / 1000;
  var dt = lastT ? (now - lastT) : 16.7;
  lastT = now;
  if (auto) {
    var th = nowSec * 0.31;
    windT = 1.05 + Math.sin(th * 0.9 + 0.4) * 0.55 + Math.sin(th * 2.3) * 0.12;
    windAngT = 0.5 + Math.sin(th * 0.42) * 0.85;
  }
  wind += (windT - wind) * 0.05;
  windAng += (windAngT - windAng) * 0.05;
  fieldcalc(nowSec, wind, windAng);
  foamStep(dt, wind, windAng);
  render();
  foamVal.textContent = '거품 ' + Math.round(totalFoam);
  windVal.textContent = '바람 ' + wind.toFixed(2);
  raf = requestAnimationFrame(frame);
}

// 정지판 — 발생·감쇠를 몇 스텝 미리 돌려 거품이 이미 자란 정적 한 장을 만든다(빈 바다가 아니다)
function still() {
  fieldcalc(7.3, 1.35, 0.5);
  windAng = 0.5;
  for (var k = 0; k < 40; k++) foamStep(33, 1.35, 0.5);
  render();
}

function localXY(e) {
  var r = field.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

field.addEventListener('pointermove', function (e) {
  var p = localXY(e);
  var t = performance.now();
  if (lastPX >= 0 && t > lastPT) {
    var vx = p[0] - lastPX, vy = p[1] - lastPY;
    var sp2 = Math.sqrt(vx * vx + vy * vy);
    if (sp2 > 0.5) {
      windT = Math.max(0.35, Math.min(2.1, 0.9 + sp2 * 0.02));
      windAngT = Math.atan2(vy, vx) * 0.16;
    }
  }
  lastPX = p[0]; lastPY = p[1]; lastPT = t;
  auto = false;
});
field.addEventListener('pointerleave', function () {
  auto = true;
  lastPX = -1;
});
field.addEventListener('keydown', function (e) {
  var d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!d) return;
  e.preventDefault();
  auto = false;
  windT = Math.max(0.35, Math.min(2.1, windT + d[0] * 0.18));
  windAngT = windAngT + d[1] * 0.1;
  if (reduce) { fieldcalc(nowSec || 3.1, windT, windAngT); foamStep(33, windT, windAngT); render(); }
});
window.addEventListener('resize', function () { fit(); if (reduce) still(); });

fit();
if (reduce) {
  root.classList.add('is-still');
  still();
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
