<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>깊이별 감쇠 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="da" id="da">
  <p class="da__hint">
    <svg class="da__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M16 120c24-32 48-32 72 0s48 32 72 0 48-32 72 0" opacity=".25"/><path d="M16 168c24-32 48-32 72 0s48 32 72 0 48-32 72 0" opacity=".15"/><path d="M228.92 49.09a112 112 0 1 0 14 84.91a8 8 0 0 0-15.5-4a96 96 0 1 1-12-72.91A8 8 0 0 1 216 71.63V40a8 8 0 0 1-8-8h-31.63a8 8 0 0 1-5.65-13.09ZM64 104a12 12 0 1 1 12 12a12 12 0 0 1-12-12m40 64a12 12 0 1 1 12 12a12 12 0 0 1-12-12m72-16a16 16 0 1 1 16 16a16 16 0 0 1-16-16" opacity=".9"/></g></svg>
    <span>Every pixel below the surface attenuates by depth exponentially — a shallow-sea cross-section computed from scratch; move the mouse to stir the water</span>
  </p>
  <div class="da__field" id="field" role="application" aria-label="Depth attenuation cross-section playground" tabindex="0">
    <canvas class="da__cv" id="cv"></canvas>
    <b class="da__badge" aria-hidden="true"><span class="da__badgeNum" id="attenVal">depth x0.06</span><span class="da__badgeUnit" id="windVal">wind 1.0</span></b>
  </div>
</div>
</main>
<script>
// 깊이별 감쇠 — 얕은 물빛 단면. 01 과 같은 뿌리(정현파 6개 mulberry32(7))를 1D 로 읽어
// 수면선 높이를 구하고, 그 선 아래 픽셀마다 수심 d = y - surfaceY 에 exp(-감쇠계수*d) 를
// 적용해 민트(얕음)→라일락 하늘빛→파랑→진한 파랑(깊음) 4단 램프로 섞는다. 바닥 20px 은 크림 모래.
// 감쇠계수 자체도 바람이 세질수록 커져(물이 흐려져) 얕은 색이 더 빨리 사라진다.
var root = document.getElementById('da');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var attenVal = document.getElementById('attenVal');
var windVal = document.getElementById('windVal');
var ctx = cv.getContext('2d');

var css = getComputedStyle(root);
function v(name) { return css.getPropertyValue(name).trim(); }
var C0 = v('--c0'), C1 = v('--c1'); // 얕음 — 민트 → 하늘
var T1 = v('--t1'), T0 = v('--t0'); // 깊음 — 파랑 → 진한 파랑
var SAND = v('--sand');

var COLS = 160;   // 1D 수면 곡선 표본 수 — 가로 해상도
var STEP = 3;     // 격자 한 칸이 렌더 버퍼에서 차지하는 픽셀 → RW = 480
var NW = 6;       // 겹칠 정현파 개수(공통 물리)
var SAND_PX = 20; // 바닥 모래 두께(버퍼 기준 px)

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    var u = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((u ^ (u >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(7);

var WAVES = [];
(function () {
  var lam = 34;
  for (var i = 0; i < NW; i++) {
    var ang = rng() * Math.PI * 2;
    WAVES.push({
      lam: lam,
      freq: (Math.PI * 2) / lam,
      dirX: Math.cos(ang), dirY: Math.sin(ang),
      amp: 0.58 / (i * 0.62 + 1),
      spd: 0.55 + rng() * 0.25,
      ph: rng() * Math.PI * 2
    });
    lam *= 0.55;
  }
})();
for (var w = 0; w < NW; w++) {
  WAVES[w].om = WAVES[w].spd * 3.6 * Math.sqrt(1 / WAVES[w].lam) * 6;
}
var AMP_SUM = 0;
for (var w2 = 0; w2 < NW; w2++) AMP_SUM += WAVES[w2].amp;

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1;
var surf = null;              // 1D 수면 높이(버퍼 px, Float32Array)
var buf = null, bctx = null, out = null;
var RW = 480, RH = 160;
var raf = 0, auto = true, nowSec = 0;
var wind = 1.0, windT = 1.0;
var windAng = 0.5, windAngT = 0.5;
var lastPX = -1, lastPY = -1, lastPT = 0;

function hex2rgb(s) {
  var pm = /^\s*rgb\(\s*([\d.]+)%\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%\s*\)\s*$/.exec(s);
  if (pm) return [Math.round(pm[1] * 2.55), Math.round(pm[2] * 2.55), Math.round(pm[3] * 2.55)];
  s = s.replace('#', '');
  if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
  var n = parseInt(s, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
var RC0 = hex2rgb(C0), RC1 = hex2rgb(C1);
var RT1 = hex2rgb(T1), RT0 = hex2rgb(T0);
var RSAND = hex2rgb(SAND);

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  surf = new Float32Array(COLS);
  buf = document.createElement('canvas');
  buf.width = RW; buf.height = RH;
  bctx = buf.getContext('2d');
  out = bctx.createImageData(RW, RH);
}

// 1D 수면 곡선 — height(x,t) = Σ amp·sin(x·dirX·freq·0.62 + t·ω + φ). y 항은 0 고정(단면이라 깊이 축이 없다)
function surfcalc(t, wstr, wang) {
  for (var x = 0; x < COLS; x++) {
    var h = 0;
    for (var w3 = 0; w3 < NW; w3++) {
      var WV = WAVES[w3];
      var da = wang * 0.5;
      var dx = WV.dirX * Math.cos(da) - WV.dirY * Math.sin(da);
      var ph = (x * dx) * WV.freq * 0.62 + t * WV.om + WV.ph;
      h += WV.amp * wstr * Math.sin(ph);
    }
    surf[x] = h;
  }
}

// 렌더 — 수면선 위는 투명(카드 배경이 하늘), 아래는 수심 d 에 지수 감쇠로 4단 램프.
// attenK 는 바람이 세질수록 커진다(흐려진 물이 색을 더 빨리 삼킨다).
function render(attenK) {
  var o = out.data;
  var baseline = RH * 0.4;   // 수면 중심선(버퍼 px)
  var ampPx = RH * 0.34;     // 수면 진폭(버퍼 px) — surf 값(대략 -0.75..0.75) 스케일
  for (var cx = 0; cx < COLS; cx++) {
    var surfaceY = baseline + surf[cx] * ampPx;
    if (surfaceY < 0) surfaceY = 0; else if (surfaceY > RH - 2) surfaceY = RH - 2;
    for (var sx = 0; sx < STEP; sx++) {
      var px = cx * STEP + sx;
      for (var y = 0; y < RH; y++) {
        var base = (y * RW + px) * 4;
        if (y < surfaceY) {
          o[base] = 0; o[base + 1] = 0; o[base + 2] = 0; o[base + 3] = 0;   // 물 위 — 투명(카드 배경이 하늘)
          continue;
        }
        if (y >= RH - SAND_PX) {
          o[base] = RSAND[0]; o[base + 1] = RSAND[1]; o[base + 2] = RSAND[2]; o[base + 3] = 255;
          continue;
        }
        var d = y - surfaceY;
        var u = 1 - Math.exp(-attenK * d);   // 0(얕음)..1(깊음), 클램프
        if (u < 0) u = 0; else if (u > 1) u = 1;
        // 4단 램프 — C0(민트,얕음) → C1(하늘) → T1(파랑) → T0(진한 파랑,깊음). 전 구간을 다 쓴다.
        var r, g, b;
        if (u < 1 / 3) {
          var k = u * 3;
          r = RC0[0] + (RC1[0] - RC0[0]) * k; g = RC0[1] + (RC1[1] - RC0[1]) * k; b = RC0[2] + (RC1[2] - RC0[2]) * k;
        } else if (u < 2 / 3) {
          var k2 = (u - 1 / 3) * 3;
          r = RC1[0] + (RT1[0] - RC1[0]) * k2; g = RC1[1] + (RT1[1] - RC1[1]) * k2; b = RC1[2] + (RT1[2] - RC1[2]) * k2;
        } else {
          var k3 = (u - 2 / 3) * 3;
          r = RT1[0] + (RT0[0] - RT1[0]) * k3; g = RT1[1] + (RT0[1] - RT1[1]) * k3; b = RT1[2] + (RT0[2] - RT1[2]) * k3;
        }
        o[base] = r; o[base + 1] = g; o[base + 2] = b; o[base + 3] = 255;
      }
    }
  }
  bctx.putImageData(out, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(buf, 0, 0, W, H);
}

function frame(now) {
  nowSec = now / 1000;
  if (auto) {
    var th = nowSec * 0.31;
    windT = 1.05 + Math.sin(th * 0.9 + 0.4) * 0.55 + Math.sin(th * 2.3) * 0.12;
    windAngT = 0.5 + Math.sin(th * 0.42) * 0.85;
  }
  wind += (windT - wind) * 0.05;
  windAng += (windAngT - windAng) * 0.05;
  surfcalc(nowSec, wind, windAng);
  var attenK = 0.045 + (wind / (AMP_SUM * 3)) * 0.03;   // 바람이 세질수록 감쇠가 커진다
  render(attenK);
  attenVal.textContent = 'depth x' + attenK.toFixed(3);
  windVal.textContent = 'wind ' + wind.toFixed(2);
  raf = requestAnimationFrame(frame);
}

function still() {
  surfcalc(7.3, 1.35, 0.5);
  render(0.06);
}

function localXY(e) {
  var r = field.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

field.addEventListener('pointermove', function (e) {
  var p = localXY(e);
  var t = performance.now();
  if (lastPX >= 0 && t > lastPT) {
    var vx = p[0] - lastPX, vy = p[1] - lastPY;
    var sp2 = Math.sqrt(vx * vx + vy * vy);
    if (sp2 > 0.5) {
      windT = Math.max(0.35, Math.min(2.1, 0.9 + sp2 * 0.02));
      windAngT = Math.atan2(vy, vx) * 0.16;
    }
  }
  lastPX = p[0]; lastPY = p[1]; lastPT = t;
  auto = false;
});
field.addEventListener('pointerleave', function () {
  auto = true;
  lastPX = -1;
});
field.addEventListener('keydown', function (e) {
  var d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!d) return;
  e.preventDefault();
  auto = false;
  windT = Math.max(0.35, Math.min(2.1, windT + d[0] * 0.18));
  windAngT = windAngT + d[1] * 0.1;
  if (reduce) {
    surfcalc(nowSec || 3.1, windT, windAngT);
    render(0.045 + (windT / (AMP_SUM * 3)) * 0.03);
  }
});
window.addEventListener('resize', function () { fit(); if (reduce) still(); });

fit();
if (reduce) {
  root.classList.add('is-still');
  still();
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
