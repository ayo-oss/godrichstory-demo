<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back to top — smooth anchor via scroll-behavior</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="mini-page" aria-hidden="true">
    <div class="mini-page__track is-demo">
      <span id="mp-top" class="mini-page__line mini-page__line--mark"></span>
      <span class="mini-page__line"></span>
      <span class="mini-page__line"></span>
      <span class="mini-page__line"></span>
      <span class="mini-page__line"></span>
      <span class="mini-page__line"></span>
    </div>
  </div>
  <a href="#mp-top" class="totop" aria-label="Lên đầu trang">
    <svg class="totop__arrow" viewBox="0 0 24 24" aria-hidden="true"><polyline points="5,15 12,8 19,15"/></svg>
  </a>
</main>
</body>
</html>
