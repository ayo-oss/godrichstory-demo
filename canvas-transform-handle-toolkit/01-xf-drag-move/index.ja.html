<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ハンドル不要でオブジェクトごとドラッグ移動 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="scene is-demo" id="scene">
  <div class="grid" aria-hidden="true"></div>
  <div class="draggable" id="draggable" tabindex="0" aria-label="ドラッグして移動">
    <div class="selectBox">
      <div class="subjectShape"></div>
    </div>
  </div>
  <div class="readout" id="readout" aria-hidden="true">X <span id="rx">0</span> · Y <span id="ry">0</span></div>
</div>
</main>
<script>
(function () {
  var WAYPOINTS = [
    { x: 0, y: 0 },
    { x: 92, y: -38 },
    { x: -70, y: 30 },
    { x: 0, y: 0 }
  ];
  var HOP_MS = 640;
  var HOLD_MS = 380;

  var scene = document.getElementById('scene');
  var el = document.getElementById('draggable');
  var rx = document.getElementById('rx');
  var ry = document.getElementById('ry');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var tx = 0, ty = 0;
  var dragging = false;
  var startX = 0, startY = 0, originTx = 0, originTy = 0;
  var timers = [];

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  // 포인터 델타 → translate 행렬. matrix(1,0,0,1,tx,ty) 가 곧 순수 이동 행렬이다.
  function applyTransform(nx, ny) {
    tx = nx; ty = ny;
    el.style.transform = 'matrix(1,0,0,1,' + tx.toFixed(1) + ',' + ty.toFixed(1) + ')';
    rx.textContent = Math.round(tx);
    ry.textContent = Math.round(ty);
  }

  function human() {
    if (scene.classList.contains('is-demo')) {
      scene.classList.remove('is-demo');
      timers.forEach(function (t) { clearTimeout(t); clearInterval(t); });
      timers = [];
    }
  }

  function onPointerDown(e) {
    human();
    dragging = true;
    el.setPointerCapture(e.pointerId);
    startX = e.clientX; startY = e.clientY;
    originTx = tx; originTy = ty;
    el.classList.add('isDragging');
  }
  function onPointerMove(e) {
    if (!dragging) return;
    var dx = e.clientX - startX;
    var dy = e.clientY - startY;
    applyTransform(clamp(originTx + dx, -110, 110), clamp(originTy + dy, -55, 55));
  }
  function onPointerUp(e) {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('isDragging');
    try { el.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  function onKeydown(e) {
    var step = e.shiftKey ? 10 : 1;
    if (e.key === 'ArrowLeft') { human(); applyTransform(clamp(tx - step, -110, 110), ty); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { human(); applyTransform(clamp(tx + step, -110, 110), ty); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { human(); applyTransform(tx, clamp(ty - step, -55, 55)); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { human(); applyTransform(tx, clamp(ty + step, -55, 55)); e.preventDefault(); }
  }

  el.addEventListener('pointerdown', onPointerDown);
  el.addEventListener('pointermove', onPointerMove);
  el.addEventListener('pointerup', onPointerUp);
  el.addEventListener('pointercancel', onPointerUp);
  el.addEventListener('keydown', onKeydown);

  // reduce: 실사용 경로 적용 — 포인터·키보드 이동은 위 리스너가 그대로 처리한다(트윈 없이 즉시 반영).
  // 아래 hopTo()·cycle() 은 시연 게이트만 — reduce 에서는 돌지 않는다.
  function hopTo(target, onDone) {
    var fromTx = tx, fromTy = ty;
    var start = performance.now();
    function frame(now) {
      if (!scene.classList.contains('is-demo')) return;
      var p = clamp((now - start) / HOP_MS, 0, 1);
      var e = easeOutCubic(p);
      applyTransform(fromTx + (target.x - fromTx) * e, fromTy + (target.y - fromTy) * e);
      if (p < 1) requestAnimationFrame(frame);
      else if (onDone) onDone();
    }
    requestAnimationFrame(frame);
  }

  function cycle(i) {
    if (!scene.classList.contains('is-demo')) return;
    var next = WAYPOINTS[i % WAYPOINTS.length];
    hopTo(next, function () {
      timers.push(setTimeout(function () { cycle(i + 1); }, HOLD_MS));
    });
  }

  if (!reduce) {
    cycle(1);
  }
})();
</script>
</body>
</html>
