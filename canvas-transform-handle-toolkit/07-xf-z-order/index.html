<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>겹친 오브젝트를 한 칸씩 앞뒤로 보내는 순서 조정 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="scene is-demo" id="scene">
  <div class="frame" id="frame">
    <div class="card" data-id="0" tabindex="0" role="button" aria-label="카드 1 선택"></div>
    <div class="card" data-id="1" tabindex="0" role="button" aria-label="카드 2 선택"></div>
    <div class="card" data-id="2" tabindex="0" role="button" aria-label="카드 3 선택"></div>
    <div class="card" data-id="3" tabindex="0" role="button" aria-label="카드 4 선택"></div>
  </div>
  <div class="controls">
    <button type="button" class="orderBtn" id="btnBack">뒤로</button>
    <button type="button" class="orderBtn" id="btnFront">앞으로</button>
  </div>
  <div class="status" id="status" aria-live="polite">순서 0 1 2 3</div>
</div>
</main>
<script>
(function () {
  var POP_MS = 360;
  var LOOP_MS = 1000;

  var scene = document.getElementById('scene');
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var btnFront = document.getElementById('btnFront');
  var btnBack = document.getElementById('btnBack');
  var status = document.getElementById('status');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // order: 뒤(0번째)→앞(마지막) 순으로 쌓인 카드 id 배열. z-index 는 이 배열 안의 위치(index+1)로만 정해진다.
  var order = [0, 1, 2, 3];
  var selectedId = 1;
  var popRaf = 0;
  var timers = [];

  function easeOutBack(t) {
    var c = 1.7;
    return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
  }

  function applyZ() {
    cards.forEach(function (card) {
      var id = Number(card.dataset.id);
      var z = order.indexOf(id) + 1;
      card.style.zIndex = String(z);
      card.classList.toggle('isSelected', id === selectedId);
      card.setAttribute('aria-pressed', String(id === selectedId));
    });
    status.textContent = '순서 ' + order.join(' ');
  }

  // 배열 재정렬 → z-index: 선택된 id 를 order 배열 안에서 한 칸 옮기고, 그 배열의 위치를 그대로
  // z-index 로 다시 매긴다. 스타일 값을 직접 고르는 게 아니라 배열 연산의 결과로 z 가 나온다.
  function swapNeighbor(dir) {
    var idx = order.indexOf(selectedId);
    var next = idx + dir;
    if (next < 0 || next >= order.length) return;
    var tmp = order[idx];
    order[idx] = order[next];
    order[next] = tmp;
    applyZ();
    popCard(cards[selectedId]);
  }

  function bringToFront(id) {
    var idx = order.indexOf(id);
    order.splice(idx, 1);
    order.push(id);
    selectedId = id;
    applyZ();
    popCard(cards[selectedId]);
  }

  // 앞으로 온 카드가 살짝 들렸다 앉는 팝: z 변화를 눈에 보이게 하는 산술 트윈(easeOutBack 오버슛).
  function popCard(card) {
    if (popRaf) cancelAnimationFrame(popRaf);
    var start = performance.now();
    function step(now) {
      var p = Math.min(1, (now - start) / POP_MS);
      var lift = (1 - Math.abs(2 * p - 1)) * 0.1;
      card.style.setProperty('--lift', lift.toFixed(3));
      if (p < 1) popRaf = requestAnimationFrame(step);
      else { card.style.setProperty('--lift', '0'); popRaf = 0; }
    }
    popRaf = requestAnimationFrame(step);
  }

  function human() {
    if (scene.classList.contains('is-demo')) {
      scene.classList.remove('is-demo');
      timers.forEach(function (t) { clearTimeout(t); clearInterval(t); });
      timers = [];
      if (popRaf) { cancelAnimationFrame(popRaf); popRaf = 0; }
    }
  }

  function selectCard(id) {
    human();
    selectedId = id;
    applyZ();
  }

  cards.forEach(function (card) {
    var id = Number(card.dataset.id);
    card.addEventListener('click', function () { selectCard(id); });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectCard(id); }
    });
  });

  btnFront.addEventListener('click', function () { human(); swapNeighbor(1); });
  btnBack.addEventListener('click', function () { human(); swapNeighbor(-1); });

  applyZ();

  // reduce: 실사용 경로 적용 — 카드 선택·앞으로/뒤로 버튼은 applyZ() 로 즉시 반영된다(팝은 계산 트윈이라 즉시 최종 상태).
  // 아래 자동 루프는 시연 게이트만 — 정해진 순서로 카드를 차례로 맨 앞에 올리며 reduce 에서는 돌지 않는다.
  var SEQUENCE = [0, 2, 1, 3];
  var seqI = 0;
  function loop() {
    if (!scene.classList.contains('is-demo')) return;
    seqI = (seqI + 1) % SEQUENCE.length;
    bringToFront(SEQUENCE[seqI]);
    timers.push(setTimeout(loop, LOOP_MS));
  }

  if (!reduce) {
    timers.push(setTimeout(loop, LOOP_MS));
  }
})();
</script>
</body>
</html>
