<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선택 영역만 잘라 PNG로 내보내는 패널 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="scene is-demo" id="scene">
  <div class="frame">
    <div class="subjectShape" id="subject"></div>
  </div>
  <div class="exportPanel">
    <canvas id="canvas" width="96" height="96" class="exportCanvas" aria-hidden="true"></canvas>
    <div class="previewBox">
      <img id="preview" class="previewImg" alt="내보낸 PNG 미리보기" />
    </div>
    <button type="button" class="exportBtn" id="exportBtn">미리보기 생성</button>
    <div class="status" id="status" aria-live="polite">대기</div>
  </div>
</div>
</main>
<script>
(function () {
  var FILL_A = '#ffb199';
  var FILL_B = '#8ec5ff';
  var ROTATE_SPEED_DEG_PER_S = 26;
  var AUTO_PREVIEW_MS = 700;

  var scene = document.getElementById('scene');
  var subject = document.getElementById('subject');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var img = document.getElementById('preview');
  var btn = document.getElementById('exportBtn');
  var status = document.getElementById('status');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var angle = 0, scale = 1;
  var rafId = null;
  var timers = [];

  function roundedRectPath(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // 오브젝트를 canvas.toDataURL 로 내보내기: 화면의 subjectShape 와 같은 회전·비율을 ctx 변환으로
  // 그대로 재현한 뒤(대칭 산술), roundRect 경로 + gradient 를 채우고 PNG 데이터 URL 을 만든다.
  // 실제 파일 저장·다운로드·클립보드 기록은 하지 않는다 — 미리보기 이미지 생성까지만 시뮬레이션한다.
  function generatePreview() {
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(angle * Math.PI / 180);
    ctx.scale(scale, scale);
    var grad = ctx.createLinearGradient(-34, -34, 34, 34);
    grad.addColorStop(0, FILL_A);
    grad.addColorStop(1, FILL_B);
    ctx.fillStyle = grad;
    roundedRectPath(ctx, -34, -34, 68, 68, 14);
    ctx.fill();
    ctx.restore();
    img.src = canvas.toDataURL('image/png');
    status.textContent = '생성됨';
  }

  function human() {
    if (scene.classList.contains('is-demo')) {
      scene.classList.remove('is-demo');
      timers.forEach(function (t) { clearTimeout(t); clearInterval(t); });
      timers = [];
      if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    }
  }

  btn.addEventListener('click', function () {
    human();
    generatePreview();
  });

  // reduce: 실사용 경로 적용 — 버튼 클릭 시 generatePreview() 는 현재 각도·비율을 그대로 그려
  // 트윈 없이 즉시 PNG 를 만든다. 아래 ambient()/자동 미리보기는 시연 게이트만이며 reduce 에서는 돌지 않는다.
  function ambient(now) {
    if (!scene.classList.contains('is-demo')) return;
    var t = now / 1000;
    angle = (t * ROTATE_SPEED_DEG_PER_S) % 360;
    scale = 1 + Math.sin(t * 1.4) * 0.12;
    subject.style.transform = 'rotate(' + angle.toFixed(1) + 'deg) scale(' + scale.toFixed(3) + ')';
    rafId = requestAnimationFrame(ambient);
  }

  function autoPreviewLoop() {
    if (!scene.classList.contains('is-demo')) return;
    generatePreview();
    timers.push(setTimeout(autoPreviewLoop, AUTO_PREVIEW_MS));
  }

  generatePreview();
  if (!reduce) {
    rafId = requestAnimationFrame(ambient);
    timers.push(setTimeout(autoPreviewLoop, AUTO_PREVIEW_MS));
  }
})();
</script>
</body>
</html>
