<script>
// 실제 동작: 연락처 보기/앞면 보기가 rotateY 플립을 토글하고, 안 보이는 면은 키보드 초점이 가지 않게 막는다.
var root = document.querySelector('.fc');
var inner = document.getElementById('fc-inner');
var front = document.getElementById('fc-front');
var back = document.getElementById('fc-back');
var flip = document.getElementById('fc-flip');
var unflip = document.getElementById('fc-unflip');
var follow = document.getElementById('fc-follow');
function setBack(on) {
  inner.classList.toggle('is-back', on);
  flip.setAttribute('aria-pressed', String(on));
  unflip.setAttribute('aria-pressed', String(!on));
  front.setAttribute('aria-hidden', on ? 'true' : 'false');
  back.setAttribute('aria-hidden', on ? 'false' : 'true');
  front.querySelectorAll('button').forEach(function (b) {
    if (on) { b.setAttribute('tabindex', '-1'); } else { b.removeAttribute('tabindex'); }
  });
  back.querySelectorAll('button').forEach(function (b) {
    if (on) { b.removeAttribute('tabindex'); } else { b.setAttribute('tabindex', '-1'); }
  });
}
flip.addEventListener('click', function () { setBack(true); flip.blur(); });
unflip.addEventListener('click', function () { setBack(false); unflip.blur(); });
follow.addEventListener('click', function () {
  var on = follow.getAttribute('aria-pressed') !== 'true';
  follow.setAttribute('aria-pressed', String(on));
  follow.classList.toggle('is-on', on);
});
['pointerdown', 'click', 'keydown'].forEach(function (ev) {
  root.addEventListener(ev, function () { root.classList.remove('is-demo'); });
});
</script>
</body>
</html>
