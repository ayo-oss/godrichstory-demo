<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>複数ファイルをドロップ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mf" id="mf">
  <p class="mf__hint" id="mfHint">ドロップされた個数を数えて埋まった枠・空き枠・超過分を計算します — 最大6枠</p>
  <div class="mf__zone" id="mfZone" role="button" tabindex="0" aria-describedby="mfHint" aria-label="複数ファイルドロップゾーン">
    <input type="file" id="mfInput" multiple class="mf__file" aria-label="ファイルを選択">
    <svg class="mf__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M208 72v112a8 8 0 0 1-8 8h-24v-88l-40-40H80V40a8 8 0 0 1 8-8h80Z" opacity=".2"/><path d="m213.66 66.34l-40-40A8 8 0 0 0 168 24H88a16 16 0 0 0-16 16v16H56a16 16 0 0 0-16 16v144a16 16 0 0 0 16 16h112a16 16 0 0 0 16-16v-16h16a16 16 0 0 0 16-16V72a8 8 0 0 0-2.34-5.66M168 216H56V72h76.69L168 107.31zm32-32h-16v-80a8 8 0 0 0-2.34-5.66l-40-40A8 8 0 0 0 136 56H88V40h76.69L200 75.31Zm-56-32a8 8 0 0 1-8 8H88a8 8 0 0 1 0-16h48a8 8 0 0 1 8 8m0 32a8 8 0 0 1-8 8H88a8 8 0 0 1 0-16h48a8 8 0 0 1 8 8"/></g></svg>
    <span class="mf__over-flag" id="mfOverFlag" aria-live="polite">2件超過</span>
  </div>
  <ul class="mf__slots" id="mfSlots" aria-live="polite"></ul>
  <div class="mf__meta">
    <span class="mf__tag" id="mfTag">files.length 0 / 6</span>
    <span class="mf__unit" id="mfRemain">空き 6 · 超過 0</span>
  </div>
  <ul class="mf__pile" id="mfPile"></ul>
</div>
</main>
<script>
// 다중 파일(03) — DataTransfer.files 를 Array.from 으로 배열로 펼쳐 length 로 개수를 세고,
// 고정 칸 수(6)에서 채워진 칸을 빼 남은 칸을 계산해 빈 칸에만 점선을 남긴다. 최대를 넘는 파일은
// 잘리지 않고 'N件超過' 안내와 함께 그리드 바깥에 따로 쌓는다. 카운터 계산이 이 데모의 축이다.
(function () {
  var zone = document.getElementById('mfZone');
  var input = document.getElementById('mfInput');
  var slotsEl = document.getElementById('mfSlots');
  var pileEl = document.getElementById('mfPile');
  var tagEl = document.getElementById('mfTag');
  var remainEl = document.getElementById('mfRemain');
  var overFlag = document.getElementById('mfOverFlag');
  if (!zone || !input || !slotsEl || !pileEl || !tagEl || !remainEl || !overFlag) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var MAX = 6;                 // 고정 칸 수 — 06 칸은 문구·계산 전부 이 상수에서 나온다
  var NAMES = ['sky-01.png', 'sea-02.jpg', 'forest-03.png', 'desert-04.jpg', 'snow-05.png', 'volcano-06.jpg',
               'lake-07.png', 'city-08.jpg'];
  var TYPES = ['image/png', 'image/jpeg'];
  var HEXES = ['#d6e1eb', '#93d9c0', '#b9a0ff', '#f6c6d3', '#cfd8f5', '#f0dfae'];

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(337);

  // 가상 드롭 묶음 — 시나리오: 3개 → 5개 → 8개(2 超過). 개수별로 칸 계산이 달라진다.
  var BUNDLES = [3, 5, 8];
  var bundle = -1;
  var filled = 0;      // 지금 채워진 칸 수
  var shown = [];      // 칸에 들어간 파일 목록

  // 슬롯 DOM 을 만든다 — 空き 점선은 .is-empty
  function buildSlots() {
    slotsEl.textContent = '';
    for (var i = 0; i < MAX; i++) {
      var li = document.createElement('li');
      li.className = 'mf__slot';
      slotsEl.appendChild(li);
    }
  }
  buildSlots();

  // 계산·렌더 — files 배열 하나로 칸·超過·문구 전부를 유도한다
  function intake(files) {
    var arr = Array.from(files);                       // 유사배열 FileList → 배열
    var take = Math.min(arr.length, MAX - 0);          // 칸에 들어갈 앞부분
    shown = arr.slice(0, MAX);
    var over = arr.length - Math.min(arr.length, MAX); // 초과분 = length - MAX (양수일 때만)
    filled = shown.length;
    var empty = MAX - filled;                          // 남은 空き 계산
    var slotLis = slotsEl.children;
    for (var i = 0; i < MAX; i++) {
      var li = slotLis[i];
      li.className = 'mf__slot' + (i < filled ? '' : ' is-empty');
      li.textContent = '';
      if (i < filled) {
        var f = shown[i];
        var dot = document.createElement('span');
        dot.className = 'mf__dot';
        dot.style.background = HEXES[(i + Math.floor(rnd() * 2)) % HEXES.length];
        var nm = document.createElement('span');
        nm.className = 'mf__name';
        nm.textContent = f.name;
        li.appendChild(dot); li.appendChild(nm);
        li.style.setProperty('--i', String(i));
        if (!reduce) {
          li.style.animation = 'none';
          void li.offsetWidth;
          li.style.animation = '';
          li.classList.add('is-pop');
        }
      }
    }
    pileEl.textContent = '';
    if (over > 0) {
      overFlag.textContent = over + '件超過';
      overFlag.classList.add('is-on');
      for (var k = MAX; k < arr.length; k++) {
        var pi = document.createElement('li');
        pi.className = 'mf__piled';
        pi.textContent = arr[k].name;
        pileEl.appendChild(pi);
      }
    } else {
      overFlag.textContent = '2件超過';
      overFlag.classList.remove('is-on');
    }
    tagEl.textContent = 'files.length ' + arr.length + ' / ' + MAX;
    remainEl.textContent = '空き ' + empty + ' · 超過  ' + over;
  }

  // 가상 File 만들기 — 실제 File 객체(new File) 로 name/type/size 를 진짜로 갖게
  function virtualFiles(n) {
    var out = [];
    var start = Math.floor(rnd() * 2);
    for (var i = 0; i < n; i++) {
      try {
        out.push(new File([new Blob(['x'])], NAMES[(start + i) % NAMES.length], { type: TYPES[i % 2] }));
      } catch (e) { out.push({ name: NAMES[(start + i) % NAMES.length], type: TYPES[i % 2], size: 1024 }); }
    }
    return out;
  }

  // 실제 드롭 — 같은 intake
  zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('is-over'); });
  zone.addEventListener('dragleave', function () { zone.classList.remove('is-over'); });
  zone.addEventListener('drop', function (e) {
    e.preventDefault(); zone.classList.remove('is-over');
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) intake(e.dataTransfer.files);
  });
  input.addEventListener('change', function () {
    if (input.files && input.files.length) intake(input.files);
    input.value = '';
  });

  // 자동 시연 — 묶음 크기를 바꿔가며 드롭. 超過 계산이 번갈아 나타난다.
  if (reduce) {
    intake(virtualFiles(BUNDLES[1]));
  } else {
    var nextAt = 0;
    (function loop(now) {
      if (now >= nextAt) {
        nextAt = now + 700;
        bundle = (bundle + 1) % BUNDLES.length;
        intake(virtualFiles(BUNDLES[bundle]));
      }
      requestAnimationFrame(loop);
    })(0);
  }
})();
</script>
</body>
</html>
