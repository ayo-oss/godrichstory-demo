<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업로드 후 재정렬 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rq" id="rq">
  <p class="rq__hint" id="rqHint">읽기가 끝난 파일들은 순서를 다시 꾸릴 수 있습니다 — 포인터로 집어 옮기면 끼워 넣을 칸을 계산합니다</p>
  <div class="rq__zone" id="rqZone" role="button" tabindex="0" aria-describedby="rqHint" aria-label="파일 드롭존">
    <input type="file" id="rqInput" multiple class="rq__file" aria-label="파일 선택">
    <svg class="rq__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M208 32v192a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V32a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16" opacity=".2"/><path d="M104 60a12 12 0 1 1-12-12a12 12 0 0 1 12 12m60 12a12 12 0 1 0-12-12a12 12 0 0 0 12 12m-72 44a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12m-72 68a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg>
  </div>
  <ul class="rq__list" id="rqList" aria-label="읽기 완료 파일 목록"></ul>
  <div class="rq__meta">
    <span class="rq__tag" id="rqTag">done 0</span>
    <span class="rq__unit" id="rqUnit">order —</span>
  </div>
</div>
</main>
<script>
// 업로드 후 재정렬(09) — '읽기 완료' 상태가 된 파일 칩을 pointerdown 으로 집어 옮긴다.
// 포인터 x 와 각 칩 getBoundingClientRect().left+width/2 를 비교해 끼워 넣을 칸 인덱스를
// 계산하고, 순서 배열이 바뀌면 트랜지션으로 자리를 다시 꾸린다(FLIP: 이전·이후 위치 차이를
// transform 으로 되돌렸다 푼다). 드롭 → '읽는 중' 짧은 단계 → done 배지 → 재정렬 가능.
(function () {
  var zone = document.getElementById('rqZone');
  var input = document.getElementById('rqInput');
  var listEl = document.getElementById('rqList');
  var tagEl = document.getElementById('rqTag');
  var unitEl = document.getElementById('rqUnit');
  if (!zone || !input || !listEl || !tagEl || !unitEl) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(909);
  var HEXES = ['#d6e1eb', '#93d9c0', '#b9a0ff', '#f6c6d3', '#f0dfae'];

  var NAMES = ['cover.png', 'hero.jpg', 'shot-03.png', 'inline.gif'];
  var chips = [];      // { name, state:'reading'|'done', el }
  var order = [];      // 현재 순서(인덱스)

  // FLIP: 재배치 전 각 칩의 위치를 기억 → DOM 순서 반영 → 차이만큼 transform 되돌리기 → 풀기
  function relayout() {
    var rects = order.map(function (i) { return chips[i].el.getBoundingClientRect(); });
    order.forEach(function (i, k) { listEl.appendChild(chips[i].el); });
    order.forEach(function (i, k) {
      var now = chips[i].el.getBoundingClientRect();
      var dx = rects[k].left - now.left;
      var el = chips[i].el;
      if (!dx) return;
      if (reduce) return;
      el.style.transition = 'none';
      el.style.transform = 'translateX(' + dx + 'px)';
      void el.offsetWidth;
      el.style.transition = '';
      el.style.transform = '';
    });
    unitEl.textContent = 'order ' + order.map(function (i) { return chips[i].name; }).join(' › ');
    var done = order.filter(function (i) { return chips[i].state === 'done'; }).length;
    tagEl.textContent = 'done ' + done + '/' + chips.length;
  }

  function insertionIndex(x) {
    var idx = order.length;
    for (var k = 0; k < order.length; k++) {
      var r = chips[order[k]].el.getBoundingClientRect();
      if (x < r.left + r.width / 2) { idx = k; break; }   // 각 칸 중점과 비교
    }
    return idx;
  }

  // 칩 집기 — pointerdown 으로 시작, 움직이면 끼워 넣을 칸을 계산해 순서를 바꾼다
  function armDrag(el, self) {
    el.addEventListener('pointerdown', function (e) {
      if (chips[self] && chips[self].state !== 'done') return;   // 읽는 중엔 잠김
      el.setPointerCapture(e.pointerId);
      el.classList.add('is-drag');
      var move = function (ev) {
        var to = insertionIndex(ev.clientX);
        var from = order.indexOf(self);
        if (to !== from && to !== from + 1) {
          order.splice(from, 1);
          order.splice(to > from ? to - 1 : to, 0, self);
          relayout();
        }
      };
      var up = function () {
        el.classList.remove('is-drag');
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    });
  }

  function addChip(name) {
    if (chips.length >= 4) {
      var drop = order.shift();
      chips[drop].el.remove();
      chips[drop] = null;
    }
    var i = chips.length ? chips.length : 0;
    var li = document.createElement('li');
    li.className = 'rq__chip is-reading';
    li.setAttribute('role', 'listitem');
    var dot = document.createElement('span');
    dot.className = 'rq__dot';
    dot.style.background = HEXES[Math.floor(rnd() * HEXES.length)];
    var nm = document.createElement('span');
    nm.className = 'rq__name';
    nm.textContent = name;
    var badge = document.createElement('span');
    badge.className = 'rq__badge';
    badge.textContent = '읽는 중';
    li.appendChild(dot); li.appendChild(nm); li.appendChild(badge);
    listEl.appendChild(li);
    chips[i] = { name: name, state: 'reading', el: li };
    order.push(i);
    relayout();
    armDrag(li, i);
    var settle = function () {
      chips[i].state = 'done';
      li.classList.remove('is-reading');
      li.classList.add('is-done');
      badge.textContent = 'done';
      relayout();
    };
    if (reduce) settle();
    else setTimeout(settle, 500);
  }

  // 실제 드롭 — File 이름으로 같은 파이프라인
  zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('is-over'); });
  zone.addEventListener('dragleave', function () { zone.classList.remove('is-over'); });
  zone.addEventListener('drop', function (e) {
    e.preventDefault(); zone.classList.remove('is-over');
    var fs = e.dataTransfer && e.dataTransfer.files;
    if (fs && fs.length) {
      for (var i = 0; i < Math.min(fs.length, 2); i++) addChip(fs[i].name);
    }
  });
  input.addEventListener('change', function () {
    var fs = input.files;
    if (fs && fs.length) {
      for (var i = 0; i < Math.min(fs.length, 2); i++) addChip(fs[i].name);
    }
    input.value = '';
  });

  // 자동 시연 — 파일이 들어오고 done 이 되면 스스로 순서를 바꿔본다(같은 relayout 경로)
  if (reduce) {
    addChip(NAMES[0]); addChip(NAMES[1]);
    setTimeout(function () {
      order.reverse();
      relayout();
    }, 40);
  } else {
    var phase = 0, nextAt = 0;
    (function loop(now) {
      if (now >= nextAt) {
        if (phase < 4) {
          addChip(NAMES[phase]);
          nextAt = now + 640;
        } else {
          var from = Math.floor(rnd() * order.length);
          order.splice(0, 0, order.splice(from, 1)[0]);   // 무작위 칩을 맨 앞으로
          relayout();
          nextAt = now + 900;
        }
        phase++;
      }
      requestAnimationFrame(loop);
    })(0);
  }
})();
</script>
</body>
</html>
