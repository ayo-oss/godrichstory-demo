<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>형식 거부 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rt" id="rt">
  <p class="rt__hint" id="rtHint">image/ 로 시작하는 형식만 받습니다 — 아니면 튕겨나가며 이유를 알려줍니다</p>
  <div class="rt__zone" id="rtZone" role="button" tabindex="0" aria-describedby="rtHint" aria-label="이미지 전용 드롭존">
    <input type="file" id="rtInput" class="rt__file" aria-label="파일 선택">
    <svg class="rt__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M224 56v122.06l-39.72-39.72a8 8 0 0 0-11.31 0L147.31 164l-49.65-49.66a8 8 0 0 0-11.32 0L32 168.69V56a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8" opacity=".2"/><path d="M216 40H40a16 16 0 0 0-16 16v144a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16m0 16v102.75l-26.07-26.06a16 16 0 0 0-22.63 0l-20 20l-44-44a16 16 0 0 0-22.62 0L40 149.37V56Zm0 144H40l68.69-68.68l72 72Z"/></g></svg>
    <span class="rt__file-name" id="rtFileName"></span>
  </div>
  <p class="rt__msg" id="rtMsg" aria-live="polite">image/ 로 시작하는 파일을 놓아보세요</p>
  <div class="rt__meta">
    <span class="rt__tag" id="rtTag">받음 0 · 거부 0</span>
  </div>
</div>
</main>
<script>
// 형식 거부(07) — File.type.indexOf('image/')===0 (startsWith 대용) 로 허용 여부를 가르고,
// 거부된 파일은 CSS 트랜짓으로 원래 자리로 튕겨 돌아가며 aria-live 문구가 이유를 읽어준다.
// dragover 시점엔 아직 File 이 없어도 DataTransferItem.type 으로 미리 거부 신호(커서·테두리)를
// 낼 수 있다 — 드롭 전에 이미 계산이 끝나 있는 것이 이 데모의 축.
(function () {
  var zone = document.getElementById('rtZone');
  var input = document.getElementById('rtInput');
  var fnameEl = document.getElementById('rtFileName');
  var msgEl = document.getElementById('rtMsg');
  var tagEl = document.getElementById('rtTag');
  if (!zone || !input || !fnameEl || !msgEl || !tagEl) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var ALLOW = 'image/';
  var BOUNCE_MS = 120;   // 변형: 기본 240ms → 이 편은 120ms(queue 변형표)

  // 시나리오 — 허용/거부가 섞인 순서. startsWith(indexOf===0) 판정이 매번 갈린다.
  var FILES = [
    { name: 'photo-01.png', type: 'image/png' },
    { name: 'report.pdf', type: 'application/pdf' },
    { name: 'photo-02.jpg', type: 'image/jpeg' },
    { name: 'notes.txt', type: 'text/plain' }
  ];
  var accepted = 0, rejected = 0, cur = -1;

  function judge(type) { return type.startsWith(ALLOW); }   // File.type 의 접두사 판정

  function announce(f, ok) {
    fnameEl.textContent = f.name;
    if (ok) {
      accepted++;
      msgEl.textContent = f.name + ' 받음(' + f.type + ')';
      zone.classList.remove('is-reject-live');
      zone.classList.add('is-accept');
      if (!reduce) { zone.style.animation = 'none'; void zone.offsetWidth; zone.style.animation = ''; }
    } else {
      rejected++;
      msgEl.textContent = f.name + ' 거부 — image/ 로 시작해야 합니다(현재 ' + f.type + ')';
      zone.classList.remove('is-accept');
      zone.classList.add('is-reject-live');
      if (!reduce) {
        zone.style.animation = 'none';
        void zone.offsetWidth;
        zone.style.animation = 'rtBounce ' + BOUNCE_MS + 'ms ease-out';
      }
    }
    tagEl.textContent = '받음 ' + accepted + ' · 거부 ' + rejected;
  }

  // 진짜 File 만 심사 — File.type 이 없는 시나리오 객체도 같은 규칙으로 재판정한다
  function isFileLike(file) { return !!(file && file.type !== undefined); }
  function intake(file) { if (isFileLike(file)) announce(file, judge(file.type)); }

  function virtualFile(spec) {
    try { return new File([new Blob(['x'])], spec.name, { type: spec.type }); }
    catch (e) { return spec; }
  }

  zone.addEventListener('dragover', function (e) {
    e.preventDefault();
    zone.classList.add('is-over');
    // 드롭 전 미리 판정 — items[0].type 은 File 없이도 읽힌다
    var items = e.dataTransfer && e.dataTransfer.items;
    var preOk = true;
    if (items && items.length) preOk = judge(items[0].type || '');
    zone.classList.toggle('is-precheck-reject', !preOk);
    if (e.dataTransfer) e.dataTransfer.dropEffect = preOk ? 'copy' : 'none';
  });
  zone.addEventListener('dragleave', function () {
    zone.classList.remove('is-over', 'is-precheck-reject');
  });
  zone.addEventListener('drop', function (e) {
    e.preventDefault();
    zone.classList.remove('is-over', 'is-precheck-reject');
    var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    // File.type 이 image/ 로 시작하는지가 이 데모의 심판이다
    if (file) intake(file);
  });
  input.addEventListener('change', function () {
    var file = input.files && input.files[0];
    if (file) intake(file);
    input.value = '';
  });

  if (reduce) {
    intake(virtualFile(FILES[0]));
    setTimeout(function () { intake(virtualFile(FILES[1])); }, 30);
  } else {
    var nextAt = 0;
    (function loop(now) {
      if (now >= nextAt) {
        nextAt = now + 620;
        cur = (cur + 1) % FILES.length;
        intake(virtualFile(FILES[cur]));
      }
      requestAnimationFrame(loop);
    })(0);
  }
})();
</script>
</body>
</html>
