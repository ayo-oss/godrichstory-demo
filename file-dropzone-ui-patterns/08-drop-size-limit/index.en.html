<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Size limit — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sl" id="sl">
  <p class="sl__hint" id="slHint">File.size is divided by 1024 repeatedly to pick a unit, cut at the second decimal</p>
  <div class="sl__zone" id="slZone" role="button" tabindex="0" aria-describedby="slHint" aria-label="Size-limit dropzone">
    <input type="file" id="slInput" class="sl__file" aria-label="Choose file">
    <svg class="sl__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 152v24a8 8 0 0 1-8 8H32a8 8 0 0 1-8-8v-22.87C24 95.65 70.15 48.2 127.63 48A104 104 0 0 1 232 152" opacity=".2"/><path d="M207.06 72.67A111.24 111.24 0 0 0 128 40h-.4C66.07 40.21 16 91 16 153.13V176a16 16 0 0 0 16 16h192a16 16 0 0 0 16-16v-24a111.25 111.25 0 0 0-32.94-79.33M224 176H119.71l54.76-75.3a8 8 0 0 0-12.94-9.42L99.92 176H32v-22.87c0-3.08.15-6.12.43-9.13H56a8 8 0 0 0 0-16H35.27c10.32-38.86 44-68.24 84.73-71.66V80a8 8 0 0 0 16 0V56.33A96.14 96.14 0 0 1 221 128h-21a8 8 0 0 0 0 16h23.67c.21 2.65.33 5.31.33 8Z"/></g></svg>
  </div>
  <div class="sl__card">
    <div class="sl__ring" id="slRing" role="img" aria-label="Ratio-to-limit gauge">
      <svg class="sl__svg" viewBox="0 0 72 72" aria-hidden="true">
        <circle class="sl__ring-bg" cx="36" cy="36" r="30"></circle>
        <circle class="sl__ring-val" id="slRingVal" cx="36" cy="36" r="30"></circle>
      </svg>
      <span class="sl__ring-num" id="slRingNum">0%</span>
    </div>
    <div class="sl__info">
      <span class="sl__name" id="slName">—</span>
      <span class="sl__size" id="slSize">0 B</span>
      <span class="sl__limit" id="slLimit">limit 5.00 MB</span>
      <span class="sl__verdict" id="slVerdict" aria-live="polite">Drop a file to see the verdict</span>
    </div>
  </div>
</div>
</main>
<script>
// Size limit(08) — File.size(바이트) 를 Math.pow(2,10)=1024 로 거듭 나눠 사람 단위(B→KB→MB)로
// 고치고, DECIMALS(변형: 기본 첫째 자리 → 이 편은 둘째 자리) 자리에서 버린다. Limit(5MB) 대비
// 비율로 링 게이지를 채우고 100% 가 넘으면 초과분을 MB 로 따로 계산해 보여준다.
(function () {
  var zone = document.getElementById('slZone');
  var input = document.getElementById('slInput');
  var ringVal = document.getElementById('slRingVal');
  var ringNum = document.getElementById('slRingNum');
  var nameEl = document.getElementById('slName');
  var sizeEl = document.getElementById('slSize');
  var limitEl = document.getElementById('slLimit');
  var verdictEl = document.getElementById('slVerdict');
  var card = document.getElementById('sl');
  if (!zone || !input || !ringVal || !ringNum || !nameEl || !sizeEl || !limitEl || !verdictEl || !card) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var K = Math.pow(2, 10);       // 1024 — 단위 계산의 밑
  var DECIMALS = 2;              // 변형: 기본 1(첫째 자리) → 이 편은 2(둘째 자리)
  var LIMIT = 5 * 1024 * 1024;   // 5 MB(바이트)

  var FILES = [
    { name: 'intro.mp4', bytes: 1.8 * 1024 * 1024 },
    { name: 'clip-720.mov', bytes: 4.6 * 1024 * 1024 },
    { name: 'master-raw.mov', bytes: 8.3 * 1024 * 1024 },
    { name: 'sticker.png', bytes: 0.3 * 1024 * 1024 }
  ];

  function fmt(bytes) {
    var v = bytes, i = 0;
    while (v >= K && i < 2) { v /= K; i++; }          // 1024 거듭 나누기
    var f = Math.pow(10, DECIMALS);
    v = Math.floor(v * f) / f;                        // DECIMALS 자리에서 버림
    return v.toFixed(DECIMALS) + ' ' + ['B', 'KB', 'MB'][i];
  }

  var shown = 0;
  function show(f) {
    var ratio = f.size / LIMIT;                       // Limit 대비 비율 — 링·숫자의 근원
    var over = ratio > 1;
    nameEl.textContent = f.name;
    sizeEl.textContent = fmt(f.size);
    limitEl.textContent = 'limit ' + fmt(LIMIT);
    ringVal.style.strokeDashoffset = String(188.5 * (1 - Math.min(1, ratio)));
    ringNum.textContent = Math.round(ratio * 100) + '%';
    card.classList.toggle('is-over-limit', over);
    card.classList.toggle('is-near-limit', !over && ratio >= 0.85);
    if (over) {
      verdictEl.textContent = 'over by +' + fmt(f.size - LIMIT) + ' — allowed up to ' + fmt(LIMIT) + '  max';
    } else {
      verdictEl.textContent = 'Within limit — remaining ' + fmt(LIMIT - f.size);
    }
    shown = ratio;
  }

  // 링 채움은 rAF 보간 — 숫자는 즉시 확정값, 링이 따라온다(계산 축: lerp)
  var target = 0;
  function tick() {
    shown += (target - shown) * 0.18;
    ringVal.style.strokeDashoffset = String(188.5 * (1 - Math.min(1, Math.max(0, shown))));
    if (Math.abs(target - shown) > 0.002) requestAnimationFrame(tick);
  }

  function intake(f) {
    show(f);
    target = Math.min(1.2, f.size / LIMIT);
    if (!reduce) requestAnimationFrame(tick);
  }

  function virtualFile(spec) {
    var bytes = Math.round(spec.bytes);
    try { return new File([new Blob([new Uint8Array(bytes)])], spec.name); }
    catch (e) { return { name: spec.name, size: bytes, type: '' }; }
  }

  zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('is-over'); });
  zone.addEventListener('dragleave', function () { zone.classList.remove('is-over'); });
  zone.addEventListener('drop', function (e) {
    e.preventDefault(); zone.classList.remove('is-over');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) intake(f);
  });
  input.addEventListener('change', function () {
    var f = input.files && input.files[0];
    if (f) intake(f);
    input.value = '';
  });

  if (reduce) {
    show(virtualFile(FILES[1]));
  } else {
    var nextAt = 0, cur = -1;
    (function loop(now) {
      if (now >= nextAt) {
        nextAt = now + 1300;
        cur = (cur + 1) % FILES.length;
        intake(virtualFile(FILES[cur]));
      }
      requestAnimationFrame(loop);
    })(0);
  }
})();
</script>
</body>
</html>
