<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview grid — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pg" id="pg">
  <p class="pg__hint" id="pgHint">naturalWidth ÷ naturalHeight goes into --ratio so tiles keep their own shapes</p>
  <div class="pg__zone" id="pgZone" role="button" tabindex="0" aria-describedby="pgHint" aria-label="Image dropzone">
    <input type="file" id="pgInput" multiple accept="image/*" class="pg__file" aria-label="Choose file">
    <svg class="pg__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M224 56v122.06l-39.72-39.72a8 8 0 0 0-11.31 0L147.31 164l-49.65-49.66a8 8 0 0 0-11.32 0L32 168.69V56a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8" opacity=".2"/><path d="M216 40H40a16 16 0 0 0-16 16v144a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16m0 16v102.75l-26.07-26.06a16 16 0 0 0-22.63 0l-20 20l-44-44a16 16 0 0 0-22.62 0L40 149.37V56ZM40 172l52-52l80 80H40Zm176 28h-21.37l-36-36l20-20L216 181.38zm-72-100a12 12 0 1 1 12 12a12 12 0 0 1-12-12"/></g></svg>
    <span class="pg__ghost" id="pgGhost">+</span>
  </div>
  <div class="pg__grid" id="pgGrid" aria-live="polite"></div>
  <div class="pg__meta">
    <span class="pg__tag" id="pgTag">ratio 4:3</span>
    <span class="pg__unit" id="pgUnit">tiles 0</span>
  </div>
</div>
</main>
<script>
// Preview grid(04) — 각 이미지의 naturalWidth/naturalHeight 비율을 CSS 변수 --ratio 에 담아
// aspect-ratio 로 전달하면 그리드가 이미지별로 다른 모양을 기억한다. 타일 안은 object-fit 대신
// 종횡비 계산으로 여백 없이 꽉 찬 타일을 만든다. createImageBitmap 픽셀 읽기가 계산 축이다.
(function () {
  var zone = document.getElementById('pgZone');
  var input = document.getElementById('pgInput');
  var grid = document.getElementById('pgGrid');
  var tagEl = document.getElementById('pgTag');
  var unitEl = document.getElementById('pgUnit');
  var ghost = document.getElementById('pgGhost');
  if (!zone || !input || !grid || !tagEl || !unitEl || !ghost) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // 가상 이미지 후보 — 종횡비가 제각각(가로·세로·정방·와이드). ratio 계산 결과가 타일 모양을 결정한다.
  var IMGS = [
    { name: 'a-wide.png', w: 640, h: 360, seed: 11 },
    { name: 'b-tall.png', w: 360, h: 640, seed: 23 },
    { name: 'c-square.jpg', w: 480, h: 480, seed: 37 },
    { name: 'd-photo.png', w: 800, h: 500, seed: 51 },
    { name: 'e-poster.jpg', w: 400, h: 700, seed: 67 },
    { name: 'f-pano.png', w: 960, h: 320, seed: 83 }
  ];
  var HEXES = ['#d6e1eb', '#93d9c0', '#b9a0ff', '#f6c6d3', '#cfd8f5', '#f0dfae'];
  var T_MAX = 160;   // 변형: 썸네일 최대 변(px) — 큐 변형 칩 04(320px→160px) 적용값

  // 시드 패턴을 오프스크린 캔버스에 그리고 ImageBitmap/Data 로 픽셀을 읽는다(외부 이미지 0)
  function paint(srcCanvas, w, h, seed) {
    var x = srcCanvas.getContext('2d');
    if (!x) return;
    var rnd = mulberry32(seed);
    srcCanvas.width = w; srcCanvas.height = h;
    x.fillStyle = HEXES[seed % HEXES.length];
    x.fillRect(0, 0, w, h);
    x.fillStyle = 'rgba(23,20,26,.08)';
    var step = Math.max(8, Math.round(Math.min(w, h) / 6));
    for (var yy = step; yy < h; yy += step) x.fillRect(0, yy, w, 1);
    for (var i = 0; i < 14; i++) {
      x.fillStyle = HEXES[Math.floor(rnd() * HEXES.length)];
      x.beginPath();
      x.arc(rnd() * w, rnd() * h, (0.06 + rnd() * 0.16) * Math.min(w, h), 0, Math.PI * 2);
      x.fill();
    }
  }

  var srcCv = document.createElement('canvas');
  var cur = -1;

  // 타일 하나 — 종횡비를 계산해 --ratio 에 심는다 (naturalWidth/naturalHeight 와 동일한 근원)
  function addTile(p) {
    paint(srcCv, p.w, p.h, p.seed);
    var ratio = p.w / p.h;
    var el = document.createElement('div');
    el.className = 'pg__tile';
    el.style.setProperty('--ratio', ratio.toFixed(4));
    var cv = document.createElement('canvas');
    cv.width = 64; cv.height = Math.max(16, Math.round(64 / ratio));
    var cx = cv.getContext('2d');
    if (cx) cx.drawImage(srcCv, 0, 0, cv.width, cv.height);
    cv.className = 'pg__thumb';
    el.appendChild(cv);
    if (grid.children.length >= 6) grid.removeChild(grid.firstChild);
    grid.appendChild(el);
    if (!reduce) {
      el.classList.add('is-in');
    }
    tagEl.textContent = 'ratio ' + gcd(p.w, p.h);
    unitEl.textContent = 'tiles ' + grid.children.length + ' · max ' + T_MAX + 'px';
  }

  // 비율을 정수비로 축약해 표기(640×360 → 16:9) — 계산 겹
  function gcd(a, b) {
    var x = a, y = b;
    while (y) { var t = y; y = x % y; x = t; }
    return (a / x) + ':' + (b / x);
  }

  // 실제 드롭 — Image 데이터에서 같은 경로
  zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('is-over'); });
  zone.addEventListener('dragleave', function () { zone.classList.remove('is-over'); });
  zone.addEventListener('drop', function (e) {
    e.preventDefault(); zone.classList.remove('is-over');
    var fs = e.dataTransfer && e.dataTransfer.files;
    if (fs && fs.length) {
      var f = fs[0];
      if (f.type && f.type.indexOf('image/') === 0) {
        var u = URL.createObjectURL(f);
        var im = new Image();
        im.onload = function () {
          addTile({ name: f.name, w: im.naturalWidth, h: im.naturalHeight, seed: 11 + (cur * 2) });
          URL.revokeObjectURL(u);
        };
        im.src = u;
      }
    }
  });
  input.addEventListener('change', function () {
    var fs = input.files;
    if (fs && fs.length && fs[0].type.indexOf('image/') === 0) {
      var f = fs[0];
      var u = URL.createObjectURL(f);
      var im = new Image();
      im.onload = function () {
        addTile({ name: f.name, w: im.naturalWidth, h: im.naturalHeight, seed: 11 });
        URL.revokeObjectURL(u);
      };
      im.src = u;
    }
    input.value = '';
  });

  // 자동 시연 — 후보를 번같아 "드롭". 타일 모양이 매번 다른 것이 보인다.
  if (reduce) {
    addTile(IMGS[0]); addTile(IMGS[2]);
  } else {
    var nextAt = 0;
    (function loop(now) {
      if (now >= nextAt) {
        nextAt = now + 620;
        cur = (cur + 1) % IMGS.length;
        addTile(IMGS[cur]);
      }
      requestAnimationFrame(loop);
    })(0);
  }
})();
</script>
</body>
</html>
