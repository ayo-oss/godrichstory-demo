<script>
// 실제 동작: 좌우 드래그 → 기울기·스탬프 → 임계값 넘으면 판정 확정·비행. 버튼·화살표 키도 같은 판정.
var root = document.getElementById('cd-root');
var deck = document.getElementById('cd-deck');
var count = document.getElementById('cd-count');
var left = 3, judging = false;
var top = null, x0 = 0, dragging = false;

function cards() { return [].slice.call(deck.querySelectorAll('.cd__card')); }
function restack() {
  var cs = cards();
  top = cs[cs.length - 1];
  cs.forEach(function (c, i) {
    var depth = cs.length - 1 - i;
    c.classList.toggle('is-top', depth === 0);
    c.classList.toggle('is-back1', depth === 1);
    c.classList.toggle('is-back2', depth === 2);
    c.setAttribute('aria-hidden', String(depth > 0));
  });
  count.textContent = count.textContent.replace(/\d+/, cs.length);
}
function verdict(pass) {
  if (judging || !top) return;
  judging = true;
  top.style.transition = 'transform 420ms cubic-bezier(.2,.8,.2,1), opacity 420ms ease-out';
  top.style.transform = 'translateX(' + (pass ? 150 : -150) + 'px) rotate(' + (pass ? 18 : -18) + 'deg)';
  top.style.opacity = '0';
  window.setTimeout(function () {
    deck.removeChild(top);
    left--;
    if (!cards().length) {
      reset();
    } else { restack(); }
    judging = false;
  }, 380);
}
function reset() {
  deck.innerHTML = document.getElementById('cd-src').innerHTML;
  left = 3;
  restack();
  bind();
}
function bind() {
  restack();
  top.addEventListener('pointerdown', function (e) {
    if (judging) return;
    root.classList.remove('is-demo');
    dragging = true; x0 = e.clientX;
    top.setPointerCapture(e.pointerId);
    top.style.transition = 'none';
    e.preventDefault();
  });
  top.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - x0;
    var r = Math.max(-12, Math.min(12, dx / 9));
    top.style.transform = 'translateX(' + dx + 'px) rotate(' + r + 'deg)';
    top.querySelector('.cd__stamp--pass').style.opacity = Math.max(0, Math.min(1, dx / 64));
    top.querySelector('.cd__stamp--skip').style.opacity = Math.max(0, Math.min(1, -dx / 64));
  });
  function drop() {
    if (!dragging) return;
    dragging = false;
    var dx = parseFloat((top.style.transform.match(/translateX\((-?[\d.]+)px\)/) || [0, 0])[1]);
    if (dx > 64) verdict(true);
    else if (dx < -64) verdict(false);
    else {
      top.style.transition = '';
      top.style.transform = '';
      top.querySelector('.cd__stamp--pass').style.opacity = 0;
      top.querySelector('.cd__stamp--skip').style.opacity = 0;
    }
  }
  top.addEventListener('pointerup', drop);
  top.addEventListener('pointercancel', drop);
}
document.getElementById('cd-pass').addEventListener('click', function () { root.classList.remove('is-demo'); verdict(true); });
document.getElementById('cd-skip').addEventListener('click', function () { root.classList.remove('is-demo'); verdict(false); });
root.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') { root.classList.remove('is-demo'); verdict(true); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { root.classList.remove('is-demo'); verdict(false); e.preventDefault(); }
});
bind();
</script>
