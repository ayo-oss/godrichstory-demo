<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubber-band boundary — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="rb is-demo" id="rb-root">
    <div class="rb__view" id="rb-view" tabindex="0" role="group" aria-label="Notice list — arrow keys check the ends">
      <span class="rb__end rb__end--top" id="rb-top" aria-hidden="true">No earlier notices</span>
      <div class="rb__inner" id="rb-inner">
        <div class="rb__row"><span class="rb__dot"></span><strong>October maintenance</strong><time>10-02</time></div>
        <div class="rb__row"><span class="rb__dot rb__dot--pink"></span><strong>Event winners announced</strong><time>09-28</time></div>
        <div class="rb__row"><span class="rb__dot rb__dot--blue"></span><strong>New feature released</strong><time>09-21</time></div>
        <div class="rb__row"><span class="rb__dot rb__dot--lilac"></span><strong>Holiday notice</strong><time>09-18</time></div>
        <div class="rb__row"><span class="rb__dot"></span><strong>Terms updated</strong><time>09-10</time></div>
      </div>
      <span class="rb__end rb__end--bottom" id="rb-bottom" aria-hidden="true">This is the last notice</span>
    </div>
    <p class="rb__hint">Past the end each pixel drags harder, and releasing springs it back</p>
  </div>
</main>
<script>
// 실제 동작: 끝에서 더 당기면 점점 저항(거리/3)이 붙고, 떼면 탄력으로 복귀. 화살표 키도 같은 반발을 보여준다.
var root = document.getElementById('rb-root');
var view = document.getElementById('rb-view');
var inner = document.getElementById('rb-inner');
var topEnd = document.getElementById('rb-top');
var bottomEnd = document.getElementById('rb-bottom');
var y0 = 0, dragging = false, cur = 0;

function bounds() {
  return { top: 0, bottom: Math.max(0, inner.offsetHeight - view.clientHeight + 2) };
}
function paint(y) {
  var b = bounds();
  var yd = y;
  if (yd < b.top) yd = b.top + (yd - b.top) / 3;        // 위 끝: 거리의 1/3만 따라오는 저항
  if (yd > b.bottom) yd = b.bottom + (yd - b.bottom) / 3;
  cur = y;
  inner.style.transform = 'translateY(' + (-yd) + 'px)';
  topEnd.classList.toggle('is-on', y < -6);
  bottomEnd.classList.toggle('is-on', y > b.bottom + 6);
}
view.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  dragging = true; y0 = e.clientY + cur;
  view.setPointerCapture(e.pointerId);
  inner.style.transition = 'none';
  e.preventDefault();
});
view.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  paint(y0 - e.clientY); // 손가락을 아래로 당기면 콘텐츠도 아래로 늘어난다
});
function drop() {
  if (!dragging) return;
  dragging = false;
  inner.style.transition = '';
  var b = bounds();
  paint(Math.max(b.top, Math.min(b.bottom, cur)));
}
view.addEventListener('pointerup', drop);
view.addEventListener('pointercancel', drop);
view.addEventListener('keydown', function (e) {
  var b = bounds();
  if (e.key === 'ArrowUp') { root.classList.remove('is-demo'); bounce(b.top - 26); e.preventDefault(); }
  else if (e.key === 'ArrowDown') { root.classList.remove('is-demo'); bounce(b.bottom + 26); e.preventDefault(); }
});
function bounce(y) {
  inner.style.transition = 'none';
  paint(y);
  window.setTimeout(function () {
    inner.style.transition = '';
    var b = bounds();
    paint(Math.max(b.top, Math.min(b.bottom, y)));
  }, 240);
}
paint(0);
</script>
</body>
</html>
