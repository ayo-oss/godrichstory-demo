<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swipe tab switch — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="wt is-demo" id="wt-root">
    <div class="wt__tabs" role="tablist" aria-label="Stats period">
      <span class="wt__pill" id="wt-pill" aria-hidden="true"></span>
      <button class="wt__tab is-on" type="button" role="tab" id="wt-t0" aria-selected="true" aria-controls="wt-p0">Weekly</button>
      <button class="wt__tab" type="button" role="tab" id="wt-t1" aria-selected="false" aria-controls="wt-p1" tabindex="-1">Monthly</button>
      <button class="wt__tab" type="button" role="tab" id="wt-t2" aria-selected="false" aria-controls="wt-p2" tabindex="-1">Yearly</button>
    </div>
    <div class="wt__view" id="wt-view">
      <div class="wt__track" id="wt-track">
        <section class="wt__panel" role="tabpanel" id="wt-p0" aria-labelledby="wt-t0">
          <strong class="wt__num">32K</strong>
          <div class="wt__bars"><i style="height:34%"></i><i style="height:64%"></i><i style="height:48%"></i><i style="height:82%"></i><i style="height:58%"></i></div>
          <span class="wt__cap">Visits this week</span>
        </section>
        <section class="wt__panel" role="tabpanel" id="wt-p1" aria-labelledby="wt-t1">
          <strong class="wt__num">128K</strong>
          <div class="wt__bars"><i style="height:52%"></i><i style="height:78%"></i><i style="height:66%"></i></div>
          <span class="wt__cap">Visits this month</span>
        </section>
        <section class="wt__panel" role="tabpanel" id="wt-p2" aria-labelledby="wt-t2">
          <strong class="wt__num">1.48M</strong>
          <div class="wt__bars"><i style="height:40%"></i><i style="height:88%"></i><i style="height:60%"></i><i style="height:74%"></i></div>
          <span class="wt__cap">Visits this year</span>
        </section>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 패널이 손가락을 따라오다가 놓으면 거리·속도로 확정. 탭·화살표 키도 같은 인덱스를 고른다.
var root = document.getElementById('wt-root');
var view = document.getElementById('wt-view');
var track = document.getElementById('wt-track');
var pill = document.getElementById('wt-pill');
var tabs = [].slice.call(document.querySelectorAll('.wt__tab'));
var W, at = 0;

function end() { W = view.clientWidth; }
end();
window.addEventListener('resize', end);

function paint(i, dx) {
  track.style.transform = 'translateX(' + (-i * W + (dx || 0)) + 'px)';
  pill.style.transform = 'translateX(' + (i * 72) + 'px)';
  tabs.forEach(function (t, k) {
    var on = k === i;
    t.classList.toggle('is-on', on);
    t.setAttribute('aria-selected', String(on));
    t.tabIndex = on ? 0 : -1;
  });
}
function go(i) { at = Math.max(0, Math.min(i, tabs.length - 1)); paint(at, 0); }

tabs.forEach(function (t, i) {
  t.addEventListener('click', function () { root.classList.remove('is-demo'); go(i); });
});
document.querySelector('.wt__tabs').addEventListener('keydown', function (e) {
  var k = e.key === 'ArrowRight' ? at + 1 : e.key === 'ArrowLeft' ? at - 1 : e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : at;
  if (k !== at) {
    root.classList.remove('is-demo');
    go(k);
    tabs[k].focus({ preventScroll: true });
    e.preventDefault();
  }
});

var x0 = 0, v = 0, lastX = 0, lastT = 0, dragging = false;
view.addEventListener('pointerdown', function (e) {
  if (e.target.closest('.wt__tabs')) return;
  root.classList.remove('is-demo');
  dragging = true; x0 = e.clientX; lastX = e.clientX; lastT = Date.now(); v = 0;
  view.setPointerCapture(e.pointerId);
  track.style.transition = 'none';
});
view.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var dx = e.clientX - x0;
  var now = Date.now();
  if (now - lastT > 0) { v = (e.clientX - lastX) / Math.max(1, now - lastT); lastX = e.clientX; lastT = now; }
  if ((at === 0 && dx > 0) || (at === tabs.length - 1 && dx < 0)) dx *= .3; // 끝에서는 저항
  paint(at, dx);
});
function drop() {
  if (!dragging) return;
  dragging = false;
  track.style.transition = '';
  var dx = lastX - x0;
  if (dx < -44 || v < -.45) go(at + 1);
  else if (dx > 44 || v > .45) go(at - 1);
  else go(at);
}
view.addEventListener('pointerup', drop);
view.addEventListener('pointercancel', drop);
paint(0, 0);
</script>
</body>
</html>
