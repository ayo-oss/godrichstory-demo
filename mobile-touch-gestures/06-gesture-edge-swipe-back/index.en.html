<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge swipe back — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="eb is-demo" id="eb-root">
    <div class="eb__frame" id="eb-frame">
      <div class="eb__prev" id="eb-prev" aria-hidden="true">
        <span class="eb__ptitle">List</span>
        <i class="eb__ln"></i><i class="eb__ln"></i><i class="eb__ln"></i><i class="eb__ln"></i>
      </div>
      <div class="eb__cur" id="eb-cur">
        <div class="eb__bar">
          <button class="eb__back" type="button" id="eb-back" aria-label="Go back">
            <svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="M112 56v144l-72-72Z" opacity=".2"/><path d="M216 120h-96V56a8 8 0 0 0-13.66-5.66l-72 72a8 8 0 0 0 0 11.32l72 72A8 8 0 0 0 120 200v-64h96a8 8 0 0 0 0-16m-112 60.69L51.31 128L104 75.31Z"/></g></svg>
          </button>
          <span class="eb__ctitle eb__ctitle--a">Detail page</span>
          <span class="eb__ctitle eb__ctitle--b">List</span>
        </div>
        <div class="eb__body">
          <span class="eb__hero"></span>
          <i class="eb__ln"></i><i class="eb__ln"></i><i class="eb__ln"></i>
        </div>
      </div>
      <span class="eb__edge" aria-hidden="true"></span>
    </div>
    <p class="eb__hint">Drag in from the left edge</p>
  </div>
</main>
<script>
// 실제 동작: 왼쪽 가장자리에서 당기면 이전 페이지가 반투명하게 따라 나오고, 끝까지 당겨야 확정.
var root = document.getElementById('eb-root');
var frame = document.getElementById('eb-frame');
var prev = document.getElementById('eb-prev');
var cur = document.getElementById('eb-cur');
var back = document.getElementById('eb-back');
var TITLES = ['eb__ctitle--a', 'eb__ctitle--b'];
var atDetail = true, x0 = 0, dragging = false;

function paint(p) { // p: 0..1
  prev.style.transform = 'translateX(' + (-46 + p * 46) + '%)';
  prev.style.opacity = String(.45 + p * .55);
  cur.style.transform = 'translateX(' + (p * 38) + '%)';
}
function settle() { paint(atDetail ? 0 : 1); }

frame.addEventListener('pointerdown', function (e) {
  var r = frame.getBoundingClientRect();
  if (e.clientX - r.left > 28) return; // 가장자리 잡기 영역
  root.classList.remove('is-demo');
  dragging = true; x0 = e.clientX;
  frame.setPointerCapture(e.pointerId);
  prev.style.transition = 'none';
  cur.style.transition = 'none';
  e.preventDefault();
});
frame.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = Math.max(0, Math.min(1, (e.clientX - x0) / (frame.clientWidth * .55)));
  paint(p);
});
function drop(e) {
  if (!dragging) return;
  dragging = false;
  prev.style.transition = '';
  cur.style.transition = '';
  var p = Math.max(0, Math.min(1, (e.clientX - x0) / (frame.clientWidth * .55)));
  if (p > .72) {
    atDetail = false;
    document.querySelectorAll('.eb__ctitle').forEach(function (t) { t.classList.toggle('is-on', t.classList.contains(TITLES[atDetail ? 0 : 1])); });
    settle();
  } else { settle(); }
}
frame.addEventListener('pointerup', drop);
frame.addEventListener('pointercancel', drop);
back.addEventListener('click', function () {
  root.classList.remove('is-demo');
  atDetail = !atDetail;
  document.querySelectorAll('.eb__ctitle').forEach(function (t) { t.classList.toggle('is-on', t.classList.contains(TITLES[atDetail ? 0 : 1])); });
  prev.style.transition = '';
  cur.style.transition = '';
  settle();
});
document.querySelector('.eb__ctitle--a').classList.add('is-on');
settle();
</script>
</body>
</html>
