<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>목표를 살짝 넘었다 돌아오는 오버슈트 곡선 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, 왼쪽·오른쪽 방향키로 오버슈트 값을 바꾼다">
    <canvas class="ez__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="목표를 넘었다 돌아오는 오버슈트 곡선과 최대 초과량을 읽는 장면"></canvas>
  </div>
  <p class="ez__status" data-role="status" aria-live="off">장면 준비</p>
  <div class="ez__ctrl">
    <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
  </div>
  <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function main(root) {
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 파스텔 팔레트 — 바탕은 짙은 자두색, 상자는 연한 색, 글자는 연한 색 또는 짙은 잉크
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    const ROSE = [244, 162, 186];
    const MINT = [148, 212, 182];
    const SKY = [150, 192, 244];
    const SUN = [250, 218, 146];
    const LILAC = [196, 176, 244];
    const NEU = [236, 230, 250];
    const BGC = [46, 42, 68];
    const PANEL = [62, 57, 92];
    const GRID = [92, 86, 124];
    const DIM = [196, 190, 224];
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    function f3(v) { return (Math.round(v * 1000) / 1000).toFixed(3); }
    function pct(v) { return String(Math.round(v * 100)); }
    // ── 이징 계산. 모두 진행률 p(0 에서 1) 를 받아 변화량 비율을 돌려준다
    const LINEAR = function (p) { return clamp(p, 0, 1); };
    // 3차 곡선 한 점 — 제어값 두 개(a, b) 와 매개값 s 로 좌표 하나를 얻는다
    function bz(a, b, s) {
        const u = 1 - s;
        return 3 * u * u * s * a + 3 * u * s * s * b + s * s * s;
    }
    // CSS cubic-bezier(x1, y1, x2, y2) 와 같은 곡선. 시간 p 에 맞는 매개값 s 를 반으로 줄이는 반복 근사로 찾고 그 s 의 y 를 돌려준다
    function cubic(x1, y1, x2, y2) {
        return function (p) {
            if (p <= 0) {
                return 0;
            }
            if (p >= 1) {
                return 1;
            }
            let lo = 0;
            let hi = 1;
            let s = p;
            for (let i = 0; i < 32; i += 1) {
                s = (lo + hi) / 2;
                if (bz(x1, x2, s) < p) {
                    lo = s;
                }
                else {
                    hi = s;
                }
            }
            return bz(y1, y2, s);
        };
    }
    // CSS steps(n, jump-end) 와 steps(n, jump-start) — 값이 계단으로만 바뀐다
    function stepsFn(n, jumpStart) {
        return function (p) {
            if (p <= 0) {
                return 0;
            }
            if (p >= 1) {
                return 1;
            }
            return jumpStart ? Math.min(1, Math.ceil(p * n) / n) : Math.floor(p * n) / n;
        };
    }
    // CSS linear(점 목록) — 점은 같은 간격 위치에 놓이고 사이는 직선으로 잇는다
    function linearFn(pts) {
        return function (p) {
            if (p <= 0) {
                return pts[0];
            }
            if (p >= 1) {
                return pts[pts.length - 1];
            }
            const x = p * (pts.length - 1);
            const i = Math.floor(x);
            return lerp(pts[i], pts[i + 1], x - i);
        };
    }
    // 순간 속도 — 진행률 곡선의 기울기(길이 1 을 시간 1 에 가는 직선이 1 배)
    function slopeAt(fn, p) {
        const h = 0.002;
        const a = Math.max(0, p - h);
        const b = Math.min(1, p + h);
        return (fn(b) - fn(a)) / (b - a);
    }
    // 목표의 비율 q 에 처음 닿는 시간(0 에서 1) — 반으로 줄이는 반복 근사
    function reachTime(fn, q) {
        let lo = 0;
        let hi = 1;
        for (let i = 0; i < 30; i += 1) {
            const m = (lo + hi) / 2;
            if (fn(m) < q) {
                lo = m;
            }
            else {
                hi = m;
            }
        }
        return hi;
    }
    // ── 그리기 도구
    const rootEl = root;
    const canvasEl = rootEl.querySelector('[data-role="canvas"]');
    const padEl = rootEl.querySelector('[data-role="pad"]');
    const pauseEl = rootEl.querySelector('[data-role="pause"]');
    const statusEl = rootEl.querySelector('[data-role="status"]');
    const doneEl = rootEl.querySelector('[data-role="done"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !doneEl || !statusEl) {
        return function () { };
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pad = padEl;
    const pauseBtn = pauseEl;
    const doneP = doneEl;
    const statusP = statusEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const UI_FONT = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    const CODE_FONT = 'ui-monospace, "Cascadia Mono", Consolas, "Noto Sans KR", monospace';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 계산은 늘 480×300 이고 화면 배율만 이 값
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function disc(x, y, r, c, a) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function seg(x1, y1, x2, y2, c, a, w) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = w;
        ctx.lineCap = 'round';
        ctx.stroke();
    }
    // 점선 세로·가로선
    function dash(x1, y1, x2, y2, c, a) {
        ctx.setLineDash([3, 3]);
        seg(x1, y1, x2, y2, c, a, 1);
        ctx.setLineDash([]);
    }
    // 글자 — maxW 가 있으면 그 폭에 들어가도록 글자 크기를 줄인다(문구가 로케일마다 길이가 달라서)
    function text(s, x, y, c, px, weight, align, maxW, mono) {
        const face = mono ? CODE_FONT : UI_FONT;
        let size = px;
        ctx.font = weight + ' ' + size + 'px ' + face;
        if (maxW !== undefined) {
            while (size > 8 && ctx.measureText(s).width > maxW) {
                size -= 0.5;
                ctx.font = weight + ' ' + size + 'px ' + face;
            }
        }
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, 1);
        ctx.fillText(s, x, y);
    }
    function panel(x, y, w, h) { box(x, y, w, h, 10, PANEL, 1); }
    // 아래쪽 눈금 — 상수 이름과 지금 값 · 크기 막대
    function hud(name, val, frac) {
        const label = name + ' ' + val;
        ctx.font = '700 11px ' + CODE_FONT;
        const w = ctx.measureText(label).width + 20;
        const x = 12;
        const y = H - 30;
        box(x, y, w, 20, 10, NEU, 0.96);
        text(label, x + w / 2, y + 10.5, INK, 11, 700, 'center', undefined, true);
        const mx = x + w + 10;
        box(mx, y + 6, 140, 8, 4, [78, 72, 104], 1);
        box(mx, y + 6, 140 * clamp(frac, 0, 1), 8, 4, MINT, 1);
    }
    function gX(g, p) { return g.x + g.w * p; }
    function gY(g, v) { return g.y + g.h * (1 - (v - g.lo) / (g.hi - g.lo)); }
    function graphFrame(g) {
        box(g.x - 6, g.y - 6, g.w + 12, g.h + 12, 8, PANEL, 1);
        seg(g.x, gY(g, 0), g.x + g.w, gY(g, 0), GRID, 1, 1);
        seg(g.x, gY(g, 1), g.x + g.w, gY(g, 1), GRID, 1, 1);
        dash(g.x, gY(g, 0), g.x, gY(g, 1), GRID, 1);
        dash(g.x + g.w, gY(g, 0), g.x + g.w, gY(g, 1), GRID, 1);
    }
    // 곡선 한 줄 — 시간 upTo(0 에서 1) 까지 그리고, 끝에 점을 찍는다
    function plot(g, fn, c, lw, upTo, dot, wash) {
        const n = 72;
        if (wash !== undefined && wash > 0 && upTo > 0) {
            // 곡선 아래를 옅게 채워 진행이 면으로 보이게 한다
            ctx.beginPath();
            ctx.moveTo(gX(g, 0), gY(g, 0));
            for (let i = 0; i <= n; i += 1) {
                const p = (i / n) * upTo;
                ctx.lineTo(gX(g, p), gY(g, fn(p)));
            }
            ctx.lineTo(gX(g, upTo), gY(g, 0));
            ctx.closePath();
            ctx.fillStyle = rgba(c, wash);
            ctx.fill();
        }
        ctx.beginPath();
        for (let i = 0; i <= n; i += 1) {
            const p = (i / n) * upTo;
            const px = gX(g, p);
            const py = gY(g, fn(p));
            if (i === 0) {
                ctx.moveTo(px, py);
            }
            else {
                ctx.lineTo(px, py);
            }
        }
        ctx.strokeStyle = rgba(c, 1);
        ctx.lineWidth = lw;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        if (dot) {
            disc(gX(g, upTo), gY(g, fn(upTo)), lw + 1.5, c, 1);
        }
    }
    // ── 시간·상태·낭독
    let sceneT = 0;
    let lap = 0;
    let paused = false;
    let still = false;
    let lastStatus = '';
    let lastMode = -9;
    function pushStatus(s) {
        if (s === lastStatus) {
            return;
        }
        lastStatus = s;
        statusP.textContent = s;
    }
    // 화면을 한 번 그린다 — 움직임 줄이기이면 시간표 끝(REST_S)의 한 장
    function redraw() {
        const t = still ? REST_S : sceneT;
        ctx.clearRect(0, 0, W, H);
        box(0, 0, W, H, 0, BGC, 1);
        draw(t);
        pushStatus(statusText(t));
        const m = still ? -2 : modeId(t);
        if (m !== lastMode) {
            lastMode = m;
            doneP.textContent = speakText(t);
        }
    }
    // 프레임 간격이 튀어도 한 번에 몰리지 않게 자른다
    const DT_MAX = 0.05;
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        rafId = 0;
        if (still || paused || document.hidden) {
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        sceneT += dt;
        if (sceneT >= LAP_S) {
            sceneT -= LAP_S;
            lap += 1;
        }
        redraw();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 장면이 처음으로 돌아갈 때 해야 할 일이 있으면 이 함수를 바꿔 건다
    let onReset = function () { };
    function restart() {
        onReset();
        sceneT = 0;
        lap = 0;
        redraw();
        if (!paused && !still) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    const off = new AbortController();
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    still = reduceQuery.matches;
    pauseBtn.addEventListener('click', function () { togglePause(); }, { signal: off.signal });
    pad.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            togglePause();
            return;
        }
        if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            restart();
            return;
        }
        if (onKey(e)) {
            e.preventDefault();
            // 멈춘 채이거나 움직임 줄이기이면 루프가 없으니 바로 다시 그린다
            redraw();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 끝 장면 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            stopLoop();
            redraw();
        }
        else {
            restart();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        redraw();
    }, { signal: off.signal });
    // 캔버스 좌표(480×300) — 화면 크기와 상관없이 같은 좌표계
    function stageXY(e) {
        const r = cv.getBoundingClientRect();
        return [((e.clientX - r.left) / r.width) * W, ((e.clientY - r.top) / r.height) * H];
    }
    // CSS 기본 키워드 네 개의 실제 곡선 값(CSS 표준이 정한 제어값)
    const EASE = cubic(0.25, 0.1, 0.25, 1);
    const EASE_IN = cubic(0.42, 0, 1, 1);
    const EASE_OUT = cubic(0, 0, 0.58, 1);
    const EASE_IN_OUT = cubic(0.42, 0, 0.58, 1);
    // 05 — 3차 곡선의 두 번째 값(OVERSHOOT)이 1 을 넘으면 상자가 목표를 넘었다가 돌아온다. 최대 초과량(peak)과 되돌아오는 시점(backAt)을 읽고, 옆에 벽(range)이 있으면 넘침이 되는 순간을 본다. 왼쪽·오른쪽 방향키로 OVERSHOOT 를 바꾼다
    const OVERSHOOT = 1.2;
    const T0 = 0.3;
    const DURATION = 1.4;
    const LAP_S = 4.0;
    const REST_S = 2.4;
    // 상자가 가는 거리와 벽까지의 여유(픽셀)
    const TRAVEL = 200;
    const RANGE = 14;
    const BW = 26;
    const GR = { x: 338, y: 84, w: 118, h: 130, lo: 0, hi: 1.4 };
    let overshoot = OVERSHOOT;
    // 곡선을 천 번 훑어 가장 높은 값(peak)과 그 시간, 초과가 1% 아래로 돌아오는 시간(backAt)을 찾는다
    function analyze(ov) {
        const fn = cubic(0.34, ov, 0.64, 1);
        let peak = 0;
        let peakAt = 0;
        for (let i = 0; i <= 1000; i += 1) {
            const v = fn(i / 1000);
            if (v > peak) {
                peak = v;
                peakAt = i / 1000;
            }
        }
        let backAt = 1;
        for (let i = Math.round(peakAt * 1000); i <= 1000; i += 1) {
            if (fn(i / 1000) - 1 <= 0.01) {
                backAt = i / 1000;
                break;
            }
        }
        return { fn: fn, peak: peak, peakAt: peakAt, backAt: backAt };
    }
    function prog(t) { return clamp((t - T0) / DURATION, 0, 1); }
    function draw(t) {
        const p = prog(t);
        const st = analyze(overshoot);
        const plain = EASE_OUT;
        const excessPx = (st.peak - 1) * TRAVEL;
        const hit = excessPx > RANGE;
        const wallX = 22 + TRAVEL + BW + RANGE;
        for (let k = 0; k < 2; k += 1) {
            const y = 66 + k * 64;
            box(14, y, 286, 54, 10, PANEL, 1);
            dash(22 + TRAVEL + BW, y + 4, 22 + TRAVEL + BW, y + 50, PAPER, 0.8);
            seg(wallX, y + 3, wallX, y + 51, ROSE, 1, 3);
            const v = k === 0 ? st.fn(p) : plain(p);
            const bx = 22 + v * TRAVEL;
            const over = k === 0 && hit && v > 1 + RANGE / TRAVEL;
            box(22, y + 11, bx + BW - 22, 32, 8, k === 0 ? (over ? ROSE : MINT) : SKY, 0.2);
            box(bx, y + 11, BW, 32, 8, k === 0 ? (over ? ROSE : MINT) : SKY, 1);
            text(k === 0 ? 'cubic-bezier(.34, ' + f2(overshoot) + ', .64, 1)' : 'ease-out', 22, y - 8, DIM, 9.5, 700, 'left', 200, true);
        }
        graphFrame(GR);
        text('목표 1 을 넘는 곡선', GR.x + GR.w / 2, 68, NEU, 10.5, 700, 'center', 150);
        dash(GR.x, gY(GR, 1), GR.x + GR.w, gY(GR, 1), PAPER, 0.8);
        plot(GR, plain, SKY, 1.5, p, false);
        plot(GR, st.fn, MINT, 2.5, p, p > 0, 0.16);
        if (p >= st.peakAt) {
            disc(gX(GR, st.peakAt), gY(GR, st.peak), 4, SUN, 1);
        }
        text(fill('peak {a}% 초과 · {b}초에 돌아옴', f1((st.peak - 1) * 100), f2(st.backAt * DURATION)), 150, 208, SUN, 11, 700, 'center', 270);
        text(fill(hit ? 'range {a}px 를 {b}px 넘어 벽에 닿는다' : 'range {a}px 안에서 멈춘다 (초과 {b}px)', String(RANGE), f1(excessPx)), 150, 228, hit ? ROSE : MINT, 11, 700, 'center', 270);
        hud('OVERSHOOT', f2(overshoot), (overshoot - 1) / 0.8);
    }
    function statusText(t) {
        const st = analyze(overshoot);
        return fill('OVERSHOOT {a} · 최대 초과 {b}%', f2(overshoot), f1((st.peak - 1) * 100));
    }
    function modeId(t) { void t; return Math.round(overshoot * 100); }
    function speakText(t) {
        void t;
        const st = analyze(overshoot);
        const hit = (st.peak - 1) * TRAVEL > RANGE;
        return fill('오버슈트 값 {a}. 상자는 목표를 최대 {b}% 넘었다가 {c}초에 돌아온다. {d}', f2(overshoot), f1((st.peak - 1) * 100), f2(st.backAt * DURATION), hit ? '벽을 넘어 화면 밖으로 튄다' : '벽 안에서 끝난다');
    }
    function onKey(e) {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
            overshoot = Math.round(clamp(overshoot - 0.1, 1, 1.8) * 10) / 10;
            return true;
        }
        if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
            overshoot = Math.round(clamp(overshoot + 0.1, 1, 1.8) * 10) / 10;
            return true;
        }
        return false;
    }
    function sceneInit() { }
    sceneInit();
    fitCanvas();
    // 캔버스 설명에는 이 장면이 계산한 핵심 값이 든 문장을 쓴다
    cv.setAttribute('aria-label', speakText(REST_S));
    redraw();
    if (!still) {
        startLoop();
    }
    return function () {
        stopLoop();
        off.abort();
    };
}
})();
</script>
</body>
</html>
