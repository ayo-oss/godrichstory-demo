<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カード数値に合わせて伸びる横トラック — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sb is-demo" id="sb">
  <div class="sb__viewport" id="sbViewport">
    <div class="sb__content" id="sbContent"></div>
  </div>
  <div class="sb__track" id="sbTrack">
    <div class="sb__thumb" id="sbThumb" role="scrollbar" aria-orientation="horizontal" aria-controls="sbViewport" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" tabindex="0"></div>
  </div>
</div>
</main>
<script>
(function () {
  var THUMB_MIN_PX = 30;
  var KEY_STEP_PX = 60;
  var CARD_COUNT = 6;

  var root = document.getElementById('sb');
  var viewport = document.getElementById('sbViewport');
  var content = document.getElementById('sbContent');
  var track = document.getElementById('sbTrack');
  var thumb = document.getElementById('sbThumb');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  for (var i = 1; i <= CARD_COUNT; i++) {
    var card = document.createElement('div');
    card.className = 'sb__card';
    var h = document.createElement('p');
    h.className = 'sb__cardTitle';
    h.textContent = '商品 ' + i;
    var p = document.createElement('p');
    p.className = 'sb__cardLine';
    p.textContent = 'カード個数値';
    card.appendChild(h);
    card.appendChild(p);
    content.appendChild(card);
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function maxScrollX() { return Math.max(0, viewport.scrollWidth - viewport.clientWidth); }

  function syncThumbX() {
    var trackLen = track.clientWidth;
    var total = viewport.scrollWidth;
    var visible = viewport.clientWidth;
    var thumbLen = clamp(trackLen * (visible / total), THUMB_MIN_PX, trackLen);
    var ms = maxScrollX();
    var ratio = ms > 0 ? viewport.scrollLeft / ms : 0;
    var thumbPos = (trackLen - thumbLen) * ratio;
    thumb.style.width = thumbLen.toFixed(1) + 'px';
    thumb.style.transform = 'translateX(' + thumbPos.toFixed(1) + 'px)';
    thumb.setAttribute('aria-valuenow', String(Math.round(ratio * 100)));
  }

  viewport.addEventListener('scroll', syncThumbX);

  var dragging = false;
  var dragStartX = 0;
  var dragStartScroll = 0;

  thumb.addEventListener('pointerdown', function (e) {
    dragging = true;
    root.classList.remove('is-demo');
    dragStartX = e.clientX;
    dragStartScroll = viewport.scrollLeft;
    thumb.setPointerCapture(e.pointerId);
  });
  thumb.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var trackLen = track.clientWidth;
    var thumbLen = thumb.clientWidth;
    var deltaPx = e.clientX - dragStartX;
    var moveRange = Math.max(1, trackLen - thumbLen);
    viewport.scrollLeft = clamp(dragStartScroll + deltaPx * (maxScrollX() / moveRange), 0, maxScrollX());
  });
  thumb.addEventListener('pointerup', function () { dragging = false; });
  thumb.addEventListener('pointercancel', function () { dragging = false; });

  track.addEventListener('pointerdown', function (e) {
    if (e.target !== track) return;
    root.classList.remove('is-demo');
    var rect = track.getBoundingClientRect();
    var trackLen = track.clientWidth;
    var thumbLen = thumb.clientWidth;
    var clickPos = clamp(e.clientX - rect.left - thumbLen / 2, 0, trackLen - thumbLen);
    var ratio = (trackLen - thumbLen) > 0 ? clickPos / (trackLen - thumbLen) : 0;
    viewport.scrollLeft = ratio * maxScrollX();
  });

  thumb.addEventListener('keydown', function (e) {
    var ms = maxScrollX();
    if (e.key === 'ArrowRight') { viewport.scrollLeft = clamp(viewport.scrollLeft + KEY_STEP_PX, 0, ms); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { viewport.scrollLeft = clamp(viewport.scrollLeft - KEY_STEP_PX, 0, ms); e.preventDefault(); }
    else if (e.key === 'PageDown') { viewport.scrollLeft = clamp(viewport.scrollLeft + viewport.clientWidth, 0, ms); e.preventDefault(); }
    else if (e.key === 'PageUp') { viewport.scrollLeft = clamp(viewport.scrollLeft - viewport.clientWidth, 0, ms); e.preventDefault(); }
    else if (e.key === 'Home') { viewport.scrollLeft = 0; e.preventDefault(); }
    else if (e.key === 'End') { viewport.scrollLeft = ms; e.preventDefault(); }
    if (e.key.indexOf('Arrow') === 0 || e.key === 'PageDown' || e.key === 'PageUp' || e.key === 'Home' || e.key === 'End') {
      root.classList.remove('is-demo');
    }
  });

  var startTime = null;
  function demoTick(now) {
    if (startTime === null) startTime = now;
    var t = (now - startTime) / 1000;
    if (root.classList.contains('is-demo')) {
      var phase = (Math.sin(t * Math.PI) + 1) / 2;
      viewport.scrollLeft = phase * maxScrollX();
    }
    requestAnimationFrame(demoTick);
  }

  syncThumbX();
  if (!reduce) { requestAnimationFrame(demoTick); }
})();
</script>
</body>
</html>
