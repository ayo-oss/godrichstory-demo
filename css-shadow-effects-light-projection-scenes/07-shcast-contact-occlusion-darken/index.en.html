<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Contact Shadow That Darkens as the Object Settles — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sc is-demo" id="scRoot">
  <canvas class="sc__canvas" id="scCanvas" width="480" height="300" tabindex="0" aria-label="One gap between the object and the floor sets the radius and opacity of the contact shadow by formula: small and dark when close, wide and faint when far."></canvas>
  <p class="sc__status" id="scStatus" aria-live="polite">Demo running</p>
  <button class="sc__btn" id="scBtn" type="button">Pause</button>
  <p class="sc__caption">One gap between the object and the floor sets the radius and opacity of the contact shadow by formula: small and dark when close, wide and faint when far.</p>
</div>
</main>
<script>
(function () {
    const W = 480;
    const H = 300;
    const PI2 = Math.PI * 2;
    const FIXED_DT = 16;
    const REDUCE_STEP_MS = 900;
    const REDUCE_START_MS = 1000;
    const PERIOD_MS = 4000;
    const KEY_STEP = 12;
    const FONT = '-apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a.toFixed(3) + ')';
    }
    // 시드 고정 난수 — 같은 시드면 언제나 같은 수열
    function mulberry32(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6D2B79F5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function glow(ctx, x, y, r, c, a) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, rgba(c, a));
        g.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    function polyPath(ctx, poly) {
        ctx.beginPath();
        for (let i = 0; i < poly.length; i += 1) {
            if (i === 0) {
                ctx.moveTo(poly[i][0], poly[i][1]);
            }
            else {
                ctx.lineTo(poly[i][0], poly[i][1]);
            }
        }
        ctx.closePath();
    }
    const AO_RADIUS = 26;
    const AO_STRENGTH = 0.66;
    const HEIGHT_MAX = 96;
    const OBJECT_COUNT = 3;
    const LIGHT_LERP = 0.16;
    const GROUND_Y = 220;
    const FLOOR_RGB = [243, 238, 250];
    const INK_RGB = [66, 48, 112];
    const OBJ_XS = [118, 240, 362];
    const OBJ_HALF = [26, 24, 20];
    const OBJ_REACH = [1, 0.72, 0.88];
    const OBJ_FOLLOW = [0.12, 0.09, 0.07];
    const OBJ_RGBS = [[255, 206, 190], [186, 222, 255], [200, 240, 214]];
    const OBJ_EDGE = [[232, 150, 130], [120, 170, 232], [120, 208, 160]];
    // 높이 h 의 물체 아래 접촉 그림자 — 가까울수록 작고 진하고, 멀수록 넓고 옅다
    function contactAlpha(h) {
        const near = 1 - clamp(h / HEIGHT_MAX, 0, 1);
        return AO_STRENGTH * near * near + 0.05;
    }
    function contactRadius(h, half) {
        return (AO_RADIUS + half * 0.4) * (1 + 1.2 * clamp(h / HEIGHT_MAX, 0, 1));
    }
    function makeScene(ctx) {
        let lx = 240;
        let ly = 150;
        const level = [];
        for (let i = 0; i < OBJECT_COUNT; i += 1) {
            level.push(0.5);
        }
        function follow(k) {
            const s = clamp((ly - 20) / 260, 0, 1);
            for (let i = 0; i < OBJECT_COUNT; i += 1) {
                level[i] = lerp(level[i], s, k * OBJ_FOLLOW[i] / 0.12);
            }
        }
        const scene = {
            path: function (t) {
                const a = PI2 * t / PERIOD_MS;
                return [240 + 140 * Math.sin(a), 150 + 138 * Math.sin(a * 1.0 - 1.57)];
            },
            pos: function () { return [lx, ly]; },
            update: function (tx, ty) {
                lx = lerp(lx, tx, LIGHT_LERP);
                ly = lerp(ly, ty, LIGHT_LERP);
                follow(0.16);
            },
            snap: function (tx, ty) {
                lx = tx;
                ly = ty;
                for (let i = 0; i < OBJECT_COUNT; i += 1) {
                    level[i] = clamp((ly - 20) / 260, 0, 1);
                }
            },
            draw: function () {
                ctx.fillStyle = rgba(FLOOR_RGB, 1);
                ctx.fillRect(0, 0, W, H);
                const wall = ctx.createLinearGradient(0, 0, 0, GROUND_Y - 30);
                wall.addColorStop(0, 'rgba(226,214,250,1)');
                wall.addColorStop(1, 'rgba(255,244,226,1)');
                ctx.fillStyle = wall;
                ctx.fillRect(0, 0, W, GROUND_Y - 30);
                for (let i = 0; i < OBJECT_COUNT; i += 1) {
                    const h = HEIGHT_MAX * level[i] * OBJ_REACH[i];
                    const half = OBJ_HALF[i];
                    const x = OBJ_XS[i];
                    const rx = contactRadius(h, half);
                    const a = contactAlpha(h);
                    // 번진 바깥 층과 맞닿은 안쪽 핵 — 두 반지름이 높이에 따라 따로 변한다
                    ctx.save();
                    ctx.translate(x, GROUND_Y);
                    ctx.scale(1, 0.3);
                    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
                    g.addColorStop(0, rgba(INK_RGB, a));
                    g.addColorStop(0.55, rgba(INK_RGB, a * 0.45));
                    g.addColorStop(1, rgba(INK_RGB, 0));
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(0, 0, rx, 0, PI2);
                    ctx.fill();
                    ctx.restore();
                    const cy = GROUND_Y - h * 0.8 - half;
                    if (i === 1) {
                        ctx.fillStyle = rgba(OBJ_RGBS[i], 1);
                        ctx.fillRect(x - half, cy - half, half * 2, half * 2);
                        ctx.lineWidth = 3;
                        ctx.strokeStyle = rgba(OBJ_EDGE[i], 1);
                        ctx.strokeRect(x - half, cy - half, half * 2, half * 2);
                    }
                    else {
                        const sg = ctx.createRadialGradient(x - half * 0.35, cy - half * 0.4, half * 0.1, x, cy, half);
                        sg.addColorStop(0, 'rgba(255,255,255,1)');
                        sg.addColorStop(0.35, rgba(OBJ_RGBS[i], 1));
                        sg.addColorStop(1, rgba(OBJ_EDGE[i], 1));
                        ctx.fillStyle = sg;
                        ctx.beginPath();
                        ctx.arc(x, cy, half, 0, PI2);
                        ctx.fill();
                    }
                    ctx.fillStyle = rgba(INK_RGB, 0.7);
                    ctx.font = '500 10px ' + FONT;
                    ctx.textAlign = 'center';
                    ctx.fillText('h ' + String(Math.round(h)), x, GROUND_Y + 22);
                }
                glow(ctx, lx, 24, 30, [255, 226, 150], 0.9);
            }
        };
        return scene;
    }
    function main(rootEl, canvas, statusEl, btnEl) {
        const ctx0 = canvas.getContext('2d');
        if (!ctx0) {
            return function () { return; };
        }
        canvas.width = W;
        canvas.height = H;
        const scene = makeScene(ctx0);
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce) {
            rootEl.classList.remove('is-demo');
        }
        let paused = false;
        let autoplay = !reduce;
        let elapsed = reduce ? REDUCE_START_MS : 0;
        let rafId = 0;
        let lastTs = null;
        let accMs = 0;
        let tgt = scene.path(elapsed);
        const cleaners = [];
        function listen(target, type, fn) {
            target.addEventListener(type, fn);
            cleaners.push(function () { target.removeEventListener(type, fn); });
        }
        function setMode() {
            if (reduce) {
                statusEl.textContent = 'Stepping one scene at a time';
                btnEl.textContent = 'Next scene';
                return;
            }
            statusEl.textContent = !autoplay ? 'Manual control' : (paused ? 'Paused' : 'Demo running');
            btnEl.textContent = (autoplay && !paused) ? 'Pause' : 'Play';
        }
        function toLocal(e) {
            const r = canvas.getBoundingClientRect();
            return [clamp((e.clientX - r.left) * W / r.width, 0, W), clamp((e.clientY - r.top) * H / r.height, 0, H)];
        }
        function takeOver() {
            if (reduce || !autoplay) {
                return;
            }
            autoplay = false;
            paused = false;
            rootEl.classList.remove('is-demo');
            const p = scene.pos();
            tgt = [p[0], p[1]];
            setMode();
        }
        function afterInput() {
            if (reduce) {
                scene.snap(tgt[0], tgt[1]);
                scene.draw(elapsed);
            }
        }
        function onButton() {
            if (reduce) {
                elapsed += REDUCE_STEP_MS;
                tgt = scene.path(elapsed);
                scene.snap(tgt[0], tgt[1]);
                scene.draw(elapsed);
                return;
            }
            if (autoplay && !paused) {
                paused = true;
            }
            else {
                paused = false;
                autoplay = true;
                rootEl.classList.add('is-demo');
            }
            setMode();
        }
        function tick(ts) {
            if (lastTs === null) {
                lastTs = ts;
            }
            const frameDt = Math.min(ts - lastTs, 160);
            lastTs = ts;
            if (!paused) {
                accMs += frameDt;
                while (accMs >= FIXED_DT) {
                    elapsed += FIXED_DT;
                    accMs -= FIXED_DT;
                    if (autoplay) {
                        tgt = scene.path(elapsed);
                    }
                    scene.update(tgt[0], tgt[1]);
                }
                scene.draw(elapsed);
            }
            rafId = requestAnimationFrame(tick);
        }
        listen(btnEl, 'click', function () { onButton(); });
        listen(canvas, 'pointerdown', function (e) {
            takeOver();
            tgt = toLocal(e);
            afterInput();
        });
        listen(canvas, 'pointermove', function (e) {
            if (autoplay && !reduce) {
                return;
            }
            tgt = toLocal(e);
            afterInput();
        });
        listen(canvas, 'keydown', function (e) {
            const k = e.key;
            if (k === 'Enter' || k === ' ') {
                e.preventDefault();
                onButton();
                return;
            }
            let dx = 0;
            let dy = 0;
            if (k === 'ArrowLeft') {
                dx = -KEY_STEP;
            }
            else if (k === 'ArrowRight') {
                dx = KEY_STEP;
            }
            else if (k === 'ArrowUp') {
                dy = -KEY_STEP;
            }
            else if (k === 'ArrowDown') {
                dy = KEY_STEP;
            }
            else {
                return;
            }
            e.preventDefault();
            takeOver();
            tgt = [clamp(tgt[0] + dx, 0, W), clamp(tgt[1] + dy, 0, H)];
            afterInput();
        });
        if (reduce) {
            scene.snap(tgt[0], tgt[1]);
            scene.draw(elapsed);
            setMode();
        }
        else {
            scene.draw(elapsed);
            setMode();
            rafId = requestAnimationFrame(tick);
        }
        function destroy() {
            cancelAnimationFrame(rafId);
            for (let i = 0; i < cleaners.length; i += 1) {
                cleaners[i]();
            }
        }
        return destroy;
    }
    main(document.getElementById('scRoot'), document.getElementById('scCanvas'), document.getElementById('scStatus'), document.getElementById('scBtn'));
})();
</script>
</body>
</html>
