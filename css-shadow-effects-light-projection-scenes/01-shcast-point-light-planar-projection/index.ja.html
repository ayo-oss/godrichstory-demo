<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光が回ると床に投影される影 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sc is-demo" id="scRoot">
  <canvas class="sc__canvas" id="scCanvas" width="480" height="300" tabindex="0" aria-label="光源の位置と物体の高さから角ごとに床の座標を計算し、光が回ると影が反対側へ回る。"></canvas>
  <p class="sc__status" id="scStatus" aria-live="polite">デモ実行中</p>
  <button class="sc__btn" id="scBtn" type="button">一時停止</button>
  <p class="sc__caption">光源の位置と物体の高さから角ごとに床の座標を計算し、光が回ると影が反対側へ回る。</p>
</div>
</main>
<script>
(function () {
    const W = 480;
    const H = 300;
    const PI2 = Math.PI * 2;
    const FIXED_DT = 16;
    const REDUCE_STEP_MS = 900;
    const REDUCE_START_MS = 1000;
    const PERIOD_MS = 4000;
    const KEY_STEP = 12;
    const FONT = '-apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a.toFixed(3) + ')';
    }
    // 시드 고정 난수 — 같은 시드면 언제나 같은 수열
    function mulberry32(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6D2B79F5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function glow(ctx, x, y, r, c, a) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, rgba(c, a));
        g.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    function polyPath(ctx, poly) {
        ctx.beginPath();
        for (let i = 0; i < poly.length; i += 1) {
            if (i === 0) {
                ctx.moveTo(poly[i][0], poly[i][1]);
            }
            else {
                ctx.lineTo(poly[i][0], poly[i][1]);
            }
        }
        ctx.closePath();
    }
    // 광원 (lx, ly, lh) 에서 점 (x, y, h) 를 바닥 높이 0 으로 내리는 투영 — 닮음비 lh / (lh - h)
    function castPoint(lx, ly, lh, x, y, h) {
        const k = lh / Math.max(lh - h, 8);
        return [lx + (x - lx) * k, ly + (y - ly) * k];
    }
    // 볼록 껍질 (단조 체인) — 바닥 꼭짓점과 투영된 윗 꼭짓점을 한 덩어리 그림자로 묶는다
    function hull(src) {
        const p = src.slice().sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
        function cross(o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); }
        const lo = [];
        for (let i = 0; i < p.length; i += 1) {
            while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p[i]) <= 0) {
                lo.pop();
            }
            lo.push(p[i]);
        }
        const up = [];
        for (let i = p.length - 1; i >= 0; i -= 1) {
            while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p[i]) <= 0) {
                up.pop();
            }
            up.push(p[i]);
        }
        lo.pop();
        up.pop();
        return lo.concat(up);
    }
    // 직육면체 한 개의 그림자 다각형 — 바닥 네 꼭짓점과 높이 h 위 네 꼭짓점을 광원에서 투영한다
    function boxShadow(lx, ly, lh, x0, y0, x1, y1, h) {
        const base = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
        const pts = base.slice();
        for (let i = 0; i < base.length; i += 1) {
            pts.push(castPoint(lx, ly, lh, base[i][0], base[i][1], h));
        }
        return hull(pts);
    }
    function fillShadow(ctx, poly, ink, alpha) {
        polyPath(ctx, poly);
        ctx.fillStyle = rgba(ink, alpha);
        ctx.fill();
        ctx.lineJoin = 'round';
        ctx.lineWidth = 7;
        ctx.strokeStyle = rgba(ink, alpha * 0.32);
        ctx.stroke();
    }
    // 비스듬히 본 직육면체 — 윗면은 높이의 0.6 만큼 위로 밀고 앞면을 아래에 붙인다
    function drawBlock(ctx, x0, y0, x1, y1, h, top, front) {
        const vis = h * 0.6;
        ctx.fillStyle = rgba(front, 1);
        ctx.fillRect(x0, y1 - vis, x1 - x0, vis);
        ctx.fillStyle = rgba(top, 1);
        ctx.fillRect(x0, y0 - vis, x1 - x0, y1 - y0);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(x0, y0 - vis, x1 - x0, 2);
    }
    const LIGHT_HEIGHT = 220;
    const ORBIT_RADIUS = 110;
    const LIGHT_LERP = 0.2;
    const BOX_HEIGHT = 70;
    const BOX_RECT = [212, 140, 268, 178];
    const CENTER_X = 240;
    const CENTER_Y = 150;
    const FLOOR_RGB = [243, 238, 250];
    const SHADOW_RGB = [74, 56, 120];
    const WARM_RGB = [255, 226, 150];
    const LILAC_TOP = [196, 172, 255];
    const LILAC_FRONT = [150, 120, 232];
    function makeScene(ctx) {
        let lx = CENTER_X + ORBIT_RADIUS;
        let ly = CENTER_Y;
        const scene = {
            path: function (t) {
                const a = PI2 * t / PERIOD_MS;
                return [CENTER_X + ORBIT_RADIUS * Math.cos(a), CENTER_Y + ORBIT_RADIUS * 0.72 * Math.sin(a)];
            },
            pos: function () { return [lx, ly]; },
            update: function (tx, ty) {
                lx = lerp(lx, tx, LIGHT_LERP);
                ly = lerp(ly, ty, LIGHT_LERP);
            },
            snap: function (tx, ty) { lx = tx; ly = ty; },
            draw: function () {
                ctx.fillStyle = rgba(FLOOR_RGB, 1);
                ctx.fillRect(0, 0, W, H);
                glow(ctx, lx, ly, 300, WARM_RGB, 0.95);
                const poly = boxShadow(lx, ly, LIGHT_HEIGHT, BOX_RECT[0], BOX_RECT[1], BOX_RECT[2], BOX_RECT[3], BOX_HEIGHT);
                fillShadow(ctx, poly, SHADOW_RGB, 0.46);
                drawBlock(ctx, BOX_RECT[0], BOX_RECT[1], BOX_RECT[2], BOX_RECT[3], BOX_HEIGHT, LILAC_TOP, LILAC_FRONT);
                glow(ctx, lx, ly, 26, [255, 255, 255], 0.9);
                ctx.beginPath();
                ctx.arc(lx, ly, 7, 0, PI2);
                ctx.fillStyle = 'rgba(255,248,214,1)';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(214,170,70,0.9)';
                ctx.stroke();
            }
        };
        return scene;
    }
    function main(rootEl, canvas, statusEl, btnEl) {
        const ctx0 = canvas.getContext('2d');
        if (!ctx0) {
            return function () { return; };
        }
        canvas.width = W;
        canvas.height = H;
        const scene = makeScene(ctx0);
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce) {
            rootEl.classList.remove('is-demo');
        }
        let paused = false;
        let autoplay = !reduce;
        let elapsed = reduce ? REDUCE_START_MS : 0;
        let rafId = 0;
        let lastTs = null;
        let accMs = 0;
        let tgt = scene.path(elapsed);
        const cleaners = [];
        function listen(target, type, fn) {
            target.addEventListener(type, fn);
            cleaners.push(function () { target.removeEventListener(type, fn); });
        }
        function setMode() {
            if (reduce) {
                statusEl.textContent = '一場面ずつ送っています';
                btnEl.textContent = '次の場面';
                return;
            }
            statusEl.textContent = !autoplay ? '手動操作中' : (paused ? '一時停止中' : 'デモ実行中');
            btnEl.textContent = (autoplay && !paused) ? '一時停止' : '再生';
        }
        function toLocal(e) {
            const r = canvas.getBoundingClientRect();
            return [clamp((e.clientX - r.left) * W / r.width, 0, W), clamp((e.clientY - r.top) * H / r.height, 0, H)];
        }
        function takeOver() {
            if (reduce || !autoplay) {
                return;
            }
            autoplay = false;
            paused = false;
            rootEl.classList.remove('is-demo');
            const p = scene.pos();
            tgt = [p[0], p[1]];
            setMode();
        }
        function afterInput() {
            if (reduce) {
                scene.snap(tgt[0], tgt[1]);
                scene.draw(elapsed);
            }
        }
        function onButton() {
            if (reduce) {
                elapsed += REDUCE_STEP_MS;
                tgt = scene.path(elapsed);
                scene.snap(tgt[0], tgt[1]);
                scene.draw(elapsed);
                return;
            }
            if (autoplay && !paused) {
                paused = true;
            }
            else {
                paused = false;
                autoplay = true;
                rootEl.classList.add('is-demo');
            }
            setMode();
        }
        function tick(ts) {
            if (lastTs === null) {
                lastTs = ts;
            }
            const frameDt = Math.min(ts - lastTs, 160);
            lastTs = ts;
            if (!paused) {
                accMs += frameDt;
                while (accMs >= FIXED_DT) {
                    elapsed += FIXED_DT;
                    accMs -= FIXED_DT;
                    if (autoplay) {
                        tgt = scene.path(elapsed);
                    }
                    scene.update(tgt[0], tgt[1]);
                }
                scene.draw(elapsed);
            }
            rafId = requestAnimationFrame(tick);
        }
        listen(btnEl, 'click', function () { onButton(); });
        listen(canvas, 'pointerdown', function (e) {
            takeOver();
            tgt = toLocal(e);
            afterInput();
        });
        listen(canvas, 'pointermove', function (e) {
            if (autoplay && !reduce) {
                return;
            }
            tgt = toLocal(e);
            afterInput();
        });
        listen(canvas, 'keydown', function (e) {
            const k = e.key;
            if (k === 'Enter' || k === ' ') {
                e.preventDefault();
                onButton();
                return;
            }
            let dx = 0;
            let dy = 0;
            if (k === 'ArrowLeft') {
                dx = -KEY_STEP;
            }
            else if (k === 'ArrowRight') {
                dx = KEY_STEP;
            }
            else if (k === 'ArrowUp') {
                dy = -KEY_STEP;
            }
            else if (k === 'ArrowDown') {
                dy = KEY_STEP;
            }
            else {
                return;
            }
            e.preventDefault();
            takeOver();
            tgt = [clamp(tgt[0] + dx, 0, W), clamp(tgt[1] + dy, 0, H)];
            afterInput();
        });
        if (reduce) {
            scene.snap(tgt[0], tgt[1]);
            scene.draw(elapsed);
            setMode();
        }
        else {
            scene.draw(elapsed);
            setMode();
            rafId = requestAnimationFrame(tick);
        }
        function destroy() {
            cancelAnimationFrame(rafId);
            for (let i = 0; i < cleaners.length; i += 1) {
                cleaners[i]();
            }
        }
        return destroy;
    }
    main(document.getElementById('scRoot'), document.getElementById('scCanvas'), document.getElementById('scStatus'), document.getElementById('scBtn'));
})();
</script>
</body>
</html>
