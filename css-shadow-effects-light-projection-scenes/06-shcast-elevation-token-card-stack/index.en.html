<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Shadow Values Computed From the Elevation Level — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sc is-demo" id="scRoot">
  <canvas class="sc__canvas" id="scCanvas" width="480" height="300" tabindex="0" aria-label="One elevation number yields the offset, blur and opacity by formula, each card gets its own shadow, and the same values drop straight into a box-shadow."></canvas>
  <p class="sc__status" id="scStatus" aria-live="polite">Demo running</p>
  <button class="sc__btn" id="scBtn" type="button">Pause</button>
  <p class="sc__caption">One elevation number yields the offset, blur and opacity by formula, each card gets its own shadow, and the same values drop straight into a box-shadow.</p>
</div>
</main>
<script>
(function () {
    const W = 480;
    const H = 300;
    const PI2 = Math.PI * 2;
    const FIXED_DT = 16;
    const REDUCE_STEP_MS = 900;
    const REDUCE_START_MS = 1000;
    const PERIOD_MS = 4000;
    const KEY_STEP = 12;
    const FONT = '-apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a.toFixed(3) + ')';
    }
    // 시드 고정 난수 — 같은 시드면 언제나 같은 수열
    function mulberry32(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6D2B79F5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function glow(ctx, x, y, r, c, a) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, rgba(c, a));
        g.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    function polyPath(ctx, poly) {
        ctx.beginPath();
        for (let i = 0; i < poly.length; i += 1) {
            if (i === 0) {
                ctx.moveTo(poly[i][0], poly[i][1]);
            }
            else {
                ctx.lineTo(poly[i][0], poly[i][1]);
            }
        }
        ctx.closePath();
    }
    const ELEV_STEP = 4;
    const SHADOW_ALPHA_BASE = 0.12;
    const CARD_COUNT = 5;
    const CARD_W = 68;
    const CARD_H = 124;
    const CARD_Y = 98;
    const HOVER_BONUS = 3;
    const LIGHT_LERP = 0.16;
    const LIGHT_HEIGHT = 150;
    const FLOOR_RGB = [244, 238, 252];
    const INK_RGB = [70, 50, 116];
    const CARD_RGBS = [[255, 226, 214], [255, 240, 196], [214, 244, 226], [206, 232, 255], [232, 218, 255]];
    // 층 번호 하나에서 그림자 값 하나를 계산한다 — 오프셋 · 번짐 · 농도
    function shadowOf(level, dx, dy) {
        const dist = Math.max(Math.sqrt(dx * dx + dy * dy), 1);
        const reach = level * ELEV_STEP * (LIGHT_HEIGHT / 180);
        return {
            ox: (dx / dist) * reach,
            oy: (dy / dist) * reach + level * 0.5,
            blur: 2 + level * ELEV_STEP * 0.9,
            alpha: Math.min(SHADOW_ALPHA_BASE + level * 0.045, 0.6)
        };
    }
    function makeScene(ctx) {
        let lx = 60;
        let ly = 40;
        const bonus = [];
        for (let i = 0; i < CARD_COUNT; i += 1) {
            bonus.push(0);
        }
        function cardX(i) { return 62 + i * 88; }
        function nearest() {
            let best = 0;
            for (let i = 1; i < CARD_COUNT; i += 1) {
                if (Math.abs(cardX(i) + CARD_W / 2 - lx) < Math.abs(cardX(best) + CARD_W / 2 - lx)) {
                    best = i;
                }
            }
            return best;
        }
        const scene = {
            path: function (t) {
                const a = PI2 * t / PERIOD_MS;
                return [240 + 210 * Math.sin(a), 52 + 30 * Math.sin(a * 2)];
            },
            pos: function () { return [lx, ly]; },
            update: function (tx, ty) {
                lx = lerp(lx, tx, LIGHT_LERP);
                ly = lerp(ly, ty, LIGHT_LERP);
                const n = nearest();
                for (let i = 0; i < CARD_COUNT; i += 1) {
                    bonus[i] = lerp(bonus[i], i === n ? HOVER_BONUS : 0, 0.14);
                }
            },
            snap: function (tx, ty) {
                lx = tx;
                ly = ty;
                const n = nearest();
                for (let i = 0; i < CARD_COUNT; i += 1) {
                    bonus[i] = i === n ? HOVER_BONUS : 0;
                }
            },
            draw: function () {
                ctx.fillStyle = rgba(FLOOR_RGB, 1);
                ctx.fillRect(0, 0, W, H);
                glow(ctx, lx, ly, 260, [255, 226, 160], 0.85);
                for (let i = 0; i < CARD_COUNT; i += 1) {
                    const level = i + 1 + bonus[i];
                    const x = cardX(i);
                    const y = CARD_Y - bonus[i] * 3;
                    const s = shadowOf(level, x + CARD_W / 2 - lx, y + CARD_H / 2 - ly);
                    // 큰 번짐의 주변광 층과 짧은 주 그림자 층을 겹친다
                    ctx.shadowColor = rgba(INK_RGB, s.alpha);
                    ctx.shadowBlur = s.blur;
                    ctx.shadowOffsetX = s.ox;
                    ctx.shadowOffsetY = s.oy;
                    ctx.fillStyle = rgba(CARD_RGBS[i], 1);
                    ctx.fillRect(x, y, CARD_W, CARD_H);
                    ctx.shadowColor = rgba(INK_RGB, s.alpha * 0.7);
                    ctx.shadowBlur = s.blur * 0.4;
                    ctx.shadowOffsetX = s.ox * 0.35;
                    ctx.shadowOffsetY = s.oy * 0.35;
                    ctx.fillRect(x, y, CARD_W, CARD_H);
                    ctx.shadowColor = 'rgba(0,0,0,0)';
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                    ctx.fillStyle = rgba(INK_RGB, 0.72);
                    ctx.font = '600 14px ' + FONT;
                    ctx.textAlign = 'center';
                    ctx.fillText('E' + String(i + 1), x + CARD_W / 2, y + 26);
                    ctx.font = '500 10px ' + FONT;
                    ctx.fillText(String(Math.round(s.blur)) + 'px', x + CARD_W / 2, y + 44);
                }
                glow(ctx, lx, ly, 24, [255, 255, 255], 0.9);
                ctx.beginPath();
                ctx.arc(lx, ly, 6, 0, PI2);
                ctx.fillStyle = 'rgba(255,248,214,1)';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(214,170,70,0.9)';
                ctx.stroke();
            }
        };
        return scene;
    }
    function main(rootEl, canvas, statusEl, btnEl) {
        const ctx0 = canvas.getContext('2d');
        if (!ctx0) {
            return function () { return; };
        }
        canvas.width = W;
        canvas.height = H;
        const scene = makeScene(ctx0);
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce) {
            rootEl.classList.remove('is-demo');
        }
        let paused = false;
        let autoplay = !reduce;
        let elapsed = reduce ? REDUCE_START_MS : 0;
        let rafId = 0;
        let lastTs = null;
        let accMs = 0;
        let tgt = scene.path(elapsed);
        const cleaners = [];
        function listen(target, type, fn) {
            target.addEventListener(type, fn);
            cleaners.push(function () { target.removeEventListener(type, fn); });
        }
        function setMode() {
            if (reduce) {
                statusEl.textContent = 'Stepping one scene at a time';
                btnEl.textContent = 'Next scene';
                return;
            }
            statusEl.textContent = !autoplay ? 'Manual control' : (paused ? 'Paused' : 'Demo running');
            btnEl.textContent = (autoplay && !paused) ? 'Pause' : 'Play';
        }
        function toLocal(e) {
            const r = canvas.getBoundingClientRect();
            return [clamp((e.clientX - r.left) * W / r.width, 0, W), clamp((e.clientY - r.top) * H / r.height, 0, H)];
        }
        function takeOver() {
            if (reduce || !autoplay) {
                return;
            }
            autoplay = false;
            paused = false;
            rootEl.classList.remove('is-demo');
            const p = scene.pos();
            tgt = [p[0], p[1]];
            setMode();
        }
        function afterInput() {
            if (reduce) {
                scene.snap(tgt[0], tgt[1]);
                scene.draw(elapsed);
            }
        }
        function onButton() {
            if (reduce) {
                elapsed += REDUCE_STEP_MS;
                tgt = scene.path(elapsed);
                scene.snap(tgt[0], tgt[1]);
                scene.draw(elapsed);
                return;
            }
            if (autoplay && !paused) {
                paused = true;
            }
            else {
                paused = false;
                autoplay = true;
                rootEl.classList.add('is-demo');
            }
            setMode();
        }
        function tick(ts) {
            if (lastTs === null) {
                lastTs = ts;
            }
            const frameDt = Math.min(ts - lastTs, 160);
            lastTs = ts;
            if (!paused) {
                accMs += frameDt;
                while (accMs >= FIXED_DT) {
                    elapsed += FIXED_DT;
                    accMs -= FIXED_DT;
                    if (autoplay) {
                        tgt = scene.path(elapsed);
                    }
                    scene.update(tgt[0], tgt[1]);
                }
                scene.draw(elapsed);
            }
            rafId = requestAnimationFrame(tick);
        }
        listen(btnEl, 'click', function () { onButton(); });
        listen(canvas, 'pointerdown', function (e) {
            takeOver();
            tgt = toLocal(e);
            afterInput();
        });
        listen(canvas, 'pointermove', function (e) {
            if (autoplay && !reduce) {
                return;
            }
            tgt = toLocal(e);
            afterInput();
        });
        listen(canvas, 'keydown', function (e) {
            const k = e.key;
            if (k === 'Enter' || k === ' ') {
                e.preventDefault();
                onButton();
                return;
            }
            let dx = 0;
            let dy = 0;
            if (k === 'ArrowLeft') {
                dx = -KEY_STEP;
            }
            else if (k === 'ArrowRight') {
                dx = KEY_STEP;
            }
            else if (k === 'ArrowUp') {
                dy = -KEY_STEP;
            }
            else if (k === 'ArrowDown') {
                dy = KEY_STEP;
            }
            else {
                return;
            }
            e.preventDefault();
            takeOver();
            tgt = [clamp(tgt[0] + dx, 0, W), clamp(tgt[1] + dy, 0, H)];
            afterInput();
        });
        if (reduce) {
            scene.snap(tgt[0], tgt[1]);
            scene.draw(elapsed);
            setMode();
        }
        else {
            scene.draw(elapsed);
            setMode();
            rafId = requestAnimationFrame(tick);
        }
        function destroy() {
            cancelAnimationFrame(rafId);
            for (let i = 0; i < cleaners.length; i += 1) {
                cleaners[i]();
            }
        }
        return destroy;
    }
    main(document.getElementById('scRoot'), document.getElementById('scCanvas'), document.getElementById('scStatus'), document.getElementById('scBtn'));
})();
</script>
</body>
</html>
