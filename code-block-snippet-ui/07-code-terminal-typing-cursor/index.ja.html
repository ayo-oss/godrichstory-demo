<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal typing cursor — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="term is-demo" id="term" role="button" tabindex="0" aria-label="もう一度再生">
    <div class="term__head">
      <svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M224 56v144a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V56a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8" opacity=".2"/><path d="M128 128a8 8 0 0 1-3 6.25l-40 32a8 8 0 1 1-10-12.5L107.19 128L75 102.25a8 8 0 1 1 10-12.5l40 32a8 8 0 0 1 3 6.25m48 24h-40a8 8 0 0 0 0 16h40a8 8 0 0 0 0-16m56-96v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16m-16 144V56H40v144z"/></g></svg>
      <span class="term__name">bash</span>
    </div>
    <div class="term__body">
      <div class="term__line">
        <span class="term__prompt" aria-hidden="true">$</span>
        <span class="term__cmd" id="term-cmd">npm i -D eslint prettier</span><span class="term__cursor" aria-hidden="true"></span>
      </div>
      <div class="term__out" id="term-out1"><span class="c">added </span><span class="n">2 packages</span><span class="c"> in 1.4s</span></div>
      <div class="term__out" id="term-out2"><span class="c">audited </span><span class="n">128 packages</span><span class="c"> in 2.1s</span></div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 사람이 터미널을 누르거나 Enter/Space 로 초점을 주면 실제 setTimeout 으로 다시 타이핑한다 (CSS 루프는 멈춘다)
(function () {
  var CMD = 'npm i -D eslint prettier';
  var root = document.getElementById('term');
  var cmd = document.getElementById('term-cmd');
  var out1 = document.getElementById('term-out1');
  var out2 = document.getElementById('term-out2');
  var timers = [];
  function clear() { timers.forEach(function (t) { clearTimeout(t); }); timers = []; }
  function show(el, on) { el.style.opacity = on ? '1' : '0'; el.style.transform = on ? 'translateY(0)' : 'translateY(8px)'; }
  function play() {
    root.classList.remove('is-demo');
    clear();
    cmd.textContent = '';
    cmd.style.width = '0ch';
    show(out1, false);
    show(out2, false);
    var i = 0;
    (function tick() {
      i += 1;
      cmd.textContent = CMD.slice(0, i);
      cmd.style.width = i + 'ch';
      if (i < CMD.length) {
        timers.push(setTimeout(tick, 36));
      } else {
        timers.push(setTimeout(function () { show(out1, true); }, 240));
        timers.push(setTimeout(function () { show(out2, true); }, 520));
      }
    })();
  }
  root.addEventListener('click', play);
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); }
  });
})();
</script>
</body>
</html>
