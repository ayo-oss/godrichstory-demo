<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inline token popover — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="tp is-demo" id="tp">
    <div class="tp__head">
      <svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M144 176a8 8 0 0 1-8 8a16 16 0 0 1-16-16v-40a8 8 0 0 1 0-16a16 16 0 0 1 16 16v40a8 8 0 0 1 8 8m88-48A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88m-92-32a12 12 0 1 0-12-12a12 12 0 0 0 12 12"/></g></svg>
      <span class="tp__label">tips.md</span>
    </div>
    <div class="tp__body" id="tp-body">
      <p class="tp__line">Round the corners with <button class="tok" id="tp-tok1" type="button" aria-describedby="tp-pop1" aria-label="Show description">border-radius</button>.</p>
      <p class="tp__line">Lift the card using <button class="tok" id="tp-tok2" type="button" aria-describedby="tp-pop2" aria-label="Show description">box-shadow</button>.</p>
      <pre class="tp__code"><code><span class="ln"><span class="k">border-radius</span><span class="c">:</span> <span class="n">16px</span><span class="c">;</span></span><span class="ln"><span class="k">box-shadow</span><span class="c">:</span> <span class="s">0 8px 16px</span> <span class="n">rgba(0,0,0,.18)</span><span class="c">;</span></span></code></pre>
      <span class="tp__ptr" id="tp-ptr" aria-hidden="true"></span>
      <div class="tp__pop" id="tp-pop1" role="tooltip">The radius that rounds off the corners.</div>
      <div class="tp__pop" id="tp-pop2" role="tooltip">The shadow that gives a floating feel.</div>
    </div>
  </div>
</main>
<script>
// real JS: hover/focus/click shows the matching popover, Esc closes it
(function () {
  var root = document.getElementById('tp');
  var tok1 = document.getElementById('tp-tok1');
  var tok2 = document.getElementById('tp-tok2');
  var pop1 = document.getElementById('tp-pop1');
  var pop2 = document.getElementById('tp-pop2');
  function reset() {
    root.classList.remove('is-demo');
    tok1.classList.remove('is-on');
    tok2.classList.remove('is-on');
    pop1.classList.remove('is-open');
    pop2.classList.remove('is-open');
  }
  function open(tok, pop) {
    reset();
    tok.classList.add('is-on');
    pop.classList.add('is-open');
  }
  tok1.addEventListener('pointerenter', function () { open(tok1, pop1); });
  tok1.addEventListener('focus', function () { open(tok1, pop1); });
  tok1.addEventListener('click', function () { open(tok1, pop1); });
  tok2.addEventListener('pointerenter', function () { open(tok2, pop2); });
  tok2.addEventListener('focus', function () { open(tok2, pop2); });
  tok2.addEventListener('click', function () { open(tok2, pop2); });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { reset(); }
  });
})();
</script>
</body>
</html>
