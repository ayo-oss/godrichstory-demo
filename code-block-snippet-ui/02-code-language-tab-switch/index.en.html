<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language tab switch — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="lts is-demo" id="root">
    <div class="pane">
      <div class="pane__head">
        <div class="tabs" role="tablist" aria-label="Select language" id="tablist">
          <button class="tab" role="tab" id="tabCss" aria-selected="true" aria-controls="panelCss" data-lang="css" type="button">CSS</button>
          <button class="tab" role="tab" id="tabScss" aria-selected="false" aria-controls="panelScss" tabindex="-1" data-lang="scss" type="button">SCSS</button>
          <button class="tab" role="tab" id="tabTw" aria-selected="false" aria-controls="panelTw" tabindex="-1" data-lang="tailwind" type="button">Tailwind</button>
          <span class="tabs__indicator" id="indicator" aria-hidden="true"></span>
        </div>
      </div>
      <div class="pane__body">
        <pre class="panel" id="panelCss" role="tabpanel" aria-labelledby="tabCss"><code><span class="k">.btn</span> {
  <span class="k">display</span>: <span class="s">flex</span>;
  <span class="k">align-items</span>: <span class="s">center</span>;
  <span class="k">gap</span>: <span class="n">8px</span>;
  <span class="k">padding</span>: <span class="n">8px</span> <span class="n">16px</span>;
}</code></pre>
        <pre class="panel" id="panelScss" role="tabpanel" aria-labelledby="tabScss" hidden><code><span class="k">.btn</span> {
  <span class="k">display</span>: <span class="s">flex</span>;
  <span class="k">gap</span>: <span class="n">8px</span>;
  <span class="k">&amp;:hover</span> { <span class="k">opacity</span>: <span class="n">.8</span>; }
}</code></pre>
        <pre class="panel" id="panelTw" role="tabpanel" aria-labelledby="tabTw" hidden><code><span class="c">&lt;button class="</span>
  <span class="s">flex items-center gap-2</span>
  <span class="s">px-4 py-2 rounded-xl</span>
<span class="c">"&gt;</span>
  Copy
<span class="c">&lt;/button&gt;</span></code></pre>
      </div>
    </div>
  </div>
</main>
<script>
var root = document.getElementById('root');
var tablist = document.getElementById('tablist');
var indicator = document.getElementById('indicator');
var tabs = [document.getElementById('tabCss'), document.getElementById('tabScss'), document.getElementById('tabTw')];
var panels = [document.getElementById('panelCss'), document.getElementById('panelScss'), document.getElementById('panelTw')];

function moveIndicator(tab) {
  var tabsRect = tablist.getBoundingClientRect();
  var r = tab.getBoundingClientRect();
  var base = tabs[0].getBoundingClientRect().width;
  var left = r.left - tabsRect.left;
  var scale = r.width / base;
  indicator.style.transform = 'translateX(' + left + 'px) scaleX(' + scale + ')';
}

function select(i) {
  tabs.forEach(function (t, idx) {
    var on = idx === i;
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    t.tabIndex = on ? 0 : -1;
    panels[idx].hidden = !on;
  });
  moveIndicator(tabs[i]);
}

tabs.forEach(function (t, i) {
  t.addEventListener('click', function () {
    root.classList.remove('is-demo');
    select(i);
  });
});

tablist.addEventListener('keydown', function (e) {
  var i = tabs.findIndex(function (t) { return t.getAttribute('aria-selected') === 'true'; });
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    root.classList.remove('is-demo');
    var next = e.key === 'ArrowRight' ? (i + 1) % tabs.length : (i - 1 + tabs.length) % tabs.length;
    select(next);
    tabs[next].focus({ preventScroll: true });
    e.preventDefault();
  }
});
</script>
</body>
</html>
