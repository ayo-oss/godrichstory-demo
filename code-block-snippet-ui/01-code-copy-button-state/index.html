<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy button state — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ccb is-demo" id="root">
    <div class="pane">
      <div class="pane__head">
        <span class="pane__lang">CSS</span>
        <div class="pane__actions">
          <span class="pane__chip" id="chip" aria-hidden="true">클립보드에 담김</span>
          <button class="pane__copy" id="copyBtn" type="button" aria-label="코드 복사">
            <span class="copy__state copy__state--idle" id="stIdle">
              <svg class="ic" viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M216 40v128h-48V88H88V40Z" opacity=".2"/><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></g></svg>
              <span id="labelIdle">복사</span>
            </span>
            <span class="copy__state copy__state--done" id="stDone">
              <svg class="ic" viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg>
              <span>복사됨</span>
            </span>
          </button>
        </div>
      </div>
      <div class="pane__body">
        <span class="pane__sel" id="sel" aria-hidden="true"></span>
        <pre id="codeText"><code><span class="k">.btn</span> {
  <span class="k">display</span>: <span class="s">inline-flex</span>;
  <span class="k">align-items</span>: <span class="s">center</span>;
  <span class="k">gap</span>: <span class="n">8px</span>;
  <span class="k">padding</span>: <span class="n">8px</span> <span class="n">16px</span>;
  <span class="k">border-radius</span>: <span class="n">12px</span>;
}</code></pre>
      </div>
    </div>
    <span class="ccb__cursor" id="cursor" aria-hidden="true"></span>
    <span class="sr" id="live" role="status" aria-live="polite"></span>
  </div>
</main>
<script>
// 실제 동작: navigator.clipboard 가 없으면 조용히 넘어간다
var root = document.getElementById('root');
var btn = document.getElementById('copyBtn');
var codeText = document.getElementById('codeText');
var live = document.getElementById('live');
var timer = null;
btn.addEventListener('click', function () {
  root.classList.remove('is-demo');   // 사람이 누르면 자동 루프를 멈춘다
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(codeText.textContent).catch(function () {});
  }
  btn.classList.add('is-copied');
  live.textContent = '복사됨';
  clearTimeout(timer);
  timer = setTimeout(function () {
    btn.classList.remove('is-copied');
    live.textContent = '';
  }, 1600);
});
</script>
</body>
</html>
