<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Result preview split — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="rps is-demo" id="rps">
    <div class="rps__head">
      <span class="rps__file">badge.css</span>
      <div class="rps__tabs">
        <button class="rps__tab is-on" id="rps-code-btn" type="button" aria-pressed="true" aria-label="コードを見る">
          <svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="m240 128l-48 40H64l-48-40l48-40h128Z" opacity=".2"/><path d="M69.12 94.15L28.5 128l40.62 33.85a8 8 0 1 1-10.24 12.29l-48-40a8 8 0 0 1 0-12.29l48-40a8 8 0 0 1 10.24 12.3m176 27.7l-48-40a8 8 0 1 0-10.24 12.3L227.5 128l-40.62 33.85a8 8 0 1 0 10.24 12.29l48-40a8 8 0 0 0 0-12.29m-82.39-89.37a8 8 0 0 0-10.25 4.79l-64 176a8 8 0 0 0 4.79 10.26A8.1 8.1 0 0 0 96 224a8 8 0 0 0 7.52-5.27l64-176a8 8 0 0 0-4.79-10.25"/></g></svg>
        </button>
        <button class="rps__tab" id="rps-eye-btn" type="button" aria-pressed="false" aria-label="結果を見る">
          <svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M128 56c-80 0-112 72-112 72s32 72 112 72s112-72 112-72s-32-72-112-72m0 112a40 40 0 1 1 40-40a40 40 0 0 1-40 40" opacity=".2"/><path d="M247.31 124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57 61.26 162.88 48 128 48S61.43 61.26 36.34 86.35C17.51 105.18 9 124 8.69 124.76a8 8 0 0 0 0 6.5c.35.79 8.82 19.57 27.65 38.4C61.43 194.74 93.12 208 128 208s66.57-13.26 91.66-38.34c18.83-18.83 27.3-37.61 27.65-38.4a8 8 0 0 0 0-6.5M128 192c-30.78 0-57.67-11.19-79.93-33.25A133.5 133.5 0 0 1 25 128a133.3 133.3 0 0 1 23.07-30.75C70.33 75.19 97.22 64 128 64s57.67 11.19 79.93 33.25A133.5 133.5 0 0 1 231.05 128c-7.21 13.46-38.62 64-103.05 64m0-112a48 48 0 1 0 48 48a48.05 48.05 0 0 0-48-48m0 80a32 32 0 1 1 32-32a32 32 0 0 1-32 32"/></g></svg>
        </button>
      </div>
    </div>
    <div class="rps__stage">
      <span class="rps__ptr" id="rps-ptr" aria-hidden="true"></span>
      <pre class="rps__face rps__face--code" id="rps-code" aria-hidden="false"><code><span class="ln"><span class="k">.badge</span> <span class="c">{</span></span><span class="ln">  <span class="k">border-radius</span><span class="c">:</span> <span class="n">999px</span><span class="c">;</span></span><span class="ln">  <span class="k">background</span><span class="c">:</span> <span class="s">linear-gradient</span><span class="c">(#91a2c9, #bed4df);</span></span><span class="ln"><span class="c">}</span></span></code></pre>
      <div class="rps__face rps__face--result" id="rps-result" aria-hidden="true">
        <div class="rps__card" id="rps-card">
          <span class="rps__badge" id="rps-badge">新着</span>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 버튼 두 개가 코드 면 / 결과 면을 서로 바꾼다. aria-pressed 가 실제로 갱신된다
(function () {
  var root = document.getElementById('rps');
  var codeBtn = document.getElementById('rps-code-btn');
  var eyeBtn = document.getElementById('rps-eye-btn');
  var codeFace = document.getElementById('rps-code');
  var resultFace = document.getElementById('rps-result');
  function setView(showResult) {
    root.classList.remove('is-demo');
    codeBtn.setAttribute('aria-pressed', String(!showResult));
    eyeBtn.setAttribute('aria-pressed', String(showResult));
    codeBtn.classList.toggle('is-on', !showResult);
    eyeBtn.classList.toggle('is-on', showResult);
    codeFace.style.opacity = showResult ? '0' : '1';
    codeFace.style.visibility = showResult ? 'hidden' : 'visible';
    resultFace.style.opacity = showResult ? '1' : '0';
    resultFace.style.visibility = showResult ? 'visible' : 'hidden';
    codeFace.setAttribute('aria-hidden', String(showResult));
    resultFace.setAttribute('aria-hidden', String(!showResult));
  }
  codeBtn.addEventListener('click', function () { setView(false); });
  eyeBtn.addEventListener('click', function () { setView(true); });
})();
</script>
</body>
</html>
