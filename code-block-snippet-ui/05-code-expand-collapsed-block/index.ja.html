<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expand collapsed block — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ecb is-demo" id="root">
    <div class="pane">
      <div class="pane__head">
        <span class="pane__file">
          <svg class="ic" viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="m240 128l-48 40H64l-48-40l48-40h128Z" opacity=".2"/><path d="M69.12 94.15L28.5 128l40.62 33.85a8 8 0 1 1-10.24 12.29l-48-40a8 8 0 0 1 0-12.29l48-40a8 8 0 0 1 10.24 12.3m176 27.7l-48-40a8 8 0 1 0-10.24 12.3L227.5 128l-40.62 33.85a8 8 0 1 0 10.24 12.29l48-40a8 8 0 0 0 0-12.29m-82.39-89.37a8 8 0 0 0-10.25 4.79l-64 176a8 8 0 0 0 4.79 10.26A8.1 8.1 0 0 0 96 224a8 8 0 0 0 7.52-5.27l64-176a8 8 0 0 0-4.79-10.25"/></g></svg>
          config.js
        </span>
      </div>
      <div class="pane__body">
        <pre class="ecb__peek" id="peek"><code><span class="k">export</span> <span class="k">const</span> config = {
  theme: <span class="s">"auto"</span>,
  duration: <span class="n">220</span>,
  easing: <span class="s">"ease-out"</span>,<span class="ecb__more" id="more"><span class="ecb__moreInner"><span class="ecb__line">  radius: <span class="n">12</span>,</span><span class="ecb__line">  shadow: <span class="k">true</span>,</span><span class="ecb__line">  locale: <span class="s">"en-US"</span>,</span><span class="ecb__line">  retry: <span class="n">3</span>,</span><span class="ecb__line">};</span></span></span></code></pre>
        <span class="ecb__fade" aria-hidden="true"></span>
      </div>
      <div class="ecb__toggleRow">
        <button class="ecb__toggle" id="toggleBtn" type="button" aria-expanded="false" aria-controls="more">
          <span class="ecb__labelWrap">
            <span class="ecb__label ecb__label--more" id="labelMore">もっと見る</span>
            <span class="ecb__label ecb__label--less" id="labelLess" aria-hidden="true">折りたたむ</span>
          </span>
          <svg class="ic ecb__caret" viewBox="0 0 256 256" width="12" height="12" aria-hidden="true"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg>
        </button>
      </div>
    </div>
    <span class="ecb__cursor" id="cursor" aria-hidden="true"></span>
  </div>
</main>
<script>
var root = document.getElementById('root');
var btn = document.getElementById('toggleBtn');
var labelMore = document.getElementById('labelMore');
var labelLess = document.getElementById('labelLess');
function setState(open) {
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  labelMore.setAttribute('aria-hidden', open ? 'true' : 'false');
  labelLess.setAttribute('aria-hidden', open ? 'false' : 'true');
  root.classList.toggle('is-open', open);
}
btn.addEventListener('click', function () {
  // button 요소는 Enter/Space 를 이미 click 으로 보내므로 별도 keydown 처리가 필요 없다
  root.classList.remove('is-demo');
  setState(btn.getAttribute('aria-expanded') !== 'true');
});
</script>
</body>
</html>
