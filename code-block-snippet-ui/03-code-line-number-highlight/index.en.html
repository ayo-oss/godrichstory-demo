<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line number highlight — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="lnh is-demo" id="root">
    <div class="pane">
      <div class="pane__head">
        <span class="pane__lang">CSS</span>
      </div>
      <div class="pane__body">
        <pre id="codeText"><code class="lines"><span class="ln">.card {</span><span class="ln">  display: grid;</span><span class="ln is-called" id="calledLine" tabindex="0" aria-describedby="tip">  gap: 12px;</span><span class="ln">  padding: 16px;</span><span class="ln">}</span></code></pre>
      </div>
    </div>
    <div class="tooltip" id="tip" role="tooltip">Gap between cards</div>
    <span class="lnh__cursor" id="cursor" aria-hidden="true"></span>
  </div>
</main>
<script>
var root = document.getElementById('root');
var line = document.getElementById('calledLine');

function open() {
  root.classList.remove('is-demo');
  root.classList.add('is-open');
}
function close() {
  root.classList.remove('is-open');
}
line.addEventListener('mouseenter', open);
line.addEventListener('mouseleave', close);
line.addEventListener('focus', open);
line.addEventListener('blur', close);
</script>
</body>
</html>
