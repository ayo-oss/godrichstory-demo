<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filename window header — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="fw is-demo" id="fw">
    <div class="fw__head">
      <span class="fw__dots" aria-hidden="true">
        <span class="fw__dot fw__dot--1"></span>
        <span class="fw__dot fw__dot--2"></span>
        <span class="fw__dot fw__dot--3"></span>
      </span>
      <span class="fw__title">
        <span class="fw__icon" aria-hidden="true"><svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="M208 88h-56V32Z" opacity=".2"/><path d="M181.66 146.34a8 8 0 0 1 0 11.32l-24 24a8 8 0 0 1-11.32-11.32L164.69 152l-18.35-18.34a8 8 0 0 1 11.32-11.32Zm-72-24a8 8 0 0 0-11.32 0l-24 24a8 8 0 0 0 0 11.32l24 24a8 8 0 0 0 11.32-11.32L91.31 152l18.35-18.34a8 8 0 0 0 0-11.32M216 88v128a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16V40a16 16 0 0 1 16-16h96a8 8 0 0 1 5.66 2.34l56 56A8 8 0 0 1 216 88m-56-8h28.69L160 51.31Zm40 136V96h-48a8 8 0 0 1-8-8V40H56v176z"/></g></svg></span>
        <span class="fw__filenameSlot">
          <span class="fw__filename" id="fw-title">index.html</span>
          <span class="fw__filenameDemo fw__filenameDemo--1" aria-hidden="true">index.html</span>
          <span class="fw__filenameDemo fw__filenameDemo--2" aria-hidden="true">style.css</span>
        </span>
      </span>
    </div>
    <div class="fw__tabs" role="tablist" aria-labelledby="fw-title">
      <span class="fw__ptr" id="fw-ptr" aria-hidden="true"></span>
      <button class="fw__tab fw__tab--1" id="fw-tab1" type="button" role="tab" aria-selected="true" aria-controls="fw-panel1" tabindex="0">index.html</button>
      <button class="fw__tab fw__tab--2" id="fw-tab2" type="button" role="tab" aria-selected="false" aria-controls="fw-panel2" tabindex="-1">style.css</button>
    </div>
    <div class="fw__body">
      <pre class="fw__panel fw__panel--1 is-active" id="fw-panel1" role="tabpanel" aria-labelledby="fw-tab1" aria-hidden="false"><code><span class="c">&lt;</span><span class="k">section</span> class=<span class="s">"card"</span><span class="c">&gt;</span>
  <span class="c">&lt;</span><span class="k">h2</span><span class="c">&gt;</span>Hello<span class="c">&lt;/</span><span class="k">h2</span><span class="c">&gt;</span>
  <span class="c">&lt;</span><span class="k">p</span><span class="c">&gt;</span>Ship it.<span class="c">&lt;/</span><span class="k">p</span><span class="c">&gt;</span>
  <span class="c">&lt;</span><span class="k">button</span><span class="c">&gt;</span>Go<span class="c">&lt;/</span><span class="k">button</span><span class="c">&gt;</span>
<span class="c">&lt;/</span><span class="k">section</span><span class="c">&gt;</span></code></pre>
      <pre class="fw__panel fw__panel--2" id="fw-panel2" role="tabpanel" aria-labelledby="fw-tab2" aria-hidden="true"><code><span class="k">.card</span> <span class="c">{</span>
  padding: <span class="n">16px</span><span class="c">;</span>
  border-radius: <span class="n">12px</span><span class="c">;</span>
  box-shadow: <span class="n">0 2px 8px</span><span class="c">;</span>
<span class="c">}</span></code></pre>
    </div>
  </div>
</main>
<script>
var root = document.getElementById('fw');
var tabs = [document.getElementById('fw-tab1'), document.getElementById('fw-tab2')];
var panels = [document.getElementById('fw-panel1'), document.getElementById('fw-panel2')];
var titleEl = document.getElementById('fw-title');
function fwSelect(i) {
  root.classList.remove('is-demo');
  // 머리의 파일 이름이 켜진 탭을 따라간다 — 거짓 헤더 방지
  titleEl.textContent = tabs[i].textContent;
  tabs.forEach(function (t, idx) {
    var on = idx === i;
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    t.tabIndex = on ? 0 : -1;
  });
  panels.forEach(function (p, idx) {
    var on = idx === i;
    p.classList.toggle('is-active', on);
    p.setAttribute('aria-hidden', on ? 'false' : 'true');
  });
}
tabs.forEach(function (t, i) {
  t.addEventListener('click', function () {
    fwSelect(i);
    t.focus({ preventScroll: true });
  });
  t.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault();
    var next = (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    fwSelect(next);
    tabs[next].focus({ preventScroll: true });
  });
});
</script>
</body>
</html>
