<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diff added/removed — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cd is-demo" id="cd">
    <div class="cd__pane">
      <div class="cd__head">
        <span class="cd__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="M80 64a24 24 0 1 1-24-24a24 24 0 0 1 24 24m120 104a24 24 0 1 0 24 24a24 24 0 0 0-24-24" opacity=".2"/><path d="M112 152a8 8 0 0 0-8 8v28.69L66.34 151a8 8 0 0 1-2.34-5.63V95a32 32 0 1 0-16 0v50.38a23.85 23.85 0 0 0 7 17L92.69 200H64a8 8 0 0 0 0 16h48a8 8 0 0 0 8-8v-48a8 8 0 0 0-8-8M40 64a16 16 0 1 1 16 16a16 16 0 0 1-16-16m168 97v-50.37a23.85 23.85 0 0 0-7-17L163.31 56H192a8 8 0 0 0 0-16h-48a8 8 0 0 0-8 8v48a8 8 0 0 0 16 0V67.31L189.66 105a8 8 0 0 1 2.34 5.66V161a32 32 0 1 0 16 0m-8 47a16 16 0 1 1 16-16a16 16 0 0 1-16 16"/></g></svg></span>
        <span class="cd__file">config.css</span>
      </div>
      <span class="cd__cursor" aria-hidden="true"></span>
      <div class="cd__body">
        <div class="cd__line cd__line--top">
          <span class="cd__sign" aria-hidden="true"> </span><span class="cd__src"><span class="k">.card</span> <span class="p">{</span></span>
        </div>
        <button class="cd__fold" id="cd-fold" type="button" aria-expanded="false" aria-controls="cd-hidden" aria-label="가려진 줄 펼치기">
          <span class="cd__sign" aria-hidden="true"> </span><span class="cd__src cd__dots">···</span>
        </button>
        <div class="cd__fold-body" id="cd-hidden">
          <div class="cd__fold-in">
            <div class="cd__line">
              <span class="cd__sign" aria-hidden="true"> </span><span class="cd__src">&nbsp;&nbsp;<span class="k">display</span><span class="p">:</span> <span class="s">flex</span><span class="p">;</span></span>
            </div>
            <div class="cd__line">
              <span class="cd__sign" aria-hidden="true"> </span><span class="cd__src">&nbsp;&nbsp;<span class="k">align-items</span><span class="p">:</span> <span class="s">center</span><span class="p">;</span></span>
            </div>
          </div>
        </div>
        <div class="cd__line cd__line--del cd__line--del1">
          <span class="cd__sign">-</span><span class="cd__src">&nbsp;&nbsp;<span class="k">padding</span><span class="p">:</span> <span class="n">12px 16px</span><span class="p">;</span></span>
        </div>
        <div class="cd__line cd__line--del cd__line--del2">
          <span class="cd__sign">-</span><span class="cd__src">&nbsp;&nbsp;<span class="k">border-radius</span><span class="p">:</span> <span class="n">4px</span><span class="p">;</span></span>
        </div>
        <div class="cd__line cd__line--add cd__line--add1">
          <span class="cd__sign">+</span><span class="cd__src">&nbsp;&nbsp;<span class="k">padding</span><span class="p">:</span> <span class="n">16px 20px</span><span class="p">;</span></span>
        </div>
        <div class="cd__line cd__line--add cd__line--add2">
          <span class="cd__sign">+</span><span class="cd__src">&nbsp;&nbsp;<span class="k">border-radius</span><span class="p">:</span> <span class="n">12px</span><span class="p">;</span></span>
        </div>
        <div class="cd__line cd__line--top">
          <span class="cd__sign" aria-hidden="true"> </span><span class="cd__src"><span class="p">}</span></span>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 접힌 중간 줄을 펼치고 접는다. 사람이 누르면 자동 루프를 멈춘다
var cd = document.getElementById('cd');
var fold = document.getElementById('cd-fold');
fold.addEventListener('click', function () {
  cd.classList.remove('is-demo');
  var open = fold.getAttribute('aria-expanded') === 'true';
  fold.setAttribute('aria-expanded', String(!open));
  fold.setAttribute('aria-label', open ? '가려진 줄 펼치기' : '가려진 줄 접기');
  cd.classList.toggle('is-open', !open);
});
</script>
</body>
</html>
