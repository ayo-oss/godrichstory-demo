<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동굴 단면 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tcc" id="tcc">
  <p class="tcc__hint">
    <svg class="tcc__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88m32-88a32 32 0 1 0-32 32a32 32 0 0 0 32-32"/></g></svg>
    <span>シードを変えると別の洞窟が掘られます</span>
  </p>
  <div class="tcc__field" id="field">
    <canvas class="tcc__cv" id="cv"></canvas>
  </div>
  <div class="tcc__bar">
    <label class="tcc__dial">シード
      <input type="number" id="seed" min="1" max="9999" step="1" value="7" aria-label="洞窟シード">
    </label>
  </div>
</div>
</main>
<script>
// 동굴 단면 — 위아래 두 fbm 곡선으로 천장과 바닥을 그리고 clip 으로 그 사이 공동만 남긴다.
// 천장 곡선은 fbm, 바닥 곡선도 fbm(다른 오프셋) — 두 곡선 사이가 노이즈로 파낸 공동(cavity)이 된다.
// 종유석(천장에서 아래로)·석순(바닥에서 위로)은 노이즈 값이 높은 지점에 골라 배치한다:
// x 칸마다 vnoise 를 하나 더 읽어 문턱을 넘으면 그 길이로 밑뿌리를 내리는 식이다(좌표는 격자로 양자화).
// 천장·바닥 곡선 둘 다 옥타브 위상을 시간에 흘려 동굴이 살아 움직이게 한다(브리프 명시).
var root = document.getElementById('tcc');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var seedIn = document.getElementById('seed');

// 결정적 난수 — mulberry32. 같은 시드면 같은 수열을 돌려준다
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var PERM = new Uint8Array(512);
var VAL = new Float32Array(256);

// シード → PERM(순서표)·VAL(격자점 난수값) 재생성 — シード UI 가 이걸 다시 부른다
function buildTables(seed) {
  var rng = mulberry32(seed >>> 0);
  var p = [], i, j, t;
  for (i = 0; i < 256; i++) p[i] = i;
  for (i = 255; i > 0; i--) { j = (rng() * (i + 1)) | 0; t = p[i]; p[i] = p[j]; p[j] = t; }
  for (i = 0; i < 512; i++) PERM[i] = p[i & 255];
  for (i = 0; i < 256; i++) VAL[i] = rng();
}

function fade(t) { return t * t * (3 - 2 * t); }   // 스무스스텝 — 격자 경계에서 각이 안 지게

// 1차원 값 노이즈 — 격자점마다 난수를 하나 두고 그 사이를 fade 로 부드럽게 잇는다
function vnoise1(x) {
  var xi = Math.floor(x);
  var xf = x - xi;
  var a = VAL[PERM[xi & 255]], b = VAL[PERM[(xi + 1) & 255]];
  return a + (b - a) * fade(xf);
}

var OCT = 4;

// fbm — 주파수 2배·진폭 절반으로 4겹. 옥타브마다 자기 위상을 따로 흘려보낸다
function fbm1(x, sec, flow) {
  var sum = 0, amp = 0.5, norm = 0, f = 1;
  for (var i = 0; i < OCT; i++) {
    var phase = sec * flow * (i + 1);
    sum += vnoise1(x * f + phase) * amp;
    norm += amp;
    amp *= 0.5;
    f *= 2;
  }
  return sum / norm;
}

var CEIL_SCALE = 0.020, CEIL_FLOW = 9.0, CEIL_OFFSET = 17.3;
var FLOOR_SCALE = 0.017, FLOOR_FLOW = 7.5, FLOOR_OFFSET = 203.8;
var STAL_FLOW = 6.0;

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1;
var raf = 0;

var css = getComputedStyle(root);
function tok(name) { return css.getPropertyValue(name).trim(); }
var C_ROCK_TOP = tok('--rock-top'), C_ROCK_BOTTOM = tok('--rock-bottom');
var C_CAV_TOP = tok('--cav-top'), C_CAV_BOTTOM = tok('--cav-bottom');
var C_GLOW_TOP = tok('--glow-top'), C_GLOW_BOTTOM = tok('--glow-bottom');

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function ceilY(x, sec) {
  var n = fbm1(x * CEIL_SCALE + CEIL_OFFSET, sec, CEIL_FLOW);
  n = n * 1.7 - 0.35;   // 값 노이즈는 가운데로 몰린다 — 대비를 한 번 펴 준다
  if (n < 0.06) n = 0.06; else if (n > 0.62) n = 0.62;
  return H * (0.14 + n * 0.34);
}
function floorY(x, sec) {
  var n = fbm1(x * FLOOR_SCALE + FLOOR_OFFSET, sec, FLOOR_FLOW);
  n = n * 1.7 - 0.35;
  if (n < 0.30) n = 0.30; else if (n > 0.94) n = 0.94;
  return H * (0.44 + n * 0.40);
}

// 종유석 — x 칸마다 노이즈를 하나 더 읽어 문턱 위일 때만 내린다(좌표는 4px 격자로 양자화).
// 옆면은 quadraticCurveTo 로 안으로 휘게(밑뿌리가 좁아지는 물방울 곡선) — 진짜 종유석 단면처럼
function drawStalactites(sec) {
  ctx.fillStyle = C_ROCK_BOTTOM;
  var cell = 4;
  for (var gx = 2; gx < W; gx += cell) {
    var s = vnoise1(gx * 0.055 + 71.7 + sec * STAL_FLOW * 0.35);
    if (s > 0.62) {
      var len = (s - 0.62) / 0.38;              // 0..1 — 문턱을 얼마나 넘었나
      var top = ceilY(gx, sec);
      var h = 4 + len * H * 0.26;
      var w = 3 + Math.round(len * 3);
      var g = ctx.createLinearGradient(0, top, 0, top + h);
      g.addColorStop(0, C_ROCK_TOP);
      g.addColorStop(1, C_GLOW_BOTTOM);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(gx - w, top);
      ctx.quadraticCurveTo(gx - w * 0.15, top + h * 0.55, gx, top + h);
      ctx.quadraticCurveTo(gx + w * 0.15, top + h * 0.55, gx + w, top);
      ctx.closePath();
      ctx.fill();
    }
  }
  // 석순(stalagmite) — 바닥에서 위로, 다른 노이즈 창으로 자리를 골라 대칭을 피한다
  ctx.fillStyle = C_ROCK_TOP;
  for (var fx = 6; fx < W; fx += cell) {
    var s2 = vnoise1(fx * 0.055 + 141.9 + sec * STAL_FLOW * 0.3);
    if (s2 > 0.66) {
      var len2 = (s2 - 0.66) / 0.34;
      var fy = floorY(fx, sec);
      var h2 = 3 + len2 * H * 0.20;
      var w2 = 3 + Math.round(len2 * 3);
      var g2 = ctx.createLinearGradient(0, fy, 0, fy - h2);
      g2.addColorStop(0, C_ROCK_TOP);
      g2.addColorStop(1, C_GLOW_BOTTOM);
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.moveTo(fx - w2, fy);
      ctx.quadraticCurveTo(fx - w2 * 0.15, fy - h2 * 0.55, fx, fy - h2);
      ctx.quadraticCurveTo(fx + w2 * 0.15, fy - h2 * 0.55, fx + w2, fy);
      ctx.closePath();
      ctx.fill();
    }
  }
}

function paint(sec) {
  ctx.clearRect(0, 0, W, H);
  // 1) 바위 몸통 — 화면 전체를 어두운 암석 톤으로 깐다
  var rock = ctx.createLinearGradient(0, 0, 0, H);
  rock.addColorStop(0, C_ROCK_TOP);
  rock.addColorStop(1, C_ROCK_BOTTOM);
  ctx.fillStyle = rock;
  ctx.fillRect(0, 0, W, H);

  // 2) 공동 — 천장·바닥 두 fbm 곡선 사이만 clip 으로 남긴다
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, ceilY(0, sec));
  for (var x = 2; x <= W; x += 2) ctx.lineTo(x, ceilY(x, sec));
  for (var x2 = W; x2 >= 0; x2 -= 2) ctx.lineTo(x2, floorY(x2, sec));
  ctx.closePath();
  ctx.clip();
  var cav = ctx.createLinearGradient(0, 0, 0, H);
  cav.addColorStop(0, C_CAV_TOP);
  cav.addColorStop(1, C_CAV_BOTTOM);
  ctx.fillStyle = cav;
  ctx.fillRect(0, 0, W, H);
  // 공동 안쪽 빛 — 아래에서 올라오는 민트 채광
  var glow = ctx.createLinearGradient(0, H * 0.45, 0, H);
  glow.addColorStop(0, C_GLOW_TOP);
  glow.addColorStop(1, C_GLOW_BOTTOM);
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  // 3) 종유석·석순 — 공동 안에서만 그린다(clip 이 걸린 상태)
  drawStalactites(sec);
  ctx.restore();
}

function frame(now) {
  paint(now / 1000);
  raf = requestAnimationFrame(frame);
}

function onSeed() {
  var v = Math.max(1, Math.min(9999, Math.floor(Number(seedIn.value)) || 1));
  buildTables(v);
  if (reduce) paint(0);
}

seedIn.addEventListener('input', onSeed);
seedIn.addEventListener('change', onSeed);
window.addEventListener('resize', function () { fit(); if (reduce) paint(0); });

buildTables(Number(seedIn.value) || 7);
fit();
if (reduce) {
  // reduce — 루프를 시작하지 않고 시드가 정한 동굴 한 장만 그린다(빈 화면이 아니다)
  root.classList.add('is-still');
  paint(0);
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
