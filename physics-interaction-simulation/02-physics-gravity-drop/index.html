<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중력 드롭 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-drop" viewBox="0 0 256 256" fill="currentColor"><g><path d="M208 144a80 80 0 0 1-160 0c0-72 80-128 80-128s80 56 80 128" opacity=".2"/><path d="M174 47.75a254.2 254.2 0 0 0-41.45-38.3a8 8 0 0 0-9.18 0A254.2 254.2 0 0 0 82 47.75C54.51 79.32 40 112.6 40 144a88 88 0 0 0 176 0c0-31.4-14.51-64.68-42-96.25M128 216a72.08 72.08 0 0 1-72-72c0-57.23 55.47-105 72-118c16.53 13 72 60.75 72 118a72.08 72.08 0 0 1-72 72m55.89-62.66a57.6 57.6 0 0 1-46.56 46.55a9 9 0 0 1-1.33.11a8 8 0 0 1-1.32-15.89c16.57-2.79 30.63-16.85 33.44-33.45a8 8 0 0 1 15.78 2.68Z"/></g></symbol>
    <symbol id="ico-reset" viewBox="0 0 256 256" fill="currentColor"><g><path d="M232 136a104 104 0 1 1-38.17-80.55L208 60v-4a8 8 0 0 1 16 0v34a8 8 0 0 1-8 8h-34a8 8 0 0 1 0-16h7.6l-8.89-7.4A88 88 0 1 0 216 136a8 8 0 0 1 16 0Z" opacity=".2"/><path d="M232 136a104 104 0 1 1-38.17-80.55L208 60v-4a8 8 0 0 1 16 0v34a8 8 0 0 1-8 8h-34a8 8 0 0 1 0-16h7.6l-8.89-7.4A88 88 0 1 0 216 136a8 8 0 0 1 16 0Z"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="gd is-demo" id="gd">
  <p class="gd__hint"><svg class="gd__ico" aria-hidden="true"><use href="#ico-drop"/></svg><span>판을 클릭하면 네 공이 다시 떨어지고 반발 슬라이더 값만큼 튀어 오릅니다</span></p>
  <div class="gd__field" id="field" role="application" aria-label="중력 실험판" tabindex="0">
    <span class="gd__ball gd__ball--a" aria-hidden="true"></span>
    <span class="gd__ball gd__ball--b" aria-hidden="true"></span>
    <span class="gd__ball gd__ball--c" aria-hidden="true"></span>
    <span class="gd__ball gd__ball--d" aria-hidden="true"></span>
    <span class="gd__floor" aria-hidden="true"></span>
  </div>
  <div class="gd__bar">
    <label class="gd__dial">반발
      <input type="range" id="rest" min="0.3" max="0.9" step="0.02" value="0.62" aria-label="반발계수">
      <b class="gd__val" id="restVal">0.62</b>
    </label>
    <button class="gd__drop" id="drop" type="button">
      <svg class="gd__ico" aria-hidden="true"><use href="#ico-drop"/></svg><span>다시 떨어뜨리기</span>
    </button>
  </div>
</div>
</main>
<script>
var root = document.getElementById('gd');
var field = document.getElementById('field');
var els = {
  a: root.querySelector('.gd__ball--a'),
  b: root.querySelector('.gd__ball--b'),
  c: root.querySelector('.gd__ball--c'),
  d: root.querySelector('.gd__ball--d')
};
var restIn = document.getElementById('rest');
var restVal = document.getElementById('restVal');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
// 공 4개: 크기(px) 와 기준 x 위치(424px 판 기준). 실제 판 폭에 비례해 얹는다.
// 무게는 크기에 비례한다고 보고 반발은 전 공 공통 값 하나로 쓴다
var SPEC = [ { el: 'a', size: 28, x: 34 }, { el: 'b', size: 20, x: 132 }, { el: 'c', size: 24, x: 230 }, { el: 'd', size: 16, x: 322 } ];
var G = 1800, balls = [], last = 0, running = false;

function scaledX(x) { return x * field.clientWidth / 424; }
function reset(top) {
  balls = SPEC.map(function (s) {
    var y = top ? 4 : field.clientHeight - s.size;
    return { el: els[s.el], size: s.size, x: scaledX(s.x), y: y, vx: 0, vy: 0, done: !top };
  });
  paint();
}
function paint() {
  for (var i = 0; i < balls.length; i++) {
    balls[i].el.style.transform = 'translate(' + balls[i].x + 'px, ' + balls[i].y + 'px)';
  }
}
function step(now) {
  var dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  var e = Number(restIn.value), floor = field.clientHeight, all = true;
  for (var i = 0; i < balls.length; i++) {
    var b = balls[i];
    if (b.done) { continue; }
    b.vy += G * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    // 바닥 충돌: 반발계수만큼 세게 되튕기고 남은 속도가 느리면 바닥에 붙여 끝낸다
    if (b.y + b.size >= floor) {
      b.y = floor - b.size;
      if (Math.abs(b.vy) > 40) { b.vy = -b.vy * e; }
      else { b.vy = 0; b.done = true; }
    }
    // 공끼리: 겹친 만큼 서로 민다 (간이 충돌 — 속도 교환까지는 하지 않는다)
    for (var j = i + 1; j < balls.length; j++) {
      var o = balls[j];
      var dx = o.x - b.x, dy = o.y - b.y, gap = (b.size + o.size) / 2;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 0 && dist < gap) {
        var push = (gap - dist) / 2, nx = dx / dist, ny = dy / dist;
        b.x -= nx * push; b.y -= ny * push;
        o.x += nx * push; o.y += ny * push;
      }
    }
    if (!b.done) { all = false; }
  }
  paint();
  if (all) { running = false; return; }
  requestAnimationFrame(step);
}
function drop() {
  root.classList.remove('is-demo');
  if (reduce.matches) { reset(false); return; }
  reset(true);
  if (!running) { running = true; last = performance.now(); requestAnimationFrame(step); }
}
field.addEventListener('pointerdown', drop);
document.getElementById('drop').addEventListener('click', drop);
field.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); drop(); }
});
restIn.addEventListener('input', function () { restVal.textContent = Number(restIn.value).toFixed(2); });
window.addEventListener('resize', function () { reset(false); });
reset(false);
</script>
</body>
</html>
