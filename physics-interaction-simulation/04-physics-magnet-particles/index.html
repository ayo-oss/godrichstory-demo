<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자석 파티클 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-magnet" viewBox="0 0 256 256" fill="currentColor"><g><path d="m168.36 200.36l-30 29.35a8 8 0 0 1-11.26-.05L98.46 201a8 8 0 0 1 .08-11.4l30-29Zm-142-82.76a8 8 0 0 0 0 11.28L55 157.54a8 8 0 0 0 11.38-.06l29.18-29.92l-39.79-39.79Z" opacity=".2"/><path d="M207 50.25A87.46 87.46 0 0 0 144.6 24h-.33A87.48 87.48 0 0 0 82 49.81l-31.89 32.3L20.61 112a16 16 0 0 0 .06 22.56l28.66 28.66a15.92 15.92 0 0 0 11.32 4.69h.09a16 16 0 0 0 11.36-4.82l60.9-62.4a16.08 16.08 0 0 1 22.41-.21a15.6 15.6 0 0 1 4.73 11.19a16.9 16.9 0 0 1-4.85 12L93 183.88a16 16 0 0 0-.17 22.79l28.66 28.66a16.06 16.06 0 0 0 22.52.12l61.8-60.45c34.45-34.5 34.98-90.44 1.19-124.75M60.7 156.47l-27-27L55.87 108l27 27Zm98.46-71.25a24 24 0 0 0-34.29.44l-30 30.72l-27-27l30.11-30.42A71.5 71.5 0 0 1 144.36 40h.27a71.49 71.49 0 0 1 50.71 21.53c.51.52 1 1.05 1.5 1.59l-37.68 22.1Zm53.76 53.76L151 200l-27-27l61.81-60.46l.24-.24c.4-.4.79-.8 1.17-1.21a24 24 0 0 0-17.3-40.48l25.6-15A71.66 71.66 0 0 1 213 138.87Z"/></g></symbol>
    <symbol id="ico-reset" viewBox="0 0 256 256" fill="currentColor"><g><path d="M232 136a104 104 0 1 1-38.17-80.55L208 60v-4a8 8 0 0 1 16 0v34a8 8 0 0 1-8 8h-34a8 8 0 0 1 0-16h7.6l-8.89-7.4A88 88 0 1 0 216 136a8 8 0 0 1 16 0Z" opacity=".2"/><path d="M232 136a104 104 0 1 1-38.17-80.55L208 60v-4a8 8 0 0 1 16 0v34a8 8 0 0 1-8 8h-34a8 8 0 0 1 0-16h7.6l-8.89-7.4A88 88 0 1 0 216 136a8 8 0 0 1 16 0Z"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="mg is-demo" id="mg">
  <p class="mg__hint"><svg class="mg__ico" aria-hidden="true"><use href="#ico-magnet"/></svg><span>판 위에서 마우스를 움직이면 철가루가 커서 자석을 따라 밀리고 당겨집니다</span></p>
  <div class="mg__field" id="field" role="application" aria-label="자석 실험판" tabindex="0">
    <span class="mg__magnet" id="magnet" aria-hidden="true"><svg class="mg__magnetIco"><use href="#ico-magnet"/></svg></span>
    <span class="mg__dots" id="dots" aria-hidden="true"></span>
  </div>
  <div class="mg__bar">
    <button class="mg__mode" id="mode" type="button" aria-pressed="false">
      <svg class="mg__ico" aria-hidden="true"><use href="#ico-magnet"/></svg><span id="modeLabel">당기기</span>
    </button>
    <button class="mg__reset" id="reset" type="button">
      <svg class="mg__ico" aria-hidden="true"><use href="#ico-reset"/></svg><span>처음대로</span>
    </button>
  </div>
</div>
</main>
<script>
var root = document.getElementById('mg');
var field = document.getElementById('field');
var magnet = document.getElementById('magnet');
var dotsBox = document.getElementById('dots');
var modeBtn = document.getElementById('mode');
var modeLabel = document.getElementById('modeLabel');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
// 철가루 32개 — 8×4 격자에 지터를 준 자리가 제자리(home)다. 커서는 자석.
var COLS = 8, ROWS = 4, dots = [];
function homeXY(c, r) {
  return {
    x: (c + 0.5) * field.clientWidth / COLS - 5 + (r % 2) * 8 - 4,
    y: (r + 0.5) * field.clientHeight / ROWS - 5 + ((c % 3) - 1) * 6
  };
}
for (var r = 0; r < ROWS; r++) {
  for (var c = 0; c < COLS; c++) {
    var el = document.createElement('i');
    var home = homeXY(c, r);
    el.className = 'mg__dot';
    el.style.setProperty('--hx', home.x.toFixed(1) + 'px');
    el.style.setProperty('--hy', home.y.toFixed(1) + 'px');
    el.style.setProperty('--i', String(r * COLS + c));
    dotsBox.appendChild(el);
    dots.push({ el: el, c: c, r: r, hx: home.x, hy: home.y, x: home.x, y: home.y, vx: 0, vy: 0 });
  }
}
var mag = { x: 212, y: 88 }, attract = false, last = 0, running = false, idleAt = 0;

function paintMagnet() {
  magnet.style.transform = 'translate(' + mag.x + 'px, ' + mag.y + 'px)';
}
function paintDots() {
  for (var i = 0; i < dots.length; i++) {
    var d = dots[i];
    d.el.style.transform = 'translate(' + d.x + 'px, ' + d.y + 'px)';
  }
}
function wake() {
  root.classList.remove('is-demo');
  if (reduce.matches) { paintMagnet(); paintDots(); return false; }
  idleAt = performance.now();
  if (!running) { running = true; last = performance.now(); requestAnimationFrame(step); }
  return true;
}
function step(now) {
  var dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  var lively = now - idleAt < 1600, allCalm = true;
  for (var i = 0; i < dots.length; i++) {
    var d = dots[i];
    var dx = d.x - mag.x, dy = d.y - mag.y;
    var r2 = dx * dx + dy * dy;
    // 쿨롱 간이: 힘 = 부호 / (r² + 연화) — 거리 제곱에 반비례하고 0 나누기를 막는다
    var f = (attract ? -5200 : 4200) / (r2 + 900);
    var len = Math.sqrt(r2) || 1;
    d.vx += (dx / len) * f * dt * 60;
    d.vy += (dy / len) * f * dt * 60;
    // 제자리 스프링 + 감쇠 — 철가루가 흩어지지 않고 돌아온다
    d.vx += (d.hx - d.x) * 46 * dt;
    d.vy += (d.hy - d.y) * 46 * dt;
    d.vx *= 0.86; d.vy *= 0.86;
    d.x += d.vx * dt; d.y += d.vy * dt;
    if (Math.abs(d.vx) + Math.abs(d.vy) > 3 || Math.abs(d.hx - d.x) + Math.abs(d.hy - d.y) > 0.4) { allCalm = false; }
    d.el.style.transform = 'translate(' + d.x + 'px, ' + d.y + 'px)';
  }
  if (!lively && allCalm) { paintDots(); running = false; return; }
  requestAnimationFrame(step);
}
function moveMagnet(x, y, fromPointer) {
  mag.x = Math.max(-8, Math.min(field.clientWidth - 24, x));
  mag.y = Math.max(-8, Math.min(field.clientHeight - 24, y));
  paintMagnet();
  wake();
}
field.addEventListener('pointermove', function (e) {
  var r = field.getBoundingClientRect();
  moveMagnet(e.clientX - r.left - 12, e.clientY - r.top - 12, true);
});
field.addEventListener('keydown', function (e) {
  var JUMP = 28;
  if (e.key === 'ArrowLeft') { moveMagnet(mag.x - JUMP, mag.y); }
  else if (e.key === 'ArrowRight') { moveMagnet(mag.x + JUMP, mag.y); }
  else if (e.key === 'ArrowUp') { moveMagnet(mag.x, mag.y - JUMP); }
  else if (e.key === 'ArrowDown') { moveMagnet(mag.x, mag.y + JUMP); }
  else { return; }
  e.preventDefault();
});
modeBtn.addEventListener('click', function () {
  attract = !attract;
  modeBtn.setAttribute('aria-pressed', attract ? 'true' : 'false');
  modeLabel.textContent = attract ? '밀어내기' : '당기기';
  wake();
});
document.getElementById('reset').addEventListener('click', function () {
  for (var i = 0; i < dots.length; i++) {
    var home = homeXY(dots[i].c, dots[i].r);
    dots[i].hx = home.x; dots[i].hy = home.y;
    dots[i].x = home.x; dots[i].y = home.y; dots[i].vx = 0; dots[i].vy = 0;
    dots[i].el.style.setProperty('--hx', home.x.toFixed(1) + 'px');
    dots[i].el.style.setProperty('--hy', home.y.toFixed(1) + 'px');
  }
  mag.x = field.clientWidth / 2 - 12; mag.y = field.clientHeight / 2 - 12;
  paintMagnet(); paintDots();
});
window.addEventListener('resize', function () {
  document.getElementById('reset').click();
});
paintMagnet(); paintDots();
</script>
</body>
</html>
