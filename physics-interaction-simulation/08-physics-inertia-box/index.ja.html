<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관성 상자 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-shake" viewBox="0 0 256 256" fill="currentColor"><g><path d="m232 128l-32 32H56l-32-32l32-32h144Z" opacity=".2"/><path d="m237.66 133.66l-32 32a8 8 0 0 1-11.32-11.32L212.69 136H43.31l18.35 18.34a8 8 0 0 1-11.32 11.32l-32-32a8 8 0 0 1 0-11.32l32-32a8 8 0 0 1 11.32 11.32L43.31 120h169.38l-18.35-18.34a8 8 0 0 1 11.32-11.32l32 32a8 8 0 0 1 0 11.32"/></g></symbol>
    <symbol id="ico-reset" viewBox="0 0 256 256" fill="currentColor"><g><path d="M232 136a104 104 0 1 1-38.17-80.55L208 60v-4a8 8 0 0 1 16 0v34a8 8 0 0 1-8 8h-34a8 8 0 0 1 0-16h7.6l-8.89-7.4A88 88 0 1 0 216 136a8 8 0 0 1 16 0Z" opacity=".2"/><path d="M232 136a104 104 0 1 1-38.17-80.55L208 60v-4a8 8 0 0 1 16 0v34a8 8 0 0 1-8 8h-34a8 8 0 0 1 0-16h7.6l-8.89-7.4A88 88 0 1 0 216 136a8 8 0 0 1 16 0Z"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="ib is-demo" id="ib">
  <p class="ib__hint"><svg class="ib__ico" aria-hidden="true"><use href="#ico-shake"/></svg><span>箱をつかんで左右に振ると、箱の加速度が逆向きの力になってボールが転がります</span></p>
  <div class="ib__field" id="field" role="application" aria-label="慣性の実験台" tabindex="0">
    <div class="ib__box" id="box">
      <span class="ib__ball ib__ball--a" aria-hidden="true"></span>
      <span class="ib__ball ib__ball--b" aria-hidden="true"></span>
      <span class="ib__ball ib__ball--c" aria-hidden="true"></span>
    </div>
  </div>
  <div class="ib__bar">
    <button class="ib__reset" id="reset" type="button">
      <svg class="ib__ico" aria-hidden="true"><use href="#ico-reset"/></svg><span>まっすぐ戻す</span>
    </button>
  </div>
</div>
</main>
<script>
var root = document.getElementById('ib');
var field = document.getElementById('field');
var box = document.getElementById('box');
var els = { a: box.querySelector('.ib__ball--a'), b: box.querySelector('.ib__ball--b'), c: box.querySelector('.ib__ball--c') };
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
// 공 3개 — 크기와 상자 안 처음 x(상자 내부 좌표). 상자의 가속이 -a 로 공에게 들어온다
var SPEC = [ { el: 'a', size: 24, x: 40 }, { el: 'b', size: 18, x: 120 }, { el: 'c', size: 14, x: 190 } ];
var boxX = 0, boxVX = 0, boxAX = 0, lastBX = 0;
var dragging = false, balls = [], last = 0, running = false;

function innerW() { return box.clientWidth; }
function floorY(size) { return box.clientHeight - size; }
function reset() {
  balls = SPEC.map(function (s) { return { el: els[s.el], size: s.size, x: s.x, vx: 0 }; });
  boxX = 0; boxVX = 0; boxAX = 0;
  paint();
}
function paint() {
  box.style.transform = 'translate(' + boxX.toFixed(1) + 'px, 0)';
  for (var i = 0; i < balls.length; i++) {
    var b = balls[i];
    b.el.style.transform = 'translate(' + b.x.toFixed(1) + 'px, ' + floorY(b.size) + 'px)';
  }
}
function step(now) {
  var dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  var inner = innerW(), allCalm = true;
  if (!dragging) {
    // 손을 뗀 뒤 상자는 스프링으로 중앙으로 돌아온다
    boxVX += (-90 * boxX - 9 * boxVX) * dt;
    boxX += boxVX * dt;
  }
  for (var i = 0; i < balls.length; i++) {
    var b = balls[i];
    // 관성: 상자 가속의 반대 방향 힘이 공에게 걸리고 벽에서는 반발로 튕긴다
    b.vx += -boxAX * 1.1 * dt;
    b.x += b.vx * dt;
    if (b.x < 0) { b.x = 0; if (Math.abs(b.vx) > 20) { b.vx = -b.vx * 0.7; } else { b.vx = 0; } }
    if (b.x > inner - b.size) { b.x = inner - b.size; if (Math.abs(b.vx) > 20) { b.vx = -b.vx * 0.7; } else { b.vx = 0; } }
    if (Math.abs(b.vx) > 1 || Math.abs(boxVX) > 2 || Math.abs(boxX) > 0.5) { allCalm = false; }
  }
  // 손을 떼고 있을 때 가속은 한 프레임짜리 충격이다 — 안 지우면 화살표 키로 준 힘이 영원히 남아
  // 공이 한쪽 벽에 붙고 allCalm 이 끝내 참이 안 돼 루프도 안 멎는다. 끄는 동안은 moveBox 가 매번 다시 넣는다
  if (!dragging) { boxAX = 0; }
  paint();
  if (allCalm && !dragging) { reset(); running = false; return; }
  requestAnimationFrame(step);
}
function wake() {
  root.classList.remove('is-demo');
  if (reduce.matches) { reset(); return false; }
  if (!running) { running = true; last = performance.now(); requestAnimationFrame(step); }
  return true;
}
function moveBox(clientX) {
  var r = field.getBoundingClientRect();
  var nx = Math.max(-44, Math.min(44, clientX - r.left - r.width / 2));
  boxAX = (nx - boxX) * 46;           // 잡아당기는 힘 = 변위 비례 (흔듦의 가속원)
  boxX = nx;
  wake();
}
box.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  dragging = true;
  box.setPointerCapture(e.pointerId);
  moveBox(e.clientX);
});
box.addEventListener('pointermove', function (e) { if (dragging) { moveBox(e.clientX); } });
box.addEventListener('pointerup', function () { dragging = false; boxAX = 0; });
field.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowLeft') { boxAX = 2600; boxX = Math.max(-44, boxX - 12); }
  else if (e.key === 'ArrowRight') { boxAX = -2600; boxX = Math.min(44, boxX + 12); }
  else { return; }
  e.preventDefault();
  wake();
});
document.getElementById('reset').addEventListener('click', function () { reset(); wake(); });
window.addEventListener('resize', function () { reset(); });
reset();
</script>
</body>
</html>
