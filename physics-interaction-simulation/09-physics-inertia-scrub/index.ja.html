<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관성 스크럽 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-swipe" viewBox="0 0 256 256" fill="currentColor"><g><path d="M208 140v36c0 24-8 40-8 40H64l-29.32-50a20 20 0 0 1 34.64-20L88 176V68a20 20 0 0 1 40 0v56a20 20 0 0 1 40 0v16a20 20 0 0 1 40 0" opacity=".2"/><path d="M216 140v36c0 25.59-8.49 42.85-8.85 43.58A8 8 0 0 1 200 224a7.9 7.9 0 0 1-3.57-.85a8 8 0 0 1-3.58-10.73c.06-.12 7.16-14.81 7.16-36.42v-36a12 12 0 0 0-24 0v4a8 8 0 0 1-16 0v-20a12 12 0 0 0-24 0v12a8 8 0 0 1-16 0V68a12 12 0 0 0-24 0v108a8 8 0 0 1-14.79 4.23l-18.68-30l-.14-.23a12 12 0 1 0-20.8 12l29.29 50a8 8 0 1 1-13.81 8l-29.32-50a28 28 0 0 1 48.41-28.17L80 148V68a28 28 0 0 1 56 0v30.7a28 28 0 0 1 38.65 16.69A28 28 0 0 1 216 140m33-92h-52.69l18.34-18.34a8 8 0 0 0-11.31-11.32l-32 32a8 8 0 0 0 0 11.32l32 32a8 8 0 0 0 11.31-11.32L195.31 64H248a8 8 0 0 0 0-16Z"/></g></symbol>
    <symbol id="ico-reset" viewBox="0 0 256 256" fill="currentColor"><g><path d="M232 136a104 104 0 1 1-38.17-80.55L208 60v-4a8 8 0 0 1 16 0v34a8 8 0 0 1-8 8h-34a8 8 0 0 1 0-16h7.6l-8.89-7.4A88 88 0 1 0 216 136a8 8 0 0 1 16 0Z" opacity=".2"/><path d="M232 136a104 104 0 1 1-38.17-80.55L208 60v-4a8 8 0 0 1 16 0v34a8 8 0 0 1-8 8h-34a8 8 0 0 1 0-16h7.6l-8.89-7.4A88 88 0 1 0 216 136a8 8 0 0 1 16 0Z"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="sc is-demo" id="sc">
  <p class="sc__hint"><svg class="sc__ico" aria-hidden="true"><use href="#ico-swipe"/></svg><span>強くはじいて離すと、離した瞬間の速度で滑ってカードに吸着します</span></p>
  <div class="sc__viewport" id="viewport" role="application" aria-label="カードスクラブ" tabindex="0">
    <div class="sc__track" id="track">
      <span class="sc__card"><b>1</b><i>1枚目</i></span>
      <span class="sc__card"><b>2</b><i>2枚目</i></span>
      <span class="sc__card"><b>3</b><i>3枚目</i></span>
      <span class="sc__card"><b>4</b><i>4枚目</i></span>
      <span class="sc__card"><b>5</b><i>5枚目</i></span>
      <span class="sc__card"><b>6</b><i>6枚目</i></span>
    </div>
  </div>
  <div class="sc__bar">
    <p class="sc__meter"><span class="sc__meterLabel">はじいた速度</span><b class="sc__meterBar"><i class="sc__meterFill" id="meter"></i></b></p>
    <button class="sc__reset" id="reset" type="button">
      <svg class="sc__ico" aria-hidden="true"><use href="#ico-reset"/></svg><span>最初へ</span>
    </button>
  </div>
</div>
</main>
<script>
var root = document.getElementById('sc');
var viewport = document.getElementById('viewport');
var track = document.getElementById('track');
var meter = document.getElementById('meter');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
var CW = 120, GAP2 = 12, STEP = CW + GAP2;   // 카드 120px + 간격 12px = 한 칸 132px
var x = 0, vx = 0, dragging = false, samples = [], last = 0, running = false, settling = false;

function clampX(v) {
  var max = 0, min = viewport.clientWidth - track.scrollWidth;
  return Math.max(min, Math.min(max, v));
}
function snapTarget() { return Math.round(clampX(x) / STEP) * STEP; }
function paint() {
  track.style.transform = 'translate(' + x.toFixed(1) + 'px, 0)';
  var pct = Math.min(1, Math.abs(vx) / 900);
  meter.style.transform = 'scaleX(' + pct.toFixed(3) + ')';
}
function step(now) {
  var dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  // 손이 붙어 있는 동안은 물리를 돌리지 않는다 — 돌리면 마찰 감속과 스냅 스프링이 끄는 손과 싸운다
  if (dragging) { requestAnimationFrame(step); return; }
  if (settling) {
    // 카드에 붙는 마지막 스프링 — 목표는 가장 가까운 칸
    var target = snapTarget();
    vx += (150 * (target - x) - 13 * vx) * dt;
    x += vx * dt;
    if (Math.abs(target - x) < 0.4 && Math.abs(vx) < 6) {
      x = target; vx = 0; settling = false; paint(); running = false; return;
    }
  } else {
    // 마찰 감속 — 프레임 비율과 무관하게 60fps 기준 0.91^dt 로 지수 감쇠시킨다
    vx *= Math.pow(0.91, dt * 60);
    x += vx * dt;
    var c = clampX(x);
    if (c !== x) { x = c; vx = 0; }
    if (Math.abs(vx) < 160) { settling = true; vx = 0; }
  }
  paint();
  requestAnimationFrame(step);
}
function wake() {
  root.classList.remove('is-demo');
  if (reduce.matches) { x = snapTarget(); vx = 0; paint(); return false; }
  if (!running) { running = true; last = performance.now(); requestAnimationFrame(step); }
  return true;
}
viewport.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  dragging = true; settling = false;
  x = clampX(x); vx = 0;
  samples = [{ x: e.clientX, t: performance.now() }];
  viewport.setPointerCapture(e.pointerId);
  wake();
});
viewport.addEventListener('pointermove', function (e) {
  if (!dragging) { return; }
  var now = performance.now();
  var prev = samples[samples.length - 1];
  x = clampX(x + (e.clientX - prev.x));
  samples.push({ x: e.clientX, t: now });
  if (samples.length > 8) { samples.shift(); }
  paint();
});
viewport.addEventListener('pointerup', function () {
  if (!dragging) { return; }
  dragging = false;
  if (reduce.matches) { x = snapTarget(); vx = 0; paint(); return; }
  // 놓는 순간의 속도 = 최근 표본들의 기울기 (pointerup 이 순간을 잡는다)
  var now = performance.now(), i = samples.length - 1;
  while (i > 0 && now - samples[i - 1].t < 120) { i -= 1; }
  var span = samples[samples.length - 1].t - samples[i].t;
  vx = span > 8 ? (samples[samples.length - 1].x - samples[i].x) / span * 1000 : 0;
  vx = Math.max(-1400, Math.min(1400, vx));
  settling = false;
  if (!running) { wake(); }
});
viewport.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowLeft') { x = clampX(x + STEP); vx = 0; settling = true; wake(); }
  else if (e.key === 'ArrowRight') { x = clampX(x - STEP); vx = 0; settling = true; wake(); }
  else { return; }
  e.preventDefault();
});
document.getElementById('reset').addEventListener('click', function () { x = 0; vx = 0; settling = false; paint(); wake(); });
window.addEventListener('resize', function () { x = clampX(x); paint(); });
paint();
</script>
</body>
</html>
