<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진자 흔들기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-grab" viewBox="0 0 256 256" fill="currentColor"><g><path d="M208 108v44a80 80 0 0 1-160 0v-12a20 20 0 0 1 20-20h20V92a20 20 0 0 1 40 0a20 20 0 0 1 40 0v16a20 20 0 0 1 40 0" opacity=".2"/><path d="M188 80a27.8 27.8 0 0 0-13.36 3.4a28 28 0 0 0-46.64-11A28 28 0 0 0 80 92v20H68a28 28 0 0 0-28 28v12a88 88 0 0 0 176 0v-44a28 28 0 0 0-28-28m12 72a72 72 0 0 1-144 0v-12a12 12 0 0 1 12-12h12v24a8 8 0 0 0 16 0V92a12 12 0 0 1 24 0v28a8 8 0 0 0 16 0V92a12 12 0 0 1 24 0v28a8 8 0 0 0 16 0v-12a12 12 0 0 1 24 0Z"/></g></symbol>
    <symbol id="ico-reset" viewBox="0 0 256 256" fill="currentColor"><g><path d="M232 136a104 104 0 1 1-38.17-80.55L208 60v-4a8 8 0 0 1 16 0v34a8 8 0 0 1-8 8h-34a8 8 0 0 1 0-16h7.6l-8.89-7.4A88 88 0 1 0 216 136a8 8 0 0 1 16 0Z" opacity=".2"/><path d="M232 136a104 104 0 1 1-38.17-80.55L208 60v-4a8 8 0 0 1 16 0v34a8 8 0 0 1-8 8h-34a8 8 0 0 1 0-16h7.6l-8.89-7.4A88 88 0 1 0 216 136a8 8 0 0 1 16 0Z"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="pd is-demo" id="pd">
  <p class="pd__hint"><svg class="pd__ico" aria-hidden="true"><use href="#ico-grab"/></svg><span>錘を引いて離すと、角度が高さに変わって自分で揺れ続けます</span></p>
  <div class="pd__field" id="field" role="application" aria-label="振り子の実験台" tabindex="0">
    <span class="pd__pivot" aria-hidden="true"></span>
    <div class="pd__arm" id="arm">
      <span class="pd__rod" aria-hidden="true"></span>
      <button class="pd__bob" id="bob" type="button" aria-label="振り子の錘">
        <svg class="pd__bobIco" aria-hidden="true"><use href="#ico-grab"/></svg>
      </button>
    </div>
    <p class="pd__angle" aria-live="polite"><span class="pd__angleVal" id="angleText">0度</span><span class="pd__angleLoop" aria-hidden="true"><i>26度</i><i>0度</i><i>26度</i><i>0度</i></span></p>
  </div>
  <div class="pd__bar">
    <button class="pd__pull" id="pull" type="button">
      <svg class="pd__ico" aria-hidden="true"><use href="#ico-grab"/></svg><span>30度で離す</span>
    </button>
    <button class="pd__reset" id="reset" type="button">
      <svg class="pd__ico" aria-hidden="true"><use href="#ico-reset"/></svg><span>止める</span>
    </button>
  </div>
</div>
</main>
<script>
var root = document.getElementById('pd');
var field = document.getElementById('field');
var arm = document.getElementById('arm');
var bob = document.getElementById('bob');
var angleText = document.getElementById('angleText');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
// G 는 px/s² 로 02 중력 드롭과 같은 눈금이고 RAD 는 度 변환 상수다.
// -(g/L)sinθ 는 라디안/s² 이라 度 단위인 angle·avel 에 그대로 더하면 57배 작아진다 —
// 그 상태로는 30도에서 놓아도 6초에 0.9도밖에 안 움직여 추가 멈춰 있는 것처럼 보인다
var G = 1800, LEN = 118, DAMP = 0.4, RAD = 180 / Math.PI;
var angle = 0, avel = 0, dragging = false, last = 0, running = false;

function paint() {
  arm.style.transform = 'rotate(' + angle.toFixed(2) + 'deg)';
  var deg = Math.round(Math.abs(angle));
  if (angleText.textContent !== deg + '度') { angleText.textContent = deg + '度'; }
}
function step(now) {
  var dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  // 각가속도 = -(g/L)·sinθ - 減衰. 각도가 높이(에너지)로 바뀌는 게 진자의 물리다
  avel += (-(G / LEN) * Math.sin(angle / RAD) * RAD - DAMP * avel) * dt;
  angle += avel * dt;
  paint();
  if (Math.abs(angle) < 0.2 && Math.abs(avel) < 0.6) {
    angle = 0; avel = 0; paint(); running = false; return;
  }
  requestAnimationFrame(step);
}
function start() {
  root.classList.remove('is-demo');
  if (reduce.matches) { angle = 0; avel = 0; paint(); return; }
  if (!running) { running = true; last = performance.now(); requestAnimationFrame(step); }
}
function angleFromEvent(e) {
  var r = field.getBoundingClientRect();
  var px = e.clientX - (r.left + r.width / 2);
  var py = e.clientY - r.top;
  var deg = Math.atan2(px, py) * 180 / Math.PI;
  return Math.max(-75, Math.min(75, deg));
}
bob.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  dragging = true; root.classList.remove('is-demo');
  angle = angleFromEvent(e); avel = 0; paint();
  bob.setPointerCapture(e.pointerId);
});
bob.addEventListener('pointermove', function (e) {
  if (!dragging) { return; }
  angle = angleFromEvent(e); avel = 0; paint();
});
bob.addEventListener('pointerup', function () {
  if (!dragging) { return; }
  dragging = false;
  if (reduce.matches) { angle = 0; avel = 0; paint(); return; }
  // 놓는 순간의 각도가 위치에너지 — 여기서부터 진동이 시작된다
  if (!running) { running = true; last = performance.now(); requestAnimationFrame(step); }
});
field.addEventListener('keydown', function (e) {
  var JUMP = 15;
  if (e.key === 'ArrowLeft') { angle = Math.max(-75, angle - JUMP); }
  else if (e.key === 'ArrowRight') { angle = Math.min(75, angle + JUMP); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); return; }
  else { return; }
  e.preventDefault();
  root.classList.remove('is-demo'); avel = 0; paint();
});
document.getElementById('pull').addEventListener('click', function () { angle = 30; avel = 0; start(); });
document.getElementById('reset').addEventListener('click', function () { angle = 0; avel = 0; running = false; paint(); });
paint();
</script>
</body>
</html>
