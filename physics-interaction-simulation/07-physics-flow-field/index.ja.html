<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플로우 필드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-wind" viewBox="0 0 256 256" fill="currentColor"><g><path d="M120 96a24 24 0 1 1 24-24a24 24 0 0 1-24 24m88-16a24 24 0 1 0 24 24a24 24 0 0 0-24-24m-56 80a24 24 0 1 0 24 24a24 24 0 0 0-24-24" opacity=".2"/><path d="M184 184a32 32 0 0 1-32 32c-13.7 0-26.95-8.93-31.5-21.22a8 8 0 0 1 15-5.56C137.74 195.27 145 200 152 200a16 16 0 0 0 0-32H40a8 8 0 0 1 0-16h112a32 32 0 0 1 32 32m-64-80a32 32 0 0 0 0-64c-13.7 0-26.95 8.93-31.5 21.22a8 8 0 0 0 15 5.56C105.74 60.73 113 56 120 56a16 16 0 0 1 0 32H24a8 8 0 0 0 0 16Zm88-32c-13.7 0-26.95 8.93-31.5 21.22a8 8 0 0 0 15 5.56C193.74 92.73 201 88 208 88a16 16 0 0 1 0 32H32a8 8 0 0 0 0 16h176a32 32 0 0 0 0-64"/></g></symbol>
    <symbol id="ico-reset" viewBox="0 0 256 256" fill="currentColor"><g><path d="M232 136a104 104 0 1 1-38.17-80.55L208 60v-4a8 8 0 0 1 16 0v34a8 8 0 0 1-8 8h-34a8 8 0 0 1 0-16h7.6l-8.89-7.4A88 88 0 1 0 216 136a8 8 0 0 1 16 0Z" opacity=".2"/><path d="M232 136a104 104 0 1 1-38.17-80.55L208 60v-4a8 8 0 0 1 16 0v34a8 8 0 0 1-8 8h-34a8 8 0 0 1 0-16h7.6l-8.89-7.4A88 88 0 1 0 216 136a8 8 0 0 1 16 0Z"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="ff is-demo" id="ff">
  <p class="ff__hint"><svg class="ff__ico" aria-hidden="true"><use href="#ico-wind"/></svg><span>マウスを動かした方向が風になり、ダッシュの群れがその方へ流れます</span></p>
  <div class="ff__field" id="field" role="application" aria-label="フローフィールドの実験台" tabindex="0">
    <span class="ff__parts" id="parts" aria-hidden="true"></span>
  </div>
  <div class="ff__bar">
    <p class="ff__dir"><span class="ff__dirLabel">今の風</span><b class="ff__dirBox"><span class="ff__dirVal" id="dirText">凪</span><span class="ff__dirLoop" aria-hidden="true"><i>右</i><i>左</i></span></b></p>
    <button class="ff__reset" id="reset" type="button">
      <svg class="ff__ico" aria-hidden="true"><use href="#ico-reset"/></svg><span>散らす</span>
    </button>
  </div>
</div>
</main>
<script>
var root = document.getElementById('ff');
var field = document.getElementById('field');
var partsBox = document.getElementById('parts');
var dirText = document.getElementById('dirText');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
// 대시 36개 — 결정적 난수(사인 곱셈법)로 뿌린 자리가 시작점이다. 시드가 고정되어 매번 같은 배치로 재현된다
var N = 36, parts = [];
function rnd(seed) { var x = Math.sin(seed * 127.1) * 43758.5453; return x - Math.floor(x); }
function scatter() {
  var w = field.clientWidth, h = field.clientHeight;
  if (!parts.length) {
    for (var i = 0; i < N; i++) {
      var el = document.createElement('i');
      el.className = 'ff__part';
      el.style.setProperty('--i', String(i));
      partsBox.appendChild(el);
      parts.push({ el: el, x: 0, y: 0, vx: 12, vy: 0, ang: 0, seed: i + 1 });
    }
  }
  for (var j = 0; j < parts.length; j++) {
    var p = parts[j];
    p.x = (0.06 + rnd(p.seed) * 0.88) * w;
    p.y = (0.1 + rnd(p.seed + 60) * 0.8) * h;
    p.vx = 12; p.vy = 0; p.ang = 0;
    // 미리보기 궤도의 중심과 반지름 — 결정적 난수라 같은 배치가 매번 나온다
    p.el.style.setProperty('--hx', p.x.toFixed(1) + 'px');
    p.el.style.setProperty('--hy', p.y.toFixed(1) + 'px');
    p.el.style.setProperty('--rx', (10 + rnd(p.seed + 7) * 26).toFixed(1) + 'px');
    p.el.style.setProperty('--ry', (6 + rnd(p.seed + 13) * 16).toFixed(1) + 'px');
  }
}
var wind = { x: 12, y: 0 }, windUntil = 0, last = 0, running = false;
var DIRS = { e: '右', w: '左', s: '下', n: '上', calm: '凪' };

function paint() {
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    p.el.style.transform = 'translate(' + p.x.toFixed(1) + 'px, ' + p.y.toFixed(1) + 'px) rotate(' + p.ang.toFixed(1) + 'deg)';
  }
}
function dirName() {
  var ax = Math.abs(wind.x), ay = Math.abs(wind.y);
  if (ax < 8 && ay < 8) { return DIRS.calm; }
  if (ax > ay * 1.2) { return wind.x > 0 ? DIRS.e : DIRS.w; }
  if (ay > ax * 1.2) { return wind.y > 0 ? DIRS.s : DIRS.n; }
  return wind.x > 0 ? DIRS.e : DIRS.w;
}
function wake() {
  root.classList.remove('is-demo');
  if (reduce.matches) { paint(); return false; }
  if (!running) { running = true; last = performance.now(); requestAnimationFrame(step); }
  return true;
}
function step(now) {
  var dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  var w = field.clientWidth, h = field.clientHeight;
  var gust = now - windUntil < 900;   // 최근 입력 바람이 살아 있는 동안 조타력이 세다
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    // 흐름장: 모든 대시가 같은 방향으로 조타된다 — 힘은 커서 속도에서 온다
    p.vx += (wind.x - p.vx) * (gust ? 2.4 : 0.4) * dt;
    p.vy += (wind.y - p.vy) * (gust ? 2.4 : 0.4) * dt;
    var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (sp > 190) { p.vx *= 190 / sp; p.vy *= 190 / sp; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.ang = Math.atan2(p.vy, p.vx) * 180 / Math.PI;
    // 가장자리에서 반대편으로 돌아온다 — 흐름장의 공간이 잇달아 이어진 셈이다
    if (p.x > w + 8) { p.x = -8; } else if (p.x < -8) { p.x = w + 8; }
    if (p.y > h + 8) { p.y = -8; } else if (p.y < -8) { p.y = h + 8; }
  }
  var name = dirName();
  if (dirText.textContent !== name) { dirText.textContent = name; }
  paint();
  requestAnimationFrame(step);
}
var prev = null;
field.addEventListener('pointermove', function (e) {
  var r = field.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  if (prev) {
    var dx = x - prev.x, dy = y - prev.y;
    if (Math.abs(dx) + Math.abs(dy) > 2) {
      wind.x = dx * 9; wind.y = dy * 9;
      windUntil = performance.now();
      wake();
    }
  }
  prev = { x: x, y: y };
});
field.addEventListener('keydown', function (e) {
  var BLOW = 120;
  if (e.key === 'ArrowLeft') { wind.x = -BLOW; wind.y = 0; }
  else if (e.key === 'ArrowRight') { wind.x = BLOW; wind.y = 0; }
  else if (e.key === 'ArrowUp') { wind.x = 0; wind.y = -BLOW; }
  else if (e.key === 'ArrowDown') { wind.x = 0; wind.y = BLOW; }
  else { return; }
  e.preventDefault();
  windUntil = performance.now();
  wake();
});
document.getElementById('reset').addEventListener('click', function () {
  wind.x = 12; wind.y = 0;
  scatter(); paint();
});
window.addEventListener('resize', function () { scatter(); paint(); });
scatter(); paint();
</script>
</body>
</html>
