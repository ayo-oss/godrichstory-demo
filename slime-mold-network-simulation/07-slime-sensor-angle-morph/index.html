<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>센서 각도 모프 — 산호에서 혈관까지 — 슬라임몰드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sm is-demo" id="smRoot">
  <p class="sm__hint">
    <span>센서 벌림각과 거리 두 숫자만 슬라이더로 바꾸면 같은 규칙이 촘촘한 산호 모양, 성긴 혈관 모양, 격자형 도시 모양까지 완전히 다른 네트워크를 그려냅니다</span>
  </p>
  <div class="sm__field" id="smField" role="application" aria-label="센서 각도 모프 점균 실험판" tabindex="0">
    <canvas class="sm__cv" id="smCv"></canvas>
  </div>
  <div class="sm__bar">
    <label class="sm__ctl">
      <span class="sm__lab" id="smAngLab">벌림각 29°</span>
      <input class="sm__rng" id="smAng" type="range" min="10" max="90" step="1" value="29" aria-label="센서 벌림각">
    </label>
    <label class="sm__ctl">
      <span class="sm__lab" id="smDistLab">거리 15</span>
      <input class="sm__rng" id="smDist" type="range" min="4" max="30" step="1" value="15" aria-label="센서 거리">
    </label>
  </div>
</div>
</main>
<script>
// 센서 각도 모프(07). Physarum 스티그머지 + 실시간 파라미터 모프 —
// 센서 벌림각(도)과 센서 거리 두 값을 실제 range 슬라이더로 바꾼다. 같은 3센서 규칙이라도
// 좁은 각도+짧은 거리는 촘촘한 산호, 넓은 각도+긴 거리는 성긴 혈관·격자형 도시망을 그린다.
// .is-demo 동안은 슬라이더가 사람 손 없이 스스로 움직여(자동 시연) 형태 변화를 보여주고,
// 사람이 실제로 슬라이더를 잡으면 그 즉시 같은 파라미터가 시뮬레이션에 반영된다.
//
// 화면이 사는 장치 — 077 캔버스 기준의 "매 프레임 계산":
//  · 캔버스는 절대 clear 하지 않는다. 필드 전체를 매 프레임 새로 계산해 얹는다.
//  · 앰비언트 글로우 레이어(두 옥타브 값노이즈)가 전면을 확산 구조로 흔들어 누적면적을 채운다.
(function () {
  // ── 변형 상수 블록 ──
  var AGENTS = 1500;        // 동시에 걷는 에이전트 수
  var DECAY = 0.045;        // 증발률
  // ────────────────────────────────────
  var TURN = 0.5;
  var STEP = 1.05;
  var DEPOSIT = 4.2;
  var DIFFUSE = 0.5;
  var CAP = 7;
  var SUBSTEPS = 3;

  // 파라미터(슬라이더가 실시간으로 바꾼다)
  var sensorAngleDeg = 29;   // 도(°)
  var sensorDist = 15;

  var root = document.getElementById('smRoot');
  var field = document.getElementById('smField');
  var cv = document.getElementById('smCv');
  var ctx = cv.getContext('2d', { alpha: false });
  var angRng = document.getElementById('smAng');
  var distRng = document.getElementById('smDist');
  var angLab = document.getElementById('smAngLab');
  var distLab = document.getElementById('smDistLab');

  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x320A07);

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_FLOOR = tokRGB('--sm-floor');
  var C_TRAIL = tokRGB('--sm-trail');
  var C_ACCT  = tokRGB('--sm-acct');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, fw = 0, fh = 0, raf = 0, t0 = -1;
  var trail, trailB, img, data;
  var ax, ay, ah;

  // ── 값노이즈(앰비언트 글로우용) ──
  var perm = new Uint8Array(512);
  (function () {
    var p = [];
    for (var i = 0; i < 256; i++) p.push(i);
    for (var i2 = 255; i2 > 0; i2--) {
      var k2 = Math.floor(rand() * (i2 + 1));
      var tmp = p[i2]; p[i2] = p[k2]; p[k2] = tmp;
    }
    for (var i3 = 0; i3 < 512; i3++) perm[i3] = p[i3 & 255];
  })();
  function fade(k) { return k * k * (3 - 2 * k); }
  function vnoise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var a2 = perm[(perm[xi & 255] + yi) & 255];
    var b2 = perm[(perm[(xi + 1) & 255] + yi) & 255];
    var c2 = perm[(perm[xi & 255] + yi + 1) & 255];
    var d2 = perm[(perm[(xi + 1) & 255] + yi + 1) & 255];
    var u = fade(xf), v = fade(yf);
    return (a2 + (b2 - a2) * u + (c2 - a2) * v + (a2 - b2 - c2 + d2) * u * v) / 255;
  }

  function idx(x, y) {
    x = x % fw; if (x < 0) x += fw;
    y = y % fh; if (y < 0) y += fh;
    return (y * fw + x) | 0;
  }
  function clampIdx(x, y) {
    x = Math.max(0, Math.min(fw - 1, Math.round(x)));
    y = Math.max(0, Math.min(fh - 1, Math.round(y)));
    return y * fw + x;
  }

  function sense(x, y) {
    return trail[clampIdx(x, y)];
  }

  function initAgents() {
    ax = new Float32Array(AGENTS); ay = new Float32Array(AGENTS); ah = new Float32Array(AGENTS);
    var cx = fw / 2, cy = fh / 2, r = Math.min(fw, fh) * 0.15;
    for (var i = 0; i < AGENTS; i++) {
      var a = rand() * Math.PI * 2, rr = rand() * r;
      ax[i] = cx + Math.cos(a) * rr;
      ay[i] = cy + Math.sin(a) * rr;
      ah[i] = rand() * Math.PI * 2;
    }
  }

  function stepAgents() {
    var sa = sensorAngleDeg * Math.PI / 180;
    var sd = sensorDist / 3;
    for (var i = 0; i < AGENTS; i++) {
      var x = ax[i], y = ay[i], h = ah[i];
      var sf = sense(x + Math.cos(h) * sd, y + Math.sin(h) * sd);
      var sl = sense(x + Math.cos(h + sa) * sd, y + Math.sin(h + sa) * sd);
      var sr = sense(x + Math.cos(h - sa) * sd, y + Math.sin(h - sa) * sd);
      if (sf >= sl && sf >= sr) {
        // 직진
      } else if (sl > sr) {
        h += TURN;
      } else if (sr > sl) {
        h -= TURN;
      } else {
        h += (rand() < 0.5 ? 1 : -1) * TURN;
      }
      h += (rand() - 0.5) * 0.14;
      var nx = x + Math.cos(h) * STEP, ny = y + Math.sin(h) * STEP;
      nx = ((nx % fw) + fw) % fw; ny = ((ny % fh) + fh) % fh;
      ax[i] = nx; ay[i] = ny; ah[i] = h;
      var ii = idx(Math.round(nx), Math.round(ny));
      trail[ii] = Math.min(CAP, trail[ii] + DEPOSIT);
    }
  }

  function diffuseEvap() {
    for (var y = 0; y < fh; y++) {
      var ym = y === 0 ? fh - 1 : y - 1, yp = y === fh - 1 ? 0 : y + 1;
      var rowY = y * fw, rowYm = ym * fw, rowYp = yp * fw;
      for (var x = 0; x < fw; x++) {
        var xm = x === 0 ? fw - 1 : x - 1, xp = x === fw - 1 ? 0 : x + 1;
        var i = rowY + x;
        var avg = (trail[rowY + xm] + trail[rowY + xp] + trail[rowYm + x] + trail[rowYp + x]) * 0.25;
        trailB[i] = (trail[i] * (1 - DIFFUSE) + avg * DIFFUSE) * (1 - DECAY);
      }
    }
    var t = trail; trail = trailB; trailB = t;
  }

  function render(t) {
    for (var y = 0; y < fh; y++) {
      for (var x = 0; x < fw; x++) {
        var i = y * fw + x;
        var j = i * 4;
        var v = trail[i] / CAP; if (v > 1) v = 1;
        var k = v * v * (3 - 2 * v);
        var rr = C_FLOOR[0] + (C_TRAIL[0] - C_FLOOR[0]) * k;
        var gg = C_FLOOR[1] + (C_TRAIL[1] - C_FLOOR[1]) * k;
        var bb = C_FLOOR[2] + (C_TRAIL[2] - C_FLOOR[2]) * k;
        // 파라미터 표시기 — 슬라이더 값이 화면 구석에 옅게 비친다(파라미터 실험 컨셉)
        var meterX = x / fw;
        var inAng = y < 5 && meterX < sensorAngleDeg / 90;
        var inDist = y >= 6 && y < 11 && meterX < (sensorDist - 4) / 26;
        if (inAng || inDist) {
          rr += (C_ACCT[0] - rr) * 0.5; gg += (C_ACCT[1] - gg) * 0.5; bb += (C_ACCT[2] - bb) * 0.5;
        }
        var n1 = vnoise(x * 0.09, y * 0.09 + t * 0.9);
        var n2 = vnoise(x * 0.03 + 40, y * 0.03 + t * 0.6);
        var sh = (n1 - 0.5) * 28 + (n2 - 0.5) * 18;
        rr += sh; gg += sh; bb += sh;
        data[j] = rr; data[j + 1] = gg; data[j + 2] = bb; data[j + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    fw = Math.max(96, Math.min(200, Math.round(W / 3)));
    fh = Math.max(52, Math.min(120, Math.round(H / 3)));
    cv.width = fw; cv.height = fh;
    cv.style.width = '100%'; cv.style.height = '100%';
    ctx = cv.getContext('2d', { alpha: false });
    img = ctx.createImageData(fw, fh); data = img.data;
    trail = new Float32Array(fw * fh); trailB = new Float32Array(fw * fh);
    initAgents();
  }

  function setLabels() {
    if (angLab) angLab.textContent = '벌림각 ' + sensorAngleDeg + '°';
    if (distLab) distLab.textContent = '거리 ' + sensorDist;
    if (angRng) angRng.value = String(sensorAngleDeg);
    if (distRng) distRng.value = String(sensorDist);
  }

  function stillFrame() {
    sensorAngleDeg = 45; sensorDist = 20; setLabels();
    for (var k = 0; k < 280; k++) { stepAgents(); diffuseEvap(); }
    render(2.6);
  }

  // .is-demo 자동 시연 각본 — 사람이 안 만져도 슬라이더가 스스로 움직여 형태가 모프된다.
  // 각 구간은 (벌림각 목표, 거리 목표) 쌍. 사인으로 왕복해 끊김 없이 잇는다.
  function autoParams(t) {
    var ang = 29 + 28 * Math.sin(t * 0.42) + 8 * Math.sin(t * 0.13);
    var dist = 15 + 9 * Math.sin(t * 0.31 + 1.2);
    if (ang < 10) ang = 10; if (ang > 90) ang = 90;
    if (dist < 4) dist = 4; if (dist > 30) dist = 30;
    sensorAngleDeg = Math.round(ang);
    sensorDist = Math.round(dist);
  }

  var humanTouch = false;
  angRng.addEventListener('input', function () {
    humanTouch = true;
    sensorAngleDeg = parseInt(angRng.value, 10);
    setLabels();
  });
  distRng.addEventListener('input', function () {
    humanTouch = true;
    sensorDist = parseInt(distRng.value, 10);
    setLabels();
  });

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    if (root.classList.contains('is-demo') && !humanTouch) {
      autoParams(t);
      setLabels();
    }
    for (var i = 0; i < SUBSTEPS; i++) { stepAgents(); diffuseEvap(); }
    render(t);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    fit();
    if (reduce) stillFrame();
  });

  fit();
  setLabels();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
