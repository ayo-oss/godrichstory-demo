<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다중 먹이 네트워크 — 철도망 최적화 — 슬라임몰드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sm is-demo" id="smRoot">
  <p class="sm__hint">
    <span>화면에 먹이 지점을 여러 개 흩뿌리면 점균이 모든 지점을 잇는 굵은 간선과 가는 지선을 스스로 구분해, 효율적인 방사형 수송망을 그려냅니다</span>
  </p>
  <div class="sm__field" id="smField" role="application" aria-label="다중 먹이 점균 네트워크 실험판" tabindex="0">
    <canvas class="sm__cv" id="smCv"></canvas>
  </div>
  <div class="sm__bar">
    <span class="sm__meta"><b class="sm__val" id="smN">0</b><span id="smUnit"> 에이전트 · 방사형 수송망</span></span>
    <span class="sm__meta sm__meta--dim">canvas · ImageData · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 다중 먹이 네트워크(03). Physarum 스티그머지 + 먹이점 6개 —
// 화면에 먹이 앵커 6개를 흩뿌리고, 에이전트 센싱값에 "가장 가까운 먹이로 갈수록 유리"한
// 가우시안 바이어스를 트레일 위에 얹는다. 여러 먹이를 잇는 지름길은 왕복이 잦아 굵은 간선으로
// 남고, 외곽 먹이 하나로만 가는 가지는 가늘게 남는다 — 변형 "에이전트 수"(4천→1만2천)를
// 반영해 01 보다 개체 수를 크게 늘려(2200) 네트워크 밀도를 높였다.
//
// 화면이 사는 장치 — 077 캔버스 기준의 "매 프레임 계산":
//  · 캔버스는 절대 clear 하지 않는다. 필드 전체를 매 프레임 새로 계산해 얹는다.
//  · 값노이즈 기반 주변광 요동이 바닥·간선을 가리지 않고 함께 흔들어 누적면적을 채운다.
//  · 먹이점 6개가 각자 다른 위상으로 맥동해 화면 전역이 살아 있다.
(function () {
  // ── 변형 상수 블록 ──
  var AGENTS = 2200;        // 변형 "에이전트 수"(4천→1만2천)를 반영 — 01(1300)보다 밀도 상향
  var DECAY = 0.038;        // 증발률 — 간선/지선 구분이 살도록 01보다 살짝 느리게
  var FOOD_W = 2.0;         // 먹이향이 센서 판단에 끼치는 가중치
  // ────────────────────────────────────
  var SENSOR_ANGLE = 0.5;
  var SENSOR_DIST = 5.0;
  var TURN = 0.5;
  var STEP = 1.05;
  var DEPOSIT = 4.0;
  var DIFFUSE = 0.5;
  var CAP = 8;
  var SUBSTEPS = 3;

  var root = document.getElementById('smRoot');
  var field = document.getElementById('smField');
  var cv = document.getElementById('smCv');
  var ctx = cv.getContext('2d', { alpha: false });
  var nOut = document.getElementById('smN');

  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x320A03);

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_FLOOR = tokRGB('--sm-floor');
  var C_TRUNK = tokRGB('--sm-trunk');
  var C_BRANCH = tokRGB('--sm-branch');
  var C_FOOD  = tokRGB('--sm-food');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, fw = 0, fh = 0, raf = 0, t0 = -1;
  var trail, trailB, food, foodMax, img, data;
  var ax, ay, ah;
  var stepCount = 0;
  var foods = [];   // [x, y, phase]

  // ── 값노이즈(주변광 요동용) ──
  var perm = new Uint8Array(512);
  (function () {
    var p = [];
    for (var i = 0; i < 256; i++) p.push(i);
    for (var i2 = 255; i2 > 0; i2--) {
      var k2 = Math.floor(rand() * (i2 + 1));
      var tmp = p[i2]; p[i2] = p[k2]; p[k2] = tmp;
    }
    for (var i3 = 0; i3 < 512; i3++) perm[i3] = p[i3 & 255];
  })();
  function fade(k) { return k * k * (3 - 2 * k); }
  function vnoise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var a2 = perm[(perm[xi & 255] + yi) & 255];
    var b2 = perm[(perm[(xi + 1) & 255] + yi) & 255];
    var c2 = perm[(perm[xi & 255] + yi + 1) & 255];
    var d2 = perm[(perm[(xi + 1) & 255] + yi + 1) & 255];
    var u = fade(xf), v = fade(yf);
    return (a2 + (b2 - a2) * u + (c2 - a2) * v + (a2 - b2 - c2 + d2) * u * v) / 255;
  }

  function idx(x, y) {
    x = x % fw; if (x < 0) x += fw;
    y = y % fh; if (y < 0) y += fh;
    return (y * fw + x) | 0;
  }
  function clampIdx(x, y) {
    x = Math.max(0, Math.min(fw - 1, Math.round(x)));
    y = Math.max(0, Math.min(fh - 1, Math.round(y)));
    return y * fw + x;
  }

  function buildFoods() {
    foods = [];
    var n = 6;
    var cx = fw / 2, cy = fh / 2, r = Math.min(fw, fh) * 0.42;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + rand() * 0.5;
      var rr = r * (0.7 + rand() * 0.3);
      foods.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, rand() * Math.PI * 2]);
    }
    food = new Float32Array(fw * fh);
    for (var y = 0; y < fh; y++) {
      for (var x = 0; x < fw; x++) {
        var best = 0;
        for (var p = 0; p < foods.length; p++) {
          var dx = x - foods[p][0], dy = y - foods[p][1];
          var d2b = dx * dx + dy * dy;
          var v = Math.exp(-d2b / (fw * 0.9));
          if (v > best) best = v;
        }
        food[y * fw + x] = best;
      }
    }
  }

  function sense(x, y) {
    var i = clampIdx(x, y);
    return trail[i] + food[i] * FOOD_W * CAP;
  }

  function initAgents() {
    ax = new Float32Array(AGENTS); ay = new Float32Array(AGENTS); ah = new Float32Array(AGENTS);
    var cx = fw / 2, cy = fh / 2, r = Math.min(fw, fh) * 0.12;
    for (var i = 0; i < AGENTS; i++) {
      var a = rand() * Math.PI * 2, rr = rand() * r;
      ax[i] = cx + Math.cos(a) * rr;
      ay[i] = cy + Math.sin(a) * rr;
      ah[i] = rand() * Math.PI * 2;
    }
  }

  function stepAgents() {
    for (var i = 0; i < AGENTS; i++) {
      var x = ax[i], y = ay[i], h = ah[i];
      var sf = sense(x + Math.cos(h) * SENSOR_DIST, y + Math.sin(h) * SENSOR_DIST);
      var sl = sense(x + Math.cos(h + SENSOR_ANGLE) * SENSOR_DIST, y + Math.sin(h + SENSOR_ANGLE) * SENSOR_DIST);
      var sr = sense(x + Math.cos(h - SENSOR_ANGLE) * SENSOR_DIST, y + Math.sin(h - SENSOR_ANGLE) * SENSOR_DIST);
      if (sf >= sl && sf >= sr) {
        // 직진
      } else if (sl > sr) {
        h += TURN;
      } else if (sr > sl) {
        h -= TURN;
      } else {
        h += (rand() < 0.5 ? 1 : -1) * TURN;
      }
      h += (rand() - 0.5) * 0.14;
      var nx = x + Math.cos(h) * STEP, ny = y + Math.sin(h) * STEP;
      nx = ((nx % fw) + fw) % fw; ny = ((ny % fh) + fh) % fh;
      ax[i] = nx; ay[i] = ny; ah[i] = h;
      var ii = idx(Math.round(nx), Math.round(ny));
      trail[ii] = Math.min(CAP, trail[ii] + DEPOSIT);
    }
    stepCount++;
  }

  function diffuseEvap() {
    for (var y = 0; y < fh; y++) {
      var ym = y === 0 ? fh - 1 : y - 1, yp = y === fh - 1 ? 0 : y + 1;
      var rowY = y * fw, rowYm = ym * fw, rowYp = yp * fw;
      for (var x = 0; x < fw; x++) {
        var xm = x === 0 ? fw - 1 : x - 1, xp = x === fw - 1 ? 0 : x + 1;
        var i = rowY + x;
        var avg = (trail[rowY + xm] + trail[rowY + xp] + trail[rowYm + x] + trail[rowYp + x]) * 0.25;
        trailB[i] = (trail[i] * (1 - DIFFUSE) + avg * DIFFUSE) * (1 - DECAY);
      }
    }
    var t = trail; trail = trailB; trailB = t;
  }

  function render(t) {
    for (var y = 0; y < fh; y++) {
      for (var x = 0; x < fw; x++) {
        var i = y * fw + x;
        var j = i * 4;
        var v = trail[i] / CAP; if (v > 1) v = 1;
        // 앰비언트 글로우 레이어 — 전면 확산 구조(314 기법): 두 옥타브 값노이즈로
        // 필드 전체를 크게 흔들어 간선·지선 구분과 별개로 누적면적을 화면 전역으로 채운다.
        var n1 = vnoise(x * 0.09, y * 0.09 + t * 0.9);
        var n2 = vnoise(x * 0.03 + 40, y * 0.03 + t * 0.6);
        var sh = (n1 - 0.5) * 28 + (n2 - 0.5) * 18;
        // 굵기 단계 — 옅은 트레일은 지선(branch) 색, 짙은 트레일은 간선(trunk) 색
        var kBranch = Math.min(1, v * 2.2);
        var kTrunk = Math.max(0, v - 0.45) * 1.8;
        var rr = C_FLOOR[0] + (C_BRANCH[0] - C_FLOOR[0]) * kBranch + (C_TRUNK[0] - C_BRANCH[0]) * kTrunk;
        var gg = C_FLOOR[1] + (C_BRANCH[1] - C_FLOOR[1]) * kBranch + (C_TRUNK[1] - C_BRANCH[1]) * kTrunk;
        var bb = C_FLOOR[2] + (C_BRANCH[2] - C_FLOOR[2]) * kBranch + (C_TRUNK[2] - C_BRANCH[2]) * kTrunk;
        for (var p = 0; p < foods.length; p++) {
          var dx = x - foods[p][0], dy = y - foods[p][1];
          var d2c = dx * dx + dy * dy;
          var pulse = 0.55 + 0.45 * Math.sin(t * 2.4 + foods[p][2]);
          var glow = Math.exp(-d2c / 20) * pulse;
          rr += (C_FOOD[0] - rr) * glow; gg += (C_FOOD[1] - gg) * glow; bb += (C_FOOD[2] - bb) * glow;
        }
        rr += sh; gg += sh; bb += sh;
        data[j] = rr; data[j + 1] = gg; data[j + 2] = bb; data[j + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    fw = Math.max(96, Math.min(200, Math.round(W / 3)));
    fh = Math.max(52, Math.min(120, Math.round(H / 3)));
    cv.width = fw; cv.height = fh;
    cv.style.width = '100%'; cv.style.height = '100%';
    ctx = cv.getContext('2d', { alpha: false });
    img = ctx.createImageData(fw, fh); data = img.data;
    trail = new Float32Array(fw * fh); trailB = new Float32Array(fw * fh);
    stepCount = 0;
    buildFoods();
    initAgents();
  }

  function stillFrame() {
    for (var k = 0; k < 260; k++) { stepAgents(); diffuseEvap(); }
    render(2.6);
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    for (var s = 0; s < SUBSTEPS; s++) { stepAgents(); diffuseEvap(); }
    render(t);
    if (nOut) nOut.textContent = String(AGENTS);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    fit();
    if (reduce) stillFrame();
  });

  fit();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
