<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다종 영역 경쟁 — 두 군집의 경계선 — 슬라임몰드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sm is-demo" id="smRoot">
  <p class="sm__hint">
    <span>種(species)ごとに自分のトレイルにだけ反応し、他種のトレイルは障害物として扱わせると、2色の群れが互いを押し合い、境界のはっきりした縄張りに画面を分けます</span>
  </p>
  <div class="sm__field" id="smField" role="application" aria-label="多種 縄張り競争 粘菌実験版" tabindex="0">
    <canvas class="sm__cv" id="smCv"></canvas>
  </div>
  <div class="sm__bar">
    <span class="sm__meta"><b class="sm__val" id="smN">0</b><span id="smUnit"> ステップ・2種の境界線</span></span>
    <span class="sm__meta sm__meta--dim">canvas · ImageData · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 다종 영역 경쟁(05). Physarum 스티그머지 + 두 페로몬 필드 상호 기피 —
// 종 A·B 는 각자의 트레일 필드만 따로 갖는다. 센싱 값은 "내 종 트레일 - 남의 종 트레일 × 기피가중"
// 이라 자기 흔적은 강화되고 상대 흔적은 장애물처럼 밀어낸다. 두 군집이 중앙에서 만나 서로
// 밀고 밀리며 화면이 뚜렷한 경계선을 가진 두 영역으로 갈라진다.
//
// 화면이 사는 장치 — 077 캔버스 기준의 "매 프레임 계산":
//  · 캔버스는 절대 clear 하지 않는다. 두 필드를 합성해 매 프레임 새로 계산해 얹는다.
//  · 앰비언트 글로우 레이어(두 옥타브 값노이즈)가 전면을 확산 구조로 흔들어 누적면적을 채운다.
(function () {
  // ── 변형 상수 블록 ──
  var AGENTS_A = 700, AGENTS_B = 700;   // 종마다 개체 수
  var DECAY = 0.048;                     // 증발률
  var REPEL_W = 1.7;                     // 상대 종 트레일 기피 가중치
  // ────────────────────────────────────
  var SENSOR_ANGLE = 0.5;
  var SENSOR_DIST = 5.0;
  var TURN = 0.5;
  var STEP = 1.05;
  var DEPOSIT = 4.2;
  var DIFFUSE = 0.5;
  var CAP = 7;
  var SUBSTEPS = 3;

  var root = document.getElementById('smRoot');
  var field = document.getElementById('smField');
  var cv = document.getElementById('smCv');
  var ctx = cv.getContext('2d', { alpha: false });
  var nOut = document.getElementById('smN');

  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x320A05);

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK = tokRGB('--sm-ink');
  var C_A   = tokRGB('--sm-a');
  var C_B   = tokRGB('--sm-b');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, fw = 0, fh = 0, raf = 0, t0 = -1;
  var trailA, trailAB, trailB, trailBB, img, data;
  var axA, ayA, ahA, axB, ayB, ahB;
  var stepCount = 0;

  // ── 값노이즈(앰비언트 글로우용) ──
  var perm = new Uint8Array(512);
  (function () {
    var p = [];
    for (var i = 0; i < 256; i++) p.push(i);
    for (var i2 = 255; i2 > 0; i2--) {
      var k2 = Math.floor(rand() * (i2 + 1));
      var tmp = p[i2]; p[i2] = p[k2]; p[k2] = tmp;
    }
    for (var i3 = 0; i3 < 512; i3++) perm[i3] = p[i3 & 255];
  })();
  function fade(k) { return k * k * (3 - 2 * k); }
  function vnoise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var a2 = perm[(perm[xi & 255] + yi) & 255];
    var b2 = perm[(perm[(xi + 1) & 255] + yi) & 255];
    var c2 = perm[(perm[xi & 255] + yi + 1) & 255];
    var d2 = perm[(perm[(xi + 1) & 255] + yi + 1) & 255];
    var u = fade(xf), v = fade(yf);
    return (a2 + (b2 - a2) * u + (c2 - a2) * v + (a2 - b2 - c2 + d2) * u * v) / 255;
  }

  function idx(x, y) {
    x = x % fw; if (x < 0) x += fw;
    y = y % fh; if (y < 0) y += fh;
    return (y * fw + x) | 0;
  }
  function clampIdx(x, y) {
    x = Math.max(0, Math.min(fw - 1, Math.round(x)));
    y = Math.max(0, Math.min(fh - 1, Math.round(y)));
    return y * fw + x;
  }

  function senseFrom(own, other, x, y) {
    var i = clampIdx(x, y);
    return own[i] - other[i] * REPEL_W;
  }

  function initSpecies(count, cx0) {
    var ax = new Float32Array(count), ay = new Float32Array(count), ah = new Float32Array(count);
    var cx = fw * cx0, cy = fh / 2, r = Math.min(fw, fh) * 0.13;
    for (var i = 0; i < count; i++) {
      var a = rand() * Math.PI * 2, rr = rand() * r;
      ax[i] = cx + Math.cos(a) * rr;
      ay[i] = cy + Math.sin(a) * rr;
      ah[i] = rand() * Math.PI * 2;
    }
    return [ax, ay, ah];
  }

  function stepSpecies(ax, ay, ah, count, own, other) {
    for (var i = 0; i < count; i++) {
      var x = ax[i], y = ay[i], h = ah[i];
      var sf = senseFrom(own, other, x + Math.cos(h) * SENSOR_DIST, y + Math.sin(h) * SENSOR_DIST);
      var sl = senseFrom(own, other, x + Math.cos(h + SENSOR_ANGLE) * SENSOR_DIST, y + Math.sin(h + SENSOR_ANGLE) * SENSOR_DIST);
      var sr = senseFrom(own, other, x + Math.cos(h - SENSOR_ANGLE) * SENSOR_DIST, y + Math.sin(h - SENSOR_ANGLE) * SENSOR_DIST);
      if (sf >= sl && sf >= sr) {
        // 직진
      } else if (sl > sr) {
        h += TURN;
      } else if (sr > sl) {
        h -= TURN;
      } else {
        h += (rand() < 0.5 ? 1 : -1) * TURN;
      }
      h += (rand() - 0.5) * 0.14;
      var nx = x + Math.cos(h) * STEP, ny = y + Math.sin(h) * STEP;
      nx = ((nx % fw) + fw) % fw; ny = ((ny % fh) + fh) % fh;
      ax[i] = nx; ay[i] = ny; ah[i] = h;
      var ii = idx(Math.round(nx), Math.round(ny));
      own[ii] = Math.min(CAP, own[ii] + DEPOSIT);
    }
  }

  function diffuseEvapOne(field0, field1) {
    for (var y = 0; y < fh; y++) {
      var ym = y === 0 ? fh - 1 : y - 1, yp = y === fh - 1 ? 0 : y + 1;
      var rowY = y * fw, rowYm = ym * fw, rowYp = yp * fw;
      for (var x = 0; x < fw; x++) {
        var xm = x === 0 ? fw - 1 : x - 1, xp = x === fw - 1 ? 0 : x + 1;
        var i = rowY + x;
        var avg = (field0[rowY + xm] + field0[rowY + xp] + field0[rowYm + x] + field0[rowYp + x]) * 0.25;
        field1[i] = (field0[i] * (1 - DIFFUSE) + avg * DIFFUSE) * (1 - DECAY);
      }
    }
  }

  function render(t) {
    for (var y = 0; y < fh; y++) {
      for (var x = 0; x < fw; x++) {
        var i = y * fw + x;
        var j = i * 4;
        var va = trailA[i] / CAP; if (va > 1) va = 1;
        var vb = trailB[i] / CAP; if (vb > 1) vb = 1;
        var ka = va * va * (3 - 2 * va);
        var kb = vb * vb * (3 - 2 * vb);
        var rr = C_INK[0] + (C_A[0] - C_INK[0]) * ka + (C_B[0] - C_INK[0]) * kb;
        var gg = C_INK[1] + (C_A[1] - C_INK[1]) * ka + (C_B[1] - C_INK[1]) * kb;
        var bb = C_INK[2] + (C_A[2] - C_INK[2]) * ka + (C_B[2] - C_INK[2]) * kb;
        var n1 = vnoise(x * 0.09, y * 0.09 + t * 0.9);
        var n2 = vnoise(x * 0.03 + 40, y * 0.03 + t * 0.6);
        var sh = (n1 - 0.5) * 22 + (n2 - 0.5) * 14;
        rr += sh; gg += sh; bb += sh;
        data[j] = rr; data[j + 1] = gg; data[j + 2] = bb; data[j + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    fw = Math.max(96, Math.min(200, Math.round(W / 3)));
    fh = Math.max(52, Math.min(120, Math.round(H / 3)));
    cv.width = fw; cv.height = fh;
    cv.style.width = '100%'; cv.style.height = '100%';
    ctx = cv.getContext('2d', { alpha: false });
    img = ctx.createImageData(fw, fh); data = img.data;
    trailA = new Float32Array(fw * fh); trailAB = new Float32Array(fw * fh);
    trailB = new Float32Array(fw * fh); trailBB = new Float32Array(fw * fh);
    stepCount = 0;
    var sa = initSpecies(AGENTS_A, 0.3); axA = sa[0]; ayA = sa[1]; ahA = sa[2];
    var sb = initSpecies(AGENTS_B, 0.7); axB = sb[0]; ayB = sb[1]; ahB = sb[2];
  }

  function stepAll() {
    stepSpecies(axA, ayA, ahA, AGENTS_A, trailA, trailB);
    stepSpecies(axB, ayB, ahB, AGENTS_B, trailB, trailA);
    diffuseEvapOne(trailA, trailAB);
    diffuseEvapOne(trailB, trailBB);
    var ta = trailA; trailA = trailAB; trailAB = ta;
    var tb = trailB; trailB = trailBB; trailBB = tb;
    stepCount++;
  }

  function stillFrame() {
    for (var k = 0; k < 260; k++) stepAll();
    render(2.6);
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    for (var s = 0; s < SUBSTEPS; s++) stepAll();
    render(t);
    if (nOut) nOut.textContent = String(stepCount);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    fit();
    if (reduce) stillFrame();
  });

  fit();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
