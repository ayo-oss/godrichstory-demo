<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매크로 발광 씬 — 다큐멘터리 조명의 점균 — 슬라임몰드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sm is-demo" id="smRoot">
  <p class="sm__hint">
    <span>Light a dark stage with a radial gradient and grow one large network — it reads like a documentary macro shot, with tendrils at the trail tips still writhing to keep the frame alive</span>
  </p>
  <div class="sm__field" id="smField" role="application" aria-label="Macro Bioluminescent Slime Demo" tabindex="0">
    <canvas class="sm__cv" id="smCv"></canvas>
  </div>
  <div class="sm__bar">
    <span class="sm__meta"><b class="sm__val" id="smN">0</b><span id="smUnit"> steps · macro lighting</span></span>
    <span class="sm__meta sm__meta--dim">canvas · createRadialGradient · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 매크로 발광 씬(09). Physarum 스티그머지 + createRadialGradient 조명 베이스 —
// 검은 무대 위에 createRadialGradient 로 만든 중앙 조명 버퍼를 한 번 그려 base 캔버스에
// 굳히고, 매 프레임 base 를 drawImage 로 깔은 뒤 그 위에 트레일·에이전트 발광을 가산 합성한다.
// 트레일 끝(에이전트가 방금 지나간 자리)은 촉수처럼 밝게 꿈틀댄다 — 다큐멘터리 접사 톤.
//
// 화면이 사는 장치 — 077 캔버스 기준의 "매 프레임 계산":
//  · 캔버스는 절대 clear 하지 않는다. 조명 베이스 위에 트레일·글로우를 매 프레임 새로 얹는다.
//  · 앰비언트 글로우 레이어(두 옥타브 값노이즈)가 전면을 확산 구조로 흔들어 누적면적을 채운다.
(function () {
  // ── 변형 상수 블록 ──
  var AGENTS = 1300;        // 동시에 걷는 에이전트 수
  var DECAY = 0.04;         // 증발률
  var LIGHT_RADIUS = 0.62;  // 중앙 조명 반경(필드 짧은 변 대비 비율)
  // ────────────────────────────────────
  var SENSOR_ANGLE = 0.5;
  var SENSOR_DIST = 5.0;
  var TURN = 0.5;
  var STEP = 1.05;
  var DEPOSIT = 4.2;
  var DIFFUSE = 0.5;
  var CAP = 7;
  var SUBSTEPS = 3;

  var root = document.getElementById('smRoot');
  var field = document.getElementById('smField');
  var cv = document.getElementById('smCv');
  var ctx = cv.getContext('2d', { alpha: false });
  var nOut = document.getElementById('smN');

  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x320A09);

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_DARK  = tokRGB('--sm-dark');
  var C_LIGHT = tokRGB('--sm-light');
  var C_GLOW  = tokRGB('--sm-glow');
  var C_TIP   = tokRGB('--sm-tip');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, fw = 0, fh = 0, raf = 0, t0 = -1;
  var trail, trailB, lightBase, img, data;
  var ax, ay, ah, lastVisit;
  var stepCount = 0;

  // ── 값노이즈(앰비언트 글로우용) ──
  var perm = new Uint8Array(512);
  (function () {
    var p = [];
    for (var i = 0; i < 256; i++) p.push(i);
    for (var i2 = 255; i2 > 0; i2--) {
      var k2 = Math.floor(rand() * (i2 + 1));
      var tmp = p[i2]; p[i2] = p[k2]; p[k2] = tmp;
    }
    for (var i3 = 0; i3 < 512; i3++) perm[i3] = p[i3 & 255];
  })();
  function fade(k) { return k * k * (3 - 2 * k); }
  function vnoise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var a2 = perm[(perm[xi & 255] + yi) & 255];
    var b2 = perm[(perm[(xi + 1) & 255] + yi) & 255];
    var c2 = perm[(perm[xi & 255] + yi + 1) & 255];
    var d2 = perm[(perm[(xi + 1) & 255] + yi + 1) & 255];
    var u = fade(xf), v = fade(yf);
    return (a2 + (b2 - a2) * u + (c2 - a2) * v + (a2 - b2 - c2 + d2) * u * v) / 255;
  }

  function idx(x, y) {
    x = x % fw; if (x < 0) x += fw;
    y = y % fh; if (y < 0) y += fh;
    return (y * fw + x) | 0;
  }
  function clampIdx(x, y) {
    x = Math.max(0, Math.min(fw - 1, Math.round(x)));
    y = Math.max(0, Math.min(fh - 1, Math.round(y)));
    return y * fw + x;
  }

  // createRadialGradient 로 만든 중앙 조명 베이스 — 한 번만 만들어 lightBase 에 픽셀로 굳힌다.
  function buildLightBase() {
    var off = document.createElement('canvas');
    off.width = fw; off.height = fh;
    var octx = off.getContext('2d');
    var cx = fw / 2, cy = fh / 2, r = Math.min(fw, fh) * LIGHT_RADIUS;
    var g = octx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, 'rgb(' + C_LIGHT[0] + ',' + C_LIGHT[1] + ',' + C_LIGHT[2] + ')');
    g.addColorStop(0.55, 'rgb(' + Math.round((C_LIGHT[0] + C_DARK[0]) / 2) + ',' + Math.round((C_LIGHT[1] + C_DARK[1]) / 2) + ',' + Math.round((C_LIGHT[2] + C_DARK[2]) / 2) + ')');
    g.addColorStop(1, 'rgb(' + C_DARK[0] + ',' + C_DARK[1] + ',' + C_DARK[2] + ')');
    octx.fillStyle = g;
    octx.fillRect(0, 0, fw, fh);
    var d = octx.getImageData(0, 0, fw, fh).data;
    lightBase = new Float32Array(fw * fh * 3);
    for (var i = 0, p = 0; i < d.length; i += 4, p += 3) {
      lightBase[p] = d[i]; lightBase[p + 1] = d[i + 1]; lightBase[p + 2] = d[i + 2];
    }
  }

  function sense(x, y) {
    return trail[clampIdx(x, y)];
  }

  function initAgents() {
    ax = new Float32Array(AGENTS); ay = new Float32Array(AGENTS); ah = new Float32Array(AGENTS);
    var cx = fw / 2, cy = fh / 2, r = Math.min(fw, fh) * 0.16;
    for (var i = 0; i < AGENTS; i++) {
      var a = rand() * Math.PI * 2, rr = rand() * r;
      ax[i] = cx + Math.cos(a) * rr;
      ay[i] = cy + Math.sin(a) * rr;
      ah[i] = rand() * Math.PI * 2;
    }
  }

  function stepAgents() {
    for (var i = 0; i < AGENTS; i++) {
      var x = ax[i], y = ay[i], h = ah[i];
      var sf = sense(x + Math.cos(h) * SENSOR_DIST, y + Math.sin(h) * SENSOR_DIST);
      var sl = sense(x + Math.cos(h + SENSOR_ANGLE) * SENSOR_DIST, y + Math.sin(h + SENSOR_ANGLE) * SENSOR_DIST);
      var sr = sense(x + Math.cos(h - SENSOR_ANGLE) * SENSOR_DIST, y + Math.sin(h - SENSOR_ANGLE) * SENSOR_DIST);
      if (sf >= sl && sf >= sr) {
        // 직진
      } else if (sl > sr) {
        h += TURN;
      } else if (sr > sl) {
        h -= TURN;
      } else {
        h += (rand() < 0.5 ? 1 : -1) * TURN;
      }
      h += (rand() - 0.5) * 0.14;
      var nx = x + Math.cos(h) * STEP, ny = y + Math.sin(h) * STEP;
      nx = ((nx % fw) + fw) % fw; ny = ((ny % fh) + fh) % fh;
      ax[i] = nx; ay[i] = ny; ah[i] = h;
      var ii = idx(Math.round(nx), Math.round(ny));
      trail[ii] = Math.min(CAP, trail[ii] + DEPOSIT);
      lastVisit[ii] = stepCount;
    }
    stepCount++;
  }

  function diffuseEvap() {
    for (var y = 0; y < fh; y++) {
      var ym = y === 0 ? fh - 1 : y - 1, yp = y === fh - 1 ? 0 : y + 1;
      var rowY = y * fw, rowYm = ym * fw, rowYp = yp * fw;
      for (var x = 0; x < fw; x++) {
        var xm = x === 0 ? fw - 1 : x - 1, xp = x === fw - 1 ? 0 : x + 1;
        var i = rowY + x;
        var avg = (trail[rowY + xm] + trail[rowY + xp] + trail[rowYm + x] + trail[rowYp + x]) * 0.25;
        trailB[i] = (trail[i] * (1 - DIFFUSE) + avg * DIFFUSE) * (1 - DECAY);
      }
    }
    var t = trail; trail = trailB; trailB = t;
  }

  function render(t) {
    for (var y = 0; y < fh; y++) {
      for (var x = 0; x < fw; x++) {
        var i = y * fw + x;
        var j = i * 4;
        var p = i * 3;
        var rr = lightBase[p], gg = lightBase[p + 1], bb = lightBase[p + 2];
        var v = trail[i] / CAP; if (v > 1) v = 1;
        var k = v * v * (3 - 2 * v);
        rr += (C_GLOW[0] - rr) * k; gg += (C_GLOW[1] - gg) * k; bb += (C_GLOW[2] - bb) * k;
        // 촉수 끝 — 방금 밟힌(나이 짧은) 셀은 가산 발광으로 더 밝게 꿈틀댄다
        var lv = lastVisit[i];
        var age = lv < 0 ? 999 : stepCount - lv;
        if (age < 10) {
          var tipK = (1 - age / 10) * (0.55 + 0.45 * Math.sin(t * 5 + x * 0.3 + y * 0.2));
          rr += (C_TIP[0] - rr) * tipK * 0.7;
          gg += (C_TIP[1] - gg) * tipK * 0.7;
          bb += (C_TIP[2] - bb) * tipK * 0.7;
        }
        var n1 = vnoise(x * 0.09, y * 0.09 + t * 0.9);
        var n2 = vnoise(x * 0.03 + 40, y * 0.03 + t * 0.6);
        var sh = (n1 - 0.5) * 20 + (n2 - 0.5) * 14;
        rr += sh; gg += sh; bb += sh;
        data[j] = rr; data[j + 1] = gg; data[j + 2] = bb; data[j + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    fw = Math.max(96, Math.min(200, Math.round(W / 3)));
    fh = Math.max(52, Math.min(120, Math.round(H / 3)));
    cv.width = fw; cv.height = fh;
    cv.style.width = '100%'; cv.style.height = '100%';
    ctx = cv.getContext('2d', { alpha: false });
    img = ctx.createImageData(fw, fh); data = img.data;
    trail = new Float32Array(fw * fh); trailB = new Float32Array(fw * fh);
    lastVisit = new Float32Array(fw * fh);
    for (var i = 0; i < lastVisit.length; i++) lastVisit[i] = -9999;
    stepCount = 0;
    buildLightBase();
    initAgents();
  }

  function stillFrame() {
    for (var k = 0; k < 260; k++) { stepAgents(); diffuseEvap(); }
    render(2.6);
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    for (var s = 0; s < SUBSTEPS; s++) { stepAgents(); diffuseEvap(); }
    render(t);
    if (nOut) nOut.textContent = String(stepCount);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    fit();
    if (reduce) stillFrame();
  });

  fit();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
