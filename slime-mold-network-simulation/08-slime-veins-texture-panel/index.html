<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유기체 텍스처 패널 — 자란 순간의 정지 캡처 — 슬라임몰드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sm is-demo" id="smRoot">
  <p class="sm__hint">
    <span>네트워크가 다 자란 순간의 캔버스를 정지 이미지로 굳혀 옅은 투명도로 깔면, 움직이지 않아도 손으로 그린 듯한 유기적 질감이 카드·섹션 배경이 됩니다</span>
  </p>
  <div class="sm__field" id="smField" role="application" aria-label="유기체 텍스처 패널 점균 실험판" tabindex="0">
    <canvas class="sm__cv" id="smCv"></canvas>
    <div class="sm__veil" id="smVeil" aria-hidden="true">
      <div class="sm__card">
        <p class="sm__card-t">Organic Section</p>
        <p class="sm__card-s">hand-drawn texture · slime network</p>
      </div>
    </div>
  </div>
  <div class="sm__bar">
    <span class="sm__meta"><b class="sm__val" id="smN">0</b><span id="smUnit"> 캡처 · 정지 질감</span></span>
    <span class="sm__meta sm__meta--dim">canvas · ImageData · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 유기체 텍스처 패널(08). Physarum 스티그머지 + 성장 캡처 → 정지 질감 재사용 —
// 시뮬레이션이 GROW_STEPS 스텝 동안 네트워크를 키운다. 다 자란 순간 필드를 snapshot 배열에
// 통째로 복사해 "정지 이미지"로 굳히고, 이후 렌더는 그 스냅샷을 카드 배경처럼 옅게 깐다.
// 위에 얹은 카드 DOM(.sm__veil .sm__card)이 "이 질감이 실제 UI 배경으로 쓰이는 모습"을 보여준다.
// .is-demo 동안은 캡처→재성장을 주기적으로 반복해 질감이 계속 새로 만들어지듯 보이게 한다.
//
// 화면이 사는 장치 — 077 캔버스 기준의 "매 프레임 계산":
//  · 스냅샷 위에 앰비언트 글로우 레이어(두 옥타브 값노이즈)가 전면을 흔들어 누적면적을 채운다.
//  · 캡처 경계마다 질감이 스르르 크로스페이드되며 화면이 죽지 않는다.
(function () {
  // ── 변형 상수 블록 ──
  var AGENTS = 1300;       // 동시에 걷는 에이전트 수
  var DECAY = 0.042;       // 증발률
  var GROW_STEPS = 130;    // 질감을 굳히기 전 성장 스텝 수
  // ────────────────────────────────────
  var SENSOR_ANGLE = 0.5;
  var SENSOR_DIST = 5.0;
  var TURN = 0.5;
  var STEP = 1.05;
  var DEPOSIT = 4.2;
  var DIFFUSE = 0.5;
  var CAP = 7;
  var SUBSTEPS = 3;
  var FADE = 0.7;          // 캡처 교체 크로스페이드 길이(초)

  var root = document.getElementById('smRoot');
  var field = document.getElementById('smField');
  var cv = document.getElementById('smCv');
  var ctx = cv.getContext('2d', { alpha: false });
  var nOut = document.getElementById('smN');

  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x320A08);

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_FLOOR = tokRGB('--sm-floor');
  var C_TRAIL = tokRGB('--sm-trail');
  var C_ACCT  = tokRGB('--sm-acct');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, fw = 0, fh = 0, raf = 0, t0 = -1;
  var trail, trailB, img, data;
  var snapOld, snapNew;      // 직전 질감 · 방금 잡은 질감
  var ax, ay, ah;
  var stepCount = 0;
  var captureCount = 0;
  var fadeT = -1;            // 크로스페이드 시작 시각(-1 = 페이드 아님)

  // ── 값노이즈(앰비언트 글로우용) ──
  var perm = new Uint8Array(512);
  (function () {
    var p = [];
    for (var i = 0; i < 256; i++) p.push(i);
    for (var i2 = 255; i2 > 0; i2--) {
      var k2 = Math.floor(rand() * (i2 + 1));
      var tmp = p[i2]; p[i2] = p[k2]; p[k2] = tmp;
    }
    for (var i3 = 0; i3 < 512; i3++) perm[i3] = p[i3 & 255];
  })();
  function fade2(k) { return k * k * (3 - 2 * k); }
  function vnoise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var a2 = perm[(perm[xi & 255] + yi) & 255];
    var b2 = perm[(perm[(xi + 1) & 255] + yi) & 255];
    var c2 = perm[(perm[xi & 255] + yi + 1) & 255];
    var d2 = perm[(perm[(xi + 1) & 255] + yi + 1) & 255];
    var u = fade2(xf), v = fade2(yf);
    return (a2 + (b2 - a2) * u + (c2 - a2) * v + (a2 - b2 - c2 + d2) * u * v) / 255;
  }

  function idx(x, y) {
    x = x % fw; if (x < 0) x += fw;
    y = y % fh; if (y < 0) y += fh;
    return (y * fw + x) | 0;
  }
  function clampIdx(x, y) {
    x = Math.max(0, Math.min(fw - 1, Math.round(x)));
    y = Math.max(0, Math.min(fh - 1, Math.round(y)));
    return y * fw + x;
  }

  function sense(x, y) {
    return trail[clampIdx(x, y)];
  }

  function initAgents() {
    ax = new Float32Array(AGENTS); ay = new Float32Array(AGENTS); ah = new Float32Array(AGENTS);
    var cx = fw / 2, cy = fh / 2, r = Math.min(fw, fh) * 0.15;
    for (var i = 0; i < AGENTS; i++) {
      var a = rand() * Math.PI * 2, rr = rand() * r;
      ax[i] = cx + Math.cos(a) * rr;
      ay[i] = cy + Math.sin(a) * rr;
      ah[i] = rand() * Math.PI * 2;
    }
  }

  function stepAgents() {
    for (var i = 0; i < AGENTS; i++) {
      var x = ax[i], y = ay[i], h = ah[i];
      var sf = sense(x + Math.cos(h) * SENSOR_DIST, y + Math.sin(h) * SENSOR_DIST);
      var sl = sense(x + Math.cos(h + SENSOR_ANGLE) * SENSOR_DIST, y + Math.sin(h + SENSOR_ANGLE) * SENSOR_DIST);
      var sr = sense(x + Math.cos(h - SENSOR_ANGLE) * SENSOR_DIST, y + Math.sin(h - SENSOR_ANGLE) * SENSOR_DIST);
      if (sf >= sl && sf >= sr) {
        // 직진
      } else if (sl > sr) {
        h += TURN;
      } else if (sr > sl) {
        h -= TURN;
      } else {
        h += (rand() < 0.5 ? 1 : -1) * TURN;
      }
      h += (rand() - 0.5) * 0.14;
      var nx = x + Math.cos(h) * STEP, ny = y + Math.sin(h) * STEP;
      nx = ((nx % fw) + fw) % fw; ny = ((ny % fh) + fh) % fh;
      ax[i] = nx; ay[i] = ny; ah[i] = h;
      var ii = idx(Math.round(nx), Math.round(ny));
      trail[ii] = Math.min(CAP, trail[ii] + DEPOSIT);
    }
    stepCount++;
  }

  function diffuseEvap() {
    for (var y = 0; y < fh; y++) {
      var ym = y === 0 ? fh - 1 : y - 1, yp = y === fh - 1 ? 0 : y + 1;
      var rowY = y * fw, rowYm = ym * fw, rowYp = yp * fw;
      for (var x = 0; x < fw; x++) {
        var xm = x === 0 ? fw - 1 : x - 1, xp = x === fw - 1 ? 0 : x + 1;
        var i = rowY + x;
        var avg = (trail[rowY + xm] + trail[rowY + xp] + trail[rowYm + x] + trail[rowYp + x]) * 0.25;
        trailB[i] = (trail[i] * (1 - DIFFUSE) + avg * DIFFUSE) * (1 - DECAY);
      }
    }
    var t = trail; trail = trailB; trailB = t;
  }

  function capture() {
    // 지금 필드를 통째로 굳혀 새 질감으로 삼고, 필드는 비워 다음 성장을 시작한다.
    var tmp = snapOld;
    snapOld = snapNew;
    snapNew = tmp;
    if (!snapNew) snapNew = new Float32Array(fw * fh);
    snapNew.set(trail);
    captureCount++;
    if (nOut) nOut.textContent = String(captureCount);
    for (var i = 0; i < trail.length; i++) trail[i] = 0;
    stepCount = 0;
    initAgents();
  }

  function render(t) {
    var mix = 1;
    if (fadeT >= 0) {
      mix = (t - fadeT) / FADE;
      if (mix > 1) mix = 1;
      mix = mix * mix * (3 - 2 * mix);
    }
    for (var y = 0; y < fh; y++) {
      for (var x = 0; x < fw; x++) {
        var i = y * fw + x;
        var j = i * 4;
        // 정지 질감 두 장의 크로스페이드 — 카드 배경은 "캡처된" 필드에서 온다
        var vOld = snapOld && snapOld.length === trail.length ? snapOld[i] / CAP : 0;
        var vNew = snapNew ? snapNew[i] / CAP : 0;
        if (vOld > 1) vOld = 1; if (vNew > 1) vNew = 1;
        var v = vOld + (vNew - vOld) * mix;
        var k = v * v * (3 - 2 * v);
        var rr = C_FLOOR[0] + (C_TRAIL[0] - C_FLOOR[0]) * k * 0.5;
        var gg = C_FLOOR[1] + (C_TRAIL[1] - C_FLOOR[1]) * k * 0.5;
        var bb = C_FLOOR[2] + (C_TRAIL[2] - C_FLOOR[2]) * k * 0.5;
        // 성장 중인 필드는 뚜렷하게 함께 비친다(다음 질감이 자라나는 과정)
        var vGrow = trail[i] / CAP; if (vGrow > 1) vGrow = 1;
        var kGrow = vGrow * vGrow * (3 - 2 * vGrow);
        rr += (C_ACCT[0] - rr) * kGrow * 0.5;
        gg += (C_ACCT[1] - gg) * kGrow * 0.5;
        bb += (C_ACCT[2] - bb) * kGrow * 0.5;
        var n1 = vnoise(x * 0.09, y * 0.09 + t * 0.9);
        var n2 = vnoise(x * 0.03 + 40, y * 0.03 + t * 0.6);
        var sh = (n1 - 0.5) * 30 + (n2 - 0.5) * 20;
        rr += sh; gg += sh; bb += sh;
        data[j] = rr; data[j + 1] = gg; data[j + 2] = bb; data[j + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    fw = Math.max(96, Math.min(200, Math.round(W / 3)));
    fh = Math.max(52, Math.min(120, Math.round(H / 3)));
    cv.width = fw; cv.height = fh;
    cv.style.width = '100%'; cv.style.height = '100%';
    ctx = cv.getContext('2d', { alpha: false });
    img = ctx.createImageData(fw, fh); data = img.data;
    trail = new Float32Array(fw * fh); trailB = new Float32Array(fw * fh);
    snapOld = null; snapNew = null;
    stepCount = 0; captureCount = 0; fadeT = -1;
    initAgents();
  }

  function stillFrame() {
    for (var k = 0; k < GROW_STEPS; k++) { stepAgents(); diffuseEvap(); }
    capture();
    render(2.6);
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    for (var i = 0; i < SUBSTEPS; i++) { stepAgents(); diffuseEvap(); }
    if (stepCount >= GROW_STEPS) { capture(); fadeT = t; }
    if (fadeT >= 0 && t - fadeT > FADE) fadeT = -1;
    render(t);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    fit();
    if (reduce) stillFrame();
  });

  fit();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
