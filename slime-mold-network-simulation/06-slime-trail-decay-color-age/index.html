<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>트레일 나이 채색 — 네온 잔상 — 슬라임몰드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sm is-demo" id="smRoot">
  <p class="sm__hint">
    <span>각 셀에 마지막으로 밟힌 시각을 기록해 오래될수록 색을 어둡게 죽이면, 활발히 쓰이는 간선만 네온처럼 밝게 남고 버려진 지선은 자연히 사라집니다</span>
  </p>
  <div class="sm__field" id="smField" role="application" aria-label="트레일 나이 채색 점균 실험판" tabindex="0">
    <canvas class="sm__cv" id="smCv"></canvas>
  </div>
  <div class="sm__bar">
    <span class="sm__meta"><b class="sm__val" id="smN">0</b><span id="smUnit"> 스텝 · 트레일 나이</span></span>
    <span class="sm__meta sm__meta--dim">canvas · ImageData · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 트레일 나이 채색(06). Physarum 스티그머지 + 셀별 마지막 방문 시각 —
// trail 대신 lastVisit Float32Array 에 "이 셀을 마지막으로 밟은 스텝 번호"를 기록한다.
// 렌더는 나이(age = 현재스텝 - 마지막방문)로 색을 정한다: 방금 밟힌 셀은 네온처럼 밝고,
// 나이가 차면 어둡게 죽는다. 여러 먹이 앵커를 두고 트레일이 쓰이는 간선만 살아남는 모습.
//
// 화면이 사는 장치 — 077 캔버스 기준의 "매 프레임 계산":
//  · 캔버스는 절대 clear 하지 않는다. 나이 필드를 매 프레임 새로 계산해 얹는다.
//  · 앰비언트 글로우 레이어(두 옥타브 값노이즈)가 전면을 확산 구조로 흔들어 누적면적을 채운다.
(function () {
  // ── 변형 상수 블록 ──
  var AGENTS = 1400;        // 동시에 걷는 에이전트 수
  var DECAY_STEPS = 46;     // 트레일이 완전히 죽는 데 걸리는 스텝 수(나이 수명)
  // ────────────────────────────────────
  var SENSOR_ANGLE = 0.5;
  var SENSOR_DIST = 5.0;
  var TURN = 0.5;
  var STEP = 1.05;
  var DIFFUSE = 0.5;
  var SUBSTEPS = 3;
  var FOOD_W = 2.0;

  var root = document.getElementById('smRoot');
  var field = document.getElementById('smField');
  var cv = document.getElementById('smCv');
  var ctx = cv.getContext('2d', { alpha: false });
  var nOut = document.getElementById('smN');

  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x320A06);

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK    = tokRGB('--sm-ink');
  var C_OLD    = tokRGB('--sm-old');
  var C_FRESH  = tokRGB('--sm-fresh');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, fw = 0, fh = 0, raf = 0, t0 = -1;
  var lastVisit, trail, trailB, food, img, data;
  var ax, ay, ah;
  var stepCount = 0;
  var foods = [];

  // ── 값노이즈(앰비언트 글로우용) ──
  var perm = new Uint8Array(512);
  (function () {
    var p = [];
    for (var i = 0; i < 256; i++) p.push(i);
    for (var i2 = 255; i2 > 0; i2--) {
      var k2 = Math.floor(rand() * (i2 + 1));
      var tmp = p[i2]; p[i2] = p[k2]; p[k2] = tmp;
    }
    for (var i3 = 0; i3 < 512; i3++) perm[i3] = p[i3 & 255];
  })();
  function fade(k) { return k * k * (3 - 2 * k); }
  function vnoise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var a2 = perm[(perm[xi & 255] + yi) & 255];
    var b2 = perm[(perm[(xi + 1) & 255] + yi) & 255];
    var c2 = perm[(perm[xi & 255] + yi + 1) & 255];
    var d2 = perm[(perm[(xi + 1) & 255] + yi + 1) & 255];
    var u = fade(xf), v = fade(yf);
    return (a2 + (b2 - a2) * u + (c2 - a2) * v + (a2 - b2 - c2 + d2) * u * v) / 255;
  }

  function idx(x, y) {
    x = x % fw; if (x < 0) x += fw;
    y = y % fh; if (y < 0) y += fh;
    return (y * fw + x) | 0;
  }
  function clampIdx(x, y) {
    x = Math.max(0, Math.min(fw - 1, Math.round(x)));
    y = Math.max(0, Math.min(fh - 1, Math.round(y)));
    return y * fw + x;
  }

  function buildFoods() {
    foods = [];
    var n = 5;
    var cx = fw / 2, cy = fh / 2, r = Math.min(fw, fh) * 0.4;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + rand() * 0.6;
      var rr = r * (0.72 + rand() * 0.28);
      foods.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, rand() * Math.PI * 2]);
    }
    food = new Float32Array(fw * fh);
    for (var y = 0; y < fh; y++) {
      for (var x = 0; x < fw; x++) {
        var best = 0;
        for (var p = 0; p < foods.length; p++) {
          var dx = x - foods[p][0], dy = y - foods[p][1];
          var v = Math.exp(-(dx * dx + dy * dy) / (fw * 0.9));
          if (v > best) best = v;
        }
        food[y * fw + x] = best;
      }
    }
  }

  function sense(x, y) {
    var i = clampIdx(x, y);
    // 나이 필드를 감지에도 그대로 쓴다: 최근 밟힌 셀 = 진한 트레일
    var lv = lastVisit[i];
    var ageK = lv < 0 ? 0 : Math.max(0, 1 - (stepCount - lv) / DECAY_STEPS);
    return ageK * 4 + food[i] * FOOD_W;
  }

  function initAgents() {
    ax = new Float32Array(AGENTS); ay = new Float32Array(AGENTS); ah = new Float32Array(AGENTS);
    var cx = fw / 2, cy = fh / 2, r = Math.min(fw, fh) * 0.14;
    for (var i = 0; i < AGENTS; i++) {
      var a = rand() * Math.PI * 2, rr = rand() * r;
      ax[i] = cx + Math.cos(a) * rr;
      ay[i] = cy + Math.sin(a) * rr;
      ah[i] = rand() * Math.PI * 2;
    }
  }

  function stepAgents() {
    for (var i = 0; i < AGENTS; i++) {
      var x = ax[i], y = ay[i], h = ah[i];
      var sf = sense(x + Math.cos(h) * SENSOR_DIST, y + Math.sin(h) * SENSOR_DIST);
      var sl = sense(x + Math.cos(h + SENSOR_ANGLE) * SENSOR_DIST, y + Math.sin(h + SENSOR_ANGLE) * SENSOR_DIST);
      var sr = sense(x + Math.cos(h - SENSOR_ANGLE) * SENSOR_DIST, y + Math.sin(h - SENSOR_ANGLE) * SENSOR_DIST);
      if (sf >= sl && sf >= sr) {
        // 직진
      } else if (sl > sr) {
        h += TURN;
      } else if (sr > sl) {
        h -= TURN;
      } else {
        h += (rand() < 0.5 ? 1 : -1) * TURN;
      }
      h += (rand() - 0.5) * 0.14;
      var nx = x + Math.cos(h) * STEP, ny = y + Math.sin(h) * STEP;
      nx = ((nx % fw) + fw) % fw; ny = ((ny % fh) + fh) % fh;
      ax[i] = nx; ay[i] = ny; ah[i] = h;
      var ii = idx(Math.round(nx), Math.round(ny));
      lastVisit[ii] = stepCount;
    }
    stepCount++;
  }

  function render(t) {
    for (var y = 0; y < fh; y++) {
      for (var x = 0; x < fw; x++) {
        var i = y * fw + x;
        var j = i * 4;
        var lv = lastVisit[i];
        var k = 0;
        if (lv >= 0) {
          var age = stepCount - lv;
          if (age < DECAY_STEPS) k = 1 - age / DECAY_STEPS;
        }
        k = k * k * (3 - 2 * k);   // 나이 페이드를 부드럽게
        var rr = C_INK[0] + (C_OLD[0] - C_INK[0]) * Math.min(1, k * 2.4) + (C_FRESH[0] - C_OLD[0]) * Math.max(0, k - 0.35) * 1.54;
        var gg = C_INK[1] + (C_OLD[1] - C_INK[1]) * Math.min(1, k * 2.4) + (C_FRESH[1] - C_OLD[1]) * Math.max(0, k - 0.35) * 1.54;
        var bb = C_INK[2] + (C_OLD[2] - C_INK[2]) * Math.min(1, k * 2.4) + (C_FRESH[2] - C_OLD[2]) * Math.max(0, k - 0.35) * 1.54;
        for (var p = 0; p < foods.length; p++) {
          var dx = x - foods[p][0], dy = y - foods[p][1];
          var pulse = 0.55 + 0.45 * Math.sin(t * 2.2 + foods[p][2]);
          var glow = Math.exp(-(dx * dx + dy * dy) / 18) * pulse * 0.5;
          rr += (C_FRESH[0] - rr) * glow; gg += (C_FRESH[1] - gg) * glow; bb += (C_FRESH[2] - bb) * glow;
        }
        var n1 = vnoise(x * 0.09, y * 0.09 + t * 0.9);
        var n2 = vnoise(x * 0.03 + 40, y * 0.03 + t * 0.6);
        var sh = (n1 - 0.5) * 30 + (n2 - 0.5) * 20;
        rr += sh; gg += sh; bb += sh;
        data[j] = rr; data[j + 1] = gg; data[j + 2] = bb; data[j + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    fw = Math.max(96, Math.min(200, Math.round(W / 3)));
    fh = Math.max(52, Math.min(120, Math.round(H / 3)));
    cv.width = fw; cv.height = fh;
    cv.style.width = '100%'; cv.style.height = '100%';
    ctx = cv.getContext('2d', { alpha: false });
    img = ctx.createImageData(fw, fh); data = img.data;
    lastVisit = new Float32Array(fw * fh);
    for (var i = 0; i < lastVisit.length; i++) lastVisit[i] = -9999;
    stepCount = 0;
    buildFoods();
    initAgents();
  }

  function stillFrame() {
    for (var k = 0; k < 300; k++) stepAgents();
    render(2.6);
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    for (var s = 0; s < SUBSTEPS; s++) stepAgents();
    render(t);
    if (nOut) nOut.textContent = String(stepCount);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    fit();
    if (reduce) stillFrame();
  });

  fit();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
