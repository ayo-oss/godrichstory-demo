<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기본 3센서 에이전트 — 스티그머지 — 슬라임몰드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sm is-demo" id="smRoot">
  <p class="sm__hint">
    <span>Each agent samples pheromone at three points ahead — front, left, right — turns toward the strongest, steps forward, and deposits trail; run thousands of them and a vein-like network grows on its own</span>
  </p>
  <div class="sm__field" id="smField" role="application" aria-label="Three-Sensor Slime Agent Demo" tabindex="0">
    <canvas class="sm__cv" id="smCv"></canvas>
  </div>
  <div class="sm__bar">
    <span class="sm__meta"><b class="sm__val" id="smN">0</b><span id="smUnit"> steps · basic 3-sensor</span></span>
    <span class="sm__meta sm__meta--dim">canvas · ImageData · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 기본 3센서 에이전트(01). Physarum(점균) 스티그머지 알고리즘 —
// 에이전트마다 전방·좌·우 세 지점의 페로몬 필드를 읽어(sense) 가장 짙은 쪽으로 돈 뒤(rotate)
// 한 걸음 전진하며 지나간 칸에 트레일을 쌓는다(deposit). 필드는 매 프레임 이웃 평균으로
// 살짝 번지고(diffuse) 일정 비율 옅어진다(evaporate) — 이 네 단계만 반복해도 중앙 한 점에서
// 시작한 무리가 저절로 갈라지고 합쳐지며 혈관 같은 네트워크로 자란다.
//
// 화면이 사는 장치 — 077 캔버스 기준의 "매 프레임 계산":
//  · 캔버스는 절대 clear 하지 않는다. 페로몬 필드 값을 그대로 색으로 매핑해 putImageData 한다.
//  · 값노이즈 기반 주변광 요동이 필드 전체를 매 프레임 은은하게 들썩이게 한다(누적면적 ↑).
//  · 트레일이 짙을수록 밝은 파스텔로, 옅을수록 무대색으로 가라앉는다(순간 강도 ↑).
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var AGENTS = 1300;      // 동시에 걷는 에이전트 수 — 네트워크 밀도
  var DECAY = 0.045;      // 증발률(프레임당) — 변형 "증발 속도"가 이 값을 0.02→0.06으로 바꾼다
  var SENSOR_DIST = 5.2;  // 센서가 앞을 내다보는 Distance(필드 칸)
  // ────────────────────────────────────────────────────
  var SENSOR_ANGLE = 0.5;   // Sensor spread angle(라디안)
  var TURN = 0.5;           // 한 스텝에 도는 각(라디안)
  var STEP = 1.05;          // 한 스텝 이동 Distance(필드 칸)
  var DEPOSIT = 4.4;        // 한 스텝에 쌓는 페로몬 양
  var DIFFUSE = 0.5;        // 확산 시 이웃과 섞이는 비율
  var CAP = 7;              // 페로몬 상한(색 매핑 기준)
  var SUBSTEPS = 3;         // rAF 프레임당 시뮬 스텝 수

  var root = document.getElementById('smRoot');
  var field = document.getElementById('smField');
  var cv = document.getElementById('smCv');
  var ctx = cv.getContext('2d', { alpha: false });
  var nOut = document.getElementById('smN');

  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x320A01);

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK  = tokRGB('--sm-ink');
  var C_GLOW = tokRGB('--sm-glow');
  var C_HOT  = tokRGB('--sm-hot');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, fw = 0, fh = 0, raf = 0, t0 = -1;
  var trail, trailB, img, data;
  var ax, ay, ah;
  var stepCount = 0;

  // ── 값노이즈(주변광 요동용) ──
  var perm = new Uint8Array(512);
  (function () {
    var p = [];
    for (var i = 0; i < 256; i++) p.push(i);
    for (var i2 = 255; i2 > 0; i2--) {
      var k2 = Math.floor(rand() * (i2 + 1));
      var tmp = p[i2]; p[i2] = p[k2]; p[k2] = tmp;
    }
    for (var i3 = 0; i3 < 512; i3++) perm[i3] = p[i3 & 255];
  })();
  function fade(k) { return k * k * (3 - 2 * k); }
  function vnoise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var a2 = perm[(perm[xi & 255] + yi) & 255];
    var b2 = perm[(perm[(xi + 1) & 255] + yi) & 255];
    var c2 = perm[(perm[xi & 255] + yi + 1) & 255];
    var d2 = perm[(perm[(xi + 1) & 255] + yi + 1) & 255];
    var u = fade(xf), v = fade(yf);
    return (a2 + (b2 - a2) * u + (c2 - a2) * v + (a2 - b2 - c2 + d2) * u * v) / 255;
  }

  function idx(x, y) {
    x = x % fw; if (x < 0) x += fw;
    y = y % fh; if (y < 0) y += fh;
    return (y * fw + x) | 0;
  }
  function sample(x, y) { return trail[idx(Math.round(x), Math.round(y))]; }

  function initAgents() {
    ax = new Float32Array(AGENTS); ay = new Float32Array(AGENTS); ah = new Float32Array(AGENTS);
    var cx = fw / 2, cy = fh / 2, r = Math.min(fw, fh) * 0.14;
    for (var i = 0; i < AGENTS; i++) {
      var a = rand() * Math.PI * 2, rr = rand() * r;
      ax[i] = cx + Math.cos(a) * rr;
      ay[i] = cy + Math.sin(a) * rr;
      ah[i] = rand() * Math.PI * 2;
    }
  }

  function stepAgents() {
    for (var i = 0; i < AGENTS; i++) {
      var x = ax[i], y = ay[i], h = ah[i];
      var sf = sample(x + Math.cos(h) * SENSOR_DIST, y + Math.sin(h) * SENSOR_DIST);
      var sl = sample(x + Math.cos(h + SENSOR_ANGLE) * SENSOR_DIST, y + Math.sin(h + SENSOR_ANGLE) * SENSOR_DIST);
      var sr = sample(x + Math.cos(h - SENSOR_ANGLE) * SENSOR_DIST, y + Math.sin(h - SENSOR_ANGLE) * SENSOR_DIST);
      if (sf >= sl && sf >= sr) {
        // 직진 — 가장 짙은 쪽이 정면
      } else if (sl > sr) {
        h += TURN;
      } else if (sr > sl) {
        h -= TURN;
      } else {
        h += (rand() < 0.5 ? 1 : -1) * TURN;
      }
      h += (rand() - 0.5) * 0.14;
      var nx = x + Math.cos(h) * STEP, ny = y + Math.sin(h) * STEP;
      nx = ((nx % fw) + fw) % fw; ny = ((ny % fh) + fh) % fh;
      ax[i] = nx; ay[i] = ny; ah[i] = h;
      var ii = idx(Math.round(nx), Math.round(ny));
      trail[ii] = Math.min(CAP, trail[ii] + DEPOSIT);
    }
    stepCount++;
  }

  function diffuseEvap() {
    for (var y = 0; y < fh; y++) {
      var ym = y === 0 ? fh - 1 : y - 1, yp = y === fh - 1 ? 0 : y + 1;
      var rowY = y * fw, rowYm = ym * fw, rowYp = yp * fw;
      for (var x = 0; x < fw; x++) {
        var xm = x === 0 ? fw - 1 : x - 1, xp = x === fw - 1 ? 0 : x + 1;
        var i = rowY + x;
        var avg = (trail[rowY + xm] + trail[rowY + xp] + trail[rowYm + x] + trail[rowYp + x]) * 0.25;
        trailB[i] = (trail[i] * (1 - DIFFUSE) + avg * DIFFUSE) * (1 - DECAY);
      }
    }
    var t = trail; trail = trailB; trailB = t;
  }

  function render(t) {
    for (var y = 0; y < fh; y++) {
      for (var x = 0; x < fw; x++) {
        var i = y * fw + x;
        var v = trail[i] / CAP; if (v > 1) v = 1;
        var n = vnoise(x * 0.06, y * 0.06 + t * 0.5);
        var amb = 0.5 + 0.5 * Math.sin(t * 1.15 + n * 6.2831);
        var k = v * v * (3 - 2 * v);
        var rr = C_INK[0] + (C_GLOW[0] - C_INK[0]) * k + (C_HOT[0] - C_GLOW[0]) * Math.max(0, v - 0.72) * 3.4;
        var gg = C_INK[1] + (C_GLOW[1] - C_INK[1]) * k + (C_HOT[1] - C_GLOW[1]) * Math.max(0, v - 0.72) * 3.4;
        var bb = C_INK[2] + (C_GLOW[2] - C_INK[2]) * k + (C_HOT[2] - C_GLOW[2]) * Math.max(0, v - 0.72) * 3.4;
        var sh = (amb - 0.5) * 16 * (1 - v * 0.6);
        var j = i * 4;
        data[j] = rr + sh; data[j + 1] = gg + sh; data[j + 2] = bb + sh; data[j + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    fw = Math.max(90, Math.min(200, Math.round(W / 3)));
    fh = Math.max(50, Math.min(130, Math.round(H / 3)));
    cv.width = fw; cv.height = fh;
    cv.style.width = '100%'; cv.style.height = '100%';
    ctx = cv.getContext('2d', { alpha: false });
    img = ctx.createImageData(fw, fh); data = img.data;
    trail = new Float32Array(fw * fh); trailB = new Float32Array(fw * fh);
    stepCount = 0;
    initAgents();
  }

  function stillFrame() {
    for (var k = 0; k < 220; k++) { stepAgents(); diffuseEvap(); }
    render(3.4);
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    for (var s = 0; s < SUBSTEPS; s++) { stepAgents(); diffuseEvap(); }
    render(t);
    if (nOut) nOut.textContent = String(stepCount);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    fit();
    if (reduce) stillFrame();
  });

  fit();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
