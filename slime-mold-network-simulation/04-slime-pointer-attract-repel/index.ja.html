<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포인터 먹이·기피물 — 클릭으로 네트워크 유인 — 슬라임몰드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sm is-demo" id="smRoot">
  <p class="sm__hint">
    <span>クリックした座標を新しい餌として植えると、ネットワークがそちらへ枝を伸ばします。モードを切り替えて塩(忌避物質)を置くと、トレイルはその場所を避けて曲がりながら育ちます</span>
  </p>
  <div class="sm__field" id="smField" role="application" aria-label="ポインター餌・忌避物 粘菌実験版" tabindex="0">
    <canvas class="sm__cv" id="smCv"></canvas>
  </div>
  <div class="sm__bar">
    <button class="sm__toggle" id="smMode" type="button" aria-pressed="false">
      <span id="smModeLabel">クリック = 餌</span>
    </button>
    <span class="sm__meta sm__meta--dim">canvas · pointermove · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 포인터 먹이·기피물(04). Physarum 스티그머지 + 실시간 유인/기피 앵커 —
// 클릭한 좌표를 부호 있는 향(sign: +먹이 / -소금)으로 심고 센싱값에 더한다. 에이전트는
// 먹이 앵커 쪽은 끌리고 소금 앵커 쪽은 밀려난다. .is-demo 동안은 실제 클릭 없이도 화면이
// 살아 있도록 스크립트가 좌표를 골라 자동으로 같은 심기 함수를 호출하고, 사람이 실제로
// 클릭·모드 버튼을 누르면 그 즉시 같은 로직이 반응한다(자동·수동 경로가 완전히 같다).
//
// 화면이 사는 장치 — 077 캔버스 기준의 "매 프레임 계산":
//  · 캔버스는 절대 clear 하지 않는다. 필드 전체를 매 프레임 새로 계산해 얹는다.
//  · 앰비언트 글로우 레이어(두 옥타브 값노이즈)가 전면을 확산 구조로 흔들어 누적면적을 채운다.
//  · 먹이·소금 앵커는 심은 뒤 서서히 옅어지며 사라져(수명) 다음 클릭 자리를 비운다.
(function () {
  // ── 변형 상수 블록 ──
  var AGENTS = 1500;        // 동시에 걷는 에이전트 수
  var DECAY = 0.05;         // 증발률
  var ANCHOR_LIFE = 5.2;    // 앵커(먹이·소금) 수명(초)
  // ────────────────────────────────────
  var SENSOR_ANGLE = 0.5;
  var SENSOR_DIST = 5.0;
  var TURN = 0.5;
  var STEP = 1.05;
  var DEPOSIT = 4.2;
  var DIFFUSE = 0.5;
  var CAP = 7;
  var SUBSTEPS = 3;
  var ANCHOR_W = 2.2;
  var MAX_ANCHORS = 7;

  var root = document.getElementById('smRoot');
  var field = document.getElementById('smField');
  var cv = document.getElementById('smCv');
  var ctx = cv.getContext('2d', { alpha: false });
  var modeBtn = document.getElementById('smMode');
  var modeLabel = document.getElementById('smModeLabel');

  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x320A04);

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_FLOOR = tokRGB('--sm-floor');
  var C_TRAIL = tokRGB('--sm-trail');
  var C_FOOD  = tokRGB('--sm-food');
  var C_SALT  = tokRGB('--sm-salt');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, fw = 0, fh = 0, raf = 0, t0 = -1;
  var trail, trailB, img, data;
  var ax, ay, ah;
  var anchors = [];   // {x,y,sign,born}
  var mode = 1;        // 1=먹이(끌림) · -1=소금(기피)
  var curT = 0;
  var autoIdx = 0;

  // ── 값노이즈(앰비언트 글로우용) ──
  var perm = new Uint8Array(512);
  (function () {
    var p = [];
    for (var i = 0; i < 256; i++) p.push(i);
    for (var i2 = 255; i2 > 0; i2--) {
      var k2 = Math.floor(rand() * (i2 + 1));
      var tmp = p[i2]; p[i2] = p[k2]; p[k2] = tmp;
    }
    for (var i3 = 0; i3 < 512; i3++) perm[i3] = p[i3 & 255];
  })();
  function fade(k) { return k * k * (3 - 2 * k); }
  function vnoise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var a2 = perm[(perm[xi & 255] + yi) & 255];
    var b2 = perm[(perm[(xi + 1) & 255] + yi) & 255];
    var c2 = perm[(perm[xi & 255] + yi + 1) & 255];
    var d2 = perm[(perm[(xi + 1) & 255] + yi + 1) & 255];
    var u = fade(xf), v = fade(yf);
    return (a2 + (b2 - a2) * u + (c2 - a2) * v + (a2 - b2 - c2 + d2) * u * v) / 255;
  }

  function idx(x, y) {
    x = x % fw; if (x < 0) x += fw;
    y = y % fh; if (y < 0) y += fh;
    return (y * fw + x) | 0;
  }
  function clampIdx(x, y) {
    x = Math.max(0, Math.min(fw - 1, Math.round(x)));
    y = Math.max(0, Math.min(fh - 1, Math.round(y)));
    return y * fw + x;
  }

  function placeAnchor(fx, fy, sign) {
    anchors.push({ x: fx, y: fy, sign: sign, born: curT });
    if (anchors.length > MAX_ANCHORS) anchors.shift();
  }

  function anchorField(x, y) {
    var v = 0;
    for (var i = 0; i < anchors.length; i++) {
      var a = anchors[i];
      var age = curT - a.born;
      if (age < 0 || age > ANCHOR_LIFE) continue;
      var life = 1 - age / ANCHOR_LIFE;
      var dx = x - a.x, dy = y - a.y;
      var d2 = dx * dx + dy * dy;
      v += a.sign * life * Math.exp(-d2 / 30);
    }
    return v;
  }

  function sense(x, y) {
    var i = clampIdx(x, y);
    return trail[i] + anchorField(x, y) * ANCHOR_W * CAP;
  }

  function initAgents() {
    ax = new Float32Array(AGENTS); ay = new Float32Array(AGENTS); ah = new Float32Array(AGENTS);
    var cx = fw / 2, cy = fh / 2, r = Math.min(fw, fh) * 0.16;
    for (var i = 0; i < AGENTS; i++) {
      var a = rand() * Math.PI * 2, rr = rand() * r;
      ax[i] = cx + Math.cos(a) * rr;
      ay[i] = cy + Math.sin(a) * rr;
      ah[i] = rand() * Math.PI * 2;
    }
  }

  function stepAgents() {
    for (var i = 0; i < AGENTS; i++) {
      var x = ax[i], y = ay[i], h = ah[i];
      var sf = sense(x + Math.cos(h) * SENSOR_DIST, y + Math.sin(h) * SENSOR_DIST);
      var sl = sense(x + Math.cos(h + SENSOR_ANGLE) * SENSOR_DIST, y + Math.sin(h + SENSOR_ANGLE) * SENSOR_DIST);
      var sr = sense(x + Math.cos(h - SENSOR_ANGLE) * SENSOR_DIST, y + Math.sin(h - SENSOR_ANGLE) * SENSOR_DIST);
      if (sf >= sl && sf >= sr) {
        // 직진
      } else if (sl > sr) {
        h += TURN;
      } else if (sr > sl) {
        h -= TURN;
      } else {
        h += (rand() < 0.5 ? 1 : -1) * TURN;
      }
      h += (rand() - 0.5) * 0.14;
      var nx = x + Math.cos(h) * STEP, ny = y + Math.sin(h) * STEP;
      nx = ((nx % fw) + fw) % fw; ny = ((ny % fh) + fh) % fh;
      ax[i] = nx; ay[i] = ny; ah[i] = h;
      var ii = idx(Math.round(nx), Math.round(ny));
      trail[ii] = Math.min(CAP, trail[ii] + DEPOSIT);
    }
  }

  function diffuseEvap() {
    for (var y = 0; y < fh; y++) {
      var ym = y === 0 ? fh - 1 : y - 1, yp = y === fh - 1 ? 0 : y + 1;
      var rowY = y * fw, rowYm = ym * fw, rowYp = yp * fw;
      for (var x = 0; x < fw; x++) {
        var xm = x === 0 ? fw - 1 : x - 1, xp = x === fw - 1 ? 0 : x + 1;
        var i = rowY + x;
        var avg = (trail[rowY + xm] + trail[rowY + xp] + trail[rowYm + x] + trail[rowYp + x]) * 0.25;
        trailB[i] = (trail[i] * (1 - DIFFUSE) + avg * DIFFUSE) * (1 - DECAY);
      }
    }
    var t = trail; trail = trailB; trailB = t;
  }

  function render(t) {
    for (var y = 0; y < fh; y++) {
      for (var x = 0; x < fw; x++) {
        var i = y * fw + x;
        var j = i * 4;
        var v = trail[i] / CAP; if (v > 1) v = 1;
        var k = v * v * (3 - 2 * v);
        var rr = C_FLOOR[0] + (C_TRAIL[0] - C_FLOOR[0]) * k;
        var gg = C_FLOOR[1] + (C_TRAIL[1] - C_FLOOR[1]) * k;
        var bb = C_FLOOR[2] + (C_TRAIL[2] - C_FLOOR[2]) * k;
        for (var ai = 0; ai < anchors.length; ai++) {
          var a = anchors[ai];
          var age = t - a.born;
          if (age < 0 || age > ANCHOR_LIFE) continue;
          var life = 1 - age / ANCHOR_LIFE;
          var dx = x - a.x, dy = y - a.y;
          var d2 = dx * dx + dy * dy;
          var pulse = 0.6 + 0.4 * Math.sin(t * 3.1 + ai);
          var glow = Math.exp(-d2 / 22) * life * pulse;
          var col = a.sign > 0 ? C_FOOD : C_SALT;
          rr += (col[0] - rr) * glow; gg += (col[1] - gg) * glow; bb += (col[2] - bb) * glow;
        }
        var n1 = vnoise(x * 0.09, y * 0.09 + t * 0.9);
        var n2 = vnoise(x * 0.03 + 40, y * 0.03 + t * 0.6);
        var sh = (n1 - 0.5) * 26 + (n2 - 0.5) * 16;
        rr += sh; gg += sh; bb += sh;
        data[j] = rr; data[j + 1] = gg; data[j + 2] = bb; data[j + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    fw = Math.max(96, Math.min(200, Math.round(W / 3)));
    fh = Math.max(52, Math.min(120, Math.round(H / 3)));
    cv.width = fw; cv.height = fh;
    cv.style.width = '100%'; cv.style.height = '100%';
    ctx = cv.getContext('2d', { alpha: false });
    img = ctx.createImageData(fw, fh); data = img.data;
    trail = new Float32Array(fw * fh); trailB = new Float32Array(fw * fh);
    anchors = []; curT = 0; autoIdx = 0;
    initAgents();
  }

  function stillFrame() {
    curT = 0.4; placeAnchor(fw * 0.28, fh * 0.5, 1);
    curT = 1.1; placeAnchor(fw * 0.74, fh * 0.32, 1);
    curT = 1.7; placeAnchor(fw * 0.5, fh * 0.78, -1);
    curT = 2.4;
    for (var k = 0; k < 240; k++) { stepAgents(); diffuseEvap(); curT += 0.02; }
    render(curT);
  }

  // .is-demo 자동 시연 각본 — 사람이 안 눌러도 동일 placeAnchor() 로 화면이 산다.
  var script = [
    { t: 0.3, x: 0.26, y: 0.5, sign: 1 },
    { t: 1.1, x: 0.7, y: 0.28, sign: 1 },
    { t: 1.9, x: 0.5, y: 0.78, sign: -1 },
    { t: 2.7, x: 0.78, y: 0.7, sign: 1 },
    { t: 3.6, x: 0.22, y: 0.24, sign: -1 }
  ];

  function frame(now) {
    if (t0 < 0) t0 = now;
    curT = (now - t0) / 1000;
    if (root.classList.contains('is-demo')) {
      while (autoIdx < script.length && curT >= script[autoIdx].t) {
        var s = script[autoIdx];
        placeAnchor(fw * s.x, fh * s.y, s.sign);
        autoIdx++;
      }
      if (autoIdx >= script.length && curT > script[script.length - 1].t + ANCHOR_LIFE) autoIdx = 0, t0 = now;
    }
    for (var i = 0; i < SUBSTEPS; i++) { stepAgents(); diffuseEvap(); }
    render(curT);
    raf = requestAnimationFrame(frame);
  }

  function setMode(next) {
    mode = next;
    modeBtn.setAttribute('aria-pressed', mode < 0 ? 'true' : 'false');
    if (modeLabel) modeLabel.textContent = mode > 0 ? 'クリック = 餌' : 'クリック = 塩';
  }

  field.addEventListener('pointerdown', function (e) {
    var rect = field.getBoundingClientRect();
    var fx = (e.clientX - rect.left) / rect.width * fw;
    var fy = (e.clientY - rect.top) / rect.height * fh;
    placeAnchor(fx, fy, mode);
  });
  modeBtn.addEventListener('click', function () { setMode(-mode); });

  window.addEventListener('resize', function () {
    fit();
    if (reduce) stillFrame();
  });

  fit();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
