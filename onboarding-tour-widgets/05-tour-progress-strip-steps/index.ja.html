<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">

<title>Progress strip — demo</title>
<link rel="stylesheet" href="style.css">

<body>
<main class="stage is-demo">
  <div class="wrap">
    <div class="head">
      <span class="h">アカウント設定</span>
      <span class="p">5ステップ</span>
    </div>
    <div class="strip" aria-label="設定の進捗ステップ">
      <span class="seg s1"><i class="fill"></i><i class="flash"></i></span>
      <span class="seg s2"><i class="fill"></i><i class="flash"></i></span>
      <span class="seg s3"><i class="fill"></i><i class="flash"></i></span>
      <span class="seg s4"><i class="fill"></i><i class="flash"></i></span>
      <span class="seg s5"><i class="fill"></i><i class="flash"></i></span>
    </div>
    <p class="cap">あと少しです</p>
  </div>
</main>
