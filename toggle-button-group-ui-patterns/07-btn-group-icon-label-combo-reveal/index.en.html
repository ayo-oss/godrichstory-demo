<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon label combo reveal — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="clr is-demo" id="clr" role="group" aria-label="Quick actions"></div>
<script>
(function () {
  var ITEMS = [
    { icon: '＋', label: 'New' },
    { icon: '⎘', label: 'Duplicate' },
    { icon: '↧', label: 'Export' },
    { icon: '⌘', label: 'Shortcuts' }
  ];
  var CYCLE_MS = 900; // 데모 자동 순회 간격 — 측정 창(2s) 안에 전환이 여러 번 들어오게 짧게 잡음
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('clr');
  var isDemo = true;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  var cells = ITEMS.map(function (item) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'clr__btn';

    var icon = document.createElement('span');
    icon.className = 'clr__icon';
    icon.textContent = item.icon;
    icon.setAttribute('aria-hidden', 'true');

    var reveal = document.createElement('span');
    reveal.className = 'clr__reveal';
    var label = document.createElement('span');
    label.className = 'clr__label';
    label.textContent = item.label;
    reveal.appendChild(label);

    btn.appendChild(icon);
    btn.appendChild(reveal);
    root.appendChild(btn);

    return { btn: btn, reveal: reveal, label: label, progress: 0, target: 0, raf: 0, fullW: 0 };
  });

  // 계산 겹: 각 라벨의 실측 텍스트 폭(fullW)을 한 번 재고, reveal 트랙 폭을 그 값에 고정한 뒤
  // clip-path 를 0→fullW 사이에서 이징으로 보간해 "덮개를 걷어내는" 진행률로 그린다 — width 자체는
  // 다시 애니메이션하지 않는다(레이아웃 트리거는 최초 1회 뿐).
  cells.forEach(function (cell) {
    cell.fullW = cell.label.getBoundingClientRect().width;
    cell.reveal.style.width = cell.fullW + 'px';
  });

  function render(cell) {
    var pct = (1 - cell.progress) * 100;
    cell.reveal.style.clipPath = 'inset(0 ' + pct.toFixed(2) + '% 0 0)';
    cell.label.style.opacity = String(cell.progress);
  }

  function animate(cell, to) {
    cell.target = to;
    var from = cell.progress;
    if (reduce) { cell.progress = to; render(cell); return; }
    if (cell.raf) cancelAnimationFrame(cell.raf);
    var dur = 400, t0 = 0;
    function step(ts) {
      if (!t0) t0 = ts;
      var t = Math.min(1, (ts - t0) / dur);
      cell.progress = from + (to - from) * easeOutCubic(t);
      render(cell);
      if (t < 1) cell.raf = requestAnimationFrame(step);
      else cell.raf = 0;
    }
    cell.raf = requestAnimationFrame(step);
  }

  cells.forEach(function (cell) {
    render(cell);
    cell.btn.addEventListener('pointerenter', function () { human(); animate(cell, 1); });
    cell.btn.addEventListener('pointerleave', function () { if (!isDemo) animate(cell, 0); });
    cell.btn.addEventListener('focus', function () { human(); animate(cell, 1); });
    cell.btn.addEventListener('blur', function () { if (!isDemo) animate(cell, 0); });
  });

  var active = -1;
  var start = 0;
  function loop(ts) {
    if (!start) start = ts;
    if (isDemo && !reduce) {
      var idx = Math.floor((ts - start) / CYCLE_MS) % cells.length;
      if (idx !== active) {
        if (active >= 0) animate(cells[active], 0);
        active = idx;
        animate(cells[active], 1);
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
