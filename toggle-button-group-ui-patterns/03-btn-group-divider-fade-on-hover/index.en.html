<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divider fade on hover — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dfh is-demo" id="dfh" role="group" aria-label="View switch">
  <button class="dfh__btn">Grid</button>
  <span class="dfh__seam" id="seam0" aria-hidden="true"></span>
  <button class="dfh__btn">List</button>
  <span class="dfh__seam" id="seam1" aria-hidden="true"></span>
  <button class="dfh__btn">Cards</button>
</div>
<script>
(function () {
  var FALLOFF_PX = 46; // 계산 겹 상수: 포인터 거리 값이 이 px 안이면 구분선 투명도가 낮아지기 시작한다
  var SMOOTH = 0.22; // 계산 겹 상수: 지수 완화(lerp) 비율 — 값이 순간이동하지 않고 따라간다
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('dfh');
  var seams = [document.getElementById('seam0'), document.getElementById('seam1')];
  var isDemo = true;
  var pointerX = null;
  var opac = [1, 1]; // 계산 겹: 각 구분선의 현재 렌더 투명도(완화된 값)

  function seamCenters() {
    var rootRect = root.getBoundingClientRect();
    return seams.map(function (s) {
      var r = s.getBoundingClientRect();
      return r.left + r.width / 2 - rootRect.left;
    });
  }

  // 계산 겹: 포인터 거리 값 → 투명도 목표값(0~1)을 매끄러운 falloff 곡선으로 계산
  function targetOpacity(dist) {
    var t = Math.min(1, Math.max(0, dist / FALLOFF_PX));
    return t * t * (3 - 2 * t); // smoothstep — 선형보다 자연스러운 감쇠
  }

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  root.addEventListener('pointermove', function (e) {
    human();
    pointerX = e.clientX - root.getBoundingClientRect().left;
  });
  root.addEventListener('pointerleave', function () { pointerX = null; });

  var demoStart = 0;
  function demoPointerX(ts, width) {
    var t = (ts - demoStart) / 1000;
    return width / 2 + Math.sin(t * 1.1) * (width / 2 - 10); // 좌우로 오가는 시뮬레이션 좌표
  }

  function loop(ts) {
    if (!demoStart) demoStart = ts;
    var rect = root.getBoundingClientRect();
    var px = isDemo && !reduce ? demoPointerX(ts, rect.width) : pointerX;
    var centers = seamCenters();

    for (var i = 0; i < seams.length; i++) {
      var target = px == null ? 1 : targetOpacity(Math.abs(px - centers[i]));
      opac[i] += (target - opac[i]) * (reduce ? 1 : SMOOTH);
      seams[i].style.opacity = opac[i].toFixed(3);
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
