<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가로 세로 방향 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vhm" id="vhm">
  <div class="vhm__group" id="vhmGroup" role="group" aria-label="편집 도구"></div>
  <button class="vhm__toggle" id="vhmToggle" type="button" aria-pressed="false">방향 전환 ⤢</button>
</div>
<script>
(function () {
  var LABELS = ['굵게', '기울임', '밑줄', '정렬'];
  var CYCLE_MS = 700; // 데모 자동 전환 주기 — 측정 창(2s) 안에 전환이 여러 번 들어오게 짧게 잡음
  var FLIP_MS = 480;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('vhm');
  var group = document.getElementById('vhmGroup');
  var toggle = document.getElementById('vhmToggle');
  var isDemo = true;
  var vertical = false;

  var btns = LABELS.map(function (label) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'vhm__btn';
    b.textContent = label;
    group.appendChild(b);
    return b;
  });

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  // 계산 겹: FLIP — 전환 전(First) 각 버튼의 실측 좌표를 재고, 전환 후(Last) 좌표와의 차이(Invert)를
  // transform 으로 순간 상쇄한 뒤, 다음 프레임에 transform 을 0 으로 되돌려(Play) 자연스럽게 이어붙인다.
  function flip(apply) {
    var first = btns.map(function (b) { return b.getBoundingClientRect(); });
    apply();
    var last = btns.map(function (b) { return b.getBoundingClientRect(); });

    if (reduce) return; // 계산은 유지하되 즉시 반영, 애니메이션 생략

    btns.forEach(function (b, i) {
      var dx = first[i].left - last[i].left;
      var dy = first[i].top - last[i].top;
      if (!dx && !dy) return;
      b.style.transition = 'none';
      b.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      // 강제 리플로우로 초기 transform 을 화면에 반영시킨 뒤에만 되돌리기 transition 이 재생된다.
      b.getBoundingClientRect();
      requestAnimationFrame(function () {
        b.style.transition = 'transform ' + FLIP_MS + 'ms cubic-bezier(.22,.9,.32,1)';
        b.style.transform = 'translate(0,0)';
      });
    });
  }

  function setOrientation(v) {
    flip(function () {
      vertical = v;
      root.classList.toggle('vhm--vertical', vertical);
      toggle.setAttribute('aria-pressed', String(vertical));
    });
  }

  toggle.addEventListener('click', function () {
    human();
    setOrientation(!vertical);
  });

  var start = 0;
  function loop(ts) {
    if (!start) start = ts;
    if (isDemo && !reduce) {
      var phaseVertical = (ts - start) % (CYCLE_MS * 2) >= CYCLE_MS;
      if (phaseVertical !== vertical) setOrientation(phaseVertical);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
