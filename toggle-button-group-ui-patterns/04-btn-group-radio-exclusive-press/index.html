<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배타적 눌림 상태 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rep is-demo" id="rep" role="radiogroup" aria-label="보기 방식">
  <button class="rep__btn" role="radio" aria-checked="true" tabindex="0" data-i="0">목록형</button>
  <button class="rep__btn" role="radio" aria-checked="false" tabindex="-1" data-i="1">격자형</button>
  <button class="rep__btn" role="radio" aria-checked="false" tabindex="-1" data-i="2">보드형</button>
</div>
<script>
(function () {
  var CYCLE_MS = 950; // 자동 루프가 다음 버튼을 누르는 간격
  var STIFF = 320; // 계산 겹 상수: 눌림 깊이 스프링 강성
  var DAMP = 14; // 계산 겹 상수: 감쇠 — 작을수록 눌린 뒤 살짝 되튀는 오버슛이 남는다
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('rep');
  var btns = Array.prototype.slice.call(root.querySelectorAll('.rep__btn'));
  var isDemo = true;
  var checkedIdx = 0;

  // 계산 겹: 버튼마다 눌림 깊이(depth 0~1)를 감쇠 스프링으로 적분한다 — 켜지는 버튼은
  // depth 1을 살짝 넘겼다가(오버슛) 정착하고, 나머지는 동시에 0으로 되돌아간다.
  var depth = btns.map(function () { return 0; });
  var vel = btns.map(function () { return 0; });
  var target = btns.map(function (b, i) { return i === 0 ? 1 : 0; });

  function setChecked(idx) {
    checkedIdx = idx;
    btns.forEach(function (b, i) {
      var on = i === idx;
      b.setAttribute('aria-checked', String(on));
      b.setAttribute('tabindex', on ? '0' : '-1');
      target[i] = on ? 1 : 0;
      if (reduce) { depth[i] = target[i]; vel[i] = 0; }
    });
  }

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  btns.forEach(function (b, i) {
    b.addEventListener('click', function () { human(); setChecked(i); b.focus({ preventScroll: true }); });
  });

  root.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    human();
    var dir = e.key === 'ArrowRight' ? 1 : -1;
    var next = (checkedIdx + dir + btns.length) % btns.length;
    setChecked(next);
    btns[next].focus({ preventScroll: true });
    e.preventDefault();
  });

  function render(i) {
    var d = depth[i];
    var overshootLift = Math.max(0, -(d - 1)) * -2; // 오버슛 구간(d>1)에서 살짝 더 눌리는 표현
    var y = d * 3 + (d > 1 ? (d - 1) * 4 : 0);
    var blur = 14 - d * 8;
    var offY = 8 - d * 6;
    btns[i].style.transform = 'translateY(' + y.toFixed(2) + 'px)';
    btns[i].style.boxShadow = '0 ' + Math.max(1, offY).toFixed(1) + 'px ' + Math.max(4, blur).toFixed(1) + 'px rgba(23,20,26,.34)';
    btns[i].classList.toggle('rep__btn--on', d > 0.5);
  }

  var cycleStart = 0, lastIdx = -1;
  function loop(ts) {
    if (!cycleStart) cycleStart = ts;
    if (isDemo && !reduce) {
      var idx = Math.floor((ts - cycleStart) / CYCLE_MS) % btns.length;
      if (idx !== lastIdx) { lastIdx = idx; setChecked(idx); }
    }

    for (var i = 0; i < btns.length; i++) {
      var acc = STIFF * (target[i] - depth[i]) - DAMP * vel[i];
      vel[i] += acc * (1 / 60);
      depth[i] += vel[i] * (1 / 60);
      render(i);
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
