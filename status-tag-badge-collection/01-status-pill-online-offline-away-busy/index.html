<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">

<title>Status pill indicator — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <ul class="pills" aria-label="상태 목록">
    <li class="pill pill--online"><span class="dot" aria-hidden="true"></span>Online</li>
    <li class="pill pill--away"><span class="dot" aria-hidden="true"></span>Away</li>
    <li class="pill pill--busy"><span class="dot" aria-hidden="true"></span>Busy</li>
    <li class="pill pill--offline"><span class="dot" aria-hidden="true"></span>Offline</li>
  </ul>
</main>
