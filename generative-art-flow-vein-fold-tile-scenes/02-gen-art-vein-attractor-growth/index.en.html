<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaf Veins Reaching Toward Scattered Attractor Points — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pc is-demo" id="pc">
  <canvas class="pc__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="Veins reach toward attractor points scattered inside a leaf, and branches split as reached attractors are removed. Press Enter for a new seed, R to regrow the same seed from the start, and Space to pause."></canvas>
  <p class="pc__status" data-role="status" aria-live="off">Veins reaching for attractors</p>
  <div class="pc__tools">
    <button class="pc__btn" data-role="redraw" type="button">Redraw</button>
    <button class="pc__btn" data-role="replay" type="button">Same seed</button>
    <button class="pc__btn" data-role="pause" type="button" aria-pressed="false">Pause</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("pc");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    const TAU = Math.PI * 2;
    const DEG = Math.PI / 180;
    // 파스텔 팔레트 — 어두운 무대(INK) 위에 밝은 Lines·면을 얹어 명도 차로 형태가 읽힌다
    const INK = [29, 26, 44];
    const PAPER = [255, 248, 234];
    const PAL = [
        [124, 196, 255],
        [255, 160, 190],
        [126, 226, 192],
        [190, 164, 255],
        [255, 208, 168],
        [246, 228, 140],
        [150, 222, 236],
        [232, 182, 228],
        [196, 220, 160],
    ];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    // 시드 고정 난수 — 같은 씨앗이면 같은 수열, 곧 같은 그림이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seedValue) {
        let s = seedValue >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 다음 Seed — 다시 그리기를 누를 때마다 정수 하나만 바뀐다(10007~99995 사이 다섯 자리)
    function nextSeed(s) { return ((s * 7919 + 104729) % 89989) + 10007; }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    // 그림판 — 자란 결과를 쌓아 두는 화면 밖 캔버스. 프레임마다 이걸 옮겨 그리고 그 위에 지금 자라는 부분만 얹는다
    const artEl = document.createElement('canvas');
    const actxRaw = artEl.getContext('2d');
    if (!canvasEl || !ctxRaw || !statusEl || !actxRaw) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    const actx = actxRaw;
    const redrawBtn = root.querySelector('[data-role="redraw"]');
    const replayBtn = root.querySelector('[data-role="replay"]');
    const pauseBtn = root.querySelector('[data-role="pause"]');
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 tail 의 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    // 지금 그림의 씨앗과, 그 씨앗을 심은 뒤 흐른 성장 시간(ms, Pause 동안은 멈춘다)
    let seed = 0;
    let age = 0;
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    let dprNow = 0;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        if (dpr === dprNow) {
            return;
        }
        // 캔버스 크기를 바꾸면 내용이 지워진다 — 그려 둔 그림판을 잠깐 옮겨 두었다가 새 배율로 다시 담는다
        const keep = document.createElement('canvas');
        keep.width = artEl.width;
        keep.height = artEl.height;
        const kctx = keep.getContext('2d');
        if (kctx && dprNow) {
            kctx.drawImage(artEl, 0, 0);
        }
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        artEl.width = cv.width;
        artEl.height = cv.height;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        actx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (kctx && dprNow) {
            actx.drawImage(keep, 0, 0, W, H);
        }
        dprNow = dpr;
    }
    function clearArt(c) {
        actx.fillStyle = rgba(c, 1);
        actx.fillRect(0, 0, W, H);
    }
    function blitArt() { ctx.drawImage(artEl, 0, 0, W, H); }
    // 오른쪽 아래 수치 상자 — 씨앗과 항목별 개수를 이름표 + 값 한 줄씩
    function drawStats(pairs) {
        ctx.font = '600 11px sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'alphabetic';
        const lines = [];
        let wide = 0;
        for (let i = 0; i < pairs.length; i += 1) {
            const t = pairs[i][0] + ' ' + pairs[i][1];
            lines.push(t);
            wide = Math.max(wide, ctx.measureText(t).width);
        }
        const lh = 15;
        const bw = wide + 16;
        const bh = lines.length * lh + 8;
        ctx.fillStyle = rgba(INK, 0.66);
        ctx.fillRect(W - 10 - bw, H - 10 - bh, bw, bh);
        ctx.fillStyle = rgba(PAPER, 0.95);
        for (let i = 0; i < lines.length; i += 1) {
            ctx.fillText(lines[i], W - 18, H - 10 - bh + 4 + lh * (i + 1) - 3);
        }
    }
    function makeBuckets(cell) {
        const cols = Math.ceil(W / cell) + 1;
        const rows = Math.ceil(H / cell) + 1;
        const b = [];
        for (let i = 0; i < cols * rows; i += 1) {
            b.push([]);
        }
        return { cell: cell, cols: cols, rows: rows, b: b };
    }
    function bucketAdd(g, x, y, id) {
        const c = clamp(Math.floor(x / g.cell), 0, g.cols - 1);
        const r = clamp(Math.floor(y / g.cell), 0, g.rows - 1);
        g.b[r * g.cols + c].push(id);
    }
    function bucketsClear(g) {
        for (let i = 0; i < g.b.length; i += 1) {
            g.b[i].length = 0;
        }
    }
    // (x, y) 에서 반경 rad 를 덮는 칸들의 번호를 visit 에 넘긴다 — visit 이 true 를 돌려주면 그 자리에서 멈추고 true
    function bucketNear(g, x, y, rad, visit) {
        const c0 = clamp(Math.floor((x - rad) / g.cell), 0, g.cols - 1);
        const c1 = clamp(Math.floor((x + rad) / g.cell), 0, g.cols - 1);
        const r0 = clamp(Math.floor((y - rad) / g.cell), 0, g.rows - 1);
        const r1 = clamp(Math.floor((y + rad) / g.cell), 0, g.rows - 1);
        for (let r = r0; r <= r1; r += 1) {
            for (let c = c0; c <= c1; c += 1) {
                const list = g.b[r * g.cols + c];
                for (let k = 0; k < list.length; k += 1) {
                    if (visit(list[k])) {
                        return true;
                    }
                }
            }
        }
        return false;
    }
    function makeVein(rng, o) {
        const ax = [];
        const ay = [];
        // 거절 표본 — 상자 안에서 뽑아 모양(inside) 밖이면 버린다
        let tries = 0;
        while (ax.length < o.count && tries < o.count * 40) {
            tries += 1;
            const x = lerp(o.x0, o.x1, rng());
            const y = lerp(o.y0, o.y1, rng());
            if (o.inside(x, y)) {
                ax.push(x);
                ay.push(y);
            }
        }
        const agrid = makeBuckets(o.influence);
        for (let i = 0; i < ax.length; i += 1) {
            bucketAdd(agrid, ax[i], ay[i], i);
        }
        const alive = new Uint8Array(ax.length);
        alive.fill(1);
        const v = {
            o: o, rng: rng, ax: ax, ay: ay, alive: alive, left: ax.length,
            nx: [], ny: [], par: [], desc: [], grid: makeBuckets(o.influence), agrid: agrid, iter: 0, reached: false, stall: 0, done: false,
        };
        veinAdd(v, o.rootX, o.rootY, -1);
        veinKill(v, 0);
        return v;
    }
    // Nodes 하나를 더하고, 뿌리까지 거슬러 올라가며 조상마다 후손 수를 하나씩 늘린다(굵기의 재료)
    function veinAdd(v, x, y, parent) {
        const id = v.nx.length;
        v.nx.push(x);
        v.ny.push(y);
        v.par.push(parent);
        v.desc.push(0);
        bucketAdd(v.grid, x, y, id);
        let p = parent;
        while (p >= 0) {
            v.desc[p] += 1;
            p = v.par[p];
        }
    }
    // from 번 마디부터 새로 난 마디들 Perimeter kill 안의 끌개를 지운다
    function veinKill(v, from) {
        const k2 = v.o.kill * v.o.kill;
        for (let i = from; i < v.nx.length; i += 1) {
            const x = v.nx[i];
            const y = v.ny[i];
            bucketNear(v.agrid, x, y, v.o.kill, function (a) {
                if (v.alive[a]) {
                    const dx = v.ax[a] - x;
                    const dy = v.ay[a] - y;
                    if (dx * dx + dy * dy < k2) {
                        v.alive[a] = 0;
                        v.left -= 1;
                    }
                }
                return false;
            });
        }
    }
    const VEIN_STALL_LIMIT = 40;
    function veinStep(v) {
        if (v.done) {
            return true;
        }
        v.iter += 1;
        const n = v.nx.length;
        const sx = new Float64Array(n);
        const sy = new Float64Array(n);
        const cnt = new Uint16Array(n);
        const r2 = v.o.influence * v.o.influence;
        let any = false;
        // 끌개마다 반경 안에서 가장 가까운 Nodes 하나 — 그 Nodes 쪽으로 단위 방향을 더해 준다
        for (let a = 0; a < v.ax.length; a += 1) {
            if (!v.alive[a]) {
                continue;
            }
            const x = v.ax[a];
            const y = v.ay[a];
            let best = -1;
            let bd = r2;
            bucketNear(v.grid, x, y, v.o.influence, function (id) {
                const dx = x - v.nx[id];
                const dy = y - v.ny[id];
                const d2 = dx * dx + dy * dy;
                if (d2 < bd) {
                    bd = d2;
                    best = id;
                }
                return false;
            });
            if (best >= 0) {
                const d = Math.sqrt(bd) || 1;
                sx[best] += (x - v.nx[best]) / d;
                sy[best] += (y - v.ny[best]) / d;
                cnt[best] += 1;
                any = true;
            }
        }
        if (any) {
            v.reached = true;
        }
        if (!any) {
            // 아직 어느 끌개도 닿은 적이 없으면 마지막 마디를 끌개 무리의 가운데 쪽으로 곧게 민다(줄기).
            // 한 번 닿은 뒤로 끌개가 반경 밖에만 남으면 더 자라지 않는다 — 외딴 끌개 사이에서 줄기가 맴돌지 않게
            if (v.left > 0 && !v.reached) {
                let mx = 0;
                let my = 0;
                for (let a = 0; a < v.ax.length; a += 1) {
                    if (v.alive[a]) {
                        mx += v.ax[a];
                        my += v.ay[a];
                    }
                }
                mx /= v.left;
                my /= v.left;
                const last = n - 1;
                const dx = mx - v.nx[last];
                const dy = my - v.ny[last];
                const L = Math.hypot(dx, dy) || 1;
                veinAdd(v, v.nx[last] + (dx / L) * v.o.seg, v.ny[last] + (dy / L) * v.o.seg, last);
            }
        }
        else {
            for (let i = 0; i < n; i += 1) {
                if (!cnt[i]) {
                    continue;
                }
                let dx = sx[i];
                let dy = sy[i];
                let L = Math.hypot(dx, dy);
                // 끌개들이 서로 반대쪽에서 맞당겨 평균이 거의 0 이면 그 마디는 이번에 자라지 않는다
                if (L < 0.2) {
                    continue;
                }
                // 아주 작은 흔들림 — 같은 자리에 마디가 겹쳐 쌓이지 않게 대칭을 깬다
                dx = dx / L + (v.rng() - 0.5) * 0.12;
                dy = dy / L + (v.rng() - 0.5) * 0.12;
                L = Math.hypot(dx, dy) || 1;
                veinAdd(v, v.nx[i] + (dx / L) * v.o.seg, v.ny[i] + (dy / L) * v.o.seg, i);
            }
        }
        const leftBefore = v.left;
        veinKill(v, n);
        // 지워지는 끌개 없이 VEIN_STALL_LIMIT 번 연달아 자라기만 하면 멈춘다 — 닿지 못할 끌개를 쫓아 맴돌지 않게
        v.stall = v.left === leftBefore ? v.stall + 1 : 0;
        if (v.stall >= VEIN_STALL_LIMIT || v.nx.length === n || v.left === 0 || v.nx.length >= v.o.maxNodes || v.iter >= v.o.maxIter) {
            v.done = true;
        }
        return v.done;
    }
    // 굵기 = base + √(후손 수 + 1) × k (cap 에서 자름). 같은 굵기 칸끼리 묶어 한 번에 긋는다
    const VEIN_WIDTH_BINS = 16;
    function veinDraw(v, c, col, alpha, base, k, cap) {
        const n = v.nx.length;
        const bin = new Uint8Array(n);
        for (let i = 1; i < n; i += 1) {
            const w = Math.min(cap, base + Math.sqrt(v.desc[i] + 1) * k);
            bin[i] = Math.round((w / cap) * (VEIN_WIDTH_BINS - 1));
        }
        c.lineCap = 'round';
        c.strokeStyle = rgba(col, alpha);
        for (let b = 0; b < VEIN_WIDTH_BINS; b += 1) {
            c.beginPath();
            let any = false;
            for (let i = 1; i < n; i += 1) {
                if (bin[i] !== b || v.par[i] < 0) {
                    continue;
                }
                const p = v.par[i];
                c.moveTo(v.nx[p], v.ny[p]);
                c.lineTo(v.nx[i], v.ny[i]);
                any = true;
            }
            if (any) {
                c.lineWidth = Math.max(0.4, ((b + 0.5) / VEIN_WIDTH_BINS) * cap);
                c.stroke();
            }
        }
    }
    // 아직 남은 끌개를 작은 점으로 — 잎맥이 지나간 자리부터 비어 간다
    function veinDots(v, c, col, alpha) {
        c.fillStyle = rgba(col, alpha);
        c.beginPath();
        for (let a = 0; a < v.ax.length; a += 1) {
            if (v.alive[a]) {
                c.rect(v.ax[a] - 0.8, v.ay[a] - 0.8, 1.6, 1.6);
            }
        }
        c.fill();
    }
    // 잎 안에 뿌리는 끌개 점 수
    const ATTRACTOR_COUNT = 900;
    // 끌개가 마디를 끌어당기는 반경(px) — 이 안의 Nodes 중 가장 가까운 하나만 끈다
    const INFLUENCE_RADIUS = 60;
    // 마디가 이만큼 다가오면 그 끌개는 지운다(px)
    const KILL_DISTANCE = 6;
    // 새 Nodes 하나의 Length(px)
    const SEGMENT_LENGTH = 2.6;
    // 잎 모양 — 가운데·반 Length·가장 넓은 반폭(px)·기울기
    const LEAF_CX = 292;
    const LEAF_CY = 152;
    const LEAF_HALF_LEN = 128;
    const LEAF_HALF_W = 64;
    const LEAF_TILT = -28 * DEG;
    // 한 틱에 도는 성장 횟수와 Nodes 수·횟수 상한 — 프레임당 계산량 상한
    const ITER_PER_FRAME = 1;
    const MAX_NODES = 4000;
    const MAX_ITER = 400;
    const SEED0 = 47102;
    const TXT_RUN = 'Veins reaching for attractors';
    // 잎 좌표 — u 는 잎자루에서 잎끝 방향, v 는 그 옆 방향
    function leafLocal(x, y) {
        const dx = x - LEAF_CX;
        const dy = y - LEAF_CY;
        const c = Math.cos(-LEAF_TILT);
        const s = Math.sin(-LEAF_TILT);
        return [dx * c - dy * s, dx * s + dy * c];
    }
    function leafWorld(u, v) {
        const c = Math.cos(LEAF_TILT);
        const s = Math.sin(LEAF_TILT);
        return [LEAF_CX + u * c - v * s, LEAF_CY + u * s + v * c];
    }
    // 반폭 — 잎자루 쪽(t = −1)은 둥글게, 잎끝(t = 1)은 뾰족하게 닫히도록 두 지수를 다르게 둔다
    function leafHalf(t) { return LEAF_HALF_W * Math.pow(1 - t, 0.8) * Math.pow(1 + t, 0.62); }
    function insideLeaf(x, y) {
        const p = leafLocal(x, y);
        const t = p[0] / LEAF_HALF_LEN;
        if (t <= -1 || t >= 1) {
            return false;
        }
        return Math.abs(p[1]) < leafHalf(t);
    }
    const ROOT = leafWorld(-LEAF_HALF_LEN - 14, 0);
    function newVein(s) {
        return makeVein(makeRng(s), {
            count: ATTRACTOR_COUNT, influence: INFLUENCE_RADIUS, kill: KILL_DISTANCE, seg: SEGMENT_LENGTH,
            rootX: ROOT[0], rootY: ROOT[1], maxNodes: MAX_NODES, maxIter: MAX_ITER,
            x0: LEAF_CX - 150, y0: LEAF_CY - 150, x1: LEAF_CX + 150, y1: LEAF_CY + 150, inside: insideLeaf,
        });
    }
    let vein = newVein(SEED0);
    function leafPath(c) {
        c.beginPath();
        const n = 60;
        for (let i = 0; i <= n; i += 1) {
            const t = -1 + (2 * i) / n;
            const p = leafWorld(t * LEAF_HALF_LEN, leafHalf(t));
            if (i === 0) {
                c.moveTo(p[0], p[1]);
            }
            else {
                c.lineTo(p[0], p[1]);
            }
        }
        for (let i = n; i >= 0; i -= 1) {
            const t = -1 + (2 * i) / n;
            const p = leafWorld(t * LEAF_HALF_LEN, -leafHalf(t));
            c.lineTo(p[0], p[1]);
        }
        c.closePath();
    }
    function plant(s) {
        clearArt(INK);
        leafPath(actx);
        actx.fillStyle = rgba(mix(PAL[2], INK, 0.58), 1);
        actx.fill();
        actx.strokeStyle = rgba(PAL[2], 0.55);
        actx.lineWidth = 1.5;
        actx.stroke();
        vein = newVein(s);
    }
    function grow() {
        for (let i = 0; i < ITER_PER_FRAME; i += 1) {
            veinStep(vein);
        }
        return vein.done;
    }
    function paintFrame() {
        blitArt();
        veinDots(vein, ctx, PAL[5], 0.6);
        veinDraw(vein, ctx, mix(PAL[5], PAPER, 0.5), 0.95, 0.5, 0.22, 5.2);
    }
    function statPairs() {
        return [['Nodes', String(vein.nx.length)], ['Attractors left', String(vein.left)]];
    }
    function runText() { return TXT_RUN; }
    function doneText() { return TXT_DONE; }
    const TXT_DONE = 'Fully grown — Enter for a new seed';
    const TXT_PAUSE = 'Paused — Space to resume';
    // 시연 — 첫 200ms 는 빈 판으로 두고(첫 변화 200ms 뒤) 자라게 한 뒤, 다 자라면 900ms 머물고 다음 씨앗으로
    const DEMO_LEAD = 200;
    const DEMO_HOLD_MS = 900;
    // 동작 줄이기에서 한 번에 끝까지 키울 때 틱 수 상한 — 계산이 끝나지 않는 씨앗이 있어도 화면이 멈추지 않게
    const GROW_GUARD = 6000;
    let paused = false;
    let done = false;
    let holdMs = 0;
    let clock = 0;
    function reseed(s) {
        seed = s;
        age = 0;
        done = false;
        holdMs = 0;
        plant(s);
    }
    function tickGrow() {
        if (done) {
            return;
        }
        age += FIXED_DT;
        if (grow()) {
            done = true;
        }
    }
    // 끝까지 한 번에 — 동작 줄이기에서는 자라는 과정 없이 다 자란 그림을 바로 보인다
    function finishNow() {
        let g = 0;
        while (!done && g < GROW_GUARD) {
            tickGrow();
            g += 1;
        }
    }
    function report() {
        if (paused) {
            say(TXT_PAUSE);
        }
        else if (done) {
            say(doneText());
        }
        else {
            say(runText());
        }
    }
    function render() {
        paintFrame();
        const pairs = [['Seed', String(seed)]];
        drawStats(pairs.concat(statPairs()));
        report();
    }
    function setPaused(v) {
        paused = v;
        if (pauseBtn) {
            pauseBtn.setAttribute('aria-pressed', v ? 'true' : 'false');
        }
    }
    // 입력 한 번 뒤 — 동작 줄이기면 그 씨앗의 다 자란 모습으로 바로 그린다
    function after() {
        if (still) {
            finishNow();
        }
        render();
    }
    function newSeed() { setPaused(false); reseed(nextSeed(seed)); }
    function replaySeed() { setPaused(false); reseed(seed); }
    cv.addEventListener('pointerdown', function () { wake(); after(); });
    cv.addEventListener('keydown', function (ev) {
        const k = ev.key;
        if (k === 'Enter') {
            newSeed();
        }
        else if (k === 'r' || k === 'R') {
            replaySeed();
        }
        else if (k === ' ') {
            setPaused(!paused);
        }
        else {
            return;
        }
        ev.preventDefault();
        wake();
        after();
    });
    if (redrawBtn) {
        redrawBtn.addEventListener('click', function () { wake(); newSeed(); after(); });
    }
    if (replayBtn) {
        replayBtn.addEventListener('click', function () { wake(); replaySeed(); after(); });
    }
    if (pauseBtn) {
        pauseBtn.addEventListener('click', function () { wake(); setPaused(!paused); after(); });
    }
    function onResize() {
        fitCanvas();
        render();
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    reseed(SEED0);
    function tick() {
        clock += FIXED_DT;
        if (demo) {
            if (clock < DEMO_LEAD) {
                return;
            }
            if (done) {
                holdMs += FIXED_DT;
                if (holdMs >= DEMO_HOLD_MS) {
                    reseed(nextSeed(seed));
                }
                return;
            }
        }
        if (!paused) {
            tickGrow();
        }
    }
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    function frame(ts) {
        if (still) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 한 프레임에 성장 계산이 몰리지 않게
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            tick();
            acc -= FIXED_DT;
            n += 1;
        }
        render();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        lastTs = -1;
        acc = 0;
        rafId = window.requestAnimationFrame(frame);
    }
    // 동작 줄이기 설정이 페이지를 연 채 바뀌면 — 켜지면 루프를 멈추고 다 자란 그림으로, 꺼지면 루프를 다시 돈다
    function onMotionPref() {
        still = reduceQuery.matches;
        if (still) {
            if (rafId) {
                window.cancelAnimationFrame(rafId);
                rafId = 0;
            }
            after();
        }
        else {
            startLoop();
        }
    }
    if (typeof reduceQuery.addEventListener === 'function') {
        reduceQuery.addEventListener('change', onMotionPref);
    }
    if (still) {
        after();
    }
    else {
        render();
        startLoop();
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
        if (typeof reduceQuery.removeEventListener === 'function') {
            reduceQuery.removeEventListener('change', onMotionPref);
        }
    };
})();
</script>
</body>
</html>
