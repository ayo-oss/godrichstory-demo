<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lines That Follow a Flow Field While Keeping Their Distance — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pc is-demo" id="pc">
  <canvas class="pc__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="Lines grow both ways along a noise-driven flow and stop once they come closer to another line than the set spacing. Press Enter for a new seed, R to regrow the same seed from the start, and Space to pause."></canvas>
  <p class="pc__status" data-role="status" aria-live="off">Growing flow lines</p>
  <div class="pc__tools">
    <button class="pc__btn" data-role="redraw" type="button">Redraw</button>
    <button class="pc__btn" data-role="replay" type="button">Same seed</button>
    <button class="pc__btn" data-role="pause" type="button" aria-pressed="false">Pause</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("pc");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    const TAU = Math.PI * 2;
    const DEG = Math.PI / 180;
    // 파스텔 팔레트 — 어두운 무대(INK) 위에 밝은 Lines·면을 얹어 명도 차로 형태가 읽힌다
    const INK = [29, 26, 44];
    const PAPER = [255, 248, 234];
    const PAL = [
        [124, 196, 255],
        [255, 160, 190],
        [126, 226, 192],
        [190, 164, 255],
        [255, 208, 168],
        [246, 228, 140],
        [150, 222, 236],
        [232, 182, 228],
        [196, 220, 160],
    ];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    // 시드 고정 난수 — 같은 씨앗이면 같은 수열, 곧 같은 그림이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seedValue) {
        let s = seedValue >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 다음 Seed — 다시 그리기를 누를 때마다 정수 하나만 바뀐다(10007~99995 사이 다섯 자리)
    function nextSeed(s) { return ((s * 7919 + 104729) % 89989) + 10007; }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    // 그림판 — 자란 결과를 쌓아 두는 화면 밖 캔버스. 프레임마다 이걸 옮겨 그리고 그 위에 지금 자라는 부분만 얹는다
    const artEl = document.createElement('canvas');
    const actxRaw = artEl.getContext('2d');
    if (!canvasEl || !ctxRaw || !statusEl || !actxRaw) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    const actx = actxRaw;
    const redrawBtn = root.querySelector('[data-role="redraw"]');
    const replayBtn = root.querySelector('[data-role="replay"]');
    const pauseBtn = root.querySelector('[data-role="pause"]');
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 tail 의 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    // 지금 그림의 씨앗과, 그 씨앗을 심은 뒤 흐른 성장 시간(ms, Pause 동안은 멈춘다)
    let seed = 0;
    let age = 0;
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    let dprNow = 0;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        if (dpr === dprNow) {
            return;
        }
        // 캔버스 크기를 바꾸면 내용이 지워진다 — 그려 둔 그림판을 잠깐 옮겨 두었다가 새 배율로 다시 담는다
        const keep = document.createElement('canvas');
        keep.width = artEl.width;
        keep.height = artEl.height;
        const kctx = keep.getContext('2d');
        if (kctx && dprNow) {
            kctx.drawImage(artEl, 0, 0);
        }
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        artEl.width = cv.width;
        artEl.height = cv.height;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        actx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (kctx && dprNow) {
            actx.drawImage(keep, 0, 0, W, H);
        }
        dprNow = dpr;
    }
    function clearArt(c) {
        actx.fillStyle = rgba(c, 1);
        actx.fillRect(0, 0, W, H);
    }
    function blitArt() { ctx.drawImage(artEl, 0, 0, W, H); }
    // 오른쪽 아래 수치 상자 — 씨앗과 항목별 개수를 이름표 + 값 한 줄씩
    function drawStats(pairs) {
        ctx.font = '600 11px sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'alphabetic';
        const lines = [];
        let wide = 0;
        for (let i = 0; i < pairs.length; i += 1) {
            const t = pairs[i][0] + ' ' + pairs[i][1];
            lines.push(t);
            wide = Math.max(wide, ctx.measureText(t).width);
        }
        const lh = 15;
        const bw = wide + 16;
        const bh = lines.length * lh + 8;
        ctx.fillStyle = rgba(INK, 0.66);
        ctx.fillRect(W - 10 - bw, H - 10 - bh, bw, bh);
        ctx.fillStyle = rgba(PAPER, 0.95);
        for (let i = 0; i < lines.length; i += 1) {
            ctx.fillText(lines[i], W - 18, H - 10 - bh + 4 + lh * (i + 1) - 3);
        }
    }
    function makeNoise(rng) {
        const perm = new Uint16Array(512);
        const vals = new Float64Array(256);
        for (let i = 0; i < 256; i += 1) {
            perm[i] = i;
            vals[i] = rng();
        }
        // 섞기 — 같은 씨앗이면 같은 순서
        for (let i = 255; i > 0; i -= 1) {
            const j = Math.floor(rng() * (i + 1));
            const t = perm[i];
            perm[i] = perm[j];
            perm[j] = t;
        }
        for (let i = 0; i < 256; i += 1) {
            perm[i + 256] = perm[i];
        }
        return { perm: perm, vals: vals };
    }
    function noise2(n, x, y) {
        const xf = Math.floor(x);
        const yf = Math.floor(y);
        const X = xf & 255;
        const Y = yf & 255;
        const fx = x - xf;
        const fy = y - yf;
        const u = fx * fx * (3 - 2 * fx);
        const v = fy * fy * (3 - 2 * fy);
        const p = n.perm;
        const a = n.vals;
        const v00 = a[p[p[X] + Y] & 255];
        const v10 = a[p[p[X + 1] + Y] & 255];
        const v01 = a[p[p[X] + Y + 1] & 255];
        const v11 = a[p[p[X + 1] + Y + 1] & 255];
        return lerp(lerp(v00, v10, u), lerp(v01, v11, u), v);
    }
    // 겹 노이즈 — 주파수를 두 배, 세기를 절반씩 줄여 octaves 겹을 더하고 0~1 로 되돌린다
    function fbm2(n, x, y, octaves) {
        let sum = 0;
        let amp = 1;
        let norm = 0;
        let f = 1;
        for (let o = 0; o < octaves; o += 1) {
            sum += noise2(n, x * f, y * f) * amp;
            norm += amp;
            amp *= 0.5;
            f *= 2;
        }
        return sum / norm;
    }
    function makeBuckets(cell) {
        const cols = Math.ceil(W / cell) + 1;
        const rows = Math.ceil(H / cell) + 1;
        const b = [];
        for (let i = 0; i < cols * rows; i += 1) {
            b.push([]);
        }
        return { cell: cell, cols: cols, rows: rows, b: b };
    }
    function bucketAdd(g, x, y, id) {
        const c = clamp(Math.floor(x / g.cell), 0, g.cols - 1);
        const r = clamp(Math.floor(y / g.cell), 0, g.rows - 1);
        g.b[r * g.cols + c].push(id);
    }
    function bucketsClear(g) {
        for (let i = 0; i < g.b.length; i += 1) {
            g.b[i].length = 0;
        }
    }
    // (x, y) 에서 반경 rad 를 덮는 칸들의 번호를 visit 에 넘긴다 — visit 이 true 를 돌려주면 그 자리에서 멈추고 true
    function bucketNear(g, x, y, rad, visit) {
        const c0 = clamp(Math.floor((x - rad) / g.cell), 0, g.cols - 1);
        const c1 = clamp(Math.floor((x + rad) / g.cell), 0, g.cols - 1);
        const r0 = clamp(Math.floor((y - rad) / g.cell), 0, g.rows - 1);
        const r1 = clamp(Math.floor((y + rad) / g.cell), 0, g.rows - 1);
        for (let r = r0; r <= r1; r += 1) {
            for (let c = c0; c <= c1; c += 1) {
                const list = g.b[r * g.cols + c];
                for (let k = 0; k < list.length; k += 1) {
                    if (visit(list[k])) {
                        return true;
                    }
                }
            }
        }
        return false;
    }
    // 무작위 출발점이 연달아 이만큼 거절되면 빈자리가 없다고 보고 끝낸다
    const FLOW_SEED_FAILS = 160;
    function makeFlow(rng, noise, o) {
        const fcols = Math.ceil(W / o.cell) + 2;
        const frows = Math.ceil(H / o.cell) + 2;
        const vx = new Float64Array(fcols * frows);
        const vy = new Float64Array(fcols * frows);
        // 칸 꼭짓점마다 방향을 한 번만 정해 둔다 — 노이즈 0~1 을 두 바퀴(4π) 각도로
        for (let j = 0; j < frows; j += 1) {
            for (let i = 0; i < fcols; i += 1) {
                const a = fbm2(noise, i * o.cell * o.scale, j * o.cell * o.scale, 2) * TAU * 2;
                vx[j * fcols + i] = Math.cos(a);
                vy[j * fcols + i] = Math.sin(a);
            }
        }
        return {
            o: o, rng: rng, vx: vx, vy: vy, fcols: fcols, frows: frows,
            px: [], py: [], pl: [], po: [], grid: makeBuckets(o.sep),
            cand: [], candAt: 0, line: -1, dir: 1, ord: 0, x: 0, y: 0, sx: 0, sy: 0, pts: [],
            active: false, lines: 0, length: 0, fails: 0, done: false,
        };
    }
    // 네 꼭짓점 방향을 거리 비율로 섞어(쌍선형) Length 1 로 — 칸 경계에서 방향이 꺾이지 않는다
    function flowDir(f, x, y) {
        const gx = clamp(x / f.o.cell, 0, f.fcols - 1.001);
        const gy = clamp(y / f.o.cell, 0, f.frows - 1.001);
        const i = Math.floor(gx);
        const j = Math.floor(gy);
        const u = gx - i;
        const v = gy - j;
        const k = j * f.fcols + i;
        const dx = lerp(lerp(f.vx[k], f.vx[k + 1], u), lerp(f.vx[k + f.fcols], f.vx[k + f.fcols + 1], u), v);
        const dy = lerp(lerp(f.vy[k], f.vy[k + 1], u), lerp(f.vy[k + f.fcols], f.vy[k + f.fcols + 1], u), v);
        const L = Math.hypot(dx, dy);
        return L < 1e-6 ? [1, 0] : [dx / L, dy / L];
    }
    // (x, y) 반경 d 안에 다른 점이 있는가 — 같은 선의 바로 앞뒤 점(간격 두 배 Length 안)은 세지 않는다
    function flowTooClose(f, x, y, d, line, ord) {
        const skip = Math.ceil((f.o.sep * 2) / f.o.step);
        const d2 = d * d;
        return bucketNear(f.grid, x, y, d, function (id) {
            if (f.pl[id] === line && Math.abs(f.po[id] - ord) <= skip) {
                return false;
            }
            const dx = f.px[id] - x;
            const dy = f.py[id] - y;
            return dx * dx + dy * dy < d2;
        });
    }
    function flowInside(f, x, y) {
        const m = f.o.margin;
        return x >= m && x <= W - m && y >= m && y <= H - m;
    }
    function flowAddPoint(f, x, y) {
        const id = f.px.length;
        f.px.push(x);
        f.py.push(y);
        f.pl.push(f.line);
        f.po.push(f.ord);
        bucketAdd(f.grid, x, y, id);
        f.pts.push(id);
    }
    function flowStart(f, x, y) {
        f.line = f.lines;
        f.lines += 1;
        f.dir = 1;
        f.ord = 0;
        f.x = x;
        f.y = y;
        f.sx = x;
        f.sy = y;
        f.pts = [];
        flowAddPoint(f, x, y);
        f.active = true;
    }
    // Lines 하나가 끝나면 그 선을 따라 양옆으로 간격만큼 떨어진 자리를 다음 출발 후보로 줄 세운다
    function flowEndLine(f) {
        const stride = Math.max(1, Math.round(f.o.sep / f.o.step));
        for (let k = 0; k < f.pts.length; k += stride) {
            const id = f.pts[k];
            const d = flowDir(f, f.px[id], f.py[id]);
            f.cand.push(f.px[id] - d[1] * f.o.sep, f.py[id] + d[0] * f.o.sep);
            f.cand.push(f.px[id] + d[1] * f.o.sep, f.py[id] - d[0] * f.o.sep);
        }
        f.active = false;
    }
    // 한 틱의 일 — 걸음 하나가 1, 출발점 검사 하나가 0.2. budget 을 다 쓰면 다음 틱으로 넘긴다
    function flowStep(f, budget, seg) {
        let b = budget;
        while (b > 0 && !f.done) {
            if (!f.active) {
                b -= 0.2;
                if (f.candAt < f.cand.length) {
                    const cx = f.cand[f.candAt];
                    const cy = f.cand[f.candAt + 1];
                    f.candAt += 2;
                    if (flowInside(f, cx, cy) && !flowTooClose(f, cx, cy, f.o.sep * 0.999, -1, 0)) {
                        flowStart(f, cx, cy);
                    }
                    continue;
                }
                // 후보가 바닥나면 무작위 자리를 뽑아 거절 표본으로 빈자리를 찾는다
                const m = f.o.margin;
                const rx = m + f.rng() * (W - 2 * m);
                const ry = m + f.rng() * (H - 2 * m);
                if (!flowTooClose(f, rx, ry, f.o.sep * 0.999, -1, 0)) {
                    f.fails = 0;
                    flowStart(f, rx, ry);
                }
                else {
                    f.fails += 1;
                    if (f.fails >= FLOW_SEED_FAILS) {
                        f.done = true;
                    }
                }
                continue;
            }
            // 한 걸음 — 반걸음 앞의 방향으로 걷는 중간점 방법(곡선 바깥으로 새는 오차를 줄인다)
            b -= 1;
            const h = f.o.step * f.dir;
            const d1 = flowDir(f, f.x, f.y);
            const d2 = flowDir(f, f.x + d1[0] * h * 0.5, f.y + d1[1] * h * 0.5);
            const nx = f.x + d2[0] * h;
            const ny = f.y + d2[1] * h;
            const nord = f.ord + f.dir;
            if (!flowInside(f, nx, ny) || f.pts.length >= f.o.maxPts || flowTooClose(f, nx, ny, f.o.sep * f.o.test, f.line, nord)) {
                // 앞쪽이 막히면 출발점으로 돌아가 반대쪽으로, 반대쪽도 막히면 Lines 하나 끝
                if (f.dir === 1) {
                    f.dir = -1;
                    f.ord = 0;
                    f.x = f.sx;
                    f.y = f.sy;
                }
                else {
                    flowEndLine(f);
                }
                continue;
            }
            seg(f.x, f.y, nx, ny, f.line);
            f.length += f.o.step;
            f.x = nx;
            f.y = ny;
            f.ord = nord;
            flowAddPoint(f, nx, ny);
        }
        return f.done;
    }
    // 노이즈 주파수(px 당) — 작을수록 소용돌이가 크고 느슨해진다
    const FLOW_NOISE_SCALE = 0.0045;
    // 선과 Lines 사이 간격(px) — 새 선의 출발점은 다른 선의 점과 이만큼 떨어져야 한다
    const LINE_SEPARATION = 8;
    // 한 걸음 Length(px)
    const STEP_LENGTH = 2;
    // 자라는 선은 간격의 이 비율보다 가까워지면 멈춘다 — 출발 간격보다 느슨하게 둬 Lines 끝이 너무 일찍 끊기지 않게
    const SEP_TEST = 0.5;
    // 방향을 미리 정해 두는 칸 크기(px)
    const FIELD_CELL = 12;
    // 한 틱(16ms)에 쓰는 일의 양(걸음 1, 출발점 검사 0.2) — 성장 속도이자 프레임당 계산량 상한
    const STEPS_PER_FRAME = 70;
    // Lines 하나의 점 수 상한 — 소용돌이 가운데를 끝없이 도는 선을 끊는다
    const MAX_LINE_POINTS = 700;
    const SEED0 = 47101;
    const TXT_RUN = 'Growing flow lines';
    function newFlow(s) {
        const rng = makeRng(s);
        const noise = makeNoise(rng);
        return makeFlow(rng, noise, { sep: LINE_SEPARATION, test: SEP_TEST, step: STEP_LENGTH, scale: FLOW_NOISE_SCALE, cell: FIELD_CELL, maxPts: MAX_LINE_POINTS, margin: 6 });
    }
    let flow = newFlow(SEED0);
    function plant(s) {
        clearArt(INK);
        flow = newFlow(s);
    }
    // 선분 색 — 진행 방향의 세로 성분으로 하늘색과 분홍 사이를 섞어, 같은 흐름은 같은 색 띠로 읽힌다
    function drawSeg(ax, ay, bx, by) {
        const t = (by - ay) / STEP_LENGTH * 0.5 + 0.5;
        actx.strokeStyle = rgba(mix(PAL[0], PAL[1], clamp(t, 0, 1)), 0.92);
        actx.lineWidth = 1.5;
        actx.lineCap = 'round';
        actx.beginPath();
        actx.moveTo(ax, ay);
        actx.lineTo(bx, by);
        actx.stroke();
    }
    function grow() { return flowStep(flow, STEPS_PER_FRAME, drawSeg); }
    function paintFrame() {
        blitArt();
        // 지금 자라는 Lines 끝
        if (flow.active) {
            ctx.fillStyle = rgba(PAPER, 0.95);
            ctx.beginPath();
            ctx.arc(flow.x, flow.y, 2.6, 0, TAU);
            ctx.fill();
        }
    }
    function statPairs() {
        return [['Lines', String(flow.lines)], ['Length', Math.round(flow.length) + 'px']];
    }
    function runText() { return TXT_RUN; }
    function doneText() { return TXT_DONE; }
    const TXT_DONE = 'Fully grown — Enter for a new seed';
    const TXT_PAUSE = 'Paused — Space to resume';
    // 시연 — 첫 200ms 는 빈 판으로 두고(첫 변화 200ms 뒤) 자라게 한 뒤, 다 자라면 900ms 머물고 다음 씨앗으로
    const DEMO_LEAD = 200;
    const DEMO_HOLD_MS = 900;
    // 동작 줄이기에서 한 번에 끝까지 키울 때 틱 수 상한 — 계산이 끝나지 않는 씨앗이 있어도 화면이 멈추지 않게
    const GROW_GUARD = 6000;
    let paused = false;
    let done = false;
    let holdMs = 0;
    let clock = 0;
    function reseed(s) {
        seed = s;
        age = 0;
        done = false;
        holdMs = 0;
        plant(s);
    }
    function tickGrow() {
        if (done) {
            return;
        }
        age += FIXED_DT;
        if (grow()) {
            done = true;
        }
    }
    // 끝까지 한 번에 — 동작 줄이기에서는 자라는 과정 없이 다 자란 그림을 바로 보인다
    function finishNow() {
        let g = 0;
        while (!done && g < GROW_GUARD) {
            tickGrow();
            g += 1;
        }
    }
    function report() {
        if (paused) {
            say(TXT_PAUSE);
        }
        else if (done) {
            say(doneText());
        }
        else {
            say(runText());
        }
    }
    function render() {
        paintFrame();
        const pairs = [['Seed', String(seed)]];
        drawStats(pairs.concat(statPairs()));
        report();
    }
    function setPaused(v) {
        paused = v;
        if (pauseBtn) {
            pauseBtn.setAttribute('aria-pressed', v ? 'true' : 'false');
        }
    }
    // 입력 한 번 뒤 — 동작 줄이기면 그 씨앗의 다 자란 모습으로 바로 그린다
    function after() {
        if (still) {
            finishNow();
        }
        render();
    }
    function newSeed() { setPaused(false); reseed(nextSeed(seed)); }
    function replaySeed() { setPaused(false); reseed(seed); }
    cv.addEventListener('pointerdown', function () { wake(); after(); });
    cv.addEventListener('keydown', function (ev) {
        const k = ev.key;
        if (k === 'Enter') {
            newSeed();
        }
        else if (k === 'r' || k === 'R') {
            replaySeed();
        }
        else if (k === ' ') {
            setPaused(!paused);
        }
        else {
            return;
        }
        ev.preventDefault();
        wake();
        after();
    });
    if (redrawBtn) {
        redrawBtn.addEventListener('click', function () { wake(); newSeed(); after(); });
    }
    if (replayBtn) {
        replayBtn.addEventListener('click', function () { wake(); replaySeed(); after(); });
    }
    if (pauseBtn) {
        pauseBtn.addEventListener('click', function () { wake(); setPaused(!paused); after(); });
    }
    function onResize() {
        fitCanvas();
        render();
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    reseed(SEED0);
    function tick() {
        clock += FIXED_DT;
        if (demo) {
            if (clock < DEMO_LEAD) {
                return;
            }
            if (done) {
                holdMs += FIXED_DT;
                if (holdMs >= DEMO_HOLD_MS) {
                    reseed(nextSeed(seed));
                }
                return;
            }
        }
        if (!paused) {
            tickGrow();
        }
    }
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    function frame(ts) {
        if (still) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 한 프레임에 성장 계산이 몰리지 않게
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            tick();
            acc -= FIXED_DT;
            n += 1;
        }
        render();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        lastTs = -1;
        acc = 0;
        rafId = window.requestAnimationFrame(frame);
    }
    // 동작 줄이기 설정이 페이지를 연 채 바뀌면 — 켜지면 루프를 멈추고 다 자란 그림으로, 꺼지면 루프를 다시 돈다
    function onMotionPref() {
        still = reduceQuery.matches;
        if (still) {
            if (rafId) {
                window.cancelAnimationFrame(rafId);
                rafId = 0;
            }
            after();
        }
        else {
            startLoop();
        }
    }
    if (typeof reduceQuery.addEventListener === 'function') {
        reduceQuery.addEventListener('change', onMotionPref);
    }
    if (still) {
        after();
    }
    else {
        render();
        startLoop();
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
        if (typeof reduceQuery.removeEventListener === 'function') {
            reduceQuery.removeEventListener('change', onMotionPref);
        }
    };
})();
</script>
</body>
</html>
