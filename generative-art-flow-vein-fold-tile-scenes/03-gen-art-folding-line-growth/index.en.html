<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Line That Folds as It Grows by Inserting Nodes — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pc is-demo" id="pc">
  <canvas class="pc__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="Nodes on a closed line push each other away and new nodes are inserted into long edges, so the line folds like coral. Press Enter for a new seed, R to regrow the same seed from the start, and Space to pause."></canvas>
  <p class="pc__status" data-role="status" aria-live="off">Growing and folding</p>
  <div class="pc__tools">
    <button class="pc__btn" data-role="redraw" type="button">Redraw</button>
    <button class="pc__btn" data-role="replay" type="button">Same seed</button>
    <button class="pc__btn" data-role="pause" type="button" aria-pressed="false">Pause</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("pc");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    const TAU = Math.PI * 2;
    const DEG = Math.PI / 180;
    // 파스텔 팔레트 — 어두운 무대(INK) 위에 밝은 Lines·면을 얹어 명도 차로 형태가 읽힌다
    const INK = [29, 26, 44];
    const PAPER = [255, 248, 234];
    const PAL = [
        [124, 196, 255],
        [255, 160, 190],
        [126, 226, 192],
        [190, 164, 255],
        [255, 208, 168],
        [246, 228, 140],
        [150, 222, 236],
        [232, 182, 228],
        [196, 220, 160],
    ];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    // 시드 고정 난수 — 같은 씨앗이면 같은 수열, 곧 같은 그림이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seedValue) {
        let s = seedValue >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 다음 Seed — 다시 그리기를 누를 때마다 정수 하나만 바뀐다(10007~99995 사이 다섯 자리)
    function nextSeed(s) { return ((s * 7919 + 104729) % 89989) + 10007; }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    // 그림판 — 자란 결과를 쌓아 두는 화면 밖 캔버스. 프레임마다 이걸 옮겨 그리고 그 위에 지금 자라는 부분만 얹는다
    const artEl = document.createElement('canvas');
    const actxRaw = artEl.getContext('2d');
    if (!canvasEl || !ctxRaw || !statusEl || !actxRaw) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    const actx = actxRaw;
    const redrawBtn = root.querySelector('[data-role="redraw"]');
    const replayBtn = root.querySelector('[data-role="replay"]');
    const pauseBtn = root.querySelector('[data-role="pause"]');
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 tail 의 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    // 지금 그림의 씨앗과, 그 씨앗을 심은 뒤 흐른 성장 시간(ms, Pause 동안은 멈춘다)
    let seed = 0;
    let age = 0;
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    let dprNow = 0;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        if (dpr === dprNow) {
            return;
        }
        // 캔버스 크기를 바꾸면 내용이 지워진다 — 그려 둔 그림판을 잠깐 옮겨 두었다가 새 배율로 다시 담는다
        const keep = document.createElement('canvas');
        keep.width = artEl.width;
        keep.height = artEl.height;
        const kctx = keep.getContext('2d');
        if (kctx && dprNow) {
            kctx.drawImage(artEl, 0, 0);
        }
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        artEl.width = cv.width;
        artEl.height = cv.height;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        actx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (kctx && dprNow) {
            actx.drawImage(keep, 0, 0, W, H);
        }
        dprNow = dpr;
    }
    function clearArt(c) {
        actx.fillStyle = rgba(c, 1);
        actx.fillRect(0, 0, W, H);
    }
    function blitArt() { ctx.drawImage(artEl, 0, 0, W, H); }
    // 오른쪽 아래 수치 상자 — 씨앗과 항목별 개수를 이름표 + 값 한 줄씩
    function drawStats(pairs) {
        ctx.font = '600 11px sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'alphabetic';
        const lines = [];
        let wide = 0;
        for (let i = 0; i < pairs.length; i += 1) {
            const t = pairs[i][0] + ' ' + pairs[i][1];
            lines.push(t);
            wide = Math.max(wide, ctx.measureText(t).width);
        }
        const lh = 15;
        const bw = wide + 16;
        const bh = lines.length * lh + 8;
        ctx.fillStyle = rgba(INK, 0.66);
        ctx.fillRect(W - 10 - bw, H - 10 - bh, bw, bh);
        ctx.fillStyle = rgba(PAPER, 0.95);
        for (let i = 0; i < lines.length; i += 1) {
            ctx.fillText(lines[i], W - 18, H - 10 - bh + 4 + lh * (i + 1) - 3);
        }
    }
    function makeBuckets(cell) {
        const cols = Math.ceil(W / cell) + 1;
        const rows = Math.ceil(H / cell) + 1;
        const b = [];
        for (let i = 0; i < cols * rows; i += 1) {
            b.push([]);
        }
        return { cell: cell, cols: cols, rows: rows, b: b };
    }
    function bucketAdd(g, x, y, id) {
        const c = clamp(Math.floor(x / g.cell), 0, g.cols - 1);
        const r = clamp(Math.floor(y / g.cell), 0, g.rows - 1);
        g.b[r * g.cols + c].push(id);
    }
    function bucketsClear(g) {
        for (let i = 0; i < g.b.length; i += 1) {
            g.b[i].length = 0;
        }
    }
    // (x, y) 에서 반경 rad 를 덮는 칸들의 번호를 visit 에 넘긴다 — visit 이 true 를 돌려주면 그 자리에서 멈추고 true
    function bucketNear(g, x, y, rad, visit) {
        const c0 = clamp(Math.floor((x - rad) / g.cell), 0, g.cols - 1);
        const c1 = clamp(Math.floor((x + rad) / g.cell), 0, g.cols - 1);
        const r0 = clamp(Math.floor((y - rad) / g.cell), 0, g.rows - 1);
        const r1 = clamp(Math.floor((y + rad) / g.cell), 0, g.rows - 1);
        for (let r = r0; r <= r1; r += 1) {
            for (let c = c0; c <= c1; c += 1) {
                const list = g.b[r * g.cols + c];
                for (let k = 0; k < list.length; k += 1) {
                    if (visit(list[k])) {
                        return true;
                    }
                }
            }
        }
        return false;
    }
    // 마디끼리 밀어내는 반경(px) — 이 안에 든 마디는 거리에 반비례해 밀린다
    const REPEL_RADIUS = 12;
    // Nodes 사이가 이보다 벌어지면 가운데에 새 마디를 끼운다(px)
    const MAX_EDGE_LENGTH = 5;
    // 양옆 마디의 가운데 쪽으로 끌어당기는 비율 — 클수록 선이 매끈해진다
    const ALIGN_FORCE = 0.4;
    // 밀어내는 힘의 크기
    const REPEL_FORCE = 0.5;
    // 이웃 마디끼리 잇는 용수철 — 쉬는 Length(px)보다 짧으면 밀고 길면 당긴다
    const SPRING_REST = 4;
    const SPRING_FORCE = 0.3;
    // 한 틱에 아무 변에나 끼우는 성장 Nodes 수 — 마디가 늘면 용수철이 선을 늘이려 하고, 울타리 안에서 늘어날 자리가 없으니 접힌다
    const GROWTH_PER_FRAME = 12;
    // 한 틱에 끼우는 Nodes 수 상한(긴 변 나누기 + 성장)과 전체 Nodes 수 상한 — 프레임당 계산량 상한
    const SPLITS_PER_FRAME = 24;
    const MAX_NODES = 2600;
    // 자랄 수 있는 타원 울타리
    const BOUND_CX = 300;
    const BOUND_CY = 150;
    const BOUND_RX = 168;
    const BOUND_RY = 124;
    const START_NODES = 24;
    const START_R = 22;
    const SEED0 = 47103;
    const TXT_RUN = 'Growing and folding';
    let xs = [];
    let ys = [];
    let lrng = makeRng(SEED0);
    let splitFrom = 0;
    const grid = makeBuckets(REPEL_RADIUS);
    function plant(s) {
        clearArt(INK);
        lrng = makeRng(s);
        xs = [];
        ys = [];
        splitFrom = 0;
        for (let i = 0; i < START_NODES; i += 1) {
            const a = (i / START_NODES) * TAU;
            const r = START_R * (1 + (lrng() - 0.5) * 0.3);
            xs.push(BOUND_CX + Math.cos(a) * r);
            ys.push(BOUND_CY + Math.sin(a) * r);
        }
    }
    // 힘 합 — 양옆 가운데로 끌기 + 반경 안 이웃(격자 근방만) 밀기 + 타원 밖이면 안으로
    function relax() {
        const n = xs.length;
        bucketsClear(grid);
        for (let i = 0; i < n; i += 1) {
            bucketAdd(grid, xs[i], ys[i], i);
        }
        const nx = new Array(n);
        const ny = new Array(n);
        const R = REPEL_RADIUS;
        for (let i = 0; i < n; i += 1) {
            const x = xs[i];
            const y = ys[i];
            const pv = (i + n - 1) % n;
            const nt = (i + 1) % n;
            let fx = ((xs[pv] + xs[nt]) * 0.5 - x) * ALIGN_FORCE;
            let fy = ((ys[pv] + ys[nt]) * 0.5 - y) * ALIGN_FORCE;
            const nbs = [pv, nt];
            for (let k = 0; k < 2; k += 1) {
                const j = nbs[k];
                const dx = xs[j] - x;
                const dy = ys[j] - y;
                const d = Math.hypot(dx, dy) || 1e-6;
                const pull = ((d - SPRING_REST) / d) * SPRING_FORCE * 0.5;
                fx += dx * pull;
                fy += dy * pull;
            }
            bucketNear(grid, x, y, R, function (j) {
                if (j === i || j === pv || j === nt) {
                    return false;
                }
                const dx = x - xs[j];
                const dy = y - ys[j];
                const d2 = dx * dx + dy * dy;
                if (d2 >= R * R || d2 < 1e-9) {
                    return false;
                }
                const d = Math.sqrt(d2);
                const push = ((R - d) / R) * REPEL_FORCE;
                fx += (dx / d) * push;
                fy += (dy / d) * push;
                return false;
            });
            const ex = (x - BOUND_CX) / BOUND_RX;
            const ey = (y - BOUND_CY) / BOUND_RY;
            const e = ex * ex + ey * ey;
            if (e > 1) {
                fx -= (x - BOUND_CX) * (e - 1) * 0.5;
                fy -= (y - BOUND_CY) * (e - 1) * 0.5;
            }
            nx[i] = x + fx;
            ny[i] = y + fy;
        }
        xs = nx;
        ys = ny;
    }
    // 긴 변 나누기 — 시작 자리를 틱마다 옮겨 가며 MAX_EDGE_LENGTH 보다 긴 변 가운데에 마디를 끼운다
    function splitEdges() {
        let made = 0;
        const n0 = xs.length;
        let i = splitFrom % n0;
        for (let k = 0; k < n0 && made < SPLITS_PER_FRAME && xs.length < MAX_NODES; k += 1) {
            const j = (i + 1) % xs.length;
            const dx = xs[j] - xs[i];
            const dy = ys[j] - ys[i];
            if (dx * dx + dy * dy > MAX_EDGE_LENGTH * MAX_EDGE_LENGTH) {
                // 가운데에서 아주 조금 옆으로 — 대칭이 깨져야 주름이 접힌다
                const jit = (lrng() - 0.5) * 0.4;
                xs.splice(i + 1, 0, (xs[i] + xs[j]) * 0.5 - dy * jit * 0.1);
                ys.splice(i + 1, 0, (ys[i] + ys[j]) * 0.5 + dx * jit * 0.1);
                made += 1;
                i += 1;
            }
            i = (i + 1) % xs.length;
        }
        splitFrom = i + 37;
        // 성장 — 남은 몫만큼 시드 난수로 고른 변 가운데에 마디를 더 끼운다
        for (let g = 0; g < GROWTH_PER_FRAME && made < SPLITS_PER_FRAME && xs.length < MAX_NODES; g += 1) {
            const a = Math.floor(lrng() * xs.length);
            const b = (a + 1) % xs.length;
            xs.splice(a + 1, 0, (xs[a] + xs[b]) * 0.5);
            ys.splice(a + 1, 0, (ys[a] + ys[b]) * 0.5);
            made += 1;
        }
    }
    function grow() {
        relax();
        splitEdges();
        return xs.length >= MAX_NODES;
    }
    function perimeter() {
        let s = 0;
        for (let i = 0; i < xs.length; i += 1) {
            const j = (i + 1) % xs.length;
            s += Math.hypot(xs[j] - xs[i], ys[j] - ys[i]);
        }
        return s;
    }
    function paintFrame() {
        blitArt();
        ctx.beginPath();
        ctx.moveTo(xs[0], ys[0]);
        for (let i = 1; i < xs.length; i += 1) {
            ctx.lineTo(xs[i], ys[i]);
        }
        ctx.closePath();
        ctx.fillStyle = rgba(mix(PAL[1], PAL[7], 0.4), 0.9);
        ctx.fill();
        ctx.strokeStyle = rgba(PAPER, 0.95);
        ctx.lineWidth = 1.3;
        ctx.lineJoin = 'round';
        ctx.stroke();
    }
    function statPairs() {
        return [['Nodes', String(xs.length)], ['Perimeter', Math.round(perimeter()) + 'px']];
    }
    function runText() { return TXT_RUN; }
    function doneText() { return TXT_DONE; }
    const TXT_DONE = 'Fully grown — Enter for a new seed';
    const TXT_PAUSE = 'Paused — Space to resume';
    // 시연 — 첫 200ms 는 빈 판으로 두고(첫 변화 200ms 뒤) 자라게 한 뒤, 다 자라면 900ms 머물고 다음 씨앗으로
    const DEMO_LEAD = 200;
    const DEMO_HOLD_MS = 900;
    // 동작 줄이기에서 한 번에 끝까지 키울 때 틱 수 상한 — 계산이 끝나지 않는 씨앗이 있어도 화면이 멈추지 않게
    const GROW_GUARD = 6000;
    let paused = false;
    let done = false;
    let holdMs = 0;
    let clock = 0;
    function reseed(s) {
        seed = s;
        age = 0;
        done = false;
        holdMs = 0;
        plant(s);
    }
    function tickGrow() {
        if (done) {
            return;
        }
        age += FIXED_DT;
        if (grow()) {
            done = true;
        }
    }
    // 끝까지 한 번에 — 동작 줄이기에서는 자라는 과정 없이 다 자란 그림을 바로 보인다
    function finishNow() {
        let g = 0;
        while (!done && g < GROW_GUARD) {
            tickGrow();
            g += 1;
        }
    }
    function report() {
        if (paused) {
            say(TXT_PAUSE);
        }
        else if (done) {
            say(doneText());
        }
        else {
            say(runText());
        }
    }
    function render() {
        paintFrame();
        const pairs = [['Seed', String(seed)]];
        drawStats(pairs.concat(statPairs()));
        report();
    }
    function setPaused(v) {
        paused = v;
        if (pauseBtn) {
            pauseBtn.setAttribute('aria-pressed', v ? 'true' : 'false');
        }
    }
    // 입력 한 번 뒤 — 동작 줄이기면 그 씨앗의 다 자란 모습으로 바로 그린다
    function after() {
        if (still) {
            finishNow();
        }
        render();
    }
    function newSeed() { setPaused(false); reseed(nextSeed(seed)); }
    function replaySeed() { setPaused(false); reseed(seed); }
    cv.addEventListener('pointerdown', function () { wake(); after(); });
    cv.addEventListener('keydown', function (ev) {
        const k = ev.key;
        if (k === 'Enter') {
            newSeed();
        }
        else if (k === 'r' || k === 'R') {
            replaySeed();
        }
        else if (k === ' ') {
            setPaused(!paused);
        }
        else {
            return;
        }
        ev.preventDefault();
        wake();
        after();
    });
    if (redrawBtn) {
        redrawBtn.addEventListener('click', function () { wake(); newSeed(); after(); });
    }
    if (replayBtn) {
        replayBtn.addEventListener('click', function () { wake(); replaySeed(); after(); });
    }
    if (pauseBtn) {
        pauseBtn.addEventListener('click', function () { wake(); setPaused(!paused); after(); });
    }
    function onResize() {
        fitCanvas();
        render();
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    reseed(SEED0);
    function tick() {
        clock += FIXED_DT;
        if (demo) {
            if (clock < DEMO_LEAD) {
                return;
            }
            if (done) {
                holdMs += FIXED_DT;
                if (holdMs >= DEMO_HOLD_MS) {
                    reseed(nextSeed(seed));
                }
                return;
            }
        }
        if (!paused) {
            tickGrow();
        }
    }
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    function frame(ts) {
        if (still) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 한 프레임에 성장 계산이 몰리지 않게
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            tick();
            acc -= FIXED_DT;
            n += 1;
        }
        render();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        lastTs = -1;
        acc = 0;
        rafId = window.requestAnimationFrame(frame);
    }
    // 동작 줄이기 설정이 페이지를 연 채 바뀌면 — 켜지면 루프를 멈추고 다 자란 그림으로, 꺼지면 루프를 다시 돈다
    function onMotionPref() {
        still = reduceQuery.matches;
        if (still) {
            if (rafId) {
                window.cancelAnimationFrame(rafId);
                rafId = 0;
            }
            after();
        }
        else {
            startLoop();
        }
    }
    if (typeof reduceQuery.addEventListener === 'function') {
        reduceQuery.addEventListener('change', onMotionPref);
    }
    if (still) {
        after();
    }
    else {
        render();
        startLoop();
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
        if (typeof reduceQuery.removeEventListener === 'function') {
            reduceQuery.removeEventListener('change', onMotionPref);
        }
    };
})();
</script>
