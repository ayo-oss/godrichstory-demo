<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>縁のマスがひとつずつ付いて広がる苔の群れ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pc is-demo" id="pc">
  <canvas class="pc__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="群れごとに縁の空きマスをひとつランダムに選んで埋めて広がり、生まれた順に色が淡くなる苔の絵。Enterで新しいシードを描き、Rで同じシードを最初から育て直し、Spaceで一時停止します。"></canvas>
  <p class="pc__status" data-role="status" aria-live="off">苔の群れが広がっています</p>
  <div class="pc__tools">
    <button class="pc__btn" data-role="redraw" type="button">描き直す</button>
    <button class="pc__btn" data-role="replay" type="button">同じシード</button>
    <button class="pc__btn" data-role="pause" type="button" aria-pressed="false">一時停止</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("pc");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    const TAU = Math.PI * 2;
    const DEG = Math.PI / 180;
    // 파스텔 팔레트 — 어두운 무대(INK) 위에 밝은 線·면을 얹어 명도 차로 형태가 읽힌다
    const INK = [29, 26, 44];
    const PAPER = [255, 248, 234];
    const PAL = [
        [124, 196, 255],
        [255, 160, 190],
        [126, 226, 192],
        [190, 164, 255],
        [255, 208, 168],
        [246, 228, 140],
        [150, 222, 236],
        [232, 182, 228],
        [196, 220, 160],
    ];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    // 시드 고정 난수 — 같은 씨앗이면 같은 수열, 곧 같은 그림이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seedValue) {
        let s = seedValue >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 다음 シード — 다시 그리기를 누를 때마다 정수 하나만 바뀐다(10007~99995 사이 다섯 자리)
    function nextSeed(s) { return ((s * 7919 + 104729) % 89989) + 10007; }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    // 그림판 — 자란 결과를 쌓아 두는 화면 밖 캔버스. 프레임마다 이걸 옮겨 그리고 그 위에 지금 자라는 부분만 얹는다
    const artEl = document.createElement('canvas');
    const actxRaw = artEl.getContext('2d');
    if (!canvasEl || !ctxRaw || !statusEl || !actxRaw) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    const actx = actxRaw;
    const redrawBtn = root.querySelector('[data-role="redraw"]');
    const replayBtn = root.querySelector('[data-role="replay"]');
    const pauseBtn = root.querySelector('[data-role="pause"]');
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 tail 의 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    // 지금 그림의 씨앗과, 그 씨앗을 심은 뒤 흐른 성장 시간(ms, 一時停止 동안은 멈춘다)
    let seed = 0;
    let age = 0;
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    let dprNow = 0;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        if (dpr === dprNow) {
            return;
        }
        // 캔버스 크기를 바꾸면 내용이 지워진다 — 그려 둔 그림판을 잠깐 옮겨 두었다가 새 배율로 다시 담는다
        const keep = document.createElement('canvas');
        keep.width = artEl.width;
        keep.height = artEl.height;
        const kctx = keep.getContext('2d');
        if (kctx && dprNow) {
            kctx.drawImage(artEl, 0, 0);
        }
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        artEl.width = cv.width;
        artEl.height = cv.height;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        actx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (kctx && dprNow) {
            actx.drawImage(keep, 0, 0, W, H);
        }
        dprNow = dpr;
    }
    function clearArt(c) {
        actx.fillStyle = rgba(c, 1);
        actx.fillRect(0, 0, W, H);
    }
    function blitArt() { ctx.drawImage(artEl, 0, 0, W, H); }
    // 오른쪽 아래 수치 상자 — 씨앗과 항목별 개수를 이름표 + 값 한 줄씩
    function drawStats(pairs) {
        ctx.font = '600 11px sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'alphabetic';
        const lines = [];
        let wide = 0;
        for (let i = 0; i < pairs.length; i += 1) {
            const t = pairs[i][0] + ' ' + pairs[i][1];
            lines.push(t);
            wide = Math.max(wide, ctx.measureText(t).width);
        }
        const lh = 15;
        const bw = wide + 16;
        const bh = lines.length * lh + 8;
        ctx.fillStyle = rgba(INK, 0.66);
        ctx.fillRect(W - 10 - bw, H - 10 - bh, bw, bh);
        ctx.fillStyle = rgba(PAPER, 0.95);
        for (let i = 0; i < lines.length; i += 1) {
            ctx.fillText(lines[i], W - 18, H - 10 - bh + 4 + lh * (i + 1) - 3);
        }
    }
    // 군락 수 — シード 칸 하나씩에서 출발한다
    const COLONY_COUNT = 7;
    // 한 틱에 새로 채우는 칸 수(군락을 차례로 돌며 하나씩) — 성장 속도이자 프레임당 계산량 상한
    const CELLS_PER_FRAME = 60;
    // 태어난 순서로 옅어지는 정도 — 마지막 칸은 짙은 색에서 밝은 색 쪽으로 이 비율만큼 간다
    const AGE_FADE = 0.6;
    const CELL = 4;
    const COLS = W / CELL;
    const ROWS = H / CELL;
    const TOTAL = COLS * ROWS;
    const SEED0 = 47108;
    const TXT_RUN = '苔の群れが広がっています';
    const owner = new Int8Array(TOTAL);
    // 칸마다 그 칸을 가장자리 목록에 넣은 군락들의 비트 — 같은 칸을 한 군락 목록에 두 번 넣지 않게
    const inFront = new Int32Array(TOTAL);
    let fronts = [];
    let lrng = makeRng(SEED0);
    let born = 0;
    let turn = 0;
    let fresh = [];
    let borders = 0;
    function colonyDeep(c) { return mix(PAL[c % PAL.length], INK, 0.35); }
    function colonyLight(c) { return mix(PAL[c % PAL.length], PAPER, 0.55); }
    function claim(i, c) {
        owner[i] = c;
        const x0 = (i % COLS) * CELL;
        const y0 = Math.floor(i / COLS) * CELL;
        // 태어난 순서로 색을 옅게 — 먼저 난 가운데는 짙고 늦게 난 가장자리는 밝다
        actx.fillStyle = rgba(mix(colonyDeep(c), colonyLight(c), (AGE_FADE * born) / TOTAL), 1);
        actx.fillRect(x0, y0, CELL, CELL);
        born += 1;
        fresh.push(i);
        const col = i % COLS;
        const row = Math.floor(i / COLS);
        const nb = [col > 0 ? i - 1 : -1, col < COLS - 1 ? i + 1 : -1, row > 0 ? i - COLS : -1, row < ROWS - 1 ? i + COLS : -1];
        for (let k = 0; k < 4; k += 1) {
            const j = nb[k];
            if (j < 0) {
                continue;
            }
            if (owner[j] < 0) {
                if (!(inFront[j] & (1 << c))) {
                    inFront[j] |= 1 << c;
                    fronts[c].push(j);
                }
            }
            else if (owner[j] !== c) {
                // 다른 군락과 맞닿은 변 — 짙은 선으로 경계를 긋는다
                borders += 1;
                actx.fillStyle = rgba(INK, 0.7);
                if (k === 0) {
                    actx.fillRect(x0, y0, 1, CELL);
                }
                else if (k === 1) {
                    actx.fillRect(x0 + CELL - 1, y0, 1, CELL);
                }
                else if (k === 2) {
                    actx.fillRect(x0, y0, CELL, 1);
                }
                else {
                    actx.fillRect(x0, y0 + CELL - 1, CELL, 1);
                }
            }
        }
    }
    function plant(s) {
        clearArt(INK);
        lrng = makeRng(s);
        owner.fill(-1);
        inFront.fill(0);
        fronts = [];
        born = 0;
        turn = 0;
        fresh = [];
        borders = 0;
        for (let c = 0; c < COLONY_COUNT; c += 1) {
            fronts.push([]);
            let i = Math.floor(lrng() * TOTAL);
            while (owner[i] >= 0) {
                i = (i + 1) % TOTAL;
            }
            claim(i, c);
        }
    }
    function grow() {
        fresh = [];
        let made = 0;
        let idle = 0;
        while (made < CELLS_PER_FRAME && idle < COLONY_COUNT) {
            const c = turn;
            turn = (turn + 1) % COLONY_COUNT;
            const f = fronts[c];
            if (!f.length) {
                idle += 1;
                continue;
            }
            idle = 0;
            // 가장자리 목록에서 하나를 무작위로 꺼낸다(맨 끝 칸과 자리를 바꿔 빼서 목록을 당기지 않는다)
            const k = Math.floor(lrng() * f.length);
            const i = f[k];
            f[k] = f[f.length - 1];
            f.pop();
            inFront[i] &= ~(1 << c);
            if (owner[i] < 0) {
                claim(i, c);
                made += 1;
            }
        }
        return idle >= COLONY_COUNT;
    }
    function paintFrame() {
        blitArt();
        // 이번 틱에 붙은 칸 — 밝게 반짝
        ctx.fillStyle = rgba(PAPER, 0.85);
        for (let k = 0; k < fresh.length; k += 1) {
            const i = fresh[k];
            ctx.fillRect((i % COLS) * CELL + 0.5, Math.floor(i / COLS) * CELL + 0.5, CELL - 1, CELL - 1);
        }
    }
    function statPairs() {
        return [['埋めたマス', born + ' / ' + TOTAL], ['境目', String(borders)]];
    }
    function runText() { return TXT_RUN; }
    function doneText() { return TXT_DONE; }
    const TXT_DONE = '育ち終わり — Enterで新しいシード';
    const TXT_PAUSE = '一時停止 — Spaceで再開';
    // 시연 — 첫 200ms 는 빈 판으로 두고(첫 변화 200ms 뒤) 자라게 한 뒤, 다 자라면 900ms 머물고 다음 씨앗으로
    const DEMO_LEAD = 200;
    const DEMO_HOLD_MS = 900;
    // 동작 줄이기에서 한 번에 끝까지 키울 때 틱 수 상한 — 계산이 끝나지 않는 씨앗이 있어도 화면이 멈추지 않게
    const GROW_GUARD = 6000;
    let paused = false;
    let done = false;
    let holdMs = 0;
    let clock = 0;
    function reseed(s) {
        seed = s;
        age = 0;
        done = false;
        holdMs = 0;
        plant(s);
    }
    function tickGrow() {
        if (done) {
            return;
        }
        age += FIXED_DT;
        if (grow()) {
            done = true;
        }
    }
    // 끝까지 한 번에 — 동작 줄이기에서는 자라는 과정 없이 다 자란 그림을 바로 보인다
    function finishNow() {
        let g = 0;
        while (!done && g < GROW_GUARD) {
            tickGrow();
            g += 1;
        }
    }
    function report() {
        if (paused) {
            say(TXT_PAUSE);
        }
        else if (done) {
            say(doneText());
        }
        else {
            say(runText());
        }
    }
    function render() {
        paintFrame();
        const pairs = [['シード', String(seed)]];
        drawStats(pairs.concat(statPairs()));
        report();
    }
    function setPaused(v) {
        paused = v;
        if (pauseBtn) {
            pauseBtn.setAttribute('aria-pressed', v ? 'true' : 'false');
        }
    }
    // 입력 한 번 뒤 — 동작 줄이기면 그 씨앗의 다 자란 모습으로 바로 그린다
    function after() {
        if (still) {
            finishNow();
        }
        render();
    }
    function newSeed() { setPaused(false); reseed(nextSeed(seed)); }
    function replaySeed() { setPaused(false); reseed(seed); }
    cv.addEventListener('pointerdown', function () { wake(); after(); });
    cv.addEventListener('keydown', function (ev) {
        const k = ev.key;
        if (k === 'Enter') {
            newSeed();
        }
        else if (k === 'r' || k === 'R') {
            replaySeed();
        }
        else if (k === ' ') {
            setPaused(!paused);
        }
        else {
            return;
        }
        ev.preventDefault();
        wake();
        after();
    });
    if (redrawBtn) {
        redrawBtn.addEventListener('click', function () { wake(); newSeed(); after(); });
    }
    if (replayBtn) {
        replayBtn.addEventListener('click', function () { wake(); replaySeed(); after(); });
    }
    if (pauseBtn) {
        pauseBtn.addEventListener('click', function () { wake(); setPaused(!paused); after(); });
    }
    function onResize() {
        fitCanvas();
        render();
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    reseed(SEED0);
    function tick() {
        clock += FIXED_DT;
        if (demo) {
            if (clock < DEMO_LEAD) {
                return;
            }
            if (done) {
                holdMs += FIXED_DT;
                if (holdMs >= DEMO_HOLD_MS) {
                    reseed(nextSeed(seed));
                }
                return;
            }
        }
        if (!paused) {
            tickGrow();
        }
    }
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    function frame(ts) {
        if (still) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 한 프레임에 성장 계산이 몰리지 않게
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            tick();
            acc -= FIXED_DT;
            n += 1;
        }
        render();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        lastTs = -1;
        acc = 0;
        rafId = window.requestAnimationFrame(frame);
    }
    // 동작 줄이기 설정이 페이지를 연 채 바뀌면 — 켜지면 루프를 멈추고 다 자란 그림으로, 꺼지면 루프를 다시 돈다
    function onMotionPref() {
        still = reduceQuery.matches;
        if (still) {
            if (rafId) {
                window.cancelAnimationFrame(rafId);
                rafId = 0;
            }
            after();
        }
        else {
            startLoop();
        }
    }
    if (typeof reduceQuery.addEventListener === 'function') {
        reduceQuery.addEventListener('change', onMotionPref);
    }
    if (still) {
        after();
    }
    else {
        render();
        startLoop();
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
        if (typeof reduceQuery.removeEventListener === 'function') {
            reduceQuery.removeEventListener('change', onMotionPref);
        }
    };
})();
</script>
</body>
</html>
