<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포인터로 당기면 모서리부터 말리는 페이지 컬 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vd is-demo" id="vdRoot">
  <canvas class="vd__canvas" id="vdCanvas" width="480" height="300"></canvas>
  <p class="vd__caption">포인터로 당기면 모서리부터 말리는 페이지 컬</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('vdRoot');
  var canvas = document.getElementById('vdCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  var LW = 320, LH = 200;
  var PAGE_L = 46, PAGE_T = 22, PAGE_R = 274, PAGE_B = 176;
  var CURL_RADIUS_PX = 60;
  var STRIP_W = 4;
  var SCENE_BG = '#17141a';
  var PAPER = '#fff7e6';
  var PAPER_BACK = '#caa96b';
  var HANDLE_COLOR = '#ffd23f';

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var rand = seedRand(41301);

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function shadeHex(hex, f) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    r = clamp(Math.round(r * f), 0, 255); g = clamp(Math.round(g * f), 0, 255); b = clamp(Math.round(b * f), 0, 255);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  var rest = { x: PAGE_R, y: PAGE_B };
  var pulled = { x: PAGE_L + 60, y: PAGE_T + 26 };
  var drag = { x: rest.x, y: rest.y };
  var target = { x: rest.x, y: rest.y };

  var pointerActive = false;
  var keys = { left: false, right: false, up: false, down: false };
  var CYCLE_MS = 1050;
  function autoplay(tMs) {
    if (pointerActive || reduce) return;
    var p = (tMs % CYCLE_MS) / CYCLE_MS;
    var w = p < 0.5 ? p * 2 : (1 - p) * 2;              // 삼각파 0→1→0, 2초 창에 2회 왕복
    target.x = rest.x + (pulled.x - rest.x) * w;
    target.y = rest.y + (pulled.y - rest.y) * w;
  }

  function dragStep(dt) {
    var k = 1 - Math.pow(1 - 0.22, dt * 60);
    drag.x += (target.x - drag.x) * k;
    drag.y += (target.y - drag.y) * k;
  }

  function keyStep(dt) {
    var v = 90 * dt;
    if (keys.left) target.x -= v;
    if (keys.right) target.x += v;
    if (keys.up) target.y -= v;
    if (keys.down) target.y += v;
    target.x = clamp(target.x, PAGE_L, PAGE_R);
    target.y = clamp(target.y, PAGE_T, PAGE_B);
  }

  function foldTheta(dx) { return dx / CURL_RADIUS_PX; }

  function curlPage() {
    var foldX = clamp(drag.x, PAGE_L, PAGE_R);
    var skew = (drag.y - PAGE_B) / (PAGE_B - PAGE_T);   // 위로 당길수록 음수 — 컬 축의 기울기
    var h = PAGE_B - PAGE_T;
    ctx.fillStyle = PAPER;
    ctx.fillRect(PAGE_L, PAGE_T, Math.max(0, foldX - PAGE_L), h);

    var maxDx = Math.max(1, PAGE_R - foldX);
    for (var x = foldX; x <= PAGE_R + STRIP_W; x += STRIP_W) {
      var dx = Math.min(x - foldX, maxDx);
      var theta = foldTheta(dx);
      if (theta > Math.PI + 0.15) continue;
      var sxp = foldX + Math.sin(Math.min(theta, Math.PI)) * CURL_RADIUS_PX;
      var front = Math.cos(theta) > 0;
      var lift = (dx / maxDx) * skew * 30;
      ctx.fillStyle = front ? shadeHex(PAPER, 0.86 + 0.14 * Math.cos(theta)) : shadeHex(PAPER_BACK, 0.5 + 0.3 * (-Math.cos(theta)));
      ctx.fillRect(sxp, PAGE_T + lift, STRIP_W + 1, h);
    }
    var depth = clamp(maxDx / CURL_RADIUS_PX, 0, 1.6);
    if (depth > 0.02) {
      var g = ctx.createLinearGradient(foldX - 26, 0, foldX + 6, 0);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,' + clamp(0.1 + depth * 0.24, 0, 0.42) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(foldX - 26, PAGE_T, 32, h);
    }
  }

  function draw() {
    ctx.fillStyle = SCENE_BG;
    ctx.fillRect(0, 0, LW, LH);
    ctx.fillStyle = 'rgba(0,0,0,.32)';
    ctx.fillRect(PAGE_L - 6, PAGE_B + 3, PAGE_R - PAGE_L + 14, 6);
    curlPage();
    ctx.fillStyle = 'rgba(255,209,63,.9)';
    ctx.beginPath(); ctx.arc(drag.x, drag.y, 4, 0, Math.PI * 2); ctx.fill();
  }

  function update(dt, tMs) {
    autoplay(tMs);
    keyStep(dt);
    dragStep(dt);
  }

  var cw = 480, ch = 300, sx = 1, sy = 1;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    sx = cw / LW; sy = ch / LH;
    render();
  }
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.save();
    ctx.scale(sx, sy);
    draw();
    ctx.restore();
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var playing = !reduce;
  if (reduce) {
    root.classList.remove('is-demo');
    drag.x = pulled.x; drag.y = pulled.y; target.x = pulled.x; target.y = pulled.y;
  }

  function calcFromEvent(e) {
    var r = wrap.getBoundingClientRect();
    var t0 = (e.touches && e.touches[0]) ? e.touches[0] : e;
    var relX = (t0.clientX - r.left) / r.width * LW;
    var relY = (t0.clientY - r.top) / r.height * LH;
    target.x = clamp(relX, PAGE_L, PAGE_R);
    target.y = clamp(relY, PAGE_T, PAGE_B);
  }
  wrap.addEventListener('pointerdown', function (e) { pointerActive = true; calcFromEvent(e); if (reduce) { dragStep(1); render(); } });
  wrap.addEventListener('pointermove', function (e) { if (!pointerActive) return; calcFromEvent(e); if (reduce) { dragStep(1); render(); } });
  window.addEventListener('pointerup', function () { pointerActive = false; });
  wrap.addEventListener('pointerleave', function () { pointerActive = false; });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') keys.left = true;
    else if (e.key === 'ArrowRight') keys.right = true;
    else if (e.key === 'ArrowUp') keys.up = true;
    else if (e.key === 'ArrowDown') keys.down = true;
    else return;
    pointerActive = true;
    if (reduce) { keyStep(0.05); dragStep(1); render(); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft') keys.left = false;
    else if (e.key === 'ArrowRight') keys.right = false;
    else if (e.key === 'ArrowUp') keys.up = false;
    else if (e.key === 'ArrowDown') keys.down = false;
    if (!keys.left && !keys.right && !keys.up && !keys.down) pointerActive = false;
  });

  var lastTs = null;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    if (playing) update(dt, ts);
    render();
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  render();
  if (playing) requestAnimationFrame(tick);
})();
</script>
</body>
</html>
