<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Page-turn Hero Scene Gathering the Above on One Desk — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vd is-demo" id="vdRoot">
  <canvas class="vd__canvas" id="vdCanvas" width="480" height="300"></canvas>
  <p class="vd__caption">A Page-turn Hero Scene Gathering the Above on One Desk</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('vdRoot');
  var canvas = document.getElementById('vdCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  var LW = 320, LH = 200;
  var SCENE_BG = '#17141a';
  var PAPER = '#fff7e6';
  var PAPER_BACK = '#caa96b';
  var COMPOSITE_VALUE_MIN = 0, COMPOSITE_VALUE_MAX = 1;
  var CURL_RADIUS_MAX_PX = 46;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var rand = seedRand(41309);
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function shadeHex(hex, f) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    r = clamp(Math.round(r * f), 0, 255); g = clamp(Math.round(g * f), 0, 255); b = clamp(Math.round(b * f), 0, 255);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  var compositeValue = 0.35, targetValue = 0.35;
  var pointerActive = false;
  var keys = { left: false, right: false };
  var CYCLE_MS = 1000;
  function autoplay(tMs) {
    if (pointerActive || reduce) return;
    var p = (tMs % CYCLE_MS) / CYCLE_MS;
    var w = p < 0.5 ? p * 2 : (1 - p) * 2;
    targetValue = COMPOSITE_VALUE_MIN + (COMPOSITE_VALUE_MAX - COMPOSITE_VALUE_MIN) * w;
  }
  function valueStep(dt) {
    var k = 1 - Math.pow(1 - 0.22, dt * 60);
    compositeValue += (targetValue - compositeValue) * k;
    if (keys.left) targetValue -= 0.6 * dt;
    if (keys.right) targetValue += 0.6 * dt;
    targetValue = clamp(targetValue, COMPOSITE_VALUE_MIN, COMPOSITE_VALUE_MAX);
  }

  // --- 왼쪽: 펼친 책 (거터 벤드는 값에 비례) ---
  var BOOK_CX = 76, BOOK_TOP = 118, BOOK_BOT = 190, BOOK_HALF = 58;
  function gutterBend(t) { return t * 0.85; }
  function drawBookSide(sign, t) {
    var bend = gutterBend(t);
    var c = Math.cos(bend * sign * 0.001 + bend);
    ctx.save();
    ctx.translate(BOOK_CX, 0);
    ctx.transform(sign * Math.max(0.18, Math.cos(bend)), 0, Math.sin(bend) * 0.22, 1, 0, 0);
    var bright = 0.55 + 0.45 * Math.cos(bend);
    ctx.fillStyle = shadeHex(PAPER, bright);
    ctx.fillRect(0, BOOK_TOP, BOOK_HALF, BOOK_BOT - BOOK_TOP);
    ctx.restore();
  }
  function drawBook(t) {
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.fillRect(BOOK_CX - BOOK_HALF - 4, BOOK_BOT + 2, BOOK_HALF * 2 + 8, 5);
    drawBookSide(-1, t);
    drawBookSide(1, t);
  }

  // --- 가운데: 낱장 컬 (반지름이 값에 비례) ---
  var CURL_CX = 204, CURL_TOP = 108, CURL_BOT = 190, CURL_W = 70;
  function curlPage(t) {
    var radius = 6 + t * CURL_RADIUS_MAX_PX;
    var stripCount = 14;
    for (var i = 0; i < stripCount; i += 1) {
      var u = i / stripCount;
      var localX = u * CURL_W;
      var theta = Math.max(0, localX - (CURL_W - radius * 2.4)) / Math.max(1, radius);
      theta = clamp(theta, 0, Math.PI);
      var sx = CURL_CX + CURL_W - CURL_W * (1 - u) - Math.min(localX, CURL_W - radius * 2.4);
      var screenX = CURL_CX + (CURL_W - radius * 2.4) * u * 0 + localX - (1 - Math.cos(theta)) * radius;
      var front = Math.cos(theta) >= 0;
      var bright = front ? (0.6 + 0.4 * Math.cos(theta)) : (0.32 + 0.18 * (-Math.cos(theta)));
      ctx.fillStyle = front ? shadeHex(PAPER, bright) : shadeHex(PAPER_BACK, bright);
      var stripX = CURL_CX + localX - (localX > (CURL_W - radius * 2.4) ? (1 - Math.cos(theta)) * radius : 0);
      ctx.fillRect(stripX, CURL_TOP, CURL_W / stripCount + 1, CURL_BOT - CURL_TOP);
    }
  }
  function drawCurl(t) {
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.fillRect(CURL_CX - 4, CURL_BOT + 2, CURL_W + 8, 5);
    curlPage(t);
  }

  // --- 오른쪽 상단: 종이비행기 (드리프트 폭이 값에 비례) ---
  var LAUNCH = { x: 214, y: 40 };
  var LAND = { x: 300, y: 78 };
  function planePos(phase, t) {
    var amp = 4 + t * 22;
    var x = lerp(LAUNCH.x, LAND.x, phase) + Math.sin(phase * Math.PI * 2 * 2) * amp;
    var y = lerp(LAUNCH.y, LAND.y, phase) - 18 * 4 * phase * (1 - phase);
    return { x: x, y: y };
  }
  var planePhase = 0;
  function drawPlane(t) {
    var p0 = planePos(planePhase, t);
    var p1 = planePos(Math.min(1, planePhase + 0.01), t);
    var angle = Math.atan2(p1.y - p0.y, p1.x - p0.x);
    ctx.save();
    ctx.translate(p0.x, p0.y);
    ctx.rotate(angle);
    ctx.fillStyle = PAPER;
    ctx.beginPath();
    ctx.moveTo(11, 0); ctx.lineTo(-8, -6); ctx.lineTo(-3, 0); ctx.lineTo(-8, 6);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.fillStyle = SCENE_BG;
    ctx.fillRect(0, 0, LW, LH);
    ctx.fillStyle = 'rgba(255,247,230,.06)';
    ctx.fillRect(0, 96, LW, 4);
    drawBook(compositeValue);
    drawCurl(compositeValue);
    drawPlane(compositeValue);

    ctx.fillStyle = 'rgba(255,247,230,.85)';
    ctx.font = '11px sans-serif';
    ctx.fillText('value ' + compositeValue.toFixed(2), 12, 18);
    ctx.strokeStyle = 'rgba(255,209,63,.65)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(12, 26); ctx.lineTo(12 + compositeValue * 90, 26);
    ctx.stroke();
  }

  function update(dt, tMs) {
    autoplay(tMs);
    valueStep(dt);
    if (!reduce) planePhase = (tMs % 900) / 900;
  }

  var cw = 480, ch = 300, sx = 1, sy = 1;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    sx = cw / LW; sy = ch / LH;
    render();
  }
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.save();
    ctx.scale(sx, sy);
    draw();
    ctx.restore();
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var playing = !reduce;
  if (reduce) { root.classList.remove('is-demo'); compositeValue = 0.55; targetValue = 0.55; planePhase = 0.4; }

  function calcFromEvent(e) {
    var r = wrap.getBoundingClientRect();
    var t0 = (e.touches && e.touches[0]) ? e.touches[0] : e;
    var relX = (t0.clientX - r.left) / r.width;
    targetValue = clamp(relX, COMPOSITE_VALUE_MIN, COMPOSITE_VALUE_MAX);
  }
  wrap.addEventListener('pointerdown', function (e) { pointerActive = true; calcFromEvent(e); if (reduce) { valueStep(1); render(); } });
  wrap.addEventListener('pointermove', function (e) { if (!pointerActive) return; calcFromEvent(e); if (reduce) { valueStep(1); render(); } });
  window.addEventListener('pointerup', function () { pointerActive = false; });
  wrap.addEventListener('pointerleave', function () { pointerActive = false; });

  wrap.setAttribute('tabindex', '0');
  wrap.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') keys.left = true;
    else if (e.key === 'ArrowRight') keys.right = true;
    else return;
    pointerActive = true;
    if (reduce) { valueStep(0.05); render(); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft') keys.left = false;
    else if (e.key === 'ArrowRight') keys.right = false;
    if (!keys.left && !keys.right) pointerActive = false;
  });

  var lastTs = null;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    if (playing) update(dt, ts);
    render();
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  render();
  if (playing) requestAnimationFrame(tick);
})();
</script>
</body>
</html>
