<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금액 콤마 자동 입력 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="field is-demo" id="field">
    <label class="field__label" for="amount-input">후원 금액</label>
    <div class="field__frame">
      <span class="field__prefix" aria-hidden="true">₩</span>
      <input class="field__input" id="amount-input" type="text" inputmode="numeric" placeholder="0" aria-describedby="amount-hint">
    </div>
    <p class="field__hint" id="amount-hint">숫자만 입력하면 천 단위 콤마가 자동으로 붙습니다</p>
  </div>
</main>
<script>
(function () {
  var field = document.getElementById('field');
  var input = document.getElementById('amount-input');

  function format(v) {
    var d = v.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 12);
    return d ? Number(d).toLocaleString('ko-KR') : '';
  }

  input.addEventListener('input', function () {
    input.value = format(input.value);
  });

  function stopDemo() {
    if (!field.classList.contains('is-demo')) return;
    field.classList.remove('is-demo');
    clearInterval(timer);
    input.value = '';
  }
  input.addEventListener('pointerdown', stopDemo);
  input.addEventListener('keydown', stopDemo);

  var digits = '1500000';
  var i = 0;
  var timer = setInterval(function () {
    if (i > digits.length) { i = 0; input.value = ''; return; }
    input.value = format(digits.slice(0, i));
    i++;
  }, 190);
})();
</script>
</body>
</html>
