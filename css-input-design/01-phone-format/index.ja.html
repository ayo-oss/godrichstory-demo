<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電話番号 자동 하이픈 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="field is-demo" id="field">
    <label class="field__label" for="phone-input">電話番号</label>
    <input class="field__input" id="phone-input" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="010-0000-0000" aria-describedby="phone-hint" maxlength="13">
    <p class="field__hint" id="phone-hint">数字だけ入力してもハイフンが自動的に入ります</p>
  </div>
</main>
<script>
(function () {
  var field = document.getElementById('field');
  var input = document.getElementById('phone-input');

  function format(digits) {
    digits = digits.replace(/\D/g, '').slice(0, 11);
    if (digits.length < 4) return digits;
    if (digits.length < 8) return digits.slice(0, 3) + '-' + digits.slice(3);
    return digits.slice(0, 3) + '-' + digits.slice(3, 7) + '-' + digits.slice(7);
  }

  input.addEventListener('input', function () {
    input.value = format(input.value);
  });

  function stopDemo() {
    if (!field.classList.contains('is-demo')) return;
    field.classList.remove('is-demo');
    clearInterval(timer);
    input.value = '';
  }
  input.addEventListener('pointerdown', stopDemo);
  input.addEventListener('keydown', stopDemo);

  var digits = '01012345678';
  var i = 0;
  var timer = setInterval(function () {
    if (i > digits.length) { i = 0; input.value = ''; return; }
    input.value = format(digits.slice(0, i));
    i++;
  }, 160);
})();
</script>
</body>
</html>
