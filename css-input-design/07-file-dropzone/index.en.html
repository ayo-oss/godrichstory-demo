<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파일 드래그 앤 드롭 업로드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="drop is-demo" id="drop">
    <label class="drop__zone" for="file-input" id="zone">
      <span class="drop__icon" aria-hidden="true">⬆</span>
      <span class="drop__text">Drag a file here or click to browse</span>
      <input class="drop__input" type="file" id="file-input">
    </label>
    <p class="drop__file" id="filename" aria-live="polite"></p>
  </div>
</main>
<script>
(function () {
  var wrap = document.getElementById('drop');
  var zone = document.getElementById('zone');
  var input = document.getElementById('file-input');
  var filename = document.getElementById('filename');

  ['dragenter', 'dragover'].forEach(function (ev) {
    zone.addEventListener(ev, function (e) { e.preventDefault(); stopDemo(); zone.classList.add('is-over'); });
  });
  ['dragleave', 'dragend'].forEach(function (ev) {
    zone.addEventListener(ev, function () { zone.classList.remove('is-over'); });
  });
  zone.addEventListener('drop', function (e) {
    e.preventDefault(); stopDemo();
    zone.classList.remove('is-over');
    var f = e.dataTransfer && e.dataTransfer.files[0];
    if (f) show(f.name);
  });
  input.addEventListener('change', function () {
    stopDemo();
    if (input.files[0]) show(input.files[0].name);
  });
  input.addEventListener('pointerdown', stopDemo);

  function show(name) { filename.textContent = 'Selected: ' + name; }

  function stopDemo() {
    if (!wrap.classList.contains('is-demo')) return;
    wrap.classList.remove('is-demo');
    clearInterval(timer);
    zone.classList.remove('is-over');
    filename.textContent = '';
  }

  var phase = 0;
  var timer = setInterval(function () {
    phase = (phase + 1) % 6;
    if (phase === 1) { zone.classList.add('is-over'); filename.textContent = ''; }
    else if (phase === 3) { zone.classList.remove('is-over'); show('design-draft.png'); }
    else if (phase === 5) { filename.textContent = ''; }
  }, 320);
})();
</script>
</body>
</html>
