<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 인풋 검증 표시 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="valid is-demo" id="wrap">
    <label class="valid__label" for="email-input">メールアドレス</label>
    <div class="valid__frame" id="frame">
      <input class="valid__input" id="email-input" type="email" placeholder="you@example.com" aria-describedby="email-msg">
      <span class="valid__icon" id="icon" aria-hidden="true"></span>
    </div>
    <p class="valid__msg" id="email-msg" role="status"></p>
  </div>
</main>
<script>
(function () {
  var wrap = document.getElementById('wrap');
  var frame = document.getElementById('frame');
  var input = document.getElementById('email-input');
  var icon = document.getElementById('icon');
  var msg = document.getElementById('email-msg');
  var RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function check(v) {
    frame.classList.remove('is-ok', 'is-bad');
    if (!v) { icon.textContent = ''; msg.textContent = ''; return; }
    if (RE.test(v)) {
      frame.classList.add('is-ok'); icon.textContent = '✓'; msg.textContent = '';
    } else {
      frame.classList.add('is-bad'); icon.textContent = '!'; msg.textContent = 'メールアドレスの形式を確認してください';
    }
  }

  input.addEventListener('input', function () { check(input.value); });
  input.addEventListener('pointerdown', stopDemo);
  input.addEventListener('keydown', stopDemo);

  function stopDemo() {
    if (!wrap.classList.contains('is-demo')) return;
    wrap.classList.remove('is-demo');
    clearInterval(timer);
    input.value = ''; check('');
  }

  var script = ['g', 'go', 'god', 'godrich', 'godrich@', 'godrich@mail', 'godrich@mail.com'];
  var i = 0;
  var timer = setInterval(function () {
    if (i >= script.length) { i = 0; input.value = ''; check(''); return; }
    input.value = script[i]; check(script[i]); i++;
  }, 260);
})();
</script>
</body>
</html>
