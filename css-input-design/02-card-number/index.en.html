<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card number 4자리 자동 포맷 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="field is-demo" id="field">
    <div class="field__top">
      <label class="field__label" for="card-input">Card number</label>
      <span class="field__brand" id="brand" aria-hidden="true"></span>
    </div>
    <input class="field__input" id="card-input" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" maxlength="19">
  </div>
</main>
<script>
(function () {
  var field = document.getElementById('field');
  var input = document.getElementById('card-input');
  var brand = document.getElementById('brand');

  function brandOf(d) {
    if (d[0] === '4') return 'VISA';
    if (/^5[1-5]/.test(d)) return 'Mastercard';
    if (/^3[47]/.test(d)) return 'AMEX';
    return '';
  }

  function format(v) {
    var d = v.replace(/\D/g, '').slice(0, 16);
    var groups = d.match(/.{1,4}/g) || [];
    brand.textContent = brandOf(d);
    return groups.join(' ');
  }

  input.addEventListener('input', function () {
    input.value = format(input.value);
  });

  function stopDemo() {
    if (!field.classList.contains('is-demo')) return;
    field.classList.remove('is-demo');
    clearInterval(timer);
    input.value = ''; brand.textContent = '';
  }
  input.addEventListener('pointerdown', stopDemo);
  input.addEventListener('keydown', stopDemo);

  var digits = '4539148803436467';
  var i = 0;
  var timer = setInterval(function () {
    if (i > digits.length) { i = 0; input.value = ''; brand.textContent = ''; return; }
    input.value = format(digits.slice(0, i));
    i++;
  }, 110);
})();
</script>
</body>
</html>
