<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인증번호 Resend 타이머 버튼 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="otp is-demo" id="otp">
    <label class="otp__label" for="otp-input">6-digit verification code</label>
    <div class="otp__row">
      <input class="otp__input" id="otp-input" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
      <button class="otp__resend" id="resend" type="button">Resend</button>
    </div>
    <p class="otp__status" id="status" aria-live="polite"></p>
  </div>
</main>
<script>
(function () {
  var wrap = document.getElementById('otp');
  var input = document.getElementById('otp-input');
  var btn = document.getElementById('resend');
  var status = document.getElementById('status');
  var tickTimer = null;

  function cooldown(seconds, tickMs, onDone) {
    clearInterval(tickTimer);
    var left = seconds;
    btn.disabled = true;
    btn.textContent = left + 's until resend';
    status.textContent = 'We sent a new code';
    tickTimer = setInterval(function () {
      left--;
      if (left <= 0) {
        clearInterval(tickTimer);
        btn.disabled = false;
        btn.textContent = 'Resend';
        if (onDone) onDone();
      } else {
        btn.textContent = left + 's until resend';
      }
    }, tickMs);
  }

  function demoLoop() {
    if (!wrap.classList.contains('is-demo')) return;
    cooldown(8, 190, function () { setTimeout(demoLoop, 260); });
  }

  btn.addEventListener('click', function () {
    stopDemo();
    cooldown(60, 1000);
  });
  input.addEventListener('pointerdown', stopDemo);

  function stopDemo() {
    if (!wrap.classList.contains('is-demo')) return;
    wrap.classList.remove('is-demo');
    clearInterval(tickTimer);
    btn.disabled = false;
    btn.textContent = 'Resend';
    status.textContent = '';
  }

  demoLoop();
})();
</script>
</body>
</html>
