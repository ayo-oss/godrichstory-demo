<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동 늘어나는 textarea — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="grow is-demo" id="wrap">
    <label class="grow__label" for="review">レビュー作成</label>
    <textarea class="grow__area" id="review" rows="1" placeholder="この商品を使った感想を教えてください"></textarea>
  </div>
</main>
<script>
(function () {
  var wrap = document.getElementById('wrap');
  var area = document.getElementById('review');
  var MAX = 132;

  function resize() {
    area.style.height = 'auto';
    area.style.height = Math.min(area.scrollHeight, MAX) + 'px';
  }
  area.addEventListener('input', resize);

  function stopDemo() {
    if (!wrap.classList.contains('is-demo')) return;
    wrap.classList.remove('is-demo');
    clearInterval(timer);
  }
  area.addEventListener('pointerdown', stopDemo);
  area.addEventListener('keydown', stopDemo);

  var full = '配送が早く、梱包も丁寧でした。\\n色味は写真とほとんど同じです。\\nまた注文します、ありがとうございました！';
  var i = 0;
  var timer = setInterval(function () {
    if (i > full.length) { i = 0; area.value = ''; resize(); return; }
    area.value = full.slice(0, i);
    resize();
    i += 2;
  }, 90);
})();
</script>
</body>
</html>
