<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수량 +/- 스테퍼 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="stepper is-demo" id="stepper" role="group" aria-label="수량 선택">
    <button class="stepper__btn" id="minus" type="button" aria-label="수량 줄이기">−</button>
    <input class="stepper__value" id="value" type="text" inputmode="numeric" pattern="[0-9]*" value="1" aria-label="수량">
    <button class="stepper__btn" id="plus" type="button" aria-label="수량 늘리기">+</button>
  </div>
  <span id="announce" class="sr-only" aria-live="polite"></span>
</main>
<script>
(function () {
  var wrap = document.getElementById('stepper');
  var minus = document.getElementById('minus');
  var plus = document.getElementById('plus');
  var value = document.getElementById('value');
  var announce = document.getElementById('announce');
  var MIN = 1, MAX = 99;
  var n = 1;

  function render() {
    value.value = n;
    minus.disabled = n <= MIN;
    plus.disabled = n >= MAX;
    announce.textContent = '수량 ' + n + '개';
  }
  function set(v) { n = Math.min(MAX, Math.max(MIN, v)); render(); }

  minus.addEventListener('click', function () { stopDemo(); set(n - 1); });
  plus.addEventListener('click', function () { stopDemo(); set(n + 1); });
  value.addEventListener('change', function () { stopDemo(); set(parseInt(value.value, 10) || MIN); });
  value.addEventListener('pointerdown', stopDemo);

  function stopDemo() {
    if (!wrap.classList.contains('is-demo')) return;
    wrap.classList.remove('is-demo');
    clearInterval(timer);
  }

  var dir = 1;
  var timer = setInterval(function () {
    if (n >= 6) dir = -1;
    if (n <= 1) dir = 1;
    set(n + dir);
  }, 260);
  render();
})();
</script>
</body>
</html>
