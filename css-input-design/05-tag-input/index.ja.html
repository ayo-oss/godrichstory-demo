<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>태그 입력창 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="tags is-demo" id="wrap">
    <label class="tags__label" for="tag-input">キーワード</label>
    <ul class="tags__list" id="list" aria-label="追加されたタグ"></ul>
    <input class="tags__input" id="tag-input" type="text" placeholder="入力してEnter" aria-describedby="tag-hint">
    <p class="tags__hint" id="tag-hint">Enterで追加・バックスペースで削除</p>
  </div>
</main>
<script>
(function () {
  var wrap = document.getElementById('wrap');
  var list = document.getElementById('list');
  var input = document.getElementById('tag-input');
  var tags = [];

  function render() {
    list.innerHTML = '';
    tags.forEach(function (t, idx) {
      var li = document.createElement('li');
      li.className = 'tags__chip';
      var span = document.createElement('span');
      span.textContent = t;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tags__remove';
      btn.setAttribute('aria-label', t + ' タグを削除');
      btn.textContent = '×';
      btn.addEventListener('click', function () { stopDemo(); tags.splice(idx, 1); render(); });
      li.appendChild(span); li.appendChild(btn);
      list.appendChild(li);
    });
  }
  function add(t) { t = t.trim(); if (t) { tags.push(t); render(); } }

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault(); stopDemo(); add(input.value); input.value = '';
    } else if (e.key === 'Backspace' && !input.value && tags.length) {
      stopDemo(); tags.pop(); render();
    }
  });
  input.addEventListener('pointerdown', stopDemo);

  function stopDemo() {
    if (!wrap.classList.contains('is-demo')) return;
    wrap.classList.remove('is-demo');
    clearInterval(timer);
  }

  var script = ['デザイン', 'React', 'CSS', 'レスポンシブ'];
  var step = 0, chars = '', paused = false;
  var timer = setInterval(function () {
    if (paused) return;
    var word = script[step];
    if (chars.length < word.length) {
      chars += word[chars.length];
      input.value = chars;
    } else {
      add(chars); input.value = ''; chars = ''; step++;
      if (step >= script.length) {
        paused = true;
        setTimeout(function () { tags = []; step = 0; paused = false; render(); }, 500);
      }
    }
  }, 140);
})();
</script>
</body>
</html>
