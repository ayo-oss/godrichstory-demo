<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レイヤー別減衰パララックス — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dpl is-demo" id="dpl">
  <div class="dpl__viewport" id="dplViewport" role="application" aria-label="レイヤーパララックス実験パネル">
    <div class="dpl__layer dpl__layer--far" id="dplFar"></div>
    <div class="dpl__layer dpl__layer--mid" id="dplMid"></div>
    <div class="dpl__layer dpl__layer--near" id="dplNear"></div>
  </div>
  <p class="dpl__hint">横にドラッグして離すと、レイヤーごとに違う速さで収まります</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('dpl');
  var viewport = document.getElementById('dplViewport');
  var layers = [
    { el: document.getElementById('dplFar'),  speed: 0.35, decay: 0.988, pos: 0, vel: 0 },
    { el: document.getElementById('dplMid'),  speed: 0.65, decay: 0.95,  pos: 0, vel: 0 },
    { el: document.getElementById('dplNear'), speed: 1.0,  decay: 0.88,  pos: 0, vel: 0 }
  ];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 계산 겹: 입력 값(inputVel)에 레이어마다 다른 SPEED 를 곱해 각자의 속도(layer.vel)를 만들고,
  // 입력이 끊기면 레이어마다 다른 DECAY 값으로 각자 감쇠한다 — 감쇠율이 클수록(1에 가까울수록)
  // 더 오래 움직인다. 그래서 손을 떼도 레이어들이 서로 다른 시점에 멈춘다.
  var WRAP = 320;
  var raf = null;

  function clampWrap(v) { var m = v % WRAP; if (m > 0) { m -= WRAP; } return m; }
  function paint() {
    for (var i = 0; i < layers.length; i++) {
      layers[i].el.style.transform = 'translateX(' + layers[i].pos.toFixed(1) + 'px)';
    }
  }
  function stopLoop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
  var inputActive = false;
  function loopTick() {
    var moving = false;
    for (var i = 0; i < layers.length; i++) {
      var L = layers[i];
      if (!inputActive) { L.vel *= L.decay; if (reduce) { L.vel = 0; } }
      L.pos = clampWrap(L.pos + L.vel);
      if (Math.abs(L.vel) > 0.02) { moving = true; }
    }
    paint();
    if (reduce || (!moving && !inputActive)) { raf = null; return; }
    raf = requestAnimationFrame(loopTick);
  }
  function ensureLoop() { if (raf === null) { raf = requestAnimationFrame(loopTick); } }
  function setInput(v) {
    for (var i = 0; i < layers.length; i++) { layers[i].vel = v * layers[i].speed; }
    ensureLoop();
  }

  function wireReal() {
    viewport.addEventListener('wheel', function (e) {
      e.preventDefault();
      root.classList.remove('is-demo'); stopAutoplay();
      inputActive = true;
      setInput(-e.deltaY * 0.5 - e.deltaX * 0.5);
      clearTimeout(viewport._wt);
      viewport._wt = setTimeout(function () { inputActive = false; }, 90);
    }, { passive: false });

    var dragging = false, lastX = 0, lastT = 0;
    viewport.addEventListener('pointerdown', function (e) {
      root.classList.remove('is-demo'); stopAutoplay();
      dragging = true; inputActive = true; lastX = e.clientX; lastT = performance.now();
      viewport.setPointerCapture(e.pointerId);
    });
    viewport.addEventListener('pointermove', function (e) {
      if (!dragging) { return; }
      var t = performance.now();
      var dt = Math.max(1, t - lastT);
      var v = (e.clientX - lastX) / dt * 16.6;
      setInput(v);
      lastX = e.clientX; lastT = t;
    });
    viewport.addEventListener('pointerup', function () {
      if (!dragging) { return; }
      dragging = false; inputActive = false;
      ensureLoop();
    });
  }
  wireReal();
  paint();

  // 자동 루프: 강하게 밀었다가 손을 떼 레이어별 감쇠 경로를 반복 재현한다.
  var autoTimer = null, phase = 0;
  function autoTick() {
    phase += 1;
    var dir = (phase % 2 === 0) ? -1 : 1;
    inputActive = true;
    setInput(dir * 6.5);
    setTimeout(function () { inputActive = false; ensureLoop(); }, 160);
  }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  if (!reduce) { autoTimer = setInterval(autoTick, 1500); autoTick(); }
})();
</script>
</body>
</html>
