<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>낙하 정착 카드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gsc is-demo" id="gsc">
  <div class="gsc__viewport" id="gscViewport" role="application" aria-label="낙하 정착 카드 목록" tabindex="0">
    <div class="gsc__pad-top"></div>
    <div class="gsc__card" data-card>카드 1</div>
    <div class="gsc__spacer"></div>
    <div class="gsc__card" data-card>카드 2</div>
    <div class="gsc__spacer"></div>
    <div class="gsc__card" data-card>카드 3</div>
    <div class="gsc__pad-bottom"></div>
  </div>
  <p class="gsc__hint">스크롤해 카드가 보이면 중력 값으로 떨어지다 바닥에서 튕기며 정착합니다</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('gsc');
  var viewport = document.getElementById('gscViewport');
  var cards = Array.prototype.slice.call(document.querySelectorAll('[data-card]'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 계산 겹: 카드가 뷰포트에 들어오는 순간 위치 값(y)이 START_Y 에서 GRAVITY 가속으로 떨어지다
  // FLOOR_Y(0) 에 닿으면 속도 값에 RESTITUTION 을 곱한 만큼만 되튀어(반동), STOP_VEL 밑이면 멈춘다.
  var START_Y = -40;
  var FLOOR_Y = 0;
  var GRAVITY = 0.85;
  var RESTITUTION = 0.42;
  var STOP_VEL = 0.6;

  function dropTick(card, y, vel) {
    vel += GRAVITY;
    y += vel;
    if (y >= FLOOR_Y) {
      y = FLOOR_Y;
      vel = -vel * RESTITUTION;
      if (Math.abs(vel) < STOP_VEL) {
        card.style.transform = 'translateY(0px)';
        card.dataset.done = '1';
        return;
      }
    }
    card.style.transform = 'translateY(' + y.toFixed(1) + 'px)';
    requestAnimationFrame(function () { dropTick(card, y, vel); });
  }
  function settle(card) {
    if (card.dataset.done) { return; }
    card.style.opacity = '1';
    if (reduce) { card.style.transform = 'translateY(0px)'; card.dataset.done = '1'; return; }
    card.dataset.done = '1';
    dropTick(card, START_Y, 0);
  }

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) { if (en.isIntersecting) { settle(en.target); } });
  }, { root: viewport, threshold: 0.6 });
  cards.forEach(function (c) { io.observe(c); });

  // 프로그램이 scrollTop 을 옮길 때도 네이티브 scroll 이벤트가 뜬다 — 자동 루프 중임을 이 플래그로
  // 표시해 "진짜 사용자 스크롤"과 구분한다(안 하면 자동 루프 첫 걸음에서 곧장 스스로를 멈춘다).
  var autoScrolling = false;

  function wireReal() {
    viewport.addEventListener('scroll', function () {
      if (autoScrolling) { return; }
      root.classList.remove('is-demo'); stopAutoplay();
    }, { passive: true });
    viewport.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') { return; }
      root.classList.remove('is-demo'); stopAutoplay();
      viewport.scrollTop += (e.key === 'ArrowDown' ? 40 : -40);
    });
  }
  wireReal();

  // 자동 루프: 스크롤 값을 아래로 서서히 옮겨 카드마다 진입 시점의 낙하 정착을 반복 재현한다.
  var autoTimer = null, raf2 = null;
  function autoStep() {
    var max = viewport.scrollHeight - viewport.clientHeight;
    var next = viewport.scrollTop + 1.6;
    autoScrolling = true;
    if (next >= max) {
      viewport.scrollTop = max;
      raf2 = null;
      setTimeout(function () { if (root.classList.contains('is-demo')) { cards.forEach(function (c) { delete c.dataset.done; c.style.transform = 'translateY(' + START_Y + 'px)'; c.style.opacity = '0'; }); autoScrolling = true; viewport.scrollTop = 0; } }, 500);
      return;
    }
    viewport.scrollTop = next;
    raf2 = requestAnimationFrame(autoStep);
  }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } if (raf2) { cancelAnimationFrame(raf2); raf2 = null; } }
  if (!reduce) { autoTimer = setInterval(function () { if (raf2 === null) { raf2 = requestAnimationFrame(autoStep); } }, 1800); autoTimer && requestAnimationFrame(autoStep); }
})();
</script>
</body>
</html>
