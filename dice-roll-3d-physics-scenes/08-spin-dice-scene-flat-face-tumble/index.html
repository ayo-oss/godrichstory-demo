<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 계산 없이 면 한 장의 가로 폭을 줄였다 늘리며 눈 수를 바꿔 끼우고 바닥 줄무늬를 한 칸씩 밀어, 평면 주사위가 굴러가는 모습을 키프레임 스타일 규칙으로 만든다. — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bp is-demo" id="bpRoot">
  <div class="fd" aria-hidden="true">
    <div class="fd__floor" id="fdFloor"></div>
    <div class="fd__shadow" id="fdShadow"></div>
    <div class="fd__hop" id="fdHop">
      <div class="fd__squeeze" id="fdSqueeze">
      <div class="fd__die" id="fdDie" data-face="2">
        <div class="fd__face fd__face--1"><i class="pip r2 c2"></i></div>
        <div class="fd__face fd__face--2"><i class="pip r1 c1"></i><i class="pip r3 c3"></i></div>
        <div class="fd__face fd__face--3"><i class="pip r1 c1"></i><i class="pip r2 c2"></i><i class="pip r3 c3"></i></div>
        <div class="fd__face fd__face--4"><i class="pip r1 c1"></i><i class="pip r1 c3"></i><i class="pip r3 c1"></i><i class="pip r3 c3"></i></div>
        <div class="fd__face fd__face--5"><i class="pip r1 c1"></i><i class="pip r1 c3"></i><i class="pip r2 c2"></i><i class="pip r3 c1"></i><i class="pip r3 c3"></i></div>
        <div class="fd__face fd__face--6"><i class="pip r1 c1"></i><i class="pip r2 c1"></i><i class="pip r3 c1"></i><i class="pip r1 c3"></i><i class="pip r2 c3"></i><i class="pip r3 c3"></i></div>
      </div>
      </div>
    </div>
  </div>
  <output class="bp__status" aria-live="polite"><span id="bpLabel">굴리는 중</span> <b id="bpNum"></b></output>
  <button type="button" class="bp__btn" id="bpBtn">굴리기</button>
  <p class="bp__caption">3D 계산 없이 면 한 장의 가로 폭을 줄였다 늘리며 눈 수를 바꿔 끼우고 바닥 줄무늬를 한 칸씩 밀어, 평면 주사위가 굴러가는 모습을 키프레임 스타일 규칙으로 만든다.</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('bpRoot');
  var labelEl = document.getElementById('bpLabel');
  var numEl = document.getElementById('bpNum');
  var btn = document.getElementById('bpBtn');
  var dieEl = document.getElementById('fdDie');
  var floorEl = document.getElementById('fdFloor');
  var hopEl = document.getElementById('fdHop');
  var squeezeEl = document.getElementById('fdSqueeze');
  var shadowEl = document.getElementById('fdShadow');

  var DICE_SEED = 7;
  var HOP_MS = 360;
  var HOP_COUNT = 4;
  var TILE_PX = 128;
  var T_RESULT = '결과';
  var T_ROLLING = '굴리는 중';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var demo = !reduce;
  if (!demo) root.classList.remove('is-demo');
  function stopDemo() { demo = false; root.classList.remove('is-demo'); }
  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var rng = seedRand(DICE_SEED + 8);
  var timers = [];
  var cleaners = [];
  var stLabel = '', stNum = '';
  function setStatus(label, num) {
    if (label === stLabel && num === stNum) return;
    stLabel = label; stNum = num;
    labelEl.textContent = label;
    numEl.textContent = num;
  }
  // 기법: 면 한 장의 가로 폭을 scaleX 로 줄였다 늘리는 동안(납작해지는 순간) 눈 수 레이어를 바꿔 끼운다.
  // 바닥 줄무늬를 한 칸(TILE_PX)씩 밀면 주사위는 제자리에서 튀기고 바닥이 굴러 가는 것처럼 보인다.
  function clearTimers() {
    for (var i = 0; i < timers.length; i += 1) window.clearTimeout(timers[i]);
    timers = [];
  }
  function pickFaces() {
    var seq = [];
    var prev = Number(dieEl.getAttribute('data-face')) || 2;
    for (var k = 0; k < HOP_COUNT; k += 1) {
      var f = 1 + Math.floor(rng() * 6);
      if (f === prev) f = (f % 6) + 1;
      seq.push(f);
      prev = f;
    }
    return seq;
  }
  function onRoll() {
    stopDemo();
    clearTimers();
    var running = [floorEl, hopEl, squeezeEl, shadowEl];
    for (var r = 0; r < running.length; r += 1) {
      var an = running[r].getAnimations();
      for (var q = 0; q < an.length; q += 1) an[q].cancel();
    }
    var seq = pickFaces();
    var last = seq[seq.length - 1];
    if (reduce) {
      dieEl.setAttribute('data-face', String(last));
      setStatus(T_RESULT, String(last));
      return;
    }
    setStatus(T_ROLLING, '');
    var span = HOP_MS * HOP_COUNT;
    floorEl.animate([{ transform: 'translateX(0px)' }, { transform: 'translateX(-' + (TILE_PX * HOP_COUNT) + 'px)' }], { duration: span, easing: 'ease-in-out' });
    hopEl.animate([{ transform: 'translateY(0px)' }, { transform: 'translateY(-28px)', offset: 0.5 }, { transform: 'translateY(0px)' }], { duration: HOP_MS, iterations: HOP_COUNT, easing: 'ease-out' });
    squeezeEl.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0.18)', offset: 0.5 }, { transform: 'scaleX(1)' }], { duration: HOP_MS, iterations: HOP_COUNT, easing: 'ease-in-out' });
    shadowEl.animate([{ transform: 'scale(1)', opacity: 0.5 }, { transform: 'scale(0.6)', opacity: 0.25, offset: 0.5 }, { transform: 'scale(1)', opacity: 0.5 }], { duration: HOP_MS, iterations: HOP_COUNT, easing: 'ease-out' });
    for (var k = 0; k < HOP_COUNT; k += 1) {
      (function (face, at) {
        timers.push(window.setTimeout(function () { dieEl.setAttribute('data-face', String(face)); }, at));
      })(seq[k], Math.round((k + 0.5) * HOP_MS));
    }
    timers.push(window.setTimeout(function () { setStatus(T_RESULT, String(last)); }, span + 20));
  }
  if (reduce) setStatus(T_RESULT, String(Number(dieEl.getAttribute('data-face')) || 2));
  btn.addEventListener('click', onRoll);
  cleaners.push(function () { btn.removeEventListener('click', onRoll); });
  function destroy() {
    clearTimers();
    for (var i = 0; i < cleaners.length; i += 1) cleaners[i]();
  }

})();
</script>
</body>
</html>
