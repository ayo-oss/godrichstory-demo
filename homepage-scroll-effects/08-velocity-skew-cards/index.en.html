<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velocity-skewed list — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="vs is-demo">
    <div class="vs__scroll">
      <div class="vs__row"><span class="vs__thumb vs__thumb--1"></span><span class="vs__t">Scroll down fast</span></div>
      <div class="vs__row"><span class="vs__thumb vs__thumb--2"></span><span class="vs__t">Cards feel the speed</span></div>
      <div class="vs__row"><span class="vs__thumb vs__thumb--3"></span><span class="vs__t">Stop and they settle</span></div>
      <div class="vs__row"><span class="vs__thumb vs__thumb--4"></span><span class="vs__t">Scroll up too</span></div>
    </div>
  </div>
</main>
<script>
// 스크롤 속도를 재서 --vel 변수에 넣는다. 나머지는 CSS 계산(calc)이 한다.
// 미리보기(.is-demo) 중에는 CSS 키프레임이 움직임을 맡는다.
(function () {
  var box = document.querySelector('.vs__scroll');
  var last = box.scrollTop, vel = 0;
  box.addEventListener('scroll', function () {
    document.querySelector('.vs').classList.remove('is-demo');
    vel = Math.max(-24, Math.min(24, box.scrollTop - last));
    last = box.scrollTop;
  });
  (function decay() {
    vel *= 0.86;
    box.style.setProperty('--vel', vel.toFixed(2));
    requestAnimationFrame(decay);
  })();
})();
</script>
</body>
</html>
