<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinned scene swap — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ps">
    <div class="ps__scroll">
      <div class="ps__inner">
        <div class="ps__pin">
          <div class="ps__scene ps__scene--1"><span class="ps__cap">장면 1 · 처음</span></div>
          <div class="ps__scene ps__scene--2 is-demo"><span class="ps__cap">장면 2 · 익숙해질 때</span></div>
          <div class="ps__scene ps__scene--3 is-demo"><span class="ps__cap">장면 3 · 완성</span></div>
          <div class="ps__hint">위아래로 스크롤</div>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작은 scroll-timeline + animation-timeline(장면마다 키프레임 구간)만으로 끝난다(0줄).
// 장면 2·3의 is-demo 클래스는 캡처용 미리보기 루프일 뿐 — 실제 스크롤 반응은 그대로 살아있다.
</script>
</body>
</html>
