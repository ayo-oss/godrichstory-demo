<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacking cards — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sk">
    <div class="sk__scroller">
      <div class="sk__card sk__card--1 is-demo"><span class="sk__step">1</span><span class="sk__label">登録する</span></div>
      <div class="sk__card sk__card--2 is-demo"><span class="sk__step">2</span><span class="sk__label">プロフィールを埋める</span></div>
      <div class="sk__card sk__card--3 is-demo"><span class="sk__step">3</span><span class="sk__label">好みを選ぶ</span></div>
      <div class="sk__card sk__card--4 is-demo"><span class="sk__step">4</span><span class="sk__label">完成</span></div>
    </div>
  </div>
</main>
<script>
// 실제 동작은 position: sticky(top 간격)만으로 끝난다(0줄). is-demo 클래스는
// 캡처용 미리보기 루프일 뿐 — 스크롤과 상관없이 사용자가 그대로 스크롤해도 쌓인다.
</script>
</body>
</html>
