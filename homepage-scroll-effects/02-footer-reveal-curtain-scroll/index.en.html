<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curtain-reveal footer — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="fc is-demo">
    <div class="fc__scroll">
      <div class="fc__main">
        <p class="fc__line">The article ends here</p>
        <p class="fc__line">A greeting waits beneath it</p>
        <p class="fc__line">Scroll one more notch</p>
      </div>
      <footer class="fc__foot"><span class="fc__cheer">Thanks for scrolling all the way</span></footer>
    </div>
  </div>
</main>
<script>
// 실제 동작은 position: sticky(bottom) + z-index 만으로 끝난다(0줄).
// 이 3줄은 미리보기 자동 재생만 멈춘다 — 실제 스크롤은 그대로 살아있다.
document.querySelector('.fc__scroll').addEventListener('pointerdown', function () {
  document.querySelector('.fc').classList.remove('is-demo');
});
</script>
</body>
</html>
