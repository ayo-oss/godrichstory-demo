<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizontal story panels — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="hp is-demo">
    <div class="hp__scroller">
      <div class="hp__inner">
        <div class="hp__pin">
          <div class="hp__track">
            <section class="hp__panel hp__panel--1"><span class="hp__tag">物語 1</span></section>
            <section class="hp__panel hp__panel--2"><span class="hp__tag">物語 2</span></section>
            <section class="hp__panel hp__panel--3"><span class="hp__tag">物語 3</span></section>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작은 scroll-timeline + animation-timeline + position: sticky 만으로 끝난다(0줄).
// 이 3줄은 미리보기 자동 재생만 멈춘다 — 실제 세로 스크롤은 그대로 살아있다.
document.querySelector('.hp__scroller').addEventListener('pointerdown', function () {
  document.querySelector('.hp').classList.remove('is-demo');
});
</script>
</body>
</html>
