<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>色を読む前に座標を二重のノイズで押し流し、その位置でメッシュを読むので、縁が煙のように曲がって流れる。 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mg is-demo" id="mgRoot">
  <canvas class="mg__canvas" id="mgCanvas" width="160" height="100" tabindex="0" aria-label="色を読む前に座標を二重のノイズで押し流し、その位置でメッシュを読むので、縁が煙のように曲がって流れる。"></canvas>
  <p class="mg__status" id="mgStatus" aria-live="polite">デモ実行中</p>
  <button class="mg__btn" id="mgBtn" type="button">一時停止</button>
  <p class="mg__caption">色を読む前に座標を二重のノイズで押し流し、その位置でメッシュを読むので、縁が煙のように曲がって流れる。</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('mgRoot');
  var canvas = document.getElementById('mgCanvas');
  var statusEl = document.getElementById('mgStatus');
  var btnEl = document.getElementById('mgBtn');
  function main(root, canvas, statusEl, btnEl) {
      var ctx0 = canvas.getContext('2d');
      if (!ctx0) {
          return function () { return; };
      }
      var ctx = ctx0;
      var CALC_W = 160, CALC_H = 100;
      var FIXED_DT = 16;
      var REDUCE_STEP_MS = 900;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce)
          root.classList.remove('is-demo');
      var paused = false;
      var elapsed = 0, rafId = 0;
      var cleaners = [];
      function listen(target, type, fn) {
          target.addEventListener(type, fn);
          cleaners.push(function () { target.removeEventListener(type, fn); });
      }
      function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
      function lerp(a, b, k) { return a + (b - a) * k; }
      function smooth(x) { var c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
      function setStatus(msg) { statusEl.textContent = msg; }
      // 시드 고정 난수 (mulberry32) — 같은 시드는 언제나 같은 수열이다
      function seedRand(seed) {
          var s = seed >>> 0;
          return function () {
              s = (s + 0x6D2B79F5) >>> 0;
              var z = s;
              z = Math.imul(z ^ (z >>> 15), z | 1);
              z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
              return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
          };
      }
      // 파스텔 여섯 색 — 분홍·라일락·하늘·민트·살구·버터
      var PAL = [[255, 152, 178], [182, 152, 255], [122, 200, 255], [122, 222, 186], [255, 196, 140], [255, 228, 130]];
      // 색 목록을 원형으로 읽는다. pos 의 정수부는 몇 번째 색, 소수부는 다음 색으로 넘어가는 정도
      function pick(pal, pos, out) {
          var n = pal.length;
          var i0 = Math.floor(pos);
          var f = pos - i0;
          var a = pal[((i0 % n) + n) % n];
          var b = pal[(((i0 + 1) % n) + n) % n];
          out[0] = lerp(a[0], b[0], f);
          out[1] = lerp(a[1], b[1], f);
          out[2] = lerp(a[2], b[2], f);
      }
      function put(d, x, y, r, g, b) {
          var o = (y * CALC_W + x) * 4;
          d[o] = r;
          d[o + 1] = g;
          d[o + 2] = b;
          d[o + 3] = 255;
      }
      canvas.width = CALC_W;
      canvas.height = CALC_H;
      var img = ctx.createImageData(CALC_W, CALC_H);
      var px = img.data;
      // 04 노이즈 좌표 비틀기 — 색을 읽기 전에 시드 고정 값 노이즈 두 겹으로 좌표를 민다
      var REDUCE_MS = 1000;
      var WARP = 0.3;
      var LATTICE = 32;
      var lattice = [];
      var rnd = seedRand(7);
      for (var li = 0; li < LATTICE * LATTICE; li += 1) {
          lattice.push(rnd());
      }
      function lat(ix, iy) {
          return lattice[(((iy % LATTICE) + LATTICE) % LATTICE) * LATTICE + (((ix % LATTICE) + LATTICE) % LATTICE)];
      }
      function vnoise(x, y) {
          var ix = Math.floor(x), iy = Math.floor(y);
          var fx = smooth(x - ix), fy = smooth(y - iy);
          return lerp(lerp(lat(ix, iy), lat(ix + 1, iy), fx), lerp(lat(ix, iy + 1), lat(ix + 1, iy + 1), fx), fy);
      }
      var GRID = [PAL[0], PAL[2], PAL[1], PAL[3], PAL[5], PAL[0], PAL[1], PAL[4], PAL[2]];
      function meshRead(u, v, out) {
          var gx = clamp(u, 0, 1) * 2, gy = clamp(v, 0, 1) * 2;
          var ix = Math.min(1, Math.floor(gx)), iy = Math.min(1, Math.floor(gy));
          var fx = smooth(gx - ix), fy = smooth(gy - iy);
          var a = GRID[iy * 3 + ix], b = GRID[iy * 3 + ix + 1], c = GRID[(iy + 1) * 3 + ix], e = GRID[(iy + 1) * 3 + ix + 1];
          out[0] = lerp(lerp(a[0], b[0], fx), lerp(c[0], e[0], fx), fy);
          out[1] = lerp(lerp(a[1], b[1], fx), lerp(c[1], e[1], fx), fy);
          out[2] = lerp(lerp(a[2], b[2], fx), lerp(c[2], e[2], fx), fy);
      }
      var warpTmp = [0, 0, 0];
      function paint(t, d) {
          for (var y = 0; y < CALC_H; y += 1) {
              var v = y / (CALC_H - 1);
              for (var x = 0; x < CALC_W; x += 1) {
                  var u = x / (CALC_W - 1);
                  // 큰 물결 + 잔물결 두 겹
                  var wu = (vnoise(u * 2.2 + t * 0.7, v * 2.2 - t * 0.4) - 0.5) * 2 + (vnoise(u * 5 - t * 0.9 + 7.7, v * 5 + t * 0.6) - 0.5) * 0.7;
                  var wv = (vnoise(u * 2.2 - t * 0.5 + 3.1, v * 2.2 + t * 0.8 + 5.3) - 0.5) * 2 + (vnoise(u * 5 + t * 0.8 + 1.9, v * 5 - t * 0.7 + 9.1) - 0.5) * 0.7;
                  meshRead(u + WARP * wu, v + WARP * wv, warpTmp);
                  put(d, x, y, warpTmp[0], warpTmp[1], warpTmp[2]);
              }
          }
      }
      function draw() {
          paint(elapsed / 1000, px);
          ctx.putImageData(img, 0, 0);
      }
      var lastTs = null;
      var accMs = 0;
      function tick(ts) {
          if (lastTs === null) {
              lastTs = ts;
          }
          var frameDt = Math.min(ts - lastTs, 48);
          lastTs = ts;
          if (!paused) {
              accMs += frameDt;
              while (accMs >= FIXED_DT) {
                  elapsed += FIXED_DT;
                  accMs -= FIXED_DT;
              }
              draw();
          }
          rafId = requestAnimationFrame(tick);
      }
      function onButton() {
          root.classList.remove('is-demo');
          if (reduce) {
              elapsed += REDUCE_STEP_MS;
              draw();
              setStatus('一場面ずつ送っています');
              return;
          }
          paused = !paused;
          btnEl.textContent = paused ? '再生' : '一時停止';
          setStatus(paused ? '一時停止中' : 'デモ実行中');
      }
      draw();
      listen(btnEl, 'click', function () { onButton(); });
      listen(canvas, 'pointerdown', function () { onButton(); });
      listen(canvas, 'keydown', function (e) {
          var k = e.key;
          if (k === 'Enter' || k === ' ') {
              e.preventDefault();
              onButton();
          }
      });
      if (reduce) {
          elapsed = REDUCE_MS;
          draw();
          btnEl.textContent = '次の場面';
          setStatus('一場面ずつ送っています');
      }
      else {
          rafId = requestAnimationFrame(tick);
      }
      function destroy() {
          cancelAnimationFrame(rafId);
          for (var i = 0; i < cleaners.length; i += 1) {
              cleaners[i]();
          }
      }
      return destroy;
  }
  main(root, canvas, statusEl, btnEl);
})();
</script>
</body>
</html>
