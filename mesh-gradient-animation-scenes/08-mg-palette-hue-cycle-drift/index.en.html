<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The hue angles of nine control points turn at different speeds while the brightness rises and falls on an 8 second cycle, so one shape keeps changing its colour mood. — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mg is-demo" id="mgRoot">
  <canvas class="mg__canvas" id="mgCanvas" width="160" height="100" tabindex="0" aria-label="The hue angles of nine control points turn at different speeds while the brightness rises and falls on an 8 second cycle, so one shape keeps changing its colour mood."></canvas>
  <p class="mg__status" id="mgStatus" aria-live="polite">Demo running</p>
  <button class="mg__btn" id="mgBtn" type="button">Pause</button>
  <p class="mg__caption">The hue angles of nine control points turn at different speeds while the brightness rises and falls on an 8 second cycle, so one shape keeps changing its colour mood.</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('mgRoot');
  var canvas = document.getElementById('mgCanvas');
  var statusEl = document.getElementById('mgStatus');
  var btnEl = document.getElementById('mgBtn');
  function main(root, canvas, statusEl, btnEl) {
      var ctx0 = canvas.getContext('2d');
      if (!ctx0) {
          return function () { return; };
      }
      var ctx = ctx0;
      var CALC_W = 160, CALC_H = 100;
      var FIXED_DT = 16;
      var REDUCE_STEP_MS = 900;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce)
          root.classList.remove('is-demo');
      var paused = false;
      var elapsed = 0, rafId = 0;
      var cleaners = [];
      function listen(target, type, fn) {
          target.addEventListener(type, fn);
          cleaners.push(function () { target.removeEventListener(type, fn); });
      }
      function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
      function lerp(a, b, k) { return a + (b - a) * k; }
      function smooth(x) { var c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
      function setStatus(msg) { statusEl.textContent = msg; }
      // 시드 고정 난수 (mulberry32) — 같은 시드는 언제나 같은 수열이다
      function seedRand(seed) {
          var s = seed >>> 0;
          return function () {
              s = (s + 0x6D2B79F5) >>> 0;
              var z = s;
              z = Math.imul(z ^ (z >>> 15), z | 1);
              z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
              return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
          };
      }
      // 파스텔 여섯 색 — 분홍·라일락·하늘·민트·살구·버터
      var PAL = [[255, 152, 178], [182, 152, 255], [122, 200, 255], [122, 222, 186], [255, 196, 140], [255, 228, 130]];
      // 색 목록을 원형으로 읽는다. pos 의 정수부는 몇 번째 색, 소수부는 다음 색으로 넘어가는 정도
      function pick(pal, pos, out) {
          var n = pal.length;
          var i0 = Math.floor(pos);
          var f = pos - i0;
          var a = pal[((i0 % n) + n) % n];
          var b = pal[(((i0 + 1) % n) + n) % n];
          out[0] = lerp(a[0], b[0], f);
          out[1] = lerp(a[1], b[1], f);
          out[2] = lerp(a[2], b[2], f);
      }
      function put(d, x, y, r, g, b) {
          var o = (y * CALC_W + x) * 4;
          d[o] = r;
          d[o + 1] = g;
          d[o + 2] = b;
          d[o + 3] = 255;
      }
      canvas.width = CALC_W;
      canvas.height = CALC_H;
      var img = ctx.createImageData(CALC_W, CALC_H);
      var px = img.data;
      // 08 색상 각도 순환 — 3×3 제어점마다 서로 다른 속도로 색상 각도를 돌리고, 밝기도 한 주기 동안 낮밤처럼 오르내린다
      var REDUCE_MS = 1200;
      var SATURATION = 0.68;
      var DAY_PERIOD = 8;
      var BASE_HUE = [350, 25, 60, 200, 270, 320, 140, 90, 230];
      var HUE_SPEED = [96, -135, 78, 174, -84, 123, -162, 66, 150];
      var hueCol = [];
      for (var hi = 0; hi < 9; hi += 1) {
          hueCol.push([0, 0, 0]);
      }
      // 색상 h(도), 채도 s, 밝기 l → 0~255 RGB
      function hslToRgb(h, s, l, out) {
          var hh = ((h % 360) + 360) % 360;
          var c = (1 - Math.abs(2 * l - 1)) * s;
          var xx = c * (1 - Math.abs(((hh / 60) % 2) - 1));
          var m = l - c / 2;
          var r = 0, g = 0, b = 0;
          if (hh < 60) {
              r = c;
              g = xx;
          }
          else if (hh < 120) {
              r = xx;
              g = c;
          }
          else if (hh < 180) {
              g = c;
              b = xx;
          }
          else if (hh < 240) {
              g = xx;
              b = c;
          }
          else if (hh < 300) {
              r = xx;
              b = c;
          }
          else {
              r = c;
              b = xx;
          }
          out[0] = (r + m) * 255;
          out[1] = (g + m) * 255;
          out[2] = (b + m) * 255;
      }
      function paint(t, d) {
          var phase = 0.5 - 0.5 * Math.cos(6.2832 * t / DAY_PERIOD);
          var light = 0.84 - 0.1 * phase;
          for (var n = 0; n < 9; n += 1) {
              hslToRgb(BASE_HUE[n] + HUE_SPEED[n] * t, SATURATION, light, hueCol[n]);
          }
          for (var y = 0; y < CALC_H; y += 1) {
              var gy = (y / (CALC_H - 1)) * 2, iy = Math.min(1, Math.floor(gy)), fy = smooth(gy - iy);
              for (var x = 0; x < CALC_W; x += 1) {
                  var gx = (x / (CALC_W - 1)) * 2, ix = Math.min(1, Math.floor(gx)), fx = smooth(gx - ix);
                  var a = hueCol[iy * 3 + ix], b = hueCol[iy * 3 + ix + 1], c = hueCol[(iy + 1) * 3 + ix], e = hueCol[(iy + 1) * 3 + ix + 1];
                  put(d, x, y, lerp(lerp(a[0], b[0], fx), lerp(c[0], e[0], fx), fy), lerp(lerp(a[1], b[1], fx), lerp(c[1], e[1], fx), fy), lerp(lerp(a[2], b[2], fx), lerp(c[2], e[2], fx), fy));
              }
          }
      }
      function draw() {
          paint(elapsed / 1000, px);
          ctx.putImageData(img, 0, 0);
      }
      var lastTs = null;
      var accMs = 0;
      function tick(ts) {
          if (lastTs === null) {
              lastTs = ts;
          }
          var frameDt = Math.min(ts - lastTs, 48);
          lastTs = ts;
          if (!paused) {
              accMs += frameDt;
              while (accMs >= FIXED_DT) {
                  elapsed += FIXED_DT;
                  accMs -= FIXED_DT;
              }
              draw();
          }
          rafId = requestAnimationFrame(tick);
      }
      function onButton() {
          root.classList.remove('is-demo');
          if (reduce) {
              elapsed += REDUCE_STEP_MS;
              draw();
              setStatus('Stepping one scene at a time');
              return;
          }
          paused = !paused;
          btnEl.textContent = paused ? 'Play' : 'Pause';
          setStatus(paused ? 'Paused' : 'Demo running');
      }
      draw();
      listen(btnEl, 'click', function () { onButton(); });
      listen(canvas, 'pointerdown', function () { onButton(); });
      listen(canvas, 'keydown', function (e) {
          var k = e.key;
          if (k === 'Enter' || k === ' ') {
              e.preventDefault();
              onButton();
          }
      });
      if (reduce) {
          elapsed = REDUCE_MS;
          draw();
          btnEl.textContent = 'Next scene';
          setStatus('Stepping one scene at a time');
      }
      else {
          rafId = requestAnimationFrame(tick);
      }
      function destroy() {
          cancelAnimationFrame(rafId);
          for (var i = 0; i < cleaners.length; i += 1) {
              cleaners[i]();
          }
      }
      return destroy;
  }
  main(root, canvas, statusEl, btnEl);
})();
</script>
</body>
</html>
