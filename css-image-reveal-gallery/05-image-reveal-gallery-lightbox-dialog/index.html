<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Native dialog lightbox — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="lb-frame is-demo">
    <button class="lb-thumb" type="button" aria-haspopup="dialog">
      <span class="lb-thumb__photo"></span>
      <span class="lb-thumb__label">View</span>
    </button>
    <dialog class="lb-dialog" aria-labelledby="lb-title">
      <div class="lb-dialog__photo"></div>
      <h2 id="lb-title" class="lb-dialog__title">Studio 04</h2>
      <button class="lb-close" type="button">Close</button>
    </dialog>
  </div>
</main>
<script>
var dlg = document.querySelector('.lb-dialog'), btn = document.querySelector('.lb-close'), frame = document.querySelector('.lb-frame');
document.querySelector('.lb-thumb').addEventListener('click', function () {
  frame.classList.remove('is-demo');
  if (!dlg.open) { dlg.showModal(); btn.focus({ preventScroll: true }); }
});
btn.addEventListener('click', function () { dlg.close(); });
if (frame.classList.contains('is-demo')) { dlg.showModal(); btn.focus({ preventScroll: true }); }
</script>
</body>
</html>
