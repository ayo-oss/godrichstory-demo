<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filter tabs via :has() — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ft-frame is-demo">
    <input type="radio" name="ft-cat" id="ft-1" class="ft-radio" checked>
    <input type="radio" name="ft-cat" id="ft-2" class="ft-radio">
    <input type="radio" name="ft-cat" id="ft-3" class="ft-radio">
    <div class="ft-tabs">
      <span class="ft-indicator" aria-hidden="true"></span>
      <label class="ft-tab" for="ft-1">All</label>
      <label class="ft-tab" for="ft-2">Photo</label>
      <label class="ft-tab" for="ft-3">Video</label>
    </div>
    <div class="ft-gallery">
      <div class="ft-tile" data-cat="photo"></div>
      <div class="ft-tile" data-cat="video"></div>
      <div class="ft-tile" data-cat="photo"></div>
      <div class="ft-tile" data-cat="video"></div>
      <div class="ft-tile" data-cat="photo"></div>
      <div class="ft-tile" data-cat="video"></div>
    </div>
  </div>
</main>
<script>
var frame = document.querySelector('.ft-frame');
if (frame.classList.contains('is-demo')) {
  var radios = document.querySelectorAll('.ft-radio'), i = 0;
  var iv = setInterval(function () { i = (i + 1) % radios.length; radios[i].checked = true; }, 700);
  radios.forEach(function (r) {
    r.addEventListener('change', function () { frame.classList.remove('is-demo'); clearInterval(iv); });
  });
}
</script>
</body>
</html>
