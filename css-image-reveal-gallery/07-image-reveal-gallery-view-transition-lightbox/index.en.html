<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thumbnail to lightbox morph — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="fl-frame fl-focal is-demo">
    <button class="fl-thumb" type="button"><span class="fl-thumb__photo"></span></button>
    <div class="fl-panel"><span class="fl-panel__photo"></span></div>
    <div class="fl-panel fl-panel--demo" aria-hidden="true"><span class="fl-panel__photo"></span></div>
  </div>
</main>
<script>
var thumb = document.querySelector('.fl-thumb'), panel = document.querySelector('.fl-panel'), frame = document.querySelector('.fl-frame');
thumb.addEventListener('click', function () {
  frame.classList.remove('is-demo');
  var t = thumb.getBoundingClientRect(), p = panel.getBoundingClientRect();
  panel.style.transform = 'translate(' + (t.left - p.left) + 'px,' + (t.top - p.top) + 'px) scale(' + (t.width / p.width) + ',' + (t.height / p.height) + ')';
  panel.classList.add('is-open');
  requestAnimationFrame(function () { panel.style.transform = 'translate(0,0) scale(1,1)'; });
});
panel.addEventListener('click', function () { panel.classList.remove('is-open'); panel.style.transform = ''; });
</script>
</body>
</html>
