<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パネルが反転するたびに前後の順序を再計算するフリップローダー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">クリックするかスペースバーを押すと一時停止または再開します</p>
  <div class="ld__field" id="field" role="application" aria-label="フリップパネル深度再整列テストパネル" tabindex="0">
    <div class="c3__scene">
      <div class="c3__stack" id="stack"></div>
    </div>
    <b class="ld__badge" aria-hidden="true"><span class="ld__badgeNum" id="pct">0%</span><span class="ld__badgeUnit">進行</span></b>
  </div>
</div>
</main>
<script>
(function () {
'use strict';
var root = document.getElementById('ld');
var field = document.getElementById('field');
var pctEl = document.getElementById('pct');
var stack = document.getElementById('stack');

var PANEL_COUNT = 5;
var STEP = 1 / PANEL_COUNT;
var RANK_ZGAP = 22;
var RANK_YOFF = 4;

var panels = [];
for (var i = 0; i < PANEL_COUNT; i++) {
  var panel = document.createElement('div');
  panel.className = 'c3__panel';
  var face = document.createElement('div');
  face.className = 'c3__panelFace';
  face.textContent = String(i + 1);
  var back = document.createElement('div');
  back.className = 'c3__panelBack';
  back.textContent = String(i + 1);
  panel.appendChild(face);
  panel.appendChild(back);
  stack.appendChild(panel);
  panels.push(panel);
}

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var LOOP = 2;
var REDUCE_P = 0.7;
var t0 = 0, raf = 0, paused = false, lastP = 0;

// 지금 뒤집는 패널 인덱스 — 진행률을 패널 구간(STEP)으로 나눈 정수부.
function currentIndex(p) {
  var idx = Math.floor(p * PANEL_COUNT);
  if (idx > PANEL_COUNT - 1) idx = PANEL_COUNT - 1;
  if (idx < 0) idx = 0;
  return idx;
}
// 패널 i 의 회전 각도 — 자기 구간 안에서만 0→180도로 선형 보간, 구간 전은 0, 구간 후는 180 고정.
function flipAngle(i, p) {
  var start = i * STEP, end = start + STEP;
  if (p < start) return 0;
  if (p >= end) return 180;
  var local = (p - start) / STEP;
  return local * 180;
}
// 패널 i 의 깊이 순위 — "지금 뒤집는 패널까지의 거리". 거리가 멀수록 뒤로 밀린다.
function depthRank(i, p) {
  var cur = currentIndex(p);
  return Math.abs(cur - i);
}

function render(p) {
  lastP = p;
  for (var i = 0; i < PANEL_COUNT; i++) {
    var angle = flipAngle(i, p);
    var rank = depthRank(i, p);
    panels[i].style.transform = 'translateZ(' + (-rank * RANK_ZGAP) + 'px) translateY(' + (rank * RANK_YOFF) + 'px) rotateY(' + angle + 'deg)';
    panels[i].style.zIndex = String(PANEL_COUNT - rank);
  }
  pctEl.textContent = Math.round(p * 100) + '%';
}

function frame(now) {
  if (!paused) { var t = (now - t0) / 1000; render((t % LOOP) / LOOP); }
  raf = requestAnimationFrame(frame);
}
function togglePause() {
  paused = !paused;
  root.classList.toggle('is-paused', paused);
  render(reduce ? REDUCE_P : lastP);
}
function restart() {
  t0 = performance.now();
  render(reduce ? REDUCE_P : 0);
}

field.addEventListener('click', function () { togglePause(); });
field.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restart(); }
});
window.addEventListener('resize', function () {
  if (paused || reduce) render(reduce ? REDUCE_P : lastP);
});

t0 = performance.now();
if (reduce) {
  root.classList.add('is-still');
  render(REDUCE_P);
} else {
  raf = requestAnimationFrame(frame);
}
})();
</script>
</body>
</html>
