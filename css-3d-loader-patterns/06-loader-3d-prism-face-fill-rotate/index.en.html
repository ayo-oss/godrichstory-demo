<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader Each Face Fills With Color as It Rotates Past — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">Click or press the space bar to pause or restart</p>
  <div class="ld__field" id="field" role="application" aria-label="Rotating prism face-fill test panel" tabindex="0">
    <div class="c3__scene">
      <div class="c3__prism" id="prism"></div>
    </div>
    <b class="ld__badge" aria-hidden="true"><span class="ld__badgeNum" id="pct">0%</span><span class="ld__badgeUnit">Progress</span></b>
  </div>
</div>
</main>
<script>
(function () {
'use strict';
var root = document.getElementById('ld');
var field = document.getElementById('field');
var pctEl = document.getElementById('pct');
var prism = document.getElementById('prism');

var PRISM_SIDES = 6;
var RADIUS = 76;
var ROT_TURNS = 1;
var FILL_SPAN = 1 / (PRISM_SIDES * 2); // 문턱을 넘은 뒤 색이 번지는 데 걸리는 진행률 폭

var faces = [];
var fills = [];
for (var i = 0; i < PRISM_SIDES; i++) {
  var face = document.createElement('div');
  face.className = 'c3__face';
  face.style.transform = 'rotateY(' + (i * (360 / PRISM_SIDES)) + 'deg) translateZ(' + RADIUS + 'px)';
  var fill = document.createElement('div');
  fill.className = 'c3__fill';
  face.appendChild(fill);
  prism.appendChild(face);
  faces.push(face);
  fills.push(fill);
}

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var LOOP = 2;
var REDUCE_P = 0.7;
var t0 = 0, raf = 0, paused = false, lastP = 0;

// 면 i 의 문턱은 i / PRISM_SIDES — 진행률이 그 문턱을 넘으면 FILL_SPAN 동안 선형으로 번져 채워지고,
// 그 뒤로는 값이 줄지 않는 한(루프가 돌아 p 가 다시 작아지기 전까지) 채워진 채로 유지된다.
function fillAmount(i, p) {
  var threshold = i / PRISM_SIDES;
  var raw = (p - threshold) / FILL_SPAN;
  if (raw < 0) return 0;
  if (raw > 1) return 1;
  return raw;
}

function render(p) {
  lastP = p;
  var rotY = (p * 360 * ROT_TURNS) % 360;
  prism.style.transform = 'rotateX(-14deg) rotateY(' + rotY + 'deg)';
  for (var i = 0; i < PRISM_SIDES; i++) {
    fills[i].style.opacity = String(fillAmount(i, p));
  }
  pctEl.textContent = Math.round(p * 100) + '%';
}

function frame(now) {
  if (!paused) { var t = (now - t0) / 1000; render((t % LOOP) / LOOP); }
  raf = requestAnimationFrame(frame);
}
function togglePause() {
  paused = !paused;
  root.classList.toggle('is-paused', paused);
  render(reduce ? REDUCE_P : lastP);
}
function restart() {
  t0 = performance.now();
  render(reduce ? REDUCE_P : 0);
}

field.addEventListener('click', function () { togglePause(); });
field.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restart(); }
});
window.addEventListener('resize', function () {
  if (paused || reduce) render(reduce ? REDUCE_P : lastP);
});

t0 = performance.now();
if (reduce) {
  root.classList.add('is-still');
  render(REDUCE_P);
} else {
  raf = requestAnimationFrame(frame);
}
})();
</script>
</body>
</html>
