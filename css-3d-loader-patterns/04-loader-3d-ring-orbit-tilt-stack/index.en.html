<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader a Rising Value Narrows the Tilt Gap Between Rings — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">Click or press the space bar to pause or restart</p>
  <div class="ld__field" id="field" role="application" aria-label="Orbit-ring tilt-convergence test panel" tabindex="0">
    <div class="c3__orbit">
      <div class="c3__ring c3__ring--0" id="r0"></div>
      <div class="c3__ring c3__ring--1" id="r1"></div>
      <div class="c3__ring c3__ring--2" id="r2"></div>
      <div class="c3__ring c3__ring--3" id="r3"></div>
    </div>
    <b class="ld__badge" aria-hidden="true"><span class="ld__badgeNum" id="pct">0%</span><span class="ld__badgeUnit">Progress</span></b>
  </div>
</div>
</main>
<script>
(function () {
'use strict';
var root = document.getElementById('ld');
var field = document.getElementById('field');
var pctEl = document.getElementById('pct');
var rings = [document.getElementById('r0'), document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];

var INITIAL_TILT = [72, 54, 36, 18]; // 고리마다 다른 시작 기울기(deg) — 값이 오를수록 0 으로 수렴
var SPIN_TURNS = 0.6;                 // 한 루프 동안 고리 묶음이 도는 회전수

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var LOOP = 2;
var REDUCE_P = 0.7;
var t0 = 0, raf = 0, paused = false, lastP = 0;

function render(p) {
  lastP = p;
  var spinY = (p * 360 * SPIN_TURNS) % 360;
  for (var i = 0; i < rings.length; i++) {
    var tilt = INITIAL_TILT[i] * (1 - p); // 정면 각도(0deg) 쪽으로 진행률 비례 보간
    rings[i].style.transform = 'rotateY(' + spinY + 'deg) rotateX(' + tilt + 'deg)';
  }
  pctEl.textContent = Math.round(p * 100) + '%';
}

function frame(now) {
  if (!paused) { var t = (now - t0) / 1000; render((t % LOOP) / LOOP); }
  raf = requestAnimationFrame(frame);
}
function togglePause() {
  paused = !paused;
  root.classList.toggle('is-paused', paused);
  render(reduce ? REDUCE_P : lastP);
}
function restart() {
  t0 = performance.now();
  render(reduce ? REDUCE_P : 0);
}

field.addEventListener('click', function () { togglePause(); });
field.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restart(); }
});
window.addEventListener('resize', function () {
  if (paused || reduce) render(reduce ? REDUCE_P : lastP);
});

t0 = performance.now();
if (reduce) {
  root.classList.add('is-still');
  render(REDUCE_P);
} else {
  raf = requestAnimationFrame(frame);
}
})();
</script>
</body>
</html>
