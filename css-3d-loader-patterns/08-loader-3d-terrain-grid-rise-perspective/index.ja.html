<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>格子点が値の分だけ盛り上がり地形に見える遠近法ローダー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">クリックするかスペースバーを押すと一時停止または再開します</p>
  <div class="ld__field" id="field" role="application" aria-label="地形グリッド遠近法テストパネル" tabindex="0">
    <div class="c3__scene">
      <div class="c3__grid" id="grid"></div>
    </div>
    <b class="ld__badge" aria-hidden="true"><span class="ld__badgeNum" id="pct">0%</span><span class="ld__badgeUnit">進行</span></b>
  </div>
</div>
</main>
<script>
(function () {
'use strict';
var root = document.getElementById('ld');
var field = document.getElementById('field');
var pctEl = document.getElementById('pct');
var grid = document.getElementById('grid');

var GRID_COLS = 7;
var GRID_ROWS = 5;
var COL_GAP = 20;
var ROW_GAP = 24;
var HEIGHT_SCALE = 54;
var ROT_TURNS = 0.35;
var TILT = 58;

// 격자점마다 고정된 높이 가중치를 결정적으로 계산한다(무작위 없음) — 두 개의 sin/cos 물결을 겹친 값.
function weightOf(col, row) {
  return (Math.sin(col * 1.1 + row * 0.6) + Math.cos(row * 1.3 - col * 0.4) + 2) / 4;
}

var pts = [];
var base = [];
for (var row = 0; row < GRID_ROWS; row++) {
  for (var col = 0; col < GRID_COLS; col++) {
    var x = (col - (GRID_COLS - 1) / 2) * COL_GAP;
    var z = row * ROW_GAP;
    var w = weightOf(col, row);
    base.push([x, z, w]);
    var el = document.createElement('div');
    el.className = 'c3__pt';
    el.style.zIndex = String(row);
    grid.appendChild(el);
    pts.push(el);
  }
}

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var LOOP = 2;
var REDUCE_P = 0.7;
var t0 = 0, raf = 0, paused = false, lastP = 0;

function render(p) {
  lastP = p;
  var rotY = (p * 360 * ROT_TURNS) % 360;
  grid.style.transform = 'rotateX(' + TILT + 'deg) rotateZ(' + rotY + 'deg)';
  for (var i = 0; i < pts.length; i++) {
    var b = base[i];
    var rise = b[2] * p * HEIGHT_SCALE;
    pts[i].style.transform = 'translate3d(' + b[0] + 'px,' + (-rise) + 'px,' + b[1] + 'px)';
  }
  pctEl.textContent = Math.round(p * 100) + '%';
}

function frame(now) {
  if (!paused) { var t = (now - t0) / 1000; render((t % LOOP) / LOOP); }
  raf = requestAnimationFrame(frame);
}
function togglePause() {
  paused = !paused;
  root.classList.toggle('is-paused', paused);
  render(reduce ? REDUCE_P : lastP);
}
function restart() {
  t0 = performance.now();
  render(reduce ? REDUCE_P : 0);
}

field.addEventListener('click', function () { togglePause(); });
field.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restart(); }
});
window.addEventListener('resize', function () {
  if (paused || reduce) render(reduce ? REDUCE_P : lastP);
});

t0 = performance.now();
if (reduce) {
  root.classList.add('is-still');
  render(REDUCE_P);
} else {
  raf = requestAnimationFrame(frame);
}
})();
</script>
</body>
</html>
