<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>進行度の値だけ頂点が所定の位置に集まるワイヤーフレームローダー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">クリックするかスペースバーを押すと一時停止または再開します</p>
  <div class="ld__field" id="field" role="application" aria-label="ワイヤーフレーム頂点収束テストパネル" tabindex="0">
    <div class="c3__scene">
      <div class="c3__cube" id="c3cube">
        <svg class="c3__svg" id="svg">
          <line class="c3__edge" id="e0"></line><line class="c3__edge" id="e1"></line>
          <line class="c3__edge" id="e2"></line><line class="c3__edge" id="e3"></line>
          <line class="c3__edge" id="e4"></line><line class="c3__edge" id="e5"></line>
          <line class="c3__edge" id="e6"></line><line class="c3__edge" id="e7"></line>
          <line class="c3__edge" id="e8"></line><line class="c3__edge" id="e9"></line>
          <line class="c3__edge" id="e10"></line><line class="c3__edge" id="e11"></line>
        </svg>
        <div class="c3__vtx" id="v0"></div><div class="c3__vtx" id="v1"></div>
        <div class="c3__vtx" id="v2"></div><div class="c3__vtx" id="v3"></div>
        <div class="c3__vtx" id="v4"></div><div class="c3__vtx" id="v5"></div>
        <div class="c3__vtx" id="v6"></div><div class="c3__vtx" id="v7"></div>
      </div>
    </div>
    <b class="ld__badge" aria-hidden="true"><span class="ld__badgeNum" id="pct">0%</span><span class="ld__badgeUnit">進行</span></b>
  </div>
</div>
</main>
<script>
(function () {
'use strict';
var root = document.getElementById('ld');
var field = document.getElementById('field');
var pctEl = document.getElementById('pct');
var cube = document.getElementById('c3cube');
var vtx = [];
for (var vi = 0; vi < 8; vi++) vtx.push(document.getElementById('v' + vi));
var lines = [];
for (var li = 0; li < 12; li++) lines.push(document.getElementById('e' + li));

// 정육면체 모서리(정점 인덱스 비트: 0=x·1=y·2=z, -/+)
var EDGES = [[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
var HALF = 42;
var TARGETS = [];
for (var ti = 0; ti < 8; ti++) {
  TARGETS.push([(ti & 1) ? HALF : -HALF, (ti & 2) ? HALF : -HALF, (ti & 4) ? HALF : -HALF]);
}
// 시작 산점 좌표 — 고정 배열(실호출 Math.random 없음)
var SCATTER = [
  [-70, -55, 10], [60, -65, -20], [-50, 60, 30], [75, 50, -10],
  [-65, -30, -40], [55, -20, 45], [-40, 65, -25], [65, 70, 15]
];

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var LOOP = 2;
var REDUCE_P = 0.7;
var LERP_EASE_POW = 1.8; // 정점 수렴 곡선 지수 — 변형 02 대상 (클수록 막판에 몰려 맺힌다)
var ROT_TURNS = 1;        // 한 루프 동안 큐브가 도는 회전수
var t0 = 0, raf = 0, paused = false, lastP = 0;

function ease(p) { return Math.pow(p, LERP_EASE_POW); }

function updateLines(e) {
  var fr = field.getBoundingClientRect();
  for (var i = 0; i < 12; i++) {
    var a = vtx[EDGES[i][0]].getBoundingClientRect();
    var b = vtx[EDGES[i][1]].getBoundingClientRect();
    var ax = a.left + a.width / 2 - fr.left;
    var ay = a.top + a.height / 2 - fr.top;
    var bx = b.left + b.width / 2 - fr.left;
    var by = b.top + b.height / 2 - fr.top;
    var ln = lines[i];
    ln.setAttribute('x1', ax); ln.setAttribute('y1', ay);
    ln.setAttribute('x2', bx); ln.setAttribute('y2', by);
    ln.setAttribute('stroke-opacity', String(0.15 + 0.85 * e));
  }
}

function render(p) {
  lastP = p;
  var e = ease(p);
  var rotY = (p * 360 * ROT_TURNS) % 360;
  cube.style.transform = 'rotateX(18deg) rotateY(' + rotY + 'deg)';
  for (var i = 0; i < 8; i++) {
    var sx = SCATTER[i][0], sy = SCATTER[i][1], sz = SCATTER[i][2];
    var tx = TARGETS[i][0], ty = TARGETS[i][1], tz = TARGETS[i][2];
    var cx = sx + (tx - sx) * e;
    var cy = sy + (ty - sy) * e;
    var cz = sz + (tz - sz) * e;
    vtx[i].style.transform = 'translate3d(' + cx + 'px,' + cy + 'px,' + cz + 'px)';
    vtx[i].style.opacity = String(0.25 + 0.75 * e);
  }
  updateLines(e);
  pctEl.textContent = Math.round(p * 100) + '%';
}

function frame(now) {
  if (!paused) { var t = (now - t0) / 1000; render((t % LOOP) / LOOP); }
  raf = requestAnimationFrame(frame);
}
function togglePause() {
  paused = !paused;
  root.classList.toggle('is-paused', paused);
  render(reduce ? REDUCE_P : lastP);
}
function restart() {
  t0 = performance.now();
  render(reduce ? REDUCE_P : 0);
}

field.addEventListener('click', function () { togglePause(); });
field.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restart(); }
});
window.addEventListener('resize', function () {
  if (paused || reduce) render(reduce ? REDUCE_P : lastP);
});

t0 = performance.now();
if (reduce) {
  root.classList.add('is-still');
  render(REDUCE_P);
} else {
  raf = requestAnimationFrame(frame);
}
})();
</script>
</body>
</html>
