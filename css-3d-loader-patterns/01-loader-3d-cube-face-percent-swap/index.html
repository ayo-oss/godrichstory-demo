<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>값이 문턱을 넘을 때마다 다음 면으로 넘어가는 정육면체 로더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">클릭하거나 스페이스바를 누르면 멈추거나 다시 갑니다</p>
  <div class="ld__field" id="field" role="application" aria-label="정육면체 면 전환 진행 실험판" tabindex="0">
    <div class="c3__scene">
      <div class="c3__cube" id="c3cube">
        <div class="c3__face c3__face--front">1</div>
        <div class="c3__face c3__face--right">2</div>
        <div class="c3__face c3__face--back">3</div>
        <div class="c3__face c3__face--left">4</div>
      </div>
    </div>
    <b class="ld__badge" aria-hidden="true"><span class="ld__badgeNum" id="pct">0%</span><span class="ld__badgeUnit">진행</span></b>
  </div>
</div>
</main>
<script>
(function () {
'use strict';
var root = document.getElementById('ld');
var field = document.getElementById('field');
var pctEl = document.getElementById('pct');
var cube = document.getElementById('c3cube');
var faces = Array.prototype.slice.call(cube.querySelectorAll('.c3__face'));
var NORMALS = [0, 90, 180, 270]; // front·right·back·left 면 법선 각

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var LOOP = 2;          // 로더 한 바퀴(초) — 캡처 창(2초)의 약수라 gif 가 끊기지 않는다
var REDUCE_P = 0.7;
var FACE_THRESHOLD = 25; // 면 하나를 넘길 진행률 문턱(%) — 변형 01 대상
var t0 = 0, raf = 0, paused = false, lastP = 0;

// 화가 알고리즘 — 각 면의 (법선각 + 현재 회전각) 코사인을 깊이로 써서 뒤에서 앞 순서로 z-index 를 매긴다.
function depthSort(rotY) {
  var withDepth = faces.map(function (el, i) {
    return { el: el, depth: Math.cos((NORMALS[i] + rotY) * Math.PI / 180) };
  });
  withDepth.sort(function (a, b) { return a.depth - b.depth; });
  withDepth.forEach(function (o, idx) { o.el.style.zIndex = String(idx); });
}

function render(p) {
  lastP = p;
  var pct = Math.round(p * 100);
  var idx = Math.min(faces.length - 1, Math.floor(pct / FACE_THRESHOLD));
  var rotY = idx * 90;
  cube.style.transform = 'rotateY(' + rotY + 'deg)';
  depthSort(rotY);
  pctEl.textContent = pct + '%';
}

function frame(now) {
  if (!paused) { var t = (now - t0) / 1000; render((t % LOOP) / LOOP); }
  raf = requestAnimationFrame(frame);
}
function togglePause() {
  paused = !paused;
  root.classList.toggle('is-paused', paused);
  render(reduce ? REDUCE_P : lastP);
}
function restart() {
  t0 = performance.now();
  render(reduce ? REDUCE_P : 0);
}

field.addEventListener('click', function () { togglePause(); });
field.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restart(); }
});
window.addEventListener('resize', function () {
  if (paused || reduce) render(reduce ? REDUCE_P : lastP);
});

t0 = performance.now();
if (reduce) {
  root.classList.add('is-still');
  render(REDUCE_P);
} else {
  raf = requestAnimationFrame(frame);
}
})();
</script>
</body>
</html>
