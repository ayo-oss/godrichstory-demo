<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader Points on a Sphere Converge Into One — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">Click or press the space bar to pause or restart</p>
  <div class="ld__field" id="field" role="application" aria-label="Sphere point-convergence test panel" tabindex="0">
    <div class="c3__scene">
      <div class="c3__sphere" id="sphere"></div>
    </div>
    <b class="ld__badge" aria-hidden="true"><span class="ld__badgeNum" id="pct">0%</span><span class="ld__badgeUnit">Progress</span></b>
  </div>
</div>
</main>
<script>
(function () {
'use strict';
var root = document.getElementById('ld');
var field = document.getElementById('field');
var pctEl = document.getElementById('pct');
var sphere = document.getElementById('sphere');

var POINT_COUNT = 28;
var SPHERE_R = 78;
var GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5)); // 피보나치 구 분포 각(고정 상수, 무작위 없음)
var ROT_TURNS = 0.5;

// 피보나치 구 분포 — 점 i 의 구면 좌표를 결정적으로 계산한다.
var BASE = [];
for (var i = 0; i < POINT_COUNT; i++) {
  var y = 1 - (i / (POINT_COUNT - 1)) * 2;
  var r = Math.sqrt(Math.max(0, 1 - y * y));
  var theta = GOLDEN_ANGLE * i;
  BASE.push([Math.cos(theta) * r * SPHERE_R, y * SPHERE_R, Math.sin(theta) * r * SPHERE_R]);
}

var pts = [];
for (var pi = 0; pi < POINT_COUNT; pi++) {
  var el = document.createElement('div');
  el.className = 'c3__pt';
  sphere.appendChild(el);
  pts.push(el);
}

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var LOOP = 2;
var REDUCE_P = 0.7;
var t0 = 0, raf = 0, paused = false, lastP = 0;

function render(p) {
  lastP = p;
  var rotY = (p * 360 * ROT_TURNS) % 360;
  var shrink = 1 - p; // 중심(0,0,0) 으로의 수렴 비율
  sphere.style.transform = 'rotateY(' + rotY + 'deg) rotateX(14deg)';
  for (var i = 0; i < POINT_COUNT; i++) {
    var b = BASE[i];
    var x = b[0] * shrink, y = b[1] * shrink, z = b[2] * shrink;
    pts[i].style.transform = 'translate3d(' + x + 'px,' + y + 'px,' + z + 'px)';
  }
  pctEl.textContent = Math.round(p * 100) + '%';
}

function frame(now) {
  if (!paused) { var t = (now - t0) / 1000; render((t % LOOP) / LOOP); }
  raf = requestAnimationFrame(frame);
}
function togglePause() {
  paused = !paused;
  root.classList.toggle('is-paused', paused);
  render(reduce ? REDUCE_P : lastP);
}
function restart() {
  t0 = performance.now();
  render(reduce ? REDUCE_P : 0);
}

field.addEventListener('click', function () { togglePause(); });
field.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restart(); }
});
window.addEventListener('resize', function () {
  if (paused || reduce) render(reduce ? REDUCE_P : lastP);
});

t0 = performance.now();
if (reduce) {
  root.classList.add('is-still');
  render(REDUCE_P);
} else {
  raf = requestAnimationFrame(frame);
}
})();
</script>
</body>
</html>
