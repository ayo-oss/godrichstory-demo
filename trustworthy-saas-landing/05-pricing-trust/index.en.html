<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple pricing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pricing">
    <div class="pricing__card">
      <p class="pricing__name">Starter</p>
      <p class="pricing__price">₩0</p>
    </div>
    <div class="pricing__card pricing__card--pro">
      <span class="pricing__badge">Recommended</span>
      <p class="pricing__name">Pro</p>
      <p class="pricing__price">₩29,000</p>
    </div>
    <div class="pricing__card">
      <p class="pricing__name">Enterprise</p>
      <p class="pricing__price">Contact</p>
    </div>
  </div>
</main>
</body>
</html>
