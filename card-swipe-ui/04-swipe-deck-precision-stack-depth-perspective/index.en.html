<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card stack piled with perspective projection — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sd is-demo" id="sd">
  <p class="sd__caption">Card stack piled with perspective projection</p>
  <div class="sd__scene" id="sdScene">
    <div class="sd__peek" id="sdPeek3" aria-hidden="true"></div>
    <div class="sd__peek" id="sdPeek2" aria-hidden="true"></div>
    <div class="sd__peek" id="sdPeek1" aria-hidden="true"></div>
    <div class="sd__card" id="sdCard" tabindex="0" role="group" aria-roledescription="Swipe card">
      <p class="sd__label" id="sdLabel">Home workout log</p>
    </div>
    <button class="sd__btn sd__btn--nope" id="sdNope" type="button" aria-label="Dislike">✕</button>
    <button class="sd__btn sd__btn--like" id="sdLike" type="button" aria-label="Like">♥</button>
  </div>
  <p class="sd__status" id="sdStatus" aria-live="polite">Waiting</p>
</div>
</main>
<script>
(function () {
  "use strict";

  // 값 하나: 인덱스가 하나 늘 때마다 원근 투영(초점거리 FOCAL) 으로 scale·translateY 가 줄어든다.
  var STACK_PERSPECTIVE_SCALE = 0.14;
  var FOCAL = 260;
  var STACK_SIZE = 3;
  var RELEASE_VELOCITY_MIN = 0.4;
  var EXIT_PX = 320;
  var CYCLE_S = 2;

  var root = document.getElementById("sd");
  var card = document.getElementById("sdCard");
  var label = document.getElementById("sdLabel");
  var status = document.getElementById("sdStatus");
  var btnLike = document.getElementById("sdLike");
  var btnNope = document.getElementById("sdNope");
  var peeks = [
    document.getElementById("sdPeek1"),
    document.getElementById("sdPeek2"),
    document.getElementById("sdPeek3")
  ];
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 원근 투영: depth_i = i * STACK_PERSPECTIVE_SCALE * FOCAL, scale_i = FOCAL / (FOCAL + depth_i)
  function layoutStack() {
    for (var i = 1; i <= STACK_SIZE; i++) {
      var depth = i * STACK_PERSPECTIVE_SCALE * FOCAL;
      var scale = FOCAL / (FOCAL + depth);
      var ty = -(1 - scale) * 60;
      var el = peeks[i - 1];
      el.style.transform = "translateY(" + ty.toFixed(2) + "%) scale(" + scale.toFixed(3) + ")";
      el.style.opacity = (1 - i * 0.24).toFixed(2);
      el.style.zIndex = String(STACK_SIZE - i);
    }
  }
  layoutStack();

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  var CARDS = ["Home workout log", "Reading list", "Travel notes", "Morning routine", "Evening walk", "Weekend café"];
  var rand = seedRand(51);
  var idx = Math.floor(rand() * CARDS.length);

  var dragging = false;
  var startX = 0, lastX = 0, lastT = 0, vx = 0;
  var x = 0, phase = "idle", exitDir = 1;

  function setCard() { label.textContent = CARDS[idx % CARDS.length]; }
  setCard();

  function render() {
    var rot = clamp(x * 0.09, -20, 20);
    card.style.transform = "translateX(" + x.toFixed(1) + "px) rotate(" + rot.toFixed(2) + "deg)";
  }

  function nextCard() {
    idx += 1; setCard();
    x = 0; vx = 0; phase = "idle";
    render();
    status.textContent = "Waiting";
  }

  function judge(velocity, dir) {
    root.classList.remove("is-demo");
    var flung = Math.abs(velocity) >= RELEASE_VELOCITY_MIN;
    if (reduce) {
      if (flung) { status.textContent = dir > 0 ? "Marked as liked" : "Marked as disliked"; nextCard(); }
      else { x = 0; render(); status.textContent = "Snapped back to center"; phase = "idle"; }
      return;
    }
    if (flung) { phase = "exit"; exitDir = dir; status.textContent = dir > 0 ? "Marked as liked" : "Marked as disliked"; }
    else { phase = "settle"; status.textContent = "Snapped back to center"; }
  }

  function startDrag(clientX) {
    root.classList.remove("is-demo");
    dragging = true; phase = "idle";
    startX = clientX; lastX = clientX; lastT = performance.now(); vx = 0;
  }
  function moveDrag(clientX) {
    if (!dragging) return;
    var now = performance.now();
    var dt = Math.max(now - lastT, 1);
    vx = (clientX - lastX) / dt;
    lastX = clientX; lastT = now;
    x = clientX - startX;
    render();
  }
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    judge(vx, x >= 0 ? 1 : -1);
  }

  card.addEventListener("pointerdown", function (e) { card.setPointerCapture(e.pointerId); startDrag(e.clientX); });
  card.addEventListener("pointermove", function (e) { moveDrag(e.clientX); });
  card.addEventListener("pointerup", endDrag);
  card.addEventListener("pointercancel", endDrag);

  function keyVerdict(dir) {
    root.classList.remove("is-demo");
    x = dir * 60; render();
    judge(dir * (RELEASE_VELOCITY_MIN + 0.3), dir);
  }
  card.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { e.preventDefault(); keyVerdict(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); keyVerdict(-1); }
  });
  btnLike.addEventListener("click", function () { keyVerdict(1); });
  btnNope.addEventListener("click", function () { keyVerdict(-1); });

  function step(dt) {
    if (phase === "exit") {
      x += exitDir * Math.max(Math.abs(vx), RELEASE_VELOCITY_MIN * 1.3) * dt;
      render();
      if (Math.abs(x) > EXIT_PX) nextCard();
    } else if (phase === "settle") {
      x += (0 - x) * 0.22;
      render();
      if (Math.abs(x) < 0.4) { x = 0; phase = "idle"; render(); }
    }
  }

  // .is-demo 자동 시연: 실제 pointer 없이 x·judge() 를 같은 경로로 호출한다.
  var start = null, lastNow = 0, prevT = 0, synthPhase = "wait";
  function synth(t) {
    if (t > 0.45 && t < 0.75 && synthPhase === "wait") synthPhase = "drag";
    if (synthPhase === "drag") {
      var p = clamp((t - 0.45) / 0.3, 0, 1);
      x = p * 130; render();
      if (t >= 0.75) { synthPhase = "afterDrag"; judge(RELEASE_VELOCITY_MIN + 0.35, 1); }
    }
    if (t > 1.3 && t < 1.55 && synthPhase === "afterDrag") synthPhase = "drag2";
    if (synthPhase === "drag2") {
      var q = clamp((t - 1.3) / 0.25, 0, 1);
      x = -q * 130; render();
      if (t >= 1.55) { synthPhase = "done"; judge(-(RELEASE_VELOCITY_MIN + 0.35), -1); }
    }
  }

  function loop(now) {
    if (start === null) { start = now; lastNow = now; lastT = now; }
    var dt = Math.min(now - lastNow, 48);
    lastNow = now;
    var t = ((now - start) / 1000) % CYCLE_S;
    if (t < prevT) synthPhase = "wait";
    prevT = t;
    if (!reduce && root.classList.contains("is-demo")) synth(t);
    if (!reduce) step(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
