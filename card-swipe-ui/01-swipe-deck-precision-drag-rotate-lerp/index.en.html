<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card rotation interpolated by drag distance — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dr is-demo" id="dr">
  <p class="dr__caption">Card rotation interpolated by drag distance</p>
  <div class="dr__scene" id="drScene">
    <div class="dr__card" id="drCard" tabindex="0" role="group" aria-roledescription="Swipe card">
      <p class="dr__label" id="drLabel">Morning routine</p>
    </div>
    <button class="dr__btn dr__btn--nope" id="drNope" type="button" aria-label="Dislike">✕</button>
    <button class="dr__btn dr__btn--like" id="drLike" type="button" aria-label="Like">♥</button>
  </div>
  <p class="dr__status" id="drStatus" aria-live="polite">Waiting</p>
</div>
</main>
<script>
(function () {
  "use strict";

  // 값 하나: 드래그 이동 거리(카드 폭 대비 %)에 회전각이 lerp 되어 기울어진다.
  var ROTATE_LERP_RATIO = 0.55;
  var ROTATE_MAX_DEG = 26;
  // 변형 3: 01 도 해제 판정을 가진다 — 속도가 이 값을 넘으면 날아가고 못 넘으면 되돌아온다.
  var SWIPE_VELOCITY_THRESHOLD_PX_MS = 0.3;
  var SETTLE_RATE = 0.24;
  var EXIT_PCT = 165;
  var CYCLE_S = 2;

  var root = document.getElementById("dr");
  var card = document.getElementById("drCard");
  var label = document.getElementById("drLabel");
  var status = document.getElementById("drStatus");
  var btnLike = document.getElementById("drLike");
  var btnNope = document.getElementById("drNope");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  var CARDS = ["Morning routine", "Evening walk", "Weekend café", "Home workout log", "Reading list", "Travel notes"];
  var rand = seedRand(11);
  var idx = Math.floor(rand() * CARDS.length);

  var dragging = false;
  var startX = 0, lastX = 0, lastT = 0, vx = 0;
  var pctX = 0;
  var phase = "idle"; // idle | exit | settle
  var exitDir = 1, exitPct = 0;

  function setCard() { label.textContent = CARDS[idx % CARDS.length]; }
  setCard();

  function render() {
    var rot = clamp(pctX * ROTATE_LERP_RATIO, -ROTATE_MAX_DEG, ROTATE_MAX_DEG);
    card.style.transform = "translateX(" + pctX.toFixed(2) + "%) rotate(" + rot.toFixed(2) + "deg)";
    root.style.setProperty("--tone", clamp(Math.abs(pctX) / 42, 0, 1).toFixed(2));
  }

  function nextCard() {
    idx += 1; setCard();
    pctX = 0; phase = "idle";
    card.style.transform = "translateX(0%) rotate(0deg)";
    root.style.setProperty("--tone", "0");
    status.textContent = "Waiting";
  }

  function judge(velocity, dir) {
    root.classList.remove("is-demo");
    var flung = Math.abs(velocity) >= SWIPE_VELOCITY_THRESHOLD_PX_MS;
    if (reduce) {
      if (flung) { status.textContent = dir > 0 ? "Marked as liked" : "Marked as disliked"; nextCard(); }
      else { pctX = 0; render(); status.textContent = "Snapped back to center"; phase = "idle"; }
      return;
    }
    if (flung) {
      phase = "exit"; exitDir = dir; exitPct = pctX;
      status.textContent = dir > 0 ? "Marked as liked" : "Marked as disliked";
    } else {
      phase = "settle";
      status.textContent = "Snapped back to center";
    }
  }

  function startDrag(clientX) {
    root.classList.remove("is-demo");
    dragging = true; phase = "idle";
    startX = clientX; lastX = clientX; lastT = performance.now(); vx = 0;
  }
  function moveDrag(clientX) {
    if (!dragging) return;
    var rect = card.getBoundingClientRect();
    var now = performance.now();
    var dt = Math.max(now - lastT, 1);
    vx = (clientX - lastX) / dt;
    lastX = clientX; lastT = now;
    pctX = ((clientX - startX) / rect.width) * 100;
    render();
  }
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    judge(vx, pctX >= 0 ? 1 : -1);
  }

  card.addEventListener("pointerdown", function (e) { card.setPointerCapture(e.pointerId); startDrag(e.clientX); });
  card.addEventListener("pointermove", function (e) { moveDrag(e.clientX); });
  card.addEventListener("pointerup", endDrag);
  card.addEventListener("pointercancel", endDrag);

  function keyVerdict(dir) {
    root.classList.remove("is-demo");
    pctX = dir * 60;
    render();
    judge(SWIPE_VELOCITY_THRESHOLD_PX_MS + 0.2, dir);
  }
  card.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { e.preventDefault(); keyVerdict(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); keyVerdict(-1); }
  });
  btnLike.addEventListener("click", function () { keyVerdict(1); });
  btnNope.addEventListener("click", function () { keyVerdict(-1); });

  function step(dt) {
    if (phase === "exit") {
      exitPct += exitDir * dt * 0.46;
      pctX = exitPct;
      render();
      if (Math.abs(exitPct) > EXIT_PCT) nextCard();
    } else if (phase === "settle") {
      pctX += (0 - pctX) * SETTLE_RATE;
      render();
      if (Math.abs(pctX) < 0.3) { pctX = 0; phase = "idle"; render(); }
    }
  }

  // .is-demo 자동 시연: 실제 pointer 없이 pctX·judge() 를 같은 경로로 호출한다.
  var start = null, lastNow = 0, prevT = 0, synthPhase = "wait";
  function synth(t) {
    if (t > 0.5 && t < 0.85 && synthPhase === "wait") synthPhase = "dragLike";
    if (synthPhase === "dragLike") {
      var p = clamp((t - 0.5) / 0.35, 0, 1);
      pctX = p * 46; render();
      if (t >= 0.85) { synthPhase = "afterLike"; judge(SWIPE_VELOCITY_THRESHOLD_PX_MS + 0.3, 1); }
    }
    if (t > 1.25 && t < 1.55 && synthPhase === "afterLike") synthPhase = "dragWeak";
    if (synthPhase === "dragWeak") {
      var q = clamp((t - 1.25) / 0.3, 0, 1);
      pctX = q * 9; render();
      if (t >= 1.55) { synthPhase = "done"; judge(0.05, 1); }
    }
  }

  function loop(now) {
    if (start === null) { start = now; lastNow = now; lastT = now; }
    var dt = Math.min(now - lastNow, 48);
    lastNow = now;
    var t = ((now - start) / 1000) % CYCLE_S;
    if (t < prevT) synthPhase = "wait";
    prevT = t;
    if (!reduce && root.classList.contains("is-demo")) synth(t);
    if (!reduce) step(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
