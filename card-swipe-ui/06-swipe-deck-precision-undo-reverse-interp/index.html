<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나간 경로를 거꾸로 재생해 되돌리는 스와이프 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ur is-demo" id="ur">
  <p class="ur__caption">나간 경로를 거꾸로 재생해 되돌리는 스와이프</p>
  <div class="ur__scene" id="urScene">
    <div class="ur__card" id="urCard" tabindex="0" role="group" aria-roledescription="스와이프 카드">
      <p class="ur__label" id="urLabel">아침 루틴</p>
    </div>
    <button class="ur__btn ur__btn--nope" id="urNope" type="button" aria-label="싫어요">✕</button>
    <button class="ur__btn ur__btn--undo" id="urUndo" type="button" aria-label="되돌리기">↺</button>
    <button class="ur__btn ur__btn--like" id="urLike" type="button" aria-label="좋아요">♥</button>
  </div>
  <p class="ur__status" id="urStatus" aria-live="polite">대기 중</p>
</div>
</main>
<script>
(function () {
  "use strict";

  // 값 하나: 카드가 나간 실제 경로를 PATH_SAMPLE_MS 간격으로 기록해 두었다가,
  // 되돌리기를 누르면 그 경로를 시간축을 뒤집어(역경로 보간) 그대로 재생한다.
  var PATH_SAMPLE_MS = 40;
  var UNDO_DURATION_S = 0.6;
  var RELEASE_VELOCITY_MIN = 0.38;
  var EXIT_PX = 320;
  var CYCLE_S = 2;

  var root = document.getElementById("ur");
  var card = document.getElementById("urCard");
  var label = document.getElementById("urLabel");
  var status = document.getElementById("urStatus");
  var btnLike = document.getElementById("urLike");
  var btnNope = document.getElementById("urNope");
  var btnUndo = document.getElementById("urUndo");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  var CARDS = ["아침 루틴", "저녁 산책", "주말 카페", "홈트 기록", "독서 목록", "여행 메모"];
  var rand = seedRand(78);
  var idx = Math.floor(rand() * CARDS.length);

  var dragging = false;
  var startX = 0, lastX = 0, lastT = 0, vx = 0;
  var x = 0, phase = "idle", exitDir = 1;
  var lastSampleT = 0;
  var path = [];        // 이번 카드가 실제로 지나간 경로 {t, x}
  var savedPath = null;  // 직전에 나간 카드의 경로 — 되돌리기용
  var savedLabel = null;
  var undoStart = 0;

  function setCard() { label.textContent = CARDS[idx % CARDS.length]; }
  setCard();

  function render() {
    var rot = clamp(x * 0.08, -20, 20);
    card.style.transform = "translateX(" + x.toFixed(1) + "px) rotate(" + rot.toFixed(2) + "deg)";
  }

  function recordSample(now) {
    if (now - lastSampleT < PATH_SAMPLE_MS) return;
    lastSampleT = now;
    path.push({ t: now, x: x });
  }

  function nextCard(keepPath) {
    if (keepPath && path.length >= 2) {
      savedPath = path.slice();
      savedLabel = label.textContent;
      btnUndo.disabled = false;
    }
    idx += 1; setCard();
    x = 0; vx = 0; phase = "idle"; path = [];
    render();
    status.textContent = "대기 중";
  }

  function judge(velocity, dir) {
    root.classList.remove("is-demo");
    var flung = Math.abs(velocity) >= RELEASE_VELOCITY_MIN;
    if (reduce) {
      if (flung) {
        status.textContent = dir > 0 ? "좋아요 처리됨" : "싫어요 처리됨";
        path = [{ t: performance.now() - 200, x: 0 }, { t: performance.now(), x: dir * EXIT_PX }];
        nextCard(true);
      } else { x = 0; render(); status.textContent = "제자리로 돌아옴"; phase = "idle"; }
      return;
    }
    if (flung) {
      phase = "exit"; exitDir = dir; path = [{ t: performance.now(), x: x }]; lastSampleT = performance.now();
      status.textContent = dir > 0 ? "좋아요 처리됨" : "싫어요 처리됨";
    } else {
      phase = "settle";
      status.textContent = "제자리로 돌아옴";
    }
  }

  function startDrag(clientX) {
    root.classList.remove("is-demo");
    dragging = true; phase = "idle"; path = []; lastSampleT = 0;
    startX = clientX; lastX = clientX; lastT = performance.now(); vx = 0;
  }
  function moveDrag(clientX) {
    if (!dragging) return;
    var now = performance.now();
    var dt = Math.max(now - lastT, 1);
    vx = (clientX - lastX) / dt;
    lastX = clientX; lastT = now;
    x = clientX - startX;
    render();
    recordSample(now);
  }
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    judge(vx, x >= 0 ? 1 : -1);
  }

  card.addEventListener("pointerdown", function (e) { card.setPointerCapture(e.pointerId); startDrag(e.clientX); });
  card.addEventListener("pointermove", function (e) { moveDrag(e.clientX); });
  card.addEventListener("pointerup", endDrag);
  card.addEventListener("pointercancel", endDrag);

  function keyVerdict(dir) {
    root.classList.remove("is-demo");
    path = [{ t: performance.now() - 200, x: 0 }];
    x = dir * 60; render();
    judge(dir * (RELEASE_VELOCITY_MIN + 0.3), dir);
  }
  card.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { e.preventDefault(); keyVerdict(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); keyVerdict(-1); }
  });
  btnLike.addEventListener("click", function () { keyVerdict(1); });
  btnNope.addEventListener("click", function () { keyVerdict(-1); });

  // 역경로 보간: 저장된 경로의 시간축을 뒤집어(T - u) 그 지점을 감싸는 두 샘플 사이를 선형보간한다.
  function sampleReverse(u) {
    var p = savedPath;
    var t0 = p[0].t, t1 = p[p.length - 1].t;
    var span = Math.max(t1 - t0, 1);
    var frac = clamp(u / UNDO_DURATION_S, 0, 1);
    var targetT = t1 - frac * span; // 시간을 거꾸로 훑는다
    for (var i = 0; i < p.length - 1; i++) {
      if (targetT >= p[i].t && targetT <= p[i + 1].t) {
        var seg = Math.max(p[i + 1].t - p[i].t, 0.001);
        var localFrac = (targetT - p[i].t) / seg;
        return p[i].x + (p[i + 1].x - p[i].x) * localFrac;
      }
    }
    return p[0].x;
  }

  function startUndo() {
    if (!savedPath || savedPath.length < 2) return;
    root.classList.remove("is-demo");
    idx -= 1; setCard();
    if (reduce) {
      x = savedPath[0].x; render();
      phase = "idle"; savedPath = null; btnUndo.disabled = true;
      status.textContent = "되돌림";
      return;
    }
    phase = "undo"; btnUndo.disabled = true;
    undoStart = performance.now();
    status.textContent = "경로를 거꾸로 재생해 되돌리는 중";
  }
  btnUndo.addEventListener("click", startUndo);
  btnUndo.disabled = true;

  function step(dt, now) {
    if (phase === "exit") {
      x += exitDir * Math.max(Math.abs(vx), RELEASE_VELOCITY_MIN * 1.4) * dt;
      render();
      recordSample(now);
      if (Math.abs(x) > EXIT_PX) { path.push({ t: now, x: x }); nextCard(true); }
    } else if (phase === "settle") {
      x += (0 - x) * 0.22;
      render();
      if (Math.abs(x) < 0.4) { x = 0; phase = "idle"; render(); }
    } else if (phase === "undo") {
      var u = (now - undoStart) / 1000;
      if (u >= UNDO_DURATION_S) {
        x = savedPath[0].x; render();
        phase = "idle"; savedPath = null; btnUndo.disabled = true;
        status.textContent = "되돌림";
      } else {
        x = sampleReverse(u);
        render();
      }
    }
  }

  // .is-demo 자동 시연: 실제 pointer 없이 x·judge()·되돌리기를 같은 경로로 호출한다.
  var start = null, lastNow = 0, prevT = 0, synthPhase = "wait";
  function synth(t, now) {
    if (t > 0.35 && t < 0.6 && synthPhase === "wait") synthPhase = "drag";
    if (synthPhase === "drag") {
      var p = clamp((t - 0.35) / 0.25, 0, 1);
      x = p * 120; render(); recordSample(now);
      if (t >= 0.6) { synthPhase = "exiting"; judge(RELEASE_VELOCITY_MIN + 0.4, 1); }
    }
    if (t > 1.15 && synthPhase === "exiting" && phase === "idle") synthPhase = "undoing";
    if (synthPhase === "undoing" && phase !== "undo") { startUndo(); synthPhase = "undone"; }
  }

  function loop(now) {
    if (start === null) { start = now; lastNow = now; lastT = now; }
    var dt = Math.min(now - lastNow, 48);
    lastNow = now;
    var t = ((now - start) / 1000) % CYCLE_S;
    if (t < prevT) synthPhase = "wait";
    prevT = t;
    if (!reduce && root.classList.contains("is-demo")) synth(t, now);
    if (!reduce) step(dt, now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
