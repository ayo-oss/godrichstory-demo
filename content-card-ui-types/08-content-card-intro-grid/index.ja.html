<section class="ig is-demo" id="ig" aria-label="サービス紹介">
  <article class="ig__hero">
    <span class="ig__tag">新バージョン</span>
    <div class="ig__line"><h2 class="ig__title">チームの作業をひとつの画面に</h2></div>
    <p class="ig__lede">散らばったファイルと予定をひとつの場所で見られます。</p>
    <a class="ig__link" href="#tour">サービスを見てみる</a>
  </article>

  <article class="ig__cell ig__cell--a">
    <svg class="ig__ic" aria-hidden="true"><use href="#igsparkle"/></svg>
    <h3 class="ig__name">すぐ始められる</h3>
    <p class="ig__note">設定は3分</p>
  </article>
  <article class="ig__cell ig__cell--b">
    <svg class="ig__ic" aria-hidden="true"><use href="#igclock"/></svg>
    <h3 class="ig__name">自動バックアップ</h3>
    <p class="ig__note">毎時保存</p>
  </article>
  <article class="ig__cell ig__cell--c">
    <svg class="ig__ic" aria-hidden="true"><use href="#iglockkey"/></svg>
    <h3 class="ig__name">権限管理</h3>
    <p class="ig__note">役割ごとのアクセス</p>
  </article>
  <article class="ig__cell ig__cell--d">
    <svg class="ig__ic" aria-hidden="true"><use href="#igsharenetwork"/></svg>
    <h3 class="ig__name">チーム共有</h3>
    <p class="ig__note">リンク1行で共有</p>
  </article>
</section>
</main>
<script>
// 사람이 만지면 미리보기 루프를 뗀다 — 뗀 뒤에도 다섯 칸은 grid-area 가 정한 자리에 그대로 있는다
var introGrid = document.getElementById('ig');
['pointerdown', 'focusin'].forEach(function (evt) {
  introGrid.addEventListener(evt, function () { introGrid.classList.remove('is-demo'); });
});
</script>
</body>
</html>
