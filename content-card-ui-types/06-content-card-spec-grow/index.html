<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스펙이 자라는 제품 카드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<svg class="sg__defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><symbol id="sgCaret" viewBox="0 0 256 256"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></symbol></svg>

<div class="sg is-demo" id="sg">
  <article class="sg__card">
    <span class="sg__thumb sg__thumb--a" aria-hidden="true"></span>
    <p class="sg__name">무선 조명</p>
    <p class="sg__price">39,000원</p>
    <button class="sg__more" type="button" aria-expanded="false" aria-label="무선 조명 스펙 보기">
      <span class="sg__label">스펙 보기</span>
      <svg class="sg__caret" aria-hidden="true"><use href="#sgCaret"/></svg>
    </button>
    <div class="sg__grow">
      <div class="sg__inner">
        <dl class="sg__spec">
          <div class="sg__pair"><dt class="sg__key">무게</dt><dd class="sg__val">420g</dd></div>
          <div class="sg__pair"><dt class="sg__key">전원</dt><dd class="sg__val">USB-C</dd></div>
          <div class="sg__pair"><dt class="sg__key">보증</dt><dd class="sg__val">1년</dd></div>
        </dl>
      </div>
    </div>
  </article>

  <article class="sg__card sg__card--pick">
    <span class="sg__thumb sg__thumb--b" aria-hidden="true"></span>
    <p class="sg__name">원목 선반</p>
    <p class="sg__price">58,000원</p>
    <button class="sg__more" type="button" aria-expanded="false" aria-label="원목 선반 스펙 보기">
      <span class="sg__label">스펙 보기</span>
      <svg class="sg__caret" aria-hidden="true"><use href="#sgCaret"/></svg>
    </button>
    <div class="sg__grow">
      <div class="sg__inner">
        <dl class="sg__spec">
          <div class="sg__pair"><dt class="sg__key">무게</dt><dd class="sg__val">3.1kg</dd></div>
          <div class="sg__pair"><dt class="sg__key">재질</dt><dd class="sg__val">오크</dd></div>
          <div class="sg__pair"><dt class="sg__key">보증</dt><dd class="sg__val">2년</dd></div>
        </dl>
      </div>
    </div>
  </article>

  <article class="sg__card">
    <span class="sg__thumb sg__thumb--c" aria-hidden="true"></span>
    <p class="sg__name">휴대 가습기</p>
    <p class="sg__price">27,000원</p>
    <button class="sg__more" type="button" aria-expanded="false" aria-label="휴대 가습기 스펙 보기">
      <span class="sg__label">스펙 보기</span>
      <svg class="sg__caret" aria-hidden="true"><use href="#sgCaret"/></svg>
    </button>
    <div class="sg__grow">
      <div class="sg__inner">
        <dl class="sg__spec">
          <div class="sg__pair"><dt class="sg__key">무게</dt><dd class="sg__val">260g</dd></div>
          <div class="sg__pair"><dt class="sg__key">용량</dt><dd class="sg__val">300ml</dd></div>
          <div class="sg__pair"><dt class="sg__key">보증</dt><dd class="sg__val">1년</dd></div>
        </dl>
      </div>
    </div>
  </article>
</div>
</main>
<script>
// 버튼 하나가 자기 카드만 연다 — 격자가 align-items: start 라 옆 칸은 그대로 있는다.
var sg = document.getElementById('sg');
sg.addEventListener('click', function (ev) {
  var btn = ev.target.closest('.sg__more');
  if (!btn) return;
  sg.classList.remove('is-demo');
  var open = btn.parentElement.classList.toggle('is-open');
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
});
</script>
</body>
</html>
