<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분위기를 먼저 보이는 이벤트 카드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<svg class="em__defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><symbol id="emPin" viewBox="0 0 256 256"><g fill="currentColor"><path d="M128 24a80 80 0 0 0-80 80c0 72 80 128 80 128s80-56 80-128a80 80 0 0 0-80-80m0 112a32 32 0 1 1 32-32a32 32 0 0 1-32 32" opacity=".2"/><path d="M128 64a40 40 0 1 0 40 40a40 40 0 0 0-40-40m0 64a24 24 0 1 1 24-24a24 24 0 0 1-24 24m0-112a88.1 88.1 0 0 0-88 88c0 31.4 14.51 64.68 42 96.25a254.2 254.2 0 0 0 41.45 38.3a8 8 0 0 0 9.18 0a254.2 254.2 0 0 0 41.37-38.3c27.45-31.57 42-64.85 42-96.25a88.1 88.1 0 0 0-88-88m0 206c-16.53-13-72-60.75-72-118a72 72 0 0 1 144 0c0 57.23-55.47 105-72 118"/></g></symbol></svg>

<ul class="em is-demo" id="em">
  <li class="em__card">
    <span class="em__mood em__mood--a" aria-hidden="true"></span>
    <div class="em__day">
      <b class="em__num">12</b>
      <span class="em__mon">10월</span>
    </div>
    <div class="em__body">
      <div class="em__line"><h3 class="em__title">밤의 재즈 소품집</h3></div>
      <p class="em__place"><svg class="em__ic" aria-hidden="true"><use href="#emPin"/></svg>연남 골목홀</p>
      <a class="em__link" href="#jazz">밤의 재즈 소품집 예매</a>
    </div>
  </li>
  <li class="em__card">
    <span class="em__mood em__mood--b" aria-hidden="true"></span>
    <div class="em__day">
      <b class="em__num">19</b>
      <span class="em__mon">10월</span>
    </div>
    <div class="em__body">
      <div class="em__line"><h3 class="em__title">종이 공예 워크숍</h3></div>
      <p class="em__place"><svg class="em__ic" aria-hidden="true"><use href="#emPin"/></svg>성수 작업실</p>
      <a class="em__link" href="#paper">종이 공예 워크숍 예매</a>
    </div>
  </li>
  <li class="em__card">
    <span class="em__mood em__mood--c" aria-hidden="true"></span>
    <div class="em__day">
      <b class="em__num">26</b>
      <span class="em__mon">10월</span>
    </div>
    <div class="em__body">
      <div class="em__line"><h3 class="em__title">가을 야외 상영회</h3></div>
      <p class="em__place"><svg class="em__ic" aria-hidden="true"><use href="#emPin"/></svg>한강 잔디마당</p>
      <a class="em__link" href="#screen">가을 야외 상영회 예매</a>
    </div>
  </li>
</ul>
</main>
<script>
// 사람이 만지면 미리보기 루프를 뗀다 — 뗀 뒤에도 색 띠는 기울어진 자리에 그대로 선다
var eventMood = document.getElementById('em');
['pointerdown', 'focusin'].forEach(function (evt) {
  eventMood.addEventListener(evt, function () { eventMood.classList.remove('is-demo'); });
});
</script>
</body>
</html>
