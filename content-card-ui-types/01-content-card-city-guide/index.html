    <a class="cg__link" href="#sokcho">속초 가이드 열기</a>

</main>
<script>
// 사람이 만지면 미리보기 루프를 뗀다 — 뗀 뒤에도 카드는 제자리에 그대로 선다
var cityGrid = document.getElementById('cg');
['pointerdown', 'focusin'].forEach(function (evt) {
  cityGrid.addEventListener(evt, function () { cityGrid.classList.remove('is-demo'); });
});
</script>
