<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabbed about-me card — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ab is-demo" id="ab">
  <div class="ab__head">
    <span class="ab__face" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M192 96a64 64 0 1 1-64-64a64 64 0 0 1 64 64" opacity=".2"/><path d="M230.92 212c-15.23-26.33-38.7-45.21-66.09-54.16a72 72 0 1 0-73.66 0c-27.39 8.94-50.86 27.82-66.09 54.16a8 8 0 1 0 13.85 8c18.84-32.56 52.14-52 89.07-52s70.23 19.44 89.07 52a8 8 0 1 0 13.85-8M72 96a56 56 0 1 1 56 56a56.06 56.06 0 0 1-56-56"/></g></svg></span>
    <span class="ab__who">
      <span class="ab__name">Dain Jung</span>
      <span class="ab__role">Front-end developer</span>
    </span>
  </div>

  <div class="ab__tabs">
    <input class="ab__radio" type="radio" name="abTab" id="abT1" checked>
    <label class="ab__tab" for="abT1">About</label>
    <input class="ab__radio" type="radio" name="abTab" id="abT2">
    <label class="ab__tab" for="abT2">Career</label>
    <input class="ab__radio" type="radio" name="abTab" id="abT3">
    <label class="ab__tab" for="abT3">Contact</label>
    <span class="ab__ink" aria-hidden="true"></span>
  </div>

  <div class="ab__body">
    <div class="ab__panel ab__panel--a">
      <p class="ab__line">Eight years of building screens for the web.</p>
      <p class="ab__line ab__line--dim">I like explaining things with small motions.</p>
    </div>

    <div class="ab__panel ab__panel--b">
      <p class="ab__row"><b class="ab__year">2021 — Now</b><span class="ab__job">Studio On · Front-end lead</span></p>
      <p class="ab__row"><b class="ab__year">2018 — 2021</b><span class="ab__job">Lightup · UI engineer</span></p>
    </div>

    <div class="ab__panel ab__panel--c">
      <a class="ab__mail" href="#dain-mail">
        <span class="ab__ico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="m224 56l-96 88l-96-88Z" opacity=".2"/><path d="M224 48H32a8 8 0 0 0-8 8v136a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a8 8 0 0 0-8-8m-20.57 16L128 133.15L52.57 64ZM216 192H40V74.19l82.59 75.71a8 8 0 0 0 10.82 0L216 74.19z"/></g></svg></span>
        Email Dain Jung
      </a>
      <p class="ab__line ab__line--dim">Weekday afternoons get the fastest reply.</p>
    </div>
  </div>
</div>
</main>
<script>
// 사람이 탭을 만지면 미리보기 루프를 끄고 라디오 입력의 :checked 경로로 넘긴다.
var ab = document.getElementById('ab');
function abHand() { ab.classList.remove('is-demo'); }
ab.addEventListener('pointerdown', abHand);
ab.addEventListener('keydown', abHand);
ab.addEventListener('change', abHand);
ab.addEventListener('focusin', abHand);
</script>
</body>
</html>
