<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>読む順番を守るウォーターフォール — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<ol class="wf is-demo" id="wf">
  <li class="wf__card wf__card--tall wf__card--s2">
    <span class="wf__no">2</span>
    <h3 class="wf__title">写真の選び方</h3>
    <p class="wf__meta">読了6分</p>
  </li>
  <li class="wf__card wf__card--s3">
    <span class="wf__no">3</span>
    <h3 class="wf__title">余白の目盛り</h3>
    <p class="wf__meta">3分</p>
  </li>
  <li class="wf__card wf__card--s4">
    <span class="wf__no">4</span>
    <h3 class="wf__title">色の名前の整理</h3>
    <p class="wf__meta">2分</p>
  </li>
  <li class="wf__card wf__card--tall wf__card--s5">
    <span class="wf__no">5</span>
    <h3 class="wf__title">長い見出しが折り返すとき</h3>
    <p class="wf__meta">読了7分</p>
  </li>
  <li class="wf__card wf__card--wide wf__card--s6">
    <span class="wf__no">6</span>
    <h3 class="wf__title">一覧カードの幅の決め方</h3>
    <p class="wf__meta">読了4分</p>
  </li>
  <li class="wf__card wf__card--pin wf__card--s1">
    <span class="wf__no">1</span>
    <h3 class="wf__title">今週のお知らせ</h3>
    <p class="wf__meta">固定した投稿</p>
  </li>
</ol>
</main>
<script>
// 사람이 만지면 미리보기 루프를 뗀다 — 뗀 뒤에도 여섯 칸은 dense 가 채운 자리에 그대로 있는다
var waterfall = document.getElementById('wf');
['pointerdown', 'focusin'].forEach(function (evt) {
  waterfall.addEventListener(evt, function () { waterfall.classList.remove('is-demo'); });
});
</script>
</body>
</html>
