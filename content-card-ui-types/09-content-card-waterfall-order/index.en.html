<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading-order waterfall — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<ol class="wf is-demo" id="wf">
  <li class="wf__card wf__card--tall wf__card--s2">
    <span class="wf__no">2</span>
    <h3 class="wf__title">How to pick photos</h3>
    <p class="wf__meta">6 min read</p>
  </li>
  <li class="wf__card wf__card--s3">
    <span class="wf__no">3</span>
    <h3 class="wf__title">Whitespace ruler</h3>
    <p class="wf__meta">3 min</p>
  </li>
  <li class="wf__card wf__card--s4">
    <span class="wf__no">4</span>
    <h3 class="wf__title">Naming colors</h3>
    <p class="wf__meta">2 min</p>
  </li>
  <li class="wf__card wf__card--tall wf__card--s5">
    <span class="wf__no">5</span>
    <h3 class="wf__title">When long titles wrap</h3>
    <p class="wf__meta">7 min read</p>
  </li>
  <li class="wf__card wf__card--wide wf__card--s6">
    <span class="wf__no">6</span>
    <h3 class="wf__title">Sizing list cards</h3>
    <p class="wf__meta">4 min read</p>
  </li>
  <li class="wf__card wf__card--pin wf__card--s1">
    <span class="wf__no">1</span>
    <h3 class="wf__title">This week's notice</h3>
    <p class="wf__meta">Pinned</p>
  </li>
</ol>
</main>
<script>
// 사람이 만지면 미리보기 루프를 뗀다 — 뗀 뒤에도 여섯 칸은 dense 가 채운 자리에 그대로 있는다
var waterfall = document.getElementById('wf');
['pointerdown', 'focusin'].forEach(function (evt) {
  waterfall.addEventListener(evt, function () { waterfall.classList.remove('is-demo'); });
});
</script>
</body>
</html>
