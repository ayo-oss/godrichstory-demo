<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>읽는 순서를 지키는 워터폴 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<ol class="wf is-demo" id="wf">
  <li class="wf__card wf__card--tall wf__card--s2">
    <span class="wf__no">2</span>
    <h3 class="wf__title">사진 고르는 기준</h3>
    <p class="wf__meta">읽는 데 6분</p>
  </li>
  <li class="wf__card wf__card--s3">
    <span class="wf__no">3</span>
    <h3 class="wf__title">여백 눈금</h3>
    <p class="wf__meta">3분</p>
  </li>
  <li class="wf__card wf__card--s4">
    <span class="wf__no">4</span>
    <h3 class="wf__title">색 이름 정리</h3>
    <p class="wf__meta">2분</p>
  </li>
  <li class="wf__card wf__card--tall wf__card--s5">
    <span class="wf__no">5</span>
    <h3 class="wf__title">긴 제목이 줄바꿈될 때</h3>
    <p class="wf__meta">읽는 데 7분</p>
  </li>
  <li class="wf__card wf__card--wide wf__card--s6">
    <span class="wf__no">6</span>
    <h3 class="wf__title">목록 카드 폭 잡기</h3>
    <p class="wf__meta">읽는 데 4분</p>
  </li>
  <li class="wf__card wf__card--pin wf__card--s1">
    <span class="wf__no">1</span>
    <h3 class="wf__title">이번 주 공지</h3>
    <p class="wf__meta">고정한 글</p>
  </li>
</ol>
</main>
<script>
// 사람이 만지면 미리보기 루프를 뗀다 — 뗀 뒤에도 여섯 칸은 dense 가 채운 자리에 그대로 있는다
var waterfall = document.getElementById('wf');
['pointerdown', 'focusin'].forEach(function (evt) {
  waterfall.addEventListener(evt, function () { waterfall.classList.remove('is-demo'); });
});
</script>
</body>
</html>
