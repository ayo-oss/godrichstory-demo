<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부력과 공기 저항, 노이즈 바람 속에서 떠다니는 방울 무리 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="hs is-demo" id="hs">
  <canvas class="hs__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="약한 가라앉음과 공기 저항, 노이즈 소용돌이 바람을 적분해 함께 흐르는 방울 무리. 누른 자리에서 돌풍이 분다"></canvas>
  <p class="hs__status" data-role="status" aria-live="off">같은 바람을 타고 흐르는 중</p>
  <div class="hs__tools">
    <button class="hs__btn" data-role="fine" type="button" aria-pressed="false">바람 촘촘하게</button>
    <button class="hs__btn" data-role="scatter" type="button">다시 풀기</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("hs");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    // 파스텔 팔레트 — 어두운 무대 위에 밝은 막을 얹어 명도 차로 방울이 읽힌다 (막의 무지갯빛은 이 표가 아니라 두께 계산에서 나온다)
    const BG = [29, 26, 44];
    const DEEP = [44, 39, 64];
    const PAPER = [255, 248, 234];
    const INK = [58, 48, 76];
    const MINT = [126, 226, 192];
    const SKY = [124, 196, 255];
    const LILAC = [190, 164, 255];
    const PINK = [255, 160, 190];
    const PEACH = [255, 208, 168];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !statusEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function onResize() {
        fitCanvas();
        draw();
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    // 화면 좌표(CSS px) → 장면 좌표(480x300). 리사이즈 뒤에도 늘 현재 크기로 다시 잰다
    function toScene(ev) {
        const r = cv.getBoundingClientRect();
        return [((ev.clientX - r.left) / r.width) * W, ((ev.clientY - r.top) / r.height) * H];
    }
    // 시드 고정 난수 — 같은 시드면 같은 장면이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 왼쪽 칸의 수치 — 이름표 한 줄 + 값 한 줄
    function panelRow(row, label, value) {
        const y = 112 + row * 34;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = rgba(PAPER, 0.62);
        ctx.font = '500 11px sans-serif';
        ctx.fillText(label, 16, y);
        ctx.fillStyle = rgba(PAPER, 0.96);
        ctx.font = '700 15px sans-serif';
        ctx.fillText(value, 16, y + 18);
    }
    function clearStage() {
        ctx.fillStyle = rgba(BG, 1);
        ctx.fillRect(0, 0, W, H);
    }
    // 2D 값 노이즈 — 정수 격자 꼭짓점마다 시드 난수 값(−1~1)을 두고 그 사이를 부드러운 곡선으로 잇는다
    const NOISE_SEED = 465;
    const noisePerm = new Uint8Array(512);
    const noiseVal = new Float32Array(256);
    {
        const nr = makeRng(NOISE_SEED);
        for (let i = 0; i < 256; i += 1) {
            noisePerm[i] = i;
            noiseVal[i] = nr() * 2 - 1;
        }
        for (let i = 255; i > 0; i -= 1) {
            const j = Math.floor(nr() * (i + 1));
            const t = noisePerm[i];
            noisePerm[i] = noisePerm[j];
            noisePerm[j] = t;
        }
        for (let i = 0; i < 256; i += 1) {
            noisePerm[i + 256] = noisePerm[i];
        }
    }
    function noiseHash(ix, iy) {
        return noiseVal[noisePerm[noisePerm[ix & 255] + (iy & 255)]];
    }
    function noise2(x, y) {
        const xi = Math.floor(x);
        const yi = Math.floor(y);
        const fx = x - xi;
        const fy = y - yi;
        const u = fx * fx * (3 - 2 * fx);
        const v = fy * fy * (3 - 2 * fy);
        const a = noiseHash(xi, yi);
        const b = noiseHash(xi + 1, yi);
        const c = noiseHash(xi, yi + 1);
        const d = noiseHash(xi + 1, yi + 1);
        return lerp(lerp(a, b, u), lerp(c, d, u), v);
    }
    // 막의 굴절률 — 비눗물 막을 물과 같은 값으로 둔다
    const FILM_N = 1.33;
    // 세 파장(nm) — 화면의 빨강·초록·파랑 채널을 이 파장 하나씩으로 대신한다
    const WAVE_RGB_NM = [650, 530, 450];
    // 표를 만들 두께 범위(nm) — 1nm 눈금마다 세 채널 값을 미리 구해 둔다
    const LUT_D_MAX = 1600;
    const filmLut = new Float32Array((LUT_D_MAX + 1) * 3);
    // 막 앞면과 뒷면에서 튕긴 두 빛이 두께만큼 어긋나 파장마다 남는 몫 — sin²(2π·n·d/λ).
    // 앞면에서 튕긴 빛만 위상이 뒤집히므로 두께 0 이면 세 채널이 모두 0(검은 막). 값은 0~1 로 맞춘 비율이지 실제 반사율(몇 %)이 아니다
    function reflectRGB(dNm) {
        const out = [0, 0, 0];
        for (let c = 0; c < 3; c += 1) {
            const s = Math.sin(2 * Math.PI * FILM_N * dNm / WAVE_RGB_NM[c]);
            out[c] = s * s;
        }
        return out;
    }
    for (let d = 0; d <= LUT_D_MAX; d += 1) {
        const r = reflectRGB(d);
        filmLut[d * 3] = r[0];
        filmLut[d * 3 + 1] = r[1];
        filmLut[d * 3 + 2] = r[2];
    }
    // 비스듬히 보면 빛이 막 안에서 꺾여 지나므로 어긋남이 cos(꺾인 각)배로 줄어든다 — cosView 는 시선과 법선 사이 각의 cos
    function insideCos(cosView) {
        const s2 = (1 - cosView * cosView) / (FILM_N * FILM_N);
        return Math.sqrt(1 - s2);
    }
    // 두께 d(nm) 에서 채널 c 의 몫 — 표를 1nm 사이에서 선형 보간해 읽는다
    function filmAt(dNm, c) {
        const d = clamp(dNm, 0, LUT_D_MAX - 1);
        const i = Math.floor(d);
        const f = d - i;
        return filmLut[i * 3 + c] * (1 - f) + filmLut[(i + 1) * 3 + c] * f;
    }
    // 캔버스 선·면에 쓸 막 색 — 어두운 무대 위에 세 채널 몫을 밝기로 얹는다
    function filmColor(dNm, gain) {
        return [BG[0] + filmAt(dNm, 0) * 235 * gain, BG[1] + filmAt(dNm, 1) * 235 * gain, BG[2] + filmAt(dNm, 2) * 235 * gain];
    }
    // 화소 하나를 막 색으로 — under 는 방울 뒤 바탕색, nx·ny·z 는 구면 위 법선(z 는 시선 쪽 성분)
    function shadeFilm(px, o, dNm, nx, ny, z, under, alpha) {
        const dEff = dNm * insideCos(z);
        // 가장자리일수록 시선이 막을 비스듬히 지나 색이 진하다 — 가운데는 뒤 바탕이 비쳐 보이게 낮춘다
        const amp = 0.22 + 0.78 * Math.pow(1 - z, 0.6);
        // 왼쪽 위에서 오는 빛 하나의 반짝임
        const hl = Math.pow(Math.max(0, nx * -0.42 + ny * -0.5 + z * 0.76), 60);
        for (let c = 0; c < 3; c += 1) {
            const v = under[c] + filmAt(dEff, c) * 235 * amp + hl * 220;
            px[o + c] = under[c] + (v - under[c]) * alpha;
        }
        px[o + 3] = 255;
    }
    // 바람 — 노이즈 값을 흐름 함수로 보고 그 기울기를 90도 돌려 소용돌이 장을 만든다.
    // 흘러드는 곳·빠져나가는 곳이 없는 장이라 방울이 한 점에 몰리지 않고 같은 소용돌이를 함께 탄다
    // 노이즈 격자 한 칸 = 1/WIND_SCALE px — 소용돌이 하나의 크기가 이 칸만 하다
    const WIND_SCALE = 0.004;
    // 바람 세기(px/s) — 흐름 함수의 기울기(노이즈 격자 단위)에 곱한다. 격자 크기를 바꿔도 세기는 그대로다
    const WIND_SPEED = 52;
    // 장 전체가 오른쪽으로 밀려가는 바탕 바람(px/s)
    const WIND_BASE_X = 16;
    // 노이즈 장이 시간에 따라 흘러가는 빠르기(격자 칸/초)
    const WIND_DRIFT = 0.16;
    function windAt(x, y, tSec, scale) {
        const z = tSec * WIND_DRIFT;
        const gx = x * scale;
        const gy = y * scale;
        const e = 0.01;
        // 흐름 함수 ψ 의 기울기를 격자 단위로 — (∂ψ/∂y, −∂ψ/∂x) 가 소용돌이 바람
        const dy = (noise2(gx + z, gy + e) - noise2(gx + z, gy - e)) / (2 * e);
        const dx = (noise2(gx + z + e, gy) - noise2(gx + z - e, gy)) / (2 * e);
        return [WIND_BASE_X + dy * WIND_SPEED, -dx * WIND_SPEED];
    }
    // 무게에서 부력을 뺀 아주 약한 가라앉음(px/s²) — 아래(+y)로 끈다
    const NET_SINK = 9;
    // 공기 저항(1/s) — 방울 속도와 바람 속도의 차에 비례해 그 차를 줄인다
    const DRAG_K = 1.6;
    // 한 스텝 적분 — 가속 = 가라앉음 + 저항×(바람 − 속도). 속도를 먼저 바꾸고 그 속도로 위치를 옮긴다
    function driftStep(b, dt, tSec, scale) {
        const w = windAt(b.x, b.y, tSec, scale);
        b.vx += DRAG_K * (w[0] - b.vx) * dt;
        b.vy += (NET_SINK + DRAG_K * (w[1] - b.vy)) * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
    }
    // 03 — 약한 가라앉음·공기 저항·노이즈 소용돌이 바람을 매 스텝 적분해 방울 무리가 흐른다
    const FLOCK_N = 26;
    const FLOCK_SEED = 465;
    // 자취로 남기는 지난 위치 수(3스텝마다 하나)
    const TRAIL_N = 14;
    // 누른 자리에서 부는 돌풍 — 닿는 반지름(px)과 가운데 세기(px/s)
    const GUST_R = 120;
    const GUST_V = 140;
    // 버튼으로 바꾸는 촘촘한 바람 — 노이즈 격자를 이 배수만큼 잘게
    const FINE_X = 3;
    const TXT_FLOW = '같은 바람을 타고 흐르는 중';
    const TXT_GUST = '바람을 불어 넣음';
    const TXT_FINE = '작은 소용돌이마다 갈라지는 중';
    const fineBtn = root.querySelector('[data-role="fine"]');
    const scatterBtn = root.querySelector('[data-role="scatter"]');
    const flock = [];
    let tSec = 0;
    let fine = false;
    let tick = 0;
    let gustAt = -1;
    let gustX = 0;
    let gustY = 0;
    let lastText = TXT_FLOW;
    function scale() { return fine ? WIND_SCALE * FINE_X : WIND_SCALE; }
    function scatter(seed) {
        const r = makeRng(seed);
        flock.length = 0;
        for (let i = 0; i < FLOCK_N; i += 1) {
            const b = { x: 20 + r() * (W - 40), y: 30 + r() * (H - 60), vx: 0, vy: 0, r: 8 + r() * 15, d0: 260 + r() * 420, ph: r() * 6.28,
                tx: new Float32Array(TRAIL_N), ty: new Float32Array(TRAIL_N), tn: 0 };
            for (let k = 0; k < TRAIL_N; k += 1) {
                b.tx[k] = b.x;
                b.ty[k] = b.y;
            }
            flock.push(b);
        }
    }
    function gust(x, y) {
        gustAt = 0;
        gustX = x;
        gustY = y;
        for (const b of flock) {
            const dx = b.x - x;
            const dy = b.y - y;
            const d = Math.hypot(dx, dy);
            if (d > GUST_R || d < 1e-3) {
                continue;
            }
            const k = GUST_V * (1 - d / GUST_R);
            b.vx += dx / d * k;
            b.vy += dy / d * k;
        }
    }
    function push(dx, dy) {
        for (const b of flock) {
            b.vx += dx;
            b.vy += dy;
        }
    }
    function wrap(b) {
        let jumped = false;
        if (b.x > W + b.r) {
            b.x -= W + 2 * b.r;
            jumped = true;
        }
        else if (b.x < -b.r) {
            b.x += W + 2 * b.r;
            jumped = true;
        }
        if (b.y > H + b.r) {
            b.y -= H + 2 * b.r;
            jumped = true;
        }
        else if (b.y < -b.r) {
            b.y += H + 2 * b.r;
            jumped = true;
        }
        if (jumped) {
            for (let k = 0; k < TRAIL_N; k += 1) {
                b.tx[k] = b.x;
                b.ty[k] = b.y;
            }
        }
    }
    function step() {
        const dt = FIXED_DT / 1000;
        tSec += dt;
        tick += 1;
        const s = scale();
        for (const b of flock) {
            driftStep(b, dt, tSec, s);
            wrap(b);
            if (tick % 3 === 0) {
                b.tn = (b.tn + 1) % TRAIL_N;
                b.tx[b.tn] = b.x;
                b.ty[b.tn] = b.y;
            }
        }
        if (gustAt >= 0) {
            gustAt += FIXED_DT;
            if (gustAt > 600) {
                gustAt = -1;
            }
        }
    }
    function settle() {
        gustAt = -1;
        say(lastText);
    }
    // 시연 — 1.6초마다 다른 자리에서 돌풍을 한 번
    const DEMO_GUSTS = [[300, 170], [190, 110], [380, 210]];
    let demoNext = 380;
    let demoIdx = 0;
    function demoTick(t) {
        if (t >= demoNext) {
            const g = DEMO_GUSTS[demoIdx % DEMO_GUSTS.length];
            gust(g[0], g[1]);
            demoIdx += 1;
            demoNext = t + 1600;
        }
    }
    // 바람 장을 짧은 흐름선으로 — 32px 격자 점마다 바람 방향으로 6번 따라간다
    function drawField() {
        const s = scale();
        ctx.strokeStyle = rgba(LILAC, 0.16);
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let gy = 16; gy < H; gy += 32) {
            for (let gx = 16; gx < W; gx += 32) {
                let x = gx;
                let y = gy;
                ctx.moveTo(x, y);
                for (let k = 0; k < 6; k += 1) {
                    const w = windAt(x, y, tSec, s);
                    const m = Math.hypot(w[0], w[1]) || 1;
                    x += w[0] / m * 4;
                    y += w[1] / m * 4;
                    ctx.lineTo(x, y);
                }
            }
        }
        ctx.stroke();
    }
    function drawBubble(b) {
        // 자취 — 오래된 위치일수록 옅게
        ctx.lineWidth = 1.2;
        for (let k = 1; k < TRAIL_N; k += 1) {
            const a = (b.tn + k) % TRAIL_N;
            const c = (b.tn + k + 1) % TRAIL_N;
            ctx.strokeStyle = rgba(SKY, 0.22 * k / TRAIL_N);
            ctx.beginPath();
            ctx.moveTo(b.tx[a], b.ty[a]);
            ctx.lineTo(b.tx[c], b.ty[c]);
            ctx.stroke();
        }
        const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r);
        g.addColorStop(0, rgba(PAPER, 0.05));
        g.addColorStop(1, rgba(LILAC, 0.16));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        // 둘레 12조각 — 위쪽이 얇은 막 두께로 조각마다 색을 계산한다
        ctx.lineWidth = 2;
        for (let k = 0; k < 12; k += 1) {
            const a0 = k / 12 * Math.PI * 2;
            const a1 = (k + 1) / 12 * Math.PI * 2;
            const d = b.d0 * (1 + 0.3 * Math.sin((a0 + a1) / 2)) + 60 * Math.sin(tSec * 0.8 + b.ph);
            ctx.strokeStyle = rgba(filmColor(d, 1.25), 0.95);
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, a0, a1 + 0.02);
            ctx.stroke();
        }
        ctx.fillStyle = rgba(PAPER, 0.85);
        ctx.beginPath();
        ctx.arc(b.x - b.r * 0.38, b.y - b.r * 0.42, Math.max(b.r * 0.14, 1.2), 0, Math.PI * 2);
        ctx.fill();
    }
    function draw() {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(BG, 1));
        g.addColorStop(1, rgba(DEEP, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        drawField();
        if (gustAt >= 0) {
            const k = gustAt / 600;
            ctx.strokeStyle = rgba(MINT, 0.6 * (1 - k));
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(gustX, gustY, 10 + k * GUST_R, 0, Math.PI * 2);
            ctx.stroke();
        }
        for (const b of flock) {
            drawBubble(b);
        }
        ctx.textAlign = 'right';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = rgba(PAPER, 0.62);
        ctx.font = '500 11px sans-serif';
        ctx.fillText('소용돌이 크기', W - 14, 22);
        ctx.fillStyle = rgba(PAPER, 0.96);
        ctx.font = '700 14px sans-serif';
        ctx.fillText(String(Math.round(1 / scale())) + ' px', W - 14, 40);
    }
    function after(text) {
        lastText = text;
        say(text);
        draw();
    }
    function setFine(v) {
        fine = v;
        if (fineBtn) {
            fineBtn.setAttribute('aria-pressed', v ? 'true' : 'false');
        }
        after(v ? TXT_FINE : TXT_FLOW);
    }
    // 움직임 줄이기에서는 돌풍 뒤 0.5초만큼을 한 번에 적분해 옮겨 놓은 한 장을 그린다
    function settleMove() {
        if (!still) {
            return;
        }
        for (let k = 0; k < 31; k += 1) {
            step();
        }
        gustAt = -1;
    }
    cv.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        wake();
        const p = toScene(ev);
        gust(p[0], p[1]);
        settleMove();
        after(TXT_GUST);
    });
    cv.addEventListener('keydown', function (ev) {
        const k = ev.key;
        if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') {
            ev.preventDefault();
            wake();
            push(k === 'ArrowLeft' ? -60 : (k === 'ArrowRight' ? 60 : 0), k === 'ArrowUp' ? -60 : (k === 'ArrowDown' ? 60 : 0));
            settleMove();
            after(TXT_GUST);
        }
        else if (k === 'Enter') {
            ev.preventDefault();
            wake();
            setFine(!fine);
        }
        else if (k === 'Home') {
            ev.preventDefault();
            wake();
            scatter(FLOCK_SEED);
            after(TXT_FLOW);
        }
    });
    if (fineBtn) {
        fineBtn.addEventListener('click', function () { wake(); setFine(!fine); });
    }
    if (scatterBtn) {
        scatterBtn.addEventListener('click', function () { wake(); scatter(FLOCK_SEED + 1 + tick); after(TXT_FLOW); });
    }
    scatter(FLOCK_SEED);
    // 처음부터 무리가 바람을 타고 있게 1.5초를 미리 흘려 둔다
    for (let k = 0; k < 94; k += 1) {
        step();
    }
    say(TXT_FLOW);
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    let clock = 0;
    let looping = false;
    function frame(ts) {
        if (!looping) {
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 순간이동 대신 이어서 움직인다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            clock += FIXED_DT;
            if (demo) {
                demoTick(clock);
            }
            step();
            acc -= FIXED_DT;
            n += 1;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (looping) {
            return;
        }
        looping = true;
        lastTs = -1;
        acc = 0;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        looping = false;
        window.cancelAnimationFrame(rafId);
    }
    // 움직임 줄이기 설정을 페이지를 연 채로 바꿔도 바로 따른다 — 켜면 루프를 멈추고 끝난 장면 한 장, 끄면 다시 돈다
    function applyMotion() {
        still = reduceQuery.matches;
        if (still) {
            stopLoop();
            settle();
            draw();
        }
        else {
            startLoop();
        }
    }
    reduceQuery.addEventListener('change', applyMotion);
    applyMotion();
    return function () {
        stopLoop();
        reduceQuery.removeEventListener('change', applyMotion);
        window.removeEventListener('resize', onResize);
    };
})();
</script>
</body>
</html>
