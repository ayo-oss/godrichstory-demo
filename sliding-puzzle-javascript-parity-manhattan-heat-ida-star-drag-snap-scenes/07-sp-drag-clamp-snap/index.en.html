<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Pointer Drag That Snaps Into a Cell on Release — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="Sliding puzzle stage: drag a tile and let go, arrow keys move a tile beside the blank, Enter or Space pauses, N takes one step, R restarts">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="On the 4×4 board a pointer ring drags a tile beside the blank. The tile follows only along the axis toward the blank and is clamped at one cell width, and a dotted line joins the pointer to the tile. The ruler on the right shows the dragged amount from 0 to 1 with a mark at SNAP_RATIO 0.5: past the mark on release it snaps into the blank, short of it the tile returns. Recent results pile up as dots. The gauge below shows the constant name and its current value, and under reduced motion only one board where the tiles swap places at once is drawn"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">Sliding puzzle scene</p>
  <div class="vj__ctrl">
    <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
  </div>
  <p class="vj__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function easeOut(k) { const u = 1 - clamp(k, 0, 1); return 1 - u * u * u; }
    // 파스텔 팔레트 — 바탕은 짙은 자두색, 타일은 연한 색 위에 짙은 잉크 숫자
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    const ROSE = [244, 162, 186];
    const MINT = [148, 212, 182];
    const SKY = [150, 192, 244];
    const SUN = [250, 218, 146];
    const NEU = [236, 230, 250];
    const BGC = [46, 42, 68];
    const PANEL = [62, 57, 92];
    const DIM = [196, 190, 224];
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function hsl(h, s, l) {
        const a = s * Math.min(l, 1 - l);
        const f = function (n) {
            const k = (n + h / 30) % 12;
            return l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
        };
        return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
    }
    // 정수 해시 — 같은 (a, b) 에는 늘 같은 0 이상 1 미만 값. 난수 함수는 쓰지 않는다
    function hash2(a, b) {
        let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        h = h ^ (h >>> 16);
        return (h >>> 0) / 4294967296;
    }
    // 2차원 값 잡음 — 정수 격자점마다 해시 값이 있고 그 사이를 부드럽게 잇는다
    function noise2(x, y, seed) {
        const xi = Math.floor(x);
        const yi = Math.floor(y);
        const fx = x - xi;
        const fy = y - yi;
        const ux = fx * fx * (3 - 2 * fx);
        const uy = fy * fy * (3 - 2 * fy);
        const s = seed * 131;
        return lerp(lerp(hash2(xi + s, yi), hash2(xi + 1 + s, yi), ux), lerp(hash2(xi + s, yi + 1), hash2(xi + 1 + s, yi + 1), ux), uy);
    }
    // 장면 시계(초)·판 반복 번호·시간표 — 시간표는 (시각, 할 일) 목록이고 시각이 지나면 한 번씩 부른다
    let sceneT = 0;
    let lap = 0;
    let script = [];
    let evAt = 0;
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, a, b, c) {
        return s.split('{a}').join(a).split('{b}').join(b === undefined ? '' : b).split('{c}').join(c === undefined ? '' : c);
    }
    function r1(v) { return String(Math.round(v * 10) / 10); }
    function group(v) {
        // 천 단위 점 — 로케일 함수에 기대지 않는다
        const s = String(Math.round(v));
        let o = '';
        for (let i = 0; i < s.length; i += 1) {
            if (i > 0 && (s.length - i) % 3 === 0) {
                o += ',';
            }
            o += s.charAt(i);
        }
        return o;
    }
    // ── 퍼즐 모델 — 판은 번호 배열, 0 은 빈칸, 타일 v 의 제자리는 v-1 번 칸, 빈칸의 제자리는 맨 끝
    // 빈칸이 움직이는 방향 d: 0 오른쪽 · 1 왼쪽 · 2 아래 · 3 위. 반대 방향은 d ^ 1
    const DX = [1, -1, 0, 0];
    const DY = [0, 0, 1, -1];
    function solvedBoard(n) {
        const b = [];
        for (let i = 1; i < n * n; i += 1) {
            b.push(i);
        }
        b.push(0);
        return b;
    }
    function canStep(b, n, d) {
        const z = b.indexOf(0);
        const c = (z % n) + DX[d];
        const r = Math.floor(z / n) + DY[d];
        return c >= 0 && c < n && r >= 0 && r < n;
    }
    function blankStep(b, n, d) {
        if (!canStep(b, n, d)) {
            return false;
        }
        const z = b.indexOf(0);
        const t = z + DX[d] + DY[d] * n;
        b[z] = b[t];
        b[t] = 0;
        return true;
    }
    // 역전 — 번호를 한 줄로 늘어놓고 앞 번호가 뒤 번호보다 큰 쌍의 수(빈칸은 세지 않는다)
    function inversions(b) {
        let c = 0;
        for (let i = 0; i < b.length; i += 1) {
            for (let j = i + 1; j < b.length; j += 1) {
                if (b[i] !== 0 && b[j] !== 0 && b[i] > b[j]) {
                    c += 1;
                }
            }
        }
        return c;
    }
    // 빈칸이 아래서 몇 번째 줄인지(맨 아래 줄 = 1)
    function blankRow(b, n) { return n - Math.floor(b.indexOf(0) / n); }
    // 판정 합 — 짝수 폭은 역전 + 빈칸 줄, 홀수 폭은 역전만
    function parity(b, n) { return n % 2 === 0 ? inversions(b) + blankRow(b, n) : inversions(b); }
    function solvable(b, n) {
        return n % 2 === 0 ? parity(b, n) % 2 === 1 : parity(b, n) % 2 === 0;
    }
    function manhattan(b, n, i) {
        const v = b[i];
        if (v === 0) {
            return 0;
        }
        const h = v - 1;
        return Math.abs((i % n) - (h % n)) + Math.abs(Math.floor(i / n) - Math.floor(h / n));
    }
    function sumH(b, n) {
        let s = 0;
        for (let i = 0; i < b.length; i += 1) {
            s += manhattan(b, n, i);
        }
        return s;
    }
    function placedCount(b) {
        let c = 0;
        for (let i = 0; i < b.length - 1; i += 1) {
            if (b[i] === i + 1) {
                c += 1;
            }
        }
        return c;
    }
    function isSolved(b) { return placedCount(b) === b.length - 1 && b[b.length - 1] === 0; }
    // Shuffle by walking — Done 판에서 시작해 빈칸을 steps 번 이웃 칸으로 옮긴다. 방금 온 칸으로 되돌아가는 수는 건너뛰고
    // 어느 이웃으로 갈지는 정수 해시로 고른다. 반환은 빈칸이 움직인 방향의 목록
    function walkMoves(n, steps, seed) {
        const b = solvedBoard(n);
        const out = [];
        let noBacktrack = -1;
        for (let s = 0; s < steps; s += 1) {
            const opts = [];
            for (let d = 0; d < 4; d += 1) {
                if (d !== noBacktrack && canStep(b, n, d)) {
                    opts.push(d);
                }
            }
            const d = opts[Math.floor(hash2(s, seed) * opts.length)];
            blankStep(b, n, d);
            out.push(d);
            noBacktrack = d ^ 1;
        }
        return out;
    }
    function applyMoves(b, n, ms) {
        for (let i = 0; i < ms.length; i += 1) {
            blankStep(b, n, ms[i]);
        }
    }
    function reverseMoves(ms) {
        const o = [];
        for (let i = ms.length - 1; i >= 0; i -= 1) {
            o.push(ms[i] ^ 1);
        }
        return o;
    }
    // 줄째 밀기 — 누른 칸 i 가 빈칸과 같은 줄이면 사이 타일이 모두 한 칸씩 빈칸 쪽으로. 배열 교환으로 먼저 정하고
    // 옮겨진 타일 번호를 빈칸에 가까운 순서로 돌려준다
    function rowChain(b, n, i) {
        const z = b.indexOf(0);
        if (i === z) {
            return [];
        }
        let step = 0;
        if (Math.floor(i / n) === Math.floor(z / n)) {
            step = i > z ? 1 : -1;
        }
        else if (i % n === z % n) {
            step = i > z ? n : -n;
        }
        else {
            return [];
        }
        const moved = [];
        for (let p = z; p !== i; p += step) {
            b[p] = b[p + step];
            moved.push(b[p]);
        }
        b[i] = 0;
        return moved;
    }
    function idaStar(start, n, cap) {
        const b = start.slice();
        const path = [];
        let nodes = 0;
        let capHit = false;
        const INF = 9999;
        let z = b.indexOf(0);
        function dfs(g, h, bound, last) {
            nodes += 1;
            if (nodes > cap) {
                capHit = true;
                return INF;
            }
            const f = g + h;
            if (f > bound) {
                return f;
            }
            if (h === 0) {
                return -1;
            }
            let min = INF;
            for (let d = 0; d < 4; d += 1) {
                if (last >= 0 && d === (last ^ 1)) {
                    continue;
                }
                const c = (z % n) + DX[d];
                const r = Math.floor(z / n) + DY[d];
                if (c < 0 || c >= n || r < 0 || r >= n) {
                    continue;
                }
                const t = z + DX[d] + DY[d] * n;
                const v = b[t];
                const hv = Math.abs((t % n) - ((v - 1) % n)) + Math.abs(Math.floor(t / n) - Math.floor((v - 1) / n));
                const hn = Math.abs((z % n) - ((v - 1) % n)) + Math.abs(Math.floor(z / n) - Math.floor((v - 1) / n));
                b[z] = v;
                b[t] = 0;
                const oz = z;
                z = t;
                path.push(d);
                const res = dfs(g + 1, h - hv + hn, bound, d);
                if (res === -1) {
                    return -1;
                }
                path.pop();
                z = oz;
                b[t] = v;
                b[z] = 0;
                if (capHit) {
                    return INF;
                }
                if (res < min) {
                    min = res;
                }
            }
            return min;
        }
        let bound = sumH(b, n);
        const bounds = [];
        const perBound = [];
        while (bound < INF) {
            const before = nodes;
            bounds.push(bound);
            const res = dfs(0, sumH(b, n), bound, -1);
            perBound.push(nodes - before);
            if (res === -1) {
                return { path: path.slice(), nodes: nodes, bounds: bounds, perBound: perBound, capHit: false };
            }
            if (capHit || res >= INF) {
                break;
            }
            bound = res;
        }
        return { path: [], nodes: nodes, bounds: bounds, perBound: perBound, capHit: capHit };
    }
    // ── 판 화면 — 타일마다 지금 칸 → 목표 칸 보간. 배열은 먼저 바뀌고 화면이 뒤따른다
    const BX = 24;
    const BY = 44;
    const BSZ = 216;
    let bd = [];
    let BN = 4;
    let CS = 54;
    let tl = [];
    let dragV = -1;
    let dragCx = 0;
    let dragCy = 0;
    function setBoard(b, n) {
        bd = b.slice();
        BN = n;
        CS = BSZ / n;
        tl = [];
        dragV = -1;
        for (let v = 0; v < n * n; v += 1) {
            const i = bd.indexOf(v);
            const c = i % n;
            const r = Math.floor(i / n);
            tl.push({ fx: c, fy: r, tx: c, ty: r, t0: 0, du: 0 });
        }
    }
    let still = false;
    function tilePos(v) {
        const t = tl[v];
        if (v === dragV) {
            return [dragCx, dragCy];
        }
        if (still || t.du <= 0) {
            return [t.tx, t.ty];
        }
        const e = easeOut((sceneT - t.t0) / t.du);
        return [lerp(t.fx, t.tx, e), lerp(t.fy, t.ty, e)];
    }
    // 배열이 바뀐 뒤 타일마다 목표 칸을 다시 읽는다 — 옮겨진 타일만 지금 화면 자리에서 출발한다
    function retarget(delayOf, du) {
        for (let v = 1; v < BN * BN; v += 1) {
            const i = bd.indexOf(v);
            const c = i % BN;
            const r = Math.floor(i / BN);
            const t = tl[v];
            if (c !== t.tx || r !== t.ty) {
                const p = tilePos(v);
                t.fx = p[0];
                t.fy = p[1];
                t.tx = c;
                t.ty = r;
                t.t0 = sceneT + delayOf(v);
                t.du = du;
            }
        }
    }
    function stepBlank(d, du) {
        if (!blankStep(bd, BN, d)) {
            return false;
        }
        retarget(function () { return 0; }, du);
        return true;
    }
    function cellAt(x, y) {
        const c = Math.floor((x - BX) / CS);
        const r = Math.floor((y - BY) / CS);
        if (c < 0 || c >= BN || r < 0 || r >= BN) {
            return -1;
        }
        return r * BN + c;
    }
    // ── 그리기 도구
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const doneEl = root.querySelector('[data-role="done"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !doneEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const doneP = doneEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const UI_FONT = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 계산은 늘 480×300 이고 화면 배율만 이 값
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function disc(x, y, r, c, a) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function seg(x1, y1, x2, y2, c, a, w) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = w;
        ctx.lineCap = 'round';
        ctx.stroke();
    }
    function text(s, x, y, c, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + UI_FONT;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, 1);
        ctx.fillText(s, x, y);
    }
    function panel(x, y, w, h) { box(x, y, w, h, 12, PANEL, 1); }
    // 아래쪽 눈금 — 상수 이름과 지금 값 · 크기 막대
    function hud(name, val, frac) {
        const label = name + ' ' + val;
        ctx.font = '700 11px ' + UI_FONT;
        const w = ctx.measureText(label).width + 20;
        const x = 12;
        const y = H - 30;
        box(x, y, w, 20, 10, NEU, 0.96);
        text(label, x + w / 2, y + 10.5, INK, 11, 700, 'center');
        const mx = x + w + 10;
        box(mx, y + 6, 140, 8, 4, [78, 72, 104], 1);
        box(mx, y + 6, 140 * clamp(frac, 0, 1), 8, 4, MINT, 1);
    }
    // 판 바탕 — 받침과 빈 칸 홈
    function drawBoardBase() {
        const s = CS * BN;
        box(BX - 5, BY - 5, s + 10, s + 10, 12, PANEL, 1);
        for (let i = 0; i < BN * BN; i += 1) {
            box(BX + (i % BN) * CS + 2, BY + Math.floor(i / BN) * CS + 2, CS - 4, CS - 4, 8, [40, 36, 62], 1);
        }
    }
    function tileHue(v, n) {
        return hsl(190 + 160 * ((v - 1) / (n * n - 2)), 0.55, 0.8);
    }
    function paintTile(label, cx, cy, c, cs, ox, oy) {
        const s = cs - 4;
        const x = ox + cx * cs + 2;
        const y = oy + cy * cs + 2;
        box(x, y + 2, s, s, 8, [26, 23, 42], 0.5);
        box(x, y, s, s, 8, c, 1);
        box(x + 3, y + 2, s - 6, 3, 1.5, [255, 255, 255], 0.4);
        text(label, x + s / 2, y + s / 2 + 1, INK, Math.max(9, Math.round(cs * 0.38)), 800, 'center');
    }
    function drawTiles(fillOf) {
        for (let v = 1; v < BN * BN; v += 1) {
            const p = tilePos(v);
            paintTile(String(v), p[0], p[1], fillOf(v), CS, BX, BY);
        }
    }
    // 글자판 없이 배열만 그리는 작은 판 — 비교 장면용
    function drawMini(b, n, ox, oy, size) {
        const cs = size / n;
        box(ox - 3, oy - 3, size + 6, size + 6, 8, PANEL, 1);
        for (let i = 0; i < n * n; i += 1) {
            const v = b[i];
            if (v === 0) {
                box(ox + (i % n) * cs + 1, oy + Math.floor(i / n) * cs + 1, cs - 2, cs - 2, 3, [40, 36, 62], 1);
                continue;
            }
            const x = ox + (i % n) * cs + 1;
            const y = oy + Math.floor(i / n) * cs + 1;
            box(x, y, cs - 2, cs - 2, 3, tileHue(v, n), 1);
            if (cs >= 20) {
                text(String(v), x + (cs - 2) / 2, y + (cs - 2) / 2 + 1, INK, Math.round(cs * 0.4), 800, 'center');
            }
        }
    }
    // ── 상태 줄·낭독 문장
    const SPK_PLACE = '{a}x{a} board, {c} of {b} tiles are in place';
    const SPK_DONE = '{a}x{a} board complete, all {b} tiles are in place';
    function speakBoard() {
        const t = BN * BN - 1;
        return isSolved(bd) ? fill(SPK_DONE, String(BN), String(t)) : fill(SPK_PLACE, String(BN), String(t), String(placedCount(bd)));
    }
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고, 그 뒤부터 모드가 바뀔 때만 낭독 문장을 쓴다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    // 사람이 직접 조작하는 중이면 시간표는 멈추고 계산만 흐른다
    let manual = false;
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
    }
    function takeOver() {
        if (manual) {
            return;
        }
        manual = true;
        wake();
    }
    // 낭독 모드 — 완성이면 1000, 손으로 하는 중이면 맞은 타일 수, 자동 시연이면 장면이 정한 단계
    function modeBase(sceneMode) {
        if (isSolved(bd)) {
            return 1000;
        }
        return manual ? 100 + placedCount(bd) : sceneMode;
    }
    // 낭독 문장 — 화면 상태 줄(aria-live off)과 따로, 모드가 바뀔 때와 사람이 조작했을 때만 role=status 에 쓴다
    let lastMode = -9;
    function say() {
        doneP.textContent = speakText();
        lastMode = still ? -2 : modeId();
    }
    function advance(dt) {
        sceneT += dt;
        if (!manual) {
            while (evAt < script.length && script[evAt].t <= sceneT) {
                const ev = script[evAt];
                evAt += 1;
                ev.f();
            }
            if (sceneT >= LAP_S) {
                lap += 1;
                begin();
                return;
            }
        }
        update(dt);
    }
    function begin() {
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
    }
    // 고정 걸음 + 걸음 수 상한 — 프레임 간격이 흔들려도 같은 계산, 탭이 멈췄다 돌아와도 한 번에 몰리지 않는다
    const STEP_S = 1 / 60;
    const DT_MAX = 0.05;
    let acc = 0;
    function showNow() {
        draw();
        pushStatus(statusText());
        if (!demo) {
            const m = still ? -2 : modeId();
            if (m !== lastMode) {
                say();
            }
        }
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        acc += dt;
        while (acc >= STEP_S) {
            advance(STEP_S);
            acc -= STEP_S;
        }
        showNow();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        acc = 0;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 시간표의 REST_S 초까지를 한 번에 치른 판 한 장. 타일은 보간 없이 바로 제자리
    function showRest() {
        stopLoop();
        lap = 0;
        begin();
        while (evAt < script.length && script[evAt].t <= REST_S) {
            const ev = script[evAt];
            evAt += 1;
            sceneT = ev.t;
            ev.f();
        }
        sceneT = REST_S;
        update(0);
        showNow();
    }
    function play() {
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    // 사람이 조작한 뒤 — 멈춘 채이거나 움직임 줄이기이면 보간을 건너뛰어 바로 보이게 한다. 조작 직후는 낭독 문장도 쓴다
    function afterInput(speak) {
        if (paused || still) {
            sceneT += 1;
        }
        update(0);
        showNow();
        if (speak) {
            say();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
        say();
    }
    function restart() {
        manual = false;
        lap = 0;
        begin();
        update(0);
        showNow();
        say();
    }
    // N 한 걸음 — 시간표의 다음 일 하나를 지금 치른다. 시간표가 끝났으면 처음부터 다시 짠 뒤 첫 일
    function stepOnce() {
        takeOver();
        if (evAt >= script.length) {
            lap += 1;
            begin();
        }
        if (evAt < script.length) {
            const ev = script[evAt];
            evAt += 1;
            if (sceneT < ev.t) {
                sceneT = ev.t;
            }
            ev.f();
        }
        afterInput(true);
    }
    function keyMove(dx, dy) {
        // 방향키는 타일이 가는 방향 — 그 타일은 빈칸의 반대쪽에 있다. 빈칸이 가는 방향으로 바꿔 부른다
        let d = 0;
        for (let k = 0; k < 4; k += 1) {
            if (DX[k] === -dx && DY[k] === -dy) {
                d = k;
            }
        }
        takeOver();
        onDir(d);
        afterInput(true);
    }
    function toCanvas(e) {
        const r = cv.getBoundingClientRect();
        return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    // 키보드 — 무대에 포커스가 있을 때만. 방향키 = 빈칸 이웃 타일 이동, Enter·Space = Pause, N = 한 걸음, R = 처음부터
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        const k = e.key;
        if (k === 'Enter' || k === ' ' || k === 'p' || k === 'P') {
            e.preventDefault();
            togglePause();
        }
        else if (k === 'r' || k === 'R') {
            restart();
        }
        else if (k === 'n' || k === 'N') {
            e.preventDefault();
            stepOnce();
        }
        else if (k === 'ArrowLeft') {
            e.preventDefault();
            keyMove(-1, 0);
        }
        else if (k === 'ArrowRight') {
            e.preventDefault();
            keyMove(1, 0);
        }
        else if (k === 'ArrowUp') {
            e.preventDefault();
            keyMove(0, -1);
        }
        else if (k === 'ArrowDown') {
            e.preventDefault();
            keyMove(0, 1);
        }
        else if (keyHook !== null && keyHook(k)) {
            e.preventDefault();
            takeOver();
            afterInput(true);
        }
    }, { signal: off.signal });
    // 포인터 — 마우스·터치·펜을 한 이벤트로. 누르는 순간부터 놓을 때까지 무대가 포인터를 붙잡는다
    let ptrDown = false;
    // 장면이 방향키·Enter·N·R 밖의 키를 받고 싶을 때 거는 갈고리 — 먹었으면 true
    let keyHook = null;
    pad.addEventListener('pointerdown', function (e) {
        takeOver();
        ptrDown = true;
        try {
            pad.setPointerCapture(e.pointerId);
        }
        catch (err) {
            ptrDown = true;
        }
        const p = toCanvas(e);
        onPtr(0, p[0], p[1]);
        afterInput(false);
    }, { signal: off.signal });
    pad.addEventListener('pointermove', function (e) {
        if (!ptrDown) {
            return;
        }
        const p = toCanvas(e);
        onPtr(1, p[0], p[1]);
        afterInput(false);
    }, { signal: off.signal });
    function ptrEnd(e) {
        if (!ptrDown) {
            return;
        }
        ptrDown = false;
        const p = toCanvas(e);
        onPtr(2, p[0], p[1]);
        afterInput(true);
    }
    pad.addEventListener('pointerup', ptrEnd, { signal: off.signal });
    pad.addEventListener('pointercancel', ptrEnd, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 판 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            lap = 0;
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        showNow();
    }, { signal: off.signal });
    // 누른 칸이 빈칸의 이웃이면 그 타일이 들어갈 빈칸의 방향(빈칸 기준), 아니면 -1
    function dirOfCell(i) {
        const z = bd.indexOf(0);
        for (let d = 0; d < 4; d += 1) {
            if (canStep(bd, BN, d) && z + DX[d] + DY[d] * BN === i) {
                return d;
            }
        }
        return -1;
    }
    // 07 — 타일을 누르고 끌면 빈칸 방향의 한 축으로만 따라오고 한 칸 폭을 넘지 못하게 자른다(clamp). 놓을 때 이동량이 SNAP_RATIO 이상이면 빈칸으로 들어가고 못 미치면 제자리로 돌아온다. 포인터 이벤트 하나로 마우스와 터치가 같이 된다
    const TILE_N = 4;
    const SNAP_RATIO = 0.5;
    const RAW_MAX = 1.6;
    const SETTLE_S = 0.14;
    const DRAG_S = 0.36;
    const HOLD_S = 0.12;
    const CYCLE_S = 0.78;
    const RAWS = [0.85, 0.3, 1.45, 0.62, 0.42, 1.2, 0.7, 0.25];
    const SHUFFLE_07 = 24;
    const LAP_S = 6.6;
    const REST_S = 2.4;
    const PX = 256;
    const PW = 216;
    let dragging = false;
    let dragCell = -1;
    let axX = 0;
    let axY = 0;
    let startX = 0;
    let startY = 0;
    let ptrX = 0;
    let ptrY = 0;
    let rawK = 0;
    let lastRaw = -1;
    let results = [];
    let au = { on: false, cell: -1, raw: 0, wob: 0, t0: 0 };
    const STAT_NONE = 'Drag a tile beside the blank and let go';
    const STAT_DRAG_SNAP = 'Dragging, dragged {a} of a cell: on release it snaps into the blank';
    const STAT_DRAG_BACK = 'Dragging, dragged {a} of a cell: on release it returns';
    const STAT_IDLE_SNAP = 'Last release at {a}: it snapped into the blank';
    const STAT_IDLE_BACK = 'Last release at {a}: it went back';
    const SPK_SNAP = 'The tile was dragged {a} of a cell width and snapped into the blank';
    const SPK_BACK = 'The tile was dragged only {a} of a cell width and went back';
    const V_SNAP = 'Snap';
    const V_BACK = 'Return';
    function clampK() { return clamp(rawK, 0, 1); }
    function dragBegin(i, x, y) {
        const d = dirOfCell(i);
        if (d < 0 || dragging) {
            return;
        }
        const z = bd.indexOf(0);
        dragging = true;
        dragCell = i;
        dragV = bd[i];
        axX = (z % BN) - (i % BN);
        axY = Math.floor(z / BN) - Math.floor(i / BN);
        startX = x;
        startY = y;
        ptrX = x;
        ptrY = y;
        rawK = 0;
        dragCx = i % BN;
        dragCy = Math.floor(i / BN);
    }
    // 포인터가 어디에 있든 타일은 빈칸 방향 축으로 투영한 양만큼, 0 ~ 1 칸 안에서만 따라온다
    function dragMove(x, y) {
        if (!dragging) {
            return;
        }
        ptrX = x;
        ptrY = y;
        rawK = ((x - startX) * axX + (y - startY) * axY) / CS;
        const k = clampK();
        dragCx = (dragCell % BN) + axX * k;
        dragCy = Math.floor(dragCell / BN) + axY * k;
    }
    function dragEnd() {
        if (!dragging) {
            return;
        }
        dragging = false;
        const v = dragV;
        const k = clampK();
        const fx = dragCx;
        const fy = dragCy;
        const ox = dragCell % BN;
        const oy = Math.floor(dragCell / BN);
        dragV = -1;
        const t = tl[v];
        // 놓는 순간 타일이 있던 자리(끌린 자리)를 출발점으로 삼는다
        t.tx = fx;
        t.ty = fy;
        t.du = 0;
        const snap = k >= SNAP_RATIO;
        if (snap) {
            blankStep(bd, BN, dirOfCell(dragCell));
            retarget(function () { return 0; }, SETTLE_S);
        }
        else {
            t.fx = fx;
            t.fy = fy;
            t.tx = ox;
            t.ty = oy;
            t.t0 = sceneT;
            t.du = SETTLE_S;
        }
        lastRaw = rawK;
        results.push(snap);
        if (results.length > 8) {
            results.shift();
        }
    }
    function finishAuto() {
        if (!au.on) {
            return;
        }
        const c = tileCenter(au.cell);
        dragMove(c[0] + axX * au.raw * CS, c[1] + axY * au.raw * CS);
        dragEnd();
        au.on = false;
    }
    function tileCenter(i) {
        return [BX + ((i % BN) + 0.5) * CS, BY + (Math.floor(i / BN) + 0.5) * CS];
    }
    // 시연 — 빈칸의 이웃 중 하나를 해시로 골라 RAWS[k] 칸만큼 끌었다 놓는다. 옆으로도 흔들지만 축 밖 움직임은 잘려 나간다
    function autoStart(k) {
        finishAuto();
        const z = bd.indexOf(0);
        const nbs = [];
        for (let d = 0; d < 4; d += 1) {
            if (canStep(bd, BN, d)) {
                nbs.push(z + DX[d] + DY[d] * BN);
            }
        }
        const cell = nbs[Math.floor(hash2(k, 31 + lap) * nbs.length)];
        const c = tileCenter(cell);
        dragBegin(cell, c[0], c[1]);
        au = { on: true, cell: cell, raw: RAWS[k % RAWS.length], wob: 0.35 * (hash2(k, 5) < 0.5 ? -1 : 1), t0: sceneT };
    }
    function autoAt(k) {
        return function () { autoStart(k); };
    }
    function build() {
        dragging = false;
        dragV = -1;
        au = { on: false, cell: -1, raw: 0, wob: 0, t0: 0 };
        results = [];
        lastRaw = -1;
        rawK = 0;
        const b = solvedBoard(TILE_N);
        applyMoves(b, TILE_N, walkMoves(TILE_N, SHUFFLE_07, 13 + lap));
        setBoard(b, TILE_N);
        for (let k = 0; k < 8; k += 1) {
            script.push({ t: 0.3 + k * CYCLE_S, f: autoAt(k) });
        }
    }
    function update(dt) {
        if (dt < 0 || !au.on) {
            return;
        }
        const u = (sceneT - au.t0) / DRAG_S;
        if (u >= 1 + HOLD_S / DRAG_S) {
            finishAuto();
            return;
        }
        const e = u < 1 ? (u < 0 ? 0 : u * u * (3 - 2 * u)) : 1;
        const c = tileCenter(au.cell);
        const px = -axY;
        const py = axX;
        const lat = au.wob * CS * Math.sin(clamp(u, 0, 1) * Math.PI * 1.5);
        dragMove(c[0] + axX * au.raw * e * CS + px * lat, c[1] + axY * au.raw * e * CS + py * lat);
    }
    function draw() {
        ctx.fillStyle = rgba(BGC, 1);
        ctx.fillRect(0, 0, W, H);
        drawBoardBase();
        drawTiles(function (v) { return tileHue(v, BN); });
        if (dragging) {
            const p = tilePos(dragV);
            const x = BX + p[0] * CS;
            const y = BY + p[1] * CS;
            ctx.beginPath();
            ctx.roundRect(x + 1, y + 1, CS - 2, CS - 2, 9);
            ctx.strokeStyle = rgba(PAPER, 1);
            ctx.lineWidth = 3;
            ctx.stroke();
            // 포인터와 타일 중심을 잇는 점선 — 축 밖으로 벗어난 만큼이 잘려 나간 몫
            const cx = x + CS / 2;
            const cy = y + CS / 2;
            const n = 8;
            for (let i = 0; i < n; i += 2) {
                seg(lerp(cx, ptrX, i / n), lerp(cy, ptrY, i / n), lerp(cx, ptrX, (i + 1) / n), lerp(cy, ptrY, (i + 1) / n), PAPER, 0.8, 2);
            }
            ctx.beginPath();
            ctx.arc(ptrX, ptrY, 9, 0, TAU);
            ctx.strokeStyle = rgba(ROSE, 1);
            ctx.lineWidth = 3;
            ctx.stroke();
            disc(ptrX, ptrY, 3, ROSE, 1);
        }
        const s = CS * BN;
        panel(PX, BY - 5, PW, s + 10);
        const shownRaw = dragging ? rawK : (lastRaw >= 0 ? lastRaw : 0);
        const shownK = clamp(shownRaw, 0, 1);
        text('SNAP_RATIO', PX + 12, BY + 12, DIM, 11, 700, 'left');
        text(String(SNAP_RATIO), PX + PW - 12, BY + 12, NEU, 15, 800, 'right');
        text('raw', PX + 12, BY + 36, DIM, 11, 700, 'left');
        text(String(Math.round(shownRaw * 100) / 100), PX + PW - 12, BY + 36, NEU, 15, 800, 'right');
        text('clamp', PX + 12, BY + 58, DIM, 11, 700, 'left');
        text(String(Math.round(shownK * 100) / 100), PX + PW - 12, BY + 58, NEU, 15, 800, 'right');
        // 눈금 — 0 ~ RAW_MAX 칸. 1 칸 선에서 잘리고 SNAP_RATIO 위치에 붙는 기준 표시
        const rx = PX + 14;
        const rw = PW - 28;
        const ry = BY + 76;
        box(rx, ry, rw, 12, 6, [48, 44, 74], 1);
        box(rx, ry, rw * shownK / RAW_MAX, 12, 6, shownK >= SNAP_RATIO ? MINT : SKY, 1);
        seg(rx + rw * SNAP_RATIO / RAW_MAX, ry - 4, rx + rw * SNAP_RATIO / RAW_MAX, ry + 16, PAPER, 1, 2);
        seg(rx + rw / RAW_MAX, ry - 4, rx + rw / RAW_MAX, ry + 16, ROSE, 1, 2);
        text('0.5', rx + rw * SNAP_RATIO / RAW_MAX, ry + 24, DIM, 10, 700, 'center');
        text('1', rx + rw / RAW_MAX, ry + 24, DIM, 10, 700, 'center');
        if (dragging || lastRaw >= 0) {
            disc(rx + rw * clamp(shownRaw, 0, RAW_MAX) / RAW_MAX, ry + 6, 5, ROSE, 1);
        }
        const okNow = shownK >= SNAP_RATIO;
        box(PX + 12, BY + 118, PW - 24, 24, 12, lastRaw < 0 && !dragging ? [88, 82, 122] : (okNow ? MINT : SKY), 1);
        text(lastRaw < 0 && !dragging ? '-' : (dragging ? '→ ' : '') + (okNow ? V_SNAP : V_BACK), PX + PW / 2, BY + 130, lastRaw < 0 && !dragging ? NEU : INK, 12, 800, 'center');
        // 최근 놓은 결과 여덟 개 — 채운 점은 Snap, 빈 고리는 Return
        for (let i = 0; i < 8; i += 1) {
            const x = PX + 22 + i * 24;
            if (i < results.length) {
                if (results[i]) {
                    disc(x, BY + 168, 8, MINT, 1);
                }
                else {
                    ctx.beginPath();
                    ctx.arc(x, BY + 168, 7, 0, TAU);
                    ctx.strokeStyle = rgba(SKY, 1);
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }
            else {
                disc(x, BY + 168, 4, [88, 82, 122], 1);
            }
        }
        hud('SNAP_RATIO', String(SNAP_RATIO), SNAP_RATIO);
    }
    function statusText() {
        if (dragging) {
            return fill(clampK() >= SNAP_RATIO ? STAT_DRAG_SNAP : STAT_DRAG_BACK, r1(clampK() * 100) + '%');
        }
        if (lastRaw < 0) {
            return STAT_NONE;
        }
        const k = clamp(lastRaw, 0, 1);
        return fill(k >= SNAP_RATIO ? STAT_IDLE_SNAP : STAT_IDLE_BACK, r1(k * 100) + '%');
    }
    function modeId() { return modeBase(0); }
    function speakText() {
        if (lastRaw < 0) {
            return speakBoard();
        }
        const k = clamp(lastRaw, 0, 1);
        return fill(k >= SNAP_RATIO ? SPK_SNAP : SPK_BACK, r1(k * 100) + '%') + '. ' + speakBoard();
    }
    function onDir(d) { stepBlank(d, SETTLE_S); }
    function onPtr(kind, x, y) {
        if (kind === 0) {
            if (au.on) {
                finishAuto();
            }
            dragBegin(cellAt(x, y), x, y);
        }
        else if (kind === 1) {
            dragMove(x, y);
        }
        else {
            dragEnd();
        }
    }
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
