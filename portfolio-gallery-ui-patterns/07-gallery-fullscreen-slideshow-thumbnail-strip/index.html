<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — full-bleed slideshow with thumbnail strip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ss-wrap">
    <div class="ss-viewport" tabindex="0" aria-label="슬라이드쇼, 왼쪽·오른쪽 화살표 키로 이동">
      <ul class="ss-track is-demo">
        <li class="ss-slide ss-slide--a"></li>
        <li class="ss-slide ss-slide--b"></li>
        <li class="ss-slide ss-slide--c"></li>
        <li class="ss-slide ss-slide--d"></li>
        <li class="ss-slide ss-slide--a" aria-hidden="true"></li>
      </ul>
    </div>
    <div class="ss-thumbs is-demo" role="tablist" aria-label="슬라이드 선택">
      <button class="ss-thumb ss-thumb--a" type="button" role="tab" aria-label="1번째 사진"></button>
      <button class="ss-thumb ss-thumb--b" type="button" role="tab" aria-label="2번째 사진"></button>
      <button class="ss-thumb ss-thumb--c" type="button" role="tab" aria-label="3번째 사진"></button>
      <button class="ss-thumb ss-thumb--d" type="button" role="tab" aria-label="4번째 사진"></button>
    </div>
  </div>
</main>
<script>
(function () {
  var viewport = document.querySelector('.ss-viewport');
  var track = document.querySelector('.ss-track');
  var thumbsWrap = document.querySelector('.ss-thumbs');
  var thumbs = document.querySelectorAll('.ss-thumb');
  var real = 4, current = 0;
  function stop() { track.classList.remove('is-demo'); thumbsWrap.classList.remove('is-demo'); }
  function go(i) {
    stop();
    current = i;
    track.style.transform = 'translateX(-' + (i * 20) + '%)';
    thumbs.forEach(function (t, idx) { t.setAttribute('aria-selected', idx === i ? 'true' : 'false'); t.classList.toggle('is-active', idx === i); });
  }
  thumbs.forEach(function (t, i) { t.addEventListener('click', function () { go(i); }); });
  viewport.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { go((current + 1) % real); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { go((current - 1 + real) % real); e.preventDefault(); }
  });
})();
</script>
</body>
</html>
