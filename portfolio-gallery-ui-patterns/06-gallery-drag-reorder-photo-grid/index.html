<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — drag-to-reorder photo grid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="rg-list is-demo" aria-label="드래그하거나 화살표 키로 사진 순서 바꾸기">
    <li class="rg-tile" tabindex="0"><span class="rg-tile__img rg-tile__img--a"></span><span class="rg-tile__handle" aria-hidden="true">⠿</span></li>
    <li class="rg-tile" tabindex="0"><span class="rg-tile__img rg-tile__img--b"></span><span class="rg-tile__handle" aria-hidden="true">⠿</span></li>
    <li class="rg-tile" tabindex="0"><span class="rg-tile__img rg-tile__img--c"></span><span class="rg-tile__handle" aria-hidden="true">⠿</span></li>
  </ul>
</main>
<script>
(function () {
  var list = document.querySelector('.rg-list');
  Array.prototype.forEach.call(list.children, function (tile) {
    var startX = 0, dx = 0, dragging = false;
    tile.addEventListener('pointerdown', function (e) {
      list.classList.remove('is-demo');
      dragging = true; startX = e.clientX; tile.classList.add('is-dragging');
      tile.setPointerCapture(e.pointerId);
    });
    tile.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      dx = e.clientX - startX;
      tile.style.transform = 'translateX(' + dx + 'px)';
    });
    function end() {
      if (!dragging) return;
      dragging = false; tile.classList.remove('is-dragging');
      var target = dx > 30 ? tile.nextElementSibling : dx < -30 ? tile.previousElementSibling : null;
      tile.style.transform = '';
      if (target) list.insertBefore(dx > 0 ? target : tile, dx > 0 ? tile : target);
      dx = 0;
    }
    tile.addEventListener('pointerup', end);
    tile.addEventListener('pointercancel', end);
    tile.addEventListener('keydown', function (e) {
      list.classList.remove('is-demo');
      var sib = e.key === 'ArrowRight' ? tile.nextElementSibling : e.key === 'ArrowLeft' ? tile.previousElementSibling : null;
      if (!sib) return;
      e.preventDefault();
      if (e.key === 'ArrowRight') list.insertBefore(sib, tile); else list.insertBefore(tile, sib);
      tile.focus({ preventScroll: true });
    });
  });
})();
</script>
</body>
</html>
