<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">

<title>Gallery — scrim caption reveal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="cr-gallery is-demo" aria-label="キャプション付きの写真ギャラリー">
    <li class="cr-card" tabindex="0">
      <span class="cr-card__img cr-card__img--a"></span>
      <span class="cr-card__scrim" aria-hidden="true"></span>
      <span class="cr-card__caption">Kyoto, 2024</span>
    </li>
    <li class="cr-card" tabindex="0">
      <span class="cr-card__img cr-card__img--b"></span>
      <span class="cr-card__scrim" aria-hidden="true"></span>
      <span class="cr-card__caption">Studio Nine</span>
    </li>
    <li class="cr-card" tabindex="0">
      <span class="cr-card__img cr-card__img--c"></span>
      <span class="cr-card__scrim" aria-hidden="true"></span>
      <span class="cr-card__caption">Seoul rooftop</span>
    </li>
  </ul>
</main>
</body>
</html>
