<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — grid-to-single-view morph transition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="g-frame is-demo">
    <div class="g-grid" role="radiogroup" aria-label="写真を選んで大きく見る">
      <label class="g-tile"><input type="radio" name="g-sel" class="g-radio" aria-label="1枚目の写真を大きく見る"><span class="g-tile__img g-tile__img--a"></span></label>
      <label class="g-tile"><input type="radio" name="g-sel" class="g-radio" aria-label="2枚目の写真を大きく見る"><span class="g-tile__img g-tile__img--b"></span></label>
      <label class="g-tile"><input type="radio" name="g-sel" class="g-radio" aria-label="3枚目の写真を大きく見る"><span class="g-tile__img g-tile__img--c"></span></label>
      <label class="g-tile"><input type="radio" name="g-sel" class="g-radio" aria-label="4枚目の写真を大きく見る"><span class="g-tile__img g-tile__img--d"></span></label>
      <label class="g-tile"><input type="radio" name="g-sel" class="g-radio" aria-label="5枚目の写真を大きく見る"><span class="g-tile__img g-tile__img--e"></span></label>
      <label class="g-tile"><input type="radio" name="g-sel" class="g-radio" aria-label="6枚目の写真を大きく見る"><span class="g-tile__img g-tile__img--f"></span></label>
    </div>
  </div>
</main>
<script>
(function () {
  var frame = document.querySelector('.g-frame');
  var radios = document.querySelectorAll('.g-radio');
  function stopDemo() { frame.classList.remove('is-demo'); if (window.__gIv) clearInterval(window.__gIv); }
  // 라디오는 같은 것을 다시 눌러도 기본으로는 안 꺼진다 — 눌렀을 때 이미 켜져 있으면 직접 끈다 (다시 클릭하면 격자로)
  radios.forEach(function (r) {
    r.addEventListener('pointerdown', function (e) {
      stopDemo();
      if (r.checked) { e.preventDefault(); r.checked = false; }
    });
    r.addEventListener('keydown', function (e) {
      stopDemo();
      if (e.key === 'Enter' || e.key === ' ') { if (r.checked) { e.preventDefault(); r.checked = false; } }
    });
  });
  if (frame.classList.contains('is-demo')) {
    var step = 0;
    window.__gIv = setInterval(function () {
      var i = Math.floor(step / 2) % radios.length;
      radios[i].checked = step % 2 === 0;
      step++;
    }, 600);
  }
})();
</script>
</body>
</html>
