<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — tag-filterable portfolio grid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pf-frame is-demo">
    <div class="pf-chips" role="group" aria-label="Filter by category">
      <label class="pf-chip"><input type="checkbox" class="pf-check" data-cat="web"><span>Web</span></label>
      <label class="pf-chip"><input type="checkbox" class="pf-check" data-cat="app"><span>App</span></label>
      <label class="pf-chip"><input type="checkbox" class="pf-check" data-cat="brand"><span>Brand</span></label>
    </div>
    <div class="pf-grid">
      <article class="pf-card" data-cat="web"><span class="pf-card__img pf-card__img--a"></span><span class="pf-card__title">Studio site</span></article>
      <article class="pf-card" data-cat="app"><span class="pf-card__img pf-card__img--b"></span><span class="pf-card__title">Habit app</span></article>
      <article class="pf-card" data-cat="brand"><span class="pf-card__img pf-card__img--c"></span><span class="pf-card__title">Cafe brand</span></article>
      <article class="pf-card" data-cat="web"><span class="pf-card__img pf-card__img--d"></span><span class="pf-card__title">Shop site</span></article>
    </div>
  </div>
</main>
<script>
(function () {
  var frame = document.querySelector('.pf-frame');
  if (!frame.classList.contains('is-demo')) return;
  var boxes = document.querySelectorAll('.pf-check'), i = 0;
  var iv = setInterval(function () {
    boxes.forEach(function (b) { b.checked = false; });
    boxes[i].checked = true;
    i = (i + 1) % boxes.length;
  }, 700);
  boxes.forEach(function (b) {
    b.addEventListener('change', function () { frame.classList.remove('is-demo'); clearInterval(iv); });
  });
})();
</script>
</body>
</html>
