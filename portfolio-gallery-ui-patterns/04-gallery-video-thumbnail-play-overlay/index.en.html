<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — video thumbnail grid with play overlay</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="vgallery is-demo" aria-label="Video gallery">
    <li class="vcard">
      <span class="vcard__thumb vcard__thumb--a"></span>
      <span class="vcard__ring" aria-hidden="true"></span>
      <button class="vcard__play" type="button" aria-label="Play video">▶</button>
      <span class="vcard__time">0:32</span>
    </li>
    <li class="vcard">
      <span class="vcard__thumb vcard__thumb--b"></span>
      <span class="vcard__ring" aria-hidden="true"></span>
      <button class="vcard__play" type="button" aria-label="Play video">▶</button>
      <span class="vcard__time">1:05</span>
    </li>
    <li class="vcard">
      <span class="vcard__thumb vcard__thumb--c"></span>
      <span class="vcard__ring" aria-hidden="true"></span>
      <button class="vcard__play" type="button" aria-label="Play video">▶</button>
      <span class="vcard__time">0:48</span>
    </li>
  </ul>
</main>
</body>
</html>
