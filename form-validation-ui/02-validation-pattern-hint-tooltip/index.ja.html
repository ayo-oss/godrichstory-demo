<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern hint tooltip — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ph is-demo" id="ph">
    <div class="ph__tip" id="ph-tip" role="tooltip">
      <span class="ph__seg" data-seg="0">010</span><span class="ph__dash" data-seg="0">-</span><span class="ph__seg" data-seg="1">1234</span><span class="ph__dash" data-seg="1">-</span><span class="ph__seg" data-seg="2">5678</span>
    </div>
    <label class="ph__label" for="ph-input">携帯番号</label>
    <div class="ph__field">
      <input class="ph__input" id="ph-input" type="tel" autocomplete="off" inputmode="numeric" aria-describedby="ph-tip" placeholder="数字だけ入力してください">
      <span class="ph__ghost" aria-hidden="true">010-1234-5678</span>
    </div>
  </div>
</main>
<script>
// 실제 동작: 포커스에 예시 툴팁이 열리고, 친 값이 세 조각 정규식을 통과할 때마다 그 조각이 확정 색으로 굳는다.
var ph = document.getElementById('ph');
var phInput = document.getElementById('ph-input');
var PH_RULES = [/^010/, /^010-?\d{4}/, /^010-?\d{4}-?\d{4}$/];
function phPaint() {
  ph.classList.remove('is-demo'); // 사람이 손대면 자동 루프를 멈춘다
  var v = phInput.value;
  var done = 0;
  PH_RULES.forEach(function (re, i) { if (re.test(v)) done = i + 1; });
  ph.setAttribute('data-done', String(done));
  phInput.setAttribute('aria-invalid', done === 3 ? 'false' : 'true');
}
phInput.addEventListener('focus', function () { ph.classList.remove('is-demo'); ph.classList.add('is-open'); phPaint(); });
phInput.addEventListener('blur', function () { ph.classList.remove('is-open'); });
phInput.addEventListener('input', function () {
  var d = phInput.value.replace(/\D/g, '').slice(0, 11);
  phInput.value = d.length > 7 ? d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7)
                : d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d;
  phPaint();
});
</script>
</body>
</html>
