<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll to first error — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <form class="fe is-demo" id="fe" novalidate>
    <div class="fe__viewport" id="fe-viewport">
      <div class="fe__track" id="fe-track">
        <div class="fe__row"><span class="fe__cap">氏名</span><span class="fe__slot" data-filled="1">キム・ビンナ</span></div>
        <div class="fe__row"><span class="fe__cap">生年月日</span><span class="fe__slot" data-filled="1">1996-04-02</span></div>
        <div class="fe__row" id="fe-bad"><span class="fe__cap">メール</span><span class="fe__slot" data-filled="0" tabindex="0" aria-invalid="true" aria-describedby="fe-say"></span></div>
        <div class="fe__row"><span class="fe__cap">住所</span><span class="fe__slot" data-filled="1">ソンス洞12ギル</span></div>
      </div>
    </div>
    <button class="fe__btn" type="submit">申請書を送信</button>
    <p class="fe__say" id="fe-say" role="status" aria-live="polite">空のメール欄へ移動しました</p>
  </form>
</main>
<script>
// 실제 동작: 제출이 막히면 첫 오류 칸으로 스크롤 상자를 내리고, 화면이 튀지 않도록 포커스는 스크롤 없이 따로 준다.
var fe = document.getElementById('fe');
var feBad = document.getElementById('fe-bad');
var feSlots = [].slice.call(document.querySelectorAll('.fe__slot'));
fe.addEventListener('submit', function (e) {
  e.preventDefault();
  fe.classList.remove('is-demo'); // 사람이 손대면 자동 루프를 멈춘다
  var first = null;
  feSlots.forEach(function (s) { if (!first && s.getAttribute('data-filled') === '0') first = s; });
  if (!first) return;
  first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  first.classList.add('is-hit');
  first.focus({ preventScroll: true });   // preventScroll 이 없으면 이 데모가 든 부모 페이지까지 끌려간다
  feBad.classList.add('is-hit');
});
</script>
</body>
</html>
