<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit shake labels — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <form class="sk is-demo" id="sk" novalidate>
    <div class="sk__row" data-row="1">
      <label class="sk__label" for="sk-a">이메일</label>
      <span class="sk__box">
        <input class="sk__input" id="sk-a" type="email" autocomplete="off" required>
        <span class="sk__ghost" aria-hidden="true">bitna@shop.co.kr</span>
      </span>
    </div>
    <div class="sk__row" data-row="2">
      <label class="sk__label" for="sk-b">연락처</label>
      <span class="sk__box">
        <input class="sk__input" id="sk-b" type="tel" autocomplete="off" required>
        <span class="sk__ghost" aria-hidden="true">010-1234-5678</span>
      </span>
    </div>
    <button class="sk__btn" type="submit">가입 신청</button>
    <p class="sk__say" id="sk-say" role="status" aria-live="polite">두 칸을 모두 채워 주세요</p>
  </form>
</main>
<script>
// 실제 동작: 제출을 눌러야 검사한다. 비어 있는 칸만 흔들리고 라벨이 켜지며, 다 채우면 같은 라벨이 확정 색으로 넘어간다.
var sk = document.getElementById('sk');
var skSay = document.getElementById('sk-say');
var skRows = [].slice.call(document.querySelectorAll('.sk__row'));
sk.addEventListener('submit', function (e) {
  e.preventDefault();
  sk.classList.remove('is-demo'); // 사람이 손대면 자동 루프를 멈춘다
  var bad = 0;
  skRows.forEach(function (row) {
    var input = row.querySelector('.sk__input');
    var empty = input.value.trim().length === 0;
    input.setAttribute('aria-invalid', empty ? 'true' : 'false');
    row.classList.toggle('is-ok', !empty);
    row.classList.remove('is-bad');
    if (empty) {
      void row.offsetWidth;           // 리플로를 강제해야 같은 흔들림이 다시 돈다
      row.classList.add('is-bad');
      bad += 1;
    }
  });
  skSay.textContent = bad ? bad + '칸이 비어 있어요' : '두 칸을 모두 채웠어요';
});
</script>
</body>
</html>
