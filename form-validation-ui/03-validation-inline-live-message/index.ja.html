<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inline live message — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="il is-demo" id="il">
    <label class="il__label" for="il-input">メール</label>
    <div class="il__field">
      <input class="il__input" id="il-input" type="email" autocomplete="off" aria-describedby="il-msg" placeholder="アドレスを入力してください">
      <span class="il__ghost" aria-hidden="true">bitna@shop.co.kr</span>
    </div>
    <p class="il__msg" id="il-msg" aria-live="polite">
      <span class="il__bad">@の後ろがまだ足りません</span>
      <span class="il__good">送信できるアドレスです</span>
    </p>
  </div>
</main>
<script>
// 실제 동작: 한 글자마다 정규식을 다시 재고, 미리 확보해 둔 한 줄이 오류 문구와 완료 문구를 갈아 끼운다.
var il = document.getElementById('il');
var ilInput = document.getElementById('il-input');
var IL_MAIL = /^[\w.+-]+@[\w-]+\.[\w.-]{2,}$/;
function ilPaint() {
  il.classList.remove('is-demo'); // 사람이 손대면 자동 루프를 멈춘다
  var ok = IL_MAIL.test(ilInput.value);
  il.classList.toggle('is-good', ok);
  il.classList.toggle('is-bad', !ok && ilInput.value.length > 0);
  ilInput.setAttribute('aria-invalid', ok ? 'false' : 'true');
}
ilInput.addEventListener('input', ilPaint);
ilInput.addEventListener('focus', ilPaint);
</script>
</body>
</html>
