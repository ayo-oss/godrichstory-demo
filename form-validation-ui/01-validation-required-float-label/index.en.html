<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Required floating label — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <form class="fl is-demo" id="fl" novalidate>
    <div class="fl__box" id="fl-box">
      <input class="fl__input" id="fl-input" type="text" autocomplete="off" aria-required="true" aria-describedby="fl-msg">
      <span class="fl__ghost" aria-hidden="true">Bitna Kim</span>
      <label class="fl__label" for="fl-input"><span class="fl__text">Name</span><span class="fl__star" aria-hidden="true">*</span></label>
    </div>
    <p class="fl__msg" id="fl-msg" role="status">
      <span class="fl__m1">Enter your name to continue</span>
      <span class="fl__m2">Name looks good</span>
    </p>
  </form>
</main>
<script>
// 실제 동작: 치면 라벨이 위에 떠 있고, 비운 채 벗어나면 라벨·별표·테두리가 오류색으로 바뀐다.
var fl = document.getElementById('fl');
var flInput = document.getElementById('fl-input');
var flTouched = false;
function flState() {
  fl.classList.remove('is-demo'); // 사람이 손대면 자동 루프를 멈춘다
  var focused = document.activeElement === flInput;
  var filled = flInput.value.length > 0;
  var bad = flTouched && !filled;
  fl.classList.toggle('is-up', focused || filled);
  fl.classList.toggle('is-bad', bad);
  fl.classList.toggle('is-ok', filled && !bad);
  flInput.setAttribute('aria-invalid', bad ? 'true' : 'false');
}
flInput.addEventListener('focus', flState);
flInput.addEventListener('input', flState);
flInput.addEventListener('blur', function () { flTouched = true; flState(); });
fl.addEventListener('submit', function (e) {
  e.preventDefault(); flTouched = true; flState();
  flInput.focus({ preventScroll: true });
});
</script>
</body>
</html>
