<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password score gauge — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pg is-demo" id="pg" data-score="1">
    <div class="pg__field">
      <input class="pg__input" id="pg-input" type="text" autocomplete="off" aria-describedby="pg-out" placeholder="パスワードを入力してください">
      <span class="pg__ghost" aria-hidden="true">Bit9na!Shop</span>
    </div>
    <div class="pg__gauge" aria-hidden="true">
      <span class="pg__cell" data-cell="1"></span>
      <span class="pg__cell" data-cell="2"></span>
      <span class="pg__cell" data-cell="3"></span>
      <span class="pg__cell" data-cell="4"></span>
    </div>
    <p class="pg__out" id="pg-out">
      <span class="pg__words" aria-hidden="true">
        <span class="pg__w" data-w="low">弱い</span><span class="pg__w" data-w="mid">普通</span><span class="pg__w" data-w="high">強い</span>
      </span>
      <span class="pg__nums" aria-hidden="true">
        <span class="pg__n" data-n="0">0 / 4</span><span class="pg__n" data-n="1">1 / 4</span><span class="pg__n" data-n="2">2 / 4</span><span class="pg__n" data-n="3">3 / 4</span><span class="pg__n" data-n="4">4 / 4</span>
      </span>
      <span class="pg__say" id="pg-say" role="status" aria-live="polite">4つの条件のうち1つだけ満たしています</span>
    </p>
  </div>
</main>
<script>
// 실제 동작: 길이·대소문자·숫자·기호 네 조건을 각각 재서 점수를 만들고, 그 점수 하나가 칸 수와 등급을 함께 정한다.
var pg = document.getElementById('pg');
var pgInput = document.getElementById('pg-input');
var pgSay = document.getElementById('pg-say');
var PG_SAY = ['4つの条件をまだ1つも満たしていません', '4つの条件のうち1つだけ満たしています', '4つの条件のうち2つ満たしています',
              'あと1つでパスワードが強くなります', '4つの条件をすべて満たしています'];
function pgScore(v) {
  var n = 0;
  if (/^.{10,}$/.test(v)) n += 1;
  if (/[a-z]/.test(v) && /[A-Z]/.test(v)) n += 1;
  if (/\d/.test(v)) n += 1;
  if (/[^\w\s]/.test(v)) n += 1;
  return n;
}
function pgPaint() {
  pg.classList.remove('is-demo'); // 사람이 손대면 자동 루프를 멈춘다
  var n = pgScore(pgInput.value);
  pg.setAttribute('data-score', String(n));
  pgSay.textContent = PG_SAY[n];
}
pgInput.addEventListener('input', pgPaint);
pgInput.addEventListener('focus', pgPaint);
</script>
</body>
</html>
