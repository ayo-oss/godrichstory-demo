<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character limit counter — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cc is-demo" id="cc" data-level="ok">
    <div class="cc__field">
      <textarea class="cc__input" id="cc-input" rows="2" maxlength="60" aria-describedby="cc-out" placeholder="한 줄 감상을 남겨 보세요"></textarea>
      <span class="cc__ghost" aria-hidden="true">배송이 하루 만에 왔고 포장도 꼼꼼했어요</span>
    </div>
    <div class="cc__bar" aria-hidden="true"><span class="cc__fill"></span></div>
    <p class="cc__out" id="cc-out">
      <span class="cc__nums" aria-hidden="true">
        <span class="cc__n" data-n="0">44자 남음</span><span class="cc__n" data-n="1">26자 남음</span><span class="cc__n" data-n="2">8자 남음</span><span class="cc__n" data-n="3">0자 남음</span>
      </span>
      <span class="cc__live" id="cc-left">44자 남음</span>
      <span class="cc__notes" aria-hidden="true">
        <span class="cc__note" data-note="near">곧 한도예요</span><span class="cc__note" data-note="full">더 쓸 수 없어요</span>
      </span>
      <span class="cc__say" id="cc-say" role="status" aria-live="polite">60자 중 16자를 썼어요</span>
    </p>
  </div>
</main>
<script>
// 실제 동작: maxlength 가 더 못 치게 막고, 남은 글자가 경계를 지나면 숫자와 막대가 함께 경고색으로 넘어간다.
var cc = document.getElementById('cc');
var ccInput = document.getElementById('cc-input');
var ccFill = document.querySelector('.cc__fill');
var ccSay = document.getElementById('cc-say');
var ccLeft = document.getElementById('cc-left');
var CC_MAX = 60, CC_NEAR = 12;
function ccPaint() {
  cc.classList.remove('is-demo'); // 사람이 손대면 자동 루프를 멈춘다
  var used = ccInput.value.length, left = CC_MAX - used;
  cc.setAttribute('data-level', left === 0 ? 'full' : left <= CC_NEAR ? 'near' : 'ok');
  ccFill.style.transform = 'scaleX(' + (used / CC_MAX).toFixed(3) + ')';
  ccLeft.textContent = left + '자 남음';
  ccSay.textContent = CC_MAX + '자 중 ' + used + '자를 썼어요';
}
ccInput.addEventListener('input', ccPaint);
ccInput.addEventListener('focus', ccPaint);
</script>
</body>
</html>
