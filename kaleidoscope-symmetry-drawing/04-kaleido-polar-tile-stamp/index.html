<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>극좌표 도장 — 링×스포크 격자에 스냅 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="kp" id="kp">
  <p class="kp__hint">커서를 링과 스포크가 만나는 격자점으로 바꿔 스냅 도장을 찍습니다</p>
  <div class="kp__row">
    <div class="kp__field" id="field" role="application" aria-label="극좌표 도장 실험판" tabindex="0">
      <canvas class="kp__cv" id="cv"></canvas>
    </div>
    <div class="kp__side">
      <label class="kp__lab" for="stamp">도장 모양</label>
      <select class="kp__sel" id="stamp" aria-label="도장 모양">
        <option value="0">꽃잎 다섯</option>
        <option value="1">별 여덟</option>
        <option value="2">점 세 개</option>
      </select>
      <b class="kp__num" id="marks">0</b>
      <span class="kp__unit">찍힌 도장</span>
      <p class="kp__meta">클릭·탭으로 원하는 격자점에 찍어 보세요</p>
    </div>
  </div>
</div>
</main>
<script>
// 극좌표 도장 — 커서 위치를 (반경 링, 각도 스포크) 로 양자화한다. 극좌표 격자는
// 균일 격자와 달리 중심이 촘촘하고 바깥이 성기다 — 랑골·만다라 배치의 뼈대다.
// 도장 하나를 찍으면 k번째 스포크의 격자점을 반사 행렬로 N 갈래에 복제한다.
(function () {
  var root = document.getElementById('kp');
  var field = document.getElementById('field');
  var cv = document.getElementById('cv');
  var stamp = document.getElementById('stamp');
  var marks = document.getElementById('marks');
  if (!root || !field || !cv || !stamp || !marks) return;
  var ctx = cv.getContext('2d');
  var css = getComputedStyle(root);
  var COLS = [css.getPropertyValue('--c1').trim(), css.getPropertyValue('--c2').trim(), css.getPropertyValue('--c3').trim()];
  var GRID = css.getPropertyValue('--grid').trim();

  var N = 12;                     // 스포크 수 — 격자이자 대칭 차수
  var RINGS = 4;                  // 반경 링 수
  var W = 0, H = 0, dpr = 1, cx = 0, cy = 0, R = 0;
  var count = 0;
  var shape = 0;                  // 0 꽃잎 · 1 별 · 2 점 세 개

  function fit() {
    W = field.clientWidth; H = field.clientHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cx = W / 2; cy = H / 2; R = Math.min(W, H) / 2 - 8;
    drawGrid();
  }

  // 격자 — 링 원 N/2 개와 스포크 반직선 N 개. 찍힌 도장은 지우지 않는다
  function drawGrid() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = GRID; ctx.lineWidth = 1;
    for (var g = 1; g <= RINGS; g++) {
      var r = R * g / RINGS;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.stroke();
    }
    for (var k = 0; k < N; k++) {
      var a = k * 2 * Math.PI / N;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a)); ctx.stroke();
    }
  }

  // 도장 모양 — 셋 다 arc·lineTo 조합. 칩과 1:1
  function drawStamp(x, y, s, ci, rot) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = COLS[ci % 3];
    ctx.strokeStyle = COLS[ci % 3];
    if (shape === 0) {
      // 꽃잎 다섯 — 원 5개가 한 점을 공유
      for (var p = 0; p < 5; p++) {
        var a = p * 2 * Math.PI / 5;
        ctx.beginPath();
        ctx.arc(s * 0.62 * Math.cos(a), s * 0.62 * Math.sin(a), s * 0.42, 0, 2 * Math.PI);
        ctx.fill();
      }
    } else if (shape === 1) {
      // 별 여덟 — lineTo 로 뾰족별
      ctx.beginPath();
      for (var v = 0; v < 16; v++) {
        var rad = (v % 2 === 0) ? s : s * 0.44;
        var an = v * Math.PI / 8;
        var px = rad * Math.cos(an), py = rad * Math.sin(an);
        if (v === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    } else {
      // 점 세 개 — arc 세 개를 lineTo 로 잇는 얼룩
      ctx.beginPath();
      ctx.arc(-s * 0.55, -s * 0.2, s * 0.34, 0, 2 * Math.PI); ctx.fill();
      ctx.beginPath();
      ctx.arc(s * 0.5, -s * 0.35, s * 0.28, 0, 2 * Math.PI); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-s * 0.3, s * 0.1); ctx.lineTo(s * 0.28, s * 0.05); ctx.lineTo(s * 0.1, s * 0.62); ctx.closePath(); ctx.fill();
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // 스냅 — 극좌표를 링·스포크 번호로 반올림한 뒤 다시 좌표로
  function snap(px, py) {
    var dx = px - cx, dy = py - cy;
    var r = Math.min(RINGS, Math.max(1, Math.round(Math.hypot(dx, dy) / (R / RINGS))));
    var k = Math.round(Math.atan2(dy, dx) / (2 * Math.PI / N));
    k = ((k % N) + N) % N;
    var a = k * 2 * Math.PI / N;
    return [cx + r * (R / RINGS) * Math.cos(a), cy + r * (R / RINGS) * Math.sin(a), r, k];
  }

  // 격자점 하나에 도장 — 스포크 전체에 반사 복제. 링은 이미 대칭이라 r 하나만
  function stampAt(px, py, ci) {
    var p = snap(px, py);
    var aBase = p[3] * 2 * Math.PI / N;
    for (var k = 0; k < N; k++) {
      var a = k * 2 * Math.PI / N, c = Math.cos(a), s = Math.sin(a);
      ctx.setTransform(dpr * c, dpr * s, dpr * s, -dpr * c, cx * dpr, cy * dpr);
      var lx = (p[0] - cx), ly = (p[1] - cy);
      var mx = lx * c + ly * s, my = lx * s - ly * c;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawStamp(cx + mx, cy + my, 9 + p[2] * 1.6, ci, aBase + k * 0.2);
    }
    count += 1; marks.textContent = String(count);
  }

  // 시드 고정 자동 시연 — 링·스포크·모양을 순회하며 도장 찍기
  function autoStamp(i) {
    var ring = (i % RINGS) + 1;
    var k = Math.floor(i / RINGS) % N;
    var a = k * 2 * Math.PI / N + (ring % 2) * (Math.PI / N);
    var rr = R * ring / RINGS;
    stampAt(cx + rr * Math.cos(a), cy + rr * Math.sin(a), Math.floor(i / 3));
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t = 0, last = 0, fired = 0;

  stamp.addEventListener('change', function () { shape = parseInt(stamp.value, 10) || 0; });

  function toLocal(e) {
    var b = field.getBoundingClientRect();
    return [e.clientX - b.left, e.clientY - b.top];
  }
  field.addEventListener('pointerdown', function (e) {
    var p = toLocal(e);
    stampAt(p[0], p[1], count);
  });

  function step(now) {
    var dt = Math.min(64, now - last) / 1000; last = now;
    t += dt;
    var want = Math.floor(t / 0.12);           // 0.12초마다 도장 한 개
    while (fired < want) { autoStamp(fired); fired += 1; }
    if (fired >= RINGS * N * 3) {              // 3바퀴 그리면 새로 시작
      t = 0; fired = 0; count = 0; drawGrid();
    }
    requestAnimationFrame(step);
  }

  fit();
  window.addEventListener('resize', fit);
  if (reduce) {
    // 정지 한 장 — 32개 격자점 전부 찍힌 완성 무늬
    for (var i = 0; i < RINGS * N; i++) autoStamp(i);
    root.classList.add('is-still');
  } else {
    last = performance.now();
    requestAnimationFrame(step);
  }
})();
</script>
</body>
</html>
