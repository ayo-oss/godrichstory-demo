<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>失敗すると振動 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="prof is-demo" id="prof">
  <div class="prof__phone" id="profPhone">
    <div class="prof__zone">
      <span class="prof__disc" id="profDisc"></span>
    </div>
    <div class="prof__list">
      <div class="prof__row"></div>
      <div class="prof__row"></div>
    </div>
  </div>
  <span class="prof__hint" id="profHint">下に引っぱってください</span>
</div>
</main>
<script>
(function () {
  var phone = document.getElementById('profPhone');
  var disc = document.getElementById('profDisc');
  var hint = document.getElementById('profHint');
  var root = document.getElementById('prof');

  // 계산 겹: 성공/실패는 Math.random 이 아니라 시도 횟수(attemptCount)의 홀짝으로 정해지는
  // 결정적 번갈이(1회차 실패·2회차 성공…)다. 실패 시 흔들림은 감쇠 진동 AMP*e^(-t/TAU)*sin(t*FREQ) 를
  // phone 의 translateX 에 얹는 시간 기반 계산이지, 매번 새 애니메이션 클래스를 재생시키는 게 아니다.
  var REF = 90, MAX = 130;
  var AMP = 10, TAU = 0.12, FREQ = 46;

  var raw = 0, target = 0, raf1 = null;
  function apply(rawV) {
    var pull = Math.min(rawV, MAX) * 0.28;
    disc.style.transform = 'translateY(' + pull.toFixed(1) + 'px) scale(' + (0.7 + 0.3 * Math.min(1, rawV / REF)).toFixed(2) + ')';
    disc.classList.toggle('prof__disc--ready', rawV >= REF);
  }
  function settle() {
    raw += (target - raw) * 0.3;
    if (Math.abs(target - raw) < 0.3) { raw = target; }
    apply(raw);
    if (raw !== target) { raf1 = requestAnimationFrame(settle); } else { raf1 = null; }
  }
  function goTo(v) { target = v; if (raf1 === null) { raf1 = requestAnimationFrame(settle); } }

  var shaking = false, shakeStart = 0;
  function frame(now) {
    if (shaking) {
      var t = (now - shakeStart) / 1000;
      var off = AMP * Math.exp(-t / TAU) * Math.sin(t * FREQ);
      phone.style.transform = 'translateX(' + off.toFixed(1) + 'px)';
      if (t > 0.5) { shaking = false; phone.style.transform = 'translateX(0px)'; }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  var attemptCount = 0, committing = false, commitTimer = null;
  function attempt() {
    attemptCount += 1;
    var fail = attemptCount % 2 === 1;
    committing = true;
    if (fail) {
      hint.textContent = 'オフライン - 再試行';
      disc.classList.add('prof__disc--fail');
      shaking = true; shakeStart = performance.now();
      commitTimer = setTimeout(function () {
        disc.classList.remove('prof__disc--fail', 'prof__disc--ready');
        committing = false;
        raw = 0; apply(0);
        hint.textContent = '下に引っぱってください';
      }, 640);
    } else {
      hint.textContent = '更新完了';
      disc.classList.add('prof__disc--ok');
      commitTimer = setTimeout(function () {
        disc.classList.remove('prof__disc--ok', 'prof__disc--ready');
        committing = false;
        raw = 0; apply(0);
        hint.textContent = '下に引っぱってください';
      }, 640);
    }
  }

  var dragging = false, startY = 0, startRaw = 0;
  function onDown(y) { if (committing) { return; } dragging = true; startY = y; startRaw = raw; if (raf1) { cancelAnimationFrame(raf1); raf1 = null; } }
  function onMove(y) {
    if (!dragging) { return; }
    raw = Math.max(0, Math.min(MAX, startRaw + (y - startY)));
    apply(raw);
  }
  function onUp() {
    if (!dragging) { return; }
    dragging = false;
    if (raw >= REF) { attempt(); } else { goTo(0); }
  }

  function wireReal() {
    phone.addEventListener('pointerdown', function (e) { root.classList.remove('is-demo'); stopAutoplay(); onDown(e.clientY); });
    window.addEventListener('pointermove', function (e) { onMove(e.clientY); });
    window.addEventListener('pointerup', onUp);
  }
  phone.style.touchAction = 'none';
  wireReal();
  apply(0);

  var autoRaw = 0, autoTimer = null;
  function autoTick() {
    if (committing) { return; }
    autoRaw += 18;
    if (autoRaw >= REF) { raw = REF; apply(raw); autoRaw = 0; attempt(); return; }
    raw = autoRaw; apply(raw);
  }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } if (commitTimer) { clearTimeout(commitTimer); } }
  if (!reduce) { autoTimer = setInterval(autoTick, 190); }
})();
</script>
</body>
</html>
