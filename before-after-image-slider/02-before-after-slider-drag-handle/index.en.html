<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before/after — drag handle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ba is-demo" id="ba">
    <div class="ba__after"></div>
    <div class="ba__before"></div>
    <div class="ba__handle" id="grip"><span class="ba__grip"></span></div>
  </div>
</main>
<script>
(function () {
  var el = document.getElementById("ba");
  var grip = document.getElementById("grip");
  var dragging = false;
  function set(pct) {
    pct = Math.max(0, Math.min(100, pct));
    el.style.setProperty("--reveal", pct + "%");
  }
  function fromX(x) {
    var r = el.getBoundingClientRect();
    return ((x - r.left) / r.width) * 100;
  }
  grip.addEventListener("pointerdown", function (e) {
    el.classList.remove("is-demo");
    dragging = true;
    grip.setPointerCapture(e.pointerId);
    set(fromX(e.clientX));
  });
  grip.addEventListener("pointermove", function (e) {
    if (dragging) set(fromX(e.clientX));
  });
  grip.addEventListener("pointerup", function () { dragging = false; });
  grip.addEventListener("pointercancel", function () { dragging = false; });
})();
</script>
</body>
</html>
