<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before/after — multi-pair carousel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="track" id="track" aria-label="前後比較カルーセル">
    <div class="ba is-demo is-active" data-i="1">
      <div class="ba__after"></div>
      <div class="ba__before"></div>
    </div>
    <div class="ba is-demo" data-i="2">
      <div class="ba__after"></div>
      <div class="ba__before"></div>
    </div>
    <div class="ba is-demo" data-i="3">
      <div class="ba__after"></div>
      <div class="ba__before"></div>
    </div>
  </div>
</main>
<script>
(function () {
  var track = document.getElementById("track");
  var panes = Array.prototype.slice.call(track.querySelectorAll(".ba"));

  panes.forEach(function (pane) {
    var dragging = false;
    function set(pct) {
      pct = Math.max(0, Math.min(100, pct));
      pane.style.setProperty("--reveal", pct + "%");
    }
    function fromX(x) {
      var r = pane.getBoundingClientRect();
      return ((x - r.left) / r.width) * 100;
    }
    pane.addEventListener("pointerdown", function (e) {
      if (!pane.classList.contains("is-active")) return;
      pane.classList.remove("is-demo");
      dragging = true;
      pane.setPointerCapture(e.pointerId);
      set(fromX(e.clientX));
    });
    pane.addEventListener("pointermove", function (e) { if (dragging) set(fromX(e.clientX)); });
    pane.addEventListener("pointerup", function () { dragging = false; });
  });

  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        en.target.classList.toggle("is-active", en.intersectionRatio > 0.6);
      });
    }, { root: track, threshold: [0.6] });
    panes.forEach(function (p) { io.observe(p); });
  }
})();
</script>
</body>
</html>
