<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before/after — click to reveal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ba is-demo" id="ba" role="img" aria-label="클릭하면 경계가 그 위치로 옮겨가는 전후 비교">
    <div class="ba__after"></div>
    <div class="ba__before"></div>
    <div class="ba__line"></div>
  </div>
</main>
<script>
(function () {
  var el = document.getElementById("ba");
  function set(pct) {
    pct = Math.max(0, Math.min(100, pct));
    el.style.setProperty("--reveal", pct + "%");
  }
  el.addEventListener("click", function (e) {
    el.classList.remove("is-demo");
    var r = el.getBoundingClientRect();
    set(((e.clientX - r.left) / r.width) * 100);
  });
})();
</script>
</body>
</html>
