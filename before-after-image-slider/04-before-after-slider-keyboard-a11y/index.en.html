<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before/after — keyboard accessible</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ba is-demo" id="ba"
       role="slider" tabindex="0"
       aria-label="Before/after comparison slider"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
    <div class="ba__after"></div>
    <div class="ba__before"></div>
    <div class="ba__handle"><span class="ba__grip"></span></div>
  </div>
</main>
<script>
(function () {
  var el = document.getElementById("ba");
  var dragging = false;
  function set(pct) {
    pct = Math.max(0, Math.min(100, pct));
    el.style.setProperty("--reveal", pct + "%");
    el.setAttribute("aria-valuenow", String(Math.round(pct)));
  }
  function cur() {
    return parseFloat(getComputedStyle(el).getPropertyValue("--reveal")) || 50;
  }
  function fromX(x) {
    var r = el.getBoundingClientRect();
    return ((x - r.left) / r.width) * 100;
  }
  el.addEventListener("pointerdown", function (e) {
    el.classList.remove("is-demo");
    dragging = true;
    el.setPointerCapture(e.pointerId);
    set(fromX(e.clientX));
  });
  el.addEventListener("pointermove", function (e) { if (dragging) set(fromX(e.clientX)); });
  el.addEventListener("pointerup", function () { dragging = false; });
  el.addEventListener("keydown", function (e) {
    el.classList.remove("is-demo");
    if (e.key === "ArrowLeft") { set(cur() - 5); e.preventDefault(); }
    else if (e.key === "ArrowRight") { set(cur() + 5); e.preventDefault(); }
    else if (e.key === "Home") { set(0); e.preventDefault(); }
    else if (e.key === "End") { set(100); e.preventDefault(); }
  });
})();
</script>
</body>
</html>
