<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before/after — zoom synced</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ba is-demo" id="ba">
    <div class="ba__frame">
      <div class="ba__after"></div>
      <div class="ba__before"></div>
    </div>
    <div class="ba__handle"><span class="ba__grip"></span></div>
  </div>
</main>
<script>
(function () {
  var el = document.getElementById("ba");
  var dragging = false;
  function setReveal(pct) {
    pct = Math.max(0, Math.min(100, pct));
    el.style.setProperty("--reveal", pct + "%");
  }
  function setZoom(z) {
    z = Math.max(1, Math.min(2.2, z));
    el.style.setProperty("--zoom", z.toFixed(2));
  }
  function fromX(x) {
    var r = el.getBoundingClientRect();
    return ((x - r.left) / r.width) * 100;
  }
  el.addEventListener("pointerdown", function (e) {
    el.classList.remove("is-demo");
    dragging = true;
    el.setPointerCapture(e.pointerId);
    setReveal(fromX(e.clientX));
  });
  el.addEventListener("pointermove", function (e) { if (dragging) setReveal(fromX(e.clientX)); });
  el.addEventListener("pointerup", function () { dragging = false; });
  el.addEventListener("wheel", function (e) {
    el.classList.remove("is-demo");
    e.preventDefault();
    var cur = parseFloat(getComputedStyle(el).getPropertyValue("--zoom")) || 1;
    setZoom(cur + (e.deltaY < 0 ? 0.15 : -0.15));
  }, { passive: false });
})();
</script>
</body>
</html>
