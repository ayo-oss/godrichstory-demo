<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before/after — vertical</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ba is-demo" id="ba">
    <div class="ba__after"></div>
    <div class="ba__before"></div>
    <div class="ba__handle"><span class="ba__grip"></span></div>
  </div>
</main>
<script>
(function () {
  var el = document.getElementById("ba");
  var dragging = false;
  function set(pct) {
    pct = Math.max(0, Math.min(100, pct));
    el.style.setProperty("--reveal", pct + "%");
  }
  function fromY(y) {
    var r = el.getBoundingClientRect();
    return ((y - r.top) / r.height) * 100;
  }
  el.addEventListener("pointerdown", function (e) {
    el.classList.remove("is-demo");
    dragging = true;
    el.setPointerCapture(e.pointerId);
    set(fromY(e.clientY));
  });
  el.addEventListener("pointermove", function (e) { if (dragging) set(fromY(e.clientY)); });
  el.addEventListener("pointerup", function () { dragging = false; });
})();
</script>
</body>
</html>
