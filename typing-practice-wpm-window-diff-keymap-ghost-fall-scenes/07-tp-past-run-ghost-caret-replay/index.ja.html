<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>過去の記録を走るゴーストのカーソル — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="タイピング練習の舞台 — キーを押すと自分で練習、Esc で最初から">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="同じ文を二つの盤で打つ場面です。左は過去の練習で文字ごとに押された時刻の一覧から半透明のピンク色のゴーストのカーソルを走らせ、自分のカーソルが何文字先か後ろかを中央基準の棒と時間のグラフで見せ、右は平均の速さの直線のカーソルなので、過去の記録で詰まった区間が消えます。"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">タイピング練習のデモ</p>
  <div class="vj__ctrl">
    <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
    <button class="vj__step" data-role="step" type="button">一歩進める</button>
  </div>
  <p class="vj__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const PI = Math.PI;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 선형 합동 생성기(곱 1664525, 더함 1013904223). 같은 시드면 같은 수열
    function seeded(seed) {
        let s = (seed >>> 0) || 1;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 파스텔 팔레트 — 글자는 늘 INK 나 진한 색, 면은 연한 색. 맞음은 민트, 틀림은 분홍, 내 커서는 라벤더
    const BG_TOP = [250, 246, 252];
    const BG_BOT = [228, 234, 250];
    const FACE = [255, 253, 248];
    const FACE_EDGE = [206, 198, 226];
    const SKY = [176, 210, 246];
    const SKY_DEEP = [60, 104, 162];
    const GOLD = [250, 226, 150];
    const GOLD_DEEP = [150, 108, 20];
    const ROSE = [240, 150, 176];
    const ROSE_DEEP = [184, 44, 80];
    const MINT = [150, 214, 190];
    const MINT_DEEP = [18, 104, 76];
    const LAV = [188, 172, 236];
    const LAV_DEEP = [96, 74, 170];
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 장면 시계(초)·판 반복 번호·시간표 — 시간표는 (시각, 할 일) 목록이고 시각이 지나면 한 번씩 부른다
    // sceneT 는 rAF 타임스탬프 차이(dt, 한 프레임 0.05초 상한)를 쌓은 값 하나뿐이다 — 이 장면의 시간 원천은 이것 하나
    let sceneT = 0;
    let lap = 0;
    let script = [];
    let evAt = 0;
    // 자동 시연이 끝나는 시각과 한 판이 되풀이되는 시각 — build() 가 시간표를 짜면서 정한다
    let doneAt = 12;
    let lapEnd = 14;
    // 사람이 직접 키를 치는 중인가 — 켜지면 시간표의 가상 타자는 빠지고 판은 되풀이되지 않는다
    let live = false;
    function sched(t, f) { script.push({ t: t, f: f }); }
    // ── 타자 기록 ─────────────────────────────────────────────
    // 한 번의 키 입력은 (누른 시각, 키) 두 값이다. 타수도 오타도 열지도도 이 목록에서만 계산한다
    const BS = 'Backspace';
    let target = '';
    let buf = '';
    let strokes = [];
    function sessReset(text) {
        target = text;
        buf = '';
        strokes = [];
    }
    // 키 하나를 받는다 — 지우기는 마지막 글자를 빼고, 글자는 그 자리의 정답과 견줘 ok 를 정한다
    function press(k, t) {
        if (k === BS) {
            if (buf.length > 0) {
                buf = buf.slice(0, -1);
            }
            strokes.push({ t: t, k: k, ok: false });
            return;
        }
        if (buf.length >= target.length) {
            return;
        }
        const ok = k === target.charAt(buf.length);
        buf += k;
        strokes.push({ t: t, k: k, ok: ok });
    }
    // 글자 키 수와 맞은 수 — 지우기 키는 세지 않는다
    function keyCount() {
        let n = 0;
        for (let i = 0; i < strokes.length; i += 1) {
            if (strokes[i].k !== BS) {
                n += 1;
            }
        }
        return n;
    }
    function okCount() {
        let n = 0;
        for (let i = 0; i < strokes.length; i += 1) {
            if (strokes[i].ok) {
                n += 1;
            }
        }
        return n;
    }
    // 정확도 — 맞은 글자 키 ÷ 글자 키 전체. 지워도 이미 친 틀린 키는 남는다
    function accuracy() {
        const n = keyCount();
        return n === 0 ? 100 : (okCount() / n) * 100;
    }
    // 자리 옆 키 — 틀린 키는 같은 줄의 이웃 글쇠에서 고른다(스페이스 바는 c, 글자가 아닌 키는 n)
    function nearKey(ch, rnd) {
        const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
        for (let r = 0; r < rows.length; r += 1) {
            const i = rows[r].indexOf(ch);
            if (i >= 0) {
                const j = i === 0 ? 1 : (i === rows[r].length - 1 ? i - 1 : (rnd() < 0.5 ? i - 1 : i + 1));
                return rows[r].charAt(j);
            }
        }
        return ch === ' ' ? 'c' : 'n';
    }
    // 시드 가상 타자 — 글자마다 간격은 pace(지금 시각) 의 ±20%, 오타는 지정한 자리에서만 낸다
    // miss 는 [글자 자리, 알아채기 전에 더 치는 글자 수, 틀린 키 수(생략하면 1)] 목록. 틀린 키를 치고 lag 글자를 더 친 뒤 한 번에 지우고 다시 친다
    function genStrokes(seed, text, pace, miss, t0) {
        const rnd = seeded(seed);
        const out = [];
        let t = t0;
        let i = 0;
        const handled = {};
        while (i < text.length) {
            let hit = null;
            for (let m = 0; m < miss.length; m += 1) {
                if (miss[m][0] === i && !handled[i]) {
                    hit = miss[m];
                }
            }
            t += pace(t) * (0.8 + 0.4 * rnd());
            if (hit) {
                handled[i] = true;
                const lag = Math.min(hit[1], text.length - 1 - i);
                const bad = hit.length > 2 ? hit[2] : 1;
                for (let j = 0; j <= lag; j += 1) {
                    if (j > 0) {
                        t += pace(t) * (0.8 + 0.4 * rnd());
                    }
                    out.push({ t: t, k: j < bad ? nearKey(text.charAt(i + j), rnd) : text.charAt(i + j) });
                }
                t += 0.26 + 0.16 * rnd();
                for (let j = 0; j <= lag; j += 1) {
                    out.push({ t: t, k: BS });
                    t += 0.09;
                }
                continue;
            }
            out.push({ t: t, k: text.charAt(i) });
            i += 1;
        }
        return out;
    }
    // 시간표에 가상 타자의 키를 모두 올린다 — 끝나는 시각(doneAt)과 되풀이 시각(lapEnd)도 여기서 정한다
    function schedule(raw, hold) {
        for (let i = 0; i < raw.length; i += 1) {
            const r = raw[i];
            sched(r.t, function () { onKey(r.k, r.t); });
        }
        doneAt = raw.length > 0 ? raw[raw.length - 1].t + 0.35 : 1;
        lapEnd = doneAt + hold;
    }
    function defaultFinished() {
        return live ? buf.length >= target.length : sceneT >= doneAt;
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const stepEl = root.querySelector('[data-role="step"]');
    const doneEl = root.querySelector('[data-role="done"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !stepEl || !doneEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const stepBtn = stepEl;
    const doneP = doneEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만. 타자 글자는 고정폭이라 칸 폭이 흔들리지 않는다
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    const MONO_STACK = 'ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const VIEW_S = 0.88;
    function skyFill(top, bot) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bot, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        // 위쪽 一時停止·상태 알약이 덮는 띠를 비우려고 장면 전체를 VIEW_S 배로 줄여 아래 가운데에 붙인다 — 이 줄 뒤에 그리는 것은 모두 줄어든 좌표계
        ctx.translate(W / 2, H - 3);
        ctx.scale(VIEW_S, VIEW_S);
        ctx.translate(-W / 2, -(H - 3));
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function seg(x1, y1, x2, y2, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function outline(x, y, w, h, r, width, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 고정폭 글자 — 칸마다 같은 폭이라 커서와 오타 칸이 글자에 정확히 겹친다
    function mono(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + MONO_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 고정폭 글꼴 한 칸의 폭 — 글꼴이 바뀌면 같이 바뀐다
    function monoW(px) {
        ctx.font = '400 ' + px + 'px ' + MONO_STACK;
        return ctx.measureText('M').width;
    }
    // 글자 이름표 — 바탕 알약 위에 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    function panel(x, y, w, h, c, a) {
        box(x, y, w, h, 12, c, a);
        outline(x, y, w, h, 12, 1.5, FACE_EDGE, 0.9);
    }
    // ── 공통 틀 ───────────────────────────────────────────────
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 한 판이 끝났음을 스크린리더에 한 번만 알린다 — 판이 되풀이돼도 다시 읽지 않는다
    let doneSaid = false;
    function checkDone() {
        if (!doneSaid && finished()) {
            doneSaid = true;
            doneP.textContent = statusText();
        }
    }
    function advance(dt) {
        sceneT += dt;
        while (evAt < script.length && script[evAt].t <= sceneT) {
            const ev = script[evAt];
            evAt += 1;
            ev.f();
        }
        if (!live && sceneT >= lapEnd) {
            lap += 1;
            begin();
            return;
        }
        update(dt);
    }
    // 시간표를 새로 짠다 — 같은 시각이면 짠 순서대로 부른다(정렬은 안정)
    function fresh() {
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        script.sort(function (a, b) { return a.t - b.t; });
    }
    // 첫 판은 START_S 만큼 앞서 시작한다 — 타자가 이미 치고 있는 장면에서 보인다
    function runTo(t) {
        while (sceneT < t - 1e-6) {
            advance(Math.min(1 / 30, t - sceneT));
        }
    }
    function begin() {
        fresh();
        if (lap === 0 && !still) {
            runTo(START_S);
        }
    }
    const DT_MAX = 0.05;
    function showNow() {
        draw();
        pushStatus(statusText());
        checkDone();
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        showNow();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 한 판이 끝난 멈춘 한 장. 시간표를 끝까지 돌려 결과 화면에서 멈춘다
    function showRest() {
        stopLoop();
        live = false;
        fresh();
        runTo(doneAt);
        doneSaid = false;
        showNow();
    }
    function play() {
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    // 처음부터 — 자동 시연은 시간표를 다시, 직접 치던 중이면 빈 연습판을 다시
    function restart() {
        lap += 1;
        doneSaid = false;
        if (still) {
            showRest();
            return;
        }
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    // 직접 치기 — 첫 키가 오면 가상 타자를 빼고 빈 판에서 시작한다
    let lastStamp = -1;
    function goLive() {
        live = true;
        doneSaid = false;
        lastStamp = -1;
        shownStatus = '';
        fresh();
        if (still) {
            showNow();
        }
        else {
            lastTs = -1;
            showNow();
            if (!paused) {
                startLoop();
            }
        }
    }
    // 이벤트 시각 e.timeStamp 와 rAF 시각은 같은 원점이라 빼면 마지막 프레임 이후의 간격이 나온다
    function liveKey(k, stamp) {
        let t = sceneT;
        if (still) {
            if (lastStamp >= 0) {
                sceneT += clamp((stamp - lastStamp) / 1000, 0, 2);
            }
            lastStamp = stamp;
            t = sceneT;
        }
        else if (lastTs >= 0) {
            t = sceneT + clamp((stamp - lastTs) / 1000, 0, DT_MAX);
        }
        onKey(k, t);
        if (still) {
            update(0);
            showNow();
        }
    }
    // 一歩進める — 멈춘 채 시간표의 다음 키 하나까지 시계를 보낸다. 더 부를 일이 없으면 판을 다시 연다
    function stepOnce() {
        if (live) {
            return;
        }
        wake();
        if (!paused) {
            paused = true;
            pauseBtn.setAttribute('aria-pressed', 'true');
            stopLoop();
        }
        if (evAt >= script.length) {
            restart();
            return;
        }
        runTo(script[evAt].t + 0.05);
        showNow();
    }
    // 키 이름 바꾸기 — 한글 자모 장면은 이 함수를 덮어쓴다. 글자 키와 지우기 키만 받고 나머지는 빈 문자열
    let keyMap = null;
    function keyOf(e) {
        if (keyMap) {
            return keyMap(e);
        }
        if (e.key === 'Backspace') {
            return BS;
        }
        return e.key.length === 1 ? e.key : '';
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    stepBtn.addEventListener('click', stepOnce, { signal: off.signal });
    // 키보드 — 무대에 포커스가 있을 때만. 글자 키는 직접 치기, Esc 는 처음부터. Tab 은 그대로 두어 포커스가 나갈 수 있다
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        if (e.key === 'Escape') {
            e.preventDefault();
            wake();
            if (live) {
                goLive();
            }
            else {
                restart();
            }
            return;
        }
        const k = keyOf(e);
        if (k === '') {
            return;
        }
        e.preventDefault();
        if (paused) {
            return;
        }
        if (!live) {
            wake();
            goLive();
        }
        liveKey(k, e.timeStamp);
    }, { signal: off.signal });
    // 마우스·터치 — 무대를 누르면 키보드 포커스만 준다
    pad.addEventListener('click', function () {
        pad.focus({ preventScroll: true });
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 결과 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            live = false;
            lap = 0;
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        showNow();
    }, { signal: off.signal });
    // ── 07 지난 기록을 달리는 유령 커서 ───────────────────────────
    // 지난 연습에서 글자마다 눌린 시각을 pressTimes 목록으로 두고, 지금 경과 시간에 GHOST_GAIN 을 곱한 시각까지 눌린 글자 수를 목록에서 찾아 반투명 커서로 그린다
    // 내 커서가 유령보다 몇 글자 앞서는지는 GAP_BAR 칸 안의 막대로 본다. 오른쪽 판은 평균 속도의 직선 커서라 구간별로 힘든 곳이 사라진다
    const GHOST_GAIN = 1.0;
    const GAP_BAR = 12;
    const COLS_07 = 27;
    const START_S = 8.6;
    const TEXT_07 = 'a slow ferry crosses the grey bay while gulls wheel above the quiet pier';
    let hist = [];
    let pressTimes = [];
    let kickT = -9;
    // SIM-BEGIN
    // 지난 기록 — 5.5초까지는 보통 속도, 5.5초에서 8.5초까지는 막혀서 느려지고, 그 뒤에 다시 빨라진 연습
    function pastPace(t) { return t < 5.5 ? 0.17 : (t < 8.5 ? 0.4 : 0.15); }
    function pastRun() { return genStrokes(71, TEXT_07, pastPace, [], 0.4); }
    // 지금 기록 — 처음엔 느리고 5초 뒤에 빨라진다. 오타 한 번
    function nowPace(t) { return t < 5.0 ? 0.24 : 0.14; }
    function nowRun() { return genStrokes(72, TEXT_07, nowPace, [[30, 0]], 0.4); }
    function timesOf(raw) {
        const out = [];
        for (let i = 0; i < raw.length; i += 1) {
            out.push(raw[i].t);
        }
        return out;
    }
    // 유령의 자리 — 시각 t × gain 까지 눌린 글자 수를 pressTimes 에서 찾는다(이진 탐색)
    function ghostPos(t, gain) {
        const g = t * gain;
        let lo = 0;
        let hi = pressTimes.length;
        while (lo < hi) {
            const mid = (lo + hi) >> 1;
            if (pressTimes[mid] <= g) {
                lo = mid + 1;
            }
            else {
                hi = mid;
            }
        }
        return lo;
    }
    // 평균 속도 커서 — 전체 글자 수를 마지막 글자 시각으로 나눈 속도로 직선으로 간다
    function linearPos(t) {
        const n = pressTimes.length;
        return n === 0 ? 0 : Math.min(n, Math.floor((t / pressTimes[n - 1]) * n));
    }
    // SIM-END
    function build() {
        sessReset(TEXT_07);
        hist = [];
        pressTimes = timesOf(pastRun());
        kickT = -9;
        if (!live) {
            const raw = nowRun();
            schedule(raw, 2.6);
            // 지금 기록이 끝난 뒤에도 유령이 끝까지 가도록 끝나는 시각은 둘 중 늦은 쪽
            doneAt = Math.max(doneAt, pressTimes[pressTimes.length - 1] + 0.35);
            lapEnd = doneAt + 2.6;
        }
    }
    function onKey(k, t) {
        press(k, t);
        kickT = t;
    }
    function finished() { return defaultFinished(); }
    function update(dt) {
        if (dt < 0) {
            return;
        }
        hist.push({ t: sceneT, a: buf.length - ghostPos(sceneT, GHOST_GAIN), b: buf.length - linearPos(sceneT) });
    }
    function textBlock(x0, y0, ghost, deep, soft) {
        const cw = monoW(12);
        const c = buf.length;
        for (let i = 0; i < target.length; i += 1) {
            const col = i % COLS_07;
            const row = Math.floor(i / COLS_07);
            const x = x0 + col * cw;
            const y = y0 + row * 24;
            if (i < ghost) {
                box(x, y + 2, cw, 20, 3, soft, 0.5);
            }
            const typed = i < c;
            const wrong = typed && buf.charAt(i) !== target.charAt(i);
            mono(target.charAt(i), x + cw / 2, y + 12, wrong ? ROSE_DEEP : (typed ? MINT_DEEP : INK), typed ? 1 : 0.85, 12, typed ? 700 : 400, 'center');
        }
        // 유령 커서(반투명 굵은 막대)와 내 커서
        const gx = x0 + (ghost % COLS_07) * cw;
        const gy = y0 + Math.floor(Math.min(ghost, target.length - 1) / COLS_07) * 24;
        box(gx - 1, gy + 1, 3.4, 22, 1, deep, 0.55);
        const mx = x0 + (c % COLS_07) * cw;
        const my = y0 + Math.floor(Math.min(c, target.length - 1) / COLS_07) * 24;
        box(mx - 1, my + 1, 2.4, 22, 1, LAV_DEEP, 1);
    }
    function gapBar(cx, y, gap) {
        box(cx - 96, y, 192, 14, 7, [255, 255, 255], 0.9);
        outline(cx - 96, y, 192, 14, 7, 1.2, FACE_EDGE, 1);
        const w = clamp(Math.abs(gap) / GAP_BAR, 0, 1) * 94;
        if (gap >= 0) {
            box(cx, y + 2, Math.max(w, 0.1), 10, 4, MINT, 1);
        }
        else {
            box(cx - w, y + 2, w, 10, 4, ROSE, 1);
        }
        seg(cx, y - 2, cx, y + 16, 1.5, INK, 0.8);
    }
    function gapChart(x0, y0, useA, deep) {
        const w = 202;
        const h = 56;
        box(x0, y0, w, h, 8, [255, 255, 255], 0.75);
        const zy = y0 + h / 2;
        seg(x0 + 4, zy, x0 + w - 4, zy, 1, FACE_EDGE, 1);
        const ax = (live ? 30 : Math.max(doneAt, 12)) + 0.6;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x0, y0, w, h, 8);
        ctx.clip();
        ctx.beginPath();
        for (let i = 0; i < hist.length; i += 1) {
            const v = useA ? hist[i].a : hist[i].b;
            const x = x0 + (hist[i].t / ax) * w;
            const y = zy - clamp(v / GAP_BAR, -1, 1) * (h / 2 - 4);
            if (i === 0) {
                ctx.moveTo(x, y);
            }
            else {
                ctx.lineTo(x, y);
            }
        }
        ctx.lineWidth = 2.4;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = rgba(deep, 1);
        ctx.stroke();
        ctx.restore();
    }
    function draw() {
        skyFill(BG_TOP, BG_BOT);
        panel(10, 46, 226, 244, [255, 255, 255], 0.5);
        panel(244, 46, 226, 244, [255, 255, 255], 0.5);
        const gl = ghostPos(sceneT, GHOST_GAIN);
        const gr = linearPos(sceneT);
        // 판 바탕은 앞서면 민트·뒤처지면 분홍으로 물들고, 키를 누를 때 하늘색이 짧게 번쩍인다
        const kick = clamp(1 - (sceneT - kickT) / 0.3, 0, 1);
        const dl = buf.length - gl;
        const dr = buf.length - gr;
        box(10, 46, 226, 244, 12, dl >= 0 ? MINT : ROSE, Math.min(0.4, 0.04 * Math.abs(dl)));
        box(244, 46, 226, 244, 12, dr >= 0 ? MINT : ROSE, Math.min(0.4, 0.04 * Math.abs(dr)));
        box(10, 46, 226, 244, 12, SKY, 0.18 * kick);
        box(244, 46, 226, 244, 12, SKY, 0.18 * kick);
        textBlock(22, 64, gl, ROSE_DEEP, ROSE);
        textBlock(256, 64, gr, ROSE_DEEP, ROSE);
        gapBar(123, 150, buf.length - gl);
        gapBar(357, 150, buf.length - gr);
        text('ゴーストより先か後ろか', 123, 178, INK, 0.75, 10, 700, 'center');
        text('ゴーストより先か後ろか', 357, 178, INK, 0.75, 10, 700, 'center');
        gapChart(22, 188, true, MINT_DEEP);
        gapChart(256, 188, false, ROSE_DEEP);
        tag('過去の記録の歩みを走る', 123, 26, MINT, INK, 11, 'center');
        tag('平均の速さの直線カーソル', 357, 26, ROSE, INK, 11, 'center');
        tag('正確さ {p}%'.replace('{p}', accuracy().toFixed(0)), 123, 262, PAPER, INK, 11, 'center');
        tag('詰まった区間が消える', 357, 262, PAPER, INK, 11, 'center');
    }
    function statusText() {
        const d = buf.length - ghostPos(sceneT, GHOST_GAIN);
        const s = d > 0 ? 'ゴーストより {d}文字先にいる' : (d < 0 ? 'ゴーストより {d}文字遅れている' : 'ゴーストと同じ位置');
        return '{g}・正確さ {p}%'.replace('{g}', s.replace('{d}', String(Math.abs(d)))).replace('{p}', accuracy().toFixed(0));
    }
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
