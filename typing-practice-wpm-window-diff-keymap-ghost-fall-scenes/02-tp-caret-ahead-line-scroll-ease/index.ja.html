<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カーソルの先へ送られる行スクロール — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="タイピング練習の舞台 — キーを押すと自分で練習、Esc で最初から">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="一行の長い文を打つ二つの枠です。左の行はカーソルが枠の幅の中央付近に来るよう目標の移動値を決め、コマごとに差の一部だけ追いかけてなめらかに送られ、右の行はカーソルが右端に届いたときだけ一ページずつ切り替わります。下のグラフは直近6秒のあいだカーソルが画面のどこにあったかで、中心からのずれの平均が数字で付きます。"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">タイピング練習のデモ</p>
  <div class="vj__ctrl">
    <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
    <button class="vj__step" data-role="step" type="button">一歩進める</button>
  </div>
  <p class="vj__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const PI = Math.PI;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 선형 합동 생성기(곱 1664525, 더함 1013904223). 같은 시드면 같은 수열
    function seeded(seed) {
        let s = (seed >>> 0) || 1;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 파스텔 팔레트 — 글자는 늘 INK 나 진한 색, 면은 연한 색. 맞음은 민트, 틀림은 분홍, 내 커서는 라벤더
    const BG_TOP = [250, 246, 252];
    const BG_BOT = [228, 234, 250];
    const FACE = [255, 253, 248];
    const FACE_EDGE = [206, 198, 226];
    const SKY = [176, 210, 246];
    const SKY_DEEP = [60, 104, 162];
    const GOLD = [250, 226, 150];
    const GOLD_DEEP = [150, 108, 20];
    const ROSE = [240, 150, 176];
    const ROSE_DEEP = [184, 44, 80];
    const MINT = [150, 214, 190];
    const MINT_DEEP = [18, 104, 76];
    const LAV = [188, 172, 236];
    const LAV_DEEP = [96, 74, 170];
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 장면 시계(초)·판 반복 번호·시간표 — 시간표는 (시각, 할 일) 목록이고 시각이 지나면 한 번씩 부른다
    // sceneT 는 rAF 타임스탬프 차이(dt, 한 프레임 0.05초 상한)를 쌓은 값 하나뿐이다 — 이 장면의 시간 원천은 이것 하나
    let sceneT = 0;
    let lap = 0;
    let script = [];
    let evAt = 0;
    // 자동 시연이 끝나는 시각과 한 판이 되풀이되는 시각 — build() 가 시간표를 짜면서 정한다
    let doneAt = 12;
    let lapEnd = 14;
    // 사람이 직접 키를 치는 중인가 — 켜지면 시간표의 가상 타자는 빠지고 판은 되풀이되지 않는다
    let live = false;
    function sched(t, f) { script.push({ t: t, f: f }); }
    // ── 타자 기록 ─────────────────────────────────────────────
    // 한 번의 키 입력은 (누른 시각, 키) 두 값이다. 타수도 오타도 열지도도 이 목록에서만 계산한다
    const BS = 'Backspace';
    let target = '';
    let buf = '';
    let strokes = [];
    function sessReset(text) {
        target = text;
        buf = '';
        strokes = [];
    }
    // 키 하나를 받는다 — 지우기는 마지막 글자를 빼고, 글자는 그 자리의 정답과 견줘 ok 를 정한다
    function press(k, t) {
        if (k === BS) {
            if (buf.length > 0) {
                buf = buf.slice(0, -1);
            }
            strokes.push({ t: t, k: k, ok: false });
            return;
        }
        if (buf.length >= target.length) {
            return;
        }
        const ok = k === target.charAt(buf.length);
        buf += k;
        strokes.push({ t: t, k: k, ok: ok });
    }
    // 글자 키 수와 맞은 수 — 지우기 키는 세지 않는다
    function keyCount() {
        let n = 0;
        for (let i = 0; i < strokes.length; i += 1) {
            if (strokes[i].k !== BS) {
                n += 1;
            }
        }
        return n;
    }
    function okCount() {
        let n = 0;
        for (let i = 0; i < strokes.length; i += 1) {
            if (strokes[i].ok) {
                n += 1;
            }
        }
        return n;
    }
    // 정확도 — 맞은 글자 키 ÷ 글자 키 전체. 지워도 이미 친 틀린 키는 남는다
    function accuracy() {
        const n = keyCount();
        return n === 0 ? 100 : (okCount() / n) * 100;
    }
    // 자리 옆 키 — 틀린 키는 같은 줄의 이웃 글쇠에서 고른다(스페이스 바는 c, 글자가 아닌 키는 n)
    function nearKey(ch, rnd) {
        const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
        for (let r = 0; r < rows.length; r += 1) {
            const i = rows[r].indexOf(ch);
            if (i >= 0) {
                const j = i === 0 ? 1 : (i === rows[r].length - 1 ? i - 1 : (rnd() < 0.5 ? i - 1 : i + 1));
                return rows[r].charAt(j);
            }
        }
        return ch === ' ' ? 'c' : 'n';
    }
    // 시드 가상 타자 — 글자마다 간격은 pace(지금 시각) 의 ±20%, 오타는 지정한 자리에서만 낸다
    // miss 는 [글자 자리, 알아채기 전에 더 치는 글자 수, 틀린 키 수(생략하면 1)] 목록. 틀린 키를 치고 lag 글자를 더 친 뒤 한 번에 지우고 다시 친다
    function genStrokes(seed, text, pace, miss, t0) {
        const rnd = seeded(seed);
        const out = [];
        let t = t0;
        let i = 0;
        const handled = {};
        while (i < text.length) {
            let hit = null;
            for (let m = 0; m < miss.length; m += 1) {
                if (miss[m][0] === i && !handled[i]) {
                    hit = miss[m];
                }
            }
            t += pace(t) * (0.8 + 0.4 * rnd());
            if (hit) {
                handled[i] = true;
                const lag = Math.min(hit[1], text.length - 1 - i);
                const bad = hit.length > 2 ? hit[2] : 1;
                for (let j = 0; j <= lag; j += 1) {
                    if (j > 0) {
                        t += pace(t) * (0.8 + 0.4 * rnd());
                    }
                    out.push({ t: t, k: j < bad ? nearKey(text.charAt(i + j), rnd) : text.charAt(i + j) });
                }
                t += 0.26 + 0.16 * rnd();
                for (let j = 0; j <= lag; j += 1) {
                    out.push({ t: t, k: BS });
                    t += 0.09;
                }
                continue;
            }
            out.push({ t: t, k: text.charAt(i) });
            i += 1;
        }
        return out;
    }
    // 시간표에 가상 타자의 키를 모두 올린다 — 끝나는 시각(doneAt)과 되풀이 시각(lapEnd)도 여기서 정한다
    function schedule(raw, hold) {
        for (let i = 0; i < raw.length; i += 1) {
            const r = raw[i];
            sched(r.t, function () { onKey(r.k, r.t); });
        }
        doneAt = raw.length > 0 ? raw[raw.length - 1].t + 0.35 : 1;
        lapEnd = doneAt + hold;
    }
    function defaultFinished() {
        return live ? buf.length >= target.length : sceneT >= doneAt;
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const stepEl = root.querySelector('[data-role="step"]');
    const doneEl = root.querySelector('[data-role="done"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !stepEl || !doneEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const stepBtn = stepEl;
    const doneP = doneEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만. 타자 글자는 고정폭이라 칸 폭이 흔들리지 않는다
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    const MONO_STACK = 'ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const VIEW_S = 0.88;
    function skyFill(top, bot) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bot, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        // 위쪽 一時停止·상태 알약이 덮는 띠를 비우려고 장면 전체를 VIEW_S 배로 줄여 아래 가운데에 붙인다 — 이 줄 뒤에 그리는 것은 모두 줄어든 좌표계
        ctx.translate(W / 2, H - 3);
        ctx.scale(VIEW_S, VIEW_S);
        ctx.translate(-W / 2, -(H - 3));
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function seg(x1, y1, x2, y2, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function outline(x, y, w, h, r, width, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 고정폭 글자 — 칸마다 같은 폭이라 커서와 오타 칸이 글자에 정확히 겹친다
    function mono(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + MONO_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 고정폭 글꼴 한 칸의 폭 — 글꼴이 바뀌면 같이 바뀐다
    function monoW(px) {
        ctx.font = '400 ' + px + 'px ' + MONO_STACK;
        return ctx.measureText('M').width;
    }
    // 글자 이름표 — 바탕 알약 위에 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    function panel(x, y, w, h, c, a) {
        box(x, y, w, h, 12, c, a);
        outline(x, y, w, h, 12, 1.5, FACE_EDGE, 0.9);
    }
    // ── 공통 틀 ───────────────────────────────────────────────
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 한 판이 끝났음을 스크린리더에 한 번만 알린다 — 판이 되풀이돼도 다시 읽지 않는다
    let doneSaid = false;
    function checkDone() {
        if (!doneSaid && finished()) {
            doneSaid = true;
            doneP.textContent = statusText();
        }
    }
    function advance(dt) {
        sceneT += dt;
        while (evAt < script.length && script[evAt].t <= sceneT) {
            const ev = script[evAt];
            evAt += 1;
            ev.f();
        }
        if (!live && sceneT >= lapEnd) {
            lap += 1;
            begin();
            return;
        }
        update(dt);
    }
    // 시간표를 새로 짠다 — 같은 시각이면 짠 순서대로 부른다(정렬은 안정)
    function fresh() {
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        script.sort(function (a, b) { return a.t - b.t; });
    }
    // 첫 판은 START_S 만큼 앞서 시작한다 — 타자가 이미 치고 있는 장면에서 보인다
    function runTo(t) {
        while (sceneT < t - 1e-6) {
            advance(Math.min(1 / 30, t - sceneT));
        }
    }
    function begin() {
        fresh();
        if (lap === 0 && !still) {
            runTo(START_S);
        }
    }
    const DT_MAX = 0.05;
    function showNow() {
        draw();
        pushStatus(statusText());
        checkDone();
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        showNow();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 한 판이 끝난 멈춘 한 장. 시간표를 끝까지 돌려 결과 화면에서 멈춘다
    function showRest() {
        stopLoop();
        live = false;
        fresh();
        runTo(doneAt);
        doneSaid = false;
        showNow();
    }
    function play() {
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    // 처음부터 — 자동 시연은 시간표를 다시, 직접 치던 중이면 빈 연습판을 다시
    function restart() {
        lap += 1;
        doneSaid = false;
        if (still) {
            showRest();
            return;
        }
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    // 직접 치기 — 첫 키가 오면 가상 타자를 빼고 빈 판에서 시작한다
    let lastStamp = -1;
    function goLive() {
        live = true;
        doneSaid = false;
        lastStamp = -1;
        shownStatus = '';
        fresh();
        if (still) {
            showNow();
        }
        else {
            lastTs = -1;
            showNow();
            if (!paused) {
                startLoop();
            }
        }
    }
    // 이벤트 시각 e.timeStamp 와 rAF 시각은 같은 원점이라 빼면 마지막 프레임 이후의 간격이 나온다
    function liveKey(k, stamp) {
        let t = sceneT;
        if (still) {
            if (lastStamp >= 0) {
                sceneT += clamp((stamp - lastStamp) / 1000, 0, 2);
            }
            lastStamp = stamp;
            t = sceneT;
        }
        else if (lastTs >= 0) {
            t = sceneT + clamp((stamp - lastTs) / 1000, 0, DT_MAX);
        }
        onKey(k, t);
        if (still) {
            update(0);
            showNow();
        }
    }
    // 一歩進める — 멈춘 채 시간표의 다음 키 하나까지 시계를 보낸다. 더 부를 일이 없으면 판을 다시 연다
    function stepOnce() {
        if (live) {
            return;
        }
        wake();
        if (!paused) {
            paused = true;
            pauseBtn.setAttribute('aria-pressed', 'true');
            stopLoop();
        }
        if (evAt >= script.length) {
            restart();
            return;
        }
        runTo(script[evAt].t + 0.05);
        showNow();
    }
    // 키 이름 바꾸기 — 한글 자모 장면은 이 함수를 덮어쓴다. 글자 키와 지우기 키만 받고 나머지는 빈 문자열
    let keyMap = null;
    function keyOf(e) {
        if (keyMap) {
            return keyMap(e);
        }
        if (e.key === 'Backspace') {
            return BS;
        }
        return e.key.length === 1 ? e.key : '';
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    stepBtn.addEventListener('click', stepOnce, { signal: off.signal });
    // 키보드 — 무대에 포커스가 있을 때만. 글자 키는 직접 치기, Esc 는 처음부터. Tab 은 그대로 두어 포커스가 나갈 수 있다
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        if (e.key === 'Escape') {
            e.preventDefault();
            wake();
            if (live) {
                goLive();
            }
            else {
                restart();
            }
            return;
        }
        const k = keyOf(e);
        if (k === '') {
            return;
        }
        e.preventDefault();
        if (paused) {
            return;
        }
        if (!live) {
            wake();
            goLive();
        }
        liveKey(k, e.timeStamp);
    }, { signal: off.signal });
    // 마우스·터치 — 무대를 누르면 키보드 포커스만 준다
    pad.addEventListener('click', function () {
        pad.focus({ preventScroll: true });
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 결과 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            live = false;
            lap = 0;
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        showNow();
    }, { signal: off.signal });
    // ── 02 커서 앞으로 밀리는 줄 스크롤 ─────────────────────────
    // 왼쪽 줄은 지금 글자가 칸 폭의 FOCUS_X 지점에 오도록 목표 이동값을 정하고, 프레임마다 그 차이의 일부만 따라간다(FOLLOW_EASE)
    // 오른쪽 줄은 커서가 오른쪽 끝에 닿을 때만 한 쪽씩 넘겨 눈이 자꾸 튄다. 둘 다 같은 키 기록에서 커서 자리를 읽는다
    const FOCUS_X = 0.5;
    const FOLLOW_EASE = 6;
    const GLYPH_PX = 14;
    const VIEW_W = 202;
    const START_S = 6.8;
    const TEXT_02 = 'the lamp on the desk glows while the rain taps the glass and the cat sleeps on the warm shelf by the door';
    let hist = [];
    let shiftL = 0;
    let shiftR = 0;
    let devL = 0;
    let devR = 0;
    let frames = 0;
    let jumps = 0;
    let lastShift = 0;
    // SIM-BEGIN
    function makeRun() {
        return genStrokes(21, TEXT_02, function () { return 0.12; }, [[34, 0], [71, 1]], 0.4);
    }
    // 목표 이동값 — 지금 글자가 칸 폭의 FOCUS_X 지점에 오게 하는 값. 줄 앞쪽에서는 0 밑으로 내려가지 않는다
    function lineShift(caretX, viewW) {
        return Math.max(0, caretX - FOCUS_X * viewW);
    }
    // 프레임 길이와 상관없이 같은 빠르기로 따라가게 하는 지수 접근 — 차이의 (1 − e^(−FOLLOW_EASE·dt)) 만큼만 줄인다
    function followStep(cur, goal, dt) {
        return cur + (goal - cur) * (1 - Math.exp(-FOLLOW_EASE * dt));
    }
    // 쪽 넘김 — 커서가 오른쪽 끝 세 칸 안으로 들어오면 한 쪽을 통째로 넘긴다
    function pageShift(caretX, viewW, cw) {
        const page = viewW - 3 * cw;
        return Math.floor(caretX / page) * page;
    }
    // SIM-END
    function build() {
        sessReset(TEXT_02);
        hist = [];
        shiftL = 0;
        shiftR = 0;
        devL = 0;
        devR = 0;
        frames = 0;
        jumps = 0;
        lastShift = 0;
        if (!live) {
            schedule(makeRun(), 2.4);
        }
    }
    function onKey(k, t) { press(k, t); }
    function finished() { return defaultFinished(); }
    function update(dt) {
        if (dt < 0) {
            return;
        }
        const cw = monoW(GLYPH_PX);
        const cx = buf.length * cw;
        shiftL = followStep(shiftL, lineShift(cx, VIEW_W), dt);
        shiftR = pageShift(cx, VIEW_W, cw);
        const a = cx - shiftL;
        const b = cx - shiftR;
        // 눈이 머무는 자리(칸 폭의 FOCUS_X 지점)에서 커서가 벗어난 거리를 프레임마다 쌓는다
        devL += Math.abs(a - FOCUS_X * VIEW_W);
        devR += Math.abs(b - FOCUS_X * VIEW_W);
        frames += 1;
        if (shiftR !== lastShift) {
            jumps += 1;
            lastShift = shiftR;
        }
        hist.push({ t: sceneT, a: a, b: b });
        while (hist.length > 1 && hist[0].t < sceneT - 6) {
            hist.shift();
        }
    }
    function devAvg(sum) { return frames === 0 ? 0 : sum / frames; }
    function strip(x0, y0, shift) {
        const cw = monoW(GLYPH_PX);
        box(x0, y0, VIEW_W, 36, 8, [255, 255, 255], 0.85);
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x0, y0, VIEW_W, 36, 8);
        ctx.clip();
        const c = buf.length;
        for (let i = 0; i < target.length; i += 1) {
            const x = x0 + i * cw - shift;
            if (x < x0 - cw || x > x0 + VIEW_W) {
                continue;
            }
            if (i < c) {
                const ok = buf.charAt(i) === target.charAt(i);
                if (!ok) {
                    box(x, y0 + 5, cw, 26, 3, ROSE, 0.7);
                }
                mono(buf.charAt(i), x + cw / 2, y0 + 19, ok ? MINT_DEEP : ROSE_DEEP, 1, GLYPH_PX, 700, 'center');
            }
            else {
                mono(target.charAt(i), x + cw / 2, y0 + 19, INK, 0.9, GLYPH_PX, 400, 'center');
            }
        }
        const kx = x0 + c * cw - shift;
        box(kx - 1, y0 + 4, 2.6, 28, 1, LAV_DEEP, 1);
        ctx.restore();
    }
    function trace(x0, y0, w, h, useA) {
        box(x0, y0, w, h, 8, [255, 255, 255], 0.75);
        // 칸 폭의 FOCUS_X 지점 — 눈이 머무는 곳
        const fy = y0 + h - 4 - FOCUS_X * (h - 8);
        seg(x0 + 4, fy, x0 + w - 4, fy, 1, FACE_EDGE, 0.8);
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x0, y0, w, h, 8);
        ctx.clip();
        ctx.beginPath();
        for (let i = 0; i < hist.length; i += 1) {
            const v = useA ? hist[i].a : hist[i].b;
            const x = x0 + w - ((sceneT - hist[i].t) / 6) * w;
            const y = y0 + h - 4 - clamp(v / VIEW_W, 0, 1) * (h - 8);
            if (i === 0) {
                ctx.moveTo(x, y);
            }
            else {
                ctx.lineTo(x, y);
            }
        }
        ctx.lineWidth = 2.4;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = rgba(useA ? MINT_DEEP : ROSE_DEEP, 1);
        ctx.stroke();
        ctx.restore();
    }
    function draw() {
        skyFill(BG_TOP, BG_BOT);
        const cw = monoW(GLYPH_PX);
        panel(10, 46, 226, 244, [255, 255, 255], 0.5);
        panel(244, 46, 226, 244, [255, 255, 255], 0.5);
        strip(22, 70, shiftL);
        strip(256, 70, shiftR);
        // 왼쪽 목표 표시 — 줄이 목표 이동값에 닿았을 때 커서가 서 있을 자리. 지금 커서와의 거리가 줄이 따라가야 할 차이다
        const goalX = 22 + buf.length * cw - lineShift(buf.length * cw, VIEW_W);
        box(goalX - 3, 108, 6, 5, 2, GOLD_DEEP, 0.9);
        text('画面上のカーソル位置・直近6秒', 123, 128, INK, 0.75, 10, 600, 'center');
        text('画面上のカーソル位置・直近6秒', 357, 128, INK, 0.75, 10, 600, 'center');
        trace(22, 138, 202, 92, true);
        trace(256, 138, 202, 92, false);
        tag('中心から平均 {n}px ずれ'.replace('{n}', String(Math.round(devAvg(devL)))), 123, 252, MINT, INK, 11, 'center');
        tag('中心から平均 {n}px ずれ'.replace('{n}', String(Math.round(devAvg(devR)))), 357, 252, ROSE, INK, 11, 'center');
        tag('カーソルに合わせてなめらかに送る', 123, 26, MINT, INK, 11, 'center');
        tag('端に届くと一ページずつ切り替わる', 357, 26, ROSE, INK, 11, 'center');
        tag('正確さ {p}%'.replace('{p}', accuracy().toFixed(0)), 123, 273, PAPER, INK, 11, 'center');
        tag('ページ送り {n}回'.replace('{n}', String(jumps)), 357, 273, PAPER, INK, 11, 'center');
    }
    function statusText() {
        return '{n}文字目・中心から {a}px 対 {b}px ずれ'.replace('{n}', String(buf.length)).replace('{a}', String(Math.round(devAvg(devL)))).replace('{b}', String(Math.round(devAvg(devR))));
    }
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
