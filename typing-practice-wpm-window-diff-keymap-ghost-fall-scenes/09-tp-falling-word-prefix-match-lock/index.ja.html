<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接頭辞で選ぶ落下単語 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="タイピング練習の舞台 — キーを押すと自分で練習、Esc で最初から">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="英単語が上から下へ落ちる二つの盤です。左は最初の文字を押すとその文字で始まる一番低い単語に狙いが固定され、以降の文字はその単語にだけ積まれて打ち終えると弾け、右は一番低い単語だけを受け付けるので、別の単語を打ち始めると文字が捨てられて単語が床に届きます。各盤の下に捕まえた単語と逃した数が見えます。"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">タイピング練習のデモ</p>
  <div class="vj__ctrl">
    <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
    <button class="vj__step" data-role="step" type="button">一歩進める</button>
  </div>
  <p class="vj__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const PI = Math.PI;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 선형 합동 생성기(곱 1664525, 더함 1013904223). 같은 시드면 같은 수열
    function seeded(seed) {
        let s = (seed >>> 0) || 1;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 파스텔 팔레트 — 글자는 늘 INK 나 진한 색, 면은 연한 색. 맞음은 민트, 틀림은 분홍, 내 커서는 라벤더
    const BG_TOP = [250, 246, 252];
    const BG_BOT = [228, 234, 250];
    const FACE = [255, 253, 248];
    const FACE_EDGE = [206, 198, 226];
    const SKY = [176, 210, 246];
    const SKY_DEEP = [60, 104, 162];
    const GOLD = [250, 226, 150];
    const GOLD_DEEP = [150, 108, 20];
    const ROSE = [240, 150, 176];
    const ROSE_DEEP = [184, 44, 80];
    const MINT = [150, 214, 190];
    const MINT_DEEP = [18, 104, 76];
    const LAV = [188, 172, 236];
    const LAV_DEEP = [96, 74, 170];
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 장면 시계(초)·판 반복 번호·시간표 — 시간표는 (시각, 할 일) 목록이고 시각이 지나면 한 번씩 부른다
    // sceneT 는 rAF 타임스탬프 차이(dt, 한 프레임 0.05초 상한)를 쌓은 값 하나뿐이다 — 이 장면의 시간 원천은 이것 하나
    let sceneT = 0;
    let lap = 0;
    let script = [];
    let evAt = 0;
    // 자동 시연이 끝나는 시각과 한 판이 되풀이되는 시각 — build() 가 시간표를 짜면서 정한다
    let doneAt = 12;
    let lapEnd = 14;
    // 사람이 직접 키를 치는 중인가 — 켜지면 시간표의 가상 타자는 빠지고 판은 되풀이되지 않는다
    let live = false;
    function sched(t, f) { script.push({ t: t, f: f }); }
    // ── 타자 기록 ─────────────────────────────────────────────
    // 한 번의 키 입력은 (누른 시각, 키) 두 값이다. 타수도 오타도 열지도도 이 목록에서만 계산한다
    const BS = 'Backspace';
    let target = '';
    let buf = '';
    let strokes = [];
    function sessReset(text) {
        target = text;
        buf = '';
        strokes = [];
    }
    // 키 하나를 받는다 — 지우기는 마지막 글자를 빼고, 글자는 그 자리의 정답과 견줘 ok 를 정한다
    function press(k, t) {
        if (k === BS) {
            if (buf.length > 0) {
                buf = buf.slice(0, -1);
            }
            strokes.push({ t: t, k: k, ok: false });
            return;
        }
        if (buf.length >= target.length) {
            return;
        }
        const ok = k === target.charAt(buf.length);
        buf += k;
        strokes.push({ t: t, k: k, ok: ok });
    }
    // 글자 키 수와 맞은 수 — 지우기 키는 세지 않는다
    function keyCount() {
        let n = 0;
        for (let i = 0; i < strokes.length; i += 1) {
            if (strokes[i].k !== BS) {
                n += 1;
            }
        }
        return n;
    }
    function okCount() {
        let n = 0;
        for (let i = 0; i < strokes.length; i += 1) {
            if (strokes[i].ok) {
                n += 1;
            }
        }
        return n;
    }
    // 정확도 — 맞은 글자 키 ÷ 글자 키 전체. 지워도 이미 친 틀린 키는 남는다
    function accuracy() {
        const n = keyCount();
        return n === 0 ? 100 : (okCount() / n) * 100;
    }
    // 자리 옆 키 — 틀린 키는 같은 줄의 이웃 글쇠에서 고른다(스페이스 바는 c, 글자가 아닌 키는 n)
    function nearKey(ch, rnd) {
        const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
        for (let r = 0; r < rows.length; r += 1) {
            const i = rows[r].indexOf(ch);
            if (i >= 0) {
                const j = i === 0 ? 1 : (i === rows[r].length - 1 ? i - 1 : (rnd() < 0.5 ? i - 1 : i + 1));
                return rows[r].charAt(j);
            }
        }
        return ch === ' ' ? 'c' : 'n';
    }
    // 시드 가상 타자 — 글자마다 간격은 pace(지금 시각) 의 ±20%, 오타는 지정한 자리에서만 낸다
    // miss 는 [글자 자리, 알아채기 전에 더 치는 글자 수, 틀린 키 수(생략하면 1)] 목록. 틀린 키를 치고 lag 글자를 더 친 뒤 한 번에 지우고 다시 친다
    function genStrokes(seed, text, pace, miss, t0) {
        const rnd = seeded(seed);
        const out = [];
        let t = t0;
        let i = 0;
        const handled = {};
        while (i < text.length) {
            let hit = null;
            for (let m = 0; m < miss.length; m += 1) {
                if (miss[m][0] === i && !handled[i]) {
                    hit = miss[m];
                }
            }
            t += pace(t) * (0.8 + 0.4 * rnd());
            if (hit) {
                handled[i] = true;
                const lag = Math.min(hit[1], text.length - 1 - i);
                const bad = hit.length > 2 ? hit[2] : 1;
                for (let j = 0; j <= lag; j += 1) {
                    if (j > 0) {
                        t += pace(t) * (0.8 + 0.4 * rnd());
                    }
                    out.push({ t: t, k: j < bad ? nearKey(text.charAt(i + j), rnd) : text.charAt(i + j) });
                }
                t += 0.26 + 0.16 * rnd();
                for (let j = 0; j <= lag; j += 1) {
                    out.push({ t: t, k: BS });
                    t += 0.09;
                }
                continue;
            }
            out.push({ t: t, k: text.charAt(i) });
            i += 1;
        }
        return out;
    }
    // 시간표에 가상 타자의 키를 모두 올린다 — 끝나는 시각(doneAt)과 되풀이 시각(lapEnd)도 여기서 정한다
    function schedule(raw, hold) {
        for (let i = 0; i < raw.length; i += 1) {
            const r = raw[i];
            sched(r.t, function () { onKey(r.k, r.t); });
        }
        doneAt = raw.length > 0 ? raw[raw.length - 1].t + 0.35 : 1;
        lapEnd = doneAt + hold;
    }
    function defaultFinished() {
        return live ? buf.length >= target.length : sceneT >= doneAt;
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const stepEl = root.querySelector('[data-role="step"]');
    const doneEl = root.querySelector('[data-role="done"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !stepEl || !doneEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const stepBtn = stepEl;
    const doneP = doneEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만. 타자 글자는 고정폭이라 칸 폭이 흔들리지 않는다
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    const MONO_STACK = 'ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const VIEW_S = 0.88;
    function skyFill(top, bot) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bot, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        // 위쪽 一時停止·상태 알약이 덮는 띠를 비우려고 장면 전체를 VIEW_S 배로 줄여 아래 가운데에 붙인다 — 이 줄 뒤에 그리는 것은 모두 줄어든 좌표계
        ctx.translate(W / 2, H - 3);
        ctx.scale(VIEW_S, VIEW_S);
        ctx.translate(-W / 2, -(H - 3));
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function seg(x1, y1, x2, y2, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function outline(x, y, w, h, r, width, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 고정폭 글자 — 칸마다 같은 폭이라 커서와 오타 칸이 글자에 정확히 겹친다
    function mono(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + MONO_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 고정폭 글꼴 한 칸의 폭 — 글꼴이 바뀌면 같이 바뀐다
    function monoW(px) {
        ctx.font = '400 ' + px + 'px ' + MONO_STACK;
        return ctx.measureText('M').width;
    }
    // 글자 이름표 — 바탕 알약 위에 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    function panel(x, y, w, h, c, a) {
        box(x, y, w, h, 12, c, a);
        outline(x, y, w, h, 12, 1.5, FACE_EDGE, 0.9);
    }
    // ── 공통 틀 ───────────────────────────────────────────────
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 한 판이 끝났음을 스크린리더에 한 번만 알린다 — 판이 되풀이돼도 다시 읽지 않는다
    let doneSaid = false;
    function checkDone() {
        if (!doneSaid && finished()) {
            doneSaid = true;
            doneP.textContent = statusText();
        }
    }
    function advance(dt) {
        sceneT += dt;
        while (evAt < script.length && script[evAt].t <= sceneT) {
            const ev = script[evAt];
            evAt += 1;
            ev.f();
        }
        if (!live && sceneT >= lapEnd) {
            lap += 1;
            begin();
            return;
        }
        update(dt);
    }
    // 시간표를 새로 짠다 — 같은 시각이면 짠 순서대로 부른다(정렬은 안정)
    function fresh() {
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        script.sort(function (a, b) { return a.t - b.t; });
    }
    // 첫 판은 START_S 만큼 앞서 시작한다 — 타자가 이미 치고 있는 장면에서 보인다
    function runTo(t) {
        while (sceneT < t - 1e-6) {
            advance(Math.min(1 / 30, t - sceneT));
        }
    }
    function begin() {
        fresh();
        if (lap === 0 && !still) {
            runTo(START_S);
        }
    }
    const DT_MAX = 0.05;
    function showNow() {
        draw();
        pushStatus(statusText());
        checkDone();
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        showNow();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 한 판이 끝난 멈춘 한 장. 시간표를 끝까지 돌려 결과 화면에서 멈춘다
    function showRest() {
        stopLoop();
        live = false;
        fresh();
        runTo(doneAt);
        doneSaid = false;
        showNow();
    }
    function play() {
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    // 처음부터 — 자동 시연은 시간표를 다시, 직접 치던 중이면 빈 연습판을 다시
    function restart() {
        lap += 1;
        doneSaid = false;
        if (still) {
            showRest();
            return;
        }
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    // 직접 치기 — 첫 키가 오면 가상 타자를 빼고 빈 판에서 시작한다
    let lastStamp = -1;
    function goLive() {
        live = true;
        doneSaid = false;
        lastStamp = -1;
        shownStatus = '';
        fresh();
        if (still) {
            showNow();
        }
        else {
            lastTs = -1;
            showNow();
            if (!paused) {
                startLoop();
            }
        }
    }
    // 이벤트 시각 e.timeStamp 와 rAF 시각은 같은 원점이라 빼면 마지막 프레임 이후의 간격이 나온다
    function liveKey(k, stamp) {
        let t = sceneT;
        if (still) {
            if (lastStamp >= 0) {
                sceneT += clamp((stamp - lastStamp) / 1000, 0, 2);
            }
            lastStamp = stamp;
            t = sceneT;
        }
        else if (lastTs >= 0) {
            t = sceneT + clamp((stamp - lastTs) / 1000, 0, DT_MAX);
        }
        onKey(k, t);
        if (still) {
            update(0);
            showNow();
        }
    }
    // 一歩進める — 멈춘 채 시간표의 다음 키 하나까지 시계를 보낸다. 더 부를 일이 없으면 판을 다시 연다
    function stepOnce() {
        if (live) {
            return;
        }
        wake();
        if (!paused) {
            paused = true;
            pauseBtn.setAttribute('aria-pressed', 'true');
            stopLoop();
        }
        if (evAt >= script.length) {
            restart();
            return;
        }
        runTo(script[evAt].t + 0.05);
        showNow();
    }
    // 키 이름 바꾸기 — 한글 자모 장면은 이 함수를 덮어쓴다. 글자 키와 지우기 키만 받고 나머지는 빈 문자열
    let keyMap = null;
    function keyOf(e) {
        if (keyMap) {
            return keyMap(e);
        }
        if (e.key === 'Backspace') {
            return BS;
        }
        return e.key.length === 1 ? e.key : '';
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    stepBtn.addEventListener('click', stepOnce, { signal: off.signal });
    // 키보드 — 무대에 포커스가 있을 때만. 글자 키는 직접 치기, Esc 는 처음부터. Tab 은 그대로 두어 포커스가 나갈 수 있다
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        if (e.key === 'Escape') {
            e.preventDefault();
            wake();
            if (live) {
                goLive();
            }
            else {
                restart();
            }
            return;
        }
        const k = keyOf(e);
        if (k === '') {
            return;
        }
        e.preventDefault();
        if (paused) {
            return;
        }
        if (!live) {
            wake();
            goLive();
        }
        liveKey(k, e.timeStamp);
    }, { signal: off.signal });
    // 마우스·터치 — 무대를 누르면 키보드 포커스만 준다
    pad.addEventListener('click', function () {
        pad.focus({ preventScroll: true });
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 결과 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            live = false;
            lap = 0;
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        showNow();
    }, { signal: off.signal });
    // ── 09 접두어로 고르는 낙하 단어 ─────────────────────────────
    // 단어가 FALL_SPEED 로 내려오는 동안 첫 글자를 누르면, 그 글자로 시작하는 가장 낮은 단어에 조준이 걸리고(lockIdx) 이후 글자는 그 단어에만 쌓인다
    // 다 치면 터져 사라진다. 오른쪽 판은 첫 글자를 보지 않고 가장 낮은 단어만 받아서, 다른 단어를 치기 시작하면 글자가 버려진다
    const WORD_LIST = ['moon', 'lamp', 'fern', 'sand', 'leaf', 'dusk', 'wind', 'star', 'pine', 'rain'];
    const FALL_SPEED = 40;
    const Y_TOP = 64;
    const Y_FLOOR = 214;
    const X_TAB = [14, 92, 150, 50, 118, 24, 102, 70, 142, 36];
    const ORDER = [0, 1, 3, 2, 4, 6, 5, 7, 9, 8];
    const GAP_S = 1.0;
    const START_S = 6.6;
    function sideNew() {
        const z = [];
        const e = [];
        for (let i = 0; i < WORD_LIST.length; i += 1) {
            z.push(0);
            e.push(-9);
        }
        return { prog: z.slice(), st: z.slice(), lock: -1, miss: 0, hit: 0, fall: 0, bursts: [], endT: e };
    }
    function spawnAt(i) { return 0.3 + i * GAP_S; }
    function yOf(i, t) { return Y_TOP + FALL_SPEED * (t - spawnAt(i)); }
    // 화면에 나와 있고 아직 끝나지 않은 단어 번호
    function onScreen(s, t) {
        const out = [];
        for (let i = 0; i < WORD_LIST.length; i += 1) {
            if (s.st[i] === 0 && t >= spawnAt(i)) {
                out.push(i);
            }
        }
        return out;
    }
    // 첫 글자가 k 인 단어 중 가장 낮은(y 가 큰) 단어 — 없으면 -1
    function lockIdx(s, k, t) {
        let best = -1;
        const on = onScreen(s, t);
        for (let j = 0; j < on.length; j += 1) {
            const i = on[j];
            if (WORD_LIST[i].charAt(0) === k && (best < 0 || yOf(i, t) > yOf(best, t))) {
                best = i;
            }
        }
        return best;
    }
    function finish(s, i, t) {
        s.st[i] = 1;
        s.hit += 1;
        s.endT[i] = t;
        s.bursts.push(i);
    }
    // 왼쪽 — 조준이 없으면 첫 글자로 고르고, 조준 뒤에는 그 단어의 다음 글자만 받는다
    function keyLeft(s, k, t) {
        if (s.lock < 0) {
            const i = lockIdx(s, k, t);
            if (i < 0) {
                s.miss += 1;
                return;
            }
            s.lock = i;
        }
        const w = WORD_LIST[s.lock];
        if (w.charAt(s.prog[s.lock]) !== k) {
            s.miss += 1;
            return;
        }
        s.prog[s.lock] += 1;
        if (s.prog[s.lock] >= w.length) {
            finish(s, s.lock, t);
            s.lock = -1;
        }
    }
    // 오른쪽 — 一番低い単語だけ受ける. 그 단어의 다음 글자가 아니면 글자가 버려진다
    function keyRight(s, k, t) {
        const on = onScreen(s, t);
        if (on.length === 0) {
            s.miss += 1;
            return;
        }
        let low = on[0];
        for (let j = 1; j < on.length; j += 1) {
            if (yOf(on[j], t) > yOf(low, t)) {
                low = on[j];
            }
        }
        const w = WORD_LIST[low];
        if (w.charAt(s.prog[low]) !== k) {
            s.miss += 1;
            return;
        }
        s.prog[low] += 1;
        if (s.prog[low] >= w.length) {
            finish(s, low, t);
        }
    }
    // 바닥에 닿은 단어는 놓친 것으로 센다 — 조준 중이던 단어였다면 조준도 푼다
    function landCheck(s, t) {
        for (let i = 0; i < WORD_LIST.length; i += 1) {
            if (s.st[i] === 0 && t >= spawnAt(i) && yOf(i, t) >= Y_FLOOR) {
                s.st[i] = 2;
                s.fall += 1;
                s.endT[i] = t;
                if (s.lock === i) {
                    s.lock = -1;
                }
            }
        }
    }
    function wordRun() {
        const rnd = seeded(91);
        const out = [];
        let t = 0.5;
        for (let n = 0; n < ORDER.length; n += 1) {
            const i = ORDER[n];
            t = Math.max(t + 0.3, spawnAt(i) + 0.45);
            for (let c = 0; c < WORD_LIST[i].length; c += 1) {
                t += 0.15 + 0.05 * rnd();
                out.push({ t: t, k: WORD_LIST[i].charAt(c) });
            }
        }
        return out;
    }
    // SIM-END
    let sL = sideNew();
    let sR = sideNew();
    function build() {
        sL = sideNew();
        sR = sideNew();
        if (!live) {
            const raw = wordRun();
            schedule(raw, 2.4);
            doneAt = Math.max(doneAt, spawnAt(WORD_LIST.length - 1) + (Y_FLOOR - Y_TOP) / FALL_SPEED + 0.5);
            lapEnd = doneAt + 2.4;
        }
    }
    function onKey(k, t) {
        if (k === BS) {
            return;
        }
        keyLeft(sL, k, t);
        keyRight(sR, k, t);
    }
    function finished() {
        if (!live) {
            return sceneT >= doneAt;
        }
        return sL.hit + sL.fall >= WORD_LIST.length && sR.hit + sR.fall >= WORD_LIST.length;
    }
    function update(dt) {
        if (dt < 0) {
            return;
        }
        landCheck(sL, sceneT);
        landCheck(sR, sceneT);
    }
    function pill(x0, s, i, locked) {
        const w = WORD_LIST[i];
        const cw = monoW(12);
        const pw = w.length * cw + 14;
        const x = x0 + X_TAB[i];
        const y = yOf(i, sceneT);
        if (s.st[i] === 0) {
            box(x, y, pw, 20, 10, locked ? LAV : [255, 255, 255], locked ? 0.95 : 0.95);
            outline(x, y, pw, 20, 10, locked ? 2.2 : 1.2, locked ? LAV_DEEP : FACE_EDGE, 1);
            for (let c = 0; c < w.length; c += 1) {
                mono(w.charAt(c), x + 7 + c * cw + cw / 2, y + 10.5, c < s.prog[i] ? MINT_DEEP : INK, 1, 12, c < s.prog[i] ? 800 : 400, 'center');
            }
        }
        else if (s.st[i] === 2) {
            const a = clamp(1 - (sceneT - s.endT[i]) / 0.6, 0, 1);
            box(x, Y_FLOOR, pw, 20, 10, ROSE, 0.9 * a);
            mono(w, x + pw / 2, Y_FLOOR + 10.5, INK, a, 12, 700, 'center');
        }
        else {
            const age = sceneT - s.endT[i];
            if (age < 0.5) {
                // 터짐 — 단어 자리에서 여덟 점이 퍼지며 옅어진다
                for (let b = 0; b < 8; b += 1) {
                    const ang = (b / 8) * TAU;
                    const r = 8 + 30 * ease(age / 0.5);
                    disc(x + pw / 2 + Math.cos(ang) * r, yOf(i, s.endT[i]) + 10 + Math.sin(ang) * r * 0.7, 3, b % 2 === 0 ? MINT_DEEP : GOLD, 1 - age / 0.5);
                }
            }
        }
    }
    function board(x0, s, useLock) {
        box(x0, 58, 202, 172, 8, [255, 255, 255], 0.45);
        seg(x0 + 4, Y_FLOOR + 22, x0 + 198, Y_FLOOR + 22, 2, ROSE_DEEP, 0.6);
        for (let i = 0; i < WORD_LIST.length; i += 1) {
            if (sceneT >= spawnAt(i)) {
                pill(x0, s, i, useLock && s.lock === i);
            }
        }
    }
    function draw() {
        skyFill(BG_TOP, BG_BOT);
        panel(10, 46, 226, 244, [255, 255, 255], 0.5);
        panel(244, 46, 226, 244, [255, 255, 255], 0.5);
        board(22, sL, true);
        board(256, sR, false);
        text('捕まえた {n}・逃した {m}'.replace('{n}', String(sL.hit)).replace('{m}', String(sL.fall)), 123, 248, MINT_DEEP, 1, 11, 700, 'center');
        text('捕まえた {n}・逃した {m}'.replace('{n}', String(sR.hit)).replace('{m}', String(sR.fall)), 357, 248, ROSE_DEEP, 1, 11, 700, 'center');
        tag('最初の文字で狙いが固定される', 123, 26, MINT, INK, 11, 'center');
        tag('一番低い単語だけ受ける', 357, 26, ROSE, INK, 11, 'center');
        tag('捨てられたキー {n}回'.replace('{n}', String(sL.miss)), 123, 273, PAPER, INK, 11, 'center');
        tag('捨てられたキー {n}回'.replace('{n}', String(sR.miss)), 357, 273, PAPER, INK, 11, 'center');
    }
    function statusText() {
        return '捕まえた {n}・逃した {m}・狙いなしの盤 {q}'.replace('{n}', String(sL.hit)).replace('{m}', String(sL.fall)).replace('{q}', String(sR.hit));
    }
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
