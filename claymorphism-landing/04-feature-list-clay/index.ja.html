<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rounded icon chips</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="featurelist">
    <li class="featurelist__item featurelist__item--a is-demo">
      <span class="featurelist__chip" aria-hidden="true"></span>
      <span class="featurelist__text">クイックスタート</span>
    </li>
    <li class="featurelist__item featurelist__item--b is-demo">
      <span class="featurelist__chip" aria-hidden="true"></span>
      <span class="featurelist__text">自動バックアップ</span>
    </li>
    <li class="featurelist__item featurelist__item--c is-demo">
      <span class="featurelist__chip" aria-hidden="true"></span>
      <span class="featurelist__text">リアルタイム共有</span>
    </li>
    <li class="featurelist__item featurelist__item--d is-demo">
      <span class="featurelist__chip" aria-hidden="true"></span>
      <span class="featurelist__text">カスタム通知</span>
    </li>
  </ul>
</main>
</body>
</html>
