<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chubby plan cards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pricing">
    <div class="pricing__card pricing__card--basic">
      <p class="pricing__name">Light</p>
      <p class="pricing__price">Free</p>
    </div>
    <div class="pricing__card pricing__card--pro is-demo">
      <span class="pricing__badge">Recommended</span>
      <p class="pricing__name">Pro</p>
      <p class="pricing__price">$9/mo</p>
      <button class="pricing__cta" type="button">Choose plan</button>
    </div>
  </div>
</main>
</body>
</html>
