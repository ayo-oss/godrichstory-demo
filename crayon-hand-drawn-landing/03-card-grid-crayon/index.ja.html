<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wobbly sticker card grid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="rough3" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.07" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div class="cardcrayon">
    <article class="cardcrayon__card cardcrayon__card--1">
      <svg class="cardcrayon__frame" viewBox="0 0 100 78" preserveAspectRatio="none" aria-hidden="true">
        <rect x="5" y="5" width="90" height="68" rx="12" class="cardcrayon__frame-rect cardcrayon__frame-rect--a" />
        <rect x="3" y="3" width="90" height="68" rx="12" class="cardcrayon__frame-rect cardcrayon__frame-rect--b" />
      </svg>
      <span class="cardcrayon__badge">NEW</span>
      <span class="cardcrayon__dot"></span>
      <p class="cardcrayon__label">手描きアイコン</p>
    </article>
    <article class="cardcrayon__card cardcrayon__card--2">
      <svg class="cardcrayon__frame" viewBox="0 0 100 78" preserveAspectRatio="none" aria-hidden="true">
        <rect x="5" y="5" width="90" height="68" rx="12" class="cardcrayon__frame-rect cardcrayon__frame-rect--a" />
        <rect x="3" y="3" width="90" height="68" rx="12" class="cardcrayon__frame-rect cardcrayon__frame-rect--b" />
      </svg>
      <span class="cardcrayon__badge">人気</span>
      <span class="cardcrayon__dot"></span>
      <p class="cardcrayon__label">よれよれカード</p>
    </article>
    <article class="cardcrayon__card cardcrayon__card--3">
      <svg class="cardcrayon__frame" viewBox="0 0 100 78" preserveAspectRatio="none" aria-hidden="true">
        <rect x="5" y="5" width="90" height="68" rx="12" class="cardcrayon__frame-rect cardcrayon__frame-rect--a" />
        <rect x="3" y="3" width="90" height="68" rx="12" class="cardcrayon__frame-rect cardcrayon__frame-rect--b" />
      </svg>
      <span class="cardcrayon__badge">新着</span>
      <span class="cardcrayon__dot"></span>
      <p class="cardcrayon__label">クレヨンバッジ</p>
    </article>
    <article class="cardcrayon__card cardcrayon__card--4">
      <svg class="cardcrayon__frame" viewBox="0 0 100 78" preserveAspectRatio="none" aria-hidden="true">
        <rect x="5" y="5" width="90" height="68" rx="12" class="cardcrayon__frame-rect cardcrayon__frame-rect--a" />
        <rect x="3" y="3" width="90" height="68" rx="12" class="cardcrayon__frame-rect cardcrayon__frame-rect--b" />
      </svg>
      <span class="cardcrayon__badge">無料</span>
      <span class="cardcrayon__dot"></span>
      <p class="cardcrayon__label">落書きアニメーション</p>
    </article>
  </div>
</main>
</body>
</html>
