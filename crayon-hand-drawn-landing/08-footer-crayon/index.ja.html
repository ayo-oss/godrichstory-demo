<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scissor-cut zigzag footer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="footcrayon">
    <div class="footcrayon__zigzag" aria-hidden="true"></div>
    <footer class="footcrayon__panel">
      <div class="footcrayon__col footcrayon__col--a">
        <p class="footcrayon__head">クラス</p>
        <p class="footcrayon__link">授業</p>
        <p class="footcrayon__link">資料</p>
      </div>
      <div class="footcrayon__col footcrayon__col--b">
        <p class="footcrayon__head">ブランド</p>
        <p class="footcrayon__link">紹介</p>
        <p class="footcrayon__link">お問い合わせ</p>
      </div>
      <div class="footcrayon__col footcrayon__col--c">
        <p class="footcrayon__head">ヘルプ</p>
        <p class="footcrayon__link">よくある質問</p>
        <p class="footcrayon__link">ガイド</p>
      </div>
      <p class="footcrayon__bottom">
        クレヨン・今日も一枚の絵
        <span class="footcrayon__star footcrayon__star--a" aria-hidden="true">✦</span>
        <span class="footcrayon__star footcrayon__star--b" aria-hidden="true">✦</span>
      </p>
    </footer>
  </div>
</main>
</body>
</html>
