<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scissor-cut zigzag footer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="footcrayon">
    <div class="footcrayon__zigzag" aria-hidden="true"></div>
    <footer class="footcrayon__panel">
      <div class="footcrayon__col footcrayon__col--a">
        <p class="footcrayon__head">클래스</p>
        <p class="footcrayon__link">수업</p>
        <p class="footcrayon__link">자료</p>
      </div>
      <div class="footcrayon__col footcrayon__col--b">
        <p class="footcrayon__head">브랜드</p>
        <p class="footcrayon__link">소개</p>
        <p class="footcrayon__link">문의</p>
      </div>
      <div class="footcrayon__col footcrayon__col--c">
        <p class="footcrayon__head">도움</p>
        <p class="footcrayon__link">자주 묻는 질문</p>
        <p class="footcrayon__link">가이드</p>
      </div>
      <p class="footcrayon__bottom">
        크레용 · 오늘도 그림 한 장
        <span class="footcrayon__star footcrayon__star--a" aria-hidden="true">✦</span>
        <span class="footcrayon__star footcrayon__star--b" aria-hidden="true">✦</span>
      </p>
    </footer>
  </div>
</main>
</body>
</html>
