<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scissor-cut zigzag footer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="footcrayon">
    <div class="footcrayon__zigzag" aria-hidden="true"></div>
    <footer class="footcrayon__panel">
      <div class="footcrayon__col footcrayon__col--a">
        <p class="footcrayon__head">Classes</p>
        <p class="footcrayon__link">Lessons</p>
        <p class="footcrayon__link">Resources</p>
      </div>
      <div class="footcrayon__col footcrayon__col--b">
        <p class="footcrayon__head">Brand</p>
        <p class="footcrayon__link">About</p>
        <p class="footcrayon__link">Contact</p>
      </div>
      <div class="footcrayon__col footcrayon__col--c">
        <p class="footcrayon__head">Help</p>
        <p class="footcrayon__link">FAQ</p>
        <p class="footcrayon__link">Guides</p>
      </div>
      <p class="footcrayon__bottom">
        Crayon · One drawing a day
        <span class="footcrayon__star footcrayon__star--a" aria-hidden="true">✦</span>
        <span class="footcrayon__star footcrayon__star--b" aria-hidden="true">✦</span>
      </p>
    </footer>
  </div>
</main>
</body>
</html>
