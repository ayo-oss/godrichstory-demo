<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crayon-scribble hero</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="rough1" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.06" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <section class="herocrayon">
    <svg class="herocrayon__frame" viewBox="0 0 300 190" preserveAspectRatio="none" aria-hidden="true">
      <rect x="6" y="6" width="288" height="178" rx="20" class="herocrayon__frame-rect"/>
    </svg>
    <div class="herocrayon__card">
      <p class="herocrayon__eyebrow">CRAYON KIDS</p>
      <h1 class="herocrayon__title">手で描いたみたいに</h1>
      <svg class="herocrayon__underline" viewBox="0 0 170 16" aria-hidden="true">
        <path class="herocrayon__underline-path" d="M4 9 C 28 3, 54 14, 84 7 S 136 3, 166 10" />
      </svg>
      <p class="herocrayon__desc">クレヨン感性のランディングキット</p>
      <button class="herocrayon__cta" type="button">無料体験</button>
    </div>
  </section>
</main>
</body>
</html>
