<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star-and-circle pricing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="rough5" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.08" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div class="pricecrayon">
    <div class="pricecrayon__card">
      <p class="pricecrayon__name">Sprout</p>
      <p class="pricecrayon__price">Free</p>
      <p class="pricecrayon__note">Forever</p>
    </div>
    <div class="pricecrayon__card pricecrayon__card--main">
      <span class="pricecrayon__star pricecrayon__star--a" aria-hidden="true">✦</span>
      <span class="pricecrayon__star pricecrayon__star--b" aria-hidden="true">✦</span>
      <p class="pricecrayon__name">Crayon</p>
      <span class="pricecrayon__price-wrap">
        <svg class="pricecrayon__ring" viewBox="0 0 100 46" aria-hidden="true">
          <path class="pricecrayon__ring-path" d="M50 4 C 22 3, 5 14, 6 23 C 7 34, 26 42, 50 42 C 74 42, 93 34, 94 23 C 95 13, 78 3, 50 5" />
        </svg>
        <p class="pricecrayon__price">₩12,000 / mo</p>
      </span>
      <p class="pricecrayon__note">Most popular</p>
    </div>
    <div class="pricecrayon__card">
      <p class="pricecrayon__name">Family</p>
      <p class="pricecrayon__price">₩9,000 / mo</p>
      <p class="pricecrayon__note">3+ people</p>
    </div>
  </div>
</main>
</body>
</html>
