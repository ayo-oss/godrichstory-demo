<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crayon-hatch CTA band</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="rough7" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.07" numOctaves="2" seed="44" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <section class="ctacrayon">
    <h2 class="ctacrayon__title">Color it in like a crayon, right now</h2>
    <p class="ctacrayon__desc">Try it for free</p>
    <span class="ctacrayon__btn-wrap">
      <svg class="ctacrayon__btn-frame" viewBox="0 0 120 44" preserveAspectRatio="none" aria-hidden="true">
        <rect x="4" y="4" width="112" height="36" rx="18" class="ctacrayon__btn-rect" />
      </svg>
      <button class="ctacrayon__btn" type="button">Get started</button>
    </span>
  </section>
</main>
</body>
</html>
