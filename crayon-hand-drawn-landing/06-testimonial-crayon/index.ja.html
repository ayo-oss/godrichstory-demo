<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crayon speech-bubble testimonial</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="rough6" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.06" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <figure class="testicrayon">
    <span class="testicrayon__avatar" aria-hidden="true"></span>
    <div class="testicrayon__bubble">
      <svg class="testicrayon__frame" viewBox="0 0 260 110" preserveAspectRatio="none" aria-hidden="true">
        <path class="testicrayon__frame-path" d="M18 10 L242 10 C 250 10 252 18 252 26 L252 78 C 252 88 248 96 238 96 L48 96 L30 110 L34 94 L18 92 C 10 90 8 82 8 74 L8 26 C 8 16 10 10 18 10 Z" />
      </svg>
      <blockquote class="testicrayon__quote">うちのクラスのサイトみたい</blockquote>
      <div class="testicrayon__stars" aria-hidden="true">
        <span class="testicrayon__star" aria-hidden="true" style="--fill:100%">★</span>
        <span class="testicrayon__star" aria-hidden="true" style="--fill:100%">★</span>
        <span class="testicrayon__star" aria-hidden="true" style="--fill:100%">★</span>
        <span class="testicrayon__star" aria-hidden="true" style="--fill:80%">★</span>
        <span class="testicrayon__star" aria-hidden="true" style="--fill:40%">★</span>
      </div>
      <figcaption class="testicrayon__caption">キム・ドダム・美術学院院長</figcaption>
    </div>
  </figure>
</main>
</body>
</html>
