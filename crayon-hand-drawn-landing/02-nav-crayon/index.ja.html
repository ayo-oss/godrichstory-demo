<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand-drawn circle nav</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="rough2" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.08" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <nav class="navcrayon">
    <span class="navcrayon__brand">クレヨン</span>
    <ul class="navcrayon__list">
      <li class="navcrayon__item navcrayon__item--active">
        <span class="navcrayon__label">ホーム</span>
        <svg class="navcrayon__loop" viewBox="0 0 56 30" aria-hidden="true">
          <path class="navcrayon__loop-path" d="M28 4 C 13 2, 4 11, 7 17 C 9 25, 20 28, 29 26 C 41 24, 50 17, 47 10 C 45 4, 33 2, 25 5" />
        </svg>
      </li>
      <li class="navcrayon__item"><span class="navcrayon__label">クラス</span></li>
      <li class="navcrayon__item"><span class="navcrayon__label">料金プラン</span></li>
      <li class="navcrayon__item"><span class="navcrayon__label">お問い合わせ</span></li>
    </ul>
    <button class="navcrayon__cta" type="button">体験申し込み</button>
  </nav>
</main>
</body>
</html>
