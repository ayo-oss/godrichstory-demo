<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double-line crayon buttons & inputs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="rough9" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.07" numOctaves="2" seed="51" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <form class="formcrayon">
    <label class="formcrayon__field">
      <span class="formcrayon__label">이름</span>
      <span class="formcrayon__input-wrap">
        <svg class="formcrayon__ring" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
          <rect x="3" y="3" width="94" height="34" rx="10" class="formcrayon__ring-rect" />
        </svg>
        <input class="formcrayon__input" type="text" placeholder="이름을 적어보세요" readonly>
      </span>
    </label>
    <span class="formcrayon__btn-wrap">
      <svg class="formcrayon__btn-frame" viewBox="0 0 110 40" preserveAspectRatio="none" aria-hidden="true">
        <rect x="5" y="5" width="100" height="30" rx="15" class="formcrayon__btn-rect formcrayon__btn-rect--a" />
        <rect x="3" y="3" width="100" height="30" rx="15" class="formcrayon__btn-rect formcrayon__btn-rect--b" />
      </svg>
      <button class="formcrayon__btn" type="button">저장하기</button>
    </span>
  </form>
</main>
</body>
</html>
