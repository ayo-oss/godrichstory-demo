<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand-drawn checklist</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="listcrayon">
    <li class="listcrayon__row listcrayon__row--1">
      <svg class="listcrayon__check" viewBox="0 0 20 16" aria-hidden="true">
        <path class="listcrayon__check-path" d="M2 9 C 3 8, 4 10, 7 13 C 10 10, 14 6, 18 2" />
      </svg>
      <span class="listcrayon__text">드래그로 배치</span>
    </li>
    <li class="listcrayon__row listcrayon__row--2">
      <svg class="listcrayon__check" viewBox="0 0 20 16" aria-hidden="true">
        <path class="listcrayon__check-path" d="M2 9 C 3 8, 4 10, 7 13 C 10 10, 14 6, 18 2" />
      </svg>
      <span class="listcrayon__text">색상 골라 칠하기</span>
    </li>
    <li class="listcrayon__row listcrayon__row--3">
      <svg class="listcrayon__check" viewBox="0 0 20 16" aria-hidden="true">
        <path class="listcrayon__check-path" d="M2 9 C 3 8, 4 10, 7 13 C 10 10, 14 6, 18 2" />
      </svg>
      <span class="listcrayon__text">손그림 아이콘 고르기</span>
    </li>
    <li class="listcrayon__row listcrayon__row--4">
      <svg class="listcrayon__check" viewBox="0 0 20 16" aria-hidden="true">
        <path class="listcrayon__check-path" d="M2 9 C 3 8, 4 10, 7 13 C 10 10, 14 6, 18 2" />
      </svg>
      <span class="listcrayon__text">바로 공유하기</span>
    </li>
  </ul>
</main>
</body>
</html>
