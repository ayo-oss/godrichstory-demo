<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Left slide drawer — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <div class="page" id="page">
    <button class="trigger" type="button" aria-haspopup="dialog" aria-controls="drawer1">Open menu</button>
  </div>
  <div class="overlay"></div>
  <nav class="drawer" id="drawer1" role="dialog" aria-modal="true" aria-labelledby="t1">
    <h2 id="t1">Menu</h2>
    <a class="drawer__link" href="#">Home</a>
    <a class="drawer__link" href="#">Products</a>
    <a class="drawer__link" href="#">Support</a>
    <button class="drawer__close" type="button">Close</button>
  </nav>
</main>
<script>
// 열림: 배경(#page)을 inert 로 막고 첫 링크로 포커스. 닫힘: inert 해제, 트리거로 포커스 복귀.
// Tab 키다운마다 포커스 가능 목록의 처음/끝을 감시해 드로어 밖으로 못 나가게 한다(포커스 트랩).
(function () {
  var stage = document.querySelector('.stage');
  var page = document.getElementById('page');
  var trigger = document.querySelector('.trigger');
  var overlay = document.querySelector('.overlay');
  var drawer = document.querySelector('.drawer');
  var closeBtn = document.querySelector('.drawer__close');
  function focusables() { return drawer.querySelectorAll('a, button'); }
  function open() {
    stage.classList.remove('is-demo'); stage.classList.add('is-open');
    page.setAttribute('inert', ''); page.setAttribute('aria-hidden', 'true');
    focusables()[0].focus({ preventScroll: true });
  }
  function shut() {
    stage.classList.remove('is-open');
    page.removeAttribute('inert'); page.removeAttribute('aria-hidden');
    trigger.focus({ preventScroll: true });
  }
  trigger.addEventListener('click', open);
  overlay.addEventListener('click', shut);
  closeBtn.addEventListener('click', shut);
  document.addEventListener('keydown', function (e) {
    if (!stage.classList.contains('is-open')) return;
    if (e.key === 'Escape') { shut(); return; }
    if (e.key !== 'Tab') return;
    var f = focusables(), first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { last.focus({ preventScroll: true }); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus({ preventScroll: true }); e.preventDefault(); }
  });
})();
</script>
</body>
</html>
