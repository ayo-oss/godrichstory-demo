<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Native dialog drawer — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <div class="page">
    <button class="trigger" type="button">Mở thiết lập</button>
  </div>
  <dialog class="drawer" id="d2" aria-labelledby="t2">
    <h2 id="t2">Thiết lập</h2>
    <p>Bảng này chính là phần tử dialog gốc của trình duyệt — ESC, click ra ngoài và bẫy focus không phải tự viết tay.</p>
    <button class="drawer__close" type="button">Đóng</button>
  </dialog>
</main>
<script>
// showModal 한 줄로 열면 포커스 이동·ESC Đóng·바깥 클릭 차단을 브라우저가 대신 한다.
// 로드 시엔 is-demo 를 그대로 두고 열어 데모 루프(keyframes)가 재생되게 한다.
// 실제 클릭(Đóng·바깥·재오픈)이 오면 그때 is-demo 를 떼 실제 상호작용으로 넘긴다.
(function () {
  var stage = document.querySelector('.stage');
  var trigger = document.querySelector('.trigger');
  var dlg = document.getElementById('d2');
  var closeBtn = document.querySelector('.drawer__close');
  function realOpen() { stage.classList.remove('is-demo'); dlg.showModal(); }
  dlg.addEventListener('close', function () { stage.classList.remove('is-demo'); });
  closeBtn.addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); }); // ::backdrop 클릭과 같은 효과
  trigger.addEventListener('click', realOpen);
  dlg.showModal();
})();
</script>
</body>
</html>
