<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottom sheet snap — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <div class="page" id="page">
    <button class="trigger" type="button" aria-haspopup="dialog" aria-controls="sheet4">リストを開く</button>
  </div>
  <div class="overlay"></div>
  <div class="sheet" id="sheet4" role="dialog" aria-modal="true" aria-labelledby="t4" data-snap="half">
    <button class="sheet__handle" type="button" aria-label="シートサイズ切替(peek・half・full)"></button>
    <h2 id="t4">周辺のスポット12件</h2>
    <p>ハンドルを押すたびに peek → half → full の順に変わる。</p>
  </div>
</main>
<script>
// 손잡이를 누를 때마다 data-snap 을 세 값 사이로 순환시킨다. CSS 는 그 값에 맞는 translateY 로만 반응.
(function () {
  var stage = document.querySelector('.stage');
  var page = document.getElementById('page');
  var trigger = document.querySelector('.trigger');
  var overlay = document.querySelector('.overlay');
  var sheet = document.querySelector('.sheet');
  var handle = document.querySelector('.sheet__handle');
  var steps = ['peek', 'half', 'full'];
  function open() {
    stage.classList.remove('is-demo'); stage.classList.add('is-open');
    page.setAttribute('inert', ''); page.setAttribute('aria-hidden', 'true');
    handle.focus({ preventScroll: true });
  }
  function shut() {
    stage.classList.remove('is-open'); sheet.dataset.snap = 'half';
    page.removeAttribute('inert'); page.removeAttribute('aria-hidden');
    trigger.focus({ preventScroll: true });
  }
  handle.addEventListener('click', function () {
    var i = steps.indexOf(sheet.dataset.snap);
    sheet.dataset.snap = steps[(i + 1) % steps.length];
  });
  trigger.addEventListener('click', open);
  overlay.addEventListener('click', shut);
  document.addEventListener('keydown', function (e) {
    if (stage.classList.contains('is-open') && e.key === 'Escape') shut();
  });
})();
</script>
</body>
</html>
