<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hide on scroll rail — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <div class="layout">
    <nav class="rail" aria-label="목차">
      <a class="rail__link" href="#">개요</a>
      <a class="rail__link" href="#">설치</a>
      <a class="rail__link" href="#">사용법</a>
      <a class="rail__link" href="#">문제 해결</a>
    </nav>
    <div class="content" id="content">
      <p>이 영역을 아래로 스크롤하면 왼쪽 레일이 비켜난다.</p>
      <p>다시 위로 스크롤하면 레일이 즉시 돌아온다.</p>
      <p>본문이 긴 문서에서 목차가 화면을 계속 차지하지 않게 한다.</p>
      <p>레일은 창 전체가 아니라 이 콘텐츠 영역의 스크롤만 본다.</p>
    </div>
  </div>
</main>
<script>
// 콘텐츠 스크롤 방향을 비교해 레일을 translateX 로 숨기고 보인다. 실제 스크롤이 오면 데모 루프를 넘긴다.
(function () {
  var stage = document.querySelector('.stage');
  var rail = document.querySelector('.rail');
  var content = document.getElementById('content');
  var last = 0;
  content.addEventListener('scroll', function () {
    stage.classList.remove('is-demo');
    var y = content.scrollTop;
    if (y > last + 4) rail.classList.add('is-hidden');
    else if (y < last - 4) rail.classList.remove('is-hidden');
    last = y;
  });
})();
</script>
</body>
</html>
