<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hide on scroll rail — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <div class="layout">
    <nav class="rail" aria-label="Mục lục">
      <a class="rail__link" href="#">Tổng quan</a>
      <a class="rail__link" href="#">Cài đặt</a>
      <a class="rail__link" href="#">Cách dùng</a>
      <a class="rail__link" href="#">Khắc phục sự cố</a>
    </nav>
    <div class="content" id="content">
      <p>Cuộn vùng này xuống thì thanh ray bên trái sẽ lùi sang một bên.</p>
      <p>Cuộn lên lại thì thanh ray quay về ngay lập tức.</p>
      <p>Giúp mục lục không chiếm màn hình mãi trong tài liệu dài.</p>
      <p>Thanh ray theo dõi việc cuộn của vùng nội dung này, không phải cả cửa sổ.</p>
    </div>
  </div>
</main>
<script>
// 콘텐츠 스크롤 방향을 비교해 레일을 translateX 로 숨기고 보인다. 실제 스크롤이 오면 데모 루프를 넘긴다.
(function () {
  var stage = document.querySelector('.stage');
  var rail = document.querySelector('.rail');
  var content = document.getElementById('content');
  var last = 0;
  content.addEventListener('scroll', function () {
    stage.classList.remove('is-demo');
    var y = content.scrollTop;
    if (y > last + 4) rail.classList.add('is-hidden');
    else if (y < last - 4) rail.classList.remove('is-hidden');
    last = y;
  });
})();
</script>
</body>
</html>
