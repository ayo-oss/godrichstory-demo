<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Push content drawer — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <div class="layout">
    <nav class="drawer" aria-label="サイドナビゲーション" aria-hidden="true">
      <a class="drawer__link" href="#" tabindex="-1">ダッシュボード</a>
      <a class="drawer__link" href="#" tabindex="-1">レポート</a>
      <a class="drawer__link" href="#" tabindex="-1">設定</a>
    </nav>
    <div class="content">
      <button class="trigger" type="button" aria-expanded="false">サイドバーを開く</button>
      <p class="content__line">本文エリアはオーバーレイなしで横にずれる。</p>
    </div>
  </div>
</main>
<script>
// 모달이 아니라 상시 내비게이션이라 inert 대신 aria-hidden·tabindex 로만 여닫힘을 알린다.
(function () {
  var stage = document.querySelector('.stage');
  var trigger = document.querySelector('.trigger');
  var drawer = document.querySelector('.drawer');
  var links = drawer.querySelectorAll('a');
  function set(open) {
    stage.classList.remove('is-demo');
    stage.classList.toggle('is-open', open);
    trigger.setAttribute('aria-expanded', String(open));
    drawer.setAttribute('aria-hidden', String(!open));
    links.forEach(function (a) { a.tabIndex = open ? 0 : -1; });
  }
  trigger.addEventListener('click', function () { set(!stage.classList.contains('is-open')); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && stage.classList.contains('is-open')) { set(false); trigger.focus({ preventScroll: true }); }
  });
})();
</script>
</body>
</html>
