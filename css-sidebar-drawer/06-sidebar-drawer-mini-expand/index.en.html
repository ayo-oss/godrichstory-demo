<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini to expand rail — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <nav class="rail" tabindex="0" aria-label="Side navigation">
    <div class="rail__inner">
      <a class="rail__item" href="#"><span class="rail__ic" aria-hidden="true"></span><span class="rail__label">Home</span></a>
      <a class="rail__item" href="#"><span class="rail__ic" aria-hidden="true"></span><span class="rail__label">Search</span></a>
      <a class="rail__item" href="#"><span class="rail__ic" aria-hidden="true"></span><span class="rail__label">Settings</span></a>
    </div>
  </nav>
</main>
<script>
// 실제 hover·focus 는 CSS 만으로 동작한다. 이 한 줄은 데모 루프를 실제 상호작용으로 넘겨주는 역할뿐이다.
document.querySelector('.rail').addEventListener('pointerenter', function () {
  document.querySelector('.stage').classList.remove('is-demo');
});
</script>
</body>
</html>
