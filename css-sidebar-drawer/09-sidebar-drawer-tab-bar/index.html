<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottom tab bar — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <nav class="tabbar" aria-label="하단 내비게이션">
    <button class="tab is-active" type="button" aria-current="page"><span class="tab__ic" aria-hidden="true"></span><span class="tab__label">홈</span></button>
    <button class="tab" type="button"><span class="tab__ic" aria-hidden="true"></span><span class="tab__label">검색</span></button>
    <button class="tab" type="button"><span class="tab__ic" aria-hidden="true"></span><span class="tab__label">찜</span></button>
    <button class="tab" type="button"><span class="tab__ic" aria-hidden="true"></span><span class="tab__label">마이</span></button>
    <span class="indicator" aria-hidden="true"></span>
  </nav>
</main>
<script>
(function () {
  var stage = document.querySelector('.stage');
  var tabs = document.querySelectorAll('.tab');
  var indicator = document.querySelector('.indicator');
  tabs.forEach(function (tab, i) {
    tab.addEventListener('click', function () {
      stage.classList.remove('is-demo');
      tabs.forEach(function (t) { t.classList.remove('is-active'); t.removeAttribute('aria-current'); });
      tab.classList.add('is-active'); tab.setAttribute('aria-current', 'page');
      indicator.style.transform = 'translateX(' + (i * 100) + '%)';
    });
  });
})();
</script>
</body>
</html>
