<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퍼센트 숫자가 부드럽게 따라가는 카운터 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="스플래시 시연 무대 — Enter 나 Space 나 R 이나 클릭으로 처음부터, P 로 일시정지, N 으로 한 걸음">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="리소스가 통째로 도착할 때만 오르는 목표 비율을 두 숫자가 받는다. 왼쪽 숫자는 남은 차의 일부씩 줄이며 목표를 따라가 부드럽게 오르고 오른쪽 숫자는 목표를 그대로 찍어 건너뛰며 멈춘 듯 보인다. 아래 그래프가 최근 4초의 목표와 표시값을 그린다"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">스플래시 시연</p>
  <div class="vj__ctrl">
    <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
    <button class="vj__step" data-role="step" type="button">한 걸음</button>
  </div>
  <p class="vj__done" data-role="done" role="status" aria-live="polite"></p>
  <div class="vj__prog" data-role="progress" role="progressbar" aria-label="스플래시 진행" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const PI = Math.PI;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 가속 뒤 감속 — 앞 절반은 4p³, 뒤 절반은 대칭
    function easeInOut(x) { const p = clamp(x, 0, 1); return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
    // 시드 고정 난수 — 선형 합동 생성기(곱 1664525, 더함 1013904223). 같은 시드면 같은 수열
    function seeded(seed) {
        let s = (seed >>> 0) || 1;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 파스텔 팔레트 — 글자는 늘 INK, 면은 연한 색. 읽음은 민트, 어긋남은 분홍, 로고는 라벤더
    const BG_TOP = [250, 246, 252];
    const BG_BOT = [228, 234, 250];
    const FACE = [255, 253, 248];
    const FACE_EDGE = [206, 198, 226];
    const SKY = [176, 210, 246];
    const SKY_DEEP = [74, 120, 176];
    const GOLD = [250, 226, 150];
    const GOLD_DEEP = [196, 150, 52];
    const ROSE = [240, 150, 176];
    const ROSE_DEEP = [190, 52, 86];
    const MINT = [150, 214, 190];
    const MINT_DEEP = [22, 112, 82];
    const LAV = [188, 172, 236];
    const LAV_DEEP = [104, 82, 176];
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    const PEACH = [250, 204, 170];
    const PEACH_DEEP = [176, 92, 40];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 장면 시계(초)·판 반복 번호·시간표 — 시간표는 (시각, 할 일) 목록이고 시각이 지나면 한 번씩 부른다
    // sceneT 는 rAF 타임스탬프 차이(dt, 한 프레임 0.05초 상한)를 쌓은 값 하나뿐이다 — 이 장면의 시간 원천은 이것 하나
    let sceneT = 0;
    let lap = 0;
    let script = [];
    let evAt = 0;
    let res = [];
    let totalKb = 1;
    let doneT = 0;
    // 로딩은 시각 start 에 시작해 spanS 초 안에 끝난다. 큰 리소스일수록 오래 걸린다
    function makeLoad(seed, n, start, spanS) {
        const rnd = seeded(seed);
        const raw = [];
        let sum = 0;
        let mx = 0;
        for (let i = 0; i < n; i += 1) {
            const kb = Math.round(24 + rnd() * 276);
            const a = rnd() * 0.5;
            const b = a + 0.12 + (kb / 300) * 0.38;
            raw.push({ kb: kb, t0: a, t1: b });
            sum += kb;
            mx = Math.max(mx, b);
        }
        res = raw.map(function (r) { return { kb: r.kb, t0: start + (r.t0 / mx) * spanS, t1: start + (r.t1 / mx) * spanS }; });
        totalKb = sum;
        doneT = start + spanS;
    }
    // 리소스 하나가 시각 t 에 얼마나 읽혔는지 0 에서 1
    function resFrac(r, t) { return clamp((t - r.t0) / (r.t1 - r.t0), 0, 1); }
    // 읽어 온 KB — 리소스마다 읽힌 비율 × 크기의 합
    function loadedKb(t) {
        let s = 0;
        for (let i = 0; i < res.length; i += 1) {
            s += res[i].kb * resFrac(res[i], t);
        }
        return s;
    }
    // 읽어 온 비율 0 에서 1 — 연출은 이 값만 받는다
    function loadFrac(t) { return loadedKb(t) / totalKb; }
    // 리소스가 통째로 도착했을 때만 세는 KB — 덩어리째 올라가는 진행률(03 의 목표값)
    function arrivedKb(t) {
        let s = 0;
        for (let i = 0; i < res.length; i += 1) {
            if (t >= res[i].t1) {
                s += res[i].kb;
            }
        }
        return s;
    }
    // 읽어 온 비율이 f 에 처음 닿는 시각 — 단조 증가라 이분 탐색
    function timeAtFrac(f) {
        let lo = 0;
        let hi = doneT;
        for (let i = 0; i < 40; i += 1) {
            const mid = (lo + hi) / 2;
            if (loadFrac(mid) < f) {
                lo = mid;
            }
            else {
                hi = mid;
            }
        }
        return hi;
    }
    // 감쇠 스프링의 계단 응답 — 0 에서 시작해 1 로 가며 한 번 넘쳤다가 선다. k 는 강성, c 는 감쇠
    function springStep(q, k, c) {
        if (q <= 0) {
            return 0;
        }
        const w = Math.sqrt(k);
        const z = c / (2 * w);
        const wd = w * Math.sqrt(Math.max(1e-6, 1 - z * z));
        return 1 - Math.exp(-z * w * q) * (Math.cos(wd * q) + ((z * w) / wd) * Math.sin(wd * q));
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const stepEl = root.querySelector('[data-role="step"]');
    const doneEl = root.querySelector('[data-role="done"]');
    const progEl = root.querySelector('[data-role="progress"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !stepEl || !doneEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const stepBtn = stepEl;
    const doneP = doneEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const VIEW_S = 0.88;
    function skyFill(top, bot) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bot, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        // 위쪽 일시정지·상태 알약이 덮는 띠를 비우려고 장면 전체를 VIEW_S 배로 줄여 아래 가운데에 붙인다 — 이 줄 뒤에 그리는 것은 모두 줄어든 좌표계
        ctx.translate(W / 2, H - 3);
        ctx.scale(VIEW_S, VIEW_S);
        ctx.translate(-W / 2, -(H - 3));
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function oval(x, y, rx, ry, c, a) {
        if (rx <= 0.2 || ry <= 0.1 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function seg(x1, y1, x2, y2, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function outline(x, y, w, h, r, width, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 글자 이름표 — 바탕 알약 위에 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    // ── 공통 틀 ───────────────────────────────────────────────
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 한 판 시연이 끝났음을 스크린리더에 한 번만 알린다 — 판이 되풀이돼도 다시 읽지 않는다
    let doneSaid = false;
    function checkDone() {
        if (!doneSaid && sceneT >= RESULT_S) {
            doneSaid = true;
            doneP.textContent = statusText();
        }
    }
    function advance(dt) {
        sceneT += dt;
        while (evAt < script.length && script[evAt].t <= sceneT) {
            const ev = script[evAt];
            evAt += 1;
            ev.f();
        }
        if (sceneT >= LAP_S) {
            lap += 1;
            begin();
            return;
        }
        update(dt);
    }
    // 첫 판은 START_S 만큼 앞서 시작한다 — 연출이 이미 진행 중인 장면에서 처음 보인다
    function runTo(t) {
        while (sceneT < t - 1e-6) {
            advance(Math.min(1 / 30, t - sceneT));
        }
    }
    function begin() {
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        if (lap === 0 && !still) {
            runTo(START_S);
        }
    }
    const DT_MAX = 0.05;
    // 진행 막대(role=progressbar) — 값이 바뀔 때만 aria-valuenow 를 쓴다. 값은 장면의 progressNow() 가 0 에서 100 으로
    let shownProg = -1;
    function pushProgress() {
        if (!progEl) {
            return;
        }
        const v = Math.round(clamp(progressNow(), 0, 100));
        if (v === shownProg) {
            return;
        }
        shownProg = v;
        progEl.setAttribute('aria-valuenow', String(v));
    }
    function showNow() {
        draw();
        pushStatus(statusText());
        pushProgress();
        checkDone();
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        showNow();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 한 판의 멈춘 한 장. 시간표의 REST_S 초 장면에서 멈춘다
    function showRest() {
        stopLoop();
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        runTo(REST_S);
        doneSaid = false;
        showNow();
    }
    function play() {
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    // 다시 — 시간표를 처음부터 다시. 움직임 줄이기에서는 멈춘 한 장
    function restart() {
        lap += 1;
        doneSaid = false;
        if (still) {
            showRest();
            return;
        }
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    // 한 걸음 — 멈춘 채 시간표의 다음 일 하나까지 시계를 보낸다. 더 부를 일이 없으면 판을 다시 연다
    function stepOnce() {
        wake();
        if (!paused) {
            paused = true;
            pauseBtn.setAttribute('aria-pressed', 'true');
            stopLoop();
        }
        if (evAt >= script.length) {
            restart();
            return;
        }
        runTo(script[evAt].t + 0.05);
        showNow();
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    stepBtn.addEventListener('click', stepOnce, { signal: off.signal });
    // 키보드 — 무대에 포커스가 있을 때만. Enter·Space·R 은 처음부터 다시, P 는 일시정지, N 은 한 걸음
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        const k = e.key;
        if (k === 'Enter' || k === ' ') {
            e.preventDefault();
            wake();
            restart();
        }
        else if (k === 'p' || k === 'P') {
            togglePause();
        }
        else if (k === 'n' || k === 'N') {
            stepOnce();
        }
        else if (k === 'r' || k === 'R') {
            wake();
            restart();
        }
    }, { signal: off.signal });
    // 마우스·터치 — 무대를 누르면 처음부터 다시
    pad.addEventListener('click', function () {
        wake();
        restart();
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 결과 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            lap = 0;
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        showNow();
    }, { signal: off.signal });
    // ── 스플래시 장면 도구 ────────────────────────────────────
    // 패널 — 비교판 한 칸의 바탕
    function panel(x, y, w, h, c, a) {
        box(x, y, w, h, 10, c, a);
    }
    // 진행 막대 — 트랙 위에 f(0 에서 1) 만큼 채운다
    function bar(x, y, w, h, f, c, bg) {
        box(x, y, w, h, h / 2, bg, 0.9);
        if (f > 0.001) {
            box(x, y, Math.max(h, w * clamp(f, 0, 1)), h, h / 2, c, 1);
        }
    }
    function pctText(f) { return String(Math.round(clamp(f, 0, 1) * 100)); }
    // 자체 로고 — 둥근 타일에 큰 구멍과 작은 구멍 하나씩. 실제 브랜드와 무관한 도형
    function logoPath(cx, cy, s) {
        ctx.beginPath();
        ctx.roundRect(cx - s / 2, cy - s / 2, s, s, s * 0.3);
        const ex = cx - s * 0.08;
        const ey = cy + s * 0.06;
        ctx.moveTo(ex + s * 0.2, ey);
        ctx.arc(ex, ey, s * 0.2, 0, TAU);
        const dx = cx + s * 0.2;
        const dy = cy - s * 0.22;
        ctx.moveTo(dx + s * 0.09, dy);
        ctx.arc(dx, dy, s * 0.09, 0, TAU);
    }
    function drawLogo(cx, cy, s, c, a) {
        if (s <= 1 || a <= 0) {
            return;
        }
        logoPath(cx, cy, s);
        ctx.fillStyle = rgba(c, a);
        ctx.fill('evenodd');
    }
    // 로고 마스크 와이프 — 왼쪽에서 오른쪽으로 f(0 에서 1) 만큼 채운다. 가장자리 EDGE 폭은 조각으로 나눠 흐리게
    const EDGE_STRIPS = 6;
    function maskW(s, soft, f) { return clamp(f, 0, 1) * (s + soft); }
    function logoWipe(cx, cy, s, f, soft, c, a) {
        const left = cx - s / 2;
        const x = left + maskW(s, soft, f);
        drawLogo(cx, cy, s, c, 0.22 * a);
        const solidW = x - soft - left;
        if (solidW > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(left - 1, cy - s / 2 - 1, solidW + 1, s + 2);
            ctx.clip();
            drawLogo(cx, cy, s, c, a);
            ctx.restore();
        }
        for (let k = 0; k < EDGE_STRIPS; k += 1) {
            const sw = soft / EDGE_STRIPS;
            const sx = (x - soft) + k * sw;
            if (sx + sw <= left || sx >= x) {
                continue;
            }
            ctx.save();
            ctx.beginPath();
            ctx.rect(Math.max(sx, left - 1), cy - s / 2 - 1, sw + 0.5, s + 2);
            ctx.clip();
            drawLogo(cx, cy, s, c, a * (1 - (k + 0.5) / EDGE_STRIPS));
            ctx.restore();
        }
    }
    // 본문 화면 한 장 — 머리띠·히어로·카드 셋. 해골 판과 같은 사각형을 쓴다
    const PAGE_COLORS = [FACE, SKY, MINT, GOLD, ROSE];
    function pageRects(x, y, w, h) {
        const g = 6;
        const hh = h * 0.16;
        const heroH = h * 0.38;
        const cw = (w - g * 4) / 3;
        const cy = y + hh + g + heroH + g;
        const ch = y + h - cy - g;
        return [
            [x, y, w, hh, 6, 0],
            [x + g, y + hh + g, w - 2 * g, heroH, 8, 1],
            [x + g, cy, cw, ch, 6, 2],
            [x + g * 2 + cw, cy, cw, ch, 6, 3],
            [x + g * 3 + 2 * cw, cy, cw, ch, 6, 4]
        ];
    }
    function drawPage(x, y, w, h, a) {
        if (a <= 0) {
            return;
        }
        const rs = pageRects(x, y, w, h);
        for (let i = 0; i < rs.length; i += 1) {
            const r = rs[i];
            box(r[0], r[1], r[2], r[3], r[4], i === 0 ? FACE : mix(PAGE_COLORS[r[5]], PAPER, 0.15), a);
        }
        // 머리띠의 메뉴 점 셋과 히어로의 줄 둘
        for (let i = 0; i < 3; i += 1) {
            disc(x + w - 14 - i * 14, y + h * 0.08, 3, LAV, a);
        }
        box(x + 16, y + h * 0.16 + 6 + h * 0.38 * 0.3, w * 0.4, 7, 3.5, INK, 0.7 * a);
        box(x + 16, y + h * 0.16 + 6 + h * 0.38 * 0.3 + 14, w * 0.28, 6, 3, INK, 0.4 * a);
    }
    // 해골 판 — 같은 자리를 연한 회색으로 채우고 빛 띠가 t 에 따라 훑고 지나간다
    function drawSkeleton(x, y, w, h, a, t) {
        if (a <= 0) {
            return;
        }
        const rs = pageRects(x, y, w, h);
        const base = mix(PAPER, LAV, 0.28);
        const bx = x + (((t * 0.9) % 1.6) - 0.3) * w;
        for (let i = 0; i < rs.length; i += 1) {
            const r = rs[i];
            box(r[0], r[1], r[2], r[3], r[4], base, 0.95 * a);
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(r[0], r[1], r[2], r[3], r[4]);
            ctx.clip();
            const g = ctx.createLinearGradient(bx, 0, bx + 44, 0);
            g.addColorStop(0, rgba(FACE, 0));
            g.addColorStop(0.5, rgba(FACE, 0.8 * a));
            g.addColorStop(1, rgba(FACE, 0));
            ctx.fillStyle = g;
            ctx.fillRect(r[0], r[1], r[2], r[3]);
            ctx.restore();
        }
    }
    // 이징 곡선 상자 — 가로가 진행 p, 세로가 fn(p). 지금 p 의 값을 점으로 찍는다
    function curve(x, y, w, h, fn, p, c) {
        box(x, y, w, h, 4, FACE, 0.8);
        ctx.beginPath();
        for (let i = 0; i <= 24; i += 1) {
            const px = x + 3 + ((w - 6) * i) / 24;
            const py = y + h - 3 - (h - 6) * fn(i / 24);
            if (i === 0) {
                ctx.moveTo(px, py);
            }
            else {
                ctx.lineTo(px, py);
            }
        }
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = rgba(c, 0.9);
        ctx.stroke();
        disc(x + 3 + (w - 6) * clamp(p, 0, 1), y + h - 3 - (h - 6) * fn(clamp(p, 0, 1)), 3.4, INK, 1);
    }
    // ── 03 숫자가 목표를 따라가는 카운터와 목표를 그대로 찍는 점프 숫자 ────
    // 목표 = 도착한 KB 비율(리소스가 통째로 도착할 때만 오른다). 왼쪽 표시값은 목표를 향해 남은 차의 일부씩 줄여 가고, 오른쪽은 목표를 그대로 찍는다
    const SEED = 5031;
    const CATCH_RATE = 5.0;
    const SAMPLE_S = 0.05;
    const WIN_S = 4.0;
    const LAP_S = 8.6;
    const START_S = 3.0;
    const REST_S = 7.4;
    const RESULT_S = 7.6;
    let disp = 0;
    let lastTarget = 0;
    let lastChange = 0;
    let nextSample = 0;
    let hist = [];
    function build() {
        makeLoad(SEED + (lap % 3), 6, 0.3, 5.4);
        disp = 0;
        lastTarget = 0;
        lastChange = 0;
        nextSample = 0;
        hist = [];
    }
    function ARRIVED_KB(t) { return arrivedKb(t); }
    function target(t) { return ARRIVED_KB(t) / totalKb; }
    // 남은 차 × (1 − e^(−rate·dt)) 만큼 다가간다 — 목표가 그대로인 동안은 dt 를 잘게 나눠도 한 번에 가도 같은 값
    function update(dt) {
        const tg = target(sceneT);
        if (Math.abs(tg - lastTarget) > 1e-9) {
            lastTarget = tg;
            lastChange = sceneT;
        }
        disp += (tg - disp) * (1 - Math.exp(-CATCH_RATE * dt));
        while (nextSample <= sceneT) {
            hist.push([nextSample, target(nextSample), disp]);
            nextSample += SAMPLE_S;
        }
    }
    function DISPLAY_PCT(v) { return Math.round(clamp(v, 0, 1) * 100); }
    function graph(x, y, w, h, withDisp) {
        box(x, y, w, h, 6, FACE, 0.85);
        const t0 = Math.max(0, sceneT - WIN_S);
        ctx.beginPath();
        let first = true;
        for (let i = 0; i < hist.length; i += 1) {
            if (hist[i][0] < t0) {
                continue;
            }
            const gx = x + 4 + ((hist[i][0] - t0) / WIN_S) * (w - 8);
            const gy = y + h - 4 - hist[i][1] * (h - 8);
            if (first) {
                ctx.moveTo(gx, gy);
                first = false;
            }
            else {
                ctx.lineTo(gx, gy);
            }
        }
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = rgba(ROSE_DEEP, withDisp ? 0.35 : 1);
        ctx.stroke();
        if (withDisp) {
            ctx.beginPath();
            first = true;
            for (let i = 0; i < hist.length; i += 1) {
                if (hist[i][0] < t0) {
                    continue;
                }
                const gx = x + 4 + ((hist[i][0] - t0) / WIN_S) * (w - 8);
                const gy = y + h - 4 - hist[i][2] * (h - 8);
                if (first) {
                    ctx.moveTo(gx, gy);
                    first = false;
                }
                else {
                    ctx.lineTo(gx, gy);
                }
            }
            ctx.lineWidth = 2.6;
            ctx.strokeStyle = rgba(MINT_DEEP, 1);
            ctx.stroke();
        }
    }
    function draw() {
        skyFill(BG_TOP, BG_BOT);
        const tg = target(sceneT);
        panel(10, 46, 226, 244, [255, 255, 255], 0.5);
        panel(244, 46, 226, 244, [255, 255, 255], 0.5);
        tag('목표를 따라가는 숫자', 123, 26, MINT, INK, 11, 'center');
        tag('목표를 그대로 찍는 숫자', 357, 26, ROSE, INK, 11, 'center');
        box(22, 58, 202, 78, 12, mix(MINT, FACE, 0.55), 0.9);
        box(256, 58, 202, 78, 12, mix(ROSE, FACE, 0.55), 0.9);
        text(String(DISPLAY_PCT(disp)) + '%', 123, 98, INK, 1, 56, 800, 'center');
        text(String(DISPLAY_PCT(tg)) + '%', 357, 98, INK, 1, 56, 800, 'center');
        bar(26, 150, 194, 8, disp, MINT_DEEP, FACE_EDGE);
        bar(260, 150, 194, 8, tg, ROSE_DEEP, FACE_EDGE);
        graph(22, 170, 202, 70, true);
        graph(256, 170, 202, 70, false);
        const gap = Math.round((tg - disp) * 100);
        text('목표와 {d} 점 차이'.replace('{d}', String(gap)), 123, 256, INK, 1, 12, 700, 'center');
        const still = sceneT - lastChange;
        text(still > 0.7 ? '{s} 초째 멈춘 듯 보임'.replace('{s}', still.toFixed(1)) : '방금 건너뜀', 357, 256, still > 0.7 ? ROSE_DEEP : INK, 1, 12, 700, 'center');
        text('목표 {n} / {m} KB'.replace('{n}', String(Math.round(ARRIVED_KB(sceneT)))).replace('{m}', String(totalKb)), 123, 276, INK, 0.9, 11, 700, 'center');
        text('따라가는 속도 {r} /초'.replace('{r}', String(CATCH_RATE)), 357, 276, INK, 0.9, 11, 700, 'center');
    }
    function statusText() {
        return '목표 {a} % · 표시 {b} %'.replace('{a}', String(DISPLAY_PCT(target(sceneT)))).replace('{b}', String(DISPLAY_PCT(disp)));
    }
    function progressNow() { return disp * 100; }
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
