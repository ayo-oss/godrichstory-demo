<div class="lf is-demo" id="lf">
  <canvas class="lf__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="五つに裂けた葉が、葉脈から遠いふちから緑から黄・橙・赤へと色づく。"></canvas>

<script>
(function () {
    const root = document.getElementById("lf");
    if (!root) return;
    const W = 480;
    const H = 300;
    // 시계 — rAF 타임스탬프를 쌓아 16ms 고정 스텝으로만 진행한다
    const FIXED_DT = 16;
    const STEP_S = FIXED_DT / 1000;
    // 한 프레임에 따라잡는 시간 상한(ms) — 숨었던 탭이 돌아와 첫 간격이 수 초여도 이만큼만 쌓는다
    const DT_MAX = 100;
    const MAX_STEPS = 6;
    const TAU = Math.PI * 2;
    // 파스텔 팔레트 — 옅은 하늘·크림 바탕 위에 잎을 얹고, 줄기·흙·그늘은 진한 쪽으로 명도 차를 둔다
    const SKY_TOP = [212, 230, 243];
    const SKY_LOW = [253, 245, 231];
    const CREAM = [255, 250, 241];
    const INK = [70, 54, 58];
    const BARK = [118, 88, 76];
    const BARK_DEEP = [82, 60, 54];
    const SOIL = [228, 208, 180];
    const SOIL_DEEP = [176, 146, 118];
    const APRICOT = [240, 166, 114];
    const PEACH = [246, 194, 156];
    const BUTTER = [238, 206, 110];
    const MAPLE = [222, 112, 98];
    const SAGE = [146, 182, 132];
    const LEAF_COLORS = [APRICOT, BUTTER, MAPLE, PEACH, SAGE];
    // 잎 모양 셋 — 0 둥근 잎 · 1 다섯 갈래 잎 · 2 길쭉한 잎. 윤곽은 꼭지 쪽이 x = −1, 끝이 x = +1 인 단위 좌표
    const LEAF_KINDS = 3;
    const OUTLINE_POINTS = 72;
    // 스프라이트는 기준 크기로 한 번만 그리고, 찍을 때는 크기 배율만 곱한다
    const SPRITE_SIZE = 48;
    const SPRITE_RES = 2;
    const CAPTION_FONT = '600 11px system-ui, sans-serif';
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mixRGB(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    // 시드 고정 난수 — 같은 시드면 같은 잎 배치·같은 바람이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 부드러운 2D 노이즈 — 정수 격자점마다 시드로 정한 값(−1~1)을 두고 칸 안은 3차 곡선으로 섞는다
    function makeNoise(seed) {
        const rng = makeRng(seed);
        const perm = new Uint8Array(512);
        const vals = new Float32Array(256);
        for (let i = 0; i < 256; i += 1) {
            vals[i] = rng() * 2 - 1;
            perm[i] = i;
        }
        for (let i = 255; i > 0; i -= 1) {
            const j = Math.floor(rng() * (i + 1));
            const tmp = perm[i];
            perm[i] = perm[j];
            perm[j] = tmp;
        }
        for (let i = 0; i < 256; i += 1) {
            perm[i + 256] = perm[i];
        }
        function corner(ix, iy) { return vals[perm[(ix & 255) + perm[iy & 255]]]; }
        return function (x, y) {
            const ix = Math.floor(x);
            const iy = Math.floor(y);
            const fx = x - ix;
            const fy = y - iy;
            const u = fx * fx * (3 - 2 * fx);
            const v = fy * fy * (3 - 2 * fy);
            const top = lerp(corner(ix, iy), corner(ix + 1, iy), u);
            const low = lerp(corner(ix, iy + 1), corner(ix + 1, iy + 1), u);
            return lerp(top, low, v);
        };
    }
    // 잎 윤곽 — 사진 없이 곡선으로. 둘레를 OUTLINE_POINTS 점으로 나눈다
    function leafOutline(kind) {
        const pts = [];
        for (let i = 0; i < OUTLINE_POINTS; i += 1) {
            const a = i / OUTLINE_POINTS * TAU;
            const c = Math.cos(a);
            const s = Math.sin(a);
            if (kind === 1) {
                // 다섯 갈래 — 반지름이 둘레를 따라 다섯 번 부풀었다 들어간다
                const r = 0.6 + 0.4 * Math.pow(Math.abs(Math.cos(2.5 * a)), 0.8);
                pts.push([r * c, r * s * 0.95]);
            }
            else if (kind === 2) {
                pts.push([c, 0.3 * s * (1 - 0.25 * c)]);
            }
            else {
                // 둥근 잎 — 꼭지 쪽이 넓고 끝으로 갈수록 좁아지는 물방울
                pts.push([c, 0.52 * s * (1 - 0.3 * c)]);
            }
        }
        return pts;
    }
    const OUTLINES = [leafOutline(0), leafOutline(1), leafOutline(2)];
    // 잎맥 선분 — 가운데 맥 하나와 곁맥. 갈래 잎은 갈래 끝마다 하나
    function leafVeins(kind) {
        const out = [];
        if (kind === 1) {
            const base = [-0.4, 0];
            for (let k = -2; k <= 2; k += 1) {
                const a = k * 0.4 * Math.PI;
                out.push([base, [Math.cos(a) * 0.86, Math.sin(a) * 0.82]]);
            }
            return out;
        }
        const halfW = kind === 2 ? 0.3 : 0.52;
        const taper = kind === 2 ? 0.25 : 0.3;
        out.push([[-1, 0], [0.92, 0]]);
        const roots = [-0.55, -0.15, 0.25, 0.6];
        for (let i = 0; i < roots.length; i += 1) {
            const x0 = roots[i];
            const x1 = Math.min(0.95, x0 + 0.32);
            const y1 = halfW * Math.sqrt(Math.max(0, 1 - x1 * x1)) * (1 - taper * x1) * 0.8;
            out.push([[x0, 0], [x1, y1]]);
            out.push([[x0, 0], [x1, -y1]]);
        }
        return out;
    }
    const VEINS = [leafVeins(0), leafVeins(1), leafVeins(2)];
    function leafPathOn(g, kind, k) {
        const pts = OUTLINES[kind];
        g.beginPath();
        g.moveTo(pts[0][0] * k, pts[0][1] * k);
        for (let i = 1; i < pts.length; i += 1) {
            g.lineTo(pts[i][0] * k, pts[i][1] * k);
        }
        g.closePath();
    }
    // 스프라이트 흐림 — 가로·세로 상자 평균을 두 번. 투명 가장자리가 검게 번지지 않게 알파를 곱한 값으로 섞는다
    function blurSprite(g, side, r) {
        const img = g.getImageData(0, 0, side, side);
        const d = img.data;
        const n = side * side;
        const buf = new Float32Array(n * 4);
        const tmp = new Float32Array(n * 4);
        for (let i = 0; i < n; i += 1) {
            const a = d[i * 4 + 3] / 255;
            buf[i * 4] = d[i * 4] * a;
            buf[i * 4 + 1] = d[i * 4 + 1] * a;
            buf[i * 4 + 2] = d[i * 4 + 2] * a;
            buf[i * 4 + 3] = d[i * 4 + 3];
        }
        const span = r * 2 + 1;
        for (let pass = 0; pass < 2; pass += 1) {
            for (let y = 0; y < side; y += 1) {
                for (let x = 0; x < side; x += 1) {
                    for (let ch = 0; ch < 4; ch += 1) {
                        let sum = 0;
                        for (let k = -r; k <= r; k += 1) {
                            sum += buf[(y * side + clamp(x + k, 0, side - 1)) * 4 + ch];
                        }
                        tmp[(y * side + x) * 4 + ch] = sum / span;
                    }
                }
            }
            for (let y = 0; y < side; y += 1) {
                for (let x = 0; x < side; x += 1) {
                    for (let ch = 0; ch < 4; ch += 1) {
                        let sum = 0;
                        for (let k = -r; k <= r; k += 1) {
                            sum += tmp[(clamp(y + k, 0, side - 1) * side + x) * 4 + ch];
                        }
                        buf[(y * side + x) * 4 + ch] = sum / span;
                    }
                }
            }
        }
        for (let i = 0; i < n; i += 1) {
            const a = buf[i * 4 + 3];
            const inv = a > 0.5 ? 255 / a : 0;
            d[i * 4] = buf[i * 4] * inv;
            d[i * 4 + 1] = buf[i * 4 + 1] * inv;
            d[i * 4 + 2] = buf[i * 4 + 2] * inv;
            d[i * 4 + 3] = a;
        }
        g.putImageData(img, 0, 0);
    }
    const spriteCache = new Map();
    // 함정 1 실물 계수 — 잎 경로를 실제로 그린 횟수(spriteBuilds)와 스프라이트를 찍은 횟수(leafBlits)
    let spriteBuilds = 0;
    let leafBlits = 0;
    // 같은 모양·같은 색·같은 흐림이면 한 번만 그린다. 뒷면은 크림을 섞은 옅은 색으로 따로 한 장
    function spriteFor(kind, color, blur) {
        const key = kind + '|' + color.join(',') + '|' + blur;
        const hit = spriteCache.get(key);
        if (hit) {
            return hit;
        }
        spriteBuilds += 1;
        const pad = 3 + Math.ceil(blur * 2);
        const side = Math.ceil((SPRITE_SIZE + pad * 2) * SPRITE_RES);
        const cvs = document.createElement('canvas');
        cvs.width = side;
        cvs.height = side;
        const sp = { cv: cvs, half: side / SPRITE_RES / 2 };
        spriteCache.set(key, sp);
        const g = cvs.getContext('2d');
        if (!g) {
            return sp;
        }
        const k = SPRITE_SIZE * SPRITE_RES / 2;
        g.translate(side / 2, side / 2);
        // 꼭지
        g.beginPath();
        g.moveTo(-k * 0.95, 0);
        g.lineTo(-k * 1.18, k * 0.05);
        g.lineWidth = 1.6 * SPRITE_RES;
        g.strokeStyle = rgba(mixRGB(color, INK, 0.5), 1);
        g.stroke();
        leafPathOn(g, kind, k);
        g.fillStyle = rgba(color, 1);
        g.fill();
        g.lineWidth = 1.1 * SPRITE_RES;
        g.strokeStyle = rgba(mixRGB(color, INK, 0.38), 0.95);
        g.stroke();
        const veins = VEINS[kind];
        g.beginPath();
        for (let i = 0; i < veins.length; i += 1) {
            g.moveTo(veins[i][0][0] * k, veins[i][0][1] * k);
            g.lineTo(veins[i][1][0] * k, veins[i][1][1] * k);
        }
        g.lineWidth = 0.8 * SPRITE_RES;
        g.strokeStyle = rgba(mixRGB(color, INK, 0.3), 0.75);
        g.stroke();
        g.setTransform(1, 0, 0, 1, 0, 0);
        if (blur > 0) {
            blurSprite(g, side, Math.round(blur * SPRITE_RES));
        }
        return sp;
    }
    function backColor(c) { return mixRGB(c, CREAM, 0.5); }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    // 스프라이트 찍기 — 자리(x, y)·크기·회전, squash 는 잎 면이 돌아 보이는 세로 납작함(0~1)
    function blitLeaf(sp, x, y, size, angle, squash, alpha) {
        leafBlits += 1;
        const k = size / SPRITE_SIZE;
        ctx.save();
        ctx.globalAlpha = clamp(alpha, 0, 1);
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.scale(k, k * Math.max(0.06, squash));
        ctx.drawImage(sp.cv, -sp.half, -sp.half, sp.half * 2, sp.half * 2);
        ctx.restore();
    }
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 손대면 시연 표시를 뗀다
    let demo = root.classList.contains('is-demo');
    // 리스너는 한 묶음으로 달고 정리할 때 한 번에 뗀다
    const off = new AbortController();
    // 포인터 자리(판 좌표) — 판 밖이면 −1
    let hoverX = -1;
    let hoverY = -1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function clearSky() {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(SKY_TOP, 1));
        g.addColorStop(1, rgba(SKY_LOW, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    function drawGround(y) {
        const g = ctx.createLinearGradient(0, y, 0, H);
        g.addColorStop(0, rgba(SOIL, 1));
        g.addColorStop(1, rgba(SOIL_DEEP, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, y, W, H - y);
        ctx.fillStyle = rgba(SOIL_DEEP, 0.9);
        ctx.fillRect(0, y, W, 1.5);
    }
    // 판 위 설명 글 — 크림 알약 바탕에 진한 글자
    function drawCaption(text, x, y, alignRight) {
        ctx.font = CAPTION_FONT;
        const bw = ctx.measureText(text).width + 14;
        const bh = 20;
        const bx = alignRight ? x - bw : x;
        ctx.fillStyle = rgba(CREAM, 0.9);
        ctx.beginPath();
        ctx.moveTo(bx + 8, y);
        ctx.arcTo(bx + bw, y, bx + bw, y + bh, 8);
        ctx.arcTo(bx + bw, y + bh, bx, y + bh, 8);
        ctx.arcTo(bx, y + bh, bx, y, 8);
        ctx.arcTo(bx, y, bx + bw, y, 8);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = rgba(INK, 1);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, bx + 7, y + bh / 2 + 0.5);
    }
    function fmt(v, digits) { return v.toFixed(digits); }
    // 04 — 다섯 갈래 잎 한 장이 잎맥에서 먼 가장자리부터 물든다. 잎 안 픽셀마다 가장 가까운 잎맥 선분까지의 거리를
    // 오프스크린 판에 한 번만 재 두고(거리장), 매 프레임은 시간 문턱값과 비교해 색 램프에서 고르기만 한다
    const TURN_KIND = 1;
    // 거리장 판 크기 — 화면 배율(dpr)과 상관없이 고정. 배율 2 기기에서도 화소 수가 늘지 않는다
    const FIELD_W = 300;
    const FIELD_H = 244;
    // 잎 단위 좌표 1 이 거리장 몇 픽셀인가
    const FIELD_SCALE = 124;
    // 노이즈 얼룩이 물드는 순서에 섞이는 몫과 얼룩 크기
    const BLOTCH_MIX = 0.34;
    const BLOTCH_SCALE = 0.045;
    // 한 픽셀이 초록에서 빨강까지 가는 데 걸리는 문턱 폭(물드는 순서 값 기준)
    const RAMP_WIDTH = 0.42;
    const TURN_START_MS = 200;
    const TURN_MS = 4200;
    const TURN_HOLD_MS = 1800;
    // 색 램프 — 초록 → 버터 노랑 → 살구 → 단풍 빨강. 색상 차가 기능이라 파스텔 안에서도 서로 멀게 둔다
    const GREEN = [128, 180, 112];
    const TURN_RAMP = [GREEN, BUTTER, APRICOT, MAPLE];
    const TURN_LABEL = '色づき {p}% · 葉脈から遠い側から';
    const COST_LABEL = '距離計算 {d}回(一度だけ) · このフレームの比較 {c}回';
    const blotchNoise = makeNoise(4794);
    // 거리장 결과 — 잎 안 픽셀의 판 위치, 물드는 순서 값(클수록 먼저), 잎맥 가까움(0~1)
    let insideIdx = new Int32Array(0);
    let turnOrder = new Float32Array(0);
    let veinNear = new Float32Array(0);
    let fieldBuilds = 0;
    let distanceChecks = 0;
    let rampCompares = 0;
    let lastCompares = 0;
    let fieldCv = null;
    let fieldImg = null;
    let t04 = 0;
    // 점과 선분 사이 최단 거리
    function segDist(px, py, a, b) {
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const l2 = dx * dx + dy * dy || 1;
        const k = clamp(((px - a[0]) * dx + (py - a[1]) * dy) / l2, 0, 1);
        return Math.hypot(px - a[0] - dx * k, py - a[1] - dy * k);
    }
    function insidePoly(px, py, pts) {
        let inside = false;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i, i += 1) {
            const a = pts[i];
            const b = pts[j];
            if ((a[1] > py) !== (b[1] > py) && px < (b[0] - a[0]) * (py - a[1]) / (b[1] - a[1]) + a[0]) {
                inside = !inside;
            }
        }
        return inside;
    }
    // 거리장 — 한 번만. 잎 안 픽셀마다 잎맥 선분 전부와 거리를 재 가장 가까운 것을 남긴다
    function buildField() {
        fieldBuilds += 1;
        const cxp = FIELD_W / 2 + 18;
        const cyp = FIELD_H / 2;
        const outline = OUTLINES[TURN_KIND].map(function (p) { return [cxp + p[0] * FIELD_SCALE, cyp + p[1] * FIELD_SCALE]; });
        const veins = VEINS[TURN_KIND].map(function (s) { return [[cxp + s[0][0] * FIELD_SCALE, cyp + s[0][1] * FIELD_SCALE], [cxp + s[1][0] * FIELD_SCALE, cyp + s[1][1] * FIELD_SCALE]]; });
        const idx = [];
        const dist = [];
        let maxD = 1;
        for (let y = 0; y < FIELD_H; y += 1) {
            for (let x = 0; x < FIELD_W; x += 1) {
                if (!insidePoly(x + 0.5, y + 0.5, outline)) {
                    continue;
                }
                let best = 1e9;
                for (let s = 0; s < veins.length; s += 1) {
                    distanceChecks += 1;
                    const d = segDist(x + 0.5, y + 0.5, veins[s][0], veins[s][1]);
                    if (d < best) {
                        best = d;
                    }
                }
                idx.push(y * FIELD_W + x);
                dist.push(best);
                if (best > maxD) {
                    maxD = best;
                }
            }
        }
        insideIdx = new Int32Array(idx);
        turnOrder = new Float32Array(idx.length);
        veinNear = new Float32Array(idx.length);
        for (let i = 0; i < idx.length; i += 1) {
            const x = idx[i] % FIELD_W;
            const y = Math.floor(idx[i] / FIELD_W);
            const blotch = 0.5 + 0.5 * blotchNoise(x * BLOTCH_SCALE, y * BLOTCH_SCALE);
            turnOrder[i] = (1 - BLOTCH_MIX) * (dist[i] / maxD) + BLOTCH_MIX * blotch;
            veinNear[i] = clamp(1 - dist[i] / 2.6, 0, 1);
        }
        const cvs = document.createElement('canvas');
        cvs.width = FIELD_W;
        cvs.height = FIELD_H;
        fieldCv = cvs;
        const g = cvs.getContext('2d');
        fieldImg = g ? g.createImageData(FIELD_W, FIELD_H) : null;
    }
    function rampColor(s) {
        const k = clamp(s, 0, 1) * (TURN_RAMP.length - 1);
        const i = Math.min(TURN_RAMP.length - 2, Math.floor(k));
        return mixRGB(TURN_RAMP[i], TURN_RAMP[i + 1], k - i);
    }
    function progress() { return clamp((t04 - TURN_START_MS) / TURN_MS, 0, 1); }
    // 매 프레임 — 문턱값 하나와 픽셀마다 비교만 한다. 거리는 다시 재지 않는다
    function paintField(p) {
        if (!fieldCv || !fieldImg) {
            return;
        }
        const d = fieldImg.data;
        const th = 1 - p * (1 + RAMP_WIDTH);
        for (let i = 0; i < insideIdx.length; i += 1) {
            const s = clamp((turnOrder[i] - th) / RAMP_WIDTH, 0, 1);
            const c = mixRGB(rampColor(s), INK, 0.34 * veinNear[i]);
            const o = insideIdx[i] * 4;
            d[o] = c[0];
            d[o + 1] = c[1];
            d[o + 2] = c[2];
            d[o + 3] = 255;
        }
        rampCompares += insideIdx.length;
        lastCompares = insideIdx.length;
        const g = fieldCv.getContext('2d');
        if (g) {
            g.putImageData(fieldImg, 0, 0);
        }
    }
    function build() {
        if (!fieldCv) {
            buildField();
        }
        t04 = 0;
    }
    function loopLength() { return TURN_START_MS + TURN_MS + TURN_HOLD_MS; }
    function step(dt) { t04 += dt * 1000; }
    // 동작 줄이기 — 다 물든 잎
    function finalScene() {
        build();
        t04 = TURN_START_MS + TURN_MS;
    }
    function onWake() { }
    function drawLegend() {
        const x0 = 10;
        const y0 = 36;
        for (let i = 0; i < 60; i += 1) {
            ctx.fillStyle = rgba(rampColor(i / 59), 1);
            ctx.fillRect(x0 + i * 2, y0, 2, 10);
        }
        // 지금 문턱이 램프 어디쯤인가
        const p = progress();
        ctx.fillStyle = rgba(INK, 1);
        ctx.fillRect(x0 + p * 118, y0 - 4, 2, 18);
    }
    function draw() {
        clearSky();
        drawGround(266);
        const p = progress();
        paintField(p);
        if (fieldCv) {
            const sway = 0.05 * Math.sin(t04 / 1000 * 1.3);
            ctx.save();
            ctx.translate(W / 2 - 12, H / 2 + 6);
            ctx.rotate(sway);
            // 그늘 — 같은 판을 진한 색 반투명으로 살짝 아래에
            ctx.globalAlpha = 0.16;
            ctx.filter = 'brightness(0)';
            ctx.drawImage(fieldCv, -FIELD_W / 2 + 6, -FIELD_H / 2 + 9);
            ctx.filter = 'none';
            ctx.globalAlpha = 1;
            ctx.drawImage(fieldCv, -FIELD_W / 2, -FIELD_H / 2);
            ctx.restore();
        }
        drawLegend();
        drawCaption(TURN_LABEL.replace('{p}', fmt(p * 100, 0)), 8, 8, false);
        drawCaption(COST_LABEL.replace('{d}', fmt(distanceChecks, 0)).replace('{c}', fmt(lastCompares, 0)), W - 8, H - 28, true);
    }
    // 一時停止 단추 — aria-pressed 가 참이면 멈춘 상태. 동작 줄이기면 멈춘 채로 시작한다
    let paused = still;
    // 지금 판이 동작 줄이기 한 장면인가 — 사람이 재생을 누르면 처음부터 다시 시작한다
    let stillShown = false;
    let ready = false;
    // 정리 뒤(리액트 언마운트)에 늦게 온 알림이 일을 시작하지 않게
    let alive = true;
    // 시연 시계(ms) — 16ms 고정 스텝으로만 늘어난다
    let clock = 0;
    function syncPause() { pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false'); }
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        onWake();
    }
    // 포인터 자리를 판 좌표(480×300)로 — 화면에 보이는 캔버스 크기와 상관없이
    function toBoard(ev) {
        const r = cv.getBoundingClientRect();
        return [(ev.clientX - r.left) * W / Math.max(1, r.width), (ev.clientY - r.top) * H / Math.max(1, r.height)];
    }
    function render() { draw(); }
    cv.addEventListener('pointermove', function (ev) {
        const p = toBoard(ev);
        hoverX = p[0];
        hoverY = p[1];
        wake();
        if (paused && ready) {
            render();
        }
    }, { signal: off.signal });
    cv.addEventListener('pointerleave', function () {
        hoverX = -1;
        hoverY = -1;
        if (paused && ready) {
            render();
        }
    }, { signal: off.signal });
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    function frame(ts) {
        if (paused || !alive) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        // dt 상한 — 한 프레임에 DT_MAX 까지만 쌓는다. 숨었던 탭이 돌아와 간격이 수 초여도 잎이 순간이동하지 않게
        acc += Math.min(ts - lastTs, DT_MAX);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < MAX_STEPS) {
            clock += FIXED_DT;
            if (clock >= loopLength()) {
                clock = 0;
                build();
            }
            step(STEP_S);
            acc -= FIXED_DT;
            n += 1;
        }
        render();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 시계 기준을 새로 잡는다 — 첫 프레임 간격을 0 으로
        lastTs = -1;
        acc = 0;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 동작 줄이기 — 루프를 돌리지 않고 잎이 이미 내려앉은 한 장면만 그린다
    function showStill() {
        stopLoop();
        finalScene();
        stillShown = true;
        render();
    }
    function play() {
        clock = 0;
        stillShown = false;
        build();
        render();
        startLoop();
    }
    pauseBtn.addEventListener('click', function () {
        wake();
        paused = !paused;
        syncPause();
        if (paused) {
            stopLoop();
            render();
            return;
        }
        // 동작 줄이기여도 사람이 직접 누르면 재생한다 — 한 장면에서 처음부터
        if (stillShown) {
            play();
        }
        else {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 페이지를 연 채 바뀌면 — 켜지면 내려앉은 장면에서 멈추고, 꺼지면 시연을 처음부터
    function onMotionPref() {
        still = reduceQuery.matches;
        if (!ready) {
            return;
        }
        paused = still;
        syncPause();
        if (still) {
            showStill();
        }
        else {
            play();
        }
    }
    reduceQuery.addEventListener('change', onMotionPref, { signal: off.signal });
    // 탭이 숨으면 루프를 세우고, 돌아오면 시계를 다시 잡아 숨어 있던 시간을 한 번에 따라잡지 않는다
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
            return;
        }
        if (!paused && ready) {
            startLoop();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        if (ready) {
            render();
        }
    }, { signal: off.signal });
    function begin() {
        fitCanvas();
        build();
        ready = true;
        syncPause();
        if (still) {
            showStill();
        }
        else {
            play();
        }
    }
    begin();
    return function () {
        alive = false;
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
