<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll landscape — 매직아이 스테레오그램 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="me is-demo" id="meRoot">
  <p class="me__hint">
    <span>Scroll landscape</span>
    <span class="me__desc">Bind scroll to travel through terrain and ranges and valleys stream past the noise</span>
  </p>
  <div class="me__field" role="application" aria-label="Scroll landscape explorer" tabindex="0">
    <canvas class="me__cv" id="meCv"></canvas>
  </div>
  <div class="me__bar">
    <span class="me__meta">wheel or drag to travel · moving ramp 3 octaves · depth 12px</span>
    <span class="me__meta me__meta--dim">ImageData · travel offset</span>
  </div>
</div>
</main>
<script>
// Scroll landscape(05) — 깊이 지도를 가로지르는 이동 거리를 입력에 묶는다.
// 지형 높이 = 무빙 램프 3옥타브(서로 다른 파장의 사인 합) — x 에 여행 오프셋을 더해 샘플한다.
// 휠·가로 드래그로 직접 여행하고, 손을 떼면 자동 주행이 이어받아 루프가 끊기지 않는다.
// 산맥이 노이즈 너머로 흐르는 대표 장면 — 스크롤 트리거와 픽셀 계산이 한 몸이다.
(function () {
  // ── 변형 상수 블록 ──
  var MAXSHIFT = 12;   // 산 높이(px)
  var SPEED = 90;      // 자동 주행 속도(px/초)
  // ─────────────────

  var root = document.getElementById('meRoot');
  var cvEl = document.getElementById('meCv');
  if (!root || !cvEl) return;
  var fieldEl = cvEl.parentElement;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var PAL = [];
  for (var i = 0; i < 5; i++) PAL.push(tokRGB('--me-p' + i));

  function baseIdx(x, y) {
    var h = (Math.imul(x + 11, 374761393) + Math.imul(y + 7, 668265263)) >>> 0;
    h ^= h >>> 13;
    h = Math.imul(h, 1274126177) >>> 0;
    h ^= h >>> 16;
    return ((h % PAL.length) + PAL.length) % PAL.length;
  }

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0, img = null;

  function fit() {
    var r = fieldEl.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = W; cvEl.height = H;
    img = ctx.createImageData(W, H);
  }

  // 지형 — 3옥타브 무빙 램프. wx = 세계 좌표(여행 오프셋 더한 x)
  function terrain(wx, y) {
    var v = 0;
    v += Math.sin(wx * 0.011 + y * 0.004) * 0.45;
    v += Math.sin(wx * 0.031 + 1.7 + y * 0.010) * 0.30;
    v += Math.sin(wx * 0.074 + 4.2) * 0.18;
    v += (Math.cos(wx * 0.005 + y * 0.006) * 0.5 + 0.5) * 0.35;
    var front = y / H;                       // 화면 하단(앞쪽)이 더 높게 솟는다
    var h01 = Math.max(0, Math.min(1, v * 0.5 + 0.5)) * (0.35 + 0.65 * front * front);
    return h01;
  }

  function draw(travel, hover) {
    var d = img.data, x, y, di;
    var col = new Int32Array(W);
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        var s = Math.round(terrain(x + travel, y) * MAXSHIFT);
        if (s <= 0) {
          col[x] = baseIdx(x, y);
        } else {
          var from = x - s;
          col[x] = from >= 0 ? col[from] : baseIdx(from + W, y);
        }
      }
      for (x = 0; x < W; x++) {
        var c = PAL[col[x]];
        di = (y * W + x) * 4;
        d[di] = c[0]; d[di + 1] = c[1]; d[di + 2] = c[2]; d[di + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);

    if (!hover) {
      ctx.fillStyle = 'rgba(214, 222, 236, 0.8)';
      ctx.font = '500 11px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Wheel or drag to travel the terrain', W / 2, H - 10);
    }
  }

  // ── 입력 — 휠 · 가로 드래그 ──
  var travel = 0, hover = false, dragX = null;
  fieldEl.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    travel += (ev.deltaY + ev.deltaX) * 0.6;
    hover = true;
  }, { passive: false });
  fieldEl.addEventListener('pointerdown', function (ev) {
    dragX = ev.clientX; hover = true;
    ev.preventDefault();
  });
  window.addEventListener('pointermove', function (ev) {
    if (dragX === null) return;
    travel -= (ev.clientX - dragX) * 1.2;
    dragX = ev.clientX;
  });
  window.addEventListener('pointerup', function () { dragX = null; });
  fieldEl.addEventListener('pointerenter', function () { hover = true; });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1, lastNow = -1;
  function frame(now) {
    if (t0 < 0) { t0 = now; lastNow = now; }
    var dt = Math.min(0.05, (now - lastNow) / 1000 || 0.016);
    lastNow = now;
    travel += dt * SPEED;   // 자동 주행 — 손이 있으면 휠·드래그가 겹쳐 더해진다
    draw(travel, hover);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) draw(0, true);
  });
  fit();
  if (reduce) {
    draw(0, true);   // reduce — 골짜기 한 장만 고정
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
