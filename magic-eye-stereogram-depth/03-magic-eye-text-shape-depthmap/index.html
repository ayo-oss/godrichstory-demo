<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글자 숨기기 — 매직아이 스테레오그램 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="me is-demo" id="meRoot">
  <p class="me__hint">
    <span>글자 숨기기</span>
    <span class="me__desc">오프스크린에 흑백 글자를 찍어 밝기를 깊이로 넘기면 문구가 노이즈 속에 잠깁니다</span>
  </p>
  <div class="me__field" role="application" aria-label="글자 은닉 판" tabindex="0">
    <canvas class="me__cv" id="meCv"></canvas>
  </div>
  <div class="me__bar">
    <span class="me__meta">fillText 220px · 깊이 14px · 표출 주기 2초</span>
    <span class="me__meta me__meta--dim">밝기 → 깊이 변환</span>
  </div>
</div>
</main>
<script>
// 글자 숨기기(03) — fillText 로 찍은 글자를 깊이 지도로 쓴다.
// 오프스크린 캔버스에 글자를 흰색/검은 배경으로 그린 뒤 getImageData 로 밝기를 읽어
// 0(검은 배경) .. 1(글자 살) 깊이로 넘긴다. 이후는 01 과 같은 행별 복사 시프트.
// 글자 깊이가 주기 안에 0 → 1 → 0 으로 움직이므로 문구가 노이즈 속에서 떠올랐다 가라앉는다.
// 깊이 소스가 "그림 한 장"이면 뭐든 된다는 문을 여는 항목 — 사진(04)·로고(09)가 같은 길을 잇는다.
(function () {
  // ── 변형 상수 블록 ──
  var WORD  = 'SOLID';   // 숨길 단어 — 몸통이 굵은 짧은 단어가 잘 뜬다
  var FSIZE = 220;       // fillText 크기(px)
  var MAXSHIFT = 14;     // 글자 깊이(px)
  var CYCLE = 2.0;       // 표출 주기(초)
  // ─────────────────

  var root = document.getElementById('meRoot');
  var cvEl = document.getElementById('meCv');
  if (!root || !cvEl) return;
  var fieldEl = cvEl.parentElement;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var PAL = [];
  for (var i = 0; i < 5; i++) PAL.push(tokRGB('--me-p' + i));

  function baseIdx(x, y) {
    var h = (Math.imul(x + 11, 374761393) + Math.imul(y + 7, 668265263)) >>> 0;
    h ^= h >>> 13;
    h = Math.imul(h, 1274126177) >>> 0;
    h ^= h >>> 16;
    return ((h % PAL.length) + PAL.length) % PAL.length;   // ^ 는 ToInt32 로 음수가 될 수 있어 접는다
  }

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0, img = null;

  // ── 오프스크린 깊이 원본 — 글자 래스터 ──
  var srcCv = document.createElement('canvas');
  var srcCtx = srcCv.getContext('2d');
  var depthBuf = null;

  function fit() {
    var r = fieldEl.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = W; cvEl.height = H;
    img = ctx.createImageData(W, H);

    srcCv.width = W; srcCv.height = H;
    srcCtx.fillStyle = '#000';
    srcCtx.fillRect(0, 0, W, H);
    srcCtx.fillStyle = '#fff';
    srcCtx.textAlign = 'center';
    srcCtx.textBaseline = 'middle';
    var fs = Math.min(FSIZE, W * 0.46);
    srcCtx.font = '900 ' + fs + 'px "Arial Black", "Segoe UI", sans-serif';
    srcCtx.fillText(WORD, W * 0.5, H * 0.58);
    var sd = srcCtx.getImageData(0, 0, W, H).data;

    // 밝기 → 깊이. 좌우 1px 평균으로 가장자리 낙차를 무디게 한다(꺾여 보이지 않게)
    depthBuf = new Float32Array(W * H);
    var x, y, v, sum, n;
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        v = sd[(y * W + x) * 4] / 255;
        sum = v; n = 1;
        if (x > 0)     { sum += sd[(y * W + x - 1) * 4] / 255; n++; }
        if (x < W - 1) { sum += sd[(y * W + x + 1) * 4] / 255; n++; }
        depthBuf[y * W + x] = sum / n;
      }
    }
  }

  function draw(t) {
    var d = img.data, x, y, di;
    var ph = t / CYCLE * Math.PI * 2;
    var appear = Math.sin(ph - Math.PI / 2) * .5 + .5;
    var amp = 0.12 + 0.88 * appear;   // 최저 12% 유지 — 루프가 이어진다
    var bob = Math.round(Math.sin(ph) * H * 0.09);   // 글자가 위아래로 흐른다 — 행마다 깊이가 흐른다
    var col = new Int32Array(W);
    for (y = 0; y < H; y++) {
      var sy = y - bob;
      var rowOff = (sy >= 0 && sy < H ? sy : y) * W;
      for (x = 0; x < W; x++) {
        var s = Math.round(depthBuf[rowOff + x] * amp * MAXSHIFT);
        if (s <= 0) {
          col[x] = baseIdx(x, y);
        } else {
          var from = x - s;
          col[x] = from >= 0 ? col[from] : baseIdx(from + W, y);
        }
      }
      for (x = 0; x < W; x++) {
        var c = PAL[col[x]];
        di = (y * W + x) * 4;
        d[di] = c[0]; d[di + 1] = c[1]; d[di + 2] = c[2]; d[di + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1;
  function frame(now) {
    if (t0 < 0) t0 = now;
    draw((now - t0) / 1000);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) draw(0.5);
  });
  fit();
  if (reduce) {
    draw(0.5);   // reduce — 떠오른 글자 한 장만 고정
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
