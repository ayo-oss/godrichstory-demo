<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo hero scene — 매직아이 스테레오그램 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="me is-demo" id="meRoot">
  <p class="me__hint">
    <span>Logo hero scene</span>
    <span class="me__desc">Hide the wordmark as depth over slow waves and the logo surfaces only for eyes that rest</span>
  </p>
  <div class="me__field" role="application" aria-label="Brand front-door board" tabindex="0">
    <canvas class="me__cv" id="meCv"></canvas>
  </div>
  <div class="me__bar">
    <span class="me__meta">wordmark 96px · wave cycle 2s · vignette 18%</span>
    <span class="me__meta me__meta--dim">createLinearGradient · ImageData</span>
  </div>
</div>
</main>
<script>
// Logo hero scene(09) — 브랜드 워드마크를 깊이로 숨긴 대문 장면.
// 오프스크린 캔버스에 워드마크(GODRICH, 96px 굵은 글자)를 찍고 밝기를 깊이로 넘긴 뒤
// 그 위로 느린 사인 파동(주기 2초)을 흘린다 — 글자가 부풀었다 가라앉으며 숨쉰다.
// 비네팅 18%: 노이즈 판 위에 createLinearGradient 어두운 가장자리를 얹어 씬으로 완성한다.
(function () {
  // ── 변형 상수 블록 ──
  var MARK    = 'GODRICH';   // 워드마크
  var FS      = 96;          // 워드마크 크기(px)
  var CYCLE   = 2.0;         // 파동 주기(초)
  var WAVELEN = 150;         // 파동 파장(px)
  var VIG     = 0.18;        // 비네팅 강도(0..1)
  var MAXSHIFT = 12;         // 글자 최대 시프트(px)
  // ─────────────────

  var root = document.getElementById('meRoot');
  var cvEl = document.getElementById('meCv');
  if (!root || !cvEl) return;
  var fieldEl = cvEl.parentElement;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var PAL = [];
  for (var i = 0; i < 5; i++) PAL.push(tokRGB('--me-p' + i));

  function baseIdx(x, y) {
    var h = (Math.imul(x + 11, 374761393) + Math.imul(y + 7, 668265263)) >>> 0;
    h ^= h >>> 13;
    h = Math.imul(h, 1274126177) >>> 0;
    h ^= h >>> 16;
    return ((h % PAL.length) + PAL.length) % PAL.length;
  }

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0, img = null;
  var off = document.createElement('canvas');   // 워드마크 오프스크린
  var offCtx = off.getContext('2d');
  var markMap = null;

  function fit() {
    var r = fieldEl.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = W; cvEl.height = H;
    img = ctx.createImageData(W, H);
    off.width = W; off.height = H;
    renderMark();
  }

  // 워드마크를 오프스크린에 찍는다 — 2단 락업(대 워드마크 + 서브 워드)으로 판을 채운다
  function renderMark() {
    offCtx.clearRect(0, 0, W, H);
    var fs = Math.min(FS, W * 0.21);
    offCtx.textAlign = 'center'; offCtx.textBaseline = 'middle';
    offCtx.fillStyle = '#fff';
    // 판폭에 맞출 수 없으면 가로 축소 — 마크는 항상 화면을 꽉 채운다
    offCtx.font = '900 ' + fs + 'px "Segoe UI", "Arial Black", sans-serif';
    var tw = offCtx.measureText(MARK).width;
    var line1y = H * 0.42, line2y = H * 0.66;
    if (tw > W * 0.94) {
      offCtx.save();
      offCtx.translate(W / 2, line1y);
      offCtx.scale(W * 0.94 / tw, 1);
      offCtx.fillText(MARK, 0, 0);
      offCtx.restore();
    } else {
      offCtx.fillText(MARK, W / 2, line1y);
    }
    // 서브 워드 — 자간을 벌려 브랜드 락업을 만든다
    var sub = 'S T O R Y';
    offCtx.font = '700 ' + Math.round(fs * 0.34) + 'px "Segoe UI", sans-serif';
    var tw2 = offCtx.measureText(sub).width;
    if (tw2 > W * 0.94) {
      offCtx.save();
      offCtx.translate(W / 2, line2y);
      offCtx.scale(W * 0.94 / tw2, 1);
      offCtx.fillText(sub, 0, 0);
      offCtx.restore();
    } else {
      offCtx.fillText(sub, W / 2, line2y);
    }
    var id = offCtx.getImageData(0, 0, W, H);
    var lum = new Float32Array(W * H);
    var yy, xx;
    for (yy = 0; yy < H; yy++) {
      for (xx = 0; xx < W; xx++) {
        var v = id.data[(yy * W + xx) * 4] / 255;   // 흰 글자 → 1
        if (v > 0.25) lum[yy * W + xx] = v;
      }
    }
    // 두께 확장 — 깊이 맵만 3px 부풀려 스트로크 사이도 조각되게(화면 픽셀이 아니라 깊이만)
    markMap = new Float32Array(W * H);
    for (yy = 0; yy < H; yy++) {
      for (xx = 0; xx < W; xx++) {
        var base = lum[yy * W + xx];
        if (base > 0) { markMap[yy * W + xx] = base; continue; }
        var m = 0;
        for (var oy = -3; oy <= 3 && !m; oy++) {
          var sy2 = yy + oy; if (sy2 < 0 || sy2 >= H) continue;
          for (var ox = -3; ox <= 3; ox++) {
            var sx2 = xx + ox; if (sx2 < 0 || sx2 >= W) continue;
            if (lum[sy2 * W + sx2] > 0) { m = 0.55; break; }
          }
        }
        markMap[yy * W + xx] = m;
      }
    }
  }

  function depthAt(x, y, t) {
    if (!markMap) return 0;
    var ph = t / CYCLE * Math.PI * 2;
    var breathe = 0.55 + 0.45 * Math.sin(ph + 0.8);
    // 바닥 지면 — 판 전체에 아주 얕은 원거리 지형(1~2px)을 깐다. 마크 뒤 안개처럼
    // 숨쉬며, 노이즈 배경 전체가 느리게 재엮인다(마크만으로는 면적이 좁다).
    var fx = (x / W) * Math.PI * 2;
    var fw = 0.5 + 0.5 * Math.sin(fx * 1.5 - ph * 0.5);
    var fw2 = 0.5 + 0.5 * Math.sin(fx * 0.8 + y * 0.012 - ph * 0.34 + 2.0);
    var floorD = (0.085 * fw + 0.075 * fw2) * breathe;
    // 수직 bob — 마크를 천천히 떠오르게 한다(행마다 샘플이 흐른다)
    var bob = Math.round(Math.sin(ph) * H * 0.08);
    var sy = y - bob;
    if (sy < 0 || sy >= H) sy = y;
    var m = markMap[sy * W + x];
    if (!m || m <= 0) return floorD;
    // 느린 파동 — 마크를 대각선으로 가로지르는 사인이 글자를 부풀렸다 가라앉힌다
    var wpos = ((x + y * 0.5) / WAVELEN) * Math.PI * 2;
    var wave = Math.sin(wpos - ph) * 0.5 + 0.5;
    var wave2 = Math.sin(((x * 0.4 - y) / (WAVELEN * 1.3)) * Math.PI * 2 - ph * 0.6 + 1.4) * 0.5 + 0.5;
    var markD = m * (0.22 + 0.42 * wave + 0.36 * wave2) * breathe;
    return markD > floorD ? markD : floorD;
  }

  function draw(t) {
    var d = img.data, x, y, di;
    var col = new Int32Array(W);
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        var s = Math.round(depthAt(x, y, t) * MAXSHIFT);
        if (s <= 0) {
          col[x] = baseIdx(x, y);
        } else {
          var from = x - s;
          col[x] = from >= 0 ? col[from] : baseIdx(from + W, y);
        }
      }
      for (x = 0; x < W; x++) {
        var c = PAL[col[x]];
        di = (y * W + x) * 4;
        d[di] = c[0]; d[di + 1] = c[1]; d[di + 2] = c[2]; d[di + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);

    // 비네팅 18% — 노이즈 판 위에 어두운 가장자리를 얹는다(씬 완성)
    var vg = ctx.createLinearGradient(0, 0, 0, H);
    vg.addColorStop(0, 'rgba(12, 10, 18, ' + (VIG * 0.9).toFixed(3) + ')');
    vg.addColorStop(0.28, 'rgba(12, 10, 18, 0)');
    vg.addColorStop(0.72, 'rgba(12, 10, 18, 0)');
    vg.addColorStop(1, 'rgba(12, 10, 18, ' + (VIG * 0.9).toFixed(3) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1;
  function frame(now) {
    if (t0 < 0) t0 = now;
    draw((now - t0) / 1000);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) draw(0);
  });
  fit();
  if (reduce) {
    draw(0);
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
