<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropdown menu — scale from corner origin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="toolbar">
    <nav class="menu is-demo">
      <button class="menu__trigger" type="button" aria-expanded="false">프로필</button>
      <ul class="menu__panel">
        <li><a href="#">계정 설정</a></li>
        <li><a href="#">알림</a></li>
        <li><a href="#">로그아웃</a></li>
      </ul>
    </nav>
  </div>
</main>
<script>
// 트리거를 클릭하면 열리고 닫힌다. 데모(.is-demo)는 스스로 반복한다.
var m = document.querySelector('.menu'), t = m.querySelector('.menu__trigger');
t.addEventListener('click', function () {
  m.classList.remove('is-demo');
  t.setAttribute('aria-expanded', m.classList.toggle('is-open'));
});
</script>
</body>
</html>
