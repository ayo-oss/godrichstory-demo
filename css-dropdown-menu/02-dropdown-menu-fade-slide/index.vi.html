<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropdown menu — fade + slide</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <nav class="menu is-demo">
    <button class="menu__trigger" type="button" aria-expanded="false">Tài khoản của tôi</button>
    <ul class="menu__panel">
      <li><a href="#">Hồ sơ</a></li>
      <li><a href="#">Cài đặt</a></li>
      <li><a href="#">Đăng xuất</a></li>
    </ul>
  </nav>
</main>
<script>
// 트리거 클릭으로 열고, Menu 바깥을 클릭하면 닫힌다. 데모(.is-demo)는 스스로 반복한다.
var m = document.querySelector('.menu'), t = m.querySelector('.menu__trigger');
t.addEventListener('click', function () {
  m.classList.remove('is-demo');
  t.setAttribute('aria-expanded', m.classList.toggle('is-open'));
});
document.addEventListener('pointerdown', function (e) {
  if (!m.contains(e.target)) { m.classList.remove('is-open'); t.setAttribute('aria-expanded', false); }
});
</script>
</body>
</html>
