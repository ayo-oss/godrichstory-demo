<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropdown menu — height:auto transition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <nav class="menu is-demo">
    <button class="menu__trigger" type="button" aria-expanded="false">Menu</button>
    <div class="menu__panel">
      <ul class="menu__list">
        <li><a href="#">Announcements</a></li>
        <li><a href="#">FAQ</a></li>
        <li><a href="#">Support</a></li>
      </ul>
    </div>
  </nav>
</main>
<script>
// 실제 클릭으로도 열고 닫힌다. 데모(.is-demo)는 스스로 반복하다가 사람이 누르면 멈추고 수동 토글로 바뀐다.
var m = document.querySelector('.menu');
var t = m.querySelector('.menu__trigger');
t.addEventListener('click', function () {
  m.classList.remove('is-demo');
  var open = m.classList.toggle('is-open');
  t.setAttribute('aria-expanded', open);
});
</script>
</body>
</html>
