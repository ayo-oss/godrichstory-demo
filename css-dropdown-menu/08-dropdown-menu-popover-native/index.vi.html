<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropdown menu — native popover attribute</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="menu">
    <button class="menu__trigger" type="button" popovertarget="menu-panel">Tùy chọn</button>
    <ul class="menu__panel" id="menu-panel" popover>
      <li><a href="#">Chia sẻ</a></li>
      <li><a href="#">Đánh dấu</a></li>
      <li><a href="#">Báo cáo</a></li>
    </ul>
  </div>
</main>
<script>
// popover 는 열려야 화면에 그려진다. 열어 둔 채 안쪽 내용만 2초 주기로 접었다 편다.
// 트리거는 popovertarget 하나로 실제 열고 닫기·바깥 클릭·Esc 를 브라우저가 대신 처리한다.
document.getElementById('menu-panel').showPopover();
</script>
</body>
</html>
