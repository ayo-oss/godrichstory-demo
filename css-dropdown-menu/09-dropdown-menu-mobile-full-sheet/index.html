<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropdown menu — mobile full sheet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <button class="menu__trigger is-demo" type="button" aria-expanded="false">메뉴</button>
  <ul class="menu__sheet">
    <li><a href="#">홈</a></li>
    <li><a href="#">검색</a></li>
    <li><a href="#">마이페이지</a></li>
    <li><a href="#">설정</a></li>
  </ul>
</main>
<script>
// 트리거를 클릭하면 열리고, 시트 바깥을 클릭하면 닫힌다. 데모(.is-demo)는 스스로 반복한다.
var t = document.querySelector('.menu__trigger'), s = document.querySelector('.menu__sheet');
t.addEventListener('click', function () {
  t.classList.remove('is-demo');
  t.setAttribute('aria-expanded', s.classList.toggle('is-open'));
});
document.addEventListener('pointerdown', function (e) {
  if (s.classList.contains('is-open') && !s.contains(e.target) && e.target !== t) { s.classList.remove('is-open'); t.setAttribute('aria-expanded', false); }
});
</script>
</body>
</html>
