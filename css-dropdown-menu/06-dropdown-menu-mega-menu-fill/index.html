<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropdown menu — mega-menu background fill</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <nav class="menu is-demo">
    <button class="menu__trigger" type="button" aria-expanded="false">카테고리</button>
    <div class="menu__panel">
      <div class="menu__fill"></div>
      <div class="menu__grid">
        <a href="#">여성</a>
        <a href="#">남성</a>
        <a href="#">키즈</a>
        <a href="#">홈</a>
      </div>
    </div>
  </nav>
</main>
<script>
// 트리거를 클릭하면 열리고 닫힌다. 데모(.is-demo)는 스스로 반복한다.
var m = document.querySelector('.menu'), t = m.querySelector('.menu__trigger');
t.addEventListener('click', function () {
  m.classList.remove('is-demo');
  t.setAttribute('aria-expanded', m.classList.toggle('is-open'));
});
</script>
</body>
</html>
