<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Polar Scene Where the Waveform Wraps Around a Ring and Lights Up Behind a Turning Playhead Needle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wf is-demo" id="wfRoot">
  <canvas class="wf__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="A Polar Scene Where the Waveform Wraps Around a Ring and Lights Up Behind a Turning Playhead Needle" role="slider" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0"></canvas>
  <p class="wf__status" data-role="status" aria-live="polite">Needle angle</p>
  <button class="wf__btn" data-role="btn" type="button">Pause</button>
  <p class="wf__caption">A Polar Scene Where the Waveform Wraps Around a Ring and Lights Up Behind a Turning Playhead Needle</p>
</div>
</main>
<script>
(function () {
const W = 480;
const H = 300;
const PI2 = Math.PI * 2;
const FIXED_DT = 16;
const IDLE_STEPS = 220;
const REDUCE_STEP_MS = 900;
const REDUCE_WARM_STEPS = 40;
const BTN_PAUSE = 'Pause';
const BTN_PLAY = 'Play';
const BTN_NEXT = 'Next moment';
// 파스텔 팔레트와 어두운 바탕 두 끝 색
const PINK = [255, 170, 196];
const MINT = [150, 226, 196];
const LILAC = [196, 176, 255];
const SKY_BLUE = [150, 214, 255];
const BUTTER = [255, 230, 150];
const CREAM = [255, 247, 230];
const INK = [23, 20, 26];
const BG_TOP = [24, 21, 40];
const BG_BOT = [48, 42, 78];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, k) { return a + (b - a) * k; }
function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a.toFixed(3) + ')'; }
// 시드 고정 난수 — 같은 시드면 언제나 같은 수열 (선형 합동 방식)
function lcg(seed) {
    let s = seed >>> 0;
    return function () {
        s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
        return s / 4294967296;
    };
}
// 정수 하나와 시드로 0 이상 1 미만의 값을 만드는 해시 (같은 입력은 늘 같은 값)
function hash1(i, seed) {
    let h = (Math.imul(i | 0, 374761393) + Math.imul(seed | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
}
// 사인 두 개를 음절마다 갈아 끼우고 엔벨로프를 씌운 합성 신호 (소리는 재생하지 않고 수치만 만든다)
function synth(n, seed) {
    const rnd = lcg(seed);
    const out = new Float32Array(n);
    let i = 0;
    let p1 = 0;
    let p2 = 0;
    let peak = 0.0001;
    while (i < n) {
        const len = 1800 + Math.floor(rnd() * 4200);
        const amp = 0.18 + rnd() * 0.82;
        const rest = rnd() < 0.18;
        const f1 = 0.02 + rnd() * 0.09;
        const f2 = f1 * (1.5 + rnd());
        const stop = Math.min(n, i + len);
        for (let k = i; k < stop; k += 1) {
            const x = (k - i) / len;
            const env = Math.min(1, x / 0.06) * Math.pow(1 - x, 0.8);
            p1 += PI2 * f1;
            p2 += PI2 * f2;
            const tone = Math.sin(p1) * 0.7 + Math.sin(p2) * 0.3;
            const gain = rest ? 0.03 : amp * env;
            const v = gain * tone + (rnd() - 0.5) * 0.08 * (rest ? 0.4 : amp);
            out[k] = v;
            const a = Math.abs(v);
            if (a > peak) {
                peak = a;
            }
        }
        i = stop;
    }
    const norm = 0.92 / peak;
    for (let k = 0; k < n; k += 1) {
        out[k] *= norm;
    }
    return out;
}
// 표본 구간 [a, b) 의 최솟값과 최댓값 — 결과는 rangeLo, rangeHi 에 둔다
let rangeLo = 0;
let rangeHi = 0;
function scanRange(sig, a, b) {
    const from = Math.max(0, Math.floor(a));
    const to = Math.min(sig.length, Math.max(from + 1, Math.ceil(b)));
    let lo = 1e9;
    let hi = -1e9;
    for (let i = from; i < to; i += 1) {
        const v = sig[i];
        if (v < lo) {
            lo = v;
        }
        if (v > hi) {
            hi = v;
        }
    }
    if (lo > hi) {
        lo = 0;
        hi = 0;
    }
    rangeLo = lo;
    rangeHi = hi;
}
function paintBg(ctx, top, bot) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgba(top, 1));
    g.addColorStop(1, rgba(bot, 1));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
}
// 가짜 포인터 — 시연 동안 손이 움직이는 것처럼 보이게 그린다
function drawCursor(ctx, x, y, down) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 15);
    ctx.lineTo(4, 11.5);
    ctx.lineTo(7.5, 18);
    ctx.lineTo(10, 16.8);
    ctx.lineTo(6.6, 10.4);
    ctx.lineTo(11.5, 10.2);
    ctx.closePath();
    ctx.fillStyle = rgba(CREAM, 1);
    ctx.strokeStyle = rgba(INK, 1);
    ctx.lineWidth = 1.4;
    ctx.fill();
    ctx.stroke();
    if (down) {
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, PI2);
        ctx.strokeStyle = rgba(PINK, 0.9);
        ctx.lineWidth = 2;
        ctx.stroke();
    }
    ctx.restore();
}
function boot(root, make) {
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const btnEl = root.querySelector('[data-role="btn"]');
    if (!(canvasEl instanceof HTMLCanvasElement) || !statusEl || !(btnEl instanceof HTMLButtonElement)) {
        return function () { };
    }
    const ctxOrNull = canvasEl.getContext('2d');
    if (!ctxOrNull) {
        return function () { };
    }
    const canvas = canvasEl;
    const ctx = ctxOrNull;
    const status = statusEl;
    const btn = btnEl;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const cleaners = [];
    let paused = false;
    let idle = IDLE_STEPS + 1;
    let clock = 0;
    let lastSayAt = -1e9;
    let lastText = status.textContent || '';
    let scene = null;
    let rafId = 0;
    let acc = 0;
    let lastTs = -1;
    function isAuto() { return !reduce && !paused && idle > IDLE_STEPS; }
    function sync() {
        const on = isAuto();
        if (root.classList.contains('is-demo') !== on) {
            root.classList.toggle('is-demo', on);
        }
    }
    function fit() {
        const r = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const cw = Math.max(1, Math.round(r.width * dpr));
        const ch = Math.max(1, Math.round(r.height * dpr));
        canvas.width = cw;
        canvas.height = ch;
        ctx.setTransform(cw / W, 0, 0, ch / H, 0, 0);
    }
    const host = {
        ctx,
        canvas,
        root,
        reduce,
        touch() {
            idle = 0;
            sync();
        },
        auto: isAuto,
        refresh() {
            if (scene) {
                scene.draw();
            }
        },
        say(text) {
            if (text === lastText) {
                return;
            }
            if (!reduce && clock - lastSayAt < 250) {
                return;
            }
            lastText = text;
            lastSayAt = clock;
            // 시연이 혼자 돌 때는 읽어 주지 않고, 사람이 만졌을 때만 알린다
            status.setAttribute('aria-live', isAuto() ? 'off' : 'polite');
            status.textContent = text;
        },
        local(e) {
            const r = canvas.getBoundingClientRect();
            return [clamp((e.clientX - r.left) * W / Math.max(1, r.width), 0, W), clamp((e.clientY - r.top) * H / Math.max(1, r.height), 0, H)];
        },
        listen(target, type, fn, opts) {
            target.addEventListener(type, fn, opts);
            cleaners.push(function () { target.removeEventListener(type, fn, opts); });
        }
    };
    function advance(ms) {
        if (!scene) {
            return;
        }
        const n = Math.max(1, Math.round(ms / FIXED_DT));
        for (let i = 0; i < n; i += 1) {
            idle += 1;
            clock += FIXED_DT;
            scene.step();
        }
    }
    function frame(ts) {
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min(ts - lastTs, 160);
        lastTs = ts;
        if (!paused && scene) {
            acc += dt;
            while (acc >= FIXED_DT) {
                idle += 1;
                clock += FIXED_DT;
                scene.step();
                acc -= FIXED_DT;
            }
            sync();
            scene.draw();
        }
        rafId = requestAnimationFrame(frame);
    }
    scene = make(host);
    btn.textContent = reduce ? BTN_NEXT : BTN_PAUSE;
    fit();
    if (reduce) {
        root.classList.remove('is-demo');
        advance(REDUCE_WARM_STEPS * FIXED_DT);
    }
    scene.draw();
    host.listen(btn, 'click', function () {
        if (reduce) {
            advance(REDUCE_STEP_MS);
            host.refresh();
            return;
        }
        paused = !paused;
        btn.textContent = paused ? BTN_PLAY : BTN_PAUSE;
        sync();
    });
    host.listen(window, 'resize', function () {
        fit();
        host.refresh();
    });
    if (!reduce) {
        rafId = requestAnimationFrame(frame);
    }
    return function () {
        cancelAnimationFrame(rafId);
        for (let i = 0; i < cleaners.length; i += 1) {
            cleaners[i]();
        }
    };
}
const SAMPLE_N = 43200;
const RING_R = 66;
const BAR_COUNT = 96;
const SWEEP_SPEED = 2.2;
const AFTERGLOW = 1.1;
const BAR_LEN = 62;
const CX = 240;
const CY = 134;
const WEDGE_SLICES = 14;
const KEY_TURN = 0.26;
const TXT_ANGLE = 'Needle angle';
// 막대 i 의 구간 최댓값(바깥으로)과 최솟값(안쪽으로)
function ringBars(sig, count) {
    const lo = [];
    const hi = [];
    const per = sig.length / count;
    for (let i = 0; i < count; i += 1) {
        scanRange(sig, i * per, (i + 1) * per);
        lo.push(rangeLo);
        hi.push(rangeHi);
    }
    return { lo, hi };
}
function makeRingScene(h) {
    const sig = synth(SAMPLE_N, 4595);
    const bars = ringBars(sig, BAR_COUNT);
    let theta = 0;
    let dragging = false;
    let tick = 0;
    function angleOf(e) {
        const p = h.local(e);
        return Math.atan2(p[1] - CY, p[0] - CX) + Math.PI / 2;
    }
    function turn(a) {
        theta = ((a % PI2) + PI2) % PI2;
        h.touch();
        setAria(true);
        h.refresh();
    }
    function setAria(force) {
        if (!force && tick % 30 !== 0) {
            return;
        }
        const deg = Math.round(theta / PI2 * 360);
        h.canvas.setAttribute('aria-valuenow', String(deg));
        h.canvas.setAttribute('aria-valuetext', deg + ' deg');
    }
    h.listen(h.canvas, 'pointerdown', function (e) {
        const pe = e;
        dragging = true;
        h.canvas.setPointerCapture(pe.pointerId);
        turn(angleOf(pe));
    });
    h.listen(h.canvas, 'pointermove', function (e) {
        if (dragging) {
            turn(angleOf(e));
        }
    });
    const drop = function () { dragging = false; };
    h.listen(h.canvas, 'pointerup', drop);
    h.listen(h.canvas, 'pointercancel', drop);
    h.listen(h.canvas, 'keydown', function (e) {
        const key = e.key;
        if (key === 'ArrowLeft') {
            e.preventDefault();
            turn(theta - KEY_TURN);
        }
        else if (key === 'ArrowRight') {
            e.preventDefault();
            turn(theta + KEY_TURN);
        }
    });
    return {
        step() {
            tick += 1;
            if (!dragging) {
                theta = (theta + SWEEP_SPEED * FIXED_DT / 1000) % PI2;
            }
            setAria(false);
        },
        draw() {
            const ctx = h.ctx;
            paintBg(ctx, BG_TOP, BG_BOT);
            ctx.lineCap = 'round';
            // 바늘 뒤로 끌리는 부채꼴 잔광
            for (let s = 0; s < WEDGE_SLICES; s += 1) {
                const a1 = theta - Math.PI / 2 - s * 0.09;
                ctx.beginPath();
                ctx.moveTo(CX, CY);
                ctx.arc(CX, CY, RING_R + BAR_LEN * 0.75, a1 - 0.09, a1);
                ctx.closePath();
                ctx.fillStyle = rgba(SKY_BLUE, 0.2 * (1 - s / WEDGE_SLICES));
                ctx.fill();
            }
            ctx.lineWidth = PI2 * RING_R / BAR_COUNT * 0.74;
            const cur = Math.floor(theta / PI2 * BAR_COUNT) % BAR_COUNT;
            for (let i = 0; i < BAR_COUNT; i += 1) {
                const a = (i + 0.5) / BAR_COUNT * PI2;
                // 바늘이 지나간 뒤 얼마나 돌았는지 — 가까울수록 밝다
                const behind = ((theta - a) % PI2 + PI2) % PI2;
                const glow = Math.exp(-behind * AFTERGLOW);
                const outer = RING_R + Math.pow(Math.max(bars.hi[i], 0.03), 0.7) * BAR_LEN;
                const inner = RING_R - Math.pow(Math.max(-bars.lo[i], 0.03), 0.7) * BAR_LEN * 0.8;
                const s = Math.sin(a - Math.PI / 2);
                const c = Math.cos(a - Math.PI / 2);
                ctx.strokeStyle = rgba(mix(LILAC, PINK, glow), 0.42 + 0.58 * glow);
                ctx.beginPath();
                ctx.moveTo(CX + c * inner, CY + s * inner);
                ctx.lineTo(CX + c * outer, CY + s * outer);
                ctx.stroke();
            }
            // 바늘
            const ns = Math.sin(theta - Math.PI / 2);
            const nc = Math.cos(theta - Math.PI / 2);
            ctx.strokeStyle = rgba(BUTTER, 1);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(CX + nc * (RING_R - BAR_LEN * 0.9), CY + ns * (RING_R - BAR_LEN * 0.9));
            ctx.lineTo(CX + nc * (RING_R + BAR_LEN + 6), CY + ns * (RING_R + BAR_LEN + 6));
            ctx.stroke();
            // 가운데 원 — 바늘 아래 막대의 크기만큼 부푼다
            const lead = Math.max(bars.hi[cur], -bars.lo[cur]);
            ctx.beginPath();
            ctx.arc(CX, CY, 9 + lead * 14, 0, PI2);
            ctx.fillStyle = rgba(MINT, 0.9);
            ctx.fill();
            h.say(TXT_ANGLE + ': ' + Math.round(theta / PI2 * 360) + ' deg');
        }
    };
}

    boot(document.getElementById('wfRoot'), makeRingScene);
})();
</script>
</body>
</html>
