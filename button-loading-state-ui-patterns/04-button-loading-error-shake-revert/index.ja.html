<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>失敗すると短く揺れて元のラベルに戻るボタン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="scene is-demo" id="scene">
  <button class="btn" id="btn" type="button">
    <span class="btnContent">
      <span class="btnLabel" id="label">Submit</span>
      <span class="btnRingWrap" id="ringWrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" class="ringSvg">
          <circle id="ring" cx="12" cy="12" r="9" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="34 22"></circle>
        </svg>
      </span>
      <span class="btnXWrap" id="xWrap" aria-hidden="true">
        <svg viewBox="0 0 256 256" width="16" height="16">
          <g fill="currentColor"><path d="M216 56v144a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h144a16 16 0 0 1 16 16" opacity=".2"/><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g>
        </svg>
      </span>
    </span>
  </button>
  <span class="visuallyHidden" id="status" role="status" aria-live="polite"></span>
</div>
</main>
<script>
(function () {
  var FADE_MS = 180;
  var SPIN_MS = 600;
  var ICON_SWAP_MS = 150;
  var SHAKE_MS = 520;
  var HOLD_MS = 300;
  var GAP_MS = 480;
  var START_DELAY_MS = 200;
  var DEG_PER_MS = 360 / 750;
  var SHAKE_AMPLITUDE_PX = 9;
  var SHAKE_DECAY_PER_S = 9;
  var SHAKE_FREQ_HZ = 8;

  var scene = document.getElementById('scene');
  var btn = document.getElementById('btn');
  var label = document.getElementById('label');
  var ringWrap = document.getElementById('ringWrap');
  var ring = document.getElementById('ring');
  var xWrap = document.getElementById('xWrap');
  var status = document.getElementById('status');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var gen = 0;
  var timers = [];
  var spinRafId = 0;

  function human() {
    if (scene.classList.contains('is-demo')) {
      scene.classList.remove('is-demo');
      timers.forEach(function (t) { clearTimeout(t); });
      timers = [];
    }
  }

  function easeInOutQuad(p) { return p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

  function fade(el, from, to, ms, myGen, onDone) {
    var start = null;
    function step(now) {
      if (myGen !== gen) return;
      if (start === null) start = now;
      var p = Math.min(1, (now - start) / ms);
      el.style.opacity = String(from + (to - from) * easeInOutQuad(p));
      if (p < 1) requestAnimationFrame(step); else if (onDone) onDone();
    }
    requestAnimationFrame(step);
  }

  function spinLoop(myGen) {
    var start = null;
    function step(now) {
      if (myGen !== gen) return;
      if (start === null) start = now;
      var angle = ((now - start) * DEG_PER_MS) % 360;
      ring.style.transform = 'rotate(' + angle.toFixed(1) + 'deg)';
      spinRafId = requestAnimationFrame(step);
    }
    spinRafId = requestAnimationFrame(step);
  }

  // 계산 겹: 감쇠 사인파 x(t) = A · e^(-decay·t) · sin(2π·freq·t) 를 매 프레임 계산해
  // 버튼 전체의 translateX 에 적용한다 — 고정 키프레임이 아니라 물리량으로 흔든다.
  function shake(myGen, ms, onDone) {
    var start = null;
    function step(now) {
      if (myGen !== gen) return;
      if (start === null) start = now;
      var elapsed = now - start;
      var tSec = elapsed / 1000;
      var x = SHAKE_AMPLITUDE_PX * Math.exp(-SHAKE_DECAY_PER_S * tSec) * Math.sin(2 * Math.PI * SHAKE_FREQ_HZ * tSec);
      btn.style.transform = 'translateX(' + x.toFixed(2) + 'px)';
      if (elapsed < ms) requestAnimationFrame(step);
      else { btn.style.transform = 'translateX(0px)'; if (onDone) onDone(); }
    }
    requestAnimationFrame(step);
  }

  function runAnimated() {
    gen++;
    var myGen = gen;
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    status.textContent = '送信中';
    fade(label, 1, 0, FADE_MS, myGen);
    fade(ringWrap, 0, 1, FADE_MS, myGen, function () { spinLoop(myGen); });
    timers.push(setTimeout(function () {
      cancelAnimationFrame(spinRafId);
      status.textContent = '送信失敗';
      fade(ringWrap, 1, 0, ICON_SWAP_MS, myGen);
      fade(xWrap, 0, 1, ICON_SWAP_MS, myGen);
      shake(myGen, SHAKE_MS, function () {
        timers.push(setTimeout(function () {
          fade(xWrap, 1, 0, FADE_MS, myGen);
          fade(label, 0, 1, FADE_MS, myGen, function () {
            btn.disabled = false;
            btn.removeAttribute('aria-busy');
            status.textContent = '';
          });
        }, HOLD_MS));
      });
    }, SPIN_MS));
  }

  function runReduced() {
    gen++;
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    status.textContent = '送信中';
    label.style.opacity = '0';
    ringWrap.style.opacity = '1';
    timers.push(setTimeout(function () {
      status.textContent = '送信失敗';
      ringWrap.style.opacity = '0';
      xWrap.style.opacity = '1';
      timers.push(setTimeout(function () {
        xWrap.style.opacity = '0';
        label.style.opacity = '1';
        btn.disabled = false;
        btn.removeAttribute('aria-busy');
        status.textContent = '';
      }, HOLD_MS));
    }, SPIN_MS));
  }

  btn.addEventListener('click', function () {
    if (btn.disabled) return;
    human();
    if (reduce) runReduced(); else runAnimated();
  });

  // reduce: 실사용 경로 적용 — runReduced() 는 회전·흔들림 트윈 없이 opacity 만 즉시 바꾼다.
  // 아래 자동 루프는 시연 게이트만 — reduce 에서는 돌지 않는다.
  function cycle() {
    if (!scene.classList.contains('is-demo')) return;
    runAnimated();
    timers.push(setTimeout(function () {
      timers.push(setTimeout(cycle, GAP_MS));
    }, SPIN_MS + SHAKE_MS + HOLD_MS + FADE_MS));
  }

  if (!reduce) {
    timers.push(setTimeout(cycle, START_DELAY_MS));
  }
})();
</script>
</body>
</html>
