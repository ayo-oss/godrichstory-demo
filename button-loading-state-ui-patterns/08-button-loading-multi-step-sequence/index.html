<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로딩 중 라벨 문구가 단계별로 바뀌는 버튼 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="scene is-demo" id="scene">
  <button class="btn" id="btn" type="button">
    <span class="btnContent">
      <span class="btnLabel" id="label">Submit</span>
      <span class="btnSteps" id="steps" aria-hidden="true">
        <span class="btnStepsTrack" id="track">
          <span class="btnStep" id="step0">Preparing</span>
          <span class="btnStep" id="step1">Uploading</span>
          <span class="btnStep" id="step2">Verifying</span>
          <span class="btnStep" id="step3">Done</span>
        </span>
      </span>
    </span>
  </button>
  <span class="visuallyHidden" id="status" role="status" aria-live="polite"></span>
</div>
</main>
<script>
(function () {
  var STEP_INTERVAL_MS = 450;
  var STEP_ANIM_MS = 220;
  var FADE_MS = 160;
  var DONE_HOLD_MS = 400;
  var GAP_MS = 460;
  var START_DELAY_MS = 200;
  var STEP_LABELS = ['Preparing', 'Uploading', 'Verifying', 'Done'];
  var STEP_STATUS = ['준비하는 중', '올리는 중', '확인하는 중', '완료'];

  var scene = document.getElementById('scene');
  var btn = document.getElementById('btn');
  var label = document.getElementById('label');
  var steps = document.getElementById('steps');
  var track = document.getElementById('track');
  var status = document.getElementById('status');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var stepEls = [document.getElementById('step0'), document.getElementById('step1'), document.getElementById('step2'), document.getElementById('step3')];
  var gen = 0;
  var timers = [];

  function human() {
    if (scene.classList.contains('is-demo')) {
      scene.classList.remove('is-demo');
      timers.forEach(function (t) { clearTimeout(t); });
      timers = [];
    }
  }

  function easeInOutQuad(p) { return p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

  // 계산 겹: 각 단계 문구의 오프셋을 짐작하지 않고 offsetTop 으로 실측한다 — 트랙 안에서
  // 앞선 문구들이 쌓인 실제 높이만큼만 밀어 올리므로 줄 높이가 달라져도 어긋나지 않는다.
  function measureOffsets() {
    return stepEls.map(function (el) { return el.offsetTop; });
  }

  function fade(el, from, to, ms, myGen, onDone) {
    var start = null;
    function step(now) {
      if (myGen !== gen) return;
      if (start === null) start = now;
      var p = Math.min(1, (now - start) / ms);
      el.style.opacity = String(from + (to - from) * easeInOutQuad(p));
      if (p < 1) requestAnimationFrame(step); else if (onDone) onDone();
    }
    requestAnimationFrame(step);
  }

  function slideTo(myGen, fromY, toY, ms, onDone) {
    var start = null;
    function step(now) {
      if (myGen !== gen) return;
      if (start === null) start = now;
      var p = easeInOutQuad(Math.min(1, (now - start) / ms));
      var y = fromY + (toY - fromY) * p;
      track.style.transform = 'translateY(' + (-y).toFixed(2) + 'px)';
      if (p < 1) requestAnimationFrame(step); else onDone();
    }
    requestAnimationFrame(step);
  }

  function runAnimated() {
    gen++;
    var myGen = gen;
    var offsets = measureOffsets();
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    status.textContent = STEP_STATUS[0];
    track.style.transform = 'translateY(0px)';
    fade(label, 1, 0, FADE_MS, myGen);
    fade(steps, 0, 1, FADE_MS, myGen);

    function advance(i) {
      if (i >= offsets.length) {
        timers.push(setTimeout(function () {
          fade(steps, 1, 0, FADE_MS, myGen);
          fade(label, 0, 1, FADE_MS, myGen, function () {
            btn.disabled = false;
            btn.removeAttribute('aria-busy');
            label.textContent = 'Submit';
            status.textContent = '';
          });
        }, DONE_HOLD_MS));
        return;
      }
      status.textContent = STEP_STATUS[i];
      timers.push(setTimeout(function () {
        if (i + 1 < offsets.length) {
          slideTo(myGen, offsets[i], offsets[i + 1], STEP_ANIM_MS, function () { advance(i + 1); });
        } else {
          advance(i + 1);
        }
      }, STEP_INTERVAL_MS));
    }
    advance(0);
  }

  function runReduced() {
    gen++;
    var myGen = gen;
    var offsets = measureOffsets();
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    label.style.opacity = '0';
    steps.style.opacity = '1';
    var i = 0;
    function tick() {
      if (myGen !== gen) return;
      status.textContent = STEP_STATUS[i];
      track.style.transform = 'translateY(' + (-offsets[i]).toFixed(2) + 'px)';
      if (i < offsets.length - 1) {
        i++;
        timers.push(setTimeout(tick, STEP_INTERVAL_MS));
      } else {
        timers.push(setTimeout(function () {
          steps.style.opacity = '0';
          label.style.opacity = '1';
          label.textContent = 'Submit';
          btn.disabled = false;
          btn.removeAttribute('aria-busy');
          status.textContent = '';
        }, DONE_HOLD_MS));
      }
    }
    tick();
  }

  btn.addEventListener('click', function () {
    if (btn.disabled) return;
    human();
    if (reduce) runReduced(); else runAnimated();
  });

  // reduce: 실사용 경로 적용 — runReduced() 는 슬라이드 트윈 없이 단계마다 즉시 위치를 바꾼다.
  // 아래 자동 루프는 시연 게이트만 — reduce 에서는 돌지 않는다.
  function cycle() {
    if (!scene.classList.contains('is-demo')) return;
    runAnimated();
    var total = STEP_INTERVAL_MS * STEP_LABELS.length + STEP_ANIM_MS * (STEP_LABELS.length - 1) + DONE_HOLD_MS + FADE_MS;
    timers.push(setTimeout(function () {
      timers.push(setTimeout(cycle, GAP_MS));
    }, total));
  }

  if (!reduce) {
    timers.push(setTimeout(cycle, START_DELAY_MS));
  }
})();
</script>
</body>
</html>
