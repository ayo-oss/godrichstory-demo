<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라벨 대신 점 세 개가 번갈아 커지는 버튼 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="scene is-demo" id="scene">
  <button class="btn" id="btn" type="button">
    <span class="btnContent" id="content">
      <span class="btnLabel" id="label">Send</span>
      <span class="btnDots" id="dots" aria-hidden="true">
        <span class="btnDot" id="dot0"></span>
        <span class="btnDot" id="dot1"></span>
        <span class="btnDot" id="dot2"></span>
      </span>
    </span>
  </button>
  <span class="visuallyHidden" id="status" role="status" aria-live="polite"></span>
</div>
</main>
<script>
(function () {
  var FADE_MS = 160;
  var LOAD_MS = 1100;
  var GAP_MS = 480;
  var START_DELAY_MS = 200;
  var PULSE_PERIOD_MS = 900;
  var PHASE_OFFSET_RAD = (2 * Math.PI) / 3;
  var AMPLITUDE = 0.38;

  var scene = document.getElementById('scene');
  var btn = document.getElementById('btn');
  var label = document.getElementById('label');
  var dots = document.getElementById('dots');
  var dotEls = [document.getElementById('dot0'), document.getElementById('dot1'), document.getElementById('dot2')];
  var status = document.getElementById('status');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var gen = 0;
  var timers = [];
  var rafId = 0;

  function human() {
    if (scene.classList.contains('is-demo')) {
      scene.classList.remove('is-demo');
      timers.forEach(function (t) { clearTimeout(t); });
      timers = [];
    }
  }

  function easeInOutQuad(p) { return p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

  function fade(el, from, to, ms, myGen, onDone) {
    var start = null;
    function step(now) {
      if (myGen !== gen) return;
      if (start === null) start = now;
      var p = Math.min(1, (now - start) / ms);
      el.style.opacity = String(from + (to - from) * easeInOutQuad(p));
      if (p < 1) requestAnimationFrame(step); else if (onDone) onDone();
    }
    requestAnimationFrame(step);
  }

  // 계산 겹: 점마다 위상을 다르게 준 사인파 scale_i(t) = 1 + A·sin(2π·t/period − i·phaseOffset)
  // 를 매 프레임 계산한다 — animation-delay 로 어긋나게 도는 방식이 아니라 각 점을 매번 직접 계산한다.
  function pulseLoop(myGen) {
    var start = null;
    function step(now) {
      if (myGen !== gen) return;
      if (start === null) start = now;
      var t = now - start;
      for (var i = 0; i < dotEls.length; i++) {
        var s = 1 + AMPLITUDE * Math.sin((2 * Math.PI * t) / PULSE_PERIOD_MS - i * PHASE_OFFSET_RAD);
        dotEls[i].style.transform = 'scale(' + s.toFixed(3) + ')';
      }
      rafId = requestAnimationFrame(step);
    }
    rafId = requestAnimationFrame(step);
  }

  function runAnimated() {
    gen++;
    var myGen = gen;
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    status.textContent = '보내는 중';
    fade(label, 1, 0, FADE_MS, myGen);
    fade(dots, 0, 1, FADE_MS, myGen, function () { pulseLoop(myGen); });
    timers.push(setTimeout(function () {
      cancelAnimationFrame(rafId);
      fade(dots, 1, 0, FADE_MS, myGen);
      fade(label, 0, 1, FADE_MS, myGen, function () {
        btn.disabled = false;
        btn.removeAttribute('aria-busy');
        status.textContent = '전송 완료';
      });
    }, LOAD_MS));
  }

  function runReduced() {
    gen++;
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    status.textContent = '보내는 중';
    label.style.opacity = '0';
    dots.style.opacity = '1';
    timers.push(setTimeout(function () {
      dots.style.opacity = '0';
      label.style.opacity = '1';
      btn.disabled = false;
      btn.removeAttribute('aria-busy');
      status.textContent = '전송 완료';
    }, LOAD_MS));
  }

  btn.addEventListener('click', function () {
    if (btn.disabled) return;
    human();
    if (reduce) runReduced(); else runAnimated();
  });

  // reduce: 실사용 경로 적용 — runReduced() 는 펄스 트윈 없이 opacity 만 즉시 바꾼다.
  // 아래 자동 루프는 시연 게이트만 — reduce 에서는 돌지 않는다.
  function cycle() {
    if (!scene.classList.contains('is-demo')) return;
    runAnimated();
    timers.push(setTimeout(function () {
      timers.push(setTimeout(cycle, GAP_MS));
    }, LOAD_MS + FADE_MS));
  }

  if (!reduce) {
    timers.push(setTimeout(cycle, START_DELAY_MS));
  }
})();
</script>
</body>
</html>
