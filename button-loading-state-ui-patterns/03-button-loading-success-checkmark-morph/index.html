<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스피너가 성공 체크 아이콘으로 모양을 바꾸는 버튼 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="scene is-demo" id="scene">
  <button class="btn" id="btn" type="button">
    <span class="btnTint" id="tint" aria-hidden="true"></span>
    <span class="iconWrap" aria-hidden="true">
      <span class="ringWrap" id="ringWrap">
        <svg viewBox="0 0 24 24" width="18" height="18" class="ringSvg">
          <circle id="ring" cx="12" cy="12" r="9" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="34 22"></circle>
        </svg>
      </span>
      <span class="checkWrap" id="checkWrap">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path id="checkPath" d="M4 12 L9.5 17.5 L20 6" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </span>
    </span>
    <span class="btnText" id="text">Confirm order</span>
  </button>
  <span class="visuallyHidden" id="status" role="status" aria-live="polite"></span>
</div>
</main>
<script>
(function () {
  var SPIN_MS = 700;
  var DRAW_MS = 420;
  var HOLD_MS = 450;
  var RESET_MS = 220;
  var GAP_MS = 450;
  var START_DELAY_MS = 200;
  var DEG_PER_MS = 360 / 800;

  var scene = document.getElementById('scene');
  var btn = document.getElementById('btn');
  var tint = document.getElementById('tint');
  var ringWrap = document.getElementById('ringWrap');
  var ring = document.getElementById('ring');
  var checkWrap = document.getElementById('checkWrap');
  var checkPath = document.getElementById('checkPath');
  var text = document.getElementById('text');
  var status = document.getElementById('status');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var gen = 0;
  var timers = [];
  var rafId = 0;

  // 계산 겹: 체크 path 의 실제 길이를 getTotalLength() 로 실측해 stroke-dasharray/offset 을
  // 그 값으로 맞춘다 — 임의 숫자를 넣으면 선이 끝까지 안 그려지거나 남는다.
  var checkLen = checkPath.getTotalLength();
  checkPath.style.strokeDasharray = String(checkLen);
  checkPath.style.strokeDashoffset = String(checkLen);

  function human() {
    if (scene.classList.contains('is-demo')) {
      scene.classList.remove('is-demo');
      timers.forEach(function (t) { clearTimeout(t); });
      timers = [];
    }
  }

  function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }

  function spinLoop(myGen) {
    var start = null;
    function step(now) {
      if (myGen !== gen) return;
      if (start === null) start = now;
      var angle = ((now - start) * DEG_PER_MS) % 360;
      ring.style.transform = 'rotate(' + angle.toFixed(1) + 'deg)';
      rafId = requestAnimationFrame(step);
    }
    rafId = requestAnimationFrame(step);
  }

  // 한 번의 rAF 루프가 링 opacity · 체크 opacity · 체크 draw 길이 · 틴트 opacity 넷을
  // 같은 진행률 p 로 동시에 몰아 "모양이 이어져 바뀐다"는 인상을 만든다.
  function morph(myGen, onDone) {
    var start = null;
    function step(now) {
      if (myGen !== gen) return;
      if (start === null) start = now;
      var p = easeOutCubic(Math.min(1, (now - start) / DRAW_MS));
      ringWrap.style.opacity = String(1 - p);
      checkWrap.style.opacity = String(p);
      checkPath.style.strokeDashoffset = String(checkLen * (1 - p));
      tint.style.opacity = String(p * .5);
      if (p < 1) requestAnimationFrame(step); else onDone();
    }
    requestAnimationFrame(step);
  }

  function reset() {
    cancelAnimationFrame(rafId);
    ring.style.transform = 'rotate(0deg)';
    ringWrap.style.opacity = '1';
    checkWrap.style.opacity = '0';
    checkPath.style.strokeDashoffset = String(checkLen);
    tint.style.opacity = '0';
  }

  function runAnimated() {
    gen++;
    var myGen = gen;
    reset();
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    status.textContent = '처리하는 중';
    text.textContent = 'Processing';
    spinLoop(myGen);
    timers.push(setTimeout(function () {
      cancelAnimationFrame(rafId);
      text.textContent = 'Confirmed';
      status.textContent = '처리 완료';
      morph(myGen, function () {
        timers.push(setTimeout(function () {
          btn.disabled = false;
          btn.removeAttribute('aria-busy');
          text.textContent = 'Confirm order';
          reset();
        }, HOLD_MS));
      });
    }, SPIN_MS));
  }

  function runReduced() {
    gen++;
    reset();
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    status.textContent = '처리하는 중';
    text.textContent = 'Processing';
    timers.push(setTimeout(function () {
      text.textContent = 'Confirmed';
      status.textContent = '처리 완료';
      ringWrap.style.opacity = '0';
      checkWrap.style.opacity = '1';
      checkPath.style.strokeDashoffset = '0';
      tint.style.opacity = '.5';
      timers.push(setTimeout(function () {
        btn.disabled = false;
        btn.removeAttribute('aria-busy');
        text.textContent = 'Confirm order';
        reset();
      }, HOLD_MS));
    }, SPIN_MS));
  }

  btn.addEventListener('click', function () {
    if (btn.disabled) return;
    human();
    if (reduce) runReduced(); else runAnimated();
  });

  // reduce: 실사용 경로 적용 — runReduced() 는 회전·드로잉 트윈 없이 opacity/offset 을 즉시 바꾼다.
  // 아래 자동 루프는 시연 게이트만 — reduce 에서는 돌지 않는다.
  function cycle() {
    if (!scene.classList.contains('is-demo')) return;
    runAnimated();
    timers.push(setTimeout(function () {
      timers.push(setTimeout(cycle, GAP_MS));
    }, SPIN_MS + DRAW_MS + HOLD_MS + RESET_MS));
  }

  if (!reduce) {
    timers.push(setTimeout(cycle, START_DELAY_MS));
  }
})();
</script>
</body>
</html>
