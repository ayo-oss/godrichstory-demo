<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button That Collapses to Icon-Only Width While Loading — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="scene is-demo" id="scene">
  <button class="btn" id="btn" type="button">
    <span class="btnIcon" id="icon" aria-hidden="true">
      <svg viewBox="0 0 256 256" width="18" height="18">
        <g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g>
      </svg>
    </span>
    <span class="btnLabel" id="label">Send message</span>
  </button>
  <span class="visuallyHidden" id="status" role="status" aria-live="polite"></span>
</div>
</main>
<script>
(function () {
  var COLLAPSE_MS = 380;
  var LABEL_FADE_MS = 150;
  var HOLD_MS = 700;
  var EXPAND_MS = 380;
  var GAP_MS = 450;
  var START_DELAY_MS = 200;
  var COLLAPSED_WIDTH_PX = 44;

  var scene = document.getElementById('scene');
  var btn = document.getElementById('btn');
  var icon = document.getElementById('icon');
  var label = document.getElementById('label');
  var status = document.getElementById('status');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var gen = 0;
  var timers = [];

  function human() {
    if (scene.classList.contains('is-demo')) {
      scene.classList.remove('is-demo');
      timers.forEach(function (t) { clearTimeout(t); });
      timers = [];
    }
  }

  function easeInOutQuad(p) { return p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

  // 계산 겹: 지금 렌더된 버튼 실측 폭(fullWidth)과 아이콘 하나가 들어갈 목표 폭을 비교해
  // collapsedRatio 를 구하고, 매 프레임 scale 값으로 btn 을 scaleX 하면서 아이콘엔 1/scale
  // 역스케일을 걸어 버튼이 좁아지는 동안에도 아이콘 자체는 눌리지 않게 만든다.
  function driveScale(myGen, fromScale, toScale, ms, onDone) {
    var fullWidth = btn.getBoundingClientRect().width / fromScale;
    var collapsedRatio = COLLAPSED_WIDTH_PX / fullWidth;
    var resolvedFrom = fromScale === 1 ? 1 : collapsedRatio;
    var resolvedTo = toScale === 1 ? 1 : collapsedRatio;
    var start = null;
    function step(now) {
      if (myGen !== gen) return;
      if (start === null) start = now;
      var p = easeInOutQuad(Math.min(1, (now - start) / ms));
      var scale = resolvedFrom + (resolvedTo - resolvedFrom) * p;
      btn.style.transform = 'scaleX(' + scale.toFixed(4) + ')';
      icon.style.transform = 'scaleX(' + (1 / scale).toFixed(4) + ')';
      if (p < 1) requestAnimationFrame(step); else onDone();
    }
    requestAnimationFrame(step);
  }

  function fade(el, from, to, ms, myGen) {
    var start = null;
    function step(now) {
      if (myGen !== gen) return;
      if (start === null) start = now;
      var p = Math.min(1, (now - start) / ms);
      el.style.opacity = String(from + (to - from) * p);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function reset() {
    btn.style.transform = 'scaleX(1)';
    icon.style.transform = 'scaleX(1)';
    label.style.opacity = '1';
  }

  function runAnimated() {
    gen++;
    var myGen = gen;
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    status.textContent = 'Sending';
    fade(label, 1, 0, LABEL_FADE_MS, myGen);
    driveScale(myGen, 1, 0, COLLAPSE_MS, function () {
      timers.push(setTimeout(function () {
        status.textContent = 'Sent';
        driveScale(myGen, 0, 1, EXPAND_MS, function () {
          fade(label, 0, 1, LABEL_FADE_MS, myGen);
          btn.disabled = false;
          btn.removeAttribute('aria-busy');
        });
      }, HOLD_MS));
    });
  }

  function runReduced() {
    gen++;
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    status.textContent = 'Sending';
    var fullWidth = btn.getBoundingClientRect().width;
    var collapsedRatio = COLLAPSED_WIDTH_PX / fullWidth;
    label.style.opacity = '0';
    btn.style.transform = 'scaleX(' + collapsedRatio.toFixed(4) + ')';
    icon.style.transform = 'scaleX(' + (1 / collapsedRatio).toFixed(4) + ')';
    timers.push(setTimeout(function () {
      status.textContent = 'Sent';
      reset();
      btn.disabled = false;
      btn.removeAttribute('aria-busy');
    }, HOLD_MS));
  }

  btn.addEventListener('click', function () {
    if (btn.disabled) return;
    human();
    if (reduce) runReduced(); else runAnimated();
  });

  // reduce: 실사용 경로 적용 — runReduced() 는 scaleX 트윈 없이 즉시 좁아지고 즉시 되돌아간다.
  // 아래 자동 루프는 시연 게이트만 — reduce 에서는 돌지 않는다.
  function cycle() {
    if (!scene.classList.contains('is-demo')) return;
    runAnimated();
    timers.push(setTimeout(function () {
      timers.push(setTimeout(cycle, GAP_MS));
    }, COLLAPSE_MS + HOLD_MS + EXPAND_MS));
  }

  if (!reduce) {
    timers.push(setTimeout(cycle, START_DELAY_MS));
  }
})();
</script>
</body>
</html>
