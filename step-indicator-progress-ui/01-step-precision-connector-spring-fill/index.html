<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연결선이 스프링으로 채워지는 단계 표시 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cs is-demo" id="cs">
  <ol class="cs__row" id="csRow" role="list" aria-label="가입 진행 단계">
    <li class="cs__node" data-i="0"><span class="cs__circle" id="c0">1</span><span class="cs__label">계정</span></li>
    <li class="cs__connector" id="k0"><span class="cs__connectorTrack"></span><span class="cs__connectorFill" id="f0"></span></li>
    <li class="cs__node" data-i="1"><span class="cs__circle" id="c1">2</span><span class="cs__label">정보</span></li>
    <li class="cs__connector" id="k1"><span class="cs__connectorTrack"></span><span class="cs__connectorFill" id="f1"></span></li>
    <li class="cs__node" data-i="2"><span class="cs__circle" id="c2">3</span><span class="cs__label">확인</span></li>
    <li class="cs__connector" id="k2"><span class="cs__connectorTrack"></span><span class="cs__connectorFill" id="f2"></span></li>
    <li class="cs__node" data-i="3"><span class="cs__circle" id="c3">4</span><span class="cs__label">완료</span></li>
  </ol>
  <p class="cs__status" id="csStatus" aria-live="polite">1단계 / 4단계</p>
  <div class="cs__controls">
    <button type="button" class="cs__btn" id="csPrev">이전</button>
    <button type="button" class="cs__btn cs__btn--primary" id="csNext">다음</button>
  </div>
</div>
</main>
<script>
(function () {
  var STEP_CONNECTOR_OVERSHOOT_PERCENT = 10;
  var SPRING_STIFFNESS = 180;
  var SPRING_DAMPING = 16;
  var SPRING_KICK_VELOCITY = 3.2;
  var STEP_COUNT = 4;
  var MAX_FILL = 1 + STEP_CONNECTOR_OVERSHOOT_PERCENT / 100;

  var root = document.getElementById('cs');
  var status = document.getElementById('csStatus');
  var prevBtn = document.getElementById('csPrev');
  var nextBtn = document.getElementById('csNext');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var circles = [0, 1, 2, 3].map(function (i) { return document.getElementById('c' + i); });
  var fills = [0, 1, 2].map(function (i) { return document.getElementById('f' + i); });

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // 연결선마다 독립된 스프링 상태(위치·속도) — 목표는 0(안 채움) 또는 1(채움)
  var springs = fills.map(function () { return { pos: 0, vel: 0, target: 0 }; });
  var current = 0;

  function integrate(s, dt) {
    var accel = SPRING_STIFFNESS * (s.target - s.pos) - SPRING_DAMPING * s.vel;
    s.vel += accel * dt;
    s.pos += s.vel * dt;
    var max = s.target > 0 ? MAX_FILL : 1;
    if (s.target > 0 && s.pos > MAX_FILL) { s.pos = MAX_FILL; s.vel *= -0.35; }
    if (s.target === 0 && s.pos < 0) { s.pos = 0; s.vel = 0; }
    if (Math.abs(s.pos - s.target) < 0.001 && Math.abs(s.vel) < 0.01) { s.pos = s.target; s.vel = 0; }
  }

  function kick(s) { s.vel += (s.target > s.pos ? 1 : -1) * SPRING_KICK_VELOCITY; }

  function render() {
    var maxGlow = 0;
    fills.forEach(function (el, i) {
      var p = reduce ? springs[i].target : clamp(springs[i].pos, 0, MAX_FILL);
      el.style.transform = 'scaleX(' + p.toFixed(4) + ')';
      // 오버슛(1 을 넘긴 만큼)을 0~1 로 정규화해 연결선 글로우·다음 노드 그림자·배경 톤에 같은 값을 퍼뜨린다
      var over = clamp((p - 1) / (STEP_CONNECTOR_OVERSHOOT_PERCENT / 100), 0, 1);
      el.style.setProperty('--glow', over.toFixed(3));
      if (circles[i + 1]) circles[i + 1].style.setProperty('--glow', over.toFixed(3));
      if (over > maxGlow) maxGlow = over;
    });
    root.style.setProperty('--stageGlow', maxGlow.toFixed(3));
    circles.forEach(function (el, i) {
      el.classList.toggle('is-done', i < current);
      el.classList.toggle('is-active', i === current);
    });
    status.textContent = (current + 1) + '단계 / ' + STEP_COUNT + '단계';
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === STEP_COUNT - 1;
  }

  function goTo(next) {
    next = clamp(next, 0, STEP_COUNT - 1);
    if (next === current) return;
    if (next > current) {
      for (var i = current; i < next; i++) { springs[i].target = 1; kick(springs[i]); }
    } else {
      for (var j = next; j < current; j++) { springs[j].target = 0; kick(springs[j]); }
    }
    current = next;
    render();
  }

  prevBtn.addEventListener('click', function () { root.classList.remove('is-demo'); goTo(current - 1); });
  nextBtn.addEventListener('click', function () { root.classList.remove('is-demo'); goTo(current + 1); });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { root.classList.remove('is-demo'); goTo(current + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { root.classList.remove('is-demo'); goTo(current - 1); e.preventDefault(); }
  });
  circles.forEach(function (el, i) {
    el.addEventListener('click', function () { root.classList.remove('is-demo'); goTo(i); });
  });

  var startTime = null;
  var lastNow = 0;
  var phase = 0;
  function tick(now) {
    if (startTime === null) { startTime = now; lastNow = now; }
    var dt = Math.min((now - lastNow) / 1000, 0.05);
    lastNow = now;
    var t = (now - startTime) / 1000 % 2;
    if (root.classList.contains('is-demo')) {
      if (t < 0.05 && phase !== 0) { phase = 0; }
      if (phase === 0 && t > 0.2) { goTo(clamp(current + 1, 0, STEP_COUNT - 1)); phase = 1; }
      if (phase === 1 && t > 0.75) { goTo(clamp(current + 1, 0, STEP_COUNT - 1)); phase = 2; }
      if (phase === 2 && t > 1.3) { goTo(clamp(current + 1, 0, STEP_COUNT - 1)); phase = 3; }
      if (phase === 3 && t > 1.85) { goTo(0); phase = 4; }
    }
    springs.forEach(function (s) { if (!reduce) integrate(s, dt); });
    render();
    requestAnimationFrame(tick);
  }

  render();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
