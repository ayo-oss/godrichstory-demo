<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현재 단계 원이 숨 쉬듯 커졌다 작아지는 표시 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bp is-demo" id="bp">
  <ol class="bp__row" id="bpRow" role="list" aria-label="체크아웃 진행 단계">
    <li class="bp__node" data-i="0"><span class="bp__ring"></span><span class="bp__circle" id="n0">1</span><span class="bp__label">배송지</span></li>
    <li class="bp__connector"></li>
    <li class="bp__node" data-i="1"><span class="bp__ring"></span><span class="bp__circle" id="n1">2</span><span class="bp__label">결제</span></li>
    <li class="bp__connector"></li>
    <li class="bp__node" data-i="2"><span class="bp__ring"></span><span class="bp__circle" id="n2">3</span><span class="bp__label">확인</span></li>
  </ol>
  <p class="bp__status" id="bpStatus" aria-live="polite">진행 중: 배송지 (1/3)</p>
  <div class="bp__controls">
    <button type="button" class="bp__btn" id="bpPrev">이전</button>
    <button type="button" class="bp__btn bp__btn--primary" id="bpNext">다음</button>
  </div>
</div>
</main>
<script>
(function () {
  var STEP_BREATH_DECAY = 2.4;
  var STEP_BREATH_FREQ = 9.5;
  var STEP_BREATH_AMPLITUDE = 0.16;
  var STEP_BREATH_IMPULSE_S = 1.5;
  var STEP_COUNT = 3;
  var LABELS = ['배송지', '결제', '확인'];
  var STATUS_TEXTS = ['진행 중: 배송지 (1/3)', '진행 중: 결제 (2/3)', '진행 중: 확인 (3/3)'];

  var root = document.getElementById('bp');
  var status = document.getElementById('bpStatus');
  var prevBtn = document.getElementById('bpPrev');
  var nextBtn = document.getElementById('bpNext');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var circles = [0, 1, 2].map(function (i) { return document.getElementById('n' + i); });
  var nodes = Array.prototype.slice.call(root.querySelectorAll('.bp__node'));

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  var current = 0;
  var impulseAt = 0;

  function render() {
    nodes.forEach(function (el, i) {
      var circle = circles[i];
      circle.classList.toggle('is-done', i < current);
      circle.classList.toggle('is-active', i === current);
      el.querySelector('.bp__ring').classList.toggle('is-active', i === current);
    });
    status.textContent = STATUS_TEXTS[current];
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === STEP_COUNT - 1;
  }

  function goTo(next) {
    next = clamp(next, 0, STEP_COUNT - 1);
    if (next === current) return;
    current = next;
    impulseAt = performance.now();
    render();
  }

  prevBtn.addEventListener('click', function () { root.classList.remove('is-demo'); goTo(current - 1); });
  nextBtn.addEventListener('click', function () { root.classList.remove('is-demo'); goTo(current + 1); });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { root.classList.remove('is-demo'); goTo(current + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { root.classList.remove('is-demo'); goTo(current - 1); e.preventDefault(); }
  });
  circles.forEach(function (el, i) { el.addEventListener('click', function () { root.classList.remove('is-demo'); goTo(i); }); });

  function breathScale(nowMs) {
    var tt = (nowMs - impulseAt) / 1000;
    if (tt < 0) return 1;
    var envelope = Math.exp(-STEP_BREATH_DECAY * tt);
    return 1 + STEP_BREATH_AMPLITUDE * envelope * Math.sin(STEP_BREATH_FREQ * tt);
  }

  var startTime = null;
  var phase = 0;
  function tick(now) {
    if (startTime === null) { startTime = now; impulseAt = now; }
    if (root.classList.contains('is-demo')) {
      var t = (now - startTime) / 1000 % 2;
      if (t < 0.05 && phase !== 0) { phase = 0; }
      if (phase === 0 && t > 0.2) { goTo((current + 1) % STEP_COUNT); phase = 1; }
      if (phase === 1 && t > 0.85) { goTo((current + 1) % STEP_COUNT); phase = 2; }
      if (phase === 2 && t > 1.5) { goTo((current + 1) % STEP_COUNT); phase = 3; }
    }
    // 감쇠 사인(envelope)값을 원 확대·후광 링뿐 아니라 카드 배경 톤에도 같은 함수로 퍼뜨린다
    var tt0 = (now - impulseAt) / 1000;
    var envelope0 = tt0 < 0 ? 0 : Math.max(0, Math.exp(-STEP_BREATH_DECAY * tt0));
    root.style.setProperty('--breathGlow', envelope0.toFixed(3));
    if (!reduce) {
      var activeCircle = circles[current];
      var s = breathScale(now);
      activeCircle.style.transform = 'scale(' + s.toFixed(4) + ')';
      activeCircle.style.setProperty('--breathGlow', envelope0.toFixed(3));
      var ringEl = nodes[current].querySelector('.bp__ring');
      var ringEnvelope = envelope0;
      ringEl.style.opacity = (ringEnvelope * 0.5).toFixed(3);
      ringEl.style.transform = 'scale(' + (1 + (1 - ringEnvelope) * 0.6).toFixed(3) + ')';
    } else {
      circles[current].style.transform = 'scale(1)';
    }
    requestAnimationFrame(tick);
  }

  render();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
