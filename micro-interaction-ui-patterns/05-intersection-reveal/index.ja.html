<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>インターセクションリビール — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ir is-demo" id="ir">
  <div class="ir__btns">
    <button class="ir__btn" id="irDown" type="button">下へ</button>
    <button class="ir__btn" id="irUp" type="button">上へ</button>
  </div>
  <div class="ir__pane" id="irPane">
    <div class="ir__spacer"></div>
    <div class="ir__card" id="irCard">
      <p class="ir__title">表示完了</p>
      <p class="ir__desc">一度表示されると、上にスクロールしても状態が維持されます。</p>
    </div>
    <div class="ir__spacer"></div>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('ir');
  var pane = document.getElementById('irPane');
  var card = document.getElementById('irCard');
  var downBtn = document.getElementById('irDown');
  var upBtn = document.getElementById('irUp');
  var revealed = false;
  var autoplay = null;

  // 계산 겹: 가시 비율 값이 기준(.4)을 넘는 순간 한 번만 상태를 뒤집고 즉시 관찰을 끊는다.
  // 이후 비율 값이 다시 낮아져도(스크롤을 올려도) 상태 값은 그대로 유지된다 — 재실행 없음.
  var io = new IntersectionObserver(function (entries) {
    var entry = entries[0];
    if (!revealed && entry.intersectionRatio >= 0.4) {
      revealed = true;
      card.classList.add('ir__card--in');
      io.unobserve(card);
    }
  }, { root: pane, threshold: [0, .4, .8] });
  io.observe(card);

  downBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    pane.scrollTop = pane.scrollHeight;
  });
  upBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    pane.scrollTop = 0;
  });

  function stopAutoplay() {
    if (autoplay) { clearInterval(autoplay); autoplay = null; }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    var down = true;
    autoplay = setInterval(function () {
      pane.scrollTop = down ? pane.scrollHeight : 0;
      down = !down;
    }, 520);
  }
})();
</script>
</body>
</html>
