<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키보드 탭 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tk is-demo" id="tk">
  <div class="tk__tabs" id="tkTabs" role="tablist" aria-label="설정 카테고리">
    <div class="tk__underline" id="tkUnderline" aria-hidden="true"></div>
    <button class="tk__tab" role="tab" data-t type="button" tabindex="0" aria-selected="true">일반</button>
    <button class="tk__tab" role="tab" data-t type="button" tabindex="-1" aria-selected="false">알림</button>
    <button class="tk__tab" role="tab" data-t type="button" tabindex="-1" aria-selected="false">보안</button>
    <button class="tk__tab" role="tab" data-t type="button" tabindex="-1" aria-selected="false">고급 옵션</button>
  </div>
  <p class="tk__panel" id="tkPanel">일반 설정 내용</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('tk');
  var tabsEl = document.getElementById('tkTabs');
  var underline = document.getElementById('tkUnderline');
  var panel = document.getElementById('tkPanel');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('[data-t]'));
  var TEXTS = ['일반 설정 내용', '알림 설정 내용', '보안 설정 내용', '고급 옵션 내용'];
  var index = 0;
  var autoplay = null;

  // 계산 겹: 탭이 바뀔 때마다 그 탭의 실제 렌더 위치·폭을 getBoundingClientRect 로 다시 재서
  // 밑줄 이동 값을 만들고, 탭이 컨테이너 밖에 있으면 스크롤 값도 같은 실측으로 계산한다.
  function place(i) {
    var tab = tabs[i];
    var containerRect = tabsEl.getBoundingClientRect();
    var rect = tab.getBoundingClientRect();
    var x = rect.left - containerRect.left + tabsEl.scrollLeft;
    var w = rect.width;
    underline.style.setProperty('--x', x.toFixed(1) + 'px');
    underline.style.setProperty('--w', w.toFixed(1) + 'px');
    var left = x;
    var right = x + w;
    if (left < tabsEl.scrollLeft) { tabsEl.scrollLeft = left; }
    else if (right > tabsEl.scrollLeft + tabsEl.clientWidth) { tabsEl.scrollLeft = right - tabsEl.clientWidth; }
  }

  function select(i) {
    var len = tabs.length;
    index = ((i % len) + len) % len;
    tabs.forEach(function (t, k) {
      t.setAttribute('aria-selected', k === index ? 'true' : 'false');
      t.setAttribute('tabindex', k === index ? '0' : '-1');
    });
    panel.textContent = TEXTS[index];
    place(index);
  }

  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () {
      root.classList.remove('is-demo');
      stopAutoplay();
      select(i);
      t.focus({ preventScroll: true });
    });
  });

  tabsEl.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft' && e.key !== 'Home' && e.key !== 'End') { return; }
    e.preventDefault();
    root.classList.remove('is-demo');
    stopAutoplay();
    if (e.key === 'ArrowRight') { select(index + 1); }
    if (e.key === 'ArrowLeft') { select(index - 1); }
    if (e.key === 'Home') { select(0); }
    if (e.key === 'End') { select(tabs.length - 1); }
    tabs[index].focus({ preventScroll: true });
  });

  function stopAutoplay() {
    if (autoplay) { clearInterval(autoplay); autoplay = null; }
  }

  select(0);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplay = setInterval(function () { select(index + 1); }, 480);
  }
})();
</script>
</body>
</html>
