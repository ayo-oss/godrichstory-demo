<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토스트 알림 큐 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tq is-demo" id="tq">
  <button class="tq__add" id="tqAdd" type="button">알림 추가</button>
  <ul class="tq__list" id="tqList" aria-live="polite"></ul>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('tq');
  var list = document.getElementById('tqList');
  var addBtn = document.getElementById('tqAdd');
  var MESSAGES = ['저장되었습니다', '전송 완료', '변경 사항 반영됨', '동기화 완료'];
  var STACK_STEP_MS = 900;   // 쌓인 순서 값마다 표시 시간에 더해지는 값
  var BASE_MS = 1500;
  var MAX_ROWS = 3;
  var seq = 0;
  var items = [];
  var autoplay = null;

  // 계산 겹: 표시 시간 = 기본 시간 + 쌓인 순서 값 × 간격. 하나가 사라지면 남은 항목의 순서 값을
  // 다시 매겨 위치(translateY)를 그 값으로 다시 계산한다 — 단순 reflow 가 아니라 순서를 다시 센다.
  function reindex() {
    items.forEach(function (item, i) {
      item.el.style.setProperty('--i', String(i));
    });
  }

  function remove(item) {
    var i = items.indexOf(item);
    if (i === -1) { return; }
    items.splice(i, 1);
    item.el.classList.add('tq__row--out');
    clearTimeout(item.timer);
    setTimeout(function () { item.el.remove(); }, 240);
    reindex();
  }

  function add() {
    var el = document.createElement('li');
    el.className = 'tq__row';
    el.style.setProperty('--i', String(items.length));
    var text = MESSAGES[seq % MESSAGES.length];
    seq += 1;
    var dot = document.createElement('span');
    dot.className = 'tq__dot';
    var span = document.createElement('span');
    span.className = 'tq__text';
    span.textContent = text;
    el.appendChild(dot);
    el.appendChild(span);
    list.appendChild(el);
    var item = { el: el };
    items.push(item);
    if (items.length > MAX_ROWS) { remove(items[0]); }
    var order = items.indexOf(item);
    var dismissAfter = BASE_MS + order * STACK_STEP_MS;
    item.timer = setTimeout(function () { remove(item); }, dismissAfter);
    el.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); remove(item); });
  }

  function stopAutoplay() {
    if (autoplay) { clearInterval(autoplay); autoplay = null; }
  }

  addBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    add();
  });

  // 자동 루프 — 실사용 리스너와 같은 add()/remove() 를 그대로 반복 호출한다
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplay = setInterval(add, 620);
    add();
  }
})();
</script>
</body>
</html>
