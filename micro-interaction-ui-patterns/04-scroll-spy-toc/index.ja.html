<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スクロールスパイ目次 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ss is-demo" id="ss">
  <nav class="ss__toc" aria-label="目次">
    <div class="ss__marker" id="ssMarker" style="--i: 0" aria-hidden="true"></div>
    <button class="ss__link" data-j="0" type="button">はじめる</button>
    <button class="ss__link" data-j="1" type="button">設定する</button>
    <button class="ss__link" data-j="2" type="button">デプロイする</button>
  </nav>
  <div class="ss__pane" id="ssPane">
    <section class="ss__section" data-h="0"><h3>はじめる</h3><p>新しいプロジェクトを作成します。</p></section>
    <section class="ss__section" data-h="1"><h3>設定する</h3><p>環境変数を入力します。</p></section>
    <section class="ss__section" data-h="2"><h3>デプロイする</h3><p>成果物をアップロードします。</p></section>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('ss');
  var pane = document.getElementById('ssPane');
  var marker = document.getElementById('ssMarker');
  var links = Array.prototype.slice.call(document.querySelectorAll('.ss__link'));
  var sections = Array.prototype.slice.call(document.querySelectorAll('.ss__section'));
  var ratios = new Array(sections.length).fill(0);
  var active = 0;
  var autoplay = null;

  // 계산 겹: 모든 제목의 겹침 비율(intersectionRatio) 값을 매 프레임 비교해 가장 큰 값을 가진
  // 항목을 활성으로 고른다 — 고정 스크롤 위치가 아니라 값의 비교로 활성 항목이 정해진다.
  function activate(i) {
    if (i === active) { return; }
    active = i;
    marker.style.setProperty('--i', String(active));
    links.forEach(function (l, k) { l.setAttribute('aria-current', k === active ? 'true' : 'false'); });
  }

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      var i = Number(entry.target.getAttribute('data-h'));
      ratios[i] = entry.intersectionRatio;
    });
    var best = 0;
    for (var k = 1; k < ratios.length; k++) { if (ratios[k] > ratios[best]) { best = k; } }
    if (ratios[best] > 0) { activate(best); }
  }, { root: pane, threshold: [0, .25, .5, .75, 1] });
  sections.forEach(function (s) { io.observe(s); });

  links.forEach(function (l) {
    l.addEventListener('click', function () {
      root.classList.remove('is-demo');
      stopAutoplay();
      var i = Number(l.getAttribute('data-j'));
      sections[i].scrollIntoView({ block: 'start', behavior: 'auto' });
    });
  });

  function stopAutoplay() {
    if (autoplay) { clearInterval(autoplay); autoplay = null; }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    var targets = [0, sections[1].offsetTop, sections[2].offsetTop, 0];
    var step = 0;
    autoplay = setInterval(function () {
      pane.scrollTop = targets[step % targets.length];
      step += 1;
    }, 480);
  }
})();
</script>
</body>
</html>
