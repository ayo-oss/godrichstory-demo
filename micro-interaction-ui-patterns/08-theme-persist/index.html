<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테마 저장 토글 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tp is-demo" id="tp">
  <button class="tp__track" id="tpTrack" type="button" aria-pressed="false">
    <span class="tp__knob" id="tpKnob"></span>
    <span class="tp__ic tp__ic--sun">해</span>
    <span class="tp__ic tp__ic--moon">달</span>
  </button>
  <div class="tp__card" id="tpCard" data-theme="light">
    <p class="tp__label">저장된 테마</p>
    <p class="tp__value" id="tpValue">밝게</p>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('tp');
  var track = document.getElementById('tpTrack');
  var knob = document.getElementById('tpKnob');
  var card = document.getElementById('tpCard');
  var valueEl = document.getElementById('tpValue');
  var KEY = 'demo-348-theme';
  var dark = false;
  var autoplay = null;

  // 계산 겹: 트랙·놉의 실측 사각형에서 이동 거리를 다시 구해 --x 로 옮긴다(고정 % 아님).
  // 값을 켤 때마다 localStorage 에 적어 다음 로드 때 같은 값을 복원할 수 있게 한다.
  function place() {
    var trackRect = track.getBoundingClientRect();
    var knobRect = knob.getBoundingClientRect();
    var travel = trackRect.width - knobRect.width - 6;
    knob.style.setProperty('--x', (dark ? travel : 0).toFixed(1) + 'px');
  }

  function apply(next, persist) {
    dark = next;
    track.setAttribute('aria-pressed', String(dark));
    card.setAttribute('data-theme', dark ? 'dark' : 'light');
    valueEl.textContent = dark ? '어둡게' : '밝게';
    place();
    if (persist) {
      try { window.localStorage.setItem(KEY, dark ? 'dark' : 'light'); } catch (err) { /* 무시 */ }
    }
  }

  try {
    var saved = window.localStorage.getItem(KEY);
    if (saved === 'dark') { apply(true, false); } else { apply(false, false); }
  } catch (err) { apply(false, false); }

  track.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    apply(!dark, true);
  });

  window.addEventListener('resize', place);

  function stopAutoplay() { if (autoplay) { clearInterval(autoplay); autoplay = null; } }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplay = setInterval(function () { apply(!dark, true); }, 620);
  }
})();
</script>
</body>
</html>
