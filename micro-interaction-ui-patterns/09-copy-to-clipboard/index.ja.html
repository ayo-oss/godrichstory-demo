<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コード行範囲のコピー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cc is-demo" id="cc">
  <div class="cc__code" id="ccCode">
    <div class="cc__row"><button class="cc__num" type="button" data-n="1">1</button><span class="cc__line">const x = 1;</span></div>
    <div class="cc__row"><button class="cc__num" type="button" data-n="2">2</button><span class="cc__line">const y = 2;</span></div>
    <div class="cc__row"><button class="cc__num" type="button" data-n="3">3</button><span class="cc__line">const z = x + y;</span></div>
    <div class="cc__row"><button class="cc__num" type="button" data-n="4">4</button><span class="cc__line">return z;</span></div>
    <span class="cc__sweep" id="ccSweep"></span>
  </div>
  <button class="cc__label" id="ccLabel" type="button">範囲を選択するとコピーされます</button>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('cc');
  var nums = Array.prototype.slice.call(document.querySelectorAll('.cc__num'));
  var sweep = document.getElementById('ccSweep');
  var label = document.getElementById('ccLabel');
  var LINE_H = 22;
  var anchor = null;
  var resetTimer = null;
  var autoplay = null;

  // 계산 겹: 시작 줄과 끝 줄 값의 차이로 범위 높이·위치를 다시 구해 sweep 을 그 자리에 놓는다.
  // 실 클립보드 API 는 호출하지 않고 복사 성공 상태만 라벨 전환으로 흉내낸다.
  function range(a, b) {
    var lo = Math.min(a, b);
    var hi = Math.max(a, b);
    return { top: (lo - 1) * LINE_H, height: (hi - lo + 1) * LINE_H, lo: lo, hi: hi };
  }

  function select(startN, endN) {
    var r = range(startN, endN);
    sweep.style.setProperty('--top', r.top + 'px');
    sweep.style.setProperty('--h', r.height + 'px');
    sweep.classList.add('cc__sweep--on');
    nums.forEach(function (btn) {
      var n = Number(btn.getAttribute('data-n'));
      btn.classList.toggle('cc__num--sel', n >= r.lo && n <= r.hi);
    });
    label.textContent = r.lo + '-' + r.hi + '行コピー済み';
    label.classList.add('cc__label--done');
    clearTimeout(resetTimer);
    resetTimer = setTimeout(function () {
      label.textContent = '範囲を選択するとコピーされます';
      label.classList.remove('cc__label--done');
    }, 900);
  }

  nums.forEach(function (btn) {
    btn.addEventListener('click', function () {
      root.classList.remove('is-demo');
      stopAutoplay();
      var n = Number(btn.getAttribute('data-n'));
      if (anchor === null) { anchor = n; select(n, n); }
      else { select(anchor, n); anchor = null; }
    });
  });

  function stopAutoplay() { if (autoplay) { clearInterval(autoplay); autoplay = null; } }

  var script = [[1, 1], [2, 3], [1, 4]];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    var i = 0;
    autoplay = setInterval(function () {
      var pair = script[i % script.length];
      select(pair[0], pair[1]);
      i += 1;
    }, 680);
  }
})();
</script>
</body>
</html>
