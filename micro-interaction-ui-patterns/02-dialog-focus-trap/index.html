<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다이얼로그 포커스 트랩 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ft is-demo" id="ft">
  <button class="ft__open" id="ftOpen" type="button">모달 열기</button>
  <div class="ft__overlay" id="ftOverlay" hidden>
    <div class="ft__dialog" role="dialog" aria-modal="true" aria-label="설정 확인" id="ftDialog">
      <div class="ft__marker" id="ftMarker" style="--i: 0" aria-hidden="true"></div>
      <button class="ft__field" data-f type="button">알림 켜기</button>
      <button class="ft__field" data-f type="button">공유 허용</button>
      <button class="ft__field ft__close" data-f type="button" id="ftClose">닫기</button>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('ft');
  var openBtn = document.getElementById('ftOpen');
  var overlay = document.getElementById('ftOverlay');
  var dialog = document.getElementById('ftDialog');
  var marker = document.getElementById('ftMarker');
  var closeBtn = document.getElementById('ftClose');
  var focusables = [];
  var index = 0;
  var autoplay = null;

  // 계산 겹: 열릴 때마다 탭 이동 가능한 요소 목록을 다시 구해 범위(0..len-1) 를 정하고,
  // 그 범위 밖으로 나가면 값이 되돌아 순환한다(모듈러 연산) — 고정 개수를 가정하지 않는다.
  function measure() {
    focusables = Array.prototype.slice.call(dialog.querySelectorAll('[data-f]'));
  }

  function setIndex(i) {
    var len = focusables.length;
    index = ((i % len) + len) % len;
    marker.style.setProperty('--i', String(index));
    focusables[index].focus({ preventScroll: true });
  }

  function open() {
    measure();
    overlay.hidden = false;
    setIndex(0);
  }

  function close() {
    overlay.hidden = true;
    openBtn.focus({ preventScroll: true });
  }

  openBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    open();
  });
  closeBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    close();
  });
  dialog.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { root.classList.remove('is-demo'); stopAutoplay(); close(); return; }
    if (e.key !== 'Tab') { return; }
    e.preventDefault();
    root.classList.remove('is-demo');
    stopAutoplay();
    setIndex(index + (e.shiftKey ? -1 : 1));
  });

  function stopAutoplay() {
    if (autoplay) { clearInterval(autoplay); autoplay = null; }
  }

  // 자동 루프 — 실사용과 같은 open()/setIndex()/close() 를 반복 호출한다
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    var step = 0;
    autoplay = setInterval(function () {
      if (overlay.hidden) { open(); step = 0; return; }
      step += 1;
      if (step > 4) { close(); return; }
      setIndex(index + 1);
    }, 420);
    open();
  }
})();
</script>
</body>
</html>
