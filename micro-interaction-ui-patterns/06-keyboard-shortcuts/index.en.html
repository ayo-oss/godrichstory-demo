<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyboard shortcuts — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ks is-demo" id="ks" tabindex="0">
  <p class="ks__cap">Try pressing it with the Ctrl key</p>
  <ul class="ks__hints" id="ksHints">
    <li class="ks__hint" data-combo="ctrl+s"><kbd>Ctrl</kbd><kbd>S</kbd><span>Save</span></li>
    <li class="ks__hint" data-combo="ctrl+f"><kbd>Ctrl</kbd><kbd>F</kbd><span>Find</span></li>
    <li class="ks__hint" data-combo="ctrl+d"><kbd>Ctrl</kbd><kbd>D</kbd><span>Duplicate</span></li>
  </ul>
  <p class="ks__result" id="ksResult" aria-live="polite">Waiting</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('ks');
  var hints = Array.prototype.slice.call(document.querySelectorAll('[data-combo]'));
  var result = document.getElementById('ksResult');
  var ACTIONS = { 'ctrl+s': 'Save triggered', 'ctrl+f': 'Find triggered', 'ctrl+d': 'Duplicate triggered' };
  var flashTimer = null;
  var resetTimer = null;
  var autoplay = null;

  // 계산 겹: 눌린 키에서 조합 값을 다시 구해(수정 키 + 글자 키) 등록된 목록과 매칭한다.
  // 각 단축키를 따로 처리하지 않고 하나의 값 비교 함수가 셋 다 판정한다.
  function combo(e) {
    var mod = e.ctrlKey || e.metaKey ? 'ctrl+' : '';
    return mod + String(e.key).toLowerCase();
  }

  function trigger(key) {
    var hit = hints.filter(function (h) { return h.getAttribute('data-combo') === key; })[0];
    if (!hit) { return; }
    hints.forEach(function (h) { h.classList.remove('ks__hint--hit'); });
    clearTimeout(flashTimer);
    clearTimeout(resetTimer);
    void hit.offsetWidth;
    hit.classList.add('ks__hint--hit');
    result.textContent = ACTIONS[key];
    resetTimer = setTimeout(function () {
      hit.classList.remove('ks__hint--hit');
      result.textContent = 'Waiting';
    }, 900);
  }

  root.addEventListener('keydown', function (e) {
    var key = combo(e);
    if (!ACTIONS[key]) { return; }
    e.preventDefault();
    root.classList.remove('is-demo');
    stopAutoplay();
    trigger(key);
  });

  function stopAutoplay() {
    if (autoplay) { clearInterval(autoplay); autoplay = null; }
  }

  var order = ['ctrl+s', 'ctrl+f', 'ctrl+d'];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    var i = 0;
    autoplay = setInterval(function () {
      trigger(order[i % order.length]);
      i += 1;
    }, 620);
  }
})();
</script>
</body>
</html>
