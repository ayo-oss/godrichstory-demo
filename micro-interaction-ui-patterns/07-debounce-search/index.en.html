<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debounced search — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="db is-demo" id="db">
  <div class="db__field">
    <input class="db__input" id="dbInput" type="text" value="" placeholder="Enter search term" aria-label="Search">
    <span class="db__bar" id="dbBar"></span>
  </div>
  <ul class="db__list" id="dbList"></ul>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('db');
  var input = document.getElementById('dbInput');
  var bar = document.getElementById('dbBar');
  var list = document.getElementById('dbList');
  var WAIT_MS = 480;
  var ITEMS = ['Apple pie recipe', 'Apple tree pests', 'Making apple juice', 'Banana smoothie', 'Baking banana bread'];
  var timer = null;
  var startedAt = 0;
  var raf = null;
  var autoplay = null;

  // 계산 겹: 입력 값이 바뀔 때마다 남은 대기 시간을 처음부터 다시 잰다(디바운스).
  // 진행 막대 폭은 실제 경과 시간 / WAIT_MS 비율로 매 프레임 다시 계산한다 — 고정 트랜지션이 아니다.
  function tick() {
    var elapsed = Date.now() - startedAt;
    var ratio = Math.min(1, elapsed / WAIT_MS);
    bar.style.setProperty('--r', ratio.toFixed(3));
    if (ratio < 1) { raf = requestAnimationFrame(tick); }
  }

  function search(value) {
    var q = value.trim().toLowerCase();
    var matched = q ? ITEMS.filter(function (t) { return t.toLowerCase().indexOf(q) !== -1; }) : [];
    list.innerHTML = '';
    matched.forEach(function (text) {
      var li = document.createElement('li');
      li.className = 'db__row';
      li.textContent = text;
      list.appendChild(li);
    });
    bar.style.setProperty('--r', '0');
  }

  function onInput(value) {
    input.value = value;
    startedAt = Date.now();
    bar.style.setProperty('--r', '0');
    if (raf) { cancelAnimationFrame(raf); }
    raf = requestAnimationFrame(tick);
    clearTimeout(timer);
    timer = setTimeout(function () { search(value); }, WAIT_MS);
  }

  input.addEventListener('input', function (e) {
    root.classList.remove('is-demo');
    stopAutoplay();
    onInput(e.target.value);
  });

  function stopAutoplay() { if (autoplay) { clearInterval(autoplay); autoplay = null; } }

  var script = ['A', 'Ap', 'Ap ', 'App'];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    var i = 0;
    autoplay = setInterval(function () {
      onInput(script[i % script.length]);
      i += 1;
    }, 640);
  }
})();
</script>
</body>
</html>
