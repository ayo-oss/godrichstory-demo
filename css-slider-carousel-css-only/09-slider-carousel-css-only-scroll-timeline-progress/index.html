<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll-linked progress bar — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sp is-demo">
    <div class="sp__bar"><div class="sp__fill"></div></div>
    <div class="sp__viewport">
      <div class="sp__track">
        <div class="sp__slide sp__slide--1"></div>
        <div class="sp__slide sp__slide--2"></div>
        <div class="sp__slide sp__slide--3"></div>
        <div class="sp__slide sp__slide--4"></div>
        <div class="sp__slide sp__slide--1" aria-hidden="true"></div>
        <div class="sp__slide sp__slide--2" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</main>
<script>
// 진행 바(.sp__fill)는 라디오도 JS 도 없이 animation-timeline 으로 실제 스크롤 위치를 그대로 읽는다(0줄).
// 슬라이드 트랙만 클릭·드래그 전까지 미리보기로 스스로 넘어간다 — 실제 스크롤은 그대로 살아있다.
document.querySelector('.sp__viewport').addEventListener('pointerdown', function () {
  document.querySelector('.sp').classList.remove('is-demo');
});
</script>
</body>
</html>
