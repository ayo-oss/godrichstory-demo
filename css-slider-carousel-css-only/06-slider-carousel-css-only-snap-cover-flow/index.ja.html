<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover-flow snap — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cf is-demo">
    <div class="cf__viewport">
      <div class="cf__track">
        <div class="cf__slide cf__slide--1"></div>
        <div class="cf__slide cf__slide--2"></div>
        <div class="cf__slide cf__slide--3"></div>
        <div class="cf__slide cf__slide--4"></div>
        <div class="cf__slide cf__slide--5"></div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작은 overflow-x:auto + scroll-snap-align: center + perspective 만으로 끝난다(0줄).
// 라디오·JS 로 "몇 번이 가운데인지" 고르지 않는다 — 카드는 자기 자리에서부터 이미 기울어 있고,
// 실제 드래그·스크롤이 그 카드를 가운데로 데려온다. 이 3줄은 미리보기 자동 재생만 멈춘다.
document.querySelector('.cf__viewport').addEventListener('pointerdown', function () {
  document.querySelector('.cf').classList.remove('is-demo');
});
</script>
</body>
</html>
