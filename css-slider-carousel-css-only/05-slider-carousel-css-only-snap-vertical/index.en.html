<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertical snap — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="vs is-demo">
    <div class="vs__viewport">
      <div class="vs__track">
        <section class="vs__slide vs__slide--1"><span class="vs__cap">01</span></section>
        <section class="vs__slide vs__slide--2"><span class="vs__cap">02</span></section>
        <section class="vs__slide vs__slide--3"><span class="vs__cap">03</span></section>
        <section class="vs__slide vs__slide--1" aria-hidden="true"><span class="vs__cap">01</span></section>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작은 overflow-y:auto + scroll-snap-type: y 만으로 끝난다(0줄).
// 이 3줄은 미리보기 자동 재생만 멈춘다.
document.querySelector('.vs__viewport').addEventListener('pointerdown', function () {
  document.querySelector('.vs').classList.remove('is-demo');
});
</script>
</body>
</html>
