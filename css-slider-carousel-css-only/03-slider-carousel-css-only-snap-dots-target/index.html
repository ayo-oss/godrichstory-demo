<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot nav via :target — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="dt is-demo">
    <div class="dt__viewport">
      <div class="dt__track">
        <section id="dt-s1" class="dt__slide dt__slide--1"></section>
        <section id="dt-s2" class="dt__slide dt__slide--2"></section>
        <section id="dt-s3" class="dt__slide dt__slide--3"></section>
        <section class="dt__slide dt__slide--1" aria-hidden="true"></section>
      </div>
    </div>
    <nav class="dt__dots">
      <a href="#dt-s1" class="dt__dot dt__dot--1" aria-label="슬라이드 1"></a>
      <a href="#dt-s2" class="dt__dot dt__dot--2" aria-label="슬라이드 2"></a>
      <a href="#dt-s3" class="dt__dot dt__dot--3" aria-label="슬라이드 3"></a>
    </nav>
  </div>
</main>
<script>
// 실제 동작은 <a href="#id"> + :target 만으로 끝난다(0줄) — 점을 누르면 주소창 #이 바뀌고
// 브라우저가 그 슬라이드를 스크롤 상자 안에서 화면에 맞춰 옮긴다.
// 이 3줄은 미리보기 자동 재생만 멈춘다.
document.querySelector('.dt__viewport').addEventListener('pointerdown', function () {
  document.querySelector('.dt').classList.remove('is-demo');
});
</script>
</body>
</html>
