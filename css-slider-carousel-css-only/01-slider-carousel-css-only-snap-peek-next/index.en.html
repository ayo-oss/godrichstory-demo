<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peek-next scroll-snap — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pn is-demo">
    <div class="pn__viewport">
      <div class="pn__track">
        <div class="pn__slide pn__slide--1"><span class="pn__cap">01</span></div>
        <div class="pn__slide pn__slide--2"><span class="pn__cap">02</span></div>
        <div class="pn__slide pn__slide--3"><span class="pn__cap">03</span></div>
        <div class="pn__slide pn__slide--4"><span class="pn__cap">04</span></div>
        <div class="pn__slide pn__slide--1" aria-hidden="true"><span class="pn__cap">01</span></div>
        <div class="pn__slide pn__slide--2" aria-hidden="true"><span class="pn__cap">02</span></div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작은 overflow-x:auto + scroll-snap-type + scroll-padding 만으로 끝난다(0줄).
// 이 3줄은 미리보기 자동 재생만 멈춘다 — 진짜 드래그·스크롤은 그대로 살아있다.
document.querySelector('.pn__viewport').addEventListener('pointerdown', function () {
  document.querySelector('.pn').classList.remove('is-demo');
});
</script>
</body>
</html>
