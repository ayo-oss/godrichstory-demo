<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio + arrow slider — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ra is-demo">
    <input type="radio" name="ra-tab" id="ra-1" class="ra__radio" checked>
    <input type="radio" name="ra-tab" id="ra-2" class="ra__radio">
    <input type="radio" name="ra-tab" id="ra-3" class="ra__radio">
    <div class="ra__viewport">
      <div class="ra__track">
        <div class="ra__slide ra__slide--1">
          <label class="ra__next" for="ra-2" aria-label="次のスライド">›</label>
        </div>
        <div class="ra__slide ra__slide--2">
          <label class="ra__prev" for="ra-1" aria-label="前のスライド">‹</label>
          <label class="ra__next" for="ra-3" aria-label="次のスライド">›</label>
        </div>
        <div class="ra__slide ra__slide--3">
          <label class="ra__prev" for="ra-2" aria-label="前のスライド">‹</label>
        </div>
        <div class="ra__slide ra__slide--1" aria-hidden="true">
          <span class="ra__next" aria-hidden="true">›</span>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작은 라디오 :checked + 형제결합자로 트랙을 미는 것만으로 끝난다(0줄).
// 이 3줄은 미리보기 자동 재생만 멈춘다.
document.querySelectorAll('.ra__radio, .ra__prev, .ra__next').forEach(function (el) {
  el.addEventListener('pointerdown', function () { document.querySelector('.ra').classList.remove('is-demo'); });
});
</script>
</body>
</html>
