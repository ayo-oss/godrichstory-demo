<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thumbnail-synced snap — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="tm is-demo">
    <div class="tm__viewport">
      <div class="tm__track">
        <section id="tm-s1" class="tm__slide tm__slide--1"></section>
        <section id="tm-s2" class="tm__slide tm__slide--2"></section>
        <section id="tm-s3" class="tm__slide tm__slide--3"></section>
        <section class="tm__slide tm__slide--1" aria-hidden="true"></section>
      </div>
    </div>
    <nav class="tm__thumbs">
      <a href="#tm-s1" class="tm__thumb tm__thumb--1" aria-label="슬라이드 1 썸네일"></a>
      <a href="#tm-s2" class="tm__thumb tm__thumb--2" aria-label="슬라이드 2 썸네일"></a>
      <a href="#tm-s3" class="tm__thumb tm__thumb--3" aria-label="슬라이드 3 썸네일"></a>
    </nav>
  </div>
</main>
<script>
// 실제 동작은 큰 슬라이드·작은 썸네일 둘 다 앵커 링크 + :target 만으로 끝난다(0줄 JS).
// 이 3줄은 미리보기 자동 재생만 멈춘다.
document.querySelector('.tm__viewport').addEventListener('pointerdown', function () {
  document.querySelector('.tm').classList.remove('is-demo');
});
</script>
</body>
</html>
