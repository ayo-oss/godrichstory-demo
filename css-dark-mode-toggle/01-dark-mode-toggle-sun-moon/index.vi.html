<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun/moon icon toggle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="panel">
    <div class="panel__face panel__face--light">
      <p class="panel__title">Cài đặt</p>
      <p class="panel__line"></p>
    </div>
    <div class="panel__face panel__face--dark">
      <p class="panel__title">Cài đặt</p>
      <p class="panel__line"></p>
    </div>
    <button class="toggle" type="button" aria-label="Chuyển chế độ tối">
      <span class="toggle__sun"></span>
      <span class="toggle__moon"></span>
    </button>
  </div>
</main>
</body>
</html>
