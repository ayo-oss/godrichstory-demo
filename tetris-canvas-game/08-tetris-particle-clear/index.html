<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클리어 파티클 — 지워진 칸이 조각나 흩어지는 연출 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pt" id="pt">
  <p class="pt__hint">칸마다 입자 여섯 개 · 속도·중력 적분</p>
  <div class="pt__row">
    <div class="pt__field" id="field" role="application" aria-label="클리어 파티클" tabindex="0">
      <canvas class="pt__cv" id="cv"></canvas>
    </div>
    <div class="pt__side">
      <b class="pt__n" id="pn" aria-live="polite">0</b>
      <span class="pt__unit">개 입자</span>
      <p class="pt__c">클리어 <b id="cn">0</b>줄</p>
      <div class="pt__sky" id="sky" role="img" aria-label="입자 흩어짐 궤적"><canvas id="scv"></canvas></div>
    </div>
  </div>
</div>
</main>
<script>
// 클리어 파티클 — 지워진 각 칸을 여섯 개의 작은 사각 입자로 바꾼다. 매 프레임
// v += g·dt (중력), p += v·dt (속도 적분) 로 움직인다 — 라이브러리 없는 순수 계산.
// 같은 격자 게임이지만 이번 항목의 주인공은 보드가 아니라 흩어지는 입자다.
(function () {
  var root = document.getElementById('pt');
  var field = document.getElementById('field');
  var cv = document.getElementById('cv');
  var sky = document.getElementById('sky');
  var scv = document.getElementById('scv');
  var pnEl = document.getElementById('pn');
  var cnEl = document.getElementById('cn');
  if (!root || !field || !cv || !sky || !scv || !pnEl || !cnEl) return;
  var ctx = cv.getContext('2d');
  var sctx = scv.getContext('2d');
  var css = getComputedStyle(root);
  function v(name) { return css.getPropertyValue(name).trim(); }
  var FILL = { I: v('--c-i'), O: v('--c-o'), T: v('--c-t'), S: v('--c-s'), Z: v('--c-z'), J: v('--c-j'), L: v('--c-l') };
  var EDGE = { I: v('--d-i'), O: v('--d-o'), T: v('--d-t'), S: v('--d-s'), Z: v('--d-z'), J: v('--d-j'), L: v('--d-l') };
  var LINE = v('--grid-line');
  var FLASH = v('--flash');

  var COLS = 10, ROWS = 12;
  var TYPES = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
  var SHAPES = {
    I: [[0, 1], [1, 1], [2, 1], [3, 1]],
    O: [[1, 1], [2, 1], [1, 2], [2, 2]],
    T: [[1, 0], [0, 1], [1, 1], [2, 1]],
    S: [[1, 0], [2, 0], [0, 1], [1, 1]],
    Z: [[0, 0], [1, 0], [1, 1], [2, 1]],
    J: [[0, 0], [0, 1], [1, 1], [2, 1]],
    L: [[2, 0], [0, 1], [1, 1], [2, 1]]
  };
  var BOX = { I: 4, O: 4, T: 3, S: 3, Z: 3, J: 3, L: 3 };
  var PER_CELL = 6;        // 칸마다 입자 수
  var GRAV = 30;           // 중력 (칸/s²)
  var LIFE = 1.1;          // 입자 수명 (초)

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(3308);

  function rotCW(cells, n) {
    var out = [];
    for (var i = 0; i < cells.length; i++) out.push([cells[i][1], n - 1 - cells[i][0]]);
    return out;
  }
  function hits(grid, cells, row, col) {
    for (var i = 0; i < cells.length; i++) {
      var x = col + cells[i][0], y = row + cells[i][1];
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }
  function emptyGrid() {
    var g = [];
    for (var y = 0; y < ROWS; y++) { g.push([]); for (var x = 0; x < COLS; x++) g[y].push(0); }
    return g;
  }
  function cloneGrid(g) {
    var o = [];
    for (var y = 0; y < ROWS; y++) o.push(g[y].slice());
    return o;
  }
  function shapeRot(t, r) {
    var c = SHAPES[t].map(function (p) { return p.slice(); }), n = BOX[t];
    for (var i = 0; i < r; i++) c = rotCW(c, n);
    return c;
  }
  function landingRow(grid, cells, col) {
    var row = -4;
    while (!hits(grid, cells, row + 1, col)) row += 1;
    return row;
  }
  function choose(grid, t) {
    var best = null;
    for (var r = 0; r < 4; r++) {
      var cells = shapeRot(t, r);
      for (var c = -2; c < COLS; c++) {
        if (hits(grid, cells, 0, c)) continue;
        var row = landingRow(grid, cells, c);
        if (row < 0) continue;
        var g2 = cloneGrid(grid);
        for (var i = 0; i < cells.length; i++) g2[row + cells[i][1]][c + cells[i][0]] = t;
        var full = 0, holes = 0;
        for (var y = 0; y < ROWS; y++) {
          var f = 0;
          for (var x = 0; x < COLS; x++) if (g2[y][x]) f += 1;
          if (f === COLS) full += 1;
        }
        for (var x2 = 0; x2 < COLS; x2++) {
          var seen = false;
          for (var y2 = 0; y2 < ROWS; y2++) { if (g2[y2][x2]) seen = true; else if (seen) holes += 1; }
        }
        var score = full * 1000 - holes * 800 - row;
        if (!best || score > best.score) best = { r: r, c: c, score: score };
      }
    }
    return best;
  }

  var grid = emptyGrid();
  for (var gy0 = ROWS - 5; gy0 < ROWS; gy0++) {
    var h0 = Math.floor(rnd() * COLS);
    for (var gx0 = 0; gx0 < COLS; gx0++) grid[gy0][gx0] = gx0 === h0 ? 0 : TYPES[Math.floor(rnd() * 7)];
  }

  var bag = [];
  function refill() {
    bag = TYPES.slice();
    for (var i = bag.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1)), tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp;
    }
  }
  refill();

  var particles = [];  // {x, y, vx, vy, t, c, sz}
  var trails = [];     // 하늘 궤적 {x, y, a}
  var clearedRows = 0, flashT = 0, flashRows = [];

  function burst(row, t) {
    // 한 칸 → 여섯 입자. 위치는 칸 안 무작위, 속도는 위쪽 반구로
    for (var k = 0; k < PER_CELL; k++) {
      particles.push({
        x: 0.15 + rnd() * 0.7, y: 0.15 + rnd() * 0.7,   // 칸 단위 상대 위치
        col: 0, row: row,
        vx: (rnd() - 0.5) * 9, vy: -3 - rnd() * 7,
        t: LIFE * (0.6 + rnd() * 0.4),
        c: k % 2 ? FILL[t] : EDGE[t],
        sz: 0.10 + rnd() * 0.16
      });
      particles[particles.length - 1].col = 0;
    }
  }

  var piece = null;
  function spawn() {
    if (!bag.length) refill();
    var t = bag.pop();
    var plan = choose(grid, t);
    if (!plan) { grid = emptyGrid(); plan = choose(grid, t); }
    piece = { t: t, r: 0, cells: SHAPES[t].slice(), x: 3, y: -0.4, plan: plan };
  }
  function lock() {
    var rx = Math.round(piece.x), ry = Math.floor(piece.y), dead = false;
    for (var i = 0; i < piece.cells.length; i++) {
      var gx = rx + piece.cells[i][0], gy = ry + piece.cells[i][1];
      if (gy < 0) { dead = true; break; }
      grid[gy][gx] = piece.t;
    }
    if (dead) grid = emptyGrid();
    else {
      flashRows = [];
      for (var y = 0; y < ROWS; y++) {
        var n = 0;
        for (var x = 0; x < COLS; x++) if (grid[y][x]) n += 1;
        if (n === COLS) flashRows.push(y);
      }
      if (flashRows.length) {
        // 칸 → 입자 폭발
        for (var f = 0; f < flashRows.length; f++) {
          for (var x2 = 0; x2 < COLS; x2++) {
            var t2 = grid[flashRows[f]][x2];
            for (var k = 0; k < PER_CELL; k++) {
              particles.push({
                x: x2 + 0.15 + rnd() * 0.7, y: flashRows[f] + 0.15 + rnd() * 0.7,
                vx: (rnd() - 0.5) * 10, vy: -2 - rnd() * 8,
                t: LIFE * (0.6 + rnd() * 0.4),
                c: k % 2 ? FILL[t2] : EDGE[t2],
                sz: 0.10 + rnd() * 0.16
              });
            }
          }
        }
        clearedRows += flashRows.length;
        cnEl.textContent = String(clearedRows);
        flashT = 0.14;
      }
    }
    piece = null;
  }
  function spliceRows() {
    flashRows.sort(function (a, b) { return a - b; });
    for (var i = 0; i < flashRows.length; i++) {
      grid.splice(flashRows[i], 1);
      grid.unshift(new Array(COLS).fill(0));
    }
    flashRows = [];
    var filled = 0;
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) if (grid[y][x]) filled += 1;
    if (filled < COLS * 3) {
      for (var gy = ROWS - 4; gy < ROWS; gy++) {
        var h = Math.floor(rnd() * COLS);
        for (var gx = 0; gx < COLS; gx++) grid[gy][gx] = gx === h ? 0 : TYPES[Math.floor(rnd() * 7)];
      }
    }
  }

  var W = 0, H = 0, SW = 0, SH = 0, dpr = 1, cell = 8, ox = 0, oy = 0;
  function fit() {
    W = field.clientWidth; H = field.clientHeight;
    SW = sky.clientWidth; SH = sky.clientHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scv.width = Math.round(SW * dpr); scv.height = Math.round(SH * dpr);
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = Math.floor(Math.min(H / ROWS, W / COLS));
    ox = Math.floor((W - cell * COLS) / 2); oy = Math.floor((H - cell * ROWS) / 2);
  }
  function paintCell(gx, gy, t, alpha) {
    var r = Math.max(2, cell * 0.22);
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.beginPath();
    ctx.roundRect(ox + gx * cell + 1, oy + gy * cell + 1, cell - 2, cell - 2, r);
    ctx.fillStyle = FILL[t]; ctx.fill();
    ctx.lineWidth = Math.max(1, cell * 0.14);
    ctx.strokeStyle = EDGE[t]; ctx.stroke();
    ctx.globalAlpha = 1;
  }

  var last = 0, raf = 0;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = LINE; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x <= COLS; x++) { ctx.moveTo(ox + x * cell + .5, oy); ctx.lineTo(ox + x * cell + .5, oy + ROWS * cell); }
    for (var y = 0; y <= ROWS; y++) { ctx.moveTo(ox, oy + y * cell + .5); ctx.lineTo(ox + COLS * cell, oy + y * cell + .5); }
    ctx.stroke();
    for (var gy = 0; gy < ROWS; gy++) for (var gx = 0; gx < COLS; gx++) if (grid[gy][gx]) paintCell(gx, gy, grid[gy][gx]);
    if (flashT > 0) {
      ctx.globalAlpha = Math.min(1, flashT / 0.14) * 0.9;
      ctx.fillStyle = FLASH;
      for (var f = 0; f < flashRows.length; f++) ctx.fillRect(ox, oy + flashRows[f] * cell, cell * COLS, cell);
      ctx.globalAlpha = 1;
    }
    if (piece) {
      for (var i = 0; i < piece.cells.length; i++) {
        var cy = piece.y + piece.cells[i][1];
        if (cy >= 0) paintCell(Math.round(piece.x + piece.cells[i][0]), Math.round(cy), piece.t);
      }
    }
    // 입자 — 속도·중력 적분 결과
    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.min(1, pt.t / 0.3);
      ctx.fillStyle = pt.c;
      var s = pt.sz * cell;
      ctx.fillRect(ox + pt.x * cell - s / 2, oy + pt.y * cell - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    pnEl.textContent = String(particles.length);
  }
  function drawSky(dt) {
    if (!SW || !SH) return;
    // 흩어진 입자의 궤적 — 사그라드는 점
    sctx.clearRect(0, 0, SW, SH);
    for (var t2 = trails.length - 1; t2 >= 0; t2--) {
      var tr = trails[t2];
      tr.a -= dt / 1.0;
      if (tr.a <= 0) { trails.splice(t2, 1); continue; }
      sctx.globalAlpha = tr.a * 0.5;
      sctx.fillStyle = tr.c;
      sctx.fillRect(tr.x * SW - 1.5, tr.y * SH - 1.5, 3, 3);
    }
    sctx.globalAlpha = 1;
    if (trails.length > 400) trails.splice(0, trails.length - 400);
  }

  function step(now) {
    var dt = Math.min(64, now - last) / 1000; last = now;
    // 입자 적분 — v += g·dt, p += v·dt
    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.vy += GRAV * dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.t -= dt;
      if (pt.t <= 0 || pt.y > ROWS + 1) { particles.splice(p, 1); continue; }
      // 궤적 기록 (하늘 패널 좌표)
      if (Math.random() < 0.25) trails.push({ x: Math.min(1, Math.max(0, pt.x / COLS)), y: Math.min(1, Math.max(0, pt.y / ROWS)), a: 1, c: pt.c });
    }
    if (flashT > 0) {
      flashT -= dt;
      if (flashT <= 0) spliceRows();
    } else if (!piece) {
      spawn();
    } else {
      var dx = piece.plan.c - piece.x;
      piece.x += Math.max(-13 * dt, Math.min(13 * dt, dx));
      if (piece.r !== piece.plan.r && Math.abs(dx) < 0.6) {
        var rc = rotCW(piece.cells, BOX[piece.t]);
        if (!hits(grid, rc, Math.floor(piece.y), Math.round(piece.x))) { piece.cells = rc; piece.r = (piece.r + 1) % 4; }
        else piece.r = piece.plan.r;
      }
      var target = landingRow(grid, piece.cells, Math.round(piece.x));
      var aligned = Math.abs(dx) < 0.05 && piece.r === piece.plan.r;
      var ny = piece.y + (aligned ? 34 : 5) * dt;
      piece.y = ny >= target ? target : ny;
      if (piece.y === target) lock();
    }
    draw();
    drawSky(dt);
    raf = requestAnimationFrame(step);
  }

  field.addEventListener('pointerdown', function () {
    // 누르면 폭발 재현 — 아래쪽 두 줄을 강제로 터뜨린다
    for (var y = ROWS - 2; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var t2 = grid[y][x] || TYPES[Math.floor(rnd() * 7)];
        for (var k = 0; k < PER_CELL; k++) {
          particles.push({
            x: x + 0.2 + rnd() * 0.6, y: y + 0.2 + rnd() * 0.6,
            vx: (rnd() - 0.5) * 12, vy: -4 - rnd() * 8,
            t: LIFE * (0.7 + rnd() * 0.3),
            c: k % 2 ? FILL[t2] : EDGE[t2],
            sz: 0.10 + rnd() * 0.16
          });
        }
      }
      grid.splice(y, 1); grid.unshift(new Array(COLS).fill(0));
    }
    clearedRows += 2;
    cnEl.textContent = String(clearedRows);
  });
  window.addEventListener('resize', function () { fit(); if (reduce) { draw(); drawSky(0); } });
  fit();
  if (reduce) {
    // 정지 한 장 — 터진 직후의 입자 몇 개를 정적으로 보인다
    for (var k2 = 0; k2 < 30; k2++) {
      particles.push({ x: rnd() * COLS, y: 2 + rnd() * 4, vx: 0, vy: 0, t: 9, c: k2 % 2 ? FILL.T : EDGE.T, sz: 0.12 + rnd() * 0.1 });
    }
    draw(); drawSky(0);
    root.classList.add('is-still');
  } else {
    last = performance.now();
    raf = requestAnimationFrame(step);
  }
})();
</script>
</body>
</html>
