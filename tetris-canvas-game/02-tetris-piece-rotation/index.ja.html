<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일곱 조각과 회전 — 행렬 곱으로 도는 모양 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rt" id="rt">
  <p class="rt__hint">行列回転 (x,y) → (y,−x)</p>
  <div class="rt__row">
    <div class="rt__field" id="field" role="application" aria-label="回転実験盤" tabindex="0">
      <canvas class="rt__cv" id="cv"></canvas>
    </div>
    <div class="rt__side">
      <b class="rt__deg" id="deg" aria-live="polite">0度</b>
      <span class="rt__kick" id="kick">壁キック1マス</span>
      <b class="rt__count" id="count">0</b>
      <span class="rt__unit">回転</span>
      <p class="rt__tip">← → キーで直接回してみてください</p>
    </div>
  </div>
</div>
</main>
<script>
// 일곱 조각과 회전 — 조각을 좌표 배열로 두고 90도마다 (x,y)→(y,−x) 를 적용한다.
// 화면에는 그 사이를 메운다: 셀 좌표를 상자 중심 기준 극좌표로 바꿔 회전 행렬
// R(θ) = [cos −sin / sin cos] 를 매 프레임 곱해 셀이 원호를 그리며 돌게 한다.
// 돌린 결과가 상자(=벽) 밖으로 나가면 x 를 1マス 밀어 되돌린다 — 벽 킥.
(function () {
  var root = document.getElementById('rt');
  var field = document.getElementById('field');
  var cv = document.getElementById('cv');
  var degEl = document.getElementById('deg');
  var kickEl = document.getElementById('kick');
  var countEl = document.getElementById('count');
  if (!root || !field || !cv || !degEl || !kickEl || !countEl) return;
  var ctx = cv.getContext('2d');
  var css = getComputedStyle(root);
  function v(name) { return css.getPropertyValue(name).trim(); }
  var FILL = { I: v('--c-i'), O: v('--c-o'), T: v('--c-t'), S: v('--c-s'), Z: v('--c-z'), J: v('--c-j'), L: v('--c-l') };
  var EDGE = { I: v('--d-i'), O: v('--d-o'), T: v('--d-t'), S: v('--d-s'), Z: v('--d-z'), J: v('--d-j'), L: v('--d-l') };
  var LINE = v('--grid-line');
  var ARC = v('--arc');
  var KICKC = v('--kickc');

  var BOXN = 6;                 // 6×6 상자 — 회전 무대이자 벽
  var TYPES = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
  var SHAPES = {
    I: [[0, 1], [1, 1], [2, 1], [3, 1]],
    O: [[1, 1], [2, 1], [1, 2], [2, 2]],
    T: [[1, 0], [0, 1], [1, 1], [2, 1]],
    S: [[1, 0], [2, 0], [0, 1], [1, 1]],
    Z: [[0, 0], [1, 0], [1, 1], [2, 1]],
    J: [[0, 0], [0, 1], [1, 1], [2, 1]],
    L: [[2, 0], [0, 1], [1, 1], [2, 1]]
  };
  var BOX = { I: 4, O: 4, T: 3, S: 3, Z: 3, J: 3, L: 3 };
  var DEGS = ['0度', '90度', '180度', '270度'];

  // 회전 — (x,y) → (y,−x). n×n 상자 안으로 되돌리려면 y 에 n−1 을 더한다.
  // 이 식과 중심 기준 90度 회전 행렬은 같은 결과를 낸다 — 아래 보간이 그 증명이다
  function rotCW(cells, n) {
    var out = [];
    for (var i = 0; i < cells.length; i++) out.push([cells[i][1], n - 1 - cells[i][0]]);
    return out;
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(3302);

  // 상태 — 조각 · 회전 단계 · 보간 진행도 · 벽 킥
  var ti = 0;                   // TYPES 첨자
  var cells = SHAPES.T.slice(); // 현재 셀 좌표 (회전 적용된 판)
  var baseN = 3;                // 셀 좌표의 상자 크기 (BOX[T])
  var offX = 1, offY = 2;       // 6×6 상자 안 배치 오프셋
  var theta = 0;                // 보간 각도 (라디안)
  var spin = 0;                 // 회전 수
  var kickFlash = 0;            // 킥 표시 남는 시간 (초)
  var kickCount = 0;
  var HOLD = 0.18, TURN = 0.55; // 정지 시간 · 회전 보간 시간 (초)
  var phase = 'hold', phaseT = 0;
  var from = null;              // 회전 시작 시 셀 사본
  var trail = [];               // 잔상 {x, y, a} 상자 좌표 (연속)

  function nextPiece() {
    ti = (ti + 1) % TYPES.length;
    if (ti === 0) { // 한 바퀴 돌면 시작 위치를 시드로 다시 섞는다
      var j = Math.floor(rnd() * 4) + 1;
      offX = j; offY = Math.floor(rnd() * 2) + 1;
    } else { offX = 1 + Math.floor(rnd() * 2); offY = 1 + Math.floor(rnd() * 2); }
    cells = SHAPES[TYPES[ti]].slice();
    baseN = BOX[TYPES[ti]];
    theta = 0;
  }
  function startTurn() {
    from = cells.map(function (c) { return c.slice(); });
    phase = 'turn'; phaseT = 0; theta = 0;
  }
  function finishTurn() {
    var n = baseN;
    var rotated = rotCW(cells, n);
    // 벽 킥 — 돌린 결과가 상자 밖이면 1칸씩 밀어 되돌린다
    var minX = 9, maxX = -9;
    for (var i = 0; i < rotated.length; i++) {
      var x = rotated[i][0] + offX;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
    }
    var kick = 0;
    if (minX < 0) kick = -minX;
    if (maxX > BOXN - 1) kick = BOXN - 1 - maxX;
    if (kick !== 0) { offX += kick; kickFlash = 0.9; kickCount += 1; kickEl.textContent = '壁キック1マス'; }
    cells = rotated;
    theta = 0;
    spin += 1;
    degEl.textContent = DEGS[spin % 4];
    countEl.textContent = String(spin);
    phase = 'hold'; phaseT = 0;
    if (spin % 8 === 0) nextPiece();
  }

  var W = 0, H = 0, dpr = 1, cell = 8, ox = 0, oy = 0;
  function fit() {
    W = field.clientWidth; H = field.clientHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = Math.floor(Math.min(H, W) / BOXN);
    ox = Math.floor((W - cell * BOXN) / 2); oy = Math.floor((H - cell * BOXN) / 2);
  }

  // 보간 위치 — 셀을 상자 중심 기준 극좌표로 돌린다. R(θ) 행렬 곱 그 자체
  function cellPos(c, th) {
    var n = baseN, cx = (n - 1) / 2, cy = (n - 1) / 2;
    var dx = c[0] - cx, dy = c[1] - cy;
    var cos = Math.cos(th), sin = Math.sin(th);
    return [cx + dx * cos - dy * sin + offX, cy + dx * sin + dy * cos + offY];
  }

  function paint(px, py, t, alpha) {
    var r = Math.max(3, cell * 0.22);
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.beginPath();
    ctx.roundRect(ox + px * cell + 1.5, oy + py * cell + 1.5, cell - 3, cell - 3, r);
    ctx.fillStyle = FILL[t]; ctx.fill();
    ctx.lineWidth = Math.max(1.5, cell * 0.13);
    ctx.strokeStyle = EDGE[t]; ctx.stroke();
    ctx.globalAlpha = 1;
  }

  var last = 0, raf = 0;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function drawStatic() {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = LINE; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x <= BOXN; x++) { ctx.moveTo(ox + x * cell + .5, oy); ctx.lineTo(ox + x * cell + .5, oy + BOXN * cell); }
    for (var y = 0; y <= BOXN; y++) { ctx.moveTo(ox, oy + y * cell + .5); ctx.lineTo(ox + BOXN * cell, oy + y * cell + .5); }
    ctx.stroke();
    for (var i = 0; i < cells.length; i++) paint(cells[i][0] + offX, cells[i][1] + offY, TYPES[ti]);
    degEl.textContent = DEGS[spin % 4];
  }

  function step(now) {
    var dt = Math.min(64, now - last) / 1000; last = now;
    phaseT += dt;
    if (kickFlash > 0) kickFlash -= dt;

    var th = 0;
    if (phase === 'hold') {
      if (phaseT >= HOLD) startTurn();
    } else {
      var p = Math.min(1, phaseT / TURN);
      var ease = 1 - Math.pow(1 - p, 3); // ease-out — 손목 감각
      th = ease * Math.PI / 2;
      if (p >= 1) finishTurn();
    }
    // 그리기
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = LINE; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x <= BOXN; x++) { ctx.moveTo(ox + x * cell + .5, oy); ctx.lineTo(ox + x * cell + .5, oy + BOXN * cell); }
    for (var y = 0; y <= BOXN; y++) { ctx.moveTo(ox, oy + y * cell + .5); ctx.lineTo(ox + BOXN * cell, oy + y * cell + .5); }
    ctx.stroke();

    // 회전 궤적 — 셀마다 이번 회전의 원호를 옅게 먼저 그린다
    if (phase === 'turn' && from) {
      ctx.strokeStyle = ARC; ctx.lineWidth = 2;
      for (var i = 0; i < from.length; i++) {
        var p0 = cellPos(from[i], 0), p1 = cellPos(from[i], Math.PI / 2);
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.moveTo(ox + (p0[0] + .5) * cell, oy + (p0[1] + .5) * cell);
        ctx.arc(ox + (offX + (baseN - 1) / 2 + .5) * cell, oy + (offY + (baseN - 1) / 2 + .5) * cell,
                Math.hypot(p0[0] - offX - (baseN - 1) / 2, p0[1] - offY - (baseN - 1) / 2) * cell,
                Math.atan2(p0[1] - offY - (baseN - 1) / 2, p0[0] - offX - (baseN - 1) / 2),
                Math.atan2(p1[1] - offY - (baseN - 1) / 2, p1[0] - offX - (baseN - 1) / 2), false);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // 잔상 — 최근 0.8초의 셀 위치를 사그라들게 깔아 회전의 지나간 자리를 남긴다
    var cur = [];
    for (var c = 0; c < cells.length; c++) {
      var pos = (phase === 'turn' && from) ? cellPos(from[c], th) : [cells[c][0] + offX, cells[c][1] + offY];
      cur.push(pos);
    }
    for (var t2 = 0; t2 < trail.length; t2++) {
      var tr = trail[t2];
      tr.a -= dt / 0.8;
      if (tr.a <= 0) continue;
      ctx.globalAlpha = tr.a * 0.60;
      ctx.fillStyle = FILL[TYPES[ti]];
      ctx.beginPath();
      ctx.roundRect(ox + tr.x * cell + 3, oy + tr.y * cell + 3, cell - 6, cell - 6, Math.max(2, cell * 0.2));
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    trail = trail.filter(function (tr2) { return tr2.a > 0; });
    for (var k = 0; k < cur.length; k++) trail.push({ x: cur[k][0], y: cur[k][1], a: 0.8 });

    // 벽 킥 화살표 — 킥이 일어난 직후 0.9초
    if (kickFlash > 0) {
      ctx.globalAlpha = Math.min(1, kickFlash / 0.9);
      ctx.fillStyle = KICKC;
      var bx = ox + (offX - 0.9) * cell, by = oy + (offY + baseN + 0.3) * cell;
      if (by > H - cell * 0.8) by = H - cell * 0.8;
      ctx.beginPath();
      ctx.moveTo(bx, by); ctx.lineTo(bx + cell * 0.7, by - cell * 0.35); ctx.lineTo(bx + cell * 0.7, by + cell * 0.35);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
      kickEl.style.opacity = '1';
    } else {
      kickEl.style.opacity = '0';
    }

    // 회전 중심 — 상자 한가운데 작은 사각 마커. (x,y)→(y,−x) 의 기준점이다
    ctx.fillStyle = KICKC;
    ctx.globalAlpha = 0.8;
    var cx3 = ox + (offX + (baseN - 1) / 2 + .5) * cell, cy3 = oy + (offY + (baseN - 1) / 2 + .5) * cell;
    ctx.fillRect(cx3 - cell * 0.12, cy3 - cell * 0.12, cell * 0.24, cell * 0.24);
    ctx.globalAlpha = 1;

    // 조각 — 보간 각도로 그린다 (정지 때는 θ=0)
    for (var m = 0; m < cur.length; m++) paint(cur[m][0], cur[m][1], TYPES[ti]);

    raf = requestAnimationFrame(step);
  }

  // 키로 직접 회전 — keydown (← →)
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    if (phase !== 'hold') return;
    e.preventDefault();
    startTurn();
  });
  field.addEventListener('pointerdown', function () {
    if (phase === 'hold') startTurn();
  });
  window.addEventListener('resize', function () { fit(); if (reduce) drawStatic(); });
  fit();
  if (reduce) {
    // 정지 한 장 — 네 방향을 작은 글자로만 보인다
    drawStatic();
    root.classList.add('is-still');
  } else {
    last = performance.now();
    raf = requestAnimationFrame(step);
  }
})();
</script>
</body>
</html>
