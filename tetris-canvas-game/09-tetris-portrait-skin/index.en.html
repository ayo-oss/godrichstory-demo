<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스킨과 Best — Pastel 팔레트로 완성하는 내 블록 퍼즐 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sk" id="sk">
  <p class="sk__hint">Finished block puzzle — pick a skin</p>
  <div class="sk__row">
    <div class="sk__field" id="field" role="application" aria-label="Finished block puzzle" tabindex="0">
      <canvas class="sk__cv" id="cv"></canvas>
    </div>
    <div class="sk__side">
      <b class="sk__title">Skin</b>
      <div class="sk__skins" id="skins"></div>
      <div class="sk__stats">
        <span class="sk__sLabel">Score</span>
        <b class="sk__score" id="score" aria-live="polite">0</b>
        <span class="sk__sLabel">Best</span>
        <b class="sk__best" id="best">0</b>
      </div>
      <p class="sk__gameover" id="go">Game over</p>
      <div class="sk__hist" id="hist" role="img" aria-label="Recent score trend"><canvas id="hcv"></canvas></div>
    </div>
  </div>
</div>
</main>
<script>
// 스킨과 Best — 지금까지 여덟 단계를 전부 합친 완성판. 일곱 조각의 빛깔 배정은
// Skin(세 가지 팔레트)으로 바꿀 수 있고, 최고점은 localStorage 에 남아 Next 방문에
// 이어진다. Board·회전·충돌·Clear·Score·홀드는 앞 단계의 코드가 그대로 돈다.
(function () {
  var root = document.getElementById('sk');
  var field = document.getElementById('field');
  var cv = document.getElementById('cv');
  var skinsEl = document.getElementById('skins');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var goEl = document.getElementById('go');
  var hist = document.getElementById('hist');
  var hcv = document.getElementById('hcv');
  if (!root || !field || !cv || !skinsEl || !scoreEl || !bestEl || !goEl || !hist || !hcv) return;
  var ctx = cv.getContext('2d');
  var hctx = hcv.getContext('2d');

  // Skin — CSS 변수로 정의된 세 팔레트 (Pastel 기본 · Night · Mono)
  var SKINS = ['pastel', 'night', 'mono'];
  var SKIN_NAMES = { pastel: 'Pastel', night: 'Night', mono: 'Mono' };
  var skinIdx = 0;
  var css = getComputedStyle(root);
  function v(name) { return css.getPropertyValue(name).trim(); }
  function readSkin(s) {
    // 스킨별 변수 — --p-{Skin}-{종류}
    var f = {}, e = {};
    var types = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
    for (var i = 0; i < types.length; i++) {
      f[types[i]] = v('--' + s + '-f-' + types[i].toLowerCase());
      e[types[i]] = v('--' + s + '-e-' + types[i].toLowerCase());
    }
    return { fill: f, edge: e, line: v('--' + s + '-line'), flash: v('--' + s + '-flash') };
  }
  var skin = null;
  function applySkin() { skin = readSkin(SKINS[skinIdx]); }

  var COLS = 10, ROWS = 16;
  var TYPES = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
  var SHAPES = {
    I: [[0, 1], [1, 1], [2, 1], [3, 1]],
    O: [[1, 1], [2, 1], [1, 2], [2, 2]],
    T: [[1, 0], [0, 1], [1, 1], [2, 1]],
    S: [[1, 0], [2, 0], [0, 1], [1, 1]],
    Z: [[0, 0], [1, 0], [1, 1], [2, 1]],
    J: [[0, 0], [0, 1], [1, 1], [2, 1]],
    L: [[2, 0], [0, 1], [1, 1], [2, 1]]
  };
  var BOX = { I: 4, O: 4, T: 3, S: 3, Z: 3, J: 3, L: 3 };
  var KICKS = [0, -1, 1, -2, 2];

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(3309);

  function rotCW(cells, n) {
    var out = [];
    for (var i = 0; i < cells.length; i++) out.push([cells[i][1], n - 1 - cells[i][0]]);
    return out;
  }
  function hits(grid, cells, row, col) {
    for (var i = 0; i < cells.length; i++) {
      var x = col + cells[i][0], y = row + cells[i][1];
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }
  function landingRow(grid, cells, col) {
    var row = -4;
    while (!hits(grid, cells, row + 1, col)) row += 1;
    return row;
  }
  function emptyGrid() {
    var g = [];
    for (var y = 0; y < ROWS; y++) { g.push([]); for (var x = 0; x < COLS; x++) g[y].push(0); }
    return g;
  }
  function cloneGrid(g) {
    var o = [];
    for (var y = 0; y < ROWS; y++) o.push(g[y].slice());
    return o;
  }
  function shapeRot(t, r) {
    var c = SHAPES[t].map(function (p) { return p.slice(); }), n = BOX[t];
    for (var i = 0; i < r; i++) c = rotCW(c, n);
    return c;
  }
  function choose(grid, t) {
    var best = null;
    for (var r = 0; r < 4; r++) {
      var cells = shapeRot(t, r);
      for (var c = -2; c < COLS; c++) {
        if (hits(grid, cells, 0, c)) continue;
        var row = landingRow(grid, cells, c);
        if (row < 0) continue;
        var g2 = cloneGrid(grid);
        for (var i = 0; i < cells.length; i++) g2[row + cells[i][1]][c + cells[i][0]] = t;
        var full = 0, holes = 0, agg = 0;
        for (var y = 0; y < ROWS; y++) {
          var f = 0;
          for (var x = 0; x < COLS; x++) if (g2[y][x]) f += 1;
          if (f === COLS) full += 1;
        }
        for (var x2 = 0; x2 < COLS; x2++) {
          var seen = false;
          for (var y2 = 0; y2 < ROWS; y2++) {
            if (g2[y2][x2]) { seen = true; agg += ROWS - y2; }
            else if (seen) holes += 1;
          }
        }
        var score = full * 120 - holes * 90 - agg * 2 + row;
        if (!best || score > best.score) best = { r: r, c: c, score: score };
      }
    }
    return best;
  }

  var grid = emptyGrid();
  for (var gy0 = ROWS - 4; gy0 < ROWS; gy0++) {
    var h0 = Math.floor(rnd() * COLS);
    for (var gx0 = 0; gx0 < COLS; gx0++) grid[gy0][gx0] = gx0 === h0 ? 0 : TYPES[Math.floor(rnd() * 7)];
  }

  var bag = [];
  function refill() {
    bag = TYPES.slice();
    for (var i = bag.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1)), tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp;
    }
  }
  refill();
  function nextType() { if (!bag.length) refill(); return bag.pop(); }

  // Score·Best — localStorage
  var BEST_KEY = 'p330-09-best';
  var SKIN_KEY = 'p330-09-skin';
  var score = 0, best = 0;
  try {
    best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;
    var sv = parseInt(localStorage.getItem(SKIN_KEY) || '0', 10) || 0;
    if (sv >= 0 && sv < SKINS.length) skinIdx = sv;
  } catch (e) { /* 저장 실패는 무시 */ }
  bestEl.textContent = String(best);
  function saveBest() {
    if (score > best) {
      best = score;
      bestEl.textContent = String(best);
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* 무시 */ }
    }
  }
  function saveSkin() {
    try { localStorage.setItem(SKIN_KEY, String(skinIdx)); } catch (e) { /* 무시 */ }
  }

  var piece = null, flashRows = [], flashT = 0, over = false;
  var scoreHistory = [];
  function spawn() {
    var t = nextType();
    var plan = choose(grid, t);
    if (!plan) { over = true; goEl.classList.add('is-on'); return; }
    piece = { t: t, r: 0, cells: SHAPES[t].slice(), x: 3, y: -0.4, plan: plan };
  }
  function lock() {
    var rx = Math.round(piece.x), ry = Math.floor(piece.y), dead = false;
    for (var i = 0; i < piece.cells.length; i++) {
      var gx = rx + piece.cells[i][0], gy = ry + piece.cells[i][1];
      if (gy < 0) { dead = true; break; }
      grid[gy][gx] = piece.t;
    }
    if (dead) { grid = emptyGrid(); piece = null; return; } // 판이 넘으면 리셋하고 계속 — 데모는 멈추지 않는다
    flashRows = [];
    for (var y = 0; y < ROWS; y++) {
      var n = 0;
      for (var x = 0; x < COLS; x++) if (grid[y][x]) n += 1;
      if (n === COLS) flashRows.push(y);
    }
    if (flashRows.length) {
      score += 100 * flashRows.length * flashRows.length;
      scoreEl.textContent = String(score);
      scoreHistory.push(score);
      if (scoreHistory.length > 30) scoreHistory.shift();
      saveBest();
      flashT = 0.16;
    }
    piece = null;
  }
  function spliceRows() {
    flashRows.sort(function (a, b) { return a - b; });
    for (var i = 0; i < flashRows.length; i++) {
      grid.splice(flashRows[i], 1);
      grid.unshift(new Array(COLS).fill(0));
    }
    flashRows = [];
    var filled = 0;
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) if (grid[y][x]) filled += 1;
    if (filled < COLS * 2) {
      for (var gy = ROWS - 3; gy < ROWS; gy++) {
        var h = Math.floor(rnd() * COLS);
        for (var gx = 0; gx < COLS; gx++) grid[gy][gx] = gx === h ? 0 : TYPES[Math.floor(rnd() * 7)];
      }
    }
  }
  function restart() {
    grid = emptyGrid();
    score = 0; over = false;
    scoreEl.textContent = '0';
    goEl.classList.remove('is-on');
    spawn();
  }

  // Skin 버튼
  var skinBtns = [];
  for (var sb = 0; sb < SKINS.length; sb++) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'sk__skinBtn';
    b.textContent = SKIN_NAMES[SKINS[sb]];
    b.setAttribute('aria-pressed', sb === skinIdx ? 'true' : 'false');
    (function (idx) {
      b.addEventListener('click', function () {
        skinIdx = idx;
        for (var k = 0; k < skinBtns.length; k++) skinBtns[k].setAttribute('aria-pressed', k === idx ? 'true' : 'false');
        applySkin();
        saveSkin();
      });
    })(sb);
    skinsEl.appendChild(b);
    skinBtns.push(b);
  }
  applySkin();

  var W = 0, H = 0, HW2 = 0, HH2 = 0, dpr = 1, cell = 8, ox = 0, oy = 0;
  function fit() {
    W = field.clientWidth; H = field.clientHeight;
    HW2 = hist.clientWidth; HH2 = hist.clientHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    hcv.width = Math.round(HW2 * dpr); hcv.height = Math.round(HH2 * dpr);
    hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = Math.floor(Math.min(H / ROWS, W / COLS));
    ox = Math.floor((W - cell * COLS) / 2); oy = Math.floor((H - cell * ROWS) / 2);
  }
  function paintCell(gx, gy, t, alpha) {
    var r = Math.max(2, cell * 0.22);
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.beginPath();
    ctx.roundRect(ox + gx * cell + 1, oy + gy * cell + 1, cell - 2, cell - 2, r);
    ctx.fillStyle = skin.fill[t]; ctx.fill();
    ctx.lineWidth = Math.max(1, cell * 0.14);
    ctx.strokeStyle = skin.edge[t]; ctx.stroke();
    ctx.globalAlpha = 1;
  }

  var last = 0, raf = 0;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = skin.line; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x <= COLS; x++) { ctx.moveTo(ox + x * cell + .5, oy); ctx.lineTo(ox + x * cell + .5, oy + ROWS * cell); }
    for (var y = 0; y <= ROWS; y++) { ctx.moveTo(ox, oy + y * cell + .5); ctx.lineTo(ox + COLS * cell, oy + y * cell + .5); }
    ctx.stroke();
    for (var gy = 0; gy < ROWS; gy++) for (var gx = 0; gx < COLS; gx++) if (grid[gy][gx]) paintCell(gx, gy, grid[gy][gx]);
    if (flashT > 0) {
      ctx.globalAlpha = Math.min(1, flashT / 0.16) * 0.85;
      ctx.fillStyle = skin.flash;
      for (var f = 0; f < flashRows.length; f++) ctx.fillRect(ox, oy + flashRows[f] * cell, cell * COLS, cell);
      ctx.globalAlpha = 1;
    }
    if (piece) {
      // 고스트
      var px = Math.round(piece.x);
      var lr = landingRow(grid, piece.cells, px);
      ctx.setLineDash([4, 3]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = skin.edge[piece.t];
      for (var g = 0; g < piece.cells.length; g++) {
        var gyy = lr + piece.cells[g][1];
        if (gyy >= 0 && gyy !== Math.floor(piece.y) + piece.cells[g][1]) {
          ctx.beginPath();
          ctx.roundRect(ox + (px + piece.cells[g][0]) * cell + 2.5, oy + gyy * cell + 2.5, cell - 5, cell - 5, Math.max(2, cell * 0.22));
          ctx.stroke();
        }
      }
      ctx.setLineDash([]);
      for (var i = 0; i < piece.cells.length; i++) {
        var cy = piece.y + piece.cells[i][1];
        if (cy >= 0) paintCell(px + piece.cells[i][0], Math.round(cy), piece.t);
      }
    }
  }
  function drawHist() {
    if (!HW2 || !HH2) return;
    hctx.clearRect(0, 0, HW2, HH2);
    if (scoreHistory.length < 2) return;
    var max = scoreHistory[scoreHistory.length - 1] || 1;
    var bw = HW2 / (scoreHistory.length - 1);
    hctx.beginPath();
    for (var i = 0; i < scoreHistory.length; i++) {
      var yy = HH2 - (scoreHistory[i] / max) * (HH2 - 2) - 1;
      if (i === 0) hctx.moveTo(0, yy); else hctx.lineTo(i * bw, yy);
    }
    hctx.strokeStyle = skin.flash;
    hctx.lineWidth = 2;
    hctx.stroke();
  }

  function step(now) {
    var dt = Math.min(64, now - last) / 1000; last = now;
    if (over) { draw(); drawHist(); raf = requestAnimationFrame(step); return; }
    if (flashT > 0) {
      flashT -= dt;
      if (flashT <= 0) spliceRows();
    } else if (!piece) {
      spawn();
    } else {
      var dx = piece.plan.c - piece.x;
      piece.x += Math.max(-13 * dt, Math.min(13 * dt, dx));
      if (piece.r !== piece.plan.r && Math.abs(dx) < 0.6) {
        var rc = rotCW(piece.cells, BOX[piece.t]);
        var px3 = Math.round(piece.x);
        for (var k = 0; k < KICKS.length && hits(grid, rc, Math.floor(piece.y), px3 + KICKS[k]); k++) { /* 킥 탐색 */ }
        if (k < KICKS.length) { piece.cells = rc; piece.x = px3 + KICKS[k]; piece.r = (piece.r + 1) % 4; }
        else piece.r = piece.plan.r;
      }
      var target = landingRow(grid, piece.cells, Math.round(piece.x));
      var aligned = Math.abs(dx) < 0.05 && piece.r === piece.plan.r;
      var ny = piece.y + (aligned ? 34 : 5) * dt;
      piece.y = ny >= target ? target : ny;
      if (piece.y === target) lock();
    }
    draw();
    drawHist();
    raf = requestAnimationFrame(step);
  }

  field.addEventListener('pointerdown', function () {
    if (over) { restart(); return; }
    if (piece) {
      piece.x = piece.plan.c;
      piece.cells = shapeRot(piece.t, piece.plan.r);
      piece.r = piece.plan.r;
      piece.y = landingRow(grid, piece.cells, Math.round(piece.x));
      lock();
    }
  });
  window.addEventListener('resize', function () { fit(); if (reduce) { draw(); drawHist(); } });
  fit();
  if (reduce) {
    // 정지 한 장 — Skin·Score·고스트가 다 보이는 상태
    score = 1900; scoreEl.textContent = String(score);
    scoreHistory = [100, 500, 500, 1400, 1900];
    piece = { t: 'L', r: 0, cells: SHAPES.L.slice(), x: 4, y: 4.0, plan: { r: 0, c: 4 } };
    draw(); drawHist();
    root.classList.add('is-still');
  } else {
    spawn();
    last = performance.now();
    raf = requestAnimationFrame(step);
  }
})();
</script>
</body>
</html>
