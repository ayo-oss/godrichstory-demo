<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line clear — 꽉 찬 줄을 찾아 지우고 무너뜨리기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lc" id="lc">
  <p class="lc__hint">Only rows with zero empty cells clear</p>
  <div class="lc__row">
    <div class="lc__field" id="field" role="application" aria-label="Line clear" tabindex="0">
      <canvas class="lc__cv" id="cv"></canvas>
    </div>
    <div class="lc__side">
      <b class="lc__count" id="count" aria-live="polite">0</b>
      <span class="lc__unit">lines cleared</span>
      <div class="lc__bars" id="bars" role="img" aria-label="Filled cells per row"><canvas id="bcv"></canvas></div>
    </div>
  </div>
</div>
</main>
<script>
// Line clear — 매 프레임 (1) 조각을 내리고 (2) 잠근 뒤 줄마다 빈 cells 수를 세어
// 0개인 줄만 골라 (3) 0.18초 섬광 뒤 splice 로 자르고 (4) 위 cells 전체를 한 칸씩
// 떨어뜨린다. 붕괴는 그 자체가 계산이다 — 배열이 한 칸씩 밀리며 화면 절반이 바뀐다.
(function () {
  var root = document.getElementById('lc');
  var field = document.getElementById('field');
  var cv = document.getElementById('cv');
  var bars = document.getElementById('bars');
  var bcv = document.getElementById('bcv');
  var countEl = document.getElementById('count');
  if (!root || !field || !cv || !bars || !bcv || !countEl) return;
  var ctx = cv.getContext('2d');
  var ctx2 = bcv.getContext('2d');
  var css = getComputedStyle(root);
  function v(name) { return css.getPropertyValue(name).trim(); }
  var FILL = { I: v('--c-i'), O: v('--c-o'), T: v('--c-t'), S: v('--c-s'), Z: v('--c-z'), J: v('--c-j'), L: v('--c-l') };
  var EDGE = { I: v('--d-i'), O: v('--d-o'), T: v('--d-t'), S: v('--d-s'), Z: v('--d-z'), J: v('--d-j'), L: v('--d-l') };
  var LINE = v('--grid-line');
  var FLASH = v('--flash');
  var BAR = v('--bar');

  var COLS = 10, ROWS = 16;
  var TYPES = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
  var SHAPES = {
    I: [[0, 1], [1, 1], [2, 1], [3, 1]],
    O: [[1, 1], [2, 1], [1, 2], [2, 2]],
    T: [[1, 0], [0, 1], [1, 1], [2, 1]],
    S: [[1, 0], [2, 0], [0, 1], [1, 1]],
    Z: [[0, 0], [1, 0], [1, 1], [2, 1]],
    J: [[0, 0], [0, 1], [1, 1], [2, 1]],
    L: [[2, 0], [0, 1], [1, 1], [2, 1]]
  };
  var BOX = { I: 4, O: 4, T: 3, S: 3, Z: 3, J: 3, L: 3 };

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(3303);

  function rotCW(cells, n) {
    var out = [];
    for (var i = 0; i < cells.length; i++) out.push([cells[i][1], n - 1 - cells[i][0]]);
    return out;
  }
  function hits(grid, cells, row, col) {
    for (var i = 0; i < cells.length; i++) {
      var x = col + cells[i][0], y = row + cells[i][1];
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }
  function emptyGrid() {
    var g = [];
    for (var y = 0; y < ROWS; y++) { g.push([]); for (var x = 0; x < COLS; x++) g[y].push(0); }
    return g;
  }

  // 시작 쓰레기 — 아래 6lines, 줄마다 구멍 1cells. 클리어가 곧바로 일어나는 높이
  var grid = emptyGrid();
  for (var gy = ROWS - 6; gy < ROWS; gy++) {
    var h1 = Math.floor(rnd() * COLS);
    for (var gx = 0; gx < COLS; gx++) grid[gy][gx] = gx === h1 ? 0 : TYPES[Math.floor(rnd() * 7)];
  }

  var bag = [];
  function refill() {
    bag = TYPES.slice();
    for (var i = bag.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1)), tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp;
    }
  }
  refill();
  function nextType() { if (!bag.length) refill(); return bag.pop(); }

  // 상태
  var piece = null;            // {t, cells, x, y}
  var flashRows = [], flashT = 0;
  var dropY = 0;               // 붕괴 애니메이션 — 위 칸이 내려오는 중인 픽셀 오프셋(cells)
  var cleared = 0;
  var FLASH_S = 0.18, DROP_S = 0.12; // 섬광 시간 · 붕괴 시간 (초)
  var restT = 0;

  function spawn() {
    var t = nextType();
    piece = { t: t, cells: SHAPES[t].slice(), x: 2 + Math.floor(rnd() * (COLS - 4)), y: -0.6, drop: 16 };
    restT = 0;
  }
  function lock() {
    var rx = Math.round(piece.x), ry = Math.floor(piece.y), dead = false;
    for (var i = 0; i < piece.cells.length; i++) {
      var gx = rx + piece.cells[i][0], gy = ry + piece.cells[i][1];
      if (gy < 0) { dead = true; break; }
      grid[gy][gx] = piece.t;
    }
    if (dead) { grid = emptyGrid(); }
    else {
      // lines 검사 — 빈 cells 0개인 줄만
      flashRows = [];
      for (var y = 0; y < ROWS; y++) {
        var n = 0;
        for (var x = 0; x < COLS; x++) if (grid[y][x]) n += 1;
        if (n === COLS) flashRows.push(y);
      }
      if (flashRows.length) { flashT = FLASH_S; }
    }
    piece = null;
  }
  function spliceRows() {
    flashRows.sort(function (a, b) { return a - b; });
    cleared += flashRows.length;
    countEl.textContent = String(cleared);
    for (var i = 0; i < flashRows.length; i++) {
      grid.splice(flashRows[i], 1);
      grid.unshift(new Array(COLS).fill(0));
    }
    // 쓰레기 보충 — 판이 비면 다시 아래쪽에 구멍진 줄을 넣어 클리어가 계속 일어나게
    var filled = 0;
    for (var y2 = 0; y2 < ROWS; y2++) for (var x2 = 0; x2 < COLS; x2++) if (grid[y2][x2]) filled += 1;
    if (filled < COLS * 3) {
      for (var gy2 = ROWS - 4; gy2 < ROWS; gy2++) {
        var h1 = Math.floor(rnd() * COLS);
        for (var gx2 = 0; gx2 < COLS; gx2++) grid[gy2][gx2] = gx2 === h1 ? 0 : TYPES[Math.floor(rnd() * 7)];
      }
    }
    flashRows = [];
    dropY = 1; // 붕괴 시각 — 위 칸이 한 cells 내려오는 동안
  }

  var W = 0, H = 0, BW = 0, BH = 0, dpr = 1, cell = 8, ox = 0, oy = 0;
  function fit() {
    W = field.clientWidth; H = field.clientHeight;
    BW = bars.clientWidth; BH = bars.clientHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bcv.width = Math.round(BW * dpr); bcv.height = Math.round(BH * dpr);
    ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = Math.floor(Math.min(H / ROWS, W / COLS));
    ox = Math.floor((W - cell * COLS) / 2); oy = Math.floor((H - cell * ROWS) / 2);
  }
  function paintCell(px, py, t, alpha) {
    var r = Math.max(2, cell * 0.22);
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.beginPath();
    ctx.roundRect(px + 1, py + 1, cell - 2, cell - 2, r);
    ctx.fillStyle = FILL[t]; ctx.fill();
    ctx.lineWidth = Math.max(1, cell * 0.14);
    ctx.strokeStyle = EDGE[t]; ctx.stroke();
    ctx.globalAlpha = 1;
  }

  var last = 0, raf = 0, waitT = 0;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw(fallOff) {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = LINE; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x <= COLS; x++) { ctx.moveTo(ox + x * cell + .5, oy); ctx.lineTo(ox + x * cell + .5, oy + ROWS * cell); }
    for (var y = 0; y <= ROWS; y++) { ctx.moveTo(ox, oy + y * cell + .5); ctx.lineTo(ox + COLS * cell, oy + y * cell + .5); }
    ctx.stroke();
    // 쌓인 cells — 붕괴 진행 중이면 잘린 lines 위쪽을 fallOff 칸만큼 내려 그린다
    for (var gy = 0; gy < ROWS; gy++) {
      var isFlash = flashRows.indexOf(gy) >= 0;
      var fy = gy;
      if (dropY > 0 && !isFlash) {
        // 잘린 lines 개수만큼 위 칸이 내려온다 — 간단히 전체를 fallOff 만큼
        fy = gy + fallOff;
      }
      for (var gx = 0; gx < COLS; gx++) {
        if (!grid[gy][gx]) continue;
        var py = oy + fy * cell;
        if (py < oy - cell) continue;
        paintCell(ox + gx * cell, Math.min(py, oy + (ROWS - 1) * cell), grid[gy][gx]);
      }
    }
    // 섬광 — 찢어지며 밝아진다
    if (flashT > 0) {
      ctx.globalAlpha = Math.min(1, flashT / FLASH_S) * 0.9;
      for (var f = 0; f < flashRows.length; f++) {
        ctx.fillStyle = FLASH;
        ctx.fillRect(ox, oy + flashRows[f] * cell, cell * COLS, cell);
      }
      ctx.globalAlpha = 1;
    }
    // 낙하 조각
    if (piece) {
      for (var i = 0; i < piece.cells.length; i++) {
        var cy = piece.y + piece.cells[i][1];
        if (cy >= 0) paintCell(ox + Math.round(piece.x + piece.cells[i][0]) * cell, oy + Math.round(cy) * cell, piece.t);
      }
    }
  }
  function drawBars() {
    if (!BW || !BH) return;
    ctx2.clearRect(0, 0, BW, BH);
    var rh = BH / ROWS;
    for (var y = 0; y < ROWS; y++) {
      var n = 0;
      for (var x = 0; x < COLS; x++) if (grid[y][x]) n += 1;
      if (!n) continue;
      ctx2.fillStyle = BAR;
      ctx2.globalAlpha = n === COLS ? 1 : 0.35 + 0.5 * (n / COLS);
      var bw2 = (n / COLS) * BW;
      ctx2.fillRect(0, y * rh + 1, bw2, rh - 2);
    }
    ctx2.globalAlpha = 1;
  }

  function step(now) {
    var dt = Math.min(64, now - last) / 1000; last = now;
    if (flashT > 0) {
      flashT -= dt;
      if (flashT <= 0) spliceRows();
    } else if (dropY > 0) {
      dropY = Math.max(0, dropY - dt / DROP_S);
      if (dropY === 0) waitT = 0.05;
    } else if (piece) {
      piece.y += piece.drop * dt;
      var rx = Math.round(piece.x), ry = Math.floor(piece.y) + 1;
      if (hits(grid, piece.cells, ry, rx)) {
        piece.y = ry - 1;
        lock();
      }
    } else {
      waitT -= dt;
      if (waitT <= 0) spawn();
    }
    draw(dropY > 0 ? dropY : 0);
    drawBars();
    raf = requestAnimationFrame(step);
  }

  field.addEventListener('pointerdown', function () {
    if (piece) { // 누르면 즉시 착지 — Clear 검사까지 한 번에
      while (!hits(grid, piece.cells, Math.floor(piece.y) + 1, Math.round(piece.x))) piece.y += 1;
      lock();
    }
  });
  window.addEventListener('resize', function () { fit(); if (reduce) { draw(0); drawBars(); } });
  fit();
  if (reduce) {
    // 정지 한 장 — Clear 직전 상태(한 줄만 구멍 1cells)를 보인다
    for (var x3 = 0; x3 < COLS; x3++) grid[ROWS - 3][x3] = TYPES[(x3 + 3) % 7];
    grid[ROWS - 3][2] = 0;
    draw(0); drawBars();
    root.classList.add('is-still');
  } else {
    spawn();
    last = performance.now();
    raf = requestAnimationFrame(step);
  }
})();
</script>
</body>
</html>
