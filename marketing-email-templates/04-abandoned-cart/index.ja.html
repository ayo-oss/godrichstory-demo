<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장바구니 리마인드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mk is-demo" id="mk">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="mk__table">
<tr><td align="center" class="mk__wrap">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="mk__card" style="max-width:400px">
<tr><td class="mk__brand">◆ Acme</td></tr>
<tr><td align="center" class="mk__hero">
  <span class="mk__badge" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="mk__ico"><path d="M232,72l-25.63,92.28A16,16,0,0,1,191,176H92.16a16,16,0,0,1-15.41-11.72L51.11,72Z" opacity="0.2"/><path d="M104,216a16,16,0,1,1-16-16A16,16,0,0,1,104,216Zm88-16a16,16,0,1,0,16,16A16,16,0,0,0,192,200ZM239.71,74.14l-25.64,92.28A24.06,24.06,0,0,1,191,184H92.16A24.06,24.06,0,0,1,69,166.42L33.92,40H16a8,8,0,0,1,0-16H40a8,8,0,0,1,7.71,5.86L57.19,64H232a8,8,0,0,1,7.71,10.14ZM221.47,80H61.64l22.81,82.14A8,8,0,0,0,92.16,168H191a8,8,0,0,0,7.71-5.86Z"/></svg></span>
</td></tr>
<tr><td align="center" class="mk__title">カートに残した商品が待っています</td></tr>
<tr><td align="center" class="mk__body">数量を変えると合計がすぐ追いつきます。</td></tr>
<tr><td class="mk__items">
  <div class="mk__item" data-price="28900">
    <span class="mk__thumb mk__thumba" aria-hidden="true"></span>
    <span class="mk__meta">
      <span class="mk__name">キッチンナイフスタンド</span>
      <span class="mk__opt">クリーム・1個入荷予定</span>
    </span>
    <span class="mk__qty">
      <button type="button" class="mk__step" data-dir="-1" aria-label="数量を減らす">−</button>
      <span class="mk__n">1</span>
      <button type="button" class="mk__step" data-dir="1" aria-label="数量を増やす">+</button>
    </span>
    <span class="mk__price" data-unit="28,900ウォン">28,900ウォン</span>
  </div>
  <div class="mk__item" data-price="12700">
    <span class="mk__thumb mk__thumbb" aria-hidden="true"></span>
    <span class="mk__meta">
      <span class="mk__name">リネンキッチンタオル3枚</span>
      <span class="mk__opt">グリーン・在庫4個</span>
    </span>
    <span class="mk__qty">
      <button type="button" class="mk__step" data-dir="-1" aria-label="数量を減らす">−</button>
      <span class="mk__n">1</span>
      <button type="button" class="mk__step" data-dir="1" aria-label="数量を増やす">+</button>
    </span>
    <span class="mk__price" data-unit="12,700ウォン">12,700ウォン</span>
  </div>
  <div class="mk__total">
    <span class="mk__totallabel">合計</span>
    <span class="mk__totalval">
      <span class="mk__t0">0ウォン</span>
      <span class="mk__t1" id="total">41,600ウォン</span>
    </span>
  </div>
</td></tr>
<tr><td align="center" class="mk__ctawrap"><a href="#" role="button" class="mk__cta">購入手続きへ</a></td></tr>
<tr><td align="center" class="mk__footer">Acme Inc・ソウル・ <a href="#" class="mk__unsub">配信停止</a></td></tr>
</table>
</td></tr>
</table>
</div>
</main>
<script>
var mk = document.getElementById('mk');
var total = document.getElementById('total');

// 금액 표기는 페이지 언어를 따라간다 (ko ウォン · en ₩ · ja ウォン) — 문구 사전이 바꾼 글자와 어긋나지 않게
function money(n) {
  var lang = document.documentElement.lang || 'ko';
  var digits = n.toLocaleString('ko-KR');
  if (lang === 'ja') { return digits + 'ウォン'; }
  if (lang === 'en') { return '₩' + digits; }
  return digits + 'ウォン';
}

function recompute() {
  var items = document.querySelectorAll('.mk__item');
  var sum = 0;
  for (var i = 0; i < items.length; i++) {
    var qty = parseInt(items[i].querySelector('.mk__n').textContent, 10) || 0;
    sum += qty * parseInt(items[i].getAttribute('data-price'), 10);
  }
  total.textContent = money(sum);
}

var steps = document.querySelectorAll('.mk__step');
for (var s = 0; s < steps.length; s++) {
  steps[s].addEventListener('click', function () {
    mk.classList.remove('is-demo');
    var item = this.closest('.mk__item');
    var n = item.querySelector('.mk__n');
    var next = (parseInt(n.textContent, 10) || 0) + parseInt(this.getAttribute('data-dir'), 10);
    if (next < 1) { next = 1; }
    if (next > 9) { next = 9; }
    n.textContent = String(next);
    item.querySelector('.mk__price').textContent = money(next * parseInt(item.getAttribute('data-price'), 10));
    recompute();
  });
}
</script>
</body>
</html>
