<tr><td align="center" class="mk__title">友達を招待して二人とも10,000ウォン</td></tr>

</main>
<script>
var mk = document.getElementById('mk');
var copybtn = document.getElementById('copybtn');
var live = document.getElementById('live');
copybtn.addEventListener('click', function () {
  mk.classList.remove('is-demo');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText('GODRICH-9K2F').then(function () {
      copybtn.textContent = 'コピーしました';
      live.textContent = 'コードをコピーしました';
    }, function () {
      live.textContent = 'コピー失敗 — コードを手動で選択してください';
    });
  }
});
</script>
