<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행사 초대 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mk is-demo" id="mk">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="mk__table">
<tr><td align="center" class="mk__wrap">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="mk__card" style="max-width:400px">
<tr><td class="mk__brand">◆ Acme</td></tr>
<tr><td class="mk__evrow">
  <div class="mk__datecard" aria-hidden="true">
    <span class="mk__month">9월</span>
    <span class="mk__day">24</span>
    <span class="mk__weekday">목요일</span>
  </div>
  <div class="mk__evinfo">
    <span class="mk__evtitle">가을 정기 모임, 두 번째</span>
    <span class="mk__meta">온라인 웨비나 · 19:30</span>
    <span class="mk__meta">발표 2편 + 질문 30분</span>
  </div>
</td></tr>
<tr><td class="mk__title">참석하시겠어요?</td></tr>
<tr><td align="center" class="mk__rsvp">
  <button type="button" class="mk__opt mk__yes" aria-pressed="false">
    <span class="mk__check" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="mk__ico"><path d="M232,56V200a16,16,0,0,1-16,16H40a16,16,0,0,1-16-16V56A16,16,0,0,1,40,40H216A16,16,0,0,1,232,56Z" opacity="0.2"/><path d="M205.66,85.66l-96,96a8,8,0,0,1-11.32,0l-40-40a8,8,0,0,1,11.32-11.32L104,164.69l90.34-90.35a8,8,0,0,1,11.32,11.32Z"/></svg></span>
    참석
  </button>
  <button type="button" class="mk__opt" aria-pressed="false">미정</button>
  <button type="button" class="mk__opt" aria-pressed="false">불참</button>
</td></tr>
<tr><td align="center" class="mk__body">누르면 답장으로 확정 링크를 보내드려요.</td></tr>
<tr><td align="center" class="mk__footer">Acme Inc · 서울 · <a href="#" class="mk__unsub">수신거부</a></td></tr>
</table>
</td></tr>
</table>
</div>
</main>
<script>
var mk = document.getElementById('mk');
var opts = document.querySelectorAll('.mk__opt');
for (var i = 0; i < opts.length; i++) {
  opts[i].addEventListener('click', function () {
    mk.classList.remove('is-demo');
    var on = this.classList.contains('is-on');
    for (var j = 0; j < opts.length; j++) {
      opts[j].classList.remove('is-on');
      opts[j].setAttribute('aria-pressed', 'false');
    }
    if (!on) {
      this.classList.add('is-on');
      this.setAttribute('aria-pressed', 'true');
    }
  });
}
</script>
</body>
</html>
