<script>
var mk = document.getElementById('mk');
var stars = document.querySelectorAll('.mk__star');
var thankline = document.getElementById('thankline');
for (var i = 0; i < stars.length; i++) {
  stars[i].addEventListener('click', function () {
    mk.classList.remove('is-demo');
    var idx = Array.prototype.indexOf.call(stars, this);
    for (var j = 0; j < stars.length; j++) {
      stars[j].classList.toggle('is-fill', j <= idx);
      stars[j].setAttribute('aria-checked', String(j === idx));
    }
    thankline.textContent = (idx + 1) + ' — thanks for rating!';
  });
}
</script>
