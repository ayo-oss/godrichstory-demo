<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타임세일 안내 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mk is-demo" id="mk">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="mk__table">
<tr><td align="center" class="mk__wrap">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="mk__card" style="max-width:400px">
<tr><td class="mk__brand">◆ Acme</td></tr>
<tr><td align="center" class="mk__hero">
  <span class="mk__badge" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="mk__ico"><path d="M216,136a88,88,0,1,1-88-88A88,88,0,0,1,216,136Z" opacity="0.2"/><path d="M128,40a96,96,0,1,0,96,96A96.11,96.11,0,0,0,128,40Zm0,176a80,80,0,1,1,80-80A80.09,80.09,0,0,1,128,216ZM173.66,90.34a8,8,0,0,1,0,11.32l-40,40a8,8,0,0,1-11.32-11.32l40-40A8,8,0,0,1,173.66,90.34ZM96,16a8,8,0,0,1,8-8h48a8,8,0,0,1,0,16H104A8,8,0,0,1,96,16Z"/></svg></span>
</td></tr>
<tr><td align="center" class="mk__title">Until midnight today — 24 hours sharp</td></tr>
<tr><td align="center" class="mk__body">Best sellers up to 40% off.</td></tr>
<tr><td class="mk__countrow">
  <div class="mk__count" role="timer" aria-label="5 hours 42 minutes 08 seconds left">
    <div class="mk__cell">
      <span class="mk__digits">05</span>
      <span class="mk__unit">HRS</span>
    </div>
    <span class="mk__colon" aria-hidden="true">:</span>
    <div class="mk__cell">
      <span class="mk__digits">42</span>
      <span class="mk__unit">MIN</span>
    </div>
    <span class="mk__colon" aria-hidden="true">:</span>
    <div class="mk__cell mk__cellsec">
      <span class="mk__digits" aria-hidden="true">
        <span class="mk__d1">08</span><span class="mk__d2">07</span><span class="mk__d3">06</span>
      </span>
      <span class="mk__unit">SEC</span>
    </div>
  </div>
  <div class="mk__bar" aria-hidden="true"><span class="mk__fill"></span></div>
</td></tr>
<tr><td align="center" class="mk__ctawrap">
  <a href="#" role="button" class="mk__cta">See the sale</a>
  <button type="button" class="mk__remind" id="remind" aria-pressed="false">Get deadline alerts</button>
</td></tr>
<tr><td align="center" class="mk__footer">Acme Inc · Seoul · <a href="#" class="mk__unsub">Unsubscribe</a></td></tr>
</table>
</td></tr>
</table>
</div>
</main>
<script>
var mk = document.getElementById('mk');
var remind = document.getElementById('remind');
remind.addEventListener('click', function () {
  mk.classList.remove('is-demo');
  var on = remind.classList.toggle('is-on');
  remind.setAttribute('aria-pressed', String(on));
  remind.textContent = on ? 'Alerts on' : 'Get deadline alerts';
});
</script>
</body>
</html>
