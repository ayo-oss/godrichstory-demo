<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이번 주 뉴스레터 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mk is-demo" id="mk">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="mk__table">
<tr><td align="center" class="mk__wrap">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="mk__card" style="max-width:400px">
<tr><td class="mk__brand">
  <span class="mk__brandmark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="mk__ico"><path d="M224,56l-96,88L32,56Z" opacity="0.2"/><path d="M224,48H32a8,8,0,0,0-8,8V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A8,8,0,0,0,224,48ZM203.43,64,128,133.15,52.57,64ZM216,192H40V74.19l82.59,75.71a8,8,0,0,0,10.82,0L216,74.19V192Z"/></svg></span>
  ◆ Acme 주간편지 <span class="mk__issue">59호</span>
</td></tr>
<tr><td class="mk__title">이번 주에 잘 읽힌 3편</td></tr>
<tr><td class="mk__sub">연 사람이 많은 순서로 담았어요.</td></tr>
<tr><td class="mk__rows">
  <button type="button" class="mk__row" aria-pressed="false">
    <span class="mk__num" aria-hidden="true">1</span>
    <span class="mk__head">굵은 글씨 하나로 화면 순서를 만드는 법</span>
    <span class="mk__time">6분</span>
  </button>
  <button type="button" class="mk__row" aria-pressed="false">
    <span class="mk__num" aria-hidden="true">2</span>
    <span class="mk__head">버튼이 눌렸다고 느껴지는 0.1초의 정체</span>
    <span class="mk__time">4분</span>
  </button>
  <button type="button" class="mk__row" aria-pressed="false">
    <span class="mk__num" aria-hidden="true">3</span>
    <span class="mk__head">카드가 겹치는 첫 화면, 각을 잡는 순서</span>
    <span class="mk__time">8분</span>
  </button>
</td></tr>
<tr><td align="center" class="mk__ctawrap"><a href="#" role="button" class="mk__cta">전체 편지 보기</a></td></tr>
<tr><td align="center" class="mk__footer">Acme Inc · 서울 · <a href="#" class="mk__unsub">수신거부</a></td></tr>
</table>
</td></tr>
</table>
</div>
</main>
<script>
var mk = document.getElementById('mk');
var rows = document.querySelectorAll('.mk__row');
for (var i = 0; i < rows.length; i++) {
  rows[i].addEventListener('click', function () {
    mk.classList.remove('is-demo');
    this.classList.toggle('is-read');
    var wasRead = this.classList.contains('is-read');
    this.setAttribute('aria-pressed', String(wasRead));
    var timeBadge = this.querySelector('.mk__time');
    timeBadge.textContent = wasRead ? '읽음' : this.getAttribute('data-time');
  });
}
var times = document.querySelectorAll('.mk__time');
for (var j = 0; j < times.length; j++) {
  times[j].parentNode.setAttribute('data-time', times[j].textContent);
}
</script>
</body>
</html>
