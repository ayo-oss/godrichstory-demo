<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drag a Corner, Release, and a Page Settles — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="Flipbook corner drag stage: drag a corner to turn the page, arrow keys move between pages, Enter pauses, N steps once, R restarts">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="You drag the corner of the right page of a book to turn it. Drag a little and let go and the page returns, and drag past the 90 degree snap line and let go and the page settles on the left, overshooting slightly once before it rests. Dragging the other way brings it back. The line below shows the current angle and the snap line"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">Flipbook demo</p>
  <div class="vj__ctrl">
    <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
    <button class="vj__step" data-role="step" type="button">Step</button>
  </div>
  <p class="vj__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 파스텔 팔레트 — 면은 연한 색, 글자는 늘 진한 잉크
    const BG_TOP = [248, 244, 252];
    const BG_BOT = [228, 234, 250];
    const BED = [226, 220, 242];
    const INK = [40, 36, 54];
    const INK2 = [66, 60, 90];
    const PAPER = [250, 246, 240];
    const ROSE = [244, 162, 186];
    const MINT = [148, 212, 182];
    const SKY = [172, 208, 246];
    const BALL = [246, 184, 200];
    const TILES = [
        [200, 190, 244], [168, 222, 200], [250, 228, 150], [246, 184, 200],
        [172, 208, 246], [250, 208, 170], [196, 222, 170], [222, 190, 240],
    ];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 장면 시계(초)·판 반복 번호·시간표 — 시간표는 (시각, 할 일) 목록이고 시각이 지나면 한 번씩 부른다
    let sceneT = 0;
    let lap = 0;
    let script = [];
    let evAt = 0;
    // 문구 틀의 {a}·{b} 자리에 값을 끼운다 — 화면 문구는 늘 이 틀 한 줄로 두고 로케일 사전이 통째로 바꾼다
    function fill(s, a, b) { return s.replace('{a}', a).replace('{b}', b === undefined ? '' : b); }
    function r1(v) { return String(Math.round(v * 10) / 10); }
    // 읽어 주는 문장은 사람이 직접 하거나 멈춘 때만 숫자를 싣는다 — 자동으로 흐르는 동안은 한 줄이 그대로여서 스크린리더가 매 프레임 읽지 않는다
    function calm() { return !(paused || manual || still); }
    const FRAME_COUNT = 12;
    const FLOOR_Y = 0.8;
    const HOP_H = 0.58;
    function makePages(n) {
        const out = [];
        for (let i = 0; i < n; i += 1) {
            // 두 번 튀므로 한 번 튀는 사이는 반 바퀴 — b 는 한 번 튀는 안의 위치 0~1, h 는 높이(포물선)
            const b = (i * 2 / n) % 1;
            const h = 4 * b * (1 - b);
            const sy = 0.8 + 0.2 * Math.min(1, h * 3);
            out.push({ x: 0.14 + 0.72 * (i / (n - 1)), y: FLOOR_Y - h * HOP_H, sx: 2 - sy, sy: sy });
        }
        return out;
    }
    const PAGES = makePages(FRAME_COUNT);
    // 한 쪽의 종이 — 흰 바탕과 바닥 선
    function paperBox(R, a, edge) {
        box(R.x, R.y, R.w, R.h, 5, PAPER, a);
        outline(R.x, R.y, R.w, R.h, 5, 1.5, edge, 0.9 * a);
        const fy = R.y + R.h * (FLOOR_Y + 0.085);
        line(R.x + R.w * 0.06, fy, R.x + R.w * 0.94, fy, 1.5, mix(PAPER, INK2, 0.35), a);
    }
    // 쪽 안의 공 한 개 — 눌림은 바닥에 닿은 쪽에서 가로로 퍼진다
    function pageBall(R, p, c, a, edge, shine) {
        if (a <= 0.01) {
            return;
        }
        const rr = R.w * 0.075;
        const cx = R.x + R.w * p.x;
        const cy = R.y + R.h * p.y;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(p.sx, p.sy);
        ctx.beginPath();
        ctx.arc(0, 0, rr, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
        ctx.lineWidth = 1.4 / Math.max(p.sx, p.sy);
        ctx.strokeStyle = rgba(edge, 0.85 * a);
        ctx.stroke();
        if (shine) {
            ctx.beginPath();
            ctx.arc(-rr * 0.3, -rr * 0.34, rr * 0.3, 0, TAU);
            ctx.fillStyle = rgba([255, 255, 255], 0.45 * a);
            ctx.fill();
        }
        ctx.restore();
    }
    // 한 쪽을 통째로 — 종이·공·쪽 번호
    function drawPage(R, i, a, label) {
        paperBox(R, a, INK2);
        pageBall(R, PAGES[i], BALL, a, INK, true);
        if (label) {
            text(String(i + 1), R.x + R.w - 8, R.y + 10, INK2, a, 9, 700, 'right');
        }
    }
    // 정수부 — 쪽 번호는 늘 이 함수를 지난다(소수 쪽 번호가 그려지지 않게)
    function wrapIdx(n, count) { return ((Math.floor(n + 1e-9) % count) + count) % count; }
    // 쪽 번호 띠 — 작은 칸 count 개, 지금 쪽이 밝다
    function thumbs(R, count, cols, cur) {
        const rows = Math.ceil(count / cols);
        const gap = 4;
        const cw = (R.w - gap * (cols - 1)) / cols;
        const ch = (R.h - gap * (rows - 1)) / rows;
        for (let i = 0; i < count; i += 1) {
            const cell = { x: R.x + (i % cols) * (cw + gap), y: R.y + Math.floor(i / cols) * (ch + gap), w: cw, h: ch };
            const on = i === cur;
            box(cell.x, cell.y, cell.w, cell.h, 3, on ? TILES[2] : PAPER, on ? 1 : 0.9);
            outline(cell.x, cell.y, cell.w, cell.h, 3, on ? 2 : 1, on ? INK : mix(PAPER, INK2, 0.4), 1);
            const p = PAGES[i % PAGES.length];
            disc(cell.x + cell.w * p.x, cell.y + cell.h * p.y, Math.min(cell.w, cell.h) * 0.13, mix(BALL, INK, 0.1), 1);
        }
    }
    const SEG = 8;
    const PERSP = 0.0022;
    function edgeProject(spineX, a, len, bendRad) {
        const out = [{ x: spineX, z: 0, s: 1 }];
        let x = spineX;
        let z = 0;
        const dl = len / SEG;
        for (let k = 1; k <= SEG; k += 1) {
            const ph = a - bendRad * Math.sin(a) * (k / SEG);
            x += dl * Math.cos(ph);
            z += dl * Math.sin(ph);
            out.push({ x: x, z: z, s: 1 / (1 - z * PERSP) });
        }
        return out;
    }
    // 투영한 쪽 한 장을 윗변·아랫변을 따라 다각형으로 칠한다. 칠한 쪽의 평균 깊이를 돌려준다(그리는 순서 정렬용)
    function flapPath(pts, cy, hp) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, cy - hp / 2 * pts[0].s);
        for (let k = 1; k < pts.length; k += 1) {
            ctx.lineTo(pts[k].x, cy - hp / 2 * pts[k].s);
        }
        for (let k = pts.length - 1; k >= 0; k -= 1) {
            ctx.lineTo(pts[k].x, cy + hp / 2 * pts[k].s);
        }
        ctx.closePath();
    }
    function drawFlap(pts, cy, hp, c, a) {
        // 모서리가 앞을 향할수록(옆으로 누울수록) 밝고, 책등 쪽으로 서서 얇아질수록 어둡다
        const span = Math.abs(pts[pts.length - 1].x - pts[0].x);
        const lit = clamp(span / (pts.length > 1 ? Math.max(1, Math.abs(pts[0].x - pts[1].x) * SEG) : 1), 0, 1);
        flapPath(pts, cy, hp);
        ctx.fillStyle = rgba(mix(c, [120, 110, 160], 0.4 * (1 - lit)), a);
        ctx.fill();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = rgba(INK2, 0.85 * a);
        ctx.stroke();
    }
    function meanZ(pts) {
        let s = 0;
        for (const p of pts) {
            s += p.z;
        }
        return s / pts.length;
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const stepEl = root.querySelector('[data-role="step"]');
    const doneEl = root.querySelector('[data-role="done"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !stepEl || !doneEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const stepBtn = stepEl;
    const doneP = doneEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function skyFill(top, bot) {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bot, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function outline(x, y, w, h, r, width, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 글자 이름표 — 바탕 알약 위에 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    // 판 자리 — 왼쪽 판·오른쪽 판(대비판)·한 판짜리 히어로. 위쪽은 상태 줄·버튼 자리
    const PANEL_L = { x: 12, y: 78, w: 222, h: 208 };
    const PANEL_R = { x: 246, y: 78, w: 222, h: 208 };
    const PANEL_ONE = { x: 12, y: 60, w: 456, h: 228 };
    // 판 바닥 — 판 둘레로 비치는 연보라
    function bed(R) {
        box(R.x - 3, R.y - 3, R.w + 6, R.h + 6, 10, BED, 1);
    }
    function panelTags(a, b) {
        tag(a, PANEL_L.x + PANEL_L.w / 2, 66, INK, PAPER, 10, 'center');
        tag(b, PANEL_R.x + PANEL_R.w / 2, 66, PAPER, INK, 10, 'center');
    }
    // 공 한 개 — 면, 왼쪽 위 하이라이트, 옅은 윤곽
    function orb(x, y, r, c, a) {
        if (r <= 0.3 || a <= 0) {
            return;
        }
        disc(x, y, r, c, a);
        if (r > 5) {
            disc(x - r * 0.28, y - r * 0.32, r * 0.42, [255, 255, 255], 0.3 * a);
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = 1;
        ctx.strokeStyle = rgba(mix(c, INK, 0.28), 0.55 * a);
        ctx.stroke();
    }
    function line(x0, y0, x1, y1, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.3 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    // 사람이 직접 하는 중이면 시간표는 멈추고 애니메이션만 흐른다
    let manual = false;
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    function takeOver() {
        if (manual) {
            return;
        }
        manual = true;
        onTake();
        wake();
    }
    // 한 판 시연이 끝났음을 스크린리더에 한 번만 알린다 — 판이 되풀이돼도 다시 읽지 않는다
    let doneSaid = false;
    function checkDone() {
        if (!manual && !doneSaid && sceneT >= LAP_S - 0.6) {
            doneSaid = true;
            doneP.textContent = statusText();
        }
    }
    function advance(dt) {
        sceneT += dt;
        if (!manual) {
            while (evAt < script.length && script[evAt].t <= sceneT) {
                const ev = script[evAt];
                evAt += 1;
                ev.f();
            }
            if (sceneT >= LAP_S) {
                lap += 1;
                begin();
                return;
            }
        }
        update(dt);
    }
    // 첫 판은 START_S 만큼 앞서 시작한다 — 장면이 이미 움직이는 중인 장면에서 보인다
    function runTo(t) {
        while (sceneT < t - 1e-6) {
            advance(Math.min(1 / 30, t - sceneT));
        }
    }
    function begin() {
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        if (lap === 0 && !still) {
            runTo(START_S);
        }
    }
    const DT_MAX = 0.05;
    const SETTLE_FRAMES = 8;
    const SETTLE_DT = 0.04;
    function showNow() {
        draw();
        pushStatus(statusText());
        checkDone();
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        showNow();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 처음 판의 정지 장면 한 장
    function showRest() {
        stopLoop();
        lap = 0;
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        runTo(REST_S);
        showNow();
    }
    // 움직임 줄이기이거나 멈춘 채 입력이 들어오면 애니메이션 없이 곧바로 끝 상태로 — 시간을 3초 흘려 움직임을 다 끝낸다
    function settleStill() {
        for (let k = 0; k < 90; k += 1) {
            sceneT += 1 / 30;
            update(1 / 30);
        }
    }
    function play() {
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    function restart() {
        manual = false;
        doneSaid = false;
        lap += 1;
        begin();
        for (let k = 0; k < SETTLE_FRAMES; k += 1) {
            update(SETTLE_DT);
        }
        showNow();
    }
    // Step — 멈춘 채 시간표의 다음 일 하나를 부른다. 더 부를 일이 없거나 직접 하던 중이면 다음 판을 연다
    function stepOnce() {
        wake();
        if (!paused) {
            paused = true;
            pauseBtn.setAttribute('aria-pressed', 'true');
            stopLoop();
        }
        if (manual || evAt >= script.length) {
            restart();
            return;
        }
        sceneT = Math.max(sceneT, script[evAt].t);
        advance(0);
        for (let k = 0; k < SETTLE_FRAMES; k += 1) {
            sceneT += SETTLE_DT;
            update(SETTLE_DT);
        }
        showNow();
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    stepBtn.addEventListener('click', stepOnce, { signal: off.signal });
    // 쪽 넘기기 — 사람이 손대면 시간표는 멈추고 쪽만 바뀐다. 멈춘 채·움직임 줄이기에서도 한 번의 입력이 화면에 바로 반영되게 한다
    function navPage(d) {
        takeOver();
        onNav(d);
        if (still || paused) {
            settleStill();
        }
        showNow();
    }
    // 키보드 — 무대에 포커스가 있을 때만. 왼쪽·위 = Prev 쪽, 오른쪽·아래·Space = 다음 쪽, Enter·P = Pause, N = Step, R = 처음부터
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        const k = e.key;
        if (k === 'ArrowLeft' || k === 'ArrowUp') {
            e.preventDefault();
            navPage(-1);
        }
        else if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ') {
            e.preventDefault();
            navPage(1);
        }
        else if (k === 'Enter' || k === 'p' || k === 'P') {
            e.preventDefault();
            togglePause();
        }
        else if (k === 'n' || k === 'N') {
            stepOnce();
        }
        else if (k === 'r' || k === 'R') {
            restart();
        }
    }, { signal: off.signal });
    // 마우스·터치 — 무대를 누르면 다음 쪽(06 은 모서리 끌기라 따로 받는다)
    pad.addEventListener('click', function () {
        if (!CLICK_NAV) {
            return;
        }
        navPage(1);
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 정지 장면 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            lap = 0;
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        showNow();
    }, { signal: off.signal });
    // 06 — 모서리를 끌어 쪽을 넘긴다. 놓은 순간의 각도 a 가 SNAP_ANGLE 를 넘었으면 반대편(π)으로, 아니면 in place(0)로 스프링이 끌고 간다.
    // 스프링은 가속도 = -K × (a - 목표) - C × 속도, 작은 조각(1/240초)으로 적분한다
    const SNAP_ANGLE = Math.PI / 2;
    const K = 140;
    const C = 16;
    const SUB = 1 / 240;
    const PAGE_LEN = 150;
    const PAGE_HT = 150;
    const LAP_S = 10.4;
    const START_S = 1.7;
    const REST_S = 3.4;
    const CLICK_NAV = false;
    const SPINE_X = 240;
    const MID_Y = 164;
    let ang = 0;
    let vel = 0;
    let held = false;
    let dragTo = 0;
    let tgtAng = 0;
    let pointerId = -1;
    function build() {
        ang = 0;
        vel = 0;
        held = false;
        dragTo = 0;
        tgtAng = 0;
        // 작게 끌었다 놓기(in place) → 크게 끌어 넘기기 → 반대로 끌어 되돌리기
        script.push({ t: 0.4, f: function () { grab(0.9); } });
        script.push({ t: 2.2, f: function () { release(); } });
        script.push({ t: 3.8, f: function () { grab(2.7); } });
        script.push({ t: 5.4, f: function () { release(); } });
        script.push({ t: 7.4, f: function () { grab(1.0); } });
        script.push({ t: 9.0, f: function () { release(); } });
    }
    function grab(to) { held = true; dragTo = to; }
    function release() {
        held = false;
        tgtAng = ang > SNAP_ANGLE ? Math.PI : 0;
    }
    function update(dt) {
        if (dt <= 0) {
            return;
        }
        if (held) {
            ang += (dragTo - ang) * (1 - Math.exp(-7 * dt));
            vel = 0;
            return;
        }
        if (still) {
            ang = tgtAng;
            vel = 0;
            return;
        }
        let left = dt;
        while (left > 1e-9) {
            const h = Math.min(SUB, left);
            vel += (-K * (ang - tgtAng) - C * vel) * h;
            ang += vel * h;
            left -= h;
        }
    }
    // 끌고 있는 모서리 — 쪽 아랫변 바깥 끝
    function corner() {
        const pts = edgeProject(SPINE_X, ang, PAGE_LEN, 0);
        const e = pts[pts.length - 1];
        return { x: e.x, y: MID_Y + PAGE_HT / 2 * e.s };
    }
    function draw() {
        skyFill(BG_TOP, BG_BOT);
        bed({ x: 12, y: 60, w: 456, h: 190 });
        // 밑에 깔린 두 쪽 — 오른쪽 쪽은 아직 안 넘긴 면, 왼쪽은 넘긴 면
        box(SPINE_X, MID_Y - PAGE_HT / 2, PAGE_LEN, PAGE_HT, 4, PAPER, 1);
        box(SPINE_X - PAGE_LEN, MID_Y - PAGE_HT / 2, PAGE_LEN, PAGE_HT, 4, mix(PAPER, TILES[1], 0.35), 1);
        pageBall({ x: SPINE_X, y: MID_Y - PAGE_HT / 2, w: PAGE_LEN, h: PAGE_HT }, PAGES[7], BALL, 0.9, INK, true);
        drawFlap(edgeProject(SPINE_X, ang, PAGE_LEN, 0.25 * Math.sin(ang)), MID_Y, PAGE_HT, TILES[2], 1);
        line(SPINE_X, MID_Y - PAGE_HT / 2 - 5, SPINE_X, MID_Y + PAGE_HT / 2 + 5, 3, INK2, 1);
        const c = corner();
        disc(c.x, c.y, held ? 9 : 6, held ? ROSE : PAPER, 1);
        ring(c.x, c.y, held ? 9 : 6, 2, INK, 1);
        // 각도 줄 — 가운데가 SNAP_ANGLE
        const x0 = 66;
        const x1 = 414;
        const y = 268;
        box(x0 - 4, y - 7, x1 - x0 + 8, 14, 7, PAPER, 1);
        box(x0 - 4, y - 7, (x1 - x0) * clamp(ang / Math.PI, 0, 1) + 4, 14, 7, held ? TILES[5] : TILES[1], 1);
        outline(x0 - 4, y - 7, x1 - x0 + 8, 14, 7, 1.5, INK2, 1);
        const sx = lerp(x0, x1, SNAP_ANGLE / Math.PI);
        line(sx, y - 12, sx, y + 12, 2, INK, 1);
        tag(fill('Snap line {a} deg', String(Math.round(SNAP_ANGLE * 180 / Math.PI))), sx, y - 20, INK, PAPER, 9, 'center');
        tag(fill('{a} deg', String(Math.round(ang * 180 / Math.PI))), lerp(x0, x1, clamp(ang / Math.PI, 0, 1)), y + 22, PAPER, INK, 9, 'center');
    }
    function statusText() {
        if (calm()) {
            return held ? 'Dragging the corner' : 'On release the page settles by the snap line';
        }
        return fill('Angle {a} deg - {b}', String(Math.round(ang * 180 / Math.PI)), tgtAng > 0 ? 'turned' : 'in place');
    }
    // 키보드 — 앞뒤로 한 쪽
    function onNav(d) {
        held = false;
        tgtAng = d > 0 ? Math.PI : 0;
    }
    function onTake() { held = false; }
    // 모서리 끌기 — 포인터 이벤트와 setPointerCapture. 끌고 있는 동안 각도는 포인터의 가로 위치에서 acos 로 구한다
    function canvasPoint(e) {
        const r = cv.getBoundingClientRect();
        return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
    }
    function angleAt(px) { return Math.acos(clamp((px - SPINE_X) / PAGE_LEN, -1, 1)); }
    pad.addEventListener('pointerdown', function (e) {
        const p = canvasPoint(e);
        const c = corner();
        if (Math.hypot(p.x - c.x, p.y - c.y) > 44) {
            return;
        }
        takeOver();
        pointerId = e.pointerId;
        pad.setPointerCapture(e.pointerId);
        held = true;
        dragTo = angleAt(p.x);
        ang = dragTo;
        showNow();
    }, { signal: off.signal });
    pad.addEventListener('pointermove', function (e) {
        if (e.pointerId !== pointerId || !held) {
            return;
        }
        dragTo = angleAt(canvasPoint(e).x);
        ang = dragTo;
        if (still || paused) {
            showNow();
        }
    }, { signal: off.signal });
    function endDrag(e) {
        if (e.pointerId !== pointerId) {
            return;
        }
        pointerId = -1;
        release();
        if (still || paused) {
            settleStill();
        }
        showNow();
    }
    pad.addEventListener('pointerup', endDrag, { signal: off.signal });
    pad.addEventListener('pointercancel', endDrag, { signal: off.signal });
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
