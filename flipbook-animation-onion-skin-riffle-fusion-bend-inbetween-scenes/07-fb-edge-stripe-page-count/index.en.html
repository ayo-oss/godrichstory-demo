<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Book Edge Where Page Count Shows as Thickness and Stripes — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="Flipbook stage: left and right arrow keys or Space flip pages, Enter pauses, N steps once, R restarts">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="The page drawing and the edge stripe band of two books are shown one above the other. The left book grows from 12 to 24, 36 and 60 pages so its band lengthens, and the right book stays at 12 pages. The stripe for the current page rises and shines, pages to its left are read and pages to its right remain, and the remaining page count is written out"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">Flipbook demo</p>
  <div class="vj__ctrl">
    <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
    <button class="vj__step" data-role="step" type="button">Step</button>
  </div>
  <p class="vj__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 파스텔 팔레트 — 면은 연한 색, 글자는 늘 진한 잉크
    const BG_TOP = [248, 244, 252];
    const BG_BOT = [228, 234, 250];
    const BED = [226, 220, 242];
    const INK = [40, 36, 54];
    const INK2 = [66, 60, 90];
    const PAPER = [250, 246, 240];
    const ROSE = [244, 162, 186];
    const MINT = [148, 212, 182];
    const SKY = [172, 208, 246];
    const BALL = [246, 184, 200];
    const TILES = [
        [200, 190, 244], [168, 222, 200], [250, 228, 150], [246, 184, 200],
        [172, 208, 246], [250, 208, 170], [196, 222, 170], [222, 190, 240],
    ];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 장면 시계(초)·판 반복 번호·시간표 — 시간표는 (시각, 할 일) 목록이고 시각이 지나면 한 번씩 부른다
    let sceneT = 0;
    let lap = 0;
    let script = [];
    let evAt = 0;
    // 문구 틀의 {a}·{b} 자리에 값을 끼운다 — 화면 문구는 늘 이 틀 한 줄로 두고 로케일 사전이 통째로 바꾼다
    function fill(s, a, b) { return s.replace('{a}', a).replace('{b}', b === undefined ? '' : b); }
    function r1(v) { return String(Math.round(v * 10) / 10); }
    // 읽어 주는 문장은 사람이 직접 하거나 멈춘 때만 숫자를 싣는다 — 자동으로 흐르는 동안은 한 줄이 그대로여서 스크린리더가 매 프레임 읽지 않는다
    function calm() { return !(paused || manual || still); }
    const FRAME_COUNT = 12;
    const FLOOR_Y = 0.8;
    const HOP_H = 0.58;
    function makePages(n) {
        const out = [];
        for (let i = 0; i < n; i += 1) {
            // 두 번 튀므로 한 번 튀는 사이는 반 바퀴 — b 는 한 번 튀는 안의 위치 0~1, h 는 높이(포물선)
            const b = (i * 2 / n) % 1;
            const h = 4 * b * (1 - b);
            const sy = 0.8 + 0.2 * Math.min(1, h * 3);
            out.push({ x: 0.14 + 0.72 * (i / (n - 1)), y: FLOOR_Y - h * HOP_H, sx: 2 - sy, sy: sy });
        }
        return out;
    }
    const PAGES = makePages(FRAME_COUNT);
    // 한 쪽의 종이 — 흰 바탕과 바닥 선
    function paperBox(R, a, edge) {
        box(R.x, R.y, R.w, R.h, 5, PAPER, a);
        outline(R.x, R.y, R.w, R.h, 5, 1.5, edge, 0.9 * a);
        const fy = R.y + R.h * (FLOOR_Y + 0.085);
        line(R.x + R.w * 0.06, fy, R.x + R.w * 0.94, fy, 1.5, mix(PAPER, INK2, 0.35), a);
    }
    // 쪽 안의 공 한 개 — 눌림은 바닥에 닿은 쪽에서 가로로 퍼진다
    function pageBall(R, p, c, a, edge, shine) {
        if (a <= 0.01) {
            return;
        }
        const rr = R.w * 0.075;
        const cx = R.x + R.w * p.x;
        const cy = R.y + R.h * p.y;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(p.sx, p.sy);
        ctx.beginPath();
        ctx.arc(0, 0, rr, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
        ctx.lineWidth = 1.4 / Math.max(p.sx, p.sy);
        ctx.strokeStyle = rgba(edge, 0.85 * a);
        ctx.stroke();
        if (shine) {
            ctx.beginPath();
            ctx.arc(-rr * 0.3, -rr * 0.34, rr * 0.3, 0, TAU);
            ctx.fillStyle = rgba([255, 255, 255], 0.45 * a);
            ctx.fill();
        }
        ctx.restore();
    }
    // 한 쪽을 통째로 — 종이·공·쪽 번호
    function drawPage(R, i, a, label) {
        paperBox(R, a, INK2);
        pageBall(R, PAGES[i], BALL, a, INK, true);
        if (label) {
            text(String(i + 1), R.x + R.w - 8, R.y + 10, INK2, a, 9, 700, 'right');
        }
    }
    // 정수부 — 쪽 번호는 늘 이 함수를 지난다(소수 쪽 번호가 그려지지 않게)
    function wrapIdx(n, count) { return ((Math.floor(n + 1e-9) % count) + count) % count; }
    // 쪽 번호 띠 — 작은 칸 count 개, 지금 쪽이 밝다
    function thumbs(R, count, cols, cur) {
        const rows = Math.ceil(count / cols);
        const gap = 4;
        const cw = (R.w - gap * (cols - 1)) / cols;
        const ch = (R.h - gap * (rows - 1)) / rows;
        for (let i = 0; i < count; i += 1) {
            const cell = { x: R.x + (i % cols) * (cw + gap), y: R.y + Math.floor(i / cols) * (ch + gap), w: cw, h: ch };
            const on = i === cur;
            box(cell.x, cell.y, cell.w, cell.h, 3, on ? TILES[2] : PAPER, on ? 1 : 0.9);
            outline(cell.x, cell.y, cell.w, cell.h, 3, on ? 2 : 1, on ? INK : mix(PAPER, INK2, 0.4), 1);
            const p = PAGES[i % PAGES.length];
            disc(cell.x + cell.w * p.x, cell.y + cell.h * p.y, Math.min(cell.w, cell.h) * 0.13, mix(BALL, INK, 0.1), 1);
        }
    }
    const SEG = 8;
    const PERSP = 0.0022;
    function edgeProject(spineX, a, len, bendRad) {
        const out = [{ x: spineX, z: 0, s: 1 }];
        let x = spineX;
        let z = 0;
        const dl = len / SEG;
        for (let k = 1; k <= SEG; k += 1) {
            const ph = a - bendRad * Math.sin(a) * (k / SEG);
            x += dl * Math.cos(ph);
            z += dl * Math.sin(ph);
            out.push({ x: x, z: z, s: 1 / (1 - z * PERSP) });
        }
        return out;
    }
    // 투영한 쪽 한 장을 윗변·아랫변을 따라 다각형으로 칠한다. 칠한 쪽의 평균 깊이를 돌려준다(그리는 순서 정렬용)
    function flapPath(pts, cy, hp) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, cy - hp / 2 * pts[0].s);
        for (let k = 1; k < pts.length; k += 1) {
            ctx.lineTo(pts[k].x, cy - hp / 2 * pts[k].s);
        }
        for (let k = pts.length - 1; k >= 0; k -= 1) {
            ctx.lineTo(pts[k].x, cy + hp / 2 * pts[k].s);
        }
        ctx.closePath();
    }
    function drawFlap(pts, cy, hp, c, a) {
        // 모서리가 앞을 향할수록(옆으로 누울수록) 밝고, 책등 쪽으로 서서 얇아질수록 어둡다
        const span = Math.abs(pts[pts.length - 1].x - pts[0].x);
        const lit = clamp(span / (pts.length > 1 ? Math.max(1, Math.abs(pts[0].x - pts[1].x) * SEG) : 1), 0, 1);
        flapPath(pts, cy, hp);
        ctx.fillStyle = rgba(mix(c, [120, 110, 160], 0.4 * (1 - lit)), a);
        ctx.fill();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = rgba(INK2, 0.85 * a);
        ctx.stroke();
    }
    function meanZ(pts) {
        let s = 0;
        for (const p of pts) {
            s += p.z;
        }
        return s / pts.length;
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const stepEl = root.querySelector('[data-role="step"]');
    const doneEl = root.querySelector('[data-role="done"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !stepEl || !doneEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const stepBtn = stepEl;
    const doneP = doneEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function skyFill(top, bot) {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bot, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function outline(x, y, w, h, r, width, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 글자 이름표 — 바탕 알약 위에 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    // 판 자리 — 왼쪽 판·오른쪽 판(대비판)·한 판짜리 히어로. 위쪽은 상태 줄·버튼 자리
    const PANEL_L = { x: 12, y: 78, w: 222, h: 208 };
    const PANEL_R = { x: 246, y: 78, w: 222, h: 208 };
    const PANEL_ONE = { x: 12, y: 60, w: 456, h: 228 };
    // 판 바닥 — 판 둘레로 비치는 연보라
    function bed(R) {
        box(R.x - 3, R.y - 3, R.w + 6, R.h + 6, 10, BED, 1);
    }
    function panelTags(a, b) {
        tag(a, PANEL_L.x + PANEL_L.w / 2, 66, INK, PAPER, 10, 'center');
        tag(b, PANEL_R.x + PANEL_R.w / 2, 66, PAPER, INK, 10, 'center');
    }
    // 공 한 개 — 면, 왼쪽 위 하이라이트, 옅은 윤곽
    function orb(x, y, r, c, a) {
        if (r <= 0.3 || a <= 0) {
            return;
        }
        disc(x, y, r, c, a);
        if (r > 5) {
            disc(x - r * 0.28, y - r * 0.32, r * 0.42, [255, 255, 255], 0.3 * a);
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = 1;
        ctx.strokeStyle = rgba(mix(c, INK, 0.28), 0.55 * a);
        ctx.stroke();
    }
    function line(x0, y0, x1, y1, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.3 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    // 사람이 직접 하는 중이면 시간표는 멈추고 애니메이션만 흐른다
    let manual = false;
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    function takeOver() {
        if (manual) {
            return;
        }
        manual = true;
        onTake();
        wake();
    }
    // 한 판 시연이 끝났음을 스크린리더에 한 번만 알린다 — 판이 되풀이돼도 다시 읽지 않는다
    let doneSaid = false;
    function checkDone() {
        if (!manual && !doneSaid && sceneT >= LAP_S - 0.6) {
            doneSaid = true;
            doneP.textContent = statusText();
        }
    }
    function advance(dt) {
        sceneT += dt;
        if (!manual) {
            while (evAt < script.length && script[evAt].t <= sceneT) {
                const ev = script[evAt];
                evAt += 1;
                ev.f();
            }
            if (sceneT >= LAP_S) {
                lap += 1;
                begin();
                return;
            }
        }
        update(dt);
    }
    // 첫 판은 START_S 만큼 앞서 시작한다 — 장면이 이미 움직이는 중인 장면에서 보인다
    function runTo(t) {
        while (sceneT < t - 1e-6) {
            advance(Math.min(1 / 30, t - sceneT));
        }
    }
    function begin() {
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        if (lap === 0 && !still) {
            runTo(START_S);
        }
    }
    const DT_MAX = 0.05;
    const SETTLE_FRAMES = 8;
    const SETTLE_DT = 0.04;
    function showNow() {
        draw();
        pushStatus(statusText());
        checkDone();
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        showNow();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 처음 판의 정지 장면 한 장
    function showRest() {
        stopLoop();
        lap = 0;
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        runTo(REST_S);
        showNow();
    }
    // 움직임 줄이기이거나 멈춘 채 입력이 들어오면 애니메이션 없이 곧바로 끝 상태로 — 시간을 3초 흘려 움직임을 다 끝낸다
    function settleStill() {
        for (let k = 0; k < 90; k += 1) {
            sceneT += 1 / 30;
            update(1 / 30);
        }
    }
    function play() {
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    function restart() {
        manual = false;
        doneSaid = false;
        lap += 1;
        begin();
        for (let k = 0; k < SETTLE_FRAMES; k += 1) {
            update(SETTLE_DT);
        }
        showNow();
    }
    // Step — 멈춘 채 시간표의 다음 일 하나를 부른다. 더 부를 일이 없거나 직접 하던 중이면 다음 판을 연다
    function stepOnce() {
        wake();
        if (!paused) {
            paused = true;
            pauseBtn.setAttribute('aria-pressed', 'true');
            stopLoop();
        }
        if (manual || evAt >= script.length) {
            restart();
            return;
        }
        sceneT = Math.max(sceneT, script[evAt].t);
        advance(0);
        for (let k = 0; k < SETTLE_FRAMES; k += 1) {
            sceneT += SETTLE_DT;
            update(SETTLE_DT);
        }
        showNow();
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    stepBtn.addEventListener('click', stepOnce, { signal: off.signal });
    // 쪽 넘기기 — 사람이 손대면 시간표는 멈추고 쪽만 바뀐다. 멈춘 채·움직임 줄이기에서도 한 번의 입력이 화면에 바로 반영되게 한다
    function navPage(d) {
        takeOver();
        onNav(d);
        if (still || paused) {
            settleStill();
        }
        showNow();
    }
    // 키보드 — 무대에 포커스가 있을 때만. 왼쪽·위 = Prev 쪽, 오른쪽·아래·Space = 다음 쪽, Enter·P = Pause, N = Step, R = 처음부터
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        const k = e.key;
        if (k === 'ArrowLeft' || k === 'ArrowUp') {
            e.preventDefault();
            navPage(-1);
        }
        else if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ') {
            e.preventDefault();
            navPage(1);
        }
        else if (k === 'Enter' || k === 'p' || k === 'P') {
            e.preventDefault();
            togglePause();
        }
        else if (k === 'n' || k === 'N') {
            stepOnce();
        }
        else if (k === 'r' || k === 'R') {
            restart();
        }
    }, { signal: off.signal });
    // 마우스·터치 — 무대를 누르면 다음 쪽(06 은 모서리 끌기라 따로 받는다)
    pad.addEventListener('click', function () {
        if (!CLICK_NAV) {
            return;
        }
        navPage(1);
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 정지 장면 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            lap = 0;
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        showNow();
    }, { signal: off.signal });
    // 07 — 쪽수 pageCount 가 두께를 정한다. 옆면에는 쪽마다 줄무늬 한 줄(너비 STRIPE_W)이 서고,
    // 지금 쪽(currentBand)은 밝은 칸으로 솟아 오르며 그 왼쪽은 읽은 쪽, 오른쪽은 남은 쪽이다
    const STRIPE_W = 3.2;
    const PAGE_HZ = 7;
    const COUNT_STEPS = [12, 24, 36, 60];
    const LAP_S = 9.6;
    const START_S = 5.2;
    const REST_S = 6.2;
    const CLICK_NAV = true;
    let phase = 0;
    let pageCount = COUNT_STEPS[0];
    let shownN = COUNT_STEPS[0];
    let pageNow = 0;
    function build() {
        phase = 0;
        pageCount = COUNT_STEPS[0];
        shownN = COUNT_STEPS[0];
        pageNow = 0;
        script.push({ t: 1.6, f: function () { pageCount = COUNT_STEPS[1]; } });
        script.push({ t: 3.6, f: function () { pageCount = COUNT_STEPS[2]; } });
        script.push({ t: 5.6, f: function () { pageCount = COUNT_STEPS[3]; } });
        script.push({ t: 8.4, f: function () { pageCount = COUNT_STEPS[0]; } });
    }
    function update(dt) {
        if (dt <= 0) {
            return;
        }
        shownN += (pageCount - shownN) * (1 - Math.exp(-5 * dt));
        if (!manual) {
            phase += PAGE_HZ * dt;
        }
        pageNow = wrapIdx(phase, Math.max(1, Math.round(shownN)));
    }
    // 쪽 i 의 옆면 줄무늬 왼쪽 끝 — 쪽마다 STRIPE_W 씩 옆으로 선다
    function edgeStripe(i) { return i * STRIPE_W; }
    // 한 권 — 위쪽에 지금 쪽 그림, 아래쪽에 옆면 줄무늬 띠
    function drawBook(R, n, cur) {
        const currentBand = cur;
        const art = { x: R.x + 14, y: R.y + 12, w: 92, h: 90 };
        drawPage(art, cur % FRAME_COUNT, 1, true);
        tag(fill('{a} pages left', String(n - 1 - cur)), R.x + R.w - 56, R.y + 36, PAPER, INK, 11, 'center');
        tag(fill('{a} pages total', String(n)), R.x + R.w - 56, R.y + 64, INK, PAPER, 10, 'center');
        const bx = R.x + 14;
        const by = R.y + 126;
        const bh = 54;
        box(bx - 3, by - 3, n * STRIPE_W + 6, bh + 6, 4, mix(PAPER, INK2, 0.25), 1);
        for (let i = 0; i < n; i += 1) {
            const read = i < currentBand;
            const on = i === currentBand;
            const c = on ? TILES[2] : mix(TILES[i % 2 === 0 ? 4 : 7], INK, read ? 0.22 : 0);
            const lift = on ? 7 : 0;
            box(bx + edgeStripe(i), by - lift, STRIPE_W - 0.6, bh + lift, 1, c, 1);
        }
        outline(bx + edgeStripe(currentBand) - 1, by - 8, STRIPE_W + 1.4, bh + 9, 2, 1.5, INK, 1);
    }
    function draw() {
        skyFill(BG_TOP, BG_BOT);
        tag(fill('{a} pages', String(Math.round(shownN))), PANEL_L.x + PANEL_L.w / 2, 66, INK, PAPER, 10, 'center');
        tag('Stays at 12 pages', PANEL_R.x + PANEL_R.w / 2, 66, PAPER, INK, 10, 'center');
        bed(PANEL_L);
        bed(PANEL_R);
        const nL = Math.max(1, Math.round(shownN));
        drawBook(PANEL_L, nL, pageNow);
        drawBook(PANEL_R, COUNT_STEPS[0], wrapIdx(phase, COUNT_STEPS[0]));
    }
    function statusText() {
        if (calm()) {
            return 'More pages, thicker edge stripes';
        }
        return fill('Page {a} of {b}', String(pageNow + 1), String(Math.round(shownN)));
    }
    function onNav(d) {
        phase = Math.floor(phase + 1e-9) + d;
        pageNow = wrapIdx(phase, Math.max(1, Math.round(shownN)));
    }
    function onTake() { return; }
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
