<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スライドするほど色と金額の文言が段階で変わる決済確認スライダー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__scene" data-role="scene" role="group" aria-label="決済確認スライダーは押すほど塗りの色がうすいラベンダーから空色とミントに変わり、金額の文言が「スライドで確認」「もう少し」「離すと決済」に変わり、完了後にロード用のリングが回ってチェックで閉じます。下の小さな軌道は、指が軌道の外へ出てドラッグが途切れる誤った方式を見せます"></div>
  <p class="vj__status" data-role="status" aria-hidden="true">段階 1/3 · 進み具合 0%</p>
  <p class="vj__live" data-role="live" role="status" aria-live="off"></p>
  <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    const cls = (s) => s;
    const ICON = {
        'arrow-right': '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g></svg>',
        'caret-right': '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg>',
        'check-circle': '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0M232 128A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></svg>',
        'lock-simple-open': '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 96v112a8 8 0 0 1-8 8H48a8 8 0 0 1-8-8V96a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 80H96V56a32 32 0 0 1 32-32c15.37 0 29.2 11 32.16 25.59a8 8 0 0 0 15.68-3.18C171.32 24.15 151.2 8 128 8a48.05 48.05 0 0 0-48 48v24H48a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V96a16 16 0 0 0-16-16m0 128H48V96h160z"/></g></svg>',
        'lock-simple': '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 96v112a8 8 0 0 1-8 8H48a8 8 0 0 1-8-8V96a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 80h-32V56a48 48 0 0 0-96 0v24H48a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V96a16 16 0 0 0-16-16M96 56a32 32 0 0 1 64 0v24H96Zm112 152H48V96h160z"/></g></svg>',
        'power': '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M120 128V48a8 8 0 0 1 16 0v80a8 8 0 0 1-16 0m60.37-78.7a8 8 0 0 0-8.74 13.4C194.74 77.77 208 101.57 208 128a80 80 0 0 1-160 0c0-26.43 13.26-50.23 36.37-65.3a8 8 0 0 0-8.74-13.4C47.9 67.38 32 96.06 32 128a96 96 0 0 0 192 0c0-31.94-15.9-60.62-43.63-78.7"/></g></svg>'
    };
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function easeOut3(x) { const u = 1 - clamp(x, 0, 1); return 1 - u * u * u; }
    function easeInOut(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 꺾은선 — [시각, 값] 쌍 사이를 직선으로 잇고 양끝 바깥은 끝 값을 그대로 쓴다
    function ramp(t, pts) {
        if (t <= pts[0][0]) {
            return pts[0][1];
        }
        for (let i = 1; i < pts.length; i += 1) {
            if (t <= pts[i][0]) {
                return lerp(pts[i - 1][1], pts[i][1], (t - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]));
            }
        }
        return pts[pts.length - 1][1];
    }
    // 장면 시계(초)와 몇 번째 바퀴인가 — 바퀴마다 시연 손가락의 움직임이 달라져 완료와 되돌림이 번갈아 나온다
    let sceneT = 0;
    let cycle = 0;
    function mk(tag, name, parent) {
        const e = document.createElement(tag);
        e.className = cls(name);
        if (parent) {
            parent.appendChild(e);
        }
        return e;
    }
    function capAt(parent, text, topCqw, extra) {
        const c = mk('div', 'cap ' + extra, parent);
        c.textContent = text;
        c.style.top = topCqw + 'cqw';
        return c;
    }
    function icon(name, parent) {
        const s = mk('span', 'ico ico--' + name, parent);
        s.innerHTML = ICON[name];
        return s;
    }
    function q(role) {
        const e = root.querySelector('[data-role="' + role + '"]');
        if (!(e instanceof HTMLElement)) {
            throw new Error('missing ' + role);
        }
        return e;
    }
    const scene = q('scene');
    const pauseBtn = q('pause');
    const statusEl = q('status');
    const liveEl = q('live');
    // 손잡이 상태 — p 는 진행도(0 시작, 1 끝. 고무줄 늘어남은 1 초과, 스프링 오버슈트는 0 미만), v 는 진행도/초
    const M_IDLE = 0;
    const M_DRAG = 1;
    const M_BACK = 2;
    const M_FIN = 3;
    const M_DONE = 4;
    const sl = {
        p: 0, v: 0, mode: M_IDLE, down: false, fx: 0, vEma: 0, doneT: 0,
        ok: false, relP: 0, relV: 0, relT: -1,
        ptrDown: false, ptrX: 0, ptrStart: 0, ptrP0: 0
    };
    // 손가락 값을 손잡이가 따라가는 빠르기(1/초)와 속도 추정의 평활 빠르기(1/초)
    const FOLLOW = 40;
    const VEL_SMOOTH = 20;
    // 사람이 만진 장면이 완료된 뒤 처음으로 되돌리기까지(초)
    const DONE_HOLD_S = 1.8;
    // 방향키 한 번의 진행도 간격
    const KEY_STEP = 0.1;
    // 임계를 넘는 순간 놓지 않아도 자동 완료하는 장면만 켠다
    let autoCross = false;
    // 포인터 원시값(직선 트랙은 clientX, 호 슬라이더는 각도)과 진행도 환산 배율
    let rawFn = function (e) { return e.clientX; };
    let scaleFn = function () { return 0.01; };
    let handleEl = null;
    let shownStatus = '';
    function pushStatus(s) {
        if (s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let wasSettled = false;
    function isSettled() { return sl.mode === M_DONE; }
    function checkSettled() {
        const s = isSettled();
        if (s && !wasSettled) {
            liveEl.textContent = finalText();
        }
        wasSettled = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 알림 영역을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function fullReset() {
        sl.p = 0;
        sl.v = 0;
        sl.mode = M_IDLE;
        sl.down = false;
        sl.fx = 0;
        sl.vEma = 0;
        sl.doneT = 0;
        sl.ok = false;
        sl.relP = 0;
        sl.relV = 0;
        sl.relT = -1;
        sl.ptrDown = false;
        wasSettled = false;
        liveEl.textContent = '';
        reset();
    }
    function release() {
        sl.relP = sl.p;
        sl.relV = sl.vEma;
        sl.relT = sceneT;
        sl.ok = verdict(sl.p, sl.vEma);
        sl.v = sl.vEma;
        sl.mode = sl.ok ? M_FIN : M_BACK;
    }
    function stepPhysics(h) {
        const f = demo ? fingerAt(sceneT, cycle) : { down: sl.ptrDown, x: sl.ptrX };
        sl.fx = f.x;
        if (f.down && !sl.down && sl.mode < M_FIN) {
            sl.down = true;
            sl.mode = M_DRAG;
            sl.vEma = 0;
            sl.v = 0;
        }
        if (!f.down && sl.down) {
            sl.down = false;
            release();
        }
        if (sl.mode === M_DRAG) {
            const old = sl.p;
            sl.p += (mapDrag(f.x) - sl.p) * (1 - Math.exp(-h * FOLLOW));
            sl.vEma += ((sl.p - old) / h - sl.vEma) * (1 - Math.exp(-h * VEL_SMOOTH));
            if (autoCross && sl.p >= THRESH) {
                sl.down = false;
                sl.relP = sl.p;
                sl.relV = sl.vEma;
                sl.relT = sceneT;
                sl.ok = true;
                sl.v = sl.vEma;
                sl.mode = M_FIN;
            }
        }
        else if (sl.mode === M_BACK) {
            sl.v += (-SPR_K * sl.p - SPR_C * sl.v) * h;
            sl.p += sl.v * h;
            if (Math.abs(sl.p) < 0.002 && Math.abs(sl.v) < 0.03) {
                sl.p = 0;
                sl.v = 0;
                sl.mode = M_IDLE;
            }
        }
        else if (sl.mode === M_FIN) {
            sl.v += (FIN_K * (1 - sl.p) - FIN_C * sl.v) * h;
            sl.p += sl.v * h;
            if (Math.abs(1 - sl.p) < 0.002 && Math.abs(sl.v) < 0.05) {
                sl.p = 1;
                sl.v = 0;
                sl.mode = M_DONE;
                sl.doneT = 0;
            }
        }
        else if (sl.mode === M_DONE) {
            sl.doneT += h;
            if (!demo && sl.doneT > DONE_HOLD_S) {
                fullReset();
            }
        }
    }
    // 한 프레임을 1/240초 이하 조각으로 쪼개 쌓는다 — 프레임 간격이 달라도 스프링이 같은 곡선을 그린다
    function update(dt) {
        const n = Math.max(1, Math.ceil(dt * 240));
        const h = dt / n;
        for (let i = 0; i < n; i += 1) {
            stepPhysics(h);
            tick(h);
        }
    }
    // 한 프레임에 넘기는 시간 상한(초) — 오래 숨었다 돌아온 첫 프레임도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    function advance(dt) {
        sceneT += dt;
        if (demo && sceneT >= LOOP_S) {
            sceneT -= LOOP_S;
            cycle += 1;
            fullReset();
        }
        update(dt);
    }
    let shownText = '';
    let shownPc = -1;
    function paint() {
        draw();
        const txt = statusText();
        const pc = Math.round(clamp(sl.p, 0, 1) * 100);
        if (handleEl) {
            if (pc !== shownPc) {
                handleEl.setAttribute('aria-valuenow', String(pc));
                shownPc = pc;
            }
            if (txt !== shownText) {
                handleEl.setAttribute('aria-valuetext', txt);
                shownText = txt;
            }
        }
        pushStatus(txt);
        checkSettled();
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        paint();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 트윈 없이 잠금이 풀린 한 장
    function showRest() {
        stopLoop();
        sceneT = REST_T;
        fullReset();
        sl.p = 1;
        sl.mode = M_DONE;
        sl.doneT = 9;
        sl.ok = true;
        paint();
    }
    function play() {
        sceneT = 0;
        fullReset();
        paint();
        if (!paused) {
            startLoop();
        }
    }
    // 사람이 처음 손대면 시연을 끄고 알림 영역을 켠다. 멈춰 있었다면 다시 돌린다
    function wake() {
        if (paused) {
            paused = false;
            pauseBtn.setAttribute('aria-pressed', 'false');
        }
        if (demo) {
            demo = false;
            root.classList.remove('is-demo');
            liveEl.setAttribute('aria-live', 'polite');
            // 시연 손가락이 누르고 있었다면 떼고, 손잡이는 있던 자리에서 이어받는다
            if (sl.down) {
                sl.down = false;
                sl.mode = M_IDLE;
                sl.v = 0;
            }
        }
        if (!still) {
            startLoop();
        }
    }
    // 움직임 줄이기에서의 최종 상태 — 임계 판정에 따라 풀린 한 장 또는 처음 자리
    function settleNow() {
        if (sl.ok) {
            sl.p = 1;
            sl.mode = M_DONE;
            sl.doneT = 9;
        }
        else {
            sl.p = 0;
            sl.mode = M_IDLE;
        }
        sl.v = 0;
        sl.down = false;
        paint();
    }
    // 키보드 — 방향키로 한 칸씩, Home 은 처음으로, End·Enter·Space 는 끝까지(완료 뒤에 누르면 처음으로)
    function nudge(d) {
        if (sl.mode >= M_FIN) {
            return;
        }
        sl.down = false;
        sl.ptrDown = false;
        sl.v = 0;
        sl.mode = M_IDLE;
        sl.p = clamp(sl.p + d, 0, 1);
        if (sl.p >= THRESH) {
            sl.ok = true;
            sl.relT = sceneT;
            if (still) {
                settleNow();
            }
            else {
                sl.mode = M_FIN;
            }
        }
        else {
            paint();
        }
    }
    function toStart() {
        if (still || sl.mode === M_DONE) {
            fullReset();
            paint();
            return;
        }
        sl.down = false;
        sl.ptrDown = false;
        sl.mode = sl.p > 0.002 ? M_BACK : M_IDLE;
    }
    function completeNow() {
        if (sl.mode === M_DONE) {
            fullReset();
            paint();
            return;
        }
        if (sl.mode === M_FIN) {
            return;
        }
        sl.down = false;
        sl.ptrDown = false;
        sl.ok = true;
        sl.relT = sceneT;
        if (still) {
            settleNow();
        }
        else {
            sl.mode = M_FIN;
            sl.v = 0;
        }
    }
    function wireHandle(h, label) {
        handleEl = h;
        h.setAttribute('role', 'slider');
        h.setAttribute('tabindex', '0');
        h.setAttribute('aria-label', label);
        h.setAttribute('aria-valuemin', '0');
        h.setAttribute('aria-valuemax', '100');
        h.setAttribute('aria-valuenow', '0');
        h.addEventListener('pointerdown', function (e) {
            if (e.pointerType === 'mouse' && e.button !== 0) {
                return;
            }
            wake();
            if (still && sl.mode === M_DONE) {
                fullReset();
            }
            if (sl.mode >= M_FIN) {
                return;
            }
            e.preventDefault();
            h.setPointerCapture(e.pointerId);
            h.focus({ preventScroll: true });
            sl.ptrDown = true;
            sl.ptrStart = rawFn(e);
            sl.ptrP0 = clamp(sl.p, 0, 1);
            sl.ptrX = sl.ptrP0;
            sl.down = false;
            if (still) {
                sl.mode = M_DRAG;
                paint();
            }
        }, { signal: off.signal });
        h.addEventListener('pointermove', function (e) {
            if (!sl.ptrDown) {
                return;
            }
            sl.ptrX = sl.ptrP0 + (rawFn(e) - sl.ptrStart) * scaleFn();
            if (still) {
                sl.p = clamp(mapDrag(sl.ptrX), 0, 1);
                sl.mode = M_DRAG;
                paint();
            }
        }, { signal: off.signal });
        const up = function () {
            if (!sl.ptrDown) {
                return;
            }
            sl.ptrDown = false;
            if (still) {
                sl.ok = verdict(sl.p, 0);
                settleNow();
            }
        };
        h.addEventListener('pointerup', up, { signal: off.signal });
        h.addEventListener('pointercancel', up, { signal: off.signal });
        h.addEventListener('keydown', function (e) {
            if (e.altKey || e.ctrlKey || e.metaKey) {
                return;
            }
            let hit = true;
            if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
                wake();
                nudge(KEY_STEP);
            }
            else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
                wake();
                nudge(-KEY_STEP);
            }
            else if (e.key === 'Home') {
                wake();
                toStart();
            }
            else if (e.key === 'End' || e.key === 'Enter' || e.key === ' ') {
                wake();
                completeNow();
            }
            else {
                hit = false;
            }
            if (hit) {
                e.preventDefault();
            }
        }, { signal: off.signal });
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 풀린 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    // 직선 트랙 — 손잡이가 움직이는 거리(cqw)는 트랙 폭에서 손잡이 폭과 양쪽 여백을 뺀 값
    function travelCqw() { return TRACK_CQW - HANDLE_CQW - 2 * PAD_CQW; }
    function rootW() { return root.clientWidth || 480; }
    // 포인터 이동 px 를 진행도로 — 1 이 트랙 끝
    function linearScale() { return 100 / (travelCqw() * rootW()); }
    scaleFn = linearScale;
    // 무대 안에서 가로 가운데, 위에서 topCqw 에 트랙을 놓는다. scale 이 1 보다 작으면 같은 좌표계를 줄여 아래에 작게 깐다
    function makeLin(parent, extra, labelText, topCqw, scale) {
        const track = mk('div', 'sl ' + extra, parent);
        track.style.width = TRACK_CQW + 'cqw';
        track.style.left = ((100 - TRACK_CQW) / 2).toFixed(2) + 'cqw';
        track.style.top = topCqw + 'cqw';
        if (scale !== 1) {
            track.style.transform = 'scale(' + scale + ')';
            track.setAttribute('aria-hidden', 'true');
        }
        const bg = mk('div', 'sl__bg', track);
        const fill = mk('div', 'sl__fill', bg);
        const label = mk('div', 'sl__label', bg);
        label.textContent = labelText;
        const handle = mk('div', 'sl__handle', track);
        handle.style.left = PAD_CQW + 'cqw';
        handle.style.top = PAD_CQW + 'cqw';
        handle.style.width = HANDLE_CQW + 'cqw';
        handle.style.height = HANDLE_CQW + 'cqw';
        const ico = icon('arrow-right', handle);
        return { track: track, bg: bg, fill: fill, label: label, handle: handle, ico: ico };
    }
    function placeHandle(l, p) {
        l.handle.style.transform = 'translateX(' + (p * travelCqw()).toFixed(3) + 'cqw)';
        const end = PAD_CQW + p * travelCqw() + HANDLE_CQW / 2;
        l.fill.style.transform = 'translateX(' + (Math.max(end, 0) - TRACK_CQW).toFixed(3) + 'cqw)';
    }
    // 트랙 안 x(진행도) 의 가운데 가로 위치(cqw, 트랙 왼쪽 끝 기준)
    function xOf(p) { return PAD_CQW + p * travelCqw() + HANDLE_CQW / 2; }
    const LOOP_S = 4.0;
    const REST_T = 3.5;
    const TRACK_CQW = 72;
    const HANDLE_CQW = 12.5;
    const PAD_CQW = 1.25;
    const THRESH = 0.8;
    const SPR_K = 120;
    const SPR_C = 14;
    const FIN_K = 150;
    const FIN_C = 22;
    // 단계 경계 — 진행도가 이 값을 지나면 채움 색과 안내 문구가 바뀐다
    const STAGE_1 = 0.33;
    const STAGE_2 = 0.7;
    // 단계 사이 색이 섞이는 폭(진행도)
    const BLEND_W = 0.12;
    // 완료 뒤 로딩 링이 도는 시간(초), 링이 한 바퀴 도는 시간(초)
    const SPIN_S = 0.9;
    const SPIN_TURN_S = 0.8;
    // 나쁜 쪽 — 손가락이 이 위치를 지나면 트랙 밖으로 나간 것으로 보고 끌기가 끊긴다
    const LEAVE_X = 0.55;
    const COLORS = [[185, 160, 255], [110, 200, 255], [76, 212, 166]];
    const AMOUNT = '1,280円';
    const HANDLE_LABEL = '決済確認のつまみ — 右へスライドして確認';
    let main;
    let mini;
    let spinner;
    let check;
    let badP = 0;
    let lost = false;
    function mapDrag(x) { return clamp(x, 0, 1); }
    function verdict(p, v) { void v; return p >= THRESH; }
    // 시연 손가락 — 짝수 바퀴는 끝까지 밀어 결제 확인, 홀수 바퀴는 반쯤에서 놓는다
    function fingerAt(t, c) {
        if (c % 2 === 0) {
            return { down: t >= 0.2 && t < 1.35, x: ramp(t, [[0.2, 0], [1.2, 1]]) };
        }
        return { down: t >= 0.2 && t < 1.3, x: ramp(t, [[0.2, 0], [1.2, 0.5]]) };
    }
    // 진행도 → 채움 색 — 세 단계 색을 경계 BLEND_W 폭에서만 섞는다
    function stageColor(p) {
        const a = easeInOut((p - STAGE_1 + BLEND_W / 2) / BLEND_W);
        const b = easeInOut((p - STAGE_2 + BLEND_W / 2) / BLEND_W);
        const c = [0, 0, 0];
        for (let i = 0; i < 3; i += 1) {
            const m1 = lerp(COLORS[0][i], COLORS[1][i], a);
            c[i] = Math.round(lerp(m1, COLORS[2][i], b));
        }
        return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
    }
    function stageText(p) {
        if (p >= STAGE_2) {
            return '{a} 離すと決済'.replace('{a}', AMOUNT);
        }
        if (p >= STAGE_1) {
            return '{a} もう少し'.replace('{a}', AMOUNT);
        }
        return '{a} スライドで確認'.replace('{a}', AMOUNT);
    }
    function build() {
        scene.textContent = '';
        capAt(scene, '押すほど色と案内文が段階で変わる', 11, '');
        main = makeLin(scene, 'sl--stages', stageText(0), 21, 1);
        spinner = mk('div', 'spin', main.handle);
        check = icon('check-circle', main.handle);
        wireHandle(main.handle, HANDLE_LABEL);
        capAt(scene, '指が軌道の外へ出るとドラッグが途切れる', 40, 'cap--bad');
        mini = makeLin(scene, 'sl--mini sl--bad', '', 46, 0.6);
    }
    function reset() { badP = 0; lost = false; }
    function tick(h) {
        void h;
        if (sl.down && !lost) {
            if (sl.fx >= LEAVE_X) {
                lost = true;
            }
            else {
                badP = clamp(sl.fx, 0, 1);
            }
        }
    }
    function draw() {
        placeHandle(main, sl.p);
        placeHandle(mini, badP);
        const p = clamp(sl.p, 0, 1);
        const t = sl.mode === M_DONE ? sl.doneT : -1;
        main.fill.style.background = stageColor(p);
        // 완료 직후에는 로딩 링이 돌고, 다 돌면 체크로 닫힌다
        const spin = t >= 0 && t < SPIN_S;
        const ok = t >= SPIN_S;
        spinner.style.opacity = spin ? '1' : '0';
        spinner.style.transform = 'rotate(' + ((t / SPIN_TURN_S) * 360).toFixed(1) + 'deg)';
        main.ico.style.opacity = t >= 0 ? '0' : '1';
        check.style.opacity = ok ? '1' : '0';
        check.style.transform = 'scale(' + (ok ? 0.6 + 0.4 * easeOut3((t - SPIN_S) / 0.25) : 0.6).toFixed(3) + ')';
        const txt = ok ? '決済完了' : (spin ? '決済中' : stageText(p));
        if (main.label.textContent !== txt) {
            main.label.textContent = txt;
        }
    }
    function statusText() {
        const p = clamp(sl.p, 0, 1);
        const st = p >= STAGE_2 ? 3 : (p >= STAGE_1 ? 2 : 1);
        return '段階 {s}/3 · 進み具合 {n}%'.replace('{s}', String(st)).replace('{n}', String(Math.round(p * 100)));
    }
    function finalText() { return '決済が確認されました'; }
    build();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
