<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimistic like with rollback — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <button class="like is-demo" type="button" aria-pressed="false" aria-label="Thích">
    <span class="like__icon" aria-hidden="true">
      <span class="like__heart like__heart--base"></span>
      <span class="like__heart like__heart--fill"></span>
    </span>
    <span class="like__count" aria-hidden="true">
      <span class="like__count-track">
        <span class="like__count-num">12</span>
        <span class="like__count-num">13</span>
      </span>
    </span>
  </button>
</main>
<script>
// 실제 클릭: 서버 응답 없이 즉시 Thích 표시 → 0.8초 뒤 실패했다고 가정하고 되돌린다.
var b = document.querySelector('.like');
b.addEventListener('click', function () {
  b.classList.remove('is-demo');
  var liked = b.classList.toggle('is-liked');
  b.setAttribute('aria-pressed', liked);
  if (liked) setTimeout(function () { b.classList.remove('is-liked'); b.setAttribute('aria-pressed', 'false'); }, 800);
});
</script>
</body>
</html>
