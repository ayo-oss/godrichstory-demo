<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeleton to content crossfade — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="card is-demo">
    <div class="card__layer card__layer--skeleton" aria-hidden="true">
      <span class="sk sk--avatar"></span>
      <span class="card__col">
        <span class="sk sk--title"></span>
        <span class="sk sk--line"></span>
        <span class="sk sk--line sk--line--short"></span>
      </span>
    </div>
    <div class="card__layer card__layer--content">
      <span class="avatar"></span>
      <span class="card__col">
        <p class="title">タイトルテキスト</p>
        <p class="body">本文の内容がここに表示されます</p>
      </span>
    </div>
  </div>
</main>
</body>
</html>
