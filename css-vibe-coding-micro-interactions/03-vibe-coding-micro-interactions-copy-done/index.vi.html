<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy-done feedback — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <button class="copy is-demo" type="button">
    <span class="copy__icon" aria-hidden="true">
      <span class="copy__ring"></span>
      <span class="copy__sheet copy__sheet--back"></span>
      <span class="copy__sheet copy__sheet--front"></span>
      <span class="copy__check">
        <span class="copy__check-bar copy__check-bar--short"></span>
        <span class="copy__check-bar copy__check-bar--long"></span>
      </span>
    </span>
    <span class="copy__label">Sao chép mã</span>
    <span class="copy__tip" role="status">Đã sao chép</span>
  </button>
</main>
<script>
// 실제 클릭에도 같은 상태(.is-copied)로 반응한다. 데모(.is-demo)는 손을 대면 멈춘다.
document.querySelector('.copy').addEventListener('click', function (e) {
  var b = e.currentTarget;
  b.classList.remove('is-demo');
  b.classList.remove('is-copied');
  void b.offsetWidth;
  b.classList.add('is-copied');
});
</script>
</body>
</html>
