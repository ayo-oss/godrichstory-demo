<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toast stacking — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="toasts">
    <button class="toasts__trigger" type="button">Send notification</button>
    <div class="toasts__list is-demo" aria-live="polite">
      <div class="toast toast--1">Saved</div>
      <div class="toast toast--2">Upload complete</div>
      <div class="toast toast--3">New message</div>
    </div>
  </div>
</main>
<script>
// 실제 클릭 한 번마다 토스트를 하나씩 다시 쌓는다. 데모(.is-demo) 자동 루프는 손을 대면 멈춘다.
var list = document.querySelector('.toasts__list');
document.querySelector('.toasts__trigger').addEventListener('click', function () {
  list.classList.remove('is-demo');
  list.classList.remove('is-replaying');
  void list.offsetWidth;
  list.classList.add('is-replaying');
});
</script>
</body>
</html>
