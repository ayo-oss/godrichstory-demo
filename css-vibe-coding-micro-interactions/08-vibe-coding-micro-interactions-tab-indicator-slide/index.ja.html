<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab indicator slide — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <nav class="tabs is-demo" role="tablist">
    <button class="tabs__item is-active" type="button" role="tab" aria-selected="true">概要</button>
    <button class="tabs__item" type="button" role="tab" aria-selected="false">設定</button>
    <button class="tabs__item" type="button" role="tab" aria-selected="false">お支払い</button>
    <span class="tabs__indicator" aria-hidden="true"></span>
  </nav>
</main>
<script>
// 실제 클릭: 누른 탭으로 인디케이터가 옮겨간다. 데모(.is-demo) 루프는 클릭하면 멈춘다.
var tabs = document.querySelectorAll('.tabs__item');
var nav = document.querySelector('.tabs');
tabs.forEach(function (t, i) {
  t.addEventListener('click', function () {
    nav.classList.remove('is-demo');
    tabs.forEach(function (x) { x.classList.remove('is-active'); x.setAttribute('aria-selected', 'false'); });
    t.classList.add('is-active');
    t.setAttribute('aria-selected', 'true');
    nav.style.setProperty('--i', i);
  });
});
</script>
</body>
</html>
