<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input error shake — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="field is-demo">
    <div class="field__frame">
      <input class="field__input" type="email" placeholder="メールアドレス" readonly>
      <span class="field__ring" aria-hidden="true"></span>
    </div>
    <p class="field__msg" role="alert">メールアドレスの形式が正しくありません。</p>
  </div>
</main>
<script>
// 실제 제출 실패 시 이 클래스를 켠다. 데모(.is-demo) 루프는 클릭하면 멈추고 수동 재생으로 바뀐다.
document.querySelector('.field').addEventListener('click', function (e) {
  var f = e.currentTarget;
  f.classList.remove('is-demo');
  f.classList.remove('is-error');
  void f.offsetWidth;
  f.classList.add('is-error');
});
</script>
</body>
</html>
