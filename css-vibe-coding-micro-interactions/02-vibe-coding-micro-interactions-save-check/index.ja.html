<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save-to-check animation — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <button class="save is-demo" type="button">
    <span class="save__icon" aria-hidden="true">
      <span class="save__ring"></span>
      <span class="save__disk"></span>
      <span class="save__check">
        <span class="save__check-bar save__check-bar--short"></span>
        <span class="save__check-bar save__check-bar--long"></span>
      </span>
    </span>
    <span class="save__label">保存</span>
  </button>
</main>
<script>
// 실제 클릭 한 번 = 保存 완료 한 번. 데모(.is-demo) 루프는 손을 대면 멈추고 수동 상태로 바뀐다.
document.querySelector('.save').addEventListener('click', function (e) {
  var b = e.currentTarget;
  b.classList.remove('is-demo');
  b.classList.remove('is-saved');
  void b.offsetWidth;
  b.classList.add('is-saved');
});
</script>
</body>
</html>
