<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — hover caption overlay</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="gallery is-demo" aria-label="Photo gallery">
    <li class="tile" tabindex="0">
      <span class="tile__media" aria-hidden="true"></span>
      <div class="tile__caption">
        <h3 class="tile__title">Sunset beach</h3>
        <p class="tile__desc">Shot at 6 PM</p>
      </div>
    </li>
    <li class="tile" tabindex="0">
      <span class="tile__media tile__media--b" aria-hidden="true"></span>
      <div class="tile__caption">
        <h3 class="tile__title">Cabin in the woods</h3>
        <p class="tile__desc">Early morning walk</p>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
