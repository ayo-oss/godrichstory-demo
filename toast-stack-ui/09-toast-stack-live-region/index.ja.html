<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polite and assertive live regions — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="lr is-demo">
    <div class="lr__grid">
      <div class="lr__col is-live" data-lane="polite">
        <span class="lr__tag"><code>role="status"</code> 順番を待つ</span>
        <p class="lr__card" role="status" aria-live="polite" aria-atomic="true" aria-label="丁寧な通知のレーン">
          <span class="lr__dot" aria-hidden="true"></span>
          <span class="lr__msg">メールを送りました</span>
        </p>
      </div>
      <div class="lr__col" data-lane="alert">
        <span class="lr__tag"><code>role="alert"</code> 割り込む</span>
        <p class="lr__card" role="alert" aria-live="assertive" aria-atomic="true" aria-label="緊急の通知のレーン">
          <span class="lr__dot" aria-hidden="true"></span>
          <span class="lr__msg">決済が拒否されました</span>
        </p>
      </div>
    </div>
    <div class="lr__say" id="lr-say" data-lane="polite">
      <span class="lr__wave" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="lr__saycap">読み上げ中</span>
      <span class="lr__saytxt">
        <span class="lr__sayone" data-lane="polite">メールを送りました</span>
        <span class="lr__sayone" data-lane="alert">決済が拒否されました</span>
      </span>
    </div>
    <div class="lr__btns">
      <button class="lr__btn" type="button" data-lane="polite">通常の通知</button>
      <button class="lr__btn" type="button" data-lane="alert">エラー通知</button>
    </div>
  </div>
</main>
<script>
// 실제 동작: 같은 글자를 다시 넣어야 스크린리더가 한 번 더 읽는다. 오류만 assertive 줄로 보내 읽던 문장을 끊는다
var root = document.querySelector('.lr');
var cols = [].slice.call(document.querySelectorAll('.lr__col'));
var say = document.getElementById('lr-say');
function send(lane) {
  root.classList.remove('is-demo');
  var col = cols.filter(function (c) { return c.getAttribute('data-lane') === lane; })[0];
  cols.forEach(function (c) { c.classList.toggle('is-live', c === col); });
  say.setAttribute('data-lane', lane); // 화면에도 지금 읽히는 문장을 그대로 보여 준다
  var msg = col.querySelector('.lr__msg');
  var text = msg.textContent;
  msg.textContent = '';
  setTimeout(function () { msg.textContent = text; }, 40);
}
[].forEach.call(document.querySelectorAll('.lr__btn'), function (b) {
  b.addEventListener('click', function () { send(b.getAttribute('data-lane')); });
});
</script>
</body>
</html>
