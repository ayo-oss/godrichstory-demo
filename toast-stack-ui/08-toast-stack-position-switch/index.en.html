<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switching the toast corner — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ps is-demo">
    <div class="ps__screen" id="ps-screen" data-pos="br">
      <span class="ps__bar" aria-hidden="true"><i></i><i></i><i></i></span>
      <div class="ps__toasts" id="ps-toasts" role="region" aria-label="Where toasts appear">
        <span class="ps__toast">
          <span class="ps__dot" aria-hidden="true"></span>
          <span class="ps__msg">Link copied</span>
        </span>
        <span class="ps__toast">
          <span class="ps__dot" aria-hidden="true"></span>
          <span class="ps__msg">Draft saved</span>
        </span>
      </div>
    </div>
    <div class="ps__pads" role="group" aria-label="Pick where toasts appear">
      <button class="ps__pad" type="button" data-pos="tl" aria-pressed="false" aria-label="Top left"><span></span></button>
      <button class="ps__pad" type="button" data-pos="tc" aria-pressed="false" aria-label="Top center"><span></span></button>
      <button class="ps__pad" type="button" data-pos="tr" aria-pressed="false" aria-label="Top right"><span></span></button>
      <button class="ps__pad" type="button" data-pos="bl" aria-pressed="false" aria-label="Bottom left"><span></span></button>
      <button class="ps__pad" type="button" data-pos="bc" aria-pressed="false" aria-label="Bottom center"><span></span></button>
      <button class="ps__pad" type="button" data-pos="br" aria-pressed="true" aria-label="Bottom right"><span></span></button>
    </div>
  </div>
</main>
<script>
// 실제 동작: 화면의 data-pos 한 글자쌍이 알림 묶음의 inset 과 쌓이는 방향을 한꺼번에 정한다
var root = document.querySelector('.ps');
var screen = document.getElementById('ps-screen');
var pads = [].slice.call(document.querySelectorAll('.ps__pad'));
pads.forEach(function (b) {
  b.addEventListener('click', function () {
    var pos = b.getAttribute('data-pos');
    root.classList.remove('is-demo');
    screen.setAttribute('data-pos', pos);
    pads.forEach(function (o) { o.setAttribute('aria-pressed', String(o.getAttribute('data-pos') === pos)); });
  });
});
</script>
</body>
</html>
