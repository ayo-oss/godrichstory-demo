<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分解図ホバー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ev" id="ev">
  <p class="ev__hint">ホバーすると層ごとにtranslateZ(--tz)の間隔が開きます — 層の数だけ同じ間隔を掛けた値です</p>
  <div class="ev__field" role="group" tabindex="0" aria-label="ホバーすると4つの層が上に開く分解図、離すと再び重なる場面" id="field">
    <div class="ev__world" id="world"></div>
  </div>
  <p class="ev__meta">層間隔  <b id="gap">0</b>px</p>
</div>
</main>
<script>
// 분해도 호버(06) — 층 i 의 목표 translateZ 는 i * GAP 로 한 번만 정해 둔다. 실제 사용자는
// :hover/:focus-visible 로 켠다(진짜 transition). 캡처(headless)에는 포인터가 없으므로
// setInterval 로 같은 클래스(is-open)를 2초 주기로 여닫아 같은 transition 을 재생시킨다 —
// 페이지 로드 150ms 시점엔 아직 켜지지 않아 애니메이션 0개로 시작하고, 실시간으로 진행된다.
(function () {
  var root = document.getElementById('ev');
  var field = document.getElementById('field');
  var world = document.getElementById('world');
  var gapEl = document.getElementById('gap');
  if (!root || !field || !world || !gapEl) return;

  var mm = window.matchMedia('(max-width: 340px)').matches;
  var GAP = mm ? 12 : 18;
  gapEl.textContent = String(GAP);

  var LAYERS = [
    { name: 'roof', w: 96 },
    { name: 'attic', w: 84 },
    { name: 'room', w: 84 },
    { name: 'floor', w: 96 }
  ];

  for (var i = 0; i < LAYERS.length; i++) {
    var layer = document.createElement('div');
    layer.className = 'ev__layer ev__layer--' + LAYERS[i].name;
    layer.style.setProperty('--w', (mm ? LAYERS[i].w * 0.78 : LAYERS[i].w) + 'px');
    // 역순 — 지붕(roof)이 가장 위 층이라 벌어질 때 가장 많이 올라가야 한다
    layer.style.setProperty('--tz-open', (GAP * (LAYERS.length - i)) + 'px');
    world.appendChild(layer);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    root.classList.add('is-still');
    return;
  }

  var open = false;
  function toggle() {
    open = !open;
    field.classList.toggle('is-open', open);
  }
  setInterval(toggle, 1000);   // 1초마다 여닫기 — 2초 캡처 창에 정확히 한 번의 열림+닫힘
})();
</script>
</body>
</html>
