<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面シェーディング — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fs" id="fs">
  <p class="fs__hint">面の法線と光源ベクトルの内積で明るさを求めfilter: brightness()に代入します — 光源が回ると3つの面が順に明るくなります</p>
  <div class="fs__field" role="img" aria-label="光源が立方体の周りを回り、3面の明るさが計算で変わる場面">
    <div class="fs__ground"></div>
    <div class="fs__sun" id="sun"></div>
    <div class="fs__cube3d" id="cube"></div>
  </div>
  <div class="fs__readout">
    <span class="fs__stat">上面  <b id="pTop">100</b>%</span>
    <span class="fs__stat">右面  <b id="pRight">70</b>%</span>
    <span class="fs__stat">左面  <b id="pFront">45</b>%</span>
  </div>
</div>
</main>
<script>
// 면 셰이딩(03) — 세 면의 법선(top·right·left)과 광원 벡터의 내적(dot product)을 매 프레임
// 계산해 밝기 비율을 구하고 filter: brightness() 에 대입한다. 광원 각도(theta) 하나만
// 회전시켜도 세 면 전부의 명도가 같은 계산식으로 다시 나온다 — CSS @keyframes 는 없다.
(function () {
  var root = document.getElementById('fs');
  var cube = document.getElementById('cube');
  var sun = document.getElementById('sun');
  var pTop = document.getElementById('pTop');
  var pRight = document.getElementById('pRight');
  var pFront = document.getElementById('pFront');
  if (!root || !cube || !sun || !pTop || !pRight || !pFront) return;

  function buildCube(mount, size) {
    var defs = [
      { cls: 'fs__face fs__face--top', t: 'rotateX(90deg) translateZ(' + (size / 2) + 'px)' },
      { cls: 'fs__face fs__face--right', t: 'rotateY(90deg) translateZ(' + (size / 2) + 'px)' },
      { cls: 'fs__face fs__face--front', t: 'translateZ(' + (size / 2) + 'px)' }
    ];
    var out = {};
    for (var i = 0; i < defs.length; i++) {
      var f = document.createElement('div');
      f.className = defs[i].cls;
      f.style.width = size + 'px'; f.style.height = size + 'px';
      f.style.transform = defs[i].t;
      mount.appendChild(f);
      out[defs[i].cls.split('--')[1]] = f;
    }
    return out;
  }

  var mm = window.matchMedia('(max-width: 340px)').matches;
  var SIZE = mm ? 62 : 88;
  var TILT = -35.264, SPIN = 45;
  cube.style.transform = 'rotateX(' + TILT + 'deg) rotateZ(' + SPIN + 'deg)';
  var faces = buildCube(cube, SIZE);

  // 세 면의 법선 — 큐브 로컬 좌표계 기준(上面  +z, 右面  +x, 左面  +y)
  var N_TOP = [0, 0, 1], N_RIGHT = [1, 0, 0], N_FRONT = [0, 1, 0];

  function dot3(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function shade(theta) {
    var r = theta * Math.PI / 180;
    var raw = [Math.cos(r), Math.sin(r), 0.55];
    var len = Math.sqrt(raw[0] * raw[0] + raw[1] * raw[1] + raw[2] * raw[2]);
    var L = [raw[0] / len, raw[1] / len, raw[2] / len];
    var bTop = 0.32 + 0.92 * clamp(dot3(N_TOP, L), 0, 1);
    var bRight = 0.32 + 0.92 * clamp(dot3(N_RIGHT, L), 0, 1);
    var bFront = 0.32 + 0.92 * clamp(dot3(N_FRONT, L), 0, 1);
    faces.top.style.filter = 'brightness(' + bTop.toFixed(2) + ')';
    faces.right.style.filter = 'brightness(' + bRight.toFixed(2) + ')';
    faces.front.style.filter = 'brightness(' + bFront.toFixed(2) + ')';
    pTop.textContent = String(Math.round(bTop * 100));
    pRight.textContent = String(Math.round(bRight * 100));
    pFront.textContent = String(Math.round(bFront * 100));
    var R = mm ? 58 : 84;
    sun.style.setProperty('--sx', (Math.cos(r) * R).toFixed(1) + 'px');
    sun.style.setProperty('--sy', (Math.sin(r) * R * 0.5).toFixed(1) + 'px');
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    shade(35);
    root.classList.add('is-still');
  } else {
    var start = performance.now();
    (function step(now) {
      var t = (now - start) / 1000;
      shade((t * 40) % 360);   // 초당 40도 — 9초에 광원이 한 바퀴 돈다
      requestAnimationFrame(step);
    })(start);
  }
})();
</script>
</body>
</html>
