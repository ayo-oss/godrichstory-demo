<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뜨는 라벨 입력창 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="fl is-demo" id="wrap">
    <div class="fl__control">
      <input class="fl__input" id="fl-name" type="text" placeholder=" ">
      <label class="fl__label" for="fl-name">Name</label>
    </div>
  </div>
</main>
<script>
(function () {
  var wrap = document.getElementById('wrap');
  var input = document.getElementById('fl-name');

  function stopDemo() {
    if (!wrap.classList.contains('is-demo')) return;
    wrap.classList.remove('is-demo');
    clearInterval(timer);
  }
  input.addEventListener('pointerdown', stopDemo);
  input.addEventListener('keydown', stopDemo);

  function fireInput() {
    input.dispatchEvent(new Event('input', { bubbles: true }));
  }

  var word = 'Jane Doe';
  var chars = '';
  var phase = 'focus';
  var pauseUntil = 0;

  var timer = setInterval(function () {
    var now = Date.now();
    if (now < pauseUntil) return;

    if (phase === 'focus') {
      input.focus({ preventScroll: true });
      phase = 'type';
      return;
    }
    if (phase === 'type') {
      if (chars.length < word.length) {
        chars += word[chars.length];
        input.value = chars;
        fireInput();
      } else {
        phase = 'hold';
        pauseUntil = now + 260;
      }
      return;
    }
    if (phase === 'hold') {
      phase = 'clear';
      return;
    }
    if (phase === 'clear') {
      chars = '';
      input.value = '';
      fireInput();
      input.blur();
      phase = 'blurhold';
      pauseUntil = now + 220;
      return;
    }
    if (phase === 'blurhold') {
      phase = 'focus';
    }
  }, 90);
})();
</script>
</body>
</html>
