<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>날짜 자동 슬래시 입력창 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="dt is-demo" id="wrap">
    <label class="dt__label" for="dt-input">Birthdate</label>
    <input class="dt__input" id="dt-input" type="text" inputmode="numeric" placeholder="YYYY/MM/DD" aria-describedby="dt-hint">
    <p class="dt__hint" id="dt-hint">Type digits only — slashes are added automatically</p>
  </div>
</main>
<script>
(function () {
  var wrap = document.getElementById('wrap');
  var input = document.getElementById('dt-input');

  function format(raw) {
    var digits = raw.replace(/\D/g, '').slice(0, 8);
    var out = digits.slice(0, 4);
    if (digits.length > 4) out += '/' + digits.slice(4, 6);
    if (digits.length > 6) out += '/' + digits.slice(6, 8);
    return out;
  }

  input.addEventListener('input', function () {
    input.value = format(input.value);
  });

  function stopDemo() {
    if (!wrap.classList.contains('is-demo')) return;
    wrap.classList.remove('is-demo');
    clearInterval(timer);
  }
  input.addEventListener('pointerdown', stopDemo);
  input.addEventListener('keydown', stopDemo);

  var digits = '20260911';
  var raw = '';
  var phase = 'focus';
  var pauseUntil = 0;

  var timer = setInterval(function () {
    var now = Date.now();
    if (now < pauseUntil) return;

    if (phase === 'focus') {
      input.focus({ preventScroll: true });
      phase = 'type';
      return;
    }
    if (phase === 'type') {
      if (raw.length < digits.length) {
        raw += digits[raw.length];
        input.value = raw;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      } else {
        phase = 'hold';
        pauseUntil = now + 900;
      }
      return;
    }
    if (phase === 'hold') {
      raw = '';
      input.value = '';
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.blur();
      phase = 'blurhold';
      pauseUntil = now + 500;
      return;
    }
    if (phase === 'blurhold') {
      phase = 'focus';
    }
  }, 140);
})();
</script>
</body>
</html>
