<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국가 코드 선택 Phone number 입력창 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="phone is-demo" id="wrap">
    <span class="phone__label" id="phone-label">Phone number</span>
    <div class="phone__row">
      <div class="phone__trigger-wrap">
        <button type="button" class="phone__trigger" id="trigger"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="listbox"
                aria-label="Select country, currently South Korea">
          <span class="phone__flag" aria-hidden="true">🇰🇷</span>
          <span class="phone__dial">+82</span>
          <span class="phone__chevron" aria-hidden="true"></span>
        </button>
        <ul class="phone__listbox" id="listbox" role="listbox" aria-label="Country list" tabindex="-1" hidden>
          <li role="option" id="opt-kr" class="phone__option" data-code="kr" aria-selected="true">
            <span aria-hidden="true">🇰🇷</span> South Korea <span class="phone__option-dial">+82</span>
          </li>
          <li role="option" id="opt-us" class="phone__option" data-code="us" aria-selected="false">
            <span aria-hidden="true">🇺🇸</span> United States <span class="phone__option-dial">+1</span>
          </li>
          <li role="option" id="opt-jp" class="phone__option" data-code="jp" aria-selected="false">
            <span aria-hidden="true">🇯🇵</span> Japan <span class="phone__option-dial">+81</span>
          </li>
        </ul>
      </div>
      <input class="phone__input" id="number" type="text" inputmode="numeric" placeholder="10 1234 5678" aria-labelledby="phone-label" aria-describedby="phone-hint">
    </div>
    <p class="phone__hint" id="phone-hint">Arrow keys to pick a country · Enter to confirm</p>
  </div>
</main>
<script>
(function () {
  var COUNTRIES = {
    kr: { name: 'South Korea', flag: '🇰🇷', dial: '+82', groups: [3, 4, 4], sample: '1012345678' },
    us: { name: 'United States',     flag: '🇺🇸', dial: '+1',  groups: [3, 3, 4], sample: '2025551234' },
    jp: { name: 'Japan',     flag: '🇯🇵', dial: '+81', groups: [2, 4, 4], sample: '9012345678' }
  };
  var ORDER = ['kr', 'us', 'jp'];

  var wrap = document.getElementById('wrap');
  var trigger = document.getElementById('trigger');
  var listbox = document.getElementById('listbox');
  var input = document.getElementById('number');
  var options = Array.prototype.slice.call(listbox.querySelectorAll('.phone__option'));

  var current = 'kr';
  var active = 0;     // 키보드로 강조된 옵션 인덱스 (열려있을 때만 의미 있음)
  var open = false;
  var hideTimer = null;

  function maxDigits(code) {
    var g = COUNTRIES[code].groups, total = 0;
    for (var i = 0; i < g.length; i++) total += g[i];
    return total;
  }

  function formatDigits(digits, groups) {
    var out = [], i = 0;
    for (var g = 0; g < groups.length && i < digits.length; g++) {
      out.push(digits.slice(i, i + groups[g]));
      i += groups[g];
    }
    return out.join(' ');
  }

  function reformatInput() {
    var digits = input.value.replace(/\D/g, '').slice(0, maxDigits(current));
    input.value = formatDigits(digits, COUNTRIES[current].groups);
  }

  function highlight(i) {
    active = i;
    options.forEach(function (o, idx) { o.classList.toggle('phone__option--active', idx === i); });
    trigger.setAttribute('aria-activedescendant', options[i].id);
  }

  function openListbox() {
    if (open) return;
    open = true;
    clearTimeout(hideTimer);
    listbox.hidden = false;
    void listbox.offsetWidth;               // 강제 리플로우 — hidden 해제와 애니메이션을 분리
    listbox.classList.add('is-open');
    trigger.setAttribute('aria-expanded', 'true');
    highlight(ORDER.indexOf(current));
  }

  function closeListbox(returnFocus) {
    if (!open) return;
    open = false;
    listbox.classList.remove('is-open');
    trigger.setAttribute('aria-expanded', 'false');
    trigger.removeAttribute('aria-activedescendant');
    options.forEach(function (o) { o.classList.remove('phone__option--active'); });
    hideTimer = setTimeout(function () { if (!open) listbox.hidden = true; }, 220);
    if (returnFocus) trigger.focus({ preventScroll: true });
  }

  function selectCountry(code) {
    current = code;
    options.forEach(function (o) { o.setAttribute('aria-selected', String(o.dataset.code === code)); });
    var c = COUNTRIES[code];
    trigger.querySelector('.phone__flag').textContent = c.flag;
    trigger.querySelector('.phone__dial').textContent = c.dial;
    trigger.setAttribute('aria-label', 'Select country, currently ' + c.name);
    reformatInput();
  }

  trigger.addEventListener('click', function () {
    if (open) closeListbox(true); else openListbox();
  });

  trigger.addEventListener('keydown', function (e) {
    if (!open) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openListbox();
      }
      return;
    }
    if (e.key === 'ArrowDown') { e.preventDefault(); highlight((active + 1) % options.length); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); highlight((active - 1 + options.length) % options.length); }
    else if (e.key === 'Enter') { e.preventDefault(); selectCountry(options[active].dataset.code); closeListbox(true); }
    else if (e.key === 'Escape') { e.preventDefault(); closeListbox(true); }
    else if (e.key === 'Tab') { closeListbox(false); }
  });

  options.forEach(function (o, idx) {
    o.addEventListener('click', function () { selectCountry(o.dataset.code); closeListbox(true); });
    o.addEventListener('pointerenter', function () { highlight(idx); });
  });

  document.addEventListener('pointerdown', function (e) {
    if (open && !wrap.contains(e.target)) closeListbox(false);
  });

  input.addEventListener('input', reformatInput);

  // ── 실사용자가 손대면 데모를 영구 정지 (캡처 단계 — 실제 동작을 막지 않는다) ──
  wrap.addEventListener('pointerdown', stopDemo, true);
  wrap.addEventListener('keydown', stopDemo, true);

  function stopDemo() {
    if (!wrap.classList.contains('is-demo')) return;
    wrap.classList.remove('is-demo');
    clearTimeout(demoTimer);
  }

  // ── 자동 데모 루프: 실제 코드 경로(openListbox·selectCountry·input 이벤트)를 그대로 돈다 ──
  var demoTimer = null;
  var orderIdx = 0;

  function typewrite(code, i, cb) {
    if (!wrap.classList.contains('is-demo')) return;
    var sample = COUNTRIES[code].sample;
    if (i <= sample.length) {
      input.value = formatDigits(sample.slice(0, i), COUNTRIES[code].groups);
      demoTimer = setTimeout(function () { typewrite(code, i + 1, cb); }, 90);
    } else {
      demoTimer = setTimeout(cb, 900);
    }
  }

  function demoStep() {
    if (!wrap.classList.contains('is-demo')) return;
    var code = ORDER[orderIdx % ORDER.length];
    orderIdx++;
    openListbox();
    highlight(ORDER.indexOf(code));
    demoTimer = setTimeout(function () {
      if (!wrap.classList.contains('is-demo')) return;
      selectCountry(code);
      closeListbox(false);
      demoTimer = setTimeout(function () {
        typewrite(code, 1, function () {
          input.value = '';
          demoTimer = setTimeout(demoStep, 260);
        });
      }, 260);
    }, 500);
  }

  demoTimer = setTimeout(demoStep, 500);
})();
</script>
</body>
</html>
