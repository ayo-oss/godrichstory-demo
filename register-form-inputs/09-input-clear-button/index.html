<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지우기(X) 버튼 입력창 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cb is-demo" id="wrap">
    <label class="cb__label" for="cb-input">검색</label>
    <div class="cb__field">
      <input class="cb__input" id="cb-input" type="text" placeholder="검색어를 입력하세요" autocomplete="off">
      <button type="button" class="cb__clear" id="cb-clear" aria-label="지우기">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
          <line x1="3" y1="3" x2="13" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="13" y1="3" x2="3" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</main>
<script>
(function () {
  var wrap = document.getElementById('wrap');
  var input = document.getElementById('cb-input');
  var clearBtn = document.getElementById('cb-clear');

  function sync() {
    if (input.value) {
      wrap.classList.add('has-value');
    } else {
      wrap.classList.remove('has-value');
    }
  }

  function doClear() {
    input.value = '';
    sync();
    input.focus({ preventScroll: true });
  }

  input.addEventListener('input', sync);
  clearBtn.addEventListener('click', function () { stopDemo(); doClear(); });

  input.addEventListener('keydown', function (e) {
    stopDemo();
    if (e.key === 'Escape' && input.value) {
      doClear();
    }
  });
  input.addEventListener('pointerdown', stopDemo);

  function stopDemo() {
    if (!wrap.classList.contains('is-demo')) return;
    wrap.classList.remove('is-demo');
    clearInterval(timer);
  }

  var full = '여름 원피스';
  var i = 0, paused = false;
  var timer = setInterval(function () {
    if (paused) return;
    if (i > full.length) {
      paused = true;
      setTimeout(function () { doClear(); i = 0; paused = false; }, 900);
      return;
    }
    input.value = full.slice(0, i);
    sync();
    i++;
  }, 130);
})();
</script>
</body>
</html>
