<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다중 선택 콤보박스 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="multi is-demo" id="wrap">
    <span class="multi__label" id="multi-label">관심 분야</span>
    <button type="button" class="multi__trigger" id="trigger"
            aria-haspopup="listbox" aria-expanded="false" aria-controls="multi-listbox"
            aria-labelledby="multi-label trigger" aria-describedby="multi-hint">
      <span class="multi__chips" id="chips">
        <span class="multi__placeholder" id="placeholder">관심 분야 선택</span>
      </span>
      <span class="multi__chevron" aria-hidden="true"></span>
    </button>
    <ul class="multi__listbox" id="multi-listbox" role="listbox" aria-multiselectable="true" aria-label="관심 분야 목록" tabindex="-1" hidden>
      <li role="option" id="multi-opt-0" class="multi__option" data-value="design" data-label="디자인" aria-selected="false">
        <span class="multi__check" aria-hidden="true"></span> 디자인
      </li>
      <li role="option" id="multi-opt-1" class="multi__option" data-value="dev" data-label="개발" aria-selected="false">
        <span class="multi__check" aria-hidden="true"></span> 개발
      </li>
      <li role="option" id="multi-opt-2" class="multi__option" data-value="marketing" data-label="마케팅" aria-selected="false">
        <span class="multi__check" aria-hidden="true"></span> 마케팅
      </li>
      <li role="option" id="multi-opt-3" class="multi__option" data-value="planning" data-label="기획" aria-selected="false">
        <span class="multi__check" aria-hidden="true"></span> 기획
      </li>
    </ul>
    <p class="multi__hint" id="multi-hint">화살표로 이동 · Enter로 선택/해제 · Esc로 닫기</p>
  </div>
</main>
<script>
(function () {
  var wrap = document.getElementById('wrap');
  var trigger = document.getElementById('trigger');
  var listbox = document.getElementById('multi-listbox');
  var chips = document.getElementById('chips');
  var placeholder = document.getElementById('placeholder');
  var options = Array.prototype.slice.call(listbox.querySelectorAll('.multi__option'));

  var selected = [];   // data-value 배열, 옵션 순서 유지
  var active = 0;
  var open = false;
  var hideTimer = null;

  function highlight(i) {
    active = i;
    options.forEach(function (o, idx) { o.classList.toggle('multi__option--active', idx === i); });
    trigger.setAttribute('aria-activedescendant', options[i].id);
  }

  function openListbox() {
    if (open) return;
    open = true;
    clearTimeout(hideTimer);
    listbox.hidden = false;
    void listbox.offsetWidth;
    listbox.classList.add('is-open');
    trigger.setAttribute('aria-expanded', 'true');
    highlight(active);
  }

  function closeListbox(returnFocus) {
    if (!open) return;
    open = false;
    listbox.classList.remove('is-open');
    trigger.setAttribute('aria-expanded', 'false');
    trigger.removeAttribute('aria-activedescendant');
    options.forEach(function (o) { o.classList.remove('multi__option--active'); });
    hideTimer = setTimeout(function () { if (!open) listbox.hidden = true; }, 220);
    if (returnFocus) trigger.focus({ preventScroll: true });
  }

  function renderChips() {
    chips.innerHTML = '';
    if (!selected.length) {
      chips.appendChild(placeholder);
      return;
    }
    options.forEach(function (o) {
      if (selected.indexOf(o.dataset.value) === -1) return;
      var chip = document.createElement('span');
      chip.className = 'multi__chip';
      chip.textContent = o.dataset.label;
      chips.appendChild(chip);
    });
  }

  function toggleOption(i) {
    var o = options[i];
    var isSel = o.getAttribute('aria-selected') === 'true';
    o.setAttribute('aria-selected', String(!isSel));
    if (isSel) selected = selected.filter(function (v) { return v !== o.dataset.value; });
    else selected.push(o.dataset.value);
    renderChips();
  }

  trigger.addEventListener('click', function () {
    if (open) closeListbox(true); else openListbox();
  });

  trigger.addEventListener('keydown', function (e) {
    if (!open) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openListbox();
      }
      return;
    }
    if (e.key === 'ArrowDown') { e.preventDefault(); highlight((active + 1) % options.length); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); highlight((active - 1 + options.length) % options.length); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleOption(active); }
    else if (e.key === 'Escape') { e.preventDefault(); closeListbox(true); }
    else if (e.key === 'Tab') { closeListbox(false); }
  });

  options.forEach(function (o, idx) {
    o.addEventListener('click', function () { highlight(idx); toggleOption(idx); });
    o.addEventListener('pointerenter', function () { highlight(idx); });
  });

  document.addEventListener('pointerdown', function (e) {
    if (open && !wrap.contains(e.target)) closeListbox(false);
  });

  renderChips();

  // ── 실사용자가 손대면 데모를 영구 정지 ──
  wrap.addEventListener('pointerdown', stopDemo, true);
  wrap.addEventListener('keydown', stopDemo, true);

  function stopDemo() {
    if (!wrap.classList.contains('is-demo')) return;
    wrap.classList.remove('is-demo');
    clearTimeout(demoTimer);
  }

  // ── 자동 데모 루프: 실제 openListbox·toggleOption·closeListbox 경로를 그대로 돈다 ──
  var demoTimer = null;

  function demoLoop() {
    var steps = [
      [function () { openListbox(); }, 500],
      [function () { highlight(0); toggleOption(0); }, 550],
      [function () { highlight(1); toggleOption(1); }, 900],
      [function () { highlight(0); toggleOption(0); }, 300],
      [function () { highlight(1); toggleOption(1); }, 300],
      [function () { closeListbox(false); }, 500]
    ];
    var i = 0;
    function next() {
      if (!wrap.classList.contains('is-demo')) return;
      if (i >= steps.length) { demoTimer = setTimeout(demoLoop, 300); return; }
      var s = steps[i++];
      s[0]();
      demoTimer = setTimeout(next, s[1]);
    }
    next();
  }

  demoTimer = setTimeout(demoLoop, 500);
})();
</script>
</body>
</html>
