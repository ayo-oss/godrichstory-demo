<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이콘·단위 붙는 입력창 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="affix is-demo" id="wrap">
    <div class="affix__field">
      <label class="affix__label" for="email-input">メールアドレス</label>
      <div class="affix__control">
        <svg class="affix__icon" aria-hidden="true" viewBox="0 0 20 20" width="16" height="16" fill="none">
          <rect x="2" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/>
          <path d="M2.5 5L10 11L17.5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input class="affix__input affix__input--prefix" id="email-input" type="text" placeholder="you@example.com">
      </div>
    </div>
    <div class="affix__field">
      <label class="affix__label" for="weight-input">体重</label>
      <div class="affix__control">
        <input class="affix__input affix__input--suffix" id="weight-input" type="text" placeholder="0">
        <span class="affix__unit" aria-hidden="true">kg</span>
      </div>
    </div>
  </div>
</main>
<script>
(function () {
  var wrap = document.getElementById('wrap');
  var emailInput = document.getElementById('email-input');
  var weightInput = document.getElementById('weight-input');

  function stopDemo() {
    if (!wrap.classList.contains('is-demo')) return;
    wrap.classList.remove('is-demo');
    clearInterval(timer);
  }
  emailInput.addEventListener('pointerdown', stopDemo);
  emailInput.addEventListener('keydown', stopDemo);
  weightInput.addEventListener('pointerdown', stopDemo);
  weightInput.addEventListener('keydown', stopDemo);

  function fireInput(el) {
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }

  // 각 단계: target(어느 input) · text(칠 문자열) · hold(다 친 뒤 멈춤 ms)
  var script = [
    { el: emailInput, text: 'you@example.com', hold: 900 },
    { el: weightInput, text: '58', hold: 900 }
  ];
  var stepIdx = 0, chars = '', phase = 'focus', pauseUntil = 0;

  var timer = setInterval(function () {
    var now = Date.now();
    if (now < pauseUntil) return;
    var step = script[stepIdx];

    if (phase === 'focus') {
      step.el.focus({ preventScroll: true });
      phase = 'type';
      return;
    }
    if (phase === 'type') {
      if (chars.length < step.text.length) {
        chars += step.text[chars.length];
        step.el.value = chars;
        fireInput(step.el);
      } else {
        phase = 'hold';
        pauseUntil = now + step.hold;
      }
      return;
    }
    if (phase === 'hold') {
      step.el.value = '';
      fireInput(step.el);
      step.el.blur();
      chars = '';
      stepIdx = (stepIdx + 1) % script.length;
      phase = 'focus';
      pauseUntil = now + 220;
    }
  }, 140);
})();
</script>
</body>
</html>
