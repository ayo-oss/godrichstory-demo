<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>멘션·해시태그 강조 입력창 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="mh is-demo" id="wrap">
    <label class="mh__label" for="mh-input">メッセージ</label>
    <div class="mh__field">
      <div class="mh__backdrop" id="backdrop" aria-hidden="true"></div>
      <textarea class="mh__input" id="mh-input" rows="3" aria-describedby="mh-hint"></textarea>
    </div>
    <p class="mh__hint" id="mh-hint">@名前 や #タグ を入力してみてください</p>
  </div>
</main>
<script>
(function () {
  var wrap = document.getElementById('wrap');
  var input = document.getElementById('mh-input');
  var backdrop = document.getElementById('backdrop');

  function escapeHtml(s) {
    return s
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function highlight(s) {
    return s.replace(/([@#])([\w가-힣]+)/g, function (m) {
      return '<mark>' + m + '</mark>';
    });
  }

  function rebuild() {
    var v = input.value;
    var html = highlight(escapeHtml(v));
    backdrop.innerHTML = html + (v.slice(-1) === '\n' ? ' ' : '');
  }
  input.addEventListener('input', rebuild);
  input.addEventListener('scroll', function () {
    backdrop.scrollTop = input.scrollTop;
  });

  function stopDemo() {
    if (!wrap.classList.contains('is-demo')) return;
    wrap.classList.remove('is-demo');
    clearInterval(timer);
  }
  input.addEventListener('pointerdown', stopDemo);
  input.addEventListener('keydown', stopDemo);

  var full = '@デザインチーム 新しい#ボタンスタイルどう？';
  var i = 0, paused = false;
  var timer = setInterval(function () {
    if (paused) return;
    if (i > full.length) {
      paused = true;
      setTimeout(function () { input.value = ''; rebuild(); i = 0; paused = false; }, 900);
      return;
    }
    input.value = full.slice(0, i);
    rebuild();
    i++;
  }, 110);
})();
</script>
</body>
</html>
