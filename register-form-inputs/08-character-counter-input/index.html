<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글자수 카운터 입력창 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cc is-demo" id="wrap">
    <label class="cc__label" for="cc-input">자기소개</label>
    <textarea class="cc__area" id="cc-input" maxlength="80" rows="3" placeholder="나를 한 줄로 소개해 보세요" aria-describedby="cc-count"></textarea>
    <p class="cc__count" id="cc-count" aria-live="polite">0/80</p>
  </div>
</main>
<script>
(function () {
  var wrap = document.getElementById('wrap');
  var area = document.getElementById('cc-input');
  var count = document.getElementById('cc-count');
  var MAX = 80;
  var WARN = 12;

  function update() {
    var len = area.value.length;
    var remaining = MAX - len;
    count.textContent = len + '/' + MAX;
    if (remaining <= WARN) {
      count.classList.add('is-warn');
      area.classList.add('is-warn');
    } else {
      count.classList.remove('is-warn');
      area.classList.remove('is-warn');
    }
  }
  area.addEventListener('input', update);

  function stopDemo() {
    if (!wrap.classList.contains('is-demo')) return;
    wrap.classList.remove('is-demo');
    clearInterval(timer);
  }
  area.addEventListener('pointerdown', stopDemo);
  area.addEventListener('keydown', stopDemo);

  var full = '안녕하세요! 매일 조금씩 성장하는 걸 좋아하는 프런트엔드 개발자입니다. 커피와 고양이를 좋아하고, 여행도 즐깁니다. 잘 부탁드립니다!';
  var i = 0, paused = false;
  var timer = setInterval(function () {
    if (paused) return;
    if (i > full.length) {
      paused = true;
      setTimeout(function () { area.value = ''; update(); i = 0; paused = false; }, 900);
      return;
    }
    area.value = full.slice(0, i);
    update();
    i++;
  }, 90);
  update();
})();
</script>
</body>
</html>
