<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>히트맵 파도 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="hw" id="hw">
  <p class="hw__hint">
    <svg class="hw__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M224 56v122.06l-39.72-39.72a8 8 0 0 0-11.31 0L147.31 164l-49.65-49.66a8 8 0 0 0-11.32 0L32 168.69V64a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8" opacity=".2"/><path d="M111 51h-4V32a16 16 0 0 1 32 0v19h-4a102.63 102.63 0 0 1 13 18h23a16 16 0 0 1 16 16v23a102.63 102.63 0 0 1 18 13v4h19a16 16 0 0 1 0 32h-19v4a102.63 102.63 0 0 1-18 13v23a16 16 0 0 1-16 16h-23a102.63 102.63 0 0 1-13 18h4v19a16 16 0 0 1-32 0v-19h4a102.63 102.63 0 0 1-13-18H75a16 16 0 0 1-16-16v-23a102.63 102.63 0 0 1-18-13v-4a102.63 102.63 0 0 1 0-32v-4a102.63 102.63 0 0 1 18-13V85a16 16 0 0 1 16-16h23a102.63 102.63 0 0 1 13-18m-34 34v86h102V85Zm51 75a24 24 0 1 1 24-24a24 24 0 0 1-24 24"/></g></svg>
    <span>Fifty-six cells fill in a diagonal wave — <code>sin phase</code>·<code>5-step density ramp</code>·<code>Canvas tooltip</code></span>
  </p>
  <div class="hw__field" id="field" role="application" aria-label="Heatmap wave test board" tabindex="0">
    <canvas class="hw__cv" id="cv" role="img" aria-label="Day-by-hour visit density heatmap — cells fill in a diagonal wave from the top left while the average and peak cells pop up"></canvas>
  </div>
  <div class="hw__bar">
    <button class="hw__btn" id="replay" type="button">
      <svg class="hw__bico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M224 128a96 96 0 0 1-94.71 96H128a95.38 95.38 0 0 1-65.9-26.2a8 8 0 0 1 11-11.63a80 80 0 1 0-1.67-114.78a3 3 0 0 1-.26.25L44.59 96H72a8 8 0 0 1 0 16H24a8 8 0 0 1-8-8V56a8 8 0 0 1 16 0v29.8L60.25 60A96 96 0 0 1 224 128"/></g></svg>
      <span>Redraw</span>
    </button>
    <table class="sr-only">
      <caption>Visit density by day and hour (0-100) — hours paired into bands</caption>
      <thead><tr><th scope="col">Day</th><th scope="col">09-10h</th><th scope="col">11-12h</th><th scope="col">13-14h</th><th scope="col">15-16h</th></tr></thead>
      <tbody>
        <tr><th scope="row">Mon</th><td>28</td><td>50</td><td>41</td><td>24</td></tr>
        <tr><th scope="row">Tue</th><td>32</td><td>58</td><td>46</td><td>27</td></tr>
        <tr><th scope="row">Wed</th><td>30</td><td>61</td><td>50</td><td>29</td></tr>
        <tr><th scope="row">Thu</th><td>26</td><td>61</td><td>54</td><td>32</td></tr>
        <tr><th scope="row">Fri</th><td>23</td><td>61</td><td>59</td><td>37</td></tr>
        <tr><th scope="row">Sat</th><td>48</td><td>72</td><td>86</td><td>67</td></tr>
        <tr><th scope="row">Sun</th><td>57</td><td>80</td><td>88</td><td>59</td></tr>
      </tbody>
    </table>
  </div>
</div>
</main>
<script>
// 히트맵 파도 — 7Sun×8시간(56셀) 그리드가 왼쪽 위부터 대각선 파도로 채워진다.
// 셀(i,j) 의 등장 시각 = (i+j)*계수 + 사인 위상 — 같은 대각선끼리 병행하고 위상이 살짝 어긋나
// 순차+병행이 섞인 파도가 된다. 색은 Value(0~100)을 5-step density ramp(--heat-1..--heat-5)로 얹는다.
// hover(mousemove)하면 셀 좌표를 계산해 Day·시간대·Value 툴팁을 캔버스 안에 그린다(DOM 아님).
// 채워진 뒤(0.8) Average·Peak 셀 라벨이 뜬다. 숫자 라벨은 칩 색 위가 아니라 흰 무대 배경 위(297 계열 — 대비).
var root = document.getElementById('hw');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var replayBtn = document.getElementById('replay');

var css = getComputedStyle(root);
var HEAT = [
  css.getPropertyValue('--heat-1').trim(),
  css.getPropertyValue('--heat-2').trim(),
  css.getPropertyValue('--heat-3').trim(),
  css.getPropertyValue('--heat-4').trim(),
  css.getPropertyValue('--heat-5').trim()
];
var C_INK = css.getPropertyValue('--ink').trim();
var C_MUTE = css.getPropertyValue('--mute').trim();
var C_PAPER = css.getPropertyValue('--paper').trim();
var FONT = '-apple-system, "Segoe UI", "Noto Sans KR", sans-serif';

// 고정 시드 — 7Sun(Mon~Sun)×8시간대(09~16h) Visits 밀도(0~100). 난수가 아니라 코드 안 배열
var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
var HOURS = ['09', '10', '11', '12', '13', '14', '15', '16'];
var GRID = [
  [22, 34, 48, 52, 44, 38, 30, 18],
  [26, 38, 55, 60, 50, 42, 34, 20],
  [24, 36, 58, 64, 54, 46, 36, 22],
  [20, 32, 54, 68, 58, 50, 40, 24],
  [18, 28, 50, 72, 62, 56, 46, 28],
  [42, 54, 66, 78, 84, 88, 76, 58],
  [52, 62, 74, 86, 92, 84, 70, 48]
];
var ROWS = DAYS.length, COLS = HOURS.length;
var LOOP = 2.4;         // 한 사이클 2.4초 — 캡처 창(2초) 내내 파동이 지나가는 중이다
var FILL_END = 0.56;  // 파도가 마지막 셀까지 채우는 지점
var DIAG = 0.045;     // 대각선 계수 — (i+j) 마다 등장 시각이 이만큼 늦춰진다
var WAVE = 0.06;      // 사인 위상 폭 — 같은 대각선 안에서도 어긋나게
var GROW = 0.10;      // 셀 하나가 0에서 1로 차오르는 구간

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1;
var t0 = 0, raf = 0;
var hover = null;     // { di, hi } — 현재 hover 셀. 없으면 null

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// 감속 이징 — 셀이 차오를 때 미끄러지듯 멈춘다
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

// Value(0~100) → 5-step density ramp 인덱스(0..4). 20점 간격 계량(scale)
function rampAt(v) {
  return Math.min(4, Math.floor(v / 20));
}

// 셀(i,j) 의 채워짐 진행(0..1) — 대각선 파도: (i+j)*계수 + 사인 위상
function cellAt(i, j, p) {
  var phase = Math.sin((i * 3.7 + j * 2.9)) * WAVE;   // 셀마다 정해진 위상 어긋남(시드)
  var start = (i + j) * DIAG + phase;
  return Math.max(0, Math.min(1, (p - start) / GROW));
}

// 그리드 지오메트리 — 라벨 여백을 남기고 셀 칸을 잡는다
function geo() {
  var padL = 22, padT = 18, padB = 14, padR = 10;
  var gw = W - padL - padR;
  var gh = H - padT - padB;
  return {
    x0: padL, y0: padT,
    cw: gw / COLS, ch: gh / ROWS,
    gap: Math.min(3, (gw + gh) / 220)
  };
}

// hover 셀 계산 — mousemove 좌표를 셀 칸으로 되돌린다
function cellFromPoint(mx, my) {
  var g = geo();
  var cj = Math.floor((mx - g.x0) / g.cw);
  var ci = Math.floor((my - g.y0) / g.ch);
  if (ci < 0 || ci >= ROWS || cj < 0 || cj >= COLS) return null;
  return { di: ci, hi: cj };
}

function draw(p) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = C_PAPER;
  ctx.fillRect(0, 0, W, H);
  var g = geo();

  // Day 라벨 — 첫 10% 에 뜬다
  var rowP = Math.min(1, p / 0.10);
  ctx.font = '700 9px ' + FONT;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < ROWS; i++) {
    ctx.fillStyle = C_MUTE;
    ctx.globalAlpha = rowP;
    ctx.fillText(DAYS[i], g.x0 - 5, g.y0 + g.ch * (i + 0.5));
    ctx.globalAlpha = 1;
  }

  // 시간 라벨 — Day 다음 순으로 뜬다
  ctx.textAlign = 'center';
  for (var j = 0; j < COLS; j++) {
    var colP = Math.min(1, Math.max(0, (p - 0.05) / 0.10));
    ctx.fillStyle = C_MUTE;
    ctx.globalAlpha = colP;
    ctx.fillText(HOURS[j], g.x0 + g.cw * (j + 0.5), g.y0 - 6);
    ctx.globalAlpha = 1;
  }

  // 셀 56개 — Value 계량 → 5단 ramp 색. 채워짐 진행만큼 알파와 크기가 찬다
  var maxV = 0, maxCell = null, sum = 0, filled = 0;
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var gp = easeOutCubic(cellAt(r, c, p));
      if (gp <= 0) continue;
      var v = GRID[r][c];
      if (gp >= 1) {
        filled += 1; sum += v;
        if (v > maxV) { maxV = v; maxCell = { r: r, c: c }; }
      }
      var isHover = hover && hover.di === r && hover.hi === c;
      var cx = g.x0 + g.cw * c + g.gap / 2 + (g.cw - g.gap) * (1 - gp) / 2;   // 중심에서 자라난다
      var cy = g.y0 + g.ch * r + g.gap / 2 + (g.ch - g.gap) * (1 - gp) / 2;
      var cw = (g.cw - g.gap) * gp;
      var ch = (g.ch - g.gap) * gp;
      ctx.globalAlpha = 0.30 + 0.70 * gp;   // 트랙(0.30)에서 실제 농도로 진해진다
      ctx.fillStyle = HEAT[rampAt(v)];
      roundRectFill(cx, cy, cw, ch, 4);
      ctx.globalAlpha = 1;

      // hover 셀 — 흰 테두리 링
      if (isHover && gp >= 1) {
        ctx.strokeStyle = C_PAPER;
        ctx.lineWidth = 2;
        roundRectStroke(g.x0 + g.cw * c + g.gap / 2, g.y0 + g.ch * r + g.gap / 2,
          g.cw - g.gap, g.ch - g.gap, 4);
      }
    }
  }

  // Average·Peak 라벨 — 전부 찬 뒤(0.8) 흰 무대 위에 뜬다(칩 색 위가 아니라 — 297 계열 대비)
  if (p > 0.8) {
    var lp = Math.min(1, (p - 0.8) / 0.10);
    ctx.globalAlpha = lp;
    ctx.font = '700 10px ' + FONT;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C_INK;
    ctx.fillText('Average ' + (filled ? Math.round(sum / filled) : 0), g.x0, H - 3);
    ctx.textAlign = 'right';
    ctx.fillStyle = C_INK;
    if (maxCell) {
      ctx.fillText('Peak ' + DAYS[maxCell.r] + ' ' + HOURS[maxCell.c] + 'h ' + maxV, W - 10, H - 3);
    }
    ctx.globalAlpha = 1;
  }

  // 캔버스 안 툴팁 — hover 셀의 Day·시간대·Value. 셀 위에 흰 카드로 그린다(DOM 아님)
  if (hover) {
    var hv = GRID[hover.di][hover.hi];
    var tx = g.x0 + g.cw * (hover.hi + 0.5);
    var ty = g.y0 + g.ch * hover.di;
    var label = DAYS[hover.di] + ' ' + HOURS[hover.hi] + 'h';
    ctx.font = '700 10px ' + FONT;
    var lw = Math.max(ctx.measureText(label).width, ctx.measureText('Value ' + hv).width) + 16;
    var bx = Math.min(W - lw - 4, Math.max(4, tx - lw / 2));
    var by = Math.max(4, ty - 34);
    ctx.fillStyle = C_PAPER;
    roundRectFill(bx, by, lw, 28, 6);
    ctx.strokeStyle = C_MUTE;
    ctx.lineWidth = 1;
    roundRectStroke(bx, by, lw, 28, 6);
    ctx.fillStyle = C_INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(label, bx + lw / 2, by + 12);
    ctx.fillStyle = HEAT[rampAt(hv)];
    ctx.fillRect(bx + 8, by + 17, 8, 8);
    ctx.fillStyle = C_INK;
    ctx.textAlign = 'left';
    ctx.fillText('Value ' + hv, bx + 20, by + 25);
  }
}

// 라운드 사각 채우기 — 히트 셀 반경 4(토큰 $r-xs 와 같은 눈금)
function roundRectFill(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

// 라운드 사각 테두리 — 위 경로에 stroke 만 얹는다
function roundRectStroke(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.stroke();
}

function frame(now) {
  if (!t0) t0 = now;
  var p = ((now - t0) / 1000 % LOOP) / LOOP;      // 0..1, 2초 루프
  draw(p);
  raf = requestAnimationFrame(frame);
}

replayBtn.addEventListener('click', function () { t0 = 0; });
cv.addEventListener('mousemove', function (e) {
  var r = cv.getBoundingClientRect();
  hover = cellFromPoint(e.clientX - r.left, e.clientY - r.top);
  if (reduce) draw(1);
});
cv.addEventListener('mouseleave', function () {
  hover = null;
  if (reduce) draw(1);
});
window.addEventListener('resize', function () { fit(); if (reduce) draw(1); });

fit();
if (reduce) {
  // reduce — 루프 없이 완성 상태(56셀 전부 찬 히트맵 + Average·Peak 라벨) 한 장만 그린다
  draw(1);
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
