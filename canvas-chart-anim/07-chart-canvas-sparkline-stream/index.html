<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스파크라인 스트림 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ss" id="ss">
  <p class="ss__hint">
    <svg class="ss__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M107.14 98.8L128 128l-20.86 29.2A64 64 0 0 1 55.06 184H32V72h23.06a64 64 0 0 1 52.08 26.8m93.8-26.8a64 64 0 0 0-52.08 26.8L128 128l20.86 29.2a64 64 0 0 0 52.08 26.8H232V72Z" opacity=".2"/><path d="M237.66 178.34a8 8 0 0 1 0 11.32l-24 24a8 8 0 0 1-11.32-11.32L212.69 192h-11.75a72.12 72.12 0 0 1-58.59-30.15l-41.72-58.4A56.1 56.1 0 0 0 55.06 80H32a8 8 0 0 1 0-16h23.06a72.12 72.12 0 0 1 58.59 30.15l41.72 58.4A56.1 56.1 0 0 0 200.94 176h11.75l-10.35-10.34a8 8 0 0 1 11.32-11.32ZM143 107a8 8 0 0 0 11.16-1.86l1.2-1.67A56.1 56.1 0 0 1 200.94 80h11.75l-10.35 10.34a8 8 0 0 0 11.32 11.32l24-24a8 8 0 0 0 0-11.32l-24-24a8 8 0 0 0-11.32 11.32L212.69 64h-11.75a72.12 72.12 0 0 0-58.59 30.15l-1.2 1.67A8 8 0 0 0 143 107"/></g></svg>
    <span>다섯 지표 카드가 새 값을 받아 창을 밀며 다시 그려집니다 — <code>shift</code>·<code>clip</code>·<code>맥박 점</code></span>
  </p>
  <div class="ss__field" id="field" role="application" aria-label="스파크라인 스트림 실험판" tabindex="0">
    <canvas class="ss__cv" id="cv" role="img" aria-label="다섯 지표 카드의 미니 스파크라인 — 최근 12개 값 창이 새 값으로 밀리며 마지막 점이 맥박친다"></canvas>
  </div>
  <div class="ss__bar">
    <button class="ss__btn" id="replay" type="button">
      <svg class="ss__bico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M224 128a96 96 0 0 1-94.71 96H128a95.38 95.38 0 0 1-65.9-26.2a8 8 0 0 1 11-11.63a80 80 0 1 0-1.67-114.78a3 3 0 0 1-.26.25L44.59 96H72a8 8 0 0 1 0 16H24a8 8 0 0 1-8-8V56a8 8 0 0 1 16 0v29.8L60.25 60A96 96 0 0 1 224 128"/></g></svg>
      <span>다시 그리기</span>
    </button>
    <table class="sr-only">
      <caption>다섯 지표 최근 12개 값 창(방금 받은 값 포함)</caption>
      <thead><tr><th scope="col">지표</th><th scope="col">방금 받은 값</th></tr></thead>
      <tbody>
        <tr><th scope="row">방문자</th><td>91</td></tr>
        <tr><th scope="row">체류(분)</th><td>3.8</td></tr>
        <tr><th scope="row">주문</th><td>39</td></tr>
        <tr><th scope="row">쿠폰</th><td>18</td></tr>
        <tr><th scope="row">읽기(분)</th><td>8.4</td></tr>
      </tbody>
    </table>
  </div>
</div>
</main>
<script>
// 스파크라인 스트림 — 카드 5장(틀도 전부 캔버스가 그린다)이 2초 루프 안에서 값을 2번 받아
// 시간 창(최근 12개)을 밀고 다시 그린다. 값 교체 경계는 p=0.33·0.66 — 이 편 데모 규격이
// 2초라서 그 안에서 창 밀기가 두 번 일어난다. 카드마다 작은 시차(stagger)를 둬 서로 어긋나게 한다.
// 창 밀기 그림: 전체 값열(seed+next)에서 옛 창과 새 창을 겹친 13점을 그리되
// x = px + 칸*(m - slide) 로 놓는다 — slide=0 이면 옛 창 정렬, slide=1 이면 새 창 정렬.
// 플롯 사각형으로 clip 해 새 점은 오른쪽에서, 밀려나는 점은 왼쪽에서 사라진다.
// 마지막 점은 맥박(반지름 진동) — 값 도착 직후 강하게 뛰고 사이엔 잔 진동만 남는다.
var root = document.getElementById('ss');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var replayBtn = document.getElementById('replay');

var css = getComputedStyle(root);
var C_1 = css.getPropertyValue('--chart-1').trim();
var C_2 = css.getPropertyValue('--chart-2').trim();
var C_3 = css.getPropertyValue('--chart-3').trim();
var C_4 = css.getPropertyValue('--chart-4').trim();
var C_LIFT = css.getPropertyValue('--chart-2-lift').trim();
var C_INK = css.getPropertyValue('--ink').trim();
var C_MUTE = css.getPropertyValue('--mute').trim();
var C_CARD = css.getPropertyValue('--card').trim();
var C_EDGE = css.getPropertyValue('--edge').trim();
var C_TRACK = css.getPropertyValue('--track').trim();
var C_PAPER = css.getPropertyValue('--paper').trim();
var FONT = '-apple-system, "Segoe UI", "Noto Sans KR", sans-serif';

// 고정 시드 — 카드마다 다른 배열(12개)과 다음 값 2개. 시드이므로 다시 그려도 같은 흐름.
// 다섯 계열색은 차트 토큰 고정 순서(1~4) + 한 장은 lift 톤(파스텔 카운터파트).
var CARDS = [
  { name: '방문자', unit: '',   dec: 0, vMin: 40, vMax: 120, color: C_1,   seed: [62, 71, 66, 78, 84, 91, 87, 95, 88, 96, 84, 91], next: [98, 76] },
  { name: '체류',   unit: '분', dec: 1, vMin: 1,  vMax: 8,  color: C_3,   seed: [4.1, 3.6, 3.9, 2.8, 3.1, 3.5, 3.0, 3.4, 2.9, 3.3, 3.2, 3.8], next: [4.2, 3.1] },
  { name: '주문',   unit: '',   dec: 0, vMin: 10, vMax: 90, color: C_2,   seed: [58, 52, 61, 55, 49, 57, 63, 54, 47, 55, 46, 39], next: [52, 61] },
  { name: '쿠폰',   unit: '',   dec: 0, vMin: 0,  vMax: 40, color: C_4,   seed: [8, 14, 11, 17, 21, 16, 12, 19, 24, 15, 12, 18], next: [26, 14] },
  { name: '읽기',   unit: '분', dec: 1, vMin: 2,  vMax: 12, color: C_LIFT, seed: [5.2, 6.0, 5.6, 6.8, 7.2, 6.4, 5.9, 6.6, 7.0, 7.4, 7.6, 8.4], next: [9.0, 6.9] }
];
var WIN = 12;               // 시간 창 — 최근 12개
var LOOP = 2;               // 한 사이클 2초 — 캡처 창과 같아 gif 가 이어진다
var SWAP_AT = [0.28, 0.55, 0.82]; // 값 교체 경계 — 루프 안에서 3번 창을 민다
var SWAP_DUR = 0.10;        // 한 번 창을 미는 데 걸리는 구간(전체의 10%)
var STAG = 0.018;           // 카드마다 어긋나는 시차

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1;
var t0 = 0, raf = 0;

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// 감속 이징 — 창 밀기가 시작에서 미끄러지듯 멈춘다
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

// 값 표시 형식 — dec 0 은 정수, 1 은 소수 한 자리
function fmtV(card, v) {
  return card.dec === 1 ? v.toFixed(1) : String(Math.round(v));
}

// 카드 i 의 루프 시각 p(0..1) 상태 — 몇 번 밀렸는지(shift)와 현재 밀기 진행(slide 0..1, 이즈 적용).
// shift=0(첫 등장~첫 교체 전) 은 창이 그대로 앉아 있으므로 slide=0.
function swapState(i, p) {
  var shift = 0;
  if (p >= SWAP_AT[1]) shift = 2;
  else if (p >= SWAP_AT[0]) shift = 1;
  if (shift === 0) return { shift: shift, slide: 0 };
  var lastAt = SWAP_AT[shift - 1] + i * STAG;
  var raw = Math.min(1, Math.max(0, (p - lastAt) / SWAP_DUR));
  return { shift: shift, slide: easeOutCubic(raw) };
}

// 라운드 사각 경로 — 안쪽 미니 카드 반경 8(토큰 $r-sm 과 같은 눈금)
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 카드 하나를 그린다 — 틀(라운드 사각 + 제목 + 값 숫자)·미니 라인·맥박 점 전부 캔버스가 그린다
function drawCard(i, rect, p, appear) {
  var card = CARDS[i];
  var st = swapState(i, p);
  var x = rect.x, y = rect.y, w = rect.w, h = rect.h;
  var ay = y + (1 - appear) * 10;   // 등장 — 아래에서 떠오른다

  ctx.save();
  ctx.globalAlpha = appear;

  // 카드 틀 — 흰 카드에 옅은 테두리
  roundRect(x, ay, w, h, 8);
  ctx.fillStyle = C_CARD;
  ctx.fill();
  ctx.strokeStyle = C_EDGE;
  ctx.lineWidth = 1;
  ctx.stroke();

  // 제목 — 왼쪽 위 작게
  ctx.fillStyle = C_MUTE;
  ctx.font = '700 9px ' + FONT;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(card.name, x + 9, ay + 14);

  // 값 숫자 — 창이 밀리는 동안 이전 값에서 새 값으로 넘어간다(첫 등장은 시드 끝값 그대로)
  var all = card.seed.concat(card.next);
  var lastV = all[WIN - 1 + st.shift];
  var prevV = st.shift === 0 ? lastV : all[WIN - 2 + st.shift];
  var shownV = lastV + (prevV - lastV) * (1 - st.slide);
  ctx.fillStyle = C_INK;
  ctx.font = '700 13px ' + FONT;
  ctx.textAlign = 'right';
  ctx.fillText(fmtV(card, shownV) + (card.unit ? ' ' + card.unit : ''), x + w - 9, ay + 14);

  // 미니 라인 영역 — 카드 하단부
  var px = x + 8, pw = w - 16;
  var py = ay + 20, ph = h - 28;
  var slot = pw / (WIN - 1);
  var slide = st.slide;

  // 그릴 값열 — 밀기 전후 창을 겹친 13점(첫 등장 shift=0 은 시드 12점)
  var from = Math.max(0, st.shift - 1);
  var to = WIN - 1 + st.shift;
  var pts = [];
  for (var j = from; j <= to; j++) {
    var m = j - from;                       // 그릴 열 안쪽 순번
    var vx = px + slot * (m - slide);       // slide=0 옛 창 정렬 → slide=1 새 창 정렬
    var vy = py + ph * (1 - (all[j] - card.vMin) / (card.vMax - card.vMin));
    pts.push({ x: vx, y: vy });
  }

  // 플롯 사각형 클립 — 새 점은 오른쪽에서 들어오고 밀려나는 점은 왼쪽에서 잘린다
  ctx.save();
  ctx.beginPath();
  ctx.rect(px - 1, py - 3, pw + 2, ph + 6);
  ctx.clip();

  // 바닥 트랙 — 라인이 앉을 자리를 옅게 깐다
  ctx.strokeStyle = C_TRACK;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (var s = 1; s < pts.length; s++) ctx.lineTo(pts[s].x, pts[s].y);
  ctx.stroke();

  // 미니 라인 — 카드 계열색 3px
  ctx.strokeStyle = card.color;
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (var d = 1; d < pts.length; d++) ctx.lineTo(pts[d].x, pts[d].y);
  ctx.stroke();

  // 맥박 점 — 마지막 점의 반지름이 진동한다. 값 도착 직후 강하게, 사이엔 잔 진동
  var last = pts[pts.length - 1];
  var phase = p * Math.PI * 2;
  var beating = st.slide > 0 && st.slide < 1;
  var beat = beating ? (1 - st.slide) : 0.25;
  var pr = 2.2 + Math.abs(Math.sin(phase * 3)) * 2.4 * beat;
  ctx.beginPath();
  ctx.arc(last.x, last.y, pr, 0, Math.PI * 2);
  ctx.fillStyle = card.color;
  ctx.fill();

  // 맥박 링 — 값 도착 순간 한 번 퍼진다
  if (beating && st.slide < 0.7) {
    var ring = st.slide / 0.7;
    ctx.beginPath();
    ctx.arc(last.x, last.y, pr + 8 * ring, 0, Math.PI * 2);
    ctx.strokeStyle = card.color;
    ctx.globalAlpha = 0.5 * (1 - ring) * appear;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = appear;
  }
  ctx.restore();   // 플롯 클립 해제
  ctx.restore();   // 카드 appear 알파 해제
}

function draw(p) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = C_PAPER;
  ctx.fillRect(0, 0, W, H);

  // 카드 배치 — 넓을 때 2+3(두 줄), 좁으면 세로 1열
  var gap = 8, m = 6;
  var rects = [];
  if (W >= 300) {
    var w2 = (W - m * 2 - gap) / 2;
    var w3 = (W - m * 2 - gap * 2) / 3;
    var hRow = (H - m * 2 - gap) / 2;
    rects.push({ x: m, y: m, w: w2, h: hRow });
    rects.push({ x: m + w2 + gap, y: m, w: w2, h: hRow });
    rects.push({ x: m, y: m + hRow + gap, w: w3, h: hRow });
    rects.push({ x: m + w3 + gap, y: m + hRow + gap, w: w3, h: hRow });
    rects.push({ x: m + (w3 + gap) * 2, y: m + hRow + gap, w: w3, h: hRow });
  } else {
    var w1 = W - m * 2;
    var h1 = (H - m * 2 - gap * 4) / 5;
    for (var v = 0; v < 5; v++) rects.push({ x: m, y: m + v * (h1 + gap), w: w1, h: h1 });
  }

  // 등장 — 카드가 왼쪽부터 시차로 뜬다(첫 20%)
  for (var i = 0; i < CARDS.length; i++) {
    var appear = easeOutCubic(Math.min(1, Math.max(0, (p - i * 0.04) / 0.16)));
    drawCard(i, rects[i], p, appear);
  }
}

function frame(now) {
  if (!t0) t0 = now;
  var p = ((now - t0) / 1000 % LOOP) / LOOP;      // 0..1, 2초 루프
  draw(p);
  raf = requestAnimationFrame(frame);
}

replayBtn.addEventListener('click', function () { t0 = 0; });
window.addEventListener('resize', function () { fit(); if (reduce) draw(1); });

fit();
if (reduce) {
  // reduce — 루프 없이 완성 상태(다섯 카드가 찬 창과 가만한 마지막 점) 한 장만 그린다
  draw(1);
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
