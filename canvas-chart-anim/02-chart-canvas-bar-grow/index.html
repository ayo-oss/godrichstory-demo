<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>막대 그래프 성장 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bg" id="bg">
  <p class="bg__hint">
    <svg class="bg__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M208 40v168h-56V40Z" opacity=".2"/><path d="M224 200h-8V40a8 8 0 0 0-8-8h-56a8 8 0 0 0-8 8v40H96a8 8 0 0 0-8 8v40H48a8 8 0 0 0-8 8v64h-8a8 8 0 0 0 0 16h192a8 8 0 0 0 0-16M160 48h40v152h-40Zm-56 48h40v104h-40Zm-48 48h32v56H56Z"/></g></svg>
    <span>다섯 채널 막대가 시간차로 자라 파도가 됩니다 — <code>stagger</code>·<code>easeOutCubic</code>·<code>fillRect</code></span>
  </p>
  <div class="bg__field" id="field" role="application" aria-label="막대 그래프 성장 실험판" tabindex="0">
    <canvas class="bg__cv" id="cv" role="img" aria-label="다섯 채널 매출 막대 그래프 — 막대가 바닥에서 값까지 자라는 모습"></canvas>
  </div>
  <div class="bg__bar">
    <button class="bg__btn" id="replay" type="button">
      <svg class="bg__bico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M224 128a96 96 0 0 1-94.71 96H128a95.38 95.38 0 0 1-65.9-26.2a8 8 0 0 1 11-11.63a80 80 0 1 0-1.67-114.78a3 3 0 0 1-.26.25L44.59 96H72a8 8 0 0 1 0 16H24a8 8 0 0 1-8-8V56a8 8 0 0 1 16 0v29.8L60.25 60A96 96 0 0 1 224 128"/></g></svg>
      <span>다시 그리기</span>
    </button>
    <table class="sr-only">
      <caption>채널별 분기 매출(단위: 만원)</caption>
      <thead><tr><th scope="col">채널</th><th scope="col">매출</th></tr></thead>
      <tbody>
        <tr><th scope="row">검색</th><td>420</td></tr>
        <tr><th scope="row">소셜</th><td>310</td></tr>
        <tr><th scope="row">이메일</th><td>265</td></tr>
        <tr><th scope="row">직접</th><td>195</td></tr>
        <tr><th scope="row">파트너</th><td>140</td></tr>
      </tbody>
    </table>
  </div>
</div>
</main>
<script>
// 막대 그래프 성장 — 다섯 채널 매출이 바닥에서 값까지 자란다.
// 각 막대의 시작 시각이 오른쪽으로 갈수록 늦춰져(stagger) 파도처럼 번지고,
// 성장 곡선은 easeOutCubic(처음 빠르고 끝에서 뭉툭해지는 감속) — 막대가 "콩" 하고 착지하는 맛을 만든다.
// 막대가 다 자란 뒤(각자 자기 시각에) 값 레이블이 0 에서 값까지 카운트업된다.
var root = document.getElementById('bg');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var replayBtn = document.getElementById('replay');

var css = getComputedStyle(root);
var C_1 = css.getPropertyValue('--chart-1').trim();
var C_2 = css.getPropertyValue('--chart-2').trim();
var C_3 = css.getPropertyValue('--chart-3').trim();
var C_4 = css.getPropertyValue('--chart-4').trim();
var C_2L = css.getPropertyValue('--chart-2-lift').trim();
var C_3L = css.getPropertyValue('--chart-3-lift').trim();
var C_4L = css.getPropertyValue('--chart-4-lift').trim();
var C_INK = css.getPropertyValue('--ink').trim();
var C_MUTE = css.getPropertyValue('--mute').trim();
var C_GRID = css.getPropertyValue('--grid').trim();
var C_TRACK = css.getPropertyValue('--track').trim();
var C_PAPER = css.getPropertyValue('--paper').trim();
var FONT = '-apple-system, "Segoe UI", "Noto Sans KR", sans-serif';

// 고정 시드 데이터 — 다섯 채널 분기 매출(만원). 파스텔 카운터파트: 첫 계열은 그대로, 나머지는 한 단계 밝게
var ROWS = [
  { name: '검색',    v: 420, c: C_1, lift: C_1 },
  { name: '소셜',    v: 310, c: C_2, lift: C_2L },
  { name: '이메일',  v: 265, c: C_3, lift: C_3L },
  { name: '직접',    v: 195, c: C_4, lift: C_4L },
  { name: '파트너',  v: 140, c: C_2, lift: C_2L }
];
var PAD_L = 52, PAD_R = 14, PAD_T = 20, PAD_B = 26;
var LOOP = 2;            // 한 사이클 2초
var GROW = 0.46;         // 막대 하나가 자라는 데 쓰는 구간(전체의 46%)
var STAGGER = 0.075;     // 오른쪽 막대가 늦게 시작하는 간격 — 5개면 마지막은 0.30 에 시작
var COUNT_AT = 0.62;     // 값 레이블 카운트업 시작(마지막 막대 착지 직후)

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1;
var t0 = 0, raf = 0;

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// 감속 이징 — 1 - (1-t)^3. 처음에 빨랐다가 목표에서 미끄러지듯 멈춘다
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function draw(p) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = C_PAPER;
  ctx.fillRect(0, 0, W, H);

  var plotW = W - PAD_L - PAD_R;
  var plotH = H - PAD_T - PAD_B;
  var baseY = PAD_T + plotH;
  var n = ROWS.length;
  var slot = plotW / n;
  var barW = Math.min(44, Math.max(18, slot * 0.62));

  // 가로 그리드 — 100/200/300/400 네 줄. 첫 10% 에 아래에서 뜬다
  var axisP = Math.min(1, p / 0.10);
  ctx.lineWidth = 1;
  ctx.font = '600 10px ' + FONT;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'right';
  for (var g = 100; g <= 400; g += 100) {
    var gy = baseY - plotH * (g / 450) + (1 - axisP) * 12;
    ctx.strokeStyle = C_GRID;
    ctx.beginPath();
    ctx.moveTo(PAD_L, Math.round(gy) + 0.5);
    ctx.lineTo(W - PAD_R, Math.round(gy) + 0.5);
    ctx.stroke();
    ctx.fillStyle = C_MUTE;
    ctx.globalAlpha = axisP;
    ctx.fillText(String(g), PAD_L - 6, gy);
    ctx.globalAlpha = 1;
  }

  // 막대 다섯 개 — i 번째는 i*STAGGER 에 시작해 GROW 동안 자란다(stagger 파도)
  for (var i = 0; i < n; i++) {
    var row = ROWS[i];
    var cx = PAD_L + slot * (i + 0.5);
    var fullH = plotH * (row.v / 450);

    // 바닥 트랙 — 다 자랐을 때의 자리를 옅게 미리 깔아 둔다(착지 목표가 보인다)
    ctx.fillStyle = C_TRACK;
    ctx.fillRect(cx - barW / 2, baseY - fullH, barW, fullH);

    var local = Math.max(0, Math.min(1, (p - i * STAGGER) / GROW));
    var eased = easeOutCubic(local);
    var h = fullH * eased;
    var y = baseY - h;

    // 막대 — fillRect. 위 4px 를 같은 색의 밝은 단(lift)으로 덮어 둥근 데이터 끝처럼 보이게 한다
    if (h > 0) {
      ctx.fillStyle = row.c;
      ctx.fillRect(cx - barW / 2, y, barW, h);
      if (h > 5) {
        ctx.fillStyle = row.lift;
        ctx.fillRect(cx - barW / 2, y, barW, Math.min(4, h));
      }
    }

    // 착지 순간의 잔물결 — 자라는 동안 막대 꼭대기에 작은 캡이 붙었다가 착지하며 사라진다
    if (local > 0 && local < 1) {
      ctx.beginPath();
      ctx.arc(cx, y, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = row.c;
      ctx.fill();
    }

    // 채널 이름 — 축 아래. 왼쪽부터 차례로 나타난다
    var lp = Math.max(0, Math.min(1, (p - 0.06 - i * STAGGER) / 0.12));
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C_MUTE;
    ctx.globalAlpha = lp;
    ctx.font = '600 10px ' + FONT;
    ctx.fillText(row.name, cx, baseY + 14);
    ctx.globalAlpha = 1;

    // 값 레이블 — 막대 착지 뒤 자기 차례에 카운트업. 착지 전엔 그리지 않는다
    if (local >= 1) {
      var cp = Math.max(0, Math.min(1, (p - (i * STAGGER + GROW)) / 0.22));
      var shown = Math.round(row.v * easeOutCubic(cp));
      ctx.font = '700 11px ' + FONT;
      ctx.fillStyle = C_INK;
      ctx.fillText(String(shown), cx, y - 7);
    }
  }
}

function frame(now) {
  if (!t0) t0 = now;
  var p = ((now - t0) / 1000 % LOOP) / LOOP;      // 0..1, 2초 루프
  draw(p);
  raf = requestAnimationFrame(frame);
}

replayBtn.addEventListener('click', function () { t0 = 0; });
window.addEventListener('resize', function () { fit(); if (reduce) draw(1); });

fit();
if (reduce) {
  // reduce — 루프 없이 완성 상태(다 자란 막대와 카운트업 끝난 값) 한 장만 그린다
  draw(1);
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
