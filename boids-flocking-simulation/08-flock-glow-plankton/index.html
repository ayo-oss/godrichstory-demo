<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발광 플랑크톤 — 밤바다를 떠도는 빛무리 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cd is-demo" id="cdRoot">
  <p class="cd__hint">
    <svg class="cd__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><circle cx="80" cy="96" r="10"/><circle cx="140" cy="70" r="7"/><circle cx="176" cy="130" r="12"/><circle cx="96" cy="160" r="8"/><circle cx="160" cy="190" r="6"/></g><path d="M32 200q32-24 64 0t64 0t64 0" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" opacity=".5"/></svg>
    <span>180마리 발광 플랑크톤이 밤바다를 떠돕니다 — 포인터를 가까이 대면 빛무리가 흩어지며 도망칩니다</span>
  </p>
  <div class="cd__field" id="cdField" role="application" aria-label="발광 플랑크톤 밤바다 실험판" tabindex="0">
    <canvas class="cd__cv" id="cdCv"></canvas>
  </div>
  <div class="cd__bar">
    <span class="cd__meta"><b class="cd__val" id="cdN">180</b>마리 · lighter 발광 합성</span>
    <span class="cd__meta cd__meta--dim">drawImage 스프라이트 · globalCompositeOperation · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 발광 플랑크톤(08). 밤바다 배경도 캔버스가 매 프레임 그린다(깊이별 그라디언트가 느리게 흔들린다).
// 개체 180마리는 미리 만든 발광 스프라이트(오프스크린 캔버스 1장, createRadialGradient)를
// drawImage 로 찍고 globalCompositeOperation 'lighter' 로 겹치면 밝아지게 한다.
// 포인터(또는 시드 고정 가상 자극) 근처에서는 도망 벡터가 더해지고, 표준 군집 3벡터를
// 약하게 얹어 무리가 흩어졌다 다시 느슨히 모이는 결을 만든다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형 3종을 만든다 ──
  var N = 180;          // 개체 수
  var GLOW_R = 7;        // 발광 반경(px) — 변형 "발광 반경" 축(5 → 12)
  var FLEE_R = 46;       // 도망 반경(px)
  // ────────────────────────────────────────────────────

  var root = document.getElementById('cdRoot');
  var field = document.getElementById('cdField');
  var cv = document.getElementById('cdCv');
  var ctx = cv.getContext('2d');
  var nOut = document.getElementById('cdN');

  // 시드 고정 PRNG — mulberry32
  var SEED = 0x08fee0d;
  var prngState = SEED >>> 0;
  function rand() {
    prngState = (prngState + 0x6D2B79F5) >>> 0;
    var t = prngState;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_DEEP  = tokRGB('--flock-deep');
  var C_MID   = tokRGB('--flock-sea');
  var C_SHALL = tokRGB('--flock-shallow');
  var C_GLOWA = tokRGB('--flock-plankton');
  var C_GLOWB = tokRGB('--flock-lilac');
  var C_MIST  = tokRGB('--flock-mist');

  var TAU = Math.PI * 2;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0;
  var raf = 0, t0 = -1;
  var px01 = 0.5, py01 = 0.5;
  var manual = false;

  // ── 발광 스프라이트(오프스크린 1장) — drawImage 로 찍어 비용을 낮춘다 ──
  var spriteSize = Math.max(8, Math.round(GLOW_R * 6));
  var sprite = document.createElement('canvas');
  sprite.width = spriteSize; sprite.height = spriteSize;
  var sctx = sprite.getContext('2d');
  (function buildSprite() {
    var r = spriteSize / 2;
    var g = sctx.createRadialGradient(r, r, 0, r, r, r);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.35, 'rgba(255,255,255,0.55)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    sctx.fillStyle = g;
    sctx.fillRect(0, 0, spriteSize, spriteSize);
  })();

  // ── 이웃 반경 안 3벡터 파라미터(군집 코어 공통 뼈대) — 느슨한 학교 짓기 ──
  var NEI_R = 30, NEI_R2 = NEI_R * NEI_R, SEP_R = 12;
  var W_SEP = 14, W_ALI = 5, W_COH = 2.4;

  var plks = [];
  function spawn(p) {
    p.x = rand() * 1; p.y = rand() * 1;    // 0..1 정규화 좌표(필드에 곱해 사용)
    p.vx = (rand() - 0.5) * 10;
    p.vy = (rand() - 0.5) * 10;
    p.ph = rand() * TAU;
    p.hue = rand() < 0.16 ? 1 : 0;          // 16% 는 라일락 톤
    p.sz = 0.75 + rand() * 0.7;
  }
  for (var i = 0; i < N; i++) { var p = {}; spawn(p); plks.push(p); }

  function flockForce(idx) {
    var p = plks[idx];
    var sepX = 0, sepY = 0, aliX = 0, aliY = 0, cohX = 0, cohY = 0, cnt = 0;
    var px = p.x * W, py = p.y * H;
    for (var j = 0; j < N; j++) {
      if (j === idx) continue;
      var q = plks[j];
      var qx = q.x * W, qy = q.y * H;
      var dx = qx - px, dy = qy - py;
      if (dx > W / 2) dx -= W; else if (dx < -W / 2) dx += W;
      if (dy > H / 2) dy -= H; else if (dy < -H / 2) dy += H;
      var d2 = dx * dx + dy * dy;
      if (d2 > NEI_R2) continue;
      var d = Math.sqrt(d2) || 0.0001;
      if (d < SEP_R) { sepX -= dx / d; sepY -= dy / d; }
      aliX += q.vx; aliY += q.vy;
      cohX += dx; cohY += dy;
      cnt++;
    }
    var fx = sepX * W_SEP, fy = sepY * W_SEP;
    if (cnt > 0) {
      fx += (aliX / cnt - p.vx) * (W_ALI / 10);
      fy += (aliY / cnt - p.vy) * (W_ALI / 10);
      fx += (cohX / cnt) * (W_COH / 40);
      fy += (cohY / cnt) * (W_COH / 40);
    }
    return [fx, fy];
  }

  var STILL_T = 1.0;

  function draw(tSec, dt) {
    // ── 밤바다 배경 — 깊이별 그라디언트가 느리게 흔들린다(캔버스가 매 프레임 그린다) ──
    ctx.globalCompositeOperation = 'source-over';
    var shiftA = 0.5 + 0.5 * Math.sin(tSec * 0.35);
    var seaGrad = ctx.createLinearGradient(0, 0, 0, H);
    seaGrad.addColorStop(0, 'rgb(' + lerpC(C_SHALL, C_MID, shiftA * 0.3) + ')');
    seaGrad.addColorStop(0.5, 'rgb(' + lerpC(C_MID, C_DEEP, 0.4 + shiftA * 0.2) + ')');
    seaGrad.addColorStop(1, 'rgb(' + C_DEEP[0] + ',' + C_DEEP[1] + ',' + C_DEEP[2] + ')');
    ctx.fillStyle = seaGrad;
    ctx.fillRect(0, 0, W, H);

    // 표류하는 해류 결 — 대각 띠가 위상만큼 흘러 화면 전체가 실제로 바뀐다
    for (var band = 0; band < 3; band++) {
      var by = H * (0.2 + band * 0.32) + Math.sin(tSec * 0.5 + band * 1.7) * H * 0.08;
      var bandA = 0.05 + 0.03 * Math.sin(tSec * 0.8 + band);
      ctx.fillStyle = 'rgba(' + C_MID[0] + ',' + C_MID[1] + ',' + C_MID[2] + ',' + bandA.toFixed(3) + ')';
      ctx.fillRect(0, by - 14, W, 28);
    }

    // 가상 자극 — 포인터 없을 때 화면을 천천히 순회(시드 고정)
    var stimX, stimY;
    if (manual) { stimX = px01 * W; stimY = py01 * H; }
    else {
      stimX = W * (0.5 + 0.4 * Math.sin(tSec * 0.6));
      stimY = H * (0.5 + 0.36 * Math.sin(tSec * 0.41 + 1.3));
    }

    ctx.globalCompositeOperation = 'lighter';
    for (var i2 = 0; i2 < N; i2++) {
      var p = plks[i2];
      var fx3 = p.x * W, fy3 = p.y * H;
      var dxs = fx3 - stimX, dys = fy3 - stimY;
      var ds = Math.hypot(dxs, dys) || 0.0001;
      var fleeX = 0, fleeY = 0;
      if (ds < FLEE_R) {
        var fleeMag = (1 - ds / FLEE_R) * 120;
        fleeX = (dxs / ds) * fleeMag;
        fleeY = (dys / ds) * fleeMag;
      }
      var ff = flockForce(i2);
      var driftX = Math.sin(tSec * 0.9 + p.ph) * 5;
      var driftY = Math.cos(tSec * 0.7 + p.ph) * 4 - 3;   // 살짝 위로 뜨는 성향
      var ax = fleeX + ff[0] + driftX;
      var ay = fleeY + ff[1] + driftY;
      p.vx += ax * dt; p.vy += ay * dt;
      var damp = Math.pow(0.88, dt * 60);
      p.vx *= damp; p.vy *= damp;
      var sp = Math.hypot(p.vx, p.vy);
      var maxV = 70;
      if (sp > maxV) { p.vx = p.vx / sp * maxV; p.vy = p.vy / sp * maxV; }
      var nx2 = (fx3 + p.vx * dt + W) % W;
      var ny2 = (fy3 + p.vy * dt + H) % H;
      p.x = nx2 / W; p.y = ny2 / H;

      var glow = p.hue ? C_GLOWB : C_GLOWA;
      var pulse = 0.7 + 0.3 * Math.sin(tSec * 3.1 + p.ph * 2);
      var dw = spriteSize * p.sz * (0.85 + 0.3 * pulse);
      ctx.save();
      ctx.globalAlpha = 0.55 + 0.35 * pulse;
      ctx.filter = 'none';
      ctx.drawImage(tintedSprite(glow), nx2 - dw / 2, ny2 - dw / 2, dw, dw);
      ctx.restore();
    }
  }

  // 색조 스프라이트 캐시 — 두 색(플랑크톤/라일락)만 쓰므로 두 장만 만든다
  var tintCache = {};
  function tintedSprite(rgb) {
    var key = rgb.join(',');
    if (tintCache[key]) return tintCache[key];
    var c = document.createElement('canvas');
    c.width = spriteSize; c.height = spriteSize;
    var cc = c.getContext('2d');
    cc.drawImage(sprite, 0, 0);
    cc.globalCompositeOperation = 'source-in';
    cc.fillStyle = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
    cc.fillRect(0, 0, spriteSize, spriteSize);
    tintCache[key] = c;
    return c;
  }

  function lerpC(a, b, m) {
    return (a[0] + (b[0] - a[0]) * m | 0) + ',' + (a[1] + (b[1] - a[1]) * m | 0) + ',' + (a[2] + (b[2] - a[2]) * m | 0);
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W); cv.height = Math.round(H);
    nOut.textContent = String(N);
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    var dt = Math.min(0.05, (now - (frame.prev || now)) / 1000);
    frame.prev = now;
    draw(t, dt);
    raf = requestAnimationFrame(frame);
  }

  field.addEventListener('pointermove', function (e) {
    var r = field.getBoundingClientRect();
    px01 = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    py01 = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    if (!manual) { manual = true; root.classList.remove('is-demo'); }
    if (reduce) draw(STILL_T, 0.016);
  });
  field.addEventListener('pointerleave', function () { manual = false; });
  field.addEventListener('keydown', function (e) {
    var d = { ArrowLeft: [-0.07, 0], ArrowRight: [0.07, 0], ArrowUp: [0, -0.06], ArrowDown: [0, 0.06] }[e.key];
    if (!d) return;
    e.preventDefault();
    if (!manual) { manual = true; root.classList.remove('is-demo'); px01 = 0.5; py01 = 0.5; }
    px01 = Math.max(0, Math.min(1, px01 + d[0]));
    py01 = Math.max(0, Math.min(1, py01 + d[1]));
    if (reduce) draw(STILL_T, 0.016);
  });
  window.addEventListener('resize', function () { fit(); if (reduce) draw(STILL_T, 0.016); });

  fit();
  if (reduce) {
    draw(STILL_T, 0);
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
