<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>머뮤레이션 — 바람에 흔들리는 검은 물결 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cd is-demo" id="cdRoot">
  <p class="cd__hint">
    <svg class="cd__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M24 132c22-6 38 6 56 4s34-12 52-8 36 16 54 12 34-14 46-18l-2-10c-14 4-32 16-46 20s-34-8-52-12-36 8-54 10-34-10-52-4Z" opacity=".25"/><path d="M230.53 28.51a8 8 0 0 0-11.31 0L196.3 51.43A108 108 0 0 0 45.14 196.06l-22.8 22.79a8 8 0 1 0 11.31 11.31l23.24-23.23A108 108 0 0 0 202 60.31l23.17-23.18a8 8 0 0 0 5.36-8.62M38 128a90 90 0 0 1 148-68.66L59.34 186A89.75 89.75 0 0 1 38 128m90 90a89.75 89.75 0 0 1-58-21.06L196.66 70A90 90 0 0 1 128 218"/></g></svg>
    <span>매 프레임 배경을 반투명하게 덮어 개체 궤적이 흐름선으로 남습니다 — 순수 사인 중첩 컬 노이즈 바람이 400개체의 검은 물결을 몰아갑니다</span>
  </p>
  <div class="cd__field" id="cdField" role="application" aria-label="머뮤레이션 잔상 실험판" tabindex="0">
    <canvas class="cd__cv" id="cdCv"></canvas>
  </div>
  <div class="cd__bar">
    <span class="cd__meta"><b class="cd__val" id="cdN">400</b>개체 · 잔상 0.14 덮개</span>
    <span class="cd__meta cd__meta--dim">curl noise · 트레일 누적 · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 머뮤레이션(06). 잔상 트레일 — 매 프레임 배경을 rgba(ink, 0.14) 로 덮어 이전 프레임이
// 서서히 지워지며 개체 궤적이 흐름선으로 남는다(첫 프레임은 불투명 full).
// 바람은 2D potential(순수 사인 중첩)을 만들어 그 회전(컬)을 샘플링한다 — 라이브러리 0.
(function () {
  // ── 변형 상수 블록 ──
  var N_BIRD = 400;    // 개체 수
  var TRAIL  = 0.14;   // 잔상 덮개 알파 — 낮을수록 궤적이 길게 남는다
  var WIND   = 1.0;    // 바람 세기 배율 — 변형 "바람 세기" 축(1.0 → 2.0)
  // ────────────────────────────────────────────────────

  var root = document.getElementById('cdRoot');
  var field = document.getElementById('cdField');
  var cv = document.getElementById('cdCv');
  var ctx = cv.getContext('2d');
  var nOut = document.getElementById('cdN');
  nOut.textContent = String(N_BIRD);

  var SEED = 0x0b0106;
  var prngState = SEED >>> 0;
  function rand() {
    prngState = (prngState + 0x6D2B79F5) >>> 0;
    var t = prngState;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK  = tokRGB('--flock-ink');
  var C_GLOW = tokRGB('--flock-glow');

  var TAU = Math.PI * 2;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0;
  var raf = 0, t0 = -1;
  var firstFrame = true;

  var PERCEP = 26, SEP_R = 11;
  var MAX_SPD = 88, MAX_FRC = 240;
  var W_SEP = 1.5, W_ALI = 1.0, W_COH = 0.8;

  var birds = [];
  for (var i = 0; i < N_BIRD; i++) {
    var an = rand() * TAU;
    birds.push({
      x: rand() * 400, y: rand() * 180,
      vx: Math.cos(an) * MAX_SPD * 0.6, vy: Math.sin(an) * MAX_SPD * 0.6,
      sz: 1.5 + rand() * 1.0
    });
  }

  // ── 컬 노이즈 바람 — potential psi 의 회전(u, v) = (dpsi/dy, -dpsi/dx) ──
  // psi 는 사인 3겹 중첩(방향·주파수 다른 3개) — 라이브러리 없이 계산으로 만드는 흐름장.
  function windAt(x, y, tSec) {
    var s = 0.004;                    // 공간 주파수 기준
    var psi =
      Math.sin(x * s * 1.7 + tSec * 0.31) * Math.cos(y * s * 2.3 - tSec * 0.23) * 1.0 +
      Math.sin(x * s * 0.9 - tSec * 0.17 + 2.1) * Math.cos(y * s * 1.1 + tSec * 0.41 + 0.8) * 0.7 +
      Math.sin((x + y) * s * 1.3 + tSec * 0.53 + 4.2) * 0.45;
    var e = 1.5;                      // 유한차분 간격(px)
    var dpsiDx = (psiAt(x + e, y, tSec) - psiAt(x - e, y, tSec)) / (2 * e);
    var dpsiDy = (psiAt(x, y + e, tSec) - psiAt(x, y - e, tSec)) / (2 * e);
    // 회전장 — 발산 0(공기가 쌓이거나 빠지지 않는다)
    var mag = 46 * WIND;
    return [dpsiDy * mag, -dpsiDx * mag];
  }
  function psiAt(x, y, tSec) {
    var s = 0.004;
    return (
      Math.sin(x * s * 1.7 + tSec * 0.31) * Math.cos(y * s * 2.3 - tSec * 0.23) * 1.0 +
      Math.sin(x * s * 0.9 - tSec * 0.17 + 2.1) * Math.cos(y * s * 1.1 + tSec * 0.41 + 0.8) * 0.7 +
      Math.sin((x + y) * s * 1.3 + tSec * 0.53 + 4.2) * 0.45
    );
  }

  function step(dt, tSec) {
    for (var i = 0; i < birds.length; i++) {
      var b = birds[i];
      var sx = 0, sy = 0, ax = 0, ay = 0, cx0 = 0, cy0 = 0;
      var sepN = 0, aliN = 0, cohN = 0;
      for (var j = 0; j < birds.length; j++) {
        if (i === j) continue;
        var o = birds[j];
        var dx = o.x - b.x, dy = o.y - b.y;
        if (dx > W / 2) dx -= W; else if (dx < -W / 2) dx += W;
        if (dy > H / 2) dy -= H; else if (dy < -H / 2) dy += H;
        var d = Math.hypot(dx, dy);
        if (d < PERCEP && d > 0.0001) {
          if (d < SEP_R) { sx -= dx / d / d * SEP_R; sy -= dy / d / d * SEP_R; sepN++; }
          ax += o.vx; ay += o.vy; aliN++;
          cx0 += dx; cy0 += dy; cohN++;
        }
      }
      var fx = 0, fy = 0;
      if (sepN) { fx += (sx / sepN) * W_SEP; fy += (sy / sepN) * W_SEP; }
      if (aliN) { fx += (ax / aliN - b.vx) * 0.06 * W_ALI; fy += (ay / aliN - b.vy) * 0.06 * W_ALI; }
      if (cohN) { fx += (cx0 / cohN) * 0.045 * W_COH; fy += (cy0 / cohN) * 0.045 * W_COH; }

      // 컬 노이즈 바람 — 무리 전체에 검은 물결을 만드는 주 동력
      var wv = windAt(b.x, b.y, tSec);
      fx += wv[0]; fy += wv[1];

      var fl = Math.hypot(fx, fy);
      if (fl > MAX_FRC) { fx = fx / fl * MAX_FRC; fy = fy / fl * MAX_FRC; }
      b.vx += fx * dt; b.vy += fy * dt;
      var sp = Math.hypot(b.vx, b.vy);
      if (sp > MAX_SPD) { b.vx = b.vx / sp * MAX_SPD; b.vy = b.vy / sp * MAX_SPD; }
      else if (sp < MAX_SPD * 0.3) { b.vx = b.vx / (sp || 1) * MAX_SPD * 0.3; b.vy = b.vy / (sp || 1) * MAX_SPD * 0.3; }
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < 0) b.x += W; else if (b.x > W) b.x -= W;
      if (b.y < 0) b.y += H; else if (b.y > H) b.y -= H;
    }
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W); cv.height = Math.round(H);
    firstFrame = true;   // 리사이즈마다 잔상 캔버스를 다시 깔아야 한다
  }

  function draw(dt, tSec) {
    // 1) 잔상 덮개 — 첫 프레임은 불투명 full, 이후 반투명 0.14 로 궤적을 남긴다
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(' + C_INK[0] + ',' + C_INK[1] + ',' + C_INK[2] + ',' + (firstFrame ? 1 : TRAIL).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
    firstFrame = false;

    // 2) 지평선 따뜻한 띠 — 매 프레임 얇게 다시 그려 잔상 위에 산다
    var hy = H * 0.82;
    var hb = ctx.createLinearGradient(0, hy - 10, 0, hy + 8);
    hb.addColorStop(0, 'rgba(' + C_GLOW[0] + ',' + C_GLOW[1] + ',' + C_GLOW[2] + ',0)');
    hb.addColorStop(0.5, 'rgba(' + C_GLOW[0] + ',' + C_GLOW[1] + ',' + C_GLOW[2] + ',0.5)');
    hb.addColorStop(1, 'rgba(' + C_GLOW[0] + ',' + C_GLOW[1] + ',' + C_GLOW[2] + ',0)');
    ctx.fillStyle = hb;
    ctx.fillRect(0, hy - 10, W, 18);

    // 3) 개체 — 실루엣 잉크 점. 배경보다 살짝 밝은 먹(잔상 잉크와 대비 유지)
    for (var i = 0; i < birds.length; i++) {
      var b = birds[i];
      ctx.fillStyle = 'rgba(' + C_GLOW[0] + ',' + C_GLOW[1] + ',' + C_GLOW[2] + ',0.30)';
      ctx.fillRect(b.x - b.sz, b.y - b.sz, b.sz * 2, b.sz * 2);
    }
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    var dt = Math.min(0.05, (now - (frame.prev || now)) / 1000);
    frame.prev = now;
    step(dt, t);
    draw(dt, t);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () { fit(); if (reduce) draw(0, 1.2); });

  fit();
  if (reduce) {
    // reduce — 바람이 궤적을 그린 뒤의 한 장만 고정해 그린다
    for (var s = 0; s < 60; s++) step(0.033, 1.0 + s * 0.033);
    firstFrame = true;
    draw(0, 3.0);
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
