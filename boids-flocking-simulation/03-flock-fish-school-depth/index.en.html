<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish School — Layering with Virtual Depth — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cd is-demo" id="cdRoot">
  <p class="cd__hint">
    <svg class="cd__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M128 24a16 16 0 0 1 16 16v8a80.06 80.06 0 0 1 63.94 63.94h8a16 16 0 0 1 0 32h-8A80.06 80.06 0 0 1 144 207.94v8a16 16 0 0 1-32 0v-8A80.06 80.06 0 0 1 48.06 144h-8a16 16 0 0 1 0-32h8A80.06 80.06 0 0 1 112 48.06v-8A16 16 0 0 1 128 24m-16 57.35V96a16 16 0 0 0 32 0V81.35A48.09 48.09 0 0 0 81.35 112H96a16 16 0 0 0 0-32h14.65M174.65 144H160a16 16 0 0 0 0 32h14.65A48.09 48.09 0 0 0 144 174.65V160a16 16 0 0 0-32 0v14.65A48.09 48.09 0 0 0 81.35 144" opacity=".2"/><path d="M232 128a104 104 1 1 1-104-104a104 104 0 0 1 104 104m-32 0a8 8 0 0 0-8-8h-9.34A56.1 56.1 0 0 0 136 77.34V68a8 8 0 0 0-16 0v9.34A56.1 56.1 0 0 0 77.34 120H68a8 8 0 0 0 0 16h9.34A56.1 56.1 0 0 0 120 179.66V188a8 8 0 0 0 16 0v-8.34A56.1 56.1 0 0 0 178.66 136H192a8 8 0 0 0 8-8m-40 0a32 32 0 1 1-32-32a32 32 0 0 1 32 32m-16 0a16 16 0 1 0-16 16a16 16 0 0 0 16-16"/></g></svg>
    <span>A fish school on a deep-sea stage — each fish carries a virtual depth z (0 to 1), so farther fish are drawn smaller and fainter to form layers, and streamlined bodies and tails lean along their heading</span>
  </p>
  <div class="cd__field" id="cdField" role="application" aria-label="Fish-school depth test panel" tabindex="0">
    <canvas class="cd__cv" id="cdCv"></canvas>
  </div>
  <div class="cd__bar">
    <span class="cd__meta"><b class="cd__val" id="cdN">140</b>fish · depth-z layers</span>
    <span class="cd__meta cd__meta--dim">globalAlpha · ellipse · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 물고기 떼(03). 군집 코어는 01 과 같은 뼈대(분리·정렬·결합 + 토러스 랩).
// 장면이 다르다: 심해 무대(잉크 + 상부 옅은 하늘빛 radial 광원) 위에 개체마다 가상 깊이 z(0=가까움, 1=멀음) 을
// 들고 다닌다 — 멀수록 스케일이 작아지고 globalAlpha 가 옅아져 한 화면에 층이 생긴다.
// 몸은 유선형 타원 + 꼬리 삼각형, 진행 방향으로 ctx.rotate. 결합 계수가 뭉침 강도(변형 축).
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형 3종을 만든다 ──
  var N_B = 140;    // 물고기 수
  var W_SEP = 1.6;  // 분리 무게
  var W_ALI = 1.1;  // 정렬 무게
  var W_COH = 0.6;  // 결합 무게 — 변형 "결합 계수" 축(0.6 → 1.2, 뭉침 강도)
  // ────────────────────────────────────────────────────

  var root = document.getElementById('cdRoot');
  var field = document.getElementById('cdField');
  var cv = document.getElementById('cdCv');
  var ctx = cv.getContext('2d');
  var nOut = document.getElementById('cdN');

  // 시드 고정 PRNG — mulberry32. 미리보기가 항상 같은 물고기 떼로 흐른다
  var SEED = 0x30c103;
  var prngState = SEED >>> 0;
  function rand() {
    prngState = (prngState + 0x6D2B79F5) >>> 0;
    var t = prngState;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // 색은 CSS 커스텀 프로퍼티(--flock-*)에서 getComputedStyle 로 읽는다 — 파스텔 토큰이 scss 한 곳에
  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK  = tokRGB('--flock-ink');
  var C_MIST = tokRGB('--flock-mist');
  var C_SKY  = tokRGB('--flock-sky');
  var C_LILA = tokRGB('--flock-lilac');
  var C_SILH = C_SKY;   // 물고기 몸색 — 심해 위 하늘빛 실루엣

  var TAU = Math.PI * 2;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0;
  var raf = 0, t0 = -1;
  var STILL_T = 1.6;   // reduce 에서 그리는 시각

  // ── 시뮬 상수 ──
  var R_NEIGH = 48;    // 이웃 반경 (px)
  var MAX_SPD = 100;   // 최대 속도 (px/s)
  var MAX_FOR = 260;   // 최대 힘 (px/s^2)

  // ── 물고기 개체 ──
  var boids = [];
  function spawnB(b, i) {
    b.x = rand() * W;
    b.y = rand() * H;
    var ang = rand() * TAU;
    var spd = MAX_SPD * (0.5 + rand() * 0.5);
    b.vx = Math.cos(ang) * spd;
    b.vy = Math.sin(ang) * spd;
    b.z = rand();                    // 가상 깊이 0(가까움)~1(멀음)
    b.ph = rand() * TAU;             // 안내 위상
    b.sz = 0.75 + rand() * 0.6;      // 몸 스케일
    b.grp = (i || 0) % 4;            // 하위 무리 — 화면 커버리지
  }
  function build() {
    boids = [];
    for (var i = 0; i < N_B; i++) { var b = {}; spawnB(b, i); boids.push(b); }
    nOut.textContent = String(N_B);
  }

  // 이동 방향으로 가속을 제한하는 스티어 — 목표 속도에서 현재 속도를 뺀 뒤 힘 한계로 자른다
  function steer(vx, vy, tvx, tvy, out) {
    var sx = tvx - vx, sy = tvy - vy;
    var m = Math.hypot(sx, sy);
    if (m > MAX_FOR) { sx = sx / m * MAX_FOR; sy = sy / m * MAX_FOR; }
    out[0] = sx; out[1] = sy;
  }

  var sA = [0, 0], sB = [0, 0], sC = [0, 0];

  function step(dt) {
    var n = boids.length;
    for (var i = 0; i < n; i++) {
      var b = boids[i];
      var sepX = 0, sepY = 0, aliX = 0, aliY = 0, cx = 0, cy = 0, cnt = 0;
      for (var j = 0; j < n; j++) {
        if (j === i) continue;
        var o = boids[j];
        var dx = o.x - b.x, dy = o.y - b.y;
        var d2 = dx * dx + dy * dy;
        if (d2 > R_NEIGH * R_NEIGH || d2 === 0) continue;
        var d = Math.sqrt(d2);
        cnt++;
        aliX += o.vx; aliY += o.vy;
        cx += o.x; cy += o.y;
        if (d < R_NEIGH * 0.5) {          // 분리 — 반경 절반 안에서만, 가까울수록 세게
          var w = (R_NEIGH * 0.5 - d) / (R_NEIGH * 0.5) / (d / (R_NEIGH * 0.5) + 0.18);
          sepX -= dx / d * w; sepY -= dy / d * w;
        }
      }
      var fx = 0, fy = 0;
      if (cnt > 0) {
        steer(b.vx, b.vy, aliX / cnt, aliY / cnt, sA);
        steer(b.vx, b.vy, (cx / cnt - b.x) * 2.2, (cy / cnt - b.y) * 2.2, sB);
        fx += W_ALI * sA[0] + W_COH * sB[0];
        fy += W_ALI * sA[1] + W_COH * sB[1];
      }
      if (sepX !== 0 || sepY !== 0) {
        steer(b.vx, b.vy, b.vx + sepX * 60, b.vy + sepY * 60, sC);
        fx += W_SEP * sC[0]; fy += W_SEP * sC[1];
      }
      b.vx += fx * dt; b.vy += fy * dt;
      var sp = Math.hypot(b.vx, b.vy);
      if (sp > MAX_SPD) { b.vx = b.vx / sp * MAX_SPD; b.vy = b.vy / sp * MAX_SPD; }
      else if (sp < MAX_SPD * 0.5) { var k2 = MAX_SPD * 0.5 / (sp || 1); b.vx *= k2; b.vy *= k2; }
      b.x += b.vx * dt; b.y += b.vy * dt;
      // 토러스 랩 — 빠져나가면 반대편에서 등장
      if (b.x < -8) b.x += W + 16; else if (b.x > W + 8) b.x -= W + 16;
      if (b.y < -8) b.y += H + 16; else if (b.y > H + 8) b.y -= H + 16;
    }
  }

  // 하위 무리 안내 — 4개 무리가 각자 다른 위상으로 무대를 돌아 화면 커버리지를 넓힌다
  function herdGuide(dt, tSec) {
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      var ga = tSec * (1.3 + b.grp * 0.3) + b.ph;
      b.vx += Math.cos(ga) * 150 * dt;
      b.vy += Math.sin(ga) * 150 * dt;
    }
  }

  function draw(tSec) {
    // 1) 심해 무대 — 잉크 바탕 + 상부 옅은 하늘빛 광원(radial). 빛이 느리게 숨쉬어 넓은 면적이 매 프레임 변한다
    ctx.fillStyle = 'rgb(' + C_INK[0] + ',' + C_INK[1] + ',' + C_INK[2] + ')';
    ctx.fillRect(0, 0, W, H);
    var breathe = 0.5 + 0.5 * Math.sin(tSec * 0.8);
    var lx = W * 0.5 + Math.sin(tSec * 0.3) * W * 0.1;
    var ly = -H * 0.1;
    var lr = Math.max(W, H) * (0.9 + 0.12 * breathe);
    var lg = ctx.createRadialGradient(lx, ly, 6, lx, ly, lr);
    var la = 0.16 + 0.05 * breathe;
    lg.addColorStop(0, 'rgba(' + C_SKY[0] + ',' + C_SKY[1] + ',' + C_SKY[2] + ',' + la.toFixed(3) + ')');
    lg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, W, H);

    // 2) 물고기 — 깊이 z 순으로 그린다(멀 것부터 → 가까운 것이 위에 덮임)
    var order = boids.slice();
    order.sort(function (p, q) { return q.z - p.z; });
    for (var k = 0; k < order.length; k++) {
      var b = order[k];
      var depth = 1 - b.z;               // 1 = 가까움, 0 = 멀음
      var sc = (0.45 + 0.75 * depth) * b.sz;   // 멀수록 작게
      var alpha = 0.35 + 0.6 * depth;    // 멀수록 옅게 — 층의 핵심
      var ang = Math.atan2(b.vy, b.vx);
      // 꼬리 흔들림 — 진행축 수직으로 sin
      var tail = Math.sin(tSec * (6 + 4 * depth) + b.ph) * 2.2 * sc;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.globalAlpha = alpha;
      // 몸 — 유선형 타원(앞이 둥글고 뒤로 갈수록 좁아지는 두 타원 겹침)
      ctx.fillStyle = 'rgb(' + C_SILH[0] + ',' + C_SILH[1] + ',' + C_SILH[2] + ')';
      ctx.beginPath();
      ctx.ellipse(0, 0, 7.5 * sc, 2.8 * sc, 0, 0, TAU);
      ctx.fill();
      // 꼬리 — 몸 뒤 삼각형, 수직 sin 흔들림
      ctx.beginPath();
      ctx.moveTo(-6 * sc, tail * 0.4);
      ctx.lineTo(-11 * sc, tail - 3.4 * sc);
      ctx.lineTo(-11 * sc, tail + 3.4 * sc);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // 3) 가까운 층 강조 — 라일락 포인트 개체 몇 마리(z 가 가장 작은 5마리)에 눈광점
    var near = boids.slice().sort(function (p, q) { return p.z - q.z; });
    for (var m = 0; m < Math.min(5, near.length); m++) {
      var f2 = near[m];
      var sc2 = (0.45 + 0.75 * (1 - f2.z)) * f2.sz;
      var ang2 = Math.atan2(f2.vy, f2.vx);
      ctx.save();
      ctx.translate(f2.x, f2.y);
      ctx.rotate(ang2);
      ctx.fillStyle = 'rgb(' + C_LILA[0] + ',' + C_LILA[1] + ',' + C_LILA[2] + ')';
      ctx.beginPath();
      ctx.arc(4.2 * sc2, -0.8 * sc2, 0.9 * sc2, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  function fit() {
    var r = field.getBoundingClientRect();
    var oldW = W, oldH = H;
    W = r.width; H = r.height;
    cv.width = Math.round(W); cv.height = Math.round(H);
    if (oldW !== W || oldH !== H) {
      prngState = SEED >>> 0;
      build();
    }
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    var dt = Math.min(0.05, (now - (frame.prev || now)) / 1000);
    frame.prev = now;
    herdGuide(dt, t);
    step(dt);
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () { fit(); if (reduce) draw(STILL_T); });

  fit();
  build();
  if (reduce) {
    for (var w = 0; w < 96; w++) { herdGuide(1 / 60, w / 60); step(1 / 60); }
    draw(STILL_T);
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
