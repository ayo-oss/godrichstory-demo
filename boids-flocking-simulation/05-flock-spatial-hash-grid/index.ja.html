<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>千匹の計算 — 空間ハッシュで減らす近傍探索 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cd is-demo" id="cdRoot">
  <p class="cd__hint">
    <svg class="cd__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M40 40h64v64H40z" opacity=".2"/><path d="M96 32H40a8 8 0 0 0-8 8v56a8 8 0 0 0 8 8h56a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-8 56H48V48h40Zm88-56h-56a8 8 0 0 0-8 8v56a8 8 0 0 0 8 8h56a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-8 56h-40V48h40Zm-72 40H40a8 8 0 0 0-8 8v56a8 8 0 0 0 8 8h56a8 8 0 0 0 8-8v-56a8 8 0 0 0-8-8m-8 56H48v-40h40Zm88-56h-56a8 8 0 0 0-8 8v56a8 8 0 0 0 8 8h56a8 8 0 0 0 8-8v-56a8 8 0 0 0-8-8m-8 56h-40v-40h40Z"/></g></svg>
    <span>画面を48pxのセルに分け、自分のセルと隣接する8マスだけを調べます — 個体が1000匹いても、全数比較(1,000×1,000)なしに群れができます</span>
  </p>
  <div class="cd__field" id="cdField" role="application" aria-label="空間ハッシュグリッドBoids実験パネル" tabindex="0">
    <canvas class="cd__cv" id="cdCv"></canvas>
  </div>
  <div class="cd__bar">
    <span class="cd__meta"><b class="cd__val" id="cdN">1000</b>体・フレームごとの近傍探索 <b class="cd__val" id="cdChecks">0</b>回</span>
    <span class="cd__meta cd__meta--dim">Mapハッシュ・3x3セル走査・requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 천 마리의 셈(05). 전수 비교(O(n^2))는 1000개체에서 감당이 안 된다 — 화면을 48px 셀로 나눠
// Map<"cx,cy", 인덱스[]> 로 등록하고, 매 개체는 자기 셀 + 인접 8칸(3x3)만 조사한다.
// 조사 범위가 줄어도 무리 행동(분리·정렬·결합)은 그대로 만들어진다는 것이 이 데모의 요점.
(function () {
  // ── 변형 상수 블록 ──
  var N_BIRD = 1000;   // 개체 수 — 변형 "개체 수" 축(1000 → 2000)
  var CELL   = 48;     // 해시 셀 한 변(px)
  // ────────────────────────────────────────────────────

  var root = document.getElementById('cdRoot');
  var field = document.getElementById('cdField');
  var cv = document.getElementById('cdCv');
  var ctx = cv.getContext('2d');
  var nOut = document.getElementById('cdN');
  var chOut = document.getElementById('cdChecks');
  nOut.textContent = String(N_BIRD);

  var SEED = 0x0b0105;
  var prngState = SEED >>> 0;
  function rand() {
    prngState = (prngState + 0x6D2B79F5) >>> 0;
    var t = prngState;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK  = tokRGB('--flock-ink');
  var C_MIST = tokRGB('--flock-mist');
  var C_DUSK = tokRGB('--flock-dusk');
  var C_LILAC = tokRGB('--flock-lilac');

  var TAU = Math.PI * 2;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0;
  var raf = 0, t0 = -1;
  var px01 = 0.5, py01 = 0.5;
  var manual = false;

  var PERCEP = 30, SEP_R = 12;
  var MAX_SPD = 78, MAX_FRC = 220;
  var W_SEP = 1.6, W_ALI = 1.0, W_COH = 0.85;

  var birds = [];
  for (var i = 0; i < N_BIRD; i++) {
    birds.push({
      x: rand() * 400, y: rand() * 180,
      vx: (rand() - 0.5) * MAX_SPD, vy: (rand() - 0.5) * MAX_SPD
    });
  }

  // ── 공간 해시 — 매 프레임 다시 짓는다(개체가 매 프레임 옮겨가므로) ──
  var grid = new Map();
  function cellKey(cx, cy) { return cx + ',' + cy; }
  function buildGrid() {
    grid.clear();
    for (var i = 0; i < birds.length; i++) {
      var b = birds[i];
      var cx = Math.floor(b.x / CELL), cy = Math.floor(b.y / CELL);
      var k = cellKey(cx, cy);
      var arr = grid.get(k);
      if (!arr) { arr = []; grid.set(k, arr); }
      arr.push(i);
    }
  }

  var checksThisFrame = 0;

  function step(dt) {
    buildGrid();
    checksThisFrame = 0;
    var predPx = (px01 - 0.5) * 2, predPy = (py01 - 0.5) * 2; // 포인터 -1..1 — 약한 조류(바람) 신호로만 사용
    for (var i = 0; i < birds.length; i++) {
      var b = birds[i];
      var sx = 0, sy = 0, ax = 0, ay = 0, cx0 = 0, cy0 = 0;
      var sepN = 0, aliN = 0, cohN = 0;
      var gcx = Math.floor(b.x / CELL), gcy = Math.floor(b.y / CELL);
      // 자기 셀 + 인접 8칸(3x3) 만 조사 — 이것이 이 데모의 핵심
      for (var oy = -1; oy <= 1; oy++) {
        for (var ox = -1; ox <= 1; ox++) {
          var arr = grid.get(cellKey(gcx + ox, gcy + oy));
          if (!arr) continue;
          for (var a = 0; a < arr.length; a++) {
            var j = arr[a];
            if (j === i) continue;
            checksThisFrame++;
            var o = birds[j];
            var dx = o.x - b.x, dy = o.y - b.y;
            var d = Math.hypot(dx, dy);
            if (d < PERCEP && d > 0.0001) {
              if (d < SEP_R) { sx -= dx / d / d * SEP_R; sy -= dy / d / d * SEP_R; sepN++; }
              ax += o.vx; ay += o.vy; aliN++;
              cx0 += dx; cy0 += dy; cohN++;
            }
          }
        }
      }
      var fx = 0, fy = 0;
      if (sepN) { fx += (sx / sepN) * W_SEP; fy += (sy / sepN) * W_SEP; }
      if (aliN) { fx += (ax / aliN - b.vx) * 0.06 * W_ALI; fy += (ay / aliN - b.vy) * 0.06 * W_ALI; }
      if (cohN) { fx += (cx0 / cohN) * 0.05 * W_COH; fy += (cy0 / cohN) * 0.05 * W_COH; }
      // 약한 조류(포인터/가상) — 무리 전체가 한쪽으로 서서히 쏠리는 신호만
      fx += predPx * 8; fy += predPy * 8;

      var fl = Math.hypot(fx, fy);
      if (fl > MAX_FRC) { fx = fx / fl * MAX_FRC; fy = fy / fl * MAX_FRC; }
      b.vx += fx * dt; b.vy += fy * dt;
      var sp = Math.hypot(b.vx, b.vy);
      if (sp > MAX_SPD) { b.vx = b.vx / sp * MAX_SPD; b.vy = b.vy / sp * MAX_SPD; }
      else if (sp < MAX_SPD * 0.3) { b.vx = b.vx / (sp || 1) * MAX_SPD * 0.3; b.vy = b.vy / (sp || 1) * MAX_SPD * 0.3; }
      b.x += b.vx * dt; b.y += b.vy * dt;
    }
    // 위치 갱신 뒤 랩(다음 buildGrid 가 이 값으로 다시 짓는다)
    for (var w = 0; w < birds.length; w++) {
      var bb = birds[w];
      if (bb.x < 0) bb.x += W; else if (bb.x > W) bb.x -= W;
      if (bb.y < 0) bb.y += H; else if (bb.y > H) bb.y -= H;
    }
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W); cv.height = Math.round(H);
  }

  function draw(tSec) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgb(' + C_INK[0] + ',' + C_INK[1] + ',' + C_INK[2] + ')';
    ctx.fillRect(0, 0, W, H);

    var hg = ctx.createLinearGradient(0, 0, 0, H);
    hg.addColorStop(0, 'rgba(' + C_DUSK[0] + ',' + C_DUSK[1] + ',' + C_DUSK[2] + ',0.2)');
    hg.addColorStop(1, 'rgba(' + C_DUSK[0] + ',' + C_DUSK[1] + ',' + C_DUSK[2] + ',0)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, 0, W, H * 0.5);

    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < birds.length; i++) {
      var b = birds[i];
      var sp = Math.hypot(b.vx, b.vy);
      var flash = (i % 7 === (((tSec * 6) | 0) % 7)) ? 0.22 : 0;   // 지역 밀도 대신 순환 반짝임 — 정적 카드가 아니게
      var a = 0.34 + Math.min(0.4, sp / MAX_SPD * 0.4) + flash;
      var col = (i % 23 === 0) ? C_LILAC : C_MIST;
      ctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + a.toFixed(3) + ')';
      ctx.fillRect(b.x - 1, b.y - 1, 2, 2);
    }

    chOut.textContent = String(checksThisFrame);
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    var dt = Math.min(0.05, (now - (frame.prev || now)) / 1000);
    frame.prev = now;
    if (!manual) {
      var ph = t * TAU / 6.2;
      px01 = 0.5 + 0.4 * Math.sin(ph);
      py01 = 0.5 + 0.32 * Math.sin(ph * 1.4 + 0.6);
    }
    step(dt);
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  field.addEventListener('pointermove', function (e) {
    var r = field.getBoundingClientRect();
    px01 = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    py01 = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    if (!manual) { manual = true; root.classList.remove('is-demo'); }
    if (reduce) { step(0.016); draw(1.2); }
  });
  field.addEventListener('pointerleave', function () {
    if (manual) { px01 = 0.5; py01 = 0.5; }
  });
  field.addEventListener('keydown', function (e) {
    var d = { ArrowLeft: [-0.06, 0], ArrowRight: [0.06, 0], ArrowUp: [0, -0.06], ArrowDown: [0, 0.06] }[e.key];
    if (!d) return;
    e.preventDefault();
    if (!manual) { manual = true; root.classList.remove('is-demo'); }
    px01 = Math.max(0, Math.min(1, px01 + d[0]));
    py01 = Math.max(0, Math.min(1, py01 + d[1]));
    if (reduce) { step(0.016); draw(1.2); }
  });
  window.addEventListener('resize', function () { fit(); if (reduce) draw(1.2); });

  fit();
  if (reduce) {
    for (var s = 0; s < 30; s++) step(0.033);
    draw(1.2);
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
