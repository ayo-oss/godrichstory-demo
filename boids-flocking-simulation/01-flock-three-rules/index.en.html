<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Flock of Three Rules — Separation, Alignment, Cohesion — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cd is-demo" id="cdRoot">
  <p class="cd__hint">
    <svg class="cd__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M128 24a16 16 0 0 1 16 16v8a80.06 80.06 0 0 1 63.94 63.94h8a16 16 0 0 1 0 32h-8A80.06 80.06 0 0 1 144 207.94v8a16 16 0 0 1-32 0v-8A80.06 80.06 0 0 1 48.06 144h-8a16 16 0 0 1 0-32h8A80.06 80.06 0 0 1 112 48.06v-8A16 16 0 0 1 128 24m-16 57.35V96a16 16 0 0 0 32 0V81.35A48.09 48.09 0 0 0 81.35 112H96a16 16 0 0 0 0-32h14.65M174.65 144H160a16 16 0 0 0 0 32h14.65A48.09 48.09 0 0 0 144 174.65V160a16 16 0 0 0-32 0v14.65A48.09 48.09 0 0 0 81.35 144" opacity=".2"/><path d="M232 128a104 104 1 1 1-104-104a104 104 0 0 1 104 104m-32 0a8 8 0 0 0-8-8h-9.34A56.1 56.1 0 0 0 136 77.34V68a8 8 0 0 0-16 0v9.34A56.1 56.1 0 0 0 77.34 120H68a8 8 0 0 0 0 16h9.34A56.1 56.1 0 0 0 120 179.66V188a8 8 0 0 0 16 0v-8.34A56.1 56.1 0 0 0 178.66 136H192a8 8 0 0 0 8-8m-40 0a32 32 0 1 1-32-32a32 32 0 0 1 32 32m-16 0a16 16 0 1 0-16 16a16 16 0 0 0 16-16"/></g></svg>
    <span>A single agent moves as the sum of three vectors — separation (pushed apart when close), alignment (matches heading), and cohesion (drawn to the center). Arrows light up on the representative agent</span>
  </p>
  <div class="cd__field" id="cdField" role="application" aria-label="Three-rule flocking test panel" tabindex="0">
    <canvas class="cd__cv" id="cdCv"></canvas>
  </div>
  <div class="cd__bar">
    <span class="cd__meta"><b class="cd__val" id="cdN">260</b>agents · separation · alignment · cohesion</span>
    <span class="cd__meta cd__meta--dim">canvas · steering · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 세 규칙의 떼(01). 보이드 최소 구현 — 개체마다 이웃 반경을 훑어 세 스티어링 벡터를 계산한다.
// 분리(separation): 반경의 절반 안에 든 가까운 이웃에서 멀어지는 쪽으로 민다(가까울수록 큰 가중).
// 정렬(alignment): 이웃 속도의 평균 방향으로 자기 속도를 스티어.
// 결합(cohesion): 이웃 질량중심 방향으로 스티어.
// 셋을 무게로 합하고 최대 힘·최대 속도로 클램프한다. 화면은 토러스 랩 — 빠져나가면 반대편.
// 대표 개체 1마리엔 세 벡터를 얇은 화살표로 겹쳐 그려 규칙을 눈으로 읽게 한다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형 3종을 만든다 ──
  var N_B = 260;    // 개체 수 — 변형 "개체 수" 축(260 → 640)
  var W_SEP = 1.5;  // 분리 무게
  var W_ALI = 1.0;  // 정렬 무게
  var W_COH = 1.0;  // 결합 무게
  // ────────────────────────────────────────────────────

  var root = document.getElementById('cdRoot');
  var field = document.getElementById('cdField');
  var cv = document.getElementById('cdCv');
  var ctx = cv.getContext('2d');
  var nOut = document.getElementById('cdN');

  // 시드 고정 PRNG — mulberry32. 미리보기가 항상 같은 떼로 흐른다
  var SEED = 0x30c101;
  var prngState = SEED >>> 0;
  function rand() {
    prngState = (prngState + 0x6D2B79F5) >>> 0;
    var t = prngState;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // 색은 CSS 커스텀 프로퍼티(--flock-*)에서 getComputedStyle 로 읽는다 — 파스텔 토큰이 scss 한 곳에
  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK  = tokRGB('--flock-ink');
  var C_MIST = tokRGB('--flock-mist');
  var C_SEPL = tokRGB('--flock-sep');
  var C_ALIG = tokRGB('--flock-ali');
  var C_COHE = tokRGB('--flock-coh');
  var C_LILA = tokRGB('--flock-lilac');

  var TAU = Math.PI * 2;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0;
  var raf = 0, t0 = -1;
  var STILL_T = 1.6;   // reduce 에서 그리는 시각 — 떼가 퍼진 한 장

  // ── 시뮬 상수 ──
  var R_NEIGH = 42;    // 이웃 반경 (px)
  var MAX_SPD = 128;   // 최대 속도 (px/s)
  var MAX_FOR = 340;   // 최대 힘 (px/s^2) — 스티어 예리함

  // ── 개체 ──
  var boids = [];
  function spawnB(b) {
    b.x = rand() * W;
    b.y = rand() * H;
    var ang = rand() * TAU;
    var spd = MAX_SPD * (0.5 + rand() * 0.5);
    b.vx = Math.cos(ang) * spd;
    b.vy = Math.sin(ang) * spd;
    b.ph = rand() * TAU;              // 안내 위상 — 개체마다 궤적을 어긋나게
    b.grp = arguments.length > 1 ? arguments[1] % 4 : 0;   // 하위 무리 4개 — 각자 다른 궤적
  }
  function build() {
    boids = [];
    for (var i = 0; i < N_B; i++) { var b = {}; spawnB(b, i); boids.push(b); }
    nOut.textContent = String(N_B);
  }

  // 이동 방향으로 가속을 제한하는 스티어 — 목표 속도에서 현재 속도를 뺀 뒤 힘 한계로 자른다
  function steer(vx, vy, tvx, tvy, out) {
    var sx = tvx - vx, sy = tvy - vy;
    var m = Math.hypot(sx, sy);
    if (m > MAX_FOR) { sx = sx / m * MAX_FOR; sy = sy / m * MAX_FOR; }
    out[0] = sx; out[1] = sy;
  }

  var sA = [0, 0], sB = [0, 0], sC = [0, 0];
  var view = { sep: [0, 0], ali: [0, 0], coh: [0, 0] };  // 대표 개체 시각화용 최신값

  function step(dt) {
    var n = boids.length;
    for (var i = 0; i < n; i++) {
      var b = boids[i];
      var sepX = 0, sepY = 0, aliX = 0, aliY = 0, cx = 0, cy = 0, cnt = 0;
      for (var j = 0; j < n; j++) {
        if (j === i) continue;
        var o = boids[j];
        var dx = o.x - b.x, dy = o.y - b.y;
        var d2 = dx * dx + dy * dy;
        if (d2 > R_NEIGH * R_NEIGH || d2 === 0) continue;
        var d = Math.sqrt(d2);
        cnt++;
        aliX += o.vx; aliY += o.vy;
        cx += o.x; cy += o.y;
        if (d < R_NEIGH * 0.5) {          // 분리 — 반경 절반 안에서만, 가까울수록 세게 (1/d 가중)
          var w = (R_NEIGH * 0.5 - d) / (R_NEIGH * 0.5) / (d / (R_NEIGH * 0.5) + 0.18);
          sepX -= dx / d * w; sepY -= dy / d * w;
        }
      }
      var fx = 0, fy = 0;
      if (cnt > 0) {
        // 정렬 — 이웃 평균 속도 방향으로
        steer(b.vx, b.vy, aliX / cnt, aliY / cnt, sA);
        // 결합 — 이웃 질량중심으로
        steer(b.vx, b.vy, (cx / cnt - b.x) * 2.2, (cy / cnt - b.y) * 2.2, sB);
        fx += W_ALI * sA[0] + W_COH * sB[0];
        fy += W_ALI * sA[1] + W_COH * sB[1];
      }
      if (sepX !== 0 || sepY !== 0) {
        steer(b.vx, b.vy, b.vx + sepX * 60, b.vy + sepY * 60, sC);
        fx += W_SEP * sC[0]; fy += W_SEP * sC[1];
      }
      if (i === 0) {  // 대표 개체 — 화살표 그릴 최신값
        view.sep[0] = W_SEP * (sepX !== 0 || sepY !== 0 ? sC[0] : 0);
        view.sep[1] = W_SEP * (sepY !== 0 || sepX !== 0 ? sC[1] : 0);
        view.ali[0] = cnt > 0 ? W_ALI * sA[0] : 0;
        view.ali[1] = cnt > 0 ? W_ALI * sA[1] : 0;
        view.coh[0] = cnt > 0 ? W_COH * sB[0] : 0;
        view.coh[1] = cnt > 0 ? W_COH * sB[1] : 0;
      }
      b.vx += fx * dt; b.vy += fy * dt;
      var sp = Math.hypot(b.vx, b.vy);
      if (sp > MAX_SPD) { b.vx = b.vx / sp * MAX_SPD; b.vy = b.vy / sp * MAX_SPD; }
      else if (sp < MAX_SPD * 0.5) { var k2 = MAX_SPD * 0.5 / (sp || 1); b.vx *= k2; b.vy *= k2; }
      b.x += b.vx * dt; b.y += b.vy * dt;
      // 토러스 랩 — 빠져나가면 반대편에서 등장
      if (b.x < -4) b.x += W + 8; else if (b.x > W + 4) b.x -= W + 8;
      if (b.y < -4) b.y += H + 8; else if (b.y > H + 4) b.y -= H + 8;
    }
  }

  function arrow(x, y, vx, vy, scale, col, wdt) {
    var ex = x + vx * scale, ey = y + vy * scale;
    ctx.strokeStyle = col;
    ctx.lineWidth = wdt;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    // 화살촉 — 벡터 방향으로 작은 갈래
    var ang = Math.atan2(vy, vx);
    var hl = 3.2 + wdt;
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - Math.cos(ang - 0.5) * hl, ey - Math.sin(ang - 0.5) * hl);
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - Math.cos(ang + 0.5) * hl, ey - Math.sin(ang + 0.5) * hl);
    ctx.stroke();
  }

  function draw(tSec) {
    // 무대 — 어스름 잉크
    ctx.fillStyle = 'rgb(' + C_INK[0] + ',' + C_INK[1] + ',' + C_INK[2] + ')';
    ctx.fillRect(0, 0, W, H);

    // 떼 — 사각 점
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      ctx.fillStyle = 'rgb(' + C_MIST[0] + ',' + C_MIST[1] + ',' + C_MIST[2] + ')';
      ctx.fillRect(b.x - 1.5, b.y - 2, 3, 4);
    }

    // 대표 개체 0번 — 세 힘 벡터 화살표. 무대를 넓게 훑도록 개체 0의 속도에 느린 회전을 얹는다
    var hero = boids[0];
    if (hero) {
      // 대표 개체 몸 — 라일락 강조
      ctx.fillStyle = 'rgb(' + C_LILA[0] + ',' + C_LILA[1] + ',' + C_LILA[2] + ')';
      ctx.fillRect(hero.x - 2, hero.y - 3, 4, 6);
      var sc = 0.24;
      arrow(hero.x, hero.y, view.sep[0], view.sep[1], sc, 'rgb(' + C_SEPL[0] + ',' + C_SEPL[1] + ',' + C_SEPL[2] + ')', 1.4);
      arrow(hero.x, hero.y, view.ali[0], view.ali[1], sc, 'rgb(' + C_ALIG[0] + ',' + C_ALIG[1] + ',' + C_ALIG[2] + ')', 1.4);
      arrow(hero.x, hero.y, view.coh[0], view.coh[1], sc, 'rgb(' + C_COHE[0] + ',' + C_COHE[1] + ',' + C_COHE[2] + ')', 1.4);
    }
  }

  function fit() {
    var r = field.getBoundingClientRect();
    var oldW = W, oldH = H;
    W = r.width; H = r.height;
    cv.width = Math.round(W); cv.height = Math.round(H);
    if (oldW !== W || oldH !== H) {   // 크기가 바뀌면 위치 배율 보정 후 다시 시드 리셋
      prngState = SEED >>> 0;
      build();
    }
  }

  // 하위 무리 안내 — 4개 무리가 각자 다른 위상으로 무대를 돌아 화면 커버리지를 넓힌다(면적 커버리지)
  function herdGuide(dt, tSec) {
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      var ga = tSec * (1.3 + b.grp * 0.3) + b.ph;   // 무리마다 회전 속도·위상이 다르다
      b.vx += Math.cos(ga) * 150 * dt * (i === 0 ? 2.6 : 1);
      b.vy += Math.sin(ga) * 150 * dt * (i === 0 ? 2.6 : 1);
    }
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    var dt = Math.min(0.05, (now - (frame.prev || now)) / 1000);
    frame.prev = now;
    herdGuide(dt, t);
    step(dt);
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () { fit(); if (reduce) draw(STILL_T); });

  fit();
  build();
  if (reduce) {
    for (var w = 0; w < 96; w++) step(1 / 60);   // 떼가 자리잡은 뒤의 한 장
    draw(STILL_T);
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
