<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card hover — gradient border</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <article class="card is-demo" tabindex="0">
    <span class="card__border" aria-hidden="true"></span>
    <div class="card__inner">
      <h3 class="card__title">Gói được đề xuất</h3>
      <p class="card__meta">Lựa chọn phổ biến nhất</p>
    </div>
  </article>
</main>
<script>
// 커서 위치로 스포트라이트(반사광)와 미세 3D 틸트를 함께 만든다.
var card = document.querySelector('.card');
card.addEventListener('pointermove', function (e) {
  card.classList.remove('is-demo');
  var r = card.getBoundingClientRect();
  var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
  card.style.setProperty('--mx', (px * 100) + '%');
  card.style.setProperty('--my', (py * 100) + '%');
  card.style.setProperty('--sp', 1);
  card.style.setProperty('--rx', (-(py - .5) * 8) + 'deg');
  card.style.setProperty('--ry', ((px - .5) * 9) + 'deg');
});
card.addEventListener('pointerleave', function () {
  card.style.setProperty('--sp', 0);
  card.style.setProperty('--rx', '0deg');
  card.style.setProperty('--ry', '0deg');
});
</script>
</body>
</html>
