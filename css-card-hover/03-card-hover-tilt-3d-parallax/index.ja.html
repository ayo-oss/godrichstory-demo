<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card hover — 3D tilt parallax</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="frame">
    <article class="card is-demo" tabindex="0">
      <span class="card__layer card__layer--back" aria-hidden="true"></span>
      <div class="card__layer card__layer--front">
        <h3 class="card__title">ポートフォリオ</h3>
        <p class="card__meta">詳しく見る</p>
      </div>
    </article>
  </div>
</main>
<script>
// 카드 위 커서 위치로 기울기를 만든다. 배경 레이어가 반대로 움직여 층이 갈린다(시차).
var card = document.querySelector('.card');
card.addEventListener('pointermove', function (e) {
  card.classList.remove('is-demo');
  var r = card.getBoundingClientRect(), px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
  card.style.setProperty('--rx', (-py * 14) + 'deg');
  card.style.setProperty('--ry', (px * 16) + 'deg');
  card.style.setProperty('--pz', (px * -12) + 'px');
  // 스포트라이트(커서 하이라이트) — 틸트는 그대로, 이 층만 얹는다
  card.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
  card.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
  card.style.setProperty('--sp', 1);
});
card.addEventListener('pointerleave', function () { card.style.cssText = ''; });
</script>
</body>
</html>
