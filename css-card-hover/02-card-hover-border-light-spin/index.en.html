<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card hover — border light spin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <article class="card is-demo" tabindex="0">
    <span class="card__ring" aria-hidden="true"></span>
    <div class="card__inner">
      <h3 class="card__title">Premium Plan</h3>
      <p class="card__meta">Includes AI features</p>
    </div>
  </article>
</main>
<script>
// 커서 위치로 스포트라이트(--mx/--my/--sp)와 미세 3D 틸트(--rx/--ry)를 얹는다. 기존 테두리 회전 효과는 :hover 로 그대로 유지.
var card = document.querySelector('.card');
card.addEventListener('pointermove', function (e) {
  card.classList.remove('is-demo');
  var r = card.getBoundingClientRect();
  var px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
  card.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
  card.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
  card.style.setProperty('--sp', 1);
  card.style.setProperty('--rx', (-py * 6) + 'deg');
  card.style.setProperty('--ry', (px * 7) + 'deg');
});
card.addEventListener('pointerleave', function () {
  card.style.setProperty('--sp', 0);
  card.style.setProperty('--rx', '0deg');
  card.style.setProperty('--ry', '0deg');
});
</script>
</body>
</html>
