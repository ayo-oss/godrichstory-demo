<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card hover — icon bounce</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="frame">
    <article class="card is-demo" tabindex="0">
      <div class="card__body">
        <h3 class="card__title">Tin mới nhất</h3>
        <p class="card__meta">Đọc thêm</p>
      </div>
      <span class="card__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17 17 7M9 7h8v8" />
        </svg>
      </span>
    </article>
  </div>
</main>
<script>
// 커서 위치로 스포트라이트(--mx/--my/--sp) 와 미세 3D 틸트(--rx/--ry) 를 함께 만든다.
var card = document.querySelector('.card');
card.addEventListener('pointermove', function (e) {
  card.classList.remove('is-demo');
  var r = card.getBoundingClientRect();
  var px = (e.clientX - r.left) / r.width - .5;
  var py = (e.clientY - r.top) / r.height - .5;
  card.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
  card.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
  card.style.setProperty('--sp', 1);
  card.style.setProperty('--rx', (-py * 8) + 'deg');
  card.style.setProperty('--ry', (px * 9) + 'deg');
});
card.addEventListener('pointerleave', function () {
  card.style.setProperty('--sp', 0);
  card.style.setProperty('--rx', '0deg');
  card.style.setProperty('--ry', '0deg');
});
</script>
</body>
</html>
