<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>完全に開く直前、紙吹雪が重力を受けて落下し、床で跳ね返る — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="scv is-demo" id="scv">
  <div class="scv__card">
    <p class="scv__label">スクラッチカード</p>
    <div class="scv__zone" id="zone">
      <div class="scv__prize">
        <p class="scv__prizeTitle">お祝いクーポン</p>
        <p class="scv__prizeSub">ほとんどこすり終えると紙吹雪が弾けます</p>
      </div>
      <canvas class="scv__foil" id="foil" width="280" height="150" aria-hidden="true"></canvas>
      <canvas class="scv__confetti" id="confetti" width="280" height="150" aria-hidden="true"></canvas>
    </div>
    <button type="button" class="scv__reveal" id="revealBtn">一気に見る</button>
    <p class="scv__live" id="live" aria-live="polite"></p>
  </div>
</div>
</main>
<script>
(function () {
  // 기법: 긁은 비율이 88% 를 넘는 순간 CONFETTI_COUNT 개의 색종이를 한 번에 만들어
  // 중력으로 낙하시키고 카드 바닥에 닿으면 반발계수만큼 튕기게(bounce) 물리 적분한다.
  var root = document.getElementById('scv');
  var zone = document.getElementById('zone');
  var foil = document.getElementById('foil');
  var ctx = foil.getContext('2d');
  var confettiCanvas = document.getElementById('confetti');
  var cctx = confettiCanvas.getContext('2d');
  var revealBtn = document.getElementById('revealBtn');
  var live = document.getElementById('live');

  var FW = foil.width, FH = foil.height;
  var CONFETTI_COUNT = 24;
  var CONFETTI_GRAVITY = 620;
  var CONFETTI_BOUNCE = 0.42;
  var SCRATCH_BRUSH_R = 15;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var foilRand = seedRand(424071);
  var confettiRand = seedRand(424072);

  function paintFoil() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, FW, FH);
    var grad = ctx.createLinearGradient(0, 0, FW, FH);
    grad.addColorStop(0, '#ff8a5c');
    grad.addColorStop(.5, '#ffb488');
    grad.addColorStop(1, '#e85f2a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, FW, FH);
    ctx.strokeStyle = 'rgba(23,20,26,.16)';
    ctx.lineWidth = 1;
    for (var i = 0; i < 20; i += 1) {
      var x = foilRand() * FW, y = foilRand() * FH;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + (foilRand() * 22 - 11), y + (foilRand() * 8 - 4));
      ctx.stroke();
    }
  }

  function scratchAt(x, y) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, SCRATCH_BRUSH_R, 0, Math.PI * 2);
    ctx.fill();
  }

  function clearedRatio() {
    var data = ctx.getImageData(0, 0, FW, FH).data;
    var clear = 0, total = data.length / 4;
    for (var i = 3; i < data.length; i += 4) { if (data[i] < 40) clear += 1; }
    return clear / total;
  }

  var COLORS = ['#0a4fe8', '#fff7e6', '#ff4d1f', '#ffd23f'];
  var confetti = [];
  function burstConfetti() {
    confetti = [];
    for (var i = 0; i < CONFETTI_COUNT; i += 1) {
      confetti.push({
        x: FW * (0.3 + confettiRand() * 0.4),
        y: FH * 0.3,
        vx: (confettiRand() - .5) * 220,
        vy: -180 - confettiRand() * 140,
        rot: confettiRand() * Math.PI * 2,
        angVel: (confettiRand() - .5) * 8,
        w: 5 + confettiRand() * 3,
        h: 3 + confettiRand() * 2,
        color: COLORS[i % COLORS.length],
        bounces: 0
      });
    }
  }
  function stepConfetti(dtMs) {
    var dtS = dtMs / 1000;
    for (var i = 0; i < confetti.length; i += 1) {
      var c = confetti[i];
      c.vy += CONFETTI_GRAVITY * dtS;
      c.x += c.vx * dtS;
      c.y += c.vy * dtS;
      c.rot += c.angVel * dtS;
      if (c.y > FH - 6 && c.vy > 0 && c.bounces < 3) {
        c.y = FH - 6;
        c.vy *= -CONFETTI_BOUNCE;
        c.vx *= 0.7;
        c.bounces += 1;
      }
    }
  }
  function drawConfetti() {
    cctx.clearRect(0, 0, FW, FH);
    for (var i = 0; i < confetti.length; i += 1) {
      var c = confetti[i];
      cctx.save();
      cctx.translate(c.x, c.y);
      cctx.rotate(c.rot);
      cctx.fillStyle = c.color;
      cctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      cctx.restore();
    }
  }

  var opened = false, burst = false;
  function openCard() {
    if (opened) return;
    opened = true;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillRect(0, 0, FW, FH);
    root.classList.add('is-open');
    live.textContent = 'お祝いクーポンが開きました';
  }
  function maybeBurst(ratio) {
    if (!burst && ratio > .88) { burst = true; burstConfetti(); }
    if (ratio > .96) openCard();
  }

  function pos(e) {
    var r = foil.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (FW / r.width), y: (e.clientY - r.top) * (FH / r.height) };
  }

  paintFoil();
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dragging = false;

  zone.addEventListener('pointerdown', function (e) {
    if (opened) return;
    root.classList.remove('is-demo');
    dragging = true;
    var p = pos(e);
    scratchAt(p.x, p.y);
    maybeBurst(clearedRatio());
    if (zone.setPointerCapture) zone.setPointerCapture(e.pointerId);
  });
  zone.addEventListener('pointermove', function (e) {
    if (!dragging || opened) return;
    var p = pos(e);
    scratchAt(p.x, p.y);
    maybeBurst(clearedRatio());
  });
  window.addEventListener('pointerup', function () { dragging = false; });

  revealBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    if (!burst) { burst = true; burstConfetti(); }
    openCard();
  });

  var demoRand = seedRand(424073);
  var demoPath = [];
  (function buildDemoPath() {
    for (var i = 0; i < 24; i += 1) {
      demoPath.push({
        t: 220 + i * 78,
        x: (FW * 0.12) + (i % 6) * (FW * 0.15) + (demoRand() - .5) * 6,
        y: (FH * 0.22) + Math.floor(i / 6) * (FH * 0.24) + (demoRand() - .5) * 6
      });
    }
  })();
  var DEMO_LOOP_MS = 4200;
  var demoStep = 0;

  function resetDemo() {
    opened = false; burst = false;
    root.classList.remove('is-open');
    paintFoil();
    confetti = [];
    demoStep = 0;
  }
  function runDemo(tMod) {
    while (demoStep < demoPath.length && demoPath[demoStep].t <= tMod) {
      var p = demoPath[demoStep];
      scratchAt(p.x, p.y);
      demoStep += 1;
      maybeBurst(clearedRatio());
    }
  }

  if (reduce) root.classList.remove('is-demo');
  var elapsed = 0, lastTs = null;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min(ts - lastTs, 48);
    lastTs = ts;
    if (!reduce && root.classList.contains('is-demo')) {
      elapsed += dt;
      var tMod = elapsed % DEMO_LOOP_MS;
      if (tMod < dt) resetDemo();
      runDemo(tMod);
    }
    if (!reduce) stepConfetti(dt);
    drawConfetti();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
