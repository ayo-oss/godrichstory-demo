<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Gears That Mesh at Their Tooth Ratio While the Pointer Moves the View — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pc is-demo" id="pc">
  <canvas class="pc__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="3D gears with 18 and 10 teeth meshing at their tooth-count ratio. Change the view with the pointer or arrow keys, reverse with Enter, and stop with Space"></canvas>
  <p class="pc__status" data-role="status" aria-live="off">Meshing at the tooth-count ratio</p>
  <div class="pc__tools">
    <button class="pc__btn" data-role="reverse" type="button" aria-pressed="false">Reverse</button>
    <button class="pc__btn" data-role="home" type="button">Face front</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("pc");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    const TAU = Math.PI * 2;
    const DEG = Math.PI / 180;
    // 모형 중심 — 왼쪽 위는 버튼, 왼쪽 아래는 상태 줄이라 모형은 오른쪽으로 비켜 둔다
    const CX = 300;
    const CY = 150;
    // 파스텔 팔레트 — 어두운 무대 위에 밝은 조각을 얹어 명도 차로 경계가 읽힌다
    const BG = [29, 26, 44];
    const PANEL = [44, 39, 64];
    const PAPER = [255, 248, 234];
    const PAL = [
        [124, 196, 255],
        [255, 160, 190],
        [126, 226, 192],
        [190, 164, 255],
        [255, 208, 168],
        [246, 228, 140],
        [150, 222, 236],
        [232, 182, 228],
        [196, 220, 160],
    ];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function shadeRGB(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
    // 3차원 계산 — 화면 오른쪽이 +x, 아래가 +y, 화면 안쪽이 +z (화면 쪽을 보는 면은 법선 z 가 음수)
    function vadd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
    function vsub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
    function vscale(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }
    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
    function vnorm(a) {
        const l = Math.hypot(a[0], a[1], a[2]);
        return l > 1e-9 ? [a[0] / l, a[1] / l, a[2] / l] : [0, 0, 0];
    }
    // 회전 행렬 — 가로축(x)·세로축(y)·깊이축(z) 둘레로 a 라디안
    function rotX(a) { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; }
    function rotY(a) { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; }
    function rotZ(a) { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; }
    function matMul(a, b) {
        return [
            a[0] * b[0] + a[1] * b[3] + a[2] * b[6], a[0] * b[1] + a[1] * b[4] + a[2] * b[7], a[0] * b[2] + a[1] * b[5] + a[2] * b[8],
            a[3] * b[0] + a[4] * b[3] + a[5] * b[6], a[3] * b[1] + a[4] * b[4] + a[5] * b[7], a[3] * b[2] + a[4] * b[5] + a[5] * b[8],
            a[6] * b[0] + a[7] * b[3] + a[8] * b[6], a[6] * b[1] + a[7] * b[4] + a[8] * b[7], a[6] * b[2] + a[7] * b[5] + a[8] * b[8],
        ];
    }
    function apply(m, p) {
        return [m[0] * p[0] + m[1] * p[1] + m[2] * p[2], m[3] * p[0] + m[4] * p[1] + m[5] * p[2], m[6] * p[0] + m[7] * p[1] + m[8] * p[2]];
    }
    // 회전 행렬의 역은 전치 — 화면 방향을 모형 좌표로 되돌릴 때 쓴다
    function applyT(m, p) {
        return [m[0] * p[0] + m[3] * p[1] + m[6] * p[2], m[1] * p[0] + m[4] * p[1] + m[7] * p[2], m[2] * p[0] + m[5] * p[1] + m[8] * p[2]];
    }
    // 시점 행렬 — 먼저 세로축으로 돌리고(yaw) 그다음 가로축으로 기울인다(pitch)
    function viewMatrix(yaw, pitch) { return matMul(rotX(pitch), rotY(yaw)); }
    // 원근 나눗셈 — 화면 배율 s = focal / (focal + z). 깊이 z 가 클수록(안쪽) 작아지고 가운데로 모인다
    function project(p, focal) {
        const s = focal / (focal + p[2]);
        return { x: CX + p[0] * s, y: CY + p[1] * s, s: s, z: p[2] };
    }
    // 빛 — 왼쪽 위 앞에서 비춘다
    const LIGHT = vnorm([-0.45, -0.62, -0.64]);
    function lambert(n) { return Math.max(0, dot(n, LIGHT)); }
    function makeView(yaw, pitch) { return { yaw: yaw, pitch: pitch, yawTo: yaw, pitchTo: pitch, yaw0: yaw, pitch0: pitch }; }
    function viewFollow(v, k) {
        v.yaw += (v.yawTo - v.yaw) * k;
        v.pitch += (v.pitchTo - v.pitch) * k;
    }
    function viewSnap(v) { v.yaw = v.yawTo; v.pitch = v.pitchTo; }
    function viewHome(v) { v.yawTo = v.yaw0; v.pitchTo = v.pitch0; }
    function viewGap(v) { return Math.hypot(v.yawTo - v.yaw, v.pitchTo - v.pitch); }
    // 포인터 → 목표 각. 모형 중심에서 가로로 벗어난 만큼 yaw, 세로로 벗어난 만큼 pitch (오른쪽을 가리키면 앞면이 오른쪽으로 돈다)
    const YAW_RANGE = 1.1;
    const PITCH_RANGE = 0.8;
    function aimAt(v, px, py) {
        v.yawTo = v.yaw0 - clamp((px - CX) / (W / 2), -1, 1) * YAW_RANGE;
        v.pitchTo = v.pitch0 + clamp((py - CY) / (H / 2), -1, 1) * PITCH_RANGE;
    }
    // 방향키 한 번에 돌리는 각
    const KEY_STEP = 0.3;
    function arrowNudge(ev, v) {
        if (ev.key === 'ArrowLeft') {
            v.yawTo = clamp(v.yawTo + KEY_STEP, -Math.PI, Math.PI);
        }
        else if (ev.key === 'ArrowRight') {
            v.yawTo = clamp(v.yawTo - KEY_STEP, -Math.PI, Math.PI);
        }
        else if (ev.key === 'ArrowUp') {
            v.pitchTo = clamp(v.pitchTo - KEY_STEP, -1.3, 1.3);
        }
        else if (ev.key === 'ArrowDown') {
            v.pitchTo = clamp(v.pitchTo + KEY_STEP, -1.3, 1.3);
        }
        else {
            return false;
        }
        ev.preventDefault();
        return true;
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !statusEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 tail 의 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function onResize() {
        fitCanvas();
        draw();
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    // 화면 좌표(CSS px) → 장면 좌표(480x300). 리사이즈 뒤에도 늘 현재 크기로 다시 잰다
    function toScene(ev) {
        const r = cv.getBoundingClientRect();
        return [((ev.clientX - r.left) / r.width) * W, ((ev.clientY - r.top) / r.height) * H];
    }
    // 시드 고정 난수 — 같은 시드면 같은 배치가 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 화면 투영된 다각형 칠하기
    function fillPoly(pts, c, a) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i += 1) {
            ctx.lineTo(pts[i].x, pts[i].y);
        }
        ctx.closePath();
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
        // 이웃 면 사이 머리카락 틈을 같은 색 얇은 선으로 메운다
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = 0.7;
        ctx.stroke();
    }
    // 왼쪽 수치 한 줄 — 이름표 + 값
    const LEG_X = 16;
    function statRow(y, label, value) {
        ctx.textBaseline = 'alphabetic';
        ctx.textAlign = 'left';
        ctx.fillStyle = rgba(PAPER, 0.6);
        ctx.font = '500 11px sans-serif';
        ctx.fillText(label, LEG_X, y);
        ctx.fillStyle = rgba(PAPER, 0.96);
        ctx.font = '700 14px sans-serif';
        ctx.fillText(value, LEG_X, y + 17);
    }
    function clearStage() {
        ctx.fillStyle = rgba(BG, 1);
        ctx.fillRect(0, 0, W, H);
    }
    // 바닥 그림자 — 모형 아래 납작한 타원, 모형이 떠 있지 않고 놓여 보이게
    function floorShadow(rx, y, a) {
        const g = ctx.createRadialGradient(CX, y, 0, CX, y, rx);
        g.addColorStop(0, rgba([0, 0, 0], a));
        g.addColorStop(1, rgba([0, 0, 0], 0));
        ctx.save();
        ctx.translate(CX, y);
        ctx.scale(1, 0.18);
        ctx.translate(-CX, -y);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(CX, y, rx, 0, TAU);
        ctx.fill();
        ctx.restore();
    }
    const ghost = { x: -1, y: -1, fx: 0, fy: 0, tx: 0, ty: 0, t0: 0, dur: 1, down: false };
    function ghostGo(x, y, dur, t) {
        ghost.fx = ghost.x < 0 ? x : ghost.x;
        ghost.fy = ghost.y < 0 ? y : ghost.y;
        ghost.tx = x;
        ghost.ty = y;
        ghost.t0 = t;
        ghost.dur = Math.max(1, dur);
    }
    function ghostAt(t) {
        const e = smooth((t - ghost.t0) / ghost.dur);
        ghost.x = lerp(ghost.fx, ghost.tx, e);
        ghost.y = lerp(ghost.fy, ghost.ty, e);
    }
    function drawGhost() {
        if (!demo || ghost.x < 0) {
            return;
        }
        ctx.strokeStyle = rgba(PAPER, 0.9);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ghost.x, ghost.y, ghost.down ? 7 : 10, 0, TAU);
        ctx.stroke();
        ctx.fillStyle = rgba(PAPER, ghost.down ? 0.9 : 0.5);
        ctx.beginPath();
        ctx.arc(ghost.x, ghost.y, ghost.down ? 4 : 2.5, 0, TAU);
        ctx.fill();
    }
    // 시연 일정 — 루프 안의 시각(ms) 표를 지날 때마다 한 번씩 부른다
    let schedCycle = -1;
    let schedIdx = 0;
    function runSchedule(t, loop, marks, fire) {
        const cyc = Math.floor(t / loop);
        const p = t - cyc * loop;
        if (cyc !== schedCycle) {
            schedCycle = cyc;
            schedIdx = 0;
        }
        while (schedIdx < marks.length && p >= marks[schedIdx]) {
            fire(schedIdx, cyc);
            schedIdx += 1;
        }
    }
    function fmt(v, d) { return v.toFixed(d); }
    // 큰 바퀴·작은 바퀴 Tooth counts — 작은 바퀴는 큰 바퀴 각속도에 TEETH_A / TEETH_B 를 곱해 반대로 돈다
    const TEETH_A = 18;
    const TEETH_B = 10;
    // 톱니 높이(px) — 피치 원 안팎으로 절반씩
    const TOOTH_DEPTH = 10;
    // 모듈 — 피치 반지름 = GEAR_MODULE × Tooth counts / 2. 두 바퀴 모듈이 같아야 이 간격이 맞는다
    const GEAR_MODULE = 7;
    // 바퀴 두께(px) — 윤곽을 앞뒤로 절반씩 밀어낸다
    const THICK = 18;
    // 큰 바퀴 Angular speed(rad/s)
    const SPIN_A = 0.9;
    // 작은 바퀴를 반 톱니만큼 돌려 놓아 큰 바퀴의 이가 작은 바퀴의 홈에 들어가게 한다
    const HALF_TOOTH = Math.PI / TEETH_B;
    const FOCAL = 600;
    const VIEW_LERP = 0.07;
    const DEMO_LOOP = 2000;
    const TXT_RUN = 'Meshing at the tooth-count ratio';
    const TXT_STOP = 'Stopped — press Space to run again';
    const homeBtn = root.querySelector('[data-role="home"]');
    const revBtn = root.querySelector('[data-role="reverse"]');
    const RA = GEAR_MODULE * TEETH_A / 2;
    const RB = GEAR_MODULE * TEETH_B / 2;
    // 두 중심 사이 = 피치 반지름의 합. 큰 바퀴 왼쪽 끝과 작은 바퀴 오른쪽 끝의 가운데가 화면 중심에 오게 왼쪽으로 민다
    const SHIFT = -RB;
    // 톱니 윤곽 — 이 하나에 네 점: 뿌리 왼쪽·끝 왼쪽·끝 오른쪽·뿌리 오른쪽 (끝이 뿌리보다 좁은 사다리꼴)
    function gearOutline(teeth, r, phase) {
        const out = [];
        const per = TAU / teeth;
        const r0 = r - TOOTH_DEPTH / 2;
        const r1 = r + TOOTH_DEPTH / 2;
        for (let k = 0; k < teeth; k += 1) {
            const a = phase + k * per;
            const spots = [[-0.28, r0], [-0.15, r1], [0.15, r1], [0.28, r0]];
            for (let s = 0; s < spots.length; s += 1) {
                const th = a + spots[s][0] * per;
                out.push([Math.cos(th) * spots[s][1], Math.sin(th) * spots[s][1]]);
            }
        }
        return out;
    }
    const GEARS = [
        { teeth: TEETH_A, r: RA, cx: SHIFT, outline: gearOutline(TEETH_A, RA, 0), col: PAL[0] },
        { teeth: TEETH_B, r: RB, cx: SHIFT + RA + RB, outline: gearOutline(TEETH_B, RB, Math.PI + HALF_TOOTH), col: PAL[4] },
    ];
    const view = makeView(0.55, 0.42);
    let angA = 0;
    let dir = 1;
    let running = true;
    let pointerIn = false;
    // 작은 바퀴 각 — 큰 바퀴 각에 Tooth counts 비를 곱하고 부호를 뒤집는다
    function angleB(a) { return -a * TEETH_A / TEETH_B; }
    function report() { say(running ? TXT_RUN : TXT_STOP); }
    function step() {
        viewFollow(view, VIEW_LERP);
        if (running) {
            angA += dir * SPIN_A * FIXED_DT / 1000;
        }
    }
    function settle() { viewSnap(view); }
    function demoTick(t) {
        runSchedule(t, DEMO_LOOP, [200, 900, 1500], function (k) {
            if (k === 0) {
                ghostGo(170, 80, 320, t);
            }
            else if (k === 1) {
                ghostGo(440, 230, 320, t);
            }
            else {
                ghostGo(400, 70, 320, t);
            }
            report();
        });
        ghostAt(t);
        aimAt(view, CX + (ghost.x - CX) * 0.45, CY + (ghost.y - CY) * 0.45);
    }
    function gearFaces(g, ang, m) {
        const ca = Math.cos(ang), sa = Math.sin(ang);
        const n = g.outline.length;
        const front = [];
        const back = [];
        for (let i = 0; i < n; i += 1) {
            const x = g.outline[i][0] * ca - g.outline[i][1] * sa + g.cx;
            const y = g.outline[i][0] * sa + g.outline[i][1] * ca;
            front.push(apply(m, [x, y, -THICK / 2]));
            back.push(apply(m, [x, y, THICK / 2]));
        }
        const pf = front.map(function (p) { return project(p, FOCAL); });
        const pb = back.map(function (p) { return project(p, FOCAL); });
        const sides = [];
        for (let i = 0; i < n; i += 1) {
            const j = (i + 1) % n;
            // 옆면 법선 = 윤곽 진행 방향 × 두께 방향 — 바깥을 향한다
            const nrm = vnorm(cross(vsub(front[j], front[i]), vsub(back[i], front[i])));
            if (nrm[2] >= 0) {
                continue;
            }
            sides.push({ pts: [pf[i], pf[j], pb[j], pb[i]], z: (front[i][2] + front[j][2] + back[i][2] + back[j][2]) / 4, c: shadeRGB(g.col, 0.42 + 0.5 * lambert(nrm)) });
        }
        sides.sort(function (a, b) { return b.z - a.z; });
        // 앞뚜껑과 뒤뚜껑 중 화면을 보는 쪽 하나만
        const capN = apply(m, [0, 0, -1]);
        const useFront = capN[2] < 0;
        const capPts = useFront ? pf : pb;
        const nn = useFront ? capN : vscale(capN, -1);
        const cap = { pts: capPts, z: 0, c: mix(g.col, PAPER, 0.1 + 0.25 * lambert(nn)) };
        const zc = useFront ? -THICK / 2 : THICK / 2;
        const hub = [];
        for (let k = 0; k < 20; k += 1) {
            const th = (k / 20) * TAU;
            hub.push(project(apply(m, [g.cx + Math.cos(th) * 8, Math.sin(th) * 8, zc]), FOCAL));
        }
        const mr = g.r * 0.62;
        const mark = project(apply(m, [g.cx + Math.cos(ang) * mr, Math.sin(ang) * mr, zc]), FOCAL);
        return { sides: sides, cap: cap, hub: hub, mark: mark, z: apply(m, [g.cx, 0, 0])[2] };
    }
    function draw() {
        clearStage();
        floorShadow(150, 272, 0.5);
        const m = viewMatrix(view.yaw, view.pitch);
        const parts = [gearFaces(GEARS[0], angA, m), gearFaces(GEARS[1], angleB(angA), m)];
        // 먼 바퀴부터 — 바퀴 안에서는 옆면을 먼 것부터, 마지막에 화면 쪽 뚜껑
        parts.sort(function (a, b) { return b.z - a.z; });
        for (let g = 0; g < parts.length; g += 1) {
            const part = parts[g];
            for (let k = 0; k < part.sides.length; k += 1) {
                fillPoly(part.sides[k].pts, part.sides[k].c, 1);
            }
            if (part.cap) {
                fillPoly(part.cap.pts, part.cap.c, 1);
            }
            fillPoly(part.hub, BG, 1);
            ctx.fillStyle = rgba(PAPER, 0.9);
            ctx.beginPath();
            ctx.arc(part.mark.x, part.mark.y, 4 * part.mark.s, 0, TAU);
            ctx.fill();
        }
        statRow(112, 'Tooth counts', TEETH_A + ' : ' + TEETH_B);
        statRow(160, 'Small gear speed', '−' + fmt(TEETH_A / TEETH_B, 2) + '× ' + (dir > 0 ? '↻' : '↺'));
        drawGhost();
    }
    function after() {
        if (still) {
            settle();
        }
        report();
        draw();
    }
    function reverse() {
        dir = -dir;
        // 동작 줄이기에서는 바퀴를 돌리지 않는 대신 반 톱니씩 한 칸 옮겨 방향을 보인다
        if (still) {
            angA += dir * (TAU / TEETH_A) / 2;
        }
        if (revBtn) {
            revBtn.setAttribute('aria-pressed', dir < 0 ? 'true' : 'false');
        }
        after();
    }
    cv.addEventListener('pointermove', function (ev) {
        wake();
        pointerIn = true;
        const p = toScene(ev);
        aimAt(view, CX + (p[0] - CX) * 0.45, CY + (p[1] - CY) * 0.45);
        after();
    });
    cv.addEventListener('pointerleave', function () {
        if (!pointerIn) {
            return;
        }
        pointerIn = false;
        viewHome(view);
        after();
    });
    cv.addEventListener('pointerdown', function () { wake(); reverse(); });
    cv.addEventListener('keydown', function (ev) {
        if (arrowNudge(ev, view)) {
            wake();
            after();
            return;
        }
        if (ev.key === 'Enter') {
            ev.preventDefault();
            wake();
            reverse();
        }
        else if (ev.key === ' ') {
            ev.preventDefault();
            wake();
            running = !running;
            after();
        }
        else if (ev.key === 'Escape') {
            ev.preventDefault();
            wake();
            viewHome(view);
            after();
        }
    });
    if (homeBtn) {
        homeBtn.addEventListener('click', function () { wake(); viewHome(view); after(); });
    }
    if (revBtn) {
        revBtn.addEventListener('click', function () { wake(); reverse(); });
    }
    report();
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    let clock = 0;
    function frame(ts) {
        if (still) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 순간이동 대신 이어서 움직인다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            clock += FIXED_DT;
            if (demo) {
                demoTick(clock);
            }
            step();
            acc -= FIXED_DT;
            n += 1;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        lastTs = -1;
        acc = 0;
        rafId = window.requestAnimationFrame(frame);
    }
    // 동작 줄이기 설정이 페이지를 연 채 바뀌면 — 켜지면 루프를 멈추고 끝 상태로, 꺼지면 루프를 다시 돈다
    function onMotionPref() {
        still = reduceQuery.matches;
        if (still) {
            if (rafId) {
                window.cancelAnimationFrame(rafId);
                rafId = 0;
            }
            settle();
            report();
            draw();
        }
        else {
            startLoop();
        }
    }
    if (typeof reduceQuery.addEventListener === 'function') {
        reduceQuery.addEventListener('change', onMotionPref);
    }
    if (still) {
        settle();
        draw();
    }
    else {
        startLoop();
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
        if (typeof reduceQuery.removeEventListener === 'function') {
            reduceQuery.removeEventListener('change', onMotionPref);
        }
    };
})();
</script>
</body>
</html>
