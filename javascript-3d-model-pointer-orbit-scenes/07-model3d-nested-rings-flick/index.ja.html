<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投げるようにドラッグすると惰性で回り、ゆっくり止まる三重の輪 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pc is-demo" id="pc">
  <canvas class="pc__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="ドラッグして投げると惰性で回り、摩擦でゆっくり止まる三重の輪。←/→ で投げ、↑/↓ で視点を変え、Space で止めます"></canvas>
  <p class="pc__status" data-role="status" aria-live="off">停止中 — ドラッグして投げてみる</p>
  <div class="pc__tools">
    <button class="pc__btn" data-role="flick" type="button">投げる</button>
    <button class="pc__btn" data-role="stop" type="button">止める</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("pc");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    const TAU = Math.PI * 2;
    const DEG = Math.PI / 180;
    // 모형 중심 — 왼쪽 위는 버튼, 왼쪽 아래는 상태 줄이라 모형은 오른쪽으로 비켜 둔다
    const CX = 300;
    const CY = 150;
    // 파스텔 팔레트 — 어두운 무대 위에 밝은 조각을 얹어 명도 차로 경계가 읽힌다
    const BG = [29, 26, 44];
    const PANEL = [44, 39, 64];
    const PAPER = [255, 248, 234];
    const PAL = [
        [124, 196, 255],
        [255, 160, 190],
        [126, 226, 192],
        [190, 164, 255],
        [255, 208, 168],
        [246, 228, 140],
        [150, 222, 236],
        [232, 182, 228],
        [196, 220, 160],
    ];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function shadeRGB(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
    // 3차원 계산 — 화면 오른쪽이 +x, 아래가 +y, 화면 안쪽이 +z (화면 쪽을 보는 면은 법선 z 가 음수)
    function vadd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
    function vsub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
    function vscale(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }
    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
    function vnorm(a) {
        const l = Math.hypot(a[0], a[1], a[2]);
        return l > 1e-9 ? [a[0] / l, a[1] / l, a[2] / l] : [0, 0, 0];
    }
    // 회전 행렬 — 가로축(x)·세로축(y)·깊이축(z) 둘레로 a 라디안
    function rotX(a) { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; }
    function rotY(a) { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; }
    function rotZ(a) { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; }
    function matMul(a, b) {
        return [
            a[0] * b[0] + a[1] * b[3] + a[2] * b[6], a[0] * b[1] + a[1] * b[4] + a[2] * b[7], a[0] * b[2] + a[1] * b[5] + a[2] * b[8],
            a[3] * b[0] + a[4] * b[3] + a[5] * b[6], a[3] * b[1] + a[4] * b[4] + a[5] * b[7], a[3] * b[2] + a[4] * b[5] + a[5] * b[8],
            a[6] * b[0] + a[7] * b[3] + a[8] * b[6], a[6] * b[1] + a[7] * b[4] + a[8] * b[7], a[6] * b[2] + a[7] * b[5] + a[8] * b[8],
        ];
    }
    function apply(m, p) {
        return [m[0] * p[0] + m[1] * p[1] + m[2] * p[2], m[3] * p[0] + m[4] * p[1] + m[5] * p[2], m[6] * p[0] + m[7] * p[1] + m[8] * p[2]];
    }
    // 회전 행렬의 역은 전치 — 화면 방향을 모형 좌표로 되돌릴 때 쓴다
    function applyT(m, p) {
        return [m[0] * p[0] + m[3] * p[1] + m[6] * p[2], m[1] * p[0] + m[4] * p[1] + m[7] * p[2], m[2] * p[0] + m[5] * p[1] + m[8] * p[2]];
    }
    // 시점 행렬 — 먼저 세로축으로 돌리고(yaw) 그다음 가로축으로 기울인다(pitch)
    function viewMatrix(yaw, pitch) { return matMul(rotX(pitch), rotY(yaw)); }
    // 원근 나눗셈 — 화면 배율 s = focal / (focal + z). 깊이 z 가 클수록(안쪽) 작아지고 가운데로 모인다
    function project(p, focal) {
        const s = focal / (focal + p[2]);
        return { x: CX + p[0] * s, y: CY + p[1] * s, s: s, z: p[2] };
    }
    // 빛 — 왼쪽 위 앞에서 비춘다
    const LIGHT = vnorm([-0.45, -0.62, -0.64]);
    function lambert(n) { return Math.max(0, dot(n, LIGHT)); }
    function makeView(yaw, pitch) { return { yaw: yaw, pitch: pitch, yawTo: yaw, pitchTo: pitch, yaw0: yaw, pitch0: pitch }; }
    function viewFollow(v, k) {
        v.yaw += (v.yawTo - v.yaw) * k;
        v.pitch += (v.pitchTo - v.pitch) * k;
    }
    function viewSnap(v) { v.yaw = v.yawTo; v.pitch = v.pitchTo; }
    function viewHome(v) { v.yawTo = v.yaw0; v.pitchTo = v.pitch0; }
    function viewGap(v) { return Math.hypot(v.yawTo - v.yaw, v.pitchTo - v.pitch); }
    // 포인터 → 목표 각. 모형 중심에서 가로로 벗어난 만큼 yaw, 세로로 벗어난 만큼 pitch (오른쪽을 가리키면 앞면이 오른쪽으로 돈다)
    const YAW_RANGE = 1.1;
    const PITCH_RANGE = 0.8;
    function aimAt(v, px, py) {
        v.yawTo = v.yaw0 - clamp((px - CX) / (W / 2), -1, 1) * YAW_RANGE;
        v.pitchTo = v.pitch0 + clamp((py - CY) / (H / 2), -1, 1) * PITCH_RANGE;
    }
    // 방향키 한 번에 돌리는 각
    const KEY_STEP = 0.3;
    function arrowNudge(ev, v) {
        if (ev.key === 'ArrowLeft') {
            v.yawTo = clamp(v.yawTo + KEY_STEP, -Math.PI, Math.PI);
        }
        else if (ev.key === 'ArrowRight') {
            v.yawTo = clamp(v.yawTo - KEY_STEP, -Math.PI, Math.PI);
        }
        else if (ev.key === 'ArrowUp') {
            v.pitchTo = clamp(v.pitchTo - KEY_STEP, -1.3, 1.3);
        }
        else if (ev.key === 'ArrowDown') {
            v.pitchTo = clamp(v.pitchTo + KEY_STEP, -1.3, 1.3);
        }
        else {
            return false;
        }
        ev.preventDefault();
        return true;
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !statusEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 tail 의 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function onResize() {
        fitCanvas();
        draw();
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    // 화면 좌표(CSS px) → 장면 좌표(480x300). 리사이즈 뒤에도 늘 현재 크기로 다시 잰다
    function toScene(ev) {
        const r = cv.getBoundingClientRect();
        return [((ev.clientX - r.left) / r.width) * W, ((ev.clientY - r.top) / r.height) * H];
    }
    // 시드 고정 난수 — 같은 시드면 같은 배치가 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 화면 투영된 다각형 칠하기
    function fillPoly(pts, c, a) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i += 1) {
            ctx.lineTo(pts[i].x, pts[i].y);
        }
        ctx.closePath();
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
        // 이웃 면 사이 머리카락 틈을 같은 색 얇은 선으로 메운다
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = 0.7;
        ctx.stroke();
    }
    // 왼쪽 수치 한 줄 — 이름표 + 값
    const LEG_X = 16;
    function statRow(y, label, value) {
        ctx.textBaseline = 'alphabetic';
        ctx.textAlign = 'left';
        ctx.fillStyle = rgba(PAPER, 0.6);
        ctx.font = '500 11px sans-serif';
        ctx.fillText(label, LEG_X, y);
        ctx.fillStyle = rgba(PAPER, 0.96);
        ctx.font = '700 14px sans-serif';
        ctx.fillText(value, LEG_X, y + 17);
    }
    function clearStage() {
        ctx.fillStyle = rgba(BG, 1);
        ctx.fillRect(0, 0, W, H);
    }
    // 바닥 그림자 — 모형 아래 납작한 타원, 모형이 떠 있지 않고 놓여 보이게
    function floorShadow(rx, y, a) {
        const g = ctx.createRadialGradient(CX, y, 0, CX, y, rx);
        g.addColorStop(0, rgba([0, 0, 0], a));
        g.addColorStop(1, rgba([0, 0, 0], 0));
        ctx.save();
        ctx.translate(CX, y);
        ctx.scale(1, 0.18);
        ctx.translate(-CX, -y);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(CX, y, rx, 0, TAU);
        ctx.fill();
        ctx.restore();
    }
    const ghost = { x: -1, y: -1, fx: 0, fy: 0, tx: 0, ty: 0, t0: 0, dur: 1, down: false };
    function ghostGo(x, y, dur, t) {
        ghost.fx = ghost.x < 0 ? x : ghost.x;
        ghost.fy = ghost.y < 0 ? y : ghost.y;
        ghost.tx = x;
        ghost.ty = y;
        ghost.t0 = t;
        ghost.dur = Math.max(1, dur);
    }
    function ghostAt(t) {
        const e = smooth((t - ghost.t0) / ghost.dur);
        ghost.x = lerp(ghost.fx, ghost.tx, e);
        ghost.y = lerp(ghost.fy, ghost.ty, e);
    }
    function drawGhost() {
        if (!demo || ghost.x < 0) {
            return;
        }
        ctx.strokeStyle = rgba(PAPER, 0.9);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ghost.x, ghost.y, ghost.down ? 7 : 10, 0, TAU);
        ctx.stroke();
        ctx.fillStyle = rgba(PAPER, ghost.down ? 0.9 : 0.5);
        ctx.beginPath();
        ctx.arc(ghost.x, ghost.y, ghost.down ? 4 : 2.5, 0, TAU);
        ctx.fill();
    }
    // 시연 일정 — 루프 안의 시각(ms) 표를 지날 때마다 한 번씩 부른다
    let schedCycle = -1;
    let schedIdx = 0;
    function runSchedule(t, loop, marks, fire) {
        const cyc = Math.floor(t / loop);
        const p = t - cyc * loop;
        if (cyc !== schedCycle) {
            schedCycle = cyc;
            schedIdx = 0;
        }
        while (schedIdx < marks.length && p >= marks[schedIdx]) {
            fire(schedIdx, cyc);
            schedIdx += 1;
        }
    }
    function fmt(v, d) { return v.toFixed(d); }
    // 끌기 속도(px/스텝) → 角速度(rad/스텝) 배율
    const FLICK_GAIN = 0.01;
    // 손을 뗀 뒤 매 스텝 각속도에 곱하는 마찰 계수 — 1 에 가까울수록 오래 돈다
    const SPIN_FRICTION = 0.96;
    // 輪 수 — 바깥부터 세로축·가로축·깊이축
    const RING_COUNT = 3;
    const RING_R = [112, 86, 60];
    const RING_AXIS = ['y', 'x', 'z'];
    // 輪 띠 반 높이(px)와 둘레 칸 수
    const BAND = 7;
    const RING_SEG = 56;
    // 角速度 상한(rad/스텝) — 세게 던져도 띠가 끊겨 보일 만큼 빨라지지 않게
    const MAX_SPIN = 0.32;
    // 각속도가 이 아래로 떨어지면 멈춘 것으로 친다
    const STOP_W = 0.0005;
    const FOCAL = 600;
    const DEMO_LOOP = 2000;
    const TXT_SPIN = '投げた勢いで回っています';
    const TXT_REST = '停止中 — ドラッグして投げてみる';
    const flickBtn = root.querySelector('[data-role="flick"]');
    const stopBtn = root.querySelector('[data-role="stop"]');
    const view = makeView(0.35, 0.3);
    let angle = 0;
    let w = 0;
    let dragging = false;
    let px = 0;
    let py = 0;
    let lastX = 0;
    let lastY = 0;
    // 한 번 投げてから回った角度(rad)
    let turned = 0;
    function report() { say(Math.abs(w) > STOP_W || dragging ? TXT_SPIN : TXT_REST); }
    // 끌기 한 스텝의 움직임 → 부호 있는 빠르기. 가로가 크면 가로 방향, 세로가 크면 세로 방향을 따른다
    function signedSpeed(dx, dy) { return Math.abs(dx) >= Math.abs(dy) ? dx : dy; }
    // 손을 뗀 뒤 한 스텝 — 각속도에 마찰 계수를 곱한다
    function coast(v) {
        const n = v * SPIN_FRICTION;
        return Math.abs(n) < STOP_W ? 0 : n;
    }
    function step() {
        if (dragging) {
            // 끄는 동안은 손 빠르기를 바로 각속도로 — 반쯤만 섞어 손 떨림을 거른다
            const target = clamp(signedSpeed(px - lastX, py - lastY) * FLICK_GAIN, -MAX_SPIN, MAX_SPIN);
            w = lerp(w, target, 0.5);
            lastX = px;
            lastY = py;
        }
        else {
            w = coast(w);
        }
        angle += w;
        turned += Math.abs(w);
    }
    function settle() {
        // 동작 줄이기 — 남은 회전을 한 번에 더해 멈춘 자리로 바로 간다 (등비급수 합 w / (1 − 마찰))
        angle += w * SPIN_FRICTION / (1 - SPIN_FRICTION);
        turned += Math.abs(w * SPIN_FRICTION / (1 - SPIN_FRICTION));
        w = 0;
        viewSnap(view);
    }
    function grab(x, y) {
        dragging = true;
        px = lastX = x;
        py = lastY = y;
        turned = 0;
    }
    function demoTick(t) {
        runSchedule(t, DEMO_LOOP, [200, 440, 1150, 1370], function (k) {
            if (k === 0) {
                ghost.x = 230;
                ghost.y = 150;
                ghostGo(430, 160, 240, t);
                ghost.down = true;
                grab(230, 150);
            }
            else if (k === 1) {
                ghost.down = false;
                dragging = false;
            }
            else if (k === 2) {
                ghostGo(240, 140, 220, t);
                ghost.down = true;
                grab(ghost.x, ghost.y);
            }
            else {
                ghost.down = false;
                dragging = false;
            }
            report();
        });
        ghostAt(t);
        if (dragging) {
            px = ghost.x;
            py = ghost.y;
        }
    }
    // 輪 i 의 자세 — 바깥 輪 안에 가운데, 그 안에 안쪽이 매달린 짐벌. 같은 각을 각자 다른 축에 쓴다
    function axisRot(axis, a) { return axis === 'y' ? rotY(a) : (axis === 'x' ? rotX(a) : rotZ(a)); }
    function ringMatrix(i) {
        let m = axisRot(RING_AXIS[0], angle);
        for (let k = 1; k <= i; k += 1) {
            m = matMul(m, axisRot(RING_AXIS[k], angle));
        }
        return m;
    }
    function draw() {
        clearStage();
        floorShadow(130, 274, 0.5);
        const vm = viewMatrix(view.yaw, view.pitch);
        const quads = [];
        const cols = [PAL[0], PAL[7], PAL[5]];
        for (let i = 0; i < RING_COUNT; i += 1) {
            const m = matMul(vm, ringMatrix(i));
            const r = RING_R[i];
            for (let k = 0; k < RING_SEG; k += 1) {
                const a0 = (k / RING_SEG) * TAU, a1 = ((k + 1) / RING_SEG) * TAU;
                const p00 = apply(m, [r * Math.cos(a0), r * Math.sin(a0), -BAND]);
                const p10 = apply(m, [r * Math.cos(a1), r * Math.sin(a1), -BAND]);
                const p11 = apply(m, [r * Math.cos(a1), r * Math.sin(a1), BAND]);
                const p01 = apply(m, [r * Math.cos(a0), r * Math.sin(a0), BAND]);
                const am = (a0 + a1) / 2;
                const n = apply(m, [Math.cos(am), Math.sin(am), 0]);
                // 띠 바깥면이 화면을 보면 밝게, 등지면 輪 안쪽 면이 보이는 것이라 어둡게
                const outside = n[2] < 0;
                const lit = outside ? 0.45 + 0.55 * lambert(n) : 0.32 + 0.3 * lambert(vscale(n, -1));
                const stripe = k % 4 === 0 ? mix(cols[i], PAPER, 0.45) : cols[i];
                quads.push({ pts: [project(p00, FOCAL), project(p10, FOCAL), project(p11, FOCAL), project(p01, FOCAL)], z: (p00[2] + p10[2] + p11[2] + p01[2]) / 4, c: shadeRGB(stripe, lit) });
            }
        }
        quads.sort(function (a, b) { return b.z - a.z; });
        // 가운데 심 — 먼 띠 다음, 앞 띠 전에 그리면 輪 사이에 끼어 보인다
        let coreDone = false;
        for (let k = 0; k < quads.length; k += 1) {
            if (!coreDone && quads[k].z < 0) {
                const g = ctx.createRadialGradient(CX - 6, CY - 6, 2, CX, CY, 26);
                g.addColorStop(0, rgba(PAPER, 1));
                g.addColorStop(1, rgba(PAL[3], 0.0));
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(CX, CY, 26, 0, TAU);
                ctx.fill();
                coreDone = true;
            }
            fillPoly(quads[k].pts, quads[k].c, 1);
        }
        statRow(112, '角速度', fmt(w, 3) + ' rad/f');
        statRow(160, '投げてから回った角度', fmt(turned / DEG, 0) + '°');
        drawGhost();
    }
    function after() {
        if (still && !dragging) {
            settle();
        }
        report();
        draw();
    }
    function flick(v) {
        turned = 0;
        w = clamp(v, -MAX_SPIN, MAX_SPIN);
        after();
    }
    cv.addEventListener('pointerdown', function (ev) {
        wake();
        const p = toScene(ev);
        grab(p[0], p[1]);
        if (cv.setPointerCapture) {
            cv.setPointerCapture(ev.pointerId);
        }
        after();
    });
    cv.addEventListener('pointermove', function (ev) {
        if (!dragging) {
            return;
        }
        const p = toScene(ev);
        px = p[0];
        py = p[1];
        // 동작 줄이기에서는 루프가 없으니 움직인 만큼 바로 돌린다
        if (still) {
            angle += signedSpeed(px - lastX, py - lastY) * FLICK_GAIN;
            lastX = px;
            lastY = py;
            draw();
        }
    });
    function release() {
        if (!dragging) {
            return;
        }
        dragging = false;
        after();
    }
    cv.addEventListener('pointerup', release);
    cv.addEventListener('pointercancel', release);
    cv.addEventListener('keydown', function (ev) {
        if (ev.key === 'ArrowRight') {
            ev.preventDefault();
            wake();
            flick(w + 0.12);
        }
        else if (ev.key === 'ArrowLeft') {
            ev.preventDefault();
            wake();
            flick(w - 0.12);
        }
        else if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
            arrowNudge(ev, view);
            wake();
            after();
        }
        else if (ev.key === 'Enter') {
            ev.preventDefault();
            wake();
            flick(0.16);
        }
        else if (ev.key === ' ' || ev.key === 'Escape') {
            ev.preventDefault();
            wake();
            w = 0;
            after();
        }
    });
    if (flickBtn) {
        flickBtn.addEventListener('click', function () { wake(); flick(0.16); });
    }
    if (stopBtn) {
        stopBtn.addEventListener('click', function () { wake(); w = 0; after(); });
    }
    report();
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    let clock = 0;
    function frame(ts) {
        if (still) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 순간이동 대신 이어서 움직인다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            clock += FIXED_DT;
            if (demo) {
                demoTick(clock);
            }
            step();
            acc -= FIXED_DT;
            n += 1;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        lastTs = -1;
        acc = 0;
        rafId = window.requestAnimationFrame(frame);
    }
    // 동작 줄이기 설정이 페이지를 연 채 바뀌면 — 켜지면 루프를 멈추고 끝 상태로, 꺼지면 루프를 다시 돈다
    function onMotionPref() {
        still = reduceQuery.matches;
        if (still) {
            if (rafId) {
                window.cancelAnimationFrame(rafId);
                rafId = 0;
            }
            settle();
            report();
            draw();
        }
        else {
            startLoop();
        }
    }
    if (typeof reduceQuery.addEventListener === 'function') {
        reduceQuery.addEventListener('change', onMotionPref);
    }
    if (still) {
        settle();
        draw();
    }
    else {
        startLoop();
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
        if (typeof reduceQuery.removeEventListener === 'function') {
            reduceQuery.removeEventListener('change', onMotionPref);
        }
    };
})();
</script>
</body>
</html>
