<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button whose glow widens by the distance value — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pg is-demo" id="pg">
  <p class="pg__badge" id="pgBadge">Distance value 100%</p>
  <div class="pg__scene" id="pgScene">
    <button class="pg__btn" id="pgBtn" type="button">Get started</button>
  </div>
</div>
</main>
<script>
(function () {
  // PROX_GLOW_RADIUS_MAX_PX — 변형 1: 40 → 80 로 늘리면 후광이 버튼 전체를 덮을 만큼 크게 번진다.
  var PROX_GLOW_RADIUS_MAX_PX = 40;
  var PROX_RADIUS_PX = 170;
  var LERP = 0.18;

  var root = document.getElementById('pg');
  var scene = document.getElementById('pgScene');
  var btn = document.getElementById('pgBtn');
  var badge = document.getElementById('pgBadge');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  var targetP = 0;
  var curP = 0;
  var hasPointer = false;

  function distanceToButton(x, y) {
    var r = btn.getBoundingClientRect();
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    return Math.hypot(x - cx, y - cy);
  }

  function render(p) {
    var blurRadius = p * PROX_GLOW_RADIUS_MAX_PX;
    var spread = p * PROX_GLOW_RADIUS_MAX_PX * 0.3;
    var alpha = (0.18 + p * 0.55).toFixed(2);
    btn.style.boxShadow = '0 0 ' + blurRadius.toFixed(1) + 'px ' + spread.toFixed(1) + 'px rgba(255,247,230,' + alpha + ')';
    btn.style.filter = 'brightness(' + (1 + p * 0.22).toFixed(3) + ')';
    badge.textContent = 'Distance value ' + Math.round((1 - p) * 100) + '%';
  }

  // 자동 시연: 가상 커서가 궤도(반지름이 2초 동안 0 → 최대 → 0)를 돌며 접근·이탈을 만든다.
  function syntheticOffset(t) {
    var ang = t * 1.7;
    var rad = 110 * (1 + Math.cos(t * Math.PI));
    return [Math.cos(ang) * rad, Math.sin(ang) * rad];
  }

  var startTime = null;
  function loop(now) {
    if (startTime === null) { startTime = now; }
    var t = (now - startTime) / 1000;
    if (!hasPointer && !reduce) {
      var r = btn.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var cy = r.top + r.height / 2;
      var off = syntheticOffset(t);
      var d = Math.hypot(off[0], off[1]);
      targetP = clamp(1 - d / PROX_RADIUS_PX, 0, 1);
      void cx; void cy;
    }
    curP += (targetP - curP) * LERP;
    render(curP);
    requestAnimationFrame(loop);
  }

  scene.addEventListener('pointermove', function (e) {
    hasPointer = true;
    root.classList.remove('is-demo');
    var d = distanceToButton(e.clientX, e.clientY);
    targetP = clamp(1 - d / PROX_RADIUS_PX, 0, 1);
    if (reduce) { curP = targetP; render(curP); }
  });
  scene.addEventListener('pointerleave', function () {
    hasPointer = false;
    targetP = 0;
    if (reduce) { curP = 0; render(0); }
  });
  btn.addEventListener('focus', function () {
    hasPointer = true;
    targetP = 1;
    if (reduce) { curP = 1; render(1); }
  });
  btn.addEventListener('blur', function () {
    hasPointer = false;
    targetP = 0;
    if (reduce) { curP = 0; render(0); }
  });

  if (reduce) {
    render(0);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
