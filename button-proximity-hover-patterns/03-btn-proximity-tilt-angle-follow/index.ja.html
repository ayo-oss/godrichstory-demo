<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>距離値が角度値に変わる傾きボタン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ta is-demo" id="ta">
  <p class="ta__badge" id="taBadge">角度値 0°</p>
  <div class="ta__scene" id="taScene">
    <button class="ta__btn" id="taBtn" type="button">
      <span class="ta__label">購入する</span>
    </button>
  </div>
</div>
</main>
<script>
(function () {
  var PROX_RADIUS_PX = 190;
  var TA_MAX_DEG = 12;
  var LERP = 0.16;

  var root = document.getElementById('ta');
  var scene = document.getElementById('taScene');
  var btn = document.getElementById('taBtn');
  var badge = document.getElementById('taBadge');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  var targetDx = 0, targetDy = 0;
  var curDx = 0, curDy = 0;
  var hasPointer = false;

  function vectorToButton(x, y) {
    var r = btn.getBoundingClientRect();
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    return [x - cx, y - cy];
  }

  function render(dx, dy) {
    // 방향 벡터 → 각도(atan2) 변환 — 距離値(가까울수록 1)을 각도 크기로 쓴다.
    var d = Math.hypot(dx, dy);
    var p = clamp(1 - d / PROX_RADIUS_PX, 0, 1);
    var ux = d > 0.001 ? dx / d : 0;
    var uy = d > 0.001 ? dy / d : 0;
    var rotY = ux * p * TA_MAX_DEG;
    var rotX = -uy * p * TA_MAX_DEG;
    var lean = p * 6;
    btn.style.transform = 'translate(' + (ux * lean).toFixed(2) + 'px,' + (uy * lean).toFixed(2) + 'px) rotateX(' + rotX.toFixed(2) + 'deg) rotateY(' + rotY.toFixed(2) + 'deg)';
    // 계산 레이어: 같은 기울기 각도(ux·uy·p) 를 테두리 하이라이트 위치·깊이 그림자에도 전파한다.
    var shadowX = ux * p * 16;
    var shadowY = 6 + uy * p * 12;
    var shadowBlur = 14 + p * 22;
    btn.style.boxShadow = shadowX.toFixed(1) + 'px ' + shadowY.toFixed(1) + 'px ' + shadowBlur.toFixed(1) + 'px rgba(23,20,26,' + (0.2 + p * 0.3).toFixed(2) + ')';
    btn.style.setProperty('--hl-x', (50 + ux * 38).toFixed(1) + '%');
    btn.style.setProperty('--hl-y', (50 + uy * 38).toFixed(1) + '%');
    btn.style.setProperty('--hl-o', (0.12 + p * 0.5).toFixed(2));
    var angleDeg = Math.atan2(dy, dx) * 180 / Math.PI;
    badge.textContent = '角度値 ' + Math.round(rotY) + '°';
    void angleDeg;
  }

  function syntheticOffset(t) {
    var ang = t * 1.9;
    var rad = 130 * (1 + Math.cos(t * Math.PI));
    return [Math.cos(ang) * rad, Math.sin(ang) * rad * 0.7];
  }

  var startTime = null;
  function loop(now) {
    if (startTime === null) { startTime = now; }
    var t = (now - startTime) / 1000;
    if (!hasPointer && !reduce) {
      var off = syntheticOffset(t);
      targetDx = off[0]; targetDy = off[1];
    }
    curDx += (targetDx - curDx) * LERP;
    curDy += (targetDy - curDy) * LERP;
    render(curDx, curDy);
    requestAnimationFrame(loop);
  }

  scene.addEventListener('pointermove', function (e) {
    hasPointer = true;
    root.classList.remove('is-demo');
    var v = vectorToButton(e.clientX, e.clientY);
    targetDx = v[0]; targetDy = v[1];
    if (reduce) { curDx = v[0]; curDy = v[1]; render(curDx, curDy); }
  });
  scene.addEventListener('pointerleave', function () {
    hasPointer = false;
    targetDx = PROX_RADIUS_PX * 2; targetDy = 0;
    if (reduce) { curDx = targetDx; curDy = 0; render(curDx, 0); }
  });
  btn.addEventListener('focus', function () {
    hasPointer = true;
    targetDx = 0; targetDy = 0;
    if (reduce) { curDx = 0; curDy = 0; render(0, 0); }
  });
  btn.addEventListener('blur', function () {
    hasPointer = false;
    targetDx = PROX_RADIUS_PX * 2; targetDy = 0;
    if (reduce) { curDx = targetDx; curDy = 0; render(curDx, 0); }
  });

  if (reduce) {
    curDx = PROX_RADIUS_PX * 2; curDy = 0;
    render(curDx, curDy);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
