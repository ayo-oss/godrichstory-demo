<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Difficulty Slider That Overshoots and Springs Back at Each Tier — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sst is-demo" id="sst">
  <div class="sst__track" id="sstTrack">
    <div class="sst__tick" style="left:0%"></div>
    <div class="sst__tick" style="left:25%"></div>
    <div class="sst__tick" style="left:50%"></div>
    <div class="sst__tick" style="left:75%"></div>
    <div class="sst__tick" style="left:100%"></div>
    <div class="sst__fill" id="sstFill"></div>
    <button type="button" class="sst__thumb" id="sstThumb" role="slider"
      aria-label="Difficulty" aria-valuemin="0" aria-valuemax="4" aria-valuenow="1" aria-valuetext="Normal" tabindex="0"></button>
  </div>
  <p class="sst__label" id="sstLabel">Normal</p>
</div>
</main>
<script>
(function () {
  var LEVELS = ['Easy', 'Normal', 'Hard', 'Very Hard', 'Extreme'];
  var N = LEVELS.length;
  var SPRING_K = 210, SPRING_D = 18, DT = 1 / 60;
  var root = document.getElementById('sst');
  var track = document.getElementById('sstTrack');
  var fill = document.getElementById('sstFill');
  var thumb = document.getElementById('sstThumb');
  var label = document.getElementById('sstLabel');
  var tier = 1;
  var pos = tierPct(1);
  var raf = 0;

  function tierPct(t) { return (t / (N - 1)) * 100; }
  function paintAt(pct) {
    thumb.style.left = pct + '%';
    fill.style.width = pct + '%';
  }
  function setReadout(t) {
    thumb.setAttribute('aria-valuenow', String(t));
    thumb.setAttribute('aria-valuetext', LEVELS[t]);
    label.textContent = LEVELS[t];
  }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 계산 겹: 목표 단계까지 스프링-감쇠 방정식(가속도 = -k*(위치-목표) - d*속도)을 매 프레임 적분해
  // 단계를 살짝 지나쳤다가(오버슛) 되튕겨 정확히 그 단계에서 멈춘다
  function springTo(target) {
    cancelAnimationFrame(raf);
    if (reduce) { pos = target; paintAt(pos); return; }
    var vel = 0;
    function step() {
      var force = -SPRING_K * (pos - target) - SPRING_D * vel;
      vel += force * DT;
      pos += vel * DT;
      paintAt(pos);
      if (Math.abs(pos - target) > 0.15 || Math.abs(vel) > 0.15) raf = requestAnimationFrame(step);
      else { pos = target; paintAt(pos); }
    }
    raf = requestAnimationFrame(step);
  }
  function human() { root.classList.remove('is-demo'); clearInterval(timer); }
  function settle(t) { tier = Math.max(0, Math.min(N - 1, t)); setReadout(tier); springTo(tierPct(tier)); }
  function pctFromX(x) {
    var r = track.getBoundingClientRect();
    return Math.max(0, Math.min(100, ((x - r.left) / r.width) * 100));
  }
  thumb.addEventListener('pointerdown', function (e) {
    human(); thumb.setPointerCapture(e.pointerId); cancelAnimationFrame(raf);
    function move(ev) { pos = pctFromX(ev.clientX); paintAt(pos); }
    function up() {
      thumb.removeEventListener('pointermove', move); thumb.removeEventListener('pointerup', up);
      settle(Math.round(pos / 100 * (N - 1)));
    }
    thumb.addEventListener('pointermove', move); thumb.addEventListener('pointerup', up);
  });
  thumb.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); human(); settle(tier + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); human(); settle(tier - 1); }
    else if (e.key === 'Home') { e.preventDefault(); human(); settle(0); }
    else if (e.key === 'End') { e.preventDefault(); human(); settle(N - 1); }
  });

  var sequence = [3, 0, 4, 1, 2];
  var si = 0;
  function tick() { settle(sequence[si % sequence.length]); si++; }
  var timer = reduce ? null : setInterval(tick, 900);
  setReadout(tier); paintAt(pos);
}());
</script>
</body>
</html>
