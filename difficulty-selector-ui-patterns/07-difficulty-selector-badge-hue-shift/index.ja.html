<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>色が数式でつながるバッジ型難易度選択 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bhs is-demo" id="bhs" role="radiogroup" aria-label="難易度">
  <button type="button" class="bhs__badge" role="radio" aria-checked="false" data-i="0" tabindex="0">簡単</button>
  <button type="button" class="bhs__badge" role="radio" aria-checked="false" data-i="1" tabindex="-1">普通</button>
  <button type="button" class="bhs__badge" role="radio" aria-checked="true" data-i="2" tabindex="-1">難しい</button>
  <button type="button" class="bhs__badge" role="radio" aria-checked="false" data-i="3" tabindex="-1">とても難しい</button>
  <button type="button" class="bhs__badge" role="radio" aria-checked="false" data-i="4" tabindex="-1">最高</button>
</div>
</main>
<script>
(function () {
  var LEVELS = ['簡単', '普通', '難しい', 'とても難しい', '最高'];
  var BASE_HUE = 140, HUE_SPACING = 46, SAT = 45, LIGHT = 72;
  var root = document.getElementById('bhs');
  var badges = Array.prototype.slice.call(root.querySelectorAll('.bhs__badge'));
  var selected = 2;

  // 계산 겹: 배지 색을 고정 다섯 색이 아니라 단계 번호를 색상각 수식(기준 색상 + 번호*간격)에 넣어 구한다
  function badgeHue(i) { return (BASE_HUE + i * HUE_SPACING) % 360; }
  function badgeColor(i) { return 'hsl(' + badgeHue(i) + ', ' + SAT + '%, ' + LIGHT + '%)'; }
  function paint() {
    badges.forEach(function (b, i) {
      b.style.background = badgeColor(i);
      b.setAttribute('aria-checked', i === selected ? 'true' : 'false');
      b.setAttribute('tabindex', i === selected ? '0' : '-1');
    });
  }
  function human() { root.classList.remove('is-demo'); clearInterval(timer); }
  function select(i) { selected = i; paint(); }

  badges.forEach(function (b, i) {
    b.addEventListener('click', function () { human(); select(i); });
    b.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); human(); var n = Math.min(LEVELS.length - 1, selected + 1); select(n); badges[n].focus({ preventScroll: true }); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); human(); var p = Math.max(0, selected - 1); select(p); badges[p].focus({ preventScroll: true }); }
    });
  });

  var sequence = [4, 0, 3, 1, 2];
  var si = 0;
  function tick() { select(sequence[si % sequence.length]); si++; }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timer = reduce ? null : setInterval(tick, 700);
  paint();
}());
</script>
</body>
</html>
