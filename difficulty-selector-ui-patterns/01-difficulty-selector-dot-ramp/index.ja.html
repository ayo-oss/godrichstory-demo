<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>色が段階ごとに広がるドット式難易度セレクター — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dr is-demo" id="dr">
  <div class="dr__track" id="drTrack" role="radiogroup" aria-label="難易度">
    <div class="dr__fill" id="drFill"></div>
    <button type="button" class="dr__dot" role="radio" aria-checked="false" aria-label="簡単" data-i="0" tabindex="0"></button>
    <button type="button" class="dr__dot" role="radio" aria-checked="false" aria-label="普通" data-i="1" tabindex="-1"></button>
    <button type="button" class="dr__dot" role="radio" aria-checked="false" aria-label="難しい" data-i="2" tabindex="-1"></button>
    <button type="button" class="dr__dot" role="radio" aria-checked="false" aria-label="とても難しい" data-i="3" tabindex="-1"></button>
    <button type="button" class="dr__dot" role="radio" aria-checked="false" aria-label="最高" data-i="4" tabindex="-1"></button>
  </div>
  <p class="dr__label"><span id="drName">普通</span> <span id="drCount">2 / 5</span></p>
</div>
</main>
<script>
(function () {
  var LEVELS = ['簡単', '普通', '難しい', 'とても難しい', '最高'];
  var HUE_LOW = 132, HUE_HIGH = 0, SAT = 46, LIGHT = 68;
  var root = document.getElementById('dr');
  var track = document.getElementById('drTrack');
  var fill = document.getElementById('drFill');
  var dots = Array.prototype.slice.call(track.querySelectorAll('.dr__dot'));
  var nameOut = document.getElementById('drName');
  var countOut = document.getElementById('drCount');
  var selected = 1;

  // 계산 겹: 점 순서(0~4)를 초록(132°)에서 빨강(0°)으로 이어지는 색상각 값으로 바꾼다
  function dotHue(i) { return HUE_LOW + (HUE_HIGH - HUE_LOW) * (i / (LEVELS.length - 1)); }
  function dotColor(i) { return 'hsl(' + dotHue(i).toFixed(1) + ', ' + SAT + '%, ' + LIGHT + '%)'; }

  function paintUpTo(i) {
    dots.forEach(function (d, idx) {
      d.style.background = idx <= i ? dotColor(idx) : '';
    });
    fill.style.width = ((i + 1) / LEVELS.length * 100) + '%';
    fill.style.background = dotColor(i);
  }
  function commit(i) {
    selected = i;
    dots.forEach(function (d, idx) {
      d.setAttribute('aria-checked', idx === i ? 'true' : 'false');
      d.setAttribute('tabindex', idx === i ? '0' : '-1');
    });
    paintUpTo(i);
    nameOut.textContent = LEVELS[i];
    countOut.textContent = (i + 1) + ' / ' + LEVELS.length;
  }
  function human() { root.classList.remove('is-demo'); clearInterval(timer); }

  dots.forEach(function (d, i) {
    d.addEventListener('pointerenter', function () { if (!root.classList.contains('is-demo')) paintUpTo(i); });
    d.addEventListener('pointerleave', function () { if (!root.classList.contains('is-demo')) paintUpTo(selected); });
    d.addEventListener('click', function () { human(); commit(i); });
    d.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); human(); commit(Math.min(LEVELS.length - 1, selected + 1)); dots[selected].focus({ preventScroll: true }); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); human(); commit(Math.max(0, selected - 1)); dots[selected].focus({ preventScroll: true }); }
    });
  });

  var sequence = [3, 0, 4, 1, 2];
  var si = 0;
  function tick() { commit(sequence[si % sequence.length]); si++; }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timer = reduce ? null : setInterval(tick, 620);
  commit(selected);
}());
</script>
</body>
</html>
