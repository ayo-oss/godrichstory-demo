<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選ぶほど影が深くなるカード型難易度選択 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rc is-demo" id="rc" role="radiogroup" aria-label="難易度">
  <button type="button" class="rc__card" role="radio" aria-checked="false" data-i="0" tabindex="0">簡単</button>
  <button type="button" class="rc__card" role="radio" aria-checked="false" data-i="1" tabindex="-1">普通</button>
  <button type="button" class="rc__card" role="radio" aria-checked="false" data-i="2" tabindex="-1">難しい</button>
</div>
</main>
<script>
(function () {
  var LEVELS = ['簡単', '普通', '難しい'];
  var BASE_Y = 6, Y_STEP = 9, BASE_BLUR = 14, BLUR_STEP = 12, BASE_LIFT = 2, LIFT_STEP = 5;
  var root = document.getElementById('rc');
  var cards = Array.prototype.slice.call(root.querySelectorAll('.rc__card'));
  var selected = 0;

  // 계산 겹: 카드 그림자의 y·blur·들뜬 높이를 고정값이 아니라 단계 번호(tier)에 비례해 구한다
  function shadowFor(tier) {
    var y = BASE_Y + tier * Y_STEP;
    var blur = BASE_BLUR + tier * BLUR_STEP;
    var lift = BASE_LIFT + tier * LIFT_STEP;
    return { y: y, blur: blur, lift: lift };
  }
  function paint() {
    cards.forEach(function (c, i) {
      var on = i === selected;
      c.setAttribute('aria-checked', on ? 'true' : 'false');
      c.setAttribute('tabindex', on ? '0' : '-1');
      if (on) {
        var s = shadowFor(i);
        c.style.boxShadow = '0 ' + s.y + 'px ' + s.blur + 'px rgba(23, 20, 26, .38)';
        c.style.transform = 'translateY(-' + s.lift + 'px)';
      } else {
        c.style.boxShadow = '';
        c.style.transform = '';
      }
    });
  }
  function human() { root.classList.remove('is-demo'); clearInterval(timer); }
  function select(i) { selected = i; paint(); }

  cards.forEach(function (c, i) {
    c.addEventListener('click', function () { human(); select(i); });
    c.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); human(); select((selected + 1) % LEVELS.length); cards[selected].focus({ preventScroll: true }); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); human(); select((selected - 1 + LEVELS.length) % LEVELS.length); cards[selected].focus({ preventScroll: true }); }
    });
  });

  var si = 0;
  function tick() { si = (si + 1) % LEVELS.length; select(si); }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timer = reduce ? null : setInterval(tick, 700);
  paint();
}());
</script>
</body>
</html>
