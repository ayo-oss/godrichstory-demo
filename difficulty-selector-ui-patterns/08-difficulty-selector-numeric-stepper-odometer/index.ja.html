<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字がメーターのように回る難易度ステッパー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="nso is-demo" id="nso">
  <div class="nso__display" id="nsoDisplay" role="spinbutton" tabindex="0"
    aria-label="難易度スコア" aria-valuemin="1" aria-valuemax="12" aria-valuenow="5">
    <div class="nso__col"><div class="nso__strip" id="nsoTens">
      <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>
    </div></div>
    <div class="nso__col"><div class="nso__strip" id="nsoOnes">
      <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>
    </div></div>
  </div>
  <div class="nso__row">
    <button type="button" class="nso__btn" id="nsoMinus" aria-label="スコアを下げる">−</button>
    <button type="button" class="nso__btn" id="nsoPlus" aria-label="スコアを上げる">+</button>
  </div>
  <p class="nso__label">難易度スコア <span id="nsoOut">5</span></p>
</div>
</main>
<script>
(function () {
  var MIN = 1, MAX = 12, DIGIT_H = 26;
  var root = document.getElementById('nso');
  var display = document.getElementById('nsoDisplay');
  var tensStrip = document.getElementById('nsoTens');
  var onesStrip = document.getElementById('nsoOnes');
  var out = document.getElementById('nsoOut');
  var value = 5;

  // 계산 겹: 값을 10^자리로 나눈 몫의 일의 자리(placeDigit)로 각 릴이 보여줄 숫자를 구하고,
  // 그 자릿값 * 칸 높이만큼 릴을 밀어 그 숫자가 창에 걸리게 한다 — 자리올림은 몫이 바뀌면서 자연히 생긴다
  function placeDigit(v, place) { return Math.floor(v / Math.pow(10, place)) % 10; }
  function paint() {
    var ones = placeDigit(value, 0), tens = placeDigit(value, 1);
    onesStrip.style.transform = 'translateY(-' + (ones * DIGIT_H) + 'px)';
    tensStrip.style.transform = 'translateY(-' + (tens * DIGIT_H) + 'px)';
    display.setAttribute('aria-valuenow', String(value));
    out.textContent = String(value);
  }
  function human() { root.classList.remove('is-demo'); clearInterval(timer); }
  function set(v) { value = Math.max(MIN, Math.min(MAX, v)); paint(); }

  document.getElementById('nsoPlus').addEventListener('click', function () { human(); set(value + 1); });
  document.getElementById('nsoMinus').addEventListener('click', function () { human(); set(value - 1); });
  display.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); human(); set(value + 1); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); human(); set(value - 1); }
  });

  var sequence = [9, 10, 3, 12, 1, 7];
  var si = 0;
  function tick() { set(sequence[si % sequence.length]); si++; }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timer = reduce ? null : setInterval(tick, 850);
  paint();
}());
</script>
</body>
</html>
