<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Semicircle Difficulty Gauge Set by Drag Angle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gad is-demo" id="gad">
  <div class="gad__face" id="gadFace" role="slider" tabindex="0"
    aria-label="Difficulty" aria-valuemin="0" aria-valuemax="4" aria-valuenow="2" aria-valuetext="Hard">
    <div class="gad__zones" aria-hidden="true">
      <span class="gad__zone" data-i="0"></span>
      <span class="gad__zone" data-i="1"></span>
      <span class="gad__zone" data-i="2"></span>
      <span class="gad__zone" data-i="3"></span>
      <span class="gad__zone" data-i="4"></span>
    </div>
    <div class="gad__needle" id="gadNeedle" aria-hidden="true"></div>
    <div class="gad__pivot" aria-hidden="true"></div>
  </div>
  <p class="gad__label">Difficulty <span id="gadOut">Hard</span></p>
</div>
</main>
<script>
(function () {
  var LEVELS = ['Easy', 'Normal', 'Hard', 'Very Hard', 'Extreme'];
  var ZONE_DEG = 36; // 180deg / 5구역
  var root = document.getElementById('gad');
  var face = document.getElementById('gadFace');
  var needle = document.getElementById('gadNeedle');
  var zones = Array.prototype.slice.call(face.querySelectorAll('.gad__zone'));
  var out = document.getElementById('gadOut');
  var value = 2; // 0..4 연속값
  var dragging = false;

  function zoneCenterDeg(i) { return -90 + ZONE_DEG / 2 + i * ZONE_DEG; }
  zones.forEach(function (z, i) { z.style.transform = 'rotate(' + zoneCenterDeg(i) + 'deg)'; });

  // 계산 겹: 포인터 좌표와 피벗(바닥 중앙) 사이의 각도를 atan2 로 구해 -90~90도 구간을 0~4 값으로 매핑한다
  function angleToValue(clientX, clientY) {
    var r = face.getBoundingClientRect();
    var px = r.left + r.width / 2;
    var py = r.bottom;
    var dx = clientX - px;
    var dy = Math.min(clientY - py, -1); // 피벗 위쪽으로 강제해 좌측 경계에서 각도가 튀지 않게 한다
    var theta = Math.atan2(dy, dx) * 180 / Math.PI; // -180..0
    var t = (theta + 180) / 180;
    t = Math.max(0, Math.min(1, t));
    return t * 4;
  }
  function paint() {
    var deg = -90 + (value / 4) * 180;
    needle.style.transform = 'rotate(' + deg + 'deg)';
    var zi = Math.round(value);
    zones.forEach(function (z, i) { z.classList.toggle('is-active', i === zi); });
    face.setAttribute('aria-valuenow', String(zi));
    face.setAttribute('aria-valuetext', LEVELS[zi]);
    out.textContent = LEVELS[zi];
  }
  function human() { root.classList.remove('is-demo'); clearInterval(timer); }
  function setValue(v) { value = Math.max(0, Math.min(4, v)); paint(); }

  face.addEventListener('pointerdown', function (e) {
    human(); dragging = true; face.setPointerCapture(e.pointerId);
    setValue(angleToValue(e.clientX, e.clientY));
  });
  face.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    setValue(angleToValue(e.clientX, e.clientY));
  });
  face.addEventListener('pointerup', function (e) {
    dragging = false; setValue(Math.round(value));
  });
  face.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); human(); setValue(Math.round(value) + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); human(); setValue(Math.round(value) - 1); }
    else if (e.key === 'Home') { e.preventDefault(); human(); setValue(0); }
    else if (e.key === 'End') { e.preventDefault(); human(); setValue(4); }
  });

  var sequence = [4, 0, 3, 1, 2];
  var si = 0;
  function tick() { setValue(sequence[si % sequence.length]); si++; }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timer = reduce ? null : setInterval(tick, 780);
  paint();
}());
</script>
</body>
</html>
