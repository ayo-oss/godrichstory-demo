<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光沢が走り抜けるバー型難易度ゲージ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bmf is-demo" id="bmf">
  <div class="bmf__meter" id="bmfMeter" role="slider" tabindex="0"
    aria-label="難易度" aria-valuemin="0" aria-valuemax="4" aria-valuenow="2" aria-valuetext="難しい">
    <div class="bmf__fill" id="bmfFill"></div>
    <div class="bmf__gloss" id="bmfGloss"></div>
  </div>
  <div class="bmf__row">
    <button type="button" class="bmf__btn" id="bmfMinus" aria-label="難易度を下げる">−</button>
    <span class="bmf__name" id="bmfName">難しい</span>
    <button type="button" class="bmf__btn" id="bmfPlus" aria-label="難易度を上げる">+</button>
  </div>
</div>
</main>
<script>
(function () {
  var LEVELS = ['簡単', '普通', '難しい', 'とても難しい', '最高'];
  var N = LEVELS.length;
  var SWEEP_MS = 480;
  var root = document.getElementById('bmf');
  var meter = document.getElementById('bmfMeter');
  var fill = document.getElementById('bmfFill');
  var gloss = document.getElementById('bmfGloss');
  var name = document.getElementById('bmfName');
  var tier = 2;
  var raf = 0, t0 = 0;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  // 계산 겹: 채움이 바뀔 때마다 밝은 띠의 위치를 easeOutCubic(경과비율) 로 매 프레임 계산해 왼쪽에서 오른쪽으로 훑는다
  function sweep() {
    cancelAnimationFrame(raf);
    if (reduce) { gloss.style.opacity = '0'; return; }
    t0 = performance.now();
    gloss.style.opacity = '1';
    function step(now) {
      var t = Math.min(1, (now - t0) / SWEEP_MS);
      gloss.style.left = (easeOutCubic(t) * 100) + '%';
      if (t < 1) raf = requestAnimationFrame(step);
      else gloss.style.opacity = '0';
    }
    raf = requestAnimationFrame(step);
  }
  function paint() {
    fill.style.width = ((tier + 1) / N * 100) + '%';
    meter.setAttribute('aria-valuenow', String(tier));
    meter.setAttribute('aria-valuetext', LEVELS[tier]);
    name.textContent = LEVELS[tier];
  }
  function human() { root.classList.remove('is-demo'); clearInterval(timer); }
  function set(t) {
    var next = Math.max(0, Math.min(N - 1, t));
    if (next === tier) return;
    tier = next; paint(); sweep();
  }
  document.getElementById('bmfPlus').addEventListener('click', function () { human(); set(tier + 1); });
  document.getElementById('bmfMinus').addEventListener('click', function () { human(); set(tier - 1); });
  meter.addEventListener('pointerdown', function (e) {
    human();
    var r = meter.getBoundingClientRect();
    var ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    set(Math.round(ratio * (N - 1)));
  });
  meter.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); human(); set(tier + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); human(); set(tier - 1); }
  });

  var sequence = [4, 1, 3, 0, 2];
  var si = 0;
  function tick() {
    var t = sequence[si % sequence.length]; si++;
    tier = t; paint(); sweep();
  }
  var timer = reduce ? null : setInterval(tick, 900);
  paint();
}());
</script>
</body>
</html>
