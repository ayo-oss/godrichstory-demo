<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フォーカスリングが慣性で追いかけるキーボード難易度選択 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="kal is-demo" id="kal">
  <div class="kal__row" id="kalRow" role="radiogroup" aria-label="難易度">
    <div class="kal__ring" id="kalRing" aria-hidden="true"></div>
    <button type="button" class="kal__opt" role="radio" aria-checked="true" data-i="0" tabindex="0">簡単</button>
    <button type="button" class="kal__opt" role="radio" aria-checked="false" data-i="1" tabindex="-1">普通</button>
    <button type="button" class="kal__opt" role="radio" aria-checked="false" data-i="2" tabindex="-1">難しい</button>
    <button type="button" class="kal__opt" role="radio" aria-checked="false" data-i="3" tabindex="-1">とても難しい</button>
    <button type="button" class="kal__opt" role="radio" aria-checked="false" data-i="4" tabindex="-1">最高</button>
  </div>
</div>
</main>
<script>
(function () {
  var TRAIL_LERP = 0.18;
  var root = document.getElementById('kal');
  var rowEl = document.getElementById('kalRow');
  var ring = document.getElementById('kalRing');
  var opts = Array.prototype.slice.call(rowEl.querySelectorAll('.kal__opt'));
  var index = 0;
  var ringX = 0, ringW = 0, targetX = 0, targetW = 0, raf = 0;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function measure(i) {
    var r = opts[i].getBoundingClientRect();
    var pr = rowEl.getBoundingClientRect();
    return { x: r.left - pr.left, w: r.width };
  }
  function paintRing(x, w) { ring.style.transform = 'translateX(' + x + 'px)'; ring.style.width = w + 'px'; }
  // 계산 겹: 매 프레임 남은 거리의 TRAIL_LERP 비율만 좁히는 지수 감쇠(lerp)로 고리가 목표를 뒤따라온다
  function loop() {
    ringX += (targetX - ringX) * TRAIL_LERP;
    ringW += (targetW - ringW) * TRAIL_LERP;
    paintRing(ringX, ringW);
    if (Math.abs(targetX - ringX) > 0.4 || Math.abs(targetW - ringW) > 0.4) raf = requestAnimationFrame(loop);
    else { ringX = targetX; ringW = targetW; paintRing(ringX, ringW); }
  }
  function moveRingTo(i) {
    var m = measure(i);
    targetX = m.x; targetW = m.w;
    cancelAnimationFrame(raf);
    if (reduce) { ringX = targetX; ringW = targetW; paintRing(ringX, ringW); return; }
    raf = requestAnimationFrame(loop);
  }
  function human() { root.classList.remove('is-demo'); clearInterval(timer); }
  function select(i) {
    index = i;
    opts.forEach(function (o, idx) {
      o.setAttribute('aria-checked', idx === i ? 'true' : 'false');
      o.setAttribute('tabindex', idx === i ? '0' : '-1');
    });
    moveRingTo(i);
  }
  opts.forEach(function (o, i) {
    o.addEventListener('click', function () { human(); select(i); opts[i].focus({ preventScroll: true }); });
    o.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); human(); var n = Math.min(opts.length - 1, index + 1); select(n); opts[n].focus({ preventScroll: true }); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); human(); var p = Math.max(0, index - 1); select(p); opts[p].focus({ preventScroll: true }); }
      else if (e.key === 'Home') { e.preventDefault(); human(); select(0); opts[0].focus({ preventScroll: true }); }
      else if (e.key === 'End') { e.preventDefault(); human(); select(opts.length - 1); opts[opts.length - 1].focus({ preventScroll: true }); }
    });
  });

  var sequence = [3, 1, 4, 0, 2];
  var si = 0;
  function tick() { select(sequence[si % sequence.length]); si++; }
  var timer = reduce ? null : setInterval(tick, 850);
  var m0 = measure(0); ringX = m0.x; ringW = m0.w; targetX = m0.x; targetW = m0.w; paintRing(ringX, ringW);
}());
</script>
</body>
</html>
