<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파트너 바 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint">Every time the virtual screen width changes, it recalculates how many logos fit.</p>
  <div class="viewport" id="viewport">
    <ul class="row" id="row">
      <li class="logo" id="logo0">NoteGreen</li>
      <li class="logo" id="logo1">Bloomworks</li>
      <li class="logo" id="logo2">Ribbon Studio</li>
      <li class="logo" id="logo3">Gaon Square</li>
      <li class="logo" id="logo4">Dasol Works</li>
      <li class="logo" id="logo5">Byeolbit Lab</li>
    </ul>
  </div>
  <p class="chip" id="fitChip">0 shown</p>
</section>
</main>
<script>
// 파트너 바(08) — 가상 화면 폭(viewport)이 바뀔 때마다 로고 한 칸의 실제 폭(itemWidth)과 간격(gap)을
// 재 몇 개가 들어가는지(fitCount) 다시 계산하고, 그만큼만 보이게 한다(계산 한 겹). 마퀴가 아니라
// 정적 배치라 무한 루프 트랙 복제는 쓰지 않는다.
(function () {
  var viewport = document.getElementById('viewport');
  var row = document.getElementById('row');
  var chip = document.getElementById('fitChip');
  if (!viewport || !row || !chip) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items = Array.prototype.slice.call(row.querySelectorAll('.logo'));
  if (!items.length) return;

  var GAP = 8;
  var WIDTHS = [220, 320, 420];

  function apply(width) {
    viewport.style.width = width + 'px';
    var itemWidth = items[0].offsetWidth || 80;
    var fitCount = Math.max(1, Math.floor((width + GAP) / (itemWidth + GAP)));
    fitCount = Math.min(fitCount, items.length);
    items.forEach(function (item, i) {
      item.style.display = i < fitCount ? '' : 'none';
    });
    chip.textContent = fitCount + 'shown';
  }

  apply(WIDTHS[0]);

  if (!reduce) {
    var idx = 0;
    setInterval(function () {
      idx = (idx + 1) % WIDTHS.length;
      apply(WIDTHS[idx]);
    }, 900);
  }
})();
</script>
</body>
</html>
