<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고객 리뷰 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint">星評価の平均とカードの高さをレビュー内容に合わせて再計算します。</p>
  <p class="avgLine"><span class="avgNum" id="avgNum">0.0</span><span class="avgUnit"> / 5 · <span id="avgCount">0</span>人</span></p>
  <div class="cards" id="cards">
    <article class="card" id="card0">
      <p class="quote" id="quote0"></p>
      <p class="who" id="who0"></p>
    </article>
    <article class="card" id="card1">
      <p class="quote" id="quote1"></p>
      <p class="who" id="who1"></p>
    </article>
    <article class="card" id="card2">
      <p class="quote" id="quote2"></p>
      <p class="who" id="who2"></p>
    </article>
  </div>
  <p class="chip" id="heightChip">カードの高さ 0px</p>
</section>
</main>
<script>
// 고객 리뷰(06) — 후기 3개의 별점 평균을 매번 새로 구하고, 각 카드의 실제 콘텐츠 높이(scrollHeight)를
// 다시 재 가장 큰 값으로 세 카드의 높이를 맞춘다(계산 한 겹). 자동 시연은 후기 길이가 다른 세트를 돌린다.
(function () {
  var avgNum = document.getElementById('avgNum');
  var avgCount = document.getElementById('avgCount');
  var cards = [document.getElementById('card0'), document.getElementById('card1'), document.getElementById('card2')];
  var quotes = [document.getElementById('quote0'), document.getElementById('quote1'), document.getElementById('quote2')];
  var whos = [document.getElementById('who0'), document.getElementById('who1'), document.getElementById('who2')];
  var chip = document.getElementById('heightChip');
  if (!avgNum || !avgCount || !chip || cards.indexOf(null) !== -1 || quotes.indexOf(null) !== -1 || whos.indexOf(null) !== -1) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var SETS = [
    {
      count: 128,
      reviews: [
        { text: '料金が明確で気に入っています。', who: 'リボンスタジオ・ジス', rating: 5 },
        { text: '切り替えが簡単で、案内も親切でした。', who: 'ブルームワークス・ミンホ', rating: 4 },
        { text: 'チームプランに移してから管理が楽になりました。', who: 'ノートグリーン・ダウン', rating: 5 }
      ]
    },
    {
      count: 96,
      reviews: [
        { text: '価格の割に機能が多くて満足しています。特に年間払いの特典が大きいです。', who: 'パランサンジョム・セフン', rating: 4 },
        { text: 'サポートチームの対応が早かったです。', who: 'ハンドゥルカンパニー・ユナ', rating: 5 },
        { text: '無料トライアル期間に十分試してから決められたのが良かったです。', who: 'ダソルワークス・ジェヒョン', rating: 4 }
      ]
    },
    {
      count: 210,
      reviews: [
        { text: '比較表があってプラン選びが簡単でした。', who: 'ヨンドゥハウス・ハウン', rating: 5 },
        { text: '決済手段が多様で便利でした。', who: 'ガオンスクエア・ドユン', rating: 5 },
        { text: '年間の節約額が大きくてすぐに切り替えました。満足しています。', who: 'ビョルビッラボ・ソア', rating: 4 }
      ]
    }
  ];

  function average(reviews) {
    var sum = reviews.reduce(function (acc, r) { return acc + r.rating; }, 0);
    return sum / reviews.length;
  }

  function apply(set) {
    avgNum.textContent = average(set.reviews).toFixed(1);
    avgCount.textContent = String(set.count);
    set.reviews.forEach(function (r, i) {
      quotes[i].textContent = '“' + r.text + '”';
      whos[i].textContent = r.who + ' · ' + r.rating + '★';
    });
    requestAnimationFrame(function () {
      var maxH = 0;
      cards.forEach(function (card) { maxH = Math.max(maxH, card.scrollHeight); });
      cards.forEach(function (card) { card.style.minHeight = maxH + 'px'; });
      chip.textContent = 'カードの高さ ' + maxH + 'px';
    });
  }

  apply(SETS[0]);

  if (!reduce) {
    var idx = 0;
    setInterval(function () {
      idx = (idx + 1) % SETS.length;
      apply(SETS[idx]);
    }, 900);
  }
})();
</script>
</body>
</html>
