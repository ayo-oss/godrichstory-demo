<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고객 리뷰 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint">It recalculates the star-rating average and card height to fit the review content.</p>
  <p class="avgLine"><span class="avgNum" id="avgNum">0.0</span><span class="avgUnit"> / 5 · <span id="avgCount">0</span>people</span></p>
  <div class="cards" id="cards">
    <article class="card" id="card0">
      <p class="quote" id="quote0"></p>
      <p class="who" id="who0"></p>
    </article>
    <article class="card" id="card1">
      <p class="quote" id="quote1"></p>
      <p class="who" id="who1"></p>
    </article>
    <article class="card" id="card2">
      <p class="quote" id="quote2"></p>
      <p class="who" id="who2"></p>
    </article>
  </div>
  <p class="chip" id="heightChip">Card height 0px</p>
</section>
</main>
<script>
// 고객 리뷰(06) — 후기 3개의 별점 평균을 매번 새로 구하고, 각 카드의 실제 콘텐츠 높이(scrollHeight)를
// 다시 재 가장 큰 값으로 세 카드의 높이를 맞춘다(계산 한 겹). 자동 시연은 후기 길이가 다른 세트를 돌린다.
(function () {
  var avgNum = document.getElementById('avgNum');
  var avgCount = document.getElementById('avgCount');
  var cards = [document.getElementById('card0'), document.getElementById('card1'), document.getElementById('card2')];
  var quotes = [document.getElementById('quote0'), document.getElementById('quote1'), document.getElementById('quote2')];
  var whos = [document.getElementById('who0'), document.getElementById('who1'), document.getElementById('who2')];
  var chip = document.getElementById('heightChip');
  if (!avgNum || !avgCount || !chip || cards.indexOf(null) !== -1 || quotes.indexOf(null) !== -1 || whos.indexOf(null) !== -1) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var SETS = [
    {
      count: 128,
      reviews: [
        { text: 'The pricing is clear, and I like that.', who: 'Ribbon Studio · Jisu', rating: 5 },
        { text: 'Switching was easy and the guidance was friendly.', who: 'Bloomworks · Minho', rating: 4 },
        { text: 'Managing got easier after we moved to the team plan.', who: 'NoteGreen · Daeun', rating: 5 }
      ]
    },
    {
      count: 96,
      reviews: [
        { text: 'Great value for the features you get. The annual billing perk is especially big.', who: 'Parang Shop · Sehun', rating: 4 },
        { text: 'The support team responded quickly.', who: 'Handeul Company · Yuna', rating: 5 },
        { text: 'It was great being able to try it thoroughly during the free trial before deciding.', who: 'Dasol Works · Jaehyun', rating: 4 }
      ]
    },
    {
      count: 210,
      reviews: [
        { text: 'The comparison table made it easy to pick a plan.', who: 'Yeondu House · Haeun', rating: 5 },
        { text: 'Having many payment options made things convenient.', who: 'Gaon Square · Doyun', rating: 5 },
        { text: 'The annual savings were big, so I switched right away. Very satisfied.', who: 'Byeolbit Lab · Seoa', rating: 4 }
      ]
    }
  ];

  function average(reviews) {
    var sum = reviews.reduce(function (acc, r) { return acc + r.rating; }, 0);
    return sum / reviews.length;
  }

  function apply(set) {
    avgNum.textContent = average(set.reviews).toFixed(1);
    avgCount.textContent = String(set.count);
    set.reviews.forEach(function (r, i) {
      quotes[i].textContent = '“' + r.text + '”';
      whos[i].textContent = r.who + ' · ' + r.rating + '★';
    });
    requestAnimationFrame(function () {
      var maxH = 0;
      cards.forEach(function (card) { maxH = Math.max(maxH, card.scrollHeight); });
      cards.forEach(function (card) { card.style.minHeight = maxH + 'px'; });
      chip.textContent = 'Card height ' + maxH + 'px';
    });
  }

  apply(SETS[0]);

  if (!reduce) {
    var idx = 0;
    setInterval(function () {
      idx = (idx + 1) % SETS.length;
      apply(SETS[idx]);
    }, 900);
  }
})();
</script>
</body>
</html>
