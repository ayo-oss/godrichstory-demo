<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고객 리뷰 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint">별점 평균과 카드 높이를 후기 내용에 맞춰 다시 계산합니다</p>
  <p class="avgLine"><span class="avgNum" id="avgNum">0.0</span><span class="avgUnit"> / 5 · <span id="avgCount">0</span>명</span></p>
  <div class="cards" id="cards">
    <article class="card" id="card0">
      <p class="quote" id="quote0"></p>
      <p class="who" id="who0"></p>
    </article>
    <article class="card" id="card1">
      <p class="quote" id="quote1"></p>
      <p class="who" id="who1"></p>
    </article>
    <article class="card" id="card2">
      <p class="quote" id="quote2"></p>
      <p class="who" id="who2"></p>
    </article>
  </div>
  <p class="chip" id="heightChip">카드 높이 0px</p>
</section>
</main>
<script>
// 고객 리뷰(06) — 후기 3개의 별점 평균을 매번 새로 구하고, 각 카드의 실제 콘텐츠 높이(scrollHeight)를
// 다시 재 가장 큰 값으로 세 카드의 높이를 맞춘다(계산 한 겹). 자동 시연은 후기 길이가 다른 세트를 돌린다.
(function () {
  var avgNum = document.getElementById('avgNum');
  var avgCount = document.getElementById('avgCount');
  var cards = [document.getElementById('card0'), document.getElementById('card1'), document.getElementById('card2')];
  var quotes = [document.getElementById('quote0'), document.getElementById('quote1'), document.getElementById('quote2')];
  var whos = [document.getElementById('who0'), document.getElementById('who1'), document.getElementById('who2')];
  var chip = document.getElementById('heightChip');
  if (!avgNum || !avgCount || !chip || cards.indexOf(null) !== -1 || quotes.indexOf(null) !== -1 || whos.indexOf(null) !== -1) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var SETS = [
    {
      count: 128,
      reviews: [
        { text: '요금이 명확해서 좋아요.', who: '리본 스튜디오 · 지수', rating: 5 },
        { text: '전환이 쉬웠고 안내가 친절했습니다.', who: '블룸웍스 · 민호', rating: 4 },
        { text: '팀 플랜으로 옮긴 뒤 관리가 편해졌어요.', who: '노트그린 · 다은', rating: 5 }
      ]
    },
    {
      count: 96,
      reviews: [
        { text: '가격 대비 기능이 많아 만족합니다. 특히 연간 결제 혜택이 커요.', who: '파랑상점 · 세훈', rating: 4 },
        { text: '지원팀 응답이 빨랐어요.', who: '한들컴퍼니 · 유나', rating: 5 },
        { text: '무료 체험 기간 동안 충분히 써보고 결정할 수 있어서 좋았습니다.', who: '다솔웍스 · 재현', rating: 4 }
      ]
    },
    {
      count: 210,
      reviews: [
        { text: '비교표가 있어서 플랜 고르기가 쉬웠어요.', who: '연두하우스 · 하은', rating: 5 },
        { text: '결제 수단이 다양해서 편했습니다.', who: '가온스퀘어 · 도윤', rating: 5 },
        { text: '연간 절약액이 커서 바로 전환했어요. 만족스럽습니다.', who: '별빛랩 · 서아', rating: 4 }
      ]
    }
  ];

  function average(reviews) {
    var sum = reviews.reduce(function (acc, r) { return acc + r.rating; }, 0);
    return sum / reviews.length;
  }

  function apply(set) {
    avgNum.textContent = average(set.reviews).toFixed(1);
    avgCount.textContent = String(set.count);
    set.reviews.forEach(function (r, i) {
      quotes[i].textContent = '“' + r.text + '”';
      whos[i].textContent = r.who + ' · ' + r.rating + '★';
    });
    requestAnimationFrame(function () {
      var maxH = 0;
      cards.forEach(function (card) { maxH = Math.max(maxH, card.scrollHeight); });
      cards.forEach(function (card) { card.style.minHeight = maxH + 'px'; });
      chip.textContent = '카드 높이 ' + maxH + 'px';
    });
  }

  apply(SETS[0]);

  if (!reduce) {
    var idx = 0;
    setInterval(function () {
      idx = (idx + 1) % SETS.length;
      apply(SETS[idx]);
    }, 900);
  }
})();
</script>
</body>
</html>
