<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플랜 추천 푸터 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint">It re-searches for a plan that satisfies the entered team size and storage capacity.</p>
  <p class="inputLine"><span id="headcount">3</span><span class="inputUnit">people · </span><span id="storage">20</span><span class="inputUnit">GB needed</span></p>
  <ul class="plans" id="plans">
    <li class="plan" id="plan0" data-name="Basic"><span class="planName">Basic</span><span class="planLimit">1 seat · 5GB</span></li>
    <li class="plan" id="plan1" data-name="Pro"><span class="planName">Pro</span><span class="planLimit">10 seats · 50GB</span></li>
    <li class="plan" id="plan2" data-name="Team"><span class="planName">Team</span><span class="planLimit">30 seats · 500GB</span></li>
  </ul>
  <p class="chip" id="matchChip">Recommended plan: Basic</p>
</section>
</main>
<script>
// 플랜 추천 푸터(09) — 입력된 팀 인원(headcount)과 필요 용량(storage)을 각 플랜의 한도(LIMITS)와
// 비교해 두 조건을 모두 만족하는 가장 작은 플랜을 다시 찾아 강조한다(계산 한 겹).
(function () {
  var headcountEl = document.getElementById('headcount');
  var storageEl = document.getElementById('storage');
  var plansEl = document.getElementById('plans');
  var chip = document.getElementById('matchChip');
  if (!headcountEl || !storageEl || !plansEl || !chip) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var planEls = Array.prototype.slice.call(plansEl.querySelectorAll('.plan'));

  var LIMITS = [
    { name: 'Basic', seats: 1, storageGb: 5 },
    { name: 'Pro', seats: 10, storageGb: 50 },
    { name: 'Team', seats: 30, storageGb: 500 }
  ];
  var NEEDS = [
    { headcount: 3, storage: 20 },
    { headcount: 1, storage: 3 },
    { headcount: 15, storage: 80 },
    { headcount: 30, storage: 400 }
  ];

  function findMatch(need) {
    for (var i = 0; i < LIMITS.length; i++) {
      if (LIMITS[i].seats >= need.headcount && LIMITS[i].storageGb >= need.storage) return LIMITS[i].name;
    }
    return LIMITS[LIMITS.length - 1].name;
  }

  function apply(need) {
    headcountEl.textContent = String(need.headcount);
    storageEl.textContent = String(need.storage);
    var match = findMatch(need);
    planEls.forEach(function (el) {
      el.classList.toggle('is-match', el.getAttribute('data-name') === match);
    });
    chip.textContent = 'Recommended plan ' + match;
  }

  apply(NEEDS[0]);

  if (!reduce) {
    var idx = 0;
    setInterval(function () {
      idx = (idx + 1) % NEEDS.length;
      apply(NEEDS[idx]);
    }, 900);
  }
})();
</script>
</body>
</html>
