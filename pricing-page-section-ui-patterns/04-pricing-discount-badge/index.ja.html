<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할인 배지 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint">定価とセール価格の差から割引率を求め、締め切りまでの残り時間は別に計算します。</p>
  <div class="priceRow">
    <span class="priceOld" id="priceOld">49</span>
    <span class="priceNew" id="priceNew">32</span>
  </div>
  <p class="badge" id="pctBadge">0%OFF</p>
  <p class="countdown" id="countdown" aria-live="polite">残り0:00</p>
</section>
</main>
<script>
// 할인 배지(04) — 정가(LIST)와 할인가(SALE)의 차이를 정가로 나눠 퍼센트를 한 번 구해 배지에 채우고,
// 가상 마감까지 남은 시간은 rAF 로 매 프레임 다시 계산해 표시하며, 남은 비율이 낮아지면 배지 색을 바꾼다(계산 한 겹).
(function () {
  var pctBadge = document.getElementById('pctBadge');
  var countdown = document.getElementById('countdown');
  if (!pctBadge || !countdown) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var LIST = 49;
  var SALE = 32;
  var pct = Math.round((LIST - SALE) / LIST * 100);
  pctBadge.textContent = pct + '%OFF';

  var LOOP_MS = 2000;
  var TOTAL_SEC = 12 * 60;
  var URGENT_RATIO = .25;

  function format(sec) {
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' + s : String(s));
  }

  function frame(elapsed) {
    var progress = Math.min(elapsed / LOOP_MS, 1);
    var remainSec = TOTAL_SEC * (1 - progress);
    countdown.textContent = format(remainSec) + ' 残り';
    var urgent = (remainSec / TOTAL_SEC) < URGENT_RATIO;
    pctBadge.classList.toggle('is-urgent', urgent);
    countdown.classList.toggle('is-urgent', urgent);
    if (progress >= 1) return LOOP_MS;
    return null;
  }

  if (reduce) {
    frame(0);
  } else {
    var start = null;
    function tick(ts) {
      if (start === null) start = ts;
      var elapsed = (ts - start) % LOOP_MS;
      frame(elapsed);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
