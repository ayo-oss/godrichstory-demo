<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빌링 토글 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint">It recomputes the annual savings from the switch position and the monthly price.</p>
  <p class="priceLine"><span class="priceNum" id="priceNum">29</span><span class="priceUnit"> / mo</span></p>
  <div class="switchWrap">
    <span class="modeLabel" id="modeMonthly">Monthly</span>
    <button class="switchCtl" id="toggle" type="button" role="switch" aria-checked="false" aria-label="Switch to annual billing">
      <span class="knob" aria-hidden="true"></span>
    </button>
    <span class="modeLabel" id="modeYearly">Yearly</span>
  </div>
  <p class="badge" id="savingsBadge" hidden></p>
</section>
</main>
<script>
// 빌링 토글(03) — 스위치가 연간으로 넘어갈 때마다 지금 표시된 Monthly 가격(monthly)에
// 12 와 Yearly 할인율(DISCOUNT)을 곱해 한 해 saved 금액을 그 자리에서 구해 배지에 채운다(계산 한 겹).
// 자동 시연은 Monthly 가격을 29→49 로 바꿔가며 토글해 같은 공식이 다른 결과를 내는 것을 보여준다.
(function () {
  var toggle = document.getElementById('toggle');
  var priceNum = document.getElementById('priceNum');
  var badge = document.getElementById('savingsBadge');
  var modeMonthly = document.getElementById('modeMonthly');
  var modeYearly = document.getElementById('modeYearly');
  if (!toggle || !priceNum || !badge || !modeMonthly || !modeYearly) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var DISCOUNT = .20;
  var STEPS = [
    { monthly: 29, yearly: false },
    { monthly: 29, yearly: true },
    { monthly: 49, yearly: false },
    { monthly: 49, yearly: true }
  ];

  function apply(step) {
    priceNum.textContent = String(step.monthly);
    toggle.setAttribute('aria-checked', step.yearly ? 'true' : 'false');
    modeMonthly.classList.toggle('is-active', !step.yearly);
    modeYearly.classList.toggle('is-active', step.yearly);
    if (step.yearly) {
      var savings = Math.round(step.monthly * 12 * DISCOUNT);
      badge.hidden = false;
      badge.textContent = 'Yearly ' + savings + ' saved';
    } else {
      badge.hidden = true;
    }
  }

  apply(STEPS[0]);

  if (!reduce) {
    var idx = 0;
    setInterval(function () {
      idx = (idx + 1) % STEPS.length;
      apply(STEPS[idx]);
    }, 700);
  }
})();
</script>
</body>
</html>
