<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플랜 카드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel" id="panel">
  <p class="hint" id="hint">年間・月間の切り替えのたびに割引率を適用し、表示価格を再計算します。</p>
  <div class="switchRow">
    <span class="switchLabel" id="switchLabel">年間払い</span>
    <button class="switchCtl" id="billingSwitch" type="button" role="switch" aria-checked="false" aria-label="年間払いに切り替え">
      <span class="knob" aria-hidden="true"></span>
    </button>
  </div>
  <div class="cards" id="cardsRow">
    <article class="card">
      <h3 class="planName">Basic</h3>
      <p class="price"><span class="priceNum" id="price0">12</span><span class="priceUnit" id="unit0"> / 月</span></p>
      <p class="badge" id="badge0" hidden></p>
    </article>
    <article class="card card--mid">
      <h3 class="planName">Pro</h3>
      <p class="price"><span class="priceNum" id="price1">29</span><span class="priceUnit" id="unit1"> / 月</span></p>
      <p class="badge" id="badge1" hidden></p>
    </article>
    <article class="card">
      <h3 class="planName">Team</h3>
      <p class="price"><span class="priceNum" id="price2">59</span><span class="priceUnit" id="unit2"> / 月</span></p>
      <p class="badge" id="badge2" hidden></p>
    </article>
  </div>
</section>
</main>
<script>
// 플랜 카드(01) — 연/월 스위치가 눌릴 때마다 플랜별 할인율(discount)을 monthly 가격에 적용해
// 月 환산가를 다시 구하고, 그 값을 rAF 로 이전 숫자에서 새 숫자까지 이징 계산하며 굴린다(계산 한 겹).
// 자동 시연은 스위치를 700ms 마다 반전시켜 세 카드가 매번 다시 계산되는 것을 보여준다.
(function () {
  var switchCtl = document.getElementById('billingSwitch');
  var cardsRow = document.getElementById('cardsRow');
  if (!switchCtl || !cardsRow) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var PLANS = [
    { monthly: 12, discount: .15 },
    { monthly: 29, discount: .20 },
    { monthly: 59, discount: .25 }
  ];
  var ROLL_MS = 600;

  function yearlyMonthlyEq(plan) {
    return Math.round(plan.monthly * (1 - plan.discount));
  }

  function animateValue(el, from, to, duration) {
    if (!el) return;
    if (reduce || from === to) { el.textContent = String(to); return; }
    var start = null;
    function step(ts) {
      if (start === null) start = ts;
      var p = Math.min((ts - start) / duration, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = String(Math.round(from + (to - from) * eased));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  var current = PLANS.map(function (p) { return p.monthly; });

  function render(yearly) {
    switchCtl.setAttribute('aria-checked', yearly ? 'true' : 'false');
    PLANS.forEach(function (plan, i) {
      var next = yearly ? yearlyMonthlyEq(plan) : plan.monthly;
      var numEl = document.getElementById('price' + i);
      var badgeEl = document.getElementById('badge' + i);
      animateValue(numEl, current[i], next, ROLL_MS);
      current[i] = next;
      if (badgeEl) {
        if (yearly) {
          badgeEl.hidden = false;
          badgeEl.textContent = Math.round(plan.discount * 100) + '%OFF中';
        } else {
          badgeEl.hidden = true;
        }
      }
    });
  }

  render(false);

  if (!reduce) {
    var yearly = false;
    setInterval(function () {
      yearly = !yearly;
      render(yearly);
    }, 700);
  }
})();
</script>
</body>
</html>
