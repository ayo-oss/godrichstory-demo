<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요금 FAQ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint">열린 항목의 실제 높이를 다시 재 전체 목록 높이를 구합니다</p>
  <div class="acc" id="acc">
    <div class="item">
      <button class="q" id="q0" aria-expanded="false" aria-controls="a0">환불 정책이 어떻게 되나요?</button>
      <div class="a" id="a0" role="region" aria-labelledby="q0">
        <p class="aText">결제 후 7일 안에는 사용 여부와 관계없이 전액 환불됩니다.</p>
      </div>
    </div>
    <div class="item">
      <button class="q" id="q1" aria-expanded="false" aria-controls="a1">플랜을 바꿀 수 있나요?</button>
      <div class="a" id="a1" role="region" aria-labelledby="q1">
        <p class="aText">언제든 상위·하위 플랜으로 바꿀 수 있고 남은 기간 요금은 다음 결제에서 조정됩니다.</p>
      </div>
    </div>
    <div class="item">
      <button class="q" id="q2" aria-expanded="false" aria-controls="a2">결제 수단은 무엇을 지원하나요?</button>
      <div class="a" id="a2" role="region" aria-labelledby="q2">
        <p class="aText">신용카드와 계좌 자동이체를 지원하며, 팀 플랜은 세금계산서 발행도 가능합니다.</p>
      </div>
    </div>
    <div class="item">
      <button class="q" id="q3" aria-expanded="false" aria-controls="a3">무료 체험이 있나요?</button>
      <div class="a" id="a3" role="region" aria-labelledby="q3">
        <p class="aText">모든 플랜은 카드 등록 없이 14일 동안 전체 기능을 무료로 써볼 수 있습니다.</p>
      </div>
    </div>
  </div>
  <p class="chip" id="heightChip">목록 높이 0px</p>
</section>
</main>
<script>
// 요금 FAQ(05) — 항목을 열 때마다 열린 패널들의 실제 scrollHeight 를 다시 재 합산하고,
// 그 총합을 칩에 표시한다(계산 한 겹). 패널 자체는 grid-template-rows 로 접혀 아래 항목이
// 그 값만큼 자연스럽게 자리를 옮긴다. 자동 시연은 항목을 순서대로 하나씩 연다.
(function () {
  var acc = document.getElementById('acc');
  var chip = document.getElementById('heightChip');
  if (!acc || !chip) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items = Array.prototype.slice.call(acc.querySelectorAll('.item'));

  // 패널은 grid-template-rows 로 접혀 있어 열리는 도중에 scrollHeight 를 읽으면 전환 시작 전
  // 값(0 근처)이 잡힌다 — 그래서 실제 콘텐츠 높이는 시작할 때 한 번, 열림 상태를 순간 강제해
  // 재고 원래대로 되돌리는 방식으로 미리 재 캐시해 둔다(자연 높이 캐시).
  var NATURAL_HEIGHTS = items.map(function (item) {
    var panel = item.querySelector('.a');
    if (!panel) return 0;
    // grid-template-rows 를 잠깐 auto 로 풀어 전환·클래스와 무관하게 콘텐츠의 실제 높이를 잰다.
    var prevTransition = panel.style.transition;
    panel.style.transition = 'none';
    panel.style.gridTemplateRows = 'auto';
    var h = panel.scrollHeight;
    panel.style.gridTemplateRows = '0px';
    void panel.offsetHeight; // 0px 을 실제로 반영(플러시)해야 다음 전환이 이 값에서 시작한다
    panel.style.transition = prevTransition;
    return h;
  });

  function measureAndReport() {
    var total = 0;
    items.forEach(function (item, i) {
      if (item.classList.contains('is-open')) total += NATURAL_HEIGHTS[i];
    });
    chip.textContent = '목록 높이 ' + total + 'px';
  }

  function setOpen(openIndex) {
    items.forEach(function (item, i) {
      var q = item.querySelector('.q');
      var panel = item.querySelector('.a');
      var open = i === openIndex;
      item.classList.toggle('is-open', open);
      if (panel) panel.style.gridTemplateRows = open ? NATURAL_HEIGHTS[i] + 'px' : '0px';
      if (q) q.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    measureAndReport();
  }

  items.forEach(function (item, i) {
    var q = item.querySelector('.q');
    if (!q) return;
    q.addEventListener('click', function () {
      var willOpen = !item.classList.contains('is-open');
      setOpen(willOpen ? i : -1);
    });
  });

  setOpen(0);

  if (!reduce) {
    var idx = 0;
    setInterval(function () {
      idx = (idx + 1) % items.length;
      setOpen(idx);
    }, 550);
  }
})();
</script>
</body>
</html>
