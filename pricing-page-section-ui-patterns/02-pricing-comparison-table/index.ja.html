<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비교표 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint">プラン間で値が異なる行だけを数え、強調の度合いを再計算します。</p>
  <table class="cmp">
    <caption class="cmpCaption">プラン比較</caption>
    <thead>
      <tr>
        <th scope="col">機能</th>
        <th scope="col">Basic</th>
        <th scope="col">Pro</th>
        <th scope="col">Team</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr data-row="storage"><th scope="row">ストレージ</th><td class="v v0"></td><td class="v v1"></td><td class="v v2"></td></tr>
      <tr data-row="seats"><th scope="row">チーム人数</th><td class="v v0"></td><td class="v v1"></td><td class="v v2"></td></tr>
      <tr data-row="support"><th scope="row">サポート</th><td class="v v0"></td><td class="v v1"></td><td class="v v2"></td></tr>
      <tr data-row="api"><th scope="row">APIアクセス</th><td class="v v0"></td><td class="v v1"></td><td class="v v2"></td></tr>
      <tr data-row="sso"><th scope="row">SSOログイン</th><td class="v v0"></td><td class="v v1"></td><td class="v v2"></td></tr>
    </tbody>
  </table>
  <p class="chip" id="diffChip">差がある行 0/5</p>
</section>
</main>
<script>
// 비교표(02) — 플랜 세 줄의 값을 서로 대조해 실제로 다른 줄의 개수(diffCount)를 세고,
// 그 개수를 전체 줄 수로 나눈 비율로 강조 배경의 알파를 다시 계산한다(계산 한 겹).
// 자동 시연은 3가지 시나리오를 900ms 마다 돌려 diffCount 가 매번 달라지는 것을 보여준다.
(function () {
  var rowsEl = document.getElementById('rows');
  var chip = document.getElementById('diffChip');
  if (!rowsEl || !chip) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var SCENARIOS = [
    { storage: ['5GB', '50GB', '500GB'], seats: ['1', '10', '∞'], support: ['メール', '優先', '専任'], api: ['X', 'O', 'O'], sso: ['X', 'X', 'O'] },
    { storage: ['5GB', '50GB', '500GB'], seats: ['10', '10', '10'], support: ['優先', '優先', '優先'], api: ['X', 'O', 'O'], sso: ['X', 'X', 'O'] },
    { storage: ['5GB', '50GB', '500GB'], seats: ['10', '10', '10'], support: ['優先', '優先', '優先'], api: ['O', 'O', 'O'], sso: ['X', 'X', 'X'] }
  ];
  var ROW_KEYS = ['storage', 'seats', 'support', 'api', 'sso'];

  function allEqual(arr) {
    return arr.every(function (v) { return v === arr[0]; });
  }

  function apply(scenario) {
    var diffCount = 0;
    ROW_KEYS.forEach(function (key) {
      var values = scenario[key];
      var tr = rowsEl.querySelector('tr[data-row="' + key + '"]');
      if (!tr) return;
      var cells = tr.querySelectorAll('.v');
      cells.forEach(function (cell, i) { cell.textContent = values[i]; });
      var differs = !allEqual(values);
      if (differs) diffCount += 1;
      tr.classList.toggle('is-diff', differs);
      tr.style.setProperty('--diff-alpha', differs ? String(.12 + (diffCount / ROW_KEYS.length) * .35) : '0');
    });
    chip.textContent = '差がある行 ' + diffCount + '/' + ROW_KEYS.length;
  }

  apply(SCENARIOS[0]);

  if (!reduce) {
    var idx = 0;
    setInterval(function () {
      idx = (idx + 1) % SCENARIOS.length;
      apply(SCENARIOS[idx]);
    }, 900);
  }
})();
</script>
</body>
</html>
