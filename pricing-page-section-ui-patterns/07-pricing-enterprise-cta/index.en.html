<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엔터프라이즈 CTA — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint">It recalculates the estimated fee from the usage slider value, and switches to a sales inquiry once it crosses the threshold.</p>
  <div class="track" id="track">
    <div class="fill" id="fill"></div>
    <div class="knob" id="knob" role="slider" aria-label="Monthly usage" aria-valuemin="0" aria-valuemax="1500" aria-valuenow="50"></div>
  </div>
  <p class="usageLine"><span id="usageNum">50</span><span class="usageUnit"> req / mo</span></p>
  <p class="estimate" id="estimate">Estimated fee ₩23,000</p>
</section>
</main>
<script>
// 엔터프라이즈 CTA(07) — 사용량 슬라이더 값(usage)에 건당 단가(RATE)를 곱해 기본요금(BASE)에 더한
// 예상 요금을 매번 새로 구한다. 사용량이 THRESHOLD 를 넘으면 요금 대신 영업 문의 문구로 바꾼다(계산 한 겹).
// 슬라이더 손잡이 위치는 트랙 실제 폭을 재 px 로 계산해 left 에 대입한다(translateX(-50%) 미사용).
(function () {
  var track = document.getElementById('track');
  var fill = document.getElementById('fill');
  var knob = document.getElementById('knob');
  var usageNum = document.getElementById('usageNum');
  var estimate = document.getElementById('estimate');
  if (!track || !fill || !knob || !usageNum || !estimate) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var MAX_USAGE = 1500;
  var BASE = 19000;
  var RATE = 18;
  var THRESHOLD = 1000;
  var STEPS = [50, 300, 800, 1200];

  function apply(usage) {
    var pct = usage / MAX_USAGE;
    var trackWidth = track.clientWidth;
    var knobWidth = knob.offsetWidth || 16;
    var knobLeft = pct * (trackWidth - knobWidth);
    knob.style.left = knobLeft + 'px';
    fill.style.width = (pct * 100) + '%';
    knob.setAttribute('aria-valuenow', String(usage));
    usageNum.textContent = String(usage);

    if (usage > THRESHOLD) {
      estimate.textContent = 'Please contact our sales team';
      estimate.classList.add('is-contact');
    } else {
      var won = BASE + usage * RATE;
      estimate.textContent = 'Estimated fee ' + won.toLocaleString('ko-KR') + 'KRW';
      estimate.classList.remove('is-contact');
    }
  }

  apply(STEPS[0]);

  if (!reduce) {
    var idx = 0;
    setInterval(function () {
      idx = (idx + 1) % STEPS.length;
      apply(STEPS[idx]);
    }, 600);
  }

  window.addEventListener('resize', function () {
    apply(Number(knob.getAttribute('aria-valuenow')) || STEPS[0]);
  });
})();
</script>
</body>
</html>
