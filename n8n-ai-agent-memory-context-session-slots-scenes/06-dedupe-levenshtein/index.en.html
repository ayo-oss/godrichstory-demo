<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dedupe: Merging Same Questions by Levenshtein Distance — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="Demo stage — Space or Enter to pause, R to restart, left/right arrows for other values">
      <div class="ez__scene" data-role="scene" role="img" aria-label="An edit-distance heatmap drawing; questions within the threshold merge into one"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">Scene ready</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
// ── 533 공통 엔진 — 532 run() 시계 계승 (WAAPI 시계읽기·pause·rebuild·reduced 분기)
const W = 480;
const CX0 = 8;
const CW = 432;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, k) { return a + (b - a) * k; }
function fill(s) {
    const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
    const v = [];
    for (let i = 1; i < arguments.length; i += 1) { v.push(String(arguments[i])); }
    let o = s;
    for (let i = 0; i < keys.length; i += 1) {
        o = o.split(keys[i]).join(i < v.length ? v[i] : '');
    }
    return o;
}
function f0(v) { return String(Math.round(v)); }
function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
const rootEl = document.getElementById("ez");
const innerEl = rootEl.querySelector('[data-role="inner"]');
const sceneEl = rootEl.querySelector('[data-role="scene"]');
const chartEl = rootEl.querySelector('[data-role="chart"]');
const probeEl = rootEl.querySelector('[data-role="probe"]');
const padEl = rootEl.querySelector('[data-role="pad"]');
const statusP = rootEl.querySelector('[data-role="status"]');
const readA = rootEl.querySelector('[data-role="reada"]');
const readB = rootEl.querySelector('[data-role="readb"]');
const doneP = rootEl.querySelector('[data-role="done"]');
const pauseBtn = rootEl.querySelector('[data-role="pause"]');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function make(tag, cls, parent) {
    const e = document.createElement(tag);
    if (cls) { e.className = cx(cls); }
    parent.appendChild(e);
    return e;
}
function put(e, x, y, w, h) {
    e.style.left = x + 'px';
    e.style.top = y + 'px';
    if (w > 0) { e.style.width = w + 'px'; }
    if (h > 0) { e.style.height = h + 'px'; }
}
const sweepEl = make('i', 'sweep', sceneEl);
const scWrap = make('div', 'scwrap', sceneEl);
const clkEl = make('i', 'clk', sceneEl);
function clearAll() {
    scWrap.textContent = '';
    chartEl.textContent = '';
    probeEl.textContent = '';
}
function seedHash(i, seed) {
    const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
    return x - Math.floor(x);
}
function animsIn(host) { return host.getAnimations({ subtree: true }); }
function spanOf(d, dur) { return { s: d, e: d + dur, k: 0 }; }
function bar(cls, x, y, w, h) {
    const e = make('i', cls, chartEl);
    put(e, x, y, w, h);
    return e;
}
function drawRows(segs, max) {
    const n = segs.length;
    const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
    for (let i = 0; i < n; i += 1) {
        const sg = segs[i];
        const x = CX0 + clamp(sg.s, 0, max) / max * CW;
        const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
        bar('bar k' + sg.k, x, 5 + i * (h + 1), w, h);
    }
}
function axis(max) {
    const a = make('b', 'ax', chartEl);
    a.textContent = '0';
    put(a, CX0, 40, 0, 0);
    const b = make('b', 'ax ax--r', chartEl);
    b.textContent = f0(max) + 'ms';
    put(b, CX0 + CW - 60, 40, 60, 0);
}
let headEl = null;
function setReads(a, b) {
    readA.textContent = a;
    readB.textContent = b;
}
// ── 533 주역 calc — 슬롯 감쇠·자카드 승격 판정·레벤슈타인 중복 판정·요약 압축비
// TOKENS(q) — 문장을 소문자 단어 토큰으로 쪼갠다 (임베딩 없음 — 겹침 calc)
function tokens(q) {
    return String(q).toLowerCase().split(/[^a-z0-9가-힣]+/).filter(function (s) { return s.length > 1; });
}
// JAC — 두 토큰 배열의 자카드 겹침(교집합/합집합). 05의 승격 판정이 쓴다
function jac(a, b) {
    let hit = 0;
    for (let i = 0; i < a.length; i += 1) {
        if (b.indexOf(a[i]) >= 0) { hit += 1; }
    }
    const uni = a.length + b.length - hit;
    return uni > 0 ? hit / uni : 0;
}
// LEV_DIST — 두 문자열의 레벤슈타인 편집 거리 (삽입·삭제·교체 각 1). 06의 중복 판정이 쓴다
function levDist(a, b) {
    const m = a.length;
    const n = b.length;
    if (m === 0) { return n; }
    if (n === 0) { return m; }
    let prev = [];
    for (let j = 0; j <= n; j += 1) { prev.push(j); }
    for (let i = 1; i <= m; i += 1) {
        const cur = [i];
        for (let j = 1; j <= n; j += 1) {
            const cost = a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1;
            cur.push(Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost));
        }
        prev = cur;
    }
    return prev[n];
}
// MEM_DECAY — 예산 초과 시 오래된 턴 높이를 alpha^k 로 감쇠 (04의 주역 calc)
function memDecay(heights, budget, alpha) {
    let total = 0;
    for (let i = 0; i < heights.length; i += 1) { total += heights[i]; }
    const out = heights.slice();
    let k = 0;
    let idx = 0;
    while (total > budget && idx < out.length) {
        out[idx] = heights[idx] * Math.pow(alpha, k + 1);
        total = 0;
        for (let i = 0; i < out.length; i += 1) { total += out[i]; }
        k += 1;
        idx += 1;
    }
    return out;
}
// demoT — 2초 주기 래핑
function demoT(t) { return t % 2000; }
// ── 실행 퀄: 프리셋 하나가 한 주기
let piNow = 0;
function run(cfg) {
    const off = new AbortController();
    let pi = 0;
    let cycle = 2000;
    let paused = false;
    let raf = 0;
    let clock = null;
    let lastStatus = '';
    function fit() {
        const k = rootEl.clientWidth / W;
        innerEl.style.transform = 'scale(' + k + ')';
    }
    function rebuild() {
        clearAll();
        piNow = pi;
        cycle = Math.max(2000, cfg.build(pi));
        headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
        clkEl.style.animationDuration = f0(cycle) + 'ms';
        const all = animsIn(sceneEl);
        clock = null;
        for (let i = 0; i < all.length; i += 1) {
            const an = all[i];
            if (an.animationName && an.effect && an.effect.target === clkEl) {
                clock = an;
            }
        }
    }
    function restart() {
        const all = animsIn(sceneEl);
        for (let i = 0; i < all.length; i += 1) {
            all[i].currentTime = 0;
            if (paused) { all[i].pause(); }
            else { all[i].play(); }
        }
    }
    function tick() {
        const ct = clock ? Number(clock.currentTime) : 0;
        const t = isFinite(ct) ? ct : 0;
        if (headEl) {
            headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
        }
        sweepEl.style.setProperty('--sw', String(Math.round(t / cycle * 100)));
        const s = cfg.frame(t);
        if (s !== lastStatus) {
            statusP.textContent = s;
            lastStatus = s;
        }
        if (!paused && clock && t >= cycle - 1) {
            pi = (pi + 1) % cfg.count;
            rebuild();
            restart();
        }
        raf = requestAnimationFrame(tick);
    }
    function setPaused(p) {
        paused = p;
        pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
        const all = animsIn(sceneEl);
        for (let i = 0; i < all.length; i += 1) {
            if (p) { all[i].pause(); }
            else { all[i].play(); }
        }
        doneP.textContent = readB.textContent;
    }
    function shift(d) {
        pi = (pi + d + cfg.count) % cfg.count;
        rebuild();
        restart();
        doneP.textContent = readB.textContent;
    }
    pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
    padEl.addEventListener('keydown', function (ev) {
        if (ev.target === pauseBtn) { return; }
        if (ev.key === ' ' || ev.key === 'Enter') {
            ev.preventDefault();
            setPaused(!paused);
        }
        else if (ev.key === 'r' || ev.key === 'R') { shift(-pi); }
        else if (ev.key === 'ArrowRight') { ev.preventDefault(); shift(1); }
        else if (ev.key === 'ArrowLeft') { ev.preventDefault(); shift(-1); }
    }, { signal: off.signal });
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) { setPaused(true); }
    }, { signal: off.signal });
    window.addEventListener('resize', fit, { signal: off.signal });
    fit();
    rebuild();
    if (reduced) {
        cfg.frame(1e9);
        statusP.textContent = readB.textContent;
        doneP.textContent = readB.textContent;
    }
    else {
        restart();
        raf = requestAnimationFrame(tick);
    }
    return function () {
        cancelAnimationFrame(raf);
        off.abort();
    };
}
// 533-06 dedupe-levenshtein — 들어온 질문과 저장 질문의 레벤슈타인 거리(levDist) 행렬이
// 히트맵으로 그려지고 임계(6) 이하 쌍이 연결선으로 합쳐진다(merge). 숫자는 셀 밖에 찍는다.
const DEDUPE_T = 6;
const Q06 = [
    ['draft the report', 'make a report draft', 2],
    ['calculate the cost', 'calculate the cost', 1],
    ['translate this', 'summarize this', 2]
];
let cells06 = null;
let nums06 = null;
let incoming06 = null;
let stored06 = null;
let conn06 = null;
let badge06 = null;
function build(i) {
    const inc = ['draft the report', 'calculate the cost', 'match the translation tone'][i];
    const stored = ['make a report draft', 'calculate the cost', 'translate this'];
    incoming06 = inc;
    stored06 = stored;
    const dists = [];
    for (let k = 0; k < 3; k += 1) { dists.push(levDist(inc, stored[k])); }
    cells06 = [];
    nums06 = [];
    conn06 = [];
    const qx = make('div', 'nd nd--agent', scWrap);
    qx.innerHTML = '<i class="' + cx('nd__t') + '">' + inc + '</i><i class="' + cx('nd__s') + '">incoming</i>';
    put(qx, 8, 10, 120, 34);
    // 히트맵 3x3 — 행=저장 질문, 열=후보 변형? 단순화: 3셀(저장 질문별 거리) + 주대각 행렬 3x3
    const ox = 150;
    const oy = 34;
    for (let r = 0; r < 3; r += 1) {
        for (let c = 0; c < 3; c += 1) {
            const d = (r === c) ? dists[r] : levDist(stored[r], stored[c]);
            const cell = make('i', 'hcell', scWrap);
            put(cell, ox + c * 34, oy + r * 30, 30, 26);
            const near = d <= DEDUPE_T;
            const alpha = clamp(0.85 - d / 20, 0.12, 0.85);
            cell.style.background = near ? 'rgba(143, 216, 189, ' + f1(alpha) + ')' : 'rgba(213, 218, 234, ' + f1(alpha) + ')';
            cells06.push(cell);
            const nm = make('b', 'hnum', scWrap);
            nm.textContent = f0(d);
            put(nm, ox + c * 34 + 11, oy + r * 30 + 7, 20, 0);
            nums06.push(nm);
            if (r === c && near) {
                const cl = make('i', 'cn', scWrap);
                put(cl, 128, 27 + r * 30, 0, 0);
                cl.style.width = '20px';
                cl.style.transform = 'rotate(' + f0(Math.atan2(34 + r * 30 - 27, 20) * 180 / Math.PI) + 'deg)';
                conn06.push(cl);
            }
        }
    }
    const st = make('b', 'membox__t', scWrap);
    st.textContent = 'stored questions x variants';
    put(st, ox, oy - 14, 0, 0);
    badge06 = make('b', 'usedbadge', scWrap);
    put(badge06, 280, 12, 150, 0);
    const ov = make('b', 'ov ovs', sceneEl);
    put(ov, 236, 130, 170, 12);
    ov.textContent = 'threshold dist <= 6';
    drawRows([spanOf(180, 620), spanOf(880, 260)], 2000);
    axis(2000);
    setReads(fill('levDist — threshold {a} · diagonal distances {b},{c},{d} · {e} merged pairs', f0(DEDUPE_T), f0(dists[0]), f0(dists[1]), f0(dists[2]), f0(dists.filter(function (d) { return d <= DEDUPE_T; }).length)), inc);
    doneP.textContent = '';
    return 2000;
}
function frame(t) {
    const ph = demoT(t) / 1400;
    const dists = [];
    for (let k = 0; k < 3; k += 1) { dists.push(levDist(incoming06, stored06[k])); }
    let merged = 0;
    for (let k = 0; k < 3; k += 1) {
        const near = dists[k] <= DEDUPE_T;
        if (near) { merged += 1; }
        // 대각 셀 하이라이트
        const idx = k * 4 - Math.floor(k / 2) * 2; // r=c=k -> 3k+k=4k? 행우선: r*3+c = k*3+k = 4k
        cells06[k * 4].style.boxShadow = near ? '0 0 0 2px #0a4fe8' : 'none';
        nums06[k * 4].textContent = f0(dists[k]);
        if (conn06[k]) { conn06[k].style.opacity = near && ph > 0.4 ? '1' : '0.15'; }
    }
    badge06.textContent = 'merged ' + f0(merged) + ' / rows 3';
    return fill('Distances {a},{b},{c} — {d} merged pairs · threshold {e}', f0(dists[0]), f0(dists[1]), f0(dists[2]), f0(merged), f0(DEDUPE_T));
}
    return run({ count: 3, build: build, frame: frame });
}
})();
</script>
</body>
