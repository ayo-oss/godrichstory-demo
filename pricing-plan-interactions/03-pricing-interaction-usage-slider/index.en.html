<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage slider recalculates the price — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="us is-demo">
    <div class="us__row">
      <span class="us__lab">Monthly usage</span>
      <span class="us__slot">
        <span class="us__live"><span class="us__n" id="us-seatn">3</span><span class="us__u">seats</span></span>
        <span class="us__f" data-step="1"><span class="us__n">3</span><span class="us__u">seats</span></span>
        <span class="us__f" data-step="2"><span class="us__n">5</span><span class="us__u">seats</span></span>
        <span class="us__f" data-step="3"><span class="us__n">10</span><span class="us__u">seats</span></span>
        <span class="us__f" data-step="4"><span class="us__n">20</span><span class="us__u">seats</span></span>
        <span class="us__f" data-step="5"><span class="us__n">50</span><span class="us__u">seats</span></span>
      </span>
    </div>
    <div class="us__track">
      <span class="us__rail" aria-hidden="true"><span class="us__fill"></span></span>
      <input class="us__range" type="range" min="1" max="5" step="1" value="1" id="us-range" aria-label="Monthly usage" aria-valuetext="3 seats">
      <span class="us__knobrail" aria-hidden="true"><span class="us__knob"></span></span>
    </div>
    <div class="us__ticks" aria-hidden="true">
      <i class="us__tick"></i><i class="us__tick"></i><i class="us__tick"></i><i class="us__tick"></i><i class="us__tick"></i>
    </div>
    <div class="us__row">
      <span class="us__lab">Estimated fee</span>
      <span class="us__slot us__slot--fee" aria-live="polite">
        <span class="us__live"><span class="us__n" id="us-fee">$24</span><span class="us__u">/ mo</span></span>
        <span class="us__f" data-step="1"><span class="us__n">$24</span><span class="us__u">/ mo</span></span>
        <span class="us__f" data-step="2"><span class="us__n">$40</span><span class="us__u">/ mo</span></span>
        <span class="us__f" data-step="3"><span class="us__n">$80</span><span class="us__u">/ mo</span></span>
        <span class="us__f" data-step="4"><span class="us__n">$160</span><span class="us__u">/ mo</span></span>
        <span class="us__f" data-step="5"><span class="us__n">$400</span><span class="us__u">/ mo</span></span>
      </span>
    </div>
  </div>
</main>
<script>
// 실제 동작: 진짜 range 입력이다. input 마다 단계(1~5)를 --p 로 넘겨 채움·손잡이 자리를 정하고,
// seats 수와 요금 글자는 JS 가 갈아 끼운다(01 처럼 CSS 로 보간하지 않는다).
// 화면을 못 보는 사람에게는 눈금 숫자 대신 aria-valuetext 로 읽을 문장을 준다
var root = document.querySelector('.us');
var range = document.getElementById('us-range');
var seatn = document.getElementById('us-seatn');
var fee = document.getElementById('us-fee');
var SEATS = [3, 5, 10, 20, 50];
function apply(v) {
  var seats = SEATS[v - 1];
  root.style.setProperty('--p', String(v));
  seatn.textContent = String(seats);
  fee.textContent = '$' + (seats * 8);
  range.setAttribute('aria-valuetext', seats + ' ' + 'seats');
}
range.addEventListener('input', function () {
  root.classList.remove('is-demo');
  apply(parseInt(range.value, 10));
});
</script>
</body>
</html>
