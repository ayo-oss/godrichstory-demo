<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swipeable plan cards — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sw is-demo" role="group" aria-label="Swipe between plans">
    <div class="sw__view" id="sw-view">
      <div class="sw__track" id="sw-track">
        <article class="sw__card">
          <div class="sw__inner">
            <p class="sw__name"><span class="sw__nametext">Starter</span></p>
            <p class="sw__price"><span class="sw__amt">$9</span><span class="sw__per">/ mo</span></p>
            <ul class="sw__list">
              <li>Unlimited projects included</li>
              <li>Invite teammates</li>
            </ul>
          </div>
        </article>
        <article class="sw__card">
          <div class="sw__inner">
            <p class="sw__name"><span class="sw__nametext">Pro</span><span class="sw__tag">Popular</span></p>
            <p class="sw__price"><span class="sw__amt">$29</span><span class="sw__per">/ mo</span></p>
            <ul class="sw__list">
              <li>Priority support</li>
              <li>Invite teammates</li>
            </ul>
          </div>
        </article>
        <article class="sw__card">
          <div class="sw__inner">
            <p class="sw__name"><span class="sw__nametext">Business</span></p>
            <p class="sw__price"><span class="sw__amt">$79</span><span class="sw__per">/ mo</span></p>
            <ul class="sw__list">
              <li>Audit log</li>
              <li>Dedicated support</li>
            </ul>
          </div>
        </article>
      </div>
    </div>
    <div class="sw__dots">
      <button class="sw__dot" type="button" data-go="0" aria-current="true"><span class="sw__vh">Starter</span></button>
      <button class="sw__dot" type="button" data-go="1"><span class="sw__vh">Pro</span></button>
      <button class="sw__dot" type="button" data-go="2"><span class="sw__vh">Business</span></button>
    </div>
  </div>
</main>
<script>
// 실제 동작: 카드는 3장뿐이다. 복제도 텔레포트도 없고 양 끝에서 그냥 멈춘다.
// transform 은 언제나 트랙에만 건다 — 잘라 내는 창인 뷰포트를 밀면 내용이 창과 함께 움직여 스크롤이 안 된다.
var root = document.querySelector('.sw');
var view = document.getElementById('sw-view');
var track = document.getElementById('sw-track');
var dots = [].slice.call(document.querySelectorAll('.sw__dot'));
var last = dots.length - 1;
var index = 0, startX = 0, dragging = false;

function step() { return view.getBoundingClientRect().width + 12; }
function go(k) {
  index = Math.max(0, Math.min(last, k)); // 끝을 넘지 않게 clamp
  track.style.setProperty('--i', String(index));
  track.style.setProperty('--dx', '0px');
  dots.forEach(function (d, j) {
    if (j === index) { d.setAttribute('aria-current', 'true'); } else { d.removeAttribute('aria-current'); }
  });
}
view.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  // 손가락이 상자 밖으로 나가도 move·up 이 계속 이 요소로 온다
  e.currentTarget.setPointerCapture(e.pointerId);
  dragging = true;
  startX = e.clientX;
  track.classList.add('is-drag');
});
view.addEventListener('pointermove', function (e) {
  if (!dragging) { return; }
  track.style.setProperty('--dx', (e.clientX - startX) + 'px');
});
function release(e) {
  if (!dragging) { return; }
  dragging = false;
  track.classList.remove('is-drag');
  go(index - Math.round((e.clientX - startX) / step())); // 가장 가까운 카드로 스냅
}
view.addEventListener('pointerup', release);
view.addEventListener('pointercancel', release);
dots.forEach(function (d, j) {
  d.addEventListener('click', function () { root.classList.remove('is-demo'); go(j); });
});
go(0);
</script>
</body>
</html>
