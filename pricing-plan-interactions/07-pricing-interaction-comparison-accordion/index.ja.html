<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing comparison accordion — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ca is-demo">
    <table class="ca__table">
      <thead>
        <tr class="ca__headrow">
          <th scope="col"><span class="ca__cap">機能</span></th>
          <th scope="col"><span class="ca__cap">スターター</span></th>
          <th scope="col"><span class="ca__cap ca__cap--hi">プロ</span></th>
        </tr>
      </thead>
      <tbody class="ca__group" id="ca-g1" data-g="a" data-open="1">
        <tr class="ca__grow">
          <th colspan="3" scope="colgroup" class="ca__gth">
            <button class="ca__btn" type="button" aria-expanded="true" aria-controls="ca-g1">
              <span class="ca__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="16" height="16"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></span>
              <span class="ca__gname">基本機能</span>
            </button>
          </th>
        </tr>
        <tr class="ca__row">
          <th scope="row"><span class="ca__box"><span class="cell">保存容量</span></span></th>
          <td><span class="ca__box"><span class="cell">10GB</span></span></td>
          <td><span class="ca__box"><span class="cell cell--hi">1TB</span></span></td>
        </tr>
        <tr class="ca__row">
          <th scope="row"><span class="ca__box"><span class="cell">メンバー数</span></span></th>
          <td><span class="ca__box"><span class="cell">3人</span></span></td>
          <td><span class="ca__box"><span class="cell cell--hi">無制限</span></span></td>
        </tr>
      </tbody>
      <tbody class="ca__group" id="ca-g2" data-g="b" data-open="1">
        <tr class="ca__grow">
          <th colspan="3" scope="colgroup" class="ca__gth">
            <button class="ca__btn" type="button" aria-expanded="true" aria-controls="ca-g2">
              <span class="ca__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="16" height="16"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></span>
              <span class="ca__gname">セキュリティ</span>
            </button>
          </th>
        </tr>
        <tr class="ca__row">
          <th scope="row"><span class="ca__box"><span class="cell">監査ログ</span></span></th>
          <td><span class="ca__box"><span class="cell">&#8212;</span></span></td>
          <td><span class="ca__box"><span class="cell cell--hi">&#10003;</span></span></td>
        </tr>
        <tr class="ca__row">
          <th scope="row"><span class="ca__box"><span class="cell">二要素ログイン</span></span></th>
          <td><span class="ca__box"><span class="cell">&#8212;</span></span></td>
          <td><span class="ca__box"><span class="cell cell--hi">&#10003;</span></span></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<script>
// 실제 동작: 묶음 제목 버튼이 aria-expanded 와 tbody 의 data-open 을 뒤집는다.
// 높이는 아무도 재지 않는다 — 칸 안쪽 상자의 grid-template-rows 가 1fr↔0fr 로 보간될 뿐이다.
var root = document.querySelector('.ca');
var btns = [].slice.call(document.querySelectorAll('.ca__btn'));
function toggle(btn) {
  root.classList.remove('is-demo');
  var open = btn.getAttribute('aria-expanded') === 'true';
  var group = document.getElementById(btn.getAttribute('aria-controls'));
  btn.setAttribute('aria-expanded', String(!open));
  group.setAttribute('data-open', open ? '0' : '1');
}
btns.forEach(function (b) {
  b.addEventListener('click', function () { toggle(b); });
});
</script>
</body>
</html>
