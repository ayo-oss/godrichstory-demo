<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing toggle that rolls the number — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="bt is-demo" data-period="month">
    <p class="bt__plan">프로 플랜</p>
    <div class="bt__price" aria-live="polite">
      <span class="bt__cur">$</span>
      <span class="bt__num"></span>
      <span class="bt__unit">/ 월</span>
    </div>
    <div class="bt__badgerow">
      <span class="bt__badge">20% 절약</span>
    </div>
    <div class="bt__switch" role="group" aria-label="결제 주기">
      <span class="bt__lab" data-side="m">월간</span>
      <button class="bt__pill" type="button" role="switch" aria-checked="false" aria-label="결제 주기" id="bt-sw">
        <span class="bt__knob" aria-hidden="true"></span>
      </button>
      <span class="bt__lab" data-side="y">연간</span>
    </div>
  </div>
</main>
<script>
// 실제 동작: 스위치를 누르면 aria-checked 가 뒤집히고 뿌리의 data-period 가 바뀐다.
// 가격 숫자는 CSS 가 굴린다 — @property 로 등록한 --n 을 transition 이 정수로 보간하고
// counter-reset: n var(--n) + content: counter(n) 이 그 값을 글자로 그린다.
var root = document.querySelector('.bt');
var sw = document.getElementById('bt-sw');
sw.addEventListener('click', function () {
  root.classList.remove('is-demo');
  var on = sw.getAttribute('aria-checked') === 'true';
  sw.setAttribute('aria-checked', String(!on));
  root.setAttribute('data-period', on ? 'month' : 'year');
});
</script>
</body>
</html>
