<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recommended plan ribbon — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pr is-demo">
    <div class="pr__row">
      <button class="pr__card" type="button" data-plan="starter">
        <span class="pr__name">スターター</span>
        <span class="pr__price">
          <span class="pr__amount">$9</span>
          <span class="pr__unit">/ 月</span>
        </span>
      </button>
      <button class="pr__card pr__card--pick" type="button" data-plan="pro">
        <span class="pr__ribbon">おすすめ</span>
        <span class="pr__name">プロ</span>
        <span class="pr__price">
          <span class="pr__amount">$29</span>
          <span class="pr__unit">/ 月</span>
        </span>
      </button>
      <button class="pr__card" type="button" data-plan="business">
        <span class="pr__name">ビジネス</span>
        <span class="pr__price">
          <span class="pr__amount">$79</span>
          <span class="pr__unit">/ 月</span>
        </span>
      </button>
    </div>
  </div>
</main>
<script>
// 실제 동작은 전부 CSS 가 한다 — .row:has(.card:hover) 가 줄 전체를 물러나게 하고 호버한 카드만 앞으로 나온다.
// JS 가 맡는 일은 하나뿐: 사람이 건드린 순간 자동 루프(is-demo)를 끈다.
var root = document.querySelector('.pr');
var row = document.querySelector('.pr__row');
function stop() { root.classList.remove('is-demo'); }
row.addEventListener('pointerenter', stop);
row.addEventListener('focusin', stop);
row.addEventListener('click', stop);
</script>
</body>
</html>
