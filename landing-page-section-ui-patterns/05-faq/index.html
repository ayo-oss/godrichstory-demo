<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>FAQ 아코디언</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage" id="stage">
  <div class="faq is-demo" id="faq">
    <div class="faq__item" style="--h:64px">
      <button class="faq__q" type="button" aria-expanded="false" aria-controls="a1">
        <span>배송은 얼마나 걸리나요?</span>
        <span class="faq__caret" aria-hidden="true"></span>
      </button>
      <div class="faq__a" id="a1" role="region">
        <p class="faq__a-inner">평균 1~2영업일 이내 출고되며, 도서 산간 지역은 최대 4일이 걸릴 수 있습니다.</p>
      </div>
    </div>
    <div class="faq__item" style="--h:52px">
      <button class="faq__q" type="button" aria-expanded="false" aria-controls="a2">
        <span>환불 규정이 궁금해요</span>
        <span class="faq__caret" aria-hidden="true"></span>
      </button>
      <div class="faq__a" id="a2" role="region">
        <p class="faq__a-inner">수령 후 7일 이내 미개봉 상태면 전액 환불됩니다.</p>
      </div>
    </div>
    <div class="faq__item" style="--h:58px">
      <button class="faq__q" type="button" aria-expanded="false" aria-controls="a3">
        <span>해외 배송도 되나요?</span>
        <span class="faq__caret" aria-hidden="true"></span>
      </button>
      <div class="faq__a" id="a3" role="region">
        <p class="faq__a-inner">일부 국가만 지원하며 결제 단계에서 배송 가능 여부가 표시됩니다.</p>
      </div>
    </div>
  </div>
</main>
<script>
// 질문을 열면 답변의 내용 높이 값을 scrollHeight 로 다시 구해 그 값까지 펼치고, 다른 질문을 열면 이전 답변은 0까지 줄며 접힌다.
// 계산 겹: 클릭 상태 -> scrollHeight 값 -> max-height 보간. 실사용 클릭 리스너 있음(데모 재생 자체는 고정 시퀀스).
(function () {
  var faq = document.getElementById('faq');
  if (!faq) return;
  var items = faq.querySelectorAll('.faq__item');

  function closeItem(item) {
    var q = item.querySelector('.faq__q');
    var a = item.querySelector('.faq__a');
    if (!q || !a) return;
    q.setAttribute('aria-expanded', 'false');
    a.style.maxHeight = '0px';
  }

  function openItem(item) {
    var q = item.querySelector('.faq__q');
    var a = item.querySelector('.faq__a');
    if (!q || !a) return;
    q.setAttribute('aria-expanded', 'true');
    a.style.maxHeight = a.scrollHeight + 'px';
  }

  items.forEach(function (item) {
    var q = item.querySelector('.faq__q');
    if (!q) return;
    q.addEventListener('click', function () {
      faq.classList.remove('is-demo');
      var wasOpen = q.getAttribute('aria-expanded') === 'true';
      items.forEach(closeItem);
      if (!wasOpen) openItem(item);
    });
  });
})();
</script>
</body>
</html>
