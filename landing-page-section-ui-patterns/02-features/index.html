<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>기능 카드 그리드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage" id="stage">
  <div class="grid is-demo">
    <article class="card" style="--i:0">
      <p class="card__badge">01</p>
      <h3 class="card__title">빠른 설치</h3>
      <p class="card__desc">스크립트 한 줄로 끝</p>
    </article>
    <article class="card" style="--i:1">
      <p class="card__badge">02</p>
      <h3 class="card__title">실시간 동기화</h3>
      <p class="card__desc">모든 기기에 즉시 반영</p>
    </article>
    <article class="card" style="--i:2">
      <p class="card__badge">03</p>
      <h3 class="card__title">안전한 백업</h3>
      <p class="card__desc">매일 자동으로 저장</p>
    </article>
    <article class="card" style="--i:3">
      <p class="card__badge">04</p>
      <h3 class="card__title">간편한 공유</h3>
      <p class="card__desc">링크 하나로 초대</p>
    </article>
  </div>
</main>
</body>
</html>
