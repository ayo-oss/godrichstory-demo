<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>機能カードグリッド</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage" id="stage">
  <div class="grid is-demo">
    <article class="card" style="--i:0">
      <p class="card__badge">01</p>
      <h3 class="card__title">かんたんインストール</h3>
      <p class="card__desc">スクリプト1行で完了</p>
    </article>
    <article class="card" style="--i:1">
      <p class="card__badge">02</p>
      <h3 class="card__title">リアルタイム同期</h3>
      <p class="card__desc">すべての端末に即時反映</p>
    </article>
    <article class="card" style="--i:2">
      <p class="card__badge">03</p>
      <h3 class="card__title">安全なバックアップ</h3>
      <p class="card__desc">毎日自動で保存</p>
    </article>
    <article class="card" style="--i:3">
      <p class="card__badge">04</p>
      <h3 class="card__title">かんたん共有</h3>
      <p class="card__desc">リンク1つで招待</p>
    </article>
  </div>
</main>
</body>
</html>
