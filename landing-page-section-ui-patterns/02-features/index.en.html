<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>Feature card grid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage" id="stage">
  <div class="grid is-demo">
    <article class="card" style="--i:0">
      <p class="card__badge">01</p>
      <h3 class="card__title">Fast install</h3>
      <p class="card__desc">Done with one line of script</p>
    </article>
    <article class="card" style="--i:1">
      <p class="card__badge">02</p>
      <h3 class="card__title">Real-time sync</h3>
      <p class="card__desc">Instantly reflected on every device</p>
    </article>
    <article class="card" style="--i:2">
      <p class="card__badge">03</p>
      <h3 class="card__title">Secure backup</h3>
      <p class="card__desc">Saved automatically every day</p>
    </article>
    <article class="card" style="--i:3">
      <p class="card__badge">04</p>
      <h3 class="card__title">Easy sharing</h3>
      <p class="card__desc">Invite with a single link</p>
    </article>
  </div>
</main>
</body>
</html>
