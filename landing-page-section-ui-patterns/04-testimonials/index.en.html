<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>Testimonial carousel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage" id="stage">
  <div class="carousel" id="carousel">
    <div class="track is-demo" id="track">
      <blockquote class="t-card">
        <p class="t-card__quote">Installation was really easy</p>
        <p class="t-card__name">Minji Kim</p>
      </blockquote>
      <blockquote class="t-card">
        <p class="t-card__quote">Customer support is fast</p>
        <p class="t-card__name">Seojun Park</p>
      </blockquote>
      <blockquote class="t-card">
        <p class="t-card__quote">The design is clean</p>
        <p class="t-card__name">Haneul Lee</p>
      </blockquote>
    </div>
  </div>
</main>
<script>
// 자동 진행 값이 타이머로 계속 늘어나며 카드 위치를 다음 카드로 보간한다. 포인터가 올라와 있는 동안은 그 값이 늘지 않는다.
// 계산 겹: 자동 진행 값(interval) -> translateX 보간. 실사용 포인터 리스너 있음(데모 재생 자체는 고정 시퀀스).
(function () {
  var carousel = document.getElementById('carousel');
  var track = document.getElementById('track');
  if (!carousel || !track) return;

  var count = track.children.length;
  var index = 0;
  var timer = null;
  var live = false;

  function render() {
    track.style.transform = 'translateX(' + (index * -100) + '%)';
  }

  function advance() {
    index = (index + 1) % count;
    render();
  }

  function stop() {
    if (timer !== null) { window.clearInterval(timer); timer = null; }
  }

  function start() {
    stop();
    timer = window.setInterval(advance, 2600);
  }

  function goLive() {
    if (live) return;
    live = true;
    track.classList.remove('is-demo');
    render();
    start();
  }

  carousel.addEventListener('pointerenter', function () {
    goLive();
    stop();
  });

  carousel.addEventListener('pointerleave', function () {
    if (live) start();
  });
})();
</script>
</body>
</html>
