<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>통계 카운터</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage" id="stage">
  <section class="stats" id="stats">
    <div class="stat">
      <p class="stat__num" id="stat-1" data-target="12800" data-suffix="+">0</p>
      <p class="stat__label">누적 사용자</p>
    </div>
    <div class="stat">
      <p class="stat__num" id="stat-2" data-target="98" data-suffix="%">0</p>
      <p class="stat__label">만족도</p>
    </div>
    <div class="stat">
      <p class="stat__num" id="stat-3" data-target="42">0</p>
      <p class="stat__label">연동 서비스</p>
    </div>
  </section>
</main>
<script>
// 화면에 보이는 순간부터 0에서 목표 값까지, 매 프레임(rAF) 다시 계산해 textContent 를 갱신한다.
// 계산 겹: 경과 시간 비율 -> 완화 함수 -> 현재 값(0~목표) -> 문자열 표시. 자동 재생(리스너 없음).
(function () {
  var COUNT_DURATION_MS = 1700;
  var nums = document.querySelectorAll('.stat__num');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function format(n) {
    return Math.round(n).toLocaleString('ko-KR');
  }

  function run(el) {
    var target = Number(el.getAttribute('data-target')) || 0;
    var suffix = el.getAttribute('data-suffix') || '';
    if (reduceMotion) {
      el.textContent = format(target) + suffix;
      return;
    }
    var start = null;
    function step(ts) {
      if (start === null) start = ts;
      var elapsed = ts - start;
      var t = Math.min(1, elapsed / COUNT_DURATION_MS);
      var value = target * easeOutCubic(t);
      el.textContent = format(value) + suffix;
      if (t < 1) {
        window.requestAnimationFrame(step);
      }
    }
    window.requestAnimationFrame(step);
  }

  nums.forEach(run);
})();
</script>
</body>
</html>
