<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>料金プランカード</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage" id="stage">
  <div class="pricing is-demo" id="pricing">
    <div class="toggle" role="group" aria-label="支払い周期">
      <button class="toggle__btn toggle__btn--m is-active" id="btn-monthly" type="button" aria-pressed="true">月払い</button>
      <button class="toggle__btn toggle__btn--y" id="btn-yearly" type="button" aria-pressed="false">年払い -20%</button>
    </div>
    <div class="plans">
      <article class="plan">
        <p class="plan__name">スターター</p>
        <div class="plan__price">
          <span class="plan__amount plan__amount--m">9,000</span>
          <span class="plan__amount plan__amount--y">7,200</span>
        </div>
        <div class="plan__unit-row">
          <span class="plan__unit plan__unit--m">円/月</span>
          <span class="plan__unit plan__unit--y">円/月(年払い)</span>
        </div>
      </article>
      <article class="plan plan--featured">
        <p class="plan__badge">おすすめ</p>
        <p class="plan__name">プロ</p>
        <div class="plan__price">
          <span class="plan__amount plan__amount--m">19,000</span>
          <span class="plan__amount plan__amount--y">15,200</span>
        </div>
        <div class="plan__unit-row">
          <span class="plan__unit plan__unit--m">円/月</span>
          <span class="plan__unit plan__unit--y">円/月(年払い)</span>
        </div>
      </article>
      <article class="plan">
        <p class="plan__name">ビジネス</p>
        <div class="plan__price">
          <span class="plan__amount plan__amount--m">39,000</span>
          <span class="plan__amount plan__amount--y">31,200</span>
        </div>
        <div class="plan__unit-row">
          <span class="plan__unit plan__unit--m">円/月</span>
          <span class="plan__unit plan__unit--y">円/月(年払い)</span>
        </div>
      </article>
    </div>
  </div>
</main>
<script>
// 支払い周期 버튼을 누르면 요금제 상태가 연간 또는 月払い 상태가 되고, 그 상태에 따라 화면에 보이는 금액 값을 다시 계산해 표시한다.
// 계산 겹: 支払い周期 상태 -> 표시 금액 값 재계산. 실사용 클릭 리스너 있음.
(function () {
  var root = document.getElementById('pricing');
  var mBtn = document.getElementById('btn-monthly');
  var yBtn = document.getElementById('btn-yearly');
  if (!root || !mBtn || !yBtn) return;

  function setYearly(yearly) {
    root.classList.remove('is-demo');
    root.classList.toggle('is-yearly', yearly);
    mBtn.classList.toggle('is-active', !yearly);
    yBtn.classList.toggle('is-active', yearly);
    mBtn.setAttribute('aria-pressed', String(!yearly));
    yBtn.setAttribute('aria-pressed', String(yearly));
  }

  mBtn.addEventListener('click', function () { setYearly(false); });
  yBtn.addEventListener('click', function () { setYearly(true); });
})();
</script>
</body>
</html>
