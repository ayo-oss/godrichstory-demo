<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイコンが別レイヤーで動くボタン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ip is-demo" id="ip">
  <p class="ip__hint"><span>同じ座標をレイヤーごとに異なる倍率で掛け、アイコンが文字より大きく動きます</span></p>
  <div class="ip__scene" id="scene">
    <button class="ip__btn" id="btn" type="button" aria-label="ダウンロード — アイコンが前面レイヤーで視差移動するボタン">
      <span class="ip__icon" id="icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="22" height="22"><g fill="currentColor"><path d="M184 120v61.65a8 8 0 0 1-2.34 5.65l-34.35 34.35a8 8 0 0 1-13.57-4.53L128 176Zm-48-48H74.35a8 8 0 0 0-5.65 2.34l-34.35 34.35a8 8 0 0 0 4.53 13.57L80 128ZM40 216c37.65 0 50.69-19.69 54.56-28.18l-26.38-26.38C59.69 165.31 40 178.35 40 216" opacity=".35"/><path d="M223.85 47.12a16 16 0 0 0-15-15c-12.58-.75-44.73.4-71.41 27.07L132.69 64H74.36A15.9 15.9 0 0 0 63 68.68L28.7 103a16 16 0 0 0 9.07 27.16l38.47 5.37l44.21 44.21l5.37 38.49a15.94 15.94 0 0 0 10.78 12.92a16.1 16.1 0 0 0 5.1.83a15.9 15.9 0 0 0 11.3-4.68l34.32-34.3a15.9 15.9 0 0 0 4.68-11.36v-58.33l4.77-4.77c26.68-26.68 27.83-58.83 27.08-71.42M74.36 80h42.33l-39.53 39.52L40 114.34Zm74.41-9.45a76.65 76.65 0 0 1 59.11-22.47a76.46 76.46 0 0 1-22.42 59.16L128 164.68L91.32 128ZM176 181.64L141.67 216l-5.19-37.17L176 139.31Zm-74.16 9.5C97.34 201 82.29 224 40 224a8 8 0 0 1-8-8c0-42.29 23-57.34 32.86-61.85a8 8 0 0 1 6.64 14.56c-6.43 2.93-20.62 12.36-23.12 38.91c26.55-2.5 36-16.69 38.91-23.12a8 8 0 1 1 14.56 6.64Z"/></g></svg>
      </span>
      <span class="ip__label" id="label">ダウンロード</span>
    </button>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('ip');
  var scene = document.getElementById('scene');
  var btn = document.getElementById('btn');
  var icon = document.getElementById('icon');
  var label = document.getElementById('label');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var LERP = 0.17;
  var ICON_DEPTH = 22;   // 아이콘 층 배수 — 앞에 떠 있어 더 크게 움직인다
  var LABEL_DEPTH = 8;   // 글자 층 배수 — 뒤에 있어 적게 움직인다
  var targetNX = 0, targetNY = 0;
  var curNX = 0, curNY = 0;
  var hasPointer = false;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function syntheticTarget(t) { return [Math.sin(t * 1.05), Math.sin(t * 0.7 + 2.1)]; }

  function render(nx, ny) {
    btn.style.transform = 'rotateX(' + (-ny * 8).toFixed(2) + 'deg) rotateY(' + (nx * 8).toFixed(2) + 'deg)';
    icon.style.transform = 'translate3d(' + (nx * ICON_DEPTH).toFixed(1) + 'px, ' + (ny * ICON_DEPTH).toFixed(1) + 'px, 0)';
    label.style.transform = 'translate3d(' + (nx * LABEL_DEPTH).toFixed(1) + 'px, ' + (ny * LABEL_DEPTH).toFixed(1) + 'px, 0)';
  }

  var t0 = null;
  function loop(now) {
    if (t0 === null) t0 = now;
    var t = (now - t0) / 1000;
    if (!hasPointer && !reduce) {
      var s = syntheticTarget(t);
      targetNX = s[0]; targetNY = s[1];
    }
    curNX += (targetNX - curNX) * LERP;
    curNY += (targetNY - curNY) * LERP;
    render(curNX, curNY);
    requestAnimationFrame(loop);
  }

  function pointFromEvent(e) {
    var r = scene.getBoundingClientRect();
    var nx = ((e.clientX - r.left) / r.width) * 2 - 1;
    var ny = ((e.clientY - r.top) / r.height) * 2 - 1;
    return [clamp(nx, -1, 1), clamp(ny, -1, 1)];
  }

  scene.addEventListener('pointermove', function (e) {
    hasPointer = true;
    root.classList.remove('is-demo');
    var p = pointFromEvent(e);
    targetNX = p[0]; targetNY = p[1];
  });
  scene.addEventListener('pointerleave', function () {
    hasPointer = false;
    targetNX = 0; targetNY = 0;
  });
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    hasPointer = true;
    targetNY = -1;
    if (reduce) { render(targetNX, targetNY); }
    setTimeout(function () { if (!hasPointer) { targetNX = 0; targetNY = 0; if (reduce) { render(targetNX, targetNY); } } }, 260);
  });
  btn.addEventListener('keydown', function (e) {
    var step = 0.24;
    var moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    var m = moves[e.key];
    if (!m) return;
    e.preventDefault();
    root.classList.remove('is-demo');
    hasPointer = true;
    targetNX = clamp(targetNX + m[0], -1, 1);
    targetNY = clamp(targetNY + m[1], -1, 1);
    if (reduce) { render(targetNX, targetNY); }
  });

  if (reduce) {
    render(0.3, -0.5);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
