<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カーソル座標で回転するボタン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cr is-demo" id="cr">
  <p class="cr__hint"><span>ボタン上でカーソルを動かすと座標値がrotateX・rotateYを計算します</span></p>
  <div class="cr__scene" id="scene">
    <button class="cr__btn" id="btn" type="button" aria-label="今すぐ始める — カーソルに沿って傾くボタン">
      <span class="cr__sheen" id="sheen" aria-hidden="true"></span>
      <span class="cr__label">今すぐ始める</span>
    </button>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('cr');
  var scene = document.getElementById('scene');
  var btn = document.getElementById('btn');
  var sheen = document.getElementById('sheen');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var MAX_DEG = 14;          // 커서가 버튼 가장자리에 닿았을 때의 최대 회전각
  var LERP = 0.16;           // 관성 lerp 계수 — 값이 목표를 따라잡는 속도
  var targetNX = 0, targetNY = 0;
  var curNX = 0, curNY = 0;
  var hasPointer = false;
  var clickTimer = null;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // 포인터가 없을 때(자동 시연·헤드리스 측정) 같은 계산을 돌리기 위한 합성 좌표 — 두 축의 위상을 어긋낸 리사주 궤적
  function syntheticTarget(t) {
    return [Math.sin(t * 1.15), Math.sin(t * 0.82 + 1.05)];
  }

  function render(nx, ny) {
    var rotY = nx * MAX_DEG;
    var rotX = -ny * MAX_DEG;
    btn.style.transform = 'rotateX(' + rotX.toFixed(2) + 'deg) rotateY(' + rotY.toFixed(2) + 'deg)';
    var sx = 50 + nx * 34, sy = 50 + ny * 34;
    sheen.style.background = 'radial-gradient(circle at ' + sx.toFixed(1) + '% ' + sy.toFixed(1) + '%, rgba(255,247,230,.5), rgba(255,247,230,0) 58%)';
    var depth = Math.min(1, Math.sqrt(nx * nx + ny * ny));
    btn.style.boxShadow = '0 ' + (10 + depth * 16).toFixed(1) + 'px ' + (18 + depth * 22).toFixed(1) + 'px rgba(8,6,12,' + (0.30 + depth * 0.16).toFixed(2) + ')';
  }

  var t0 = null;
  function loop(now) {
    if (t0 === null) { t0 = now; }
    var t = (now - t0) / 1000;
    if (!hasPointer && !reduce) {
      var s = syntheticTarget(t);
      targetNX = s[0]; targetNY = s[1];
    }
    curNX += (targetNX - curNX) * LERP;
    curNY += (targetNY - curNY) * LERP;
    render(curNX, curNY);
    requestAnimationFrame(loop);
  }

  function pointFromEvent(e) {
    var r = scene.getBoundingClientRect();
    var nx = ((e.clientX - r.left) / r.width) * 2 - 1;
    var ny = ((e.clientY - r.top) / r.height) * 2 - 1;
    return [clamp(nx, -1, 1), clamp(ny, -1, 1)];
  }

  scene.addEventListener('pointermove', function (e) {
    hasPointer = true;
    root.classList.remove('is-demo');
    var p = pointFromEvent(e);
    targetNX = p[0]; targetNY = p[1];
  });
  scene.addEventListener('pointerleave', function () {
    hasPointer = false;
    targetNX = 0; targetNY = 0;
  });
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    hasPointer = true;
    targetNX = 0.92; targetNY = -0.62;
    if (reduce) { render(targetNX, targetNY); }
    clearTimeout(clickTimer);
    clickTimer = setTimeout(function () { hasPointer = false; targetNX = 0; targetNY = 0; if (reduce) { render(targetNX, targetNY); } }, 260);
  });
  btn.addEventListener('keydown', function (e) {
    var step = 0.24;
    var moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    var m = moves[e.key];
    if (!m) { return; }
    e.preventDefault();
    root.classList.remove('is-demo');
    hasPointer = true;
    targetNX = clamp(targetNX + m[0], -1, 1);
    targetNY = clamp(targetNY + m[1], -1, 1);
    if (reduce) { render(targetNX, targetNY); }
  });

  if (reduce) {
    render(0.5, -0.34);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
