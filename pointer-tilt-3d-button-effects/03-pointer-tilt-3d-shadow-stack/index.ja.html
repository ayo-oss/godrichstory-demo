<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>傾きで影の層が重なるボタン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sk is-demo" id="sk">
  <p class="sk__hint"><span>傾いた方向と逆側に、影が3層ずれて重なります</span></p>
  <div class="sk__scene" id="scene">
    <button class="sk__btn" id="btn" type="button" aria-label="今すぐ購入 — 傾きに応じて影が重なるボタン">
      <span class="sk__label">今すぐ購入</span>
    </button>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('sk');
  var scene = document.getElementById('scene');
  var btn = document.getElementById('btn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var MAX_DEG = 12;
  var LERP = 0.15;
  var targetNX = 0, targetNY = 0;
  var curNX = 0, curNY = 0;
  var hasPointer = false;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function syntheticTarget(t) { return [Math.sin(t * 0.95 + 0.4), Math.sin(t * 1.35)]; }

  // 그림자 3겹 — 기운 반대 방향으로 오프셋이 커지고, 층마다 흐림·투명도가 달라 깊이가 읽힌다
  function render(nx, ny) {
    var rotY = nx * MAX_DEG;
    var rotX = -ny * MAX_DEG;
    btn.style.transform = 'rotateX(' + rotX.toFixed(2) + 'deg) rotateY(' + rotY.toFixed(2) + 'deg)';
    var ox = -nx, oy = -ny;
    var layers = [];
    for (var i = 1; i <= 3; i++) {
      var d = i * 7;
      var blur = i * 9;
      var alpha = (0.22 - i * 0.03).toFixed(2);
      layers.push((ox * d).toFixed(1) + 'px ' + (oy * d + i * 3).toFixed(1) + 'px ' + blur + 'px rgba(23,20,26,' + alpha + ')');
    }
    btn.style.boxShadow = layers.join(', ');
  }

  var t0 = null;
  function loop(now) {
    if (t0 === null) t0 = now;
    var t = (now - t0) / 1000;
    if (!hasPointer && !reduce) {
      var s = syntheticTarget(t);
      targetNX = s[0]; targetNY = s[1];
    }
    curNX += (targetNX - curNX) * LERP;
    curNY += (targetNY - curNY) * LERP;
    render(curNX, curNY);
    requestAnimationFrame(loop);
  }

  function pointFromEvent(e) {
    var r = scene.getBoundingClientRect();
    var nx = ((e.clientX - r.left) / r.width) * 2 - 1;
    var ny = ((e.clientY - r.top) / r.height) * 2 - 1;
    return [clamp(nx, -1, 1), clamp(ny, -1, 1)];
  }

  scene.addEventListener('pointermove', function (e) {
    hasPointer = true;
    root.classList.remove('is-demo');
    var p = pointFromEvent(e);
    targetNX = p[0]; targetNY = p[1];
  });
  scene.addEventListener('pointerleave', function () {
    hasPointer = false;
    targetNX = 0; targetNY = 0;
  });
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    hasPointer = true;
    targetNX = -0.8; targetNY = 0.5;
    if (reduce) { render(targetNX, targetNY); }
    setTimeout(function () { if (!hasPointer) { targetNX = 0; targetNY = 0; if (reduce) { render(targetNX, targetNY); } } }, 240);
  });
  btn.addEventListener('keydown', function (e) {
    var step = 0.22;
    var moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    var m = moves[e.key];
    if (!m) return;
    e.preventDefault();
    root.classList.remove('is-demo');
    hasPointer = true;
    targetNX = clamp(targetNX + m[0], -1, 1);
    targetNY = clamp(targetNY + m[1], -1, 1);
    if (reduce) { render(targetNX, targetNY); }
  });

  if (reduce) {
    render(-0.4, 0.3);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
