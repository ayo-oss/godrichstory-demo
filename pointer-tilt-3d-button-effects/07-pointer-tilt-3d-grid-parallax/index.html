<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두 겹 격자무늬가 시차로 어긋나는 버튼 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gp is-demo" id="gp">
  <p class="gp__hint"><span>같은 좌표를 배수 둘로 곱해 안쪽 격자와 바깥 격자가 서로 다른 속도로 어긋납니다</span></p>
  <div class="gp__scene" id="scene">
    <button class="gp__btn" id="btn" type="button" aria-label="컬렉션 보기 — 격자 두 겹이 시차로 어긋나는 버튼">
      <span class="gp__grid gp__grid--far" id="gridFar" aria-hidden="true"></span>
      <span class="gp__grid gp__grid--near" id="gridNear" aria-hidden="true"></span>
      <span class="gp__label">컬렉션 보기</span>
    </button>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('gp');
  var scene = document.getElementById('scene');
  var btn = document.getElementById('btn');
  var gridFar = document.getElementById('gridFar');
  var gridNear = document.getElementById('gridNear');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var MAX_DEG = 9;
  var LERP = 0.16;
  var FAR_DEPTH = 10;
  var NEAR_DEPTH = 26;
  var targetNX = 0, targetNY = 0, curNX = 0, curNY = 0;
  var hasPointer = false;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function syntheticTarget(t) { return [Math.sin(t * 0.9), Math.sin(t * 1.4 + 1.6)]; }

  function render(nx, ny) {
    btn.style.transform = 'rotateX(' + (-ny * MAX_DEG).toFixed(2) + 'deg) rotateY(' + (nx * MAX_DEG).toFixed(2) + 'deg)';
    gridFar.style.backgroundPosition = (nx * FAR_DEPTH).toFixed(1) + 'px ' + (ny * FAR_DEPTH).toFixed(1) + 'px';
    gridNear.style.backgroundPosition = (-nx * NEAR_DEPTH).toFixed(1) + 'px ' + (-ny * NEAR_DEPTH).toFixed(1) + 'px';
  }

  var t0 = null;
  function loop(now) {
    if (t0 === null) t0 = now;
    var t = (now - t0) / 1000;
    if (!hasPointer && !reduce) {
      var s = syntheticTarget(t);
      targetNX = s[0]; targetNY = s[1];
    }
    curNX += (targetNX - curNX) * LERP;
    curNY += (targetNY - curNY) * LERP;
    render(curNX, curNY);
    requestAnimationFrame(loop);
  }

  function pointFromEvent(e) {
    var r = scene.getBoundingClientRect();
    var nx = ((e.clientX - r.left) / r.width) * 2 - 1;
    var ny = ((e.clientY - r.top) / r.height) * 2 - 1;
    return [clamp(nx, -1, 1), clamp(ny, -1, 1)];
  }

  scene.addEventListener('pointermove', function (e) {
    hasPointer = true;
    root.classList.remove('is-demo');
    var p = pointFromEvent(e);
    targetNX = p[0]; targetNY = p[1];
  });
  scene.addEventListener('pointerleave', function () {
    hasPointer = false;
    targetNX = 0; targetNY = 0;
  });
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    hasPointer = true;
    targetNX = -0.85; targetNY = -0.4;
    if (reduce) { render(targetNX, targetNY); }
    setTimeout(function () { if (!hasPointer) { targetNX = 0; targetNY = 0; if (reduce) { render(targetNX, targetNY); } } }, 240);
  });
  btn.addEventListener('keydown', function (e) {
    var step = 0.24;
    var moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    var m = moves[e.key];
    if (!m) return;
    e.preventDefault();
    root.classList.remove('is-demo');
    hasPointer = true;
    targetNX = clamp(targetNX + m[0], -1, 1);
    targetNY = clamp(targetNY + m[1], -1, 1);
    if (reduce) { render(targetNX, targetNY); }
  });

  if (reduce) {
    render(0.4, -0.3);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
