<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button whose rim lights up by tilt magnitude — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rg is-demo" id="rg">
  <p class="rg__hint"><span>Only the tilt magnitude (regardless of direction) is picked out and turned into the rim's glow radius and brightness</span></p>
  <div class="rg__scene" id="scene">
    <button class="rg__btn" id="btn" type="button" aria-label="Play now — button whose rim brightens with the tilt magnitude">
      <span class="rg__label">Play now</span>
    </button>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('rg');
  var scene = document.getElementById('scene');
  var btn = document.getElementById('btn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var MAX_DEG = 10;
  var LERP = 0.16;
  var BLUR_BASE = 6;
  var BLUR_RANGE = 34;
  var targetNX = 0, targetNY = 0, curNX = 0, curNY = 0;
  var hasPointer = false;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function syntheticTarget(t) { return [Math.sin(t * 1.1 + 0.3), Math.sin(t * 1.6)]; }

  // 방향은 회전에만 쓰고, 둘레 광은 크기(magnitude)만 읽는다 — 05 의 방향성 광과 다른 값이다
  function render(nx, ny) {
    btn.style.transform = 'rotateX(' + (-ny * MAX_DEG).toFixed(2) + 'deg) rotateY(' + (nx * MAX_DEG).toFixed(2) + 'deg)';
    var mag = clamp(Math.sqrt(nx * nx + ny * ny), 0, 1);
    var blur = BLUR_BASE + mag * BLUR_RANGE;
    var spread = 1 + mag * 5;
    var alpha = (0.28 + mag * 0.5).toFixed(2);
    btn.style.boxShadow = '0 0 ' + blur.toFixed(1) + 'px ' + spread.toFixed(1) + 'px rgba(91,140,248,' + alpha + '), 0 12px 20px rgba(23,20,26,.28)';
  }

  var t0 = null;
  function loop(now) {
    if (t0 === null) t0 = now;
    var t = (now - t0) / 1000;
    if (!hasPointer && !reduce) {
      var s = syntheticTarget(t);
      targetNX = s[0]; targetNY = s[1];
    }
    curNX += (targetNX - curNX) * LERP;
    curNY += (targetNY - curNY) * LERP;
    render(curNX, curNY);
    requestAnimationFrame(loop);
  }

  function pointFromEvent(e) {
    var r = scene.getBoundingClientRect();
    var nx = ((e.clientX - r.left) / r.width) * 2 - 1;
    var ny = ((e.clientY - r.top) / r.height) * 2 - 1;
    return [clamp(nx, -1, 1), clamp(ny, -1, 1)];
  }

  scene.addEventListener('pointermove', function (e) {
    hasPointer = true;
    root.classList.remove('is-demo');
    var p = pointFromEvent(e);
    targetNX = p[0]; targetNY = p[1];
  });
  scene.addEventListener('pointerleave', function () {
    hasPointer = false;
    targetNX = 0; targetNY = 0;
  });
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    hasPointer = true;
    targetNX = 0.95; targetNY = 0.3;
    if (reduce) { render(targetNX, targetNY); }
    setTimeout(function () { if (!hasPointer) { targetNX = 0; targetNY = 0; if (reduce) { render(targetNX, targetNY); } } }, 240);
  });
  btn.addEventListener('keydown', function (e) {
    var step = 0.24;
    var moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    var m = moves[e.key];
    if (!m) return;
    e.preventDefault();
    root.classList.remove('is-demo');
    hasPointer = true;
    targetNX = clamp(targetNX + m[0], -1, 1);
    targetNY = clamp(targetNY + m[1], -1, 1);
    if (reduce) { render(targetNX, targetNY); }
  });

  if (reduce) {
    render(0.5, 0.4);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
