<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>떨어진 점들이 칸마다 쌓여 히스토그램이 되는 막대 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bc is-demo" id="bc">
  <canvas class="bc__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="떨어진 점들이 칸마다 튕겼다 멈춰 쌓이며 히스토그램 막대가 되는 그래프. ←/→ 로 구간을 고르면 쌓인 점 수를 읽어 준다"></canvas>
  <p class="bc__status" data-role="status" aria-live="off">구간을 고르면 쌓인 점 수를 읽어 줌</p>
  <div class="bc__tools">
    <button class="bc__btn" data-role="replay" type="button">다시 떨어뜨리기</button>
    <button class="bc__btn" data-role="flat" type="button" aria-pressed="false">균등 난수 하나로</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("bc");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    const TAU = Math.PI * 2;
    // 파스텔 팔레트 — 어두운 무대 위에 밝은 막대를 얹어 명도 차로 경계가 읽힌다
    const BG = [24, 26, 38];
    const PANEL = [36, 39, 56];
    const PAPER = [250, 246, 236];
    const INK = [30, 30, 44];
    const PAL = [
        [126, 190, 255],
        [255, 164, 190],
        [130, 224, 190],
        [192, 168, 255],
        [255, 206, 160],
        [244, 226, 140],
        [150, 220, 236],
        [230, 184, 226],
        [196, 220, 160],
        [176, 196, 236],
    ];
    // 가상 데이터의 이름 — 실제 항목이 아니라 순서만 뜻한다
    const LABELS = ['항목 A', '항목 B', '항목 C', '항목 D', '항목 E', '항목 F', '항목 G', '항목 H', '항목 I', '항목 J'];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !statusEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 움직임 줄이기 — 열린 페이지에서 설정을 바꿔도 아래 tail 의 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function onResize() {
        fitCanvas();
        draw();
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    // 화면 좌표(CSS px) → 장면 좌표(480x300). 리사이즈 뒤에도 늘 현재 크기로 다시 잰다
    function toScene(ev) {
        const r = cv.getBoundingClientRect();
        return [((ev.clientX - r.left) / r.width) * W, ((ev.clientY - r.top) / r.height) * H];
    }
    // 시드 고정 난수 — 같은 시드면 같은 가상 데이터가 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function seededValues(seed, n, lo, hi) {
        const rnd = makeRng(seed);
        const out = [];
        for (let i = 0; i < n; i += 1) {
            out.push(lo + Math.floor(rnd() * (hi - lo + 1)));
        }
        return out;
    }
    // 세 자리마다 쉼표 — 지역 설정에 기대지 않는다
    function groupDigits(n) {
        const s = String(Math.round(Math.abs(n)));
        let out = '';
        for (let i = 0; i < s.length; i += 1) {
            if (i > 0 && (s.length - i) % 3 === 0) {
                out += ',';
            }
            out += s[i];
        }
        return (n < 0 ? '-' : '') + out;
    }
    // 세로 막대 경로 — 기준선 base 에서 h 만큼(음수면 아래로) 뻗고, 끝 모서리만 둥글린다
    function barPath(c, x, base, w, h, r) {
        const rr = Math.min(r, Math.abs(h), w / 2);
        const tip = base - h;
        const s = h >= 0 ? 1 : -1;
        c.beginPath();
        c.moveTo(x, base);
        c.lineTo(x, tip + s * rr);
        c.quadraticCurveTo(x, tip, x + rr, tip);
        c.lineTo(x + w - rr, tip);
        c.quadraticCurveTo(x + w, tip, x + w, tip + s * rr);
        c.lineTo(x + w, base);
        c.closePath();
    }
    // 가로 막대 경로 — 왼쪽 x0 에서 len 만큼 뻗고 오른쪽 끝만 둥글린다
    function hbarPath(c, x0, y, len, th, r) {
        const rr = Math.min(r, Math.max(len, 0), th / 2);
        const x1 = x0 + Math.max(len, 0);
        c.beginPath();
        c.moveTo(x0, y);
        c.lineTo(x1 - rr, y);
        c.quadraticCurveTo(x1, y, x1, y + rr);
        c.lineTo(x1, y + th - rr);
        c.quadraticCurveTo(x1, y + th, x1 - rr, y + th);
        c.lineTo(x0, y + th);
        c.closePath();
    }
    function clearStage() {
        ctx.fillStyle = rgba(BG, 1);
        ctx.fillRect(0, 0, W, H);
    }
    function axisText(text, x, y, align, a) {
        ctx.font = '500 10px sans-serif';
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(PAPER, a);
        ctx.fillText(text, x, y);
    }
    // 고른 막대 — 화살표 키·포인터가 가리키는 sel 과 Enter·Space·클릭으로 고정한 pinned
    let sel = -1;
    let pinned = -1;
    function focusIdx() { return sel >= 0 ? sel : pinned; }
    function nextIdx(cur, d, n) {
        return cur < 0 ? (d > 0 ? 0 : n - 1) : (cur + d + n) % n;
    }
    function togglePin(i) {
        pinned = i < 0 || pinned === i ? -1 : i;
    }
    // 고른 막대 테두리 — 화살표·포인터로 가리키기만 하면 점선, Enter·Space·클릭으로 고정하면 실선
    function ringStyle(i, a) {
        ctx.strokeStyle = rgba(PAPER, 0.95 * a);
        ctx.lineWidth = 2;
        ctx.setLineDash(i === pinned ? [] : [4, 3]);
    }
    // 키보드 — ←/→ 막대 옮기기, Enter·Space 고르기, Esc 풀기. 셋 다 상태 줄이 이름과 값을 읽는다
    function bindKeys(move, changed) {
        cv.addEventListener('keydown', function (ev) {
            if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') {
                ev.preventDefault();
                wake();
                move(ev.key === 'ArrowRight' ? 1 : -1);
                changed();
            }
            else if (ev.key === 'Enter' || ev.key === ' ') {
                ev.preventDefault();
                wake();
                togglePin(focusIdx());
                changed();
            }
            else if (ev.key === 'Escape') {
                ev.preventDefault();
                wake();
                sel = -1;
                pinned = -1;
                changed();
            }
        });
    }
    // 포인터 — 올리면 sel, 누르면 그 막대를 고정(같은 막대를 다시 누르면 풀기)
    function bindPointer(hit, changed) {
        cv.addEventListener('pointermove', function (ev) {
            if (demo) {
                return;
            }
            const p = toScene(ev);
            const i = hit(p[0], p[1]);
            if (i !== sel) {
                sel = i;
                changed();
            }
        });
        cv.addEventListener('pointerdown', function (ev) {
            wake();
            const p = toScene(ev);
            const i = hit(p[0], p[1]);
            sel = i;
            togglePin(i);
            changed();
        });
    }
    // 시연 일정 — 루프 안의 시각(ms) 표를 지날 때마다 한 번씩 부른다
    let schedCycle = -1;
    let schedIdx = 0;
    function runSchedule(t, loop, marks, fire) {
        const cyc = Math.floor(t / loop);
        const p = t - cyc * loop;
        if (cyc !== schedCycle) {
            schedCycle = cyc;
            schedIdx = 0;
        }
        while (schedIdx < marks.length && p >= marks[schedIdx]) {
            fire(schedIdx, cyc);
            schedIdx += 1;
        }
    }
    // 중력 가속도(px/s²) — 16ms 걸음마다 속도에 더하고, 속도로 위치를 옮긴다
    const DROP_GRAVITY = 1400;
    // 칸 수 — 0~1 사이 표본을 이만큼 똑같이 나눠 어느 칸에 떨어질지 정한다
    const BIN_COUNT = 15;
    // 쌓인 점에 닿을 때 남기는 속도 비율 — 이 값을 곱해 위로 튕긴다
    const BOUNCE_LOSS = 0.35;
    // 균등 난수 몇 개를 평균 내는지 — 1 이면 칸마다 고르고, 늘수록 가운데가 두꺼워진다
    const MEAN_OF = 4;
    const DOT_N = 360;
    const SPAWN_PER_STEP = 6;
    const REST_SPEED = 70;
    const DOT_COLS = 3;
    const DOT_STEP = 7;
    const DOT_R = 2.8;
    const SEED = 4708;
    const PLOT_L = 34;
    const PLOT_R = 446;
    const PLOT_T = 52;
    const PLOT_B = 264;
    const DEMO_LOOP = 2000;
    const TXT_IDLE = '구간을 고르면 쌓인 점 수를 읽어 줌';
    const TXT_BIN = '구간 ';
    const replayBtn = root.querySelector('[data-role="replay"]');
    const flatBtn = root.querySelector('[data-role="flat"]');
    const binW = (PLOT_R - PLOT_L) / BIN_COUNT;
    let dots = [];
    let reserved = [];
    let landed = [];
    let rnd = makeRng(SEED);
    let spawned = 0;
    let flat = false;
    let round = 0;
    // 표본 하나 — 균등 난수 n 개의 평균. 여러 개를 더할수록 가운데(0.5) 근처가 잦아진다
    function sampleMean(n) {
        let s = 0;
        for (let i = 0; i < n; i += 1) {
            s += rnd();
        }
        return s / n;
    }
    function reset() {
        round += 1;
        rnd = makeRng(SEED + round);
        dots = [];
        reserved = [];
        landed = [];
        for (let b = 0; b < BIN_COUNT; b += 1) {
            reserved.push(0);
            landed.push(0);
        }
        spawned = 0;
    }
    // 점 하나 내보내기 — 칸을 고르고, 그 칸에서 몇 번째 자리에 앉을지 미리 잡아 둔다
    function spawn() {
        const u = sampleMean(flat ? 1 : MEAN_OF);
        const bin = Math.min(BIN_COUNT - 1, Math.floor(u * BIN_COUNT));
        const slot = reserved[bin];
        reserved[bin] += 1;
        const col = slot % DOT_COLS;
        const row = Math.floor(slot / DOT_COLS);
        const x = PLOT_L + bin * binW + (binW - (DOT_COLS - 1) * DOT_STEP) / 2 + col * DOT_STEP;
        dots.push({ x: x, y: PLOT_T - 6 - rnd() * 40, v: 0, bin: bin, restY: PLOT_B - DOT_STEP / 2 - row * DOT_STEP, rest: false });
        spawned += 1;
    }
    function step() {
        const dt = FIXED_DT / 1000;
        for (let k = 0; k < SPAWN_PER_STEP && spawned < DOT_N; k += 1) {
            spawn();
        }
        for (let i = 0; i < dots.length; i += 1) {
            const d = dots[i];
            if (d.rest) {
                continue;
            }
            d.v += DROP_GRAVITY * dt;
            d.y += d.v * dt;
            // 제 자리(쌓인 높이)에 닿으면 튕기거나, 충분히 느리면 멈춰 쌓인다
            if (d.y >= d.restY) {
                d.y = d.restY;
                if (d.v > REST_SPEED) {
                    d.v = -d.v * BOUNCE_LOSS;
                }
                else {
                    d.v = 0;
                    d.rest = true;
                    landed[d.bin] += 1;
                }
            }
        }
    }
    function settle() {
        while (spawned < DOT_N) {
            spawn();
        }
        for (let i = 0; i < dots.length; i += 1) {
            const d = dots[i];
            if (!d.rest) {
                d.rest = true;
                d.y = d.restY;
                d.v = 0;
                landed[d.bin] += 1;
            }
        }
    }
    function report() {
        const f = focusIdx();
        if (f >= 0) {
            say(TXT_BIN + (f + 1) + ' · ' + landed[f] + ' / ' + spawned);
        }
        else {
            say(TXT_IDLE);
        }
    }
    function demoTick(t) {
        runSchedule(t, DEMO_LOOP, [200], function () { reset(); });
    }
    function draw() {
        clearStage();
        ctx.fillStyle = rgba(PAPER, 0.3);
        ctx.fillRect(PLOT_L, PLOT_B, PLOT_R - PLOT_L, 1);
        const f = focusIdx();
        // 막대 — 칸마다 멈춘 점 줄 수만큼의 높이. 쌓인 점 기둥을 그대로 감싼다
        for (let b = 0; b < BIN_COUNT; b += 1) {
            const rows = Math.ceil(landed[b] / DOT_COLS);
            const h = rows * DOT_STEP;
            const x = PLOT_L + b * binW + 2;
            const c = PAL[b % 3 === 0 ? 0 : (b % 3 === 1 ? 3 : 6)];
            ctx.fillStyle = rgba(c, b === f ? 0.42 : 0.2);
            barPath(ctx, x, PLOT_B, binW - 4, h + (h > 0 ? 4 : 0), 5);
            ctx.fill();
            if (b === f) {
                ringStyle(b, 1);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            if (landed[b] > 0) {
                axisText(String(landed[b]), x + (binW - 4) / 2, PLOT_B - h - 12, 'center', b === f ? 1 : 0.7);
            }
            axisText(String(b + 1), x + (binW - 4) / 2, PLOT_B + 12, 'center', b === f ? 0.95 : 0.45);
        }
        // 점 — 떨어지는 동안은 밝게, 멈추면 칸 색으로
        for (let i = 0; i < dots.length; i += 1) {
            const d = dots[i];
            const c = PAL[d.bin % 3 === 0 ? 0 : (d.bin % 3 === 1 ? 3 : 6)];
            ctx.fillStyle = d.rest ? rgba(c, 1) : rgba(mix(c, PAPER, 0.55), 1);
            ctx.beginPath();
            ctx.arc(d.x, d.y, DOT_R, 0, TAU);
            ctx.fill();
        }
    }
    function after() {
        if (still) {
            settle();
        }
        report();
        draw();
        if (flatBtn) {
            flatBtn.setAttribute('aria-pressed', flat ? 'true' : 'false');
        }
    }
    function hitBin(x, y) {
        if (y < PLOT_T - 20 || y > PLOT_B + 20) {
            return -1;
        }
        const b = Math.floor((x - PLOT_L) / binW);
        return b >= 0 && b < BIN_COUNT ? b : -1;
    }
    bindKeys(function (d) { sel = nextIdx(focusIdx(), d, BIN_COUNT); }, after);
    bindPointer(hitBin, after);
    if (replayBtn) {
        replayBtn.addEventListener('click', function () { wake(); reset(); after(); });
    }
    if (flatBtn) {
        flatBtn.addEventListener('click', function () { wake(); flat = !flat; reset(); after(); });
    }
    reset();
    report();
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    let clock = 0;
    function frame(ts) {
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 순간이동 대신 이어서 움직인다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            clock += FIXED_DT;
            if (demo) {
                demoTick(clock);
            }
            step();
            acc -= FIXED_DT;
            n += 1;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    function startMotion() {
        window.cancelAnimationFrame(rafId);
        lastTs = -1;
        acc = 0;
        if (still) {
            // 움직임 줄이기 — 루프를 돌리지 않고 지금 목표 상태로 바로 그린다
            settle();
            draw();
        }
        else {
            rafId = window.requestAnimationFrame(frame);
        }
    }
    // 열린 페이지에서 움직임 줄이기 설정이 바뀌어도 그 자리에서 루프를 멈추거나 다시 켠다
    function onMotionPref() {
        still = reduceQuery.matches;
        startMotion();
    }
    if (typeof reduceQuery.addEventListener === 'function') {
        reduceQuery.addEventListener('change', onMotionPref);
    }
    startMotion();
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
        if (typeof reduceQuery.removeEventListener === 'function') {
            reduceQuery.removeEventListener('change', onMotionPref);
        }
    };
})();
</script>
</body>
</html>
