<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked Bars That Build Up Layer by Layer From the Bottom — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bc is-demo" id="bc">
  <canvas class="bc__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="A stacked bar chart that piles four series as running sums and fills layer by layer from the bottom with a delay. Pick a bar with ←/→ to hear its name and total"></canvas>
  <p class="bc__status" data-role="status" aria-live="off">Pick a bar to hear its total</p>
  <div class="bc__tools">
    <button class="bc__btn" data-role="replay" type="button">Stack again</button>
    <button class="bc__btn" data-role="hide" type="button" aria-pressed="false">Hide series 3</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("bc");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    const TAU = Math.PI * 2;
    // 파스텔 팔레트 — 어두운 무대 위에 밝은 막대를 얹어 명도 차로 경계가 읽힌다
    const BG = [24, 26, 38];
    const PANEL = [36, 39, 56];
    const PAPER = [250, 246, 236];
    const INK = [30, 30, 44];
    const PAL = [
        [126, 190, 255],
        [255, 164, 190],
        [130, 224, 190],
        [192, 168, 255],
        [255, 206, 160],
        [244, 226, 140],
        [150, 220, 236],
        [230, 184, 226],
        [196, 220, 160],
        [176, 196, 236],
    ];
    // 가상 데이터의 이름 — 실제 항목이 아니라 순서만 뜻한다
    const LABELS = ['Item A', 'Item B', 'Item C', 'Item D', 'Item E', 'Item F', 'Item G', 'Item H', 'Item I', 'Item J'];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !statusEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 움직임 줄이기 — 열린 페이지에서 설정을 바꿔도 아래 tail 의 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function onResize() {
        fitCanvas();
        draw();
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    // 화면 좌표(CSS px) → 장면 좌표(480x300). 리사이즈 뒤에도 늘 현재 크기로 다시 잰다
    function toScene(ev) {
        const r = cv.getBoundingClientRect();
        return [((ev.clientX - r.left) / r.width) * W, ((ev.clientY - r.top) / r.height) * H];
    }
    // 시드 고정 난수 — 같은 시드면 같은 가상 데이터가 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function seededValues(seed, n, lo, hi) {
        const rnd = makeRng(seed);
        const out = [];
        for (let i = 0; i < n; i += 1) {
            out.push(lo + Math.floor(rnd() * (hi - lo + 1)));
        }
        return out;
    }
    // 세 자리마다 쉼표 — 지역 설정에 기대지 않는다
    function groupDigits(n) {
        const s = String(Math.round(Math.abs(n)));
        let out = '';
        for (let i = 0; i < s.length; i += 1) {
            if (i > 0 && (s.length - i) % 3 === 0) {
                out += ',';
            }
            out += s[i];
        }
        return (n < 0 ? '-' : '') + out;
    }
    // 세로 막대 경로 — 기준선 base 에서 h 만큼(음수면 아래로) 뻗고, 끝 모서리만 둥글린다
    function barPath(c, x, base, w, h, r) {
        const rr = Math.min(r, Math.abs(h), w / 2);
        const tip = base - h;
        const s = h >= 0 ? 1 : -1;
        c.beginPath();
        c.moveTo(x, base);
        c.lineTo(x, tip + s * rr);
        c.quadraticCurveTo(x, tip, x + rr, tip);
        c.lineTo(x + w - rr, tip);
        c.quadraticCurveTo(x + w, tip, x + w, tip + s * rr);
        c.lineTo(x + w, base);
        c.closePath();
    }
    // 가로 막대 경로 — 왼쪽 x0 에서 len 만큼 뻗고 오른쪽 끝만 둥글린다
    function hbarPath(c, x0, y, len, th, r) {
        const rr = Math.min(r, Math.max(len, 0), th / 2);
        const x1 = x0 + Math.max(len, 0);
        c.beginPath();
        c.moveTo(x0, y);
        c.lineTo(x1 - rr, y);
        c.quadraticCurveTo(x1, y, x1, y + rr);
        c.lineTo(x1, y + th - rr);
        c.quadraticCurveTo(x1, y + th, x1 - rr, y + th);
        c.lineTo(x0, y + th);
        c.closePath();
    }
    function clearStage() {
        ctx.fillStyle = rgba(BG, 1);
        ctx.fillRect(0, 0, W, H);
    }
    function axisText(text, x, y, align, a) {
        ctx.font = '500 10px sans-serif';
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(PAPER, a);
        ctx.fillText(text, x, y);
    }
    // 고른 막대 — 화살표 키·포인터가 가리키는 sel 과 Enter·Space·클릭으로 고정한 pinned
    let sel = -1;
    let pinned = -1;
    function focusIdx() { return sel >= 0 ? sel : pinned; }
    function nextIdx(cur, d, n) {
        return cur < 0 ? (d > 0 ? 0 : n - 1) : (cur + d + n) % n;
    }
    function togglePin(i) {
        pinned = i < 0 || pinned === i ? -1 : i;
    }
    // 고른 막대 테두리 — 화살표·포인터로 가리키기만 하면 점선, Enter·Space·클릭으로 고정하면 실선
    function ringStyle(i, a) {
        ctx.strokeStyle = rgba(PAPER, 0.95 * a);
        ctx.lineWidth = 2;
        ctx.setLineDash(i === pinned ? [] : [4, 3]);
    }
    // 키보드 — ←/→ 막대 옮기기, Enter·Space 고르기, Esc 풀기. 셋 다 상태 줄이 이름과 값을 읽는다
    function bindKeys(move, changed) {
        cv.addEventListener('keydown', function (ev) {
            if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') {
                ev.preventDefault();
                wake();
                move(ev.key === 'ArrowRight' ? 1 : -1);
                changed();
            }
            else if (ev.key === 'Enter' || ev.key === ' ') {
                ev.preventDefault();
                wake();
                togglePin(focusIdx());
                changed();
            }
            else if (ev.key === 'Escape') {
                ev.preventDefault();
                wake();
                sel = -1;
                pinned = -1;
                changed();
            }
        });
    }
    // 포인터 — 올리면 sel, 누르면 그 막대를 고정(같은 막대를 다시 누르면 풀기)
    function bindPointer(hit, changed) {
        cv.addEventListener('pointermove', function (ev) {
            if (demo) {
                return;
            }
            const p = toScene(ev);
            const i = hit(p[0], p[1]);
            if (i !== sel) {
                sel = i;
                changed();
            }
        });
        cv.addEventListener('pointerdown', function (ev) {
            wake();
            const p = toScene(ev);
            const i = hit(p[0], p[1]);
            sel = i;
            togglePin(i);
            changed();
        });
    }
    // 시연 일정 — 루프 안의 시각(ms) 표를 지날 때마다 한 번씩 부른다
    let schedCycle = -1;
    let schedIdx = 0;
    function runSchedule(t, loop, marks, fire) {
        const cyc = Math.floor(t / loop);
        const p = t - cyc * loop;
        if (cyc !== schedCycle) {
            schedCycle = cyc;
            schedIdx = 0;
        }
        while (schedIdx < marks.length && p >= marks[schedIdx]) {
            fire(schedIdx, cyc);
            schedIdx += 1;
        }
    }
    // 층 출발 시차 — 아래 층이 출발하고 이만큼 뒤에 바로 위 층이 출발한다
    const SEGMENT_DELAY_MS = 220;
    // 층 채우기 이징의 거듭제곱 — 1 − (1 − t)^p, 클수록 처음에 빨리 차고 끝에서 오래 머문다
    const SEGMENT_EASE_POW = 3;
    // 층과 층 사이 틈(px) — 같은 색이 붙어도 경계가 보이게
    const STACK_GAP_PX = 2;
    const FILL_MS = 520;
    const COL_STAGGER_MS = 40;
    const COL_N = 6;
    const SERIES_N = 4;
    const SEED = 4703;
    const PLOT_L = 40;
    const PLOT_R = 384;
    const PLOT_T = 70;
    const PLOT_B = 262;
    const COL_GAP = 20;
    const WEIGHT_LERP = 0.14;
    const DEMO_LOOP = 2000;
    const SERIES = ['Series 1', 'Series 2', 'Series 3', 'Series 4'];
    const SERIES_COL = [PAL[0], PAL[3], PAL[1], PAL[4]];
    const TXT_IDLE = 'Pick a bar to hear its total';
    const replayBtn = root.querySelector('[data-role="replay"]');
    const hideBtn = root.querySelector('[data-role="hide"]');
    const values = [];
    for (let c = 0; c < COL_N; c += 1) {
        values.push(seededValues(SEED + c * 7, SERIES_N, 8, 34));
    }
    const slotW = (PLOT_R - PLOT_L) / COL_N;
    const barW = slotW - COL_GAP;
    let buildMs = 0;
    let hidden = -1;
    const weight = [1, 1, 1, 1];
    // 축 최댓값 — 가장 높은 합계를 20 단위로 올림
    let maxTotal = 0;
    for (let c = 0; c < COL_N; c += 1) {
        let s = 0;
        for (let k = 0; k < SERIES_N; k += 1) {
            s += values[c][k];
        }
        maxTotal = Math.max(maxTotal, s);
    }
    const AXIS_MAX = Math.ceil(maxTotal / 20) * 20;
    // 층 k 의 채움 정도(0~1) — 출발은 층마다 SEGMENT_DELAY_MS, 막대마다 COL_STAGGER_MS 씩 늦다
    function fill(c, k) {
        const t = clamp((buildMs - k * SEGMENT_DELAY_MS - c * COL_STAGGER_MS) / FILL_MS, 0, 1);
        return 1 - Math.pow(1 - t, SEGMENT_EASE_POW);
    }
    // 지금 보이는 값 — 원래 값 × 채움 × 계열 표시 가중치
    function shown(c, k) { return values[c][k] * fill(c, k) * weight[k]; }
    // 누적합 — 층 k 의 시작 높이는 아래 층들의 보이는 값을 더한 것
    function baseOf(c, k) {
        let s = 0;
        for (let j = 0; j < k; j += 1) {
            s += shown(c, j);
        }
        return s;
    }
    function totalOf(c) { return baseOf(c, SERIES_N); }
    const buildEnd = (SERIES_N - 1) * SEGMENT_DELAY_MS + (COL_N - 1) * COL_STAGGER_MS + FILL_MS;
    function step() {
        buildMs += FIXED_DT;
        for (let k = 0; k < SERIES_N; k += 1) {
            weight[k] += ((k === hidden ? 0 : 1) - weight[k]) * WEIGHT_LERP;
        }
    }
    function settle() {
        buildMs = Math.max(buildMs, buildEnd);
        for (let k = 0; k < SERIES_N; k += 1) {
            weight[k] = k === hidden ? 0 : 1;
        }
    }
    function report() {
        const f = focusIdx();
        if (f >= 0) {
            say(LABELS[f] + ' · total ' + groupDigits(totalOf(f)));
        }
        else {
            say(TXT_IDLE);
        }
    }
    function rebuild() { buildMs = 0; }
    function demoTick(t) {
        runSchedule(t, DEMO_LOOP, [200, 1650], function (k) {
            if (k === 0) {
                hidden = -1;
                for (let j = 0; j < SERIES_N; j += 1) {
                    weight[j] = 1;
                }
                rebuild();
            }
            else {
                hidden = 2;
            }
            report();
        });
    }
    const unit = (PLOT_B - PLOT_T) / AXIS_MAX;
    function draw() {
        clearStage();
        for (let g = 0; g <= AXIS_MAX; g += 20) {
            const y = PLOT_B - g * unit;
            ctx.fillStyle = rgba(PAPER, g === 0 ? 0.32 : 0.08);
            ctx.fillRect(PLOT_L, Math.round(y), PLOT_R - PLOT_L, 1);
            axisText(String(g), PLOT_L - 8, y, 'right', 0.5);
        }
        const f = focusIdx();
        for (let c = 0; c < COL_N; c += 1) {
            const x = PLOT_L + c * slotW + COL_GAP / 2;
            const dim = f >= 0 && f !== c;
            let acc = 0;
            let topK = -1;
            for (let k = 0; k < SERIES_N; k += 1) {
                if (shown(c, k) * unit > 0.5) {
                    topK = k;
                }
            }
            for (let k = 0; k < SERIES_N; k += 1) {
                const h = shown(c, k) * unit;
                if (h <= 0.5) {
                    continue;
                }
                // 틈은 층이 틈보다 클 때만 다 연다 — 막 출발한 얇은 층이 틈에 묻히지 않게
                if (acc > 0) {
                    acc += STACK_GAP_PX * clamp(h / STACK_GAP_PX, 0, 1);
                }
                ctx.fillStyle = rgba(SERIES_COL[k], dim ? 0.45 : 1);
                barPath(ctx, x, PLOT_B - acc, barW, h, k === topK ? 5 : 0);
                ctx.fill();
                acc += h;
            }
            if (c === f && acc > 0) {
                ringStyle(c, 1);
                ctx.strokeRect(x - 2, PLOT_B - acc - 2, barW + 4, acc + 2);
                ctx.setLineDash([]);
            }
            // 꼭대기 합계 — 층이 차오르는 만큼 같이 세어 올린다
            const total = totalOf(c);
            if (total > 0.5) {
                ctx.font = '700 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillStyle = rgba(PAPER, dim ? 0.45 : 0.95);
                ctx.fillText(groupDigits(total), x + barW / 2, PLOT_B - acc - 5);
            }
            axisText(LABELS[c], x + barW / 2, PLOT_B + 14, 'center', c === f ? 0.95 : 0.55);
        }
        // 범례 — 숨긴 계열은 흐리게
        for (let k = SERIES_N - 1; k >= 0; k -= 1) {
            const y = PLOT_T + 30 + (SERIES_N - 1 - k) * 22;
            ctx.fillStyle = rgba(SERIES_COL[k], 0.25 + 0.75 * weight[k]);
            ctx.fillRect(404, y - 5, 10, 10);
            ctx.font = '500 11px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = rgba(PAPER, 0.3 + 0.55 * weight[k]);
            ctx.fillText(SERIES[k], 420, y);
        }
    }
    function after() {
        if (still) {
            settle();
        }
        report();
        draw();
        if (hideBtn) {
            hideBtn.setAttribute('aria-pressed', hidden === 2 ? 'true' : 'false');
        }
    }
    function hitCol(x, y) {
        if (y < PLOT_T - 20 || y > PLOT_B + 24) {
            return -1;
        }
        const c = Math.floor((x - PLOT_L) / slotW);
        return c >= 0 && c < COL_N ? c : -1;
    }
    bindKeys(function (d) { sel = nextIdx(focusIdx(), d, COL_N); }, after);
    bindPointer(hitCol, after);
    if (replayBtn) {
        replayBtn.addEventListener('click', function () { wake(); rebuild(); after(); });
    }
    if (hideBtn) {
        hideBtn.addEventListener('click', function () { wake(); hidden = hidden === 2 ? -1 : 2; after(); });
    }
    report();
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    let clock = 0;
    function frame(ts) {
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 순간이동 대신 이어서 움직인다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            clock += FIXED_DT;
            if (demo) {
                demoTick(clock);
            }
            step();
            acc -= FIXED_DT;
            n += 1;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    function startMotion() {
        window.cancelAnimationFrame(rafId);
        lastTs = -1;
        acc = 0;
        if (still) {
            // 움직임 줄이기 — 루프를 돌리지 않고 지금 목표 상태로 바로 그린다
            settle();
            draw();
        }
        else {
            rafId = window.requestAnimationFrame(frame);
        }
    }
    // 열린 페이지에서 움직임 줄이기 설정이 바뀌어도 그 자리에서 루프를 멈추거나 다시 켠다
    function onMotionPref() {
        still = reduceQuery.matches;
        startMotion();
    }
    if (typeof reduceQuery.addEventListener === 'function') {
        reduceQuery.addEventListener('change', onMotionPref);
    }
    startMotion();
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
        if (typeof reduceQuery.removeEventListener === 'function') {
            reduceQuery.removeEventListener('change', onMotionPref);
        }
    };
})();
</script>
</body>
</html>
