<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>목표 높이를 한 번 넘었다 돌아오며 스프링으로 자라는 막대 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bc is-demo" id="bc">
  <canvas class="bc__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="가상 값 여덟 개의 막대가 감쇠 스프링으로 자라 목표 높이를 한 번 넘었다 돌아오는 막대 그래프. ←/→ 로 막대를 고르면 이름과 값을 읽어 준다"></canvas>
  <p class="bc__status" data-role="status" aria-live="off">막대를 고르면 값을 읽어 줌</p>
  <div class="bc__tools">
    <button class="bc__btn" data-role="replay" type="button">다시 키우기</button>
    <button class="bc__btn" data-role="data" type="button">새 데이터</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("bc");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    const TAU = Math.PI * 2;
    // 파스텔 팔레트 — 어두운 무대 위에 밝은 막대를 얹어 명도 차로 경계가 읽힌다
    const BG = [24, 26, 38];
    const PANEL = [36, 39, 56];
    const PAPER = [250, 246, 236];
    const INK = [30, 30, 44];
    const PAL = [
        [126, 190, 255],
        [255, 164, 190],
        [130, 224, 190],
        [192, 168, 255],
        [255, 206, 160],
        [244, 226, 140],
        [150, 220, 236],
        [230, 184, 226],
        [196, 220, 160],
        [176, 196, 236],
    ];
    // 가상 데이터의 이름 — 실제 항목이 아니라 순서만 뜻한다
    const LABELS = ['항목 A', '항목 B', '항목 C', '항목 D', '항목 E', '항목 F', '항목 G', '항목 H', '항목 I', '항목 J'];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !statusEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 움직임 줄이기 — 열린 페이지에서 설정을 바꿔도 아래 tail 의 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function onResize() {
        fitCanvas();
        draw();
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    // 화면 좌표(CSS px) → 장면 좌표(480x300). 리사이즈 뒤에도 늘 현재 크기로 다시 잰다
    function toScene(ev) {
        const r = cv.getBoundingClientRect();
        return [((ev.clientX - r.left) / r.width) * W, ((ev.clientY - r.top) / r.height) * H];
    }
    // 시드 고정 난수 — 같은 시드면 같은 가상 데이터가 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function seededValues(seed, n, lo, hi) {
        const rnd = makeRng(seed);
        const out = [];
        for (let i = 0; i < n; i += 1) {
            out.push(lo + Math.floor(rnd() * (hi - lo + 1)));
        }
        return out;
    }
    // 세 자리마다 쉼표 — 지역 설정에 기대지 않는다
    function groupDigits(n) {
        const s = String(Math.round(Math.abs(n)));
        let out = '';
        for (let i = 0; i < s.length; i += 1) {
            if (i > 0 && (s.length - i) % 3 === 0) {
                out += ',';
            }
            out += s[i];
        }
        return (n < 0 ? '-' : '') + out;
    }
    // 세로 막대 경로 — 기준선 base 에서 h 만큼(음수면 아래로) 뻗고, 끝 모서리만 둥글린다
    function barPath(c, x, base, w, h, r) {
        const rr = Math.min(r, Math.abs(h), w / 2);
        const tip = base - h;
        const s = h >= 0 ? 1 : -1;
        c.beginPath();
        c.moveTo(x, base);
        c.lineTo(x, tip + s * rr);
        c.quadraticCurveTo(x, tip, x + rr, tip);
        c.lineTo(x + w - rr, tip);
        c.quadraticCurveTo(x + w, tip, x + w, tip + s * rr);
        c.lineTo(x + w, base);
        c.closePath();
    }
    // 가로 막대 경로 — 왼쪽 x0 에서 len 만큼 뻗고 오른쪽 끝만 둥글린다
    function hbarPath(c, x0, y, len, th, r) {
        const rr = Math.min(r, Math.max(len, 0), th / 2);
        const x1 = x0 + Math.max(len, 0);
        c.beginPath();
        c.moveTo(x0, y);
        c.lineTo(x1 - rr, y);
        c.quadraticCurveTo(x1, y, x1, y + rr);
        c.lineTo(x1, y + th - rr);
        c.quadraticCurveTo(x1, y + th, x1 - rr, y + th);
        c.lineTo(x0, y + th);
        c.closePath();
    }
    function clearStage() {
        ctx.fillStyle = rgba(BG, 1);
        ctx.fillRect(0, 0, W, H);
    }
    function axisText(text, x, y, align, a) {
        ctx.font = '500 10px sans-serif';
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(PAPER, a);
        ctx.fillText(text, x, y);
    }
    // 고른 막대 — 화살표 키·포인터가 가리키는 sel 과 Enter·Space·클릭으로 고정한 pinned
    let sel = -1;
    let pinned = -1;
    function focusIdx() { return sel >= 0 ? sel : pinned; }
    function nextIdx(cur, d, n) {
        return cur < 0 ? (d > 0 ? 0 : n - 1) : (cur + d + n) % n;
    }
    function togglePin(i) {
        pinned = i < 0 || pinned === i ? -1 : i;
    }
    // 고른 막대 테두리 — 화살표·포인터로 가리키기만 하면 점선, Enter·Space·클릭으로 고정하면 실선
    function ringStyle(i, a) {
        ctx.strokeStyle = rgba(PAPER, 0.95 * a);
        ctx.lineWidth = 2;
        ctx.setLineDash(i === pinned ? [] : [4, 3]);
    }
    // 키보드 — ←/→ 막대 옮기기, Enter·Space 고르기, Esc 풀기. 셋 다 상태 줄이 이름과 값을 읽는다
    function bindKeys(move, changed) {
        cv.addEventListener('keydown', function (ev) {
            if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') {
                ev.preventDefault();
                wake();
                move(ev.key === 'ArrowRight' ? 1 : -1);
                changed();
            }
            else if (ev.key === 'Enter' || ev.key === ' ') {
                ev.preventDefault();
                wake();
                togglePin(focusIdx());
                changed();
            }
            else if (ev.key === 'Escape') {
                ev.preventDefault();
                wake();
                sel = -1;
                pinned = -1;
                changed();
            }
        });
    }
    // 포인터 — 올리면 sel, 누르면 그 막대를 고정(같은 막대를 다시 누르면 풀기)
    function bindPointer(hit, changed) {
        cv.addEventListener('pointermove', function (ev) {
            if (demo) {
                return;
            }
            const p = toScene(ev);
            const i = hit(p[0], p[1]);
            if (i !== sel) {
                sel = i;
                changed();
            }
        });
        cv.addEventListener('pointerdown', function (ev) {
            wake();
            const p = toScene(ev);
            const i = hit(p[0], p[1]);
            sel = i;
            togglePin(i);
            changed();
        });
    }
    // 시연 일정 — 루프 안의 시각(ms) 표를 지날 때마다 한 번씩 부른다
    let schedCycle = -1;
    let schedIdx = 0;
    function runSchedule(t, loop, marks, fire) {
        const cyc = Math.floor(t / loop);
        const p = t - cyc * loop;
        if (cyc !== schedCycle) {
            schedCycle = cyc;
            schedIdx = 0;
        }
        while (schedIdx < marks.length && p >= marks[schedIdx]) {
            fire(schedIdx, cyc);
            schedIdx += 1;
        }
    }
    function springStep(s, k, d, dt) {
        const a = -k * (s.x - s.to) - d * s.v;
        s.v += a * dt;
        s.x += s.v * dt;
    }
    // 감쇠 스프링 — 당기는 힘(1/s²)과 끄는 힘(1/s). 감쇠비 = SPRING_DAMPING / (2√SPRING_STIFFNESS) 가 1 보다 작아 목표를 한 번 넘었다 돌아온다
    const SPRING_STIFFNESS = 170;
    const SPRING_DAMPING = 12;
    // 막대 출발 시차 — 왼쪽 막대부터 이만큼씩 늦게 당기기 시작한다
    const GROW_STAGGER_MS = 70;
    const BAR_N = 8;
    const SEED = 470;
    const PLOT_L = 44;
    const PLOT_R = 462;
    const PLOT_T = 64;
    const PLOT_B = 262;
    const AXIS_MAX = 100;
    const BAR_GAP = 14;
    const DEMO_LOOP = 2000;
    const TXT_IDLE = '막대를 고르면 값을 읽어 줌';
    const replayBtn = root.querySelector('[data-role="replay"]');
    const dataBtn = root.querySelector('[data-role="data"]');
    const slotW = (PLOT_R - PLOT_L) / BAR_N;
    const barW = slotW - BAR_GAP;
    let seed = SEED;
    let goal = seededValues(seed, BAR_N, 30, 94);
    const bars = [];
    const startAt = [];
    for (let i = 0; i < BAR_N; i += 1) {
        bars.push({ x: 0, v: 0, to: 0 });
        startAt.push(0);
    }
    let simMs = 0;
    // 새 목표를 건다 — 막대 i 는 simMs + i × GROW_STAGGER_MS 부터 목표 쪽으로 당겨진다
    function grow(values, fromZero) {
        goal = values;
        for (let i = 0; i < BAR_N; i += 1) {
            startAt[i] = simMs + i * GROW_STAGGER_MS;
            if (fromZero) {
                bars[i].x = 0;
                bars[i].v = 0;
                bars[i].to = 0;
            }
        }
    }
    function step() {
        simMs += FIXED_DT;
        const dt = FIXED_DT / 1000;
        for (let i = 0; i < BAR_N; i += 1) {
            if (simMs >= startAt[i]) {
                bars[i].to = goal[i];
            }
            springStep(bars[i], SPRING_STIFFNESS, SPRING_DAMPING, dt);
        }
    }
    function settle() {
        for (let i = 0; i < BAR_N; i += 1) {
            bars[i].to = goal[i];
            bars[i].x = goal[i];
            bars[i].v = 0;
            startAt[i] = simMs;
        }
    }
    function report() {
        const f = focusIdx();
        if (f >= 0) {
            say(LABELS[f] + ' · ' + groupDigits(goal[f]));
        }
        else {
            say(TXT_IDLE);
        }
    }
    function demoTick(t) {
        runSchedule(t, DEMO_LOOP, [200, 1150], function (k, cyc) {
            if (k === 0) {
                grow(seededValues(SEED + (cyc % 2) * 2, BAR_N, 30, 94), true);
            }
            else {
                grow(seededValues(SEED + 1 + (cyc % 2) * 2, BAR_N, 30, 94), false);
            }
            report();
        });
    }
    function yOf(v) { return PLOT_B - (v / AXIS_MAX) * (PLOT_B - PLOT_T); }
    function draw() {
        clearStage();
        for (let g = 0; g <= AXIS_MAX; g += 25) {
            const y = yOf(g);
            ctx.fillStyle = rgba(PAPER, g === 0 ? 0.32 : 0.08);
            ctx.fillRect(PLOT_L, Math.round(y), PLOT_R - PLOT_L, 1);
            axisText(String(g), PLOT_L - 8, y, 'right', 0.5);
        }
        const f = focusIdx();
        for (let i = 0; i < BAR_N; i += 1) {
            const b = bars[i];
            const x = PLOT_L + i * slotW + BAR_GAP / 2;
            const h = Math.max(0, b.x) / AXIS_MAX * (PLOT_B - PLOT_T);
            // 빠르게 움직이는 막대일수록 밝아진다 — 같은 속도 v 가 높이와 밝기 둘에 쓰인다
            const speed = clamp(Math.abs(b.v) / 160, 0, 1);
            const dim = f >= 0 && f !== i;
            ctx.fillStyle = rgba(mix(PAL[i], PAPER, 0.38 * speed), dim ? 0.5 : 1);
            barPath(ctx, x, PLOT_B, barW, h, 6);
            ctx.fill();
            // 목표를 넘은 부분 — 목표선 위로 솟은 만큼을 한 겹 밝게 덧칠한다
            const over = b.x - b.to;
            if (over > 0.4 && b.to > 0) {
                const ht = b.to / AXIS_MAX * (PLOT_B - PLOT_T);
                ctx.fillStyle = rgba(PAPER, 0.42);
                ctx.fillRect(x, PLOT_B - h, barW, h - ht);
            }
            // 목표선 — 아직 자리를 못 잡은 막대에만 점선으로 보여 준다
            if (Math.abs(b.x - goal[i]) > 0.6) {
                const yt = yOf(goal[i]);
                ctx.strokeStyle = rgba(PAPER, 0.55);
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(x - 3, yt);
                ctx.lineTo(x + barW + 3, yt);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            if (i === f) {
                ringStyle(i, 1);
                barPath(ctx, x, PLOT_B, barW, h, 6);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            ctx.font = '700 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillStyle = rgba(PAPER, dim ? 0.45 : 0.92);
            ctx.fillText(String(Math.round(Math.max(0, b.x))), x + barW / 2, PLOT_B - h - 4);
            axisText(LABELS[i], x + barW / 2, PLOT_B + 14, 'center', i === f ? 0.95 : 0.55);
        }
    }
    function after() {
        if (still) {
            settle();
        }
        report();
        draw();
    }
    function hitBar(x, y) {
        if (y < PLOT_T - 20 || y > PLOT_B + 24) {
            return -1;
        }
        const i = Math.floor((x - PLOT_L) / slotW);
        return i >= 0 && i < BAR_N ? i : -1;
    }
    bindKeys(function (d) { sel = nextIdx(focusIdx(), d, BAR_N); }, after);
    bindPointer(hitBar, after);
    if (replayBtn) {
        replayBtn.addEventListener('click', function () { wake(); grow(goal, true); after(); });
    }
    if (dataBtn) {
        dataBtn.addEventListener('click', function () { wake(); seed += 1; grow(seededValues(seed, BAR_N, 30, 94), false); after(); });
    }
    report();
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    let clock = 0;
    function frame(ts) {
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 순간이동 대신 이어서 움직인다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            clock += FIXED_DT;
            if (demo) {
                demoTick(clock);
            }
            step();
            acc -= FIXED_DT;
            n += 1;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    function startMotion() {
        window.cancelAnimationFrame(rafId);
        lastTs = -1;
        acc = 0;
        if (still) {
            // 움직임 줄이기 — 루프를 돌리지 않고 지금 목표 상태로 바로 그린다
            settle();
            draw();
        }
        else {
            rafId = window.requestAnimationFrame(frame);
        }
    }
    // 열린 페이지에서 움직임 줄이기 설정이 바뀌어도 그 자리에서 루프를 멈추거나 다시 켠다
    function onMotionPref() {
        still = reduceQuery.matches;
        startMotion();
    }
    if (typeof reduceQuery.addEventListener === 'function') {
        reduceQuery.addEventListener('change', onMotionPref);
    }
    startMotion();
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
        if (typeof reduceQuery.removeEventListener === 'function') {
            reduceQuery.removeEventListener('change', onMotionPref);
        }
    };
})();
</script>
</body>
</html>
