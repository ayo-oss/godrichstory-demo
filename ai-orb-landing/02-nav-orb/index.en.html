<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">

<title>미끄러지는 오브 닷 내비 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="nv is-demo" id="nv">
  <div class="nv__top">
    <span class="nv__brand">
      <span class="nv__mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M194.82,151.43l-55.09,20.3-20.3,55.09a7.92,7.92,0,0,1-14.86,0l-20.3-55.09-55.09-20.3a7.92,7.92,0,0,1,0-14.86l55.09-20.3,20.3-55.09a7.92,7.92,0,0,1,14.86,0l20.3,55.09,55.09,20.3A7.92,7.92,0,0,1,194.82,151.43Z" opacity="0.2"/><path d="M197.58,129.06,146,110l-19-51.62a15.92,15.92,0,0,0-29.88,0L78,110l-51.62,19a15.92,15.92,0,0,0,0,29.88L78,178l19,51.62a15.92,15.92,0,0,0,29.88,0L146,178l51.62-19a15.92,15.92,0,0,0,0-29.88ZM137,164.22a8,8,0,0,0-4.74,4.74L112,223.85,91.78,169A8,8,0,0,0,87,164.22L32.15,144,87,123.78A8,8,0,0,0,91.78,119L112,64.15,132.22,119a8,8,0,0,0,4.74,4.74L191.85,144ZM144,40a8,8,0,0,1,8-8h16V16a8,8,0,0,1,16,0V32h16a8,8,0,0,1,0,16H184V64a8,8,0,0,1-16,0V48H152A8,8,0,0,1,144,40ZM248,88a8,8,0,0,1-8,8h-8v8a8,8,0,0,1-16,0V96h-8a8,8,0,0,1,0-16h8V72a8,8,0,0,1,16,0v8h8A8,8,0,0,1,248,88Z"/></svg></span>
      Orbit AI
    </span>
    <a class="nv__cta" href="#" role="button">Get started</a>
  </div>
  <nav class="nv__nav" aria-label="Main menu">
    <ul class="nv__tabs" id="tabs">
      <li class="nv__item"><a class="nv__tab is-on" href="#" aria-current="page">Home</a></li>
      <li class="nv__item"><a class="nv__tab" href="#">Features</a></li>
      <li class="nv__item"><a class="nv__tab" href="#">Models</a></li>
      <li class="nv__item"><a class="nv__tab" href="#">Pricing</a></li>
      <li class="nv__item"><a class="nv__tab" href="#">Docs</a></li>
    </ul>
    <span class="nv__dot" id="dot" aria-hidden="true"></span>
  </nav>
  <div class="nv__panel" aria-hidden="true">
    <span class="nv__block"></span>
    <span class="nv__line nv__line--a"></span>
    <span class="nv__line nv__line--b"></span>
  </div>
</div>
</main>
<script>
var nav = document.getElementById('nv');
var dot = document.getElementById('dot');
var tabs = document.querySelectorAll('.nv__tab');
function dotLeft(tab) {
  return tab.offsetLeft + tab.offsetWidth / 2 - dot.offsetWidth / 2;
}
function layoutDots() {
  // --p1~--p5 의 기본값은 English 480×300 실측 px 이다. 라벨 폭은 언어마다 다르므로
  // 실제 렌더 좌표로 한 번 덮어써 en·ja 에서도 점이 라벨 한가운데 선다
  for (var k = 0; k < tabs.length; k++) {
    dot.style.setProperty('--p' + (k + 1), dotLeft(tabs[k]) + 'px');
  }
}
function moveDot(tab) {
  // 클릭·키보드는 실제 렌더 좌표로 옮긴다 (미리보기 루프는 키프레임이 --p 값을 쓴다)
  dot.style.transform = 'translateX(' + dotLeft(tab) + 'px)';
}
layoutDots();
window.addEventListener('resize', layoutDots);
for (var i = 0; i < tabs.length; i++) {
  tabs[i].addEventListener('click', function (e) {
    e.preventDefault();
    nav.classList.remove('is-demo');
    for (var j = 0; j < tabs.length; j++) {
      tabs[j].classList.remove('is-on');
      tabs[j].removeAttribute('aria-current');
    }
    this.classList.add('is-on');
    this.setAttribute('aria-current', 'page');
    moveDot(this);
  });
}
</script>
</body>
</html>
