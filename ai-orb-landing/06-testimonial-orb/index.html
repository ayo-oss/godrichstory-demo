<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오브 아바타 후기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="tm is-demo" id="tm">
  <p class="tm__eyebrow">
    <span class="tm__ico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128A96,96,0,0,1,79.93,211.11h0L42.54,223.58a8,8,0,0,1-10.12-10.12l12.47-37.39h0A96,96,0,1,1,224,128Z" opacity="0.2"/><path d="M128,24A104,104,0,0,0,36.18,176.88L24.83,210.93a16,16,0,0,0,20.24,20.24l34.05-11.35A104,104,0,1,0,128,24Zm0,192a87.87,87.87,0,0,1-44.06-11.81,8,8,0,0,0-4-1.08,7.85,7.85,0,0,0-2.53.42L40,216,52.47,178.6a8,8,0,0,0-.66-6.54A88,88,0,1,1,128,216Zm12-88a12,12,0,1,1-12-12A12,12,0,0,1,140,128Zm-44,0a12,12,0,1,1-12-12A12,12,0,0,1,96,128Zm88,0a12,12,0,1,1-12-12A12,12,0,0,1,184,128Z"/></svg></span>
    먼저 써 본 사람들
  </p>
  <div class="tm__grid">
    <article class="tm__card">
      <span class="tm__orb tm__orb--first" aria-hidden="true"></span>
      <p class="tm__quote">회의록을 넣으면 할 일만 추려서 돌려줘요.</p>
      <p class="tm__role">데이터 분석가</p>
    </article>
    <article class="tm__card">
      <span class="tm__orb tm__orb--second" aria-hidden="true"></span>
      <p class="tm__quote">초안을 세 가지 말투로 받아 골라 씁니다.</p>
      <p class="tm__role">제품 디자이너</p>
    </article>
    <article class="tm__card">
      <span class="tm__orb tm__orb--third" aria-hidden="true"></span>
      <p class="tm__quote">로그를 붙여넣으면 어디가 터졌는지 짚어줘요.</p>
      <p class="tm__role">백엔드 개발자</p>
    </article>
  </div>
</section>
</main>
<script>
var tm = document.getElementById('tm');
function stopLoop() { tm.classList.remove('is-demo'); }
tm.addEventListener('pointerenter', stopLoop);
tm.addEventListener('click', stopLoop);
</script>
</body>
</html>
