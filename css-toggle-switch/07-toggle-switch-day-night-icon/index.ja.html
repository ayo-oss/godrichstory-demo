<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day/night sky toggle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <label class="switch is-demo">
    <input type="checkbox" class="switch__input" role="switch">
    <span class="switch__track">
      <span class="switch__star switch__star--1"></span>
      <span class="switch__star switch__star--2"></span>
      <span class="switch__star switch__star--3"></span>
      <span class="switch__knob">
        <svg class="switch__icon switch__icon--sun" viewBox="0 0 16 16" width="11" height="11" aria-hidden="true">
          <circle cx="8" cy="8" r="3.2" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <line x1="8" y1="0.5" x2="8" y2="2.4"/>
            <line x1="8" y1="13.6" x2="8" y2="15.5"/>
            <line x1="0.5" y1="8" x2="2.4" y2="8"/>
            <line x1="13.6" y1="8" x2="15.5" y2="8"/>
          </g>
        </svg>
        <svg class="switch__icon switch__icon--moon" viewBox="0 0 16 16" width="11" height="11" aria-hidden="true">
          <path d="M10.5 2.5a6 6 0 100 11 7 7 0 010-11z" fill="currentColor"/>
        </svg>
      </span>
    </span>
    <span class="switch__label">夜間モード</span>
  </label>
</main>
<script>
document.querySelectorAll(".switch").forEach(function (s) {
  var input = s.querySelector(".switch__input");
  var sync = function () { input.setAttribute("aria-checked", String(input.checked)); };
  input.addEventListener("pointerdown", function () { s.classList.remove("is-demo"); });
  input.addEventListener("change", sync);
  sync();
});
</script>
</body>
</html>
