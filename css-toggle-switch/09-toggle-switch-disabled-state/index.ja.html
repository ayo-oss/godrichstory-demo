<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disabled state toggle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <!-- 이 항목은 실제로 disabled 다. 데모의 흐려짐 루프는 그 상태로 들어가는 전환을 반복 재생해서 보여줄 뿐, 다시 켜지지 않는다. -->
  <label class="switch is-demo">
    <input type="checkbox" class="switch__input" role="switch" aria-checked="false" disabled aria-label="管理者権限">
    <span class="switch__track">
      <span class="switch__bg switch__bg--off"></span>
      <span class="switch__knob"></span>
    </span>
    <span class="switch__label">管理者権限</span>
  </label>
</main>
</body>
</html>
