<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="デモの舞台 — SpaceかEnterで一時停止、Rで最初から、左右の矢印キーで別の値へ">
      <div class="ez__scene" data-role="scene" role="img" aria-label="行がフィルタの門を通り、必須欄が空の行は横へ外れ、通った行だけがシートへ向かい、通過数と除外数が別々に積もる場面"></div>

      </div>

    </div>
  </div>

<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {

    // ── 539 공통 — n8n 구글 시트 적재 변형 엔진 (535 core 계승, 시트 줄·배치 뭉치 대신 아티클 골격)
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function fill(s) {
        const v = [];
        for (let _i = 1; _i < arguments.length; _i += 1) {
            v[_i - 1] = arguments[_i];
        }
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? String(v[i]) : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);

    }
    function put(e, x, y, w, h) {

        e.style.top = y + 'px';
        if (w > 0) {

        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {

        chartEl.textContent = '';
        probeEl.textContent = '';
    }
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function spanOf(d, dur, k) { return { s: d, e: d + dur, k: k === undefined ? 0 : k }; }
    function bar(cls, x, y, w, h) {
        const e = make('i', cls, chartEl);
        put(e, x, y, w, h);
        return e;
    }
    function drawRows(segs, max) {
        const n = segs.length;
        const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
        for (let i = 0; i < n; i += 1) {
            const sg = segs[i];
            const x = CX0 + clamp(sg.s, 0, max) / max * CW;
            const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
            bar('bar k' + sg.k, x, 5 + i * (h + 1), w, h);
        }
    }
    function axis(max) {
        const a = make('b', 'ax', chartEl);
        a.textContent = '0';
        put(a, CX0, 40, 0, 0);
        const b = make('b', 'ax ax--r', chartEl);
        b.textContent = f0(max) + 'ms';
        put(b, CX0 + CW - 60, 40, 60, 0);
    }
    let headEl = null;
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    function ema(prev, x, k) {
        return prev + (x - prev) * k;
    }
    // cdfInvert — 역누적분포 샘플링. r^expo: expo>1 이면 짧은 쪽(마지막 줄)으로 몰린다
    function cdfInvert(r, expo, lo, hi) {
        return lo + (hi - lo) * Math.pow(r, expo);
    }
    function gammaSample(shape, scale, seed, i) {
        const d = shape - 1 / 3;
        const c = 1 / Math.sqrt(9 * d);
        let guard = 0;
        while (guard < 64) {
            guard += 1;
            const u1 = seedHash(i * 7 + guard, seed);
            const u2 = seedHash(i * 13 + guard * 5, seed);
            const rr = Math.sqrt(-2 * Math.log(Math.max(u1, 1e-9))) * Math.cos(6.28318 * u2);
            const v = Math.pow(1 + c * rr, 3);
            if (v <= 0) { continue; }
            const u3 = seedHash(i * 29 + guard * 11, seed);
            if (Math.log(Math.max(u3, 1e-9)) < 0.5 * rr * rr + d - d * v + d * Math.log(v)) {

    }
    // 스켈레톤 막대 — CSS 클래스 .skel 이 자리를 잡는다 (폭은 계산이 정한다)
    function skelBar(parent, x, y, w, h, delay) {
        const e = make('i', 'skel', parent);
        put(e, x, y, Math.max(12, w), h);
        e.style.animationDelay = (delay || 0) + 'ms';
        return e;
    }
    function mkShim(host) {
        return make('i', 'shim', host);
    }
    function shimAt(s, hostW, t, period) {
        const k = (((t % period) + period) % period) / period;
        s.style.transform = 'translateX(' + ((k * 1.6 - 0.3) * hostW) + 'px)';
        s.style.opacity = k > 0.94 ? '0' : '1';
    }
    let piNow = 0;
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            piNow = pi;
            cycle = Math.max(2000, cfg.build(pi));
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            doneP.textContent = readB.textContent;

        padEl.addEventListener('keydown', function (ev) {

                return;
            }

                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {

            }
            else if (ev.key === 'ArrowRight') {

            }

                ev.preventDefault();
                shift(-1);

        rebuild();

            cfg.frame(1e9);

            doneP.textContent = readB.textContent;
        }

            restart();
            raf = requestAnimationFrame(tick);

            cancelAnimationFrame(raf);

    }


    // ── 539-03 빈 값 거르기 — isBlank 가 줄의 필수 칸을 보고 걸러 내고, 걸러진 줄은 문 옆으로 빠지며
    //    통과한 줄만 시트로 간다. 통과율 = passed / total.
    //    기대 통과 수 = total × (1 − BLANK_P)² — 필수 칸이 두 개(name·qty) 이고 isBlank 가 OR 이라
    //    한 줄이 통과하려면 두 칸이 다 차 있어야 한다 (한 칸짜리 식 total × (1 − p) 는 기대를 과대 평가한다).
    //    변형 2: BLANK_P 0.1 → 0.45
    const BLANK_P = 0.1;      // 변형 2: 0.1 → 0.45
    const TOTAL_N = [10, 12, 14];
    const T_GATE0 = 200;      // 첫 변화는 150ms 뒤
    const T_PER = 110;        // 줄 하나가 문을 지나는 간격
    const T_PASS = 420;       // 줄 하나가 출발해 분기 직전(문까지, 전반) 과 분기 뒤(시트·바닥까지, 후반) 를 도는 총 시간
    const GATE_X = 200;
    const GATE_Y = 8;
    const GATE_H = 120;   // 기둥 높이 — 아래 두 줄 라벨(y 132·144) 과 겹치지 않는다
    const SH_X = 296;
    const SH_Y = 4;
    const SH_W = 180;
    const RH = 14;
    let blobs = [];           // { el, blank, pass }
    let sheetEl = null;
    let sheetLines = [];      // 시트 안 통과 줄 (통과 순서대로 켜진다)
    let pileP = null;         // 통과 더미
    let pileD = null;         // 버려진 더미
    let gateL = null;
    let gateR = null;
    let ovs03 = [];
    let stat03 = { passed: 0, dropped: 0, total: 0, seen: 0 };
    function isBlank(rec) {
        // rec = { name, qty, amt }. 필수 칸(name·qty) 중 하나라도 비어 있으면 true

    function easeOut3(k) { return 1 - Math.pow(1 - clamp(k, 0, 1), 3); }
    function build(i) {
        const seeds = [3.1, 5.9, 14.2];
        const total = TOTAL_N[i];
        stat03 = { passed: 0, dropped: 0, total: total, seen: 0 };
        blobs = [];
        sheetLines = [];
        // 시트 — 오른쪽 종이. 통과 수만큼 줄이 켜진다 (줄 요소는 미리 만들어 두고 data-on 으로 켠다)
        sheetEl = make('div', 'sheet', scWrap);
        put(sheetEl, SH_X, SH_Y, SH_W, total * RH);
        for (let r = 0; r < total; r += 1) {
            const ln = make('i', 'sline', sheetEl);
            put(ln, 0, r * RH, SH_W, RH);
            sheetLines.push(ln);
        }
        // 통계 더미 — 왼쪽 아래 두 개의 반투명 젤리 (통과·버림 따로 쌓인다)

        put(pileP, 12, 0, 60, 0);
        pileD = make('div', 'pile pile--drop', scWrap);
        put(pileD, 80, 0, 60, 0);

        gateR = make('i', 'gate gate--r', scWrap);

        put(gateR, GATE_X + 4, GATE_Y, 4, GATE_H);
        for (let r = 0; r < total; r += 1) {
            const rec = { name: 'row', qty: '1', amt: '100' };
            if (seedHash(r * 3 + 1, seeds[i]) < BLANK_P) {
                rec.name = '';
            }
            if (seedHash(r * 5 + 2, seeds[i]) < BLANK_P) {
                rec.qty = '';
            }
            const blank = isBlank(rec);
            const el = make('div', 'blob' + (blank ? ' blob--blank' : ''), scWrap);
            el.setAttribute('data-blank', blank ? '1' : '0');
            const nm = make('i', 'blob__name', el);
            nm.style.width = blank && rec.name === '' ? '0px' : f0(36 + seedHash(r * 7 + 3, seeds[i]) * 28) + 'px';
            const qt = make('i', 'blob__qty', el);
            qt.style.opacity = rec.qty === '' ? '0' : '1';
            put(el, 12, 0, 56, 20);
            blobs.push({ el: el, blank: blank });
        }

        const o1 = make('b', 'ov ovs', sceneEl);
        put(o1, 12, 4, 0, 0);
        const o2 = make('b', 'ov ovs', sceneEl);
        put(o2, 108, 4, 0, 0);
        const o3 = make('b', 'ov ovs', sceneEl);
        put(o3, 212, 4, 0, 0);

        // 필터 식 라벨 — 두 줄(isBlank / 조건). 문 기둥 아래(x 140~276), 통계 더미(x 12~136)·시트(x 296~) 와 안 겹친다
        const ov = make('b', 'ov ov--c', sceneEl);
        put(ov, 140, 132, 136, 0);
        ov.textContent = 'isBlank(r)';
        const ov2 = make('b', 'ov ov--c', sceneEl);
        put(ov2, 140, 144, 136, 0);
        ov2.textContent = 'r.name == "" || r.qty == ""';
        drawRows([spanOf(0, T_GATE0, 0), spanOf(T_GATE0, total * T_PER, 1), spanOf(T_GATE0 + T_PER, T_PASS, 2)], 2000);
        axis(2000);
        setReads(fill('空欄の除外(isBlank) — BLANK_P {a} · isBlank · dropped', f2(BLANK_P)),
            'only rows with every required cell reach the sheet');

    }
    function frame(t) {
        if (blobs.length === 0) {

        }
        const total = stat03.total;
        const rawEnd = T_GATE0 + total * T_PER + T_PASS;

                    sx = 1 - j;
                    op = 1 - m * 0.8;

                    y = 60 + wob + 64 * m;
                    rot = m * 18;

                    sy = 1 + j;
                    sx = 1 - j;
                    op = 1 - m * 0.6;
                }

                if (b.blank) {
                    dropped += 1;
                }
                else {
                    passed += 1;
                }
            }
            b.el.style.transform = 'translate(' + f1(x - 12) + 'px,' + f1(y) + 'px) rotate(' + f1(rot) + 'deg) scale(' + f2(sx) + ',' + f2(sy) + ')';
            b.el.style.opacity = f2(op);
        }
        // 시트 — 통과 순서대로 줄이 켜진다 (도착 뒤 살짝 튀었다 앉는다: scaleY 1.25→1 스프링). 시트 높이 = 통과 수 × RH
        let pi = 0;
        for (let r = 0; r < total; r += 1) {
            const b = blobs[r];
            if (b.blank) {
                continue;
            }
            const t1 = T_GATE0 + r * T_PER + T_PASS;
            const k1 = (tt - t1) / 220;
            const on = k1 >= 0 ? '1' : '0';
            const ln = sheetLines[pi];
            if (ln) {
                ln.setAttribute('data-on', on);
                const pop = k1 > 0 && k1 < 1 ? 1 + Math.sin(k1 * Math.PI) * 0.3 * (1 - k1) : 1;
                ln.style.transform = 'scaleY(' + f2(pop) + ')';
            }
            pi += 1;
        }
        sheetEl.style.height = f1(Math.max(passed, 1) * RH) + 'px';
        // 통계 더미 — 높이가 수에 비례 (통과 더미는 mint, 버림 더미는 rose). 수치 전파
        pileP.style.transform = 'translateY(' + f1(148 - passed * RH) + 'px)';
        pileP.style.height = f1(passed * RH) + 'px';
        pileD.style.transform = 'translateY(' + f1(148 - dropped * RH) + 'px)';
        pileD.style.height = f1(dropped * RH) + 'px';
        // 문 — 줄이 지나는 동안만 열린다
        const passing = tt > T_GATE0 && tt < T_GATE0 + total * T_PER + T_PASS;
        gateL.setAttribute('data-on', passing ? '1' : '0');
        gateR.setAttribute('data-on', passing ? '1' : '0');
        const chips = ['BLANK_P ' + f2(BLANK_P), 'isBlank ' + f0(dropped), 'dropped ' + f0(dropped)];
        if (ovs03.length === 3) {
            for (let c = 0; c < 3; c += 1) {
                ovs03[c].textContent = chips[c];
            }
        }
        return fill('通過{a} · 除外{b} · 通過率{c}% · 期待通過{d}',
            f0(passed), f0(dropped), f0(passed / total * 100), f1(total * Math.pow(1 - BLANK_P, 2)));
    }

    return run({ count: 3, build: build, frame: frame });
}
})()
