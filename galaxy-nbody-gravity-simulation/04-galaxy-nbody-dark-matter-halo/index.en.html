<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark-matter halo — n-body gravity — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gx is-demo" id="gxRoot">
  <p class="gx__hint">
    <span>Toggle an invisible mass halo on and outer stars keep their speed instead of falling off — why galaxy edges orbit too fast</span>
  </p>
  <div class="gx__field" id="gxField" role="application" aria-label="Dark-matter halo lab" tabindex="0">
    <canvas class="gx__cv" id="gxCv"></canvas>
    <button class="gx__halo" id="haloBtn" type="button" aria-pressed="false">
      <span id="haloOffLbl">halo off</span><span id="haloOnLbl" hidden>halo on</span>
    </button>
  </div>
  <div class="gx__bar">
    <span class="gx__meta">300 stars · grid mass approximation</span>
    <span class="gx__meta gx__meta--dim">canvas · grid approximation · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 암흑물질 헤일로(04) — 토글 한 번으로 은하 회전 곡선이 바뀌는 장면.
// ★ 근사 명시: 이 항목은 별 상호중력을 전 쌍 O(N²) 로 계산하지 않는다.
// 매 스텝 별 질량을 반경 빈(격자)에 누적해 구면 누적 질량 M(r) 을 만들고,
// 각 별은 자기 반경 안쪽 질량만큼 중심 방향으로 끌린다(등방 근사 — 방향 정보를 버린 격자 질량 근사).
// 정확한 전 쌍 계산은 01~03 참고. 근사로 남은 프레임 예산을 회전 곡선 그래프(우상단)에 쓴다.
// 헤일로 ON: 같은 격자에 보이지 않는 질량 프로파일(ρ ∝ 1/(r²+rc²))을 얹어 M(r) 을 불린다 —
// 바깥 별의 원궤도 속도가 유지된다(플랫 회전 곡선). OFF: 바깥이 결합을 못 이겨 팽창한다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var NSTARS = 300;    // 원반 별 수
  var HALOBOOST = 2.6; // 헤일로 질량 / 별 총질량 — 변형 "헤일로 질량"이 2.6→5.0으로
  // ────────────────────────────────────────────────────

  var root = document.getElementById('gxRoot');
  var field = document.getElementById('gxField');
  var cv = document.getElementById('gxCv');
  var haloBtn = document.getElementById('haloBtn');
  var haloOnLbl = document.getElementById('haloOnLbl');
  var haloOffLbl = document.getElementById('haloOffLbl');

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK  = tokRGB('--gx-ink');
  var C_GLOW = tokRGB('--gx-glow');
  var C_HOT  = tokRGB('--gx-hot');
  var C_TAIL = tokRGB('--gx-tail');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf = 0, t0 = -1;
  var W = 0, H = 0, dpr = 1;
  var chainCv, chainCtx;

  var N = 0, X = [], Y = [], VX = [], VY = [], MASS = [];

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = '100%'; cv.style.height = '100%';
    chainCv = document.createElement('canvas');
    chainCv.width = W * dpr; chainCv.height = H * dpr;
    chainCtx = chainCv.getContext('2d');
    chainCtx.scale(dpr, dpr);
  }

  // G·질량은 캔버스 픽셀 단위 시뮬레이션 값(물리 상수 아님 — 글에서 설명)
  var G = 60.0, SOFT2 = 90;
  var DT = 1 / 60;
  var HALO = false;   // 헤일로 상태 — 자동 루프가 3초마다 전환, 버튼 클릭 시 고정
  var autoHalo = true;

  // ── 격자 질량 근사 상태 ──
  var K = 28;                    // 반경 빈(격자) 수
  var RMAX = 10, RSTEP = 1;      // fit() 에서 원반 크기로 결정
  var binMass = [], cumMass = [], haloMass = [];

  function buildHalo() {
    // 헤일로 프로파일 — 고정 분포(별과 충돌하지 않는 차가운 암흑물질 가정).
    // ρ ∝ 1/(r²+rc²) 를 격자 빈에 적분해 담아 둔다(한 번만 계산)
    var rc = Math.min(W, H) * 0.15;
    var mstar = 0;
    for (var i = 0; i < N; i++) mstar += MASS[i];
    var raw = [];
    for (var k = 0; k < K; k++) {
      var r0 = rEdge(k), r1 = rEdge(k + 1);
      raw.push((Math.atan(r1 / rc) - Math.atan(r0 / rc)) * rc);  // ∫ r²/(r²+rc²) dr 근사 형태
    }
    var sum = 0;
    for (k = 0; k < K; k++) sum += raw[k];
    for (k = 0; k < K; k++) haloMass[k] = raw[k] / sum * mstar * HALOBOOST;
  }
  function rEdge(k) { return RMAX * Math.pow(k / K, 0.8); }   // 중심 촘촘 격자
  function binOf(r) {
    var k = Math.ceil(K * Math.pow(Math.min(r, RMAX) / RMAX, 1 / 0.8)) - 1;
    return k < 0 ? 0 : (k >= K ? K - 1 : k);
  }

  var AX = [], AY = [];
  function accel() {
    // 격자 재구성 — 별 질량을 빈에 누적하고 구면 누적 질량 CM[k] 를 만든다
    var i, k;
    for (k = 0; k < K; k++) binMass[k] = 0;
    var cx = W * 0.5, cy = H * 0.5;
    for (i = 0; i < N; i++) {
      var rr = Math.hypot(X[i] - cx, Y[i] - cy);
      binMass[binOf(rr)] += MASS[i];
    }
    var acc = 0;
    for (k = 0; k < K; k++) {
      var hm = HALO ? haloMass[k] : 0;      // 토글 — 헤일로 질량을 같은 격자에 얹는다
      binMass[k] += hm;
      acc += binMass[k];
      cumMass[k] = acc;
    }
    // 각 별의 가속도 — 안쪽 누적 질량 M(r) 만큼 중심 방향(등방 근사: 방향 정보 폐기)
    for (i = 0; i < N; i++) {
      var dx = cx - X[i], dy = cy - Y[i];
      var r = Math.hypot(dx, dy);
      var bk = binOf(r);
      var Mr = cumMass[bk] - binMass[bk] * 0.5;      // 빈 중간값 근사
      var d3 = Math.pow(r * r + SOFT2, 1.5);
      var f = G * Mr / d3;
      AX[i] = dx * f; AY[i] = dy * f;
    }
  }

  var aReady = false;
  function stepLeap() {
    // leapfrog — 격자 근사 가속도로도 절반 스텝 대칭으로 밀어 에너지를 보존한다
    if (!aReady) { accel(); aReady = true; }
    var h = DT * 0.5;
    for (var i = 0; i < N; i++) {
      VX[i] += AX[i] * h; VY[i] += AY[i] * h;
      X[i]  += VX[i] * DT; Y[i] += VY[i] * DT;
    }
    accel();
    for (var j = 0; j < N; j++) {
      VX[j] += AX[j] * h; VY[j] += AY[j] * h;
    }
  }

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function seed() {
    // 원반 — 속도는 헤일로 ON 프로파일 기준 원궤도(플랫에 가깝게)로 심는다.
    // OFF 구간에서는 결합이 못 미쳐 바깥 별이 팽창한다(토글 차이가 곧바로 보인다)
    X = []; Y = []; VX = []; VY = []; MASS = []; N = 0;
    var rnd = mulberry32(5);
    var cx = W * 0.5, cy = H * 0.5;
    var R = Math.min(W, H) * 0.40;
    RMAX = R * 1.6;
    for (var i = 0; i < NSTARS; i++) {
      var r = 0.10 * R + R * 0.90 * Math.sqrt(rnd());
      var a = rnd() * Math.PI * 2;
      MASS.push(0.5 + rnd() * 0.8);
      X.push(cx + Math.cos(a) * r);
      Y.push(cy + Math.sin(a) * r * 0.88);
      N++;
    }
    buildHalo();
    // 속도는 위치가 다 심어진 뒤 M(r) 격자로 계산(누적 질량 기준 원궤도)
    HALO = true; accel(); HALO = false;
    for (i = 0; i < N; i++) {
      var dx = X[i] - cx, dy = Y[i] - cy;
      var v = Math.sqrt(Math.max(AX[i] * -dx + AY[i] * -dy, 1e-6) * Math.hypot(dx, dy));
      var tl = Math.hypot(dx, dy) || 1;
      VX.push(-dy / tl * v + (rnd() - 0.5) * 1.2);
      VY.push( dx / tl * v * 0.88 + (rnd() - 0.5) * 1.2);
    }
    aReady = false;
  }

  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  function decay() {
    chainCtx.setTransform(1, 0, 0, 1, 0, 0);
    chainCtx.globalCompositeOperation = 'destination-out';
    chainCtx.fillStyle = 'rgba(0,0,0,0.020)';
    chainCtx.fillRect(0, 0, W * dpr, H * dpr);
    chainCtx.globalCompositeOperation = 'source-over';
    chainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  var prev = null;
  function stamp() {
    if (prev) {
      for (var i = 0; i < N; i++) {
        var r = Math.hypot(X[i] - W * 0.5, Y[i] - H * 0.5);
        chainCtx.strokeStyle = rgba(r < Math.min(W, H) * 0.16 ? C_HOT : C_GLOW, 0.24);
        chainCtx.lineWidth = 1.2;
        chainCtx.beginPath();
        chainCtx.moveTo(prev[0][i], prev[1][i]);
        chainCtx.lineTo(X[i], Y[i]);
        chainCtx.stroke();
      }
    }
    if (!prev) { prev = [X.slice(), Y.slice()]; }
    else { prev[0] = X.slice(); prev[1] = Y.slice(); }
  }

  function draw() {
    var ctx = cv.getContext('2d');   // CanvasRenderingContext2D — 아래 그리기 전부 이 문맥
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = rgb(C_INK);
    ctx.fillRect(0, 0, W, H);
    var rnd = mulberry32(6);
    ctx.fillStyle = rgba(C_GLOW, 0.4);
    for (var k = 0; k < 34; k++) {
      ctx.globalAlpha = 0.10 + rnd() * 0.20;
      ctx.beginPath(); ctx.arc(rnd() * W, rnd() * H, rnd() * 0.7 + 0.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.drawImage(chainCv, 0, 0, W, H);
    // 별 — 코어는 파스텔 앰버, 바깥은 파스텔 페리윙클. 글로우 두 겹
    var cx = W * 0.5, cy = H * 0.5, R = Math.min(W, H);
    for (var i = 0; i < N; i++) {
      var r = Math.hypot(X[i] - cx, Y[i] - cy);
      var col = r < R * 0.15 ? C_HOT : C_GLOW;
      ctx.fillStyle = rgba(col, 0.12);
      ctx.beginPath(); ctx.arc(X[i], Y[i], 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = rgba(col, 0.6 + 0.35 * (1 - r / (R * 0.42)));
      ctx.beginPath(); ctx.arc(X[i], Y[i], 1.3, 0, Math.PI * 2); ctx.fill();
    }
    // halo on — 보이지 않는 질량의 반경 스케일을 옅은 링으로만 암시한다
    if (HALO) {
      ctx.strokeStyle = rgba(C_TAIL, 0.30);
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 5]);
      ctx.beginPath(); ctx.arc(cx, cy, R * 0.52, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    // 회전 곡선 인셋 — 빈별 평균 접선속도 실측. OFF: 하강 / ON: 플랫
    var gx0 = W - 104, gy0 = 12, gw = 88, gh = 62;
    ctx.fillStyle = rgba(C_INK, 0.78);
    ctx.fillRect(gx0, gy0, gw, gh);
    ctx.strokeStyle = rgba(C_GLOW, 0.35);
    ctx.lineWidth = 1;
    ctx.strokeRect(gx0 + 0.5, gy0 + 0.5, gw, gh);
    var vsum = [], vcnt = [];
    for (k = 0; k < K; k++) { vsum[k] = 0; vcnt[k] = 0; }
    var vmax = 1;
    for (i = 0; i < N; i++) {
      var dx = X[i] - cx, dy = Y[i] - cy;
      var vt = Math.abs(-dy * VX[i] + dx * VY[i]) / Math.max(Math.hypot(dx, dy), 1);
      var bk = binOf(Math.hypot(dx, dy));
      vsum[bk] += vt; vcnt[bk]++;
      if (vt > vmax) vmax = vt;
    }
    ctx.strokeStyle = rgba(HALO ? C_TAIL : C_GLOW, 0.95);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    var started = false;
    for (k = 2; k < K; k++) {
      if (!vcnt[k]) continue;
      var vx = gx0 + 6 + (k / K) * (gw - 12);
      var vy = gy0 + gh - 8 - (vsum[k] / vcnt[k] / vmax) * (gh - 18);
      if (!started) { ctx.moveTo(vx, vy); started = true; }
      ctx.lineTo(vx, vy);
    }
    ctx.stroke();
    ctx.fillStyle = rgba(C_HOT, 0.8);
    ctx.font = '9px sans-serif';
    ctx.fillText(HALO ? 'flat' : 'kepler', gx0 + 6, gy0 + 11);
  }

  function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

  function setHalo(on) {
    HALO = on;
    haloBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    haloOnLbl.hidden = !on;
    haloOffLbl.hidden = on;
  }
  haloBtn.addEventListener('click', function () { autoHalo = false; setHalo(!HALO); });
  field.addEventListener('click', function (e) {
    if (e.target === haloBtn || haloBtn.contains(e.target)) return;
    autoHalo = false; setHalo(!HALO);
  });

  var simSteps = 0;
  function frame(now) {
    if (t0 < 0) t0 = now;
    var loop = ((now - t0) / 1000) % 6.0;        // 6초 루프 — 3초 꺼짐 / 3초 켜짐 자동 전환
    if (autoHalo) setHalo(loop < 3.0);
    var target = Math.floor(loop / DT);
    while (simSteps < target) { stepLeap(); simSteps++; stamp(); }
    if (target < simSteps - 3) { seed(); simSteps = 0; prev = null; chainCtx.clearRect(0, 0, W, H); }
    decay();
    draw();
    raf = requestAnimationFrame(frame);
  }

  function stillFrame() {
    // reduce — 헤일로 ON 장면까지 적분한 뒤 한 장 고정
    setHalo(true);
    for (var s = 0; s < 240; s++) { stepLeap(); stamp(); }
    draw();
  }

  window.addEventListener('resize', function () {
    fit(); seed(); simSteps = 0; prev = null; aReady = false;
    if (reduce) stillFrame();
  });

  fit();
  seed();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
