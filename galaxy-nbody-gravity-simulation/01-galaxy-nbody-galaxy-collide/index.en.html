<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two galaxies collide — n-body gravity — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gx is-demo" id="gxRoot">
  <p class="gx__hint">
    <span>Sum Newtonian gravity on every star each frame: the moment two disks shear, tidal tails of flung stars form on their own</span>
  </p>
  <div class="gx__field" id="gxField" role="application" aria-label="Two-galaxy collision lab" tabindex="0">
    <canvas class="gx__cv" id="gxCv"></canvas>
  </div>
  <div class="gx__bar">
    <span class="gx__meta">340 stars · O(N²) all-pair gravity</span>
    <span class="gx__meta gx__meta--dim">canvas · Newton gravity · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 두 은하 충돌(01) — n체 중력의 기본 장면.
// 별마다 (x, y, vx, vy) 를 두고 매 프레임 모든 쌍의 중력 가속도를 더한다(전 쌍 O(N²) —
// 근사 아님. N=340 이라 57,630 쌍/프레임, 데모 크기에서 60fps 가 유지된다).
// 적분은 semi-implicit Euler(속도 갱신 뒤 위치 갱신) — 누적 오차로 궤도가 서서히 부풀지만
// 2초 루프 안에서는 안정하다. (02 의 leapfrog 이 에너지를 더 오래 보존한다.)
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var NSTARS = 340;   // 두 은하 합계 별 수 — 변형 "별 개수"가 340→120으로
  var SKIP = 0.60;    // 스치는 거리(원반 반지름의 배) — 변형 "근접 시 천체항"이 0.6→0.25로
  // ────────────────────────────────────────────────────

  var root = document.getElementById('gxRoot');
  var field = document.getElementById('gxField');
  var cv = document.getElementById('gxCv');

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK  = tokRGB('--gx-ink');
  var C_GLOW = tokRGB('--gx-glow');
  var C_HOT  = tokRGB('--gx-hot');
  var C_TAIL = tokRGB('--gx-tail');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf = 0, t0 = -1;
  var W = 0, H = 0, dpr = 1;
  var chainCv, chainCtx;   // 궤적 잔상용 투명 오프스크린 캔버스

  // 별 상태 — Float64Array 가 아니라 짝수 인덱스 x/y·홀수 vx/vy 쌍 배열(가독성 우선)
  var N = 0, X = [], Y = [], VX = [], VY = [];

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = '100%'; cv.style.height = '100%';
    chainCv = document.createElement('canvas');
    chainCv.width = W * dpr; chainCv.height = H * dpr;
    chainCtx = chainCv.getContext('2d');
    chainCtx.scale(dpr, dpr);
  }

  function seed() {
    // 두 원반 은하를 좌우 대각으로 놓고 서로를 향해 살짝 비스듬히 움직이게 한다.
    // 원반 별: 반지름 r 에 비례하는 원궤도 속도 + 작은 랜덤 흔들림(시드 고정 — 결정론 렌더).
    X = []; Y = []; VX = []; VY = []; N = 0;
    var rnd = mulberry32(7);
    var half = NSTARS >> 1;
    var R = Math.min(W, H) * 0.40;             // 원반 반지름 — 화면 절반을 쓴다(누적면적)
    var sc = R;                                // 속도 스케일 — 원반 크기에 연동
    placeDisk(W * 0.30, H * 0.34, R, half, 0, 0.62, -0.42, 1.0, rnd, sc);      // 은하 A — 오른쪽 위로
    placeDisk(W * 0.70, H * 0.66, R, NSTARS - half, Math.PI, -0.62, 0.42, 0.85, rnd, sc); // 은하 B — 왼쪽 아래로
  }

  // cx,cy 중심 원반. dvx,dvy 은하 자신의 이동 속도(원반 반지름 R 배율). dir 공전 방향(+1 시계반대).
  function placeDisk(cx, cy, R, count, phase, dvx, dvy, dir, rnd, sc) {
    // 중심 질량 M — 원반 가장자리(r=R)에서 원궤도 속도 v=sqrt(M/R) 가 나오게 잡는다
    var M = R * R * 0.90;
    for (var i = 0; i < count; i++) {
      var r = R * Math.sqrt(rnd());           // 면밀도 균일 — r² 균등
      var a = phase + (i / count) * Math.PI * 2 + rnd() * 0.5;
      var v = Math.sqrt(M / Math.max(r, 6)) * dir;
      X.push(cx + Math.cos(a) * r);
      Y.push(cy + Math.sin(a) * r);
      VX.push(dvx * sc * 0.30 + -Math.sin(a) * v + (rnd() - 0.5) * 2);
      VY.push(dvy * sc * 0.30 +  Math.cos(a) * v + (rnd() - 0.5) * 2);
      N++;
    }
    // 은하 중심 핵 별 1개(질량 큰 것은 크기로 표현 — 배열은 동일, 질량은 상수라 별도 관리 안 함)
  }

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // G·질량은 단위를 캔버스 픽셀에 맞춘 시뮬레이션 값(물리 상수 아님 — 글에서 설명)
  var G = 140.0, SOFT2 = 16;                  // softening ε²=16 — 근접 발산 방지(뉴턴 중력의 숫자 안정 장치)
  var DT = 1 / 60;

  function step() {
    // 전 쌍 중력 — a_i = Σ_j G·(x_j - x_i)/(|d|²+ε²)^1.5. 대칭이라 쌍당 한 번 계산해 양쪽에 반영
    var AX = new Array(N), AY = new Array(N);
    for (var i = 0; i < N; i++) { AX[i] = 0; AY[i] = 0; }
    for (var i = 0; i < N; i++) {
      for (var j = i + 1; j < N; j++) {
        var dx = X[j] - X[i], dy = Y[j] - Y[i];
        var d2 = dx * dx + dy * dy + SOFT2;
        var inv = 1 / Math.sqrt(d2);
        var f = G * inv * inv * inv;          // f = G / d³ — dx·f 가 가속도 성분
        AX[i] += dx * f; AY[i] += dy * f;
        AX[j] -= dx * f; AY[j] -= dy * f;
      }
    }
    for (var i = 0; i < N; i++) {
      VX[i] += AX[i] * DT; VY[i] += AY[i] * DT;
      X[i] += VX[i] * DT;  Y[i] += VY[i] * DT;
    }
  }

  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  function decay() {
    // 잔상 감쇠 — 궤적 캔버스를 매 프레임 조금씩 지운다(조석 꼬리가 궤도 누적으로 보이게)
    chainCtx.setTransform(1, 0, 0, 1, 0, 0);
    chainCtx.globalCompositeOperation = 'destination-out';
    chainCtx.fillStyle = 'rgba(0,0,0,0.016)';
    chainCtx.fillRect(0, 0, W * dpr, H * dpr);
    chainCtx.globalCompositeOperation = 'source-over';
    chainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  var prev = null;
  function stamp() {
    // 별을 잔상 캔버스에 1px 점으로 찍는다 — 이전 프레임과 이어 그리면 궤도 선이 된다
    if (prev) {
      for (var i = 0; i < N; i++) {
        chainCtx.strokeStyle = rgba(i < (N >> 1) ? C_GLOW : C_TAIL, 0.32);
        chainCtx.lineWidth = 1.9;
        chainCtx.beginPath();
        chainCtx.moveTo(prev[0][i], prev[1][i]);
        chainCtx.lineTo(X[i], Y[i]);
        chainCtx.stroke();
      }
    }
    if (!prev) { prev = [X.slice(), Y.slice()]; }
    else { prev[0] = X.slice(); prev[1] = Y.slice(); }
  }

  function draw() {
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 배경 — 관측창 바닥색으로 매 프레임 지운다(별이 아니라 잔상 캔버스가 궤적을 기억)
    ctx.fillStyle = 'rgb(' + C_INK[0] + ',' + C_INK[1] + ',' + C_INK[2] + ')';
    ctx.fillRect(0, 0, W, H);
    // 배경 별밭(정적) — 깊이감. 시드 고정이라 렌더마다 같다
    var rnd = mulberry32(99);
    ctx.fillStyle = rgba(C_GLOW, 0.35);
    for (var k = 0; k < 40; k++) {
      var bx = rnd() * W, by = rnd() * H, br = rnd() * 0.8 + 0.3;
      ctx.globalAlpha = 0.12 + rnd() * 0.22;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.drawImage(chainCv, 0, 0, W, H);
    // 별 — 은하 A 파스텔 페리윙클 · 은하 B 파스텔 핑크. 코어 근처 별은 밝게
    for (var i = 0; i < N; i++) {
      var col = i < (N >> 1) ? C_GLOW : C_TAIL;
      var d = Math.hypot(X[i] - W * 0.5, Y[i] - H * 0.5);
      var near = Math.max(0, 1 - d / (Math.min(W, H) * 0.72));
      // 글로우 원(반지름 3.8) + 코어 점(반지름 1.7) 두 겹 — 앰비언트 글로우로 면적 확보
      ctx.fillStyle = rgba(col, 0.10 + near * 0.10);
      ctx.beginPath();
      ctx.arc(X[i], Y[i], 3.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = rgba(col, 0.55 + near * 0.45);
      ctx.beginPath();
      ctx.arc(X[i], Y[i], 1.7 + near * 1.0, 0, Math.PI * 2);
      ctx.fill();
    }
    // 은하 B 코어 표식 — 앰버 점(중심 별이 아니라 코어 위치 추적 마커)
    ctx.fillStyle = rgba(C_HOT, 0.9);
    ctx.beginPath(); ctx.arc(X[N >> 1], Y[N >> 1], 2.2, 0, Math.PI * 2); ctx.fill();
  }

  var simSteps = 0;
  function frame(now) {
    if (t0 < 0) t0 = now;
    // 2초 루프 — 설정 초(2s)의 약수 주기로 시뮬을 되감는다(결정론 렌더·무한 반복)
    var loop = ((now - t0) / 1000) % 2.0;
    var target = Math.floor(loop / DT);
    while (simSteps < target) { step(); simSteps++; stamp(); }
    if (target < simSteps - 3) { seed(); simSteps = 0; prev = null; chainCtx.clearRect(0, 0, W, H); }
    decay();
    draw();
    raf = requestAnimationFrame(frame);
  }

  function stillFrame() {
    // reduce — 루프 중반(꼬리가 가장 그럴듯한) 장면까지 시뮬레이션한 뒤 한 장을 고정한다
    for (var s = 0; s < 150; s++) { step(); stamp(); }
    draw();
  }

  window.addEventListener('resize', function () {
    fit(); seed(); simSteps = 0; prev = null;
    if (reduce) stillFrame();
  });

  fit();
  seed();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
