<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나선 팔 형성 — 은하 n체 시뮬레이션 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gx is-demo" id="gxRoot">
  <p class="gx__hint">
    <span>안쪽이 빠르게 도는 차등회전이 초기 밀도 요동을 늘려, 정지 원반이 적분만으로 나선팔을 자라게 합니다</span>
  </p>
  <div class="gx__field" id="gxField" role="application" aria-label="나선 팔 형성 실험판" tabindex="0">
    <canvas class="gx__cv" id="gxCv"></canvas>
  </div>
  <div class="gx__bar">
    <span class="gx__meta">별 320개 · 레인포드 적분</span>
    <span class="gx__meta gx__meta--dim">canvas · leapfrog · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 나선 팔 형성(02) — 정지 원반이 차등회전으로 팔을 자라게 하는 장면.
// 01 과 같은 전 쌍 O(N²) 뉴턴 중력이되 적분기를 leapfrog(개구리뛰기)로 바꾼다:
// 가속도를 절반 스텝 앞뒤로 대칭 계산해 속도·위치를 번갈아 밀면 에너지가 오래 보존되어
// 원반이 몇 바퀴을 돌아도 인위적으로 부풀지 않는다(변형 "적분기"의 본체).
// 여기에 중심 질량(그리지 않는 핵)을 크게 두고 별 상호 중력을 더하면
// 안쪽이 빠르게 도는 차등회전이 초기 밀도 요동을 감아 올려 나선 팔이 저절로 선명해진다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var NSTARS = 320;   // 원반 별 수
  var METHOD = 'leapfrog'; // 'euler' 로 바꾸면 변형 "적분기: 오일러"가 된다
  // ────────────────────────────────────────────────────

  var root = document.getElementById('gxRoot');
  var field = document.getElementById('gxField');
  var cv = document.getElementById('gxCv');

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK  = tokRGB('--gx-ink');
  var C_GLOW = tokRGB('--gx-glow');
  var C_HOT  = tokRGB('--gx-hot');
  var C_TAIL = tokRGB('--gx-tail');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf = 0, t0 = -1;
  var W = 0, H = 0, dpr = 1;
  var chainCv, chainCtx;

  var N = 0, X = [], Y = [], VX = [], VY = [], MASS = [];

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = '100%'; cv.style.height = '100%';
    chainCv = document.createElement('canvas');
    chainCv.width = W * dpr; chainCv.height = H * dpr;
    chainCtx = chainCv.getContext('2d');
    chainCtx.scale(dpr, dpr);
  }

  // G·질량은 캔버스 픽셀 단위의 시뮬레이션 값(물리 상수 아님 — 글에서 설명)
  var G = 60.0, SOFT2 = 36;
  var DT = 1 / 60;
  var MHALO = 6200;   // 중심 질량(핵+헤일로 합) — 그리지 않는다. 별 상호중력과 함께 가속도에 더해진다

  // 가속도 합산 — 중심 질량 인력 + 별끼리의 전 쌍 O(N²). AX/AY 는 재사용 버퍼(가비지 최소화)
  var AX = [], AY = [];
  function accel() {
    var i, j, dx, dy, d2, inv, f;
    for (i = 0; i < N; i++) { AX[i] = 0; AY[i] = 0; }
    // 중심 질량 — 원점이 아니라 원반 중심을 향한다(원반이 화면 중앙에 있으므로 W/2, H/2)
    var cx = W * 0.5, cy = H * 0.5;
    for (i = 0; i < N; i++) {
      dx = cx - X[i]; dy = cy - Y[i];
      d2 = dx * dx + dy * dy + SOFT2;
      inv = 1 / Math.sqrt(d2);
      f = G * MHALO * inv * inv * inv;
      AX[i] += dx * f; AY[i] += dy * f;
    }
    // 별 상호 중력 — 대칭이라 쌍당 한 번 계산해 양쪽에 반영
    for (i = 0; i < N; i++) {
      for (j = i + 1; j < N; j++) {
        dx = X[j] - X[i]; dy = Y[j] - Y[i];
        d2 = dx * dx + dy * dy + SOFT2;
        inv = 1 / Math.sqrt(d2);
        f = G * MASS[i] * MASS[j] * inv * inv * inv;
        AX[i] += dx * f; AY[i] += dy * f;
        AX[j] -= dx * f; AY[j] -= dy * f;
      }
    }
  }

  function stepEuler() {
    // semi-implicit Euler(변형 비교용 — 기본은 leapfrog)
    accel();
    for (var i = 0; i < N; i++) {
      VX[i] += AX[i] * DT; VY[i] += AY[i] * DT;
      X[i] += VX[i] * DT;  Y[i] += VY[i] * DT;
    }
  }

  var aReady = false;
  function stepLeap() {
    // leapfrog(속도_verlet) — a(t) 를 재사용해 절반씩 대칭으로 밀어 에너지를 보존한다
    if (!aReady) { accel(); aReady = true; }
    var h = DT * 0.5;
    for (var i = 0; i < N; i++) {
      VX[i] += AX[i] * h; VY[i] += AY[i] * h;   // v(t+h/2) = v(t) + a(t)·h/2
      X[i]  += VX[i] * DT; Y[i] += VY[i] * DT;  // x(t+h)   = x(t) + v(t+h/2)·h
    }
    accel();                                     // a(t+h)
    for (var i = 0; i < N; i++) {
      VX[i] += AX[i] * h; VY[i] += AY[i] * h;   // v(t+h) = v(t+h/2) + a(t+h)·h/2
    }
  }

  function step() { if (METHOD === 'leapfrog') stepLeap(); else stepEuler(); }

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function seed() {
    // 정지 원반 — 반지름별 원궤도 속도(안쪽이 빠르다 = 차등회전)에 초기 밀도 요동(이빨)을 심는다.
    // 요동은 각도 방향 사인파 2개 — 시간이 흐르면 차등회전이 이를 감아 나선으로 만든다.
    X = []; Y = []; VX = []; VY = []; MASS = []; N = 0;
    var rnd = mulberry32(11);
    var cx = W * 0.5, cy = H * 0.5;
    var R = Math.min(W, H) * 0.44;
    for (var i = 0; i < NSTARS; i++) {
      var far = rnd() < 0.50;                             // 바깥 별 — 원반 밖 넓은 궤도(외곽 궤적 누적)
      var r = far
        ? R * (0.42 + 2.00 * rnd())
        : 0.12 * R + R * 0.82 * Math.sqrt(rnd());          // 코어 밀집 + 바깥 얇게
      var a = rnd() * Math.PI * 2 + 0.14 * Math.sin(r * 0.16);  // 각도에 반지름 결합 사인 요동
      var v = Math.sqrt(G * MHALO / Math.max(r, 8)) * (far ? 0.82 : 1.0);  // 원궤도 속도 — r 이 작을수록 크다
      X.push(cx + Math.cos(a) * r);
      Y.push(cy + Math.sin(a) * r * 0.90);                // 살짝 눌러 타원 원반(시각적 깊이)
      VX.push(-Math.sin(a) * v + (rnd() - 0.5) * 1.5);
      VY.push( Math.cos(a) * v * 0.90 + (rnd() - 0.5) * 1.5);
      MASS.push(0.5 + rnd() * 0.8);
      N++;
    }
  }

  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  function decay() {
    chainCtx.setTransform(1, 0, 0, 1, 0, 0);
    chainCtx.globalCompositeOperation = 'destination-out';
    chainCtx.fillStyle = 'rgba(0,0,0,0.015)';
    chainCtx.fillRect(0, 0, W * dpr, H * dpr);
    chainCtx.globalCompositeOperation = 'source-over';
    chainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  var prev = null;
  function stamp() {
    // 잔상 — 이전 프레임과 이어 그리면 궤도 누적으로 팔이 선명해진다
    if (prev) {
      for (var i = 0; i < N; i++) {
        var r = Math.hypot(X[i] - W * 0.5, Y[i] - H * 0.5);
        var col = r < Math.min(W, H) * 0.18 ? C_HOT : C_GLOW;
        chainCtx.strokeStyle = rgba(col, 0.28);
        chainCtx.lineWidth = 1.8;
        chainCtx.beginPath();
        chainCtx.moveTo(prev[0][i], prev[1][i]);
        chainCtx.lineTo(X[i], Y[i]);
        chainCtx.stroke();
      }
    }
    if (!prev) { prev = [X.slice(), Y.slice()]; }
    else { prev[0] = X.slice(); prev[1] = Y.slice(); }
  }

  function draw() {
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 배경 별밭(정적·시드 고정) — 깊이감
    ctx.fillStyle = rgb(C_INK);
    ctx.fillRect(0, 0, W, H);
    var rnd = mulberry32(21);
    ctx.fillStyle = rgba(C_GLOW, 0.35);
    for (var k = 0; k < 40; k++) {
      var bx = rnd() * W, by = rnd() * H;
      ctx.globalAlpha = 0.10 + rnd() * 0.20;
      ctx.fillRect(bx, by, 1.2, 1.2);                 // fillRect 점 — 원반이라 arc 점보다 빠르다
    }
    ctx.globalAlpha = 1;
    ctx.drawImage(chainCv, 0, 0, W, H);
    // 별 — 바깥 별은 파스텔 페리윙클 사각 점(밀도가 눈에 잘 들어온다), 코어는 파스텔 앰버
    var R = Math.min(W, H);
    for (var i = 0; i < N; i++) {
      var r = Math.hypot(X[i] - W * 0.5, Y[i] - H * 0.5);
      var col = r < R * 0.16 ? C_HOT : C_GLOW;
      var sz = r < R * 0.16 ? 3.0 : 2.6;
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = rgba(col, 0.16);                // 글로우 겉층
      ctx.fillRect(X[i] - sz, Y[i] - sz, sz * 2, sz * 2);
      ctx.fillStyle = rgba(col, 0.95);                // 코어
      ctx.fillRect(X[i] - sz * 0.40, Y[i] - sz * 0.40, sz * 0.80, sz * 0.80);
    }
    ctx.globalAlpha = 1;
    // 중심 질량 위치 표식 — 그리지 않는 핵의 위치(원반 중심)를 앰버 점으로만 알린다
    ctx.fillStyle = rgba(C_HOT, 0.9);
    ctx.fillRect(W * 0.5 - 1.8, H * 0.5 - 1.8, 3.6, 3.6);
  }

  function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

  var simSteps = 0;
  function frame(now) {
    if (t0 < 0) t0 = now;
    var loop = ((now - t0) / 1000) % 3.0;             // 3초 루프 — 팔이 자라는 초반을 반복 보여준다
    var target = Math.floor(loop / DT);
    while (simSteps < target) { step(); simSteps++; stamp(); }
    if (target < simSteps - 3) { seed(); simSteps = 0; prev = null; chainCtx.clearRect(0, 0, W, H); }
    decay();
    draw();
    raf = requestAnimationFrame(frame);
  }

  function stillFrame() {
    // reduce — 팔이 어느 정도 자란 장면까지 적분한 뒤 한 장을 고정한다
    for (var s = 0; s < 240; s++) { step(); stamp(); }
    draw();
  }

  window.addEventListener('resize', function () {
    fit(); seed(); simSteps = 0; prev = null; aReady = false;
    if (reduce) stillFrame();
  });

  fit();
  seed();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
