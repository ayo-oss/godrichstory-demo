<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merger remnant — n-body gravity — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gx is-demo" id="gxRoot">
  <p class="gx__hint">
    <span>Let time run past the collision: arms scatter, orbit directions mix, a smooth ellipsoid remains</span>
  </p>
  <div class="gx__field" id="gxField" role="application" aria-label="Merger remnant lab" tabindex="0">
    <canvas class="gx__cv" id="gxCv"></canvas>
  </div>
  <div class="gx__bar">
    <span class="gx__meta">starts at second passage · 320 stars</span>
    <span class="gx__meta gx__meta--dim">canvas · virial mix · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 합체 잔해 타원 은하(05) — 첫 스침을 지난 시점부터 시간을 흐르게 두는 장면.
// 시작은 두 은하가 이미 한 번 스쳐 꼬리가 늘어선 상태(두 번째 스침 직전):
// 시드에서 첫 스침을 미리 적분해 만든다(두 원반을 가깝게 놓고 몇백 스텝 = 첫 스침).
// 이후 화면의 시간이 흐르면 궤도 방향이 뒤섞이고(virial 화) 나선팔 구조가 흍어져
// 특징 없는 타원체가 남는다 — 관측되는 타원 은하가 합체 잔해라는 설명의 재현.
// 계산은 01 과 같은 전 쌍 O(N²) 뉴턴 중력 + leapfrog 적분(근사 아님).
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var NSTARS = 320;   // 두 은하 합계 별 수
  var PREPASS = 420;  // 시작 전 미리 흘려 둘 스텝(첫 스침+꼬리 형성) — 변형 "시작 시점"
  // ────────────────────────────────────────────────────

  var root = document.getElementById('gxRoot');
  var field = document.getElementById('gxField');
  var cv = document.getElementById('gxCv');

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK  = tokRGB('--gx-ink');
  var C_GLOW = tokRGB('--gx-glow');
  var C_HOT  = tokRGB('--gx-hot');
  var C_TAIL = tokRGB('--gx-tail');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf = 0, t0 = -1;
  var W = 0, H = 0, dpr = 1;
  var chainCv, chainCtx;

  var N = 0, X = [], Y = [], VX = [], VY = [];

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = '100%'; cv100pct();
    chainCv = document.createElement('canvas');
    chainCv.width = W * dpr; chainCv.height = H * dpr;
    chainCtx = chainCv.getContext('2d');
    chainCtx.scale(dpr, dpr);
  }
  function cv100pct() { cv.style.width = '100%'; cv.style.height = '100%'; }

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // G·질량은 캔버스 픽셀 단위 시뮬레이션 값(물리 상수 아님 — 글에서 설명)
  var G = 140.0, SOFT2 = 16;
  var DT = 1 / 60;

  var AX = [], AY = [];
  function accel() {
    // 전 쌍 O(N²) 뉴턴 중력 — a_i = Σ G·(x_j - x_i)/(|d|²+ε²)^1.5 (근사 아님)
    var i, j, dx, dy, d2, inv, f;
    for (i = 0; i < N; i++) { AX[i] = 0; AY[i] = 0; }
    for (i = 0; i < N; i++) {
      for (j = i + 1; j < N; j++) {
        dx = X[j] - X[i]; dy = Y[j] - Y[i];
        d2 = dx * dx + dy * dy + SOFT2;
        inv = 1 / Math.sqrt(d2);
        f = G * inv * inv * inv;
        AX[i] += dx * f; AY[i] += dy * f;
        AX[j] -= dx * f; AY[j] -= dy * f;
      }
    }
  }

  var aReady = false;
  function stepLeap() {
    // leapfrog — 절반 스텝 대칭 킥으로 에너지를 오래 보존(장면이 몇 초 흐러도 부풀지 않는다)
    if (!aReady) { accel(); aReady = true; }
    var h = DT * 0.5;
    for (var i = 0; i < N; i++) {
      VX[i] += AX[i] * h; VY[i] += AY[i] * h;
      X[i]  += VX[i] * DT; Y[i] += VY[i] * DT;
    }
    accel();
    for (var j = 0; j < N; j++) {
      VX[j] += AX[j] * h; VY[j] += AY[j] * h;
    }
  }

  function placeDisk(cx, cy, R, count, phase, dvx, dvy, dir, rnd, sc) {
    // 원반 — r² 균등 면밀도, 원궤도 속도(01 과 동일 결정론 시더)
    var M = R * R * 0.90;
    for (var i = 0; i < count; i++) {
      var r = R * Math.sqrt(rnd());
      var a = phase + (i / count) * Math.PI * 2 + rnd() * 0.5;
      var v = Math.sqrt(M / Math.max(r, 6)) * dir;
      X.push(cx + Math.cos(a) * r);
      Y.push(cy + Math.sin(a) * r);
      VX.push(dvx * sc * 0.30 + -Math.sin(a) * v + (rnd() - 0.5) * 2);
      VY.push(dvy * sc * 0.30 +  Math.cos(a) * v + (rnd() - 0.5) * 2);
      N++;
    }
  }

  function seed() {
    // 두 원반을 첫 스침 직전 거리(가깝게)에 놓고 PREPASS 스텝 미리 적분 —
    // 화면의 t=0 은 이미 한 번 스치고 꼬리가 늘어선 두 번째 스침 직전 상태다
    X = []; Y = []; VX = []; VY = []; N = 0; aReady = false;
    var rnd = mulberry32(9);
    var half = NSTARS >> 1;
    var R = Math.min(W, H) * 0.44;
    var sc = R;
    placeDisk(W * 0.36, H * 0.34, R, half, 0, 0.62, -0.42, 1.0, rnd, sc);
    placeDisk(W * 0.64, H * 0.66, R, NSTARS - half, Math.PI, -0.62, 0.42, 0.85, rnd, sc);
    for (var s = 0; s < PREPASS; s++) stepLeap();
  }

  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  function decay() {
    chainCtx.setTransform(1, 0, 0, 1, 0, 0);
    chainCtx.globalCompositeOperation = 'destination-out';
    chainCtx.fillStyle = 'rgba(0,0,0,0.012)';
    chainCtx.fillRect(0, 0, W * dpr, H * dpr);
    chainCtx.globalCompositeOperation = 'source-over';
    chainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  var prev = null;
  function stamp() {
    if (prev) {
      for (var i = 0; i < N; i++) {
        chainCtx.strokeStyle = rgba(i < (N >> 1) ? C_GLOW : C_TAIL, 0.30);
        chainCtx.lineWidth = 1.9;
        chainCtx.beginPath();
        chainCtx.moveTo(prev[0][i], prev[1][i]);
        chainCtx.lineTo(X[i], Y[i]);
        chainCtx.stroke();
      }
    }
    if (!prev) { prev = [X.slice(), Y.slice()]; }
    else { prev[0] = X.slice(); prev[1] = Y.slice(); }
  }

  function draw() {
    var ctx = cv.getContext('2d');   // CanvasRenderingContext2D — 이 데모의 모든 그리기 문맥
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = rgb(C_INK);
    ctx.fillRect(0, 0, W, H);
    var rnd = mulberry32(10);
    ctx.fillStyle = rgba(C_GLOW, 0.35);
    for (var k = 0; k < 40; k++) {
      var bx = rnd() * W, by = rnd() * H, br = rnd() * 0.8 + 0.3;
      ctx.globalAlpha = 0.12 + rnd() * 0.22;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.drawImage(chainCv, 0, 0, W, H);
    // 별 — 타원체 잔해 중심은 앰버 코어. ellipse 글로우를 겹쳐 은하 전체 윤곽을 암시한다
    var cx = 0, cy = 0;
    for (i = 0; i < N; i++) { cx += X[i]; cy += Y[i]; }
    cx /= N; cy /= N;
    var sx = 0, sy = 0;
    for (i = 0; i < N; i++) { sx += (X[i] - cx) * (X[i] - cx); sy += (Y[i] - cy) * (Y[i] - cy); }
    var rx = Math.sqrt(sx / N) * 1.9, ry = Math.sqrt(sy / N) * 1.9;
    ctx.fillStyle = rgba(C_HOT, 0.055);
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(C_HOT, 0.05);
    ctx.beginPath(); ctx.ellipse(cx, cy, rx * 0.72, ry * 0.72, 0, 0, Math.PI * 2); ctx.fill();
    // 별 점 — 은하 A 페리윙클 · 은하 B 핑크(합쳐지며 섞인다)
    for (var i = 0; i < N; i++) {
      var col = i < (N >> 1) ? C_GLOW : C_TAIL;
      var d = Math.hypot(X[i] - cx, Y[i] - cy);
      var near = Math.max(0, 1 - d / (Math.min(W, H) * 0.70));
      ctx.fillStyle = rgba(col, 0.10 + near * 0.10);
      ctx.beginPath(); ctx.arc(X[i], Y[i], 3.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = rgba(col, 0.55 + near * 0.45);
      ctx.beginPath(); ctx.arc(X[i], Y[i], 1.7 + near * 1.0, 0, Math.PI * 2); ctx.fill();
    }
    // 중심부 — 앰버 핵 점(무게중심)
    ctx.fillStyle = rgba(C_HOT, 0.95);
    ctx.beginPath(); ctx.arc(cx, cy, 2.4, 0, Math.PI * 2); ctx.fill();
  }

  function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

  var simSteps = 0;
  function frame(now) {
    if (t0 < 0) t0 = now;
    var loop = ((now - t0) / 1000) % 4.0;      // 4초 루프 — 두 번째 스침 → 궤도 뒤섞임 → 타원체
    var target = Math.floor(loop / DT);
    while (simSteps < target) { stepLeap(); simSteps++; stamp(); }
    if (target < simSteps - 3) { seed(); simSteps = 0; prev = null; chainCtx.clearRect(0, 0, W, H); }
    decay();
    draw();
    raf = requestAnimationFrame(frame);
  }

  function stillFrame() {
    // reduce — 궤도가 뒤섞여 타원체가 잡히는 장면까지 적분한 뒤 한 장 고정
    for (var s = 0; s < 300; s++) { stepLeap(); stamp(); }
    draw();
  }

  window.addEventListener('resize', function () {
    fit(); seed(); simSteps = 0; prev = null; aReady = false;
    if (reduce) stillFrame();
  });

  fit();
  seed();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
