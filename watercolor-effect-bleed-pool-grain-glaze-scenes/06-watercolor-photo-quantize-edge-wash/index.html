<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>풍경 그림을 밝기 단계와 흔들린 경계의 물감 그림으로 바꾸는 이미지 수채화 효과 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wc is-demo" id="wc">
  <canvas class="wc__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="같은 페이지에서 그린 집과 언덕 풍경이 왼쪽부터 색 단계와 흔들린 경계의 물감 그림으로 바뀌는 장면."></canvas>
  <button class="wc__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("wc");
    if (!root) return;
    // 판 좌표 — 캔버스 안은 늘 480×300. 화면에 보이는 크기와 상관없이 그리기 좌표는 이 판으로 한다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    // 화소 격자 — 픽셀 연산(색 합성·종이 결)은 320×200 에서 하고 화면에는 늘려 그린다
    const OW = 320;
    const OH = 200;
    // 계산 격자 — 물·안료 확산처럼 무거운 계산은 가로 160 칸 격자에서 (한 칸 = 판 3px)
    const GW = 160;
    const GH = 100;
    // 고정 걸음(초) — 같은 시드면 몇 번을 다시 그려도 같은 그림이 나오도록 계산은 1/30초씩 나아간다
    const STEP = 1 / 30;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 같은 시드면 같은 얼룩·물방울·붓털이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 종 모양 난수 — 균일 난수 넷의 합을 평균 0·표준편차 1 로 맞춘 값. 대부분 ±1 안, 가끔 ±2 를 넘는다
    function normalRandom(rng) {
        return (rng() + rng() + rng() + rng() - 2) * 1.7320508;
    }
    // 격자 점마다 정해진 값(0~1) — 정수 좌표 두 개와 시드를 섞는다
    function hash2(ix, iy, seed) {
        let h = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ Math.imul(seed, 1274126177);
        h = Math.imul(h ^ (h >>> 13), 1103515245);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
    }
    // 2차원 값 노이즈 — 정수 격자 네 점의 값을 부드럽게 보간한 0~1. 종이 높이·경계 흔들기·꽃잎 반지름에 쓴다
    function valueNoise(x, y, seed) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        const fx = x - ix;
        const fy = y - iy;
        const ux = fx * fx * (3 - 2 * fx);
        const uy = fy * fy * (3 - 2 * fy);
        const a = hash2(ix, iy, seed);
        const b = hash2(ix + 1, iy, seed);
        const c = hash2(ix, iy + 1, seed);
        const d = hash2(ix + 1, iy + 1, seed);
        return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
    }
    // 두 옥타브 — 굵은 결(0.65) 위에 두 배 촘촘한 결(0.35)을 겹친다
    function noise2(x, y, seed) {
        return valueNoise(x, y, seed) * 0.65 + valueNoise(x * 2 + 17.3, y * 2 + 5.1, seed + 101) * 0.35;
    }
    // 둘레를 따라 한 바퀴 이어지는 노이즈 — 각 θ 를 원 위의 점으로 바꿔 2차원 노이즈를 읽으므로 0 과 2π 에서 값이 같다
    function ringNoise(theta, freq, seed) {
        return noise2(Math.cos(theta) * freq + 50, Math.sin(theta) * freq + 50, seed);
    }
    // 파스텔 안료 — 흰 종이에 한 겹 칠했을 때 돌아오는 빛(0~255). 진하게 쌓이면 곱으로 깊어진다
    const PAPER = [250, 245, 232];
    const INK = [58, 50, 74];
    const SKY = [146, 192, 230];
    const BUTTER = [246, 214, 118];
    const CORAL = [240, 148, 132];
    const SAGE = [142, 192, 152];
    const LAVENDER = [178, 158, 226];
    const PINK = [240, 164, 194];
    const INDIGO = [128, 136, 196];
    // 순환 — 그리기 → 머묾 → 씻겨 지워짐 → 처음부터. 시간 t(초)가 어디쯤인지 0~1 로
    function phaseOf(t, start, length) { return clamp((t - start) / length, 0, 1); }
    function pigment(c) {
        return { r: Math.log(Math.max(c[0], 1) / 255), g: Math.log(Math.max(c[1], 1) / 255), b: Math.log(Math.max(c[2], 1) / 255) };
    }
    // 젖은 물기 — 마르기 전의 색면을 살짝 어둡고 차갑게 보이게 하는 옅은 회청색 한 겹
    const WATER = [214, 224, 236];
    // 화면 버퍼 — 화소마다 RGB(0~1) 세 칸. 프레임마다 새 배열을 만들지 않고 이 한 벌을 다시 쓴다
    const OUT = new Float32Array(OW * OH * 3);
    // 종이 높이맵 — 0(골)~1(마루). 처음 한 번만 계산한다
    const PAPER_HEIGHT = new Float32Array(OW * OH);
    // 종이 요철 음영 — 비스듬한 빛이 결의 기울기에 닿아 생기는 밝기 배율
    const PAPER_SHADE = new Float32Array(OW * OH);
    // 종이 결 크기 — 노이즈 한 칸이 화소 몇 개인가 (작을수록 촘촘한 결)
    const GRAIN_SIZE = 2.6;
    // 결 음영 세기 — 왼쪽 위에서 든 빛 방향으로 오르막이면 밝게, 내리막이면 어둡게
    const GRAIN_LIGHT = 0.36;
    function buildPaper(seed, relief) {
        let lo = 1;
        let hi = 0;
        for (let y = 0; y < OH; y += 1) {
            for (let x = 0; x < OW; x += 1) {
                const h = noise2(x / GRAIN_SIZE, y / GRAIN_SIZE, seed);
                PAPER_HEIGHT[y * OW + x] = h;
                lo = Math.min(lo, h);
                hi = Math.max(hi, h);
            }
        }
        // 높이를 0~1 로 다시 펴서 골과 마루가 끝까지 쓰이게 한다
        const span = Math.max(hi - lo, 1e-6);
        for (let i = 0; i < OW * OH; i += 1) {
            PAPER_HEIGHT[i] = (PAPER_HEIGHT[i] - lo) / span;
        }
        for (let y = 0; y < OH; y += 1) {
            for (let x = 0; x < OW; x += 1) {
                const gx = PAPER_HEIGHT[y * OW + Math.min(x + 1, OW - 1)] - PAPER_HEIGHT[y * OW + Math.max(x - 1, 0)];
                const gy = PAPER_HEIGHT[Math.min(y + 1, OH - 1) * OW + x] - PAPER_HEIGHT[Math.max(y - 1, 0) * OW + x];
                // 빛은 왼쪽 위에서 — 기울기를 (−1, −1)/√2 방향에 내린 값이 양이면 빛을 마주 본다
                const lit = -(gx + gy) * 0.7071;
                PAPER_SHADE[y * OW + x] = clamp(1 + GRAIN_LIGHT * relief * lit * 0.25, 0.82, 1.08);
            }
        }
    }
    // 색 합성 — 진하기 격자 여러 장(gw×gh)을 화소 격자로 늘려 읽고, 안료마다 진하기 × 로그 비율을 더한 뒤 지수로 되돌려 종이 색에 곱한다
    // gran 은 안료마다 종이 골에 고이는 정도: 진하기 × (1 + gran × (1 − 2 × 높이)) — 골(0)은 1 + gran 배, 마루(1)는 1 − gran 배
    // over 가 true 면 종이부터 다시 칠하지 않고 지금 OUT 위에 곱으로 덧칠한다(격자 크기가 다른 층을 한 장면에 겹칠 때)
    function compose(fields, gw, gh, pigs, gran, over) {
        const sx = gw / OW;
        const sy = gh / OH;
        const n = fields.length;
        const pr = PAPER[0] / 255;
        const pg = PAPER[1] / 255;
        const pb = PAPER[2] / 255;
        for (let y = 0; y < OH; y += 1) {
            const fy = clamp((y + 0.5) * sy - 0.5, 0, gh - 1);
            const y0 = Math.min(Math.floor(fy), gh - 2 < 0 ? 0 : gh - 2);
            const ty = fy - y0;
            for (let x = 0; x < OW; x += 1) {
                const fx = clamp((x + 0.5) * sx - 0.5, 0, gw - 1);
                const x0 = Math.min(Math.floor(fx), gw - 2);
                const tx = fx - x0;
                const i00 = y0 * gw + x0;
                const i10 = i00 + 1;
                const i01 = i00 + gw;
                const i11 = i01 + 1;
                const p = y * OW + x;
                const h = PAPER_HEIGHT[p];
                let lr = 0;
                let lg = 0;
                let lb = 0;
                for (let k = 0; k < n; k += 1) {
                    const f = fields[k];
                    let d = (f[i00] * (1 - tx) + f[i10] * tx) * (1 - ty) + (f[i01] * (1 - tx) + f[i11] * tx) * ty;
                    if (d <= 0) {
                        continue;
                    }
                    if (gran[k] !== 0) {
                        d *= Math.max(0, 1 + gran[k] * (1 - 2 * h));
                    }
                    const pk = pigs[k];
                    lr += pk.r * d;
                    lg += pk.g * d;
                    lb += pk.b * d;
                }
                if (over) {
                    if (lr !== 0 || lg !== 0 || lb !== 0) {
                        OUT[p * 3] *= Math.exp(lr);
                        OUT[p * 3 + 1] *= Math.exp(lg);
                        OUT[p * 3 + 2] *= Math.exp(lb);
                    }
                    continue;
                }
                const s = PAPER_SHADE[p];
                OUT[p * 3] = pr * s * Math.exp(lr);
                OUT[p * 3 + 1] = pg * s * Math.exp(lg);
                OUT[p * 3 + 2] = pb * s * Math.exp(lb);
            }
        }
    }
    // 씻어 내기 앞머리 띠 폭(화소) — 물이 지나가는 가장자리가 이만큼 부드럽게 번진다
    const WASH_SOFT = 26;
    // 씻어 내기 — 물이 왼쪽에서 오른쪽으로 쓸고 지나간 자리는 종이로 돌아간다. 앞머리는 줄마다 노이즈로 흔들리고 젖은 띠가 살짝 어둡다
    function washOver(p, seed) {
        if (p <= 0) {
            return;
        }
        const pr = PAPER[0] / 255;
        const pg = PAPER[1] / 255;
        const pb = PAPER[2] / 255;
        for (let y = 0; y < OH; y += 1) {
            const front = lerp(-WASH_SOFT - 50, OW + WASH_SOFT + 50, p) + (noise2(y / 46, p * 1.5, seed) - 0.5) * 70;
            for (let x = 0; x < OW; x += 1) {
                const k = smooth((front - x) / WASH_SOFT);
                if (k <= 0) {
                    continue;
                }
                const i = y * OW + x;
                const s = PAPER_SHADE[i];
                const tint = 1 - 0.07 * (1 - Math.abs(2 * k - 1));
                OUT[i * 3] = lerp(OUT[i * 3], pr * s, k) * tint;
                OUT[i * 3 + 1] = lerp(OUT[i * 3 + 1], pg * s, k) * tint;
                OUT[i * 3 + 2] = lerp(OUT[i * 3 + 2], pb * s, k) * (1 - 0.03 * (1 - Math.abs(2 * k - 1)));
            }
        }
    }
    // 순환 끝의 씻어 내기 — 그리기(PAINT_TIME)와 머묾(HOLD_TIME)이 지난 뒤 WASH_TIME 동안
    function washAt(t, seed) {
        washOver(phaseOf(t, PAINT_TIME + HOLD_TIME, WASH_TIME), seed);
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    // 화소 격자를 담는 바깥에 안 보이는 캔버스 — ImageData 한 장을 만들어 두고 프레임마다 내용만 바꿔 쓴다
    const bufEl = document.createElement('canvas');
    bufEl.width = OW;
    bufEl.height = OH;
    const bufRaw = bufEl.getContext('2d');
    if (!canvasEl || !ctxRaw || !pauseEl || !bufRaw) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const bufCtx = bufRaw;
    const frameImage = bufCtx.createImageData(OW, OH);
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    // 화면 버퍼(OUT, 0~1)를 8비트로 옮겨 바깥 캔버스에 놓고, 판 크기로 부드럽게 늘려 그린다
    function present() {
        const px = frameImage.data;
        for (let i = 0, j = 0; i < OW * OH; i += 1, j += 3) {
            px[i * 4] = OUT[j] * 255;
            px[i * 4 + 1] = OUT[j + 1] * 255;
            px[i * 4 + 2] = OUT[j + 2] * 255;
            px[i * 4 + 3] = 255;
        }
        bufCtx.putImageData(frameImage, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(bufEl, 0, 0, W, H);
    }
    // 06 이미지 수채화 — 같은 페이지에서 계산으로 그린 풍경을 원본으로 삼아 ① 경계 흔들기 ② 색 단계 줄이기 ③ 이웃 밝기 차로 테두리 어둡게 ④ 종이 결 곱 을 차례로 하고, 왼쪽부터 쓸어 바꾼다
    // 밝기를 남길 단계 수 — 하늘 그라디언트도 이 수만큼의 띠로 끊긴다
    const COLOR_LEVELS = 5;
    // 색면 경계를 흔드는 폭(화소) — 노이즈로 읽을 자리를 이만큼 옮긴다
    const EDGE_JITTER = 3.2;
    // 이웃과의 밝기 차가 이 값을 넘으면 테두리로 친다(0~1)
    const EDGE_THRESHOLD = 0.035;
    // 테두리를 어둡게 하는 정도 — 밝기에 (1 − EDGE_DARKEN) 까지 곱한다
    const EDGE_DARKEN = 0.38;
    // 종이 색 섞기 — 물감은 종이를 비쳐 보이므로 단계 색을 종이 쪽으로 이만큼 옅게
    const PAPER_MIX = 0.16;
    // 원본 → 물감 그림으로 쓸어 바꾸는 시간(초)
    const SWEEP_TIME = 3.0;
    // 자동 시연이 미리 그려 두고 시작하는 시각(초)
    const DEMO_START = 0.9;
    const PAINT_TIME = 3.6;
    const HOLD_TIME = 2.6;
    const WASH_TIME = 1.6;
    const SEED = 4826;
    // 원본 풍경(화소 격자 RGB 0~1) — 브라우저에서는 그린 뒤 getImageData 로 다시 읽은 값으로 바뀐다
    const photo = new Float32Array(OW * OH * 3);
    // 물감 그림 결과와 단계만 줄인 중간 결과
    const painted = new Float32Array(OW * OH * 3);
    const stepped = new Float32Array(OW * OH * 3);
    let paintedReady = false;
    buildPaper(SEED, 1);
    function putPhoto(x, y, c, a) {
        const i = (y * OW + x) * 3;
        photo[i] = lerp(photo[i], c[0] / 255, a);
        photo[i + 1] = lerp(photo[i + 1], c[1] / 255, a);
        photo[i + 2] = lerp(photo[i + 2], c[2] / 255, a);
    }
    // 원본 풍경 — 하늘 그라디언트·해·먼 언덕·가까운 언덕·집·나무를 화소마다 계산한다(외부 사진 없음)
    function makeLandscape() {
        for (let y = 0; y < OH; y += 1) {
            for (let x = 0; x < OW; x += 1) {
                const k = y / 120;
                const i = (y * OW + x) * 3;
                photo[i] = lerp(112, 248, k) / 255;
                photo[i + 1] = lerp(170, 222, k) / 255;
                photo[i + 2] = lerp(232, 196, k) / 255;
                const sun = Math.hypot(x - 236, y - 46);
                putPhoto(x, y, [255, 232, 150], clamp(19 - sun, 0, 1));
                const far = 104 + 22 * (noise2(x / 46, 3.1, SEED) - 0.5) * 2;
                if (y > far) {
                    putPhoto(x, y, [104, 122, 178], clamp((y - far) / 2, 0, 1) * 0.9);
                }
                const near = 132 + 24 * (noise2(x / 34, 8.7, SEED + 1) - 0.5) * 2;
                if (y > near) {
                    putPhoto(x, y, [lerp(110, 60, (y - near) / 70), lerp(176, 120, (y - near) / 70), 96], clamp((y - near) / 2, 0, 1));
                }
                // 집 — 벽·지붕·문·창
                if (x >= 186 && x <= 232 && y >= 120 && y <= 154) {
                    putPhoto(x, y, [238, 226, 204], 1);
                }
                if (y >= 98 && y <= 120 && Math.abs(x - 209) <= (y - 98) * 1.25 + 2) {
                    putPhoto(x, y, [206, 92, 80], 1);
                }
                if (x >= 204 && x <= 214 && y >= 136 && y <= 154) {
                    putPhoto(x, y, [112, 78, 66], 1);
                }
                if (x >= 192 && x <= 200 && y >= 126 && y <= 133) {
                    putPhoto(x, y, [118, 160, 206], 1);
                }
                // 나무 — 둥근 잎과 줄기
                if (x >= 262 && x <= 267 && y >= 128 && y <= 156) {
                    putPhoto(x, y, [108, 82, 60], 1);
                }
                putPhoto(x, y, [64, 132, 82], clamp(15 - Math.hypot(x - 265, y - 120), 0, 1));
            }
        }
    }
    makeLandscape();
    function luma(buf, i) {
        return buf[i * 3] * 0.299 + buf[i * 3 + 1] * 0.587 + buf[i * 3 + 2] * 0.114;
    }
    // 물감 그림 만들기 — 원본이 바뀌면 한 번만 다시 계산한다
    function buildPainted() {
        const pr = PAPER[0] / 255;
        const pg = PAPER[1] / 255;
        const pb = PAPER[2] / 255;
        const top = COLOR_LEVELS - 1;
        for (let y = 0; y < OH; y += 1) {
            for (let x = 0; x < OW; x += 1) {
                // ① 경계 흔들기 — 읽을 자리를 노이즈만큼 옮겨 색면 가장자리가 붓 자국처럼 울퉁불퉁해진다
                const sx = clamp(Math.round(x + (noise2(x / 7, y / 7, SEED + 11) - 0.5) * 2 * EDGE_JITTER), 0, OW - 1);
                const sy = clamp(Math.round(y + (noise2(x / 7 + 40, y / 7, SEED + 12) - 0.5) * 2 * EDGE_JITTER), 0, OH - 1);
                const o = (y * OW + x) * 3;
                // 잔 얼룩 고르기 — 옮긴 자리와 그 네 이웃의 평균을 읽는다
                let r = 0;
                let g = 0;
                let b = 0;
                for (let q = 0; q < 5; q += 1) {
                    const qx = clamp(sx + (q === 1 ? -1 : q === 2 ? 1 : 0), 0, OW - 1);
                    const qy = clamp(sy + (q === 3 ? -1 : q === 4 ? 1 : 0), 0, OH - 1);
                    const s = (qy * OW + qx) * 3;
                    r += photo[s] * 0.2;
                    g += photo[s + 1] * 0.2;
                    b += photo[s + 2] * 0.2;
                }
                // ② 색 단계 줄이기 — 밝기를 COLOR_LEVELS 단계로 반올림하고 세 채널에 같은 비율을 곱해 색상은 지킨다. 그다음 종이 색 쪽으로 PAPER_MIX 만큼
                const l = r * 0.299 + g * 0.587 + b * 0.114;
                const ratio = Math.round(clamp(l, 0, 1) * top) / top / Math.max(l, 0.02);
                stepped[o] = lerp(clamp(r * ratio, 0, 1), pr, PAPER_MIX);
                stepped[o + 1] = lerp(clamp(g * ratio, 0, 1), pg, PAPER_MIX);
                stepped[o + 2] = lerp(clamp(b * ratio, 0, 1), pb, PAPER_MIX);
            }
        }
        for (let y = 0; y < OH; y += 1) {
            for (let x = 0; x < OW; x += 1) {
                const i = y * OW + x;
                const l = luma(stepped, i);
                // ③ 이웃 밝기 차 — 위아래 왼오른 네 이웃과의 밝기 차 가운데 가장 큰 값
                let e = 0;
                if (x > 0) {
                    e = Math.max(e, Math.abs(l - luma(stepped, i - 1)));
                }
                if (x < OW - 1) {
                    e = Math.max(e, Math.abs(l - luma(stepped, i + 1)));
                }
                if (y > 0) {
                    e = Math.max(e, Math.abs(l - luma(stepped, i - OW)));
                }
                if (y < OH - 1) {
                    e = Math.max(e, Math.abs(l - luma(stepped, i + OW)));
                }
                const dark = 1 - EDGE_DARKEN * smooth((e - EDGE_THRESHOLD) / 0.12);
                // ④ 종이 결 곱 — 요철 음영과, 골에 조금 더 고이는 안료(높이가 낮을수록 6% 진하게)
                const grain = PAPER_SHADE[i] * (1 - 0.12 * (0.5 - PAPER_HEIGHT[i]));
                painted[i * 3] = stepped[i * 3] * dark * grain;
                painted[i * 3 + 1] = stepped[i * 3 + 1] * dark * grain;
                painted[i * 3 + 2] = stepped[i * 3 + 2] * dark * grain;
            }
        }
        paintedReady = true;
    }
    function reset() {
        if (!paintedReady) {
            buildPainted();
        }
    }
    function update(dt, t) {
        // 이 장면은 시간에 따라 쌓이는 계산이 없다 — 쓸기 자리만 render 가 시간으로 정한다
    }
    // 쓸기 앞머리(화소) — 0 이면 왼쪽 바깥, 1 이면 오른쪽 바깥. 줄마다 노이즈로 흔들려 젖은 붓 자국처럼 들쭉날쭉하다
    function sweepFront(p, y) {
        return p * (OW + 70) - 35 + (noise2(y / 18, 2.5, SEED + 21) - 0.5) * 40;
    }
    function render(t) {
        const on = smooth(phaseOf(t, 0.2, SWEEP_TIME));
        const back = smooth(phaseOf(t, PAINT_TIME + HOLD_TIME, WASH_TIME));
        for (let y = 0; y < OH; y += 1) {
            const f1 = sweepFront(on, y);
            const f2 = sweepFront(back, y);
            for (let x = 0; x < OW; x += 1) {
                // 그림으로 바뀐 정도 — 첫 쓸기 앞머리 뒤쪽이면 1, 되돌리는 쓸기가 지나간 자리는 다시 0
                const k = smooth((f1 - x) / 12) * (1 - smooth((f2 - x) / 12));
                const i = (y * OW + x) * 3;
                OUT[i] = clamp(lerp(photo[i], painted[i], k), 0, 1);
                OUT[i + 1] = clamp(lerp(photo[i + 1], painted[i + 1], k), 0, 1);
                OUT[i + 2] = clamp(lerp(photo[i + 2], painted[i + 2], k), 0, 1);
            }
        }
    }
    // 06 원본 읽기 — 계산한 풍경을 바깥에 안 보이는 캔버스에 놓고 getImageData 로 다시 읽어 그 화소를 원본으로 쓴다
    // 같은 페이지에서 그린 그림이라 캔버스가 오염되지 않아 읽기가 열린다. 다른 출처의 사진을 crossOrigin 허락 없이 그렸다면 여기서 SecurityError 가 난다
    const photoEl = document.createElement('canvas');
    photoEl.width = OW;
    photoEl.height = OH;
    const photoCtx = photoEl.getContext('2d', { willReadFrequently: true });
    function loadPhoto() {
        if (!photoCtx) {
            return;
        }
        const img = photoCtx.createImageData(OW, OH);
        for (let i = 0; i < OW * OH; i += 1) {
            img.data[i * 4] = photo[i * 3] * 255;
            img.data[i * 4 + 1] = photo[i * 3 + 1] * 255;
            img.data[i * 4 + 2] = photo[i * 3 + 2] * 255;
            img.data[i * 4 + 3] = 255;
        }
        photoCtx.putImageData(img, 0, 0);
        try {
            const px = photoCtx.getImageData(0, 0, OW, OH).data;
            for (let i = 0; i < OW * OH; i += 1) {
                photo[i * 3] = px[i * 4] / 255;
                photo[i * 3 + 1] = px[i * 4 + 1] / 255;
                photo[i * 3 + 2] = px[i * 4 + 2] / 255;
            }
            paintedReady = false;
        }
        catch (err) {
            // 오염된 캔버스 — 픽셀을 못 읽으면 계산해 둔 원본 그대로 쓴다
        }
    }
    loadPhoto();
    function draw() {
        render(simTime);
        present();
    }
    // 한 프레임에 넘기는 시간 상한(초) — 탭을 오래 숨겼다 돌아온 첫 프레임에도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    // 한 바퀴 — 그리기 → 머묾 → 씻겨 지워짐. 끝나면 같은 시드로 처음부터 다시 그린다
    const CYCLE = PAINT_TIME + HOLD_TIME + WASH_TIME;
    // 그림 시계(초)와 고정 걸음에 아직 못 넣은 나머지 시간
    let simTime = 0;
    let pending = 0;
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 손대면 시연 표시를 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    // 리스너는 한 묶음으로 달고 정리할 때 한 번에 뗀다
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 고정 걸음 하나 — 그리는 동안만 계산을 나아가게 하고, 한 바퀴가 끝나면 처음 상태로 되돌린다
    function stepOnce() {
        simTime += STEP;
        if (simTime >= CYCLE) {
            simTime = 0;
            reset();
            return;
        }
        if (simTime <= PAINT_TIME) {
            update(STEP, simTime);
        }
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        pending += Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        while (pending >= STEP) {
            stepOnce();
            pending -= STEP;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 시계 다시 맞추기 — 멈췄던 사이의 시간을 첫 프레임에 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 동작 줄이기 — 루프를 돌리지 않고, 같은 시드로 그리기 끝까지 한 번에 계산한 완성 그림 한 장만 보여 준다
    function showFinished() {
        stopLoop();
        reset();
        simTime = 0;
        while (simTime + STEP <= PAINT_TIME) {
            simTime += STEP;
            update(STEP, simTime);
        }
        simTime = PAINT_TIME;
        draw();
    }
    function play() {
        reset();
        simTime = 0;
        pending = 0;
        // 자동 시연은 DEMO_START 초까지 미리 그려 둔 채 시작한다 — 페이지를 열자마자 빈 종이만 보이지 않게(사람이 다시 시작하면 0초부터)
        if (demo) {
            while (simTime + STEP <= DEMO_START) {
                stepOnce();
            }
        }
        draw();
        if (!paused) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 그리기를 멈추고, 돌아오면 시계를 다시 맞춰 이어 그린다 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 페이지를 연 채 바뀌면 — 켜지면 완성 그림으로 멈추고, 꺼지면 처음부터 다시 그린다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showFinished();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw();
    }, { signal: off.signal });
    fitCanvas();
    if (still) {
        showFinished();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
