<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar crop upload — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="cu is-demo" aria-label="Profile photo positioning">
    <!-- 테두리와 창은 제자리 — 움직이는 것은 그 안의 사진뿐이다. 사진 파일은 쓰지 않는다(그라디언트 한 겹) -->
    <div class="cu__frame">
      <div class="cu__window" tabindex="0" aria-label="Drag the photo to position it">
        <div class="cu__photo" aria-hidden="true"></div>
      </div>
    </div>

    <div class="cu__controls">
      <svg class="cu__cam" viewBox="0 0 256 256" width="20" height="20" aria-hidden="true" focusable="false" fill="currentColor"><path d="M208,64H176L160,40H96L80,64H48A16,16,0,0,0,32,80V192a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V80A16,16,0,0,0,208,64ZM128,168a36,36,0,1,1,36-36A36,36,0,0,1,128,168Z" opacity="0.2"/><path d="M208,56H180.28L166.65,35.56A8,8,0,0,0,160,32H96a8,8,0,0,0-6.65,3.56L75.71,56H48A24,24,0,0,0,24,80V192a24,24,0,0,0,24,24H208a24,24,0,0,0,24-24V80A24,24,0,0,0,208,56Zm8,136a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V80a8,8,0,0,1,8-8H80a8,8,0,0,0,6.66-3.56L100.28,48h55.43l13.63,20.44A8,8,0,0,0,176,72h32a8,8,0,0,1,8,8ZM128,88a44,44,0,1,0,44,44A44.05,44.05,0,0,0,128,88Zm0,72a28,28,0,1,1,28-28A28,28,0,0,1,128,160Z"/></svg>
      <input class="cu__zoom" type="range" min="1" max="2" step="0.01" value="1" aria-label="Zoom level">
      <span class="cu__preview" aria-hidden="true"><span class="cu__mini"></span></span>
    </div>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.cu');
  var win = root.querySelector('.cu__window');
  var zoom = root.querySelector('.cu__zoom');
  var x = 0, y = 0, z = 1;

  // 핵심 — 허용 이동 범위는 maxOffset = (사진크기 × 배율 − 창크기) / 2.
  // 배율을 줄이면 범위가 먼저 좁아지므로 창 가장자리에 빈 여백이 절대 생기지 않는다.
  // 사진 바탕은 창의 1.5배(inset -25%).
  function clamp(v, zz) {
    var w = win.offsetWidth;                       // 창 크기(렌더 변환과 무관)
    var m = Math.max(0, (w * 1.5 * zz - w) / 2);
    return Math.max(-m, Math.min(m, v));
  }
  function apply() {
    root.style.setProperty('--x', x + 'px');
    root.style.setProperty('--y', y + 'px');
    root.style.setProperty('--z', '' + z);
  }

  // 끌기 — setPointerCapture 로 창 밖으로 나가도 놓치지 않는다
  var drag = null;
  win.addEventListener('pointerdown', function (e) {
    drag = { id: e.pointerId, px: e.clientX, py: e.clientY };
    win.setPointerCapture(e.pointerId);
  });
  win.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    x = clamp(x + e.clientX - drag.px, z);
    y = clamp(y + e.clientY - drag.py, z);
    drag.px = e.clientX; drag.py = e.clientY;
    apply();
  });
  win.addEventListener('pointerup', function (e) { if (drag && e.pointerId === drag.id) drag = null; });
  win.addEventListener('pointercancel', function () { drag = null; });

  // 배율이 바뀌면 현재 x·y 를 새 범위로 다시 물린다(clamp)
  zoom.addEventListener('input', function () {
    z = parseFloat(zoom.value);
    x = clamp(x, z);
    y = clamp(y, z);
    apply();
  });

  // 키보드 — 화살표 키로 4px 씩 움직인다
  win.addEventListener('keydown', function (e) {
    var step = { ArrowLeft: [-4, 0], ArrowRight: [4, 0], ArrowUp: [0, -4], ArrowDown: [0, 4] }[e.key];
    if (!step) return;
    e.preventDefault();
    x = clamp(x + step[0], z);
    y = clamp(y + step[1], z);
    apply();
  });

  // 사람이 손을 대면 미리보기 루프를 뗀다
  function stopLoop() { root.classList.remove('is-demo'); }
  root.addEventListener('pointerdown', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
