<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar presence dot — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="pd is-demo" data-state="online" aria-label="オンライン状態の表示">
    <div class="pd__body">
      <div class="pd__wrap" role="img" aria-label="プランナー、オンライン">
        <span class="pd__av" data-name="プランナー"></span>
        <span class="pd__dot" aria-hidden="true"></span>
      </div>
      <div class="pd__meta">
        <p class="pd__name">プランナー</p>
        <p class="pd__state">
          <span data-key="online">オンライン</span>
          <span data-key="away">離席中</span>
          <span data-key="busy">取り込み中</span>
        </p>
      </div>
    </div>

    <button class="pd__btn" type="button">状態を変える</button>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.pd');
  var wrap = root.querySelector('.pd__wrap');
  var av = root.querySelector('.pd__av');
  var btn = root.querySelector('.pd__btn');
  var order = ['online', 'away', 'busy'];

  // 이니셜은 표시 문자열에서 계산한다 — 하드코딩하지 않아야 en/ja 언어팩에서도 따라간다
  function initialOf(name) {
    var words = (name || '').trim().split(/\s+/);
    if (/[A-Za-z]/.test(words[0].charAt(0))) {
      return words.slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join('');
    }
    return words[0].charAt(0);
  }
  av.textContent = initialOf(av.getAttribute('data-name'));

  // 상태 글자는 코드에 박지 않고 HTML 안 요소에서 읽는다
  var nameEl = root.querySelector('.pd__name');
  function currentLabel() {
    var el = root.querySelector('.pd__state span[data-key="' + root.getAttribute('data-state') + '"]');
    return el ? el.textContent : '';
  }
  // aria-label 은 조사 앞뒤 공백이 생기지 않게 처음부터 완성된 문장으로 만든다
  function applyLabel() {
    wrap.setAttribute('aria-label', nameEl.textContent + ', ' + currentLabel());
  }
  applyLabel();

  // online → away → busy → online
  btn.addEventListener('click', function () {
    var next = order[(order.indexOf(root.getAttribute('data-state')) + 1) % order.length];
    root.setAttribute('data-state', next);
    applyLabel();
  });

  // 사람이 손을 대면 미리보기 루프를 뗀다
  function stopLoop() { root.classList.remove('is-demo'); }
  root.addEventListener('pointerdown', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
