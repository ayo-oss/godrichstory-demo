<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mention chip combobox — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="mc is-demo" aria-label="Mention input demo">
    <div class="mc__row">
      <!-- 이미 들어가 있는 칩 한 개. 새 칩은 사람이 실제로 골랐을 때만 이 자리에 끼워진다 -->
      <span class="mc__chip">
        <span class="mc__av mc__av--slate" aria-hidden="true"></span>
        <svg class="mc__at" viewBox="0 0 256 256" width="12" height="12" aria-hidden="true" focusable="false" fill="currentColor"><path d="M224,128a96,96,0,1,1-96-96A96,96,0,0,1,224,128Z" opacity="0.2"/><path d="M128,24a104,104,0,0,0,0,208c21.51,0,44.1-6.48,60.43-17.33a8,8,0,0,0-8.86-13.33C166,210.38,146.21,216,128,216a88,88,0,1,1,88-88c0,26.45-10.88,32-20,32s-20-5.55-20-32V88a8,8,0,0,0-16,0v4.26a48,48,0,1,0,5.93,65.1c6,12,16.35,18.64,30.07,18.64,22.54,0,36-17.94,36-48A104.11,104.11,0,0,0,128,24Zm0,136a32,32,0,1,1,32-32A32,32,0,0,1,128,160Z"/></svg>
        <span class="mc__name">Admin</span>
        <button class="mc__x" type="button" aria-label="Remove mention">
          <svg viewBox="0 0 256 256" width="10" height="10" aria-hidden="true" focusable="false" fill="currentColor"><path d="M216,56V200a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V56A16,16,0,0,1,56,40H200A16,16,0,0,1,216,56Z" opacity="0.2"/><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
        </button>
      </span>
      <input class="mc__input" type="text" role="combobox" aria-expanded="true"
             aria-controls="mc-list" aria-autocomplete="list" aria-activedescendant="mc-opt-0"
             placeholder="Write a comment" autocomplete="off">

      <!-- 절대배치 목록 — 줄(position:relative) 바로 아래에 열리고,
           뿌리의 padding-bottom 이 열린 높이만큼 자리를 잡는다(top:100% 를 뿌리에 걸면
           예약한 자리 '아래'로 내려가 320px 넘침이 생긴다 — 279 실측) -->
      <ul class="mc__list" id="mc-list" role="listbox" aria-label="People to mention">
        <li class="mc__opt" id="mc-opt-0" role="option" aria-selected="true">
          <span class="mc__av mc__av--blue" aria-hidden="true"></span><span class="mc__name">Editor</span>
        </li>
        <li class="mc__opt" id="mc-opt-1" role="option" aria-selected="false">
          <span class="mc__av mc__av--violet" aria-hidden="true"></span><span class="mc__name">Designer</span>
        </li>
        <li class="mc__opt" id="mc-opt-2" role="option" aria-selected="false">
          <span class="mc__av mc__av--teal" aria-hidden="true"></span><span class="mc__name">Developer</span>
        </li>
        <li class="mc__opt" id="mc-opt-3" role="option" aria-selected="false">
          <span class="mc__av mc__av--plum" aria-hidden="true"></span><span class="mc__name">Planner</span>
        </li>
        <li class="mc__bar" aria-hidden="true"></li>
      </ul>
    </div>

    <template id="mc-tpl">
      <span class="mc__chip">
        <span class="mc__av" aria-hidden="true"></span>
        <svg class="mc__at" viewBox="0 0 256 256" width="12" height="12" aria-hidden="true" focusable="false" fill="currentColor"><path d="M224,128a96,96,0,1,1-96-96A96,96,0,0,1,224,128Z" opacity="0.2"/><path d="M128,24a104,104,0,0,0,0,208c21.51,0,44.1-6.48,60.43-17.33a8,8,0,0,0-8.86-13.33C166,210.38,146.21,216,128,216a88,88,0,1,1,88-88c0,26.45-10.88,32-20,32s-20-5.55-20-32V88a8,8,0,0,0-16,0v4.26a48,48,0,1,0,5.93,65.1c6,12,16.35,18.64,30.07,18.64,22.54,0,36-17.94,36-48A104.11,104.11,0,0,0,128,24Zm0,136a32,32,0,1,1,32-32A32,32,0,0,1,128,160Z"/></svg>
        <span class="mc__name"></span>
        <button class="mc__x" type="button" aria-label="Remove mention">
          <svg viewBox="0 0 256 256" width="10" height="10" aria-hidden="true" focusable="false" fill="currentColor"><path d="M216,56V200a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V56A16,16,0,0,1,56,40H200A16,16,0,0,1,216,56Z" opacity="0.2"/><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
        </button>
      </span>
    </template>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.mc');
  var input = root.querySelector('.mc__input');
  var list = root.querySelector('.mc__list');
  var opts = [].slice.call(list.querySelectorAll('.mc__opt'));
  var tpl = document.getElementById('mc-tpl');
  var active = 0;

  // 이니셜은 표시 문자열에서 계산한다(하드코딩 금지) — 언어팩이 바뀌면 이니셜도 따라간다
  function initialOf(name) {
    var p = name.trim().split(/\s+/);
    return /[A-Za-z]/.test(p[0]) ? p.slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join('') : p[0].charAt(0);
  }
  [].forEach.call(root.querySelectorAll('.mc__chip, .mc__opt'), function (el) {
    el.querySelector('.mc__av').textContent = initialOf(el.querySelector('.mc__name').textContent);
  });

  function visible() { return opts.filter(function (o) { return !o.hidden; }); }
  function open() { list.hidden = false; input.setAttribute('aria-expanded', 'true'); }
  function close() { list.hidden = true; input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); }
  function setActive(i) {
    var v = visible();
    if (!v.length) return;
    active = (i + v.length) % v.length;
    v.forEach(function (o, k) { o.setAttribute('aria-selected', k === active ? 'true' : 'false'); });
    input.setAttribute('aria-activedescendant', v[active].id);
  }

  // @ 를 치면 목록이 열리고, 이어 치는 글자로 이름을 걸러낸다
  input.addEventListener('input', function () {
    var at = input.value.lastIndexOf('@');
    if (at < 0) { close(); return; }
    open();
    var q = input.value.slice(at + 1);
    opts.forEach(function (o) { o.hidden = !o.querySelector('.mc__name').textContent.includes(q); });
    setActive(0);
  });

  input.addEventListener('keydown', function (e) {
    if (list.hidden) return;
    if (e.key === 'ArrowDown') { setActive(active + 1); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { setActive(active - 1); e.preventDefault(); }
    else if (e.key === 'Enter') { pick(visible()[active]); e.preventDefault(); }
    else if (e.key === 'Escape') { close(); }
  });

  // 고른 사람을 칩으로 입력칸 앞에 넣고 @질의를 지운다
  function pick(opt) {
    if (!opt) return;
    var chip = tpl.content.firstElementChild.cloneNode(true);
    chip.querySelector('.mc__av').className = opt.querySelector('.mc__av').className;
    chip.querySelector('.mc__av').textContent = opt.querySelector('.mc__av').textContent;
    chip.querySelector('.mc__name').textContent = opt.querySelector('.mc__name').textContent;
    root.querySelector('.mc__row').insertBefore(chip, input);
    input.value = '';
    close();
  }

  list.addEventListener('click', function (e) { var li = e.target.closest('.mc__opt'); if (li) pick(li); });
  root.addEventListener('click', function (e) { var btn = e.target.closest('.mc__x'); if (btn) btn.closest('.mc__chip').remove(); });

  // 사람이 손을 대면 미리보기 루프를 뗀다
  function stopLoop() { root.classList.remove('is-demo'); }
  root.addEventListener('pointerdown', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
