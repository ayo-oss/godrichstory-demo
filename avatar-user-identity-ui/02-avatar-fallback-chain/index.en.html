<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fallback chain avatar — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="fb is-demo" aria-label="Three-step fallback avatar" data-step="photo">
    <p class="fb__name">Admin</p>

    <!-- 세 겹이 한 자리에 겹쳐 앉는다: 사진 자리(로딩 시머) · 이니셜 · 사람 도형.
         data-step 이 어느 겹을 보일지 정한다 -->
    <span class="fb__slot">
      <span class="fb__shine" aria-hidden="true"></span>
      <img class="fb__photo" src="member-photo.jpg" alt="">
      <span class="fb__initial" aria-hidden="true"></span>
      <span class="fb__mark" aria-hidden="true">
        <svg viewBox="0 0 256 256" width="34" height="34" aria-hidden="true" focusable="false" fill="currentColor"><path d="M192,96a64,64,0,1,1-64-64A64,64,0,0,1,192,96Z" opacity="0.2"/><path d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"/></svg>
      </span>
    </span>

    <p class="fb__step">
      <span class="fb__stepTxt fb__stepTxt--photo">Step 1 · waiting for photo</span>
      <span class="fb__stepTxt fb__stepTxt--initials">Step 2 · initials fallback</span>
      <span class="fb__stepTxt fb__stepTxt--mark">Step 3 · person-mark fallback</span>
    </p>

    <button class="fb__btn" type="button">
      <span class="fb__btnTxt fb__btnTxt--mark">Show person mark</span>
      <span class="fb__btnTxt fb__btnTxt--initials">Back to initials</span>
    </button>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.fb');
  var img = root.querySelector('.fb__photo');
  var btn = root.querySelector('.fb__btn');
  var nameEl = root.querySelector('.fb__name');
  var initialEl = root.querySelector('.fb__initial');

  // 이니셜은 Name 표시에서 계산한다(한국어 첫 글자 1자 · 라틴 앞 두 단어 머리글자)
  function initialsOf(text) {
    var trimmed = text.trim();
    if (!trimmed) return '';
    if (/[가-힣]/.test(trimmed[0])) return trimmed[0];
    var words = trimmed.split(/\s+/).filter(function (w) { return /[A-Za-z]/.test(w[0] || ''); });
    return words.slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join('');
  }
  initialEl.textContent = initialsOf(nameEl.textContent);

  // 사진 파일은 일부러 없다(404) — error 이벤트에서 스스로 이니셜 단계로 내려간다
  img.addEventListener('error', function () {
    if (root.dataset.step === 'photo') root.dataset.step = 'initials';
  });
  if (img.complete && img.naturalWidth === 0 && root.dataset.step === 'photo') {
    root.dataset.step = 'initials';
  }

  // 버튼 하나가 이니셜과 사람 도형을 오간다 (키보드 Enter·Space 로도 눌린다)
  btn.addEventListener('click', function () {
    root.dataset.step = (root.dataset.step === 'mark') ? 'initials' : 'mark';
  });

  // 사람이 손을 대면 미리보기 루프를 뗀다
  function stopLoop() { root.classList.remove('is-demo'); }
  root.addEventListener('pointerdown', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
