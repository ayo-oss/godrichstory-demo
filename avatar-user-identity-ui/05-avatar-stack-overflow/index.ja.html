<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar stack with +N — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="st is-demo" aria-label="文書の参加者">
    <div class="st__stack">
      <button class="st__av st__av--1" type="button" style="--i: 0" data-name="管理者" aria-label="管理者"></button>
      <button class="st__av st__av--2" type="button" style="--i: 1" data-name="編集者" aria-label="編集者"></button>
      <button class="st__av st__av--3" type="button" style="--i: 2" data-name="デザイナー" aria-label="デザイナー"></button>
      <button class="st__av st__av--4" type="button" style="--i: 3" data-name="開発者" aria-label="開発者"></button>
      <button class="st__more" type="button" style="--i: 4" aria-expanded="false" aria-label="残りの参加者を開く">+3</button>
    </div>

    <p class="st__line">この文書には7人が参加中</p>

    <ul class="st__folded">
      <li class="st__row" hidden><span class="st__mini st__mini--5" data-name="レビュアー" aria-hidden="true"></span>レビュアー</li>
      <li class="st__row" hidden><span class="st__mini st__mini--6" data-name="翻訳者" aria-hidden="true"></span>翻訳者</li>
      <li class="st__row" hidden><span class="st__mini st__mini--7" data-name="運営者" aria-hidden="true"></span>運営者</li>
    </ul>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.st');
  var stack = root.querySelector('.st__stack');
  var more = root.querySelector('.st__more');
  var rows = root.querySelectorAll('.st__row');

  // 이니셜은 표시 문자열에서 계산한다 — 하드코딩하지 않아야 en/ja 언어팩에서도 따라간다
  function initialOf(name) {
    var words = (name || '').trim().split(/\s+/);
    if (/[A-Za-z]/.test(words[0].charAt(0))) {
      return words.slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join('');
    }
    return words[0].charAt(0);
  }

  Array.prototype.forEach.call(root.querySelectorAll('[data-name]'), function (el) {
    el.textContent = initialOf(el.getAttribute('data-name'));
  });

  function stopLoop() { root.classList.remove('is-demo'); }

  // 손이나 초점이 스택에 들어오면 뿌리에 is-open — 겹침이 translateX 로 풀린다
  // (pointerenter 도 루프를 뗀다 — 이 데모의 본 상호작용이 호버라서 애니메이션이 덮으면 죽는다)
  function openStack() { stopLoop(); root.classList.add('is-open'); }
  function closeStack() { root.classList.remove('is-open'); }

  stack.addEventListener('pointerenter', openStack);
  stack.addEventListener('pointerleave', closeStack);
  stack.addEventListener('focusin', openStack);
  stack.addEventListener('focusout', closeStack);
  root.addEventListener('pointerdown', stopLoop);

  // +N 버튼 — 접힌 인원을 아래 목록으로 펼친다 (실제 DOM 요소를 hidden 으로 여닫는다)
  var expanded = false;
  more.addEventListener('click', function () {
    expanded = !expanded;
    more.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    Array.prototype.forEach.call(rows, function (row) { row.hidden = !expanded; });
  });
})();
</script>
</body>
</html>
