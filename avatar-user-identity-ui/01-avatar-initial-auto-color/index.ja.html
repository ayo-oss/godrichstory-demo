<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Initial auto color — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ai is-demo" aria-label="イニシャル自動配色アバター">
    <div class="ai__field">
      <label class="ai__label" for="ai-name">名前</label>
      <input class="ai__input" id="ai-name" type="text" value="管理者" autocomplete="off" spellcheck="false" placeholder="名前を入力">
      <!-- 이니셜 글자와 data-tone 은 JS 가 입력값에서 계산해 넣는다(하드코딩 금지 — 언어팩이 바뀌면 따라간다) -->
      <span class="ai__avatar" data-tone="0" aria-hidden="true"></span>
    </div>

    <p class="ai__hint">同じ名前は必ず同じ色になります</p>

    <ul class="ai__row">
      <li class="ai__item"><span class="ai__dot" data-tone="5" aria-hidden="true"></span><span class="ai__name">編集者</span></li>
      <li class="ai__item"><span class="ai__dot" data-tone="0" aria-hidden="true"></span><span class="ai__name">デザイナー</span></li>
      <li class="ai__item"><span class="ai__dot" data-tone="3" aria-hidden="true"></span><span class="ai__name">翻訳者</span></li>
      <li class="ai__item"><span class="ai__dot" data-tone="1" aria-hidden="true"></span><span class="ai__name">相談員</span></li>
      <li class="ai__item"><span class="ai__dot" data-tone="4" aria-hidden="true"></span><span class="ai__name">レビュアー</span></li>
    </ul>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.ai');
  var input = root.querySelector('.ai__input');
  var avatar = root.querySelector('.ai__avatar');

  // 이름을 숫자로 접어 0~5 — 순수 함수라 같은 이름은 늘 같은 색을 고른다
  function hashName(text) {
    var h = 0;
    for (var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) >>> 0;
    return h % 6;
  }

  // 한국어면 첫 글자 1자, 라틴이면 앞 두 단어의 머리글자
  function initialsOf(text) {
    var trimmed = text.trim();
    if (!trimmed) return '';
    if (/[가-힣]/.test(trimmed[0])) return trimmed[0];
    var words = trimmed.split(/\s+/).filter(function (w) { return /[A-Za-z]/.test(w[0] || ''); });
    return words.slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join('');
  }

  // JS 는 색을 모른다 — data-tone 번호만 바꾸고 scss 가 여섯 색을 칠한다
  function applyName() {
    avatar.dataset.tone = String(hashName(input.value));
    avatar.textContent = initialsOf(input.value);
  }

  // 아래 줄 다섯 개도 名前 표시에서 이니셜과 색을 계산해 넣는다
  var items = root.querySelectorAll('.ai__item');
  Array.prototype.forEach.call(items, function (item) {
    var name = item.querySelector('.ai__name').textContent;
    var dot = item.querySelector('.ai__dot');
    dot.dataset.tone = String(hashName(name));
    dot.textContent = initialsOf(name);
  });

  input.addEventListener('input', applyName);
  applyName();

  // 사람이 손을 대면 미리보기 루프를 뗀다
  function stopLoop() { root.classList.remove('is-demo'); }
  root.addEventListener('pointerdown', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
