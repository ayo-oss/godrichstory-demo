<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hover user card — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="uc is-demo" aria-label="ユーザーカードのデモ">
    <!-- 가짜 포인터 — 미리보기 루프에서만 보인다 -->
    <span class="uc__pointer" aria-hidden="true"></span>

    <p class="uc__line">
      <span class="uc__ago">たった今</span>
      <button class="uc__trigger" type="button" aria-describedby="uc-card">
        <span class="uc__av" aria-hidden="true"></span>
        <span class="uc__name">編集者</span>
      </button>
      <span class="uc__rest">が書類を修正しました</span>
    </p>

    <!-- 절대배치 카드 — 뿌리의 padding-bottom 이 열린 높이만큼 자리를 잡는다 -->
    <div class="uc__card" id="uc-card" role="tooltip">
      <div class="uc__head">
        <span class="uc__bigav" aria-hidden="true"></span>
        <p class="uc__who">
          <span class="uc__cardName">編集者</span>
          <span class="uc__job">文書編集担当</span>
        </p>
      </div>
      <div class="uc__stats">
        <p class="uc__stat"><span class="uc__val">128</span><span class="uc__lab">編集した文書</span></p>
        <p class="uc__stat"><span class="uc__val">36</span><span class="uc__lab">受けた感謝</span></p>
      </div>
      <span class="uc__fill" aria-hidden="true"><span class="uc__fillIn"></span></span>
    </div>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.uc');
  var trigger = root.querySelector('.uc__trigger');
  var card = root.querySelector('.uc__card');
  var openT = 0, closeT = 0;

  // 호버 — 300ms 지연 뒤 열리고, 벗어나면 200ms 유예 뒤 닫힌다.
  // 유예 동안 카드 위로 옮겨 가면 닫히지 않는다(카드에도 같은 핸들러)
  trigger.addEventListener('pointerenter', function () {
    clearTimeout(openT); clearTimeout(closeT);
    openT = setTimeout(function () { card.hidden = false; }, 300);
  });
  function scheduleClose() {
    clearTimeout(openT); clearTimeout(closeT);
    closeT = setTimeout(function () { card.hidden = true; }, 200);
  }
  trigger.addEventListener('pointerleave', scheduleClose);
  card.addEventListener('pointerenter', function () { clearTimeout(closeT); });
  card.addEventListener('pointerleave', scheduleClose);

  // 초점 — 지연 없이 열리고, blur·Escape 으로 닫힌다
  trigger.addEventListener('focus', function () { clearTimeout(closeT); card.hidden = false; });
  trigger.addEventListener('blur', function () { card.hidden = true; });
  trigger.addEventListener('keydown', function (e) { if (e.key === 'Escape') card.hidden = true; });

  // 이니셜은 표시 문자열에서 계산한다(하드코딩 금지) — 언어팩이 바뀌면 이니셜도 따라간다
  function initialOf(name) {
    var p = name.trim().split(/\s+/);
    return /[A-Za-z]/.test(p[0]) ? p.slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join('') : p[0].charAt(0);
  }
  var name = root.querySelector('.uc__name').textContent;
  trigger.querySelector('.uc__av').textContent = initialOf(name);
  root.querySelector('.uc__bigav').textContent = initialOf(root.querySelector('.uc__cardName').textContent);

  // 사람이 손을 대면 미리보기 루프를 뗀다
  function stopLoop() { root.classList.remove('is-demo'); }
  root.addEventListener('pointerdown', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
