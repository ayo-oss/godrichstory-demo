<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identicon pattern — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="id is-demo" aria-label="名前パターン・アバター">
    <div class="id__field">
      <label class="id__label" for="id-name">名前</label>
      <input class="id__input" id="id-name" type="text" value="管理者" autocomplete="off" spellcheck="false" placeholder="名前を入力">
    </div>

    <!-- 25칸은 JS 가 만든다: 해시 비트를 15칸(열 0·1·2)에 배분하고 열 0↔4 · 1↔3 을 거울처럼 맞춘다 -->
    <div class="id__grid" data-tone="1" aria-hidden="true"></div>

    <ul class="id__list">
      <li class="id__item"><div class="id__mini" data-tone="5" aria-hidden="true"></div><span class="id__name">デザイナー</span></li>
      <li class="id__item"><div class="id__mini" data-tone="4" aria-hidden="true"></div><span class="id__name">プランナー</span></li>
      <li class="id__item"><div class="id__mini" data-tone="0" aria-hidden="true"></div><span class="id__name">運営者</span></li>
    </ul>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.id');
  var input = root.querySelector('.id__input');
  var grid = root.querySelector('.id__grid');

  // FNV-1a 32비트 — 같은 이름은 늘 같은 정수를 돌려준다
  function hash32(text) {
    var h = 2166136261;
    for (var i = 0; i < text.length; i++) {
      h = (h ^ text.charCodeAt(i)) >>> 0;
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  // 비트 15개를 열 0·1·2 에 놓고 열 0↔4 · 1↔3 을 거울처럼 맞춰 25칸을 채운다
  function cellsOf(text) {
    var h = hash32(text);
    var cells = [];
    for (var row = 0; row < 5; row++) {
      var left = [(h >>> (row * 3)) & 1, (h >>> (row * 3 + 1)) & 1, (h >>> (row * 3 + 2)) & 1];
      cells.push(left[0], left[1], left[2], left[1], left[0]);
    }
    return cells;
  }

  function buildCells(el) {
    for (var i = 0; i < 25; i++) {
      var cell = document.createElement('span');
      cell.className = 'id__cell';
      el.appendChild(cell);
    }
  }

  // 켜진 칸만 클래스가 붙고, 색도 해시로 고른 data-tone 번호가 정한다(scss 가 칠한다)
  function render(el, name) {
    var cells = cellsOf(name);
    el.dataset.tone = String(hash32(name) % 6);
    var kids = el.children;
    for (var i = 0; i < 25; i++) {
      kids[i].classList.toggle('is-on', cells[i] === 1);
      kids[i].style.setProperty('--i', String(i));
    }
  }

  buildCells(grid);
  render(grid, input.value);

  // 작은 무늬 셋 — 名前 표시에서 각각 계산한다
  var items = root.querySelectorAll('.id__item');
  Array.prototype.forEach.call(items, function (item) {
    var mini = item.querySelector('.id__mini');
    buildCells(mini);
    render(mini, item.querySelector('.id__name').textContent);
  });

  // 입력이 바뀌면 그 자리에서 다시 그린다
  input.addEventListener('input', function () { render(grid, input.value); });

  // 사람이 손을 대면 미리보기 루프를 뗀다
  function stopLoop() { root.classList.remove('is-demo'); }
  root.addEventListener('pointerdown', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
