<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar shape and size set — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="as is-demo" data-shape="circle" aria-label="아바타 모양과 크기">
    <div class="as__shapes" role="group" aria-label="모양 고르기">
      <button class="as__shape-btn" type="button" data-shape-btn="circle" aria-pressed="true">
        <span class="as__swatch as__swatch--circle" aria-hidden="true"></span>원
      </button>
      <button class="as__shape-btn" type="button" data-shape-btn="squircle" aria-pressed="false">
        <span class="as__swatch as__swatch--squircle" aria-hidden="true"></span>모난 원
      </button>
      <button class="as__shape-btn" type="button" data-shape-btn="hex" aria-pressed="false">
        <span class="as__swatch as__swatch--hex" aria-hidden="true"></span>육각
      </button>
    </div>

    <div class="as__row">
      <span class="as__slot" style="--size: 28px; --pop-delay: 0ms"><span class="as__av" data-name="디자이너" aria-hidden="true"></span></span>
      <span class="as__slot" style="--size: 36px; --pop-delay: 120ms"><span class="as__av" data-name="디자이너" aria-hidden="true"></span></span>
      <span class="as__slot" style="--size: 48px; --pop-delay: 240ms"><span class="as__av" data-name="디자이너" aria-hidden="true"></span></span>
      <span class="as__slot" style="--size: 64px; --pop-delay: 360ms"><span class="as__av" data-name="디자이너" aria-hidden="true"></span></span>
    </div>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.as');

  // 이니셜은 표시 문자열에서 계산한다 — 하드코딩하지 않아야 en/ja 언어팩에서도 따라간다
  function initialOf(name) {
    var words = (name || '').trim().split(/\s+/);
    if (/[A-Za-z]/.test(words[0].charAt(0))) {
      return words.slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join('');
    }
    return words[0].charAt(0);
  }

  Array.prototype.forEach.call(root.querySelectorAll('.as__av'), function (av) {
    av.textContent = initialOf(av.getAttribute('data-name'));
  });

  // 모양 버튼 — 뿌리의 data-shape 를 갈아 네 아바타가 전부 그 모양이 된다
  var btns = root.querySelectorAll('[data-shape-btn]');
  Array.prototype.forEach.call(btns, function (btn) {
    btn.addEventListener('click', function () {
      root.setAttribute('data-shape', btn.getAttribute('data-shape-btn'));
      Array.prototype.forEach.call(btns, function (b) {
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
    });
  });

  // 사람이 손을 대면 미리보기 루프를 뗀다
  function stopLoop() { root.classList.remove('is-demo'); }
  root.addEventListener('pointerdown', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
