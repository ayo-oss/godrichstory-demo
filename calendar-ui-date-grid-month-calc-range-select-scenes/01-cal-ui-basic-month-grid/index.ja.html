<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>最初の曜日を測って42ますを埋める基本の月グリッド — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="デモの舞台 — SpaceかEnterで一時停止、Rで最初から、左右の矢印キーで別の値へ">
      <div class="ez__scene" data-role="scene" role="img" aria-label="最初の曜日のずれを測って42ますが順に点灯し、隣の月の日付まで埋まる場面"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">場面の準備</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
    // 무대 좌표 — 안쪽 상자는 늘 480x300 이고 화면 폭에 맞춰 통체로 줄인다
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    const SVGW = 448;
    const SVGH = 156;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    // ── 무대 요소
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const SVGNS = 'http://www.w3.org/2000/svg';
    // 장면 안 요소를 만든다. 클래스는 cx 를 거쳐 CSS 모듈 이름으로 바뀐다
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function svgEl(tag, cls, parent) {
        const e = document.createElementNS(SVGNS, tag);
        if (cls) {
            e.setAttribute('class', cx(cls));
        }
        parent.appendChild(e);
        return e;
    }
    function svgPath(parent, cls, d) {
        const p = svgEl('path', cls, parent);
        p.setAttribute('d', d);
        return p;
    }
    function svgText(parent, cls, x, y, txt) {
        const t = svgEl('text', cls, parent);
        t.setAttribute('x', String(x));
        t.setAttribute('y', String(y));
        t.textContent = txt;
        return t;
    }
    function setDraw(p, total, p01) {
        p.setAttribute('stroke-dasharray', String(total));
        p.setAttribute('stroke-dashoffset', String(total * (1 - clamp(p01, 0, 1))));
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        // clkEl(시계)은 sceneEl 에 직접 붙어 있으므로 래퍼만 비운다 — 시계를 지우면 렌더 시계가 죽는다
        scWrap.textContent = '';
        chartEl.textContent = '';
        probeEl.textContent = '';
    }
    // ── 경로 길이 측정 — getTotalLength 는 화면에 붙은 뒤에만 값을 준다 (probe 는 visibility:hidden 상자)
    function measure(d) {
        const svg = document.createElementNS(SVGNS, 'svg');
        svg.setAttribute('viewBox', '0 0 ' + SVGW + ' ' + SVGH);
        svg.setAttribute('class', cx('sc'));
        probeEl.appendChild(svg);
        const p = svgPath(svg, '', d);
        const len = p.getTotalLength();
        probeEl.removeChild(svg);
        return len;
    }
    function pointAt(d, at, vb) {
        void vb;
        const svg = document.createElementNS(SVGNS, 'svg');
        svg.setAttribute('viewBox', '0 0 ' + SVGW + ' ' + SVGH);
        svg.setAttribute('class', cx('sc'));
        probeEl.appendChild(svg);
        const p = svgPath(svg, '', d);
        const pt = p.getPointAtLength(at);
        probeEl.removeChild(svg);
        return { x: pt.x, y: pt.y, y2: 0 };
    }
    // 정점 오프셋 — 시드 해시(재생해도 같은 값). Math.random 을 쓰지 않는다
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    // ── 엔진이 푼 시간 읽기 — 모델이 아니라 getAnimations() 와 getComputedTiming() 값
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function delayOf(a) {
        const t = a.effect ? a.effect.getComputedTiming() : null;
        return t && typeof t.delay === 'number' ? t.delay : 0;
    }
    void delayOf;
    function span(a, max) {
        const t = a.effect ? a.effect.getComputedTiming() : null;
        if (!t) {
            return { s: 0, e: 0, k: 0 };
        }
        const d = typeof t.delay === 'number' ? t.delay : 0;
        const e = typeof t.endTime === 'number' && isFinite(t.endTime) ? t.endTime : max;
        return { s: d, e: Math.min(e, max), k: 0 };
    }
    void span;
    function phaseStr(e) {
        const t = e ? e.getComputedTiming() : null;
        if (!t || t.localTime === null || t.localTime === undefined) {
            return 'none';
        }
        const lt = Number(t.localTime);
        const d = typeof t.delay === 'number' ? t.delay : 0;
        const end = typeof t.endTime === 'number' ? t.endTime : Infinity;
        if (lt < d) {
            return 'before';
        }
        return lt >= end ? 'after' : 'active';
    }
    void phaseStr;
    function phaseOf(a) { return phaseStr(a.effect); }
    void phaseOf;
    // ── 아래 차트 상자 그리기
    function bar(cls, x, y, w, h) {
        const e = make('i', cls, chartEl);
        put(e, x, y, w, h);
        return e;
    }
    function drawRows(segs, max) {
        const n = segs.length;
        const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
        const out = [];
        for (let i = 0; i < n; i += 1) {
            const sg = segs[i];
            const x = CX0 + clamp(sg.s, 0, max) / max * CW;
            const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
            out.push(bar('bar k' + sg.k, x, 5 + i * (h + 1), w, h));
        }
        return out;
    }
    void drawRows;
    function axis(max) {
        const a = make('b', 'ax', chartEl);
        a.textContent = '0';
        put(a, CX0, 40, 0, 0);
        const b = make('b', 'ax ax--r', chartEl);
        b.textContent = f0(max) + 'ms';
        put(b, CX0 + CW - 60, 40, 60, 0);
    }
    function marker(ms, max, cls) {
        bar('mk ' + cls, CX0 + clamp(ms, 0, max) / max * CW, 2, 2, 44);
    }
    void marker;
    let headEl = null;
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    // ── 캘린더 공통 계산 — 달력은 그려 둔 표가 아니라 이 산술이다
    const CELLS = 42; // 6주 고정 — 달마다 그리드 높이가 점프하지 않는다
    const DOW_KO = ['日', '月', '火', '水', '木', '金', '土'];
    // 기준 날짜 — 현재 시각이 아니라 고정 시드(2026-11-15). new Date() 를 쓰지 않는다
    const TODAY = { y: 2026, m: 10, d: 15 }; // m: 0-based (10 = 11月)
    // 그 달의 날 水 — 다음 달 0日 = 이번 달 마지막 날 (UTC 생성자로 시간대 영향을 뺀다)
    function daysInMonth(y, m) {
        return new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    }
    // 첫 요일 오프셋(日曜日 시작) — getUTCDay 로 잰다. 로컬 getDay() 는 시간대 오프셋으로 하루 어긋날 水 있다(06 함정)
    function firstWeekday(y, m) {
        return (new Date(Date.UTC(y, m, 1)).getUTCDay() + 1) % 7;
    }
    // 42칸 각각의 (연, 月, 日) — 앞뒤 이웃 달 날짜(leading-trailing)까지 한 번의 루프로
    function cellDate(i, y, m) {
        const lead = firstWeekday(y, m);
        const len = daysInMonth(y, m);
        const di = i - lead + 1; // 이 달 기준 날짜 번호 (0 이하·초과 = 이웃 달)
        const ny = di <= 0 ? (m === 0 ? y - 1 : y) : (di > len ? (m === 11 ? y + 1 : y) : y);
        const nm = di <= 0 ? (m === 0 ? 11 : m - 1) : (di > len ? (m === 11 ? 0 : m + 1) : m);
        const nd = di <= 0 ? daysInMonth(ny, nm) + di : (di > len ? di - len : di);
        return { y: ny, m: nm, d: nd, out: di <= 0 || di > len };
    }
    // y/m/d 세 값을 따로 비교하는 완전 일치 — 시간대 오프셋으로 하루 어긋나지 않는다
    function matchDate(c, y, m, d) {
        return c.y === y && c.m === m && c.d === d;
    }
    // 日 요일 인덱스(日曜日 시작) — 셋째 자리 0-인덱스 산술
    function dowOf(c) {
        return (new Date(Date.UTC(c.y, c.m, c.d)).getUTCDay() + 1) % 7;
    }
    const MON_LABEL = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    // 그리드 기하 — 장면 448x156 안 7열 6주. 요일 머리 위 14px
    const GRX = 7;
    const GRY = 26;
    const CW2 = 62; // 칸 폭 (7 x 62 = 434)
    const CH2 = 21; // 칸 높이 (6 x 21 = 126, 머리 26 + 126 = 152)
    function cellXY(i) {
        return { x: GRX + (i % 7) * CW2, y: GRY + Math.floor(i / 7) * CH2 };
    }
    function makeGrid(y, m, parent) {
        const board = make('div', 'cal', parent);
        const head = make('div', 'cal__dowrow', board);
        for (let k = 0; k < 7; k += 1) {
            const h = make('b', 'cal__dow', head);
            h.textContent = DOW_KO[k];
            put(h, k * CW2, 0, CW2 - 4, 14);
        }
        const lead = firstWeekday(y, m);
        const trail = CELLS - lead - daysInMonth(y, m);
        const cells = [];
        for (let i = 0; i < CELLS; i += 1) {
            const d = cellDate(i, y, m);
            const el = make('div', 'cal__cell' + (d.out ? ' cal__cell--leading-trailing' : ''), board);
            const p = cellXY(i);
            put(el, p.x, p.y, CW2 - 4, CH2 - 3);
            const bg = make('i', 'cal__bg', el);
            const num = make('b', 'cal__num', el);
            num.textContent = f0(d.d);
            cells.push({ el: el, bg: bg, num: num, d: d });
        }
        return { board: board, cells: cells, lead: lead, trail: trail };
    }
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            cycle = Math.max(2000, cfg.build(pi));
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                setPaused(true);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            // 움직임 줄이기 — 모든 애니메이션이 꺼지고 장면은 완성 상태 한 장이다 (build 마지막 프레임을 그린다)
            statusP.textContent = '動きを減らす設定 · 完成状態の一枚';
            readB.textContent = '切替なしで、計算済みグリッドの最終形だけを示す';
            doneP.textContent = readB.textContent;
            cfg.frame(1e9);
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }
    // 01 기본 월간 그리드 — 그 달의 1日 요일로 lead 를 재고 (lead + 날수) 를 42칸에 채운다. 이웃 달 날짜는 회색(leading-trailing)
    // getDay — 로컬 생성자 판. 06 함정 시연과 짝: 실제 배치는 getUTCDay(firstWeekday) 로 잰다
    const localDow = new Date(2026, 10, 1).getDay();
    const SCAN_MS = 2600;
    const PRESETS = [{ y: 2026, m: 10 }, { y: 2027, m: 1 }]; // lead 0(11月) vs lead 1(2月)
    let pi0 = 0;
    let g = null;
    let capEl = null;
    let leadEl = null;
    function build(i) {
        pi0 = i;
        const p = PRESETS[i];
        g = makeGrid(p.y, p.m, scWrap);
        put(g.board, 0, 0, 448, 156);
        capEl = make('b', 'ov', sceneEl);
        put(capEl, 0, 2, 200, 14);
        capEl.style.fontSize = '13px';
        capEl.style.fontWeight = '800';
        capEl.style.color = '#17141a';
        capEl.textContent = p.y + '年 ' + MON_LABEL[p.m];
        leadEl = make('b', 'ov', sceneEl);
        put(leadEl, 300, 2, 148, 14);
        leadEl.style.fontSize = '10px';
        leadEl.style.fontWeight = '700';
        leadEl.style.textAlign = 'right';
        leadEl.style.color = 'rgba(23,20,26,.62)';
        leadEl.textContent = 'lead ' + g.lead + ' · trail ' + g.trail;
        const rowA = bar('bar k0', CX0, 5, CW * 30 / 100, 7);
        const rowB = bar('bar k1', CX0 + CW * 52 / 100, 13, CW * 44 / 100, 7);
        void rowA;
        void rowB;
        const labA = make('b', 'ax', chartEl);
        put(labA, CX0, 24, 200, 12);
        labA.textContent = '今月の日付を埋める';
        const labB = make('b', 'ax', chartEl);
        put(labB, CX0 + CW * 52 / 100, 32, 200, 12);
        labB.textContent = '翌月へ続く';
        void labB;
        axis(SCAN_MS);
        return SCAN_MS + 400;
    }
    function frame(t) {
        if (!g) {
            return '';
        }
        const prog = clamp(t / SCAN_MS, 0, 1);
        const lit = Math.floor(prog * CELLS);
        let inMonthLit = 0;
        for (let i = 0; i < CELLS; i += 1) {
            const c = g.cells[i];
            const on = i <= lit && !c.d.out;
            c.bg.style.opacity = on ? '1' : '0';
            c.el.style.background = on ? '#17141a' : (c.d.out && i <= lit ? '#efe7dc' : 'transparent');
            c.num.style.color = on ? '#fff7e6' : (c.d.out ? 'rgba(23,20,26,.38)' : '#17141a');
            if (on) {
                inMonthLit += 1;
            }
        }
        sceneEl.style.background = lit >= CELLS - 1 ? '#ffffff' : '#f3ece1';
        const lead = firstWeekday(PRESETS[pi0].y, PRESETS[pi0].m);
        void localDow;
        setReads(fill('CELLS 42 · 前 {a} · 後 {b} · 今月 {c}日', f0(g.lead), f0(g.trail), f0(daysInMonth(2026, 10))), fill('最初の曜日のずれ = (getDay() + 1) % 7 = {a} — 2026年11月は日曜始まり', f0(lead)));
        return fill('42ますのうち{a}ます点灯 — 前{b}ますは先月、後{c}ますは翌月から', f0(inMonthLit), f0(g.lead), f0(g.trail));
    }
    return run({ count: PRESETS.length, build: build, frame: frame });
}
})();
</script>
