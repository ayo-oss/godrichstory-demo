<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>都市をつなぐ航路曲線 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ga" id="ga">
  <p class="ga__hint">
    <svg class="ga__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M128 24a104 104 0 1 0 104 104A104.12 104.12 0 0 0 128 24" opacity=".2"/><path d="M176 56h-48a8 8 0 0 0 0 16h48a8 8 0 0 0 0-16m0 32h-48a8 8 0 0 0 0 16h48a8 8 0 0 0 0-16m0 32h-96a8 8 0 0 0 0 16h96a8 8 0 0 0 0-16m0 32h-48a8 8 0 0 0 0 16h48a8 8 0 0 0 0-16m0 32h-48a8 8 0 0 0 0 16h48a8 8 0 0 0 0-16" fill-rule="evenodd"/><path d="M88 56a24 24 0 1 0 24 24a24 24 0 0 0-24-24m0 32a8 8 0 1 1 8-8a8 8 0 0 1-8 8" fill-rule="evenodd"/></g></svg>
    <span>光る点が大円の航路に沿って流れます</span>
  </p>
  <div class="ga__field" id="field" role="application" aria-label="航路曲線の実験台" tabindex="0" data-path="great-circle">
    <canvas class="ga__cv" id="cv"></canvas>
  </div>
</div>
</main>
<script>
// 대원 곡선 항로 — 두 도시(단위구 위 3D 점)를 잇는 최단 경로는 대원(great-circle)이다.
// 두 점을 구면 선형 보간(slerp)으로 잇고, 호가 구에서 살짝 뜨도록(반경 1.06배) 지구본 위에 그린다.
// 화면 투영은 정사도. 뒷면(z&lt;0) 세그먼트는 선에서 펜을 들어 감춘다.
var root = document.getElementById('ga');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

var TAU = Math.PI * 2;
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1;

// 도시 — [위도deg, 경도deg, 표시 이름 생략(그리지 않음 — 점만)]
var CITIES = [
  { lat: 37.57, lon: 126.98 },   // 서울
  { lat: 40.71, lon: -74.01 },   // 뉴욕
  { lat: 51.51, lon: -0.13 },    // 런던
  { lat: 35.68, lon: 139.69 },   // 도쿄
  { lat: -33.87, lon: 151.21 },  // 시드니
  { lat: -23.55, lon: -46.63 },  // 상파울루
  { lat: 1.35, lon: 103.82 },    // 싱가포르
  { lat: 19.43, lon: -99.13 }    // 멕시코시티
];
function toXYZ(c) {
  var la = c.lat * Math.PI / 180, lo = c.lon * Math.PI / 180;
  return { x: Math.cos(la) * Math.sin(lo), y: Math.sin(la), z: Math.cos(la) * Math.cos(lo) };
}
var P = CITIES.map(toXYZ);

// 항로 — 도시 쌍. 발광점이 각 항로를 저마다 다른 속도로 흐른다
var ROUTES = [
  { a: 0, b: 1, speed: 0.30, offset: 0.0 },
  { a: 0, b: 2, speed: 0.24, offset: 0.55 },
  { a: 3, b: 4, speed: 0.27, offset: 0.3 },
  { a: 1, b: 5, speed: 0.22, offset: 0.8 },
  { a: 6, b: 3, speed: 0.34, offset: 0.15 },
  { a: 2, b: 7, speed: 0.26, offset: 0.65 },
  { a: 4, b: 5, speed: 0.20, offset: 0.45 }
];

var ARC_LIFT = 1.10;      // 호가 구 위로 뜨는 배율
var rotY = 0;
var last = 0, raf = 0;

// slerp — 구면 선형 보간. omega 는 두 점 사이 중심각
function slerp(p0, p1, t) {
  var dot = p0.x * p1.x + p0.y * p1.y + p0.z * p1.z;
  dot = Math.max(-1, Math.min(1, dot));
  var omega = Math.acos(dot);
  if (omega < 1e-5) return { x: p0.x, y: p0.y, z: p0.z };
  var so = Math.sin(omega);
  var k0 = Math.sin((1 - t) * omega) / so;
  var k1 = Math.sin(t * omega) / so;
  return { x: p0.x * k0 + p1.x * k1, y: p0.y * k0 + p1.y * k1, z: p0.z * k0 + p1.z * k1 };
}

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function rot(p) {
  // 지구본 자전 — y축 회전 한 번
  var c = Math.cos(rotY), s = Math.sin(rotY);
  return { x: p.x * c + p.z * s, y: p.y, z: -p.x * s + p.z * c };
}

function draw(t) {
  ctx.clearRect(0, 0, W, H);
  var cx = W / 2, cy = H / 2;
  var R = Math.min(W, H) * 0.43;

  var cs = getComputedStyle(root);
  var C_sphere = cs.getPropertyValue('--ga-sphere').trim();
  var C_rim = cs.getPropertyValue('--ga-rim').trim();
  var C_grid = cs.getPropertyValue('--ga-grid').trim();
  var C_arc = cs.getPropertyValue('--ga-arc').trim();
  var C_arcDim = cs.getPropertyValue('--ga-arc-dim').trim();
  var C_city = cs.getPropertyValue('--ga-city').trim();
  var C_glow = cs.getPropertyValue('--ga-glow').trim();

  // 구 바닥 — 하이라이트 중심이 시간과 함께 천천히 도는 그라디언트(면 자체가 변한다)
  var hx = cx + Math.cos(t * 0.23) * R * 0.38;
  var hy = cy - Math.sin(t * 0.23) * R * 0.30;
  var gg = ctx.createRadialGradient(hx, hy, R * 0.08, cx, cy, R);
  gg.addColorStop(0, C_grid);
  gg.addColorStop(1, C_sphere);
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.fillStyle = gg;
  ctx.fill();
  ctx.strokeStyle = C_rim;
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // 은은한 위경도 눈금(뒤면만 흐리게 — backface culling)
  ctx.strokeStyle = C_grid;
  ctx.lineWidth = 1.4;
  for (var lat = -75; lat <= 75; lat += 15) {
    var la = lat * Math.PI / 180, cL = Math.cos(la), sL = Math.sin(la);
    ctx.beginPath();
    var pen = false;
    for (var s = 0; s <= 64; s++) {
      var phi = (s / 64) * TAU;
      var q = rot({ x: cL * Math.sin(phi), y: sL, z: cL * Math.cos(phi) });
      if (q.z >= 0) {
        var px = cx + q.x * R, py = cy - q.y * R;
        if (pen) ctx.lineTo(px, py); else { ctx.moveTo(px, py); pen = true; }
      } else pen = false;
    }
    ctx.stroke();
  }

  // ── 항로 아크 — 앞면(z&gt;=0)만 잇는다
  function arcPath(p0, p1, lift) {
    var pts = [];
    for (var i = 0; i <= 72; i++) {
      var tt = i / 72;
      var g = slerp(p0, p1, tt);
      // 끝점은 표면에, 중간은 뜬다 — sin 피크로 호 높이를 만든다
      var h = 1 + (lift - 1) * Math.sin(tt * Math.PI);
      g = { x: g.x * h, y: g.y * h, z: g.z * h };
      pts.push(rot(g));
    }
    return pts;   // great-circle 경로 — slerp 로 얻은 최단 호
  }

  for (var ri = 0; ri < ROUTES.length; ri++) {
    var rt = ROUTES[ri];
    var pts = arcPath(P[rt.a], P[rt.b], ARC_LIFT);
    ctx.beginPath();
    var pen2 = false;
    var anyFront = false;
    for (var k = 0; k < pts.length; k++) {
      var q2 = pts[k];
      if (q2.z >= -0.06) {          // 호는 표면보다 떠 있으니 림까지 조금 여유
        var px2 = cx + q2.x * R, py2 = cy - q2.y * R;
        if (pen2) ctx.lineTo(px2, py2); else { ctx.moveTo(px2, py2); pen2 = true; }
        anyFront = true;
      } else pen2 = false;
    }
    if (anyFront) {
      // 아크 헤일로 — 얇은 선보다 넓게 빛나 자각 면적을 키운다
      ctx.strokeStyle = C_arc;
      ctx.globalAlpha = 0.16;
      ctx.lineWidth = 5.5;
      ctx.stroke();
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 2.6;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    // ── 발광점 — slerp t 가 시간에 따라 흐른다
    var tp = (t * rt.speed + rt.offset) % 1;
    var g2 = slerp(P[rt.a], P[rt.b], tp);
    var h2 = 1 + (ARC_LIFT - 1) * Math.sin(tp * Math.PI);
    var gp = rot({ x: g2.x * h2, y: g2.y * h2, z: g2.z * h2 });
    if (gp.z >= -0.06) {
      var gx = cx + gp.x * R, gy = cy - gp.y * R;
      // 헤일로
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = C_glow;
      ctx.beginPath();
      ctx.arc(gx, gy, 6.5, 0, TAU);
      ctx.fill();
      // 코어
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(gx, gy, 2.1, 0, TAU);
      ctx.fill();
      // 짧은 꼬리 — 흘러온 방향으로 옅게
      var tb = Math.max(0, tp - 0.06);
      var g3 = slerp(P[rt.a], P[rt.b], tb);
      var h3 = 1 + (ARC_LIFT - 1) * Math.sin(tb * Math.PI);
      var gq = rot({ x: g3.x * h3, y: g3.y * h3, z: g3.z * h3 });
      if (gq.z >= -0.06) {
        ctx.strokeStyle = C_glow;
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx + gq.x * R, cy - gq.y * R);
        ctx.lineTo(gx, gy);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  // ── 도시 점 — 앞면만. 펄스 링이 커지며 자각 면적을 더한다
  for (var ci = 0; ci < P.length; ci++) {
    var q3 = rot(P[ci]);
    if (q3.z < 0) continue;
    var px3 = cx + q3.x * R, py3 = cy - q3.y * R;
    ctx.fillStyle = C_city;
    ctx.beginPath();
    ctx.arc(px3, py3, 2.8, 0, TAU);
    ctx.fill();
    // 링 펄스 — 도시가 살아 있음을 보여주는 작은 확산
    var ph = (t * 0.8 + ci * 0.13) % 1;
    ctx.globalAlpha = (1 - ph) * 0.65;
    ctx.strokeStyle = C_city;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(px3, py3, 2.8 + ph * 12, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function frame(now) {
  var dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
  last = now;
  rotY += dt * 0.34;
  draw(now * 0.001);
  raf = requestAnimationFrame(frame);
}

window.addEventListener('resize', function () { fit(); draw(0); });

fit();
if (reduce) {
  draw(0);
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
