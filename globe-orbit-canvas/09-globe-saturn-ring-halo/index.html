<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토성 고리 지구본 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rh" id="rh">
  <p class="rh__hint">
    <svg class="rh__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><ellipse cx="128" cy="128" rx="100" ry="36" fill="none" stroke="currentColor" stroke-width="10" opacity=".35"/><circle cx="128" cy="128" r="52"/></g></svg>
    <span>고리의 절반은 구 뒤로, 절반은 구 앞으로 — 앞뒤를 갈라 그립니다</span>
  </p>
  <div class="rh__field" id="field" role="img" aria-label="토성 고리 지구본">
    <canvas class="rh__cv" id="cv"></canvas>
  </div>
</div>
</main>
<script>
// 토성 고리 지구본 — 기울어진 타원 고리를 구 앞/뒤로 나눠 그린다(occlusion split).
// 고리 위 각 점을 지구본과 같은 Y축 자전 + X축 기울기로 회전시켜 z 부호로 앞/뒤를 가른다.
// 뒤(z<0)는 구보다 먼저, 앞(z>=0)은 구보다 나중에 그려 자연스러운 가림을 만든다(painter's algorithm 변형).
// 원근 스케일(perspective scale) — 카메라에서 먼 부분은 살짝 작게 그려 깊이를 강조한다.
var root = document.getElementById('rh');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

var TAU = Math.PI * 2;
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1;
var last = 0, raf = 0;
var rotY = 0;
var TILT = 0.62;          // 고리 기울기(x축 회전) — 고정, 토성 특유의 각도

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// 고리 위 점(반지름 rad, 각도 phi)을 기울이고 자전시켜 카메라 좌표로
function ringPoint(rad, phi) {
  var x0 = Math.cos(phi) * rad, z0 = Math.sin(phi) * rad, y0 = 0;
  // x축 기울기(TILT)
  var y1 = y0 * Math.cos(TILT) - z0 * Math.sin(TILT);
  var z1 = y0 * Math.sin(TILT) + z0 * Math.cos(TILT);
  // y축 자전(rotY)
  var x2 = x0 * Math.cos(rotY) + z1 * Math.sin(rotY);
  var z2 = -x0 * Math.sin(rotY) + z1 * Math.cos(rotY);
  return { x: x2, y: y1, z: z2 };
}

function drawRingHalf(ctx, cx, cy, R, colorInner, colorOuter, wantFront) {
  var innerR = R * 1.35, outerR = R * 1.85;
  var steps = 160;
  ctx.lineWidth = (outerR - innerR) / R * R * 0.02;
  for (var band = 0; band < 3; band++) {
    var rad = innerR + (outerR - innerR) * (band / 2.4);
    ctx.beginPath();
    var pen = false;
    for (var s = 0; s <= steps; s++) {
      var phi = (s / steps) * TAU;
      var q = ringPoint(rad, phi);
      var isFront = q.z >= 0;
      if (isFront === wantFront) {
        var perspectiveScale = 1 + q.z * 0.06;   // 원근 스케일 — z 에 따라 살짝 확대/축소
        var px = cx + q.x * R * perspectiveScale;
        var py = cy - q.y * R * perspectiveScale;
        if (pen) ctx.lineTo(px, py); else { ctx.moveTo(px, py); pen = true; }
      } else pen = false;
    }
    ctx.strokeStyle = band === 1 ? colorOuter : colorInner;
    ctx.globalAlpha = wantFront ? 0.92 : 0.55;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  var cx = W / 2, cy = H / 2;
  var R = Math.min(W, H) * 0.24;

  var cs = getComputedStyle(root);
  var C_sphere = cs.getPropertyValue('--rh-sphere').trim();
  var C_deep = cs.getPropertyValue('--rh-deep').trim();
  var C_ring = cs.getPropertyValue('--rh-ring').trim();
  var C_ringHi = cs.getPropertyValue('--rh-ring-hi').trim();

  // 1) 고리 뒷부분(구 뒤로 지나가는 절반)
  drawRingHalf(ctx, cx, cy, R, C_ring, C_ringHi, false);

  // 2) 지구본 — 편구 셰이딩
  var g = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R);
  g.addColorStop(0, C_deep);
  g.addColorStop(1, C_sphere);
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.fillStyle = g;
  ctx.fill();

  // 3) 고리 앞부분(구 앞을 지나가는 절반) — 지구본을 덮어 가림을 완성
  drawRingHalf(ctx, cx, cy, R, C_ring, C_ringHi, true);
}

function frame(now) {
  var dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
  last = now;
  rotY += dt * 0.26;
  draw();
  raf = requestAnimationFrame(frame);
}

window.addEventListener('resize', function () { fit(); draw(); });

fit();
if (reduce) {
  draw();
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
