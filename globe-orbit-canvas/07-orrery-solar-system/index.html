<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>케플러 제2법칙 오러리 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="or" id="or">
  <p class="or__hint">
    <svg class="or__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M128 24a104 104 0 1 0 104 104A104.12 104.12 0 0 0 128 24" opacity=".2"/><path d="M128 72a56 56 0 1 0 56 56a56.06 56.06 0 0 0-56-56m0 96a40 40 0 1 1 40-40a40 40 0 0 1-40 40" fill-rule="evenodd"/></g></svg>
    <span>근일점에서 빨라지고 원일점에서 느려집니다 — 같은 시간에 같은 넓이를 쓸어갑니다</span>
  </p>
  <div class="or__field" id="field" role="img" aria-label="태양계 오러리 실험판">
    <canvas class="or__cv" id="cv"></canvas>
  </div>
</div>
</main>
<script>
// 오러리(태양계 모형) — 각 행성은 타원 궤도 위에서 케플러 제2법칙(면적 속도 일정)을 따른다.
// 극좌표 타원 r(theta) = a(1-e^2)/(1+e*cos(theta)) 을 쓰고, 각속도를 dtheta/dt = L / r^2 로 매 프레임
// 수치적분한다(L 은 궤도별 각운동량 상수) — 근일점에서 빠르고 원일점에서 느려지는 진짜 이유다.
var root = document.getElementById('or');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

var TAU = Math.PI * 2;
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1;
var last = 0, raf = 0;

// 행성 — a(장반경 배율) e(이심률) L(각운동량 상수, 클수록 빠르게 돈다) theta0(시작각) hue(색 인덱스)
var PLANETS = [
  { a: 0.30, e: 0.10, L: 0.360, theta: 0.3,  r: 3.6, hue: 0 },
  { a: 0.46, e: 0.05, L: 0.290, theta: 2.1,  r: 4.6, hue: 1 },
  { a: 0.64, e: 0.16, L: 0.265, theta: 4.4,  r: 4.2, hue: 2 },
  { a: 0.84, e: 0.08, L: 0.225, theta: 1.0,  r: 5.4, hue: 3 },
  { a: 1.08, e: 0.22, L: 0.205, theta: 5.6,  r: 6.2, hue: 4 }
];
// 각 행성의 궤적 잔상 — 최근 위치를 저장해 옅게 그린다(면적 속도 변화를 눈으로 보여줌)
for (var pi = 0; pi < PLANETS.length; pi++) PLANETS[pi].trail = [];

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// r(theta) — 초점이 원점(태양)인 타원의 극좌표식
function radiusAt(p, theta) {
  return p.a * (1 - p.e * p.e) / (1 + p.e * Math.cos(theta));
}

function step(dt) {
  for (var i = 0; i < PLANETS.length; i++) {
    var p = PLANETS[i];
    var r = radiusAt(p, p.theta);
    var dtheta = p.L / (r * r);          // 케플러 제2법칙: dA/dt = (1/2) r^2 dtheta/dt = const = L/2
    p.theta = (p.theta + dtheta * dt) % TAU;
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  var cx = W / 2, cy = H / 2;
  var scale = Math.min(W, H) * 0.46;

  var cs = getComputedStyle(root);
  var C_sun = cs.getPropertyValue('--or-sun').trim();
  var C_sunGlow = cs.getPropertyValue('--or-sun-glow').trim();
  var C_orbit = cs.getPropertyValue('--or-orbit').trim();
  var colors = [
    cs.getPropertyValue('--or-p0').trim(),
    cs.getPropertyValue('--or-p1').trim(),
    cs.getPropertyValue('--or-p2').trim(),
    cs.getPropertyValue('--or-p3').trim(),
    cs.getPropertyValue('--or-p4').trim()
  ];

  // 궤도 타원 경로(고정, 은은하게)
  ctx.strokeStyle = C_orbit;
  ctx.lineWidth = 1;
  for (var k = 0; k < PLANETS.length; k++) {
    var pk = PLANETS[k];
    ctx.beginPath();
    for (var s = 0; s <= 96; s++) {
      var th = (s / 96) * TAU;
      var rr = radiusAt(pk, th);
      var x = cx + Math.cos(th) * rr * scale;
      var y = cy + Math.sin(th) * rr * scale * 0.62;   // 살짝 눌러 원근감(탑뷰 기울임)
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }

  // 태양
  var sg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 16);
  sg.addColorStop(0, C_sunGlow);
  sg.addColorStop(1, C_sun);
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(cx, cy, 20, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = C_sun;
  ctx.beginPath(); ctx.arc(cx, cy, 7, 0, TAU); ctx.fill();

  // 행성 + 궤적 + 쓸어간 면적 부채꼴(제2법칙 — 같은 시간에 같은 넓이)
  for (var i = 0; i < PLANETS.length; i++) {
    var p = PLANETS[i];
    var r2 = radiusAt(p, p.theta);
    var px = cx + Math.cos(p.theta) * r2 * scale;
    var py = cy + Math.sin(p.theta) * r2 * scale * 0.62;

    // 최근 각도 구간을 태양 중심 부채꼴로 옅게 채운다 — 근일점에서는 넓고 빠르게,
    // 원일점에서는 좁고 느리게 쓸리는 것이 그대로 보인다
    var SPAN = 1.35;   // 부채꼴 각폭(rad)
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    for (var sa = 0; sa <= 24; sa++) {
      var sth = p.theta - SPAN + (SPAN * 2) * (sa / 24);
      var srr = radiusAt(p, sth);
      var sx2 = cx + Math.cos(sth) * srr * scale;
      var sy2 = cy + Math.sin(sth) * srr * scale * 0.62;
      ctx.lineTo(sx2, sy2);
    }
    ctx.closePath();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = colors[p.hue];
    ctx.fill();
    ctx.globalAlpha = 1;

    // 궤적 잔상
    p.trail.push({ x: px, y: py });
    if (p.trail.length > 14) p.trail.shift();
    for (var t = 0; t < p.trail.length; t++) {
      var a = (t / p.trail.length) * 0.5;
      ctx.globalAlpha = a;
      ctx.fillStyle = colors[p.hue];
      ctx.beginPath();
      ctx.arc(p.trail[t].x, p.trail[t].y, p.r * 0.62, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 행성 몸통 + 헤일로
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = colors[p.hue];
    ctx.beginPath();
    ctx.arc(px, py, p.r * 2.6, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(px, py, p.r, 0, TAU);
    ctx.fill();
  }
}

function frame(now) {
  var dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
  last = now;
  step(dt);
  draw();
  raf = requestAnimationFrame(frame);
}

window.addEventListener('resize', function () { fit(); draw(); });

fit();
if (reduce) {
  draw();
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
