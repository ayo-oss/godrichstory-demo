<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>散らばり集まる粒子地球儀 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pa" id="pa">
  <p class="pa__hint">
    <svg class="pa__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M128 24a104 104 0 1 0 104 104A104.12 104.12 0 0 0 128 24" opacity=".2"/><path d="M197.67 186.37a99.2 99.2 0 0 1-11.3 11.3a8 8 0 0 1-10.72-11.87a83.2 83.2 0 0 0 9.48-9.48a8 8 0 1 1 12.54 9.95Zm-27.98 20.2a99.1 99.1 0 0 1-15.4 6.3a8 8 0 0 1-4.9-15.24a83 83 0 0 0 12.9-5.28a8 8 0 0 1 7.4 14.22ZM128 216a88 88 0 1 1 88-88a8 8 0 0 1-16 0a72 72 0 1 0-72 72a8 8 0 0 1 0 16" fill-rule="evenodd"/></g></svg>
    <span>散らばった粒子がイージングで球になり、また散らばります</span>
  </p>
  <div class="pa__field" id="field" role="img" aria-label="粒子アセンブル地球儀">
    <canvas class="pa__cv" id="cv"></canvas>
  </div>
</div>
</main>
<script>
// 粒子アセンブル地球儀 — N 개의 입자가 흩어진 랜덤 시작점에서 피보나치 구 목표점으로 이징 보간(lerp)한다.
// 사이클: 흩어짐(hold) -> 모임(ease) -> 구 형태 유지(hold, 자전) -> 흩어짐(ease) -> 반복.
// z 깊이로 크기·알파를 조절해 입체감을 준다(정사도 투영, 01/02 번과 같은 방식).
var root = document.getElementById('pa');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

var TAU = Math.PI * 2;
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1;
var last = 0, raf = 0;

var N = 260;
var GOLDEN = Math.PI * (3 - Math.sqrt(5));

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rnd = mulberry32(304);

var particles = [];
for (var i = 0; i < N; i++) {
  // 목표 — 피보나치 구 분포
  var y = 1 - 2 * (i + 0.5) / N;
  var rad = Math.sqrt(Math.max(0, 1 - y * y));
  var phi = i * GOLDEN;
  var tx = Math.cos(phi) * rad, ty = y, tz = Math.sin(phi) * rad;
  // 시작 — 화면 전체에 흩어진 랜덤 위치(구 밖 먼 곳, 깊이도 랜덤)
  var sx = (rnd() * 2 - 1) * 2.2, sy = (rnd() * 2 - 1) * 2.2, sz = (rnd() * 2 - 1) * 2.2;
  particles.push({ sx: sx, sy: sy, sz: sz, tx: tx, ty: ty, tz: tz, jt: rnd() * TAU, sp: 0.6 + rnd() * 0.8 });
}

function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

// 사이클 타임라인(초) — hold(흩어짐) -> assemble -> hold(구) -> disperse -> 반복
var T_HOLD_OUT = 1.2, T_ASSEMBLE = 2.6, T_HOLD_IN = 2.6, T_DISPERSE = 2.6;
var CYCLE = T_HOLD_OUT + T_ASSEMBLE + T_HOLD_IN + T_DISPERSE;
var clock = 0;
var rotY = 0;

function phaseOf(clock) {
  var c = clock % CYCLE;
  if (c < T_HOLD_OUT) return { k: 'out', t: 0 };
  c -= T_HOLD_OUT;
  if (c < T_ASSEMBLE) return { k: 'assemble', t: easeInOut(c / T_ASSEMBLE) };
  c -= T_ASSEMBLE;
  if (c < T_HOLD_IN) return { k: 'in', t: 1 };
  c -= T_HOLD_IN;
  return { k: 'disperse', t: easeInOut(c / T_DISPERSE) };
}

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  var cx = W / 2, cy = H / 2;
  var R = Math.min(W, H) * 0.34;

  var cs = getComputedStyle(root);
  var C_near = cs.getPropertyValue('--pa-near').trim();
  var C_far = cs.getPropertyValue('--pa-far').trim();

  var ph = phaseOf(clock);
  var t = ph.k === 'assemble' ? ph.t : (ph.k === 'disperse' ? 1 - ph.t : (ph.k === 'in' ? 1 : 0));

  var c = Math.cos(rotY), s = Math.sin(rotY);

  var order = [];
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var lx = p.sx + (p.tx - p.sx) * t;
    var ly = p.sy + (p.ty - p.sy) * t;
    var lz = p.sz + (p.tz - p.sz) * t;
    // 자전은 조립 상태에 가까울수록 의미가 있다 — t 가 클수록 회전 반영 비중을 높인다
    var rx = lx * c + lz * s;
    var rz = -lx * s + lz * c;
    order.push({ x: rx, y: ly, z: rz, jt: p.jt, sp: p.sp });
  }
  order.sort(function (a, b) { return a.z - b.z; });

  for (var k = 0; k < order.length; k++) {
    var o = order[k];
    var depth = (o.z + 2.2) / 4.4;
    var px = cx + o.x * R, py = cy - o.y * R;
    var tw = 0.65 + Math.sin(clock * o.sp + o.jt) * 0.35;
    ctx.globalAlpha = (0.25 + depth * 0.75) * tw;
    var rr = 1.1 + depth * 1.8;
    ctx.fillStyle = depth > 0.55 ? C_near : C_far;
    ctx.beginPath();
    ctx.arc(px, py, rr, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function frame(now) {
  var dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
  last = now;
  clock += dt;
  rotY += dt * 0.22;
  draw();
  raf = requestAnimationFrame(frame);
}

window.addEventListener('resize', function () { fit(); draw(); });

fit();
if (reduce) {
  clock = T_HOLD_OUT + T_ASSEMBLE + 0.5;   // 정적 프레임 — 조립된 구 상태를 보여준다
  draw();
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
