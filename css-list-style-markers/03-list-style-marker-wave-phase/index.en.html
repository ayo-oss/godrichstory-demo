<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase wave marker — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <ul class="wave-list" id="list">
    <li style="--i:0">Track 01 · Dawn walk</li>
    <li style="--i:1">Track 02 · Window seat</li>
    <li style="--i:2">Track 03 · Late umbrella</li>
    <li style="--i:3">Track 04 · First snow</li>
    <li style="--i:4">Track 05 · The station</li>
  </ul>
  <button class="speed" id="speed" type="button">Switch the wave speed</button>
</div>
<script>
(function () {
  var WAVE_PHASE_DEG = 40; // 항목 사이 위상차 — 변형 03 목표: 40 → 80
  var AMPLITUDE_PX = 6;
  var SPEEDS = [1, 2, 0.5]; // 배속 프리셋
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var list = document.getElementById('list');
  var items = Array.prototype.slice.call(list.querySelectorAll('li'));
  var button = document.getElementById('speed');
  var isDemo = true;
  var speedIdx = 0;

  var PHASE_RAD = WAVE_PHASE_DEG * Math.PI / 180;

  // 계산 겹: 각 불릿의 세로 위치는 사인 함수에 항목 번호만큼 위상을 밀어 넣은 값이다.
  // t(공통 시간) 는 흐르되 위상이 다르면 같은 순간에도 서로 다른 높이가 된다 — 이것이 "물결"의 원리다.
  function apply(t) {
    var speed = SPEEDS[speedIdx];
    items.forEach(function (el, i) {
      var phase = i * PHASE_RAD;
      var y = AMPLITUDE_PX * Math.sin(t * speed + phase);
      el.style.setProperty('--y', y.toFixed(2) + 'px');
    });
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  button.addEventListener('click', function () {
    human();
    speedIdx = (speedIdx + 1) % SPEEDS.length;
  });

  var start = 0;
  function loop(ts) {
    if (!start) start = ts;
    if (isDemo) {
      if (reduce) {
        apply(Math.PI / 2); // 계산은 유지, 시간 축소 대신 파고 정점 위상으로 즉시 고정
      } else {
        apply((ts - start) / 260);
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  apply(0);
})();
</script>
</main>
</body>
</html>
