<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연쇄 체크 마커 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <ul class="done-list" id="list">
    <li style="--i:0">계약서 확인</li>
    <li style="--i:1">결제 정보 등록</li>
    <li style="--i:2">배송지 입력</li>
    <li style="--i:3">최종 제출</li>
  </ul>
  <button class="submit" id="submit" type="button">전체 제출</button>
</div>
<script>
(function () {
  var DELAY_STEP_MS = 110; // 항목 사이 누적 지연 — 값이 커질수록 파동이 느리게 번진다
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var list = document.getElementById('list');
  var items = Array.prototype.slice.call(list.querySelectorAll('li'));
  var button = document.getElementById('submit');
  var isDemo = true;

  // 계산 겹: 항목 i 가 터지는 시각은 지연 값을 i 번 누적한 값(i * DELAY_STEP_MS)이다 — CSS 변수로 실어
  // animation-delay 에 그대로 쓴다. 자바스크립트는 트리거 한 번(클래스 토글)만 하고 연쇄는 CSS 가 계산한다.
  items.forEach(function (li, i) {
    li.style.setProperty('--delay', (i * DELAY_STEP_MS) + 'ms');
  });

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  function burst() {
    list.classList.remove('is-bursting');
    // reflow 를 강제해 같은 클래스를 다시 걸어도 애니메이션이 재시작되게 한다
    void list.offsetWidth;
    list.classList.add('is-bursting');
  }

  button.addEventListener('click', function () { human(); burst(); });

  var last = 0;
  var CYCLE_MS = 950;
  function loop(ts) {
    if (!last) { last = ts; if (isDemo && !reduce) burst(); }
    if (isDemo) {
      if (reduce) {
        list.classList.add('is-bursting'); // 계산은 유지, 시간 축소 대신 완료 상태로 즉시 고정
      } else if (ts - last >= CYCLE_MS) {
        last = ts;
        burst();
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
