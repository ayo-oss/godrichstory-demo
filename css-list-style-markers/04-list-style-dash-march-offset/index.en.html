<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marching dash marker — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <ul class="queue-list" id="list">
    <li>Video encoding queued</li>
    <li>Thumbnail generation queued</li>
    <li>Subtitle alignment queued</li>
  </ul>
  <button class="toggle" id="toggle" type="button" aria-pressed="false">Stop the march</button>
</div>
<script>
(function () {
  var MARCH_RATE_DEG_S = 140; // 초당 회전 각도 — 대시가 흐르는 속도
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var list = document.getElementById('list');
  var markers = Array.prototype.slice.call(list.querySelectorAll('li')).map(function (li) {
    var m = document.createElement('span');
    m.className = 'ring';
    m.setAttribute('aria-hidden', 'true');
    li.insertBefore(m, li.firstChild);
    return m;
  });
  var button = document.getElementById('toggle');
  var isDemo = true;
  var running = true;

  // 계산 겹: 오프셋 각도는 시간에 정속(MARCH_RATE_DEG_S)으로 누적된다. 대시 테두리를 이 각도만큼 계속
  // 회전시키면 점선이 원을 따라 "흐르는" 것처럼 보인다 — 단일 keyframe 반복이 아니라 시간 적분값이다.
  function apply(offsetDeg) {
    markers.forEach(function (m) { m.style.setProperty('--offset', (offsetDeg % 360) + 'deg'); });
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  button.addEventListener('click', function () {
    human();
    running = !running;
    button.setAttribute('aria-pressed', String(!running));
    button.textContent = running ? 'Stop the march' : 'Resume the march';
  });

  var last = 0;
  var acc = 0;
  function loop(ts) {
    if (!last) last = ts;
    var dt = ts - last;
    last = ts;
    if (reduce) {
      apply(90); // 계산은 유지, 시간 축소 대신 4분의1 회전 지점으로 즉시 고정 (자동 루프·실사용 공통)
    } else if (running) {
      acc += dt / 1000 * MARCH_RATE_DEG_S;
      apply(acc);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  apply(0);
})();
</script>
</main>
</body>
</html>
