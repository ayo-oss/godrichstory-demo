<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소수 글로우 마커 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <ol class="prime-list" id="list" start="1">
    <li>변수와 타입</li>
    <li>조건과 반복</li>
    <li>함수와 스코프</li>
    <li>배열과 객체</li>
    <li>비동기 처리</li>
    <li>모듈 시스템</li>
    <li>테스트 작성</li>
  </ol>
  <button class="shift" id="shift" type="button">시작 번호 한 칸 이동</button>
</div>
<script>
(function () {
  var GLOW_PULSE_MS = 1100;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var list = document.getElementById('list');
  var items = Array.prototype.slice.call(list.querySelectorAll('li'));
  var button = document.getElementById('shift');
  var isDemo = true;
  var start = 1;

  // 계산 겹: 각 항목 번호에 소수 판정을 직접 계산한다 — 미리 정해둔 목록이 아니라 실행마다 다시 돈다.
  function isPrime(n) {
    if (n < 2) return false;
    for (var d = 2; d * d <= n; d++) {
      if (n % d === 0) return false;
    }
    return true;
  }

  function recompute() {
    list.setAttribute('start', String(start));
    items.forEach(function (li, i) {
      var n = start + i;
      li.classList.toggle('is-prime', isPrime(n));
    });
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  button.addEventListener('click', function () {
    human();
    start += 1;
    recompute();
  });

  var last = 0;
  var STEP_MS = 900;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce && ts - last >= STEP_MS) {
      last = ts;
      start += 1;
      recompute();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  recompute();
})();
</script>
</main>
</body>
</html>
