<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダイヤル回転マーカー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <ol class="dial-list" id="list">
    <li style="--i:0">設計レビュー</li>
    <li style="--i:1">モックアップ作成</li>
    <li style="--i:2">社内検収</li>
    <li style="--i:3">クライアント確認</li>
    <li style="--i:4">公開完了</li>
  </ol>
  <button class="advance" id="advance" type="button">次の段階へ針を回す</button>
</div>
<script>
(function () {
  var DIAL_STEP_DEG = 30; // 클릭 한 번이 바늘에 더하는 각도 — 변형 01 목표: 30 → 15
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var list = document.getElementById('list');
  var items = Array.prototype.slice.call(list.querySelectorAll('li'));
  var button = document.getElementById('advance');
  var isDemo = true;

  // 계산 겹: 항목 i 의 바늘 각도는 그 항목이 지금까지 지나온 횟수(turns[i]) 에 자기 번호(i+1) 를 곱해 쌓인다.
  // 뒤 항목일수록 같은 한 번의 전진에도 더 큰 각도를 받는다 — 단순 지연이 아니라 번호에 비례한 누적이다.
  var turns = items.map(function () { return 0; });

  function render() {
    items.forEach(function (el, i) {
      var deg = turns[i] * DIAL_STEP_DEG * (i + 1);
      el.style.setProperty('--angle', (deg % 360) + 'deg');
    });
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  var active = 0;
  function advance() {
    turns[active] += 1;
    items[active].classList.add('is-active');
    setTimeout(function () { items[active] && items[active].classList.remove('is-active'); }, 260);
    active = (active + 1) % items.length;
    render();
  }

  button.addEventListener('click', function () { human(); advance(); });

  var last = 0;
  var STEP_MS = 480;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo) {
      if (reduce) {
        turns = items.map(function (_, i) { return i + 1; }); // 계산은 유지, 시간 축소 대신 종료 상태로 즉시 고정
        render();
      } else if (ts - last >= STEP_MS) {
        last = ts;
        advance();
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  render();
})();
</script>
</main>
</body>
</html>
