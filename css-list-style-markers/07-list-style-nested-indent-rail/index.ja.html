<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>階層レールマーカー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <ul class="tree" id="tree">
    <li>サイトマップ
      <ul class="rail" data-depth="1">
        <li>製品
          <ul class="rail" data-depth="2">
            <li>価格案内</li>
            <li>導入事例</li>
          </ul>
        </li>
        <li>カスタマーサポート</li>
      </ul>
    </li>
    <li>会社紹介</li>
  </ul>
  <button class="reveal" id="reveal" type="button">深さをもう1段表示</button>
</div>
<script>
(function () {
  var MAX_DEPTH = 2;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var tree = document.getElementById('tree');
  var rails = Array.prototype.slice.call(tree.querySelectorAll('.rail'));
  var button = document.getElementById('reveal');
  var isDemo = true;
  var revealed = 0;

  // 계산 겹: 레일 각각의 표시 여부는 "지금 공개된 깊이 ≥ 이 레일의 깊이" 라는 비교식의 결과다.
  // 값 하나(revealed)가 바뀌면 그보다 얕은 레일은 전부 즉시 갱신된다 — 레일마다 별도 타이머가 아니다.
  function apply() {
    tree.style.setProperty('--revealed', String(revealed));
    rails.forEach(function (rail) {
      var d = parseInt(rail.getAttribute('data-depth'), 10);
      rail.classList.toggle('is-open', revealed >= d);
    });
    button.setAttribute('aria-expanded', String(revealed >= MAX_DEPTH));
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  function step() {
    revealed = (revealed + 1) % (MAX_DEPTH + 1);
    apply();
  }
  button.addEventListener('click', function () { human(); step(); });

  var last = 0;
  var STEP_MS = 750;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo) {
      if (reduce) {
        revealed = MAX_DEPTH; // 계산은 유지, 시간 축소 대신 완전히 펼쳐진 상태로 즉시 고정
        apply();
      } else if (ts - last >= STEP_MS) {
        last = ts;
        step();
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  apply();
})();
</script>
</main>
</body>
</html>
