<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>走行計カウンターマーカー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <ol class="rank-list" id="list">
    <li data-value="8">コードレビューチャレンジ</li>
    <li data-value="24">週次リリースノート</li>
    <li data-value="61">新規コンポーネント</li>
  </ol>
  <button class="bump" id="bump" type="button">1位の順位を上げる</button>
</div>
<script>
(function () {
  var ODO_DIGITS = 2; // 자릿수 — 변형 02 목표: 2 → 3
  var DIGIT_H = 18; // 숫자 스트립 한 칸 높이(px)
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var list = document.getElementById('list');
  var items = Array.prototype.slice.call(list.querySelectorAll('li'));
  var button = document.getElementById('bump');
  var isDemo = true;

  function buildOdometer(li) {
    var odo = document.createElement('span');
    odo.className = 'odo';
    odo.setAttribute('aria-hidden', 'true');
    for (var d = 0; d < ODO_DIGITS; d++) {
      var col = document.createElement('span');
      col.className = 'odo-col';
      var strip = document.createElement('span');
      strip.className = 'odo-strip';
      for (var n = 0; n < 10; n++) {
        var digit = document.createElement('span');
        digit.className = 'odo-digit';
        digit.textContent = String(n);
        strip.appendChild(digit);
      }
      col.appendChild(strip);
      odo.appendChild(col);
    }
    li.insertBefore(odo, li.firstChild);
    return odo;
  }

  var odos = items.map(buildOdometer);

  // 계산 겹: 카운터 값을 10 의 거듭제곱으로 나눠 자릿수로 분해한다. 각 자릿수 칸은 서로 다른 전환 속도를 가져
  // 낮은 자리부터 먼저 자리를 잡고(빠름) 높은 자리가 뒤따른다(느림) — 단순 opacity 페이드가 아니라 자릿수별 롤링.
  function setDigits(odo, value) {
    var strips = odo.querySelectorAll('.odo-strip');
    for (var d = 0; d < ODO_DIGITS; d++) {
      var place = Math.pow(10, ODO_DIGITS - 1 - d);
      var digit = Math.floor(value / place) % 10;
      strips[d].style.transform = 'translateY(' + (-digit * DIGIT_H) + 'px)';
    }
  }

  function speedClass(odo) {
    var strips = odo.querySelectorAll('.odo-strip');
    strips.forEach(function (s, d) {
      // d=0(가장 왼쪽=가장 높은 자리)이 가장 느리고, 오른쪽(낮은 자리)일수록 빠르다
      var ms = 260 + d * 220;
      s.style.transitionDuration = ms + 'ms';
    });
  }
  odos.forEach(speedClass);

  var values = items.map(function (li) { return parseInt(li.getAttribute('data-value'), 10); });
  function render() {
    items.forEach(function (li, i) { setDigits(odos[i], values[i] % Math.pow(10, ODO_DIGITS)); });
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  function bump() {
    values[0] = (values[0] + 7) % Math.pow(10, ODO_DIGITS);
    render();
  }
  button.addEventListener('click', function () { human(); bump(); });

  var last = 0;
  var STEP_MS = 620;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo) {
      if (reduce) {
        values = [42, 97, 5]; // 계산은 유지, 시간 축소 대신 굴러간 결과 상태로 즉시 고정
        render();
      } else if (ts - last >= STEP_MS) {
        last = ts;
        bump();
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  render();
})();
</script>
</main>
</body>
</html>
