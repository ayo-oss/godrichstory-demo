<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하이브리드 교체 마커 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <ul class="task-list" id="list">
    <li data-state="0"><button class="marker" type="button" aria-label="상태 전환: 대기 중">대기 중</button><span class="label">디자인 시안 승인</span></li>
    <li data-state="1"><button class="marker" type="button" aria-label="상태 전환: 진행 중">진행 중</button><span class="label">배너 애니메이션 제작</span></li>
    <li data-state="2"><button class="marker" type="button" aria-label="상태 전환: 완료">완료</button><span class="label">문구 교정</span></li>
  </ul>
</div>
<script>
(function () {
  var BASE_AREA = 400; // 마커 기준 면적(px^2) — 두께는 면적/지름 으로 역산해 커질수록 얇아진다
  var STATES = ['대기 중', '진행 중', '완료'];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var list = document.getElementById('list');
  var rows = Array.prototype.slice.call(list.querySelectorAll('li'));
  var isDemo = true;

  var SIZE_BY_STATE = [14, 20, 24]; // 대기(점) < 진행(다이아) < 완료(체크) 지름

  // 계산 겹: 두께는 "면적 보존" 식(BASE_AREA / size)으로 역산한다 — 커지는 마커일수록 선이 얇아져
  // 시각적 무게가 서로 비슷하게 맞물린다. 임의의 고정 두께 3종을 나열한 것이 아니다.
  function thicknessFor(size) {
    return Math.max(1.5, BASE_AREA / (size * size) * 3);
  }

  function apply(li) {
    var state = parseInt(li.getAttribute('data-state'), 10);
    var btn = li.querySelector('.marker');
    var size = SIZE_BY_STATE[state];
    var thick = thicknessFor(size);
    btn.style.setProperty('--size', size + 'px');
    btn.style.setProperty('--thick', thick.toFixed(2) + 'px');
    btn.className = 'marker state-' + state;
    btn.setAttribute('aria-label', '상태 전환: ' + STATES[state]);
    btn.textContent = STATES[state];
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  function advance(li) {
    var state = (parseInt(li.getAttribute('data-state'), 10) + 1) % 3;
    li.setAttribute('data-state', String(state));
    apply(li);
  }

  rows.forEach(function (li) {
    li.querySelector('.marker').addEventListener('click', function () {
      human();
      advance(li);
    });
    apply(li);
  });

  var last = 0;
  var STEP_MS = 700;
  var cursor = 0;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo) {
      if (reduce) {
        rows.forEach(function (li, i) { li.setAttribute('data-state', String(i % 3)); apply(li); }); // 계산은 유지, 시간 축소 대신 서로 다른 상태로 즉시 고정
      } else if (ts - last >= STEP_MS) {
        last = ts;
        advance(rows[cursor]);
        cursor = (cursor + 1) % rows.length;
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
