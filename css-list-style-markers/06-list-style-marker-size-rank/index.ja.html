<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サイズ順位マーカー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <ul class="stat-list" id="list">
    <li data-key="a">朝のルーティンガイド</li>
    <li data-key="b">30日間ホームトレーニング</li>
    <li data-key="c">食事記録メソッド</li>
    <li data-key="d">睡眠改善ノート</li>
  </ul>
  <button class="cycle" id="cycle" type="button">次の集計値を見る</button>
</div>
<script>
(function () {
  var R_MAX = 15; // 최대 값을 가진 마커의 반경(px) — scale() 기준 반경
  // 결정적 집계 프리셋 3세트를 순환한다(Math.random 미사용)
  var SETS = [
    { a: 82, b: 64, c: 47, d: 20 },
    { a: 30, b: 90, c: 55, d: 65 },
    { a: 58, b: 22, c: 88, d: 41 }
  ];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var list = document.getElementById('list');
  var items = Array.prototype.slice.call(list.querySelectorAll('li'));
  var markers = items.map(function (li) {
    var m = document.createElement('span');
    m.className = 'chip';
    m.setAttribute('aria-hidden', 'true');
    li.insertBefore(m, li.firstChild);
    return m;
  });
  var button = document.getElementById('cycle');
  var isDemo = true;
  var setIdx = 0;

  // 계산 겹: 마커 반경은 값의 제곱근에 비례한다(면적이 값에 비례하도록) — 선형 비례는 큰 값이 과장돼 보인다.
  function apply(set) {
    var max = Math.max.apply(null, Object.keys(set).map(function (k) { return set[k]; }));
    items.forEach(function (li, i) {
      var key = li.getAttribute('data-key');
      var v = set[key];
      var factor = Math.sqrt(v) / Math.sqrt(max);
      markers[i].style.setProperty('--scale', factor.toFixed(3));
    });
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  function next() {
    setIdx = (setIdx + 1) % SETS.length;
    apply(SETS[setIdx]);
  }
  button.addEventListener('click', function () { human(); next(); });

  var last = 0;
  var STEP_MS = 550;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo) {
      if (reduce) {
        apply(SETS[1]); // 계산은 유지, 시간 축소 대신 두 번째 집계 상태로 즉시 고정
      } else if (ts - last >= STEP_MS) {
        last = ts;
        next();
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  apply(SETS[0]);
})();
</script>
</main>
</body>
</html>
