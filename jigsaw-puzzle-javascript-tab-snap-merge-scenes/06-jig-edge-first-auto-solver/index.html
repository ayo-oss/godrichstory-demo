<body>
<main class="stage">
<div class="jz is-demo" id="jz">
  <canvas class="jz__canvas" data-role="canvas" width="480" height="300" role="img" tabindex="0" aria-label="곧은 변 수와 변 색 차로 점수를 매겨 테두리부터 스스로 맞춰 가는 퍼즐 판. 화살표 키로 조각을 옮길 수 있다"></canvas>
  <p class="jz__status" data-role="status" aria-live="off">테두리를 찾는 중</p>
  <button class="jz__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>

</main>
<script>
(function () {
    const root = document.getElementById("jz");
    if (!root) return;
    // 장면 시계(초)와 상태 줄 글자 — 장면 계산이 고치고, 화면 쪽이 읽어 그린다
    let sceneT = 0;
    let simStatus = '';
    // 판 좌표 — 캔버스 안은 늘 480×300. 화면에 보이는 크기와 상관없이 계산은 이 좌표로 한다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 따라가기 비율 — 1 − e^(−rate·dt). 프레임 시간이 달라도 1초에 남은 거리의 같은 비율만큼 다가간다
    function follow(rate, dt) { return 1 - Math.exp(-rate * dt); }
    function deg(rad) { return rad * 180 / Math.PI; }
    // 각을 −π ~ π 로 접는다 — 두 각의 차를 잴 때 한 바퀴 차이를 없앤다
    function wrapAngle(a) { let x = a % TAU; if (x > Math.PI) {
        x -= TAU;
    } if (x < -Math.PI) {
        x += TAU;
    } return x; }
    // 시드 고정 난수 — 같은 시드면 같은 시연이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // −1 ~ 1 사이 값
    function spread(rng) { return rng() * 2 - 1; }
    function makeSpring(x) { return { x: x, v: 0, to: x }; }
    const SPRING_SUBSTEP = 1 / 240;
    function stepSpring(s, stiffness, damping, dt) {
        let left = dt;
        while (left > 1e-9) {
            const h = Math.min(SPRING_SUBSTEP, left);
            s.v += (stiffness * (s.to - s.x) - damping * s.v) * h;
            s.x += s.v * h;
            left -= h;
        }
    }
    function snapSpring(s, x) { s.x = x; s.v = 0; s.to = x; }
    // ── 값 노이즈 ────────────────────────────────────────────────
    // 정수 격자점마다 시드로 0~1 값을 하나씩 정해 두고, 그 사이는 부드러운 계단(3x² − 2x³)으로 섞는다.
    // 여러 배율(옥타브)을 반씩 줄인 세기로 더하면 산등성이·구름 같은 결이 나온다
    function hash2(ix, iy, seed) {
        let h = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ Math.imul(seed, 1442695041);
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
    }
    function valueNoise(x, y, seed) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        const fx = x - ix;
        const fy = y - iy;
        const sx = fx * fx * (3 - 2 * fx);
        const sy = fy * fy * (3 - 2 * fy);
        const a = hash2(ix, iy, seed);
        const b = hash2(ix + 1, iy, seed);
        const c = hash2(ix, iy + 1, seed);
        const d = hash2(ix + 1, iy + 1, seed);
        return lerp(lerp(a, b, sx), lerp(c, d, sx), sy);
    }
    function fbm(x, y, seed, octaves) {
        let amp = 0.5;
        let freq = 1;
        let sum = 0;
        let norm = 0;
        for (let k = 0; k < octaves; k += 1) {
            sum += amp * valueNoise(x * freq, y * freq, seed + k * 17);
            norm += amp;
            amp *= 0.5;
            freq *= 2;
        }
        return sum / norm;
    }
    // 파스텔 팔레트 — 크림 바탕 위 라벤더·민트·버터·산호. 테두리·글자는 진한 쪽으로 명도 차를 둔다
    const PAPER = [251, 247, 238];
    const PAPER_DIM = [238, 230, 214];
    const INK = [44, 38, 58];
    const INK_SOFT = [112, 104, 126];
    const CREAM = [255, 251, 242];
    const LAVENDER = [196, 182, 238];
    const LAVENDER_DIM = [160, 146, 214];
    const MINT = [164, 218, 196];
    const MINT_DIM = [118, 184, 158];
    const BUTTER = [246, 224, 150];
    const CORAL = [244, 170, 152];
    const SKY = [170, 206, 238];
    const PINK = [244, 190, 212];
    const MINT_DEEP = [36, 116, 90];
    const CORAL_DEEP = [178, 66, 52];
    const VIOLET_DEEP = [84, 58, 160];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // ── 코드로 칠한 풍경 ─────────────────────────────────────────
    // 판 안의 비율 좌표 (u, v) 0~1 하나에 색 하나. 하늘 → 해 → 구름 → 먼 산 → 가까운 언덕 → 들꽃 순으로 덮어 칠한다.
    // 사진이 아니라 같은 페이지에서 계산한 그림이라 getImageData 로 다시 읽어도 막히지 않는다
    const SCENE_SEED = 27;
    const SUN_U = 0.74;
    const SUN_V = 0.24;
    const SUN_R = 0.085;
    function sceneryColor(u, v) {
        let c = mix(SKY, CREAM, smooth(v / 0.56));
        const ds = Math.hypot(u - SUN_U, (v - SUN_V) * 0.8);
        c = mix(c, BUTTER, clamp(1 - ds / (SUN_R * 2.6), 0, 1) * 0.55);
        if (ds < SUN_R) {
            c = mix(BUTTER, CREAM, 0.25);
        }
        const cloud = fbm(u * 5, v * 10, SCENE_SEED + 3, 4);
        if (v < 0.5) {
            c = mix(c, CREAM, smooth((cloud - 0.56) / 0.14) * 0.9 * (1 - v / 0.5));
        }
        const ridgeFar = 0.42 - 0.17 * fbm(u * 2.4, 0.5, SCENE_SEED + 5, 3);
        if (v > ridgeFar) {
            const shade = fbm(u * 9, v * 9, SCENE_SEED + 7, 3);
            c = mix(LAVENDER, LAVENDER_DIM, clamp((v - ridgeFar) * 2.4 + (shade - 0.5) * 0.7, 0, 1));
        }
        const ridgeNear = 0.63 - 0.15 * fbm(u * 3.2 + 4, 1.5, SCENE_SEED + 9, 3);
        if (v > ridgeNear) {
            const shade = fbm(u * 12, v * 12, SCENE_SEED + 11, 3);
            c = mix(MINT, MINT_DIM, clamp((v - ridgeNear) * 1.8 + (shade - 0.5) * 0.9, 0, 1));
        }
        if (v > 0.8) {
            const f = valueNoise(u * 58, v * 58, SCENE_SEED + 13);
            if (f > 0.9) {
                c = f > 0.95 ? PINK : BUTTER;
            }
        }
        return c;
    }
    // ── 조각 자르기 — 이웃과 나눠 쓰는 곡선 ───────────────────────
    // 칸 사이 변 하나를 3차 곡선 다섯 마디로 만든다: 어깨 → 목 → 혹 위 → 목 → 어깨.
    // 변 시작점 A 에서 끝점 B 로 가는 방향을 u(0~1), 그 방향을 90도 돌린 쪽을 v 로 두고 (u, v) 를 변 길이 L 단위로 적는다.
    // v 에 탭 부호(+1/−1)를 곱해 혹이 어느 이웃 쪽으로 나오는지 정한다
    const PUZZLE_SEED = 486;
    // 혹의 지름 = 변 길이 × TAB_SIZE, 혹의 높이 = 지름 × TAB_HEIGHT
    const TAB_SIZE = 0.2;
    const TAB_HEIGHT = 1.0;
    // 목 폭 = 혹 반지름 × NECK_RATIO — 1 보다 작아야 혹이 목보다 넓어 빠지지 않는다
    const NECK_RATIO = 0.62;
    // 흔들림 — 혹 자리(변 가운데에서 ± 변 길이 몫), 혹 크기 ± 몫
    const EDGE_WOBBLE = 0.06;
    const KNOB_JITTER = 0.12;
    // 3차 곡선 사슬 — [x0, y0, c1x, c1y, c2x, c2y, x1, y1, c1x, …]. 마디 끝점이 다음 마디 시작점이다
    function tabEdge(ax, ay, bx, by, sign, rng, tabSize) {
        const dx = bx - ax;
        const dy = by - ay;
        const c = 0.5 + spread(rng) * EDGE_WOBBLE;
        const kr = tabSize / 2 * (1 + spread(rng) * KNOB_JITTER);
        const nw = kr * NECK_RATIO;
        const h = tabSize * TAB_HEIGHT * (1 + spread(rng) * KNOB_JITTER);
        const j = spread(rng) * EDGE_WOBBLE * 0.5;
        const left = c - nw;
        const right = 1 - c - nw;
        const uv = [
            0, 0,
            left * 0.35, j, left * 0.75, -j, c - nw, 0,
            c - nw * 0.55, h * 0.28, c - kr * 1.12, h * 0.38, c - kr, h * 0.66,
            c - kr * 0.9, h * 1.12, c + kr * 0.9, h * 1.12, c + kr, h * 0.66,
            c + kr * 1.12, h * 0.38, c + nw * 0.55, h * 0.28, c + nw, 0,
            c + nw + right * 0.25, j, c + nw + right * 0.65, -j, 1, 0
        ];
        const out = [];
        for (let k = 0; k < uv.length; k += 2) {
            const u = uv[k];
            const v = uv[k + 1] * sign;
            // 방향 (dx, dy) 를 화면 좌표에서 90도 돌린 쪽 = (−dy, dx)
            out.push(ax + u * dx - v * dy, ay + u * dy + v * dx);
        }
        return out;
    }
    // 바깥 테두리 — 곧은 변 한 마디(조절점을 1/3·2/3 자리에)
    function flatEdge(ax, ay, bx, by) {
        return [ax, ay, lerp(ax, bx, 1 / 3), lerp(ay, by, 1 / 3), lerp(ax, bx, 2 / 3), lerp(ay, by, 2 / 3), bx, by];
    }
    // 사슬 뒤집기 — 점 순서만 거꾸로. 3차 곡선 한 마디 (p0, c1, c2, p1) 는 (p1, c2, c1, p0) 로 같은 곡선이라 어긋남이 0 이다
    function reverseChain(pts) {
        const out = [];
        for (let k = pts.length - 2; k >= 0; k -= 2) {
            out.push(pts[k], pts[k + 1]);
        }
        return out;
    }
    // 조각 순서 = 위 → 오른쪽 → 아래 → 왼쪽, 시계 방향. 위 변과 오른쪽 변은 사슬을 그대로, 아래·왼쪽 변은 뒤집어 쓴다.
    // 가로 변은 왼→오, 세로 변은 위→아래로 한 번만 만든다. 그래서 같은 변을 한쪽은 그대로, 한쪽은 뒤집어 쓰고,
    // 혹이 한쪽엔 바깥(+), 한쪽엔 안(−)이 된다 — 그대로 쓰는 조각의 탭 부호 = −sign, 뒤집어 쓰는 조각 = +sign
    function makePuzzle(cols, rows, size, bx, by, seed, tabSize) {
        const rng = makeRng(seed);
        const hEdges = [];
        const hSign = [];
        const vEdges = [];
        const vSign = [];
        const signs = [];
        for (let r = 0; r <= rows; r += 1) {
            for (let c = 0; c < cols; c += 1) {
                const ax = bx + c * size;
                const ay = by + r * size;
                if (r === 0 || r === rows) {
                    hEdges.push(flatEdge(ax, ay, ax + size, ay));
                    hSign.push(0);
                    continue;
                }
                const s = rng() < 0.5 ? 1 : -1;
                hEdges.push(tabEdge(ax, ay, ax + size, ay, s, rng, tabSize));
                hSign.push(s);
                signs.push(s);
            }
        }
        for (let r = 0; r < rows; r += 1) {
            for (let c = 0; c <= cols; c += 1) {
                const ax = bx + c * size;
                const ay = by + r * size;
                if (c === 0 || c === cols) {
                    vEdges.push(flatEdge(ax, ay, ax, ay + size));
                    vSign.push(0);
                    continue;
                }
                const s = rng() < 0.5 ? 1 : -1;
                vEdges.push(tabEdge(ax, ay, ax, ay + size, s, rng, tabSize));
                vSign.push(s);
                signs.push(s);
            }
        }
        const defs = [];
        for (let r = 0; r < rows; r += 1) {
            for (let c = 0; c < cols; c += 1) {
                const top = r * cols + c;
                const bottom = (r + 1) * cols + c;
                const left = r * (cols + 1) + c;
                const right = r * (cols + 1) + c + 1;
                const sides = [
                    { pts: hEdges[top], tab: -hSign[top] },
                    { pts: vEdges[right], tab: -vSign[right] },
                    { pts: reverseChain(hEdges[bottom]), tab: hSign[bottom] },
                    { pts: reverseChain(vEdges[left]), tab: vSign[left] }
                ];
                const hx = bx + (c + 0.5) * size;
                const hy = by + (r + 0.5) * size;
                let flat = 0;
                const local = [];
                for (const sd of sides) {
                    if (sd.tab === 0) {
                        flat += 1;
                    }
                    const l = [];
                    for (let k = 0; k < sd.pts.length; k += 2) {
                        l.push(sd.pts[k] - hx, sd.pts[k + 1] - hy);
                    }
                    local.push(l);
                }
                defs.push({ id: r * cols + c, col: c, row: r, hx: hx, hy: hy, sides: sides, flat: flat, local: local });
            }
        }
        return { cols: cols, rows: rows, size: size, bx: bx, by: by, defs: defs, signs: signs };
    }
    // 3차 곡선 한 마디의 점 — t 0~1
    function cubicAt(p, k, t) {
        const u = 1 - t;
        const a = u * u * u;
        const b = 3 * u * u * t;
        const c = 3 * u * t * t;
        const d = t * t * t;
        return [a * p[k] + b * p[k + 2] + c * p[k + 4] + d * p[k + 6], a * p[k + 1] + b * p[k + 3] + c * p[k + 5] + d * p[k + 7]];
    }
    // 사슬을 꺾은선으로 — 마디마다 steps 등분
    function flattenChain(pts, steps) {
        const out = [pts[0], pts[1]];
        for (let k = 0; k + 7 < pts.length; k += 6) {
            for (let s = 1; s <= steps; s += 1) {
                const p = cubicAt(pts, k, s / steps);
                out.push(p[0], p[1]);
            }
        }
        return out;
    }
    // 조각 하나의 닫힌 꺾은선(조각 가운데 기준) — 네 변을 이어 붙인다
    function piecePolygon(d, steps) {
        const out = [];
        for (const l of d.local) {
            const f = flattenChain(l, steps);
            for (let k = out.length ? 2 : 0; k < f.length; k += 2) {
                out.push(f[k], f[k + 1]);
            }
        }
        return out;
    }
    // 점이 닫힌 꺾은선 안에 있는가 — 오른쪽으로 쏜 반직선이 변을 몇 번 건너는지(홀수면 안)
    function pointInPoly(px, py, poly) {
        let inside = false;
        const n = poly.length;
        for (let i = 0, j = n - 2; i < n; j = i, i += 2) {
            const xi = poly[i];
            const yi = poly[i + 1];
            const xj = poly[j];
            const yj = poly[j + 1];
            if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) {
                inside = !inside;
            }
        }
        return inside;
    }
    // 꺾은선의 네모 상자 [왼, 위, 오른, 아래]
    function polyBox(poly) {
        let x0 = Infinity;
        let y0 = Infinity;
        let x1 = -Infinity;
        let y1 = -Infinity;
        for (let k = 0; k < poly.length; k += 2) {
            x0 = Math.min(x0, poly[k]);
            x1 = Math.max(x1, poly[k]);
            y0 = Math.min(y0, poly[k + 1]);
            y1 = Math.max(y1, poly[k + 1]);
        }
        return [x0, y0, x1, y1];
    }
    // ── 대표 하나로 묶기 ─────────────────────────────────────────
    // parent[i] 가 자기 자신이면 그 조각이 묶음의 대표. 대표를 찾으며 지나는 칸은 한 칸 건너(할아버지)를 가리키게 고쳐
    // 다음 찾기가 짧아진다(경로 줄이기). 두 묶음을 합칠 땐 조각 수가 적은 쪽 대표를 많은 쪽 대표 아래로 넣는다(크기 기준)
    let parent = [];
    let groupSize = [];
    function resetGroups(n) {
        parent = [];
        groupSize = [];
        for (let i = 0; i < n; i += 1) {
            parent.push(i);
            groupSize.push(1);
        }
    }
    function findRoot(i) {
        let x = i;
        while (parent[x] !== x) {
            parent[x] = parent[parent[x]];
            x = parent[x];
        }
        return x;
    }
    function joinGroups(a, b) {
        let ra = findRoot(a);
        let rb = findRoot(b);
        if (ra === rb) {
            return ra;
        }
        if (groupSize[ra] < groupSize[rb]) {
            const t = ra;
            ra = rb;
            rb = t;
        }
        parent[rb] = ra;
        groupSize[ra] += groupSize[rb];
        return ra;
    }
    function groupCount() {
        let n = 0;
        for (let i = 0; i < parent.length; i += 1) {
            if (parent[i] === i) {
                n += 1;
            }
        }
        return n;
    }
    function membersOf(i) {
        const r = findRoot(i);
        const out = [];
        for (let k = 0; k < parent.length; k += 1) {
            if (findRoot(k) === r) {
                out.push(k);
            }
        }
        return out;
    }
    let puzzle = makePuzzle(1, 1, 10, 0, 0, 1, TAB_SIZE);
    let pieces = [];
    // 그리는 순서 — 뒤에 있을수록 위에 그린다
    let zOrder = [];
    // 마지막 이음이 생긴 장면 시각 — 묶음이 하나가 되면 정해진다(아직이면 −1)
    let completeAt = -1;
    // 이음 시각 — 조각 i 의 변 s(위·오른·아래·왼)가 이웃과 묶인 장면 시각, 아직이면 −1
    let seamJoinedAt = [];
    function setupWorld(pz) {
        puzzle = pz;
        pieces = [];
        zOrder = [];
        seamJoinedAt = [];
        for (const d of pz.defs) {
            pieces.push({ x: d.hx, y: d.hy, vx: 0, vy: 0, tx: d.hx, ty: d.hy, a: 0, va: 0, ta: 0, h: 0, vh: 0, th: 0, mvx: 0, mvy: 0, lx: d.hx, ly: d.hy });
            zOrder.push(d.id);
            seamJoinedAt.push(-1, -1, -1, -1);
        }
        resetGroups(pz.defs.length);

        steps06 = solveFrameFirst(makeSampler());
        resetCarries();
        steps06.forEach(function (s, k) {
            const t0 = SOLVE_START_S + k * STEP_S;
            const h = slotHome(s.slot);
            planCarry(s.piece, t0, t0 + CARRY_S, h[0] + 4, h[1] - 3, 0);
        });
        onRelease = function (i) {
            // 판 칸이 붙잡는다 — 칸 가운데까지 거리가 문턱 안이면 그 칸으로, 그다음 이미 놓인 이웃과 묶는다
            const s = steps06.filter(function (x) { return x.piece === i; })[0];
            const h = slotHome(s ? s.slot : i);
            if (Math.hypot(pieces[i].tx - h[0], pieces[i].ty - h[1]) < SNAP_RADIUS) {
                pieces[i].tx = h[0];
                pieces[i].ty = h[1];
            }
            for (let n = 0; n < 4; n += 1) {
                tryJoin(i);
            }
        };
        statusFor06(0);
    }
    function allPieceIds() { return pieces.map(function (p, i) { void p; return i; }); }
    function statusFor06(k) {
        const s = steps06[k];
        if (!s) {
            return;
        }
        const finite = s.scores.filter(function (v) { return v < Infinity; });
        simStatus = fmt(STATUS_SOLVE, { k: KIND_NAMES[pieceKind(puzzle.defs[s.piece])], s: k + 1, c: finite.length, v: s.scores[s.piece].toFixed(2) });
    }
    function update(dt) {
        runCarries(sceneT);
        for (const p of pieces) {
            p.th = 0;
        }
        if (carrying >= 0) {
            pieces[carrying].th = 0.8;
        }
        stepWorld(dt, SNAP_STIFFNESS, SNAP_DAMPING);
        if (sceneT >= SOLVE_START_S) {
            statusFor06(stepIndexAt(sceneT));
        }
        if (completeAt >= 0) {
            simStatus = fmt(STATUS_DONE, { n: pieces.length });
        }
    }
    function restPose() {
        assembleAll();
        resetCarries();
        simStatus = fmt(STATUS_DONE, { n: pieces.length });
    }
    // 06 화면 — 지금 채울 칸은 버터색, 쟁반 조각 가운데 점은 곧은 변 수로 가른 종류(모서리·가장자리·안쪽).
    // 판 아래 열지도 = 지금 칸에 대한 조각 12개의 점수(진할수록 낮은 점수 = 잘 맞음, 빈칸 = 테두리 모양이 안 맞거나 이미 씀), 고른 조각에 고리
    const KIND_COLORS = [PINK, SKY, BUTTER];
    const HEAT_X = 34;
    const HEAT_Y = 222;
    const HEAT_CELL = 13;
    const HEAT_GAP = 2;
    const HEAT_TOP = 3;
    const LABEL_HEAT = '지금 칸의 후보 점수(진할수록 잘 맞음)';
    function drawHeat(k) {
        const s = steps06[k];
        label(LABEL_HEAT, HEAT_X, HEAT_Y - 10, INK, 1, 10, 700, 'left');
        if (!s) {
            return;
        }
        s.scores.forEach(function (v, i) {
            const x = HEAT_X + i * (HEAT_CELL + HEAT_GAP);
            if (v === Infinity) {
                fillRound(x, HEAT_Y, HEAT_CELL, HEAT_CELL, 3, PAPER_DIM, 1);
                line(x + 3, HEAT_Y + HEAT_CELL - 3, x + HEAT_CELL - 3, HEAT_Y + 3, 1, INK_SOFT, 0.7);
            }
            else {
                fillRound(x, HEAT_Y, HEAT_CELL, HEAT_CELL, 3, mix(VIOLET_DEEP, LAVENDER, clamp(v / HEAT_TOP, 0, 1)), 1);
            }
            if (i === s.piece) {
                roundRectPath(x - 2, HEAT_Y - 2, HEAT_CELL + 4, HEAT_CELL + 4, 4);
                ctx.lineWidth = 2;
                ctx.strokeStyle = rgba(CORAL_DEEP, 1);
                ctx.stroke();
            }
        });
        let lx = HEAT_X;
        KIND_NAMES.forEach(function (n, kind) {
            disc(lx + 5, HEAT_Y + 28, 4.5, KIND_COLORS[kind], 1);
            ring(lx + 5, HEAT_Y + 28, 4.5, 1, INK, 0.8);
            label(n, lx + 13, HEAT_Y + 28, INK, 1, 10, 700, 'left');
            setFont(10, 700);
            lx += 22 + ctx.measureText(n).width;
        });
    }
    function draw() {
        clearStage(PAPER);
        drawBoardFrame(1);
        const k = stepIndexAt(sceneT);
        const s = steps06[k];
        if (s && !handsOn && completeAt < 0) {
            const h = slotHome(s.slot);
            fillRound(h[0] - PIECE / 2, h[1] - PIECE / 2, PIECE, PIECE, 4, BUTTER, 0.9);
        }
        drawAllPieces(function (i) { void i; return PLAIN; });
        for (let i = 0; i < pieces.length; i += 1) {
            if (groupSize[findRoot(i)] > 1 || (completeAt >= 0)) {
                continue;
            }
            const p = pieces[i];
            const kind = pieceKind(puzzle.defs[i]);
            disc(p.x, p.y, 5, KIND_COLORS[kind], 1);
            ring(p.x, p.y, 5, 1.2, INK, 0.85);
        }
        drawSelection();
        drawHeat(handsOn ? -1 : k);
        drawHand(handX, handY, handDown);
    }
    // 상태 줄 — 바뀔 때만 글자를 고친다
    let shownStatus = '';
    function pushStatus() {
        if (!statusEl || simStatus === shownStatus) {
            return;
        }
        shownStatus = simStatus;
        statusEl.textContent = simStatus;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 손대면 시연 표시를 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    // 리스너는 한 묶음으로 달고 정리할 때 한 번에 뗀다
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 판을 처음 만지면 — 흉내 낸 손을 멈추고, 지금 놓인 그대로 사람에게 넘긴다(시연 되감기도 멈춘다)
    function takeOver() {
        wake();
        if (handsOn) {
            return;
        }
        handsOn = true;
        carrying = -1;
        handDown = false;
        for (const p of pieces) {
            p.th = 0;
        }
    }
    // 한 프레임에 넘기는 시간 상한(초) — 탭을 오래 숨겼다 돌아온 첫 프레임에도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    // 장면 시계를 dt 만큼 — 시연 중에는 한 바퀴(LOOP_S)를 넘으면 처음 배치로 되돌려 다시 시연한다
    function advance(dt) {
        sceneT += dt;
        if (handsOn) {
            freeStep(dt);
            return;
        }
        if (sceneT >= LOOP_S) {
            sceneT -= LOOP_S;
            reset();
        }
        update(dt);
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        draw();
        pushStatus();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 시계 다시 맞추기 — 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 동작 줄이기 — 루프를 돌리지 않고 완성 판 한 장만 그린다. 사람이 이미 만졌으면 그 판을 그대로 둔다
    function showRest() {
        stopLoop();
        if (!handsOn) {
            sceneT = 0;
            reset();
            restPose();
        }
        settleNow();
        draw();
        pushStatus();
    }
    function play() {
        if (!handsOn) {
            sceneT = 0;
            reset();
        }
        draw();
        pushStatus();
        if (!paused) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 루프를 멈추고, 돌아오면 시계를 다시 맞춰 시작한다 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 페이지를 연 채 바뀌면 — 켜지면 완성 판으로 멈추고, 꺼지면 시연을 처음부터
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    // 창 크기나 화소 배율이 바뀌면 — 캔버스 내부 크기와 그림을 새 배율로 다시
    window.addEventListener('resize', function () {
        fitCanvas();
        prepareBoard();
        draw();
    }, { signal: off.signal });
    bindInput(off.signal);
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
