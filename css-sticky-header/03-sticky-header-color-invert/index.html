<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky header — color invert on scroll</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <header class="head is-demo">
    <span class="head__layer head__layer--dark"></span>
    <span class="head__layer head__layer--light"></span>
    <span class="head__logo">GODRICH</span>
  </header>
  <div class="hero">
    <div class="hero__sentinel"></div>
    <p class="hero__title">히어로 영역</p>
  </div>
</main>
<script>
// 실제 페이지: 히어로 하단 센티넬을 지나면 색이 뒤집힌다 (IntersectionObserver, 6줄)
var head = document.querySelector('.head');
new IntersectionObserver(function (es) {
  head.classList.toggle('is-inverted', !es[0].isIntersecting);
}).observe(document.querySelector('.hero__sentinel'));
</script>
</body>
</html>
