<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky header — current section title</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <header class="head is-demo">
    <span class="head__label head__label--a">A</span>
    <span class="head__label head__label--b">B</span>
  </header>
  <div class="list">
    <p class="list__sentinel" data-label="A"></p>
    <p class="list__row">Amy</p>
    <p class="list__row">Anna</p>
    <p class="list__sentinel" data-label="B"></p>
    <p class="list__row">Ben</p>
  </div>
</main>
<script>
// 실제 페이지: 지금 통과 중인 구간 센티넬의 글자를 헤더 라벨에 올린다 (IntersectionObserver, 7줄)
var labels = document.querySelectorAll('.head__label');
document.querySelectorAll('.list__sentinel').forEach(function (s) {
  new IntersectionObserver(function (es) {
    if (es[0].isIntersecting) labels.forEach(function (l) { l.classList.toggle('is-current', l.textContent === s.dataset.label); });
  }, { rootMargin: '-56px 0px -80% 0px' }).observe(s);
});
</script>
</body>
</html>
