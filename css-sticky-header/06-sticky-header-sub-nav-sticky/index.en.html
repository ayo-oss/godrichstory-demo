<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky header — sub-nav below header</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <header class="head">GODRICH</header>
  <div class="sentinel"></div>
  <nav class="subnav is-demo">
    <span class="subnav__tab is-active">Women</span>
    <span class="subnav__tab">Men</span>
    <span class="subnav__tab">Kids</span>
  </nav>
  <div class="page">
    <p class="page__line"></p>
    <p class="page__line"></p>
    <p class="page__line short"></p>
  </div>
</main>
<script>
// 실제 페이지: 서브 내비가 헤더 밑에 닿는 순간 테두리를 켠다 (IntersectionObserver, 6줄)
var sub = document.querySelector('.subnav');
new IntersectionObserver(function (es) {
  sub.classList.toggle('is-stuck', !es[0].isIntersecting);
}, { rootMargin: '-56px 0px 0px 0px', threshold: 1 }).observe(document.querySelector('.sentinel'));
</script>
</body>
</html>
