<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky header — synced to scroll-snap</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <header class="head is-demo">
    <span class="head__logo">GODRICH</span>
    <span class="head__dots"><i class="is-current"></i><i></i><i></i></span>
  </header>
  <section class="snap-section" data-i="0"><p>01</p></section>
  <section class="snap-section" data-i="1"><p>02</p></section>
  <section class="snap-section" data-i="2"><p>03</p></section>
</main>
<script>
// 실제 페이지: scroll-snap 으로 멈춘 섹션 번호에 맞춰 점을 옮긴다 (IntersectionObserver, 7줄)
var dots = document.querySelectorAll('.head__dots i');
document.querySelectorAll('.snap-section').forEach(function (s) {
  new IntersectionObserver(function (es) {
    if (es[0].isIntersecting) dots.forEach(function (d, i) { d.classList.toggle('is-current', i == s.dataset.i); });
  }, { threshold: .6 }).observe(s);
});
</script>
</body>
</html>
