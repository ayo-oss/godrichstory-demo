<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポインターが煙の柱に近づく距離に応じて、近くの粒子が渦を巻きながら押しのけられる。 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="smk is-demo" id="smkRoot" tabindex="0">
  <canvas class="smk__canvas" id="smkCanvas" width="480" height="300"></canvas>
  <p class="smk__caption">ポインターが煙の柱に近づく距離に応じて、近くの粒子が渦を巻きながら押しのけられる。</p>
</div>
</main>
<script>
(function () {
  // 기법: 포인터-입자 거리가 SMOKE_SWIRL_RADIUS 안이면 반경 벡터를 90도 회전한 접선
  // 방향으로 밀어내는 속도를 더한다 — 거리가 가까울수록(1 - dist/radius) 세게 밀린다.
  // 실제 손이 없을 때는 가상 포인터가 원을 그리며 같은 계산 경로를 그대로 탄다.
  var root = document.getElementById('smkRoot');
  var canvas = document.getElementById('smkCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  var CALC_W = 160, CALC_H = 100;
  var SMOKE_RISE_SPEED_PX = 13;
  var SMOKE_SWIRL_RADIUS = 34;
  var SMOKE_SWIRL_STRENGTH = 70;
  var PLUME_SPAWN_PER_S = 22;
  var PLUME_LIFE_MS = 2400;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var NOISE_DIM = 40;
  var noiseRand = seedRand(423061);
  var noiseTable = new Float32Array(NOISE_DIM * NOISE_DIM);
  for (var ni = 0; ni < noiseTable.length; ni += 1) noiseTable[ni] = noiseRand();
  function noiseAt(xi, yi) {
    var wx = ((xi % NOISE_DIM) + NOISE_DIM) % NOISE_DIM;
    var wy = ((yi % NOISE_DIM) + NOISE_DIM) % NOISE_DIM;
    return noiseTable[wy * NOISE_DIM + wx];
  }
  function smoothstep(t) { return t * t * (3 - 2 * t); }
  function valueNoise2D(x, y) {
    var x0 = Math.floor(x), y0 = Math.floor(y);
    var tx = smoothstep(x - x0), ty = smoothstep(y - y0);
    var v00 = noiseAt(x0, y0), v10 = noiseAt(x0 + 1, y0);
    var v01 = noiseAt(x0, y0 + 1), v11 = noiseAt(x0 + 1, y0 + 1);
    var a = v00 + (v10 - v00) * tx;
    var b = v01 + (v11 - v01) * tx;
    return a + (b - a) * ty;
  }

  var pRand = seedRand(423062);
  var particles = [];
  var spawnAcc = 0;

  function spawn(bornMs) {
    particles.push({
      x: CALC_W * 0.5 + (pRand() - 0.5) * 12,
      y: CALC_H - 6,
      born: bornMs,
      wSeed: pRand() * 1000
    });
  }

  var pointerX = CALC_W * 0.5, pointerY = CALC_H * 0.4;
  var pointerActive = false;

  function stepSim(dtMs, nowMs) {
    var dtS = dtMs / 1000;
    spawnAcc += dtMs * PLUME_SPAWN_PER_S / 1000;
    while (spawnAcc >= 1) { spawn(nowMs); spawnAcc -= 1; }
    var alive = [];
    for (var i = 0; i < particles.length; i += 1) {
      var p = particles[i];
      var turb = (valueNoise2D(p.wSeed * 0.03, nowMs * 0.0018) - 0.5) * 2;
      p.x += turb * 8 * dtS;
      p.y -= SMOKE_RISE_SPEED_PX * dtS;
      var rx = p.x - pointerX, ry = p.y - pointerY;
      var dist = Math.hypot(rx, ry);
      if (dist < SMOKE_SWIRL_RADIUS && dist > 0.5) {
        var push = (1 - dist / SMOKE_SWIRL_RADIUS) * SMOKE_SWIRL_STRENGTH;
        var tx = -ry / dist, ty = rx / dist;
        p.x += tx * push * dtS;
        p.y += ty * push * dtS;
      }
      if (nowMs - p.born < PLUME_LIFE_MS) alive.push(p);
    }
    particles = alive;
  }

  function drawSmoke(nowMs) {
    var sx = cw / CALC_W, sy = ch / CALC_H;
    ctx.clearRect(0, 0, cw, ch);
    for (var i = 0; i < particles.length; i += 1) {
      var p = particles[i];
      var f = Math.max(0, Math.min(1, (nowMs - p.born) / PLUME_LIFE_MS));
      var r = 6 + f * 15;
      var alpha = Math.sin(f * Math.PI) * 0.5;
      if (alpha <= 0.01) continue;
      var dx = p.x * sx, dy = p.y * sy, dr = r * ((sx + sy) / 2);
      var g = ctx.createRadialGradient(dx, dy, 0, dx, dy, dr);
      g.addColorStop(0, 'rgba(38,32,24,' + alpha + ')');
      g.addColorStop(1, 'rgba(38,32,24,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(dx, dy, dr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  var cw = 480, ch = 300;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    drawSmoke(elapsed);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var elapsed = 0;
  if (reduce) root.classList.remove('is-demo');

  function toCalc(e) {
    var r = wrap.getBoundingClientRect();
    var t0 = (e.touches && e.touches[0]) ? e.touches[0] : e;
    return {
      x: (t0.clientX - r.left) / r.width * CALC_W,
      y: (t0.clientY - r.top) / r.height * CALC_H
    };
  }
  wrap.addEventListener('pointermove', function (e) {
    pointerActive = true;
    var g = toCalc(e);
    pointerX = g.x; pointerY = g.y;
    if (reduce) { stepSim(16, elapsed); drawSmoke(elapsed); }
  });
  wrap.addEventListener('pointerleave', function () { pointerActive = false; });
  wrap.addEventListener('keydown', function (e) {
    var moved = true;
    if (e.key === 'ArrowLeft') pointerX = Math.max(0, pointerX - 8);
    else if (e.key === 'ArrowRight') pointerX = Math.min(CALC_W, pointerX + 8);
    else if (e.key === 'ArrowUp') pointerY = Math.max(0, pointerY - 8);
    else if (e.key === 'ArrowDown') pointerY = Math.min(CALC_H, pointerY + 8);
    else moved = false;
    if (moved) {
      e.preventDefault();
      pointerActive = true;
      if (reduce) { stepSim(16, elapsed); drawSmoke(elapsed); }
    }
  });

  function virtualPointerOrbit(t) {
    var cx = CALC_W * (0.3 + 0.4 * ((Math.sin(t * 0.0011) + 1) / 2));
    var cy = CALC_H * (0.28 + 0.5 * ((Math.cos(t * 0.0017) + 1) / 2));
    return { x: cx, y: cy };
  }

  var warmSteps = reduce ? 160 : 120;
  for (var w = 0; w < warmSteps; w += 1) { elapsed += 20; stepSim(20, elapsed); }

  var lastTs = null;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min(ts - lastTs, 48);
    lastTs = ts;
    if (!reduce) {
      elapsed += dt;
      if (!pointerActive) {
        var v = virtualPointerOrbit(elapsed);
        pointerX = v.x; pointerY = v.y;
      }
      stepSim(dt, elapsed);
      drawSmoke(elapsed);
    }
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  drawSmoke(elapsed);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
