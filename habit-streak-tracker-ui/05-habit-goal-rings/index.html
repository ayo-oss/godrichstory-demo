<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼중 목표 링 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gr is-demo" id="gr">
  <div class="gr__main">
    <div class="gr__ringBox">
      <svg class="gr__svg" viewBox="0 0 128 128" aria-hidden="true">
        <circle class="gr__track" cx="64" cy="64" r="50"/>
        <circle class="gr__track" cx="64" cy="64" r="38"/>
        <circle class="gr__track" cx="64" cy="64" r="26"/>
        <circle class="gr__fill gr__fill--a" id="ring0" cx="64" cy="64" r="50"/>
        <circle class="gr__fill gr__fill--b" id="ring1" cx="64" cy="64" r="38"/>
        <circle class="gr__fill gr__fill--c" id="ring2" cx="64" cy="64" r="26"/>
      </svg>
      <span class="gr__burst" aria-hidden="true">
        <i class="gr__shard" style="--a:0"></i><i class="gr__shard" style="--a:1"></i>
        <i class="gr__shard" style="--a:2"></i><i class="gr__shard" style="--a:3"></i>
        <i class="gr__shard" style="--a:4"></i><i class="gr__shard" style="--a:5"></i>
        <i class="gr__shard" style="--a:6"></i><i class="gr__shard" style="--a:7"></i>
      </span>
    </div>
    <ul class="gr__legend">
      <li class="gr__item">
        <i class="gr__swatch gr__swatch--a" aria-hidden="true"></i>
        <span class="gr__name">물 마시기</span>
        <b class="gr__pct" id="pct0">75%</b>
      </li>
      <li class="gr__item">
        <i class="gr__swatch gr__swatch--b" aria-hidden="true"></i>
        <span class="gr__name">운동 30분</span>
        <b class="gr__pct" id="pct1">67%</b>
      </li>
      <li class="gr__item">
        <i class="gr__swatch gr__swatch--c" aria-hidden="true"></i>
        <span class="gr__name">독서 20쪽</span>
        <b class="gr__pct" id="pct2">50%</b>
      </li>
    </ul>
  </div>
  <p class="gr__say" id="say" role="status" aria-live="polite">세 목표 중 0개 달성</p>
  <div class="gr__bar" id="bar">
    <button class="gr__go" type="button" data-k="0">물 한 잔</button>
    <button class="gr__go" type="button" data-k="1">운동 10분</button>
    <button class="gr__go" type="button" data-k="2">책 5쪽</button>
  </div>
</div>
</main>
<script>
var STORE = 'godrich-habit-rings';
var GOALS = [4, 3, 2];
var RADII = [50, 38, 26];
var SAY_TEXT = '세 목표 중 {n}개 달성';
var root = document.getElementById('gr');
var rings = [document.getElementById('ring0'), document.getElementById('ring1'), document.getElementById('ring2')];
var pcts = [document.getElementById('pct0'), document.getElementById('pct1'), document.getElementById('pct2')];
var sayEl = document.getElementById('say');
var done = [3, 2, 1];
var burstTimer = 0;

function load() {
  try {
    var raw = window.localStorage.getItem(STORE);
    if (raw) { done = JSON.parse(raw); }
  } catch (e) { /* 저장소가 막힌 창에서는 기본 기록 그대로 */ }
}
function save() {
  try { window.localStorage.setItem(STORE, JSON.stringify(done)); } catch (e) { /* 저장만 건너뛴다 */ }
}
function paint() {
  var closed = 0;
  for (var i = 0; i < rings.length; i++) {
    var p = Math.min(done[i] / GOALS[i], 1);
    var circ = 2 * Math.PI * RADII[i];   // 링마다 반지름이 다르니 둘레도 따로 잰다
    rings[i].style.strokeDasharray = String(circ);
    rings[i].style.strokeDashoffset = String(circ * (1 - p));
    pcts[i].textContent = Math.round(p * 100) + '%';
    if (p >= 1) { closed++; }
  }
  sayEl.textContent = SAY_TEXT.replace('{n}', String(closed));
  return closed === rings.length;
}
function burst() {
  root.classList.remove('is-done');
  // 클래스를 뗀 직후 다시 붙이면 같은 애니메이션이 처음부터 다시 돈다
  void root.offsetWidth;
  root.classList.add('is-done');
  window.clearTimeout(burstTimer);
  burstTimer = window.setTimeout(function () { root.classList.remove('is-done'); }, 900);
}
load();
paint();
document.getElementById('bar').addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('.gr__go') : null;
  if (!b) { return; }
  root.classList.remove('is-demo');
  var k = Number(b.getAttribute('data-k'));
  done[k] = done[k] >= GOALS[k] ? 0 : done[k] + 1;
  save();
  if (paint()) { burst(); }
});
</script>
</body>
</html>
