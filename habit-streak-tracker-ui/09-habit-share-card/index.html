<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 요약 공유 카드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-share-network" viewBox="0 0 256 256" fill="currentColor"><g><path d="M208 200a32 32 0 1 1-32-32a32 32 0 0 1 32 32M176 88a32 32 0 1 0-32-32a32 32 0 0 0 32 32" opacity=".2"/><path d="M176 160a39.9 39.9 0 0 0-28.62 12.09l-46.1-29.63a39.8 39.8 0 0 0 0-28.92l46.1-29.63a40 40 0 1 0-8.66-13.45l-46.1 29.63a40 40 0 1 0 0 55.82l46.1 29.63A40 40 0 1 0 176 160m0-128a24 24 0 1 1-24 24a24 24 0 0 1 24-24M64 152a24 24 0 1 1 24-24a24 24 0 0 1-24 24m112 72a24 24 0 1 1 24-24a24 24 0 0 1-24 24"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="sh is-demo" id="sh">
  <p class="sh__title">
    <svg class="sh__ico" aria-hidden="true"><use href="#ico-share-network"/></svg>
    <span>오늘 요약 카드</span>
  </p>
  <div class="sh__main">
    <span class="sh__cardBox">
      <canvas class="sh__canvas" id="card" width="400" height="224" role="img" aria-label="오늘 요약 카드 이미지"></canvas>
      <span class="sh__toast" id="toast" aria-hidden="true">복사했습니다</span>
    </span>
    <div class="sh__side">
      <button class="sh__go" id="copy" type="button">이미지로 복사</button>
      <button class="sh__more" id="more" type="button">하루 더 채우기</button>
      <p class="sh__say" id="say" role="status" aria-live="polite">카드를 만들었습니다</p>
    </div>
  </div>
</div>
</main>
<script>
var STORE = 'godrich-habit-card';
var HEAD_TEXT = '오늘의 습관 요약';
var STREAK_TEXT = '{n}일 연속';
var DONE_TEXT = '완료 {c}/{t}';
var COPIED_TEXT = '복사했습니다';
var SAVED_TEXT = '이미지로 내려받았습니다';
var MADE_TEXT = '카드를 만들었습니다';
var root = document.getElementById('sh');
var canvas = document.getElementById('card');
var ctx = canvas.getContext('2d');
var toast = document.getElementById('toast');
var sayEl = document.getElementById('say');
var state = { streak: 12, done: 5, total: 6 };
var toastTimer = 0;

function load() {
  try {
    var raw = window.localStorage.getItem(STORE);
    if (raw) { state = JSON.parse(raw); }
  } catch (e) { /* 저장소가 막힌 창에서는 기본값 그대로 */ }
}
function save() {
  try { window.localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* 저장만 건너뛴다 */ }
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// 카드는 페이지가 열릴 때 한 번 그려 둔다 — 버튼을 누르기 전에도 무엇을 공유하는지 보여야 한다
function draw() {
  var d = new Date();
  ctx.clearRect(0, 0, 400, 224);
  ctx.fillStyle = '#17141a';
  roundRect(0, 0, 400, 224, 24);
  ctx.fill();
  ctx.fillStyle = '#ffd23f';
  roundRect(24, 24, 8, 40, 4);
  ctx.fill();
  ctx.fillStyle = '#fff7e6';
  ctx.textBaseline = 'top';
  ctx.font = '700 20px sans-serif';
  ctx.fillText(HEAD_TEXT, 44, 30);
  ctx.fillStyle = '#ffd23f';
  ctx.font = '800 58px sans-serif';
  ctx.fillText(STREAK_TEXT.replace('{n}', String(state.streak)), 40, 86);
  ctx.fillStyle = '#fff7e6';
  ctx.font = '700 20px sans-serif';
  ctx.fillText(DONE_TEXT.replace('{c}', String(state.done)).replace('{t}', String(state.total)), 40, 164);
  ctx.fillStyle = 'rgba(255, 247, 230, 0.55)';
  ctx.font = '700 18px sans-serif';
  ctx.fillText((d.getMonth() + 1) + '.' + d.getDate(), 320, 166);
}
function flash(text) {
  sayEl.textContent = text;
  toast.textContent = text;
  toast.classList.add('is-on');
  window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(function () { toast.classList.remove('is-on'); }, 1400);
}
// 클립보드 이미지 쓰기가 막힌 환경(사파리 구버전·권한 거부)에서는 toDataURL 링크로 내려받는다
function copyCard() {
  if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && canvas.toBlob) {
    canvas.toBlob(function (blob) {
      var item = new window.ClipboardItem({ 'image/png': blob });
      navigator.clipboard.write([item]).then(function () { flash(COPIED_TEXT); }, download);
    }, 'image/png');
    return;
  }
  download();
}
function download() {
  var a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'habit-card.png';
  a.click();
  flash(SAVED_TEXT);
}
load();
draw();
sayEl.textContent = MADE_TEXT;
document.getElementById('copy').addEventListener('click', function () {
  root.classList.remove('is-demo');
  copyCard();
});
document.getElementById('more').addEventListener('click', function () {
  root.classList.remove('is-demo');
  state.streak = state.streak + 1;
  state.done = state.done >= state.total ? 1 : state.done + 1;
  save();
  draw();
  flash(MADE_TEXT);
});
</script>
</body>
</html>
