<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요일별 막대 요약 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wb is-demo" id="wb">
  <div class="wb__head">
    <p class="wb__title">요일별 완료 수</p>
    <p class="wb__say" id="say" role="status" aria-live="polite">목표선을 넘은 날 4개</p>
  </div>
  <div class="wb__chart">
    <span class="wb__goal" aria-hidden="true"></span>
    <div class="wb__cols" id="cols"></div>
  </div>
  <p class="wb__cap">왼쪽부터 이번 주 1일차부터 7일차까지</p>
</div>
</main>
<script>
var STORE = 'godrich-habit-bars';
var MAX = 5, GOAL = 3, TODAY = 4;   // 목표 3회, 오늘은 5일차(0부터 세어 4)
var COL_LABEL = '{d}일차 {n}회';
var SAY_TEXT = '목표선을 넘은 날 {n}개';
var TODAY_TAG = '오늘';
var root = document.getElementById('wb');
var cols = document.getElementById('cols');
var sayEl = document.getElementById('say');
var counts = [2, 4, 3, 1, 3, 5, 2];
var bars = [], nums = [], buttons = [];

function load() {
  try {
    var raw = window.localStorage.getItem(STORE);
    if (raw) { counts = JSON.parse(raw); }
  } catch (e) { /* 저장소가 막힌 창에서는 기본 기록 그대로 */ }
}
function save() {
  try { window.localStorage.setItem(STORE, JSON.stringify(counts)); } catch (e) { /* 저장만 건너뛴다 */ }
}
function paint() {
  var over = 0;
  for (var i = 0; i < counts.length; i++) {
    var v = Math.min(counts[i] / MAX, 1);
    bars[i].style.setProperty('--v', String(v));
    bars[i].className = 'wb__bar' + (counts[i] >= GOAL ? ' is-over' : '');
    nums[i].textContent = String(counts[i]);
    buttons[i].setAttribute('aria-label', COL_LABEL.replace('{d}', String(i + 1)).replace('{n}', String(counts[i])));
    if (counts[i] >= GOAL) { over++; }
  }
  sayEl.textContent = SAY_TEXT.replace('{n}', String(over));
}
function build() {
  for (var i = 0; i < counts.length; i++) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'wb__col' + (i === TODAY ? ' is-today' : '');
    b.style.setProperty('--i', String(i));
    b.setAttribute('data-i', String(i));
    b.innerHTML = '<span class="wb__num"></span>'
      + '<span class="wb__slot"><span class="wb__bar"></span></span>'
      + '<span class="wb__tick' + (i === TODAY ? ' is-today' : '') + '">'
      + (i === TODAY ? TODAY_TAG : String(i + 1)) + '</span>';
    bars.push(b.querySelector('.wb__bar'));
    nums.push(b.querySelector('.wb__num'));
    buttons.push(b);
    cols.appendChild(b);
  }
}
load();
build();
paint();
cols.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('.wb__col') : null;
  if (!b) { return; }
  root.classList.remove('is-demo');
  var i = Number(b.getAttribute('data-i'));
  counts[i] = counts[i] >= MAX ? 0 : counts[i] + 1;
  save();
  paint();
});
</script>
</body>
</html>
