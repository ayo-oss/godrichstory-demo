<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>달력 도장 찍기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-check-circle" viewBox="0 0 256 256" fill="currentColor"><g><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0M232 128A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></symbol>
    <symbol id="ico-calendar-check" viewBox="0 0 256 256" fill="currentColor"><g><path d="M216 48v40H40V48a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 32h-24v-8a8 8 0 0 0-16 0v8H88v-8a8 8 0 0 0-16 0v8H48a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16M72 48v8a8 8 0 0 0 16 0v-8h80v8a8 8 0 0 0 16 0v-8h24v32H48V48Zm136 160H48V96h160zm-38.34-85.66a8 8 0 0 1 0 11.32l-48 48a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L116 164.69l42.34-42.35a8 8 0 0 1 11.32 0"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="cs is-demo" id="cs">
  <div class="cs__head">
    <p class="cs__title">
      <svg class="cs__ico" aria-hidden="true"><use href="#ico-calendar-check"/></svg>
      <span>9월 습관 도장</span>
    </p>
    <p class="cs__say" id="say" role="status" aria-live="polite">도장 16개</p>
  </div>
  <div class="cs__days" id="days" role="grid" aria-label="9월 습관 도장 달력"></div>
</div>
</main>
<script>
var STORE = 'godrich-habit-stamp';
var LAST_DAY = 30, COLS = 7;
var DAY_LABEL = '{d}일 도장';
var SAY_TEXT = '도장 {n}개';
var root = document.getElementById('cs');
var box = document.getElementById('days');
var sayEl = document.getElementById('say');
var stamped = [1, 2, 3, 5, 6, 7, 8, 11, 12, 15, 16, 17, 20, 22, 23, 26];
var cells = {};

function load() {
  try {
    var raw = window.localStorage.getItem(STORE);
    if (raw) { stamped = JSON.parse(raw); }
  } catch (e) { /* 저장소가 막힌 창에서는 기본 기록 그대로 */ }
}
function save() {
  try { window.localStorage.setItem(STORE, JSON.stringify(stamped)); } catch (e) { /* 저장만 건너뛴다 */ }
}
function has(day) { return stamped.indexOf(day) >= 0; }
// 띠는 같은 줄에서만 이어진다 — 줄이 바뀌면 왼쪽·오른쪽 이음을 끊어 달력이 한 줄씩 읽힌다
function paintCell(day) {
  var b = cells[day];
  var on = has(day);
  var col = (day - 1) % COLS;
  var left = on && col > 0 && has(day - 1);
  var right = on && col < COLS - 1 && has(day + 1);
  b.className = 'cs__cell' + (on ? ' is-on' : '') + (left ? ' is-left' : '') + (right ? ' is-right' : '');
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
}
function paintAll() {
  for (var d = 1; d <= LAST_DAY; d++) { paintCell(d); }
  sayEl.textContent = SAY_TEXT.replace('{n}', String(stamped.length));
}
function build() {
  var row = null;
  for (var d = 1; d <= LAST_DAY; d++) {
    if ((d - 1) % COLS === 0) {
      row = document.createElement('div');
      row.className = 'cs__row';
      row.setAttribute('role', 'row');
      box.appendChild(row);
    }
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'cs__cell';
    b.setAttribute('role', 'gridcell');
    b.style.setProperty('--i', String(d - 1));
    b.setAttribute('aria-label', DAY_LABEL.replace('{d}', String(d)));
    b.innerHTML = '<span class="cs__n">' + d + '</span>'
      + '<svg class="cs__stamp" aria-hidden="true"><use href="#ico-check-circle"/></svg>';
    b.setAttribute('data-d', String(d));
    cells[d] = b;
    row.appendChild(b);
  }
}
load();
build();
paintAll();
box.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('.cs__cell') : null;
  if (!b) { return; }
  root.classList.remove('is-demo');
  var d = Number(b.getAttribute('data-d'));
  if (has(d)) { stamped.splice(stamped.indexOf(d), 1); } else { stamped.push(d); }
  save();
  paintAll();
});
</script>
</body>
</html>
