<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リマインダー時刻選び — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-bell" viewBox="0 0 256 256" fill="currentColor"><g><path d="M208 192H48a8 8 0 0 1-6.88-12C47.71 168.6 56 139.81 56 104a72 72 0 0 1 144 0c0 35.82 8.3 64.6 14.9 76a8 8 0 0 1-6.9 12" opacity=".2"/><path d="M221.8 175.94c-5.55-9.56-13.8-36.61-13.8-71.94a80 80 0 1 0-160 0c0 35.34-8.26 62.38-13.81 71.94A16 16 0 0 0 48 200h40.81a40 40 0 0 0 78.38 0H208a16 16 0 0 0 13.8-24.06M128 216a24 24 0 0 1-22.62-16h45.24A24 24 0 0 1 128 216M48 184c7.7-13.24 16-43.92 16-80a64 64 0 1 1 128 0c0 36.05 8.28 66.73 16 80Z"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="rp is-demo" id="rp">
  <div class="rp__card">
    <div class="rp__head">
      <p class="rp__title">
        <svg class="rp__bell" id="bell" aria-hidden="true"><use href="#ico-bell"/></svg>
        <span>リマインダー</span>
      </p>
      <span class="rp__swWrap">
        <span class="rp__swText">通知オン</span>
        <button class="rp__switch" id="sw" type="button" role="switch" aria-checked="true" aria-label="通知オン">
          <span class="rp__knob" aria-hidden="true"></span>
        </button>
      </span>
    </div>
    <div class="rp__chips" id="chips"></div>
    <p class="rp__say" id="say" role="status" aria-live="polite">次の通知まで3時間12分</p>
  </div>
</div>
</main>
<script>
var STORE = 'godrich-habit-reminder';
var TIMES = ['06:00', '07:30', '12:00', '18:30', '21:30'];
var CHIP_LABEL = '{t}に通知';
var LEFT_TEXT = '次の通知まで{h}時間{m}分';
var OFF_TEXT = '通知はオフです';
var root = document.getElementById('rp');
var chipBox = document.getElementById('chips');
var sw = document.getElementById('sw');
var sayEl = document.getElementById('say');
var state = { pick: 1, on: true };
var chips = [];
var tick = 0;

function load() {
  try {
    var raw = window.localStorage.getItem(STORE);
    if (raw) { state = JSON.parse(raw); }
  } catch (e) { /* 저장소가 막힌 창에서는 기본값 그대로 */ }
}
function save() {
  try { window.localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* 저장만 건너뛴다 */ }
}
// 고른 시각이 今日 이미 지났으면 내일 같은 시각까지를 센다
function minutesLeft(hhmm) {
  var parts = hhmm.split(':');
  var now = new Date();
  var at = new Date(now.getFullYear(), now.getMonth(), now.getDate(), Number(parts[0]), Number(parts[1]), 0, 0);
  var diff = Math.round((at.getTime() - now.getTime()) / 60000);
  return diff <= 0 ? diff + 24 * 60 : diff;
}
function paint() {
  for (var i = 0; i < chips.length; i++) {
    chips[i].setAttribute('aria-pressed', i === state.pick ? 'true' : 'false');
  }
  sw.setAttribute('aria-checked', state.on ? 'true' : 'false');
  if (!state.on) { sayEl.textContent = OFF_TEXT; return; }
  var left = minutesLeft(TIMES[state.pick]);
  sayEl.textContent = LEFT_TEXT.replace('{h}', String(Math.floor(left / 60))).replace('{m}', String(left % 60));
}
function build() {
  for (var i = 0; i < TIMES.length; i++) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'rp__chip';
    b.style.setProperty('--i', String(i));
    b.textContent = TIMES[i];
    b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', CHIP_LABEL.replace('{t}', TIMES[i]));
    b.setAttribute('data-i', String(i));
    chips.push(b);
    chipBox.appendChild(b);
  }
}
load();
build();
paint();
chipBox.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('.rp__chip') : null;
  if (!b) { return; }
  root.classList.remove('is-demo');
  state.pick = Number(b.getAttribute('data-i'));
  save();
  paint();
});
sw.addEventListener('click', function () {
  root.classList.remove('is-demo');
  state.on = !state.on;
  save();
  paint();
});
tick = window.setInterval(paint, 30000);
</script>
</body>
</html>
