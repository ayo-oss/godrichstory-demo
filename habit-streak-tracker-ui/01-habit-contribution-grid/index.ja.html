<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1年の草グリッド — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-calendar-check" viewBox="0 0 256 256" fill="currentColor"><g><path d="M216 48v40H40V48a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 32h-24v-8a8 8 0 0 0-16 0v8H88v-8a8 8 0 0 0-16 0v8H48a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16M72 48v8a8 8 0 0 0 16 0v-8h80v8a8 8 0 0 0 16 0v-8h24v32H48V48Zm136 160H48V96h160zm-38.34-85.66a8 8 0 0 1 0 11.32l-48 48a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L116 164.69l42.34-42.35a8 8 0 0 1 11.32 0"/></g></symbol>
    <symbol id="ico-plus-circle" viewBox="0 0 256 256" fill="currentColor"><g><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M176 128a8 8 0 0 1-8 8h-32v32a8 8 0 0 1-16 0v-32H88a8 8 0 0 1 0-16h32V88a8 8 0 0 1 16 0v32h32a8 8 0 0 1 8 8m56 0A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="cg is-demo" id="cg">
  <p class="cg__hint">
    <svg class="cg__ico" aria-hidden="true"><use href="#ico-calendar-check"/></svg>
    <span>マスに触れると日付と回数が見えます</span>
  </p>
  <div class="cg__wrap">
    <span class="cg__tip" id="tip" role="status" aria-live="polite"></span>
    <div class="cg__grid" id="grid" role="grid" aria-label="直近1年の習慣記録グリッド"></div>
  </div>
  <div class="cg__bar">
    <p class="cg__legend">
      <span class="cg__legendLabel">1日の回数</span>
      <span class="cg__keyItem"><i class="cg__key cg__key--l0"></i><b class="cg__keyNum">0</b></span>
      <span class="cg__keyItem"><i class="cg__key cg__key--l1"></i><b class="cg__keyNum">1</b></span>
      <span class="cg__keyItem"><i class="cg__key cg__key--l2"></i><b class="cg__keyNum">2</b></span>
      <span class="cg__keyItem"><i class="cg__key cg__key--l3"></i><b class="cg__keyNum">3</b></span>
      <span class="cg__keyItem"><i class="cg__key cg__key--l4"></i><b class="cg__keyNum">4</b></span>
    </p>
    <button class="cg__add" id="add" type="button">
      <svg class="cg__ico" aria-hidden="true"><use href="#ico-plus-circle"/></svg><span>今日を上げる</span>
    </button>
  </div>
</div>
</main>
<script>
var WEEKS = 53, DAYS = 7, TOTAL = WEEKS * DAYS, STORE = 'godrich-habit-grid';
var root = document.getElementById('cg');
var grid = document.getElementById('grid');
var tip = document.getElementById('tip');
var TIP_TEXT = '{m}月{d}日 · {n}回';
var TODAY_TEXT = '今日 {n}回';
var CELL_LABEL = '{m}月{d}日 · {n}回';
var cells = [];
var levels = [];

// 가짜 기록은 시드 고정 난수 — 새로 고쳐도 같은 잔디가 나온다 (mulberry32)
function seeded(seed) {
  return function () {
    seed = seed + 0x6d2b79f5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function load() {
  try { return Number(window.localStorage.getItem(STORE)) || 0; } catch (e) { return 0; }
}
function save(n) {
  try { window.localStorage.setItem(STORE, String(n)); } catch (e) { /* 시크릿 창에서는 저장만 건너뛴다 */ }
}
function dateOf(index) {
  var d = new Date();
  d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() - (TOTAL - 1 - index));
  return d;
}
function label(index, level) {
  var d = dateOf(index);
  return CELL_LABEL.replace('{m}', String(d.getMonth() + 1)).replace('{d}', String(d.getDate())).replace('{n}', String(level));
}
function build() {
  var rnd = seeded(20260912);
  for (var i = 0; i < TOTAL; i++) {
    var v = rnd();
    levels.push(v > 0.82 ? 4 : v > 0.68 ? 3 : v > 0.48 ? 2 : v > 0.3 ? 1 : 0);
  }
  levels[TOTAL - 1] = load();
  for (var r = 0; r < DAYS; r++) {
    var row = document.createElement('div');
    row.className = 'cg__row';
    row.setAttribute('role', 'row');
    for (var c = 0; c < WEEKS; c++) {
      var index = c * DAYS + r;
      var cell = document.createElement('span');
      cell.className = 'cg__cell cg__cell--l' + levels[index];
      cell.setAttribute('role', 'gridcell');
      cell.setAttribute('aria-label', label(index, levels[index]));
      cell.style.setProperty('--c', String(c));
      if (index === TOTAL - 1) { cell.classList.add('is-today'); }
      cells[index] = cell;
      row.appendChild(cell);
    }
    grid.appendChild(row);
  }
}
function paintToday() {
  var index = TOTAL - 1, cell = cells[index];
  cell.className = 'cg__cell cg__cell--l' + levels[index] + ' is-today';
  cell.setAttribute('aria-label', label(index, levels[index]));
  tip.textContent = TODAY_TEXT.replace('{n}', String(levels[index]));
}
function show(cell) {
  var index = cells.indexOf(cell);
  if (index < 0) { return; }
  var d = dateOf(index);
  tip.textContent = TIP_TEXT.replace('{m}', String(d.getMonth() + 1)).replace('{d}', String(d.getDate())).replace('{n}', String(levels[index]));
}
build();
paintToday();
grid.addEventListener('pointermove', function (e) {
  root.classList.remove('is-demo');
  if (e.target !== grid) { show(e.target); }
});
grid.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  if (e.target !== grid) { show(e.target); }
});
document.getElementById('add').addEventListener('click', function () {
  root.classList.remove('is-demo');
  var index = TOTAL - 1;
  levels[index] = levels[index] >= 4 ? 0 : levels[index] + 1;
  save(levels[index]);
  paintToday();
});
</script>
</body>
</html>
