<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge unlock — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-medal" viewBox="0 0 256 256" fill="currentColor"><g><path d="M176 96a48 48 0 1 1-48-48a48 48 0 0 1 48 48" opacity=".2"/><path d="M216 96a88 88 0 1 0-144 67.83V240a8 8 0 0 0 11.58 7.16L128 225l44.43 22.21a8.1 8.1 0 0 0 3.57.79a8 8 0 0 0 8-8v-76.17A87.85 87.85 0 0 0 216 96M56 96a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72m112 131.06l-36.43-18.21a8 8 0 0 0-7.16 0L88 227.06v-52.69a87.89 87.89 0 0 0 80 0ZM128 152a56 56 0 1 0-56-56a56.06 56.06 0 0 0 56 56m0-96a40 40 0 1 1-40 40a40 40 0 0 1 40-40"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="bu is-demo" id="bu">
  <div class="bu__head">
    <p class="bu__title">Badges</p>
    <p class="bu__say" id="say" role="status" aria-live="polite">12 days now · 1 badge open</p>
  </div>
  <div class="bu__row" id="row"></div>
  <div class="bu__bar">
    <button class="bu__go" id="plus1" type="button">One more day</button>
    <button class="bu__go" id="plus10" type="button">Ten more days</button>
    <button class="bu__reset" id="reset" type="button">Reset</button>
  </div>
</div>
</main>
<script>
var STORE = 'godrich-habit-badge';
var MARKS = [7, 30, 100];
var BADGE_LABEL = '{n}-day badge';
var LOCK_TEXT = 'Locked';
var SAY_TEXT = '{d} days now · {n} badges open';
var root = document.getElementById('bu');
var row = document.getElementById('row');
var sayEl = document.getElementById('say');
var days = 12;
var badges = [];

function load() {
  try { days = Number(window.localStorage.getItem(STORE)) || days; } catch (e) { /* 기본값 그대로 */ }
}
function save() {
  try { window.localStorage.setItem(STORE, String(days)); } catch (e) { /* 저장만 건너뛴다 */ }
}
function paint() {
  var open = 0;
  for (var i = 0; i < badges.length; i++) {
    var on = days >= MARKS[i];
    badges[i].className = 'bu__badge' + (on ? ' is-open' : '');
    badges[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    if (on) { open++; }
  }
  sayEl.textContent = SAY_TEXT.replace('{d}', String(days)).replace('{n}', String(open));
}
function build() {
  for (var i = 0; i < MARKS.length; i++) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'bu__badge';
    b.style.setProperty('--i', String(i));
    b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', BADGE_LABEL.replace('{n}', String(MARKS[i])));
    b.innerHTML = '<span class="bu__inner">'
      + '<span class="bu__face bu__face--lock"><b class="bu__mark">' + MARKS[i] + '</b><span class="bu__lock">' + LOCK_TEXT + '</span></span>'
      + '<span class="bu__face bu__face--win"><svg class="bu__ico" aria-hidden="true"><use href="#ico-medal"/></svg>'
      + '<b class="bu__mark">' + MARKS[i] + '</b><span class="bu__shine" aria-hidden="true"></span></span>'
      + '</span>';
    badges.push(b);
    row.appendChild(b);
  }
}
load();
build();
paint();
function bump(n) {
  root.classList.remove('is-demo');
  days = Math.max(0, days + n);
  save();
  paint();
}
document.getElementById('plus1').addEventListener('click', function () { bump(1); });
document.getElementById('plus10').addEventListener('click', function () { bump(10); });
document.getElementById('reset').addEventListener('click', function () { bump(-days); });
</script>
</body>
</html>
