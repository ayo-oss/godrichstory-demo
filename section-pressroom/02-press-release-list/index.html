<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Press release list — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="rl is-demo">
    <div class="rl__filters" role="group" aria-label="분류">
      <button class="rl__chip" type="button" data-cat="all" aria-pressed="true">전체</button>
      <button class="rl__chip" type="button" data-cat="product" aria-pressed="false">제품</button>
      <button class="rl__chip" type="button" data-cat="partner" aria-pressed="false">파트너십</button>
      <button class="rl__chip" type="button" data-cat="award" aria-pressed="false">수상</button>
    </div>
    <ul class="rl__list">
      <li class="rl__row" data-cat="product"><span class="rl__date">08.20</span><span class="rl__title">새 워크스페이스 기능 출시</span><span class="rl__tag">제품</span></li>
      <li class="rl__row" data-cat="partner"><span class="rl__date">07.02</span><span class="rl__title">B사와 유통 파트너십 체결</span><span class="rl__tag">파트너십</span></li>
      <li class="rl__row" data-cat="award"><span class="rl__date">06.15</span><span class="rl__title">올해의 스타트업상 수상</span><span class="rl__tag">수상</span></li>
      <li class="rl__row" data-cat="product"><span class="rl__date">05.30</span><span class="rl__title">3.0 버전 업데이트 공개</span><span class="rl__tag">제품</span></li>
    </ul>
  </section>
</main>
<script>
// 실제 동작: 분류 칩을 클릭하면 그 분류가 아닌 행이 실제로 접히고 칩 상태가 배타적으로 바뀐다.
var root = document.querySelector('.rl');
var chips = root.querySelectorAll('.rl__chip');
var rows = root.querySelectorAll('.rl__row');
chips.forEach(function (chip) {
  chip.addEventListener('click', function () {
    root.classList.remove('is-demo');
    chips.forEach(function (c) { c.setAttribute('aria-pressed', 'false'); });
    chip.setAttribute('aria-pressed', 'true');
    var cat = chip.getAttribute('data-cat');
    rows.forEach(function (row) {
      var show = cat === 'all' || row.getAttribute('data-cat') === cat;
      row.classList.toggle('is-hidden', !show);
    });
  });
});
</script>
</body>
</html>
