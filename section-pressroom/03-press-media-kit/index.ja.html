<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media kit download — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="mk">
    <h2 class="mk__title">メディアキット</h2>
    <ul class="mk__list">
      <li class="mk__row">
        <label class="mk__label">
          <input class="mk__check" type="checkbox" value="logo">
          <span class="mk__name">ロゴパック（SVG・PNG）</span>
        </label>
        <span class="mk__size">1.2MB</span>
        <svg class="mk__done-ic" viewBox="0 0 20 20" aria-hidden="true"><polyline points="4,10 8,14 16,5"/></svg>
      </li>
      <li class="mk__row">
        <label class="mk__label">
          <input class="mk__check" type="checkbox" value="guide">
          <span class="mk__name">ブランドガイド（PDF）</span>
        </label>
        <span class="mk__size">3.4MB</span>
        <svg class="mk__done-ic" viewBox="0 0 20 20" aria-hidden="true"><polyline points="4,10 8,14 16,5"/></svg>
      </li>
      <li class="mk__row">
        <label class="mk__label">
          <input class="mk__check" type="checkbox" value="shots">
          <span class="mk__name">製品スクリーンショット（ZIP）</span>
        </label>
        <span class="mk__size">4.8MB</span>
        <svg class="mk__done-ic" viewBox="0 0 20 20" aria-hidden="true"><polyline points="4,10 8,14 16,5"/></svg>
      </li>
    </ul>
    <button class="mk__btn" type="button" disabled>
      <span class="mk__btn-ic" aria-hidden="true"></span>
      選択したファイルを取得
    </button>
    <p class="mk__status" role="status" aria-live="polite"></p>
  </section>
</main>
<script>
// 실제 동작: 체크한 ファイル 수만큼 버튼 라벨이 바뀌고, 1개 이상이어야 버튼이 눌린다.
var root = document.querySelector('.mk');
var checks = root.querySelectorAll('.mk__check');
var btn = root.querySelector('.mk__btn');
var status = root.querySelector('.mk__status');

function updateLabel() {
  var checkedFiles = Array.prototype.filter.call(checks, function (c) { return c.checked; });
  btn.disabled = checkedFiles.length === 0;
  btn.lastChild.textContent = checkedFiles.length ? ' 選択したファイルを取得 (' + checkedFiles.length + ')' : ' 選択したファイルを取得';
}
checks.forEach(function (c) { c.addEventListener('change', updateLabel); });

btn.addEventListener('click', function () {
  var checkedFiles = Array.prototype.filter.call(checks, function (c) { return c.checked; });
  checkedFiles.forEach(function (c) { c.closest('.mk__row').classList.add('is-done'); });
  status.textContent = 'ファイル ' + checkedFiles.length + '件を取得しました。';
});
</script>
</body>
</html>
