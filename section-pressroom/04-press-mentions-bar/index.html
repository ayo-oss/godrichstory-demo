<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Press mentions bar — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="mb" aria-label="언론 보도">
    <p class="mb__label">AS SEEN IN</p>
    <div class="mb__viewport">
      <div class="mb__track">
        <span class="mb__logo mb__logo--1" aria-hidden="true"></span>
        <span class="mb__logo mb__logo--2" aria-hidden="true"></span>
        <span class="mb__logo mb__logo--3" aria-hidden="true"></span>
        <span class="mb__logo mb__logo--4" aria-hidden="true"></span>
        <span class="mb__logo mb__logo--1" aria-hidden="true"></span>
        <span class="mb__logo mb__logo--2" aria-hidden="true"></span>
        <span class="mb__logo mb__logo--3" aria-hidden="true"></span>
        <span class="mb__logo mb__logo--4" aria-hidden="true"></span>
      </div>
    </div>
    <button class="mb__pause" type="button" aria-pressed="false">흐름 멈추기</button>
  </section>
</main>
<script>
// 실제 동작: 버튼을 누르거나 마우스를 올리면 흐름이 실제로 멈춘다(터치 기기는 버튼으로).
var root = document.querySelector('.mb');
var btn = document.querySelector('.mb__pause');
btn.addEventListener('click', function () {
  var on = btn.getAttribute('aria-pressed') === 'true';
  btn.setAttribute('aria-pressed', String(!on));
  root.classList.toggle('is-paused', !on);
});
</script>
</body>
</html>
