<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Founder quote — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="fq is-demo">
    <span class="fq__mark" aria-hidden="true">"</span>
    <div class="fq__stage">
      <figure class="fq__slide is-active" data-i="0">
        <blockquote class="fq__quote">「小さなチームでも大手メディアと同じ速さで情報を届けられると信じています」</blockquote>
        <figcaption class="fq__who"><span class="fq__name">イ・ドヒョン</span> ・共同創業者 兼 CEO</figcaption>
      </figure>
      <figure class="fq__slide" data-i="1">
        <blockquote class="fq__quote">「プレスルームは宣伝ではなく、信頼を確かめる場所です」</blockquote>
        <figcaption class="fq__who"><span class="fq__name">パク・ソヨン</span> ・共同創業者 兼 CTO</figcaption>
      </figure>
    </div>
    <div class="fq__dots" role="group" aria-label="引用を選択">
      <button class="fq__dot is-active" type="button" data-i="0" aria-selected="true" aria-label="最初の引用"></button>
      <button class="fq__dot" type="button" data-i="1" aria-selected="false" aria-label="二番目の引用"></button>
    </div>
  </section>
</main>
<script>
// 실제 동작: 점을 클릭하면 그 인용문으로 실제로 크로스페이드 전환된다.
var root = document.querySelector('.fq');
var dots = root.querySelectorAll('.fq__dot');
var slides = root.querySelectorAll('.fq__slide');
dots.forEach(function (dot) {
  dot.addEventListener('click', function () {
    root.classList.remove('is-demo');
    var i = dot.getAttribute('data-i');
    dots.forEach(function (d) { d.classList.remove('is-active'); d.setAttribute('aria-selected', 'false'); });
    slides.forEach(function (s) { s.classList.remove('is-active'); });
    dot.classList.add('is-active'); dot.setAttribute('aria-selected', 'true');
    root.querySelector('.fq__slide[data-i="' + i + '"]').classList.add('is-active');
  });
});
</script>
</body>
</html>
