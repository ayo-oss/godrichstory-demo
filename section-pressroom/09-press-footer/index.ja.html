<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Press footer — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <footer class="pf">
    <div class="pf__top">
      <p class="pf__heading">プレスリリースをメールで受け取る</p>
      <form class="pf__form" novalidate>
        <input class="pf__input" type="email" placeholder="you@company.com" aria-label="メール">
        <button class="pf__submit" type="submit">
          <span class="pf__submit-label">購読する</span>
          <svg class="pf__check" viewBox="0 0 20 20" aria-hidden="true"><polyline points="4,10 8,14 16,5"/></svg>
        </button>
      </form>
      <p class="pf__status" role="status" aria-live="polite"></p>
    </div>
    <div class="pf__cols">
      <div class="pf__col"><p class="pf__col-title">プレス</p><a href="#">プレスリリース</a><a href="#">メディアキット</a></div>
      <div class="pf__col"><p class="pf__col-title">会社</p><a href="#">紹介</a><a href="#">採用</a></div>
      <div class="pf__col"><p class="pf__col-title">フォロー</p><a href="#">X</a><a href="#">LinkedIn</a></div>
    </div>
  </footer>
</main>
<script>
// 실제 동작: 제출 시 실제로 メール 형식을 검사한다. 통과하면 체크가 그려지고, 틀리면 입력칸이 흔들린다.
var form = document.querySelector('.pf__form');
var input = document.querySelector('.pf__input');
var status = document.querySelector('.pf__status');
form.addEventListener('submit', function (e) {
  e.preventDefault();
  var ok = /^\S+@\S+\.\S+$/.test(input.value);
  if (ok) {
    form.classList.add('is-done');
    status.textContent = '購読完了 — 確認メールを送りました。';
  } else {
    input.classList.remove('is-shake');
    void input.offsetWidth;
    input.classList.add('is-shake');
    status.textContent = '正しいメールアドレスを入力してください。';
  }
});
</script>
</body>
</html>
