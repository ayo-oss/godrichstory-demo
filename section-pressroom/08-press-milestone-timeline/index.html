<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milestone timeline — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="mt is-demo" data-active="0">
    <p class="mt__desc" role="status">2019년, 세 명이 작은 사무실에서 첫 제품을 출시했습니다.</p>
    <div class="mt__track">
      <span class="mt__fill" aria-hidden="true"></span>
      <ol class="mt__list">
        <li><button class="mt__stop" type="button" data-i="0" aria-current="step">
          <span class="mt__dot" aria-hidden="true"></span><span class="mt__year">2019</span><span class="mt__label">창립</span>
        </button></li>
        <li><button class="mt__stop" type="button" data-i="1">
          <span class="mt__dot" aria-hidden="true"></span><span class="mt__year">2021</span><span class="mt__label">시리즈 A</span>
        </button></li>
        <li><button class="mt__stop" type="button" data-i="2">
          <span class="mt__dot" aria-hidden="true"></span><span class="mt__year">2023</span><span class="mt__label">해외 진출</span>
        </button></li>
        <li><button class="mt__stop" type="button" data-i="3">
          <span class="mt__dot" aria-hidden="true"></span><span class="mt__year">2026</span><span class="mt__label">100만 사용자</span>
        </button></li>
      </ol>
    </div>
  </section>
</main>
<script>
// 실제 동작: 연혁을 클릭하면 그 지점까지 진행바가 scaleX 로 실제로 채워지고 설명 문단이 바뀐다.
var milestoneNotes = [
  '2019년, 세 명이 작은 사무실에서 첫 제품을 출시했습니다.',
  '2021년, 시리즈 A 투자를 유치하며 팀을 열 배로 키웠습니다.',
  '2023년, 일본·미국 지사를 열고 해외 진출을 시작했습니다.',
  '2026년, 누적 가입자 100만 명을 넘겼습니다.'
];
var root = document.querySelector('.mt');
var stops = root.querySelectorAll('.mt__stop');
var desc = root.querySelector('.mt__desc');
stops.forEach(function (btn) {
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    var i = Number(btn.getAttribute('data-i'));
    root.setAttribute('data-active', String(i));
    root.querySelector('.mt__fill').style.transform = 'scaleX(' + ((i + 1) / 4) + ')';
    stops.forEach(function (s) { s.removeAttribute('aria-current'); });
    btn.setAttribute('aria-current', 'step');
    desc.textContent = milestoneNotes[i];
  });
});
</script>
</body>
</html>
