<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Press hero — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ph">
    <span class="ph__orb ph__orb--1" aria-hidden="true"></span>
    <span class="ph__orb ph__orb--2" aria-hidden="true"></span>
    <span class="ph__orb ph__orb--3" aria-hidden="true"></span>
    <span class="ph__mark" aria-hidden="true"></span>
    <p class="ph__eyebrow">PRESS ROOM</p>
    <h1 class="ph__title">Dành cho báo chí & đối tác<br>Tin mới nhất</h1>
    <p class="ph__sub">Thông cáo báo chí, media kit và liên hệ đều gộp tại một chỗ.</p>
    <div class="ph__row">
      <a class="ph__cta" href="#">Xem thông cáo</a>
      <button class="ph__sub-btn" type="button" aria-pressed="false">
        <span class="ph__sub-ic" aria-hidden="true"></span>
        Đăng ký nhận tin
      </button>
    </div>
  </section>
</main>
<script>
// 실제 동작: 클릭마다 Đăng ký 상태가 실제로 바뀐다(아이콘 채움 + aria-pressed).
var btn = document.querySelector('.ph__sub-btn');
btn.addEventListener('click', function () {
  var on = btn.getAttribute('aria-pressed') === 'true';
  btn.setAttribute('aria-pressed', String(!on));
});
</script>
</body>
</html>
