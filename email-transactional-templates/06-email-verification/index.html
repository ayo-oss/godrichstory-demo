<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>이메일 주소를 인증하세요 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ema is-demo" id="ema">
<!--[if mso]>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td>
<![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="ema__table">
<tr><td align="center" class="ema__wrap">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="ema__card" style="max-width:400px">
<tr><td class="ema__brand">◆ Acme</td></tr>
<tr><td align="center" class="ema__hero"><span class="ema__badge" aria-hidden="true">✉️</span></td></tr>
<tr><td align="center" class="ema__title">이메일 주소를 인증하세요</td></tr>
<tr><td align="center" class="ema__body">아래 인증 코드를 입력하면 가입이 완료돼요.</td></tr>
<tr><td align="center" class="ema__ctawrap">
<table role="presentation" cellpadding="0" cellspacing="0"><tr>
<td class="ema__ctabtn"><a href="#" role="button" class="ema__cta" id="cta">482 913</a></td>
</tr></table>
</td></tr>
<tr><td align="center" class="ema__copyrow"><button type="button" class="ema__copybtn" id="copybtn">복사 <span id="copystate" aria-live="polite"></span></button></td></tr>
<tr><td align="center" class="ema__footer">Acme Inc · 서울 · <a href="#" class="ema__unsub">수신거부</a></td></tr>
</table>
</td></tr>
</table>
<!--[if mso]>
</td></tr></table>
<![endif]-->
</div>
<button type="button" class="ema-darktoggle" id="darktoggle" aria-pressed="false">다크 모드 미리보기</button>
</main>
<script>

var ema = document.getElementById('ema');
var cta = document.getElementById('cta');
var darktoggle = document.getElementById('darktoggle');
darktoggle.addEventListener('click', function () {
  var on = ema.classList.toggle('is-dark');
  darktoggle.setAttribute('aria-pressed', String(on));
});

var copybtn = document.getElementById('copybtn');
var copystate = document.getElementById('copystate');
copybtn.addEventListener('click', function () {
  var code = cta.textContent.trim();
  var ok = false;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code);
    ok = true;
  } else {
    // 클립보드 API 가 없는 환경(오래된 웹뷰 등) 폴백 — 숨김 textarea + execCommand 로 실제 복사
    var ta = document.createElement('textarea');
    ta.value = code; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
  }
  copystate.textContent = ok ? '복사됨' : '복사 실패 — 직접 선택하세요';
  setTimeout(function () { copystate.textContent = ''; }, 1500);
});

</script>
</body>
</html>
