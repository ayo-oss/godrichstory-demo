<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>ご注文が確定しました — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ema is-demo" id="ema">
<!--[if mso]>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td>
<![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="ema__table">
<tr><td align="center" class="ema__wrap">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="ema__card" style="max-width:400px">
<tr><td class="ema__brand">◆ Acme</td></tr>
<tr><td align="center" class="ema__hero"><span class="ema__badge" aria-hidden="true">🧾</span></td></tr>
<tr><td align="center" class="ema__title">ご注文が確定しました</td></tr>
<tr><td align="center" class="ema__body">注文番号#48213のお支払いが完了しました。<br>下部で領収書をご確認ください。</td></tr>
<tr><td align="center" class="ema__ctawrap">
<table role="presentation" cellpadding="0" cellspacing="0"><tr>
<td class="ema__ctabtn"><a href="#" role="button" class="ema__cta" id="cta">領収書を見る</a></td>
</tr></table>
</td></tr>
<tr><td class="ema__detailrow"><button type="button" class="ema__detailtoggle" id="detailtoggle" aria-expanded="false" aria-controls="detail">注文2件・合計32,800円</button><div class="ema__detail" id="detail"><div class="ema__detailin"><div class="ema__li"><span>ベーシックTシャツ・1点</span><span>18,900円</span></div><div class="ema__li"><span>ソックスセット・1点</span><span>13,900円</span></div></div></div></td></tr>
<tr><td align="center" class="ema__footer">Acme Inc・ソウル・ <a href="#" class="ema__unsub">配信停止</a></td></tr>
</table>
</td></tr>
</table>
<!--[if mso]>
</td></tr></table>
<![endif]-->
</div>
<button type="button" class="ema-darktoggle" id="darktoggle" aria-pressed="false">ダークモードプレビュー</button>
</main>
<script>

var ema = document.getElementById('ema');
var cta = document.getElementById('cta');
var darktoggle = document.getElementById('darktoggle');
darktoggle.addEventListener('click', function () {
  var on = ema.classList.toggle('is-dark');
  darktoggle.setAttribute('aria-pressed', String(on));
});

var dt = document.getElementById('detailtoggle');
dt.addEventListener('click', function () {
  ema.classList.remove('is-demo');
  var open = ema.classList.toggle('is-open');
  dt.setAttribute('aria-expanded', String(open));
});

</script>
</body>
</html>
