<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Your order is confirmed — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ema is-demo" id="ema">
<!--[if mso]>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td>
<![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="ema__table">
<tr><td align="center" class="ema__wrap">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="ema__card" style="max-width:400px">
<tr><td class="ema__brand">◆ Acme</td></tr>
<tr><td align="center" class="ema__hero"><span class="ema__badge" aria-hidden="true">🧾</span></td></tr>
<tr><td align="center" class="ema__title">Your order is confirmed</td></tr>
<tr><td align="center" class="ema__body">Payment for order #48213 is complete.<br>Check your receipt below.</td></tr>
<tr><td align="center" class="ema__ctawrap">
<table role="presentation" cellpadding="0" cellspacing="0"><tr>
<td class="ema__ctabtn"><a href="#" role="button" class="ema__cta" id="cta">View receipt</a></td>
</tr></table>
</td></tr>
<tr><td class="ema__detailrow"><button type="button" class="ema__detailtoggle" id="detailtoggle" aria-expanded="false" aria-controls="detail">2 items · 32,800 won total</button><div class="ema__detail" id="detail"><div class="ema__detailin"><div class="ema__li"><span>Basic T-shirt · 1</span><span>18,900 won</span></div><div class="ema__li"><span>Sock set · 1</span><span>13,900 won</span></div></div></div></td></tr>
<tr><td align="center" class="ema__footer">Acme Inc · Seoul · <a href="#" class="ema__unsub">Unsubscribe</a></td></tr>
</table>
</td></tr>
</table>
<!--[if mso]>
</td></tr></table>
<![endif]-->
</div>
<button type="button" class="ema-darktoggle" id="darktoggle" aria-pressed="false">Preview dark mode</button>
</main>
<script>

var ema = document.getElementById('ema');
var cta = document.getElementById('cta');
var darktoggle = document.getElementById('darktoggle');
darktoggle.addEventListener('click', function () {
  var on = ema.classList.toggle('is-dark');
  darktoggle.setAttribute('aria-pressed', String(on));
});

var dt = document.getElementById('detailtoggle');
dt.addEventListener('click', function () {
  ema.classList.remove('is-demo');
  var open = ema.classList.toggle('is-open');
  dt.setAttribute('aria-expanded', String(open));
});

</script>
</body>
</html>
