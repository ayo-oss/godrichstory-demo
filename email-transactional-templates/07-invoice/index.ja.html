<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>今月の請求書が届きました — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ema is-demo" id="ema">
<!--[if mso]>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td>
<![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="ema__table">
<tr><td align="center" class="ema__wrap">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="ema__card" style="max-width:400px">
<tr><td class="ema__brand">◆ Acme</td></tr>
<tr><td align="center" class="ema__hero"><span class="ema__badge" aria-hidden="true">💳</span></td></tr>
<tr><td align="center" class="ema__title">今月の請求書が届きました</td></tr>
<tr><td align="center" class="ema__body">定期課金の金額が今月の請求書に含まれています。</td></tr>
<tr><td align="center" class="ema__ctawrap">
<table role="presentation" cellpadding="0" cellspacing="0"><tr>
<td class="ema__ctabtn"><a href="#" role="button" class="ema__cta" id="cta">請求書を確認</a></td>
</tr></table>
</td></tr>
<tr><td align="center" class="ema__amount">月額サブスク <b id="amt">0円</b></td></tr><tr><td class="ema__detailrow"><button type="button" class="ema__detailtoggle" id="detailtoggle" aria-expanded="false" aria-controls="detail">請求内訳を見る</button><div class="ema__detail" id="detail"><div class="ema__detailin"><div class="ema__li"><span>Acme Pro 月額</span><span>12,900円</span></div></div></div></td></tr>
<tr><td align="center" class="ema__footer">Acme Inc・ソウル・ <a href="#" class="ema__unsub">配信停止</a></td></tr>
</table>
</td></tr>
</table>
<!--[if mso]>
</td></tr></table>
<![endif]-->
</div>
<button type="button" class="ema-darktoggle" id="darktoggle" aria-pressed="false">ダークモードプレビュー</button>
</main>
<script>

var ema = document.getElementById('ema');
var cta = document.getElementById('cta');
var darktoggle = document.getElementById('darktoggle');
darktoggle.addEventListener('click', function () {
  var on = ema.classList.toggle('is-dark');
  darktoggle.setAttribute('aria-pressed', String(on));
});

var amt = document.getElementById('amt');
var target = 12900, cur = 0;
var t0 = null;
function step(ts) {
  if (!t0) t0 = ts;
  var p = Math.min(1, (ts - t0) / 1200);
  cur = Math.round(target * p);
  amt.textContent = cur.toLocaleString('ko-KR') + '円';
  if (p < 1) requestAnimationFrame(step);
}
requestAnimationFrame(step);
var dt = document.getElementById('detailtoggle');
dt.addEventListener('click', function () {
  ema.classList.remove('is-demo');
  var open = ema.classList.toggle('is-open');
  dt.setAttribute('aria-expanded', String(open));
});

</script>
</body>
</html>
