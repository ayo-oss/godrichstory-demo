<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>상품이 발송됐어요 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ema is-demo" id="ema">
<!--[if mso]>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td>
<![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="ema__table">
<tr><td align="center" class="ema__wrap">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="ema__card" style="max-width:400px">
<tr><td class="ema__brand">◆ Acme</td></tr>
<tr><td align="center" class="ema__hero"><span class="ema__badge" aria-hidden="true">📦</span></td></tr>
<tr><td align="center" class="ema__title">상품이 발송됐어요</td></tr>
<tr><td align="center" class="ema__body">주문하신 상품이 출발했어요.<br>아래에서 배송 현황을 확인하세요.</td></tr>
<tr><td align="center" class="ema__ctawrap">
<table role="presentation" cellpadding="0" cellspacing="0"><tr>
<td class="ema__ctabtn"><a href="#" role="button" class="ema__cta" id="cta">배송 조회</a></td>
</tr></table>
</td></tr>
<tr><td class="ema__steprow"><div class="ema__track" aria-hidden="true"><span class="ema__fill" id="fill"></span></div><button type="button" class="ema__detailtoggle" id="detailtoggle" aria-expanded="false" aria-controls="detail">배송 단계 보기</button><div class="ema__detail" id="detail"><div class="ema__detailin"><div class="ema__li"><span>상품 준비</span><span>완료</span></div><div class="ema__li"><span>발송</span><span>진행중</span></div><div class="ema__li"><span>배송 완료</span><span>대기</span></div></div></div></td></tr>
<tr><td align="center" class="ema__footer">Acme Inc · 서울 · <a href="#" class="ema__unsub">수신거부</a></td></tr>
</table>
</td></tr>
</table>
<!--[if mso]>
</td></tr></table>
<![endif]-->
</div>
<button type="button" class="ema-darktoggle" id="darktoggle" aria-pressed="false">다크 모드 미리보기</button>
</main>
<script>

var ema = document.getElementById('ema');
var cta = document.getElementById('cta');
var darktoggle = document.getElementById('darktoggle');
darktoggle.addEventListener('click', function () {
  var on = ema.classList.toggle('is-dark');
  darktoggle.setAttribute('aria-pressed', String(on));
});

var dt = document.getElementById('detailtoggle');
dt.addEventListener('click', function () {
  ema.classList.remove('is-demo');
  var open = ema.classList.toggle('is-open');
  dt.setAttribute('aria-expanded', String(open));
});

</script>
</body>
</html>
