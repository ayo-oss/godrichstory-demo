<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pull-to-open knob — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-hand" viewBox="0 0 256 256" fill="currentColor"><g><path d="M208 108v44a80 80 0 0 1-160 0v-12a20 20 0 0 1 20-20h20V92a20 20 0 0 1 40 0a20 20 0 0 1 40 0v16a20 20 0 0 1 40 0" opacity=".2"/><path d="M188 80a27.8 27.8 0 0 0-13.36 3.4a28 28 0 0 0-46.64-11A28 28 0 0 0 80 92v20H68a28 28 0 0 0-28 28v12a88 88 0 0 0 176 0v-44a28 28 0 0 0-28-28m12 72a72 72 0 0 1-144 0v-12a12 12 0 0 1 12-12h12v24a8 8 0 0 0 16 0V92a12 12 0 0 1 24 0v28a8 8 0 0 0 16 0V92a12 12 0 0 1 24 0v28a8 8 0 0 0 16 0v-12a12 12 0 0 1 24 0Z"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="pk is-demo" id="pk">
  <p class="pk__hint">
    <svg class="pk__ico" aria-hidden="true"><use href="#ico-hand"/></svg>
    <span>Pull it down</span>
  </p>
  <div class="pk__body">
    <div class="pk__lidWrap">
      <div class="pk__mouth"></div>
      <div class="pk__lid" id="lid"><i class="pk__lidFace"></i></div>
    </div>
    <p class="pk__state">
      <i class="pk__dot"></i>
      <span class="pk__stateLock">Locked</span>
      <span class="pk__stateOpen">Open</span>
    </p>
    <div class="pk__neck">
      <i class="pk__stem"></i>
      <button class="pk__knob" id="knob" type="button" aria-expanded="false" aria-controls="lid" aria-label="Pull-to-open lock knob">
        <i class="pk__grip"></i>
      </button>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('pk');
  var knob = document.getElementById('knob');
  var PULL_MAX = 44;
  var THRESHOLD = 30;

  function human() { root.classList.remove('is-demo'); }
  function setPull(px) { root.style.setProperty('--pull', String(px)); }
  function setOpen(open) {
    knob.setAttribute('aria-expanded', open ? 'true' : 'false');
    root.classList.toggle('is-open', open);
  }

  var startY = 0, dragging = false;
  knob.addEventListener('pointerdown', function (e) {
    human();
    dragging = true;
    startY = e.clientY;
    root.classList.add('is-drag');
    knob.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  knob.addEventListener('pointermove', function (e) {
    if (!dragging) { return; }
    var dy = e.clientY - startY;
    setPull(Math.min(PULL_MAX, Math.max(0, dy)));
  });
  knob.addEventListener('pointerup', function (e) {
    if (!dragging) { return; }
    dragging = false;
    var moved = e.clientY - startY;
    root.classList.remove('is-drag');
    setPull(0);
    if (moved >= THRESHOLD) { setOpen(true); }
    else if (moved >= -6 && moved < 6) { setOpen(knob.getAttribute('aria-expanded') !== 'true'); }
    if (knob.hasPointerCapture(e.pointerId)) { knob.releasePointerCapture(e.pointerId); }
  });
  knob.addEventListener('pointercancel', function () {
    dragging = false;
    root.classList.remove('is-drag');
    setPull(0);
  });
  knob.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      human();
      setOpen(knob.getAttribute('aria-expanded') !== 'true');
    }
  });
})();
</script>
</body>
</html>
