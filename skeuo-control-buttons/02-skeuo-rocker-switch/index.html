<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로커 전원 스위치 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rs is-demo" id="rs">
  <section class="rs__plate">
    <p class="rs__head"><span class="rs__lamp" aria-hidden="true"></span><span class="rs__onWord">ON</span></p>
    <div class="rs__bezel">
      <button class="rs__rocker" id="rsRocker" type="button" role="switch" aria-checked="false" aria-label="전원 로커">
        <span class="rs__cap rs__capTop"><b class="rs__io">I</b></span>
        <span class="rs__cap rs__capBottom"><b class="rs__io">O</b></span>
      </button>
    </div>
    <p class="rs__state" role="status"><span class="rs__wordOff">꺼짐</span><span class="rs__wordOn">켜짐</span></p>
  </section>
</div>
</main>
<script>
var root = document.getElementById('rs');
var rocker = document.getElementById('rsRocker');

function setOn(on) {
  rocker.setAttribute('aria-checked', on ? 'true' : 'false');
  root.classList.toggle('is-on', on);
}
function toggle() {
  root.classList.remove('is-demo');
  setOn(rocker.getAttribute('aria-checked') !== 'true');
}
rocker.addEventListener('pointerdown', function () { root.classList.remove('is-demo'); });
rocker.addEventListener('click', toggle);
</script>
</body>
</html>
