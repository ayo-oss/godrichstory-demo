<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回転ダイヤルノブ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dk is-demo" id="dk">
  <div class="dk__ring" id="dkRing">
    <span class="dk__ticks" aria-hidden="true"></span>
    <span class="dk__arc" aria-hidden="true"></span>
    <span class="dk__needle" aria-hidden="true"></span>
    <div class="dk__knobWrap">
      <button class="dk__knob" id="dkKnob" type="button" role="slider" aria-label="明るさダイヤル"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0%"></button>
    </div>
    <span class="dk__scaleMin" aria-hidden="true">0</span>
    <span class="dk__scaleMax" aria-hidden="true">100</span>
  </div>
  <div class="dk__side">
    <p class="dk__label">明るさ</p>
    <p class="dk__readout">
      <b class="dk__value" id="dkValue">0%</b>
      <span class="dk__demoDigits" aria-hidden="true"><i class="dk__digit dk__digit--0">0%</i><i class="dk__digit dk__digit--1">20%</i><i class="dk__digit dk__digit--2">40%</i><i class="dk__digit dk__digit--3">60%</i><i class="dk__digit dk__digit--4">80%</i><i class="dk__digit dk__digit--5">100%</i></span>
    </p>
    <p class="dk__hint">ドラッグか矢印キーで調節</p>
  </div>
</div>
</main>
<script>
var root = document.getElementById('dk');
var ring = document.getElementById('dkRing');
var knob = document.getElementById('dkKnob');
var valueEl = document.getElementById('dkValue');
var MIN = -135, MAX = 135; // 도(°). 0도는 정위(12시 방향)
var VAL_TEXT = '{v}％';
var value = 0;
var dragging = false;

function apply() {
  var angle = MIN + (MAX - MIN) * value / 100; // 백분율 값을 각도로
  root.style.setProperty('--angle', String(Math.round(angle)));
  root.style.setProperty('--fill', (value / 100).toFixed(3));
  knob.setAttribute('aria-valuenow', String(value));
  knob.setAttribute('aria-valuetext', VAL_TEXT.replace('{v}', String(value)));
  valueEl.textContent = value + '%';
}
function angleOf(x, y) {
  var r = ring.getBoundingClientRect();
  var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  var deg = Math.atan2(x - cx, cy - y) * 180 / Math.PI; // 정위가 0도, 시계 방향이 양수
  return Math.max(MIN, Math.min(MAX, deg));
}
knob.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  dragging = true;
  knob.setPointerCapture(e.pointerId);
  value = Math.round((angleOf(e.clientX, e.clientY) - MIN) / (MAX - MIN) * 100);
  apply();
});
knob.addEventListener('pointermove', function (e) {
  if (!dragging) { root.classList.remove('is-demo'); return; }
  value = Math.round((angleOf(e.clientX, e.clientY) - MIN) / (MAX - MIN) * 100);
  apply();
});
knob.addEventListener('pointerup', function () { dragging = false; });
knob.addEventListener('pointercancel', function () { dragging = false; });
knob.addEventListener('keydown', function (e) {
  var step = e.shiftKey ? 10 : 5;
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { value = Math.min(100, value + step); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { value = Math.max(0, value - step); }
  else if (e.key === 'Home') { value = 0; }
  else if (e.key === 'End') { value = 100; }
  else { return; }
  e.preventDefault();
  root.classList.remove('is-demo');
  apply();
});
apply();
</script>
</body>
</html>
