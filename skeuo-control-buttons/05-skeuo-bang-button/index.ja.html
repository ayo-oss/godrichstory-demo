<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>緊急バングボタン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-warning" viewBox="0 0 256 256" fill="currentColor"><g><path d="M224 91.55v72.9a8 8 0 0 1-2.34 5.66l-51.55 51.55a8 8 0 0 1-5.66 2.34h-72.9a8 8 0 0 1-5.66-2.34l-51.55-51.55a8 8 0 0 1-2.34-5.66v-72.9a8 8 0 0 1 2.34-5.66l51.55-51.55A8 8 0 0 1 91.55 32h72.9a8 8 0 0 1 5.66 2.34l51.55 51.55a8 8 0 0 1 2.34 5.66" opacity=".2"/><path d="M120 136V80a8 8 0 0 1 16 0v56a8 8 0 0 1-16 0m112-44.45v72.9a15.86 15.86 0 0 1-4.69 11.31l-51.55 51.55a15.86 15.86 0 0 1-11.31 4.69h-72.9a15.86 15.86 0 0 1-11.31-4.69l-51.55-51.55A15.86 15.86 0 0 1 24 164.45v-72.9a15.86 15.86 0 0 1 4.69-11.31l51.55-51.55A15.86 15.86 0 0 1 91.55 24h72.9a15.86 15.86 0 0 1 11.31 4.69l51.55 51.55A15.86 15.86 0 0 1 232 91.55m-16 0L164.45 40h-72.9L40 91.55v72.9L91.55 216h72.9L216 164.45ZM128 160a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="bb is-demo" id="bb">
  <p class="bb__hint">
    <svg class="bb__ico" aria-hidden="true"><use href="#ico-warning"/></svg>
    <span>押してみてください</span>
  </p>
  <div class="bb__scene">
    <div class="bb__panel">
      <span class="bb__lampWrap">
        <i class="bb__lamp"><i class="bb__lampGlow"></i></i>
        <span class="bb__lampText">警告</span>
      </span>
      <div class="bb__well">
        <i class="bb__shadow"></i>
        <button class="bb__btn" id="btn" type="button" aria-pressed="false" aria-label="非常停止ボタン">
          <i class="bb__dome"></i>
        </button>
      </div>
      <p class="bb__state">
        <span class="bb__stateIdle">待機</span>
        <span class="bb__stateHit">作動</span>
      </p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('bb');
  var btn = document.getElementById('btn');
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    var on = btn.getAttribute('aria-pressed') === 'true';
    btn.setAttribute('aria-pressed', on ? 'false' : 'true');
    root.classList.toggle('is-on', !on);
  });
})();
</script>
</body>
</html>
