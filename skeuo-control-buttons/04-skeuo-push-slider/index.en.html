<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Push fader slider — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-faders" viewBox="0 0 256 256" fill="currentColor"><g><path d="M200 40v176H56V40Z" opacity=".2"/><path d="M136 120v96a8 8 0 0 1-16 0v-96a8 8 0 0 1 16 0m64 72a8 8 0 0 0-8 8v16a8 8 0 0 0 16 0v-16a8 8 0 0 0-8-8m24-32h-16V40a8 8 0 0 0-16 0v120h-16a8 8 0 0 0 0 16h48a8 8 0 0 0 0-16m-168 0a8 8 0 0 0-8 8v48a8 8 0 0 0 16 0v-48a8 8 0 0 0-8-8m24-32H64V40a8 8 0 0 0-16 0v88H32a8 8 0 0 0 0 16h48a8 8 0 0 0 0-16m72-48h-16V40a8 8 0 0 0-16 0v40h-16a8 8 0 0 0 0 16h48a8 8 0 0 0 0-16"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="pf is-demo" id="pf">
  <p class="pf__hint">
    <svg class="pf__ico" aria-hidden="true"><use href="#ico-faders"/></svg>
    <span>Slide it left and right</span>
  </p>
  <button class="pf__well" id="well" type="button" role="slider" tabindex="0"
          aria-label="Channel fader" aria-orientation="horizontal"
          aria-valuemin="0" aria-valuemax="10" aria-valuenow="5">
    <span class="pf__slot"></span>
    <span class="pf__capWrap" id="capWrap"><span class="pf__cap"><i class="pf__stripe"></i></span></span>
  </button>
  <div class="pf__scale" aria-hidden="true">
    <span class="pf__num">0</span><span class="pf__num">1</span><span class="pf__num">2</span><span class="pf__num">3</span><span class="pf__num">4</span><span class="pf__num">5</span><span class="pf__num">6</span><span class="pf__num">7</span><span class="pf__num">8</span><span class="pf__num">9</span><span class="pf__num">10</span>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('pf');
  var well = document.getElementById('well');
  var wrap = document.getElementById('capWrap');
  var cap = wrap.querySelector('.pf__cap');
  var nums = [].slice.call(document.querySelectorAll('.pf__num'));
  var MIN = 0, MAX = 10;
  var value = 5;
  var lastPx = 0;
  var pressTimer = 0;

  function travel() { return Math.max(0, wrap.clientWidth - cap.offsetWidth); }
  function human() { root.classList.remove('is-demo'); }
  function cushion() {
    cap.classList.add('is-press');
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function () { cap.classList.remove('is-press'); }, 180);
  }
  function apply(px) {
    wrap.style.setProperty('--x', px + 'px');
    lastPx = px;
    value = travel() > 0 ? Math.round(px / travel() * MAX) : 0;
    well.setAttribute('aria-valuenow', String(value));
    nums.forEach(function (n, i) { n.classList.toggle('is-on', i === value); });
  }
  apply(value / MAX * travel());

  var startX = 0, startPx = 0;
  well.addEventListener('pointerdown', function (e) {
    human();
    well.setPointerCapture(e.pointerId);
    startX = e.clientX;
    startPx = lastPx;
    e.preventDefault();
  });
  well.addEventListener('pointermove', function (e) {
    if (!well.hasPointerCapture(e.pointerId)) { return; }
    var t = travel();
    var px = Math.min(t, Math.max(0, startPx + (e.clientX - startX)));
    if ((px === 0 && lastPx > 0) || (px === t && lastPx < t)) { cushion(); }
    apply(px);
  });
  well.addEventListener('pointerup', function (e) {
    if (well.hasPointerCapture(e.pointerId)) { well.releasePointerCapture(e.pointerId); }
  });
  well.addEventListener('keydown', function (e) {
    var next = null;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { next = Math.min(MAX, value + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { next = Math.max(MIN, value - 1); }
    else if (e.key === 'Home') { next = MIN; }
    else if (e.key === 'End') { next = MAX; }
    if (next === null) { return; }
    e.preventDefault();
    human();
    if (next === MIN || next === MAX) { cushion(); }
    apply(next / MAX * travel());
  });
})();
</script>
</body>
</html>
