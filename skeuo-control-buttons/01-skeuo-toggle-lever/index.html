<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토글 레버 스위치 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tl is-demo" id="tl">
  <section class="tl__panel">
    <p class="tl__head"><span class="tl__led" aria-hidden="true"></span><span class="tl__name">전원</span></p>
    <div class="tl__assembly">
      <span class="tl__bracket" aria-hidden="true"></span>
      <span class="tl__slot" aria-hidden="true"></span>
      <span class="tl__dome" aria-hidden="true"></span>
      <button class="tl__hit" id="tlLever" type="button" role="switch" aria-checked="false" aria-label="전원 레버">
        <span class="tl__armWrap" aria-hidden="true"><span class="tl__grip"></span></span>
      </button>
    </div>
    <p class="tl__marks" aria-hidden="true"><span class="tl__mark tl__mark--off">OFF</span><span class="tl__mark tl__mark--on">ON</span></p>
    <p class="tl__state" role="status"><span class="tl__wordOff">꺼짐</span><span class="tl__wordOn">켜짐</span></p>
  </section>
</div>
</main>
<script>
var root = document.getElementById('tl');
var lever = document.getElementById('tlLever');

function setOn(on) {
  lever.setAttribute('aria-checked', on ? 'true' : 'false');
  root.classList.toggle('is-on', on);
}
function toggle() {
  root.classList.remove('is-demo');
  setOn(lever.getAttribute('aria-checked') !== 'true');
}
lever.addEventListener('pointerdown', function () { root.classList.remove('is-demo'); });
lever.addEventListener('click', toggle);
</script>
</body>
</html>
