<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카세트 이젝트 버튼 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cs is-demo" id="cs" data-out="false">
    <div class="cs__deck">
      <div class="cs__bay">
        <div class="cs__tape">
          <div class="cs__label"><b>MIX 90</b><span>SIDE A</span></div>
          <span class="cs__reel cs__reel--l" aria-hidden="true"></span>
          <span class="cs__reel cs__reel--r" aria-hidden="true"></span>
          <span class="cs__mouth" aria-hidden="true"></span>
        </div>
      </div>
      <div class="cs__panel">
        <span class="cs__vents" aria-hidden="true"></span>
        <button class="cs__key" id="key" type="button" aria-pressed="false">
          <svg class="cs__ejectIco" viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><g><path d="M216 168v24a8 8 0 0 1-8 8H48a8 8 0 0 1-8-8v-24a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8M48.23 128h159.54c7.16 0 10.89-8.27 6-13.37l-73.74-77.5a16.76 16.76 0 0 0-24.14 0l-73.74 77.5c-4.81 5.1-1.08 13.37 6.08 13.37" opacity=".2"/><path d="M208 152H48a16 16 0 0 0-16 16v24a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16v-24a16 16 0 0 0-16-16m0 40H48v-24h160ZM48.24 136h159.52a16.18 16.18 0 0 0 14.93-9.76a15.59 15.59 0 0 0-3.1-17.12l-73.73-77.51a24.76 24.76 0 0 0-35.72 0l-73.73 77.51a15.59 15.59 0 0 0-3.1 17.12A16.18 16.18 0 0 0 48.24 136m73.49-93.36a8.77 8.77 0 0 1 12.54 0L207.85 120H48.14Z"/></g></svg>
          <span>이젝트</span>
        </button>
      </div>
    </div>
    <p class="cs__status">
      <span class="cs__state cs__state--in">테이프를 넣었습니다</span>
      <span class="cs__state cs__state--out">테이프를 꺼냈습니다</span>
    </p>
  </div>
</main>
<script>
var root = document.getElementById('cs');
var key = document.getElementById('key');
// 테이프·키·글월은 전부 data-out 하나로 갈린다. 화면 글자를 JS 가 건드리지 않는다.
key.addEventListener('click', function () {
  root.classList.remove('is-demo');
  var out = root.getAttribute('data-out') !== 'true';
  root.setAttribute('data-out', out ? 'true' : 'false');
  key.setAttribute('aria-pressed', out ? 'true' : 'false');
});
root.addEventListener('pointerdown', function () { root.classList.remove('is-demo'); });
</script>
</body>
</html>
