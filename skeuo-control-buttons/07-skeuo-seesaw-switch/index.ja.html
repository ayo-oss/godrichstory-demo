<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シーソースイッチ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ss is-demo" id="ss" data-side="a">
    <p class="ss__hint">両端を押してAかBを選びます</p>
    <div class="ss__scene">
      <div class="ss__ground" aria-hidden="true"></div>
      <div class="ss__plinth" aria-hidden="true"></div>
      <div class="ss__plank">
        <button class="ss__pad ss__pad--a" id="padA" type="button" aria-pressed="true">
          <b class="ss__key">A</b><span class="ss__sub">左</span>
        </button>
        <span class="ss__bolt" aria-hidden="true"></span>
        <button class="ss__pad ss__pad--b" id="padB" type="button" aria-pressed="false">
          <b class="ss__key">B</b><span class="ss__sub">右</span>
        </button>
      </div>
    </div>
    <p class="ss__out">
      <span class="ss__outLabel">選択</span>
      <span class="ss__outVal">
        <b class="ss__letter ss__letter--a">A</b>
        <b class="ss__letter ss__letter--b">B</b>
      </span>
    </p>
  </div>
</main>
<script>
var root = document.getElementById('ss');
var padA = document.getElementById('padA');
var padB = document.getElementById('padB');
// 각도·눌림·글월은 전부 data-side 하나로 갈린다. 화면 글자를 JS 가 건드리지 않는다.
function pick(side) {
  root.classList.remove('is-demo');
  root.setAttribute('data-side', side);
  padA.setAttribute('aria-pressed', side === 'a' ? 'true' : 'false');
  padB.setAttribute('aria-pressed', side === 'b' ? 'true' : 'false');
}
padA.addEventListener('click', function () { pick('a'); });
padB.addEventListener('click', function () { pick('b'); });
root.addEventListener('pointerdown', function () { root.classList.remove('is-demo'); });
</script>
</body>
</html>
