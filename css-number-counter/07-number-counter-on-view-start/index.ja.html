<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number counter — start on view</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="viewport is-demo">
    <div class="track">
      <div class="card">
        <span class="card__num" aria-hidden="true"></span>
        <span class="card__sr">1,280</span>
        <span class="card__label">累計訪問者</span>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 페이지: 카드가 뷰포트에 60% 이상 들어와야 카운트를 시작한다 (스크롤해서 보이기 전엔 0)
var card = document.querySelector('.card');
new IntersectionObserver(function (es) {
  card.classList.toggle('is-counting', es[0].isIntersecting);
}, { threshold: .6 }).observe(card);
</script>
</body>
</html>
