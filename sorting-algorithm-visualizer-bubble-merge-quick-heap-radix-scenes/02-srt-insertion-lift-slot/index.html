<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 장을 들어 올려 알맞은 틈에 끼우는 삽입 정렬 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="정렬 시연 무대 — 누른 뒤 Enter 로 일시정지, 오른쪽 방향키로 한 걸음">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="정렬된 구간 오른쪽의 막대 하나를 위로 들어 올리고, 그보다 큰 왼쪽 막대들을 한 칸씩 오른쪽으로 밀어 틈을 만든 뒤 들어 올린 막대를 그 틈에 내려 꽂는 삽입 정렬. 밀리는 막대는 느슨한 스프링이라 늦게 따라온다"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">정렬 시연</p>
  <div class="vj__ctrl">
    <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
    <button class="vj__step" data-role="step" type="button">한 걸음</button>
  </div>
  <p class="vj__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 선형 합동 생성기(곱 1664525, 더함 1013904223). 같은 시드면 같은 배열
    function seeded(seed) {
        let s = (seed >>> 0) || 1;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 1 부터 n 까지를 한 번씩 담아 섞는다 — 같은 값이 두 번 나오지 않아 막대 높이가 모두 다르다
    function shuffled(n, seed) {
        const rng = seeded(seed);
        const a = [];
        for (let i = 0; i < n; i += 1) {
            a.push(i + 1);
        }
        for (let i = n - 1; i > 0; i -= 1) {
            const j = Math.floor(rng() * (i + 1));
            const t = a[i];
            a[i] = a[j];
            a[j] = t;
        }
        return a;
    }
    // 파스텔 팔레트 — 바탕은 연한 라벤더 크림, 막대는 하늘색에서 분홍으로 가는 값 그라디언트
    const BG_TOP = [248, 244, 252];
    const BG_BOT = [228, 234, 250];
    const WATER = [168, 206, 244];
    const ROSE = [240, 150, 176];
    const MINT = [150, 214, 190];
    const BUTTER = [250, 224, 140];
    const LAV = [188, 172, 236];
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    const NIGHT_TOP = [38, 44, 86];
    const NIGHT_BOT = [78, 88, 140];
    const DAWN_TOP = [176, 196, 240];
    const DAWN_BOT = [252, 218, 200];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 값 하나의 색 — 작은 값은 하늘색, 큰 값은 분홍. 정렬이 되면 색이 매끈한 띠가 된다
    function barColor(v, n) { return mix(WATER, ROSE, (v - 1) / Math.max(1, n - 1)); }
    // 색상환 색 — 색 자체가 값이라 채도를 살린다(파스텔 변환 대상이 아닌 기능색)
    function hueColor(h) {
        const s = 0.62;
        const l = 0.74;
        const q = l < 0.5 ? l * (1 + s) : l + s - l * s;
        const p = 2 * l - q;
        function ch(t) {
            let u = t;
            if (u < 0) {
                u += 1;
            }
            if (u > 1) {
                u -= 1;
            }
            if (u < 1 / 6) {
                return p + (q - p) * 6 * u;
            }
            if (u < 1 / 2) {
                return q;
            }
            if (u < 2 / 3) {
                return p + (q - p) * (2 / 3 - u) * 6;
            }
            return p;
        }
        return [ch(h + 1 / 3) * 255, ch(h) * 255, ch(h - 1 / 3) * 255];
    }
    // ── 걸음 목록 — 정렬을 실제로 돌려 얻은 비교·교환·쓰기 기록. 화면과 계수기는 이 목록에서만 나온다 ──
    const CMP = 0;
    const SWP = 1;
    const SET = 2;
    const MOV = 3;
    const FIX = 4;
    const LIFT = 5;
    const SHF = 6;
    const DROP = 7;
    const PIV = 8;
    const SPLIT = 9;
    const MRG = 10;
    const DRP = 11;
    const TAK = 12;
    const PASS = 13;
    const TICK = 14;
    const PHASE = 15;
    function mk(k, a, b, i = -1, j = -1, lo = -1, hi = -1, v = 0) {
        return { k: k, a: a, b: b, i: i, j: j, lo: lo, hi: hi, v: v };
    }
    function swapAt(a, i, j) { const t = a[i]; a[i] = a[j]; a[j] = t; }
    // 시간을 쓰지 않는 표식 걸음 — 비교도 이동도 아니다
    function isMeta(k) { return k === FIX || k === SPLIT || k === MRG || k === PASS || k === PHASE || k === PIV; }
    // 거품 — 이웃 둘을 비교해 앞이 크면 맞바꾼다. 한 바퀴마다 가장 큰 값이 끝에 놓인다
    function bubbleSteps(v0) {
        const a = v0.slice();
        const out = [];
        let end = a.length - 1;
        while (end > 0) {
            let swapped = false;
            for (let i = 0; i < end; i += 1) {
                out.push(mk(CMP, i, i + 1, -1, -1, 0, end));
                if (a[i] > a[i + 1]) {
                    swapAt(a, i, i + 1);
                    out.push(mk(SWP, i, i + 1, -1, -1, 0, end));
                    swapped = true;
                }
            }
            out.push(mk(FIX, end, 0));
            if (swapped) {
                end -= 1;
            }
            else {
                // 한 바퀴 동안 맞바꿈이 없으면 앞쪽도 이미 정렬된 것
                for (let k = end - 1; k >= 0; k -= 1) {
                    out.push(mk(FIX, k, 0));
                }
                end = 0;
            }
        }
        out.push(mk(FIX, 0, 0));
        return out;
    }
    // 삽입 — i 번째를 들어 올리고(LIFT), 왼쪽이 더 크면 한 칸씩 오른쪽으로 민 뒤(SHF) 빈 틈에 내린다(DROP)
    function insertionSteps(v0) {
        const a = v0.slice();
        const out = [];
        for (let i = 1; i < a.length; i += 1) {
            out.push(mk(LIFT, i, 0, -1, -1, 0, i));
            const key = a[i];
            let j = i;
            while (j > 0) {
                out.push(mk(CMP, j - 1, i, -1, -1, 0, i));
                if (a[j - 1] > key) {
                    a[j] = a[j - 1];
                    out.push(mk(SHF, j - 1, j, -1, -1, 0, i));
                    j -= 1;
                }
                else {
                    break;
                }
            }
            a[j] = key;
            out.push(mk(DROP, j, 0, -1, -1, 0, i));
        }
        return out;
    }
    // 병합 — 위에서 반씩 갈라 내려 보내고(SPLIT), 아래에서부터 두 줄의 앞을 비교해 작은 쪽을 위층에 쓴다(SET). i 필드가 층 번호
    function mergeSteps(v0) {
        const n = v0.length;
        const out = [];
        function deep(lo, hi, lv) {
            if (hi - lo < 2) {
                return lv;
            }
            const mid = (lo + hi) >> 1;
            return Math.max(deep(lo, mid, lv + 1), deep(mid, hi, lv + 1));
        }
        const depth = deep(0, n, 0);
        const lv = [];
        for (let l = 0; l <= depth; l += 1) {
            lv.push(v0.slice());
        }
        for (let l = 0; l < depth; l += 1) {
            out.push(mk(SPLIT, l, 0, l));
        }
        function sort(lo, hi, l) {
            if (hi - lo < 2) {
                return;
            }
            const mid = (lo + hi) >> 1;
            sort(lo, mid, l + 1);
            sort(mid, hi, l + 1);
            out.push(mk(MRG, lo, hi, l, -1, lo, hi));
            const src = lv[l + 1];
            const dst = lv[l];
            let ii = lo;
            let jj = mid;
            let p = lo;
            while (ii < mid && jj < hi) {
                out.push(mk(CMP, ii, jj, l, -1, lo, hi));
                if (src[ii] <= src[jj]) {
                    dst[p] = src[ii];
                    out.push(mk(SET, p, ii, l, -1, lo, hi, src[ii]));
                    ii += 1;
                }
                else {
                    dst[p] = src[jj];
                    out.push(mk(SET, p, jj, l, -1, lo, hi, src[jj]));
                    jj += 1;
                }
                p += 1;
            }
            while (ii < mid) {
                dst[p] = src[ii];
                out.push(mk(SET, p, ii, l, -1, lo, hi, src[ii]));
                ii += 1;
                p += 1;
            }
            while (jj < hi) {
                dst[p] = src[jj];
                out.push(mk(SET, p, jj, l, -1, lo, hi, src[jj]));
                jj += 1;
                p += 1;
            }
        }
        sort(0, n, 0);
        return out;
    }
    // 퀵 — 구간 맨 앞을 기준으로 세우고(PIV), 왼쪽 포인터는 큰 값을 찾고 오른쪽 포인터는 작은 값을 찾아 맞바꾼다. 만나면 기준을 내려놓는다
    function quickSteps(v0) {
        const a = v0.slice();
        const out = [];
        function qs(lo, hi) {
            if (lo > hi) {
                return;
            }
            if (lo === hi) {
                out.push(mk(FIX, lo, 0, -1, -1, lo, hi));
                return;
            }
            const p = a[lo];
            let i = lo + 1;
            let j = hi;
            out.push(mk(PIV, lo, 0, i, j, lo, hi));
            for (;;) {
                while (i <= j) {
                    out.push(mk(CMP, i, lo, i, j, lo, hi));
                    if (a[i] <= p) {
                        i += 1;
                    }
                    else {
                        break;
                    }
                }
                while (i <= j) {
                    out.push(mk(CMP, j, lo, i, j, lo, hi));
                    if (a[j] > p) {
                        j -= 1;
                    }
                    else {
                        break;
                    }
                }
                if (i < j) {
                    swapAt(a, i, j);
                    out.push(mk(SWP, i, j, i, j, lo, hi));
                    i += 1;
                    j -= 1;
                }
                else {
                    break;
                }
            }
            if (j > lo) {
                swapAt(a, lo, j);
                out.push(mk(SWP, lo, j, j, j, lo, hi));
            }
            out.push(mk(FIX, j, 0, -1, -1, lo, hi));
            qs(lo, j - 1);
            qs(j + 1, hi);
        }
        qs(0, a.length - 1);
        return out;
    }
    // 힙 — 배열을 이진 트리로 읽는다(자식은 2i+1·2i+2). 먼저 힙을 세우고, 최댓값을 맨 끝으로 빼내며 다시 내려 보낸다. hi 필드가 힙 크기
    function heapSteps(v0) {
        const a = v0.slice();
        const out = [];
        function sift(start, size) {
            let root = start;
            for (;;) {
                let child = 2 * root + 1;
                if (child >= size) {
                    break;
                }
                if (child + 1 < size) {
                    out.push(mk(CMP, child, child + 1, -1, -1, root, size));
                    if (a[child + 1] > a[child]) {
                        child += 1;
                    }
                }
                out.push(mk(CMP, root, child, -1, -1, root, size));
                if (a[root] < a[child]) {
                    swapAt(a, root, child);
                    out.push(mk(SWP, root, child, -1, -1, root, size));
                    root = child;
                }
                else {
                    break;
                }
            }
        }
        const n = a.length;
        for (let s = (n >> 1) - 1; s >= 0; s -= 1) {
            sift(s, n);
        }
        out.push(mk(PHASE, 1, 0));
        for (let end = n - 1; end > 0; end -= 1) {
            swapAt(a, 0, end);
            out.push(mk(SWP, 0, end, -1, -1, 0, end + 1));
            out.push(mk(FIX, end, 0));
            sift(0, end);
        }
        out.push(mk(FIX, 0, 0));
        return out;
    }
    // 선택 — 남은 구간에서 가장 작은 값을 찾아(CMP 로 훑는다) 맨 앞과 맞바꾼다. lo 필드가 구간 시작
    function selectionSteps(v0) {
        const a = v0.slice();
        const out = [];
        for (let i = 0; i < a.length - 1; i += 1) {
            let m = i;
            for (let j = i + 1; j < a.length; j += 1) {
                out.push(mk(CMP, j, m, -1, -1, i, a.length));
                if (a[j] < a[m]) {
                    m = j;
                }
            }
            if (m !== i) {
                swapAt(a, i, m);
                out.push(mk(SWP, i, m, -1, -1, i, a.length));
            }
            out.push(mk(FIX, i, 0));
        }
        out.push(mk(FIX, a.length - 1, 0));
        return out;
    }
    // 기수 — 자리 숫자(일·십·백)마다 통 열 개에 붓고(DRP) 0번 통부터 차례로 꺼낸다(TAK). 값끼리 비교하지 않는다
    function radixSteps(v0, digits) {
        let row = v0.slice();
        const out = [];
        let place = 1;
        for (let pass = 0; pass < digits; pass += 1) {
            out.push(mk(PASS, pass, 0, pass));
            const buckets = [];
            for (let d = 0; d < 10; d += 1) {
                buckets.push([]);
            }
            for (let s = 0; s < row.length; s += 1) {
                const d = Math.floor(row[s] / place) % 10;
                buckets[d].push(row[s]);
                out.push(mk(DRP, s, d, pass, -1, -1, -1, row[s]));
            }
            const next = [];
            for (let d = 0; d < 10; d += 1) {
                for (const x of buckets[d]) {
                    out.push(mk(TAK, next.length, d, pass, -1, -1, -1, x));
                    next.push(x);
                }
            }
            row = next;
            place *= 10;
        }
        return out;
    }
    // 혼합 — 짧은 구간(RUN 칸)은 삽입으로 정렬하고, 정렬된 구간 둘을 병합으로 합친다. 이동은 MOV(from → to) 한 걸음
    function hybridSteps(v0, run) {
        const a = v0.slice();
        const out = [];
        const n = a.length;
        function move(from, to, lo, hi) {
            const x = a.splice(from, 1)[0];
            a.splice(to, 0, x);
            out.push(mk(MOV, from, to, -1, -1, lo, hi));
        }
        for (let lo = 0; lo < n; lo += run) {
            const hi = Math.min(lo + run, n);
            for (let i = lo + 1; i < hi; i += 1) {
                let p = i;
                while (p > lo) {
                    out.push(mk(CMP, p - 1, i, -1, -1, lo, hi));
                    if (a[p - 1] > a[i]) {
                        p -= 1;
                    }
                    else {
                        break;
                    }
                }
                if (p < i) {
                    move(i, p, lo, hi);
                }
            }
        }
        for (let w = run; w < n; w *= 2) {
            for (let lo = 0; lo + w < n; lo += 2 * w) {
                let mid = lo + w;
                const hi = Math.min(lo + 2 * w, n);
                let i = lo;
                let j = mid;
                while (i < mid && j < hi) {
                    out.push(mk(CMP, i, j, -1, -1, lo, hi));
                    if (a[i] <= a[j]) {
                        i += 1;
                    }
                    else {
                        move(j, i, lo, hi);
                        i += 1;
                        mid += 1;
                        j += 1;
                    }
                }
            }
        }
        out.push(mk(FIX, 0, 0));
        return out;
    }
    // 걸음 목록에서 비교 횟수와 이동 횟수(교환·밀기·쓰기) 를 센다
    function countOf(steps) {
        let c = 0;
        let m = 0;
        for (const s of steps) {
            if (s.k === CMP) {
                c += 1;
            }
            else if (s.k === SWP || s.k === SET || s.k === MOV || s.k === SHF) {
                m += 1;
            }
        }
        return { c: c, m: m };
    }
    function applyLane(L, s) {
        if (s.k === SWP) {
            swapAt(L.a, s.a, s.b);
        }
        else if (s.k === SET) {
            L.a[s.a] = s.v;
        }
        else if (s.k === SHF) {
            L.a[s.b] = L.a[s.a];
        }
        else if (s.k === LIFT) {
            L.key = L.a[s.a];
        }
        else if (s.k === DROP) {
            L.a[s.a] = L.key;
        }
        else if (s.k === MOV) {
            const x = L.a.splice(s.a, 1)[0];
            L.a.splice(s.b, 0, x);
        }
    }
    function isSorted(a) {
        for (let i = 1; i < a.length; i += 1) {
            if (a[i - 1] > a[i]) {
                return false;
            }
        }
        return true;
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const stepEl = root.querySelector('[data-role="step"]');
    const doneEl = root.querySelector('[data-role="done"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !stepEl || !doneEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const stepBtn = stepEl;
    const doneP = doneEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function skyFill(top, bot) {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bot, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function seg(x1, y1, x2, y2, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 글자 이름표 — 바탕 알약 위에 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    // 장면 시계(초) — 장면 계산이 고치고 화면 쪽이 읽는다
    let sceneT = 0;
    function newSp(x) { return { x: x, v: 0 }; }
    // 목표로 당기는 힘 w²·(목표−x) 와 속도를 깎는 힘 2·z·w·v. 한 프레임을 네 토막으로 적분해 큰 dt 에서도 터지지 않는다
    function spr(s, target, dt, w, z) {
        const h = dt / 4;
        for (let k = 0; k < 4; k += 1) {
            s.v += (w * w * (target - s.x) - 2 * z * w * s.v) * h;
            s.x += s.v * h;
        }
    }
    // 정렬이 끝난 뒤 완성 장면을 보여 주는 시간(초). 지나면 다음 판이 처음부터 시작
    const HOLD_S = 1.6;
    // 걸음 재생기 — 걸음 목록 한 줄을 시간표대로 적용한다. 계수기는 적용한 걸음에서만 센다
    let steps = [];
    let at = 0;
    let acc = 0;
    let cmpN = 0;
    let movN = 0;
    let holdT = 0;
    let lap = 0;
    function countStep(s) {
        if (s.k === CMP) {
            cmpN += 1;
        }
        else if (s.k === SWP || s.k === SET || s.k === MOV || s.k === SHF) {
            movN += 1;
        }
    }
    function isDone() { return at >= steps.length; }
    // 지금 걸음의 진행(0~1) — 걸음이 끝나면 1
    function stepFrac() { return at < steps.length ? clamp(acc / stepDur(steps[at]), 0, 1) : 1; }
    function runOne() {
        const s = steps[at];
        countStep(s);
        applyOne(s);
        at += 1;
    }
    function runTo(n) {
        while (at < n && at < steps.length) {
            runOne();
        }
    }
    // 판 시작 — 첫 판(lap 0)은 START_FRAC 만큼 앞의 걸음을 미리 적용해 정렬 중간에서 보여 준다
    function begin() {
        sceneT = 0;
        at = 0;
        acc = 0;
        cmpN = 0;
        movN = 0;
        holdT = 0;
        build();
        if (lap === 0) {
            runTo(Math.floor(steps.length * START_FRAC));
        }
        snap();
    }
    function advance(dt) {
        sceneT += dt;
        if (at < steps.length) {
            acc += dt;
            while (at < steps.length && acc >= stepDur(steps[at])) {
                acc -= stepDur(steps[at]);
                runOne();
            }
        }
        else {
            holdT += dt;
            if (holdT >= HOLD_S) {
                lap += 1;
                begin();
            }
        }
        update(dt);
    }
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    // ── 02 한 장을 들어 올려 알맞은 틈에 끼우는 삽입 정렬 ───────────────────────────
    const BAR_COUNT = 14;
    // 비교 한 걸음의 길이(ms)
    const STEP_MS = 65;
    // 한 칸 미는 걸음과 들어 올리기·내려 꽂기 걸음의 길이(ms)
    const SHIFT_MS = 150;
    const LIFT_MS = 220;
    // 들어 올리는 높이(px)
    const LIFT_H = 46;
    const SEED = 4932;
    const START_FRAC = 0.5;
    // 밀리는 막대의 스프링 — 01 보다 낮은 고유 진동수와 약한 감쇠라 관성으로 조금 늦게 따라오고 넘쳤다 돌아오며 잦아든다
    const SHIFT_W = 19;
    const SHIFT_Z = 0.42;
    const BASE_Y = 270;
    const TOP_PAD = 98;
    let vals = [];
    // 슬롯 p 에 놓인 막대 번호 — 들어 올린 막대의 빈자리는 −1
    let row = [];
    let sx = [];
    let ly = [];
    let liftId = -1;
    let holeAt = -1;
    let runHi = 0;
    let cmpPos = -1;
    function barW() { return (W - 32) / BAR_COUNT; }
    function slotX(p) { return 16 + p * barW(); }
    function barH(v) { return 14 + (v / BAR_COUNT) * (BASE_Y - TOP_PAD - 14); }
    function build() {
        vals = shuffled(BAR_COUNT, SEED + lap * 7);
        row = [];
        sx = [];
        ly = [];
        for (let i = 0; i < BAR_COUNT; i += 1) {
            row.push(i);
            sx.push(newSp(slotX(i)));
            ly.push(newSp(0));
        }
        steps = insertionSteps(vals);
        liftId = -1;
        holeAt = -1;
        runHi = 0;
        cmpPos = -1;
    }
    function stepDur(s) {
        if (s.k === SHF) {
            return SHIFT_MS / 1000;
        }
        if (s.k === LIFT || s.k === DROP) {
            return LIFT_MS / 1000;
        }
        return STEP_MS / 1000;
    }
    function applyOne(s) {
        if (s.k === LIFT) {
            liftId = row[s.a];
            row[s.a] = -1;
            holeAt = s.a;
            runHi = s.hi;
            cmpPos = -1;
        }
        else if (s.k === CMP) {
            cmpPos = s.a;
        }
        else if (s.k === SHF) {
            row[s.b] = row[s.a];
            row[s.a] = -1;
            holeAt = s.a;
            cmpPos = -1;
        }
        else if (s.k === DROP) {
            row[s.a] = liftId;
            liftId = -1;
            holeAt = -1;
            cmpPos = -1;
        }
    }
    function snap() {
        for (let p = 0; p < BAR_COUNT; p += 1) {
            if (row[p] >= 0) {
                sx[row[p]].x = slotX(p);
                sx[row[p]].v = 0;
            }
        }
        for (let id = 0; id < BAR_COUNT; id += 1) {
            ly[id].x = id === liftId ? -LIFT_H : 0;
            ly[id].v = 0;
        }
        if (liftId >= 0) {
            sx[liftId].x = slotX(holeAt);
            sx[liftId].v = 0;
        }
    }
    function update(dt) {
        for (let p = 0; p < BAR_COUNT; p += 1) {
            if (row[p] >= 0) {
                spr(sx[row[p]], slotX(p), dt, SHIFT_W, SHIFT_Z);
            }
        }
        for (let id = 0; id < BAR_COUNT; id += 1) {
            if (id === liftId) {
                spr(sx[id], slotX(holeAt), dt, 34, 0.7);
            }
            spr(ly[id], id === liftId ? -LIFT_H : 0, dt, 30, 0.6);
        }
    }
    function draw() {
        skyFill(BG_TOP, BG_BOT);
        box(10, BASE_Y + 3, W - 20, 5, 2.5, LAV, 0.5);
        const w = barW() - 4;
        // 정렬된 구간 아래에 옅은 띠
        box(slotX(0) - 2, BASE_Y + 9, (runHi + 1) * barW(), 4, 2, MINT, 0.9);
        for (let pass = 0; pass < 2; pass += 1) {
            for (let id = 0; id < BAR_COUNT; id += 1) {
                // 들어 올린 막대는 두 번째 바퀴에 그려 위에 놓는다
                if ((id === liftId ? 1 : 0) !== pass) {
                    continue;
                }
                let p = row.indexOf(id);
                if (p < 0) {
                    p = holeAt;
                }
                const h = barH(vals[id]);
                let c = barColor(vals[id], BAR_COUNT);
                if (p <= runHi && id !== liftId) {
                    c = mix(c, MINT, 0.8);
                }
                if (id === liftId) {
                    c = mix(c, BUTTER, 0.55);
                }
                if (p === cmpPos && id !== liftId) {
                    c = mix(c, BUTTER, 0.75);
                }
                const x = sx[id].x + 2;
                const y = BASE_Y - h + ly[id].x;
                if (id === liftId) {
                    box(x + 3, BASE_Y - 2, w - 6, 4, 2, INK, 0.12);
                }
                box(x, y, w, h, 4, c, 1);
                if (id === liftId || p === cmpPos) {
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = rgba(INK, 0.85);
                    ctx.beginPath();
                    ctx.roundRect(x, y, w, h, 4);
                    ctx.stroke();
                }
                text(String(vals[id]), x + w / 2, y + 11, INK, 0.8, 10, 700, 'center');
            }
        }
    }
    function statusText() {
        if (isDone()) {
            return '정렬 완료 — 비교 {c}회 · 밀어낸 막대 {s}개'.replace('{c}', String(cmpN)).replace('{s}', String(movN));
        }
        return '비교 {c}회 · 밀어낸 막대 {s}개'.replace('{c}', String(cmpN)).replace('{s}', String(movN));
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 한 판이 끝났음을 스크린리더에 한 번만 알린다 — 판이 되풀이돼도 다시 읽지 않는다
    let doneSaid = false;
    function checkDone() {
        if (isDone() && !doneSaid) {
            doneSaid = true;
            doneP.textContent = statusText();
        }
    }
    // 한 프레임에 넘기는 시간 상한(초) — 오래 숨었다 돌아온 첫 프레임도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    // 한 걸음 버튼 뒤 스프링이 자리 잡도록 미리 흘려보내는 시간
    const SETTLE_FRAMES = 14;
    const SETTLE_DT = 0.04;
    function showNow() {
        draw();
        pushStatus(statusText());
        checkDone();
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        showNow();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 정렬이 끝난 막대 한 장
    function showRest() {
        stopLoop();
        lap = 0;
        begin();
        runTo(steps.length);
        snap();
        showNow();
    }
    function play() {
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    // 한 걸음 — 멈춘 채 걸음 목록을 하나만 적용한다. 끝난 판이면 다음 판을 처음부터 연다
    function stepOnce() {
        wake();
        if (!paused) {
            paused = true;
            pauseBtn.setAttribute('aria-pressed', 'true');
            stopLoop();
        }
        if (isDone()) {
            doneSaid = false;
            lap += 1;
            begin();
        }
        else {
            runOne();
            acc = 0;
        }
        for (let k = 0; k < SETTLE_FRAMES; k += 1) {
            update(SETTLE_DT);
        }
        showNow();
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    stepBtn.addEventListener('click', stepOnce, { signal: off.signal });
    // 키보드 — 무대에 포커스가 있을 때만. Enter·Space 는 일시정지, 오른쪽 방향키는 한 걸음
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            togglePause();
        }
        else if (e.key === 'ArrowRight') {
            e.preventDefault();
            stepOnce();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 정렬 끝난 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            lap = 0;
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw();
    }, { signal: off.signal });
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
