</div>

    // ── 코드 블록 엔진 — 이 편의 주역 계산을 9종이 공유한다

    //   9줄에서 99줄로 넘어가도 코드 시작 열이 한 픽셀 안 움직이려면 폭을 '최대 자릿수'로 미리 고정한다

        return 2000;
    }
    // 실제 클릭 경로 — 사람이 눌러도 같은 상태 기계를 탄다
    sceneEl.addEventListener('pointerdown', function () { armed04 = true; });
    function btn04Safe() {
        // 버튼은 build() 에서 새로 만들어지므로 위임으로 한 번만 건다
        sceneEl.addEventListener('click', function (ev) {
            const t = ev.target;
            if (!btn04 || !t.closest || !t.closest('.copybtn')) {
                return;
            }
            if (!armed04) {
                return;
            }
            armed04 = false;
            if (!svg04 || !live04) {
                return;
            }
            svg04.setAttribute('d', ICON_CHECK);
            if (btn04) {
                btn04.classList.add('is-done');
            }
            live04.style.opacity = '1';
            live04.textContent = 'The code was copied to the clipboard';
            window.setTimeout(function () {
                if (svg04) {
                    svg04.setAttribute('d', ICON_COPY);
                }
                if (btn04) {
                    btn04.classList.remove('is-done');
                }
                if (live04) {
                    live04.style.opacity = '0';
                }
            }, DONE_MS);
        });
    }
    let armed04 = false;
    btn04Safe();
    return run({ count: 2, build: build, frame: frame });
}
})();
</script>
</body>
</html>
