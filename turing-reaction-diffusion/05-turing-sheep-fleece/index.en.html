<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>양 털 질감 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tsf" id="tsf">
  <p class="tsf__hint">
    <svg class="tsf__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M124.9 32a52 52 0 0 0-49.55 36.11A40 40 0 0 0 24 107.33c0 25 21.75 44.67 46.75 44.67h119c23.5 0 42.25-17.75 42.25-40a40 40 0 0 0-36.71-39.81A52 52 0 0 0 124.9 32" opacity=".2"/><path d="M168 16a56 56 0 0 0-53.16 38.47A44 44 0 0 0 64 97.34c0 .83 0 1.66.08 2.49A36 36 0 0 0 68 172h100a52 52 0 0 0 0-104Zm0 88a36 36 0 0 1 0 72H68a20 20 0 0 1-6.7-38.92l10.83-3.73-2.51-11.22A28 28 0 0 1 97.34 72h4.22l3.76-2.6A36 36 0 0 1 168 72a36 36 0 0 1 0 72Z"/></g></svg>
    <span>Fourteen colliding tufts keep blending as slow injectors sweep across them</span>
  </p>
  <div class="tsf__field" id="field">
    <canvas class="tsf__cv" id="cv"></canvas>
  </div>
  <div class="tsf__bar">
    <label class="tsf__dial">Seed
      <input type="number" id="seed" min="1" max="9999" step="1" value="7" aria-label="Pattern seed">
    </label>
    <label class="tsf__dial tsf__grow">Feed rate F
      <input type="range" id="fk" min="0.010" max="0.070" step="0.001" value="0.046" aria-label="Feed rate F">
    </label>
  </div>
</div>
</main>
<script>
// 양 털 — Gray-Scott 반응-확산. U(사료)·V(촉매) 두 격자를 64x40 셀에 두고
// 매 프레임 16스텝씩 확산 + 반응항을 계산해 ImageData 로 화소를 박는다.
// 시드는 화면 곳곳의 점 14개 — 각자 자란 덩어리가 서로 부딪혀 경계를 이뤄
// 양 털·구름 뭉치 같은 질감이 된다.
// 다만 완전 성숙한 뭉치는 수학적 정지 상태라 변화가 사라진다 — 그래서 성숙 뒤에도
// 위상이 다른 주입원 6개가 리사주 곤적으로 화면을 천천히 순회하며 U 를 부어
// 뭉치가 계속 부딪히며 섞이게 한다 (07 파생). 주제는 '씨앗 여러 개가 섞인다'.
// 라플라스는 간선 0.2·대각 0.05 가중(9점) — 5점 대비 이방성 노이즈가 적어
// 성장 무늬가 부드럽다. DU=1.0 DV=0.5 dt=1.0 (브리프 규격).
// 렌더: 셀 V 값을 파스텔 LUT 로 색을 정해 저해상 버퍼에 putImageData, 그 버퍼를
// drawImage 로 확대한다(imageSmoothingEnabled — 부드럽게).
var root = document.getElementById('tsf');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var seedIn = document.getElementById('seed');
var fkIn = document.getElementById('fk');

// 결정적 난수 — mulberry32. 같은 시드면 같은 수열을 돌려준다
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var GW = 64, GH = 40;            // 격자 셀 수 (480x300 비율)
var DU = 1.0, DV = 0.5;          // 확산 계수 (고정)
var F = 0.046, K = 0.062;        // 사료율·제거율 (fk 슬라이더가 F 를 움직인다)
var STEPS = 16;                  // 프레임당 시뮬레이션 스텝
var PRE = 240;                   // 시작 시 미리 성숙시키는 스텝 — 뭉치가 막 자라기 시작한 시점
var t = 0;                       // 주입 위상 — 주입원이 이 시간을 따라 화면을 천천히 순회한다
var SRC_N = 6;                   // 주입원 개수 — 각자 위상이 달라 뭉치를 여러 방향에서 흔든다
var SRC_RAD = 4;                 // 주입 반경(셀)
var SRC_BOOST = 0.45;            // 주입량 — 성숙한 뭉치를 밀어 섞임이 계속 되게 하는 힘
var SRC_DT = 0.003;              // 주입원 순회 속도 — 양털은 천천히 (07 물결보다 느리게)
var u = new Float32Array(GW * GH);
var v = new Float32Array(GW * GH);
var u2 = new Float32Array(GW * GH);
var v2 = new Float32Array(GW * GH);

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1;
var raf = 0;

// ── 색 — scss 가 내려준 파스텔 사용자속성을 읽어 5단계 LUT 를 미리 편다 ──
var css = getComputedStyle(root);
var LUT = new Uint8Array(256 * 3);
function tok(name) { return css.getPropertyValue(name); }
function col2rgb(s) {
  // sass 가 rgb(...) 함수꼴로 내려보내는 값과 hex 를 둘 다 받는다
  s = String(s).trim();
  var m = s.match(/^rgba?\(([^)]+)\)$/);
  if (m) {
    var parts = m[1].split(',');
    var out = [];
    for (var i = 0; i < 3; i++) {
      var p = parseFloat(parts[i]);
      out.push(parts[i].indexOf('%') >= 0 ? Math.round(p * 2.55) : Math.round(p));
    }
    return out;
  }
  s = s.replace('#', '');
  if (s.length === 3) s = s.charAt(0) + s.charAt(0) + s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2);
  return [parseInt(s.slice(0, 2), 16) || 0, parseInt(s.slice(2, 4), 16) || 0, parseInt(s.slice(4, 6), 16) || 0];
}
function buildLut() {
  var stops = [col2rgb(tok('--tsf-c0')), col2rgb(tok('--tsf-c1')), col2rgb(tok('--tsf-c2')), col2rgb(tok('--tsf-c3')), col2rgb(tok('--tsf-c4'))];
  for (var q = 0; q < 256; q++) {
    var t = q / 255 * (stops.length - 1);
    var k = Math.min(stops.length - 2, Math.floor(t));
    var f = t - k;
    for (var c = 0; c < 3; c++) LUT[q * 3 + c] = stops[k][c] + (stops[k + 1][c] - stops[k][c]) * f;
  }
}

// ── Seed — 화면 곳곳에 점 14개를 넓게. 시드가 좌표를 결정 ──
function seedField(sd) {
  var rng = mulberry32(sd >>> 0);
  u.fill(1); v.fill(0);
  for (var n = 0; n < 14; n++) {
    var cx = 5 + rng() * (GW - 10), cy = 4 + rng() * (GH - 8);
    var rr = 2 + rng() * 1.6;
    var y0 = Math.max(0, Math.floor(cy - rr)), y1 = Math.min(GH - 1, Math.ceil(cy + rr));
    var x0 = Math.max(0, Math.floor(cx - rr)), x1 = Math.min(GW - 1, Math.ceil(cx + rr));
    for (var y = y0; y <= y1; y++) {
      for (var x = x0; x <= x1; x++) {
        var dx = x - cx, dy = y - cy;
        if (dx * dx + dy * dy < rr * rr) { v[y * GW + x] = 0.5; u[y * GW + x] = 0.25; }
      }
    }
  }
}

// ── 한 스텝 — 9점 가중 라플라스(토러스 경계) + Gray-Scott 반응항 ──
function step() {
  for (var y = 0; y < GH; y++) {
    var yT = ((y - 1 + GH) % GH) * GW, yB = ((y + 1) % GH) * GW, yC = y * GW;
    for (var x = 0; x < GW; x++) {
      var xL = (x - 1 + GW) % GW, xR = (x + 1) % GW;
      var i = yC + x;
      var uc = u[i], vc = v[i];
      var lapU = 0.2 * (u[yC + xL] + u[yC + xR] + u[yT + x] + u[yB + x])
               + 0.05 * (u[yT + xL] + u[yT + xR] + u[yB + xL] + u[yB + xR]) - uc;
      var lapV = 0.2 * (v[yC + xL] + v[yC + xR] + v[yT + x] + v[yB + x])
               + 0.05 * (v[yT + xL] + v[yT + xR] + v[yB + xL] + v[yB + xR]) - vc;
      var uvv = uc * vc * vc;
      u2[i] = uc + DU * lapU - uvv + F * (1 - uc);
      v2[i] = vc + DV * lapV + uvv - (F + K) * vc;
      // 포화 클램프 — 주입(v=1) 이웃에서 9점 라플라스가 오버슈트해 음수 U 를 만들면
      // uvv 가 음수가 되며 발산한다(실측: 주입 약 100스텝 만에 NaN). 07 과 같이 [0,1] 로 자른다
      var cu = u2[i], cv2 = v2[i];
      u2[i] = cu < 0 ? 0 : (cu > 1 ? 1 : cu);
      v2[i] = cv2 < 0 ? 0 : (cv2 > 1 ? 1 : cv2);
    }
  }
  var tu = u; u = u2; u2 = tu;
  var tv = v; v = v2; v2 = tv;
}

var buf = null, small = null, sctx = null;
function setupBuffers() {
  small = document.createElement('canvas');
  small.width = GW; small.height = GH;
  sctx = small.getContext('2d');
  buf = sctx.createImageData(GW, GH);
}

// 미세 U 주입 — 위상이 제각각인 주입원 6개가 리사주 궤적으로 화면을 천천히 순회하며
// 성숙한 뭉치를 계속 밀어 섞인다. 주입원끼리 위상이 다르면 밀림 방향도 제각각 —
// 뭉치 전체가 계속 부딪히며 움직이게 보인다 (07 다중 주입원 방식)
function graze() {
  for (var j = 0; j < SRC_N; j++) {
    var ph = 1.7 + j * 2.4;
    var cx = (GW / 2 + Math.cos(t * ph) * GW * 0.38) | 0;
    var cy = (GH / 2 + Math.sin(t * (0.9 + j * 0.8)) * GH * 0.38) | 0;
    for (var dy = -SRC_RAD; dy <= SRC_RAD; dy++) {
      for (var dx = -SRC_RAD; dx <= SRC_RAD; dx++) {
        if (dx * dx + dy * dy > SRC_RAD * SRC_RAD) continue;
        var i = ((cy + dy + GH) % GH) * GW + ((cx + dx + GW) % GW);
        u[i] = 1;
        var nv = v[i] + SRC_BOOST;
        v[i] = nv > 1 ? 1 : nv;
      }
    }
  }
}

function paint() {
  var px = buf.data, i4 = 0;
  for (var p = 0; p < GW * GH; p++) {
    // V 농도 0(종이) → 1(잉크끼 파스텔) — LUT 로 색 단계
    var q = Math.max(0, Math.min(255, (v[p] * 460) | 0));
    px[i4] = LUT[q * 3];
    px[i4 + 1] = LUT[q * 3 + 1];
    px[i4 + 2] = LUT[q * 3 + 2];
    px[i4 + 3] = 255;
    i4 += 4;
  }
  sctx.putImageData(buf, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, 0, 0, GW, GH, 0, 0, W, H);
}

function frame() {
  for (var s = 0; s < STEPS; s++) { graze(); step(); }
  t += SRC_DT;
  paint();
  raf = requestAnimationFrame(frame);
}

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// Seed 재생성 → 미리성숙(PRE 스텝 동기) → 즉시 다시 그리기 (reduce 경로에서도)
function regrow(sd) {
  seedField(sd);
  for (var s = 0; s < PRE; s++) step();
  t = 0;
  paint();
}

function onSeed() {
  var val = Math.max(1, Math.min(9999, Math.floor(Number(seedIn.value)) || 1));
  regrow(val);
}
function onFk() {
  F = Number(fkIn.value);
  // reduce 경로에서도 프레임이 변해야 한다 — Seed 유지 상태로 새 F 로 다시 성숙시켜 그린다
  if (reduce) regrow(Math.max(1, Math.min(9999, Math.floor(Number(seedIn.value)) || 1)));
}

seedIn.addEventListener('input', onSeed);
seedIn.addEventListener('change', onSeed);
fkIn.addEventListener('input', onFk);
fkIn.addEventListener('change', onFk);
window.addEventListener('resize', function () { fit(); paint(); });

buildLut();
setupBuffers();
fit();
regrow(Number(seedIn.value) || 7);
if (reduce) {
  // reduce — 루프를 돌지 않고 성숙 상태 한 장만 그린다
  root.classList.add('is-still');
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
