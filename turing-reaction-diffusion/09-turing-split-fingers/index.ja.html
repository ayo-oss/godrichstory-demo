<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>갈라지는 성장 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tsf" id="tsf">
  <p class="tsf__hint">
    <svg class="tsf__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88" opacity=".25"/><path d="M136 40h-16v40a16 16 0 0 1-16 16H88a16 16 0 0 0-16 16v8a16 16 0 0 0 16 16h16a16 16 0 0 1 16 16v48h16v-48a16 16 0 0 1 16-16h16a16 16 0 0 0 16-16v-8a16 16 0 0 0-16-16h-16a16 16 0 0 1-16-16Zm-32 96h-16a32 32 0 0 1-32-32v-8a32 32 0 0 1 32-32h16V40a16 16 0 0 1 16-16h32a16 16 0 0 1 16 16v24h16a32 32 0 0 1 32 32v8a32 32 0 0 1-32 32h-16v80h-16v-40a16 16 0 0 0-16-16h-16a16 16 0 0 0-16 16v40H88v-32Z"/></g></svg>
    <span>とても低い供給率では、伸びる先端が抵抗に会うたび2つに分かれます</span>
  </p>
  <div class="tsf__field" id="field">
    <canvas class="tsf__cv" id="cv"></canvas>
  </div>
  <div class="tsf__bar">
    <label class="tsf__dial">シード
      <input type="number" id="seed" min="1" max="9999" step="1" value="7" aria-label="パターンシード">
    </label>
    <label class="tsf__dial">供給率 f
      <input type="range" id="fk" min="0.010" max="0.070" step="0.001" value="0.014" aria-label="供給率 f">
    </label>
  </div>
</div>
</main>
<script>
// 갈라지는 성장 — Gray-Scott 을 供給率 f 아주 낮은 구간에서 돌리면 성장 끝(팁)이
// 저항에 닿을 때마다 두 갈래로 갈라진다. 하단 가로 줄 시드에서 위로 뻗게 하고,
// 시작을 절반쯤 성숙시킨 상태로 띄워 화면이 채워지는 과정이 보이게 한다.
// 라이브러리 0 — 두 물질 U(사료)·V(촉매)의 라플라스 확산 + 반응항만으로 계산한다.
var root = document.getElementById('tsf');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var seedIn = document.getElementById('seed');
var fkIn = document.getElementById('fk');

// 결정적 난수 — mulberry32. 같은 시드면 같은 수열을 돌려준다
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var GW = 96, GH = 60;              // 반응 격자 해상도 — 화면이 커져도 이 값은 그대로다
var DU = 1.0, DV = 0.5;            // 확산 계수(고정)
var F = 0.014, K = 0.052;          // 사료율·제거율 — fk 슬라이더가 F 를 움직인다
var STEPS = 12;                    // 한 프레임에 도는 시뮬레이션 스텝 수
var RIP_STEPS = 400;               // 미리성숙 스텝 — 성장이 왕성한 구간에 진입한 상태로 시작
var TIP_N = 12;                    // 팁 자극 주입원 — 성장 끝이 죽지 않고 계속 뻗게 한다
var TIP_RAD = 5;                   // 팁 주입 반경(셀)
var TIP_BOOST = 0.50;              // 팁 주입량

var U = new Float32Array(GW * GH);
var V = new Float32Array(GW * GH);
var U2 = new Float32Array(GW * GH);
var V2 = new Float32Array(GW * GH);
var t = 0;                         // 자극 위상

// 밑그림 종이 → 복숭아 잉크끼 파스텔 5단계 LUT — V 농도를 색 단계로 편다
var css = getComputedStyle(root);
function tok(name) { return css.getPropertyValue(name).trim().replace('#', ''); }
function rgbOf(hex) {
  var h = hex.length === 3 ? hex.charAt(0) + hex.charAt(0) + hex.charAt(1) + hex.charAt(1) + hex.charAt(2) + hex.charAt(2) : hex;
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
var STOPS = [rgbOf(tok('--p0')), rgbOf(tok('--p1')), rgbOf(tok('--p2')), rgbOf(tok('--p3')), rgbOf(tok('--p4'))];
var LUT = new Uint8Array(256 * 3);
(function () {
  for (var q = 0; q < 256; q++) {
    var s = q / 255 * (STOPS.length - 1);
    var k = Math.min(STOPS.length - 2, Math.floor(s));
    var f = s - k;
    for (var c = 0; c < 3; c++) LUT[q * 3 + c] = Math.round(STOPS[k][c] + (STOPS[k + 1][c] - STOPS[k][c]) * f);
  }
})();

var small = document.createElement('canvas');
small.width = GW; small.height = GH;
var sctx = small.getContext('2d');
var img = sctx.createImageData(GW, GH);

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1;
var raf = 0;

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ── Gray-Scott 한 스텝 — 5점 라플라스 + 반응항. 경계는 토러스(wrap)다 ──────────────
function step() {
  for (var y = 0; y < GH; y++) {
    var ym = ((y - 1 + GH) % GH) * GW, y0 = y * GW, yp = ((y + 1) % GH) * GW;
    for (var x = 0; x < GW; x++) {
      var xl = (x - 1 + GW) % GW, xr = (x + 1) % GW;
      var i = y0 + x;
      var u = U[i], v = V[i];
      var lapU = U[y0 + xl] + U[y0 + xr] + U[ym + x] + U[yp + x] - 4 * u;
      var lapV = V[y0 + xl] + V[y0 + xr] + V[ym + x] + V[yp + x] - 4 * v;
      var uvv = u * v * v;
      var nu = u + DU * lapU - uvv + F * (1 - u);
      var nv = v + DV * lapV + uvv - (F + K) * v;
      U2[i] = nu < 0 ? 0 : (nu > 1 ? 1 : nu);
      V2[i] = nv < 0 ? 0 : (nv > 1 ? 1 : nv);
    }
  }
  var tu = U; U = U2; U2 = tu;
  var tv = V; V = V2; V2 = tv;
}

// 팁 자극 — 위상이 다른 주입원 여럿이 화면을 돌며 성장 끝에 U 를 보탠다.
// 산호(04)와 달리 팁이 죽지 않게 하는 역할 — 갈라짐이 계속 일어난다
function feed() {
  for (var j = 0; j < TIP_N; j++) {
    var ph = 1.9 + j * 2.1;
    var cx = (GW / 2 + Math.cos(t * ph) * GW * 0.38) | 0;
    var cy = (GH / 2 + Math.sin(t * (1.1 + j * 0.7)) * GH * 0.36) | 0;
    for (var dy = -TIP_RAD; dy <= TIP_RAD; dy++) {
      for (var dx = -TIP_RAD; dx <= TIP_RAD; dx++) {
        if (dx * dx + dy * dy > TIP_RAD * TIP_RAD) continue;
        var i = ((cy + dy + GH) % GH) * GW + ((cx + dx + GW) % GW);
        U[i] = 1;
        var nv = V[i] + TIP_BOOST;
        V[i] = nv > 1 ? 1 : nv;
      }
    }
  }
}

// シード 재생성 — 하단 가로 줄(틈새 있는 마디 줄)에 V 를 심는다. 위로 뻗는 성장의 씨앗
function build(seed) {
  var rng = mulberry32(seed >>> 0);
  for (var i = 0; i < GW * GH; i++) { U[i] = 1; V[i] = 0; }
  var y0 = GH - 6;
  for (var x = 2; x < GW - 2; x++) {
    // 마디 줄 — 이어진 부분과 끊긴 부분이 섞여 갈라짐의 시작점이 시드마다 달라진다
    var gap = rng() < 0.30;
    if (gap) continue;
    V[y0 * GW + x] = 1;
    if (rng() < 0.6) V[(y0 + 1) * GW + x] = 1;
    if (rng() < 0.3) V[(y0 - 1) * GW + x] = 1;
  }
  for (var m = 0; m < RIP_STEPS; m++) step();
  t = 0;
}

// 렌더 — 격자 V 를 ImageData 화소에 LUT 로 매핑해 putImageData 로 버퍼에 그리고 drawImage 로 확대한다
function paint() {
  var px = img.data, i = 0;
  for (var c = 0; c < GW * GH; c++) {
    var q = (V[c] * 255) | 0;
    px[i] = LUT[q * 3]; px[i + 1] = LUT[q * 3 + 1]; px[i + 2] = LUT[q * 3 + 2]; px[i + 3] = 255;
    i += 4;
  }
  sctx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, 0, 0, GW, GH, 0, 0, W, H);
}

function frame() {
  for (var s = 0; s < STEPS; s++) { feed(); step(); }
  t += 0.006;
  paint();
  raf = requestAnimationFrame(frame);
}

function onSeed() {
  var v = Math.max(1, Math.min(9999, Math.floor(Number(seedIn.value)) || 1));
  build(v);
  if (reduce) paint();
}

function onFk() {
  F = Number(fkIn.value);
  if (reduce) { build(Number(seedIn.value) || 7); paint(); }
}

seedIn.addEventListener('input', onSeed);
seedIn.addEventListener('change', onSeed);
fkIn.addEventListener('input', onFk);
fkIn.addEventListener('change', onFk);
window.addEventListener('resize', function () { fit(); if (reduce) paint(); });

build(Number(seedIn.value) || 7);
fit();
if (reduce) {
  // reduce — 루프를 시작하지 않고 절반 성숙 상태 한 장만 그린다(빈 화면이 아니다)
  root.classList.add('is-still');
  paint();
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
