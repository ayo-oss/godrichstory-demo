<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Bands Whose Undersides Redden First as the Sun Drops — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sc is-demo" id="scRoot">
  <canvas class="sc__canvas" id="scCanvas" width="480" height="300" tabindex="0" aria-label="Cloud Bands Whose Undersides Redden First as the Sun Drops"></canvas>
  <p class="sc__status" id="scStatus" aria-live="polite">The sun is leaning — a golden afternoon</p>
  <button class="sc__btn" id="scBtn" type="button">Pause</button>
</div>
</main>
<script>
(function () {
    const W = 480;
    const H = 300;
    const PI2 = Math.PI * 2;
    const HORIZON = 186;
    const SUN_RISE = 150;
    const SUN_X = 312;
    const SUN_ALT = 0.5;
    const ALT_NIGHT = -0.15;
    const PERIOD_MS = 4400;
    const KEY_ALT = 0.05;
    const SKY_BLEND = 1.7;
    // 해 높이(0 = 지평선, 1 = 높이 뜸) 순서대로 고른 색 띠 — 정점 쪽, 지평선 쪽, 해 원반
    const ZENITH_RAMP = [[-0.15, [40, 44, 96]], [0, [92, 92, 156]], [0.12, [128, 126, 182]], [0.3, [150, 160, 214]], [0.6, [150, 192, 238]], [1, [138, 190, 242]]];
    const HORIZON_RAMP = [[-0.15, [110, 104, 160]], [0, [238, 134, 142]], [0.12, [255, 168, 146]], [0.3, [255, 208, 166]], [0.6, [240, 226, 222]], [1, [206, 230, 248]]];
    const SUN_RAMP = [[-0.15, [238, 128, 134]], [0, [255, 150, 126]], [0.15, [255, 190, 140]], [0.4, [255, 226, 176]], [1, [255, 246, 222]]];
    const TXT_HIGH = 'The sun is high — a daytime sky';
    const TXT_GOLD = 'The sun is leaning — a golden afternoon';
    const TXT_GLOW = 'The sun is low — sunset glow';
    const TXT_TOUCH = 'The sun touches the horizon — a red band';
    const TXT_DUSK = 'The sun has set — twilight';
    function labelOf(alt) {
        if (alt > 0.6) {
            return TXT_HIGH;
        }
        if (alt > 0.3) {
            return TXT_GOLD;
        }
        if (alt > 0.08) {
            return TXT_GLOW;
        }
        if (alt > -0.06) {
            return TXT_TOUCH;
        }
        return TXT_DUSK;
    }
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function css(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a.toFixed(3) + ')';
    }
    function luma(c) { return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255; }
    // 시드 고정 난수 — 같은 시드면 언제나 같은 수열
    function mulberry32(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6D2B79F5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function hash2(ix, iy) {
        let h = Math.imul(ix | 0, 374761393) + Math.imul(iy | 0, 668265263);
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    function vnoise(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        const fx = smooth(x - ix);
        const fy = smooth(y - iy);
        return lerp(lerp(hash2(ix, iy), hash2(ix + 1, iy), fx), lerp(hash2(ix, iy + 1), hash2(ix + 1, iy + 1), fx), fy);
    }
    function fbm(x, y) {
        return vnoise(x, y) * 0.55 + vnoise(x * 2.1 + 7.3, y * 2.1 + 3.1) * 0.3 + vnoise(x * 4.3 + 1.7, y * 4.3 + 9.4) * 0.15;
    }
    function ramp(stops, a) {
        if (a <= stops[0][0]) {
            return stops[0][1];
        }
        for (let i = 1; i < stops.length; i += 1) {
            if (a <= stops[i][0]) {
                const p = stops[i - 1];
                const q = stops[i];
                return mix(p[1], q[1], (a - p[0]) / (q[0] - p[0]));
            }
        }
        return stops[stops.length - 1][1];
    }
    // 하늘 한 점의 색 — v 는 0(정점)에서 1(지평선)
    function skyAt(alt, v) {
        return mix(ramp(ZENITH_RAMP, alt), ramp(HORIZON_RAMP, alt), Math.pow(clamp(v, 0, 1), SKY_BLEND));
    }
    function sunY(alt) { return HORIZON - alt * SUN_RISE; }
    function seaDeep(alt) { return mix([84, 128, 170], [36, 48, 98], clamp((0.3 - alt) / 0.4, 0, 1)); }
    function glow(ctx, x, y, r, c, a) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, css(c, a));
        g.addColorStop(1, css(c, 0));
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    function skyRows(ctx, alt, y0, y1, step) {
        for (let y = y0; y < y1; y += step) {
            ctx.fillStyle = css(skyAt(alt, (y - y0) / (y1 - y0)), 1);
            ctx.fillRect(0, y, W, step + 1);
        }
    }
    // 바다 바탕 — 지평선 하늘색을 받아 아래로 갈수록 깊어지고, 줄마다 잔물결 밝기가 흔들린다
    function seaBase(ctx, alt, t) {
        const top = mix(skyAt(alt, 1), seaDeep(alt), 0.35);
        const deep = seaDeep(alt);
        for (let y = HORIZON; y < H; y += 3) {
            const k = (y - HORIZON) / (H - HORIZON);
            const c = mix(top, deep, Math.pow(k, 0.7));
            const r = 1 + 0.05 * Math.sin(y * 0.8 + t * 0.0018 + k * 6);
            ctx.fillStyle = css([c[0] * r, c[1] * r, c[2] * r], 1);
            ctx.fillRect(0, y, W, 4);
        }
    }
    function sunDisc(ctx, x, y, rx, ry, c, halo) {
        glow(ctx, x, y, halo, c, 0.5);
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0, 0, PI2);
        ctx.fillStyle = css(c, 1);
        ctx.fill();
    }
    // 오른쪽 가장자리의 해 높이 눈금 — 입력이 얼마인지 눈에 보이게
    function gauge(ctx, alt, lo, hi) {
        const y0 = 46;
        const y1 = 236;
        const gy = lerp(y1, y0, (alt - lo) / (hi - lo));
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(W - 14, y0, 2, y1 - y0);
        ctx.beginPath();
        ctx.arc(W - 13, clamp(gy, y0, y1), 5, 0, PI2);
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.fill();
        ctx.font = '600 11px -apple-system, "Segoe UI", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        ctx.fillRect(W - 76, 8, 68, 17);
        ctx.fillStyle = 'rgba(40,36,64,0.85)';
        ctx.fillText('alt ' + alt.toFixed(2), W - 14, 20);
    }
    const CLOUD_LAYERS = 4;
    const UNDERLIT_BIAS = 0.7;
    const LIGHT_REACH = 0.9;
    // 구름 한 층(0 = 맨 위, 1 = 맨 아래)이 해 불빛을 받는 정도 — 해가 낮을수록 빛이 닿는 깊이가 위로 올라온다
    function underlit(layerK, alt) {
        const reach = (1 - smooth(alt / 0.55)) * LIGHT_REACH;
        const u = Math.pow(1 - layerK, 1 + UNDERLIT_BIAS);
        return smooth((reach - u) / 0.4);
    }
    function cloudTone(layerK, alt) {
        const dusk = 1 - smooth((alt + 0.1) / 0.5);
        const body = mix([246, 246, 253], [124, 120, 172], dusk);
        const shaded = mix(body, [body[0] * 0.9, body[1] * 0.9, body[2] * 0.96], layerK * 0.4);
        const flame = mix([255, 204, 156], [255, 132, 128], layerK);
        return mix(shaded, flame, underlit(layerK, alt));
    }
    function main(rootEl, canvas, statusEl, btnEl, scene) {
        const ctx0 = canvas.getContext('2d');
        if (!ctx0) {
            return function () { return; };
        }
        const ctx = ctx0;
        canvas.width = W;
        canvas.height = H;
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce) {
            rootEl.classList.remove('is-demo');
        }
        const lo = Math.min(scene.lo, scene.hi);
        const hi = Math.max(scene.lo, scene.hi);
        let t = 0;
        let last = null;
        let paused = false;
        let manual = null;
        let preset = 0;
        let raf = 0;
        let pressed = false;
        let lastLabel = '';
        const cleaners = [];
        function listen(target, type, fn) {
            target.addEventListener(type, fn);
            cleaners.push(function () { target.removeEventListener(type, fn); });
        }
        function currentAlt() {
            if (manual !== null) {
                return manual;
            }
            if (reduce) {
                return scene.from;
            }
            return lerp(scene.from, scene.to, 0.5 - 0.5 * Math.cos(PI2 * t / PERIOD_MS));
        }
        function show() {
            const a = currentAlt();
            scene.draw(ctx, a, t);
            gauge(ctx, a, lo, hi);
            const s = labelOf(a);
            if (s !== lastLabel) {
                lastLabel = s;
                statusEl.textContent = s;
            }
        }
        function setButton() {
            btnEl.textContent = reduce ? 'Next scene' : (paused ? 'Play' : 'Pause');
        }
        function takeOver(a) {
            manual = clamp(a, lo, hi);
            if (!reduce) {
                paused = true;
                rootEl.classList.remove('is-demo');
                setButton();
            }
            show();
        }
        function onButton() {
            if (reduce) {
                preset = (preset + 1) % 4;
                manual = lerp(scene.from, scene.to, preset / 3);
                show();
                return;
            }
            paused = !paused;
            if (paused) {
                rootEl.classList.remove('is-demo');
            }
            else {
                rootEl.classList.add('is-demo');
                manual = null;
            }
            setButton();
        }
        function altAtY(e) {
            const r = canvas.getBoundingClientRect();
            const py = clamp((e.clientY - r.top) * H / r.height, 0, H);
            return lerp(hi, lo, py / H);
        }
        function tick(ts) {
            if (last === null) {
                last = ts;
            }
            const dt = Math.min(ts - last, 160);
            last = ts;
            if (!paused) {
                t += dt;
                show();
            }
            raf = requestAnimationFrame(tick);
        }
        listen(btnEl, 'click', function () { onButton(); });
        listen(canvas, 'pointerdown', function (e) { pressed = true; takeOver(altAtY(e)); });
        listen(canvas, 'pointermove', function (e) { if (pressed) {
            takeOver(altAtY(e));
        } });
        listen(canvas, 'pointerup', function () { pressed = false; });
        listen(canvas, 'pointercancel', function () { pressed = false; });
        listen(canvas, 'keydown', function (e) {
            const k = e.key;
            if (k === 'Enter' || k === ' ') {
                e.preventDefault();
                onButton();
                return;
            }
            let d = 0;
            if (k === 'ArrowUp' || k === 'ArrowRight') {
                d = KEY_ALT;
            }
            else if (k === 'ArrowDown' || k === 'ArrowLeft') {
                d = -KEY_ALT;
            }
            else {
                return;
            }
            e.preventDefault();
            takeOver(currentAlt() + d);
        });
        setButton();
        show();
        if (!reduce) {
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            for (let i = 0; i < cleaners.length; i += 1) {
                cleaners[i]();
            }
        };
    }
    const DRIFT_BAND = 0.00022;
    const CLOUD_X = 160;
    const CLOUD_Y = 64;
    const CLOUD_TOP = 24;
    const CLOUD_BOTTOM = 152;
    function makeScene() {
        const off = document.createElement('canvas');
        off.width = CLOUD_X;
        off.height = CLOUD_Y;
        const octx0 = off.getContext('2d');
        if (!octx0) {
            throw new Error('canvas');
        }
        const octx = octx0;
        const img = octx.createImageData(CLOUD_X, CLOUD_Y);
        const px = img.data;
        // 구름 한 장 — 픽셀마다 밀도를 잡음으로 구하고, 층 번호로 불빛 색을 고른다
        function paintClouds(alt, t) {
            const tones = [];
            for (let l = 0; l < CLOUD_LAYERS; l += 1) {
                tones.push(cloudTone(l / (CLOUD_LAYERS - 1), alt));
            }
            for (let j = 0; j < CLOUD_Y; j += 1) {
                const rowK = j / (CLOUD_Y - 1);
                const layer = Math.min(CLOUD_LAYERS - 1, Math.floor(rowK * CLOUD_LAYERS));
                const tone = tones[layer];
                const envelope = Math.pow(Math.sin(Math.PI * (0.06 + 0.88 * rowK)), 0.8);
                for (let i = 0; i < CLOUD_X; i += 1) {
                    const nx = i / CLOUD_X * 3.4 + t * DRIFT_BAND * (0.5 + rowK);
                    const d = fbm(nx, rowK * 3.3 + 2.1) * envelope;
                    const a = smooth((d - 0.3) / 0.22);
                    const k = 0.9 + 0.2 * d;
                    const o = (j * CLOUD_X + i) * 4;
                    px[o] = Math.min(255, tone[0] * k);
                    px[o + 1] = Math.min(255, tone[1] * k);
                    px[o + 2] = Math.min(255, tone[2] * k);
                    px[o + 3] = 255 * a;
                }
            }
            octx.putImageData(img, 0, 0);
        }
        return {
            from: SUN_ALT,
            to: -0.08,
            hi: 1,
            lo: ALT_NIGHT,
            draw: function (ctx, alt, t) {
                skyRows(ctx, alt, 0, HORIZON, 2);
                const sc = ramp(SUN_RAMP, alt);
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, W, HORIZON);
                ctx.clip();
                sunDisc(ctx, SUN_X, sunY(alt), 16, 16, sc, 96);
                ctx.restore();
                paintClouds(alt, t);
                ctx.imageSmoothingEnabled = true;
                ctx.drawImage(off, 0, CLOUD_TOP, W, CLOUD_BOTTOM - CLOUD_TOP);
                seaBase(ctx, alt, t);
                ctx.save();
                ctx.translate(SUN_X, HORIZON + 40);
                ctx.scale(1, 2.2);
                glow(ctx, 0, 0, 46, sc, 0.28 * smooth((alt + 0.1) / 0.3));
                ctx.restore();
                // 오른쪽 층 눈금 — 층마다 지금 불빛을 받는 정도
                for (let l = 0; l < CLOUD_LAYERS; l += 1) {
                    const k = l / (CLOUD_LAYERS - 1);
                    ctx.fillStyle = css(cloudTone(k, alt), 1);
                    ctx.fillRect(14, 54 + l * 14, 18, 10);
                }
            }
        };
    }
    main(document.getElementById('scRoot'), document.getElementById('scCanvas'), document.getElementById('scStatus'), document.getElementById('scBtn'), makeScene());
})();
</script>
</body>
</html>
