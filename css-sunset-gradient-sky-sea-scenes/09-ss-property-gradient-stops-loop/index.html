<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>색 위치를 등록 속성으로 움직이는 순수 CSS 노을 그라디언트 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sc" id="scRoot">
  <input class="sc__toggle" type="checkbox" id="scPause" aria-label="멈춤">
  <div class="sc__sky"></div>
  <div class="sc__sea"><div class="sc__glint"></div></div>
  <p class="sc__status" role="status" aria-live="polite">CSS 만으로 저무는 하늘</p>
  <label class="sc__btn" for="scPause"><span class="sc__off">멈춤</span><span class="sc__on">재생</span></label>
</div>
</main>
</body>
</html>
