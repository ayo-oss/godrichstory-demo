<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">

<title>A Pure CSS Sunset Gradient Moving Its Stops Through Registered Properties — demo</title>

</head>
<body>
<main class="stage">
<div class="sc" id="scRoot">
  <input class="sc__toggle" type="checkbox" id="scPause" aria-label="Pause">
  <div class="sc__sky"></div>
  <div class="sc__sea"><div class="sc__glint"></div></div>
  <p class="sc__status" role="status" aria-live="polite">A sky that sets with CSS alone</p>
  <label class="sc__btn" for="scPause"><span class="sc__off">Pause</span><span class="sc__on">Play</span></label>
