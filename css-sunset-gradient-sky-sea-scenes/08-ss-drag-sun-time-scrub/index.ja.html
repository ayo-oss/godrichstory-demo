<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>太陽をドラッグして一日を巻き戻す夕焼けのタイムスクラバー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sc is-demo" id="scRoot">
  <canvas class="sc__canvas" id="scCanvas" width="480" height="300" tabindex="0" aria-label="太陽をドラッグして一日を巻き戻す夕焼けのタイムスクラバー"></canvas>
  <p class="sc__status" id="scStatus" aria-live="polite">日が沈んだ — 夕闇</p>
  <button class="sc__btn" id="scBtn" type="button">一時停止</button>
</div>
</main>
<script>
(function () {
    const W = 480;
    const H = 300;
    const PI2 = Math.PI * 2;
    const HORIZON = 186;
    const SUN_RISE = 150;
    const SUN_X = 312;
    const SUN_ALT = 0.5;
    const ALT_NIGHT = -0.15;
    const PERIOD_MS = 4400;
    const KEY_ALT = 0.05;
    const SKY_BLEND = 1.7;
    // 해 높이(0 = 지평선, 1 = 높이 뜸) 순서대로 고른 색 띠 — 정점 쪽, 지평선 쪽, 해 원반
    const ZENITH_RAMP = [[-0.15, [40, 44, 96]], [0, [92, 92, 156]], [0.12, [128, 126, 182]], [0.3, [150, 160, 214]], [0.6, [150, 192, 238]], [1, [138, 190, 242]]];
    const HORIZON_RAMP = [[-0.15, [110, 104, 160]], [0, [238, 134, 142]], [0.12, [255, 168, 146]], [0.3, [255, 208, 166]], [0.6, [240, 226, 222]], [1, [206, 230, 248]]];
    const SUN_RAMP = [[-0.15, [238, 128, 134]], [0, [255, 150, 126]], [0.15, [255, 190, 140]], [0.4, [255, 226, 176]], [1, [255, 246, 222]]];
    const TXT_HIGH = '太陽が高い — 昼の空';
    const TXT_GOLD = '太陽が傾く — 金色の午後';
    const TXT_GLOW = '太陽が低い — 夕焼け';
    const TXT_TOUCH = '太陽が地平線に触れる — 赤い帯';
    const TXT_DUSK = '日が沈んだ — 夕闇';
    function labelOf(alt) {
        if (alt > 0.6) {
            return TXT_HIGH;
        }
        if (alt > 0.3) {
            return TXT_GOLD;
        }
        if (alt > 0.08) {
            return TXT_GLOW;
        }
        if (alt > -0.06) {
            return TXT_TOUCH;
        }
        return TXT_DUSK;
    }
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function css(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a.toFixed(3) + ')';
    }
    function luma(c) { return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255; }
    // 시드 고정 난수 — 같은 시드면 언제나 같은 수열
    function mulberry32(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6D2B79F5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function hash2(ix, iy) {
        let h = Math.imul(ix | 0, 374761393) + Math.imul(iy | 0, 668265263);
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    function vnoise(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        const fx = smooth(x - ix);
        const fy = smooth(y - iy);
        return lerp(lerp(hash2(ix, iy), hash2(ix + 1, iy), fx), lerp(hash2(ix, iy + 1), hash2(ix + 1, iy + 1), fx), fy);
    }
    function fbm(x, y) {
        return vnoise(x, y) * 0.55 + vnoise(x * 2.1 + 7.3, y * 2.1 + 3.1) * 0.3 + vnoise(x * 4.3 + 1.7, y * 4.3 + 9.4) * 0.15;
    }
    function ramp(stops, a) {
        if (a <= stops[0][0]) {
            return stops[0][1];
        }
        for (let i = 1; i < stops.length; i += 1) {
            if (a <= stops[i][0]) {
                const p = stops[i - 1];
                const q = stops[i];
                return mix(p[1], q[1], (a - p[0]) / (q[0] - p[0]));
            }
        }
        return stops[stops.length - 1][1];
    }
    // 하늘 한 점의 색 — v 는 0(정점)에서 1(지평선)
    function skyAt(alt, v) {
        return mix(ramp(ZENITH_RAMP, alt), ramp(HORIZON_RAMP, alt), Math.pow(clamp(v, 0, 1), SKY_BLEND));
    }
    function sunY(alt) { return HORIZON - alt * SUN_RISE; }
    function seaDeep(alt) { return mix([84, 128, 170], [36, 48, 98], clamp((0.3 - alt) / 0.4, 0, 1)); }
    function glow(ctx, x, y, r, c, a) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, css(c, a));
        g.addColorStop(1, css(c, 0));
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    function skyRows(ctx, alt, y0, y1, step) {
        for (let y = y0; y < y1; y += step) {
            ctx.fillStyle = css(skyAt(alt, (y - y0) / (y1 - y0)), 1);
            ctx.fillRect(0, y, W, step + 1);
        }
    }
    // 바다 바탕 — 지평선 하늘색을 받아 아래로 갈수록 깊어지고, 줄마다 잔물결 밝기가 흔들린다
    function seaBase(ctx, alt, t) {
        const top = mix(skyAt(alt, 1), seaDeep(alt), 0.35);
        const deep = seaDeep(alt);
        for (let y = HORIZON; y < H; y += 3) {
            const k = (y - HORIZON) / (H - HORIZON);
            const c = mix(top, deep, Math.pow(k, 0.7));
            const r = 1 + 0.05 * Math.sin(y * 0.8 + t * 0.0018 + k * 6);
            ctx.fillStyle = css([c[0] * r, c[1] * r, c[2] * r], 1);
            ctx.fillRect(0, y, W, 4);
        }
    }
    function sunDisc(ctx, x, y, rx, ry, c, halo) {
        glow(ctx, x, y, halo, c, 0.5);
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0, 0, PI2);
        ctx.fillStyle = css(c, 1);
        ctx.fill();
    }
    // 오른쪽 가장자리의 해 높이 눈금 — 입력이 얼마인지 눈에 보이게
    function gauge(ctx, alt, lo, hi) {
        const y0 = 46;
        const y1 = 236;
        const gy = lerp(y1, y0, (alt - lo) / (hi - lo));
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(W - 14, y0, 2, y1 - y0);
        ctx.beginPath();
        ctx.arc(W - 13, clamp(gy, y0, y1), 5, 0, PI2);
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.fill();
        ctx.font = '600 11px -apple-system, "Segoe UI", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        ctx.fillRect(W - 76, 8, 68, 17);
        ctx.fillStyle = 'rgba(40,36,64,0.85)';
        ctx.fillText('alt ' + alt.toFixed(2), W - 14, 20);
    }
    const CLOUD_LAYERS = 4;
    const UNDERLIT_BIAS = 0.7;
    const LIGHT_REACH = 0.9;
    // 구름 한 층(0 = 맨 위, 1 = 맨 아래)이 해 불빛을 받는 정도 — 해가 낮을수록 빛이 닿는 깊이가 위로 올라온다
    function underlit(layerK, alt) {
        const reach = (1 - smooth(alt / 0.55)) * LIGHT_REACH;
        const u = Math.pow(1 - layerK, 1 + UNDERLIT_BIAS);
        return smooth((reach - u) / 0.4);
    }
    function cloudTone(layerK, alt) {
        const dusk = 1 - smooth((alt + 0.1) / 0.5);
        const body = mix([246, 246, 253], [124, 120, 172], dusk);
        const shaded = mix(body, [body[0] * 0.9, body[1] * 0.9, body[2] * 0.96], layerK * 0.4);
        const flame = mix([255, 204, 156], [255, 132, 128], layerK);
        return mix(shaded, flame, underlit(layerK, alt));
    }
    const WAVE_AMP = 14;
    const GLITTER_WIDTH = 22;
    const ROW_JITTER = 0.7;
    // 바다 윤슬 길 — 수면 가로줄마다 파도로 흔들린 위치를 구하고, 해 아래 폭 안의 조각만 밝게 칠한다
    function glitterRoad(ctx, alt, cx0, t, col) {
        const vis = smooth((alt + 0.08) / 0.22);
        if (vis <= 0.01) {
            return;
        }
        const lit = mix(col, [255, 255, 255], 0.4);
        for (let y = HORIZON + 1; y < H; y += 2) {
            const d = (y - HORIZON) / (H - HORIZON);
            const jit = ROW_JITTER * (hash2(y, 11) - 0.5) * 2;
            const shift = WAVE_AMP * (0.18 + 0.82 * d) * (Math.sin(y * 0.31 + t * 0.0021) + 0.6 * Math.sin(y * 0.77 - t * 0.0033 + jit * 3) + jit * 0.5);
            const half = GLITTER_WIDTH * (0.35 + 1.1 * d);
            const seg = 9;
            const segW = half * 2 / seg;
            for (let s = 0; s < seg; s += 1) {
                const u = (s + 0.5) / seg * 2 - 1;
                const on = smooth((vnoise(s * 1.7 + y * 0.11, t * 0.0016 + y * 0.05) - 0.42) * 5);
                const a = vis * (1 - u * u) * on * (0.95 - 0.4 * d);
                if (a > 0.02) {
                    ctx.fillStyle = css(lit, a);
                    ctx.fillRect(cx0 + shift - half + s * segW, y, segW * 0.9, 2);
                }
            }
        }
    }
    const ARC_RADIUS = 176;
    const ARC_CX = 240;
    const ARC_CY = 204;
    const DRAG_SMOOTH = 0.22;
    const DAY_CLAMP = 0.015;
    const SCRUB_STEP = 0.04;
    const AUTO_MS = 7600;
    const SUN_PX = 15;
    const SCRUB_STARS = 64;
    const REST_S = 0.8;
    function makeStars() {
        const rnd = mulberry32(808);
        const out = [];
        for (let i = 0; i < SCRUB_STARS; i += 1) {
            const b = Math.pow(rnd(), 2.2);
            out.push({ x: 8 + rnd() * (W - 16), y: 6 + rnd() * (HORIZON - 40), b: b, thr: lerp(0.2, 0.62, b) });
        }
        return out;
    }
    const stars = makeStars();
    // 호 위의 위치 s(0 = 왼쪽 끝, 1 = 오른쪽 끝) -> 해의 화면 좌표와 높이
    function arcPoint(s) {
        const x = ARC_CX - ARC_RADIUS * Math.cos(Math.PI * s);
        const y = ARC_CY - ARC_RADIUS * Math.sin(Math.PI * s);
        return { x: x, y: y, alt: (HORIZON - y) / SUN_RISE };
    }
    // 포인터 위치 -> 호 위 s. 호 아래로 내려가면 가까운 끝으로 붙는다
    function sFromPointer(px, py) {
        const ang = Math.atan2(ARC_CY - py, px - ARC_CX);
        if (ang < 0) {
            return px < ARC_CX ? DAY_CLAMP : 1 - DAY_CLAMP;
        }
        return clamp(1 - ang / Math.PI, DAY_CLAMP, 1 - DAY_CLAMP);
    }
    function clockText(s) {
        const mins = Math.round((6 + 12 * s) * 60);
        const hh = Math.floor(mins / 60);
        const mm = mins % 60;
        return 'h ' + (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
    }
    function drawScene(ctx, s, t) {
        const p = arcPoint(s);
        const alt = p.alt;
        skyRows(ctx, alt, 0, HORIZON, 2);
        for (let i = 0; i < stars.length; i += 1) {
            const st = stars[i];
            const vis = smooth((st.thr - luma(skyAt(alt, st.y / HORIZON))) / 0.07);
            if (vis > 0.02) {
                ctx.fillStyle = 'rgba(255,252,240,' + (vis * (0.78 + 0.22 * Math.sin(t * 0.004 + st.x))).toFixed(3) + ')';
                ctx.beginPath();
                ctx.arc(st.x, st.y, 0.7 + 1.4 * st.b, 0, PI2);
                ctx.fill();
            }
        }
        const sc = ramp(SUN_RAMP, alt);
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, W, HORIZON);
        ctx.clip();
        glow(ctx, p.x, HORIZON, 150, sc, 0.4 * smooth((alt + 0.18) / 0.3) * (1 - smooth(alt / 0.5)));
        sunDisc(ctx, p.x, p.y, SUN_PX, SUN_PX, sc, 84);
        ctx.restore();
        // 구름 두 띠 — 한 값(alt)으로 윗면은 하늘 색에 남고 아랫면부터 불빛이 번진다
        for (let b = 0; b < 2; b += 1) {
            const cy = 62 + b * 40;
            const g = ctx.createLinearGradient(0, cy - 14, 0, cy + 14);
            g.addColorStop(0, css(cloudTone(0.05, alt), 0.95));
            g.addColorStop(0.5, css(cloudTone(0.5, alt), 0.95));
            g.addColorStop(1, css(cloudTone(1, alt), 0.95));
            ctx.fillStyle = g;
            const rnd = mulberry32(31 + b);
            for (let k = 0; k < 7; k += 1) {
                const cx = ((rnd() * W + t * (0.006 + 0.004 * b)) % (W + 120)) - 60;
                ctx.beginPath();
                ctx.ellipse(cx, cy + (rnd() - 0.5) * 8, 30 + rnd() * 22, 8 + rnd() * 6, 0, 0, PI2);
                ctx.fill();
            }
        }
        seaBase(ctx, alt, t);
        glitterRoad(ctx, alt, p.x, t, sc);
        // 해가 지나는 호와 손잡이
        for (let a = 0; a <= 1.001; a += 0.025) {
            const q = arcPoint(a);
            if (q.y < H - 4) {
                ctx.fillStyle = 'rgba(255,255,255,0.55)';
                ctx.fillRect(q.x - 1, q.y - 1, 2, 2);
            }
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, SUN_PX + 6, 0, PI2);
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.font = '600 11px -apple-system, "Segoe UI", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        ctx.fillRect(W - 66, 8, 58, 17);
        ctx.fillStyle = 'rgba(40,36,64,0.85)';
        ctx.fillText(clockText(s), W - 14, 20);
        return alt;
    }
    function main(rootEl, canvas, statusEl, btnEl) {
        const ctx0 = canvas.getContext('2d');
        if (!ctx0) {
            return function () { return; };
        }
        const ctx = ctx0;
        canvas.width = W;
        canvas.height = H;
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce) {
            rootEl.classList.remove('is-demo');
        }
        const presets = [0.2, 0.5, 0.8, 0.97];
        let t = 0;
        let last = null;
        let paused = false;
        let manual = false;
        let target = reduce ? REST_S : 1 - DAY_CLAMP;
        let shownS = target;
        let preset = 2;
        let raf = 0;
        let pressed = false;
        let lastLabel = '';
        const cleaners = [];
        function listen(el, type, fn) {
            el.addEventListener(type, fn);
            cleaners.push(function () { el.removeEventListener(type, fn); });
        }
        function show() {
            const a = drawScene(ctx, shownS, t);
            const s = labelOf(a);
            if (s !== lastLabel) {
                lastLabel = s;
                statusEl.textContent = s;
            }
        }
        function setButton() { btnEl.textContent = reduce ? '次の場面' : (paused || manual ? '再生' : '一時停止'); }
        // 사용자가 끌거나 키를 누르면 자동 시연을 멈추고 그 값으로 간다 (움직임 줄이기에서도 입력은 즉시 반영)
        function takeOver(s) {
            target = clamp(s, DAY_CLAMP, 1 - DAY_CLAMP);
            manual = true;
            if (reduce) {
                shownS = target;
            }
            else {
                paused = false;
                rootEl.classList.remove('is-demo');
                setButton();
            }
            show();
        }
        function onButton() {
            if (reduce) {
                preset = (preset + 1) % presets.length;
                target = presets[preset];
                shownS = target;
                show();
                return;
            }
            if (manual) {
                manual = false;
                t = 0;
                rootEl.classList.add('is-demo');
                paused = false;
            }
            else {
                paused = !paused;
                if (paused) {
                    rootEl.classList.remove('is-demo');
                }
                else {
                    rootEl.classList.add('is-demo');
                }
            }
            setButton();
        }
        function toS(e) {
            const r = canvas.getBoundingClientRect();
            return sFromPointer((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
        }
        function tick(ts) {
            if (last === null) {
                last = ts;
            }
            const dt = Math.min(ts - last, 160);
            last = ts;
            if (!paused) {
                if (!manual) {
                    t += dt;
                    target = 0.5 + (0.5 - DAY_CLAMP) * Math.cos(PI2 * t / AUTO_MS);
                }
                shownS += (target - shownS) * (1 - Math.pow(1 - DRAG_SMOOTH, dt / 16.7));
                show();
            }
            raf = requestAnimationFrame(tick);
        }
        listen(btnEl, 'click', function () { onButton(); });
        listen(canvas, 'pointerdown', function (e) { pressed = true; takeOver(toS(e)); });
        listen(canvas, 'pointermove', function (e) { if (pressed) {
            takeOver(toS(e));
        } });
        listen(canvas, 'pointerup', function () { pressed = false; });
        listen(canvas, 'pointercancel', function () { pressed = false; });
        listen(canvas, 'keydown', function (e) {
            const k = e.key;
            if (k === 'Enter' || k === ' ') {
                e.preventDefault();
                onButton();
                return;
            }
            let d = 0;
            if (k === 'ArrowRight' || k === 'ArrowUp') {
                d = SCRUB_STEP;
            }
            else if (k === 'ArrowLeft' || k === 'ArrowDown') {
                d = -SCRUB_STEP;
            }
            else {
                return;
            }
            e.preventDefault();
            takeOver(target + d);
        });
        setButton();
        show();
        if (!reduce) {
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            for (let i = 0; i < cleaners.length; i += 1) {
                cleaners[i]();
            }
        };
    }
    main(document.getElementById('scRoot'), document.getElementById('scCanvas'), document.getElementById('scStatus'), document.getElementById('scBtn'));
})();
</script>
</body>
</html>
