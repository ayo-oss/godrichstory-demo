<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angle-Tracking Holographic Sticker — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <button class="card" id="card" type="button" aria-label="Holographic sticker; moving the cursor sends rainbow light across the surface following its direction and speed">
    <span class="cardMark" aria-hidden="true"></span>
    <span class="sheen" id="sheen" aria-hidden="true"></span>
  </button>
</div>
</main>
<script>
(function () {
  var HOLO_SWEEP_ANGLE_RANGE = 45; // 스윕 그라디언트가 회전하는 각도 폭(deg) — 변형은 90deg
  var HUE_SPEED = 220;   // 포인터 속도(px/ms) 가 Colors 회전 속도(deg/s)에 곱해지는 계수
  var SWEEP_SPEED = 340; // 포인터 속도가 빛 이동 위치(%/s)에 곱해지는 계수
  var LERP_RATE = .2;
  var ORBIT_MS = 1900;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('wrap');
  var card = document.getElementById('card');
  var sheen = document.getElementById('sheen');
  var isDemo = true;

  var hue = 0, sweepPos = 0, sweepAngleTarget = 115;
  var shownAngle = 115;
  var lastX = null, lastY = null, lastTime = 0;

  // 포인터의 이동량(dx, dy)과 걸린 시간(dt)으로 속도를 구해 Colors 회전 속도와 빛의 이동 속도를
  // 직접 정한다 — 133 의 정적 홀로그램과 달리 여기선 포인터 이동량 자체가 계산 입력이다.
  function applyMove(x, y, now) {
    if (lastX !== null) {
      var dt = Math.max(now - lastTime, 1);
      var dx = x - lastX, dy = y - lastY;
      var speed = Math.hypot(dx, dy) / dt; // px/ms
      hue = (hue + speed * HUE_SPEED * (dt / 1000)) % 360;
      sweepPos = (sweepPos + speed * SWEEP_SPEED * (dt / 1000)) % 200;
      sweepAngleTarget = 90 + (Math.atan2(dy, dx) * 180 / Math.PI) % HOLO_SWEEP_ANGLE_RANGE;
    }
    lastX = x; lastY = y; lastTime = now;
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }
  function onMove(e) { human(); applyMove(e.clientX, e.clientY, performance.now()); }
  card.addEventListener('pointermove', onMove);
  card.addEventListener('pointerleave', function () { human(); lastX = null; });

  var orbitLast = 0;
  function autoAdvance(ts) {
    var t = (ts % ORBIT_MS) / ORBIT_MS;
    var angle = t * Math.PI * 2;
    var r = card.getBoundingClientRect();
    var px = r.left + r.width / 2 + Math.cos(angle) * (r.width * .38);
    var py = r.top + r.height / 2 + Math.sin(angle) * (r.height * .38);
    applyMove(px, py, ts);
  }

  function loop(ts) {
    if (isDemo && !reduce) autoAdvance(ts);
    if (reduce) { shownAngle = sweepAngleTarget; }
    else { shownAngle += (sweepAngleTarget - shownAngle) * LERP_RATE; }
    card.style.setProperty('--hue-deg', (reduce ? 0 : hue).toFixed(1) + 'deg');
    card.style.setProperty('--sweep-pos', (reduce ? 0 : sweepPos).toFixed(1) + '%');
    sheen.style.setProperty('--sweep-angle', shownAngle.toFixed(1) + 'deg');
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
