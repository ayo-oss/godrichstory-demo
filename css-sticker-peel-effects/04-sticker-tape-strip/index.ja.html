<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マスキングテープで留めたステッカー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="cardZone">
    <div class="card" id="card">
      <span class="cardMark" aria-hidden="true"></span>
    </div>
    <span class="tape tape--a" id="tapeA" aria-hidden="true"></span>
    <span class="tape tape--b" id="tapeB" aria-hidden="true"></span>
  </div>
  <button class="pinBtn" id="pinBtn" type="button" aria-pressed="false">テープを片方はがす</button>
</div>
</main>
<script>
(function () {
  var TAPE_BASE_ANGLE = 14; // 테이프 기울기의 시작값(deg)
  var TAPE_ANGLE_STEP = 8;  // 테이프마다 더해지는 기울기 증가폭(deg) — 각도는 하드코딩이 아니라 산술로 만든다
  var LIFT_MAX_DEG = 10;    // 완전히 떼어졌을 때 카드가 기우는 각도(deg)
  var LIFT_MAX_PX = 8;      // 완전히 떼어졌을 때 카드가 뜨는 높이(px)
  var TAPE_STRETCH = 6;     // 떼는 동안 tapeA 가 더 기울어지는 최대폭(deg)
  var LERP_RATE = .17;
  var STEP_MS = 550;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('wrap');
  var card = document.getElementById('card');
  var tapeA = document.getElementById('tapeA');
  var tapeB = document.getElementById('tapeB');
  var pinBtn = document.getElementById('pinBtn');
  var isDemo = true;

  // 두 테이프의 기울기는 코너 순번(i)에 산술식(base + i*step)을 적용해 얻는다 — 부호는 좌우 대칭으로
  // 번갈아 뒤집는다. 하드코딩된 개별 각도값이 아니라 하나의 공식에서 나온 값이라는 게 계산 겹이다.
  function tapeAngle(i) {
    var sign = i % 2 === 0 ? -1 : 1;
    return sign * (TAPE_BASE_ANGLE + TAPE_ANGLE_STEP * i);
  }
  var baseAngleA = tapeAngle(1);
  var baseAngleB = tapeAngle(2);
  tapeB.style.transform = 'rotate(' + baseAngleB + 'deg)';

  var target = 0; // 0 = 붙어 있음, 1 = 한쪽이 떼어짐
  var shown = 0;
  var pinned = true;

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }
  function toggle() {
    human();
    pinned = !pinned;
    target = pinned ? 0 : 1;
    pinBtn.setAttribute('aria-pressed', String(!pinned));
    pinBtn.textContent = pinned ? 'テープを片方はがす' : 'もう一度貼る';
  }
  pinBtn.addEventListener('click', toggle);

  var dir = 1, last = 0;
  function autoAdvance(ts) {
    if (ts - last < STEP_MS) return;
    last = ts;
    target = dir > 0 ? 1 : 0;
    dir *= -1;
  }

  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce) autoAdvance(ts);
    if (reduce) { shown = target; } else { shown += (target - shown) * LERP_RATE; }
    card.style.transform = 'rotate(' + (LIFT_MAX_DEG * shown).toFixed(2) + 'deg) translate(' +
      (LIFT_MAX_PX * shown * .6).toFixed(2) + 'px, ' + (-LIFT_MAX_PX * shown).toFixed(2) + 'px)';
    tapeA.style.transform = 'rotate(' + (baseAngleA + TAPE_STRETCH * shown).toFixed(2) + 'deg) translateY(' +
      (-LIFT_MAX_PX * .6 * shown).toFixed(2) + 'px)';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
