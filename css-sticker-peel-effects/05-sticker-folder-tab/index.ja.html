<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フォルダタブ型ステッカー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="folder">
    <div class="tab" id="tab">
      <span class="tabLabel" id="tabLabel">書類</span>
    </div>
    <div class="body"><span class="cardMark" aria-hidden="true"></span></div>
  </div>
  <div class="switchRow">
    <button type="button" id="btnPrev">前のラベル</button>
    <button type="button" id="btnNext">次のラベル</button>
  </div>
</div>
</main>
<script>
(function () {
  var LABELS = ['書類', '色', '資料保管庫']; // 순서대로만 순환 — 길이가 다 다르다
  var TAB_PADDING = 28;  // 실측한 글자 폭 양옆에 더하는 여백(px)
  var TAB_MIN = 60;
  var TAB_MAX = 156;
  var LERP_RATE = .15;
  var STEP_MS = 500;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('wrap');
  var tab = document.getElementById('tab');
  var tabLabel = document.getElementById('tabLabel');
  var btnPrev = document.getElementById('btnPrev');
  var btnNext = document.getElementById('btnNext');
  var isDemo = true;

  var measureCanvas = document.createElement('canvas');
  var ctx = measureCanvas.getContext('2d');

  // 라벨 글자 폭을 canvas 로 실측해 탭이 그 글자에 딱 맞는 폭을 갖게 한다 — 폭은 미리 정한 값이
  // 아니라 매번 실제로 잰 값이다. 실제 상자 너비(width)는 최대치로 고정해 두고 clip-path 로만
  // 드러내는 폭을 바꿔 레이아웃 재계산 없이(transform·opacity 규칙과 같은 취지) 늘고 준다.
  function measureWidth(text) {
    ctx.font = '600 13px -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    var w = ctx.measureText(text).width;
    return Math.max(TAB_MIN, Math.min(TAB_MAX, w + TAB_PADDING));
  }

  var index = 0;
  var target = measureWidth(LABELS[0]);
  var shown = target;

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }
  function setLabel(i) {
    index = (i + LABELS.length) % LABELS.length;
    tabLabel.textContent = LABELS[index];
    target = measureWidth(LABELS[index]);
  }
  btnPrev.addEventListener('click', function () { human(); setLabel(index - 1); });
  btnNext.addEventListener('click', function () { human(); setLabel(index + 1); });

  var last = 0;
  function autoAdvance(ts) {
    if (ts - last < STEP_MS) return;
    last = ts;
    setLabel(index + 1);
  }

  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce) autoAdvance(ts);
    if (reduce) { shown = target; } else { shown += (target - shown) * LERP_RATE; }
    tab.style.setProperty('--tab-w', shown.toFixed(2) + 'px');
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
