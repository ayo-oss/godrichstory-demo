<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랜덤 각도로 흩뿌려진 스티커 무더기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="tray" id="tray">
    <span class="chip chip--a" id="chipA" aria-hidden="true"></span>
    <span class="chip chip--b" id="chipB" aria-hidden="true"></span>
    <span class="chip chip--c" id="chipC" aria-hidden="true"></span>
    <span class="chip chip--d" id="chipD" aria-hidden="true"></span>
    <span class="chip chip--e" id="chipE" aria-hidden="true"></span>
  </div>
  <button class="shuffleBtn" id="shuffleBtn" type="button">다시 흩뿌리기</button>
</div>
</main>
<script>
(function () {
  var SCATTER_ROTATE_RANGE = 30; // 칩 하나가 회전할 수 있는 최대폭(deg) — 변형에서만 바뀐다
  var SCATTER_POS_RANGE = 22;    // 칩 중심에서 벗어나는 최대 거리(px)
  var LERP_RATE = .22;
  var SEEDS = [3, 17, 41, 8, 26]; // 고정된 씨앗값 목록 — 순환만 하고 매번 값 자체를 새로 뽑지 않는다

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('wrap');
  var shuffleBtn = document.getElementById('shuffleBtn');
  var chips = [
    document.getElementById('chipA'), document.getElementById('chipB'),
    document.getElementById('chipC'), document.getElementById('chipD'),
    document.getElementById('chipE')
  ];
  var isDemo = true;

  // deterministic scatter (seeded, no Math.random) — 사인 해시로 씨앗값 하나에서 항상 같은
  // 소수부를 뽑는다. seed 가 같으면 언제 호출해도 같은 결과가 나오는 결정적 함수다.
  function hash(seed) {
    var v = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
    return v - Math.floor(v);
  }

  function layoutFor(seed) {
    var h1 = hash(seed);
    var h2 = hash(seed + 100);
    var h3 = hash(seed + 200);
    return {
      rot: (h1 * 2 - 1) * SCATTER_ROTATE_RANGE,
      dx: (h2 * 2 - 1) * SCATTER_POS_RANGE,
      dy: (h3 * 2 - 1) * SCATTER_POS_RANGE
    };
  }

  var round = 0;
  var targets = chips.map(function (_, i) { return layoutFor(SEEDS[i] + round * 1000); });
  var shown = targets.map(function (t) { return { rot: 0, dx: 0, dy: 0 }; });

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }
  function reshuffle() {
    round += 1;
    targets = chips.map(function (_, i) { return layoutFor(SEEDS[i] + round * 1000); });
  }
  shuffleBtn.addEventListener('click', function () { human(); reshuffle(); });

  var last = 0, STEP_MS = 700;
  function autoAdvance(ts) {
    if (ts - last < STEP_MS) return;
    last = ts;
    reshuffle();
  }

  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce) autoAdvance(ts);
    chips.forEach(function (chip, i) {
      var t = targets[i], s = shown[i];
      if (reduce) { s.rot = t.rot; s.dx = t.dx; s.dy = t.dy; }
      else {
        s.rot += (t.rot - s.rot) * LERP_RATE;
        s.dx += (t.dx - s.dx) * LERP_RATE;
        s.dy += (t.dy - s.dy) * LERP_RATE;
      }
      chip.style.transform = 'translate(' + s.dx.toFixed(2) + 'px, ' + s.dy.toFixed(2) + 'px) rotate(' + s.rot.toFixed(2) + 'deg)';
    });
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
