<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker That Tilts With the Cursor — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <button class="cardZone" id="cardZone" type="button" aria-label="Sticker; hover to tilt it toward the pointer">
    <span class="card" id="card">
      <span class="glare" id="glare" aria-hidden="true"></span>
      <span class="cardMark" aria-hidden="true"></span>
    </span>
  </button>
</div>
</main>
<script>
(function () {
  var MAX_TILT = 14;   // 최대 회전각(deg)
  var GLARE_RANGE = 60; // 광택 이동 범위(%)
  var LERP_RATE = .18;
  var ORBIT_MS = 2200;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('wrap');
  var zone = document.getElementById('cardZone');
  var card = document.getElementById('card');
  var glare = document.getElementById('glare');
  var isDemo = true;

  var targetRX = 0, targetRY = 0, targetGX = 50, targetGY = 50;
  var shownRX = 0, shownRY = 0, shownGX = 50, shownGY = 50;

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  // 포인터 좌표를 카드 중심 기준 -1..1 로 정규화한 뒤 그 값에 MAX_TILT 를 곱해 회전각을 얻는다.
  // 세로 이동은 rotateX 를, 가로 이동은 rotateY 를 반대 부호로 결정한다(위로 밀면 뒤로 젖혀짐).
  function applyFromPoint(px, py) {
    var rect = zone.getBoundingClientRect();
    var nx = ((px - rect.left) / rect.width) * 2 - 1;
    var ny = ((py - rect.top) / rect.height) * 2 - 1;
    nx = Math.max(-1, Math.min(1, nx));
    ny = Math.max(-1, Math.min(1, ny));
    targetRY = nx * MAX_TILT;
    targetRX = -ny * MAX_TILT;
    targetGX = 50 + nx * GLARE_RANGE;
    targetGY = 50 + ny * GLARE_RANGE;
  }
  function reset() { targetRX = 0; targetRY = 0; targetGX = 50; targetGY = 50; }

  zone.addEventListener('pointermove', function (e) { human(); applyFromPoint(e.clientX, e.clientY); });
  zone.addEventListener('pointerleave', function () { human(); reset(); });
  zone.addEventListener('focus', function () { human(); targetRY = MAX_TILT * .5; targetRX = -MAX_TILT * .3; });
  zone.addEventListener('blur', function () { reset(); });

  var start = 0;
  function autoAdvance(ts) {
    if (!start) start = ts;
    var t = ((ts - start) % ORBIT_MS) / ORBIT_MS * Math.PI * 2;
    applyFromPoint(
      zone.getBoundingClientRect().left + zone.getBoundingClientRect().width * (.5 + .4 * Math.cos(t)),
      zone.getBoundingClientRect().top + zone.getBoundingClientRect().height * (.5 + .4 * Math.sin(t))
    );
  }

  function loop(ts) {
    if (isDemo && !reduce) autoAdvance(ts);
    if (reduce) {
      shownRX = targetRX; shownRY = targetRY; shownGX = targetGX; shownGY = targetGY;
    } else {
      shownRX += (targetRX - shownRX) * LERP_RATE;
      shownRY += (targetRY - shownRY) * LERP_RATE;
      shownGX += (targetGX - shownGX) * LERP_RATE;
      shownGY += (targetGY - shownGY) * LERP_RATE;
    }
    card.style.transform = 'rotateX(' + shownRX.toFixed(2) + 'deg) rotateY(' + shownRY.toFixed(2) + 'deg)';
    glare.style.background = 'radial-gradient(circle at ' + shownGX.toFixed(1) + '% ' + shownGY.toFixed(1) +
      '%, rgba(255,255,255,.5), transparent 55%)';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
