<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker Sheet With Visible Cut Lines — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="sheet">
    <button class="die" id="dieA" type="button" aria-pressed="false" aria-label="First sticker; press to punch it out">
      <span class="dieMark" aria-hidden="true"></span>
      <svg class="cutLine" viewBox="0 0 100 100" aria-hidden="true">
        <rect class="cutLineRect" x="3" y="3" width="94" height="94" rx="14" />
      </svg>
    </button>
    <button class="die" id="dieB" type="button" aria-pressed="false" aria-label="Second sticker; press to punch it out">
      <span class="dieMark" aria-hidden="true"></span>
      <svg class="cutLine" viewBox="0 0 100 100" aria-hidden="true">
        <rect class="cutLineRect" x="3" y="3" width="94" height="94" rx="14" />
      </svg>
    </button>
  </div>
</div>
</main>
<script>
(function () {
  var DASH = 6, GAP = 4;           // 재단선 점선 한 마디 길이(svg 단위, viewBox 100 기준)
  var MARCH_SPEED = 14;            // 점선이 도는 속도(단위/s)
  var PATTERN = DASH + GAP;
  var STEP_MS = 1700;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('wrap');
  var dies = [document.getElementById('dieA'), document.getElementById('dieB')];
  var rects = Array.prototype.map.call(document.querySelectorAll('.cutLineRect'), function (r) { return r; });
  rects.forEach(function (r) { r.style.strokeDasharray = DASH + ' ' + GAP; });
  var isDemo = true;
  var punched = [false, false];

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }
  function togglePunch(i) {
    punched[i] = !punched[i];
    dies[i].setAttribute('aria-pressed', String(punched[i]));
    dies[i].classList.toggle('is-punched', punched[i]);
  }
  dies.forEach(function (die, i) {
    die.addEventListener('click', function () { human(); togglePunch(i); });
  });

  var last = 0, stepLast = 0, autoIdx = 0;
  function autoAdvance(ts) {
    if (ts - stepLast < STEP_MS) return;
    stepLast = ts;
    togglePunch(autoIdx);
    autoIdx = (autoIdx + 1) % dies.length;
  }

  // 점선 마디 길이(PATTERN)에 대해 경과 시간을 곱한 오프셋을 모듈로 연산으로 되감아, 끊김 없이
  // 도는 재단선(stroke-dashoffset)을 만든다 — 실제 인쇄 재단선의 "개미 행진" 표시와 같은 계산.
  function loop(ts) {
    if (!last) last = ts;
    last = ts;
    if (isDemo && !reduce) autoAdvance(ts);
    if (!reduce) {
      var offset = (ts * MARCH_SPEED / 1000) % PATTERN;
      rects.forEach(function (r) { r.style.strokeDashoffset = (-offset).toFixed(2); });
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
