<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>흰 테두리 다이컷 스티커 카드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <button class="badge" id="badge" type="button" aria-label="다이컷 스티커, 마우스를 올리거나 초점을 주면 들어올려진다">
    <span class="badgeMark" aria-hidden="true"></span>
  </button>
</div>
</main>
<script>
(function () {
  var LIFT_LAYERS = 5;         // 그림자를 쌓는 겹 수
  var LAYER_OFFSET = 3.6;      // 겹마다 늘어나는 세로 오프셋(px, 완전히 뜬 상태 기준)
  var LAYER_BLUR = 6;          // 겹마다 늘어나는 흐림(px)
  var LAYER_ALPHA_BASE = .34;  // 첫 겹 불투명도
  var LAYER_ALPHA_STEP = .05;  // 겹마다 옅어지는 정도
  var LIFT_PX = 18;            // 완전히 뜬 상태에서 위로 이동하는 거리(px)
  var LIFT_SCALE = .08;        // 완전히 뜬 상태에서 커지는 비율
  var LERP_RATE = .16;
  var STEP_MS = 900;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('wrap');
  var badge = document.getElementById('badge');
  var isDemo = true;

  var target = 0; // 0 = 붙어 있음, 1 = 완전히 뜸
  var shown = 0;

  // 겹마다 오프셋·흐림·불투명도를 산술로 늘려 쌓는다 — 하나의 box-shadow 문자열로 합쳐 다이컷 스티커의
  // 두꺼운 그림자 뒤판을 만든다. 이 계산이 뜬 정도(t)에 정비례해 매 프레임 다시 도는 것이 계산 겹이다.
  function shadowFor(t) {
    var parts = [];
    for (var i = 1; i <= LIFT_LAYERS; i++) {
      var off = (LAYER_OFFSET * i * t).toFixed(2);
      var blur = (LAYER_BLUR * i * t + 2).toFixed(2);
      var alpha = Math.max(0, LAYER_ALPHA_BASE - LAYER_ALPHA_STEP * i) * t;
      parts.push('0 ' + off + 'px ' + blur + 'px rgba(10,8,14,' + alpha.toFixed(3) + ')');
    }
    return parts.join(', ');
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }
  function lift() { human(); target = 1; }
  function drop() { human(); target = 0; }
  badge.addEventListener('pointerenter', lift);
  badge.addEventListener('pointerleave', drop);
  badge.addEventListener('focus', lift);
  badge.addEventListener('blur', drop);

  var dir = 1;
  var last = 0;
  function autoAdvance(ts) {
    if (ts - last < STEP_MS) return;
    last = ts;
    target = dir > 0 ? 1 : 0;
    dir *= -1;
  }

  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce) autoAdvance(ts);
    if (reduce) { shown = target; } else { shown += (target - shown) * LERP_RATE; }
    badge.style.transform = 'translateY(' + (-LIFT_PX * shown).toFixed(2) + 'px) scale(' + (1 + LIFT_SCALE * shown).toFixed(3) + ')';
    badge.style.boxShadow = shadowFor(shown);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
