<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ドラッグして貼るステッカー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="board" id="board">
    <span class="cell" aria-hidden="true"></span>
    <span class="cell" aria-hidden="true"></span>
    <span class="cell" aria-hidden="true"></span>
    <span class="cell" aria-hidden="true"></span>
    <button class="chip" id="chip" type="button" aria-label="ステッカー、ドラッグして格子のマスに置く">
      <span class="chipMark" aria-hidden="true"></span>
    </button>
  </div>
</div>
</main>
<script>
(function () {
  var GRID = 78;      // 격자 한 칸 크기(px) — 스냅 계산의 기준
  var BOARD_W = 190, BOARD_H = 190;
  var LERP_RATE = .22;
  var ORBIT_MS = 650;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('wrap');
  var board = document.getElementById('board');
  var chip = document.getElementById('chip');
  var isDemo = true;
  var dragging = false;

  var target = { x: GRID / 2, y: GRID / 2 };
  var shown = { x: target.x, y: target.y };

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  // 포인터가 놓인 좌표를 GRID 칸 크기로 나눈 몫을 반올림해 칸 중심 좌표로 되돌린다 —
  // 자유 좌표가 아니라 항상 격자 위 한 점으로 스냅되는 계산이다.
  function snap(px, py) {
    var col = Math.max(0, Math.min(1, Math.round((px - GRID / 2) / GRID)));
    var row = Math.max(0, Math.min(1, Math.round((py - GRID / 2) / GRID)));
    return { x: col * GRID + GRID / 2, y: row * GRID + GRID / 2 };
  }

  chip.addEventListener('pointerdown', function (e) {
    human();
    dragging = true;
    chip.setPointerCapture(e.pointerId);
  });
  chip.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var rect = board.getBoundingClientRect();
    var px = Math.max(0, Math.min(BOARD_W, e.clientX - rect.left));
    var py = Math.max(0, Math.min(BOARD_H, e.clientY - rect.top));
    target = snap(px, py);
  });
  function endDrag() { dragging = false; }
  chip.addEventListener('pointerup', endDrag);
  chip.addEventListener('pointercancel', endDrag);
  chip.addEventListener('keydown', function (e) {
    human();
    var col = target.x > GRID ? 1 : 0, row = target.y > GRID ? 1 : 0;
    if (e.key === 'ArrowRight') col = 1;
    else if (e.key === 'ArrowLeft') col = 0;
    else if (e.key === 'ArrowDown') row = 1;
    else if (e.key === 'ArrowUp') row = 0;
    else return;
    e.preventDefault();
    target = { x: col * GRID + GRID / 2, y: row * GRID + GRID / 2 };
  });

  var slots = [[0, 0], [1, 0], [0, 1], [1, 1]];
  var slotIdx = 0, last = 0;
  function autoAdvance(ts) {
    if (ts - last < ORBIT_MS) return;
    last = ts;
    slotIdx = (slotIdx + 1) % slots.length;
    target = { x: slots[slotIdx][0] * GRID + GRID / 2, y: slots[slotIdx][1] * GRID + GRID / 2 };
  }

  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce && !dragging) autoAdvance(ts);
    if (reduce) { shown.x = target.x; shown.y = target.y; }
    else {
      shown.x += (target.x - shown.x) * LERP_RATE;
      shown.y += (target.y - shown.y) * LERP_RATE;
    }
    chip.style.transform = 'translate(' + (shown.x - GRID / 2).toFixed(2) + 'px, ' + (shown.y - GRID / 2).toFixed(2) + 'px)';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
