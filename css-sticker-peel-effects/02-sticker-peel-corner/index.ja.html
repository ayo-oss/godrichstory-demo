<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角からめくれるステッカー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="cardZone" id="zone">
    <div class="backing" aria-hidden="true"></div>
    <button class="card" id="card" type="button" aria-label="ステッカーカード、カーソルを角の方へ動かすとめくれる">
      <span class="cardMark" aria-hidden="true"></span>
      <span class="peelShade" id="shade" aria-hidden="true"></span>
    </button>
  </div>
</div>
</main>
<script>
(function () {
  var PEEL_CORNER_SIZE = 24; // 커서가 모서리에 딱 붙었을 때 벗겨지는 기본 크기(px) — 변형은 44px
  var PEEL_REACH = 190;      // 이 거리(px) 밖이면 벗겨짐이 0 이 된다
  var LERP_RATE = .18;
  var ORBIT_MS = 2600;       // 자동 루프가 코너 주변을 도는 한 바퀴 시간

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('wrap');
  var zone = document.getElementById('zone');
  var card = document.getElementById('card');
  var shade = document.getElementById('shade');
  var isDemo = true;

  var targetSize = 0, targetDeg = 45;
  var shownSize = 0, shownDeg = 45;

  // 카드 우상단 꼭짓점(pivot)에서 포인터까지의 벡터로 벗겨짐 크기와 그라디언트 각도를 계산한다.
  // 거리(distance)가 가까울수록 크게 벗겨지고, 각도(atan2)는 그라디언트가 흐르는 방향을 정한다 —
  // 포인터 각도 → clip-path/그라디언트 계산.
  function applyFromPoint(px, py) {
    var r = card.getBoundingClientRect();
    var pivotX = r.right, pivotY = r.top;
    var dx = pivotX - px, dy = py - pivotY;
    var distance = Math.hypot(dx, dy);
    var amt = Math.max(0, Math.min(1, 1 - distance / PEEL_REACH));
    targetSize = amt * PEEL_CORNER_SIZE;
    targetDeg = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }
  function onMove(e) { human(); applyFromPoint(e.clientX, e.clientY); }
  function onLeave() { human(); targetSize = 0; }
  zone.addEventListener('pointermove', onMove);
  zone.addEventListener('pointerleave', onLeave);
  card.addEventListener('focus', function () { human(); applyFromPoint(card.getBoundingClientRect().left, card.getBoundingClientRect().top); });
  card.addEventListener('blur', function () { human(); targetSize = 0; });

  var last = 0;
  function autoAdvance(ts) {
    if (!last) last = ts;
    var r = card.getBoundingClientRect();
    var t = ((ts - last) % ORBIT_MS) / ORBIT_MS;
    var angle = t * Math.PI * 2;
    var px = r.right - 26 + Math.cos(angle) * 30;
    var py = r.top + 26 + Math.sin(angle) * 30;
    applyFromPoint(px, py);
  }

  function loop(ts) {
    if (isDemo && !reduce) autoAdvance(ts);
    if (reduce) { shownSize = targetSize; shownDeg = targetDeg; }
    else {
      shownSize += (targetSize - shownSize) * LERP_RATE;
      shownDeg += (targetDeg - shownDeg) * LERP_RATE;
    }
    card.style.setProperty('--peel-size', shownSize.toFixed(2) + 'px');
    shade.style.setProperty('--peel-deg', shownDeg.toFixed(1) + 'deg');
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
