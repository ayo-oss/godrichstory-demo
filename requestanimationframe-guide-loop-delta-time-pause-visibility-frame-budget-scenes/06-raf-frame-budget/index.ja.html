<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フレーム予算バー — 作業量を上げながら16.7msを守る — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="デモの舞台 — SpaceかEnterで一時停止、Rで最初から、左右の矢印キーで計算量の段階を選ぶ">
    <canvas class="ez__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="フレームごとの計算量を上げながら、1フレームに使った時間の棒が16.7msの予算線を越える点を見る場面"></canvas>
  </div>
  <p class="ez__status" data-role="status" aria-live="off">場面の準備</p>
  <div class="ez__ctrl">
    <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
  </div>
  <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function main(root) {
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 파스텔 팔레트 — 바탕은 짙은 자두색, 상자는 연한 색, 글자는 연한 색 또는 짙은 잉크
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    const ROSE = [244, 162, 186];
    const MINT = [148, 212, 182];
    const SKY = [150, 192, 244];
    const SUN = [250, 218, 146];
    const LILAC = [196, 176, 244];
    const NEU = [236, 230, 250];
    const BGC = [46, 42, 68];
    const PANEL = [62, 57, 92];
    const GRID = [92, 86, 124];
    const DIM = [196, 190, 224];
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    function n0(v) { return String(Math.round(v)); }
    // ── 무대 요소
    const rootEl = root;
    const canvasEl = rootEl.querySelector('[data-role="canvas"]');
    const padEl = rootEl.querySelector('[data-role="pad"]');
    const pauseEl = rootEl.querySelector('[data-role="pause"]');
    const statusEl = rootEl.querySelector('[data-role="status"]');
    const doneEl = rootEl.querySelector('[data-role="done"]');
    const actEl = rootEl.querySelector('[data-role="act"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !doneEl || !statusEl) {
        return function () { };
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pad = padEl;
    const pauseBtn = pauseEl;
    const doneP = doneEl;
    const statusP = statusEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const UI_FONT = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    const CODE_FONT = 'ui-monospace, "Cascadia Mono", Consolas, "Noto Sans KR", monospace';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 계산은 늘 480×300 이고 화면 배율만 이 값
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function disc(x, y, r, c, a) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, c, a, w) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = w;
        ctx.stroke();
    }
    function seg(x1, y1, x2, y2, c, a, w) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = w;
        ctx.lineCap = 'round';
        ctx.stroke();
    }
    function dash(x1, y1, x2, y2, c, a) {
        ctx.setLineDash([3, 3]);
        seg(x1, y1, x2, y2, c, a, 1);
        ctx.setLineDash([]);
    }
    // 글자 — maxW 가 있으면 그 폭에 들어가도록 글자 크기를 줄인다(문구가 로케일마다 길이가 달라서)
    function text(s, x, y, c, px, weight, align, maxW, mono) {
        const face = mono ? CODE_FONT : UI_FONT;
        let size = px;
        ctx.font = weight + ' ' + size + 'px ' + face;
        if (maxW !== undefined) {
            while (size > 8 && ctx.measureText(s).width > maxW) {
                size -= 0.5;
                ctx.font = weight + ' ' + size + 'px ' + face;
            }
        }
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, 1);
        ctx.fillText(s, x, y);
    }
    // 아래쪽 눈금 알약들 — 상수 이름과 지금 값
    function chips(list) {
        const y = H - 28;
        let x = 10;
        for (let i = 0; i < list.length; i += 1) {
            const label = list[i][0] + ' ' + list[i][1];
            ctx.font = '700 10px ' + CODE_FONT;
            const w = ctx.measureText(label).width + 16;
            box(x, y, w, 18, 9, NEU, 0.96);
            text(label, x + w / 2, y + 9.5, INK, 10, 700, 'center', undefined, true);
            x += w + 6;
        }
    }
    // 가로 막대 — 바탕 위에 frac(0 에서 1) 만큼 채우고 끝에 머리를 단다
    function bar(x, y, w, h, frac, c, a) {
        box(x, y, w, h, h / 2, PANEL, 1);
        if (frac > 0) {
            const fw = Math.max(h, w * clamp(frac, 0, 1));
            box(x, y, fw, h, h / 2, c, a);
            disc(x + fw - h / 2, y + h / 2, h / 2 - 2.5, PAPER, 1);
        }
    }
    function lane(periodMs) { return { period: periodMs, next: periodMs }; }
    function runLane(l, nowMs, cb) {
        let n = 0;
        while (l.next <= nowMs && n < 400) {
            cb(l.period, l.next);
            l.next += l.period;
            n += 1;
        }
        return n;
    }
    // ── 시간·상태·낭독
    // sceneT = 장면 시간(초). 一時停止·탭 숨김·간격 폭주 구간은 더하지 않는다
    let sceneT = 0;
    let lap = 0;
    let paused = false;
    let still = false;
    let settling = false;
    let holdFlag = false;
    let rawGap = 0;
    let lastStatus = '';
    let lastMode = -9;
    // 프레임 간격이 튀어도 장면 시간이 한 번에 몰리지 않게 자른다
    const DT_MAX = 0.05;
    const timerIds = [];
    function later(fn, ms) { timerIds.push(window.setTimeout(fn, ms)); }
    function every(fn, ms) {
        const id = window.setInterval(fn, ms);
        timerIds.push(id);
        return id;
    }
    function clearTimers() {
        for (let i = 0; i < timerIds.length; i += 1) {
            window.clearTimeout(timerIds[i]);
            window.clearInterval(timerIds[i]);
        }
        timerIds.length = 0;
    }
    function pushStatus(s) {
        if (s === lastStatus) {
            return;
        }
        lastStatus = s;
        statusP.textContent = s;
    }
    function redraw() {
        ctx.clearRect(0, 0, W, H);
        box(0, 0, W, H, 0, BGC, 1);
        ctx.save();
        ctx.translate(0, 6);
        draw();
        ctx.restore();
        pushStatus(statusText());
        const m = still ? -2 : modeId();
        if (m !== lastMode) {
            lastMode = m;
            doneP.textContent = speakText();
        }
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        rafId = 0;
        if (still || paused || document.hidden) {
            return;
        }
        rawGap = lastTs < 0 ? 0 : ts - lastTs;
        const dt = lastTs < 0 ? 0 : Math.min(rawGap / 1000, DT_MAX);
        lastTs = ts;
        sceneT += dt;
        if (sceneT >= LAP_S) {
            lap += 1;
            resetScene();
        }
        advance(ts, dt);
        redraw();
        if (!holdFlag) {
            rafId = window.requestAnimationFrame(frame);
        }
    }
    function startLoop() {
        if (rafId || holdFlag) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 간격으로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    function resetScene() {
        clearTimers();
        holdFlag = false;
        sceneT = 0;
        reset();
    }
    // 움직임 줄이기 — 루프를 돌리지 않고 장면의 끝 상태를 계산해 한 장만 그린다
    function finalState() {
        stopLoop();
        settling = true;
        resetScene();
        const n = Math.round(REST_S * 60);
        for (let i = 1; i <= n; i += 1) {
            sceneT = i / 60;
            rawGap = 1000 / 60;
            advance(sceneT * 1000, 1 / 60);
        }
        settling = false;
        clearTimers();
        redraw();
    }
    function restart() {
        lap = 0;
        resetScene();
        redraw();
        if (!paused && !still) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    const off = new AbortController();
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    still = reduceQuery.matches;
    pauseBtn.addEventListener('click', function () { togglePause(); }, { signal: off.signal });
    if (actEl) {
        actEl.addEventListener('click', function () { onAction(); redraw(); }, { signal: off.signal });
    }
    pad.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            togglePause();
            return;
        }
        if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            restart();
            return;
        }
        if ((e.key === 'a' || e.key === 'A') && actEl) {
            e.preventDefault();
            onAction();
            redraw();
            return;
        }
        if (onKey(e)) {
            e.preventDefault();
            redraw();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 끝 장면 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            finalState();
        }
        else {
            restart();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        redraw();
    }, { signal: off.signal });
    // 06 — 프레임마다 하는 계산량을 단계별로 올리며, 한 프레임에 쓴 시간(실측)이 16.7ms 예산선을 넘는 지점과 넘은 뒤 프레임 간격이 늘어나는 모습을 읽는다
    const LAP_S = 3.6;
    const REST_S = 3.3;
    const BUDGET_MS = 16.7;
    // 단계별 목표 작업 시간 ms — 이 기기의 속도를 먼저 재서 같은 시간이 걸리는 반복 횟수로 바꾼다
    const LEVELS = [1, 3, 6, 10, 14, 19, 26, 34];
    const LEVEL_S = 0.35;
    const HIST = 52;
    const SCALE_MS = 48;
    let sink = 0;
    function busy(n) {
        let s = 0;
        for (let i = 0; i < n; i += 1) {
            s += Math.sin(i * 0.001) * Math.cos(i * 0.002);
        }
        sink += s;
    }
    let perMs = 0;
    let work = [];
    let gap = [];
    let level = 0;
    let manual = false;
    let overIn = [];
    let overAll = 0;
    let workN = 0;
    function calibrate() {
        if (perMs > 0) {
            return;
        }
        busy(20000);
        const t0 = performance.now();
        busy(60000);
        const el = Math.max(performance.now() - t0, 0.05);
        perMs = 60000 / el;
    }
    function reset() {
        work = [];
        gap = [];
        level = 0;
        manual = false;
        overIn = LEVELS.map(function () { return 0; });
        overAll = 0;
        if (!settling) {
            calibrate();
        }
        workN = Math.round(LEVELS[0] * (perMs > 0 ? perMs : 20000));
    }
    function advance(ts, dt) {
        void ts;
        void dt;
        if (!manual) {
            level = Math.min(LEVELS.length - 1, Math.floor(sceneT / LEVEL_S));
        }
        let w = 0;
        let g = 0;
        if (settling) {
            // 줄임 모드의 끝 상태 — 실측 대신 모델: 작업 시간은 목표 그대로, 간격은 예산과 작업 시간 중 큰 쪽
            w = LEVELS[level];
            g = Math.max(BUDGET_MS, w + 1);
        }
        else {
            workN = Math.round(LEVELS[level] * perMs);
            const t0 = performance.now();
            busy(workN);
            w = performance.now() - t0;
            g = rawGap > 0 ? rawGap : BUDGET_MS;
        }
        work.push(w);
        gap.push(g);
        if (work.length > HIST) {
            work.shift();
            gap.shift();
        }
        if (w > BUDGET_MS) {
            overIn[level] += 1;
            overAll += 1;
        }
    }
    function yOf(ms, gy, gh) { return gy + gh * (1 - clamp(ms, 0, SCALE_MS) / SCALE_MS); }
    function draw() {
        const gx = 16;
        const gy = 58;
        const gw = W - 32;
        const gh = 126;
        box(8, 40, W - 16, gh + 34, 10, [54, 49, 80], 1);
        const bw = gw / HIST;
        for (let i = 0; i < work.length; i += 1) {
            const x = gx + i * bw;
            const over = work[i] > BUDGET_MS;
            box(x + 0.5, yOf(work[i], gy, gh), bw - 1.5, gy + gh - yOf(work[i], gy, gh), 1.5, over ? ROSE : MINT, 0.95);
        }
        // 프레임 간격 선
        ctx.beginPath();
        for (let i = 0; i < gap.length; i += 1) {
            const x = gx + i * bw + bw / 2;
            if (i === 0) {
                ctx.moveTo(x, yOf(gap[i], gy, gh));
            }
            else {
                ctx.lineTo(x, yOf(gap[i], gy, gh));
            }
        }
        ctx.strokeStyle = rgba(SKY, 0.95);
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.stroke();
        dash(gx, yOf(BUDGET_MS, gy, gh), gx + gw, yOf(BUDGET_MS, gy, gh), SUN, 1);
        text('予算 16.7ms', gx + gw, yOf(BUDGET_MS, gy, gh) - 8, SUN, 10, 700, 'right', 130);
        text('棒=1フレームに使った時間 · 青い線=フレーム間隔', gx, 49, DIM, 9.5, 600, 'left', gw);
        // 단계 사다리
        const lw = (W - 16) / LEVELS.length;
        for (let i = 0; i < LEVELS.length; i += 1) {
            const x = 8 + i * lw;
            const on = i === level;
            const bad = LEVELS[i] > BUDGET_MS;
            box(x + 2, 222, lw - 4, 26, 8, on ? (bad ? ROSE : MINT) : PANEL, on ? 1 : 0.9);
            text(n0(LEVELS[i]) + 'ms', x + lw / 2, 235, on ? INK : (bad ? ROSE : DIM), 10.5, 700, 'center', lw - 6, true);
        }
        chips([['WORK_N', n0(workN / 1000) + 'k'], ['BUDGET_MS', f1(BUDGET_MS)], ['OVER_COUNT', n0(overAll)]]);
    }
    function lastGap() { return gap.length > 0 ? gap[gap.length - 1] : 0; }
    function statusText() {
        return fill('作業 {a}ms · フレーム間隔 {b}ms · 予算超過 {c}回', f1(work.length > 0 ? work[work.length - 1] : 0), f1(lastGap()), n0(overAll));
    }
    function modeId() { return LEVELS[level] > BUDGET_MS ? 1 : 0; }
    function speakText() {
        return fill('作業時間を1msから34msまで上げると、1フレームに使った時間が16.7msの予算を超えたフレームが{a}回出て、超えた段階からはフレーム間隔が作業時間だけ延びます', n0(overAll));
    }
    // 왼쪽·오른쪽 방향키 — 계산량 단계를 직접 고른다
    function onKey(e) {
        if (e.key === 'ArrowRight') {
            level = Math.min(LEVELS.length - 1, level + 1);
        }
        else if (e.key === 'ArrowLeft') {
            level = Math.max(0, level - 1);
        }
        else {
            return false;
        }
        manual = true;
        return true;
    }
    function onAction() { }
    fitCanvas();
    if (still) {
        finalState();
    }
    else {
        resetScene();
        redraw();
        startLoop();
    }
    return function () {
        stopLoop();
        clearTimers();
        off.abort();
    };
}
})();
</script>
</body>
</html>
