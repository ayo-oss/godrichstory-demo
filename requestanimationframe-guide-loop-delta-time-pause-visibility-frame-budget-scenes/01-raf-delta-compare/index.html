<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>델타 타임 — 30Hz·144Hz 두 환경에서 같은 거리 가기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, 왼쪽·오른쪽 방향키로 두 번째 줄의 주사율을 바꾼다">
    <canvas class="ez__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="30Hz 와 고른 주사율에서 프레임 수로 더하는 판과 시간 차로 더하는 판이 같은 거리를 가는 데 걸리는 시간을 나란히 보는 장면"></canvas>
  </div>
  <p class="ez__status" data-role="status" aria-live="off">장면 준비</p>
  <div class="ez__ctrl">
    <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
  </div>
  <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function main(root) {
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 파스텔 팔레트 — 바탕은 짙은 자두색, 상자는 연한 색, 글자는 연한 색 또는 짙은 잉크
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    const ROSE = [244, 162, 186];
    const MINT = [148, 212, 182];
    const SKY = [150, 192, 244];
    const SUN = [250, 218, 146];
    const LILAC = [196, 176, 244];
    const NEU = [236, 230, 250];
    const BGC = [46, 42, 68];
    const PANEL = [62, 57, 92];
    const GRID = [92, 86, 124];
    const DIM = [196, 190, 224];
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    function n0(v) { return String(Math.round(v)); }
    // ── 무대 요소
    const rootEl = root;
    const canvasEl = rootEl.querySelector('[data-role="canvas"]');
    const padEl = rootEl.querySelector('[data-role="pad"]');
    const pauseEl = rootEl.querySelector('[data-role="pause"]');
    const statusEl = rootEl.querySelector('[data-role="status"]');
    const doneEl = rootEl.querySelector('[data-role="done"]');
    const actEl = rootEl.querySelector('[data-role="act"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !doneEl || !statusEl) {
        return function () { };
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pad = padEl;
    const pauseBtn = pauseEl;
    const doneP = doneEl;
    const statusP = statusEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const UI_FONT = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    const CODE_FONT = 'ui-monospace, "Cascadia Mono", Consolas, "Noto Sans KR", monospace';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 계산은 늘 480×300 이고 화면 배율만 이 값
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function disc(x, y, r, c, a) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, c, a, w) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = w;
        ctx.stroke();
    }
    function seg(x1, y1, x2, y2, c, a, w) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = w;
        ctx.lineCap = 'round';
        ctx.stroke();
    }
    function dash(x1, y1, x2, y2, c, a) {
        ctx.setLineDash([3, 3]);
        seg(x1, y1, x2, y2, c, a, 1);
        ctx.setLineDash([]);
    }
    // 글자 — maxW 가 있으면 그 폭에 들어가도록 글자 크기를 줄인다(문구가 로케일마다 길이가 달라서)
    function text(s, x, y, c, px, weight, align, maxW, mono) {
        const face = mono ? CODE_FONT : UI_FONT;
        let size = px;
        ctx.font = weight + ' ' + size + 'px ' + face;
        if (maxW !== undefined) {
            while (size > 8 && ctx.measureText(s).width > maxW) {
                size -= 0.5;
                ctx.font = weight + ' ' + size + 'px ' + face;
            }
        }
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, 1);
        ctx.fillText(s, x, y);
    }
    // 아래쪽 눈금 알약들 — 상수 이름과 지금 값
    function chips(list) {
        const y = H - 28;
        let x = 10;
        for (let i = 0; i < list.length; i += 1) {
            const label = list[i][0] + ' ' + list[i][1];
            ctx.font = '700 10px ' + CODE_FONT;
            const w = ctx.measureText(label).width + 16;
            box(x, y, w, 18, 9, NEU, 0.96);
            text(label, x + w / 2, y + 9.5, INK, 10, 700, 'center', undefined, true);
            x += w + 6;
        }
    }
    // 가로 막대 — 바탕 위에 frac(0 에서 1) 만큼 채우고 끝에 머리를 단다
    function bar(x, y, w, h, frac, c, a) {
        box(x, y, w, h, h / 2, PANEL, 1);
        if (frac > 0) {
            const fw = Math.max(h, w * clamp(frac, 0, 1));
            box(x, y, fw, h, h / 2, c, a);
            disc(x + fw - h / 2, y + h / 2, h / 2 - 2.5, PAPER, 1);
        }
    }
    function lane(periodMs) { return { period: periodMs, next: periodMs }; }
    function runLane(l, nowMs, cb) {
        let n = 0;
        while (l.next <= nowMs && n < 400) {
            cb(l.period, l.next);
            l.next += l.period;
            n += 1;
        }
        return n;
    }
    // ── 시간·상태·낭독
    // sceneT = 장면 시간(초). 일시정지·탭 숨김·간격 폭주 구간은 더하지 않는다
    let sceneT = 0;
    let lap = 0;
    let paused = false;
    let still = false;
    let settling = false;
    let holdFlag = false;
    let rawGap = 0;
    let lastStatus = '';
    let lastMode = -9;
    // 프레임 간격이 튀어도 장면 시간이 한 번에 몰리지 않게 자른다
    const DT_MAX = 0.05;
    const timerIds = [];
    function later(fn, ms) { timerIds.push(window.setTimeout(fn, ms)); }
    function every(fn, ms) {
        const id = window.setInterval(fn, ms);
        timerIds.push(id);
        return id;
    }
    function clearTimers() {
        for (let i = 0; i < timerIds.length; i += 1) {
            window.clearTimeout(timerIds[i]);
            window.clearInterval(timerIds[i]);
        }
        timerIds.length = 0;
    }
    function pushStatus(s) {
        if (s === lastStatus) {
            return;
        }
        lastStatus = s;
        statusP.textContent = s;
    }
    function redraw() {
        ctx.clearRect(0, 0, W, H);
        box(0, 0, W, H, 0, BGC, 1);
        ctx.save();
        ctx.translate(0, 6);
        draw();
        ctx.restore();
        pushStatus(statusText());
        const m = still ? -2 : modeId();
        if (m !== lastMode) {
            lastMode = m;
            doneP.textContent = speakText();
        }
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        rafId = 0;
        if (still || paused || document.hidden) {
            return;
        }
        rawGap = lastTs < 0 ? 0 : ts - lastTs;
        const dt = lastTs < 0 ? 0 : Math.min(rawGap / 1000, DT_MAX);
        lastTs = ts;
        sceneT += dt;
        if (sceneT >= LAP_S) {
            lap += 1;
            resetScene();
        }
        advance(ts, dt);
        redraw();
        if (!holdFlag) {
            rafId = window.requestAnimationFrame(frame);
        }
    }
    function startLoop() {
        if (rafId || holdFlag) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 간격으로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    function resetScene() {
        clearTimers();
        holdFlag = false;
        sceneT = 0;
        reset();
    }
    // 움직임 줄이기 — 루프를 돌리지 않고 장면의 끝 상태를 계산해 한 장만 그린다
    function finalState() {
        stopLoop();
        settling = true;
        resetScene();
        const n = Math.round(REST_S * 60);
        for (let i = 1; i <= n; i += 1) {
            sceneT = i / 60;
            rawGap = 1000 / 60;
            advance(sceneT * 1000, 1 / 60);
        }
        settling = false;
        clearTimers();
        redraw();
    }
    function restart() {
        lap = 0;
        resetScene();
        redraw();
        if (!paused && !still) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    const off = new AbortController();
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    still = reduceQuery.matches;
    pauseBtn.addEventListener('click', function () { togglePause(); }, { signal: off.signal });
    if (actEl) {
        actEl.addEventListener('click', function () { onAction(); redraw(); }, { signal: off.signal });
    }
    pad.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            togglePause();
            return;
        }
        if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            restart();
            return;
        }
        if ((e.key === 'a' || e.key === 'A') && actEl) {
            e.preventDefault();
            onAction();
            redraw();
            return;
        }
        if (onKey(e)) {
            e.preventDefault();
            redraw();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 끝 장면 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            finalState();
        }
        else {
            restart();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        redraw();
    }, { signal: off.signal });
    // 01 — 실제 rAF 루프가 돌 때마다 30Hz·144Hz 가상 눈금을 차례로 불러, 프레임 수로 더하는 판과 시간 차로 더하는 판의 이동 거리를 나란히 잰다
    const LAP_S = 4.6;
    const REST_S = 4.4;
    const TX = 20;
    const TW = 340;
    // 프레임 한 번에 더하는 픽셀과, 시간 차 판의 초속
    const STEP_PX = 3;
    const SPEED = 110;
    const HZ_LIST = [60, 90, 120, 144, 240];
    let hzIdx = 3;
    function mkRun(hz) { return { hz: hz, l: lane(1000 / hz), fc: 0, dd: 0, fcAt: -1, ddAt: -1, ticks: [] }; }
    let runs = [mkRun(30), mkRun(HZ_LIST[hzIdx])];
    function reset() { runs = [mkRun(30), mkRun(HZ_LIST[hzIdx])]; }
    function advance(ts, dt) {
        void ts;
        void dt;
        const nowMs = sceneT * 1000;
        for (let i = 0; i < runs.length; i += 1) {
            const r = runs[i];
            runLane(r.l, nowMs, function (gap, vt) {
                // 프레임 수 판 — 간격을 모르고 한 번에 STEP_PX
                if (r.fc < TW) {
                    r.fc = Math.min(TW, r.fc + STEP_PX);
                    if (r.fc >= TW) {
                        r.fcAt = vt / 1000;
                    }
                }
                // 시간 차 판 — 초속 × 지난 시간
                if (r.dd < TW) {
                    r.dd = Math.min(TW, r.dd + SPEED * gap / 1000);
                    if (r.dd >= TW) {
                        r.ddAt = vt / 1000;
                    }
                }
                r.ticks.push(vt);
            });
            while (r.ticks.length > 0 && nowMs - r.ticks[0] > 400) {
                r.ticks.shift();
            }
        }
    }
    function lanePanel(r, gy, nowMs) {
        box(8, gy - 4, W - 16, 100, 10, [54, 49, 80], 1);
        text(fill('{a}Hz — 프레임 간격 {b}ms', String(r.hz), f1(1000 / r.hz)), TX, gy + 8, PAPER, 11, 700, 'left', 230);
        text('가상 프레임 눈금 (최근 0.4초)', W - 20, gy + 8, DIM, 9, 600, 'right', 190);
        // 가상 프레임 눈금 띠 — 144Hz 일수록 촘촘하다
        box(TX, gy + 17, TW, 7, 3.5, PANEL, 1);
        for (let i = 0; i < r.ticks.length; i += 1) {
            const x = TX + TW * (1 - (nowMs - r.ticks[i]) / 400);
            if (x >= TX) {
                seg(x, gy + 17, x, gy + 24, MINT, 0.95, 1.5);
            }
        }
        const rows = [
            [r.fc, r.fcAt, 0, '프레임 수로 더하기 — 한 번에 3px'],
            [r.dd, r.ddAt, 1, '시간 차로 더하기 — 초속 110px'],
        ];
        for (let k = 0; k < rows.length; k += 1) {
            const y = gy + 31 + k * 33;
            text(rows[k][3], TX, y + 3, DIM, 9.5, 600, 'left', TW);
            bar(TX, y + 9, TW, 14, rows[k][0] / TW, k === 0 ? ROSE : SKY, 0.95);
            const arrived = rows[k][1] >= 0;
            const label = arrived ? fill('도착 {a}초', f2(rows[k][1])) : fill('{a}px', n0(rows[k][0]));
            text(label, TX + TW + 10, y + 16, arrived ? (k === 0 ? ROSE : SKY) : PAPER, 11, 700, 'left', W - TX - TW - 18);
        }
    }
    function draw() {
        const nowMs = sceneT * 1000;
        lanePanel(runs[0], 40, nowMs);
        lanePanel(runs[1], 146, nowMs);
        chips([['FRAME_MS', f1(1000 / 30) + '/' + f1(1000 / runs[1].hz)], ['DIST_FRAME', n0(STEP_PX * 30) + '/' + n0(STEP_PX * runs[1].hz)], ['DIST_DT', n0(SPEED) + '/' + n0(SPEED)]]);
    }
    function statusText() {
        return fill('{a}초 · 프레임 수 {b}px · 시간 차 {c}px', f1(sceneT), n0(runs[1].fc), n0(runs[1].dd));
    }
    function modeId() { return runs[0].ddAt >= 0 && runs[1].fcAt >= 0 && runs[1].ddAt >= 0 ? 1 : 0; }
    function speakText() {
        const r0 = runs[0];
        const r1 = runs[1];
        const a = (v) => (v >= 0 ? f2(v) : '-');
        return fill('프레임마다 3px 를 더하면 30Hz 는 초속 {a}px, {b}Hz 는 초속 {c}px 로 달라지고, 시간 차로 더하면 둘 다 초속 110px 다. 도착 시각은 프레임 수 판이 {d}초와 {e}초, 시간 차 판이 {f}초와 {g}초다', n0(STEP_PX * 30), String(r1.hz), n0(STEP_PX * r1.hz), a(r0.fcAt), a(r1.fcAt), a(r0.ddAt), a(r1.ddAt));
    }
    // 왼쪽·오른쪽 방향키 — 두 번째 줄의 주사율을 바꾼다
    function onKey(e) {
        if (e.key === 'ArrowRight') {
            hzIdx = Math.min(HZ_LIST.length - 1, hzIdx + 1);
        }
        else if (e.key === 'ArrowLeft') {
            hzIdx = Math.max(0, hzIdx - 1);
        }
        else {
            return false;
        }
        restart();
        return true;
    }
    function onAction() { }
    fitCanvas();
    if (still) {
        finalState();
    }
    else {
        resetScene();
        redraw();
        startLoop();
    }
    return function () {
        stopLoop();
        clearTimers();
        off.abort();
    };
}
})();
</script>
</body>
</html>
