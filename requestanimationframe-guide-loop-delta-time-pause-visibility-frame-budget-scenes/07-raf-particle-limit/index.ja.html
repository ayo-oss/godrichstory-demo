<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粒子のループ — 要素数が限界に出会う点 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="デモの舞台 — SpaceかEnterで一時停止、Rで最初から、左右の矢印キーで粒子の段階を選ぶ">
    <canvas class="ez__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="粒子数を段階的に増やし、段階ごとの平均フレーム間隔と途切れたフレーム数を棒で見る場面"></canvas>
  </div>
  <p class="ez__status" data-role="status" aria-live="off">場面の準備</p>
  <div class="ez__ctrl">
    <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
  </div>
  <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function main(root) {
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 파스텔 팔레트 — 바탕은 짙은 자두색, 상자는 연한 색, 글자는 연한 색 또는 짙은 잉크
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    const ROSE = [244, 162, 186];
    const MINT = [148, 212, 182];
    const SKY = [150, 192, 244];
    const SUN = [250, 218, 146];
    const LILAC = [196, 176, 244];
    const NEU = [236, 230, 250];
    const BGC = [46, 42, 68];
    const PANEL = [62, 57, 92];
    const GRID = [92, 86, 124];
    const DIM = [196, 190, 224];
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    function n0(v) { return String(Math.round(v)); }
    // ── 무대 요소
    const rootEl = root;
    const canvasEl = rootEl.querySelector('[data-role="canvas"]');
    const padEl = rootEl.querySelector('[data-role="pad"]');
    const pauseEl = rootEl.querySelector('[data-role="pause"]');
    const statusEl = rootEl.querySelector('[data-role="status"]');
    const doneEl = rootEl.querySelector('[data-role="done"]');
    const actEl = rootEl.querySelector('[data-role="act"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !doneEl || !statusEl) {
        return function () { };
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pad = padEl;
    const pauseBtn = pauseEl;
    const doneP = doneEl;
    const statusP = statusEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const UI_FONT = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    const CODE_FONT = 'ui-monospace, "Cascadia Mono", Consolas, "Noto Sans KR", monospace';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 계산은 늘 480×300 이고 화면 배율만 이 값
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function disc(x, y, r, c, a) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, c, a, w) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = w;
        ctx.stroke();
    }
    function seg(x1, y1, x2, y2, c, a, w) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = w;
        ctx.lineCap = 'round';
        ctx.stroke();
    }
    function dash(x1, y1, x2, y2, c, a) {
        ctx.setLineDash([3, 3]);
        seg(x1, y1, x2, y2, c, a, 1);
        ctx.setLineDash([]);
    }
    // 글자 — maxW 가 있으면 그 폭에 들어가도록 글자 크기를 줄인다(문구가 로케일마다 길이가 달라서)
    function text(s, x, y, c, px, weight, align, maxW, mono) {
        const face = mono ? CODE_FONT : UI_FONT;
        let size = px;
        ctx.font = weight + ' ' + size + 'px ' + face;
        if (maxW !== undefined) {
            while (size > 8 && ctx.measureText(s).width > maxW) {
                size -= 0.5;
                ctx.font = weight + ' ' + size + 'px ' + face;
            }
        }
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, 1);
        ctx.fillText(s, x, y);
    }
    // 아래쪽 눈금 알약들 — 상수 이름과 지금 값
    function chips(list) {
        const y = H - 28;
        let x = 10;
        for (let i = 0; i < list.length; i += 1) {
            const label = list[i][0] + ' ' + list[i][1];
            ctx.font = '700 10px ' + CODE_FONT;
            const w = ctx.measureText(label).width + 16;
            box(x, y, w, 18, 9, NEU, 0.96);
            text(label, x + w / 2, y + 9.5, INK, 10, 700, 'center', undefined, true);
            x += w + 6;
        }
    }
    // 가로 막대 — 바탕 위에 frac(0 에서 1) 만큼 채우고 끝에 머리를 단다
    function bar(x, y, w, h, frac, c, a) {
        box(x, y, w, h, h / 2, PANEL, 1);
        if (frac > 0) {
            const fw = Math.max(h, w * clamp(frac, 0, 1));
            box(x, y, fw, h, h / 2, c, a);
            disc(x + fw - h / 2, y + h / 2, h / 2 - 2.5, PAPER, 1);
        }
    }
    function lane(periodMs) { return { period: periodMs, next: periodMs }; }
    function runLane(l, nowMs, cb) {
        let n = 0;
        while (l.next <= nowMs && n < 400) {
            cb(l.period, l.next);
            l.next += l.period;
            n += 1;
        }
        return n;
    }
    // ── 시간·상태·낭독
    // sceneT = 장면 시간(초). 一時停止·탭 숨김·간격 폭주 구간은 더하지 않는다
    let sceneT = 0;
    let lap = 0;
    let paused = false;
    let still = false;
    let settling = false;
    let holdFlag = false;
    let rawGap = 0;
    let lastStatus = '';
    let lastMode = -9;
    // 프레임 간격이 튀어도 장면 시간이 한 번에 몰리지 않게 자른다
    const DT_MAX = 0.05;
    const timerIds = [];
    function later(fn, ms) { timerIds.push(window.setTimeout(fn, ms)); }
    function every(fn, ms) {
        const id = window.setInterval(fn, ms);
        timerIds.push(id);
        return id;
    }
    function clearTimers() {
        for (let i = 0; i < timerIds.length; i += 1) {
            window.clearTimeout(timerIds[i]);
            window.clearInterval(timerIds[i]);
        }
        timerIds.length = 0;
    }
    function pushStatus(s) {
        if (s === lastStatus) {
            return;
        }
        lastStatus = s;
        statusP.textContent = s;
    }
    function redraw() {
        ctx.clearRect(0, 0, W, H);
        box(0, 0, W, H, 0, BGC, 1);
        ctx.save();
        ctx.translate(0, 6);
        draw();
        ctx.restore();
        pushStatus(statusText());
        const m = still ? -2 : modeId();
        if (m !== lastMode) {
            lastMode = m;
            doneP.textContent = speakText();
        }
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        rafId = 0;
        if (still || paused || document.hidden) {
            return;
        }
        rawGap = lastTs < 0 ? 0 : ts - lastTs;
        const dt = lastTs < 0 ? 0 : Math.min(rawGap / 1000, DT_MAX);
        lastTs = ts;
        sceneT += dt;
        if (sceneT >= LAP_S) {
            lap += 1;
            resetScene();
        }
        advance(ts, dt);
        redraw();
        if (!holdFlag) {
            rafId = window.requestAnimationFrame(frame);
        }
    }
    function startLoop() {
        if (rafId || holdFlag) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 간격으로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    function resetScene() {
        clearTimers();
        holdFlag = false;
        sceneT = 0;
        reset();
    }
    // 움직임 줄이기 — 루프를 돌리지 않고 장면의 끝 상태를 계산해 한 장만 그린다
    function finalState() {
        stopLoop();
        settling = true;
        resetScene();
        const n = Math.round(REST_S * 60);
        for (let i = 1; i <= n; i += 1) {
            sceneT = i / 60;
            rawGap = 1000 / 60;
            advance(sceneT * 1000, 1 / 60);
        }
        settling = false;
        clearTimers();
        redraw();
    }
    function restart() {
        lap = 0;
        resetScene();
        redraw();
        if (!paused && !still) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    const off = new AbortController();
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    still = reduceQuery.matches;
    pauseBtn.addEventListener('click', function () { togglePause(); }, { signal: off.signal });
    if (actEl) {
        actEl.addEventListener('click', function () { onAction(); redraw(); }, { signal: off.signal });
    }
    pad.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            togglePause();
            return;
        }
        if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            restart();
            return;
        }
        if ((e.key === 'a' || e.key === 'A') && actEl) {
            e.preventDefault();
            onAction();
            redraw();
            return;
        }
        if (onKey(e)) {
            e.preventDefault();
            redraw();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 끝 장면 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            finalState();
        }
        else {
            restart();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        redraw();
    }, { signal: off.signal });
    // 07 — 입자 수를 단계적으로 늘리는 실제 루프에서 단계별 평균 프레임 간격과 끊긴 프레임 수를 재서, 같은 화면이 몇 개까지 매끄러운지 상대 비교한다
    const LAP_S = 3.6;
    const REST_S = 3.4;
    const LEVELS = [500, 4000, 12000, 30000, 60000, 100000, 160000];
    const LEVEL_S = 0.4;
    const LONG_MS = 25;
    const FX = 12;
    const FY = 42;
    const FW = 284;
    const FH = 206;
    const MAXN = LEVELS[LEVELS.length - 1];
    const px = new Float32Array(MAXN);
    const py = new Float32Array(MAXN);
    const pv = new Float32Array(MAXN);
    const pd = new Float32Array(MAXN);
    // 결정적 의사 난수 — 같은 입자 분포를 매번 다시 만든다
    function seeded(i) {
        const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
        return s - Math.floor(s);
    }
    for (let i = 0; i < MAXN; i += 1) {
        px[i] = seeded(i) * FW;
        py[i] = seeded(i + 7.3) * FH;
        pv[i] = 26 + seeded(i + 3.1) * 60;
        pd[i] = (seeded(i + 9.7) - 0.5) * 16;
    }
    let level = 0;
    let manual = false;
    let sumGap = [];
    let cnt = [];
    let longs = [];
    function reset() {
        level = 0;
        manual = false;
        sumGap = LEVELS.map(function () { return 0; });
        cnt = LEVELS.map(function () { return 0; });
        longs = LEVELS.map(function () { return 0; });
    }
    function advance(ts, dt) {
        void ts;
        if (!manual) {
            level = Math.min(LEVELS.length - 1, Math.floor(sceneT / LEVEL_S));
        }
        const n = LEVELS[level];
        // 입자는 시간 차 dt 만큼만 움직인다 — 프레임 간격이 늘어도 낙하 속도는 같다
        const h = settling ? 1 / 60 : Math.min(rawGap > 0 ? rawGap / 1000 : dt, 0.1);
        for (let i = 0; i < n; i += 1) {
            py[i] += pv[i] * h;
            px[i] += pd[i] * h;
            if (py[i] > FH) {
                py[i] -= FH;
            }
            if (px[i] < 0) {
                px[i] += FW;
            }
            else if (px[i] > FW) {
                px[i] -= FW;
            }
        }
        let g = 0;
        if (settling) {
            // 줄임 모드의 끝 상태 — 실측 대신 모델: 단계마다 정해 둔 상대 간격
            g = [16.7, 16.7, 16.8, 18, 24, 34, 48][level];
        }
        else if (rawGap > 0) {
            g = rawGap;
        }
        if (g > 0) {
            sumGap[level] += g;
            cnt[level] += 1;
            if (g > LONG_MS) {
                longs[level] += 1;
            }
        }
    }
    function meanGap(i) { return cnt[i] > 0 ? sumGap[i] / cnt[i] : 0; }
    function draw() {
        box(8, 38, FW + 8, FH + 8, 10, [34, 31, 52], 1);
        const n = LEVELS[level];
        const cols = [ROSE, MINT, SKY];
        for (let k = 0; k < 3; k += 1) {
            ctx.beginPath();
            for (let i = k; i < n; i += 3) {
                const x = FX + px[i];
                const y = FY + py[i];
                ctx.moveTo(x + 1.6, y);
                ctx.arc(x, y, 1.6, 0, TAU);
            }
            ctx.fillStyle = rgba(cols[k], 0.9);
            ctx.fill();
        }
        // 오른쪽 — 단계별 평균 간격 막대와 끊긴 프레임 수
        const rx = FX + FW + 16;
        const rw = W - rx - 8;
        text('平均間隔の棒 · 途切れたフレーム', rx + rw / 2, 47, DIM, 9, 600, 'center', rw + 4);
        for (let i = 0; i < LEVELS.length; i += 1) {
            const y = 58 + i * 26.5;
            const m = meanGap(i);
            const on = i === level;
            text(f1(LEVELS[i] / 1000) + "k", rx, y + 8, on ? PAPER : DIM, 9.5, 700, 'left', 34, true);
            box(rx + 34, y + 2, rw - 34, 12, 6, PANEL, 1);
            if (m > 0) {
                box(rx + 34, y + 2, Math.max(12, (rw - 34) * clamp(m / 60, 0, 1)), 12, 6, m > 20 ? ROSE : MINT, on ? 1 : 0.8);
            }
            text(fill('{a}回途切れ', n0(longs[i])), rx + 34, y + 21, longs[i] > 0 ? ROSE : DIM, 8.5, 600, 'left', rw - 34);
        }
        chips([['PARTICLE_N', n0(n)], ['MEAN_GAP', f1(meanGap(level)) + 'ms'], ['LONG_FRAMES', n0(longs.reduce(function (a, b) { return a + b; }, 0))]]);
    }
    function statusText() {
        return fill('粒子 {a}個 · 平均間隔 {b}ms', n0(LEVELS[level]), f1(meanGap(level)));
    }
    function modeId() { return level; }
    function speakText() {
        let firstBad = -1;
        for (let i = 0; i < LEVELS.length; i += 1) {
            if (firstBad < 0 && meanGap(i) > 20) {
                firstBad = i;
            }
        }
        const at = firstBad < 0 ? '-' : n0(LEVELS[firstBad]);
        return fill('粒子を{b}個から{c}個まで増やすと、平均フレーム間隔が20msを超える最初の段階は{a}個です。数字はこの機器で測った相対比較で、機器ごとに違います', at, n0(LEVELS[0]), n0(MAXN));
    }
    // 왼쪽·오른쪽 방향키 — 입자 단계를 직접 고른다
    function onKey(e) {
        if (e.key === 'ArrowRight') {
            level = Math.min(LEVELS.length - 1, level + 1);
        }
        else if (e.key === 'ArrowLeft') {
            level = Math.max(0, level - 1);
        }
        else {
            return false;
        }
        manual = true;
        return true;
    }
    function onAction() { }
    fitCanvas();
    if (still) {
        finalState();
    }
    else {
        resetScene();
        redraw();
        startLoop();
    }
    return function () {
        stopLoop();
        clearTimers();
        off.abort();
    };
}
})();
</script>
</body>
</html>
