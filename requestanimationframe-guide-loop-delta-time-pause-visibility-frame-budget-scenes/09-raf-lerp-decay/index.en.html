<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame-Independent Decay: Correcting Scroll Inertia Lerp — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="Demo stage: Space or Enter pauses, R restarts">
    <canvas class="ez__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="Four rows comparing how long a fixed-coefficient lerp and a corrected one take to converge at 30Hz and 144Hz"></canvas>
  </div>
  <p class="ez__status" data-role="status" aria-live="off">Scene ready</p>
  <div class="ez__ctrl">
    <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
  </div>
  <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function main(root) {
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 파스텔 팔레트 — 바탕은 짙은 자두색, 상자는 연한 색, 글자는 연한 색 또는 짙은 잉크
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    const ROSE = [244, 162, 186];
    const MINT = [148, 212, 182];
    const SKY = [150, 192, 244];
    const SUN = [250, 218, 146];
    const LILAC = [196, 176, 244];
    const NEU = [236, 230, 250];
    const BGC = [46, 42, 68];
    const PANEL = [62, 57, 92];
    const GRID = [92, 86, 124];
    const DIM = [196, 190, 224];
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    function n0(v) { return String(Math.round(v)); }
    // ── 무대 요소
    const rootEl = root;
    const canvasEl = rootEl.querySelector('[data-role="canvas"]');
    const padEl = rootEl.querySelector('[data-role="pad"]');
    const pauseEl = rootEl.querySelector('[data-role="pause"]');
    const statusEl = rootEl.querySelector('[data-role="status"]');
    const doneEl = rootEl.querySelector('[data-role="done"]');
    const actEl = rootEl.querySelector('[data-role="act"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !doneEl || !statusEl) {
        return function () { };
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pad = padEl;
    const pauseBtn = pauseEl;
    const doneP = doneEl;
    const statusP = statusEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const UI_FONT = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    const CODE_FONT = 'ui-monospace, "Cascadia Mono", Consolas, "Noto Sans KR", monospace';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 계산은 늘 480×300 이고 화면 배율만 이 값
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function disc(x, y, r, c, a) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, c, a, w) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = w;
        ctx.stroke();
    }
    function seg(x1, y1, x2, y2, c, a, w) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = w;
        ctx.lineCap = 'round';
        ctx.stroke();
    }
    function dash(x1, y1, x2, y2, c, a) {
        ctx.setLineDash([3, 3]);
        seg(x1, y1, x2, y2, c, a, 1);
        ctx.setLineDash([]);
    }
    // 글자 — maxW 가 있으면 그 폭에 들어가도록 글자 크기를 줄인다(문구가 로케일마다 길이가 달라서)
    function text(s, x, y, c, px, weight, align, maxW, mono) {
        const face = mono ? CODE_FONT : UI_FONT;
        let size = px;
        ctx.font = weight + ' ' + size + 'px ' + face;
        if (maxW !== undefined) {
            while (size > 8 && ctx.measureText(s).width > maxW) {
                size -= 0.5;
                ctx.font = weight + ' ' + size + 'px ' + face;
            }
        }
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, 1);
        ctx.fillText(s, x, y);
    }
    // 아래쪽 눈금 알약들 — 상수 이름과 지금 값
    function chips(list) {
        const y = H - 28;
        let x = 10;
        for (let i = 0; i < list.length; i += 1) {
            const label = list[i][0] + ' ' + list[i][1];
            ctx.font = '700 10px ' + CODE_FONT;
            const w = ctx.measureText(label).width + 16;
            box(x, y, w, 18, 9, NEU, 0.96);
            text(label, x + w / 2, y + 9.5, INK, 10, 700, 'center', undefined, true);
            x += w + 6;
        }
    }
    // 가로 막대 — 바탕 위에 frac(0 에서 1) 만큼 채우고 끝에 머리를 단다
    function bar(x, y, w, h, frac, c, a) {
        box(x, y, w, h, h / 2, PANEL, 1);
        if (frac > 0) {
            const fw = Math.max(h, w * clamp(frac, 0, 1));
            box(x, y, fw, h, h / 2, c, a);
            disc(x + fw - h / 2, y + h / 2, h / 2 - 2.5, PAPER, 1);
        }
    }
    function lane(periodMs) { return { period: periodMs, next: periodMs }; }
    function runLane(l, nowMs, cb) {
        let n = 0;
        while (l.next <= nowMs && n < 400) {
            cb(l.period, l.next);
            l.next += l.period;
            n += 1;
        }
        return n;
    }
    // ── 시간·상태·낭독
    // sceneT = 장면 시간(초). Pause·탭 숨김·간격 폭주 구간은 더하지 않는다
    let sceneT = 0;
    let lap = 0;
    let paused = false;
    let still = false;
    let settling = false;
    let holdFlag = false;
    let rawGap = 0;
    let lastStatus = '';
    let lastMode = -9;
    // 프레임 간격이 튀어도 장면 시간이 한 번에 몰리지 않게 자른다
    const DT_MAX = 0.05;
    const timerIds = [];
    function later(fn, ms) { timerIds.push(window.setTimeout(fn, ms)); }
    function every(fn, ms) {
        const id = window.setInterval(fn, ms);
        timerIds.push(id);
        return id;
    }
    function clearTimers() {
        for (let i = 0; i < timerIds.length; i += 1) {
            window.clearTimeout(timerIds[i]);
            window.clearInterval(timerIds[i]);
        }
        timerIds.length = 0;
    }
    function pushStatus(s) {
        if (s === lastStatus) {
            return;
        }
        lastStatus = s;
        statusP.textContent = s;
    }
    function redraw() {
        ctx.clearRect(0, 0, W, H);
        box(0, 0, W, H, 0, BGC, 1);
        ctx.save();
        ctx.translate(0, 6);
        draw();
        ctx.restore();
        pushStatus(statusText());
        const m = still ? -2 : modeId();
        if (m !== lastMode) {
            lastMode = m;
            doneP.textContent = speakText();
        }
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        rafId = 0;
        if (still || paused || document.hidden) {
            return;
        }
        rawGap = lastTs < 0 ? 0 : ts - lastTs;
        const dt = lastTs < 0 ? 0 : Math.min(rawGap / 1000, DT_MAX);
        lastTs = ts;
        sceneT += dt;
        if (sceneT >= LAP_S) {
            lap += 1;
            resetScene();
        }
        advance(ts, dt);
        redraw();
        if (!holdFlag) {
            rafId = window.requestAnimationFrame(frame);
        }
    }
    function startLoop() {
        if (rafId || holdFlag) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 간격으로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    function resetScene() {
        clearTimers();
        holdFlag = false;
        sceneT = 0;
        reset();
    }
    // 움직임 줄이기 — 루프를 돌리지 않고 장면의 끝 상태를 계산해 한 장만 그린다
    function finalState() {
        stopLoop();
        settling = true;
        resetScene();
        const n = Math.round(REST_S * 60);
        for (let i = 1; i <= n; i += 1) {
            sceneT = i / 60;
            rawGap = 1000 / 60;
            advance(sceneT * 1000, 1 / 60);
        }
        settling = false;
        clearTimers();
        redraw();
    }
    function restart() {
        lap = 0;
        resetScene();
        redraw();
        if (!paused && !still) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    const off = new AbortController();
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    still = reduceQuery.matches;
    pauseBtn.addEventListener('click', function () { togglePause(); }, { signal: off.signal });
    if (actEl) {
        actEl.addEventListener('click', function () { onAction(); redraw(); }, { signal: off.signal });
    }
    pad.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            togglePause();
            return;
        }
        if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            restart();
            return;
        }
        if ((e.key === 'a' || e.key === 'A') && actEl) {
            e.preventDefault();
            onAction();
            redraw();
            return;
        }
        if (onKey(e)) {
            e.preventDefault();
            redraw();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 끝 장면 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            finalState();
        }
        else {
            restart();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        redraw();
    }, { signal: off.signal });
    // 09 — 매 프레임 계수를 고정한 lerp 와 1-exp(-k·dt) 로 보정한 lerp 가, 가상 30Hz·144Hz 에서 목표까지 수렴하는 시간을 실제 rAF 루프 위에서 잰다
    const LAP_S = 5.4;
    const REST_S = 5.2;
    const K_FRAME = 0.12;
    const LERP_K = 7;
    const POS_A = 54;
    const POS_B = 404;
    const JUMPS = [0.4, 2.2, 4.0];
    function nm(v) { return v >= 0 ? n0(v) : '—'; }
    function nms(v) { return v >= 0 ? n0(v) + 'ms' : '—'; }
    function mkCur(hz, corr) {
        return { hz: hz, corr: corr, l: lane(1000 / hz), x: POS_A, target: POS_A, t0: -1, convMs: -1, done: true, trail: [], ji: 0 };
    }
    let rows = [mkCur(30, false), mkCur(30, true), mkCur(144, false), mkCur(144, true)];
    function reset() {
        rows = [mkCur(30, false), mkCur(30, true), mkCur(144, false), mkCur(144, true)];
    }
    function advance(ts, dt) {
        void ts;
        void dt;
        const nowMs = sceneT * 1000;
        for (let i = 0; i < rows.length; i += 1) {
            const c = rows[i];
            runLane(c.l, nowMs, function (gap, vtm) {
                // 가상 눈금이 점프 시각을 지나는 순간 목표를 옮긴다 — 실제 프레임 시각과 상관없이 같은 값이 나온다
                if (c.ji < JUMPS.length && vtm >= JUMPS[c.ji] * 1000) {
                    c.target = c.ji % 2 === 0 ? POS_B : POS_A;
                    c.t0 = JUMPS[c.ji] * 1000;
                    c.done = false;
                    c.ji += 1;
                }
                // 보정 판은 프레임 간격(초)으로 계수를 만들고, 고정 판은 프레임마다 같은 계수를 쓴다
                const k = c.corr ? 1 - Math.exp(-LERP_K * gap / 1000) : K_FRAME;
                c.x += (c.target - c.x) * k;
                if (!c.done && Math.abs(c.x - c.target) < 1) {
                    c.done = true;
                    c.convMs = vtm - c.t0;
                }
            });
            c.trail.push(c.x);
            if (c.trail.length > 14) {
                c.trail.shift();
            }
        }
    }
    function draw() {
        for (let i = 0; i < rows.length; i += 1) {
            const c = rows[i];
            const y = 40 + i * 57;
            const col = c.corr ? LILAC : SUN;
            box(8, y, W - 16, 52, 10, [54, 49, 80], 1);
            text(fill(c.corr ? '{a}Hz: coefficient corrected by 1-exp(-k·dt)' : '{a}Hz: same coefficient 0.12 every frame', String(c.hz)), 20, y + 11, PAPER, 10.5, 700, 'left', 290);
            const label = c.convMs >= 0 ? fill('Converged {a}ms', n0(c.convMs)) : 'Following';
            text(label, W - 20, y + 11, c.convMs >= 0 ? col : DIM, 10.5, 700, 'right', 150);
            const ly = y + 33;
            seg(POS_A, ly, POS_B, ly, GRID, 1, 2);
            // 목표까지 남은 거리 띠 — 줄어드는 모양이 곡선이다
            box(Math.min(c.x, c.target), ly - 8, Math.abs(c.target - c.x), 16, 6, col, 0.22);
            ring(c.target, ly, 11, PAPER, 0.9, 1.5);
            for (let k = 0; k < c.trail.length; k += 1) {
                disc(c.trail[k], ly, 3 + 5 * (k / c.trail.length), col, 0.1 + 0.28 * (k / c.trail.length));
            }
            box(c.x - 11, ly - 9, 22, 18, 6, col, 1);
        }
        chips([['LERP_K', n0(LERP_K)], ['CONVERGE_MS', nm(rows[0].convMs) + '/' + nm(rows[2].convMs) + '/' + nm(rows[1].convMs)], ['DT', f1(1000 / 30) + '/' + f1(1000 / 144)]]);
    }
    function statusText() {
        return fill('Fixed {a} · {b} / corrected {c} · {d}', nms(rows[0].convMs), nms(rows[2].convMs), nms(rows[1].convMs), nms(rows[3].convMs));
    }
    function modeId() { return rows[0].ji; }
    function speakText() {
        return fill('The fixed-coefficient lerp splits into {a} at 30Hz and {b} at 144Hz, while the lerp corrected with 1-exp(-k·dt) takes {c} and {d}, nearly the same', nms(rows[0].convMs), nms(rows[2].convMs), nms(rows[1].convMs), nms(rows[3].convMs));
    }
    function onKey(e) { void e; return false; }
    function onAction() { }
    fitCanvas();
    if (still) {
        finalState();
    }
    else {
        resetScene();
        redraw();
        startLoop();
    }
    return function () {
        stopLoop();
        clearTimers();
        off.abort();
    };
}
})();
</script>
</body>
</html>
