<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>탭 숨김 — 복귀 순간의 시계 점프 막기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, A 키로 탭 숨김을 다시 흉내 낸다">
    <canvas class="ez__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="탭이 숨었다 돌아올 때 제한 없는 루프는 한 프레임에 크게 건너뛰고 간격을 제한한 루프는 건너뛰지 않는 장면"></canvas>
  </div>
  <p class="ez__status" data-role="status" aria-live="off">장면 준비</p>
  <div class="ez__ctrl">
    <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
    <button class="ez__pause" data-role="act" type="button">탭 숨김 흉내</button>
  </div>
  <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function main(root) {
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 파스텔 팔레트 — 바탕은 짙은 자두색, 상자는 연한 색, 글자는 연한 색 또는 짙은 잉크
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    const ROSE = [244, 162, 186];
    const MINT = [148, 212, 182];
    const SKY = [150, 192, 244];
    const SUN = [250, 218, 146];
    const LILAC = [196, 176, 244];
    const NEU = [236, 230, 250];
    const BGC = [46, 42, 68];
    const PANEL = [62, 57, 92];
    const GRID = [92, 86, 124];
    const DIM = [196, 190, 224];
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    function n0(v) { return String(Math.round(v)); }
    // ── 무대 요소
    const rootEl = root;
    const canvasEl = rootEl.querySelector('[data-role="canvas"]');
    const padEl = rootEl.querySelector('[data-role="pad"]');
    const pauseEl = rootEl.querySelector('[data-role="pause"]');
    const statusEl = rootEl.querySelector('[data-role="status"]');
    const doneEl = rootEl.querySelector('[data-role="done"]');
    const actEl = rootEl.querySelector('[data-role="act"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !doneEl || !statusEl) {
        return function () { };
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pad = padEl;
    const pauseBtn = pauseEl;
    const doneP = doneEl;
    const statusP = statusEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const UI_FONT = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    const CODE_FONT = 'ui-monospace, "Cascadia Mono", Consolas, "Noto Sans KR", monospace';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 계산은 늘 480×300 이고 화면 배율만 이 값
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function disc(x, y, r, c, a) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, c, a, w) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = w;
        ctx.stroke();
    }
    function seg(x1, y1, x2, y2, c, a, w) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = w;
        ctx.lineCap = 'round';
        ctx.stroke();
    }
    function dash(x1, y1, x2, y2, c, a) {
        ctx.setLineDash([3, 3]);
        seg(x1, y1, x2, y2, c, a, 1);
        ctx.setLineDash([]);
    }
    // 글자 — maxW 가 있으면 그 폭에 들어가도록 글자 크기를 줄인다(문구가 로케일마다 길이가 달라서)
    function text(s, x, y, c, px, weight, align, maxW, mono) {
        const face = mono ? CODE_FONT : UI_FONT;
        let size = px;
        ctx.font = weight + ' ' + size + 'px ' + face;
        if (maxW !== undefined) {
            while (size > 8 && ctx.measureText(s).width > maxW) {
                size -= 0.5;
                ctx.font = weight + ' ' + size + 'px ' + face;
            }
        }
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, 1);
        ctx.fillText(s, x, y);
    }
    // 아래쪽 눈금 알약들 — 상수 이름과 지금 값
    function chips(list) {
        const y = H - 28;
        let x = 10;
        for (let i = 0; i < list.length; i += 1) {
            const label = list[i][0] + ' ' + list[i][1];
            ctx.font = '700 10px ' + CODE_FONT;
            const w = ctx.measureText(label).width + 16;
            box(x, y, w, 18, 9, NEU, 0.96);
            text(label, x + w / 2, y + 9.5, INK, 10, 700, 'center', undefined, true);
            x += w + 6;
        }
    }
    // 가로 막대 — 바탕 위에 frac(0 에서 1) 만큼 채우고 끝에 머리를 단다
    function bar(x, y, w, h, frac, c, a) {
        box(x, y, w, h, h / 2, PANEL, 1);
        if (frac > 0) {
            const fw = Math.max(h, w * clamp(frac, 0, 1));
            box(x, y, fw, h, h / 2, c, a);
            disc(x + fw - h / 2, y + h / 2, h / 2 - 2.5, PAPER, 1);
        }
    }
    function lane(periodMs) { return { period: periodMs, next: periodMs }; }
    function runLane(l, nowMs, cb) {
        let n = 0;
        while (l.next <= nowMs && n < 400) {
            cb(l.period, l.next);
            l.next += l.period;
            n += 1;
        }
        return n;
    }
    // ── 시간·상태·낭독
    // sceneT = 장면 시간(초). 일시정지·탭 숨김·간격 폭주 구간은 더하지 않는다
    let sceneT = 0;
    let lap = 0;
    let paused = false;
    let still = false;
    let settling = false;
    let holdFlag = false;
    let rawGap = 0;
    let lastStatus = '';
    let lastMode = -9;
    // 프레임 간격이 튀어도 장면 시간이 한 번에 몰리지 않게 자른다
    const DT_MAX = 0.05;
    const timerIds = [];
    function later(fn, ms) { timerIds.push(window.setTimeout(fn, ms)); }
    function every(fn, ms) {
        const id = window.setInterval(fn, ms);
        timerIds.push(id);
        return id;
    }
    function clearTimers() {
        for (let i = 0; i < timerIds.length; i += 1) {
            window.clearTimeout(timerIds[i]);
            window.clearInterval(timerIds[i]);
        }
        timerIds.length = 0;
    }
    function pushStatus(s) {
        if (s === lastStatus) {
            return;
        }
        lastStatus = s;
        statusP.textContent = s;
    }
    function redraw() {
        ctx.clearRect(0, 0, W, H);
        box(0, 0, W, H, 0, BGC, 1);
        ctx.save();
        ctx.translate(0, 6);
        draw();
        ctx.restore();
        pushStatus(statusText());
        const m = still ? -2 : modeId();
        if (m !== lastMode) {
            lastMode = m;
            doneP.textContent = speakText();
        }
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        rafId = 0;
        if (still || paused || document.hidden) {
            return;
        }
        rawGap = lastTs < 0 ? 0 : ts - lastTs;
        const dt = lastTs < 0 ? 0 : Math.min(rawGap / 1000, DT_MAX);
        lastTs = ts;
        sceneT += dt;
        if (sceneT >= LAP_S) {
            lap += 1;
            resetScene();
        }
        advance(ts, dt);
        redraw();
        if (!holdFlag) {
            rafId = window.requestAnimationFrame(frame);
        }
    }
    function startLoop() {
        if (rafId || holdFlag) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 간격으로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    function resetScene() {
        clearTimers();
        holdFlag = false;
        sceneT = 0;
        reset();
    }
    // 움직임 줄이기 — 루프를 돌리지 않고 장면의 끝 상태를 계산해 한 장만 그린다
    function finalState() {
        stopLoop();
        settling = true;
        resetScene();
        const n = Math.round(REST_S * 60);
        for (let i = 1; i <= n; i += 1) {
            sceneT = i / 60;
            rawGap = 1000 / 60;
            advance(sceneT * 1000, 1 / 60);
        }
        settling = false;
        clearTimers();
        redraw();
    }
    function restart() {
        lap = 0;
        resetScene();
        redraw();
        if (!paused && !still) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    const off = new AbortController();
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    still = reduceQuery.matches;
    pauseBtn.addEventListener('click', function () { togglePause(); }, { signal: off.signal });
    if (actEl) {
        actEl.addEventListener('click', function () { onAction(); redraw(); }, { signal: off.signal });
    }
    pad.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            togglePause();
            return;
        }
        if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            restart();
            return;
        }
        if ((e.key === 'a' || e.key === 'A') && actEl) {
            e.preventDefault();
            onAction();
            redraw();
            return;
        }
        if (onKey(e)) {
            e.preventDefault();
            redraw();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 끝 장면 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            finalState();
        }
        else {
            restart();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        redraw();
    }, { signal: off.signal });
    // 04 — 탭이 숨는 동안 rAF 는 멈춘다. 같은 타임스탬프로 움직이는 두 루프 중 하나는 복귀 첫 프레임에 간격이 폭주하고, 하나는 최대 간격 제한과 시계 재설정으로 막는다
    const LAP_S = 4.4;
    const REST_S = 4.2;
    const SP = 100;
    const TX = 20;
    const TW = 440;
    const HIDE_AT = 0.9;
    const HIDDEN_MS = 1200;
    const HIST = 44;
    let naive = { x: 0, last: -1, jump: 0, from: -1, to: -1 };
    let guard = { x: 0, last: -1, jump: 0, from: -1, to: -1 };
    let histN = [];
    let histG = [];
    let hidden = false;
    let hideStartMs = 0;
    let hiddenDone = false;
    let resumed = false;
    let maxJump = 0;
    let lastDtN = 0;
    function reset() {
        naive = { x: 0, last: -1, jump: 0, from: -1, to: -1 };
        guard = { x: 0, last: -1, jump: 0, from: -1, to: -1 };
        histN = [];
        histG = [];
        hidden = false;
        hiddenDone = false;
        resumed = false;
        maxJump = 0;
        lastDtN = 0;
    }
    function wrap(v) { return ((v % TW) + TW) % TW; }
    // 탭을 숨긴다 — 실제로 requestAnimationFrame 을 취소해 두 루프를 모두 멈추고, 정해진 시간 뒤 다시 건다
    function hideNow() {
        if (hidden) {
            return;
        }
        hidden = true;
        hiddenDone = true;
        hideStartMs = performance.now();
        holdFlag = true;
        stopLoop();
        every(function () { redraw(); }, 100);
        later(function () {
            hidden = false;
            holdFlag = false;
            resumed = true;
            clearTimers();
            if (!paused && !still) {
                startLoop();
            }
        }, HIDDEN_MS);
    }
    function advance(ts, dt) {
        void dt;
        if (settling) {
            // 줄임 모드의 끝 상태 — 숨김 구간을 건너뛴 모델: 복귀 첫 프레임의 간격을 계산식으로 놓는다
            if (!hiddenDone && sceneT >= HIDE_AT) {
                hiddenDone = true;
                const jumpPx = SP * (HIDDEN_MS / 1000);
                naive.from = naive.x;
                naive.x = wrap(naive.x + jumpPx);
                naive.to = naive.x;
                naive.jump = jumpPx;
                maxJump = jumpPx;
                lastDtN = HIDDEN_MS;
                histN.push(HIDDEN_MS);
                histG.push(DT_MAX * 1000);
                guard.x = wrap(guard.x + SP * DT_MAX);
            }
            if (naive.last < 0) {
                naive.last = ts;
                guard.last = ts;
                return;
            }
            naive.x = wrap(naive.x + SP * dt);
            guard.x = wrap(guard.x + SP * dt);
            histN.push(dt * 1000);
            histG.push(dt * 1000);
            if (histN.length > HIST) {
                histN.shift();
                histG.shift();
            }
            return;
        }
        if (naive.last < 0) {
            naive.last = ts;
            guard.last = ts;
        }
        if (resumed) {
            // 시계 재설정 — 돌아온 첫 프레임의 기준 시각을 지금으로
            guard.last = ts;
            resumed = false;
        }
        const dN = (ts - naive.last) / 1000;
        const dG = Math.min((ts - guard.last) / 1000, DT_MAX);
        naive.last = ts;
        guard.last = ts;
        if (dN > 0.3) {
            naive.from = naive.x;
            naive.jump = SP * dN;
            naive.x = wrap(naive.x + SP * dN);
            naive.to = naive.x;
            maxJump = Math.max(maxJump, naive.jump);
        }
        else {
            naive.x = wrap(naive.x + SP * dN);
        }
        guard.x = wrap(guard.x + SP * dG);
        lastDtN = dN * 1000;
        histN.push(dN * 1000);
        histG.push(dG * 1000);
        if (histN.length > HIST) {
            histN.shift();
            histG.shift();
        }
        if (!hiddenDone && sceneT >= HIDE_AT) {
            hideNow();
        }
    }
    function lanePanel(y, title, b, c) {
        box(8, y, W - 16, 52, 10, [54, 49, 80], 1);
        text(title, 20, y + 11, PAPER, 10.5, 700, 'left', 300);
        box(TX, y + 24, TW, 20, 10, PANEL, 1);
        // 건너뛴 구간 표시 — 복귀 첫 프레임에 한 번에 지나간 픽셀
        if (b.from >= 0 && b.to > b.from) {
            box(TX + b.from, y + 24, b.to - b.from, 20, 6, SUN, 0.35);
        }
        disc(TX + b.x, y + 34, 9, c, 1);
        if (b.jump > 0) {
            text(fill('한 프레임에 +{a}px 점프', n0(b.jump)), W - 20, y + 11, SUN, 10.5, 700, 'right', 200);
        }
        else {
            text('점프 없음', W - 20, y + 11, DIM, 10.5, 700, 'right', 160);
        }
    }
    function historyChart() {
        const gx = 14;
        const gy = 156;
        const gw = W - 28;
        const gh = 92;
        box(8, gy - 10, W - 16, gh + 20, 10, [54, 49, 80], 1);
        const top = 100;
        const yOf = (ms) => gy + gh - (Math.min(ms, top) / top) * gh;
        dash(gx, yOf(DT_MAX * 1000), gx + gw, yOf(DT_MAX * 1000), SUN, 0.9);
        text('프레임 간격 상한 50ms', gx + gw, yOf(DT_MAX * 1000) - 7, SUN, 9, 700, 'right', 170);
        const bw = gw / HIST;
        for (let i = 0; i < histN.length; i += 1) {
            const x = gx + i * bw;
            const hn = histN[i];
            const hg = histG[i];
            box(x + 0.5, yOf(hn), bw * 0.46, gy + gh - yOf(hn), 1.5, ROSE, 0.95);
            box(x + bw * 0.5, yOf(hg), bw * 0.46, gy + gh - yOf(hg), 1.5, MINT, 0.95);
            if (hn > top) {
                text(n0(hn), x + bw * 0.5, gy + 9, PAPER, 9.5, 700, 'center', 40, true);
            }
        }
        text('분홍 = 제한 없음 · 민트 = 제한과 재설정', gx + 2, gy - 1, DIM, 9, 600, 'left', 240);
    }
    function draw() {
        lanePanel(40, '제한 없음 — 타임스탬프 차를 그대로 쓴다', naive, ROSE);
        lanePanel(96, '최대 간격 제한 + 복귀 시 시계 재설정', guard, MINT);
        historyChart();
        if (hidden) {
            const el = performance.now() - hideStartMs;
            box(0, -6, W, H + 6, 0, INK, 0.93);
            text('탭 숨김 — rAF 정지', W / 2, 118, PAPER, 17, 700, 'center', W - 40);
            text(fill('{a}ms 동안 콜백 0번', n0(el)), W / 2, 150, SUN, 14, 700, 'center', W - 40, true);
            bar(90, 170, 300, 12, el / HIDDEN_MS, SUN, 0.95);
        }
        chips([['DT_MAX', n0(DT_MAX * 1000) + 'ms'], ['JUMP_PX', n0(maxJump)], ['HIDDEN_MS', n0(HIDDEN_MS)]]);
    }
    function statusText() {
        return hidden
            ? '탭이 숨어 있다 — 콜백이 멈췄다'
            : fill('지금 프레임 간격 {a}ms · 점프 {b}px', n0(lastDtN), n0(maxJump));
    }
    function modeId() { return hidden ? 1 : (maxJump > 0 ? 2 : 0); }
    function speakText() {
        return fill('탭이 {a}ms 숨었다가 돌아오면 제한 없는 판은 한 프레임에 {b}px 를 건너뛰고, 최대 간격 50ms 로 자르고 시계를 다시 맞춘 판은 건너뛰지 않는다', n0(HIDDEN_MS), n0(SP * HIDDEN_MS / 1000));
    }
    function onKey(e) { void e; return false; }
    // 지금 탭 숨김을 흉내 낸다 (A 키)
    function onAction() {
        if (!settling && !still) {
            hideNow();
        }
    }
    fitCanvas();
    if (still) {
        finalState();
    }
    else {
        resetScene();
        redraw();
        startLoop();
    }
    return function () {
        stopLoop();
        clearTimers();
        off.abort();
    };
}
})();
</script>
