<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>四段階の値が配線を伝って回る信号回路オートマトン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="rv is-demo" tabindex="0" role="button" aria-label="信号回路進行中 — クリックまたはスペースキーで停止、R で再シード">
    <canvas class="rv__cv" width="480" height="300"></canvas>
    <p class="rv__hint">クリックまたはスペースキーで停止、R で再シード</p>
  </div>
</main>
<script>
(function(){
  'use strict';
  // 395-09(진행률 채움 로더)와 다른 축: 네 단계 상태 값이 미리 그려둔 전선을 타고 흐르는 계산이 주인공.
  // 매 세대 이웃 신호머리 수를 세어 전체를 다시 계산하고 fillRect 로 그린다 — 속성 트윈 없음.

  function makeLcg(seed){
    let s = seed >>> 0;
    return function(){
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  const W = 480, H = 300;
  const CELL = 10, COLS = W / CELL, ROWS = H / CELL;
  const PAPER = '#fff7e6';
  const WIRE_COLOR = '#17141a';
  const HEAD_COLOR = '#c89a8f';
  const TAIL_COLOR = '#d2c7a4';

  let SEED = 80801;
  let rnd = makeLcg(SEED);

  const EMPTY = 0, WIRE = 1, HEAD = 2, TAIL = 3;
  const HEAD_NEIGHBORS_MIN = 1;
  const HEAD_NEIGHBORS_MAX = 2; // 변형 08 대상 — 전선이 신호머리로 바뀌는 이웃 신호머리 수 상한

  let grid = new Uint8Array(COLS * ROWS);
  let next = new Uint8Array(COLS * ROWS);

  function idx(x, y){ return y * COLS + x; }

  // 고정 회로: 촘촘한 지그재그 전선 — 행 간격 2칸(빈 행 하나 사이)이라 인접 가닥끼리 대각으로 겹치지 않는다.
  const path = [];
  (function buildPath(){
    let dir = 1;
    for (let r = 0; r < 13; r++){
      const y = 3 + r * 2;
      if (dir === 1){
        for (let x = 4; x <= 43; x++) path.push([x, y]);
      } else {
        for (let x = 43; x >= 4; x--) path.push([x, y]);
      }
      if (r < 12){
        const jointX = (dir === 1) ? 43 : 4;
        path.push([jointX, y + 1]);
        dir *= -1;
      }
    }
  })();

  function buildCircuit(gap, offset){
    grid.fill(EMPTY);
    for (let i = 0; i < path.length; i++){
      grid[idx(path[i][0], path[i][1])] = WIRE;
    }
    for (let i = offset; i + 1 < path.length; i += gap){
      grid[idx(path[i][0], path[i][1])] = TAIL;
      grid[idx(path[i + 1][0], path[i + 1][1])] = HEAD;
    }
  }

  function neighborHeadCount(x, y){
    let n = 0;
    for (let dy = -1; dy <= 1; dy++){
      for (let dx = -1; dx <= 1; dx++){
        if (dx === 0 && dy === 0) continue;
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
        if (grid[idx(nx, ny)] === HEAD) n++;
      }
    }
    return n;
  }

  function step(){
    for (let y = 0; y < ROWS; y++){
      for (let x = 0; x < COLS; x++){
        const i = idx(x, y);
        const s = grid[i];
        let ns = s;
        if (s === WIRE){
          const hc = neighborHeadCount(x, y);
          if (hc >= HEAD_NEIGHBORS_MIN && hc <= HEAD_NEIGHBORS_MAX) ns = HEAD;
        } else if (s === HEAD){
          ns = TAIL;
        } else if (s === TAIL){
          ns = WIRE;
        }
        next[i] = ns;
      }
    }
    const tmp = grid; grid = next; next = tmp;
  }

  const cvEl = document.querySelector('.rv__cv');
  const ctx = cvEl.getContext('2d');
  const rootEl = document.querySelector('.rv');

  function render(){
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    for (let y = 0; y < ROWS; y++){
      for (let x = 0; x < COLS; x++){
        const s = grid[idx(x, y)];
        if (s === EMPTY) continue;
        ctx.fillStyle = s === WIRE ? WIRE_COLOR : (s === HEAD ? HEAD_COLOR : TAIL_COLOR);
        ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 1, CELL - 1);
      }
    }
  }

  const ARIA_PLAY = '信号回路進行中 — クリックまたはスペースキーで停止、R で再シード';
  const ARIA_PAUSE = '信号回路停止中 — クリックまたはスペースキーで再生、R で再シード';

  function updateAria(){
    rootEl.setAttribute('aria-label', paused ? ARIA_PAUSE : ARIA_PLAY);
  }

  let paused = false;
  const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

  function human(){ rootEl.classList.remove('is-demo'); }

  function reseed(){
    SEED = (SEED * 1103515245 + 12345) >>> 0;
    rnd = makeLcg(SEED || 1);
    const gap = 10 + Math.floor(rnd() * 6);
    const offset = Math.floor(rnd() * gap);
    buildCircuit(gap, offset);
  }

  function togglePause(){
    paused = !paused;
    updateAria();
  }

  function onActivate(e){
    if (e.type === 'keydown'){
      if (e.key === 'r' || e.key === 'R'){
        human();
        reseed();
        render();
        return;
      }
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
    }
    human();
    if (reduceMQ.matches){
      step();
      render();
    } else {
      togglePause();
    }
  }

  function onKey(e){
    if (e.key === 'r' || e.key === 'R' || e.key === 'Enter' || e.key === ' '){
      onActivate(e);
    }
  }

  const GEN_INTERVAL_MS = 45;
  let acc = 0, last = 0;

  function frame(now){
    if (!reduceMQ.matches){
      if (!last) last = now;
      const dt = now - last;
      last = now;
      if (!paused){
        acc += dt;
        while (acc >= GEN_INTERVAL_MS){
          step();
          acc -= GEN_INTERVAL_MS;
        }
        render();
      }
      requestAnimationFrame(frame);
    }
  }

  function onResize(){ render(); }

  rootEl.addEventListener('click', onActivate);
  rootEl.addEventListener('keydown', onKey);
  window.addEventListener('resize', onResize);

  buildCircuit(12, 0);
  updateAria();
  render();
  if (!reduceMQ.matches){
    requestAnimationFrame(frame);
  }

})();
</script>
</body>
</html>
