<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>세대 나이 값만큼 색이 바래는 잔상 오토마타 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="rv is-demo" tabindex="0" role="button" aria-label="나이 잔상 진행 중 — 클릭하거나 스페이스바로 정지, R 로 재시드">
    <canvas class="rv__cv" width="480" height="300"></canvas>
    <p class="rv__hint">클릭·스페이스바로 정지, R 로 재시드</p>
  </div>
</main>
<script>
(function(){
  'use strict';
  // 395-09(진행률 채움 로더)와 다른 축: 칸의 나이 값이 색으로 누적·감쇠되는 계산이 주인공, 진행률 표시가 아니다.
  // 매 세대 나이 값을 갱신하고 fillRect 로 화면 전체를 다시 계산해 그린다 — 속성 트윈 없음.

  function makeLcg(seed){
    let s = seed >>> 0;
    return function(){
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  const W = 480, H = 300;
  const CELL = 10, COLS = W / CELL, ROWS = H / CELL;
  const PAPER = '#fff7e6';
  const TRAIL_LOW = [225, 219, 201];
  const TRAIL_HIGH = [147, 164, 202];

  let SEED = 40401;
  let rnd = makeLcg(SEED);

  const SURVIVE_MIN = 2, SURVIVE_MAX = 3, BIRTH_COUNT = 3;
  const AGE_CAP = 10;
  const TRAIL_DECAY = 1; // 변형 04 대상 — 죽은 뒤 나이 값이 세대마다 줄어드는 속도

  let alive = new Uint8Array(COLS * ROWS);
  let nextAlive = new Uint8Array(COLS * ROWS);
  let age = new Uint8Array(COLS * ROWS);

  function idx(x, y){ return y * COLS + x; }

  function seedGrid(){
    for (let i = 0; i < alive.length; i++){
      alive[i] = rnd() < 0.3 ? 1 : 0;
      age[i] = 0;
    }
  }

  function neighborCount(x, y){
    let n = 0;
    for (let dy = -1; dy <= 1; dy++){
      for (let dx = -1; dx <= 1; dx++){
        if (dx === 0 && dy === 0) continue;
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
        n += alive[idx(nx, ny)];
      }
    }
    return n;
  }

  function step(){
    for (let y = 0; y < ROWS; y++){
      for (let x = 0; x < COLS; x++){
        const i = idx(x, y);
        const wasAlive = alive[i] === 1;
        const n = neighborCount(x, y);
        let willLive = 0;
        if (wasAlive){
          willLive = (n >= SURVIVE_MIN && n <= SURVIVE_MAX) ? 1 : 0;
        } else {
          willLive = (n === BIRTH_COUNT) ? 1 : 0;
        }
        nextAlive[i] = willLive;
      }
    }
    for (let i = 0; i < alive.length; i++){
      if (nextAlive[i]){
        age[i] = Math.min(AGE_CAP, age[i] + 1);
      } else {
        age[i] = Math.max(0, age[i] - TRAIL_DECAY);
      }
    }
    const tmp = alive; alive = nextAlive; nextAlive = tmp;
  }

  const cvEl = document.querySelector('.rv__cv');
  const ctx = cvEl.getContext('2d');
  const rootEl = document.querySelector('.rv');

  function render(){
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    for (let y = 0; y < ROWS; y++){
      for (let x = 0; x < COLS; x++){
        const i = idx(x, y);
        const a = age[i];
        if (a === 0) continue;
        const t = a / AGE_CAP;
        const r = Math.round(TRAIL_LOW[0] + (TRAIL_HIGH[0] - TRAIL_LOW[0]) * t);
        const g = Math.round(TRAIL_LOW[1] + (TRAIL_HIGH[1] - TRAIL_LOW[1]) * t);
        const b = Math.round(TRAIL_LOW[2] + (TRAIL_HIGH[2] - TRAIL_LOW[2]) * t);
        ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
        ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 1, CELL - 1);
      }
    }
  }

  const ARIA_PLAY = '나이 잔상 진행 중 — 클릭하거나 스페이스바로 정지, R 로 재시드';
  const ARIA_PAUSE = '나이 잔상 정지됨 — 클릭하거나 스페이스바로 재생, R 로 재시드';

  function updateAria(){
    rootEl.setAttribute('aria-label', paused ? ARIA_PAUSE : ARIA_PLAY);
  }

  let paused = false;
  const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

  function human(){ rootEl.classList.remove('is-demo'); }

  function reseed(){
    SEED = (SEED * 1103515245 + 12345) >>> 0;
    rnd = makeLcg(SEED || 1);
    seedGrid();
  }

  function togglePause(){
    paused = !paused;
    updateAria();
  }

  function onActivate(e){
    if (e.type === 'keydown'){
      if (e.key === 'r' || e.key === 'R'){
        human();
        reseed();
        render();
        return;
      }
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
    }
    human();
    if (reduceMQ.matches){
      step();
      render();
    } else {
      togglePause();
    }
  }

  function onKey(e){
    if (e.key === 'r' || e.key === 'R' || e.key === 'Enter' || e.key === ' '){
      onActivate(e);
    }
  }

  const GEN_INTERVAL_MS = 85;
  let acc = 0, last = 0;

  function frame(now){
    if (!reduceMQ.matches){
      if (!last) last = now;
      const dt = now - last;
      last = now;
      if (!paused){
        acc += dt;
        while (acc >= GEN_INTERVAL_MS){
          step();
          acc -= GEN_INTERVAL_MS;
        }
        render();
      }
      requestAnimationFrame(frame);
    }
  }

  function onResize(){ render(); }

  rootEl.addEventListener('click', onActivate);
  rootEl.addEventListener('keydown', onKey);
  window.addEventListener('resize', onResize);

  seedGrid();
  updateAria();
  render();
  if (!reduceMQ.matches){
    requestAnimationFrame(frame);
  }

})();
</script>
</body>
</html>
