<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point ripple icon button — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="rp is-demo" id="rp" aria-label="押した場所から広がるアイコンボタン">
    <button class="rp__btn" type="button" id="rp-btn" aria-label="お知らせを見る">
      <span class="rp__seed" aria-hidden="true"></span>
      <span class="rp__seed rp__seed--b" aria-hidden="true"></span>
      <span class="rp__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><path d="M208,192H48a8,8,0,0,1-6.88-12C47.71,168.6,56,139.81,56,104a72,72,0,0,1,144,0c0,35.82,8.3,64.6,14.9,76A8,8,0,0,1,208,192Z" opacity=".2"/><path d="M221.8,175.94C216.25,166.38,208,139.33,208,104a80,80,0,1,0-160,0c0,35.34-8.26,62.38-13.81,71.94A16,16,0,0,0,48,200H88.81a40,40,0,0,0,78.38,0H208a16,16,0,0,0,13.8-24.06ZM128,216a24,24,0,0,1-22.62-16h45.24A24,24,0,0,1,128,216ZM48,184c7.7-13.24,16-43.92,16-80a64,64,0,1,1,128,0c0,36.05,8.28,66.73,16,80Z"/></svg></span>
      <span class="rp__dot" aria-hidden="true"></span>
    </button>
    <p class="rp__hint" id="rp-hint">ボタンのどこでも押してみてください</p>
  </section>
</main>
<script>
// 눌린 지점 리플: pointerdown 이 좌표를 잡아 --x · --y 로 옮겨 적는다 (10줄 안팎)
var rp = document.getElementById('rp');
var rpBtn = document.getElementById('rp-btn');
var rpHint = document.getElementById('rp-hint');
rpBtn.addEventListener('pointerdown', function (e) {
  rp.classList.remove('is-demo');
  var box = rpBtn.getBoundingClientRect();
  var dot = document.createElement('span');
  dot.className = 'rp__wave';
  dot.style.setProperty('--x', (e.clientX - box.left) + 'px');
  dot.style.setProperty('--y', (e.clientY - box.top) + 'px');
  rpBtn.appendChild(dot);
  window.setTimeout(function () { dot.remove(); }, 620);
  rpHint.textContent = 'お知らせを確認しました';
});
rpBtn.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  rpHint.textContent = 'お知らせを確認しました';
});
</script>
</body>
</html>
