<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll toolbar FABs — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="tb is-demo" id="tb" aria-label="読んでいる間に隠れるツールバーボタン">
    <header class="tb__head">
      <p class="tb__title">今日の読みもの</p>
      <p class="tb__state" id="tb-state">ツール表示中</p>
    </header>
    <div class="tb__view" id="tb-view" tabindex="0" role="region" aria-label="記事の一覧">
      <ul class="tb__list">
        <li class="tb__row"><b>01</b> 柔らかな影を載せるカード</li>
        <li class="tb__row"><b>02</b> 手を招く入力欄</li>
        <li class="tb__row"><b>03</b> 一拍遅れて届くお知らせ</li>
        <li class="tb__row"><b>04</b> 畳み開く一覧の呼吸</li>
        <li class="tb__row"><b>05</b> 端まで満ちる進捗バー</li>
        <li class="tb__row"><b>06</b> 押した場所を覚えるボタン</li>
        <li class="tb__row"><b>07</b> スクロールに追う目盛り</li>
        <li class="tb__row"><b>08</b> 舞台から消えるチップ</li>
        <li class="tb__row"><b>09</b> 指先から咲くリップル</li>
      </ul>
    </div>
    <nav class="tb__bar" id="tb-bar" aria-label="読書ツール">
      <button class="tb__fab" type="button" id="tb-top" aria-label="一番上へ">
        <span aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><path d="M208,160H48l80-80Z" opacity=".2"/><path d="M213.66,154.34l-80-80a8,8,0,0,0-11.32,0l-80,80A8,8,0,0,0,48,168H208a8,8,0,0,0,5.66-13.66ZM67.31,152,128,91.31,188.69,152Z"/></svg></span>
      </button>
      <button class="tb__fab" type="button" aria-label="一覧から探す">
        <span aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><path d="M192,112a80,80,0,1,1-80-80A80,80,0,0,1,192,112Z" opacity=".2"/><path d="M229.66,218.34,179.6,168.28a88.21,88.21,0,1,0-11.32,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/></svg></span>
      </button>
      <button class="tb__fab" type="button" aria-label="目次を開く">
        <span aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><path d="M216,64V192H40V64Z" opacity=".2"/><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg></span>
      </button>
    </nav>
  </section>
</main>
<script>
// 스크롤 방향을 읽는 툴바 FAB: scrollTop 변화로 방향을 잡아 숨김·노출만 바꾼다
var tb = document.getElementById('tb');
var tbView = document.getElementById('tb-view');
var tbBar = document.getElementById('tb-bar');
var tbState = document.getElementById('tb-state');
var tbLast = tbView.scrollTop;
tbView.addEventListener('scroll', function () {
  tb.classList.remove('is-demo');
  var now = tbView.scrollTop;
  var down = now - tbLast > 2;
  var up = tbLast - now > 2;
  tbLast = now;
  if (down && !tb.classList.contains('is-hidden')) {
    tb.classList.add('is-hidden');
    tbState.textContent = '読書中 · ツール格納';
  } else if (up && tb.classList.contains('is-hidden')) {
    tb.classList.remove('is-hidden');
    tbState.textContent = 'ツール表示中';
  }
});
document.getElementById('tb-top').addEventListener('click', function () {
  tbView.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
</body>
</html>
