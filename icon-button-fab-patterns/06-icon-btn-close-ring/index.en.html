<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Close ring button — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="cl is-demo" id="cl" aria-label="A notice card with a ring-spinning close button">
    <article class="cl__card">
      <p class="cl__msg">Your 10% first-order coupon lasts ten more days</p>
      <button class="cl__btn" type="button" id="cl-btn" aria-label="Close the notice">
        <span class="cl__ring" aria-hidden="true"></span>
        <span class="cl__x" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><path d="M216,56V200a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V56A16,16,0,0,1,56,40H200A16,16,0,0,1,216,56Z" opacity=".2"/><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg></span>
      </button>
      <p class="cl__undo" id="cl-undo" aria-live="polite">Notice closed <button class="cl__back" type="button" id="cl-back">Undo</button></p>
    </article>
  </section>
</main>
<script>
// 닫기 버튼: 호버·초점엔 링이 돌고, 누르면 카드가 접히며 되돌리기가 남는다
var cl = document.getElementById('cl');
var clBtn = document.getElementById('cl-btn');
var clBack = document.getElementById('cl-back');
clBtn.addEventListener('click', function () {
  cl.classList.remove('is-demo');
  cl.classList.add('is-gone');
});
clBack.addEventListener('click', function () {
  cl.classList.remove('is-gone');
  clBtn.focus({ preventScroll: true });
});
cl.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') cl.classList.remove('is-gone');
});
</script>
</body>
</html>
