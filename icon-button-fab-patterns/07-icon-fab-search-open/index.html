<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search expand FAB — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="se is-demo" id="se" aria-label="아이콘이 입력칸으로 펼쳐지는 검색 FAB">
    <p class="se__hint" id="se-hint">검색 열기</p>
    <div class="se__dock">
      <div class="se__pill" id="se-pill">
        <button class="se__go" type="button" id="se-go" aria-expanded="false" aria-controls="se-input" aria-label="검색 열기">
          <span aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><path d="M192,112a80,80,0,1,1-80-80A80,80,0,0,1,192,112Z" opacity=".2"/><path d="M229.66,218.34,179.6,168.28a88.21,88.21,0,1,0-11.32,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/></svg></span>
        </button>
        <input class="se__input" id="se-input" type="text" placeholder="무엇을 찾아 드릴까요?" aria-label="검색어 입력" />
        <span class="se__q" id="se-q" aria-hidden="true">봄 원피스</span>
      </div>
      <p class="se__log" id="se-log" aria-live="polite"></p>
    </div>
  </section>
</main>
<script>
// 확장 검색 FAB: --w 를 직접 바꿔 알약이 입력칸으로 펼쳐진다 (요소 자신에 setProperty)
var se = document.getElementById('se');
var seGo = document.getElementById('se-go');
var seInput = document.getElementById('se-input');
var sePill = document.getElementById('se-pill');
var seHint = document.getElementById('se-hint');
var seLog = document.getElementById('se-log');
var seOpen = false;
function seSet(v) {
  se.classList.remove('is-demo');
  seOpen = v;
  se.classList.toggle('is-open', v);
  sePill.style.setProperty('--w', v ? '264px' : '48px');
  seGo.setAttribute('aria-expanded', v ? 'true' : 'false');
  seGo.setAttribute('aria-label', v ? '검색 닫기' : '검색 열기');
  seHint.textContent = v ? '검색어를 적어 보세요' : '검색 열기';
  if (v) {
    window.setTimeout(function () { seInput.focus({ preventScroll: true }); }, 320);
  } else {
    seLog.textContent = seInput.value.trim() ? '검색어를 남겼습니다' : '';
    seInput.blur();
  }
}
seGo.addEventListener('click', function () { seSet(!seOpen); });
seInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') seSet(false);
  if (e.key === 'Escape') { seInput.value = ''; seSet(false); }
});
</script>
</body>
</html>
