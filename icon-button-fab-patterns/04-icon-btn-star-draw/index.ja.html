<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star draw favorite — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="st is-demo" id="st" aria-label="お気に入りにしまう商品カード">
    <article class="st__card">
      <span class="st__thumb" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><path d="M224,56V178.06l-39.72-39.72a8,8,0,0,0-11.31,0L147.31,164,97.66,114.34a8,8,0,0,0-11.32,0L32,168.69V56a8,8,0,0,1,8-8H216A8,8,0,0,1,224,56Z" opacity=".2"/><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V158.75l-26.07-26.06a16,16,0,0,0-22.63,0l-20,20-44-44a16,16,0,0,0-22.62,0L40,149.37V56ZM40,172l52-52,80,80H40Zm176,28H194.63l-36-36,20-20L216,181.38V200ZM144,100a12,12,0,1,1,12,12A12,12,0,0,1,144,100Z"/></svg></span>
      <div class="st__body">
        <h2 class="st__title">春のガーデンワンピース</h2>
        <p class="st__meta">淡いミント · フリーサイズ</p>
      </div>
      <button class="st__btn" type="button" id="st-btn" aria-pressed="false" aria-label="お気に入りに入れる">
        <span class="st__star" aria-hidden="true">
          <svg class="st__base" viewBox="0 0 256 256" width="1em" height="1em"><path d="M239.18,97.26A16.38,16.38,0,0,0,224.92,86l-59-4.76L143.14,26.15a16.36,16.36,0,0,0-30.27,0L90.11,81.23,31.08,86a16.46,16.46,0,0,0-9.37,28.86l45,38.83L53,211.75a16.38,16.38,0,0,0,24.5,17.82L128,198.49l50.53,31.08A16.4,16.4,0,0,0,203,211.75l-13.76-58.07,45-38.83A16.43,16.43,0,0,0,239.18,97.26Z"/></svg>
          <svg class="st__draw" viewBox="0 0 256 256" width="1em" height="1em"><path pathLength="100" d="M239.18,97.26A16.38,16.38,0,0,0,224.92,86l-59-4.76L143.14,26.15a16.36,16.36,0,0,0-30.27,0L90.11,81.23,31.08,86a16.46,16.46,0,0,0-9.37,28.86l45,38.83L53,211.75a16.38,16.38,0,0,0,24.5,17.82L128,198.49l50.53,31.08A16.4,16.4,0,0,0,203,211.75l-13.76-58.07,45-38.83A16.43,16.43,0,0,0,239.18,97.26Z"/></svg>
          <svg class="st__fill" viewBox="0 0 256 256" width="1em" height="1em" aria-hidden="true"><path pathLength="100" d="M239.18,97.26A16.38,16.38,0,0,0,224.92,86l-59-4.76L143.14,26.15a16.36,16.36,0,0,0-30.27,0L90.11,81.23,31.08,86a16.46,16.46,0,0,0-9.37,28.86l45,38.83L53,211.75a16.38,16.38,0,0,0,24.5,17.82L128,198.49l50.53,31.08A16.4,16.4,0,0,0,203,211.75l-13.76-58.07,45-38.83A16.43,16.43,0,0,0,239.18,97.26Z"/></svg>
        </span>
      </button>
      <p class="st__saved" id="st-saved" aria-live="polite">お気に入りに入れました</p>
    </article>
  </section>
</main>
<script>
// 즐겨찾기 별: 누르면 테두리가 그려지고(step 1) 다 그린 뒤 채움으로 바뀐다(step 2)
var st = document.getElementById('st');
var stBtn = document.getElementById('st-btn');
var stSaved = document.getElementById('st-saved');
var stOn = false;
stBtn.addEventListener('click', function () {
  st.classList.remove('is-demo');
  stOn = !stOn;
  st.classList.toggle('is-on', stOn);
  stBtn.setAttribute('aria-pressed', stOn ? 'true' : 'false');
  stBtn.setAttribute('aria-label', stOn ? 'お気に入りから外す' : 'お気に入りに入れる');
  stSaved.textContent = stOn ? 'お気に入りに入れました' : 'お気に入りから外しました';
});
</script>
</body>
</html>
