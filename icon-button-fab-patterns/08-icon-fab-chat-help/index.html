<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat help FAB — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ch is-demo" id="ch" aria-label="채팅 창을 여는 도움말 버튼">
    <div class="ch__panel" id="ch-panel" role="dialog" aria-label="도움말 채팅" aria-modal="false">
      <header class="ch__head">
        <span class="ch__name">무엇을 도와드릴까요?</span>
      </header>
      <div class="ch__log" id="ch-log" aria-live="polite">
        <p class="ch__bubble ch__bubble--bot">궁금한 점을 적어 주세요. 평일 낮에는 사람이 답합니다.</p>
        <p class="ch__bubble ch__loop-me" aria-hidden="true">배송 언제예요?</p>
        <p class="ch__bubble ch__loop-dots" aria-hidden="true">...</p>
        <p class="ch__bubble ch__loop-reply" aria-hidden="true">내일 아침에 먼저 출발합니다.</p>
      </div>
      <form class="ch__form" id="ch-form">
        <input class="ch__input" id="ch-input" type="text" placeholder="메시지를 적어 보세요" aria-label="메시지 입력" />
        <button class="ch__send" type="submit" aria-label="메시지 보내기">
          <span aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><path d="M227.91,134.86,59.93,231a8,8,0,0,1-11.44-9.67L80,128,48.49,34.72a8,8,0,0,1,11.44-9.67l168,95.85A8,8,0,0,1,227.91,134.86Z" opacity=".2"/><path d="M231.87,114l-168-95.89A16,16,0,0,0,40.92,37.34L71.55,128,40.92,218.67A16,16,0,0,0,56,240a16.15,16.15,0,0,0,7.93-2.1l167.92-96.05a16,16,0,0,0,.05-27.89ZM56,224a.56.56,0,0,0,0-.12L85.74,136H144a8,8,0,0,0,0-16H85.74L56.06,32.16A.46.46,0,0,0,56,32l168,95.83Z"/></svg></span>
        </button>
      </form>
    </div>
    <button class="ch__fab" type="button" id="ch-fab" aria-expanded="false" aria-controls="ch-panel" aria-label="도움말 채팅 열기">
      <span aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><path d="M224,128A96,96,0,0,1,79.93,211.11h0L42.54,223.58a8,8,0,0,1-10.12-10.12l12.47-37.39h0A96,96,0,1,1,224,128Z" opacity=".2"/><path d="M128,24A104,104,0,0,0,36.18,176.88L24.83,210.93a16,16,0,0,0,20.24,20.24l34.05-11.35A104,104,0,1,0,128,24Zm0,192a87.87,87.87,0,0,1-44.06-11.81,8,8,0,0,0-4-1.08,7.85,7.85,0,0,0-2.53.42L40,216,52.47,178.6a8,8,0,0,0-.66-6.54A88,88,0,1,1,128,216Zm12-88a12,12,0,1,1-12-12A12,12,0,0,1,140,128Zm-44,0a12,12,0,1,1-12-12A12,12,0,0,1,96,128Zm88,0a12,12,0,1,1-12-12A12,12,0,0,1,184,128Z"/></svg></span>
    </button>
  </section>
</main>
<script>
// 도움말 FAB: 채팅 창이 열리고 보낸 말은 진짜로 쌓인다
var ch = document.getElementById('ch');
var chFab = document.getElementById('ch-fab');
var chForm = document.getElementById('ch-form');
var chInput = document.getElementById('ch-input');
var chLog = document.getElementById('ch-log');
function chAdd(text, who) {
  var p = document.createElement('p');
  p.className = 'ch__bubble ch__bubble--' + who;
  p.textContent = text;
  chLog.appendChild(p);
  return p;
}
chFab.addEventListener('click', function () {
  ch.classList.remove('is-demo');
  ch.classList.toggle('is-open');
  var open = ch.classList.contains('is-open');
  chFab.setAttribute('aria-expanded', open ? 'true' : 'false');
  chFab.setAttribute('aria-label', open ? '도움말 채팅 닫기' : '도움말 채팅 열기');
  if (open) window.setTimeout(function () { chInput.focus({ preventScroll: true }); }, 240);
});
chForm.addEventListener('submit', function (e) {
  e.preventDefault();
  var text = chInput.value.trim();
  if (!text) return;
  ch.classList.remove('is-demo');
  chAdd(text, 'me');
  chInput.value = '';
  var dots = chAdd('...', 'bot');
  window.setTimeout(function () {
    dots.textContent = '접수했습니다. 잠시만 기다려 주세요.';
  }, 900);
});
</script>
</body>
</html>
