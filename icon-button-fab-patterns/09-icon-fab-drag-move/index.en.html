<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drag move FAB — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="dg is-demo" id="dg" aria-label="A FAB that moves when you long-press and drag">
    <div class="dg__screen" id="dg-screen">
      <span class="dg__guide dg__guide--l" aria-hidden="true"></span>
      <span class="dg__guide dg__guide--r" aria-hidden="true"></span>
      <p class="dg__read" id="dg-read">Snapped to the right</p>
      <button class="dg__fab" type="button" id="dg-fab" aria-label="Move the help button">
        <span aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><path d="M224,48V208a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V48A16,16,0,0,1,48,32H208A16,16,0,0,1,224,48Z" opacity=".2"/><path d="M72,60A12,12,0,1,1,60,48,12,12,0,0,1,72,60Zm56-12a12,12,0,1,0,12,12A12,12,0,0,0,128,48Zm68,24a12,12,0,1,0-12-12A12,12,0,0,0,196,72ZM60,116a12,12,0,1,0,12,12A12,12,0,0,0,60,116Zm68,0a12,12,0,1,0,12,12A12,12,0,0,0,128,116Zm68,0a12,12,0,1,0,12,12A12,12,0,0,0,196,116ZM60,184a12,12,0,1,0,12,12A12,12,0,0,0,60,184Zm68,0a12,12,0,1,0,12,12A12,12,0,0,0,128,184Zm68,0a12,12,0,1,0,12,12A12,12,0,0,0,196,184Z"/></svg></span>
      </button>
    </div>
    <p class="dg__hint" id="dg-hint">Hold longer than 350ms, then drag</p>
  </section>
</main>
<script>
// 제스처 FAB: 길게 누르면 붙잡고, 끌면 버튼 자체가 움직이며, 놓으면 가까운 가장자리로 스냅된다
var dg = document.getElementById('dg');
var dgFab = document.getElementById('dg-fab');
var dgScreen = document.getElementById('dg-screen');
var dgRead = document.getElementById('dg-read');
var dgHold = null;   // 길게 누름 타이머
var dgGrab = false;  // 붙잡기 상태
function dgSide(x) {
  var box = dgScreen.getBoundingClientRect();
  return x < box.left + box.width / 2 ? 'left' : 'right';
}
function dgSnap(x) {
  var side = dgSide(x);
  var box = dgScreen.getBoundingClientRect();
  var maxX = box.width - dgFab.offsetWidth - 8;
  dgFab.style.transform = 'translateX(' + (side === 'left' ? 0 : maxX) + 'px)';
  dgRead.textContent = side === 'left' ? 'Snapped to the left' : 'Snapped to the right';
}
function dgClearHold() {
  window.clearTimeout(dgHold);
  dgHold = null;
}
dgFab.addEventListener('pointerdown', function (e) {
  dg.classList.remove('is-demo');
  dgHold = window.setTimeout(function () {
    dgGrab = true;
    dgFab.classList.add('is-grab');
    dgScreen.classList.add('is-holding');
    try { dgFab.setPointerCapture(e.pointerId); } catch (err) { }
    dgRead.textContent = 'Held · release to snap';
  }, 350);
});
dgFab.addEventListener('pointermove', function (e) {
  if (!dgGrab) return;
  var box = dgScreen.getBoundingClientRect();
  var maxX = box.width - dgFab.offsetWidth - 8;
  var x = Math.min(Math.max(e.clientX - box.left - dgFab.offsetWidth / 2, 0), maxX);
  dgFab.style.transform = 'translateX(' + x + 'px)';
});
dgFab.addEventListener('pointerup', function (e) {
  dgClearHold();
  dgScreen.classList.remove('is-holding');
  if (!dgGrab) return;
  dgGrab = false;
  dgFab.classList.remove('is-grab');
  dgSnap(e.clientX);
});
dgFab.addEventListener('keydown', function (e) {
  dg.classList.remove('is-demo');
  var box = dgScreen.getBoundingClientRect();
  var maxX = box.width - dgFab.offsetWidth - 8;
  if (e.key === 'ArrowLeft') dgFab.style.transform = 'translateX(0px)';
  if (e.key === 'ArrowRight') dgFab.style.transform = 'translateX(' + maxX + 'px)';
});
</script>
</body>
</html>
