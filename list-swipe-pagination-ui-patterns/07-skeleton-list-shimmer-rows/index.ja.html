<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeleton shimmer rows — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="skel-list" aria-busy="true">
    <div class="skel-list__row">
      <span class="skel-list__avatar" aria-hidden="true"></span>
      <span class="skel-list__lines" aria-hidden="true"><span></span><span></span></span>
      <span class="skel-list__content"><strong>イ・ソジュン</strong><span>新しいコメントを残しました</span></span>
    </div>
    <div class="skel-list__row">
      <span class="skel-list__avatar" aria-hidden="true"></span>
      <span class="skel-list__lines" aria-hidden="true"><span></span><span></span></span>
      <span class="skel-list__content"><strong>パク・ハユン</strong><span>投稿をシェアしました</span></span>
    </div>
    <button class="skel-list__toggle" type="button">コンテンツをプレビュー</button>
  </div>
</main>
<script>
document.querySelector('.skel-list__toggle').addEventListener('click', function () {
  var list = document.querySelector('.skel-list');
  var loaded = list.classList.toggle('is-loaded');
  list.setAttribute('aria-busy', String(!loaded));
  this.textContent = loaded ? 'スケルトンをもう一度見る' : 'コンテンツをプレビュー';
});
</script>
</body>
</html>
