<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk-select toolbar — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="bulk-list is-demo">
    <label class="bulk-list__row bulk-list__row--all">
      <input type="checkbox" class="bulk-list__selectall">
      <span>전체 선택</span>
    </label>
    <label class="bulk-list__row">
      <input type="checkbox" class="bulk-list__item">
      <span>2026년 1분기 보고서.pdf</span>
    </label>
    <label class="bulk-list__row">
      <input type="checkbox" class="bulk-list__item">
      <span>디자인 시안 v3.fig</span>
    </label>
    <div class="bulk-list__toolbar">
      <span class="bulk-list__count"><span class="bulk-list__count-num">0</span>개 선택됨</span>
      <button type="button">이동</button>
      <button type="button">삭제</button>
    </div>
  </div>
</main>
<script>
(function () {
  var list = document.querySelector('.bulk-list');
  var all = list.querySelector('.bulk-list__selectall');
  var items = Array.prototype.slice.call(list.querySelectorAll('.bulk-list__item'));
  var count = list.querySelector('.bulk-list__count-num');
  function sync() {
    var n = items.filter(function (c) { return c.checked; }).length;
    all.checked = n === items.length;
    all.indeterminate = n > 0 && n < items.length;
    list.classList.toggle('has-selection', n > 0);
    list.classList.remove('is-demo');
    count.textContent = String(n);
  }
  all.addEventListener('change', function () {
    items.forEach(function (c) { c.checked = all.checked; });
    sync();
  });
  items.forEach(function (c) { c.addEventListener('change', sync); });
})();
</script>
</body>
</html>
