<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swipe multi-action — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="ma-list">
    <li class="ma-row is-demo">
      <div class="ma-row__actions">
        <button class="ma-row__action ma-row__action--fav" type="button" aria-pressed="false">★</button>
        <button class="ma-row__action ma-row__action--archive" type="button">보관</button>
        <button class="ma-row__action ma-row__action--del" type="button">삭제</button>
      </div>
      <div class="ma-row__content" tabindex="0">
        <span class="ma-row__title">새 댓글 3개</span>
        <span class="ma-row__desc">게시글에 새 댓글이 달렸어요</span>
      </div>
    </li>
  </ul>
</main>
<script>
(function () {
  var OPEN = 198;
  document.querySelectorAll('.ma-row').forEach(function (row) {
    var content = row.querySelector('.ma-row__content');
    var fav = row.querySelector('.ma-row__action--fav');
    var startX = 0, dx = 0, dragging = false;
    function collapse() {
      row.style.height = row.offsetHeight + 'px';
      requestAnimationFrame(function () { row.style.height = '0px'; row.style.opacity = '0'; });
      row.addEventListener('transitionend', function h(e) {
        if (e.propertyName === 'height') { row.removeEventListener('transitionend', h); row.remove(); }
      });
    }
    content.addEventListener('pointerdown', function (e) {
      row.classList.remove('is-demo');
      dragging = true; startX = e.clientX; content.setPointerCapture(e.pointerId);
    });
    content.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      dx = Math.min(0, Math.max(-OPEN, e.clientX - startX));
      content.style.transform = 'translateX(' + dx + 'px)';
    });
    function end() {
      if (!dragging) return;
      dragging = false;
      content.style.transform = dx < -OPEN / 2 ? 'translateX(-' + OPEN + 'px)' : '';
      dx = 0;
    }
    content.addEventListener('pointerup', end);
    content.addEventListener('pointercancel', end);
    fav.addEventListener('click', function () {
      var on = fav.getAttribute('aria-pressed') === 'true';
      fav.setAttribute('aria-pressed', String(!on));
      fav.classList.toggle('is-on', !on);
    });
    row.querySelector('.ma-row__action--archive').addEventListener('click', collapse);
    row.querySelector('.ma-row__action--del').addEventListener('click', collapse);
  });
})();
</script>
</body>
</html>
