<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Click-to-sort header — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <table class="sort-table is-demo">
    <caption class="sort-table__caption">Điểm của người tham gia</caption>
    <thead>
      <tr>
        <th><button class="sort-table__th" type="button" data-key="name" aria-sort="none">Tên<span class="sort-table__arrow" aria-hidden="true">▾</span></button></th>
        <th><button class="sort-table__th" type="button" data-key="score" aria-sort="descending">Điểm<span class="sort-table__arrow" aria-hidden="true">▾</span></button></th>
      </tr>
    </thead>
    <tbody>
      <tr><td>Do-yoon</td><td data-score="92">92</td></tr>
      <tr><td>Seo-yeon</td><td data-score="88">88</td></tr>
      <tr><td>Min-jun</td><td data-score="76">76</td></tr>
    </tbody>
  </table>
</main>
<script>
(function () {
  var table = document.querySelector('.sort-table');
  var tbody = table.querySelector('tbody');
  var ths = table.querySelectorAll('.sort-table__th');
  ths.forEach(function (btn) {
    btn.addEventListener('click', function () {
      table.classList.remove('is-demo');
      var key = btn.dataset.key;
      var dir = btn.getAttribute('aria-sort') === 'ascending' ? 'descending' : 'ascending';
      ths.forEach(function (b) { b.setAttribute('aria-sort', 'none'); });
      btn.setAttribute('aria-sort', dir);
      var rows = Array.prototype.slice.call(tbody.rows);
      rows.sort(function (a, b) {
        var av = key === 'score' ? Number(a.cells[1].dataset.score) : a.cells[0].textContent;
        var bv = key === 'score' ? Number(b.cells[1].dataset.score) : b.cells[0].textContent;
        var cmp = av > bv ? 1 : av < bv ? -1 : 0;
        return dir === 'ascending' ? cmp : -cmp;
      });
      rows.forEach(function (r) { tbody.appendChild(r); });
    });
  });
})();
</script>
</body>
</html>
