<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drag handle reorder — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="drag-list is-demo" aria-label="Processing order">
    <li class="drag-row">
      <button class="drag-row__handle" type="button" aria-label="Drag, or use arrow keys to reorder">⠿</button>
      <span class="drag-row__label">Payment confirmed</span>
    </li>
    <li class="drag-row">
      <button class="drag-row__handle" type="button" aria-label="Drag, or use arrow keys to reorder">⠿</button>
      <span class="drag-row__label">Preparing shipment</span>
    </li>
    <li class="drag-row">
      <button class="drag-row__handle" type="button" aria-label="Drag, or use arrow keys to reorder">⠿</button>
      <span class="drag-row__label">Review request</span>
    </li>
  </ul>
</main>
<script>
(function () {
  var list = document.querySelector('.drag-list');
  Array.prototype.forEach.call(list.children, function (row) {
    var handle = row.querySelector('.drag-row__handle');
    var startY = 0, dy = 0, dragging = false;
    handle.addEventListener('pointerdown', function (e) {
      list.classList.remove('is-demo');
      dragging = true; startY = e.clientY; row.classList.add('is-dragging');
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      dy = e.clientY - startY;
      row.style.transform = 'translateY(' + dy + 'px)';
    });
    function end() {
      if (!dragging) return;
      dragging = false; row.classList.remove('is-dragging');
      var target = dy > 30 ? row.nextElementSibling : dy < -30 ? row.previousElementSibling : null;
      row.style.transform = '';
      if (target) list.insertBefore(dy > 0 ? target : row, dy > 0 ? row : target);
      dy = 0;
    }
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
    handle.addEventListener('keydown', function (e) {
      list.classList.remove('is-demo');
      var sib = e.key === 'ArrowDown' ? row.nextElementSibling : e.key === 'ArrowUp' ? row.previousElementSibling : null;
      if (!sib) return;
      e.preventDefault();
      if (e.key === 'ArrowDown') list.insertBefore(sib, row); else list.insertBefore(row, sib);
      handle.focus({ preventScroll: true });
    });
  });
})();
</script>
</body>
</html>
