<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frozen header + first column — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="freeze-wrap is-demo" tabindex="0" aria-label="Bảng so sánh giá. Cuộn bằng phím mũi tên hoặc kéo">
    <table class="freeze-table">
      <thead>
        <tr>
          <th class="freeze-table__corner">Gói</th>
          <th>Th1</th><th>Th2</th><th>Th3</th><th>Th4</th>
        </tr>
      </thead>
      <tbody>
        <tr><th scope="row">Cơ bản</th><td>9,900</td><td>9,900</td><td>9,900</td><td>9,900</td></tr>
        <tr><th scope="row">Pro</th><td>19,900</td><td>19,900</td><td>19,900</td><td>19,900</td></tr>
        <tr><th scope="row">Nhóm</th><td>39,900</td><td>39,900</td><td>39,900</td><td>39,900</td></tr>
        <tr><th scope="row">Doanh nghiệp</th><td>Liên hệ</td><td>Liên hệ</td><td>Liên hệ</td><td>Liên hệ</td></tr>
      </tbody>
    </table>
  </div>
</main>
<script>
(function () {
  var wrap = document.querySelector('.freeze-wrap');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf = null, t0 = null;
  function maxX() { return wrap.scrollWidth - wrap.clientWidth; }
  function maxY() { return wrap.scrollHeight - wrap.clientHeight; }
  function loop(ts) {
    if (!wrap.classList.contains('is-demo')) return;
    if (t0 === null) t0 = ts;
    var p = ((ts - t0) / 2000) % 1;
    var s = p < .5 ? p * 2 : 2 - p * 2;
    wrap.scrollLeft = s * maxX();
    wrap.scrollTop = s * maxY();
    raf = requestAnimationFrame(loop);
  }
  function stop() {
    wrap.classList.remove('is-demo');
    if (raf) cancelAnimationFrame(raf);
  }
  wrap.addEventListener('pointerdown', stop);
  wrap.addEventListener('wheel', stop, { passive: true });
  wrap.addEventListener('keydown', function (e) {
    var step = 24;
    if (e.key === 'ArrowRight') { stop(); wrap.scrollLeft += step; }
    else if (e.key === 'ArrowLeft') { stop(); wrap.scrollLeft -= step; }
    else if (e.key === 'ArrowDown') { stop(); wrap.scrollTop += step; }
    else if (e.key === 'ArrowUp') { stop(); wrap.scrollTop -= step; }
    else return;
    e.preventDefault();
  });
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
