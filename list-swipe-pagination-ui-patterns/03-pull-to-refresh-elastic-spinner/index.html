<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pull to refresh — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ptr is-demo">
    <div class="ptr__indicator" aria-hidden="true"><span class="ptr__spinner"></span></div>
    <div class="ptr__body">
      <div class="ptr__head">
        <span class="ptr__title">받은 피드</span>
        <button class="ptr__refresh" type="button">새로고침</button>
      </div>
      <ul class="ptr__list">
        <li>오늘의 추천 3개</li>
        <li>친구 활동 2건</li>
      </ul>
      <p class="ptr__status" aria-live="polite">방금 새로고침함</p>
    </div>
  </div>
</main>
<script>
(function () {
  var ptr = document.querySelector('.ptr');
  var body = ptr.querySelector('.ptr__body');
  var status = ptr.querySelector('.ptr__status');
  var startY = 0, dy = 0, dragging = false, refreshing = false;
  function refresh() {
    if (refreshing) return;
    refreshing = true;
    ptr.classList.add('is-refreshing');
    body.style.transform = 'translateY(56px)';
    status.style.visibility = 'hidden';
    setTimeout(function () {
      refreshing = false;
      ptr.classList.remove('is-refreshing');
      body.style.transform = '';
      status.style.visibility = '';
    }, 900);
  }
  body.addEventListener('pointerdown', function (e) {
    ptr.classList.remove('is-demo');
    dragging = true; startY = e.clientY; body.setPointerCapture(e.pointerId);
  });
  body.addEventListener('pointermove', function (e) {
    if (!dragging || refreshing) return;
    dy = Math.max(0, Math.min(72, (e.clientY - startY) * 0.5));
    body.style.transform = 'translateY(' + dy + 'px)';
  });
  function end() {
    if (!dragging || refreshing) { dragging = false; return; }
    dragging = false;
    if (dy > 44) { refresh(); } else { body.style.transform = ''; }
    dy = 0;
  }
  body.addEventListener('pointerup', end);
  body.addEventListener('pointercancel', end);
  ptr.querySelector('.ptr__refresh').addEventListener('click', function () {
    ptr.classList.remove('is-demo'); refresh();
  });
})();
</script>
</body>
</html>
