<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numbered pagination — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <nav class="pg-nav is-demo" aria-label="페이지">
    <button class="pg-nav__prev" type="button" aria-label="이전 페이지">‹</button>
    <ul class="pg-nav__list"></ul>
    <button class="pg-nav__next" type="button" aria-label="다음 페이지">›</button>
  </nav>
</main>
<script>
(function () {
  var nav = document.querySelector('.pg-nav');
  var list = nav.querySelector('.pg-nav__list');
  var prev = nav.querySelector('.pg-nav__prev');
  var next = nav.querySelector('.pg-nav__next');
  var total = 8, current = 3, timer = null;
  function pages() {
    var out = [];
    for (var p = 1; p <= total; p++) {
      if (p === 1 || p === total || Math.abs(p - current) <= 1) out.push(p);
      else if (out[out.length - 1] !== '...') out.push('...');
    }
    return out;
  }
  function render() {
    list.innerHTML = '';
    pages().forEach(function (p) {
      var li = document.createElement('li');
      if (p === '...') {
        li.className = 'pg-nav__ellipsis'; li.textContent = '...'; li.setAttribute('aria-hidden', 'true');
      } else {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'pg-nav__num'; b.textContent = String(p);
        if (p === current) { b.setAttribute('aria-current', 'page'); }
        b.addEventListener('click', function () { stop(); current = p; render(); });
        li.appendChild(b);
      }
      list.appendChild(li);
    });
    prev.disabled = current === 1;
    next.disabled = current === total;
  }
  function stop() { nav.classList.remove('is-demo'); if (timer) { clearInterval(timer); timer = null; } }
  prev.addEventListener('click', function () { stop(); if (current > 1) { current--; render(); } });
  next.addEventListener('click', function () { stop(); if (current < total) { current++; render(); } });
  render();
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    timer = setInterval(function () {
      current = current < total ? current + 1 : 1;
      render();
    }, 260);
  }
})();
</script>
</body>
</html>
