<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swipe to delete — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="swipe-list" aria-label="Inbox">
    <li class="swipe-row is-demo">
      <button class="swipe-row__delete" type="button">Delete</button>
      <div class="swipe-row__content" tabindex="0">
        <span class="swipe-row__title">Weekly meeting reminder</span>
        <span class="swipe-row__desc">Swipe left to try it</span>
      </div>
    </li>
    <li class="swipe-row">
      <button class="swipe-row__delete" type="button">Delete</button>
      <div class="swipe-row__content" tabindex="0">
        <span class="swipe-row__title">Design feedback</span>
        <span class="swipe-row__desc">Yesterday 6:20 PM</span>
      </div>
    </li>
  </ul>
</main>
<script>
(function () {
  var OPEN = 88, DEL = 140;
  document.querySelectorAll('.swipe-row').forEach(function (row) {
    var content = row.querySelector('.swipe-row__content');
    var del = row.querySelector('.swipe-row__delete');
    var startX = 0, dx = 0, dragging = false;
    function remove() {
      row.style.height = row.offsetHeight + 'px';
      requestAnimationFrame(function () {
        row.classList.add('is-leaving');
        row.style.height = '0px';
      });
      row.addEventListener('transitionend', function h(e) {
        if (e.propertyName === 'height') { row.removeEventListener('transitionend', h); row.remove(); }
      });
    }
    content.addEventListener('pointerdown', function (e) {
      row.classList.remove('is-demo');
      dragging = true; startX = e.clientX; content.setPointerCapture(e.pointerId);
    });
    content.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      dx = Math.min(0, Math.max(-DEL - 30, e.clientX - startX));
      content.style.transform = 'translateX(' + dx + 'px)';
    });
    function end() {
      if (!dragging) return;
      dragging = false;
      if (dx < -DEL) { remove(); return; }
      content.style.transform = dx < -OPEN / 2 ? 'translateX(-' + OPEN + 'px)' : '';
      dx = 0;
    }
    content.addEventListener('pointerup', end);
    content.addEventListener('pointercancel', end);
    content.addEventListener('keydown', function (e) {
      if (e.key === 'Delete' || e.key === 'Backspace') { row.classList.remove('is-demo'); remove(); }
    });
    del.addEventListener('click', function () { remove(); });
  });
})();
</script>
</body>
</html>
