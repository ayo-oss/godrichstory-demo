<script>
// 실제 동작: 클릭·Enter 로 폴더를 열고 닫고, 화살표·Home·End 로 돌아다닌다.
var root = document.querySelector('.ft');
var tree = document.getElementById('ft-tree');
var items = [].slice.call(tree.querySelectorAll('li'));
var at = 0;
function visible(li) {
  var p = li.parentElement;
  while (p && p !== tree) {
    if (p.getAttribute('role') === 'group') {
      var host = p.closest('li');
      if (!host.classList.contains('is-open') && !host.classList.contains('is-loop')) return false;
    }
    p = p.parentElement;
  }
  return true;
}
function list() { return items.filter(visible); }
function paint() {
  items.forEach(function (li, i) {
    li.classList.toggle('is-at', i === at);
    if (i === at) tree.setAttribute('aria-activedescendant', li.id);
  });
}
function toggle(li, on) {
  root.classList.remove('is-demo');
  li.classList.remove('is-loop');
  li.classList.toggle('is-open', on);
  li.setAttribute('aria-expanded', String(!!on && li.classList.contains('is-branch')));
}
items.forEach(function (li, i) {
  var hit = li.querySelector('[data-hit]');
  hit.addEventListener('click', function () { at = i; paint(); if (li.classList.contains('is-branch')) toggle(li, !li.classList.contains('is-open')); });
});
tree.addEventListener('keydown', function (e) {
  var vis = list(), k = vis.indexOf(items[at]);
  if (e.key === 'ArrowDown') { at = items.indexOf(vis[Math.min(k + 1, vis.length - 1)]); paint(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { at = items.indexOf(vis[Math.max(k - 1, 0)]); paint(); e.preventDefault(); }
  else if (e.key === 'ArrowRight') {
    if (items[at].classList.contains('is-branch') && !items[at].classList.contains('is-open')) toggle(items[at], true);
    else if (k < vis.length - 1) { at = items.indexOf(vis[k + 1]); paint(); }
    e.preventDefault();
  } else if (e.key === 'ArrowLeft') {
    if (items[at].classList.contains('is-branch') && items[at].classList.contains('is-open')) toggle(items[at], false);
    else { var host = items[at].closest('ul[role="group"]'); if (host) { at = items.indexOf(host.closest('li')); paint(); } }
    e.preventDefault();
  } else if (e.key === 'Home') { at = items.indexOf(vis[0]); paint(); e.preventDefault(); }
  else if (e.key === 'End') { at = items.indexOf(vis[vis.length - 1]); paint(); e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === ' ') { if (items[at].classList.contains('is-branch')) toggle(items[at], !items[at].classList.contains('is-open')); e.preventDefault(); }
});
paint();
</script>
