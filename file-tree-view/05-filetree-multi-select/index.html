<script>
// 실제 동작: 클릭 한 개, Ctrl+클릭 토글, Shift+클릭 범위.
var root = document.querySelector('.ms');
var list = document.getElementById('ms-list');
var badge = document.getElementById('ms-badge');
var items = [].slice.call(list.querySelectorAll('.ms__item'));
var anchor = 0;
function sync() {
  var n = 0;
  items.forEach(function (li, i) {
    var on = li.classList.contains('is-sel');
    li.setAttribute('aria-selected', String(on));
    if (on) { n++; list.setAttribute('aria-activedescendant', li.id); }
  });
  badge.textContent = n + '개 선택';
}
items.forEach(function (li, i) {
  li.querySelector('[data-hit]').addEventListener('click', function (e) {
    root.classList.remove('is-demo');
    document.querySelector('.ms__badge').querySelectorAll('.ms__b').forEach(function (b) { b.hidden = true; });
    badge.hidden = false;
    if (e.shiftKey) {
      var a = Math.min(anchor, i), z = Math.max(anchor, i);
      items.forEach(function (l, k) { l.classList.toggle('is-sel', k >= a && k <= z); });
    } else if (e.ctrlKey || e.metaKey) {
      li.classList.toggle('is-sel');
      anchor = i;
    } else {
      items.forEach(function (l) { l.classList.remove('is-sel'); });
      li.classList.add('is-sel');
      anchor = i;
    }
    sync();
  });
});
list.addEventListener('keydown', function (e) {
  var at = items.indexOf(document.getElementById(list.getAttribute('aria-activedescendant')));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    var li = items[Math.max(0, Math.min(at + (e.key === 'ArrowDown' ? 1 : -1), items.length - 1))];
    list.setAttribute('aria-activedescendant', li.id);
    e.preventDefault();
  } else if (e.key === ' ' && at >= 0) {
    root.classList.remove('is-demo');
    items[at].classList.toggle('is-sel');
    anchor = at;
    sync();
    e.preventDefault();
  }
});
</script>
