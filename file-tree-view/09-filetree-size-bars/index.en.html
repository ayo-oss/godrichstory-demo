<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree with size bars — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="zb is-demo" id="zb">
    <div class="zb__head">
      <span class="zb__title">Storage 6.8 GB</span>
      <span class="zb__hint">Click a folder to re-scale against it</span>
    </div>
    <ul class="zb__tree" id="zb-tree" role="tree" aria-label="Storage" tabindex="0" aria-activedescendant="zb-1">
      <li class="zb__item" id="zb-1" role="treeitem" aria-level="1" data-v="4.2">
        <div class="zb__row" data-hit tabindex="-1">
          <span class="zb__ico zb__ico--folder" aria-hidden="true"><svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="M128 80H32V56a8 8 0 0 1 8-8h52.69a8 8 0 0 1 5.65 2.34Z" opacity=".2"/><path d="M216 72h-84.69L104 44.69A15.86 15.86 0 0 0 92.69 40H40a16 16 0 0 0-16 16v144.62A15.4 15.4 0 0 0 39.38 216h177.51A15.13 15.13 0 0 0 232 200.89V88a16 16 0 0 0-16-16M92.69 56l16 16H40V56ZM216 200H40V88h176Z"/></g></svg></span>
          <span class="zb__name">media</span>
          <span class="zb__size" aria-hidden="true">4.2 GB</span>
        </div>
        <div class="zb__bar" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="82" aria-label="media size" style="--v: .82"><i class="zb__fill"></i></div>
      </li>
      <li class="zb__item" id="zb-2" role="treeitem" aria-level="1" data-v="1.1">
        <div class="zb__row" data-hit tabindex="-1">
          <span class="zb__ico zb__ico--folder" aria-hidden="true"><svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="M128 80H32V56a8 8 0 0 1 8-8h52.69a8 8 0 0 1 5.65 2.34Z" opacity=".2"/><path d="M216 72h-84.69L104 44.69A15.86 15.86 0 0 0 92.69 40H40a16 16 0 0 0-16 16v144.62A15.4 15.4 0 0 0 39.38 216h177.51A15.13 15.13 0 0 0 232 200.89V88a16 16 0 0 0-16-16M92.69 56l16 16H40V56ZM216 200H40V88h176Z"/></g></svg></span>
          <span class="zb__name">docs</span>
          <span class="zb__size" aria-hidden="true">1.1 GB</span>
        </div>
        <div class="zb__bar" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="21" aria-label="docs size" style="--v: .21"><i class="zb__fill"></i></div>
      </li>
      <li class="zb__item" id="zb-3" role="treeitem" aria-level="1" data-v="0.6">
        <div class="zb__row" data-hit tabindex="-1">
          <span class="zb__ico zb__ico--folder" aria-hidden="true"><svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="M128 80H32V56a8 8 0 0 1 8-8h52.69a8 8 0 0 1 5.65 2.34Z" opacity=".2"/><path d="M216 72h-84.69L104 44.69A15.86 15.86 0 0 0 92.69 40H40a16 16 0 0 0-16 16v144.62A15.4 15.4 0 0 0 39.38 216h177.51A15.13 15.13 0 0 0 232 200.89V88a16 16 0 0 0-16-16M92.69 56l16 16H40V56ZM216 200H40V88h176Z"/></g></svg></span>
          <span class="zb__name">src</span>
          <span class="zb__size" aria-hidden="true">0.6 GB</span>
        </div>
        <div class="zb__bar" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="12" aria-label="src size" style="--v: .12"><i class="zb__fill"></i></div>
      </li>
      <li class="zb__item" id="zb-4" role="treeitem" aria-level="1" data-v="0.9">
        <div class="zb__row" data-hit tabindex="-1">
          <span class="zb__ico" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M208 88h-56V32Z" opacity=".2"/><path d="M184 144h-16a8 8 0 0 0-8 8v56a8 8 0 0 0 16 0v-8h8a28 28 0 0 0 0-56m0 40h-8v-24h8a12 12 0 0 1 0 24m-48-32v56a8 8 0 0 1-16 0v-56a8 8 0 0 1 16 0m-40 56a8 8 0 0 1-8 8H56a8 8 0 0 1-7-12l25.16-44H56a8 8 0 0 1 0-16h32a8 8 0 0 1 7 12l-25.21 44H88a8 8 0 0 1 8 8M213.66 82.34l-56-56A8 8 0 0 0 152 24H56a16 16 0 0 0-16 16v72a8 8 0 0 0 16 0V40h88v48a8 8 0 0 0 8 8h48v16a8 8 0 0 0 16 0V88a8 8 0 0 0-2.34-5.66M160 80V51.31L188.69 80Z"/></g></svg></span>
          <span class="zb__name">backup.zip</span>
          <span class="zb__size" aria-hidden="true">0.9 GB</span>
        </div>
        <div class="zb__bar" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="17" aria-label="backup.zip size" style="--v: .17"><i class="zb__fill"></i></div>
      </li>
    </ul>
  </div>
</main>
<script>
// 실제 동작: 폴더를 누르면 그 폴더를 100% 기준으로 막대가 다시 잡힌다.
var root = document.querySelector('.zb');
var tree = document.getElementById('zb-tree');
var title = document.querySelector('.zb__title');
var items = [].slice.call(tree.querySelectorAll('.zb__item'));
var base = null;
function paint() {
  var baseV = base ? parseFloat(base.dataset.v) : 4.2;
  items.forEach(function (li) {
    var v = parseFloat(li.dataset.v);
    var share = base ? Math.min(v / baseV, 1) : (v / 4.2) * .82;
    li.querySelector('.zb__fill').style.transform = 'scaleX(' + share + ')';
    li.querySelector('.zb__bar').setAttribute('aria-valuenow', String(Math.round(share * 100)));
    li.setAttribute('aria-selected', String(base != null && li === base));
  });
  title.textContent = base ? ('Base: ' + base.querySelector('.zb__name').textContent + ' ' + base.dataset.v + ' GB') : 'Storage 6.8 GB';
}
items.forEach(function (li, i) {
  li.querySelector('.zb__row').addEventListener('click', function () {
    root.classList.remove('is-demo');
    tree.setAttribute('aria-activedescendant', li.id);
    base = (base === li) ? null : li;
    paint();
  });
});
tree.addEventListener('keydown', function (e) {
  var at = items.indexOf(document.getElementById(tree.getAttribute('aria-activedescendant')));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    var li = items[Math.max(0, Math.min(at + (e.key === 'ArrowDown' ? 1 : -1), items.length - 1))];
    tree.setAttribute('aria-activedescendant', li.id);
    e.preventDefault();
  } else if (e.key === 'Enter' && at >= 0) {
    root.classList.remove('is-demo');
    base = (base === items[at]) ? null : items[at];
    paint();
    e.preventDefault();
  }
});
</script>
</body>
</html>
