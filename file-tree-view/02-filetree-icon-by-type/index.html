<script>
// 실제 동작: 폴더를 누르면 접히고, 화살표로 줄을 돌아다닌다.
var root = document.querySelector('.ft');
var tree = document.getElementById('ft-tree');
var items = [].slice.call(tree.querySelectorAll('li'));
var at = 0;
function visible(li) {
  var p = li.parentElement;
  while (p && p !== tree) {
    if (p.getAttribute('role') === 'group') {
      if (!p.closest('li').classList.contains('is-open')) return false;
    }
    p = p.parentElement;
  }
  return true;
}
function paint() {
  items.forEach(function (li, i) {
    li.classList.toggle('is-at', i === at);
    if (i === at) tree.setAttribute('aria-activedescendant', li.id);
  });
}
items.forEach(function (li, i) {
  li.querySelector('[data-hit]').addEventListener('click', function () {
    at = i; paint();
    if (!li.classList.contains('is-branch')) return;
    root.classList.remove('is-demo');
    var on = !li.classList.contains('is-open');
    li.classList.toggle('is-open', on);
    li.setAttribute('aria-expanded', String(on));
  });
});
tree.addEventListener('keydown', function (e) {
  var vis = items.filter(visible), k = vis.indexOf(items[at]);
  if (e.key === 'ArrowDown' && k < vis.length - 1) { at = items.indexOf(vis[k + 1]); paint(); e.preventDefault(); }
  else if (e.key === 'ArrowUp' && k > 0) { at = items.indexOf(vis[k - 1]); paint(); e.preventDefault(); }
  else if (e.key === 'Home') { at = items.indexOf(vis[0]); paint(); e.preventDefault(); }
  else if (e.key === 'End') { at = items.indexOf(vis[vis.length - 1]); paint(); e.preventDefault(); }
});
paint();
</script>
