<script>
// 실제 동작: 포인터로 끌어 폴더에 놓는다(마우스·터치). 키보드는 Enter 로 이동 모드.
var root = document.querySelector('.dg');
var list = document.getElementById('dg-list');
var files = [].slice.call(list.querySelectorAll('.dg__i .dg__row'));
var folders = [].slice.call(list.querySelectorAll('.dg__f'));
function clearHot() { folders.forEach(function (f) { f.querySelector('.dg__row').classList.remove('is-hot'); }); }
function bump(f) {
  var n = f.querySelector('.dg__n'), k = f.querySelectorAll('.dg__kids li').length;
  n.textContent = k; n.classList.toggle('dg__n--on', k > 0);
  f.setAttribute('aria-expanded', String(k > 0));
}
function drop(file, folder) {
  folder.querySelector('.dg__kids ul').appendChild(file.closest('li'));
  file.classList.add('is-in');
  setTimeout(function () { file.classList.remove('is-in'); }, 320);
  bump(folder);
}
files.forEach(function (row) {
  row.addEventListener('pointerdown', function (e) {
    if (e.button && e.button !== 0) return;
    root.classList.remove('is-demo');
    var gh = document.querySelector('.dg__ghost').cloneNode(true);
    gh.classList.add('is-live'); gh.removeAttribute('aria-hidden');
    gh.style.left = e.clientX + 'px'; gh.style.top = e.clientY + 'px';
    document.body.appendChild(gh);
    row.setPointerCapture(e.pointerId);
    function mv(ev) {
      gh.style.transform = 'translate(' + (ev.clientX - e.clientX) + 'px,' + (ev.clientY - e.clientY) + 'px) scale(.96)';
      gh.style.left = e.clientX + 'px'; gh.style.top = e.clientY + 'px';
      var hit = document.elementFromPoint(ev.clientX, ev.clientY);
      clearHot();
      var f = hit && hit.closest && hit.closest('.dg__f');
      if (f) f.querySelector('.dg__row').classList.add('is-hot');
    }
    function up(ev) {
      row.removeEventListener('pointermove', mv);
      row.removeEventListener('pointerup', up);
      var hit = document.elementFromPoint(ev.clientX, ev.clientY);
      var f = hit && hit.closest && hit.closest('.dg__f');
      clearHot();
      gh.remove();
      if (f) drop(row, f);
    }
    row.addEventListener('pointermove', mv);
    row.addEventListener('pointerup', up);
    e.preventDefault();
  });
});
var moving = null, moveRow = null;
var rows = [].slice.call(list.querySelectorAll('li[role="treeitem"]'));
rows.forEach(function (li, i) {
  li.querySelector('.dg__row').addEventListener('click', function () { list.setAttribute('aria-activedescendant', li.id); });
});
list.addEventListener('keydown', function (e) {
  if (!moving && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    var cur = rows.indexOf(document.getElementById(list.getAttribute('aria-activedescendant')));
    var nxt = Math.max(0, Math.min(cur + (e.key === 'ArrowDown' ? 1 : -1), rows.length - 1));
    list.setAttribute('aria-activedescendant', rows[nxt].id);
    e.preventDefault();
    return;
  }
  if (moving) {
    var k = folders.indexOf(moving);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      clearHot();
      moving = folders[(k + (e.key === 'ArrowDown' ? 1 : folders.length - 1)) % folders.length];
      moving.querySelector('.dg__row').classList.add('is-hot');
      list.setAttribute('aria-activedescendant', moving.id);
      e.preventDefault();
    } else if (e.key === 'Enter') {
      var f = moving, row = moveRow;
      moving = null; moveRow = null; clearHot();
      if (row) drop(row, f);
      e.preventDefault();
    } else if (e.key === 'Escape') {
      moving = null; moveRow = null; clearHot();
      e.preventDefault();
    }
    return;
  }
  var at = list.getAttribute('aria-activedescendant');
  var li = at && document.getElementById(at);
  if (e.key === 'Enter' && li && li.classList.contains('dg__i')) {
    root.classList.remove('is-demo');
    moving = folders[0]; moveRow = li.querySelector('.dg__row');
    clearHot();
    moving.querySelector('.dg__row').classList.add('is-hot');
    e.preventDefault();
  }
});
</script>
