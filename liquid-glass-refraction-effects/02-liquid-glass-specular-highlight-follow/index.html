<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포인터를 따라 움직이는 하이라이트 반사 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lg is-demo" id="lgRoot" tabindex="0">
  <canvas class="lg__canvas" id="lgCanvas" width="480" height="300"></canvas>
  <p class="lg__caption">포인터가 판 위를 지나가는 위치에 맞춰 밝은 반사 띠가 그 자리로 이동한다</p>
</div>
</main>
<script>
(function () {
  // 기법: 판 대각선 위 위치(0~1)를 좌표로 두고, 포인터가 그 좌표에 있으면 가우시안 형태
  // 밝기 띠(specular)를 더한다. 가장자리는 boxEdgeSample 로 약하게 늘 굴절시켜 유리 느낌을 유지한다.
  var root = document.getElementById('lgRoot');
  var canvas = document.getElementById('lgCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  var CALC_W = 160, CALC_H = 100;
  var SCENE_W = 160;
  var scene = document.createElement('canvas');
  scene.width = SCENE_W; scene.height = CALC_H;
  (function drawScene() {
    var pctx = scene.getContext('2d');
    var rand = seedRand(421021);
    var sky = pctx.createLinearGradient(0, 0, CALC_W, CALC_H);
    sky.addColorStop(0, '#231f28');
    sky.addColorStop(1, '#3a3345');
    pctx.fillStyle = sky;
    pctx.fillRect(0, 0, SCENE_W, CALC_H);
    var cols = ['#5b8cf8', '#b9a0ff', '#ff9ebb'];
    for (var i = 0; i < cols.length; i += 1) {
      pctx.beginPath();
      pctx.arc(SCENE_W * (0.22 + i * 0.3), CALC_H * (0.35 + (i % 2) * 0.3), CALC_H * 0.3, 0, Math.PI * 2);
      pctx.fillStyle = cols[i];
      pctx.globalAlpha = 0.55;
      pctx.fill();
    }
    pctx.globalAlpha = 1;
    for (var k = 0; k < 50; k += 1) {
      var px = rand() * SCENE_W, py = rand() * CALC_H, r = rand() * 1 + 0.3;
      pctx.beginPath();
      pctx.arc(px, py, r, 0, Math.PI * 2);
      pctx.fillStyle = 'rgba(255,255,255,' + (0.08 + rand() * 0.16) + ')';
      pctx.fill();
    }
  }());
  var sceneCtx = scene.getContext('2d');
  var sceneImg = sceneCtx.getImageData(0, 0, SCENE_W, CALC_H);
  var sceneBuf = sceneImg.data;

  function sampleScene(sx, sy) {
    sx = sx < 0 ? 0 : (sx > SCENE_W - 1 ? SCENE_W - 1 : sx);
    sy = sy < 0 ? 0 : (sy > CALC_H - 1 ? CALC_H - 1 : sy);
    var i = (Math.round(sy) * SCENE_W + Math.round(sx)) * 4;
    return [sceneBuf[i], sceneBuf[i + 1], sceneBuf[i + 2]];
  }

  var PANEL_X0 = 20, PANEL_Y0 = 16, PANEL_X1 = 140, PANEL_Y1 = 84;
  var EDGE_BAND = 14;
  var GLASS_EDGE_BEND = 5;
  var HIGHLIGHT_BAND = 0.16;
  var HIGHLIGHT_MAX = 150;
  var DIAG_SPAN = (PANEL_X1 - PANEL_X0) + (PANEL_Y1 - PANEL_Y0);
  var PERIOD_MS = 2000;

  function boxEdgeSample(x, y, x0, y0, x1, y1, band) {
    var dl = x - x0, dr = x1 - x, dt = y - y0, db = y1 - y;
    var dmin = Math.min(dl, dr, dt, db);
    if (dmin >= band || dmin < 0) return { f: 0, nx: 0, ny: 0 };
    var nx = 0, ny = 0;
    if (dl < band) nx -= (band - dl);
    if (dr < band) nx += (band - dr);
    if (dt < band) ny -= (band - dt);
    if (db < band) ny += (band - db);
    var len = Math.sqrt(nx * nx + ny * ny);
    if (len > 0.0001) { nx /= len; ny /= len; }
    return { f: Math.max(0, (band - dmin) / band), nx: nx, ny: ny };
  }

  function virtualCenter(t) {
    return 0.5 + 0.75 * Math.sin(t * 2 * Math.PI / PERIOD_MS);
  }

  var out = document.createElement('canvas');
  out.width = CALC_W; out.height = CALC_H;
  var outCtx = out.getContext('2d');
  var outImg = outCtx.createImageData(CALC_W, CALC_H);
  var outBuf = outImg.data;

  var pointerActive = false;
  var pointerDiag = 0.5;

  function renderFrame(t) {
    var center = pointerActive ? pointerDiag : virtualCenter(t);
    var idx = 0;
    for (var y = 0; y < CALC_H; y += 1) {
      for (var x = 0; x < CALC_W; x += 1) {
        var rgb;
        if (x >= PANEL_X0 && x <= PANEL_X1 && y >= PANEL_Y0 && y <= PANEL_Y1) {
          var e = boxEdgeSample(x, y, PANEL_X0, PANEL_Y0, PANEL_X1, PANEL_Y1, EDGE_BAND);
          var mag = e.f * GLASS_EDGE_BEND;
          rgb = sampleScene(x - e.nx * mag, y - e.ny * mag);
          var d = ((x - PANEL_X0) + (y - PANEL_Y0)) / DIAG_SPAN;
          var diff = (d - center) / HIGHLIGHT_BAND;
          var shine = Math.exp(-diff * diff) * HIGHLIGHT_MAX;
          rgb = [Math.min(255, rgb[0] + shine), Math.min(255, rgb[1] + shine), Math.min(255, rgb[2] + shine)];
        } else {
          rgb = sampleScene(x, y);
        }
        outBuf[idx] = rgb[0]; outBuf[idx + 1] = rgb[1]; outBuf[idx + 2] = rgb[2]; outBuf[idx + 3] = 255;
        idx += 4;
      }
    }
  }

  var cw = 480, ch = 300;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    draw(lastElapsed);
  }

  var lastElapsed = 0;
  function draw(t) {
    lastElapsed = t;
    renderFrame(t);
    outCtx.putImageData(outImg, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(out, 0, 0, CALC_W, CALC_H, 0, 0, cw, ch);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { root.classList.remove('is-demo'); }

  function toGrid(e) {
    var r = wrap.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width * CALC_W,
      y: (e.clientY - r.top) / r.height * CALC_H
    };
  }
  wrap.addEventListener('pointerenter', function () { pointerActive = true; });
  wrap.addEventListener('pointermove', function (e) {
    pointerActive = true;
    var g = toGrid(e);
    pointerDiag = Math.max(-0.3, Math.min(1.3, ((g.x - PANEL_X0) + (g.y - PANEL_Y0)) / DIAG_SPAN));
    if (reduce) draw(lastElapsed);
  });
  wrap.addEventListener('pointerleave', function () { pointerActive = false; if (reduce) draw(lastElapsed); });
  wrap.addEventListener('keydown', function (e) {
    var moved = true;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') pointerDiag = Math.max(-0.3, pointerDiag - 0.08);
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') pointerDiag = Math.min(1.3, pointerDiag + 0.08);
    else moved = false;
    if (moved) {
      e.preventDefault();
      pointerActive = true;
      if (reduce) draw(lastElapsed);
    }
  });

  var lastTs = null;
  var elapsed = 0;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = ts - lastTs;
    lastTs = ts;
    elapsed += dt;
    draw(elapsed);
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  draw(elapsed);
  if (!reduce) requestAnimationFrame(tick);
})();
</script>
</body>
</html>
