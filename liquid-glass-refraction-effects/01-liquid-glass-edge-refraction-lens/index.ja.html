<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>縁だけ背景を歪ませる屈折レンズ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lg is-demo" id="lgRoot" tabindex="0">
  <canvas class="lg__canvas" id="lgCanvas" width="480" height="300"></canvas>
  <p class="lg__caption">中央部は背景がそのまま見え、縁の厚みの分だけ背景が内側へ歪んで見える</p>
</div>
</main>
<script>
(function () {
  // 기법: 유리 판 사각형의 가장자리 거리(사각 SDF 근사)를 재고, 그 거리로 만든 법선 방향을
  // 따라 배경 샘플 좌표를 안쪽으로 밀어(굴절 오프셋) putImageData 로 그린다. 판 중심은 배경 그대로.
  var root = document.getElementById('lgRoot');
  var canvas = document.getElementById('lgCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  var CALC_W = 160, CALC_H = 100;
  var SCENE_W = 260;
  var scene = document.createElement('canvas');
  scene.width = SCENE_W; scene.height = CALC_H;
  (function drawScene() {
    var pctx = scene.getContext('2d');
    var rand = seedRand(421011);
    var sky = pctx.createLinearGradient(0, 0, 0, CALC_H);
    sky.addColorStop(0, '#dfe8ff');
    sky.addColorStop(1, '#f7f0ff');
    pctx.fillStyle = sky;
    pctx.fillRect(0, 0, SCENE_W, CALC_H);
    var glow = pctx.createRadialGradient(SCENE_W * 0.3, CALC_H * 0.2, 0, SCENE_W * 0.3, CALC_H * 0.2, CALC_H * 0.9);
    glow.addColorStop(0, 'rgba(255,255,255,.6)');
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    pctx.fillStyle = glow;
    pctx.fillRect(0, 0, SCENE_W, CALC_H);
    var bands = ['#b9a0ff', '#6ec8ff', '#4cd4a6'];
    for (var i = 0; i < bands.length; i += 1) {
      var baseY = CALC_H * (0.42 + i * 0.17);
      pctx.beginPath();
      pctx.moveTo(0, CALC_H);
      var step = 6;
      for (var x = 0; x <= SCENE_W; x += step) {
        var n = Math.sin(x * 0.05 + i * 2.1) * CALC_H * 0.05;
        pctx.lineTo(x, baseY + n);
      }
      pctx.lineTo(SCENE_W, CALC_H);
      pctx.closePath();
      pctx.fillStyle = bands[i];
      pctx.fill();
    }
    for (var k = 0; k < 60; k += 1) {
      var px = rand() * SCENE_W, py = rand() * CALC_H, r = rand() * 1.1 + 0.4;
      pctx.beginPath();
      pctx.arc(px, py, r, 0, Math.PI * 2);
      pctx.fillStyle = 'rgba(255,255,255,' + (0.1 + rand() * 0.2) + ')';
      pctx.fill();
    }
  }());
  var sceneCtx = scene.getContext('2d');
  var sceneImg = sceneCtx.getImageData(0, 0, SCENE_W, CALC_H);
  var sceneBuf = sceneImg.data;

  function sampleScene(sx, sy) {
    sx = sx < 0 ? 0 : (sx > SCENE_W - 1 ? SCENE_W - 1 : sx);
    sy = sy < 0 ? 0 : (sy > CALC_H - 1 ? CALC_H - 1 : sy);
    var i = (Math.round(sy) * SCENE_W + Math.round(sx)) * 4;
    return [sceneBuf[i], sceneBuf[i + 1], sceneBuf[i + 2]];
  }

  var PANEL_X0 = 20, PANEL_Y0 = 16, PANEL_X1 = 140, PANEL_Y1 = 84;
  var EDGE_BAND = 16;
  var GLASS_REFRACTION_STRENGTH = 8;
  var SCENE_OFFSET_X = (SCENE_W - CALC_W) / 2;
  var PAN_AMP = 34;
  var PERIOD_MS = 2000;

  function boxEdgeSample(x, y, x0, y0, x1, y1, band) {
    var dl = x - x0, dr = x1 - x, dt = y - y0, db = y1 - y;
    var dmin = Math.min(dl, dr, dt, db);
    if (dmin >= band || dmin < 0) return { f: 0, nx: 0, ny: 0 };
    var nx = 0, ny = 0;
    if (dl < band) nx -= (band - dl);
    if (dr < band) nx += (band - dr);
    if (dt < band) ny -= (band - dt);
    if (db < band) ny += (band - db);
    var len = Math.sqrt(nx * nx + ny * ny);
    if (len > 0.0001) { nx /= len; ny /= len; }
    return { f: Math.max(0, (band - dmin) / band), nx: nx, ny: ny };
  }

  function panX(t) {
    return PAN_AMP * Math.sin(t * 2 * Math.PI / PERIOD_MS);
  }

  var out = document.createElement('canvas');
  out.width = CALC_W; out.height = CALC_H;
  var outCtx = out.getContext('2d');
  var outImg = outCtx.createImageData(CALC_W, CALC_H);
  var outBuf = outImg.data;

  function renderFrame(t) {
    var pan = panX(t);
    var idx = 0;
    for (var y = 0; y < CALC_H; y += 1) {
      for (var x = 0; x < CALC_W; x += 1) {
        var baseSx = x + SCENE_OFFSET_X + pan;
        var rgb;
        if (x >= PANEL_X0 && x <= PANEL_X1 && y >= PANEL_Y0 && y <= PANEL_Y1) {
          var e = boxEdgeSample(x, y, PANEL_X0, PANEL_Y0, PANEL_X1, PANEL_Y1, EDGE_BAND);
          var ripple = Math.sin((x + y) * 0.12 - t * 0.006) * 0.25 * e.f;
          var mag = (e.f + ripple) * GLASS_REFRACTION_STRENGTH;
          rgb = sampleScene(baseSx - e.nx * mag, y - e.ny * mag);
          var shine = e.f * 26 - Math.max(0, ripple) * 10;
          rgb = [Math.min(255, rgb[0] + shine), Math.min(255, rgb[1] + shine), Math.min(255, rgb[2] + shine)];
        } else {
          rgb = sampleScene(baseSx, y);
        }
        outBuf[idx] = rgb[0]; outBuf[idx + 1] = rgb[1]; outBuf[idx + 2] = rgb[2]; outBuf[idx + 3] = 255;
        idx += 4;
      }
    }
  }

  var cw = 480, ch = 300;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    draw(lastElapsed);
  }

  var lastElapsed = 0;
  function draw(t) {
    lastElapsed = t;
    renderFrame(t);
    outCtx.putImageData(outImg, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(out, 0, 0, CALC_W, CALC_H, 0, 0, cw, ch);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { root.classList.remove('is-demo'); }

  var lastTs = null;
  var elapsed = 0;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = ts - lastTs;
    lastTs = ts;
    elapsed += dt;
    draw(elapsed);
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  draw(elapsed);
  if (!reduce) requestAnimationFrame(tick);
})();
</script>
</body>
</html>
