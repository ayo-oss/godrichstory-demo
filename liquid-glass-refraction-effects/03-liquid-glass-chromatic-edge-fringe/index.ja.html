<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>縁で色がにじんで見えるガラス — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lg is-demo" id="lgRoot" tabindex="0">
  <canvas class="lg__canvas" id="lgCanvas" width="480" height="300"></canvas>
  <p class="lg__caption">板の縁に近づくほど背景の色が赤・緑・青にわずかにずれて重なって見える</p>
</div>
</main>
<script>
(function () {
  // 기법: boxEdgeSample 로 가장자리 거리·법선을 구하고, 채널마다 오프셋에 GLASS_CHROMA_SHIFT_PX
  // 만큼을 더하고 빼 R·G·B 를 따로 샘플링한다 — 색분리(색수차)를 채널별 굴절 오프셋 차로 만든다.
  var root = document.getElementById('lgRoot');
  var canvas = document.getElementById('lgCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  var CALC_W = 160, CALC_H = 100;
  var SCENE_W = 260;
  var scene = document.createElement('canvas');
  scene.width = SCENE_W; scene.height = CALC_H;
  (function drawScene() {
    var pctx = scene.getContext('2d');
    var rand = seedRand(421031);
    var sky = pctx.createLinearGradient(0, 0, 0, CALC_H);
    sky.addColorStop(0, '#fff2da');
    sky.addColorStop(1, '#ffd9c2');
    pctx.fillStyle = sky;
    pctx.fillRect(0, 0, SCENE_W, CALC_H);
    var cols = ['#2f6df6', '#4cd4a6', '#b9a0ff'];
    for (var i = 0; i < cols.length; i += 1) {
      var cx = SCENE_W * (0.18 + i * 0.32), cy = CALC_H * (0.3 + (i % 2) * 0.35);
      pctx.beginPath();
      pctx.arc(cx, cy, CALC_H * 0.28, 0, Math.PI * 2);
      pctx.fillStyle = cols[i];
      pctx.fill();
    }
    for (var k = 0; k < 50; k += 1) {
      var px = rand() * SCENE_W, py = rand() * CALC_H, r = rand() * 1 + 0.3;
      pctx.beginPath();
      pctx.arc(px, py, r, 0, Math.PI * 2);
      pctx.fillStyle = 'rgba(255,255,255,' + (0.1 + rand() * 0.2) + ')';
      pctx.fill();
    }
  }());
  var sceneCtx = scene.getContext('2d');
  var sceneImg = sceneCtx.getImageData(0, 0, SCENE_W, CALC_H);
  var sceneBuf = sceneImg.data;

  function sampleChannel(sx, sy, ch) {
    sx = sx < 0 ? 0 : (sx > SCENE_W - 1 ? SCENE_W - 1 : sx);
    sy = sy < 0 ? 0 : (sy > CALC_H - 1 ? CALC_H - 1 : sy);
    var i = (Math.round(sy) * SCENE_W + Math.round(sx)) * 4;
    return sceneBuf[i + ch];
  }

  var PANEL_X0 = 20, PANEL_Y0 = 16, PANEL_X1 = 140, PANEL_Y1 = 84;
  var EDGE_BAND = 18;
  var GLASS_BASE_BEND = 6;
  var GLASS_CHROMA_SHIFT_PX = 1;
  var SCENE_OFFSET_X = (SCENE_W - CALC_W) / 2;
  var PAN_AMP = 30;
  var PERIOD_MS = 2000;

  function boxEdgeSample(x, y, x0, y0, x1, y1, band) {
    var dl = x - x0, dr = x1 - x, dt = y - y0, db = y1 - y;
    var dmin = Math.min(dl, dr, dt, db);
    if (dmin >= band || dmin < 0) return { f: 0, nx: 0, ny: 0 };
    var nx = 0, ny = 0;
    if (dl < band) nx -= (band - dl);
    if (dr < band) nx += (band - dr);
    if (dt < band) ny -= (band - dt);
    if (db < band) ny += (band - db);
    var len = Math.sqrt(nx * nx + ny * ny);
    if (len > 0.0001) { nx /= len; ny /= len; }
    return { f: Math.max(0, (band - dmin) / band), nx: nx, ny: ny };
  }

  function panX(t) {
    return PAN_AMP * Math.sin(t * 2 * Math.PI / PERIOD_MS);
  }

  var out = document.createElement('canvas');
  out.width = CALC_W; out.height = CALC_H;
  var outCtx = out.getContext('2d');
  var outImg = outCtx.createImageData(CALC_W, CALC_H);
  var outBuf = outImg.data;

  function renderFrame(t) {
    var pan = panX(t);
    var idx = 0;
    for (var y = 0; y < CALC_H; y += 1) {
      for (var x = 0; x < CALC_W; x += 1) {
        var baseSx = x + SCENE_OFFSET_X + pan;
        if (x >= PANEL_X0 && x <= PANEL_X1 && y >= PANEL_Y0 && y <= PANEL_Y1) {
          var e = boxEdgeSample(x, y, PANEL_X0, PANEL_Y0, PANEL_X1, PANEL_Y1, EDGE_BAND);
          var mag = e.f * GLASS_BASE_BEND;
          var chroma = e.f * GLASS_CHROMA_SHIFT_PX * 6;
          var rC = sampleChannel(baseSx - e.nx * (mag + chroma), y - e.ny * (mag + chroma), 0);
          var gC = sampleChannel(baseSx - e.nx * mag, y - e.ny * mag, 1);
          var bC = sampleChannel(baseSx - e.nx * (mag - chroma), y - e.ny * (mag - chroma), 2);
          outBuf[idx] = rC; outBuf[idx + 1] = gC; outBuf[idx + 2] = bC;
        } else {
          outBuf[idx] = sampleChannel(baseSx, y, 0);
          outBuf[idx + 1] = sampleChannel(baseSx, y, 1);
          outBuf[idx + 2] = sampleChannel(baseSx, y, 2);
        }
        outBuf[idx + 3] = 255;
        idx += 4;
      }
    }
  }

  var cw = 480, ch = 300;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    draw(lastElapsed);
  }

  var lastElapsed = 0;
  function draw(t) {
    lastElapsed = t;
    renderFrame(t);
    outCtx.putImageData(outImg, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(out, 0, 0, CALC_W, CALC_H, 0, 0, cw, ch);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { root.classList.remove('is-demo'); }

  var lastTs = null;
  var elapsed = 0;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = ts - lastTs;
    lastTs = ts;
    elapsed += dt;
    draw(elapsed);
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  draw(elapsed);
  if (!reduce) requestAnimationFrame(tick);
})();
</script>
</body>
</html>
