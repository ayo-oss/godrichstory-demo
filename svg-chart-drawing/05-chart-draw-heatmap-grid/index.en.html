<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>칸이 순서대로 물드는 히트맵 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ch is-demo" id="ch">
  <div class="ch__card">
    <div class="ch__head">
      <p class="ch__title">Visits by day and hour</p>
      <span class="ch__chip">One hue, varying depth</span>
    </div>
    <div class="ch__plot">
      <svg class="ch__svg" id="chart" viewBox="0 0 440 178" role="img" aria-label="Heatmap of visits by day and hour: Sunday 2-6 PM is highest at 92">
        <!-- 시간대 라벨 6 — 열 위 -->
        <g class="ch__bands" id="bands"></g>
        <!-- Day 라벨 7 — 왼쪽 -->
        <g class="ch__days" id="days"></g>
        <!-- 칸 42 + 가장 짙은 칸의 숫자 라벨. 미리보기 퇴장 와이프가 이 그룹 전체를 친다 -->
        <g class="ch__grid" id="grid"></g>
      </svg>
      <!-- 툴팁 — 칸 위(위 두 줄은 아래로)에 뜬다 -->
      <div class="ch__tip" id="tip" aria-hidden="true"><span class="ch__tipDay" id="tipDay"></span><span class="ch__tipBand" id="tipBand"></span><strong class="ch__tipVal" id="tipVal"></strong></div>
      <!-- 스크린리더용 데이터 표 — 화면에 안 보인다 -->
      <table class="ch__sr">
        <caption>Visits by day and hour</caption>
        <thead><tr><th>Day</th><th>0-6h</th><th>6-10h</th><th>10-14h</th><th>14-18h</th><th>18-22h</th><th>22-24h</th></tr></thead>
        <tbody id="srBody"></tbody>
      </table>
    </div>
    <!-- 범례 — 옅음에서 짙음. 오른쪽은 이 데모의 주제인 농도 함수식 -->
    <div class="ch__legend">
      <span class="ch__lgWord">Low</span>
      <span class="ch__lgBar" aria-hidden="true"></span>
      <span class="ch__lgWord">High</span>
      <span class="ch__lgExp">0.12 + 0.88 × v / 100</span>
    </div>
  </div>
</div>
</main>
<script>
var DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
var DAY_S = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
var BANDS = ['0-6h', '6-10h', '10-14h', '14-18h', '18-22h', '22-24h'];
// 밀도 0-100 — 평일 새벽은 비고 주말 오후로 갈수록 짙어진다
var DENS = [
  [8, 22, 38, 42, 30, 12],
  [7, 25, 41, 45, 33, 13],
  [9, 24, 40, 44, 31, 11],
  [8, 26, 43, 47, 35, 14],
  [10, 28, 46, 58, 62, 30],
  [14, 20, 52, 78, 88, 46],
  [12, 18, 48, 92, 84, 38]
];
var X0 = 46, CW = 60, GX = 64;      // 열: 칸 폭 60, 간격 4
var Y0 = 20, CH = 18, GY = 21;      // 줄: 칸 높이 18, 간격 3
var NS = 'http://www.w3.org/2000/svg';
var ch = document.getElementById('ch');
var svg = document.getElementById('chart');
var tip = document.getElementById('tip');
var tipDay = document.getElementById('tipDay');
var tipBand = document.getElementById('tipBand');
var tipVal = document.getElementById('tipVal');

function mk(tag) { return document.createElementNS(NS, tag); }

// 농도 함수 — 이 데모의 주제. 색은 한 가지로 고정하고 투명도만 값에 비례해 움직인다
function fillOpacity(v) { return 0.12 + 0.88 * v / 100; }

// 시간대·Day 라벨
var bands = document.getElementById('bands');
BANDS.forEach(function (b, c) {
  var t = mk('text');
  t.setAttribute('class', 'ch__band');
  t.setAttribute('x', X0 + c * GX + CW / 2); t.setAttribute('y', 10); t.setAttribute('text-anchor', 'middle');
  t.textContent = b; bands.appendChild(t);
});
var days = document.getElementById('days');
DAYS.forEach(function (d, r) {
  var t = mk('text');
  t.setAttribute('class', 'ch__day');
  t.setAttribute('x', 38); t.setAttribute('y', Y0 + r * GY + CH / 2); t.setAttribute('text-anchor', 'end');
  t.textContent = DAY_S[r]; days.appendChild(t);
});

// 칸 42개 — 읽는 순서(좌에서 우, 위에서 아래)로 --d 지연을 단다
var grid = document.getElementById('grid');
var flat = 0;
DENS.forEach(function (row, r) {
  row.forEach(function (v, c) {
    var rect = mk('rect');
    rect.setAttribute('class', 'ch__cell');
    rect.setAttribute('x', X0 + c * GX); rect.setAttribute('y', Y0 + r * GY);
    rect.setAttribute('width', CW); rect.setAttribute('height', CH); rect.setAttribute('rx', 4);
    rect.setAttribute('fill-opacity', fillOpacity(v).toFixed(3));
    rect.setAttribute('data-r', r); rect.setAttribute('data-c', c);
    rect.style.setProperty('--d', (flat * 0.028).toFixed(3) + 's');
    grid.appendChild(rect);
    if (v >= 84) {   // 가장 짙은 칸에는 숫자를 Direct 새긴다 — 색만으론 정확한 값을 읽을 Wed 없다
      // 짙은 칸(농도 .86~.93) 위에서는 크림도 잉크도 AA 를 못 넘는다 — 얕은 페이퍼 알약을
      // 숫자 밑에 깔고 그 위에 잉크로 쓴다. 알약은 숫자와 같은 지연으로 함께 팝한다
      var cx = X0 + c * GX + CW / 2, cy = Y0 + r * GY + CH / 2;
      var dn = (flat * 0.028 + 0.12).toFixed(3) + 's';
      var pad = mk('rect');
      pad.setAttribute('class', 'ch__numBg');
      pad.setAttribute('x', cx - 12); pad.setAttribute('y', cy - 7);
      pad.setAttribute('width', 24); pad.setAttribute('height', 14); pad.setAttribute('rx', 4);
      pad.style.setProperty('--dn', dn);
      grid.appendChild(pad);
      var tx = mk('text');
      tx.setAttribute('class', 'ch__num');
      tx.setAttribute('x', cx); tx.setAttribute('y', cy);
      tx.setAttribute('text-anchor', 'middle');
      tx.textContent = v;
      tx.style.setProperty('--dn', dn);
      grid.appendChild(tx);
    }
    flat++;
  });
});

// 스크린리더 표 채우기
var srBody = document.getElementById('srBody');
DENS.forEach(function (row, r) {
  var tr = document.createElement('tr');
  var th = document.createElement('th'); th.setAttribute('scope', 'row'); th.textContent = DAYS[r];
  tr.appendChild(th);
  row.forEach(function (v) { var td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
  srBody.appendChild(tr);
});

// 툴팁 — 칸 윗변에 맞춰 위로 뜨고, 위 두 줄은 아래로 띄운다. 처음 값은 가장 짙은 칸(Sunday 14-18h)
function placeTip(r, c) {
  var below = r < 2;
  tip.style.left = ((X0 + c * GX + CW / 2) / 440 * 100).toFixed(2) + '%';
  tip.style.top = ((Y0 + r * GY + (below ? CH : 0)) / 178 * 100).toFixed(2) + '%';
  tip.classList.toggle('is-below', below);
  tipDay.textContent = DAYS[r];
  tipBand.textContent = BANDS[c];
  tipVal.textContent = DENS[r][c];
}
placeTip(6, 3);

// 칸에 포인터가 오면 Day·시간대·밀도를 보여 준다
grid.addEventListener('pointermove', function (e) {
  if (ch.classList.contains('is-demo')) { ch.classList.remove('is-demo'); }
  var t = e.target;
  if (t.classList && t.classList.contains('ch__cell')) {
    placeTip(+t.getAttribute('data-r'), +t.getAttribute('data-c'));
    tip.classList.add('is-on');
  }
});
grid.addEventListener('pointerleave', function () { tip.classList.remove('is-on'); });
</script>
</body>
</html>
