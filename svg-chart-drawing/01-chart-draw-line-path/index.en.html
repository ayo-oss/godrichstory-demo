<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>펜처럼 그려지는 선 그래프 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cd is-demo" id="cd">
  <div class="cd__card">
    <div class="cd__head">
      <p class="cd__title">Monthly visits</p>
      <span class="cd__chip">Last 12 months</span>
    </div>
    <div class="cd__plot" id="plot">
      <svg class="cd__svg" id="chart" viewBox="0 0 440 190" role="img" aria-label="Line chart of monthly visits over 12 months, peaking at 842 in November">
        <!-- 가로 격자 4단 — y 스케일 눈금(200/400/600/800)과 같은 간격 -->
        <g class="cd__grid">
          <line x1="34" y1="10"  x2="432" y2="10"></line>
          <line x1="34" y1="56"  x2="432" y2="56"></line>
          <line x1="34" y1="102" x2="432" y2="102"></line>
          <line x1="34" y1="148" x2="432" y2="148"></line>
        </g>
        <g class="cd__ticks">
          <text x="28" y="14">800</text>
          <text x="28" y="60">600</text>
          <text x="28" y="106">400</text>
          <text x="28" y="152">200</text>
        </g>
        <!-- 밑변 Axis -->
        <line class="cd__axis" x1="34" y1="148" x2="432" y2="148"></line>
        <g class="cd__labels">
          <text x="34"  y="170">Jan</text>
          <text x="69"  y="170">Feb</text>
          <text x="104" y="170">Mar</text>
          <text x="139" y="170">Apr</text>
          <text x="174" y="170">May</text>
          <text x="209" y="170">Jun</text>
          <text x="244" y="170">Jul</text>
          <text x="279" y="170">Aug</text>
          <text x="314" y="170">Sep</text>
          <text x="349" y="170">Oct</text>
          <text x="384" y="170">Nov</text>
          <text x="419" y="170">Dec</text>
        </g>
        <!-- 영역 채움 — 라인 아래 옅은 파랑 면. JS 가 d 를 채운다 -->
        <path class="cd__area" id="area" d=""></path>
        <!-- 주인공 라인. pathLength=100 이라 dashoffset 애니메이션이 길이와 무관하게 0~100으로 돈다 -->
        <path class="cd__line" id="line" pathLength="100" d=""></path>
        <!-- 최고점 마커 — 호버 점과 같은 모양. JS 가 위치시킨다 -->
        <circle class="cd__peak" id="peak" r="4" cx="0" cy="0"></circle>
      </svg>
      <!-- 툴팁 — plot 안에서 절대 배치. 아래로 삐져나가지 않게 위쪽에만 뜬다 -->
      <div class="cd__tip" id="tip" aria-hidden="true"><span class="cd__tipMon" id="tipMon">Nov</span><strong class="cd__tipVal" id="tipVal">842</strong></div>
      <!-- 스크린리더용 데이터 표 — 화면에 안 보인다 -->
      <table class="cd__sr">
        <caption>Monthly visits</caption>
        <thead><tr><th>Mon</th><th>Visits</th></tr></thead>
        <tbody id="srBody"></tbody>
      </table>
    </div>
  </div>
</div>
</main>
<script>
var DATA = [430, 510, 620, 590, 545, 610, 660, 705, 690, 760, 842, 815];
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var PAD_L = 34, PAD_R = 432, TOP = 10, BASE = 148;   // viewBox 좌표
var MAX_Y = 900;   // y 스케일 상한 — 눈금 200 간격과 맞춘 값
var cd = document.getElementById('cd');
var plot = document.getElementById('plot');
var svg = document.getElementById('chart');
var line = document.getElementById('line');
var area = document.getElementById('area');
var peak = document.getElementById('peak');
var tip = document.getElementById('tip');
var tipMon = document.getElementById('tipMon');
var tipVal = document.getElementById('tipVal');

// 스케일 함수 — 데이터 값 → viewBox 좌표. 이 두 함수가 그래프의 전부다
function scaleX(i) { return PAD_L + (PAD_R - PAD_L) * i / (DATA.length - 1); }
function scaleY(v) { return BASE - (BASE - TOP) * v / MAX_Y; }

// 인접 점의 중점을 잇고 실제 점은 제어점으로 쓰는 부드러운 선 — 꺾임이 살면서 물결지지 않는다
function buildPath() {
  var pts = DATA.map(function (v, i) { return [scaleX(i), scaleY(v)]; });
  var d = 'M' + pts[0][0] + ',' + pts[0][1];
  for (var i = 1; i < pts.length - 1; i++) {
    var mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    d += ' Q' + pts[i][0] + ',' + pts[i][1] + ' ' + mx + ',' + my;
  }
  var last = pts[pts.length - 1];
  d += ' L' + last[0] + ',' + last[1];
  return d;
}

var pathD = buildPath();
line.setAttribute('d', pathD);
area.setAttribute('d', pathD + ' L' + PAD_R + ',' + BASE + ' L' + PAD_L + ',' + BASE + ' Z');

var peakIdx = DATA.indexOf(Math.max.apply(null, DATA));
var px = scaleX(peakIdx), py = scaleY(DATA[peakIdx]);
peak.setAttribute('cx', px); peak.setAttribute('cy', py);

// 스크린리더 표 채우기
var srBody = document.getElementById('srBody');
DATA.forEach(function (v, i) {
  var tr = document.createElement('tr');
  var th = document.createElement('th'); th.setAttribute('scope', 'row'); th.textContent = MON[i];
  var td = document.createElement('td'); td.textContent = v;
  tr.appendChild(th); tr.appendChild(td); srBody.appendChild(tr);
});

// 툴팁을 viewBox x 좌표에 맞춰 놓는다 — plot 은 SVG 왈폭이므로 비율로 환산
function moveTip(i) {
  var ratio = scaleX(i) / 440;
  tip.style.left = (ratio * 100) + '%';
  tipMon.textContent = MON[i];
  tipVal.textContent = DATA[i].toLocaleString();
}

// 사람이 조작하면 미리보기 루프를 끄고 진짜 툴팁이 움직인다
svg.addEventListener('pointermove', function (e) {
  if (cd.classList.contains('is-demo')) { cd.classList.remove('is-demo'); }
  var r = svg.getBoundingClientRect();
  var vx = (e.clientX - r.left) / r.width * 440;   // 화면 좌표 → viewBox 좌표
  var i = Math.round((vx - PAD_L) / ((PAD_R - PAD_L) / (DATA.length - 1)));
  i = Math.max(0, Math.min(DATA.length - 1, i));
  peak.setAttribute('cx', scaleX(i)); peak.setAttribute('cy', scaleY(DATA[i]));
  moveTip(i);
  tip.classList.add('is-on');
});
svg.addEventListener('pointerleave', function () {
  tip.classList.remove('is-on');
  peak.setAttribute('cx', px); peak.setAttribute('cy', py);   // 최고점으로 돌아간다
});
</script>
</body>
</html>
