<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 조각씩 그려지는 도넛 그래프 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cn is-demo" id="cn">
  <div class="cn__card">
    <div class="cn__head">
      <p class="cn__title">Traffic Sources</p>
      <span class="cn__chip">Last 7 Days</span>
    </div>
    <div class="cn__body">
      <div class="cn__plot" id="plot">
        <svg class="cn__svg" viewBox="0 0 180 180" role="img" aria-label="Traffic source donut chart, search leads at 46%">
          <!-- 조각은 실제 원호 path — JS 가 arcPath() 로 d 를 계산해 심는다 -->
          <g id="slices"></g>
          <!-- 중앙 Total 라벨 -->
          <text class="cn__sumLabel" x="90" y="82">Total</text>
          <text class="cn__sumVal" x="90" y="104">100%</text>
        </svg>
        <!-- 툴팁 — plot 안에서 절대 배치, 조각 위 커서를 따라온다 -->
        <div class="cn__tip" id="tip" aria-hidden="true"><span class="cn__tipCh" id="tipCh">Search</span><strong class="cn__tipVal" id="tipVal">46%</strong></div>
        <!-- 스크린리더용 데이터 표 — 화면에 안 보인다 -->
        <table class="cn__sr">
          <caption>Traffic Sources</caption>
          <thead><tr><th>Channel</th><th>Share</th></tr></thead>
          <tbody id="srBody"></tbody>
        </table>
      </div>
      <!-- 범례 — 색점과 채널명과 비율을 한 줄에. 색만으로 구분하지 않는다 -->
      <ul class="cn__legend" id="legend"></ul>
    </div>
  </div>
</div>
</main>
<script>
var DATA = [['Search', 46], ['Direct', 27], ['Social', 17], ['Other', 10]];
var CX = 90, CY = 90, R = 60;             // 도넛 중심과 반지름 (viewBox 좌표)
var GAP = 2 / R;                          // 조각 사이 2px 간격을 각도로 환산 — 크림 배경이 이 틈으로 보인다
var SVGNS = 'http://www.w3.org/2000/svg';
var cn = document.getElementById('cn');
var plot = document.getElementById('plot');
var tip = document.getElementById('tip');
var tipCh = document.getElementById('tipCh');
var tipVal = document.getElementById('tipVal');
var slices = document.getElementById('slices');
var legend = document.getElementById('legend');

// 시작·끝 각도(라디안)로 원호 path 한 조각 — M 으로 붓을 대고 A 로 호를 긋는다.
// rotateY 3D 뒤집기 같은 효과는 쓰지 않는다 — |cos θ| 함정 없이 평면 원호만으로 그린다
function arcPath(a0, a1) {
  var x0 = (CX + R * Math.cos(a0)).toFixed(2), y0 = (CY + R * Math.sin(a0)).toFixed(2);
  var x1 = (CX + R * Math.cos(a1)).toFixed(2), y1 = (CY + R * Math.sin(a1)).toFixed(2);
  var large = (a1 - a0) > Math.PI ? 1 : 0;   // 180도 넘는 호에만 큰 호 플래그
  return 'M' + x0 + ',' + y0 + ' A' + R + ',' + R + ' 0 ' + large + ' 1 ' + x1 + ',' + y1;
}

// 툴팁을 커서 위에 놓는다
function moveTip(e) {
  var r = plot.getBoundingClientRect();
  tip.style.left = (e.clientX - r.left) + 'px';
  tip.style.top = (e.clientY - r.top) + 'px';
}

// 12시에서 시작해 시계 방향으로 Channel 비율만큼씩 각도를 쓴다
var angle = -Math.PI / 2;
DATA.forEach(function (d, i) {
  var span = d[1] / 100 * Math.PI * 2;
  var p = document.createElementNS(SVGNS, 'path');
  p.setAttribute('class', 'cn__slice');
  p.setAttribute('d', arcPath(angle + GAP / 2, angle + span - GAP / 2));
  p.setAttribute('pathLength', '100');
  p.style.setProperty('--d', (i * .24).toFixed(2) + 's');
  p.addEventListener('pointerenter', function (e) {
    if (cn.classList.contains('is-demo')) { cn.classList.remove('is-demo'); }
    tipCh.textContent = d[0]; tipVal.textContent = d[1] + '%';
    moveTip(e);
    tip.classList.add('is-on');
  });
  p.addEventListener('pointermove', moveTip);
  p.addEventListener('pointerleave', function () { tip.classList.remove('is-on'); });
  slices.appendChild(p);
  angle += span;
});

// 범례 — 도넛이 다 그려진 뒤 넷이 한 번에 나타난다 (CSS 가 시점을 잡는다)
DATA.forEach(function (d) {
  var li = document.createElement('li');
  li.className = 'cn__item';
  li.innerHTML = '<span class="cn__dot"></span><span class="cn__name">' + d[0] +
    '</span><span class="cn__pct">' + d[1] + '%</span>';
  legend.appendChild(li);
});

// 스크린리더용 표 채우기
var srBody = document.getElementById('srBody');
DATA.forEach(function (d) {
  var tr = document.createElement('tr');
  var th = document.createElement('th'); th.setAttribute('scope', 'row'); th.textContent = d[0];
  var td = document.createElement('td'); td.textContent = d[1] + '%';
  tr.appendChild(th); tr.appendChild(td); srBody.appendChild(tr);
});
</script>
</body>
</html>
