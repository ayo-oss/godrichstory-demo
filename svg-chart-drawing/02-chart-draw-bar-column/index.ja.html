<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자라나는 세로 막대 그래프 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cb is-demo" id="cb">
  <div class="cb__card">
    <div class="cb__head">
      <p class="cb__title">週間売上</p>
      <span class="cb__chip">単位: 万ウォン</span>
    </div>
    <div class="cb__plot" id="plot">
      <svg class="cb__svg" id="chart" viewBox="0 0 440 200" role="img" aria-label="週間売上の棒グラフ。土曜の620万ウォンが最高">
        <!-- 가로 격자 3단 — y 스케일 눈금(200/400/600)과 같은 간격 -->
        <g class="cb__grid">
          <line x1="34" y1="34.9"  x2="432" y2="34.9"></line>
          <line x1="34" y1="76.6"  x2="432" y2="76.6"></line>
          <line x1="34" y1="118.3" x2="432" y2="118.3"></line>
        </g>
        <g class="cb__ticks">
          <text x="28" y="34.9">600</text>
          <text x="28" y="76.6">400</text>
          <text x="28" y="118.3">200</text>
        </g>
        <!-- 밑변 軸 — 막대의 baseline -->
        <line class="cb__axis" x1="34" y1="160" x2="432" y2="160"></line>
        <!-- 막대·값 라벨·曜日 라벨은 JS 가 viewBox 좌표로 심는다 -->
        <g class="cb__days" id="days"></g>
        <g class="cb__cells" id="cells"></g>
      </svg>
      <!-- 툴팁 — plot 안에서 절대 배치, 막대 위에 뜬다. 미리보기에선 최고 막대 위 -->
      <div class="cb__tip" id="tip" aria-hidden="true"><span class="cb__tipDay" id="tipDay">土</span><strong class="cb__tipVal" id="tipVal">620万ウォン</strong></div>
      <!-- 스크린리더용 데이터 표 — 화면에 안 보인다 -->
      <table class="cb__sr">
        <caption>週間売上</caption>
        <thead><tr><th>曜日</th><th>売上 (万ウォン)</th></tr></thead>
        <tbody id="srBody"></tbody>
      </table>
    </div>
  </div>
</div>
</main>
<script>
var DATA = [320, 410, 380, 505, 460, 620, 545];
var DAY = ['月', '火', '水', '木', '金', '土', '日'];
var VW = 440, VH = 200;                       // viewBox 크기
var PAD_L = 34, PAD_R = 432, TOP = 14, BASE = 160;   // 그림 영역 좌표 (BASE 가 밑변 軸)
var MAX_Y = 700, BAR_W = 30;                  // y 상한 — 눈금 200 간격과 맞춘 값
var SVGNS = 'http://www.w3.org/2000/svg';
var cb = document.getElementById('cb');
var svg = document.getElementById('chart');
var tip = document.getElementById('tip');
var tipDay = document.getElementById('tipDay');
var tipVal = document.getElementById('tipVal');

// 데이터 값 → viewBox 좌표. 막대 그래프의 핵심은 이 두 함수다
function scaleY(v) { return BASE - (BASE - TOP) * v / MAX_Y; }
function band() { return (PAD_R - PAD_L) / DATA.length; }          // 막대 하나가 차지하는 폭
function centerX(i) { return PAD_L + band() * (i + .5); }          // 막대 중심 = 라벨 위치

// SVG 자식을 만드는 헬퍼 — 속성만 채워 부모에 붙인다
function el(name, attrs, parent) {
  var n = document.createElementNS(SVGNS, name);
  for (var k in attrs) { n.setAttribute(k, attrs[k]); }
  parent.appendChild(n);
  return n;
}

var peakIdx = DATA.indexOf(Math.max.apply(null, DATA));
var cells = document.getElementById('cells');
var days = document.getElementById('days');
DATA.forEach(function (v, i) {
  var cx = centerX(i), top = scaleY(v);
  // 막대 하나에 셀 하나 — 막대와 두 값 라벨이 같은 --d 를 공유해 순차 등장이 맞물린다
  var g = el('g', { 'class': 'cb__cell', 'style': '--d:' + (i * .08).toFixed(2) + 's' }, cells);
  el('rect', { 'class': 'cb__bar' + (i === peakIdx ? ' cb__bar--peak' : ''),
    x: (cx - BAR_W / 2).toFixed(1), y: top.toFixed(1), width: BAR_W, height: (BASE - top).toFixed(1) }, g);
  // 값 라벨 두 장 — 미리보기에서 반값과 최종값을 컷으로 바꾼다. 실사용은 최종값만 보인다
  el('text', { 'class': 'cb__val cb__vHalf' + (i === peakIdx ? ' cb__vPeak' : ''), x: cx.toFixed(1), y: (top - 7).toFixed(1) }, g).textContent = Math.round(v / 2);
  el('text', { 'class': 'cb__val cb__vFull' + (i === peakIdx ? ' cb__vPeak' : ''), x: cx.toFixed(1), y: (top - 7).toFixed(1) }, g).textContent = v;
  el('text', { 'class': 'cb__day', x: cx.toFixed(1), y: 176 }, days).textContent = DAY[i];
});

// 스크린리더용 표 채우기 — 그림이 값을 다 말해 주지는 않는다
var srBody = document.getElementById('srBody');
DATA.forEach(function (v, i) {
  var tr = document.createElement('tr');
  var th = document.createElement('th'); th.setAttribute('scope', 'row'); th.textContent = DAY[i];
  var td = document.createElement('td'); td.textContent = v;
  tr.appendChild(th); tr.appendChild(td); srBody.appendChild(tr);
});

// 툴팁을 i번 막대 위에 놓는다 — viewBox 좌표를 plot 비율로 바꿔 % 로
function placeTip(i) {
  tip.style.left = (centerX(i) / VW * 100) + '%';
  tip.style.bottom = ((VH - scaleY(DATA[i]) + 8) / VH * 100) + '%';
  tipDay.textContent = DAY[i];
  tipVal.textContent = DATA[i] + '万ウォン';
}
placeTip(peakIdx);   // 미리보기 툴팁은 최고 막대 위에 떠 있다

// 사람이 조작하면 미리보기 루프를 끄고 진짜 툴팁이 따라온다
svg.addEventListener('pointermove', function (e) {
  if (cb.classList.contains('is-demo')) { cb.classList.remove('is-demo'); }
  var r = svg.getBoundingClientRect();
  var vx = (e.clientX - r.left) / r.width * VW;   // 화면 좌표 → viewBox 좌표
  var i = Math.floor((vx - PAD_L) / band());
  i = Math.max(0, Math.min(DATA.length - 1, i));
  placeTip(i);
  tip.classList.add('is-on');
});
svg.addEventListener('pointerleave', function () {
  tip.classList.remove('is-on');
  placeTip(peakIdx);   // 최고 막대로 돌아간다
});
</script>
</body>
</html>
