<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중심에서 펼쳐지는 레이더 차트 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cr is-demo" id="cr">
  <div class="cr__card">
    <div class="cr__head">
      <p class="cr__title">Library evaluation on six axes</p>
      <span class="cr__chip">Out of 100</span>
    </div>
    <div class="cr__plot">
      <svg class="cr__svg" id="chart" viewBox="0 0 440 198" role="img" aria-label="Radar chart of six axis scores: stability is highest at 90 and price lowest at 58">
        <!-- 눈금 육각 격자 2겹(50%·100%) + 중심에서 뻗는 축선 6개 — JS 가 좌표를 조립한다 -->
        <g class="cr__grid" id="grid"></g>
        <!-- Axis 라벨 6개 — 꼭짓점보다 바깥 -->
        <g class="cr__labs" id="labs"></g>
        <!-- 주인공 폴리곤. points 는 JS 가 삼각함수로 채운다 -->
        <polygon class="cr__poly" id="poly" points=""></polygon>
        <!-- 꼭짓점  pts 6개 — 각 Axis 점수의 위치 -->
        <g class="cr__dots" id="dots"></g>
      </svg>
      <!-- 툴팁 — plot 안에서 절대 배치. 꼭짓점 위(위쪽 반은 아래로)에 뜬다 -->
      <div class="cr__tip" id="tip" aria-hidden="true"><span class="cr__tipName" id="tipName"></span><strong class="cr__tipVal" id="tipVal"></strong></div>
      <!-- 스크린리더용 데이터 표 — 화면에 안 보인다 -->
      <table class="cr__sr">
        <caption>Library evaluation on six axes</caption>
        <thead><tr><th>Axis</th><th>Score</th></tr></thead>
        <tbody id="srBody"></tbody>
      </table>
    </div>
  </div>
</div>
</main>
<script>
var AXES = ['Design', 'Speed', 'Stability', 'Docs', 'Community', 'Price'];
var VALS = [86, 72, 90, 64, 78, 58];
var CX = 232, CY = 100, R = 68, N = 6;
var NS = 'http://www.w3.org/2000/svg';
var cr = document.getElementById('cr');
var svg = document.getElementById('chart');
var tip = document.getElementById('tip');
var tipName = document.getElementById('tipName');
var tipVal = document.getElementById('tipVal');
var pts = [];   // 꼭짓점의 viewBox 좌표 — 그리기와 툴팁 거리 재기에 같이 쓴다

function mk(tag) { return document.createElementNS(NS, tag); }

// i번째 축의 좌표 — 위꼭짓점(i=0)에서 시작해 시계 방향 60도 간격.
// r 에 Score 비율을 곱하면 데이터 위치, 눈금 반지름을 그대로 넣으면 격자 꼭짓점이 된다
function pos(i, r) {
  var rad = (i * 60 - 90) * Math.PI / 180;
  return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];
}
// 반지름 r 육각형의 points 문자열 — 눈금 격자와 데이터 폴리곤이 같은 함수에서 나온다
function ringPts(r) {
  var s = '';
  for (var i = 0; i < N; i++) { var p = pos(i, r); s += (i ? ' ' : '') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }
  return s;
}

// 눈금 격자 — 100% 육각형, 50% 육각형, 축선 6개
var grid = document.getElementById('grid');
[R, R / 2].forEach(function (r) {
  var pg = mk('polygon'); pg.setAttribute('class', 'cr__ring'); pg.setAttribute('points', ringPts(r)); grid.appendChild(pg);
});
for (var g = 0; g < N; g++) {
  var ln = mk('line'); var gp = pos(g, R);
  ln.setAttribute('class', 'cr__spoke');
  ln.setAttribute('x1', CX); ln.setAttribute('y1', CY); ln.setAttribute('x2', gp[0].toFixed(1)); ln.setAttribute('y2', gp[1].toFixed(1));
  grid.appendChild(ln);
}
// Axis 라벨 — 위·아래 축은 가운데 정렬, 옆 축은 바깥으로 붙인다
var labs = document.getElementById('labs');
AXES.forEach(function (name, i) {
  var t = mk('text'); var p = pos(i, R + 18);
  t.setAttribute('class', 'cr__lab');
  t.setAttribute('x', p[0].toFixed(1)); t.setAttribute('y', p[1].toFixed(1));
  t.setAttribute('text-anchor', i === 0 || i === 3 ? 'middle' : (i < 3 ? 'start' : 'end'));
  t.textContent = name; labs.appendChild(t);
});
// 데이터 폴리곤 + 꼭짓점  pts — 점수를 100으로 나눠 반지름에 곱한다
VALS.forEach(function (v, i) { pts.push(pos(i, R * v / 100)); });
document.getElementById('poly').setAttribute('points',
  pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '));
var dots = document.getElementById('dots');
pts.forEach(function (p) {
  var c = mk('circle'); c.setAttribute('class', 'cr__dot'); c.setAttribute('r', 3.5);
  c.setAttribute('cx', p[0].toFixed(1)); c.setAttribute('cy', p[1].toFixed(1)); dots.appendChild(c);
});
// 스크린리더 표 채우기
var srBody = document.getElementById('srBody');
AXES.forEach(function (name, i) {
  var tr = document.createElement('tr');
  var th = document.createElement('th'); th.setAttribute('scope', 'row'); th.textContent = name;
  var td = document.createElement('td'); td.textContent = VALS[i] + ' pts';
  tr.appendChild(th); tr.appendChild(td); srBody.appendChild(tr);
});

// 툴팁 — 꼭짓점 위에 뜨고 위쪽 반의 축은 아래로 띄운다. 처음 값은 최고 Axis(Stability)
function placeTip(i) {
  tip.style.left = (pts[i][0] / 440 * 100).toFixed(2) + '%';
  tip.style.top = (pts[i][1] / 198 * 100).toFixed(2) + '%';
  tip.classList.toggle('is-below', pts[i][1] < CY);
  tipName.textContent = AXES[i];
  tipVal.textContent = VALS[i] + ' pts';
}
placeTip(2);

// 꼭짓점 근계에 포인터가 오면 그 축의 이름과 점수를 보여 준다
svg.addEventListener('pointermove', function (e) {
  if (cr.classList.contains('is-demo')) { cr.classList.remove('is-demo'); }
  var r = svg.getBoundingClientRect();
  var vx = (e.clientX - r.left) / r.width * 440;
  var vy = (e.clientY - r.top) / r.height * 198;
  var best = -1, bd = 46 * 46;   // 꼭짓점 46 viewBox 단위 안에 있어야 반응한다
  pts.forEach(function (p, i) {
    var d = (p[0] - vx) * (p[0] - vx) + (p[1] - vy) * (p[1] - vy);
    if (d < bd) { bd = d; best = i; }
  });
  if (best < 0) { tip.classList.remove('is-on'); return; }
  placeTip(best); tip.classList.add('is-on');
});
svg.addEventListener('pointerleave', function () { tip.classList.remove('is-on'); });
</script>
</body>
</html>
