<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리본이 접히며 떨어지는 북마크 버튼 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fd is-demo" id="fd">
  <p class="fd__caption">리본이 접히며 떨어지는 북마크 버튼</p>
  <div class="fd__scene" id="fdScene">
    <div class="fd__shadow" id="fdShadow" aria-hidden="true"></div>
    <button class="fd__btn" id="fdBtn" type="button" aria-pressed="false">
      <span class="fd__wrap" id="fdWrap">
        <svg class="fd__icon" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false">
          <path class="fd__shape" d="M6.5 3A1.5 1.5 0 0 1 8 1.5h8A1.5 1.5 0 0 1 17.5 3v18.2a.9.9 0 0 1-1.38.76L12 19.1l-4.12 2.86A.9.9 0 0 1 6.5 21.2Z"/>
        </svg>
      </span>
    </button>
  </div>
  <p class="fd__status" id="fdStatus" aria-live="polite">저장 전</p>
</div>
</main>
<script>
(function () {
  "use strict";

  var FOLD_MAX_DEG = 56;
  var FOLD_DROP_MAX_PX = 12;
  var FOLD_MS = 560;
  var CYCLE_S = 2;

  var root = document.getElementById("fd");
  var scene = document.getElementById("fdScene");
  var shadow = document.getElementById("fdShadow");
  var btn = document.getElementById("fdBtn");
  var wrap = document.getElementById("fdWrap");
  var status = document.getElementById("fdStatus");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var saved = false;
  function setSaved(v) {
    saved = v;
    btn.setAttribute("aria-pressed", String(v));
    root.classList.toggle("is-saved", v);
    status.textContent = v ? "저장됨" : "저장 전";
  }

  // 값 하나: 접힘 진행률 p(0~1, 사인 곡선 한 번의 봉우리) → 접힘 각도(rotateX) + 낙하 거리
  // + 그림자 블러·투명도(높이가 낮아질수록 그림자가 진해진다).
  function render(p) {
    scene.style.setProperty("--tone", p.toFixed(3));
    var deg = p * FOLD_MAX_DEG;
    var drop = p * FOLD_DROP_MAX_PX;
    wrap.style.transform = "perspective(300px) rotateX(" + deg.toFixed(2) + "deg) translateY(" + drop.toFixed(2) + "px)";
    var blur = 3 + p * 10;
    var spread = 6 - p * 4;
    var alpha = 0.22 + p * 0.28;
    shadow.style.boxShadow = "0 " + (2 + p * 6).toFixed(1) + "px " + blur.toFixed(1) + "px " + spread.toFixed(1) + "px rgba(23,20,26," + alpha.toFixed(2) + ")";
    shadow.style.transform = "scaleX(" + (1 - p * 0.18).toFixed(3) + ")";
  }

  var foldStart = null;
  var pending = false;

  function triggerFold() {
    pending = true;
  }

  btn.addEventListener("click", function () {
    root.classList.remove("is-demo");
    setSaved(!saved);
    triggerFold();
  });

  var start = null;
  var prevT = 0;
  var toggledA = false;
  var toggledB = false;
  function loop(now) {
    if (start === null) start = now;
    if (pending) { foldStart = now; pending = false; }
    var t = ((now - start) / 1000) % CYCLE_S;
    if (t < prevT) { toggledA = false; toggledB = false; }
    prevT = t;
    if (!reduce && root.classList.contains("is-demo")) {
      if (!toggledA && t > 0.35) { toggledA = true; setSaved(true); triggerFold(); }
      if (!toggledB && t > 1.35) { toggledB = true; setSaved(false); triggerFold(); }
    }
    var p = 0;
    if (!reduce && foldStart !== null) {
      var ft = (now - foldStart) / FOLD_MS;
      if (ft >= 1) {
        foldStart = null;
        p = 0;
      } else {
        p = Math.sin(Math.PI * ft);
      }
    }
    render(p);
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
