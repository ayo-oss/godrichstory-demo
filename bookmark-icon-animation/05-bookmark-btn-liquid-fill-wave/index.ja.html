<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>液体が満ちるように満たされるブックマークボタン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lq is-demo" id="lq">
  <p class="lq__caption">液体が満ちるように満たされるブックマークボタン</p>
  <div class="lq__scene" id="lqScene">
    <button class="lq__btn" id="lqBtn" type="button" aria-pressed="false">
      <svg class="lq__icon" viewBox="0 0 24 24" width="60" height="60" aria-hidden="true" focusable="false">
        <defs>
          <clipPath id="lqClip">
            <path d="M6.5 3A1.5 1.5 0 0 1 8 1.5h8A1.5 1.5 0 0 1 17.5 3v18.2a.9.9 0 0 1-1.38.76L12 19.1l-4.12 2.86A.9.9 0 0 1 6.5 21.2Z"/>
          </clipPath>
        </defs>
        <path class="lq__outline" d="M6.5 3A1.5 1.5 0 0 1 8 1.5h8A1.5 1.5 0 0 1 17.5 3v18.2a.9.9 0 0 1-1.38.76L12 19.1l-4.12 2.86A.9.9 0 0 1 6.5 21.2Z"/>
        <path class="lq__wave" id="lqWave" clip-path="url(#lqClip)" d="M0,24 L24,24 L24,24 L0,24 Z"/>
      </svg>
    </button>
  </div>
  <p class="lq__status" id="lqStatus" aria-live="polite">未保存</p>
</div>
</main>
<script>
(function () {
  "use strict";

  var WAVE_AMPLITUDE = 1.15;
  var WAVE_FREQUENCY = 0.85;
  var WAVE_SPEED = 2.6;
  var LEVEL_LERP = 0.16;
  var CYCLE_S = 2;

  var root = document.getElementById("lq");
  var scene = document.getElementById("lqScene");
  var btn = document.getElementById("lqBtn");
  var wave = document.getElementById("lqWave");
  var status = document.getElementById("lqStatus");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var saved = false;
  function setSaved(v) {
    saved = v;
    btn.setAttribute("aria-pressed", String(v));
    status.textContent = v ? "保存済み" : "未保存";
  }

  var level = 0;
  var target = 0;

  // 값 하나: 물 높이(level, 0~1) + 시간 위상(phase) → 매 프레임 다시 계산한 사인 물결 path.
  function waveD(lv, phase) {
    var baseY = 24 * (1 - lv);
    var d = "M0," + (baseY + WAVE_AMPLITUDE * Math.sin(phase)).toFixed(2) + " ";
    for (var x = 0; x <= 24; x += 2) {
      var y = baseY + WAVE_AMPLITUDE * Math.sin(x * WAVE_FREQUENCY * 0.26 + phase);
      d += "L" + x + "," + y.toFixed(2) + " ";
    }
    d += "L24,24 L0,24 Z";
    return d;
  }

  btn.addEventListener("click", function () {
    root.classList.remove("is-demo");
    setSaved(!saved);
    target = saved ? 1 : 0;
  });

  var start = null;
  var prevT = 0;
  var toggledA = false;
  var toggledB = false;
  var phase = 0;
  function loop(now) {
    if (start === null) start = now;
    var t = ((now - start) / 1000) % CYCLE_S;
    if (t < prevT) { toggledA = false; toggledB = false; }
    prevT = t;
    if (!reduce && root.classList.contains("is-demo")) {
      if (!toggledA && t > 0.25) { toggledA = true; setSaved(true); target = 1; }
      if (!toggledB && t > 1.25) { toggledB = true; setSaved(false); target = 0; }
    }
    if (reduce) {
      // 정지: 물 높이는 목표값으로 즉시 고정, 위상은 갱신하지 않아 물결이 멈춘 채로 표시된다.
      level = target;
    } else {
      level += (target - level) * LEVEL_LERP;
      phase = ((now - start) / 1000) * WAVE_SPEED;
    }
    wave.setAttribute("d", waveD(level, phase));
    scene.style.setProperty("--level", level.toFixed(3));
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
