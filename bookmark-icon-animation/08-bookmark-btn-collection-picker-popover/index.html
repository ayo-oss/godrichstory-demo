<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>저장할 컬렉션을 고르는 팝오버 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cp is-demo" id="cp">
  <p class="cp__caption">폴더에 저장</p>
  <div class="cp__scene" id="cpScene">
    <button class="cp__btn" id="cpBtn" type="button" aria-pressed="false" aria-expanded="false" aria-haspopup="true">
      <svg class="cp__icon" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
        <path class="cp__shape" d="M6.5 3A1.5 1.5 0 0 1 8 1.5h8A1.5 1.5 0 0 1 17.5 3v18.2a.9.9 0 0 1-1.38.76L12 19.1l-4.12 2.86A.9.9 0 0 1 6.5 21.2Z"/>
      </svg>
    </button>
    <div class="cp__panel" id="cpPanel" role="menu">
      <p class="cp__panelTitle">저장할 목록 고르기</p>
      <button class="cp__item" type="button" role="menuitem" data-name="읽기 목록">읽기 목록</button>
      <button class="cp__item" type="button" role="menuitem" data-name="나중에 볼 글">나중에 볼 글</button>
      <button class="cp__item" type="button" role="menuitem" data-name="요리 레시피">요리 레시피</button>
    </div>
  </div>
  <p class="cp__status" id="cpStatus" aria-live="polite">저장 전</p>
</div>
</main>
<script>
(function () {
  "use strict";

  var LONGPRESS_MS = 420;
  var POPOVER_STAGGER_MS = 45;
  var POPOVER_ITEM_MS = 210;
  var CYCLE_S = 2;

  var root = document.getElementById("cp");
  var btn = document.getElementById("cpBtn");
  var panel = document.getElementById("cpPanel");
  var items = Array.prototype.slice.call(panel.querySelectorAll(".cp__item"));
  var status = document.getElementById("cpStatus");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var open = false;
  var pressStart = null;
  var pressing = false;

  function setOpen(v, now) {
    open = v;
    btn.setAttribute("aria-expanded", String(v));
    panel.classList.toggle("cp__panel--open", v);
    if (v) { openStart = now; }
    else { openStart = null; }
  }

  var openStart = null;

  // 값 하나: 목록 항목 인덱스 × POPOVER_STAGGER_MS = 그 항목이 열리기 시작하는 지연.
  function renderPanel(now) {
    if (openStart === null && !open) {
      items.forEach(function (el) { el.style.opacity = "0"; el.style.transform = "translateY(6px)"; });
      return;
    }
    var elapsed = openStart === null ? POPOVER_ITEM_MS * 3 : now - openStart;
    items.forEach(function (el, i) {
      var delay = i * POPOVER_STAGGER_MS;
      var raw = (elapsed - delay) / POPOVER_ITEM_MS;
      var p = Math.max(0, Math.min(1, reduce ? 1 : raw));
      var eased = 1 - Math.pow(1 - p, 3);
      el.style.opacity = eased.toFixed(3);
      el.style.transform = "translateY(" + ((1 - eased) * 6).toFixed(2) + "px)";
    });
  }

  function selectCollection(name) {
    status.textContent = "저장됨";
    btn.setAttribute("aria-pressed", "true");
    root.classList.add("cp__scene--picked");
    setOpen(false);
  }

  function focusItem(i) {
    var idx = ((i % items.length) + items.length) % items.length;
    items[idx].focus({ preventScroll: true });
  }

  items.forEach(function (el, i) {
    el.addEventListener("click", function () {
      root.classList.remove("is-demo");
      selectCollection(el.getAttribute("data-name"));
      btn.focus({ preventScroll: true });
    });
    el.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown") { e.preventDefault(); focusItem(i + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); focusItem(i - 1); }
      else if (e.key === "Escape") {
        e.preventDefault();
        root.classList.remove("is-demo");
        setOpen(false);
        btn.focus({ preventScroll: true });
      }
    });
  });

  function shortSave() {
    var v = btn.getAttribute("aria-pressed") !== "true";
    btn.setAttribute("aria-pressed", String(v));
    status.textContent = v ? "저장됨" : "저장 전";
  }

  btn.addEventListener("pointerdown", function () {
    root.classList.remove("is-demo");
    pressing = true;
    pressStart = null;
  });
  btn.addEventListener("pointerup", function () {
    // longpress 임계(LONGPRESS_MS)를 못 넘기고 뗀 경우에만 짧은 저장 토글로 처리한다
    if (pressing && !open) { shortSave(); }
    pressing = false;
    pressStart = null;
  });
  btn.addEventListener("pointerleave", function () { pressing = false; pressStart = null; });
  btn.addEventListener("keydown", function (e) {
    // 롱프레스(포인터 전용) 대안: Shift+Enter 또는 ArrowDown 으로 팝오버를 열고 첫 항목으로 이동
    if (e.key === "ArrowDown" || (e.key === "Enter" && e.shiftKey)) {
      e.preventDefault();
      root.classList.remove("is-demo");
      if (!open) { setOpen(true, performance.now()); }
      focusItem(0);
    } else if (e.key === "Escape" && open) {
      e.preventDefault();
      root.classList.remove("is-demo");
      setOpen(false);
    }
  });
  btn.addEventListener("click", function (e) {
    // pointerdown/up longpress 경로와 중복되지 않도록: longpress 로 이미 열렸으면 click 무시
    if (open) { e.preventDefault(); return; }
    // 키보드(Enter/Space) 로 발생한 click 은 pointerup 경로를 거치지 않으므로 여기서 저장 토글
    if (e.detail === 0) { root.classList.remove("is-demo"); shortSave(); }
  });

  var start = null;
  var prevT = 0;
  var cycleOpened = false;
  var cyclePicked = false;
  function loop(now) {
    if (start === null) start = now;
    if (pressing && pressStart === null) { pressStart = now; }
    if (pressing && pressStart !== null && !open && (now - pressStart) > LONGPRESS_MS) {
      setOpen(true, now);
    }
    var t = ((now - start) / 1000) % CYCLE_S;
    if (t < prevT) { cycleOpened = false; cyclePicked = false; }
    prevT = t;
    if (!reduce && root.classList.contains("is-demo")) {
      if (!cycleOpened && t > 0.15) { cycleOpened = true; setOpen(true, now); }
      if (!cyclePicked && t > 1.0) { cyclePicked = true; selectCollection("읽기 목록"); }
    }
    renderPanel(now);
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
