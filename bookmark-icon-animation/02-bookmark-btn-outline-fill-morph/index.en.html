<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Bookmark Button That Morphs From Outline to Fill — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ob is-demo" id="ob">
  <p class="ob__caption">A Bookmark Button That Morphs From Outline to Fill</p>
  <div class="ob__scene" id="obScene">
    <div class="ob__panel" id="obPanel" aria-hidden="true"></div>
    <button class="ob__btn" id="obBtn" type="button" aria-pressed="false">
      <svg class="ob__icon" viewBox="0 0 24 24" width="34" height="34" aria-hidden="true" focusable="false">
        <defs>
          <clipPath id="obClip">
            <path d="M6.5 3A1.5 1.5 0 0 1 8 1.5h8A1.5 1.5 0 0 1 17.5 3v18.2a.9.9 0 0 1-1.38.76L12 19.1l-4.12 2.86A.9.9 0 0 1 6.5 21.2Z"/>
          </clipPath>
        </defs>
        <path class="ob__outline" d="M6.5 3A1.5 1.5 0 0 1 8 1.5h8A1.5 1.5 0 0 1 17.5 3v18.2a.9.9 0 0 1-1.38.76L12 19.1l-4.12 2.86A.9.9 0 0 1 6.5 21.2Z"/>
        <rect class="ob__fill" id="obFill" x="0" y="24" width="24" height="24" clip-path="url(#obClip)"/>
      </svg>
    </button>
  </div>
  <p class="ob__status" id="obStatus" aria-live="polite">Not saved</p>
</div>
</main>
<script>
(function () {
  "use strict";

  var CYCLE_S = 2;

  var root = document.getElementById("ob");
  var scene = document.getElementById("obScene");
  var panel = document.getElementById("obPanel");
  var btn = document.getElementById("obBtn");
  var fillRect = document.getElementById("obFill");
  var status = document.getElementById("obStatus");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var saved = false;
  var progress = 0;
  var target = 0;

  function render(p) {
    // 값 하나: fill 진행률(p, 0~1) → SVG rect 의 y·height(=clip-path 로 잘려 채움 비율이 된다)
    var y = 24 * (1 - p);
    fillRect.setAttribute("y", y.toFixed(3));
    fillRect.setAttribute("height", (24 - y).toFixed(3));
    panel.style.setProperty("--fill-p", p.toFixed(3));
  }

  function setSaved(v) {
    saved = v;
    target = v ? 1 : 0;
    btn.setAttribute("aria-pressed", String(v));
    status.textContent = v ? "Saved" : "Not saved";
  }

  btn.addEventListener("click", function () {
    root.classList.remove("is-demo");
    setSaved(!saved);
  });

  var start = null;
  var prevT = 0;
  var toggledA = false;
  var toggledB = false;
  function loop(now) {
    if (start === null) start = now;
    var t = ((now - start) / 1000) % CYCLE_S;
    if (t < prevT) { toggledA = false; toggledB = false; }
    prevT = t;
    if (!reduce && root.classList.contains("is-demo")) {
      if (!toggledA && t > 0.3) { toggledA = true; setSaved(true); }
      if (!toggledB && t > 1.3) { toggledB = true; setSaved(false); }
    }
    if (reduce) {
      progress = target;
    } else {
      // 관성 lerp: 진행률이 목표를 향해 부드럽게 수렴한다 (속성 트윈이 아니라 매 프레임 계산)
      progress += (target - progress) * 0.22;
    }
    render(progress);
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
