<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Bookmark Icon That Tilts and Glows on Hover — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rb is-demo" id="rb">
  <p class="rb__caption">A Bookmark Icon That Tilts and Glows on Hover</p>
  <div class="rb__zone" id="rbZone">
    <div class="rb__glow" id="rbGlow" aria-hidden="true"></div>
    <button class="rb__btn" id="rbBtn" type="button" aria-pressed="false">
      <svg class="rb__icon" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false">
        <path class="rb__shape" d="M6.5 3A1.5 1.5 0 0 1 8 1.5h8A1.5 1.5 0 0 1 17.5 3v18.2a.9.9 0 0 1-1.38.76L12 19.1l-4.12 2.86A.9.9 0 0 1 6.5 21.2Z"/>
      </svg>
    </button>
  </div>
  <p class="rb__status" id="rbStatus" aria-live="polite">Not saved</p>
</div>
</main>
<script>
(function () {
  "use strict";

  var TILT_MAX_DEG = 14;
  var GLOW_RADIUS_PX = 150;
  var CYCLE_S = 2;

  var root = document.getElementById("rb");
  var zone = document.getElementById("rbZone");
  var glow = document.getElementById("rbGlow");
  var btn = document.getElementById("rbBtn");
  var status = document.getElementById("rbStatus");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var saved = false;
  function setSaved(v) {
    saved = v;
    btn.setAttribute("aria-pressed", String(v));
    root.classList.toggle("is-saved", v);
    status.textContent = v ? "Saved" : "Not saved";
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // 값 하나: 포인터 벡터(dx,dy) → 각도. 그 각도가 기울기(rotateX/rotateY)와
  // 광택 sweep 위치(conic-gradient 각도)를 동시에 결정한다.
  function applyVector(dx, dy) {
    var dist = Math.hypot(dx, dy);
    var strength = clamp(1 - dist / GLOW_RADIUS_PX, 0, 1);
    var angleDeg = Math.atan2(dy, dx) * 180 / Math.PI;
    var tiltX = clamp(-dy / GLOW_RADIUS_PX, -1, 1) * TILT_MAX_DEG * strength;
    var tiltY = clamp(dx / GLOW_RADIUS_PX, -1, 1) * TILT_MAX_DEG * strength;
    btn.style.transform = "perspective(600px) rotateX(" + tiltX.toFixed(2) + "deg) rotateY(" + tiltY.toFixed(2) + "deg)";
    glow.style.setProperty("--glow-deg", angleDeg.toFixed(1) + "deg");
    glow.style.setProperty("--glow-strength", strength.toFixed(3));
  }

  var hasPointer = false;
  zone.addEventListener("pointermove", function (e) {
    hasPointer = true;
    root.classList.remove("is-demo");
    var r = btn.getBoundingClientRect();
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    applyVector(e.clientX - cx, e.clientY - cy);
  });
  zone.addEventListener("pointerleave", function () {
    hasPointer = false;
    applyVector(0, 0);
  });
  btn.addEventListener("focus", function () {
    applyVector(0, -GLOW_RADIUS_PX * 0.4);
  });
  btn.addEventListener("blur", function () {
    if (!hasPointer) applyVector(0, 0);
  });
  btn.addEventListener("click", function () {
    setSaved(!saved);
  });

  // .is-demo 자동 시연: 가상 포인터가 원을 그리며 지나가고, 그 사이 두 번 저장 상태를 바꾼다.
  var start = null;
  var prevT = 0;
  var toggledA = false;
  var toggledB = false;
  function loop(now) {
    if (start === null) start = now;
    var t = ((now - start) / 1000) % CYCLE_S;
    if (t < prevT) { toggledA = false; toggledB = false; }
    prevT = t;
    if (!reduce && !hasPointer && root.classList.contains("is-demo")) {
      var ang = (t / CYCLE_S) * Math.PI * 2;
      var x = Math.cos(ang) * 120;
      var y = Math.sin(ang) * 70;
      applyVector(x, y);
      if (!toggledA && t > 0.45) { toggledA = true; setSaved(true); }
      if (!toggledB && t > 1.45) { toggledB = true; setSaved(false); }
    }
    requestAnimationFrame(loop);
  }

  if (reduce) {
    applyVector(0, 0);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
