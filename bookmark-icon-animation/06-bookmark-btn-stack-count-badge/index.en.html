<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Save-Count Badge That Rolls Digit by Digit — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cb is-demo" id="cb">
  <p class="cb__caption">Save count</p>
  <div class="cb__row" id="cbRow">
    <span class="cb__rowTitle">Design Inspiration Collection</span>
    <button class="cb__btn" id="cbBtn" type="button" aria-pressed="false">
      <svg class="cb__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
        <path class="cb__shape" d="M6.5 3A1.5 1.5 0 0 1 8 1.5h8A1.5 1.5 0 0 1 17.5 3v18.2a.9.9 0 0 1-1.38.76L12 19.1l-4.12 2.86A.9.9 0 0 1 6.5 21.2Z"/>
      </svg>
      <span class="cb__badge" id="cbBadge" aria-live="polite">
        <span class="cb__digit"><span class="cb__digitOld" id="cbOld0">0</span><span class="cb__digitNew" id="cbNew0">0</span></span>
        <span class="cb__digit"><span class="cb__digitOld" id="cbOld1">9</span><span class="cb__digitNew" id="cbNew1">9</span></span>
      </span>
    </button>
  </div>
  <p class="cb__status" id="cbStatus">Not saved</p>
</div>
</main>
<script>
(function () {
  "use strict";

  var BOOKMARK_COUNT_STAGGER_MS = 40;
  var DIGIT_ROLL_MS = 260;
  var CYCLE_S = 2;

  var root = document.getElementById("cb");
  var row = document.getElementById("cbRow");
  var btn = document.getElementById("cbBtn");
  var status = document.getElementById("cbStatus");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var oldEls = [document.getElementById("cbOld0"), document.getElementById("cbOld1")];
  var newEls = [document.getElementById("cbNew0"), document.getElementById("cbNew1")];

  var count = 9;
  var saved = false;

  // 값 하나: 자릿수 인덱스(오른쪽부터) × BOOKMARK_COUNT_STAGGER_MS = 그 칸이 구르기 시작하는 지연 시간.
  var columns = [
    { delay: 1 * BOOKMARK_COUNT_STAGGER_MS, start: null, from: "0", to: "0" },
    { delay: 0 * BOOKMARK_COUNT_STAGGER_MS, start: null, from: "9", to: "9" }
  ];

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function beginRoll(now) {
    var next = saved ? count + 1 : count - 1;
    var fromStr = pad2(count);
    var toStr = pad2(next);
    count = next;
    for (var i = 0; i < 2; i++) {
      columns[i].from = fromStr[i];
      columns[i].to = toStr[i];
      columns[i].start = now + columns[i].delay;
    }
    status.textContent = saved ? "Saved" : "Not saved";
    row.classList.add("cb__row--pulse");
    window.setTimeout(function () { row.classList.remove("cb__row--pulse"); }, 320);
  }

  function renderColumns(now) {
    for (var i = 0; i < 2; i++) {
      var col = columns[i];
      oldEls[i].textContent = col.from;
      newEls[i].textContent = col.to;
      var p = 0;
      if (col.start !== null) {
        var raw = (now - col.start) / DIGIT_ROLL_MS;
        p = Math.max(0, Math.min(1, raw));
        if (raw >= 1) { col.start = null; }
      }
      var eased = 1 - Math.pow(1 - p, 2);
      oldEls[i].style.transform = "translateY(" + (-eased * 100).toFixed(1) + "%)";
      newEls[i].style.transform = "translateY(" + ((1 - eased) * 100).toFixed(1) + "%)";
    }
  }

  var pendingRoll = false;
  btn.addEventListener("click", function () {
    root.classList.remove("is-demo");
    saved = !saved;
    btn.setAttribute("aria-pressed", String(saved));
    pendingRoll = true;
  });

  var start = null;
  var prevT = 0;
  var toggledA = false;
  var toggledB = false;
  function loop(now) {
    if (start === null) start = now;
    if (pendingRoll) { beginRoll(now); pendingRoll = false; }
    var t = ((now - start) / 1000) % CYCLE_S;
    if (t < prevT) { toggledA = false; toggledB = false; }
    prevT = t;
    if (!reduce && root.classList.contains("is-demo")) {
      if (!toggledA && t > 0.3) {
        toggledA = true; saved = true; btn.setAttribute("aria-pressed", "true"); beginRoll(now);
      }
      if (!toggledB && t > 1.3) {
        toggledB = true; saved = false; btn.setAttribute("aria-pressed", "false"); beginRoll(now);
      }
    }
    if (reduce) {
      for (var i = 0; i < 2; i++) { columns[i].start = null; }
    }
    renderColumns(now);
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
