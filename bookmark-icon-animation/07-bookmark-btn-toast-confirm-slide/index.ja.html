<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保存を確認してくれるトーストスライド — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ts is-demo" id="ts">
  <p class="ts__caption">保存完了の通知</p>
  <div class="ts__scene" id="tsScene">
    <button class="ts__btn" id="tsBtn" type="button" aria-pressed="false">
      <svg class="ts__icon" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false">
        <path class="ts__shape" d="M6.5 3A1.5 1.5 0 0 1 8 1.5h8A1.5 1.5 0 0 1 17.5 3v18.2a.9.9 0 0 1-1.38.76L12 19.1l-4.12 2.86A.9.9 0 0 1 6.5 21.2Z"/>
      </svg>
    </button>
    <div class="ts__toast" id="tsToast" role="status" aria-live="polite">
      <span id="tsToastText">保存しました</span>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  "use strict";

  var TOAST_ENTER_MS = 180;
  var TOAST_HOLD_MS = 520;
  var TOAST_EXIT_MS = 180;
  var CYCLE_S = 2;

  var root = document.getElementById("ts");
  var btn = document.getElementById("tsBtn");
  var toast = document.getElementById("tsToast");
  var toastText = document.getElementById("tsToastText");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var saved = false;
  var toastStart = null;
  var pendingMsg = null;

  function showToast(now, msg) {
    toastText.textContent = msg;
    toastStart = now;
  }

  // 값 하나: 토스트가 뜬 뒤 경과 시간(rAF dt 누적) → 진입/유지/퇴장 세 구간 중 어디인지, 그 구간의 진행률.
  function render(now) {
    if (toastStart === null) {
      toast.style.transform = "translateY(120%)";
      toast.style.opacity = "0";
      return;
    }
    var elapsed = now - toastStart;
    var enterMs = reduce ? 1 : TOAST_ENTER_MS;
    var exitMs = reduce ? 1 : TOAST_EXIT_MS;
    var enterEnd = enterMs;
    var holdEnd = enterEnd + TOAST_HOLD_MS;
    var exitEnd = holdEnd + exitMs;
    var y, op;
    if (elapsed < enterEnd) {
      var p = elapsed / enterEnd;
      var eased = 1 - Math.pow(1 - p, 3);
      y = 120 - eased * 120;
      op = eased;
    } else if (elapsed < holdEnd) {
      y = 0; op = 1;
    } else if (elapsed < exitEnd) {
      var q = (elapsed - holdEnd) / exitMs;
      var easedQ = Math.pow(q, 2);
      y = easedQ * 120;
      op = 1 - easedQ;
    } else {
      y = 120; op = 0;
      toastStart = null;
    }
    toast.style.transform = "translateY(" + y.toFixed(2) + "%)";
    toast.style.opacity = op.toFixed(3);
  }

  btn.addEventListener("click", function () {
    root.classList.remove("is-demo");
    saved = !saved;
    btn.setAttribute("aria-pressed", String(saved));
    pendingMsg = saved ? "保存しました" : "保存を取り消しました";
  });

  var start = null;
  var prevT = 0;
  var toggledA = false;
  var toggledB = false;
  function loop(now) {
    if (start === null) start = now;
    if (pendingMsg) { showToast(now, pendingMsg); pendingMsg = null; }
    var t = ((now - start) / 1000) % CYCLE_S;
    if (t < prevT) { toggledA = false; toggledB = false; }
    prevT = t;
    if (!reduce && root.classList.contains("is-demo")) {
      if (!toggledA && t > 0.05) {
        toggledA = true; saved = true; btn.setAttribute("aria-pressed", "true");
        showToast(now, "保存しました");
      }
      if (!toggledB && t > 1.05) {
        toggledB = true; saved = false; btn.setAttribute("aria-pressed", "false");
        showToast(now, "保存を取り消しました");
      }
    }
    render(now);
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
