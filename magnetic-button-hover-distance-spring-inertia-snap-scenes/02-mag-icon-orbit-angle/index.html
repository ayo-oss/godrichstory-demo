<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커서 각도를 따라 원 위를 도는 아이콘 버튼 궤도 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, 왼쪽·오른쪽 방향키로 다른 값으로">
      <div class="ez__scene" data-role="scene" role="img" aria-label="아이콘이 커서 방향 각도로 원 위를 따라가고 커서가 가까울수록 궤도 반경이 줄어드는 장면"></div>
      <p class="ez__status" data-role="status" aria-live="off">장면 준비</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
    // 무대 좌표 — 안쪽 상자는 늘 480x300 이고 화면 크기에 맞춰 통째로 줄인다 (왼쪽 위 모서리 기준)
    const W = 480;
    const SW = 464; // 장면 폭 (480 - 좌우 8px)
    const SH = 190; // 장면 높이
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 고정 해시 — Math.random 대신 시드로 같은 값을 되돌려 받는다
    function hash(i, s) {
        const x = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    // 감쇠 스프링 한 걸음 (반명시 오일러) — 속성 트윈이 아니라 적분이다
    // k: 강성(N/m 비례) · c: 감쇠 계수 · dt: 고정 시간 간격(초)
    function spring(x, v, tx, k, c, dt) {
        const a = -k * (x - tx) - c * v;
        const v2 = v + a * dt;
        return [x + v2 * dt, v2];
    }
    // 문구 틀의 {a} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    // ── 무대 요소
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // 장면 안 요소를 만든다. 클래스는 cx 를 거쳐 CSS 모듈 이름으로 바뀐다
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    // 지시 텍스트 (레이블·칩 글자) — 화면 문구는 전부 문구 사전을 거친다
    function label(parent, cls, x, y, text) {
        const e = make('b', cls, parent);
        e.textContent = text;
        put(e, x, y, 0, 0);
        return e;
    }
    // 변위 비례 그림자 — 요소의 box-shadow 깊이가 그 순간 당김 변위에서 나온다 (면 전파 레이어)
    function shadowAt(e, disp, max) {
        const k = clamp(Math.abs(disp) / max, 0, 1);
        e.style.boxShadow = '0 ' + f0(8 + 24 * k) + 'px ' + f0(16 + 28 * k) + 'px rgba(23, 20, 26, ' + (0.45 + 0.35 * k).toFixed(2) + '), 0 0 ' + f0(8 + 34 * k) + 'px rgba(255, 247, 230, ' + (0.10 + 0.22 * k).toFixed(2) + ')';
    }
    const scEl = make('div', 'sc', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        scEl.textContent = '';
    }
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    function newCursor() {
        const f = make('i', 'fld', scEl);
        const c = make('div', 'cur', scEl);
        make('i', 'cur__d', c);
        return {
            el: c,
            set(x, y, pull01) {
                const s = 0.5 + 2.2 * clamp(pull01, 0, 1);
                f.style.transform = 'translate(' + (x - 96) + 'px,' + (y - 96) + 'px) scale(' + f1(s) + ')';
                f.style.opacity = pull01 > 0.02 ? String(0.28 + 0.5 * pull01) : '0';
                c.style.transform = 'translate(' + (x - 9) + 'px,' + (y - 9) + 'px)';
            },
            show(b) { c.style.opacity = b ? '1' : '0'; },
        };
    }
    // 거리 감쇠 당김 — d 가 RADIUS 안일 때만 성립하고 p 제곱으로 멀수록 약해진다
    function pullAmt(d, radius, pullMax, p) {
        if (d >= radius) {
            return 0;
        }
        return pullMax * Math.pow(1 - d / radius, p);
    }
    // 당김 세기 0~1 — 커서 필드 링의 크기·투명도가 이 값 하나에서 나온다
    function pull01(d, radius, p) {
        if (d >= radius) {
            return 0;
        }
        return Math.pow(1 - d / radius, p);
    }
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        let lastPtrT = -9999; // 마지막 실제 포인터 입력 시각 (시연 시각 t 기준)
        const FIX_T = 1200; // 줄이기 모드에서 보여 줄 대표 순간 (끌려온 상태)
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            cycle = Math.max(2000, cfg.build(pi));
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function nowT() {
            const ct = clock ? Number(clock.currentTime) : 0;
            return isFinite(ct) ? ct : 0;
        }
        function tick() {
            const t = nowT();
            const overlay = lastPtrT >= 0 && t - lastPtrT < 1500 && t >= lastPtrT;
            const s = cfg.frame(paused ? nowT() : t, overlay);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            if (reduced) {
                // 줄이기 모드에서도 프리셋 전환은 즉시 한 장 다시 그린다 (입력이 화면에 반영된다)
                statusP.textContent = cfg.frame(FIX_T, false);
            }
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        // 실제 포인터 — 장면 좌표로 바꿔 항목에 넘긴다. 터치는 pointerType 으로 갈린다
        function toScene(ev) {
            const r = sceneEl.getBoundingClientRect();
            const k = r.width / SW;
            return [(ev.clientX - r.left) / k, (ev.clientY - r.top) / k];
        }
        padEl.addEventListener('pointermove', function (ev) {
            const p = toScene(ev);
            lastPtrT = nowT();
            cfg.pointer(p[0], p[1], ev.pointerType || 'mouse', (ev.buttons & 1) === 1);
            // 줄이기 모드에서도 입력이 화면에 반영된다 — 목표 갱신 뒤 한 장 다시 그린다
            if (reduced) {
                statusP.textContent = cfg.frame(nowT(), true);
            }
        }, { signal: off.signal });
        padEl.addEventListener('pointerdown', function (ev) {
            const p = toScene(ev);
            lastPtrT = nowT();
            cfg.pointer(p[0], p[1], ev.pointerType || 'mouse', true);
            if (reduced) {
                statusP.textContent = cfg.frame(nowT(), true);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            // 탭이 숨으면 멈추고 돌아오면 이어 간다 — 시계 애니메이션이 상태를 기억한다
            if (document.hidden) {
                setPaused(true);
            }
            else if (!reduced) {
                setPaused(false);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            // 움직임 줄이기 — 끌려온 상태 한 장만 그린다. 입력·프리셋 전환은 frame 1회 재호출로 반영된다
            statusP.textContent = cfg.frame(FIX_T, false);
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }
    // ── 02 커서 각도를 따라 원 위를 도는 아이콘 버튼 궤도
    // 각도는 atan2 로 즉시, 궤도 반경은 lerp 관성(별도 적립) — 두 값이 따로 논다.
    const ORBIT_R = [64, 64, 84];
    const NEAR_R = 18;
    const CX2 = 232;
    const CY2 = 86;
    let orb = null;
    let ringA = null;
    let ringB = null;
    let cur2 = null;
    let lab2 = null;
    let angC = 0; // 아이콘 현재 각도 (rad)
    let radC = 64; // 아이콘 현재 궤도 반경 (lerp 관성)
    let ptr2 = [232, 20];
    let pi2 = 0;
    let t2 = 0;
    function path2(t) {
        // 리사주 — 원 안쪽과 바깥을 오간다
        const k = (t - 200) / 1600;
        return [232 + Math.sin(k * Math.PI * 2) * 120, 86 + Math.sin(k * Math.PI * 4 + 0.6) * 52];
    }
    function step2(x, y, k) {
        if (!orb || !ringB || !cur2 || !lab2) {
            return;
        }
        const dx = x - CX2;
        const dy = y - CY2;
        const d = Math.hypot(dx, dy);
        const ang = Math.atan2(dy, dx);
        // 각도는 즉시 (최단 호) — 반경은 lerp 로 관성을 남긴다
        let da = ang - angC;
        while (da > Math.PI) {
            da -= Math.PI * 2;
        }
        while (da < -Math.PI) {
            da += Math.PI * 2;
        }
        angC += da * Math.min(1, k * 3);
        const target = ORBIT_R[pi2] * clamp((d - NEAR_R) / (170 - NEAR_R), 0, 1);
        radC = lerp(radC, target, Math.min(1, k * 6));
        const ix = CX2 + Math.cos(angC) * radC;
        const iy = CY2 + Math.sin(angC) * radC;
        orb.style.transform = 'translate(' + (ix - 16) + 'px,' + (iy - 16) + 'px) rotate(' + f1((angC * 180 / Math.PI + 90) % 360) + 'deg)';
        shadowAt(orb, (ORBIT_R[pi2] - radC), ORBIT_R[pi2]);
        ringB.style.transform = 'scale(' + f1(radC / ORBIT_R[pi2]) + ')';
        cur2.set(x, y, clamp((d - 18) / 170, 0, 1) > 0 ? pull01(d, 170, 1) : 0);
        lab2.textContent = fill('각도 {a}° · 반경 {b}px', f0(((angC * 180 / Math.PI) + 360) % 360), f0(radC));
    }
    const cfg2 = {
        count: 3,
        build(i) {
            pi2 = i;
            ringA = make('i', 'ring ring--hit s2__ra', scEl);
            put(ringA, 232 - 170, 86 - 170, 340, 340);
            const gr = make('div', 's2__g', scEl);
            ringB = make('i', 'ring s2__rb', gr);
            put(gr, 232 - ORBIT_R[i], 86 - ORBIT_R[i], ORBIT_R[i] * 2, ORBIT_R[i] * 2);
            put(ringB, 0, 0, ORBIT_R[i] * 2, ORBIT_R[i] * 2);
            make('i', 's2__c', gr);
            orb = make('div', 's2__o', scEl);
            orb.innerHTML = '<svg viewBox="0 0 256 256" width="24" height="24" aria-hidden="true"><path d="M128,32a16,16,0,0,1,16,16V96l46.9-27.1a16,16,0,1,1,16,27.7L160,124l46.9,27.1a16,16,0,1,1-16,27.7L144,152v48a16,16,0,0,1-32,0V152l-46.9,27.1a16,16,0,1,1-16-27.7L96,124,49.1,96.6a16,16,0,1,1,16-27.7L112,96V48A16,16,0,0,1,128,32Z" fill="#17141a" fill-opacity=".25"/><path d="M128,24a16,16,0,0,1,16,16V88l46.9-27.1a16,16,0,1,1,16,27.7L160,116l46.9,27.1a16,16,0,1,1-16,27.7L144,144v48a16,16,0,0,1-32,0V144l-46.9,27.1a16,16,0,1,1-16-27.7L96,116,49.1,88.6a16,16,0,1,1,16-27.7L112,88V40A16,16,0,0,1,128,24Z" fill="none" stroke="#17141a" stroke-width="14"/></svg>';
            lab2 = label(scEl, 'tag', 16, 10, '');
            cur2 = newCursor();
            angC = -Math.PI / 2;
            radC = ORBIT_R[i];
            return 2000;
        },
        frame(t, overlay) {
            t2 = t;
            const k = clamp((t - tPrev2) / 1000, 0.001, 0.05);
            tPrev2 = t;
            const p = overlay ? ptr2 : path2(t);
            step2(p[0], p[1], k);
            const d = Math.hypot(p[0] - CX2, p[1] - CY2);
            return fill('지금 {a}ms · 커서 거리 {b}px · 궤도 반경 {c}/{d}px', f0(t), f0(d), f0(radC), f0(ORBIT_R[pi2]));
        },
        pointer(x, y, type, down) {
            ptr2 = [x, y];
        },
    };
    let tPrev2 = 0;
    run(cfg2);
    setReads('ORBIT_R ' + f0(ORBIT_R[0]) + ' · NEAR_R ' + f0(NEAR_R) + ' · atan2', '아이콘 = center + polar(atan2, R×(d−NEAR_R)/(170−NEAR_R)) — 각도는 즉시, 반경은 lerp 관성');
    return undefined;
}
})();
</script>
</body>
</html>
