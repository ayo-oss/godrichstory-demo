<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Spring Return That Overshoots Past the Origin on Release — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="Demo stage: Space or Enter pauses, R restarts, left and right arrows pick another value">
      <div class="ez__scene" data-role="scene" role="img" aria-label="When the cursor leaves the radius the button springs back past the origin, the ringing drawn in a plot beside it"></div>
      <p class="ez__status" data-role="status" aria-live="off">Scene ready</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
    // 무대 좌표 — 안쪽 상자는 늘 480x300 이고 화면 크기에 맞춰 통째로 줄인다 (왼쪽 위 모서리 기준)
    const W = 480;
    const SW = 464; // 장면 폭 (480 - 좌우 8px)
    const SH = 190; // 장면 높이
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 고정 해시 — Math.random 대신 시드로 같은 값을 되돌려 받는다
    function hash(i, s) {
        const x = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    // 감쇠 spring 한 걸음 (반명시 오일러) — 속성 트윈이 아니라 적분이다
    // k: 강성(N/m 비례) · c: 감쇠 계수 · dt: 고정 시간 간격(초)
    function spring(x, v, tx, k, c, dt) {
        const a = -k * (x - tx) - c * v;
        const v2 = v + a * dt;
        return [x + v2 * dt, v2];
    }
    // 문구 틀의 {a} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    // ── 무대 요소
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // 장면 inside 요소를 만든다. 클래스는 cx 를 거쳐 CSS 모듈 이름으로 바뀐다
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    // 지시 텍스트 (레이블·칩 글자) — 화면 문구는 전부 문구 사전을 거친다
    function label(parent, cls, x, y, text) {
        const e = make('b', cls, parent);
        e.textContent = text;
        put(e, x, y, 0, 0);
        return e;
    }
    // 변위 비례 그림자 — 요소의 box-shadow 깊이가 그 순간 당김 변위에서 나온다 (면 전파 레이어)
    function shadowAt(e, disp, max) {
        const k = clamp(Math.abs(disp) / max, 0, 1);
        e.style.boxShadow = '0 ' + f0(8 + 24 * k) + 'px ' + f0(16 + 28 * k) + 'px rgba(23, 20, 26, ' + (0.45 + 0.35 * k).toFixed(2) + '), 0 0 ' + f0(8 + 34 * k) + 'px rgba(255, 247, 230, ' + (0.10 + 0.22 * k).toFixed(2) + ')';
    }
    const scEl = make('div', 'sc', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        scEl.textContent = '';
    }
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    function newCursor() {
        const f = make('i', 'fld', scEl);
        const c = make('div', 'cur', scEl);
        make('i', 'cur__d', c);
        return {
            el: c,
            set(x, y, pull01) {
                const s = 0.5 + 2.2 * clamp(pull01, 0, 1);
                f.style.transform = 'translate(' + (x - 96) + 'px,' + (y - 96) + 'px) scale(' + f1(s) + ')';
                f.style.opacity = pull01 > 0.02 ? String(0.28 + 0.5 * pull01) : '0';
                c.style.transform = 'translate(' + (x - 9) + 'px,' + (y - 9) + 'px)';
            },
            show(b) { c.style.opacity = b ? '1' : '0'; },
        };
    }
    // 거리 감쇠 당김 — d 가 RADIUS 안일 때만 성립하고 p 제곱으로 멀수록 약해진다
    function pullAmt(d, radius, pullMax, p) {
        if (d >= radius) {
            return 0;
        }
        return pullMax * Math.pow(1 - d / radius, p);
    }
    // 당김 세기 0~1 — 커서 필드 링의 크기·투명도가 이 값 하나에서 나온다
    function pull01(d, radius, p) {
        if (d >= radius) {
            return 0;
        }
        return Math.pow(1 - d / radius, p);
    }
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        let lastPtrT = -9999; // 마지막 실제 포인터 입력 시각 (시연 시각 t 기준)
        const FIX_T = 1200; // 줄이기 모드에서 보여 줄 대표 순간 (끌려온 상태)
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            cycle = Math.max(2000, cfg.build(pi));
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function nowT() {
            const ct = clock ? Number(clock.currentTime) : 0;
            return isFinite(ct) ? ct : 0;
        }
        function tick() {
            const t = nowT();
            const overlay = lastPtrT >= 0 && t - lastPtrT < 1500 && t >= lastPtrT;
            const s = cfg.frame(paused ? nowT() : t, overlay);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            if (reduced) {
                // 줄이기 모드에서도 프리셋 전환은 즉시 한 장 다시 그린다 (입력이 화면에 반영된다)
                statusP.textContent = cfg.frame(FIX_T, false);
            }
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        // 실제 포인터 — 장면 좌표로 바꿔 항목에 넘긴다. 터치는 pointerType 으로 갈린다
        function toScene(ev) {
            const r = sceneEl.getBoundingClientRect();
            const k = r.width / SW;
            return [(ev.clientX - r.left) / k, (ev.clientY - r.top) / k];
        }
        padEl.addEventListener('pointermove', function (ev) {
            const p = toScene(ev);
            lastPtrT = nowT();
            cfg.pointer(p[0], p[1], ev.pointerType || 'mouse', (ev.buttons & 1) === 1);
            // 줄이기 모드에서도 입력이 화면에 반영된다 — 목표 갱신 뒤 한 장 다시 그린다
            if (reduced) {
                statusP.textContent = cfg.frame(nowT(), true);
            }
        }, { signal: off.signal });
        padEl.addEventListener('pointerdown', function (ev) {
            const p = toScene(ev);
            lastPtrT = nowT();
            cfg.pointer(p[0], p[1], ev.pointerType || 'mouse', true);
            if (reduced) {
                statusP.textContent = cfg.frame(nowT(), true);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            // 탭이 숨으면 멈추고 돌아오면 이어 간다 — 시계 애니메이션이 상태를 기억한다
            if (document.hidden) {
                setPaused(true);
            }
            else if (!reduced) {
                setPaused(false);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            // 움직임 줄이기 — 끌려온 상태 한 장만 그린다. 입력·프리셋 전환은 frame 1회 재호출로 반영된다
            statusP.textContent = cfg.frame(FIX_T, false);
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }
    // ── 05 놓으면 출발점을 넘었다 돌아오는 spring 오버슈트
    // pull(lerp) → 반경 이탈 순간 감쇠 spring 적분으로 복귀. 오버슈트와 정착 시각을 잰다.
    // 실패판은 이탈 시 target 만 0 으로 옮겨 lerp 끌림이 커서 방향으로 남는다.
    const SPR_K = [110, 240, 110];
    const SPR_C = 14;
    const CX5 = 232;
    const CY5 = 84;
    let btn5 = null;
    let btn5f = null;
    let cur5 = null;
    let strip = null;
    let lab5 = null;
    let lab5f = null;
    let pos5 = [0, 0];
    let vel5 = [0, 0];
    let mode5 = 'pull'; // pull | spring
    let pos5f = [0, 0];
    let leaveT = -1;
    let settleT = -1; // ±0.5px 대에 마지막으로 들어와 머문 시각
    let osc = 0; // 출발점 통과 횟수 (오버슈트)
    let trail = [];
    let ptr5 = [232, 200];
    let pi5 = 0;
    let t5 = 0;
    function path5(t) {
        // 접근 → 원 inside 로드 → 빠른 이탈 (spring 구간을 넉넉히)
        const k = (t - 200) / 1600;
        return [232 + Math.sin(k * Math.PI * 2) * 130, 84 + Math.cos(k * Math.PI * 2) * 34];
    }
    function step5(x, y, dt) {
        if (!btn5 || !btn5f || !cur5 || !strip || !lab5 || !lab5f) {
            return;
        }
        const dx = CX5 - x;
        const dy = CY5 - y;
        const d = Math.hypot(dx, dy);
        const inR = d <= 120;
        if (mode5 === 'pull') {
            if (inR) {
                const a = pullAmt(d, 120, 30, 2);
                let mx = 0;
                let my = 0;
                if (d > 0.001) {
                    mx = dx / d;
                    my = dy / d;
                }
                const tx = a * mx;
                const ty = a * my;
                pos5[0] = lerp(pos5[0], tx, Math.min(1, dt * 14));
                pos5[1] = lerp(pos5[1], ty, Math.min(1, dt * 14));
                // 실패판도 같은 lerp pull
                pos5f[0] = pos5[0];
                pos5f[1] = pos5[1];
            }
            else {
                // 이탈 순간 — 정상판은 spring 적분으로 넘긴다
                mode5 = 'spring';
                leaveT = t5;
                settleT = -1;
                osc = 0;
                vel5 = [(pos5[0] / Math.max(0.001, dt)) * 0.02, (pos5[1] / Math.max(0.001, dt)) * 0.02];
            }
        }
        if (mode5 === 'spring') {
            const r0 = spring(pos5[0], vel5[0], 0, SPR_K[pi5], SPR_C, dt);
            const r1 = spring(pos5[1], vel5[1], 0, SPR_K[pi5], SPR_C, dt);
            const px = pos5[0];
            const py = pos5[1];
            pos5 = [r0[0], r1[0]];
            vel5 = [r0[1], r1[1]];
            // 부호가 바뀌면 출발점을 통과했다 (오버슈트)
            if (px * pos5[0] < 0 || py * pos5[1] < 0) {
                osc += 1;
            }
            const mag = Math.hypot(pos5[0], pos5[1]);
            if (mag <= 0.5) {
                settleT = t5;
            }
            // 실패판 — spring 없이 lerp 목표만 0 (pull 잔류)
            pos5f[0] = lerp(pos5f[0], 0, Math.min(1, dt * 2.2));
            pos5f[1] = lerp(pos5f[1], 0, Math.min(1, dt * 2.2));
        }
        btn5.style.transform = 'translate(' + f1(pos5[0]) + 'px,' + f1(pos5[1]) + 'px)';
        shadowAt(btn5, pos5[0], 30);
        btn5f.style.transform = 'translate(' + f1(pos5f[0]) + 'px,' + f1(pos5f[1]) + 'px)';
        // 변위 스트립 플롯 — x(t) 궤적을 오른쪽으로 흘린다
        trail.push(pos5[0]);
        if (trail.length > 224) {
            trail.shift();
        }
        if (strip) {
            strip.textContent = '';
        }
        for (let i = 0; i < trail.length; i += 1) {
            const b = make('i', 's5__pt' + (trail[i] >= 0 ? 'p' : 'n'), strip);
            put(b, 4 + i * 2, 22 - clamp(Math.abs(trail[i]), 0, 20), 2, 2);
        }
        cur5.set(x, y, inR ? pull01(d, 120, 2) : 0);
        const zeta = SPR_C / (2 * Math.sqrt(SPR_K[pi5]));
        lab5.textContent = settleT >= 0
            ? fill('zeta {a} · overshoot {b} · settled {c}ms', f1(zeta), f0(osc), f0(settleT - leaveT))
            : fill('zeta {a} · overshoot {b}', f1(zeta), f0(osc));
        lab5f.textContent = fill('failing residue {a}px', f1(Math.hypot(pos5f[0], pos5f[1])));
    }
    const cfg5 = {
        count: 3,
        build(i) {
            pi5 = i;
            pos5 = [0, 0];
            vel5 = [0, 0];
            pos5f = [0, 0];
            mode5 = 'pull';
            leaveT = -1;
            settleT = -1;
            osc = 0;
            trail = [];
            btn5 = make('div', 'mbtn s5__b', scEl);
            make('span', 'mbtn__t', btn5).textContent = 'Go back';
            strip = make('div', 's5__st', scEl);
            lab5 = label(scEl, 'tag', 16, 10, '');
            btn5f = make('div', 'mbtn mbtn--sm s5__bf', scEl);
            make('span', 'mbtn__t', btn5f).textContent = 'Go back';
            btn5f.style.left = '348px';
            btn5f.style.top = '56px';
            lab5f = label(scEl, 'tag', 344, 92, '');
            cur5 = newCursor();
            return 2000;
        },
        frame(t, overlay) {
            t5 = t;
            const dt = clamp((t - tPrev5) / 1000, 0.001, 0.05);
            tPrev5 = t;
            const p = overlay ? ptr5 : path5(t);
            step5(p[0], p[1], dt);
            return fill('Now {a}ms · SPR_K {b} · mode {c} · displacement {d}px', f0(t), f0(SPR_K[pi5]), mode5 === 'pull' ? 'pull' : 'spring', f1(Math.hypot(pos5[0], pos5[1])));
        },
        pointer(x, y, type, down) {
            ptr5 = [x, y];
            if (mode5 === 'spring' && Math.hypot(CX5 - x, CY5 - y) <= 120) {
                mode5 = 'pull';
            }
        },
    };
    let tPrev5 = 0;
    run(cfg5);
    setReads('SPR_K ' + f0(SPR_K[0]) + ' · SPR_C ' + f0(SPR_C), 'On exit the velocity carries into the integral; zeta = c/(2√k), each crossing of the origin counts as overshoot');
    return undefined;
}
})();
</script>
</body>
</html>
