<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Nav Links With Different Radii Each — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="Demo stage: Space or Enter pauses, R restarts, left and right arrows pick another value">
      <div class="ez__scene" data-role="scene" role="img" aria-label="Three nav links with different radii pull the cursor, and where they overlap the nearer one wins"></div>
      <p class="ez__status" data-role="status" aria-live="off">Scene ready</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
    // 무대 좌표 — 안쪽 상자는 늘 480x300 이고 화면 크기에 맞춰 통째로 줄인다 (왼쪽 위 모서리 기준)
    const W = 480;
    const SW = 464; // 장면 폭 (480 - 좌우 8px)
    const SH = 190; // 장면 높이
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 고정 해시 — Math.random 대신 시드로 같은 값을 되돌려 받는다
    function hash(i, s) {
        const x = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    // 감쇠 spring 한 걸음 (반명시 오일러) — 속성 트윈이 아니라 적분이다
    // k: 강성(N/m 비례) · c: 감쇠 계수 · dt: 고정 시간 간격(초)
    function spring(x, v, tx, k, c, dt) {
        const a = -k * (x - tx) - c * v;
        const v2 = v + a * dt;
        return [x + v2 * dt, v2];
    }
    // 문구 틀의 {a} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    // ── 무대 요소
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // 장면 inside 요소를 만든다. 클래스는 cx 를 거쳐 CSS 모듈 이름으로 바뀐다
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    // 지시 텍스트 (레이블·칩 글자) — 화면 문구는 전부 문구 사전을 거친다
    function label(parent, cls, x, y, text) {
        const e = make('b', cls, parent);
        e.textContent = text;
        put(e, x, y, 0, 0);
        return e;
    }
    // 변위 비례 그림자 — 요소의 box-shadow 깊이가 그 순간 당김 변위에서 나온다 (면 전파 레이어)
    function shadowAt(e, disp, max) {
        const k = clamp(Math.abs(disp) / max, 0, 1);
        e.style.boxShadow = '0 ' + f0(8 + 24 * k) + 'px ' + f0(16 + 28 * k) + 'px rgba(23, 20, 26, ' + (0.45 + 0.35 * k).toFixed(2) + '), 0 0 ' + f0(8 + 34 * k) + 'px rgba(255, 247, 230, ' + (0.10 + 0.22 * k).toFixed(2) + ')';
    }
    const scEl = make('div', 'sc', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        scEl.textContent = '';
    }
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    function newCursor() {
        const f = make('i', 'fld', scEl);
        const c = make('div', 'cur', scEl);
        make('i', 'cur__d', c);
        return {
            el: c,
            set(x, y, pull01) {
                const s = 0.5 + 2.2 * clamp(pull01, 0, 1);
                f.style.transform = 'translate(' + (x - 96) + 'px,' + (y - 96) + 'px) scale(' + f1(s) + ')';
                f.style.opacity = pull01 > 0.02 ? String(0.28 + 0.5 * pull01) : '0';
                c.style.transform = 'translate(' + (x - 9) + 'px,' + (y - 9) + 'px)';
            },
            show(b) { c.style.opacity = b ? '1' : '0'; },
        };
    }
    // 거리 감쇠 당김 — d 가 RADIUS 안일 때만 성립하고 p 제곱으로 멀수록 약해진다
    function pullAmt(d, radius, pullMax, p) {
        if (d >= radius) {
            return 0;
        }
        return pullMax * Math.pow(1 - d / radius, p);
    }
    // 당김 세기 0~1 — 커서 필드 링의 크기·투명도가 이 값 하나에서 나온다
    function pull01(d, radius, p) {
        if (d >= radius) {
            return 0;
        }
        return Math.pow(1 - d / radius, p);
    }
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        let lastPtrT = -9999; // 마지막 실제 포인터 입력 시각 (시연 시각 t 기준)
        const FIX_T = 1200; // 줄이기 모드에서 보여 줄 대표 순간 (끌려온 상태)
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            cycle = Math.max(2000, cfg.build(pi));
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function nowT() {
            const ct = clock ? Number(clock.currentTime) : 0;
            return isFinite(ct) ? ct : 0;
        }
        function tick() {
            const t = nowT();
            const overlay = lastPtrT >= 0 && t - lastPtrT < 1500 && t >= lastPtrT;
            const s = cfg.frame(paused ? nowT() : t, overlay);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            if (reduced) {
                // 줄이기 모드에서도 프리셋 전환은 즉시 한 장 다시 그린다 (입력이 화면에 반영된다)
                statusP.textContent = cfg.frame(FIX_T, false);
            }
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        // 실제 포인터 — 장면 좌표로 바꿔 항목에 넘긴다. 터치는 pointerType 으로 갈린다
        function toScene(ev) {
            const r = sceneEl.getBoundingClientRect();
            const k = r.width / SW;
            return [(ev.clientX - r.left) / k, (ev.clientY - r.top) / k];
        }
        padEl.addEventListener('pointermove', function (ev) {
            const p = toScene(ev);
            lastPtrT = nowT();
            cfg.pointer(p[0], p[1], ev.pointerType || 'mouse', (ev.buttons & 1) === 1);
            // 줄이기 모드에서도 입력이 화면에 반영된다 — 목표 갱신 뒤 한 장 다시 그린다
            if (reduced) {
                statusP.textContent = cfg.frame(nowT(), true);
            }
        }, { signal: off.signal });
        padEl.addEventListener('pointerdown', function (ev) {
            const p = toScene(ev);
            lastPtrT = nowT();
            cfg.pointer(p[0], p[1], ev.pointerType || 'mouse', true);
            if (reduced) {
                statusP.textContent = cfg.frame(nowT(), true);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            // 탭이 숨으면 멈추고 돌아오면 이어 간다 — 시계 애니메이션이 상태를 기억한다
            if (document.hidden) {
                setPaused(true);
            }
            else if (!reduced) {
                setPaused(false);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            // 움직임 줄이기 — 끌려온 상태 한 장만 그린다. 입력·프리셋 전환은 frame 1회 재호출로 반영된다
            statusP.textContent = cfg.frame(FIX_T, false);
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }
    // ── 03 링크마다 반경이 다른 내비 3개
    // 프레임마다 세 링크의 거리를 재고 승자(nearest) 하나만 움직인다.
    // 실패판은 판정 없이 전원이 움직여 두 링크가 겹친다.
    const RADII3 = [[96, 64, 128], [72, 72, 72], [96, 64, 128]];
    const LINK_X = [116, 232, 348];
    const CY3 = 84;
    let links = [];
    let linksF = [];
    let cur3 = null;
    let labs = [];
    let x3 = [0, 0, 0];
    let v3 = [0, 0, 0];
    let x3f = [0, 0, 0];
    let winner = -1;
    let ptr3 = [232, 200];
    let pi3 = 0;
    let t3 = 0;
    function path3(t) {
        const k = (t - 200) / 1600;
        return [232 + Math.sin(k * Math.PI * 2) * 130, 84 + Math.sin(k * Math.PI * 3) * 30];
    }
    function step3(x, y, dt) {
        const rs = RADII3[pi3];
        let best = -1;
        let bd = 1e9;
        const ds = [];
        for (let i = 0; i < 3; i += 1) {
            const d = Math.hypot(x - LINK_X[i], y - CY3);
            ds.push(d);
            if (d <= rs[i] && d < bd) {
                bd = d;
                best = i;
            }
        }
        winner = best;
        for (let i = 0; i < 3; i += 1) {
            // 승자는 커서 방향 감쇠 당김, 패자는 감쇠 스프링으로 제자리
            const d = ds[i];
            let tx = 0;
            if (best === i && d > 0.001) {
                tx = clamp(pullAmt(d, rs[i], 22, 2) * (x - LINK_X[i]) / d, -26, 26);
            }
            const r = spring(x3[i], v3[i], tx, 110, 14, dt);
            x3[i] = r[0];
            v3[i] = r[1];
            links[i].style.transform = 'translate(' + f1(x3[i]) + 'px,0)';
            shadowAt(links[i], x3[i], 26);
            // Failing: everyone pulls with no overlap verdict
            let tf = 0;
            if (d > 0.001) {
                tf = clamp(pullAmt(d, rs[i], 22, 2) * (x - LINK_X[i]) / d, -26, 26);
            }
            x3f[i] = lerp(x3f[i], tf, Math.min(1, dt * 12));
            linksF[i].style.transform = 'translate(' + f1(x3f[i]) + 'px,0)';
            labs[i].textContent = best === i ? fill('winner · R {a} · d {b}', f0(rs[i]), f0(d)) : fill('R {a} · d {b}', f0(rs[i]), f0(d));
        }
        if (cur3) {
            cur3.set(x, y, best >= 0 ? pull01(ds[best], rs[best], 2) : 0);
        }
    }
    const cfg3 = {
        count: 3,
        build(i) {
            pi3 = i;
            links = [];
            linksF = [];
            labs = [];
            x3 = [0, 0, 0];
            v3 = [0, 0, 0];
            x3f = [0, 0, 0];
            const rs = RADII3[i];
            for (let j = 0; j < 3; j += 1) {
                const a = make('div', 'nav s3__n', scEl);
                put(a, LINK_X[j] - 44, CY3 - 15, 88, 30);
                make('span', '', a).textContent = ['About', 'Work', 'Contact'][j];
                const rg = make('i', 'ring ring--hit', scEl);
                put(rg, LINK_X[j] - rs[j], CY3 - rs[j], rs[j] * 2, rs[j] * 2);
                labs.push(label(scEl, 'tag', LINK_X[j] - 36, CY3 + 22, ''));
                links.push(a);
                const b = make('div', 'nav nav--sm s3__nf', scEl);
                put(b, LINK_X[j] - 36, 150, 72, 24);
                make('span', '', b).textContent = ['About', 'Work', 'Contact'][j];
                linksF.push(b);
            }
            label(scEl, 'tag', 16, 178, 'Failing: everyone pulls with no overlap verdict');
            cur3 = newCursor();
            return 2000;
        },
        frame(t, overlay) {
            t3 = t;
            const dt = clamp((t - tPrev3) / 1000, 0.001, 0.05);
            tPrev3 = t;
            const p = overlay ? ptr3 : path3(t);
            step3(p[0], p[1], dt);
            return fill('Now {a}ms · winner {b} · radii {c}/{d}/{e}px', f0(t), winner < 0 ? 'none' : fill('home {a}', f0(winner + 1)), f0(RADII3[pi3][0]), f0(RADII3[pi3][1]), f0(RADII3[pi3][2]));
        },
        pointer(x, y, type, down) {
            ptr3 = [x, y];
        },
    };
    let tPrev3 = 0;
    run(cfg3);
    setReads('RADII [96,64,128] (arrows compare an equal-radius version)', 'The winner is the single nearest link inside its radius; losers spring home');
    return undefined;
}
})();
</script>
</body>
</html>
