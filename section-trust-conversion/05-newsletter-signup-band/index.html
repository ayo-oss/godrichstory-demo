<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsletter signup band — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <form class="nl" novalidate>
    <span class="nl__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="22" height="22"><g fill="currentColor"><path d="m224 56l-96 88l-96-88Z" opacity=".2"/><path d="M224 48H32a8 8 0 0 0-8 8v136a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a8 8 0 0 0-8-8m-20.57 16L128 133.15L52.57 64ZM216 192H40V74.19l82.59 75.71a8 8 0 0 0 10.82 0L216 74.19z"/></g></svg></span>
    <p class="nl__title">새 컴포넌트 소식 받기</p>
    <div class="nl__row">
      <label for="nl-email" class="sr-only">이메일 주소</label>
      <input id="nl-email" class="nl__input" type="email" placeholder="you@example.com" autocomplete="email">
      <button type="submit" class="nl__submit">
        <span class="nl__submit-text">구독하기</span>
        <svg class="nl__check" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><polyline points="4 12 9 17 20 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <p class="nl__msg" role="status"></p>
  </form>
</main>
<script>
// 실제 동작: 이메일 형식을 정규식으로 검사해 통과하면 버튼 글자가 "구독 완료"로 바뀌며 체크가 stroke-dashoffset 으로 실제로 그려지고, 틀리면 입력칸이 좌우로 짧게 흔들린다.
var form = document.querySelector('.nl');
var input = document.getElementById('nl-email');
var btn = document.querySelector('.nl__submit');
var msg = document.querySelector('.nl__msg');
var RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
form.addEventListener('submit', function (e) {
  e.preventDefault();
  if (RE.test(input.value)) {
    form.classList.add('is-done');
    btn.querySelector('.nl__submit-text').textContent = '구독 완료';
    msg.textContent = input.value + ' 주소로 확인 메일을 보냈어요.';
  } else {
    input.classList.remove('is-shake');
    void input.offsetWidth;
    input.classList.add('is-shake');
    msg.textContent = '이메일 형식을 다시 확인해 주세요.';
  }
});
</script>
</body>
</html>
