<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team members grid — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="tm">
    <p class="tm__title">
      <span class="tm__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="18" height="18"><g fill="currentColor"><path d="M168 144a40 40 0 1 1-40-40a40 40 0 0 1 40 40M64 56a32 32 0 1 0 32 32a32 32 0 0 0-32-32m128 0a32 32 0 1 0 32 32a32 32 0 0 0-32-32" opacity=".2"/><path d="M244.8 150.4a8 8 0 0 1-11.2-1.6A51.6 51.6 0 0 0 192 128a8 8 0 0 1 0-16a24 24 0 1 0-23.24-30a8 8 0 1 1-15.5-4A40 40 0 1 1 219 117.51a67.94 67.94 0 0 1 27.43 21.68a8 8 0 0 1-1.63 11.21M190.92 212a8 8 0 1 1-13.85 8a57 57 0 0 0-98.15 0a8 8 0 1 1-13.84-8a72.06 72.06 0 0 1 33.74-29.92a48 48 0 1 1 58.36 0A72.06 72.06 0 0 1 190.92 212M128 176a32 32 0 1 0-32-32a32 32 0 0 0 32 32m-56-56a8 8 0 0 0-8-8a24 24 0 1 1 23.24-30a8 8 0 1 0 15.5-4A40 40 0 1 0 37 117.51a67.94 67.94 0 0 0-27.4 21.68a8 8 0 1 0 12.8 9.61A51.6 51.6 0 0 1 64 128a8 8 0 0 0 8-8"/></g></svg></span>
      팀 소개
    </p>
    <ul class="tm__grid">
      <li class="tm__card">
        <button type="button" class="tm__head" aria-expanded="false">
          <span class="tm__avatar">이</span>
          <span class="tm__meta"><b>이서윤</b><i>제품 디자인</i></span>
        </button>
        <div class="tm__bio"><p>3년째 컴포넌트 라이브러리를 다듬고 있어요. 커피보다 그리드를 더 좋아해요.</p></div>
      </li>
      <li class="tm__card">
        <button type="button" class="tm__head" aria-expanded="false">
          <span class="tm__avatar">박</span>
          <span class="tm__meta"><b>박도현</b><i>프런트엔드</i></span>
        </button>
        <div class="tm__bio"><p>접근성 없는 인터랙션은 안 만든다는 원칙으로 일해요.</p></div>
      </li>
      <li class="tm__card">
        <button type="button" class="tm__head" aria-expanded="false">
          <span class="tm__avatar">최</span>
          <span class="tm__meta"><b>최하은</b><i>고객 성공</i></span>
        </button>
        <div class="tm__bio"><p>도입 첫 주를 가장 중요하게 생각해요. 질문은 언제나 환영이에요.</p></div>
      </li>
    </ul>
  </section>
</main>
<script>
// 실제 동작: 카드를 클릭하거나 Enter/Space 를 누르면 aria-expanded 가 바뀌며 그 카드의 한줄 소개가 grid-template-rows 로 실제로 펼쳐지고, 다시 누르면 접힌다.
// .is-demo 자동 재생: 카드를 하나씩 돌아가며 자동으로 펼쳐 보여준다(900ms 마다).
var cards = document.querySelectorAll('.tm__card');
function openOnly(idx) {
  cards.forEach(function (c, n) {
    var on = n === idx;
    c.classList.toggle('is-open', on);
    c.querySelector('.tm__head').setAttribute('aria-expanded', String(on));
  });
}
cards.forEach(function (card, idx) {
  card.querySelector('.tm__head').addEventListener('click', function () {
    var open = card.classList.contains('is-open');
    openOnly(open ? -1 : idx);
    restart();
  });
});
var ti = 0, timer = null;
function tick() { ti = (ti + 1) % cards.length; openOnly(ti); }
function restart() { if (timer) clearInterval(timer); timer = setInterval(tick, 900); }
openOnly(0);
restart();
</script>
</body>
</html>
