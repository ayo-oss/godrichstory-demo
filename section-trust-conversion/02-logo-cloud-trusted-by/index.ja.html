<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo cloud / trusted-by — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="lc">
    <p class="lc__label">
      <span class="lc__badge" aria-hidden="true"><svg viewBox="0 0 256 256" width="16" height="16"><g fill="currentColor"><path d="M232 128c0 12.51-17.82 21.95-22.68 33.69c-4.68 11.32 1.42 30.65-7.78 39.85s-28.53 3.1-39.85 7.78C150 214.18 140.5 232 128 232s-22-17.82-33.69-22.68c-11.32-4.68-30.65 1.42-39.85-7.78s-3.1-28.53-7.78-39.85C41.82 150 24 140.5 24 128s17.82-22 22.68-33.69c4.68-11.31-1.42-30.65 7.78-39.85s28.54-3.1 39.85-7.78C106.05 41.82 115.5 24 128 24s22 17.82 33.69 22.68c11.32 4.68 30.65-1.42 39.85 7.78s3.1 28.53 7.78 39.85C214.18 106.05 232 115.5 232 128" opacity=".2"/><path d="m165.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L104 148.69l50.34-50.35a8 8 0 0 1 11.32 0"/></g></svg></span>
      500以上のチームが導入中
    </p>
    <button type="button" class="lc__toggle" aria-pressed="false">一時停止</button>
    <div class="lc__viewport">
      <ul class="lc__track" aria-hidden="true">
        <li>NORTHWARD</li><li>ORBITAL</li><li>VESTA LABS</li><li>KAIROS</li><li>ATLAS CO</li><li>LUMEN</li>
        <li>NORTHWARD</li><li>ORBITAL</li><li>VESTA LABS</li><li>KAIROS</li><li>ATLAS CO</li><li>LUMEN</li>
      </ul>
    </div>
    <p class="sr-only">導入企業: Northward, Orbital, Vesta Labs, Kairos, Atlas Co, Lumen</p>
  </section>
</main>
<script>
// 실제 동작: 버튼을 누르면 aria-pressed 가 바뀌며 흐르는 로고 줄이 실제로 멈추고 다시 누르면 이어서 흐른다.
var track = document.querySelector('.lc__track');
var btn = document.querySelector('.lc__toggle');
btn.addEventListener('click', function () {
  var paused = btn.getAttribute('aria-pressed') === 'true';
  btn.setAttribute('aria-pressed', String(!paused));
  btn.textContent = paused ? '一時停止' : '再生';
  track.style.animationPlayState = paused ? 'running' : 'paused';
});
</script>
</body>
</html>
