<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pointer-events で2つのトラックがひとつに重なるオーバーレイ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="デモの舞台 — SpaceかEnterで一時停止、Rで最初から、左右の矢印キーで別の値へ">
      <div class="ez__scene" data-role="scene" role="img" aria-label="上のトラックの pointer-events をつまみだけに残し、クリックが下のレイヤーへ通るオーバーレイの場面"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">場面の準備</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
    // 무대 좌표 — 안쪽 상자는 늘 480x300 이고 화면 폭에 맞춰 통째로 줄인다
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    const SVGW = 448;
    const SVGH = 156;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    // ── 무대 요소
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const SVGNS = 'http://www.w3.org/2000/svg';
    // 장면 안 요소를 만든다. 클래스는 cx 를 거쳐 CSS 모듈 이름으로 바뀐다
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    // SVG 무대 — 장면마다 이 안에 path·circle·text 를 놓는다
    function makeSvg() {
        const s = document.createElementNS(SVGNS, 'svg');
        s.setAttribute('viewBox', '0 0 ' + SVGW + ' ' + SVGH);
        s.setAttribute('class', cx('sc'));
        scWrap.appendChild(s);
        return s;
    }
    function svgEl(tag, cls, parent) {
        const e = document.createElementNS(SVGNS, tag);
        if (cls) {
            e.setAttribute('class', cx(cls));
        }
        parent.appendChild(e);
        return e;
    }
    function svgPath(parent, cls, d) {
        const p = svgEl('path', cls, parent);
        p.setAttribute('d', d);
        return p;
    }
    function svgText(parent, cls, x, y, txt) {
        const t = svgEl('text', cls, parent);
        t.setAttribute('x', String(x));
        t.setAttribute('y', String(y));
        t.textContent = txt;
        return t;
    }
    // 그리기 주역: dasharray 를 총 길이로 두고 dashoffset 을 길이 x (1 - p) 로 내린다
    function setDraw(p, total, p01) {
        p.setAttribute('stroke-dasharray', String(total));
        p.setAttribute('stroke-dashoffset', String(total * (1 - clamp(p01, 0, 1))));
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        // clkEl(시계)은 sceneEl 에 직접 붙어 있으므로 래퍼만 비운다 — 시계를 지우면 렌더 시계가 죽는다
        scWrap.textContent = '';
        chartEl.textContent = '';
        probeEl.textContent = '';
    }
    // ── 경로 길이 측정 — getTotalLength 는 화면에 붙은 뒤에만 값을 준다 (probe 는 visibility:hidden 상자)
    function measure(d) {
        const svg = document.createElementNS(SVGNS, 'svg');
        svg.setAttribute('viewBox', '0 0 ' + SVGW + ' ' + SVGH);
        svg.setAttribute('class', cx('sc'));
        probeEl.appendChild(svg);
        const p = svgPath(svg, '', d);
        const len = p.getTotalLength();
        probeEl.removeChild(svg);
        return len;
    }
    // 경로 위 at 지점의 좌표 — getPointAtLength (probe 의 임시 사본으로 잰다)
    // vb = 메인 svg 의 viewBox — 장면이 시선을 확대했으면 같은 값을 넘겨야 좌표가 어긋나지 않는다
    function pointAt(d, at, vb) {
        const svg = document.createElementNS(SVGNS, 'svg');
        svg.setAttribute('viewBox', vb || ('0 0 ' + SVGW + ' ' + SVGH));
        svg.setAttribute('class', cx('sc'));
        probeEl.appendChild(svg);
        const p = svgPath(svg, '', d);
        const pt = p.getPointAtLength(at);
        probeEl.removeChild(svg);
        return { x: pt.x, y: pt.y };
    }
    // 정점 오프셋 — 시드 해시(재생해도 같은 값). Math.random 을 쓰지 않는다
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    // ── 엔진이 푼 時間 읽기 — 모델이 아니라 getAnimations() 와 getComputedTiming() 값
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function delayOf(a) {
        const t = a.effect ? a.effect.getComputedTiming() : null;
        return t && typeof t.delay === 'number' ? t.delay : 0;
    }
    function span(a, max) {
        const t = a.effect ? a.effect.getComputedTiming() : null;
        if (!t) {
            return { s: 0, e: 0, k: 0 };
        }
        const d = typeof t.delay === 'number' ? t.delay : 0;
        const e = typeof t.endTime === 'number' && isFinite(t.endTime) ? t.endTime : max;
        return { s: d, e: Math.min(e, max), k: 0 };
    }
    function phaseStr(e) {
        const t = e ? e.getComputedTiming() : null;
        if (!t || t.localTime === null || t.localTime === undefined) {
            return 'none';
        }
        const lt = Number(t.localTime);
        const d = typeof t.delay === 'number' ? t.delay : 0;
        const end = typeof t.endTime === 'number' ? t.endTime : Infinity;
        if (lt < d) {
            return 'before';
        }
        return lt >= end ? 'after' : 'active';
    }
    function phaseOf(a) {
        return phaseStr(a.effect);
    }
    // ── 아래 차트 상자 그리기
    function bar(cls, x, y, w, h) {
        const e = make('i', cls, chartEl);
        put(e, x, y, w, h);
        return e;
    }
    // 가로 막대 줄: 한 줄 = 한 구간
    function drawRows(segs, max) {
        const n = segs.length;
        const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
        const out = [];
        for (let i = 0; i < n; i += 1) {
            const sg = segs[i];
            const x = CX0 + clamp(sg.s, 0, max) / max * CW;
            const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
            out.push(bar('bar k' + sg.k, x, 5 + i * (h + 1), w, h));
        }
        return out;
    }
    function axis(max) {
        const a = make('b', 'ax', chartEl);
        a.textContent = '0';
        put(a, CX0, 40, 0, 0);
        const b = make('b', 'ax ax--r', chartEl);
        b.textContent = f0(max) + 'ms';
        put(b, CX0 + CW - 60, 40, 60, 0);
    }
    function marker(ms, max, cls) {
        bar('mk ' + cls, CX0 + clamp(ms, 0, max) / max * CW, 2, 2, 44);
    }
    // ── 값 전파 밴드 — 항목의 계산값(pct)을 넓은 배경 톤에 같은 함수로 흘려보낸다
    //    (컴포넌트 편 품질: 면적을 부풀리는 게 아니라 값의 전파 범위를 넓히는 것 — 경계가 값과 함께 움직인다)
    function makeBand(x, y, w, h) {
        const b = make('i', 'vb', scWrap);
        put(b, x, y, w, h);
        return b;
    }
    // 가로 밴드: p1..p2 (0..1) 구간만 c2a→c2b 그라디언트, 나머지 c1 — 구간이 움직이면
    // 경계 2개뿐 아니라 구간 내부 픽셀 전부가 같은 프레임에 다시 계산된다
    function bandH(b, c1, c2a, c2b, p1, p2) {
        const a = clamp(p1, 0, 1) * 100;
        const z = clamp(p2, 0, 1) * 100;
        b.style.background = 'linear-gradient(90deg,' + c1 + ' 0%,' + c1 + ' ' + a + '%,' + c2a + ' ' + a + '%,' + c2b + ' ' + z + '%,' + c1 + ' ' + z + '%,' + c1 + ' 100%)';
    }
    // 세로 밴드(06 세로 레일) — 180deg 로 돌려 같은 산술
    function bandV(b, c1, c2a, c2b, p1, p2) {
        const a = clamp(p1, 0, 1) * 100;
        const z = clamp(p2, 0, 1) * 100;
        b.style.background = 'linear-gradient(180deg,' + c1 + ' 0%,' + c1 + ' ' + a + '%,' + c2a + ' ' + a + '%,' + c2b + ' ' + z + '%,' + c1 + ' ' + z + '%,' + c1 + ' 100%)';
    }
    let headEl = null;
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            cycle = Math.max(2000, cfg.build(pi));
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                setPaused(true);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            // 움직임 줄이기 — 모든 애니메이션이 꺼지고 장면은 완성 상태 한 장이다 (build 마지막 프레임을 그린다)
            statusP.textContent = '動きを減らす設定 · 静的接触状態';
            readB.textContent = '延びなしで接する前と後の2状態だけを示す';
            doneP.textContent = readB.textContent;
            cfg.frame(1e9);
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }
    // 02 pointer-events 분업 오버레이 — 위 input 은 pointer-events:none, thumb 만 auto 로 되돌려
    //    트랙 클릭이 아래 레이어로 통과해 두 트랙이 한 몸처럼 조작되는 구조를 시각화한다
    const TRACK_X = 64;
    const TRACK_W = 320;
    const THUMB_HIT_PX = 24; // thumb 히트 직경 — 눈에 보이는 원보다 크다
    const SWING_MS = 650;
    let baseTrk = null;
    let overTrk = null;
    let loThm = null; // 위 레이어 thumb (ghost — pointer-events:auto)
    let hiThm = null; // 아래 레이어 thumb
    let peEl = null;
    let zEl = null;
    let bandEl = null;
    let hits = [];
    let hitI = 0;
    function build(_i) {
        // 값 전파 밴드 — 위/아래 레이어 thumb % 사이 구간이 두 트랙을 잇는 배경 톤으로 같이 움직인다
        bandEl = makeBand(TRACK_X - 24, 28, TRACK_W + 48, 96);
        // 아래 레이어 (z-index 1) — 하이 thumb 소유
        baseTrk = make('i', 'trk', scWrap);
        put(baseTrk, TRACK_X, 96, TRACK_W, 6);
        baseTrk.style.zIndex = '1';
        hiThm = make('i', 'thm thm--hi', scWrap);
        if (hiThm) {
            put(hiThm, 0, 90, 18, 18);
            hiThm.style.zIndex = '1';
        }
        // 위 레이어 (z-index 2) — 트랙은 pointer-events:none 이므로 통과, thumb 만 auto
        overTrk = make('i', 'trk trk--ghost', scWrap);
        put(overTrk, TRACK_X, 40, TRACK_W, 6);
        overTrk.style.zIndex = '2';
        loThm = make('i', 'thm thm--ghost', scWrap);
        if (loThm) {
            put(loThm, 0, 34, 18, 18);
            loThm.style.zIndex = '2';
        }
        // 히트 마커 — 아래로 통과한 클릭 자국이 트랙 위에 쌓인다
        hits = [];
        for (let k = 0; k < 24; k += 1) {
            const h = make('i', 'hit', scWrap);
            put(h, 0, 92, 6, 6);
            h.style.opacity = '0';
            h.style.zIndex = '3';
            hits.push(h);
        }
        peEl = make('b', 'ov', sceneEl);
        put(peEl, 24, 6, 260, 14);
        peEl.style.color = 'rgba(23,20,26,.75)';
        peEl.style.fontSize = '10px';
        peEl.style.fontWeight = '700';
        zEl = make('b', 'ov', sceneEl);
        put(zEl, 24, 20, 260, 14);
        zEl.style.color = 'rgba(23,20,26,.75)';
        zEl.style.fontSize = '10px';
        zEl.style.fontWeight = '700';
        const capA = make('b', 'ov', sceneEl);
        put(capA, 356, 40, 60, 12);
        capA.style.color = '#17141a';
        capA.style.fontSize = '9px';
        capA.style.fontWeight = '800';
        capA.textContent = 'z2';
        const capB = make('b', 'ov', sceneEl);
        put(capB, 356, 96, 60, 12);
        capB.style.color = '#17141a';
        capB.style.fontSize = '9px';
        capB.style.fontWeight = '800';
        capB.textContent = 'z1';
        axis(3600);
        hitI = 0;
        return 3800;
    }
    function frame(t) {
        const cyc = SWING_MS * 2;
        const ph = (t % cyc) / cyc;
        const s = ph < 1 ? ph : 2 - ph;
        const loX = TRACK_X + (0.25 - 0.20 * s) * TRACK_W;
        const hiX = TRACK_X + (0.60 + 0.25 * s) * TRACK_W;
        if (bandEl) {
            bandH(bandEl, 'rgba(213,218,234,.12)', 'rgba(235,214,219,.55)', 'rgba(143,216,189,.42)', (loX - TRACK_X) / TRACK_W, (hiX - TRACK_X) / TRACK_W);
        }
        // 장면 톤 전파 — 두 thumb 사이 거리(구간 폭)가 배경 명도로: 위·아래 레이어가 멀어지면 장면이 밝아진다
        const spanT = Math.round(222 + ((hiX - loX) / TRACK_W - 0.35) / 0.65 * 28);
        sceneEl.style.background = 'rgb(' + spanT + ',' + spanT + ',' + (spanT - 6) + ')';
        if (loThm) {
            put(loThm, loX - 9, 34, 18, 18);
        }
        if (hiThm) {
            put(hiThm, hiX - 9, 90, 18, 18);
        }
        // 위 레이어 thumb 히트 영역(24px) 표시 — 눈에 보이는 원(18px)보다 큰 클릭 판정
        const hA = hits[hitI % hits.length];
        hitI += 1;
        if (hA) {
            put(hA, loX - 3, 92, 6, 6);
            hA.style.opacity = '0.9';
        }
        // 오래된 마커는 서서히 지운다
        for (let k = 0; k < hits.length; k += 1) {
            const age = (hitI - k + hits.length) % hits.length;
            hits[k].style.opacity = String(clamp(1 - age / hits.length, 0, 0.9));
        }
        if (peEl) {
            peEl.textContent = '上のinput: pointer-events none · つまみのみ auto (' + THUMB_HIT_PX + 'px 判定)';
        }
        if (zEl) {
            zEl.textContent = '下のinput: z1 · 重なった2つのトラックの分業';
        }
        setReads(fill('THUMB_HIT_PX {a} · Z_INDEX 1/2 · TRACK_ALPHA {b}', f0(THUMB_HIT_PX), '.08'), fill('トラックのクリックは下へ通り、つまみの把握は上のレイヤーが担う'));
        return fill('今 {a}ms · 上のつまみ {b} / 下のつまみ {c}', f0(t), f1(loX), f1(hiX));
    }
    return run({ count: 1, build: build, frame: frame });
}
})();
