<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Native &lt;dialog&gt; — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <button class="trigger" type="button">Mở lại</button>
  <div class="overlay is-demo"></div>
  <dialog class="modal is-demo" open aria-labelledby="t5">
    <h2 id="t5">Lưu thay đổi?</h2>
    <p>Thẻ dialog tự động khóa focus khi mở và đóng.</p>
    <button class="modal__close" type="button">Đóng</button>
  </dialog>
</main>
<script>
// 데모는 open 속성이 그대로 켜진 <dialog> 를 keyframes 로 접었다 편다.
// 실제 클릭은 진짜 close()/showModal() 을 불러 top layer·::backdrop·포커스 트랩까지 켠다.
(function () {
  var stage = document.querySelector('.stage');
  var overlay = document.querySelector('.overlay');
  var dialog = document.querySelector('.modal');
  var trigger = document.querySelector('.trigger');
  var close = document.querySelector('.modal__close');
  function stopDemo() { stage.classList.add('is-real'); overlay.classList.remove('is-demo'); dialog.classList.remove('is-demo'); }
  close.addEventListener('click', function () { stopDemo(); dialog.close(); });
  trigger.addEventListener('click', function () { stopDemo(); dialog.showModal(); });
  dialog.addEventListener('cancel', function () { stopDemo(); });
})();
</script>
</body>
</html>
