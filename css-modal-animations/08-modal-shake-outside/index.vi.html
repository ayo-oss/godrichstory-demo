<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shake on outside click — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <div class="overlay"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="t8">
    <h2 id="t8">Bạn cần đồng ý điều khoản để tiếp tục</h2>
    <p>Nhấn ra ngoài sẽ không đóng, mà chỉ rung nhẹ.</p>
    <button class="modal__accept" type="button">Đồng ý và tiếp tục</button>
  </div>
</main>
<script>
// 실제 클릭: 바깥(overlay)을 누르면 닫히는 대신 흔들린다.
(function () {
  var stage = document.querySelector('.stage');
  var overlay = document.querySelector('.overlay');
  var modal = document.querySelector('.modal');
  overlay.addEventListener('click', function () {
    stage.classList.remove('is-demo');
    modal.classList.remove('is-shaking');
    void modal.offsetWidth;
    modal.classList.add('is-shaking');
  });
  modal.addEventListener('animationend', function (e) {
    if (e.animationName === 'shake') modal.classList.remove('is-shaking');
  });
})();
</script>
</body>
</html>
