<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popover confirm — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="anchor is-demo">
    <button class="trigger" type="button" aria-label="削除">削除</button>
    <div class="confirm" role="dialog" aria-label="削除の確認">
      <p>本当に削除しますか？</p>
      <div class="confirm__row">
        <button class="confirm__yes" type="button">削除</button>
        <button class="confirm__no" type="button">キャンセル</button>
      </div>
    </div>
  </div>
</main>
<script>
// 데모는 anchor 에 .is-demo 를 걸어 keyframes 로 반복. 실제 클릭은 진짜 Popover API 로 전환한다.
(function () {
  var anchor = document.querySelector('.anchor');
  var trigger = document.querySelector('.trigger');
  var confirm = document.querySelector('.confirm');
  var yes = document.querySelector('.confirm__yes');
  var no = document.querySelector('.confirm__no');
  function stopDemo() { anchor.classList.remove('is-demo'); }
  function show() {
    stopDemo();
    if (!confirm.hasAttribute('popover')) confirm.setAttribute('popover', 'manual');
    confirm.showPopover();
  }
  function hide() { if (confirm.hasAttribute('popover')) confirm.hidePopover(); }
  trigger.addEventListener('click', show);
  no.addEventListener('click', hide);
  yes.addEventListener('click', hide);
})();
</script>
</body>
</html>
