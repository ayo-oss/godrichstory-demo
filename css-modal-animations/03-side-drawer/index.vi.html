<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side drawer — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <button class="trigger" type="button">Giỏ hàng</button>
  <div class="overlay"></div>
  <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="t3">
    <h2 id="t3">Giỏ hàng (2)</h2>
    <p>Tổng cộng 48.000₫. Phí giao hàng ở màn hình sau.</p>
    <button class="drawer__close" type="button">Đóng</button>
  </div>
</main>
<script>
(function () {
  var stage = document.querySelector('.stage');
  var trigger = document.querySelector('.trigger');
  var overlay = document.querySelector('.overlay');
  var close = document.querySelector('.drawer__close');
  function open() { stage.classList.remove('is-demo'); stage.classList.add('is-open'); }
  function shut() { stage.classList.remove('is-open'); }
  trigger.addEventListener('click', open);
  overlay.addEventListener('click', shut);
  close.addEventListener('click', shut);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') shut(); });
})();
</script>
</body>
</html>
