<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottom sheet — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <button class="trigger" type="button">옵션 보기</button>
  <div class="overlay"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="t2">
    <div class="sheet__handle"></div>
    <h2 id="t2">배송 옵션</h2>
    <p>당일·익일·일반 배송 중 하나를 고르세요.</p>
    <button class="sheet__close" type="button">닫기</button>
  </div>
</main>
<script>
(function () {
  var stage = document.querySelector('.stage');
  var trigger = document.querySelector('.trigger');
  var overlay = document.querySelector('.overlay');
  var close = document.querySelector('.sheet__close');
  function open() { stage.classList.remove('is-demo'); stage.classList.add('is-open'); }
  function shut() { stage.classList.remove('is-open'); }
  trigger.addEventListener('click', open);
  overlay.addEventListener('click', shut);
  close.addEventListener('click', shut);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') shut(); });
})();
</script>
</body>
</html>
