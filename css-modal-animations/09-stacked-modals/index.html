<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked modals — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <div class="overlay"></div>
  <div class="modal modal--1" role="dialog" aria-modal="true" aria-labelledby="t9a">
    <h2 id="t9a">배송지 입력</h2>
    <p>주소를 입력한 뒤 우편번호를 검색하세요.</p>
    <button class="modal__next" type="button">우편번호 검색</button>
  </div>
  <div class="modal modal--2" role="dialog" aria-modal="true" aria-labelledby="t9b">
    <h2 id="t9b">우편번호 검색</h2>
    <p>도로명으로 검색하면 더 빠릅니다.</p>
    <button class="modal__back" type="button">이 주소로 선택</button>
  </div>
</main>
<script>
(function () {
  var stage = document.querySelector('.stage');
  var next = document.querySelector('.modal__next');
  var back = document.querySelector('.modal__back');
  next.addEventListener('click', function () { stage.classList.remove('is-demo'); stage.classList.add('is-stacked'); });
  back.addEventListener('click', function () { stage.classList.remove('is-stacked'); });
})();
</script>
</body>
</html>
