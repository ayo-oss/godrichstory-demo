<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked modals — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <div class="overlay"></div>
  <div class="modal modal--1" role="dialog" aria-modal="true" aria-labelledby="t9a">
    <h2 id="t9a">Nhập địa chỉ giao hàng</h2>
    <p>Nhập địa chỉ rồi tìm mã bưu điện.</p>
    <button class="modal__next" type="button">Tìm mã bưu điện</button>
  </div>
  <div class="modal modal--2" role="dialog" aria-modal="true" aria-labelledby="t9b">
    <h2 id="t9b">Tìm mã bưu điện</h2>
    <p>Tìm theo tên đường sẽ nhanh hơn.</p>
    <button class="modal__back" type="button">Chọn địa chỉ này</button>
  </div>
</main>
<script>
(function () {
  var stage = document.querySelector('.stage');
  var next = document.querySelector('.modal__next');
  var back = document.querySelector('.modal__back');
  next.addEventListener('click', function () { stage.classList.remove('is-demo'); stage.classList.add('is-stacked'); });
  back.addEventListener('click', function () { stage.classList.remove('is-stacked'); });
})();
</script>
</body>
</html>
