<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fade &amp; scale modal — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <button class="trigger" type="button">Pay now</button>
  <div class="overlay"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="t1">
    <h2 id="t1">Complete this payment?</h2>
    <p>Once your card is approved, this can't be undone.</p>
    <button class="modal__close" type="button">Confirm</button>
  </div>
</main>
<script>
// 실제 클릭: 트리거로 열고 오버레이·Confirm·ESC 로 닫는다. 데모(.is-demo)는 자동 반복하다가 실제 조작이 오면 멈춘다.
(function () {
  var stage = document.querySelector('.stage');
  var trigger = document.querySelector('.trigger');
  var overlay = document.querySelector('.overlay');
  var close = document.querySelector('.modal__close');
  function open() { stage.classList.remove('is-demo'); stage.classList.add('is-open'); }
  function shut() { stage.classList.remove('is-open'); }
  trigger.addEventListener('click', open);
  overlay.addEventListener('click', shut);
  close.addEventListener('click', shut);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') shut(); });
})();
</script>
</body>
</html>
