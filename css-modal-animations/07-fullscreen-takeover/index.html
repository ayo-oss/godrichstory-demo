<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fullscreen takeover — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <button class="thumb" type="button" aria-label="사진 크게 보기">
    <span class="thumb__caption">골든리트리버 · 2026</span>
    <span class="thumb__close" aria-hidden="true">×</span>
  </button>
</main>
<script>
(function () {
  var stage = document.querySelector('.stage');
  var thumb = document.querySelector('.thumb');
  var isOpen = false;
  thumb.addEventListener('click', function () {
    stage.classList.remove('is-demo');
    isOpen = !isOpen;
    stage.classList.toggle('is-open', isOpen);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && isOpen) { isOpen = false; stage.classList.remove('is-open'); }
  });
})();
</script>
</body>
</html>
