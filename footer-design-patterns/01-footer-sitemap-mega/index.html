<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sitemap mega footer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <footer class="fsm is-demo" role="contentinfo">
    <p class="fsm__brand">스튜디오</p>

    <div class="fsm__cols">
      <section class="fsm__col">
        <h2 class="fsm__head">
          <button class="fsm__btn" type="button" aria-expanded="true" aria-controls="fsm-p1">
            <span class="fsm__btn-t">제품</span>
            <svg class="fsm__caret" viewBox="0 0 256 256" width="14" height="14" aria-hidden="true" focusable="false"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg>
          </button>
        </h2>
        <div class="fsm__panel" id="fsm-p1">
          <nav class="fsm__list" aria-label="제품 링크">
            <a href="#">기능 소개</a>
            <a href="#">요금 안내</a>
            <a href="#">사용 사례</a>
          </nav>
        </div>
      </section>

      <section class="fsm__col">
        <h2 class="fsm__head">
          <button class="fsm__btn" type="button" aria-expanded="true" aria-controls="fsm-p2">
            <span class="fsm__btn-t">회사</span>
            <svg class="fsm__caret" viewBox="0 0 256 256" width="14" height="14" aria-hidden="true" focusable="false"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg>
          </button>
        </h2>
        <div class="fsm__panel" id="fsm-p2">
          <nav class="fsm__list" aria-label="회사 링크">
            <a href="#">회사 소개</a>
            <a href="#">채용 정보</a>
            <a href="#">보도 자료</a>
          </nav>
        </div>
      </section>

      <section class="fsm__col">
        <h2 class="fsm__head">
          <button class="fsm__btn" type="button" aria-expanded="true" aria-controls="fsm-p3">
            <span class="fsm__btn-t">지원</span>
            <svg class="fsm__caret" viewBox="0 0 256 256" width="14" height="14" aria-hidden="true" focusable="false"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg>
          </button>
        </h2>
        <div class="fsm__panel" id="fsm-p3">
          <nav class="fsm__list" aria-label="지원 링크">
            <a href="#">도움말</a>
            <a href="#">문의 창구</a>
            <a href="#">상태 알림</a>
          </nav>
        </div>
      </section>
    </div>

    <p class="fsm__legal">© 2026 스튜디오</p>
  </footer>
</main>

<script>
(function () {
  var root = document.querySelector('.fsm');
  var btns = [].slice.call(root.querySelectorAll('.fsm__btn'));

  // 사람이 손을 대면 자동 루프를 끄고 aria-expanded 가 상태의 유일한 출처가 된다
  function stopLoop() { root.classList.remove('is-demo'); }

  btns.forEach(function (b, i) {
    b.addEventListener('click', function () {
      stopLoop();
      b.setAttribute('aria-expanded', b.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');
    });
    // 위아래 화살표로 열 머리 사이를 옮긴다. Enter·Space 는 button 이 기본으로 처리한다
    b.addEventListener('keydown', function (e) {
      var step = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
      if (!step) { return; }
      e.preventDefault();
      stopLoop();
      btns[(i + step + btns.length) % btns.length].focus({ preventScroll: true });
    });
  });

  root.addEventListener('pointerenter', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
