<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal link-tree footer</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="is-demo">
<div class="stage">
  <footer class="lt">
    <nav class="lt__tree" aria-label="主要リンク">
      <a class="lt__link lt__link--lead" href="#" aria-current="page">作品まとめ</a>
      <a class="lt__link lt__link--lead" href="#">記事一覧</a>
      <a class="lt__link lt__link--sub" href="#">紹介</a>
      <a class="lt__link lt__link--sub" href="#">お問い合わせ</a>
    </nav>
    <nav class="lt__legal" aria-label="法的なお知らせ">
      <a class="lt__fine" href="#">利用規約</a>
      <a class="lt__fine" href="#">プライバシーポリシー</a>
      <a class="lt__fine" href="#">Cookieの設定</a>
    </nav>
  </footer>
</div>
<script>
(function () {
  var body  = document.body;
  var root  = document.querySelector('.lt');
  var links = Array.prototype.slice.call(root.querySelectorAll('a'));

  function hand() { body.classList.remove('is-demo'); }   // 손이 닿으면 자동 재생을 끈다

  // 계단은 세로 한 줄이라 ↑↓ 가 다음·이전 링크, Home·End 가 처음·끝
  root.addEventListener('keydown', function (e) {
    var i = links.indexOf(document.activeElement);
    var to = -1;
    if (e.key === 'ArrowDown') to = (i + 1 + links.length) % links.length;
    else if (e.key === 'ArrowUp') to = (i - 1 + links.length) % links.length;
    else if (e.key === 'Home') to = 0;
    else if (e.key === 'End') to = links.length - 1;
    if (to < 0) return;
    e.preventDefault();
    hand();
    links[to].focus({ preventScroll: true });
  });
  root.addEventListener('pointerdown', hand);
  root.addEventListener('pointerover', hand);
  root.addEventListener('focusin', hand);
})();
</script>
</body>
</html>
