</main>

<script>
(function () {
  var root = document.querySelector('.fo');
  var dots = [].slice.call(root.querySelectorAll('.fo__dot'));

  function stopLoop() { root.classList.remove('is-demo'); }

  // 소셜 점 셋은 좌우 화살표로 옮겨 다닌다 (Home·End 는 양 끝)
  dots.forEach(function (dot, i) {
    dot.addEventListener('keydown', function (e) {
      var to = -1;
      if (e.key === 'ArrowRight') { to = (i + 1) % dots.length; }
      if (e.key === 'ArrowLeft') { to = (i - 1 + dots.length) % dots.length; }
      if (e.key === 'Home') { to = 0; }
      if (e.key === 'End') { to = dots.length - 1; }
      if (to < 0) { return; }
      e.preventDefault();
      stopLoop();
      dots[to].focus({ preventScroll: true });
    });
  });

  root.addEventListener('pointerenter', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
