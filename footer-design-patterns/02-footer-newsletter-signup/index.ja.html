<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsletter footer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <footer class="fn is-demo is-idle" role="contentinfo">
    <p class="fn__title">週刊ニュースを受け取る</p>
    <p class="fn__desc">新しい記事とコードの断片を、週に一度だけお送りします。</p>

    <form class="fn__form" novalidate>
      <label class="fn__label" for="fn-mail">メールアドレス</label>
      <div class="fn__row">
        <input class="fn__input" id="fn-mail" type="email" name="email" autocomplete="email" placeholder="name@mail.com">
        <button class="fn__send" type="submit">
          <span class="fn__send-t">購読</span>
          <span class="fn__icons" aria-hidden="true">
            <span class="fn__ic fn__ic--plane"><svg viewBox="0 0 256 256" width="16" height="16" focusable="false"><g fill="currentColor"><path d="m223.69 42.18l-58.22 192a8 8 0 0 1-14.92 1.25L108 148l-87.42-42.55a8 8 0 0 1 1.25-14.92l192-58.22a8 8 0 0 1 9.86 9.87" opacity=".2"/><path d="M227.32 28.68a16 16 0 0 0-15.66-4.08h-.15L19.57 82.84a16 16 0 0 0-2.49 29.8L102 154l41.3 84.87a15.86 15.86 0 0 0 14.44 9.13q.69 0 1.38-.06a15.88 15.88 0 0 0 14-11.51l58.2-191.94v-.15a16 16 0 0 0-4-15.66m-69.49 203.17l-.05.14v-.07l-40.06-82.3l48-48a8 8 0 0 0-11.31-11.31l-48 48l-82.33-40.06h-.07h.14L216 40Z"/></g></svg></span>
            <span class="fn__ic fn__ic--load"><span class="fn__spin"></span></span>
            <span class="fn__ic fn__ic--done"><svg viewBox="0 0 256 256" width="18" height="18" focusable="false"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0M232 128A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></svg></span>
          </span>
        </button>
      </div>
      <span class="fn__bar" aria-hidden="true"></span>
    </form>

    <p class="fn__msg" role="status" aria-live="polite">
      <span class="fn__m fn__m--idle">いつでもワンクリックで購読を解除できます。</span>
      <span class="fn__m fn__m--send">送信しています。</span>
      <span class="fn__m fn__m--done">確認メールをお送りしました。</span>
      <span class="fn__m fn__m--err"></span>
    </p>

    <p class="fn__legal">© 2026 スタジオ</p>
  </footer>
</main>

<script>
(function () {
  var root = document.querySelector('.fn');
  var form = root.querySelector('.fn__form');
  var input = root.querySelector('.fn__input');
  var err = root.querySelector('.fn__m--err');
  var timer = 0;

  // 상태는 뿌리의 클래스 하나로만 관리한다 — 정적 규칙이 먼저, 자동 루프는 그 위에 덧씌운다
  function setState(s) {
    root.classList.remove('is-idle', 'is-sending', 'is-done', 'is-error');
    root.classList.add(s);
  }
  function stopLoop() { root.classList.remove('is-demo'); }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    stopLoop();
    clearTimeout(timer);
    var v = input.value.trim();
    // 오류도 같은 aria-live 영역으로 알린다 — 화면을 못 보는 사람에게 결과가 한 곳에서만 들린다
    if (!v) { err.textContent = 'メールアドレスを入力してください。'; setState('is-error'); return; }
    if (v.indexOf('@') < 0) { err.textContent = 'アドレスに @ がありません。'; setState('is-error'); return; }
    setState('is-sending');
    timer = setTimeout(function () { setState('is-done'); }, 900);
  });

  input.addEventListener('input', function () {
    stopLoop();
    if (root.classList.contains('is-error')) { setState('is-idle'); }
  });

  root.addEventListener('pointerenter', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
