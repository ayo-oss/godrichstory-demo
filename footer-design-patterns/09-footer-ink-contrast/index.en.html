<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark ink footer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <!-- footer 가 body 계통에 있으므로 암묵적 role 은 contentinfo 다 -->
  <footer class="ic">
    <!-- 밝은 본문 카드가 잉크 바닥 위로 내려앉으며 페이지가 닫힌다 -->
    <div class="ic__sheet">
      <p class="ic__eyebrow">End of page</p>
      <h2 class="ic__head" tabindex="-1">Thank you for reading</h2>
    </div>

    <div class="ic__floor">
      <nav class="ic__nav" aria-label="Footer links">
        <a class="ic__link" href="#"><span class="ic__lt">About</span><span class="ic__rule" aria-hidden="true"></span></a>
        <a class="ic__link" href="#"><span class="ic__lt">Posts</span><span class="ic__rule" aria-hidden="true"></span></a>
        <a class="ic__link" href="#"><span class="ic__lt">Contact</span><span class="ic__rule" aria-hidden="true"></span></a>
        <a class="ic__link" href="#"><span class="ic__lt">Privacy</span><span class="ic__rule" aria-hidden="true"></span></a>
      </nav>
      <div class="ic__bottom">
        <p class="ic__copy">© 2026 Example Site</p>
        <button class="ic__top" type="button">
          <span class="ic__ic" aria-hidden="true">
            <svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M200 112H56l72-72Z" opacity=".2"/><path d="m205.66 106.34l-72-72a8 8 0 0 0-11.32 0l-72 72A8 8 0 0 0 56 120h64v96a8 8 0 0 0 16 0v-96h64a8 8 0 0 0 5.66-13.66M75.31 104L128 51.31L180.69 104Z"/></g></svg>
          </span>
          Back to top
        </button>
      </div>
    </div>
  </footer>
</div>

<script>
(function () {
  var ic = document.querySelector('.ic');
  var headEl = document.querySelector('.ic__head');
  var topBtn = document.querySelector('.ic__top');
  // 격자 미리보기용 자동 재생. 사람이 손을 대면 떼고 진짜 조작으로 넘긴다
  ic.classList.add('is-demo');
  function stopDemo() { ic.classList.remove('is-demo'); }
  ['pointerdown', 'keydown'].forEach(function (t) {
    document.addEventListener(t, stopDemo, { once: true });
  });
  // 버튼을 누르면 스크롤을 되돌리고 초점도 문서 처음으로 옮긴다(키보드 사용자는 초점이 따라가야 한다).
  // focus() 에는 반드시 preventScroll: 이 데모는 목록에 iframe 으로 박혀 있어 부모 페이지가 끌려간다
  topBtn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    headEl.focus({ preventScroll: true });
  });
})();
</script>
</body>
</html>
