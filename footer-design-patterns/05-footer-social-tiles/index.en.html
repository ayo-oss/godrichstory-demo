<script>
(function () {
  var body  = document.body;
  var grid  = document.querySelector('.sc__grid');
  var tiles = Array.prototype.slice.call(grid.querySelectorAll('.sc__tile'));

  function hand() { body.classList.remove('is-demo'); }   // 손이 닿으면 자동 재생을 끈다

  // 2×2 격자라 좌우는 ±1, 상하는 ±2 칸 — 화살표 네 방향이 전부 산다
  grid.addEventListener('keydown', function (e) {
    var step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 2, ArrowUp: -2 }[e.key];
    if (!step) return;
    e.preventDefault();
    hand();
    var i = tiles.indexOf(document.activeElement);
    var next = (i < 0 ? 0 : i + step + tiles.length) % tiles.length;
    tiles[next].focus({ preventScroll: true });
  });
  grid.addEventListener('pointerdown', hand);
  grid.addEventListener('pointerover', hand);
  grid.addEventListener('focusin', hand);
})();
</script>
