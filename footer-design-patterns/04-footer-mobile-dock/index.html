<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky bottom app bar</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="is-demo">
<div class="stage">
  <div class="dk">
    <div class="dk__view">
      <div class="dk__doc">

        <div class="dk__body">
          <p class="dk__title">오늘의 기록</p>
          <span class="dk__row dk__row--full" aria-hidden="true"></span>
          <span class="dk__row dk__row--wide" aria-hidden="true"></span>
          <span class="dk__row dk__row--mid" aria-hidden="true"></span>
          <span class="dk__row dk__row--accent" aria-hidden="true"></span>
          <span class="dk__row dk__row--full" aria-hidden="true"></span>
          <span class="dk__row dk__row--wide" aria-hidden="true"></span>
          <span class="dk__row dk__row--short" aria-hidden="true"></span>
          <span class="dk__row dk__row--mid" aria-hidden="true"></span>
          <span class="dk__row dk__row--wide" aria-hidden="true"></span>
        </div>

        <!-- 하단 앱바 — 스크롤되는 본문 안에서 sticky 로 바닥에 붙는다.
             sticky 의 유효 범위는 부모(.dk__doc)의 콘텐츠 박스다 -->
        <footer class="dk__bar">
          <nav class="dk__nav" aria-label="주요 화면 이동">
            <a class="dk__tab is-on" href="#" aria-current="page">
              <span class="dk__ic">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 120v96h-64v-64h-48v64H40v-96a8 8 0 0 1 2.34-5.66l80-80a8 8 0 0 1 11.32 0l80 80A8 8 0 0 1 216 120" opacity=".2"/><path d="m219.31 108.68l-80-80a16 16 0 0 0-22.62 0l-80 80A15.87 15.87 0 0 0 32 120v96a8 8 0 0 0 8 8h64a8 8 0 0 0 8-8v-56h32v56a8 8 0 0 0 8 8h64a8 8 0 0 0 8-8v-96a15.87 15.87 0 0 0-4.69-11.32M208 208h-48v-56a8 8 0 0 0-8-8h-48a8 8 0 0 0-8 8v56H48v-88l80-80l80 80Z"/></g></svg>
              </span>
              <span class="dk__label">홈</span>
            </a>
            <a class="dk__tab" href="#">
              <span class="dk__ic">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M192 112a80 80 0 1 1-80-80a80 80 0 0 1 80 80" opacity=".2"/><path d="m229.66 218.34l-50.06-50.06a88.21 88.21 0 1 0-11.32 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></g></svg>
              </span>
              <span class="dk__label">찾기</span>
            </a>
            <a class="dk__tab" href="#">
              <span class="dk__ic">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M192 176v48l-64-40l-64 40v-48l64-40Z" opacity=".2"/><path d="M184 32H72a16 16 0 0 0-16 16v176a8 8 0 0 0 12.24 6.78L128 193.43l59.77 37.35A8 8 0 0 0 200 224V48a16 16 0 0 0-16-16m0 16v113.57l-51.77-32.35a8 8 0 0 0-8.48 0L72 161.56V48Zm-51.77 129.22a8 8 0 0 0-8.48 0L72 209.57v-29.14l56-35l56 35v29.14Z"/></g></svg>
              </span>
              <span class="dk__label">저장</span>
            </a>
            <a class="dk__tab" href="#">
              <span class="dk__ic">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 64v128H40V64Z" opacity=".2"/><path d="M224 128a8 8 0 0 1-8 8H40a8 8 0 0 1 0-16h176a8 8 0 0 1 8 8M40 72h176a8 8 0 0 0 0-16H40a8 8 0 0 0 0 16m176 112H40a8 8 0 0 0 0 16h176a8 8 0 0 0 0-16"/></g></svg>
              </span>
              <span class="dk__label">더보기</span>
            </a>
            <!-- 활성 칸 알약. 폭이 칸 하나(25%)라 translateX(100%) 한 번이 정확히 한 칸이다 -->
            <span class="dk__pill" aria-hidden="true"></span>
          </nav>
        </footer>

      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var body = document.body;
  var nav  = document.querySelector('.dk__nav');
  var tabs = Array.prototype.slice.call(nav.querySelectorAll('.dk__tab'));
  var n = 0;

  // 알약 위치는 칸 번호 하나로만 정한다 — 짐작한 px 이 없으니 칸 폭이 바뀌어도 안 어긋난다
  function move(i, focus) {
    n = (i + tabs.length) % tabs.length;
    tabs.forEach(function (t, k) {
      var on = k === n;
      t.classList.toggle('is-on', on);
      if (on) t.setAttribute('aria-current', 'page');
      else t.removeAttribute('aria-current');
      t.tabIndex = on ? 0 : -1;                 // 로빙 탭인덱스 — Tab 은 활성 칸으로만 들어온다
    });
    nav.style.setProperty('--n', n);
    if (focus) tabs[n].focus({ preventScroll: true });
  }

  function hand() { body.classList.remove('is-demo'); }   // 사람이 손을 대면 자동 재생을 끈다

  nav.addEventListener('keydown', function (e) {
    var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    hand();
    move(n + d, true);
  });
  tabs.forEach(function (t, k) {
    t.addEventListener('click', function (e) { e.preventDefault(); hand(); move(k, true); });
  });
  nav.addEventListener('pointerdown', hand);
  nav.addEventListener('focusin', hand);

  move(0, false);
})();
</script>
</body>
</html>
