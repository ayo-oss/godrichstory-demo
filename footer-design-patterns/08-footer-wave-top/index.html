<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavy edge footer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <!-- footer 가 body 계통에 있으므로 암묵적 role 은 contentinfo 다 -->
  <footer class="wv">
    <div class="wv__body">
      <p class="wv__lead">본문은 여기서 끝납니다</p>
    </div>

    <!-- 경계 — 물결 두 겹. 모양은 SVG path 를 data URI 로 깐 배경이고, 타일 폭은 120px 이다 -->
    <div class="wv__edge" aria-hidden="true">
      <span class="wv__wave wv__wave--back"></span>
      <span class="wv__wave wv__wave--front"></span>
    </div>

    <div class="wv__foot">
      <div class="wv__row">
        <nav class="wv__nav" aria-label="푸터 링크">
          <a class="wv__link" href="#">소개</a>
          <a class="wv__link" href="#">글 목록</a>
          <a class="wv__link" href="#">문의</a>
        </nav>
        <!-- 움직임을 끄는 스위치. 라벨 두 개를 다 심어 두고 aria-pressed 로 갈라 보인다 -->
        <button class="wv__toggle" type="button" aria-pressed="false">
          <span class="wv__t wv__t--stop">물결 멈춤</span>
          <span class="wv__t wv__t--play">물결 재생</span>
        </button>
      </div>
      <p class="wv__copy">© 2026 예시 사이트</p>
    </div>
  </footer>
</div>

<script>
(function () {
  var wv = document.querySelector('.wv');
  var btn = document.querySelector('.wv__toggle');
  // button 이라 클릭·터치·Enter·Space 가 모두 click 으로 온다
  btn.addEventListener('click', function () {
    var isPaused = btn.getAttribute('aria-pressed') === 'true';
    btn.setAttribute('aria-pressed', isPaused ? 'false' : 'true');
    wv.classList.toggle('is-paused', !isPaused);
  });
})();
</script>
</body>
</html>
