<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scramble decode — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <p class="sd-text" id="sd" aria-live="polite">DECODE</p>
</main>
<script>
  var target = "DECODE";
  var glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  var el = document.getElementById("sd");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function tick(locked) {
    if (reduced) { el.textContent = target; return; }
    var out = "";
    for (var i = 0; i < target.length; i++) {
      out += i < locked ? target[i] : glyphs[Math.floor(Math.random() * glyphs.length)];
    }
    el.textContent = out;
  }
  var frame = 0;
  setInterval(function () {
    frame++;
    var locked = Math.max(0, Math.floor((frame % 26) / 3) - 2);
    tick(Math.min(locked, target.length));
  }, 60);
</script>
</body>
</html>
