<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>しっぽを振る子犬の待機 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dg is-demo" id="dg" data-speed="0">
  <button class="dg__hit" type="button" aria-label="子犬をなでる">
    <span class="dg__scene" aria-hidden="true">
      <span class="dg__shadow"></span>
      <span class="dg__tail" id="dgTail"></span>
      <span class="dg__body"></span>
      <span class="dg__leg dg__leg--1"></span>
      <span class="dg__leg dg__leg--2"></span>
      <span class="dg__leg dg__leg--3"></span>
      <span class="dg__leg dg__leg--4"></span>
      <span class="dg__head">
        <span class="dg__ear"></span>
        <span class="dg__eyeOpen dg__eyeOpen--1"></span>
        <span class="dg__eyeOpen dg__eyeOpen--2"></span>
        <span class="dg__happy dg__happy--1"></span>
        <span class="dg__happy dg__happy--2"></span>
        <span class="dg__snout"><span class="dg__nose"></span></span>
      </span>
      <span class="dg__heart" id="dgHeart"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M232 102c0 66-104 122-104 122S24 168 24 102a54 54 0 0 1 54-54c22.59 0 41.94 12.31 50 32c8.06-19.69 27.41-32 50-32a54 54 0 0 1 54 54" opacity=".2"/><path d="M178 40c-20.65 0-38.73 8.88-50 23.89C116.73 48.88 98.65 40 78 40a62.07 62.07 0 0 0-62 62c0 70 103.79 126.66 108.21 129a8 8 0 0 0 7.58 0C136.21 228.66 240 172 240 102a62.07 62.07 0 0 0-62-62m-50 174.8c-18.26-10.64-96-59.11-96-112.8a46.06 46.06 0 0 1 46-46c19.45 0 35.78 10.36 42.6 27a8 8 0 0 0 14.8 0c6.82-16.67 23.15-27 42.6-27a46.06 46.06 0 0 1 46 46c0 53.61-77.76 102.15-96 112.8"/></g></svg></span>
    </span>
  </button>
</div>
</main>
<script>
var dg = document.getElementById('dg');
var heart = document.getElementById('dgHeart');
var pets = 0;

// 세 번씩 쓰다듬을 때마다 꼬리가 빨라지고(data-speed), 다섯 번째에는 눈이 반달이 되며 하트가 한 번 뜬다
document.querySelector('.dg__hit').addEventListener('click', function () {
  dg.classList.remove('is-demo');
  pets = pets + 1;
  dg.dataset.speed = String(Math.min(1 + Math.floor(pets / 3), 3));
  dg.classList.toggle('dg--love', pets === 5);
  if (pets === 5) {
    heart.classList.remove('dg__heart--fly');
    void heart.offsetWidth;
    heart.classList.add('dg__heart--fly');
  }
});
dg.addEventListener('pointerdown', function () { dg.classList.remove('is-demo'); });
</script>
</body>
</html>
