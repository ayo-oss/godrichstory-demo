<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>낙서 선 캐릭터 걷기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dw is-demo" id="dw" data-dir="fwd">
  <button class="dw__hit" type="button" aria-label="걷는 방향 바꾸기">
    <svg class="dw__scene" viewBox="0 0 480 300" aria-hidden="true">
      <line class="dw__ground" x1="60" y1="228" x2="420" y2="228" pathLength="100"/>
      <g class="dw__walker" id="dwWalker">
        <g class="dw__flipper">
          <path class="dw__draw dw__body" d="M150 96 C150 66 176 52 200 52 C224 52 250 66 250 96 C250 128 226 150 200 150 C174 150 150 128 150 96 Z" pathLength="100"/>
          <path class="dw__draw dw__leg dw__leg--l" d="M184 148 L180 224" pathLength="100"/>
          <path class="dw__draw dw__leg dw__leg--r" d="M216 148 L220 224" pathLength="100"/>
          <path class="dw__draw dw__arm dw__arm--l" d="M156 104 L128 122" pathLength="100"/>
          <path class="dw__draw dw__arm dw__arm--r" d="M244 104 L272 96" pathLength="100"/>
          <path class="dw__draw dw__eye" d="M186 92 L190 92" pathLength="100"/>
          <path class="dw__draw dw__eye" d="M210 92 L214 92" pathLength="100"/>
          <path class="dw__draw dw__mouth" d="M192 110 Q200 118 208 110" pathLength="100"/>
          <path class="dw__draw dw__crest" d="M184 54 Q200 40 216 54" pathLength="100"/>
        </g>
      </g>
    </svg>
  </button>
</div>
</main>
<script>
var dw = document.getElementById('dw');

// 누르면 걷는 방향이 뒤집힌다 — data-dir 하나만 바꾸고 거울은 CSS 가 씌운다
document.querySelector('.dw__hit').addEventListener('click', function () {
  dw.classList.remove('is-demo');
  dw.dataset.dir = dw.dataset.dir === 'fwd' ? 'back' : 'fwd';
});
dw.addEventListener('pointerdown', function () { dw.classList.remove('is-demo'); });
</script>
</body>
</html>
