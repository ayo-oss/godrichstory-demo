<script>
var sp = document.getElementById('sp');
var scene = document.querySelector('.sp__scene');
var count = document.getElementById('spCount');
var HEART_SVG = scene.querySelector('.sp__auto--1').innerHTML;
var sent = 0;

// 무대를 누른 자리에서 하트가 피어오른다 — span 을 만들어 그 자리에 두고 애니메이션이 끝나면 치운다
document.querySelector('.sp__hit').addEventListener('click', function (e) {
  sp.classList.remove('is-demo');
  var rect = scene.getBoundingClientRect();
  var heart = document.createElement('span');
  heart.className = 'sp__fly';
  heart.setAttribute('aria-hidden', 'true');
  heart.innerHTML = HEART_SVG;
  heart.style.left = ((e.clientX || rect.left + rect.width / 2) - rect.left) + 'px';
  heart.style.top = ((e.clientY || rect.top + rect.height / 2) - rect.top) + 'px';
  scene.appendChild(heart);
  heart.addEventListener('animationend', function () { heart.remove(); });
  sent = sent + 1;
  count.textContent = String(sent);
});
sp.addEventListener('pointerdown', function () { sp.classList.remove('is-demo'); });
</script>

</html>
