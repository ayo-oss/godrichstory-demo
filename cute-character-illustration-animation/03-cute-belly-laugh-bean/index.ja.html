<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お腹を揺らす笑い — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bn is-demo" id="bn" data-level="0">
  <button class="bn__hit" type="button" aria-label="豆の友だちを笑わせる">
    <span class="bn__scene" aria-hidden="true">
      <span class="bn__shadow"></span>
      <span class="bn__bean" id="bnBean">
        <span class="bn__eye bn__eye--l"></span>
        <span class="bn__eye bn__eye--r"></span>
        <span class="bn__mouth"><span class="bn__tongue"></span></span>
        <span class="bn__arm bn__arm--l"></span>
        <span class="bn__arm bn__arm--r"></span>
      </span>
    </span>
  </button>
  <p class="bn__level" id="bnLevel" aria-hidden="true">笑いレベル0</p>
</div>
</main>
<script>
var bn = document.getElementById('bn');
var level = 0;
var labels = ['笑いレベル0', '笑いレベル1', '笑いレベル2', '笑いレベル3 — 大爆笑'];

// 누를 때마다 웃음 단계가 0→1→2→3 까지 커지고, もう一度 누르면 처음으로 돌아간다
document.querySelector('.bn__hit').addEventListener('click', function () {
  bn.classList.remove('is-demo');
  level = (level + 1) % 4;
  bn.dataset.level = String(level);
  document.getElementById('bnLevel').textContent = labels[level];
});
bn.addEventListener('pointerdown', function () { bn.classList.remove('is-demo'); });
</script>
</body>
</html>
