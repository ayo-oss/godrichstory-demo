<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cookie bite counter — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ck is-demo" id="ck" data-bite="0">
  <button class="ck__hit" type="button" aria-label="Take a cookie bite">
    <span class="ck__scene" aria-hidden="true">
      <span class="ck__cookieWrap">
        <span class="ck__cookie" id="ckCookie">
          <span class="ck__chip ck__chip--1"></span>
          <span class="ck__chip ck__chip--2"></span>
          <span class="ck__chip ck__chip--3"></span>
          <span class="ck__chip ck__chip--4"></span>
          <span class="ck__chip ck__chip--5"></span>
          <span class="ck__crumb ck__crumb--1"></span>
          <span class="ck__crumb ck__crumb--2"></span>
          <span class="ck__crumb ck__crumb--3"></span>
        </span>
      </span>
      <span class="ck__char" id="ckChar">
        <span class="ck__eye ck__eye--l"></span>
        <span class="ck__eye ck__eye--r"></span>
        <span class="ck__sad ck__sad--l"></span>
        <span class="ck__sad ck__sad--r"></span>
        <span class="ck__cheek ck__cheek--l"></span>
        <span class="ck__cheek ck__cheek--r"></span>
        <span class="ck__mouth"></span>
        <span class="ck__arm"></span>
      </span>
    </span>
  </button>
  <button class="ck__reset" id="ckReset" type="button" hidden>Again</button>
</div>
</main>
<script>
var ck = document.getElementById('ck');
var resetBtn = document.getElementById('ckReset');
var bites = 0;

// 누를 때마다 한 입: 쿠키가 네 단계로 줄고(data-bite) 볼이 부푼다. 네 번을 다 먹으면
// 아쉬운 눈과 함께 Again 단추가 나타나고, 누르면 처음으로 돌아간다
document.querySelector('.ck__hit').addEventListener('click', function () {
  ck.classList.remove('is-demo');
  if (bites >= 4) { return; }
  bites = bites + 1;
  ck.dataset.bite = String(bites);
  if (bites === 4) { resetBtn.hidden = false; }
});
resetBtn.addEventListener('click', function () {
  bites = 0;
  ck.dataset.bite = '0';
  resetBtn.hidden = true;
});
ck.addEventListener('pointerdown', function () { ck.classList.remove('is-demo'); });
</script>
</body>
</html>
