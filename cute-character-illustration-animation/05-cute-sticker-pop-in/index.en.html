<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker pop-in — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="st is-demo" id="st">
  <output class="st__count" id="stCount" aria-hidden="true">0</output>
  <button class="st__hit" type="button" aria-label="Tap the sticker">
    <span class="st__sticker" id="stSticker" aria-hidden="true">
      <span class="st__face">
        <span class="st__ear st__ear--l"></span>
        <span class="st__ear st__ear--r"></span>
        <span class="st__eyeOpen st__eyeOpen--l"></span>
        <span class="st__eyeOpen st__eyeOpen--r"></span>
        <span class="st__eyeWink st__eyeWink--l"></span>
        <span class="st__eyeWink st__eyeWink--r"></span>
        <span class="st__snout"><span class="st__nose"></span><span class="st__mouth"></span></span>
        <span class="st__cheek st__cheek--l"></span>
        <span class="st__cheek st__cheek--r"></span>
      </span>
      <span class="st__spark st__spark--l"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="m194.82 151.43l-55.09 20.3l-20.3 55.09a7.92 7.92 0 0 1-14.86 0l-20.3-55.09l-55.09-20.3a7.92 7.92 0 0 1 0-14.86l55.09-20.3l20.3-55.09a7.92 7.92 0 0 1 14.86 0l20.3 55.09l55.09 20.3a7.92 7.92 0 0 1 0 14.86" opacity=".2"/><path d="M197.58 129.06L146 110l-19-51.62a15.92 15.92 0 0 0-29.88 0L78 110l-51.62 19a15.92 15.92 0 0 0 0 29.88L78 178l19 51.62a15.92 15.92 0 0 0 29.88 0L146 178l51.62-19a15.92 15.92 0 0 0 0-29.88ZM137 164.22a8 8 0 0 0-4.74 4.74L112 223.85L91.78 169a8 8 0 0 0-4.78-4.78L32.15 144L87 123.78a8 8 0 0 0 4.78-4.78L112 64.15L132.22 119a8 8 0 0 0 4.74 4.74L191.85 144ZM144 40a8 8 0 0 1 8-8h16V16a8 8 0 0 1 16 0v16h16a8 8 0 0 1 0 16h-16v16a8 8 0 0 1-16 0V48h-16a8 8 0 0 1-8-8m104 48a8 8 0 0 1-8 8h-8v8a8 8 0 0 1-16 0v-8h-8a8 8 0 0 1 0-16h8v-8a8 8 0 0 1 16 0v8h8a8 8 0 0 1 8 8"/></g></svg></span>
      <span class="st__spark st__spark--r"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="m194.82 151.43l-55.09 20.3l-20.3 55.09a7.92 7.92 0 0 1-14.86 0l-20.3-55.09l-55.09-20.3a7.92 7.92 0 0 1 0-14.86l55.09-20.3l20.3-55.09a7.92 7.92 0 0 1 14.86 0l20.3 55.09l55.09 20.3a7.92 7.92 0 0 1 0 14.86" opacity=".2"/><path d="M197.58 129.06L146 110l-19-51.62a15.92 15.92 0 0 0-29.88 0L78 110l-51.62 19a15.92 15.92 0 0 0 0 29.88L78 178l19 51.62a15.92 15.92 0 0 0 29.88 0L146 178l51.62-19a15.92 15.92 0 0 0 0-29.88ZM137 164.22a8 8 0 0 0-4.74 4.74L112 223.85L91.78 169a8 8 0 0 0-4.78-4.78L32.15 144L87 123.78a8 8 0 0 0 4.78-4.78L112 64.15L132.22 119a8 8 0 0 0 4.74 4.74L191.85 144ZM144 40a8 8 0 0 1 8-8h16V16a8 8 0 0 1 16 0v16h16a8 8 0 0 1 0 16h-16v16a8 8 0 0 1-16 0V48h-16a8 8 0 0 1-8-8m104 48a8 8 0 0 1-8 8h-8v8a8 8 0 0 1-16 0v-8h-8a8 8 0 0 1 0-16h8v-8a8 8 0 0 1 16 0v8h8a8 8 0 0 1 8 8"/></g></svg></span>
    </span>
  </button>
</div>
</main>
<script>
var st = document.getElementById('st');
var sticker = document.getElementById('stSticker');
var count = document.getElementById('stCount');
var hits = 0;

// 다섯 번째 누름에 윙크, 여섯 번째에 원래 표정으로 돌아간다. 상태는 클래스 하나(.st--wink)
document.querySelector('.st__hit').addEventListener('click', function () {
  st.classList.remove('is-demo');
  hits = hits + 1;
  count.textContent = String(hits);
  sticker.classList.toggle('st--wink', hits % 5 === 0 && hits > 0);
  sticker.classList.remove('st--nudge');
  void sticker.offsetWidth;
  sticker.classList.add('st--nudge');
});
st.addEventListener('pointerdown', function () { st.classList.remove('is-demo'); });
</script>
</body>
</html>
