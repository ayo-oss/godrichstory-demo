<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぷるぷるゼリーの弾み — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="jl is-demo" id="jl">
  <output class="jl__count" id="jlCount" aria-hidden="true">0</output>
  <button class="jl__hit" type="button" aria-label="ゼリーを弾ませる">
    <span class="jl__scene" aria-hidden="true">
      <span class="jl__shadow"></span>
      <span class="jl__body" id="jlBody">
        <span class="jl__eye jl__eye--l"></span>
        <span class="jl__eye jl__eye--r"></span>
        <span class="jl__mouth"></span>
        <span class="jl__shine"></span>
      </span>
    </span>
  </button>
</div>
</main>
<script>
var jl = document.getElementById('jl');
var body = document.getElementById('jlBody');
var count = document.getElementById('jlCount');
var hits = 0;

// 누를 때마다 카운터가 오르고 젤리가 평소보다 크게 한 번 튄다 — 클래스를 もう一度 끼워 애니메이션을 재시동
document.querySelector('.jl__hit').addEventListener('click', function () {
  jl.classList.remove('is-demo');
  hits = hits + 1;
  count.textContent = String(hits);
  body.classList.remove('jl__body--boing');
  void body.offsetWidth;
  body.classList.add('jl__body--boing');
});
jl.addEventListener('pointerdown', function () { jl.classList.remove('is-demo'); });
</script>
</body>
</html>
