<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구름 부피 — 닫힌 표면이 아니라 쌓이는 안개 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cl is-demo" id="clRoot">
  <p class="cl__hint">
    <svg class="cl__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M128 24a16 16 0 0 1 16 16v8a80.06 80.06 0 0 1 63.94 63.94h8a16 16 0 0 1 0 32h-8A80.06 80.06 0 0 1 144 207.94v8a16 16 0 0 1-32 0v-8A80.06 80.06 0 0 1 48.06 144h-8a16 16 0 0 1 0-32h8A80.06 80.06 0 0 1 112 48.06v-8A16 16 0 0 1 128 24m-16 57.35V96a16 16 0 0 0 32 0V81.35A48.09 48.09 0 0 0 81.35 112H96a16 16 0 0 0 0-32h14.65M174.65 144H160a16 16 0 0 0 0 32h14.65A48.09 48.09 0 0 0 144 174.65V160a16 16 0 0 0-32 0v14.65A48.09 48.09 0 0 0 81.35 144" opacity=".2"/><path d="M232 128a104 104 0 1 1-104-104a104 104 0 0 1 104 104m-32 0a8 8 0 0 0-8-8h-9.34A56.1 56.1 0 0 0 136 77.34V68a8 8 0 0 0-16 0v9.34A56.1 56.1 0 0 0 77.34 120H68a8 8 0 0 0 0 16h9.34A56.1 56.1 0 0 0 120 179.66V188a8 8 0 0 0 16 0v-8.34A56.1 56.1 0 0 0 178.66 136H192a8 8 0 0 0 8-8m-40 0a32 32 0 1 1-32-32a32 32 0 0 1 32 32m-16 0a16 16 0 1 0-16 16a16 16 0 0 0 16-16"/></g></svg>
    <span>표면을 찾지 않고 레이가 지나는 밀도를 쌓습니다 — 포인터로 시점이 돕니다</span>
  </p>
  <div class="cl__field" id="clField" role="application" aria-label="구름 부피 레이 마칭 실험판" tabindex="0">
    <canvas class="cl__cv" id="clCv"></canvas>
  </div>
  <div class="cl__bar">
    <span class="cl__meta"><b class="cl__val" id="clRes">52×33</b> 렌더 타깃 · 스텝 40</span>
    <span class="cl__meta cl__meta--dim">fbm 3옥타브 · 부피 누적</span>
  </div>
</div>
</main>
<script>
// 구름 부피(08) — 닫힌 표면을 찾지 않는 레이 마칭(volume ray marching).
// 스텝마다 fbm 노이즈 밀도를 샘플해 알파로 누적하고, 앞이 꽉 차면(alpha ≥ 1)
// 걸음을 멈춘다. 밀도가 시간에 흐르므로 구름 형태 자체가 살아 움직인다.
// 값노이즈는 격자 해시 → 부드럽 보간(forner 짝 곡선) 2옥타브 + 위 1옥타브 = 3옥타브.
// WebGL 없이 ImageData 픽셀 계산만으로 나온다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형 3종을 만든다 ──
  var RT_W = 52;          // 렌더 타깃 폭(버퍼 픽셀). 스텝당 fbm 3옥타브라 52px 로 예산
  var STEPS = 40;         // 레이 경로 분할 수 — 변형 "스텝 수" 축(28 → 64). 부피는 고정 스텝
  var LOOP_MS = 2000;     // 미리보기 가상 포인터 주기
  var STEP_LEN = 0.16;    // 한 스텝이 나아가는 길이(월드 단위) — 두께×해상도를 정한다
  var DENSITY = 2.1;      // 밀도 배율 — 변형 "구름 농도" 축(1.2 · 2.1 · 3.4)
  var DRIFT = 0.09;       // 구름이 흐르는 속도 — 형태가 천천히 변한다
  // ────────────────────────────────────────────────────

  var root = document.getElementById('clRoot');
  var field = document.getElementById('clField');
  var cv = document.getElementById('clCv');
  var ctx = cv.getContext('2d');
  var resOut = document.getElementById('clRes');

  // 색은 CSS 커스텀 프로퍼티(--rm-*)에서 getComputedStyle 로 읽는다 — 파스텔 토큰이 scss 한 곳에
  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    if (s.charAt(0) === '#') {
      var hx = s.length === 4
        ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
        : s.slice(1);
      return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
    }
    var p = s.replace(/[^\d,.]/g, '').split(',');
    return [Number(p[0]) || 0, Number(p[1]) || 0, Number(p[2]) || 0];
  }
  var C_CLOUD = tokRGB('--rm-cloud');
  var C_LIT   = tokRGB('--rm-lit');
  var C_SHADE = tokRGB('--rm-shade');
  var C_SKY   = tokRGB('--rm-sky');
  var C_SKY2  = tokRGB('--rm-sky2');

  var TAU = Math.PI * 2;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0;
  var buf, bctx, img;             // 저해상 렌더 타깃 버퍼(캔버스와 별개)
  var heading = 0.55;             // 편요(라디안) — 포인터 좌우
  var pitch = 0.27;               // 상하각(라디안) — 포인터 상하
  var px01 = 0.5, py01 = 0.5;
  var manual = false;
  var raf = 0, t0 = -1;

  // ── 값노이즈(value noise) — 3D 격자 해시 + smoothstep 보간 ──
  function hash3(ix, iy, iz) {
    var h = ix * 127.1 + iy * 311.7 + iz * 74.7;
    h = Math.sin(h) * 43758.5453;
    return h - Math.floor(h);
  }
  function smootherstep(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function vnoise(px, py, pz) {
    var ix = Math.floor(px), iy = Math.floor(py), iz = Math.floor(pz);
    var fx = smootherstep(px - ix), fy = smootherstep(py - iy), fz = smootherstep(pz - iz);
    var v = 0;
    for (var dz = 0; dz <= 1; dz++) {
      var wz = dz ? fz : 1 - fz;
      for (var dy = 0; dy <= 1; dy++) {
        var wy = dy ? fy : 1 - fy;
        for (var dx = 0; dx <= 1; dx++) {
          var wx = dx ? fx : 1 - fx;
          v += hash3(ix + dx, iy + dy, iz + dz) * wx * wy * wz;
        }
      }
    }
    return v;                     // 0..1
  }
  // fbm 3옥타브 — 굵은 덩어리 + 잔물결. 시간축 drift 로 구름이 기어간다
  function fbm(px, py, pz) {
    var v = vnoise(px, py, pz) * 0.55;
    v += vnoise(px * 2.02 + 5.2, py * 2.02 + 1.3, pz * 2.02 + 9.1) * 0.3;
    v += vnoise(px * 4.08 + 1.7, py * 4.08 + 8.4, pz * 4.08 + 3.3) * 0.15;
    return v;                     // 0..1 근처
  }

  // 구름 밀도 — 높이로 다듬고(위 아래로 흐려진다) fbm 과 곱한다. 구름 밑은 비어 있다
  function density(px, py, pz, tSec) {
    var cy = py - 1.55;                       // 구름 층 중심 높이
    var hFade = 1.0 - (cy * cy) / 0.85;       // 높이 잎(0 이하는 구름 없음)
    if (hFade <= 0) return 0;
    var n = fbm(px * 0.9 + tSec * DRIFT, cy * 1.5, pz * 0.9 - tSec * DRIFT * 0.7);
    var d = (n - 0.44) * hFade * DENSITY;     // 문턱 0.44 로 솜뭉치만 남긴다
    return d > 0 ? d : 0;
  }

  function clamp255(v) { return v > 255 ? 255 : (v < 0 ? 0 : v); }

  function draw(tSec) {
    if (!img) return;
    var data = img.data;
    var bw = buf.width, bh = buf.height;

    // 카메라 — 구름 층 중심(0,1.55,0) 을 도는 궤도. heading/pitch 를 눈 위치로
    var ch = Math.cos(heading), sh = Math.sin(heading);
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var D = 4.6;                                    // 눈-구름층 거리
    var ex = sh * cp * D, ey = 1.55 + sp * D, ez = ch * cp * D;
    // 전방(눈→중심) · 오른쪽 · 위 — 오른손 기준
    var fx = -sh * cp, fy = -sp, fz = -ch * cp;
    var rx = -fz, rz = fx;                          // right = normalize(f × worldUp)
    var rl = Math.sqrt(rx * rx + rz * rz) || 1;
    rx /= rl; rz /= rl;
    var ux = -rz * fy, uy = rz * fx - rx * fz, uz = rx * fy;   // up = right × forward
    // 광원 — 오른쪽 위 파스텔 태양. 구름 가장자리를 두르게 둔다
    var lx = 0.42, ly = 0.8, lz = 0.4;

    var i = 0;
    for (var y = 0; y < bh; y++) {
      var vy = (1 - 2 * (y + 0.5) / bh) * 0.5;      // -0.5..+0.5 (화면 위가 +)
      for (var x = 0; x < bw; x++) {
        var vx = (2 * (x + 0.5) / bw - 1) * 0.8;    // -0.8..+0.8
        // 레이 방향 = 전방 + 화면 오프셋, 정규화
        var dx = fx + rx * vx + ux * vy;
        var dy = fy + uy * vy;
        var dz = fz + rz * vx + uz * vy;
        var dl = Math.sqrt(dx * dx + dy * dy + dz * dz);
        dx /= dl; dy /= dl; dz /= dl;

        // ── 부피 march — 표면 판정 없이 고정 스텝으로 밀도를 누적한다 ──
        // front-to-back 합성: col += (1-alpha)·a·src, alpha += (1-alpha)·a
        var alpha = 0, cr = 0, cg = 0, cb = 0;
        var px = ex, py = ey, pz = ez;
        for (var s = 0; s < STEPS; s++) {
          var d = density(px, py, pz, tSec);
          if (d > 0) {
            // 레이 진행 방향이 광원쪽이면 밝게, 반대면 그늘진 속 — 가장자리 빛 근사
            var lit = 0.5 + 0.5 * (dx * lx + dy * ly + dz * lz);
            lit = 0.3 + 0.7 * lit;                  // 너무 어두운 속을 막는다
            var a = 1 - Math.exp(-d * STEP_LEN);    // 이 구간의 불투명도
            var wa = a * (1 - alpha);               // 앞이 열린 만큼만 기여
            cr += wa * (C_LIT[0] + (C_CLOUD[0] - C_LIT[0]) * lit);
            cg += wa * (C_LIT[1] + (C_CLOUD[1] - C_LIT[1]) * lit);
            cb += wa * (C_LIT[2] + (C_CLOUD[2] - C_LIT[2]) * lit);
            // 그늴린 속은 음영 파스텔로 당긴다
            var sh = 1 - lit;
            cr += wa * (C_SHADE[0] - C_CLOUD[0]) * sh * 0.5;
            cg += wa * (C_SHADE[1] - C_CLOUD[1]) * sh * 0.5;
            cb += wa * (C_SHADE[2] - C_CLOUD[2]) * sh * 0.5;
            alpha += wa;
            if (alpha > 0.98) break;                // 앞이 꽉 찼다 — 뒤는 안 본다
          }
          px += dx * STEP_LEN; py += dy * STEP_LEN; pz += dz * STEP_LEN;
        }

        // 하늘 — 하늘색↔라일락 파동 그라데이션이 프레임마다 흐른다
        var sky = dy > 0 ? dy : 0;
        var wave = 0.5 + 0.5 * Math.sin(tSec * 1.4 + vx * 3.0);
        var gr = 0.35 * wave;
        var hr = C_SKY[0] + (C_LIT[0] - C_SKY[0]) * sky * 0.3 + (C_SKY2[0] - C_SKY[0]) * gr;
        var hg = C_SKY[1] + (C_LIT[1] - C_SKY[1]) * sky * 0.3 + (C_SKY2[1] - C_SKY[1]) * gr;
        var hb = C_SKY[2] + (C_LIT[2] - C_SKY[2]) * sky * 0.3 + (C_SKY2[2] - C_SKY[2]) * gr;

        // 구름(누적색) 을 하늘 위에 얹는다 — alpha 가 이미 가중치다
        data[i] = clamp255(cr + hr * (1 - alpha));
        data[i + 1] = clamp255(cg + hg * (1 - alpha));
        data[i + 2] = clamp255(cb + hb * (1 - alpha));
        data[i + 3] = 255;
        i += 4;
      }
    }
    bctx.putImageData(img, 0, 0);
    // 저해상 버퍼를 캔버스 CSS 크기로 부드럽게 확대 — dpr 을 곱하지 않는다(버퍼가 저해상)
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(buf, 0, 0, W, H);
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W); cv.height = Math.round(H);
    var bh = Math.max(12, Math.round(RT_W * H / W));
    buf = document.createElement('canvas');
    buf.width = RT_W; buf.height = bh;
    bctx = buf.getContext('2d');
    img = bctx.createImageData(RT_W, bh);
    resOut.textContent = RT_W + '×' + bh;
  }

  function aim() {
    // 포인터/키 입력 → 목표 각도. 구름층을 굽어보는 heading ±1.8 · pitch 0.06..0.52
    return [(px01 - 0.5) * 3.6, 0.3 + (py01 - 0.5) * 0.46];
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    if (!manual) {
      // 미리보기 가상 포인터 — 시드 고정 Lissajous(표 밖 자연 경로). 진폭을 끝까지 쓴다
      var ph = ((now - t0) % LOOP_MS) / LOOP_MS * TAU;
      px01 = 0.5 + 0.48 * Math.sin(ph);
      py01 = 0.5 + 0.42 * Math.sin(2 * ph + 0.7);
    }
    var a = aim();
    heading += (a[0] - heading) * 0.14;
    pitch += (a[1] - pitch) * 0.14;
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  field.addEventListener('pointermove', function (e) {
    var r = field.getBoundingClientRect();
    px01 = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    py01 = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    if (!manual) { manual = true; root.classList.remove('is-demo'); }
    if (reduce) { var a1 = aim(); heading = a1[0]; pitch = a1[1]; draw(0.6); }
  });
  field.addEventListener('pointerleave', function () {
    if (manual) { px01 = 0.5; py01 = 0.5; }
  });
  field.addEventListener('keydown', function (e) {
    var d = { ArrowLeft: [-0.07, 0], ArrowRight: [0.07, 0], ArrowUp: [0, -0.06], ArrowDown: [0, 0.06] }[e.key];
    if (!d) return;
    e.preventDefault();
    if (!manual) { manual = true; root.classList.remove('is-demo'); }
    px01 = Math.max(0, Math.min(1, px01 + d[0]));
    py01 = Math.max(0, Math.min(1, py01 + d[1]));
    if (reduce) { var a2 = aim(); heading = a2[0]; pitch = a2[1]; draw(0.6); }
  });
  window.addEventListener('resize', function () { fit(); if (reduce) draw(0.6); });

  fit();
  if (reduce) {
    // reduce — rAF 를 돌리지 않고 구름 층이 읽히는 각도의 한 장만 그린다
    heading = 0.55; pitch = 0.3;
    draw(0.6);
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
