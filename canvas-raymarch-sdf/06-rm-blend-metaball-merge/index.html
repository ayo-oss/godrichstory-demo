<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메타볼 합체 — 매끄럽게 잇기의 합집합 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mt is-demo" id="mtRoot">
  <p class="mt__hint">
    <svg class="mt__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M128 24a16 16 0 0 1 16 16v8a80.06 80.06 0 0 1 63.94 63.94h8a16 16 0 0 1 0 32h-8A80.06 80.06 0 0 1 144 207.94v8a16 16 0 0 1-32 0v-8A80.06 80.06 0 0 1 48.06 144h-8a16 16 0 0 1 0-32h8A80.06 80.06 0 0 1 112 48.06v-8A16 16 0 0 1 128 24m-16 57.35V96a16 16 0 0 0 32 0V81.35A48.09 48.09 0 0 0 81.35 112H96a16 16 0 0 0 0-32h14.65M174.65 144H160a16 16 0 0 0 0 32h14.65A48.09 48.09 0 0 0 144 174.65V160a16 16 0 0 0-32 0v14.65A48.09 48.09 0 0 0 81.35 144" opacity=".2"/><path d="M232 128a104 104 0 1 1-104-104a104 104 0 0 1 104 104m-32 0a8 8 0 0 0-8-8h-9.34A56.1 56.1 0 0 0 136 77.34V68a8 8 0 0 0-16 0v9.34A56.1 56.1 0 0 0 77.34 120H68a8 8 0 0 0 0 16h9.34A56.1 56.1 0 0 0 120 179.66V188a8 8 0 0 0 16 0v-8.34A56.1 56.1 0 0 0 178.66 136H192a8 8 0 0 0 8-8m-40 0a32 32 0 1 1-32-32a32 32 0 0 1 32 32m-16 0a16 16 0 1 0-16 16a16 16 0 0 0 16-16"/></g></svg>
    <span>두 구가 닿는 순간 목이 늘어나며 합쳐집니다 — 포인터로 시점이 돕니다</span>
  </p>
  <div class="mt__field" id="mtField" role="application" aria-label="메타볼 레이 마칭 실험판" tabindex="0">
    <canvas class="mt__cv" id="mtCv"></canvas>
  </div>
  <div class="mt__bar">
    <span class="mt__meta"><b class="mt__val" id="mtRes">56×35</b> 렌더 타깃 · 스텝 64</span>
    <span class="mt__meta mt__meta--dim">smin k=0.35 · 구 셋 합집합</span>
  </div>
</div>
</main>
<script>
// 메타볼 합체(06) — smooth min(smin) 으로 구 셋을 하나의 매끈한 덩어리로 합친다.
// 다항식 smin 은 두 거리를 k 반경 안에서 이어 붙인다:
//   h = clamp(0.5 + 0.5(d1-d2)/k, 0, 1),  mix(d2, d1, h) - k·h(1-h)
// 중심이 시간에 따라 궤도를 돌아 가까워지는 순간 목이 늘어나는 "합체" 가 보인다.
// WebGL 없이 ImageData 픽셀 계산만으로 나온다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형 3종을 만든다 ──
  var RT_W = 56;          // 렌더 타깃 폭(버퍼 픽셀). smin 장면은 가볍다
  var STEPS = 64;         // 최대 전진 스텝 수 — 변형 "스텝 수" 축(48 → 96)
  var HIT_EPS = 0.005;    // 표면 도달 판정 거리(월드 단위)
  var LOOP_MS = 2000;     // 미리보기 가상 포인터 주기
  var K = 0.35;           // smin 혼합 반경 — 변형 "목 두께" 축(0.15 · 0.35 · 0.6)
  var PERIOD = 3.2;       // 메타볼 궤도 주기(초) — 합체-분리 리듬
  // ────────────────────────────────────────────────────

  var root = document.getElementById('mtRoot');
  var field = document.getElementById('mtField');
  var cv = document.getElementById('mtCv');
  var ctx = cv.getContext('2d');
  var resOut = document.getElementById('mtRes');

  // 색은 CSS 커스텀 프로퍼티(--rm-*)에서 getComputedStyle 로 읽는다 — 파스텔 토큰이 scss 한 곳에
  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    if (s.charAt(0) === '#') {
      var hx = s.length === 4
        ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
        : s.slice(1);
      return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
    }
    var p = s.replace(/[^\d,.]/g, '').split(',');
    return [Number(p[0]) || 0, Number(p[1]) || 0, Number(p[2]) || 0];
  }
  var C_BLOB_A = tokRGB('--rm-blob-a');
  var C_BLOB_B = tokRGB('--rm-blob-b');
  var C_HILITE = tokRGB('--rm-hilite');
  var C_FLOOR  = tokRGB('--rm-floor');
  var C_SHADE  = tokRGB('--rm-shade');
  var C_SKY    = tokRGB('--rm-sky');
  var C_SKY2   = tokRGB('--rm-sky2');

  var TAU = Math.PI * 2;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0;
  var buf, bctx, img;             // 저해상 렌더 타깃 버퍼(캔버스와 별개)
  var heading = 0.55;             // 편요(라디안) — 포인터 좌우
  var pitch = 0.27;               // 상하각(라디안) — 포인터 상하
  var px01 = 0.5, py01 = 0.5;
  var manual = false;
  var raf = 0, t0 = -1;

  // 구 하나의 부호 거리 — p 에서 구 표면까지, 안이면 음수
  function sdSphere(px, py, pz, cx, cy, cz, rad) {
    var dx = px - cx, dy = py - cy, dz = pz - cz;
    return Math.sqrt(dx * dx + dy * dy + dz * dz) - rad;
  }

  // 다항식 smooth min — k 반경 안에서 두 거리를 이어 붙인다(목이 만들어진다)
  function smin(a, b, k) {
    var h = 0.5 + 0.5 * (b - a) / k;
    if (h < 0) h = 0; else if (h > 1) h = 1;
    return b + (a - b) * h - k * h * (1 - h);
  }

  // 이 프레임의 메타볼 중심 셋 — 시간에 따라 모였다 벌어진다
  var centers = [0, 0, 0, 0, 0, 0, 0, 0, 0];
  function updateBlobs(tSec) {
    var ph = tSec / PERIOD * TAU;
    var sway = 0.34 + 0.5 * Math.sin(ph);            // 0.34..0.84 — 가장 가까울 때 목이 잇는다
    var orbit = Math.sin(ph * 0.5);
    centers[0] = -sway;                              // A — 좌우로 모였다 벌어진다
    centers[1] = 1.0 + 0.42 * Math.sin(ph * 0.7 + 1.1);
    centers[2] = 0.1 * orbit;
    centers[3] = sway;                               // B — A 의 거울
    centers[4] = 1.0 - 0.4 * Math.sin(ph * 0.7 + 1.1);
    centers[5] = -0.1 * orbit;
    centers[6] = 0.15 * Math.sin(ph * 1.3 + 2.0);    // C — 작은 구가 위에서 맴돈다
    centers[7] = 1.95 + 0.3 * Math.sin(ph * 0.9);
    centers[8] = 0.42 + 0.3 * Math.sin(ph * 0.6);
  }

  var lastMix = 0.5;               // 직전 map 호출의 A/B 가중치 — 색 변조용
  // 장면 거리 = 구 셋의 smin 합집합(바닥 포함)
  function map(px, py, pz) {
    var dA = sdSphere(px, py, pz, centers[0], centers[1], centers[2], 0.72);
    var dB = sdSphere(px, py, pz, centers[3], centers[4], centers[5], 0.72);
    var dC = sdSphere(px, py, pz, centers[6], centers[7], centers[8], 0.42);
    lastMix = dA < dB ? 0 : 1;                       // 어떤 구 쪽 표면인지
    var dAB = smin(dA, dB, K);
    var dS = smin(dAB, dC, K * 0.8);                 // 작은 구는 더 가는 목으로 붙는다
    var dF = py;                                     // 바닥 평면 y=0
    return dS < dF ? dS : dF;
  }

  // 거리장의 기울기(전방 차분) = 표면 법선
  function normalAt(px, py, pz) {
    var e = 0.002;
    var nx = map(px + e, py, pz) - map(px - e, py, pz);
    var ny = map(px, py + e, pz) - map(px, py - e, pz);
    var nz = map(px, py, pz + e) - map(px, py, pz - e);
    var l = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
    return [nx / l, ny / l, nz / l];
  }

  // 부드러운 그림자 — 바닥 점에서 광원 방향으로 다시 마칭한다. 광원은 draw 의 궤도와 같은 위상
  function softShadow(px, py, pz, lph) {
    var lx = -0.5 + 0.3 * Math.cos(lph), ly = 0.78, lz = 0.38 + 0.3 * Math.sin(lph);
    var ll = Math.sqrt(lx * lx + ly * ly + lz * lz);
    lx /= ll; ly /= ll; lz /= ll;
    var t = 0.02, res = 1.0;
    for (var i = 0; i < 24; i++) {
      var qx = px + lx * t, qy = py + ly * t, qz = pz + lz * t;
      var dA = sdSphere(qx, qy, qz, centers[0], centers[1], centers[2], 0.72);
      var dB = sdSphere(qx, qy, qz, centers[3], centers[4], centers[5], 0.72);
      var dC = sdSphere(qx, qy, qz, centers[6], centers[7], centers[8], 0.42);
      var d = Math.min(dA, Math.min(dB, dC));   // 그림자 레이는 smin 없이 최소만
      if (d < -0.001) return 0.0;
      res = Math.min(res, 10.0 * d / t);
      if (res < 0.005 || t > 7.0) break;
      t += Math.max(d, 0.02);
    }
    return res < 0 ? 0 : (res > 1 ? 1 : res);
  }

  function mix3(c1, c2, t) {
    return [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
  }
  function clamp255(v) { return v > 255 ? 255 : (v < 0 ? 0 : v); }

  function draw(tSec) {
    if (!img) return;
    updateBlobs(tSec);
    var data = img.data;
    var bw = buf.width, bh = buf.height;

    // 카메라 — 장면 중심(0,1,0) 을 도는 궤도. heading/pitch 를 눈 위치로
    var ch = Math.cos(heading), sh = Math.sin(heading);
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var D = 4.0;                                    // 눈-중심 거리
    var ex = sh * cp * D, ey = 1.0 + sp * D, ez = ch * cp * D;
    // 전방(눈→중심) · 오른쪽 · 위 — 오른손 기저
    var fx = -sh * cp, fy = -sp, fz = -ch * cp;
    var rx = -fz, rz = fx;                          // right = normalize(f × worldUp)
    var rl = Math.sqrt(rx * rx + rz * rz) || 1;
    rx /= rl; rz /= rl;
    var ux = -rz * fy, uy = rz * fx - rx * fz, uz = rx * fy;   // up = right × forward
    // 광원 궤도 — 왼쪽 위를 도는 파스텔 키 라이트. 목 하이라이트가 프레임마다 흐른다
    var lph = tSec * 0.9 + 2.1;
    var lx = -0.5 + 0.3 * Math.cos(lph), ly = 0.78, lz = 0.38 + 0.3 * Math.sin(lph);
    var ll = Math.sqrt(lx * lx + ly * ly + lz * lz);
    lx /= ll; ly /= ll; lz /= ll;

    var i = 0;
    for (var y = 0; y < bh; y++) {
      var vy = (1 - 2 * (y + 0.5) / bh) * 0.5;      // -0.5..+0.5 (화면 위가 +)
      for (var x = 0; x < bw; x++) {
        var vx = (2 * (x + 0.5) / bw - 1) * 0.8;    // -0.8..+0.8
        // 레이 방향 = 전방 + 화면 오프셋, 정규화
        var dx = fx + rx * vx + ux * vy;
        var dy = fy + uy * vy;
        var dz = fz + rz * vx + uz * vy;
        var dl = Math.sqrt(dx * dx + dy * dy + dz * dz);
        dx /= dl; dy /= dl; dz /= dl;

        // ── march 루프 — smin 거리도 정확한 SDF 니 그대로 전진한다 ──
        var t = 0.0, hit = 0, px = ex, py = ey, pz = ez;
        for (var s = 0; s < STEPS; s++) {
          var d = map(px, py, pz);
          if (d < HIT_EPS) { hit = 1; break; }      // 표면 도달
          if (t > 12.0) break;                      // 멀어지면 하늘로 놓아준다
          t += d;
          px = ex + dx * t; py = ey + dy * t; pz = ez + dz * t;
        }

        var r, g, b;
        if (hit) {
          var isFloor = py < 0.02;                  // 낮게 맞았으면 바닥
          var n = normalAt(px, py, pz);
          var lam = Math.max(0, n[0] * lx + n[1] * ly + n[2] * lz);
          if (isFloor) {
            // 바닥 — 그림자 레이로 두 덩어리의 부드러운 접시 음영
            var shd = softShadow(px, py, pz, lph);
            var lit = (0.4 + 0.6 * lam) * (0.25 + 0.75 * shd);
            r = C_FLOOR[0] * lit + C_SHADE[0] * (1 - lit);
            g = C_FLOOR[1] * lit + C_SHADE[1] * (1 - lit);
            b = C_FLOOR[2] * lit + C_SHADE[2] * (1 - lit);
          } else {
            // 메타볼 — 왼쪽 핑크·오른쪽 하늘색, 목 지점에서 자연스럽게 섞인다
            var base = mix3(C_BLOB_A, C_BLOB_B, lastMix);
            var dif = 0.26 + 0.74 * lam;
            var rim = Math.max(0, n[0] * -dx + n[1] * -dy + n[2] * -dz);
            var spec = Math.pow(rim, 16) * 0.45;
            r = base[0] * dif + C_HILITE[0] * spec;
            g = base[1] * dif + C_HILITE[1] * spec;
            b = base[2] * dif + C_HILITE[2] * spec;
          }
        } else {
          // 하늘 — 핑크↔크림 파동 그라데이션이 프레임마다 흐른다
          var sky = dy > 0 ? dy : 0;
          var wave = 0.5 + 0.5 * Math.sin(tSec * 1.4 + vx * 3.0);
          var gr = 0.35 * wave;
          r = C_SKY[0] + (C_HILITE[0] - C_SKY[0]) * sky * 0.3 + (C_SKY2[0] - C_SKY[0]) * gr;
          g = C_SKY[1] + (C_HILITE[1] - C_SKY[1]) * sky * 0.3 + (C_SKY2[1] - C_SKY[1]) * gr;
          b = C_SKY[2] + (C_HILITE[2] - C_SKY[2]) * sky * 0.3 + (C_SKY2[2] - C_SKY[2]) * gr;
        }
        data[i] = clamp255(r);
        data[i + 1] = clamp255(g);
        data[i + 2] = clamp255(b);
        data[i + 3] = 255;
        i += 4;
      }
    }
    bctx.putImageData(img, 0, 0);
    // 저해상 버퍼를 캔버스 CSS 크기로 부드럽게 확대 — dpr 을 곱하지 않는다(버퍼가 저해상)
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(buf, 0, 0, W, H);
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W); cv.height = Math.round(H);
    var bh = Math.max(12, Math.round(RT_W * H / W));
    buf = document.createElement('canvas');
    buf.width = RT_W; buf.height = bh;
    bctx = buf.getContext('2d');
    img = bctx.createImageData(RT_W, bh);
    resOut.textContent = RT_W + '×' + bh;
  }

  function aim() {
    // 포인터/키 입력 → 목표 각도. heading ±1.15 · pitch 0.1..0.5 — 목 순간이 번갈아 보인다
    return [(px01 - 0.5) * 2.3, 0.3 + (py01 - 0.5) * 0.4];
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    if (!manual) {
      // 미리보기 가상 포인터 — 시드 고정 Lissajous(표 밖 자연 경로). 진폭을 끝까지 쓴다
      var ph = ((now - t0) % LOOP_MS) / LOOP_MS * TAU;
      px01 = 0.5 + 0.48 * Math.sin(ph);
      py01 = 0.5 + 0.42 * Math.sin(2 * ph + 0.7);
    }
    var a = aim();
    heading += (a[0] - heading) * 0.14;
    pitch += (a[1] - pitch) * 0.14;
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  field.addEventListener('pointermove', function (e) {
    var r = field.getBoundingClientRect();
    px01 = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    py01 = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    if (!manual) { manual = true; root.classList.remove('is-demo'); }
    if (reduce) { var a1 = aim(); heading = a1[0]; pitch = a1[1]; draw(1.6); }
  });
  field.addEventListener('pointerleave', function () {
    if (manual) { px01 = 0.5; py01 = 0.5; }
  });
  field.addEventListener('keydown', function (e) {
    var d = { ArrowLeft: [-0.07, 0], ArrowRight: [0.07, 0], ArrowUp: [0, -0.06], ArrowDown: [0, 0.06] }[e.key];
    if (!d) return;
    e.preventDefault();
    if (!manual) { manual = true; root.classList.remove('is-demo'); }
    px01 = Math.max(0, Math.min(1, px01 + d[0]));
    py01 = Math.max(0, Math.min(1, py01 + d[1]));
    if (reduce) { var a2 = aim(); heading = a2[0]; pitch = a2[1]; draw(1.6); }
  });
  window.addEventListener('resize', function () { fit(); if (reduce) draw(1.6); });

  fit();
  if (reduce) {
    // reduce — rAF 를 돌리지 않고 목이 잇는 순간의 한 장만 그린다
    heading = 0.55; pitch = 0.3;
    draw(1.6);
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
