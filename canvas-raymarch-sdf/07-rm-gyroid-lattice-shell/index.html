<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자이로이드 껍질 — 삼각함수로 적는 무한 구조 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gy is-demo" id="gyRoot">
  <p class="gy__hint">
    <svg class="gy__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M128 24a16 16 0 0 1 16 16v8a80.06 80.06 0 0 1 63.94 63.94h8a16 16 0 0 1 0 32h-8A80.06 80.06 0 0 1 144 207.94v8a16 16 0 0 1-32 0v-8A80.06 80.06 0 0 1 48.06 144h-8a16 16 0 0 1 0-32h8A80.06 80.06 0 0 1 112 48.06v-8A16 16 0 0 1 128 24m-16 57.35V96a16 16 0 0 0 32 0V81.35A48.09 48.09 0 0 0 81.35 112H96a16 16 0 0 0 0-32h14.65M174.65 144H160a16 16 0 0 0 0 32h14.65A48.09 48.09 0 0 0 144 174.65V160a16 16 0 0 0-32 0v14.65A48.09 48.09 0 0 0 81.35 144" opacity=".2"/><path d="M232 128a104 104 0 1 1-104-104a104 104 0 0 1 104 104m-32 0a8 8 0 0 0-8-8h-9.34A56.1 56.1 0 0 0 136 77.34V68a8 8 0 0 0-16 0v9.34A56.1 56.1 0 0 0 77.34 120H68a8 8 0 0 0 0 16h9.34A56.1 56.1 0 0 0 120 179.66V188a8 8 0 0 0 16 0v-8.34A56.1 56.1 0 0 0 178.66 136H192a8 8 0 0 0 8-8m-40 0a32 32 0 1 1-32-32a32 32 0 0 1 32 32m-16 0a16 16 0 1 0-16 16a16 16 0 0 0 16-16"/></g></svg>
    <span>사인과 코사인의 등가면을 두 겹으로 잘라 껍질을 만듭니다 — 포인터로 시점이 돕니다</span>
  </p>
  <div class="gy__field" id="gyField" role="application" aria-label="자이로이드 레이 마칭 실험판" tabindex="0">
    <canvas class="gy__cv" id="gyCv"></canvas>
  </div>
  <div class="gy__bar">
    <span class="gy__meta"><b class="gy__val" id="gyRes">56×35</b> 렌더 타깃 · 스텝 68</span>
    <span class="gy__meta gy__meta--dim">등가면 껍질 · 안개 깊이</span>
  </div>
</div>
</main>
<script>
// 자이로이드 껍질(07) — 정확한 거리 함수가 아니라 밀도 함수로 장면을 적는 방법.
// g = sin(px)cos(py) + sin(py)cos(pz) + sin(pz)cos(px) 는 무한히 주름진 등가면의 가족인데,
// |g| ≈ w 인 두 면 사이를 껍질(SHELL_W)로 자르고 경계 구로 잘라내면 프린트 공판 같은
// 주름 껍질이 나온다. g 는 거리가 아니므로 1/GRAD 로 눌러 conservative 하게 전진하고
// (실제보다 짧게만 재니 형태는 안전), 깊이는 지수 안개로 녹인다.
// WebGL 없이 ImageData 픽셀 계산만으로 나온다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형 3종을 만든다 ──
  var RT_W = 56;          // 렌더 타깃 폭(버퍼 픽셀). 삼각함수 6개/스텝이라 56px 로 예산
  var STEPS = 68;         // 최대 전진 스텝 수 — 변형 "스텝 수" 축(48 → 96)
  var HIT_EPS = 0.006;    // 표면 도달 판정 거리(월드 단위)
  var LOOP_MS = 2000;     // 미리보기 가상 포인터 주기
  var SHELL_W = 0.34;     // 등가면 껍질 두께 — 변형 "껍질 두께" 축(0.12 · 0.24 · 0.4)
  var SAFETY = 0.5;      // 근사 거리 안전 계수 — 그래디언트 크기(~1.8) 역수보다 작게
  var DRIFT = 0.16;       // 등가면이 흐르는 속도(주파수 공간 이동) — 구름처럼 기어간다
  // ────────────────────────────────────────────────────

  var root = document.getElementById('gyRoot');
  var field = document.getElementById('gyField');
  var cv = document.getElementById('gyCv');
  var ctx = cv.getContext('2d');
  var resOut = document.getElementById('gyRes');

  // 색은 CSS 커스텀 프로퍼티(--rm-*)에서 getComputedStyle 로 읽는다 — 파스텔 토큰이 scss 한 곳에
  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    if (s.charAt(0) === '#') {
      var hx = s.length === 4
        ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
        : s.slice(1);
      return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
    }
    var p = s.replace(/[^\d,.]/g, '').split(',');
    return [Number(p[0]) || 0, Number(p[1]) || 0, Number(p[2]) || 0];
  }
  var C_SHELL  = tokRGB('--rm-shell');
  var C_SHELL2 = tokRGB('--rm-shell2');
  var C_HILITE = tokRGB('--rm-hilite');
  var C_SHADE  = tokRGB('--rm-shade');
  var C_SKY    = tokRGB('--rm-sky');
  var C_SKY2   = tokRGB('--rm-sky2');

  var TAU = Math.PI * 2;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0;
  var buf, bctx, img;             // 저해상 렌더 타깃 버퍼(캔버스와 별개)
  var heading = 0.55;             // 편요(라디안) — 포인터 좌우
  var pitch = 0.27;               // 상하각(라디안) — 포인터 상하
  var px01 = 0.5, py01 = 0.5;
  var manual = false;
  var raf = 0, t0 = -1;

  // 자이로이드 밀도 — 세 축의 sin·cos 곱의 합. 값이 0 인 면이 무한 주름 등가면
  function gyroid(px, py, pz) {
    return Math.sin(px) * Math.cos(py) + Math.sin(py) * Math.cos(pz) + Math.sin(pz) * Math.cos(px);
  }

  var phase = 0.0;                // 이 프레임의 등가면 위상 — 시간에 따라 흐른다
  var lastBand = 0.5;             // 직전 map 호출의 껍질 안쪽 위치(-1..1) — 색 변조용
  // 장면 거리 — |g| < w 껍질 ∩ 경계 구(반지름 1.78, 중심 (0,1,0)).
  // g 의 그래디언트 크기는 최대 √2 이상이라 1/GRAD 로 눌러 conservative 근사를 만든다
  function map(px, py, pz) {
    var cy = py - 1.0;
    // 등가면 위상 이동 — 좌표를 통째로 흐르게 하면 주름이 기어간다
    var g = gyroid(px + phase, cy * 1.0, pz - phase * 0.6);
    lastBand = g / 0.5;
    var lip = (Math.abs(g) - SHELL_W) / 1.8;   // 껍질 두껍게 자르기 — 근사 거리
    var dR = Math.sqrt(px * px + cy * cy + pz * pz) - 1.78;
    return lip > dR ? lip : dR;                // max = 교집합(껍질을 구 안으로 자른다)
  }

  // 거리장의 기울기(전방 차분) = 표면 법선
  function normalAt(px, py, pz) {
    var e = 0.002;
    var nx = map(px + e, py, pz) - map(px - e, py, pz);
    var ny = map(px, py + e, pz) - map(px, py - e, pz);
    var nz = map(px, py, pz + e) - map(px, py, pz - e);
    var l = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
    return [nx / l, ny / l, nz / l];
  }

  function mix3(c1, c2, t) {
    return [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
  }
  function clamp255(v) { return v > 255 ? 255 : (v < 0 ? 0 : v); }
  function sat01(v) { return v > 1 ? 1 : (v < 0 ? 0 : v); }

  function draw(tSec) {
    if (!img) return;
    phase = tSec * DRIFT;
    var data = img.data;
    var bw = buf.width, bh = buf.height;

    // 카메라 — 껍질 중심(0,1,0) 을 도는 궤도. heading/pitch 를 눈 위치로
    var ch = Math.cos(heading), sh = Math.sin(heading);
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var D = 3.7;                                    // 눈-껍질 거리
    var ex = sh * cp * D, ey = 1.0 + sp * D, ez = ch * cp * D;
    // 전방(눈→중심) · 오른쪽 · 위 — 오른손 기준
    var fx = -sh * cp, fy = -sp, fz = -ch * cp;
    var rx = -fz, rz = fx;                          // right = normalize(f × worldUp)
    var rl = Math.sqrt(rx * rx + rz * rz) || 1;
    rx /= rl; rz /= rl;
    var ux = -rz * fy, uy = rz * fx - rx * fz, uz = rx * fy;   // up = right × forward
    // 광원 궤도 — 왼쪽 위를 도는 파스텔 키 라이트. 주름 사이 명암이 프레임마다 흘러간다
    var lph = tSec * 0.9 + 2.1;
    var lx = -0.44 + 0.3 * Math.cos(lph), ly = 0.72, lz = 0.42 + 0.3 * Math.sin(lph);
    var ll = Math.sqrt(lx * lx + ly * ly + lz * lz);
    lx /= ll; ly /= ll; lz /= ll;

    var i = 0;
    for (var y = 0; y < bh; y++) {
      var vy = (1 - 2 * (y + 0.5) / bh) * 0.5;      // -0.5..+0.5 (화면 위가 +)
      for (var x = 0; x < bw; x++) {
        var vx = (2 * (x + 0.5) / bw - 1) * 0.8;    // -0.8..+0.8
        // 레이 방향 = 전방 + 화면 오프셋, 정규화
        var dx = fx + rx * vx + ux * vy;
        var dy = fy + uy * vy;
        var dz = fz + rz * vx + uz * vy;
        var dl = Math.sqrt(dx * dx + dy * dy + dz * dz);
        dx /= dl; dy /= dl; dz /= dl;

        // ── march 루프 — 근사 거리라 SAFETY 를 곱해 conservative 하게 전진한다 ──
        var t = 0.0, hit = 0, px = ex, py = ey, pz = ez, steps = 0;
        for (var s = 0; s < STEPS; s++) {
          var d = map(px, py, pz);
          if (d < HIT_EPS) { hit = 1; break; }      // 표면 도달
          if (t > 9.0) break;                       // 멀어지면 안개로 놓아준다
          t += d * SAFETY;
          steps = s;
          px = ex + dx * t; py = ey + dy * t; pz = ez + dz * t;
        }

        // 하늘 — 하늘색↔민트 파동 그라데이션이 프레임마다 흐른다 (안개색의 바탕)
        var sky = dy > 0 ? dy : 0;
        var wave = 0.5 + 0.5 * Math.sin(tSec * 1.4 + vx * 3.0);
        var gr = 0.35 * wave;
        var hr = C_SKY[0] + (C_HILITE[0] - C_SKY[0]) * sky * 0.3 + (C_SKY2[0] - C_SKY[0]) * gr;
        var hg = C_SKY[1] + (C_HILITE[1] - C_SKY[1]) * sky * 0.3 + (C_SKY2[1] - C_SKY[1]) * gr;
        var hb = C_SKY[2] + (C_HILITE[2] - C_SKY[2]) * sky * 0.3 + (C_SKY2[2] - C_SKY[2]) * gr;

        var r, g, b;
        if (hit) {
          var n = normalAt(px, py, pz);
          var lam = Math.max(0, n[0] * lx + n[1] * ly + n[2] * lz);
          // AO 근사 — 주름 깊은 픽셀은 스텝을 더 쓴다
          var ao = 1 - (steps / STEPS) * 0.5;
          // 껍질 안쪽 위치(-1..1)로 두 파스텔 사이를 흐르게 — 주름마다 색띠가 돈다
          var bandMix = sat01(0.5 + 0.5 * Math.sin(lastBand * 2.6 + tSec * 0.7));
          var base = mix3(C_SHELL, C_SHELL2, bandMix);
          var dif = (0.22 + 0.78 * lam) * ao;
          var rim = Math.max(0, n[0] * -dx + n[1] * -dy + n[2] * -dz);
          var spec = Math.pow(rim, 14) * 0.4;
          r = base[0] * dif + C_HILITE[0] * spec;
          g = base[1] * dif + C_HILITE[1] * spec;
          b = base[2] * dif + C_HILITE[2] * spec;
          // 지수 안개 — 멀수록 하늘색에 녹아 깊이를 읽게 한다
          var fog = 1.0 - Math.exp(-0.045 * t * t);
          r = r + (hr - r) * fog;
          g = g + (hg - g) * fog;
          b = b + (hb - b) * fog;
        } else {
          r = hr; g = hg; b = hb;
        }
        data[i] = clamp255(r);
        data[i + 1] = clamp255(g);
        data[i + 2] = clamp255(b);
        data[i + 3] = 255;
        i += 4;
      }
    }
    bctx.putImageData(img, 0, 0);
    // 저해상 버퍼를 캔버스 CSS 크기로 부드럽게 확대 — dpr 을 곱하지 않는다(버퍼가 저해상)
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(buf, 0, 0, W, H);
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W); cv.height = Math.round(H);
    var bh = Math.max(12, Math.round(RT_W * H / W));
    buf = document.createElement('canvas');
    buf.width = RT_W; buf.height = bh;
    bctx = buf.getContext('2d');
    img = bctx.createImageData(RT_W, bh);
    resOut.textContent = RT_W + '×' + bh;
  }

  function aim() {
    // 포인터/키 입력 → 목표 각도. 주름 속까지 들여다보는 heading ±1.8 · pitch 0.08..0.56
    return [(px01 - 0.5) * 3.6, 0.32 + (py01 - 0.5) * 0.48];
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    if (!manual) {
      // 미리보기 가상 포인터 — 시드 고정 Lissajous(표 밖 자연 경로). 진폭을 끝까지 쓴다
      var ph = ((now - t0) % LOOP_MS) / LOOP_MS * TAU;
      px01 = 0.5 + 0.48 * Math.sin(ph);
      py01 = 0.5 + 0.42 * Math.sin(2 * ph + 0.7);
    }
    var a = aim();
    heading += (a[0] - heading) * 0.14;
    pitch += (a[1] - pitch) * 0.14;
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  field.addEventListener('pointermove', function (e) {
    var r = field.getBoundingClientRect();
    px01 = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    py01 = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    if (!manual) { manual = true; root.classList.remove('is-demo'); }
    if (reduce) { var a1 = aim(); heading = a1[0]; pitch = a1[1]; draw(0.6); }
  });
  field.addEventListener('pointerleave', function () {
    if (manual) { px01 = 0.5; py01 = 0.5; }
  });
  field.addEventListener('keydown', function (e) {
    var d = { ArrowLeft: [-0.07, 0], ArrowRight: [0.07, 0], ArrowUp: [0, -0.06], ArrowDown: [0, 0.06] }[e.key];
    if (!d) return;
    e.preventDefault();
    if (!manual) { manual = true; root.classList.remove('is-demo'); }
    px01 = Math.max(0, Math.min(1, px01 + d[0]));
    py01 = Math.max(0, Math.min(1, py01 + d[1]));
    if (reduce) { var a2 = aim(); heading = a2[0]; pitch = a2[1]; draw(0.6); }
  });
  window.addEventListener('resize', function () { fit(); if (reduce) draw(0.6); });

  fit();
  if (reduce) {
    // reduce — rAF 를 돌리지 않고 주름이 읽히는 각도의 한 장만 그린다
    heading = 0.55; pitch = 0.32;
    draw(0.6);
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
