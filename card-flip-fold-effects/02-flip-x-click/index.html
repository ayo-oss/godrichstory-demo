<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip on X (click) — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <button type="button" class="fx-card is-demo" aria-pressed="false">
    <span class="fx-card__inner">
      <span class="fx-card__face fx-card__face--front">Q</span>
      <span class="fx-card__face fx-card__face--back">A</span>
    </span>
  </button>
</main>
<script>
  var btn = document.querySelector(".fx-card");
  btn.addEventListener("click", function () {
    var open = btn.getAttribute("aria-pressed") === "true";
    btn.setAttribute("aria-pressed", String(!open));
    btn.classList.toggle("is-flipped", !open);
  });
</script>
</body>
</html>
