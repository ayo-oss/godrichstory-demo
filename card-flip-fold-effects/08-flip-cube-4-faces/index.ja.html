<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four-face cube — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cb-scene">
    <button type="button" class="cb-cube is-demo" aria-label="次の面を見る">
      <span class="cb-face cb-face--1">写真</span>
      <span class="cb-face cb-face--2">説明</span>
      <span class="cb-face cb-face--3">$29</span>
      <span class="cb-face cb-face--4">購入</span>
    </button>
  </div>
</main>
<script>
  var cube = document.querySelector(".cb-cube");
  var step = 0;
  cube.addEventListener("click", function () {
    step = (step + 1) % 4;
    cube.style.setProperty("--cb-step", String(step));
  });
</script>
</body>
</html>
