<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drum roller time picker — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="dr is-demo">
    <div class="dr__box">
      <span class="dr__band" aria-hidden="true"></span>
      <div class="dr__col" role="slider" tabindex="0" aria-label="時のドラム" data-vt="{v}時"
           aria-valuemin="1" aria-valuemax="12" aria-valuenow="9" aria-valuetext="9時">
        <div class="dr__track" data-track="h">
          <span class="dr__cell">01</span><span class="dr__cell">02</span><span class="dr__cell">03</span>
          <span class="dr__cell">04</span><span class="dr__cell">05</span><span class="dr__cell">06</span>
          <span class="dr__cell">07</span><span class="dr__cell">08</span><span class="dr__cell">09</span>
          <span class="dr__cell">10</span><span class="dr__cell">11</span><span class="dr__cell">12</span>
        </div>
      </div>
      <div class="dr__col" role="slider" tabindex="0" aria-label="分のドラム" data-vt="{v}分"
           aria-valuemin="0" aria-valuemax="55" aria-valuenow="30" aria-valuetext="30分">
        <div class="dr__track" data-track="m">
          <span class="dr__cell">00</span><span class="dr__cell">05</span><span class="dr__cell">10</span>
          <span class="dr__cell">15</span><span class="dr__cell">20</span><span class="dr__cell">25</span>
          <span class="dr__cell">30</span><span class="dr__cell">35</span><span class="dr__cell">40</span>
          <span class="dr__cell">45</span><span class="dr__cell">50</span><span class="dr__cell">55</span>
        </div>
      </div>
    </div>
    <p class="dr__out" data-fmt="午前{h}時{m}分">
      <span class="dr__ov" data-live>午前9時30分</span>
      <span class="dr__ov" data-v="2">午前11時35分</span>
      <span class="dr__ov" data-v="3">午前11時45分</span>
    </p>
  </div>
</main>
<script>
// 확정값은 스크롤 위치에서 읽는다. 사람이 굴리면 .is-demo 를 떼 트랙 transform 을 0 으로 되돌린다
(function () {
  var dr = document.querySelector('.dr');
  var cols = dr.querySelectorAll('.dr__col');
  var out = dr.querySelector('.dr__out'), live = dr.querySelector('[data-live]');
  var H = cols[0].querySelector('.dr__cell').getBoundingClientRect().height;
  var human = false, tid = 0;
  function at(c) { return Math.round(c.scrollTop / H); }
  function read() {
    var v = [];
    for (var i = 0; i < cols.length; i++) {
      var c = cols[i], el = c.querySelector('.dr__track').children[at(c)];
      var t = el ? el.textContent.trim() : '00';
      c.setAttribute('aria-valuenow', String(Number(t)));
      c.setAttribute('aria-valuetext', c.dataset.vt.replace('{v}', String(Number(t))));
      v.push(t);
    }
    live.textContent = out.dataset.fmt.replace('{h}', String(Number(v[0]))).replace('{m}', String(Number(v[1])));
  }
  function mark() { human = true; dr.classList.remove('is-demo'); }
  for (var i = 0; i < cols.length; i++) (function (c) {
    c.addEventListener('pointerdown', mark);
    c.addEventListener('wheel', mark, { passive: true });
    c.addEventListener('scroll', function () {
      if (!human) return;
      clearTimeout(tid); tid = setTimeout(read, 90);   // 스크롤이 멎은 뒤에 확정값을 읽는다
    });
    c.addEventListener('keydown', function (e) {
      var k = e.key, d = k === 'ArrowDown' ? 1 : k === 'ArrowUp' ? -1 : 0;
      if (!d && k !== 'Home' && k !== 'End') return;
      e.preventDefault(); mark();
      var n = c.querySelector('.dr__track').children.length;
      var j = k === 'Home' ? 0 : k === 'End' ? n - 1 : Math.min(n - 1, Math.max(0, at(c) + d));
      c.scrollTo({ top: j * H, behavior: 'smooth' });
    });
  })(cols[i]);
  cols[0].scrollTop = 8 * H;   // 09
  cols[1].scrollTop = 6 * H;   // 30
  read();
})();
</script>
</body>
</html>
