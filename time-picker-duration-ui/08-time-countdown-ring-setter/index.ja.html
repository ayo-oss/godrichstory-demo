<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown ring setter — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cd is-demo">
    <div class="cd__ring" id="cd-ring">
      <span class="cd__hole">
        <span class="cd__num" id="cd-num">05:00</span>
        <span class="cd__f" data-k="1">05:00</span>
        <span class="cd__f" data-k="2">03:45</span>
        <span class="cd__f" data-k="3">02:30</span>
      </span>
    </div>

    <div class="cd__side">
      <span class="cd__cap">タイマーの長さ</span>

      <div class="cd__field">
        <button class="cd__step" type="button" data-t="min" data-d="-1" aria-label="分を下げる"><svg viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></button>
        <span class="cd__val" role="spinbutton" tabindex="0" id="cd-min" data-t="min" aria-label="分" aria-valuemin="0" aria-valuemax="59" aria-valuenow="5" aria-valuetext="5分"><b class="cd__n" id="cd-min-n">05</b><i class="cd__u">分</i></span>
        <button class="cd__step" type="button" data-t="min" data-d="1" aria-label="分を上げる"><svg viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="M208 160H48l80-80Z" opacity=".2"/><path d="m213.66 154.34l-80-80a8 8 0 0 0-11.32 0l-80 80A8 8 0 0 0 48 168h160a8 8 0 0 0 5.66-13.66M67.31 152L128 91.31L188.69 152Z"/></g></svg></button>
      </div>

      <div class="cd__field">
        <button class="cd__step" type="button" data-t="sec" data-d="-1" aria-label="秒を下げる"><svg viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></button>
        <span class="cd__val" role="spinbutton" tabindex="0" id="cd-sec" data-t="sec" aria-label="秒" aria-valuemin="0" aria-valuemax="55" aria-valuenow="0" aria-valuetext="0秒"><b class="cd__n" id="cd-sec-n">00</b><i class="cd__u">秒</i></span>
        <button class="cd__step" type="button" data-t="sec" data-d="1" aria-label="秒を上げる"><svg viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="M208 160H48l80-80Z" opacity=".2"/><path d="m213.66 154.34l-80-80a8 8 0 0 0-11.32 0l-80 80A8 8 0 0 0 48 168h160a8 8 0 0 0 5.66-13.66M67.31 152L128 91.31L188.69 152Z"/></g></svg></button>
      </div>

      <button class="cd__go" type="button" id="cd-go">開始</button>
    </div>

    <span class="cd__tpl" data-k="min" hidden>{n}分</span>
    <span class="cd__tpl" data-k="sec" hidden>{n}秒</span>
  </div>
</main>
<script>
// 실제 동작: 分·秒 칸은 진짜 spinbutton 이라 ↑↓ 로 값이 오르내리고(分 1, 秒 5), 시작을 누르면
// 남은 비율이 --ring-angle 로 나간다. 이 커스텀 속성은 @property 로 등록돼 있어야 각도가 보간된다
var root = document.querySelector('.cd');
var ringEl = document.getElementById('cd-ring');
var num = document.getElementById('cd-num');
var V = { min: 5, sec: 0 }, STEP = { min: 1, sec: 5 }, MAX = { min: 59, sec: 55 };
var timer = null;
function pad(n) { return (n < 10 ? '0' : '') + n; }
function tpl(k, n) { return root.querySelector('.cd__tpl[data-k="' + k + '"]').textContent.replace('{n}', String(n)); }
function show(s) { num.textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
function ring(f) { ringEl.style.setProperty('--ring-angle', (360 * f).toFixed(1) + 'deg'); }
function stop() { if (timer) { clearInterval(timer); timer = null; } }
function paint() {
  ['min', 'sec'].forEach(function (k) {
    var el = document.getElementById('cd-' + k);
    el.setAttribute('aria-valuenow', String(V[k]));
    el.setAttribute('aria-valuetext', tpl(k, V[k]));       // 읽히는 값은 숫자가 아니라 사람 말이다
    document.getElementById('cd-' + k + '-n').textContent = pad(V[k]);
  });
  show(V.min * 60 + V.sec);
  ring(1);
}
function bump(k, d) {
  root.classList.remove('is-demo'); stop();
  V[k] = Math.max(0, Math.min(MAX[k], V[k] + d * STEP[k]));
  paint();
}
function start() {
  root.classList.remove('is-demo'); stop();
  var total = V.min * 60 + V.sec, left = total;
  if (!total) return;
  timer = setInterval(function () {
    left -= 1; show(left); ring(left / total);
    if (left <= 0) stop();
  }, 1000);
}
root.addEventListener('click', function (e) {
  var b = e.target.closest('.cd__step');
  if (b) { bump(b.getAttribute('data-t'), Number(b.getAttribute('data-d'))); return; }
  if (e.target.closest('.cd__go')) start();
});
root.addEventListener('keydown', function (e) {
  var s = e.target.closest('[role="spinbutton"]');
  if (!s) return;
  var k = s.getAttribute('data-t');
  var d = e.key === 'ArrowUp' ? 1 : e.key === 'ArrowDown' ? -1 : 0;
  if (d) { e.preventDefault(); bump(k, d); return; }
  if (e.key === 'Home' || e.key === 'End') {
    e.preventDefault(); root.classList.remove('is-demo'); stop();
    V[k] = e.key === 'Home' ? 0 : MAX[k]; paint();
  }
});
</script>
</body>
</html>
