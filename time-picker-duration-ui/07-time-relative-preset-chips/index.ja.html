<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relative preset chips — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="rp is-demo">
    <p class="rp__base"><span class="rp__baselab">基準時刻</span><time class="rp__basenum" datetime="14:40">14:40</time></p>

    <div class="rp__chips" role="group" aria-label="相対時間のプリセット">
      <button class="rp__chip" type="button" data-i="0" data-add="10" aria-pressed="true">10分後</button>
      <button class="rp__chip" type="button" data-i="1" data-add="60" aria-pressed="false">1時間後</button>
      <button class="rp__chip" type="button" data-i="2" data-at="1080" aria-pressed="false">今夜</button>
      <button class="rp__chip" type="button" data-i="3" data-at="1920" aria-pressed="false">明日の朝</button>
    </div>

    <div class="rp__out">
      <span class="rp__cap">
        <span class="rp__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="M216 136a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M128 40a96 96 0 1 0 96 96a96.11 96.11 0 0 0-96-96m0 176a80 80 0 1 1 80-80a80.09 80.09 0 0 1-80 80M61.66 37.66l-32 32a8 8 0 0 1-11.32-11.32l32-32a8 8 0 0 1 11.32 11.32m176 32a8 8 0 0 1-11.32 0l-32-32a8 8 0 0 1 11.32-11.32l32 32a8 8 0 0 1 0 11.32M184 128a8 8 0 0 1 0 16h-56a8 8 0 0 1-8-8V80a8 8 0 0 1 16 0v48Z"/></g></svg></span>
        <span class="rp__caplab">通知時刻</span>
      </span>
      <span class="rp__slot" id="rp-slot">
        <span class="rp__val rp__val--cur" id="rp-cur">今日 14:50</span>
        <span class="rp__val rp__val--nxt" id="rp-nxt"></span>
        <span class="rp__f" data-k="a">今日 14:50</span>
        <span class="rp__f" data-k="b">明日 08:00</span>
      </span>
    </div>

    <p class="rp__live" id="rp-live" aria-live="polite"></p>
    <span class="rp__tpl" data-day="0" hidden>今日 {t}</span>
    <span class="rp__tpl" data-day="1" hidden>明日 {t}</span>
  </div>
</main>
<script>
// 실제 동작: 칩마다 기준 시각에 더할 分(data-add)이나 절대 分(data-at)이 적혀 있고,
// 결과 시각은 그때그때 계산한다. 기준은 데모라 지금 시각이 아니라 코드 안 고정값이다.
var root = document.querySelector('.rp');
var cur = document.getElementById('rp-cur');
var nxt = document.getElementById('rp-nxt');
var slot = document.getElementById('rp-slot');
var live = document.getElementById('rp-live');
var chips = root.querySelectorAll('.rp__chip');
var BASE = 14 * 60 + 40;
function clock(m) {
  var day = m >= 1440 ? 1 : 0, t = m % 1440;
  var h = Math.floor(t / 60), i = t % 60;
  var tpl = root.querySelector('.rp__tpl[data-day="' + day + '"]').textContent;   // 말투는 HTML 에, 계산은 JS 에
  return tpl.replace('{t}', (h < 10 ? '0' : '') + h + ':' + (i < 10 ? '0' : '') + i);
}
function pick(btn) {
  root.classList.remove('is-demo');
  for (var k = 0; k < chips.length; k++) chips[k].setAttribute('aria-pressed', String(chips[k] === btn));
  var m = btn.hasAttribute('data-add') ? BASE + Number(btn.getAttribute('data-add')) : Number(btn.getAttribute('data-at'));
  var t = clock(m);
  live.textContent = t;
  if (t === cur.textContent) return;
  nxt.textContent = t;
  slot.classList.remove('is-roll');
  void slot.offsetWidth;                       // 같은 값이 아니면 언제나 한 번 더 굴러야 한다
  slot.classList.add('is-roll');
}
nxt.addEventListener('transitionend', function () {
  cur.textContent = nxt.textContent;           // 굴러 올라온 값이 確定 값이 된다
  slot.classList.remove('is-roll');
});
for (var i = 0; i < chips.length; i++) {
  chips[i].addEventListener('click', function (e) { pick(e.currentTarget); });
  chips[i].addEventListener('keydown', function (e) {
    var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    var j = (Array.prototype.indexOf.call(chips, e.currentTarget) + d + chips.length) % chips.length;
    chips[j].focus({ preventScroll: true });
    pick(chips[j]);
  });
}
</script>
</body>
</html>
