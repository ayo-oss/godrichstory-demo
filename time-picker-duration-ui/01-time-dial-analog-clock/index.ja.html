<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analog dial time picker — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="dl is-demo" data-stage="h">
    <div class="dl__dial" id="dl-dial" role="slider" tabindex="0"
         aria-label="時刻ダイヤル" aria-valuemin="1" aria-valuemax="12" aria-valuenow="9"
         aria-valuetext="午前9時30分" data-fmt="午前{h}時{m}分">
      <span class="dl__ring" data-ring="hour" aria-hidden="true">
        <span class="dl__tick" style="--i:1">1</span><span class="dl__tick" style="--i:2">2</span>
        <span class="dl__tick" style="--i:3">3</span><span class="dl__tick" style="--i:4">4</span>
        <span class="dl__tick" style="--i:5">5</span><span class="dl__tick" style="--i:6">6</span>
        <span class="dl__tick" style="--i:7">7</span><span class="dl__tick" style="--i:8">8</span>
        <span class="dl__tick" style="--i:9">9</span><span class="dl__tick" style="--i:10">10</span>
        <span class="dl__tick" style="--i:11">11</span><span class="dl__tick" style="--i:12">12</span>
      </span>
      <span class="dl__ring" data-ring="min" aria-hidden="true">
        <span class="dl__tick" style="--i:1">05</span><span class="dl__tick" style="--i:2">10</span>
        <span class="dl__tick" style="--i:3">15</span><span class="dl__tick" style="--i:4">20</span>
        <span class="dl__tick" style="--i:5">25</span><span class="dl__tick" style="--i:6">30</span>
        <span class="dl__tick" style="--i:7">35</span><span class="dl__tick" style="--i:8">40</span>
        <span class="dl__tick" style="--i:9">45</span><span class="dl__tick" style="--i:10">50</span>
        <span class="dl__tick" style="--i:11">55</span><span class="dl__tick" style="--i:12">00</span>
      </span>
      <span class="dl__hand" aria-hidden="true"><span class="dl__tip"></span></span>
      <span class="dl__read" aria-hidden="true">
        <span class="dl__val">
          <span class="dl__num">
            <span class="dl__d" data-live="h">09</span>
            <span class="dl__d" data-d="h10">10</span>
            <span class="dl__d" data-d="h11">11</span>
            <span class="dl__d" data-d="h12">12</span>
          </span>
          <span class="dl__sep">:</span>
          <span class="dl__num">
            <span class="dl__d" data-live="m">30</span>
            <span class="dl__d" data-d="m45">45</span>
            <span class="dl__d" data-d="m00">00</span>
          </span>
        </span>
        <span class="dl__step">
          <span class="dl__sv" data-live="s" data-h="時を選択" data-m="分を選択">時を選択</span>
          <span class="dl__sv" data-s="m">分を選択</span>
        </span>
      </span>
    </div>
  </div>
</main>
<script>
// 각도 → 값은 Math.atan2 로 실제 계산한다. 시를 확정하면 같은 바늘이 分 눈금을 맡는다
(function () {
  var dl = document.querySelector('.dl'), dial = document.getElementById('dl-dial');
  var hv = dl.querySelector('[data-live="h"]'), mv = dl.querySelector('[data-live="m"]');
  var sv = dl.querySelector('[data-live="s"]');
  var s = { h: 9, m: 30, hour: true };
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function paint() {
    dl.setAttribute('data-stage', s.hour ? 'h' : 'm');
    dial.style.setProperty('--ang', (s.hour ? s.h * 30 : s.m * 6) + 'deg');
    hv.textContent = pad(s.h); mv.textContent = pad(s.m);
    sv.textContent = s.hour ? sv.dataset.h : sv.dataset.m;
    dial.setAttribute('aria-valuemin', s.hour ? '1' : '0');
    dial.setAttribute('aria-valuemax', s.hour ? '12' : '55');
    dial.setAttribute('aria-valuenow', String(s.hour ? s.h : s.m));
    dial.setAttribute('aria-valuetext', dial.dataset.fmt.replace('{h}', s.h).replace('{m}', s.m));
  }
  function fromPointer(e) {
    var r = dial.getBoundingClientRect();
    var a = Math.atan2(e.clientX - r.left - r.width / 2, r.top + r.height / 2 - e.clientY) * 180 / Math.PI;
    a = (a + 360) % 360;
    if (s.hour) { s.h = Math.round(a / 30) || 12; } else { s.m = (Math.round(a / 30) * 5) % 60; }
    paint();
  }
  dial.addEventListener('pointerdown', function (e) {
    dl.classList.remove('is-demo'); dial.setPointerCapture(e.pointerId);
    dial.dataset.drag = '1'; fromPointer(e); e.preventDefault();
  });
  dial.addEventListener('pointermove', function (e) { if (dial.dataset.drag) fromPointer(e); });
  dial.addEventListener('pointerup', function () {
    if (!dial.dataset.drag) return;
    delete dial.dataset.drag;
    if (s.hour) { s.hour = false; paint(); }   // 시가 확정되면 판이 分 눈금으로 갈린다
  });
  dial.addEventListener('keydown', function (e) {
    var k = e.key, d = (k === 'ArrowRight' || k === 'ArrowUp') ? 1 : (k === 'ArrowLeft' || k === 'ArrowDown') ? -1 : 0;
    var jump = k === 'Home' || k === 'End', turn = k === 'Enter' || k === ' ';
    if (!d && !jump && !turn) return;
    e.preventDefault(); dl.classList.remove('is-demo');
    if (turn) { s.hour = !s.hour; }
    else if (s.hour) { s.h = k === 'Home' ? 1 : k === 'End' ? 12 : ((s.h - 1 + d + 12) % 12) + 1; }
    else { s.m = k === 'Home' ? 0 : k === 'End' ? 55 : (s.m + d * 5 + 60) % 60; }
    paint();
  });
  paint();
})();
</script>
</body>
</html>
