<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking slot grid — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sg is-demo">
    <div class="sg__grid" id="sg-grid" role="group" aria-label="Booking time slots">
      <button class="sg__slot" type="button" aria-pressed="false" data-t="09:00" style="--i:0">09:00</button>
      <button class="sg__slot" type="button" disabled data-t="09:30" style="--i:1">09:30<span class="sg__sr">Full</span></button>
      <button class="sg__slot" type="button" aria-pressed="false" data-t="10:00" style="--i:2">10:00</button>
      <button class="sg__slot" type="button" aria-pressed="false" data-t="10:30" style="--i:3">10:30</button>
      <button class="sg__slot" type="button" disabled data-t="11:00" style="--i:4">11:00<span class="sg__sr">Full</span></button>
      <button class="sg__slot" type="button" aria-pressed="false" data-t="11:30" data-pick style="--i:5">11:30</button>
      <button class="sg__slot" type="button" aria-pressed="false" data-t="12:00" style="--i:6">12:00</button>
      <button class="sg__slot" type="button" aria-pressed="false" data-t="12:30" style="--i:7">12:30</button>
      <button class="sg__slot" type="button" disabled data-t="13:00" style="--i:8">13:00<span class="sg__sr">Full</span></button>
      <button class="sg__slot" type="button" aria-pressed="false" data-t="13:30" style="--i:9">13:30</button>
      <button class="sg__slot" type="button" disabled data-t="14:00" style="--i:10">14:00<span class="sg__sr">Full</span></button>
      <button class="sg__slot" type="button" aria-pressed="false" data-t="14:30" style="--i:11">14:30</button>
    </div>
    <p class="sg__out" data-fmt="{t} booked" aria-live="polite">
      <span class="sg__badge">
        <svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0M232 128A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></svg>Confirmed</span>
      <span class="sg__box">
        <span class="sg__txt" data-live>Pick a time</span>
        <span class="sg__txt" data-v="2">11:30 booked</span>
      </span>
    </p>
  </div>
</main>
<script>
// 찬 자리는 진짜 disabled 라 눌러도 아무 일이 없다. 고른 칸은 aria-pressed 한 곳에만 적힌다
(function () {
  var sg = document.querySelector('.sg'), grid = document.getElementById('sg-grid');
  var out = sg.querySelector('.sg__out'), live = sg.querySelector('[data-live]');
  var slots = [].slice.call(grid.querySelectorAll('.sg__slot'));
  function pick(b) {
    sg.classList.remove('is-demo');
    slots.forEach(function (s) { if (!s.disabled) s.setAttribute('aria-pressed', String(s === b)); });
    sg.classList.add('is-picked');
    live.textContent = out.dataset.fmt.replace('{t}', b.dataset.t);
  }
  slots.forEach(function (s) { s.addEventListener('click', function () { pick(s); }); });
  grid.addEventListener('keydown', function (e) {
    var cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
    var step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
    var jump = e.key === 'Home' || e.key === 'End';
    if (!step && !jump) return;
    var k = slots.indexOf(document.activeElement);
    if (k < 0) return;
    e.preventDefault();
    var d = jump ? (e.key === 'Home' ? -1 : 1) : (step > 0 ? 1 : -1);
    var j = jump ? (e.key === 'Home' ? 0 : slots.length - 1) : k + step;
    while (j >= 0 && j < slots.length && slots[j].disabled) j += d;   // 찬 자리는 건너뛴다
    if (j >= 0 && j < slots.length) slots[j].focus({ preventScroll: true });
  });
})();
</script>
</body>
</html>
