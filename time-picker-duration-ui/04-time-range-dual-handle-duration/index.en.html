<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dual handle time range — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="rg is-demo">
    <div class="rg__head">
      <span class="rg__cut" data-k="1"><span class="rg__val">9:30 AM – 6:00 PM</span><span class="rg__len">8 hr 30 min</span></span>
      <span class="rg__cut" data-k="2" aria-hidden="true"><span class="rg__val">5:30 PM – 6:30 PM</span><span class="rg__len">1 hr</span></span>
      <span class="rg__cut" data-k="3" aria-hidden="true"><span class="rg__val">7:30 PM – 8:30 PM</span><span class="rg__len">1 hr</span></span>
    </div>
    <div class="rg__body">
      <div class="rg__axis" id="rg-axis">
        <div class="rg__rail" aria-hidden="true"><div class="rg__fill"></div></div>
        <button class="rg__band" id="rg-band" type="button" aria-label="Move the whole span"></button>
        <div class="rg__h rg__h--a">
          <span class="rg__knob" id="rg-a" role="slider" tabindex="0"
                aria-label="Start time" aria-valuemin="0" aria-valuemax="1440"
                aria-valuenow="570" aria-valuetext="9:30 AM"></span>
        </div>
        <div class="rg__h rg__h--b">
          <span class="rg__knob" id="rg-b" role="slider" tabindex="0"
                aria-label="End time" aria-valuemin="0" aria-valuemax="1440"
                aria-valuenow="1080" aria-valuetext="6 PM"></span>
        </div>
      </div>
      <div class="rg__ticks" aria-hidden="true">
        <span>0:00</span><span>6:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
      </div>
    </div>
  </div>
</main>
<script>
(function () {
  var root = document.querySelector('.rg'), axis = document.getElementById('rg-axis');
  var K = [document.getElementById('rg-a'), document.getElementById('rg-b')];
  var band = document.getElementById('rg-band');
  var cut = root.querySelector('.rg__cut[data-k="1"]');
  var val = cut.querySelector('.rg__val'), len = cut.querySelector('.rg__len');
  var v = [38, 72], MIN = 4, drag = null, st = 0, sv = [0, 0];   // 15min 한 칸, 최소 간격 1 hr
  function fmt(t, k) {
    var h = (t / 4 | 0) % 24, m = (t % 4) * 15, ap = h < 12 ? 'AM' : 'PM', hh = h % 12 || 12;
    return k ? ap + ' ' + hh + ' o\'clock' + (m ? ' ' + m + 'min' : '')
             : ap + ' ' + hh + ':' + (m < 10 ? '0' : '') + m;
  }
  function draw() {
    root.style.setProperty('--a', v[0] / 96);
    root.style.setProperty('--b', v[1] / 96);
    root.style.setProperty('--len', (v[1] - v[0]) / 96);
    for (var i = 0; i < 2; i++) {
      K[i].setAttribute('aria-valuenow', v[i] * 15);
      K[i].setAttribute('aria-valuetext', fmt(v[i], 1));
    }
    val.textContent = fmt(v[0]) + ' – ' + fmt(v[1]);
    var d = (v[1] - v[0]) * 15, H = d / 60 | 0, M = d % 60;
    len.textContent = (H ? H + ' hr' : '') + (M ? (H ? ' ' : '') + M + 'min' : '');
  }
  // 값이 뒤집히지 않는다 — 최소 간격 안으로 들어오면 상대 손잡이를 밀어낸다
  function set(i, t) {
    t = Math.min(Math.max(t, 0), 96);
    if (i) { v[1] = Math.max(t, MIN); if (v[1] - v[0] < MIN) v[0] = v[1] - MIN; }
    else { v[0] = Math.min(t, 96 - MIN); if (v[1] - v[0] < MIN) v[1] = v[0] + MIN; }
    draw();
  }
  function shift(a) { var L = sv[1] - sv[0]; a = Math.min(Math.max(a, 0), 96 - L); v[0] = a; v[1] = a + L; draw(); }
  function at(e) { var r = axis.getBoundingClientRect(); return Math.round((e.clientX - r.left) / r.width * 96); }
  function key(e, i) {
    var s = e.key === 'ArrowRight' || e.key === 'ArrowUp' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -1 : 0;
    if (!s && e.key !== 'Home' && e.key !== 'End') return;
    root.classList.remove('is-demo'); e.preventDefault(); sv = [v[0], v[1]];
    if (i === 2) shift(v[0] + (e.key === 'Home' ? -96 : e.key === 'End' ? 96 : s));
    else set(i, e.key === 'Home' ? 0 : e.key === 'End' ? 96 : v[i] + s);
  }
  [K[0], K[1], band].forEach(function (el, i) {
    el.addEventListener('pointerdown', function (e) {
      root.classList.remove('is-demo'); drag = i; st = at(e); sv = [v[0], v[1]];
      el.setPointerCapture(e.pointerId); el.focus({ preventScroll: true }); e.preventDefault();
    });
    el.addEventListener('keydown', function (e) { key(e, i); });
  });
  document.addEventListener('pointermove', function (e) {
    if (drag === null) return;
    var d = at(e) - st;
    if (drag === 2) shift(sv[0] + d); else set(drag, sv[drag] + d);
  });
  document.addEventListener('pointerup', function () { drag = null; });
  draw();
})();
</script>
</body>
</html>
