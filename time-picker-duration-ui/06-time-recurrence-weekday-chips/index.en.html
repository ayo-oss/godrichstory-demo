<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recurrence weekday chips — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="rc is-demo">
    <div class="rc__seg" id="rc-seg" data-m="w" role="radiogroup" aria-label="Repeat cycle">
      <span class="rc__ind" aria-hidden="true"></span>
      <button class="rc__opt" type="button" role="radio" aria-checked="true" data-m="w">Weekly</button>
      <button class="rc__opt" type="button" role="radio" aria-checked="false" data-m="m">Monthly</button>
    </div>

    <div class="rc__days" role="group" aria-label="Repeat days">
      <button class="rc__chip" type="button" role="checkbox" aria-checked="false" aria-label="Sunday" data-w="0">Su</button>
      <button class="rc__chip" type="button" role="checkbox" aria-checked="true"  aria-label="Monday" data-w="1">Mo</button>
      <button class="rc__chip" type="button" role="checkbox" aria-checked="false" aria-label="Tuesday" data-w="2">Tu</button>
      <button class="rc__chip" type="button" role="checkbox" aria-checked="true"  aria-label="Wednesday" data-w="3">We</button>
      <button class="rc__chip" type="button" role="checkbox" aria-checked="false" aria-label="Thursday" data-w="4">Th</button>
      <button class="rc__chip" type="button" role="checkbox" aria-checked="true"  aria-label="Friday" data-w="5">Fr</button>
      <button class="rc__chip" type="button" role="checkbox" aria-checked="false" aria-label="Saturday" data-w="6">Sa</button>
    </div>

    <p class="rc__sum" aria-live="polite">
      <span class="rc__cut" data-k="1">Weekly on Mon, Wed, Fri at 9:00 AM</span>
      <span class="rc__cut" data-k="2" aria-hidden="true">Weekly on Mon, Wed, Thu, Fri at 9:00 AM</span>
      <span class="rc__cut" data-k="3" aria-hidden="true">Weekly on Mon, Tue, Wed, Thu, Fri at 9:00 AM</span>
      <span class="rc__cut" data-k="4" aria-hidden="true">Monthly on the 2nd Monday at 9:00 AM</span>
    </p>
  </div>
</main>
<script>
(function () {
  var root = document.querySelector('.rc'), seg = document.getElementById('rc-seg');
  var sum = root.querySelector('.rc__cut[data-k="1"]');
  var opts = [].slice.call(root.querySelectorAll('.rc__opt'));
  var chips = [].slice.call(root.querySelectorAll('.rc__chip'));
  var SH = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
  var OR = ['1st', '2nd', '3rd', '4th', '5th'];
  function on(c) { return c.getAttribute('aria-checked') === 'true'; }
  // Monthly 모드의 몇째 주는 실제로 센다 — 기준일에서 그 요일이 처음 오는 날짜로 주차를 구한다
  function ord(w) {
    var d = new Date(2026, 8, 12);
    d.setDate(d.getDate() + ((w - d.getDay() + 7) % 7));
    return OR[Math.ceil(d.getDate() / 7) - 1];
  }
  function render() {
    var m = seg.dataset.m, p = chips.filter(on).map(function (c) { return +c.dataset.w; });
    if (!p.length) { sum.textContent = m === 'm' ? 'No monthly repeat' : 'No weekly repeat'; return; }
    sum.textContent = m === 'm'
      ? 'Monthly ' + ord(p[0]) + ' week ' + SH[p[0]] + ' at 9:00 AM'
      : p.length === 1
        ? 'Weekly ' + SH[p[0]] + ' at 9:00 AM'
        : 'Weekly ' + p.map(function (w) { return SH[w]; }).join('·') + ' 9:00 AM';
  }
  function wake() { root.classList.remove('is-demo'); }
  chips.forEach(function (c) {
    c.addEventListener('click', function () { wake(); c.setAttribute('aria-checked', String(!on(c))); render(); });
  });
  opts.forEach(function (o) {
    o.addEventListener('click', function () {
      wake();
      opts.forEach(function (x) { x.setAttribute('aria-checked', String(x === o)); });
      seg.dataset.m = o.dataset.m; render();
    });
  });
  seg.addEventListener('keydown', function (e) {
    var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!d) return;
    e.preventDefault(); wake();
    var i = (opts.indexOf(document.activeElement) + d + 2) % 2;
    opts[i].focus({ preventScroll: true }); opts[i].click();
  });
  root.querySelector('.rc__days').addEventListener('keydown', function (e) {
    var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    var i = (chips.indexOf(document.activeElement) + d + 7) % 7;
    chips[i].focus({ preventScroll: true });
  });
  render();
})();
</script>
</body>
</html>
