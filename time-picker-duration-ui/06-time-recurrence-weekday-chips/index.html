<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recurrence weekday chips — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="rc is-demo">
    <div class="rc__seg" id="rc-seg" data-m="w" role="radiogroup" aria-label="반복 주기">
      <span class="rc__ind" aria-hidden="true"></span>
      <button class="rc__opt" type="button" role="radio" aria-checked="true" data-m="w">매주</button>
      <button class="rc__opt" type="button" role="radio" aria-checked="false" data-m="m">매월</button>
    </div>

    <div class="rc__days" role="group" aria-label="반복 요일">
      <button class="rc__chip" type="button" role="checkbox" aria-checked="false" aria-label="일요일" data-w="0">일</button>
      <button class="rc__chip" type="button" role="checkbox" aria-checked="true"  aria-label="월요일" data-w="1">월</button>
      <button class="rc__chip" type="button" role="checkbox" aria-checked="false" aria-label="화요일" data-w="2">화</button>
      <button class="rc__chip" type="button" role="checkbox" aria-checked="true"  aria-label="수요일" data-w="3">수</button>
      <button class="rc__chip" type="button" role="checkbox" aria-checked="false" aria-label="목요일" data-w="4">목</button>
      <button class="rc__chip" type="button" role="checkbox" aria-checked="true"  aria-label="금요일" data-w="5">금</button>
      <button class="rc__chip" type="button" role="checkbox" aria-checked="false" aria-label="토요일" data-w="6">토</button>
    </div>

    <p class="rc__sum" aria-live="polite">
      <span class="rc__cut" data-k="1">매주 월·수·금 오전 9시</span>
      <span class="rc__cut" data-k="2" aria-hidden="true">매주 월·수·목·금 오전 9시</span>
      <span class="rc__cut" data-k="3" aria-hidden="true">매주 월·화·수·목·금 오전 9시</span>
      <span class="rc__cut" data-k="4" aria-hidden="true">매월 둘째 주 월요일 오전 9시</span>
    </p>
  </div>
</main>
<script>
(function () {
  var root = document.querySelector('.rc'), seg = document.getElementById('rc-seg');
  var sum = root.querySelector('.rc__cut[data-k="1"]');
  var opts = [].slice.call(root.querySelectorAll('.rc__opt'));
  var chips = [].slice.call(root.querySelectorAll('.rc__chip'));
  var SH = ['일', '월', '화', '수', '목', '금', '토'];
  var OR = ['첫째', '둘째', '셋째', '넷째', '다섯째'];
  function on(c) { return c.getAttribute('aria-checked') === 'true'; }
  // 매월 모드의 몇째 주는 실제로 센다 — 기준일에서 그 요일이 처음 오는 날짜로 주차를 구한다
  function ord(w) {
    var d = new Date(2026, 8, 12);
    d.setDate(d.getDate() + ((w - d.getDay() + 7) % 7));
    return OR[Math.ceil(d.getDate() / 7) - 1];
  }
  function render() {
    var m = seg.dataset.m, p = chips.filter(on).map(function (c) { return +c.dataset.w; });
    if (!p.length) { sum.textContent = m === 'm' ? '매월 반복 없음' : '매주 반복 없음'; return; }
    sum.textContent = m === 'm'
      ? '매월 ' + ord(p[0]) + ' 주 ' + SH[p[0]] + '요일 오전 9시'
      : p.length === 1
        ? '매주 ' + SH[p[0]] + '요일 오전 9시'
        : '매주 ' + p.map(function (w) { return SH[w]; }).join('·') + ' 오전 9시';
  }
  function wake() { root.classList.remove('is-demo'); }
  chips.forEach(function (c) {
    c.addEventListener('click', function () { wake(); c.setAttribute('aria-checked', String(!on(c))); render(); });
  });
  opts.forEach(function (o) {
    o.addEventListener('click', function () {
      wake();
      opts.forEach(function (x) { x.setAttribute('aria-checked', String(x === o)); });
      seg.dataset.m = o.dataset.m; render();
    });
  });
  seg.addEventListener('keydown', function (e) {
    var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!d) return;
    e.preventDefault(); wake();
    var i = (opts.indexOf(document.activeElement) + d + 2) % 2;
    opts[i].focus({ preventScroll: true }); opts[i].click();
  });
  root.querySelector('.rc__days').addEventListener('keydown', function (e) {
    var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    var i = (chips.indexOf(document.activeElement) + d + 7) % 7;
    chips[i].focus({ preventScroll: true });
  });
  render();
})();
</script>
</body>
</html>
