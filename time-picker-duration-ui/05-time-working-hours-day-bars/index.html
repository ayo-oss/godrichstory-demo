<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Working hours day bars — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="wh is-demo">
    <div class="wh__scale" aria-hidden="true">
      <span class="wh__pad"></span>
      <span class="wh__marks"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></span>
      <span class="wh__pad"></span>
    </div>

    <div class="wh__row" data-d="mon" data-s="18" data-e="36" style="--s:.375;--e:.75">
      <span class="wh__day"><span class="wh__full" id="wh-d1">월요일</span><span class="wh__ab" aria-hidden="true">월</span></span>
      <div class="wh__axis" role="group" aria-labelledby="wh-d1">
        <span class="wh__rail" aria-hidden="true"></span>
        <span class="wh__pos" aria-hidden="true"><span class="wh__bar"></span></span>
        <span class="wh__h wh__h--s"><span class="wh__grip" role="slider" tabindex="0" aria-label="시작" aria-valuemin="0" aria-valuemax="1440" aria-valuenow="540" aria-valuetext="09:00"></span></span>
        <span class="wh__h wh__h--e"><span class="wh__grip" role="slider" tabindex="0" aria-label="종료" aria-valuemin="0" aria-valuemax="1440" aria-valuenow="1080" aria-valuetext="18:00"></span></span>
      </div>
      <span class="wh__read"><span data-k="1">09:00–18:00</span></span>
    </div>

    <div class="wh__row" data-d="tue" data-s="18" data-e="36" style="--s:.375;--e:.75">
      <span class="wh__day"><span class="wh__full" id="wh-d2">화요일</span><span class="wh__ab" aria-hidden="true">화</span></span>
      <div class="wh__axis" role="group" aria-labelledby="wh-d2">
        <span class="wh__rail" aria-hidden="true"></span>
        <span class="wh__pos" aria-hidden="true"><span class="wh__bar"></span></span>
        <span class="wh__h wh__h--s"><span class="wh__grip" role="slider" tabindex="0" aria-label="시작" aria-valuemin="0" aria-valuemax="1440" aria-valuenow="540" aria-valuetext="09:00"></span></span>
        <span class="wh__h wh__h--e"><span class="wh__grip" role="slider" tabindex="0" aria-label="종료" aria-valuemin="0" aria-valuemax="1440" aria-valuenow="1080" aria-valuetext="18:00"></span></span>
      </div>
      <span class="wh__read"><span data-k="1">09:00–18:00</span></span>
    </div>

    <div class="wh__row" data-d="wed" data-s="20" data-e="38" style="--s:.41667;--e:.79167">
      <span class="wh__day"><span class="wh__full" id="wh-d3">수요일</span><span class="wh__ab" aria-hidden="true">수</span></span>
      <div class="wh__axis" role="group" aria-labelledby="wh-d3">
        <span class="wh__rail" aria-hidden="true"></span>
        <span class="wh__pos" aria-hidden="true"><span class="wh__bar"></span></span>
        <span class="wh__h wh__h--s"><span class="wh__grip" role="slider" tabindex="0" aria-label="시작" aria-valuemin="0" aria-valuemax="1440" aria-valuenow="600" aria-valuetext="10:00"></span></span>
        <span class="wh__h wh__h--e"><span class="wh__grip" role="slider" tabindex="0" aria-label="종료" aria-valuemin="0" aria-valuemax="1440" aria-valuenow="1140" aria-valuetext="19:00"></span></span>
      </div>
      <span class="wh__read"><span data-k="1">10:00–19:00</span><span data-k="2" aria-hidden="true">10:00–22:00</span></span>
    </div>

    <div class="wh__row" data-d="thu" data-s="18" data-e="35" style="--s:.375;--e:.72917">
      <span class="wh__day"><span class="wh__full" id="wh-d4">목요일</span><span class="wh__ab" aria-hidden="true">목</span></span>
      <div class="wh__axis" role="group" aria-labelledby="wh-d4">
        <span class="wh__rail" aria-hidden="true"></span>
        <span class="wh__pos" aria-hidden="true"><span class="wh__bar"></span></span>
        <span class="wh__h wh__h--s"><span class="wh__grip" role="slider" tabindex="0" aria-label="시작" aria-valuemin="0" aria-valuemax="1440" aria-valuenow="540" aria-valuetext="09:00"></span></span>
        <span class="wh__h wh__h--e"><span class="wh__grip" role="slider" tabindex="0" aria-label="종료" aria-valuemin="0" aria-valuemax="1440" aria-valuenow="1050" aria-valuetext="17:30"></span></span>
      </div>
      <span class="wh__read"><span data-k="1">09:00–17:30</span></span>
    </div>

    <div class="wh__row" data-d="fri" data-s="18" data-e="32" style="--s:.375;--e:.66667">
      <span class="wh__day"><span class="wh__full" id="wh-d5">금요일</span><span class="wh__ab" aria-hidden="true">금</span></span>
      <div class="wh__axis" role="group" aria-labelledby="wh-d5">
        <span class="wh__rail" aria-hidden="true"></span>
        <span class="wh__pos" aria-hidden="true"><span class="wh__bar"></span></span>
        <span class="wh__h wh__h--s"><span class="wh__grip" role="slider" tabindex="0" aria-label="시작" aria-valuemin="0" aria-valuemax="1440" aria-valuenow="540" aria-valuetext="09:00"></span></span>
        <span class="wh__h wh__h--e"><span class="wh__grip" role="slider" tabindex="0" aria-label="종료" aria-valuemin="0" aria-valuemax="1440" aria-valuenow="960" aria-valuetext="16:00"></span></span>
      </div>
      <span class="wh__read"><span data-k="1">09:00–16:00</span></span>
    </div>
  </div>
</main>
<script>
(function () {
  var root = document.querySelector('.wh');
  var rows = [].slice.call(root.querySelectorAll('.wh__row'));
  var drag = null;
  function clamp(x, lo, hi) { return Math.min(Math.max(x, lo), hi); }      // 축 밖으로 못 나간다
  function fmt(t) { var h = t / 2 | 0; return (h < 10 ? '0' : '') + h + ':' + (t % 2 ? '30' : '00'); }
  function draw(r) {
    var s = +r.dataset.s, e = +r.dataset.e, g = r.querySelectorAll('.wh__grip');
    r.style.setProperty('--s', s / 48); r.style.setProperty('--e', e / 48);
    g[0].setAttribute('aria-valuenow', s * 30); g[0].setAttribute('aria-valuetext', fmt(s));
    g[1].setAttribute('aria-valuenow', e * 30); g[1].setAttribute('aria-valuetext', fmt(e));
    r.querySelector('.wh__read [data-k="1"]').textContent = fmt(s) + '–' + fmt(e);
  }
  function set(r, i, t) {                                                  // 30분 한 칸
    if (i) r.dataset.e = clamp(t, +r.dataset.s + 1, 48);
    else r.dataset.s = clamp(t, 0, +r.dataset.e - 1);
    draw(r);
  }
  function at(r, e) {
    var b = r.querySelector('.wh__axis').getBoundingClientRect();
    return Math.round((e.clientX - b.left) / b.width * 48);
  }
  function grip(e) { return e.target.closest ? e.target.closest('.wh__grip') : null; }
  function side(g) { return g.parentNode.classList.contains('wh__h--e') ? 1 : 0; }
  root.addEventListener('pointerdown', function (e) {
    var g = grip(e); if (!g) return;
    root.classList.remove('is-demo');
    drag = { r: g.closest('.wh__row'), i: side(g) };
    g.setPointerCapture(e.pointerId); g.focus({ preventScroll: true }); e.preventDefault();
  });
  root.addEventListener('pointermove', function (e) { if (drag) set(drag.r, drag.i, at(drag.r, e)); });
  root.addEventListener('pointerup', function () { drag = null; });
  root.addEventListener('keydown', function (e) {
    var g = grip(e); if (!g) return;
    var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!d && e.key !== 'Home' && e.key !== 'End') return;
    root.classList.remove('is-demo'); e.preventDefault();
    var r = g.closest('.wh__row'), i = side(g);
    set(r, i, e.key === 'Home' ? 0 : e.key === 'End' ? 48 : (i ? +r.dataset.e : +r.dataset.s) + d);
  });
  rows.forEach(draw);
})();
</script>
</body>
</html>
