<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>편집 상태 값 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<table class="tie is-demo" id="tie">
  <tbody>
    <tr class="tie__row">
      <td class="tie__label">상품 A</td>
      <td class="tie__editcell" id="tieCell0">
        <span class="tie__box" id="tieBox0"></span>
        <span class="tie__text" id="tieText0">12</span>
        <input class="tie__input" id="tieInput0" type="text" value="12">
      </td>
    </tr>
    <tr class="tie__row">
      <td class="tie__label">상품 B</td>
      <td class="tie__editcell" id="tieCell1">
        <span class="tie__box" id="tieBox1"></span>
        <span class="tie__text" id="tieText1">7</span>
        <input class="tie__input" id="tieInput1" type="text" value="7">
      </td>
    </tr>
    <tr class="tie__row">
      <td class="tie__label">상품 C</td>
      <td class="tie__editcell" id="tieCell2">
        <span class="tie__box" id="tieBox2"></span>
        <span class="tie__text" id="tieText2">30</span>
        <input class="tie__input" id="tieInput2" type="text" value="30">
      </td>
    </tr>
  </tbody>
</table>
<script>
(function () {
  var root = document.getElementById('tie');

  // 상수: 모프 보간 속도 · 자동 루프 간격
  var LERP = 0.25;
  var AUTO_TOGGLE_MS = 1200;

  var cells = [0, 1, 2].map(function (i) {
    return {
      cell: document.getElementById('tieCell' + i),
      box: document.getElementById('tieBox' + i),
      text: document.getElementById('tieText' + i),
      input: document.getElementById('tieInput' + i),
      editing: false,
      prog: 0
    };
  });

  // 계산 겹: 문구 값의 자연 크기와 입력 칸 값의 자연 크기를 실측(offsetWidth/Height)해
  // 편집 상태 값의 진행도(prog)만큼 두 크기 사이를 보간한 박스를 그린다
  function measure(c) {
    var tr = c.text.getBoundingClientRect();
    var ir = c.input.getBoundingClientRect();
    var pr = c.cell.getBoundingClientRect();
    return {
      textRect: { l: tr.left - pr.left, t: tr.top - pr.top, w: tr.width, h: tr.height },
      inputRect: { l: ir.left - pr.left, t: ir.top - pr.top, w: ir.width, h: ir.height }
    };
  }

  function tick() {
    cells.forEach(function (c) {
      var target = c.editing ? 1 : 0;
      c.prog += (target - c.prog) * LERP;
      if (Math.abs(target - c.prog) < 0.01) c.prog = target;
      var m = measure(c);
      var t = m.textRect, i = m.inputRect;
      var l = t.l + (i.l - t.l) * c.prog;
      var top = t.t + (i.t - t.t) * c.prog;
      var w = t.w + (i.w - t.w) * c.prog;
      var h = t.h + (i.h - t.h) * c.prog;
      c.box.style.transform = 'translate(' + l.toFixed(1) + 'px,' + top.toFixed(1) + 'px)';
      c.box.style.width = w.toFixed(1) + 'px';
      c.box.style.height = h.toFixed(1) + 'px';
      c.text.style.opacity = (1 - c.prog).toFixed(2);
      c.input.style.opacity = c.prog.toFixed(2);
      c.input.style.pointerEvents = c.prog > 0.6 ? 'auto' : 'none';
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  cells.forEach(function (c) {
    c.cell.addEventListener('click', function (e) {
      if (c.editing) return;
      root.classList.remove('is-demo');
      c.editing = true;
    });
    c.input.addEventListener('blur', function () { c.editing = false; });
    c.input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') c.input.blur();
    });
  });

  // 자동 루프: 편집 상태 값을 순서대로 켜고 끈다
  var autoI = 0;
  function autoStep() {
    if (root.classList.contains('is-demo')) {
      var c = cells[autoI % cells.length];
      c.editing = !c.editing;
    }
    autoI++;
    setTimeout(autoStep, AUTO_TOGGLE_MS);
  }
  setTimeout(autoStep, AUTO_TOGGLE_MS);
})();
</script>
</main>
</body>
</html>
