<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행 확장 값 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<table class="tre is-demo" id="tre">
  <tbody>
    <tr class="tre__row" data-idx="0" id="treRow0">
      <td class="tre__cell">주문 A</td>
      <td class="tre__cell tre__cell--num">32,000</td>
    </tr>
    <tr class="tre__detail-row" id="treDetailRow0">
      <td colspan="2">
        <div class="tre__detail" id="treDetail0">배송지 서울 · 결제 카드</div>
      </td>
    </tr>
    <tr class="tre__row" data-idx="1" id="treRow1">
      <td class="tre__cell">주문 B</td>
      <td class="tre__cell tre__cell--num">18,500</td>
    </tr>
    <tr class="tre__detail-row" id="treDetailRow1">
      <td colspan="2">
        <div class="tre__detail" id="treDetail1">배송지 부산 · 결제 계좌</div>
      </td>
    </tr>
    <tr class="tre__row" data-idx="2" id="treRow2">
      <td class="tre__cell">주문 C</td>
      <td class="tre__cell tre__cell--num">7,200</td>
    </tr>
    <tr class="tre__detail-row" id="treDetailRow2">
      <td colspan="2">
        <div class="tre__detail" id="treDetail2">배송지 대전 · 결제 카드</div>
      </td>
    </tr>
  </tbody>
</table>
<script>
(function () {
  var root = document.getElementById('tre');
  var rows = [0, 1, 2].map(function (i) { return document.getElementById('treRow' + i); });
  var details = [0, 1, 2].map(function (i) { return document.getElementById('treDetail' + i); });

  // 상수: 상세 영역 진입 상한(px, 넉넉히 잡고 실측 scrollHeight 로 대체) · 보간 속도 · 자동 루프 간격
  var MAX_H = 80;
  var LERP = 0.22;
  var AUTO_TOGGLE_MS = 1100;

  var openIdx = [false, false, false];
  var h = [0, 0, 0]; // 각 상세 영역의 현재(보간 중) 높이값
  var target = [0, 0, 0];

  // 계산 겹: 열림 값이 바뀌면 목표 높이를 그 행의 실측 scrollHeight 로 다시 잰다
  function retarget(i) {
    if (openIdx[i]) {
      details[i].style.height = 'auto';
      var natural = Math.min(MAX_H, details[i].scrollHeight);
      details[i].style.height = h[i].toFixed(1) + 'px';
      target[i] = natural;
    } else {
      target[i] = 0;
    }
  }

  function tick() {
    for (var i = 0; i < 3; i++) {
      h[i] += (target[i] - h[i]) * LERP;
      if (Math.abs(target[i] - h[i]) < 0.3) h[i] = target[i];
      details[i].style.height = h[i].toFixed(1) + 'px';
      details[i].style.opacity = String(Math.min(1, h[i] / Math.max(1, target[i] || MAX_H)));
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function toggle(i) {
    openIdx[i] = !openIdx[i];
    rows[i].classList.toggle('tre__row--open', openIdx[i]);
    retarget(i);
  }

  rows.forEach(function (el, i) {
    el.addEventListener('click', function () {
      root.classList.remove('is-demo');
      toggle(i);
    });
  });

  // 자동 루프: 행의 확장 값을 순서대로 열고 닫는다
  var autoI = 0;
  function autoStep() {
    if (root.classList.contains('is-demo')) {
      toggle(autoI % 3);
    }
    autoI++;
    setTimeout(autoStep, AUTO_TOGGLE_MS);
  }
  setTimeout(autoStep, AUTO_TOGGLE_MS);
})();
</script>
</main>
</body>
</html>
