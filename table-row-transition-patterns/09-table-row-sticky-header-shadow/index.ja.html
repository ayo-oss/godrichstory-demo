<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スクロール位置値と影値の連動 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tss is-demo" id="tss">
  <div class="tss__viewport" id="tssViewport">
    <table class="tss__table">
      <thead class="tss__head" id="tssHead">
        <tr><th class="tss__th">項目</th><th class="tss__th tss__th--num">数値</th></tr>
      </thead>
      <tbody id="tssBody"></tbody>
    </table>
  </div>
  <p class="tss__hint">ホイールやタッチでスクロールしてみてください</p>
</div>
<script>
(function () {
  var root = document.getElementById('tss');
  var viewport = document.getElementById('tssViewport');
  var head = document.getElementById('tssHead');
  var body = document.getElementById('tssBody');

  // 상수: 표시할 행 수 · 그림자 보간 속도 · 자동 스크롤 속도(px/초)
  var N_ROWS = 10;
  var LERP = 0.18;
  var AUTO_SPEED = 46;

  var names = [];
  for (var ni = 1; ni <= N_ROWS; ni++) names.push('タスク ' + ni);
  for (var i = 0; i < N_ROWS; i++) {
    var tr = document.createElement('tr');
    var tdName = document.createElement('td');
    tdName.className = 'tss__td';
    tdName.textContent = names[i];
    var tdVal = document.createElement('td');
    tdVal.className = 'tss__td tss__td--num';
    tdVal.textContent = ((i * 7) % 12 + 2) * 10;
    tr.appendChild(tdName);
    tr.appendChild(tdVal);
    body.appendChild(tr);
  }

  var shadow = 0; // 그림자 값(0~1) — 스크롤 위치에 반응해 보간된다
  var maxScroll = 1;

  function measure() {
    maxScroll = Math.max(1, viewport.scrollHeight - viewport.clientHeight);
  }
  measure();

  // 계산 겹: 스크롤 위치 값(scrollTop / maxScroll)에서 0.18~0.5 구간만 걸러 머리글 고정 값(pin)을
  // 만들고, 그 값으로 그림자 번짐·내림을 매 프레임 남은 거리의 18%씩 보간한다
  function tick() {
    measure();
    var ratio = viewport.scrollTop / maxScroll;
    var pinTarget = ratio < 0.18 ? 0 : ratio > 0.5 ? 1 : (ratio - 0.18) / 0.32;
    shadow += (pinTarget - shadow) * LERP;
    var blur = (shadow * 14).toFixed(1);
    var drop = (shadow * 6).toFixed(1);
    var alpha = (shadow * 0.5).toFixed(2);
    head.style.boxShadow = '0 ' + drop + 'px ' + blur + 'px rgba(10, 15, 30, ' + alpha + ')';
    head.style.backgroundColor = 'rgba(35, 31, 40, ' + (0.94 + shadow * 0.06).toFixed(2) + ')';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // 자동 루프가 viewport.scrollTop 을 바꿀 때도 scroll 이벤트는 발생한다(비동기 디스패치).
  // 자동 스크롤 프레임마다 가드 스탬프(autoUntil)를 찍고, 이벤트가 그 짧은 창 안에서 오면
  // 무시한다 — 사용자 스크롤만 is-demo 를 끊는다
  var autoUntil = 0;
  viewport.addEventListener('scroll', function () {
    if (performance.now() < autoUntil) return;
    root.classList.remove('is-demo');
  });

  // 자동 루프: 사용자가 손을 대기 전까지 왕복 스크롤로 고정→해제를 반복한다
  var dir = 1;
  var lastT = performance.now();
  function autoTick(now) {
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    if (root.classList.contains('is-demo')) {
      autoUntil = now + 80;
      viewport.scrollTop += AUTO_SPEED * dt * dir;
      if (viewport.scrollTop >= maxScroll - 1) dir = -1;
      if (viewport.scrollTop <= 1) dir = 1;
    }
    requestAnimationFrame(autoTick);
  }
  requestAnimationFrame(autoTick);
})();
</script>
</main>
</body>
</html>
