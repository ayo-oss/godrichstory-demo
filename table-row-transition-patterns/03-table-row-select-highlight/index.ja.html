<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選択値ハイライトの切り替え — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<table class="tsh is-demo" id="tsh">
  <tbody>
    <tr class="tsh__row" id="tshRow0"><td class="tsh__cell">項目 A</td><td class="tsh__cell tsh__cell--num">14</td></tr>
    <tr class="tsh__row" id="tshRow1"><td class="tsh__cell">項目 B</td><td class="tsh__cell tsh__cell--num">27</td></tr>
    <tr class="tsh__row" id="tshRow2"><td class="tsh__cell">項目 C</td><td class="tsh__cell tsh__cell--num">9</td></tr>
    <tr class="tsh__row" id="tshRow3"><td class="tsh__cell">項目 D</td><td class="tsh__cell tsh__cell--num">31</td></tr>
  </tbody>
</table>
<script>
(function () {
  var root = document.getElementById('tsh');
  var rows = [0, 1, 2, 3].map(function (i) { return document.getElementById('tshRow' + i); });

  // 상수: 스프링 강성(k) · 감쇠(d) · 프레임당 시간 스텝 · 자동 루프 간격
  var REDUCE = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var K = REDUCE ? 1 : 0.26;
  var D = REDUCE ? 1 : 0.62;
  var DT = 1;
  var AUTO_SELECT_MS = 550;

  var selected = [false, false, false, false];
  var pos = [0, 0, 0, 0];   // 강조 진행 값(0~1+overshoot)
  var vel = [0, 0, 0, 0];

  function baseColor() { return [35, 31, 40]; }   // tick-panel
  function hiColor() { return [10, 79, 232]; }     // subject-blue-deep

  // 계산 겹: 목표(0 또는 1)로 스프링 방정식(가속도 = -k*(pos-target) - d*vel)을 매 프레임 적분해
  // 값이 1을 살짝 넘겼다 되돌아오는 오버슛을 만든다(단순 트윈이 아니다)
  function tick() {
    for (var i = 0; i < 4; i++) {
      var target = selected[i] ? 1 : 0;
      var acc = -K * (pos[i] - target) - D * vel[i];
      vel[i] += acc * DT;
      pos[i] += vel[i] * DT;
      var clampedForColor = Math.max(0, Math.min(1, pos[i]));
      var over = Math.max(0, pos[i] - 1);
      var b = baseColor(), h = hiColor();
      var r = b[0] + (h[0] - b[0]) * clampedForColor;
      var g = b[1] + (h[1] - b[1]) * clampedForColor;
      var bl = b[2] + (h[2] - b[2]) * clampedForColor;
      rows[i].style.background = 'rgb(' + r.toFixed(0) + ',' + g.toFixed(0) + ',' + bl.toFixed(0) + ')';
      rows[i].style.boxShadow = over > 0.001 ? ('inset 0 0 0 ' + (over * 6).toFixed(1) + 'px rgba(255,255,255,' + Math.min(0.6, over).toFixed(2) + ')') : 'none';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function select(i) {
    selected[i] = !selected[i];
  }

  rows.forEach(function (el, i) {
    el.addEventListener('click', function () {
      root.classList.remove('is-demo');
      select(i);
    });
  });

  // 자동 루프: 선택 값을 순서대로 켜고 끈다
  var autoI = 0;
  var autoSeq = [0, 1, 2, 3, 0, 1, 2, 3];
  function autoStep() {
    if (root.classList.contains('is-demo')) {
      select(autoSeq[autoI % autoSeq.length]);
    }
    autoI++;
    setTimeout(autoStep, AUTO_SELECT_MS);
  }
  setTimeout(autoStep, AUTO_SELECT_MS);
})();
</script>
</main>
</body>
</html>
