<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행 추가 값과 위치 값 함께 변화 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tis is-demo" id="tis" role="table" aria-label="신규 주문 표"></div>
<script>
(function () {
  var root = document.getElementById('tis');

  // 상수: 행 높이(px) · 보간 속도 · 표시 슬롯 수 · 자동 삽입 간격
  var ROW_H = 34;
  var LERP = 0.24;
  var SLOTS = 4;
  var AUTO_INSERT_MS = 1200;

  var seq = 100;
  var rows = []; // {el, order(현재 슬롯 index, SLOTS 이상=아래로 퇴장 중), y}

  function makeRow(label, amount) {
    var el = document.createElement('div');
    el.className = 'tis__row';
    el.setAttribute('role', 'row');
    var c1 = document.createElement('span');
    c1.className = 'tis__cell';
    c1.setAttribute('role', 'cell');
    c1.textContent = '주문 ' + label;
    var c2 = document.createElement('span');
    c2.className = 'tis__cell tis__cell--num';
    c2.setAttribute('role', 'cell');
    c2.textContent = amount;
    el.appendChild(c1);
    el.appendChild(c2);
    root.appendChild(el);
    return el;
  }

  function insert() {
    seq++;
    var el = makeRow(seq, ((seq % 7) + 1) * 1000);
    var entry = { el: el, order: -1, y: -ROW_H };
    // 계산 겹: 기존 행의 슬롯(순서) 값을 하나씩 뒤로 밀어 목표 y 를 다시 계산한다
    rows.forEach(function (r) { r.order += 1; });
    rows.unshift(entry);
    entry.order = 0;
    el.style.transform = 'translateY(' + entry.y.toFixed(1) + 'px)';
  }

  function tick() {
    rows.forEach(function (r) {
      var target = r.order * ROW_H;
      r.y += (target - r.y) * LERP;
      var opacity = r.order >= SLOTS ? Math.max(0, 1 - (r.y - (SLOTS - 1) * ROW_H) / ROW_H) : 1;
      r.el.style.transform = 'translateY(' + r.y.toFixed(1) + 'px)';
      r.el.style.opacity = opacity.toFixed(2);
    });
    for (var i = rows.length - 1; i >= 0; i--) {
      var r = rows[i];
      if (r.order >= SLOTS && Math.abs(r.order * ROW_H - r.y) < 1) {
        r.el.remove();
        rows.splice(i, 1);
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  insert(); insert(); insert(); insert();
  // 초기 4행은 진입 애니메이션 없이 바로 자리에
  rows.forEach(function (r) { r.y = r.order * ROW_H; r.el.style.transform = 'translateY(' + r.y + 'px)'; });

  root.style.height = (SLOTS * ROW_H) + 'px';

  root.addEventListener('click', function () {
    root.classList.remove('is-demo');
    insert();
  });

  // 자동 루프: 새 행을 주기적으로 추가한다
  function autoStep() {
    if (root.classList.contains('is-demo')) insert();
    setTimeout(autoStep, AUTO_INSERT_MS);
  }
  setTimeout(autoStep, AUTO_INSERT_MS);
})();
</script>
</main>
</body>
</html>
