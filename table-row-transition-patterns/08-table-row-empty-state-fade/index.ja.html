<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空リスト状態値の切り替え — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tef is-demo" id="tef">
  <div class="tef__list" id="tefList"></div>
  <div class="tef__empty" id="tefEmpty">表示する項目がありません</div>
</div>
<script>
(function () {
  var root = document.getElementById('tef');
  var list = document.getElementById('tefList');
  var empty = document.getElementById('tefEmpty');

  // 상수: 행 높이(px) · 등장 값 보간 속도 · 자동 루프 간격
  var ROW_H = 32;
  var LERP = 0.2;
  var AUTO_STEP_MS = 900;
  var REFILL_LABELS = ['在庫 A', '在庫 B', '在庫 C'];

  var rows = [];
  var emptyProg = 0; // 빈 상태 등장 값(0~1)

  function makeRow(label) {
    var el = document.createElement('div');
    el.className = 'tef__row';
    el.textContent = label;
    list.appendChild(el);
    return { el: el, removing: false, h: ROW_H };
  }

  function refill() {
    REFILL_LABELS.forEach(function (label) { rows.push(makeRow(label)); });
  }
  refill();

  function removeLast() {
    for (var i = rows.length - 1; i >= 0; i--) {
      if (!rows[i].removing) { rows[i].removing = true; return; }
    }
  }

  // 계산 겹: 행이 하나도 없는 상태 값이 켜지면 빈 화면 문구의 등장 값(emptyProg)이 0에서
  // 매 프레임 남은 거리의 20%씩 올라간다 — index.html tick() 참조
  function tick() {
    for (var i = rows.length - 1; i >= 0; i--) {
      var r = rows[i];
      var targetH = r.removing ? 0 : ROW_H;
      r.h += (targetH - r.h) * LERP;
      r.el.style.height = Math.max(0, r.h).toFixed(1) + 'px';
      r.el.style.opacity = (r.h / ROW_H).toFixed(2);
      if (r.removing && r.h < 0.5) {
        r.el.remove();
        rows.splice(i, 1);
      }
    }
    var noRows = rows.length === 0;
    var target = noRows ? 1 : 0;
    emptyProg += (target - emptyProg) * LERP;
    empty.style.opacity = emptyProg.toFixed(2);
    empty.style.transform = 'translateY(' + ((1 - emptyProg) * 10).toFixed(1) + 'px)';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  root.addEventListener('click', function () {
    root.classList.remove('is-demo');
    if (rows.length) removeLast(); else refill();
  });

  // 자동 루프: 행을 하나씩 지우다가 비면 잠시 뒤 다시 채운다
  function autoStep() {
    if (root.classList.contains('is-demo')) {
      if (rows.length) removeLast();
      else refill();
    }
    setTimeout(autoStep, AUTO_STEP_MS);
  }
  setTimeout(autoStep, AUTO_STEP_MS);
})();
</script>
</main>
</body>
</html>
