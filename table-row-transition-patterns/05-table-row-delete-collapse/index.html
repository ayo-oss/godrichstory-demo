<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행 삭제 값과 높이 값 동시 변화 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tdc is-demo" id="tdc" role="table" aria-label="삭제 가능한 작업 표"></div>
<script>
(function () {
  var root = document.getElementById('tdc');

  // 상수: 행 높이(px) · 위치 보간 속도 · 높이 보간 속도 · 슬롯 수 · 자동 삭제 간격
  var ROW_H = 34;
  var POS_LERP = 0.22;
  var H_LERP = 0.26;
  var SLOTS = 4;
  var AUTO_DELETE_MS = 1300;

  var seq = 0;
  var rows = []; // {el, inner, order, y, h, removing, entering}

  function makeRow(label) {
    var el = document.createElement('div');
    el.className = 'tdc__row';
    var inner = document.createElement('div');
    inner.className = 'tdc__inner';
    var cell = document.createElement('span');
    cell.className = 'tdc__cell';
    cell.textContent = '작업 ' + label;
    var btn = document.createElement('button');
    btn.className = 'tdc__x';
    btn.type = 'button';
    btn.setAttribute('aria-label', '삭제');
    btn.textContent = '×';
    inner.appendChild(cell);
    inner.appendChild(btn);
    el.appendChild(inner);
    root.appendChild(el);
    return { el: el, inner: inner };
  }

  function addRow(entering) {
    seq++;
    var made = makeRow(seq);
    var order = rows.filter(function (r) { return !r.removing; }).length;
    var entry = { el: made.el, inner: made.inner, order: order, y: order * ROW_H, h: entering ? 0 : ROW_H, removing: false, entering: !!entering };
    made.inner.querySelector('.tdc__x').addEventListener('click', function (e) {
      e.stopPropagation();
      root.classList.remove('is-demo');
      remove(entry);
    });
    rows.push(entry);
    return entry;
  }

  // 계산 겹: 삭제 값이 켜지면 그 행의 높이 값이 0으로 줄고, 아래 행들의 순서(슬롯) 값이 하나씩 당겨져
  // 목표 y 가 다시 계산된다
  function remove(entry) {
    if (entry.removing) return;
    entry.removing = true;
    rows.forEach(function (r) {
      if (!r.removing && r.order > entry.order) r.order -= 1;
    });
  }

  function tick() {
    for (var i = rows.length - 1; i >= 0; i--) {
      var r = rows[i];
      var targetY = r.order * ROW_H;
      r.y += (targetY - r.y) * POS_LERP;
      var targetH = r.removing ? 0 : ROW_H;
      r.h += (targetH - r.h) * H_LERP;
      r.el.style.transform = 'translateY(' + r.y.toFixed(1) + 'px)';
      r.inner.style.height = Math.max(0, r.h).toFixed(1) + 'px';
      r.inner.style.opacity = (r.h / ROW_H).toFixed(2);
      if (r.removing && r.h < 0.5) {
        r.el.remove();
        rows.splice(i, 1);
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  addRow(false); addRow(false); addRow(false); addRow(false);
  root.style.height = (SLOTS * ROW_H) + 'px';

  // 자동 루프: 맨 위 행을 지우고 새 행을 아래에 채운다
  function autoStep() {
    if (root.classList.contains('is-demo') && rows.length) {
      remove(rows[0]);
      addRow(true);
    }
    setTimeout(autoStep, AUTO_DELETE_MS);
  }
  setTimeout(autoStep, AUTO_DELETE_MS);
})();
</script>
</main>
</body>
</html>
