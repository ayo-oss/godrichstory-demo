<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group collapse value transition — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<table class="tgc is-demo" id="tgc">
  <tbody>
    <tr class="tgc__group" id="tgcGroup">
      <td colspan="2">Fruit group (3)</td>
    </tr>
    <tr class="tgc__child" data-i="0" id="tgcChild0">
      <td class="tgc__cell">Apple</td>
      <td class="tgc__cell tgc__cell--num">120</td>
    </tr>
    <tr class="tgc__child" data-i="1" id="tgcChild1">
      <td class="tgc__cell">Banana</td>
      <td class="tgc__cell tgc__cell--num">80</td>
    </tr>
    <tr class="tgc__child" data-i="2" id="tgcChild2">
      <td class="tgc__cell">Grape</td>
      <td class="tgc__cell tgc__cell--num">45</td>
    </tr>
  </tbody>
</table>
<script>
(function () {
  var root = document.getElementById('tgc');
  var group = document.getElementById('tgcGroup');
  var children = [0, 1, 2].map(function (i) { return document.getElementById('tgcChild' + i); });

  // 상수: 자식 행 높이(px) · 자식 사이 stagger 간격(ms) · 자동 루프 간격
  var CHILD_H = 30;
  var STAGGER_MS = 70;
  var AUTO_TOGGLE_MS = 1300;

  var collapsed = false;

  // 계산 겹: 접힘 값이 켜지면 자식 행 수 × stagger 로 각 행의 표시 값 전환 시각을 다르게 건다
  function apply() {
    children.forEach(function (el, i) {
      var delay = i * STAGGER_MS;
      el.style.transitionDelay = delay + 'ms';
      if (collapsed) {
        el.style.height = '0px';
        el.style.opacity = '0';
        el.style.transform = 'translateY(-' + (CHILD_H * 0.3).toFixed(1) + 'px)';
      } else {
        el.style.height = CHILD_H + 'px';
        el.style.opacity = '1';
        el.style.transform = 'translateY(0px)';
      }
    });
    group.classList.toggle('tgc__group--collapsed', collapsed);
  }
  apply();

  function toggle() {
    collapsed = !collapsed;
    apply();
  }

  group.addEventListener('click', function () {
    root.classList.remove('is-demo');
    toggle();
  });

  // 자동 루프: 그룹의 접힘 값을 주기적으로 켜고 끈다
  function autoStep() {
    if (root.classList.contains('is-demo')) toggle();
    setTimeout(autoStep, AUTO_TOGGLE_MS);
  }
  setTimeout(autoStep, AUTO_TOGGLE_MS);
})();
</script>
</main>
</body>
</html>
