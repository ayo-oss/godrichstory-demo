<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>봇으로 보내기 — 토큰·블록 수·채널 검증 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sb is-demo" id="sb">
  <div class="sb__in" data-role="inner">
    <div class="sb__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, 왼쪽·오른쪽 방향키로 다른 값으로">
      <div class="sb__scene" data-role="scene" role="img" aria-label="n8n 노드에서 나온 발송이 토큰 접두·블록 수·채널 형식 검증을 차례로 지나 통과한 것만 봇 이름표를 달고 채널로 가는 장면"></div>
      <div class="sb__probe" data-role="probe" aria-hidden="true"></div>
      <div class="sb__chart" data-role="chart" aria-hidden="true"></div>
      <p class="sb__status" data-role="status" aria-live="off">장면 준비</p>
      <p class="sb__reada" data-role="reada" aria-hidden="true"></p>
      <p class="sb__readb" data-role="readb" aria-hidden="true"></p>
      <div class="sb__ctrl">
        <button class="sb__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
      </div>
      <p class="sb__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("sb");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {

    // ── 536 공통 — n8n slack 메시지 포맷 엔진 (535 core 계승, JSON 블록 스택·발송 검증·대기 시간표 판)
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function fill(s) {
        const v = [];
        for (let _i = 1; _i < arguments.length; _i += 1) {
            v[_i - 1] = arguments[_i];
        }
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? String(v[i]) : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    function f3(v) { return (Math.round(v * 1000) / 1000).toFixed(3); }
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        scWrap.textContent = '';
        chartEl.textContent = '';
        probeEl.textContent = '';
    }
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function spanOf(d, dur, k) { return { s: d, e: d + dur, k: k === undefined ? 0 : k }; }
    let headEl = null;
    let piNow = 0;
    let cycleNow = 2000;
    let restoreClock = null;
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            piNow = pi;
            cycle = Math.max(2000, cfg.build(pi));
            cycleNow = cycle;
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                setPaused(true);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            // reduce — 보간 없이 목표 상태 한 장. 입력(키·버튼)은 rebuild 로 바로 화면에 반영된다
            cfg.frame(1e9);
            statusP.textContent = readB.textContent;
            doneP.textContent = readB.textContent;
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }

    // ── 02 봇으로 보내기 — 왼쪽 n8n 노드에서 나온 발송 4건이 검증 3칸을 차례로 지나 오른쪽 채널로 간다.
    //    판정: ① botToken 접두가 'xoxb-' 인가 ② blocks 가 BLOCK_LIMIT(50) 개 이하인가
    //    ③ 채널 형식이 '#' 으로 시작하는가. 세 검증을 모두 통과한 발송만 봇 이름표(BOT) 를 달고 채널에 쌓인다.
    //    계산: verdictOf(단계별 멈춤 칸)·passRate = passed/total·블록 비율 blockRatio = blocks / BLOCK_LIMIT
    //    (발송 후보마다 blocks 수를 두고 50 을 넘는지 센다 — Slack 공식 「up to 50 blocks in each message」).
    //    이름 길이 검증은 없다: 21 자는 채널 이름의 옛 상한(Slack changelog 2019-08)이지 봇 이름 규칙이 아니다.
    const TOKEN_PREFIX = 'xoxb-'; // 봇 토큰 접두 — 데모 값은 가짜 표기(실키 아님)
    const BLOCK_LIMIT = 50;       // 한 메시지의 blocks 상한 (Slack 공식)
    const BLOCK_N = 12;           // 변형 2: 12 → 48 (첫 발송에 담긴 블록 수)
    const STAGE_MS = 900;         // 한 발송이 목표 지점까지 가는 시간
    const T0 = 200;               // 첫 이동 시작(첫 변화는 150ms 뒤)
    const LANES = 4;
    const NODE_X = 8;
    const NODE_W = 72;
    const CHK_X = [92, 188, 284];
    const CHK_W = 84;
    const CH_X = 380;
    const CH_W = 64;
    const LANE_Y0 = 0;
    const LANE_H = 23;        // 이름표 레인 피치 — 4 레인이 라벨 행(0~12) 아래 13~103 에 들어간다
    const LANE_PAD = 13;      // 첫 레인 y (라벨 행 12px 바로 아래) — 이름표가 라벨 글자와 같은 줄에 놓이지 않는다
    const GATE_H = 104;       // 노드·문·채널 높이 (LANES × LANE_H 와 분리 — 레인 피치를 바꿔도 문 높이는 그대로)
    const BAR_Y = 108;        // 블록 수 막대 시작 y (문 바닥 104 에서 4px)
    const CNT_Y = 128;        // 카운터 첫 줄 y (막대 123 아래 — 두 줄 128~156 이 씬 안)
    let packetEls = [];
    let gateEls = [];
    let sentEls = [];
    let barEls = [];
    let counterEl = null;
    let nameEl = null;
    let gBarEls = [];
    let passBar = null;
    let chartNote = null;
    let blkBar = null;

    // 발송 후보 — 토큰·이름·채널·sendAsUser·blocks. 건마다 어느 검증에 걸리는지가 다르다
    // (① 사용자 토큰 ② 블록 50 초과 ③ # 없는 채널 — 나머지 한 건은 끝까지 통과)
    const SENDS = [
        { botToken: 'xoxb-demo-1111', username: 'deploy-bot', channel: '#ops', sendAsUser: false, blocks: BLOCK_N },
        { botToken: 'xoxp-demo-2222', username: 'report-bot', channel: '#ops', sendAsUser: false, blocks: BLOCK_N + 4 },
        { botToken: 'xoxb-demo-3333', username: 'approval-bot', channel: '#alerts', sendAsUser: false, blocks: BLOCK_N + 52 },
        { botToken: 'xoxb-demo-4444', username: 'ops-bot', channel: 'alerts', sendAsUser: false, blocks: BLOCK_N + 16 }
    ];

    // 검증 3칸 — 각각 통과(true)·실패(false) 를 돌려준다
    function checkToken(s) { return s.botToken.slice(0, TOKEN_PREFIX.length) === TOKEN_PREFIX; }
    function checkBlocks(s) { return s.blocks <= BLOCK_LIMIT; }
    function checkChannel(s) { return s.channel.charAt(0) === '#'; }
    const CHECKS = [
        { fn: checkToken, label: 'xoxb-' },
        { fn: checkBlocks, label: 'blocks ≤ 50' },
        { fn: checkChannel, label: '#channel' }
    ];

    // 발송 한 건의 판정 — 몇 번째 칸에서 멈췄는지(3 이면 끝까지 통과)
    function verdictOf(s) {
        for (let c = 0; c < CHECKS.length; c += 1) {
            if (!CHECKS[c].fn(s)) {
                return c;
            }
        }
        return CHECKS.length;
    }
    function build(i) {
        packetEls = []; gateEls = []; sentEls = []; barEls = []; gBarEls = [];
        const n = [2, 3, LANES][Math.min(i, 2)];
        const node = make('div', 'node', scWrap);
        put(node, NODE_X, LANE_Y0, NODE_W, GATE_H);
        const nlbl = make('b', 'nlbl', node);
        nlbl.textContent = 'n8n';
        const nsub = make('b', 'nsub', node);
        nsub.textContent = 'postMessage';
        for (let c = 0; c < CHECKS.length; c += 1) {
            const g = make('div', 'gate', scWrap);
            put(g, CHK_X[c], LANE_Y0, CHK_W, GATE_H);
            const gl = make('b', 'glbl', g);
            gl.textContent = CHECKS[c].label;
            gateEls.push(g);
            const link = make('i', 'link', scWrap);
            const lx = c === 0 ? NODE_X + NODE_W : CHK_X[c - 1] + CHK_W;
            put(link, lx, 50, CHK_X[c] - lx, 2);
        }
        const ch = make('div', 'chan', scWrap);
        put(ch, CH_X, LANE_Y0, CH_W, GATE_H);
        const cl = make('b', 'clbl', ch);
        cl.textContent = '#ops';
        const linkEnd = make('i', 'link', scWrap);
        put(linkEnd, CHK_X[2] + CHK_W, 50, CH_X - CHK_X[2] - CHK_W, 2);
        for (let l = 0; l < LANES; l += 1) {
            const p = make('div', 'pkt', scWrap);
            put(p, NODE_X + NODE_W, LANE_Y0 + LANE_PAD + l * LANE_H, 92, 21);
            const pt = make('b', 'ptxt', p);
            pt.textContent = l < n ? SENDS[l].username.slice(0, 9) : ' ';
            const pl = make('b', 'plen', p);
            pl.textContent = l < n ? f0(SENDS[l].blocks) : '';
            packetEls.push({ el: p, send: SENDS[l], verdict: l < n ? verdictOf(SENDS[l]) : -1, live: l < n });
            const badge = make('b', 'badge', ch);
            put(badge, 4, LANE_PAD + l * LANE_H, CH_W - 8, 21);
            badge.style.opacity = '0';
            badge.textContent = 'BOT';
            sentEls.push(badge);
            const bar = make('i', 'nbar', scWrap);
            put(bar, NODE_X, BAR_Y + l * 4, 0, 3);
            barEls.push(bar);
        }
        // chart — 칸별로 그 칸을 통과한 발송 수(민트)·그 칸에서 멈춘 발송 수(로즈), 그리고 통과율 막대
        for (let c = 0; c < CHECKS.length; c += 1) {
            const lab = make('b', 'cnote', chartEl);
            put(lab, 8 + c * 110, 4, 104, 14);
            lab.textContent = CHECKS[c].label;
            const okb = make('i', 'cbar cbar--ok', chartEl);
            put(okb, 8 + c * 110, 22, 0, 8);
            const hitb = make('i', 'cbar cbar--hit', chartEl);
            put(hitb, 8 + c * 110, 34, 0, 8);
            gBarEls.push({ ok: okb, hit: hitb });
        }
        passBar = make('i', 'cbar cbar--pass', chartEl);
        put(passBar, 8 + 3 * 110, 22, 0, 104);
        chartNote = make('b', 'cnote', chartEl);
        put(chartNote, 8 + 3 * 110, 4, 104, 14);
        // 블록 비율 막대 — 블록 수 막대 오른쪽 빈자리. 가장 많은 발송의 blocks / BLOCK_LIMIT, 50 을 넘으면 색이 바뀐다
        const blkLbl = make('b', 'blbl', scWrap);
        put(blkLbl, 208, BAR_Y + 6, 64, 12);
        blkLbl.textContent = 'blockRatio';
        blkBar = make('i', 'cbar cbar--blk', scWrap);
        put(blkBar, 276, BAR_Y + 8, 168, 8);
        counterEl = make('b', 'counter', scWrap);
        put(counterEl, NODE_X, CNT_Y, 440, 14);
        nameEl = make('b', 'counter', scWrap);
        put(nameEl, NODE_X, CNT_Y + 14, 440, 14);
        readA.textContent = 'botToken.slice(0,5) === "' + TOKEN_PREFIX + '" · blocks ≤ 50 · channel[0] === "#" · chat.postMessage';
        readB.textContent = i === 0 ? 'the user token stops at the first gate' : (i === 1 ? 'too many blocks fail the second gate' : 'a channel without # fails the third gate');
        doneP.textContent = '';
        return 2000;
    }
    function frame(t) {
        let total = 0;
        let passed = 0;
        let overN = 0;
        let maxBlocks = 0;
        let blkOver = 0;
        const stops = [0, 0, 0, 0];
        for (let l = 0; l < packetEls.length; l += 1) {
            const p = packetEls[l];
            const k = clamp((t - T0 - l * 160) / STAGE_MS, 0, 1);
            const ease = 1 - Math.pow(1 - k, 3);
            const alive = p.live && t >= T0 + l * 160;
            // 멈추는 x — 실패하면 그 칸 안, 끝까지 통과하면 채널 안
            const maxX = p.verdict >= CHECKS.length ? CH_X - 172 : CHK_X[p.verdict] - 4;   // x 는 이동량이다(이름표 left = NODE_X + NODE_W = 80). 통과한 이름표는 채널 왼쪽 바로 앞(288~380) 에 선다 — 채널 안 BOT 배지(384~440) 와 포개지지 않고 씬(448) 밖으로도 나가지 않는다
            const x = NODE_X + NODE_W + (maxX - NODE_X - NODE_W) * ease;
            p.el.style.transform = 'translateX(' + f1(x) + 'px)';
            p.el.style.opacity = alive ? '1' : '0';
            if (!alive) {
                continue;
            }
            total += 1;
            if (p.send.blocks > BLOCK_LIMIT) { overN += 1; }
            maxBlocks = Math.max(maxBlocks, p.send.blocks);
            if (p.send.blocks > BLOCK_LIMIT) { blkOver += 1; }
            const ok = p.verdict >= CHECKS.length;
            if (k >= 1) {
                if (ok) { passed += 1; stops[3] += 1; }
                else { stops[p.verdict] += 1; }
                p.el.classList.toggle('pkt--ok', ok);
                p.el.classList.toggle('pkt--fail', !ok);
                sentEls[l].style.opacity = ok ? '1' : '0';
            }
            else {
                p.el.classList.remove('pkt--ok', 'pkt--fail');
                sentEls[l].style.opacity = '0';
            }
        }
        // 검증 문 — 그 칸을 통과한 발송은 민트, 그 칸에서 멈춘 발송은 로즈로 문 전체가 물든다 (값의 전파)
        for (let c = 0; c < CHECKS.length; c += 1) {
            let okC = 0;
            let hitC = 0;
            for (let l = 0; l < packetEls.length; l += 1) {
                const p = packetEls[l];
                if (!p.live) { continue; }
                const kk = clamp((t - T0 - l * 160) / STAGE_MS, 0, 1);
                const reach = kk >= (c + 1) / (CHECKS.length + 1);
                if (reach && p.verdict > c) { okC += 1; }
                if (kk >= 1 && p.verdict === c) { hitC += 1; }
            }
            gateEls[c].classList.toggle('gate--ok', okC > 0);
            gateEls[c].classList.toggle('gate--hit', hitC > 0);
            const gw = 104 / LANES;
            gBarEls[c].ok.style.width = f1(okC * gw) + 'px';
            gBarEls[c].hit.style.width = f1(hitC * gw) + 'px';
        }
        // 블록 수 막대 — blocks / BLOCK_LIMIT. 50 개를 넘으면 색이 바뀐다
        for (let b = 0; b < barEls.length; b += 1) {
            const p = packetEls[b];
            const len = p.live ? p.send.blocks : 0;
            const kk = clamp((t - T0 - b * 160) / STAGE_MS, 0, 1);
            barEls[b].style.width = f1(Math.min(len / BLOCK_LIMIT, 1.6) * 180 * kk) + 'px';
            barEls[b].classList.toggle('nbar--over', len > BLOCK_LIMIT);
        }
        passBar.style.width = f1((total ? passed / total : 0) * 104) + 'px';
        // 블록 비율 — blockRatio = maxBlocks / BLOCK_LIMIT. 막대는 50 을 넘으면 로즈로 바뀐다
        const blkK = clamp((t - T0) / STAGE_MS, 0, 1);
        blkBar.style.transform = 'scaleX(' + f3(Math.min(maxBlocks / BLOCK_LIMIT, 1) * blkK) + ')';
        blkBar.classList.toggle('cbar--over', maxBlocks > BLOCK_LIMIT);
        chartNote.textContent = fill('passRate {a}%', total ? f0(passed / total * 100) : '0');
        counterEl.textContent = fill('blocks {a}/50 · 넘침 {b}건 · 통과율 {c}% · 검증 {d}건',
            f0(maxBlocks), f0(overN), total ? f0(passed / total * 100) : '0', f0(total));
        nameEl.textContent = fill('verdictOf 멈춤 칸 ①{a} ②{b} ③{c} · 통과 {d}', f0(stops[0]), f0(stops[1]), f0(stops[2]), f0(stops[3]));
        return fill('검증 {a}건 · 통과 {b} · 차단 {c} · 블록 {d}개 · 초과 {e}건', f0(total), f0(passed), f0(total - passed), f0(maxBlocks), f0(overN));
    }
    return run({ count: 3, build: build, frame: frame });
}
})();
</script>
