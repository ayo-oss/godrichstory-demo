<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紐に吊るされて揺れる文字 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pc is-demo" id="pc">
  <p class="pc__sr" data-role="word">ぶらさがり</p>
  <canvas class="pc__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="紐に吊るされた文字の看板が、持ち上げて放されたあと揺れる場面。ドラッグで紐を押しのけ、左右の矢印キーで揺らし、Enterでもう一度持ち上げ、Spaceで一時停止します。"></canvas>
  <p class="pc__status" data-role="status" aria-live="off">紐が揺れています</p>
  <div class="pc__tools">
    <button class="pc__btn" data-role="restart" type="button">もう一度持ち上げる</button>
    <button class="pc__btn" data-role="pause" type="button" aria-pressed="false">一時停止</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("pc");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    const TAU = Math.PI * 2;
    const DEG = Math.PI / 180;
    // 바닥 높이 — 왼쪽 아래 상태 줄 위에서 글자가 멈추도록 바닥을 띄워 둔다
    const FLOOR = 250;
    // 다시 떨어뜨린 뒤 첫 200ms 는 그대로 둔다 — 첫 변화가 200ms 뒤에 오게
    const LEAD_MS = 200;
    // 파스텔 팔레트 — 어두운 무대 위에 밝은 글자를 얹어 명도 차로 글자 경계가 읽힌다
    const BG = [27, 24, 38];
    const BG_LOW = [38, 33, 54];
    const FLOOR_COL = [56, 50, 78];
    const INK = [33, 29, 46];
    const PAPER = [255, 248, 234];
    const PAL = [
        [124, 196, 255],
        [255, 160, 190],
        [126, 226, 192],
        [190, 164, 255],
        [255, 208, 168],
        [246, 228, 140],
        [150, 222, 236],
        [232, 182, 228],
        [196, 220, 160],
    ];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function shadeRGB(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
    // 시드 고정 난수 — 같은 시드면 같은 배치가 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const wordEl = root.querySelector('[data-role="word"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !statusEl || !wordEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    // 원문 한 줄 — 화면 낭독기는 이 문장만 한 번 읽는다. 캔버스에 그린 낱글자는 접근성 트리에 들어가지 않는다
    const WORD = (wordEl.textContent || '').trim();
    const restartBtn = root.querySelector('[data-role="restart"]');
    const pauseBtn = root.querySelector('[data-role="pause"]');
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 아래 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    // 화면 좌표(CSS px) → 장면 좌표(480x300). 리사이즈 뒤에도 그때그때 현재 크기로 다시 잰다
    function toScene(ev) {
        const r = cv.getBoundingClientRect();
        return [((ev.clientX - r.left) / r.width) * W, ((ev.clientY - r.top) / r.height) * H];
    }
    const FONT_FAMILY = '"Segoe UI", "Malgun Gothic", "Hiragino Sans", "Noto Sans KR", sans-serif';
    // 글자 사이 간격 — 글자 크기에 대한 비율
    const GLYPH_GAP = 0.1;
    function fontAt(px) { return '800 ' + px.toFixed(1) + 'px ' + FONT_FAMILY; }
    function layoutWord(text, sizeMax, maxW, cx, cy) {
        const chars = Array.from(text);
        ctx.font = fontAt(sizeMax);
        const ws = [];
        let total = 0;
        for (let i = 0; i < chars.length; i += 1) {
            const m = chars[i].trim() === '' ? sizeMax * 0.3 : ctx.measureText(chars[i]).width;
            ws.push(m);
            total += m;
        }
        total += GLYPH_GAP * sizeMax * Math.max(0, chars.length - 1);
        // 줄이 maxW 보다 길면 글자 크기를 같은 비율로 줄인다 — 언어마다 글자 수가 달라도 무대 안에 든다
        const k = total > maxW ? maxW / total : 1;
        const size = sizeMax * k;
        const out = [];
        let x = cx - (total * k) / 2;
        let n = 0;
        for (let i = 0; i < chars.length; i += 1) {
            const w = ws[i] * k;
            if (chars[i].trim() !== '') {
                out.push({ ch: chars[i], w: Math.max(w, size * 0.34), h: size * 0.9, hx: x + w / 2, hy: cy, size: size, col: PAL[n % PAL.length], i: n });
                n += 1;
            }
            x += w + GLYPH_GAP * size;
        }
        return out;
    }
    // 글자 하나 그리기 — 같은 글자를 어둡게 한 번 아래로 비켜 찍어 두께를 만든 뒤 제 색으로 덮는다
    function drawGlyph(g, x, y, a, sx, sy, fill) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(a);
        ctx.scale(sx, sy);
        ctx.font = fontAt(g.size);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(shadeRGB(fill, 0.5), 1);
        ctx.fillText(g.ch, 1.4, g.size * 0.04 + 2.8);
        ctx.fillStyle = rgba(fill, 1);
        ctx.fillText(g.ch, 0, g.size * 0.04);
        ctx.restore();
    }
    // 모서리가 둥근 사각형 경로 — 가운데 (0,0) 기준 폭 w·높이 h
    function roundRectPath(x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
        ctx.lineTo(x + rr, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
        ctx.lineTo(x, y + rr);
        ctx.quadraticCurveTo(x, y, x + rr, y);
        ctx.closePath();
    }
    // 바닥 그림자 — 글자 아래끝이 바닥에서 멀수록 옅고 넓게. 높이 값 하나로 크기와 진하기를 함께 정한다
    function floorShadow(x, bottom, w) {
        const lift = clamp((FLOOR - bottom) / 160, 0, 1);
        ctx.fillStyle = rgba([0, 0, 0], 0.34 * (1 - lift) + 0.05);
        ctx.beginPath();
        ctx.ellipse(x, FLOOR + 3, w * (0.5 + 0.4 * lift), 3.5 + 2.5 * lift, 0, 0, TAU);
        ctx.fill();
    }
    function clearStage() {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(BG, 1));
        g.addColorStop(1, rgba(BG_LOW, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    function drawFloor() {
        ctx.fillStyle = rgba(FLOOR_COL, 1);
        ctx.fillRect(0, FLOOR, W, H - FLOOR);
        ctx.fillStyle = rgba(PAPER, 0.22);
        ctx.fillRect(0, FLOOR, W, 1.5);
    }
    const TXT_PAUSE = '一時停止中 — Spaceで再開';
    // 시계 — clock 은 시연 시계, age 는 다시 떨어뜨린 뒤 흐른 시간(ms). 둘 다 16ms 고정 스텝으로만 늘어난다
    let paused = false;
    let clock = 0;
    let age = 0;
    function setPaused(v) {
        paused = v;
        if (pauseBtn) {
            pauseBtn.setAttribute('aria-pressed', v ? 'true' : 'false');
        }
    }
    function restart() {
        age = 0;
        onRestart();
    }
    function tick() {
        age += FIXED_DT;
        step();
    }
    function report() { say(paused ? TXT_PAUSE : stateText()); }
    function render() {
        draw();
        report();
    }
    // 시연 — DEMO_LOOP_MS 마다 처음부터 다시 떨어뜨린다
    let demoCycle = -1;
    function demoTick(t) {
        const cyc = Math.floor(t / DEMO_LOOP_MS);
        if (cyc !== demoCycle) {
            demoCycle = cyc;
            restart();
        }
        demoDrive(t - cyc * DEMO_LOOP_MS);
    }
    // 동작 줄이기 — 움직임을 그리지 않고 SETTLE_TICKS 스텝을 한 번에 계산해 내려앉은 결과만 그린다
    const SETTLE_TICKS = 360;
    function settle() {
        for (let k = 0; k < SETTLE_TICKS; k += 1) {
            tick();
        }
    }
    // 입력 한 번 뒤 — 동작 줄이기면 그 입력이 낳은 결과까지 바로 계산해 그린다
    function after() {
        if (still) {
            settle();
        }
        render();
    }
    cv.addEventListener('pointerdown', function (ev) {
        wake();
        if (cv.setPointerCapture) {
            cv.setPointerCapture(ev.pointerId);
        }
        const p = toScene(ev);
        onPointer('down', p[0], p[1]);
        after();
    });
    cv.addEventListener('pointermove', function (ev) {
        const p = toScene(ev);
        if (onPointer('move', p[0], p[1])) {
            wake();
            after();
        }
    });
    cv.addEventListener('pointerup', function (ev) {
        const p = toScene(ev);
        onPointer('up', p[0], p[1]);
    });
    cv.addEventListener('pointercancel', function () { onPointer('up', -1, -1); });
    cv.addEventListener('pointerleave', function () {
        if (onPointer('leave', -1, -1)) {
            after();
        }
    });
    cv.addEventListener('keydown', function (ev) {
        const k = ev.key;
        if (k === 'Enter') {
            restart();
        }
        else if (k === ' ') {
            setPaused(!paused);
        }
        else if (!onKey(k)) {
            return;
        }
        ev.preventDefault();
        wake();
        after();
    });
    if (restartBtn) {
        restartBtn.addEventListener('click', function () { wake(); restart(); after(); });
    }
    if (pauseBtn) {
        pauseBtn.addEventListener('click', function () { wake(); setPaused(!paused); after(); });
    }
    // 줄 하나를 나누는 마디 수 — 점은 마디 수 + 1 개(맨 위 점은 걸이에 고정)
    const ROPE_SEGMENTS = 6;
    // 한 틱에 마디 길이를 되맞추는 횟수 — 적으면 줄이 고무줄처럼 늘어난다
    const CONSTRAINT_ITERATIONS = 8;
    // 공기 저항 — 이전 위치와의 차(속도)에서 틱마다 이 비율만큼 덜어 낸다
    const AIR_DAMPING = 0.012;
    const ROPE_GRAVITY = 0.32;
    // 줄 길이 — 왼쪽부터 조금씩 길어진다. 길이가 다르면 흔들리는 주기가 달라 물결처럼 어긋난다
    const ROPE_LEN_MIN = 46;
    const ROPE_LEN_STEP = 10;
    // 놓기 전 자세 — 줄을 곧게 펴 이 각도만큼 오른쪽으로 들어 올린다
    const RELEASE_ANGLE = 30 * DEG;
    // 끝 점(글자)의 질량 역수 — 줄 마디(1)보다 무거워 마디를 맞출 때 덜 끌려간다
    const LETTER_INV_MASS = 0.3;
    const RAIL_Y = 16;
    // 손가락·포인터가 줄을 밀어내는 반지름(px)
    const PUSH_R = 22;
    const DEMO_LOOP_MS = 3400;
    const TXT_RUN = '紐が揺れています';
    const TXT_REST = '揺れが収まりました — Enterでもう一度';
    const GLYPHS = layoutWord(WORD, 44, 400, 240, 0);
    let ropes = [];
    let hand = { on: false, x: 0, y: 0 };
    function onRestart() {
        ropes = GLYPHS.map(function (g, i) {
            const rest = (ROPE_LEN_MIN + i * ROPE_LEN_STEP) / ROPE_SEGMENTS;
            const r = { g: g, ax: g.hx, px: [], py: [], ox: [], oy: [], rest: rest };
            for (let k = 0; k <= ROPE_SEGMENTS; k += 1) {
                const x = g.hx + Math.sin(RELEASE_ANGLE) * rest * k;
                const y = RAIL_Y + Math.cos(RELEASE_ANGLE) * rest * k;
                r.px.push(x);
                r.py.push(y);
                r.ox.push(x);
                r.oy.push(y);
            }
            return r;
        });
    }
    function invMass(k) {
        if (k === 0) {
            return 0;
        }
        return k === ROPE_SEGMENTS ? LETTER_INV_MASS : 1;
    }
    // 마디 하나의 길이를 rest 로 되돌린다 — 두 점을 질량 역수 비율로 나눠 당기거나 민다
    function fixSegment(r, k) {
        const dx = r.px[k + 1] - r.px[k];
        const dy = r.py[k + 1] - r.py[k];
        const d = Math.max(Math.hypot(dx, dy), 0.0001);
        const wa = invMass(k);
        const wb = invMass(k + 1);
        const diff = (d - r.rest) / d / (wa + wb);
        r.px[k] += dx * diff * wa;
        r.py[k] += dy * diff * wa;
        r.px[k + 1] -= dx * diff * wb;
        r.py[k + 1] -= dy * diff * wb;
    }
    // 이웃 글자끼리 겹치면 옆으로 나눠 민다 — 매달린 간판끼리 부딪히는 자리
    function separateNeighbors() {
        for (let i = 0; i + 1 < ropes.length; i += 1) {
            const a = ropes[i];
            const b = ropes[i + 1];
            const n = ROPE_SEGMENTS;
            const minD = (a.g.w + b.g.w) / 2 + 6;
            const dx = b.px[n] - a.px[n];
            if (Math.abs(b.py[n] - a.py[n]) > (a.g.h + b.g.h) / 2 || Math.abs(dx) >= minD) {
                continue;
            }
            const push = ((minD - Math.abs(dx)) / 2) * (dx < 0 ? -1 : 1);
            a.px[n] -= push;
            b.px[n] += push;
        }
    }
    function step() {
        if (age < LEAD_MS) {
            return;
        }
        for (let i = 0; i < ropes.length; i += 1) {
            const r = ropes[i];
            // 위치 적분 — 이전 위치와의 차를 속도로 이어 받고, 공기 저항만큼 덜어 낸 뒤 중력을 더한다
            for (let k = 1; k <= ROPE_SEGMENTS; k += 1) {
                const vx = (r.px[k] - r.ox[k]) * (1 - AIR_DAMPING);
                const vy = (r.py[k] - r.oy[k]) * (1 - AIR_DAMPING);
                r.ox[k] = r.px[k];
                r.oy[k] = r.py[k];
                r.px[k] += vx;
                r.py[k] += vy + ROPE_GRAVITY;
            }
        }
        for (let it = 0; it < CONSTRAINT_ITERATIONS; it += 1) {
            for (let i = 0; i < ropes.length; i += 1) {
                const r = ropes[i];
                r.px[0] = r.ax;
                r.py[0] = RAIL_Y;
                for (let k = 0; k < ROPE_SEGMENTS; k += 1) {
                    fixSegment(r, k);
                }
                if (hand.on) {
                    for (let k = 1; k <= ROPE_SEGMENTS; k += 1) {
                        const dx = r.px[k] - hand.x;
                        const dy = r.py[k] - hand.y;
                        const d = Math.hypot(dx, dy);
                        if (d < PUSH_R && d > 0.001) {
                            r.px[k] = hand.x + (dx / d) * PUSH_R;
                            r.py[k] = hand.y + (dy / d) * PUSH_R;
                        }
                    }
                }
            }
            separateNeighbors();
        }
    }
    // 글자 傾き — 마지막 마디 방향을 글자의 아래쪽으로 삼는다
    function tiltOf(r) {
        const n = ROPE_SEGMENTS;
        return Math.atan2(-(r.px[n] - r.px[n - 1]), r.py[n] - r.py[n - 1]);
    }
    function swingSpeed() {
        let m = 0;
        for (let i = 0; i < ropes.length; i += 1) {
            const r = ropes[i];
            const n = ROPE_SEGMENTS;
            m = Math.max(m, Math.hypot(r.px[n] - r.ox[n], r.py[n] - r.oy[n]));
        }
        return m;
    }
    function stateText() { return still || (age > LEAD_MS && swingSpeed() < 0.05) ? TXT_REST : TXT_RUN; }
    function draw() {
        clearStage();
        ctx.fillStyle = rgba(FLOOR_COL, 1);
        ctx.fillRect(0, RAIL_Y - 5, W, 5);
        ctx.fillStyle = rgba(PAPER, 0.25);
        ctx.fillRect(0, RAIL_Y, W, 1);
        for (let i = 0; i < ropes.length; i += 1) {
            const r = ropes[i];
            ctx.strokeStyle = rgba(PAPER, 0.55);
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(r.px[0], r.py[0]);
            for (let k = 1; k <= ROPE_SEGMENTS; k += 1) {
                ctx.lineTo(r.px[k], r.py[k]);
            }
            ctx.stroke();
            // 마디 점 — ROPE_SEGMENTS 를 바꾸면 점 수가 바로 보인다
            ctx.fillStyle = rgba(r.g.col, 0.9);
            for (let k = 1; k < ROPE_SEGMENTS; k += 1) {
                ctx.beginPath();
                ctx.arc(r.px[k], r.py[k], 1.8, 0, TAU);
                ctx.fill();
            }
        }
        for (let i = 0; i < ropes.length; i += 1) {
            const r = ropes[i];
            const n = ROPE_SEGMENTS;
            const g = r.g;
            const tw = g.w + 14;
            const th = g.h + 12;
            ctx.save();
            ctx.translate(r.px[n], r.py[n]);
            ctx.rotate(tiltOf(r));
            // 간판 그림자 — 기운 만큼 옆으로 비켜 떨어진다
            ctx.fillStyle = rgba([0, 0, 0], 0.28);
            roundRectPath(-tw / 2 + 3, 5, tw, th, 7);
            ctx.fill();
            ctx.fillStyle = rgba(g.col, 1);
            roundRectPath(-tw / 2, 2, tw, th, 7);
            ctx.fill();
            ctx.fillStyle = rgba(BG, 1);
            ctx.beginPath();
            ctx.arc(0, 6, 2.2, 0, TAU);
            ctx.fill();
            ctx.restore();
            drawTagLetter(r, th);
        }
        if (hand.on) {
            ctx.strokeStyle = rgba(PAPER, 0.5);
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(hand.x, hand.y, PUSH_R, 0, TAU);
            ctx.stroke();
        }
    }
    function drawTagLetter(r, th) {
        const n = ROPE_SEGMENTS;
        const a = tiltOf(r);
        const cx = r.px[n] - Math.sin(a) * (2 + th / 2);
        const cy = r.py[n] + Math.cos(a) * (2 + th / 2);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(a);
        ctx.font = fontAt(r.g.size);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(INK, 1);
        ctx.fillText(r.g.ch, 0, r.g.size * 0.04);
        ctx.restore();
    }
    function demoDrive(t) { }
    let dragging = false;
    function onPointer(type, x, y) {
        if (type === 'down') {
            dragging = true;
            hand = { on: true, x: x, y: y };
            return false;
        }
        if (type === 'move' && dragging) {
            hand = { on: true, x: x, y: y };
            return true;
        }
        if (type === 'up' || type === 'leave') {
            dragging = false;
            hand = { on: false, x: 0, y: 0 };
        }
        return false;
    }
    // 방향키 — 글자(끝 점)의 이전 위치를 반대로 옮겨 그만큼 옆 속도를 준다
    function onKey(k) {
        if (k !== 'ArrowLeft' && k !== 'ArrowRight') {
            return false;
        }
        const s = k === 'ArrowLeft' ? -1 : 1;
        for (let i = 0; i < ropes.length; i += 1) {
            ropes[i].ox[ROPE_SEGMENTS] -= 7 * s;
        }
        if (age < LEAD_MS) {
            age = LEAD_MS;
        }
        return true;
    }
    function onResize() {
        fitCanvas();
        render();
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    function frame(ts) {
        if (still) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 순간이동 대신 이어서 움직인다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            if (!paused) {
                clock += FIXED_DT;
                if (demo) {
                    demoTick(clock);
                }
                tick();
            }
            acc -= FIXED_DT;
            n += 1;
        }
        render();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        lastTs = -1;
        acc = 0;
        rafId = window.requestAnimationFrame(frame);
    }
    // 동작 줄이기 설정이 페이지를 연 채 바뀌면 — 켜지면 루프를 멈추고 내려앉은 결과로, 꺼지면 루프를 다시 돈다
    function onMotionPref() {
        still = reduceQuery.matches;
        if (still) {
            if (rafId) {
                window.cancelAnimationFrame(rafId);
                rafId = 0;
            }
            after();
        }
        else {
            startLoop();
        }
    }
    if (typeof reduceQuery.addEventListener === 'function') {
        reduceQuery.addEventListener('change', onMotionPref);
    }
    restart();
    if (still) {
        after();
    }
    else {
        render();
        startLoop();
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
        if (typeof reduceQuery.removeEventListener === 'function') {
            reduceQuery.removeEventListener('change', onMotionPref);
        }
    };
})();
</script>
</body>
</html>
