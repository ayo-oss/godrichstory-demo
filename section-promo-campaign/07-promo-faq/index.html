<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo FAQ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="pf">
    <ul class="pf__list">
      <span class="pf__scan" aria-hidden="true"></span>
      <li class="pf__item is-open">
        <button type="button" class="pf__q" aria-expanded="true">할인은 언제까지 적용되나요?</button>
        <div class="pf__a"><p>마감 시각 전 결제 건까지 자동 적용됩니다.</p></div>
      </li>
      <li class="pf__item">
        <button type="button" class="pf__q" aria-expanded="false">환불도 되나요?</button>
        <div class="pf__a"><p>결제 후 7일 이내 전액 환불됩니다.</p></div>
      </li>
      <li class="pf__item">
        <button type="button" class="pf__q" aria-expanded="false">연장 신청도 가능한가요?</button>
        <div class="pf__a"><p>마감 전 재접속하면 자동으로 연장 안내가 뜹니다.</p></div>
      </li>
    </ul>
  </section>
</main>
<script>
// 실제 동작: 질문을 클릭하면 그 항목만 실제로 펼쳐지고 나머지는 닫힌다(단일 오픈).
var items = document.querySelectorAll('.pf__item');
items.forEach(function (item) {
  var q = item.querySelector('.pf__q');
  q.addEventListener('click', function () {
    var willOpen = !item.classList.contains('is-open');
    items.forEach(function (i) {
      i.classList.remove('is-open');
      i.querySelector('.pf__q').setAttribute('aria-expanded', 'false');
    });
    if (willOpen) { item.classList.add('is-open'); q.setAttribute('aria-expanded', 'true'); }
  });
});
</script>
</body>
</html>
