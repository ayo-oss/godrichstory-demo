<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo FAQ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="pf">
    <ul class="pf__list">
      <span class="pf__scan" aria-hidden="true"></span>
      <li class="pf__item is-open">
        <button type="button" class="pf__q" aria-expanded="true">How long does the discount last?</button>
        <div class="pf__a"><p>Applied automatically to any order before the deadline.</p></div>
      </li>
      <li class="pf__item">
        <button type="button" class="pf__q" aria-expanded="false">Can I get a refund?</button>
        <div class="pf__a"><p>Full refund within 7 days of payment.</p></div>
      </li>
      <li class="pf__item">
        <button type="button" class="pf__q" aria-expanded="false">Can I request an extension?</button>
        <div class="pf__a"><p>Reopen before the deadline and you'll see an extension option.</p></div>
      </li>
    </ul>
  </section>
</main>
<script>
// 실제 동작: 질문을 클릭하면 그 항목만 실제로 펼쳐지고 나머지는 닫힌다(단일 오픈).
var items = document.querySelectorAll('.pf__item');
items.forEach(function (item) {
  var q = item.querySelector('.pf__q');
  q.addEventListener('click', function () {
    var willOpen = !item.classList.contains('is-open');
    items.forEach(function (i) {
      i.classList.remove('is-open');
      i.querySelector('.pf__q').setAttribute('aria-expanded', 'false');
    });
    if (willOpen) { item.classList.add('is-open'); q.setAttribute('aria-expanded', 'true'); }
  });
});
</script>
</body>
</html>
