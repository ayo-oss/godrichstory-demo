<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discount pricing — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="dp">
    <span class="dp__badge">런칭 할인</span>
    <div class="dp__switch-row">
      <span class="dp__switch-label">연간 결제</span>
      <button type="button" class="dp__switch" role="switch" aria-checked="false"><span class="dp__knob"></span></button>
    </div>
    <div class="dp__price-wrap">
      <div class="dp__price dp__price--monthly is-active">
        <span class="dp__old">₩19,000</span>
        <span class="dp__now">₩12,900<small>/월</small></span>
      </div>
      <div class="dp__price dp__price--yearly">
        <span class="dp__old">₩228,000</span>
        <span class="dp__now">₩9,900<small>/월</small></span>
      </div>
    </div>
  </section>
</main>
<script>
// 실제 동작: 스위치를 누르면 aria-checked 가 실제로 바뀌고 월간/연간 가격판이 opacity 로 크로스페이드된다.
var sw = document.querySelector('.dp__switch');
var monthly = document.querySelector('.dp__price--monthly');
var yearly = document.querySelector('.dp__price--yearly');
sw.addEventListener('click', function () {
  var on = sw.getAttribute('aria-checked') === 'true';
  sw.setAttribute('aria-checked', String(!on));
  monthly.classList.toggle('is-active', on);
  yearly.classList.toggle('is-active', !on);
});
</script>
</body>
</html>
