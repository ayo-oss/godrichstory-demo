<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before / after — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ba">
    <div class="ba__toggle" role="group" aria-label="See comparison">
      <button type="button" class="ba__btn" data-panel="before" aria-pressed="true">Before</button>
      <button type="button" class="ba__btn" data-panel="after" aria-pressed="false">After</button>
    </div>
    <div class="ba__frame">
      <div class="ba__panel ba__panel--before" data-panel="before">
        <span class="ba__badge">Before</span>
        <span class="ba__shape"></span>
      </div>
      <div class="ba__panel ba__panel--after" data-panel="after">
        <span class="ba__badge ba__badge--after">After</span>
        <span class="ba__shape ba__shape--after"></span>
      </div>
      <span class="ba__shimmer" aria-hidden="true"></span>
    </div>
  </section>
</main>
<script>
// 실제 동작: 버튼 클릭 Hrs 두 패널 중 하나만 opacity:1 로 크로스페이드, aria-pressed 가 배타적으로 갱신된다.
var btns = document.querySelectorAll('.ba__btn');
var panels = document.querySelectorAll('.ba__panel');
btns.forEach(function (btn) {
  btn.addEventListener('click', function () {
    var name = btn.getAttribute('data-panel');
    btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b === btn)); });
    panels.forEach(function (p) { p.classList.toggle('is-active', p.getAttribute('data-panel') === name); });
  });
});
</script>
</body>
</html>
