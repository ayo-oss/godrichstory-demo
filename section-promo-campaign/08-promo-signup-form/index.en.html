<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-up form — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <form class="sf" novalidate>
    <p class="sf__title">Get the discount code</p>
    <div class="sf__row">
      <input class="sf__input" type="email" placeholder="Email address" aria-label="Email address">
      <button type="submit" class="sf__btn">
        <span class="sf__btn-label">Submit</span>
        <svg class="sf__check" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <polyline points="4,13 9,18 20,6" />
        </svg>
      </button>
    </div>
    <p class="sf__status" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
// 실제 동작: 제출 Hrs 정규식으로 이메일 형식을 검사한다. 통과하면 SVG 체크가 stroke-dashoffset 으로 그려지고, 실패하면 입력칸이 좌우로 흔들린다.
var form = document.querySelector('.sf');
var input = document.querySelector('.sf__input');
var btn = document.querySelector('.sf__btn');
var status = document.querySelector('.sf__status');
var RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
form.addEventListener('submit', function (e) {
  e.preventDefault();
  if (RE.test(input.value)) {
    btn.classList.remove('is-error');
    btn.classList.add('is-done');
    status.textContent = 'Signed up — your code is on the way';
  } else {
    btn.classList.remove('is-done');
    input.classList.remove('shake'); void input.offsetWidth;
    input.classList.add('shake');
    status.textContent = 'Check the email format';
  }
});
</script>
</body>
</html>
