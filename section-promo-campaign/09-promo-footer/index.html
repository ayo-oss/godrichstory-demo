<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo footer — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <footer class="pt">
    <span class="pt__sheen" aria-hidden="true"></span>
    <div class="pt__top">
      <span class="pt__mark" aria-hidden="true"></span>
      <p class="pt__tagline">캠페인이 끝나도 계속 씁니다</p>
    </div>
    <div class="pt__group">
      <button type="button" class="pt__group-toggle" aria-expanded="true">바로가기</button>
      <div class="pt__links-wrap is-open">
        <ul class="pt__links">
          <li><a href="#">요금제</a></li>
          <li><a href="#">이용약관</a></li>
          <li><a href="#">문의하기</a></li>
        </ul>
      </div>
    </div>
  </footer>
</main>
<script>
// 실제 동작: "바로가기" 를 누르면 aria-expanded 가 바뀌고 링크 목록이 실제로 접히고 펼쳐진다(모바일 푸터 패턴).
var toggle = document.querySelector('.pt__group-toggle');
var links = document.querySelector('.pt__links-wrap');
toggle.addEventListener('click', function () {
  var open = toggle.getAttribute('aria-expanded') === 'true';
  toggle.setAttribute('aria-expanded', String(!open));
  links.classList.toggle('is-open', !open);
});
</script>
</body>
</html>
