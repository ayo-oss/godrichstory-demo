<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature highlight — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="fh">
    <p class="fh__title">왜 지금 시작해야 할까요</p>
    <ul class="fh__list" role="list">
      <span class="fh__spot" aria-hidden="true"><span class="fh__spot-fill"></span></span>
      <li class="fh__row is-active" data-i="0" tabindex="0" role="button" aria-pressed="true">
        <span class="fh__icon">◆</span><span class="fh__label">가입 3분, 카드 등록 없음</span>
      </li>
      <li class="fh__row" data-i="1" tabindex="0" role="button" aria-pressed="false">
        <span class="fh__icon">◆</span><span class="fh__label">첫 달 요금 전액 면제</span>
      </li>
      <li class="fh__row" data-i="2" tabindex="0" role="button" aria-pressed="false">
        <span class="fh__icon">◆</span><span class="fh__label">해지 위약금 없음</span>
      </li>
    </ul>
  </section>
</main>
<script>
// 실제 동작: 1.6초마다 다음 행으로 스포트라이트가 자동 이동하고, 행을 클릭·Enter 하면 그 행으로 바로 이동한다.
var rows = Array.prototype.slice.call(document.querySelectorAll('.fh__row'));
var spot = document.querySelector('.fh__spot');
var current = 0;
function go(i) {
  current = i;
  rows.forEach(function (r, idx) {
    var on = idx === i;
    r.classList.toggle('is-active', on);
    r.setAttribute('aria-pressed', String(on));
  });
  // 실제 렌더 높이를 잰다 — 고정값을 짐작하면 반응형 구간에서 스포트라이트가 어긋난다(BD19 와 같은 병)
  var offset = rows[i].getBoundingClientRect().top - rows[0].getBoundingClientRect().top;
  spot.style.transform = 'translateY(' + offset + 'px)';
}
rows.forEach(function (r) {
  r.addEventListener('click', function () { go(Number(r.getAttribute('data-i'))); resetTimer(); });
  r.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(Number(r.getAttribute('data-i'))); resetTimer(); }
  });
});
var timer;
function resetTimer() {
  clearInterval(timer);
  timer = setInterval(function () { go((current + 1) % rows.length); }, 1600);
}
resetTimer();
</script>
</body>
</html>
