<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown hero — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ph">
    <span class="ph__blob ph__blob--a" aria-hidden="true"></span>
    <span class="ph__blob ph__blob--b" aria-hidden="true"></span>
    <div class="ph__text">
      <p class="ph__eyebrow">ローンチプロモ</p>
      <h1 class="ph__title">アーリーバード30%オフ</h1>
      <p class="ph__sub">この後は通常価格に戻ります</p>
    </div>
    <div class="ph__panel">
      <div class="ph__row" role="timer" aria-live="off">
        <div class="ph__unit"><span class="ph__num" data-u="d">02</span><span class="ph__unit-label">日</span></div>
        <span class="ph__sep">:</span>
        <div class="ph__unit"><span class="ph__num" data-u="h">14</span><span class="ph__unit-label">時</span></div>
        <span class="ph__sep">:</span>
        <div class="ph__unit"><span class="ph__num" data-u="m">36</span><span class="ph__unit-label">分</span></div>
        <span class="ph__sep">:</span>
        <div class="ph__unit"><span class="ph__num ph__num--s" data-u="s">09</span><span class="ph__unit-label">秒</span></div>
      </div>
      <button type="button" class="ph__cta" aria-pressed="false">今すぐ参加</button>
    </div>
  </section>
</main>
<script>
// 실제 동작: 목표 시각(지금부터 정확히 2日 14시간 36分 9秒 뒤)까지 1초마다 실제로 줄어든다.
var target = Date.now() + ((2 * 24 * 60 * 60) + (14 * 60 * 60) + (36 * 60) + 9) * 1000;
var els = {
  d: document.querySelector('[data-u="d"]'),
  h: document.querySelector('[data-u="h"]'),
  m: document.querySelector('[data-u="m"]'),
  s: document.querySelector('[data-u="s"]')
};
function pad(n) { return String(Math.max(0, n)).padStart(2, '0'); }
function tick() {
  var diff = Math.max(0, target - Date.now());
  var s = Math.floor(diff / 1000);
  els.d.textContent = pad(Math.floor(s / 86400));
  els.h.textContent = pad(Math.floor((s % 86400) / 3600));
  els.m.textContent = pad(Math.floor((s % 3600) / 60));
  els.s.textContent = pad(s % 60);
}
tick();
setInterval(tick, 1000);
var cta = document.querySelector('.ph__cta');
cta.addEventListener('click', function () {
  var on = cta.getAttribute('aria-pressed') === 'true';
  cta.setAttribute('aria-pressed', String(!on));
  cta.textContent = on ? '今すぐ参加' : '参加完了 ✓';
});
</script>
</body>
</html>
