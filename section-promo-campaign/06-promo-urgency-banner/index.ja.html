<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urgency banner — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ub">
    <span class="ub__live" aria-hidden="true"><span class="ub__dot"></span>LIVE</span>
    <div class="ub__body">
      <p class="ub__msg">残り<strong>5席</strong>です</p>
      <div class="ub__bar" role="progressbar" aria-valuenow="82" aria-valuemin="0" aria-valuemax="100" aria-label="枠の埋まり率">
        <span class="ub__fill"></span>
      </div>
    </div>
    <button type="button" class="ub__more" aria-pressed="false">詳しく</button>
  </section>
</main>
<script>
// 실제 동작: "詳しく" 를 누르면 aria-pressed 가 바뀌고 알림 문구가 실제로 펼쳐진다.
var btn = document.querySelector('.ub__more');
var msg = document.querySelector('.ub__msg');
var base = msg.textContent;
btn.addEventListener('click', function () {
  var on = btn.getAttribute('aria-pressed') === 'true';
  btn.setAttribute('aria-pressed', String(!on));
  msg.innerHTML = on ? '残り<strong>5席</strong>です' : '残り<strong>5席</strong>です・締切後は通常価格に戻ります';
});
</script>
</body>
</html>
