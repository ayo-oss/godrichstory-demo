<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urgency banner — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ub">
    <span class="ub__live" aria-hidden="true"><span class="ub__dot"></span>LIVE</span>
    <div class="ub__body">
      <p class="ub__msg">선착순 마감까지 <strong>5자리</strong> 남았어요</p>
      <div class="ub__bar" role="progressbar" aria-valuenow="82" aria-valuemin="0" aria-valuemax="100" aria-label="선착순 마감률">
        <span class="ub__fill"></span>
      </div>
    </div>
    <button type="button" class="ub__more" aria-pressed="false">자세히</button>
  </section>
</main>
<script>
// 실제 동작: "자세히" 를 누르면 aria-pressed 가 바뀌고 알림 문구가 실제로 펼쳐진다.
var btn = document.querySelector('.ub__more');
var msg = document.querySelector('.ub__msg');
var base = msg.textContent;
btn.addEventListener('click', function () {
  var on = btn.getAttribute('aria-pressed') === 'true';
  btn.setAttribute('aria-pressed', String(!on));
  msg.innerHTML = on ? '선착순 마감까지 <strong>5자리</strong> 남았어요' : '선착순 마감까지 <strong>5자리</strong> 남았어요 · 마감 후 정가 복귀';
});
</script>
</body>
</html>
