<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carousel That Autoplays and Pauses on Hover — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="carousel is-demo" id="carousel" role="region" aria-roledescription="carousel" aria-label="Card carousel">
  <div class="viewport" id="viewport" tabindex="0">
    <div class="slides" id="slides">
      <div class="slide isActive card--0"><span class="num">1</span></div>
      <div class="slide card--1"><span class="num">2</span></div>
      <div class="slide card--2"><span class="num">3</span></div>
      <div class="slide card--3"><span class="num">4</span></div>
      <div class="slide card--4"><span class="num">5</span></div>
    </div>
    <div class="progressTrack"><div class="progressFill" id="progressFill"></div></div>
  </div>
  <button type="button" class="navBtn navBtn--prev" id="prevBtn" aria-label="Previous card">
    <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M112 56v144l-72-72Z" opacity=".2"/><path d="M216 120h-96V56a8 8 0 0 0-13.66-5.66l-72 72a8 8 0 0 0 0 11.32l72 72A8 8 0 0 0 120 200v-64h96a8 8 0 0 0 0-16m-112 60.69L51.31 128L104 75.31Z"/></g></svg>
  </button>
  <button type="button" class="navBtn navBtn--next" id="nextBtn" aria-label="Next card">
    <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g></svg>
  </button>
  <button type="button" class="playBtn" id="playBtn" aria-label="Pause autoplay" aria-pressed="false">
    <svg class="icon icon--pause" viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="M208 48v160a8 8 0 0 1-8 8h-40a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8h40a8 8 0 0 1 8 8M96 40H56a8 8 0 0 0-8 8v160a8 8 0 0 0 8 8h40a8 8 0 0 0 8-8V48a8 8 0 0 0-8-8" opacity=".2"/><path d="M200 32h-40a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176h-40V48h40ZM96 32H56a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176H56V48h40Z"/></g></svg>
    <svg class="icon icon--play isHidden" viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="M228.23 134.69L84.15 222.81A8 8 0 0 1 72 216.12V39.88a8 8 0 0 1 12.15-6.69l144.08 88.12a7.82 7.82 0 0 1 0 13.38" opacity=".2"/><path d="M232.4 114.49L88.32 26.35a16 16 0 0 0-16.2-.3A15.86 15.86 0 0 0 64 39.87v176.26A15.94 15.94 0 0 0 80 232a16.07 16.07 0 0 0 8.36-2.35l144.04-88.14a15.81 15.81 0 0 0 0-27ZM80 215.94V40l143.83 88Z"/></g></svg>
  </button>
  <div class="readout" id="readout" aria-live="polite"></div>
</section>
</main>
<script>
(function () {
  var TOTAL = 5;
  var AUTOPLAY_MS = 1350;    // 슬라이드 한 장이 보이는 실제 지속 시간(ms) — progressFill 이 이 값까지 채워지면 넘어간다
  var CROSSFADE_MS = 280;
  var DEMO_HOVER_AT_MS = 600;   // 시연: 1주기 중간쯤에서 실제 hovering 상태를 켜 남은 시간 보존을 보여준다
  var DEMO_HOVER_DUR_MS = 520;

  var carousel = document.getElementById('carousel');
  var viewport = document.getElementById('viewport');
  var slidesEl = document.getElementById('slides');
  var slides = Array.prototype.slice.call(slidesEl.querySelectorAll('.slide'));
  var progressFill = document.getElementById('progressFill');
  var readout = document.getElementById('readout');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var playBtn = document.getElementById('playBtn');
  var iconPause = playBtn.querySelector('.icon--pause');
  var iconPlay = playBtn.querySelector('.icon--play');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var LABEL_PREFIX = 'Card ';
  var LABEL_SEP = ' / ';
  var PAUSE_LABEL = 'Pause autoplay';
  var RESUME_LABEL = 'Resume autoplay';

  var current = 0;
  var playing = !reduce;   // reduce 면 처음부터 완전히 꺼둔다(실사용 경로 자체가 재생하지 않는다)
  var hovering = false;
  var elapsed = 0;         // 이번 슬라이드에 머문 누적 시간(ms) — hovering 동안은 늘지 않는다(남은 시간 보존)
  var lastTick = 0;
  var rafId = null;
  var demoTimers = [];

  function showSlide(i) {
    slides.forEach(function (el, n) { el.classList.toggle('isActive', n === i); });
    readout.textContent = LABEL_PREFIX + (i + 1) + LABEL_SEP + TOTAL;
  }
  function advance() {
    current = (current + 1) % TOTAL;
    showSlide(current);
    elapsed = 0;
  }
  function setPlayingUI() {
    playBtn.setAttribute('aria-pressed', playing ? 'false' : 'true');
    playBtn.setAttribute('aria-label', playing ? PAUSE_LABEL : RESUME_LABEL);
    iconPause.classList.toggle('isHidden', !playing);
    iconPlay.classList.toggle('isHidden', playing);
  }

  // 계산 겹 — 매 프레임 dt 를 elapsed 에 더하되, hovering(또는 !playing) 이면 더하지 않는다.
  // 그래서 다시 풀렸을 때 처음부터가 아니라 '멈췄던 그 지점'부터 이어서 채워진다(남은 시간 보존).
  function tick(now) {
    if (!lastTick) lastTick = now;
    var dt = Math.min(48, now - lastTick);
    lastTick = now;
    if (playing && !hovering && !reduce) {
      elapsed += dt;
      if (elapsed >= AUTOPLAY_MS) { advance(); }
    }
    progressFill.style.width = (Math.min(1, elapsed / AUTOPLAY_MS) * 100).toFixed(1) + '%';
    rafId = requestAnimationFrame(tick);
  }

  function goTo(i) {
    current = ((i % TOTAL) + TOTAL) % TOTAL;
    showSlide(current);
    elapsed = 0;
  }
  function manualNav(dir) {
    goTo(current + dir);
  }

  prevBtn.addEventListener('click', function () { manualNav(-1); });
  nextBtn.addEventListener('click', function () { manualNav(1); });
  playBtn.addEventListener('click', function () {
    playing = !playing;
    lastTick = 0;
    setPlayingUI();
  });
  function onKeydown(e) {
    if (e.key === 'ArrowLeft') { manualNav(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { manualNav(1); e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'Enter') {
      if (document.activeElement === playBtn) return;
      playing = !playing; lastTick = 0; setPlayingUI(); e.preventDefault();
    }
  }
  viewport.addEventListener('keydown', onKeydown);
  viewport.addEventListener('mouseenter', function () { hovering = true; });
  viewport.addEventListener('mouseleave', function () { hovering = false; lastTick = 0; });

  // reduce: 실사용 경로 적용 — tick() 이 이미 playing=false·reduce 체크로 진행을 막는다(progressTrack 은 scss 에서 숨김).
  // 아래는 시연 전용 — is-demo 동안 실제 hovering 변수를 타이머로 잠깐 켜서 '남은 시간 보존'을 보여준다.
  function demoHoverPulse() {
    if (!carousel.classList.contains('is-demo') || reduce) return;
    demoTimers.push(setTimeout(function () {
      hovering = true;
      demoTimers.push(setTimeout(function () {
        hovering = false;
        lastTick = 0;
      }, DEMO_HOVER_DUR_MS));
    }, DEMO_HOVER_AT_MS));
  }

  function init() {
    showSlide(0);
    setPlayingUI();
    if (reduce) {
      progressFill.style.width = '0%';
      return;
    }
    demoHoverPulse();
    rafId = requestAnimationFrame(tick);
  }
  init();
})();
</script>
</body>
</html>
