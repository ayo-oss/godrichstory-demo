<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下のサムネイルが現在のカードに合わせて明るくなるカルーセル — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="carousel is-demo" id="carousel" role="region" aria-roledescription="carousel" aria-label="カードカルーセル">
  <div class="viewport" id="viewport" tabindex="0">
    <div class="mainSlide" id="mainSlide"></div>
  </div>
  <button type="button" class="navBtn navBtn--prev" id="prevBtn" aria-label="前のカード">
    <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M112 56v144l-72-72Z" opacity=".2"/><path d="M216 120h-96V56a8 8 0 0 0-13.66-5.66l-72 72a8 8 0 0 0 0 11.32l72 72A8 8 0 0 0 120 200v-64h96a8 8 0 0 0 0-16m-112 60.69L51.31 128L104 75.31Z"/></g></svg>
  </button>
  <button type="button" class="navBtn navBtn--next" id="nextBtn" aria-label="次のカード">
    <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g></svg>
  </button>
  <div class="thumbStrip" id="thumbStrip">
    <div class="thumbTrack" id="thumbTrack"></div>
  </div>
  <div class="readout" id="readout" aria-live="polite"></div>
</section>
</main>
<script>
(function () {
  var TOTAL = 5;
  var THUMB_W = 46;
  var THUMB_GAP = 10;
  var THUMB_STEP = THUMB_W + THUMB_GAP;
  var STRIP_W = 300;
  var CENTER_EASE = 0.24;   // 매 프레임 목표 오프셋으로 당기는 비율 — scrollIntoView 가 아니라 직접 보간한다
  var CENTER_STOP = 0.3;
  var DEMO_HOLD_MS = 420;

  var carousel = document.getElementById('carousel');
  var viewport = document.getElementById('viewport');
  var mainSlide = document.getElementById('mainSlide');
  var thumbStrip = document.getElementById('thumbStrip');
  var thumbTrack = document.getElementById('thumbTrack');
  var readout = document.getElementById('readout');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var LABEL_PREFIX = 'カード ';
  var LABEL_SEP = ' / ';
  var COLOR_CLASSES = ['card--0', 'card--1', 'card--2', 'card--3', 'card--4'];

  var thumbs = [];
  for (var i = 0; i < TOTAL; i++) {
    var t = document.createElement('button');
    t.type = 'button';
    t.className = 'thumb ' + COLOR_CLASSES[i];
    t.textContent = String(i + 1);
    t.setAttribute('aria-label', LABEL_PREFIX + (i + 1) + LABEL_SEP + TOTAL);
    (function (idx) { t.addEventListener('click', function () { human(); goTo(idx); }); })(i);
    thumbTrack.appendChild(t);
    thumbs.push(t);
  }

  var current = 0;
  var offset = 0;        // 썸네일 트랙의 현재 translateX(px)
  var targetOffset = 0;  // 방금 계산한 목표 translateX(px)
  var centerFrame = null;
  var demoTimers = [];

  function paintMain() {
    mainSlide.className = 'mainSlide ' + COLOR_CLASSES[current];
    mainSlide.textContent = String(current + 1);
    readout.textContent = LABEL_PREFIX + (current + 1) + LABEL_SEP + TOTAL;
    thumbs.forEach(function (el, n) { el.classList.toggle('isActive', n === current); });
  }

  // 계산 겹 — 활성 썸네일의 중심이 띠의 중심에 오도록 목표 오프셋을 산술로 구하고,
  // 트랙 폭 안으로 클램프한 뒤 매 프레임 보간(lerp)해 다가간다. 브라우저의 scrollIntoView 를 쓰지 않는다.
  function computeTargetOffset() {
    var thumbCenter = current * THUMB_STEP + THUMB_W / 2;
    var raw = STRIP_W / 2 - thumbCenter;
    var trackWidth = TOTAL * THUMB_STEP - THUMB_GAP;
    var minOffset = Math.min(0, STRIP_W - trackWidth);
    return Math.max(minOffset, Math.min(0, raw));
  }

  function stopCenter() {
    if (centerFrame) { cancelAnimationFrame(centerFrame); centerFrame = null; }
  }
  function centerActiveThumb() {
    targetOffset = computeTargetOffset();
    stopCenter();
    function frame() {
      offset += (targetOffset - offset) * CENTER_EASE;
      thumbTrack.style.transform = 'translate3d(' + offset.toFixed(1) + 'px,0,0)';
      if (Math.abs(targetOffset - offset) > CENTER_STOP) {
        centerFrame = requestAnimationFrame(frame);
      } else {
        offset = targetOffset;
        thumbTrack.style.transform = 'translate3d(' + offset.toFixed(1) + 'px,0,0)';
        centerFrame = null;
      }
    }
    centerFrame = requestAnimationFrame(frame);
  }

  function goTo(i) {
    current = ((i % TOTAL) + TOTAL) % TOTAL;
    paintMain();
    centerActiveThumb();
  }

  function human() {
    if (carousel.classList.contains('is-demo')) {
      carousel.classList.remove('is-demo');
      demoTimers.forEach(function (t) { clearTimeout(t); });
      demoTimers = [];
    }
  }

  prevBtn.addEventListener('click', function () { human(); goTo(current - 1); });
  nextBtn.addEventListener('click', function () { human(); goTo(current + 1); });
  function onKeydown(e) {
    if (e.key === 'ArrowLeft') { human(); goTo(current - 1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { human(); goTo(current + 1); e.preventDefault(); }
  }
  viewport.addEventListener('keydown', onKeydown);

  // reduce: 실사용 경로 적용 — 썸네일 클릭·버튼·키보드는 위 리스너가 그대로 중앙 정렬 계산을 돌린다.
  // 아래 demoCycle() 은 시연 게이트만이고 reduce 에서는 돌지 않는다.
  var DEMO_SEQUENCE = [2, 4, 1, 3, 0];
  function demoCycle(i) {
    if (!carousel.classList.contains('is-demo')) return;
    goTo(DEMO_SEQUENCE[i % DEMO_SEQUENCE.length]);
    demoTimers.push(setTimeout(function () { demoCycle(i + 1); }, DEMO_HOLD_MS));
  }

  function init() {
    paintMain();
    offset = computeTargetOffset();
    targetOffset = offset;
    thumbTrack.style.transform = 'translate3d(' + offset.toFixed(1) + 'px,0,0)';
    if (!reduce) demoCycle(0);
  }
  init();
})();
</script>
</body>
</html>
