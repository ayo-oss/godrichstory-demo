<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드래그한 거리만큼 카드가 입체로 눕는 커버플로 캐러셀 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="carousel is-demo" id="carousel" role="region" aria-roledescription="carousel" aria-label="카드 캐러셀">
  <div class="viewport" id="viewport" tabindex="0">
    <div class="track" id="track">
      <div class="card card--0" data-i="0"><span class="num">1</span></div>
      <div class="card card--1" data-i="1"><span class="num">2</span></div>
      <div class="card card--2" data-i="2"><span class="num">3</span></div>
      <div class="card card--3" data-i="3"><span class="num">4</span></div>
      <div class="card card--4" data-i="4"><span class="num">5</span></div>
    </div>
  </div>
  <button type="button" class="navBtn navBtn--prev" id="prevBtn" aria-label="이전 카드">
    <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M112 56v144l-72-72Z" opacity=".2"/><path d="M216 120h-96V56a8 8 0 0 0-13.66-5.66l-72 72a8 8 0 0 0 0 11.32l72 72A8 8 0 0 0 120 200v-64h96a8 8 0 0 0 0-16m-112 60.69L51.31 128L104 75.31Z"/></g></svg>
  </button>
  <button type="button" class="navBtn navBtn--next" id="nextBtn" aria-label="다음 카드">
    <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g></svg>
  </button>
  <div class="readout" id="readout" aria-live="polite"></div>
</section>
</main>
<script>
(function () {
  var TOTAL = 5;
  var CARD_SPACING = 92;   // 드래그 1px 당 인덱스 변화 계산에 쓰는 카드 간격(px)
  var ANGLE_STEP = 38;     // 중심에서 카드 1개 멀어질 때마다 더해지는 회전각(deg)
  var MAX_ANGLE = 68;
  var DEPTH_STEP = 90;     // 카드 1개 멀어질 때마다 밀어내는 translateZ(px)
  var SCALE_STEP = 0.15;
  var SCALE_FLOOR = 0.55;
  var OPACITY_STEP = 0.24;
  var OPACITY_FLOOR = 0.28;
  var SNAP_EASE = 0.22;    // 릴리스 후 가장 가까운 정수 인덱스로 당기는 보간 비율(프레임당)
  var SNAP_STOP = 0.004;
  var DEMO_HOLD_MS = 520;

  var carousel = document.getElementById('carousel');
  var viewport = document.getElementById('viewport');
  var track = document.getElementById('track');
  var readout = document.getElementById('readout');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var cards = Array.prototype.slice.call(track.querySelectorAll('.card'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var LABEL_PREFIX = '카드 ';
  var LABEL_SEP = ' / ';

  var index = 0;           // 실수 인덱스 — 드래그 중에는 소수점 그대로 반영된다
  var dragging = false;
  var dragOriginIndex = 0;
  var startX = 0;
  var snapFrame = null;
  var demoTimers = [];

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  // 계산 겹 — 카드마다 중심(index)까지의 거리(소수 가능)를 회전각·깊이·크기·투명도로 매핑한다.
  function render() {
    for (var n = 0; n < cards.length; n++) {
      var dist = n - index;
      var absDist = Math.abs(dist);
      var angle = clamp(dist * ANGLE_STEP, -MAX_ANGLE, MAX_ANGLE);
      var z = -absDist * DEPTH_STEP;
      var scale = Math.max(SCALE_FLOOR, 1 - absDist * SCALE_STEP);
      var opacity = Math.max(OPACITY_FLOOR, 1 - absDist * OPACITY_STEP);
      var x = dist * 58;
      cards[n].style.transform = 'translateX(' + x.toFixed(1) + 'px) translateZ(' + z.toFixed(1) + 'px) rotateY(' + angle.toFixed(1) + 'deg) scale(' + scale.toFixed(3) + ')';
      cards[n].style.opacity = opacity.toFixed(2);
      cards[n].style.zIndex = String(100 - Math.round(absDist * 10));
    }
    var shown = clamp(Math.round(index), 0, TOTAL - 1);
    readout.textContent = LABEL_PREFIX + (shown + 1) + LABEL_SEP + TOTAL;
  }

  function stopSnap() {
    if (snapFrame) { cancelAnimationFrame(snapFrame); snapFrame = null; }
  }

  // 릴리스 후 가장 가까운 정수 인덱스로, 또는 지정한 목표 인덱스로 매 프레임 SNAP_EASE 비율만큼 당겨 붙인다.
  function animateIndexTo(target) {
    target = clamp(target, 0, TOTAL - 1);
    function frame() {
      index += (target - index) * SNAP_EASE;
      render();
      if (Math.abs(target - index) > SNAP_STOP) {
        snapFrame = requestAnimationFrame(frame);
      } else {
        index = target;
        render();
        snapFrame = null;
      }
    }
    snapFrame = requestAnimationFrame(frame);
  }

  function human() {
    if (carousel.classList.contains('is-demo')) {
      carousel.classList.remove('is-demo');
      demoTimers.forEach(function (t) { clearTimeout(t); });
      demoTimers = [];
    }
  }

  function onPointerDown(e) {
    human();
    stopSnap();
    dragging = true;
    dragOriginIndex = index;
    startX = e.clientX;
    viewport.setPointerCapture(e.pointerId);
    track.classList.add('isDragging');
  }
  function onPointerMove(e) {
    if (!dragging) return;
    var dx = e.clientX - startX;
    index = clamp(dragOriginIndex - dx / CARD_SPACING, 0, TOTAL - 1);
    render();
  }
  function onPointerUp(e) {
    if (!dragging) return;
    dragging = false;
    track.classList.remove('isDragging');
    try { viewport.releasePointerCapture(e.pointerId); } catch (err) {}
    animateIndexTo(Math.round(index));
  }
  function go(dir) {
    human();
    stopSnap();
    animateIndexTo(clamp(Math.round(index) + dir, 0, TOTAL - 1));
  }
  function onKeydown(e) {
    if (e.key === 'ArrowLeft') { go(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { go(1); e.preventDefault(); }
  }

  viewport.addEventListener('pointerdown', onPointerDown);
  viewport.addEventListener('pointermove', onPointerMove);
  viewport.addEventListener('pointerup', onPointerUp);
  viewport.addEventListener('pointercancel', onPointerUp);
  viewport.addEventListener('keydown', onKeydown);
  prevBtn.addEventListener('click', function () { go(-1); });
  nextBtn.addEventListener('click', function () { go(1); });

  // reduce: 실사용 경로 적용 — 드래그·키보드·버튼은 위 리스너가 그대로 거리 계산을 돌린다.
  // 아래 demoCycle() 은 시연 게이트만이고 reduce 에서는 돌지 않는다.
  var DEMO_SEQUENCE = [1, 2, 3, 4, 2, 0];
  function demoCycle(i) {
    if (!carousel.classList.contains('is-demo')) return;
    animateIndexTo(DEMO_SEQUENCE[i % DEMO_SEQUENCE.length]);
    demoTimers.push(setTimeout(function () { demoCycle(i + 1); }, DEMO_HOLD_MS));
  }

  function init() {
    render();
    if (!reduce) demoCycle(0);
  }
  init();
})();
</script>
</body>
</html>
