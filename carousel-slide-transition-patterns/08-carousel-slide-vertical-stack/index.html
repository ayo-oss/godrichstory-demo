<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맨 앞 카드를 넘기면 뒤에 쌓인 카드가 깊이만큼 계산되는 세로 스택 캐러셀 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="carousel is-demo" id="carousel" role="region" aria-roledescription="carousel" aria-label="카드 캐러셀">
  <div class="viewport" id="viewport" tabindex="0">
    <div class="stack" id="stack">
      <div class="card card--0" data-i="0"><span class="num">1</span></div>
      <div class="card card--1" data-i="1"><span class="num">2</span></div>
      <div class="card card--2" data-i="2"><span class="num">3</span></div>
      <div class="card card--3" data-i="3"><span class="num">4</span></div>
      <div class="card card--4" data-i="4"><span class="num">5</span></div>
    </div>
  </div>
  <button type="button" class="navBtn navBtn--prev" id="prevBtn" aria-label="이전 카드">
    <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M112 56v144l-72-72Z" opacity=".2"/><path d="M216 120h-96V56a8 8 0 0 0-13.66-5.66l-72 72a8 8 0 0 0 0 11.32l72 72A8 8 0 0 0 120 200v-64h96a8 8 0 0 0 0-16m-112 60.69L51.31 128L104 75.31Z"/></g></svg>
  </button>
  <button type="button" class="navBtn navBtn--next" id="nextBtn" aria-label="다음 카드">
    <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g></svg>
  </button>
  <div class="readout" id="readout" aria-live="polite"></div>
</section>
</main>
<script>
(function () {
  var TOTAL = 5;
  var STACK_STEP_Y = 14;     // 깊이 1단마다 밀어내는 translateY(px)
  var STACK_SCALE_STEP = 0.07;
  var STACK_SCALE_FLOOR = 0.72;
  var STACK_OPACITY_STEP = 0.2;
  var STACK_OPACITY_FLOOR = 0.25;
  var WHEEL_COOLDOWN_MS = 420;
  var DEMO_HOLD_MS = 480;

  var carousel = document.getElementById('carousel');
  var viewport = document.getElementById('viewport');
  var stack = document.getElementById('stack');
  var cards = Array.prototype.slice.call(stack.querySelectorAll('.card'));
  var readout = document.getElementById('readout');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var LABEL_PREFIX = '카드 ';
  var LABEL_SEP = ' / ';

  // order[d] = 깊이 d(0=맨 앞) 에 있는 카드의 원래 인덱스
  var order = [0, 1, 2, 3, 4];
  var lastWheel = 0;
  var demoTimers = [];

  // 계산 겹 — 깊이 d 를 translateY·scale·opacity·z-index 로 매핑한다(선형이 아니라 바닥값으로 수렴).
  function render() {
    order.forEach(function (cardIdx, depth) {
      var el = cards[cardIdx];
      var y = depth * STACK_STEP_Y;
      var scale = Math.max(STACK_SCALE_FLOOR, 1 - depth * STACK_SCALE_STEP);
      var opacity = Math.max(STACK_OPACITY_FLOOR, 1 - depth * STACK_OPACITY_STEP);
      el.style.transform = 'translate3d(0,' + y.toFixed(1) + 'px,0) scale(' + scale.toFixed(3) + ')';
      el.style.opacity = opacity.toFixed(2);
      el.style.zIndex = String(TOTAL - depth);
    });
    readout.textContent = LABEL_PREFIX + (order[0] + 1) + LABEL_SEP + TOTAL;
  }

  function rotate(dir) {
    if (dir > 0) order.push(order.shift());
    else order.unshift(order.pop());
    render();
  }

  function human() {
    if (carousel.classList.contains('is-demo')) {
      carousel.classList.remove('is-demo');
      demoTimers.forEach(function (t) { clearTimeout(t); });
      demoTimers = [];
    }
  }

  function onCardClick(e) {
    var el = e.target.closest('.card');
    if (!el || cards.indexOf(el) !== order[0]) return; // 맨 앞 카드를 눌렀을 때만 넘긴다
    human();
    rotate(1);
  }
  function onWheel(e) {
    var now = performance.now();
    if (now - lastWheel < WHEEL_COOLDOWN_MS) { e.preventDefault(); return; }
    lastWheel = now;
    human();
    rotate(e.deltaY > 0 ? 1 : -1);
    e.preventDefault();
  }
  function onKeydown(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { human(); rotate(1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { human(); rotate(-1); e.preventDefault(); }
  }

  stack.addEventListener('click', onCardClick);
  viewport.addEventListener('wheel', onWheel, { passive: false });
  viewport.addEventListener('keydown', onKeydown);
  prevBtn.addEventListener('click', function () { human(); rotate(-1); });
  nextBtn.addEventListener('click', function () { human(); rotate(1); });

  // reduce: 실사용 경로 적용 — 카드 클릭·휠·키보드·버튼은 위 리스너가 그대로 깊이 계산을 돌린다.
  // 아래 demoCycle() 은 시연 게이트만이고 reduce 에서는 돌지 않는다.
  function demoCycle(i) {
    if (!carousel.classList.contains('is-demo')) return;
    rotate(1);
    demoTimers.push(setTimeout(function () { demoCycle(i + 1); }, DEMO_HOLD_MS));
  }

  function init() {
    render();
    if (!reduce) demoCycle(0);
  }
  init();
})();
</script>
</body>
</html>
