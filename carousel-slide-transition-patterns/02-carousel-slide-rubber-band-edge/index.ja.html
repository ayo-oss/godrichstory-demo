<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>端に触れるとゴムのように弾んで戻るカルーセル — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="carousel is-demo" id="carousel" role="region" aria-roledescription="carousel" aria-label="カードカルーセル">
  <div class="viewport" id="viewport" tabindex="0">
    <div class="track" id="track">
      <div class="card card--0"><span class="num">1</span></div>
      <div class="card card--1"><span class="num">2</span></div>
      <div class="card card--2"><span class="num">3</span></div>
      <div class="card card--3"><span class="num">4</span></div>
      <div class="card card--4"><span class="num">5</span></div>
    </div>
  </div>
  <button type="button" class="navBtn navBtn--prev" id="prevBtn" aria-label="前のカード">
    <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M112 56v144l-72-72Z" opacity=".2"/><path d="M216 120h-96V56a8 8 0 0 0-13.66-5.66l-72 72a8 8 0 0 0 0 11.32l72 72A8 8 0 0 0 120 200v-64h96a8 8 0 0 0 0-16m-112 60.69L51.31 128L104 75.31Z"/></g></svg>
  </button>
  <button type="button" class="navBtn navBtn--next" id="nextBtn" aria-label="次のカード">
    <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g></svg>
  </button>
  <div class="readout" id="readout" aria-live="polite"></div>
</section>
</main>
<script>
(function () {
  // 고무줄 저항 범위 — 경계를 넘는 거리가 아무리 커져도 시각적으로는 이 값(px)에 점근한다.
  var RUBBER_BAND_RANGE = 64;
  var SPRING_STIFFNESS = 0.22;  // 목표까지 당기는 힘의 비율
  var SPRING_DAMPING = 0.72;    // 매 프레임 속도에 곱하는 감쇠(마찰)
  var SPRING_STOP = 0.4;        // 이 이하로 좁혀지면 스프링 정지
  var STEP_MS = 16.6667;
  var DEMO_PUSH_PX = 46;
  var DEMO_HOLD_MS = 260;

  var carousel = document.getElementById('carousel');
  var viewport = document.getElementById('viewport');
  var track = document.getElementById('track');
  var readout = document.getElementById('readout');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var TOTAL = 5;
  var LABEL_PREFIX = 'カード ';
  var LABEL_SEP = ' / ';

  var pos = 0, minX = 0, maxX = 0;
  var dragging = false;
  var springFrame = null;
  var demoTimers = [];

  function bounds() {
    maxX = 0;
    minX = Math.min(0, viewport.clientWidth - track.scrollWidth);
  }
  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  // 고무줄 감쇠 함수 — 넘어간 거리 o(항상 0 이상)를 RUBBER_BAND_RANGE 에 점근하는 곡선으로 눌러준다.
  function rubber(o) {
    return RUBBER_BAND_RANGE * o / (RUBBER_BAND_RANGE + o);
  }

  function rawToVisual(raw) {
    if (raw > maxX) return maxX + rubber(raw - maxX);
    if (raw < minX) return minX - rubber(minX - raw);
    return raw;
  }

  function paint() {
    track.style.transform = 'translate3d(' + pos.toFixed(1) + 'px,0,0)';
    var step = track.scrollWidth / TOTAL;
    var idx = clamp(Math.round(-clamp(pos, minX, maxX) / step), 0, TOTAL - 1);
    readout.textContent = LABEL_PREFIX + (idx + 1) + LABEL_SEP + TOTAL;
  }

  function stopSpring() {
    if (springFrame) { cancelAnimationFrame(springFrame); springFrame = null; }
  }

  // 스프링 복귀 — pos 가 경계를 넘은 채로 있을 때만 목표(가까운 경계)까지 힘·감쇠로 당겨 돌아온다.
  function springBackIfNeeded() {
    var target = pos > maxX ? maxX : (pos < minX ? minX : null);
    if (target === null) return;
    var velocity = 0;
    function frame() {
      var force = (target - pos) * SPRING_STIFFNESS;
      velocity = (velocity + force) * SPRING_DAMPING;
      pos += velocity;
      paint();
      if (Math.abs(velocity) > SPRING_STOP || Math.abs(target - pos) > SPRING_STOP) {
        springFrame = requestAnimationFrame(frame);
      } else {
        pos = target;
        paint();
        springFrame = null;
      }
    }
    springFrame = requestAnimationFrame(frame);
  }

  function human() {
    if (carousel.classList.contains('is-demo')) {
      carousel.classList.remove('is-demo');
      demoTimers.forEach(function (t) { clearTimeout(t); });
      demoTimers = [];
    }
  }

  function onPointerDown(e) {
    human();
    stopSpring();
    dragging = true;
    track.classList.add('isDragging');
    viewport.setPointerCapture(e.pointerId);
    carousel._originPos = pos;
    carousel._startX = e.clientX;
  }
  function onPointerMove(e) {
    if (!dragging) return;
    var dx = e.clientX - carousel._startX;
    pos = rawToVisual(carousel._originPos + dx);
    paint();
  }
  function onPointerUp(e) {
    if (!dragging) return;
    dragging = false;
    track.classList.remove('isDragging');
    try { viewport.releasePointerCapture(e.pointerId); } catch (err) {}
    springBackIfNeeded();
  }
  function step(dir) {
    human();
    stopSpring();
    var stepPx = track.scrollWidth / TOTAL;
    pos = rawToVisual(clamp(pos + dir * -stepPx, minX - RUBBER_BAND_RANGE, maxX + RUBBER_BAND_RANGE));
    paint();
    springBackIfNeeded();
  }
  function onKeydown(e) {
    if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
  }

  viewport.addEventListener('pointerdown', onPointerDown);
  viewport.addEventListener('pointermove', onPointerMove);
  viewport.addEventListener('pointerup', onPointerUp);
  viewport.addEventListener('pointercancel', onPointerUp);
  viewport.addEventListener('keydown', onKeydown);
  prevBtn.addEventListener('click', function () { step(-1); });
  nextBtn.addEventListener('click', function () { step(1); });

  // reduce: 실사용 경로 적용 — 드래그·키보드·버튼은 위 리스너가 그대로 고무줄 계산을 돌린다.
  // 아래 demoCycle() 은 시연 게이트만이고 reduce 에서는 돌지 않는다.
  function pushAndRelease(target, onDone) {
    var start = performance.now();
    var from = pos;
    function frame(now) {
      if (!carousel.classList.contains('is-demo')) return;
      var p = Math.min(1, (now - start) / 220);
      pos = from + (target - from) * p;
      paint();
      if (p < 1) requestAnimationFrame(frame);
      else {
        springBackIfNeeded();
        demoTimers.push(setTimeout(onDone, DEMO_HOLD_MS + 260));
      }
    }
    requestAnimationFrame(frame);
  }
  function demoCycle(i) {
    if (!carousel.classList.contains('is-demo')) return;
    if (i % 2 === 0) {
      pos = maxX; paint();
      pushAndRelease(maxX + DEMO_PUSH_PX, function () { demoCycle(i + 1); });
    } else {
      pos = minX; paint();
      pushAndRelease(minX - DEMO_PUSH_PX, function () { demoCycle(i + 1); });
    }
  }

  function init() {
    bounds();
    paint();
    if (!reduce) demoCycle(0);
  }
  window.addEventListener('resize', bounds);
  init();
})();
</script>
</body>
</html>
