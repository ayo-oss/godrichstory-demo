<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手を離すと常にカード1枚にぴったり止まるカルーセル — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="carousel is-demo" id="carousel" role="region" aria-roledescription="carousel" aria-label="カードカルーセル">
  <div class="viewport" id="viewport" tabindex="0">
    <div class="track" id="track">
      <div class="card card--0"><span class="num">1</span></div>
      <div class="card card--1"><span class="num">2</span></div>
      <div class="card card--2"><span class="num">3</span></div>
      <div class="card card--3"><span class="num">4</span></div>
      <div class="card card--4"><span class="num">5</span></div>
    </div>
  </div>
  <button type="button" class="navBtn navBtn--prev" id="prevBtn" aria-label="前のカード">
    <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M112 56v144l-72-72Z" opacity=".2"/><path d="M216 120h-96V56a8 8 0 0 0-13.66-5.66l-72 72a8 8 0 0 0 0 11.32l72 72A8 8 0 0 0 120 200v-64h96a8 8 0 0 0 0-16m-112 60.69L51.31 128L104 75.31Z"/></g></svg>
  </button>
  <button type="button" class="navBtn navBtn--next" id="nextBtn" aria-label="次のカード">
    <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g></svg>
  </button>
  <div class="readout" id="readout" aria-live="polite"></div>
</section>
</main>
<script>
(function () {
  var TOTAL = 5;
  var SNAP_EASE = 0.24;        // 목표 스냅 위치로 매 프레임 당기는 비율
  var SNAP_STOP = 0.35;
  var SAMPLE_WINDOW_MS = 110;
  var SNAP_VELOCITY_BIAS = 0.32; // 이 속도(px/ms) 이상으로 놓으면 '가장 가까운 칸' 대신 그 방향의 다음 칸으로 판정한다
  var DEMO_FLICKS = [
    { dx: -60, fast: false },  // 느리게 살짝 — 가장 가까운 칸으로
    { dx: -40, fast: true },   // 빠르게 짧게 — 방향의 다음 칸으로(판정이 갈리는 지점)
    { dx: 70, fast: false },
    { dx: 55, fast: true }
  ];
  var DEMO_HOLD_MS = 300;

  var carousel = document.getElementById('carousel');
  var viewport = document.getElementById('viewport');
  var track = document.getElementById('track');
  var readout = document.getElementById('readout');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var LABEL_PREFIX = 'カード ';
  var LABEL_SEP = ' / ';

  var pos = 0, minX = 0, maxX = 0, step = 0;
  var dragging = false;
  var samples = [];
  var snapFrame = null;
  var demoTimers = [];

  function bounds() {
    step = track.scrollWidth / TOTAL;
    maxX = 0;
    minX = Math.min(0, viewport.clientWidth - track.scrollWidth);
  }
  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  function paint() {
    track.style.transform = 'translate3d(' + pos.toFixed(1) + 'px,0,0)';
    var idx = clamp(Math.round(-pos / step), 0, TOTAL - 1);
    readout.textContent = LABEL_PREFIX + (idx + 1) + LABEL_SEP + TOTAL;
  }

  function stopSnap() {
    if (snapFrame) { cancelAnimationFrame(snapFrame); snapFrame = null; }
  }
  function animateTo(target) {
    stopSnap();
    function frame() {
      pos += (target - pos) * SNAP_EASE;
      paint();
      if (Math.abs(target - pos) > SNAP_STOP) {
        snapFrame = requestAnimationFrame(frame);
      } else {
        pos = target;
        paint();
        snapFrame = null;
      }
    }
    snapFrame = requestAnimationFrame(frame);
  }

  // 계산 겹 — 그냥 가장 가까운 칸이 아니라, 놓는 순간의 속도가 기준(SNAP_VELOCITY_BIAS)을 넘으면
  // '가까운 칸' 판정을 그 방향의 다음 칸으로 밀어 넘긴다(빠르게 짧게 밀어도 다음 칸으로 붙는다).
  function judgeSnapIndex(rawPos, velocity) {
    var rawIndex = -rawPos / step;
    var idx = Math.round(rawIndex);
    if (Math.abs(velocity) > SNAP_VELOCITY_BIAS) {
      idx += velocity < 0 ? 1 : -1;
    }
    return clamp(idx, 0, TOTAL - 1);
  }

  function pushSample(t, x) {
    samples.push({ t: t, x: x });
    while (samples.length && t - samples[0].t > SAMPLE_WINDOW_MS) samples.shift();
  }
  function releaseVelocity() {
    if (samples.length < 2) return 0;
    var a = samples[0], b = samples[samples.length - 1];
    var dt = b.t - a.t;
    if (dt <= 0) return 0;
    return (b.x - a.x) / dt;
  }

  function human() {
    if (carousel.classList.contains('is-demo')) {
      carousel.classList.remove('is-demo');
      demoTimers.forEach(function (t) { clearTimeout(t); });
      demoTimers = [];
    }
  }

  function onPointerDown(e) {
    human();
    stopSnap();
    dragging = true;
    samples = [];
    track.classList.add('isDragging');
    viewport.setPointerCapture(e.pointerId);
    pushSample(performance.now(), e.clientX);
    carousel._originPos = pos;
    carousel._startX = e.clientX;
  }
  function onPointerMove(e) {
    if (!dragging) return;
    var dx = e.clientX - carousel._startX;
    pos = clamp(carousel._originPos + dx, minX - step * 0.6, maxX + step * 0.6);
    pushSample(performance.now(), e.clientX);
    paint();
  }
  function onPointerUp(e) {
    if (!dragging) return;
    dragging = false;
    track.classList.remove('isDragging');
    try { viewport.releasePointerCapture(e.pointerId); } catch (err) {}
    var velocity = releaseVelocity();
    var idx = judgeSnapIndex(pos, velocity);
    animateTo(-idx * step);
  }
  function step_(dir) {
    human();
    var idx = clamp(Math.round(-pos / step) + dir, 0, TOTAL - 1);
    animateTo(-idx * step);
  }
  function onKeydown(e) {
    if (e.key === 'ArrowLeft') { step_(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { step_(1); e.preventDefault(); }
  }

  viewport.addEventListener('pointerdown', onPointerDown);
  viewport.addEventListener('pointermove', onPointerMove);
  viewport.addEventListener('pointerup', onPointerUp);
  viewport.addEventListener('pointercancel', onPointerUp);
  viewport.addEventListener('keydown', onKeydown);
  prevBtn.addEventListener('click', function () { step_(-1); });
  nextBtn.addEventListener('click', function () { step_(1); });

  // reduce: 실사용 경로 적용 — 드래그·키보드·버튼은 위 리스너가 그대로 스냅 판정을 돌린다.
  // 아래 demoCycle() 은 시연 게이트만이고 reduce 에서는 돌지 않는다(가짜 포인터 이벤트 없이 같은 판정 함수만 재사용).
  function demoCycle(i) {
    if (!carousel.classList.contains('is-demo')) return;
    var f = DEMO_FLICKS[i % DEMO_FLICKS.length];
    var velocity = f.fast ? (f.dx < 0 ? -0.5 : 0.5) : (f.dx < 0 ? -0.08 : 0.08);
    var pretend = clamp(pos + f.dx, minX - step * 0.6, maxX + step * 0.6);
    var idx = judgeSnapIndex(pretend, velocity);
    pos = pretend; paint();
    animateTo(-idx * step);
    demoTimers.push(setTimeout(function () { demoCycle(i + 1); }, DEMO_HOLD_MS + 260));
  }

  function init() {
    bounds();
    paint();
    if (!reduce) demoCycle(0);
  }
  window.addEventListener('resize', bounds);
  init();
})();
</script>
</body>
</html>
