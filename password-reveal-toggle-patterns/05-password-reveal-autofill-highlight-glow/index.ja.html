<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ブラウザの自動入力を検知して広がるハイライトグロー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="afg is-demo">
    <label class="afg__label" for="afg-input">保存済みパスワード</label>
    <div class="afg__frame">
      <input id="afg-input" class="afg__input" type="password" placeholder="自動入力待ち">
    </div>
    <button type="button" class="afg__btn" id="afgBtn">自動入力を再現</button>
  </div>
</main>
<script>
(function () {
  // 기법: 실제 autofill 감지 API 는 쓰지 않는다("흉내" 버튼이 유일한 트리거).
  // 글로우는 트리거 이후 경과 t 에 대한 계산 엔벌로프(sin 상승 * exp 감쇠)를 매 프레임
  // --glow CSS 변수로 갱신해 box-shadow 가 그 변수를 읽게 한다.
  var AUTOFILL_GLOW_PULSE_MS = 900;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  var root = document.querySelector('.afg');
  var input = document.getElementById('afg-input');
  var btn = document.getElementById('afgBtn');

  var pwRand = seedRand(426051);
  var pool = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#';
  var seedValue = '';
  for (var i = 0; i < 11; i += 1) seedValue += pool[Math.floor(pwRand() * pool.length)];

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var glowRaf = 0;
  var glowStartTs = null;

  function glowTick(ts) {
    if (glowStartTs === null) glowStartTs = ts;
    var t = ts - glowStartTs;
    if (t > AUTOFILL_GLOW_PULSE_MS) {
      input.style.setProperty('--glow', '0');
      root.style.setProperty('--glow', '0');
      glowRaf = 0;
      glowStartTs = null;
      return;
    }
    var envelope = Math.max(0, Math.sin(Math.PI * t / AUTOFILL_GLOW_PULSE_MS)) * Math.exp(-2.2 * t / AUTOFILL_GLOW_PULSE_MS);
    input.style.setProperty('--glow', String(envelope));
    root.style.setProperty('--glow', String(envelope));
    glowRaf = requestAnimationFrame(glowTick);
  }

  function resetField() {
    input.value = '';
  }

  function fillAndGlow() {
    input.value = seedValue;
    if (reduce) {
      input.style.setProperty('--glow', '0');
      return;
    }
    if (glowRaf) cancelAnimationFrame(glowRaf);
    glowStartTs = null;
    glowRaf = requestAnimationFrame(glowTick);
  }

  btn.addEventListener('click', fillAndGlow);

  if (reduce) root.classList.remove('is-demo');
  if (root.classList.contains('is-demo')) {
    setTimeout(function () {
      fillAndGlow();
      setInterval(function () {
        resetField();
        fillAndGlow();
      }, 2000);
    }, 200);
  }
})();
</script>
</body>
</html>
