<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボタンを押している間に進行リングが満ちていき、満タンになって初めて文字が開く — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="phr is-demo" id="phrRoot">
  <label class="phr__label" for="phrInput">パスワード</label>
  <div class="phr__field">
    <input class="phr__input" id="phrInput" type="password" aria-describedby="phrHint">
    <button class="phr__btn" id="phrBtn" type="button" aria-pressed="false" aria-label="長押しでパスワードを表示">
      <svg class="phr__ring" viewBox="0 0 44 44" width="40" height="40" aria-hidden="true">
        <circle class="phr__ringTrack" cx="22" cy="22" r="18" fill="none" stroke-width="3"/>
        <circle class="phr__ringFg" id="phrRingFg" cx="22" cy="22" r="18" fill="none" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <svg class="phr__eye" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path class="phr__lidTop" id="phrLidTop" d="M2,12 Q12,4 22,12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path class="phr__lidBottom" id="phrLidBottom" d="M2,12 Q12,20 22,12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle class="phr__pupil" id="phrPupil" cx="12" cy="12" r="3.2" fill="currentColor"/>
      </svg>
    </button>
  </div>
  <p class="phr__hint" id="phrHint">押している時間だけリングが満ち、満タンで文字が開き、離すと即座に再び閉じる。</p>
</div>
</main>
<script>
(function () {
  // 기법: pointerdown/keydown(Space) 로 홀드를 시작하면 rAF 루프가 경과시간을 HOLD_DURATION_MS
  // 로 나눈 progress(0~1)를 계산해 SVG 링의 stroke-dashoffset 을 매 프레임 다시 쓴다. progress
  // 가 1 에 닿는 순간에만 실제 input[type] 을 text 로 바꿔 노출하고, 손을 떼거나 취소되면
  // progress·type·눈 모프를 전부 즉시 0(닫힘)으로 되돌린다 — 트윈이 아니라 "다 찼는가"라는
  // 판정 하나로 열고 닫는다.
  var root = document.getElementById('phrRoot');
  var input = document.getElementById('phrInput');
  var btn = document.getElementById('phrBtn');
  var ringFg = document.getElementById('phrRingFg');
  var lidTop = document.getElementById('phrLidTop');
  var lidBottom = document.getElementById('phrLidBottom');
  var pupil = document.getElementById('phrPupil');

  var HOLD_DURATION_MS = 900;
  var EYE_OPEN_MS = 220;
  var RING_R = 18;
  var CIRCUMFERENCE = 2 * Math.PI * RING_R;
  ringFg.style.strokeDasharray = String(CIRCUMFERENCE);
  ringFg.style.strokeDashoffset = String(CIRCUMFERENCE);

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var pwRand = seedRand(426071);
  var PW_POOL = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%';
  function pickPassword(len) {
    var out = '';
    for (var i = 0; i < len; i += 1) out += PW_POOL[Math.floor(pwRand() * PW_POOL.length)];
    return out;
  }
  input.value = pickPassword(10);

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function setEye(progress) {
    var eased = easeOutCubic(progress);
    var lift = 8 * eased;
    lidTop.setAttribute('d', 'M2,12 Q12,' + (12 - lift) + ' 22,12');
    lidBottom.setAttribute('d', 'M2,12 Q12,' + (12 + lift) + ' 22,12');
    pupil.style.opacity = String(eased);
  }
  setEye(0);

  var holding = false;
  var revealed = false;
  var holdStart = 0;
  var rafId = null;

  function setRing(progress) {
    ringFg.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - progress));
    root.style.setProperty('--phr-progress', String(progress));
  }

  function loop(ts) {
    if (!holding) return;
    var elapsed = ts - holdStart;
    var progress = Math.max(0, Math.min(1, elapsed / HOLD_DURATION_MS));
    setRing(progress);
    if (progress >= 1 && !revealed) {
      revealed = true;
      input.type = 'text';
      btn.setAttribute('aria-pressed', 'true');
    }
    var eyeProgress = revealed ? 1 : Math.max(0, Math.min(1, elapsed / EYE_OPEN_MS));
    setEye(eyeProgress);
    rafId = requestAnimationFrame(loop);
  }

  function startHold() {
    if (holding) return;
    holding = true;
    revealed = false;
    holdStart = performance.now();
    rafId = requestAnimationFrame(loop);
  }

  function endHold() {
    if (!holding) return;
    holding = false;
    revealed = false;
    input.type = 'password';
    btn.setAttribute('aria-pressed', 'false');
    setRing(0);
    setEye(0);
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
  }

  btn.addEventListener('pointerdown', function (e) { e.preventDefault(); startHold(); });
  btn.addEventListener('pointerup', endHold);
  btn.addEventListener('pointercancel', endHold);
  btn.addEventListener('pointerleave', endHold);

  btn.addEventListener('keydown', function (e) {
    if (e.code !== 'Space') return;
    e.preventDefault();
    if (e.repeat) return;
    startHold();
  });
  btn.addEventListener('keyup', function (e) {
    if (e.code !== 'Space') return;
    e.preventDefault();
    endHold();
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) root.classList.remove('is-demo');

  function demoLoop() {
    if (!root.classList.contains('is-demo')) return;
    startHold();
    setTimeout(function () {
      endHold();
      setTimeout(demoLoop, 1300);
    }, HOLD_DURATION_MS + 400);
  }
  if (!reduce) setTimeout(demoLoop, 200);
})();
</script>
</body>
</html>
