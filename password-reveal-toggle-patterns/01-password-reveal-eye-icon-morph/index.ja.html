<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字と点が入れ替わる目のアイコンのモーフ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pem is-demo" id="pemRoot">
  <form class="pem__form" id="pemForm" novalidate>
    <label class="pem__field">
      <span class="pem__labelText">パスワード</span>
      <span class="pem__inputWrap">
        <input class="pem__input" id="pemInput" type="password" autocomplete="new-password" spellcheck="false" value="">
        <span class="pem__overlay" id="pemOverlay" aria-hidden="true"></span>
        <button class="pem__toggle" id="pemToggle" type="button" aria-pressed="false" aria-label="パスワードを表示">
          <svg class="pem__eye" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path class="pem__lidTop" id="pemLidTop" d="M2,12 Q12,4 22,12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path class="pem__lidBottom" id="pemLidBottom" d="M2,12 Q12,20 22,12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle class="pem__pupil" id="pemPupil" cx="12" cy="12" r="3.2" fill="currentColor"/>
          </svg>
        </button>
      </span>
    </label>
  </form>
</div>
<script>
(function () {
  // 기법: 실제 input 의 type 을 password/text 로 진짜 토글하면서, 그 위에 문자별 span 오버레이
  // (점 마스크 레이어 + 실제 글자 레이어)를 얹어 opacity 크로스페이드로 보여준다. input 자체 글자는
  // color:transparent 로 숨기고 caret-color 만 남긴다. 눈 아이콘은 상태 스위치가 아니라 매 프레임
  // 베지어 제어점(ctrlY)을 다시 계산해 눈꺼풀이 감기고 뜨이는 것처럼 그린다.
  var root = document.getElementById('pemRoot');
  var form = document.getElementById('pemForm');
  var input = document.getElementById('pemInput');
  var overlay = document.getElementById('pemOverlay');
  var toggle = document.getElementById('pemToggle');
  var lidTop = document.getElementById('pemLidTop');
  var lidBottom = document.getElementById('pemLidBottom');
  var pupil = document.getElementById('pemPupil');

  var EYE_MORPH_MS = 260;
  var CHAR_STAGGER_MS = 28;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var pwRand = seedRand(426011);
  var POOL_UPPER = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  var POOL_LOWER = 'abcdefghijkmnpqrstuvwxyz';
  var POOL_DIGIT = '23456789';
  var POOL_SYMBOL = '!@#$%*?-';
  var POOL_ALL = POOL_UPPER + POOL_LOWER + POOL_DIGIT + POOL_SYMBOL;
  function makeFakePassword() {
    var len = 8 + Math.floor(pwRand() * 5);
    var out = '';
    for (var i = 0; i < len; i += 1) out += POOL_ALL.charAt(Math.floor(pwRand() * POOL_ALL.length));
    return out;
  }
  var FAKE_PW = makeFakePassword();
  input.value = FAKE_PW;

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  var LABEL_SHOW = 'パスワードを表示';
  var LABEL_HIDE = 'パスワードを隠す';

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function buildOverlay(value) {
    overlay.textContent = '';
    for (var i = 0; i < value.length; i += 1) {
      var ch = document.createElement('span');
      ch.className = 'pem__ch';
      var delay = (i * CHAR_STAGGER_MS) + 'ms';
      var mask = document.createElement('span');
      mask.className = 'pem__mask';
      mask.style.transitionDelay = delay;
      mask.textContent = String.fromCharCode(8226);
      var real = document.createElement('span');
      real.className = 'pem__char';
      real.style.transitionDelay = delay;
      real.textContent = value.charAt(i);
      ch.appendChild(mask);
      ch.appendChild(real);
      overlay.appendChild(ch);
    }
  }
  buildOverlay(FAKE_PW);

  input.addEventListener('input', function () {
    buildOverlay(input.value);
  });

  var eyeProgress = 0;
  var eyeRaf = null;
  function paintEye(progress) {
    var eased = easeOutCubic(progress);
    var topY = 12 - 8 * eased;
    var botY = 12 + 8 * eased;
    lidTop.setAttribute('d', 'M2,12 Q12,' + topY + ' 22,12');
    lidBottom.setAttribute('d', 'M2,12 Q12,' + botY + ' 22,12');
    pupil.style.opacity = String(eased);
  }
  paintEye(eyeProgress);

  function animateEyeStep(ts) {
    if (animT0 === null) animT0 = ts;
    var elapsed = ts - animT0;
    var p = Math.min(1, elapsed / EYE_MORPH_MS);
    eyeProgress = animStart + (animTarget - animStart) * p;
    paintEye(eyeProgress);
    if (p < 1) { eyeRaf = requestAnimationFrame(animateEyeStep); }
    else { eyeRaf = null; eyeProgress = animTarget; paintEye(eyeProgress); }
  }
  var animT0 = null, animStart = 0, animTarget = 0;
  function animateEyeTo(target) {
    if (eyeRaf) { cancelAnimationFrame(eyeRaf); eyeRaf = null; }
    if (reduce) { eyeProgress = target; paintEye(eyeProgress); return; }
    animStart = eyeProgress;
    animTarget = target;
    animT0 = null;
    eyeRaf = requestAnimationFrame(animateEyeStep);
  }

  var revealed = false;
  function setRevealed(next) {
    revealed = next;
    input.type = revealed ? 'text' : 'password';
    root.classList.toggle('pem--revealed', revealed);
    toggle.setAttribute('aria-pressed', String(revealed));
    toggle.setAttribute('aria-label', revealed ? LABEL_HIDE : LABEL_SHOW);
    animateEyeTo(revealed ? 1 : 0);
  }

  toggle.addEventListener('click', function () {
    root.classList.remove('is-demo');
    setRevealed(!revealed);
  });

  form.addEventListener('submit', function (e) { e.preventDefault(); });

  if (reduce) { root.classList.remove('is-demo'); }

  function demoLoop() {
    if (reduce) return;
    setRevealed(true);
    setTimeout(function () { setRevealed(false); }, 900);
    setTimeout(demoLoop, 2000);
  }
  if (!reduce) { setTimeout(demoLoop, 200); }
})();
</script>
</main>
</body>
</html>
