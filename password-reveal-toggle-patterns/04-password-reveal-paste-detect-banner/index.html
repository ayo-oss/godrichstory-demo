<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>붙여넣기를 감지해 밀려나오는 안내 배너 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pdb is-demo">
    <label class="pdb__label" for="pdb-input">비밀번호</label>
    <div class="pdb__frame">
      <input id="pdb-input" class="pdb__input" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
    </div>
    <p class="pdb__banner" id="pdbBanner" aria-live="polite"></p>
  </div>
</main>
<script>
(function () {
  // 기법: 실제 input paste 이벤트를 그대로 트리거로 쓴다(값 자체는 읽지 않는다).
  // 배너는 슬라이드+opacity 로 필드 아래에서 나타났다가 일정 시간 뒤 같은 방식으로 사라진다.
  var PASTE_BANNER_SLIDE_MS = 320;
  var PASTE_BANNER_VISIBLE_MS = 1400;
  var BANNER_MESSAGE = '비밀번호 관리자에서 붙여넣은 값을 확인하세요';

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  var root = document.querySelector('.pdb');
  var input = document.getElementById('pdb-input');
  var banner = document.getElementById('pdbBanner');

  root.style.setProperty('--pdbSlideMs', PASTE_BANNER_SLIDE_MS + 'ms');

  var hideTimer = null;
  var clearTimer = null;

  function handlePaste() {
    clearTimeout(hideTimer);
    clearTimeout(clearTimer);
    banner.textContent = BANNER_MESSAGE;
    banner.classList.add('is-visible');
    hideTimer = setTimeout(function () {
      banner.classList.remove('is-visible');
      clearTimer = setTimeout(function () { banner.textContent = ''; }, PASTE_BANNER_SLIDE_MS);
    }, PASTE_BANNER_VISIBLE_MS);
  }

  input.addEventListener('paste', function () { handlePaste(); });

  var pasteRand = seedRand(426041);
  var pool = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  var fakeValue = '';
  for (var i = 0; i < 10; i += 1) fakeValue += pool[Math.floor(pasteRand() * pool.length)];

  function simulatePaste() {
    input.value = fakeValue;
    handlePaste();
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) root.classList.remove('is-demo');
  if (root.classList.contains('is-demo')) {
    setTimeout(function () {
      simulatePaste();
      setInterval(simulatePaste, 2000);
    }, 200);
  }
})();
</script>
</body>
</html>
