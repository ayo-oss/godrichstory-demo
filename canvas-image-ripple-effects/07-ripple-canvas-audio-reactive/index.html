<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>합성된 오디오 레벨 곡선이 커질 때마다 이미지 표면에 물결이 세게 친다 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rv is-demo" id="rvRoot">
  <canvas class="rv__canvas" id="rvCanvas" width="480" height="300"></canvas>
  <p class="rv__caption">합성된 오디오 레벨 곡선이 커질 때마다 이미지 표면에 물결이 세게 친다</p>
  <div class="rv__control">
    <label class="rv__label" for="rvGain">반응 세기</label>
    <input class="rv__range" id="rvGain" type="range" min="10" max="160" value="40" step="1" aria-label="반응 세기">
  </div>
</div>
</main>
<script>
(function () {
  // 기법: 실제 마이크·파일 없이 시간 함수로 합성한 가상 오디오 레벨 곡선(virtualAudioLevel)을 만든다.
  // 레벨이 문턱을 넘을 때마다 높이 필드 2버퍼 파동식에 임펄스를 찍어 RIPPLE_AUDIO_GAIN 배율로 세기를 조절한다.
  var root = document.getElementById('rvRoot');
  var canvas = document.getElementById('rvCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;
  var gainInput = document.getElementById('rvGain');

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  function drawPhotoBase(pctx, w, h, seed) {
    var rand = seedRand(seed);
    var sky = pctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#2a1640');
    sky.addColorStop(1, '#5c2a6b');
    pctx.fillStyle = sky;
    pctx.fillRect(0, 0, w, h);
    var sunX = w * 0.62, sunY = h * 0.24, sunR = h * 0.14;
    var glow = pctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 2.8);
    glow.addColorStop(0, 'rgba(255,140,200,.75)');
    glow.addColorStop(1, 'rgba(255,140,200,0)');
    pctx.fillStyle = glow;
    pctx.fillRect(0, 0, w, h);
    pctx.beginPath();
    pctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
    pctx.fillStyle = '#ffd6f2';
    pctx.fill();
    var hillColors = ['#7a3b8a', '#4a2364', '#251140'];
    for (var i = 0; i < hillColors.length; i += 1) {
      var baseY = h * (0.5 + i * 0.14);
      pctx.beginPath();
      pctx.moveTo(0, h);
      var step = Math.max(2, w / 24);
      for (var x = 0; x <= w; x += step) {
        var n = Math.sin(x * 0.06 + i * 2 + seed * 0.0003) * h * 0.04;
        pctx.lineTo(x, baseY + n);
      }
      pctx.lineTo(w, h);
      pctx.closePath();
      pctx.fillStyle = hillColors[i];
      pctx.fill();
    }
    for (var k = 0; k < 60; k += 1) {
      var px = rand() * w, py = rand() * h * 0.6, r = rand() * 1.2 + 0.3;
      pctx.beginPath();
      pctx.arc(px, py, r, 0, Math.PI * 2);
      pctx.fillStyle = 'rgba(255,255,255,' + (0.12 + rand() * 0.22) + ')';
      pctx.fill();
    }
  }

  var CALC_W = 160, CALC_H = 100;
  var RIPPLE_AUDIO_GAIN = 0.4;

  var gridA = new Float32Array(CALC_W * CALC_H);
  var gridB = new Float32Array(CALC_W * CALC_H);
  var damping = 0.965;

  function cellIndex(x, y) { return y * CALC_W + x; }

  function splashAt(gx, gy, amp) {
    gx = Math.round(gx); gy = Math.round(gy);
    for (var dy = -1; dy <= 1; dy += 1) {
      for (var dx = -1; dx <= 1; dx += 1) {
        var x = gx + dx, y = gy + dy;
        if (x > 0 && x < CALC_W - 1 && y > 0 && y < CALC_H - 1) {
          gridA[cellIndex(x, y)] += amp * (dx === 0 && dy === 0 ? 1 : 0.4);
        }
      }
    }
  }

  function stepWave() {
    for (var y = 1; y < CALC_H - 1; y += 1) {
      var row = y * CALC_W;
      for (var x = 1; x < CALC_W - 1; x += 1) {
        var i = row + x;
        var next = (gridA[i - 1] + gridA[i + 1] + gridA[i - CALC_W] + gridA[i + CALC_W]) / 2 - gridB[i];
        gridB[i] = next * damping;
      }
    }
    var t = gridA; gridA = gridB; gridB = t;
  }

  var off = document.createElement('canvas');
  off.width = CALC_W; off.height = CALC_H;
  var octx = off.getContext('2d');
  drawPhotoBase(octx, CALC_W, CALC_H, 419071);
  var baseImg = octx.getImageData(0, 0, CALC_W, CALC_H);
  var baseBuf = baseImg.data;

  var out = document.createElement('canvas');
  out.width = CALC_W; out.height = CALC_H;
  var outCtx = out.getContext('2d');
  var outImg = outCtx.createImageData(CALC_W, CALC_H);
  var outBuf = outImg.data;

  function sampleBase(sx, sy) {
    sx = sx < 0 ? 0 : (sx > CALC_W - 1 ? CALC_W - 1 : sx);
    sy = sy < 0 ? 0 : (sy > CALC_H - 1 ? CALC_H - 1 : sy);
    var i = (Math.round(sy) * CALC_W + Math.round(sx)) * 4;
    return [baseBuf[i], baseBuf[i + 1], baseBuf[i + 2]];
  }

  function renderField() {
    var idx = 0;
    for (var y = 0; y < CALC_H; y += 1) {
      var row = y * CALC_W;
      for (var x = 0; x < CALC_W; x += 1) {
        var i = row + x;
        var hl = x > 0 ? gridA[i - 1] : gridA[i];
        var hr = x < CALC_W - 1 ? gridA[i + 1] : gridA[i];
        var hu = y > 0 ? gridA[i - CALC_W] : gridA[i];
        var hd = y < CALC_H - 1 ? gridA[i + CALC_W] : gridA[i];
        var dx = (hr - hl) * 0.8;
        var dy = (hd - hu) * 0.8;
        var rgb = sampleBase(x + dx, y + dy);
        var shine = Math.max(-30, Math.min(60, (hu - hd) * 0.5));
        outBuf[idx] = Math.max(0, Math.min(255, rgb[0] + shine));
        outBuf[idx + 1] = Math.max(0, Math.min(255, rgb[1] + shine));
        outBuf[idx + 2] = Math.max(0, Math.min(255, rgb[2] + shine));
        outBuf[idx + 3] = 255;
        idx += 4;
      }
    }
  }

  function virtualAudioLevel(t) {
    var beat = Math.pow(Math.abs(Math.sin(t * 0.0026)), 3);
    var pulse = Math.pow(Math.abs(Math.sin(t * 0.00071 + 1.3)), 5);
    var flicker = 0.5 + 0.5 * Math.sin(t * 0.021);
    var level = beat * 0.6 + pulse * 0.5 + flicker * 0.15;
    return Math.max(0, Math.min(1, level));
  }

  var cw = 480, ch = 300;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    draw();
  }

  function draw() {
    renderField();
    outCtx.putImageData(outImg, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(out, 0, 0, CALC_W, CALC_H, 0, 0, cw, ch);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var playing = !reduce;
  if (reduce) { root.classList.remove('is-demo'); }

  var gainMul = parseFloat(gainInput.value);
  gainInput.addEventListener('input', function () {
    gainMul = parseFloat(gainInput.value);
    if (reduce) { splashAt(CALC_W * 0.5, CALC_H * 0.5, RIPPLE_AUDIO_GAIN * gainMul * 6); draw(); }
  });

  var lastBeatIdx = -1;
  var BEAT_INTERVAL_MS = 220;
  var lastTs = null;
  var elapsed = 0;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = ts - lastTs;
    lastTs = ts;
    if (playing) {
      elapsed += dt;
      var beatIdx = Math.floor(elapsed / BEAT_INTERVAL_MS);
      if (beatIdx !== lastBeatIdx) {
        lastBeatIdx = beatIdx;
        var level = virtualAudioLevel(elapsed);
        if (level > 0.25) {
          var gx = CALC_W * (0.3 + 0.4 * ((Math.sin(elapsed * 0.0017) + 1) / 2));
          var gy = CALC_H * (0.3 + 0.4 * ((Math.cos(elapsed * 0.0013) + 1) / 2));
          splashAt(gx, gy, -level * RIPPLE_AUDIO_GAIN * gainMul * 10);
        }
      }
      stepWave();
      draw();
    }
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  splashAt(CALC_W * 0.5, CALC_H * 0.5, -RIPPLE_AUDIO_GAIN * gainMul * 6);
  draw();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
