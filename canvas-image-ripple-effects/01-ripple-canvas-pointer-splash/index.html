<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포인터가 지나간 자리마다 동심원 물결이 퍼지며 이미지 픽셀을 밀어낸다 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rv is-demo" id="rvRoot">
  <canvas class="rv__canvas" id="rvCanvas" width="480" height="300"></canvas>
  <p class="rv__caption">포인터가 지나간 자리마다 동심원 물결이 퍼지며 이미지 픽셀을 밀어낸다</p>
</div>
</main>
<script>
(function () {
  // 기법: 높이 필드 2버퍼 전파(감쇠 파동식) 위에 포인터가 지나가는 자리마다 임펄스를 찍는다.
  // 높이 기울기를 픽셀 변위(굴절 오프셋)로 써서 절차적 "사진"을 getImageData/putImageData 로 다시 그린다.
  var root = document.getElementById('rvRoot');
  var canvas = document.getElementById('rvCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  function drawPhotoBase(pctx, w, h, seed) {
    var rand = seedRand(seed);
    var sky = pctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#bfe3ff');
    sky.addColorStop(1, '#fff3da');
    pctx.fillStyle = sky;
    pctx.fillRect(0, 0, w, h);
    var sunX = w * 0.7, sunY = h * 0.24, sunR = h * 0.15;
    var glow = pctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 2.6);
    glow.addColorStop(0, 'rgba(255,247,225,.9)');
    glow.addColorStop(1, 'rgba(255,247,225,0)');
    pctx.fillStyle = glow;
    pctx.fillRect(0, 0, w, h);
    pctx.beginPath();
    pctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
    pctx.fillStyle = '#ffe27a';
    pctx.fill();
    var hillColors = ['#8fd0c7', '#4a9d8f', '#215a56'];
    for (var i = 0; i < hillColors.length; i += 1) {
      var baseY = h * (0.5 + i * 0.14);
      pctx.beginPath();
      pctx.moveTo(0, h);
      var step = Math.max(2, w / 24);
      for (var x = 0; x <= w; x += step) {
        var n = Math.sin(x * 0.06 + i * 2.3 + seed * 0.0003) * h * 0.045 + Math.sin(x * 0.16 + i) * h * 0.02;
        pctx.lineTo(x, baseY + n);
      }
      pctx.lineTo(w, h);
      pctx.closePath();
      pctx.fillStyle = hillColors[i];
      pctx.fill();
    }
    for (var k = 0; k < 60; k += 1) {
      var px = rand() * w, py = rand() * h * 0.5, r = rand() * 1.3 + 0.3;
      pctx.beginPath();
      pctx.arc(px, py, r, 0, Math.PI * 2);
      pctx.fillStyle = 'rgba(255,255,255,' + (0.12 + rand() * 0.22) + ')';
      pctx.fill();
    }
  }

  var CALC_W = 160, CALC_H = 100;
  var LOOP_MS = 2000;
  var RIPPLE_SPLASH_DECAY_MS = 400;
  var SPLASH_AMP = -520;
  var REFRACT_K = 0.9;

  var gridA = new Float32Array(CALC_W * CALC_H);
  var gridB = new Float32Array(CALC_W * CALC_H);
  var damping = Math.pow(0.02, 16 / RIPPLE_SPLASH_DECAY_MS);

  function cellIndex(x, y) { return y * CALC_W + x; }

  function splashAt(gx, gy) {
    gx = Math.round(gx); gy = Math.round(gy);
    for (var dy = -1; dy <= 1; dy += 1) {
      for (var dx = -1; dx <= 1; dx += 1) {
        var x = gx + dx, y = gy + dy;
        if (x > 0 && x < CALC_W - 1 && y > 0 && y < CALC_H - 1) {
          gridA[cellIndex(x, y)] += SPLASH_AMP * (dx === 0 && dy === 0 ? 1 : 0.45);
        }
      }
    }
  }

  function stepWave() {
    for (var y = 1; y < CALC_H - 1; y += 1) {
      var row = y * CALC_W;
      for (var x = 1; x < CALC_W - 1; x += 1) {
        var i = row + x;
        var next = (gridA[i - 1] + gridA[i + 1] + gridA[i - CALC_W] + gridA[i + CALC_W]) / 2 - gridB[i];
        gridB[i] = next * damping;
      }
    }
    var t = gridA; gridA = gridB; gridB = t;
  }

  var off = document.createElement('canvas');
  off.width = CALC_W; off.height = CALC_H;
  var octx = off.getContext('2d');
  drawPhotoBase(octx, CALC_W, CALC_H, 419011);
  var baseImg = octx.getImageData(0, 0, CALC_W, CALC_H);
  var baseBuf = baseImg.data;

  var out = document.createElement('canvas');
  out.width = CALC_W; out.height = CALC_H;
  var outCtx = out.getContext('2d');
  var outImg = outCtx.createImageData(CALC_W, CALC_H);
  var outBuf = outImg.data;

  function sampleBase(sx, sy) {
    sx = sx < 0 ? 0 : (sx > CALC_W - 1 ? CALC_W - 1 : sx);
    sy = sy < 0 ? 0 : (sy > CALC_H - 1 ? CALC_H - 1 : sy);
    var i = (Math.round(sy) * CALC_W + Math.round(sx)) * 4;
    return [baseBuf[i], baseBuf[i + 1], baseBuf[i + 2]];
  }

  function renderField() {
    var idx = 0;
    for (var y = 0; y < CALC_H; y += 1) {
      var row = y * CALC_W;
      for (var x = 0; x < CALC_W; x += 1) {
        var i = row + x;
        var hl = x > 0 ? gridA[i - 1] : gridA[i];
        var hr = x < CALC_W - 1 ? gridA[i + 1] : gridA[i];
        var hu = y > 0 ? gridA[i - CALC_W] : gridA[i];
        var hd = y < CALC_H - 1 ? gridA[i + CALC_W] : gridA[i];
        var dx = (hr - hl) * REFRACT_K;
        var dy = (hd - hu) * REFRACT_K;
        var rgb = sampleBase(x + dx, y + dy);
        var shine = Math.max(-30, Math.min(60, (hu - hd) * 0.6));
        outBuf[idx] = Math.max(0, Math.min(255, rgb[0] + shine));
        outBuf[idx + 1] = Math.max(0, Math.min(255, rgb[1] + shine));
        outBuf[idx + 2] = Math.max(0, Math.min(255, rgb[2] + shine));
        outBuf[idx + 3] = 255;
        idx += 4;
      }
    }
  }

  var cw = 480, ch = 300;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    draw();
  }

  function draw() {
    renderField();
    outCtx.putImageData(outImg, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(out, 0, 0, CALC_W, CALC_H, 0, 0, cw, ch);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var playing = !reduce;
  if (reduce) { root.classList.remove('is-demo'); }

  var pointerActive = false;
  var lastSplashMs = -9999;
  function toGrid(e) {
    var r = wrap.getBoundingClientRect();
    var t0 = (e.touches && e.touches[0]) ? e.touches[0] : e;
    var relX = (t0.clientX - r.left) / r.width * CALC_W;
    var relY = (t0.clientY - r.top) / r.height * CALC_H;
    return { x: relX, y: relY };
  }
  wrap.addEventListener('pointerdown', function (e) {
    pointerActive = true;
    var g = toGrid(e);
    splashAt(g.x, g.y);
    lastSplashMs = performance.now();
    if (reduce) draw();
  });
  wrap.addEventListener('pointermove', function (e) {
    if (!pointerActive && e.pressure === 0 && e.pointerType === 'mouse') { /* hover still allowed below */ }
    var g = toGrid(e);
    var now = performance.now();
    if (now - lastSplashMs > 90) {
      splashAt(g.x, g.y);
      lastSplashMs = now;
      if (reduce) draw();
    }
  });
  wrap.addEventListener('pointerup', function () { pointerActive = false; });
  wrap.addEventListener('pointerleave', function () { pointerActive = false; });
  var keySplashRand = seedRand(419012);
  wrap.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      splashAt(CALC_W / 2 + (keySplashRand() - 0.5) * 20, CALC_H / 2);
      if (reduce) draw();
    }
  });
  wrap.tabIndex = 0;

  var VIRTUAL_INTERVAL_MS = 460;
  var lastVirtualMs = -9999;
  function virtualPointerOrbit(t) {
    var cx = CALC_W * (0.28 + 0.44 * ((Math.sin(t * 0.0013) + 1) / 2));
    var cy = CALC_H * (0.3 + 0.4 * ((Math.cos(t * 0.0019) + 1) / 2));
    return { x: cx, y: cy };
  }

  var lastTs = null;
  var elapsed = 0;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = ts - lastTs;
    lastTs = ts;
    if (playing) {
      elapsed += dt;
      if (!pointerActive && elapsed - lastVirtualMs > VIRTUAL_INTERVAL_MS) {
        var p = virtualPointerOrbit(elapsed);
        splashAt(p.x, p.y);
        lastVirtualMs = elapsed;
      }
      stepWave();
      draw();
    }
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  splashAt(CALC_W * 0.5, CALC_H * 0.45);
  draw();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
