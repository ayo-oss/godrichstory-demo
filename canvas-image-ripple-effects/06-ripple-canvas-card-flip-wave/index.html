<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클릭하면 물결 전선이 화면을 가로지르며 지나간 자리부터 뒷면 이미지로 뒤집힌다 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rv is-demo" id="rvRoot" tabindex="0">
  <canvas class="rv__canvas" id="rvCanvas" width="480" height="300"></canvas>
  <p class="rv__caption">클릭하면 물결 전선이 화면을 가로지르며 지나간 자리부터 뒷면 이미지로 뒤집힌다</p>
</div>
</main>
<script>
(function () {
  // 기법: 좌→우로 진행하는 파동 전선의 x 위치를 시간으로 계산해, 전선을 지난 열은 뒷면 이미지, 못 지난 열은 앞면 이미지를 샘플링한다.
  // 전선 경계에는 sin 오프셋을 더해 직선 와이프가 아니라 물결이 훑고 지나가는 모양으로 만든다.
  var root = document.getElementById('rvRoot');
  var canvas = document.getElementById('rvCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  function drawPhotoBase(pctx, w, h, seed, palette) {
    var rand = seedRand(seed);
    var sky = pctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, palette[0]);
    sky.addColorStop(1, palette[1]);
    pctx.fillStyle = sky;
    pctx.fillRect(0, 0, w, h);
    var sunX = w * 0.35, sunY = h * 0.25, sunR = h * 0.15;
    var glow = pctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 2.5);
    glow.addColorStop(0, palette[2]);
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    pctx.fillStyle = glow;
    pctx.fillRect(0, 0, w, h);
    pctx.beginPath();
    pctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
    pctx.fillStyle = palette[3];
    pctx.fill();
    for (var i = 0; i < palette[4].length; i += 1) {
      var baseY = h * (0.5 + i * 0.14);
      pctx.beginPath();
      pctx.moveTo(0, h);
      var step = Math.max(2, w / 24);
      for (var x = 0; x <= w; x += step) {
        var n = Math.sin(x * 0.06 + i * 2 + seed * 0.0003) * h * 0.04;
        pctx.lineTo(x, baseY + n);
      }
      pctx.lineTo(w, h);
      pctx.closePath();
      pctx.fillStyle = palette[4][i];
      pctx.fill();
    }
    for (var k = 0; k < 48; k += 1) {
      var px = rand() * w, py = rand() * h * 0.5, r = rand() * 1.1 + 0.3;
      pctx.beginPath();
      pctx.arc(px, py, r, 0, Math.PI * 2);
      pctx.fillStyle = 'rgba(255,255,255,' + (0.1 + rand() * 0.2) + ')';
      pctx.fill();
    }
  }

  var CALC_W = 160, CALC_H = 100;
  var CARD_FLIP_MS = 900;
  var FRONT_BAND = 9;

  function makeBase(seed, palette) {
    var c = document.createElement('canvas');
    c.width = CALC_W; c.height = CALC_H;
    var cx = c.getContext('2d');
    drawPhotoBase(cx, CALC_W, CALC_H, seed, palette);
    return cx.getImageData(0, 0, CALC_W, CALC_H).data;
  }

  var bufFront = makeBase(419061, ['#ffe3b0', '#fff8ea', 'rgba(255,255,255,.85)', '#ffcf6b', ['#f0a35a', '#c76b34', '#6a331a']]);
  var bufBack = makeBase(419062, ['#c9e8ff', '#eaf6ff', 'rgba(255,255,255,.8)', '#9fd4ff', ['#5fa8d9', '#2f6fa8', '#173a5c']]);

  var out = document.createElement('canvas');
  out.width = CALC_W; out.height = CALC_H;
  var outCtx = out.getContext('2d');
  var outImg = outCtx.createImageData(CALC_W, CALC_H);
  var outBuf = outImg.data;

  function sampleAt(buf, sx, sy) {
    sx = sx < 0 ? 0 : (sx > CALC_W - 1 ? CALC_W - 1 : sx);
    sy = sy < 0 ? 0 : (sy > CALC_H - 1 ? CALC_H - 1 : sy);
    var i = (Math.round(sy) * CALC_W + Math.round(sx)) * 4;
    return [buf[i], buf[i + 1], buf[i + 2]];
  }

  var progress = 0;
  var target = 0;

  function renderFrame(t) {
    var frontX = progress * (CALC_W + FRONT_BAND * 2) - FRONT_BAND;
    var idx = 0;
    for (var y = 0; y < CALC_H; y += 1) {
      var wobble = Math.sin(y * 0.45 + t * 0.01) * 3.2;
      var localFront = frontX + wobble;
      for (var x = 0; x < CALC_W; x += 1) {
        var rgb;
        var d = x - localFront;
        if (d < -FRONT_BAND) {
          rgb = sampleAt(bufBack, x, y);
        } else if (d > FRONT_BAND) {
          rgb = sampleAt(bufFront, x, y);
        } else {
          var m = (d + FRONT_BAND) / (FRONT_BAND * 2);
          var a = sampleAt(bufFront, x, y);
          var b = sampleAt(bufBack, x, y);
          rgb = [a[0] + (b[0] - a[0]) * m, a[1] + (b[1] - a[1]) * m, a[2] + (b[2] - a[2]) * m];
          var shine = (1 - Math.abs(m - 0.5) * 2) * 34;
          rgb = [rgb[0] + shine, rgb[1] + shine, rgb[2] + shine];
        }
        outBuf[idx] = Math.max(0, Math.min(255, rgb[0]));
        outBuf[idx + 1] = Math.max(0, Math.min(255, rgb[1]));
        outBuf[idx + 2] = Math.max(0, Math.min(255, rgb[2]));
        outBuf[idx + 3] = 255;
        idx += 4;
      }
    }
  }

  var cw = 480, ch = 300;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    draw(lastElapsed);
  }

  var lastElapsed = 0;
  function draw(t) {
    lastElapsed = t;
    renderFrame(t);
    outCtx.putImageData(outImg, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(out, 0, 0, CALC_W, CALC_H, 0, 0, cw, ch);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var playing = !reduce;
  if (reduce) { root.classList.remove('is-demo'); }

  function toggleFlip() {
    target = target === 0 ? 1 : 0;
    if (reduce) { progress = target; draw(lastElapsed); }
  }
  wrap.addEventListener('click', toggleFlip);
  wrap.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleFlip(); }
  });
  wrap.tabIndex = 0;

  var AUTO_CYCLE_MS = 2600;
  var lastAutoMs = -9999;
  function maybeAutoFlip(t) {
    if (t - lastAutoMs > AUTO_CYCLE_MS) {
      target = target === 0 ? 1 : 0;
      lastAutoMs = t;
    }
  }

  var lastTs = null;
  var elapsed = 0;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = ts - lastTs;
    lastTs = ts;
    if (playing) {
      elapsed += dt;
      maybeAutoFlip(elapsed);
      var step = dt / CARD_FLIP_MS;
      if (progress < target) progress = Math.min(target, progress + step);
      else if (progress > target) progress = Math.max(target, progress - step);
      draw(elapsed);
    }
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  draw(elapsed);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
