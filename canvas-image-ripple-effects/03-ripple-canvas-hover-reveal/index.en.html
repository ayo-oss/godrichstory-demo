<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On hover, a ripple spreads and a second image underneath gradually appears along the wave. — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rv is-demo" id="rvRoot" tabindex="0">
  <canvas class="rv__canvas" id="rvCanvas" width="480" height="300"></canvas>
  <p class="rv__caption">On hover, a ripple spreads and a second image underneath gradually appears along the wave.</p>
</div>
</main>
<script>
(function () {
  // 기법: 호버 시작점에서 시간에 비례해 자라는 파동 반경으로 두 절차적 "사진" A·B 를 마스크 블렌드한다.
  // 반경 경계띠 안에서는 sin 오프셋으로 픽셀을 살짝 밀어 물결 전선이 지나가는 것처럼 보이게 한다.
  var root = document.getElementById('rvRoot');
  var canvas = document.getElementById('rvCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  function drawPhotoBase(pctx, w, h, seed, palette) {
    var rand = seedRand(seed);
    var sky = pctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, palette[0]);
    sky.addColorStop(1, palette[1]);
    pctx.fillStyle = sky;
    pctx.fillRect(0, 0, w, h);
    var sunX = w * 0.68, sunY = h * 0.26, sunR = h * 0.15;
    var glow = pctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 2.5);
    glow.addColorStop(0, palette[2]);
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    pctx.fillStyle = glow;
    pctx.fillRect(0, 0, w, h);
    pctx.beginPath();
    pctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
    pctx.fillStyle = palette[3];
    pctx.fill();
    for (var i = 0; i < palette[4].length; i += 1) {
      var baseY = h * (0.5 + i * 0.14);
      pctx.beginPath();
      pctx.moveTo(0, h);
      var step = Math.max(2, w / 24);
      for (var x = 0; x <= w; x += step) {
        var n = Math.sin(x * 0.06 + i * 2 + seed * 0.0003) * h * 0.04 + Math.sin(x * 0.15 + i) * h * 0.018;
        pctx.lineTo(x, baseY + n);
      }
      pctx.lineTo(w, h);
      pctx.closePath();
      pctx.fillStyle = palette[4][i];
      pctx.fill();
    }
    for (var k = 0; k < 50; k += 1) {
      var px = rand() * w, py = rand() * h * 0.5, r = rand() * 1.2 + 0.3;
      pctx.beginPath();
      pctx.arc(px, py, r, 0, Math.PI * 2);
      pctx.fillStyle = 'rgba(255,255,255,' + (0.1 + rand() * 0.2) + ')';
      pctx.fill();
    }
  }

  var CALC_W = 160, CALC_H = 100;
  var WAVE_FRONT_SPEED = 0.11;
  var WAVE_BAND = 10;

  function makeBase(seed, palette) {
    var c = document.createElement('canvas');
    c.width = CALC_W; c.height = CALC_H;
    var cx = c.getContext('2d');
    drawPhotoBase(cx, CALC_W, CALC_H, seed, palette);
    return cx.getImageData(0, 0, CALC_W, CALC_H).data;
  }

  var bufA = makeBase(419031, ['#bfe3ff', '#fff3da', 'rgba(255,247,225,.9)', '#ffe27a', ['#8fd0c7', '#4a9d8f', '#215a56']]);
  var bufB = makeBase(419032, ['#3a2154', '#8a4fae', 'rgba(255,214,247,.7)', '#ffd6f7', ['#5c3a7a', '#2f1f4a', '#160f28']]);

  var out = document.createElement('canvas');
  out.width = CALC_W; out.height = CALC_H;
  var outCtx = out.getContext('2d');
  var outImg = outCtx.createImageData(CALC_W, CALC_H);
  var outBuf = outImg.data;

  function sampleAt(buf, sx, sy) {
    sx = sx < 0 ? 0 : (sx > CALC_W - 1 ? CALC_W - 1 : sx);
    sy = sy < 0 ? 0 : (sy > CALC_H - 1 ? CALC_H - 1 : sy);
    var i = (Math.round(sy) * CALC_W + Math.round(sx)) * 4;
    return [buf[i], buf[i + 1], buf[i + 2]];
  }

  var origin = { x: CALC_W * 0.5, y: CALC_H * 0.5 };
  var radius = 0;
  var target = 0;

  function renderFrame(t) {
    var maxR = Math.sqrt(CALC_W * CALC_W + CALC_H * CALC_H);
    var idx = 0;
    for (var y = 0; y < CALC_H; y += 1) {
      for (var x = 0; x < CALC_W; x += 1) {
        var dx0 = x - origin.x, dy0 = y - origin.y;
        var dist = Math.sqrt(dx0 * dx0 + dy0 * dy0);
        var band = Math.sin(dist * 0.35 - t * 0.01);
        var mix = 1 - Math.max(0, Math.min(1, (dist - (radius - WAVE_BAND)) / WAVE_BAND));
        var rippled = dist + band * (mix > 0.02 && mix < 0.98 ? 2.4 : 0);
        var a = sampleAt(bufA, x + band * 0.6, y);
        var b = sampleAt(bufB, x - band * 0.6, y);
        var m = mix;
        outBuf[idx] = a[0] + (b[0] - a[0]) * m;
        outBuf[idx + 1] = a[1] + (b[1] - a[1]) * m;
        outBuf[idx + 2] = a[2] + (b[2] - a[2]) * m;
        outBuf[idx + 3] = 255;
        idx += 4;
        void rippled; void maxR;
      }
    }
  }

  var cw = 480, ch = 300;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    draw(lastElapsed);
  }

  var lastElapsed = 0;
  function draw(t) {
    lastElapsed = t;
    renderFrame(t);
    outCtx.putImageData(outImg, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(out, 0, 0, CALC_W, CALC_H, 0, 0, cw, ch);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var playing = !reduce;
  if (reduce) { root.classList.remove('is-demo'); }

  var hovering = false;
  function toGrid(e) {
    var r = wrap.getBoundingClientRect();
    var t0 = (e.touches && e.touches[0]) ? e.touches[0] : e;
    return {
      x: (t0.clientX - r.left) / r.width * CALC_W,
      y: (t0.clientY - r.top) / r.height * CALC_H
    };
  }
  function startReveal(e) {
    hovering = true;
    if (e) origin = toGrid(e);
    target = Math.sqrt(CALC_W * CALC_W + CALC_H * CALC_H);
    if (reduce) draw(lastElapsed);
  }
  function endReveal() {
    hovering = false;
    target = 0;
    if (reduce) draw(lastElapsed);
  }
  wrap.addEventListener('pointerenter', startReveal);
  wrap.addEventListener('pointermove', function (e) { if (hovering) origin = toGrid(e); });
  wrap.addEventListener('pointerleave', endReveal);
  wrap.addEventListener('focus', function () { startReveal(null); origin = { x: CALC_W * 0.5, y: CALC_H * 0.5 }; });
  wrap.addEventListener('blur', endReveal);

  var VIRTUAL_CYCLE_MS = 1900;
  function virtualHover(t) {
    var phase = (t % VIRTUAL_CYCLE_MS) / VIRTUAL_CYCLE_MS;
    return phase < 0.55;
  }

  var lastTs = null;
  var elapsed = 0;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = ts - lastTs;
    lastTs = ts;
    if (playing) {
      elapsed += dt;
      if (!hovering) {
        var on = virtualHover(elapsed);
        target = on ? Math.sqrt(CALC_W * CALC_W + CALC_H * CALC_H) : 0;
        if (on) {
          origin.x = CALC_W * (0.3 + 0.4 * ((Math.sin(elapsed * 0.0007) + 1) / 2));
          origin.y = CALC_H * (0.3 + 0.4 * ((Math.cos(elapsed * 0.0011) + 1) / 2));
        }
      }
      var maxR = Math.sqrt(CALC_W * CALC_W + CALC_H * CALC_H);
      var step = WAVE_FRONT_SPEED * dt * (maxR / 20);
      if (radius < target) radius = Math.min(target, radius + step);
      else if (radius > target) radius = Math.max(target, radius - step);
      draw(elapsed);
    }
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  draw(elapsed);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
