<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字の形の中だけに画像が満たされ、その中で波紋が絶えず揺れる。 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rv is-demo" id="rvRoot">
  <canvas class="rv__canvas" id="rvCanvas" width="480" height="300"></canvas>
  <p class="rv__caption">文字の形の中だけに画像が満たされ、その中で波紋が絶えず揺れる。</p>
</div>
</main>
<script>
(function () {
  // 기법: fillText 로 그린 글자의 알파 채널을 마스크로 삼아, 마스크 안쪽 픽셀에만 사인파 높이 필드 굴절을 적용한다.
  // 마스크 밖은 정적 배경이고 안쪽만 매 프레임 getImageData/putImageData 로 다시 계산해 액체가 담긴 글자처럼 보인다.
  var root = document.getElementById('rvRoot');
  var canvas = document.getElementById('rvCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  function drawPhotoBase(pctx, w, h, seed) {
    var rand = seedRand(seed);
    var sky = pctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#bfe9ff');
    sky.addColorStop(1, '#e8fbff');
    pctx.fillStyle = sky;
    pctx.fillRect(0, 0, w, h);
    var sunX = w * 0.5, sunY = h * 0.3, sunR = h * 0.2;
    var glow = pctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 2.4);
    glow.addColorStop(0, 'rgba(255,255,255,.9)');
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    pctx.fillStyle = glow;
    pctx.fillRect(0, 0, w, h);
    var bandColors = ['#6fc7e0', '#3f9fc9', '#1f6f96'];
    for (var i = 0; i < bandColors.length; i += 1) {
      var baseY = h * (0.45 + i * 0.16);
      pctx.beginPath();
      pctx.moveTo(0, h);
      var step = Math.max(2, w / 20);
      for (var x = 0; x <= w; x += step) {
        var n = Math.sin(x * 0.06 + i * 2 + seed * 0.0003) * h * 0.03;
        pctx.lineTo(x, baseY + n);
      }
      pctx.lineTo(w, h);
      pctx.closePath();
      pctx.fillStyle = bandColors[i];
      pctx.fill();
    }
    for (var k = 0; k < 40; k += 1) {
      var px = rand() * w, py = rand() * h, r = rand() * 1 + 0.3;
      pctx.beginPath();
      pctx.arc(px, py, r, 0, Math.PI * 2);
      pctx.fillStyle = 'rgba(255,255,255,' + (0.1 + rand() * 0.2) + ')';
      pctx.fill();
    }
  }

  var CALC_W = 160, CALC_H = 100;
  var RIPPLE_TEXT_WAVE_COUNT = 2;
  var RIPPLE_TEXT_FIT_RATIO = 0.9;

  var off = document.createElement('canvas');
  off.width = CALC_W; off.height = CALC_H;
  var octx = off.getContext('2d');
  drawPhotoBase(octx, CALC_W, CALC_H, 419081);
  var baseImg = octx.getImageData(0, 0, CALC_W, CALC_H);
  var baseBuf = baseImg.data;

  var maskCanvas = document.createElement('canvas');
  maskCanvas.width = CALC_W; maskCanvas.height = CALC_H;
  var mctx = maskCanvas.getContext('2d');
  mctx.textAlign = 'center';
  mctx.textBaseline = 'middle';
  // 글자 클립 영역을 스테이지 폭 기준으로 크게: probe 크기로 잰 폭을 CALC_W 의 RIPPLE_TEXT_FIT_RATIO 만큼 채우도록 실제 폰트 크기를 역산한다.
  var TEXT_LABEL = 'H2O';
  var PROBE_PX = 100;
  mctx.font = '700 ' + PROBE_PX + 'px sans-serif';
  var probeWidth = mctx.measureText(TEXT_LABEL).width;
  var fitFontPx = Math.round(PROBE_PX * (CALC_W * RIPPLE_TEXT_FIT_RATIO) / probeWidth);
  fitFontPx = Math.min(fitFontPx, Math.round(CALC_H * 0.88));
  mctx.font = '700 ' + fitFontPx + 'px sans-serif';
  mctx.fillStyle = '#000';
  mctx.fillText(TEXT_LABEL, CALC_W / 2, CALC_H / 2 + 2);
  var maskBuf = mctx.getImageData(0, 0, CALC_W, CALC_H).data;

  var out = document.createElement('canvas');
  out.width = CALC_W; out.height = CALC_H;
  var outCtx = out.getContext('2d');
  var outImg = outCtx.createImageData(CALC_W, CALC_H);
  var outBuf = outImg.data;

  function sampleBase(sx, sy) {
    sx = sx < 0 ? 0 : (sx > CALC_W - 1 ? CALC_W - 1 : sx);
    sy = sy < 0 ? 0 : (sy > CALC_H - 1 ? CALC_H - 1 : sy);
    var i = (Math.round(sy) * CALC_W + Math.round(sx)) * 4;
    return [baseBuf[i], baseBuf[i + 1], baseBuf[i + 2]];
  }

  function liquidHeight(x, y, t) {
    var h = 0;
    for (var i = 0; i < RIPPLE_TEXT_WAVE_COUNT; i += 1) {
      var freq = 0.09 + i * 0.05;
      var speed = 0.0064 + i * 0.0032;
      var amp = 8 / (i + 1);
      h += amp * Math.sin(x * freq + t * speed) * Math.cos(y * (freq * 0.7) - t * speed * 0.7);
    }
    return h;
  }

  var BG_R = 23, BG_G = 20, BG_B = 26;

  function renderFrame(t) {
    var idx = 0;
    for (var y = 0; y < CALC_H; y += 1) {
      for (var x = 0; x < CALC_W; x += 1) {
        var mAlpha = maskBuf[idx + 3];
        if (mAlpha < 24) {
          outBuf[idx] = BG_R; outBuf[idx + 1] = BG_G; outBuf[idx + 2] = BG_B; outBuf[idx + 3] = 255;
        } else {
          var h0 = liquidHeight(x, y, t);
          var hx = liquidHeight(x + 1, y, t) - liquidHeight(x - 1, y, t);
          var hy = liquidHeight(x, y + 1, t) - liquidHeight(x, y - 1, t);
          var rgb = sampleBase(x + hx * 1.4, y + hy * 1.4);
          // 파동 높이(h0)를 굴절 샘플뿐 아니라 글자 안 명도(shine)·그림자(hy 기반 음영)에도 같은 함수로 전파한다.
          var shine = Math.max(-34, Math.min(60, h0 * 7 - hy * 3));
          outBuf[idx] = Math.max(0, Math.min(255, rgb[0] + shine));
          outBuf[idx + 1] = Math.max(0, Math.min(255, rgb[1] + shine));
          outBuf[idx + 2] = Math.max(0, Math.min(255, rgb[2] + shine));
          outBuf[idx + 3] = 255;
        }
        idx += 4;
      }
    }
  }

  var cw = 480, ch = 300;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    draw(lastElapsed);
  }

  var lastElapsed = 0;
  function draw(t) {
    lastElapsed = t;
    renderFrame(t);
    outCtx.putImageData(outImg, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(out, 0, 0, CALC_W, CALC_H, 0, 0, cw, ch);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var playing = !reduce;
  var elapsed = reduce ? 600 : 0;
  if (reduce) { root.classList.remove('is-demo'); }

  var lastTs = null;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = ts - lastTs;
    lastTs = ts;
    if (playing) { elapsed += dt; }
    draw(elapsed);
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  draw(elapsed);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
