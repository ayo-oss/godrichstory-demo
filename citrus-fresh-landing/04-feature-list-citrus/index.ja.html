<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">

<title>Squeeze-droplet icon list</title>

<body>
<main class="stage">
  <ul class="listcitrus">
    <li class="listcitrus__row">
      <span class="listcitrus__drop listcitrus__drop--a" aria-hidden="true"></span>
      <span class="listcitrus__label">ドラッグ&ドロップ</span>

    <li class="listcitrus__row">
      <span class="listcitrus__drop listcitrus__drop--b" aria-hidden="true"></span>
      <span class="listcitrus__label">テンプレートを選ぶ</span>
    </li>
    <li class="listcitrus__row">
      <span class="listcitrus__drop listcitrus__drop--c" aria-hidden="true"></span>
      <span class="listcitrus__label">色を変える</span>
    </li>
    <li class="listcitrus__row">
      <span class="listcitrus__drop listcitrus__drop--d" aria-hidden="true"></span>
      <span class="listcitrus__label">共有する</span>
    </li>
  </ul>
</main>
