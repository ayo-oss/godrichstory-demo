<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wave-edge footer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <footer class="footercitrus">
    <span class="footercitrus__wave" aria-hidden="true"></span>
    <div class="footercitrus__cols">
      <div class="footercitrus__col footercitrus__col--org">
        <p class="footercitrus__head">제품</p>
        <p class="footercitrus__link">기능</p>
      </div>
      <div class="footercitrus__col footercitrus__col--grp">
        <p class="footercitrus__head">회사</p>
        <p class="footercitrus__link">소개</p>
      </div>
      <div class="footercitrus__col footercitrus__col--lem">
        <p class="footercitrus__head">도움말</p>
        <p class="footercitrus__link">가이드</p>
      </div>
    </div>
    <p class="footercitrus__copy">
      <span class="footercitrus__spark" aria-hidden="true">✦</span>
      스퀴즈 · 상큼한 하루
      <span class="footercitrus__spark footercitrus__spark--b" aria-hidden="true">✦</span>
    </p>
  </footer>
</main>
</body>
</html>
