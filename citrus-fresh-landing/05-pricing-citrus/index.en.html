<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoothie pricing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pricecitrus">
    <div class="pricecitrus__plan pricecitrus__plan--lime">
      <p class="pricecitrus__name">Sprout</p>
      <p class="pricecitrus__price">Free</p>
      <p class="pricecitrus__per">Forever</p>
    </div>
    <div class="pricecitrus__plan pricecitrus__plan--pick">
      <span class="pricecitrus__badge">Popular</span>
      <div class="pricecitrus__inner">
        <p class="pricecitrus__name">Squeeze</p>
        <p class="pricecitrus__price">$19/month</p>
        <p class="pricecitrus__per">First month free</p>
      </div>
    </div>
    <div class="pricecitrus__plan pricecitrus__plan--grp">
      <p class="pricecitrus__name">Grapefruit</p>
      <p class="pricecitrus__price">$9/month</p>
      <p class="pricecitrus__per">Billed annually</p>
    </div>
  </div>
</main>
</body>
</html>
