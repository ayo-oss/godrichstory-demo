<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoothie pricing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pricecitrus">
    <div class="pricecitrus__plan pricecitrus__plan--lime">
      <p class="pricecitrus__name">スプラウト</p>
      <p class="pricecitrus__price">無料</p>
      <p class="pricecitrus__per">永久に</p>
    </div>
    <div class="pricecitrus__plan pricecitrus__plan--pick">
      <span class="pricecitrus__badge">人気</span>
      <div class="pricecitrus__inner">
        <p class="pricecitrus__name">スクイーズ</p>
        <p class="pricecitrus__price">月19,000円</p>
        <p class="pricecitrus__per">初月無料</p>
      </div>
    </div>
    <div class="pricecitrus__plan pricecitrus__plan--grp">
      <p class="pricecitrus__name">グレープフルーツ</p>
      <p class="pricecitrus__price">月9,000円</p>
      <p class="pricecitrus__per">年払い</p>
    </div>
  </div>
</main>
</body>
</html>
