<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoothie pricing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pricecitrus">
    <div class="pricecitrus__plan pricecitrus__plan--lime">
      <p class="pricecitrus__name">새싹</p>
      <p class="pricecitrus__price">무료</p>
      <p class="pricecitrus__per">영원히</p>
    </div>
    <div class="pricecitrus__plan pricecitrus__plan--pick">
      <span class="pricecitrus__badge">인기</span>
      <div class="pricecitrus__inner">
        <p class="pricecitrus__name">스퀴즈</p>
        <p class="pricecitrus__price">월 19,000원</p>
        <p class="pricecitrus__per">첫 달 무료</p>
      </div>
    </div>
    <div class="pricecitrus__plan pricecitrus__plan--grp">
      <p class="pricecitrus__name">자몽</p>
      <p class="pricecitrus__price">월 9,000원</p>
      <p class="pricecitrus__per">연간 결제</p>
    </div>
  </div>
</main>
</body>
</html>
