<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citrus-slice indicator nav</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <nav class="navcitrus" aria-label="メインメニュー">
    <span class="navcitrus__brand">スクイーズ</span>
    <div class="navcitrus__track">
      <span class="navcitrus__wedge" aria-hidden="true"></span>
      <span class="navcitrus__tab navcitrus__tab--on">ホーム</span>
      <span class="navcitrus__tab">機能</span>
      <span class="navcitrus__tab">料金</span>
      <span class="navcitrus__tab">お問い合わせ</span>
    </div>
    <button class="navcitrus__cta" type="button">はじめる</button>
  </nav>
</main>
</body>
</html>
