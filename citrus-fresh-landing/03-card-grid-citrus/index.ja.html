<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedge-badge card grid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="gridcitrus">
    <div class="gridcitrus__card gridcitrus__card--org">
      <span class="gridcitrus__badge">NEW</span>
      <span class="gridcitrus__dot" aria-hidden="true"></span>
      <p class="gridcitrus__name">オレンジアラート</p>
    </div>
    <div class="gridcitrus__card gridcitrus__card--lim">
      <span class="gridcitrus__badge">無料</span>
      <span class="gridcitrus__dot" aria-hidden="true"></span>
      <p class="gridcitrus__name">ライムウィジェット</p>
    </div>
    <div class="gridcitrus__card gridcitrus__card--grp">
      <span class="gridcitrus__badge">人気</span>
      <span class="gridcitrus__dot" aria-hidden="true"></span>
      <p class="gridcitrus__name">グレープフルーツカード</p>
    </div>
    <div class="gridcitrus__card gridcitrus__card--lem">
      <span class="gridcitrus__badge">NEW</span>
      <span class="gridcitrus__dot" aria-hidden="true"></span>
      <p class="gridcitrus__name">レモンログ</p>
    </div>
  </div>
</main>
</body>
</html>
