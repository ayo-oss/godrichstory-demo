<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">

<title>Progress bar — stepper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="stepper is-demo" role="list" aria-label="진행 단계">
    <div class="step" role="listitem"><span class="step__dot">1</span><span class="step__label">정보</span></div>
    <div class="line"></div>
    <div class="step" role="listitem"><span class="step__dot">2</span><span class="step__label">배송</span></div>
    <div class="line"></div>
    <div class="step" role="listitem"><span class="step__dot">3</span><span class="step__label">결제</span></div>
  </div>
</main>
</body>
</html>
