<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading spinner — inline button loading state</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <button class="btn is-demo" type="button">
    <span class="btn__label">Lưu</span>
    <span class="btn__spin" aria-hidden="true"></span>
  </button>
</main>
<script>
// 실제로는 fetch 시작 시 is-loading 을 붙이고 응답이 오면 뗀다. 데모는 2초 주기로 스스로 반복한다.
var b = document.querySelector('.btn');
b.addEventListener('pointerdown', function () {
  b.classList.remove('is-demo');
  b.classList.add('is-loading');
  b.disabled = true;
  setTimeout(function () {
    b.classList.remove('is-loading');
    b.disabled = false;
  }, 900);
});
</script>
</body>
</html>
