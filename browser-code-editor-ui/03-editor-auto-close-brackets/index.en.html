<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto-close brackets — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="br is-demo" id="br">
  <div class="br__bar">
    <span class="br__ico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M240 128c-64 0 0 88-64 88H80c-64 0 0-88-64-88c64 0 0-88 64-88h96c64 0 0 88 64 88" opacity=".2"/><path d="M43.18 128a29.8 29.8 0 0 1 8 10.26c4.8 9.9 4.8 22 4.8 33.74c0 24.31 1 36 24 36a8 8 0 0 1 0 16c-17.48 0-29.32-6.14-35.2-18.26c-4.8-9.9-4.8-22-4.8-33.74c0-24.31-1-36-24-36a8 8 0 0 1 0-16c23 0 24-11.69 24-36c0-11.72 0-23.84 4.8-33.74C50.68 38.14 62.52 32 80 32a8 8 0 0 1 0 16c-23 0-24 11.69-24 36c0 11.72 0 23.84-4.8 33.74A29.8 29.8 0 0 1 43.18 128M240 120c-23 0-24-11.69-24-36c0-11.72 0-23.84-4.8-33.74C205.32 38.14 193.48 32 176 32a8 8 0 0 0 0 16c23 0 24 11.69 24 36c0 11.72 0 23.84 4.8 33.74a29.8 29.8 0 0 0 8 10.26a29.8 29.8 0 0 0-8 10.26c-4.8 9.9-4.8 22-4.8 33.74c0 24.31-1 36-24 36a8 8 0 0 0 0 16c17.48 0 29.32-6.14 35.2-18.26c4.8-9.9 4.8-22 4.8-33.74c0-24.31 1-36 24-36a8 8 0 0 0 0-16"/></g></svg></span>
    <span class="br__name">auto-close.js</span>
    <span class="br__pill">
      <span class="br__state" id="state">Auto-close</span>
      <span class="br__sv br__sv--1" aria-hidden="true">Pair added</span>
      <span class="br__sv br__sv--2" aria-hidden="true">Step over</span>
      <span class="br__sv br__sv--3" aria-hidden="true">Pair removed</span>
    </span>
  </div>
  <div class="br__wrap" id="wrap">
    <pre class="br__hl" id="hl" aria-hidden="true"></pre>
    <span class="br__pline" aria-hidden="true"></span>
    <span class="br__ping" aria-hidden="true"></span>
    <span class="br__caret" aria-hidden="true"></span>
    <textarea class="br__ta" id="ta" spellcheck="false" autocomplete="off" wrap="off" aria-label="Code input">fade()</textarea>
  </div>
  <div class="br__keys" aria-hidden="true">
    <span class="br__k"><span class="br__kt">(</span><span class="br__kfill">(</span></span>
    <span class="br__k"><span class="br__kt">)</span><span class="br__kfill">)</span></span>
    <span class="br__k"><span class="br__kt">Backspace</span><span class="br__kfill">Backspace</span></span>
    <span class="br__k"><span class="br__kt">(</span><span class="br__kfill">(</span></span>
  </div>
  <p class="br__note">The closing partner is inserted for you; type it again at that spot and the caret just steps over</p>
</div>
</main>
<script>
var br = document.getElementById('br');
var ta = document.getElementById('ta');
var hl = document.getElementById('hl');
var wrap = document.getElementById('wrap');
var stateEl = document.getElementById('state');
var slots = [].slice.call(document.querySelectorAll('.br__k'));
var PAIRS = { '(': ')', '{': '}', '[': ']', '"': '"', "'": "'" };

function esc(t) {
  return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function setState(label) { stateEl.textContent = label; }
// 키 기록 줄 — 최근 네 키가 오른쪽으로 밀려 마지막 칸이 켜진다
function logKey(k) {
  for (var i = 0; i < slots.length - 1; i++) {
    slots[i].querySelector('.br__kt').textContent = slots[i + 1].querySelector('.br__kt').textContent;
    slots[i].querySelector('.br__kfill').textContent = slots[i + 1].querySelector('.br__kfill').textContent;
    slots[i].classList.remove('is-on');
  }
  var last = slots[slots.length - 1];
  last.querySelector('.br__kt').textContent = k;
  last.querySelector('.br__kfill').textContent = k;
  last.classList.add('is-on');
}
// 커서 왼쪽의 여는 짝과 오른쪽의 닫는 짝이 맞으면 그 두 글자에 색을 입힌다
function render() {
  var v = ta.value;
  var s = ta.selectionStart;
  var open = -1;
  if (s > 0 && PAIRS[v.charAt(s - 1)] === v.charAt(s)) open = s - 1;
  var out = '', seg = '';
  function flush() {
    if (seg) { out += '<span class="br__txt">' + esc(seg) + '</span>'; seg = ''; }
  }
  for (var i = 0; i < v.length; i++) {
    if (i === open || i === open + 1) {
      flush();
      out += '<span class="br__pp">' + esc(v.charAt(i)) + '</span>';
    } else {
      seg += v.charAt(i);
    }
  }
  flush();
  hl.innerHTML = '<span class="br__ln">' + (out || ' ') + '</span>';
  // 줄이 늘어나 본문이 스크롤하면 아래 pre 도 같은 값으로 맞춘다
  hl.scrollTop = ta.scrollTop;
}
ta.addEventListener('keydown', function (e) {
  br.classList.remove('is-demo');
  var k = e.key;
  var v = ta.value;
  var s = ta.selectionStart, t = ta.selectionEnd;
  var over = s === t && v.charAt(s) === k && (PAIRS[k] === k || ')}]'.indexOf(k) >= 0);
  if (PAIRS[k] && !over) {
    // 여는 짝 — 닫는 짝을 같이 넣고 setSelectionRange 로 커서는 그 사이에 남긴다
    e.preventDefault();
    var inner = v.slice(s, t);
    ta.setRangeText(k + inner + PAIRS[k], s, t, 'end');
    ta.setSelectionRange(s + 1, s + 1 + inner.length);
    setState('Pair added');
  } else if (over) {
    // 이미 닫혀 있는 자리 — 삽입하지 않고 커서만 넘어간다
    e.preventDefault();
    ta.setSelectionRange(s + 1, s + 1);
    setState('Step over');
  } else if (k === 'Backspace' && s === t && s > 0 && PAIRS[v.charAt(s - 1)] === v.charAt(s)) {
    // 커서가 빈 짝 가운데서 Backspace — 두 글자를 함께 지운다
    e.preventDefault();
    ta.setRangeText('', s - 1, s + 1, 'end');
    ta.setSelectionRange(s - 1, s - 1);
    setState('Pair removed');
  }
  if (k.length === 1 || k === 'Backspace' || k === 'Enter' || k === 'Tab') logKey(k);
  render();
});
ta.addEventListener('input', function () { br.classList.remove('is-demo'); render(); });
ta.addEventListener('keyup', render);
ta.addEventListener('click', render);
ta.addEventListener('focus', function () { br.classList.remove('is-demo'); render(); });
ta.addEventListener('scroll', function () { hl.scrollTop = ta.scrollTop; });
wrap.addEventListener('pointerdown', function () { br.classList.remove('is-demo'); });
render();
// 시작 커서는 짝 가운데 — 첫 화면부터 두 글자가 파랗게 쌍을 이루고 있다
ta.setSelectionRange(5, 5);
</script>
</body>
</html>
