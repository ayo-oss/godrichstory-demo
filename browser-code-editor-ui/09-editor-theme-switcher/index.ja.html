<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エディタ テーマ切り替え — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="th is-demo" id="th">
  <div class="th__panel" id="panel" data-theme="light">
    <div class="th__bar">
      <span class="th__ico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M224 127.17a96.5 96.5 0 0 1-2.39 22.18a24 24 0 0 1-23.4 18.65H152a24 24 0 0 0-24 24a24 24 0 0 1-32 22.61c-37.27-13.17-64-44.8-64-86.61a96 96 0 0 1 95-96c52.84-.53 96.55 42.35 97 95.17" opacity=".2"/><path d="M200.77 53.89A103.27 103.27 0 0 0 128 24h-1.07A104 104 0 0 0 24 128c0 43 26.58 79.06 69.36 94.17A32 32 0 0 0 136 192a16 16 0 0 1 16-16h46.21a31.81 31.81 0 0 0 31.2-24.88a104.4 104.4 0 0 0 2.59-24a103.28 103.28 0 0 0-31.23-73.23m13 93.71a15.89 15.89 0 0 1-15.56 12.4H152a32 32 0 0 0-32 32a16 16 0 0 1-21.31 15.07C62.49 194.3 40 164 40 128a88 88 0 0 1 87.09-88h.9a88.35 88.35 0 0 1 88 87.25a89 89 0 0 1-2.18 20.35ZM140 76a12 12 0 1 1-12-12a12 12 0 0 1 12 12m-44 24a12 12 0 1 1-12-12a12 12 0 0 1 12 12m0 56a12 12 0 1 1-12-12a12 12 0 0 1 12 12m88-56a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></svg></span>
      <span class="th__name">theme.scss</span>
      <span class="th__cur" id="cur" data-cur="light"><span class="th__curName" data-set="light">ライト</span><span class="th__curName" data-set="dark">ダーク</span><span class="th__curName" data-set="hc">ハイコントラスト</span></span>
    </div>
    <pre class="th__code"><span class="t t--com">/* theme tokens */</span>
<span class="t t--k">.card</span> {
  --brand: <span class="t t--s">"godrich"</span>;
  box-shadow: <span class="t t--n">0 2px 12px</span>;
  transition: opacity <span class="t t--n">220ms</span>;
}</pre>
  </div>
  <div class="th__opts" role="group" aria-label="テーマ選択">
    <button class="th__opt" type="button" data-set="light" aria-pressed="true">
      <span class="th__ind" aria-hidden="true"></span>
      <span class="th__dots" aria-hidden="true"><i class="th__dot th__dot--1"></i><i class="th__dot th__dot--2"></i><i class="th__dot th__dot--3"></i></span>
      <span class="th__lb">ライト</span>
    </button>
    <button class="th__opt" type="button" data-set="dark" aria-pressed="false">
      <span class="th__ind" aria-hidden="true"></span>
      <span class="th__dots" aria-hidden="true"><i class="th__dot th__dot--1"></i><i class="th__dot th__dot--2"></i><i class="th__dot th__dot--3"></i></span>
      <span class="th__lb">ダーク</span>
    </button>
    <button class="th__opt" type="button" data-set="hc" aria-pressed="false">
      <span class="th__ind" aria-hidden="true"></span>
      <span class="th__dots" aria-hidden="true"><i class="th__dot th__dot--1"></i><i class="th__dot th__dot--2"></i><i class="th__dot th__dot--3"></i></span>
      <span class="th__lb">ハイコントラスト</span>
    </button>
  </div>
</div>
</main>
<script>
var th = document.getElementById('th');
var panel = document.getElementById('panel');
var cur = document.getElementById('cur');
var opts = Array.prototype.slice.call(document.querySelectorAll('.th__opt'));

// 단추를 누르면 data-theme 하나만 바꾼다 — 색 뭉치는 CSS 변수 선택자가 갈아 끼운다
opts.forEach(function (btn) {
  btn.addEventListener('click', function () {
    th.classList.remove('is-demo');
    panel.dataset.theme = btn.dataset.set;
    // 이름표 세 장을 한 칸에 겹쳐 두고 보이는 것만 고른다 — 미리보기 루프도 같은 칸을 컷으로 갈아 끼운다
    cur.dataset.cur = btn.dataset.set;
    opts.forEach(function (b) { b.setAttribute('aria-pressed', String(b === btn)); });
  });
});
th.addEventListener('pointerdown', function () { th.classList.remove('is-demo'); });
</script>
</body>
</html>
