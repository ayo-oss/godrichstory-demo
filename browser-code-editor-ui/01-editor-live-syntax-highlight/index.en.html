<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live syntax highlight — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sh is-demo" id="sh">
  <div class="sh__bar">
    <span class="sh__ico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 48v160H40V48Z" opacity=".2"/><path d="m69.12 94.15l-2.63-2.62a8 8 0 0 1 0-11.32l32-32a8 8 0 0 1 11.31 11.32L83.31 88l26.5 26.5a8 8 0 0 1-11.31 11.31Zm117.76 67.7l2.63 2.62a8 8 0 0 0 0-11.32l-32-32a8 8 0 0 0-11.31 11.32L172.69 168l-26.5 26.5a8 8 0 0 0 11.31 11.31Z"/><path d="M168 42.15a8 8 0 0 0-9.85 5.53l-48 168a8 8 0 0 0 5.53 9.85a8.5 8.5 0 0 0 2.16.3a8 8 0 0 0 7.69-5.8l48-168a8 8 0 0 0-5.53-9.88"/></g></svg></span>
    <span class="sh__name">style.scss</span>
    <span class="sh__count" id="count">4 colors</span>
  </div>
  <div class="sh__wrap" id="wrap">
    <pre class="sh__hl" id="hl" aria-hidden="true"></pre>
    <span class="sh__sweep" aria-hidden="true"></span>
    <textarea class="sh__ta" id="ta" spellcheck="false" autocomplete="off" aria-label="Code input">/* card rise */
.card {
  --lift: 8px;
  content: "rise";
  color: #fff7e6;
  transition: all 220ms ease;
}</textarea>
  </div>
  <p class="sh__note">Type and the same spot is recolored</p>
</div>
</main>
<script>
var sh = document.getElementById('sh');
var ta = document.getElementById('ta');
var hl = document.getElementById('hl');
var wrap = document.getElementById('wrap');
// 토크나이저 규칙 네 줄. 앞의 규칙이 먼저 이긴다 — 주석 안의 색 코드를 색으로 잡지 않으려는 순서다
var RULES = [
  { cls: 'c', re: /\/\*[\s\S]*?\*\/|\/\/[^\n]*/g },
  { cls: 's', re: /"[^"\n]*"|'[^'\n]*'/g },
  { cls: 'n', re: /#[0-9a-fA-F]{3,8}\b|\b\d+(?:\.\d+)?(?:px|ms|s|%|em|rem|fr)?\b/g },
  { cls: 'k', re: /--[a-zA-Z][\w-]*|\.[a-zA-Z][\w-]*|@[a-z-]+|\b[a-z-]+(?=\s*:)/g }
];
function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function paint(line) {
  var marks = [];
  RULES.forEach(function (rule, rank) {
    var m; rule.re.lastIndex = 0;
    while ((m = rule.re.exec(line)) !== null) {
      var taken = marks.some(function (x) { return m.index < x.end && x.start < m.index + m[0].length; });
      if (!taken) marks.push({ start: m.index, end: m.index + m[0].length, cls: rule.cls, rank: rank });
      if (m[0] === '') rule.re.lastIndex++;
    }
  });
  marks.sort(function (a, b) { return a.start - b.start; });
  var out = '', at = 0;
  marks.forEach(function (x) {
    if (x.start < at) return;
    out += esc(line.slice(at, x.start)) + '<span class="t t--' + x.cls + '">' + esc(line.slice(x.start, x.end)) + '</span>';
    at = x.end;
  });
  return out + esc(line.slice(at));
}
function render() {
  // 줄마다 span 으로 감싼다 — 미리보기 루프가 줄 단위로 켜고 끌 수 있어야 한다
  hl.innerHTML = ta.value.split('\n').map(function (line) {
    return '<span class="sh__ln">' + (paint(line) || '​') + '</span>';
  }).join('');
}
function sync() { hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; }
ta.addEventListener('input', function () { sh.classList.remove('is-demo'); render(); sync(); });
ta.addEventListener('scroll', sync);
ta.addEventListener('focus', function () { sh.classList.remove('is-demo'); });
wrap.addEventListener('pointerdown', function () { sh.classList.remove('is-demo'); });
render();
</script>
</body>
</html>
