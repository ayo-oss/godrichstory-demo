<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>検索・置換バー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fr is-demo" id="fr">
  <div class="fr__bar">
    <span class="fr__ico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M192 112a80 80 0 1 1-80-80a80 80 0 0 1 80 80" opacity=".2"/><path d="m229.66 218.34l-50.06-50.06a88.21 88.21 0 1 0-11.32 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></g></svg></span>
    <span class="fr__name">tokens.scss</span>
    <span class="fr__hint">Ctrl+F</span>
  </div>
  <div class="fr__wrap" id="wrap">
    <div class="fr__find" id="find" role="group" aria-label="検索・置換">
      <div class="fr__row">
        <span class="fr__fico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M192 112a80 80 0 1 1-80-80a80 80 0 0 1 80 80" opacity=".2"/><path d="m229.66 218.34l-50.06-50.06a88.21 88.21 0 1 0-11.32 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></g></svg></span>
        <input class="fr__q" id="q" type="text" value="4px" placeholder="検索語" aria-label="検索語" spellcheck="false" autocomplete="off">
        <span class="fr__count" id="count" aria-live="polite"><span class="fr__cnum fr__cnum--a">3/6</span><span class="fr__cnum fr__cnum--b">5/6</span></span>
        <button class="fr__nav" id="prev" type="button" aria-label="前の一致"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M160 48v160l-80-80Z" opacity=".2"/><path d="M163.06 40.61a8 8 0 0 0-8.72 1.73l-80 80a8 8 0 0 0 0 11.32l80 80A8 8 0 0 0 168 208V48a8 8 0 0 0-4.94-7.39M152 188.69L91.31 128L152 67.31Z"/></g></svg></button>
        <button class="fr__nav" id="next" type="button" aria-label="次の一致"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></button>
        <button class="fr__nav" id="close" type="button" aria-label="閉じる"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 56v144a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h144a16 16 0 0 1 16 16" opacity=".2"/><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg></button>
      </div>
      <div class="fr__row">
        <input class="fr__r" id="rep" type="text" value="8px" placeholder="置換後の語" aria-label="置換後の語" spellcheck="false" autocomplete="off">
        <button class="fr__go" id="go" type="button">置換</button>
      </div>
    </div>
    <pre class="fr__hl" id="hl" aria-hidden="true">/* spacing scale — <mark class="fr__m">4px</mark> grid */
$sp-1: <mark class="fr__m">4px</mark>;
$sp-2: 8px;
.card {
  padding: <mark class="fr__m">4px</mark> 12px;
  gap: <mark class="fr__m">4px</mark>;
  border-radius: <mark class="fr__m">4px</mark>;
}
.chip { margin: <mark class="fr__m">4px</mark>; }</pre>
    <textarea class="fr__ta" id="ta" spellcheck="false" autocomplete="off" wrap="off" aria-label="コード入力欄">/* spacing scale — 4px grid */
$sp-1: 4px;
$sp-2: 8px;
.card {
  padding: 4px 12px;
  gap: 4px;
  border-radius: 4px;
}
.chip { margin: 4px; }</textarea>
  </div>
  <p class="fr__note">Enter で次の一致へ進み、置換は現在の位置だけを入れ替えます</p>
</div>
</main>
<script>
var fr = document.getElementById('fr');
var ta = document.getElementById('ta');
var hl = document.getElementById('hl');
var q = document.getElementById('q');
var rep = document.getElementById('rep');
var count = document.getElementById('count');
var idx = 0;

// 찾을 말을 정규식 특수문자 없이 글자 그대로 잡는다
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// matchAll 로 모든 자리를 한 번에 뽑고, 몇 번째인지 셀 수 있게 시작·끝 인덱스를 남긴다
function hits() {
  if (!q.value) return [];
  var re = new RegExp(escRe(q.value), 'g');
  return Array.from(ta.value.matchAll(re)).map(function (m) {
    return { s: m.index, e: m.index + m[0].length };
  });
}

// 오버레이 pre 를 다시 칠한다 — 표시(mark)는 늘 오버레이 쪽이지 textarea 가 아니다
function paint() {
  var list = hits();
  if (idx >= list.length) idx = 0;
  var out = '', at = 0;
  list.forEach(function (m, i) {
    out += esc(ta.value.slice(at, m.s))
      + '<mark class="fr__m' + (i === idx ? ' fr__m--cur' : '') + '">'
      + esc(ta.value.slice(m.s, m.e)) + '</mark>';
    at = m.e;
  });
  hl.innerHTML = out + esc(ta.value.slice(at));
  count.textContent = list.length ? (idx + 1) + '/' + list.length : '0';
  var cur = hl.querySelector('.fr__m--cur');
  if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  ta.scrollTop = hl.scrollTop;
  ta.scrollLeft = hl.scrollLeft;
}

function step(d) {
  var n = hits().length;
  if (!n) return;
  idx = (idx + d + n) % n;
  paint();
}
function openBar() {
  fr.classList.add('is-find');
  q.focus({ preventScroll: true });
  q.select();
  paint();
}
function closeBar() {
  fr.classList.remove('is-find');
  ta.focus({ preventScroll: true });
}
// 바꾸기는 지금 자리 하나만 — 전체 바꾸기가 아니라는 게 이 부품의 주제다
function replaceCur() {
  var list = hits();
  if (!list.length) return;
  var m = list[idx];
  ta.value = ta.value.slice(0, m.s) + rep.value + ta.value.slice(m.e);
  paint();
}

fr.addEventListener('pointerdown', function () { fr.classList.remove('is-demo'); });
fr.addEventListener('focusin', function () { fr.classList.remove('is-demo'); });
fr.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) { e.preventDefault(); openBar(); }
});
q.addEventListener('input', function () { idx = 0; paint(); });
q.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); step(e.shiftKey ? -1 : 1); }
  else if (e.key === 'Escape') { closeBar(); }
});
rep.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); replaceCur(); }
  else if (e.key === 'Escape') { closeBar(); }
});
document.getElementById('prev').addEventListener('click', function () { step(-1); });
document.getElementById('next').addEventListener('click', function () { step(1); });
document.getElementById('close').addEventListener('click', closeBar);
document.getElementById('go').addEventListener('click', replaceCur);

ta.addEventListener('input', paint);
ta.addEventListener('scroll', function () { hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; });

// 격자 미리보기 동안에는 손으로 써 둔 오버레이를 그대로 둔다 — 사람이 손대는 순간부터 다시 칠한다
if (!fr.classList.contains('is-demo')) paint();
</script>
</body>
</html>
