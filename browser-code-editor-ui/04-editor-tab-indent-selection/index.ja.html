<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab インデントと解除 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ti is-demo" id="ti">
  <div class="ti__bar">
    <span class="ti__ico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 64v128H104V64Z" opacity=".2"/><path d="M224 128a8 8 0 0 1-8 8H104a8 8 0 0 1 0-16h112a8 8 0 0 1 8 8M104 72h112a8 8 0 0 0 0-16H104a8 8 0 0 0 0 16m112 112H104a8 8 0 0 0 0 16h112a8 8 0 0 0 0-16M43.58 55.16L48 52.94V104a8 8 0 0 0 16 0V40a8 8 0 0 0-11.58-7.16l-16 8a8 8 0 0 0 7.16 14.32m36.19 101.56a23.73 23.73 0 0 0-9.6-15.95a24.86 24.86 0 0 0-34.11 4.7a23.6 23.6 0 0 0-3.57 6.46a8 8 0 1 0 15 5.47a7.8 7.8 0 0 1 1.18-2.13a8.76 8.76 0 0 1 12-1.59a7.9 7.9 0 0 1 3.26 5.32a7.64 7.64 0 0 1-1.57 5.78a1 1 0 0 0-.08.11l-28.69 38.32A8 8 0 0 0 40 216h32a8 8 0 0 0 0-16H56l19.08-25.53a23.47 23.47 0 0 0 4.69-17.75"/></g></svg></span>
    <span class="ti__name">deploy.yml</span>
    <span class="ti__key ti__key--tab" aria-hidden="true">Tab</span>
    <span class="ti__key ti__key--sft" aria-hidden="true">Shift+Tab</span>
  </div>
  <div class="ti__wrap">
    <pre class="ti__ghost" id="ghost" aria-hidden="true"><span class="ti__ln"><span class="ti__tx"># deploy config</span></span><span class="ti__ln"><span class="ti__tx">deploy:</span></span><span class="ti__ln ti__ln--sel"><span class="ti__tx">build: scss</span></span><span class="ti__ln ti__ln--sel"><span class="ti__tx">minify: true</span></span><span class="ti__ln ti__ln--sel"><span class="ti__tx">upload: pages</span></span></pre>
    <textarea class="ti__ta" id="ta" spellcheck="false" autocomplete="off" aria-label="コード入力欄"># deploy config
deploy:
build: scss
minify: true
upload: pages</textarea>
  </div>
  <p class="ti__meta"><span class="ti__status" id="status" data-t-sel="{a}〜{b}行目を選択中" data-t-caret="{n}行目にカーソル"><span class="ti__stCaret">1行目にカーソル</span><span class="ti__stSel">3〜5行目を選択中</span></span><span class="ti__lines" id="lines" data-t="{n}行">5行</span></p>
  <p class="ti__note">複数行を選んで Tab を押すと行全体が一緒に動きます</p>
</div>
</main>
<script>
var ti = document.getElementById('ti');
var ta = document.getElementById('ta');
var statusEl = document.getElementById('status');
var linesEl = document.getElementById('lines');
// 문구 템플릿은 화면 글자와 같은 근원(data-*)에서 읽는다 — 언어팩이 값을 바꿔도 조립 규칙이 함께 바뀐다
var TPL_SEL = statusEl.getAttribute('data-t-sel');
var TPL_CARET = statusEl.getAttribute('data-t-caret');
var TPL_LINES = linesEl.getAttribute('data-t');
var NL = '\n';
var INDENT = '  '; // 두 칸

function lineAt(v, pos) { return v.slice(0, pos).split(NL).length; }

function report() {
  // 미리보기 루프 중에는 상태 칸을 건드리지 않는다 — 겹쳐 둔 두 문장을 textContent 가 통째로 지운다
  if (ti.classList.contains('is-demo')) return;
  var v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
  if (e > s && v.slice(s, e).indexOf(NL) !== -1) {
    statusEl.textContent = TPL_SEL.replace('{a}', lineAt(v, s)).replace('{b}', lineAt(v, e));
  } else {
    statusEl.textContent = TPL_CARET.replace('{n}', lineAt(v, s));
  }
  linesEl.textContent = TPL_LINES.replace('{n}', v.split(NL).length);
}

// 여러 줄 잡기: 잡힌 줄 전체가 같이 들여쓰기/내어쓰기되고 selectionStart/End 는 그 바뀐 만큼 다시 계산된다
function indentBlock(dir) {
  var v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
  var ls = v.lastIndexOf(NL, s - 1) + 1;
  var ne = v.indexOf(NL, e);
  if (ne === -1) ne = v.length;
  var lines = v.slice(ls, ne).split(NL);
  var firstShift = 0, lastShift = 0;
  var moved = lines.map(function (ln, i) {
    if (dir > 0) {
      if (i === 0) firstShift = INDENT.length;
      if (i === lines.length - 1) lastShift = INDENT.length;
      return INDENT + ln;
    }
    var lead = ln.match(/^ {1,2}/);
    var cut = lead ? lead[0].length : 0;
    if (i === 0) firstShift = -cut;
    if (i === lines.length - 1) lastShift = -cut;
    return ln.slice(cut);
  });
  ta.value = v.slice(0, ls) + moved.join(NL) + v.slice(ne);
  // 선택 범위 재계산: 시작은 첫 줄의 밀린 만큼, 끝은 마지막 줄의 밀린 만큼 따라간다
  ta.setSelectionRange(Math.max(ls, s + firstShift), Math.max(ls + 1, e + lastShift));
}

ta.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Tab') return;
  ev.preventDefault();
  ti.classList.remove('is-demo');
  var v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
  if (v.slice(s, e).indexOf(NL) === -1) {
    // 한 줄 안에서는 Tab 이 그 자리에 두 칸, Shift+Tab 이 줄 머리에서 두 칸을 지운다
    if (!ev.shiftKey) {
      ta.value = v.slice(0, s) + INDENT + v.slice(e);
      ta.setSelectionRange(s + INDENT.length, s + INDENT.length);
    } else {
      var ls = v.lastIndexOf(NL, s - 1) + 1;
      var cut = Math.min(INDENT.length, v.slice(ls, s).match(/ *$/)[0].length);
      if (cut) {
        ta.value = v.slice(0, s - cut) + v.slice(s);
        ta.setSelectionRange(s - cut, s - cut);
      }
    }
  } else {
    indentBlock(ev.shiftKey ? -1 : 1);
  }
  report();
});
ta.addEventListener('input', report);
ta.addEventListener('keyup', report);
ta.addEventListener('mouseup', report);
ta.addEventListener('focus', function () { ti.classList.remove('is-demo'); });
ti.addEventListener('pointerdown', function () { ti.classList.remove('is-demo'); });
report();
</script>
</body>
</html>
