<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aria-live Throttle and Reduced Motion for Counters — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cc is-demo" id="ccRoot">
  <div class="cc__head">
    <label class="cc__label" for="ccText">Note</label>
    <button type="button" class="cc__btn" id="ccReduce" aria-pressed="false">Reduce motion</button>
  </div>
  <textarea class="cc__ta" id="ccText" aria-describedby="ccCount" placeholder="Write something"></textarea>
  <div class="cc__lanes" id="ccCount">
    <div class="cc__lane">
      <span class="cc__laneLabel">Every change</span>
      <span class="cc__laneNum cc__laneNum--raw"><b id="ccRaw">0</b> times</span>
      <div class="cc__ticks" id="ccRawTicks" aria-hidden="true"></div>
    </div>
    <div class="cc__lane">
      <span class="cc__laneLabel">On threshold</span>
      <span class="cc__laneNum"><b id="ccSafe">0</b> times</span>
      <div class="cc__ticks" id="ccSafeTicks" aria-hidden="true"></div>
    </div>
  </div>
  <p class="cc__sr" id="ccSr" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  // 기법: 글자가 바뀔 때마다 aria-live 영역을 갱신하면 스크린 리더가 숫자를 끝없이 읽는다 (왼쪽 줄, 시연용 가짜 횟수).
  // 여기서는 사용 비율이 임계 ANNOUNCE_RATIOS 를 처음 넘는 순간에만 실제 aria-live 영역에 문구를 넣는다 (오른쪽 줄).
  // "Reduce motion" 를 켜거나 OS 설정이 reduce 면 모든 보간과 팝 효과를 건너뛰고 값을 즉시 그린다.
  var ANNOUNCE_LIMIT = 100;
  var ANNOUNCE_RATIOS = [0.8, 1];
  var TICK_SLOTS = 20;
  var POP_MS = 380;
  var NUMBER_LERP_RATE = 18;
  var START_MS = 200;
  var CHAR_MS = 22;
  var HOLD_MS = 1600;

  var CHUNKS = ['Tonight', 'with pals', 'at the new', 'diner,', 'warm soup', 'and fries', 'to share.', 'But', 'seats ran out', 'so a long', 'wait began,', 'we got hungry', 'and just', 'kept', 'reading the menu.', 'Still,', 'the food', 'beat hopes.', 'A review', 'to write,', 'photos', 'were taken.', 'Next time', 'come earlier,', 'for sure.'];
  var DEMO_CHARS = Array.from(CHUNKS.join(' '));

  var root = document.getElementById('ccRoot');
  var ta = document.getElementById('ccText');
  var btn = document.getElementById('ccReduce');
  var rawEl = document.getElementById('ccRaw');
  var safeEl = document.getElementById('ccSafe');
  var rawTicks = document.getElementById('ccRawTicks');
  var safeTicks = document.getElementById('ccSafeTicks');
  var sr = document.getElementById('ccSr');
  var osReduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var forced = false;
  function reduced() { return osReduce || forced; }

  var seg = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter(undefined, { granularity: 'grapheme' }) : null;
  function countGraphemes(s) {
    if (!seg) return Array.from(s).length;
    return Array.from(seg.segment(s)).length;
  }

  function makeTicks(box) {
    var list = [];
    for (var i = 0; i < TICK_SLOTS; i += 1) {
      var t = document.createElement('i');
      box.appendChild(t);
      list.push({ el: t, on: false, born: -1 });
    }
    return list;
  }
  var rawList = makeTicks(rawTicks);
  var safeList = makeTicks(safeTicks);

  var rawCount = 0;
  var safeCount = 0;
  var rawShown = 0;
  var safeShown = 0;
  var lastLen = 0;
  var passed = [false, false];
  var t0 = null;
  function perfNow() { return t0 === null ? 0 : performance.now() - t0; }

  function addTick(list, count, nowMs) {
    var idx = Math.min(count, TICK_SLOTS) - 1;
    if (idx < 0) return;
    list[idx].on = true;
    list[idx].el.className = 'is-on';
    list[idx].born = reduced() ? -1 : nowMs;
  }
  function clearTicks(list) {
    for (var i = 0; i < list.length; i += 1) { list[i].on = false; list[i].born = -1; list[i].el.className = ''; list[i].el.style.transform = ''; }
  }

  function paintNumbers() {
    rawEl.textContent = String(Math.round(rawShown));
    safeEl.textContent = String(Math.round(safeShown));
  }

  function update(nowMs) {
    var len = countGraphemes(ta.value);
    if (len === 0) {
      rawCount = 0; safeCount = 0; passed = [false, false];
      clearTicks(rawList); clearTicks(safeList);
      lastLen = 0;
      sr.textContent = '';
      if (reduced()) { rawShown = 0; safeShown = 0; paintNumbers(); }
      return;
    }
    if (len !== lastLen) {
      rawCount += 1;
      addTick(rawList, rawCount, nowMs);
    }
    var ratio = len / ANNOUNCE_LIMIT;
    for (var i = 0; i < ANNOUNCE_RATIOS.length; i += 1) {
      if (!passed[i] && ratio >= ANNOUNCE_RATIOS[i]) {
        passed[i] = true;
        safeCount += 1;
        addTick(safeList, safeCount, nowMs);
        sr.textContent = i === 1 ? 'Over the limit' : 'Close to the limit';
      }
    }
    lastLen = len;
    if (reduced()) { rawShown = rawCount; safeShown = safeCount; paintNumbers(); }
  }

  function stopDemo() { root.classList.remove('is-demo'); }
  ta.addEventListener('focus', stopDemo);
  ta.addEventListener('keydown', stopDemo);
  ta.addEventListener('paste', stopDemo);
  ta.addEventListener('input', function () { stopDemo(); update(perfNow()); });
  btn.addEventListener('click', function () {
    forced = !forced;
    btn.setAttribute('aria-pressed', forced ? 'true' : 'false');
    if (reduced()) { rawShown = rawCount; safeShown = safeCount; paintNumbers(); }
  });

  function popScale(age) {
    if (age < 0 || age >= POP_MS) return 1;
    return 1 + 1.1 * Math.exp(-age / 80) * Math.cos(age / 50);
  }
  function paintTicks(list, nowMs) {
    for (var i = 0; i < list.length; i += 1) {
      if (list[i].born < 0) continue;
      var s = popScale(nowMs - list[i].born);
      list[i].el.style.transform = s === 1 ? '' : 'scaleY(' + s.toFixed(3) + ')';
      if (s === 1) list[i].born = -1;
    }
  }

  var lastN = -1;
  var lastTs = null;
  function tick(ts) {
    if (t0 === null) t0 = ts;
    var now = ts - t0;
    var dt = lastTs === null ? 0.016 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if (root.classList.contains('is-demo')) {
      var cyc = (now - START_MS) % (DEMO_CHARS.length * CHAR_MS + HOLD_MS);
      var n = now < START_MS ? 0 : Math.min(DEMO_CHARS.length, Math.floor(cyc / CHAR_MS) + 1);
      while (lastN !== n) {
        lastN = n < lastN ? 0 : lastN + 1;
        ta.value = DEMO_CHARS.slice(0, lastN).join('');
        update(now);
      }
    }
    if (reduced()) {
      rawShown = rawCount;
      safeShown = safeCount;
    } else {
      var k = 1 - Math.exp(-dt * NUMBER_LERP_RATE);
      rawShown += (rawCount - rawShown) * k;
      safeShown += (safeCount - safeShown) * k;
    }
    paintNumbers();
    paintTicks(rawList, now);
    paintTicks(safeList, now);
    requestAnimationFrame(tick);
  }

  if (osReduce) {
    stopDemo();
    ta.value = DEMO_CHARS.join('');
    rawCount = DEMO_CHARS.length;
    safeCount = ANNOUNCE_RATIOS.length;
    passed = [true, true];
    lastLen = DEMO_CHARS.length;
    for (var c = 1; c <= TICK_SLOTS; c += 1) addTick(rawList, c, 0);
    for (var d = 1; d <= safeCount; d += 1) addTick(safeList, d, 0);
    rawShown = rawCount;
    safeShown = safeCount;
    paintNumbers();
    sr.textContent = 'Over the limit';
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
