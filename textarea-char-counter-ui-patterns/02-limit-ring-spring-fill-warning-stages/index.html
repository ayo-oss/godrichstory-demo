<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>남은 글자에 따라 차오르는 스프링 링 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cc is-demo" id="ccRoot">
  <div class="cc__body" id="ccBody">
    <div class="cc__col">
      <label class="cc__label" for="ccText">메모</label>
      <textarea class="cc__ta" id="ccText" aria-describedby="ccCount" placeholder="글을 써 보세요"></textarea>
    </div>
    <div class="cc__ring" id="ccRing">
      <svg viewBox="0 0 88 88" aria-hidden="true">
        <circle class="cc__track" cx="44" cy="44" r="36"></circle>
        <circle class="cc__arc" id="ccArc" cx="44" cy="44" r="36" transform="rotate(-90 44 44)"></circle>
      </svg>
      <div class="cc__ringNum" id="ccCount">120</div>
    </div>
  </div>
  <p class="cc__hint" id="ccHint"></p>
  <p class="cc__sr" id="ccSr" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  // 기법: 사용 비율(글자수 / 한도)을 링의 호 길이로 바꾸고, 호 길이를 스프링(강성·감쇠)으로 따라가게 한다.
  // 비율이 WARN_RATIO 를 넘으면 민트에서 앰버로, 한도를 넘으면 핑크로 색을 선형 보간하고
  // 한도를 처음 넘는 순간 감쇠 사인으로 링이 좌우로 흔들린다 (난수 없이 시각만으로 계산).
  var CHAR_LIMIT = 120;
  var RING_SPRING_STIFFNESS = 220;
  var RING_SPRING_DAMPING = 14;
  var WARN_RATIO = 0.8;
  var SHAKE_AMP = 6;
  var SHAKE_DECAY_MS = 260;
  var SHAKE_OMEGA = 0.06;
  var START_MS = 200;
  var CHUNK_MS = 130;
  var HOLD_MS = 1500;
  var RING_LENGTH = 2 * Math.PI * 36;

  var CHUNKS = ['오늘 저녁에', '친구들과', '새로 생긴', '식당에 가서', '따뜻한 국물과', '바삭한 튀김을', '나눠 먹기로', '했다 그런데', '자리가 모자라', '한참을', '기다려야 했고', '배가 고파서', '메뉴판만', '계속', '뒤적였다', '그래도', '맛은', '기대 이상이었다', '후기를', '남기려고', '사진도', '찍어 두었다', '다음엔', '더 일찍', '와야겠다'];
  var DEMO_TEXT = CHUNKS.join(' ');

  var MINT = [76, 212, 166];
  var AMBER = [250, 218, 140];
  var PINK = [255, 158, 187];

  var root = document.getElementById('ccRoot');
  var ta = document.getElementById('ccText');
  var arc = document.getElementById('ccArc');
  var ring = document.getElementById('ccRing');
  var card = document.getElementById('ccBody');
  var countEl = document.getElementById('ccCount');
  var hint = document.getElementById('ccHint');
  var sr = document.getElementById('ccSr');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var seg = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter(undefined, { granularity: 'grapheme' }) : null;
  function countGraphemes(s) {
    if (!seg) return Array.from(s).length;
    return Array.from(seg.segment(s)).length;
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function mix(a, b, t) {
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')';
  }
  function colorAt(ratio) {
    var t1 = clamp((ratio - WARN_RATIO) / (1 - WARN_RATIO), 0, 1);
    var t2 = clamp((ratio - 1) / 0.1, 0, 1);
    var warm = [MINT[0] + (AMBER[0] - MINT[0]) * t1, MINT[1] + (AMBER[1] - MINT[1]) * t1, MINT[2] + (AMBER[2] - MINT[2]) * t1];
    return mix(warm, PINK, t2);
  }
  function tintAt(ratio, alpha) {
    var t1 = clamp((ratio - WARN_RATIO) / (1 - WARN_RATIO), 0, 1);
    var t2 = clamp((ratio - 1) / 0.1, 0, 1);
    var c = [0, 1, 2].map(function (i) {
      var warm = MINT[i] + (AMBER[i] - MINT[i]) * t1;
      return Math.round(warm + (PINK[i] - warm) * t2);
    });
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + alpha + ')';
  }

  var used = 0;
  var x = 0;
  var v = 0;
  var stage = 0;
  var shakeAt = -1;
  var t0 = null;
  function perfNow() { return t0 === null ? 0 : performance.now() - t0; }

  function paint(nowMs) {
    var ratio = used / CHAR_LIMIT;
    var drawn = clamp(x, 0, 1);
    arc.style.strokeDasharray = (drawn * RING_LENGTH).toFixed(2) + ' ' + RING_LENGTH.toFixed(2);
    arc.style.stroke = colorAt(Math.min(x, 1.12));
    card.style.background = tintAt(Math.min(x, 1.12), 0.16);
    var remain = CHAR_LIMIT - used;
    countEl.textContent = String(remain);
    countEl.style.color = remain < 0 ? 'rgb(255,158,187)' : '';
    hint.textContent = remain >= 0 ? '남은 글자 ' + remain + '자' : '넘친 글자 ' + (-remain) + '자';
    var pulse = 1 + Math.max(0, x - 1) * 0.5;
    var dx = 0;
    if (shakeAt >= 0 && !reduce) {
      var age = nowMs - shakeAt;
      var amp = SHAKE_AMP * Math.exp(-age / SHAKE_DECAY_MS);
      dx = amp < 0.1 ? 0 : amp * Math.sin(age * SHAKE_OMEGA);
    }
    ring.style.transform = 'translateX(' + dx.toFixed(2) + 'px) scale(' + pulse.toFixed(3) + ')';
    return ratio;
  }

  function update(nowMs) {
    used = countGraphemes(ta.value);
    var ratio = used / CHAR_LIMIT;
    var next = ratio >= 1 ? 2 : (ratio >= WARN_RATIO ? 1 : 0);
    if (next !== stage) {
      if (next === 2 && !reduce) shakeAt = nowMs;
      sr.textContent = next === 2 ? '한도를 넘었어요' : (next === 1 ? '곧 한도예요' : '');
      stage = next;
    }
    if (reduce) { x = Math.min(ratio, 1); v = 0; paint(nowMs); }
  }

  function stopDemo() { root.classList.remove('is-demo'); }
  ta.addEventListener('focus', stopDemo);
  ta.addEventListener('keydown', stopDemo);
  ta.addEventListener('paste', stopDemo);
  ta.addEventListener('input', function () { stopDemo(); update(perfNow()); });

  var lastDemoN = -1;
  var lastTs = null;
  function tick(ts) {
    if (t0 === null) t0 = ts;
    var now = ts - t0;
    var dt = lastTs === null ? 0.016 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if (root.classList.contains('is-demo')) {
      var cyc = (now - START_MS) % (CHUNKS.length * CHUNK_MS + HOLD_MS);
      var n = now < START_MS ? 0 : Math.min(CHUNKS.length, Math.floor(cyc / CHUNK_MS) + 1);
      if (n !== lastDemoN) {
        if (n === 1) shakeAt = -1;
        lastDemoN = n;
        ta.value = CHUNKS.slice(0, n).join(' ');
        update(now);
      }
    }
    var target = used / CHAR_LIMIT;
    var steps = Math.max(1, Math.ceil(dt / 0.008));
    var h = dt / steps;
    for (var s = 0; s < steps; s += 1) {
      var a = -RING_SPRING_STIFFNESS * (x - target) - RING_SPRING_DAMPING * v;
      v += a * h;
      x += v * h;
    }
    paint(now);
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    ta.value = DEMO_TEXT;
    update(0);
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
