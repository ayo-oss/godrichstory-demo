<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face-scan quote</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="testimonial is-demo">
    <div class="testimonial__avatar" aria-hidden="true">
      <span class="testimonial__scanbox"></span>
    </div>
    <figure class="testimonial__card">
      <span class="testimonial__corner testimonial__corner--tl" aria-hidden="true"></span>
      <span class="testimonial__corner testimonial__corner--tr" aria-hidden="true"></span>
      <span class="testimonial__corner testimonial__corner--bl" aria-hidden="true"></span>
      <span class="testimonial__corner testimonial__corner--br" aria-hidden="true"></span>
      <span class="testimonial__verified">VERIFIED</span>
      <blockquote class="testimonial__quote">見逃しがないので安心です。</blockquote>
      <figcaption class="testimonial__author">イ・ドユン · セキュリティチームマネージャー</figcaption>
    </figure>
  </div>
</main>
</body>
</html>
