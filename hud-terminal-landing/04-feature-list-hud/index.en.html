<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System-log list</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="loglist is-demo">
    <ul class="loglist__rows">
      <li class="loglist__row"><span class="loglist__ts">00:01</span><span class="loglist__text">User authentication verified</span><span class="loglist__ok">OK</span></li>
      <li class="loglist__row"><span class="loglist__ts">00:02</span><span class="loglist__text">Location data synced</span><span class="loglist__ok">OK</span></li>
      <li class="loglist__row"><span class="loglist__ts">00:03</span><span class="loglist__text">Anomaly pattern scan</span><span class="loglist__ok">OK</span></li>
      <li class="loglist__row"><span class="loglist__ts">00:04</span><span class="loglist__text">Backup server connected</span><span class="loglist__ok">OK</span></li>
    </ul>
    <p class="loglist__cursorline">READY <span class="loglist__cursor" aria-hidden="true"></span></p>
  </div>
</main>
</body>
</html>
