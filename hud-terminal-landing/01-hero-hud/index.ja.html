<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lock-on hero</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="hero is-demo">
    <span class="hero__corner hero__corner--tl" aria-hidden="true"></span>
    <span class="hero__corner hero__corner--tr" aria-hidden="true"></span>
    <span class="hero__corner hero__corner--bl" aria-hidden="true"></span>
    <span class="hero__corner hero__corner--br" aria-hidden="true"></span>
    <div class="hero__scan" aria-hidden="true"></div>
    <p class="hero__eyebrow"><span class="hero__dot" aria-hidden="true"></span>SENTRY / ONLINE</p>
    <h1 class="hero__title">見逃す瞬間なく、<br>見守るダッシュボード</h1>
    <p class="hero__desc">リアルタイムで検知し、記録します。</p>
    <button class="hero__cta" type="button">無料で始める</button>
    <p class="hero__readout">SIG <span class="hero__cursor" aria-hidden="true"></span></p>
  </section>
</main>
</body>
</html>
