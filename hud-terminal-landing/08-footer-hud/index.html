<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal footer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <footer class="footerhud is-demo">
    <span class="footerhud__corner footerhud__corner--tl" aria-hidden="true"></span>
    <span class="footerhud__corner footerhud__corner--tr" aria-hidden="true"></span>
    <div class="footerhud__noise" aria-hidden="true"></div>
    <div class="footerhud__cols">
      <div class="footerhud__col">
        <p class="footerhud__head">SYSTEM</p>
        <ul>
          <li>대시보드</li>
          <li>알림 설정</li>
        </ul>
      </div>
      <div class="footerhud__col">
        <p class="footerhud__head">SUPPORT</p>
        <ul>
          <li>문의하기</li>
          <li>이용 가이드</li>
        </ul>
      </div>
      <div class="footerhud__col">
        <p class="footerhud__head">LEGAL</p>
        <ul>
          <li>이용약관</li>
          <li>개인정보처리방침</li>
        </ul>
      </div>
    </div>
    <p class="footerhud__copy">SENTRY © 2026</p>
  </footer>
</main>
</body>
</html>
