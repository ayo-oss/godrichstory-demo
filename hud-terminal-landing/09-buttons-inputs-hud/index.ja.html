<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lock-on button, scan input</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <form class="formhud is-demo">
    <button class="formhud__btn" type="button">
      <span class="formhud__corner formhud__corner--tl" aria-hidden="true"></span>
      <span class="formhud__corner formhud__corner--tr" aria-hidden="true"></span>
      <span class="formhud__corner formhud__corner--bl" aria-hidden="true"></span>
      <span class="formhud__corner formhud__corner--br" aria-hidden="true"></span>
      ロックオン開始
    </button>
    <label class="formhud__field">
      <input class="formhud__input" type="email" placeholder="メールアドレス" readonly>
      <span class="formhud__caret" aria-hidden="true"></span>
    </label>
  </form>
</main>
</body>
</html>
