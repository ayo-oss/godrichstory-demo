<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locked-target plan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pricing is-demo">
    <article class="pricing__card pricing__card--dim">
      <p class="pricing__name">Light</p>
      <p class="pricing__price">Free</p>
      <ul class="pricing__feats">
        <li>Basic scan</li>
        <li>1 channel</li>
      </ul>
    </article>
    <article class="pricing__card pricing__card--locked">
      <span class="pricing__badge">LOCKED</span>
      <span class="pricing__corner pricing__corner--tl" aria-hidden="true"></span>
      <span class="pricing__corner pricing__corner--tr" aria-hidden="true"></span>
      <span class="pricing__corner pricing__corner--bl" aria-hidden="true"></span>
      <span class="pricing__corner pricing__corner--br" aria-hidden="true"></span>
      <p class="pricing__name">Pro</p>
      <p class="pricing__price">$9/mo</p>
      <ul class="pricing__feats">
        <li>Real-time tracking</li>
        <li>Unlimited channels</li>
      </ul>
    </article>
  </div>
</main>
</body>
</html>
