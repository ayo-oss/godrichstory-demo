<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locked-target plan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pricing is-demo">
    <article class="pricing__card pricing__card--dim">
      <p class="pricing__name">라이트</p>
      <p class="pricing__price">무료</p>
      <ul class="pricing__feats">
        <li>기본 스캔</li>
        <li>채널 1개</li>
      </ul>
    </article>
    <article class="pricing__card pricing__card--locked">
      <span class="pricing__badge">LOCKED</span>
      <span class="pricing__corner pricing__corner--tl" aria-hidden="true"></span>
      <span class="pricing__corner pricing__corner--tr" aria-hidden="true"></span>
      <span class="pricing__corner pricing__corner--bl" aria-hidden="true"></span>
      <span class="pricing__corner pricing__corner--br" aria-hidden="true"></span>
      <p class="pricing__name">프로</p>
      <p class="pricing__price">월 9,900원</p>
      <ul class="pricing__feats">
        <li>실시간 추적</li>
        <li>채널 무제한</li>
      </ul>
    </article>
  </div>
</main>
</body>
</html>
