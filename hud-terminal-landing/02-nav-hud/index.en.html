<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status-bar nav</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <nav class="navhud is-demo" aria-label="SENTRY">
    <span class="navhud__brand">SENTRY</span>
    <ul class="navhud__track">
      <li class="navhud__item">Home</li>
      <li class="navhud__item">Features</li>
      <li class="navhud__item">Pricing</li>
      <li class="navhud__item">Contact</li>
      <span class="navhud__indicator" aria-hidden="true"></span>
    </ul>
    <span class="navhud__status"><span class="navhud__dot" aria-hidden="true"></span>LIVE</span>
  </nav>
</main>
</body>
</html>
