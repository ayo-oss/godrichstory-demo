<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy-link toast</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="is-demo">
<div class="stage">
  <section class="ct" aria-label="リンクをコピー">

    <p class="ct__label">共有アドレス</p>
    <div class="ct__field">
      <input class="ct__url" type="text" value="https://example.com/posts/share-ui" readonly aria-label="共有アドレス">
      <button class="ct__btn" type="button">
        <span class="ct__ics" aria-hidden="true">
          <span class="ct__ic ct__ic--copy"><svg width="18" height="18" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M216,40V168H168V88H88V40Z" opacity="0.2"/><path d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z"/></svg></span>
          <span class="ct__ic ct__ic--done"><svg width="18" height="18" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M232,56V200a16,16,0,0,1-16,16H40a16,16,0,0,1-16-16V56A16,16,0,0,1,40,40H216A16,16,0,0,1,232,56Z" opacity="0.2"/><path d="M205.66,85.66l-96,96a8,8,0,0,1-11.32,0l-40-40a8,8,0,0,1,11.32-11.32L104,164.69l90.34-90.35a8,8,0,0,1,11.32,11.32Z"/></svg></span>
        </span>
        <span class="ct__btnLabel">コピー</span>
      </button>
    </div>

    <p class="ct__toast" role="status" aria-live="polite">
      <span class="ct__toastIcs" aria-hidden="true">
        <span class="ct__toastIc ct__toastIc--ok" aria-hidden="true"><svg width="16" height="16" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M232,56V200a16,16,0,0,1-16,16H40a16,16,0,0,1-16-16V56A16,16,0,0,1,40,40H216A16,16,0,0,1,232,56Z" opacity="0.2"/><path d="M205.66,85.66l-96,96a8,8,0,0,1-11.32,0l-40-40a8,8,0,0,1,11.32-11.32L104,164.69l90.34-90.35a8,8,0,0,1,11.32,11.32Z"/></svg></span>
        <span class="ct__toastIc ct__toastIc--bad" aria-hidden="true"><svg width="16" height="16" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M216,56V200a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V56A16,16,0,0,1,56,40H200A16,16,0,0,1,216,56Z" opacity="0.2"/><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg></span>
      </span>
      <span class="ct__toastText">アドレスをコピーしました</span>
    </p>

  </section>
</div>
<script>
(function () {
  var body  = document.body;
  var btn   = document.querySelector('.ct__btn');
  var input = document.querySelector('.ct__url');
  var root  = document.querySelector('.ct');
  var text  = document.querySelector('.ct__toastText');
  var timer = 0;

  function hand() { body.classList.remove('is-demo'); }   // 사람이 손을 대면 자동 재생을 끈다

  function show(msg, bad) {
    text.textContent = msg;
    root.classList.toggle('is-bad', !!bad);          // 막힌 경우엔 확인 표시 대신 가위표
    root.classList.add('is-done');
    clearTimeout(timer);
    timer = setTimeout(function () { root.classList.remove('is-done'); }, 1800);
  }

  btn.addEventListener('click', function () {
    hand();
    var url = input.value;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(
        function () { show('アドレスをコピーしました', false); },
        function () { show('コピーがブロックされました。手動で選択してください', true); }
      );
      return;
    }
    input.select();                                    // 클립보드 API 가 없는 환경의 대비책
    show('アドレスを選択しました。手動でコピーしてください', true);
  });

  btn.addEventListener('pointerdown', hand);
  btn.addEventListener('focusin', hand);
  input.addEventListener('focusin', hand);
})();
</script>
</body>
</html>
