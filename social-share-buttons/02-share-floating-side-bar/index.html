<script>
(function () {
  var body = document.body;

  function hand() { body.classList.remove('is-demo'); }   // 사람이 손을 대면 자동 재생을 끈다

  document.querySelectorAll('.sr__link').forEach(function (a) {
    a.addEventListener('pointerdown', hand);
    a.addEventListener('focusin', hand);
    a.addEventListener('click', function (e) { e.preventDefault(); hand(); });
  });
  document.querySelector('.sr__view').addEventListener('scroll', hand);
})();
</script>
