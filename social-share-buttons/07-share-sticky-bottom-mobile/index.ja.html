<script>
(function () {
  var body   = document.body;
  var root   = document.querySelector('.sb');
  var handle = document.querySelector('.sb__handle');
  var picks  = Array.prototype.slice.call(document.querySelectorAll('.sb__pick'));
  var startY = 0;

  function hand() { body.classList.remove('is-demo'); }   // 사람이 손을 대면 자동 재생을 끈다

  function setOpen(on) {
    root.classList.toggle('is-open', on);
    handle.setAttribute('aria-expanded', on ? 'true' : 'false');
    picks.forEach(function (a) { a.tabIndex = on ? 0 : -1; });   // 접힌 행은 Tab 순서에서 뺀다
  }

  handle.addEventListener('click', function () {
    hand();
    setOpen(handle.getAttribute('aria-expanded') !== 'true');
  });
  handle.addEventListener('focusin', hand);

  // 위로 쓸어 올리면 펼쳐지고 아래로 내리면 접힌다 — 세로 스크롤은 그대로 둔다
  handle.addEventListener('pointerdown', function (e) { hand(); startY = e.clientY; });
  handle.addEventListener('pointerup', function (e) {
    var dy = startY - e.clientY;
    if (dy > 12) setOpen(true);
    else if (dy < -12) setOpen(false);
  });

  setOpen(false);
})();
</script>
