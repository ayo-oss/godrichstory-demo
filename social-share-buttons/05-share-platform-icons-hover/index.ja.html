<script>
(function () {
  var body   = document.body;
  var toggle = document.querySelector('.ex__toggle');
  var root   = document.querySelector('.ex');
  var items  = Array.prototype.slice.call(document.querySelectorAll('.ex__item'));

  function hand() { body.classList.remove('is-demo'); }   // 사람이 손을 대면 자동 재생을 끈다

  function setOpen(open) {
    root.classList.toggle('is-open', open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    items.forEach(function (a) { a.tabIndex = open ? 0 : -1; });   // 접힌 목록은 Tab 순서에서 뺀다
  }

  toggle.addEventListener('click', function () {
    hand();
    setOpen(toggle.getAttribute('aria-expanded') !== 'true');
  });
  toggle.addEventListener('pointerdown', hand);
  toggle.addEventListener('focusin', hand);

  root.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    hand();
    setOpen(false);
    toggle.focus({ preventScroll: true });
  });

  items.forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); hand(); });
  });

  setOpen(false);
})();
</script>
