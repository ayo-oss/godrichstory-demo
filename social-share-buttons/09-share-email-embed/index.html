<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email and embed share box</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="is-demo">
<div class="stage">
  <section class="ee" aria-label="메일과 퍼가기로 공유">

    <div class="ee__tabs" role="tablist" aria-label="공유 방법">
      <button class="ee__tab is-on" type="button" role="tab" id="ee-t1" aria-controls="ee-p1" aria-selected="true">메일</button>
      <button class="ee__tab" type="button" role="tab" id="ee-t2" aria-controls="ee-p2" aria-selected="false" tabindex="-1">퍼가기</button>
      <span class="ee__line" aria-hidden="true"></span>
    </div>

    <div class="ee__panels">
      <div class="ee__panel ee__panel--mail" role="tabpanel" id="ee-p1" aria-labelledby="ee-t1">
        <p class="ee__label">받는 사람에게 갈 편지</p>
        <a class="ee__mail" href="mailto:?subject=%EA%B3%B5%EC%9C%A0%ED%95%A9%EB%8B%88%EB%8B%A4&amp;body=https%3A%2F%2Fexample.com%2Fposts%2Fshare-ui">
          <span class="ee__mailIc"><svg width="18" height="18" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M223.69,42.18l-58.22,192a8,8,0,0,1-14.92,1.25L108,148,20.58,105.45a8,8,0,0,1,1.25-14.92l192-58.22A8,8,0,0,1,223.69,42.18Z" opacity="0.2"/><path d="M227.32,28.68a16,16,0,0,0-15.66-4.08l-.15,0L19.57,82.84a16,16,0,0,0-2.49,29.8L102,154l41.3,84.87A15.86,15.86,0,0,0,157.74,248q.69,0,1.38-.06a15.88,15.88,0,0,0,14-11.51l58.2-191.94c0-.05,0-.1,0-.15A16,16,0,0,0,227.32,28.68ZM157.83,231.85l-.05.14,0-.07-40.06-82.3,48-48a8,8,0,0,0-11.31-11.31l-48,48L24.08,98.25l-.07,0,.14,0L216,40Z"/></svg></span>
          <span class="ee__mailName">메일 앱으로 열기</span>
        </a>
      </div>

      <div class="ee__panel ee__panel--embed" role="tabpanel" id="ee-p2" aria-labelledby="ee-t2" hidden>
        <p class="ee__label">그대로 붙이는 코드</p>
        <div class="ee__field">
          <input class="ee__code" type="text" value="&lt;iframe src=&quot;https://example.com/embed&quot;&gt;&lt;/iframe&gt;" readonly aria-label="붙여 넣을 코드">
          <button class="ee__copy" type="button" aria-label="코드 복사"><svg width="16" height="16" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M216,40V168H168V88H88V40Z" opacity="0.2"/><path d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z"/></svg></button>
        </div>
      </div>
    </div>

  </section>
</div>
<script>
(function () {
  var body  = document.body;
  var root  = document.querySelector('.ee');
  var tabs  = Array.prototype.slice.call(document.querySelectorAll('.ee__tab'));
  var panes = Array.prototype.slice.call(document.querySelectorAll('.ee__panel'));
  var at = 0;

  function hand() { body.classList.remove('is-demo'); }   // 사람이 손을 대면 자동 재생을 끈다

  // 밑줄은 짐작한 px 이 아니라 칸 번호 하나로만 움직인다 — 칸 폭이 바뀌어도 안 어긋난다
  function move(i, focus) {
    at = (i + tabs.length) % tabs.length;
    tabs.forEach(function (t, k) {
      var on = k === at;
      t.classList.toggle('is-on', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;                  // 로빙 탭인덱스
      panes[k].hidden = !on;
    });
    root.style.setProperty('--n', at);
    if (focus) tabs[at].focus({ preventScroll: true });
  }

  tabs.forEach(function (t, k) {
    t.addEventListener('click', function () { hand(); move(k, true); });
  });
  root.querySelector('.ee__tabs').addEventListener('keydown', function (e) {
    var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    hand();
    move(at + d, true);
  });
  root.addEventListener('pointerdown', hand);
  root.addEventListener('focusin', hand);

  document.querySelector('.ee__copy').addEventListener('click', function () {
    var field = document.querySelector('.ee__code');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(field.value);
    else field.select();
  });

  move(0, false);
})();
</script>
</body>
</html>
