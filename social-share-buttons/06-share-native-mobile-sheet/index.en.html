<script>
(function () {
  var body  = document.body;
  var root  = document.querySelector('.ms');
  var open  = document.querySelector('.ms__open');
  var sheet = document.querySelector('.ms__sheet');
  var scrim = document.querySelector('.ms__scrim');
  var close = document.querySelector('.ms__close');

  function hand() { body.classList.remove('is-demo'); }   // 사람이 손을 대면 자동 재생을 끈다

  function focusables() {
    return Array.prototype.slice.call(sheet.querySelectorAll('button'));
  }

  function setOpen(on) {
    root.classList.toggle('is-open', on);
    sheet.setAttribute('aria-hidden', on ? 'false' : 'true');
    focusables().forEach(function (b) { b.tabIndex = on ? 0 : -1; });
    if (on) focusables()[0].focus({ preventScroll: true });
    else open.focus({ preventScroll: true });
  }

  open.addEventListener('click', function () { hand(); setOpen(true); });
  open.addEventListener('pointerdown', hand);
  open.addEventListener('focusin', hand);
  close.addEventListener('click', function () { hand(); setOpen(false); });
  scrim.addEventListener('click', function () { hand(); setOpen(false); });

  // 초점 가두기 — 시트가 열려 있는 동안 Tab 은 시트 안을 돈다
  sheet.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { hand(); setOpen(false); return; }
    if (e.key !== 'Tab') return;
    var list = focusables();
    var last = list.length - 1;
    var at   = list.indexOf(document.activeElement);
    if (e.shiftKey && at <= 0)      { e.preventDefault(); list[last].focus({ preventScroll: true }); }
    else if (!e.shiftKey && at === last) { e.preventDefault(); list[0].focus({ preventScroll: true }); }
  });

  sheet.setAttribute('aria-hidden', 'true');
  focusables().forEach(function (b) { b.tabIndex = -1; });
})();
</script>
