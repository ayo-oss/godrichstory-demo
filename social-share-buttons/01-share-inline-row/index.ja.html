  </section>
</div>
<script>
(function () {
  var body = document.body;

  function hand() { body.classList.remove('is-demo'); }   // 사람이 손을 대면 자동 재생을 끈다

  document.querySelectorAll('.ir__btn').forEach(function (b) {
    b.addEventListener('pointerdown', hand);
    b.addEventListener('focusin', hand);
    b.addEventListener('click', function () {
      hand();
      var on = b.getAttribute('aria-pressed') === 'true';   // 누른 자국이 그대로 남는다
      b.setAttribute('aria-pressed', on ? 'false' : 'true');
    });
  });
})();
</script>
</body>
