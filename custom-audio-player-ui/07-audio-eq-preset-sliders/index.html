<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슬라이더 값이 막대 반응폭을 정하는 프리셋 이퀄라이저 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-play" viewBox="0 0 256 256"><g fill="currentColor"><path d="M228.23 134.69L84.15 222.81A8 8 0 0 1 72 216.12V39.88a8 8 0 0 1 12.15-6.69l144.08 88.12a7.82 7.82 0 0 1 0 13.38" opacity=".2"/><path d="M232.4 114.49L88.32 26.35a16 16 0 0 0-16.2-.3A15.86 15.86 0 0 0 64 39.87v176.26A15.94 15.94 0 0 0 80 232a16.07 16.07 0 0 0 8.36-2.35l144.04-88.14a15.81 15.81 0 0 0 0-27ZM80 215.94V40l143.83 88Z"/></g></symbol>
    <symbol id="ico-pause" viewBox="0 0 256 256"><g fill="currentColor"><path d="M208 48v160a8 8 0 0 1-8 8h-40a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8h40a8 8 0 0 1 8 8M96 40H56a8 8 0 0 0-8 8v160a8 8 0 0 0 8 8h40a8 8 0 0 0 8-8V48a8 8 0 0 0-8-8" opacity=".2"/><path d="M200 32h-40a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176h-40V48h40ZM96 32H56a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176H56V48h40Z"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="peq is-demo is-playing" id="peq">
  <p class="peq__hint"><span>슬라이더 값을 올리면 그 대역 막대 그룹이 흔들리는 반응폭이 커집니다</span></p>
  <div class="peq__panel">
    <button class="peq__play" id="play" type="button" aria-label="재생">
      <svg class="peq__ico peq__ico--play" aria-hidden="true"><use href="#ico-play"></use></svg>
      <svg class="peq__ico peq__ico--pause" aria-hidden="true"><use href="#ico-pause"></use></svg>
    </button>
    <div class="peq__bands" id="bands">
      <div class="peq__band" data-band="0">
        <div class="peq__bars" data-bars="0" aria-hidden="true"></div>
        <input class="peq__slider" type="range" min="0" max="100" value="30" id="slider-0" aria-label="저음 반응폭">
        <span class="peq__label">저음</span>
      </div>
      <div class="peq__band" data-band="1">
        <div class="peq__bars" data-bars="1" aria-hidden="true"></div>
        <input class="peq__slider" type="range" min="0" max="100" value="30" id="slider-1" aria-label="중음 반응폭">
        <span class="peq__label">중음</span>
      </div>
      <div class="peq__band" data-band="2">
        <div class="peq__bars" data-bars="2" aria-hidden="true"></div>
        <input class="peq__slider" type="range" min="0" max="100" value="30" id="slider-2" aria-label="고음 반응폭">
        <span class="peq__label">고음</span>
      </div>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('peq');
  var playBtn = document.getElementById('play');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isDemo = true;

  // 결정론 난수 — Math.random 을 쓰지 않는다. LCG(선형합동생성기) 하나로 막대별 위상·기준 높이를 만든다.
  function makeLcg(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  var BAND_COUNT = 3;
  var BARS_PER_BAND = 6;
  var BAND_RESPONSE_RANGE = 1.6; // 슬라이더 반응폭 배율 상한 — 변형: 키우면 슬라이더를 움직였을 때 막대 그룹이 흔들리는 높이 차이가 더 커진다
  var rng = makeLcg(3307);

  var sliders = [];
  var bands = [];
  for (var b = 0; b < BAND_COUNT; b++) {
    var barsEl = document.querySelector('[data-bars="' + b + '"]');
    var bars = [];
    for (var i = 0; i < BARS_PER_BAND; i++) {
      var el = document.createElement('div');
      el.className = 'peq__bar';
      barsEl.appendChild(el);
      bars.push({
        el: el,
        f1: 0.5 + rng() * 0.35,
        p1: rng() * Math.PI * 2,
        f2: 1.3 + rng() * 0.6,
        p2: rng() * Math.PI * 2,
        w2: 0.2 + rng() * 0.2,
        base: 0.32 + rng() * 0.14
      });
    }
    bands.push(bars);
    sliders.push(document.getElementById('slider-' + b));
  }

  function synth(bar, tSec) {
    var s1 = Math.sin(tSec * bar.f1 * Math.PI * 2 + bar.p1);
    var s2 = Math.sin(tSec * bar.f2 * Math.PI * 2 + bar.p2) * bar.w2;
    return (s1 + s2) / (1 + bar.w2); // -1..1
  }

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  var playing = true, t0 = 0;

  function render(now) {
    var tSec = (now - t0) / 1000;
    var effPlaying = isDemo ? true : playing;
    for (var b = 0; b < BAND_COUNT; b++) {
      var norm = Number(sliders[b].value) / 100; // 0..1
      var amp = norm * BAND_RESPONSE_RANGE;
      var bars = bands[b];
      for (var i = 0; i < bars.length; i++) {
        var bar = bars[i];
        var sway = effPlaying ? synth(bar, tSec) : 0;
        var h = bar.base + sway * amp * 0.5;
        h = Math.max(0.06, Math.min(1, h));
        // 막대는 바닥이 기준점이라 아래쪽 원점으로 세로로만 자란다 — 중심 기준이 아닌 실제 앵커 지점
        bar.el.style.transform = 'scaleY(' + h + ')';
      }
    }
  }

  function setPlaying(next) {
    playing = next;
    root.classList.toggle('is-playing', next);
  }

  function onPlayClick() { human(); setPlaying(!playing); }
  function onPlayKeydown(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); setPlaying(!playing); }
  }
  function onSliderInput() { human(); }

  sliders.forEach(function (s) { s.addEventListener('input', onSliderInput); });

  var driveStart = 0;
  function triangle(frac) { return frac < 0.5 ? frac * 2 : 2 - frac * 2; }
  function frame(now) {
    if (!t0) t0 = now;
    if (isDemo) {
      if (!driveStart) driveStart = now;
      var DRIVE_PERIOD_MS = 2000; // 렌더 캐처 창(설정 초=2.0)과 같은 주기 — 시연 전용
      for (var b = 0; b < BAND_COUNT; b++) {
        var phase = b / BAND_COUNT;
        var frac = (((now - driveStart) / DRIVE_PERIOD_MS) + phase) % 1;
        sliders[b].value = String(Math.round(triangle(frac) * 100));
      }
    }
    render(now);
    requestAnimationFrame(frame);
  }

  if (reduce) {
    root.classList.add('is-still');
    t0 = performance.now();
    render(t0);
    playBtn.addEventListener('click', function () { human(); setPlaying(!playing); render(performance.now()); });
    playBtn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); setPlaying(!playing); render(performance.now()); }
    });
    sliders.forEach(function (s) { s.addEventListener('input', function () { human(); render(performance.now()); }); });
  } else {
    playBtn.addEventListener('click', onPlayClick);
    playBtn.addEventListener('keydown', onPlayKeydown);
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
