<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>再生進行率の値で描かれるカスタムコントロールバー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-play" viewBox="0 0 256 256"><g fill="currentColor"><path d="M228.23 134.69L84.15 222.81A8 8 0 0 1 72 216.12V39.88a8 8 0 0 1 12.15-6.69l144.08 88.12a7.82 7.82 0 0 1 0 13.38" opacity=".2"/><path d="M232.4 114.49L88.32 26.35a16 16 0 0 0-16.2-.3A15.86 15.86 0 0 0 64 39.87v176.26A15.94 15.94 0 0 0 80 232a16.07 16.07 0 0 0 8.36-2.35l144.04-88.14a15.81 15.81 0 0 0 0-27ZM80 215.94V40l143.83 88Z"/></g></symbol>
    <symbol id="ico-pause" viewBox="0 0 256 256"><g fill="currentColor"><path d="M208 48v160a8 8 0 0 1-8 8h-40a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8h40a8 8 0 0 1 8 8M96 40H56a8 8 0 0 0-8 8v160a8 8 0 0 0 8 8h40a8 8 0 0 0 8-8V48a8 8 0 0 0-8-8" opacity=".2"/><path d="M200 32h-40a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176h-40V48h40ZM96 32H56a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176H56V48h40Z"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="cp is-demo is-playing" id="cp">
  <p class="cp__hint"><span>再生を押すと経過時間の値からハンドル位置と残り時間が再計算されます</span></p>
  <div class="cp__panel">
    <div class="cp__title" id="title">Untitled Session</div>
    <div class="cp__row">
      <button class="cp__play" id="play" type="button" aria-label="再生">
        <svg class="cp__ico cp__ico--play" aria-hidden="true"><use href="#ico-play"></use></svg>
        <svg class="cp__ico cp__ico--pause" aria-hidden="true"><use href="#ico-pause"></use></svg>
      </button>
      <div class="cp__seek" id="seek" tabindex="0" role="slider" aria-label="シークバー" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="cp__track" id="track">
          <div class="cp__fill" id="fill"></div>
          <div class="cp__handle" id="handle"></div>
        </div>
      </div>
    </div>
    <div class="cp__time">
      <span id="elapsed">0:00</span>
      <span id="remain">-3:34</span>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('cp');
  var playBtn = document.getElementById('play');
  var seek = document.getElementById('seek');
  var track = document.getElementById('track');
  var fill = document.getElementById('fill');
  var handle = document.getElementById('handle');
  var elapsedEl = document.getElementById('elapsed');
  var remainEl = document.getElementById('remain');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isDemo = true;

  var TRACK_LENGTH_S = 214; // 3:34 — 실 오디오 파일 없음, 합성 트랙 길이 상수
  var SEEK_STEP_S = 5; // 방향키 한 번의 탐색 단위(초)
  var PROGRESS_UPDATE_MS = 200; // 진행률 재계산 주기 — 변형: 이 값을 줄이면 더 잦게 다시 계산해 매끈해진다
  var trackW = 0;

  function fit() {
    var r = track.getBoundingClientRect();
    var hr = handle.getBoundingClientRect();
    trackW = Math.max(1, r.width - hr.width);
  }

  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function render(elapsedS) {
    var p = Math.min(1, Math.max(0, elapsedS / TRACK_LENGTH_S));
    fill.style.transform = 'scaleX(' + p + ')';
    handle.style.transform = 'translateX(' + (p * trackW) + 'px)';
    elapsedEl.textContent = fmt(elapsedS);
    remainEl.textContent = '-' + fmt(TRACK_LENGTH_S - elapsedS);
    seek.setAttribute('aria-valuenow', String(Math.round(p * 100)));
  }

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  var state = { elapsedS: 0, playing: false, playStart: 0, lastRenderMs: -1 };

  function setPlaying(next) {
    state.playing = next;
    root.classList.toggle('is-playing', next);
    if (next) state.playStart = performance.now() - state.elapsedS * 1000;
  }

  function seekTo(elapsedS) {
    state.elapsedS = Math.min(TRACK_LENGTH_S, Math.max(0, elapsedS));
    if (state.playing) state.playStart = performance.now() - state.elapsedS * 1000;
    render(state.elapsedS);
  }

  function onTrackClick(e) {
    human();
    var r = track.getBoundingClientRect();
    var ratio = (e.clientX - r.left) / r.width;
    seekTo(ratio * TRACK_LENGTH_S);
  }

  function onSeekKeydown(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      human();
      seekTo(state.elapsedS + (e.key === 'ArrowRight' ? SEEK_STEP_S : -SEEK_STEP_S));
    }
  }

  function onPlayClick() {
    human();
    setPlaying(!state.playing);
  }

  var driveStart = 0;
  function driveTick(now) {
    if (!driveStart) driveStart = now;
    if (isDemo) {
      var DRIVE_PERIOD_MS = 2000; // 렌더 캐처 창(설정 초=2.0)과 같은 주기 — 시연 전용
      var frac = ((now - driveStart) % DRIVE_PERIOD_MS) / DRIVE_PERIOD_MS;
      if (now - state.lastRenderMs >= PROGRESS_UPDATE_MS) {
        render(frac * TRACK_LENGTH_S);
        state.lastRenderMs = now;
      }
    }
    requestAnimationFrame(driveTick);
  }

  function frame(now) {
    if (!isDemo) {
      if (state.playing) {
        var elapsedS = (now - state.playStart) / 1000;
        if (elapsedS >= TRACK_LENGTH_S) { state.playStart = now; elapsedS = 0; }
        state.elapsedS = elapsedS;
      }
      if (now - state.lastRenderMs >= PROGRESS_UPDATE_MS) {
        render(state.elapsedS);
        state.lastRenderMs = now;
      }
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', fit);
  fit();

  if (reduce) {
    root.classList.add('is-still');
    render(0);
    playBtn.addEventListener('click', function () { human(); setPlaying(!state.playing); render(state.elapsedS); });
    track.addEventListener('click', function (e) { onTrackClick(e); });
    seek.addEventListener('keydown', onSeekKeydown);
  } else {
    playBtn.addEventListener('click', onPlayClick);
    track.addEventListener('click', onTrackClick);
    seek.addEventListener('keydown', onSeekKeydown);
    requestAnimationFrame(frame);
    requestAnimationFrame(driveTick);
  }
})();
</script>
</body>
</html>
