<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크롤 값으로 접히는 하단 고정 미니 바 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-play" viewBox="0 0 256 256"><g fill="currentColor"><path d="M228.23 134.69L84.15 222.81A8 8 0 0 1 72 216.12V39.88a8 8 0 0 1 12.15-6.69l144.08 88.12a7.82 7.82 0 0 1 0 13.38" opacity=".2"/><path d="M232.4 114.49L88.32 26.35a16 16 0 0 0-16.2-.3A15.86 15.86 0 0 0 64 39.87v176.26A15.94 15.94 0 0 0 80 232a16.07 16.07 0 0 0 8.36-2.35l144.04-88.14a15.81 15.81 0 0 0 0-27ZM80 215.94V40l143.83 88Z"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="mb is-demo" id="mb">
  <p class="mb__hint"><span>아래로 스크롤하면 값이 계산되어 플레이어가 하단 미니 바로 접힙니다</span></p>
  <div class="mb__viewport" id="viewport">
    <div class="mb__scroll" id="scroll" tabindex="0" role="group" aria-label="스크롤 데모 영역">
      <div class="mb__full" id="full">
        <div class="mb__art"></div>
        <div class="mb__meta">
          <div class="mb__title">Untitled Session</div>
          <div class="mb__sub">Track 01</div>
        </div>
      </div>
      <div class="mb__filler" aria-hidden="true">
        <div class="mb__line"></div>
        <div class="mb__line"></div>
        <div class="mb__line"></div>
        <div class="mb__line"></div>
        <div class="mb__line"></div>
        <div class="mb__line"></div>
      </div>
    </div>
    <button class="mb__mini" id="mini" type="button" aria-label="전체 플레이어로 돌아가기">
      <div class="mb__mini-art"></div>
      <div class="mb__mini-title">Untitled Session</div>
      <svg class="mb__mini-ico" aria-hidden="true"><use href="#ico-play"></use></svg>
    </button>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('mb');
  var viewport = document.getElementById('viewport');
  var scrollEl = document.getElementById('scroll');
  var full = document.getElementById('full');
  var mini = document.getElementById('mini');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isDemo = true;

  var MORPH_RANGE_PX = 56; // 완전 전환까지 걸리는 스크롤 거리
  var SCROLL_STEP_PX = 48; // 방향키 한 번의 스크롤 단위
  var programmatic = false; // 시연 루프가 scrollTop 을 밀 때 뜨는 scroll 이벤트를 실사용 스크롤과 구분한다

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  function recompute() {
    var threshold = full.offsetHeight; // 실제 카드 높이를 기준으로 전환 시점을 계산한다
    var y = scrollEl.scrollTop;
    var p = Math.min(1, Math.max(0, (y - threshold) / MORPH_RANGE_PX));
    mini.style.opacity = String(p);
    mini.style.transform = 'translateY(' + ((1 - p) * 16) + 'px) scale(' + (0.94 + p * 0.06) + ')';
    mini.style.pointerEvents = p > 0.5 ? 'auto' : 'none';
  }

  function onScroll() {
    if (programmatic) { programmatic = false; recompute(); return; }
    human(); recompute();
  }

  function onScrollKeydown(e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      human();
      scrollEl.scrollTop += (e.key === 'ArrowDown' ? SCROLL_STEP_PX : -SCROLL_STEP_PX);
      recompute();
    }
  }

  function onMiniClick() {
    human();
    scrollEl.scrollTop = 0;
    recompute();
  }

  var driveStart = 0;
  function triangle(frac) { return frac < 0.5 ? frac * 2 : 2 - frac * 2; }
  function driveTick(now) {
    if (!driveStart) driveStart = now;
    if (isDemo) {
      var DRIVE_PERIOD_MS = 2000; // 렌더 캐처 창(설정 초=2.0)과 같은 주기 — 시연 전용
      var frac = ((now - driveStart) % DRIVE_PERIOD_MS) / DRIVE_PERIOD_MS;
      var max = scrollEl.scrollHeight - scrollEl.clientHeight;
      programmatic = true;
      scrollEl.scrollTop = triangle(frac) * max;
      recompute();
    }
    requestAnimationFrame(driveTick);
  }

  window.addEventListener('resize', recompute);

  if (reduce) {
    root.classList.add('is-still');
    recompute();
    scrollEl.addEventListener('scroll', onScroll);
    scrollEl.addEventListener('keydown', onScrollKeydown);
    mini.addEventListener('click', onMiniClick);
  } else {
    scrollEl.addEventListener('scroll', onScroll);
    scrollEl.addEventListener('keydown', onScrollKeydown);
    mini.addEventListener('click', onMiniClick);
    recompute();
    requestAnimationFrame(driveTick);
  }
})();
</script>
</body>
</html>
