<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circular Spectrum Ring That Grows From a Radius Value — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-play" viewBox="0 0 256 256"><g fill="currentColor"><path d="M228.23 134.69L84.15 222.81A8 8 0 0 1 72 216.12V39.88a8 8 0 0 1 12.15-6.69l144.08 88.12a7.82 7.82 0 0 1 0 13.38" opacity=".2"/><path d="M232.4 114.49L88.32 26.35a16 16 0 0 0-16.2-.3A15.86 15.86 0 0 0 64 39.87v176.26A15.94 15.94 0 0 0 80 232a16.07 16.07 0 0 0 8.36-2.35l144.04-88.14a15.81 15.81 0 0 0 0-27ZM80 215.94V40l143.83 88Z"/></g></symbol>
    <symbol id="ico-pause" viewBox="0 0 256 256"><g fill="currentColor"><path d="M208 48v160a8 8 0 0 1-8 8h-40a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8h40a8 8 0 0 1 8 8M96 40H56a8 8 0 0 0-8 8v160a8 8 0 0 0 8 8h40a8 8 0 0 0 8-8V48a8 8 0 0 0-8-8" opacity=".2"/><path d="M200 32h-40a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176h-40V48h40ZM96 32H56a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176H56V48h40Z"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="viz is-demo is-playing" id="viz">
  <p class="viz__hint"><span>Press play and the radius value is computed to spread a spectrum ring around the album art.</span></p>
  <div class="viz__panel">
    <div class="viz__ring-wrap">
      <canvas class="viz__ring" id="ring" width="140" height="140" aria-hidden="true"></canvas>
      <div class="viz__art"></div>
      <span class="viz__colorref" aria-hidden="true"></span>
    </div>
    <button class="viz__play" id="play" type="button" aria-label="Play">
      <svg class="viz__ico viz__ico--play" aria-hidden="true"><use href="#ico-play"></use></svg>
      <svg class="viz__ico viz__ico--pause" aria-hidden="true"><use href="#ico-pause"></use></svg>
    </button>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('viz');
  var playBtn = document.getElementById('play');
  var canvas = document.getElementById('ring');
  var ctx = canvas.getContext('2d');
  var colorRef = document.querySelector('.viz__colorref');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isDemo = true;

  // 결정론 난수 — Math.random 을 쓰지 않는다. LCG(선형합동생성기) 하나로 점마다 다른 위상·주파수를 만든다.
  function makeLcg(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  var POINT_COUNT = 40;
  var INNER_R = 36; // 앨범 아트 바깥 반지름 — 링이 시작되는 지점
  var RANGE_R = 36; // 반지름 값이 늘어날 수 있는 최대 폭 — 변형: 진폭 배율, 값만 키움(20 → 출렁임이 보이도록)
  var rng = makeLcg(4813);
  var points = [];
  for (var i = 0; i < POINT_COUNT; i++) {
    points.push({
      // 사인 곡선 두 겹을 겹쳐 점마다 다른 위상·주파수로 반지름 값을 합성한다 — 실제 소리를 분석해 얻는 값이 아니라
      // 291 편의 AudioContext/AnalyserNode 분석과 달리 여기서는 사인 합성만으로 만든 장식용 값이다.
      f1: 0.5 + rng() * 0.4,
      p1: rng() * Math.PI * 2,
      f2: 1.3 + rng() * 0.7,
      p2: rng() * Math.PI * 2,
      w2: 0.2 + rng() * 0.25,
      idle: 0.08 + rng() * 0.06
    });
  }

  function synth(pt, tSec) {
    var s1 = Math.sin(tSec * pt.f1 * Math.PI * 2 + pt.p1);
    var s2 = Math.sin(tSec * pt.f2 * Math.PI * 2 + pt.p2) * pt.w2;
    var v = (s1 + s2) / (1 + pt.w2); // -1..1
    return 0.5 + v * 0.5; // 0..1
  }

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  var playing = true, t0 = 0;
  var ringColor = '#3a3a3a';

  function draw(now, playingNow) {
    var w = canvas.width, h = canvas.height;
    var cx = w / 2, cy = h / 2;
    var tSec = (now - t0) / 1000;
    ctx.clearRect(0, 0, w, h);

    // 점마다 반지름 값을 먼저 계산해 아래 면·틱이 같은 값을 공유한다
    var vals = [];
    for (var i = 0; i < POINT_COUNT; i++) {
      vals.push(playingNow ? synth(points[i], tSec) : points[i].idle);
    }

    // 출렁이는 반지름을 면으로 이어 진폭이 화면 면적으로 보이게 한다
    ctx.beginPath();
    for (var j = 0; j <= POINT_COUNT; j++) {
      var k = j % POINT_COUNT;
      var rj = INNER_R + RANGE_R * Math.max(0.04, vals[k]);
      var aj = (k / POINT_COUNT) * Math.PI * 2 - Math.PI / 2;
      var px = cx + Math.cos(aj) * rj, py = cy + Math.sin(aj) * rj;
      if (j === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
    }
    ctx.closePath();
    ctx.fillStyle = ringColor;
    ctx.globalAlpha = 0.42;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.globalAlpha = 1;
    ctx.strokeStyle = ringColor;
    ctx.stroke();

    ctx.lineCap = 'round';
    ctx.strokeStyle = ringColor;
    for (var i2 = 0; i2 < POINT_COUNT; i2++) {
      var v = vals[i2];
      var r1 = INNER_R;
      var r2 = INNER_R + RANGE_R * Math.max(0.04, v);
      var angle = (i2 / POINT_COUNT) * Math.PI * 2 - Math.PI / 2;
      var cos = Math.cos(angle), sin = Math.sin(angle);
      ctx.globalAlpha = 0.35 + v * 0.65;
      ctx.lineWidth = 4.2;
      ctx.beginPath();
      ctx.moveTo(cx + cos * r1, cy + sin * r1);
      ctx.lineTo(cx + cos * r2, cy + sin * r2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function setPlaying(next) {
    playing = next;
    root.classList.toggle('is-playing', next);
  }

  function onPlayClick() { human(); setPlaying(!playing); }
  function onPlayKeydown(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); setPlaying(!playing); }
  }

  function frame(now) {
    if (!t0) t0 = now;
    draw(now, isDemo ? true : playing);
    requestAnimationFrame(frame);
  }

  ringColor = getComputedStyle(colorRef).color || ringColor;

  if (reduce) {
    root.classList.add('is-still');
    t0 = performance.now();
    draw(t0, false);
    playBtn.addEventListener('click', function () {
      human(); setPlaying(!playing);
      draw(performance.now(), playing);
    });
    playBtn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault(); human(); setPlaying(!playing);
        draw(performance.now(), playing);
      }
    });
  } else {
    playBtn.addEventListener('click', onPlayClick);
    playBtn.addEventListener('keydown', onPlayKeydown);
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
