<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Hero Scene Where a Blurred Backdrop and Ring Interlock — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-play" viewBox="0 0 256 256"><g fill="currentColor"><path d="M228.23 134.69L84.15 222.81A8 8 0 0 1 72 216.12V39.88a8 8 0 0 1 12.15-6.69l144.08 88.12a7.82 7.82 0 0 1 0 13.38" opacity=".2"/><path d="M232.4 114.49L88.32 26.35a16 16 0 0 0-16.2-.3A15.86 15.86 0 0 0 64 39.87v176.26A15.94 15.94 0 0 0 80 232a16.07 16.07 0 0 0 8.36-2.35l144.04-88.14a15.81 15.81 0 0 0 0-27ZM80 215.94V40l143.83 88Z"/></g></symbol>
    <symbol id="ico-pause" viewBox="0 0 256 256"><g fill="currentColor"><path d="M208 48v160a8 8 0 0 1-8 8h-40a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8h40a8 8 0 0 1 8 8M96 40H56a8 8 0 0 0-8 8v160a8 8 0 0 0 8 8h40a8 8 0 0 0 8-8V48a8 8 0 0 0-8-8" opacity=".2"/><path d="M200 32h-40a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176h-40V48h40ZM96 32H56a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176H56V48h40Z"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="hero is-demo is-playing" id="hero">
  <p class="hero__hint"><span>Press play and the bass/mid/treble values simultaneously drive the backdrop blur, ring, and bars.</span></p>
  <div class="hero__panel" id="panel">
    <div class="hero__backdrop" aria-hidden="true">
      <div class="hero__blob hero__blob--a" id="blobA"></div>
      <div class="hero__blob hero__blob--b" id="blobB"></div>
      <div class="hero__blob hero__blob--c" id="blobC"></div>
    </div>
    <button class="hero__play" id="play" type="button" aria-label="Play">
      <svg class="hero__ico hero__ico--play" aria-hidden="true"><use href="#ico-play"></use></svg>
      <svg class="hero__ico hero__ico--pause" aria-hidden="true"><use href="#ico-pause"></use></svg>
    </button>
    <div class="hero__core">
      <div class="hero__ring-wrap">
        <canvas class="hero__ring" id="ring" width="128" height="128" aria-hidden="true"></canvas>
        <div class="hero__art" id="art"></div>
        <span class="hero__colorref" aria-hidden="true"></span>
      </div>
    </div>
    <div class="hero__bars" id="bars" aria-hidden="true"></div>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('hero');
  var playBtn = document.getElementById('play');
  var canvas = document.getElementById('ring');
  var ctx = canvas.getContext('2d');
  var art = document.getElementById('art');
  var colorRef = document.querySelector('.hero__colorref');
  var blobA = document.getElementById('blobA');
  var blobB = document.getElementById('blobB');
  var blobC = document.getElementById('blobC');
  var barsEl = document.getElementById('bars');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isDemo = true;

  // 결정론 난수 — Math.random 을 쓰지 않는다. LCG(선형합동생성기) 하나로 대역·막대·링 점의 위상을 만든다.
  function makeLcg(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var rng = makeLcg(5527);

  // 배경 블러·링·막대가 같은 저·중·Treble 대역 값에 맞물리도록, 대역마다 사인 두 겹을 겹쳐 값을 하나씩만 계산한다.
  var bandDefs = {
    bass:   { f1: 0.28 + rng() * 0.08, p1: rng() * Math.PI * 2, f2: 0.7 + rng() * 0.2, p2: rng() * Math.PI * 2, w2: 0.3 },
    mid:    { f1: 0.75 + rng() * 0.15, p1: rng() * Math.PI * 2, f2: 1.6 + rng() * 0.3, p2: rng() * Math.PI * 2, w2: 0.32 },
    treble: { f1: 1.6 + rng() * 0.3, p1: rng() * Math.PI * 2, f2: 2.6 + rng() * 0.4, p2: rng() * Math.PI * 2, w2: 0.34 }
  };
  function bandValue(def, tSec) {
    var s1 = Math.sin(tSec * def.f1 * Math.PI * 2 + def.p1);
    var s2 = Math.sin(tSec * def.f2 * Math.PI * 2 + def.p2) * def.w2;
    var v = (s1 + s2) / (1 + def.w2); // -1..1
    return 0.5 + v * 0.5; // 0..1
  }

  var RING_POINTS = 32;
  var ringPts = [];
  for (var i = 0; i < RING_POINTS; i++) {
    ringPts.push({ f: 2 + rng() * 1.4, p: rng() * Math.PI * 2, w: 0.35 + rng() * 0.3 });
  }

  var BAR_COUNT = 14;
  var bars = [];
  for (var i = 0; i < BAR_COUNT; i++) {
    var el = document.createElement('div');
    el.className = 'hero__bar';
    barsEl.appendChild(el);
    bars.push({ el: el, f: 3 + rng() * 1.6, p: rng() * Math.PI * 2, base: 0.18 + rng() * 0.1 });
  }

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  var playing = true, t0 = 0;
  var ringColor = '#3a3a3a';

  function drawRing(tSec, treb) {
    var w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2;
    var innerR = 34, rangeR = 16;
    ctx.clearRect(0, 0, w, h);
    ctx.lineCap = 'round';
    ctx.strokeStyle = ringColor;
    for (var i = 0; i < RING_POINTS; i++) {
      var pt = ringPts[i];
      var s = Math.sin(tSec * pt.f + pt.p) * 0.5 + 0.5;
      var v = 0.15 + s * pt.w * (0.4 + treb * 0.9);
      var angle = (i / RING_POINTS) * Math.PI * 2 - Math.PI / 2;
      var cos = Math.cos(angle), sin = Math.sin(angle);
      var r2 = innerR + rangeR * Math.max(0.05, v);
      ctx.globalAlpha = 0.3 + v * 0.6;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx + cos * innerR, cy + sin * innerR);
      ctx.lineTo(cx + cos * r2, cy + sin * r2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function render(now, playingNow) {
    var tSec = (now - t0) / 1000;
    var bass = playingNow ? bandValue(bandDefs.bass, tSec) : 0.2;
    var mid = playingNow ? bandValue(bandDefs.mid, tSec) : 0.2;
    var treb = playingNow ? bandValue(bandDefs.treble, tSec) : 0.2;

    // 배경 블러 세 덩이는 서로 다른 대역 값을 따라 각자 다른 방향으로 흐른다 — transform/opacity 만 사용
    blobA.style.transform = 'translate(' + (Math.cos(tSec * 0.6) * 18 * (0.4 + bass)).toFixed(1) + 'px,' + (Math.sin(tSec * 0.5) * 14 * (0.4 + bass)).toFixed(1) + 'px)';
    blobA.style.opacity = String(0.35 + bass * 0.35);
    blobB.style.transform = 'translate(' + (Math.cos(tSec * 0.4 + 2) * 16 * (0.4 + mid)).toFixed(1) + 'px,' + (Math.sin(tSec * 0.7 + 1) * 18 * (0.4 + mid)).toFixed(1) + 'px)';
    blobB.style.opacity = String(0.3 + mid * 0.35);
    blobC.style.transform = 'translate(' + (Math.cos(tSec * 0.9 + 4) * 14 * (0.4 + treb)).toFixed(1) + 'px,' + (Math.sin(tSec * 0.8 + 3) * 12 * (0.4 + treb)).toFixed(1) + 'px)';
    blobC.style.opacity = String(0.28 + treb * 0.32);

    // 앨범 아트는 Bass 값에 맞춰 살짝 커졌다 줄어든다 — 킥 펄스
    art.style.transform = 'scale(' + (1 + bass * 0.08).toFixed(3) + ')';

    drawRing(tSec, treb);

    for (var i = 0; i < bars.length; i++) {
      var bar = bars[i];
      var s = Math.sin(tSec * bar.f + bar.p) * 0.5 + 0.5;
      var h = playingNow ? Math.max(0.08, bar.base + s * treb * 0.9) : bar.base;
      bar.el.style.transform = 'scaleY(' + h.toFixed(3) + ')';
    }
  }

  function setPlaying(next) { playing = next; root.classList.toggle('is-playing', next); }
  function onPlayClick() { human(); setPlaying(!playing); }
  function onPlayKeydown(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); setPlaying(!playing); }
  }

  function frame(now) {
    if (!t0) t0 = now;
    render(now, isDemo ? true : playing);
    requestAnimationFrame(frame);
  }

  ringColor = getComputedStyle(colorRef).color || ringColor;

  if (reduce) {
    root.classList.add('is-still');
    t0 = performance.now();
    render(t0, false);
    playBtn.addEventListener('click', function () { human(); setPlaying(!playing); render(performance.now(), playing); });
    playBtn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); setPlaying(!playing); render(performance.now(), playing); }
    });
  } else {
    playBtn.addEventListener('click', onPlayClick);
    playBtn.addEventListener('keydown', onPlayKeydown);
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
