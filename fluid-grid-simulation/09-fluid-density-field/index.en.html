<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유체 밀도장 확대 비교 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage stage--orange">
<div class="df" id="df">
  <p class="df__hint">
    <svg class="df__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M200,32H56A24,24,0,0,0,32,56V200a24,24,0,0,0,24,24H200a24,24,0,0,0,24-24V56A24,24,0,0,0,200,32Zm8,168a8,8,0,0,1-8,8H56a8,8,0,0,1-8-8V56a8,8,0,0,1,8-8H200a8,8,0,0,1,8,8Z" opacity=".2"/><path d="M224,48V208a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V48A16,16,0,0,1,48,32H208A16,16,0,0,1,224,48Z" opacity="0"/><path d="M200,40H56A16,16,0,0,0,40,56V200a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V56A16,16,0,0,0,200,40ZM96,200H56V168H96Zm0-56H56V112H96Zm0-56H56V56H96Zm104,112H112V168h88Zm0-56H112V112h88Zm0-56H112V56h88Z"/></g></svg>
    <span>The same 32×32 density array is drawn twice — the left keeps raw cells, the right smooths them with interpolation</span>
  </p>
  <div class="df__duo" id="duo" role="application" aria-label="Density field zoom comparison board" tabindex="0">
    <div class="df__pane">
      <canvas class="df__cv" id="cvA"></canvas>
      <b class="df__tag">nearest</b>
    </div>
    <div class="df__pane">
      <canvas class="df__cv" id="cvB"></canvas>
      <b class="df__tag">interpolated</b>
    </div>
    <b class="df__badge" aria-hidden="true">32<span class="df__badgeUnit">×32</span></b>
  </div>
</div>
</main>
<script>
// 유체 밀도장 확대 비교 — 시뮬레이션 데이터는 32×32 한 장뿐이다(그게 이 항목의 핵심 소재).
// 같은 배열을 두 캔버스에 그리되 왼쪽은 imageSmoothingEnabled=false(nearest 이웃, 칸이 그대로 보임),
// 오른쪽은 true + quality high(쌍선형 interpolated, 부드럽게 펴짐)로 확대한다. 렌더 경로만 다르다.
var root = document.getElementById('df');
var duo = document.getElementById('duo');
var cvA = document.getElementById('cvA');
var cvB = document.getElementById('cvB');
var ctxA = cvA.getContext('2d', { willReadFrequently: true });
var ctxB = cvB.getContext('2d', { willReadFrequently: true });

var css = getComputedStyle(root);
var W1 = css.getPropertyValue('--den-1').trim();
var W2 = css.getPropertyValue('--den-2').trim();
var W3 = css.getPropertyValue('--den-3').trim();
var PAPER = css.getPropertyValue('--den-paper').trim();
function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
var CR = hex(PAPER), C1 = hex(W1), C2 = hex(W2), C3 = hex(W3);

// N=32 고정 — 이 값 자체가 보여주고 싶은 내용이다
var N = 32;
var SIZE = (N + 2) * (N + 2);
var IX = function (x, y) { return x + (N + 2) * y; };
var u = new Float32Array(SIZE), v = new Float32Array(SIZE);
var u0 = new Float32Array(SIZE), v0 = new Float32Array(SIZE);
var d = new Float32Array(SIZE), d0 = new Float32Array(SIZE);

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var raf = 0, seedT = 0;

// 오프스크린 32×32 원본 — 이 한 장을 양쪽이 같이 쓴다
var src = document.createElement('canvas');
src.width = N; src.height = N;
var sctx = src.getContext('2d');
var simg = sctx.createImageData(N, N);

function fit() {
  var rect = duo.getBoundingClientRect();
  var w = Math.round(rect.width), h = Math.round(rect.height);
  cvA.width = w; cvA.height = h;
  cvB.width = w; cvB.height = h;
}

function advect(b, dt) {
  var s = b === 0 ? u0 : b === 1 ? v0 : d0;
  var dst = b === 0 ? u : b === 1 ? v : d;
  for (var j = 1; j <= N; j++) {
    for (var i = 1; i <= N; i++) {
      var x = i - dt * N * u0[IX(i, j)];
      var y = j - dt * N * v0[IX(i, j)];
      if (x < 0.5) x = 0.5; else if (x > N + 0.5) x = N + 0.5;
      var i0 = x | 0, i1 = i0 + 1;
      if (y < 0.5) y = 0.5; else if (y > N + 0.5) y = N + 0.5;
      var j0 = y | 0, j1 = j0 + 1;
      var s1 = x - i0, s0 = 1 - s1, t1 = y - j0, t0 = 1 - t1;
      dst[IX(i, j)] = s0 * (t0 * s[IX(i0, j0)] + t1 * s[IX(i0, j1)]) +
                      s1 * (t0 * s[IX(i1, j0)] + t1 * s[IX(i1, j1)]);
    }
  }
}

function bounds() {
  for (var i = 1; i <= N; i++) {
    d[IX(i, 0)] = d[IX(i, 1)] * 0.5; d[IX(i, N + 1)] = d[IX(i, N)] * 0.5;
    u[IX(i, 0)] = u[IX(i, 1)] * 0.5; u[IX(i, N + 1)] = u[IX(i, N)] * 0.5;
    v[IX(i, 0)] = v[IX(i, 1)] * 0.5; v[IX(i, N + 1)] = v[IX(i, N)] * 0.5;
  }
  for (var j = 1; j <= N; j++) {
    d[IX(0, j)] = d[IX(1, j)] * 0.5; d[IX(N + 1, j)] = d[IX(N, j)] * 0.5;
    u[IX(0, j)] = u[IX(1, j)] * 0.5; u[IX(N + 1, j)] = u[IX(N, j)] * 0.5;
    v[IX(0, j)] = v[IX(1, j)] * 0.5; v[IX(N + 1, j)] = v[IX(N, j)] * 0.5;
  }
}

// 결정적 시드 — 두 시드가 대각선으로 지나가며 밀도를 심는다. seedT 고정이라 매번 같은 흐름
function inject(t) {
  var ax = N * 0.34 + Math.sin(t * 0.8) * N * 0.16;
  var ay = N * 0.3 + t * N * 0.055;
  var bx = N * 0.66 + Math.sin(t * 1.1 + 2.0) * N * 0.14;
  var by = N * 0.75 - Math.sin(t * 0.7) * N * 0.1;
  splatDye(Math.round(ax), Math.round(ay), 1);
  splatDye(Math.round(bx), Math.round(by), 0.85);
}
function splatDye(cx, cy, amp) {
  var rad = 2.4;
  for (var j = -3; j <= 3; j++) {
    for (var i = -3; i <= 3; i++) {
      var q = (i * i + j * j) / (rad * rad);
      if (q > 1) continue;
      var gi = cx + i, gj = cy + j;
      if (gi < 1 || gi > N || gj < 1 || gj > N) continue;
      d[IX(gi, gj)] += Math.exp(-q * 2.2) * amp;
    }
  }
}

// 느린 확산 바람 — 밀도가 칸 사이를 스며들게 해 두 렌더의 차이를 계속 보여준다
function drift() {
  var cx = N * 0.5, cy = N * 0.5;
  for (var j = 2; j <= N - 1; j++) {
    for (var i = 2; i <= N - 1; i++) {
      var dx = i - cx, dy = j - cy;
      var q = Math.sqrt(dx * dx + dy * dy) / (N * 0.5);
      var w = Math.exp(-q * q * 1.6) * 0.4;
      u[IX(i, j)] += (-dy * 0.045 + 0.07) * w;
      v[IX(i, j)] += (dx * 0.045) * w;
    }
  }
}

function step(dt) {
  drift();
  inject(seedT);
  u0.set(u); v0.set(v); d0.set(d);
  advect(0, dt); u0.set(u);
  advect(1, dt); v0.set(v);
  advect(2, dt);
  bounds();
  for (var k = 0; k < SIZE; k++) { d[k] *= 0.988; u[k] *= 0.99; v[k] *= 0.99; }
  seedT += dt;
}

// 오프스크린 32×32 한 장을 그린다 — 여기까지가 데이터. 확대는 아래 두 호출이 다르게 한다
function paintSource() {
  var px = simg.data;
  for (var j = 0; j < N; j++) {
    for (var i = 0; i < N; i++) {
      var q = d[IX(i + 1, j + 1)];
      var band, a;
      if (q <= 0.02) { band = CR; a = 0; }
      else if (q > 1.15) { band = C3; a = Math.min(1, q - 0.15); }
      else if (q > 0.5) { band = C2; a = Math.min(1, q + 0.1); }
      else { band = C1; a = Math.min(1, q * 1.6); }
      var o = (j * N + i) * 4;
      px[o]     = CR[0] + (band[0] - CR[0]) * a;
      px[o + 1] = CR[1] + (band[1] - CR[1]) * a;
      px[o + 2] = CR[2] + (band[2] - CR[2]) * a;
      px[o + 3] = 255;
    }
  }
  sctx.putImageData(simg, 0, 0);
}

function render() {
  paintSource();
  var w = cvA.width, h = cvA.height;
  // 왼쪽 — nearest 이웃: 칸이 네모 그대로 커진다
  ctxA.imageSmoothingEnabled = false;
  ctxA.clearRect(0, 0, w, h);
  ctxA.drawImage(src, 0, 0, w, h);
  // 오른쪽 — 쌍선형 interpolated: 같은 소스를 부드럽게 펴낸다
  ctxB.imageSmoothingEnabled = true;
  ctxB.imageSmoothingQuality = 'high';
  ctxB.clearRect(0, 0, w, h);
  ctxB.drawImage(src, 0, 0, w, h);
}

function frame() {
  step(1 / 30);
  render();
  raf = requestAnimationFrame(frame);
}

// 사람 손 — 간단한 스플랏. 두 판이 같은 배열을 쓰므로 한 번의 스플랏이 양쪽에 동시에 나타난다
function splat(gx, gy, fx, fy, amt) {
  var rad = 3;
  for (var j = -rad; j <= rad; j++) {
    for (var i = -rad; i <= rad; i++) {
      var q = (i * i + j * j) / (rad * rad);
      if (q > 1) continue;
      var gi = gx + i, gj = gy + j;
      if (gi < 1 || gi > N || gj < 1 || gj > N) continue;
      var f = Math.exp(-q * 2.6) * amt;
      var idx = IX(gi, gj);
      u[idx] += fx * f; v[idx] += fy * f;
      d[idx] = Math.min(2, d[idx] + f * 0.8);
    }
  }
}
var last = null;
var target = null;
duo.addEventListener('pointerdown', function (e) {
  var rect = duo.getBoundingClientRect();
  var half = rect.width / 2;
  target = (e.clientX - rect.left) < half ? cvA : cvB;
  target.dispatchEvent(new PointerEvent('pointermove', { clientX: e.clientX, clientY: e.clientY }));
});
duo.addEventListener('pointermove', function (e) {
  if (!target && e.pointerType === 'mouse' && e.buttons === 0) {
    // 마우스는 누르지 않아도 흐르는 배경 시드가 있으니 스플랏은 억제한다(08 과 체감을 구분)
  }
  var host = target || duo;
  var rect = host.getBoundingClientRect();
  var gx = 1 + Math.round((e.clientX - rect.left) / rect.width * (N - 1));
  var gy = 1 + Math.round((e.clientY - rect.top) / rect.height * (N - 1));
  if (last) {
    var fx = (e.clientX - last.x) * 0.15, fy = (e.clientY - last.y) * 0.15;
    splat(gx, gy, fx, fy, Math.min(1.8, Math.hypot(fx, fy)));
  } else {
    splat(gx, gy, 0, 0, 0.8);
  }
  last = { x: e.clientX, y: e.clientY };
  if (reduce) render();
});
function endPtr() { last = null; target = null; }
duo.addEventListener('pointerup', endPtr);
duo.addEventListener('pointerleave', endPtr);
duo.addEventListener('keydown', function (e) {
  var dir = { ArrowLeft: [-2, 0], ArrowRight: [2, 0], ArrowUp: [0, -2], ArrowDown: [0, 2] }[e.key];
  if (!dir) return;
  e.preventDefault();
  splat(N >> 1, N >> 1, dir[0], dir[1], 1.4);
  if (reduce) render();
});
window.addEventListener('resize', function () { fit(); if (reduce) render(); });

fit();
if (reduce) {
  // reduce — 40 걸음 미리 감아 두 판의 차이가 분명한 한 장을 그린다
  for (var k = 0; k < 40; k++) step(1 / 30);
  render();
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
