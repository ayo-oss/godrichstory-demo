<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안정 유체 이류 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage stage--ink">
<div class="fa" id="fa">
  <p class="fa__hint">
    <svg class="fa__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M237.94 107.19l-89.13-89.13a20 20 0 0 0-28.28 0l-89.13 89.13a20 20 0 0 0 0 28.28l89.13 89.13a20 20 0 0 0 28.28 0l89.13-89.13a20 20 0 0 0 0-28.28ZM167 143.46a8 8 0 0 1-11.4 0L128 115.86l-27.6 27.6a8 8 0 1 1-11.4-11.32l33.2-33.46a8 8 0 0 1 11.4 0l33.2 33.46a8 8 0 0 1 .2 11.32Z" opacity=".2"/><path d="M243.54 101.75L154.4 12.61a28 28 0 0 0-39.66 0L25.6 101.75a28 28 0 0 0 0 39.66l89.14 89.14a28 28 0 0 0 39.66 0l89.14-89.14a28 28 0 0 0 0-39.66Zm-11.4 28.26l-89.13 89.14a12 12 0 0 1-17 0L36.9 130a12 12 0 0 1 0-17L126 23.87a12 12 0 0 1 17 0l89.14 89.14a12 12 0 0 1 0 16.98Zm-64.76-83.75a8 8 0 0 0-11.71 0l-33.65 33.87a4 4 0 0 1-5.71 0L82.49 100.1a8 8 0 1 0-11.4 11.24l33.51 33.9a20 20 0 0 0 28.49 0l33.51-33.9a8 8 0 0 0 .18-12.02Z"/></g></svg>
    <span>Each cell traces the flow backward to pull its previous value — hover to bend the current</span>
  </p>
  <div class="fa__field" id="field" role="application" aria-label="Fluid advection board" tabindex="0">
    <canvas class="fa__cv" id="cv"></canvas>
    <b class="fa__badge" aria-hidden="true">32<span class="fa__badgeUnit">grid</span></b>
  </div>
</div>
</main>
<script>
// 안정 유체 이류(semi-Lagrangian) — 다음 프레임을 내다보지 않고, 지금 칸의 값이
// 한 걸음 전 어디에서 왔는지 속도를 거슬러 샘플링한다. 시간 간격이 커져도 폭발하지 않는다.
// 속도장이 자기 자신을 옮기는 자기 이류와 염료 밀도를 옮기는 물질 이류를 한 프레임에 겹쳐 돌린다.
var root = document.getElementById('fa');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d', { willReadFrequently: true });

var css = getComputedStyle(root);
var PAL0 = css.getPropertyValue('--dye-0').trim();
var PAL1 = css.getPropertyValue('--dye-1').trim();
var PAL2 = css.getPropertyValue('--dye-2').trim();

// N — grid 한 변 칸 수. 480px 무대에 32칸이면 한 칸 15px, 60fps 안에 계산이 들어온다
var N = 32;
var SIZE = (N + 2) * (N + 2);
var IX = function (x, y) { return x + (N + 2) * y; };
var u = new Float32Array(SIZE), v = new Float32Array(SIZE);
var u0 = new Float32Array(SIZE), v0 = new Float32Array(SIZE);
var d = new Float32Array(SIZE), d0 = new Float32Array(SIZE);

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, raf = 0, seedT = 0;
var stirring = false;

// 화면 픽셀 → grid 좌표 (0..1) 로 바꾸는 비율
function fit() {
  var r = field.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = Math.round(W); cv.height = Math.round(H);
}

// 후방 이류 — 칸 (x,y) 의 새 값을, 속도를 dt 만큼 거슬러 간 좌표의 옛 값으로 채운다.
// 좌표는 칸 배열 범위로 가두고(경계 밖 샘플링 방지) 네 이웃의 면적 가중평균(bilinear)로 읽는다.
// 셀 하나가 차지하는 공간은 1/N 이다 — 속도(칸/초) × dt(초) × N 이 되짚는 칸 수가 된다.
function advect(b, dt) {
  var src = b === 'u' ? u0 : (b === 'v' ? v0 : d0);
  var dst = b === 'u' ? u : (b === 'v' ? v : d);
  for (var j = 1; j <= N; j++) {
    for (var i = 1; i <= N; i++) {
      var x = i - dt * N * u0[IX(i, j)];
      var y = j - dt * N * v0[IX(i, j)];
      if (x < 0.5) x = 0.5; else if (x > N + 0.5) x = N + 0.5;
      var i0 = x | 0; var i1 = i0 + 1;
      if (y < 0.5) y = 0.5; else if (y > N + 0.5) y = N + 0.5;
      var j0 = y | 0; var j1 = j0 + 1;
      var s1 = x - i0, s0 = 1 - s1, t1 = y - j0, t0 = 1 - t1;
      dst[IX(i, j)] = s0 * (t0 * src[IX(i0, j0)] + t1 * src[IX(i0, j1)]) +
                      s1 * (t0 * src[IX(i1, j0)] + t1 * src[IX(i1, j1)]);
    }
  }
}

// 경계 — 벽 반사 근사. 유출 속도를 0 으로 두고 밀도는 감쇠시킨다
function bounds() {
  var n2 = N + 2;
  for (var i = 1; i <= N; i++) {
    d[IX(i, 0)] = d[IX(i, 1)] * 0.5; d[IX(i, N + 1)] = d[IX(i, N)] * 0.5;
    u[IX(i, 0)] = u[IX(i, 1)] * 0.5; u[IX(i, N + 1)] = u[IX(i, N)] * 0.5;
    v[IX(i, 0)] = v[IX(i, 1)] * 0.5; v[IX(i, N + 1)] = v[IX(i, N)] * 0.5;
  }
  for (var j = 1; j <= N; j++) {
    d[IX(0, j)] = d[IX(1, j)] * 0.5; d[IX(N + 1, j)] = d[IX(N, j)] * 0.5;
    u[IX(0, j)] = u[IX(1, j)] * 0.5; u[IX(N + 1, j)] = u[IX(N, j)] * 0.5;
    v[IX(0, j)] = v[IX(1, j)] * 0.5; v[IX(N + 1, j)] = v[IX(N, j)] * 0.5;
  }
}

// 미리보기 주입원 — 시드 고정. 잎새 모양 두 바퀴를 그리는 속도 소스와 궤적을 따라 얹히는 염료.
// seedT 로 결정적: 같은 편의 gif·poster 는 언제나 같은 흐름이 담긴다.
function inject(t) {
  var cx = N * 0.5 + Math.sin(t * 0.9) * N * 0.22;
  var cy = N * 0.55 + Math.sin(t * 1.7) * N * 0.16;
  var dx = Math.cos(t * 0.9) * 0.9 * N * 0.22, dy = Math.cos(t * 1.7) * 1.7 * N * 0.16 * 0.35;
  var amp = 42;
  var r = 2.6;
  for (var j = -r; j <= r; j++) {
    for (var i = -r; i <= r; i++) {
      var q = (i * i + j * j) / (r * r);
      if (q > 1) continue;
      var f = Math.exp(-q * 3.2) * amp;
      var idx = IX(Math.round(cx + i), Math.round(cy + j));
      u0[idx] += dx * f * 0.06;
      v0[idx] += dy * f * 0.06;
      var hue = (t * 0.22) % 1;
      var amt = Math.exp(-q * 2.2) * 0.9;
      d0[idx] += amt * (hue < 0.5 ? 1 : 0.55);
    }
  }
}

function step(dt) {
  u0.set(u); v0.set(v); d0.set(d);
  inject(seedT);
  advect('u', dt); u0.set(u);
  advect('v', dt); v0.set(v);
  advect('d', dt);
  bounds();
  for (var k = 0; k < SIZE; k++) d[k] *= 0.995;   // 밀도는 천천히 죽는다 — 화면이 꽉 찬 채 굳지 않게
  seedT += dt;
}

function render() {
  var img = ctx.createImageData(cv.width, cv.height);
  var px = img.data;
  var cellW = cv.width / N, cellH = cv.height / N;
  var pal = [PAL0, PAL1, PAL2];
  for (var py = 0; py < cv.height; py++) {
    var gy = Math.min(N - 1, (py / cellH) | 0);
    for (var pxx = 0; pxx < cv.width; pxx++) {
      var gx = Math.min(N - 1, (pxx / cellW) | 0);
      var q = d[IX(gx + 1, gy + 1)];
      var o = (py * cv.width + pxx) * 4;
      if (q <= 0) { px[o] = 23; px[o + 1] = 20; px[o + 2] = 26; px[o + 3] = 255; continue; }
      var band = q > 0.62 ? 2 : (q > 0.3 ? 1 : 0);
      var c = pal[band];
      var rr = parseInt(c.slice(1, 3), 16), gg = parseInt(c.slice(3, 5), 16), bb = parseInt(c.slice(5, 7), 16);
      var a = Math.min(1, q);
      px[o] = 23 + (rr - 23) * a; px[o + 1] = 20 + (gg - 20) * a; px[o + 2] = 26 + (bb - 26) * a; px[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

function frame() {
  step(1 / 30);
  render();
  raf = requestAnimationFrame(frame);
}

// 사람이 휘젓기 — 포인터 이동량을 그 칸 주변에 지수 반경으로 얹는다
function splat(gx, gy, fx, fy, amt) {
  var r = 3;
  for (var j = -r; j <= r; j++) {
    for (var i = -r; i <= r; i++) {
      var q = (i * i + j * j) / (r * r);
      if (q > 1) continue;
      var f = Math.exp(-q * 3) * amt;
      var idx = IX(gx + i, gy + j);
      if (gx + i < 1 || gx + i > N || gy + j < 1 || gy + j > N) continue;
      u[idx] += fx * f; v[idx] += fy * f;
      d[idx] = Math.min(2.2, d[idx] + f * 0.7);
    }
  }
}
var last = null;
field.addEventListener('pointermove', function (e) {
  var r = field.getBoundingClientRect();
  var gx = 1 + Math.round((e.clientX - r.left) / r.width * (N - 1));
  var gy = 1 + Math.round((e.clientY - r.top) / r.height * (N - 1));
  if (last) {
    var fx = (e.clientX - last.x) * 0.14, fy = (e.clientY - last.y) * 0.14;
    splat(gx, gy, fx, fy, Math.min(1.6, Math.hypot(fx, fy)));
  } else {
    splat(gx, gy, 0, 0, 0.8);
  }
  last = { x: e.clientX, y: e.clientY };
  if (reduce) render();
});
field.addEventListener('pointerleave', function () { last = null; stirring = false; });
field.addEventListener('keydown', function (e) {
  var dir = { ArrowLeft: [-2, 0], ArrowRight: [2, 0], ArrowUp: [0, -2], ArrowDown: [0, 2] }[e.key];
  if (!dir) return;
  e.preventDefault();
  var gx = N >> 1, gy = N >> 1;
  splat(gx, gy, dir[0], dir[1], 1.2);
  if (reduce) render();
});
window.addEventListener('resize', function () { fit(); if (reduce) render(); });

fit();
if (reduce) {
  // reduce — 시뮬레이션을 40 걸음만 앞으로 감아 흐름이 자리잡은 한 장을 그린다(빈 화면이 아니다)
  for (var k = 0; k < 40; k++) step(1 / 30);
  render();
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
