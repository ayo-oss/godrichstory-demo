<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유체 포인터 휘젓기 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage stage--paper">
<div class="ps" id="ps">
  <p class="ps__hint">
    <svg class="ps__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M100.69,180.7,41.34,121.35a16,16,0,0,1,0-22.63L98.72,41.34a16,16,0,0,1,22.63,0l99.31,99.32a16,16,0,0,1,0,22.62l-57.38,57.38a16,16,0,0,1-22.63,0Z" opacity=".2"/><path d="M228.69,133.66,131.32,36.28a24,24,0,0,0-33.94,0L38.34,95.31a24,24,0,0,0,0,34l97.37,97.37a24,24,0,0,0,33.94,0l59-59A24,24,0,0,0,228.69,133.66Zm-16.97,17L152.68,209.7a8,8,0,0,1-11.31,0L44,112.34a8,8,0,0,1,0-11.32L103.06,42a8,8,0,0,1,11.31,0l97.35,97.35A8,8,0,0,1,211.72,150.63Z"/></g></svg>
    <span>The cursor pushes the velocity field by however far it moves — stir faster and the swirl grows bigger</span>
  </p>
  <div class="ps__field" id="field" role="application" aria-label="Pointer stir board" tabindex="0">
    <canvas class="ps__cv" id="cv"></canvas>
    <b class="ps__badge" aria-hidden="true">stir<span class="ps__badgeUnit">splat</span></b>
  </div>
</div>
</main>
<script>
// 유체 포인터 휘젓기 — 이 편 9종의 인터랙션 중심. 실제 포인터든 결정적 미리보기든
// 프레임 간 위치 차이(델타)를 같은 splat() 한 함수로 속도장에 꽂아 넣는다.
// 01 보다 반경·세기를 키워 "휘젓는 느낌"을 화면 전체로 퍼뜨린다.
var root = document.getElementById('ps');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d', { willReadFrequently: true });

var css = getComputedStyle(root);
var TEAL = css.getPropertyValue('--dye-teal').trim();
var PLUM = css.getPropertyValue('--dye-plum').trim();
var PAPER = css.getPropertyValue('--dye-paper').trim();
function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
var CR = hex(PAPER), K1 = hex(TEAL), K2 = hex(PLUM);

var N = 40;
var SIZE = (N + 2) * (N + 2);
var IX = function (x, y) { return x + (N + 2) * y; };
var u = new Float32Array(SIZE), v = new Float32Array(SIZE);
var u0 = new Float32Array(SIZE), v0 = new Float32Array(SIZE);
var d = new Float32Array(SIZE), d0 = new Float32Array(SIZE);

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, raf = 0, seedT = 0;

function fit() {
  var rect = field.getBoundingClientRect();
  W = rect.width; H = rect.height;
  cv.width = Math.round(W); cv.height = Math.round(H);
}

function advect(b, dt) {
  var src = b === 0 ? u0 : b === 1 ? v0 : d0;
  var dst = b === 0 ? u : b === 1 ? v : d;
  for (var j = 1; j <= N; j++) {
    for (var i = 1; i <= N; i++) {
      var x = i - dt * N * u0[IX(i, j)];
      var y = j - dt * N * v0[IX(i, j)];
      if (x < 0.5) x = 0.5; else if (x > N + 0.5) x = N + 0.5;
      var i0 = x | 0, i1 = i0 + 1;
      if (y < 0.5) y = 0.5; else if (y > N + 0.5) y = N + 0.5;
      var j0 = y | 0, j1 = j0 + 1;
      var s1 = x - i0, s0 = 1 - s1, t1 = y - j0, t0 = 1 - t1;
      dst[IX(i, j)] = s0 * (t0 * src[IX(i0, j0)] + t1 * src[IX(i0, j1)]) +
                      s1 * (t0 * src[IX(i1, j0)] + t1 * src[IX(i1, j1)]);
    }
  }
}

function bounds() {
  for (var i = 1; i <= N; i++) {
    d[IX(i, 0)] = d[IX(i, 1)] * 0.5; d[IX(i, N + 1)] = d[IX(i, N)] * 0.5;
    u[IX(i, 0)] = u[IX(i, 1)] * 0.5; u[IX(i, N + 1)] = u[IX(i, N)] * 0.5;
    v[IX(i, 0)] = v[IX(i, 1)] * 0.5; v[IX(i, N + 1)] = v[IX(i, N)] * 0.5;
  }
  for (var j = 1; j <= N; j++) {
    d[IX(0, j)] = d[IX(1, j)] * 0.5; d[IX(N + 1, j)] = d[IX(N, j)] * 0.5;
    u[IX(0, j)] = u[IX(1, j)] * 0.5; u[IX(N + 1, j)] = u[IX(N, j)] * 0.5;
    v[IX(0, j)] = v[IX(1, j)] * 0.5; v[IX(N + 1, j)] = v[IX(N, j)] * 0.5;
  }
}

function step(dt) {
  u0.set(u); v0.set(v); d0.set(d);
  advect(0, dt); u0.set(u);
  advect(1, dt); v0.set(v);
  advect(2, dt);
  bounds();
  for (var k = 0; k < SIZE; k++) { u[k] *= 0.992; v[k] *= 0.992; d[k] *= 0.986; }
  seedT += dt;
}

// splat — 인터랙션의 유일한 진입점. 실제 포인터도, 아래 lissajous 미리보기도 이 함수 하나만 부른다.
// 01(반경 3, amt 계수 3)보다 반경을 두 배 이상 키우고 완만한 지수 감쇠를 써 소용돌이가 넓게 번지게 한다.
function splat(gx, gy, fx, fy, amt) {
  var rad = 7;
  for (var j = -rad; j <= rad; j++) {
    for (var i = -rad; i <= rad; i++) {
      var q = (i * i + j * j) / (rad * rad);
      if (q > 1) continue;
      var gi = gx + i, gj = gy + j;
      if (gi < 1 || gi > N || gj < 1 || gj > N) continue;
      var f = Math.exp(-q * 1.8) * amt;
      var idx = IX(gi, gj);
      u[idx] += fx * f; v[idx] += fy * f;
      d[idx] = Math.min(2.4, d[idx] + f * 0.62);
    }
  }
}

// 결정적 미리보기 — 리사주 곡선 위를 도는 가짜 포인터. 이전 위치와의 델타를 실제 포인터와
// 똑같이 계산해 splat() 에 넘긴다. seedT 로 고정되므로 gif·poster 는 항상 같은 궤적을 그린다.
var lastLX = null, lastLY = null;
function inject(t) {
  var lx = N * 0.5 + Math.sin(t * 1.3) * N * 0.36;
  var ly = N * 0.5 + Math.sin(t * 2.1 + 1.2) * N * 0.30;
  var gx = Math.round(lx), gy = Math.round(ly);
  if (lastLX !== null) {
    var fx = (lx - lastLX) * 5.2, fy = (ly - lastLY) * 5.2;
    splat(gx, gy, fx, fy, Math.min(2.6, Math.hypot(fx, fy) * 0.9 + 0.4));
  } else {
    splat(gx, gy, 0, 0, 1.1);
  }
  lastLX = lx; lastLY = ly;
}

function render() {
  var img = ctx.createImageData(cv.width, cv.height);
  var px = img.data;
  var cellW = cv.width / N, cellH = cv.height / N;
  for (var py = 0; py < cv.height; py++) {
    var gy = Math.min(N - 1, (py / cellH) | 0);
    for (var pxx = 0; pxx < cv.width; pxx++) {
      var gx = Math.min(N - 1, (pxx / cellW) | 0);
      var q = d[IX(gx + 1, gy + 1)];
      var o = (py * cv.width + pxx) * 4;
      if (q <= 0.02) { px[o] = CR[0]; px[o + 1] = CR[1]; px[o + 2] = CR[2]; px[o + 3] = 255; continue; }
      var a = Math.min(1, q);
      var band = q > 1.1 ? K2 : K1;
      px[o]     = CR[0] + (band[0] - CR[0]) * a;
      px[o + 1] = CR[1] + (band[1] - CR[1]) * a;
      px[o + 2] = CR[2] + (band[2] - CR[2]) * a;
      px[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

function frame() {
  inject(seedT);
  step(1 / 30);
  render();
  raf = requestAnimationFrame(frame);
}

var last = null;
field.addEventListener('pointermove', function (e) {
  var rect = field.getBoundingClientRect();
  var gx = 1 + Math.round((e.clientX - rect.left) / rect.width * (N - 1));
  var gy = 1 + Math.round((e.clientY - rect.top) / rect.height * (N - 1));
  if (last) {
    var fx = (e.clientX - last.x) * 0.42, fy = (e.clientY - last.y) * 0.42;
    splat(gx, gy, fx, fy, Math.min(2.6, Math.hypot(fx, fy)));
  } else {
    splat(gx, gy, 0, 0, 1.1);
  }
  last = { x: e.clientX, y: e.clientY };
  if (reduce) render();
});
field.addEventListener('pointerleave', function () { last = null; });
field.addEventListener('keydown', function (e) {
  var dir = { ArrowLeft: [-3, 0], ArrowRight: [3, 0], ArrowUp: [0, -3], ArrowDown: [0, 3] }[e.key];
  if (!dir) return;
  e.preventDefault();
  splat(N >> 1, N >> 1, dir[0], dir[1], 1.8);
  if (reduce) render();
});
window.addEventListener('resize', function () { fit(); if (reduce) render(); });

fit();
if (reduce) {
  // reduce — 리사주 미리보기를 46 걸음 앞으로 감아 소용돌이가 자리 잡은 한 장을 그린다
  for (var k = 0; k < 46; k++) { inject(seedT); step(1 / 30); }
  render();
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
