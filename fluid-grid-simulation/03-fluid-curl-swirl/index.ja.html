<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컬링 소용돌이 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage stage--ink">
<div class="fa" id="fa">
  <p class="fa__hint">
    <svg class="fa__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M240 144h-32a80 80 0 0 1-80 80a88 88 0 0 1-88-88a96 96 0 0 1 96-96a104 104 0 0 1 104 104" opacity=".2"/><path d="M248 144a8 8 0 0 1-16 0a96.11 96.11 0 0 0-96-96a88.1 88.1 0 0 0-88 88a80.09 80.09 0 0 0 80 80a72.08 72.08 0 0 0 72-72a64.07 64.07 0 0 0-64-64a56.06 56.06 0 0 0-56 56a48.05 48.05 0 0 0 48 48a40 40 0 0 0 40-40a32 32 0 0 0-32-32a24 24 0 0 0-24 24a16 16 0 0 0 16 16a8 8 0 0 0 8-8a8 8 0 0 1 0-16a16 16 0 0 1 16 16a24 24 0 0 1-24 24a32 32 0 0 1-32-32a40 40 0 0 1 40-40a48.05 48.05 0 0 1 48 48a56.06 56.06 0 0 1-56 56a64.07 64.07 0 0 1-64-64a72.08 72.08 0 0 1 72-72a80.09 80.09 0 0 1 80 80a88.1 88.1 0 0 1-88 88a96.11 96.11 0 0 1-96-96A104.11 104.11 0 0 1 136 32a112.12 112.12 0 0 1 112 112"/></g></svg>
    <span>カール(回転成分)の勾配方向へ力を戻すボルティシティ強化が、押しつぶされた渦を蘇らせます — カーソルで渦を描いてみましょう</span>
  </p>
  <div class="fa__field" id="field" role="application" aria-label="カール渦実験盤" tabindex="0">
    <canvas class="fa__cv" id="cv"></canvas>
    <b class="fa__badge" aria-hidden="true">12<span class="fa__badgeUnit">強化</span></b>
  </div>
</div>
</main>
<script>
// 컬링 소용돌이(vorticity confinement) — 저해상 격자는 수치 점성 때문에 회전이 금방 눌려 죽는다.
// 매 걸음 속도장의 컬(curl, 회전 성분)을 중심차분으로 구하고, |curl| 의 기울기를 따라
// 회전 축 쪽으로 힘을 되먹여 죽어가던 소용돌이를 다시 살린 뒤 이류로 옮긴다.
var root = document.getElementById('fa');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d', { willReadFrequently: true });

var css = getComputedStyle(root);
var PAL0 = css.getPropertyValue('--dye-0').trim();
var PAL1 = css.getPropertyValue('--dye-1').trim();
var PAL2 = css.getPropertyValue('--dye-2').trim();

// N — 格子 한 변 칸 수. 480px 무대에 32칸이면 한 칸 15px, 컬 계산 + 이류를 60fps 안에 담는다
var N = 32;
var SIZE = (N + 2) * (N + 2);
var IX = function (x, y) { return x + (N + 2) * y; };
var u = new Float32Array(SIZE), v = new Float32Array(SIZE);
var u0 = new Float32Array(SIZE), v0 = new Float32Array(SIZE);
var d = new Float32Array(SIZE), d0 = new Float32Array(SIZE);
var curl = new Float32Array(SIZE);

var EPS = 1e-5;   // 기울기 정규화 분모 0 방지
var VORT = 12;    // 보텍시티 強化 계수 — 클수록 소용돌이가 더 세게 되살아난다

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, raf = 0, seedT = 0;

function fit() {
  var r = field.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = Math.round(W); cv.height = Math.round(H);
}

// 컬 계산 — 중심차분으로 각 칸의 회전 강도(스칼라)를 구한다. 절반 스케일을 곱해 dt 와 맞춘다.
// 이류 직전의 u0·v0(주입 직후)에서 읽는다 — 強化 힘이 같은 걸음 이류로 옮겨지게.
// curl > 0 은 반시계, curl < 0 은 시계 방향 회전이다.
function calcCurl() {
  for (var j = 1; j <= N; j++) {
    for (var i = 1; i <= N; i++) {
      curl[IX(i, j)] = 0.5 * ((v0[IX(i + 1, j)] - v0[IX(i - 1, j)]) - (u0[IX(i, j + 1)] - u0[IX(i, j - 1)]));
    }
  }
}

// 보텍시티 強化 — |curl| 이 커지는 방향(기울기)으로 힘을 더한다.
// 회전이 몰린 곳으로 밀어붙이므로, 눌려 죽던 소용돌이가 다시 골을 파 만다.
// 힘은 이류의 원본인 u0·v0 에 얹는다 — 이류 결과(u)에 더하면 다음 줄에서 통째로 덮여 사라진다.
function confine(dt) {
  for (var j = 2; j < N; j++) {
    for (var i = 2; i < N; i++) {
      var idx = IX(i, j);
      var gx = (Math.abs(curl[IX(i + 1, j)]) - Math.abs(curl[IX(i - 1, j)])) * 0.5;
      var gy = (Math.abs(curl[IX(i, j + 1)]) - Math.abs(curl[IX(i, j - 1)])) * 0.5;
      var len = Math.sqrt(gx * gx + gy * gy) + EPS;
      gx /= len; gy /= len;
      var c = curl[idx];
      u0[idx] += gx * c * VORT * dt;
      v0[idx] += gy * c * VORT * dt;
    }
  }
}

// 후방 이류 — 칸 (x,y) 의 새 값을, 속도를 dt 만큼 거슬러 간 좌표의 옛 값으로 채운다.
function advect(b, dt) {
  var src = b === 'u' ? u0 : (b === 'v' ? v0 : d0);
  var dst = b === 'u' ? u : (b === 'v' ? v : d);
  for (var j = 1; j <= N; j++) {
    for (var i = 1; i <= N; i++) {
      var x = i - dt * N * u0[IX(i, j)];
      var y = j - dt * N * v0[IX(i, j)];
      if (x < 0.5) x = 0.5; else if (x > N + 0.5) x = N + 0.5;
      var i0 = x | 0; var i1 = i0 + 1;
      if (y < 0.5) y = 0.5; else if (y > N + 0.5) y = N + 0.5;
      var j0 = y | 0; var j1 = j0 + 1;
      var s1 = x - i0, s0 = 1 - s1, t1 = y - j0, t0 = 1 - t1;
      dst[IX(i, j)] = s0 * (t0 * src[IX(i0, j0)] + t1 * src[IX(i0, j1)]) +
                      s1 * (t0 * src[IX(i1, j0)] + t1 * src[IX(i1, j1)]);
    }
  }
}

// 경계 — 벽 반사 근사. 유출 속도를 0 으로 두고 밀도는 감쇠시킨다
function bounds() {
  for (var i = 1; i <= N; i++) {
    d[IX(i, 0)] = d[IX(i, 1)] * 0.5; d[IX(i, N + 1)] = d[IX(i, N)] * 0.5;
    u[IX(i, 0)] = u[IX(i, 1)] * 0.5; u[IX(i, N + 1)] = u[IX(i, N)] * 0.5;
    v[IX(i, 0)] = v[IX(i, 1)] * 0.5; v[IX(i, N + 1)] = v[IX(i, N)] * 0.5;
  }
  for (var j = 1; j <= N; j++) {
    d[IX(0, j)] = d[IX(1, j)] * 0.5; d[IX(N + 1, j)] = d[IX(N, j)] * 0.5;
    u[IX(0, j)] = u[IX(1, j)] * 0.5; u[IX(N + 1, j)] = u[IX(N, j)] * 0.5;
    v[IX(0, j)] = v[IX(1, j)] * 0.5; v[IX(N + 1, j)] = v[IX(N, j)] * 0.5;
  }
}

// 미리보기 주입원 — 시드 고정. 서로 반대로 도는 회전 소스 두 개가 그 사이 염료 띠를 감아올린다.
// seedT 로 결정적: 같은 편의 gif·poster 는 언제나 같은 소용돌이가 담긴다.
function inject(t) {
  var s1x = N * 0.32 + Math.sin(t * 0.4) * N * 0.04;
  var s1y = N * 0.5 + Math.cos(t * 0.33) * N * 0.05;
  var s2x = N * 0.68 + Math.sin(t * 0.31 + 2) * N * 0.04;
  var s2y = N * 0.5 + Math.cos(t * 0.47 + 1) * N * 0.05;
  var rv = 4.5;     // 회전 소스 반경 — 넓게 깔아야 염료 띠 전체가 감긴다
  var spin = 5.2 + Math.sin(t * 0.8) * 1.4;
  for (var j = -rv; j <= rv; j++) {
    for (var i = -rv; i <= rv; i++) {
      var q = (i * i + j * j) / (rv * rv);
      if (q > 1) continue;
      var f = Math.exp(-q * 2.4);
      // 접선 방향 속도 (-j, i) — 반지름 밖으로 갈수록 약해지는 회전 소스 두 개(부호 반대)
      var idx1 = IX(Math.round(s1x + i), Math.round(s1y + j));
      u0[idx1] += -j * f * spin * 0.3; v0[idx1] += i * f * spin * 0.3;
      var idx2 = IX(Math.round(s2x + i), Math.round(s2y + j));
      u0[idx2] += j * f * spin * 0.3; v0[idx2] += -i * f * spin * 0.3;
    }
  }
  // 염료 띠 — 두 소용돌이를 잇는 길쭉한 밴드. 감기는 모양새가 프레임마다 자라난다
  var mx = N * 0.5 + Math.sin(t * 0.6) * N * 0.06;
  var my = N * 0.5 + Math.cos(t * 0.5) * N * 0.06;
  var rx = N * 0.22, ry = N * 0.16;
  for (var y = -Math.round(ry); y <= Math.round(ry); y++) {
    for (var x = -Math.round(rx); x <= Math.round(rx); x++) {
      var qq = (x * x) / (rx * rx) + (y * y) / (ry * ry);
      if (qq > 1) continue;
      var amt = Math.exp(-qq * 1.4) * 0.8;
      var idxM = IX(Math.round(mx + x), Math.round(my + y));
      d0[idxM] += amt * ((t * 0.22 % 1) < 0.5 ? 1 : 0.6);
    }
  }
}

function step(dt) {
  u0.set(u); v0.set(v); d0.set(d);
  inject(seedT);
  calcCurl();
  confine(dt);
  advect('u', dt); u0.set(u);
  advect('v', dt); v0.set(v);
  advect('d', dt);
  bounds();
  for (var k = 0; k < SIZE; k++) d[k] *= 0.995;   // 밀도는 천천히 죽는다 — 화면이 꽉 찬 채 굳지 않게
  seedT += dt;
}

function render() {
  var img = ctx.createImageData(cv.width, cv.height);
  var px = img.data;
  var cellW = cv.width / N, cellH = cv.height / N;
  var pal = [PAL0, PAL1, PAL2];
  for (var py = 0; py < cv.height; py++) {
    var gy = Math.min(N - 1, (py / cellH) | 0);
    for (var pxx = 0; pxx < cv.width; pxx++) {
      var gx = Math.min(N - 1, (pxx / cellW) | 0);
      var q = d[IX(gx + 1, gy + 1)];
      var o = (py * cv.width + pxx) * 4;
      if (q <= 0) { px[o] = 23; px[o + 1] = 20; px[o + 2] = 26; px[o + 3] = 255; continue; }
      var band = q > 0.62 ? 2 : (q > 0.3 ? 1 : 0);
      var c = pal[band];
      var rr = parseInt(c.slice(1, 3), 16), gg = parseInt(c.slice(3, 5), 16), bb = parseInt(c.slice(5, 7), 16);
      var a = Math.min(1, q);
      px[o] = 23 + (rr - 23) * a; px[o + 1] = 20 + (gg - 20) * a; px[o + 2] = 26 + (bb - 26) * a; px[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

function frame() {
  step(1 / 30);
  render();
  raf = requestAnimationFrame(frame);
}

// 사람이 휘젓기 — 포인터 이동량을 그 칸 주변에 지수 반경으로 얹는다. 커서 궤적 자체가 새 컬원이 된다.
function splat(gx, gy, fx, fy, amt) {
  var r = 3;
  for (var j = -r; j <= r; j++) {
    for (var i = -r; i <= r; i++) {
      var q = (i * i + j * j) / (r * r);
      if (q > 1) continue;
      if (gx + i < 1 || gx + i > N || gy + j < 1 || gy + j > N) continue;
      var f = Math.exp(-q * 3) * amt;
      var idx = IX(gx + i, gy + j);
      u[idx] += fx * f; v[idx] += fy * f;
      d[idx] = Math.min(2.2, d[idx] + f * 0.7);
    }
  }
}
var last = null;
field.addEventListener('pointermove', function (e) {
  var r = field.getBoundingClientRect();
  var gx = 1 + Math.round((e.clientX - r.left) / r.width * (N - 1));
  var gy = 1 + Math.round((e.clientY - r.top) / r.height * (N - 1));
  if (last) {
    var fx = (e.clientX - last.x) * 0.14, fy = (e.clientY - last.y) * 0.14;
    splat(gx, gy, fx, fy, Math.min(1.6, Math.hypot(fx, fy)));
  } else {
    splat(gx, gy, 0, 0, 0.8);
  }
  last = { x: e.clientX, y: e.clientY };
  if (reduce) render();
});
field.addEventListener('pointerleave', function () { last = null; });
field.addEventListener('keydown', function (e) {
  var dir = { ArrowLeft: [-2, 0], ArrowRight: [2, 0], ArrowUp: [0, -2], ArrowDown: [0, 2] }[e.key];
  if (!dir) return;
  e.preventDefault();
  splat(N >> 1, N >> 1, dir[0], dir[1], 1.2);
  if (reduce) render();
});
window.addEventListener('resize', function () { fit(); if (reduce) render(); });

fit();
if (reduce) {
  // reduce — 시뮬레이션을 40 걸음만 앞으로 감아 소용돌이가 자리잡은 한 장을 그린다(빈 화면이 아니다)
  for (var k = 0; k < 40; k++) step(1 / 30);
  render();
} else {
  // 웜업 — 캡처 첫 장이 빈 화면이 되지 않게 소용돌이가 감기기 시작한 상태에서 루프를 연다
  for (var w = 0; w < 90; w++) step(1 / 30);
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
