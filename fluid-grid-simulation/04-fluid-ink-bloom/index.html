<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잉크 번짐 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage stage--paper">
<div class="fa" id="fa">
  <p class="fa__hint">
    <svg class="fa__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M180 208a52 52 0 0 1-104 0c0-44 52-120 52-120s52 76 52 120Z" opacity=".2"/><path d="M133.87 41.42a8 8 0 0 0-11.74 0C107.42 57.11 68 104.61 68 152a60 60 0 0 0 120 0c0-47.39-39.42-94.89-54.13-110.58ZM128 196a44 44 0 0 1-44-44c0-31.68 26.05-68.51 44-90.06 17.95 21.55 44 58.38 44 90.06a44 44 0 0 1-44 44Z"/></g></svg>
    <span>종이를 클릭하면 그 자리에 염료 방울이 떨어져 젖은 경계를 그리며 번집니다</span>
  </p>
  <div class="fa__field" id="field" role="application" aria-label="잉크 번짐 실험판" tabindex="0">
    <canvas class="fa__cv" id="cv"></canvas>
    <b class="fa__badge" aria-hidden="true">32<span class="fa__badgeUnit">격자</span></b>
  </div>
</div>
</main>
<script>
// 잉크 번짐 — 확산은 낮게 두고 이류만 남긴다. 클릭한 자리에 밀도 한 덩어리(가우시안)를 심으면
// 종이 위 잉크가 젖은 경계를 그리며 자란다. 밀도가 진할수록 곱셈 감쇠(decay = 1 - k*density)로
// 더 천천히 번지게 해 번짐 단계가 눈에 보이게 한다 — 안정 유체 이류(01)와 같은 격자·advect 코드를 공유.
var root = document.getElementById('fa');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d', { willReadFrequently: true });

var css = getComputedStyle(root);
var PAL0 = css.getPropertyValue('--dye-0').trim();
var PAL1 = css.getPropertyValue('--dye-1').trim();
var PAL2 = css.getPropertyValue('--dye-2').trim();

var N = 32;
var SIZE = (N + 2) * (N + 2);
var IX = function (x, y) { return x + (N + 2) * y; };
var u = new Float32Array(SIZE), v = new Float32Array(SIZE);
var u0 = new Float32Array(SIZE), v0 = new Float32Array(SIZE);
var d = new Float32Array(SIZE), d0 = new Float32Array(SIZE);

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, raf = 0, seedT = 0;

function fit() {
  var r = field.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = Math.round(W); cv.height = Math.round(H);
}

// 01 과 동일한 후방 이류(semi-Lagrangian) — 확산 없이 값을 옮기기만 해도 경계가 또렷하게 남는다.
function advect(b, dt) {
  var src = b === 'u' ? u0 : (b === 'v' ? v0 : d0);
  var dst = b === 'u' ? u : (b === 'v' ? v : d);
  for (var j = 1; j <= N; j++) {
    for (var i = 1; i <= N; i++) {
      var x = i - dt * N * u0[IX(i, j)];
      var y = j - dt * N * v0[IX(i, j)];
      if (x < 0.5) x = 0.5; else if (x > N + 0.5) x = N + 0.5;
      var i0 = x | 0; var i1 = i0 + 1;
      if (y < 0.5) y = 0.5; else if (y > N + 0.5) y = N + 0.5;
      var j0 = y | 0; var j1 = j0 + 1;
      var s1 = x - i0, s0 = 1 - s1, t1 = y - j0, t0 = 1 - t1;
      dst[IX(i, j)] = s0 * (t0 * src[IX(i0, j0)] + t1 * src[IX(i0, j1)]) +
                      s1 * (t0 * src[IX(i1, j0)] + t1 * src[IX(i1, j1)]);
    }
  }
}

// 아주 약한 확산 — 종이 섬유로 옆칸에 번지는 정도만. 값이 크면 잉크가 아니라 안개가 된다.
function diffuse(b, k, dt) {
  var src = b === 'u' ? u : (b === 'v' ? v : d);
  var a = dt * k * N * N;
  for (var iter = 0; iter < 2; iter++) {
    for (var j = 1; j <= N; j++) {
      for (var i = 1; i <= N; i++) {
        var idx = IX(i, j);
        src[idx] = (src[idx] + a * (src[IX(i - 1, j)] + src[IX(i + 1, j)] + src[IX(i, j - 1)] + src[IX(i, j + 1)])) / (1 + 4 * a);
      }
    }
  }
}

function bounds() {
  for (var i = 1; i <= N; i++) {
    d[IX(i, 0)] = d[IX(i, 1)] * 0.5; d[IX(i, N + 1)] = d[IX(i, N)] * 0.5;
    u[IX(i, 0)] = u[IX(i, 1)] * 0.4; u[IX(i, N + 1)] = u[IX(i, N)] * 0.4;
    v[IX(i, 0)] = v[IX(i, 1)] * 0.4; v[IX(i, N + 1)] = v[IX(i, N)] * 0.4;
  }
  for (var j = 1; j <= N; j++) {
    d[IX(0, j)] = d[IX(1, j)] * 0.5; d[IX(N + 1, j)] = d[IX(N, j)] * 0.5;
    u[IX(0, j)] = u[IX(1, j)] * 0.4; u[IX(N + 1, j)] = u[IX(N, j)] * 0.4;
    v[IX(0, j)] = v[IX(1, j)] * 0.4; v[IX(N + 1, j)] = v[IX(N, j)] * 0.4;
  }
}

// 방울 심기 — 밀도 덩어리를 반경 3~4칸 가우시안으로 심고, 살짝 바깥으로 밀어내는 속도를 얹어
// 원이 아니라 젖은 경계처럼 삐뚤빼뚤 자라게 한다.
function bloom(gx, gy, amp, jitter) {
  var r = 3.6;
  for (var j = -r; j <= r; j++) {
    for (var i = -r; i <= r; i++) {
      var q = (i * i + j * j) / (r * r);
      if (q > 1) continue;
      var f = Math.exp(-q * 2.4) * amp;
      var ix = Math.round(gx + i), iy = Math.round(gy + j);
      if (ix < 1 || ix > N || iy < 1 || iy > N) continue;
      var idx = IX(ix, iy);
      d[idx] = Math.min(2.4, d[idx] + f);
      // 바깥쪽으로 밀어내는 속도 — 종이 섬유를 따라 삐뚤게(jitter)
      var len = Math.sqrt(i * i + j * j) || 1;
      var nx = i / len, ny = j / len;
      var wob = Math.sin(iy * 1.7 + ix * 0.6 + jitter) * 0.4;
      u[idx] += (nx + wob) * f * 0.045;
      v[idx] += (ny - wob) * f * 0.045;
    }
  }
}

// 미리보기 — 시드 고정 좌표 세 곳에 2초(60스텝 @30fps)마다 번갈아 새 방울을 심는 결정적 패턴.
var seedSpots = [
  { x: N * 0.32, y: N * 0.38 },
  { x: N * 0.68, y: N * 0.56 },
  { x: N * 0.46, y: N * 0.74 }
];
var seedPeriod = 60; // step 단위(1/30 초 * 60 = 2초)
var lastSeedStep = -999;
var stepCount = 0;

function step(dt) {
  if (stepCount - lastSeedStep >= seedPeriod) {
    var spot = seedSpots[(stepCount / seedPeriod | 0) % seedSpots.length];
    bloom(spot.x, spot.y, 1.7, seedT);
    lastSeedStep = stepCount;
  }
  // 밀도가 진할수록 느리게 번지는 곱셈 감쇠 — decay = 1 - k*density. 진한 코어는 거의 안 움직이고
  // 옅은 경계만 계속 퍼진다(단계적으로 보이는 이유).
  for (var k = 0; k < SIZE; k++) {
    var decay = 1 - Math.min(0.7, d[k] * 0.32);
    u[k] *= decay; v[k] *= decay;
  }
  u0.set(u); v0.set(v); d0.set(d);
  advect('u', dt); u0.set(u);
  advect('v', dt); v0.set(v);
  advect('d', dt);
  diffuse('d', 0.0009, dt); // 확산은 아주 낮게 — 이류가 경계를 만드는 주역
  bounds();
  for (var m = 0; m < SIZE; m++) { d[m] *= 0.9985; u[m] *= 0.985; v[m] *= 0.985; }
  seedT += dt;
  stepCount++;
}

function render() {
  var img = ctx.createImageData(cv.width, cv.height);
  var px = img.data;
  var cellW = cv.width / N, cellH = cv.height / N;
  var pal = [PAL0, PAL1, PAL2];
  for (var py = 0; py < cv.height; py++) {
    var gy = Math.min(N - 1, (py / cellH) | 0);
    for (var pxx = 0; pxx < cv.width; pxx++) {
      var gx = Math.min(N - 1, (pxx / cellW) | 0);
      var q = d[IX(gx + 1, gy + 1)];
      var o = (py * cv.width + pxx) * 4;
      if (q <= 0.02) { px[o] = 255; px[o + 1] = 255; px[o + 2] = 255; px[o + 3] = 255; continue; }
      var band = q > 0.9 ? 2 : (q > 0.4 ? 1 : 0);
      var c = pal[band];
      var rr = parseInt(c.slice(1, 3), 16), gg = parseInt(c.slice(3, 5), 16), bb = parseInt(c.slice(5, 7), 16);
      var a = Math.min(1, q * 0.85 + 0.15);
      px[o] = 255 + (rr - 255) * a; px[o + 1] = 255 + (gg - 255) * a; px[o + 2] = 255 + (bb - 255) * a; px[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

function frame() {
  step(1 / 30);
  render();
  raf = requestAnimationFrame(frame);
}

// 실제 사용 — pointerdown 으로 큰 방울, pointermove 로 이어 끄는 작은 방울
field.addEventListener('pointerdown', function (e) {
  var r = field.getBoundingClientRect();
  var gx = 1 + ((e.clientX - r.left) / r.width * (N - 1));
  var gy = 1 + ((e.clientY - r.top) / r.height * (N - 1));
  bloom(gx, gy, 2.0, seedT * 3.1);
  if (reduce) render();
});
field.addEventListener('pointermove', function (e) {
  if (e.pressure === 0 && e.buttons === 0) return;
  var r = field.getBoundingClientRect();
  var gx = 1 + ((e.clientX - r.left) / r.width * (N - 1));
  var gy = 1 + ((e.clientY - r.top) / r.height * (N - 1));
  bloom(gx, gy, 0.55, seedT * 3.1);
  if (reduce) render();
});
field.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  e.preventDefault();
  bloom(N * 0.5, N * 0.5, 2.0, seedT * 3.1);
  if (reduce) render();
});
window.addEventListener('resize', function () { fit(); if (reduce) render(); });

fit();
if (reduce) {
  for (var k = 0; k < 40; k++) step(1 / 30);
  render();
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
