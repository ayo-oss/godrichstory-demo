<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complete value flash — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dcf is-demo" id="dcf">
  <div class="dcf__badge" id="dcfBadge">
    <span class="dcf__sweep" id="dcfSweep"></span>
    <span class="dcf__text">Done</span>
  </div>
  <button class="dcf__btn" id="dcfBtn" type="button">Replay</button>
</div>
<script>
(function () {
  var root = document.getElementById('dcf');
  var badge = document.getElementById('dcfBadge');
  var sweep = document.getElementById('dcfSweep');
  var btn = document.getElementById('dcfBtn');

  // 상수: Done 표시 유지 시간(ms) · 광택 sweep 1회 길이(ms) · 반복 횟수 · 감쇠율
  var VISIBLE_MS = 1500;
  var SWEEP_MS = 420;
  var SWEEP_COUNT = 3;
  var DECAY = 0.55; // 회차마다 강도(불투명도)가 이 비율로 줄어든다
  var CYCLE_MS = 2400;

  var start = performance.now();
  var raf = null;

  // 계산 겹: 광택 sweep 의 세기 = 초기값 × DECAY^회차(지수 감쇠) — 매 회차 옅어지다 사라진다
  function sweepOpacity(passIndex) {
    return Math.pow(DECAY, passIndex);
  }

  function frame(now) {
    var e = (now - start) % CYCLE_MS;
    var on = e < VISIBLE_MS;
    root.classList.toggle('dcf--on', on);
    if (on) {
      var passLen = SWEEP_MS;
      var passIdx = Math.floor(e / passLen);
      var passT = (e % passLen) / passLen;
      if (passIdx < SWEEP_COUNT) {
        var x = -30 + passT * 160; // %
        sweep.style.transform = 'translateX(' + x.toFixed(1) + '%) skewX(-18deg)';
        sweep.style.opacity = sweepOpacity(passIdx).toFixed(3);
      } else {
        sweep.style.opacity = '0';
      }
    }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    start = performance.now();
    root.classList.add('dcf--on');
  });
})();
</script>
</main>
</body>
</html>
