<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reduced-motion static download display — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="drm is-demo" id="drm">
  <div class="drm__col">
    <span class="drm__colLabel">Normal motion</span>
    <div class="drm__track"><div class="drm__fill" id="drmFillA"></div></div>
    <span class="drm__pct" id="drmPctA">0%</span>
  </div>
  <div class="drm__col drm__col--reduced">
    <span class="drm__colLabel">Reduced motion</span>
    <div class="drm__staticBox"><span class="drm__pct" id="drmPctB">0%</span></div>
  </div>
  <button class="drm__btn" id="drmBtn" type="button">Switch to reduced motion</button>
</div>
<script>
(function () {
  var root = document.getElementById('drm');
  var fillA = document.getElementById('drmFillA');
  var pctA = document.getElementById('drmPctA');
  var pctB = document.getElementById('drmPctB');
  var btn = document.getElementById('drmBtn');

  // 상수: In progress 속도(%/틱) · 틱 간격(ms)
  var STEP = 4;
  var TICK_MS = 130;
  var forcedReduce = false;

  var pct = 0;

  // 계산 겹: 같은 In progress 값 하나를 두 판이 다르게 그린다 — 왼쪽은 매 틱 transform 갱신, 오른쪽은 문구만 교체(레이아웃·트랜지션 0)
  function paint() {
    fillA.style.transform = 'scaleX(' + (pct / 100).toFixed(3) + ')';
    pctA.textContent = pct + '%';
    pctB.textContent = pct + '%';
  }

  function tick() {
    pct = (pct + STEP) % 101;
    paint();
    setTimeout(tick, TICK_MS);
  }
  tick();

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    forcedReduce = !forcedReduce;
    root.classList.toggle('drm--force-reduce', forcedReduce);
    btn.textContent = forcedReduce ? 'Switch to normal motion' : 'Switch to reduced motion';
  });
})();
</script>
</main>
</body>
</html>
