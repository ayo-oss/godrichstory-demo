<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pause/resume download — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dpr is-demo" id="dpr">
  <div class="dpr__head">
    <span class="dpr__state" id="dprState">In progress</span>
    <span class="dpr__pct" id="dprPct">0%</span>
  </div>
  <div class="dpr__track"><div class="dpr__fill" id="dprFill"></div></div>
  <button class="dpr__btn" id="dprBtn" type="button">Pause</button>
</div>
<script>
(function () {
  var root = document.getElementById('dpr');
  var state = document.getElementById('dprState');
  var pctEl = document.getElementById('dprPct');
  var fill = document.getElementById('dprFill');
  var btn = document.getElementById('dprBtn');

  // 상수: Total 소요 시간(ms) · 자동 루프의 Stopped 구간(ms)
  var TOTAL_MS = 2600;
  var AUTO_PAUSE_AT = [0.28, 0.62];
  var AUTO_PAUSE_MS = 420;

  var paused = false;
  var startedAt = performance.now();
  var pausedElapsed = 0; // 정지되기 전까지 이미 쌓인 경과 값
  var raf = null;
  var autoIdx = 0;

  // 계산 겹: 경과 시간 = Stopped 전 누적값(pausedElapsed) + (지금 - Resume 시각). 재개할 때 0으로 안 끊긴다
  function elapsed() {
    if (paused) return pausedElapsed;
    return pausedElapsed + (performance.now() - startedAt);
  }

  function paint() {
    var e = Math.min(TOTAL_MS, elapsed());
    var p = e / TOTAL_MS;
    fill.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    pctEl.textContent = Math.round(p * 100) + '%';
    state.textContent = paused ? 'Stopped' : (p >= 1 ? 'Done' : 'In progress');
    root.classList.toggle('dpr--paused', paused && p < 1);
    return p;
  }

  function setPaused(v) {
    if (v === paused) return;
    if (v) {
      pausedElapsed = elapsed();
      paused = true;
    } else {
      startedAt = performance.now();
      paused = false;
    }
  }

  function tick() {
    var p = paint();
    if (!paused && p < 1 && autoIdx < AUTO_PAUSE_AT.length && p >= AUTO_PAUSE_AT[autoIdx]) {
      setPaused(true);
      autoIdx++;
      setTimeout(function () { if (root.classList.contains('is-demo')) setPaused(false); }, AUTO_PAUSE_MS);
    }
    if (p >= 1) {
      setTimeout(function () {
        pausedElapsed = 0; startedAt = performance.now(); paused = false; autoIdx = 0; paint();
      }, 700);
    }
    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    setPaused(!paused);
    btn.textContent = paused ? 'Resume' : 'Pause';
  });
})();
</script>
</main>
</body>
</html>
