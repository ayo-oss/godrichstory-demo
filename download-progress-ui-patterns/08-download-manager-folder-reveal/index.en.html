<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Completed item area move — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dfr is-demo" id="dfr">
  <div class="dfr__list">
    <div class="dfr__item" id="dfrItem0">Item 1</div>
    <div class="dfr__item" id="dfrItem1">Item 2</div>
  </div>
  <div class="dfr__zone">
    <span class="dfr__zoneLabel">Done</span>
    <div class="dfr__zoneSlot" id="dfrSlot"></div>
  </div>
  <button class="dfr__btn" id="dfrBtn" type="button">Replay</button>
</div>
<script>
(function () {
  var root = document.getElementById('dfr');
  var items = [document.getElementById('dfrItem0'), document.getElementById('dfrItem1')];
  var slot = document.getElementById('dfrSlot');
  var btn = document.getElementById('dfrBtn');

  // 상수: 스프링 감쇠비(zeta) · 각진동수(w) · 항목별 시작 지연(ms) · 이동 소요(ms)
  var ZETA = 0.42;
  var W = 7.5;
  var START_DELAY = [0, 1100];
  var MOVE_MS = 850;
  var CYCLE_MS = 2900;

  // 계산 겹: 위치 진행도를 질량-스프링 방정식으로 매 프레임 계산(목표를 넘었다가 되돌아와 멈춘다) — CSS 트랜지션이 아니다
  function spring(u) {
    var wd = W * Math.sqrt(1 - ZETA * ZETA);
    var e = Math.exp(-ZETA * W * u);
    return 1 - e * (Math.cos(wd * u) + (ZETA * W / wd) * Math.sin(wd * u));
  }

  var cycleStart = performance.now();

  function paint(el, delay) {
    var t = performance.now() - cycleStart - delay;
    if (t <= 0) {
      el.style.transform = 'translate(0,0) scale(1)';
      el.style.opacity = '1';
      return;
    }
    var rItem = el.getBoundingClientRect();
    var rSlot = slot.getBoundingClientRect();
    var dx = rSlot.left + rSlot.width / 2 - (rItem.left + rItem.width / 2);
    var dy = rSlot.top + rSlot.height / 2 - (rItem.top + rItem.height / 2);
    var u = Math.min(t / MOVE_MS, 1) * 2.5;
    var s = spring(u);
    el.style.transform = 'translate(' + (dx * s).toFixed(1) + 'px,' + (dy * s).toFixed(1) + 'px) scale(' + (1 - 0.55 * Math.min(s, 1)).toFixed(3) + ')';
    var fadeStart = MOVE_MS * 0.85;
    el.style.opacity = t > fadeStart ? String(Math.max(0, 1 - (t - fadeStart) / (MOVE_MS * 0.3))) : '1';
  }

  function frame() {
    var now = performance.now();
    if (now - cycleStart > CYCLE_MS) {
      cycleStart = now;
    }
    paint(items[0], START_DELAY[0]);
    paint(items[1], START_DELAY[1]);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    cycleStart = performance.now();
  });
})();
</script>
</main>
</body>
</html>
