<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>破損時の再試行 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dcr is-demo" id="dcr">
  <div class="dcr__head">
    <span class="dcr__state" id="dcrState">ダウンロード中</span>
    <span class="dcr__retry" id="dcrRetry">再試行 0</span>
  </div>
  <div class="dcr__track"><div class="dcr__fill" id="dcrFill"></div></div>
  <button class="dcr__btn" id="dcrBtn" type="button">今すぐ再試行</button>
</div>
<script>
(function () {
  var root = document.getElementById('dcr');
  var state = document.getElementById('dcrState');
  var retryEl = document.getElementById('dcrRetry');
  var fill = document.getElementById('dcrFill');
  var btn = document.getElementById('dcrBtn');

  // 시드 고정: 회차별 검증 결과(참=검증 통과). 0·1회차는 破損, 2회차부터 통과
  var VERIFY_SEED = [false, false, true, true, true];
  // 상수: 틱 간격 · 기저 대기(ms) · 지수 배수 — 재시도할 때마다 대기 시간이 늘어난다
  var TICK_MS = 90;
  var BASE_BACKOFF_MS = 260;
  var BACKOFF_MULT = 2;
  var MAX_PCT = 100;

  var pct = 0;
  var retry = 0;
  var timer = null;
  var btnDisabled = false;

  // 계산 겹: 再試行 대기 = 기저값 × 배수^재시도횟수(지수 백오프) — 매 실패마다 대기가 길어진다
  function backoffMs() {
    return BASE_BACKOFF_MS * Math.pow(BACKOFF_MULT, Math.min(retry, 4));
  }

  function paint() {
    fill.style.transform = 'scaleX(' + (pct / MAX_PCT).toFixed(3) + ')';
    retryEl.textContent = '再試行 ' + retry;
  }

  function verify() {
    var ok = VERIFY_SEED[retry % VERIFY_SEED.length];
    if (ok) {
      state.textContent = '完了';
      root.classList.add('dcr--ok');
      setTimeout(reset, 900);
    } else {
      state.textContent = '破損';
      root.classList.add('dcr--bad');
      retry++;
      pct = 0;
      paint();
      var wait = backoffMs();
      timer = setTimeout(function () {
        root.classList.remove('dcr--bad');
        state.textContent = 'ダウンロード中';
        download();
      }, wait);
    }
  }

  function download() {
    if (pct >= MAX_PCT) { verify(); return; }
    pct = Math.min(MAX_PCT, pct + 9);
    paint();
    timer = setTimeout(download, TICK_MS);
  }

  function reset() {
    root.classList.remove('dcr--ok', 'dcr--bad');
    pct = 0; retry = 0; state.textContent = 'ダウンロード中';
    paint();
    download();
  }

  download();

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    if (timer) clearTimeout(timer);
    reset();
  });
})();
</script>
</main>
</body>
</html>
