<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extract shape morph — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dem is-demo" id="dem">
  <svg class="dem__shape" viewBox="0 0 100 100">
    <polygon class="dem__poly" id="demPoly" points=""></polygon>
  </svg>
  <div class="dem__row">
    <span class="dem__label">Extracting</span>
    <span class="dem__pct" id="demPct">0%</span>
  </div>
  <div class="dem__track"><div class="dem__fill" id="demFill"></div></div>
  <button class="dem__btn" id="demBtn" type="button">Pause</button>
</div>
<script>
(function () {
  var poly = document.getElementById('demPoly');
  var pctEl = document.getElementById('demPct');
  var fill = document.getElementById('demFill');

  // 상수: 시작 형태(닫힌 상자, 8점) · 끝 형태(펼친 도형, 같은 8점 순서) — index.html
  var BOX = [[30, 25], [70, 25], [70, 40], [70, 55], [70, 75], [30, 75], [30, 55], [30, 40]];
  var OPEN = [[15, 30], [85, 20], [78, 45], [88, 60], [72, 82], [28, 88], [18, 58], [10, 42]];
  var DUR_MS = 2400;

  var start = performance.now();
  var pausedAt = 0;
  var paused = false;
  var btn = document.getElementById('demBtn');

  // 계산 겹: In progress 값(0~1)으로 8개 점 좌표를 각각 선형보간(lerp) — 두 도형을 겹쳐 페이드하지 않는다
  function lerpPoints(t) {
    var out = [];
    for (var i = 0; i < BOX.length; i++) {
      var x = BOX[i][0] + (OPEN[i][0] - BOX[i][0]) * t;
      var y = BOX[i][1] + (OPEN[i][1] - BOX[i][1]) * t;
      out.push(x.toFixed(1) + ',' + y.toFixed(1));
    }
    return out.join(' ');
  }

  function paint(t) {
    poly.setAttribute('points', lerpPoints(t));
    fill.style.transform = 'scaleX(' + t.toFixed(3) + ')';
    pctEl.textContent = Math.round(t * 100) + '%';
  }

  function frame(now) {
    if (!paused) {
      var e = (now - start) % DUR_MS;
      pausedAt = e / DUR_MS;
      paint(pausedAt);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  btn.addEventListener('click', function () {
    document.getElementById('dem').classList.remove('is-demo');
    paused = !paused;
    btn.textContent = paused ? 'Resume' : 'Pause';
    if (!paused) start = performance.now() - pausedAt * DUR_MS;
  });
})();
</script>
</main>
</body>
</html>
