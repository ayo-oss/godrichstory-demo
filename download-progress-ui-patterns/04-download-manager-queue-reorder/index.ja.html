<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待機列の並び替え — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dqr is-demo" id="dqr">
  <div class="dqr__item" data-order="0" id="dqrItem0">待機 A</div>
  <div class="dqr__item" data-order="1" id="dqrItem1">待機 B</div>
  <div class="dqr__item" data-order="2" id="dqrItem2">待機 C</div>
  <div class="dqr__item" data-order="3" id="dqrItem3">待機 D</div>
</div>
<script>
(function () {
  var root = document.getElementById('dqr');
  var items = [document.getElementById('dqrItem0'), document.getElementById('dqrItem1'), document.getElementById('dqrItem2'), document.getElementById('dqrItem3')];

  // 상수: 항목 높이(px, gap 포함) · 순서→위치 보간 속도(1프레임당 남은 거리의 비율)
  var ROW_H = 40;
  var LERP = 0.18;
  var AUTO_SWAP_MS = 900;

  var order = [0, 1, 2, 3]; // order[i] = i번째 칸에 있는 항목 index
  var y = [0, 1, 2, 3].map(function (i) { return i * ROW_H; }); // 각 항목의 실제(보간 중) y
  var dragging = -1;
  var dragStartY = 0, dragStartTop = 0;

  function targetY(itemIdx) {
    var slot = order.indexOf(itemIdx);
    return slot * ROW_H;
  }

  // 계산 겹: 순서 값이 바뀌면 목표 위치로 즉시 점프하지 않고 매 프레임 남은 거리의 LERP 비율만큼 다가간다
  function tickLerp() {
    for (var i = 0; i < items.length; i++) {
      if (i === dragging) continue;
      var t = targetY(i);
      y[i] += (t - y[i]) * LERP;
      items[i].style.transform = 'translateY(' + y[i].toFixed(2) + 'px)';
    }
    requestAnimationFrame(tickLerp);
  }
  requestAnimationFrame(tickLerp);

  function swap(a, b) {
    var sa = order.indexOf(a), sb = order.indexOf(b);
    order[sa] = b; order[sb] = a;
  }

  // 자동 루프: 대기 중인 항목의 순서 값을 주기적으로 맞바꾼다
  var autoSeq = [[0, 2], [1, 3], [0, 1], [2, 3], [0, 3]];
  var autoI = 0;
  function autoStep() {
    if (root.classList.contains('is-demo')) {
      var pair = autoSeq[autoI % autoSeq.length];
      swap(pair[0], pair[1]);
      autoI++;
    }
    setTimeout(autoStep, AUTO_SWAP_MS);
  }
  setTimeout(autoStep, AUTO_SWAP_MS);

  // 실사용자 드래그: pointerdown/move/up 으로 순서 값을 직접 바꾼다
  items.forEach(function (el, idx) {
    el.addEventListener('pointerdown', function (e) {
      root.classList.remove('is-demo');
      dragging = idx;
      dragStartY = e.clientY;
      dragStartTop = y[idx];
      el.setPointerCapture(e.pointerId);
      el.classList.add('dqr__item--drag');
    });
    el.addEventListener('pointermove', function (e) {
      if (dragging !== idx) return;
      var ny = dragStartTop + (e.clientY - dragStartY);
      y[idx] = ny;
      el.style.transform = 'translateY(' + ny.toFixed(2) + 'px)';
      var slot = Math.max(0, Math.min(items.length - 1, Math.round(ny / ROW_H)));
      var curSlot = order.indexOf(idx);
      if (slot !== curSlot) {
        var other = order[slot];
        order[curSlot] = other;
        order[slot] = idx;
      }
    });
    function end(e) {
      if (dragging !== idx) return;
      dragging = -1;
      el.classList.remove('dqr__item--drag');
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  });
})();
</script>
</main>
</body>
</html>
