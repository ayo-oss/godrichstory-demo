<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전송 속도 그래프 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dsg is-demo" id="dsg">
  <div class="dsg__head">
    <span class="dsg__label">전송 속도</span>
    <span class="dsg__val" id="dsgVal">0MB/s</span>
  </div>
  <svg class="dsg__graph" viewBox="0 0 220 80" preserveAspectRatio="none">
    <polyline class="dsg__raw" id="dsgRaw" points=""></polyline>
    <polyline class="dsg__avg" id="dsgAvg" points=""></polyline>
  </svg>
  <button class="dsg__btn" id="dsgBtn" type="button">일시정지</button>
</div>
<script>
(function () {
  var root = document.getElementById('dsg');
  var val = document.getElementById('dsgVal');
  var rawLine = document.getElementById('dsgRaw');
  var avgLine = document.getElementById('dsgAvg');

  // 시드 고정: 초당 전송량 원시 표본(MB/s ×10, 정수). 실 네트워크 측정 0
  var SAMPLES = [12, 18, 15, 26, 32, 28, 40, 36, 44, 52, 48, 58, 54, 62, 46, 38, 44, 50, 42, 34, 28, 22, 16, 20];
  var N = 5; // 이동평균 창(최근 N 개 표본)
  var W = 220, H = 80, MAXV = 65;
  var TICK_MS = 160;

  var buf = [];
  var i = 0;
  var paused = false;
  var timer = 0;
  var btn = document.getElementById('dsgBtn');

  function pt(idx, v, count) {
    var x = count <= 1 ? W : (idx / (count - 1)) * W;
    var y = H - (v / MAXV) * H;
    return x.toFixed(1) + ',' + y.toFixed(1);
  }

  // 계산 겹: 최근 N개 원시 표본의 이동평균 — 그래프 선은 이 평균값을 잇는다(원시값 자체가 아님)
  function movingAvg(arr) {
    var out = [];
    for (var k = 0; k < arr.length; k++) {
      var s = Math.max(0, k - N + 1);
      var sum = 0, c = 0;
      for (var j = s; j <= k; j++) { sum += arr[j]; c++; }
      out.push(sum / c);
    }
    return out;
  }

  function paint() {
    var avg = movingAvg(buf);
    var rawPts = [], avgPts = [];
    for (var k = 0; k < buf.length; k++) {
      rawPts.push(pt(k, buf[k], buf.length));
      avgPts.push(pt(k, avg[k], buf.length));
    }
    rawLine.setAttribute('points', rawPts.join(' '));
    avgLine.setAttribute('points', avgPts.join(' '));
    var last = avg.length ? avg[avg.length - 1] : 0;
    val.textContent = (last / 10).toFixed(1) + 'MB/s';
  }

  function tick() {
    if (paused) return;
    buf.push(SAMPLES[i % SAMPLES.length]);
    if (buf.length > 14) buf.shift();
    i++;
    paint();
    timer = setTimeout(tick, TICK_MS);
  }

  tick();

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    paused = !paused;
    btn.textContent = paused ? '재개' : '일시정지';
    if (!paused) tick();
    else clearTimeout(timer);
  });
})();
</script>
</main>
</body>
</html>
