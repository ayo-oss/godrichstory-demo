<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다중 파일 병렬 다운로드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dmf is-demo" id="dmf">
  <div class="dmf__row" data-i="0">
    <div class="dmf__head"><span class="dmf__name">파일 1</span><span class="dmf__pct" id="dmfPct0">0%</span></div>
    <div class="dmf__track"><div class="dmf__fill" id="dmfFill0"></div></div>
  </div>
  <div class="dmf__row" data-i="1">
    <div class="dmf__head"><span class="dmf__name">파일 2</span><span class="dmf__pct" id="dmfPct1">0%</span></div>
    <div class="dmf__track"><div class="dmf__fill" id="dmfFill1"></div></div>
  </div>
  <div class="dmf__row" data-i="2">
    <div class="dmf__head"><span class="dmf__name">파일 3</span><span class="dmf__pct" id="dmfPct2">0%</span></div>
    <div class="dmf__track"><div class="dmf__fill" id="dmfFill2"></div></div>
  </div>
  <div class="dmf__row dmf__row--total">
    <div class="dmf__head"><span class="dmf__name">전체</span><span class="dmf__pct" id="dmfPctT">0%</span></div>
    <div class="dmf__track"><div class="dmf__fill dmf__fill--total" id="dmfFillT"></div></div>
  </div>
  <button class="dmf__btn" id="dmfBtn" type="button">일시정지</button>
</div>
<script>
(function () {
  var root = document.getElementById('dmf');
  var btn = document.getElementById('dmfBtn');
  var fills = [document.getElementById('dmfFill0'), document.getElementById('dmfFill1'), document.getElementById('dmfFill2')];
  var pcts = [document.getElementById('dmfPct0'), document.getElementById('dmfPct1'), document.getElementById('dmfPct2')];
  var fillT = document.getElementById('dmfFillT');
  var pctT = document.getElementById('dmfPctT');

  // 시드 고정: 파일별 크기(KB, 가상)와 틱마다 더할 속도 배열(KB/틱). 실 fetch·File API 0
  var SIZES = [420, 980, 640];
  var SPEEDS = [
    [32, 40, 48, 52, 46, 38, 30, 44, 56, 60, 50, 36],
    [58, 64, 60, 52, 44, 38, 46, 54, 62, 58, 48, 40],
    [20, 26, 32, 38, 44, 40, 34, 28, 24, 30, 36, 42]
  ];
  var TICK_MS = 140;
  var HOLD_MS = 700;

  var done = [0, 0, 0];
  var tick = 0;
  var paused = false;
  var timer = null;

  // 계산 겹: 전체 진행 값 = 파일별 다운로드 바이트 합 ÷ 전체 크기 합(용량 가중 평균, 단순 3칸 평균 아님)
  function overall() {
    var d = done[0] + done[1] + done[2];
    var s = SIZES[0] + SIZES[1] + SIZES[2];
    return d / s;
  }

  function paint() {
    for (var i = 0; i < 3; i++) {
      var p = done[i] / SIZES[i];
      fills[i].style.transform = 'scaleX(' + p.toFixed(3) + ')';
      pcts[i].textContent = Math.round(p * 100) + '%';
    }
    var o = overall();
    fillT.style.transform = 'scaleX(' + o.toFixed(3) + ')';
    pctT.textContent = Math.round(o * 100) + '%';
    root.classList.toggle('dmf--done', o >= 1);
  }

  function step() {
    var allDone = true;
    for (var i = 0; i < 3; i++) {
      if (done[i] < SIZES[i]) {
        done[i] = Math.min(SIZES[i], done[i] + SPEEDS[i][tick % SPEEDS[i].length]);
        allDone = false;
      }
    }
    tick++;
    paint();
    if (allDone) {
      timer = setTimeout(function () { done = [0, 0, 0]; tick = 0; paint(); loop(); }, HOLD_MS);
    } else {
      loop();
    }
  }

  function loop() {
    if (paused) return;
    timer = setTimeout(step, TICK_MS);
  }

  paint();
  loop();

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    paused = !paused;
    btn.textContent = paused ? '재개' : '일시정지';
    if (!paused) loop();
    else if (timer) clearTimeout(timer);
  });
})();
</script>
</main>
</body>
</html>
