<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsletter signup embed widget — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <form class="ncard" novalidate>
    <span class="ncard__icon" aria-hidden="true">
      <svg class="ic-mail" viewBox="0 0 256 256" width="22" height="22"><g fill="currentColor"><path d="m224 56l-96 88l-96-88Z" opacity=".2"/><path d="M224 48H32a8 8 0 0 0-8 8v136a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a8 8 0 0 0-8-8m-20.57 16L128 133.15L52.57 64ZM216 192H40V74.19l82.59 75.71a8 8 0 0 0 10.82 0L216 74.19z"/></g></svg>
      <svg class="ic-sent" viewBox="0 0 256 256" width="22" height="22" hidden><g fill="currentColor"><path d="m223.69 42.18l-58.22 192a8 8 0 0 1-14.92 1.25L108 148l-87.42-42.55a8 8 0 0 1 1.25-14.92l192-58.22a8 8 0 0 1 9.86 9.87" opacity=".2"/><path d="M227.32 28.68a16 16 0 0 0-15.66-4.08h-.15L19.57 82.84a16 16 0 0 0-2.49 29.8L102 154l41.3 84.87a15.86 15.86 0 0 0 14.44 9.13q.69 0 1.38-.06a15.88 15.88 0 0 0 14-11.51l58.2-191.94v-.15a16 16 0 0 0-4-15.66"/></g></svg>
    </span>
    <p class="ncard__title">새 데모가 나올 때마다 메일로</p>
    <div class="ncard__row">
      <label class="ncard__label" for="ncard-email-234-08">이메일</label>
      <input class="ncard__input" id="ncard-email-234-08" type="email" placeholder="you@example.com" required>
      <button class="ncard__btn" type="submit">구독</button>
    </div>
    <p class="ncard__msg" role="status"></p>
  </form>
</main>
<script>
// 실제 동작: 이메일 형식을 검사해 통과하면 완료 상태로 바뀐다 (실제 전송은 없는 데모).
var form = document.querySelector('.ncard');
var input = document.querySelector('.ncard__input');
var btn = document.querySelector('.ncard__btn');
var msg = document.querySelector('.ncard__msg');
var mail = document.querySelector('.ic-mail');
var sent = document.querySelector('.ic-sent');
form.addEventListener('submit', function (e) {
  e.preventDefault();
  var ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value);
  if (!ok) { msg.textContent = '이메일 형식을 확인해 주세요'; msg.className = 'ncard__msg is-error'; return; }
  input.disabled = true;
  btn.disabled = true;
  btn.textContent = '완료';
  mail.hidden = true;
  sent.hidden = false;
  msg.textContent = '구독 완료 — 확인 메일을 보냈어요';
  msg.className = 'ncard__msg is-ok';
});
</script>
</body>
</html>
