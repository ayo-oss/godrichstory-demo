        const kp = clamp((t - ph.batchStart) / T3_BATCH, 0, 1);
        const inBatch = cur && t >= ph.batchStart ? cur.batch : [];
        const inSet = {};
        for (let k = 0; k < inBatch.length; k += 1) {
            inSet[inBatch[k]] = k;
        }
        // 큐에 남은 줄의 자리 — 아직 묶음에 든 적 없는 줄(또는 돌아온 줄) 순서대로
        // 현재 큐 순서를 다시 만든다: simulate 와 같은 규칙 — 처리된 묶음을 거듭 적용
        let qq = [];
        for (let i = 0; i < N3; i += 1) {
            qq.push({ i: i, retry: 0 });
        }
        for (let r = 0; r < Math.min(rounds.length, ph.round); r += 1) {
            const batch = qq.splice(0, PER_BATCH);
            const back = [];
            for (let k = 0; k < batch.length; k += 1) {
                const it = batch[k];
                const fail = seedHash(it.i * 31 + it.retry, seeds3) < FAIL_P;
                if (fail && it.retry + 1 <= MAX_RETRY) {
                    back.push({ i: it.i, retry: it.retry + 1 });
                }
            }
            for (let k = 0; k < back.length; k += 1) {
                qq.push(back[k]);
            }
        }
        // 현재 묶음에 든 줄은 qq 앞에서 뺀다
        const curQueue = qq.slice(inBatch.length);
        // 목표 자리를 정한다
        for (let b = 0; b < balls3.length; b += 1) {
            const B = balls3[b];
            const s = st[B.i];
            if (s.state === 'sent') {
                B.state = 'sent';
                B.tx = plateSeat(s.seatDone).x;
                B.ty = plateSeat(s.seatDone).y;
            }
            else if (s.state === 'dropped') {
                B.state = 'dropped';
                B.tx = sideSeat(s.seatDone).x;
                B.ty = sideSeat(s.seatDone).y;
            }
            else if (inSet[B.i] !== undefined) {
                // 이번 묶음 — 관 아래구로 내려가고(k1), 결과에 따라 접시(送信済み)·관 위(재시도)·옆 접시(打ち切り) 로 갈린다
                const k = inSet[B.i];
                B.state = 'flight';
                const fail = cur.retried.some(function (x) { return x.i === B.i; }) || cur.dropped.indexOf(B.i) >= 0;
                const willDrop = cur.dropped.indexOf(B.i) >= 0;
                const willRetry = cur.retried.some(function (x) { return x.i === B.i; });
                if (kp < 0.45) {
                    B.tx = PIPE_X + PIPE_W / 2 + (k - (inBatch.length - 1) / 2) * 2;
                    B.ty = PIPE_BOT + 8 + k * 0;
                }
                else if (willRetry) {
                    // 관 위로 튀어 올라 다시 줄선다 — 목표는 관 위 (큐 끝은 관 위에서 다시 쌓인다)
                    B.tx = PIPE_X + PIPE_W / 2;
                    B.ty = PIPE_TOP - BALL;
                }
                else if (willDrop) {
                    B.tx = sideSeat(0).x + 8;
                    B.ty = sideSeat(0).y;
                }
                else {
                    B.tx = plateSeat(sentCount + k).x;
                    B.ty = plateSeat(sentCount).y;
                }
            }
            else {
                // 큐에 남은 줄 — 관 안 자리
                B.state = 'queue';
                const pos = curQueue.findIndex(function (x) { return x.i === B.i; });
                if (pos >= 0) {
                    const q = queueSeat(pos, curQueue.length);
                    B.tx = q.x;
                    B.ty = q.y;
                }
            }
        }
        // 재시도 줄은 관 위에 도달한 뒤 다시 관 안으로 들어와 큐 끝에 붙는다 — 묶음이 끝나기 전 20% 구간
        const backIn = clamp((kp - 0.7) / 0.3, 0, 1);
        for (let b = 0; b < balls3.length; b += 1) {
            const B = balls3[b];
            if (B.state === 'flight' && inSet[B.i] !== undefined && cur.retried.some(function (x) { return x.i === B.i; })) {
                if (backIn > 0) {
                    // 큐 끝 자리 = 현재 남은 큐의 마지막
                    const pos = curQueue.length + cur.retried.filter(function (x) { return inSet[x.i] !== undefined && x.i <= B.i; }).length - 1;
                    const q = queueSeat(Math.max(0, pos), curQueue.length + 2);
                    B.tx = lerp(B.tx, q.x, backIn);
                    B.ty = lerp(B.ty, q.y, backIn);
                }
            }
        }
        // 스프링 적분 — 모든 알갱이를 dt 만큼 전진시킨다
        let energy = 0;
        for (let b = 0; b < balls3.length; b += 1) {
            energy += stepSpring(balls3[b], dt);
        }
        // 착지 파문 — 접시에 닿은 알갱이(목표 근처·세로 속도가 큼) 자리에서 동심원이 퍼진다. 파문 크기 = 착지 속도
        for (let b = 0; b < balls3.length; b += 1) {
            const B = balls3[b];
            const w = wave3Els[b];
            if (!w) {
                continue;
            }
            const near = Math.abs(B.ty - B.y) < 10 && Math.abs(B.tx - B.x) < 16;
            const land = near && Math.abs(B.vy) > 60 && (B.state === 'sent' || B.state === 'dropped');
            if (land) {
                w.style.opacity = '1';
                w.dataset.k = '0';
                w.dataset.px = f1(B.tx - 30);
                w.dataset.py = f1(B.ty - 14);
                w.dataset.v = f0(clamp(Math.abs(B.vy) / 8, 20, 60));
            }
            const kk = parseFloat(w.dataset.k || '1');
            if (kk < 1) {
                const nk = kk + dt * 3;
                w.dataset.k = String(nk);
                w.style.opacity = String(0.7 * (1 - nk));
                w.style.transform = 'translate(' + w.dataset.px + 'px,' + w.dataset.py + 'px) scale(' + f2(0.3 + easeOut(nk) * 1.6) + ')';
            }
            else {
                w.style.opacity = '0';
            }
        }
        // 알갱이 그리기 — 속도에서 눌림(squash): 세로 속도가 클수록 납작해진다 (젤리)
        for (let b = 0; b < balls3.length; b += 1) {
            const B = balls3[b];
            const el = ballEls[b];
            const speed = Math.sqrt(B.vx * B.vx + B.vy * B.vy);
            const sq = clamp(1 - speed * 0.06, 0.72, 1);
            const ang = Math.atan2(B.vy, B.vx) * 180 / Math.PI;
            el.style.transform = 'translate(' + f1(B.x - BALL / 2) + 'px, ' + f1(B.y - BALL / 2) + 'px) rotate(' + f0(ang) + 'deg) scale(' + f2(1 + (1 - sq) * 0.6) + ',' + f2(sq) + ')';
            el.setAttribute('data-state', B.state);
            el.setAttribute('data-retry', String(B.retry || 0));
        }
        // 관 진동 — 묶음이 빠져 나갈 때 관이 숨을 쉰다 (남은 큐 길이로부터 계산한 굵기)
        const breathe = clamp(curQueue.length / N3, 0, 1);
        pipeEl.style.transform = 'scaleX(' + f2(1 + 0.08 * Math.sin(kp * Math.PI) * (1 - breathe)) + ')';
        pulse3El.style.opacity = String(kp < 0.45 ? 0.5 * (1 - kp / 0.45) : 0);
        // 명도 전파 — 묶음이 관을 빠져 나가는 동안(kp 0~1 의 sin) 관 속 면과 두 접시 면이 밝아졌다 식는다.
        //    큐가 짧아질수록(breathe 가 작을수록) 관은 더 밝게 — 남은 줄 수가 면의 농도로 보인다
        const pg = Math.sin(kp * Math.PI);
        pipeEl.style.setProperty('--glow', f2(clamp(pg * 0.8 + (1 - breathe) * 0.35, 0, 1)));
        haloEl.style.setProperty('--glow', f2(clamp(pg * 0.9 + (1 - breathe) * 0.3, 0, 1)));
        plateEl.style.setProperty('--glow', f2(clamp(pg * 0.9 + sentCount * 0.04, 0, 1)));
        sideEl.style.setProperty('--glow', f2(clamp(pg * 0.6 + droppedCount * 0.12, 0, 1)));
        // 칩
        if (chip3Els.length === 4) {
            chip3Els[0].textContent = fill('MAX_RETRY {a}', f0(MAX_RETRY));
            chip3Els[1].textContent = fill('PER_BATCH {a}', f0(PER_BATCH));
            chip3Els[2].textContent = fill('retry {a}', f0(retryCount));
            chip3Els[3].textContent = fill('sent {a} · dropped {b}', f0(sentCount), f0(droppedCount));
        }
        return fill('束 {a} · キュー {b} · 送信 {c} · 再試行 {d} · 打ち切り {e}', f0(ph.round + 1), f0(curQueue.length), f0(sentCount), f0(retryCount), f0(droppedCount));
    }
    let seeds3 = 3.1;
    function build3(i) {
        const seeds = [3.1, 5.9, 14.2];
        seeds3 = seeds[i % seeds.length];
        lastT3 = -1;
        draw3(i);
        const spans = [];
        for (let k = 0; k < 3; k += 1) {
            spans.push(spanOf(T3_IN0 + k * (T3_BATCH + T3_GAP), T3_BATCH, k % 3));
        }
        drawRows(spans, 2000);
        axis(2000);
        const r = sim3;
        setReads(fill('MAX_RETRY {a} · PER_BATCH {b} · FAIL_P {c}', f0(MAX_RETRY), f0(PER_BATCH), f2(FAIL_P)),
            fill('八通のうち {a} 通を送り、{b} 通を打ち切り、{c} 回並び直した', f0(r.sent), f0(r.dropped), f0(r.retries)));
        doneP.textContent = '';
        return 2000;
    }
    return run({ count: 3, build: build3, frame: frame3, head: false });
}
})()
