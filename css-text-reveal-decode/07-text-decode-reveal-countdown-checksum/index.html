<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown checksum — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <p class="cc-row">
    <span class="cc-text" aria-live="polite">
      <span class="cc-c">V</span><span class="cc-c">E</span><span class="cc-c">R</span><span class="cc-c">I</span><span class="cc-c">F</span><span class="cc-c">I</span><span class="cc-c">E</span><span class="cc-c">D</span>
    </span>
    <span class="cc-pct">0%</span>
  </p>
</main>
<script>
  var target = "VERIFIED";
  var spans = document.querySelectorAll(".cc-c");
  var pct = document.querySelector(".cc-pct");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var n = 0;
  setInterval(function () {
    n++;
    var filled = reduced ? target.length : Math.min(target.length, Math.floor((n % 50) / 5));
    spans.forEach(function (s, i) {
      s.textContent = i < filled ? target[i] : "_";
      s.classList.toggle("cc-pop", i === filled - 1);
    });
    pct.textContent = Math.round(filled / target.length * 100) + "%";
  }, 90);
</script>
</body>
</html>
