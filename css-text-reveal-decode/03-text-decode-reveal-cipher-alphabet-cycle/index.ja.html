<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cipher alphabet cycle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <p class="ca-text" aria-live="polite">
    <span class="ca-c">U</span><span class="ca-c">N</span><span class="ca-c">L</span><span class="ca-c">O</span><span class="ca-c">C</span><span class="ca-c">K</span>
  </p>
</main>
<script>
  var target = "UNLOCK";
  var spans = document.querySelectorAll(".ca-c");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var offs = [5, 6, 4, 7, 5, 6], cyc = 40;
  var n = 0;
  setInterval(function () {
    n++;
    spans.forEach(function (s, i) {
      var t = reduced ? 0 : (((n - i * 2) % cyc) + cyc) % cyc;
      var left = reduced ? 0 : Math.max(0, offs[i] - Math.floor(t / 2));
      var base = target.charCodeAt(i) - 65;
      s.textContent = String.fromCharCode(65 + (base + left) % 26);
    });
  }, 130);
</script>
</body>
</html>
