<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex byte settle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <p class="hb-text" aria-live="polite">
    <span class="hb-c">A</span><span class="hb-c">C</span><span class="hb-c">C</span><span class="hb-c">E</span><span class="hb-c">S</span><span class="hb-c">S</span>
  </p>
</main>
<script>
  var target = "ACCESS", hex = "0123456789ABCDEF";
  var spans = document.querySelectorAll(".hb-c");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var n = 0;
  setInterval(function () {
    n++;
    var settled = reduced ? target.length : Math.max(0, Math.floor((n % 44) / 5) - 1);
    spans.forEach(function (s, i) {
      var on = i >= target.length - settled;
      s.textContent = on ? target[i] : hex[Math.random() * 16 | 0];
      s.className = on ? "hb-c hb-on" : "hb-c hb-off";
    });
  }, 90);
</script>
</body>
</html>
