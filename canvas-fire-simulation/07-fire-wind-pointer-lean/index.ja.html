<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">

<title>ろうそくと風 — ポインタへ寝る炎 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fw is-demo" id="fwRoot">
  <p class="fw__hint">
    <svg class="fw__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M184 184a32 32 0 0 1-32 32c-13.7 0-26.95-8.93-31.5-21.22a8 8 0 0 1 15-5.56C137.74 195.27 145 200 152 200a16 16 0 0 0 0-32H40a8 8 0 0 1 0-16h112a32 32 0 0 1 32 32m-64-80a32 32 0 0 0 0-64c-13.7 0-26.95 8.93-31.5 21.22a8 8 0 0 0 15 5.56C105.74 60.73 113 56 120 56a16 16 0 0 1 0 32H24a8 8 0 0 0 0 16Zm88-32c-13.7 0-26.95 8.93-31.5 21.22a8 8 0 0 0 15 5.56C193.74 92.73 201 88 208 88a16 16 0 0 1 0 32H32a8 8 0 0 0 0 16h176a32 32 0 0 0 0-64" opacity=".2"/><path d="M184 184a32 32 0 0 1-32 32c-13.7 0-26.95-8.93-31.5-21.22a8 8 0 0 1 15-5.56C137.74 195.27 145 200 152 200a16 16 0 0 0 0-32H40a8 8 0 0 1 0-16h112a32 32 0 0 1 32 32m-64-80a32 32 0 0 0 0-64c-13.7 0-26.95 8.93-31.5 21.22a8 8 0 0 0 15 5.56C105.74 60.73 113 56 120 56a16 16 0 0 1 0 32H24a8 8 0 0 0 0 16Zm88-32c-13.7 0-26.95 8.93-31.5 21.22a8 8 0 0 0 15 5.56C193.74 92.73 201 88 208 88a16 16 0 0 1 0 32H32a8 8 0 0 0 0 16h176a32 32 0 0 0 0-64"/></g></svg>
    <span>ポインターからろうそくへ向かう実際の風ベクトルに炎が寝ます — 近いほど強く</span>
  </p>
  <div class="fw__field" id="fwField" role="application" aria-label="ろうそくの風実験盤" tabindex="0">
    <canvas class="fw__cv" id="fwCv"></canvas>
  </div>
  <div class="fw__bar">
    <span class="fw__meta"><b class="fw__val" id="fwWind">そよ風</b> 風・パーティクル220</span>
    <span class="fw__meta fw__meta--dim">pointermove実測・距離の二乗反比例減衰</span>
  </div>
</div>
</main>
<script>
// 촛불과 風(07). 이 편에서 유일하게 pointermove 실측 입력을 받는 항목이다 —
// 미리보기(자동 재생)는 시드 고정 가상 포인터로 같은 경로를 돌지만, 사람이 손을 올리면
// pointermove 핸들러가 실제 포인터 좌표를 읽어 그 자리에서부터 촛불 심지까지의
// 방향 벡터를 바람으로 쓴다. 세기는 거리 역제곱으로 감쇠 — 손이 가까우면 강풍, 멀면 軽い風.
// 포인터가 판을 떠나거나 2.4초 이상 움직이지 않으면 시드 기반 기본 미풍으로 되돌아간다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형 3종을 만든다 ──
  var N_PART = 220;      // 불꽃 입자 수 — 변형 "파티클 수" 축(240 → 480 기준의 밀도)
  var WIND_MAX = 3.2;    // 風 최대 가속(px/frame^2) — 포인터가 심지에 붙었을 때의 순간 세기
  var FALLOFF = 2.0;     // 거리 감쇠 지수 — 변형 "민감도" 축(1 = 역비례, 2 = 역제곱)
  // ────────────────────────────────────────────────────

  var root = document.getElementById('fwRoot');
  var field = document.getElementById('fwField');
  var cv = document.getElementById('fwCv');
  var ctx = cv.getContext('2d');
  var windOut = document.getElementById('fwWind');

  // 시드 고정 PRNG — mulberry32. 미리보기가 항상 같은 불꽃으로 살아 움직인다
  var SEED = 0x5eed07;
  var prngState = SEED >>> 0;
  function rand() {
    prngState = (prngState + 0x6D2B79F5) >>> 0;
    var t = prngState;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // 색은 CSS 커스텀 프로퍼티(--fire-*)에서 getComputedStyle 로 읽는다 — 파스텔 토큰이 scss 한 곳에
  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK   = tokRGB('--fire-ink');
  var C_AMBER = tokRGB('--fire-amber');
  var C_GOLD  = tokRGB('--fire-gold');
  var C_ROSE  = tokRGB('--fire-rose');
  var C_EMBER = tokRGB('--fire-ember');
  var C_SMOKE = tokRGB('--fire-smoke');

  var TAU = Math.PI * 2;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0;
  var raf = 0, t0 = -1;

  // ── 風 상태 — 포인터 실측값과 자동 미풍이 같은 변수로 합쳐진다 ──
  var windX = 0, windY = 0;          // 현재 風 가속 벡터(px/frame^2)
  var tgtWX = 0, tgtWY = 0;          // 목표 風(감쇠 적용된 값) — lerp 로 부드럽게 좇는다
  var px = -1, py = -1;              // 마지막 실측 포인터(판 좌표). -1 이면 판 밖
  var manualUntil = -1;              // 이 시각(ms)까지는 실측 바람을 쓴다
  var IDLE_MS = 2400;                // 이 이상 조용하면 기본 미풍으로 복귀
  var LOOP_MS = 2000;                // 미리보기 가상 포인터 주기

  // ── 불꽃 입자 — 연료 k(1→0) 를 태우며 심지에서 태어나 부력으로 오른다 ──
  // 바람은 매 프레임 전 입자 가속도에 더해진다. k 가 줄수록 색이 gold→amber→ember 로 식는다.
  var parts = [];
  function spawn() {
    // 심지 위 넓은 분포 — 촛불 심지 폭
    return {
      x: W * 0.5 + (rand() - 0.5) * 10,
      y: H * 0.62,
      vx: (rand() - 0.5) * 0.5,
      vy: -(0.5 + rand() * 0.8),
      k: 0.85 + rand() * 0.15,       // 연료 — 태어날 때 남은 만큼 오래 탄다
      r: 5 + rand() * 5,
      seed: rand() * TAU             // 흔들림 위상 — 입자마다 다른 위상으로 불꽃이 뭉치지 않는다
    };
  }
  for (var i = 0; i < N_PART; i++) {
    var p0 = spawn();
    p0.y = H * 0.62 - rand() * 60;   // 첫 프레임부터 어느 정도 오른 불꽃
    p0.k = rand();
    parts.push(p0);
  }

  // 風 라벨 — 현재 세기를 눈으로 읽게 한다
  function windLabel(mag) {
    if (mag < 0.25) return 'そよ風';
    if (mag < 0.9) return '軽い風';
    if (mag < 1.8) return '強い風';
    return '突風';
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W); cv.height = Math.round(H);
  }

  // ── 포인터 실측 → 風 벡터 ──
  // 방향: 포인터 위치 → 촛불 심지. 포인터가 오른쪽에 있으면 불꽃이 오른쪽에서
  // 불어오는 風(=심지에서 포인터 쪽으로 눕는다)이 아니라, 포인터가 "손"이 되어
  // 심지 쪽으로 바람을 밀어 보낸다. 세기: 거리 역제곱 + 상한 클램프.
  function pointerWind() {
    if (px < 0 || py < 0) return [0, 0];
    var wickX = W * 0.5, wickY = H * 0.62;
    var dx = wickX - px, dy = wickY - py;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 1) return [0, -WIND_MAX];    // 바로 위 — 위로 치솟는다
    var norm = 1 / dist;
    var s = Math.min(WIND_MAX, WIND_MAX * Math.pow(60 / dist, FALLOFF));
    return [dx * norm * s, dy * norm * s];
  }

  // 기본 そよ風 — 시드 고정 노이즈 두 층(느린 파 + 빠른 파)으로 좌우로 살랑인다.
  // rand() 를 프레임마다 소비하면 결정론이 깨지므로 시간의 삼각파로 만든다
  function breeze(tSec) {
    return Math.sin(tSec * 1.1) * 0.16 + Math.sin(tSec * 2.9 + 1.7) * 0.1;
  }

  function draw(tSec) {
    // 심지·초 몸통 — 캔버스에 직접 그린다(정지 부품은 매 프레임 같은 자리)
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgb(' + C_INK[0] + ',' + C_INK[1] + ',' + C_INK[2] + ')';
    ctx.fillRect(0, 0, W, H);

    // 초 몸통 — 연기 톤 둥근 사각(모서리 반경 20px — $r-card 와 같은 값, 캔버스 그리기)
    ctx.fillStyle = 'rgba(' + C_SMOKE[0] + ',' + C_SMOKE[1] + ',' + C_SMOKE[2] + ',0.22)';
    var bodyW = 34, bodyH = 64, bx = W * 0.5 - bodyW / 2, by = H * 0.62;
    ctx.beginPath();
    ctx.moveTo(bx + 20, by);
    ctx.lineTo(bx + bodyW - 20, by);
    ctx.quadraticCurveTo(bx + bodyW, by, bx + bodyW, by + 20);
    ctx.lineTo(bx + bodyW, by + bodyH - 20);
    ctx.quadraticCurveTo(bx + bodyW, by + bodyH, bx + bodyW - 20, by + bodyH);
    ctx.lineTo(bx + 20, by + bodyH);
    ctx.quadraticCurveTo(bx, by + bodyH, bx, by + bodyH - 20);
    ctx.lineTo(bx, by + 20);
    ctx.quadraticCurveTo(bx, by, bx + 20, by);
    ctx.fill();
    // 심지
    ctx.fillStyle = 'rgba(' + C_INK[0] + ',' + C_INK[1] + ',' + C_INK[2] + ',0.8)';
    ctx.fillRect(W * 0.5 - 1.5, H * 0.62 - 10, 3, 10);

    // ── 風 계산 — 실측 우선, 오래 없으면 そよ風 ──
    var now = t0 < 0 ? 0 : performance.now();
    var pw;
    if (t0 >= 0 && now < manualUntil && px >= 0) {
      pw = pointerWind();                    // 실측 pointermove 風
    } else {
      pw = [breeze(tSec), -0.05];            // 기본 そよ風(거의 세로 부력만)
    }
    // 목표를 lerp 로 좇는다 — 바람이 갑자기 튀지 않고 스며든다
    tgtWX = pw[0]; tgtWY = pw[1];
    windX += (tgtWX - windX) * 0.12;
    windY += (tgtWY - windY) * 0.12;
    var mag = Math.sqrt(windX * windX + windY * windY);
    windOut.textContent = windLabel(mag);

    // ── 앙비언트 글로우 — 불꽃이 판 전체에 뿌리는 빛 ──
    // 고정 배경이 아니라 매 프레임 재계산한다: 알파는 플리커(불꽃 에너지의 요동)에 연동돼
    // 펄스 치고, 광원 중심은 바람에 불꽃이 눕는 만큼 치우친다. lighter 로 덧그려 발광처럼 쌓는다.
    var flick = 0.5 + 0.22 * Math.sin(tSec * 3.1) + 0.16 * Math.sin(tSec * 7.3 + 1.1) + 0.08 * Math.sin(tSec * 13.7 + 4.2);
    flick = Math.max(0.12, Math.min(1, flick));
    var ga = 0.18 + 0.34 * flick;
    var gx = W * 0.5 + windX * 9;              // 風 벡터 → 광원 치우침(포인터 실측 그대로 반영)
    var gyc = H * 0.62 - 14;
    var gR = W * 0.62;                          // 캔버스 폭 62% 반경 — 방 전체를 스치는 빛
    var amb = ctx.createRadialGradient(gx, gyc, 0, gx, gyc, gR);
    amb.addColorStop(0, 'rgba(' + C_AMBER[0] + ',' + C_AMBER[1] + ',' + C_AMBER[2] + ',' + ga.toFixed(3) + ')');
    amb.addColorStop(0.55, 'rgba(' + C_AMBER[0] + ',' + C_AMBER[1] + ',' + C_AMBER[2] + ',' + (ga * 0.62).toFixed(3) + ')');
    amb.addColorStop(1, 'rgba(' + C_AMBER[0] + ',' + C_AMBER[1] + ',' + C_AMBER[2] + ',0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = amb;
    ctx.fillRect(0, 0, W, H);

    // ── 입자 물리 — 부력 + 風 + 위상 흔들림 ──
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.k -= 0.012;
      if (p.k <= 0) {
        var np = spawn();
        p.x = np.x; p.y = np.y; p.vx = np.vx; p.vy = np.vy;
        p.k = np.k; p.r = np.r; p.seed = np.seed;
        continue;
      }
      // 부력은 연료가 남은 만큼 — 식으면서 가벼워진다
      p.vy -= 0.018 * p.k;
      // 風 가속 + 입자별 위상 흔들림(불꽃 내부 난류)
      p.vx += windX * 0.014 + Math.sin(tSec * 7 + p.seed) * 0.03;
      p.vy += windY * 0.014;
      // 항력 — 꼬리가 늘어지지 않게
      p.vx *= 0.955; p.vy *= 0.965;
      p.x += p.vx; p.y += p.vy;

      // 색온도 — k 가 1(갓 태어남·gold)에서 0(다 탐·ember)으로
      var cr, cg, cb;
      if (p.k > 0.55) {
        var u1 = (p.k - 0.55) / 0.45;
        cr = C_GOLD[0] + (C_AMBER[0] - C_GOLD[0]) * (1 - u1);
        cg = C_GOLD[1] + (C_AMBER[1] - C_GOLD[1]) * (1 - u1);
        cb = C_GOLD[2] + (C_AMBER[2] - C_GOLD[2]) * (1 - u1);
      } else {
        var u2 = p.k / 0.55;
        cr = C_EMBER[0] + (C_AMBER[0] - C_EMBER[0]) * u2;
        cg = C_EMBER[1] + (C_AMBER[1] - C_EMBER[1]) * u2;
        cb = C_EMBER[2] + (C_AMBER[2] - C_EMBER[2]) * u2;
      }
      var rad = p.r * (0.35 + p.k * 0.65);
      var a = 0.1 + p.k * 0.32;
      // 코어 입자 일부는 로즈 변형 — 파스텔 팔레트의 로즈 톤을 섞어 촛불 특유의 따뜻함
      if (p.seed > 5.4 && p.k > 0.5) {
        cr = C_ROSE[0]; cg = C_ROSE[1]; cb = C_ROSE[2];
      }
      var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad * 2.2);
      g.addColorStop(0, 'rgba(' + (cr | 0) + ',' + (cg | 0) + ',' + (cb | 0) + ',' + a.toFixed(3) + ')');
      g.addColorStop(1, 'rgba(' + (cr | 0) + ',' + (cg | 0) + ',' + (cb | 0) + ',0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad * 2.2, 0, TAU);
      ctx.fill();
    }
    // 심지 광점 — 불꽃 밑동의 밝은 코어
    var wickG = ctx.createRadialGradient(W * 0.5, H * 0.62 - 6, 0, W * 0.5, H * 0.62 - 6, 22);
    wickG.addColorStop(0, 'rgba(' + C_GOLD[0] + ',' + C_GOLD[1] + ',' + C_GOLD[2] + ',0.5)');
    wickG.addColorStop(1, 'rgba(' + C_GOLD[0] + ',' + C_GOLD[1] + ',' + C_GOLD[2] + ',0)');
    ctx.fillStyle = wickG;
    ctx.beginPath();
    ctx.arc(W * 0.5, H * 0.62 - 6, 22, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    // 미리보기 가상 포인터 — 사람 손이 없을 때만(시드 고정 리사주 경로).
    // 실 pointermove 가 들어온 순간(manualUntil 갱신) 이 경로는 끊긴다.
    if (now >= manualUntil) {
      var ph = ((now - t0) % LOOP_MS) / LOOP_MS * TAU;
      px = W * (0.5 + 0.38 * Math.sin(ph));
      py = H * (0.5 + 0.3 * Math.sin(2 * ph + 0.7));
      root.classList.add('is-demo');
    } else {
      root.classList.remove('is-demo');
    }
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  // ── 실사용 pointermove 프로브 — 이 편의 유일한 실측 입력 ──
  // CSS :hover 가 아니라 JS 로 좌표를 읽어 불꽃 입자 가속도에 실시간 반영한다.
  // reduce 모드에선 rAF 루프가 없어 실시간 추적이 무의미하므로 아예 붙이지 않는다(정적 한 장만 남는다).
  if (!reduce) {
    field.addEventListener('pointermove', function (e) {
      var r = field.getBoundingClientRect();
      px = e.clientX - r.left;
      py = e.clientY - r.top;
      if (px < 0 || py < 0 || px > r.width || py > r.height) { px = -1; py = -1; return; }
      manualUntil = performance.now() + IDLE_MS;
      root.classList.remove('is-demo');
    });
    field.addEventListener('pointerleave', function () {
      px = -1; py = -1;
      manualUntil = performance.now() + 600;   // 떠나면 곧 미풍으로
    });
    // 터치 — pointermove 가 touch 에도 같은 이벤트로 온다(touch-action: none 이 스크롤을 막는다)
    field.addEventListener('pointerdown', function (e) {
      var r = field.getBoundingClientRect();
      px = e.clientX - r.left; py = e.clientY - r.top;
      manualUntil = performance.now() + IDLE_MS;
      root.classList.remove('is-demo');
    });
  }
  // 키보드 화살표는 reduce 에서도 최소한으로 남긴다(접근성 — 정적 한 장을 한 번 다시 그리는 것뿐, 루프 아님)
  field.addEventListener('keydown', function (e) {
    var d = { ArrowLeft: [-16, 0], ArrowRight: [16, 0], ArrowUp: [0, -16], ArrowDown: [0, 16] }[e.key];
    if (!d) return;
    e.preventDefault();
    if (px < 0) { px = W * 0.5; py = H * 0.4; }
    px = Math.max(0, Math.min(W, px + d[0]));
    py = Math.max(0, Math.min(H, py + d[1]));
    manualUntil = performance.now() + IDLE_MS;
    root.classList.remove('is-demo');
    if (reduce) draw(0.8);
  });
  window.addEventListener('resize', function () { fit(); if (reduce) draw(0.8); });

  fit();
  if (reduce) {
    // reduce — 루프 없이 風 없는 곧은 불꽃 한 장. pointermove 리스너도 붙이지 않는다.
    root.classList.remove('is-demo');
    root.classList.add('is-still');
    windX = 0; windY = 0;
    draw(0.8);
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
