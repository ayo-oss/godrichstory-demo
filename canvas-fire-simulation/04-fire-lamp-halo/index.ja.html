<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ランプの炎 — ガラスの後ろに広がる後光 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lp is-demo" id="lpRoot">
  <p class="lp__hint">
    <svg class="lp__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M128 24a16 16 0 0 1 16 16v8a80.06 80.06 0 0 1 63.94 63.94h8a16 16 0 0 1 0 32h-8A80.06 80.06 0 0 1 144 207.94v8a16 16 0 0 1-32 0v-8A80.06 80.06 0 0 1 48.06 144h-8a16 16 0 0 1 0-32h8A80.06 80.06 0 0 1 112 48.06v-8A16 16 0 0 1 128 24m-16 57.35V96a16 16 0 0 0 32 0V81.35A48.09 48.09 0 0 0 81.35 112H96a16 16 0 0 0 0-32h14.65M174.65 144H160a16 16 0 0 0 0 32h14.65A48.09 48.09 0 0 0 144 174.65V160a16 16 0 0 0-32 0v14.65A48.09 48.09 0 0 0 81.35 144" opacity=".2"/><path d="M232 128a104 104 1 1 1-104-104a104 104 0 0 1 104 104m-32 0a8 8 0 0 0-8-8h-9.34A56.1 56.1 0 0 0 136 77.34V68a8 8 0 0 0-16 0v9.34A56.1 56.1 0 0 0 77.34 120H68a8 8 0 0 0 0 16h9.34A56.1 56.1 0 0 0 120 179.66V188a8 8 0 0 0 16 0v-8.34A56.1 56.1 0 0 0 178.66 136H192a8 8 0 0 0 8-8m-40 0a32 32 0 1 1-32-32a32 32 0 0 1 32 32m-16 0a16 16 0 1 0-16 16a16 16 0 0 0 16-16"/></g></svg>
    <span>一つの炎から出た光が半径ごとに減衰しながら幾重にも滲みます — ポインターで風を送ります</span>
  </p>
  <div class="lp__field" id="lpField" role="application" aria-label="ランプの炎の後光実験盤" tabindex="0">
    <canvas class="lp__cv" id="lpCv"></canvas>
  </div>
  <div class="lp__bar">
    <span class="lp__meta"><b class="lp__val" id="lpLay">11</b>層の光・減衰指数1.35</span>
    <span class="lp__meta lp__meta--dim">createRadialGradient・lighter合成</span>
  </div>
</div>
</main>
<script>
// 램프 불꽃(04). 불꽃 자체는 작은 파티클 다발(연료 입자가 타올라 부력으로 오르며
// 색온도에 따라 gold→amber→rose 로 식는 시뮬레이션)이고, 장면의 정체는 그 주위에
// createRadialGradient 로 반경별 감쇠 빛 겹(LAYERS 장)을 lighter 로 쌓은 유리 램프 후광이다.
// 포인터 x 는 風 방향(불꽃 기울기·후광 중심 흔들림), y 는 유리 유목 높낮이.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형 3종을 만든다 ──
  var LAYERS = 11;       // 빛 겹 수 — 변형 "빛 겹 수" 축(3 → 9). 04 재튜닝(2026-09-15): 6→11 화면 40%+ 덮게
  var FALLOFF = 1.35;    // 감쇠 지수 — 변형 "감쇠" 축(1.4 → 2.8). 클수록 후광이 유리에 붙는다. 완만하게 낮춤(2.1→1.35)
  var N_PART = 240;      // 불꽃 파티클 수 — 변형 "밀도" 축(70 → 280). 140→240
  // ────────────────────────────────────────────────────

  var root = document.getElementById('lpRoot');
  var field = document.getElementById('lpField');
  var cv = document.getElementById('lpCv');
  var ctx = cv.getContext('2d');
  var layOut = document.getElementById('lpLay');

  // 시드 고정 PRNG — mulberry32. 미리보기가 항상 같은 불꽃으로 살아 움직인다
  var SEED = 0x5eed04;
  var prngState = SEED >>> 0;
  function rand() {
    prngState = (prngState + 0x6D2B79F5) >>> 0;
    var t = prngState;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // 색은 CSS 커스텀 프로퍼티(--fire-*)에서 getComputedStyle 로 읽는다 — 파스텔 토큰이 scss 한 곳에
  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK   = tokRGB('--fire-ink');
  var C_AMBER = tokRGB('--fire-amber');
  var C_GOLD  = tokRGB('--fire-gold');
  var C_ROSE  = tokRGB('--fire-rose');
  var C_EMBER = tokRGB('--fire-ember');
  var C_SMOKE = tokRGB('--fire-smoke');

  var TAU = Math.PI * 2;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0;
  var raf = 0, t0 = -1;
  var px01 = 0.5, py01 = 0.5;   // 가상 風/유목 포인터(0..1)
  var manual = false;

  // ── 불꽃 파티클 — 연료 입자가 심지에서 태어나 부력으로 오르며 식는다 ──
  // 각 입자는 연료 k(1→0) 를 갖고, k 가 줄수록 반경이 줄고 색이 gold→amber→ember 로 내려간다.
  var parts = [];
  function spawn(p) {
    p.x = (rand() - 0.5) * 7;            // 심지 폭 안 (px)
    p.y = 0;                             // 심지 끝에서 출발
    p.vx = (rand() - 0.5) * 6;
    p.vy = -18 - rand() * 26;            // 부력 — 위로 (px/s)
    p.k = 1;                             // 연료(열). 매초 K_BURN 닳는다
    p.ph = rand() * TAU;                 // 개별 흔들림 위상
  }
  for (var i = 0; i < N_PART; i++) {
    var p = {}; spawn(p); p.y = -rand() * 34; p.k = rand();  // 첫 프레임부터 불꽃이 차 있는 상태로
    parts.push(p);
  }

  var K_BURN = 1.35;     // 연료 소모율 (1/s). 재튜닝: 2.2→1.35 — 입자가 오래 타서 후광이 잔류한다
  var STILL_T = 1.85;    // reduce 에서 그리는 시각 — 후광이 가장 읽히는 한 장

  function draw(tSec, dt) {
    // 1) 무대 — 유리 등 몸통과 받침을 잉크 톤으로 잡아둔다
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgb(' + C_INK[0] + ',' + C_INK[1] + ',' + C_INK[2] + ')';
    ctx.fillRect(0, 0, W, H);

    var cx = W * 0.5, ground = H * 0.78;
    var wind = (px01 - 0.5) * 2;          // -1..1 — 포인터 x
    var lift = (py01 - 0.5) * 2;          // -1..1 — 포인터 y(유목 높이)

    // ── 2) 빛 겹(LAYERS 장) — 반경별 감쇠 후광. 겹마다 반지름이 커지고 알파는 지수로 줄어든다 ──
    // lighter 합성이라 겹친 곳은 더해져 밝아진다 — 유리 안에서 빛이 차오르는 이유.
    // 불꽃 밝기(살아 있는 연료 총합)로 전체 후광 세기를 구면, 램프가 "숨쉬는" 느낌이 계산에서 나온다.
    var flick = 0;
    for (var f = 0; f < N_PART; f++) flick += parts[f].k;
    flick = flick / N_PART;               // 0..1 — 현재 연료 평균 = 불꽃 세기
    // 재튜닝: 호흡 변조 추가 — 반경 자체가 느리게 부풀었다 줄어들어 후광 경계가 화면을 쓴다
    var breathe = (0.72 + 0.28 * flick) * (0.90 + 0.10 * Math.sin(tSec * 1.9));

    // 유리 등 병(램프 유목) — 반경 감쇠 원 3장으로 어두운 유리 실루엣을 먼저 얹는다
    ctx.globalCompositeOperation = 'lighter';
    for (var g = 0; g < 3; g++) {
      var gr = (0.10 + g * 0.045) * Math.min(W, H) * breathe;
      var gg = ctx.createRadialGradient(cx, ground - gr * 0.9, gr * 0.05, cx, ground - gr * 0.9, gr);
      var ga = 0.05 * (1 - g * 0.28);
      gg.addColorStop(0, 'rgba(' + C_SMOKE[0] + ',' + C_SMOKE[1] + ',' + C_SMOKE[2] + ',' + ga + ')');
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(cx - gr, ground - gr * 1.9, gr * 2, gr * 2);
    }

    // ── 빛 겹 LAYERS 장 — 이 항목의 주인공 ──
    // 겹 i: 반지름 R_i — 앞쪽은 촘촘히(밝은 코어), 바깥쪽은 성기게(넓게 퍼진다), 마지막 겹은 대각선 끝까지
    //      알파  a_i = max(바닥알파, A0 * (R0 / R_i)^FALLOFF) — 가장 바깥 겹도 문턱 아래로 죽지 않는다
    // 중심은 불꽃 실제 위치(바람에 기울어진)를 따라간다 → 후광이 불꽃을 쫓는다
    var hx = cx + wind * 26;                                          // 재튜닝: 風 게인 8→26 — 후광 중심이 실제로 이동
    var hy = ground - 26 - lift * 10 + Math.sin(tSec * 1.7) * 5;      // 재튜닝: 수직 흔들림 증폭
    var R0 = Math.min(W, H) * 0.11 * breathe;
    var A0 = 0.52 * (0.8 + 0.2 * flick) * (0.86 + 0.14 * Math.sin(tSec * 2.6 + 1.1));  // 재튜닝: 알파도 느리게 맥동
    var RMAX = Math.hypot(W, H) * 0.98;    // 재튜닝: 마지막 겹이 대각선 끝까지 닿게 — 화면 40%+ 커버
    for (var L = 0; L < LAYERS; L++) {
      var Lt = L / Math.max(1, LAYERS - 1);                    // 0..1
      var R = R0 + (RMAX - R0) * Math.pow(Lt, 0.72);           // 앞은 촘촘, 뒤는 성기게 — 코어는 밝게 유지하며 넓게 퍼진다
      var a = Math.max(0.06, A0 * Math.pow(R0 / R, FALLOFF));  // 바닥알파 0.06 — 가장 바깥 겹도 은은하게 남는다
      // 안쪽 겹은 불꽃온도(gold), 바깥 겹은 실내 온도(rose)로 색이 식는다
      var mixk = L / Math.max(1, LAYERS - 1);
      var lr = C_GOLD[0] + (C_ROSE[0] - C_GOLD[0]) * mixk;
      var lg = C_GOLD[1] + (C_ROSE[1] - C_GOLD[1]) * mixk;
      var lb = C_GOLD[2] + (C_ROSE[2] - C_GOLD[2]) * mixk;
      var rg = ctx.createRadialGradient(hx, hy, R * 0.04, hx, hy, R);
      rg.addColorStop(0, 'rgba(' + (lr | 0) + ',' + (lg | 0) + ',' + (lb | 0) + ',' + a.toFixed(3) + ')');
      rg.addColorStop(0.72, 'rgba(' + (lr | 0) + ',' + (lg | 0) + ',' + (lb | 0) + ',' + (a * 0.6).toFixed(3) + ')');
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(hx - R, hy - R, R * 2, R * 2);
    }

    // ── 3) 불꽃 파티클 — 연료 k 로 크기·색을 계산해 그린다 ──
    // 風: vx += wind * 22 * dt — 포인터가 불꽃을 실제로 눕힌다
    // 개별 흔들림: sin(t*7 + ph) * 9 — 촛불 떨림(시드 고정이라 항상 같은 결)
    for (var j = 0; j < N_PART; j++) {
      var q = parts[j];
      q.k -= K_BURN * dt;
      if (q.k <= 0) { spawn(q); continue; }
      var sway = Math.sin(tSec * 7 + q.ph) * 9 * q.k;
      var fx = cx + q.x + q.vx * q.k + sway + wind * (1 - q.k) * 30;
      var fy = ground + q.y * q.k - (1 - q.k) * lift * 8;
      var fy2 = ground + (q.y + q.vy * dt) * (q.k - K_BURN * dt);
      q.x += q.vx * dt; q.y += q.vy * dt;
      // 색온도 사다리 — k 가 1(갓 태어남·gold) → 0(다 탐·ember) 로 내려간다
      var rC, gC, bC, rad;
      if (q.k > 0.66) {
        var m1 = (q.k - 0.66) / 0.34;
        rC = C_GOLD[0] + (C_GOLD[0] - C_GOLD[0]) * m1; gC = C_GOLD[1]; bC = C_GOLD[2];
        rad = 2.2 + 1.6 * m1;
      } else if (q.k > 0.33) {
        var m2 = (q.k - 0.33) / 0.33;
        rC = C_GOLD[0] + (C_AMBER[0] - C_GOLD[0]) * m2;
        gC = C_GOLD[1] + (C_AMBER[1] - C_GOLD[1]) * m2;
        bC = C_GOLD[2] + (C_AMBER[2] - C_GOLD[2]) * m2;
        rad = 1.8 + 0.4 * m2;
      } else {
        var m3 = q.k / 0.33;
        rC = C_AMBER[0] + (C_EMBER[0] - C_AMBER[0]) * (1 - m3);
        gC = C_AMBER[1] + (C_EMBER[1] - C_AMBER[1]) * (1 - m3);
        bC = C_AMBER[2] + (C_EMBER[2] - C_AMBER[2]) * (1 - m3);
        rad = 1.0 + 0.8 * m3;
      }
      ctx.fillStyle = 'rgba(' + (rC | 0) + ',' + (gC | 0) + ',' + (bC | 0) + ',' + (0.16 + 0.5 * q.k).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(fx, fy, rad, 0, TAU);
      ctx.fill();
    }

    // ── 4) 심지와 받침 — 면 계산(source-over)으로 마감 ──
    ctx.globalCompositeOperation = 'source-over';
    // 심지
    ctx.strokeStyle = 'rgba(' + C_SMOKE[0] + ',' + C_SMOKE[1] + ',' + C_SMOKE[2] + ',0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx + wind * 2, ground + 10);
    ctx.lineTo(cx + wind * 5, ground - 6);
    ctx.stroke();
    // 받침 접시 — 타원
    ctx.fillStyle = 'rgba(' + C_EMBER[0] + ',' + C_EMBER[1] + ',' + C_EMBER[2] + ',0.55)';
    ctx.beginPath();
    ctx.ellipse(cx, ground + 12, 26, 6, 0, 0, TAU);
    ctx.fill();
    // 유리 병 외곽선 — 연기 톤 아치(후광 위에 살짝)
    ctx.strokeStyle = 'rgba(' + C_SMOKE[0] + ',' + C_SMOKE[1] + ',' + C_SMOKE[2] + ',0.30)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(cx, ground - 14, 30, 38, wind * 0.06, 0, TAU);
    ctx.stroke();
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W); cv.height = Math.round(H);
    layOut.textContent = String(LAYERS);
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    var dt = Math.min(0.05, (now - (frame.prev || now)) / 1000);
    frame.prev = now;
    if (!manual) {
      // 미리보기 가상 風 — 시드 고정 Lissajous. x 가 風, y 가 유목 높이
      // 재튜닝: 진폭 확대(0.42→0.46, 0.30→0.34) — 후광이 무대 좌우를 넓게 쓸게
      var ph = t * TAU / 3.2;
      px01 = 0.5 + 0.46 * Math.sin(ph + 0.4);
      py01 = 0.5 + 0.34 * Math.sin(2 * ph + 0.7);
    }
    draw(t, dt);
    raf = requestAnimationFrame(frame);
  }

  field.addEventListener('pointermove', function (e) {
    var r = field.getBoundingClientRect();
    px01 = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    py01 = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    if (!manual) { manual = true; root.classList.remove('is-demo'); }
    if (reduce) { px01 = px01; draw(STILL_T, 0.016); }
  });
  field.addEventListener('pointerleave', function () {
    if (manual) { px01 = 0.5; py01 = 0.5; }
  });
  field.addEventListener('keydown', function (e) {
    var d = { ArrowLeft: [-0.07, 0], ArrowRight: [0.07, 0], ArrowUp: [0, -0.06], ArrowDown: [0, 0.06] }[e.key];
    if (!d) return;
    e.preventDefault();
    if (!manual) { manual = true; root.classList.remove('is-demo'); }
    px01 = Math.max(0, Math.min(1, px01 + d[0]));
    py01 = Math.max(0, Math.min(1, py01 + d[1]));
    if (reduce) draw(STILL_T, 0.016);
  });
  window.addEventListener('resize', function () { fit(); if (reduce) draw(STILL_T, 0.016); });

  fit();
  if (reduce) {
    // reduce — rAF 를 돌리지 않고 후광이 가장 읽히는 한 장만 그린다
    draw(STILL_T, 0);
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
