<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>フィルターチップ削除と隣接詰め</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="chips" id="chips" role="list" aria-label="適用中のフィルター">
    <span class="chip" role="listitem" data-label="レディース">
      <span class="chip__label">レディース</span>
      <button class="chip__x" type="button" aria-label="レディースフィルターを解除">
        <svg viewBox="0 0 256 256" width="12" height="12" aria-hidden="true"><g fill="currentColor"><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg>
      </button>
    </span>
    <span class="chip" role="listitem" data-label="ブルー">
      <span class="chip__label">ブルー</span>
      <button class="chip__x" type="button" aria-label="ブルーフィルターを解除">
        <svg viewBox="0 0 256 256" width="12" height="12" aria-hidden="true"><g fill="currentColor"><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg>
      </button>
    </span>
    <span class="chip" role="listitem" data-label="M">
      <span class="chip__label">M</span>
      <button class="chip__x" type="button" aria-label="Mフィルターを解除">
        <svg viewBox="0 0 256 256" width="12" height="12" aria-hidden="true"><g fill="currentColor"><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg>
      </button>
    </span>
    <span class="chip" role="listitem" data-label="セール">
      <span class="chip__label">セール</span>
      <button class="chip__x" type="button" aria-label="セールフィルターを解除">
        <svg viewBox="0 0 256 256" width="12" height="12" aria-hidden="true"><g fill="currentColor"><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg>
      </button>
    </span>
  </div>
</main>
<script>
// 칩 하나를 지우면 남은 칩들의 실측 폭(getBoundingClientRect)과 사이 간격(gap)을 다시 더해 컨테이너 폭을 그 값으로 옮긴다(transition).
// 실사용 클릭 리스너 있음 + 캡처용으로 같은 제거·추가 함수를 2초 주기로 되풀이한다.
(function () {
  var GAP_PX = 8;
  var row = document.getElementById('chips');
  if (!row) return;

  function recompute() {
    var chips = row.querySelectorAll('.chip');
    var total = 0;
    chips.forEach(function (chip, i) {
      total += chip.getBoundingClientRect().width;
      if (i > 0) total += GAP_PX;
    });
    row.style.width = total + 'px';
  }

  function buildChip(label) {
    var chip = document.createElement('span');
    chip.className = 'chip';
    chip.setAttribute('role', 'listitem');
    chip.dataset.label = label;
    var text = document.createElement('span');
    text.className = 'chip__label';
    text.textContent = label;
    var btn = document.createElement('button');
    btn.className = 'chip__x';
    btn.type = 'button';
    btn.setAttribute('aria-label', label + ' フィルター解除');
    btn.innerHTML = '<svg viewBox="0 0 256 256" width="12" height="12" aria-hidden="true"><g fill="currentColor"><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg>';
    chip.appendChild(text);
    chip.appendChild(btn);
    return chip;
  }

  function removeChip(chip) {
    if (!chip) return null;
    var label = chip.dataset.label || '';
    chip.remove();
    recompute();
    return label;
  }

  function addChip(label) {
    var chip = buildChip(label);
    row.appendChild(chip);
    recompute();
  }

  row.addEventListener('click', function (e) {
    var btn = e.target.closest('.chip__x');
    if (!btn) return;
    removeChip(btn.closest('.chip'));
  });

  requestAnimationFrame(recompute);

  // 자동 시연: 마지막 칩을 지웠다가 되돌리는 2초 주기 반복 (실제 리스너와 같은 함수를 재사용)
  (function loop() {
    setTimeout(function () {
      var last = row.querySelector('.chip:last-child');
      var label = removeChip(last);
      setTimeout(function () {
        if (label) addChip(label);
        setTimeout(loop, 700);
      }, 650);
    }, 350);
  })();
})();
</script>
</body>
</html>
