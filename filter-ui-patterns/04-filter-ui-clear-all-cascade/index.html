<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>필터 전체 해제 캐스케이드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="chips is-demo" id="chips">
    <span class="chip is-active" style="--i:0">여성</span>
    <span class="chip is-active" style="--i:1">블루</span>
    <span class="chip is-active" style="--i:2">M 사이즈</span>
    <span class="chip is-active" style="--i:3">세일</span>
  </div>
  <button class="clear-btn" id="clearBtn" type="button">전체 해제</button>
</main>
<script>
// 칩의 순서(index) 값에 고정 간격(ms)을 곱해 사라지는 시작 시점을 다시 구한다.
// 실제 클릭: 칩마다 그 시점에 classList.remove 로 is-active 를 떼면 opacity 전환이 순서대로 일어난다.
// 데모 루프는 같은 계산을 CSS animation-delay 로 옮겨 무한 반복한다.
(function () {
  var STAGGER_MS = 90;
  var chips = document.getElementById('chips');
  var clearBtn = document.getElementById('clearBtn');
  if (!chips || !clearBtn) return;

  clearBtn.addEventListener('click', function () {
    chips.classList.remove('is-demo');
    var items = chips.querySelectorAll('.chip');
    items.forEach(function (chip, i) {
      setTimeout(function () {
        chip.classList.remove('is-active');
      }, i * STAGGER_MS);
    });
  });
})();
</script>
</body>
</html>
