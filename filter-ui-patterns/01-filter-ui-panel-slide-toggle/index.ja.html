<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>フィルターパネルのスライド開閉</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage" id="stage">
  <button class="trigger" id="trigger" type="button" aria-expanded="false" aria-controls="panel">
    フィルターを開く
  </button>
  <aside class="panel is-demo" id="panel" aria-hidden="true">
    <p class="panel__title">フィルター</p>
    <div class="panel__row">
      <span class="chip">カラー</span>
      <span class="chip">サイズ</span>
    </div>
    <div class="panel__row">
      <span class="chip">価格帯</span>
      <span class="chip">素材</span>
    </div>
  </aside>
</main>
<script>
// フィルター 패널 열림·닫힘을 하나의 불(boolean) 값으로만 들고, 그 값을 transform 위치(0 또는 -100%)로 바꿔 CSS transition 이 보간한다.
// 계산 겹: 열림 여부 → translateX 보간(transition). 실사용 클릭 리스너 있음.
(function () {
  var stage = document.getElementById('stage');
  var trigger = document.getElementById('trigger');
  var panel = document.getElementById('panel');
  if (!stage || !trigger || !panel) return;

  function setOpen(open) {
    stage.classList.toggle('is-open', open);
    trigger.setAttribute('aria-expanded', String(open));
    panel.setAttribute('aria-hidden', String(!open));
  }

  trigger.addEventListener('click', function () {
    panel.classList.remove('is-demo');
    setOpen(!stage.classList.contains('is-open'));
  });
})();
</script>
</body>
</html>
