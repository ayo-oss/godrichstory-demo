<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>필터 적용 바 스티키 등장</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage" id="stage">
  <div class="options">
    <label class="option"><input class="option__input" type="checkbox" data-idx="0"> 무료 배송</label>
    <label class="option"><input class="option__input" type="checkbox" data-idx="1"> 당일 출고</label>
  </div>
  <div class="apply-bar is-demo" id="bar">
    <span class="apply-bar__label">2개 선택됨</span>
    <button class="apply-bar__btn" type="button">적용하기</button>
  </div>
</main>
<script>
// 필터가 하나라도 선택되어 있는지(불 값)만 보고 바 위치를 translateY 로 보간한다.
// 실제 체크박스 변경: classList.toggle 로 has-selection 상태를 뒤집는다.
(function () {
  var stage = document.getElementById('stage');
  var bar = document.getElementById('bar');
  var inputs = document.querySelectorAll('.option__input');
  if (!stage || !bar || !inputs.length) return;

  function sync() {
    bar.classList.remove('is-demo');
    var any = Array.prototype.some.call(inputs, function (input) {
      return input.checked;
    });
    stage.classList.toggle('has-selection', any);
  }

  inputs.forEach(function (input) {
    input.addEventListener('change', sync);
  });
})();
</script>
</body>
</html>
