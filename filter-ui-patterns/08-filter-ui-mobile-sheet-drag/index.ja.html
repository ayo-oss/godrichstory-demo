<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>フィルターモバイルシートドラッグ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage" id="stage">
  <div class="sheet is-demo" id="sheet">
    <button class="sheet__handle" id="handle" type="button" aria-label="シートをドラッグして閉じる"></button>
    <p class="sheet__title">フィルター</p>
    <div class="sheet__row">ブランド</div>
    <div class="sheet__row">価格帯</div>
  </div>
</main>
<script>
// 포인터가 움직인 거리(px)를 --drag 커스텀 속성에 담고, transform 은 CSS clamp() 로 0~최대값 사이만 움직이게 묶는다.
// 실제 드래그: pointerdown·pointermove·pointerup. 데모는 같은 --drag 값을 시드 고정 시퀀스로 흔들어 재생한다.
(function () {
  var sheet = document.getElementById('sheet');
  var handle = document.getElementById('handle');
  if (!sheet || !handle) return;

  var MAX_DRAG = 130;
  var dragging = false;
  var startY = 0;

  function setDrag(px) {
    sheet.style.setProperty('--drag', Math.max(0, Math.min(MAX_DRAG, px)) + 'px');
  }

  handle.addEventListener('pointerdown', function (e) {
    dragging = true;
    startY = e.clientY;
    sheet.classList.remove('is-demo');
    sheet.classList.add('is-dragging');
    handle.setPointerCapture(e.pointerId);
  });

  handle.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    setDrag(e.clientY - startY);
  });

  function release() {
    if (!dragging) return;
    dragging = false;
    sheet.classList.remove('is-dragging');
    setDrag(0);
  }
  handle.addEventListener('pointerup', release);
  handle.addEventListener('pointercancel', release);

  // 자동 시연: 사람 드래그와 같은 --drag 값을 고정 시퀀스로 움직인다 (실제 pointermove 는 보내지 않는다)
  function ease(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function autoLoop(ts) {
    if (!sheet.classList.contains('is-demo')) return;
    var t = (ts % 2000) / 2000;
    var px = t < .5 ? ease(t / .5) * MAX_DRAG : (1 - ease((t - .5) / .5)) * MAX_DRAG;
    setDrag(px);
    requestAnimationFrame(autoLoop);
  }
  requestAnimationFrame(autoLoop);
})();
</script>
</body>
</html>
