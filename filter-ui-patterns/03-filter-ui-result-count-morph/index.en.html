<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>Filter Result Count Morph</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="card">
    <p class="card__label">Search results</p>
    <p class="card__count" id="count" role="status" aria-live="polite">128 items</p>
  </div>
</main>
<script>
// 결과 수가 바뀔 때 이전 값과 새 값의 차이를 requestAnimationFrame 으로 나눠 화면 숫자를 그 사이 값으로 다시 그린다(textContent).
// 자동 시연만, 실사용 리스너 없음.
(function () {
  var el = document.getElementById('count');
  if (!el) return;

  var VALUES = [128, 47, 283, 128];
  var STEP_MS = 900;
  var HOLD_MS = 350;
  var idx = 0;
  var from = VALUES[0];

  function ease(t) { return 1 - Math.pow(1 - t, 3); }

  function animate(to, duration) {
    var start = null;
    function frame(ts) {
      if (start === null) start = ts;
      var t = Math.min(1, (ts - start) / duration);
      var value = Math.round(from + (to - from) * ease(t));
      el.textContent = value + 'items';
      el.style.setProperty('--pulse', (1 - t).toFixed(3));
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        from = to;
        setTimeout(step, HOLD_MS);
      }
    }
    requestAnimationFrame(frame);
  }

  function step() {
    idx = (idx + 1) % VALUES.length;
    animate(VALUES[idx], STEP_MS);
  }

  setTimeout(step, HOLD_MS);
})();
</script>
</body>
</html>
