<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>필터 카테고리 트리 펼침</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="tree">
    <button class="tree__toggle" id="toggle" type="button" aria-expanded="false" aria-controls="list">
      <svg class="tree__caret" viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg>
      카테고리
    </button>
    <ul class="tree__list is-demo" id="list">
      <li>여성 의류 (128)</li>
      <li>남성 의류 (86)</li>
      <li>액세서리 (42)</li>
    </ul>
  </div>
</main>
<script>
// 하위 목록의 실제 렌더 높이(scrollHeight)를 재서 --tree-height 로 저장(setProperty)해 두고,
// 펼침 상태는 그 값을 height 로 삼아 transition·keyframe 이 0 에서 그 값까지 보간한다.
// 실제 클릭: aria-expanded 를 뒤집고 목록을 펼치거나 접는다.
(function () {
  var toggle = document.getElementById('toggle');
  var list = document.getElementById('list');
  if (!toggle || !list) return;

  function measure() {
    list.style.setProperty('--tree-height', list.scrollHeight + 'px');
  }
  measure();

  toggle.addEventListener('click', function () {
    list.classList.remove('is-demo');
    measure();
    var open = list.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', String(open));
  });

  window.addEventListener('resize', measure);
})();
</script>
</body>
</html>
