<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>필터 가격 범위 채움</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="range">
    <div class="range__track">
      <div class="range__fill" id="fill"></div>
    </div>
    <input class="range__input" id="minInput" type="range" min="0" max="100" step="1" value="20" aria-label="최소 가격">
    <input class="range__input" id="maxInput" type="range" min="0" max="100" step="1" value="70" aria-label="최대 가격">
  </div>
  <div class="range__labels">
    <span id="minLabel">20,000원</span>
    <span id="maxLabel">70,000원</span>
  </div>
</main>
<script>
// 최소·최대 두 입력값의 차이를 퍼센트 좌표로 다시 구해 calc() 로 채움 막대의 양 끝(left·right)을 그린다.
// 실제 입력: input[type=range] 의 input 이벤트. 데모는 시드 고정 값 쌍을 순서대로 재생한다.
(function () {
  var minInput = document.getElementById('minInput');
  var maxInput = document.getElementById('maxInput');
  var fill = document.getElementById('fill');
  var minLabel = document.getElementById('minLabel');
  var maxLabel = document.getElementById('maxLabel');
  if (!minInput || !maxInput || !fill) return;

  function priceLabel(v) {
    return (v * 1000).toLocaleString('ko-KR') + '원';
  }

  function update() {
    var minV = Number(minInput.value);
    var maxV = Number(maxInput.value);
    if (minV > maxV) { var t = minV; minV = maxV; maxV = t; }
    fill.style.setProperty('--min-pct', minV);
    fill.style.setProperty('--max-pct', maxV);
    if (minLabel) minLabel.textContent = priceLabel(minV);
    if (maxLabel) maxLabel.textContent = priceLabel(maxV);
  }

  minInput.addEventListener('input', update);
  maxInput.addEventListener('input', update);
  update();

  // 자동 시연: 실제 input 이벤트 대신 시드 고정 값 쌍을 순서대로 넣는다
  var SEQ = [[20, 70], [5, 40], [55, 95], [20, 70]];
  var idx = 0;
  (function step() {
    setTimeout(function () {
      idx = (idx + 1) % SEQ.length;
      minInput.value = String(SEQ[idx][0]);
      maxInput.value = String(SEQ[idx][1]);
      update();
      step();
    }, 550);
  })();
})();
</script>
</body>
</html>
