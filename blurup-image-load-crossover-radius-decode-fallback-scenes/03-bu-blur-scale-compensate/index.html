<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블러 팽창만큼 스케일을 역산해 보정하는 장면 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, 왼쪽·오른쪽 방향키로 다른 값으로">
      <div class="ez__scene" data-role="scene" role="img" aria-label="blur 로 바깥으로 번지는 만큼 스케일을 키웠다가 줄이며 되돌려 두 카드의 가장자리가 갈라지는 장면"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">장면 준비</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
    // ── 525 블러업 공통 — 무대 좌표·문구 틀·요소 조립·이미지 소재·블러업 엔진 (524 core.ts 계승)
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    // ── 무대 요소
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // 장면 안 요소를 만든다. 클래스는 cx 를 거쳐 CSS 모듈 이름으로 바뀐다
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        // clkEl(시계)은 sceneEl 에 직접 붙어 있으므로 래퍼만 비운다 — 시계를 지우면 렌더 시계가 죽는다
        scWrap.textContent = '';
        chartEl.textContent = '';
        probeEl.textContent = '';
    }
    // 정점 오프셋 — 시드 해시(재생해도 같은 값). Math.random 을 쓰지 않는다
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    // ── 엔진이 푼 시간 읽기 — getAnimations() 값
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function spanOf(d, dur) { return { s: d, e: d + dur, k: 0 }; }
    // ── 아래 차트 상자 그리기
    function bar(cls, x, y, w, h) {
        const e = make('i', cls, chartEl);
        put(e, x, y, w, h);
        return e;
    }
    function drawRows(segs, max) {
        const n = segs.length;
        const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
        const out = [];
        for (let i = 0; i < n; i += 1) {
            const sg = segs[i];
            const x = CX0 + clamp(sg.s, 0, max) / max * CW;
            const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
            out.push(bar('bar k0', x, 5 + i * (h + 1), w, h));
        }
        return out;
    }
    function axis(max) {
        const a = make('b', 'ax', chartEl);
        a.textContent = '0';
        put(a, CX0, 40, 0, 0);
        const b = make('b', 'ax ax--r', chartEl);
        b.textContent = f0(max) + 'ms';
        put(b, CX0 + CW - 60, 40, 60, 0);
    }
    let headEl = null;
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    // ── 블러업 공통 조각
    // blurRadius — 지수 감쇠 R = R0 x e^(-DECAY_RATE x t). 02 의 주역이고 다른 항목도 같은 곡선을 쓴다
    function blurRadius(r0, rate, t) {
        return r0 * Math.exp(-rate * t / 1000);
    }
    // backSolve — blur 가 바깥으로 번지는(edge bleed) 반경만큼 스케일을 키우는 역산 보정.
    //   R=20px 일 때 1.05 가 되도록 EDGE_K=400: scale = 1 + R/400
    const EDGE_K = 400;
    function backSolve(r) { return 1 + r / EDGE_K; }
    // progress — 로드 진행도 0~1. delay 뒤 cross_ms 걸쳐 0→1 (01·04·05·06·07 공용)
    function progress(t, delay, crossMs) {
        return clamp((t - delay) / crossMs, 0, 1);
    }
    // ringArc — 원호 길이 = 둘레 x 퍼센트/100 (04). stroke-dashoffset = C - 호길이
    function ringArc(circ, pct) { return circ * clamp(pct, 0, 100) / 100; }
    // ── 이미지 소재 — SVG 문자열 3종 (data URI · 외부 URL 0 · FLUX 없음)
    //   산(morning)·숲(forest)·밤하늘(night). 그라디언트+원+시드 점 — 저해상도 썸네일과 같은 소스
    const SVG_W = 448;
    const SVG_H = 156;
    function svgMountains() {
        const dots = [];
        for (let i = 0; i < 26; i += 1) {
            const h1 = seedHash(i, 3);
            const h2 = seedHash(i, 11);
            dots.push('<circle cx="' + f1(20 + h1 * 408) + '" cy="' + f1(96 + h2 * 52) + '" r="' + f1(1.2 + h1 * 2.2) + '" fill="#f3e8d8" opacity="' + f2(0.5 + h2 * 0.4) + '"/>');
        }
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 156">' +
            '<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0" stop-color="#f6e3cf"/><stop offset="0.62" stop-color="#efd3c8"/>' +
            '<stop offset="0.63" stop-color="#8fb9a8"/><stop offset="1" stop-color="#6da08f"/></linearGradient></defs>' +
            '<rect width="448" height="156" fill="url(#sky)"/>' +
            '<circle cx="326" cy="44" r="22" fill="#f8d9a8" opacity="0.9"/>' +
            '<path d="M0,100 L84,52 L150,98 L226,44 L312,100 L390,64 L448,96 L448,156 L0,156 Z" fill="#5f8f7f"/>' +
            '<path d="M0,122 L96,88 L188,124 L280,92 L372,126 L448,102 L448,156 L0,156 Z" fill="#4a7a6b"/>' +
            dots.join('') + '</svg>';
    }
    function svgForest() {
        const trees = [];
        for (let i = 0; i < 14; i += 1) {
            const h1 = seedHash(i, 5);
            const x = 12 + i * 31 + h1 * 10;
            const hh = 46 + h1 * 42;
            const tone = ['#a8cdb8', '#96c0aa', '#88b59d'][i % 3];
            trees.push('<path d="M' + f0(x) + ',140 L' + f0(x - 14) + ',140 L' + f0(x) + ',' + f0(140 - hh) + ' L' + f0(x + 14) + ',140 Z" fill="' + tone + '"/>');
        }
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 156">' +
            '<defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0" stop-color="#e9f0e4"/><stop offset="1" stop-color="#d3e2cf"/></linearGradient></defs>' +
            '<rect width="448" height="156" fill="url(#fg)"/>' +
            '<circle cx="86" cy="40" r="18" fill="#f5e6c4" opacity="0.95"/>' +
            trees.join('') + '<rect y="140" width="448" height="16" fill="#b9d0b2"/></svg>';
    }
    function svgNight() {
        const stars = [];
        for (let i = 0; i < 40; i += 1) {
            const h1 = seedHash(i, 13);
            const h2 = seedHash(i, 17);
            stars.push('<circle cx="' + f1(h1 * 444) + '" cy="' + f1(h2 * 108) + '" r="' + f1(0.7 + h1 * 1.4) + '" fill="#f6f0e4" opacity="' + f2(0.35 + h2 * 0.55) + '"/>');
        }
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 156">' +
            '<defs><linearGradient id="ng" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0" stop-color="#3d4266"/><stop offset="0.7" stop-color="#565f85"/>' +
            '<stop offset="1" stop-color="#7a7fa0"/></linearGradient></defs>' +
            '<rect width="448" height="156" fill="url(#ng)"/>' +
            '<path d="M0,132 Q112,108 224,128 T448,124 L448,156 L0,156 Z" fill="#333a5c"/>' +
            '<circle cx="356" cy="38" r="15" fill="#efe6cf" opacity="0.95"/><circle cx="349" cy="34" r="14" fill="#565f85" opacity="0.55"/>' +
            stars.join('') + '</svg>';
    }
    function svgDataUri(svg) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); }
    // lowThumb — 같은 SVG 를 20px 폭 캔버스에 그려 toDataURL 로 뽑는 진짜 저해상도 픽셀(LQIP)
    //   img 디코드는 비동기라 빌드 시그니처를 만들지 못한다 — 대신 픽셀 크기가 곧 저해상도다:
    //   브라우저가 20px 를 448px 로 확대해 그 자체가 뭉개진 LQIP 처럼 보인다(비트 캔버스 없이 확대 보간)
    function makeImgEl(src, alt) {
        const im = document.createElement('img');
        im.src = src;
        im.alt = alt;
        im.width = SVG_W;
        im.height = SVG_H;
        return im;
    }
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            cycle = Math.max(2000, cfg.build(pi));
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                setPaused(true);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            // 움직임 줄이기 — 모든 애니메이션이 꺼지고 장면은 블러 없이 선명한 그림 한 장 (큐 접근성 서술)
            statusP.textContent = '움직임 줄이기 켜짐 · 블러 없이 선명한 그림 한 장';
            readB.textContent = '블러 단계를 건너뛰고 선명한 그림을 즉시 보여 주는 한 장면이다';
            doneP.textContent = readB.textContent;
            cfg.frame(1e9);
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }
    // 03 블러 팽창 스케일 역산 보정 — blur 로 바깥으로 번지는 반경만큼 그림을 scale(1 + R/400) 로
    //    키웠다가 반경이 줄수록 1.0 으로 역산해 되돌린다. 번짐이 박스 밖으로 나가지 않아 가장자리가 지저분해지지 않는다
    const DECAY_RATE = 0.55; // 02 와 같은 감쇠 곡선
    const R0 = 20;
    const START_AT = 250;
    const SHOW_S = 24; // 보정 있음 카드 x
    const SHOW_N = 236; // 보정 없음 카드 x — blur 새는 쪽 비교
    const CW2 = 188; // 카드 폭
    let fixLow = null;
    let rawLow = null;
    let edgeBleed = null;
    let scEl = null;
    let cmpEl = null;
    function build(_i) {
        // 보정 있음(왼쪽) — backSolve(R) 로 scale 을 역산해 번짐이 박스 안에 머문다
        const cardA = make('div', 'pcard', scWrap);
        put(cardA, SHOW_S, 12, CW2, 110);
        const frA = make('i', 'pframe', scWrap);
        put(frA, SHOW_S, 12, CW2, 110);
        fixLow = makeImgEl(svgDataUri(svgNight()), '밤하늘 그림 (보정 있음)');
        fixLow.setAttribute('class', cx('pcard__low'));
        fixLow.style.opacity = '1';
        cardA.appendChild(fixLow);
        // 보정 없음(오른쪽) — scale 1 고정. blur 번짐이 박스 밖으로 새어 테두리가 지저분해진다
        const cardB = make('div', 'pcard', scWrap);
        put(cardB, SHOW_N, 12, CW2, 110);
        const frB = make('i', 'pframe', scWrap);
        put(frB, SHOW_N, 12, CW2, 110);
        rawLow = makeImgEl(svgDataUri(svgNight()), '밤하늘 그림 (보정 없음)');
        rawLow.setAttribute('class', cx('pcard__low'));
        rawLow.style.opacity = '1';
        cardB.appendChild(rawLow);
        edgeBleed = rawLow; // 보정 없음 — blur 번짐이 이 카드 테두리 밖으로 새어 나간다
        const la = make('b', 'ov ovs', sceneEl);
        put(la, SHOW_S + 4, 124, 180, 12);
        la.textContent = '보정 있음 scale = 1 + R/400';
        const lb = make('b', 'ov ovs', sceneEl);
        put(lb, SHOW_N + 4, 124, 180, 12);
        lb.textContent = '보정 없음 scale 1 고정';
        scEl = make('b', 'ov ovb', sceneEl);
        put(scEl, SHOW_S + 4, 16, 240, 14);
        cmpEl = make('b', 'ov ovs', sceneEl);
        put(cmpEl, SHOW_S + 4, 140, 420, 12);
        drawRows([spanOf(START_AT, 1250)], 2000);
        axis(2000);
        setReads(fill('R0 {a}px · EDGE_K 400 · scale = 1 + R/400 (R=20 → 1.05)', f0(R0)), fill('blur 는 바깥으로 번진다 — 번지는 만큼 키웠다가 줄며 되돌리는 역산'));
        return 2000;
    }
    function frame(t) {
        const r = blurRadius(R0, DECAY_RATE, Math.max(0, t - START_AT));
        const s = backSolve(r);
        if (fixLow) {
            fixLow.style.filter = 'blur(' + f2(r) + 'px)';
            fixLow.style.transform = 'scale(' + f3(s) + ')';
        }
        if (rawLow) {
            rawLow.style.filter = 'blur(' + f2(r) + 'px)';
        }
        if (scEl) {
            scEl.textContent = fill('R {a}px · scale {b} (1.05 → 1.0 역산)', f2(r), f3(s));
        }
        if (cmpEl) {
            cmpEl.textContent = '왼쪽 테두리는 매 순간 안쪽 · 오른쪽은 번짐이 박스 밖으로 새어 나간다';
        }
        return fill('지금 {a} · R {b}px · scale {c}', f0(t) + 'ms', f2(r), f3(s));
    }
    function f3(v) { return (Math.round(v * 1000) / 1000).toFixed(3); }
    return run({ count: 1, build: build, frame: frame });
}
})();
</script>
</body>
</html>
