<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>品目が加わるたびに合計の桁が縦に転がり、税の行が一拍遅れて追いかける合計欄 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rc is-demo" id="rc">
  <canvas class="rc__canvas" data-role="canvas" width="480" height="300" aria-label="品目が入るたびに合計の数字盤が慣性で転がり上がり、税の行が一拍遅れて追いかける場面"></canvas>
  <p class="rc__status" data-role="status" aria-live="polite">空っぽ</p>
  <div class="rc__tools">
    <button class="rc__btn" data-role="btn" type="button">品目を追加</button>
    <button class="rc__btn" data-role="clear" type="button">空にする</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("rc");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    // 파스텔 팔레트 — 어두운 무대 위에 밝은 종이를 얹어 명도 차로 읽힌다
    const BG = [29, 26, 44];
    const PAPER = [255, 248, 234];
    const INK = [58, 48, 76];
    const MINT = [126, 226, 192];
    const SKY = [124, 196, 255];
    const LILAC = [190, 164, 255];
    const PINK = [255, 160, 190];
    const PEACH = [255, 208, 168];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    // 시드 고정 난수 — 같은 시드면 언제나 같은 수열 (선형 합동 방식)
    function lcg(seed) {
        let s = seed >>> 0;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !statusEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    function fitCanvas() {
        const dpr = window.devicePixelRatio || 1;
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function onResize() {
        fitCanvas();
        if (reduceQuery.matches) {
            draw();
        }
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    // 화면 좌표(CSS px) → 장면 좌표(480x300). 리사이즈 뒤에도 늘 현재 크기로 다시 잰다
    function toScene(ev) {
        const r = cv.getBoundingClientRect();
        return [((ev.clientX - r.left) / r.width) * W, ((ev.clientY - r.top) / r.height) * H];
    }
    const DIGIT_H = 62;
    const INERTIA = 0.9;
    const PULL_K = 0.0052;
    const TAX_RATE = 0.1;
    const DELAY_MS = 260;
    const ADD_MS = 440;
    const HOLD_MS = 900;
    const TXT_SUM = '合計';
    const TXT_TAX = '税';
    const TXT_COUNT = '個入り — 合計 ';
    const TXT_EMPTY = '空っぽ';
    const NAMES = ['牛乳', '食パン', 'りんご', '卵', 'みかん'];
    const PRICES = [1200, 2800, 3500, 4100, 1900];
    const addBtn = root.querySelector('[data-role="btn"]');
    const clearBtn = root.querySelector('[data-role="clear"]');
    let count = 0;
    let target = 0;
    let shown = 0;
    let speed = 0;
    let taxShown = 0;
    let clock = 0;
    let nextAt = 200;
    let userTouched = false;
    const addedAt = [];
    function totalOf(n) {
        let s = 0;
        for (let i = 0; i < n; i += 1) {
            s += PRICES[i];
        }
        return s;
    }
    // 숫자 판 하나가 놓이는 위치 — 올림이 일어나는 구간(바로 아래 자리가 9.9 를 넘길 때)에만 구른다
    function digitPos(value, d) {
        if (d === 0) {
            return value;
        }
        const scale = Math.pow(10, d);
        const base = Math.floor(value / scale);
        const f = value / scale - base;
        return base + smooth((f - 0.9) / 0.1);
    }
    function announce() {
        status.textContent = count === 0 ? TXT_EMPTY : count + TXT_COUNT + target;
    }
    function addItem() {
        if (count >= PRICES.length) {
            return;
        }
        addedAt[count] = clock;
        count += 1;
        target = totalOf(count);
        announce();
    }
    function clearAll() {
        count = 0;
        target = 0;
        announce();
    }
    function step() {
        clock += FIXED_DT;
        if (!userTouched && clock >= nextAt) {
            if (count >= PRICES.length) {
                clearAll();
                nextAt = clock + 700;
            }
            else {
                addItem();
                nextAt = clock + (count >= PRICES.length ? HOLD_MS : ADD_MS);
            }
        }
        // 관성 — 목표를 지나쳤다가 되돌아와 멈춘다
        speed = speed * INERTIA + (target - shown) * PULL_K * (FIXED_DT / 16);
        shown = Math.max(0, shown + speed);
        // 税 줄은 화면에 보이는 합계를 한 박자 늦게 따라간다 (지연 필터)
        taxShown += (shown * TAX_RATE - taxShown) * (1 - Math.exp(-FIXED_DT / DELAY_MS));
    }
    function settle() {
        count = PRICES.length;
        target = totalOf(count);
        shown = target;
        taxShown = target * TAX_RATE;
        for (let i = 0; i < count; i += 1) {
            addedAt[i] = -9999;
        }
        announce();
    }
    function drawWheel(x, y, w, h, p, dim, size) {
        ctx.fillStyle = rgba(mix(BG, LILAC, 0.22), 1);
        ctx.fillRect(x, y, w, h);
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.clip();
        const base = Math.floor(p);
        const f = p - base;
        ctx.font = '700 ' + size + 'px ui-monospace, "Noto Sans KR", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(PAPER, dim ? 0.22 : 1);
        const a = ((base % 10) + 10) % 10;
        ctx.fillText(String(a), x + w / 2, y + h / 2 - f * h);
        ctx.fillText(String((a + 1) % 10), x + w / 2, y + h / 2 + (1 - f) * h);
        // 둥근 판의 위아래가 어두워지는 음영
        const sh = ctx.createLinearGradient(0, y, 0, y + h);
        sh.addColorStop(0, rgba(BG, 0.85));
        sh.addColorStop(0.28, rgba(BG, 0));
        sh.addColorStop(0.72, rgba(BG, 0));
        sh.addColorStop(1, rgba(BG, 0.85));
        ctx.fillStyle = sh;
        ctx.fillRect(x, y, w, h);
        ctx.restore();
        ctx.textBaseline = 'alphabetic';
    }
    function drawOdometer(x, y, digits, value, w, h, size) {
        for (let k = 0; k < digits; k += 1) {
            const d = digits - 1 - k;
            const lead = value < Math.pow(10, d) - 0.5 && d > 0;
            drawWheel(x + k * (w + 4), y, w, h, digitPos(value, d), lead, size);
        }
    }
    function draw() {
        ctx.fillStyle = rgba(BG, 1);
        ctx.fillRect(0, 0, W, H);
        // 왼쪽 영수증 종이
        ctx.fillStyle = rgba([10, 8, 22], 0.45);
        ctx.fillRect(34, 24, 196, 240);
        ctx.fillStyle = rgba(PAPER, 1);
        ctx.fillRect(28, 18, 196, 240);
        ctx.fillStyle = rgba(INK, 0.07);
        for (let y = 22; y < 256; y += 8) {
            ctx.fillRect(28, y, 196, 1);
        }
        ctx.font = '600 13px "Noto Sans KR", ui-monospace, monospace';
        for (let i = 0; i < count; i += 1) {
            const age = clamp((clock - addedAt[i]) / 240, 0, 1);
            const y = 52 + i * 34;
            ctx.fillStyle = rgba(INK, smooth(age));
            ctx.textAlign = 'left';
            ctx.fillText(NAMES[i], 44 - (1 - smooth(age)) * 26, y);
            ctx.textAlign = 'right';
            ctx.fillText(String(PRICES[i]), 208 + (1 - smooth(age)) * 26, y);
            ctx.fillStyle = rgba(INK, 0.16 * smooth(age));
            ctx.fillRect(40, y + 10, 168, 1);
        }
        // 오른쪽 숫자 판
        ctx.font = '700 14px "Noto Sans KR", ui-monospace, monospace';
        ctx.textAlign = 'left';
        ctx.fillStyle = rgba(PAPER, 0.9);
        ctx.fillText(TXT_SUM, 256, 58);
        drawOdometer(256, 70, 5, shown, 38, DIGIT_H, 46);
        ctx.fillStyle = rgba(PAPER, 0.9);
        ctx.font = '700 14px "Noto Sans KR", ui-monospace, monospace';
        ctx.fillText(TXT_TAX, 256, 172);
        drawOdometer(256, 184, 4, taxShown, 30, 44, 32);
    }
    function press() {
        userTouched = true;
        if (reduceQuery.matches) {
            addItem();
            shown = target;
            taxShown = target * TAX_RATE;
            draw();
            return;
        }
        addItem();
    }
    if (addBtn) {
        addBtn.addEventListener('click', press);
    }
    if (clearBtn) {
        clearBtn.addEventListener('click', function () {
            userTouched = true;
            clearAll();
            if (reduceQuery.matches) {
                shown = 0;
                taxShown = 0;
                draw();
            }
        });
    }
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    function frame(ts) {
        if (lastTs < 0) {
            lastTs = ts;
        }
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            step();
            acc -= FIXED_DT;
            n += 1;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    if (reduceQuery.matches) {
        settle();
        draw();
    }
    else {
        rafId = window.requestAnimationFrame(frame);
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
    };
})();
</script>
</body>
</html>
