<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bars to X — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <button class="burger" type="button" aria-label="Open menu">
    <span class="bar bar1"></span>
    <span class="bar bar2"></span>
    <span class="bar bar3"></span>
  </button>
  <nav class="menu" aria-hidden="true">
    <a class="menu__link" href="#">Home</a>
    <a class="menu__link" href="#">About</a>
    <a class="menu__link" href="#">Products</a>
    <a class="menu__link" href="#">Contact</a>
  </nav>
</main>
<script>
(function () {
  var stage = document.querySelector('.stage');
  var burger = document.querySelector('.burger');
  var open = false;
  burger.addEventListener('click', function () {
    stage.classList.remove('is-demo');
    open = !open;
    stage.classList.toggle('is-open', open);
    burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  });
})();
</script>
</body>
</html>
