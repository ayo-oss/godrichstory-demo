<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popover API menu, zero JS — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="anchor is-demo">
    <button class="burger" popovertarget="menu-06" type="button" aria-label="메뉴 열기">
      <span class="bar bar1"></span>
      <span class="bar bar2"></span>
      <span class="bar bar3"></span>
    </button>
    <div id="menu-06" class="menu" popover aria-label="메뉴">
      <a class="menu__link" href="#">홈</a>
      <a class="menu__link" href="#">소개</a>
      <a class="menu__link" href="#">제품</a>
      <a class="menu__link" href="#">문의</a>
    </div>
  </div>
</main>
<script>
// 데모는 anchor 에 .is-demo 를 걸어 keyframes 로 반복한다. 실제 열고 닫는 동작은
// popover 속성 하나가 다 한다 — JS 는 데모 반복을 멈추는 한 줄뿐이다.
(function () {
  var anchor = document.querySelector('.anchor');
  var burger = document.querySelector('.burger');
  var menu = document.querySelector('.menu');
  burger.addEventListener('click', function () { anchor.classList.remove('is-demo'); });
  menu.addEventListener('toggle', function (e) {
    burger.setAttribute('aria-label', e.newState === 'open' ? '메뉴 닫기' : '메뉴 열기');
  });
})();
</script>
</body>
</html>
