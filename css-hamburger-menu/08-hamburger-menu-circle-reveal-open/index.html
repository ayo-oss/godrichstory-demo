<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle reveal from the icon — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <button class="burger" type="button" aria-label="메뉴 열기">
    <span class="bar bar1"></span>
    <span class="bar bar2"></span>
    <span class="bar bar3"></span>
  </button>
  <div class="reveal" aria-hidden="true">
    <nav class="reveal__links">
      <a class="reveal__link" href="#">홈</a>
      <a class="reveal__link" href="#">소개</a>
      <a class="reveal__link" href="#">제품</a>
      <a class="reveal__link" href="#">문의</a>
    </nav>
  </div>
</main>
<script>
(function () {
  var stage = document.querySelector('.stage');
  var burger = document.querySelector('.burger');
  var open = false;
  burger.addEventListener('click', function () {
    stage.classList.remove('is-demo');
    open = !open;
    stage.classList.toggle('is-open', open);
    burger.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
  });
})();
</script>
</body>
</html>
