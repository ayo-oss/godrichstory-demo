<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하위 작업이 상위 막대 하나로 모여드는 묶음 접기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cf is-demo" id="cf">
  <canvas class="cf__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="묶음이 접힐 때 하위 막대가 상위 막대 하나로 모여들고 아래 행이 올라오는 일정표."></canvas>
  <table class="cf__sr" data-role="table"></table>
  <button class="cf__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("cf");
    if (!root) return;
    // 판 좌표 — 캔버스 안은 늘 480×300. 화면에 보이는 크기와 상관없이 계산은 이 좌표로 한다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 따라가기 비율 — 1 − e^(−rate·dt). 프레임 시간이 달라도 1초에 같은 만큼 다가간다
    function follow(rate, dt) { return 1 - Math.exp(-rate * dt); }
    // 시드 고정 난수 — 같은 시드면 같은 일정이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function makeSpring(x) { return { x: x, v: 0, to: x }; }
    const SPRING_SUBSTEP = 1 / 240;
    function stepSpring(s, stiffness, damping, dt) {
        let left = dt;
        while (left > 1e-9) {
            const h = Math.min(SPRING_SUBSTEP, left);
            s.v += (stiffness * (s.to - s.x) - damping * s.v) * h;
            s.x += s.v * h;
            left -= h;
        }
    }
    function snapSpring(s, x) { s.x = x; s.v = 0; s.to = x; }
    // ── 날짜 = 정수 일수 ─────────────────────────────────────────
    // 날짜 객체를 쓰지 않는다. 기준일을 0 으로 세는 정수 일수(day index)만 다루고, 화면의 월·일 숫자는 아래 월 길이 표로 산수해 만든다
    const MONTH_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    const YEAR_DAYS = 365;
    // 기준일(일수 0) = 한 해의 70번째 날 → 표로 세면 3월 11일
    const DAY_ZERO_OF_YEAR = 69;
    function calendarOf(day) {
        let r = ((day + DAY_ZERO_OF_YEAR) % YEAR_DAYS + YEAR_DAYS) % YEAR_DAYS;
        let m = 0;
        while (r >= MONTH_DAYS[m]) {
            r -= MONTH_DAYS[m];
            m += 1;
        }
        return [m + 1, r + 1];
    }
    const DAY_FMT = '{n}일차';
    const WEEK_FMT = '{n}주차';
    const MONTH_FMT = '{n}월';
    const SLACK_FMT = '{n}일';
    function dayText(day) { return DAY_FMT.replace('{n}', String(day + 1)); }
    // 하루 차 계산의 함정 — 시각(시간 단위)끼리 빼서 24 로 나누면, 시계가 한 시간 당겨진 날이 끼었을 때 정수가 아니다(23시간짜리 하루).
    // 그래서 바깥에서 들어온 시각은 반올림으로 정수 일수에 붙이고, 그다음부터는 정수끼리만 더하고 뺀다
    const HOURS_PER_DAY = 24;
    const CLOCK_SHIFT_HOURS = 1;
    function hoursToDayIndex(hours) { return Math.round(hours / HOURS_PER_DAY); }
    const BASE_TASKS = [
        { name: '요구 정리', dur: 3, deps: [], load: 2 },
        { name: '디자인 시안', dur: 4, deps: [0], load: 1 },
        { name: '데이터 설계', dur: 3, deps: [0], load: 1 },
        { name: '화면 개발', dur: 5, deps: [1], load: 2 },
        { name: '서버 개발', dur: 7, deps: [2], load: 1 },
        { name: '기능 연동', dur: 3, deps: [3, 4], load: 2 },
        { name: '문서 작성', dur: 3, deps: [1], load: 1 },
        { name: '통합 검수', dur: 3, deps: [5], load: 2 },
        { name: '오류 수정', dur: 2, deps: [7], load: 1 },
        { name: '출시', dur: 0, deps: [8, 6], load: 0 }
    ];
    function copyTasks(ts) { return ts.map(function (t) { return { name: t.name, dur: t.dur, deps: t.deps.slice(), load: t.load }; }); }
    function successorsOf(tasks) {
        const out = tasks.map(function () { return []; });
        tasks.forEach(function (t, i) { t.deps.forEach(function (p) { out[p].push(i); }); });
        return out;
    }
    function sortByDeps(tasks) {
        const succ = successorsOf(tasks);
        const waiting = tasks.map(function (t) { return t.deps.length; });
        const ready = [];
        waiting.forEach(function (w, i) { if (w === 0) {
            ready.push(i);
        } });
        const order = [];
        while (ready.length) {
            ready.sort(function (a, b) { return a - b; });
            const i = ready.shift();
            order.push(i);
            succ[i].forEach(function (j) { waiting[j] -= 1; if (waiting[j] === 0) {
                ready.push(j);
            } });
        }
        const stuck = [];
        waiting.forEach(function (w, i) { if (w > 0) {
            stuck.push(i);
        } });
        return { order: order, stuck: stuck };
    }
    function sweepBoth(tasks, order, minStart) {
        const n = tasks.length;
        const es = new Array(n).fill(0);
        const ef = new Array(n).fill(0);
        for (const i of order) {
            let s = minStart ? minStart[i] : 0;
            for (const p of tasks[i].deps) {
                s = Math.max(s, ef[p]);
            }
            es[i] = s;
            ef[i] = s + tasks[i].dur;
        }
        let end = 0;
        for (const i of order) {
            end = Math.max(end, ef[i]);
        }
        const succ = successorsOf(tasks);
        const ls = new Array(n).fill(0);
        const lf = new Array(n).fill(0);
        for (let k = order.length - 1; k >= 0; k -= 1) {
            const i = order[k];
            let f = end;
            for (const j of succ[i]) {
                f = Math.min(f, ls[j]);
            }
            lf[i] = f;
            ls[i] = f - tasks[i].dur;
        }
        const slack = es.map(function (s, i) { return ls[i] - s; });
        return { es: es, ef: ef, ls: ls, lf: lf, slack: slack, end: end };
    }
    function pushFrom(tasks, starts, from) {
        const succ = successorsOf(tasks);
        const out = starts.slice();
        const depth = tasks.map(function () { return -1; });
        depth[from] = 0;
        const queue = [from];
        let head = 0;
        // 고리가 있어도 끝나도록 꺼내는 횟수에 상한을 둔다
        const limit = tasks.length * tasks.length + 1;
        while (head < queue.length && head < limit) {
            const i = queue[head];
            head += 1;
            for (const j of succ[i]) {
                let need = 0;
                for (const p of tasks[j].deps) {
                    need = Math.max(need, out[p] + tasks[p].dur);
                }
                if (need > out[j]) {
                    out[j] = need;
                    depth[j] = Math.max(depth[j], depth[i] + 1);
                    queue.push(j);
                }
            }
        }
        return { starts: out, depth: depth };
    }
    // 날마다 걸린 일감 — 작업이 덮는 날(시작 ≤ 날 < 시작 + 일수)마다 사람 수를 더한다
    function dailyLoad(tasks, starts, days) {
        const load = new Array(days).fill(0);
        tasks.forEach(function (t, i) {
            for (let d = starts[i]; d < starts[i] + t.dur; d += 1) {
                if (d >= 0 && d < days) {
                    load[d] += t.load;
                }
            }
        });
        return load;
    }
    // ── 직각 경로 ───────────────────────────────────────────────
    // 앞 끝(ex, ey)에서 오른쪽으로 ROUTE_STUB 나간 뒤 아래로 꺾는다. 뒤 시작(sx)이 그 꺾인 자리 + ROUTE_STUB 보다 오른쪽이면 곧장 내려가 오른쪽으로 들어가고,
    // 아니면 앞 행 바로 아래 통로(gapY)까지 내려가 왼쪽으로 돌아간 다음 뒤 시작보다 ROUTE_STUB 앞에서 내려가 오른쪽으로 들어간다
    const ROUTE_STUB = 7;
    function elbowRoute(ex, ey, sx, sy, gapY) {
        const x1 = ex + ROUTE_STUB;
        if (sx - ROUTE_STUB >= x1) {
            return [ex, ey, x1, ey, x1, sy, sx, sy];
        }
        const x2 = sx - ROUTE_STUB;
        return [ex, ey, x1, ey, x1, gapY, x2, gapY, x2, sy, sx, sy];
    }
    function routeLength(pts) {
        let s = 0;
        for (let i = 2; i < pts.length; i += 2) {
            s += Math.hypot(pts[i] - pts[i - 2], pts[i + 1] - pts[i - 1]);
        }
        return s;
    }
    // 경로 위 거리 dist 자리의 점과 그 마디의 방향
    function pointOnRoute(pts, dist) {
        let left = Math.max(0, dist);
        for (let i = 2; i < pts.length; i += 2) {
            const dx = pts[i] - pts[i - 2];
            const dy = pts[i + 1] - pts[i - 1];
            const len = Math.hypot(dx, dy);
            if (left <= len || i === pts.length - 2) {
                const k = len > 0 ? Math.min(1, left / len) : 0;
                return [pts[i - 2] + dx * k, pts[i - 1] + dy * k, len > 0 ? dx / len : 1, len > 0 ? dy / len : 0];
            }
            left -= len;
        }
        return [pts[0], pts[1], 1, 0];
    }
    // 경로를 앞에서부터 dist 만큼만 자른 점 목록 — 화살표가 그려져 나가는 장면에 쓴다
    function cutRoute(pts, dist) {
        const out = [pts[0], pts[1]];
        let left = Math.max(0, dist);
        for (let i = 2; i < pts.length; i += 2) {
            const len = Math.hypot(pts[i] - pts[i - 2], pts[i + 1] - pts[i - 1]);
            if (left >= len) {
                out.push(pts[i], pts[i + 1]);
                left -= len;
                continue;
            }
            const k = len > 0 ? left / len : 0;
            out.push(lerp(pts[i - 2], pts[i], k), lerp(pts[i - 1], pts[i + 1], k));
            break;
        }
        return out;
    }
    // 장면 시계(초)와 상태 줄 글자 — 장면 계산이 고치고, 화면 쪽이 읽어 그린다
    let sceneT = 0;
    let simStatus = '';
    // 파스텔 팔레트 — 크림 바탕 위 라벤더·민트·버터·산호 막대. 가장 긴 경로·오늘 선·글자는 진한 쪽으로 명도 차를 둔다
    const PAPER = [251, 247, 238];
    const PAPER_DIM = [243, 237, 224];
    const GRID = [226, 218, 204];
    const INK = [44, 38, 58];
    const INK_SOFT = [112, 104, 126];
    const CREAM = [255, 251, 242];
    const LAVENDER = [190, 174, 236];
    const MINT = [158, 214, 190];
    const BUTTER = [244, 222, 146];
    const CORAL = [244, 170, 150];
    const SKY = [160, 204, 236];
    const PINK = [242, 182, 206];
    const PATH_DEEP = [86, 56, 168];
    const TODAY_DEEP = [190, 72, 60];
    const BAR_COLORS = [LAVENDER, MINT, BUTTER, CORAL, SKY, PINK];
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    // 표 한 줄 — 작업·시작·끝·여유. 끝은 그 작업이 덮는 마지막 날(일수 0 짜리는 시작과 같은 날)
    function tableRow(name, start, dur, slack) {
        return [name, dayText(start), dayText(start + Math.max(0, dur - 1)), SLACK_FMT.replace('{n}', String(slack))];
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const tableEl = root.querySelector('[data-role="table"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function clearStage() {
        ctx.fillStyle = rgba(PAPER, 1);
        ctx.fillRect(0, 0, W, H);
    }
    function label(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    function roundRectPath(x, y, w, h, r) {
        const rr = Math.max(0, Math.min(r, w / 2, h / 2));
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.arcTo(x + w, y, x + w, y + rr, rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
        ctx.lineTo(x + rr, y + h);
        ctx.arcTo(x, y + h, x, y + h - rr, rr);
        ctx.lineTo(x, y + rr);
        ctx.arcTo(x, y, x + rr, y, rr);
        ctx.closePath();
    }
    // 막대 하나 — 둥근 사각형 채움 + 진한 테두리. 폭이 0 이하이면 그리지 않는다
    function bar(x, y, w, h, fill, a, line) {
        if (w <= 0.2 || a <= 0) {
            return;
        }
        roundRectPath(x, y, w, h, 4);
        ctx.fillStyle = rgba(fill, a);
        ctx.fill();
        if (line > 0) {
            ctx.lineWidth = line;
            ctx.strokeStyle = rgba(INK, 0.55 * a);
            ctx.stroke();
        }
    }
    // 마일스톤 마름모
    function diamond(cx, cy, r, fill, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(cx, cy - r);
        ctx.lineTo(cx + r, cy);
        ctx.lineTo(cx, cy + r);
        ctx.lineTo(cx - r, cy);
        ctx.closePath();
        ctx.fillStyle = rgba(fill, a);
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = rgba(INK, 0.8 * a);
        ctx.stroke();
    }
    function polyline(pts, c, a, width) {
        if (pts.length < 4) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(pts[0], pts[1]);
        for (let i = 2; i < pts.length; i += 2) {
            ctx.lineTo(pts[i], pts[i + 1]);
        }
        ctx.lineWidth = width;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function arrowHead(x, y, dx, dy, size, c, a) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - dx * size - dy * size * 0.6, y - dy * size + dx * size * 0.6);
        ctx.lineTo(x - dx * size + dy * size * 0.6, y - dy * size - dx * size * 0.6);
        ctx.closePath();
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    // 빗금 — (x, y, w, h) 안에 45° 줄을 spacing 간격으로. 간격이 좁을수록 짙어 보인다
    function hatch(x, y, w, h, spacing, c, a) {
        if (w <= 0.5 || a <= 0) {
            return;
        }
        ctx.save();
        roundRectPath(x, y, w, h, 3);
        ctx.clip();
        ctx.beginPath();
        for (let s = x - h; s < x + w; s += Math.max(2, spacing)) {
            ctx.moveTo(s, y + h);
            ctx.lineTo(s + h, y);
        }
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
        ctx.restore();
    }
    // 시간 축 — 위 띠는 월 이름, 아래 띠는 일(월 안의 날 숫자)·주(주차) 층. 층마다 불투명도를 따로 받아 겹쳐 흐려지며 바뀌게 한다.
    // 세로 격자도 같은 불투명도로 행 영역(top~bottom)에 긋는다. xOf 는 일수 → 화면 x
    function timeAxis(xOf, dayW, d0, d1, left, right, top, bottom, ly) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(left, 0, right - left, H);
        ctx.clip();
        ctx.fillStyle = rgba(PAPER_DIM, 1);
        ctx.fillRect(left, 0, right - left, top - 4);
        for (let d = Math.floor(d0); d <= Math.ceil(d1); d += 1) {
            const x = xOf(d);
            const cal = calendarOf(d);
            if (ly.day > 0.01) {
                ctx.fillStyle = rgba(GRID, 0.7 * ly.day);
                ctx.fillRect(x, top, 1, bottom - top);
                if (dayW >= 13) {
                    label(String(cal[1]), x + dayW / 2, top - 11, INK_SOFT, ly.day, 9, 600, 'center');
                }
            }
            // 주 층 — 글자가 겹치지 않을 만큼(36px) 주를 건너뛰며 적는다
            const weekStep = 7 * dayW >= 36 ? 1 : (14 * dayW >= 36 ? 2 : 4);
            if (ly.week > 0.01 && d % 7 === 0) {
                ctx.fillStyle = rgba(GRID, ly.week);
                ctx.fillRect(x, top, 1, bottom - top);
                if ((d / 7) % weekStep === 0) {
                    label(WEEK_FMT.replace('{n}', String(d / 7 + 1)), x + 3, top - 11, INK_SOFT, ly.week, 9, 600, 'left');
                }
            }
            if (cal[1] === 1) {
                ctx.fillStyle = rgba(INK_SOFT, 0.18 + 0.4 * ly.month);
                ctx.fillRect(x, 4, 1, bottom - 4);
                label(MONTH_FMT.replace('{n}', String(cal[0])), x + 4, 11, INK, 0.85, 10, 700, 'left');
                // 월 층 — 그달 칸 가운데에 그달 일수(월 길이 표에서)를 적는다
                const len = MONTH_DAYS[cal[0] - 1];
                if (ly.month > 0.01 && len * dayW >= 30) {
                    label(SLACK_FMT.replace('{n}', String(len)), x + len * dayW / 2, top - 11, INK_SOFT, ly.month, 9, 700, 'center');
                }
            }
            else if (d === Math.floor(d0)) {
                // 왼쪽 끝 월 이름 — 바로 오른쪽에 새 달이 시작하면 겹치므로 적지 않는다
                const toNext = MONTH_DAYS[cal[0] - 1] - cal[1] + 1;
                if (toNext * dayW >= 44) {
                    label(MONTH_FMT.replace('{n}', String(cal[0])), Math.max(x, left) + 4, 11, INK, 0.85, 10, 700, 'left');
                }
            }
        }
        ctx.restore();
    }
    // 왼쪽 작업 이름 칸
    function rowLabel(name, y, a, bold) {
        label(name, 10, y, INK, a, 11, bold ? 800 : 600, 'left');
    }
    function rowStripe(y, h, i, a) {
        if (i % 2 === 1) {
            ctx.fillStyle = rgba(PAPER_DIM, 0.75 * a);
            ctx.fillRect(0, y, W, h);
        }
    }
    // 움직이는 행 빛 — 그 행 막대의 스프링 속도(k = 0~1)만큼 행 전체가 옅은 라벤더로 밝아진다. 막대가 서면 사라진다
    function rowGlow(y, h, k) {
        if (k <= 0.01) {
            return;
        }
        ctx.fillStyle = rgba(LAVENDER, 0.42 * clamp(k, 0, 1));
        ctx.fillRect(0, y, W, h);
    }
    // 상태 줄 — 바뀔 때만 글자를 고친다
    let shownStatus = '';
    function pushStatus() {
        if (!statusEl || simStatus === shownStatus) {
            return;
        }
        shownStatus = simStatus;
        statusEl.textContent = simStatus;
    }
    // 숨김 표 — 같은 일정을 작업·시작·끝·여유 열로 읽게. 화면에는 안 보이고 화면 읽기 도구가 읽는다
    const TABLE_HEAD = ['작업 이름', '시작일', '끝나는 날', '여유 일수'];
    function fillTable(caption, rows) {
        if (!tableEl) {
            return;
        }
        const tb = tableEl;
        while (tb.firstChild) {
            tb.removeChild(tb.firstChild);
        }
        const cap = document.createElement('caption');
        cap.textContent = caption;
        tb.appendChild(cap);
        const thead = document.createElement('thead');
        const hr = document.createElement('tr');
        TABLE_HEAD.forEach(function (h) {
            const th = document.createElement('th');
            th.scope = 'col';
            th.textContent = h;
            hr.appendChild(th);
        });
        thead.appendChild(hr);
        tb.appendChild(thead);
        const body = document.createElement('tbody');
        rows.forEach(function (r) {
            const tr = document.createElement('tr');
            r.forEach(function (c, k) {
                const cell = document.createElement(k === 0 ? 'th' : 'td');
                if (k === 0) {
                    cell.scope = 'row';
                }
                cell.textContent = c;
                tr.appendChild(cell);
            });
            body.appendChild(tr);
        });
        tb.appendChild(body);
    }
    // 08 — 묶음 접기. 상위 막대 구간 = 하위 작업의 가장 이른 시작 ~ 가장 늦은 끝. 접힘 정도 c(0 펼침 → 1 접힘)로 하위 막대의 y·높이를 상위 막대 쪽으로 보간하고, 아래 행은 빈 높이만큼 스프링으로 올라온다
    const LABEL_W = 96;
    const PLOT_X = LABEL_W + 6;
    const DAY_WIDTH = 16;
    const ROWS_TOP = 44;
    const ROW_H = 17;
    const BAR_H = 10;
    const GROUP_BAR_H = 12;
    // 접힘·행 이동 스프링
    const COLLAPSE_STIFFNESS = 150;
    const COLLAPSE_DAMPING = 15;
    const ROW_STIFFNESS = 190;
    const ROW_DAMPING = 17;
    // 묶음마다 접히는·펼쳐지는 시각
    // 기획·개발 묶음만 접는다(검수 묶음은 펼친 채 — 위가 접히면 빈 높이만큼 통째로 올라오는 행들)
    const COLLAPSE_AT_S = [0.65, 0.3, Infinity];
    const EXPAND_AT_S = [4.9, 4.6, Infinity];
    const LOOP_S = 8;
    const TABLE_CAPTION = '작업 일정표 — 묶음과 하위 작업';
    // 출시(마일스톤)는 빼고 아홉 작업을 세 묶음으로
    const tasks08 = copyTasks(BASE_TASKS.slice(0, 9)).map(function (t) { return { name: t.name, dur: t.dur, deps: t.deps.filter(function (p) { return p < 9; }), load: t.load }; });
    const groups08 = [
        { name: '기획 묶음', kids: [0, 1, 2] },
        { name: '개발 묶음', kids: [3, 4, 5] },
        { name: '검수 묶음', kids: [6, 7, 8] }
    ];
    const sweep08 = sweepBoth(tasks08, sortByDeps(tasks08).order, null);
    // 상위 구간 — 하위 시작 최솟값·끝 최댓값
    function rollup(g) {
        let s = Infinity;
        let e = -Infinity;
        g.kids.forEach(function (k) { s = Math.min(s, sweep08.es[k]); e = Math.max(e, sweep08.ef[k]); });
        return [s, e];
    }
    const spans08 = groups08.map(rollup);
    const rows08 = (function () {
        const out = [];
        groups08.forEach(function (g, gi) {
            out.push({ kind: 0, group: gi, task: -1 });
            g.kids.forEach(function (k) { out.push({ kind: 1, group: gi, task: k }); });
        });
        return out;
    })();
    const fold08 = groups08.map(function () { return makeSpring(0); });
    const rowY08 = rows08.map(function (_, i) { return makeSpring(ROWS_TOP + i * ROW_H); });
    // 목표 y — 접히는 묶음의 하위 행은 높이 0 으로 친다(목표 접힘 기준)
    function layoutTargets() {
        const out = [];
        let y = ROWS_TOP;
        rows08.forEach(function (r) {
            out.push(y);
            const h = r.kind === 0 ? ROW_H : ROW_H * (1 - fold08[r.group].to);
            y += h;
        });
        return out;
    }
    function reset() {
        fold08.forEach(function (s) { snapSpring(s, 0); });
        rows08.forEach(function (_, i) { snapSpring(rowY08[i], ROWS_TOP + i * ROW_H); });
    }
    function update(dt) {
        fold08.forEach(function (s, gi) {
            s.to = sceneT >= COLLAPSE_AT_S[gi] && sceneT < EXPAND_AT_S[gi] ? 1 : 0;
            stepSpring(s, COLLAPSE_STIFFNESS, COLLAPSE_DAMPING, dt);
        });
        const ty = layoutTargets();
        rowY08.forEach(function (s, i) { s.to = ty[i]; stepSpring(s, ROW_STIFFNESS, ROW_DAMPING, dt); });
    }
    function restPose() {
        // 최종 배치 — 기획·개발 묶음이 접혀 상위 막대 둘 + 펼친 검수 묶음
        fold08.forEach(function (s, gi) { snapSpring(s, isFinite(COLLAPSE_AT_S[gi]) ? 1 : 0); });
        const ty = layoutTargets();
        rowY08.forEach(function (s, i) { snapSpring(s, ty[i]); });
    }
    function tableRows() {
        const out = [];
        groups08.forEach(function (g, gi) {
            const sp = spans08[gi];
            let slack = Infinity;
            g.kids.forEach(function (k) { slack = Math.min(slack, sweep08.slack[k]); });
            out.push(tableRow(g.name, sp[0], sp[1] - sp[0], slack));
            g.kids.forEach(function (k) { out.push(tableRow(tasks08[k].name, sweep08.es[k], tasks08[k].dur, sweep08.slack[k])); });
        });
        return out;
    }
    function dayX(d) { return PLOT_X + d * DAY_WIDTH; }
    function draw() {
        clearStage();
        const ty = rowY08.map(function (s) { return s.x; });
        const lastBottom = ty[ty.length - 1] + ROW_H * (1 - fold08[rows08[rows08.length - 1].group].x);
        timeAxis(dayX, DAY_WIDTH, 0, 23, PLOT_X, W - 8, ROWS_TOP, Math.max(ROWS_TOP + ROW_H * 3, lastBottom), { day: 1, week: 0, month: 0 });
        const groupCy = [];
        rows08.forEach(function (r, i) { if (r.kind === 0) {
            groupCy[r.group] = ty[i] + ROW_H / 2;
        } });
        // 묶음 머리 행 — 바탕 띠 + 접힘 표시 삼각형 + 상위 구간 막대
        rows08.forEach(function (r, i) {
            if (r.kind !== 0) {
                return;
            }
            const c = clamp(fold08[r.group].x, 0, 1.15);
            const cy = ty[i] + ROW_H / 2;
            ctx.fillStyle = rgba(PAPER_DIM, 1);
            ctx.fillRect(0, ty[i], W, ROW_H);
            ctx.save();
            ctx.translate(14, cy);
            ctx.rotate(-c * Math.PI / 2);
            ctx.beginPath();
            ctx.moveTo(-4, -2.5);
            ctx.lineTo(4, -2.5);
            ctx.lineTo(0, 3.5);
            ctx.closePath();
            ctx.fillStyle = rgba(INK, 1);
            ctx.fill();
            ctx.restore();
            label(groups08[r.group].name, 24, cy, INK, 1, 11, 800, 'left');
            const sp = spans08[r.group];
            roundRectPath(dayX(sp[0]), cy - GROUP_BAR_H / 2, (sp[1] - sp[0]) * DAY_WIDTH, GROUP_BAR_H, 4);
            ctx.fillStyle = rgba(CREAM, 1);
            ctx.fill();
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = rgba(INK, 0.85);
            ctx.stroke();
            label(SLACK_FMT.replace('{n}', String(sp[1] - sp[0])), dayX(sp[1]) + 5, cy, INK, 1, 10, 800, 'left');
        });
        // 하위 행 — 접힘 정도만큼 막대가 상위 막대 쪽으로 모이고, 이름은 먼저 흐려진다
        rows08.forEach(function (r, i) {
            if (r.kind !== 1) {
                return;
            }
            const c = clamp(fold08[r.group].x, 0, 1.15);
            const t = tasks08[r.task];
            const own = ty[i] + ROW_H / 2;
            const cy = lerp(own, groupCy[r.group], c);
            const h = lerp(BAR_H, GROUP_BAR_H - 4, clamp(c, 0, 1));
            const la = 1 - smooth(c / 0.45);
            if (la > 0.01) {
                if (r.task % 2 === 1) {
                    ctx.fillStyle = rgba(PAPER_DIM, 0.5 * la);
                    ctx.fillRect(0, ty[i], W, ROW_H * (1 - clamp(c, 0, 1)));
                }
                label(t.name, 24, own, INK, la, 11, 600, 'left');
            }
            bar(dayX(sweep08.es[r.task]), cy - h / 2, t.dur * DAY_WIDTH, h, BAR_COLORS[r.task % BAR_COLORS.length], 1, 1.2 * (1 - 0.6 * clamp(c, 0, 1)));
        });
    }
    // 한 프레임에 넘기는 시간 상한(초) — 탭을 오래 숨겼다 돌아온 첫 프레임에도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 손대면 시연 표시를 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    // 리스너는 한 묶음으로 달고 정리할 때 한 번에 뗀다
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 장면 시계를 dt 만큼 — 한 바퀴(LOOP_S)를 넘으면 처음 배치로 되돌려 다시 시연한다
    function advance(dt) {
        sceneT += dt;
        if (sceneT >= LOOP_S) {
            sceneT -= LOOP_S;
            reset();
        }
        update(dt);
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        draw();
        pushStatus();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 시계 다시 맞추기 — 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 동작 줄이기 — 루프를 돌리지 않고 시연이 끝난 최종 배치 한 장만 그린다
    function showRest() {
        stopLoop();
        sceneT = 0;
        reset();
        restPose();
        draw();
        pushStatus();
    }
    function play() {
        sceneT = 0;
        reset();
        draw();
        pushStatus();
        if (!paused) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 루프를 멈추고, 돌아오면 시계를 다시 맞춰 시작한다 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 페이지를 연 채 바뀌면 — 켜지면 최종 배치로 멈추고, 꺼지면 시연을 처음부터
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw();
    }, { signal: off.signal });
    fitCanvas();
    fillTable(TABLE_CAPTION, tableRows());
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
