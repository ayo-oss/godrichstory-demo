<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중력과 바람의 필드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pw" id="pw">
  <p class="pw__hint">
    <svg class="pw__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M120 96a24 24 0 1 1 24-24a24 24 0 0 1-24 24m88-16a24 24 0 1 0 24 24a24 24 0 0 0-24-24m-56 80a24 24 0 1 0 24 24a24 24 0 0 0-24-24" opacity=".2"/><path d="M184 184a32 32 0 0 1-32 32c-13.7 0-26.95-8.93-31.5-21.22a8 8 0 0 1 15-5.56C137.74 195.27 145 200 152 200a16 16 0 0 0 0-32H40a8 8 0 0 1 0-16h112a32 32 0 0 1 32 32m-64-80a32 32 0 0 0 0-64c-13.7 0-26.95 8.93-31.5 21.22a8 8 0 0 0 15 5.56C105.74 60.73 113 56 120 56a16 16 0 0 1 0 32H24a8 8 0 0 0 0 16Zm88-32c-13.7 0-26.95 8.93-31.5 21.22a8 8 0 0 0 15 5.56C193.74 92.73 201 88 208 88a16 16 0 0 1 0 32H32a8 8 0 0 0 0 16h176a32 32 0 0 0 0-64"/></g></svg>
    <span>Wherever you rest the pointer becomes the center of a swirl</span>
  </p>
  <div class="pw__field" id="field" role="application" aria-label="Gravity and wind field test board" tabindex="0">
    <canvas class="pw__cv" id="cv"></canvas>
    <b class="pw__live" aria-hidden="true"><span class="pw__liveUnit">Wind</span><span class="pw__liveNum" id="windDeg">0°</span></b>
  </div>
  <div class="pw__bar">
    <label class="pw__dial">Wind strength
      <input type="range" id="gust" min="40" max="140" step="10" value="80" aria-label="Wind strength">
      <b class="pw__val" id="gustVal">80</b>
    </label>
    <button class="pw__reset" id="reset" type="button">
      <svg class="pw__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 128a104 104 0 1 1-104-104a104 104 0 0 1 104 104" opacity=".2"/><path d="M232 136a104 104 0 1 1-38.17-80.55L208 60v-4a8 8 0 0 1 16 0v34a8 8 0 0 1-8 8h-34a8 8 0 0 1 0-16h7.6l-8.89-7.4A88 88 0 1 0 216 136a8 8 0 0 1 16 0Z"/></g></svg>
      <span>From the start</span>
    </button>
  </div>
</div>
</main>
<script>
// 중력과 바람의 필드 — 판 전체가 시간에 따라 방향을 바꾸는 바람장이다.
// 파티클은 매번 힘을 쌓는 게 아니라 장이 정한 목표 속도로 부드럽게 steer 된다.
// 포인터를 올리면 그 자리가 소용돌이 중심 — 접선 힘으로 돌리고 살짝 빨아들여 궤도에 올린다.
var root = document.getElementById('pw');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var gustIn = document.getElementById('gust');
var gustVal = document.getElementById('gustVal');
var windOut = document.getElementById('windDeg');
var resetBtn = document.getElementById('reset');

var N = 170;                 // 잉크 점 120 + 크림 유령 50
var GHOSTS = 50;
var R = 78;                  // 소용돌이 Radius — 같은 크기의 링으로 화면에도 보인다
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1;
var pool = new Array(N);
var t = 0;
var strength = 80;
var px = 0, py = 0, inside = false;
var pulseT = 0;              // 키보드로 일으킨 한가운데 소용돌이의 남은 시간

// 고DPI 대응 — 배킹 스토어를 devicePixelRatio 배로 키우고 좌표계는 CSS 픽셀 그대로 쓴다
function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function scatter() {
  for (var i = 0; i < N; i++) {
    pool[i] = {
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0, vy: 0,
      r: i < GHOSTS ? 3.2 + Math.random() * 2 : 1.6 + Math.random() * 1.2,
      ghost: i < GHOSTS
    };
  }
}

// 소용돌이 — 중심에 가까울수록 세게. 접선(수직) 방향 힘과 살짝의 안쪽 당김으로 궤도를 만든다
function swirl(p, sx, sy, dt, scale) {
  var dx = p.x - sx, dy = p.y - sy;
  var d2 = dx * dx + dy * dy;
  if (d2 >= R * R || d2 < 4) return;
  var d = Math.sqrt(d2);
  var fall = 1 - d / R;
  var inv = 1 / d;
  p.vx += (-dy * inv * 760 - dx * inv * 260) * fall * scale * dt;
  p.vy += ( dx * inv * 760 - dy * inv * 260) * fall * scale * dt;
}

function step(dt) {
  t += dt;
  // 사인과 코사인을 합성한 기준 Wind — 판 전체의 바람이 천천히 돌아간다
  var base = Math.sin(t * 0.2) * 1.15 + Math.cos(t * 0.34) * 0.5;
  var steer = Math.min(1, 2.6 * dt);
  var sx = inside ? px : W / 2;
  var sy = inside ? py : H / 2;
  var live = inside || pulseT > 0;
  var scale = (!inside && pulseT > 0) ? pulseT : 1;
  if (pulseT > 0) pulseT -= dt;
  for (var i = 0; i < N; i++) {
    var p = pool[i];
    // 자리마다 물결 — 같은 순간에도 판 위의 곳마다 바람 방향이 다르다
    var ang = base + Math.sin(p.x * 0.012 + t * 0.6) * 0.85 + Math.cos(p.y * 0.016 - t * 0.45) * 0.6;
    var spd = (p.ghost ? 0.55 : 1) * strength;
    p.vx += (Math.cos(ang) * spd - p.vx) * steer;
    p.vy += (Math.sin(ang) * spd * 0.62 - p.vy) * steer;
    if (live) swirl(p, sx, sy, dt, scale);
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    // 흐름이 판 밖으로 새면 반대편에서 다시 들어온다
    if (p.x < -10) p.x = W + 10;
    else if (p.x > W + 10) p.x = -10;
    if (p.y < -10) p.y = H + 10;
    else if (p.y > H + 10) p.y = -10;
  }
  var deg = ((base * 180 / Math.PI) % 360 + 360) % 360;
  windOut.textContent = String(Math.round(deg)) + '°';
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  // 크림 유령 — 크고 느린 안개 알갱이. 반투명으로 죽이면 대비가 3:1 아래로 내려가니 불투명 그대로 크게 둔다
  ctx.fillStyle = '#fff7e6';
  for (var i = 0; i < GHOSTS; i++) {
    var g = pool[i];
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
    ctx.fill();
  }
  // 잉크 점 — 한 경로에 몰아 넣고 한 번에 채운다
  ctx.fillStyle = '#17141a';
  ctx.beginPath();
  for (var j = GHOSTS; j < N; j++) {
    var p = pool[j];
    ctx.moveTo(p.x + p.r, p.y);
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  }
  ctx.fill();
  // 소용돌이 Radius 링 — translate 로 원점을 옮겨 그리고 restore 로 되돌린다
  if (inside || pulseT > 0) {
    var cx = inside ? px : W / 2;
    var cy = inside ? py : H / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = 'rgba(255,247,230,.9)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#fff7e6';
    ctx.beginPath();
    ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

var lastT = 0;
function frame(now) {
  var dt = lastT ? Math.min((now - lastT) / 1000, 0.05) : 0.016;
  lastT = now;
  step(dt);
  draw();
  requestAnimationFrame(frame);
}

function setPointer(e) {
  var r = cv.getBoundingClientRect();
  px = e.clientX - r.left;
  py = e.clientY - r.top;
}

function restart() {
  t = 0;
  pulseT = 0;
  scatter();
  if (reduce) draw();
}

gustIn.addEventListener('input', function () {
  strength = Number(gustIn.value);
  gustVal.textContent = String(strength);
  if (reduce) draw();
});
resetBtn.addEventListener('click', restart);
field.addEventListener('pointermove', function (e) { setPointer(e); inside = true; });
field.addEventListener('pointerdown', function (e) { setPointer(e); inside = true; });
field.addEventListener('pointerleave', function () { inside = false; });
field.addEventListener('pointercancel', function () { inside = false; });
field.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    pulseT = 1.1;             // 한가운데에 소용돌이를 일으킨 뒤 서서히 잦아들게 한다
    if (reduce) draw();
  }
});
window.addEventListener('resize', function () {
  fit();
  for (var i = 0; i < N; i++) {
    var p = pool[i];
    if (p.x > W) p.x = W - 2;
    if (p.y > H) p.y = H - 2;
  }
  draw();
});

fit();
restart();
if (reduce) {
  // reduce — 루프를 돌리지 않는다. 바람이 2s 남짓 흐른 뒤의 한 장만 남긴다.
  for (var warm = 0; warm < 120; warm++) step(1 / 60);
  root.classList.add('is-still');
  draw();
} else {
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
