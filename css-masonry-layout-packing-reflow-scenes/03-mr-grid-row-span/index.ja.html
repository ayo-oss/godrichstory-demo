<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画像の比率から行の数を計算するグリッドスパン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mr is-demo" id="mr" data-demo="1">
  <div class="mr__bar">
    <div class="mr__btns"><button class="mr__btn" type="button" data-r="less" aria-label="幅を狭く">−</button><button class="mr__btn" type="button" data-r="more" aria-label="幅を広く">+</button></div>
    <p class="mr__live" data-r="live" aria-live="off" aria-atomic="true"><span class="mr__k">最初のカード span</span> <b data-r="span">5</b></p>
  </div>
  <div class="mr__wall" data-r="wall"></div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("mr");
    const CLS = { card: "mr__card" };
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let demo = !reduce;
    let raf = 0;
    let last = -1;
    let ready = false;
    const offs = [];
    function q(sel) {
        return root.querySelector(sel);
    }
    const wall = q("[data-r=wall]");
    const live = q("[data-r=live]");
    function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
    }
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    function on(el, type, fn) {
        el.addEventListener(type, fn);
        offs.push(function () {
            el.removeEventListener(type, fn);
        });
    }
    function stopDemo() {
        if (!demo) return;
        demo = false;
        root.removeAttribute("data-demo");
        root.classList.remove("is-demo");
        live.setAttribute("aria-live", "polite");
    }
    if (reduce) live.setAttribute("aria-live", "polite");
    // カード: 시드 LCG 로 비율을 뽑는다. 이미지 파일은 없고 그라디언트와 번호만 있다.
    function makeCards(n, seed, lo, hi) {
        const rng = makeRng(seed);
        const list = [];
        for (let i = 0; i < n; i += 1) {
            const el = document.createElement("div");
            el.className = CLS.card;
            el.setAttribute("data-c", String(i % 6));
            el.innerHTML = "<i>" + (i + 1) + "</i>";
            wall.appendChild(el);
            list.push({
                el: el, ratio: lo + rng() * (hi - lo), cat: Math.floor(rng() * 3),
                x: 0, y: 0, w: 0, h: 0, tx: 0, ty: 0, tw: 0, th: 0,
                s: 1, ds: 1, o: 1, dop: 1, vx: 0, vy: 0,
                ox: 0, oy: 0, osx: 0, osy: 0, ovx: 0, ovy: 0, ovsx: 0, ovsy: 0,
                fx: 0, fy: 0, fs: 1, fo: 1, t0: 0, sq: 0, rest: 0, wait: 0
            });
        }
        return list;
    }
    function colW(cols, gap) {
        return (wall.clientWidth - gap * (cols - 1)) / cols;
    }
    // 최단 列 배치: 카드를 순서대로 읽으며 지금 가장 낮은 列 끝에 얹고 그 列 높이에 カード 높이와 간격을 더한다.
    function pack(hs, cols, cw, gap) {
        const colH = [];
        for (let k = 0; k < cols; k += 1) colH.push(0);
        const out = [];
        for (let i = 0; i < hs.length; i += 1) {
            let best = 0;
            for (let k = 1; k < cols; k += 1) {
                if (colH[k] < colH[best] - 0.5) best = k;
            }
            out.push({ x: best * (cw + gap), y: colH[best] });
            colH[best] += hs[i] + gap;
        }
        return out;
    }
    function put(c, x, y, sx, sy) {
        const st = c.el.style;
        st.width = c.w.toFixed(1) + "px";
        st.height = c.h.toFixed(1) + "px";
        st.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0) scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ")";
    }
    function frame(ts) {
        const dt = last < 0 ? 0.016 : Math.min(0.05, (ts - last) / 1000);
        last = ts;
        if (demo) script(ts);
        step(dt, ts);
        render();
        raf = requestAnimationFrame(frame);
    }
    const ro = new ResizeObserver(function () {
        relayout();
    });
    ro.observe(root);

    // 기법: カード 높이(列 폭 × 비율)에 간격을 더해 행 단위로 올림한 값을 grid-row-end: span 으로 준다. 자리는 grid 가 알아서 찾는다.
    const ROW_UNIT = 8;
    const GAP = 8;
    const SPAN_BIAS = 0;
    const COLUMNS = 3;
    const SEED = 5;
    const COUNT = 9;
    const cards = makeCards(COUNT, SEED, 0.24, 0.56);
    const spanEl = q("[data-r=span]");
    const spans = [];
    let frac = 1;
    let want = 1;
    let shownFrac = -1;
    wall.setAttribute("data-grid", "1");
    wall.style.setProperty("--cols", String(COLUMNS));
    wall.style.setProperty("--unit", ROW_UNIT + "px");
    wall.style.setProperty("--gap", GAP + "px");
    for (let i = 0; i < cards.length; i += 1) spans.push(0);
    function spanOf(h) {
        return Math.ceil((h + GAP) / (ROW_UNIT + GAP)) + SPAN_BIAS;
    }
    function relayout() {
        wall.style.width = Math.round(root.clientWidth * frac) + "px";
        const cw = (wall.clientWidth - GAP * (COLUMNS - 1)) / COLUMNS;
        for (let i = 0; i < cards.length; i += 1) {
            const n = spanOf(cw * cards[i].ratio);
            if (n !== spans[i]) {
                spans[i] = n;
                cards[i].el.style.gridRowEnd = "span " + n;
                const badge = cards[i].el.firstChild;
                if (badge) badge.textContent = String(n);
            }
        }
        spanEl.textContent = String(spans[0]);
        shownFrac = frac;
        ready = true;
    }
    function script(ts) {
        frac = 0.62 + 0.38 * (0.5 + 0.5 * Math.cos((ts % 2000) / 2000 * Math.PI * 2));
        want = frac;
    }
    function step(dt, ts) {
        if (!demo) frac += (want - frac) * (1 - Math.exp(-12 * dt));
    }
    function render() {
        if (Math.abs(frac - shownFrac) > 0.0005) relayout();
    }
    function nudge(d) {
        stopDemo();
        want = clamp(want + d, 0.5, 1);
        if (reduce) {
            frac = want;
            relayout();
        }
    }
    on(q("[data-r=less]"), "click", function () {
        nudge(-0.17);
    });
    on(q("[data-r=more]"), "click", function () {
        nudge(0.17);
    });

    relayout();
    if (reduce) {
        render();
    } else {
        raf = requestAnimationFrame(frame);
    }

})();
</script>
</body>
</html>
