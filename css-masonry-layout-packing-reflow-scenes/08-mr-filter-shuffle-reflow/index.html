<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>필터를 누르면 자리가 순서대로 옮겨 가는 셔플 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mr is-demo" id="mr" data-demo="1">
  <div class="mr__bar">
    <div class="mr__btns"><button class="mr__btn" type="button" data-r="f0" aria-pressed="true">전체</button><button class="mr__btn" type="button" data-r="f1" aria-pressed="false">분홍</button><button class="mr__btn" type="button" data-r="f2" aria-pressed="false">민트</button><button class="mr__btn" type="button" data-r="f3" aria-pressed="false">하늘</button></div>
    <p class="mr__live" data-r="live" aria-live="off" aria-atomic="true"><span class="mr__k">카드</span> <b data-r="count">12</b></p>
  </div>
  <div class="mr__wall" data-r="wall"></div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("mr");
    const CLS = { card: "mr__card" };
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let demo = !reduce;
    let raf = 0;
    let last = -1;
    let ready = false;
    const offs = [];
    function q(sel) {
        return root.querySelector(sel);
    }
    const wall = q("[data-r=wall]");
    const live = q("[data-r=live]");
    function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
    }
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    function on(el, type, fn) {
        el.addEventListener(type, fn);
        offs.push(function () {
            el.removeEventListener(type, fn);
        });
    }
    function stopDemo() {
        if (!demo) return;
        demo = false;
        root.removeAttribute("data-demo");
        root.classList.remove("is-demo");
        live.setAttribute("aria-live", "polite");
    }
    if (reduce) live.setAttribute("aria-live", "polite");
    // 카드: 시드 LCG 로 비율을 뽑는다. 이미지 파일은 없고 그라디언트와 번호만 있다.
    function makeCards(n, seed, lo, hi) {
        const rng = makeRng(seed);
        const list = [];
        for (let i = 0; i < n; i += 1) {
            const el = document.createElement("div");
            el.className = CLS.card;
            el.setAttribute("data-c", String(i % 6));
            el.innerHTML = "<i>" + (i + 1) + "</i>";
            wall.appendChild(el);
            list.push({
                el: el, ratio: lo + rng() * (hi - lo), cat: Math.floor(rng() * 3),
                x: 0, y: 0, w: 0, h: 0, tx: 0, ty: 0, tw: 0, th: 0,
                s: 1, ds: 1, o: 1, dop: 1, vx: 0, vy: 0,
                ox: 0, oy: 0, osx: 0, osy: 0, ovx: 0, ovy: 0, ovsx: 0, ovsy: 0,
                fx: 0, fy: 0, fs: 1, fo: 1, t0: 0, sq: 0, rest: 0, wait: 0
            });
        }
        return list;
    }
    function colW(cols, gap) {
        return (wall.clientWidth - gap * (cols - 1)) / cols;
    }
    // 최단 열 배치: 카드를 순서대로 읽으며 지금 가장 낮은 열 끝에 얹고 그 열 높이에 카드 높이와 간격을 더한다.
    function pack(hs, cols, cw, gap) {
        const colH = [];
        for (let k = 0; k < cols; k += 1) colH.push(0);
        const out = [];
        for (let i = 0; i < hs.length; i += 1) {
            let best = 0;
            for (let k = 1; k < cols; k += 1) {
                if (colH[k] < colH[best] - 0.5) best = k;
            }
            out.push({ x: best * (cw + gap), y: colH[best] });
            colH[best] += hs[i] + gap;
        }
        return out;
    }
    function put(c, x, y, sx, sy) {
        const st = c.el.style;
        st.width = c.w.toFixed(1) + "px";
        st.height = c.h.toFixed(1) + "px";
        st.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0) scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ")";
    }
    function frame(ts) {
        const dt = last < 0 ? 0.016 : Math.min(0.05, (ts - last) / 1000);
        last = ts;
        if (demo) script(ts);
        step(dt, ts);
        render();
        raf = requestAnimationFrame(frame);
    }
    const ro = new ResizeObserver(function () {
        relayout();
    });
    ro.observe(root);

    // 기법: 걸러진 카드만 다시 최단 열 배치로 새 자리를 구하고, 카드마다 출발을 순번 × STAGGER 만큼 늦춰 같은 이징으로 옮긴다.
    const STAGGER = 36;
    const DURATION = 440;
    const EASE_POWER = 3;
    const COLUMNS = 4;
    const GAP = 8;
    const SEED = 25;
    const COUNT = 12;
    const cards = makeCards(COUNT, SEED, 0.3, 0.66);
    const buttons = [q("[data-r=f0]"), q("[data-r=f1]"), q("[data-r=f2]"), q("[data-r=f3]")];
    const countEl = q("[data-r=count]");
    let filter = 0;
    function easeOut(p) {
        return 1 - Math.pow(1 - p, EASE_POWER);
    }
    function visible(c) {
        return filter === 0 || c.cat === filter - 1;
    }
    for (let i = 0; i < cards.length; i += 1) cards[i].el.setAttribute("data-c", String(cards[i].cat));
    function aim(now, fresh) {
        const cw = colW(COLUMNS, GAP);
        const list = cards.filter(visible);
        const at = pack(list.map(function (c) {
            return c.ratio * cw;
        }), COLUMNS, cw, GAP);
        let rank = 0;
        for (let i = 0; i < cards.length; i += 1) {
            const c = cards[i];
            c.fx = c.x;
            c.fy = c.y;
            c.fs = c.s;
            c.fo = c.o;
            c.w = cw;
            c.h = c.ratio * cw;
            if (visible(c)) {
                c.tx = at[rank].x;
                c.ty = at[rank].y;
                c.ds = 1;
                c.dop = 1;
                c.t0 = now + rank * STAGGER;
                rank += 1;
            } else {
                c.ds = 0.5;
                c.dop = 0;
                c.t0 = now;
            }
            if (fresh) {
                c.x = c.tx;
                c.y = c.ty;
                c.s = c.ds;
                c.o = c.dop;
                c.t0 = -1e9;
            }
        }
        countEl.textContent = String(list.length);
    }
    function setFilter(f, now) {
        if (f === filter && ready) return;
        filter = f;
        for (let i = 0; i < 4; i += 1) buttons[i].setAttribute("aria-pressed", i === f ? "true" : "false");
        aim(now, reduce);
        if (reduce) render();
    }
    function relayout() {
        aim(performance.now(), !ready || reduce);
        ready = true;
        if (reduce) render();
    }
    function script(ts) {
        const ph = ts % 2000;
        setFilter(ph < 300 ? 0 : ph < 800 ? 1 : ph < 1300 ? 2 : ph < 1800 ? 3 : 0, ts);
    }
    function step(dt, ts) {
        for (let i = 0; i < cards.length; i += 1) {
            const c = cards[i];
            const e = easeOut(clamp((ts - c.t0) / DURATION, 0, 1));
            c.x = c.fx + (c.tx - c.fx) * e;
            c.y = c.fy + (c.ty - c.fy) * e;
            c.s = c.fs + (c.ds - c.fs) * e;
            c.o = c.fo + (c.dop - c.fo) * e;
        }
    }
    function render() {
        for (let i = 0; i < cards.length; i += 1) {
            const c = cards[i];
            c.el.style.opacity = c.o.toFixed(2);
            put(c, c.x, c.y, c.s, c.s);
        }
    }
    for (let i = 0; i < 4; i += 1) {
        on(buttons[i], "click", function () {
            stopDemo();
            setFilter(i, performance.now());
        });
    }
    buttons[0].setAttribute("aria-pressed", "true");

    relayout();
    if (reduce) {
        render();
    } else {
        raf = requestAnimationFrame(frame);
    }

})();
</script>
</body>
</html>
