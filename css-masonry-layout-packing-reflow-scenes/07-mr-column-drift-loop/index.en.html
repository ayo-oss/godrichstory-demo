<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>An Endless Brick Wall Whose Columns Drift in Opposite Directions — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mr is-demo" id="mr" data-demo="1">
  <div class="mr__bar">
    <div class="mr__btns"><button class="mr__btn" type="button" data-r="slow" aria-label="Slower">−</button><button class="mr__btn" type="button" data-r="fast" aria-label="Faster">+</button><button class="mr__btn" type="button" data-r="pause" aria-pressed="false">Pause</button></div>
    <p class="mr__live" data-r="live" aria-live="off" aria-atomic="true"><span class="mr__k">Speed</span> <b data-r="speed">1.0</b>×</p>
  </div>
  <div class="mr__wall" data-r="wall"></div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("mr");
    const CLS = { card: "mr__card", col: "mr__col" };
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let demo = !reduce;
    let raf = 0;
    let last = -1;
    let ready = false;
    const offs = [];
    function q(sel) {
        return root.querySelector(sel);
    }
    const wall = q("[data-r=wall]");
    const live = q("[data-r=live]");
    function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
    }
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    function on(el, type, fn) {
        el.addEventListener(type, fn);
        offs.push(function () {
            el.removeEventListener(type, fn);
        });
    }
    function stopDemo() {
        if (!demo) return;
        demo = false;
        root.removeAttribute("data-demo");
        root.classList.remove("is-demo");
        live.setAttribute("aria-live", "polite");
    }
    if (reduce) live.setAttribute("aria-live", "polite");
    // Cards: 시드 LCG 로 비율을 뽑는다. 이미지 파일은 없고 그라디언트와 번호만 있다.
    function makeCards(n, seed, lo, hi) {
        const rng = makeRng(seed);
        const list = [];
        for (let i = 0; i < n; i += 1) {
            const el = document.createElement("div");
            el.className = CLS.card;
            el.setAttribute("data-c", String(i % 6));
            el.innerHTML = "<i>" + (i + 1) + "</i>";
            wall.appendChild(el);
            list.push({
                el: el, ratio: lo + rng() * (hi - lo), cat: Math.floor(rng() * 3),
                x: 0, y: 0, w: 0, h: 0, tx: 0, ty: 0, tw: 0, th: 0,
                s: 1, ds: 1, o: 1, dop: 1, vx: 0, vy: 0,
                ox: 0, oy: 0, osx: 0, osy: 0, ovx: 0, ovy: 0, ovsx: 0, ovsy: 0,
                fx: 0, fy: 0, fs: 1, fo: 1, t0: 0, sq: 0, rest: 0, wait: 0
            });
        }
        return list;
    }
    function colW(cols, gap) {
        return (wall.clientWidth - gap * (cols - 1)) / cols;
    }
    // 최단 Columns 배치: 카드를 순서대로 읽으며 지금 가장 낮은 Columns 끝에 얹고 그 Columns 높이에 Cards 높이와 간격을 더한다.
    function pack(hs, cols, cw, gap) {
        const colH = [];
        for (let k = 0; k < cols; k += 1) colH.push(0);
        const out = [];
        for (let i = 0; i < hs.length; i += 1) {
            let best = 0;
            for (let k = 1; k < cols; k += 1) {
                if (colH[k] < colH[best] - 0.5) best = k;
            }
            out.push({ x: best * (cw + gap), y: colH[best] });
            colH[best] += hs[i] + gap;
        }
        return out;
    }
    function put(c, x, y, sx, sy) {
        const st = c.el.style;
        st.width = c.w.toFixed(1) + "px";
        st.height = c.h.toFixed(1) + "px";
        st.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0) scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ")";
    }
    function frame(ts) {
        const dt = last < 0 ? 0.016 : Math.min(0.05, (ts - last) / 1000);
        last = ts;
        if (demo) script(ts);
        step(dt, ts);
        render();
        raf = requestAnimationFrame(frame);
    }
    const ro = new ResizeObserver(function () {
        relayout();
    });
    ro.observe(root);

    // 기법: 열마다 속도에 깊이 비율을 곱하고 방향을 번갈아 정한다. Columns 내용을 두 번 이상 이어 붙이고 위치를 한 Columns 높이로 나눈 나머지로 되감아 이음새를 숨긴다.
    const COLUMNS = 4;
    const GAP = 8;
    const SPEED = 64;
    const DEPTH = [1, 0.62, 1.3, 0.8];
    const PER = 5;
    const SEED = 3;
    const rng = makeRng(SEED);
    const ratios = [];
    const pos = [0, 0, 0, 0];
    const spans = [1, 1, 1, 1];
    const cols = [];
    const speedEl = q("[data-r=speed]");
    const pauseBtn = q("[data-r=pause]");
    let mult = 1;
    let paused = false;
    for (let i = 0; i < COLUMNS * PER; i += 1) ratios.push(0.4 + rng() * 0.6);
    function build() {
        while (wall.firstChild) wall.removeChild(wall.firstChild);
        cols.length = 0;
        const cw = colW(COLUMNS, GAP);
        for (let k = 0; k < COLUMNS; k += 1) {
            const col = document.createElement("div");
            col.className = CLS.col;
            col.style.left = (k * (cw + GAP)).toFixed(1) + "px";
            col.style.width = cw.toFixed(1) + "px";
            let total = 0;
            for (let i = 0; i < PER; i += 1) total += ratios[k * PER + i] * cw + GAP;
            const copies = Math.ceil((total + wall.clientHeight) / total);
            for (let n = 0; n < copies; n += 1) {
                let y = n * total;
                for (let i = 0; i < PER; i += 1) {
                    const h = ratios[k * PER + i] * cw;
                    const el = document.createElement("div");
                    el.className = CLS.card;
                    el.setAttribute("data-c", String((k * PER + i) % 6));
                    el.innerHTML = "<i>" + (k * PER + i + 1) + "</i>";
                    if (n > 0) el.setAttribute("aria-hidden", "true");
                    el.style.width = cw.toFixed(1) + "px";
                    el.style.height = h.toFixed(1) + "px";
                    el.style.transform = "translate3d(0," + y.toFixed(1) + "px,0)";
                    col.appendChild(el);
                    y += h + GAP;
                }
            }
            spans[k] = total;
            cols.push(col);
            wall.appendChild(col);
        }
    }
    function relayout() {
        build();
        for (let k = 0; k < COLUMNS; k += 1) pos[k] = pos[k] % spans[k];
        ready = true;
        speedEl.textContent = mult.toFixed(1);
        render();
    }
    function script(ts) {
        // 시연은 기본 속도로 계속 흐른다.
    }
    function step(dt, ts) {
        if (paused) return;
        for (let k = 0; k < COLUMNS; k += 1) {
            const dir = k % 2 === 0 ? 1 : -1;
            const next = pos[k] + dir * SPEED * DEPTH[k] * mult * dt;
            pos[k] = ((next % spans[k]) + spans[k]) % spans[k];
        }
    }
    function render() {
        for (let k = 0; k < cols.length; k += 1) {
            cols[k].style.transform = "translate3d(0," + (-pos[k]).toFixed(1) + "px,0)";
        }
    }
    function bump() {
        // 움직임 줄이기에서는 흐르지 않으므로 누를 때마다 한 칸 밀어서 바뀐 결과를 바로 보여 준다.
        if (!reduce) return;
        for (let k = 0; k < COLUMNS; k += 1) {
            pos[k] = (pos[k] + (k % 2 === 0 ? 1 : -1) * 48 * DEPTH[k] + spans[k]) % spans[k];
        }
        render();
    }
    function speedBy(d) {
        stopDemo();
        mult = clamp(mult + d, 0.5, 3);
        speedEl.textContent = mult.toFixed(1);
        bump();
    }
    on(q("[data-r=slow]"), "click", function () {
        speedBy(-0.5);
    });
    on(q("[data-r=fast]"), "click", function () {
        speedBy(0.5);
    });
    on(pauseBtn, "click", function () {
        stopDemo();
        paused = !paused;
        pauseBtn.setAttribute("aria-pressed", paused ? "true" : "false");
    });
    pauseBtn.hidden = reduce;

    relayout();
    if (reduce) {
        render();
    } else {
        raf = requestAnimationFrame(frame);
    }

})();
</script>
</body>
</html>
