<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포인터 가까이에서 이웃이 비켜서는 렌즈 배열 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mr is-demo" id="mr" data-demo="1">
  <div class="mr__bar">
    <div class="mr__btns"></div>
    <p class="mr__live" data-r="live" aria-live="off" aria-atomic="true"><span class="mr__k">가까운 카드</span> <b data-r="near">-</b></p>
  </div>
  <div class="mr__wall" data-r="wall"><i class="mr__ring" data-r="ring"></i><i class="mr__cursor" data-r="cursor"></i></div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("mr");
    const CLS = { card: "mr__card" };
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let demo = !reduce;
    let raf = 0;
    let last = -1;
    let ready = false;
    const offs = [];
    function q(sel) {
        return root.querySelector(sel);
    }
    const wall = q("[data-r=wall]");
    const live = q("[data-r=live]");
    function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
    }
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    function on(el, type, fn) {
        el.addEventListener(type, fn);
        offs.push(function () {
            el.removeEventListener(type, fn);
        });
    }
    function stopDemo() {
        if (!demo) return;
        demo = false;
        root.removeAttribute("data-demo");
        root.classList.remove("is-demo");
        live.setAttribute("aria-live", "polite");
    }
    if (reduce) live.setAttribute("aria-live", "polite");
    // 카드: 시드 LCG 로 비율을 뽑는다. 이미지 파일은 없고 그라디언트와 번호만 있다.
    function makeCards(n, seed, lo, hi) {
        const rng = makeRng(seed);
        const list = [];
        for (let i = 0; i < n; i += 1) {
            const el = document.createElement("div");
            el.className = CLS.card;
            el.setAttribute("data-c", String(i % 6));
            el.innerHTML = "<i>" + (i + 1) + "</i>";
            wall.appendChild(el);
            list.push({
                el: el, ratio: lo + rng() * (hi - lo), cat: Math.floor(rng() * 3),
                x: 0, y: 0, w: 0, h: 0, tx: 0, ty: 0, tw: 0, th: 0,
                s: 1, ds: 1, o: 1, dop: 1, vx: 0, vy: 0,
                ox: 0, oy: 0, osx: 0, osy: 0, ovx: 0, ovy: 0, ovsx: 0, ovsy: 0,
                fx: 0, fy: 0, fs: 1, fo: 1, t0: 0, sq: 0, rest: 0, wait: 0
            });
        }
        return list;
    }
    function colW(cols, gap) {
        return (wall.clientWidth - gap * (cols - 1)) / cols;
    }
    // 최단 열 배치: 카드를 순서대로 읽으며 지금 가장 낮은 열 끝에 얹고 그 열 높이에 카드 높이와 간격을 더한다.
    function pack(hs, cols, cw, gap) {
        const colH = [];
        for (let k = 0; k < cols; k += 1) colH.push(0);
        const out = [];
        for (let i = 0; i < hs.length; i += 1) {
            let best = 0;
            for (let k = 1; k < cols; k += 1) {
                if (colH[k] < colH[best] - 0.5) best = k;
            }
            out.push({ x: best * (cw + gap), y: colH[best] });
            colH[best] += hs[i] + gap;
        }
        return out;
    }
    function put(c, x, y, sx, sy) {
        const st = c.el.style;
        st.width = c.w.toFixed(1) + "px";
        st.height = c.h.toFixed(1) + "px";
        st.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0) scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ")";
    }
    function frame(ts) {
        const dt = last < 0 ? 0.016 : Math.min(0.05, (ts - last) / 1000);
        last = ts;
        if (demo) script(ts);
        step(dt, ts);
        render();
        raf = requestAnimationFrame(frame);
    }
    const ro = new ResizeObserver(function () {
        relayout();
    });
    ro.observe(root);

    // 기법: 포인터와 카드 중심의 거리 d 에 가우시안 감쇠 exp(-FALLOFF (d / LENS_RADIUS)^2) 를 곱해 확대량을 정하고, 매 프레임 LERP 비율만큼만 따라간다.
    const LENS_RADIUS = 140;
    const GAIN = 0.55;
    const FALLOFF = 3;
    const LERP = 0.16;
    const PUSH = 18;
    const COLUMNS = 4;
    const GAP = 8;
    const SEED = 9;
    const COUNT = 12;
    const cards = makeCards(COUNT, SEED, 0.3, 0.7);
    const cursor = q("[data-r=cursor]");
    const ring = q("[data-r=ring]");
    const nearEl = q("[data-r=near]");
    let px = 0;
    let py = 0;
    let has = false;
    let nearIdx = -1;
    ring.style.width = LENS_RADIUS * 2 + "px";
    ring.style.height = LENS_RADIUS * 2 + "px";
    for (let i = 0; i < cards.length; i += 1) {
        const el = cards[i].el;
        el.tabIndex = 0;
        on(el, "focus", function () {
            stopDemo();
            const c = cards[i];
            px = c.tx + c.w / 2;
            py = c.ty + c.h / 2;
            has = true;
            sync();
        });
        on(el, "blur", function () {
            has = false;
            sync();
        });
    }
    function relayout() {
        const cw = colW(COLUMNS, GAP);
        const hs = cards.map(function (c) {
            return c.ratio * cw;
        });
        const at = pack(hs, COLUMNS, cw, GAP);
        for (let i = 0; i < cards.length; i += 1) {
            const c = cards[i];
            c.w = cw;
            c.h = hs[i];
            c.tx = at[i].x;
            c.ty = at[i].y;
        }
        ready = true;
        sync();
    }
    function aim(f) {
        let best = -1;
        let bestD = 1e9;
        for (let i = 0; i < cards.length; i += 1) {
            const c = cards[i];
            let ds = 1;
            let ux = 0;
            let uy = 0;
            let lift = 0;
            if (has) {
                const dx = c.tx + c.w / 2 - px;
                const dy = c.ty + c.h / 2 - py;
                const d = Math.sqrt(dx * dx + dy * dy);
                const g = Math.exp(-FALLOFF * (d / LENS_RADIUS) * (d / LENS_RADIUS));
                ds = 1 + GAIN * g - 0.06 * (1 - g);
                if (d > 1) {
                    ux = (dx / d) * PUSH * 4 * g * (1 - g);
                    uy = (dy / d) * PUSH * 4 * g * (1 - g);
                }
                lift = g;
                if (d < bestD) {
                    bestD = d;
                    best = i;
                }
            }
            const k = reduce ? 1 : 1 - Math.pow(1 - LERP, f);
            c.s += (ds - c.s) * k;
            c.ox += (ux - c.ox) * k;
            c.oy += (uy - c.oy) * k;
            c.fo = lift;
        }
        if (best !== nearIdx) {
            nearIdx = best;
            nearEl.textContent = best < 0 ? "-" : String(best + 1);
        }
    }
    function sync() {
        if (reduce) {
            aim(1);
            render();
        }
    }
    function script(ts) {
        const a = (ts % 2000) / 2000 * Math.PI * 2;
        px = wall.clientWidth * (0.5 + 0.36 * Math.sin(a));
        py = wall.clientHeight * (0.5 + 0.3 * Math.sin(2 * a + 1));
        has = true;
    }
    function step(dt, ts) {
        aim(dt * 60);
    }
    function render() {
        for (let i = 0; i < cards.length; i += 1) {
            const c = cards[i];
            // 확대된 카드가 벽 밖으로 잘리지 않게 중심을 벽 안으로 붙잡는다.
            const gx = Math.max(0, (c.w * (c.s - 1)) / 2);
            const gy = Math.max(0, (c.h * (c.s - 1)) / 2);
            put(c, clamp(c.tx + c.ox, gx, wall.clientWidth - c.w - gx), clamp(c.ty + c.oy, gy, wall.clientHeight - c.h - gy), c.s, c.s);
            c.el.style.zIndex = String(1 + Math.round((c.s - 1) * 20));
            c.el.style.setProperty("--lift", c.fo.toFixed(2));
        }
        cursor.style.display = has ? "" : "none";
        ring.style.display = has ? "block" : "none";
        cursor.style.transform = "translate3d(" + px.toFixed(1) + "px," + py.toFixed(1) + "px,0)";
        ring.style.transform = "translate3d(" + (px - LENS_RADIUS).toFixed(1) + "px," + (py - LENS_RADIUS).toFixed(1) + "px,0)";
    }
    function aimAt(e) {
        const r = wall.getBoundingClientRect();
        px = e.clientX - r.left;
        py = e.clientY - r.top;
        has = true;
        sync();
    }
    on(wall, "pointermove", function (e) {
        stopDemo();
        aimAt(e);
    });
    on(wall, "pointerdown", function (e) {
        stopDemo();
        wall.setPointerCapture(e.pointerId);
        aimAt(e);
    });
    on(wall, "pointerup", function (e) {
        if (e.pointerType !== "mouse") {
            has = false;
            sync();
        }
    });
    on(wall, "pointerleave", function () {
        if (!demo) {
            has = false;
            sync();
        }
    });

    relayout();
    if (reduce) {
        render();
    } else {
        raf = requestAnimationFrame(frame);
    }

})();
</script>
</body>
</html>
