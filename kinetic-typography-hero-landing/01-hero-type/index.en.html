<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinetic hero headline — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="hero is-demo">
    <p class="hero__eyebrow">KINETIC</p>
    <h1 class="hero__headline">
      <span class="word"><span class="word__inner">Thought's</span></span>
      <span class="word"><span class="word__inner">speed —</span></span>
      <span class="word"><span class="word__inner">we build.</span></span>
    </h1>
    <button class="hero__cta" type="button">Get started</button>
  </div>
</main>
<script>
// 글자별 노이즈 오프셋 + 벡터필드 진입 (형태2차) — 글자를 span 으로 쪼개고
// 결정론 해시로 출발점/경유점 변수만 심는다. 애니메이션 자체는 style.scss 의 keyframes 가 we build..
// 원리: 각 글자의 (글자index, 단어index) 로부터 0..1 해시를 3개 뽑아
//   출발점 --nx0/--ny0/--nr0 : 화면 밖 아래쪽, 글자마다 제각각인 흩뿌림
//   경유점 --wx/--wy/--wr   : 회전 힘장 v(x,y) = ω×(x,y) 를 출발점에서 dt 만큼 적분한 한 점 —
//                             직선이 아니라 힘장을 따라 휘어져 들어온다
(function () {
  function hash(n) {           // 정수 → 0..1 결정론 난수 (sin 해시 — 077 캔버스 축과 같은 계열)
    var s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  document.querySelectorAll('.hero .word__inner').forEach(function (word, w) {
    var text = word.textContent;
    word.textContent = '';
    for (var c = 0; c < text.length; c++) {
      var ch = document.createElement('span');
      if (text[c] === ' ') { ch.className = 'char char--space'; }
      else {
        ch.className = 'char';
        ch.textContent = text[c];
        var s = w * 97 + c * 13 + 5;
        var h1 = hash(s), h2 = hash(s + 1), h3 = hash(s + 2), h4 = hash(s + 3);
        var ang = h1 * Math.PI * 2;                       // 흩뿌리는 방향
        var rad = 26 + h2 * 46;                            // 흩뿌리는 반경(px)
        var x0 = Math.cos(ang) * rad, y0 = 40 + h3 * 34;   // 출발 오프셋
        var rot0 = (h4 - .5) * 44;                         // 출발 기울기(deg)
        // 회전 힘장 v(p) = ω × p 를 출발점에서 dt 적분 — v = ω*(-y, x), dt=0.55, ω=0.9
        var wx = x0 - 0.9 * y0 * 0.55, wy = y0 + 0.9 * x0 * 0.55;
        var wr = rot0 * 0.4;                               // 경유점에서 절반쯤 펴져 있다
        ch.style.setProperty('--nx0', x0.toFixed(1) + 'px');
        ch.style.setProperty('--ny0', y0.toFixed(1) + 'px');
        ch.style.setProperty('--nr0', rot0.toFixed(1) + 'deg');
        ch.style.setProperty('--wx', (wx * .8).toFixed(1) + 'px');
        ch.style.setProperty('--wy', (wy * .18 + 8).toFixed(1) + 'px');
        ch.style.setProperty('--wr', wr.toFixed(1) + 'deg');
        ch.style.animationDelay = (-w * 0.18 - c * 0.045).toFixed(3) + 's';
      }
      word.appendChild(ch);
    }
  });
})();
</script>
</body>
</html>
