<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinetic wordmark nav — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <nav class="navbar is-demo">
    <span class="navbar__brand">KINETIC</span>
    <div class="navbar__right">
      <span class="navbar__link">About</span>
      <span class="navbar__link">Pricing</span>
      <button class="navbar__cta" type="button">Get started</button>
    </div>
  </nav>
</main>
<script>
// 워드마크 글자별 노이즈 오프셋 + 벡터필드 진입 (형태2차) — KINETIC 7글자를 span 으로 쪼개고
// 결정론 해시로 출발점/경유점 변수만 심는다. 프레임은 style.scss 의 char-flow 키프레임이 we build..
// 기존 brand-shrink(컨테이너 스케일) 와 겹쳐 — 글자는 흩어졌다 힘장을 따라 모이고, 그 위에 워드마크 전체가 줄었다 커진다.
(function () {
  function hash(n) {           // 정수 → 0..1 결정론 난수 (sin 해시)
    var s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  document.querySelectorAll('.navbar .navbar__brand').forEach(function (brand) {
    var text = brand.textContent;
    brand.textContent = '';
    for (var c = 0; c < text.length; c++) {
      var ch = document.createElement('span');
      if (text[c] === ' ') { ch.className = 'char char--space'; }
      else {
        ch.className = 'char';
        ch.textContent = text[c];
        var s = c * 13 + 5;
        var h1 = hash(s), h2 = hash(s + 1), h3 = hash(s + 2), h4 = hash(s + 3);
        var ang = h1 * Math.PI * 2;
        var rad = 10 + h2 * 18;
        var x0 = Math.cos(ang) * rad, y0 = 14 + h3 * 12;
        var rot0 = (h4 - .5) * 30;
        var wx = x0 - 0.9 * y0 * 0.55, wy = y0 + 0.9 * x0 * 0.55;
        var wr = rot0 * 0.4;
        ch.style.setProperty('--nx0', x0.toFixed(1) + 'px');
        ch.style.setProperty('--ny0', y0.toFixed(1) + 'px');
        ch.style.setProperty('--nr0', rot0.toFixed(1) + 'deg');
        ch.style.setProperty('--wx', (wx * .6).toFixed(1) + 'px');
        ch.style.setProperty('--wy', (wy * .18 + 3).toFixed(1) + 'px');
        ch.style.setProperty('--wr', wr.toFixed(1) + 'deg');
        ch.style.animationDelay = (-0.05 * c).toFixed(3) + 's';
      }
      brand.appendChild(ch);
    }
  });
})();
</script>
</body>
</html>
