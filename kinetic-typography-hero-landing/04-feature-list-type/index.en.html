<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinetic feature list wave — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="feature-list is-demo">
    <li class="feature-list__row">
      <span class="feature-list__index">01</span>
      <span class="feature-list__label">Real-time collaboration</span>
    </li>
    <li class="feature-list__row">
      <span class="feature-list__index">02</span>
      <span class="feature-list__label">Auto-deploy</span>
    </li>
    <li class="feature-list__row">
      <span class="feature-list__index">03</span>
      <span class="feature-list__label">Team dashboard</span>
    </li>
  </ul>
</main>
<script>
// 라벨 글자별 노이즈 오프셋 + 벡터필드 진입 (형태2차) — 각 라벨을 span 으로 쪼개고
// 결정론 해시로 출발점/경유점 변수만 심는다. 프레임은 style.scss 의 char-flow 키프레임이 we build..
// 기존 row-shift·underline-grow 와 겹쳐 — 글자는 흩어졌다 힘장을 따라 자리 잡고, 줄 전체는 밀리며 밑줄이 그어진다.
(function () {
  function hash(n) {           // 정수 → 0..1 결정론 난수 (sin 해시)
    var s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  document.querySelectorAll('.feature-list .feature-list__label').forEach(function (label, r) {
    var text = label.childNodes.length ? label.textContent : '';
    // 밑줄 ::after 는 텍스트 노드가 아니니 안전 — 첫 텍스트 노드만 쪼갠다
    var walker = label.firstChild;
    if (!walker || walker.nodeType !== 3) return;
    var frag = document.createDocumentFragment();
    for (var c = 0; c < walker.textContent.length; c++) {
      var t = walker.textContent[c];
      var ch = document.createElement('span');
      if (t === ' ') { ch.className = 'char char--space'; }
      else {
        ch.className = 'char';
        ch.textContent = t;
        var s = r * 89 + c * 13 + 5;
        var h1 = hash(s), h2 = hash(s + 1), h3 = hash(s + 2), h4 = hash(s + 3);
        var ang = h1 * Math.PI * 2;
        var rad = 8 + h2 * 15;
        var x0 = Math.cos(ang) * rad, y0 = 10 + h3 * 10;
        var rot0 = (h4 - .5) * 26;
        var wx = x0 - 0.9 * y0 * 0.55, wy = y0 + 0.9 * x0 * 0.55;
        var wr = rot0 * 0.4;
        ch.style.setProperty('--nx0', x0.toFixed(1) + 'px');
        ch.style.setProperty('--ny0', y0.toFixed(1) + 'px');
        ch.style.setProperty('--nr0', rot0.toFixed(1) + 'deg');
        ch.style.setProperty('--wx', (wx * .6).toFixed(1) + 'px');
        ch.style.setProperty('--wy', (wy * .18 + 2).toFixed(1) + 'px');
        ch.style.setProperty('--wr', wr.toFixed(1) + 'deg');
        ch.style.animationDelay = (-0.14 * r - 0.04 * c).toFixed(3) + 's';
      }
      frag.appendChild(ch);
    }
    label.replaceChild(frag, walker);
  });
})();
</script>
</body>
</html>
