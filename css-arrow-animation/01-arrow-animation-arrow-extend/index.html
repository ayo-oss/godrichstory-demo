<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extending arrow — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <a class="ae-link is-demo" href="#">
    <span class="ae-link__label">Learn more</span>
    <span class="ae-link__arrow">
      <span class="ae-link__shaft"></span>
      <span class="ae-link__head"></span>
      <span class="ae-link__trail ae-link__trail--1" aria-hidden="true"></span>
      <span class="ae-link__trail ae-link__trail--2" aria-hidden="true"></span>
    </span>
  </a>
</main>
</body>
</html>
