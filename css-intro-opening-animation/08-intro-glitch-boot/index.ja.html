<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>グリッチ起動 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="gl is-demo" id="gl" aria-label="サイトの最初の画面">
    <div class="gl__head">
      <p class="gl__kicker">新作発表</p>
      <div class="gl__titlewrap">
        <h1 class="gl__title">ネオンアーケード</h1>
        <span class="gl__slice gl__slice--a" aria-hidden="true">ネオンアーケード</span>
        <span class="gl__slice gl__slice--b" aria-hidden="true">ネオンアーケード</span>
      </div>
    </div>
    <div class="gl__aside" id="content">
      <p class="gl__sub">今夜8時、新作公開</p>
      <button class="gl__cta" type="button">通知を受け取る</button>
    </div>
    <button class="gl__skip" id="skip" type="button">スキップ</button>
    <p class="gl__sr" id="status" aria-live="polite">イントロ再生中</p>
  </section>
</main>
<script>
(function () {
  var root = document.getElementById('gl');
  var aside = document.getElementById('content');
  var status = document.getElementById('status');
  var KEY = 'godrich-intro08-seen';
  var MSG_DONE = 'イントロが終わりました';
  function finish() {
    if (root.classList.contains('is-done')) { return; }
    root.classList.add('is-done');
    status.textContent = MSG_DONE;
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
  }
  // 한 번 본 브라우저에서는 처음부터 완료 상태
  try { if (sessionStorage.getItem(KEY)) { finish(); } } catch (e) {}
  document.getElementById('skip').addEventListener('click', finish);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { finish(); }
  });
  // 격자 미리보기 루프(.is-demo)는 손이 닿으면 실제 인트로(한 번 재생)로 넘어간다
  root.addEventListener('pointerdown', function () { root.classList.remove('is-demo'); }, { once: true });
  // 실제 인트로의 마지막 애니메이션(부제·버튼 안착)이 끝나면 완료로 기록한다
  aside.addEventListener('animationend', function (e) {
    if (e.target === aside) { finish(); }
  });
})();
</script>
</body>
</html>
