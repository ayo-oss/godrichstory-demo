<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一文字ずつのマスク — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tt is-demo" id="tt">
  <h1 class="tt__row" aria-label="GODRICH">
    <span class="tt__box" aria-hidden="true" style="--i:0"><span class="tt__ch">G</span></span>
    <span class="tt__box" aria-hidden="true" style="--i:1"><span class="tt__ch">O</span></span>
    <span class="tt__box" aria-hidden="true" style="--i:2"><span class="tt__ch">D</span></span>
    <span class="tt__box" aria-hidden="true" style="--i:3"><span class="tt__ch">R</span></span>
    <span class="tt__box" aria-hidden="true" style="--i:4"><span class="tt__ch">I</span></span>
    <span class="tt__box" aria-hidden="true" style="--i:5"><span class="tt__ch">C</span></span>
    <span class="tt__box" aria-hidden="true" style="--i:6"><span class="tt__ch">H</span></span>
  </h1>
  <span class="tt__line" aria-hidden="true"></span>
  <div class="tt__mbox"><p class="tt__sub">物語が積もる場所</p></div>
  <div class="tt__mbox"><button class="tt__go" type="button">購読する</button></div>
  <button class="tt__skip" id="tt-skip" type="button">スキップ</button>
  <p class="tt__live" id="tt-live" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('tt');
  var live = document.getElementById('tt-live');
  var KEY = 'godrich-intro-016-03';
  // 인트로를 완료 상태로 보낸다 — 낱글자의 기본 상태는 올라온 자리라 애니메이션을 끄면 제목이 완성되어 있다
  function finish(announce) {
    root.classList.remove('is-demo');
    root.classList.add('is-done');
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
    if (announce) live.textContent = 'イントロをスキップしました';
  }
  document.getElementById('tt-skip').addEventListener('click', function () { finish(true); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') finish(true);
  });
  var seen = false;
  try { seen = sessionStorage.getItem(KEY) !== null; } catch (e) {}
  if (seen) finish(false);
})();
</script>
</body>
</html>
