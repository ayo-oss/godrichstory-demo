<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>円形マスクワイプ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="iw is-demo" id="iw">
  <div class="iw__cover" aria-hidden="true"><span class="iw__seed"></span></div>
  <div class="iw__site">
    <div class="iw__box">
      <p class="iw__kicker">ポートフォリオ 2026</p>
      <h1 class="iw__title">光で描く画面</h1>
      <p class="iw__sub">スクロールでプロジェクトが続きます</p>
      <a class="iw__cta" href="#">プロジェクトを見る</a>
    </div>
  </div>
  <button class="iw__skip" type="button" id="iwSkip">スキップ</button>
  <p class="iw__sr" aria-live="polite" id="iwLive"></p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('iw');
  var skipBtn = document.getElementById('iwSkip');
  var live = document.getElementById('iwLive');
  var KEY = 'intro04-seen';
  // 스킵은 인트로를 그 자리의 완료 상태로 끝낸다 — 완료 = 애니메이션 없는 기본 CSS 상태라 클래스 하나로 된다
  function complete(msg) {
    root.classList.remove('is-demo');
    root.classList.add('is-done');
    skipBtn.hidden = true;
    live.textContent = msg;
    try { sessionStorage.setItem(KEY, '1'); } catch (err) { /* 접근이 막힌 브라우저는 저장 없이 진행 */ }
  }
  skipBtn.addEventListener('click', function () { complete('イントロをスキップしました'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') complete('イントロをスキップしました');
  });
  // 한 번 본 세션은 처음부터 완료 상태로 시작한다
  try {
    if (sessionStorage.getItem(KEY)) {
      root.classList.remove('is-demo');
      root.classList.add('is-done');
      skipBtn.hidden = true;
      live.textContent = '見済みのイントロのためすぐ開きました';
    }
  } catch (err) { /* sessionStorage 접근이 막히면 그냥 인트로를 보여준다 */ }
})();
</script>
</body>
</html>
