<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카운트다운 리드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cd is-demo" id="cd">
  <div class="cd__site">
    <div class="cd__box">
      <p class="cd__kicker">실시간 라이브</p>
      <h1 class="cd__title">오늘 밤 아홉 시</h1>
      <p class="cd__sub">카운트다운이 끝나면 바로 입장합니다</p>
      <a class="cd__cta" href="#">입장하기</a>
    </div>
  </div>
  <div class="cd__nums" aria-hidden="true">
    <span class="cd__n cd__n--3"><span class="cd__pop">3</span></span>
    <span class="cd__n cd__n--2"><span class="cd__pop">2</span></span>
    <span class="cd__n cd__n--1"><span class="cd__pop">1</span></span>
    <span class="cd__tag">곧 시작합니다</span>
  </div>
  <button class="cd__skip" type="button" id="cdSkip">건너뛰기</button>
  <p class="cd__sr" aria-live="polite" id="cdLive"></p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('cd');
  var skipBtn = document.getElementById('cdSkip');
  var live = document.getElementById('cdLive');
  var KEY = 'intro05-seen';
  // 스킵은 카운트다운을 건너뛰어 첫 화면(기본 CSS 상태)으로 바로 보내준다
  function complete(msg) {
    root.classList.remove('is-demo');
    root.classList.add('is-done');
    skipBtn.hidden = true;
    live.textContent = msg;
    try { sessionStorage.setItem(KEY, '1'); } catch (err) { /* 접근이 막힌 브라우저는 저장 없이 진행 */ }
  }
  skipBtn.addEventListener('click', function () { complete('인트로를 건너뛰었습니다'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') complete('인트로를 건너뛰었습니다');
  });
  // 한 번 본 세션은 처음부터 첫 화면으로 시작한다
  try {
    if (sessionStorage.getItem(KEY)) {
      root.classList.remove('is-demo');
      root.classList.add('is-done');
      skipBtn.hidden = true;
      live.textContent = '이미 본 인트로라 바로 열었습니다';
    }
  } catch (err) { /* sessionStorage 접근이 막히면 그냥 카운트다운을 보여준다 */ }
})();
</script>
</body>
</html>
