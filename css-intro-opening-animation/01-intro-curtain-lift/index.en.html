<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curtain lift — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cl is-demo" id="cl">
  <section class="cl__site">
    <h1 class="cl__title">A new story begins</h1>
    <p class="cl__sub">A new story every week</p>
    <button class="cl__cta" type="button">Get started</button>
  </section>
  <div class="cl__veil cl__veil--top" aria-hidden="true"></div>
  <div class="cl__veil cl__veil--bot" aria-hidden="true"><span class="cl__brand">GODRICH</span></div>
  <button class="cl__skip" id="cl-skip" type="button">Skip</button>
  <p class="cl__live" id="cl-live" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('cl');
  var live = document.getElementById('cl-live');
  var KEY = 'godrich-intro-016-01';
  // 인트로를 완료 상태로 보낸다 — 애니메이션을 끄면 기본 상태(열린 화면)가 그대로 드러난다
  function finish(announce) {
    root.classList.remove('is-demo');
    root.classList.add('is-done');
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
    if (announce) live.textContent = 'Skipped the intro';
  }
  document.getElementById('cl-skip').addEventListener('click', function () { finish(true); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') finish(true);
  });
  var seen = false;
  try { seen = sessionStorage.getItem(KEY) !== null; } catch (e) {}
  if (seen) finish(false);
})();
</script>
</body>
</html>
