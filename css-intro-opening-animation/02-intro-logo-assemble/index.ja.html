<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロゴ組み立て — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="la is-demo" id="la">
  <div class="la__mark" aria-hidden="true">
    <i class="la__q la__q--tl"></i>
    <i class="la__q la__q--tr"></i>
    <i class="la__q la__q--br"></i>
    <i class="la__q la__q--bl"></i>
  </div>
  <p class="la__word">GODRICH</p>
  <p class="la__tag">新しいブランドの最初のあいさつ</p>
  <button class="la__go" type="button">見てみる</button>
  <button class="la__skip" id="la-skip" type="button">スキップ</button>
  <p class="la__live" id="la-live" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('la');
  var live = document.getElementById('la-live');
  var KEY = 'godrich-intro-016-02';
  // 인트로를 완료 상태로 보낸다 — 조각의 기본 상태는 맞춰진 자리라 애니메이션을 끄면 로고가 완성되어 있다
  function finish(announce) {
    root.classList.remove('is-demo');
    root.classList.add('is-done');
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
    if (announce) live.textContent = 'イントロをスキップしました';
  }
  document.getElementById('la-skip').addEventListener('click', function () { finish(true); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') finish(true);
  });
  var seen = false;
  try { seen = sessionStorage.getItem(KEY) !== null; } catch (e) {}
  if (seen) finish(false);
})();
</script>
</body>
</html>
