<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line drawing frame — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld is-demo" id="ld">
  <figure class="ld__frame">
    <svg class="ld__svg" viewBox="0 0 320 200" aria-hidden="true" focusable="false">
      <rect class="ld__rect" x="6" y="6" width="308" height="188" rx="8" pathLength="100" />
    </svg>
    <div class="ld__inner">
      <p class="ld__kicker">Fall special exhibition</p>
      <h1 class="ld__title">Ark of lines</h1>
      <p class="ld__sub">October 4 through 28</p>
    </div>
  </figure>
  <button class="ld__skip" type="button" id="ldSkip">Skip</button>
  <p class="ld__sr" aria-live="polite" id="ldLive"></p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('ld');
  var skipBtn = document.getElementById('ldSkip');
  var live = document.getElementById('ldLive');
  var KEY = 'intro06-seen';
  // 스킵은 그리기를 끝내고 완성된 표지(기본 CSS 상태)로 바로 보내준다
  function complete(msg) {
    root.classList.remove('is-demo');
    root.classList.add('is-done');
    skipBtn.hidden = true;
    live.textContent = msg;
    try { sessionStorage.setItem(KEY, '1'); } catch (err) { /* 접근이 막힌 브라우저는 저장 없이 진행 */ }
  }
  skipBtn.addEventListener('click', function () { complete('Skipped the intro'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') complete('Skipped the intro');
  });
  // 한 번 본 세션은 처음부터 완성된 표지로 시작한다
  try {
    if (sessionStorage.getItem(KEY)) {
      root.classList.remove('is-demo');
      root.classList.add('is-done');
      skipBtn.hidden = true;
      live.textContent = 'Intro already seen, opened right away';
    }
  } catch (err) { /* sessionStorage 접근이 막히면 그냥 그리기를 보여준다 */ }
})();
</script>
</body>
</html>
