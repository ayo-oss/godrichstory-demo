<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스플릿 스크린 오픈 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="scr is-demo" id="scr" aria-label="사이트 첫 화면">
    <div class="scr__content" id="content">
      <p class="scr__kicker">에디션 12</p>
      <h1 class="scr__title">이야기 공작소</h1>
      <p class="scr__sub">매주 금요일, 짧은 이야기 하나</p>
      <button class="scr__cta" type="button">구독하기</button>
    </div>
    <div class="scr__panel scr__panel--l" aria-hidden="true"><span class="scr__word">이야기</span></div>
    <div class="scr__panel scr__panel--r" aria-hidden="true"><span class="scr__word">공작소</span></div>
    <span class="scr__seam" aria-hidden="true"></span>
    <button class="scr__skip" id="skip" type="button">건너뛰기</button>
    <p class="scr__sr" id="status" aria-live="polite">인트로 재생 중</p>
  </section>
</main>
<script>
(function () {
  var root = document.getElementById('scr');
  var content = document.getElementById('content');
  var status = document.getElementById('status');
  var KEY = 'godrich-intro07-seen';
  var MSG_DONE = '인트로가 끝났습니다';
  function finish() {
    if (root.classList.contains('is-done')) { return; }
    root.classList.add('is-done');
    status.textContent = MSG_DONE;
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
  }
  // 한 번 본 브라우저에서는 처음부터 완료 상태
  try { if (sessionStorage.getItem(KEY)) { finish(); } } catch (e) {}
  document.getElementById('skip').addEventListener('click', finish);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { finish(); }
  });
  // 격자 미리보기 루프(.is-demo)는 손이 닿으면 실제 인트로(한 번 재생)로 넘어간다
  root.addEventListener('pointerdown', function () { root.classList.remove('is-demo'); }, { once: true });
  // 실제 인트로의 마지막 애니메이션(콘텐츠 안착)이 끝나면 완료로 기록한다
  content.addEventListener('animationend', function (e) {
    if (e.target === content) { finish(); }
  });
})();
</script>
</body>
</html>
