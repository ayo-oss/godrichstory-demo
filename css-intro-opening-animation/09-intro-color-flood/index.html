<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컬러 플러드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="cf is-demo" id="cf" aria-label="사이트 첫 화면">
    <div class="cf__content" id="content">
      <p class="cf__kicker">2026 컬렉션</p>
      <h1 class="cf__title">컬러 스튜디오</h1>
      <p class="cf__sub">색으로 짠 새 컬렉션</p>
      <button class="cf__cta" type="button">컬렉션 보기</button>
    </div>
    <div class="cf__band cf__band--1" aria-hidden="true"></div>
    <div class="cf__band cf__band--2" aria-hidden="true"></div>
    <div class="cf__band cf__band--3" aria-hidden="true"></div>
    <button class="cf__skip" id="skip" type="button">건너뛰기</button>
    <p class="cf__sr" id="status" aria-live="polite">인트로 재생 중</p>
  </section>
</main>
<script>
(function () {
  var root = document.getElementById('cf');
  var content = document.getElementById('content');
  var status = document.getElementById('status');
  var KEY = 'godrich-intro09-seen';
  var MSG_DONE = '인트로가 끝났습니다';
  function finish() {
    if (root.classList.contains('is-done')) { return; }
    root.classList.add('is-done');
    status.textContent = MSG_DONE;
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
  }
  // 한 번 본 브라우저에서는 처음부터 완료 상태
  try { if (sessionStorage.getItem(KEY)) { finish(); } } catch (e) {}
  document.getElementById('skip').addEventListener('click', finish);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { finish(); }
  });
  // 격자 미리보기 루프(.is-demo)는 손이 닿으면 실제 인트로(한 번 재생)로 넘어간다
  root.addEventListener('pointerdown', function () { root.classList.remove('is-demo'); }, { once: true });
  // 실제 인트로의 마지막 애니메이션(콘텐츠 안착)이 끝나면 완료로 기록한다
  content.addEventListener('animationend', function (e) {
    if (e.target === content) { finish(); }
  });
})();
</script>
</body>
</html>
