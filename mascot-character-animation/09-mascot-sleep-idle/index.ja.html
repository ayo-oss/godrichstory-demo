<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>放っておくと眠る待機 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-moon" viewBox="0 0 256 256" fill="currentColor"><g><path d="M227.89 147.89A96 96 0 1 1 108.11 28.11a96.09 96.09 0 0 0 119.78 119.78" opacity=".2"/><path d="M233.54 142.23a8 8 0 0 0-8-2a88.08 88.08 0 0 1-109.8-109.8a8 8 0 0 0-10-10a104.84 104.84 0 0 0-52.91 37A104 104 0 0 0 136 224a103.1 103.1 0 0 0 62.52-20.88a104.84 104.84 0 0 0 37-52.91a8 8 0 0 0-1.98-7.98m-44.64 48.11A88 88 0 0 1 65.66 67.11a89 89 0 0 1 31.4-26A106 106 0 0 0 96 56a104.11 104.11 0 0 0 104 104a106 106 0 0 0 14.92-1.06a89 89 0 0 1-26.02 31.4"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="mb is-demo" id="mb">
  <p class="mb__hint">
    <svg class="mb__ico" aria-hidden="true"><use href="#ico-moon"/></svg>
    <span>入力がないと眠り、押すと起きます</span>
  </p>

  <div class="mb__floor">
    <!-- 캐릭터는 아이콘이 아니라 피사체라 손으로 그린다(01 과 같은 몸). Z 글자는 기호라 문구 사전이 필요 없다. -->
    <div class="mb__char" aria-label="起きたり眠ったりするマスコット" role="img">
      <span class="mb__body">
        <i class="mb__eye mb__eye--l"></i>
        <i class="mb__eye mb__eye--r"></i>
        <i class="mb__cheek mb__cheek--l"></i>
        <i class="mb__cheek mb__cheek--r"></i>
        <i class="mb__mouth"></i>
      </span>
      <span class="mb__zLayer" aria-hidden="true">
        <i class="mb__z mb__z--1" style="--i:0">Z</i>
        <i class="mb__z mb__z--2" style="--i:1">Z</i>
        <i class="mb__z mb__z--3" style="--i:2">Z</i>
      </span>
      <span class="mb__shadow"></span>
    </div>
  </div>

  <p class="mb__state">
    <i class="mb__dot" aria-hidden="true"></i>
    <span class="mb__stateText" id="mzState">起きている</span>
  </p>
</div>
</main>
<script>
// 유휴 타이머 — setTimeout 으로 데모에서는 짧게(3.6초) 재운다. 어떤 입력(pointerdown·keydown)이든
// clearTimeout 후 타이머를 처음부터 되돌리고, 자고 있으면 깨운다(.is-wake 팝 한 번).
// 격자 미리보기(.is-demo)가 돌고 있는 동안은 실제 타이머를 돌리지 않는다 — 미리보기가 잠드는 이야기를
// 대신 보여 주고, 사람이 처음 손을 댄 뒤부터 실제 유휴 타이머가 돈다(01 과 같은 넘김 구조).
(function () {
  var root = document.getElementById('mb');
  var state = document.getElementById('mzState');
  var AWAKE = '起きている';
  var ASLEEP = '眠っている';
  var IDLE_MS = 3600;
  var timer = null;

  function sleep() { root.classList.add('is-asleep'); state.textContent = ASLEEP; }
  function arm() { clearTimeout(timer); timer = setTimeout(sleep, IDLE_MS); }
  function wake() {
    var was = root.classList.contains('is-asleep');
    root.classList.remove('is-demo');
    if (was) {
      root.classList.remove('is-asleep');
      root.classList.add('is-wake');
      setTimeout(function () { root.classList.remove('is-wake'); }, 460);
      state.textContent = AWAKE;
    }
    arm();
  }

  document.addEventListener('pointerdown', wake);
  window.addEventListener('keydown', wake);
  if (!root.classList.contains('is-demo')) arm();
}());
</script>
</body>
</html>
