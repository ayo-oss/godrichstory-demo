<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idle breathing pose — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-smiley" viewBox="0 0 256 256" fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88M80 108a12 12 0 1 1 12 12a12 12 0 0 1-12-12m96 0a12 12 0 1 1-12-12a12 12 0 0 1 12 12m-1.08 48c-10.29 17.79-27.39 28-46.92 28s-36.63-10.2-46.92-28a8 8 0 1 1 13.84-8c7.47 12.91 19.21 20 33.08 20s25.61-7.1 33.08-20a8 8 0 1 1 13.84 8"/></symbol>
  </defs>
</svg>
<main class="stage">
<div class="mb is-demo" id="mb">
  <p class="mb__hint">
    <svg class="mb__ico" aria-hidden="true"><use href="#ico-smiley"/></svg>
    <span>This is the resting pose while nobody touches it</span>
  </p>

  <div class="mb__floor">
    <!-- 캐릭터는 아이콘이 아니라 이 데모의 피사체라 손으로 그린다 (blog-demo 규칙 4 는 UI 아이콘 이야기).
         몸은 하나의 타원, 눈·볼·입만 얹는다. 부품이 적을수록 Breath 한 번이 선명하다. -->
    <div class="mb__char" aria-label="A mascot standing still and breathing" role="img">
      <span class="mb__body">
        <i class="mb__eye mb__eye--l"></i>
        <i class="mb__eye mb__eye--r"></i>
        <i class="mb__cheek mb__cheek--l"></i>
        <i class="mb__cheek mb__cheek--r"></i>
        <i class="mb__mouth"></i>
      </span>
      <span class="mb__shadow"></span>
    </div>
  </div>

  <p class="mb__beat" id="beat">
    <span class="mb__beatLabel">Breath</span>
    <span class="mb__beatTrack"><i class="mb__beatFill"></i></span>
  </p>
</div>
</main>
<script>
// 사람이 화면에 손을 대면 미리보기 루프를 떼고 실제 상태로 넘어간다.
// 대기 포즈는 조작이 없는 것이 정상이라, 여기서는 눈 깜빡임만 JS 타이머로 이어 받는다.
(function () {
  var root = document.getElementById('mb');
  var awake = false;

  function blinkOnce() {
    root.classList.add('is-blink');
    setTimeout(function () { root.classList.remove('is-blink'); }, 120);
  }

  function wake() {
    if (awake) return;
    awake = true;
    root.classList.remove('is-demo');
    // 미리보기가 꺼져도 캐릭터가 멈춰 보이지 않게 깜빡임만 이어 간다
    setInterval(blinkOnce, 3200);
  }

  root.addEventListener('pointerdown', wake);
  root.addEventListener('pointerenter', wake);
}());
</script>
</body>
</html>
