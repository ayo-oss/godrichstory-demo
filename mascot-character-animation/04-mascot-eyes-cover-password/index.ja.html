<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パスワード欄で目を隠す — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-eye-closed" viewBox="0 0 256 256" fill="currentColor"><path d="M224 104c-16.81 20.81-47.63 48-96 48s-79.19-27.19-96-48c16.81-20.81 47.63-48 96-48s79.19 27.19 96 48" opacity=".2"/><path d="M228 175a8 8 0 0 1-10.92-3l-19-33.2A123.2 123.2 0 0 1 162 155.46l5.87 35.22a8 8 0 0 1-6.58 9.21a8.4 8.4 0 0 1-1.29.11a8 8 0 0 1-7.88-6.69l-5.77-34.58a133 133 0 0 1-36.68 0l-5.77 34.58A8 8 0 0 1 96 200a8.4 8.4 0 0 1-1.32-.11a8 8 0 0 1-6.58-9.21l5.9-35.22a123.2 123.2 0 0 1-36.06-16.69L39 172a8 8 0 1 1-13.94-8l20-35a153.5 153.5 0 0 1-19.3-20a8 8 0 1 1 12.46-10c16.6 20.54 45.64 45 89.78 45s73.18-24.49 89.78-45a8 8 0 1 1 12.44 10a153.5 153.5 0 0 1-19.3 20l20 35a8 8 0 0 1-2.92 11"/></symbol>
  </defs>
</svg>
<main class="stage">
<div class="mc is-demo" id="mc">
  <p class="mc__hint">
    <svg class="mc__ico" aria-hidden="true"><use href="#ico-eye-closed"/></svg>
    <span>パスワードを入れると目を隠します</span>
  </p>

  <div class="mc__row">
    <!-- 캐릭터는 장식이라 스크린낭독기에서는 없는 셈으로 한다(칩 aria-hidden).
         실제 상태 변화는 보기 단추의 aria-pressed 가 알린다. -->
    <div class="mc__char" aria-hidden="true">
      <span class="mc__body">
        <i class="mc__eye mc__eye--l"></i>
        <i class="mc__eye mc__eye--r"></i>
        <i class="mc__cheek mc__cheek--l"></i>
        <i class="mc__cheek mc__cheek--r"></i>
        <i class="mc__mouth"></i>
        <i class="mc__arm mc__arm--l"></i>
        <i class="mc__arm mc__arm--r"></i>
      </span>
    </div>

    <form class="mc__form" id="mcForm" autocomplete="off">
      <label class="mc__label" for="mcPw">パスワード</label>
      <span class="mc__field">
        <!-- 칩 type="password" — 보기 단추를 켜면 text 로, 끄면 다시 password 로 돌아온다 -->
        <input class="mc__input" id="mcPw" type="password" placeholder="パスワードを入力" autocomplete="off">
        <button class="mc__reveal" id="mcReveal" type="button" aria-pressed="false" aria-label="パスワードを表示">
          <svg class="mc__revealIco" aria-hidden="true"><use href="#ico-eye-closed"/></svg>
        </button>
        <!-- 미리보기에서만 글자가 들어오는 흉내를 내는 겹침. 정적 경로(사람이 직접 입력)에서는 보이지 않는다 -->
        <span class="mc__ghost" aria-hidden="true">•••••</span>
      </span>
      <p class="mc__note">表示ボタンで腕が下がります</p>
    </form>
  </div>
</div>
</main>
<script>
// パスワード 칸에서 눈 가리기 — input 이벤트로 팔을 올리고, 보기 단추로 내린다.
// 데모 미리보기(.is-demo)는 사람이 처음 손댈 때 떼고 실제 상태로 넘어간다.
(function () {
  var root = document.getElementById('mc');
  var form = document.getElementById('mcForm');
  var input = document.getElementById('mcPw');
  var btn = document.getElementById('mcReveal');
  var LABEL_SHOW = 'パスワードを表示';
  var LABEL_HIDE = 'パスワードを非表示';

  function wake() { root.classList.remove('is-demo'); }

  // 팔을 올릴 조건 — 글자가 하나라도 있고, 보기가 꺼져 있을 때
  function sync() {
    var shown = btn.getAttribute('aria-pressed') === 'true';
    root.classList.toggle('is-cover', input.value !== '' && !shown);
  }

  form.addEventListener('submit', function (e) { e.preventDefault(); });
  input.addEventListener('input', function () { wake(); sync(); });
  input.addEventListener('focus', wake);
  root.addEventListener('pointerenter', wake);

  btn.addEventListener('click', function () {
    wake();
    var on = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    input.type = on ? 'text' : 'password';
    btn.setAttribute('aria-label', on ? LABEL_HIDE : LABEL_SHOW);
    sync();
  });
}());
</script>
</body>
</html>
