<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>次のボタンを指す案内 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-arrow" viewBox="0 0 256 256" fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></symbol>
  </defs>
</svg>
<main class="stage">
<div class="pg is-demo" id="pg" data-step="0">
  <p class="pg__hint">
    <svg class="pg__ico" aria-hidden="true"><use href="#ico-arrow"/></svg>
    <span>何を押せばよいか腕が示します</span>
  </p>

  <div class="pg__row">
    <!-- 캐릭터는 피사체라 손으로 그린다 — 크림 몸에 잉크 이목구비, 오른쪽 버튼을 가리키는 팔 하나.
         팔의 축은 어깨, 눈동자는 버튼 쪽으로 같이 옮겨 간다. -->
    <div class="pg__char" aria-label="ボタンを指すマスコット" role="img">
      <i class="pg__arm"></i>
      <span class="pg__body">
        <i class="pg__eye pg__eye--l"><span class="pg__pupil"></span></i>
        <i class="pg__eye pg__eye--r"><span class="pg__pupil"></span></i>
        <i class="pg__cheek pg__cheek--l"></i>
        <i class="pg__cheek pg__cheek--r"></i>
        <i class="pg__mouth"></i>
      </span>
    </div>

    <div class="pg__side">
      <button class="pg__btn" id="pgNext" type="button">
        <span>次へ</span>
        <svg class="pg__btnIco" aria-hidden="true"><use href="#ico-arrow"/></svg>
      </button>
      <!-- 안내 문구 교체를 스크린 낭독기에 알리는 영역 — data-step 이 바뀌면 보이는 스팬이 갈린다 -->
      <p class="pg__say" aria-live="polite">
        <span class="pg__msg pg__msg--0">まずプロフィールを埋めましょう</span>
        <span class="pg__msg pg__msg--1">次に通知を選びます</span>
        <span class="pg__msg pg__msg--2">最後に開始を押します</span>
      </p>
    </div>
  </div>
</div>
</main>
<script>
// 다음 버튼을 가리키는 안내 — 격자 미리보기(.is-demo)를 떼고 실제 단계 진행을 맡는다.
// 단계 문구는 스팬 3개를 data-step 으로 갈아 끼운다(교체는 한 컷). 버튼은 <button> 이라
// 엔터·스페이스가 브라우저 기본 동작으로 그대로 먹는다. 식별자는 전부 영어다(BD22).
(function () {
  var root = document.getElementById('pg');
  var btn = document.getElementById('pgNext');
  var bumpTimer = null;

  function next() {
    var step = Number(root.getAttribute('data-step') || '0');
    root.classList.remove('is-demo');
    root.setAttribute('data-step', String((step + 1) % 3));
    root.classList.remove('is-bump');
    void root.offsetWidth;
    root.classList.add('is-bump');
    clearTimeout(bumpTimer);
    bumpTimer = setTimeout(function () { root.classList.remove('is-bump'); }, 700);
  }

  btn.addEventListener('click', next);
}());
</script>
</body>
</html>
