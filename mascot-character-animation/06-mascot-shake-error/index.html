<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고개 젓는 실패 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-smiley" viewBox="0 0 256 256" fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88M80 108a12 12 0 1 1 12 12a12 12 0 0 1-12-12m96 0a12 12 0 1 1-12-12a12 12 0 0 1 12 12m-1.08 48c-10.29 17.79-27.39 28-46.92 28s-36.63-10.2-46.92-28a8 8 0 1 1 13.84-8c7.47 12.91 19.21 20 33.08 20s25.61-7.1 33.08-20a8 8 0 1 1 13.84 8"/></symbol>
    <symbol id="ico-smiley-sad" viewBox="0 0 256 256" fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88M80 108a12 12 0 1 1 12 12a12 12 0 0 1-12-12m96 0a12 12 0 1 1-12-12a12 12 0 0 1 12 12m-1.08 64a8 8 0 1 1-13.84 8c-7.47-12.91-19.21-20-33.08-20s-25.61 7.1-33.08 20a8 8 0 1 1-13.84-8c10.29-17.79 27.39-28 46.92-28s36.63 10.2 46.92 28"/></symbol>
  </defs>
</svg>
<main class="stage">
<div class="mb is-demo" id="mb">
  <p class="mb__hint">
    <svg class="mb__ico" aria-hidden="true"><use href="#ico-smiley"/></svg>
    <span>값이 틀리면 캐릭터가 고개를 젓습니다</span>
  </p>

  <div class="mb__row">
    <!-- 캐릭터는 아이콘이 아니라 이 데모의 피사체라 손으로 그린다 (01 과 같은 몸·이목구비).
         얼굴은 두 벌(웃는·슬픈)을 겹쳐 두고 steps(1, end) 로 한 프레임에 갈아 끼운다. -->
    <div class="mb__char" aria-label="고개를 젓는 마스코트" role="img">
      <span class="mb__body">
        <span class="mb__head">
          <span class="mb__face mb__face--ok">
            <i class="mb__eye mb__eye--l"></i>
            <i class="mb__eye mb__eye--r"></i>
            <i class="mb__cheek mb__cheek--l"></i>
            <i class="mb__cheek mb__cheek--r"></i>
            <i class="mb__mouth mb__mouth--smile"></i>
          </span>
          <span class="mb__face mb__face--no">
            <i class="mb__eye mb__eye--l"></i>
            <i class="mb__eye mb__eye--r"></i>
            <i class="mb__brow mb__brow--l"></i>
            <i class="mb__brow mb__brow--r"></i>
            <i class="mb__cheek mb__cheek--l"></i>
            <i class="mb__cheek mb__cheek--r"></i>
            <i class="mb__mouth mb__mouth--frown"></i>
          </span>
        </span>
      </span>
      <span class="mb__shadow"></span>
    </div>

    <div class="mb__form">
      <label class="mb__label" for="mbField">아이디</label>
      <div class="mb__box">
        <input class="mb__input" id="mbField" type="text" placeholder="예: guest" autocomplete="off">
        <button class="mb__go" id="mbGo" type="button">로그인</button>
      </div>
      <!-- 오류는 색(테두리)만으로 알리지 않고 글자로도 말한다 (WCAG 1.4.1).
           role="alert" 는 assertive 실시간 영역 — 글이 나타나는 순간 스크린 리더가 읽는다.
           자리는 처음부터 확보(visibility 토글)해 등장할 때 줄이 튀지 않게 한다. -->
      <p class="mb__error" id="mbErr" role="alert" aria-live="assertive">
        <svg class="mb__errIco" aria-hidden="true"><use href="#ico-smiley-sad"/></svg>
        <span>아이디를 다시 확인해 주세요</span>
      </p>
    </div>
  </div>
</div>
</main>
<script>
// 확인을 누르면 루트에 is-shake 를 붙이고, 애니메이션이 끝나면(animationend) 뗀다.
// 정답은 가짜 값 guest — 실제 계정·비밀번호 문자열은 이 데모에 없다.
(function () {
  var root = document.getElementById('mb');
  var field = document.getElementById('mbField');
  var err = document.getElementById('mbErr');
  var go = document.getElementById('mbGo');
  var ANSWER = 'guest';

  function judge() {
    root.classList.remove('is-demo');
    var ok = field.value.trim().toLowerCase() === ANSWER;
    root.classList.toggle('is-no', !ok);
    if (ok) return;
    root.classList.remove('is-shake');
    void root.offsetWidth; // 클래스를 뗐다 붙여 흔들림을 처음 프레임부터 다시 튀긴다
    root.classList.add('is-shake');
    field.focus({ preventScroll: true });
  }

  function wake() { root.classList.remove('is-demo'); }

  go.addEventListener('click', judge);
  field.addEventListener('keydown', function (e) { if (e.key === 'Enter') judge(); });
  field.addEventListener('pointerdown', wake);
  // 흔들림이 끝나면 상태만 남기고 운동 클래스를 뗀다 — 다시 누르면 또 흔들린다
  root.addEventListener('animationend', function (e) {
    if (e.target.classList.contains('mb__box')) root.classList.remove('is-shake');
  });
}());
</script>
</body>
</html>
