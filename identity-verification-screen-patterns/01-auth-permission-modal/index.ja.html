<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permission request modal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="perm-scene is-demo">
    <div class="perm-scene__page">
      <span class="perm-scene__line"></span>
      <span class="perm-scene__line perm-scene__line--short"></span>
    </div>
    <div class="perm-scene__backdrop"></div>
    <div class="perm-scene__modal" role="alertdialog" aria-modal="true" aria-label="Camera access">
      <span class="perm-scene__icon" aria-hidden="true">
        <svg viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 56v56c0 96-88 120-88 120s-88-24-88-120V56a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 40H48a16 16 0 0 0-16 16v56c0 52.72 25.52 84.67 46.93 102.19c23.06 18.86 46 25.26 47 25.53a8 8 0 0 0 4.2 0c1-.27 23.91-6.67 47-25.53C198.48 196.67 224 164.72 224 112V56a16 16 0 0 0-16-16m0 72c0 37.07-13.66 67.16-40.6 89.42a129.3 129.3 0 0 1-39.4 22.2a128.3 128.3 0 0 1-38.92-22.2C61.66 175.16 48 145.07 48 108V56h160Z"/></g></svg>
      </span>
      <h2 class="perm-scene__title">Allow camera access?</h2>
      <p class="perm-scene__desc">Used only during identity verification.</p>
      <div class="perm-scene__actions">
        <button class="perm-scene__btn perm-scene__btn--ghost" type="button">Deny</button>
        <button class="perm-scene__btn perm-scene__btn--primary" type="button">Allow</button>
      </div>
    </div>
  </div>
</main>
<script>
(function(){
  var scene=document.querySelector('.perm-scene'),
      modal=scene.querySelector('.perm-scene__modal'),
      deny=scene.querySelector('.perm-scene__btn--ghost'),
      allow=scene.querySelector('.perm-scene__btn--primary');
  function close(){ scene.classList.remove('is-demo'); scene.classList.add('is-closed'); }
  deny.addEventListener('click', close);
  allow.addEventListener('click', close);
  modal.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
}());
</script>
</body>
</html>
