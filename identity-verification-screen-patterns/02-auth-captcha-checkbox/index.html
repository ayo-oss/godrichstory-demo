<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captcha verify checkbox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="captcha-card is-demo">
    <label class="captcha">
      <input class="captcha__input" type="checkbox">
      <span class="captcha__box">
        <span class="captcha__spinner" aria-hidden="true"></span>
        <svg class="captcha__check" viewBox="0 0 256 256" aria-hidden="true">
          <g fill="currentColor">
            <path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/>
            <path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0M232 128A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/>
          </g>
        </svg>
      </span>
      <span class="captcha__label">I'm not a robot</span>
    </label>
    <span class="captcha__badge">Verified</span>
  </div>
</main>
</body>
</html>
