<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Board Where Distance Becomes Heat Color and the Answer Appears as a Valley — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="hs is-demo" id="hs">
  <canvas class="hs__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="A board that paints each cell's detour as a heat color, fills from the lowest cells up, and reveals the shortest path as the valley floor. Press a cell to move the goal"></canvas>
  <p class="hs__status" data-role="status" aria-live="off">Filling from the cells with the least detour</p>
  <div class="hs__tools">
    <button class="hs__btn" data-role="replay" type="button">Reveal again</button>
    <button class="hs__btn" data-role="new" type="button">New maze</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("hs");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    // 파스텔 팔레트 — 어두운 무대 위에 밝은 바닥을 얹어 명도 차로 길이 읽힌다
    const BG = [29, 26, 44];
    const ROCK = [44, 39, 64];
    const PAPER = [255, 248, 234];
    const INK = [58, 48, 76];
    const MINT = [126, 226, 192];
    const SKY = [124, 196, 255];
    const LILAC = [190, 164, 255];
    const PINK = [255, 160, 190];
    const PEACH = [255, 208, 168];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !statusEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    const still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function onResize() {
        fitCanvas();
        draw();
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    // 화면 좌표(CSS px) → 장면 좌표(480x300). 리사이즈 뒤에도 늘 현재 크기로 다시 잰다
    function toScene(ev) {
        const r = cv.getBoundingClientRect();
        return [((ev.clientX - r.left) / r.width) * W, ((ev.clientY - r.top) / r.height) * H];
    }
    // 시드 고정 난수 — 같은 시드면 같은 미로가 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 격자 — 31×31 칸, 칸마다 벽 네 장을 비트 하나씩으로 든다
    const GRID_N = 31;
    const CELL_N = GRID_N * GRID_N;
    const CS = 9;
    const BOARD = GRID_N * CS;
    let BX = W - 12 - BOARD;
    const BY = (H - BOARD) / 2;
    const ENTRY = 0;
    const EXIT = CELL_N - 1;
    // 방향 0 북 · 1 동 · 2 남 · 3 서 — 시계 방향 순서라 +1 이 오른쪽으로 돌기, +3 이 왼쪽으로 돌기
    const DX = [0, 1, 0, -1];
    const DY = [-1, 0, 1, 0];
    const BIT = [1, 2, 4, 8];
    const ALL_WALLS = 15;
    function neighbor(i, d) {
        const x = (i % GRID_N) + DX[d];
        const y = Math.floor(i / GRID_N) + DY[d];
        return x < 0 || y < 0 || x >= GRID_N || y >= GRID_N ? -1 : y * GRID_N + x;
    }
    function isOpen(walls, i, d) {
        return (walls[i] & BIT[d]) === 0 && neighbor(i, d) >= 0;
    }
    // 벽 한 장 걷기 — 양쪽 칸의 비트를 함께 지운다 (한쪽만 지우면 길이 일방통행이 된다)
    function knock(walls, i, d) {
        const n = neighbor(i, d);
        walls[i] &= ~BIT[d];
        walls[n] &= ~BIT[(d + 2) % 4];
        return n;
    }
    function openCount(walls, i) {
        let c = 0;
        for (let d = 0; d < 4; d += 1) {
            if (isOpen(walls, i, d)) {
                c += 1;
            }
        }
        return c;
    }
    function cellX(i) { return BX + (i % GRID_N) * CS; }
    function cellY(i) { return BY + Math.floor(i / GRID_N) * CS; }
    function cellAt(sx, sy) {
        const x = Math.floor((sx - BX) / CS);
        const y = Math.floor((sy - BY) / CS);
        return x < 0 || y < 0 || x >= GRID_N || y >= GRID_N ? -1 : y * GRID_N + x;
    }
    function fillCell(i, c, a) {
        ctx.fillStyle = rgba(c, a);
        ctx.fillRect(cellX(i), cellY(i), CS, CS);
    }
    // 벽 비트를 선분으로 — 칸마다 동·남 벽만 긋고 맨 윗줄·맨 왼줄만 북·서 벽을 더 긋는다 (같은 벽을 두 번 긋지 않는다)
    function strokeWalls(walls, color, lw) {
        ctx.beginPath();
        for (let i = 0; i < CELL_N; i += 1) {
            const x = cellX(i);
            const y = cellY(i);
            const w = walls[i];
            if ((w & 2) !== 0) {
                ctx.moveTo(x + CS, y);
                ctx.lineTo(x + CS, y + CS);
            }
            if ((w & 4) !== 0) {
                ctx.moveTo(x, y + CS);
                ctx.lineTo(x + CS, y + CS);
            }
            if (i < GRID_N && (w & 1) !== 0) {
                ctx.moveTo(x, y);
                ctx.lineTo(x + CS, y);
            }
            if (i % GRID_N === 0 && (w & 8) !== 0) {
                ctx.moveTo(x, y);
                ctx.lineTo(x, y + CS);
            }
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = lw;
        ctx.lineCap = 'square';
        ctx.stroke();
    }
    // 입구(왼쪽 위)·출구(오른쪽 아래) 표시 — 바깥 벽 밖에 작은 삼각형
    function drawGates() {
        ctx.fillStyle = rgba(MINT, 0.95);
        ctx.beginPath();
        ctx.moveTo(BX - 9, BY + 1);
        ctx.lineTo(BX - 2, BY + CS / 2);
        ctx.lineTo(BX - 9, BY + CS - 1);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = rgba(PINK, 0.95);
        ctx.beginPath();
        ctx.moveTo(BX + BOARD + 2, BY + BOARD - CS + 1);
        ctx.lineTo(BX + BOARD + 9, BY + BOARD - CS / 2);
        ctx.lineTo(BX + BOARD + 2, BY + BOARD - 1);
        ctx.closePath();
        ctx.fill();
    }
    // 왼쪽 칸의 수치 — 이름표 한 줄 + 값 한 줄
    function panelRow(row, label, value) {
        const y = 104 + row * 34;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = rgba(PAPER, 0.62);
        ctx.font = '500 11px sans-serif';
        ctx.fillText(label, 16, y);
        ctx.fillStyle = rgba(PAPER, 0.96);
        ctx.font = '700 15px sans-serif';
        ctx.fillText(value, 16, y + 18);
    }
    function clearStage() {
        ctx.fillStyle = rgba(BG, 1);
        ctx.fillRect(0, 0, W, H);
    }
    // 깊이 우선 파기 한 번에 끝까지 — 스택 머리에서 안 판 이웃을 골라 벽을 걷고, 없으면 하나 뺀다
    function carveDfsAll(seed, start) {
        const walls = new Uint8Array(CELL_N).fill(ALL_WALLS);
        const seen = new Uint8Array(CELL_N);
        const stk = new Int32Array(CELL_N);
        const rnd = makeRng(seed);
        let sp = 0;
        stk[sp] = start;
        sp = 1;
        seen[start] = 1;
        const opts = [];
        while (sp > 0) {
            const cur = stk[sp - 1];
            opts.length = 0;
            for (let d = 0; d < 4; d += 1) {
                const n = neighbor(cur, d);
                if (n >= 0 && seen[n] === 0) {
                    opts.push(d);
                }
            }
            if (opts.length === 0) {
                sp -= 1;
                continue;
            }
            const n = knock(walls, cur, opts[Math.floor(rnd() * opts.length)]);
            seen[n] = 1;
            stk[sp] = n;
            sp += 1;
        }
        return walls;
    }
    // 너비 우선 거리 — 큐에서 꺼낸 칸의 열린 이웃에 거리+1 을 적는다. 닿지 않은 칸은 -1
    function bfsDist(walls, src) {
        const dist = new Int32Array(CELL_N).fill(-1);
        const q = new Int32Array(CELL_N);
        let head = 0;
        let tail = 0;
        dist[src] = 0;
        q[tail] = src;
        tail += 1;
        while (head < tail) {
            const c = q[head];
            head += 1;
            for (let d = 0; d < 4; d += 1) {
                if (!isOpen(walls, c, d)) {
                    continue;
                }
                const n = neighbor(c, d);
                if (dist[n] >= 0) {
                    continue;
                }
                dist[n] = dist[c] + 1;
                q[tail] = n;
                tail += 1;
            }
        }
        return dist;
    }
    // 온도 색 눈금 — 앞이 차갑고(돌아가지 않는 칸) 뒤로 갈수록 뜨겁다. 칸 값은 이웃한 두 눈금 사이를 선형 보간
    const THERMO_STOPS = [SKY, MINT, [250, 238, 186], PEACH, PINK];
    // 골짜기 바닥(Shortest path)을 얼마나 어둡게 파나 — 0 이면 음영 없음
    const VALLEY_DEPTH = 0.45;
    // 낮은 칸부터 차올라 판 전체가 드러나는 데 걸리는 시간
    const REVEAL_MS = 1500;
    // 돌아가는 거리 몇 칸까지를 골짜기 비탈로 보나
    const VALLEY_W = 28;
    const SEED = 464;
    const HOLD_MS = 1300;
    const TXT_RISE = 'Filling from the cells with the least detour';
    const TXT_DONE = 'Revealed — the valley floor is the shortest path';
    const replayBtn = root.querySelector('[data-role="replay"]');
    const newBtn = root.querySelector('[data-role="new"]');
    let pass = 0;
    let walls = carveDfsAll(SEED, ENTRY);
    let goal = EXIT;
    let excess = new Int32Array(CELL_N);
    let shortest = 0;
    let maxEx = 1;
    let floorN = 0;
    let revealT = 0;
    let holdLeft = 0;
    // 칸마다 「입구→칸 거리 + 칸→목표 거리 − Shortest」 = 그 칸을 거쳐 가면 더 걷는 칸 수. Shortest path 위는 정확히 0
    function computeField() {
        const ds = bfsDist(walls, ENTRY);
        const dg = bfsDist(walls, goal);
        shortest = ds[goal];
        maxEx = 1;
        floorN = 0;
        for (let i = 0; i < CELL_N; i += 1) {
            excess[i] = ds[i] + dg[i] - shortest;
            if (excess[i] > maxEx) {
                maxEx = excess[i];
            }
            if (excess[i] === 0) {
                floorN += 1;
            }
        }
        revealT = 0;
        holdLeft = 0;
    }
    function thermo(t) {
        const x = clamp(t, 0, 1) * (THERMO_STOPS.length - 1);
        const i = Math.min(Math.floor(x), THERMO_STOPS.length - 2);
        return mix(THERMO_STOPS[i], THERMO_STOPS[i + 1], x - i);
    }
    // 차오른 수위 — 처음엔 천천히(제곱) 올라 골짜기 바닥이 먼저 또렷하게 보인다
    function level() {
        const p = clamp(revealT / REVEAL_MS, 0, 1);
        return maxEx * p * p;
    }
    function revealed() { return revealT >= REVEAL_MS; }
    function report() { say(revealed() ? TXT_DONE : TXT_RISE); }
    function step() {
        if (revealed()) {
            return;
        }
        revealT = Math.min(REVEAL_MS, revealT + FIXED_DT);
        report();
    }
    function settle() {
        revealT = REVEAL_MS;
        report();
    }
    function demoTick(t) {
        if (!revealed() || t < 0) {
            return;
        }
        holdLeft += FIXED_DT;
        if (holdLeft >= HOLD_MS) {
            newMaze();
        }
    }
    function shade(c, ex) {
        const dip = VALLEY_DEPTH * (1 - smooth(ex / VALLEY_W));
        return [c[0] * (1 - dip), c[1] * (1 - dip), c[2] * (1 - dip)];
    }
    function draw() {
        clearStage();
        const lv = level();
        let shown = 0;
        for (let i = 0; i < CELL_N; i += 1) {
            const ex = excess[i];
            if (ex > lv) {
                fillCell(i, ROCK, 1);
                continue;
            }
            shown += 1;
            let c = shade(thermo(ex / maxEx), ex);
            // 수면 가장자리 — 막 잠긴 칸은 밝게
            if (!revealed() && lv - ex < maxEx * 0.04) {
                c = mix(c, PAPER, 0.6);
            }
            fillCell(i, c, 1);
        }
        strokeWalls(walls, rgba(INK, 1), 2);
        // 골짜기 바닥선 — 돌아가는 거리가 0 인 칸들을 잇는다
        ctx.fillStyle = rgba(PAPER, 0.9);
        for (let i = 0; i < CELL_N; i += 1) {
            if (excess[i] === 0) {
                ctx.fillRect(cellX(i) + 3.5, cellY(i) + 3.5, 2, 2);
            }
        }
        ctx.strokeStyle = rgba(PAPER, 1);
        ctx.lineWidth = 2;
        ctx.strokeRect(cellX(goal) + 1, cellY(goal) + 1, CS - 2, CS - 2);
        drawGates();
        panelRow(0, 'Shortest path', String(shortest));
        panelRow(1, 'Valley-floor cells', String(floorN));
        panelRow(2, 'Largest detour', String(maxEx));
        panelRow(3, 'Cells revealed', String(shown) + ' / ' + String(CELL_N));
    }
    function after() {
        if (still) {
            settle();
        }
        report();
        draw();
    }
    function newMaze() {
        pass += 1;
        walls = carveDfsAll(SEED + pass, ENTRY);
        goal = EXIT;
        computeField();
        after();
    }
    function setGoal(c) {
        if (c < 0 || c === ENTRY) {
            return;
        }
        goal = c;
        computeField();
        after();
    }
    function moveGoal(dx, dy) {
        const x = clamp((goal % GRID_N) + dx, 0, GRID_N - 1);
        const y = clamp(Math.floor(goal / GRID_N) + dy, 0, GRID_N - 1);
        setGoal(y * GRID_N + x);
    }
    cv.addEventListener('pointerdown', function (ev) {
        wake();
        const p = toScene(ev);
        setGoal(cellAt(p[0], p[1]));
    });
    cv.addEventListener('keydown', function (ev) {
        let used = true;
        if (ev.key === 'ArrowLeft') {
            moveGoal(-1, 0);
        }
        else if (ev.key === 'ArrowRight') {
            moveGoal(1, 0);
        }
        else if (ev.key === 'ArrowUp') {
            moveGoal(0, -1);
        }
        else if (ev.key === 'ArrowDown') {
            moveGoal(0, 1);
        }
        else if (ev.key === 'Enter') {
            computeField();
            after();
        }
        else if (ev.key === 'Home') {
            newMaze();
        }
        else {
            used = false;
        }
        if (used) {
            ev.preventDefault();
            wake();
        }
    });
    if (replayBtn) {
        replayBtn.addEventListener('click', function () { wake(); computeField(); after(); });
    }
    if (newBtn) {
        newBtn.addEventListener('click', function () { wake(); newMaze(); });
    }
    computeField();
    report();
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    let clock = 0;
    function frame(ts) {
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 순간이동 대신 이어서 움직인다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            clock += FIXED_DT;
            if (demo) {
                demoTick(clock);
            }
            step();
            acc -= FIXED_DT;
            n += 1;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    if (still) {
        settle();
        draw();
    }
    else {
        rafId = window.requestAnimationFrame(frame);
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
    };
})();
</script>
</body>
</html>
