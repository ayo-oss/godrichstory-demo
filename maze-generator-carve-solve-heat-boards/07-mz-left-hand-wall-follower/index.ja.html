<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>左手を壁につけたまま、三つの規則だけで出口を見つける歩き — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="hs is-demo" id="hs">
  <canvas class="hs__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="片手を壁につけたまま三つの規則で歩いて出口を見つけ、通った跡が薄れていく迷路。押すと止まるか再び歩きます"></canvas>
  <p class="hs__status" data-role="status" aria-live="off">左の壁に手をついて歩いています</p>
  <div class="hs__tools">
    <button class="hs__btn" data-role="hand" type="button" aria-pressed="false">右手にする</button>
    <button class="hs__btn" data-role="restart" type="button">最初から</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("hs");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    // 파스텔 팔레트 — 어두운 무대 위에 밝은 바닥을 얹어 명도 차로 길이 읽힌다
    const BG = [29, 26, 44];
    const ROCK = [44, 39, 64];
    const PAPER = [255, 248, 234];
    const INK = [58, 48, 76];
    const MINT = [126, 226, 192];
    const SKY = [124, 196, 255];
    const LILAC = [190, 164, 255];
    const PINK = [255, 160, 190];
    const PEACH = [255, 208, 168];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !statusEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    const still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function onResize() {
        fitCanvas();
        draw();
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    // 화면 좌표(CSS px) → 장면 좌표(480x300). 리사이즈 뒤에도 늘 현재 크기로 다시 잰다
    function toScene(ev) {
        const r = cv.getBoundingClientRect();
        return [((ev.clientX - r.left) / r.width) * W, ((ev.clientY - r.top) / r.height) * H];
    }
    // 시드 고정 난수 — 같은 시드면 같은 미로가 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 격자 — 31×31 칸, 칸마다 벽 네 장을 비트 하나씩으로 든다
    const GRID_N = 31;
    const CELL_N = GRID_N * GRID_N;
    const CS = 9;
    const BOARD = GRID_N * CS;
    let BX = W - 12 - BOARD;
    const BY = (H - BOARD) / 2;
    const ENTRY = 0;
    const EXIT = CELL_N - 1;
    // 방향 0 북 · 1 동 · 2 남 · 3 서 — 시계 방향 순서라 +1 이 오른쪽으로 돌기, +3 이 왼쪽으로 돌기
    const DX = [0, 1, 0, -1];
    const DY = [-1, 0, 1, 0];
    const BIT = [1, 2, 4, 8];
    const ALL_WALLS = 15;
    function neighbor(i, d) {
        const x = (i % GRID_N) + DX[d];
        const y = Math.floor(i / GRID_N) + DY[d];
        return x < 0 || y < 0 || x >= GRID_N || y >= GRID_N ? -1 : y * GRID_N + x;
    }
    function isOpen(walls, i, d) {
        return (walls[i] & BIT[d]) === 0 && neighbor(i, d) >= 0;
    }
    // 벽 한 장 걷기 — 양쪽 칸의 비트를 함께 지운다 (한쪽만 지우면 길이 일방통행이 된다)
    function knock(walls, i, d) {
        const n = neighbor(i, d);
        walls[i] &= ~BIT[d];
        walls[n] &= ~BIT[(d + 2) % 4];
        return n;
    }
    function openCount(walls, i) {
        let c = 0;
        for (let d = 0; d < 4; d += 1) {
            if (isOpen(walls, i, d)) {
                c += 1;
            }
        }
        return c;
    }
    function cellX(i) { return BX + (i % GRID_N) * CS; }
    function cellY(i) { return BY + Math.floor(i / GRID_N) * CS; }
    function cellAt(sx, sy) {
        const x = Math.floor((sx - BX) / CS);
        const y = Math.floor((sy - BY) / CS);
        return x < 0 || y < 0 || x >= GRID_N || y >= GRID_N ? -1 : y * GRID_N + x;
    }
    function fillCell(i, c, a) {
        ctx.fillStyle = rgba(c, a);
        ctx.fillRect(cellX(i), cellY(i), CS, CS);
    }
    // 벽 비트를 선분으로 — 칸마다 동·남 벽만 긋고 맨 윗줄·맨 왼줄만 북·서 벽을 더 긋는다 (같은 벽을 두 번 긋지 않는다)
    function strokeWalls(walls, color, lw) {
        ctx.beginPath();
        for (let i = 0; i < CELL_N; i += 1) {
            const x = cellX(i);
            const y = cellY(i);
            const w = walls[i];
            if ((w & 2) !== 0) {
                ctx.moveTo(x + CS, y);
                ctx.lineTo(x + CS, y + CS);
            }
            if ((w & 4) !== 0) {
                ctx.moveTo(x, y + CS);
                ctx.lineTo(x + CS, y + CS);
            }
            if (i < GRID_N && (w & 1) !== 0) {
                ctx.moveTo(x, y);
                ctx.lineTo(x + CS, y);
            }
            if (i % GRID_N === 0 && (w & 8) !== 0) {
                ctx.moveTo(x, y);
                ctx.lineTo(x, y + CS);
            }
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = lw;
        ctx.lineCap = 'square';
        ctx.stroke();
    }
    // 입구(왼쪽 위)·출구(오른쪽 아래) 표시 — 바깥 벽 밖에 작은 삼각형
    function drawGates() {
        ctx.fillStyle = rgba(MINT, 0.95);
        ctx.beginPath();
        ctx.moveTo(BX - 9, BY + 1);
        ctx.lineTo(BX - 2, BY + CS / 2);
        ctx.lineTo(BX - 9, BY + CS - 1);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = rgba(PINK, 0.95);
        ctx.beginPath();
        ctx.moveTo(BX + BOARD + 2, BY + BOARD - CS + 1);
        ctx.lineTo(BX + BOARD + 9, BY + BOARD - CS / 2);
        ctx.lineTo(BX + BOARD + 2, BY + BOARD - 1);
        ctx.closePath();
        ctx.fill();
    }
    // 왼쪽 칸의 수치 — 이름표 한 줄 + 값 한 줄
    function panelRow(row, label, value) {
        const y = 104 + row * 34;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = rgba(PAPER, 0.62);
        ctx.font = '500 11px sans-serif';
        ctx.fillText(label, 16, y);
        ctx.fillStyle = rgba(PAPER, 0.96);
        ctx.font = '700 15px sans-serif';
        ctx.fillText(value, 16, y + 18);
    }
    function clearStage() {
        ctx.fillStyle = rgba(BG, 1);
        ctx.fillRect(0, 0, W, H);
    }
    // 깊이 우선 파기 한 번에 끝까지 — 스택 머리에서 안 판 이웃을 골라 벽을 걷고, 없으면 하나 뺀다
    function carveDfsAll(seed, start) {
        const walls = new Uint8Array(CELL_N).fill(ALL_WALLS);
        const seen = new Uint8Array(CELL_N);
        const stk = new Int32Array(CELL_N);
        const rnd = makeRng(seed);
        let sp = 0;
        stk[sp] = start;
        sp = 1;
        seen[start] = 1;
        const opts = [];
        while (sp > 0) {
            const cur = stk[sp - 1];
            opts.length = 0;
            for (let d = 0; d < 4; d += 1) {
                const n = neighbor(cur, d);
                if (n >= 0 && seen[n] === 0) {
                    opts.push(d);
                }
            }
            if (opts.length === 0) {
                sp -= 1;
                continue;
            }
            const n = knock(walls, cur, opts[Math.floor(rnd() * opts.length)]);
            seen[n] = 1;
            stk[sp] = n;
            sp += 1;
        }
        return walls;
    }
    // 너비 우선 거리 — 큐에서 꺼낸 칸의 열린 이웃에 거리+1 을 적는다. 닿지 않은 칸은 -1
    function bfsDist(walls, src) {
        const dist = new Int32Array(CELL_N).fill(-1);
        const q = new Int32Array(CELL_N);
        let head = 0;
        let tail = 0;
        dist[src] = 0;
        q[tail] = src;
        tail += 1;
        while (head < tail) {
            const c = q[head];
            head += 1;
            for (let d = 0; d < 4; d += 1) {
                if (!isOpen(walls, c, d)) {
                    continue;
                }
                const n = neighbor(c, d);
                if (dist[n] >= 0) {
                    continue;
                }
                dist[n] = dist[c] + 1;
                q[tail] = n;
                tail += 1;
            }
        }
        return dist;
    }
    // 상태기계 한 번(앞으로 한 칸 또는 제자리 돌기)에 쓰는 시간
    const WALK_STEP_MS = 16;
    // 어느 손으로 벽을 짚나 — left 면 왼쪽이 열려 있을 때 먼저 왼쪽으로 돈다
    const HAND_SIDE = 'left';
    // 걸음마다 지나온 자취의 밝기에 곱하는 값 (지수 감쇠 — 0.996 이면 173歩数 뒤 절반)
    const TRAIL_FADE = 0.996;
    const SEED = 464;
    // 시연은 앞 420걸음을 미리 걸어 둔 상태에서 이어 걷는다 — 2초 안에 자취가 옅어지는 모습이 보이게
    const DEMO_WARM = 420;
    const HOLD_MS = 1400;
    const TXT_LEFT = '左の壁に手をついて歩いています';
    const TXT_RIGHT = '右の壁に手をついて歩いています';
    const TXT_DONE = '出口に到着';
    const TXT_PAUSE = '停止';
    const handBtn = root.querySelector('[data-role="hand"]');
    const restartBtn = root.querySelector('[data-role="restart"]');
    let pass = 0;
    let walls = carveDfsAll(SEED, ENTRY);
    let shortest = bfsDist(walls, ENTRY)[EXIT];
    const visits = new Uint16Array(CELL_N);
    const trail = new Float32Array(CELL_N);
    let hand = HAND_SIDE;
    let pos = ENTRY;
    let dir = 1;
    let steps = 0;
    let moves = 0;
    let turns = 0;
    let paused = false;
    let stepAcc = 0;
    let holdLeft = 0;
    function resetWalk() {
        visits.fill(0);
        trail.fill(0);
        pos = ENTRY;
        dir = 1;
        steps = 0;
        moves = 0;
        turns = 0;
        visits[pos] = 1;
        trail[pos] = 1;
        stepAcc = 0;
        holdLeft = 0;
    }
    function moveAhead() {
        pos = neighbor(pos, dir);
        moves += 1;
        visits[pos] += 1;
        trail[pos] = 1;
    }
    // 규칙 세 개 — ① ついた手 쪽이 열려 있으면 그쪽으로 돌아 한 칸 ② 아니고 앞이 열려 있으면 한 칸 ③ 둘 다 막혔으면 반대쪽으로 제자리 돌기
    function walkStep() {
        if (pos === EXIT) {
            return false;
        }
        const side = hand === 'left' ? (dir + 3) % 4 : (dir + 1) % 4;
        const other = hand === 'left' ? (dir + 1) % 4 : (dir + 3) % 4;
        steps += 1;
        for (let i = 0; i < CELL_N; i += 1) {
            trail[i] *= TRAIL_FADE;
        }
        if (isOpen(walls, pos, side)) {
            dir = side;
            turns += 1;
            moveAhead();
        }
        else if (isOpen(walls, pos, dir)) {
            moveAhead();
        }
        else {
            dir = other;
            turns += 1;
        }
        return true;
    }
    function done() { return pos === EXIT; }
    function report() {
        if (done()) {
            say(TXT_DONE);
        }
        else if (paused) {
            say(TXT_PAUSE);
        }
        else {
            say(hand === 'left' ? TXT_LEFT : TXT_RIGHT);
        }
    }
    function walk(n) {
        for (let k = 0; k < n && walkStep(); k += 1) { /* n 歩数 */ }
    }
    function step() {
        if (paused || done()) {
            return;
        }
        stepAcc += FIXED_DT;
        while (stepAcc >= WALK_STEP_MS && !done()) {
            stepAcc -= WALK_STEP_MS;
            walkStep();
        }
        report();
    }
    function settle() {
        walk(CELL_N * 8);
        report();
    }
    function demoTick(t) {
        if (!done() || t < 0) {
            return;
        }
        holdLeft += FIXED_DT;
        if (holdLeft >= HOLD_MS) {
            pass += 1;
            walls = carveDfsAll(SEED + pass, ENTRY);
            shortest = bfsDist(walls, ENTRY)[EXIT];
            resetWalk();
            walk(DEMO_WARM);
        }
    }
    const FLOOR = mix(PAPER, BG, 0.06);
    const ONCE = mix(PAPER, MINT, 0.5);
    const TWICE = mix(PAPER, LILAC, 0.55);
    function draw() {
        clearStage();
        for (let i = 0; i < CELL_N; i += 1) {
            if (visits[i] === 0) {
                fillCell(i, FLOOR, 1);
                continue;
            }
            // 한 번 지난 칸은 민트, 두 번 이상(막다른 골목에서 되나온 칸)은 라일락 — 자취가 밝을수록 진하게
            const baseC = visits[i] === 1 ? ONCE : TWICE;
            const hot = visits[i] === 1 ? MINT : LILAC;
            fillCell(i, mix(baseC, mix(hot, PINK, 0.25), trail[i]), 1);
        }
        strokeWalls(walls, rgba(INK, 1), 2);
        // 걷는 이 — 방향 삼각형과 ついた手 점
        const cx = cellX(pos) + CS / 2;
        const cy = cellY(pos) + CS / 2;
        const fx = DX[dir];
        const fy = DY[dir];
        ctx.fillStyle = rgba(PINK, 1);
        ctx.beginPath();
        ctx.moveTo(cx + fx * 4.2, cy + fy * 4.2);
        ctx.lineTo(cx - fx * 3 - fy * 3.2, cy - fy * 3 + fx * 3.2);
        ctx.lineTo(cx - fx * 3 + fy * 3.2, cy - fy * 3 - fx * 3.2);
        ctx.closePath();
        ctx.fill();
        const sd = hand === 'left' ? (dir + 3) % 4 : (dir + 1) % 4;
        ctx.fillStyle = rgba(PAPER, 1);
        ctx.beginPath();
        ctx.arc(cx + DX[sd] * 3.6, cy + DY[sd] * 3.6, 1.6, 0, Math.PI * 2);
        ctx.fill();
        drawGates();
        panelRow(0, '歩数', String(steps));
        panelRow(1, '進んだマス', String(moves));
        panelRow(2, '最短距離', String(shortest));
        panelRow(3, 'ついた手', hand === 'left' ? '左手' : '右手');
    }
    function after() {
        if (still) {
            settle();
        }
        report();
        draw();
    }
    function restart() {
        resetWalk();
        after();
    }
    function toggleHand() {
        hand = hand === 'left' ? 'right' : 'left';
        if (handBtn) {
            handBtn.setAttribute('aria-pressed', hand === 'right' ? 'true' : 'false');
        }
        restart();
    }
    function setPaused(v) {
        paused = v;
        report();
        draw();
    }
    cv.addEventListener('pointerdown', function () { wake(); setPaused(!paused); });
    cv.addEventListener('keydown', function (ev) {
        if (ev.key === ' ' || ev.key === 'Spacebar') {
            ev.preventDefault();
            wake();
            setPaused(!paused);
        }
        else if (ev.key === 'Enter') {
            ev.preventDefault();
            wake();
            toggleHand();
        }
        else if (ev.key === 'ArrowRight') {
            ev.preventDefault();
            wake();
            walk(20);
            after();
        }
        else if (ev.key === 'Home') {
            ev.preventDefault();
            wake();
            restart();
        }
    });
    if (handBtn) {
        handBtn.addEventListener('click', function () { wake(); toggleHand(); });
    }
    if (restartBtn) {
        restartBtn.addEventListener('click', function () { wake(); restart(); });
    }
    resetWalk();
    if (demo && !still) {
        walk(DEMO_WARM);
    }
    report();
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    let clock = 0;
    function frame(ts) {
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 순간이동 대신 이어서 움직인다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            clock += FIXED_DT;
            if (demo) {
                demoTick(clock);
            }
            step();
            acc -= FIXED_DT;
            n += 1;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    if (still) {
        settle();
        draw();
    }
    else {
        rafId = window.requestAnimationFrame(frame);
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
    };
})();
</script>
</body>
</html>
