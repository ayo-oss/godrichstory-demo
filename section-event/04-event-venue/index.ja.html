<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venue block — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="vn is-demo">
    <div class="vn__info">
      <p class="vn__name">○○コンベンションセンター 3階</p>
      <p class="vn__addr">ソウル江南区○○路123</p>
      <div class="vn__tabs" role="tablist">
        <button class="vn__tab" type="button" role="tab" aria-selected="true" data-i="0">地下鉄</button>
        <button class="vn__tab" type="button" role="tab" aria-selected="false" data-i="1">バス</button>
        <button class="vn__tab" type="button" role="tab" aria-selected="false" data-i="2">車</button>
        <span class="vn__ind" aria-hidden="true"></span>
      </div>
      <div class="vn__panels">
        <p class="vn__panel vn__panel--0">2号線○○駅3番出口、徒歩5分。</p>
        <p class="vn__panel vn__panel--1">幹線000・支線0000番、○○駅下車。</p>
        <p class="vn__panel vn__panel--2">地下駐車場2時間無料、以降1時間2,000ウォン。</p>
      </div>
    </div>
    <div class="vn__map" aria-hidden="true">
      <span class="vn__pin"></span>
    </div>
  </section>
</main>
<script>
// 실제 동작: 탭을 클릭하면 그 이동수단 설명만 실제로 보인다.
var root = document.querySelector('.vn');
var tabs = root.querySelectorAll('.vn__tab');
tabs.forEach(function (t) {
  t.addEventListener('click', function () {
    root.classList.remove('is-demo');
    tabs.forEach(function (o) { o.setAttribute('aria-selected', 'false'); });
    t.setAttribute('aria-selected', 'true');
    root.querySelector('.vn__ind').style.transform = 'translateX(' + (Number(t.dataset.i) * 100) + '%)';
    root.querySelectorAll('.vn__panel').forEach(function (p, i) {
      p.style.opacity = String(i === Number(t.dataset.i) ? 1 : 0);
    });
  });
});
</script>
</body>
</html>
