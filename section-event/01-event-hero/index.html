<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event hero — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="eh">
    <span class="eh__orb eh__orb--1" aria-hidden="true"></span>
    <span class="eh__orb eh__orb--2" aria-hidden="true"></span>
    <span class="eh__orb eh__orb--3" aria-hidden="true"></span>
    <span class="eh__mark" aria-hidden="true"></span>
    <p class="eh__eyebrow">CONFERENCE — 2026</p>
    <h1 class="eh__title">제품을 만드는 사람들의<br>하루</h1>
    <div class="eh__meta">
      <span class="eh__pill">10월 18일</span>
      <span class="eh__pill">서울 · 오프라인</span>
    </div>
    <div class="eh__row">
      <a class="eh__cta" href="#">참가 신청</a>
      <button class="eh__save" type="button" aria-pressed="false">
        <span class="eh__save-ic" aria-hidden="true"></span>
        관심 등록
      </button>
    </div>
  </section>
</main>
<script>
// 실제 동작: 클릭마다 관심 등록 상태가 실제로 바뀐다(아이콘 채움 + aria-pressed).
var btn = document.querySelector('.eh__save');
btn.addEventListener('click', function () {
  var on = btn.getAttribute('aria-pressed') === 'true';
  btn.setAttribute('aria-pressed', String(!on));
});
</script>
</body>
</html>
