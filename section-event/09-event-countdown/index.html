<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown band — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="cd">
    <span class="cd__glow" aria-hidden="true"></span>
    <p class="cd__label">컨퍼런스 시작까지</p>
    <div class="cd__row" role="timer" aria-live="off">
      <div class="cd__unit"><span class="cd__num" data-u="d">07</span><span class="cd__unit-label">일</span></div>
      <span class="cd__sep">:</span>
      <div class="cd__unit"><span class="cd__num" data-u="h">04</span><span class="cd__unit-label">시</span></div>
      <span class="cd__sep">:</span>
      <div class="cd__unit"><span class="cd__num" data-u="m">20</span><span class="cd__unit-label">분</span></div>
      <span class="cd__sep">:</span>
      <div class="cd__unit"><span class="cd__num cd__num--s" data-u="s">15</span><span class="cd__unit-label">초</span></div>
    </div>
  </section>
</main>
<script>
// 실제 동작: 목표 시각(지금부터 정확히 7일 4시간 20분 15초 뒤)까지 1초마다 실제로 줄어든다.
var target = Date.now() + ((7 * 24 * 60 * 60) + (4 * 60 * 60) + (20 * 60) + 15) * 1000;
var els = {
  d: document.querySelector('[data-u="d"]'),
  h: document.querySelector('[data-u="h"]'),
  m: document.querySelector('[data-u="m"]'),
  s: document.querySelector('[data-u="s"]')
};
function pad(n) { return String(Math.max(0, n)).padStart(2, '0'); }
function tick() {
  var diff = Math.max(0, target - Date.now());
  var s = Math.floor(diff / 1000);
  els.d.textContent = pad(Math.floor(s / 86400));
  els.h.textContent = pad(Math.floor((s % 86400) / 3600));
  els.m.textContent = pad(Math.floor((s % 3600) / 60));
  els.s.textContent = pad(s % 60);
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
