<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaker grid — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="sg is-demo">
    <li class="sg__card"><button class="sg__toggle" type="button" aria-expanded="false">
      <span class="sg__avatar" aria-hidden="true">キム・ミ</span>
      <span class="sg__name">キム・ミンジュン</span>
      <span class="sg__role">プロダクトデザイナー・○○チーム</span>
    </button><p class="sg__bio">「説明のいらない画面」の作り方を発表します。</p></li>
    <li class="sg__card"><button class="sg__toggle" type="button" aria-expanded="false">
      <span class="sg__avatar" aria-hidden="true">イ・ソ</span>
      <span class="sg__name">イ・ソヨン</span>
      <span class="sg__role">エンジニアリングリード・○○スタジオ</span>
    </button><p class="sg__bio">早く作り、手遅れになる前に戻す、デプロイの話。</p></li>
    <li class="sg__card"><button class="sg__toggle" type="button" aria-expanded="false">
      <span class="sg__avatar" aria-hidden="true">パク・ド</span>
      <span class="sg__name">パク・ドユン</span>
      <span class="sg__role">グロースマネージャー・○○コマース</span>
    </button><p class="sg__bio">数字より先に見るべきユーザーシグナル3つ。</p></li>
    <li class="sg__card"><button class="sg__toggle" type="button" aria-expanded="false">
      <span class="sg__avatar" aria-hidden="true">チェ・ユ</span>
      <span class="sg__name">チェ・ユナ</span>
      <span class="sg__role">リサーチャー・○○ラボ</span>
    </button><p class="sg__bio">10回のインタビューで見えるもの、100回で見えるもの。</p></li>
    <li class="sg__card"><button class="sg__toggle" type="button" aria-expanded="false">
      <span class="sg__avatar" aria-hidden="true">ジョン・ハ</span>
      <span class="sg__name">ジョン・ハウン</span>
      <span class="sg__role">創業者・○○</span>
    </button><p class="sg__bio">3回失敗して学んだことだけ、短く話します。</p></li>
    <li class="sg__card"><button class="sg__toggle" type="button" aria-expanded="false">
      <span class="sg__avatar" aria-hidden="true">ハン・ジ</span>
      <span class="sg__name">ハン・ジホ</span>
      <span class="sg__role">プラットフォームエンジニア・○○</span>
    </button><p class="sg__bio">トラフィックが10倍になった時、最初に落ちる場所は。</p></li>
  </ul>
</main>
<script>
// 실제 동작: 카드를 클릭하면 그 카드만 한 줄 소개가 실제로 펼쳐진다.
document.querySelectorAll('.sg__toggle').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelector('.sg').classList.remove('is-demo');
    var open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!open));
    btn.closest('.sg__card').classList.toggle('is-open', !open);
  });
});
</script>
</body>
</html>
