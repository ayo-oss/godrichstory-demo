<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaker grid — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="sg is-demo">
    <li class="sg__card"><button class="sg__toggle" type="button" aria-expanded="false">
      <span class="sg__avatar" aria-hidden="true">김민</span>
      <span class="sg__name">김민준</span>
      <span class="sg__role">프로덕트 디자이너 · ○○팀</span>
    </button><p class="sg__bio">"설명이 필요 없는 화면"을 만드는 법을 발표합니다.</p></li>
    <li class="sg__card"><button class="sg__toggle" type="button" aria-expanded="false">
      <span class="sg__avatar" aria-hidden="true">이서</span>
      <span class="sg__name">이서연</span>
      <span class="sg__role">엔지니어링 리드 · ○○ 스튜디오</span>
    </button><p class="sg__bio">빠르게 만들고 늦지 않게 되돌리는 배포 이야기.</p></li>
    <li class="sg__card"><button class="sg__toggle" type="button" aria-expanded="false">
      <span class="sg__avatar" aria-hidden="true">박도</span>
      <span class="sg__name">박도윤</span>
      <span class="sg__role">그로스 매니저 · ○○ 커머스</span>
    </button><p class="sg__bio">숫자보다 먼저 봐야 하는 사용자 신호 세 가지.</p></li>
    <li class="sg__card"><button class="sg__toggle" type="button" aria-expanded="false">
      <span class="sg__avatar" aria-hidden="true">최유</span>
      <span class="sg__name">최유나</span>
      <span class="sg__role">리서처 · ○○ 랩</span>
    </button><p class="sg__bio">인터뷰 열 번이면 보이는 것, 백 번이면 보이는 것.</p></li>
    <li class="sg__card"><button class="sg__toggle" type="button" aria-expanded="false">
      <span class="sg__avatar" aria-hidden="true">정하</span>
      <span class="sg__name">정하은</span>
      <span class="sg__role">창업자 · ○○</span>
    </button><p class="sg__bio">세 번 실패하고 배운 것만 골라 짧게 말합니다.</p></li>
    <li class="sg__card"><button class="sg__toggle" type="button" aria-expanded="false">
      <span class="sg__avatar" aria-hidden="true">한지</span>
      <span class="sg__name">한지호</span>
      <span class="sg__role">플랫폼 엔지니어 · ○○</span>
    </button><p class="sg__bio">트래픽 열 배가 몰릴 때 먼저 죽는 곳은 어디인가.</p></li>
  </ul>
</main>
<script>
// 실제 동작: 카드를 클릭하면 그 카드만 한 줄 소개가 실제로 펼쳐진다.
document.querySelectorAll('.sg__toggle').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelector('.sg').classList.remove('is-demo');
    var open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!open));
    btn.closest('.sg__card').classList.toggle('is-open', !open);
  });
});
</script>
</body>
</html>
