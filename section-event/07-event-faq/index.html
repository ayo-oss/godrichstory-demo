<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event FAQ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="fq is-demo">
    <div class="fq__item is-open" data-i="0">
      <button class="fq__q" type="button" aria-expanded="true">
        <span>티켓은 환불되나요?</span>
        <span class="fq__chevron" aria-hidden="true"></span>
      </button>
      <div class="fq__a-wrap"><p class="fq__a">행사 7일 전까지 전액 환불, 이후엔 수수료 10%가 붙습니다.</p></div>
    </div>
    <div class="fq__item" data-i="1">
      <button class="fq__q" type="button" aria-expanded="false">
        <span>온라인으로도 참가할 수 있나요?</span>
        <span class="fq__chevron" aria-hidden="true"></span>
      </button>
      <div class="fq__a-wrap"><p class="fq__a">현장 참가만 가능합니다. 주요 세션은 이후 영상으로 공개됩니다.</p></div>
    </div>
    <div class="fq__item" data-i="2">
      <button class="fq__q" type="button" aria-expanded="false">
        <span>주차는 지원되나요?</span>
        <span class="fq__chevron" aria-hidden="true"></span>
      </button>
      <div class="fq__a-wrap"><p class="fq__a">건물 지하 주차장 2시간 무료, 이후 시간당 2천 원입니다.</p></div>
    </div>
  </section>
</main>
<script>
// 실제 동작: 질문을 클릭하면 그 답변만 실제로 펼쳐지고 나머지는 닫힌다(단일 오픈).
var root = document.querySelector('.fq');
var items = root.querySelectorAll('.fq__item');
items.forEach(function (item) {
  item.querySelector('.fq__q').addEventListener('click', function () {
    root.classList.remove('is-demo');
    var open = item.classList.contains('is-open');
    items.forEach(function (o) {
      o.classList.remove('is-open');
      o.querySelector('.fq__q').setAttribute('aria-expanded', 'false');
    });
    if (!open) {
      item.classList.add('is-open');
      item.querySelector('.fq__q').setAttribute('aria-expanded', 'true');
    }
  });
});
</script>
</body>
</html>
