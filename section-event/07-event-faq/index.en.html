<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event FAQ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="fq is-demo">
    <div class="fq__item is-open" data-i="0">
      <button class="fq__q" type="button" aria-expanded="true">
        <span>Can I get a refund?</span>
        <span class="fq__chevron" aria-hidden="true"></span>
      </button>
      <div class="fq__a-wrap"><p class="fq__a">Full refund up to 7 days before; 10% fee after.</p></div>
    </div>
    <div class="fq__item" data-i="1">
      <button class="fq__q" type="button" aria-expanded="false">
        <span>Can I join online?</span>
        <span class="fq__chevron" aria-hidden="true"></span>
      </button>
      <div class="fq__a-wrap"><p class="fq__a">In-person only. Key sessions go up on video later.</p></div>
    </div>
    <div class="fq__item" data-i="2">
      <button class="fq__q" type="button" aria-expanded="false">
        <span>Is parking available?</span>
        <span class="fq__chevron" aria-hidden="true"></span>
      </button>
      <div class="fq__a-wrap"><p class="fq__a">Free parking for 2h, then ₩2,000/hr after.</p></div>
    </div>
  </section>
</main>
<script>
// 실제 동작: 질문을 클릭하면 그 답변만 실제로 펼쳐지고 나머지는 닫힌다(단일 오픈).
var root = document.querySelector('.fq');
var items = root.querySelectorAll('.fq__item');
items.forEach(function (item) {
  item.querySelector('.fq__q').addEventListener('click', function () {
    root.classList.remove('is-demo');
    var open = item.classList.contains('is-open');
    items.forEach(function (o) {
      o.classList.remove('is-open');
      o.querySelector('.fq__q').setAttribute('aria-expanded', 'false');
    });
    if (!open) {
      item.classList.add('is-open');
      item.querySelector('.fq__q').setAttribute('aria-expanded', 'true');
    }
  });
});
</script>
</body>
</html>
