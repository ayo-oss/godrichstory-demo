<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule timeline — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="tl is-demo" data-active="0">
    <span class="tl__track" aria-hidden="true"><span class="tl__fill"></span></span>
    <ol class="tl__list">
      <li><button class="tl__stop" type="button" data-i="0" aria-current="step">
        <span class="tl__dot" aria-hidden="true"></span>
        <span class="tl__time">09:00</span><span class="tl__label">受付・ウェルカムコーヒー</span>
      </button></li>
      <li><button class="tl__stop" type="button" data-i="1">
        <span class="tl__dot" aria-hidden="true"></span>
        <span class="tl__time">10:00</span><span class="tl__label">基調講演</span>
      </button></li>
      <li><button class="tl__stop" type="button" data-i="2">
        <span class="tl__dot" aria-hidden="true"></span>
        <span class="tl__time">13:00</span><span class="tl__label">ネットワーキングランチ</span>
      </button></li>
      <li><button class="tl__stop" type="button" data-i="3">
        <span class="tl__dot" aria-hidden="true"></span>
        <span class="tl__time">15:00</span><span class="tl__label">パネル討論</span>
      </button></li>
    </ol>
  </section>
</main>
<script>
// 실제 동작: 정류장을 클릭하면 진행바가 그 지점까지 실제로 채워지고 aria-current 가 옮겨간다.
var root = document.querySelector('.tl');
var stops = root.querySelectorAll('.tl__stop');
stops.forEach(function (btn) {
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    var i = btn.getAttribute('data-i');
    root.setAttribute('data-active', i);
    root.querySelector('.tl__fill').style.transform = 'scaleY(' + ((Number(i) + 1) / 4) + ')';
    stops.forEach(function (s) { s.removeAttribute('aria-current'); });
    btn.setAttribute('aria-current', 'step');
  });
});
</script>
</body>
</html>
