<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register CTA — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="rc is-demo">
    <span class="rc__orb rc__orb--1" aria-hidden="true"></span>
    <span class="rc__orb rc__orb--2" aria-hidden="true"></span>
    <h2 class="rc__title">今すぐ登録して<br>早割特典を受け取る</h2>
    <p class="rc__sub">登録者には資料集とネットワーキング招待状をお渡しします。</p>
    <form class="rc__form" novalidate>
      <input class="rc__input" type="email" placeholder="you@example.com" required>
      <button class="rc__submit" type="submit">
        <span class="rc__submit-label">登録する</span>
        <svg class="rc__check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="5 13 10 18 19 7" /></svg>
      </button>
    </form>
    <p class="rc__done" role="status"></p>
  </section>
</main>
<script>
// 실제 동작: 이메일 형식을 검사해 성공/오류를 실제로 표시한다.
var form = document.querySelector('.rc__form');
var input = document.querySelector('.rc__input');
var done = document.querySelector('.rc__done');
form.addEventListener('submit', function (e) {
  e.preventDefault();
  document.querySelector('.rc').classList.remove('is-demo');
  var ok = /^\S+@\S+\.\S+$/.test(input.value);
  if (ok) {
    form.classList.add('is-done');
    done.textContent = '登録完了 — 確認メールをお送りしました。';
  } else {
    input.classList.remove('is-shake');
    void input.offsetWidth;
    input.classList.add('is-shake');
    done.textContent = '正しいメールアドレスを入力してください。';
  }
});
</script>
</body>
</html>
