<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket pricing — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="tp is-demo">
    <button class="tp__switch" type="button" role="switch" aria-checked="false">
      <span class="tp__switch-label">Early Bird</span>
      <span class="tp__switch-track" aria-hidden="true"><span class="tp__switch-knob"></span></span>
      <span class="tp__switch-label">Regular</span>
    </button>
    <ul class="tp__cards">
      <li class="tp__card">
        <p class="tp__tier">Standard</p>
        <p class="tp__price"><span class="tp__price-a">₩49,000</span><span class="tp__price-b">₩69,000</span></p>
        <p class="tp__desc">All sessions · Booklet</p>
      </li>
      <li class="tp__card tp__card--pop">
        <span class="tp__badge">Popular</span>
        <p class="tp__tier">Premium</p>
        <p class="tp__price"><span class="tp__price-a">₩89,000</span><span class="tp__price-b">₩119,000</span></p>
        <p class="tp__desc">All sessions · Lunch</p>
      </li>
      <li class="tp__card">
        <p class="tp__tier">VIP</p>
        <p class="tp__price"><span class="tp__price-a">₩149,000</span><span class="tp__price-b">₩189,000</span></p>
        <p class="tp__desc">All perks · Dinner</p>
      </li>
    </ul>
  </section>
</main>
<script>
// 실제 동작: 스위치를 누르면 세 카드의 가격이 실제로 Early Bird/정가로 바뀐다.
var sw = document.querySelector('.tp__switch');
sw.addEventListener('click', function () {
  document.querySelector('.tp').classList.remove('is-demo');
  var on = sw.getAttribute('aria-checked') === 'true';
  sw.setAttribute('aria-checked', String(!on));
});
</script>
</body>
</html>
