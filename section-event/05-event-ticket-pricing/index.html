<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket pricing — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="tp is-demo">
    <button class="tp__switch" type="button" role="switch" aria-checked="false">
      <span class="tp__switch-label">얼리버드</span>
      <span class="tp__switch-track" aria-hidden="true"><span class="tp__switch-knob"></span></span>
      <span class="tp__switch-label">정가</span>
    </button>
    <ul class="tp__cards">
      <li class="tp__card">
        <p class="tp__tier">스탠다드</p>
        <p class="tp__price"><span class="tp__price-a">49,000원</span><span class="tp__price-b">69,000원</span></p>
        <p class="tp__desc">세션 전체 · 자료집</p>
      </li>
      <li class="tp__card tp__card--pop">
        <span class="tp__badge">인기</span>
        <p class="tp__tier">프리미엄</p>
        <p class="tp__price"><span class="tp__price-a">89,000원</span><span class="tp__price-b">119,000원</span></p>
        <p class="tp__desc">세션 전체 · 네트워킹 런치</p>
      </li>
      <li class="tp__card">
        <p class="tp__tier">VIP</p>
        <p class="tp__price"><span class="tp__price-a">149,000원</span><span class="tp__price-b">189,000원</span></p>
        <p class="tp__desc">전 혜택 · 연사 디너</p>
      </li>
    </ul>
  </section>
</main>
<script>
// 실제 동작: 스위치를 누르면 세 카드의 가격이 실제로 얼리버드/정가로 바뀐다.
var sw = document.querySelector('.tp__switch');
sw.addEventListener('click', function () {
  document.querySelector('.tp').classList.remove('is-demo');
  var on = sw.getAttribute('aria-checked') === 'true';
  sw.setAttribute('aria-checked', String(!on));
});
</script>
</body>
</html>
