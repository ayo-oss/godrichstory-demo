<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ブラウザ既定値のリセット — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="head">
    <span class="stateLabel" id="stateLabel">リセット前</span>
    <button class="toggleBtn" id="toggleBtn" type="button" aria-pressed="false">リセット適用</button>
  </div>
  <div class="body">
    <div class="panel" id="panel">
      <h3 class="demoHeading">見出し領域</h3>
      <ul class="demoList">
        <li>項目1</li>
        <li>項目2</li>
        <li>項目3</li>
      </ul>
      <p class="demoPara">段落の余白はブラウザごとに異なります。 <a href="#" class="demoLink" id="demoLink">関連リンク</a></p>
    </div>
    <div class="ruler" id="ruler">
      <div class="rulerFill" id="rulerFill"></div>
    </div>
  </div>
  <div class="readout" id="readout">高さ —px・既定値解除 —件</div>
</div>
</main>
<script>
(function () {
  // 변형 상수 — minimal 은 목록·여백만, full 은 버튼 겉모습까지 지운다 (D 뒤 확정)
  var RESET_SCOPE = 'minimal';
  var STEP_MS = 320;
  // 지워지는 기본값 카테고리 — 실제로 화면에 세어 보여주는 목록이라 죽은 상수가 아니다
  var CLEARED_MINIMAL = ['heading-margin', 'paragraph-margin', 'list-style'];
  var CLEARED_FULL = CLEARED_MINIMAL.concat(['link-decoration']);
  var MAX_HEIGHT_PX = 130; // 룰러 눈금의 기준 최대 高さ — 이 값을 넘는 초과분은 눈금 밖으로 잘린다
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var panel = document.getElementById('panel');
  var toggleBtn = document.getElementById('toggleBtn');
  var stateLabel = document.getElementById('stateLabel');
  var readout = document.getElementById('readout');
  var rulerFill = document.getElementById('rulerFill');
  var isDemo = true;
  var on = false;

  function clearedList() { return RESET_SCOPE === 'full' ? CLEARED_FULL : CLEARED_MINIMAL; }

  function measure() {
    // 실측 — 패널의 실제 렌더 높이를 매 프레임 다시 잰다. 값을 미리 정해두지 않는다
    var h = panel.getBoundingClientRect().height;
    var ratio = Math.min(1, h / MAX_HEIGHT_PX);
    rulerFill.style.transform = 'scaleY(' + ratio.toFixed(3) + ')';
    readout.textContent = '高さ ' + Math.round(h) + 'px・既定値解除 ' + (on ? clearedList().length : 0) + '件';
  }

  function apply(next) {
    on = next;
    panel.classList.toggle('reset', on);
    panel.classList.toggle('full', on && RESET_SCOPE === 'full');
    stateLabel.textContent = on ? 'リセット後' : 'リセット前';
    toggleBtn.setAttribute('aria-pressed', String(on));
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }
  toggleBtn.addEventListener('click', function () { human(); apply(!on); });
  document.getElementById('demoLink').addEventListener('click', function (e) { human(); e.preventDefault(); });

  var last = 0;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce && ts - last >= STEP_MS) { last = ts; apply(!on); }
    measure();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
