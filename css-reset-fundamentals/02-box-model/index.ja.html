<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボックスモデル比較 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="track" id="track">
    <div class="guide" id="guide"></div>
    <div class="row">
      <span class="rowLabel">border-box</span>
      <div class="box borderBox" id="borderBox"></div>
    </div>
    <div class="row">
      <span class="rowLabel">content-box</span>
      <div class="box contentBox" id="contentBox"></div>
    </div>
  </div>
  <input class="widthRange" id="widthRange" type="range" min="120" max="200" value="140" aria-label="宣言幅">
  <div class="readout" id="readout">宣言幅 —px</div>
</div>
</main>
<script>
(function () {
  var BORDER_PX = 8;
  var PADDING_PX = 12;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var track = document.getElementById('track');
  var guide = document.getElementById('guide');
  var borderBox = document.getElementById('borderBox');
  var contentBox = document.getElementById('contentBox');
  var widthRange = document.getElementById('widthRange');
  var readout = document.getElementById('readout');
  var isDemo = true;
  var declared = 140;

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }
  widthRange.addEventListener('input', function () {
    human();
    declared = Number(widthRange.value);
  });
  widthRange.addEventListener('pointerdown', human);

  function apply() {
    borderBox.style.width = declared + 'px';
    contentBox.style.width = declared + 'px';
    // 실측 — 계산값을 가정하지 않고 실제 렌더 결과를 다시 잰다
    var bRect = borderBox.getBoundingClientRect();
    var cRect = contentBox.getBoundingClientRect();
    guide.style.transform = 'translateX(' + declared + 'px)';
    widthRange.value = String(Math.round(declared));
    // 이론값 = 宣言幅 + 테두리·패딩 두 변 — 실측(getBoundingClientRect)과 맞는지 함께 보여준다
    var theory = declared + 2 * (BORDER_PX + PADDING_PX);
    readout.textContent = '宣言 ' + Math.round(declared) + 'px・border-box 実測 ' +
      Math.round(bRect.width) + 'px・content-box 実測 ' + Math.round(cRect.width) +
      'px（理論値 ' + Math.round(theory) + 'px)';
  }

  var start = 0;
  function loop(ts) {
    if (!start) start = ts;
    if (isDemo && !reduce) {
      declared = 160 + 38 * Math.sin((ts - start) / 900);
    }
    apply();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
