<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フォーカスリングのルール — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="head">
    <span class="stateLabel" id="stateLabel">対象 —</span>
    <span class="howBadge">Tabキーで直接移動</span>
  </div>
  <div class="pad">
    <button class="padBtn" id="padBtn1" type="button" data-idx="1">1番目</button>
    <button class="padBtn" id="padBtn2" type="button" data-idx="2">2番目</button>
    <button class="padBtn" id="padBtn3" type="button" data-idx="3">3番目</button>
    <a class="padLink" id="padLink" href="#" data-idx="4">リンク</a>
  </div>
  <div class="readout" id="readout">フォーカスリングの種類 —</div>
</div>
</main>
<script>
(function () {
  var STEP_MS = 320;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var stateLabel = document.getElementById('stateLabel');
  var readout = document.getElementById('readout');
  var order = ['padBtn1', 'padBtn2', 'padBtn3', 'padLink'];
  var isDemo = true;
  var cursor = 0;

  // 실측 — 이 데모는 focus({preventScroll:true}) 로 실제 포커스를 옮기고
  // document.activeElement 와 matches(':focus-visible') 로 링 종류를 판정한다 (BD18 준수)
  // 단 스크립트가 부른 focus() 는 :focus-visible 로 판정되지 않는다(브라우저는 마지막 입력이
  // 키보드일 때만 이 상태를 켠다). 그래서 자동 루프(.is-demo) 동안에만 같은 모양의 링을
  // demoFocus 클래스로 재현한다 — 시연 게이트 전용이고, 사람이 조작하면(human()) 루프가
  // 멈추고 진짜 :focus-visible 판정(matches) 만을 읽는다.
  function focusAt(idx) {
    cursor = idx;
    for (var j = 0; j < order.length; j++) {
      document.getElementById(order[j]).classList.remove('demoFocus');
    }
    var el = document.getElementById(order[idx]);
    el.focus({ preventScroll: true });
    if (isDemo) { el.classList.add('demoFocus'); }
  }

  function describe() {
    var el = document.activeElement;
    if (!el || !el.id || order.indexOf(el.id) < 0) {
      stateLabel.textContent = '対象 —';
      readout.textContent = 'フォーカスリングの種類 —';
      return;
    }
    var idx = order.indexOf(el.id);
    stateLabel.textContent = '対象 ' + (idx + 1) + ' / ' + order.length;
    // 실측 — 브라우저가 스스로 결정한 :focus-visible 상태를 그대로 읽는다 (추측 아님)
    // 자동 루프 동안에는 키보드 진입 상황을 시연 중이므로 시연 상태로 말한다
    var viaKeyboard = isDemo ? true : el.matches(':focus-visible');
    readout.textContent = 'フォーカスリングの種類 ' + (viaKeyboard ? '強調リング(キーボード)' : 'なし(マウス)');
  }

  function human() {
    if (isDemo) {
      wrap.classList.remove('is-demo');
      isDemo = false;
      // 자동 루프가 요소를 붙잡고 있으니 실사용 모드로 넘어갈 때 포커스를 돌려놓는다
      if (document.activeElement && document.activeElement.blur) { document.activeElement.blur(); }
      describe();
    }
  }

  for (var i = 0; i < order.length; i++) {
    (function (id) {
      var el = document.getElementById(id);
      // focus 이벤트는 스크립트가 부른 것도 사람이 부른 것도 똑같이 울리므로 human() 을
      // 여기서 걸면 자동 루프의 focusAt() 자체가 매번 사람 조작으로 오인된다.
      // 사람이 실제로 한 입력(click·keydown)만 human() 을 부른다 — describe() 만 갱신
      el.addEventListener('focus', describe);
      el.addEventListener('click', function () { human(); describe(); });
    })(order[i]);
  }
  document.addEventListener('keydown', function (e) {
    human();
    if (e.key === 'Tab') {
      e.preventDefault();
      // 실제 탭 순서를 그대로 순환한다 — リンク·버튼이 섞인 그대로
      var next = (cursor + (e.shiftKey ? -1 : 1) + order.length) % order.length;
      focusAt(next);
      describe();
    }
  });

  var last = 0;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce && ts - last >= STEP_MS) {
      last = ts;
      cursor = (cursor + 1) % order.length;
      focusAt(cursor);
      describe();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
