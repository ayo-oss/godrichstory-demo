<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>モーション削減への対応 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="head">
    <button class="simBtn" id="simBtn" type="button" aria-pressed="false">モーション削減のシミュレーション</button>
    <button class="playBtn" id="playBtn" type="button">再生</button>
  </div>
  <div class="track" id="track">
    <div class="dot" id="dot"></div>
  </div>
  <div class="scaleRow">
    <label class="scaleLabel" for="scaleRange">縮小比率</label>
    <input class="scaleRange" id="scaleRange" type="range" min="0.02" max="0.1" step="0.01" value="0.1" aria-label="モーション削減時の継続時間比率">
  </div>
  <div class="readout" id="readout">移動時間 —ms</div>
</div>
</main>
<script>
(function () {
  var BASE_DURATION_MS = 900;
  var REDUCED_MOTION_SCALE = 0.1;
  var STEP_MS = 1400;
  // 실제 OS/브라우저 줄임 모션 설정 — 이건 자동 루프를 멈추는 데만 쓴다(시연 게이트 전용 판단).
  // reduceSim(아래) 은 이 데모가 "줄임 모션이 켜지면 무슨 일이 일어나는지" 를 보여주기 위해
  // 화면 안에서 흉내 내는 스위치로, 실사용에서는 진짜 media query 가 이 스위치 없이도 똑같이 동작한다.
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var track = document.getElementById('track');
  var dot = document.getElementById('dot');
  var simBtn = document.getElementById('simBtn');
  var playBtn = document.getElementById('playBtn');
  var scaleRange = document.getElementById('scaleRange');
  var readout = document.getElementById('readout');
  var isDemo = true;
  var reduceSim = false;
  var runStart = 0;
  var running = false;

  function currentDurationMs() {
    return reduceSim ? Math.round(BASE_DURATION_MS * REDUCED_MOTION_SCALE) : BASE_DURATION_MS;
  }

  function applyDuration() {
    dot.style.transitionDuration = currentDurationMs() + 'ms';
  }

  function play() {
    if (running) return;
    running = true;
    applyDuration();
    dot.classList.remove('at-end');
    // 강제 리플로 — 위치를 원점으로 되돌린 상태를 화면에 반영한 뒤에 이동을 건다
    void dot.offsetWidth;
    runStart = performance.now();
    dot.classList.add('at-end');
  }

  dot.addEventListener('transitionend', function () {
    // 실측 — 실제로 걸린 시간을 performance.now() 로 다시 잰다(계산값을 미리 적지 않는다)
    var elapsed = Math.round(performance.now() - runStart);
    readout.textContent = '移動時間 ' + elapsed + 'ms（設定 ' + currentDurationMs() + 'ms・比率 ' + REDUCED_MOTION_SCALE.toFixed(2) + ')';
    running = false;
  });

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  simBtn.addEventListener('click', function () {
    human();
    reduceSim = !reduceSim;
    wrap.classList.toggle('reduceSim', reduceSim);
    simBtn.setAttribute('aria-pressed', String(reduceSim));
    applyDuration();
  });
  playBtn.addEventListener('click', function () { human(); play(); });
  scaleRange.addEventListener('input', function () {
    human();
    REDUCED_MOTION_SCALE = Number(scaleRange.value);
    applyDuration();
  });
  scaleRange.addEventListener('pointerdown', human);

  var last = 0;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce && ts - last >= STEP_MS) {
      last = ts;
      reduceSim = !reduceSim;
      wrap.classList.toggle('reduceSim', reduceSim);
      simBtn.setAttribute('aria-pressed', String(reduceSim));
      play();
    }
    requestAnimationFrame(loop);
  }
  applyDuration();
  // 첫 재생은 즉시(느린 900ms 쪽)로 걸어 캡처 구간 안에 이동이 충분히 퍼지게 한다 —
  // 루프가 STEP_MS 를 기다렸다 시작하면 1番目 재생이 하필 짧은 줄임 모션(90ms) 이 되어
  // 2초 구간 안에 움직임이 한두 프레임 만에 끝나 버린다(실측 2026-09-22)
  play();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
