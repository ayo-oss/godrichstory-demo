<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Font Inheritance — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="head">
    <span class="stateLabel" id="stateLabel">Before inheritance</span>
    <button class="toggleBtn" id="toggleBtn" type="button" aria-pressed="false">Font inheritance applied</button>
  </div>
  <p class="sample" id="sample">Paragraph font 15px · weight 700</p>
  <div class="fieldRow">
    <input class="field inheritField" id="fieldA" type="text" value="Enter name" aria-label="Input example">
    <button class="ghostBtn" id="ghostBtn" type="button">Button font</button>
  </div>
  <div class="readout" id="readout">Input —px · matches paragraph —</div>
</div>
</main>
<script>
(function () {
  var STEP_MS = 260;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var toggleBtn = document.getElementById('toggleBtn');
  var ghostBtn = document.getElementById('ghostBtn');
  var stateLabel = document.getElementById('stateLabel');
  var sample = document.getElementById('sample');
  var fieldA = document.getElementById('fieldA');
  var readout = document.getElementById('readout');
  var isDemo = true;
  var on = false;

  function measure() {
    // 실측 — 문단과 입력창의 렌더 글꼴 크기를 getComputedStyle 로 매 토글 뒤 다시 잰다
    var ps = getComputedStyle(sample).fontSize;
    var fs = getComputedStyle(fieldA).fontSize;
    var pw = getComputedStyle(sample).fontWeight;
    var fw = getComputedStyle(fieldA).fontWeight;
    var match = ps === fs && pw === fw;
    readout.textContent = 'Input ' + fs + ' · ' + fw + ' · matches paragraph ' + (match ? 'O' : 'X');
  }

  function apply(next) {
    on = next;
    wrap.classList.toggle('inherited', on);
    stateLabel.textContent = on ? 'After inheritance' : 'Before inheritance';
    toggleBtn.setAttribute('aria-pressed', String(on));
    measure();
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }
  toggleBtn.addEventListener('click', function () { human(); apply(!on); });
  ghostBtn.addEventListener('click', human);
  fieldA.addEventListener('input', human);
  fieldA.addEventListener('focus', human);

  var last = 0;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce && ts - last >= STEP_MS) { last = ts; apply(!on); }
    requestAnimationFrame(loop);
  }
  apply(false);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
