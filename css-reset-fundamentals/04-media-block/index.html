<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이미지 넘침 방지 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="row">
    <span class="rowLabel">그대로 이미지</span>
    <div class="frame rawFrame" id="rawFrame">
      <img class="rawImg" id="rawImg" alt="풍경 샘플 이미지" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='64'><rect width='220' height='64' fill='%23ffd23f'/><circle cx='186' cy='16' r='11' fill='%23ff9ebb'/><polygon points='0,64 52,22 104,64' fill='%23c93000'/><polygon points='62,64 138,16 214,64' fill='%2317141a'/><rect y='56' width='220' height='8' fill='%232f6df6'/></svg>">
    </div>
  </div>
  <div class="row">
    <span class="rowLabel">맞춤 이미지</span>
    <div class="frame fitFrame" id="fitFrame">
      <img class="fitImg" id="fitImg" alt="풍경 샘플 이미지" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='64'><rect width='220' height='64' fill='%23ffd23f'/><circle cx='186' cy='16' r='11' fill='%23ff9ebb'/><polygon points='0,64 52,22 104,64' fill='%23c93000'/><polygon points='62,64 138,16 16,64' fill='%234cd4a6'/><rect y='56' width='220' height='8' fill='%232f6df6'/></svg>">
      <div class="handle" id="handle" role="separator" aria-label="틀 너비 조절"></div>
    </div>
  </div>
  <div class="readout" id="readout">틀 —px</div>
</div>
</main>
<script>
(function () {
  var MIN_FRAME_PX = 130;
  var MAX_FRAME_PX = 230;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var rawFrame = document.getElementById('rawFrame');
  var rawImg = document.getElementById('rawImg');
  var fitFrame = document.getElementById('fitFrame');
  var fitImg = document.getElementById('fitImg');
  var handle = document.getElementById('handle');
  var readout = document.getElementById('readout');
  var isDemo = true;
  var frameW = 180;

  function apply() {
    rawFrame.style.width = frameW + 'px';
    fitFrame.style.width = frameW + 'px';
    // 실측 — 두 이미지의 실제 렌더 폭을 매 프레임 다시 잰다 (자연 폭 220px 는 svg width 에서 온다)
    var fitW = fitImg.getBoundingClientRect().width;
    var rawW = rawImg.getBoundingClientRect().width;
    var over = Math.max(0, Math.round(rawW - frameW));
    readout.textContent = '틀 ' + Math.round(frameW) + 'px · 그대로 ' + Math.round(rawW) +
      'px (초과 ' + over + 'px) · 맞춤 ' + Math.round(fitW) + 'px';
  }

  var start = 0;
  function loop(ts) {
    if (!start) start = ts;
    if (isDemo && !reduce) { frameW = 180 + 50 * Math.sin((ts - start) / 900); }
    apply();
    requestAnimationFrame(loop);
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  function onMove(e) {
    var rect = fitFrame.getBoundingClientRect();
    frameW = Math.min(MAX_FRAME_PX, Math.max(MIN_FRAME_PX, e.clientX - rect.left));
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  handle.addEventListener('pointerdown', function (e) {
    human();
    e.preventDefault();
    onMove(e);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
