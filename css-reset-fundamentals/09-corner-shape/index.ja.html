<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角の形状比較 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <span class="supportBadge" id="supportBadge">確認中</span>
  <div class="cards">
    <div class="cardCol">
      <span class="colLabel">border-radius の既定の円弧</span>
      <div class="card cardRadius" id="cardRadius"></div>
    </div>
    <div class="cardCol">
      <span class="colLabel">corner-shape を1行追加</span>
      <div class="card cardShape" id="cardShape"></div>
    </div>
  </div>
  <div class="readout" id="readout">半径 —px</div>
</div>
</main>
<script>
(function () {
  var STEP_MS = 900;
  var MIN_R = 10;
  var MAX_R = 34;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // corner-shape 는 border-radius 옆에 한 줄만 더하면 되는 값이라 실제로 그렇게 확인한다(추측 금지)
  var supported = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('corner-shape', 'squircle');

  var wrap = document.getElementById('wrap');
  var supportBadge = document.getElementById('supportBadge');
  var cardRadius = document.getElementById('cardRadius');
  var cardShape = document.getElementById('cardShape');
  var readout = document.getElementById('readout');
  var isDemo = true;
  var r = MIN_R;

  supportBadge.textContent = supported ? 'corner-shape 対応' : '非対応環境 — 右側は自動的に円弧にフォールバック';
  supportBadge.classList.toggle('fallback', !supported);

  function apply() {
    var px = Math.round(r) + 'px';
    cardRadius.style.borderRadius = px;
    cardShape.style.borderRadius = px;
    // 실측 — 실제로 렌더된 border-radius 를 getComputedStyle 로 다시 읽는다
    var rendered = getComputedStyle(cardRadius).borderTopLeftRadius;
    readout.textContent = '半径 ' + rendered + ' · corner-shape ' + (supported ? '適用済み' : '非対応(フォールバック)');
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }
  cardRadius.addEventListener('click', function () { human(); r = r === MIN_R ? MAX_R : MIN_R; apply(); });
  cardShape.addEventListener('click', function () { human(); r = r === MIN_R ? MAX_R : MIN_R; apply(); });

  var last = 0;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce && ts - last >= STEP_MS) {
      last = ts;
      r = r === MIN_R ? MAX_R : MIN_R;
      apply();
    }
    requestAnimationFrame(loop);
  }
  apply();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
