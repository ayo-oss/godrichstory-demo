<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>セーフエリアの余白 — demo</title>
<link rel="stylesheet" href="style.css">
<style>:root { --safe-top: 0px; --safe-bottom: 0px; --safe-left: 0px; --safe-right: 0px; }</style>
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="frameOuter">
    <div class="notchTop" id="notchTop"></div>
    <div class="frameInner">
      <div class="content" id="content">
        <span class="pill" id="pill">本文</span>
      </div>
    </div>
    <div class="notchBottom" id="notchBottom"></div>
  </div>
  <input class="slider" id="slider" type="range" min="0" max="100" value="0" aria-label="セーフエリアのシミュレーション">
  <div class="readout" id="readout">上 —px・下 —px</div>
</div>
</main>
<script>
(function () {
  var SAFE_AREA_SCALE = 1.0;
  var STEP_MS_TOTAL = 2000;
  var MAX_INSET_PX = 24;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var root = document.documentElement;
  var slider = document.getElementById('slider');
  var content = document.getElementById('content');
  var readout = document.getElementById('readout');
  var isDemo = true;

  function apply(t) {
    // t: 0~1, 시뮬레이션한 기기 안전 영역 진행률 — env() 변수를 실측 CSS 커스텀 프로퍼티로 대입한다
    var top = Math.round(MAX_INSET_PX * t * SAFE_AREA_SCALE);
    var bottom = Math.round(MAX_INSET_PX * t);
    root.style.setProperty('--safe-top', top + 'px');
    root.style.setProperty('--safe-bottom', bottom + 'px');
    slider.value = String(Math.round(t * 100));
    // 실측 — padding-top 이 실제로 몇 px 렌더됐는지 getComputedStyle 로 다시 잰다
    var cs = getComputedStyle(content);
    readout.textContent = '上 ' + parseFloat(cs.paddingTop).toFixed(0) + 'px・下 ' + parseFloat(cs.paddingBottom).toFixed(0) + 'px';
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }
  slider.addEventListener('input', function () {
    human();
    apply(Number(slider.value) / 100);
  });
  slider.addEventListener('pointerdown', human);

  var start = 0;
  function loop(ts) {
    if (!start) start = ts;
    if (isDemo && !reduce) {
      var phase = ((ts - start) % STEP_MS_TOTAL) / STEP_MS_TOTAL;
      var t = phase < 0.5 ? phase * 2 : (1 - phase) * 2;
      apply(t);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
