<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heading Line-Wrap Cleanup — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="head">
    <span class="supportBadge" id="supportBadge">Checking</span>
    <button class="toggleBtn" id="toggleBtn" type="button" aria-pressed="false">Balanced line-wrap</button>
  </div>
  <div class="frame">
    <h3 class="heading" id="heading">Nine CSS reset techniques covering browser defaults through safe-area padding</h3>
    <div class="bars" id="bars"></div>
  </div>
  <div class="readout" id="readout">Lines — · deviation —px</div>
</div>
</main>
<script>
(function () {
  var STEP_MS = 220;
  var MAX_BARS = 4;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var supported = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('text-wrap', 'balance');

  var wrap = document.getElementById('wrap');
  var heading = document.getElementById('heading');
  var toggleBtn = document.getElementById('toggleBtn');
  var supportBadge = document.getElementById('supportBadge');
  var bars = document.getElementById('bars');
  var readout = document.getElementById('readout');
  var isDemo = true;
  var on = false;

  supportBadge.textContent = supported ? 'text-wrap: balance supported' : 'Not supported — fallback (no balancing)';
  supportBadge.classList.toggle('fallback', !supported);

  function lineWidths() {
    var range = document.createRange();
    range.selectNodeContents(heading);
    var rects = range.getClientRects();
    var out = [];
    for (var i = 0; i < rects.length; i++) out.push(rects[i].width);
    return out;
  }

  function stdDev(vals) {
    if (vals.length < 2) return 0;
    var mean = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
    var variance = vals.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / vals.length;
    return Math.sqrt(variance);
  }

  function render() {
    var widths = lineWidths();
    var maxW = heading.getBoundingClientRect().width || 1;
    var html = '';
    for (var i = 0; i < MAX_BARS; i++) {
      var w = widths[i] || 0;
      html += '<div class="bar" style="transform: scaleX(' + (w / maxW).toFixed(3) + '); opacity: ' + (widths[i] ? 1 : 0) + '"></div>';
    }
    bars.innerHTML = html;
    readout.textContent = 'Lines ' + widths.length + ' · deviation ±' + Math.round(stdDev(widths)) + 'px';
  }

  function apply(next) {
    on = next && supported;
    heading.style.textWrap = on ? 'balance' : 'wrap';
    toggleBtn.setAttribute('aria-pressed', String(on));
    render();
  }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }
  toggleBtn.addEventListener('click', function () { human(); apply(!on); });

  var last = 0;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce && supported && ts - last >= STEP_MS) { last = ts; apply(!on); }
    requestAnimationFrame(loop);
  }
  apply(false);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
