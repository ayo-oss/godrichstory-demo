<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그룹 고정 헤더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gh" id="gh">
  <p class="gh__hint">스크롤해도 지금 보는 그룹 이름이 위에 붙어 옵니다</p>
  <div class="gh__list" id="ghList" role="listbox" aria-label="그룹 목록" tabindex="0">
    <div class="gh__group" role="group" aria-label="제품">
      <div class="gh__head" id="ghHead0">제품</div>
      <ul class="gh__rows">
        <li class="gh__item" role="option">바나나</li>
        <li class="gh__item" role="option">파인애플</li>
        <li class="gh__item" role="option">수박</li>
        <li class="gh__item" role="option">자몽</li>
      </ul>
    </div>
    <div class="gh__group" role="group" aria-label="브랜드">
      <div class="gh__head" id="ghHead1">브랜드</div>
      <ul class="gh__rows">
        <li class="gh__item" role="option">체리</li>
        <li class="gh__item" role="option">복숭아</li>
        <li class="gh__item" role="option">딸기</li>
      </ul>
    </div>
    <div class="gh__group" role="group" aria-label="카테고리">
      <div class="gh__head" id="ghHead2">카테고리</div>
      <ul class="gh__rows">
        <li class="gh__item" role="option">아보카도</li>
        <li class="gh__item" role="option">망고</li>
        <li class="gh__item" role="option">파파야</li>
      </ul>
    </div>
  </div>
</div>
</main>
<script>
// 그룹 고정 헤더(05) — 각 그룹 헤더는 CSS position: sticky 로 스크롤 컨테이너 상단에
// 붙는다. 계산 층은 그 위에 얹는다: 다음 헤더가 현재 헤더를 밀어내기 직전 구간을
// getBoundingClientRect 로 매 프레임 재서 overlapRatio(0~1) 를 구하고, 그 값을 그림자
// 진하기(box-shadow alpha)로 환산해 "곧 교체된다"를 시각적으로 앞당겨 보여준다.
(function () {
  var list = document.getElementById('ghList');
  if (!list) return;

  var heads = Array.prototype.slice.call(list.querySelectorAll('.gh__head'));

  function applyShadow(i, ratio) {
    var head = heads[i];
    if (!head) return;
    var alpha = 0.10 + 0.28 * ratio;
    head.style.boxShadow = '0 6px 10px rgba(23,20,26,' + alpha.toFixed(3) + ')';
    head.style.borderBottomColor = 'rgba(23,20,26,' + (0.08 + 0.4 * ratio).toFixed(3) + ')';
  }

  function measureStuck() {
    var listTop = list.getBoundingClientRect().top;
    for (var i = 0; i < heads.length; i++) {
      var next = heads[i + 1];
      if (!next) { applyShadow(i, 0); continue; }
      var headH = heads[i].offsetHeight;
      var nextTop = next.getBoundingClientRect().top - listTop;
      var ratio = 1 - Math.min(1, Math.max(0, (nextTop - headH) / headH));
      ratio = Math.min(1, Math.max(0, ratio));
      applyShadow(i, ratio);
    }
  }
  measureStuck();

  var playing = true;
  function stop() { playing = false; }
  list.addEventListener('wheel', stop, { passive: true });
  list.addEventListener('pointerdown', stop);
  list.addEventListener('scroll', measureStuck, { passive: true });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!reduce) {
    var period = 2000;
    var start = performance.now();
    (function tick(now) {
      if (playing) {
        var t = (now - start) % period;
        var half = period / 2;
        var p = t < half ? (t / half) : ((period - t) / half);
        var max = list.scrollHeight - list.clientHeight;
        list.scrollTop = p * max;
        measureStuck();
      }
      requestAnimationFrame(tick);
    })(start);
  }
})();
</script>
</body>
</html>
