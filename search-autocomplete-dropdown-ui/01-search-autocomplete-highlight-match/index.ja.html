<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一致箇所ハイライト — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="hl" id="hl">
  <p class="hl__hint">入力した文字が候補のどこにあるかを探して太字で示します</p>
  <div class="hl__field" role="combobox" aria-expanded="false" aria-owns="hlList" aria-haspopup="listbox" id="hlField">
    <svg class="hl__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M192 112a80 80 0 1 1-80-80a80 80 0 0 1 80 80" opacity=".35"/><path d="m229.66 218.34l-50.06-50.06a88.21 88.21 0 1 0-11.32 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></g></svg>
    <input class="hl__input" id="hlInput" type="text" role="searchbox" aria-autocomplete="list" aria-controls="hlList" aria-label="フルーツ検索" autocomplete="off">
  </div>
  <ul class="hl__list" id="hlList" role="listbox" aria-label="候補リスト"></ul>
  <p class="hl__meta"><b class="hl__tag" id="hlCount">8</b><span class="hl__unit" id="hlUnitText">件</span></p>
</div>
</main>
<script>
// 일치 하이라이트(01) — 제안 문자열에서 입력어의 첫 일치 위치를 indexOf 로 찾아
// <mark> 로 감싸고, 그 뒤부터 다시 찾아 모든 일치를 강조한다(다중 일치). 비교는
// toLowerCase 로 통일해 대소문자를 무시한다. 자동 시연은 performance.now() 시계로
// 타이핑 시퀀스를 재생한다(CSS @keyframes 없음).
(function () {
  var field = document.getElementById('hlField');
  var input = document.getElementById('hlInput');
  var list = document.getElementById('hlList');
  var countEl = document.getElementById('hlCount');
  var unitEl = document.getElementById('hlUnitText');
  if (!field || !input || !list || !countEl) return;

  var WORDS = ['バナナ', 'パパイヤ', 'アボカド', 'パイナップル', 'グレープフルーツ', 'チェリー', '桃', 'スイカ'];

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, function (c) { return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;'; });
  }

  function highlightAll(text, query) {
    if (!query) return escapeHtml(text);
    var lowerText = text.toLowerCase();
    var lowerQuery = query.toLowerCase();
    var out = '', i = 0;
    while (i < text.length) {
      var idx = lowerText.indexOf(lowerQuery, i);
      if (idx === -1) { out += escapeHtml(text.slice(i)); break; }
      out += escapeHtml(text.slice(i, idx));
      out += '<mark class="hl__mark">' + escapeHtml(text.slice(idx, idx + query.length)) + '</mark>';
      i = idx + query.length;
    }
    return out;
  }

  function render(query) {
    var matched = 0;
    var rows = WORDS.map(function (w) {
      var hit = query && w.toLowerCase().indexOf(query.toLowerCase()) !== -1;
      if (hit) matched++;
      return '<li class="hl__item' + (hit ? ' is-hit' : ' is-dim') + '" role="option">' + highlightAll(w, query) + '</li>';
    });
    list.innerHTML = rows.join('');
    countEl.textContent = String(query ? matched : WORDS.length);
    unitEl.textContent = query ? '件一致' : '件の候補';
    field.setAttribute('aria-expanded', query ? 'true' : 'false');
  }
  render('');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var playing = true;
  function stop() { playing = false; }
  function onUserInput() { stop(); render(input.value); }
  input.addEventListener('input', onUserInput);
  input.addEventListener('keydown', stop);
  input.addEventListener('pointerdown', stop);

  var STEPS = [
    { q: '', ms: 220 },
    { q: 'パ', ms: 360 },
    { q: 'パイ', ms: 520 },
    { q: 'パイ', ms: 260 },
    { q: '', ms: 220 },
    { q: 'ス', ms: 360 },
    { q: 'スイカ', ms: 520 }
  ];

  if (reduce) {
    input.value = STEPS[2].q;
    render(STEPS[2].q);
  } else {
    var seg = 0, segStart = performance.now();
    (function step(now) {
      if (playing) {
        var elapsed = now - segStart;
        if (elapsed >= STEPS[seg].ms) {
          seg = (seg + 1) % STEPS.length;
          segStart = now;
        }
        var q = STEPS[seg].q;
        if (input.value !== q) { input.value = q; render(q); }
      }
      requestAnimationFrame(step);
    })(segStart);
  }
})();
</script>
</body>
</html>
