<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typo Suggestion — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ty" id="ty">
  <p class="ty__hint">If it's a typo, it calculates the edit distance and suggests the closest word.</p>
  <div class="ty__field" role="combobox" aria-expanded="false" aria-owns="tyList" aria-haspopup="listbox" id="tyField">
    <input class="ty__input" id="tyInput" type="text" role="searchbox" aria-autocomplete="list" aria-controls="tyList" aria-label="Search fruit" autocomplete="off" readonly>
  </div>
  <ul class="ty__list" id="tyList" role="listbox" aria-label="Candidate list"></ul>
</div>
</main>
<script>
// 오타 제안(06) — 입력어와 후보 각각 사이의 레벤슈타인 편집거리를 2차원 DP 표로 계산해
// 최소 거리 후보를 찾는다. 거리 0 이면 정확히 일치, 1~THRESHOLD 이면 "Did you mean this?"
// 줄에 원래 단어를 제안, 그보다 크면 무시한다. 비교 전 toLowerCase + trim 으로
// 대소문자·공백을 정규화한 뒤 다시 거리를 잰다.
(function () {
  var field = document.getElementById('tyField');
  var input = document.getElementById('tyInput');
  var list = document.getElementById('tyList');
  if (!field || !input || !list) return;

  var WORDS = ['banana', 'papaya', 'avocado', 'pineapple', 'grapefruit', 'cherry', 'peach', 'watermelon', 'strawberry', 'mango'];
  var THRESHOLD = 2;

  function normalize(s) {
    return s.toLowerCase().trim();
  }

  function editDistance(a, b) {
    var m = a.length, n = b.length;
    var dp = [];
    for (var i = 0; i <= m; i++) { dp.push([i]); }
    for (var j = 0; j <= n; j++) { dp[0][j] = j; }
    for (i = 1; i <= m; i++) {
      for (j = 1; j <= n; j++) {
        if (a[i - 1] === b[j - 1]) dp[i][j] = dp[i - 1][j - 1];
        else {
          dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
        }
      }
    }
    return dp[m][n];
  }

  function nearest(query) {
    var q = normalize(query);
    var best = null, bestDist = Infinity;
    WORDS.forEach(function (w) {
      var d = editDistance(q, normalize(w));
      if (d < bestDist) { bestDist = d; best = w; }
    });
    return { word: best, dist: bestDist };
  }

  function render(query) {
    if (!query) {
      list.innerHTML = WORDS.map(function (w) {
        return '<li class="ty__item" role="option">' + w + '</li>';
      }).join('');
      field.setAttribute('aria-expanded', 'false');
      return;
    }
    var q = normalize(query);
    var exact = WORDS.filter(function (w) { return normalize(w).indexOf(q) !== -1; });
    var rows = '';
    if (exact.length) {
      rows = exact.map(function (w) {
        return '<li class="ty__item is-exact" role="option">' + w + '</li>';
      }).join('');
    } else {
      var n = nearest(query);
      if (n.dist >= 1 && n.dist <= THRESHOLD) {
        var emph = (THRESHOLD - n.dist + 1) / THRESHOLD;
        var alpha = (0.08 + 0.14 * emph).toFixed(3);
        rows = '<li class="ty__item ty__item--typo" role="option" aria-live="polite" style="--emph:' + emph.toFixed(2) + ';background:rgba(10,79,232,' + alpha + ')">' +
          '<span class="ty__typoLabel">Did you mean this?</span>' +
          '<span class="ty__typoWord">' + n.word + '</span></li>';
      } else {
        rows = '<li class="ty__item ty__item--empty">No matching fruit.</li>';
      }
    }
    list.innerHTML = rows;
    field.setAttribute('aria-expanded', 'true');
  }
  render('');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var playing = true;
  function stop() { playing = false; }
  input.addEventListener('beforeinput', stop);
  input.addEventListener('input', function () { render(input.value); });
  input.addEventListener('pointerdown', stop);

  var STEPS = [
    { q: '', ms: 260 },
    { q: 'banana', ms: 420 },
    { q: 'bandna', ms: 560 },
    { q: '', ms: 220 },
    { q: 'watermelon', ms: 420 },
    { q: 'watermellon', ms: 560 }
  ];

  if (reduce) {
    input.value = STEPS[2].q;
    render(STEPS[2].q);
  } else {
    var seg = 0, segStart = performance.now();
    (function step(now) {
      if (playing) {
        var elapsed = now - segStart;
        if (elapsed >= STEPS[seg].ms) {
          seg = (seg + 1) % STEPS.length;
          segStart = now;
        }
        var q = STEPS[seg].q;
        if (input.value !== q) { input.value = q; render(q); }
      }
      requestAnimationFrame(step);
    })(segStart);
  }
})();
</script>
</body>
</html>
