<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyboard Wrap Navigation — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="kb" id="kb">
  <p class="kb__hint">
    <svg class="kb__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 64v128a8 8 0 0 1-8 8H32a8 8 0 0 1-8-8V64a8 8 0 0 1 8-8h192a8 8 0 0 1 8 8" opacity=".2"/><path d="M224 48H32a16 16 0 0 0-16 16v128a16 16 0 0 0 16 16h192a16 16 0 0 0 16-16V64a16 16 0 0 0-16-16m0 144H32V64h192zm-16-64a8 8 0 0 1-8 8H56a8 8 0 0 1 0-16h144a8 8 0 0 1 8 8m0-32a8 8 0 0 1-8 8H56a8 8 0 0 1 0-16h144a8 8 0 0 1 8 8M72 160a8 8 0 0 1-8 8h-8a8 8 0 0 1 0-16h8a8 8 0 0 1 8 8m96 0a8 8 0 0 1-8 8H96a8 8 0 0 1 0-16h64a8 8 0 0 1 8 8m40 0a8 8 0 0 1-8 8h-8a8 8 0 0 1 0-16h8a8 8 0 0 1 8 8"/></g></svg>
    Cycle through the list with the up and down arrow keys.
  </p>
  <div class="kb__field" role="combobox" aria-expanded="true" aria-owns="kbList" aria-haspopup="listbox" id="kbField">
    <input class="kb__input" id="kbInput" type="text" role="searchbox" aria-autocomplete="list" aria-controls="kbList" aria-label="Browse fruit list" aria-activedescendant="kb-opt-0" autocomplete="off" readonly>
  </div>
  <ul class="kb__list" id="kbList" role="listbox" aria-label="Fruit list"></ul>
</div>
</main>
<script>
// 키보드 순환 탐색(03) — 활성 인덱스는 항상 (i + delta + 길이) % 길이 로 계산해
// 배열 양 끝에서 반대쪽으로 순환한다(음수 나머지를 피하려 길이를 한 번 더 더한다).
// aria-activedescendant 로 지금 활성 항목을 스크린리더에 알리고, scrollIntoView 의
// block:'nearest' 로 필요한 최소 거리만 스크롤한다(항상 맨 위로 당기지 않는다).
(function () {
  var field = document.getElementById('kbField');
  var input = document.getElementById('kbInput');
  var list = document.getElementById('kbList');
  if (!field || !input || !list) return;

  var WORDS = ['banana', 'papaya', 'avocado', 'pineapple', 'grapefruit', 'cherry', 'peach', 'watermelon', 'strawberry', 'mango'];
  var activeIndex = 0;

  list.innerHTML = WORDS.map(function (w, i) {
    return '<li class="kb__item" role="option" id="kb-opt-' + i + '">' + w + '</li>';
  }).join('');
  var items = list.querySelectorAll('.kb__item');

  function updateActive() {
    for (var i = 0; i < items.length; i++) items[i].classList.remove('is-active');
    var el = items[activeIndex];
    if (!el) return;
    el.classList.add('is-active');
    input.setAttribute('aria-activedescendant', el.id);
    el.scrollIntoView({ block: 'nearest' });
  }

  function moveActive(delta) {
    activeIndex = (activeIndex + delta + WORDS.length) % WORDS.length;
    updateActive();
  }
  updateActive();

  var playing = true;
  function stop() { playing = false; }
  function onKeydown(e) {
    stop();
    if (e.key === 'ArrowDown') { e.preventDefault(); moveActive(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveActive(-1); }
  }
  input.addEventListener('keydown', onKeydown);
  input.addEventListener('pointerdown', stop);

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STEP_MS = reduce ? 0 : 230;

  if (STEP_MS > 0) {
    var last = performance.now();
    (function tick(now) {
      if (playing) {
        if (now - last >= STEP_MS) {
          moveActive(1);
          last = now;
        }
      }
      requestAnimationFrame(tick);
    })(last);
  }
})();
</script>
</body>
</html>
