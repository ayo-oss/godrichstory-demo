<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Sheet Morph — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ms" id="ms">
  <p class="ms__hint">When the screen is narrow, matchMedia rearranges the same list into a bottom sheet.</p>
  <div class="ms__field">
    <input class="ms__input" type="text" value="pineapple" readonly aria-label="Search fruit">
  </div>
  <div class="ms__sheet" id="msSheet">
    <span class="ms__handle" aria-hidden="true"></span>
    <ul class="ms__list" id="msList" role="listbox" aria-label="Suggestion list"></ul>
  </div>
</div>
</main>
<script>
// 모바일 시트 변신(08) — matchMedia(340px) 로 좁은 화면을 감지해 같은 목록 DOM 을
// 인라인 드롭다운/바텀시트로 재배치한다(root 클래스 토글, 진짜 API). 가상 키보드는
// 정적 캡처에서 실제로 열리지 않으니, window.visualViewport 로 실측한 높이(있으면
// innerHeight 와의 차)를 기본값으로 삼고 그 위에 스크립트로 만든 0→1 목표값을
// lerp(관성 보간)로 뒤쫓게 해 "키보드가 밀어 올리는" 느낌을 재현한다 — 목록의
// max-height 를 --kb 변수로 calc() 에 물린다.
(function () {
  var root = document.getElementById('ms');
  var sheet = document.getElementById('msSheet');
  var list = document.getElementById('msList');
  if (!root || !sheet || !list) return;

  var WORDS = ['pineapple', 'banana', 'grapefruit', 'cherry', 'watermelon', 'mango'];
  list.innerHTML = WORDS.map(function (w) {
    return '<li class="ms__item" role="option">' + w + '</li>';
  }).join('');

  var mq = window.matchMedia('(max-width: 340px)');
  function applyLayout(m) { root.classList.toggle('is-sheet', m.matches); }
  applyLayout(mq);
  if (mq.addEventListener) mq.addEventListener('change', applyLayout);
  else if (mq.addListener) mq.addListener(applyLayout);

  var vv = window.visualViewport;
  function realKbPx() {
    if (!vv) return 0;
    return Math.max(0, window.innerHeight - vv.height);
  }
  // 정적 캡처에서는 realKbPx() 가 대부분 0 이라 화면에 보이는 열림·닫힘은
  // 아래 목표값 lerp 가 만든다 — 실제 기기에서는 이 값이 목표값을 대신한다.
  var current = 0, target = 0;
  var lastFlip = 0;

  function tick(now) {
    if (now - lastFlip > 900) {
      target = target === 0 ? 1 : 0;
      lastFlip = now;
    }
    current += (target - current) * 0.12;
    sheet.style.setProperty('--kb', current.toFixed(4));
    if (playing) requestAnimationFrame(tick);
  }

  var playing = true;
  function stop() {
    playing = false;
    sheet.style.setProperty('--kb', '0');
  }
  root.addEventListener('pointerdown', stop);

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    sheet.style.setProperty('--kb', String(realKbPx() > 0 ? 1 : 0.4));
  } else {
    requestAnimationFrame(function (t) { lastFlip = t; tick(t); });
  }
})();
</script>
</body>
</html>
