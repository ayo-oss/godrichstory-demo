<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리듀스 모션 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rm" id="rm">
  <div class="rm__row">
    <input class="rm__input" type="text" value="복숭아" readonly aria-label="과일 검색" aria-expanded="false" id="rmInput" role="combobox" aria-owns="rmList" aria-haspopup="listbox">
    <button class="rm__switch" type="button" role="switch" aria-checked="false" id="rmSwitch" aria-label="모션 줄이기">
      <span class="rm__knob"></span>
    </button>
  </div>
  <ul class="rm__list" id="rmList" role="listbox" aria-label="제안 목록"></ul>
</div>
</main>
<script>
// 리듀스 모션(09) — 항목마다 등장 지연을 index * step 으로 계산해 순서대로 뜨는
// 스태거를 만들고, prefers-reduced-motion(matchMedia 실제 감지) 이거나 스위치가
// 켜지면 step 을 0 으로 눌러 같은 목록이 지연 없이 한 번에 뜬다 — 기능은 그대로,
// 모션만 사라진다. 디바운스 대기 시간(요청 절약) 은 모션과 무관하므로 건드리지 않는다.
(function () {
  var root = document.getElementById('rm');
  var input = document.getElementById('rmInput');
  var list = document.getElementById('rmList');
  var switchBtn = document.getElementById('rmSwitch');
  if (!root || !input || !list || !switchBtn) return;

  var WORDS = ['복숭아', '딸기', '망고', '자몽', '체리'];
  var STEP_MS = 50;

  var systemReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var reduced = systemReduced;

  function setSwitch(on) {
    reduced = on;
    switchBtn.setAttribute('aria-checked', on ? 'true' : 'false');
    root.classList.toggle('is-reduced', on);
  }
  setSwitch(reduced);

  function close() {
    input.setAttribute('aria-expanded', 'false');
    list.innerHTML = '';
  }

  function open() {
    var step = reduced ? 0 : STEP_MS;
    list.innerHTML = WORDS.map(function (w, i) {
      return '<li class="rm__item" role="option" style="--delay:' + (i * step) + 'ms">' + w + '</li>';
    }).join('');
    input.setAttribute('aria-expanded', 'true');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        list.classList.add('is-open');
      });
    });
  }

  function reopen() {
    list.classList.remove('is-open');
    close();
    requestAnimationFrame(function () { open(); });
  }

  open();
  list.classList.add('is-open');

  var playing = true;
  function stop() { playing = false; }
  switchBtn.addEventListener('click', function () {
    stop();
    setSwitch(!reduced);
    reopen();
  });
  root.addEventListener('pointerdown', function (e) {
    if (e.target !== switchBtn && !switchBtn.contains(e.target)) stop();
  });

  if (!systemReduced && playing) {
    setInterval(function () {
      if (!playing) return;
      setSwitch(!reduced);
      reopen();
    }, 500);
  }
})();
</script>
</body>
</html>
