<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkle cursor trail — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sc-wrap is-demo">
    <span class="sc-piece">✦</span><span class="sc-piece">✦</span><span class="sc-piece">✦</span>
    <span class="sc-piece">✦</span><span class="sc-piece">✦</span><span class="sc-piece">✦</span>
  </div>
</main>
<script>
var wrap = document.querySelector('.sc-wrap');
wrap.addEventListener('pointermove', function (e) {
  wrap.classList.remove('is-demo');
  var r = wrap.getBoundingClientRect();
  wrap.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  wrap.style.setProperty('--my', (e.clientY - r.top) + 'px');
});
</script>
</body>
</html>
