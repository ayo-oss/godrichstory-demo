<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confetti burst on button — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cb-wrap is-demo">
    <button class="cb-btn" type="button">가입 완료</button>
    <span class="cb-piece"></span><span class="cb-piece"></span><span class="cb-piece"></span>
    <span class="cb-piece"></span><span class="cb-piece"></span><span class="cb-piece"></span>
    <span class="cb-piece"></span><span class="cb-piece"></span><span class="cb-piece"></span>
    <span class="cb-piece"></span><span class="cb-piece"></span><span class="cb-piece"></span>
  </div>
</main>
<script>
var wrap = document.querySelector('.cb-wrap');
var btn = document.querySelector('.cb-btn');
btn.addEventListener('click', function () {
  wrap.classList.remove('is-burst');
  void wrap.offsetWidth;
  wrap.classList.add('is-burst');
});
</script>
</body>
</html>
