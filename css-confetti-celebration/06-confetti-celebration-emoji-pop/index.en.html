<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emoji pop — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ep-wrap is-demo">
    <button class="ep-btn" type="button" aria-pressed="false">👏 Cheer</button>
    <span class="ep-emoji ep-emoji--1">🎉</span>
    <span class="ep-emoji ep-emoji--2">✨</span>
    <span class="ep-emoji ep-emoji--3">🎊</span>
  </div>
</main>
<script>
var wrap = document.querySelector('.ep-wrap');
var btn = document.querySelector('.ep-btn');
btn.addEventListener('click', function () {
  wrap.classList.remove('is-pop');
  void wrap.offsetWidth;
  wrap.classList.add('is-pop');
});
</script>
</body>
</html>
