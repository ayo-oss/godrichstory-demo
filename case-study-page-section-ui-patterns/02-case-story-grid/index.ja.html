<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스토리 그리드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint" id="hint">事例ごとの成果指標を互いに比較してインパクトスコアを直接求め、そのスコアでタイルの大きさを決め直します</p>
  <div class="grid" id="grid" role="list" aria-label="事例一覧">
    <article class="tile" role="listitem"><p class="tileName">ノヴァ</p><p class="tileNum"><span class="tileVal">0</span><span class="tileUnit">%</span></p></article>
    <article class="tile" role="listitem"><p class="tileName">アトラス</p><p class="tileNum"><span class="tileVal">0</span><span class="tileUnit">%</span></p></article>
    <article class="tile" role="listitem"><p class="tileName">コバルト</p><p class="tileNum"><span class="tileVal">0</span><span class="tileUnit">%</span></p></article>
    <article class="tile" role="listitem"><p class="tileName">シルバーライン</p><p class="tileNum"><span class="tileVal">0</span><span class="tileUnit">%</span></p></article>
    <article class="tile" role="listitem"><p class="tileName">テラ</p><p class="tileNum"><span class="tileVal">0</span><span class="tileUnit">%</span></p></article>
  </div>
</section>
</main>
<script>
// 스토리 그리드(02) — 사례별 성과 수치를 이번 데이터셋의 최댓값과 비교해 0~1 로 정규화하고,
// IMPACT_WEIGHT 거듭제곱을 적용해 임팩트 점수를 직접 구한다. 점수 구간마다 grid-column/grid-row
// span·패딩·숫자 크기를 다시 정해 타일 배치를 매번 다시 계산한다(계산 한 겹).
// 자동 시연은 두 데이터셋을 번갈아 넣어 점수와 배치가 매번 다시 구해지는 것을 보여준다.
(function () {
  var grid = document.getElementById('grid');
  if (!grid) return;
  var tiles = Array.prototype.slice.call(grid.querySelectorAll('.tile'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var IMPACT_WEIGHT = 1;   // 변형: .5 → 1.5
  var DATASETS = [
    [82, 45, 63, 21, 38],
    [30, 71, 55, 90, 24]
  ];

  function tierFor(weighted) {
    if (weighted >= .75) return { col: 2, row: 2, pad: 'p3', font: 'f3' };
    if (weighted >= .5) return { col: 2, row: 1, pad: 'p2', font: 'f2' };
    if (weighted >= .28) return { col: 1, row: 1, pad: 'p1', font: 'f1' };
    return { col: 1, row: 1, pad: 'p0', font: 'f0' };
  }

  function apply(values) {
    var max = Math.max.apply(null, values);
    tiles.forEach(function (tile, i) {
      var value = values[i];
      var normalized = max > 0 ? value / max : 0;
      var weighted = Math.pow(normalized, IMPACT_WEIGHT);
      var tier = tierFor(weighted);
      tile.style.gridColumn = 'span ' + tier.col;
      tile.style.gridRow = 'span ' + tier.row;
      tile.dataset.pad = tier.pad;
      tile.dataset.font = tier.font;
      var valEl = tile.querySelector('.tileVal');
      if (valEl) valEl.textContent = String(value);
      if (!reduce) {
        tile.classList.remove('tile--pulse');
        void tile.offsetWidth;
        tile.classList.add('tile--pulse');
      }
    });
  }

  var idx = 0;
  apply(DATASETS[0]);
  if (!reduce) {
    setInterval(function () {
      idx = (idx + 1) % DATASETS.length;
      apply(DATASETS[idx]);
    }, 600);
  }
})();
</script>
</body>
</html>
