<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인용 블록 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint" id="hint">인용문을 실제 캔버스로 재 보고, 목표 폭에 맞는 글자 크기를 거꾸로 풀어서 매번 다시 구합니다</p>
  <blockquote class="quote">
    <p class="quoteText" id="quoteText">이 카드 컴포넌트 하나로 디자인 검토 시간이 절반으로 줄었습니다.</p>
  </blockquote>
  <p class="quoteAuthor" id="quoteAuthor">— 김서연, 아틀라스 프로덕트 리드</p>
</section>
</main>
<script>
// 인용 블록(04) — 인용문 길이가 매번 다르므로, 목표 폭(카드 안쪽 폭)에 맞는 글자 크기를
// canvas measureText 로 실제 렌더 폭을 재보며 이분 탐색으로 거꾸로 풀어 찾는다(계산 한 겹).
// 최대 크기에서 시작해 넘치면 줄이고, 남으면 최대치까지 다시 키운다 — 고정 크기 하드코딩이 아니다.
(function () {
  var textEl = document.getElementById('quoteText');
  var authorEl = document.getElementById('quoteAuthor');
  if (!textEl || !authorEl) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var QUOTES = [
    { text: '이 카드 컴포넌트 하나로 디자인 검토 시간이 절반으로 줄었습니다.', author: '— 김서연, 아틀라스 프로덕트 리드' },
    { text: '온보딩 화면을 새로 짜고 나서 첫 주 이탈이 눈에 띄게 줄었어요.', author: '— 박도윤, 코발트 그로스팀' },
    { text: '팀 전체가 같은 컴포넌트를 쓰니 리뷰에서 다툴 일이 사라졌습니다.', author: '— 이하은, 실버라인 디자인 시스템' }
  ];

  var MIN_PX = 12;
  var MAX_PX = 20;
  var TOLERANCE = 1;
  var cv = document.createElement('canvas');
  var ctx = cv.getContext('2d');

  function widthAt(text, px) {
    if (!ctx) return text.length * px * 0.56;
    ctx.font = '600 ' + px + 'px -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    return ctx.measureText(text).width;
  }

  // 목표 폭 안에 들어가는 가장 큰 글자 크기를 이분 탐색으로 거꾸로 푼다.
  function solveFontSize(text, targetWidth) {
    var lo = MIN_PX, hi = MAX_PX, best = MIN_PX;
    for (var i = 0; i < 14; i++) {
      var mid = (lo + hi) / 2;
      var w = widthAt(text, mid);
      if (w <= targetWidth - TOLERANCE) {
        best = mid;
        lo = mid;
      } else {
        hi = mid;
      }
    }
    return best;
  }

  function applyQuote(quote) {
    var targetWidth = textEl.clientWidth * 2.6; // 두 줄 남짓으로 접힐 총 글자폭 예산
    var px = solveFontSize(quote.text, targetWidth);
    textEl.style.fontSize = px.toFixed(1) + 'px';
    textEl.textContent = quote.text;
    authorEl.textContent = quote.author;
  }

  var idx = 0;
  applyQuote(QUOTES[0]);
  if (!reduce) {
    setInterval(function () {
      idx = (idx + 1) % QUOTES.length;
      textEl.classList.remove('quoteText--swap');
      void textEl.offsetWidth;
      applyQuote(QUOTES[idx]);
      textEl.classList.add('quoteText--swap');
    }, 700);
  }
})();
</script>
</body>
</html>
