<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Related cases CTA — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint" id="hint">It counts how many tags overlap with the case you're viewing to score each card, then reorders them by score.</p>
  <p class="baseTagRow" id="baseTagRow">Current case tags: <span id="baseTags">Growth · Onboarding · B2B</span></p>
  <div class="list" id="list" role="list" aria-label="Related cases"></div>
</section>
</main>
<script>
// Related cases CTA(07) — 카드마다 태그 목록을 갖고, 지금 보는 사례 태그와 겹치는 개수를 매번
// 직접 세어 관련도 점수로 삼는다. 점수 내림차순으로 다시 정렬하고, FLIP(측정 전 위치 기록 →
// DOM 갱신 → 측정 후 위치와의 차이만큼 역보정 이동)으로 순서 변화를 transform 만으로 보여준다.
(function () {
  var list = document.getElementById('list');
  var baseTagsEl = document.getElementById('baseTags');
  if (!list || !baseTagsEl) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var BASE_SETS = [
    ['Growth', 'Onboarding', 'B2B'],
    ['Fintech', 'Security', 'Dashboard'],
    ['E-commerce', 'Checkout', 'Mobile']
  ];

  var CARDS = [
    { id: 'nova', name: 'Nova · Growth Report', tags: ['Growth', 'Onboarding', 'SaaS'] },
    { id: 'atlas', name: 'Atlas · B2B Sales', tags: ['B2B', 'Onboarding', 'Dashboard'] },
    { id: 'cobalt', name: 'Cobalt · Payment Security', tags: ['Fintech', 'Security', 'B2B'] },
    { id: 'silverline', name: 'Silverline · Checkout', tags: ['E-commerce', 'Checkout', 'Mobile'] },
    { id: 'terra', name: 'Terra · Mobile Dashboard', tags: ['Dashboard', 'Mobile', 'Growth'] }
  ];

  var cardEls = {};
  CARDS.forEach(function (card) {
    var el = document.createElement('article');
    el.className = 'card';
    el.setAttribute('role', 'listitem');
    el.dataset.id = card.id;
    el.innerHTML =
      '<p class="cardName">' + card.name + '</p>' +
      '<p class="cardScore"><span class="cardScoreNum">0</span><span class="cardScoreLabel"> tags matched</span></p>';
    list.appendChild(el);
    cardEls[card.id] = el;
  });

  function scoreFor(card, baseTags) {
    var overlap = 0;
    for (var i = 0; i < card.tags.length; i++) {
      if (baseTags.indexOf(card.tags[i]) !== -1) overlap++;
    }
    return overlap;
  }

  function applyBase(baseTags) {
    baseTagsEl.textContent = baseTags.join(' · ');

    var scored = CARDS.map(function (card) {
      return { card: card, score: scoreFor(card, baseTags) };
    });
    scored.sort(function (a, b) { return b.score - a.score; });

    // FLIP: 이동 전 위치를 먼저 기록한다.
    var firstRects = {};
    CARDS.forEach(function (card) {
      firstRects[card.id] = cardEls[card.id].getBoundingClientRect();
    });

    scored.forEach(function (entry) {
      var el = cardEls[entry.card.id];
      list.appendChild(el);
      var numEl = el.querySelector('.cardScoreNum');
      if (numEl) numEl.textContent = String(entry.score);
    });

    if (reduce) return;

    // Last: 이동 후 위치를 재고, Invert: 차이를 계산해 transform 으로 되돌린 뒤 Play: 0 으로 애니메이션.
    CARDS.forEach(function (card) {
      var el = cardEls[card.id];
      var first = firstRects[card.id];
      var last = el.getBoundingClientRect();
      var dx = first.left - last.left;
      var dy = first.top - last.top;
      if (dx === 0 && dy === 0) return;
      el.style.transition = 'none';
      el.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
      el.getBoundingClientRect();
      el.style.transition = '';
      requestAnimationFrame(function () {
        el.classList.add('card--flip');
        el.style.transform = '';
      });
      el.addEventListener('transitionend', function handler() {
        el.classList.remove('card--flip');
        el.removeEventListener('transitionend', handler);
      });
    });
  }

  var idx = 0;
  applyBase(BASE_SETS[0]);
  if (!reduce) {
    setInterval(function () {
      idx = (idx + 1) % BASE_SETS.length;
      applyBase(BASE_SETS[idx]);
    }, 1600);
  }
})();
</script>
</body>
</html>
