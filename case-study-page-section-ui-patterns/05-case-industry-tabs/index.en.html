<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Industry 탭 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint" id="hint">Try clicking a tab — the underline doesn't guess a value, it measures the pressed tab's actual rendered width every time and moves there.</p>
  <div class="tabsWrap">
    <div class="tabs" id="tabs" role="tablist" aria-label="Industry">
      <button class="tab" id="tab-0" role="tab" aria-selected="true" data-idx="0">E-commerce</button>
      <button class="tab" id="tab-1" role="tab" aria-selected="false" data-idx="1">Fintech</button>
      <button class="tab" id="tab-2" role="tab" aria-selected="false" data-idx="2">Healthcare</button>
      <button class="tab" id="tab-3" role="tab" aria-selected="false" data-idx="3">Education</button>
    </div>
    <div class="underline" id="underline"></div>
  </div>
  <p class="countRow">
    <span class="countNum" id="countNum">12</span>
    <span class="countLabel" id="countLabel">E-commerce cases · 28% of 43 total</span>
  </p>
</section>
</main>
<script>
// Industry 탭(05) — 실제 클릭 이벤트로 탭을 바꾼다. 밑줄은 고정 px 를 미리 적어두지 않고,
// 눌린 탭을 getBoundingClientRect 로 매번 실측해 translateX/scaleX 로 옮긴다(BD19).
// 사례 수도 매번 전체 대비 비율을 다시 나눠 구한다(계산 한 겹).
(function () {
  var tabsEl = document.getElementById('tabs');
  var underlineEl = document.getElementById('underline');
  var countNumEl = document.getElementById('countNum');
  var countLabelEl = document.getElementById('countLabel');
  if (!tabsEl || !underlineEl || !countNumEl || !countLabelEl) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var TABS = [
    { label: 'E-commerce', count: 12 },
    { label: 'Fintech', count: 9 },
    { label: 'Healthcare', count: 15 },
    { label: 'Education', count: 7 }
  ];
  var TOTAL = TABS.reduce(function (sum, t) { return sum + t.count; }, 0);
  var buttons = Array.prototype.slice.call(tabsEl.querySelectorAll('.tab'));
  var current = 0;

  function measureAndMove(idx) {
    var btn = buttons[idx];
    var wrapRect = tabsEl.getBoundingClientRect();
    var btnRect = btn.getBoundingClientRect();
    var x = btnRect.left - wrapRect.left;
    var w = btnRect.width;
    underlineEl.style.transform = 'translateX(' + x.toFixed(2) + 'px) scaleX(' + w.toFixed(2) + ')';
  }

  function selectTab(idx) {
    current = idx;
    buttons.forEach(function (b, i) {
      b.setAttribute('aria-selected', i === idx ? 'true' : 'false');
    });
    var tab = TABS[idx];
    var percent = Math.round((tab.count / TOTAL) * 100);
    countNumEl.textContent = String(tab.count);
    countLabelEl.textContent = '  ' + tab.label + '  cases ·  ' + TOTAL + ' total,  ' + percent + '%';
    measureAndMove(idx);
  }

  buttons.forEach(function (btn, i) {
    btn.addEventListener('click', function () {
      selectTab(i);
    });
  });

  underlineEl.style.transformOrigin = 'left center';
  requestAnimationFrame(function () { selectTab(0); });

  if (!reduce) {
    setInterval(function () {
      selectTab((current + 1) % TABS.length);
    }, 500);
  }

  window.addEventListener('resize', function () { measureAndMove(current); });
})();
</script>
</body>
</html>
