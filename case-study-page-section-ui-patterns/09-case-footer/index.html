<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사례 푸터 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint" id="hint">새 열람이 들어올 때마다 평균을 처음부터 다시 나누지 않고, 누적합·누적건수만 갱신해 평균을 계산합니다</p>
  <div class="footerBar">
    <div class="stat">
      <p class="statNum" id="countNum">0</p>
      <p class="statLabel">건 열람</p>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <div class="stat">
      <p class="statNum" id="avgNum">0.0</p>
      <p class="statLabel">평균 임팩트 점수</p>
    </div>
  </div>
  <p class="feedNote" id="feedNote">최근: —</p>
</section>
</main>
<script>
// 사례 푸터(09) — 새 열람 이벤트가 들어올 때마다 평균을 처음부터 다시 나누지 않고,
// 누적합(sum)과 누적건수(count)만 갱신해 running average 를 계산한다(계산 한 겹).
(function () {
  var countNum = document.getElementById('countNum');
  var avgNum = document.getElementById('avgNum');
  var feedNote = document.getElementById('feedNote');
  if (!countNum || !avgNum || !feedNote) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 가상 열람 이벤트: 임팩트 점수(0~100)가 하나씩 도착한다.
  var EVENTS = [72, 55, 88, 61, 94, 47, 76, 83, 59, 68, 91, 64];

  var sum = 0;
  var count = 0;
  var idx = 0;

  function step() {
    if (idx >= EVENTS.length) idx = 0;
    var value = EVENTS[idx];
    sum += value;
    count += 1;
    idx += 1;

    var average = sum / count;

    countNum.textContent = String(count);
    avgNum.textContent = average.toFixed(1);
    feedNote.textContent = '최근: 임팩트 ' + value + '점 열람';

    if (!reduce) {
      countNum.classList.remove('statNum--bump');
      avgNum.classList.remove('statNum--bump');
      // 리플로우를 강제해 같은 클래스를 다시 걸어도 애니메이션이 재시작되게 한다.
      void countNum.offsetWidth;
      countNum.classList.add('statNum--bump');
      avgNum.classList.add('statNum--bump');
    }
  }

  step();
  if (!reduce) {
    setInterval(step, 550);
  }
})();
</script>
</body>
</html>
