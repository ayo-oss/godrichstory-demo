<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logos:  바 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="hint" id="hint">Even if the logo count changes, the scroll speed (pixels per second) stays the same — it measures the actual rendered width and recalculates the loop duration every time.</p>
  <div class="marqueeWrap">
    <div class="marqueeTrack" id="track">
      <span class="logo" data-set="a">NOVA</span>
      <span class="logo" data-set="a">ATLAS</span>
      <span class="logo" data-set="a">COBALT</span>
      <span class="logo" data-set="a">SILVERLINE</span>
      <span class="logo" data-set="a">TERRA</span>
      <span class="logo" data-set="a">PRISM</span>
      <span class="logo" data-set="b" aria-hidden="true">NOVA</span>
      <span class="logo" data-set="b" aria-hidden="true">ATLAS</span>
      <span class="logo" data-set="b" aria-hidden="true">COBALT</span>
      <span class="logo" data-set="b" aria-hidden="true">SILVERLINE</span>
      <span class="logo" data-set="b" aria-hidden="true">TERRA</span>
      <span class="logo" data-set="b" aria-hidden="true">PRISM</span>
    </div>
  </div>
  <p class="speedNote" id="speedNote">Calculated one loop: 0.0s</p>
</section>
</main>
<script>
// Logos:  바(08) — Logos:  개수가 바뀌어도 체감 속도(초당 픽셀)가 같도록, 실제 렌더 폭을 재서
// 한 바퀴 시간을 매번 계산한다(계산 한 겹). 트랙을 통째로 2벌 두고 -50% 만큼 옮기는
// 무한 루프라 flex gap 대신 margin-right 로 간격을 준다(BD15).
(function () {
  var track = document.getElementById('track');
  var speedNote = document.getElementById('speedNote');
  if (!track || !speedNote) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var LOOP_SEC = 15;     // 변형: 15 → 30 (기준 폭에서의 한 바퀴 시간)
  var BASE_WIDTH = 560;  // 기준 렌더 폭(px) — 이 폭일 때 LOOP_SEC 이 그대로 적용된다
  var MIN_SEC = 8;
  var MAX_SEC = 40;

  function recompute() {
    var setA = track.querySelectorAll('.logo[data-set="a"]');
    var halfWidth = 0;
    setA.forEach(function (el) {
      var rect = el.getBoundingClientRect();
      var style = getComputedStyle(el);
      halfWidth += rect.width + parseFloat(style.marginRight || '0');
    });
    var duration = LOOP_SEC * (halfWidth / BASE_WIDTH);
    duration = Math.max(MIN_SEC, Math.min(MAX_SEC, duration));
    track.style.setProperty('--marquee-duration', duration.toFixed(2) + 's');
    var pxPerSec = halfWidth / duration;
    speedNote.textContent = 'Logos:  ' + setA.length + ' · calculated loop  ' + duration.toFixed(1) + 's ·  ' + Math.round(pxPerSec) + 'px';
  }

  recompute();
  window.addEventListener('resize', recompute);

  if (reduce) {
    track.style.animationPlayState = 'paused';
  }
})();
</script>
</body>
</html>
