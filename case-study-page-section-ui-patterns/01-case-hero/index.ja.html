<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사례 히어로 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="hero" id="hero">
  <p class="eyebrow" id="eyebrow">プロジェクト ノヴァ・ケーススタディ</p>
  <p class="metricLabel" id="metricLabel">主要指標</p>
  <p class="metricRow">
    <span class="metricNum" id="metricNum">0</span><span class="metricUnit" id="metricUnit">%</span>
  </p>
  <p class="hint" id="hint">画面に留まる間、主要指標を毎フレーム0から計算し直してカウントアップします</p>
</section>
</main>
<script>
// 사례 히어로(01) — 값을 누적하지 않고, 매 애니메이션 프레임마다 경과 비율(t)로부터
// 목표값까지의 값을 공식(eased(t) * target)으로 처음부터 다시 구해 카운트업한다(계산 한 겹).
// 자릿수가 늘어나는 순간에는 canvas measureText 로 그 시점 문자열의 실제 렌더 폭을 다시 재
// 숫자 칸의 폭(--num-w)을 갱신해, 다음 문자가 밀리지 않고 자리에 맞춰 넓어지게 한다.
(function () {
  var numEl = document.getElementById('metricNum');
  var wrapEl = numEl ? numEl.parentElement : null;
  if (!numEl || !wrapEl) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var TARGET = 128;
  var EASE_POW = 2;      // 변형: 2 → 4
  var ANIM_MS = 1300;
  var CYCLE_MS = 1900;

  var measureCv = document.createElement('canvas');
  var measureCtx = measureCv.getContext('2d');

  function measureWidth(text, px) {
    if (!measureCtx) return text.length * px * 0.62;
    measureCtx.font = '700 ' + px + 'px -apple-system, "Segoe UI", sans-serif';
    return measureCtx.measureText(text).width;
  }

  var lastDigits = -1;

  function applyValue(v) {
    numEl.textContent = String(v);
    var digits = String(v).length;
    if (digits !== lastDigits) {
      lastDigits = digits;
      var px = parseFloat(getComputedStyle(numEl).fontSize) || 44;
      var w = measureWidth(String(v), px);
      wrapEl.style.setProperty('--num-w', Math.ceil(w) + 'px');
    }
  }

  function runCycle() {
    if (reduce) { applyValue(TARGET); return; }
    var start = null;
    function frame(ts) {
      if (start === null) start = ts;
      var t = Math.min((ts - start) / ANIM_MS, 1);
      var eased = 1 - Math.pow(1 - t, EASE_POW);
      var val = Math.round(TARGET * eased);
      applyValue(val);
      if (t < 1) requestAnimationFrame(frame);
    }
    applyValue(0);
    requestAnimationFrame(frame);
  }

  runCycle();
  if (!reduce) setInterval(runCycle, CYCLE_MS);
})();
</script>
</body>
</html>
