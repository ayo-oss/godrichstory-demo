<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タッチドラッグ操作 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sr is-demo" id="sr">
  <div class="sr__row" id="srRow">
    <span class="sr__star"><svg class="sr__base" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg><span class="sr__fillclip" data-fc><svg class="sr__fill" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg></span></span>
    <span class="sr__star"><svg class="sr__base" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg><span class="sr__fillclip" data-fc><svg class="sr__fill" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg></span></span>
    <span class="sr__star"><svg class="sr__base" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg><span class="sr__fillclip" data-fc><svg class="sr__fill" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg></span></span>
    <span class="sr__star"><svg class="sr__base" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg><span class="sr__fillclip" data-fc><svg class="sr__fill" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg></span></span>
    <span class="sr__star"><svg class="sr__base" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg><span class="sr__fillclip" data-fc><svg class="sr__fill" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg></span></span>
  </div>
  <div class="sr__track" id="srTrack"><span class="sr__thumb" id="srThumb"></span></div>
  <div class="sr__readout"><b id="srNum">0.0</b> / 5</div>
</div>
<script>
(function () {
  var root = document.getElementById('sr');
  var track = document.getElementById('srTrack');
  var thumb = document.getElementById('srThumb');
  var clips = Array.prototype.slice.call(document.querySelectorAll('[data-fc]'));
  var numEl = document.getElementById('srNum');
  var pos = 0;
  var velocity = 0;
  var lastX = 0, lastT = 0;
  var dragging = false;
  var inertiaRaf = null;

  function width() { return track.getBoundingClientRect().width; }

  function paintFromPos(p) {
    var w = width();
    var v = Math.max(0, Math.min(5, (p / w) * 5));
    clips.forEach(function (el, idx) {
      var starVal = Math.max(0, Math.min(1, v - idx));
      el.style.width = (starVal * 100).toFixed(1) + '%';
    });
    numEl.textContent = v.toFixed(1);
    thumb.style.transform = 'translateX(' + p.toFixed(1) + 'px)';
  }

  function setPos(p) { pos = Math.max(0, Math.min(width(), p)); paintFromPos(pos); }

  function onDown(e) {
    root.classList.remove('is-demo'); stopAutoplay();
    if (inertiaRaf) { cancelAnimationFrame(inertiaRaf); inertiaRaf = null; }
    dragging = true;
    track.setPointerCapture(e.pointerId);
    lastX = e.clientX; lastT = performance.now();
    var r = track.getBoundingClientRect();
    setPos(e.clientX - r.left);
  }
  function onMove(e) {
    if (!dragging) return;
    var now = performance.now();
    var dt = Math.max(1, now - lastT);
    velocity = (e.clientX - lastX) / dt;
    lastX = e.clientX; lastT = now;
    var r = track.getBoundingClientRect();
    setPos(e.clientX - r.left);
  }
  // 계산 겹: 손을 뗀 시점의 속도(px/ms)를 그대로 이어받아 매 프레임 감쇠(마찰 0.945배)시키며
  // 위치를 계속 옮기는 관성 스크럽 — 손을 뗀 순간 값이 뚝 멈추지 않고 흐르다 멈춘다.
  function onUp() {
    if (!dragging) return;
    dragging = false;
    runInertia();
  }
  function runInertia() {
    velocity *= 0.945;
    setPos(pos + velocity * 16);
    if (Math.abs(velocity) > 0.015 && pos > 0 && pos < width()) {
      inertiaRaf = requestAnimationFrame(runInertia);
    } else {
      inertiaRaf = null;
    }
  }

  track.addEventListener('pointerdown', onDown);
  track.addEventListener('pointermove', onMove);
  track.addEventListener('pointerup', onUp);

  setPos(0);

  // 자동 루프: 드래그로 오른쪽까지 훑은 뒤 손을 뗀 상태를 흉내내 관성으로 더 흐르다 멈추는 것을
  // 반복한다 — 매 구간마다 방향을 바꿔 찔러 넣어(impulse) 감쇠 구간이 항상 겹쳐 흐르게 한다.
  var phase = 0;
  var autoTimer = null;
  function autoTick() {
    if (phase === 0) { setPos(width() * 0.08); velocity = 0.85; }
    else if (phase === 1) { velocity = 0.7; }
    else if (phase === 2) { velocity = -0.75; }
    else if (phase === 3) { velocity = -0.4; }
    runInertia();
    phase = (phase + 1) % 4;
  }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  if (!reduce) { autoTimer = setInterval(autoTick, 460); autoTick(); }
})();
</script>
</main>
</body>
</html>
