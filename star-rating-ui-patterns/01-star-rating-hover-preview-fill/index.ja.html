<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホバー先読み塗り — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sr is-demo" id="sr">
  <div class="sr__row" id="srRow" role="radiogroup" aria-label="星評価">
    <button class="sr__star" type="button" role="radio" aria-checked="false" data-i="1">
      <svg viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg>
    </button>
    <button class="sr__star" type="button" role="radio" aria-checked="false" data-i="2">
      <svg viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg>
    </button>
    <button class="sr__star" type="button" role="radio" aria-checked="false" data-i="3">
      <svg viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg>
    </button>
    <button class="sr__star" type="button" role="radio" aria-checked="false" data-i="4">
      <svg viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg>
    </button>
    <button class="sr__star" type="button" role="radio" aria-checked="false" data-i="5">
      <svg viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg>
    </button>
  </div>
  <div class="sr__readout" id="srReadout">選択 <b id="srNum">3</b>/5 · <span id="srPct">60</span>%</div>
</div>
<script>
(function () {
  var root = document.getElementById('sr');
  var row = document.getElementById('srRow');
  var stars = Array.prototype.slice.call(row.querySelectorAll('.sr__star'));
  var numEl = document.getElementById('srNum');
  var pctEl = document.getElementById('srPct');
  var readout = document.getElementById('srReadout');
  var TOTAL = stars.length;
  var value = 3;

  // 계산 겹: 채움 개수 n 을 전체 별 개수로 나눈 비율(산술)을 그대로 화면 숫자로 보여준다 —
  // 채움은 CSS 클래스가 아니라 이 비율 계산에서 나온 정수를 그대로 쓴다.
  function ratioOf(n) { return Math.round((n / TOTAL) * 100); }

  function paint(n, isPreview) {
    stars.forEach(function (s, idx) {
      s.classList.toggle('sr__star--filled', idx < n);
    });
    numEl.textContent = String(n);
    pctEl.textContent = String(ratioOf(n));
    readout.classList.toggle('sr__readout--preview', !!isPreview);
    readout.firstChild.textContent = isPreview ? 'プレビュー ' : '選択 ';
  }

  function previewTo(i) { paint(i, true); }
  function revertToValue() { paint(value, false); }
  function commit(i) {
    value = i;
    stars.forEach(function (s, idx) { s.setAttribute('aria-checked', String(idx < value)); });
    paint(value, false);
  }

  stars.forEach(function (s) {
    var i = Number(s.getAttribute('data-i'));
    s.addEventListener('pointerenter', function () { root.classList.remove('is-demo'); stopAutoplay(); previewTo(i); });
    s.addEventListener('click', function () { commit(i); });
  });
  row.addEventListener('pointerleave', function () { revertToValue(); });

  paint(value, false);

  // 자동 루프: 별 순서대로 プレビュー 값을 올렸다 원래 값으로 되돌리는 것을 반복해 보여준다.
  var step = 0;
  var autoTimer = null;
  function autoTick() {
    if (step < TOTAL) { previewTo(step + 1); }
    else { revertToValue(); }
    step = (step + 1) % (TOTAL + 2);
  }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  if (!reduce) { autoTimer = setInterval(autoTick, 280); autoTick(); }
})();
</script>
</main>
</body>
</html>
