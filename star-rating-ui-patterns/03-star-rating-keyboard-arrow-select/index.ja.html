<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">

<title>矢印キー値移動 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sr is-demo" id="sr">
  <div class="sr__row" id="srRow" role="slider" tabindex="0" aria-label="星評価" aria-valuemin="0" aria-valuemax="5" aria-valuenow="3">
    <span class="sr__star"><svg class="sr__base" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg><span class="sr__fillclip" data-fc><svg class="sr__fill" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg></span></span>
    <span class="sr__star"><svg class="sr__base" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg><span class="sr__fillclip" data-fc><svg class="sr__fill" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg></span></span>
    <span class="sr__star"><svg class="sr__base" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg><span class="sr__fillclip" data-fc><svg class="sr__fill" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg></span></span>
    <span class="sr__star"><svg class="sr__base" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg><span class="sr__fillclip" data-fc><svg class="sr__fill" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg></span></span>
    <span class="sr__star"><svg class="sr__base" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg><span class="sr__fillclip" data-fc><svg class="sr__fill" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg></span></span>
  </div>
  <div class="sr__readout"><span class="sr__hint">← → 矢印キー</span> · <b id="srNum">3</b> / 5</div>
</div>
<script>
(function () {
  var root = document.getElementById('sr');
  var row = document.getElementById('srRow');
  var clips = Array.prototype.slice.call(row.querySelectorAll('[data-fc]'));
  var numEl = document.getElementById('srNum');
  var TOTAL = clips.length;
  var target = 3;
  var display = 3;
  var raf = null;

  function paint(v) {
    clips.forEach(function (el, idx) {
      var starVal = Math.max(0, Math.min(1, v - idx));
      el.style.width = (starVal * 100).toFixed(1) + '%';
    });
  }

  // 계산 겹: 매 프레임 display 값을 target 値 쪽으로 20% 씩만 이동시키는 선형보간(lerp) —
  // 방향키를 눌러도 값이 즉시 튀지 않고 관성 있는 곡선으로 따라간다.
  function tick() {
    display += (target - display) * 0.2;
    if (Math.abs(target - display) < 0.01) {
      display = target;
      paint(display);
      raf = null;
      return;
    }
    paint(display);
    raf = requestAnimationFrame(tick);
  }
  function animateTo(t) {
    target = Math.max(0, Math.min(TOTAL, t));
    row.setAttribute('aria-valuenow', String(target));
    numEl.textContent = String(target);
    if (raf === null) raf = requestAnimationFrame(tick);
  }

  row.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); root.classList.remove('is-demo'); stopAutoplay(); animateTo(target + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); root.classList.remove('is-demo'); stopAutoplay(); animateTo(target - 1); }
  });

  paint(display);

  // 자동 루프: 방향키 입력을 흉내내 값을 0→5→0 으로 오가며 lerp 이동을 보여준다.
  var seq = [4, 5, 3, 1, 0, 2, 3];
  var seqI = 0;
  var autoTimer = null;
  function autoTick() { animateTo(seq[seqI]); seqI = (seqI + 1) % seq.length; }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  if (!reduce) { autoTimer = setInterval(autoTick, 620); autoTick(); }
})();
</script>
</main>
</body>
</html>
