<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Value Color Shift — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sr is-demo" id="sr">
  <div class="sr__row" id="srRow">
    <button class="sr__star" type="button" data-i="1"><svg viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg></button>
    <button class="sr__star" type="button" data-i="2"><svg viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg></button>
    <button class="sr__star" type="button" data-i="3"><svg viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg></button>
    <button class="sr__star" type="button" data-i="4"><svg viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg></button>
    <button class="sr__star" type="button" data-i="5"><svg viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279-6.064-5.828 8.332-1.151z"/></svg></button>
  </div>
  <div class="sr__readout" id="srReadout">Value <b id="srNum">3</b></div>
</div>
<script>
(function () {
  var root = document.getElementById('sr');
  var stars = Array.prototype.slice.call(document.querySelectorAll('.sr__star'));
  var numEl = document.getElementById('srNum');
  var readout = document.getElementById('srReadout');
  // 토큰 사이 보간 — demo-tokens 의 $error(낮은 Value)와 $subject-mint(높은 Value) hex 를 그대로 두 끝점으로 쓴다.
  var LOW = [0xc2, 0x36, 0x1a];
  var HIGH = [0x4c, 0xd4, 0xa6];

  // 계산 겹: 선택된 Value(1~5)을 0~1 비율 t 로 바꾼 뒤, 두 토큰 색의 R·G·B 채널을 각각
  // t 만큼 선형보간(mix)해 중간 색을 만든다 — HSL 회전이 아니라 채널별 산술 혼합이다.
  function mix(t) {
    var c = LOW.map(function (v, i) { return Math.round(v + (HIGH[i] - v) * t); });
    return 'rgb(' + c.join(',') + ')';
  }

  function paint(value) {
    var t = (value - 1) / 4;
    var color = mix(t);
    stars.forEach(function (s, idx) {
      s.style.color = idx < value ? color : '';
      s.classList.toggle('sr__star--filled', idx < value);
    });
    numEl.textContent = String(value);
    readout.style.color = color;
  }

  stars.forEach(function (s) {
    var i = Number(s.getAttribute('data-i'));
    s.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); paint(i); });
  });

  paint(3);

  // 자동 루프: 값을 1→5→1 로 오가며 두 토큰 색 사이를 잇는 보간 색을 보여준다.
  var seq = [1, 2, 3, 4, 5, 4, 3, 2];
  var si = 0;
  var autoTimer = null;
  function autoTick() { paint(seq[si]); si = (si + 1) % seq.length; }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  if (!reduce) { autoTimer = setInterval(autoTick, 340); autoTick(); }
})();
</script>
</main>
</body>
</html>
