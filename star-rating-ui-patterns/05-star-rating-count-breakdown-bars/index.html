<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개수 막대 분해 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sr is-demo" id="sr">
  <div class="sr__list" id="srList" role="list">
    <button class="sr__row" type="button" role="listitem" data-star="5" aria-pressed="false">
      <span class="sr__label">5</span>
      <span class="sr__track"><span class="sr__bar" data-bar></span></span>
      <span class="sr__pct" data-pct>0%</span>
    </button>
    <button class="sr__row" type="button" role="listitem" data-star="4" aria-pressed="false">
      <span class="sr__label">4</span>
      <span class="sr__track"><span class="sr__bar" data-bar></span></span>
      <span class="sr__pct" data-pct>0%</span>
    </button>
    <button class="sr__row" type="button" role="listitem" data-star="3" aria-pressed="false">
      <span class="sr__label">3</span>
      <span class="sr__track"><span class="sr__bar" data-bar></span></span>
      <span class="sr__pct" data-pct>0%</span>
    </button>
    <button class="sr__row" type="button" role="listitem" data-star="2" aria-pressed="false">
      <span class="sr__label">2</span>
      <span class="sr__track"><span class="sr__bar" data-bar></span></span>
      <span class="sr__pct" data-pct>0%</span>
    </button>
    <button class="sr__row" type="button" role="listitem" data-star="1" aria-pressed="false">
      <span class="sr__label">1</span>
      <span class="sr__track"><span class="sr__bar" data-bar></span></span>
      <span class="sr__pct" data-pct>0%</span>
    </button>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('sr');
  var rows = Array.prototype.slice.call(document.querySelectorAll('.sr__row'));
  var counts = { 5: 42, 4: 21, 3: 9, 2: 4, 1: 3 };
  var selected = null;

  // 계산 겹: 각 별점의 응답 개수를 전체 응답 개수 합으로 나눈 비율(%)을 막대 길이 값으로 쓴다.
  function total() {
    var t = 0;
    for (var k in counts) t += counts[k];
    return t;
  }

  function paint() {
    var t = total();
    rows.forEach(function (row) {
      var star = Number(row.getAttribute('data-star'));
      var pct = t ? (counts[star] / t) * 100 : 0;
      row.querySelector('[data-bar]').style.width = pct.toFixed(1) + '%';
      row.querySelector('[data-pct]').textContent = Math.round(pct) + '% (' + counts[star] + ')';
      row.classList.toggle('sr__row--on', star === selected);
      row.setAttribute('aria-pressed', String(star === selected));
    });
  }

  rows.forEach(function (row) {
    row.addEventListener('click', function () {
      root.classList.remove('is-demo'); stopAutoplay();
      var star = Number(row.getAttribute('data-star'));
      selected = selected === star ? null : star;
      paint();
    });
  });

  paint();

  // 자동 루프: 별점 5→1 순서로 한 줄씩 선택 상태를 옮기고, 한 바퀴마다 응답 개수 하나를
  // 늘려 막대 길이 비율이 실시간으로 바뀌는 것을 보여준다.
  var order = [5, 4, 3, 2, 1];
  var oi = 0;
  var bump = [5, 3, 4, 5, 2, 5, 1, 4, 5, 3];
  var bi = 0;
  var autoTimer = null;
  function autoTick() {
    selected = order[oi];
    oi = (oi + 1) % order.length;
    if (oi === 0) { var v = bump[bi % bump.length]; bi++; counts[v] = counts[v] + 1; }
    paint();
  }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  if (!reduce) { autoTimer = setInterval(autoTick, 380); autoTick(); }
})();
</script>
</main>
</body>
</html>
