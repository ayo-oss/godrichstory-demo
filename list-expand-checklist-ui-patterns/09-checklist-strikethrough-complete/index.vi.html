<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist strikethrough complete — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="ck-list" aria-label="Danh sách mua sắm">
    <li class="ck-item is-demo">
      <button class="ck-item__box" type="button" role="checkbox" aria-checked="false">
        <svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg>
      </button>
      <span class="ck-item__text">Mua một hộp dâu tây</span>
    </li>
    <li class="ck-item">
      <button class="ck-item__box" type="button" role="checkbox" aria-checked="false">
        <svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg>
      </button>
      <span class="ck-item__text">Mua sữa</span>
    </li>
  </ul>
</main>
<script>
(function () {
  document.querySelectorAll('.ck-item__box').forEach(function (box) {
    box.addEventListener('click', function () {
      var item = box.closest('.ck-item');
      item.classList.remove('is-demo');
      var checked = box.getAttribute('aria-checked') === 'true';
      box.setAttribute('aria-checked', checked ? 'false' : 'true');
      item.classList.toggle('is-checked', !checked);
    });
  });
})();
</script>
</body>
</html>
