<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grouped sticky section header — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="grp-wrap is-demo" tabindex="0" aria-label="연락처 목록. 화살표 키나 드래그로 스크롤">
    <ul class="grp-list">
      <li class="grp-group">
        <div class="grp-group__header">A</div>
        <ul class="grp-group__rows">
          <li>Ari</li><li>Aiden</li><li>Ava</li>
        </ul>
      </li>
      <li class="grp-group">
        <div class="grp-group__header">B</div>
        <ul class="grp-group__rows">
          <li>Bella</li><li>Ben</li><li>Bora</li>
        </ul>
      </li>
      <li class="grp-group">
        <div class="grp-group__header">C</div>
        <ul class="grp-group__rows">
          <li>Chloe</li><li>Charlie</li><li>Cyan</li>
        </ul>
      </li>
    </ul>
  </div>
</main>
<script>
(function () {
  var wrap = document.querySelector('.grp-wrap');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf = null, t0 = null;
  function maxY() { return wrap.scrollHeight - wrap.clientHeight; }
  function loop(ts) {
    if (!wrap.classList.contains('is-demo')) return;
    if (t0 === null) t0 = ts;
    var p = ((ts - t0) / 2000) % 1;
    var s = p < .5 ? p * 2 : 2 - p * 2;
    wrap.scrollTop = s * maxY();
    raf = requestAnimationFrame(loop);
  }
  function stop() {
    wrap.classList.remove('is-demo');
    if (raf) cancelAnimationFrame(raf);
  }
  wrap.addEventListener('pointerdown', stop);
  wrap.addEventListener('wheel', stop, { passive: true });
  wrap.addEventListener('keydown', function (e) {
    var step = 24;
    if (e.key === 'ArrowDown') { stop(); wrap.scrollTop += step; }
    else if (e.key === 'ArrowUp') { stop(); wrap.scrollTop -= step; }
    else return;
    e.preventDefault();
  });
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
