<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop-gap indicator reorder — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="rd-list is-demo" aria-label="優先度リスト。ハンドルでAlt+上/下キーにより並び替え">
    <li class="rd-item" data-i="0">
      <button class="rd-item__handle" type="button" aria-label="並び替え、上下矢印キー">
        <svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M208 32v192a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V32a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16" opacity=".2"/><path d="M104 60a12 12 0 1 1-12-12a12 12 0 0 1 12 12m60 12a12 12 0 1 0-12-12a12 12 0 0 0 12 12m-72 44a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12m-72 68a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg>
      </button>
      <span>決済エラー修正</span>
    </li>
    <li class="rd-drop-indicator" aria-hidden="true"></li>
    <li class="rd-item rd-item--lifted" data-i="1">
      <button class="rd-item__handle" type="button" aria-label="並び替え、上下矢印キー">
        <svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M208 32v192a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V32a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16" opacity=".2"/><path d="M104 60a12 12 0 1 1-12-12a12 12 0 0 1 12 12m60 12a12 12 0 1 0-12-12a12 12 0 0 0 12 12m-72 44a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12m-72 68a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg>
      </button>
      <span>ログインページQA</span>
    </li>
    <li class="rd-item" data-i="2">
      <button class="rd-item__handle" type="button" aria-label="並び替え、上下矢印キー">
        <svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M208 32v192a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V32a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16" opacity=".2"/><path d="M104 60a12 12 0 1 1-12-12a12 12 0 0 1 12 12m60 12a12 12 0 1 0-12-12a12 12 0 0 0 12 12m-72 44a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12m-72 68a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg>
      </button>
      <span>デプロイ資料整理</span>
    </li>
  </ul>
</main>
<script>
(function () {
  var list = document.querySelector('.rd-list');
  var indicator = list.querySelector('.rd-drop-indicator');
  function order() { return Array.prototype.slice.call(list.querySelectorAll('.rd-item')); }

  order().forEach(function (item) {
    var handle = item.querySelector('.rd-item__handle');
    var dragging = false, startY = 0;

    handle.addEventListener('pointerdown', function (e) {
      list.classList.remove('is-demo');
      dragging = true;
      startY = e.clientY;
      item.classList.add('is-dragging');
      list.classList.add('is-dragging');
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      item.style.transform = 'translateY(' + (e.clientY - startY) + 'px)';
      var rest = order().filter(function (r) { return r !== item; });
      var target = rest.filter(function (r) {
        var rect = r.getBoundingClientRect();
        return e.clientY < rect.top + rect.height / 2;
      })[0];
      if (target) list.insertBefore(indicator, target);
      else list.insertBefore(indicator, null);
    });
    function drop() {
      if (!dragging) return;
      dragging = false;
      item.style.transform = '';
      item.classList.remove('is-dragging');
      list.classList.remove('is-dragging');
      list.insertBefore(item, indicator);
    }
    handle.addEventListener('pointerup', drop);
    handle.addEventListener('pointercancel', drop);

    handle.addEventListener('keydown', function (e) {
      if ((e.key !== 'ArrowUp' && e.key !== 'ArrowDown') || !e.altKey) return;
      e.preventDefault();
      list.classList.remove('is-demo');
      var o = order();
      var idx = o.indexOf(item);
      var targetIdx = e.key === 'ArrowUp' ? idx - 1 : idx + 1;
      if (targetIdx < 0 || targetIdx >= o.length) return;
      if (e.key === 'ArrowUp') list.insertBefore(item, o[targetIdx]);
      else list.insertBefore(item, o[targetIdx].nextSibling);
      handle.focus({ preventScroll: true });
    });
  });
})();
</script>
</body>
</html>
