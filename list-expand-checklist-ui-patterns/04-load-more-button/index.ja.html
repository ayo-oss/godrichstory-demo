<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Load-more button list — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="lm-list is-demo">
    <ul class="lm-rows">
      <li class="lm-row">お知らせ更新のご案内</li>
      <li class="lm-row">9月定期メンテナンス予定</li>
      <li class="lm-row lm-row--pending" data-n="1">新機能リリースノート</li>
      <li class="lm-row lm-row--pending" data-n="2">イベント当選者発表</li>
      <li class="lm-row lm-row--pending" data-n="3">利用規約改定</li>
    </ul>
    <button class="lm-btn" type="button">
      <svg class="lm-btn__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M240 56v48a8 8 0 0 1-8 8h-48a8 8 0 0 1 0-16h27.4l-26.59-24.36l-.25-.24a80 80 0 1 0-1.67 114.78a8 8 0 0 1 11 11.63A95.44 95.44 0 0 1 128 224h-1.32a96 96 0 1 1 69.07-164L224 85.8V56a8 8 0 1 1 16 0"/></g></svg>
      <span class="lm-btn__label">もっと見る</span>
    </button>
  </div>
</main>
<script>
(function () {
  var list = document.querySelector('.lm-list');
  var btn = list.querySelector('.lm-btn');
  btn.addEventListener('click', function () {
    if (list.classList.contains('has-loaded')) return;
    list.classList.remove('is-demo');
    list.classList.add('is-loading');
    setTimeout(function () {
      list.classList.remove('is-loading');
      list.classList.add('has-loaded');
      btn.querySelector('.lm-btn__label').textContent = 'これ以上ありません';
      btn.disabled = true;
    }, 500);
  });
})();
</script>
</body>
</html>
