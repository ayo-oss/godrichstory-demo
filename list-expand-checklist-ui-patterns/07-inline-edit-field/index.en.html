<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List inline edit — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ie-row is-demo">
    <label class="ie-row__label" for="ie-name">Name</label>
    <div class="ie-row__field">
      <input id="ie-name" class="ie-row__input" type="text" value="Kim Do-yoon" readonly>
      <button class="ie-row__toggle" type="button" aria-label="Edit name">
        <svg class="ie-row__icon ie-row__icon--pencil" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M221.66 90.34L192 120l-56-56l29.66-29.66a8 8 0 0 1 11.31 0L221.66 79a8 8 0 0 1 0 11.34" opacity=".2"/><path d="m227.31 73.37l-44.68-44.69a16 16 0 0 0-22.63 0L36.69 152A15.86 15.86 0 0 0 32 163.31V208a16 16 0 0 0 16 16h44.69a15.86 15.86 0 0 0 11.31-4.69L227.31 96a16 16 0 0 0 0-22.63M92.69 208H48v-44.69l88-88L180.69 120ZM192 108.68L147.31 64l24-24L216 84.68Z"/></g></svg>
        <svg class="ie-row__icon ie-row__icon--check" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg>
      </button>
    </div>
  </div>
</main>
<script>
(function () {
  var row = document.querySelector('.ie-row');
  var input = row.querySelector('.ie-row__input');
  var toggle = row.querySelector('.ie-row__toggle');
  var original = input.value;
  function edit() {
    row.classList.remove('is-demo');
    row.classList.add('is-editing');
    input.readOnly = false;
    input.focus({ preventScroll: true });
    input.select();
  }
  function save() {
    original = input.value;
    row.classList.remove('is-editing');
    row.classList.add('is-saved');
    input.readOnly = true;
    setTimeout(function () { row.classList.remove('is-saved'); }, 900);
  }
  function cancel() {
    input.value = original;
    row.classList.remove('is-editing');
    input.readOnly = true;
  }
  toggle.addEventListener('click', function () {
    row.classList.contains('is-editing') ? save() : edit();
  });
  input.addEventListener('click', function () { if (input.readOnly) edit(); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    else if (e.key === 'Escape') { cancel(); }
  });
  input.addEventListener('blur', function () { if (!input.readOnly) save(); });
})();
</script>
</body>
</html>
