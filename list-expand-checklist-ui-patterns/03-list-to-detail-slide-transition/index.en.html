<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List-to-detail slide transition — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ltd-viewport is-demo">
    <div class="ltd-track">
      <ul class="ltd-list" aria-label="Settings">
        <li>
          <button class="ltd-list__row" type="button">
            <span>Notification settings</span>
            <svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg>
          </button>
        </li>
        <li>
          <button class="ltd-list__row" type="button">
            <span>Privacy</span>
            <svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg>
          </button>
        </li>
      </ul>
      <div class="ltd-detail">
        <button class="ltd-detail__back" type="button">
          <svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M112 56v144l-72-72Z" opacity=".2"/><path d="M216 120h-96V56a8 8 0 0 0-13.66-5.66l-72 72a8 8 0 0 0 0 11.32l72 72A8 8 0 0 0 120 200v-64h96a8 8 0 0 0 0-16m-112 60.69L51.31 128L104 75.31Z"/></g></svg>
          Back
        </button>
        <h2>Notification settings</h2>
        <p>Turn push, email, and text alerts on or off per item.</p>
      </div>
    </div>
  </div>
</main>
<script>
(function () {
  var view = document.querySelector('.ltd-viewport');
  function open() { view.classList.remove('is-demo'); view.classList.add('is-open'); view.querySelector('.ltd-detail__back').focus({ preventScroll: true }); }
  function close() { view.classList.remove('is-demo'); view.classList.remove('is-open'); view.querySelector('.ltd-list__row').focus({ preventScroll: true }); }
  view.querySelectorAll('.ltd-list__row').forEach(function (row) {
    row.addEventListener('click', open);
  });
  view.querySelector('.ltd-detail__back').addEventListener('click', close);
  view.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && view.classList.contains('is-open')) close();
  });
})();
</script>
</body>
</html>
