<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Row inline expand — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="rowx-list" aria-label="注文履歴">
    <li class="rowx-item">
      <button class="rowx-item__head is-demo" type="button" aria-expanded="false">
        <svg class="rowx-item__caret" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg>
        <span class="rowx-item__title">注文 #10493</span>
        <span class="rowx-item__meta">32,000円</span>
      </button>
      <div class="rowx-item__body">
        <div class="rowx-item__body-inner">
          <p>配送先 ソウル江南区・決済 カカオペイ</p>
          <p>2026-09-08 到着予定</p>
        </div>
      </div>
    </li>
    <li class="rowx-item">
      <button class="rowx-item__head" type="button" aria-expanded="false">
        <svg class="rowx-item__caret" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg>
        <span class="rowx-item__title">注文 #10488</span>
        <span class="rowx-item__meta">18,500円</span>
      </button>
      <div class="rowx-item__body">
        <div class="rowx-item__body-inner">
          <p>配送先 京畿道城南市・決済 カード</p>
          <p>配送完了 2026-09-05</p>
        </div>
      </div>
    </li>
  </ul>
</main>
<script>
(function () {
  document.querySelectorAll('.rowx-item__head').forEach(function (btn) {
    var item = btn.closest('.rowx-item');
    btn.addEventListener('click', function () {
      btn.classList.remove('is-demo');
      var open = item.classList.toggle('is-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });
})();
</script>
</body>
</html>
