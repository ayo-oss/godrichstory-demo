        const y = clamp(stagePoint(ev).y - ROW_H / 2, 8, 8 + 4 * (ROW_H + GAP));
        gEl.style.top = f1(y) + 'px';
        const to = clamp(Math.round((y - 8) / (ROW_H + GAP)), 0, 4);
        const cur = order.indexOf(dragIdx);
        if (to !== cur) {
            order.splice(cur, 1);
            order.splice(to, 0, dragIdx);
            layoutRows();
        }
    });
    function release() {
        if (dragIdx < 0) {
            return;
        }
        const card = rows[dragIdx];
        card.style.opacity = '';
        if (gEl) {
            gEl.remove();
            gEl = null;
        }
        flipCommit(scWrap, function applyHand() {
            const sorted = rows.slice().sort(function (a, b) {
                return order.indexOf(Number(a.getAttribute('data-index'))) - order.indexOf(Number(b.getAttribute('data-index')));
            });
            for (const s of sorted) {
                scWrap.appendChild(s);
            }
            layoutRows();
        }, FLIP_PLAY_SCALE, performance.now(), FLIP_SETTLE_MS);
        dragIdx = -1;
    }
    scWrap.addEventListener('pointerup', release);
    // pointercancel — 손 입력이 취소돼도 놓기와 같은 정리 경로로 푼다 (미해제 함정)
    scWrap.addEventListener('pointercancel', release);
    return run({ count: 1, build: build, frame: frame });
}
})();
</script>
</body>
