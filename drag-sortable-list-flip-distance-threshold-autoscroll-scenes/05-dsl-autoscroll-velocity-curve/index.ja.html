            edgeA.style.opacity = inEdge ? '0.55' : '0.14';
        }
        raf5 = requestAnimationFrame(loop);
    }
    scWrap.addEventListener('pointerdown', function (ev) {
        if (!ev.target.closest || !ev.target.closest('.sview')) {
            return;
        }
        ev.preventDefault();
        held = true;
        lastMs = 0;
        ptrY = stagePoint(ev).y;
        cancelAnimationFrame(raf5);
        raf5 = requestAnimationFrame(loop);
    });
    scWrap.addEventListener('pointermove', function (ev) {
        if (!held) {
            return;
        }
        ptrY = clamp(stagePoint(ev).y, VIEW_Y, VIEW_Y + VIEW_H);
    });
    function stopScroll() {
        held = false;
        cancelAnimationFrame(raf5);
        lastV = 0;
    }
    scWrap.addEventListener('pointerup', stopScroll);
    // pointercancel — 스크롤 루프도 함께 끊는다 (미해제 함정: rAF 가 살아 있으면 계속 굴러간다)
    scWrap.addEventListener('pointercancel', stopScroll);
    return run({ count: 1, build: build, frame: frame });
}
})();
</script>
</body>
</html>
