<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popover API toast — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="demo">
    <button class="opener" type="button" popovertarget="ptoast048">알림 다시 보기</button>
    <div id="ptoast048" class="toast is-demo" popover role="status" aria-live="polite">
      <span class="toast__dot" aria-hidden="true"></span>
      <div class="toast__body">
        <p class="toast__title">연결됨</p>
        <p class="toast__text">네트워크가 복구되었습니다</p>
      </div>
      <button class="toast__close" type="button" popovertarget="ptoast048" popovertargetaction="hide" aria-label="알림 닫기">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</main>
<script>
// popover 속성이 top-layer 스택·ESC 닫기·바깥 클릭 닫기를 공짜로 준다. 데모용으로 로드 즉시 한 번 연다.
document.getElementById('ptoast048').showPopover();
</script>
</body>
</html>
