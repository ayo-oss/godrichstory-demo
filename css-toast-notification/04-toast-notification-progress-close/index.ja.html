<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress-bar auto-dismiss toast — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="toast is-demo" role="status" aria-live="polite">
    <div class="toast__body">
      <p class="toast__title">アップロード完了</p>
      <p class="toast__text">5秒後に自動的に閉じます</p>
    </div>
    <span class="toast__bar" aria-hidden="true"></span>
  </div>
</main>
</body>
