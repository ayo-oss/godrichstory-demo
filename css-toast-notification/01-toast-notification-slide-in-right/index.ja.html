<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide-in toast — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="toast is-demo" role="status" aria-live="polite">
    <span class="toast__bar" aria-hidden="true"></span>
    <div class="toast__body">
      <p class="toast__title">保存しました</p>
      <p class="toast__text">新しい項目を保存しました</p>
    </div>
    <button class="toast__close" type="button" aria-label="通知を閉じる">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</main>
</body>
</html>
