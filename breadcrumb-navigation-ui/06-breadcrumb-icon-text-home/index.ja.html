      </li>
    </ol>
    <button class="ic__toggle" type="button" id="ic-toggle" aria-pressed="false">アイコンのみ</button>
  </nav>
</main>
<script>
// 실동작: 토글 버튼으로 가운데 칸 글자 접기/펴기 · 칸을 누르면 그 칸이 현재 페이지가 된다
var root = document.querySelector('.ic');
var toggle = document.getElementById('ic-toggle');
var crumbs = [].slice.call(root.querySelectorAll('.ic__crumb'));
toggle.addEventListener('click', function () {
  root.classList.remove('is-demo');
  var on = root.classList.toggle('is-compact');
  toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
  toggle.textContent = on ? 'アイコンと文字' : 'アイコンのみ';
});
crumbs.forEach(function (c) {
  c.addEventListener('click', function (e) {
    e.preventDefault();
    root.classList.remove('is-demo');
    crumbs.forEach(function (o) {
      o.classList.remove('ic__crumb--now');
      o.removeAttribute('aria-current');
    });
    c.classList.add('ic__crumb--now');
    c.setAttribute('aria-current', 'page');
  });
});
</script>
</body>
</html>
