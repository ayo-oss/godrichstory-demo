<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breadcrumb collapsed middle steps — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cm is-demo">
    <nav aria-label="パンくずリスト">
      <ol class="cm__list">
        <li><a href="#">ホーム</a></li>
        <li class="cm__slot" id="cm-slot">
          <button class="cm__dots" id="cm-btn" type="button" aria-expanded="false" aria-controls="cm-menu" aria-label="隠れた階層を表示">
            <svg viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="M240 96v64a16 16 0 0 1-16 16H32a16 16 0 0 1-16-16V96a16 16 0 0 1 16-16h192a16 16 0 0 1 16 16" opacity=".2"/><path d="M140 128a12 12 0 1 1-12-12a12 12 0 0 1 12 12m56-12a12 12 0 1 0 12 12a12 12 0 0 0-12-12m-136 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg>
          </button>
          <ul class="cm__menu" id="cm-menu">
            <li><a href="#"><svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M128 80H32V56a8 8 0 0 1 8-8h52.69a8 8 0 0 1 5.65 2.34Z" opacity=".2"/><path d="M216 72h-84.69L104 44.69A15.86 15.86 0 0 0 92.69 40H40a16 16 0 0 0-16 16v144.62A15.4 15.4 0 0 0 39.38 216h177.51A15.13 15.13 0 0 0 232 200.89V88a16 16 0 0 0-16-16M92.69 56l16 16H40V56ZM216 200H40V88h176Z"/></g></svg>電子機器</a></li>
            <li><a href="#"><svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M128 80H32V56a8 8 0 0 1 8-8h52.69a8 8 0 0 1 5.65 2.34Z" opacity=".2"/><path d="M216 72h-84.69L104 44.69A15.86 15.86 0 0 0 92.69 40H40a16 16 0 0 0-16 16v144.62A15.4 15.4 0 0 0 39.38 216h177.51A15.13 15.13 0 0 0 232 200.89V88a16 16 0 0 0-16-16M92.69 56l16 16H40V56ZM216 200H40V88h176Z"/></g></svg>コンピューター</a></li>
          </ul>
        </li>
        <li><a href="#">ノートPC</a></li>
        <li><span class="cm__cur" aria-current="page">13インチ ゲーミング</span></li>
      </ol>
    </nav>
  </div>
</main>
<script>
// 실동작: 클릭 토글 · Escape 로 닫기 · ArrowDown/ArrowUp 으로 항목 이동 · 목록 밖 클릭으로 닫기
var root = document.querySelector('.cm');
var slot = document.getElementById('cm-slot');
var btn = document.getElementById('cm-btn');
var links = [].slice.call(document.querySelectorAll('#cm-menu a'));
function isOpen() { return btn.getAttribute('aria-expanded') === 'true'; }
function setOpen(on, restoreFocus) {
  root.classList.remove('is-demo');
  slot.classList.toggle('is-open', on);
  btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  if (on) links[0].focus({ preventScroll: true });
  else if (restoreFocus) btn.focus({ preventScroll: true });
}
btn.addEventListener('click', function (e) { e.stopPropagation(); setOpen(!isOpen(), true); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && isOpen()) { e.preventDefault(); setOpen(false, true); return; }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  var i = links.indexOf(document.activeElement);
  if (i < 0 && document.activeElement !== btn) return;
  e.preventDefault();
  if (!isOpen()) { setOpen(true, false); return; }
  var step = e.key === 'ArrowDown' ? 1 : links.length - 1;
  links[(i + step + links.length) % links.length].focus({ preventScroll: true });
});
document.addEventListener('click', function (e) {
  if (isOpen() && !slot.contains(e.target)) setOpen(false, false);
});
</script>
</body>
</html>
