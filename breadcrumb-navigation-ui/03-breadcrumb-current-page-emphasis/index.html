<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breadcrumb current page emphasis — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ce is-demo">
    <nav aria-label="현재 위치">
      <ol class="ce__list">
        <li><a class="ce__crumb" href="#">홈</a></li>
        <li><a class="ce__crumb" href="#">전자기기</a></li>
        <li><a class="ce__crumb" href="#">노트북</a></li>
        <li><span class="ce__crumb ce__cur" aria-current="page">13인치 게이밍</span></li>
      </ol>
    </nav>
    <p class="ce__say" aria-live="polite">
      <svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0M232 128A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></svg><span class="ce__lab">현재 페이지</span> · <span class="ce__val">13인치 게이밍</span>
    </p>
  </div>
</main>
<script>
// 실동작: 앞쪽 칸을 누르면 그 칸이 현재 페이지가 된다 — aria-current 를 옮기고 뒤 칸을 숨긴다.
// 현재 칸을 한 번 더 누르면 전체 경로로 되돌린다. 링크라 Enter 로도 같은 동작.
var root = document.querySelector('.ce');
var lis = [].slice.call(document.querySelectorAll('.ce__list > li'));
var crumbs = lis.map(function (li) { return li.querySelector('.ce__crumb'); });
var val = document.querySelector('.ce__val');
var currentIndex = crumbs.length - 1;
function setCurrent(i) {
  root.classList.remove('is-demo');
  currentIndex = i;
  lis.forEach(function (li, n) {
    li.hidden = n > i;
    var c = crumbs[n];
    c.classList.toggle('ce__cur', n === i);
    if (n === i) c.setAttribute('aria-current', 'page');
    else c.removeAttribute('aria-current');
  });
  val.textContent = crumbs[i].textContent;
}
crumbs.forEach(function (c, i) {
  if (c.tagName !== 'A') return;
  c.addEventListener('click', function (e) {
    e.preventDefault();
    setCurrent(currentIndex === i ? crumbs.length - 1 : i);
  });
});
</script>
</body>
</html>
