<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breadcrumb separator variants — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sv is-demo">
    <nav class="sv__stack" aria-label="Breadcrumb">
      <ol class="sv__list sv__list--slash is-on">
        <li><a href="#">Home</a></li>
        <li><a href="#">Electronics</a></li>
        <li><a href="#">Laptops</a></li>
        <li><span class="sv__cur" aria-current="page">13-inch gaming</span></li>
      </ol>
      <ol class="sv__list sv__list--caret" aria-hidden="true">
        <li><a href="#" tabindex="-1">Home</a><span class="sv__sep" aria-hidden="true"><svg viewBox="0 0 256 256" width="12" height="12" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></span></li>
        <li><a href="#" tabindex="-1">Electronics</a><span class="sv__sep" aria-hidden="true"><svg viewBox="0 0 256 256" width="12" height="12" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></span></li>
        <li><a href="#" tabindex="-1">Laptops</a><span class="sv__sep" aria-hidden="true"><svg viewBox="0 0 256 256" width="12" height="12" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></span></li>
        <li><span class="sv__cur">13-inch gaming</span></li>
      </ol>
      <ol class="sv__list sv__list--dot" aria-hidden="true">
        <li><a href="#" tabindex="-1">Home</a></li>
        <li><a href="#" tabindex="-1">Electronics</a></li>
        <li><a href="#" tabindex="-1">Laptops</a></li>
        <li><span class="sv__cur">13-inch gaming</span></li>
      </ol>
    </nav>
    <div class="sv__tabs" role="group" aria-label="Separator style">
      <span class="sv__ind" id="sv-ind" aria-hidden="true"></span>
      <button class="sv__pill sv__pill--slash" type="button" aria-pressed="true">Slash</button>
      <button class="sv__pill sv__pill--caret" type="button" aria-pressed="false">Chevron</button>
      <button class="sv__pill sv__pill--dot" type="button" aria-pressed="false">Middle dot</button>
    </div>
  </div>
</main>
<script>
// 실동작: 알약을 누르면 .is-demo 를 떼고 그 구분자로 고정한다. 좌우 화살표로도 옮긴다.
var root = document.querySelector('.sv');
var ind = document.getElementById('sv-ind');
var pills = [].slice.call(document.querySelectorAll('.sv__pill'));
var lists = [].slice.call(document.querySelectorAll('.sv__list'));
function pick(i) {
  root.classList.remove('is-demo');
  ind.style.setProperty('--i', i);
  pills.forEach(function (p, n) { p.setAttribute('aria-pressed', n === i ? 'true' : 'false'); });
  lists.forEach(function (l, n) {
    var on = n === i;
    l.classList.toggle('is-on', on);
    l.setAttribute('aria-hidden', on ? 'false' : 'true');
    [].forEach.call(l.querySelectorAll('a'), function (a) { a.tabIndex = on ? 0 : -1; });
  });
}
pills.forEach(function (p, i) {
  p.addEventListener('click', function () { pick(i); });
  p.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault();
    var n = (i + (e.key === 'ArrowRight' ? 1 : pills.length - 1)) % pills.length;
    pills[n].focus({ preventScroll: true });
    pick(n);
  });
});
</script>
</body>
</html>
