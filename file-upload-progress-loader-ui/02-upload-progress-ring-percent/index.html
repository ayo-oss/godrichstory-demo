<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원형 퍼센트 링 — 파일 업로드 진행률 로더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rp is-demo" id="rpRoot" role="group" tabindex="0" aria-label="파일 업로드 진행률 링">
  <div class="rp__ringwrap">
    <svg class="rp__svg" viewBox="0 0 120 120" width="92" height="92" aria-hidden="true">
      <circle class="rp__track" cx="60" cy="60" r="52"></circle>
      <circle class="rp__prog" id="rpProg" cx="60" cy="60" r="52"></circle>
    </svg>
    <span class="rp__pct" id="rpPct" aria-hidden="true"><b class="rp__n"></b><i>%</i></span>
  </div>
  <div class="rp__bar">
    <span class="rp__label">업로드 중</span>
    <span class="rp__meta">stroke-dashoffset · getBoundingClientRect</span>
  </div>
</div>
</main>
<script>
// 원형 퍼센트 링 — 반지름을 실측(getBoundingClientRect)해 둘레(2πr)를 구하고
// stroke-dasharray 에 그 값을 그대로 넣는다. 진행률은 stroke-dashoffset 을
// 둘레에서 되감는 비율로 계산하므로 숫자 라벨과 링은 항상 같은 값을 가리킨다.
// 실제 전송 속도는 매 틱 일정하지 않다 — 시드 난수로 목표치를 흔들고
// 화면 값은 목표를 향해 관성으로 lerp 되어 뚝뚝 끊기지 않는다.
(function () {
  var SEED = 0x9e77a1;
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(SEED);

  var root = document.getElementById('rpRoot');
  var prog = document.getElementById('rpProg');
  var pct  = document.getElementById('rpPct');
  if (!root || !prog || !pct) return;

  var r = prog.r.baseVal.value;
  var box = prog.getBoundingClientRect();
  var measuredR = box.width > 0 ? box.width / 2 : r;
  var circ = 2 * Math.PI * measuredR;
  prog.style.setProperty('--circ', String(circ));

  var target = 0, shown = 0, raf = null;
  function paint() {
    shown += (target - shown) * 0.18;
    if (Math.abs(target - shown) < 0.05) shown = target;
    prog.style.setProperty('--p', shown.toFixed(2));
    pct.style.setProperty('--n', Math.round(shown));
    if (shown < 100) raf = requestAnimationFrame(paint);
  }
  function tick() {
    if (root.classList.contains('is-demo')) return;
    target = Math.min(100, target + 3 + rand() * 9);
    if (target >= 100) clearInterval(timer);
  }
  var timer = null;
  function live() {
    if (!root.classList.contains('is-demo')) return;
    root.classList.remove('is-demo');
    timer = setInterval(tick, 220);
    raf = requestAnimationFrame(paint);
  }
  ['pointerdown', 'focusin'].forEach(function (ev) { root.addEventListener(ev, live); });
})();
</script>
</body>
</html>
