<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>붙여넣기 캡처 — 파일 업로드 진행률 로더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pc is-demo" id="pcRoot" role="group" tabindex="0" aria-label="붙여넣기로 이미지 업로드, 클릭 후 Ctrl+V">
  <div class="pc__idle" id="pcIdle">
    <svg viewBox="0 0 256 256" width="26" height="26" aria-hidden="true"><g fill="currentColor"><path d="M216 44h-40.6a36 36 0 0 0-64.8 0H80a12 12 0 0 0-12 12v20a4 4 0 0 0 4 4h112a4 4 0 0 0 4-4V56a12 12 0 0 0-12-12" opacity=".2"/><path d="M216 36h-33.5a44 44 0 0 0-77 0H72a20 20 0 0 0-20 20v168a20 20 0 0 0 20 20h144a20 20 0 0 0 20-20V56a20 20 0 0 0-20-20m-88-8a28 28 0 0 1 26.6 20H101.4A28 28 0 0 1 128 28m88 196H72V56h16v16a12 12 0 0 0 12 12h56a12 12 0 0 0 12-12V56h16Z"/></g></svg>
    <span class="pc__idle-label">클릭 후 <b>Ctrl+V</b></span>
  </div>
  <svg class="pc__spin" id="pcSpin" viewBox="0 0 120 120" width="52" height="52" aria-hidden="true">
    <circle class="pc__spin-track" cx="60" cy="60" r="48"></circle>
    <circle class="pc__spin-arc" cx="60" cy="60" r="48"></circle>
  </svg>
  <div class="pc__thumb" id="pcThumb">
    <img class="pc__img" id="pcImg" alt="">
    <span class="pc__done-label">이미지 캡처됨</span>
  </div>
</div>
</main>
<script>
// 붙여넣기 캡처 — 드래그 없이 Ctrl+V 만으로 클립보드의 이미지를 받는다.
// e.clipboardData(DataTransfer 인스턴스)의 items 에서 image/* 항목을 찾아 파일로 꺼낸 뒤
// 인디터미네이트 링을 잠깐 돌리고 썸네일로 스왑한다(진행률이 없는 즉시 캡처라 % 표시가 없다).
(function () {
  var root  = document.getElementById('pcRoot');
  var idle  = document.getElementById('pcIdle');
  var spin  = document.getElementById('pcSpin');
  var thumb = document.getElementById('pcThumb');
  var img   = document.getElementById('pcImg');
  if (!root || !idle || !spin || !thumb || !img) return;

  var objectUrl = null;

  function process(file) {
    root.classList.remove('is-idle');
    root.classList.add('is-spin');
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(file);
    setTimeout(function () {
      img.src = objectUrl;
      root.classList.remove('is-spin');
      root.classList.add('is-done');
    }, 620);
  }

  root.addEventListener('paste', function (e) {
    if (!e.clipboardData) return;
    var data = e.clipboardData;
    if (!(data instanceof DataTransfer)) return;
    var items = data.items;
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0) {
        var file = items[i].getAsFile();
        if (file) { process(file); break; }
      }
    }
  });

  ['pointerdown', 'focusin'].forEach(function (ev) {
    root.addEventListener(ev, function () {
      if (!root.classList.contains('is-demo')) return;
      root.classList.remove('is-demo');
      root.classList.add('is-idle');
    });
  });
})();
</script>
</body>
</html>
