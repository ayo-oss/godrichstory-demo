<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>썸네일 팝인 — 파일 업로드 진행률 로더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tp is-demo" id="tpRoot" role="group" tabindex="0" aria-label="Image thumbnail upload">
  <label class="tp__drop" for="tpInput">
    <span class="tp__thumb" id="tpThumb" aria-hidden="true">
      <svg viewBox="0 0 256 256" width="22" height="22"><g fill="currentColor"><path d="M216 40H40a16 16 0 0 0-16 16v144a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16m-72 88l-24-24-40 40h136Z" opacity=".2"/><path d="M216 40H40a16 16 0 0 0-16 16v144a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16m0 16v102.75l-26.07-26.06a16 16 0 0 0-22.63 0l-20 20-44-44a16 16 0 0 0-22.63 0L40 149.37V56ZM40 172l52-52 76 76H40Zm176 28h-4.69l-40-40 20-20L216 164.69V200Z"/></g></svg>
    </span>
    <input class="tp__input" id="tpInput" type="file" accept="image/*">
    <span class="tp__hint">Click to choose an image</span>
  </label>
  <div class="tp__track">
    <span class="tp__fill" id="tpFill"></span>
  </div>
  <div class="tp__bar">
    <span class="tp__meta">FileReader · createObjectURL</span>
  </div>
</div>
</main>
<script>
// 썸네일 팝인 — FileReader 가 dataURL 을 다 읽는 순간(onload)을 신호로 삼아
// 썸네일이 0에서 오버슈트로 커지고, 그 아래 진행 바는 그제서야 채워지기 시작한다.
(function () {
  var root  = document.getElementById('tpRoot');
  var input = document.getElementById('tpInput');
  var thumb = document.getElementById('tpThumb');
  var fill  = document.getElementById('tpFill');
  if (!root || !input || !thumb || !fill) return;

  function fillTo(pct, dur) {
    var t0 = performance.now();
    function step(now) {
      var k = Math.min(1, (now - t0) / dur);
      fill.style.transform = 'scaleX(' + (pct * k / 100) + ')';
      if (k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  input.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    root.classList.remove('is-demo');
    var reader = new FileReader();
    reader.onload = function () {
      thumb.style.backgroundImage = 'url(' + reader.result + ')';
      thumb.classList.add('is-pop');
      fillTo(100, 900);
    };
    reader.readAsDataURL(file);
    // 더 빠른 미리보기가 필요하면 createObjectURL 로도 즉시 참조를 만들 수 있다(여기선 즉시 해제).
    var objUrl = URL.createObjectURL(file);
    URL.revokeObjectURL(objUrl);
  });
})();
</script>
</body>
</html>
