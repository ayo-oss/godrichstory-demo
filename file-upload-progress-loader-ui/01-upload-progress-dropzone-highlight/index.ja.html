<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드롭존 하이라이트 — 파일 업로드 진행률 로더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dz is-demo" id="dzRoot">
  <div class="dz__zone" id="dzZone" role="button" tabindex="0" aria-label="ファイルをここにドラッグ">
    <span class="dz__ring" aria-hidden="true"></span>
    <span class="dz__icon" aria-hidden="true">
      <svg viewBox="0 0 256 256" width="26" height="26"><g fill="currentColor"><path d="M240 128a80 80 0 0 1-80 80H72A56 56 0 1 1 85.92 97.74v.1A80 80 0 0 1 240 128" opacity=".2"/><path d="M178.34 165.66L160 147.31V208a8 8 0 0 1-16 0v-60.69l-18.34 18.35a8 8 0 0 1-11.32-11.32l32-32a8 8 0 0 1 11.32 0l32 32a8 8 0 0 1-11.32 11.32M160 40a88.08 88.08 0 0 0-78.71 48.68A64 64 0 1 0 72 216h40a8 8 0 0 0 0-16H72a48 48 0 0 1 0-96c1.1 0 2.2 0 3.29.12A88 88 0 0 0 72 128a8 8 0 0 0 16 0a72 72 0 1 1 100.8 66a8 8 0 0 0 3.2 15.34a7.9 7.9 0 0 0 3.2-.68A88 88 0 0 0 160 40"/></g></svg>
    </span>
    <span class="dz__label">ファイルをここにドラッグ</span>
    <span class="dz__badge" id="dzBadge" aria-hidden="true">重なり <b class="dz__n"></b></span>
  </div>
  <div class="dz__bar">
    <span class="dz__meta">dragenter · dragleave · dataTransfer</span>
  </div>
</div>
</main>
<script>
// 드롭존 하이라이트 — 자식 요소를 넘나드는 dragenter·dragleave 쌍은 한 번의 진입에 여러 번 발생한다.
// 카운터 depth 를 두어 depth 가 0보다 클 때만 하이라이트하면 자식 경계를 넘어도 테두리가 깜빡이지 않는다.
(function () {
  var root = document.getElementById('dzRoot');
  var zone = document.getElementById('dzZone');
  var badge = document.getElementById('dzBadge');
  if (!root || !zone || !badge) return;
  var depth = 0;

  function paint() {
    zone.classList.toggle('is-over', depth > 0);
    badge.style.setProperty('--n', depth);
  }
  function enter(e) { e.preventDefault(); depth += 1; paint(); }
  function leave(e) { e.preventDefault(); depth = Math.max(0, depth - 1); paint(); }
  function over(e) { e.preventDefault(); }
  function drop(e) {
    e.preventDefault();
    var fileCount = (e.dataTransfer && e.dataTransfer.files) ? e.dataTransfer.files.length : 0;
    depth = 0; paint();
    zone.setAttribute('data-drop-count', String(fileCount));
    zone.classList.add('is-dropped');
    setTimeout(function () { zone.classList.remove('is-dropped'); }, 640);
  }
  function live() { root.classList.remove('is-demo'); }
  zone.addEventListener('dragenter', enter);
  zone.addEventListener('dragleave', leave);
  zone.addEventListener('dragover', over);
  zone.addEventListener('drop', drop);
  ['pointerdown', 'focusin'].forEach(function (ev) { zone.addEventListener(ev, live); });
})();
</script>
</body>
</html>
