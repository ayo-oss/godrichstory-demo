<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다중 파일 스태거 — 파일 업로드 진행률 로더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ms is-demo" id="msRoot" role="list" aria-label="ファイル別アップロード進行リスト" tabindex="0">
  <p class="ms__title">4個のファイルをアップロード中</p>
  <ul class="ms__list" id="msList">
    <li class="ms__row" role="listitem"><span class="ms__name">cover.jpg</span><span class="ms__track"><span class="ms__fill" data-target="100"></span></span></li>
    <li class="ms__row" role="listitem"><span class="ms__name">notes.pdf</span><span class="ms__track"><span class="ms__fill" data-target="72"></span></span></li>
    <li class="ms__row" role="listitem"><span class="ms__name">sheet.csv</span><span class="ms__track"><span class="ms__fill" data-target="45"></span></span></li>
    <li class="ms__row" role="listitem"><span class="ms__name">demo.mp4</span><span class="ms__track"><span class="ms__fill" data-target="18"></span></span></li>
  </ul>
  <div class="ms__bar">
    <span class="ms__meta">Array.prototype.map · animation-delay</span>
  </div>
</div>
</main>
<script>
// 다중 파일 스태거 — 파일마다 개별 XHR 을 병렬로 열되(여기선 시드 난수로 흉내낸다),
// 목록 행은 Array.prototype.map 으로 한 번에 만들고 등록 순서의 인덱스(--i)만큼
// animation-delay 를 곱해 나타나므로, 다섯 개를 한꺼번에 끌어다 놔도 한 줄씩 정돈되어 쌓인다.
(function () {
  var STAGGER_MS = 80;
  var SEED = 0x7c31af;
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(SEED);

  var root = document.getElementById('msRoot');
  var list = document.getElementById('msList');
  if (!root || !list) return;

  var rows = Array.prototype.map.call(list.querySelectorAll('.ms__row'), function (row, i) {
    row.style.animationDelay = (i * STAGGER_MS) + 'ms';
    return { row: row, fill: row.querySelector('.ms__fill'), value: 0 };
  });

  function step() {
    if (root.classList.contains('is-demo')) return;
    var done = true;
    rows.forEach(function (r) {
      var target = Number(r.fill.getAttribute('data-target'));
      if (r.value < target) {
        r.value = Math.min(target, r.value + 2 + rand() * 6);
        r.fill.style.transform = 'scaleX(' + (r.value / 100) + ')';
        done = false;
      }
    });
    if (!done) requestAnimationFrame(step);
  }
  function live() {
    if (!root.classList.contains('is-demo')) return;
    root.classList.remove('is-demo');
    rows.forEach(function (r) { r.fill.style.transform = 'scaleX(0)'; r.value = 0; });
    requestAnimationFrame(step);
  }
  ['pointerdown', 'focusin'].forEach(function (ev) { root.addEventListener(ev, live); });
})();
</script>
</body>
</html>
