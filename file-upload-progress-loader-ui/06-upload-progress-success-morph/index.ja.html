<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>완료 모프 — 파일 업로드 진행률 로더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sm is-demo" id="smRoot" role="group" tabindex="0" aria-label="ファイルアップロード完了表示">
  <svg class="sm__svg" viewBox="0 0 120 120" width="72" height="72" aria-hidden="true">
    <circle class="sm__track" cx="60" cy="60" r="50"></circle>
    <circle class="sm__ring" id="smRing" cx="60" cy="60" r="50"></circle>
    <path class="sm__check" id="smCheck" d="M40 62 L54 76 L82 46"></path>
  </svg>
  <div class="sm__bar">
    <span class="sm__label">アップロード完了</span>
    <span class="sm__meta">stroke-dasharray · path · transition</span>
  </div>
</div>
</main>
<script>
// 완료 모프 — 100% 가 되는 프레임에 링을 즉시 숨기고 체크 path 를 즉시 보이게 스왑한 뒤
// 체크의 stroke-dashoffset 을 transition 으로 0 까지 되감아(draw-in) 원이 체크로 이어져
// 그려진 것처럼 보이게 만든다. d 속성 자체는 절대 보간되지 않으므로 스왑은 항상 순간적이다.
(function () {
  var SEED = 0x9917cf;
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(SEED);

  var root  = document.getElementById('smRoot');
  var ring  = document.getElementById('smRing');
  var check = document.getElementById('smCheck');
  if (!root || !ring || !check) return;

  var ringBox = ring.getBoundingClientRect();
  var ringR = ringBox.width > 0 ? ringBox.width / 2 : ring.r.baseVal.value;
  var circ = 2 * Math.PI * ringR;
  ring.style.setProperty('--circ', String(circ));
  var checkLen = check.getTotalLength();
  check.style.setProperty('--checklen', String(checkLen));

  var target = 0, shown = 0, raf = null, timer = null;
  function paint() {
    shown += (target - shown) * 0.2;
    if (Math.abs(target - shown) < 0.1) shown = target;
    ring.style.setProperty('--p', shown.toFixed(2));
    if (shown >= 100) {
      root.classList.add('is-done');
      raf = null;
      return;
    }
    raf = requestAnimationFrame(paint);
  }
  function tick() {
    if (root.classList.contains('is-demo')) return;
    target = Math.min(100, target + 6 + rand() * 10);
    if (target >= 100) clearInterval(timer);
  }
  function live() {
    if (!root.classList.contains('is-demo')) return;
    root.classList.remove('is-demo');
    timer = setInterval(tick, 220);
    raf = requestAnimationFrame(paint);
  }
  ['pointerdown', 'focusin'].forEach(function (ev) { root.addEventListener(ev, live); });
})();
</script>
</body>
</html>
