<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scallop-edge footer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <footer class="footercandy">
    <span class="footercandy__scallop" aria-hidden="true"></span>
    <div class="footercandy__cols">
      <div class="footercandy__col footercandy__col--lav">
        <p class="footercandy__head">제품</p>
        <p class="footercandy__link">기능</p>
        <p class="footercandy__link">요금제</p>
      </div>
      <div class="footercandy__col footercandy__col--bub">
        <p class="footercandy__head">회사</p>
        <p class="footercandy__link">소개</p>
        <p class="footercandy__link">문의</p>
      </div>
      <div class="footercandy__col footercandy__col--min">
        <p class="footercandy__head">도움말</p>
        <p class="footercandy__link">자주 묻는 질문</p>
        <p class="footercandy__link">가이드</p>
      </div>
    </div>
    <p class="footercandy__copy"><span class="footercandy__spark" aria-hidden="true">✦</span> 푸딩 · 달콤한 하루 <span class="footercandy__spark footercandy__spark--b" aria-hidden="true">✦</span></p>
  </footer>
</main>
</body>
</html>
