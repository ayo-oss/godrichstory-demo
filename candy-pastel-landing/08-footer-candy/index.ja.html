<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scallop-edge footer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <footer class="footercandy">
    <span class="footercandy__scallop" aria-hidden="true"></span>
    <div class="footercandy__cols">
      <div class="footercandy__col footercandy__col--lav">
        <p class="footercandy__head">プロダクト</p>
        <p class="footercandy__link">機能</p>
        <p class="footercandy__link">料金プラン</p>
      </div>
      <div class="footercandy__col footercandy__col--bub">
        <p class="footercandy__head">会社</p>
        <p class="footercandy__link">紹介</p>
        <p class="footercandy__link">お問い合わせ</p>
      </div>
      <div class="footercandy__col footercandy__col--min">
        <p class="footercandy__head">ヘルプ</p>
        <p class="footercandy__link">よくある質問</p>
        <p class="footercandy__link">ガイド</p>
      </div>
    </div>
    <p class="footercandy__copy"><span class="footercandy__spark" aria-hidden="true">✦</span> プリン・甘い一日 <span class="footercandy__spark footercandy__spark--b" aria-hidden="true">✦</span></p>
  </footer>
</main>
</body>
</html>
