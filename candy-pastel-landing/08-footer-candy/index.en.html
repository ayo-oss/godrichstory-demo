<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scallop-edge footer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <footer class="footercandy">
    <span class="footercandy__scallop" aria-hidden="true"></span>
    <div class="footercandy__cols">
      <div class="footercandy__col footercandy__col--lav">
        <p class="footercandy__head">Product</p>
        <p class="footercandy__link">Features</p>
        <p class="footercandy__link">Pricing</p>
      </div>
      <div class="footercandy__col footercandy__col--bub">
        <p class="footercandy__head">Company</p>
        <p class="footercandy__link">About</p>
        <p class="footercandy__link">Contact</p>
      </div>
      <div class="footercandy__col footercandy__col--min">
        <p class="footercandy__head">Help</p>
        <p class="footercandy__link">FAQ</p>
        <p class="footercandy__link">Guides</p>
      </div>
    </div>
    <p class="footercandy__copy"><span class="footercandy__spark" aria-hidden="true">✦</span> Pudding · Sweet day <span class="footercandy__spark footercandy__spark--b" aria-hidden="true">✦</span></p>
  </footer>
</main>
</body>
</html>
