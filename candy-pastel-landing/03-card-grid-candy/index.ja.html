<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker-badge card grid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="gridcandy">
    <div class="gridcandy__card gridcandy__card--lav">
      <span class="gridcandy__badge">NEW</span>
      <span class="gridcandy__dot" aria-hidden="true"></span>
      <p class="gridcandy__name">かわいいテンプレート</p>
    </div>
    <div class="gridcandy__card gridcandy__card--lem">
      <span class="gridcandy__badge">無料</span>
      <span class="gridcandy__dot" aria-hidden="true"></span>
      <p class="gridcandy__name">ふにふにフォーム</p>
    </div>
    <div class="gridcandy__card gridcandy__card--pea">
      <span class="gridcandy__badge">人気</span>
      <span class="gridcandy__dot" aria-hidden="true"></span>
      <p class="gridcandy__name">さわやか通知</p>
    </div>
    <div class="gridcandy__card gridcandy__card--min">
      <span class="gridcandy__badge">新着</span>
      <span class="gridcandy__dot" aria-hidden="true"></span>
      <p class="gridcandy__name">甘い記録</p>
    </div>
  </div>
</main>
</body>
</html>
