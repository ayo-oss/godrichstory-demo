<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticker-badge card grid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="gridcandy">
    <div class="gridcandy__card gridcandy__card--lav">
      <span class="gridcandy__badge">NEW</span>
      <span class="gridcandy__dot" aria-hidden="true"></span>
      <p class="gridcandy__name">귀여운 템플릿</p>
    </div>
    <div class="gridcandy__card gridcandy__card--lem">
      <span class="gridcandy__badge">무료</span>
      <span class="gridcandy__dot" aria-hidden="true"></span>
      <p class="gridcandy__name">말랑한 폼</p>
    </div>
    <div class="gridcandy__card gridcandy__card--pea">
      <span class="gridcandy__badge">인기</span>
      <span class="gridcandy__dot" aria-hidden="true"></span>
      <p class="gridcandy__name">상큼한 알림</p>
    </div>
    <div class="gridcandy__card gridcandy__card--min">
      <span class="gridcandy__badge">신규</span>
      <span class="gridcandy__dot" aria-hidden="true"></span>
      <p class="gridcandy__name">달콤한 기록</p>
    </div>
  </div>
</main>
</body>
</html>
