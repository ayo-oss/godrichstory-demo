<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macaron pricing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pricecandy">
    <div class="pricecandy__plan pricecandy__plan--mint">
      <p class="pricecandy__name">Sprout</p>
      <p class="pricecandy__price">Free</p>
      <p class="pricecandy__per">Forever</p>
    </div>
    <div class="pricecandy__plan pricecandy__plan--pick">
      <span class="pricecandy__badge">Popular</span>
      <div class="pricecandy__inner">
        <p class="pricecandy__name">Bubble</p>
        <p class="pricecandy__price">₩19,000 / mo</p>
        <p class="pricecandy__per">First month free</p>
      </div>
    </div>
    <div class="pricecandy__plan pricecandy__plan--lemon">
      <p class="pricecandy__name">Lemon</p>
      <p class="pricecandy__price">₩9,000 / mo</p>
      <p class="pricecandy__per">Billed yearly</p>
    </div>
  </div>
</main>
</body>
</html>
