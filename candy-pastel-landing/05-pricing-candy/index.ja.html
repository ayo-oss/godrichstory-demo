<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macaron pricing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pricecandy">
    <div class="pricecandy__plan pricecandy__plan--mint">
      <p class="pricecandy__name">スプラウト</p>
      <p class="pricecandy__price">無料</p>
      <p class="pricecandy__per">ずっと無料</p>
    </div>
    <div class="pricecandy__plan pricecandy__plan--pick">
      <span class="pricecandy__badge">人気</span>
      <div class="pricecandy__inner">
        <p class="pricecandy__name">バブル</p>
        <p class="pricecandy__price">月19,000ウォン</p>
        <p class="pricecandy__per">初月無料</p>
      </div>
    </div>
    <div class="pricecandy__plan pricecandy__plan--lemon">
      <p class="pricecandy__name">レモン</p>
      <p class="pricecandy__price">月9,000ウォン</p>
      <p class="pricecandy__per">年間払い</p>
    </div>
  </div>
</main>
</body>
</html>
