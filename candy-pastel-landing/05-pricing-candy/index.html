<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macaron pricing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pricecandy">
    <div class="pricecandy__plan pricecandy__plan--mint">
      <p class="pricecandy__name">새싹</p>
      <p class="pricecandy__price">무료</p>
      <p class="pricecandy__per">영원히</p>
    </div>
    <div class="pricecandy__plan pricecandy__plan--pick">
      <span class="pricecandy__badge">인기</span>
      <div class="pricecandy__inner">
        <p class="pricecandy__name">버블</p>
        <p class="pricecandy__price">월 19,000원</p>
        <p class="pricecandy__per">첫 달 무료</p>
      </div>
    </div>
    <div class="pricecandy__plan pricecandy__plan--lemon">
      <p class="pricecandy__name">레몬</p>
      <p class="pricecandy__price">월 9,000원</p>
      <p class="pricecandy__per">연간 결제</p>
    </div>
  </div>
</main>
</body>
</html>
