<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">

<title>Candy icon list</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="listcandy">
    <li class="listcandy__row">
      <span class="listcandy__candy listcandy__candy--a" aria-hidden="true"></span>
      <span class="listcandy__label">ドラッグ＆ドロップ</span>
    </li>
    <li class="listcandy__row">
      <span class="listcandy__candy listcandy__candy--b" aria-hidden="true"></span>
      <span class="listcandy__label">テンプレートを選ぶ</span>
    </li>
    <li class="listcandy__row">
      <span class="listcandy__candy listcandy__candy--c" aria-hidden="true"></span>
      <span class="listcandy__label">色を変える</span>
    </li>
    <li class="listcandy__row">
      <span class="listcandy__candy listcandy__candy--d" aria-hidden="true"></span>
      <span class="listcandy__label">共有する</span>
    </li>
  </ul>
</main>

</html>
