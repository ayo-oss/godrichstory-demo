<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candy icon list</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ul class="listcandy">
    <li class="listcandy__row">
      <span class="listcandy__candy listcandy__candy--a" aria-hidden="true"></span>
      <span class="listcandy__label">끌어다 놓기</span>
    </li>
    <li class="listcandy__row">
      <span class="listcandy__candy listcandy__candy--b" aria-hidden="true"></span>
      <span class="listcandy__label">템플릿 고르기</span>
    </li>
    <li class="listcandy__row">
      <span class="listcandy__candy listcandy__candy--c" aria-hidden="true"></span>
      <span class="listcandy__label">색 바꾸기</span>
    </li>
    <li class="listcandy__row">
      <span class="listcandy__candy listcandy__candy--d" aria-hidden="true"></span>
      <span class="listcandy__label">공유하기</span>
    </li>
  </ul>
</main>
</body>
</html>
