<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jelly indicator nav</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <nav class="navcandy" aria-label="주요 메뉴">
    <span class="navcandy__brand">푸딩</span>
    <div class="navcandy__track">
      <span class="navcandy__pill" aria-hidden="true"></span>
      <span class="navcandy__tab navcandy__tab--on">홈</span>
      <span class="navcandy__tab">기능</span>
      <span class="navcandy__tab">요금제</span>
      <span class="navcandy__tab">문의</span>
    </div>
    <button class="navcandy__cta" type="button">시작하기</button>
  </nav>
</main>
</body>
</html>
