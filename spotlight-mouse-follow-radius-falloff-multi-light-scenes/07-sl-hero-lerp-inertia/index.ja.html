<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>慣性で遅れて追うヒーローの静かな追従 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="デモの舞台 — SpaceかEnterで一時停止、Rで最初から、左右の矢印キーで別の値へ">
      <div class="ez__scene" data-role="scene" role="img" aria-label="光が毎フレーム少しずつカーソルへ近づき、カーソルと光の時差がヒーローの奥行きになる場面"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">場面の準備</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
    // ── 524 스포트라이트 공통 — 무대 좌표·문구 틀·요소 조립·광원 오버레이 (523 core.ts 계승)
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    // ── 무대 요소
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // 장면 안 요소를 만든다. 클래스는 cx 를 거쳐 CSS 모듈 이름으로 바뀐다
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        // clkEl(시계)은 sceneEl 에 직접 붙어 있으므로 래퍼만 비운다 — 시계를 지우면 렌더 시계가 죽는다
        scWrap.textContent = '';
        chartEl.textContent = '';
        probeEl.textContent = '';
    }
    // 정점 오프셋 — 시드 해시(재생해도 같은 값). Math.random 을 쓰지 않는다
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    // ── 엔진이 푼 시간 읽기 — getAnimations() 값
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function spanOf(d, dur) { return { s: d, e: d + dur, k: 0 }; }
    // ── 아래 차트 상자 그리기
    function bar(cls, x, y, w, h) {
        const e = make('i', cls, chartEl);
        put(e, x, y, w, h);
        return e;
    }
    function drawRows(segs, max) {
        const n = segs.length;
        const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
        const out = [];
        for (let i = 0; i < n; i += 1) {
            const sg = segs[i];
            const x = CX0 + clamp(sg.s, 0, max) / max * CW;
            const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
            out.push(bar('bar k0', x, 5 + i * (h + 1), w, h));
        }
        return out;
    }
    function axis(max) {
        const a = make('b', 'ax', chartEl);
        a.textContent = '0';
        put(a, CX0, 40, 0, 0);
        const b = make('b', 'ax ax--r', chartEl);
        b.textContent = f0(max) + 'ms';
        put(b, CX0 + CW - 60, 40, 60, 0);
    }
    let headEl = null;
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    // ── 스포트라이트 공통 조각
    // beam — 광원 오버레이. 배경을 매 프레임 JS 산술로 다시 쓴다(계산 한 겹의 화면 전파).
    //   커서 십자·고스트 링은 별도 요소로 분리 — 빛 계산과 표식은 다른 층
    function makeBeam() {
        return make('i', 'beam', scWrap);
    }
    // 가우시안 거리감쇠 — d 의 밝기 b = exp(-(d/f)^2). f=FALLOFF_PX
    function gauss(d, f) { return Math.exp(-(d * d) / (f * f)); }
    // gaussGrad — 광원 중심 (cx,cy) · 반경 r(이 안은 1) · 감쇠 폭 f. 정지점 11개로 샘플한
    // radial-gradient 문자열. tint 는 'r,g,b' (크림 255,247,230). maxA 는 중심 알파.
    // circle 뒤에 반경을 명시한다 — 생략하면 farthest-corner 로 확장돼 마지막 정지점 알파가
    // 화면 전체에 패드된다(04 poster 실측: 무대 전체가 밝아지는 원인)
    function gaussGrad(cx, cy, r, f, tint, maxA) {
        const stops = [];
        const total = r + f * 2;
        for (let i = 0; i <= 10; i += 1) {
            const frac = i / 10;
            const d = r + frac * f * 2;
            const a = maxA * gauss(d - r, f);
            stops.push('rgba(' + tint + ',' + f2(a) + ') ' + f1(clamp(d / total, 0, 1) * 100) + '%');
        }
        return 'radial-gradient(circle ' + f1(total) + 'px at ' + f1(cx) + 'px ' + f1(cy) + 'px, rgba(' + tint + ',' + f2(maxA) + ') 0px, ' + stops.join(', ') + ')';
    }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    // linearGrad — 02 비교용 선형 감쇠 (1 - d/f) 같은 폭. 정지점 개수·구간 동일
    function linearGrad(cx, cy, r, f, tint, maxA) {
        const stops = [];
        const total = r + f * 2;
        for (let i = 0; i <= 10; i += 1) {
            const frac = i / 10;
            const d = r + frac * f * 2;
            const a = maxA * clamp(1 - (d - r) / (f * 2), 0, 1);
            stops.push('rgba(' + tint + ',' + f2(a) + ') ' + f1(clamp(d / total, 0, 1) * 100) + '%');
        }
        return 'radial-gradient(circle ' + f1(total) + 'px at ' + f1(cx) + 'px ' + f1(cy) + 'px, rgba(' + tint + ',' + f2(maxA) + ') 0px, ' + stops.join(', ') + ')';
    }
    // route — 주입 시연 경로. t<200ms 중심 고정(418 규칙), 이후 피겨-8 연속 이동(424 규칙)
    //   u=(t-200)/1800 · 중심 (224,78) 을 벗어난 타원(중심 224,66 · 반경 190x44) — 프로브·중앙 픽셀 계산이
    //   캡처 간격 사이에 0 으로 빠지지 않게 (측정 프로브가 항상 광원 영향 안에 있게)
    function route(t) {
        if (t < 200) {
            return { x: 224, y: 66 };
        }
        const u = (t - 200) / 1800;
        return { x: 224 + 190 * Math.sin(u * Math.PI * 2), y: 66 + 44 * Math.sin(u * Math.PI * 4) };
    }
    // 커서 표식 — 십자(01·02·07) / 링(09). 빛과 별개 층
    function makeCursor(cls) {
        return make('i', cls, scWrap);
    }
    // ── 포인터 이벤트 좌표를 무대(480x300) 좌표로 — 실제 손 조작 경로 공용
    function stagePoint(e) {
        const r = sceneEl.getBoundingClientRect();
        const k = (rootEl.clientWidth / W) || 1;
        return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k };
    }
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            cycle = Math.max(2000, cfg.build(pi));
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                setPaused(true);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            // 움직임 줄이기 — 모든 애니메이션이 꺼지고 장면은 중앙 고정 조명 한 장 (큐 접근성 서술)
            statusP.textContent = '動きを減らす設定 · 中央に固定した光を一枚';
            readB.textContent = 'カーソルを追う代わりに、光が中央に固定された一枚の場面だけを示す';
            doneP.textContent = readB.textContent;
            cfg.frame(1e9);
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }
    // 07 lerp 관성 — 광원 좌표를 매 프레임 커서 쪽으로 LERP_FACTOR(0.18) 만큼만 보낸다.
    //    커서와 빛 사이 시차가 히어로의 은은한 깊이. 값을 낮추면 물리적 무게
    const LERP_FACTOR = 0.18; // 변형3: 0.18 → 0.06 (느릿한 물성)
    const HERO_R = 54;
    const HERO_F = 80;
    let beamEl = null;
    let curEl = null;
    let ringEl = null;
    let gapEl = null;
    let eqEl = null;
    let lx = 224; // 빛의 위치 (lerp 추적)
    let ly = 78;
    function build(_i) {
        beamEl = makeBeam();
        curEl = makeCursor('curx');
        ringEl = make('i', 'bring', scWrap); // 빛 위치 링 — 커서 십자와 분리
        gapEl = make('i', 'gaplnk', scWrap); // 커서-빛 시차 선
        eqEl = make('b', 'ov ovb', sceneEl);
        put(eqEl, 10, 6, 380, 14);
        // 히어로 배경 — 파스텔 실루엣 丘 (정적)
        const hill1 = make('i', 'hill hill--a', scWrap);
        put(hill1, -40, 96, 240, 60);
        const hill2 = make('i', 'hill hill--b', scWrap);
        put(hill2, 200, 108, 320, 48);
        const title = make('b', 'hero-t', scWrap);
        put(title, 24, 24, 300, 20);
        title.textContent = '舞台の上の場面';
        scWrap.appendChild(beamEl);
        scWrap.appendChild(ringEl);
        axis(2000);
        setReads(fill('LERP_FACTOR {a} · HERO_R {b}px · lx += (px-lx) x {a}', f2(LERP_FACTOR), f0(HERO_R)), fill('毎フレーム {a} だけ近づく — カーソルと光の時差が奥行きになる', f2(LERP_FACTOR)));
        return 2000;
    }
    function applyHero(x, y, dt) {
        // lerp — dt 보정 없이 고정 계수(프레임 표준). 커서-빛 거리를 돌려준다
        lx += (x - lx) * LERP_FACTOR;
        ly += (y - ly) * LERP_FACTOR;
        void dt;
        const dist = Math.sqrt((x - lx) * (x - lx) + (y - ly) * (y - ly));
        if (beamEl) {
            beamEl.style.background = gaussGrad(lx, ly, HERO_R, HERO_F, '255,247,230', 0.34);
        }
        if (curEl) {
            put(curEl, x - 7, y - 7, 14, 14);
        }
        if (ringEl) {
            put(ringEl, lx - 11, ly - 11, 22, 22);
        }
        if (gapEl) {
            const len = Math.sqrt((x - lx) * (x - lx) + (y - ly) * (y - ly));
            put(gapEl, Math.min(x, lx), Math.min(y, ly) - 1, Math.max(2, Math.abs(x - lx)), 2);
            void len;
        }
        return dist;
    }
    function frame(t) {
        const p = route(t);
        const dist = applyHero(p.x, p.y, 33);
        if (eqEl) {
            eqEl.textContent = 'lx=' + f1(lx) + ' ly=' + f1(ly) + fill('今 {a} · カーソルと光の時差 {b}px', '', f1(dist));
        }
        return fill('今 {a} · カーソルと光の時差 {b}px', f0(t) + 'ms', f1(dist));
    }
    // 실제 입력 경로 — pointermove 로 같은 lerp 산술
    let hx = 224;
    let hy = 78;
    sceneEl.addEventListener('pointermove', function (ev) {
        const p = stagePoint(ev);
        hx = clamp(p.x - 8, 0, 448);
        hy = clamp(p.y - 40, 0, 156);
    });
    // 손 조작 시 frame() 의 route 대신 (hx,hy) 를 쓰는 구조는 동일 산술 — 시연은 주입 좌표
    void hx;
    void hy;
    return run({ count: 1, build: build, frame: frame });
}
})();
</script>
</body>
</html>
