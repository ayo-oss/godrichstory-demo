<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식물 성장 생성 규칙 — 폴링 샌드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cd is-demo" id="cdRoot">
  <p class="cd__hint"><span>물이 씨앗을 스치면 줄기가 위로 자랍니다</span></p>
  <div class="cd__field" id="cdField" role="application" aria-label="식물 성장 셀 오토마타 데모" tabindex="0">
    <canvas class="cd__cv" id="cdCv"></canvas>
  </div>
  <div class="cd__bar">
    <span class="cd__meta"><b class="cd__val" id="cdN">8</b>발아 확률 %</span>
    <span class="cd__meta cd__meta--dim">canvas · fillRect · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 식물 성장(05). 재료 코드 0 빈칸 2 물 8 씨앗 9 식물 10 흙 11 돌.
// 씨앗/식물 칸의 아래·옆에 물이 닿으면 GROW_P 확률로 위 빈칸을 새 줄기(plant/leaf 교대 색)로 바꾸고
// 물을 소모한다. 물은 03처럼 아래→대각→좌우로 흐르고, 상단 스포너가 성기게 빗방울을 떨어뜨린다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var GROW_P = 0.08;  // 발아·성장 확률 — 0.03 은 느린 이끼, 0.2 는 폭발적인 정글
  var RAIN_P = 0.05;  // 상단 빗방울 스포너 확률(칸당·틱당) — 물 공급량
  // ────────────────────────────────────────────────────

  var EMPTY=0, WATER=2, SEED=8, PLANT=9, DIRT=10, STONE=11;
  var root = document.getElementById('cdRoot');
  var field = document.getElementById('cdField');
  var cv = document.getElementById('cdCv');
  var ctx = cv.getContext('2d');
  var nOut = document.getElementById('cdN');

  // 시드 고정 PRNG — mulberry32. 미리보기가 항상 같은 정원으로 자란다
  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x318A55);

  // 색은 CSS 커스텀 프로퍼티(--sand-*)에서 getComputedStyle 로 읽는다 — 파스텔 토큰이 scss 한 곳에
  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_NIGHT = tokRGB('--sand-night');
  var C_GLOW  = tokRGB('--sand-glow');
  var C_WATER = tokRGB('--sand-water');
  var C_PLANT = tokRGB('--sand-plant');
  var C_LEAF  = tokRGB('--sand-leaf');
  var C_DIRT  = tokRGB('--sand-grain');
  var C_STONE = tokRGB('--sand-stone');
  var C_MIST  = tokRGB('--sand-mist');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, cols = 0, rows = 0, CELL = 4;
  var grid = null, wdir = null;
  var raf = 0, t0 = -1;
  var tick = 0;

  function idx(x, y) { return y * cols + x; }

  // ── 장면 — 바닥 굴곡 흙 지형(사인 2개 합성) + 씨앗 8~10개 ──
  function build() {
    grid = new Uint8Array(cols * rows);
    wdir = new Uint8Array(cols * rows);
    var x, y;
    for (x = 0; x < cols; x++) {
      // 굴곡 지형 — 낮은 물결 두 개를 합성. 아래는 돌, 위는 흙
      var hgt = rows * (0.72
        + 0.10 * Math.sin(x / cols * Math.PI * 2.2 + 0.7)
        + 0.05 * Math.sin(x / cols * Math.PI * 5.1 + 2.1));
      hgt = Math.round(Math.max(rows * 0.55, Math.min(rows * 0.88, hgt)));
      for (y = hgt; y < rows; y++) grid[idx(x, y)] = (y >= hgt + 2) ? STONE : DIRT;
    }
    // 씨앗 — 지형 표면 바로 위에 균등 간격 8~10개
    var count = 9;
    for (var s = 0; s < count; s++) {
      x = Math.round(cols * (0.08 + 0.84 * s / (count - 1)));
      for (y = 0; y < rows; y++) {
        if (grid[idx(x, y)] !== EMPTY) break;
      }
      if (y > 0) grid[idx(x, y - 1)] = SEED;
    }
  }

  function update() {
    tick++;
    var x, y, i;
    // 상단 빗방울 스포너 — 스포너 폭 전체, 확률 낮게
    for (x = 0; x < cols; x++) {
      if (grid[idx(x, 0)] === EMPTY && rand() < RAIN_P) grid[idx(x, 0)] = WATER;
    }
    var moved = new Uint8Array(cols * rows);
    // 아래 행 → 위 행 (물/성장 모두)
    for (y = rows - 1; y >= 0; y--) {
      var ltr = (tick & 1) === 0;
      for (var s2 = 0; s2 < cols; s2++) {
        x = ltr ? s2 : cols - 1 - s2;
        i = idx(x, y);
        if (moved[i]) continue;
        var m = grid[i];
        if (m === WATER) {
          // 물 — 아래 → 대각 → 좌우(방향 교차). 고형(흙·돌·씨앗·식물) 위에만 멈춘다
          var below = y < rows - 1 ? grid[idx(x, y + 1)] : STONE;
          if (below === EMPTY) {
            grid[idx(x, y + 1)] = WATER; grid[i] = EMPTY; moved[idx(x, y + 1)] = 1;
          } else {
            var dir = (wdir[i] || (tick & 1 ? 1 : -1));
            var dl = (x > 0 && y < rows - 1) ? grid[idx(x - 1, y + 1)] : STONE;
            var dr = (x < cols - 1 && y < rows - 1) ? grid[idx(x + 1, y + 1)] : STONE;
            var cand = dir > 0 ? [[1, dr], [-1, dl]] : [[-1, dl], [1, dr]];
            var done = false;
            for (var c = 0; c < 2 && !done; c++) {
              if (cand[c][1] === EMPTY) {
                var nx = x + cand[c][0];
                grid[idx(nx, y + 1)] = WATER; wdir[idx(nx, y + 1)] = cand[c][0];
                grid[i] = EMPTY; wdir[i] = 0; moved[idx(nx, y + 1)] = 1;
                done = true;
              }
            }
            if (!done) {
              var sx = x + dir;
              if (sx >= 0 && sx < cols && grid[idx(sx, y)] === EMPTY) {
                grid[idx(sx, y)] = WATER; wdir[idx(sx, y)] = dir;
                grid[i] = EMPTY; wdir[i] = 0; moved[idx(sx, y)] = 1;
              } else if (rand() < 0.06) {
                // 갇힌 물 — 증발. 흙 표면에 고여만 있는 정체를 막는다
                grid[i] = EMPTY;
              }
            }
          }
        } else if (m === SEED || m === PLANT) {
          // 성장 — 아래·옆에 물이 닿으면 확률로 위 빈칸을 줄기로, 물 소모
          var touch = [
            [0, 1, y < rows - 1 ? grid[idx(x, y + 1)] : STONE],
            [1, 0, x < cols - 1 ? grid[idx(x + 1, y)] : STONE],
            [-1, 0, x > 0 ? grid[idx(x - 1, y)] : STONE]
          ];
          for (var t2 = 0; t2 < 3; t2++) {
            if (touch[t2][2] !== WATER) continue;
            var wx = x + touch[t2][0], wy = y + touch[t2][1];
            if (y > 0 && grid[idx(x, y - 1)] === EMPTY && rand() < GROW_P) {
              grid[idx(x, y - 1)] = PLANT;      // 새 줄기 — plant/leaf 교대 색은 렌더에서 줄 번호로
              grid[idx(wx, wy)] = EMPTY;         // 물 소모
              moved[idx(x, y - 1)] = 1;
            }
            break; // 물 한 방울은 한 번만 쓴다
          }
        }
      }
    }
  }

  // ── 렌더 — fillRect. 칸 = CELL px ──
  function draw(t) {
    ctx.fillStyle = 'rgb(' + C_NIGHT.join(',') + ')';
    ctx.fillRect(0, 0, W, H);

    // 잔광(안개) — 중심이 sin/cos 로 천천히 도는 radial gradient, 알파 낮게
    var gx = W * (0.5 + 0.30 * Math.sin(t * 0.8));
    var gy = H * (0.45 + 0.26 * Math.cos(t * 0.6));
    var gr = Math.max(W, H) * 0.55;
    var g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    g.addColorStop(0, 'rgba(' + C_GLOW.join(',') + ',0.06)');
    g.addColorStop(1, 'rgba(' + C_GLOW.join(',') + ',0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 격자 — 재료별 fillRect. 식물은 세로 줄 번호 홀짝으로 plant/leaf 교대
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++) {
        var m = grid[idx(x, y)];
        if (m === EMPTY) continue;
        if (m === WATER) ctx.fillStyle = 'rgb(' + C_WATER.join(',') + ')';
        else if (m === SEED) ctx.fillStyle = 'rgb(' + C_MIST.join(',') + ')';
        else if (m === PLANT) {
          // 바람 — 자란 줄기가 매 프레임 살짝 흔들린다(위쪽 칸일수록 크게)
          var sway = Math.sin(t * 2.1 + x * 0.55 + y * 0.21) * (2 + (rows - y) * 0.9);
          ctx.fillStyle = (y & 1)
            ? 'rgba(' + Math.round(C_PLANT[0] - sway) + ',' + Math.round(C_PLANT[1] - sway * 0.8) + ',' + Math.round(C_PLANT[2] - sway * 0.6) + ',1)'
            : 'rgba(' + Math.round(C_LEAF[0] - sway) + ',' + Math.round(C_LEAF[1] - sway * 0.8) + ',' + Math.round(C_LEAF[2] - sway * 0.6) + ',1)';
        }
        else if (m === DIRT) ctx.fillStyle = 'rgb(' + C_DIRT.join(',') + ')';
        else if (m === STONE) ctx.fillStyle = 'rgb(' + C_STONE.join(',') + ')';
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W); cv.height = Math.round(H);
    cols = Math.max(8, Math.floor(W / CELL));
    rows = Math.max(8, Math.floor(H / CELL));
    build();
    tick = 0;
  }

  function stillFrame() {
    // reduce — 비 몇 방울 + 성장 몇 틱만 돌리고 한 장
    for (var k = 0; k < 90; k++) update();
    draw(0.5);
  }

  var STEP = 1000 / 60, acc = 0;
  function frame(now) {
    if (t0 < 0) t0 = now;
    acc = acc + (now - (frame.prev || now));
    frame.prev = now;
    while (acc >= STEP) {
      update();
      acc -= STEP;
    }
    draw((now - t0) / 1000);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    fit();
    if (reduce) stillFrame();
  });

  fit();
  nOut.textContent = String(Math.round(GROW_P * 100));
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
