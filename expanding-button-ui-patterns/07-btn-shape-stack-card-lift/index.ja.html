<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重ね持ち上げ値切替 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sl is-demo" id="sl">
  <div class="sl__pile" id="slPile">
    <div class="sl__ghost" style="--n: 3"></div>
    <div class="sl__ghost" style="--n: 2"></div>
    <div class="sl__ghost" style="--n: 1"></div>
    <div class="sl__card">
      <span class="sl__title">通知値のまとまり</span>
      <span class="sl__sub">後ろに値3つ重なり</span>
    </div>
  </div>
  <button type="button" class="sl__btn" id="slBtn" aria-expanded="false">
    <span class="sl__label">詳細値を開く</span>
  </button>
</div>
<script>
(function () {
  var root = document.getElementById('sl');
  var btn = document.getElementById('slBtn');
  var ghosts = root.querySelectorAll('.sl__ghost');
  var sub = root.querySelector('.sl__sub');
  var STEP_PX = 34; // 계산 겹: 겹침 카드 하나가 위로 들리는 y 오프셋(px) — 스프링 감쇠로 산출
  var STAGGER_MS = 80; // 계산 겹: 뒤 카드부터 이 값씩 늦게 들린다

  ghosts.forEach(function (g, i) {
    g.style.transitionDelay = ((ghosts.length - 1 - i) * STAGGER_MS) + 'ms';
  });

  var open = false;
  function paint() {
    root.classList.toggle('sl--open', open);
    btn.setAttribute('aria-expanded', String(open));
    sub.textContent = open ? '値3つ展開' : '後ろに値3つ重なり';
  }

  function toggle() {
    open = !open;
    paint();
  }

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    toggle();
  });

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(toggle, 1400); }
  else { open = true; paint(); }
})();
</script>
</main>
</body>
</html>
