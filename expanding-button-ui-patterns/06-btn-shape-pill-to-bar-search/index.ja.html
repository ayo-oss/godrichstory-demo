<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>丸薬から帯への値切替 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ps is-demo" id="ps">
  <div class="ps__bar" id="psBar">
    <span class="ps__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </span>
    <input class="ps__input" id="psInput" type="text" placeholder="検索値を入力" aria-label="検索値入力">
    <button type="button" class="ps__close" id="psClose" aria-label="検索値を閉じる">
      <svg viewBox="0 0 24 24" width="14" height="14"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </div>
  <ul class="ps__hints" id="psHints" aria-hidden="true">
    <li class="ps__hint">サンプル値 1</li>
    <li class="ps__hint">サンプル値 2</li>
  </ul>
</div>
<script>
(function () {
  var root = document.getElementById('ps');
  var bar = document.getElementById('psBar');
  var input = document.getElementById('psInput');
  var closeBtn = document.getElementById('psClose');
  var BAR_W = 320; // 목표 막대 폭(px)
  // 계산 겹: 열릴 때 입력 폭을 getBoundingClientRect 로 실측해 커서가 놓일 자리를 잡는다.
  // 폰트·패딩이 달라져도 열림 폭이 글자보다 좁아지지 않게 max 로 비교한다.

  var open = false;
  function paint() {
    root.classList.toggle('ps--open', open);
    bar.setAttribute('aria-expanded', String(open));
    if (open) {
      // 열린 직후 실측: 입력 요소 폭이 0 이면(아직 숨김) 측정을 다음 프레임으로 미룬다
      var w = input.getBoundingClientRect().width || 1;
      bar.style.setProperty('--input-w', w + 'px');
      input.focus({ preventScroll: true });
    }
  }

  function toggle() {
    open = !open;
    paint();
  }

  closeBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    if (open) toggle();
  });
  input.addEventListener('input', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    paintHints();
  });
  input.addEventListener('focus', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
  });

  // 시드 고정 로컬 값 — 실제 검색 API 는 쓰지 않는다
  var SEEDS = ['サンプル値 1', 'サンプル値 2', 'サンプル値 3'];
  function paintHints() {
    var hints = root.querySelectorAll('.ps__hint');
    var q = input.value.trim();
    var n = q ? Math.min(2, SEEDS.length) : 0;
    hints.forEach(function (h, i) {
      h.classList.toggle('ps__hint--on', i < n);
      if (i < n) h.textContent = SEEDS[i];
    });
  }

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    var step = 0;
    var TYPES = ['', 'サ', ''];
    autoTimer = setInterval(function () {
      open = (step % 2 === 0);
      input.value = TYPES[(step >> 1) % TYPES.length];
      paint();
      paintHints();
      step++;
    }, 1300);
  } else { open = true; input.value = ''; paint(); }
})();
</script>
</main>
</body>
</html>
