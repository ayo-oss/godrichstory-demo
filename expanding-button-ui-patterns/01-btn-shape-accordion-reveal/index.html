<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>열림 값 아코디언 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ba is-demo" id="ba">
  <button type="button" class="ba__btn" id="baBtn" aria-expanded="false" aria-controls="baPanel">
    <span class="ba__label">열림 값 펼치기</span>
    <span class="ba__mark" aria-hidden="true">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
  </button>
  <div class="ba__panel" id="baPanel" role="region">
    <ul class="ba__list" id="baList">
      <li class="ba__item">답변 값 1</li>
      <li class="ba__item">답변 값 2</li>
      <li class="ba__item">답변 값 3</li>
    </ul>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('ba');
  var btn = document.getElementById('baBtn');
  var panel = document.getElementById('baPanel');
  var items = panel.querySelectorAll('.ba__item');
  var STAGGER_MS = 70; // 계산 겹: 항목 순서 * 이 값만큼 늦게 나타난다

  // 계산 겹: 하위 항목이 실제로 차지하는 노출 높이를 getBoundingClientRect 로 실측해
  // panel 의 --panel-h 로 넘긴다 — 짐작한 고정값이 아니라 지금 폰트·내용 기준 값이다.
  function measure() {
    var h = 0;
    items.forEach(function (li) { h += li.getBoundingClientRect().height; });
    panel.style.setProperty('--panel-h', h + 'px');
  }
  items.forEach(function (li, i) {
    li.style.transitionDelay = (i * STAGGER_MS) + 'ms';
  });

  var open = false;
  function paint() {
    measure();
    root.classList.toggle('ba--open', open);
    btn.setAttribute('aria-expanded', String(open));
  }

  function toggle() {
    open = !open;
    paint();
  }

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    toggle();
  });

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  measure();
  if (!reduce) { toggle(); autoTimer = setInterval(toggle, 800); }
  else { open = true; paint(); }
})();
</script>
</main>
</body>
</html>
