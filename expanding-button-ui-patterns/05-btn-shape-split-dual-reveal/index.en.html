<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split-dual value toggle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sd is-demo" id="sd">
  <div class="sd__shell" id="sdShell">
    <div class="sd__half sd__half--l" aria-hidden="true"></div>
    <div class="sd__half sd__half--r" aria-hidden="true"></div>
    <div class="sd__face sd__face--rest" id="sdRest">
      <span class="sd__label">Delete item value</span>
    </div>
    <div class="sd__face sd__face--split" id="sdSplit">
      <button type="button" class="sd__choice" id="sdNo">Cancel</button>
      <button type="button" class="sd__choice sd__choice--danger" id="sdYes">Erase</button>
    </div>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('sd');
  var shell = document.getElementById('sdShell');
  var PART_PX = 26; // 계산 겹: 두 절반이 벌어지는 거리(px) — 셸 폭 절반 기준 산술

  // 계산 겹: 셸 폭을 getBoundingClientRect 로 실측해 --shell-w 로 넘긴다.
  // 절반은 각자 셸 폭의 50% 로 그려지므로 벌어짐 거리도 이 값에 맞춘다.
  function measure() {
    shell.style.setProperty('--shell-w', shell.getBoundingClientRect().width + 'px');
  }

  var split = false;
  function paint() {
    root.classList.toggle('sd--split', split);
    shell.setAttribute('aria-expanded', String(split));
  }

  function toggle() {
    split = !split;
    paint();
  }

  shell.addEventListener('click', function (e) {
    if (e.target.closest('.sd__choice')) return;
    root.classList.remove('is-demo');
    stopAutoplay();
    if (!split) toggle();
  });
  document.getElementById('sdNo').addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    if (split) toggle();
  });
  document.getElementById('sdYes').addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    if (split) toggle();
  });

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  measure();
  if (!reduce) { autoTimer = setInterval(toggle, 1400); }
  else { split = true; paint(); }
})();
</script>
</main>
</body>
</html>
