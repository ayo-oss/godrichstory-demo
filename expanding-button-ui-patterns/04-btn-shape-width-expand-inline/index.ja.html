<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幅の慣性値切替 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="we is-demo" id="we">
  <p class="we__line">本文の一行が流れる場所です。下のボタンがこの行を濁さないように控えめに伸びます。</p>
  <button type="button" class="we__btn" id="weBtn" aria-expanded="false">
    <span class="we__base">もっと見る</span>
    <span class="we__more" id="weMore">全文値を見る</span>
  </button>
</div>
<script>
(function () {
  var root = document.getElementById('we');
  var btn = document.getElementById('weBtn');
  var more = document.getElementById('weMore');
  var REST_W = 104; // 접힘 너비(px) — getBoundingClientRect 로 실측해 갱신한다
  var K = 170, D = 12; // 스프링 상수·감쇠 — 목표를 넘었다가 되돌아오는 관성 값

  // 계산 겹: 목표 폭을 getBoundingClientRect 로 실측한다(짐작 px 아님).
  // 늘어난 상태의 텍스트를 잠깐 펼쳐 재고 다시 접는다 — 글꼴마다 값이 다르다.
  function measure() {
    var prev = more.style.width;
    more.style.width = 'auto';
    var w = more.getBoundingClientRect().width;
    more.style.width = prev || '0px';
    return Math.ceil(w);
  }
  var openW = measure() + REST_W + 24; // 24 = 기준 너비에 더할 여유

  var open = false;
  var cur = REST_W, vel = 0, target = REST_W;
  var raf = null;

  // 스프링 감쇠 계산: 매 프레임 a = -K*(cur-target) - D*vel — 오버슈트 후 안착
  function tick() {
    var a = -K * (cur - target) * 0.001 - D * vel * 0.01;
    vel += a;
    cur += vel;
    if (Math.abs(cur - target) < 0.4 && Math.abs(vel) < 0.05) { cur = target; vel = 0; }
    btn.style.width = cur.toFixed(1) + 'px';
    var p = Math.max(0, Math.min(1, (cur - REST_W) / (openW - REST_W)));
    more.style.opacity = String(p);
    raf = requestAnimationFrame(tick);
  }

  function toggle() {
    open = !open;
    target = open ? openW : REST_W;
    btn.setAttribute('aria-expanded', String(open));
  }

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    toggle();
  });

  raf = requestAnimationFrame(tick);

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(toggle, 1300); }
  else { open = true; target = openW; cur = openW; btn.style.width = openW + 'px'; more.style.opacity = '1'; }
})();
</script>
</main>
</body>
</html>
