<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>되튐 복귀 값 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="eb is-demo" id="eb">
  <button type="button" class="eb__btn" id="ebBtn" aria-pressed="false">
    <span class="eb__label">필터 값 접기</span>
  </button>
  <div class="eb__chipRow" id="ebRow" aria-hidden="true">
    <span class="eb__chip">값 걸러내기 1</span>
    <span class="eb__chip">값 걸러내기 2</span>
    <span class="eb__chip">값 걸러내기 3</span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('eb');
  var btn = document.getElementById('ebBtn');
  var K = 190, D = 14; // 계산 겹: 스프링 상수·감쇠 — 눌렀다 놓는 순간의 되튐 값을 정한다

  var collapsed = false;
  var cur = 1, vel = 0, target = 1;
  var raf = null;

  // 스프링 감쇠 계산: 매 프레임 a = -K*(cur-target) - D*vel — 줄어들었다가 반대로 살짝 늘었다가 제 형태
  function tick() {
    var a = -K * (cur - target) * 0.001 - D * vel * 0.01;
    vel += a;
    cur += vel;
    if (Math.abs(cur - target) < 0.004 && Math.abs(vel) < 0.005) { cur = target; vel = 0; }
    btn.style.transform = 'scaleX(' + cur.toFixed(3) + ')';
    var p = Math.max(0, Math.min(1, (1 - cur) / 0.28));
    root.style.setProperty('--press', p.toFixed(3));
    raf = requestAnimationFrame(tick);
  }

  function toggle() {
    collapsed = !collapsed;
    target = collapsed ? 0.72 : 1;
    btn.setAttribute('aria-pressed', String(collapsed));
    root.classList.toggle('eb--collapsed', collapsed);
  }

  btn.addEventListener('pointerdown', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    target = Math.min(target, 0.86); // 누르는 순간 살짝 줄어든다
  });
  btn.addEventListener('pointerup', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    toggle();
  });
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    toggle();
  });

  raf = requestAnimationFrame(tick);

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(toggle, 1200); }
  else { collapsed = true; target = 0.72; cur = 0.72; btn.style.transform = 'scaleX(0.72)'; root.classList.add('eb--collapsed'); btn.setAttribute('aria-pressed', 'true'); }
})();
</script>
</main>
</body>
</html>
