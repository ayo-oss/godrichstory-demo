<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>표시 성장 값 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ig is-demo" id="ig">
  <div class="ig__bar" role="toolbar" aria-label="동작 값 모음">
    <button type="button" class="ig__tool" id="igTool" aria-pressed="false">
      <span class="ig__ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path class="ig__body" d="M4 20h16v-2.2c0-1.9-3.6-3.3-8-3.3s-8 1.4-8 3.3V20z" />
          <circle class="ig__head" cx="12" cy="8" r="4" />
        </svg>
      </span>
      <span class="ig__label" id="igLabel">프로필 값</span>
    </button>
    <span class="ig__peer" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
    </span>
    <span class="ig__peer" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18"><rect x="5" y="5" width="14" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
    </span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('ig');
  var tool = document.getElementById('igTool');
  var label = document.getElementById('igLabel');
  var ICON_ON = 1.25, ICON_OFF = 1; // 계산 겹: 표시 스케일 값 — 초점 값에 따라 곱해진다

  // 계산 겹: 라벨 폭을 getBoundingClientRect 로 실측해 --label-w 로 넘긴다.
  // max-width 전환은 실측 폭과 짝이어야 글자가 중간에 잘리지 않는다.
  function measure() {
    var prev = label.style.maxWidth;
    label.style.maxWidth = 'none';
    var w = Math.ceil(label.getBoundingClientRect().width);
    label.style.maxWidth = prev || '0px';
    tool.style.setProperty('--label-w', w + 'px');
  }

  var on = false;
  function paint() {
    measure();
    root.classList.toggle('ig--on', on);
    tool.setAttribute('aria-pressed', String(on));
  }

  function toggle() {
    on = !on;
    paint();
  }

  tool.addEventListener('pointerenter', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    if (!on) toggle();
  });
  tool.addEventListener('pointerleave', function () {
    if (autoTimer === null && on) toggle();
  });
  tool.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    toggle();
  });
  tool.addEventListener('focus', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
  });

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(toggle, 1300); }
  else { on = true; paint(); }
})();
</script>
</main>
</body>
</html>
