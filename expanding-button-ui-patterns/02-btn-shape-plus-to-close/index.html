<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>더하기 회전 값 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pc is-demo" id="pc">
  <button type="button" class="pc__btn" id="pcBtn" aria-pressed="false">
    <span class="pc__label">항목 값 추가</span>
    <span class="pc__disc" aria-hidden="true">
      <svg class="pc__icon" viewBox="0 0 24 24" width="22" height="22">
        <!-- 세로 막대 — 닫힘 값이 켜지면 stroke-dashoffset 으로 선분이 그려진 채 사라진다 -->
        <line class="pc__v" x1="12" y1="5" x2="12" y2="19" />
        <!-- 가로 막대 — 원래 있던 선. 두 막대가 같은 중심(12,12)에서 만난다 -->
        <line class="pc__h" x1="5" y1="12" x2="19" y2="12" />
      </svg>
    </span>
  </button>
</div>
<script>
(function () {
  var root = document.getElementById('pc');
  var btn = document.getElementById('pcBtn');
  var SPIN_DEG = 135; // 계산 겹: 회전 목표 각도 값 — 90도가 아니라 지나쳤다가 되돌아오는 각도
  var OVER_MS = 90;   // 계산 겹: 목표 각도를 넘겼다 되돌리는 여분 시간

  var closed = false;
  function paint() {
    root.classList.toggle('pc--closed', closed);
    btn.setAttribute('aria-pressed', String(closed));
  }

  function toggle() {
    closed = !closed;
    paint();
  }

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    toggle();
  });

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(toggle, 1100); }
  else { closed = true; paint(); }
})();
</script>
</main>
</body>
</html>
