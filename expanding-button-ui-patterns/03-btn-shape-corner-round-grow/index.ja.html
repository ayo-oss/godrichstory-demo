<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角丸値の成長 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cr is-demo" id="cr">
  <div class="cr__meter" aria-hidden="true">
    <div class="cr__meterFill" id="crFill"></div>
  </div>
  <p class="cr__read" id="crRead">丸み値 12px</p>
  <div class="cr__btn" id="crBtn" role="button" tabindex="0" aria-label="段階値を上げる">
    <span class="cr__label">次の段階</span>
  </div>
  <div class="cr__steps" aria-hidden="true">
    <span class="cr__dot"></span>
    <span class="cr__dot"></span>
    <span class="cr__dot"></span>
    <span class="cr__dot"></span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('cr');
  var btn = document.getElementById('crBtn');
  var fill = document.getElementById('crFill');
  var read = document.getElementById('crRead');
  var dots = root.querySelectorAll('.cr__dot');
  var RADII = [12, 16, 24, 999]; // 계산 겹: 단계마다 커지는 둥근 값(px) — 마지막은 ピル
  var RADII_TEXT = ['丸み値 12px', '丸み値 16px', '丸み値 24px', '丸み値 ピル'];
  var step = 0;

  function paint() {
    var r = RADII[step];
    // 둥근 값은 % 가 아니라 px 로 보간해야 성장이 선형으로 보인다 — 999px 는 ピル 표기
    btn.style.borderRadius = (r === 999 ? '999px' : r + 'px');
    read.textContent = RADII_TEXT[step];
    fill.style.transform = 'scaleX(' + ((step + 1) / RADII.length) + ')';
    dots.forEach(function (d, i) {
      d.classList.toggle('cr__dot--on', i <= step);
    });
  }

  function advance() {
    step = (step + 1) % RADII.length;
    paint();
  }

  function human() {
    root.classList.remove('is-demo');
    stopAutoplay();
    advance();
  }
  btn.addEventListener('click', human);
  btn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); }
  });

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  paint();
  if (!reduce) { autoTimer = setInterval(advance, 900); }
})();
</script>
</main>
</body>
</html>
