<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연쇄 도미노 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dm" id="dm">
  <p class="dm__hint">
    <svg class="dm__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M224,128a96,96,0,0,1-96,96c-11.4,0-20-8.6-20-20s8.9-20,20-20a56,56,0,0,0,0-112c-11.1,0-20-8.9-20-20s8.6-20,20-20A96,96,0,0,1,224,128Z" opacity=".2"/><path d="M128,24A104,104,0,0,0,128,232c-15.8,0-28-12.3-28-28s12.4-28,28-28a48,48,0,0,0,0-96c-15.6,0-28-12.4-28-28S112.2,24,128,24Zm0,16c-6.9,0-12,5.2-12,12s5.3,12,12,12a64,64,0,0,1,0,128c-6.7,0-12,5.4-12,12s5.1,12,12,12a88,88,0,0,0,0-176Z"/></g></svg>
    <span>Drag the first piece right — its falling rotation hands angular velocity to the next and the chain runs</span>
  </p>
  <div class="dm__field" id="field" role="application" aria-label="Domino experiment board" tabindex="0">
    <canvas class="dm__cv" id="cv"></canvas>
    <b class="dm__badge" aria-hidden="true"><span class="dm__badgeNum" id="fellVal">0</span><span class="dm__badgeUnit">fallen pieces</span></b>
  </div>
  <div class="dm__bar">
    <label class="dm__dial">spacing
      <input type="range" id="gap" min="0.5" max="1.6" step="0.05" value="1" aria-label="piece spacing multiple">
    </label>
    <button class="dm__reset" id="reset" type="button">Reset</button>
  </div>
</div>
</main>
<script>
// 연쇄 도미노 — 각도 Verlet(a += a - pa + angacc·dt², 각속도 변수 없음)로 조각의 기움을 적분한다.
// 각 조각은 받침점(쓰러지는 방향 앞 아래모서리) 기준으로 회전한다. 무게중심이 받침점 바로 위로 오는
// 임계각을 넘기 전엔 복원 모멘트가 각도를 0으로 되돌리고, 넘으면 모멘트가 방향을 바꿔 급가속한다.
// 쓰러지던 조각의 윗모서리가 다음 조각 몸통에 닿는 순간(윗모서리 위치를 계산하는 기하 근사) 그
// 순간 선속도를 다음 조각의 초기 각속도로 넘겨 연쇄가 번진다.
var root = document.getElementById('dm');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var gapIn = document.getElementById('gap');
var fellVal = document.getElementById('fellVal');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

var ctx = cv.getContext('2d');
var css = getComputedStyle(root);
var BG = css.getPropertyValue('--bg').trim();
var INK = css.getPropertyValue('--ink').trim();
var CHIP = css.getPropertyValue('--chip').trim();
var CHIP2 = css.getPropertyValue('--chip2').trim();
var WARN = css.getPropertyValue('--warn').trim();

var N = 9;               // 조각 수
var HW = 9;              // 조각 두께의 절반(px)
var H2 = 60;             // 조각 높이(px)
var KICK = 0.46;         // 접촉 선속도 → 다음 조각 각속도 전달률
var LOOP = 1900;         // 전부 쓰러진 뒤 리셋 대기(ms)
var REDO = 4200;         // 자동 시연: 밀기 주기(ms)

var gapScale = 1.0;      // spacing 슬라이더 배율
var tiles = [];          // { x, a, pa, down, hit }
var flash = [];          // 연쇄 전달 표시 { x, y, t }
var W = 0, H = 0, dpr = 1;
var manual = false;
var push = { on: false, t0: 0 };  // 자동 시연 푸시
var resetAt = 0;
var t0 = performance.now();
var startT = t0;  // 자동 시연 주기 기준 — 첫 바퀴는 페이지가 뜬 직후 곧바로 시작해
                   // 짧은 캡처 창(2초)에도 연쇄가 반드시 담기게 한다. 이후부턴 REDO 주기.

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  build();
}
function build() {
  tiles = [];
  flash = [];
  var usable = W - 20;
  var pitch0 = usable / (N - 1);            // spacing 1.0일 때 중심 spacing
  var gap0 = Math.max(10, pitch0 - HW * 2); // 기본 틈 = 남는 공간
  var pitch = HW * 2 + gap0 * gapScale;     // 슬라이더는 틈만 배율로 늘린다
  var total = (N - 1) * pitch + HW * 2;
  var x0 = (W - total) / 2 + HW;
  for (var i = 0; i < N; i++) {
    tiles.push({ x: x0 + i * pitch, a: 0, pa: 0, down: false, hit: false });
  }
  fellVal.textContent = '0';
}

function groundY() { return H - 40; }
// 받침점 — 쓰러지는 방향(오른쪽) 앞 아래모서리
function pivotX(i) { return tiles[i].x + HW; }
// 기울기 a 일 때 윗 앞모서리 위치(받침점 기준 회전)
function topOf(i, a) {
  return { x: pivotX(i) + Math.sin(a) * H2, y: groundY() - Math.cos(a) * H2 };
}

function step(now) {
  var dt = Math.min((now - t0) / 1000, 0.033);
  t0 = now;
  // 자동 시연 푸시 — 첫 조각에 0.26초 사인파 각가속도를 얹는다(사람이 안 만졌을 때만)
  if (push.on) {
    var ph = (now - push.t0) / 260;
    if (ph < 1) tiles[0].pa -= 320 * Math.sin(ph * Math.PI) * dt; // pa 를 깎아 (a - pa) 속도를 얹는다
    else push.on = false;
  }
  var crit = Math.atan2(HW, H2); // 무게중심이 받침점 위로 오는 임계각
  var rest = 1.485;              // 바닥에 거의 눕는 각도
  var fell = 0;
  for (var i = 0; i < N; i++) {
    var t = tiles[i];
    var angacc;
    if (t.a >= crit) {
      t.down = true;
      angacc = 2200 / H2 * Math.sin(t.a + 0.18); // 넘어가는 모멘트 — 갈수록 커진다
    } else {
      angacc = -2600 / H2 * Math.sin(crit - t.a); // 복원 모멘트 — 다시 세워지려는 쪽
    }
    // 각도 Verlet: a += a - pa + angacc·dt²
    var aa = t.a;
    t.a = t.a + (t.a - t.pa) * 0.996 + angacc * dt * dt;
    t.pa = aa;
    if (t.a < 0) { t.a = 0; t.pa = t.a; }            // 바닥 restitution 흡수
    if (t.a > rest) { t.a = rest; t.pa = t.a - (t.pa - t.a) * 0.1; } // 눕고 살짝 튀다 멈춘다
    // 다음 조각에 닿았는가 — 윗 앞모서리가 이번 프레임에 다음 조각 몸통 창을 "지나쳤는가"로 본다.
    // 순간 좌표만 재면 빠르게 쓰러지는 조각은 18px 창을 한 프레임에 건너뛰어 닿았는데도 못 본다
    // (실측: 480px 판에서 첫 조각이 프레임당 60px 를 움직여 연쇄가 아예 안 일어났다).
    // 직전 프레임 모서리는 각도로 되살린다: pa = 직전 a.
    if (i < N - 1 && !tiles[i + 1].hit) {
      var tp = topOf(i, t.a);
      var tpPrev = topOf(i, t.pa);
      var nx = tiles[i + 1].x;
      var topY = groundY() - H2;
      var crossed = tp.x >= nx - HW && tpPrev.x <= nx + HW; // 이번 프레임에 창을 통과했다
      if (crossed && tp.y >= topY) {
        var tipV = (t.a - t.pa) * H2; // 윗모서리의 순간 선속도(px/프레임)
        if (tipV > 0.02) {
          tiles[i + 1].pa -= tipV / H2 * KICK; // 초기 각속도 전달 — 연쇄 트리거
          flash.push({ x: tp.x, y: Math.max(tp.y, topY), t: now });
        }
        tiles[i + 1].hit = true;
      }
    }
    if (t.down) fell++;
  }
  for (var k = flash.length - 1; k >= 0; k--) if (now - flash[k].t > 460) flash.splice(k, 1);
  fellVal.textContent = String(fell);
  // 자동 시연: 전부 쓰러졌면 잠시 뒤 다시 세우고, 다시 밀기 주기가 돌아오면 민다
  if (manual) return;
  if (fell === N) {
    if (!resetAt) resetAt = now + LOOP;
    else if (now > resetAt) { build(); resetAt = 0; }
  } else resetAt = 0;
  if (!push.on && !tiles[0].down && tiles[0].a === 0 && (now - startT) % REDO < 40) {
    push.on = true; push.t0 = now;
  }
  // 첫 바퀴 예외 — 로드 후 200ms 안에 무조건 한 번 민다(위 주기 판정은 페이지 로드 시각과 무관한
  // performance.now() 원점을 쓰므로, 캡처가 시작되기 전에 창이 이미 지나가 버릴 수 있다)
  if (!push.on && !tiles[0].down && !tiles[0].hit && tiles[0].a === 0 && now - startT < 200) {
    push.on = true; push.t0 = now;
  }
}

function draw(now) {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  // 바닥 받침대
  ctx.fillStyle = INK;
  ctx.fillRect(10, groundY(), W - 20, 2);
  // 조각 — 받침점(앞 아래모서리)으로 translate 하고 a 만큼 회전해 두께×높이 사각형을 그린다
  for (var i = 0; i < N; i++) {
    var t = tiles[i];
    ctx.save();
    ctx.translate(pivotX(i), groundY());
    ctx.rotate(t.a);
    ctx.fillStyle = i === 0 ? CHIP2 : CHIP;
    ctx.beginPath();
    ctx.roundRect(-HW * 2, -H2, HW * 2, H2, 4);
    ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 몸통 점 하나 — 회전하는 물체임을 눈으로 보여주는 표지
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(-HW, -H2 + 11, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // 연쇄 전달 하이라이트 — 닿은 자리에서 퍼지는 링
  for (var f = 0; f < flash.length; f++) {
    var age = (now - flash[f].t) / 460;
    ctx.strokeStyle = 'rgba(255,77,31,' + (0.7 * (1 - age)).toFixed(2) + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(flash[f].x, flash[f].y, 5 + age * 22, 0, Math.PI * 2);
    ctx.stroke();
  }
  // 첫 조각 화살표 — 밀어야 할 방향(아직 안 넘어졌고 자동 시연 중일 때)
  if (!tiles[0].down && !manual && tiles[0].a < 0.05) {
    var pv = pivotX(0);
    var b = Math.sin(now / 280) * 3.5;
    ctx.fillStyle = WARN;
    ctx.beginPath();
    ctx.moveTo(pv - 14 + b, groundY() - H2 * 0.55);
    ctx.lineTo(pv - 26 + b, groundY() - H2 * 0.55 - 7);
    ctx.lineTo(pv - 26 + b, groundY() - H2 * 0.55 + 7);
    ctx.closePath();
    ctx.fill();
  }
}

function frame(now) {
  step(now);
  draw(now);
  requestAnimationFrame(frame);
}

// 조작 — 첫 조각을 pointerdown 드래그로 민다. 끈 만큼 꺾이고, 놓는 순간의 변화량이 초기 각속도가 된다
var dragging = false, dragX0 = 0, dragPrevA = 0, dragV = 0, dragT = 0;
field.addEventListener('pointerdown', function (e) {
  var r = field.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  if (Math.abs(x - pivotX(0)) < 70 && y > groundY() - H2 - 46) {
    manual = true;
    dragging = true; dragX0 = x; dragPrevA = tiles[0].a; dragV = 0; dragT = now2();
    field.setPointerCapture(e.pointerId);
  }
});
function now2() { return performance.now(); }
field.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var r = field.getBoundingClientRect();
  var dx = (e.clientX - r.left) - dragX0;
  var target = Math.max(0, Math.min(1.2, dx / 70));
  var t = performance.now();
  var dts = Math.max(0.008, (t - dragT) / 1000);
  dragV = (target - dragPrevA) / dts; // 드래그 각속도(rad/s)
  dragT = t;
  dragPrevA = target;
  tiles[0].a = target;
  tiles[0].pa = target;
  if (reduce.matches && target > 0.30) {
    // reduce — 관성 연쇄 배속은 생략하고 임계를 넘는 순간 즉시 연쇄 시작 속도만 넣는다
    tiles[0].pa -= 5;
    dragging = false;
  }
});
window.addEventListener('pointerup', function () {
  if (!dragging) return;
  dragging = false;
  var kick = Math.max(0, dragV) * 0.30; // 놓는 순간 각속도 → Verlet 프레임 속도 환산
  tiles[0].pa = tiles[0].a - Math.min(kick, 0.09);
});
document.getElementById('reset').addEventListener('click', function () {
  manual = false; resetAt = 0; build();
  push.on = true; push.t0 = performance.now();
});
gapIn.addEventListener('input', function () {
  gapScale = Number(gapIn.value);
  build();
});
window.addEventListener('resize', fit);

fit();
requestAnimationFrame(frame);
</script>
</body>
</html>
