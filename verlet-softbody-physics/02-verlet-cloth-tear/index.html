<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>천 찢어지는 그물 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cl" id="cl">
  <p class="cl__hint">
    <svg class="cl__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M224,128a96,96,0,0,1-96,96c-11.4,0-20-8.6-20-20s8.9-20,20-20a56,56,0,0,0,0-112c-11.1,0-20-8.9-20-20s8.6-20,20-20A96,96,0,0,1,224,128Z" opacity=".2"/><path d="M128,24A104,104,0,0,0,128,232c-15.8,0-28-12.3-28-28s12.4-28,28-28a48,48,0,0,0,0-96c-15.6,0-28-12.4-28-28S112.2,24,128,24Zm0,16c-6.9,0-12,5.2-12,12s5.3,12,12,12a64,64,0,0,1,0,128c-6.7,0-12,5.4-12,12s5.1,12,12,12a88,88,0,0,0,0-176Z"/></g></svg>
    <span>그물코를 잡아 당기면 늘어난 제약이 끊어져 천이 실제로 찢어집니다</span>
  </p>
  <div class="cl__field" id="field" role="application" aria-label="천 찢기 실험판" tabindex="0">
    <canvas class="cl__cv" id="cv"></canvas>
    <b class="cl__badge" aria-hidden="true"><span class="cl__badgeNum" id="ripVal">0</span><span class="cl__badgeUnit">끊어진 제약</span></b>
  </div>
  <div class="cl__bar">
    <label class="cl__dial">찢어짐
      <input type="range" id="tear" min="1" max="10" step="1" value="4" aria-label="제약이 끊기는 늘어남 배수">
    </label>
    <button class="cl__reset" id="reset" type="button">새 천</button>
  </div>
</div>
</main>
<script>
// Verlet 천 — 로프를 가로·세로(＋대각선 보강)로 엮은 제약망이다.
// 점은 위치 기반 Verlet 적분으로 중력을 받고, 이웃 점과의 거리 제약을 여러 번 반복해 푼다.
// 여기에 "임계 늘어남"을 둔다 — 제약이 목표 거리의 N 배(슬라이더)보다 늘어나면 그 제약을 영구히 지운다. 그것이 찢어짐이다.
var root = document.getElementById('cl');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var tearIn = document.getElementById('tear');
var ripVal = document.getElementById('ripVal');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

var ctx = cv.getContext('2d');
var css = getComputedStyle(root);
var INK = css.getPropertyValue('--ink').trim();
var BG = css.getPropertyValue('--bg').trim();
var THREAD = css.getPropertyValue('--thread').trim();
var RIP = css.getPropertyValue('--rip').trim();
var PEG = css.getPropertyValue('--peg').trim();

var COLS = 17, ROWS = 11;     // 천 격자 — 점 187개
var GAP = 0;                  // 격자 간격(판 크기에 맞춰 초기화에서 정한다)
var GRAV = 900;               // 중력(px/s^2)
var DAMP = 0.99;              // 속도 보존률 — 천은 로프보다 공기 저항이 크다
var LOOP = 2;                 // 자동 시연 한 바퀴(초)

var pts = [];                 // 점: {x,y,px,py,pin}
var links = [];               // 제약: {a,b,len,dead}
var torn = 0;                 // 끊어진 제약 수
var dragging = -1;
var W = 0, H = 0, dpr = 1;
var t0 = performance.now();

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  build();
}
function build() {
  pts = []; links = []; torn = 0; ripVal.textContent = '0';
  GAP = Math.min(22, (W - 40) / (COLS - 1), (H - 56) / ROWS);
  var x0 = (W - GAP * (COLS - 1)) / 2, y0 = 26;
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      pts.push({
        x: x0 + c * GAP, y: y0 + r * GAP,
        px: x0 + c * GAP, py: y0 + r * GAP,
        pin: r === 0 && (c % 4 === 0 || c === COLS - 1)   // 윗변 매듭 몇 개를 못 박는다
      });
    }
  }
  var idx = function (r, c) { return r * COLS + c; };
  for (var r2 = 0; r2 < ROWS; r2++) {
    for (var c2 = 0; c2 < COLS; c2++) {
      if (c2 < COLS - 1) links.push({ a: idx(r2, c2), b: idx(r2, c2 + 1), len: GAP, dead: false });
      if (r2 < ROWS - 1) links.push({ a: idx(r2, c2), b: idx(r2 + 1, c2), len: GAP, dead: false });
      // 대각선 보강 — 없으면 격자가 마음대로 접힌다
      if (c2 < COLS - 1 && r2 < ROWS - 1) links.push({ a: idx(r2, c2), b: idx(r2 + 1, c2 + 1), len: GAP * Math.SQRT2, dead: false });
    }
  }
  dragging = -1;
}

// 한 프레임 — 적분 → 제약 반복(이때 늘어난 제약이 끊어진다)
function step(now) {
  var dt = Math.min((now - t0) / 1000, 0.033);
  t0 = now;
  var tear = Number(tearIn.value);

  for (var i = 0; i < pts.length; i++) {
    var p = pts[i];
    if (p.pin || i === dragging) continue;
    var vx = (p.x - p.px) * DAMP;
    var vy = (p.y - p.py) * DAMP;
    p.px = p.x; p.py = p.y;
    p.x += vx;
    p.y += vy + GRAV * dt * dt;
  }
  for (var k = 0; k < 3; k++) {
    for (var j = 0; j < links.length; j++) {
      var L = links[j];
      if (L.dead) continue;
      var a = pts[L.a], b = pts[L.b];
      var dx = b.x - a.x, dy = b.y - a.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      // 찢어짐 판정 — 목표 거리의 tear 배만큼 늘어난 제약은 영구히 끊는다
      if (d > L.len * tear) {
        L.dead = true; torn++;
        ripVal.textContent = String(torn);
        continue;
      }
      var off = (d - L.len) / d * 0.5;
      var ax = dx * off, ay = dy * off;
      var aFree = !a.pin && L.a !== dragging;
      var bFree = !b.pin && L.b !== dragging;
      if (aFree && bFree) { a.x += ax; a.y += ay; b.x -= ax; b.y -= ay; }
      else if (aFree) { a.x += ax * 2; a.y += ay * 2; }
      else if (bFree) { b.x -= ax * 2; b.y -= ay * 2; }
    }
  }
  if (dragging >= 0) { pts[dragging].x = dragX; pts[dragging].y = dragY; }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round';
  // 산 제약(끊긴 실)을 먼저 그린다 — 찢어진 자국이 된다
  ctx.strokeStyle = RIP;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (var j = 0; j < links.length; j++) {
    var L = links[j];
    if (!L.dead) continue;
    ctx.moveTo(pts[L.a].x, pts[L.a].y);
    ctx.lineTo(pts[L.b].x, pts[L.b].y);
  }
  ctx.stroke();
  // 살아 있는 천 — 살아있는 제약을 두 겹으로 엮는다
  ctx.strokeStyle = INK;
  ctx.lineWidth = 4;
  ctx.beginPath();
  for (var j2 = 0; j2 < links.length; j2++) {
    var L2 = links[j2];
    if (L2.dead) continue;
    ctx.moveTo(pts[L2.a].x, pts[L2.a].y);
    ctx.lineTo(pts[L2.b].x, pts[L2.b].y);
  }
  ctx.stroke();
  ctx.strokeStyle = THREAD;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (var j3 = 0; j3 < links.length; j3++) {
    var L3 = links[j3];
    if (L3.dead) continue;
    ctx.moveTo(pts[L3.a].x, pts[L3.a].y);
    ctx.lineTo(pts[L3.b].x, pts[L3.b].y);
  }
  ctx.stroke();
  // 못 박은 핀
  ctx.fillStyle = PEG;
  for (var i = 0; i < pts.length; i++) {
    if (!pts[i].pin) continue;
    ctx.beginPath();
    ctx.arc(pts[i].x, pts[i].y, 3.4, 0, Math.PI * 2);
    ctx.fill();
  }
}

// 사람이 안 만졌을 때 도는 자동 시연 — 가상 포인터가 아랫변 한 점을 천천히 아래로 끈다가 놓는다.
// 당기는 힘이 제약을 임계까지 늘려 찢어짐이 저절로 일어나게 한다.
var manual = false;
function demoPull(now) {
  var ph = ((now / 1000) % LOOP) / LOOP;      // 0~1
  var t = ph < 0.62 ? ph / 0.62 : 1;          // 62% 까지 당기고 이후 놓는다
  var idx = (ROWS - 1) * COLS + Math.floor(COLS * 0.5);
  var ease = t * t;                            // 당기는 속도가 점점 붙는다
  return { idx: idx, y: 26 + (ROWS - 1) * GAP + ease * (H - 56 - (ROWS - 1) * GAP), x: 0 };
}
function frame(now) {
  if (!manual) {
    var d = demoPull(now);
    pts[d.idx].x = d.x || pts[d.idx].x;
    pts[d.idx].y = d.y;
    pts[d.idx].px = pts[d.idx].x;
    pts[d.idx].py = pts[d.idx].y;
  }
  step(now);
  draw();
  requestAnimationFrame(frame);
}

// 조작 — 아무 점이나 잡아 당긴다. 잡은 점은 제약에서 손으로 고정된 취급
var dragX = 0, dragY = 0;
function pick(x, y) {
  var best = -1, bd = 20;
  for (var i = 0; i < pts.length; i++) {
    var d = Math.hypot(pts[i].x - x, pts[i].y - y);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
field.addEventListener('pointerdown', function (e) {
  var r = field.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  dragging = pick(x, y);
  if (dragging < 0) return;
  manual = true;
  dragX = x; dragY = y;
  field.setPointerCapture(e.pointerId);
  if (reduce.matches) {
    pts[dragging].x = x; pts[dragging].y = y;
    pts[dragging].px = x; pts[dragging].py = y;
  }
});
field.addEventListener('pointermove', function (e) {
  if (dragging < 0) return;
  var r = field.getBoundingClientRect();
  dragX = Math.max(2, Math.min(W - 2, e.clientX - r.left));
  dragY = Math.max(2, Math.min(H - 2, e.clientY - r.top));
  if (reduce.matches) { pts[dragging].x = dragX; pts[dragging].y = dragY; pts[dragging].px = dragX; pts[dragging].py = dragY; }
});
window.addEventListener('pointerup', function () { dragging = -1; });
document.getElementById('reset').addEventListener('click', function () { manual = false; build(); });
window.addEventListener('resize', fit);

fit();
requestAnimationFrame(frame);
</script>
</body>
</html>
