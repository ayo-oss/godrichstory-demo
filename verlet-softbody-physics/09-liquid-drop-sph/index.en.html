<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>튀는 액체 방울 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lq" id="lq">
  <p class="lq__hint">
    <svg class="lq__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M224,128a96,96,0,0,1-96,96c-11.4,0-20-8.6-20-20s8.9-20,20-20a56,56,0,0,0,0-112c-11.1,0-20-8.9-20-20s8.6-20,20-20A96,96,0,0,1,224,128Z" opacity=".2"/><path d="M128,24A104,104,0,0,0,128,232c-15.8,0-28-12.3-28-28s12.4-28,28-28a48,48,0,0,0,0-96c-15.6,0-28-12.4-28-28S112.2,24,128,24Zm0,16c-6.9,0-12,5.2-12,12s5.3,12,12,12a64,64,0,0,1,0,128c-6.7,0-12,5.4-12,12s5.1,12,12,12a88,88,0,0,0,0-176Z"/></g></svg>
    <span>Each particle reads neighbor density and pushes back when packed — the drop clumps, splits, and clumps again</span>
  </p>
  <div class="lq__field" id="field" role="application" aria-label="Liquid droplet experiment board" tabindex="0">
    <canvas class="lq__cv" id="cv"></canvas>
    <b class="lq__badge" aria-hidden="true"><span class="lq__badgeNum" id="denVal">100</span><span class="lq__badgeUnit">avg density %</span></b>
  </div>
  <div class="lq__bar">
    <label class="lq__dial">pressure
      <input type="range" id="press" min="1" max="10" step="1" value="4" aria-label="pressure strength">
    </label>
    <button class="lq__reset" id="reset" type="button">Reset</button>
  </div>
</div>
</main>
<script>
// 액체 방울 — SPH(평활입자동역학) 근사. 로프·천이 "거리 제약"으로 물성을 만들었다면
// 이쪽은 "밀도와 pressure"으로 만든다: 입자마다 이웃 반경 h 안의 입자로 지역 밀도를 계산하고(커널 w = 1 - r/h),
// 목표 밀도 ρ0 보다 높으면 이웃쌍에 밀어내는 pressure 힘을 준다. 점성(상대속도 감쇠)과 표면장력 근사(가장자리 입자를
// 이웃 무게중심으로 당김)를 얹으면 방울이 뭉쳤다 갈라졌다 다시 뭉치는 액체의 결이 나온다.
var root = document.getElementById('lq');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var pressIn = document.getElementById('press');
var denVal = document.getElementById('denVal');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

var ctx = cv.getContext('2d');
var css = getComputedStyle(root);
var BG = css.getPropertyValue('--bg').trim();
var GLOW = css.getPropertyValue('--glow').trim();
var SHEEN = css.getPropertyValue('--sheen').trim();
var WALL = css.getPropertyValue('--wall').trim();
var FONT = '-apple-system, "Segoe UI", "Noto Sans KR", sans-serif';

var N = 120;                  // 입자 수
var H = 0;                    // 이웃 반경(입자 간격의 ~1.8배, 초기화에서 정한다)
var GRAV = 1400;              // 중력(px/s^2)
var DAMP = 0.992;             // 속도 보존률(점성 저항)
var REST = 0.32;              // 벽 restitution 계수
var LOOP = 2;                 // 자동 시연 한 바퀴(초)

var ps = [];                  // 입자: {x,y,px,py}
var W = 0, Hh = 0, dpr = 1;
var t0 = performance.now();
var frameCount = 0;

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; Hh = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(Hh * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  build();
}
// 시작 장면 — 보울 중앙 위에 원반 모양 방울이 살짝 흩어져 떨어진다. 난수 없이 격자+지터로 결정적 배치
function build() {
  ps = [];
  var gap = Math.min(11, Math.sqrt((W * Hh * 0.10) / N));   // 부피 비중 ~10%
  H = gap * 1.8;
  var cols = Math.ceil(Math.sqrt(N * (W / Hh)));
  var x0 = W * 0.5 - (cols - 1) * gap * 0.5;
  var y0 = 18;
  for (var i = 0; i < N; i++) {
    var c = i % cols, r = Math.floor(i / cols);
    var jx = Math.sin(i * 12.9898) * 0.30 * gap;   // 결정적 지터 — Math.random 금지
    var jy = Math.cos(i * 78.233) * 0.30 * gap;
    var x = Math.max(6, Math.min(W - 6, x0 + c * gap + jx));
    var y = y0 + r * gap + jy;
    ps.push({ x: x, y: y, px: x, py: y });
  }
}

// 메타볼 근사 그라디언트 — 매 프레임 만들면 느리니 두 개 미리 구워 translate 로 찍는다
var gradA = null, gradB = null;
function bakeGrads() {
  var R = H * 1.5;
  gradA = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
  gradA.addColorStop(0, GLOW);
  gradA.addColorStop(1, 'rgba(0,0,0,0)');
  gradB = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
  gradB.addColorStop(0, SHEEN);
  gradB.addColorStop(1, 'rgba(0,0,0,0)');
}

// 한 프레임 — 적분 → 밀도 → pressure·점성·표면장력 → 벽
function step(now) {
  var dt = Math.min((now - t0) / 1000, 0.033);
  t0 = now;
  var k = Number(pressIn.value);
  var h2 = H * H;

  // (1) Verlet 관성 + 중력
  for (var i = 0; i < N; i++) {
    var p = ps[i];
    var vx = (p.x - p.px) * DAMP;
    var vy = (p.y - p.py) * DAMP;
    p.px = p.x; p.py = p.y;
    p.x += vx;
    p.y += vy + GRAV * dt * dt;
  }
  // (2) 지역 밀도 — 이웃 반경 h 안 입자의 커널 w = 1 - r/h 합
  //     O(N²) 이지만 N=120 이라 프레임당 14,400 쌍 — 충분히 가볍다
  var dens = new Float64Array(N);
  var nbr = [];               // 이웃 목록(pressure·점성·표면장력에서 다시 쓴다)
  for (var a = 0; a < N; a++) nbr.push([]);
  for (var a2 = 0; a2 < N; a2++) {
    for (var b = a2 + 1; b < N; b++) {
      var dx = ps[b].x - ps[a2].x, dy = ps[b].y - ps[a2].y;
      var d2 = dx * dx + dy * dy;
      if (d2 >= h2) continue;
      var d = Math.sqrt(d2) || 0.0001;
      var w = 1 - d / H;
      dens[a2] += w; dens[b] += w;
      nbr[a2].push(b); nbr[b].push(a2);
    }
  }
  var RHO0 = 5.5;             // 목표 밀도 — 이 커널에서 안정 방울이 갖는 밀도(실측 튜닝값)
  // (3) 이웃쌍 힘 — pressure(밀어내기)·점성(상대속도 감쇠)·표면장력(가장자리 당김)
  //     짝수 분배: 쌍 한 번만 돌고 힘은 양쪽에 나눠 넣는다
  for (var i2 = 0; i2 < N; i2++) {
    var me = ps[i2];
    var list = nbr[i2];
    var cx = 0, cy = 0;       // 이웃 무게중심(표면장력용)
    for (var t = 0; t < list.length; t++) {
      var j2 = list[t];
      if (j2 < i2) continue;                       // 쌍은 한 번만
      var o = ps[j2];
      var ddx = o.x - me.x, ddy = o.y - me.y;
      var dd = Math.hypot(ddx, ddy) || 0.0001;
      var ux = ddx / dd, uy = ddy / dd;
      var wj = 1 - dd / H;
      // pressure: 쌍 평균 밀도가 목표보다 높은 만큼 밀어낸다
      var press = ((dens[i2] + dens[j2]) * 0.5 - RHO0) * wj * k * 0.0021;
      if (press > 0) {
        var fx = -ux * press, fy = -uy * press;
        me.x += fx; me.y += fy; o.x -= fx; o.y -= fy;
      }
      // 점성: 상대속도를 조금씩 깎아 흐름을 무디게(물이 아닌 꿀 느낌 방지용 상한)
      var rvx = (o.x - o.px) - (me.x - me.px);
      var rvy = (o.y - o.py) - (me.y - me.py);
      var visc = 0.028 * wj;
      me.x += rvx * visc; me.y += rvy * visc;
      o.x -= rvx * visc; o.y -= rvy * visc;
    }
    if (list.length > 0) {
      for (var t2 = 0; t2 < list.length; t2++) {
        cx += ps[list[t2]].x; cy += ps[list[t2]].y;
      }
      cx /= list.length; cy /= list.length;
      // 표면장력 근사 — 이웃이 적은(=표면) 입자를 이웃 무게중심 방향으로 당긴다
      if (list.length < 4) {
        var tx = cx - me.x, ty = cy - me.y;
        var tl = Math.hypot(tx, ty) || 0.0001;
        var pull = (4 - list.length) * 0.010;
        me.x += tx / tl * pull; me.y += ty / tl * pull;
      }
    }
  }
  // (4) 용기 — 바닥·양벽 반사(사각 보울). 커서 밀기는 (5)에서
  for (var v = 0; v < N; v++) {
    var q = ps[v];
    if (q.y > Hh - 4) { q.y = Hh - 4; q.py = q.y + (q.y - q.py) * REST; }
    if (q.x < 4) { q.x = 4; q.px = q.x + (q.x - q.px) * REST; }
    if (q.x > W - 4) { q.x = W - 4; q.px = q.x + (q.x - q.px) * REST; }
  }
  // (5) 커서 밀기 — 드래그 중이면 커서 주변 입자를 거리 감쇠 힘으로 밀어낸다. 저으면 구멍이 생기고 주변이 메운다
  if (ptrDown) {
    for (var m = 0; m < N; m++) {
      var s = ps[m];
      var ox = s.x - ptrX, oy = s.y - ptrY;
      var od = Math.hypot(ox, oy);
      var RAD = H * 3.2;
      if (od < RAD && od > 0.001) {
        var f = (1 - od / RAD) * 7;
        s.x += ox / od * f; s.y += oy / od * f;
      }
    }
  }
  // (6) 배지 — 평균 밀도를 목표 밀도에 대한 % 로
  frameCount++;
  if (frameCount % 12 === 0) {
    var sum = 0;
    for (var s2 = 0; s2 < N; s2++) sum += dens[s2];
    denVal.textContent = String(Math.round(sum / N / RHO0 * 100));
  }
}

function draw() {
  ctx.clearRect(0, 0, W, Hh);
  // 용기 벽 — 보울 테두리 선
  ctx.strokeStyle = WALL;
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, Hh - 2);
  // 입자 — 미리 구운 radialGradient 원을 translate 로 겹쳐 찍는다(메타볼 근사).
  // 두 겹: 몸통(glow) + 하이라이트(sheen). 가벼운 입자를 깊게 얹어 덩어리 중심이 진해진다
  if (!gradA) bakeGrads();
  var R = H * 1.5;
  for (var i = 0; i < N; i++) {
    ctx.save();
    ctx.translate(ps[i].x, ps[i].y);
    ctx.fillStyle = gradA;
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = gradB;
    ctx.beginPath();
    ctx.arc(-R * 0.22, -R * 0.28, R * 0.62, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  // 커서 밀기 표시 — 드래그 중 반지름 원
  if (ptrDown) {
    ctx.strokeStyle = GLOW;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(ptrX, ptrY, H * 3.2, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// 사람이 안 만졌을 때 도는 자동 시연 — 가상 포인터가 사인 팔자로 휘젓는다(01 demoTarget 관례).
// pointerdown 이 오면 manual=true 로 넘어가 진짜 포인터를 따라간다.
var manual = false;
function demoTarget(now) {
  var ph = (now / 1000) / LOOP * Math.PI * 2;
  return {
    x: W * 0.5 + Math.sin(ph) * W * 0.32,
    y: Hh * 0.5 + Math.sin(ph * 2) * Hh * 0.30
  };
}
function frame(now) {
  if (!manual) {
    var t = demoTarget(now);
    ptrX = t.x; ptrY = t.y; ptrDown = true;
  }
  step(now);
  draw();
  requestAnimationFrame(frame);
}

// 조작 — pointerdown 드래그로 커서 주변 입자를 밀어낸다
var ptrDown = false, ptrX = 0, ptrY = 0;
field.addEventListener('pointerdown', function (e) {
  manual = true;
  ptrDown = true;
  var r = field.getBoundingClientRect();
  ptrX = e.clientX - r.left; ptrY = e.clientY - r.top;
  field.setPointerCapture(e.pointerId);
});
field.addEventListener('pointermove', function (e) {
  if (!ptrDown) return;
  var r = field.getBoundingClientRect();
  ptrX = e.clientX - r.left; ptrY = e.clientY - r.top;
});
window.addEventListener('pointerup', function () { ptrDown = false; });
document.getElementById('reset').addEventListener('click', function () { manual = false; build(); });
window.addEventListener('resize', function () { fit(); gradA = null; });
// 줄인 모션 — 자동 시연을 끄고 한 장만 그린다(01 관례). 조작은 즉시 반영
reduce.addEventListener('change', function () { if (reduce.matches) { manual = true; ptrDown = false; draw(); } });
if (reduce.matches) { manual = true; ptrDown = false; }

fit();
requestAnimationFrame(frame);
</script>
</body>
</html>
