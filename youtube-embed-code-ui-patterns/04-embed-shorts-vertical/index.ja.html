<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세로형 임베드 프레임 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<canvas class="bg" id="bg" width="480" height="300" aria-hidden="true"></canvas>
<section class="panel">
  <div class="frameWrap">
    <div class="frame" id="frame">
      <canvas class="thumb" id="thumb" width="120" height="213"></canvas>
      <div class="playBtn" role="button" aria-label="再生">
        <span class="playShape" aria-hidden="true"></span>
      </div>
      <div class="captionBar">
        <span class="captionText">縦型動画 9:16</span>
      </div>
    </div>
  </div>
  <div class="readout" id="readout">余白 148px · ぼかし 17px</div>
</section>
</main>
<script>
// 세로형 임베드 프레임(04) — 프레임 폭이 숨쉬듯 늘고 줄면, 남는 스테이지 폭만큼
// 뒤 배경이 흐려진다(초점이 앞으로 온 느낌). 실키·실서버 요청 없음 — 자동 再生 시나리오.
(function () {
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function drawSeedThumb(canvas, seed) {
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    var rnd = mulberry32(seed);
    var w = canvas.width, h = canvas.height;
    var hues = [216, 32, 268, 168];
    ctx.fillStyle = 'hsl(' + hues[Math.floor(rnd() * hues.length)] + ', 38%, 22%)';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 6; i++) {
      var cx = rnd() * w, cy = rnd() * h, r = (0.18 + rnd() * 0.3) * Math.min(w, h);
      ctx.fillStyle = 'hsla(' + hues[Math.floor(rnd() * hues.length)] + ', ' + (44 + rnd() * 22).toFixed(1) + '%, ' + (38 + rnd() * 26).toFixed(1) + '%, .5)';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255, 247, 230, .06)';
    for (var j = 0; j < h; j += 4) ctx.fillRect(0, j, w, 1);
  }

  var stageEl = document.querySelector('.stage');
  var bgEl = document.getElementById('bg');
  var thumbEl = document.getElementById('thumb');
  var frameEl = document.getElementById('frame');
  var readoutEl = document.getElementById('readout');
  if (!stageEl || !bgEl || !thumbEl || !frameEl || !readoutEl) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  drawSeedThumb(bgEl, 104);
  drawSeedThumb(thumbEl, 140);

  var CYCLE_MS = 2000;
  var BG_BLUR_PX = 8;
  // 폭 밑값·진폭은 scss 커스텀 프로퍼티에서 프레임마다 다시 읽는다 — 320px 미디어쿼리가 값을 낮추는데
  // 시작 폭에서 한 번만 캡처하면 뷰포트가 줄어도 큰 값이 남아 BD9 가 깨진다(04 실측 2026-09-19: 134×238px → 289px).
  var frameWrapEl = frameEl.parentElement;

  function apply(t) {
    var frameWrapStyle = getComputedStyle(frameWrapEl);
    var BASE_FW = parseFloat(frameWrapStyle.getPropertyValue('--base-fw')) || 118;
    var AMP_FW = parseFloat(frameWrapStyle.getPropertyValue('--amp-fw')) || 16;
    var fw = BASE_FW + AMP_FW * Math.sin(2 * Math.PI * t / CYCLE_MS);
    frameEl.style.width = fw.toFixed(1) + 'px';
    // 계산 겹: 남는 스테이지 폭 → 배경 흐림 강도. 프레임이 커질수록 뒤 배경은 덜 흐리다.
    var leftover = stageEl.clientWidth - frameEl.getBoundingClientRect().width;
    var blur = BG_BLUR_PX + leftover / 14;
    bgEl.style.filter = 'blur(' + blur.toFixed(1) + 'px)';
    readoutEl.textContent = '余白 ' + Math.round(leftover) + 'px · ぼかし ' + blur.toFixed(1) + 'px';
  }

  if (reduce) {
    apply(0);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
