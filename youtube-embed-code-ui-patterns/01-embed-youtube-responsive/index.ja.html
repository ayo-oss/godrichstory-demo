<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반응형 영상 프레임 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="frame" id="frame">
    <canvas class="thumb" id="thumb" width="320" height="180" aria-hidden="true"></canvas>
    <div class="playBtn" role="button" aria-label="再生">
      <svg class="playIcon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="7,4 20,12 7,20"></polygon></svg>
    </div>
    <div class="scrim">
      <span class="scrimTitle">埋め込み動画プレビュー</span>
      <span class="scrimChannel">Channel A</span>
    </div>
  </div>
  <div class="readout" id="readout">16:9 · 200 × 113px</div>
</section>
</main>
<script>
// 반응형 영상 프레임(01) — 폭을 sin 파형으로 바꾸면 aspect-ratio 가 세로를 다시 계산하고,
// 그 실측 높이를 매 프레임 getBoundingClientRect 로 읽어 리드아웃에 반영한다.
// 계산 겹: 폭 → 비율 재계산 → 실측 읽기 (transform·opacity 만 쓰는 원칙의 의도적 예외).
// 실키·실서버 요청 없음 — 폭 궤적은 고정 시나리오로 자동 재생한다.
(function () {
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function drawSeedThumb(canvas, seed) {
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    var rnd = mulberry32(seed);
    var w = canvas.width, h = canvas.height;
    var hues = [216, 32, 268, 168];
    ctx.fillStyle = 'hsl(' + hues[Math.floor(rnd() * hues.length)] + ', 38%, 22%)';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 6; i++) {
      var cx = rnd() * w, cy = rnd() * h, r = (0.18 + rnd() * 0.3) * Math.min(w, h);
      ctx.fillStyle = 'hsla(' + hues[Math.floor(rnd() * hues.length)] + ', ' + (44 + rnd() * 22).toFixed(1) + '%, ' + (38 + rnd() * 26).toFixed(1) + '%, .5)';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255, 247, 230, .06)';
    for (var j = 0; j < h; j += 4) ctx.fillRect(0, j, w, 1);
  }

  var frameEl = document.getElementById('frame');
  var thumbEl = document.getElementById('thumb');
  var readoutEl = document.getElementById('readout');
  if (!frameEl || !thumbEl || !readoutEl) return;

  drawSeedThumb(thumbEl, 101);

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var narrow = window.matchMedia('(max-width: 340px)').matches;
  var CYCLE_MS = 2000;
  var BASE = narrow ? 140 : 200;
  var RANGE = narrow ? 36 : 56;

  function apply(t) {
    var w = BASE + RANGE * Math.sin(2 * Math.PI * t / CYCLE_MS);
    frameEl.style.width = w.toFixed(1) + 'px';
    var rect = frameEl.getBoundingClientRect();
    readoutEl.textContent = '16:9 · ' + Math.round(w) + ' × ' + Math.round(rect.height) + 'px';
  }

  apply(0);

  if (reduce) return;

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
