<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사각 카드 임베드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="card">
  <div class="topBar">
    <canvas class="avatar" id="avatar" width="64" height="64"></canvas>
    <span class="handle">channel.a</span>
    <span class="follow">팔로우</span>
  </div>
  <div class="slot" id="slot">
    <div class="shimmer" id="shimmer" aria-hidden="true"></div>
  </div>
  <div class="bottomRow">
    <svg class="heartIcon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor">
      <path d="M232 102c0 66-104 122-104 122S24 168 24 102a54 54 0 0 1 54-54c22.59 0 41.94 12.31 50 32c8.06-19.69 27.41-32 50-32a54 54 0 0 1 54 54" opacity=".2"/>
      <path d="M178 40c-20.65 0-38.73 8.88-50 23.89C116.73 48.88 98.65 40 78 40a62.07 62.07 0 0 0-62 62c0 70 103.79 126.66 108.21 129a8 8 0 0 0 7.58 0C136.21 228.66 240 172 240 102a62.07 62.07 0 0 0-62-62m-50 174.8c-18.26-10.64-96-59.11-96-112.8a46.06 46.06 0 0 1 46-46c19.45 0 35.78 10.36 42.6 27a8 8 0 0 0 14.8 0c6.82-16.67 23.15-27 42.6-27a46.06 46.06 0 0 1 46 46c0 53.61-77.76 102.15-96 112.8"/>
    </g></svg>
    <span class="likeLabel">좋아요 128</span>
    <span class="caption">새 게시물 미리보기</span>
  </div>
</div>
<div class="readout" id="readout">각도 214°</div>
</main>
<script>
// 사각 카드 임베드(06) — 이미지 자리는 각도가 도는 그라디언트(계산 겹)로 채우고,
// 그 위를 옅은 띠(shimmer)가 가로질러 로딩 느낌을 더한다. 실키·실서버 요청 없음.
(function () {
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function drawSeedThumb(canvas, seed) {
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    var rnd = mulberry32(seed);
    var w = canvas.width, h = canvas.height;
    var hues = [216, 32, 268, 168];
    ctx.fillStyle = 'hsl(' + hues[Math.floor(rnd() * hues.length)] + ', 38%, 22%)';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 6; i++) {
      var cx = rnd() * w, cy = rnd() * h, r = (0.18 + rnd() * 0.3) * Math.min(w, h);
      ctx.fillStyle = 'hsla(' + hues[Math.floor(rnd() * hues.length)] + ', ' + (44 + rnd() * 22).toFixed(1) + '%, ' + (38 + rnd() * 26).toFixed(1) + '%, .5)';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255, 247, 230, .06)';
    for (var j = 0; j < h; j += 4) ctx.fillRect(0, j, w, 1);
  }

  var avatarEl = document.getElementById('avatar');
  var slotEl = document.getElementById('slot');
  var shimmerEl = document.getElementById('shimmer');
  var readoutEl = document.getElementById('readout');
  if (!avatarEl || !slotEl || !shimmerEl || !readoutEl) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  drawSeedThumb(avatarEl, 106);

  var CYCLE_MS = 2000;

  function apply(t) {
    // 계산 겹: 경과 시간 비율 → 그라디언트 회전각(0~360도)
    var angle = Math.floor((t / CYCLE_MS) * 360);
    slotEl.style.setProperty('--spin', angle + 'deg');

    var prog = t / CYCLE_MS;
    var sweep = -30 + prog * 160;
    shimmerEl.style.transform = 'translateX(' + sweep.toFixed(1) + '%)';

    readoutEl.textContent = '각도 ' + angle + '°';
  }

  if (reduce) {
    apply(0);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
