<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인용 게시물 임베드 카드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="card" id="card">
    <div class="frameLine" aria-hidden="true"></div>
    <div class="avatarRow">
      <canvas class="avatar" id="avatar" width="32" height="32" aria-hidden="true"></canvas>
      <div class="who">
        <span class="name">Channel A</span>
        <span class="handle">@channel_a</span>
      </div>
    </div>
    <p class="quoteBody">임베드로 가져온 인용 문장이 이 자리에 들어갑니다.</p>
    <p class="meta">오후 2:14 · 인용됨</p>
  </div>
  <div class="readout" id="readout" aria-live="polite">
    <span class="readoutLabel">테두리 밝기</span>
    <span class="readoutValue" id="glowValue">50%</span>
  </div>
</section>
</main>
<script>
// 인용 게시물 임베드(07) — 카드 테두리 발광 강도를 매 프레임 사인파로 다시 계산해
// CSS 변수로 주입한다. 실키·실서버 요청 없음, 리스너 없음(자동 재생만).
(function () {
  var cardEl = document.getElementById('card');
  var avatarEl = document.getElementById('avatar');
  var glowValueEl = document.getElementById('glowValue');
  if (!cardEl || !avatarEl || !glowValueEl) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var CYCLE_MS = 2000;
  var GLOW_MS = 900;

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function drawSeedThumb(canvas, seed) {
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    var rnd = mulberry32(seed);
    var w = canvas.width, h = canvas.height;
    var hues = [216, 32, 268, 168];
    ctx.fillStyle = 'hsl(' + hues[Math.floor(rnd() * hues.length)] + ', 38%, 22%)';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 6; i++) {
      var cx = rnd() * w, cy = rnd() * h, r = (0.18 + rnd() * 0.3) * Math.min(w, h);
      ctx.fillStyle = 'hsla(' + hues[Math.floor(rnd() * hues.length)] + ', ' + (44 + rnd() * 22).toFixed(1) + '%, ' + (38 + rnd() * 26).toFixed(1) + '%, .5)';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255, 247, 230, .06)';
    for (var j = 0; j < h; j += 4) ctx.fillRect(0, j, w, 1);
  }

  drawSeedThumb(avatarEl, 107);

  // 계산 겹: 테두리 밝기를 사인파로 매 프레임 재계산해 --glow 로 주입, opacity 로 맥동시킨다
  function apply(t) {
    var glow = 0.5 + 0.5 * Math.sin(2 * Math.PI * t / GLOW_MS);
    cardEl.style.setProperty('--glow', glow.toFixed(3));
    glowValueEl.textContent = Math.round(glow * 100) + '%';
  }

  if (reduce) {
    apply(0);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
