<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세로형 카드 임베드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="card">
  <div class="left">
    <div class="thumbWrap" id="thumbWrap">
      <canvas class="thumb" id="thumb" width="132" height="176"></canvas>
      <div class="flash" id="flash" aria-hidden="true"></div>
      <div class="burst" id="burst" aria-hidden="true">
        <svg class="burstIcon" viewBox="0 0 256 256"><g fill="currentColor">
          <path d="M232 102c0 66-104 122-104 122S24 168 24 102a54 54 0 0 1 54-54c22.59 0 41.94 12.31 50 32c8.06-19.69 27.41-32 50-32a54 54 0 0 1 54 54" opacity=".2"/>
          <path d="M178 40c-20.65 0-38.73 8.88-50 23.89C116.73 48.88 98.65 40 78 40a62.07 62.07 0 0 0-62 62c0 70 103.79 126.66 108.21 129a8 8 0 0 0 7.58 0C136.21 228.66 240 172 240 102a62.07 62.07 0 0 0-62-62m-50 174.8c-18.26-10.64-96-59.11-96-112.8a46.06 46.06 0 0 1 46-46c19.45 0 35.78 10.36 42.6 27a8 8 0 0 0 14.8 0c6.82-16.67 23.15-27 42.6-27a46.06 46.06 0 0 1 46 46c0 53.61-77.76 102.15-96 112.8"/>
        </g></svg>
      </div>
    </div>
    <p class="caption">@channelA · 오리지널 사운드</p>
  </div>
  <div class="rail">
    <div class="heartWrap" id="heartWrap">
      <svg class="heartIcon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor">
        <path d="M232 102c0 66-104 122-104 122S24 168 24 102a54 54 0 0 1 54-54c22.59 0 41.94 12.31 50 32c8.06-19.69 27.41-32 50-32a54 54 0 0 1 54 54" opacity=".2"/>
        <path d="M178 40c-20.65 0-38.73 8.88-50 23.89C116.73 48.88 98.65 40 78 40a62.07 62.07 0 0 0-62 62c0 70 103.79 126.66 108.21 129a8 8 0 0 0 7.58 0C136.21 228.66 240 172 240 102a62.07 62.07 0 0 0-62-62m-50 174.8c-18.26-10.64-96-59.11-96-112.8a46.06 46.06 0 0 1 46-46c19.45 0 35.78 10.36 42.6 27a8 8 0 0 0 14.8 0c6.82-16.67 23.15-27 42.6-27a46.06 46.06 0 0 1 46 46c0 53.61-77.76 102.15-96 112.8"/>
      </g></svg>
    </div>
    <span class="likeCount" id="likeCount">1,247</span>
    <span class="railLabel">좋아요</span>
  </div>
</div>
<div class="readout" id="readout">간격 0.4초 · 좋아요 1,247</div>
</main>
<script>
// 세로형 카드 임베드(05) — 좋아요는 상수 간격마다 계단으로 오르고, 오른 순간 하트가 튕긴다.
// 엄지가 두 번 두드릴 때 나오는 큰 하트도 같은 간격으로 썸네일 위에서 커지며 사라진다.
// 실키·실서버 요청 없음 — 좌표·수치는 고정 시나리오로 자동 재생한다.
(function () {
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function drawSeedThumb(canvas, seed) {
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    var rnd = mulberry32(seed);
    var w = canvas.width, h = canvas.height;
    var hues = [216, 32, 268, 168];
    ctx.fillStyle = 'hsl(' + hues[Math.floor(rnd() * hues.length)] + ', 38%, 22%)';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 6; i++) {
      var cx = rnd() * w, cy = rnd() * h, r = (0.18 + rnd() * 0.3) * Math.min(w, h);
      ctx.fillStyle = 'hsla(' + hues[Math.floor(rnd() * hues.length)] + ', ' + (44 + rnd() * 22).toFixed(1) + '%, ' + (38 + rnd() * 26).toFixed(1) + '%, .5)';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255, 247, 230, .06)';
    for (var j = 0; j < h; j += 4) ctx.fillRect(0, j, w, 1);
  }

  var thumbEl = document.getElementById('thumb');
  var flashEl = document.getElementById('flash');
  var burstEl = document.getElementById('burst');
  var heartWrapEl = document.getElementById('heartWrap');
  var likeCountEl = document.getElementById('likeCount');
  var readoutEl = document.getElementById('readout');
  if (!thumbEl || !flashEl || !burstEl || !heartWrapEl || !likeCountEl || !readoutEl) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  drawSeedThumb(thumbEl, 105);

  var CYCLE_MS = 2000;
  var LIKE_INTERVAL = 400;
  var LIKE_STEP = 3;
  var LIKE_BASE = 1247;

  function apply(t) {
    // 계산 겹: 간격마다 좋아요 수를 다시 계산 — 트윈이 아니라 계단식 카운터
    var likes = LIKE_BASE + Math.floor(t / LIKE_INTERVAL) * LIKE_STEP;
    var since = t % LIKE_INTERVAL;
    var pop = since < 180 ? 1 + 0.28 * (1 - since / 180) : 1;
    heartWrapEl.style.transform = 'scale(' + pop.toFixed(3) + ')';
    likeCountEl.textContent = likes.toLocaleString('en-US');
    readoutEl.textContent = '간격 ' + (LIKE_INTERVAL / 1000).toFixed(1) + '초 · 좋아요 ' + likes.toLocaleString('en-US');

    // 두 번 두드림 하트 — 같은 간격에서 0→1로 커지며 옅어진다(썸네일 위 큰 겹)
    var prog = since / LIKE_INTERVAL;
    var burstScale = 0.3 + prog * 2.3;
    var burstOpacity = Math.max(0, 0.85 * (1 - prog * 1.15));
    burstEl.style.transform = 'translate(-50%, -50%) scale(' + burstScale.toFixed(3) + ')';
    burstEl.style.opacity = burstOpacity.toFixed(3);

    // 좋아요가 오르는 순간 썸네일 전체가 짧게 밝아진다(플래시) — 하트 겹과 같은 since 를 공유
    var flashOpacity = since < 160 ? 0.4 * (1 - since / 160) : 0;
    flashEl.style.opacity = flashOpacity.toFixed(3);
  }

  if (reduce) {
    apply(0);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
