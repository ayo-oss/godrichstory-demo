<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클릭으로 불러오는 지연 임베드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="card" id="card">
    <div class="placeholder" id="placeholder" role="button" tabindex="0" aria-label="再生項目を読み込む" aria-pressed="false">
      <span class="playIcon" aria-hidden="true"></span>
      <span class="phLabel">押して読み込む</span>
      <span class="phSub">約0.5MB節約</span>
      <span class="hintArrow" id="hintArrow" aria-hidden="true"></span>
    </div>
    <div class="frame" id="frame" aria-hidden="true">
      <canvas class="frameThumb" id="frameThumb" width="240" height="120"></canvas>
      <div class="frameScrim"></div>
      <div class="frameContent">
        <span class="framePlay" aria-hidden="true"></span>
        <span class="frameLabel">読み込んだ動画フレーム</span>
      </div>
      <div class="progressTrack">
        <div class="progressBar" id="progressBar"></div>
      </div>
    </div>
  </div>
  <div class="readout" id="readout" aria-live="polite">
    <span class="readoutLabel">現在の高さ</span>
    <span class="readoutValue" id="heightValue">0px</span>
  </div>
</section>
</main>
<script>
// 클릭으로 불러오는 지연 임베드(08) — 자리표시를 실측한 높이를 기준으로
// easeOutCubic 보간해 카드 높이를 계산으로 늘린다. 실키·실서버 요청 없음.
// 클릭 시 즉시 펼침(실사용자 리스너 있음).
(function () {
  var cardEl = document.getElementById('card');
  var placeholderEl = document.getElementById('placeholder');
  var frameEl = document.getElementById('frame');
  var frameThumbEl = document.getElementById('frameThumb');
  var hintArrowEl = document.getElementById('hintArrow');
  var progressBarEl = document.getElementById('progressBar');
  var heightValueEl = document.getElementById('heightValue');
  if (!cardEl || !placeholderEl || !frameEl || !frameThumbEl || !hintArrowEl || !progressBarEl || !heightValueEl) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NARROW = window.matchMedia('(max-width: 340px)').matches;

  var CYCLE_MS = 2000;
  var PRESS_AT = 900;
  var EXPAND_MS = 500;
  var FRAME_H = NARROW ? 128 : 168;
  var HINT_MS = 700;

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function drawSeedThumb(canvas, seed) {
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    var rnd = mulberry32(seed);
    var w = canvas.width, h = canvas.height;
    var hues = [216, 32, 268, 168];
    ctx.fillStyle = 'hsl(' + hues[Math.floor(rnd() * hues.length)] + ', 38%, 22%)';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 6; i++) {
      var cx = rnd() * w, cy = rnd() * h, r = (0.18 + rnd() * 0.3) * Math.min(w, h);
      ctx.fillStyle = 'hsla(' + hues[Math.floor(rnd() * hues.length)] + ', ' + (44 + rnd() * 22).toFixed(1) + '%, ' + (38 + rnd() * 26).toFixed(1) + '%, .5)';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255, 247, 230, .06)';
    for (var j = 0; j < h; j += 4) ctx.fillRect(0, j, w, 1);
  }

  function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }

  drawSeedThumb(frameThumbEl, 108);

  var pressed = false;
  var pressTime = null;
  var pressAtOverride = false;
  var phH = 0;
  var prevT = 0;

  function enterPressed(t) {
    pressed = true;
    pressTime = t;
    pressAtOverride = false;
    phH = placeholderEl.offsetHeight;
    placeholderEl.setAttribute('aria-pressed', 'true');
  }

  placeholderEl.addEventListener('click', function () {
    pressAtOverride = true;
  });
  placeholderEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      pressAtOverride = true;
    }
  });

  function resetToIdle() {
    pressed = false;
    pressTime = null;
    pressAtOverride = false;
    phH = 0;
    cardEl.style.height = '';
    frameEl.style.opacity = '0';
    progressBarEl.style.transform = 'scaleX(0)';
    placeholderEl.setAttribute('aria-pressed', 'false');
  }

  // 계산 겹: 자리표시의 실측 高さ(phH)에서 FRAME_H 까지 easeOutCubic 으로 보간해
  // 카드 높이를 계산한다. 절반을 넘으면 실 프레임이 페이드로 등장하고,
  // 펼침이 끝난 뒤엔 남은 시간 동안 진행 바가 채워진다.
  function apply(t) {
    var h;
    var hintOpacity = 0.86 + 0.14 * Math.sin(2 * Math.PI * t / HINT_MS);
    if (!pressed) {
      h = placeholderEl.offsetHeight;
      cardEl.style.height = h + 'px';
      hintArrowEl.style.opacity = hintOpacity.toFixed(3);
    } else {
      var elapsed = t - pressTime;
      if (elapsed < 0) elapsed += CYCLE_MS;
      var delta = FRAME_H - phH;
      var p = easeOutCubic(Math.min(1, elapsed / EXPAND_MS));
      h = phH + delta * p;
      cardEl.style.height = h.toFixed(1) + 'px';
      var frameOpacity = p <= 0.55 ? 0 : Math.min(1, (p - 0.55) / 0.45);
      frameEl.style.opacity = frameOpacity.toFixed(3);
      var sweepSpan = CYCLE_MS - PRESS_AT - EXPAND_MS;
      var sweepP = Math.max(0, Math.min(1, (elapsed - EXPAND_MS) / sweepSpan));
      progressBarEl.style.transform = 'scaleX(' + sweepP.toFixed(3) + ')';
    }
    heightValueEl.textContent = '高さ ' + Math.round(h) + 'px';
  }

  if (reduce) {
    apply(0);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var raw = ts - start;
    var t = raw % CYCLE_MS;
    if (t < prevT) resetToIdle();
    prevT = t;
    if (!pressed && (pressAtOverride || t >= PRESS_AT)) enterPressed(t);
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
