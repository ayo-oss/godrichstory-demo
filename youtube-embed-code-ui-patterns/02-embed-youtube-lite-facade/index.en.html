<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가벼운 파사드 임베드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="card" id="card" data-state="lite">
    <div class="thumbWrap">
      <canvas class="thumb" id="thumb" width="320" height="180" aria-hidden="true"></canvas>
      <div class="playBtn" role="button" aria-label="Play">
        <svg class="playIcon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="7,4 20,12 7,20"></polygon></svg>
      </div>
      <span class="badgeLite">Lite</span>
      <span class="cardTitleLite">Lightweight thumbnail card</span>
      <div class="frameTop">
        <span class="frameTopTitle">Ready to play</span>
      </div>
      <div class="frameBottom">
        <div class="progressTrack">
          <div class="progressFill" id="progressFill"></div>
        </div>
        <span class="timeLabel" id="timeLabel">0:00 / 0:12</span>
      </div>
    </div>
  </div>
  <div class="readout" id="readout" aria-live="polite">Elapsed 0.00s · switch 1.2s</div>
</section>
</main>
<script>
// 가벼운 파사드 임베드(02) — Elapsed 시간이 임계값(FACADE_DELAY)을 넘는 순간
// data-state 를 'lite' → 'frame' 으로 바꾸는 상태 머신. 실키·실서버 요청 없음.
(function () {
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function drawSeedThumb(canvas, seed) {
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    var rnd = mulberry32(seed);
    var w = canvas.width, h = canvas.height;
    var hues = [216, 32, 268, 168];
    ctx.fillStyle = 'hsl(' + hues[Math.floor(rnd() * hues.length)] + ', 38%, 22%)';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 6; i++) {
      var cx = rnd() * w, cy = rnd() * h, r = (0.18 + rnd() * 0.3) * Math.min(w, h);
      ctx.fillStyle = 'hsla(' + hues[Math.floor(rnd() * hues.length)] + ', ' + (44 + rnd() * 22).toFixed(1) + '%, ' + (38 + rnd() * 26).toFixed(1) + '%, .5)';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255, 247, 230, .06)';
    for (var j = 0; j < h; j += 4) ctx.fillRect(0, j, w, 1);
  }

  var cardEl = document.getElementById('card');
  var thumbEl = document.getElementById('thumb');
  var progressFillEl = document.getElementById('progressFill');
  var timeLabelEl = document.getElementById('timeLabel');
  var readoutEl = document.getElementById('readout');
  if (!cardEl || !thumbEl || !progressFillEl || !timeLabelEl || !readoutEl) return;

  drawSeedThumb(thumbEl, 102);

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var CYCLE_MS = 2000;
  var FACADE_DELAY = 1200;
  var TOTAL_SEC = 12;
  var transitionSec = (FACADE_DELAY / 1000).toFixed(1);

  function apply(t) {
    var isFrame = t >= FACADE_DELAY;
    cardEl.dataset.state = isFrame ? 'frame' : 'lite';
    var progress = isFrame ? (t - FACADE_DELAY) / (CYCLE_MS - FACADE_DELAY) : 0;
    progressFillEl.style.transform = 'scaleX(' + progress.toFixed(4) + ')';
    var sec = Math.floor(progress * TOTAL_SEC);
    timeLabelEl.textContent = '0:' + String(sec).padStart(2, '0') + ' / 0:12';
    readoutEl.textContent = 'Elapsed ' + (t / 1000).toFixed(2) + 's · switch ' + transitionSec + 's';
  }

  apply(0);
  if (reduce) return;

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
