<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snap guides — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sg is-demo" id="sg-root">
    <div class="sg__box" id="sg-box">
      <div class="sg__guides" aria-hidden="true">
        <i class="sg__g sg__g--a"></i>
        <i class="sg__g sg__g--b"></i>
        <i class="sg__g sg__g--c"></i>
      </div>
      <section class="sg__pane sg__pane--l" aria-label="왼쪽 화면">
        <span class="sg__ln"></span>
        <span class="sg__ln sg__ln--s"></span>
        <span class="sg__ln"></span>
      </section>
      <div class="sg__bar" id="sg-bar" role="separator" tabindex="0"
           aria-orientation="vertical" aria-label="분할 비율" aria-valuemin="10" aria-valuemax="90" aria-valuenow="50">
        <i class="sg__grip" aria-hidden="true"></i>
      </div>
      <section class="sg__pane sg__pane--r" aria-label="오른쪽 화면">
        <span class="sg__ln"></span>
        <span class="sg__ln sg__ln--s"></span>
      </section>
    </div>
    <p class="sg__cap">25 · 50 · 75% 근처에서 자석처럼 붙는다</p>
  </div>
</main>
<script>
// 실제 동작: 안내선 세 곳에서 6% 안으로 들어오면 그 비율로 스냅. Math.abs 로 거리만 본다.
var root = document.getElementById('sg-root');
var box = document.getElementById('sg-box');
var bar = document.getElementById('sg-bar');
var STOPS = [25, 50, 75], NEAR = 6, dragging = false;

function snap(pct) {
  var best = pct;
  for (var i = 0; i < STOPS.length; i++) {
    if (Math.abs(pct - STOPS[i]) < NEAR) best = STOPS[i];
  }
  return Math.max(10, Math.min(best, 90));
}
function set(pct) {
  var v = snap(pct);
  root.style.setProperty('--split', v + '%');
  bar.setAttribute('aria-valuenow', String(Math.round(v)));
  root.classList.toggle('is-snapped', STOPS.indexOf(v) >= 0);
}
bar.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  dragging = true;
  root.classList.add('is-drag');
  bar.setPointerCapture(e.pointerId);
  e.preventDefault();
});
bar.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  set((e.clientX - box.getBoundingClientRect().left) / box.clientWidth * 100);
});
function drop() { dragging = false; root.classList.remove('is-drag'); }
bar.addEventListener('pointerup', drop);
bar.addEventListener('pointercancel', drop);
bar.addEventListener('keydown', function (e) {
  var d = e.key === 'ArrowLeft' ? -5 : e.key === 'ArrowRight' ? 5 : 0;
  if (!d) return;
  root.classList.remove('is-demo');
  set(Number(bar.getAttribute('aria-valuenow')) + d);
  bar.focus({ preventScroll: true });
  e.preventDefault();
});
</script>
</body>
</html>
