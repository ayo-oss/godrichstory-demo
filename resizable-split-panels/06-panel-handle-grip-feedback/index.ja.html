<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handle grip feedback — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="hg is-demo" id="hg-root">
    <div class="hg__box" id="hg-box">
      <section class="hg__pane hg__pane--l" aria-label="左のパネル">
        <span class="hg__ln"></span>
        <span class="hg__ln hg__ln--s"></span>
        <span class="hg__ln"></span>
      </section>
      <div class="hg__bar" id="hg-bar" role="separator" tabindex="0"
           aria-orientation="vertical" aria-label="分割の幅" aria-valuemin="20" aria-valuemax="80" aria-valuenow="46">
        <i class="hg__hair" aria-hidden="true"></i>
        <i class="hg__dots" aria-hidden="true"><s></s><s></s><s></s></i>
      </div>
      <section class="hg__pane hg__pane--r" aria-label="右のパネル">
        <span class="hg__ln hg__ln--d"></span>
        <span class="hg__ln hg__ln--d hg__ln--s"></span>
      </section>
    </div>
    <p class="hg__cap">乗せると広がり、引いている間は点いたまま</p>
  </div>
</main>
<script>
// 실제 동작: 손잡이 상태는 CSS 가 그린다. JS 는 끌기 시작·끝만 클래스로 알려 준다.
var root = document.getElementById('hg-root');
var box = document.getElementById('hg-box');
var bar = document.getElementById('hg-bar');
var dragging = false;

function set(pct) {
  var v = Math.max(20, Math.min(pct, 80));
  root.style.setProperty('--split', v.toFixed(1) + '%');
  bar.setAttribute('aria-valuenow', String(Math.round(v)));
}
bar.addEventListener('pointerenter', function () { root.classList.add('is-near'); });
bar.addEventListener('pointerleave', function () { if (!dragging) root.classList.remove('is-near'); });
bar.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  dragging = true;
  root.classList.add('is-drag');
  bar.setPointerCapture(e.pointerId);
  e.preventDefault();
});
bar.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  set((e.clientX - box.getBoundingClientRect().left) / box.clientWidth * 100);
});
function drop() {
  dragging = false;
  root.classList.remove('is-drag');
  root.classList.remove('is-near');
}
bar.addEventListener('pointerup', drop);
bar.addEventListener('pointercancel', drop);
bar.addEventListener('keydown', function (e) {
  var d = e.key === 'ArrowLeft' ? -4 : e.key === 'ArrowRight' ? 4 : 0;
  if (!d) return;
  root.classList.remove('is-demo');
  set(Number(bar.getAttribute('aria-valuenow')) + d);
  bar.focus({ preventScroll: true });
  e.preventDefault();
});
</script>
</body>
</html>
