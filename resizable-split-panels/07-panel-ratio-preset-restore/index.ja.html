<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ratio presets — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="rp is-demo" id="rp-root">
    <div class="rp__box" id="rp-box">
      <section class="rp__pane rp__pane--l" aria-label="左のパネル">
        <span class="rp__ln"></span>
        <span class="rp__ln rp__ln--s"></span>
      </section>
      <div class="rp__bar" id="rp-bar" role="separator" tabindex="0"
           aria-orientation="vertical" aria-label="分割比率" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50">
        <i class="rp__grip" aria-hidden="true"></i>
      </div>
      <section class="rp__pane rp__pane--r" aria-label="右のパネル">
        <span class="rp__ln"></span>
        <span class="rp__ln rp__ln--s"></span>
      </section>
    </div>
    <div class="rp__row">
      <span class="rp__save" aria-hidden="true"><svg viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 83.31V208a8 8 0 0 1-8 8h-32v-64a8 8 0 0 0-8-8H88a8 8 0 0 0-8 8v64H48a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8h124.69a8 8 0 0 1 5.65 2.34l35.32 35.32a8 8 0 0 1 2.34 5.65" opacity=".2"/><path d="M219.31 72L184 36.69A15.86 15.86 0 0 0 172.69 32H48a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V83.31A15.86 15.86 0 0 0 219.31 72M168 208H88v-56h80Zm40 0h-24v-56a16 16 0 0 0-16-16H88a16 16 0 0 0-16 16v56H48V48h124.69L208 83.31ZM160 72a8 8 0 0 1-8 8H96a8 8 0 0 1 0-16h56a8 8 0 0 1 8 8"/></g></svg></span>
      <button class="rp__btn" type="button" data-v="34" aria-pressed="false">1:2</button>
      <button class="rp__btn is-on" type="button" data-v="50" aria-pressed="true">1:1</button>
      <button class="rp__btn" type="button" data-v="66" aria-pressed="false">2:1</button>
    </div>
    <p class="rp__cap">比率はブラウザに保存されて次回もそのまま</p>
  </div>
</main>
<script>
// 실제 동작: 끌 때마다 localStorage 에 비율을 쓰고, 열 때 JSON.parse 로 읽어 복원한다.
var root = document.getElementById('rp-root');
var box = document.getElementById('rp-box');
var bar = document.getElementById('rp-bar');
var btns = [].slice.call(document.querySelectorAll('.rp__btn'));
var KEY = 'godrich-split-250', dragging = false;

function set(pct, mark) {
  var v = Math.max(20, Math.min(pct, 80));
  root.style.setProperty('--split', v.toFixed(1) + '%');
  bar.setAttribute('aria-valuenow', String(Math.round(v)));
  btns.forEach(function (b) {
    var on = mark && b.dataset.v === String(Math.round(v));
    b.classList.toggle('is-on', !!on);
    b.setAttribute('aria-pressed', String(!!on));
  });
  // 사생활 보호 모드에서는 저장이 막혀 예외가 난다 — 조용히 넘어간다
  try { localStorage.setItem(KEY, JSON.stringify({ split: Math.round(v) })); } catch (err) { return; }
}
try {
  var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (saved && saved.split) { root.classList.remove('is-demo'); set(saved.split, true); }
} catch (err) { /* 저장값이 깨졌으면 기본값 */ }

btns.forEach(function (b) {
  b.addEventListener('click', function () {
    root.classList.remove('is-demo');
    root.classList.add('is-glide');
    set(Number(b.dataset.v), true);
  });
});
bar.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  root.classList.remove('is-glide');
  dragging = true;
  bar.setPointerCapture(e.pointerId);
  e.preventDefault();
});
bar.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  set((e.clientX - box.getBoundingClientRect().left) / box.clientWidth * 100, true);
});
bar.addEventListener('pointerup', function () { dragging = false; });
bar.addEventListener('keydown', function (e) {
  var d = e.key === 'ArrowLeft' ? -4 : e.key === 'ArrowRight' ? 4 : 0;
  if (!d) return;
  root.classList.remove('is-demo');
  root.classList.remove('is-glide');
  set(Number(bar.getAttribute('aria-valuenow')) + d, true);
  bar.focus({ preventScroll: true });
  e.preventDefault();
});
</script>
</body>
</html>
