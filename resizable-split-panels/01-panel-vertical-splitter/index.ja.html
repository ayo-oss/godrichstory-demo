<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertical splitter — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="vs is-demo" id="vs-root">
    <div class="vs__box" id="vs-box">
      <section class="vs__pane vs__pane--list" aria-label="メール一覧">
        <span class="vs__row"></span>
        <span class="vs__row"></span>
        <span class="vs__row"></span>
        <span class="vs__row"></span>
      </section>
      <div class="vs__bar" id="vs-bar" role="separator" tabindex="0"
           aria-orientation="vertical" aria-label="一覧の幅" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50">
        <i class="vs__grip" aria-hidden="true"></i>
      </div>
      <section class="vs__pane vs__pane--read" aria-label="メール本文">
        <b class="vs__title"></b>
        <span class="vs__line"></span>
        <span class="vs__line vs__line--short"></span>
        <span class="vs__line"></span>
      </section>
    </div>
    <p class="vs__cap">ハンドルを左右に引いて幅を調節</p>
  </div>
</main>
<script>
// 실제 동작: 포인터 델타 → 왼쪽 트랙 폭(--split). 최소 폭 64px 에서 클램프. 화살표 키는 4%씩.
var root = document.getElementById('vs-root');
var box = document.getElementById('vs-box');
var bar = document.getElementById('vs-bar');
var MIN = 64, BAR = 10, dragging = false;

function set(pct) {
  var w = box.clientWidth;
  var lo = MIN / w * 100, hi = (w - MIN - BAR) / w * 100;
  var v = Math.max(lo, Math.min(pct, hi));
  root.style.setProperty('--split', v.toFixed(1) + '%');
  bar.setAttribute('aria-valuenow', String(Math.round(v)));
}
function stop() { root.classList.remove('is-demo'); }

bar.addEventListener('pointerdown', function (e) {
  stop();
  dragging = true;
  bar.setPointerCapture(e.pointerId);
  root.classList.add('is-drag');
  e.preventDefault();
});
bar.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  set((e.clientX - box.getBoundingClientRect().left) / box.clientWidth * 100);
});
function drop() { dragging = false; root.classList.remove('is-drag'); }
bar.addEventListener('pointerup', drop);
bar.addEventListener('pointercancel', drop);
bar.addEventListener('keydown', function (e) {
  var now = Number(bar.getAttribute('aria-valuenow'));
  var d = e.key === 'ArrowLeft' ? -4 : e.key === 'ArrowRight' ? 4 : 0;
  if (!d) return;
  stop();
  set(now + d);
  bar.focus({ preventScroll: true });
  e.preventDefault();
});
</script>
</body>
</html>
