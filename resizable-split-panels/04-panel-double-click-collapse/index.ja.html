<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double click collapse — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="dc is-demo" id="dc-root">
    <div class="dc__box" id="dc-box">
      <section class="dc__side" id="dc-side" aria-label="サイドバー">
        <span class="dc__ico"><svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M88 48v160H40a8 8 0 0 1-8-8V56a8 8 0 0 1 8-8Z" opacity=".2"/><path d="M216 40H40a16 16 0 0 0-16 16v144a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16M40 56h40v144H40Zm176 144H96V56h120z"/></g></svg></span>
        <span class="dc__row"></span>
        <span class="dc__row"></span>
        <span class="dc__row"></span>
      </section>
      <div class="dc__bar" id="dc-bar" role="separator" tabindex="0"
           aria-orientation="vertical" aria-label="サイドバーの幅" aria-expanded="true" aria-valuemin="4" aria-valuemax="60" aria-valuenow="34">
        <i class="dc__grip" aria-hidden="true"></i>
      </div>
      <section class="dc__main" aria-label="本文">
        <b class="dc__head"></b>
        <span class="dc__line"></span>
        <span class="dc__line dc__line--short"></span>
      </section>
    </div>
    <p class="dc__cap">ハンドルを2回押して折りたたむ</p>
  </div>
</main>
<script>
// 실제 동작: dblclick 한 번에 접힘 ↔ 접기 직전 폭. 폭 자체는 CSS transition 이 옮긴다.
var root = document.getElementById('dc-root');
var box = document.getElementById('dc-box');
var bar = document.getElementById('dc-bar');
var RAIL = 4, last = 34, folded = false, dragging = false;

function set(pct, fold) {
  root.style.setProperty('--split', pct.toFixed(1) + '%');
  bar.setAttribute('aria-valuenow', String(Math.round(pct)));
  bar.setAttribute('aria-expanded', String(!fold));
  root.classList.toggle('is-folded', fold);
}
function stop() { root.classList.remove('is-demo'); }

bar.addEventListener('dblclick', function () {
  stop();
  folded = !folded;
  if (folded) set(RAIL, true);
  else set(last, false);
});
bar.addEventListener('pointerdown', function (e) {
  stop();
  dragging = true;
  bar.setPointerCapture(e.pointerId);
  e.preventDefault();
});
bar.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  root.classList.add('is-live');
  var pct = (e.clientX - box.getBoundingClientRect().left) / box.clientWidth * 100;
  last = Math.max(14, Math.min(pct, 60));
  folded = false;
  set(last, false);
});
function drop() { dragging = false; root.classList.remove('is-live'); }
bar.addEventListener('pointerup', drop);
bar.addEventListener('pointercancel', drop);
bar.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  stop();
  folded = !folded;
  set(folded ? RAIL : last, folded);
  bar.focus({ preventScroll: true });
  e.preventDefault();
});
</script>
</body>
</html>
