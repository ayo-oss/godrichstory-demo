<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corner resize grip — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cg is-demo" id="cg-root">
    <div class="cg__field">
      <div class="cg__card" id="cg-card">
        <span class="cg__row"></span>
        <span class="cg__row cg__row--short"></span>
        <span class="cg__size"></span>
        <i class="cg__grip" id="cg-grip" role="slider" tabindex="0"
           aria-label="Card size" aria-valuemin="120" aria-valuemax="220" aria-valuenow="176"></i>
      </div>
    </div>
    <button class="cg__lock is-on" id="cg-lock" type="button" aria-pressed="true">
      <span class="cg__ico" aria-hidden="true"><svg viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 96v112a8 8 0 0 1-8 8H48a8 8 0 0 1-8-8V96a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 80h-32V56a48 48 0 0 0-96 0v24H48a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V96a16 16 0 0 0-16-16M96 56a32 32 0 0 1 64 0v24H96Zm112 152H48V96h160z"/></g></svg></span>
      Lock ratio
    </button>
  </div>
</main>
<script>
// 실제 동작: 코너 그립의 포인터 델타로 폭·높이를 함께 바꾼다. 잠금이 켜져 있으면 높이는 폭 × 처음 비율.
var root = document.getElementById('cg-root');
var card = document.getElementById('cg-card');
var grip = document.getElementById('cg-grip');
var lock = document.getElementById('cg-lock');
var RATIO = 96 / 176, locked = true, dragging = false, w0 = 0, h0 = 0, x0 = 0, y0 = 0;

function set(w, h) {
  var W = Math.max(120, Math.min(Math.round(w), 220));
  var H = locked ? Math.round(W * RATIO) : Math.max(64, Math.min(Math.round(h), 132));
  root.style.setProperty('--w', W + 'px');
  root.style.setProperty('--h', H + 'px');
  // 숫자 표시는 counter 가 읽는 --wn/--hn 한 쌍이다. 자동 루프도 같은 값을 움직이므로
  // 카드 크기와 글자가 어긋나는 프레임이 없다
  root.style.setProperty('--wn', String(W));
  root.style.setProperty('--hn', String(H));
  grip.setAttribute('aria-valuenow', String(W));
}
lock.addEventListener('click', function () {
  locked = !locked;
  lock.classList.toggle('is-on', locked);
  lock.setAttribute('aria-pressed', String(locked));
  root.classList.toggle('is-aspect', locked);
});
grip.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  dragging = true;
  var r = card.getBoundingClientRect();
  w0 = r.width; h0 = r.height; x0 = e.clientX; y0 = e.clientY;
  grip.setPointerCapture(e.pointerId);
  e.preventDefault();
});
grip.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  set(w0 + (e.clientX - x0), h0 + (e.clientY - y0));
});
grip.addEventListener('pointerup', function () { dragging = false; });
grip.addEventListener('keydown', function (e) {
  var d = e.key === 'ArrowLeft' ? -8 : e.key === 'ArrowRight' ? 8 : 0;
  if (!d) return;
  root.classList.remove('is-demo');
  var n = Number(grip.getAttribute('aria-valuenow')) + d;
  set(n, n * RATIO);
  grip.focus({ preventScroll: true });
  e.preventDefault();
});
</script>
</body>
</html>
