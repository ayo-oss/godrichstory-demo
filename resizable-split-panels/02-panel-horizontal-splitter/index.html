<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizontal splitter — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="hs is-demo" id="hs-root">
    <div class="hs__box" id="hs-box">
      <section class="hs__pane hs__pane--code" aria-label="편집 영역">
        <span class="hs__tok hs__tok--a"></span>
        <span class="hs__tok hs__tok--b"></span>
        <span class="hs__tok hs__tok--c"></span>
        <span class="hs__tok hs__tok--b"></span>
      </section>
      <div class="hs__bar" id="hs-bar" role="separator" tabindex="0"
           aria-orientation="horizontal" aria-label="편집 영역 높이" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50">
        <i class="hs__grip" aria-hidden="true"></i>
      </div>
      <section class="hs__pane hs__pane--out" aria-label="결과 영역">
        <span class="hs__chip">결과</span>
        <span class="hs__bars"><i></i><i></i><i></i><i></i><i></i></span>
      </section>
    </div>
    <p class="hs__cap">위아래로 끌거나 화살표 키로 높이 조절</p>
  </div>
</main>
<script>
// 실제 동작: 포인터 Y 델타 → 위 트랙 높이(--splitY). 최소 40px 을 clamp 로 지킨다.
var root = document.getElementById('hs-root');
var box = document.getElementById('hs-box');
var bar = document.getElementById('hs-bar');
var MIN = 40, BAR = 10, dragging = false;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(v, hi)); }
function set(pct) {
  var h = box.clientHeight;
  var v = clamp(pct, MIN / h * 100, (h - MIN - BAR) / h * 100);
  root.style.setProperty('--splitY', v.toFixed(1) + '%');
  bar.setAttribute('aria-valuenow', String(Math.round(v)));
}
function stop() { root.classList.remove('is-demo'); }

bar.addEventListener('pointerdown', function (e) {
  stop();
  dragging = true;
  bar.setPointerCapture(e.pointerId);
  root.classList.add('is-drag');
  e.preventDefault();
});
bar.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  set((e.clientY - box.getBoundingClientRect().top) / box.clientHeight * 100);
});
function drop() { dragging = false; root.classList.remove('is-drag'); }
bar.addEventListener('pointerup', drop);
bar.addEventListener('pointercancel', drop);
bar.addEventListener('keydown', function (e) {
  var d = e.key === 'ArrowUp' ? -5 : e.key === 'ArrowDown' ? 5 : 0;
  if (!d) return;
  stop();
  set(Number(bar.getAttribute('aria-valuenow')) + d);
  bar.focus({ preventScroll: true });
  e.preventDefault();
});
</script>
</body>
</html>
