<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three pane layout — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="tp is-demo" id="tp-root">
    <div class="tp__box" id="tp-box">
      <section class="tp__side" aria-label="ファイル一覧">
        <span class="tp__ico"><svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M128 80H32V56a8 8 0 0 1 8-8h52.69a8 8 0 0 1 5.65 2.34Z" opacity=".2"/><path d="M216 72h-84.69L104 44.69A15.86 15.86 0 0 0 92.69 40H40a16 16 0 0 0-16 16v144.62A15.4 15.4 0 0 0 39.38 216h177.51A15.13 15.13 0 0 0 232 200.89V88a16 16 0 0 0-16-16M92.69 56l16 16H40V56ZM216 200H40V88h176Z"/></g></svg></span>
        <span class="tp__row"></span>
        <span class="tp__row tp__row--on"></span>
        <span class="tp__row"></span>
      </section>
      <div class="tp__bar tp__bar--v" id="tp-barv" role="separator" tabindex="0"
           aria-orientation="vertical" aria-label="サイドバーの幅" aria-valuemin="14" aria-valuemax="60" aria-valuenow="30"></div>
      <div class="tp__main">
        <section class="tp__edit" aria-label="エディタ">
          <span class="tp__ico"><svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m240 128l-48 40H64l-48-40l48-40h128Z" opacity=".2"/><path d="M69.12 94.15L28.5 128l40.62 33.85a8 8 0 1 1-10.24 12.29l-48-40a8 8 0 0 1 0-12.29l48-40a8 8 0 0 1 10.24 12.3m176 27.7l-48-40a8 8 0 1 0-10.24 12.3L227.5 128l-40.62 33.85a8 8 0 1 0 10.24 12.29l48-40a8 8 0 0 0 0-12.29m-82.39-89.37a8 8 0 0 0-10.25 4.79l-64 176a8 8 0 0 0 4.79 10.26A8.1 8.1 0 0 0 96 224a8 8 0 0 0 7.52-5.27l64-176a8 8 0 0 0-4.79-10.25"/></g></svg></span>
          <span class="tp__tok tp__tok--a"></span>
          <span class="tp__tok tp__tok--b"></span>
          <span class="tp__tok tp__tok--c"></span>
        </section>
        <div class="tp__bar tp__bar--h" id="tp-barh" role="separator" tabindex="0"
             aria-orientation="horizontal" aria-label="コンソールの高さ" aria-valuemin="16" aria-valuemax="70" aria-valuenow="34"></div>
        <section class="tp__term" aria-label="コンソール">
          <span class="tp__ico"><svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M224 56v144a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V56a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8" opacity=".2"/><path d="M128 128a8 8 0 0 1-3 6.25l-40 32a8 8 0 1 1-10-12.5L107.19 128L75 102.25a8 8 0 1 1 10-12.5l40 32a8 8 0 0 1 3 6.25m48 24h-40a8 8 0 0 0 0 16h40a8 8 0 0 0 0-16m56-96v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16m-16 144V56H40v144z"/></g></svg></span>
          <span class="tp__tok tp__tok--d"></span>
        </section>
      </div>
    </div>
    <p class="tp__cap">2本のハンドルが隣の枠だけを縮める</p>
  </div>
</main>
<script>
// 실제 동작: 세로 손잡이는 grid-template-columns, 가로 손잡이는 grid-template-rows 를 각자 바꾼다.
var root = document.getElementById('tp-root');
var box = document.getElementById('tp-box');
var pair = [
  { bar: document.getElementById('tp-barv'), key: '--col', lo: 14, hi: 60, axis: 'x' },
  { bar: document.getElementById('tp-barh'), key: '--row', lo: 16, hi: 70, axis: 'y' }
];
var live = null;

function set(p, pct) {
  var v = Math.max(p.lo, Math.min(pct, p.hi));
  root.style.setProperty(p.key, v.toFixed(1) + '%');
  p.bar.setAttribute('aria-valuenow', String(Math.round(v)));
}
pair.forEach(function (p) {
  p.bar.addEventListener('pointerdown', function (e) {
    root.classList.remove('is-demo');
    live = p;
    p.bar.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  p.bar.addEventListener('pointermove', function (e) {
    if (live !== p) return;
    var r = box.getBoundingClientRect();
    set(p, p.axis === 'x' ? (e.clientX - r.left) / r.width * 100 : (e.clientY - r.top) / r.height * 100);
  });
  p.bar.addEventListener('pointerup', function () { live = null; });
  p.bar.addEventListener('keydown', function (e) {
    var d = (e.key === 'ArrowLeft' || e.key === 'ArrowUp') ? -5 : (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 5 : 0;
    if (!d) return;
    root.classList.remove('is-demo');
    set(p, Number(p.bar.getAttribute('aria-valuenow')) + d);
    p.bar.focus({ preventScroll: true });
    e.preventDefault();
  });
});
</script>
</body>
</html>
