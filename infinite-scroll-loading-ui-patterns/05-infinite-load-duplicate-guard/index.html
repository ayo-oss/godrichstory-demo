<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중복 호출 방지 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dgd is-demo" id="dgd">
  <div class="dgd__meters">
    <div class="dgd__meter">
      <span class="dgd__meter-label">마지막 요청 이후</span>
      <span class="dgd__meter-value" id="dgdSince">0ms</span>
    </div>
    <div class="dgd__meter">
      <span class="dgd__meter-label">막은 호출</span>
      <span class="dgd__meter-value" id="dgdBlocked">0회</span>
    </div>
  </div>
  <div class="dgd__view" id="dgdView">
    <ul class="dgd__track" id="dgdTrack">
      <li class="dgd__sentinel" id="dgdSentinel" aria-hidden="true"></li>
    </ul>
  </div>
</div>
</main>
<script>
(function () {
  var view = document.getElementById('dgdView');
  var track = document.getElementById('dgdTrack');
  var sentinel = document.getElementById('dgdSentinel');
  var sinceEl = document.getElementById('dgdSince');
  var blockedEl = document.getElementById('dgdBlocked');
  var root = document.getElementById('dgd');

  var COOLDOWN_MS = 900;    // 마지막 요청 시각과의 차이가 이 값보다 작으면 호출을 막는다
  var LOAD_DELAY_MS = 540;
  var MAX_BATCHES = 4;

  var lastRequestAt = -99999;
  var blockedCount = 0;
  var loading = false;
  var batches = 0;
  var rowSeq = 0;
  var dir = 1;
  var autoplayTimer = null;
  var uiTimer = null;

  function addRow() {
    var li = document.createElement('li');
    li.className = 'dgd__row';
    li.textContent = '수신함 ' + String(rowSeq + 1).padStart(2, '0');
    track.insertBefore(li, sentinel);
    rowSeq += 1;
  }
  for (var i = 0; i < 6; i += 1) { addRow(); }

  // 계산 겹: 호출 조건이 닿아도 마지막 요청 시각 값과 지금 시각 값의 차이를 계산해,
  // 그 값이 대기 기준보다 작은 동안은 요청을 걸지 않고 막은 횟수만 센다.
  function tryRequest() {
    var now = performance.now();
    var since = now - lastRequestAt;
    if (since < COOLDOWN_MS) {
      blockedCount += 1;
      blockedEl.textContent = blockedCount + '회';
      sentinel.classList.add('dgd__sentinel--blocked');
      setTimeout(function () { sentinel.classList.remove('dgd__sentinel--blocked'); }, 180);
      return false;
    }
    lastRequestAt = now;
    loading = true;
    sentinel.classList.add('dgd__sentinel--loading');
    setTimeout(function () {
      for (var n = 0; n < 3; n += 1) { addRow(); }
      loading = false;
      batches += 1;
      sentinel.classList.remove('dgd__sentinel--loading');
    }, LOAD_DELAY_MS);
    return true;
  }

  function recompute() {
    var remaining = sentinel.getBoundingClientRect().top - view.getBoundingClientRect().bottom;
    if (remaining <= 2 && !loading && batches < MAX_BATCHES) { tryRequest(); }
  }

  function uiTick() {
    sinceEl.textContent = Math.round(performance.now() - lastRequestAt) + 'ms';
  }

  view.addEventListener('scroll', recompute);

  function userTakesOver() {
    if (!root.classList.contains('is-demo')) { return; }
    root.classList.remove('is-demo');
    stopAutoplay();
  }
  view.addEventListener('wheel', userTakesOver, { passive: true });
  view.addEventListener('touchstart', userTakesOver, { passive: true });

  function autoplayTick() {
    var max = view.scrollHeight - view.clientHeight;
    if (batches >= MAX_BATCHES && view.scrollTop >= max - 1 && dir !== 0) {
      dir = 0;
      setTimeout(function () {
        while (track.firstChild !== sentinel) { track.removeChild(track.firstChild); }
        rowSeq = 0; batches = 0; blockedCount = 0; lastRequestAt = -99999;
        blockedEl.textContent = '0회';
        for (var i = 0; i < 6; i += 1) { addRow(); }
        view.scrollTop = 0;
        dir = 1;
      }, 600);
      return;
    }
    if (dir === 0) { return; }
    view.scrollTop = Math.min(view.scrollTop + 4, max);   // 끝에 붙어 있을 때 연속 이벤트 → 방어 동작 유발
    recompute();
  }

  function stopAutoplay() {
    if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
    if (uiTimer) { clearInterval(uiTimer); uiTimer = null; }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplayTimer = setInterval(autoplayTick, 60);
    uiTimer = setInterval(uiTick, 100);
  }
})();
</script>
</body>
</html>
