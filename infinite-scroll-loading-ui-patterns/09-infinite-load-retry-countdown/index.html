<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실패 재시도 카운트다운 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rcd is-demo" id="rcd">
  <div class="rcd__status" id="rcdStatus" role="status">끝에 닿으면 다음 묶음을 부릅니다</div>
  <div class="rcd__view" id="rcdView">
    <ul class="rcd__track" id="rcdTrack">
      <li class="rcd__sentinel" id="rcdSentinel" aria-hidden="true">
        <div class="rcd__retry" id="rcdRetry" hidden>
          <span class="rcd__seconds" id="rcdSeconds">3.0</span>
          <svg class="rcd__arc" viewBox="0 0 36 36" aria-hidden="true">
            <circle class="rcd__arc-track" cx="18" cy="18" r="15.9"></circle>
            <circle class="rcd__arc-fill" id="rcdArc" cx="18" cy="18" r="15.9"></circle>
          </svg>
        </div>
      </li>
    </ul>
  </div>
</div>
</main>
<script>
(function () {
  var view = document.getElementById('rcdView');
  var track = document.getElementById('rcdTrack');
  var sentinel = document.getElementById('rcdSentinel');
  var statusEl = document.getElementById('rcdStatus');
  var retryBox = document.getElementById('rcdRetry');
  var secondsEl = document.getElementById('rcdSeconds');
  var arc = document.getElementById('rcdArc');
  var root = document.getElementById('rcd');

  var WAIT_S = 3;              // 대기 시간 시작 값(초)
  var FIRST_ATTEMPTS_FAIL = 1; // 시드 고정 — 처음 1번은 실패해 카운트다운이 보인다
  var LOAD_DELAY_MS = 480;
  var MAX_BATCHES = 3;

  var CIRC = 2 * Math.PI * 15.9;   // 원둘레 값 — 진행 링의 전체 길이

  var batches = 0;
  var attempts = 0;
  var loading = false;
  var counting = false;
  var rowSeq = 0;
  var dir = 1;
  var autoplayTimer = null;
  var countdownRaf = null;

  function addRow() {
    var li = document.createElement('li');
    li.className = 'rcd__row';
    li.textContent = '오프라인 큐 ' + String(rowSeq + 1).padStart(2, '0');
    track.insertBefore(li, sentinel);
    rowSeq += 1;
  }
  for (var i = 0; i < 5; i += 1) { addRow(); }

  // 계산 겹: 대기 시간 값은 정적 텍스트가 아니라 rAF 로 매 순간 다시 계산된다 — 경과 시간 값을
  // easing(여기선 ease-out 곡선)에 넣어 남은 초와 링 길이(원둘레 × 남은 비율)를 구한다.
  function runCountdown(done) {
    counting = true;
    retryBox.hidden = false;
    var t0 = performance.now();
    function tick(now) {
      var elapsed = (now - t0) / 1000;
      var k = Math.min(elapsed / WAIT_S, 1);
      var eased = 1 - Math.pow(1 - k, 2);   // ease-out — 처음에 빨리 줄고 끝에서 느리게 멈춘다
      var remainS = WAIT_S * (1 - eased);
      secondsEl.textContent = remainS.toFixed(1);
      arc.style.strokeDashoffset = String(CIRC * eased);
      if (k < 1) { countdownRaf = requestAnimationFrame(tick); }
      else { counting = false; retryBox.hidden = true; done(); }
    }
    countdownRaf = requestAnimationFrame(tick);
  }

  function recompute() {
    var remaining = sentinel.getBoundingClientRect().top - view.getBoundingClientRect().bottom;
    if (remaining <= 2 && !loading && !counting && batches < MAX_BATCHES) { startLoad(); }
  }

  function startLoad() {
    loading = true;
    sentinel.classList.add('rcd__sentinel--loading');
    attempts += 1;
    var fail = attempts <= FIRST_ATTEMPTS_FAIL;
    setTimeout(function () {
      loading = false;
      sentinel.classList.remove('rcd__sentinel--loading');
      if (fail) {
        statusEl.textContent = '요청이 실패했습니다 — 잠시 뒤 다시 시도합니다';
        runCountdown(function () {   // 대기 시간 값이 0이 된 순간 같은 요청이 다시 나간다
          statusEl.textContent = '다시 시도 중입니다';
          startLoad();
        });
      } else {
        for (var n = 0; n < 3; n += 1) { addRow(); }
        batches += 1;
        statusEl.textContent = '묶음 ' + batches + ' 도착';
      }
    }, LOAD_DELAY_MS);
  }

  view.addEventListener('scroll', recompute);

  function userTakesOver() {
    if (!root.classList.contains('is-demo')) { return; }
    root.classList.remove('is-demo');
    stopAutoplay();
  }
  view.addEventListener('wheel', userTakesOver, { passive: true });
  view.addEventListener('touchstart', userTakesOver, { passive: true });

  function autoplayTick() {
    var max = view.scrollHeight - view.clientHeight;
    if (batches >= MAX_BATCHES && view.scrollTop >= max - 1 && dir !== 0) {
      dir = 0;
      setTimeout(function () {
        while (track.firstChild !== sentinel) { track.removeChild(track.firstChild); }
        rowSeq = 0; batches = 0; attempts = 0; dir = 1;
        for (var i = 0; i < 5; i += 1) { addRow(); }
        view.scrollTop = 0;
        statusEl.textContent = '끝에 닿으면 다음 묶음을 부릅니다';
      }, 700);
      return;
    }
    if (dir === 0) { return; }
    view.scrollTop = Math.min(view.scrollTop + 5, max);
    recompute();
  }

  function stopAutoplay() {
    if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
    if (countdownRaf) { cancelAnimationFrame(countdownRaf); }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplayTimer = setInterval(autoplayTick, 60);
  }
})();
</script>
</body>
</html>
