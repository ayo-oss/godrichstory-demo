<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>もっと見るボタンのモーフィング — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lbm is-demo" id="lbm">
  <ul class="lbm__list" id="lbmList"></ul>
  <button class="lbm__btn" id="lbmBtn" type="button">
    <span class="lbm__label" id="lbmLabel">もっと見る（24）</span>
  </button>
</div>
</main>
<script>
(function () {
  var list = document.getElementById('lbmList');
  var btn = document.getElementById('lbmBtn');
  var label = document.getElementById('lbmLabel');
  var root = document.getElementById('lbm');

  var BATCH_SIZE = 6;
  var TOTAL = 24;
  var LOAD_DELAY_MS = 560;
  var WIDTH_LERP = 0.24;
  var PADDING_X = 40;

  var remaining = TOTAL;
  var shown = 0;
  var loading = false;
  var done = false;
  var resetting = false;
  var targetWidth = 0;
  var widthRaf = null;
  var autoplayTimer = null;

  function addCard(n) {
    var li = document.createElement('li');
    li.className = 'lbm__row';
    li.textContent = 'コメント ' + String(n).padStart(2, '0');
    list.appendChild(li);
  }
  for (var i = 0; i < 4; i += 1) { shown += 1; addCard(shown); }
  remaining = TOTAL - shown;

  // 계산 겹: 라벨 문자열이 바뀔 때마다 실제 렌더 폭(getBoundingClientRect)을 재고 그 값 + 여백을
  // 목표 너비로 삼아, 매 프레임 현재 너비를 목표 쪽으로 24% 씩 당기는 lerp 로 버튼을 모핑한다.
  function morphTo(text) {
    label.textContent = text;
    var natural = label.getBoundingClientRect().width;
    targetWidth = Math.round(natural + PADDING_X);
    if (widthRaf) { return; }
    var current = btn.getBoundingClientRect().width;
    function tick() {
      current += (targetWidth - current) * WIDTH_LERP;
      btn.style.width = current + 'px';
      if (Math.abs(targetWidth - current) > 0.5) {
        widthRaf = requestAnimationFrame(tick);
      } else {
        btn.style.width = targetWidth + 'px';
        widthRaf = null;
      }
    }
    widthRaf = requestAnimationFrame(tick);
  }

  function labelFor() {
    if (done) { return 'すべて確認しました'; }
    if (loading) { return '読み込み中'; }
    return 'もっと見る（' + remaining + ')';
  }

  function press() {
    if (loading || done) { return; }
    loading = true;
    btn.classList.add('lbm__btn--loading');
    morphTo(labelFor());
    setTimeout(function () {
      var n = Math.min(BATCH_SIZE, remaining);
      for (var k = 0; k < n; k += 1) { shown += 1; addCard(shown); }
      remaining -= n;
      loading = false;
      btn.classList.remove('lbm__btn--loading');
      if (remaining <= 0) {
        done = true;
        btn.classList.add('lbm__btn--done');
        btn.disabled = true;
      }
      morphTo(labelFor());
    }, LOAD_DELAY_MS);
  }

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    press();
  });

  function stopAutoplay() {
    if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
  }

  function autoplayTick() {
    if (done && !resetting) {
      resetting = true;
      setTimeout(function () {
        while (list.firstChild) { list.removeChild(list.firstChild); }
        shown = 0; remaining = TOTAL; done = false; resetting = false;
        btn.disabled = false;
        btn.classList.remove('lbm__btn--done');
        for (var i = 0; i < 4; i += 1) { shown += 1; addCard(shown); }
        remaining = TOTAL - shown;
        morphTo(labelFor());
      }, 700);
      return;
    }
    if (resetting || loading) { return; }
    press();
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  morphTo(labelFor());
  if (!reduce) {
    autoplayTimer = setInterval(autoplayTick, 780);
  }
})();
</script>
</body>
</html>
