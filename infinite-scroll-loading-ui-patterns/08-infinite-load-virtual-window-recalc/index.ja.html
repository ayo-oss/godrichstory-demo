<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仮想ウィンドウの再計算 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vwr is-demo" id="vwr">
  <div class="vwr__stats">
    <span class="vwr__stat" id="vwrRange">行 0 - 11 / 999</span>
    <span class="vwr__stat" id="vwrDom">描画した行 12</span>
  </div>
  <div class="vwr__view" id="vwrView">
    <div class="vwr__spacer" id="vwrTop" aria-hidden="true"></div>
    <ul class="vwr__window" id="vwrWindow"></ul>
    <div class="vwr__spacer" id="vwrBottom" aria-hidden="true"></div>
  </div>
</div>
</main>
<script>
(function () {
  var view = document.getElementById('vwrView');
  var topSpacer = document.getElementById('vwrTop');
  var bottomSpacer = document.getElementById('vwrBottom');
  var win = document.getElementById('vwrWindow');
  var rangeEl = document.getElementById('vwrRange');
  var domEl = document.getElementById('vwrDom');
  var root = document.getElementById('vwr');

  var TOTAL_ROWS = 999;
  var ROW_H = 26;
  var OVERSCAN = 2;
  var GROW_PER_TICK = 8;   // 자동 루프에서 한 틱마다 불러오는(늘어나는) 行 수

  var available = 96;      // 지금까지 불러온 行 수 (계속 늘어난다)
  var rendered = null;
  var dir = 1;
  var autoplayTimer = null;

  // 계산 겹: scrollTop 값으로 지금 보이는 인덱스 범위(start..end)를 다시 구하고, 그 범위 밖의
  // 행은 DOM 에 없다. 위·아래 여백(spacer) 높이도 범위 값에서 다시 계산해 전체 높이는 유지한다.
  function renderWindow() {
    var scrollTop = view.scrollTop;
    var first = Math.floor(scrollTop / ROW_H) - OVERSCAN;
    var visible = Math.ceil(view.clientHeight / ROW_H) + OVERSCAN * 2;
    var start = Math.max(0, Math.min(first, available - visible));
    var end = Math.min(available, start + visible);
    if (rendered === start + ':' + end) { return; }
    rendered = start + ':' + end;
    while (win.firstChild) { win.removeChild(win.firstChild); }
    for (var i = start; i < end; i += 1) {
      var li = document.createElement('li');
      li.className = 'vwr__row';
      li.textContent = '行 ' + String(i + 1).padStart(3, '0');
      win.appendChild(li);
    }
    topSpacer.style.height = (start * ROW_H) + 'px';
    bottomSpacer.style.height = Math.max(0, (available - end) * ROW_H) + 'px';
    rangeEl.textContent = '行 ' + start + ' - ' + (end - 1) + ' / ' + available;
    domEl.textContent = '描画した行 ' + (end - start);
  }
  renderWindow();

  view.addEventListener('scroll', renderWindow);

  function userTakesOver() {
    if (!root.classList.contains('is-demo')) { return; }
    root.classList.remove('is-demo');
    stopAutoplay();
  }
  view.addEventListener('wheel', userTakesOver, { passive: true });
  view.addEventListener('touchstart', userTakesOver, { passive: true });

  function autoplayTick() {
    if (available < TOTAL_ROWS) {
      available = Math.min(available + GROW_PER_TICK, TOTAL_ROWS);   // 목록이 계속 늘어난다
    }
    var max = view.scrollHeight - view.clientHeight;
    if (dir > 0 && view.scrollTop >= max - 1) { dir = -1; }
    if (dir < 0 && view.scrollTop <= 0) { dir = 1; }
    view.scrollTop = Math.min(Math.max(view.scrollTop + 7 * dir, 0), max);
    renderWindow();
  }

  function stopAutoplay() {
    if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplayTimer = setInterval(autoplayTick, 60);
  }
})();
</script>
</body>
</html>
