<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkline row that grows into a card — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="sp is-demo" id="sp">
    <figcaption class="sp__head">
      <span class="sp__title">채널별 매출 추이</span>
      <span class="sp__val" aria-live="polite" id="sp-live">행을 선택하면 카드로 확대됩니다</span>
    </figcaption>
    <div class="sp__rows" id="sp-rows" data-open="0">
      <button class="sp__row" type="button" data-i="0" aria-label="검색 12주 매출, 현재 180만원">
        <span class="sp__name">검색</span>
        <svg class="sp__spark" viewBox="0 0 100 56" preserveAspectRatio="xMidYMid meet" role="img" aria-label="검색 추이 꺾은선, 최고 180만원, 최저 120만원">
          <g class="sp__axis" aria-hidden="true">
            <line x1="2" y1="29" x2="98" y2="29"/><line x1="6" y1="50" x2="6" y2="53"/><line x1="50" y1="50" x2="50" y2="53"/><line x1="94" y1="50" x2="94" y2="53"/>
          </g>
          <line class="sp__base" x1="2" y1="50" x2="98" y2="50" aria-hidden="true"/>
          <polyline class="sp__line" points="6,46 14,38 22,42 30,33 38,27 46,30 54,22 62,17 70,20 78,13 86,16 94,8"/>
          <g class="sp__peak" aria-hidden="true"><circle cx="94" cy="8" r="3"/><text x="88" y="11" text-anchor="end">최고 180</text></g>
        </svg>
        <span class="sp__num">180<small>만원</small><i class="sp__delta">+50.0%</i></span>
      </button>
      <button class="sp__row" type="button" data-i="1" aria-label="직접 12주 매출, 현재 102만원">
        <span class="sp__name">직접</span>
        <svg class="sp__spark" viewBox="0 0 100 56" preserveAspectRatio="xMidYMid meet" role="img" aria-label="직접 추이 꺾은선, 최고 134만원, 최저 98만원">
          <g class="sp__axis" aria-hidden="true">
            <line x1="2" y1="29" x2="98" y2="29"/><line x1="6" y1="50" x2="6" y2="53"/><line x1="50" y1="50" x2="50" y2="53"/><line x1="94" y1="50" x2="94" y2="53"/>
          </g>
          <line class="sp__base" x1="2" y1="50" x2="98" y2="50" aria-hidden="true"/>
          <polyline class="sp__line" points="6,46 14,40 22,31 30,35 38,22 46,8 54,14 62,25 70,19 78,27 86,34 94,42"/>
          <g class="sp__peak" aria-hidden="true"><circle cx="46" cy="8" r="3"/><text x="40" y="11" text-anchor="end">최고 134</text></g>
        </svg>
        <span class="sp__num">102<small>만원</small><i class="sp__delta">+4.1%</i></span>
      </button>
      <button class="sp__row" type="button" data-i="2" aria-label="추천 12주 매출, 현재 118만원">
        <span class="sp__name">추천</span>
        <svg class="sp__spark" viewBox="0 0 100 56" preserveAspectRatio="xMidYMid meet" role="img" aria-label="추천 추이 꺾은선, 최고 118만원, 최저 76만원">
          <g class="sp__axis" aria-hidden="true">
            <line x1="2" y1="29" x2="98" y2="29"/><line x1="6" y1="50" x2="6" y2="53"/><line x1="50" y1="50" x2="50" y2="53"/><line x1="94" y1="50" x2="94" y2="53"/>
          </g>
          <line class="sp__base" x1="2" y1="50" x2="98" y2="50" aria-hidden="true"/>
          <polyline class="sp__line" points="6,46 14,39 22,42 30,32 38,35 46,29 54,22 62,26 70,19 78,13 86,17 94,8"/>
          <g class="sp__peak" aria-hidden="true"><circle cx="94" cy="8" r="3"/><text x="88" y="11" text-anchor="end">최고 118</text></g>
        </svg>
        <span class="sp__num">118<small>만원</small><i class="sp__delta">+55.3%</i></span>
      </button>
    </div>
    <p class="sp__hint">행에 올리거나 탭으로 닿으면 카드로 커집니다</p>
    <div class="sr"><table>
      <caption>채널별 12주 매출</caption>
      <thead><tr><th>채널</th><th>현재</th><th>최고</th><th>최저</th></tr></thead>
      <tbody>
        <tr><th>검색</th><td>180</td><td>180</td><td>120</td></tr>
        <tr><th>직접</th><td>102</td><td>134</td><td>98</td></tr>
        <tr><th>추천</th><td>118</td><td>118</td><td>76</td></tr>
      </tbody>
    </table></div>
  </figure>
</main>
<script>
// 실제 동작: 행 버튼에 닿으면(hover) 그 행만 카드로 커지고 나머지 행은 밀려난다.
// 클릭·탭은 data-open 으로 고정하고, ↑↓ 키로도 행 사이를 옮긴다(:focus-visible 확대).
// 어느 행이 열렸는지는 목록의 data-open 에만 담기고 CSS 가 grid-template-rows 를 움직인다.
var root = document.getElementById('sp');
var list = document.getElementById('sp-rows');
var rows = [].slice.call(list.querySelectorAll('.sp__row'));
var live = document.getElementById('sp-live');
var cur = 0;

rows.forEach(function (r, i) {
  r.addEventListener('pointerenter', function () {
    root.classList.remove('is-demo');
    live.textContent = r.getAttribute('aria-label');
  });
  r.addEventListener('click', function () {
    root.classList.remove('is-demo');
    var now = list.getAttribute('data-open') === String(i + 1) ? '0' : String(i + 1);
    list.setAttribute('data-open', now);
    live.textContent = r.getAttribute('aria-label');
  });
  r.addEventListener('focus', function () {
    root.classList.remove('is-demo');
    cur = i;
    live.textContent = r.getAttribute('aria-label');
  });
  r.addEventListener('blur', function () { list.setAttribute('data-open', '0'); });
});

list.addEventListener('keydown', function (e) {
  var d = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
  if (!d) return;
  e.preventDefault();
  root.classList.remove('is-demo');
  cur = Math.min(Math.max(cur + d, 0), rows.length - 1);
  rows[cur].focus({ preventScroll: true });
});
</script>
</body>
</html>
