<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Period segment control that reflows the bars — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="pg is-demo" id="pg" data-period="7">
    <figcaption class="pg__head">
      <span class="pg__title">Visits by period</span>
      <span class="pg__sum">
        <span class="pg__k">avg</span><span class="pg__n pg__n--avg" aria-hidden="true"></span><span class="pg__u"> visits</span>
        <span class="pg__slash" aria-hidden="true">/</span>
        <span class="pg__k">peak</span><span class="pg__n pg__n--max" aria-hidden="true"></span><span class="pg__u"> visits</span>
      </span>
    </figcaption>

    <div class="pg__seg" role="tablist" aria-label="Choose a period">
      <span class="pg__ind" aria-hidden="true"></span>
      <button class="pg__tab" type="button" role="tab" aria-selected="true" tabindex="0">7 days</button>
      <button class="pg__tab" type="button" role="tab" aria-selected="false" tabindex="-1">30 days</button>
      <button class="pg__tab" type="button" role="tab" aria-selected="false" tabindex="-1">90 days</button>
    </div>

    <div class="pg__plot" role="img" aria-label="Visit bars in 8 buckets. 7-day avg 343, peak 430">
      <span class="pg__bar"></span><span class="pg__bar"></span><span class="pg__bar"></span><span class="pg__bar"></span>
      <span class="pg__bar"></span><span class="pg__bar"></span><span class="pg__bar"></span><span class="pg__bar"></span>
    </div>

    <p class="pg__hint">Pick a period and the same 8 slots flow into new values</p>

    <div class="sr">
      <span aria-live="polite" id="pg-live"></span>
      <table>
        <caption>Visitors in 8 buckets</caption>
        <thead><tr><th>Bucket</th><th>7 days</th><th>30 days</th><th>90 days</th></tr></thead>
        <tbody>
          <tr><th>1</th><td>312</td><td>258</td><td>198</td></tr>
          <tr><th>2</th><td>268</td><td>296</td><td>235</td></tr>
          <tr><th>3</th><td>401</td><td>221</td><td>262</td></tr>
          <tr><th>4</th><td>355</td><td>340</td><td>214</td></tr>
          <tr><th>5</th><td>289</td><td>372</td><td>289</td></tr>
          <tr><th>6</th><td>430</td><td>305</td><td>246</td></tr>
          <tr><th>7</th><td>372</td><td>264</td><td>310</td></tr>
          <tr><th>8</th><td>317</td><td>288</td><td>270</td></tr>
        </tbody>
      </table>
    </div>
  </figure>
</main>
<script>
// 실제 동작: JS 는 고른 칸을 data-period 와 aria-selected 에만 적는다.
// 막대 8칸의 높이(--h)·밑줄 위치(--seg)·요약 숫자(--avg --max)는 전부 CSS 가
// data-period 를 읽어 정한다 — 그래서 화면과 보조기술이 갈라질 자리가 없다.
var pg = document.getElementById('pg');
var live = document.getElementById('pg-live');
var tabs = [].slice.call(pg.querySelectorAll('.pg__tab'));
var KEY = ['7', '30', '90'];          // data-period 값 (번역 대상이 아니다)
var AVG = [343, 293, 253];            // 표의 여덟 값 avg — 2744/8 · 2344/8 · 2024/8
var MAX = [430, 372, 310];            // 표의 여덟 값 중 최댓값
var cur = 0;

function pick(i) {
  cur = (i + 3) % 3;
  pg.classList.remove('is-demo');
  pg.dataset.period = KEY[cur];
  tabs.forEach(function (t, k) {
    t.setAttribute('aria-selected', k === cur ? 'true' : 'false');
    t.tabIndex = k === cur ? 0 : -1;
  });
  live.textContent = tabs[cur].textContent + ' avg ' + AVG[cur] + ' visits, peak ' + MAX[cur] + ' visits';
}
tabs.forEach(function (t, i) {
  t.addEventListener('click', function () { pick(i); });
  t.addEventListener('keydown', function (e) {
    var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!d) { return; }
    e.preventDefault();
    pick(i + d);
    tabs[cur].focus({ preventScroll: true });
  });
});
</script>
</body>
</html>
