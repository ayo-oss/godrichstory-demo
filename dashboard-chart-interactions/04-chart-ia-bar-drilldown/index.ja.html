<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A month bar splits into days in place — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="dd is-demo" id="dd">
    <figcaption class="dd__head">
      <span class="dd__title">月間の注文</span>
      <span class="dd__right">
        <button class="dd__back" type="button" id="dd-back" aria-label="戻る" disabled>
          <svg class="dd__bic" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><g fill="currentColor"><path d="M160 48v160l-80-80Z" opacity=".2"/><path d="M163.06 40.61a8 8 0 0 0-8.72 1.73l-80 80a8 8 0 0 0 0 11.32l80 80A8 8 0 0 0 168 208V48a8 8 0 0 0-4.94-7.39M152 188.69L91.31 128L152 67.31Z"/></g></svg>
          <span class="dd__btext">戻る</span>
        </button>
        <span class="dd__val"><span class="dd__lab">合計</span> <span aria-live="polite" id="dd-num">486件</span></span>
      </span>
    </figcaption>
    <div class="dd__plot" role="img" aria-label="月間注文の棒グラフ。10月の91件が最も高く、11月の70件が最も低い">
      <div class="dd__cols">
        <button class="dd__col" type="button" data-m="0" aria-expanded="false">
          <span class="dd__spot">
            <i class="dd__day" style="--h:15.4%; --i:0"></i>
            <i class="dd__day" style="--h:19.8%; --i:1"></i>
            <i class="dd__day" style="--h:13.2%; --i:2"></i>
            <i class="dd__day" style="--h:22%; --i:3"></i>
            <i class="dd__day" style="--h:17.6%; --i:4"></i>
            <i class="dd__month" style="--h:87.9%"></i>
          </span>
          <span class="dd__mlab">7月</span>
        </button>
        <button class="dd__col" type="button" data-m="1" aria-expanded="false">
          <span class="dd__spot">
            <i class="dd__day" style="--h:17.6%; --i:0"></i>
            <i class="dd__day" style="--h:15.4%; --i:1"></i>
            <i class="dd__day" style="--h:20.9%; --i:2"></i>
            <i class="dd__day" style="--h:16.5%; --i:3"></i>
            <i class="dd__day" style="--h:19.8%; --i:4"></i>
            <i class="dd__month" style="--h:90.1%"></i>
          </span>
          <span class="dd__mlab">8月</span>
        </button>
        <button class="dd__col" type="button" data-m="2" aria-expanded="false">
          <span class="dd__spot">
            <i class="dd__day" style="--h:13.2%; --i:0"></i>
            <i class="dd__day" style="--h:18.7%; --i:1"></i>
            <i class="dd__day" style="--h:23.1%; --i:2"></i>
            <i class="dd__day" style="--h:14.3%; --i:3"></i>
            <i class="dd__day" style="--h:16.5%; --i:4"></i>
            <i class="dd__month" style="--h:85.7%"></i>
          </span>
          <span class="dd__mlab">9月</span>
        </button>
        <button class="dd__col" type="button" data-m="3" aria-expanded="false">
          <span class="dd__spot">
            <i class="dd__day" style="--h:20.9%; --i:0"></i>
            <i class="dd__day" style="--h:16.5%; --i:1"></i>
            <i class="dd__day" style="--h:18.7%; --i:2"></i>
            <i class="dd__day" style="--h:24.2%; --i:3"></i>
            <i class="dd__day" style="--h:19.8%; --i:4"></i>
            <i class="dd__month" style="--h:100%"></i>
          </span>
          <span class="dd__mlab">10月</span>
        </button>
        <button class="dd__col" type="button" data-m="4" aria-expanded="false">
          <span class="dd__spot">
            <i class="dd__day" style="--h:16.5%; --i:0"></i>
            <i class="dd__day" style="--h:13.2%; --i:1"></i>
            <i class="dd__day" style="--h:17.6%; --i:2"></i>
            <i class="dd__day" style="--h:15.4%; --i:3"></i>
            <i class="dd__day" style="--h:14.3%; --i:4"></i>
            <i class="dd__month" style="--h:76.9%"></i>
          </span>
          <span class="dd__mlab">11月</span>
        </button>
        <button class="dd__col" type="button" data-m="5" aria-expanded="false">
          <span class="dd__spot">
            <i class="dd__day" style="--h:18.7%; --i:0"></i>
            <i class="dd__day" style="--h:22%; --i:1"></i>
            <i class="dd__day" style="--h:15.4%; --i:2"></i>
            <i class="dd__day" style="--h:19.8%; --i:3"></i>
            <i class="dd__day" style="--h:17.6%; --i:4"></i>
            <i class="dd__month" style="--h:93.4%"></i>
          </span>
          <span class="dd__mlab">12月</span>
        </button>
      </div>
    </div>
    <p class="dd__hint">棒を押すとその月が立っていた場所で日別に広がります</p>
    <div class="sr"><table>
      <caption>月間の注文合計</caption>
      <thead><tr><th>月</th><th>注文</th></tr></thead>
      <tbody>
        <tr><th>7月</th><td>80</td></tr>
        <tr><th>8月</th><td>82</td></tr>
        <tr><th>9月</th><td>78</td></tr>
        <tr><th>10月</th><td>91</td></tr>
        <tr><th>11月</th><td>70</td></tr>
        <tr><th>12月</th><td>85</td></tr>
      </tbody>
    </table></div>
  </figure>
</main>
<script>
// 드릴다운은 화면 교체가 아니라 같은 자리의 변형이다.
// 일별 막대 5개는 처음부터 月 막대와 같은 자리에 겹쳐 있다(月 막대가 위에 얹혀 가려 둔다).
// 열면 月 막대가 scaleY(0) 으로 비켜나고(--origin: bottom) 일별이 translateX+scaleX 로 벌어진다.
var dd = document.getElementById('dd');
var cols = dd.querySelectorAll('.dd__col');
var back = document.getElementById('dd-back');
var num = document.getElementById('dd-num');
var M = [80, 82, 78, 91, 70, 85];
var LAB = ['7月', '8月', '9月', '10月', '11月', '12月'];
var open = -1;

function setOpen(i) {
  dd.classList.remove('is-demo');
  open = i;
  if (i < 0) {
    dd.removeAttribute('data-open');
    num.textContent = '486件';
  } else {
    dd.setAttribute('data-open', String(i));
    num.textContent = LAB[i] + ' · ' + M[i] + '件';
  }
  for (var k = 0; k < cols.length; k++) cols[k].setAttribute('aria-expanded', String(k === i));
  back.disabled = i < 0;
}
for (var j = 0; j < cols.length; j++) {
  (function (k) {
    cols[k].addEventListener('click', function () { setOpen(open === k ? -1 : k); });
  })(j);
}
back.addEventListener('click', function () {
  setOpen(-1);
  back.focus({ preventScroll: true });
});
</script>
</body>
</html>
