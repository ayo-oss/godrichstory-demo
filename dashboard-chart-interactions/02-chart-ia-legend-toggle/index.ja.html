<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legend toggle that regrows the remaining bars — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="lg is-demo" id="lg">
    <figcaption class="lg__head">
      <span class="lg__title">チャネル別流入</span>
      <span class="lg__sum"><span class="lg__lab">軸の最大</span> <span class="lg__val" aria-hidden="true"><i class="lg__n"></i>人</span></span>
    </figcaption>
    <div class="lg__plot" role="img" aria-label="チャネル別流入の棒グラフ。検索が最も高く5月の460人が最大、直接は最大260人、紹介は最大190人">
      <div class="lg__groups">
        <div class="lg__group">
          <i class="lg__bar" data-s="0" data-m="0" style="--b:91.3%"></i>
          <i class="lg__bar" data-s="1" data-m="0" style="--b:52.2%"></i>
          <i class="lg__bar" data-s="2" data-m="0" style="--b:32.6%"></i>
        </div>
        <div class="lg__group">
          <i class="lg__bar" data-s="0" data-m="1" style="--b:82.6%"></i>
          <i class="lg__bar" data-s="1" data-m="1" style="--b:56.5%"></i>
          <i class="lg__bar" data-s="2" data-m="1" style="--b:41.3%"></i>
        </div>
        <div class="lg__group">
          <i class="lg__bar" data-s="0" data-m="2" style="--b:100%"></i>
          <i class="lg__bar" data-s="1" data-m="2" style="--b:43.5%"></i>
          <i class="lg__bar" data-s="2" data-m="2" style="--b:28.3%"></i>
        </div>
        <div class="lg__group">
          <i class="lg__bar" data-s="0" data-m="3" style="--b:95.7%"></i>
          <i class="lg__bar" data-s="1" data-m="3" style="--b:54.3%"></i>
          <i class="lg__bar" data-s="2" data-m="3" style="--b:37%"></i>
        </div>
      </div>
      <div class="lg__axis" aria-hidden="true">
        <span>3月</span><span>4月</span><span>5月</span><span>6月</span>
      </div>
    </div>
    <div class="lg__chips" role="group" aria-label="表示する系列を選ぶ">
      <button class="lg__chip" type="button" data-s="0" aria-pressed="true"><i class="lg__dot" aria-hidden="true"></i>検索</button>
      <button class="lg__chip" type="button" data-s="1" aria-pressed="true"><i class="lg__dot" aria-hidden="true"></i>直接</button>
      <button class="lg__chip" type="button" data-s="2" aria-pressed="true"><i class="lg__dot" aria-hidden="true"></i>紹介</button>
    </div>
    <p class="lg__hint">チップを押して系列を消すと軸が引き直されます</p>
    <span class="sr" aria-live="polite" id="lg-live">軸の最大 460</span>
    <div class="sr"><table>
      <caption>チャネル別の月間流入</caption>
      <thead><tr><th>月</th><th>検索</th><th>直接</th><th>紹介</th></tr></thead>
      <tbody>
        <tr><th>3月</th><td>420</td><td>240</td><td>150</td></tr>
        <tr><th>4月</th><td>380</td><td>260</td><td>190</td></tr>
        <tr><th>5月</th><td>460</td><td>200</td><td>130</td></tr>
        <tr><th>6月</th><td>440</td><td>250</td><td>170</td></tr>
      </tbody>
    </table></div>
  </figure>
</main>
<script>
// 범례 토글의 핵심은 "숨기기"가 아니라 "축 다시 잡기"다.
// 칩을 끄면 (1) 그 계열 막대는 scaleY(0) 로 바닥에 접히고(transform-origin: bottom),
// (2) 남은 계열의 최댓값으로 축을 다시 계산해 각 막대의 --h 를 다시 쓴다.
// --h 는 @property 로 등록한 <percentage> 라 transition 이 값을 보간한다 —
// 등록 안 된 커스텀 속성은 문자열이라 값이 바뀌어도 뛰어넘는다.
var lg = document.getElementById('lg');
var live = document.getElementById('lg-live');
var bars = lg.querySelectorAll('.lg__bar');
var chips = lg.querySelectorAll('.lg__chip');
var V = [[420, 380, 460, 440], [240, 260, 200, 250], [150, 190, 130, 170]];

function apply() {
  lg.classList.remove('is-demo');
  var on = [], max = 0;
  for (var k = 0; k < 3; k++) if (chips[k].getAttribute('aria-pressed') === 'true') on.push(k);
  on.forEach(function (k) { V[k].forEach(function (v) { if (v > max) max = v; }); });
  for (var i = 0; i < bars.length; i++) {
    var b = bars[i], s = +b.getAttribute('data-s');
    if (on.indexOf(s) < 0) { b.setAttribute('data-fold', '1'); }
    else {
      b.removeAttribute('data-fold');
      b.style.setProperty('--h', (max ? V[s][+b.getAttribute('data-m')] / max * 100 : 0).toFixed(1) + '%');
    }
  }
  lg.style.setProperty('--mx', String(max));
  live.textContent = '軸の最大 ' + max + '人';
}
chips.forEach(function (c) {
  c.addEventListener('click', function () {
    c.setAttribute('aria-pressed', String(c.getAttribute('aria-pressed') !== 'true'));
    apply();
  });
});
</script>
</body>
</html>
