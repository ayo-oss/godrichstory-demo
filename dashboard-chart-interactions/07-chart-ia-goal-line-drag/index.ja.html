<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draggable goal line that recolors cleared bars — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="gl is-demo" id="gl">
    <figcaption class="gl__head">
      <span class="gl__title">日別の訪問と目標</span>
      <span class="gl__stat" aria-hidden="true">目標 <b class="gl__n gl__n--v"></b>人 · 達成 <b class="gl__n gl__n--c"></b>/7</span>
    </figcaption>

    <div class="gl__zone">
      <div class="gl__bars" role="img" aria-label="7日分の訪問バーと300人の目標線。月245、火312、水198、木368、金276、土154、日332人">
        <span class="gl__bar"></span>
        <span class="gl__bar" data-over="1"></span>
        <span class="gl__bar"></span>
        <span class="gl__bar" data-over="1"></span>
        <span class="gl__bar"></span>
        <span class="gl__bar"></span>
        <span class="gl__bar" data-over="1"></span>
      </div>
      <div class="gl__goal">
        <span class="gl__rail" aria-hidden="true"></span>
        <button class="gl__grab" type="button" role="slider" aria-orientation="vertical"
                aria-label="目標線をドラッグ" aria-valuemin="50" aria-valuemax="400"
                aria-valuenow="300" aria-valuetext="300人" id="gl-grab">
          <svg class="gl__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M176 128a48 48 0 1 1-48-48a48 48 0 0 1 48 48" opacity=".2"/><path d="M221.87 83.16A104.1 104.1 0 1 1 195.67 49l22.67-22.68a8 8 0 0 1 11.32 11.32l-96 96a8 8 0 0 1-11.32-11.32l27.72-27.72a40 40 0 1 0 17.87 31.09a8 8 0 1 1 16-.9a56 56 0 1 1-22.38-41.65l22.75-22.75a87.88 87.88 0 1 0 23.13 29.67a8 8 0 0 1 14.44-6.9"/></g></svg>
        </button>
      </div>
    </div>

    <div class="gl__days" aria-hidden="true">
      <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span>
    </div>

    <p class="gl__hint">目標線を引き上げると超えたバーだけ色が変わります</p>

    <div class="sr">
      <span aria-live="polite" id="gl-live"></span>
      <table>
        <caption>曜日別の訪問者数</caption>
        <thead><tr><th>曜日</th><th>訪問</th></tr></thead>
        <tbody>
          <tr><th>月</th><td>245</td></tr><tr><th>火</th><td>312</td></tr><tr><th>水</th><td>198</td></tr>
          <tr><th>木</th><td>368</td></tr><tr><th>金</th><td>276</td></tr><tr><th>土</th><td>154</td></tr>
          <tr><th>日</th><td>332</td></tr>
        </tbody>
      </table>
    </div>
  </figure>
</main>
<script>
// 실제 동작: 드래그(pointerdown → setPointerCapture → pointermove)로 목표값을 바꾸면
// JS 는 등록된 커스텀 속성 세 개(--goal 위치 · --gv 값 · --n 달성 개수)와 막대의
// data-over 만 고친다. 색·선·숫자는 전부 CSS 가 그 값들을 읽어 그린다.
var root = document.getElementById('gl');
var grab = document.getElementById('gl-grab');
var live = document.getElementById('gl-live');
var bars = [].slice.call(root.querySelectorAll('.gl__bar'));
var DATA = [245, 312, 198, 368, 276, 154, 332];   // 표와 같은 값
var MIN = 50, MAX = 400;

function setGoal(v) {
  v = Math.max(MIN, Math.min(MAX, Math.round(v)));
  var n = 0;
  bars.forEach(function (b, i) {
    var over = DATA[i] >= v ? '1' : '0';
    b.dataset.over = over;
    if (over === '1') { n += 1; }
  });
  root.style.setProperty('--goal', v / 4 + '%');   // 세로 축 상한 400人 = 100%
  root.style.setProperty('--gv', String(v));
  root.style.setProperty('--n', String(n));
  grab.setAttribute('aria-valuenow', String(v));
  grab.setAttribute('aria-valuetext', v + '人');
  live.textContent = '目標 ' + v + '人、達成 ' + n + '/7';
}
function fromPointer(e) {
  var r = root.querySelector('.gl__zone').getBoundingClientRect();
  setGoal((1 - (e.clientY - r.top) / r.height) * MAX);
}
grab.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  grab.setPointerCapture(e.pointerId);
  fromPointer(e);
});
grab.addEventListener('pointermove', function (e) {
  if (grab.hasPointerCapture(e.pointerId)) { fromPointer(e); }
});
grab.addEventListener('keydown', function (e) {
  var now = Number(grab.getAttribute('aria-valuenow'));
  var v = null;
  if (e.key === 'ArrowUp') { v = now + 10; }
  if (e.key === 'ArrowDown') { v = now - 10; }
  if (e.key === 'Home') { v = MIN; }
  if (e.key === 'End') { v = MAX; }
  if (v !== null) { e.preventDefault(); root.classList.remove('is-demo'); setGoal(v); }
});
</script>
</body>
</html>
