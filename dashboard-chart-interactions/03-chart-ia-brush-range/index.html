<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brush a range and the total recounts — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="br is-demo" id="br">
    <figcaption class="br__head">
      <span class="br__title">14일 매출</span>
      <span class="br__sum"><span class="br__lab">합계</span> <span class="br__val" aria-hidden="true"><i class="br__n"></i><span class="br__u">만원</span> · <i class="br__d"></i><span class="br__u">일</span></span></span>
    </figcaption>
    <div class="br__plot" role="img" aria-label="14일 매출 막대 그래프. 7일째 18만원이 가장 높고 11일째 7만원이 가장 낮다">
      <div class="br__track">
        <i class="br__bar" data-far="1" data-in="0" style="--b:66.7%"></i>
        <i class="br__bar" data-far="1" data-in="0" style="--b:50%"></i>
        <i class="br__bar" data-far="1" data-in="0" style="--b:77.8%"></i>
        <i class="br__bar" data-far="1" data-in="0" style="--b:61.1%"></i>
        <i class="br__bar" data-in="1" style="--b:44.4%"></i>
        <i class="br__bar" data-in="1" style="--b:83.3%"></i>
        <i class="br__bar" data-in="1" style="--b:100%"></i>
        <i class="br__bar" data-in="1" style="--b:88.9%"></i>
        <i class="br__bar" data-in="1" style="--b:55.6%"></i>
        <i class="br__bar" data-far="1" data-in="0" style="--b:72.2%"></i>
        <i class="br__bar" data-far="1" data-in="0" style="--b:38.9%"></i>
        <i class="br__bar" data-far="1" data-in="0" style="--b:61.1%"></i>
        <i class="br__bar" data-far="1" data-in="0" style="--b:50%"></i>
        <i class="br__bar" data-far="1" data-in="0" style="--b:66.7%"></i>
      </div>
      <i class="br__band" aria-hidden="true"></i>
      <button class="br__hot" type="button" id="br-hot" aria-label="구간 긁기 — 끝점은 ←→ · 시작점은 Shift+←→"></button>
    </div>
    <p class="br__hint">막대를 옆으로 긁거나 ←→ 로 구간을 고르세요</p>
    <span class="sr" aria-live="polite" id="br-live">67만원 · 5일</span>
    <div class="sr"><table>
      <caption>14일 일별 매출</caption>
      <thead><tr><th>날짜</th><th>매출</th></tr></thead>
      <tbody>
        <tr><th>1</th><td>12</td></tr><tr><th>2</th><td>9</td></tr><tr><th>3</th><td>14</td></tr><tr><th>4</th><td>11</td></tr>
        <tr><th>5</th><td>8</td></tr><tr><th>6</th><td>15</td></tr><tr><th>7</th><td>18</td></tr><tr><th>8</th><td>16</td></tr>
        <tr><th>9</th><td>10</td></tr><tr><th>10</th><td>13</td></tr><tr><th>11</th><td>7</td></tr><tr><th>12</th><td>11</td></tr>
        <tr><th>13</th><td>9</td></tr><tr><th>14</th><td>12</td></tr>
      </tbody>
    </table></div>
  </figure>
</main>
<script>
// 브러시의 상태는 정수 두 개(--s 시작칸, --e 끝칸)뿐이다.
// 밝은 띠의 위치·폭은 CSS 가 이 두 값을 transform 으로 계산하고,
// 각 막대의 안팎은 data-in 속성만 읽어 칠한다 — JS 가 스타일을 직접 만지지 않는다.
var br = document.getElementById('br');
var hot = document.getElementById('br-hot');
var live = document.getElementById('br-live');
var bars = br.querySelectorAll('.br__bar');
var V = [12, 9, 14, 11, 8, 15, 18, 16, 10, 13, 7, 11, 9, 12];
var N = 14, s = 4, e = 8;

function idx(x) {
  var r = hot.getBoundingClientRect();
  var t = Math.min(Math.max((x - r.left) / r.width, 0), 1);
  return Math.min(Math.max(Math.round(t * (N - 1)), 0), N - 1);
}
function apply() {
  var sum = 0;
  for (var i = 0; i < N; i++) {
    var inn = i >= s && i <= e;
    bars[i].setAttribute('data-in', inn ? '1' : '0');
    if (inn) sum += V[i];
  }
  br.style.setProperty('--s', String(s));
  br.style.setProperty('--e', String(e));
  br.style.setProperty('--n', String(sum));
  br.style.setProperty('--d', String(e - s + 1));
  live.textContent = sum + '만원 · ' + (e - s + 1) + '일';
}
// 마우스·터치 공용: 누른 점을 붙잡고(pointer capture) 옆으로 긁는다
hot.addEventListener('pointerdown', function (ev) {
  br.classList.remove('is-demo');
  hot.setPointerCapture(ev.pointerId);
  var a = idx(ev.clientX);
  function move(m) { s = Math.min(a, idx(m.clientX)); e = Math.max(a, idx(m.clientX)); apply(); }
  function up() { hot.removeEventListener('pointermove', move); hot.removeEventListener('pointerup', up); }
  hot.addEventListener('pointermove', move);
  hot.addEventListener('pointerup', up);
  move(ev);
});
// 키보드: ←→ 는 끝점, Shift+←→ 는 시작점 — 벗어난 쪽이 반대편을 넘지 못하게 붙잡는다
hot.addEventListener('keydown', function (ev) {
  var d = ev.key === 'ArrowRight' ? 1 : ev.key === 'ArrowLeft' ? -1 : 0;
  if (!d) { if (ev.key === 'Home' || ev.key === 'End') { ev.preventDefault(); s = e = ev.key === 'Home' ? 0 : N - 1; apply(); } return; }
  ev.preventDefault();
  if (ev.shiftKey) { s = Math.min(Math.max(s + d, 0), e); } else { e = Math.min(Math.max(e + d, s), N - 1); }
  apply();
  hot.focus({ preventScroll: true });
});
</script>
</body>
</html>
