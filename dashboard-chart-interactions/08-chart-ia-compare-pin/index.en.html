<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pin two points to compare — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="cmp is-demo" id="cmp" data-a="0">
    <figcaption class="cmp__head">
      <span class="cmp__title">Weekly signups</span>
      <span class="cmp__val" aria-live="polite" id="cmp-live">Pin two points to compare</span>
    </figcaption>
    <div class="cmp__plot">
      <svg class="cmp__svg" viewBox="0 0 320 136" role="img" aria-label="Signup trend over 8 weeks, up from 128 in week 1 to 262 in week 8">
        <g class="cmp__grid" aria-hidden="true">
          <line x1="0" y1="28" x2="320" y2="28"/><line x1="0" y1="68" x2="320" y2="68"/><line x1="0" y1="108" x2="320" y2="108"/>
        </g>
        <g class="cmp__labels" aria-hidden="true">
          <text x="20" y="131">W1</text><text x="60" y="131">W2</text><text x="100" y="131">W3</text><text x="140" y="131">W4</text><text x="180" y="131">W5</text><text x="220" y="131">W6</text><text x="260" y="131">W7</text><text x="300" y="131">W8</text>
        </g>
        <polyline class="cmp__line" points="20,112 60,97 100,104 140,76 180,46 220,62 260,38 300,28"/>
        <g class="cmp__link" aria-hidden="true">
          <g class="cmp__linkpos">
            <g class="cmp__draw1"><line class="cmp__l1" id="cmp-line" x1="0" y1="0" x2="280" y2="-84"/></g>
            <g class="cmp__draw2"><line class="cmp__l2" x1="0" y1="0" x2="-120" y2="18"/></g>
          </g>
        </g>
        <g class="cmp__pinB" aria-hidden="true">
          <g class="cmp__pinBIn"><circle class="cmp__bring" r="7"/><circle class="cmp__bdot" r="2.5"/></g>
        </g>
        <g class="cmp__badge cmp__badge1" aria-hidden="true">
          <g class="cmp__badgeIn"><rect x="-34" y="-11" width="68" height="22" rx="8"/><text x="0" y="4" text-anchor="middle">+104.7%</text></g>
        </g>
        <g class="cmp__badge cmp__badge2" aria-hidden="true">
          <g class="cmp__badgeIn"><rect x="-34" y="-11" width="68" height="22" rx="8"/><text x="0" y="4" text-anchor="middle">−11.1%</text></g>
        </g>
        <g class="cmp__base" aria-hidden="true">
          <g class="cmp__baseIn"><circle class="cmp__aring" r="7.5"/><circle class="cmp__adot" r="2.5"/></g>
        </g>
      </svg>
      <button class="cmp__pt" type="button" tabindex="0" aria-pressed="true" aria-label="W1 · 128" style="left:6.25%;top:82.4%"><span class="cmp__dot" aria-hidden="true"></span></button>
      <button class="cmp__pt" type="button" tabindex="-1" aria-pressed="false" aria-label="W2 · 152" style="left:18.75%;top:71.3%"><span class="cmp__dot" aria-hidden="true"></span></button>
      <button class="cmp__pt" type="button" tabindex="-1" aria-pressed="false" aria-label="W3 · 141" style="left:31.25%;top:76.5%"><span class="cmp__dot" aria-hidden="true"></span></button>
      <button class="cmp__pt" type="button" tabindex="-1" aria-pressed="false" aria-label="W4 · 186" style="left:43.75%;top:55.9%"><span class="cmp__dot" aria-hidden="true"></span></button>
      <button class="cmp__pt" type="button" tabindex="-1" aria-pressed="false" aria-label="W5 · 233" style="left:56.25%;top:33.8%"><span class="cmp__dot" aria-hidden="true"></span></button>
      <button class="cmp__pt" type="button" tabindex="-1" aria-pressed="false" aria-label="W6 · 208" style="left:68.75%;top:45.6%"><span class="cmp__dot" aria-hidden="true"></span></button>
      <button class="cmp__pt" type="button" tabindex="-1" aria-pressed="false" aria-label="W7 · 246" style="left:81.25%;top:27.9%"><span class="cmp__dot" aria-hidden="true"></span></button>
      <button class="cmp__pt" type="button" tabindex="-1" aria-pressed="false" aria-label="W8 · 262" style="left:93.75%;top:20.6%"><span class="cmp__dot" aria-hidden="true"></span></button>
    </div>
    <p class="cmp__hint">Pin one point as the baseline, then another to reveal the gap</p>
    <div class="sr"><table>
      <caption>Weekly signups</caption>
      <tbody><tr><th>W1</th><td>128</td></tr><tr><th>W2</th><td>152</td></tr><tr><th>W3</th><td>141</td></tr><tr><th>W4</th><td>186</td></tr><tr><th>W5</th><td>233</td></tr><tr><th>W6</th><td>208</td></tr><tr><th>W7</th><td>246</td></tr><tr><th>W8</th><td>262</td></tr></tbody>
    </table></div>
  </figure>
</main>
<script>
// 실제 동작: 점 버튼을 찍으면 첫 점이 기준(aria-pressed)이 되고, 두 번째 점을 찍으면
// 두 점을 잇는 점선과 차이 값 배지가 뜬다. 세 번째 찍기는 기준을 그 점으로 옮긴다.
// 좌표는 --ax/--ay(기준) --bx/--by(비교 핀) --mx/--my(배지 중간점) 여섯 값으로만 나가고
// 점선·배지·둘째 핀의 등장은 CSS 가 [data-b] 유무로 결정한다.
var root = document.getElementById('cmp');
var btns = [].slice.call(root.querySelectorAll('.cmp__pt'));
var live = document.getElementById('cmp-live');
var line = document.getElementById('cmp-line');
var badge = root.querySelector('.cmp__badge1 text');
var xs = [20, 60, 100, 140, 180, 220, 260, 300];
var ys = [112, 97, 104, 76, 46, 62, 38, 28];
var vs = [128, 152, 141, 186, 233, 208, 246, 262];
var a = 0, b = null, cur = 0;

function put(k, v) { root.style.setProperty(k, v); }

function draw() {
  btns.forEach(function (t, i) {
    t.setAttribute('aria-pressed', i === a ? 'true' : 'false');
    t.tabIndex = i === cur ? 0 : -1;
  });
  put('--ax', xs[a] + 'px');
  put('--ay', ys[a] + 'px');
  if (b === null) {
    root.removeAttribute('data-b');
    live.textContent = btns[a].getAttribute('aria-label');
    return;
  }
  put('--bx', xs[b] + 'px');
  put('--by', ys[b] + 'px');
  put('--mx', (xs[a] + xs[b]) / 2 + 'px');
  put('--my', (ys[a] + ys[b]) / 2 + 'px');
  line.setAttribute('x2', xs[b] - xs[a]);
  line.setAttribute('y2', ys[b] - ys[a]);
  var d = (vs[b] - vs[a]) / vs[a] * 100;
  var pct = (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(1) + '%';
  badge.textContent = pct;
  root.setAttribute('data-b', '1');
  live.textContent = btns[a].getAttribute('aria-label') + ' · ' + btns[b].getAttribute('aria-label') + ' · ' + pct;
}

function pin(i) {
  root.classList.remove('is-demo');
  if (b !== null) { a = i; b = null; }   // 세 번째 찍기: 기준 이동, 둘째 핀 해제
  else if (i !== a) { b = i; }           // 두 번째 찍기: 비교 핀
  draw();
}

btns.forEach(function (t, i) {
  t.addEventListener('click', function () { cur = i; pin(i); });
  t.addEventListener('focus', function () { cur = i; root.classList.remove('is-demo'); });
});

root.addEventListener('keydown', function (e) {
  var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (!d) return;
  e.preventDefault();
  root.classList.remove('is-demo');
  cur = Math.min(Math.max(cur + d, 0), btns.length - 1);
  btns[cur].focus({ preventScroll: true });
});
</script>
</body>
</html>
