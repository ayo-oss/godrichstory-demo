<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crosshair that snaps to the nearest point — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="ch is-demo" id="ch">
    <figcaption class="ch__head">
      <span class="ch__title">주간 방문</span>
      <span class="ch__val" aria-live="polite" id="ch-val">5일 · 398명</span>
    </figcaption>
    <div class="ch__plot">
      <svg class="ch__svg" viewBox="0 0 320 132" role="img" aria-label="12일간 방문자 추이 꺾은선. 5일 398명, 12일 401명이 높은 봉우리">
        <g class="ch__grid" aria-hidden="true">
          <line x1="0" y1="24" x2="320" y2="24"/><line x1="0" y1="60" x2="320" y2="60"/><line x1="0" y1="96" x2="320" y2="96"/>
        </g>
        <polyline class="ch__line" points="14,66 40,54 66,58 92,47 118,27 144,39 170,53 196,42 222,29 248,45 274,36 300,25"/>
        <g class="ch__dots" aria-hidden="true">
          <circle cx="14" cy="66" r="3"/><circle cx="40" cy="54" r="3"/><circle cx="66" cy="58" r="3"/><circle cx="92" cy="47" r="3"/><circle cx="118" cy="27" r="3"/><circle cx="144" cy="39" r="3"/><circle cx="170" cy="53" r="3"/><circle cx="196" cy="42" r="3"/><circle cx="222" cy="29" r="3"/><circle cx="248" cy="45" r="3"/><circle cx="274" cy="36" r="3"/><circle cx="300" cy="25" r="3"/>
        </g>
        <g class="ch__cursor" aria-hidden="true">
          <line class="ch__x" x1="0" y1="6" x2="0" y2="112"/>
          <g class="ch__mark"><circle class="ch__ring" r="7"/></g>
          <g class="ch__tip"><g class="ch__tipbox"><rect x="-31" y="-32" width="62" height="24" rx="6"/><text x="0" y="-15" text-anchor="middle">398명</text></g></g>
        </g>
      </svg>
      <button class="ch__hot" type="button" id="ch-hot" aria-label="꺾은선 위 이동 — 날짜별 값 읽기"></button>
    </div>
    <p class="ch__hint">선 위를 옮기면 가장 가까운 날에 붙습니다</p>
    <div class="sr"><table>
      <caption>12일간 방문자 수</caption>
      <tbody><tr><th>1일</th><td>220</td></tr><tr><th>2일</th><td>268</td></tr><tr><th>3일</th><td>254</td></tr><tr><th>4일</th><td>305</td></tr><tr><th>5일</th><td>398</td></tr><tr><th>6일</th><td>342</td></tr><tr><th>7일</th><td>287</td></tr><tr><th>8일</th><td>331</td></tr><tr><th>9일</th><td>376</td></tr><tr><th>10일</th><td>309</td></tr><tr><th>11일</th><td>352</td></tr><tr><th>12일</th><td>401</td></tr></tbody>
    </table></div>
  </figure>
</main>
<script>
// 실제 동작: pointermove 의 x 를 12칸 중 가장 가까운 칸으로 반올림해 **스냅**한다.
// 결과는 커스텀 속성 두 개(--i 칸 번호, --y 그 점의 높이)로만 나가고,
// 세로선·고리·툴팁은 전부 그 두 값을 읽는 같은 그룹 안에 있다 — 그래서 절대 어긋나지 않는다.
var N = 12;
var ch = document.getElementById('ch');
var hot = document.getElementById('ch-hot');
var val = document.getElementById('ch-val');
var tip = ch.querySelector('.ch__tip text');
var ys = [66, 54, 58, 47, 27, 39, 53, 42, 29, 45, 36, 25];
var nums = [220, 268, 254, 305, 398, 342, 287, 331, 376, 309, 352, 401];
var cur = 4;

function snap(i) {
  cur = Math.min(Math.max(i, 0), N - 1);
  ch.classList.remove('is-demo');
  ch.style.setProperty('--i', String(cur));
  ch.style.setProperty('--y', ys[cur] + 'px');
  tip.textContent = nums[cur] + '명';
  val.textContent = (cur + 1) + '일 · ' + nums[cur] + '명';
}
hot.addEventListener('pointermove', function (e) {
  var r = hot.getBoundingClientRect();
  var t = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
  snap(Math.round(t * (N - 1)));
});
hot.addEventListener('keydown', function (e) {
  var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (d) { e.preventDefault(); snap(cur + d); hot.focus({ preventScroll: true }); }
  if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); snap(e.key === 'Home' ? 0 : N - 1); }
});
</script>
</body>
</html>
