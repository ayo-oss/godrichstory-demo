<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked vs grouped bars toggle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="sk is-demo" id="sk" data-mode="stack">
    <figcaption class="sk__head">
      <span class="sk__title">채널별 방문</span>
      <button class="sk__btn" type="button" id="sk-btn" aria-pressed="false" aria-label="막대 배열 바꾸기">
        <span class="sk__lab sk__lab--side">나란히 보기</span>
        <span class="sk__lab sk__lab--stack">쌓기 보기</span>
      </button>
    </figcaption>

    <div class="sk__legend" aria-hidden="true">
      <span class="sk__key"><i class="sk__dot sk__dot--a"></i>이번 달</span>
      <span class="sk__key"><i class="sk__dot sk__dot--b"></i>지난 달</span>
    </div>

    <div class="sk__plot" role="img" aria-label="채널 4개의 이번 달·지난 달 방문 막대. 검색 60·24, 직접 36·22, 추천 48·30, 소셜 20·12">
      <div class="sk__col">
        <span class="sk__tot">84명</span>
        <span class="sk__b sk__b--a"></span><span class="sk__b sk__b--b"></span>
      </div>
      <div class="sk__col">
        <span class="sk__tot">58명</span>
        <span class="sk__b sk__b--a"></span><span class="sk__b sk__b--b"></span>
      </div>
      <div class="sk__col">
        <span class="sk__tot">78명</span>
        <span class="sk__b sk__b--a"></span><span class="sk__b sk__b--b"></span>
      </div>
      <div class="sk__col">
        <span class="sk__tot">32명</span>
        <span class="sk__b sk__b--a"></span><span class="sk__b sk__b--b"></span>
      </div>
      <span class="sk__x">검색</span><span class="sk__x">직접</span><span class="sk__x">추천</span><span class="sk__x">소셜</span>
    </div>

    <p class="sk__hint">눌러면 같은 막대가 쌓기와 나란히를 오갑니다</p>

    <div class="sr">
      <span aria-live="polite" id="sk-live"></span>
      <table>
        <caption>채널별 방문자 수</caption>
        <thead><tr><th>채널</th><th>이번 달</th><th>지난 달</th><th>합계</th></tr></thead>
        <tbody>
          <tr><th>검색</th><td>60</td><td>24</td><td>84</td></tr>
          <tr><th>직접</th><td>36</td><td>22</td><td>58</td></tr>
          <tr><th>추천</th><td>48</td><td>30</td><td>78</td></tr>
          <tr><th>소셜</th><td>20</td><td>12</td><td>32</td></tr>
        </tbody>
      </table>
    </div>
  </figure>
</main>
<script>
// 실제 동작: JS 는 data-mode 와 aria-pressed 에만 적는다. 막대가 어디 붙는지는
// CSS 가 data-mode 를 읽어 transform 으로 정한다 — grid 칸은 그대로다.
var sk = document.getElementById('sk');
var btn = document.getElementById('sk-btn');
var live = document.getElementById('sk-live');

btn.addEventListener('click', function () {
  var side = sk.dataset.mode !== 'side';
  sk.classList.remove('is-demo');
  sk.dataset.mode = side ? 'side' : 'stack';
  btn.setAttribute('aria-pressed', side ? 'true' : 'false');
  live.textContent = side ? '나란히 보기' : '쌓기 보기';
});
</script>
</body>
</html>
