<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked vs grouped bars toggle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="sk is-demo" id="sk" data-mode="stack">
    <figcaption class="sk__head">
      <span class="sk__title">チャネル別の訪問</span>
      <button class="sk__btn" type="button" id="sk-btn" aria-pressed="false" aria-label="バーの並びを変える">
        <span class="sk__lab sk__lab--side">並べて表示</span>
        <span class="sk__lab sk__lab--stack">積み上げて表示</span>
      </button>
    </figcaption>

    <div class="sk__legend" aria-hidden="true">
      <span class="sk__key"><i class="sk__dot sk__dot--a"></i>今月</span>
      <span class="sk__key"><i class="sk__dot sk__dot--b"></i>先月</span>
    </div>

    <div class="sk__plot" role="img" aria-label="4チャネルの今月・先月の訪問バー。検索60・24、直接36・22、紹介48・30、ソーシャル20・12">
      <div class="sk__col">
        <span class="sk__tot">84人</span>
        <span class="sk__b sk__b--a"></span><span class="sk__b sk__b--b"></span>
      </div>
      <div class="sk__col">
        <span class="sk__tot">58人</span>
        <span class="sk__b sk__b--a"></span><span class="sk__b sk__b--b"></span>
      </div>
      <div class="sk__col">
        <span class="sk__tot">78人</span>
        <span class="sk__b sk__b--a"></span><span class="sk__b sk__b--b"></span>
      </div>
      <div class="sk__col">
        <span class="sk__tot">32人</span>
        <span class="sk__b sk__b--a"></span><span class="sk__b sk__b--b"></span>
      </div>
      <span class="sk__x">検索</span><span class="sk__x">直接</span><span class="sk__x">紹介</span><span class="sk__x">ソーシャル</span>
    </div>

    <p class="sk__hint">押すと同じバーが積み上げと並列を行き来します</p>

    <div class="sr">
      <span aria-live="polite" id="sk-live"></span>
      <table>
        <caption>チャネル別の訪問者数</caption>
        <thead><tr><th>チャネル</th><th>今月</th><th>先月</th><th>合計</th></tr></thead>
        <tbody>
          <tr><th>検索</th><td>60</td><td>24</td><td>84</td></tr>
          <tr><th>直接</th><td>36</td><td>22</td><td>58</td></tr>
          <tr><th>紹介</th><td>48</td><td>30</td><td>78</td></tr>
          <tr><th>ソーシャル</th><td>20</td><td>12</td><td>32</td></tr>
        </tbody>
      </table>
    </div>
  </figure>
</main>
<script>
// 실제 동작: JS 는 data-mode 와 aria-pressed 에만 적는다. 막대가 어디 붙는지는
// CSS 가 data-mode 를 읽어 transform 으로 정한다 — grid 칸은 그대로다.
var sk = document.getElementById('sk');
var btn = document.getElementById('sk-btn');
var live = document.getElementById('sk-live');

btn.addEventListener('click', function () {
  var side = sk.dataset.mode !== 'side';
  sk.classList.remove('is-demo');
  sk.dataset.mode = side ? 'side' : 'stack';
  btn.setAttribute('aria-pressed', side ? 'true' : 'false');
  live.textContent = side ? '並べて表示' : '積み上げて表示';
});
</script>
</body>
</html>
