<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked vs grouped bars toggle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="sk is-demo" id="sk" data-mode="stack">
    <figcaption class="sk__head">
      <span class="sk__title">Visits by channel</span>
      <button class="sk__btn" type="button" id="sk-btn" aria-pressed="false" aria-label="Change bar arrangement">
        <span class="sk__lab sk__lab--side">Show side by side</span>
        <span class="sk__lab sk__lab--stack">Show stacked</span>
      </button>
    </figcaption>

    <div class="sk__legend" aria-hidden="true">
      <span class="sk__key"><i class="sk__dot sk__dot--a"></i>This month</span>
      <span class="sk__key"><i class="sk__dot sk__dot--b"></i>Last month</span>
    </div>

    <div class="sk__plot" role="img" aria-label="This-month and last-month visit bars for 4 channels. Search 60·24, Direct 36·22, Referral 48·30, Social 20·12">
      <div class="sk__col">
        <span class="sk__tot">84</span>
        <span class="sk__b sk__b--a"></span><span class="sk__b sk__b--b"></span>
      </div>
      <div class="sk__col">
        <span class="sk__tot">58</span>
        <span class="sk__b sk__b--a"></span><span class="sk__b sk__b--b"></span>
      </div>
      <div class="sk__col">
        <span class="sk__tot">78</span>
        <span class="sk__b sk__b--a"></span><span class="sk__b sk__b--b"></span>
      </div>
      <div class="sk__col">
        <span class="sk__tot">32</span>
        <span class="sk__b sk__b--a"></span><span class="sk__b sk__b--b"></span>
      </div>
      <span class="sk__x">Search</span><span class="sk__x">Direct</span><span class="sk__x">Referral</span><span class="sk__x">Social</span>
    </div>

    <p class="sk__hint">Press it and the same bars swap between stacked and side by side</p>

    <div class="sr">
      <span aria-live="polite" id="sk-live"></span>
      <table>
        <caption>Visitors by channel</caption>
        <thead><tr><th>Channel</th><th>This month</th><th>Last month</th><th>Total</th></tr></thead>
        <tbody>
          <tr><th>Search</th><td>60</td><td>24</td><td>84</td></tr>
          <tr><th>Direct</th><td>36</td><td>22</td><td>58</td></tr>
          <tr><th>Referral</th><td>48</td><td>30</td><td>78</td></tr>
          <tr><th>Social</th><td>20</td><td>12</td><td>32</td></tr>
        </tbody>
      </table>
    </div>
  </figure>
</main>
<script>
// 실제 동작: JS 는 data-mode 와 aria-pressed 에만 적는다. 막대가 어디 붙는지는
// CSS 가 data-mode 를 읽어 transform 으로 정한다 — grid 칸은 그대로다.
var sk = document.getElementById('sk');
var btn = document.getElementById('sk-btn');
var live = document.getElementById('sk-live');

btn.addEventListener('click', function () {
  var side = sk.dataset.mode !== 'side';
  sk.classList.remove('is-demo');
  sk.dataset.mode = side ? 'side' : 'stack';
  btn.setAttribute('aria-pressed', side ? 'true' : 'false');
  live.textContent = side ? 'Show side by side' : 'Show stacked';
});
</script>
</body>
</html>
