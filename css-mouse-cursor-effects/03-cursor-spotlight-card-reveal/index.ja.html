<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotlight cursor card reveal — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sp-card is-demo">
    <span class="sp-card__spot" aria-hidden="true"></span>
    <p class="sp-card__text">マウスを乗せると<br>隠れていた文字が<br>光を受けて浮かび上がる</p>
  </div>
</main>
<script>
(function () {
  var card = document.querySelector('.sp-card');
  var spot = card.querySelector('.sp-card__spot');
  // 실제 사용자: pointermove 좌표를 그대로 스포트라이트 위치에 반영
  card.addEventListener('pointermove', function (e) {
    if (card.classList.contains('is-demo')) return;
    var r = card.getBoundingClientRect();
    spot.style.transform = 'translate(' + (e.clientX - r.left) + 'px,' + (e.clientY - r.top) + 'px)';
  });
  card.addEventListener('pointerenter', function () { card.classList.remove('is-demo'); card.classList.add('is-live'); });
  card.addEventListener('pointerleave', function () { card.classList.remove('is-live'); spot.style.transform = ''; });
})();
</script>
</body>
</html>
