<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text selection highlight color — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ts-card is-demo">
    <p class="ts-text">
      文章をドラッグで選択すると
      <span class="ts-phrase">
        <span class="ts-phrase__bar" aria-hidden="true"></span>
        <span class="ts-phrase__word">マーカー色</span>
      </span>
      で塗られる。
    </p>
    <span class="ts-badge" aria-hidden="true">
      <svg viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 40v128h-48V88H88V40Z" opacity=".2"/><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></g></svg>
      コピー
    </span>
  </div>
</main>
<script>
(function () {
  var card = document.querySelector('.ts-card');
  var badge = card.querySelector('.ts-badge');
  // 실제 사용자: 정말로 문장을 드래그해 선택하면 selectionchange 가 뜨고, 배지가 선택 영역 위에 뜬다
  document.addEventListener('selectionchange', function () {
    var sel = window.getSelection();
    if (!card.contains(sel.anchorNode) || sel.isCollapsed) { badge.classList.remove('is-shown'); return; }
    var r = sel.getRangeAt(0).getBoundingClientRect();
    var cr = card.getBoundingClientRect();
    badge.style.left = (r.left - cr.left + r.width / 2) + 'px';
    badge.style.top = (r.top - cr.top - 28) + 'px';
    badge.classList.add('is-shown');
    card.classList.remove('is-demo');
  });
})();
</script>
</body>
</html>
