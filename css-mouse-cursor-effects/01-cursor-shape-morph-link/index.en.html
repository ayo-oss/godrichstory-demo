<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursor shape morph — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cm-area is-demo">
    <a class="cm-link" href="#" data-cursor="link" tabindex="-1">Learn more</a>
    <div class="cm-cursor" aria-hidden="true">
      <span class="cm-cursor__shape">
        <svg viewBox="0 0 256 256"><g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g></svg>
      </span>
    </div>
  </div>
</main>
<script>
(function () {
  var area = document.querySelector('.cm-area');
  var cursor = area.querySelector('.cm-cursor');
  var link = area.querySelector('.cm-link');
  // 실제 사용자: pointermove 로 커서 점이 실제 포인터를 따라가고, data-cursor 요소 위에서 링+화살표로 커진다
  area.addEventListener('pointermove', function (e) {
    if (area.classList.contains('is-demo')) return;
    var r = area.getBoundingClientRect();
    cursor.style.transform = 'translate(' + (e.clientX - r.left) + 'px,' + (e.clientY - r.top) + 'px)';
  });
  link.addEventListener('pointerenter', function () { cursor.classList.add('is-link'); });
  link.addEventListener('pointerleave', function () { cursor.classList.remove('is-link'); });
  // 터치 기기엔 pointermove 오버가 없다 — 첫 터치를 감지하면 데모 루프로 되돌려 커서가 화면에 박혀 남지 않게 한다
  area.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'touch') { area.classList.add('is-demo'); cursor.style.transform = ''; }
  });
})();
</script>
</body>
</html>
