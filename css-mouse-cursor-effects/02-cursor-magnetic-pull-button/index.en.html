<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnetic pull button — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="mg-zone is-demo">
    <button class="mg-btn" type="button" tabindex="-1">
      <span>Get started</span>
      <svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g></svg>
    </button>
  </div>
</main>
<script>
(function () {
  var zone = document.querySelector('.mg-zone');
  var btn = zone.querySelector('.mg-btn');
  var STRENGTH = 0.4;                    // 자석 세기 — 0에 가까울수록 덜 끌려온다
  zone.addEventListener('pointermove', function (e) {
    if (zone.classList.contains('is-demo')) return;
    var r = zone.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2);
    var dy = e.clientY - (r.top + r.height / 2);
    btn.style.transform = 'translate(' + dx * STRENGTH + 'px,' + dy * STRENGTH + 'px)';
  });
  zone.addEventListener('pointerleave', function () { btn.style.transform = ''; });
})();
</script>
</body>
</html>
