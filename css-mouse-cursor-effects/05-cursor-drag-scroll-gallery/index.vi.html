<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drag to scroll gallery — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="dg-wrap">
    <div class="dg-viewport is-demo">
      <div class="dg-track">
        <span class="dg-tile" style="background:#ff9ebb"></span>
        <span class="dg-tile" style="background:#d2c7a4"></span>
        <span class="dg-tile" style="background:#c3d6e2"></span>
        <span class="dg-tile" style="background:#90c8b5"></span>
        <span class="dg-tile" style="background:#b9a0ff"></span>
      </div>
    </div>
    <span class="dg-hint" aria-hidden="true">
      <svg viewBox="0 0 256 256"><g fill="currentColor"><path d="M208 80v96H48V80Z" opacity=".2"/><path d="m213.66 181.66l-32 32a8 8 0 0 1-11.32-11.32L188.69 184H48a8 8 0 0 1 0-16h140.69l-18.35-18.34a8 8 0 0 1 11.32-11.32l32 32a8 8 0 0 1 0 11.32m-139.32-64a8 8 0 0 0 11.32-11.32L67.31 88H208a8 8 0 0 0 0-16H67.31l18.35-18.34a8 8 0 0 0-11.32-11.32l-32 32a8 8 0 0 0 0 11.32Z"/></g></svg>
      Kéo
    </span>
  </div>
</main>
<script>
(function () {
  var vp = document.querySelector('.dg-viewport');
  var dragging = false, startX = 0, startScroll = 0;
  // 실제 사용자: pointerdown 후 움직인 거리만큼 scrollLeft 를 직접 옮긴다 (transform 이 아니라 진짜 스크롤)
  vp.addEventListener('pointerdown', function (e) {
    if (vp.classList.contains('is-demo')) return;
    dragging = true; startX = e.clientX; startScroll = vp.scrollLeft;
    vp.classList.add('is-grabbing'); vp.setPointerCapture(e.pointerId);
  });
  vp.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    vp.scrollLeft = startScroll - (e.clientX - startX);
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) {
    vp.addEventListener(ev, function () { dragging = false; vp.classList.remove('is-grabbing'); });
  });
})();
</script>
</body>
</html>
