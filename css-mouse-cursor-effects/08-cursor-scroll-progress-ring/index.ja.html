<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll progress cursor ring — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pr-box is-demo">
    <div class="pr-content">
      <p>この中でスクロールすると</p>
      <p>カーソル横のリングが</p>
      <p>進捗分だけ満ちていく</p>
      <p>最後まで行くとチェックに変わる</p>
    </div>
    <div class="pr-ring" aria-hidden="true">
      <svg viewBox="0 0 36 36">
        <circle class="pr-ring__track" cx="18" cy="18" r="15"/>
        <circle class="pr-ring__fill" cx="18" cy="18" r="15"/>
      </svg>
      <svg class="pr-ring__check" viewBox="0 0 256 256"><g fill="currentColor"><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg>
    </div>
  </div>
</main>
<script>
(function () {
  var box = document.querySelector('.pr-box');
  var ring = box.querySelector('.pr-ring');
  var CIRC = 2 * Math.PI * 15;
  // 실제 사용자: 포인터를 따라가고, 스크롤 진행률만큼 링 테두리가 채워진다
  box.addEventListener('pointermove', function (e) {
    if (box.classList.contains('is-demo')) return;
    var r = box.getBoundingClientRect();
    ring.style.transform = 'translate(' + (e.clientX - r.left) + 'px,' + (e.clientY - r.top) + 'px)';
  });
  box.addEventListener('scroll', function () {
    if (box.classList.contains('is-demo')) return;
    var max = box.scrollHeight - box.clientHeight;
    var pct = max > 0 ? box.scrollTop / max : 0;
    ring.style.setProperty('--dash', (CIRC * (1 - pct)).toFixed(1));
    box.classList.toggle('is-done', pct > 0.98);
  });
})();
</script>
</body>
</html>
