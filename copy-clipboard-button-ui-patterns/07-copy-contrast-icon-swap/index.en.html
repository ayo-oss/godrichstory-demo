<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrast swap — an overlaid button recomputing icon color from background brightness — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="backdrop" id="backdrop">
  <button class="copyBtn" id="copyBtn" type="button" aria-label="Copy over the image">
    <svg class="icon" id="icon" viewBox="0 0 256 256" aria-hidden="true">
      <g fill="currentColor">
        <path d="M216 40v128h-48V88H88V40Z" opacity=".2" />
        <path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z" />
      </g>
    </svg>
  </button>
  <p class="hint" id="hint">Brightness 0.00 · dark background</p>
</div>
</main>
<script>
// 대비 아이콘 전환 — 버튼이 사진/영상 배경 위에 겹칠 때, 배경색의 상대 휘도를 계산해
// 밝으면 어두운 아이콘 · 어두우면 밝은 아이콘으로 가르고 테두리 대비를 유지한다.
// 계산 겹: 배경 색상 보간(장면 전환) → RGB → 상대휘도(WCAG 근사) → 임계 비교 → 아이콘/테두리 재계산.
// 자동 시연만, 실사용자 리스너 없음. 실 클립보드 API 호출 없음 — 상태는 시뮬레이션.
(function () {
  var backdrop = document.getElementById('backdrop');
  var icon = document.getElementById('icon');
  var btn = document.getElementById('copyBtn');
  var hint = document.getElementById('hint');
  if (!backdrop || !icon || !btn || !hint) return;

  var BRIGHTNESS_THRESHOLD = 0.55;
  var CYCLE_MS = 2000;

  // 장면 전환 — 사진/영상이 바뀌는 상황을 색 보간으로 흉내낸다 (연출용 색상, 임의 변경 금지)
  var SCENES = [
    [17, 20, 26],
    [255, 210, 63],
    [10, 79, 232],
    [255, 247, 230]
  ];

  function lerp(a, b, p) { return a + (b - a) * p; }

  function sceneRgb(t) {
    var span = CYCLE_MS / SCENES.length;
    var idx = Math.floor(t / span) % SCENES.length;
    var next = (idx + 1) % SCENES.length;
    var p = (t % span) / span;
    var a = SCENES[idx];
    var b = SCENES[next];
    return [
      Math.round(lerp(a[0], b[0], p)),
      Math.round(lerp(a[1], b[1], p)),
      Math.round(lerp(a[2], b[2], p))
    ];
  }

  function channelLin(c) {
    var v = c / 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  }

  function relativeLuminance(rgb) {
    var r = channelLin(rgb[0]);
    var g = channelLin(rgb[1]);
    var b = channelLin(rgb[2]);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }

  function apply(t) {
    var rgb = sceneRgb(t);
    var bg = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
    backdrop.style.backgroundColor = bg;
    var brightness = relativeLuminance(rgb);
    var isLight = brightness >= BRIGHTNESS_THRESHOLD;
    backdrop.classList.toggle('is-light', isLight);
    backdrop.classList.toggle('is-dark', !isLight);
    hint.textContent = 'Brightness ' + brightness.toFixed(2) + ' · ' + (isLight ? 'Light background' : 'Dark background');
  }

  apply(0);

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
