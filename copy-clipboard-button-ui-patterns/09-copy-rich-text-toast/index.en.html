<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rich-text toast — a notice whose label width recomputes by style-kind count — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="preview" id="preview">
    This paragraph mixes <strong>bold</strong>, <em>italic</em>, and <code>code</code>
  </p>
  <button class="copyBtn" id="copyBtn" type="button">Copy with formatting</button>
  <div class="toast" id="toast">
    <span class="toastLabel" id="toastLabel">0 style kinds copied</span>
    <span class="badges" id="badges"></span>
  </div>
</section>
</main>
<script>
// style 종류 토스트 — 복사된 내용에 서식이 몇 종류 섞였는지 세어(bold·italic·code)
// 그 수만큼 토스트의 라벨 폭을 다시 계산해 늘리고 종류 뱃지가 순서대로 붙는다.
// 계산 겹: DOM 태그 종류 카운트 → 라벨 실측 scrollWidth → 뱃지 폭 합산 → 토스트 min-width 재계산.
// 실사용자 리스너 있음(Copy with formatting 버튼). 실 클립보드 API 호출 없음 — 상태는 시뮬레이션.
(function () {
  var preview = document.getElementById('preview');
  var copyBtn = document.getElementById('copyBtn');
  var toast = document.getElementById('toast');
  var toastLabel = document.getElementById('toastLabel');
  var badgesEl = document.getElementById('badges');
  if (!preview || !copyBtn || !toast || !toastLabel || !badgesEl) return;

  var KIND_LABELS = { strong: 'bold', em: 'italic', code: 'code' };
  var BADGE_STAGGER_MS = 160;

  // 붙여넣는 문단이 바뀌는 상황을 흉내낸다 — style 종류 수가 1·2·3 종으로 달라진다
  var SAMPLES = [
    'This paragraph has only <strong>bold</strong>',
    'This paragraph mixes <strong>bold</strong> and <em>italic</em>',
    'This paragraph mixes <strong>bold</strong>, <em>italic</em>, and <code>code</code>'
  ];
  var SAMPLE_MS = 660;
  var CYCLE_MS = SAMPLE_MS * SAMPLES.length;

  function countKinds() {
    var found = [];
    var tags = ['strong', 'em', 'code'];
    for (var i = 0; i < tags.length; i++) {
      if (preview.querySelector(tags[i])) found.push(tags[i]);
    }
    return found;
  }

  function measureAndSize(count) {
    var labelWidth = toastLabel.scrollWidth;
    var badgeWidth = count * 46;
    var total = labelWidth + badgeWidth + 40;
    toast.style.minWidth = total + 'px';
  }

  var badgeTimers = [];

  function clearBadgeTimers() {
    for (var i = 0; i < badgeTimers.length; i++) clearTimeout(badgeTimers[i]);
    badgeTimers = [];
  }

  function showToast(sampleIndex) {
    preview.innerHTML = SAMPLES[sampleIndex];
    var kinds = countKinds();
    clearBadgeTimers();
    toastLabel.textContent = 'style ' + kinds.length + ' kinds copied';
    badgesEl.innerHTML = '';
    measureAndSize(0);
    toast.classList.add('is-visible');

    for (var i = 0; i < kinds.length; i++) {
      (function (kind, index) {
        var timer = setTimeout(function () {
          var b = document.createElement('span');
          b.className = 'badge';
          b.textContent = KIND_LABELS[kind];
          badgesEl.appendChild(b);
          measureAndSize(index + 1);
        }, index * BADGE_STAGGER_MS);
        badgeTimers.push(timer);
      })(kinds[i], i);
    }
  }

  showToast(0);

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;

  var start = null;
  var lastSample = -1;
  function autoLoop(ts) {
    if (start === null) start = ts;
    var elapsed = ts - start;
    var t = elapsed % CYCLE_MS;
    var sampleIndex = Math.floor(t / SAMPLE_MS) % SAMPLES.length;
    if (sampleIndex !== lastSample) {
      lastSample = sampleIndex;
      showToast(sampleIndex);
    }
    requestAnimationFrame(autoLoop);
  }
  requestAnimationFrame(autoLoop);

  copyBtn.addEventListener('click', function () {
    lastSample = -1;
    showToast(0);
  });
})();
</script>
</body>
</html>
