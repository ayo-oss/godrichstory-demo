<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두 버튼 분할 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="row" id="row">
  <button class="btn primary" id="primaryBtn" type="button" aria-pressed="false" aria-label="링크 복사">
    <svg class="icon iconCopy" id="copyIcon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 40v128h-48V88H88V40Z" opacity=".2"/><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></g></svg>
    <svg class="icon iconCheck" id="checkIcon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg>
    <span class="label" id="primaryLabel">링크 복사</span>
  </button>
  <button class="btn secondary" id="secondaryBtn" type="button" aria-label="초대장 공유">
    <span class="label" id="secondaryLabel">초대장 공유</span>
  </button>
</section>
<span class="sr" id="live" role="status" aria-live="polite"></span>
</main>
<script>
// 두 버튼 분할 — 복사가 성공하면 주 버튼은 체크로 바뀌고, 보조 버튼은 안내 문구로
// 시간차를 두고 뒤따라 바뀐다. 그 시간차는 두 버튼 사이의 실측 거리에서 다시 구한다.
// 계산 겹: getBoundingClientRect 로 두 버튼 중심 거리 실측 → 거리×상수 = 시간차.
// 실사용자 리스너 있음(주 버튼 클릭). 실 클립보드 API 호출 없음 — 상태는 시뮬레이션.
(function () {
  var row = document.getElementById('row');
  var primaryBtn = document.getElementById('primaryBtn');
  var copyIcon = document.getElementById('copyIcon');
  var checkIcon = document.getElementById('checkIcon');
  var secondaryBtn = document.getElementById('secondaryBtn');
  var secondaryLabel = document.getElementById('secondaryLabel');
  var live = document.getElementById('live');
  if (!row || !primaryBtn || !copyIcon || !checkIcon || !secondaryBtn || !secondaryLabel || !live) return;

  var STAGGER_MS_PER_PX = 0.9;
  var HOLD_MS = 700;
  var SECONDARY_TEXT = '초대장 공유';
  var SECONDARY_DONE = '함께 전달됨';

  function measureStagger() {
    var a = primaryBtn.getBoundingClientRect();
    var b = secondaryBtn.getBoundingClientRect();
    var ax = a.left + a.width / 2;
    var bx = b.left + b.width / 2;
    var distance = Math.abs(bx - ax);
    return distance * STAGGER_MS_PER_PX;
  }

  function apply(t, stagger) {
    var success = t >= 0;
    copyIcon.style.opacity = success ? '0' : '1';
    checkIcon.style.opacity = success ? '1' : '0';
    primaryBtn.setAttribute('aria-pressed', success ? 'true' : 'false');
    var secondaryOn = t >= stagger;
    secondaryLabel.textContent = secondaryOn ? SECONDARY_DONE : SECONDARY_TEXT;
    secondaryBtn.classList.toggle('is-done', secondaryOn);
    if (success && secondaryOn && live.textContent !== SECONDARY_DONE) {
      live.textContent = SECONDARY_DONE;
    } else if (!success) {
      live.textContent = '';
    }
  }

  apply(-1, 0);

  var CYCLE_MS = 2000;
  var TRIGGER_AT_MS = 300;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var start = null;
  var stagger = measureStagger();

  function autoLoop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t - TRIGGER_AT_MS, stagger);
    requestAnimationFrame(autoLoop);
  }

  var autoRaf = 0;
  if (!reduce) autoRaf = requestAnimationFrame(autoLoop);

  primaryBtn.addEventListener('click', function () {
    if (autoRaf) { cancelAnimationFrame(autoRaf); autoRaf = 0; }
    stagger = measureStagger();
    apply(-1, stagger);
    var clickStart = null;
    function userLoop(ts) {
      if (clickStart === null) clickStart = ts;
      var t = ts - clickStart;
      apply(t, stagger);
      if (t < stagger + HOLD_MS) requestAnimationFrame(userLoop);
    }
    requestAnimationFrame(userLoop);
  });
})();
</script>
</body>
</html>
