<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>権限ゲートカード — 権限の状態と残り待ち時間を濃度に乗せる案内板 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="card" id="card">
  <p class="title" id="title">貼り付け権限を確認中</p>
  <div class="track" id="track">
    <div class="fill" id="fill"></div>
  </div>
  <p class="msg" id="msg">権限の状態を確認しています</p>
  <button class="retryBtn" id="retryBtn" type="button">権限を再リクエスト</button>
</section>
</main>
<script>
// 권한 대기 카드 — 읽기 권한을 얻지 못한 상태가 되면 안내판이 대기 카드로 바뀌고,
// 권한 상태 값(denied)と 남은 대기 시간의 비율만큼 카드 농도·안내 문구를 바꾼다.
// 계산 겹: 경과시간 → 남은 대기 비율(0~1) → 카드 배경 알파·진행바 폭 재계산.
// 실사용자 리스너 있음(権限を再リクエスト 버튼). 실 클립보드 API/Permissions API 호출 없음 — 상태는 시뮬레이션.
(function () {
  var card = document.getElementById('card');
  var title = document.getElementById('title');
  var track = document.getElementById('track');
  var fill = document.getElementById('fill');
  var msg = document.getElementById('msg');
  var retryBtn = document.getElementById('retryBtn');
  if (!card || !title || !track || !fill || !msg || !retryBtn) return;

  var CHECK_MS = 500;
  var WAIT_MS = 1600;
  var CYCLE_MS = CHECK_MS + WAIT_MS;

  function applyChecking() {
    card.dataset.state = 'checking';
    title.textContent = '貼り付け権限を確認中';
    msg.textContent = '権限の状態を確認しています';
    fill.style.width = '0%';
    card.style.setProperty('--tint', '0.14');
  }

  function applyWaiting(elapsed) {
    card.dataset.state = 'waiting';
    var remain = Math.max(WAIT_MS - elapsed, 0);
    var ratio = remain / WAIT_MS;
    title.textContent = '権限がまだありません';
    msg.textContent = '拒否済み · 残り待機 ' + (remain / 1000).toFixed(1) + 's';
    fill.style.width = ((1 - ratio) * 100).toFixed(1) + '%';
    card.style.setProperty('--tint', (0.14 + (1 - ratio) * 0.34).toFixed(3));
  }

  function setPhase(t) {
    if (t < CHECK_MS) {
      applyChecking();
    } else {
      applyWaiting(t - CHECK_MS);
    }
  }

  setPhase(0);

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var start = null;
  var autoRaf = 0;

  function autoLoop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    setPhase(t);
    autoRaf = requestAnimationFrame(autoLoop);
  }

  if (!reduce) autoRaf = requestAnimationFrame(autoLoop);

  retryBtn.addEventListener('click', function () {
    if (autoRaf) { cancelAnimationFrame(autoRaf); autoRaf = 0; }
    var clickStart = null;
    function userLoop(ts) {
      if (clickStart === null) clickStart = ts;
      var t = ts - clickStart;
      if (t < CYCLE_MS) {
        setPhase(t);
        requestAnimationFrame(userLoop);
      } else {
        setPhase(0);
      }
    }
    requestAnimationFrame(userLoop);
  });
})();
</script>
</body>
</html>
