<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글자 수 채움 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="card">
    <p class="preview" id="preview">이 문구는 초대장 카드 아래 자동으로 채워지는 안내용 예시 텍스트입니다.</p>
    <button class="copyBtn" id="copyBtn" type="button" aria-label="문구 복사">
      <span class="fillTrack" aria-hidden="true"><span class="fillBar" id="fillBar"></span></span>
      <span class="iconSlot">
        <svg class="icon" id="icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg>
      </span>
      <span class="count" id="count">0</span>
    </button>
  </div>
  <span class="sr" id="live" role="status" aria-live="polite"></span>
</section>
</main>
<script>
// 글자 수 채움 — 복사한 문장의 글자 수(preview 실측 length)를 채움 비율로 바꾸고,
// 채움이 끝나면 아이콘·숫자가 짧게 떠올랐다 정착한다(translateY 보간, 이차 감쇠).
// 계산 겹: 글자 수 실측 → 진행률 → 오프셋(--fill) 재계산. 실사용자 리스너 있음(버튼 클릭).
// 실 클립보드 API 호출 없음 — 상태는 전부 시뮬레이션.
(function () {
  var preview = document.getElementById('preview');
  var btn = document.getElementById('copyBtn');
  var fillBar = document.getElementById('fillBar');
  var icon = document.getElementById('icon');
  var count = document.getElementById('count');
  var live = document.getElementById('live');
  if (!preview || !btn || !fillBar || !icon || !count || !live) return;

  var CHAR_COUNT = preview.textContent.trim().length;
  var FILL_MS_PER_CHAR = 18;
  var FILL_MS = CHAR_COUNT * FILL_MS_PER_CHAR;
  var BOUNCE_MS = 260;
  var IDLE_MS = 140;

  function bounceEase(p) {
    if (p < 0.5) return p / 0.5;
    var q = (p - 0.5) / 0.5;
    return 1 - q * q;
  }

  function render(ratio, lift) {
    fillBar.style.setProperty('--fill', ratio.toFixed(4));
    count.textContent = String(Math.round(ratio * CHAR_COUNT));
    icon.style.opacity = ratio >= 1 ? '1' : '0';
    var y = -lift * 6;
    var t = 'translateY(' + y.toFixed(2) + 'px)';
    icon.style.transform = t;
    count.style.transform = t;
  }

  function sequence(t) {
    if (t < FILL_MS) {
      render(t / FILL_MS, 0);
      live.textContent = '';
    } else if (t < FILL_MS + BOUNCE_MS) {
      render(1, bounceEase((t - FILL_MS) / BOUNCE_MS));
      live.textContent = CHAR_COUNT + '자 복사됨';
    } else {
      render(1, 0);
      live.textContent = CHAR_COUNT + '자 복사됨';
    }
  }

  render(0, 0);

  var CYCLE_MS = 2000;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var autoStart = null;
  var autoRaf = 0;

  function autoLoop(ts) {
    if (autoStart === null) autoStart = ts;
    var t = (ts - autoStart) % CYCLE_MS;
    if (t < IDLE_MS) { render(0, 0); live.textContent = ''; }
    else sequence(t - IDLE_MS);
    autoRaf = requestAnimationFrame(autoLoop);
  }

  if (!reduce) autoRaf = requestAnimationFrame(autoLoop);

  btn.addEventListener('click', function () {
    if (autoRaf) { cancelAnimationFrame(autoRaf); autoRaf = 0; }
    render(0, 0);
    var clickStart = null;
    function userLoop(ts) {
      if (clickStart === null) clickStart = ts;
      var t = ts - clickStart;
      sequence(t);
      if (t < FILL_MS + BOUNCE_MS + 20) requestAnimationFrame(userLoop);
    }
    requestAnimationFrame(userLoop);
  });
})();
</script>
</body>
</html>
