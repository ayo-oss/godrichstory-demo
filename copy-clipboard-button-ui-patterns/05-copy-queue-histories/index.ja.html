<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キューヒストリー — 最近のコピーの時間差を相対時刻で書き直すリスト — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<ul class="list" id="list">
  <li class="row" data-base="0">
    <span class="dot" data-dot></span>
    <span class="text">invite-code-9f21</span>
    <span class="label" data-label>たった今</span>
  </li>
  <li class="row" data-base="50000">
    <span class="dot" data-dot></span>
    <span class="text">https://example.com/share</span>
    <span class="label" data-label>1分前</span>
  </li>
  <li class="row" data-base="170000">
    <span class="dot" data-dot></span>
    <span class="text">#3F51B5</span>
    <span class="label" data-label>しばらく前</span>
  </li>
</ul>
</main>
<script>
// 대기줄 히스토리 — 최근 복사 3건이 줄을 이루고, 지금으로부터 각 항목까지의 시간 차를
// 매 프레임 다시 재어 'たった今·1分前·しばらく前' 라벨과 점 색을 시간 흐름만으로 갱신한다.
// 데모 캡처 시간이 짧아 가짜 시계 배속(TIME_SCALE)으로 몇 분이 몇 초 안에 흐르게 만든다.
// 계산 겹: 항목별 기준 경과시간 + 배속×경과 실시간 = 가짜 경과시간 → 라벨 재계산.
// 자동 시연만, 실사용자 리스너 없음. 실 클립보드 API 호출 없음 — 상태는 시뮬레이션.
(function () {
  var rows = Array.prototype.slice.call(document.querySelectorAll('#list .row'));
  if (!rows.length) return;
  var items = rows.map(function (row) {
    return {
      row: row,
      base: parseInt(row.getAttribute('data-base'), 10) || 0,
      dot: row.querySelector('[data-dot]'),
      label: row.querySelector('[data-label]')
    };
  });

  var TIME_SCALE = 60;
  var JUST_NOW_MS = 15000;
  var A_MINUTE_MS = 120000;

  function bucket(ms) {
    if (ms < JUST_NOW_MS) return 'now';
    if (ms < A_MINUTE_MS) return 'minute';
    return 'old';
  }

  function labelFor(b) {
    if (b === 'now') return 'たった今';
    if (b === 'minute') return '1分前';
    return 'しばらく前';
  }

  function apply(elapsedRealMs) {
    items.forEach(function (item) {
      var fake = item.base + elapsedRealMs * TIME_SCALE;
      var b = bucket(fake);
      item.label.textContent = labelFor(b);
      item.dot.setAttribute('data-state', b);
    });
  }

  apply(0);

  var CYCLE_MS = 2000;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  var start = null;

  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
