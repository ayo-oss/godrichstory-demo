<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Cursive Name Written in One Line by Joining the Letters — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld is-demo" id="ld">
  <canvas class="ld__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="Letter outlines turned into dots, then joined along the baseline so atelier is written as one cursive line."></canvas>
  <button class="ld__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("ld");
    if (!root) return;
    // 판 좌표 — 캔버스 안은 늘 480×300. 화면에 보이는 크기와 상관없이 계산은 이 좌표로 한다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 같은 시드면 같은 점 배치·같은 떨림이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 1차원 값 노이즈 — 정수 자리마다 시드로 정한 값(-1~1)을 두고 사이는 부드러운 보간. 손 떨림에 쓴다
    const NOISE_TABLE = new Float32Array(256);
    const noiseRng = makeRng(483);
    for (let i = 0; i < 256; i += 1) {
        NOISE_TABLE[i] = noiseRng() * 2 - 1;
    }
    function smoothNoise(x) {
        const i = Math.floor(x);
        const f = x - i;
        const u = f * f * (3 - 2 * f);
        return lerp(NOISE_TABLE[i & 255], NOISE_TABLE[(i + 1) & 255], u);
    }
    // 도형 거리 — 타원 안이면 음수, 밖이면 양수(px 에 가까운 근사). 원본 그림을 코드로 그릴 때 쓴다
    function ellipseDist(x, y, cx, cy, rx, ry) {
        const dx = (x - cx) / rx;
        const dy = (y - cy) / ry;
        return (Math.sqrt(dx * dx + dy * dy) - 1) * Math.min(rx, ry);
    }
    // 선분까지의 거리(px)
    function segmentDist(x, y, ax, ay, bx, by) {
        const vx = bx - ax;
        const vy = by - ay;
        const k = clamp(((x - ax) * vx + (y - ay) * vy) / Math.max(1e-9, vx * vx + vy * vy), 0, 1);
        const ex = x - (ax + vx * k);
        const ey = y - (ay + vy * k);
        return Math.sqrt(ex * ex + ey * ey);
    }
    // 거리 → 칠한 정도 0~1. 경계 1px 를 부드럽게 넘긴다
    function fillOf(dist) { return clamp(0.5 - dist, 0, 1); }
    // 두 점 사이 거리
    function dist2(ax, ay, bx, by) {
        const dx = ax - bx;
        const dy = ay - by;
        return Math.sqrt(dx * dx + dy * dy);
    }
    // 꺾은선 길이 — xs·ys 를 order 순서로 이었을 때(닫지 않음)
    function pathLength(xs, ys, order, n) {
        let sum = 0;
        for (let i = 1; i < n; i += 1) {
            sum += dist2(xs[order[i - 1]], ys[order[i - 1]], xs[order[i]], ys[order[i]]);
        }
        return sum;
    }
    // 파스텔 팔레트 — 미색 종이 바탕 위에 진한 잉크 선. 잉크·종이는 데모 토큰($subject-ink·$subject-cream)과 같은 값
    const PAPER = [255, 247, 230];
    const INK = [23, 20, 26];
    const CORAL = [244, 166, 150];
    const LAVENDER = [192, 176, 236];
    const BUTTER = [246, 224, 150];
    const SAGE = [164, 208, 172];
    const PINK = [244, 182, 204];
    const SKY = [164, 206, 236];
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 한 장면의 순환 — 그리기 → 머묾 → 지움. 지움이 끝나면 처음부터 다시
    function cyclePhase(t, drawTime, holdTime) {
        // 0~1 은 그리는 중, 1~2 는 머무는 중, 2~3 은 지우는 중
        if (t < drawTime) {
            return t / drawTime;
        }
        if (t < drawTime + holdTime) {
            return 1 + (t - drawTime) / holdTime;
        }
        return 2 + (t - drawTime - holdTime) / ERASE_TIME;
    }
    // 지우기 시간(초) — 모든 장면이 같은 빠르기로 종이색으로 돌아간다
    const ERASE_TIME = 1;
    // 곡선 공용 — 점 사이를 「이웃 네 점으로 정하는 3차 곡선」(조각마다 가운데 두 점을 지나고 바깥 두 점으로 기울기를 정한다)으로 메우고, 짧은 마디로 쪼개 누적 길이 표를 만든다
    // 3차 조각 — 두 끝점 p1·p2 와 그 자리의 접선 m1·m2 로 정하는 곡선. t 는 0~1
    function cubicPiece(p1, p2, m1, m2, t) {
        const t2 = t * t;
        const t3 = t2 * t;
        return (2 * t3 - 3 * t2 + 1) * p1 + (t3 - 2 * t2 + t) * m1 + (-2 * t3 + 3 * t2) * p2 + (t3 - t2) * m2;
    }
    // 이웃 접선 — 점 i 의 접선 = (다음 점 − 앞 점) ÷ 2. 이음매 양쪽 조각이 같은 접선을 쓰므로 꺾이지 않는다
    function neighborTangents(px) {
        const n = px.length;
        const m = [];
        for (let i = 0; i < n; i += 1) {
            m.push((px[Math.min(n - 1, i + 1)] - px[Math.max(0, i - 1)]) / 2);
        }
        return m;
    }
    // 조각마다 CURVE_STEPS 마디 — 마디 끝마다 누적 길이를 적어 둔다. 길이 표의 칸 수 = 조각 수 × CURVE_STEPS + 1
    const CURVE_STEPS = 16;
    function buildCurve(px, py, mx, my) {
        const xs = [px[0]];
        const ys = [py[0]];
        const lens = [0];
        let total = 0;
        for (let i = 0; i + 1 < px.length; i += 1) {
            for (let k = 1; k <= CURVE_STEPS; k += 1) {
                const t = k / CURVE_STEPS;
                const x = cubicPiece(px[i], px[i + 1], mx[i], mx[i + 1], t);
                const y = cubicPiece(py[i], py[i + 1], my[i], my[i + 1], t);
                total += dist2(x, y, xs[xs.length - 1], ys[ys.length - 1]);
                xs.push(x);
                ys.push(y);
                lens.push(total);
            }
        }
        return { xs: Float32Array.from(xs), ys: Float32Array.from(ys), lens: Float32Array.from(lens), total: total, seams: px.length - 2 };
    }
    // 지나는 점들로 곡선 — 이웃 접선을 붙여 buildCurve
    function curveThrough(px, py) { return buildCurve(px, py, neighborTangents(px), neighborTangents(py)); }
    // 꺾은선 그대로 — 곡선으로 메우지 않고 점 사이를 곧게 잇되 같은 누적 길이 표를 만든다
    function polylineCurve(px, py) {
        const lens = [0];
        let total = 0;
        for (let i = 1; i < px.length; i += 1) {
            total += dist2(px[i], py[i], px[i - 1], py[i - 1]);
            lens.push(total);
        }
        return { xs: Float32Array.from(px), ys: Float32Array.from(py), lens: Float32Array.from(lens), total: total, seams: 0 };
    }
    // 길이 s 자리 — 누적 길이 표를 이진 탐색해 s 가 든 마디를 찾고, 그 마디 안에서 비율만큼. 소수 꼭짓점 번호를 돌려준다
    function indexAtLength(c, s) {
        if (s <= 0) {
            return 0;
        }
        if (s >= c.total) {
            return c.lens.length - 1;
        }
        let lo = 0;
        let hi = c.lens.length - 1;
        while (hi - lo > 1) {
            const mid = (lo + hi) >> 1;
            if (c.lens[mid] < s) {
                lo = mid;
            }
            else {
                hi = mid;
            }
        }
        return lo + (s - c.lens[lo]) / Math.max(1e-9, c.lens[hi] - c.lens[lo]);
    }
    // 소수 꼭짓점 번호 → 좌표
    function pointAtIndex(c, f) {
        const i = Math.min(Math.floor(f), c.xs.length - 2);
        const k = f - i;
        return [lerp(c.xs[i], c.xs[i + 1], k), lerp(c.ys[i], c.ys[i + 1], k)];
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    // 미색 종이 — 위는 조금 밝고 아래는 조금 따뜻하게
    function clearPaper() {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(PAPER, 1));
        g.addColorStop(1, rgba([250, 238, 216], 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    // 상태 줄 — 같은 글자면 DOM 을 건드리지 않는다
    let statusText = '';
    function setStatus(s) {
        if (!statusEl || s === statusText) {
            return;
        }
        statusText = s;
        statusEl.textContent = s;
    }
    // 꺾은선 — xs·ys 의 0 번부터 count 개(소수 부분은 마지막 마디를 그만큼만)를 한 번에 긋는다
    function strokeRun(xs, ys, count, width, color, alpha) {
        const whole = Math.floor(count);
        if (whole < 1) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(xs[0], ys[0]);
        const last = Math.min(whole, xs.length - 1);
        for (let i = 1; i <= last; i += 1) {
            ctx.lineTo(xs[i], ys[i]);
        }
        const f = count - whole;
        if (f > 0 && whole + 1 < xs.length) {
            ctx.lineTo(lerp(xs[whole], xs[whole + 1], f), lerp(ys[whole], ys[whole + 1], f));
        }
        ctx.lineWidth = width;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(color, alpha);
        ctx.stroke();
    }
    // 꺾은선 한 토막 — from 번째 꼭짓점부터 to 번째까지(to 의 소수 부분은 마지막 마디를 그만큼만)
    function strokeSpan(xs, ys, from, to, width, color, alpha) {
        const end = Math.min(Math.floor(to), xs.length - 1);
        if (end <= from) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(xs[from], ys[from]);
        for (let i = from + 1; i <= end; i += 1) {
            ctx.lineTo(xs[i], ys[i]);
        }
        const f = to - Math.floor(to);
        if (f > 0 && end + 1 < xs.length) {
            ctx.lineTo(lerp(xs[end], xs[end + 1], f), lerp(ys[end], ys[end + 1], f));
        }
        ctx.lineWidth = width;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(color, alpha);
        ctx.stroke();
    }
    // 펜촉 — 지금 긋고 있는 자리. 잉크 점 둘레에 파스텔 고리
    function drawNib(x, y, ring) {
        ctx.beginPath();
        ctx.arc(x, y, 7, 0, TAU);
        ctx.fillStyle = rgba(ring, 0.75);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y, 2.6, 0, TAU);
        ctx.fillStyle = rgba(INK, 1);
        ctx.fill();
    }
    // 원본 그림 판 — 어둡기 함수(0~1)를 칸마다 칠한 화면 밖 캔버스. 펜이 그리기 전에 옅게 깔아 무엇을 따라 그리는지 보인다
    function makeSourceLayer(dark, tint) {
        const layer = document.createElement('canvas');
        layer.width = W;
        layer.height = H;
        const lc = layer.getContext('2d');
        if (!lc) {
            return layer;
        }
        const img = lc.createImageData(W, H);
        for (let y = 0; y < H; y += 1) {
            for (let x = 0; x < W; x += 1) {
                const d = dark(x + 0.5, y + 0.5);
                const o = (y * W + x) * 4;
                img.data[o] = Math.round(lerp(PAPER[0], tint[0], d));
                img.data[o + 1] = Math.round(lerp(PAPER[1], tint[1], d));
                img.data[o + 2] = Math.round(lerp(PAPER[2], tint[2], d));
                img.data[o + 3] = 255;
            }
        }
        lc.putImageData(img, 0, 0);
        return layer;
    }
    // 지우는 중이면 그림 전체를 종이색으로 덮어 간다 — phase 2~3 에서 덮개 불투명도 0→1
    function eraseVeil(phase) {
        if (phase <= 2) {
            return;
        }
        ctx.fillStyle = rgba(PAPER, smooth(phase - 2));
        ctx.fillRect(0, 0, W, H);
    }
    // 08 한 줄 필기체 — 화면 밖 캔버스에 글자를 하나씩 그려 픽셀을 읽고, 윤곽이 지나는 칸(GLYPH_CELL)을 점으로 바꾼다.
    // 글자마다 가장 가까운 점부터 이어 경로를 만들고, 글자와 글자 사이는 기준선 아래(BASELINE_DIP)로 내려가 이어 붙인다
    const WORD = 'atelier';
    const GLYPH_FONT = 'italic 700 104px serif';
    const GLYPH_CELL = 3;
    // 글자 칸을 몇 개 건너 하나씩 쓸 것인가 — 2 면 윤곽 점의 절반으로 곡선을 메운다
    const DOT_STRIDE = 2;
    const BASE_Y = 190;
    const BASELINE_DIP = 14;
    const WRITE_SPEED = 620;
    const HOLD_TIME = 2;
    // 글자 하나의 윤곽 칸 — 안쪽 칸(알파 > 128) 가운데 위·아래·왼·오른쪽 이웃 하나라도 바깥인 칸
    function glyphOutline(ch, x) {
        const off = document.createElement('canvas');
        off.width = W;
        off.height = H;
        const oc = off.getContext('2d');
        const g = { xs: [], ys: [], cells: 0 };
        if (!oc) {
            return g;
        }
        oc.font = GLYPH_FONT;
        oc.fillStyle = rgba(INK, 1);
        oc.fillText(ch, x, BASE_Y);
        let data;
        try {
            // 같은 페이지에서 코드로 그린 글자라 읽기가 막히지 않는다. 다른 출처 그림을 그린 캔버스는 여기서 보안 오류가 난다
            data = oc.getImageData(0, 0, W, H).data;
        }
        catch (err) {
            return g;
        }
        const cols = Math.floor(W / GLYPH_CELL);
        const rows = Math.floor(H / GLYPH_CELL);
        const inside = new Uint8Array(cols * rows);
        for (let r = 0; r < rows; r += 1) {
            for (let c = 0; c < cols; c += 1) {
                const px = Math.floor((c + 0.5) * GLYPH_CELL);
                const py = Math.floor((r + 0.5) * GLYPH_CELL);
                inside[r * cols + c] = data[(py * W + px) * 4 + 3] > 128 ? 1 : 0;
            }
        }
        for (let r = 1; r < rows - 1; r += 1) {
            for (let c = 1; c < cols - 1; c += 1) {
                const i = r * cols + c;
                if (!inside[i]) {
                    continue;
                }
                if (inside[i - 1] && inside[i + 1] && inside[i - cols] && inside[i + cols]) {
                    continue;
                }
                g.xs.push((c + 0.5) * GLYPH_CELL);
                g.ys.push((r + 0.5) * GLYPH_CELL);
                g.cells += 1;
            }
        }
        return g;
    }
    // 글자 안 경로 — 가장 왼쪽 아래 점에서 출발해 가장 가까운 점으로. DOT_STRIDE 개마다 하나만 남긴다
    function glyphPath(g) {
        const n = g.xs.length;
        if (n === 0) {
            return [[], []];
        }
        const xs = Float32Array.from(g.xs);
        const ys = Float32Array.from(g.ys);
        let start = 0;
        for (let i = 1; i < n; i += 1) {
            if (xs[i] - ys[i] < xs[start] - ys[start]) {
                start = i;
            }
        }
        const order = greedyChain(xs, ys, n, start);
        const px = [];
        const py = [];
        for (let k = 0; k < n; k += DOT_STRIDE) {
            px.push(xs[order[k]]);
            py.push(ys[order[k]]);
        }
        return [px, py];
    }
    // 가장 가까운 점 잇기 — 글자 하나는 점이 수백 개라 다 훑어도 가볍다
    function greedyChain(xs, ys, n, start) {
        const order = new Int32Array(n);
        const used = new Uint8Array(n);
        let cur = start;
        used[cur] = 1;
        order[0] = cur;
        for (let k = 1; k < n; k += 1) {
            let best = -1;
            let bestD = 1e18;
            for (let i = 0; i < n; i += 1) {
                if (used[i]) {
                    continue;
                }
                const dd = (xs[i] - xs[cur]) * (xs[i] - xs[cur]) + (ys[i] - ys[cur]) * (ys[i] - ys[cur]);
                if (dd < bestD) {
                    bestD = dd;
                    best = i;
                }
            }
            used[best] = 1;
            order[k] = best;
            cur = best;
        }
        return order;
    }
    function buildCursive() {
        const m = document.createElement('canvas').getContext('2d');
        const px = [];
        const py = [];
        const lefts = [];
        const starts = [];
        let cells = 0;
        let joins = 0;
        if (!m) {
            return { curve: polylineCurve([0, 1], [0, 0]), letters: 0, cells: 0, dots: 0, joins: 0, lefts: lefts, starts: [] };
        }
        m.font = GLYPH_FONT;
        const left = (W - m.measureText(WORD).width) / 2;
        for (let k = 0; k < WORD.length; k += 1) {
            const x = left + m.measureText(WORD.slice(0, k)).width;
            lefts.push(x);
            const g = glyphOutline(WORD[k], x);
            cells += g.cells;
            const path = glyphPath(g);
            if (path[0].length === 0) {
                continue;
            }
            if (px.length > 0) {
                // 앞 글자 끝 → 기준선 아래로 내려가 → 다음 글자 첫 점 아래 → 첫 점. 필기체의 이음 획
                px.push(px[px.length - 1] + 6, path[0][0] - 6);
                py.push(BASE_Y + BASELINE_DIP, BASE_Y + BASELINE_DIP);
                joins += 1;
            }
            starts.push(px.length * CURVE_STEPS);
            for (let i = 0; i < path[0].length; i += 1) {
                px.push(path[0][i]);
                py.push(path[1][i]);
            }
        }
        return { curve: curveThrough(px, py), letters: WORD.length, cells: cells, dots: px.length, joins: joins, lefts: lefts, starts: starts };
    }
    const cursive = buildCursive();
    const DRAW_TIME = cursive.curve.total / WRITE_SPEED;
    const CYCLE = DRAW_TIME + HOLD_TIME + ERASE_TIME;
    // 첫 화면이 비지 않게 첫 세 글자를 쓴 자리(1.4초)에서 시작한다 — 순환이 돌면 처음부터 다시 그린다
    const START_AT = 1.4;
    const FINISH_T = DRAW_TIME + 0.3;
    let writeIndex = 0;
    function reset() { writeIndex = 0; }
    function update(t, dt) { writeIndex = indexAtLength(cursive.curve, Math.min(t, DRAW_TIME) * WRITE_SPEED); }
    const LETTER_COLORS = [PINK, BUTTER, SAGE, SKY, LAVENDER, CORAL];
    function draw(t) {
        const phase = cyclePhase(t, DRAW_TIME, HOLD_TIME);
        clearPaper();
        // 기준선 — 이음 획이 내려가는 자리를 옅은 하늘색 띠로
        ctx.fillStyle = rgba(SKY, 0.5);
        ctx.fillRect(24, BASE_Y + BASELINE_DIP - 3, W - 48, 6);
        // 원본 글자 — 옅은 라벤더로 깔았다가 써 나가는 동안 사라진다
        ctx.globalAlpha = 0.9 * (1 - smooth(Math.min(1, phase)));
        ctx.font = GLYPH_FONT;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = rgba(LAVENDER, 1);
        for (let k = 0; k < WORD.length; k += 1) {
            ctx.fillText(WORD[k], cursive.lefts[k], BASE_Y);
        }
        ctx.globalAlpha = 1;
        // 글자별 형광 띠 — 같은 글자의 윤곽 점에서 나온 구간은 같은 파스텔. 이음 획은 앞 글자 색을 이어 쓴다
        for (let k = 0; k < cursive.starts.length; k += 1) {
            const from = cursive.starts[k];
            const to = Math.min(writeIndex, k + 1 < cursive.starts.length ? cursive.starts[k + 1] : cursive.curve.xs.length - 1);
            if (to > from) {
                strokeSpan(cursive.curve.xs, cursive.curve.ys, from, to, 11, LETTER_COLORS[k % LETTER_COLORS.length], 0.75);
            }
        }
        strokeRun(cursive.curve.xs, cursive.curve.ys, writeIndex, 2.4, INK, 1);
        if (phase < 1) {
            const p = pointAtIndex(cursive.curve, writeIndex);
            drawNib(p[0], p[1], CORAL);
        }
        eraseVeil(phase);
    }
    // 한 프레임에 넘기는 시간 상한(초) — 탭을 오래 숨겼다 돌아온 첫 프레임에도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    // 앞당겨 돌리기 걸음(초) — 시작 자리(START_AT)나 완성 판(FINISH_T)까지 1/60초씩 계산만 하고 그리지 않는다
    const SKIP_STEP = 1 / 60;
    // 장면 시계(초) — 순환 하나 안에서의 자리. CYCLE 을 넘으면 0 으로 돌아가 처음부터 다시 그린다
    let cycleT = 0;
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 손대면 시연 표시를 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    // 리스너는 한 묶음으로 달고 정리할 때 한 번에 뗀다
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        const live = root.querySelector('[aria-live]');
        if (live) {
            live.setAttribute('aria-live', 'polite');
        }
    }
    // 시계를 to 초까지 계산만 하고 넘긴다
    function skipTo(to) {
        while (cycleT + SKIP_STEP <= to) {
            cycleT += SKIP_STEP;
            update(cycleT, SKIP_STEP);
        }
    }
    function advance(dt) {
        cycleT += dt;
        if (cycleT >= CYCLE) {
            cycleT = 0;
            reset();
        }
        update(cycleT, dt);
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        draw(cycleT);
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 시계 다시 맞추기 — 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 동작 줄이기 — 루프를 돌리지 않고 다 그려진 한 장(FINISH_T)만 그린다
    function showFinished() {
        stopLoop();
        cycleT = 0;
        reset();
        skipTo(FINISH_T);
        draw(cycleT);
    }
    function play() {
        cycleT = 0;
        reset();
        skipTo(START_AT);
        draw(cycleT);
        if (!paused) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 루프를 멈추고, 돌아오면 시계를 다시 맞춰 이어 그린다 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 페이지를 연 채 바뀌면 — 켜지면 완성 판으로 멈추고, 꺼지면 시연을 처음부터
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showFinished();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw(cycleT);
    }, { signal: off.signal });
    fitCanvas();
    if (still) {
        showFinished();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
