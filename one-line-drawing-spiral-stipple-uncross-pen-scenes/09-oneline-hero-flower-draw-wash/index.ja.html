<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一本線で描かれたあと色がにじみ込む花のファーストビュー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld is-demo" id="ld">
  <canvas class="ld__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="花の絵を点に均し、絡まった道すじをほどいてから震えるペンが一本線で描き、その下にパステルの色がにじみ込むファーストビュー。"></canvas>
  <button class="ld__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("ld");
    if (!root) return;
    // 판 좌표 — 캔버스 안은 늘 480×300. 화면에 보이는 크기와 상관없이 계산은 이 좌표로 한다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 같은 시드면 같은 점 배치·같은 떨림이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 1차원 값 노이즈 — 정수 자리마다 시드로 정한 값(-1~1)을 두고 사이는 부드러운 보간. 손 떨림에 쓴다
    const NOISE_TABLE = new Float32Array(256);
    const noiseRng = makeRng(483);
    for (let i = 0; i < 256; i += 1) {
        NOISE_TABLE[i] = noiseRng() * 2 - 1;
    }
    function smoothNoise(x) {
        const i = Math.floor(x);
        const f = x - i;
        const u = f * f * (3 - 2 * f);
        return lerp(NOISE_TABLE[i & 255], NOISE_TABLE[(i + 1) & 255], u);
    }
    // 도형 거리 — 타원 안이면 음수, 밖이면 양수(px 에 가까운 근사). 원본 그림을 코드로 그릴 때 쓴다
    function ellipseDist(x, y, cx, cy, rx, ry) {
        const dx = (x - cx) / rx;
        const dy = (y - cy) / ry;
        return (Math.sqrt(dx * dx + dy * dy) - 1) * Math.min(rx, ry);
    }
    // 선분까지의 거리(px)
    function segmentDist(x, y, ax, ay, bx, by) {
        const vx = bx - ax;
        const vy = by - ay;
        const k = clamp(((x - ax) * vx + (y - ay) * vy) / Math.max(1e-9, vx * vx + vy * vy), 0, 1);
        const ex = x - (ax + vx * k);
        const ey = y - (ay + vy * k);
        return Math.sqrt(ex * ex + ey * ey);
    }
    // 거리 → 칠한 정도 0~1. 경계 1px 를 부드럽게 넘긴다
    function fillOf(dist) { return clamp(0.5 - dist, 0, 1); }
    // 두 점 사이 거리
    function dist2(ax, ay, bx, by) {
        const dx = ax - bx;
        const dy = ay - by;
        return Math.sqrt(dx * dx + dy * dy);
    }
    // 꺾은선 길이 — xs·ys 를 order 순서로 이었을 때(닫지 않음)
    function pathLength(xs, ys, order, n) {
        let sum = 0;
        for (let i = 1; i < n; i += 1) {
            sum += dist2(xs[order[i - 1]], ys[order[i - 1]], xs[order[i]], ys[order[i]]);
        }
        return sum;
    }
    // 파스텔 팔레트 — 미색 종이 바탕 위에 진한 잉크 선. 잉크·종이는 데모 토큰($subject-ink·$subject-cream)과 같은 값
    const PAPER = [255, 247, 230];
    const INK = [23, 20, 26];
    const CORAL = [244, 166, 150];
    const LAVENDER = [192, 176, 236];
    const BUTTER = [246, 224, 150];
    const SAGE = [164, 208, 172];
    const PINK = [244, 182, 204];
    const SKY = [164, 206, 236];
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 한 장면의 순환 — 그리기 → 머묾 → 지움. 지움이 끝나면 처음부터 다시
    function cyclePhase(t, drawTime, holdTime) {
        // 0~1 은 그리는 중, 1~2 는 머무는 중, 2~3 은 지우는 중
        if (t < drawTime) {
            return t / drawTime;
        }
        if (t < drawTime + holdTime) {
            return 1 + (t - drawTime) / holdTime;
        }
        return 2 + (t - drawTime - holdTime) / ERASE_TIME;
    }
    // 지우기 시간(초) — 모든 장면이 같은 빠르기로 종이색으로 돌아간다
    const ERASE_TIME = 1;
    // 원본 그림 4 — 코드로 만든 꽃 한 송이. 칸마다 어둡기 0~1. 외부 사진을 읽지 않는다
    const FLOWER_X = 240;
    const FLOWER_Y = 116;
    const PETALS = 6;
    // 돌린 타원 거리 — 각 a 만큼 돌린 좌표에서 잰다
    function rotatedEllipseDist(x, y, cx, cy, rx, ry, a) {
        const c = Math.cos(a);
        const s = Math.sin(a);
        const dx = x - cx;
        const dy = y - cy;
        return ellipseDist(c * dx + s * dy, -s * dx + c * dy, 0, 0, rx, ry);
    }
    function flowerDark(x, y) {
        let d = 0;
        // 줄기와 잎 둘
        d = Math.max(d, 0.75 * fillOf(segmentDist(x, y, FLOWER_X, FLOWER_Y + 30, FLOWER_X - 6, 290) - 3.5));
        const leafL = rotatedEllipseDist(x, y, 204, 232, 34, 12, -0.5);
        const leafR = rotatedEllipseDist(x, y, 274, 206, 32, 11, 0.55);
        d = Math.max(d, 0.45 * fillOf(Math.min(leafL, leafR)), 0.8 * fillOf(Math.abs(Math.min(leafL, leafR)) - 2));
        // 꽃잎 여섯 — 속은 옅게, 테두리는 진하게, 가운데 쪽으로 그늘
        for (let k = 0; k < PETALS; k += 1) {
            const a = k * TAU / PETALS - Math.PI / 2;
            const pd = rotatedEllipseDist(x, y, FLOWER_X + Math.cos(a) * 50, FLOWER_Y + Math.sin(a) * 50, 38, 21, a);
            if (pd < 0) {
                d = Math.max(d, 0.22 + 0.3 * smooth(1 - dist2(x, y, FLOWER_X, FLOWER_Y) / 80));
            }
            d = Math.max(d, 0.85 * fillOf(Math.abs(pd) - 2));
        }
        // 꽃술 — 가운데 원
        const core = dist2(x, y, FLOWER_X, FLOWER_Y);
        if (core < 22) {
            d = Math.max(d, 0.92);
        }
        return d;
    }
    // 점 찍기 공용 — 어둡기만큼 점을 뿌리고, 점마다 「자기에게 가장 가까운 칸들」 의 어둡기 무게중심으로 옮긴다
    // 점 수 상한 — 칸 수(아래 STIPPLE_CELL 로 160×100)와 함께 한 번 옮기기의 일이 점 수에 비례해 커진다
    const MAX_DOTS = 2400;
    // 칸 한 변(px) — 어둡기를 이 크기 칸의 가운데에서 한 번 재어 무게로 쓴다
    const STIPPLE_CELL = 3;
    // 가까운 점 찾기용 바구니 한 변(px) — 칸마다 점 전부를 훑지 않고 둘레 바구니만 본다
    const BUCKET = 12;
    const COLS = Math.ceil(W / STIPPLE_CELL);
    const ROWS = Math.ceil(H / STIPPLE_CELL);
    const BCOLS = Math.ceil(W / BUCKET);
    const BROWS = Math.ceil(H / BUCKET);
    // 칸 무게 — 어둡기를 칸 가운데에서 한 번만 잰다. 옮기기를 몇 번 되풀이해도 그림 함수는 다시 부르지 않는다
    function makeWeights(dark) {
        const w = new Float32Array(COLS * ROWS);
        for (let r = 0; r < ROWS; r += 1) {
            for (let c = 0; c < COLS; c += 1) {
                w[r * COLS + c] = dark((c + 0.5) * STIPPLE_CELL, (r + 0.5) * STIPPLE_CELL);
            }
        }
        return w;
    }
    // 어둡기만큼 뿌리기 — 아무 자리나 뽑아 그 칸 무게의 GAMMA 제곱 확률로 받아들인다(어두운 곳에 더 많이)
    const SCATTER_GAMMA = 1.4;
    function scatterDots(weights, count, seed) {
        const n = Math.min(count, MAX_DOTS);
        const rng = makeRng(seed);
        const xs = new Float32Array(n);
        const ys = new Float32Array(n);
        let k = 0;
        while (k < n) {
            const x = rng() * W;
            const y = rng() * H;
            const wv = weights[Math.min(ROWS - 1, Math.floor(y / STIPPLE_CELL)) * COLS + Math.min(COLS - 1, Math.floor(x / STIPPLE_CELL))];
            if (rng() < Math.pow(wv, SCATTER_GAMMA)) {
                xs[k] = x;
                ys[k] = y;
                k += 1;
            }
        }
        return { xs: xs, ys: ys, n: n };
    }
    // 거리 비교 횟수 — 바구니 덕에 얼마나 덜 훑는지 사실 측정이 읽는다
    let nearestChecks = 0;
    const bucketHead = new Int32Array(BCOLS * BROWS);
    const bucketNext = new Int32Array(MAX_DOTS);
    const sumX = new Float64Array(MAX_DOTS);
    const sumY = new Float64Array(MAX_DOTS);
    const sumW = new Float64Array(MAX_DOTS);
    // 한 번 옮기기 — 칸마다 가장 가까운 점을 찾아 그 점의 합에 (칸 위치 × 무게) 를 더한 뒤, 점을 합 ÷ 무게 자리로.
    // 결과는 toX·toY 에 쓰고 점들의 평균 이동 거리(px)를 돌려준다
    function relaxStep(dots, weights, toX, toY) {
        bucketHead.fill(-1);
        for (let i = 0; i < dots.n; i += 1) {
            const b = clamp(Math.floor(dots.ys[i] / BUCKET), 0, BROWS - 1) * BCOLS + clamp(Math.floor(dots.xs[i] / BUCKET), 0, BCOLS - 1);
            bucketNext[i] = bucketHead[b];
            bucketHead[b] = i;
            sumX[i] = 0;
            sumY[i] = 0;
            sumW[i] = 0;
        }
        for (let r = 0; r < ROWS; r += 1) {
            for (let c = 0; c < COLS; c += 1) {
                const wv = weights[r * COLS + c];
                if (wv <= 0.05) {
                    continue;
                }
                const px = (c + 0.5) * STIPPLE_CELL;
                const py = (r + 0.5) * STIPPLE_CELL;
                const bc = Math.floor(px / BUCKET);
                const br = Math.floor(py / BUCKET);
                let best = -1;
                let bestD = 1e18;
                // 둘레 바구니를 한 겹씩 넓힌다 — 찾은 점이 다음 겹보다 가까우면 거기서 멈춘다
                for (let ring = 0; ring < Math.max(BCOLS, BROWS); ring += 1) {
                    for (let yy = br - ring; yy <= br + ring; yy += 1) {
                        if (yy < 0 || yy >= BROWS) {
                            continue;
                        }
                        for (let xx = bc - ring; xx <= bc + ring; xx += 1) {
                            if (xx < 0 || xx >= BCOLS) {
                                continue;
                            }
                            if (Math.max(Math.abs(xx - bc), Math.abs(yy - br)) !== ring) {
                                continue;
                            }
                            for (let i = bucketHead[yy * BCOLS + xx]; i >= 0; i = bucketNext[i]) {
                                nearestChecks += 1;
                                const dx = dots.xs[i] - px;
                                const dy = dots.ys[i] - py;
                                const dd = dx * dx + dy * dy;
                                if (dd < bestD) {
                                    bestD = dd;
                                    best = i;
                                }
                            }
                        }
                    }
                    if (best >= 0 && Math.sqrt(bestD) <= ring * BUCKET) {
                        break;
                    }
                }
                if (best < 0) {
                    continue;
                }
                sumX[best] += px * wv;
                sumY[best] += py * wv;
                sumW[best] += wv;
            }
        }
        let moved = 0;
        for (let i = 0; i < dots.n; i += 1) {
            // 맡은 칸이 없는 점은 제자리 — 0 으로 나누지 않는다
            toX[i] = sumW[i] > 0 ? sumX[i] / sumW[i] : dots.xs[i];
            toY[i] = sumW[i] > 0 ? sumY[i] / sumW[i] : dots.ys[i];
            moved += dist2(toX[i], toY[i], dots.xs[i], dots.ys[i]);
        }
        return moved / Math.max(1, dots.n);
    }
    // 한 줄 경로 공용 — 가장 가까운 점부터 잇고, 엇갈린 두 구간을 찾아 그 사이 순서를 뒤집어 푼다
    // 거리 비교 횟수 — 사실 측정이 점 수에 따라 일이 얼마나 커지는지 읽는다
    let greedyChecks = 0;
    // 가장 가까운 점부터 — start 에서 출발해 아직 안 간 점 가운데 가장 가까운 점으로 간다. 점 n 개면 비교가 약 n²/2 번
    function greedyOrder(xs, ys, n, start) {
        const order = new Int32Array(n);
        const used = new Uint8Array(n);
        let cur = start;
        used[cur] = 1;
        order[0] = cur;
        for (let k = 1; k < n; k += 1) {
            let best = -1;
            let bestD = 1e18;
            for (let i = 0; i < n; i += 1) {
                if (used[i]) {
                    continue;
                }
                greedyChecks += 1;
                const dx = xs[i] - xs[cur];
                const dy = ys[i] - ys[cur];
                const dd = dx * dx + dy * dy;
                if (dd < bestD) {
                    bestD = dd;
                    best = i;
                }
            }
            used[best] = 1;
            order[k] = best;
            cur = best;
        }
        return order;
    }
    // 외적 — (b − a) × (c − a). 부호가 c 가 선분 ab 의 왼쪽(+)인지 오른쪽(−)인지 알려 준다
    function cross3(ax, ay, bx, by, cx, cy) {
        return (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
    }
    // 두 선분 ab·cd 가 엇갈리는가 — c·d 가 ab 의 서로 다른 쪽에 있고, a·b 도 cd 의 서로 다른 쪽에 있을 때
    function segmentsCross(ax, ay, bx, by, cx, cy, dx, dy) {
        const d1 = cross3(ax, ay, bx, by, cx, cy);
        const d2 = cross3(ax, ay, bx, by, dx, dy);
        const d3 = cross3(cx, cy, dx, dy, ax, ay);
        const d4 = cross3(cx, cy, dx, dy, bx, by);
        return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
    }
    function makeUntangle(order) {
        return { order: order, n: order.length, i: 0, j: 2, flips: 0, checks: 0, flipsThisPass: 0, done: order.length < 4, lastLo: -1, lastHi: -1 };
    }
    // tries 쌍까지만 견주고 돌아온다 — 점이 많아도 한 프레임이 이 일만큼만 붙잡힌다. 이번에 뒤집은 수를 돌려준다
    function untangleStep(u, xs, ys, tries) {
        let flipped = 0;
        const o = u.order;
        for (let k = 0; k < tries && !u.done; k += 1) {
            const a = o[u.i];
            const b = o[u.i + 1];
            const c = o[u.j];
            const d = o[u.j + 1];
            u.checks += 1;
            if (segmentsCross(xs[a], ys[a], xs[b], ys[b], xs[c], ys[c], xs[d], ys[d])) {
                // i+1 부터 j 까지 순서를 거꾸로 — a→c, b→d 로 다시 이어져 엇갈림이 사라지고 길이가 줄어든다
                let lo = u.i + 1;
                let hi = u.j;
                u.lastLo = lo;
                u.lastHi = hi;
                while (lo < hi) {
                    const tmp = o[lo];
                    o[lo] = o[hi];
                    o[hi] = tmp;
                    lo += 1;
                    hi -= 1;
                }
                u.flips += 1;
                u.flipsThisPass += 1;
                flipped += 1;
            }
            u.j += 1;
            if (u.j > u.n - 2) {
                u.i += 1;
                u.j = u.i + 2;
                if (u.i > u.n - 4) {
                    if (u.flipsThisPass === 0) {
                        u.done = true;
                    }
                    u.i = 0;
                    u.j = 2;
                    u.flipsThisPass = 0;
                }
            }
        }
        return flipped;
    }
    // 엇갈린 구간 쌍의 수 — 모든 쌍을 견줘 센다(사실 측정·완성 판 확인용, 프레임마다 부르지 않는다)
    function countCrossings(xs, ys, o) {
        let c = 0;
        for (let i = 0; i < o.length - 3; i += 1) {
            for (let j = i + 2; j < o.length - 1; j += 1) {
                if (segmentsCross(xs[o[i]], ys[o[i]], xs[o[i + 1]], ys[o[i + 1]], xs[o[j]], ys[o[j]], xs[o[j + 1]], ys[o[j + 1]])) {
                    c += 1;
                }
            }
        }
        return c;
    }
    // 곡선 공용 — 점 사이를 「이웃 네 점으로 정하는 3차 곡선」(조각마다 가운데 두 점을 지나고 바깥 두 점으로 기울기를 정한다)으로 메우고, 짧은 마디로 쪼개 누적 길이 표를 만든다
    // 3차 조각 — 두 끝점 p1·p2 와 그 자리의 접선 m1·m2 로 정하는 곡선. t 는 0~1
    function cubicPiece(p1, p2, m1, m2, t) {
        const t2 = t * t;
        const t3 = t2 * t;
        return (2 * t3 - 3 * t2 + 1) * p1 + (t3 - 2 * t2 + t) * m1 + (-2 * t3 + 3 * t2) * p2 + (t3 - t2) * m2;
    }
    // 이웃 접선 — 점 i 의 접선 = (다음 점 − 앞 점) ÷ 2. 이음매 양쪽 조각이 같은 접선을 쓰므로 꺾이지 않는다
    function neighborTangents(px) {
        const n = px.length;
        const m = [];
        for (let i = 0; i < n; i += 1) {
            m.push((px[Math.min(n - 1, i + 1)] - px[Math.max(0, i - 1)]) / 2);
        }
        return m;
    }
    // 조각마다 CURVE_STEPS 마디 — 마디 끝마다 누적 길이를 적어 둔다. 길이 표의 칸 수 = 조각 수 × CURVE_STEPS + 1
    const CURVE_STEPS = 16;
    function buildCurve(px, py, mx, my) {
        const xs = [px[0]];
        const ys = [py[0]];
        const lens = [0];
        let total = 0;
        for (let i = 0; i + 1 < px.length; i += 1) {
            for (let k = 1; k <= CURVE_STEPS; k += 1) {
                const t = k / CURVE_STEPS;
                const x = cubicPiece(px[i], px[i + 1], mx[i], mx[i + 1], t);
                const y = cubicPiece(py[i], py[i + 1], my[i], my[i + 1], t);
                total += dist2(x, y, xs[xs.length - 1], ys[ys.length - 1]);
                xs.push(x);
                ys.push(y);
                lens.push(total);
            }
        }
        return { xs: Float32Array.from(xs), ys: Float32Array.from(ys), lens: Float32Array.from(lens), total: total, seams: px.length - 2 };
    }
    // 지나는 점들로 곡선 — 이웃 접선을 붙여 buildCurve

        if (dotAlpha > 0) {
            ctx.beginPath();
            for (let i = 0; i < dots09.n; i += 1) {
                ctx.moveTo(dots09.xs[i] + 2, dots09.ys[i]);
                ctx.arc(dots09.xs[i], dots09.ys[i], 2, 0, TAU);
            }
            ctx.fillStyle = rgba(INK, dotAlpha);
            ctx.fill();
        }
        // 길 — 가장 가까운 점부터 이은 줄이 나타나 엇갈림이 풀리고, 펜이 시작하면 옅어진다
        if (t > T_PATH && t < T_PEN + 0.8) {
            const o = route09.order;
            const shown = (o.length - 1) * Math.min(1, (t - T_PATH) / 0.35);
            ctx.beginPath();
            ctx.moveTo(final09.xs[o[0]], final09.ys[o[0]]);
            for (let k = 1; k <= shown; k += 1) {
                ctx.lineTo(final09.xs[o[k]], final09.ys[o[k]]);
            }
            ctx.lineWidth = 1.5;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = rgba(CORAL, 0.9 * (1 - smooth((t - T_PEN) / 0.8)));
            ctx.stroke();
        }
        if (t > T_PEN) {
            drawInk(ink09, pen09, INK, INK_SCALE_09);
            if (t < T_WASH) {
                const i = Math.min(Math.floor(pen09), ink09.xs.length - 1);
                drawNib(ink09.xs[i], ink09.ys[i], CORAL);
            }
        }
        eraseVeil(phase);
    }
    // 한 프레임에 넘기는 시간 상한(초) — 탭을 오래 숨겼다 돌아온 첫 프레임에도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    // 앞당겨 돌리기 걸음(초) — 시작 자리(START_AT)나 완성 판(FINISH_T)까지 1/60초씩 계산만 하고 그리지 않는다
    const SKIP_STEP = 1 / 60;
    // 장면 시계(초) — 순환 하나 안에서의 자리. CYCLE 을 넘으면 0 으로 돌아가 처음부터 다시 그린다
    let cycleT = 0;
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 손대면 시연 표시를 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    // 리스너는 한 묶음으로 달고 정리할 때 한 번에 뗀다
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        const live = root.querySelector('[aria-live]');
        if (live) {
            live.setAttribute('aria-live', 'polite');
        }
    }
    // 시계를 to 초까지 계산만 하고 넘긴다
    function skipTo(to) {
        while (cycleT + SKIP_STEP <= to) {
            cycleT += SKIP_STEP;
            update(cycleT, SKIP_STEP);
        }
    }
    function advance(dt) {
        cycleT += dt;
        if (cycleT >= CYCLE) {
            cycleT = 0;
            reset();
        }
        update(cycleT, dt);
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        draw(cycleT);
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 시계 다시 맞추기 — 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 동작 줄이기 — 루프를 돌리지 않고 다 그려진 한 장(FINISH_T)만 그린다
    function showFinished() {
        stopLoop();
        cycleT = 0;
        reset();
        skipTo(FINISH_T);
        draw(cycleT);
    }
    function play() {
        cycleT = 0;
        reset();
        skipTo(START_AT);
        draw(cycleT);
        if (!paused) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 루프를 멈추고, 돌아오면 시계를 다시 맞춰 이어 그린다 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 페이지를 연 채 바뀌면 — 켜지면 완성 판으로 멈추고, 꺼지면 시연을 처음부터
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showFinished();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw(cycleT);
    }, { signal: off.signal });
    fitCanvas();
    if (still) {
        showFinished();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
