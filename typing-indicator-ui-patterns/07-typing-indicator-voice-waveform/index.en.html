<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice-input waveform — bars redrawn from an amplitude array — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="waveform" role="status" aria-live="polite" aria-label="Recording voice message">
    <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
    <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
    <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
  </div>
</section>
</main>
<script>
// 음성 입력 파형 — 미리 정한 진폭 값 배열을 순서대로 읽어 막대마다 높이를 다시 계산한다.
// 계산 겹: 진폭 배열 인덱스 순회 → scaleY 재계산(고정 배열, 오디오 API 미호출). 자동 재생만, 실사용자 리스너 없음.
(function () {
  var bars = document.querySelectorAll('.bar');
  if (!bars.length) return;

  var AMPLITUDE_TICK_MS = 80;
  var AMPLITUDES = [.25, .55, .82, .38, .68, .92, .30, .60, .78, .42, .58, .88, .34, .64, .48, .70];

  var idx = 0;
  function tick() {
    bars.forEach(function (bar, i) {
      var v = AMPLITUDES[(idx + i) % AMPLITUDES.length];
      bar.style.transform = 'scaleY(' + v.toFixed(2) + ')';
    });
    idx = (idx + 1) % AMPLITUDES.length;
  }

  tick();
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  setInterval(tick, AMPLITUDE_TICK_MS);
})();
</script>
</body>
</html>
