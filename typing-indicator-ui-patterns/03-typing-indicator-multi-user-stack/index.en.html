<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-user overlap — a row computing name-tag width from concurrent typers — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="row" role="status" aria-live="polite" aria-label="Multiple people typing">
    <div class="avatars">
      <span class="avatar avatar--1" aria-hidden="true"></span>
      <span class="avatar avatar--2" aria-hidden="true"></span>
      <span class="avatar avatar--3" aria-hidden="true"></span>
    </div>
    <span class="badge" id="badge">+2</span>
  </div>
  <span class="measure" id="measure" aria-hidden="true">+2</span>
</section>
</main>
<script>
// 다중 사용자 겹침 — 동시 입력자 수가 바뀔 때마다 라벨 텍스트의 실제 렌더 너비를 재고 그 값으로 배지 너비를 다시 그린다.
// 계산 겹: 인원 수 → 라벨 텍스트 → getBoundingClientRect 실측 폭 → 배지 너비 보간. 자동 재생만, 실사용자 리스너 없음.
(function () {
  var badge = document.getElementById('badge');
  var measure = document.getElementById('measure');
  if (!badge || !measure) return;

  var COUNTS = [2, 3, 4];
  var HOLD_MS = 620;
  var MORPH_MS = 300;

  function widthFor(n) {
    measure.textContent = '+' + n;
    return measure.getBoundingClientRect().width;
  }

  var widths = COUNTS.map(widthFor);
  var CYCLE_MS = HOLD_MS * COUNTS.length;

  function apply(t) {
    var phase = Math.floor(t / HOLD_MS) % COUNTS.length;
    var next = (phase + 1) % COUNTS.length;
    var phaseT = t % HOLD_MS;
    var p = Math.min(phaseT / MORPH_MS, 1);
    var w = widths[phase] + (widths[next] - widths[phase]) * p;
    badge.style.setProperty('--bw', w.toFixed(1));
    badge.textContent = '+' + COUNTS[phase];
  }

  apply(0);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { badge.style.setProperty('--bw', widths[0]); badge.textContent = '+' + COUNTS[0]; return; }
  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
