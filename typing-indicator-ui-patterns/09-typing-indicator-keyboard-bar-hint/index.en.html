<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyboard-bar hint — an indicator repositioned by a virtual keyboard height value — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="screen">
    <span class="indicator" id="indicator">Typing…</span>
    <div class="keyboard" id="keyboard"></div>
  </div>
</section>
</main>
<script>
// 키보드 열림 표시 이동 — 키보드 높이 값을 시간에 따라 재계산해 표시줄과 키보드를 함께 translateY 로 옮긴다.
// 계산 겹: ease-in-out 진행률 → 키보드 높이 h 재계산 → translateY(둘 다 transform 만 사용, top/height 미변경).
(function () {
  var keyboard = document.getElementById('keyboard');
  var indicator = document.getElementById('indicator');
  if (!keyboard || !indicator) return;

  var KB_H = 64;
  var CYCLE_MS = 2000;
  var OPEN_START = 0.10 * CYCLE_MS;
  var OPEN_MS = 360;
  var CLOSE_START = 0.62 * CYCLE_MS;
  var CLOSE_MS = 360;

  function ease(p) {
    return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  }

  function heightAt(t) {
    if (t < OPEN_START) return 0;
    if (t < OPEN_START + OPEN_MS) {
      return KB_H * ease((t - OPEN_START) / OPEN_MS);
    }
    if (t < CLOSE_START) return KB_H;
    if (t < CLOSE_START + CLOSE_MS) {
      return KB_H * (1 - ease((t - CLOSE_START) / CLOSE_MS));
    }
    return 0;
  }

  function apply(h) {
    keyboard.style.transform = 'translateY(' + (KB_H - h) + 'px)';
    indicator.style.transform = 'translateY(' + (-h) + 'px)';
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    apply(KB_H);
    return;
  }

  var start = null;
  function frame(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(heightAt(t));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
