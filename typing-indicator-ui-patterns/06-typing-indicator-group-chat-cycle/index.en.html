<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group chat cycle — a label redrawing width from remaining time as typers change — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="row" role="status" aria-live="polite" aria-label="Group chat typing indicator">
    <span class="who" id="who">A</span>
    <span class="track"><span class="fill" id="fill"></span></span>
  </div>
</section>
</main>
<script>
// 그룹 채팅 순환 — 입력자가 바뀔 때마다 이전 이름이 남아 있을 시간 값을 세어 그 값만큼 막대를 줄인다.
// 계산 겹: 남은 시간 비율 재계산 → scaleX 로 반영, 다음 입력자로 교체. 자동 재생만, 실사용자 리스너 없음.
(function () {
  var who = document.getElementById('who');
  var fill = document.getElementById('fill');
  if (!who || !fill) return;

  var NAMES = ['A', 'B', 'C'];
  var HOLD_MS = 640;
  var CYCLE_MS = HOLD_MS * NAMES.length;

  function apply(t) {
    var idx = Math.floor(t / HOLD_MS) % NAMES.length;
    var phaseT = t % HOLD_MS;
    var remain = 1 - phaseT / HOLD_MS;
    who.textContent = NAMES[idx];
    fill.style.transform = 'scaleX(' + remain.toFixed(3) + ')';
  }

  apply(0);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { fill.style.transform = 'scaleX(1)'; return; }
  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
