<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mute toggle — a switch interpolating opacity by its state value — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="card" id="card">
    <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <span class="label">Typing</span>
  </div>
  <button class="muteBtn" id="muteBtn" type="button" aria-pressed="false" aria-label="Toggle typing indicator mute">
    Mute
  </button>
  <span class="badge" id="muteBadge" hidden>Indicator off</span>
  <span class="sr" id="live" role="status" aria-live="polite"></span>
</section>
</main>
<script>
// 표시 끄기 토글 — 상태 값(켜짐/꺼짐)만큼 카드의 투명도를 보간하고, 꺼짐 표시는 별도 배지로 대비를 지킨다.
// 계산 겹: 상태 값 → 목표 투명도 재계산 → transition 으로 보간. 클릭 리스너 1개(이 항목만).
(function () {
  var btn = document.getElementById('muteBtn');
  var card = document.getElementById('card');
  var badge = document.getElementById('muteBadge');
  var live = document.getElementById('live');
  if (!btn || !card || !badge || !live) return;

  var OFF_OPACITY = 0.3;
  var AUTO_CYCLE_MS = 700;
  var muted = false;

  function apply() {
    card.style.opacity = muted ? String(OFF_OPACITY) : '1';
    badge.hidden = !muted;
    btn.setAttribute('aria-pressed', String(muted));
    live.textContent = muted ? 'Indicator off' : 'Indicator on';
  }

  btn.addEventListener('click', function () {
    muted = !muted;
    apply();
  });

  apply();
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  setInterval(function () {
    muted = !muted;
    apply();
  }, AUTO_CYCLE_MS);
})();
</script>
</body>
</html>
