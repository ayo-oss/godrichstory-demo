<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three-dot bounce — a basic indicator staggered by index — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="row">
    <span class="avatar" aria-hidden="true"></span>
    <div class="bubble" role="status" aria-live="polite" aria-label="Typing">
      <span class="dot" data-i="0"></span>
      <span class="dot" data-i="1"></span>
      <span class="dot" data-i="2"></span>
    </div>
  </div>
</section>
</main>
<script>
// 점 3개 바운스 — 각 점이 튀어 오르는 시작 시점을 점의 순서(index) 값에 간격을 곱해 다시 구한다.
// 계산 겹: 인덱스 × 간격(ms) → animation-delay 재계산(setProperty). 자동 재생만, 실사용자 리스너 없음.
(function () {
  var DOT_STAGGER_MS = 120;
  var dots = document.querySelectorAll('.dot');
  if (!dots.length) return;
  dots.forEach(function (dot) {
    var i = Number(dot.dataset.i || 0);
    dot.style.setProperty('--delay', (i * DOT_STAGGER_MS) + 'ms');
  });
})();
</script>
</body>
</html>
