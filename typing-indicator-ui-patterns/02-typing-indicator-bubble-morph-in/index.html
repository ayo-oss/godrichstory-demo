<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말풍선 모핑 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="row">
    <span class="avatar" aria-hidden="true"></span>
    <div class="bubble" id="bubble" role="status" aria-live="polite">
      <span class="dots" id="dots">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </span>
      <span class="msg" id="msg">메시지 도착</span>
    </div>
  </div>
</section>
</main>
<script>
// 말풍선 모핑 — 점 세 개의 합산 너비 값을 말풍선 하나의 너비 값으로 보간한다.
// 계산 겹: 경과 비율 → 너비 값(px) 재계산 → CSS 커스텀 프로퍼티(--w)에 반영. 자동 재생만, 실사용자 리스너 없음.
(function () {
  var bubble = document.getElementById('bubble');
  var dots = document.getElementById('dots');
  var msg = document.getElementById('msg');
  if (!bubble || !dots || !msg) return;

  var DOT_W = 56;
  var MSG_W = 168;
  var CYCLE_MS = 2000;
  var MORPH_START = 0.10 * CYCLE_MS;
  var MORPH_MS = 640;
  var REVERT_AT = 0.62 * CYCLE_MS;

  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }

  function apply(t) {
    var inMorph = t >= MORPH_START && t < REVERT_AT;
    var p = Math.min(Math.max((t - MORPH_START) / MORPH_MS, 0), 1);
    var eased = easeOut(p);
    var w = inMorph ? DOT_W + (MSG_W - DOT_W) * eased : DOT_W;
    bubble.style.setProperty('--w', w.toFixed(1));
    var done = inMorph && p >= 1;
    dots.style.opacity = done ? '0' : '1';
    msg.style.opacity = done ? '1' : '0';
  }

  apply(0);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { bubble.style.setProperty('--w', DOT_W); return; }
  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
