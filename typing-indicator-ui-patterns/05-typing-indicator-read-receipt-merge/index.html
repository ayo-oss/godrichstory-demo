<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>읽음 표시 병합 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="thread">
    <div class="dots" id="dots">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="msgRow" id="msgRow">
      <span class="msg">메시지 도착</span>
      <span class="receipt" id="receipt">읽음</span>
    </div>
  </div>
  <span class="sr" id="live" role="status" aria-live="polite"></span>
</section>
</main>
<script>
// 읽음 표시 병합 — 입력 표시가 사라진 시각과 메시지가 도착한 시각의 차를 재어 병합 여부를 판정한다.
// 계산 겹: Date.now() 두 시점의 차 → 기준값과 비교 → classList 로 병합 상태 반영. 자동 재생만, 실사용자 리스너 없음.
(function () {
  var dots = document.getElementById('dots');
  var msgRow = document.getElementById('msgRow');
  var receipt = document.getElementById('receipt');
  var live = document.getElementById('live');
  if (!dots || !msgRow || !receipt || !live) return;

  var MERGE_GAP_MS = 400;
  var CYCLE_MS = 2000;
  var VANISH_AT = 900;
  var ARRIVE_DELAY_MS = 180;
  var timer1 = null, timer2 = null;

  function runCycle() {
    dots.style.opacity = '1';
    msgRow.style.opacity = '0';
    receipt.classList.remove('is-merged');
    timer1 = setTimeout(function () {
      dots.style.opacity = '0';
      var vanishAt = Date.now();
      timer2 = setTimeout(function () {
        var arrivedAt = Date.now();
        var gap = arrivedAt - vanishAt;
        var merged = gap < MERGE_GAP_MS;
        msgRow.style.opacity = '1';
        receipt.classList.toggle('is-merged', merged);
        live.textContent = merged ? '합쳐진 표시' : '별도 표시';
      }, ARRIVE_DELAY_MS);
    }, VANISH_AT);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    dots.style.opacity = '0';
    msgRow.style.opacity = '1';
    receipt.classList.add('is-merged');
    return;
  }
  runCycle();
  setInterval(function () {
    clearTimeout(timer1);
    clearTimeout(timer2);
    runCycle();
  }, CYCLE_MS);
})();
</script>
</body>
</html>
