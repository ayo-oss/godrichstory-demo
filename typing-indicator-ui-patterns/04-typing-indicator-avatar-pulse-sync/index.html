<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아바타 펄스 동기화 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="avatarWrap">
    <span class="avatar" aria-hidden="true"></span>
    <span class="ring" id="ring" aria-hidden="true"></span>
  </div>
  <span class="status" id="status" role="status" aria-live="polite">입력 중</span>
</section>
</main>
<script>
// 아바타 펄스 동기화 — 입력이 지속된 시간이 길수록 박동 주기를 지속 시간 값에 비례해 다시 구한다.
// 계산 겹: 지속 시간(초, 데모 배속) → 주기(ms) 재계산 → setInterval 로 --period 갱신. 자동 재생만, 실사용자 리스너 없음.
(function () {
  var ring = document.getElementById('ring');
  var status = document.getElementById('status');
  if (!ring || !status) return;

  var BASE_PERIOD_MS = 900;
  var PULSE_SLOWDOWN_MS_PER_SEC = 40;
  var TICK_MS = 150;
  var MAX_TICKS = 8;

  var tick = 0;
  ring.style.setProperty('--period', BASE_PERIOD_MS + 'ms');

  function step() {
    tick = (tick + 1) % (MAX_TICKS + 1);
    var typing = tick > 0;
    var period = BASE_PERIOD_MS + tick * PULSE_SLOWDOWN_MS_PER_SEC;
    ring.style.setProperty('--period', period + 'ms');
    ring.classList.toggle('is-typing', typing);
    status.textContent = typing ? '입력 중' : '대기';
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { status.textContent = '대기'; return; }
  setInterval(step, TICK_MS);
})();
</script>
</body>
</html>
