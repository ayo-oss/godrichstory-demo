<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command run and output lines — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rn is-demo" id="rn">
  <p class="rn__bar">
    <span class="rn__ico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M224 56v144a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V56a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8" opacity=".2"/><path d="M128 128a8 8 0 0 1-3 6.25l-40 32a8 8 0 1 1-10-12.5L107.19 128L75 102.25a8 8 0 1 1 10-12.5l40 32a8 8 0 0 1 3 6.25m48 24h-40a8 8 0 0 0 0 16h40a8 8 0 0 0 0-16m56-96v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16m-16 144V56H40v144z"/></g></svg></span>
    <span class="rn__name">Build terminal</span>
  </p>
  <div class="rn__out" id="out" role="log" aria-live="polite">
    <p class="rn__line rn__line--echo" style="--i: 0">$ build</p>
    <p class="rn__line" style="--i: 1">resolving 12 modules</p>
    <p class="rn__line" style="--i: 2">bundling src/index.ts</p>
    <p class="rn__line rn__line--work is-done" style="--i: 3" id="work">
      <span class="rn__mark" aria-hidden="true"><span class="rn__spin"></span>
      <span class="rn__tick"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg></span></span>
      <span class="rn__work-text">writing dist</span>
    </p>
    <p class="rn__line rn__line--sum" style="--i: 4">done in 1.2s</p>
  </div>
  <form class="rn__form" id="form">
    <span class="rn__sign" aria-hidden="true">$</span>
    <input class="rn__input" id="input" type="text" autocomplete="off" placeholder="Type a command, then Enter" aria-label="Command to run">
  </form>
</div>
</main>
<script>
var rn = document.getElementById('rn');
var out = document.getElementById('out');
var form = document.getElementById('form');
var input = document.getElementById('input');
var SCRIPTS = {
  build: ['resolving 12 modules', 'bundling src/index.ts', 'WORK:writing dist', 'SUM:done in 1.2s'],
  ls: ['dist  src  package.json  README.md'],
  help: ['build   bundle the project', 'ls      list files', 'clear   wipe the screen'],
  clear: []
};
// 작업 줄은 스피너·완료 아이콘을 품고 있어 새로 짓지 않고 첫 줄을 본으로 복제한다
var WORK_TPL = document.getElementById('work').cloneNode(true);
function line(text, cls, index) {
  var p = document.createElement('p');
  p.className = 'rn__line' + (cls ? ' rn__line--' + cls : '');
  p.style.setProperty('--i', String(index));
  p.textContent = text;
  out.appendChild(p);
  return p;
}
function workLine(text, index) {
  var p = WORK_TPL.cloneNode(true);
  p.removeAttribute('id');
  p.classList.remove('is-done');
  p.style.setProperty('--i', String(index));
  p.querySelector('.rn__work-text').textContent = text;
  out.appendChild(p);
  // 스피너가 한 바퀴 돌 시간을 주고 완료 표시로 바꾼다 — 실제 작업이라면 여기가 fetch 의 then 자리다
  setTimeout(function () { p.classList.add('is-done'); }, 900);
}
function run(cmd) {
  out.textContent = '';
  if (cmd === 'clear') { return; }
  var steps = SCRIPTS[cmd];
  line('$ ' + cmd, 'echo', 0);
  if (!steps) { line('command not found: ' + cmd, 'bad', 1); return; }
  steps.forEach(function (text, i) {
    if (text.indexOf('WORK:') === 0) { workLine(text.slice(5), i + 1); }
    // 요약 줄은 작업이 끝난 뒤에 찍힌다 — 스피너가 도는 동안 먼저 나오면 거짓말이 된다
    else if (text.indexOf('SUM:') === 0) { setTimeout(function () { line(text.slice(4), 'sum', i + 1); }, 900); }
    else { line(text, '', i + 1); }
  });
}
form.addEventListener('submit', function (e) {
  e.preventDefault();
  rn.classList.remove('is-demo');
  var cmd = input.value.trim();
  if (cmd) { run(cmd); }
  input.value = '';
});
</script>
</body>
</html>
