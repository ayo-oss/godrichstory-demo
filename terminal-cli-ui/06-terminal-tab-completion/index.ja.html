<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab 補完の候補 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tc is-demo" id="tc">
  <p class="tc__line">
    <span class="tc__sign" aria-hidden="true">$</span>
    <input class="tc__input" id="cmd" type="text" value="git check" autocomplete="off" spellcheck="false"
           role="combobox" aria-expanded="false" aria-controls="cands" aria-label="コマンド入力欄。Tab を押すと候補が開きます">
  </p>
  <p class="tc__hint">Tab を押すと候補が開きます</p>
  <ul class="tc__cands" id="cands" role="listbox" aria-label="補完候補">
    <li class="tc__cand" id="c0" role="option" aria-selected="true" style="--i: 0">checkout</li>
    <li class="tc__cand" id="c1" role="option" aria-selected="false" style="--i: 1">check-attr</li>
    <li class="tc__cand" id="c2" role="option" aria-selected="false" style="--i: 2">check-ignore</li>
    <li class="tc__cand" id="c3" role="option" aria-selected="false" style="--i: 3">check-mailmap</li>
    <li class="tc__cand" id="c4" role="option" aria-selected="false" style="--i: 4">check-ref-format</li>
    <li class="tc__cand" id="c5" role="option" aria-selected="false" style="--i: 5">checkout-index</li>
  </ul>
</div>
</main>
<script>
var tc = document.getElementById('tc');
var cmd = document.getElementById('cmd');
var cands = Array.prototype.slice.call(document.querySelectorAll('.tc__cand'));
var open = false, at = 0;
function mark(index) {
  at = (index + cands.length) % cands.length;
  cands.forEach(function (li, i) { li.setAttribute('aria-selected', String(i === at)); });
  // 지금 고른 후보를 입력칸이 가리켜야 스크린리더가 같은 줄을 읽는다
  cmd.setAttribute('aria-activedescendant', cands[at].id);
}
function openList() {
  tc.classList.remove('is-demo');
  open = true;
  tc.classList.add('is-open');
  cmd.setAttribute('aria-expanded', 'true');
  // 후보가 모두 나누어 가진 앞글자까지는 셸이 대신 채워 준다
  if (cmd.value.indexOf('git check') !== 0) { cmd.value = 'git check'; }
  mark(0);
}
cmd.addEventListener('keydown', function (e) {
  if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); openList(); return; }
  if (!open) { return; }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); mark(at + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); mark(at - 1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    cmd.value = 'git ' + cands[at].textContent;
    open = false;
    tc.classList.remove('is-open');
    cmd.setAttribute('aria-expanded', 'false');
    cmd.removeAttribute('aria-activedescendant');
  }
});
cands.forEach(function (li, i) {
  li.addEventListener('click', function () { openList(); mark(i); cmd.focus({ preventScroll: true }); });
});
</script>
</body>
</html>
