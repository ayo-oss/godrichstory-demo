<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step-by-step tutorial shell — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tu is-demo" id="tu" data-step="1">
  <p class="tu__head">
    <span class="tu__badge" aria-hidden="true"><span class="tu__no"></span> / 3</span>
    <span class="tu__slot">
      <span class="tu__task" data-step="1">See where you are. Type pwd and press Enter</span>
      <span class="tu__task" data-step="2">List hidden files too. Type ls -a and press Enter</span>
      <span class="tu__task" data-step="3">See what changed. Type git status and press Enter</span>
    </span>
  </p>
  <p class="tu__rail" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="1" aria-label="Steps completed">
    <span class="tu__fill" aria-hidden="true"></span>
  </p>
  <form class="tu__win" id="form">
    <span class="tu__sign" aria-hidden="true">$</span>
    <input class="tu__input" id="ans" type="text" autocomplete="off" spellcheck="false" placeholder="Type the command here" aria-label="Command input">
    <span class="tu__say tu__say--ok" id="ok" aria-live="polite">Correct</span>
    <span class="tu__say tu__say--no" id="no" aria-live="polite">Try again</span>
  </form>
</div>
</main>
<script>
var tu = document.getElementById('tu');
var form = document.getElementById('form');
var ans = document.getElementById('ans');
var rail = tu.querySelector('.tu__rail');

var WANT = ['pwd', 'ls -a', 'git status'];
var step = 1;
function show(state) {
  tu.classList.remove('is-ok', 'is-no');
  if (state) { tu.classList.add(state); }
}
form.addEventListener('submit', function (e) {
  e.preventDefault();
  tu.classList.remove('is-demo');
  // 사이 공백이 몇 칸이든 같은 명령으로 본다
  var typed = ans.value.trim().replace(/\s+/g, ' ');
  if (typed !== WANT[step - 1]) { show('is-no'); return; }
  show('is-ok');
  ans.value = '';
  if (step < WANT.length) {
    step += 1;
    tu.setAttribute('data-step', String(step));
    rail.setAttribute('aria-valuenow', String(step));
  }
});
ans.addEventListener('input', function () { show(''); });
</script>
</body>
</html>
