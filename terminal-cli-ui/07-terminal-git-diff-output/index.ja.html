<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diff 出力の折りたたみ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dh is-demo" id="dh">
  <p class="dh__stat">
    <span class="dh__chip dh__chip--add">+6</span>
    <span class="dh__chip dh__chip--del">-2</span>
    <span class="dh__statTxt">ファイル2件が変更されました</span>
  </p>
  <section class="dh__hunk">
    <button class="dh__head" type="button" id="head" aria-expanded="true" aria-controls="body" aria-label="変更ブロックの折りたたみ切り替え">
      <span class="dh__caret" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></span>
      <span class="dh__at">@@ -14,6 +14,8 @@ function boot()</span>
    </button>
    <div class="dh__body" id="body">
      <div class="dh__inner">
        <p class="dh__row"><span class="dh__sign" aria-hidden="true">&nbsp;</span>const app = createApp()</p>
        <p class="dh__row dh__row--del"><span class="dh__sign" aria-hidden="true">-</span>app.use(legacyRouter)</p>
        <p class="dh__row dh__row--add"><span class="dh__sign" aria-hidden="true">+</span>app.use(router)</p>
        <p class="dh__row dh__row--add"><span class="dh__sign" aria-hidden="true">+</span>app.use(store)</p>
        <p class="dh__row"><span class="dh__sign" aria-hidden="true">&nbsp;</span>return app</p>
      </div>
    </div>
  </section>
</div>
</main>
<script>
var dh = document.getElementById('dh');
var head = document.getElementById('head');
head.addEventListener('click', function () {
  dh.classList.remove('is-demo');
  var open = head.getAttribute('aria-expanded') === 'true';
  head.setAttribute('aria-expanded', String(!open));
});
</script>
</body>
</html>
