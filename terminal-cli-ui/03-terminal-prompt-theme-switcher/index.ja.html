<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プロンプトテーマの切り替え — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pt is-demo" id="pt" data-shape="plain">
  <div class="pt__pick" role="group" aria-label="プロンプトの形">
    <button class="pt__btn" type="button" data-shape="plain" aria-pressed="true">標準<span class="pt__bar" aria-hidden="true"></span></button>
    <button class="pt__btn" type="button" data-shape="wave" aria-pressed="false">波<span class="pt__bar" aria-hidden="true"></span></button>
    <button class="pt__btn" type="button" data-shape="seg" aria-pressed="false">セグメント<span class="pt__bar" aria-hidden="true"></span></button>
  </div>
  <div class="pt__screen">
    <div class="pt__view pt__view--plain">
      <span class="pt__path">~/work/site</span>
      <span class="pt__git">git:(main)</span>
      <span class="pt__caret">&#10095;</span>
    </div>
    <div class="pt__view pt__view--wave">
      <span class="pt__user">you</span><span class="pt__at">@</span><span class="pt__host">mac</span>
      <span class="pt__path">~/work/site</span>
      <span class="pt__caret pt__caret--wave">&#10095;&#10095;</span>
    </div>
    <div class="pt__view pt__view--seg">
      <span class="pt__seg pt__seg--a">~/work/site</span><span class="pt__seg pt__seg--b">main</span><span class="pt__seg pt__seg--c">node 22</span>
    </div>
  </div>
</div>
</main>
<script>
var pt = document.getElementById('pt');
var btns = Array.prototype.slice.call(pt.querySelectorAll('.pt__btn'));
function pickShape(shape) {
  pt.classList.remove('is-demo');
  pt.setAttribute('data-shape', shape);
  btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.shape === shape)); });
}
btns.forEach(function (b) { b.addEventListener('click', function () { pickShape(b.dataset.shape); }); });
</script>
</body>
</html>
