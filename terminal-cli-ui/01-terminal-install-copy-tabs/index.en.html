<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install command copy box — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ic is-demo" id="ic" data-mgr="npm">
  <div class="ic__tabs" role="tablist" aria-label="Package manager">
    <button class="ic__tab" type="button" role="tab" id="tabNpm" aria-selected="true" data-mgr="npm">npm</button>
    <button class="ic__tab" type="button" role="tab" id="tabPnpm" aria-selected="false" data-mgr="pnpm">pnpm</button>
    <button class="ic__tab" type="button" role="tab" id="tabYarn" aria-selected="false" data-mgr="yarn">yarn</button>
  </div>
  <div class="ic__row">
    <span class="ic__sign" aria-hidden="true">$</span>
    <span class="ic__slot">
      <code class="ic__cmd" data-mgr="npm">npm i <b>motionkit</b></code>
      <code class="ic__cmd" data-mgr="pnpm">pnpm add <b>motionkit</b></code>
      <code class="ic__cmd" data-mgr="yarn">yarn add <b>motionkit</b></code>
    </span>
    <button class="ic__copy" type="button" id="copyBtn">
      <span class="ic__ico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 40v128h-48V88H88V40Z" opacity=".2"/><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></g></svg></span>
      <span class="ic__word">Copy command</span>
    </button>
  </div>
  <p class="ic__note" id="note" aria-live="polite">Copied to your clipboard</p>
</div>
</main>
<script>
var ic = document.getElementById('ic');
var copyBtn = document.getElementById('copyBtn');
var word = copyBtn.querySelector('.ic__word');
var note = document.getElementById('note');
var tabs = Array.prototype.slice.call(ic.querySelectorAll('.ic__tab'));
var doneTimer = 0;
function pick(mgr) {
  ic.classList.remove('is-demo');
  ic.setAttribute('data-mgr', mgr);
  tabs.forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.mgr === mgr)); });
}
function currentCommand() {
  var mgr = ic.getAttribute('data-mgr') || 'npm';
  var line = ic.querySelector('.ic__cmd[data-mgr="' + mgr + '"]');
  return line ? line.textContent : '';
}
function showDone() {
  ic.classList.add('is-done');
  word.textContent = 'Copied';
  clearTimeout(doneTimer);
  // 알림을 지웠다가 다시 넣어야 같은 문장이라도 aria-live 가 한 번 더 읽는다
  note.textContent = '';
  doneTimer = setTimeout(function () {
    note.textContent = 'Copied to your clipboard';
    doneTimer = setTimeout(function () { ic.classList.remove('is-done'); word.textContent = 'Copy command'; }, 1400);
  }, 60);
}
tabs.forEach(function (t) { t.addEventListener('click', function () { pick(t.dataset.mgr); }); });
copyBtn.addEventListener('click', function () {
  ic.classList.remove('is-demo');
  var text = currentCommand();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showDone, showDone);
  } else {
    showDone();
  }
});
</script>
</body>
</html>
