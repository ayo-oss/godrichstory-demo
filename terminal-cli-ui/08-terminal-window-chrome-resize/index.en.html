<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resizable terminal window — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wc is-demo" id="wc">
  <div class="wc__win" id="win">
    <p class="wc__bar">
      <span class="wc__dots" aria-hidden="true"><i class="wc__dot wc__dot--x"></i><i class="wc__dot wc__dot--m"></i><i class="wc__dot wc__dot--z"></i></span>
      <span class="wc__tabs" role="tablist" aria-label="Window tabs">
        <button class="wc__tab" type="button" role="tab" aria-selected="true">zsh</button>
        <button class="wc__tab" type="button" role="tab" aria-selected="false">logs</button>
      </span>
    </p>
    <div class="wc__body">
      <p class="wc__ln wc__ln--cmd">$ npm run dev</p>
      <p class="wc__ln">ready on localhost:5173</p>
      <p class="wc__ln wc__size" aria-live="polite" aria-label="Window size"></p>
    </div>
    <button class="wc__grip" type="button" id="grip" aria-label="Window resize grip"><span aria-hidden="true"></span></button>
  </div>
  <p class="wc__hint">Drag the corner to resize</p>
</div>
</main>
<script>
var wc = document.getElementById('wc');
var win = document.getElementById('win');
var grip = document.getElementById('grip');
var from = null;
function readOut() {
  // 실제로 그려진 크기를 되읽는다 — 한계는 CSS clamp 가 정하므로 JS 가 다시 자르지 않는다
  win.style.setProperty('--wn', String(Math.round(win.offsetWidth)));
  win.style.setProperty('--hn', String(Math.round(win.offsetHeight)));
}
grip.addEventListener('pointerdown', function (e) {
  wc.classList.remove('is-demo');
  grip.setPointerCapture(e.pointerId);
  from = { x: e.clientX, y: e.clientY, w: win.offsetWidth, h: win.offsetHeight };
  readOut();
});
grip.addEventListener('pointermove', function (e) {
  if (!from) { return; }
  win.style.setProperty('--w', (from.w + (e.clientX - from.x)) + 'px');
  win.style.setProperty('--h', (from.h + (e.clientY - from.y)) + 'px');
  readOut();
});
function stop(e) {
  if (!from) { return; }
  from = null;
  if (grip.hasPointerCapture(e.pointerId)) { grip.releasePointerCapture(e.pointerId); }
}
grip.addEventListener('pointerup', stop);
grip.addEventListener('pointercancel', stop);
// 키보드로도 넓힐 수 있어야 한다 — 손잡이에 초점을 두고 화살표를 누른다
grip.addEventListener('keydown', function (e) {
  var dx = (e.key === 'ArrowRight') ? 16 : (e.key === 'ArrowLeft') ? -16 : 0;
  var dy = (e.key === 'ArrowDown') ? 12 : (e.key === 'ArrowUp') ? -12 : 0;
  if (!dx && !dy) { return; }
  e.preventDefault();
  wc.classList.remove('is-demo');
  win.style.setProperty('--w', (win.offsetWidth + dx) + 'px');
  win.style.setProperty('--h', (win.offsetHeight + dy) + 'px');
  readOut();
});
</script>
</body>
</html>
