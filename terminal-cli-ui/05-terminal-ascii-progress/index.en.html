<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress bars drawn with characters — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pg is-demo" id="pg">
  <p class="pg__bar-top">
    <span class="pg__ico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M224 56v144a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V56a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8" opacity=".2"/><path d="M128 128a8 8 0 0 1-3 6.25l-40 32a8 8 0 1 1-10-12.5L107.19 128L75 102.25a8 8 0 1 1 10-12.5l40 32a8 8 0 0 1 3 6.25m48 24h-40a8 8 0 0 0 0 16h40a8 8 0 0 0 0-16m56-96v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16m-16 144V56H40v144z"/></g></svg></span>
    <span class="pg__title">Three jobs</span>
    <button class="pg__again" type="button" id="again">Run again</button>
  </p>
  <p class="pg__row pg__row--1">
    <span class="pg__name">build</span>
    <span class="pg__meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75" aria-label="build">
      <span class="pg__brk">[</span>
      <span class="pg__cells">
        <span class="pg__track" aria-hidden="true">████████████████</span>
        <span class="pg__fill" aria-hidden="true">████████████████</span>
      </span>
      <span class="pg__brk">]</span>
    </span>
    <span class="pg__pct" aria-hidden="true"></span>
    <span class="pg__eta">0:04</span>
  </p>
  <p class="pg__row pg__row--2">
    <span class="pg__name">test</span>
    <span class="pg__meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-label="test">
      <span class="pg__brk">[</span>
      <span class="pg__cells">
        <span class="pg__track" aria-hidden="true">████████████████</span>
        <span class="pg__fill" aria-hidden="true">████████████████</span>
      </span>
      <span class="pg__brk">]</span>
    </span>
    <span class="pg__pct" aria-hidden="true"></span>
    <span class="pg__eta">0:11</span>
  </p>
  <p class="pg__row pg__row--3">
    <span class="pg__name">docs</span>
    <span class="pg__meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25" aria-label="docs">
      <span class="pg__brk">[</span>
      <span class="pg__cells">
        <span class="pg__track" aria-hidden="true">████████████████</span>
        <span class="pg__fill" aria-hidden="true">████████████████</span>
      </span>
      <span class="pg__brk">]</span>
    </span>
    <span class="pg__pct" aria-hidden="true"></span>
    <span class="pg__eta">0:26</span>
  </p>
</div>
</main>
<script>
var pg = document.getElementById('pg');
var again = document.getElementById('again');
again.addEventListener('click', function () {
  // 미리보기 루프를 끄고 한 번만 채워지는 실제 실행 경로로 넘어간다.
  // 클래스를 뗐다가 다음 프레임에 다시 붙여야 같은 애니메이션이 처음부터 다시 돈다
  pg.classList.remove('is-demo', 'is-run');
  requestAnimationFrame(function () { pg.classList.add('is-run'); });
});
</script>
</body>
</html>
