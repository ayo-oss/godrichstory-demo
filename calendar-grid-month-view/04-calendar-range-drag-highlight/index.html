<meta charset="utf-8">

<title>Drag-painted date range — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="rc is-demo">
    <div class="rc__head">
      <span class="rc__ico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 48v40H40V48a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 32h-24v-8a8 8 0 0 0-16 0v8H88v-8a8 8 0 0 0-16 0v8H48a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16M72 48v8a8 8 0 0 0 16 0v-8h80v8a8 8 0 0 0 16 0v-8h24v32H48V48Zm136 160H48V96h160z"/></g></svg></span>
      <span class="rc__title">2026. 9</span>
      <span class="rc__out" id="rc-live" role="status" aria-live="polite">13 – 19</span>
    </div>
    <div class="rc__dow" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="rc__grid" id="rc-grid" role="grid" aria-label="기간 선택 달력" aria-multiselectable="true">
      <div class="rc__r" role="row">
        <div class="rc__c is-out" role="gridcell" tabindex="-1" aria-selected="false" aria-disabled="true" data-d="30">30</div>
        <div class="rc__c is-out" role="gridcell" tabindex="-1" aria-selected="false" aria-disabled="true" data-d="31">31</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="1">1</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="2">2</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="3">3</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="4">4</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="5">5</div>
      </div>
      <div class="rc__r" role="row">
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="6">6</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="7">7</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="8">8</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="9">9</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="10">10</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="11">11</div>
        <div class="rc__c is-today" role="gridcell" tabindex="0" aria-selected="false" aria-current="date" data-d="12">12</div>
      </div>
      <div class="rc__r" role="row">
        <div class="rc__c d d1 is-in is-start" role="gridcell" tabindex="-1" aria-selected="true" data-d="13">13</div>
        <div class="rc__c d d2 is-in" role="gridcell" tabindex="-1" aria-selected="true" data-d="14">14</div>
        <div class="rc__c d d3 is-in" role="gridcell" tabindex="-1" aria-selected="true" data-d="15">15</div>
        <div class="rc__c d d4 is-in" role="gridcell" tabindex="-1" aria-selected="true" data-d="16">16</div>
        <div class="rc__c d d5 is-in" role="gridcell" tabindex="-1" aria-selected="true" data-d="17">17</div>
        <div class="rc__c d d6 is-in" role="gridcell" tabindex="-1" aria-selected="true" data-d="18">18</div>
        <div class="rc__c d d7 is-in is-end" role="gridcell" tabindex="-1" aria-selected="true" data-d="19">19</div>
      </div>
      <div class="rc__r" role="row">
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="20">20</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="21">21</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="22">22</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="23">23</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="24">24</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="25">25</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="26">26</div>
      </div>
      <div class="rc__r" role="row">
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="27">27</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="28">28</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="29">29</div>
        <div class="rc__c" role="gridcell" tabindex="-1" aria-selected="false" data-d="30">30</div>
        <div class="rc__c is-out" role="gridcell" tabindex="-1" aria-selected="false" aria-disabled="true" data-d="1">1</div>
        <div class="rc__c is-out" role="gridcell" tabindex="-1" aria-selected="false" aria-disabled="true" data-d="2">2</div>
        <div class="rc__c is-out" role="gridcell" tabindex="-1" aria-selected="false" aria-disabled="true" data-d="3">3</div>
      </div>
    </div>
  </div>
</main>
<script>
// pointerdown 으로 시작 칸을 잡고 pointermove 로 끌면 지나간 칸이 순서대로 칠해진다.
// Shift+ArrowLeft/Right(Up/Down) 로도 같은 범위를 늘린다. 범위 안 칸은 aria-selected="true".
var root = document.querySelector('.rc');
var grid = document.getElementById('rc-grid');
var live = document.getElementById('rc-live');
var cells = [].slice.call(grid.querySelectorAll('.rc__c'));
var COLS = 7;
var anchor = 14, head = 20, dragging = false;

function paint(a, b) {
  var lo = Math.min(a, b), hi = Math.max(a, b);
  for (var i = 0; i < cells.length; i++) {
    var on = i >= lo && i <= hi;
    cells[i].classList.toggle('is-in', on);
    cells[i].classList.toggle('is-start', on && i === lo);
    cells[i].classList.toggle('is-end', on && i === hi);
    cells[i].setAttribute('aria-selected', String(on));
  }
  live.textContent = cells[lo].getAttribute('data-d') + ' – ' + cells[hi].getAttribute('data-d');
}
function rove(i) {
  for (var k = 0; k < cells.length; k++) cells[k].setAttribute('tabindex', k === i ? '0' : '-1');
  cells[i].focus({ preventScroll: true });
}
function hand() { root.classList.remove('is-demo'); }
function cellAt(x, y) {
  var el = document.elementFromPoint(x, y);
  return el && el.closest ? el.closest('.rc__c') : null;
}

grid.addEventListener('pointerdown', function (e) {
  var c = e.target.closest ? e.target.closest('.rc__c') : null;
  if (!c) return;
  hand();
  dragging = true;
  anchor = head = cells.indexOf(c);
  paint(anchor, head);
  rove(head);
  e.preventDefault();
});
document.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var c = cellAt(e.clientX, e.clientY);
  if (!c) return;
  var i = cells.indexOf(c);
  if (i >= 0 && i !== head) { head = i; paint(anchor, head); }
});
document.addEventListener('pointerup', function () { dragging = false; });
document.addEventListener('pointercancel', function () { dragging = false; });

grid.addEventListener('keydown', function (e) {
  var i = cells.indexOf(document.activeElement);
  if (i < 0) return;
  var n = i;
  if (e.key === 'ArrowLeft') n = i - 1;
  else if (e.key === 'ArrowRight') n = i + 1;
  else if (e.key === 'ArrowUp') n = i - COLS;
  else if (e.key === 'ArrowDown') n = i + COLS;
  else if (e.key === 'Home') n = i - (i % COLS);
  else if (e.key === 'End') n = i - (i % COLS) + COLS - 1;
  else if (e.key === ' ' || e.key === 'Enter') { hand(); anchor = head = i; paint(i, i); e.preventDefault(); return; }
  else return;
  if (n < 0 || n >= cells.length) return;
  e.preventDefault();
  hand();
  if (e.shiftKey) { head = n; paint(anchor, head); }
  else { anchor = head = n; paint(n, n); }
  rove(n);
});
</script>
</body>
</html>
