<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event chips with +N overflow — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cal">
    <span class="cal__sr" id="cal-live" aria-live="polite">2026. 9</span>
    <div class="cal__bar"><h2 class="cal__title" id="cal-title">2026. 9</h2></div>
    <div class="cal__dows" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
    <div class="cal__grid" id="cal-grid" role="grid" aria-labelledby="cal-title">
      <div class="cal__row" role="row">
        <div class="cal__cell is-out" role="gridcell" aria-selected="false" tabindex="-1">30</div>
        <div class="cal__cell is-out" role="gridcell" aria-selected="false" tabindex="-1">31</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">1</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">2</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">3</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">4</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">5</div>
      </div>
      <div class="cal__row" role="row">
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">6</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">7</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">8</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">9</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">10</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">11</div>
        <div class="cal__cell is-today" role="gridcell" aria-current="date" aria-selected="false" tabindex="-1">12</div>
      </div>
      <div class="cal__row" role="row">
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">13</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">14</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">15</div>
        <div class="cal__cell is-chips is-demo" id="cal-day16" role="gridcell" aria-selected="false" tabindex="-1">
          <span class="cal__n">16</span>
          <span class="cal__chip cal__chip--blue">会議</span>
          <span class="cal__chip cal__chip--ink">歯科</span>
          <button class="cal__morebtn" type="button" id="cal-morebtn" aria-expanded="false" aria-controls="cal-more">+3</button>
          <span class="cal__morewrap" id="cal-more">
            <span class="cal__more">
              <span class="cal__chip cal__chip--mint">運動</span>
              <span class="cal__chip cal__chip--blue">報告書</span>
              <span class="cal__chip cal__chip--ink">夕食</span>
            </span>
          </span>
        </div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">17</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">18</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">19</div>
      </div>
      <div class="cal__row" role="row">
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">20</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">21</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">22</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">23</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">24</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">25</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">26</div>
      </div>
      <div class="cal__row" role="row">
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">27</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">28</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">29</div>
        <div class="cal__cell" role="gridcell" aria-selected="false" tabindex="-1">30</div>
        <div class="cal__cell is-out" role="gridcell" aria-selected="false" tabindex="-1">1</div>
        <div class="cal__cell is-out" role="gridcell" aria-selected="false" tabindex="-1">2</div>
        <div class="cal__cell is-out" role="gridcell" aria-selected="false" tabindex="-1">3</div>
      </div>
    </div>
  </div>
</main>
<script>
(function () {
  var cal = document.querySelector('.cal');
  var grid = document.getElementById('cal-grid');
  var day = document.getElementById('cal-day16');
  var btn = document.getElementById('cal-morebtn');
  var cells = [].slice.call(grid.querySelectorAll('.cal__cell'));
  function move(n) {
    n = Math.max(0, Math.min(cells.length - 1, n));
    cells.forEach(function (c, k) { c.tabIndex = k === n ? 0 : -1; c.setAttribute('aria-selected', String(k === n)); });
    cells[n].focus({ preventScroll: true });
  }
  function toggle(force) {
    var open = typeof force === 'boolean' ? force : !day.classList.contains('is-open');
    day.classList.remove('is-demo');
    day.classList.toggle('is-open', open);
    btn.setAttribute('aria-expanded', String(open));
  }
  btn.addEventListener('click', function (e) { e.stopPropagation(); toggle(); });
  grid.addEventListener('click', function (e) {
    var c = e.target.closest ? e.target.closest('.cal__cell') : null;
    if (c) move(cells.indexOf(c));
  });
  grid.addEventListener('keydown', function (e) {
    var n = cells.indexOf(document.activeElement);
    if (n < 0) return;
    var to = null;
    if (e.key === 'ArrowRight') to = n + 1;
    else if (e.key === 'ArrowLeft') to = n - 1;
    else if (e.key === 'ArrowDown') to = n + 7;
    else if (e.key === 'ArrowUp') to = n - 7;
    else if (e.key === 'Home') to = n - (n % 7);
    else if (e.key === 'End') to = n - (n % 7) + 6;
    else return;
    e.preventDefault(); move(to);
  });
  btn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); toggle(); }
  });
})();
</script>
</body>
</html>
