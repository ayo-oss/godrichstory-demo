<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-track month slide — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cal is-demo">
    <span class="cal__sr" id="cal-live" aria-live="polite">2026. 9</span>
    <div class="cal__bar">
      <button class="cal__nav" type="button" id="cal-prev" aria-label="Previous month"><svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M160 48v160l-80-80Z" opacity=".2"/><path d="M163.06 40.61a8 8 0 0 0-8.72 1.73l-80 80a8 8 0 0 0 0 11.32l80 80A8 8 0 0 0 168 208V48a8 8 0 0 0-4.94-7.39M152 188.69L91.31 128L152 67.31Z"/></g></svg></button>
      <div class="cal__titles" aria-hidden="true"><div class="cal__titlestrip" id="cal-strip"></div></div>
      <button class="cal__nav" type="button" id="cal-next" aria-label="Next month"><svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></button>
    </div>
    <div class="cal__dows" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="cal__viewport"><div class="cal__track" id="cal-track"></div></div>
  </div>
</main>
<script>
(function () {
  var cal = document.querySelector('.cal');
  var track = document.getElementById('cal-track');
  var strip = document.getElementById('cal-strip');
  var live = document.getElementById('cal-live');
  var BASE = -100 / 3, busy = false, idx = 16;
  var cur = new Date(2026, 8, 1);

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function label(d) { return d.getFullYear() + '. ' + (d.getMonth() + 1); }
  function cells() {
    return [].slice.call(track.children[1].children).reduce(function (a, r) { return a.concat([].slice.call(r.children)); }, []);
  }
  function build(d) {
    var y = d.getFullYear(), m = d.getMonth(), off = 1 - new Date(y, m, 1).getDay();
    var g = document.createElement('div');
    g.className = 'cal__month'; g.setAttribute('role', 'grid'); g.setAttribute('aria-label', label(d));
    for (var w = 0; w < 5; w++) {
      var r = document.createElement('div');
      r.className = 'cal__row'; r.setAttribute('role', 'row');
      for (var i = 0; i < 7; i++) {
        var t = new Date(y, m, off + w * 7 + i), c = document.createElement('div');
        c.className = 'cal__cell' + (t.getMonth() === m ? '' : ' is-out');
        c.setAttribute('role', 'gridcell');
        c.setAttribute('aria-selected', 'false');
        c.setAttribute('aria-label', t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()));
        c.tabIndex = -1; c.textContent = t.getDate();
        r.appendChild(c);
      }
      g.appendChild(r);
    }
    return g;
  }
  function render() {
    track.textContent = ''; strip.textContent = '';
    [-1, 0, 1].forEach(function (k) {
      var d = new Date(cur.getFullYear(), cur.getMonth() + k, 1);
      track.appendChild(build(d));
      var s = document.createElement('span');
      s.className = 'cal__t'; s.textContent = label(d);
      strip.appendChild(s);
    });
    cells()[idx].tabIndex = 0;
  }
  function move(n) {
    var cs = cells(); n = Math.max(0, Math.min(cs.length - 1, n));
    cs.forEach(function (c, k) { c.tabIndex = k === n ? 0 : -1; c.setAttribute('aria-selected', String(k === n)); });
    cs[n].focus({ preventScroll: true }); idx = n;
  }
  function finish(dir) {
    if (!busy) return;
    busy = false; cal.classList.remove('is-anim');
    cur = new Date(cur.getFullYear(), cur.getMonth() + dir, 1);
    render();                                   // 리셋은 transition 이 꺼진 순간에 — 눈에 보이지 않는다
    track.style.transform = ''; strip.style.transform = '';
    live.textContent = label(cur);
  }
  function go(dir) {
    if (busy) return;
    busy = true; cal.classList.remove('is-demo'); cal.classList.add('is-anim');
    var to = BASE - dir * (100 / 3);
    track.style.transform = strip.style.transform = 'translateX(' + to + '%)';
    var done = function () { track.removeEventListener('transitionend', done); finish(dir); };
    track.addEventListener('transitionend', done);
    window.setTimeout(done, 700);
  }
  document.getElementById('cal-prev').addEventListener('click', function () { go(-1); });
  document.getElementById('cal-next').addEventListener('click', function () { go(1); });
  track.addEventListener('click', function (e) {
    var c = e.target.closest ? e.target.closest('.cal__cell') : null;
    var n = c ? cells().indexOf(c) : -1;
    if (n < 0) return;
    cal.classList.remove('is-demo'); move(n);
  });
  track.addEventListener('keydown', function (e) {
    var n = cells().indexOf(document.activeElement);
    if (n < 0) return;
    var to = null;
    if (e.key === 'ArrowRight') to = n + 1;
    else if (e.key === 'ArrowLeft') to = n - 1;
    else if (e.key === 'ArrowDown') to = n + 7;
    else if (e.key === 'ArrowUp') to = n - 7;
    else if (e.key === 'Home') to = n - (n % 7);
    else if (e.key === 'End') to = n - (n % 7) + 6;
    else return;
    e.preventDefault(); cal.classList.remove('is-demo'); move(to);
  });
  render();
})();
</script>
</body>
</html>
