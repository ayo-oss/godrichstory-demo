<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini three-month strip — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="m3 is-demo" id="m3" aria-label="Three-month calendar">
    <div class="m3__strip" id="m3-strip"></div>
    <span class="m3__live" role="status" id="m3-live"></span>
  </section>
</main>
<script>
// 실제 동작: 지난달·이번달·다음달 미니 Grid 셋. 시작(8M 30S)은 고정,
// 화살표(±1S/±7S)는 달 경계를 넘어 이동하고 Enter/클릭이 범위의 끝을 고른다.
var root = document.getElementById('m3');
var strip = document.getElementById('m3-strip');
var live = document.getElementById('m3-live');
var TODAY = new Date(2026, 8, 12);
var START = new Date(2026, 7, 30);            // 범위 시작 — 8M 말
var BASE_END = new Date(2026, 8, 28);         // 루프가 멈춰 있는 기본 끝 — 9M 28S
var MS = [7, 8, 9];                           // 8·9·10M
var cells = [];                               // 시간순 — 배열 ±1/±7 이 곧 날짜 계산
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

MS.forEach(function (m, mi) {
  var card = document.createElement('div');
  card.className = 'm3__card' + (mi === 1 ? ' m3__card--mid' : ' m3__card--side');
  var label = document.createElement('span');
  label.className = 'm3__label';
  label.textContent = '2026.' + (m + 1);
  card.appendChild(label);
  var grid = document.createElement('div');
  grid.className = 'm3__grid';
  grid.setAttribute('role', 'grid');
  grid.setAttribute('aria-label', '2026.' + (m + 1));
  var lead = new Date(2026, m, 1).getDay();   // 일요일 시작 앞쪽 빈칸 W
  var total = new Date(2026, m + 1, 0).getDate();
  var rows = Math.ceil((lead + total) / 7);
  for (var r = 0; r < rows; r++) {
    var row = document.createElement('div');
    row.className = 'm3__row';
    row.setAttribute('role', 'row');
    for (var c = 0; c < 7; c++) {
      var day = r * 7 + c - lead + 1;
      var cell = document.createElement('div');
      cell.className = 'm3__cell';
      if (day < 1 || day > total) {
        cell.classList.add('m3__cell--blank');
        cell.setAttribute('aria-hidden', 'true');
        row.appendChild(cell);
        continue;
      }
      var date = new Date(2026, m, day);
      cell.setAttribute('role', 'gridcell');
      cell.setAttribute('aria-label', iso(date));
      cell.tabIndex = -1;
      var num = document.createElement('span');
      num.className = 'm3__num';
      num.textContent = day;
      var sel = document.createElement('span');
      sel.className = 'm3__sel';
      sel.textContent = day;
      sel.setAttribute('aria-hidden', 'true');
      cell.appendChild(num);
      cell.appendChild(sel);
      if (+date === +TODAY) { cell.classList.add('is-today'); cell.setAttribute('aria-current', 'date'); }
      var off = Math.round((date - BASE_END) / 864e5);   // 루프가 뻗는 길: 9.29 → 10.3 다섯 칸
      if (off >= 1 && off <= 5) sel.classList.add('m3__p' + off);
      row.appendChild(cell);
      cells.push({ el: cell, date: date });
    }
    grid.appendChild(row);
  }
  card.appendChild(grid);
  strip.appendChild(card);
});

function paint(end) {
  cells.forEach(function (c) {
    var on = c.date >= START && c.date <= end;
    c.el.classList.toggle('is-sel', on);
    c.el.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  live.textContent = iso(START) + ' ~ ' + iso(end);
}
paint(BASE_END);

var cur = 0;
cells[0].el.tabIndex = 0;
function move(n) {
  cells[cur].el.tabIndex = -1;
  cur = n;
  cells[cur].el.tabIndex = 0;
  cells[cur].el.focus({ preventScroll: true });
  live.textContent = iso(cells[cur].date);
}
strip.addEventListener('keydown', function (e) {
  var k = e.key, n = null;
  if (k === 'ArrowRight') n = Math.min(cur + 1, cells.length - 1);
  else if (k === 'ArrowLeft') n = Math.max(cur - 1, 0);
  else if (k === 'ArrowDown') n = Math.min(cur + 7, cells.length - 1);
  else if (k === 'ArrowUp') n = Math.max(cur - 7, 0);
  else if (k === 'Home') n = 0;
  else if (k === 'End') n = cells.length - 1;
  else if (k === 'Enter' || k === ' ') { paint(cells[cur].date); e.preventDefault(); return; }
  if (n !== null && n !== cur) { e.preventDefault(); root.classList.remove('is-demo'); move(n); }
});
strip.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('.m3__cell') : null;
  if (!t || t.classList.contains('m3__cell--blank')) return;
  root.classList.remove('is-demo');
  for (var i = 0; i < cells.length; i++) if (cells[i].el === t) { move(i); paint(cells[i].date); break; }
});
</script>
</body>
</html>
