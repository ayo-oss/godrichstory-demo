<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week timeline on a time axis — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="wt is-demo">
    <div class="wt__body">
      <div class="wt__side" aria-hidden="true">
        <span class="wt__ico"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 256 256"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88m64-88a8 8 0 0 1-8 8h-56a8 8 0 0 1-8-8V72a8 8 0 0 1 16 0v48h48a8 8 0 0 1 8 8"/></g></svg></span>
        <span class="wt__hr">9</span>
        <span class="wt__hr">10</span>
        <span class="wt__hr">11</span>
        <span class="wt__hr">12</span>
        <span class="wt__hr">13</span>
      </div>
      <div class="wt__grid" id="wt-grid" role="grid" aria-label="주간 일정 타임라인">
        <div class="wt__r wt__r--h" role="row">
          <span class="wt__h" role="columnheader">14</span>
          <span class="wt__h" role="columnheader">15</span>
          <span class="wt__h is-today" role="columnheader" aria-current="date">16</span>
          <span class="wt__h" role="columnheader">17</span>
          <span class="wt__h" role="columnheader">18</span>
        </div>
        <div class="wt__r" role="row">
          <div class="wt__c" role="gridcell" tabindex="0" data-h="9"><span class="wt__ev" style="--n:1.5">회의</span></div>
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="9"></div>
          <div class="wt__c is-today" role="gridcell" tabindex="-1" data-h="9"></div>
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="9"></div>
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="9"><span class="wt__ev" style="--n:2">회의</span></div>
        </div>
        <div class="wt__r" role="row">
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="10"></div>
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="10"><span class="wt__ev wt__ev--b" style="--n:1">리뷰</span></div>
          <div class="wt__c is-today" role="gridcell" tabindex="-1" data-h="10"></div>
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="10"></div>
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="10"></div>
        </div>
        <div class="wt__r" role="row">
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="11"></div>
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="11"></div>
          <div class="wt__c is-today" role="gridcell" tabindex="-1" data-h="11"><span class="wt__ev wt__ev--l" style="--n:1">리뷰</span><span class="wt__ev wt__ev--b wt__ev--r" style="--n:1">회의</span></div>
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="11"></div>
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="11"></div>
        </div>
        <div class="wt__r" role="row">
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="12"></div>
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="12"></div>
          <div class="wt__c is-today" role="gridcell" tabindex="-1" data-h="12"></div>
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="12"><span class="wt__ev" style="--n:1">점심</span></div>
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="12"></div>
        </div>
        <div class="wt__r" role="row">
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="13"></div>
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="13"></div>
          <div class="wt__c is-today" role="gridcell" tabindex="-1" data-h="13"></div>
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="13"></div>
          <div class="wt__c" role="gridcell" tabindex="-1" data-h="13"></div>
        </div>
      </div>
      <div class="wt__now" aria-hidden="true"><i class="wt__dot"></i></div>
    </div>
  </div>
</main>
<script>
// role="grid" 위에서 화살표 키로 블록 사이를 옮겨 다닌다.
// 지금 시각 선은 사람이 만져도 계속 내려와야 하므로 .is-demo 를 떼지 않는다 (시계지 연출이 아니다).
var grid = document.getElementById('wt-grid');
var cells = [].slice.call(grid.querySelectorAll('.wt__c'));
var COLS = 5;

for (var i = 0; i < cells.length; i++) {
  var t = cells[i].textContent.replace(/\s+/g, ' ').trim();
  cells[i].setAttribute('aria-label', cells[i].getAttribute('data-h') + ':00' + (t ? ' ' + t : ''));
}
function rove(i) {
  for (var k = 0; k < cells.length; k++) cells[k].setAttribute('tabindex', k === i ? '0' : '-1');
  cells[i].focus({ preventScroll: true });
}
grid.addEventListener('pointerdown', function (e) {
  var c = e.target.closest ? e.target.closest('.wt__c') : null;
  if (!c) return;
  rove(cells.indexOf(c));
});
grid.addEventListener('keydown', function (e) {
  var i = cells.indexOf(document.activeElement);
  if (i < 0) return;
  var n = i;
  if (e.key === 'ArrowLeft') n = i - 1;
  else if (e.key === 'ArrowRight') n = i + 1;
  else if (e.key === 'ArrowUp') n = i - COLS;
  else if (e.key === 'ArrowDown') n = i + COLS;
  else if (e.key === 'Home') n = i - (i % COLS);
  else if (e.key === 'End') n = i - (i % COLS) + COLS - 1;
  else return;
  if (n < 0 || n >= cells.length) return;
  e.preventDefault();
  rove(n);
});
</script>
</body>
</html>
