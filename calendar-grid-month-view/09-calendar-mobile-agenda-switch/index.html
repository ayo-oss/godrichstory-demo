<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid to agenda fold — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ag is-demo" id="ag" aria-label="9월 일정">
    <div class="ag__bar">
      <span class="ag__title">2026. 9</span>
      <span class="ag__toggl" role="group" aria-label="보기 전환">
        <button type="button" class="ag__btn" id="ag-bgrid" aria-label="격자 보기" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M112 56v48a8 8 0 0 1-8 8H56a8 8 0 0 1-8-8V56a8 8 0 0 1 8-8h48a8 8 0 0 1 8 8m88-8h-48a8 8 0 0 0-8 8v48a8 8 0 0 0 8 8h48a8 8 0 0 0 8-8V56a8 8 0 0 0-8-8m-96 96H56a8 8 0 0 0-8 8v48a8 8 0 0 0 8 8h48a8 8 0 0 0 8-8v-48a8 8 0 0 0-8-8m96 0h-48a8 8 0 0 0-8 8v48a8 8 0 0 0 8 8h48a8 8 0 0 0 8-8v-48a8 8 0 0 0-8-8" opacity=".2"/><path d="M200 136h-48a16 16 0 0 0-16 16v48a16 16 0 0 0 16 16h48a16 16 0 0 0 16-16v-48a16 16 0 0 0-16-16m0 64h-48v-48h48zM104 40H56a16 16 0 0 0-16 16v48a16 16 0 0 0 16 16h48a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16m0 64H56V56h48zm96-64h-48a16 16 0 0 0-16 16v48a16 16 0 0 0 16 16h48a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16m0 64h-48V56h48zm-96 32H56a16 16 0 0 0-16 16v48a16 16 0 0 0 16 16h48a16 16 0 0 0 16-16v-48a16 16 0 0 0-16-16m0 64H56v-48h48z"/></g></svg></button>
        <button type="button" class="ag__btn" id="ag-blist" aria-label="목록 보기" aria-pressed="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M216 64v128H88V64Z" opacity=".2"/><path d="M80 64a8 8 0 0 1 8-8h128a8 8 0 0 1 0 16H88a8 8 0 0 1-8-8m136 56H88a8 8 0 1 0 0 16h128a8 8 0 0 0 0-16m0 64H88a8 8 0 1 0 0 16h128a8 8 0 0 0 0-16M44 52a12 12 0 1 0 12 12a12 12 0 0 0-12-12m0 64a12 12 0 1 0 12 12a12 12 0 0 0-12-12m0 64a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg></button>
        <span class="ag__pill" aria-hidden="true"></span>
      </span>
    </div>
    <div class="ag__frame" id="ag-frame">
      <div class="ag__view" id="ag-view" role="grid" aria-label="9월 일정 격자" data-lgrid="9월 일정 격자" data-llist="9월 일정 목록" data-wgrid="격자" data-wlist="목록">
        <div class="ag__grid" id="ag-grid">
          <div class="ag__wd" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
          <div class="ag__rows" id="ag-rows"></div>
        </div>
        <div class="ag__list" id="ag-list">
          <div class="ag__item" role="listitem" tabindex="-1"><span class="ag__d">14</span><span class="ag__wdn">월요일</span><span class="ag__chips"><span class="ag__chip">리뷰</span><span class="ag__chip">미팅</span></span></div>
          <div class="ag__item" role="listitem" tabindex="-1"><span class="ag__d">16</span><span class="ag__wdn">수요일</span><span class="ag__chips"><span class="ag__chip">운동</span></span></div>
          <div class="ag__item" role="listitem" tabindex="-1"><span class="ag__d">18</span><span class="ag__wdn">금요일</span><span class="ag__chips"><span class="ag__chip">병원</span></span></div>
          <div class="ag__item" role="listitem" tabindex="-1"><span class="ag__d">21</span><span class="ag__wdn">월요일</span><span class="ag__chips"><span class="ag__chip">회고</span></span></div>
          <div class="ag__item" role="listitem" tabindex="-1"><span class="ag__d">23</span><span class="ag__wdn">수요일</span><span class="ag__chips"><span class="ag__chip">배포</span></span></div>
        </div>
      </div>
    </div>
    <span class="ag__live" role="status" id="ag-live"></span>
  </section>
</main>
<script>
// 실제 동작: 같은 날짜 데이터가 넓으면 7열 격자, 좁으면 아젠다.
// @container 가 보기를 고르고 ResizeObserver 가 role(grid/list)·아이콘·포커스를 실제로 바꾼다.
var root = document.getElementById('ag');
var frame = document.getElementById('ag-frame');
var view = document.getElementById('ag-view');
var rowsBox = document.getElementById('ag-rows');
var list = document.getElementById('ag-list');
var live = document.getElementById('ag-live');
var bgrid = document.getElementById('ag-bgrid');
var blist = document.getElementById('ag-blist');
var EVENTS = { 14: 1, 16: 1, 18: 1, 21: 1, 23: 1 };
var TODAY = 12;

var cells = [];
var lead = new Date(2026, 8, 1).getDay();    // 2 (화)
for (var r = 0; r < 5; r++) {
  var row = document.createElement('div');
  row.className = 'ag__row';
  row.setAttribute('role', 'row');
  for (var c = 0; c < 7; c++) {
    var day = r * 7 + c - lead + 1;
    var cell = document.createElement('span');
    cell.className = 'ag__cell';
    if (day < 1 || day > 30) {
      cell.setAttribute('aria-hidden', 'true');
    } else {
      cell.setAttribute('role', 'gridcell');
      cell.setAttribute('aria-label', '2026-09-' + (day < 10 ? '0' + day : day));
      cell.tabIndex = -1;
      cell.textContent = day;
      if (EVENTS[day]) {
        var dot = document.createElement('i');
        dot.className = 'ag__dot';
        cell.appendChild(dot);
      }
      if (day === TODAY) { cell.classList.add('is-today'); cell.setAttribute('aria-current', 'date'); }
      cells.push(cell);
    }
    row.appendChild(cell);
  }
  rowsBox.appendChild(row);
}
var items = [].slice.call(list.children);
cells[0].tabIndex = 0;
items[0].tabIndex = 0;

var isAgenda = null;
function focusFirst() {
  var pool = isAgenda ? items : cells;
  pool.forEach(function (x) { x.tabIndex = -1; });
  pool[0].tabIndex = 0;
  pool[0].focus({ preventScroll: true });
}
function setMode(narrow) {
  if (narrow === isAgenda) return;
  isAgenda = narrow;
  root.classList.toggle('is-agenda', narrow);
  view.setAttribute('role', narrow ? 'list' : 'grid');
  view.setAttribute('aria-label', narrow ? view.dataset.llist : view.dataset.lgrid);
  bgrid.classList.toggle('is-on', !narrow);
  blist.classList.toggle('is-on', narrow);
  bgrid.setAttribute('aria-pressed', String(!narrow));
  blist.setAttribute('aria-pressed', String(narrow));
  live.textContent = narrow ? view.dataset.wlist : view.dataset.wgrid;
  var a = document.activeElement;
  if (!a || a === document.body || !a.offsetParent) focusFirst();   // 숨겨진 칸에 있으면 새 보기 첫 칸으로
}
new ResizeObserver(function () { setMode(frame.getBoundingClientRect().width <= 176); }).observe(frame);

function pick(narrow, el) {                   // 아이콘 버튼 — 폭을 직접 오긴다 (전환이 눈에 보인다)
  root.classList.remove('is-demo');
  frame.style.setProperty('--fw', narrow ? '34%' : '100%');
  el.focus({ preventScroll: true });
}
bgrid.addEventListener('click', function () { pick(false, bgrid); });
blist.addEventListener('click', function () { pick(true, blist); });

var cur = 0, curI = 0;
root.addEventListener('keydown', function (e) {
  var k = e.key, n = null;
  root.classList.remove('is-demo');
  if (isAgenda) {                             // 리스트 축 — ±1
    if (k === 'ArrowDown') n = Math.min(curI + 1, items.length - 1);
    else if (k === 'ArrowUp') n = Math.max(curI - 1, 0);
    else if (k === 'Home') n = 0;
    else if (k === 'End') n = items.length - 1;
    if (n !== null && n !== curI) {
      e.preventDefault();
      items[curI].tabIndex = -1; curI = n; items[curI].tabIndex = 0;
      items[curI].focus({ preventScroll: true });
      live.textContent = '9.' + items[curI].querySelector('.ag__d').textContent;
    }
  } else {                                    // 격자 축 — ±1일 / ±7일
    if (k === 'ArrowRight') n = Math.min(cur + 1, cells.length - 1);
    else if (k === 'ArrowLeft') n = Math.max(cur - 1, 0);
    else if (k === 'ArrowDown') n = Math.min(cur + 7, cells.length - 1);
    else if (k === 'ArrowUp') n = Math.max(cur - 7, 0);
    else if (k === 'Home') n = 0;
    else if (k === 'End') n = cells.length - 1;
    if (n !== null && n !== cur) {
      e.preventDefault();
      cells[cur].tabIndex = -1; cur = n; cells[cur].tabIndex = 0;
      cells[cur].focus({ preventScroll: true });
      live.textContent = cells[cur].getAttribute('aria-label');
    }
  }
});
rowsBox.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('.ag__cell') : null;
  if (!t) return;
  root.classList.remove('is-demo');
  for (var i = 0; i < cells.length; i++) if (cells[i] === t) {
    cells[cur].tabIndex = -1; cur = i; cells[cur].tabIndex = 0;
    cells[cur].focus({ preventScroll: true });
    break;
  }
});
list.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('.ag__item') : null;
  if (!t) return;
  root.classList.remove('is-demo');
  for (var i = 0; i < items.length; i++) if (items[i] === t) {
    items[curI].tabIndex = -1; curI = i; items[curI].tabIndex = 0;
    items[curI].focus({ preventScroll: true });
    break;
  }
});
</script>
</body>
</html>
