<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contribution heatmap calendar — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="hm is-demo" id="hm" aria-label="2026年 アクティビティヒートマップ">
    <div class="hm__months" id="hm-months" aria-hidden="true"></div>
    <div class="hm__board" id="hm-board" role="grid" aria-label="2026年 アクティビティ"></div>
    <footer class="hm__foot">
      <span class="hm__year"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="13" height="13" aria-hidden="true"><g fill="currentColor"><path d="M216 48v40H40V48a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 32h-24v-8a8 8 0 0 0-16 0v8H88v-8a8 8 0 0 0-16 0v8H48a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16M72 48v8a8 8 0 0 0 16 0v-8h80v8a8 8 0 0 0 16 0v-8h24v32H48V48Zm136 160H48V96h160zm-68-76a12 12 0 1 1-12-12a12 12 0 0 1 12 12m44 0a12 12 0 1 1-12-12a12 12 0 0 1 12 12m-88 40a12 12 0 1 1-12-12a12 12 0 0 1 12 12m44 0a12 12 0 1 1-12-12a12 12 0 0 1 12 12m44 0a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></svg>2026</span>
      <p class="hm__legend"><span>少ない</span><i class="hm__sw hm__sw--1" aria-hidden="true"></i><i class="hm__sw hm__sw--2" aria-hidden="true"></i><i class="hm__sw hm__sw--3" aria-hidden="true"></i><i class="hm__sw hm__sw--4" aria-hidden="true"></i><span>多い</span></p>
    </footer>
    <span class="hm__live" role="status" id="hm-live"></span>
  </section>
</main>
<script>
// 실제 동작: 1년치 칸을 만들고, 화살표(←→ 주 · ↑↓ 요일)로 옮기고, 포커스를 읽어 준다.
var root = document.getElementById('hm');
var board = document.getElementById('hm-board');
var months = document.getElementById('hm-months');
var live = document.getElementById('hm-live');
var START = new Date(2025, 11, 29);          // 1月 1일이 속한 주의 月曜日 — 격자의 첫 칸
var NCOLS = 53, TODAY = new Date(2026, 8, 12);
var cells = [];                              // DOM 순서(행=요일 × 53열), 빈칸은 null
var seed = 7;
function rnd() { seed = (seed * 48271) % 2147483647; return seed / 2147483647; }
function levelOf(d) {
  var v = rnd(), dow = d.getDay(), m = d.getMonth();
  if (dow === 0) v *= .35;                                     // 일요일은 쉰다
  else if (dow === 6) v *= .55;
  if (m === 6 || (m === 7 && d.getDate() < 15)) v *= .2;       // 여름 공백
  if (m === 11) v = Math.min(1, v * 1.4 + .1);                 // 12月 마감 몰림
  if (rnd() < .12) v = Math.min(1, v + .45);                   // 가끔 폭발
  return { level: v < .16 ? 0 : v < .36 ? 1 : v < .56 ? 2 : v < .76 ? 3 : 4, count: Math.round(v * 9) };
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }
for (var d = 0; d < 7; d++) {
  var row = document.createElement('div');
  row.className = 'hm__row';
  row.setAttribute('role', 'row');
  for (var w = 0; w < NCOLS; w++) {
    var date = new Date(START.getFullYear(), START.getMonth(), START.getDate() + w * 7 + d);
    if (date.getFullYear() !== 2026) {
      var blank = document.createElement('span');
      blank.className = 'hm__blank';
      blank.setAttribute('aria-hidden', 'true');
      row.appendChild(blank); cells.push(null); continue;
    }
    var r = levelOf(date), cell = document.createElement('span');
    cell.className = 'hm__cell lv' + r.level;
    cell.setAttribute('role', 'gridcell');
    cell.setAttribute('aria-label', '2026-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + ' · ' + r.count);
    cell.tabIndex = -1;
    // 시차: 왼쪽 열부터 0.7초에 걸쳐 차례로 (낱개 속성 — animation 단축은 delay 를 0s 로 리셋한다)
    cell.style.animationDelay = (w * 13.5).toFixed(1) + 'ms';
    if (+date === +TODAY) { cell.classList.add('is-today'); cell.setAttribute('aria-current', 'date'); }
    row.appendChild(cell); cells.push(cell);
  }
  board.appendChild(row);
}
for (var m = 1; m <= 12; m++) {                                 // 月 눈금 — 열 위치에 맞춰 놓는다
  var w0 = Math.floor((new Date(2026, m - 1, 1) - START) / 6048e5);
  var w1 = m < 12 ? Math.floor((new Date(2026, m, 1) - START) / 6048e5) : NCOLS;
  var tick = document.createElement('span');
  tick.textContent = m;
  tick.style.gridColumn = (w0 + 1) + ' / ' + (w1 + 1);
  months.appendChild(tick);
}
var cur = 0;
while (cur < cells.length && !cells[cur]) cur++;
cells[cur].tabIndex = 0;
function move(n) {
  cells[cur].tabIndex = -1;
  cur = n;
  cells[cur].tabIndex = 0;
  cells[cur].focus({ preventScroll: true });
  live.textContent = cells[cur].getAttribute('aria-label');
}
function step(i, delta) {                                       // 빈칸은 건너뛴다
  i += delta;
  while (i >= 0 && i < cells.length && !cells[i]) i += delta;
  return i >= 0 && i < cells.length ? i : null;
}
board.addEventListener('keydown', function (e) {
  var k = e.key, n = null, base = cur - (cur % NCOLS);
  if (k === 'ArrowRight') n = step(cur, 1);
  else if (k === 'ArrowLeft') n = step(cur, -1);
  else if (k === 'ArrowDown') n = step(cur, NCOLS);
  else if (k === 'ArrowUp') n = step(cur, -NCOLS);
  else if (k === 'Home') n = step(base - 1, 1);
  else if (k === 'End') n = step(base + NCOLS, -1);
  if (n !== null && n !== cur) { e.preventDefault(); root.classList.remove('is-demo'); move(n); }
});
board.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('.hm__cell') : null;
  if (!t) return;
  root.classList.remove('is-demo');
  for (var i = 0; i < cells.length; i++) if (cells[i] === t) { move(i); break; }
});
</script>
</body>
</html>
