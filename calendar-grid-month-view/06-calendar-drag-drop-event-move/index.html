<body>

      <span class="dd__title">2026. 9</span>
      <span class="dd__live" id="dd-live" role="status" aria-live="polite"></span>
    </div>
    <div class="dd__dow" aria-hidden="true"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span></div>
    <div class="dd__grid" id="dd-grid" role="grid" aria-label="일정 옮기기 달력">

        <div class="dd__c" role="gridcell" data-d="7"><span class="dd__n">7</span></div>
        <div class="dd__c dd__c--from" role="gridcell" data-d="8"><span class="dd__n">8</span><button class="dd__chip dd__chip--fly" type="button" aria-grabbed="false"><span class="dd__grip" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="9" height="9" viewBox="0 0 256 256"><g fill="currentColor"><path d="M208 32v192a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V32a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16" opacity=".2"/><path d="M104 60a12 12 0 1 1-12-12a12 12 0 0 1 12 12m60 12a12 12 0 1 0-12-12a12 12 0 0 0 12 12m-72 44a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12m-72 68a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg></span><span class="dd__t">리뷰</span></button></div>
        <div class="dd__c dd__c--to" role="gridcell" data-d="9"><span class="dd__n">9</span></div>
        <div class="dd__c" role="gridcell" data-d="10"><span class="dd__n">10</span></div>
        <div class="dd__c" role="gridcell" data-d="11"><span class="dd__n">11</span></div>
      </div>
      <div class="dd__r" role="row">
        <div class="dd__c" role="gridcell" data-d="14"><span class="dd__n">14</span></div>
        <div class="dd__c" role="gridcell" data-d="15" aria-current="date"><span class="dd__n is-today">15</span></div>
        <div class="dd__c" role="gridcell" data-d="16"><span class="dd__n">16</span><button class="dd__chip" type="button" aria-grabbed="false"><span class="dd__grip" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="9" height="9" viewBox="0 0 256 256"><g fill="currentColor"><path d="M208 32v192a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V32a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16" opacity=".2"/><path d="M104 60a12 12 0 1 1-12-12a12 12 0 0 1 12 12m60 12a12 12 0 1 0-12-12a12 12 0 0 0 12 12m-72 44a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12m-72 68a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg></span><span class="dd__t">배포</span></button></div>
        <div class="dd__c" role="gridcell" data-d="17"><span class="dd__n">17</span></div>
        <div class="dd__c" role="gridcell" data-d="18"><span class="dd__n">18</span></div>
      </div>
      <div class="dd__r" role="row">
        <div class="dd__c" role="gridcell" data-d="21"><span class="dd__n">21</span></div>
        <div class="dd__c" role="gridcell" data-d="22"><span class="dd__n">22</span></div>
        <div class="dd__c" role="gridcell" data-d="23"><span class="dd__n">23</span></div>
        <div class="dd__c" role="gridcell" data-d="24"><span class="dd__n">24</span><button class="dd__chip" type="button" aria-grabbed="false"><span class="dd__grip" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="9" height="9" viewBox="0 0 256 256"><g fill="currentColor"><path d="M208 32v192a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V32a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16" opacity=".2"/><path d="M104 60a12 12 0 1 1-12-12a12 12 0 0 1 12 12m60 12a12 12 0 1 0-12-12a12 12 0 0 0 12 12m-72 44a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12m-72 68a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg></span><span class="dd__t">회고</span></button></div>
        <div class="dd__c" role="gridcell" data-d="25"><span class="dd__n">25</span></div>
      </div>
    </div>
  </div>
</main>
<script>
// 포인터: pointerdown 으로 집고 pointermove 로 끌고 pointerup 에서 그 칸에 appendChild 한다.
// 키보드: 칩에 포커스 → Space 로 집기 → 화살표로 칸 이동 → Space 로 놓기 (Escape 취소).
var root = document.querySelector('.dd');
var grid = document.getElementById('dd-grid');
var live = document.getElementById('dd-live');
var cells = [].slice.call(grid.querySelectorAll('.dd__c'));
var COLS = 5;
var MSG_GRAB = '집었습니다';
var MSG_DROP = '놓았습니다';
var drag = null, held = null, cur = 0;

function armCells(on) {
  for (var i = 0; i < cells.length; i++) {
    if (on) cells[i].setAttribute('aria-dropeffect', 'move');
    else { cells[i].removeAttribute('aria-dropeffect'); cells[i].classList.remove('is-over'); }
  }
}
function drop(chip, cell) {
  if (cell && cell !== chip.parentNode) { cell.appendChild(chip); live.textContent = MSG_DROP + ' ' + cell.getAttribute('data-d'); }
  else live.textContent = MSG_DROP;
}

// ── 포인터 ──
grid.addEventListener('pointerdown', function (e) {
  var chip = e.target.closest ? e.target.closest('.dd__chip') : null;
  if (!chip) return;
  root.classList.remove('is-demo');
  drag = { chip: chip, x: e.clientX, y: e.clientY, over: null };
  chip.classList.add('is-grab');
  chip.setAttribute('aria-grabbed', 'true');
  armCells(true);
  live.textContent = MSG_GRAB;
  e.preventDefault();
});
document.addEventListener('pointermove', function (e) {
  if (!drag) return;
  drag.chip.style.transform = 'translate(' + (e.clientX - drag.x) + 'px,' + (e.clientY - drag.y - 6) + 'px) scale(1.06) rotate(-4deg)';
  var el = document.elementFromPoint(e.clientX, e.clientY);
  var c = el && el.closest ? el.closest('.dd__c') : null;
  if (c !== drag.over) {
    if (drag.over) drag.over.classList.remove('is-over');
    drag.over = c;
    if (c) c.classList.add('is-over');
  }
});
document.addEventListener('pointerup', function () {
  if (!drag) return;
  var chip = drag.chip, cell = drag.over;
  chip.style.transform = '';
  chip.classList.remove('is-grab');
  chip.setAttribute('aria-grabbed', 'false');
  armCells(false);
  drop(chip, cell);
  drag = null;
  chip.focus({ preventScroll: true });
});

// ── 키보드 ──
grid.addEventListener('keydown', function (e) {
  var chip = e.target.closest ? e.target.closest('.dd__chip') : null;
  if (!chip) return;
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    root.classList.remove('is-demo');
    if (held === chip) {
      drop(chip, cells[cur]);
      chip.classList.remove('is-grab');
      chip.setAttribute('aria-grabbed', 'false');
      armCells(false);
      held = null;
      chip.focus({ preventScroll: true });
    } else {
      held = chip;
      cur = cells.indexOf(chip.parentNode);
      chip.classList.add('is-grab');
      chip.setAttribute('aria-grabbed', 'true');
      armCells(true);
      cells[cur].classList.add('is-over');
      live.textContent = MSG_GRAB;
    }
    return;
  }
  if (e.key === 'Escape' && held === chip) {
    chip.classList.remove('is-grab');
    chip.setAttribute('aria-grabbed', 'false');
    armCells(false);
    held = null;
    return;
  }
  if (held !== chip) return;
  var n = cur;
  if (e.key === 'ArrowLeft') n = cur - 1;
  else if (e.key === 'ArrowRight') n = cur + 1;
  else if (e.key === 'ArrowUp') n = cur - COLS;
  else if (e.key === 'ArrowDown') n = cur + COLS;
  else return;
  if (n < 0 || n >= cells.length) return;
  e.preventDefault();
  cells[cur].classList.remove('is-over');
  cur = n;
  cells[cur].classList.add('is-over');
  live.textContent = cells[cur].getAttribute('data-d');
});
</script>
</body>
</html>
