<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">

<title>Ghost/primary buttons, dark inputs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <form class="form is-demo">
    <label class="form__field">
      <input class="form__input" type="email" placeholder="이메일 주소" readonly>
    </label>
    <div class="form__row">
      <button class="form__ghost" type="button">더 알아보기</button>
      <button class="form__primary" type="button">무료로 시작</button>
    </div>
  </form>
</main>
</body>
