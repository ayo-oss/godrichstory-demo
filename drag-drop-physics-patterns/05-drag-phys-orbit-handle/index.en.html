<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit-handle drag: only the angle is calculated to orbit — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ob is-demo" id="ob">
  <div class="ob__ring" id="obRing"></div>
  <div class="ob__hub" id="obHub"></div>
  <button type="button" class="ob__handle" id="obHandle" aria-label="A handle that orbits at a fixed radius. Press Enter to grab, arrow keys to rotate the angle"></button>
  <p class="ob__caption" id="obCaption">Drag it and only the angle changes as it orbits</p>
</div>
</main>
<script>
(function () {
  // 기법: 허브 중심에서 포인터까지의 각도를 atan2 로 매 프레임 계산해 핸들을
  // 고정 반지름(ORBIT_RADIUS_PX) 위 그 각도 지점으로만 옮긴다(반지름은 절대
  // 바뀌지 않음). 손을 떼면 마지막 각속도로 관성 회전하다 감쇠로 멈춘다.
  var root = document.getElementById('ob');
  var hub = document.getElementById('obHub');
  var handle = document.getElementById('obHandle');
  var caption = document.getElementById('obCaption');

  var ORBIT_RADIUS_PX = 74;
  var ORBIT_KEY_STEP_DEG = 12;
  var ORBIT_DECAY_RATE = 0.94;

  var angle = -90 * Math.PI / 180;
  var angularVel = 0;
  var grabbed = false;
  var dragging = false;
  var lastAngle = angle;
  var lastTs = null;
  var raf = 0;

  function applyHandle() {
    var x = Math.cos(angle) * ORBIT_RADIUS_PX;
    var y = Math.sin(angle) * ORBIT_RADIUS_PX;
    handle.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
  }

  function angleFromPointer(clientX, clientY) {
    var hr = hub.getBoundingClientRect();
    var hx = hr.left + hr.width / 2, hy = hr.top + hr.height / 2;
    return Math.atan2(clientY - hy, clientX - hx);
  }

  function shortestDelta(a, b) {
    var d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  function inertiaTick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min((ts - lastTs) / 1000, 0.032);
    lastTs = ts;
    angle += angularVel * dt;
    angularVel *= Math.pow(ORBIT_DECAY_RATE, dt * 60);
    applyHandle();
    if (Math.abs(angularVel) > 0.02) { raf = requestAnimationFrame(inertiaTick); return; }
    angularVel = 0;
    lastTs = null;
  }

  function beginDrag(clientX, clientY) {
    cancelAnimationFrame(raf);
    dragging = true;
    angularVel = 0;
    angle = angleFromPointer(clientX, clientY);
    lastAngle = angle;
    lastTs = null;
    root.classList.add('is-dragging');
    applyHandle();
  }

  function moveDrag(clientX, clientY, ts) {
    var next = angleFromPointer(clientX, clientY);
    var delta = shortestDelta(lastAngle, next);
    angle = lastAngle + delta;
    if (ts !== undefined && lastTs !== null) {
      var dt = Math.max((ts - lastTs) / 1000, 0.001);
      angularVel = delta / dt;
    }
    lastAngle = angle;
    lastTs = ts !== undefined ? ts : lastTs;
    applyHandle();
  }

  function endDrag() {
    dragging = false;
    root.classList.remove('is-dragging');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || Math.abs(angularVel) < 0.02) { angularVel = 0; }
    else { lastTs = null; raf = requestAnimationFrame(inertiaTick); }
  }

  handle.addEventListener('pointerdown', function (e) {
    root.classList.remove('is-demo');
    handle.setPointerCapture(e.pointerId);
    beginDrag(e.clientX, e.clientY);
    caption.textContent = 'Only the angle is calculated to move it along the orbit';
    e.preventDefault();
  });
  handle.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    moveDrag(e.clientX, e.clientY, e.timeStamp);
    e.preventDefault();
  });
  handle.addEventListener('pointerup', function (e) {
    if (!dragging) return;
    endDrag();
    caption.textContent = 'Drag it and only the angle changes as it orbits';
    e.preventDefault();
  });

  handle.addEventListener('keydown', function (e) {
    root.classList.remove('is-demo');
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      grabbed = !grabbed;
      handle.classList.toggle('is-grabbed', grabbed);
      caption.textContent = grabbed ? 'Grabbed. Rotate the angle with arrow keys' : 'Drag it and only the angle changes as it orbits';
      return;
    }
    if (!grabbed) return;
    var dir = 0;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') dir = -1;
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') dir = 1;
    else if (e.key === 'Escape') {
      e.preventDefault();
      grabbed = false;
      handle.classList.remove('is-grabbed');
      caption.textContent = 'Drag it and only the angle changes as it orbits';
      return;
    } else { return; }
    e.preventDefault();
    cancelAnimationFrame(raf);
    angularVel = 0;
    angle += dir * ORBIT_KEY_STEP_DEG * Math.PI / 180;
    applyHandle();
  });

  applyHandle();

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    root.classList.remove('is-demo');
  } else {
    var hubRect0 = hub.getBoundingClientRect();
    var hx0 = hubRect0.left + hubRect0.width / 2;
    var hy0 = hubRect0.top + hubRect0.height / 2;
    var demoStart = null;
    function demoTick(ts) {
      if (demoStart === null) demoStart = ts;
      var t = ts - demoStart;
      if (t < 200) {
        // 대기
      } else if (t < 1300) {
        var p = (t - 200) / 1100;
        var a = (-90 + p * 200) * Math.PI / 180;
        var px = hx0 + Math.cos(a) * (ORBIT_RADIUS_PX + 40);
        var py = hy0 + Math.sin(a) * (ORBIT_RADIUS_PX + 40);
        if (t < 220) beginDrag(px, py);
        moveDrag(px, py, ts);
      } else if (t < 1330) {
        endDrag();
      } else {
        if (t > 1900) demoStart = ts - 60;
      }
      requestAnimationFrame(demoTick);
    }
    requestAnimationFrame(demoTick);
  }
})();
</script>
</body>
</html>
