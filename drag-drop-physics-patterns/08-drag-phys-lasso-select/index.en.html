<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lasso-select drag: picks whatever the rectangle overlaps — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ls is-demo" id="ls">
  <div class="ls__field" id="lsField" role="listbox" aria-multiselectable="true" aria-label="An area where you drag to select several cards at once. You can also focus a card and press Enter to pick it one by one">
    <button type="button" class="ls__item" data-idx="0" role="option" aria-selected="false">1</button>
    <button type="button" class="ls__item" data-idx="1" role="option" aria-selected="false">2</button>
    <button type="button" class="ls__item" data-idx="2" role="option" aria-selected="false">3</button>
    <button type="button" class="ls__item" data-idx="3" role="option" aria-selected="false">4</button>
    <button type="button" class="ls__item" data-idx="4" role="option" aria-selected="false">5</button>
    <button type="button" class="ls__item" data-idx="5" role="option" aria-selected="false">6</button>
    <div class="ls__lasso" id="lsLasso"></div>
  </div>
  <p class="ls__caption" id="lsCaption">Drag from an empty spot and cards overlapping the rectangle get selected</p>
</div>
</main>
<script>
(function () {
  // 기법: 빈 곳에서 드래그를 시작하면 시작점과 현재 포인터로 사각형(라쏘)을 만들고,
  // 매 프레임 그 사각형과 각 카드의 getBoundingClientRect 를 좌표 비교(rectsIntersect)해
  // 겹치는 카드만 실시간으로 선택 표시한다.
  var root = document.getElementById('ls');
  var field = document.getElementById('lsField');
  var lasso = document.getElementById('lsLasso');
  var caption = document.getElementById('lsCaption');
  var items = Array.prototype.slice.call(field.querySelectorAll('.ls__item'));

  var LASSO_MIN_DRAG_PX = 4;

  var selected = items.map(function () { return false; });
  var lassoing = false;
  var lassoStart = null;
  var focusIdx = 0;

  function setSelected(idx, on) {
    selected[idx] = on;
    items[idx].classList.toggle('is-selected', on);
    items[idx].setAttribute('aria-selected', on ? 'true' : 'false');
  }

  function rectsIntersect(a, b) {
    return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
  }

  function updateLassoSelection(rect) {
    items.forEach(function (el, idx) {
      var r = el.getBoundingClientRect();
      setSelected(idx, rectsIntersect(rect, r));
    });
  }

  function drawLasso(x0, y0, x1, y1) {
    var left = Math.min(x0, x1), top = Math.min(y0, y1);
    var w = Math.abs(x1 - x0), h = Math.abs(y1 - y0);
    var fieldRect = field.getBoundingClientRect();
    lasso.style.left = (left - fieldRect.left) + 'px';
    lasso.style.top = (top - fieldRect.top) + 'px';
    lasso.style.width = w + 'px';
    lasso.style.height = h + 'px';
    lasso.style.opacity = '1';
    return { left: left, top: top, right: left + w, bottom: top + h };
  }

  function beginLasso(clientX, clientY) {
    lassoing = true;
    lassoStart = { x: clientX, y: clientY };
    root.classList.add('is-dragging');
    caption.textContent = 'Overlapping cards get selected in real time';
  }

  function moveLasso(clientX, clientY) {
    if (!lassoing) return;
    var rect = drawLasso(lassoStart.x, lassoStart.y, clientX, clientY);
    if (Math.abs(clientX - lassoStart.x) > LASSO_MIN_DRAG_PX || Math.abs(clientY - lassoStart.y) > LASSO_MIN_DRAG_PX) {
      updateLassoSelection(rect);
    }
  }

  function endLasso() {
    lassoing = false;
    root.classList.remove('is-dragging');
    lasso.style.opacity = '0';
    var count = selected.filter(Boolean).length;
    caption.textContent = count > 0 ? count + ' selected' : 'Drag from an empty spot and cards overlapping the rectangle get selected';
  }

  field.addEventListener('pointerdown', function (e) {
    root.classList.remove('is-demo');
    if (e.target.classList.contains('ls__item')) return;
    field.setPointerCapture(e.pointerId);
    beginLasso(e.clientX, e.clientY);
    e.preventDefault();
  });
  field.addEventListener('pointermove', function (e) {
    if (!lassoing) return;
    moveLasso(e.clientX, e.clientY);
    e.preventDefault();
  });
  field.addEventListener('pointerup', function (e) {
    if (!lassoing) return;
    endLasso();
    e.preventDefault();
  });

  items.forEach(function (el, idx) {
    el.addEventListener('pointerdown', function (e) {
      root.classList.remove('is-demo');
      e.stopPropagation();
    });
    el.addEventListener('click', function () {
      root.classList.remove('is-demo');
      setSelected(idx, !selected[idx]);
      var count = selected.filter(Boolean).length;
      caption.textContent = count > 0 ? count + ' selected' : 'Drag from an empty spot and cards overlapping the rectangle get selected';
    });
    el.addEventListener('keydown', function (e) {
      root.classList.remove('is-demo');
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        setSelected(idx, !selected[idx]);
        var count = selected.filter(Boolean).length;
        caption.textContent = count > 0 ? count + ' selected' : 'Drag from an empty spot and cards overlapping the rectangle get selected';
        return;
      }
      var dir = 0;
      if (e.key === 'ArrowRight') dir = 1;
      else if (e.key === 'ArrowLeft') dir = -1;
      else if (e.key === 'ArrowDown') dir = 3;
      else if (e.key === 'ArrowUp') dir = -3;
      else if (e.key === 'Escape') {
        e.preventDefault();
        items.forEach(function (elx, i) { setSelected(i, false); });
        caption.textContent = 'Drag from an empty spot and cards overlapping the rectangle get selected';
        return;
      } else { return; }
      e.preventDefault();
      focusIdx = Math.max(0, Math.min(items.length - 1, idx + dir));
      items[focusIdx].focus({ preventScroll: true });
    });
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    root.classList.remove('is-demo');
  } else {
    var fieldRect0 = field.getBoundingClientRect();
    var startX = fieldRect0.left + fieldRect0.width * 0.08;
    var startY = fieldRect0.top + fieldRect0.height * 0.14;
    var endX = fieldRect0.left + fieldRect0.width * 0.62;
    var endY = fieldRect0.top + fieldRect0.height * 0.68;
    var demoStart = null;
    function demoTick(ts) {
      if (demoStart === null) demoStart = ts;
      var t = ts - demoStart;
      if (t < 200) {
        // 대기
      } else if (t < 1100) {
        var p = Math.min(1, (t - 200) / 900);
        var ease = 1 - Math.pow(1 - p, 2);
        var cx = startX + (endX - startX) * ease;
        var cy = startY + (endY - startY) * ease;
        if (t < 220) beginLasso(startX, startY);
        moveLasso(cx, cy);
      } else if (t < 1450) {
        // 선택 결과 관찰
      } else if (t < 1480) {
        endLasso();
      } else {
        if (t > 1900) demoStart = ts - 60;
      }
      requestAnimationFrame(demoTick);
    }
    requestAnimationFrame(demoTick);
  }
})();
</script>
</body>
</html>
