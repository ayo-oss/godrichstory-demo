<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>隣と場所を入れ替えるFLIPリスト並べ替えドラッグ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sw is-demo" id="sw">
  <div class="sw__track" id="swTrack">
    <button type="button" class="sw__chip" id="swChip0" data-id="0" aria-label="ドラッグして順番を変えるチップ。Enterで掴み、矢印キーで隣のマスと入れ替えます">A</button>
    <div class="sw__chip sw__chip--static" data-id="1">B</div>
    <div class="sw__chip sw__chip--static" data-id="2">C</div>
  </div>
  <p class="sw__caption" id="swCaption">中点を越えると隣と場所を入れ替えます</p>
</div>
</main>
<script>
(function () {
  // 기법: 드래그 중인 칩의 중심이 이웃 칩과의 중점(슬롯 경계)을 넘는 순간을 감지해
  // order 배열의 자리를 바꾸고, 밀려난 칩은 FLIP(새 목표 위치와의 차이를 스프링으로
  // 0 까지 줄이는) 방식으로 부드럽게 새 자리로 이동한다.
  var root = document.getElementById('sw');
  var track = document.getElementById('swTrack');
  var chips = Array.prototype.slice.call(track.querySelectorAll('.sw__chip'));
  var caption = document.getElementById('swCaption');
  var dragChip = document.getElementById('swChip0');
  var DRAGGED_ID = 0;

  var SWAP_FLIP_STIFFNESS = 210;
  var SWAP_FLIP_DAMPING = 22;
  var KEY_STEP_SLOTS = 1;

  var order = [0, 1, 2];
  var STEP = 0;
  var state = {};
  chips.forEach(function (c) {
    var id = parseInt(c.getAttribute('data-id'), 10);
    state[id] = { x: 0, v: 0, target: 0 };
  });

  function measureStep() {
    if (chips.length < 2) return 80;
    var r0 = chips[0].getBoundingClientRect();
    var r1 = chips[1].getBoundingClientRect();
    return r1.left - r0.left;
  }

  function slotOf(id) { return order.indexOf(id); }

  function retarget() {
    chips.forEach(function (c) {
      var id = parseInt(c.getAttribute('data-id'), 10);
      state[id].target = (slotOf(id) - id) * STEP;
    });
  }

  function moveInOrder(fromSlot, toSlot) {
    var id = order[fromSlot];
    order.splice(fromSlot, 1);
    order.splice(toSlot, 0, id);
  }

  function applyChip(id, x) {
    var el = id === DRAGGED_ID ? dragChip : chips.filter(function (c) { return parseInt(c.getAttribute('data-id'), 10) === id; })[0];
    el.style.transform = 'translateX(' + x.toFixed(1) + 'px)';
  }

  var raf = 0, lastTs = null;
  function settleTick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min((ts - lastTs) / 1000, 0.032);
    lastTs = ts;
    var moving = false;
    chips.forEach(function (c) {
      var id = parseInt(c.getAttribute('data-id'), 10);
      if (id === DRAGGED_ID && dragging) return;
      var s = state[id];
      var f = (s.target - s.x) * SWAP_FLIP_STIFFNESS - s.v * SWAP_FLIP_DAMPING;
      s.v += f * dt;
      s.x += s.v * dt;
      applyChip(id, s.x);
      if (Math.abs(s.v) > 1 || Math.abs(s.target - s.x) > 0.5) moving = true;
      else { s.x = s.target; s.v = 0; applyChip(id, s.x); }
    });
    if (moving) { raf = requestAnimationFrame(settleTick); }
    else { lastTs = null; raf = 0; }
  }

  function kickSpring() {
    if (!raf) { lastTs = null; raf = requestAnimationFrame(settleTick); }
  }

  var dragging = false;
  var pointerStartX = null;
  var dragStartX = 0;
  var startSlot = 0;
  var grabbed = false;

  function beginDrag(clientX) {
    cancelAnimationFrame(raf); raf = 0; lastTs = null;
    dragging = true;
    pointerStartX = clientX;
    dragStartX = state[DRAGGED_ID].x;
    startSlot = slotOf(DRAGGED_ID);
    root.classList.add('is-dragging');
  }

  function moveDrag(clientX) {
    if (!STEP) STEP = measureStep();
    var deltaX = clientX - pointerStartX;
    var rawX = dragStartX + deltaX;
    applyChip(DRAGGED_ID, rawX);
    // 중점 판정: 드래그 칩의 화면 중심을 재서 어느 슬롯에 가장 가까운지 계산
    var chipRect = dragChip.getBoundingClientRect();
    var trackRect = track.getBoundingClientRect();
    var centerX = chipRect.left + chipRect.width / 2 - trackRect.left;
    var targetSlot = Math.max(0, Math.min(chips.length - 1, Math.round((centerX - STEP / 2) / STEP)));
    while (targetSlot !== slotOf(DRAGGED_ID)) {
      var from = slotOf(DRAGGED_ID);
      var step = targetSlot > from ? 1 : -1;
      var to = from + step;
      moveInOrder(from, to);
      retarget();
      kickSpring();
      caption.textContent = '場所が入れ替わりました';
    }
    state[DRAGGED_ID].x = rawX;
  }

  function endDrag() {
    dragging = false;
    root.classList.remove('is-dragging');
    caption.textContent = '中点を越えると隣と場所を入れ替えます';
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    retarget();
    if (reduce) {
      chips.forEach(function (c) {
        var id = parseInt(c.getAttribute('data-id'), 10);
        state[id].x = state[id].target; state[id].v = 0;
        applyChip(id, state[id].x);
      });
    } else {
      kickSpring();
    }
  }

  dragChip.addEventListener('pointerdown', function (e) {
    root.classList.remove('is-demo');
    dragChip.setPointerCapture(e.pointerId);
    beginDrag(e.clientX);
    e.preventDefault();
  });
  dragChip.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    moveDrag(e.clientX);
    e.preventDefault();
  });
  dragChip.addEventListener('pointerup', function (e) {
    if (!dragging) return;
    endDrag();
    e.preventDefault();
  });

  dragChip.addEventListener('keydown', function (e) {
    root.classList.remove('is-demo');
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      grabbed = !grabbed;
      dragChip.classList.toggle('is-grabbed', grabbed);
      caption.textContent = grabbed ? '掴みました。矢印キーで場所を入れ替えてください' : '中点を越えると隣と場所を入れ替えます';
      return;
    }
    if (!grabbed) return;
    var dir = 0;
    if (e.key === 'ArrowLeft') dir = -1;
    else if (e.key === 'ArrowRight') dir = 1;
    else if (e.key === 'Escape') {
      e.preventDefault();
      grabbed = false;
      dragChip.classList.remove('is-grabbed');
      caption.textContent = '中点を越えると隣と場所を入れ替えます';
      return;
    } else { return; }
    e.preventDefault();
    var from = slotOf(DRAGGED_ID);
    var to = Math.max(0, Math.min(chips.length - 1, from + dir * KEY_STEP_SLOTS));
    if (to !== from) {
      moveInOrder(from, to);
      retarget();
      kickSpring();
      caption.textContent = '場所が入れ替わりました';
    }
  });

  if (!STEP) STEP = 96;
  retarget();

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    root.classList.remove('is-demo');
  } else {
    var demoStart = null;
    function demoTick(ts) {
      if (demoStart === null) { demoStart = ts; STEP = measureStep(); }
      var t = ts - demoStart;
      if (t < 200) {
        // 대기
      } else if (t < 1000) {
        var p = Math.min(1, (t - 200) / 800);
        var ease = 1 - Math.pow(1 - p, 2);
        var travel = STEP * 2 * ease;
        if (t < 220) beginDrag(0);
        moveDrag(travel);
      } else if (t < 1300) {
        // 결과 관찰
      } else if (t < 1330) {
        endDrag();
      } else {
        if (t > 1900) demoStart = ts - 60;
      }
      requestAnimationFrame(demoTick);
    }
    requestAnimationFrame(demoTick);
  }
})();
</script>
</body>
</html>
