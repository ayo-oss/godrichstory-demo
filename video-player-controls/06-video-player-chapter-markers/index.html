<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chapter markers — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="pl is-demo" id="pl">
    <div class="pl__screen">
      <div class="pl__stripes" aria-hidden="true"></div>
      <div class="pl__world" aria-hidden="true"><span class="pl__sun"></span><span class="pl__hill pl__hill--a"></span><span class="pl__hill pl__hill--b"></span></div>
      <span class="pl__clock" id="clock">0:08</span>
      <span class="pl__badge">3:00</span>
      <div class="nm">
        <div class="nm__list" id="nm">
          <b class="nm__i">1 · 인트로</b>
          <b class="nm__i">2 · 설치</b>
          <b class="nm__i">3 · 예제</b>
          <b class="nm__i">4 · 정리</b>
        </div>
      </div>
    </div>
    <div class="sk__row">
      <span class="sk__t"><b id="t-now">0:08</b> / 3:00</span>
      <div class="sk" id="sk" role="slider" tabindex="0" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="180" aria-valuenow="8" aria-valuetext="인트로 챕터, 0:08">
        <div class="ch" id="ch">
          <span class="ch__seg" style="--s:0;--e:.1333;--k:7.5"><i class="ch__fill"></i></span>
          <span class="ch__seg" style="--s:.1333;--e:.4;--k:3.75"><i class="ch__fill"></i></span>
          <span class="ch__seg" style="--s:.4;--e:.7778;--k:2.647"><i class="ch__fill"></i></span>
          <span class="ch__seg ch__seg--end" style="--s:.7778;--e:1;--k:4.5"><i class="ch__fill"></i></span>
          <span class="ch__head" aria-hidden="true"><i class="ch__dot"></i></span>
        </div>
      </div>
    </div>
  </figure>
</main>
<script>
// 실제 동작: 챕터 눈금을 누르면 그 챕터 시작으로 건너뛰고, ←→ 5초 · Home/End 로도 움직인다.
var root = document.getElementById('pl'), sk = document.getElementById('sk'), ch = document.getElementById('ch'),
    nm = document.getElementById('nm'), clock = document.getElementById('clock'), now = document.getElementById('t-now');
var DUR = 180, CH = [[0, '인트로'], [24, '설치'], [72, '예제'], [140, '정리']], t = 8;
function fmt(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
function idx(s) { var i = 0, k; for (k = 0; k < CH.length; k++) { if (s >= CH[k][0]) i = k; } return i; }
function label() {
  var i = idx(t);
  clock.textContent = fmt(t);
  now.textContent = fmt(t);
  sk.setAttribute('aria-valuenow', Math.floor(t));
  sk.setAttribute('aria-valuetext', CH[i][1] + ' 챕터, ' + fmt(t));
  return i;
}
function paint() {
  ch.style.setProperty('--p', (t / DUR).toFixed(4));
  nm.style.setProperty('--i', label());
}
// 자동 루프 중엔 CSS 가 --p 를 움직인다 — 글자는 그리기 직전(rAF)에 그 값을 읽어 같은 프레임에 맞춘다.
// setInterval 로 읽으면 프레임 사이에 값이 어긋나 시계가 재생 머리와 따로 논다 (실측 2026-09-12: 2:49 인데 머리는 인트로)
var prev = 0;
requestAnimationFrame(function tick(ms) {
  if (root.classList.contains('is-demo')) {
    var v = parseFloat(getComputedStyle(ch).getPropertyValue('--p'));
    if (v === v) { t = v * DUR; label(); }
  } else if (ms - prev > 80) {
    prev = ms; t = (t + .08) % DUR; paint();
  }
  requestAnimationFrame(tick);
});
function take() { root.classList.remove('is-demo'); }
[].forEach.call(ch.querySelectorAll('.ch__seg'), function (el, i) {
  el.addEventListener('click', function () { take(); t = CH[i][0]; paint(); sk.focus({ preventScroll: true }); });
});
sk.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'ArrowRight') { t = Math.min(DUR - 1, t + 5); }
  else if (k === 'ArrowLeft') { t = Math.max(0, t - 5); }
  else if (k === 'Home') { t = 0; }
  else if (k === 'End') { t = DUR - 1; }
  else { return; }
  take(); paint(); e.preventDefault();
});
</script>
</body>
</html>
