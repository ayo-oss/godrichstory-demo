<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seek bar tooltip — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="pl is-demo" id="pl">
    <div class="pl__screen">
      <div class="pl__stripes" aria-hidden="true"></div>
      <div class="pl__world" aria-hidden="true"><span class="pl__sun"></span><span class="pl__hill pl__hill--a"></span><span class="pl__hill pl__hill--b"></span></div>
      <span class="pl__clock" id="clock">0:32</span>
      <span class="pl__badge">3:00</span>
    </div>
    <div class="sk__row">
      <span class="sk__t"><b id="t-now">0:32</b> / 3:00</span>
      <div class="sk is-hover" id="sk" role="slider" tabindex="0" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="180" aria-valuenow="32" aria-valuetext="0:32 / 3:00">
        <span class="sk__track" aria-hidden="true">
          <span class="sk__buf" id="buf"></span>
          <span class="sk__fill"></span>
          <span class="sk__thumbwrap"><span class="sk__thumb"></span></span>
        </span>
        <span class="sk__tip" aria-hidden="true">
          <span class="sk__prev"><span class="sk__pat"></span></span>
          <b class="sk__tt" id="tt">0:32</b>
        </span>
      </div>
    </div>
  </figure>
</main>
<script>
// 실제 동작: 마우스를 올리면 그 지점 시간을 보여 주고, 누르거나 끌면 그곳으로 건너뛴다.
var root = document.getElementById('pl'),
    sk = document.getElementById('sk'),
    tt = document.getElementById('tt'),
    now = document.getElementById('t-now'),
    clock = document.getElementById('clock');
var DUR = 180, t = 32;
function fmt(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
function paint() {
  var p = t / DUR;
  sk.style.setProperty('--p', p.toFixed(4));
  sk.setAttribute('aria-valuenow', Math.floor(t));
  sk.setAttribute('aria-valuetext', fmt(t) + ' / 3:00');
  now.textContent = fmt(t);
  clock.textContent = fmt(t);
  tt.textContent = fmt(p * DUR);
}
// 자동 루프 중엔 CSS 가 --p 를 움직이므로, 글자는 그리기 직전(rAF)에 그 값을 읽어 같은 프레임에 맞춘다.
// 따로 세면 시계와 재생 머리가 어긋난다 (실측 2026-09-12, 06 에서 같은 병)
var prev = 0;
requestAnimationFrame(function tick(ms) {
  if (root.classList.contains('is-demo')) {
    var v = parseFloat(getComputedStyle(sk).getPropertyValue('--p'));
    if (v === v) {
      t = v * DUR;
      sk.setAttribute('aria-valuenow', Math.floor(t));
      sk.setAttribute('aria-valuetext', fmt(t) + ' / 3:00');
      now.textContent = fmt(t);
      clock.textContent = fmt(t);
      tt.textContent = fmt(t);
    }
  } else if (ms - prev > 500) {
    prev = ms; t = (t + .5) % DUR; paint();
  }
  requestAnimationFrame(tick);
});
function pos(e) {
  var r = sk.getBoundingClientRect();
  return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
}
sk.addEventListener('mousemove', function (e) {
  root.classList.remove('is-demo');
  var p = pos(e);
  tt.textContent = fmt(p * DUR);
  sk.style.setProperty('--h', p.toFixed(4));
});
sk.addEventListener('mouseleave', function () { sk.style.setProperty('--h', ''); });
function seek(e) { root.classList.remove('is-demo'); t = pos(e) * DUR; paint(); }
sk.addEventListener('pointerdown', function (e) { sk.setPointerCapture(e.pointerId); seek(e); });
sk.addEventListener('pointermove', function (e) { if (e.buttons) seek(e); });
sk.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') { t = Math.min(DUR, t + 5); paint(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { t = Math.max(0, t - 5); paint(); e.preventDefault(); }
  else if (e.key === 'Home') { t = 0; paint(); e.preventDefault(); }
  else if (e.key === 'End') { t = DUR - 1; paint(); e.preventDefault(); }
});
</script>
</body>
</html>
