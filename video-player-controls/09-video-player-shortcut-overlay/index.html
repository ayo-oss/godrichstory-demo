<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shortcut overlay — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="pl is-demo" id="pl">
    <div class="pl__screen">
      <div class="pl__stripes" aria-hidden="true"></div>
      <div class="pl__world" aria-hidden="true"><span class="pl__sun"></span><span class="pl__hill pl__hill--a"></span><span class="pl__hill pl__hill--b"></span></div>
      <span class="pl__clock"><span class="clk" id="clk">0:12</span><span class="clk clk--b" aria-hidden="true">0:07</span></span>
      <span class="pl__mute" aria-hidden="true">음소거</span>
      <div class="pl__bar">
        <span class="pl__time"><b id="t-now">0:12</b> / 3:00</span>
        <button class="qb" type="button" id="qb" aria-label="단축키 안내" aria-haspopup="dialog" aria-expanded="false">
          <span aria-hidden="true"><svg viewBox="0 0 256 256" width="17" height="17"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M140 180a12 12 0 1 1-12-12a12 12 0 0 1 12 12M128 72c-22.06 0-40 16.15-40 36v4a8 8 0 0 0 16 0v-4c0-11 10.77-20 24-20s24 9 24 20s-10.77 20-24 20a8 8 0 0 0-8 8v8a8 8 0 0 0 16 0v-.72c18.24-3.35 32-17.9 32-35.28c0-19.85-17.94-36-40-36m104 56A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></svg></span>
        </button>
      </div>
      <span class="pl__fillwrap" aria-hidden="true"><span class="pl__fill" id="fill"></span></span>
      <div class="ovl" id="ovl" role="dialog" aria-modal="true" aria-label="키보드 단축키 안내">
        <div class="ovl__panel">
          <div class="ovl__head">
            <p class="ovl__title">단축키</p>
            <button class="ovl__x" type="button" id="ovx" aria-label="닫기">
              <span aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M216 56v144a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h144a16 16 0 0 1 16 16" opacity=".2"/><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg></span>
            </button>
          </div>
          <ul class="ovl__list">
            <li class="ovl__row"><span class="ovl__keys"><kbd class="k-space" data-k="space">Space</kbd></span><span class="ovl__what">재생·정지</span></li>
            <li class="ovl__row"><span class="ovl__keys"><kbd class="k-left" data-k="left">←</kbd><kbd class="k-right" data-k="right">→</kbd></span><span class="ovl__what">5초 이동</span></li>
            <li class="ovl__row"><span class="ovl__keys"><kbd class="k-m" data-k="m">M</kbd></span><span class="ovl__what">음소거</span></li>
            <li class="ovl__row"><span class="ovl__keys"><kbd class="k-f" data-k="f">F</kbd></span><span class="ovl__what">전체화면</span></li>
          </ul>
        </div>
      </div>
    </div>
  </figure>
</main>
<script>
// 실제 동작: ? 로 단축키 다이얼로그를 열고 Space·←·→·M·F 가 그 자리에서 먹는다.
var root = document.getElementById('pl'),
    qbtn = document.getElementById('qb'),
    ovx = document.getElementById('ovx'),
    clk = document.getElementById('clk'),
    now = document.getElementById('t-now'),
    fill = document.getElementById('fill');
var DUR = 180, t = 12, playing = true, last = Date.now();
function fmt(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
function paint() {
  clk.textContent = fmt(t);
  now.textContent = fmt(t);
  fill.style.transform = 'scaleX(' + (t / DUR).toFixed(4) + ')';
}
paint();
setInterval(function () {
  var n = Date.now();
  if (playing) { t = (t + (n - last) / 1000) % DUR; paint(); }
  last = n;
}, 250);
function wake() { root.classList.remove('is-demo'); }
function openOvl() {
  wake(); root.classList.add('is-open');
  qbtn.setAttribute('aria-expanded', 'true');
  ovx.focus({ preventScroll: true });
}
function closeOvl() {
  root.classList.remove('is-open');
  qbtn.setAttribute('aria-expanded', 'false');
  qbtn.focus({ preventScroll: true });
}
qbtn.addEventListener('click', openOvl);
ovx.addEventListener('click', closeOvl);
function flash(k) {
  var el = document.querySelector('.ovl kbd[data-k="' + k + '"]');
  if (!el) return;
  el.classList.remove('is-hit'); void el.offsetWidth; el.classList.add('is-hit');
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if (root.classList.contains('is-open')) closeOvl(); return; }
  var k = e.key === ' ' ? 'space' : e.key === 'ArrowLeft' ? 'left' : e.key === 'ArrowRight' ? 'right'
    : (e.key || '').toLowerCase() === 'm' ? 'm' : (e.key || '').toLowerCase() === 'f' ? 'f' : null;
  if (!k) return;
  e.preventDefault(); wake();
  if (k === 'space') { playing = !playing; root.classList.toggle('is-paused', !playing); }
  if (k === 'left') { t = Math.max(0, t - 5); paint(); }
  if (k === 'right') { t = Math.min(DUR, t + 5); paint(); }
  if (k === 'm') root.classList.toggle('is-mute');
  if (k === 'f') root.classList.toggle('is-full');
  flash(k);
});
</script>
</body>
</html>
