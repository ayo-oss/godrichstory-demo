<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mini player (PiP) — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pip is-demo" id="pip">
    <div class="pip__stack">
      <p class="pip__ph">Playing in mini player</p>
      <figure class="pl" id="pl">
        <div class="pl__screen">
          <div class="pl__stripes" aria-hidden="true"></div>
          <div class="pl__world" aria-hidden="true"><span class="pl__sun"></span><span class="pl__hill pl__hill--a"></span><span class="pl__hill pl__hill--b"></span></div>
          <span class="pl__clock" id="clock">0:12</span>
          <span class="pl__badge">3:00</span>
          <button class="pl__close" type="button" id="pip-close" aria-label="Close mini player">
            <svg viewBox="0 0 256 256" width="24" height="24" aria-hidden="true"><g fill="currentColor"><path d="M216 56v144a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h144a16 16 0 0 1 16 16" opacity=".2"/><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg>
          </button>
          <div class="pl__bar">
            <span class="pl__time"><b id="t-now">0:12</b> / 3:00</span>
            <button class="pl__mini" type="button" id="pip-mini" aria-label="Mini player" aria-pressed="false">
              <svg viewBox="0 0 256 256" width="20" height="20" aria-hidden="true"><g fill="currentColor"><path d="M224 64v64h-88v72H40a8 8 0 0 1-8-8V64a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8" opacity=".2"/><path d="M216 48H40a16 16 0 0 0-16 16v128a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V64a16 16 0 0 0-16-16M40 64h176v56h-80a8 8 0 0 0-8 8v64H40Zm176 128h-72v-56h72z"/></g></svg>
            </button>
          </div>
          <span class="pl__fillwrap" aria-hidden="true"><span class="pl__fill" id="fill"></span></span>
        </div>
      </figure>
    </div>
    <div class="pip__doc" aria-hidden="true">
      <span class="pip__line"></span>
      <span class="pip__line pip__line--b"></span>
      <span class="pip__line pip__line--c"></span>
    </div>
  </div>
</main>
<script>
// 실제 동작: 미니 버튼이 플레이어를 transform 으로 오른쪽 아래 조각 카드로 줄인다. Close·Escape 로 복귀.
var pip = document.getElementById('pip'),
    btnMini = document.getElementById('pip-mini'),
    btnClose = document.getElementById('pip-close'),
    clock = document.getElementById('clock'),
    now = document.getElementById('t-now'),
    fill = document.getElementById('fill');
var DUR = 180, t = 12, last = Date.now();
function fmt(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
setInterval(function () {
  var n = Date.now();
  t = (t + (n - last) / 1000) % DUR;
  last = n;
  clock.textContent = fmt(t);
  now.textContent = fmt(t);
  fill.style.transform = 'scaleX(' + (t / DUR).toFixed(4) + ')';
}, 250);
function setMini(on) {
  pip.classList.remove('is-demo');
  pip.classList.toggle('is-mini', on);
  btnMini.setAttribute('aria-pressed', on ? 'true' : 'false');
}
btnMini.addEventListener('click', function () {
  setMini(true);
  btnClose.focus({ preventScroll: true });
});
btnClose.addEventListener('click', function () {
  setMini(false);
  btnMini.focus({ preventScroll: true });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && pip.classList.contains('is-mini')) {
    setMini(false);
    btnMini.focus({ preventScroll: true });
  }
});
</script>
</body>
</html>
