<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>caption toggle and style — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="pl is-demo" id="pl">
    <div class="pl__screen">
      <div class="pl__stripes" aria-hidden="true"></div>
      <div class="pl__world" aria-hidden="true"><span class="pl__sun"></span><span class="pl__hill pl__hill--a"></span><span class="pl__hill pl__hill--b"></span></div>
      <span class="pl__clock" id="clock">0:12</span>
      <span class="pl__badge">3:00</span>
      <div class="cap" id="cap">
        <span class="cap__l cap__l--1 is-on">動画が始まります</span>
        <span class="cap__l cap__l--2">字幕をオンにどうぞ</span>
        <span class="cap__l cap__l--3">スタイルを選べます</span>
        <span class="cap__l cap__l--4">これで準備完了です</span>
      </div>
      <span class="pl__fillwrap" aria-hidden="true"><span class="pl__fill" id="fill"></span></span>
    </div>
    <div class="pl__bar">
      <button class="cc" type="button" id="cc" aria-pressed="true">
        <span class="cc__ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256"><g fill="currentColor"><path d="M232 64v128a8 8 0 0 1-8 8H32a8 8 0 0 1-8-8V64a8 8 0 0 1 8-8h192a8 8 0 0 1 8 8" opacity=".2"/><path d="M224 48H32a16 16 0 0 0-16 16v128a16 16 0 0 0 16 16h192a16 16 0 0 0 16-16V64a16 16 0 0 0-16-16m0 144H32V64h192zm-105.07-40.29a8 8 0 0 1-2.93 10.93a40 40 0 1 1 0-69.28a8 8 0 1 1-8 13.85a24 24 0 1 0 0 41.58a8 8 0 0 1 10.93 2.92m80 0a8 8 0 0 1-2.93 10.93a40 40 0 1 1 0-69.28a8 8 0 1 1-8 13.85a24 24 0 1 0 0 41.58a8 8 0 0 1 10.93 2.92"/></g></svg></span>
        <span class="cc__t">字幕</span>
      </button>
      <div class="seg" id="seg" role="group" aria-label="字幕スタイル">
        <button class="seg__b seg__b--chip is-on" type="button" data-s="chip" aria-pressed="true">地チップ</button>
        <button class="seg__b seg__b--line" type="button" data-s="line" aria-pressed="false">輪郭</button>
      </div>
      <span class="pl__time"><b id="t-now">0:12</b> / 3:00</span>
    </div>
  </figure>
</main>
<script>
// 실제 동작: CC 버튼으로 자막을 켜고 끄고, 세그먼트로 字幕 스타일을 고른다. 더미 再生 시계가 문장을 갈아 끼운다.
var root = document.getElementById('pl'), cc = document.getElementById('cc'),
    seg = document.getElementById('seg'), clock = document.getElementById('clock'),
    now = document.getElementById('t-now'), fill = document.getElementById('fill'),
    lines = root.querySelectorAll('.cap__l');
var DUR = 180, t = 12, last = Date.now();
function fmt(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
function show(n) {
  var i = n % lines.length;
  for (var k = 0; k < lines.length; k++) lines[k].classList.toggle('is-on', k === i);
}
function calm() { if (root.classList.contains('is-demo')) root.classList.remove('is-demo'); }
setInterval(function () {
  var n = Date.now();
  t = (t + (n - last) / 1000) % DUR;
  last = n;
  clock.textContent = fmt(t);
  now.textContent = fmt(t);
  fill.style.transform = 'scaleX(' + (t / DUR).toFixed(4) + ')';
  if (!root.classList.contains('is-demo')) show(Math.floor(t / 2));
}, 250);
cc.addEventListener('click', function () {
  calm();
  var on = cc.getAttribute('aria-pressed') !== 'true';
  cc.setAttribute('aria-pressed', String(on));
  root.classList.toggle('is-off', !on);
});
seg.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('.seg__b') : null;
  if (!b) return;
  calm();
  var bs = seg.querySelectorAll('.seg__b');
  for (var k = 0; k < bs.length; k++) {
    var on = bs[k] === b;
    bs[k].setAttribute('aria-pressed', String(on));
    bs[k].classList.toggle('is-on', on);
  }
  root.classList.toggle('is-outline', b.getAttribute('data-s') === 'line');
});
</script>
</body>
</html>
