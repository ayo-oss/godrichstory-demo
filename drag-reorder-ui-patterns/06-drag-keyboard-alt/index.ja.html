<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キーボード並び替え — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ka">
  <p class="ka__hint">Alt+矢印でインデックスを移し、結果をライブ領域に通知します</p>
  <ul class="ka__list" id="kaList" role="listbox" aria-orientation="vertical" aria-describedby="kaHelp">
    <li class="ka__row" data-id="0" role="option" tabindex="0" aria-selected="false"><span class="ka__txt">メッセージ</span></li>
    <li class="ka__row" data-id="1" role="option" tabindex="0" aria-selected="false"><span class="ka__txt">写真</span></li>
    <li class="ka__row" data-id="2" role="option" tabindex="0" aria-selected="false"><span class="ka__txt">メモ</span></li>
    <li class="ka__row" data-id="3" role="option" tabindex="0" aria-selected="false"><span class="ka__txt">音楽</span></li>
  </ul>
  <span id="kaHelp" class="ka__sr">Alt+↑↓で行を移動します</span>
  <p class="ka__meta"><b class="ka__state" id="kaState">行の並び替え</b><span class="ka__unit" id="kaUnit">Alt+↑↓で行を移動します</span></p>
  <p class="ka__live" id="kaLive" aria-live="polite"></p>
</div>
</main>
<script>
// 키보드 재정렬(06) — 포커스된 행에서 keydown 의 altKey && (ArrowUp|ArrowDown) 을 잡아 배열의
// 이웃 인덱스와 자리를 바꾼다. DOM 재배치는 FLIP 되돌림으로, 결과는 aria-live 영역에 알린다.
// 마우스 없는 사용자도 같은 handler 로 조작하므로 자동 시연도 이 함수를 그대로 부른다.
(function () {
  var list = document.getElementById('kaList');
  var liveEl = document.getElementById('kaLive');
  var stateEl = document.getElementById('kaState');
  if (!list || !liveEl || !stateEl) return;

  function rows() { return Array.prototype.slice.call(list.children); }

  function flipSwap(row, dir) {
    var arr = rows();
    var i = arr.indexOf(row);
    var j = i + dir;
    if (j < 0 || j >= arr.length) return i;
    var first = arr.map(function (r) { return r.getBoundingClientRect(); });
    if (dir > 0) list.insertBefore(arr[j], row);
    else list.insertBefore(row, arr[j]);
    arr.forEach(function (r, k) {
      var rr = r.getBoundingClientRect();
      var dy = first[k].top - rr.top;
      if (dy !== 0) {
        r.style.transition = 'none';
        r.style.transform = 'translateY(' + dy + 'px)';
        requestAnimationFrame(function () {
          r.style.transition = 'transform 220ms cubic-bezier(.2,.8,.2,1)';
          r.style.transform = 'translateY(0)';
        });
      }
    });
    return j;
  }

  function move(row, dir) {
    var j = flipSwap(row, dir);
    row.focus({ preventScroll: true });
    stateEl.textContent = '行の並び替え';
    liveEl.textContent = 'move ' + (j + 1) + '/' + rows().length;
  }

  function onKeydown(e) {
    if (!e.altKey) return;
    var row = e.target.closest('.ka__row');
    if (!row) return;
    if (e.key === 'ArrowUp') { stop(); e.preventDefault(); move(row, -1); }
    else if (e.key === 'ArrowDown') { stop(); e.preventDefault(); move(row, 1); }
  }
  list.addEventListener('keydown', onKeydown);

  // 자동 시연 — 실제 focus + move() 를 그대로 호출한다(포커스 이동도 실제로 일어난다)
  var playing = true;
  function stop() { playing = false; }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function loopOnce() {
    var row = list.children[1];
    if (!row) return;
    row.focus({ preventScroll: true });
    move(row, 1);
    setTimeout(function () {
      var r2 = list.children[2];
      if (r2) { r2.focus({ preventScroll: true }); move(r2, -1); }
    }, 480);
    setTimeout(function () {
      var r3 = list.children[1];
      if (r3) { r3.focus({ preventScroll: true }); move(r3, 1); }
    }, 980);
    setTimeout(function () {
      var r4 = list.children[2];
      if (r4) { r4.focus({ preventScroll: true }); move(r4, -1); }
    }, 1480);
  }

  if (reduce) {
    var r0 = list.children[1];
    if (r0) move(r0, 1);
  } else {
    loopOnce();
    setInterval(function () { if (playing) loopOnce(); }, 1500);
  }
})();
</script>
</body>
</html>
