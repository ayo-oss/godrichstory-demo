<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handle-Only — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ho">
  <p class="ho__hint">Pointer capture lives on the small grip only, so row buttons and links stay alive.</p>
  <ul class="ho__list" id="hoList">
    <li class="ho__row" data-id="0">
      <span class="ho__grip" tabindex="-1" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 256 256"><g fill="currentColor"><path d="M208 32v192a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V32a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16" opacity=".2"/><path d="M104 60a12 12 0 1 1-12-12a12 12 0 0 1 12 12m60 12a12 12 0 1 0-12-12a12 12 0 0 0 12 12m-72 44a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12m-72 68a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg>
      </span>
      <span class="ho__txt">Alerts</span>
      <button type="button" class="ho__act">off</button>
    </li>
    <li class="ho__row" data-id="1">
      <span class="ho__grip" tabindex="-1" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 256 256"><g fill="currentColor"><path d="M208 32v192a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V32a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16" opacity=".2"/><path d="M104 60a12 12 0 1 1-12-12a12 12 0 0 1 12 12m60 12a12 12 0 1 0-12-12a12 12 0 0 0 12 12m-72 44a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12m-72 68a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg>
      </span>
      <span class="ho__txt">Display</span>
      <button type="button" class="ho__act">on</button>
    </li>
    <li class="ho__row" data-id="2">
      <span class="ho__grip" tabindex="-1" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 256 256"><g fill="currentColor"><path d="M208 32v192a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V32a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16" opacity=".2"/><path d="M104 60a12 12 0 1 1-12-12a12 12 0 0 1 12 12m60 12a12 12 0 1 0-12-12a12 12 0 0 0 12 12m-72 44a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12m-72 68a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg>
      </span>
      <span class="ho__txt">Account</span>
      <button type="button" class="ho__act">on</button>
    </li>
    <li class="ho__row" data-id="3">
      <span class="ho__grip" tabindex="-1" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 256 256"><g fill="currentColor"><path d="M208 32v192a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V32a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16" opacity=".2"/><path d="M104 60a12 12 0 1 1-12-12a12 12 0 0 1 12 12m60 12a12 12 0 1 0-12-12a12 12 0 0 0 12 12m-72 44a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12m-72 68a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg>
      </span>
      <span class="ho__txt">Security</span>
      <button type="button" class="ho__act">off</button>
    </li>
  </ul>
  <p class="ho__meta"><b class="ho__state" id="hoState">captured</b><span class="ho__unit">off</span></p>
</div>
</main>
<script>
// 손잡이 전용(04) — pointerdown 이 .ho__grip 위에서만 setPointerCapture 를 걸어 행을 든다.
// 든 행은 목표 y(포인터-시작오프셋)를 그대로 따라가지 않고, rAF 마다 현재 위치를 목표로
// lerp(관성)시켜 --ty 커스텀 프로퍼티에 담아 transform: translateY(var(--ty)) 로 그린다.
// 이웃 행은 든 행의 중점이 자기 중점을 넘는 순간 인덱스를 바꾸고 FLIP 되돌림으로 자리를 잡는다.
(function () {
  var list = document.getElementById('hoList');
  var stateEl = document.getElementById('hoState');
  if (!list || !stateEl) return;

  var ROWS = Array.prototype.slice.call(list.children);
  var LERP = 0.22;

  var drag = null; // { row, startY, offsetInRow, pos, target, raf }

  function rowsExcept(row) {
    return Array.prototype.slice.call(list.children).filter(function (r) { return r !== row; });
  }

  // 삽입 대상 역산 — 든 행을 뺀 나머지 중 포인터 y 가 중점보다 위인 첫 행 앞에 놓는다
  function reflow(row, pointerY) {
    var siblings = rowsExcept(row);
    var target = null;
    for (var i = 0; i < siblings.length; i++) {
      var r = siblings[i].getBoundingClientRect();
      if (pointerY < r.top + r.height / 2) { target = siblings[i]; break; }
    }
    if (target === row.nextElementSibling) return;
    if (target === null && row === list.lastElementChild) return;
    flipInsert(row, target);
  }

  // FLIP: row 를 target 바로 앞(target=null 이면 끝)으로 옮기고, 옮겨간 이웃들만 되돌림 애니메이션
  function flipInsert(row, target) {
    var siblings = rowsExcept(row);
    var first = siblings.map(function (s) { return s.getBoundingClientRect(); });
    list.insertBefore(row, target);
    siblings.forEach(function (s, i) {
      var r = s.getBoundingClientRect();
      var dy = first[i].top - r.top;
      if (dy !== 0) {
        s.style.transition = 'none';
        s.style.transform = 'translateY(' + dy + 'px)';
        requestAnimationFrame(function () {
          s.style.transition = 'transform 240ms cubic-bezier(.2,.8,.2,1)';
          s.style.transform = 'translateY(0)';
        });
      }
    });
  }

  function beginDrag(row, clientY) {
    var r = row.getBoundingClientRect();
    row.classList.add('ho__row--drag');
    drag = { row: row, offsetInRow: clientY - r.top, pos: 0, target: 0 };
    tick();
  }

  function moveDrag(clientY) {
    if (!drag) return;
    var listRect = list.getBoundingClientRect();
    drag.target = clientY - drag.offsetInRow - listRect.top - drag.row.offsetTop;
    reflow(drag.row, clientY);
  }

  function tick() {
    if (!drag) return;
    drag.pos += (drag.target - drag.pos) * LERP;
    drag.row.style.setProperty('--ty', drag.pos.toFixed(2) + 'px');
    drag._raf = requestAnimationFrame(tick);
  }

  function endDrag() {
    if (!drag) return;
    var row = drag.row;
    if (drag._raf) cancelAnimationFrame(drag._raf);
    row.classList.remove('ho__row--drag');
    row.style.transition = 'transform 220ms cubic-bezier(.2,.8,.2,1)';
    row.style.setProperty('--ty', '0px');
    setTimeout(function () { row.style.transition = ''; }, 240);
    drag = null;
  }

  function onGripDown(e) {
    var grip = e.target.closest('.ho__grip');
    if (!grip) return;
    stop();
    var row = grip.closest('.ho__row');
    if (!row) return;
    grip.setPointerCapture(e.pointerId);
    beginDrag(row, e.clientY);
  }
  function onGripMove(e) { moveDrag(e.clientY); }
  function onGripUp() { endDrag(); }

  list.addEventListener('pointerdown', onGripDown);
  list.addEventListener('pointermove', onGripMove);
  list.addEventListener('pointerup', onGripUp);
  list.addEventListener('pointercancel', onGripUp);

  // 진짜 버튼은 그대로 클릭된다 — 손잡이가 아니므로 드래그를 시작하지 않는다
  list.addEventListener('click', function (e) {
    var btn = e.target.closest('.ho__act');
    if (!btn) return;
    stop();
    btn.textContent = btn.textContent === 'on' ? 'off' : 'on';
  });

  // 자동 시연 — 실제 pointerdown/move/up 과 같은 함수를 합성 좌표로 호출한다
  var playing = true;
  function stop() { playing = false; }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 홀드 중 목표 위치를 여러 번 바꿔 관성 lerp 가 창 전체에서 계속 수렴하게 한다(수렴 뒤 정지 방지)
  function scenario() {
    var row0 = ROWS[0];
    var r0 = row0.getBoundingClientRect();
    beginDrag(row0, r0.top + r0.height / 2);
    stateEl.textContent = 'captured';
    var r2 = ROWS[2].getBoundingClientRect();
    moveDrag(r2.top + r2.height / 2 + 6);
    setTimeout(function () {
      if (!drag) return;
      var r1 = ROWS[1].getBoundingClientRect();
      moveDrag(r1.top + r1.height / 2 - 4);
    }, 260);
    setTimeout(function () {
      if (!drag) return;
      var r3 = ROWS[3] ? ROWS[3].getBoundingClientRect() : r0;
      moveDrag(r3.top + r3.height / 2 + 4);
    }, 560);
  }
  function release() {
    endDrag();
    stateEl.textContent = 'captured';
  }

  if (reduce) {
    scenario();
    release();
  } else {
    function loopOnce() {
      scenario();
      setTimeout(release, 820);
    }
    loopOnce();
    setInterval(function () { if (playing) loopOnce(); }, 1700);
  }
})();
</script>
</body>
</html>
