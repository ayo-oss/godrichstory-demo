<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass tab — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="gt is-demo">
    <input type="radio" name="gt-tab" id="gt-1" class="gt__radio" checked>
    <input type="radio" name="gt-tab" id="gt-2" class="gt__radio">
    <input type="radio" name="gt-tab" id="gt-3" class="gt__radio">
    <div class="gt__nav">
      <span class="gt__pill" aria-hidden="true"></span>
      <label class="gt__tab" for="gt-1">Day</label>
      <label class="gt__tab" for="gt-2">Week</label>
      <label class="gt__tab" for="gt-3">Month</label>
    </div>
  </div>
</main>
<script>
// 인디케이터는 :checked 만으로 이동한다. 실제 클릭이 오면 데모 루프(.is-demo)만 뗀다.
document.querySelectorAll('.gt__radio').forEach(function (r) {
  r.addEventListener('pointerdown', function () { document.querySelector('.gt').classList.remove('is-demo'); });
});
</script>
</body>
</html>
