<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass modal — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="gm-scene is-demo">
    <input type="checkbox" id="gm-open" class="gm-check">
    <label class="gm-trigger" for="gm-open">Delete item</label>
    <div class="gm-overlay"></div>
    <div class="gm-modal gm-focal">
      <span class="gm-modal__title">Delete this file?</span>
      <span class="gm-modal__desc">This can't be undone.</span>
    </div>
  </div>
</main>
<script>
// 체크박스가 진짜 열림·닫힘을 낸다. 실제로 누르면 데모 루프(.is-demo)만 뗀다.
document.querySelector('.gm-check').addEventListener('change', function () {
  document.querySelector('.gm-scene').classList.remove('is-demo');
});
</script>
</body>
</html>
