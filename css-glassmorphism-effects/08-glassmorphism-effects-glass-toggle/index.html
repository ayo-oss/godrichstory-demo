<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass toggle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <label class="sw is-demo">
    <input type="checkbox" class="sw__input">
    <span class="sw__track"><span class="sw__knob"></span></span>
    <span class="sw__label">Notifications</span>
  </label>
</main>
<script>
// 체크박스가 진짜 켜짐·꺼짐을 낸다. 실제로 누르면 데모 루프(.is-demo)만 뗀다.
document.querySelector('.sw__input').addEventListener('pointerdown', function () {
  document.querySelector('.sw').classList.remove('is-demo');
});
</script>
</body>
</html>
