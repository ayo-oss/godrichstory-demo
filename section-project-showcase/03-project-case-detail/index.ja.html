<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case study block — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="cd">
    <span class="cd__accent" aria-hidden="true"></span>
    <p class="cd__eyebrow">CASE STUDY</p>
    <h2 class="cd__title">決済フローの再設計</h2>
    <p class="cd__blurb">決済を5ステップから3ステップに減らし、離脱ポイントを見直しました。</p>
    <button class="cd__toggle" type="button" aria-expanded="false" aria-controls="cd-panel">
      結果を見る
    </button>
    <div class="cd__panel" id="cd-panel" role="status" aria-live="polite">
      <div class="cd__stat"><p class="cd__num" data-target="38" data-suffix="%">0%</p><p class="cd__label">コンバージョン率が上昇</p></div>
      <div class="cd__stat"><p class="cd__num" data-target="6" data-suffix="週間">0週間</p><p class="cd__label">制作期間</p></div>
      <div class="cd__stat"><p class="cd__num" data-target="210" data-suffix="%">0%</p><p class="cd__label">トラフィック増加</p></div>
    </div>
  </section>
</main>
<script>
// 실제 동작: "結果を見る"를 누르면 패널이 실제로 펼쳐지고, 숫자 세 개가 0에서 목표값까지 올라간다.
var btn = document.querySelector('.cd__toggle');
var panel = document.querySelector('.cd__panel');
var nums = panel.querySelectorAll('.cd__num');
var hasCounted = false;

function countUp() {
  if (hasCounted) return;
  hasCounted = true;
  var startTime = performance.now();
  var duration = 900;
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function tick(now) {
    var t = Math.min(1, (now - startTime) / duration);
    var e = easeOut(t);
    nums.forEach(function (el) {
      var target = Number(el.getAttribute('data-target'));
      var suffix = el.getAttribute('data-suffix');
      el.textContent = Math.round(target * e) + suffix;
    });
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

btn.addEventListener('click', function () {
  var open = btn.getAttribute('aria-expanded') === 'true';
  btn.setAttribute('aria-expanded', String(!open));
  panel.classList.toggle('is-open', !open);
  if (!open) countUp();
});
</script>
</body>
</html>
