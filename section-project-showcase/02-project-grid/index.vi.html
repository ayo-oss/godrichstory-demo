<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project grid — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="pg is-demo">
    <div class="pg__tabs" role="tablist" aria-label="Phân loại dự án">
      <span class="pg__indicator" aria-hidden="true"></span>
      <button class="pg__tab" type="button" role="tab" data-cat="all" aria-selected="true">Tất cả</button>
      <button class="pg__tab" type="button" role="tab" data-cat="web" aria-selected="false">Web</button>
      <button class="pg__tab" type="button" role="tab" data-cat="app" aria-selected="false">App</button>
      <button class="pg__tab" type="button" role="tab" data-cat="design" aria-selected="false">Thiết kế</button>
    </div>
    <div class="pg__grid">
      <article class="pg__card" data-cat="web"><span class="pg__thumb" aria-hidden="true"></span><p class="pg__title">Dự án Web A</p><p class="pg__tag">Web</p></article>
      <article class="pg__card" data-cat="app"><span class="pg__thumb" aria-hidden="true"></span><p class="pg__title">Dự án App B</p><p class="pg__tag">App</p></article>
      <article class="pg__card" data-cat="design"><span class="pg__thumb" aria-hidden="true"></span><p class="pg__title">Dự án Thiết kế C</p><p class="pg__tag">Design</p></article>
      <article class="pg__card" data-cat="web"><span class="pg__thumb" aria-hidden="true"></span><p class="pg__title">Dự án Web D</p><p class="pg__tag">Web</p></article>
    </div>
  </section>
</main>
<script>
// 실제 동작: 탭을 클릭하면 인디케이터가 실제 탭 폭·위치(getBoundingClientRect)로 이동하고, 그 분류가 아닌 카드는 실제로 흐려진다.
var root = document.querySelector('.pg');
var tabs = root.querySelectorAll('.pg__tab');
var indicator = root.querySelector('.pg__indicator');
var cards = root.querySelectorAll('.pg__card');

function moveIndicator(tab) {
  var wrapBox = tab.parentElement.getBoundingClientRect();
  var box = tab.getBoundingClientRect();
  indicator.style.width = box.width + 'px';
  indicator.style.transform = 'translateX(' + (box.left - wrapBox.left) + 'px)';
}

tabs.forEach(function (tab) {
  tab.addEventListener('click', function () {
    root.classList.remove('is-demo');
    tabs.forEach(function (t) { t.setAttribute('aria-selected', 'false'); });
    tab.setAttribute('aria-selected', 'true');
    moveIndicator(tab);
    var cat = tab.getAttribute('data-cat');
    cards.forEach(function (card) {
      var show = cat === 'all' || card.getAttribute('data-cat') === cat;
      card.classList.toggle('is-hidden', !show);
    });
  });
});
moveIndicator(tabs[0]);
window.addEventListener('resize', function () {
  var activeTab = root.querySelector('.pg__tab[aria-selected="true"]');
  if (activeTab) moveIndicator(activeTab);
});
</script>
</body>
</html>
