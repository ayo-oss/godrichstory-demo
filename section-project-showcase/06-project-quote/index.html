<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote testimonial — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="pq is-demo" aria-roledescription="carousel" aria-label="추천사">
    <div class="pq__deck">
      <blockquote class="pq__card" data-order="0">
        <span class="pq__mark" aria-hidden="true">"</span>
        <p class="pq__text">디자인 핸드오프 없이도 구현 의도가 그대로 전달됐습니다.</p>
        <p class="pq__who">박OO · PM</p>
      </blockquote>
      <blockquote class="pq__card" data-order="1">
        <span class="pq__mark" aria-hidden="true">"</span>
        <p class="pq__text">일정보다 빠르게 나왔는데 완성도는 오히려 더 높았습니다.</p>
        <p class="pq__who">김OO · 대표</p>
      </blockquote>
      <blockquote class="pq__card" data-order="2">
        <span class="pq__mark" aria-hidden="true">"</span>
        <p class="pq__text">문의부터 배포까지 커뮤니케이션이 막힌 적이 없었습니다.</p>
        <p class="pq__who">이OO · 디자이너</p>
      </blockquote>
    </div>
    <button class="pq__next" type="button">다음 후기</button>
    <p class="pq__status" role="status" aria-live="polite"></p>
  </section>
</main>
<script>
// 실제 동작: "다음 후기"를 누르면 카드 더미가 실제로 한 장씩 뒤로 돌아가며 순서가 바뀐다.
var root = document.querySelector('.pq');
var cards = Array.prototype.slice.call(root.querySelectorAll('.pq__card'));
var next = root.querySelector('.pq__next');
var status = root.querySelector('.pq__status');

function render() {
  cards.forEach(function (card, i) { card.setAttribute('data-order', String(i)); });
  status.textContent = cards[0].querySelector('.pq__who').textContent + ' 후기를 보는 중';
}
next.addEventListener('click', function () {
  root.classList.remove('is-demo');
  cards.push(cards.shift());
  render();
});
</script>
</body>
</html>
