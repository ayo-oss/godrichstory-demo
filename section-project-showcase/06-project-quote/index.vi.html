<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote testimonial — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="pq is-demo" aria-roledescription="carousel" aria-label="Phản hồi">
    <div class="pq__deck">
      <blockquote class="pq__card" data-order="0">
        <span class="pq__mark" aria-hidden="true">"</span>
        <p class="pq__text">Ý tưởng triển khai vẫn truyền đạt trọn vẹn dù không có design handoff.</p>
        <p class="pq__who">Park OO · PM</p>
      </blockquote>
      <blockquote class="pq__card" data-order="1">
        <span class="pq__mark" aria-hidden="true">"</span>
        <p class="pq__text">Xong sớm hơn kế hoạch mà độ hoàn thiện còn cao hơn.</p>
        <p class="pq__who">Kim OO · CEO</p>
      </blockquote>
      <blockquote class="pq__card" data-order="2">
        <span class="pq__mark" aria-hidden="true">"</span>
        <p class="pq__text">Từ lúc hỏi tới lúc ra mắt, trao đổi chưa từng gián đoạn.</p>
        <p class="pq__who">Lee OO · Designer</p>
      </blockquote>
    </div>
    <button class="pq__next" type="button">Phản hồi tiếp theo</button>
    <p class="pq__status" role="status" aria-live="polite"></p>
  </section>
</main>
<script>
// 실제 동작: "Phản hồi tiếp theo"를 누르면 카드 더미가 실제로 한 장씩 뒤로 돌아가며 순서가 바뀐다.
var root = document.querySelector('.pq');
var cards = Array.prototype.slice.call(root.querySelectorAll('.pq__card'));
var next = root.querySelector('.pq__next');
var status = root.querySelector('.pq__status');

function render() {
  cards.forEach(function (card, i) { card.setAttribute('data-order', String(i)); });
  status.textContent = cards[0].querySelector('.pq__who').textContent + ' — đang hiển thị phản hồi';
}
next.addEventListener('click', function () {
  root.classList.remove('is-demo');
  cards.push(cards.shift());
  render();
});
</script>
</body>
</html>
