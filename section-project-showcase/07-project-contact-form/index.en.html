<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact form — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <form class="cf" novalidate>
    <h2 class="cf__title">Contact</h2>
    <label class="cf__field">
      <span class="cf__label-text">Name</span>
      <input class="cf__input" name="name" type="text" placeholder="Jane Doe">
    </label>
    <label class="cf__field">
      <span class="cf__label-text">Email</span>
      <input class="cf__input" name="email" type="email" placeholder="you@example.com">
    </label>
    <button class="cf__submit" type="submit">
      <span class="cf__submit-label">Send message</span>
      <svg class="cf__check" viewBox="0 0 20 20" aria-hidden="true"><polyline points="4,10 8,14 16,5"/></svg>
    </button>
    <p class="cf__status" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
// 실제 동작: 제출 시 Name·이메일을 실제로 검사한다. 빠지면 그 칸이 흔들리며 포커스를 받고, 통과하면 체크가 그려진다.
var form = document.querySelector('.cf');
var name = form.querySelector('[name="name"]');
var email = form.querySelector('[name="email"]');
var status = form.querySelector('.cf__status');

function shakeField(el) {
  el.classList.remove('is-shake');
  void el.offsetWidth;
  el.classList.add('is-shake');
}

form.addEventListener('submit', function (e) {
  e.preventDefault();
  var hasName = name.value.trim().length > 0;
  var isEmailValid = /^\S+@\S+\.\S+$/.test(email.value);
  if (!hasName) {
    shakeField(name);
    name.focus({ preventScroll: true });
    status.textContent = 'Please enter your name.';
    return;
  }
  if (!isEmailValid) {
    shakeField(email);
    email.focus({ preventScroll: true });
    status.textContent = 'Please enter a valid email address.';
    return;
  }
  form.classList.add('is-done');
  status.textContent = 'Your message has been sent.';
});
</script>
</body>
</html>
