<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experience timeline — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="et is-demo" data-active="0">
    <p class="et__desc" role="status">Năm 2023, tôi dẫn dắt Dự án A từ đầu đến cuối.</p>
    <div class="et__track">
      <span class="et__fill" aria-hidden="true"></span>
      <ol class="et__list">
        <li><button class="et__stop" type="button" data-i="0" aria-current="step">
          <span class="et__dot" aria-hidden="true"></span><span class="et__year">2023</span><span class="et__role">Trưởng Dự án A</span>
        </button></li>
        <li><button class="et__stop" type="button" data-i="1">
          <span class="et__dot" aria-hidden="true"></span><span class="et__year">2022</span><span class="et__role">Tham gia Dự án B</span>
        </button></li>
        <li><button class="et__stop" type="button" data-i="2">
          <span class="et__dot" aria-hidden="true"></span><span class="et__year">2021</span><span class="et__role">Thực tập Dự án C</span>
        </button></li>
        <li><button class="et__stop" type="button" data-i="3">
          <span class="et__dot" aria-hidden="true"></span><span class="et__year">2020</span><span class="et__role">Tốt nghiệp chuyên ngành</span>
        </button></li>
      </ol>
    </div>
  </section>
</main>
<script>
// 실제 동작: 경력 항목을 클릭하면 그 지점까지 세로 진행선이 scaleY 로 실제로 채워지고 설명 문단이 바뀐다.
var careerNotes = [
  'Năm 2023, tôi dẫn dắt Dự án A từ đầu đến cuối.',
  'Năm 2022, tôi tham gia Dự án B với vai trò phụ trách front-end.',
  'Năm 2021, tôi dựng UI ở vị trí thực tập sinh trong nhóm Dự án C.',
  'Năm 2020, tôi hoàn thành chuyên ngành và khởi động side project đầu tiên.'
];
var root = document.querySelector('.et');
var stops = root.querySelectorAll('.et__stop');
var desc = root.querySelector('.et__desc');
stops.forEach(function (btn) {
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    var i = Number(btn.getAttribute('data-i'));
    root.setAttribute('data-active', String(i));
    root.querySelector('.et__fill').style.transform = 'scaleY(' + ((i + 1) / stops.length) + ')';
    stops.forEach(function (s) { s.removeAttribute('aria-current'); });
    btn.setAttribute('aria-current', 'step');
    desc.textContent = careerNotes[i];
  });
});
</script>
</body>
</html>
