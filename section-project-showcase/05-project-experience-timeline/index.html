<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experience timeline — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="et is-demo" data-active="0">
    <p class="et__desc" role="status">2023년, 프로젝트 A 를 처음부터 끝까지 리드했습니다.</p>
    <div class="et__track">
      <span class="et__fill" aria-hidden="true"></span>
      <ol class="et__list">
        <li><button class="et__stop" type="button" data-i="0" aria-current="step">
          <span class="et__dot" aria-hidden="true"></span><span class="et__year">2023</span><span class="et__role">프로젝트 A 리드</span>
        </button></li>
        <li><button class="et__stop" type="button" data-i="1">
          <span class="et__dot" aria-hidden="true"></span><span class="et__year">2022</span><span class="et__role">프로젝트 B 참여</span>
        </button></li>
        <li><button class="et__stop" type="button" data-i="2">
          <span class="et__dot" aria-hidden="true"></span><span class="et__year">2021</span><span class="et__role">프로젝트 C 인턴</span>
        </button></li>
        <li><button class="et__stop" type="button" data-i="3">
          <span class="et__dot" aria-hidden="true"></span><span class="et__year">2020</span><span class="et__role">전공 수료</span>
        </button></li>
      </ol>
    </div>
  </section>
</main>
<script>
// 실제 동작: 경력 항목을 클릭하면 그 지점까지 세로 진행선이 scaleY 로 실제로 채워지고 설명 문단이 바뀐다.
var careerNotes = [
  '2023년, 프로젝트 A 를 처음부터 끝까지 리드했습니다.',
  '2022년, 프로젝트 B 에 프런트엔드 담당으로 참여했습니다.',
  '2021년, 프로젝트 C 팀에서 인턴으로 UI 를 구현했습니다.',
  '2020년, 전공을 마치고 첫 사이드 프로젝트를 시작했습니다.'
];
var root = document.querySelector('.et');
var stops = root.querySelectorAll('.et__stop');
var desc = root.querySelector('.et__desc');
stops.forEach(function (btn) {
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    var i = Number(btn.getAttribute('data-i'));
    root.setAttribute('data-active', String(i));
    root.querySelector('.et__fill').style.transform = 'scaleY(' + ((i + 1) / stops.length) + ')';
    stops.forEach(function (s) { s.removeAttribute('aria-current'); });
    btn.setAttribute('aria-current', 'step');
    desc.textContent = careerNotes[i];
  });
});
</script>
</body>
</html>
