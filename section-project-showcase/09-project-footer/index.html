<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showcase footer — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <footer class="pf2">
    <div class="pf2__top">
      <p class="pf2__heading">새 프로젝트 소식을 메일로 받아보세요</p>
      <form class="pf2__form" novalidate>
        <input class="pf2__input" type="email" placeholder="you@example.com" aria-label="이메일">
        <button class="pf2__submit" type="submit">
          <span class="pf2__submit-label">구독</span>
          <svg class="pf2__check" viewBox="0 0 20 20" aria-hidden="true"><polyline points="4,10 8,14 16,5"/></svg>
        </button>
      </form>
      <p class="pf2__status" role="status" aria-live="polite"></p>
    </div>
    <div class="pf2__cols">
      <div class="pf2__col"><p class="pf2__col-title">쇼케이스</p><a href="#">프로젝트</a><a href="#">이력서</a></div>
      <div class="pf2__col"><p class="pf2__col-title">연락</p><a href="#">이메일</a><a href="#">문의 폼</a></div>
      <div class="pf2__col"><p class="pf2__col-title">팔로우</p><a href="#">깃허브</a><a href="#">링크드인</a></div>
    </div>
  </footer>
</main>
<script>
// 실제 동작: 제출 시 실제로 이메일 형식을 검사한다. 통과하면 체크가 그려지고, 틀리면 입력칸이 흔들린다.
var form = document.querySelector('.pf2__form');
var input = document.querySelector('.pf2__input');
var status = document.querySelector('.pf2__status');
form.addEventListener('submit', function (e) {
  e.preventDefault();
  var ok = /^\S+@\S+\.\S+$/.test(input.value);
  if (ok) {
    form.classList.add('is-done');
    status.textContent = '구독 완료 — 새 프로젝트를 메일로 보내드립니다.';
  } else {
    input.classList.remove('is-shake');
    void input.offsetWidth;
    input.classList.add('is-shake');
    status.textContent = '올바른 이메일을 입력해 주세요.';
  }
});
</script>
</body>
</html>
