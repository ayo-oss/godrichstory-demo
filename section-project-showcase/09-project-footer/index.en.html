<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showcase footer — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <footer class="pf2">
    <div class="pf2__top">
      <p class="pf2__heading">Get new project updates by email</p>
      <form class="pf2__form" novalidate>
        <input class="pf2__input" type="email" placeholder="you@example.com" aria-label="Email">
        <button class="pf2__submit" type="submit">
          <span class="pf2__submit-label">Subscribe</span>
          <svg class="pf2__check" viewBox="0 0 20 20" aria-hidden="true"><polyline points="4,10 8,14 16,5"/></svg>
        </button>
      </form>
      <p class="pf2__status" role="status" aria-live="polite"></p>
    </div>
    <div class="pf2__cols">
      <div class="pf2__col"><p class="pf2__col-title">Showcase</p><a href="#">Projects</a><a href="#">Resume</a></div>
      <div class="pf2__col"><p class="pf2__col-title">Contact</p><a href="#">Email</a><a href="#">Contact form</a></div>
      <div class="pf2__col"><p class="pf2__col-title">Follow</p><a href="#">GitHub</a><a href="#">LinkedIn</a></div>
    </div>
  </footer>
</main>
<script>
// 실제 동작: 제출 시 실제로 Email 형식을 검사한다. 통과하면 체크가 그려지고, 틀리면 입력칸이 흔들린다.
var form = document.querySelector('.pf2__form');
var input = document.querySelector('.pf2__input');
var status = document.querySelector('.pf2__status');
form.addEventListener('submit', function (e) {
  e.preventDefault();
  var ok = /^\S+@\S+\.\S+$/.test(input.value);
  if (ok) {
    form.classList.add('is-done');
    status.textContent = 'Subscribed — new projects will land in your inbox.';
  } else {
    input.classList.remove('is-shake');
    void input.offsetWidth;
    input.classList.add('is-shake');
    status.textContent = 'Please enter a valid email address.';
  }
});
</script>
</body>
</html>
