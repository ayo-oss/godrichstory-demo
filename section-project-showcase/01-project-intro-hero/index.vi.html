<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro hero — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ih">
    <span class="ih__orb ih__orb--1" aria-hidden="true"></span>
    <span class="ih__orb ih__orb--2" aria-hidden="true"></span>
    <span class="ih__orb ih__orb--3" aria-hidden="true"></span>
    <span class="ih__mark" aria-hidden="true"></span>
    <p class="ih__eyebrow">PORTFOLIO</p>
    <h1 class="ih__title">Những gì tôi đã dựng<br>trên web</h1>
    <p class="ih__sub">Xem case study dự án và thông tin liên hệ tại một màn hình.</p>
    <div class="ih__row">
      <a class="ih__cta" href="#">Xem dự án</a>
      <button class="ih__avail-btn" type="button" aria-pressed="false">
        <span class="ih__avail-ic" aria-hidden="true"></span>
        Nhận đề xuất dự án mới
      </button>
    </div>
  </section>
</main>
<script>
// 실제 동작: 클릭마다 "제안받기" 상태가 실제로 바뀐다(아이콘 채움 + aria-pressed).
var btn = document.querySelector('.ih__avail-btn');
btn.addEventListener('click', function () {
  var on = btn.getAttribute('aria-pressed') === 'true';
  btn.setAttribute('aria-pressed', String(!on));
});
</script>
</body>
</html>
