<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문자 종류 수 채움 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cc is-demo" id="cc">
  <label class="cc__field">
    <input class="cc__input" id="ccInput" type="text" autocomplete="off" spellcheck="false" value="">
  </label>
  <div class="cc__badges">
    <div class="cc__badge" id="ccB0"><span>a-z</span></div>
    <div class="cc__badge" id="ccB1"><span>A-Z</span></div>
    <div class="cc__badge" id="ccB2"><span>0-9</span></div>
    <div class="cc__badge" id="ccB3"><span>#%!</span></div>
  </div>
  <div class="cc__track"><div class="cc__fill" id="ccFill"></div></div>
  <div class="cc__label" id="ccLabel">문자 종류 0/4</div>
</div>
<script>
(function () {
  var root = document.getElementById('cc');
  var input = document.getElementById('ccInput');
  var fill = document.getElementById('ccFill');
  var label = document.getElementById('ccLabel');
  var badges = [document.getElementById('ccB0'), document.getElementById('ccB1'), document.getElementById('ccB2'), document.getElementById('ccB3')];

  // 계산 겹: 입력 값을 4개 문자 종류 정규식으로 각각 검사해 참인 개수를 센다.
  var CLASSES = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^A-Za-z0-9]/];

  function countClasses(value) {
    var n = 0;
    for (var i = 0; i < CLASSES.length; i++) {
      var hit = CLASSES[i].test(value);
      badges[i].classList.toggle('cc__badge--on', hit);
      if (hit) n++;
    }
    return n;
  }

  function paint(value) {
    var n = countClasses(value);
    fill.style.transform = 'scaleX(' + (n / CLASSES.length) + ')';
    label.textContent = '문자 종류 ' + n + '/4';
  }

  input.addEventListener('input', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    paint(input.value);
  });

  paint(input.value);

  // 자동 루프: 시드 고정 문자열 배열로 문자 종류를 하나씩 늘렸다 줄인다.
  var SEQ = ['', 'abc', 'abcABC', 'abcABC123', 'abcABC123!@#', 'abcABC123', 'abcABC', 'abc', ''];
  var si = 0;
  var autoTimer = null;
  function autoTick() { input.value = SEQ[si]; paint(SEQ[si]); si = (si + 1) % SEQ.length; }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 340); autoTick(); }
})();
</script>
</main>
</body>
</html>
