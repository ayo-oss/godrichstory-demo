<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エントロピービット値表示 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="eb is-demo" id="eb">
  <label class="eb__field">
    <input class="eb__input" id="ebInput" type="text" autocomplete="off" spellcheck="false" value="">
  </label>
  <div class="eb__bits"><b id="ebBits">0</b><span>bit</span></div>
  <div class="eb__track" id="ebTrack">
    <span class="eb__tick" style="--tick-at:20%"></span>
    <span class="eb__tick" style="--tick-at:40%"></span>
    <span class="eb__tick" style="--tick-at:60%"></span>
    <span class="eb__tick" style="--tick-at:80%"></span>
    <div class="eb__fill" id="ebFill"></div>
  </div>
  <div class="eb__meta">文字集合 <b id="ebSet">0</b> ・文字数 <b id="ebLen">0</b></div>
</div>
<script>
(function () {
  var root = document.getElementById('eb');
  var input = document.getElementById('ebInput');
  var bitsEl = document.getElementById('ebBits');
  var fill = document.getElementById('ebFill');
  var setEl = document.getElementById('ebSet');
  var lenEl = document.getElementById('ebLen');
  var MAX_BITS = 100; // 막대 눈금의 오른쪽 끝 — 이 値 이상은 꽉 찬 막대로 표시

  // 계산 겹: 섞인 문자 종류로 文字集合 크기 값을 구하고, 文字数 값을 곱한 뒤
  // 밑이 2인 로그를 취해 비트 값을 만든다 (엔트로피 = 文字数 × log2(文字集合 크기)).
  function charsetSize(value) {
    var size = 0;
    if (/[a-z]/.test(value)) size += 26;
    if (/[A-Z]/.test(value)) size += 26;
    if (/[0-9]/.test(value)) size += 10;
    if (/[^A-Za-z0-9]/.test(value)) size += 32;
    return size;
  }

  function bitsOf(value) {
    var size = charsetSize(value);
    if (!value.length || size === 0) return { bits: 0, size: size };
    return { bits: value.length * (Math.log(size) / Math.log(2)), size: size };
  }

  function paint(value) {
    var r = bitsOf(value);
    var bits = Math.round(r.bits);
    bitsEl.textContent = String(bits);
    fill.style.transform = 'scaleX(' + Math.min(1, r.bits / MAX_BITS) + ')';
    setEl.textContent = String(r.size);
    lenEl.textContent = String(value.length);
  }

  input.addEventListener('input', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    paint(input.value);
  });

  paint(input.value);

  // 자동 루프: 시드 고정 문자열 배열로 길이·문자 집합을 함께 늘렸다 줄인다.
  var SEQ = ['', 'abc', 'abcdef', 'abcdefgh12', 'abcdefgh12AB', 'abcdefgh12AB!@',
             'abcdefgh12AB!@#$%^', 'abcdefgh12AB!@', 'abcdefgh12AB', 'abcdefgh12', 'abcdef', 'abc', ''];
  var si = 0;
  var autoTimer = null;
  function autoTick() { input.value = SEQ[si]; paint(SEQ[si]); si = (si + 1) % SEQ.length; }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 320); autoTick(); }
})();
</script>
</main>
</body>
</html>
