<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repeat/Sequence Penalty — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rs is-demo" id="rs">
  <label class="rs__field">
    <input class="rs__input" id="rsInput" type="text" autocomplete="off" spellcheck="false" value="">
  </label>
  <div class="rs__chips" id="rsChips"></div>
  <div class="rs__track"><div class="rs__fill" id="rsFill"></div></div>
  <div class="rs__row">
    <span class="rs__score">Value <b id="rsScore">0</b>/100</span>
    <span class="rs__warn" id="rsWarn">Repeat/sequence <b id="rsPenalty">-0</b></span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('rs');
  var input = document.getElementById('rsInput');
  var chipsBox = document.getElementById('rsChips');
  var fill = document.getElementById('rsFill');
  var scoreEl = document.getElementById('rsScore');
  var warn = document.getElementById('rsWarn');
  var penaltyEl = document.getElementById('rsPenalty');
  var PER_CHAR_PENALTY = 8;

  // 계산 겹: 같은 글자 3연속(반복) 또는 문자코드가 1씩 오르내리는 3연속(연속)을
  // 찾아 그 위치들을 표시하고, 표시된 Length × 감점값을 기본 점수에서 뺀다.
  function flagPositions(value) {
    var n = value.length;
    var flag = new Array(n).fill(false);
    var i = 0;
    while (i < n) {
      var j = i;
      while (j + 1 < n && value.charCodeAt(j + 1) === value.charCodeAt(j)) j++;
      if (j - i + 1 >= 3) for (var k = i; k <= j; k++) flag[k] = true;
      i = j + 1;
    }
    i = 0;
    while (i < n - 1) {
      var dir = value.charCodeAt(i + 1) - value.charCodeAt(i);
      if (dir === 1 || dir === -1) {
        var j2 = i + 1;
        while (j2 + 1 < n && value.charCodeAt(j2 + 1) - value.charCodeAt(j2) === dir) j2++;
        if (j2 - i + 1 >= 3) for (var k2 = i; k2 <= j2; k2++) flag[k2] = true;
        i = j2;
      } else {
        i++;
      }
    }
    return flag;
  }

  function scoreOf(value) {
    var base = Math.min(100, value.length * 8);
    var flag = flagPositions(value);
    var hitCount = flag.filter(Boolean).length;
    var penalty = hitCount * PER_CHAR_PENALTY;
    var score = Math.max(0, base - penalty);
    return { score: score, flag: flag, penalty: penalty };
  }

  function paint(value) {
    var r = scoreOf(value);
    fill.style.transform = 'scaleX(' + (r.score / 100) + ')';
    root.classList.toggle('rs--hit', r.penalty > 0);
    scoreEl.textContent = String(r.score);
    penaltyEl.textContent = '-' + r.penalty;
    warn.style.opacity = r.penalty > 0 ? '1' : '0';
    warn.style.transform = r.penalty > 0 ? 'scale(1)' : 'scale(.7)';

    chipsBox.innerHTML = '';
    for (var i = 0; i < value.length; i++) {
      var chip = document.createElement('span');
      chip.className = 'rs__chip' + (r.flag[i] ? ' rs__chip--on' : '');
      chipsBox.appendChild(chip);
    }
  }

  input.addEventListener('input', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    paint(input.value);
  });

  paint(input.value);

  // 자동 루프: 시드 고정 문자열 배열 — Repeat/sequence 구간이 있는 값과 없는 값을 번갈아 입력한다.
  var SEQ = ['', 'q7Kd', 'aaaKd9', '12345Kd', 'abcdKf3', 'q7mR2z', 'aaa123', ''];
  var si = 0;
  var autoTimer = null;
  function autoTick() { input.value = SEQ[si]; paint(SEQ[si]); si = (si + 1) % SEQ.length; }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 380); autoTick(); }
})();
</script>
</main>
</body>
</html>
