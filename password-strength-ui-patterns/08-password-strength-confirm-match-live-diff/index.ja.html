<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>確認入力一致位置比較 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="md is-demo" id="md">
  <label class="md__field">
    <input class="md__input" id="mdPw" type="text" autocomplete="off" spellcheck="false" value="">
  </label>
  <label class="md__field">
    <input class="md__input" id="mdConfirm" type="text" autocomplete="off" spellcheck="false" value="">
  </label>
  <div class="md__chips" id="mdChips"></div>
  <div class="md__row">
    <span class="md__status" id="mdStatus">入力待ち</span>
    <span class="md__ok" id="mdOk">
      <svg viewBox="0 0 20 20" width="12" height="12" aria-hidden="true"><path d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      一致
    </span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('md');
  var pw = document.getElementById('mdPw');
  var confirm = document.getElementById('mdConfirm');
  var chipsBox = document.getElementById('mdChips');
  var statusEl = document.getElementById('mdStatus');
  var okEl = document.getElementById('mdOk');

  // 계산 겹: 두 값의 앞에서부터 같은 글자가 이어지는 개수(一致 길이)를 구하고,
  // 확인 입력이 그 길이를 넘어서면 그 지점이 곧 처음 어긋난 위치다.
  function matchLenOf(a, b) {
    var n = Math.min(a.length, b.length);
    var i = 0;
    while (i < n && a[i] === b[i]) i++;
    return i;
  }

  function paint() {
    var a = pw.value, b = confirm.value;
    var matchLen = matchLenOf(a, b);
    var full = b.length > 0 && a.length === b.length && matchLen === a.length;

    chipsBox.innerHTML = '';
    for (var i = 0; i < b.length; i++) {
      var chip = document.createElement('span');
      chip.className = 'md__chip ' + (i < matchLen ? 'md__chip--ok' : 'md__chip--bad');
      chipsBox.appendChild(chip);
    }

    if (b.length === 0) statusEl.textContent = '入力待ち';
    else if (full) statusEl.textContent = b.length + '文字完全一致';
    else if (matchLen === b.length) statusEl.textContent = matchLen + '文字まで一致・入力継続';
    else statusEl.textContent = matchLen + '文字まで一致・ ' + (matchLen + 1) + '番目で不一致';

    root.classList.toggle('md--full', full);
  }

  pw.addEventListener('input', function () { root.classList.remove('is-demo'); stopAutoplay(); paint(); });
  confirm.addEventListener('input', function () { root.classList.remove('is-demo'); stopAutoplay(); paint(); });

  paint();

  // 자동 루프: 비밀번호는 고정, 확인 입력만 시드 고정 배열로 오타→정정 과정을 보여준다.
  var FIXED_PW = 'abcd1234';
  var SEQ = ['', 'a', 'ab', 'abc', 'abcx', 'abcd', 'abcd1', 'abcd12', 'abcd123', 'abcd1234', ''];
  var si = 0;
  var autoTimer = null;
  function autoTick() {
    pw.value = FIXED_PW;
    confirm.value = SEQ[si];
    paint();
    si = (si + 1) % SEQ.length;
  }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 380); autoTick(); }
})();
</script>
</main>
</body>
</html>
