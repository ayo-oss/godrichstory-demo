<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crack-Time Estimate Convert — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ct is-demo" id="ct">
  <label class="ct__field">
    <input class="ct__input" id="ctInput" type="text" autocomplete="off" spellcheck="false" value="">
  </label>
  <div class="ct__readout">
    <span class="ct__time" id="ctTime">Instant</span>
  </div>
  <div class="ct__track"><div class="ct__fill" id="ctFill"></div></div>
  <div class="ct__meta">Possible combinations <b id="ctGuesses">0</b></div>
</div>
<script>
(function () {
  var root = document.getElementById('ct');
  var input = document.getElementById('ctInput');
  var timeEl = document.getElementById('ctTime');
  var fill = document.getElementById('ctFill');
  var guessesEl = document.getElementById('ctGuesses');

  // 가정값: 데모 안 임의 상수 — 실제 하드웨어·연도·연구 인용이 아니다.
  var GUESSES_PER_SEC = 1e6;
  var LOG_MAX = 12; // 막대 눈금 상한(sec 단위 log10) — 이 Value 이상은 꽉 찬 막대

  function charsetSize(value) {
    var size = 0;
    if (/[a-z]/.test(value)) size += 26;
    if (/[A-Z]/.test(value)) size += 26;
    if (/[0-9]/.test(value)) size += 10;
    if (/[^A-Za-z0-9]/.test(value)) size += 32;
    return size;
  }

  // 계산 겹: Char set 크기의 Length 제곱으로 경우의 수를 구하고, 가정 초당
  // 시도 수로 나눠 sec 값을 만든 뒤, 자리 단위(sec→min→hr→day→yr→century)로 변환한다.
  function guessesOf(value) {
    var size = charsetSize(value);
    if (!value.length || size === 0) return 0;
    return Math.pow(size, value.length);
  }

  var UNITS = [
    { at: 1, name: 'sec' },
    { at: 60, name: 'min', div: 60 },
    { at: 3600, name: 'hr', div: 3600 },
    { at: 86400, name: 'day', div: 86400 },
    { at: 31536000, name: 'yr', div: 31536000 },
    { at: 31536000 * 100, name: 'century', div: 31536000 * 100 }
  ];

  function formatTime(seconds) {
    if (seconds < 1) return 'Instant';
    var pick = UNITS[0];
    for (var i = 0; i < UNITS.length; i++) if (seconds >= UNITS[i].at) pick = UNITS[i];
    var div = pick.div || 1;
    var n = seconds / div;
    var text = n >= 100 ? Math.round(n).toLocaleString() : (Math.round(n * 10) / 10).toString();
    return 'about ' + text + pick.name;
  }

  function paint(value) {
    var guesses = guessesOf(value);
    var seconds = guesses / GUESSES_PER_SEC;
    timeEl.textContent = formatTime(seconds);
    var mag = seconds < 1 ? 0 : Math.log(seconds + 1) / Math.LN10;
    fill.style.transform = 'scaleX(' + Math.max(0, Math.min(1, mag / LOG_MAX)) + ')';
    guessesEl.textContent = guesses >= 1e6 ? guesses.toExponential(1) : Math.round(guesses).toLocaleString();
  }

  input.addEventListener('input', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    paint(input.value);
  });

  paint(input.value);

  // 자동 루프: 시드 고정 문자열 배열로 길이·문자 종류를 함께 늘렸다 줄인다.
  var SEQ = ['', 'ab', 'abcd12', 'abcd12EF', 'abcd12EF!@', 'abcd12EF!@#$xy',
             'abcd12EF!@', 'abcd12EF', 'abcd12', 'ab', ''];
  var si = 0;
  var autoTimer = null;
  function autoTick() { input.value = SEQ[si]; paint(SEQ[si]); si = (si + 1) % SEQ.length; }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 380); autoTick(); }
})();
</script>
</main>
</body>
</html>
