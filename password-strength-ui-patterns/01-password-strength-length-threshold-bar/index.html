<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글자 수 경계 채움 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pw is-demo" id="pw">
  <label class="pw__field">
    <input class="pw__input" id="pwInput" type="text" autocomplete="off" spellcheck="false" value="">
  </label>
  <div class="pw__track" id="pwTrack">
    <span class="pw__tick" style="--tick-at:25%"></span>
    <span class="pw__tick" style="--tick-at:50%"></span>
    <span class="pw__tick" style="--tick-at:75%"></span>
    <div class="pw__fill" id="pwFill"></div>
  </div>
  <div class="pw__readout">
    <span class="pw__label" id="pwLabel">경계 0/4</span>
    <span class="pw__len">글자 수 <b id="pwLen">0</b></span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('pw');
  var input = document.getElementById('pwInput');
  var fill = document.getElementById('pwFill');
  var label = document.getElementById('pwLabel');
  var lenEl = document.getElementById('pwLen');

  // 계산 겹: 글자 수 값이 이 경계 값들을 넘을 때마다 강도 값(0~4)이 한 단계씩 오른다.
  var THRESHOLDS = [4, 8, 12, 16];
  var STAGE_CLASS = ['pw--s0', 'pw--s1', 'pw--s2', 'pw--s3', 'pw--s4'];

  function stageOf(len) {
    var s = 0;
    for (var i = 0; i < THRESHOLDS.length; i++) { if (len >= THRESHOLDS[i]) s = i + 1; }
    return s;
  }

  function paint(value) {
    var len = value.length;
    var stage = stageOf(len);
    var ratio = stage / THRESHOLDS.length;
    fill.style.transform = 'scaleX(' + ratio + ')';
    STAGE_CLASS.forEach(function (c) { root.classList.remove(c); });
    root.classList.add(STAGE_CLASS[stage]);
    label.textContent = '경계 ' + stage + '/4';
    lenEl.textContent = String(len);
  }

  input.addEventListener('input', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    paint(input.value);
  });

  paint(input.value);

  // 자동 루프: 시드 고정 문자열 배열로 글자 수를 늘렸다 줄이며 네 경계를 오간다.
  var SEQ = ['', 'ab', 'abcd', 'abcdef', 'abcdefgh', 'abcdefghij', 'abcdefghijkl',
             'abcdefghijklmn', 'abcdefghijklmnop', 'abcdefghijklmn', 'abcdefghij',
             'abcdefgh', 'abcd', ''];
  var si = 0;
  var autoTimer = null;
  function autoTick() { input.value = SEQ[si]; paint(SEQ[si]); si = (si + 1) % SEQ.length; }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 320); autoTick(); }
})();
</script>
</main>
</body>
</html>
