<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연속 색상 보간 게이지 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cm is-demo" id="cm">
  <label class="cm__field">
    <input class="cm__input" id="cmInput" type="text" autocomplete="off" spellcheck="false" value="">
  </label>
  <div class="cm__track"><div class="cm__fill" id="cmFill"></div></div>
  <div class="cm__readout">정도 <b id="cmPct">0</b>%</div>
</div>
<script>
(function () {
  var root = document.getElementById('cm');
  var input = document.getElementById('cmInput');
  var fill = document.getElementById('cmFill');
  var pctEl = document.getElementById('cmPct');

  // 계산 겹: 길이 비중·문자 종류 비중을 반씩 섞어 연속값(0~1)을 만들고, 그 값을
  // 3개 색 정지점(red→yellow→mint) 사이에서 RGB 선형보간해 매 입력마다 새로 계산한다.
  var STOPS = [
    { t: 0,    rgb: [194, 54, 26] },
    { t: 0.5,  rgb: [255, 210, 63] },
    { t: 1,    rgb: [76, 212, 166] }
  ];

  function lerp(a, b, f) { return a + (b - a) * f; }

  function colorAt(t) {
    t = Math.max(0, Math.min(1, t));
    var lo = STOPS[0], hi = STOPS[STOPS.length - 1];
    for (var i = 0; i < STOPS.length - 1; i++) {
      if (t >= STOPS[i].t && t <= STOPS[i + 1].t) { lo = STOPS[i]; hi = STOPS[i + 1]; break; }
    }
    var span = hi.t - lo.t || 1;
    var f = (t - lo.t) / span;
    var r = Math.round(lerp(lo.rgb[0], hi.rgb[0], f));
    var g = Math.round(lerp(lo.rgb[1], hi.rgb[1], f));
    var b = Math.round(lerp(lo.rgb[2], hi.rgb[2], f));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function classCount(value) {
    var n = 0;
    if (/[a-z]/.test(value)) n++;
    if (/[A-Z]/.test(value)) n++;
    if (/[0-9]/.test(value)) n++;
    if (/[^A-Za-z0-9]/.test(value)) n++;
    return n;
  }

  function scoreT(value) {
    var lengthPart = Math.min(1, value.length / 20);
    var classPart = classCount(value) / 4;
    return 0.5 * lengthPart + 0.5 * classPart;
  }

  function paint(value) {
    var t = scoreT(value);
    fill.style.transform = 'scaleX(' + t + ')';
    fill.style.backgroundColor = colorAt(t);
    pctEl.textContent = String(Math.round(t * 100));
  }

  input.addEventListener('input', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    paint(input.value);
  });

  paint(input.value);

  // 자동 루프: 시드 고정 문자열 배열로 길이·문자 종류를 함께 늘렸다 줄인다.
  var SEQ = ['', 'ab', 'abcdef', 'abcdefGH', 'abcdefGH12', 'abcdefGH12!@',
             'abcdefGH12', 'abcdefGH', 'abcdef', 'ab', ''];
  var si = 0;
  var autoTimer = null;
  function autoTick() { input.value = SEQ[si]; paint(SEQ[si]); si = (si + 1) % SEQ.length; }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 380); autoTick(); }
})();
</script>
</main>
</body>
</html>
