<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>よくある値減点 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cl is-demo" id="cl">
  <label class="cl__field">
    <input class="cl__input" id="clInput" type="text" autocomplete="off" spellcheck="false" value="">
  </label>
  <div class="cl__track"><div class="cl__fill" id="clFill"></div></div>
  <div class="cl__row">
    <span class="cl__score">値 <b id="clScore">0</b>/100</span>
    <span class="cl__warn" id="clWarn">よくある値 <b id="clPenalty">-40</b></span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('cl');
  var input = document.getElementById('clInput');
  var fill = document.getElementById('clFill');
  var scoreEl = document.getElementById('clScore');
  var warn = document.getElementById('clWarn');

  // 계산 겹: 가상 よくある値 소형 목록(일반 패턴형 10개, 외부 유출 목록 아님) — 실제 서비스명 0.
  var COMMON = ['password', '123456', 'qwerty', '111111', 'abc123',
                'letmein', 'iloveyou', 'admin', 'welcome', 'monkey'];
  var PENALTY = 40;

  function scoreOf(value) {
    var base = Math.min(100, value.length * 8);
    var hit = value.length > 0 && COMMON.indexOf(value.toLowerCase()) !== -1;
    var score = hit ? Math.max(0, base - PENALTY) : base;
    return { score: score, hit: hit };
  }

  function paint(value) {
    var r = scoreOf(value);
    fill.style.transform = 'scaleX(' + (r.score / 100) + ')';
    root.classList.toggle('cl--hit', r.hit);
    scoreEl.textContent = String(r.score);
    warn.style.opacity = r.hit ? '1' : '0';
    warn.style.transform = r.hit ? 'scale(1)' : 'scale(.7)';
  }

  input.addEventListener('input', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    paint(input.value);
  });

  paint(input.value);

  // 자동 루프: 시드 고정 문자열 배열 — 흔한 값과 일반 값을 번갈아 입력한다.
  var SEQ = ['', 'x7Ba9K2', 'password', 'x7Ba9K2Q', '123456', 'GreenTiger42', 'qwerty', ''];
  var si = 0;
  var autoTimer = null;
  function autoTick() { input.value = SEQ[si]; paint(SEQ[si]); si = (si + 1) % SEQ.length; }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 360); autoTick(); }
})();
</script>
</main>
</body>
</html>
