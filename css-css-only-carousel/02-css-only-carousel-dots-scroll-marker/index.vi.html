<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>::scroll-marker dots carousel — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="dm is-demo">
    <div class="dm__viewport">
      <div class="dm__track">
        <div class="dm__slide dm__slide--1"><span class="dm__cap">Lookbook hè</span></div>
        <div class="dm__slide dm__slide--2"><span class="dm__cap">Yêu thích</span></div>
        <div class="dm__slide dm__slide--3"><span class="dm__cap">Giảm giá sốc</span></div>
        <div class="dm__slide dm__slide--1 dm__slide--clone" aria-hidden="true"><span class="dm__cap">Lookbook hè</span></div>
      </div>
    </div>
  </div>
</main>
<script>
// 점(dot) 자체는 브라우저가 ::scroll-marker 로 자동 생성한다(0줄).
// 이 3줄은 미리보기 자동 재생만 멈춘다 — 실제로는 점을 눌러도, 슬라이드를 드래그해도 그대로 동작한다.
document.querySelector('.dm__viewport').addEventListener('pointerdown', function () {
  document.querySelector('.dm').classList.remove('is-demo');
});
</script>
</body>
</html>
