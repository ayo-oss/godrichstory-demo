<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basic scroll-snap carousel — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cs is-demo">
    <div class="cs__viewport">
      <div class="cs__track">
        <div class="cs__slide cs__slide--1"><span class="cs__cap">新作コレクション</span></div>
        <div class="cs__slide cs__slide--2"><span class="cs__cap">ベストセラーTOP</span></div>
        <div class="cs__slide cs__slide--3"><span class="cs__cap">送料無料イベント</span></div>
        <div class="cs__slide cs__slide--4"><span class="cs__cap">お客様の声</span></div>
        <div class="cs__slide cs__slide--1" aria-hidden="true"><span class="cs__cap">新作コレクション</span></div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작은 overflow-x:auto + scroll-snap-type 만으로 이미 끝난다(0줄).
// 이 3줄은 미리보기가 스스로 도는 걸 멈추는 용도일 뿐 — 진짜 드래그·스크롤은 그대로 살아있다.
document.querySelector('.cs__viewport').addEventListener('pointerdown', function () {
  document.querySelector('.cs').classList.remove('is-demo');
});
</script>
</body>
</html>
