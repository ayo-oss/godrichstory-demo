<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thumbnail scroll-marker carousel — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="tm is-demo">
    <div class="tm__viewport">
      <div class="tm__track">
        <div class="tm__slide tm__slide--1" style="--thumb:#93a4ca"><span class="tm__cap">Xanh dương</span></div>
        <div class="tm__slide tm__slide--2" style="--thumb:#c89a8f"><span class="tm__cap">Cam</span></div>
        <div class="tm__slide tm__slide--3" style="--thumb:#17141a"><span class="tm__cap">Đen</span></div>
        <div class="tm__slide tm__slide--1 tm__slide--clone" style="--thumb:#93a4ca" aria-hidden="true"><span class="tm__cap">Xanh dương</span></div>
      </div>
    </div>
  </div>
</main>
<script>
// 썸네일도 브라우저가 ::scroll-marker 로 자동 생성한다(0줄). 색은 슬라이드의 --thumb 변수를 물려받는다.
// 이 3줄은 미리보기 자동 재생만 멈춘다.
document.querySelector('.tm__viewport').addEventListener('pointerdown', function () {
  document.querySelector('.tm').classList.remove('is-demo');
});
</script>
</body>
</html>
