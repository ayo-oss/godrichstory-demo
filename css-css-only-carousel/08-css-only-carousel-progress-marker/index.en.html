<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress-bar carousel — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pm is-demo">
    <input type="radio" name="pm-tab" id="pm-1" class="pm__radio" checked>
    <input type="radio" name="pm-tab" id="pm-2" class="pm__radio">
    <input type="radio" name="pm-tab" id="pm-3" class="pm__radio">
    <div class="pm__bar">
      <span class="pm__fill"></span>
      <label class="pm__seg" for="pm-1" aria-label="Go to slide 1"></label>
      <label class="pm__seg" for="pm-2" aria-label="Go to slide 2"></label>
      <label class="pm__seg" for="pm-3" aria-label="Go to slide 3"></label>
    </div>
    <div class="pm__viewport">
      <div class="pm__track">
        <div class="pm__slide pm__slide--1"><span class="pm__cap">01 · Brand Story</span></div>
        <div class="pm__slide pm__slide--2"><span class="pm__cap">02 · This Season's Collection</span></div>
        <div class="pm__slide pm__slide--3"><span class="pm__cap">03 · Store Info</span></div>
        <div class="pm__slide pm__slide--1" aria-hidden="true"><span class="pm__cap">01 · Brand Story</span></div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작은 :checked 만으로 끝난다(0줄). 이 3줄은 미리보기 자동 재생만 멈춘다.
document.querySelectorAll('.pm__radio').forEach(function (r) {
  r.addEventListener('pointerdown', function () { document.querySelector('.pm').classList.remove('is-demo'); });
});
</script>
</body>
</html>
