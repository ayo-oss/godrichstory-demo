<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>::scroll-button arrows carousel — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ab is-demo">
    <div class="ab__viewport">
      <div class="ab__track">
        <div class="ab__slide ab__slide--1"><span class="ab__cap">Sản phẩm mới</span></div>
        <div class="ab__slide ab__slide--2"><span class="ab__cap">Số lượng có hạn</span></div>
        <div class="ab__slide ab__slide--3"><span class="ab__cap">Đồ thiết yếu mùa đông</span></div>
        <div class="ab__slide ab__slide--1" aria-hidden="true"><span class="ab__cap">Sản phẩm mới</span></div>
        <div class="ab__slide ab__slide--1" aria-hidden="true"><span class="ab__cap">Sản phẩm mới</span></div>
      </div>
    </div>
  </div>
</main>
<script>
// 화살표 버튼 자체는 브라우저가 ::scroll-button() 으로 자동 생성·비활성화한다(0줄).
// 이 3줄은 미리보기 자동 재생만 멈춘다 — 진짜 클릭은 그대로 동작한다.
document.querySelector('.ab__viewport').addEventListener('pointerdown', function () {
  document.querySelector('.ab').classList.remove('is-demo');
});
</script>
</body>
</html>
