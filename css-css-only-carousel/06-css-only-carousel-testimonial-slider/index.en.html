<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testimonial fade slider — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ts">
    <div class="ts__stack">
      <figure class="ts__card ts__card--1">
        <span class="ts__avatar">M</span>
        <blockquote class="ts__quote">"Delivery arrived the very next day. Packaging was careful too."</blockquote>
        <figcaption class="ts__name">Minji Kim</figcaption>
      </figure>
      <figure class="ts__card ts__card--2">
        <span class="ts__avatar">S</span>
        <blockquote class="ts__quote">"The color matched the photos exactly. I'll definitely buy again."</blockquote>
        <figcaption class="ts__name">Seojun Lee</figcaption>
      </figure>
      <figure class="ts__card ts__card--3">
        <span class="ts__avatar">H</span>
        <blockquote class="ts__quote">"Support replied fast and kindly — it made me trust the shop."</blockquote>
        <figcaption class="ts__name">Haeun Park</figcaption>
      </figure>
    </div>
  </div>
</main>
</body>
</html>
