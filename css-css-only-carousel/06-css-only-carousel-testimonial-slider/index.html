<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testimonial fade slider — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ts">
    <div class="ts__stack">
      <figure class="ts__card ts__card--1">
        <span class="ts__avatar">민</span>
        <blockquote class="ts__quote">"배송이 다음 날 바로 왔어요. 포장도 꼼꼼했습니다."</blockquote>
        <figcaption class="ts__name">김민지</figcaption>
      </figure>
      <figure class="ts__card ts__card--2">
        <span class="ts__avatar">서</span>
        <blockquote class="ts__quote">"색상이 사진이랑 똑같아서 놀랐어요. 재구매 예정."</blockquote>
        <figcaption class="ts__name">이서준</figcaption>
      </figure>
      <figure class="ts__card ts__card--3">
        <span class="ts__avatar">하</span>
        <blockquote class="ts__quote">"고객센터 응대가 빠르고 친절해서 믿음이 갑니다."</blockquote>
        <figcaption class="ts__name">박하은</figcaption>
      </figure>
    </div>
  </div>
</main>
</body>
</html>
