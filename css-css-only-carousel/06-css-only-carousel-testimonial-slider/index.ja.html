<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testimonial fade slider — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ts">
    <div class="ts__stack">
      <figure class="ts__card ts__card--1">
        <span class="ts__avatar">ミ</span>
        <blockquote class="ts__quote">「配送が翌日にすぐ届きました。梱包も丁寧でした。」</blockquote>
        <figcaption class="ts__name">キム・ミンジ</figcaption>
      </figure>
      <figure class="ts__card ts__card--2">
        <span class="ts__avatar">ソ</span>
        <blockquote class="ts__quote">「色が写真とまったく同じで驚きました。リピート予定です。」</blockquote>
        <figcaption class="ts__name">イ・ソジュン</figcaption>
      </figure>
      <figure class="ts__card ts__card--3">
        <span class="ts__avatar">ハ</span>
        <blockquote class="ts__quote">「カスタマーサポートの対応が早く親切で信頼できます。」</blockquote>
        <figcaption class="ts__name">パク・ハウン</figcaption>
      </figure>
    </div>
  </div>
</main>
</body>
</html>
