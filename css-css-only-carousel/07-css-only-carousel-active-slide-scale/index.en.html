<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Active slide scale-up carousel — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="as is-demo">
    <input type="radio" name="as-tab" id="as-1" class="as__radio" checked>
    <input type="radio" name="as-tab" id="as-2" class="as__radio">
    <input type="radio" name="as-tab" id="as-3" class="as__radio">
    <div class="as__track">
      <label class="as__slide as__slide--1" for="as-1" aria-label="Slide 1"></label>
      <label class="as__slide as__slide--2" for="as-2" aria-label="Slide 2"></label>
      <label class="as__slide as__slide--3" for="as-3" aria-label="Slide 3"></label>
    </div>
  </div>
</main>
<script>
// 실제 동작은 :checked 만으로 끝난다(0줄). 이 3줄은 미리보기 자동 재생만 멈춘다.
document.querySelectorAll('.as__radio').forEach(function (r) {
  r.addEventListener('pointerdown', function () { document.querySelector('.as').classList.remove('is-demo'); });
});
</script>
</body>
</html>
