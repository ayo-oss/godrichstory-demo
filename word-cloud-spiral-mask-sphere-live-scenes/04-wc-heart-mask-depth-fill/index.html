    }

    const ctx = ctxRaw;
    const list = listEl;
    // 캔버스 요약 — HTML 에 적힌 장면 설명 뒤에 지금 1~3위를 덧붙인다
    const baseAria = cv.getAttribute('aria-label') || '';

    let demo = root.classList.contains('is-demo');
    // 리스너는 한 묶음으로 달고 정리할 때 한 번에 뗀다
    const off = new AbortController();
    // 포인터 자리(판 좌표) — 판 밖이면 -1
    let hoverX = -1;
    let hoverY = -1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게

        cv.height = Math.round(H * dpr);

    }
    function clearStage() {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(BG, 1));
        g.addColorStop(1, rgba(BG_LOW, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    function fontOf(size) { return FONT_WEIGHT + ' ' + size.toFixed(1) + 'px ' + FONT_FAMILY; }
    function roundRectPath(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }
    // 놓인 낱말 그리기 — 상자 가운데를 중심으로 scale 배·angle 라디안 돌리고 lift 만큼 띄운다. 비트 칸을 만든 자리와 같은 기준선에 찍는다
    function drawPlaced(p, alpha, scale, angle, lift, color) {
        if (alpha <= 0.002 || scale <= 0.001) {
            return;
        }
        const cx = p.x + p.w / 2;
        const cy = p.y + p.h / 2;
        ctx.save();
        ctx.translate(cx, cy - lift);
        if (angle !== 0) {
            ctx.rotate(angle);
        }
        if (scale !== 1) {
            ctx.scale(scale, scale);
        }
        ctx.font = fontOf(p.size);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = rgba(color, alpha);
        ctx.fillText(p.text, p.x + p.dx - cx, p.y + p.dy - cy);
        ctx.restore();
    }
    function hitPlaced(p) {
        return hoverX >= p.x && hoverX <= p.x + p.w && hoverY >= p.y && hoverY <= p.y + p.h;
    }
    // 포인터 아래 낱말 — 뒤에 그린 것이 위에 있으니 뒤에서부터 찾는다. shown(i) 가 거짓인 낱말은 건너뛴다
    function pickPlaced(ps, shown) {
        if (hoverX < 0) {
            return -1;
        }
        for (let i = ps.length - 1; i >= 0; i -= 1) {
            if (shown(i) && hitPlaced(ps[i])) {
                return i;
            }
        }
        return -1;
    }
    function drawHalo(x, y, w, h) {
        ctx.lineWidth = 1.5;

    }
    // 말풍선 — 낱말과 횟수를 크림 바탕에 진한 글자로
    function drawTip(label, ax, ay) {
        ctx.font = fontOf(11);
        const bw = ctx.measureText(label).width + 16;
        const bh = 22;
        const bx = clamp(ax - bw / 2, 4, W - bw - 4);

        roundRectPath(bx, by, bw, bh, 8);

        ctx.fillStyle = rgba(BG, 1);

        ctx.textBaseline = 'middle';
        ctx.fillText(label, bx + bw / 2, by + bh / 2 + 0.5);

    // 판 위 설명 글 — 어두운 알약 바탕에 작은 크림 글자. 돌려주는 값은 차지한 상자 [x, y, w, h]
    function drawCaption(text, x, y, alignRight) {
        ctx.font = fontOf(11);
        const bw = ctx.measureText(text).width + 14;
        const bh = 20;
        const bx = alignRight ? x - bw : x;

        roundRectPath(bx, y, bw, bh, 8);
        ctx.fill();
        ctx.fillStyle = rgba(CREAM, 0.92);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, bx + 7, y + bh / 2 + 0.5);
        return [bx, y, bw, bh];
    }
    const SPRITE_PAD = 2;
    const INK_ALPHA = 40;
    // 판 비트 칸 — 한 줄에 BOARD_INTS 개 정수(480px = 정수 15개 + 밀려난 끝을 받을 여유 2개)
    const BOARD_INTS = (W >> 5) + 2;
    const scratch = document.createElement('canvas');
    const scratchRaw = scratch.getContext('2d', { willReadFrequently: true });
    if (!scratchRaw) {
        return;
    }
    const sctx = scratchRaw;
    // 비트 AND 로 겹침을 잰 횟수 — 판 밖이라 바로 거른 자리는 세지 않는다
    let bitTests = 0;
    function makeSprite(text, size) {
        sctx.font = fontOf(size);
        const m = sctx.measureText(text);
        const left = Math.ceil(m.actualBoundingBoxLeft);
        const right = Math.ceil(m.actualBoundingBoxRight);
        const asc = Math.ceil(m.actualBoundingBoxAscent);
        const desc = Math.ceil(m.actualBoundingBoxDescent);
        const w = Math.max(1, left + right) + SPRITE_PAD * 2;
        const h = Math.max(1, asc + desc) + SPRITE_PAD * 2;
        // 크기를 바꾸면 그리기 설정이 초기화되므로 글꼴은 그 뒤에 다시 준다
        if (scratch.width < w) {
            scratch.width = w;
        }
        if (scratch.height < h) {
            scratch.height = h;
        }
        sctx.clearRect(0, 0, w, h);
        sctx.font = fontOf(size);
        sctx.textAlign = 'left';
        sctx.textBaseline = 'alphabetic';
        sctx.fillStyle = '#000';
        const dx = SPRITE_PAD + left;
        const dy = SPRITE_PAD + asc;
        sctx.fillText(text, dx, dy);
        const px = sctx.getImageData(0, 0, w, h).data;
        const mw = (w >> 5) + 1;
        const bits = new Uint32Array(mw * h);
        for (let y = 0; y < h; y += 1) {
            for (let x = 0; x < w; x += 1) {
                if (px[(y * w + x) * 4 + 3] <= INK_ALPHA) {
                    continue;
                }
                // 한 픽셀 둘레(3×3)까지 칠해 두 글자 사이에 1px 틈이 남게 한다
                for (let yy = Math.max(0, y - 1); yy <= Math.min(h - 1, y + 1); yy += 1) {
                    for (let xx = Math.max(0, x - 1); xx <= Math.min(w - 1, x + 1); xx += 1) {
                        bits[yy * mw + (xx >> 5)] |= (0x80000000 >>> (xx & 31));
                    }
                }
            }
        }
        return { w: w, h: h, mw: mw, bits: bits, dx: dx, dy: dy };
    }
    function makeBoard() { return new Uint32Array(BOARD_INTS * H); }
    // 겹침 검사 — 글자 줄마다 정수를 판의 x 자리만큼 밀어(>>> s) 판 정수와 AND. 0 이 아니면 이미 칠해진 픽셀과 겹친다
    function collides(board, sp, ox, oy) {
        // 판 밖으로 한 픽셀이라도 나가면 겹친 것으로 친다 — 판 끝 긴 단어가 잘린 채 놓이지 않게
        if (ox < 0 || oy < 0 || ox + sp.w > W || oy + sp.h > H) {
            return true;
        }
        bitTests += 1;
        const s = ox & 31;
        const base = ox >> 5;
        const inv = 32 - s;
        for (let r = 0; r < sp.h; r += 1) {
            const row = (oy + r) * BOARD_INTS + base;
            const sr = r * sp.mw;
            let carry = 0;
            for (let k = 0; k < sp.mw; k += 1) {
                const v = sp.bits[sr + k];
                const part = s === 0 ? v : ((v >>> s) | carry);
                if ((board[row + k] & part) !== 0) {
                    return true;
                }
                carry = s === 0 ? 0 : (v << inv);
            }
            if (carry !== 0 && (board[row + sp.mw] & carry) !== 0) {
                return true;
            }
        }
        return false;
    }
    // 찍기 — 겹침 검사와 같은 밀기로 글자 비트를 판에 OR 한다
    function stamp(board, sp, ox, oy) {
        const s = ox & 31;
        const base = ox >> 5;
        const inv = 32 - s;
        for (let r = 0; r < sp.h; r += 1) {
            const row = (oy + r) * BOARD_INTS + base;
            const sr = r * sp.mw;
            let carry = 0;
            for (let k = 0; k < sp.mw; k += 1) {
                const v = sp.bits[sr + k];
                board[row + k] |= s === 0 ? v : ((v >>> s) | carry);
                carry = s === 0 ? 0 : (v << inv);
            }
            if (carry !== 0) {
                board[row + sp.mw] |= carry;
            }
        }
    }
    // 픽셀 하나 칠하기 — 설명 글 자리·모양 바깥처럼 낱말이 들어가면 안 되는 곳을 미리 막는다

    function blockRect(board, x, y, w, h) {

        const y0 = Math.max(0, Math.floor(y));

        const y1 = Math.min(H, Math.ceil(y + h));
        for (let yy = y0; yy < y1; yy += 1) {
            for (let xx = x0; xx < x1; xx += 1) {

        for (let i = 0; i < board.length; i += 1) {

    const HEART_SCALE = 124;
    const HEART_CX = 240;
    const HEART_CY = 160;

    const DEPTH_CELL = 4;

    const WORD_TARGET = 170;
    const FILL_SIZES = [13, 11, 10, 9, 8];
    const SIZE_SCALE = 0.9;
    const SHRINK_RATIO = 0.85;
    const SIZE_FLOOR = 8;
    // 시연 — 거리장과 윤곽은 처음부터 보이고, START_MS 부터 깊은 곳 낱말이 차례로 앉는다
    const START_MS = 300;
    const MAIN_GAP_MS = 52;
    const FILL_GAP_MS = 12;

    const FADE_MS = 400;
    function insideHeart(px, py) {
        const u = (px - HEART_CX) / HEART_SCALE;
        const v = -(py - HEART_CY) / HEART_SCALE;

        return a * a * a - u * u * v * v * v <= 0;

    // 거리장 — 칸마다 가장자리(바깥 칸)까지의 거리. 두 번 훑기(왼쪽 위 → 오른쪽 아래, 그 반대)로 이웃 칸 +3(곧은 칸)·+4(대각선 칸)을 견줘 줄인 뒤 px 로 바꾼다
    function depthField() {
        const BIG = 1e9;
        const d = new Float32Array(GW * GH);
        for (let j = 0; j < GH; j += 1) {
            for (let i = 0; i < GW; i += 1) {
                d[j * GW + i] = insideHeart((i + 0.5) * DEPTH_CELL, (j + 0.5) * DEPTH_CELL) ? BIG : 0;
            }
        }
        // 판 밖은 바깥(0)으로 친다
        const at = function (i, j) { return i < 0 || j < 0 || i >= GW || j >= GH ? 0 : d[j * GW + i]; };
        for (let j = 0; j < GH; j += 1) {
            for (let i = 0; i < GW; i += 1) {
                const c = j * GW + i;
                if (d[c] === 0) {
                    continue;
                }
                d[c] = Math.min(d[c], at(i - 1, j) + 3, at(i, j - 1) + 3, at(i - 1, j - 1) + 4, at(i + 1, j - 1) + 4);
            }
        }
        for (let j = GH - 1; j >= 0; j -= 1) {
            for (let i = GW - 1; i >= 0; i -= 1) {
                const c = j * GW + i;
                if (d[c] === 0) {
                    continue;
                }
                d[c] = Math.min(d[c], at(i + 1, j) + 3, at(i, j + 1) + 3, at(i + 1, j + 1) + 4, at(i - 1, j + 1) + 4);
            }
        }
        for (let c = 0; c < d.length; c += 1) {
            d[c] = d[c] * DEPTH_CELL / 3;
        }
        return d;
    }
    let seats = [];
    let mainCount = 0;
    let maxDepth = 1;
    let outline = [];
    let loopMs = 7000;
    let t = 0;
    const fieldCanvas = document.createElement('canvas');
    fieldCanvas.width = GW;
    fieldCanvas.height = GH;
    // 깊이 → 색 — 깊은 곳은 분홍·복숭아, 가장자리로 갈수록 레몬·민트·하늘
    const DEPTH_COLORS = [SKY, MINT, LEMON, PEACH, PINK];
    function depthColor(k) {
        const x = clamp(k, 0, 1) * (DEPTH_COLORS.length - 1);
        const i = Math.min(Math.floor(x), DEPTH_COLORS.length - 2);
        return mixRGB(DEPTH_COLORS[i], DEPTH_COLORS[i + 1], x - i);
    }
    // 깊이 순 자리 찾기 — 깊은 칸부터 글자 상자 가운데를 칸 가운데에 두고 비트 칸 겹침을 잰다.
    // 상자가 들어가려면 가운데가 가장자리에서 짧은 변의 절반은 떨어져 있어야 하므로, 그보다 얕은 칸에 닿으면 한 단계 작게 다시
    function seatWord(board, depth, order, e, size) {
        let s = size;
        while (s >= SIZE_FLOOR) {
            const sp = makeSprite(e.text, s);
            const need = Math.min(sp.w, sp.h) / 2 - SPRITE_PAD - DEPTH_CELL;
            for (let n = 0; n < order.length; n += 1) {
                const c = order[n];
                if (depth[c] < need) {
                    break;
                }
                const cx = (c % GW + 0.5) * DEPTH_CELL;
                const cy = (Math.floor(c / GW) + 0.5) * DEPTH_CELL;
                const ox = Math.round(cx - sp.w / 2);
                const oy = Math.round(cy - sp.h / 2);
                if (!collides(board, sp, ox, oy)) {
                    stamp(board, sp, ox, oy);
                    const k = depth[c] / maxDepth;
                    return { p: { text: e.text, count: e.count, theme: e.theme, size: s, x: ox, y: oy, w: sp.w, h: sp.h, dx: sp.dx, dy: sp.dy, color: depthColor(k), shrinks: 0 }, depth: depth[c] };
                }
            }
            s *= SHRINK_RATIO;
        }
        return null;
    }
    function paintField(depth) {
        const g = fieldCanvas.getContext('2d');
        if (!g) {
            return;
        }
        const img = g.createImageData(GW, GH);
        for (let c = 0; c < depth.length; c += 1) {
            if (depth[c] <= 0) {
                continue;
            }
            const k = depth[c] / maxDepth;
            // 12px 마다 줄무늬 — 등고선처럼 깊이가 같은 띠가 보인다
            const band = Math.floor(depth[c] / 12) % 2 === 0 ? 0.0 : 0.08;
            const col = mixRGB(BG_LOW, depthColor(k), 0.22 + band + k * 0.18);
            img.data[c * 4] = col[0];
            img.data[c * 4 + 1] = col[1];
            img.data[c * 4 + 2] = col[2];
            img.data[c * 4 + 3] = 255;
        }
        g.putImageData(img, 0, 0);
    }
    function build() {
        const depth = depthField();
        maxDepth = 1;
        for (let c = 0; c < depth.length; c += 1) {
            if (depth[c] > maxDepth) {
                maxDepth = depth[c];
            }
        }
        paintField(depth);
        // 모양 바깥 픽셀을 판에 미리 칠한다 — 겹침 검사 하나로 모양 안에만 놓인다
        const board = makeBoard();
        for (let y = 0; y < H; y += 1) {
            for (let x = 0; x < W; x += 1) {
                if (!insideHeart(x + 0.5, y + 0.5)) {
                    blockPixel(board, x, y);
                }
            }
        }
        const order = [];
        for (let c = 0; c < depth.length; c += 1) {
            if (depth[c] > 0) {
                order.push(c);
            }
        }
        order.sort(function (a, b) { return depth[b] - depth[a] || a - b; });
        const top = VOCAB[0].count;
        seats = [];
        for (let i = 0; i < VOCAB.length; i += 1) {
            const st = seatWord(board, depth, order, VOCAB[i], sizeFor(VOCAB[i].count, top) * SIZE_SCALE);
            if (st) {
                seats.push(st);
            }
        }
        mainCount = seats.length;
        for (let f = 0; f < FILL_SIZES.length && seats.length < WORD_TARGET; f += 1) {
            for (let i = 0; i < VOCAB.length && seats.length < WORD_TARGET; i += 1) {
                const st = seatWord(board, depth, order, VOCAB[(i * 5 + f * 3) % VOCAB.length], FILL_SIZES[f]);
                if (st) {
                    seats.push(st);
                }
            }
        }
        // 윤곽 — 하트 가운데에서 2° 마다 바깥으로 0.5px 씩 나가 처음 바깥이 되는 점
        outline = [];
        for (let a = 0; a < 360; a += 2) {
            const r0 = a * Math.PI / 180;
            let r = 0;
            while (r < 300 && insideHeart(HEART_CX + Math.cos(r0) * r, HEART_CY + Math.sin(r0) * r)) {
                r += 0.5;
            }
            outline.push([HEART_CX + Math.cos(r0) * r, HEART_CY + Math.sin(r0) * r]);
        }
        loopMs = appearAt(seats.length) + 300 + HOLD_MS + FADE_MS + 200;
    }
    function appearAt(i) {
        return START_MS + (i < mainCount ? i * MAIN_GAP_MS : mainCount * MAIN_GAP_MS + (i - mainCount) * FILL_GAP_MS);
    }
    function loopLength() { return loopMs; }
    function step(ms) { t = ms; }
    function holdEnd() { return loopMs - FADE_MS - 200; }
    function finalScene() { t = holdEnd() - 1; }
    function onWake() { }
    function draw() {
        clearStage();
        const fade = 1 - smooth((t - holdEnd()) / FADE_MS);
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(fieldCanvas, 0, 0, W, H);
        ctx.restore();
        ctx.lineWidth = 2;
        ctx.strokeStyle = rgba(PINK, 0.7 * fade);
        ctx.beginPath();
        for (let i = 0; i < outline.length; i += 1) {
            if (i === 0) {
                ctx.moveTo(outline[i][0], outline[i][1]);
            }
            else {
                ctx.lineTo(outline[i][0], outline[i][1]);
            }
        }
        ctx.closePath();
        ctx.stroke();
        for (let i = 0; i < seats.length; i += 1) {
            const age = (t - appearAt(i)) / 1000;
            if (age <= 0) {
                break;
            }
            const s = seats[i];
            drawPlaced(s.p, clamp(age * 10, 0, 1) * fade, i < mainCount ? popScale(age) : 1, 0, 0, s.p.color);
        }
        const hi = pickPlaced(seats.map(function (s) { return s.p; }), function (i) { return t >= appearAt(i); });
        if (hi >= 0 && fade > 0.5) {
            const p = seats[hi].p;
            drawHalo(p.x, p.y, p.w, p.h);
            drawTip(p.text + ' · ' + countText(p.count), p.x + p.w / 2, p.y);
        }
    }
    function ranking() {
        return VOCAB.map(function (e) { return [e.text, e.count, countText(e.count)]; });
    }
    // 글꼴 준비가 끝나 배치를 계산했는가
    let ready = false;
    // 정리 뒤(리액트 언마운트)에 늦게 온 글꼴 준비 알림이 일을 시작하지 않게
    let alive = true;
    // 시연 시계(ms) — 16ms 고정 스텝으로만 늘어난다
    let clock = 0;
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        onWake();
    }
    // 포인터 자리를 판 좌표(480×300)로 — 화면에 보이는 캔버스 크기와 상관없이
    function toBoard(ev) {
        const r = cv.getBoundingClientRect();
        return [(ev.clientX - r.left) * W / Math.max(1, r.width), (ev.clientY - r.top) * H / Math.max(1, r.height)];
    }
    cv.addEventListener('pointermove', function (ev) {
        const p = toBoard(ev);
        hoverX = p[0];
        hoverY = p[1];
        wake();
        if (still && ready) {
            render();
        }
    }, { signal: off.signal });
    cv.addEventListener('pointerleave', function () {
        hoverX = -1;
        hoverY = -1;
        if (still && ready) {
            render();
        }
    }, { signal: off.signal });
    // 숨긴 목록 — 순위나 횟수가 바뀐 때만 다시 쓴다. 캔버스 요약에는 1~3위를 붙인다
    let listKey = '';
    function syncList() {
        const rows = ranking();
        const key = rows.map(function (r) { return r[0] + ':' + r[1]; }).join('|');
        if (key === listKey) {
            return;
        }
        listKey = key;
        while (list.firstChild) {
            list.removeChild(list.firstChild);
        }
        for (let i = 0; i < rows.length; i += 1) {
            const li = document.createElement('li');
            li.textContent = rows[i][0] + ' — ' + rows[i][2];
            list.appendChild(li);
        }
        const top = rows.slice(0, 3).map(function (r) { return r[0] + ' ' + r[2]; }).join(', ');
        cv.setAttribute('aria-label', baseAria + ' ' + rankHeading + ' ' + top);
    }
    function render() {
        draw();
        syncList();
    }
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    function frame(ts) {
        if (still) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            clock += FIXED_DT;
            step(clock % loopLength());
            acc -= FIXED_DT;
            n += 1;
        }
        render();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        lastTs = -1;
        acc = 0;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 동작 줄이기 — 루프를 돌리지 않고 배치를 끝까지 계산한 마지막 한 장면만 그린다
    function showStill() {
        stopLoop();
        finalScene();
        render();
    }
    function play() {
        clock = 0;
        step(0);
        render();
        startLoop();
    }
    // 설정이 페이지를 연 채 바뀌면 — 켜지면 마지막 장면에서 멈추고, 꺼지면 시연을 처음부터
    function onMotionPref() {
        still = reduceQuery.matches;
        if (!ready) {
            return;
        }
        if (still) {
            showStill();
        }
        else {
            play();
        }
    }
    reduceQuery.addEventListener('change', onMotionPref, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        if (ready) {
            render();
        }
    }, { signal: off.signal });
    function begin() {
        if (!alive) {
            return;
        }
        fitCanvas();
        build();
        ready = true;
        if (still) {
            showStill();
        }
        else {
            play();
        }
    }
    // 글꼴 — 준비(document.fonts.ready)가 끝난 뒤에 글자 폭을 잰다. 준비 전에 재면 나중에 바뀐 글꼴과 비트 칸이 어긋난다
    const fontSet = document.fonts;
    // 늦게 도착한 글꼴 — 배치를 마친 뒤 글꼴이 새로 들어오면 글자 폭을 다시 재 배치를 다시 계산한다
    fontSet.addEventListener('loadingdone', function () {
        if (!ready || !alive) {
            return;
        }
        build();
        if (still) {
            finalScene();
        }
        render();
    }, { signal: off.signal });
    fontSet.ready.then(begin);
    return function () {
        alive = false;
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
