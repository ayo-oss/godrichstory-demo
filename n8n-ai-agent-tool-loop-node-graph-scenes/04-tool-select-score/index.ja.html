<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ツール選択 — キーワード類似度スコアの計算 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="デモの舞台 — SpaceかEnterで一時停止、Rで最初から、左右の矢印キーで別の値へ">
      <div class="ez__scene" data-role="scene" role="img" aria-label="クエリとツール説明の重複スコアが棒になって立ち、ソフトマックス正規化のあと矢印が最高峰へ折れる場面"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">場面の準備</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
// ── 532 공통 엔진 — 529 run() 시계 계승 (WAAPI 시계읽기·pause·rebuild·reduced 분기)
const W = 480;
const CX0 = 8;
const CW = 432;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, k) { return a + (b - a) * k; }
function fill(s) {
    const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
    const v = [];
    for (let i = 1; i < arguments.length; i += 1) { v.push(String(arguments[i])); }
    let o = s;
    for (let i = 0; i < keys.length; i += 1) {
        o = o.split(keys[i]).join(i < v.length ? v[i] : '');
    }
    return o;
}
function f0(v) { return String(Math.round(v)); }
function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
const rootEl = document.getElementById("ez");
const innerEl = rootEl.querySelector('[data-role="inner"]');
const sceneEl = rootEl.querySelector('[data-role="scene"]');
const chartEl = rootEl.querySelector('[data-role="chart"]');
const probeEl = rootEl.querySelector('[data-role="probe"]');
const padEl = rootEl.querySelector('[data-role="pad"]');
const statusP = rootEl.querySelector('[data-role="status"]');
const readA = rootEl.querySelector('[data-role="reada"]');
const readB = rootEl.querySelector('[data-role="readb"]');
const doneP = rootEl.querySelector('[data-role="done"]');
const pauseBtn = rootEl.querySelector('[data-role="pause"]');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function make(tag, cls, parent) {
    const e = document.createElement(tag);
    if (cls) { e.className = cx(cls); }
    parent.appendChild(e);
    return e;
}
function put(e, x, y, w, h) {
    e.style.left = x + 'px';
    e.style.top = y + 'px';
    if (w > 0) { e.style.width = w + 'px'; }
    if (h > 0) { e.style.height = h + 'px'; }
}
const sweepEl = make('i', 'sweep', sceneEl);
const scWrap = make('div', 'scwrap', sceneEl);
const clkEl = make('i', 'clk', sceneEl);
function clearAll() {
    scWrap.textContent = '';
    chartEl.textContent = '';
    probeEl.textContent = '';
}
function seedHash(i, seed) {
    const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
    return x - Math.floor(x);
}
function animsIn(host) { return host.getAnimations({ subtree: true }); }
function spanOf(d, dur) { return { s: d, e: d + dur, k: 0 }; }
function bar(cls, x, y, w, h) {
    const e = make('i', cls, chartEl);
    put(e, x, y, w, h);
    return e;
}
function drawRows(segs, max) {
    const n = segs.length;
    const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
    for (let i = 0; i < n; i += 1) {
        const sg = segs[i];
        const x = CX0 + clamp(sg.s, 0, max) / max * CW;
        const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
        bar('bar k' + sg.k, x, 5 + i * (h + 1), w, h);
    }
}
function axis(max) {
    const a = make('b', 'ax', chartEl);
    a.textContent = '0';
    put(a, CX0, 40, 0, 0);
    const b = make('b', 'ax ax--r', chartEl);
    b.textContent = f0(max) + 'ms';
    put(b, CX0 + CW - 60, 40, 60, 0);
}
let headEl = null;
function setReads(a, b) {
    readA.textContent = a;
    readB.textContent = b;
}
// ── 532 주역 계산 — 도구 선택 스코어·소프트맥스·재사용 페널티·메모리 감쇠·루프 가드
// TOKENS(q, kw) — 쿼리 q 를 소문자 단어·표현 토큰으로 쪼갠다 (임베딩 없음 — 겹침 계산)
function tokens(q) {
    return String(q).toLowerCase().split(/[^a-z0-9가-힣]+/).filter(function (s) { return s.length > 1; });
}
// TOOL_SIM — 쿼리 토큰과 도구 설명 토큰의 자카드 겹침(교집합/합집합) + 시드 가중
function toolSim(qtok, desc, seed) {
    const dt = tokens(desc);
    let hit = 0;
    for (let i = 0; i < qtok.length; i += 1) {
        if (dt.indexOf(qtok[i]) >= 0) { hit += 1; }
    }
    const uni = qtok.length + dt.length - hit;
    return uni > 0 ? (hit / uni) * (0.82 + 0.36 * seedHash(qtok.length, seed)) : 0.04 * seedHash(1, seed);
}
// SOFTMAX_T — 스코어 배열을 온도 T 로 정규화. T 가 낮으면 최고 봉우리가 독점한다
function softmaxT(scores, T) {
    let mx = -Infinity;
    for (let i = 0; i < scores.length; i += 1) { if (scores[i] > mx) { mx = scores[i]; } }
    const ex = scores.map(function (s) { return Math.exp((s - mx) / T); });
    let sm = 0;
    for (let i = 0; i < ex.length; i += 1) { sm += ex[i]; }
    return ex.map(function (e) { return e / sm; });
}
// PENALTY_P — 직전 사용 도구에 REUSE_PENALTY 를 곱해 스코어를 깎는다.
//   확률은 e^(-delta/T) 로 떨어진다 — 05의 주역 계산
const REUSE_PENALTY = 0.2;
function penalized(scores, lastIdx, T) {
    const s2 = scores.slice();
    if (lastIdx >= 0) {
        s2[lastIdx] = s2[lastIdx] * (1 - REUSE_PENALTY);
    }
    return softmaxT(s2, T);
}
// MEM_DECAY — 예산 초과 시 오래된 턴 높이를 alpha^k 로 감쇠 (06의 주역 계산)
function memDecay(heights, budget, alpha) {
    let total = 0;
    for (let i = 0; i < heights.length; i += 1) { total += heights[i]; }
    const out = heights.slice();
    let k = 0;
    let idx = 0;
    while (total > budget && idx < out.length) {
        out[idx] = heights[idx] * Math.pow(alpha, k + 1);
        total = 0;
        for (let i = 0; i < out.length; i += 1) { total += out[i]; }
        k += 1;
        idx += 1;
    }
    return out;
}
// demoT — 2초 주기 래핑
function demoT(t) { return t % 2000; }
// ── 실행 퀄: 프리셋 하나가 한 주기
let piNow = 0;
function run(cfg) {
    const off = new AbortController();
    let pi = 0;
    let cycle = 2000;
    let paused = false;
    let raf = 0;
    let clock = null;
    let lastStatus = '';
    function fit() {
        const k = rootEl.clientWidth / W;
        innerEl.style.transform = 'scale(' + k + ')';
    }
    function rebuild() {
        clearAll();
        piNow = pi;
        cycle = Math.max(2000, cfg.build(pi));
        headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
        clkEl.style.animationDuration = f0(cycle) + 'ms';
        const all = animsIn(sceneEl);
        clock = null;
        for (let i = 0; i < all.length; i += 1) {
            const an = all[i];
            if (an.animationName && an.effect && an.effect.target === clkEl) {
                clock = an;
            }
        }
    }
    function restart() {
        const all = animsIn(sceneEl);
        for (let i = 0; i < all.length; i += 1) {
            all[i].currentTime = 0;
            if (paused) { all[i].pause(); }
            else { all[i].play(); }
        }
    }
    function tick() {
        const ct = clock ? Number(clock.currentTime) : 0;
        const t = isFinite(ct) ? ct : 0;
        if (headEl) {
            headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
        }
        sweepEl.style.setProperty('--sw', String(Math.round(t / cycle * 100)));
        const s = cfg.frame(t);
        if (s !== lastStatus) {
            statusP.textContent = s;
            lastStatus = s;
        }
        if (!paused && clock && t >= cycle - 1) {
            pi = (pi + 1) % cfg.count;
            rebuild();
            restart();
        }
        raf = requestAnimationFrame(tick);
    }
    function setPaused(p) {
        paused = p;
        pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
        const all = animsIn(sceneEl);
        for (let i = 0; i < all.length; i += 1) {
            if (p) { all[i].pause(); }
            else { all[i].play(); }
        }
        doneP.textContent = readB.textContent;
    }
    function shift(d) {
        pi = (pi + d + cfg.count) % cfg.count;
        rebuild();
        restart();
        doneP.textContent = readB.textContent;
    }
    pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
    padEl.addEventListener('keydown', function (ev) {
        if (ev.target === pauseBtn) { return; }
        if (ev.key === ' ' || ev.key === 'Enter') {
            ev.preventDefault();
            setPaused(!paused);
        }
        else if (ev.key === 'r' || ev.key === 'R') { shift(-pi); }
        else if (ev.key === 'ArrowRight') { ev.preventDefault(); shift(1); }
        else if (ev.key === 'ArrowLeft') { ev.preventDefault(); shift(-1); }
    }, { signal: off.signal });
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) { setPaused(true); }
    }, { signal: off.signal });
    window.addEventListener('resize', fit, { signal: off.signal });
    fit();
    rebuild();
    if (reduced) {
        cfg.frame(1e9);
        statusP.textContent = readB.textContent;
        doneP.textContent = readB.textContent;
    }
    else {
        restart();
        raf = requestAnimationFrame(tick);
    }
    return function () {
        cancelAnimationFrame(raf);
        off.abort();
    };
}

// 04 도구 선택 — 쿼리 토큰과 도구 설명의 자카드 겹침(similarityScore: toolSim)으로
//    스코어를 내고 온도 T 의 소프트맥스(softmaxT)로 정규화해 선택 화살표(selectArrow)가 꺾인다.
const TOOLS04 = [
    ['Calculator', 'math calculate sum cost numbers'],
    ['HTTP Request', 'fetch http page url request api'],
    ['Vector Store', 'memory search recall past conversation']
];
let bars04 = null;
let arrow04 = null;
let labels04 = null;
let scores04 = null;
function build(i) {
    const q = ['費用を計算して', 'このページのurlを取得して', '前の会話メモリから探して'][i];
    const qtok = tokens(q);
    scores04 = [];
    for (let k = 0; k < 3; k += 1) {
        scores04.push(toolSim(qtok, TOOLS04[k][1], 7 + i));
    }
    bars04 = [];
    labels04 = [];
    for (let k = 0; k < 3; k += 1) {
        const b = make('i', 'tbar', scWrap);
        put(b, 40 + k * 120, 0, 0, 0);
        b.style.width = '56px';
        b.style.bottom = '34px';
        b.style.top = '';
        b.style.height = '0px';
        bars04.push(b);
        const nm = make('b', 'tname', scWrap);
        nm.textContent = TOOLS04[k][0];
        put(nm, 40 + k * 120, 126, 90, 12);
        labels04.push(nm);
        const sc = make('b', 'tsc', scWrap);
        put(sc, 40 + k * 120, 116, 70, 10);
        labels04.push(sc);
    }
    arrow04 = make('i', 'selarrow', scWrap);
    put(arrow04, 60, 0, 0, 0);
    const ov = make('b', 'ov ovs', sceneEl);
    put(ov, 330, 8, 110, 12);
    ov.textContent = 'softmax T=0.25';
    drawRows([spanOf(160, 640), spanOf(960, 300)], 2000);
    axis(2000);
    setReads(fill('similarityScore (toolSim) — ジャッカード重複 × シード加重 · softmax T 0.25 · クエリ: {a}', q), q);
    doneP.textContent = '';
    return 2000;
}
function frame(t) {
    const ph = clamp(demoT(t) / 1500, 0, 1);
    const T = 0.25;
    const probs = softmaxT(scores04, T);
    let mx = 0;
    for (let k = 1; k < 3; k += 1) { if (probs[k] > probs[mx]) { mx = k; } }
    for (let k = 0; k < 3; k += 1) {
        const h = clamp(ph * probs[k] * 200, 0, 92);
        bars04[k].style.height = h + 'px';
        bars04[k].classList.toggle(cx('tbar--on'), k === mx && ph > 0.6);
        labels04[k * 2 + 1].textContent = 's ' + f1(scores04[k] * 100) + ' · p ' + f0(probs[k] * 100) + '%';
    }
    arrow04.style.left = (68 + mx * 120 + ph * 0) + 'px';
    arrow04.style.top = (116 - clamp(ph * probs[mx] * 200, 0, 92)) + 'px';
    arrow04.style.opacity = ph > 0.6 ? '1' : '0';
    return fill('ツールスコア {a} — 選択 {b} · p={c}% (softmax T 0.25)', f1(scores04[mx] * 100), TOOLS04[mx][0], f0(probs[mx] * 100));
}
    return run({ count: 3, build: build, frame: frame });
}
})();
</script>
</body>
</html>
