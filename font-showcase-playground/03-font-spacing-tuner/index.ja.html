<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字間・行間ツマミ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="st is-demo" id="st" aria-label="字間・行間ツマミ">
  <header class="st__bar">
    <span class="st__name">字間・行間</span>
    <span class="st__hint">em・倍率</span>
  </header>
  <div class="st__ctrl">
    <span class="st__val" id="stTrackVal">0.02em</span>
    <input class="st__range" id="stTrack" type="range" min="-0.04" max="0.3" step="0.01" value="0.02"
           aria-label="字間スライダー">
  </div>
  <div class="st__ctrl">
    <span class="st__val" id="stLeadVal">1.70</span>
    <input class="st__range" id="stLead" type="range" min="1" max="2" step="0.05" value="1.7"
           aria-label="行間スライダー">
  </div>
  <div class="st__body">
    <p class="st__text" id="stText">わずかな字間ひとつで段落の温度が変わる。行間が一歩広がると文は息をする。2つのツマミを動かして反応を確かめてみよう。</p>
  </div>
</section>
</main>
<script>
var st = document.getElementById('st');
var text = document.getElementById('stText');
var track = document.getElementById('stTrack');
var lead = document.getElementById('stLead');
var trackVal = document.getElementById('stTrackVal');
var leadVal = document.getElementById('stLeadVal');
// 값은 textContent 로 글자만 즉시 갈아 끼운다 — innerHTML 이 아니라 위조 여지가 없다.
// letter-spacing 은 em 단위, line-height 는 단위 없는 배수로 본문에 바로 닿는다.
track.oninput = function () {
  st.classList.remove('is-demo');
  var v = Number(track.value).toFixed(2);
  text.style.letterSpacing = v + 'em';
  track.style.setProperty('--fill', ((track.value + 0.04) / 0.34 * 100) + '%');
  trackVal.textContent = v + 'em';
};
lead.oninput = function () {
  st.classList.remove('is-demo');
  var m = Number(lead.value).toFixed(2);
  text.style.lineHeight = m;
  lead.style.setProperty('--fill', ((lead.value - 1) / 1 * 100) + '%');
  leadVal.textContent = m;
};
track.addEventListener('pointerdown', function () { st.classList.remove('is-demo'); });
lead.addEventListener('pointerdown', function () { st.classList.remove('is-demo'); });
</script>
</body>
</html>
