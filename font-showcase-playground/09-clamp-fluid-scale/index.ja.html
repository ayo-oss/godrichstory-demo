<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レスポンシブ clamp() スケール — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cf is-demo" id="cf">
  <div class="cf__reads">
    <span class="cf__big" id="big">パネル 17.9rem</span>
    <span class="cf__sub" id="sub">ウィンドウ 30rem · 比率 62%</span>
  </div>
  <div class="cf__frame" id="frame">
    <div class="cf__inner">
      <h2 class="cf__title">レスポンシブ見出し</h2>
      <p class="cf__lede">下限と上限で縛られているので、はみ出しません</p>
    </div>
    <span class="cf__ruler" aria-hidden="true"></span>
    <button class="cf__grip" id="grip" type="button" aria-label="パネル幅の調整"></button>
  </div>
  <p class="cf__formula">font-size: clamp(1.125rem, 13cqw, 3rem) · width: min(62%, 30rem)</p>
  <p class="cf__note">ハンドルをドラッグしてパネル幅を変えてみてください</p>
</div>
</main>
<script>
var cf = document.getElementById('cf');
var frame = document.getElementById('frame');
var big = document.getElementById('big');
var sub = document.getElementById('sub');
var grip = document.getElementById('grip');
var lastW = -1;

// パネル 폭(rem)·ウィンドウ 폭(innerWidth 을 rem 으로 환산)·무대 대비 비율을 다시 쓴다.
// 루프가 パネル 폭을 움직일 때도 ResizeObserver 가 잡아 숫자가 따라온다.
function update() {
  var w = frame.offsetWidth;
  if (w === lastW) return;
  lastW = w;
  var winRem = window.innerWidth / 16;
  var ratio = Math.round(w / cf.clientWidth * 100);
  big.textContent = 'パネル ' + (w / 16).toFixed(1) + 'rem';
  sub.textContent = 'ウィンドウ ' + winRem.toFixed(1) + 'rem · 比率 ' + ratio + '%';
}

if ('ResizeObserver' in window) {
  new ResizeObserver(update).observe(frame);
  new ResizeObserver(update).observe(cf);
}
window.addEventListener('resize', update);
(function tick() { update(); requestAnimationFrame(tick); })();
update();

// 손잡이 드래그 — 포인터 캡처로 마우스·터치·펜이 같은 길을 쓴다
var dragging = false;
var startX = 0;
var startW = 0;
grip.addEventListener('pointerdown', function (e) {
  dragging = true;
  startX = e.clientX;
  startW = frame.offsetWidth;
  cf.classList.remove('is-demo');
  grip.setPointerCapture(e.pointerId);
  e.preventDefault();
});
grip.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var w = Math.min(Math.max(startW + (e.clientX - startX), 176), cf.clientWidth);
  frame.style.width = w + 'px';
});
function endDrag() { dragging = false; }
grip.addEventListener('pointerup', endDrag);
grip.addEventListener('pointercancel', endDrag);
// 키보드는 한 칸에 1rem(16px) 씩
grip.addEventListener('keydown', function (e) {
  var step = 0;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') step = -16;
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') step = 16;
  if (!step) return;
  cf.classList.remove('is-demo');
  e.preventDefault();
  var w = Math.min(Math.max(frame.offsetWidth + step, 176), cf.clientWidth);
  frame.style.width = w + 'px';
});
</script>
</body>
</html>
