<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paragraph rhythm preview — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tr is-demo" id="tr">
  <div class="tr__bar">
    <span class="tr__label">Line length</span>
    <input class="tr__range" id="measure" type="range" min="24" max="46" step="1" value="44" aria-label="Line length">
    <span class="tr__val" id="val">44ch</span>
    <button class="tr__toggle" id="grid" type="button" aria-pressed="true">Baseline grid</button>
  </div>
  <div class="tr__sheet is-grid" id="sheet">
    <p class="tr__p">Before choosing a typeface, settle the line length. Too long and the eye loses the first word of the next line; too short and the sentence keeps breaking. Leading follows that length.</p>
  </div>
  <p class="tr__note">When every line lands on a grid row, the paragraph finds its rhythm</p>
</div>
</main>
<script>
var tr = document.getElementById('tr');
var range = document.getElementById('measure');
var val = document.getElementById('val');
var sheet = document.getElementById('sheet');
var grid = document.getElementById('grid');
// 실사용 경로 — 슬라이더 값은 ch 배수로 그대로 들어간다. 미리보기 루프는 같은 값을 CSS 키프레임으로 흔든다
function applyMeasure() {
  sheet.style.setProperty('--measure', range.value);
  val.textContent = range.value + 'ch';
}
function stopLoop() { tr.classList.remove('is-demo'); }
range.addEventListener('input', function () { stopLoop(); applyMeasure(); });
grid.addEventListener('click', function () {
  stopLoop();
  var on = grid.getAttribute('aria-pressed') === 'true';
  grid.setAttribute('aria-pressed', on ? 'false' : 'true');
  sheet.classList.toggle('is-grid', !on);
});
applyMeasure();
</script>
</body>
</html>
