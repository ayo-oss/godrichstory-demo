<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フォント解剖カード — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fa is-demo is-serif" id="fa">
  <div class="fa__bar" role="group" aria-label="見本を選ぶ">
    <button class="fa__pick" type="button" data-face="serif" aria-pressed="true">セリフ</button>
    <button class="fa__pick" type="button" data-face="sans" aria-pressed="false">サンセリフ</button>
  </div>
  <div class="fa__cards">
    <figure class="fa__card fa__card--serif">
      <span class="fa__sample" aria-hidden="true">Hxg</span>
      <span class="fa__rule fa__rule--cap"><span class="fa__tag">大文字の高さ</span></span>
      <span class="fa__rule fa__rule--x"><span class="fa__tag">x ハイト</span></span>
      <span class="fa__rule fa__rule--base"><span class="fa__tag">ベースライン</span></span>
      <figcaption class="fa__name">セリフ</figcaption>
    </figure>
    <figure class="fa__card fa__card--sans">
      <span class="fa__sample" aria-hidden="true">Hxg</span>
      <span class="fa__rule fa__rule--cap"><span class="fa__tag">大文字の高さ</span></span>
      <span class="fa__rule fa__rule--x"><span class="fa__tag">x ハイト</span></span>
      <span class="fa__rule fa__rule--base"><span class="fa__tag">ベースライン</span></span>
      <figcaption class="fa__name">サンセリフ</figcaption>
    </figure>
  </div>
  <p class="fa__note">x ハイトの罫は ex 単位で引くので、書体ごとに位置が変わります</p>
</div>
</main>
<script>
var fa = document.getElementById('fa');
var picks = fa.querySelectorAll('.fa__pick');
// 실사용 경로 — 고른 표본 카드만 앞으로 나온다. 미리보기 루프는 같은 전환을 CSS 컷으로 돈다
picks.forEach(function (b) {
  b.addEventListener('click', function () {
    fa.classList.remove('is-demo');
    var face = b.getAttribute('data-face');
    fa.classList.toggle('is-serif', face === 'serif');
    fa.classList.toggle('is-sans', face === 'sans');
    picks.forEach(function (x) {
      x.setAttribute('aria-pressed', x.getAttribute('data-face') === face ? 'true' : 'false');
    });
  });
});
</script>
</body>
</html>
