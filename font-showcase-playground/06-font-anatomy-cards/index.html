<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>폰트 해부 카드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fa is-demo is-serif" id="fa">
  <div class="fa__bar" role="group" aria-label="표본 고르기">
    <button class="fa__pick" type="button" data-face="serif" aria-pressed="true">세리프</button>
    <button class="fa__pick" type="button" data-face="sans" aria-pressed="false">산세리프</button>
  </div>
  <div class="fa__cards">
    <figure class="fa__card fa__card--serif">
      <span class="fa__sample" aria-hidden="true">Hxg</span>
      <span class="fa__rule fa__rule--cap"><span class="fa__tag">대문자 높이</span></span>
      <span class="fa__rule fa__rule--x"><span class="fa__tag">x 높이</span></span>
      <span class="fa__rule fa__rule--base"><span class="fa__tag">기준선</span></span>
      <figcaption class="fa__name">세리프</figcaption>
    </figure>
    <figure class="fa__card fa__card--sans">
      <span class="fa__sample" aria-hidden="true">Hxg</span>
      <span class="fa__rule fa__rule--cap"><span class="fa__tag">대문자 높이</span></span>
      <span class="fa__rule fa__rule--x"><span class="fa__tag">x 높이</span></span>
      <span class="fa__rule fa__rule--base"><span class="fa__tag">기준선</span></span>
      <figcaption class="fa__name">산세리프</figcaption>
    </figure>
  </div>
  <p class="fa__note">x 높이 줄은 ex 단위로 그려 서체마다 자리가 달라집니다</p>
</div>
</main>
<script>
var fa = document.getElementById('fa');
var picks = fa.querySelectorAll('.fa__pick');
// 실사용 경로 — 고른 표본 카드만 앞으로 나온다. 미리보기 루프는 같은 전환을 CSS 컷으로 돈다
picks.forEach(function (b) {
  b.addEventListener('click', function () {
    fa.classList.remove('is-demo');
    var face = b.getAttribute('data-face');
    fa.classList.toggle('is-serif', face === 'serif');
    fa.classList.toggle('is-sans', face === 'sans');
    picks.forEach(function (x) {
      x.setAttribute('aria-pressed', x.getAttribute('data-face') === face ? 'true' : 'false');
    });
  });
});
</script>
</body>
</html>
