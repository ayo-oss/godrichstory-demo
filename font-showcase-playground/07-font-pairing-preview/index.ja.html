<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>見出し・本文ペアプレビュー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pp is-demo" id="pp">
  <div class="pp__row">
    <span class="pp__glabel">見出し</span>
    <div class="pp__chips" role="group" aria-label="見出し書体を選ぶ">
      <button class="pp__chip pp__chip--sans is-on" type="button" data-row="head" aria-pressed="true"><span class="pp__spec" aria-hidden="true">Aa</span>サンセリフ</button>
      <button class="pp__chip pp__chip--serif" type="button" data-row="head" aria-pressed="false"><span class="pp__spec" aria-hidden="true">Aa</span>セリフ</button>
      <button class="pp__chip pp__chip--mono" type="button" data-row="head" aria-pressed="false"><span class="pp__spec" aria-hidden="true">Aa</span>モノ</button>
      <button class="pp__chip pp__chip--wide" type="button" data-row="head" aria-pressed="false"><span class="pp__spec" aria-hidden="true">Aa</span>ワイドサンセリフ</button>
    </div>
  </div>
  <div class="pp__row">
    <span class="pp__glabel">本文</span>
    <div class="pp__chips" role="group" aria-label="本文書体を選ぶ">
      <button class="pp__chip pp__chip--sans is-on" type="button" data-row="body" aria-pressed="true"><span class="pp__spec" aria-hidden="true">Aa</span>サンセリフ</button>
      <button class="pp__chip pp__chip--serif" type="button" data-row="body" aria-pressed="false"><span class="pp__spec" aria-hidden="true">Aa</span>セリフ</button>
      <button class="pp__chip pp__chip--mono" type="button" data-row="body" aria-pressed="false"><span class="pp__spec" aria-hidden="true">Aa</span>モノ</button>
      <button class="pp__chip pp__chip--wide" type="button" data-row="body" aria-pressed="false"><span class="pp__spec" aria-hidden="true">Aa</span>ワイドサンセリフ</button>
    </div>
  </div>
  <div class="pp__knobs">
    <button class="pp__ital" id="ital" type="button" aria-pressed="false">イタリック</button>
    <label class="pp__knob">字間
      <input class="pp__range" id="ls" type="range" min="-0.02" max="0.12" step="0.01" value="0" aria-label="見出しの字間">
      <output class="pp__kval" id="lsVal">0.00em</output>
    </label>
    <label class="pp__knob">行間
      <input class="pp__range" id="lh" type="range" min="1.2" max="2" step="0.1" value="1.5" aria-label="本文の行間">
      <output class="pp__kval" id="lhVal">1.5</output>
    </label>
  </div>
  <div class="pp__sample">
    <h2 class="pp__head" id="head">春風の便り</h2>
    <p class="pp__body" id="body"><span class="pp__b1">見出しと本文がひとつの声を出すと、ページは静かになります。</span><br><span class="pp__b2">組み合わせが合うかは3行読めば分かります。</span></p>
  </div>
  <p class="pp__note">2つのチップ行でそれぞれ選ぶと組み合わせがすぐ描画されます</p>
</div>
</main>
<script>
var pp = document.getElementById('pp');
var head = document.getElementById('head');
var body = document.getElementById('body');
var ital = document.getElementById('ital');
var ls = document.getElementById('ls');
var lh = document.getElementById('lh');
var lsVal = document.getElementById('lsVal');
var lhVal = document.getElementById('lhVal');

// 칩은 제 저마다 해당 서체로 그 이름을 쓰고 있다 — 컴퓨티드 font-family 를 그대로 견본에 옮긴다
function stack(btn) { return getComputedStyle(btn).fontFamily; }

function pick(btn) {
  pp.classList.remove('is-demo');
  var target = btn.getAttribute('data-row') === 'head' ? head : body;
  target.style.fontFamily = stack(btn);
  var row = btn.parentNode;
  var chips = row.querySelectorAll('.pp__chip');
  for (var i = 0; i < chips.length; i++) {
    var on = chips[i] === btn;
    chips[i].classList.toggle('is-on', on);
    chips[i].setAttribute('aria-pressed', on ? 'true' : 'false');
  }
}
var allChips = document.querySelectorAll('.pp__chip');
for (var i = 0; i < allChips.length; i++) {
  allChips[i].addEventListener('click', function () { pick(this); });
}

ital.addEventListener('click', function () {
  pp.classList.remove('is-demo');
  var on = ital.getAttribute('aria-pressed') !== 'true';
  ital.setAttribute('aria-pressed', on ? 'true' : 'false');
  ital.classList.toggle('is-on', on);
  head.style.fontStyle = on ? 'italic' : 'normal';
});

ls.addEventListener('input', function () {
  pp.classList.remove('is-demo');
  head.style.letterSpacing = ls.value + 'em';
  lsVal.textContent = Number(ls.value).toFixed(2) + 'em';
});
lh.addEventListener('input', function () {
  pp.classList.remove('is-demo');
  body.style.lineHeight = lh.value;
  lhVal.textContent = lh.value;
});
</script>
</body>
</html>
