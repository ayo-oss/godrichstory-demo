<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ドロップキャップと引用の飾り — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dq is-demo is-cap" id="dq">
  <div class="dq__bar">
    <span class="dq__badge" id="badge">float 経路</span>
    <div class="dq__sizes" role="group" aria-label="ドロップキャップの行数">
      <button class="dq__size" type="button" data-lines="2" aria-pressed="false">2行</button>
      <button class="dq__size is-on" type="button" data-lines="3" aria-pressed="true">3行</button>
      <button class="dq__size" type="button" data-lines="4" aria-pressed="false">4行</button>
    </div>
    <button class="dq__cap" id="capBtn" type="button" aria-pressed="true">ドロップキャップ</button>
  </div>
  <div class="dq__board">
    <article class="dq__card dq__card--short">
      <span class="dq__label">短い引用</span>
      <p class="dq__text">良いタイポグラフィは目立ちません。</p>
    </article>
    <article class="dq__card">
      <span class="dq__label">長い引用</span>
      <p class="dq__text">活字はインクではなく光で作られる。文字の間の余白が読む速さを決め、行が合う間隔がページの呼吸を作る。だから最初の一文字を大きくする作業も定規で測ったように正確でなければならない。</p>
    </article>
  </div>
  <p class="dq__note">チップで行数を選び、ドロップキャップボタンでオン・オフします</p>
</div>
</main>
<script>
var dq = document.getElementById('dq');
var capBtn = document.getElementById('capBtn');
var badge = document.getElementById('badge');

// initial-letter 를 아는 브라우저는 그 경로로 넘어간다 — 배지가 어느 쪽인지 알려 준다
if (window.CSS && CSS.supports && CSS.supports('(initial-letter: 3)')) {
  badge.textContent = 'initial-letter 経路';
}

capBtn.addEventListener('click', function () {
  dq.classList.remove('is-demo');
  var on = dq.classList.toggle('is-cap');
  capBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
});

var sizes = document.querySelectorAll('.dq__size');
for (var i = 0; i < sizes.length; i++) {
  sizes[i].addEventListener('click', function () {
    dq.classList.remove('is-demo');
    dq.style.setProperty('--cap-lines', this.getAttribute('data-lines'));
    for (var j = 0; j < sizes.length; j++) {
      var on = sizes[j] === this;
      sizes[j].classList.toggle('is-on', on);
      sizes[j].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  });
}
</script>
</body>
</html>
