<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드롭캡과 인용문 꾸미기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dq is-demo is-cap" id="dq">
  <div class="dq__bar">
    <span class="dq__badge" id="badge">float 경로</span>
    <div class="dq__sizes" role="group" aria-label="드롭캡 줄수">
      <button class="dq__size" type="button" data-lines="2" aria-pressed="false">2줄</button>
      <button class="dq__size is-on" type="button" data-lines="3" aria-pressed="true">3줄</button>
      <button class="dq__size" type="button" data-lines="4" aria-pressed="false">4줄</button>
    </div>
    <button class="dq__cap" id="capBtn" type="button" aria-pressed="true">드롭캡</button>
  </div>
  <div class="dq__board">
    <article class="dq__card dq__card--short">
      <span class="dq__label">짧은 인용</span>
      <p class="dq__text">좋은 타이포그래피는 눈에 띄지 않습니다.</p>
    </article>
    <article class="dq__card">
      <span class="dq__label">긴 인용</span>
      <p class="dq__text">활자는 잉크가 아니라 빛으로 만든다. 글자 사이의 여백이 읽는 속도를 정하고, 행이 만나는 간격이 페이지의 숨을 만든다. 그래서 첫 글자 하나를 키우는 일도 자로 잰 듯 정확해야 한다.</p>
    </article>
  </div>
  <p class="dq__note">칩으로 줄수를 고르고 드롭캡 버튼으로 켜고 끕니다</p>
</div>
</main>
<script>
var dq = document.getElementById('dq');
var capBtn = document.getElementById('capBtn');
var badge = document.getElementById('badge');

// initial-letter 를 아는 브라우저는 그 경로로 넘어간다 — 배지가 어느 쪽인지 알려 준다
if (window.CSS && CSS.supports && CSS.supports('(initial-letter: 3)')) {
  badge.textContent = 'initial-letter 경로';
}

capBtn.addEventListener('click', function () {
  dq.classList.remove('is-demo');
  var on = dq.classList.toggle('is-cap');
  capBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
});

var sizes = document.querySelectorAll('.dq__size');
for (var i = 0; i < sizes.length; i++) {
  sizes[i].addEventListener('click', function () {
    dq.classList.remove('is-demo');
    dq.style.setProperty('--cap-lines', this.getAttribute('data-lines'));
    for (var j = 0; j < sizes.length; j++) {
      var on = sizes[j] === this;
      sizes[j].classList.toggle('is-on', on);
      sizes[j].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  });
}
</script>
</body>
</html>
