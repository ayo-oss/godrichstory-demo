<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시스템 서체 스택 비교 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="fs is-demo" id="fs" aria-label="시스템 서체 스택 비교">
  <div class="fs__tabs">
    <button class="fs__tab" type="button" aria-pressed="true">한글</button>
    <button class="fs__tab" type="button" aria-pressed="false">영문</button>
    <button class="fs__tab" type="button" aria-pressed="false">혼합</button>
  </div>
  <div class="fs__grid">
    <article class="fs__pane">
      <header class="fs__head">
        <span class="fs__chip">SERIF</span>
        <span class="fs__mark" aria-hidden="true"></span>
      </header>
      <p class="fs__spec fs__spec--serif" id="specSerif">동해물과 백두산이</p>
      <p class="fs__stack">ui-serif · Georgia</p>
    </article>
    <article class="fs__pane">
      <header class="fs__head">
        <span class="fs__chip">SANS</span>
        <span class="fs__mark" aria-hidden="true"></span>
      </header>
      <p class="fs__spec fs__spec--sans" id="specSans">동해물과 백두산이</p>
      <p class="fs__stack">system-ui · Segoe UI</p>
    </article>
    <article class="fs__pane">
      <header class="fs__head">
        <span class="fs__chip">MONO</span>
        <span class="fs__mark" aria-hidden="true"></span>
      </header>
      <p class="fs__spec fs__spec--mono" id="specMono">동해물과 백두산이</p>
      <p class="fs__stack">ui-monospace · Consolas</p>
    </article>
  </div>
  <p class="fs__note">버튼으로 표본 문장을 바꿔 보세요</p>
</section>
</main>
<script>
var fs = document.getElementById('fs');
var tabs = Array.prototype.slice.call(document.querySelectorAll('.fs__tab'));
var specs = Array.prototype.slice.call(document.querySelectorAll('.fs__spec'));
var SAMPLES = ['동해물과 백두산이', 'Hello Type 0123', 'CSS 타이포 2026'];
// 탭을 누르면 세 판의 표본 문장이 한꺼번에 갈아 입는다 — 미리보기 루프는 여기서 뗀다
tabs.forEach(function (tab, i) {
  tab.addEventListener('click', function () {
    fs.classList.remove('is-demo');
    tabs.forEach(function (t) { t.setAttribute('aria-pressed', String(t === tab)); });
    specs.forEach(function (spec) { spec.textContent = SAMPLES[i]; });
  });
});
fs.addEventListener('pointerdown', function () { fs.classList.remove('is-demo'); });
</script>
</body>
</html>
