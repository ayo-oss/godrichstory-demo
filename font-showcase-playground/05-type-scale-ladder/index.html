<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제목 스케일 사다리 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ts is-demo is-b" id="ts">
  <div class="ts__bar" role="group" aria-label="비율 고르기">
    <button class="ts__pick" type="button" data-key="a" data-ratio="1.125" aria-pressed="false">1.125</button>
    <button class="ts__pick" type="button" data-key="b" data-ratio="1.25" aria-pressed="true">1.25</button>
    <button class="ts__pick" type="button" data-key="c" data-ratio="1.333" aria-pressed="false">1.333</button>
  </div>
  <ul class="ts__ladder" id="ladder">
    <li class="ts__rung ts__rung--5"><span class="ts__glyph">다섯째 단</span><span class="ts__px" data-step="4"></span></li>
    <li class="ts__rung ts__rung--4"><span class="ts__glyph">넷째 단</span><span class="ts__px" data-step="3"></span></li>
    <li class="ts__rung ts__rung--3"><span class="ts__glyph">셋째 단</span><span class="ts__px" data-step="2"></span></li>
    <li class="ts__rung ts__rung--2"><span class="ts__glyph">둘째 단</span><span class="ts__px" data-step="1"></span></li>
    <li class="ts__rung ts__rung--1"><span class="ts__glyph">본문 한 단</span><span class="ts__px" data-step="0"></span></li>
  </ul>
  <span class="ts__beam" aria-hidden="true"></span>
</div>
</main>
<script>
var ts = document.getElementById('ts');
var ladder = document.getElementById('ladder');
var picks = ts.querySelectorAll('.ts__pick');
var boxes = ts.querySelectorAll('.ts__px');
var BASE = 11;
var RATIOS = { a: 1.125, b: 1.25, c: 1.333 };
// 단의 크기는 CSS 가 calc() 사슬로 계산한다. 라벨 숫자는 같은 식을 JS 로 한 번 더 풀어 toFixed 로 적는다.
// 세 비율의 값을 처음에 다 적어 두므로, 미리보기 루프가 비율을 바꿔도 화면 숫자가 따로 놀지 않는다
function buildLabels() {
  boxes.forEach(function (box) {
    var step = Number(box.getAttribute('data-step'));
    Object.keys(RATIOS).forEach(function (key) {
      var v = document.createElement('span');
      v.className = 'ts__v ts__v--' + key;
      v.textContent = (BASE * Math.pow(RATIOS[key], step)).toFixed(1) + 'px';
      box.appendChild(v);
    });
  });
}
function choose(key) {
  ladder.style.setProperty('--ratio', String(RATIOS[key]));
  ts.classList.remove('is-a', 'is-b', 'is-c');
  ts.classList.add('is-' + key);
  picks.forEach(function (b) {
    b.setAttribute('aria-pressed', b.getAttribute('data-key') === key ? 'true' : 'false');
  });
}
picks.forEach(function (b) {
  b.addEventListener('click', function () {
    ts.classList.remove('is-demo');
    choose(b.getAttribute('data-key'));
  });
});
buildLabels();
choose('b');
</script>
</body>
</html>
