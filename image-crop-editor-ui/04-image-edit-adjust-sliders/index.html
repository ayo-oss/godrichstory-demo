<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>톤 조절 슬라이더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ad is-demo" id="ad">
  <div class="ad__frame">
    <canvas class="ad__view" id="view" width="320" height="200" role="img" aria-label="샘플 사진"></canvas>
    <span class="ad__ghost" aria-hidden="true"></span>
    <span class="ad__orig" aria-hidden="true"></span>
    <span class="ad__tag">
      <span class="ad__real" id="tag">보정 후</span>
      <span class="ad__tagDemo ad__tagDemo--edit" aria-hidden="true">보정 후</span>
      <span class="ad__tagDemo ad__tagDemo--orig" aria-hidden="true">원본</span>
    </span>
  </div>
  <div class="ad__ctl">
    <div class="ad__s">
      <span class="ad__lab" id="labB">밝기</span>
      <div class="ad__track" data-k="b" role="slider" tabindex="0" aria-labelledby="labB" aria-valuemin="0.5" aria-valuemax="1.5" aria-valuenow="1"><span class="ad__thumb" id="thB"></span></div>
    </div>
    <div class="ad__s">
      <span class="ad__lab" id="labC">대비</span>
      <div class="ad__track" data-k="c" role="slider" tabindex="0" aria-labelledby="labC" aria-valuemin="0.5" aria-valuemax="1.5" aria-valuenow="1"><span class="ad__thumb" id="thC"></span></div>
    </div>
    <div class="ad__s">
      <span class="ad__lab" id="labS">채도</span>
      <div class="ad__track" data-k="s" role="slider" tabindex="0" aria-labelledby="labS" aria-valuemin="0.5" aria-valuemax="1.5" aria-valuenow="1"><span class="ad__thumb" id="thS"></span></div>
    </div>
  </div>
  <div class="ad__foot">
    <button type="button" class="ad__btn" id="resetBtn">초기화</button>
    <button type="button" class="ad__btn ad__btn--ab" id="abBtn" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="ad__ico" aria-hidden="true"><g fill="currentColor"><path d="M80 136a24 24 0 1 1-24-24a24 24 0 0 1 24 24m48-72a24 24 0 1 0 24 24a24 24 0 0 0-24-24m72 80a24 24 0 1 0 24 24a24 24 0 0 0-24-24" opacity=".2"/><path d="M64 105V40a8 8 0 0 0-16 0v65a32 32 0 0 0 0 62v49a8 8 0 0 0 16 0v-49a32 32 0 0 0 0-62m-8 47a16 16 0 1 1 16-16a16 16 0 0 1-16 16m80-95V40a8 8 0 0 0-16 0v17a32 32 0 0 0 0 62v97a8 8 0 0 0 16 0v-97a32 32 0 0 0 0-62m-8 47a16 16 0 1 1 16-16a16 16 0 0 1-16 16m104 64a32.06 32.06 0 0 0-24-31V40a8 8 0 0 0-16 0v97a32 32 0 0 0 0 62v17a8 8 0 0 0 16 0v-17a32.06 32.06 0 0 0 24-31m-32 16a16 16 0 1 1 16-16a16 16 0 0 1-16 16"/></g></svg><span>비교</span></button>
    <span class="ad__codes">
      <code class="ad__realCode" id="code">brightness(1.00) contrast(1.00) saturate(1.00)</code>
      <code class="ad__demoCode ad__demoCode--a" aria-hidden="true">brightness(1.00) contrast(1.00) saturate(1.00)</code>
      <code class="ad__demoCode ad__demoCode--b" aria-hidden="true">brightness(1.18) contrast(1.22) saturate(1.30)</code>
    </span>
  </div>
</div>
</main>
<script>
var ad = document.getElementById('ad');
var view = document.getElementById('view');
var tag = document.getElementById('tag');
var code = document.getElementById('code');
var abBtn = document.getElementById('abBtn');
var tracks = document.querySelectorAll('.ad__track');
var thumbs = { b: document.getElementById('thB'), c: document.getElementById('thC'), s: document.getElementById('thS') };
var value = { b: 1, c: 1, s: 1 };
var showOriginal = false;
var VOICE = '%v배';
var TAG_EDIT = '보정 후';
var TAG_ORIG = '원본';

// 가짜 사진 — 외부 파일 없이 그라디언트와 도형으로 합성한다. 필터·히스토그램이 보이도록 대비를 세게 준다
function paintPhoto(c, w, h) {
  var sky = c.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#2f6df6'); sky.addColorStop(0.55, '#ff9ebb'); sky.addColorStop(1, '#ffd23f');
  c.fillStyle = sky; c.fillRect(0, 0, w, h);
  c.fillStyle = '#fff7e6';
  c.beginPath(); c.arc(w * 0.74, h * 0.28, h * 0.13, 0, Math.PI * 2); c.fill();
  // 곧은 수평선 하나 — 기울기 보정이 눈에 보이려면 비교할 직선이 있어야 한다
  c.fillStyle = 'rgba(23, 20, 26, 0.5)'; c.fillRect(0, Math.round(h * 0.66), w, 2);
  c.fillStyle = '#17141a';
  c.beginPath(); c.moveTo(0, h); c.lineTo(w * 0.34, h * 0.36); c.lineTo(w * 0.62, h); c.closePath(); c.fill();
  c.fillStyle = '#c2361a';
  c.beginPath(); c.moveTo(w * 0.46, h); c.lineTo(w * 0.78, h * 0.52); c.lineTo(w, h); c.closePath(); c.fill();
  for (var i = 0; i < 6; i++) { c.fillStyle = i % 2 ? '#fff7e6' : '#17141a'; c.fillRect(w * (0.08 + i * 0.07), h * (0.14 + (i % 3) * 0.06), 7, 7); }
}

function render() {
  // 슬라이더 셋이 filter 문자열 하나로 합쳐진다 — 순서가 곧 적용 순서다
  var chain = 'brightness(' + value.b.toFixed(2) + ') contrast(' + value.c.toFixed(2) + ') saturate(' + value.s.toFixed(2) + ')';
  view.style.filter = showOriginal ? 'none' : chain;
  code.textContent = chain;
  tag.textContent = showOriginal ? TAG_ORIG : TAG_EDIT;
  for (var i = 0; i < tracks.length; i++) {
    var key = tracks[i].getAttribute('data-k'), v = value[key];
    thumbs[key].style.left = ((v - 0.5) * 100) + '%';
    tracks[i].setAttribute('aria-valuenow', v.toFixed(2));
    tracks[i].setAttribute('aria-valuetext', VOICE.replace('%v', v.toFixed(2)));
  }
}

function setValue(key, next) {
  value[key] = Math.max(0.5, Math.min(1.5, Math.round(next * 100) / 100));
  ad.classList.remove('is-demo');
  render();
}

for (var i = 0; i < tracks.length; i++) {
  (function (el) {
    var key = el.getAttribute('data-k');
    function fromPointer(e) {
      var r = el.getBoundingClientRect();
      setValue(key, (e.clientX - r.left) / r.width + 0.5);
    }
    el.addEventListener('pointerdown', function (e) { el.setPointerCapture(e.pointerId); fromPointer(e); });
    el.addEventListener('pointermove', function (e) { if (e.buttons) { fromPointer(e); } });
    // 화살표 0.02, Shift 와 함께면 0.1 — 눈으로 맞추기 어려운 미세 보정은 키보드가 낫다
    el.addEventListener('keydown', function (e) {
      var step = e.shiftKey ? 0.1 : 0.02;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); setValue(key, value[key] - step); }
      else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); setValue(key, value[key] + step); }
    });
  })(tracks[i]);
}

document.getElementById('resetBtn').addEventListener('click', function () {
  value.b = 1; value.c = 1; value.s = 1; showOriginal = false;
  abBtn.setAttribute('aria-pressed', 'false');
  ad.classList.remove('is-demo'); render();
});
abBtn.addEventListener('click', function () {
  showOriginal = !showOriginal;
  abBtn.setAttribute('aria-pressed', showOriginal ? 'true' : 'false');
  ad.classList.remove('is-demo'); render();
});

paintPhoto(view.getContext('2d'), view.width, view.height);
document.documentElement.style.setProperty('--photo', 'url(' + view.toDataURL() + ')');
render();
</script>
</body>
</html>
