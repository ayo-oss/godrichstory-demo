<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이미지 반전 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fm is-demo" id="fm">
  <div class="fm__frame">
    <canvas class="fm__view" id="view" width="320" height="200" role="img" aria-label="샘플 사진"></canvas>
    <span class="fm__ghost" aria-hidden="true"></span>
    <span class="fm__axis" aria-hidden="true"></span>
    <span class="fm__sweep" aria-hidden="true"></span>
  </div>
  <div class="fm__foot">
    <button type="button" class="fm__btn fm__btn--x" id="xBtn" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="fm__ico" aria-hidden="true"><g fill="currentColor"><path d="M112 40v160a8 8 0 0 1-8 8H40a8 8 0 0 1-7.37-11.12l64-160C100 28.86 112 31.29 112 40" opacity=".2"/><path d="M107.18 24.33a15.86 15.86 0 0 0-17.92 9.45l-.06.14l-64 159.93A16 16 0 0 0 40 216h64a16 16 0 0 0 16-16V40a15.85 15.85 0 0 0-12.82-15.67M104 200H40l.06-.15L104 40Zm126.77-6.15l-64-159.93l-.06-.14A16 16 0 0 0 136 40v160a16 16 0 0 0 16 16h64a16 16 0 0 0 14.78-22.15ZM152 200V40l63.93 159.84l.06.15Z"/></g></svg><span>좌우 뒤집기</span></button>
    <button type="button" class="fm__btn fm__btn--y" id="yBtn" aria-pressed="false"><span>상하 뒤집기</span></button>
    <span class="fm__codes">
      <code class="fm__real" id="code">scale(1, 1)</code>
      <code class="fm__demo fm__demo--a" aria-hidden="true">scale(1, 1)</code>
      <code class="fm__demo fm__demo--b" aria-hidden="true">scale(-1, 1)</code>
      <code class="fm__demo fm__demo--c" aria-hidden="true">scale(-1, -1)</code>
      <code class="fm__demo fm__demo--d" aria-hidden="true">scale(1, -1)</code>
    </span>
  </div>
</div>
</main>
<script>
var fm = document.getElementById('fm');
var view = document.getElementById('view');
var code = document.getElementById('code');
var xBtn = document.getElementById('xBtn');
var yBtn = document.getElementById('yBtn');
var vctx = view.getContext('2d');
var src = document.createElement('canvas');
var flipX = false, flipY = false;
var VIEW_LABEL = '미리보기, 가로 %x 세로 %y';
var ON = '뒤집음';
var OFF = '그대로';

// 가짜 사진 — 외부 파일 없이 그라디언트와 도형으로 합성한다. 필터·히스토그램이 보이도록 대비를 세게 준다
function paintPhoto(c, w, h) {
  var sky = c.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#2f6df6'); sky.addColorStop(0.55, '#ff9ebb'); sky.addColorStop(1, '#ffd23f');
  c.fillStyle = sky; c.fillRect(0, 0, w, h);
  c.fillStyle = '#fff7e6';
  c.beginPath(); c.arc(w * 0.74, h * 0.28, h * 0.13, 0, Math.PI * 2); c.fill();
  // 곧은 수평선 하나 — 기울기 보정이 눈에 보이려면 비교할 직선이 있어야 한다
  c.fillStyle = 'rgba(23, 20, 26, 0.5)'; c.fillRect(0, Math.round(h * 0.66), w, 2);
  c.fillStyle = '#17141a';
  c.beginPath(); c.moveTo(0, h); c.lineTo(w * 0.34, h * 0.36); c.lineTo(w * 0.62, h); c.closePath(); c.fill();
  c.fillStyle = '#c2361a';
  c.beginPath(); c.moveTo(w * 0.46, h); c.lineTo(w * 0.78, h * 0.52); c.lineTo(w, h); c.closePath(); c.fill();
  for (var i = 0; i < 6; i++) { c.fillStyle = i % 2 ? '#fff7e6' : '#17141a'; c.fillRect(w * (0.08 + i * 0.07), h * (0.14 + (i % 3) * 0.06), 7, 7); }
}

function render() {
  var w = view.width, h = view.height;
  vctx.setTransform(1, 0, 0, 1, 0, 0);
  vctx.clearRect(0, 0, w, h);
  // 축을 음수로 뒤집으면 그림이 화면 밖으로 나가므로 그만큼 먼저 밀어 놓는다
  vctx.translate(flipX ? w : 0, flipY ? h : 0);
  vctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
  vctx.drawImage(src, 0, 0, w, h);
  code.textContent = 'scale(' + (flipX ? -1 : 1) + ', ' + (flipY ? -1 : 1) + ')';
  xBtn.setAttribute('aria-pressed', flipX ? 'true' : 'false');
  yBtn.setAttribute('aria-pressed', flipY ? 'true' : 'false');
  view.setAttribute('aria-label', VIEW_LABEL.replace('%x', flipX ? ON : OFF).replace('%y', flipY ? ON : OFF));
}

xBtn.addEventListener('click', function () { flipX = !flipX; fm.classList.remove('is-demo'); render(); });
yBtn.addEventListener('click', function () { flipY = !flipY; fm.classList.remove('is-demo'); render(); });

src.width = 320; src.height = 200;
paintPhoto(src.getContext('2d'), src.width, src.height);
document.documentElement.style.setProperty('--photo', 'url(' + src.toDataURL() + ')');
render();
</script>
</body>
</html>
