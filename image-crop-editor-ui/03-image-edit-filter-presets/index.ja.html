<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フィルタープリセット — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fp is-demo" id="fp">
  <div class="fp__frame">
    <canvas class="fp__view" id="view" width="320" height="200" role="img" aria-label="プレビュー写真、フィルターなし"></canvas>
    <span class="fp__ghost" aria-hidden="true"></span>
  </div>
  <div class="fp__row" id="row">
    <span class="fp__ring" aria-hidden="true"></span>
    <button type="button" class="fp__p" data-f="none" aria-pressed="true"><span class="fp__sw fp__sw--a" aria-hidden="true"></span><span class="fp__name">元画像</span></button>
    <button type="button" class="fp__p" data-f="grayscale(1) contrast(1.08)" aria-pressed="false"><span class="fp__sw fp__sw--b" aria-hidden="true"></span><span class="fp__name">モノクロ</span></button>
    <button type="button" class="fp__p" data-f="sepia(0.75) saturate(1.2)" aria-pressed="false"><span class="fp__sw fp__sw--c" aria-hidden="true"></span><span class="fp__name">セピア</span></button>
    <button type="button" class="fp__p" data-f="contrast(1.3) saturate(1.35)" aria-pressed="false"><span class="fp__sw fp__sw--d" aria-hidden="true"></span><span class="fp__name">くっきり</span></button>
    <button type="button" class="fp__p" data-f="saturate(0.55) brightness(1.08)" aria-pressed="false"><span class="fp__sw fp__sw--e" aria-hidden="true"></span><span class="fp__name">落ち着き</span></button>
    <button type="button" class="fp__p" data-f="sepia(0.4) contrast(0.9) hue-rotate(-14deg)" aria-pressed="false"><span class="fp__sw fp__sw--f" aria-hidden="true"></span><span class="fp__name">ビンテージ</span></button>
  </div>
  <p class="fp__code">
    <code class="fp__real" id="code">filter: none;</code>
    <code class="fp__demo fp__demo--a" aria-hidden="true">filter: none;</code>
    <code class="fp__demo fp__demo--b" aria-hidden="true">filter: grayscale(1) contrast(1.08);</code>
    <code class="fp__demo fp__demo--c" aria-hidden="true">filter: sepia(0.75) saturate(1.2);</code>
    <code class="fp__demo fp__demo--d" aria-hidden="true">filter: contrast(1.3) saturate(1.35);</code>
    <code class="fp__demo fp__demo--e" aria-hidden="true">filter: saturate(0.55) brightness(1.08);</code>
    <code class="fp__demo fp__demo--f" aria-hidden="true">filter: sepia(0.4) contrast(0.9) hue-rotate(-14deg);</code>
  </p>
</div>
</main>
<script>
var fp = document.getElementById('fp');
var view = document.getElementById('view');
var code = document.getElementById('code');
var ring = document.querySelector('.fp__ring');
var presets = document.querySelectorAll('.fp__p');
var VIEW_LABEL = 'プレビュー写真、フィルター %n';

// 가짜 사진 — 외부 파일 없이 그라디언트와 도형으로 합성한다. 필터·히스토그램이 보이도록 대비를 세게 준다
function paintPhoto(c, w, h) {
  var sky = c.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#2f6df6'); sky.addColorStop(0.55, '#ff9ebb'); sky.addColorStop(1, '#ffd23f');
  c.fillStyle = sky; c.fillRect(0, 0, w, h);
  c.fillStyle = '#fff7e6';
  c.beginPath(); c.arc(w * 0.74, h * 0.28, h * 0.13, 0, Math.PI * 2); c.fill();
  // 곧은 수평선 하나 — 기울기 보정이 눈에 보이려면 비교할 직선이 있어야 한다
  c.fillStyle = 'rgba(23, 20, 26, 0.5)'; c.fillRect(0, Math.round(h * 0.66), w, 2);
  c.fillStyle = '#17141a';
  c.beginPath(); c.moveTo(0, h); c.lineTo(w * 0.34, h * 0.36); c.lineTo(w * 0.62, h); c.closePath(); c.fill();
  c.fillStyle = '#c2361a';
  c.beginPath(); c.moveTo(w * 0.46, h); c.lineTo(w * 0.78, h * 0.52); c.lineTo(w, h); c.closePath(); c.fill();
  for (var i = 0; i < 6; i++) { c.fillStyle = i % 2 ? '#fff7e6' : '#17141a'; c.fillRect(w * (0.08 + i * 0.07), h * (0.14 + (i % 3) * 0.06), 7, 7); }
}

function pick(index) {
  var el = presets[index], chain = el.getAttribute('data-f');
  fp.classList.remove('is-demo');
  for (var i = 0; i < presets.length; i++) { presets[i].setAttribute('aria-pressed', i === index ? 'true' : 'false'); }
  // 사진에는 CSS filter 를 そのまま 걸고, 같은 문자열을 아래 칸에 글자로 내보낸다
  view.style.filter = chain;
  code.textContent = 'filter: ' + chain + ';';
  ring.style.transform = 'translateX(' + index * 100 + '%)';
  view.setAttribute('aria-label', VIEW_LABEL.replace('%n', el.querySelector('.fp__name').textContent));
}

for (var i = 0; i < presets.length; i++) {
  (function (index) { presets[index].addEventListener('click', function () { pick(index); }); })(i);
}

paintPhoto(view.getContext('2d'), view.width, view.height);
document.documentElement.style.setProperty('--photo', 'url(' + view.toDataURL() + ')');
</script>
</body>
</html>
