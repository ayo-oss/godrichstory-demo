<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge fill — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sq is-demo" id="sq">
  <p class="sq__cap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="sq__ico" aria-hidden="true"><g fill="currentColor"><path d="M224 56v144a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V56a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8" opacity=".2"/><path d="M200 80v32a8 8 0 0 1-16 0V88h-24a8 8 0 0 1 0-16h32a8 8 0 0 1 8 8M96 168H72v-24a8 8 0 0 0-16 0v32a8 8 0 0 0 8 8h32a8 8 0 0 0 0-16M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16m-16 144V56H40v144z"/></g></svg><span>Fit to square</span></p>
  <div class="sq__frame">
    <canvas class="sq__out" id="out" width="240" height="240" role="img" aria-label="Square result"></canvas>
    <span class="sq__ghost" aria-hidden="true"><span class="sq__ghostImg"></span></span>
  </div>
  <div class="sq__row">
    <button type="button" class="sq__c sq__c--paper" data-bg="#ffffff" aria-label="White background" aria-pressed="true"></button>
    <button type="button" class="sq__c sq__c--ink" data-bg="#17141a" aria-label="Ink background" aria-pressed="false"></button>
    <button type="button" class="sq__c sq__c--cream" data-bg="#fff7e6" aria-label="Cream background" aria-pressed="false"></button>
    <button type="button" class="sq__c sq__c--blue" data-bg="#2f6df6" aria-label="Blue background" aria-pressed="false"></button>
    <span class="sq__pad">
      <span class="sq__lab" id="padLab">Padding</span>
      <span class="sq__track" id="track" role="slider" tabindex="0" aria-labelledby="padLab" aria-valuemin="0" aria-valuemax="20" aria-valuenow="8"><span class="sq__thumb" id="thumb"></span></span>
    </span>
  </div>
</div>
</main>
<script>
var sq = document.getElementById('sq');
var out = document.getElementById('out');
var track = document.getElementById('track');
var thumb = document.getElementById('thumb');
var octx = out.getContext('2d');
var src = document.createElement('canvas');
var swatches = document.querySelectorAll('.sq__c');
var bg = '#ffffff', pad = 0.08;
var VOICE = '%p percent';

// 가짜 사진 — 외부 파일 없이 그라디언트와 도형으로 합성한다. 필터·히스토그램이 보이도록 대비를 세게 준다
function paintPhoto(c, w, h) {
  var sky = c.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#2f6df6'); sky.addColorStop(0.55, '#ff9ebb'); sky.addColorStop(1, '#ffd23f');
  c.fillStyle = sky; c.fillRect(0, 0, w, h);
  c.fillStyle = '#fff7e6';
  c.beginPath(); c.arc(w * 0.74, h * 0.28, h * 0.13, 0, Math.PI * 2); c.fill();
  // 곧은 수평선 하나 — 기울기 보정이 눈에 보이려면 비교할 직선이 있어야 한다
  c.fillStyle = 'rgba(23, 20, 26, 0.5)'; c.fillRect(0, Math.round(h * 0.66), w, 2);
  c.fillStyle = '#17141a';
  c.beginPath(); c.moveTo(0, h); c.lineTo(w * 0.34, h * 0.36); c.lineTo(w * 0.62, h); c.closePath(); c.fill();
  c.fillStyle = '#c2361a';
  c.beginPath(); c.moveTo(w * 0.46, h); c.lineTo(w * 0.78, h * 0.52); c.lineTo(w, h); c.closePath(); c.fill();
  for (var i = 0; i < 6; i++) { c.fillStyle = i % 2 ? '#fff7e6' : '#17141a'; c.fillRect(w * (0.08 + i * 0.07), h * (0.14 + (i % 3) * 0.06), 7, 7); }
}

function render() {
  var s = out.width;
  // 먼저 정사각 전체를 고른 색으로 칠하고, 그 위에 사진을 가운데로 앉힌다
  octx.fillStyle = bg;
  octx.fillRect(0, 0, s, s);
  var inner = s * (1 - pad * 2);
  var k = Math.min(inner / src.width, inner / src.height);
  var dw = src.width * k, dh = src.height * k;
  octx.drawImage(src, (s - dw) / 2, (s - dh) / 2, dw, dh);
  thumb.style.left = (pad / 0.2 * 100) + '%';
  track.setAttribute('aria-valuenow', Math.round(pad * 100));
  track.setAttribute('aria-valuetext', VOICE.replace('%p', Math.round(pad * 100)));
}

function setPad(next) {
  pad = Math.max(0, Math.min(0.2, next));
  sq.classList.remove('is-demo');
  render();
}

for (var i = 0; i < swatches.length; i++) {
  (function (el) {
    el.addEventListener('click', function () {
      bg = el.getAttribute('data-bg');
      for (var j = 0; j < swatches.length; j++) { swatches[j].setAttribute('aria-pressed', swatches[j] === el ? 'true' : 'false'); }
      sq.classList.remove('is-demo'); render();
    });
  })(swatches[i]);
}

function fromPointer(e) {
  var r = track.getBoundingClientRect();
  setPad(Math.round((e.clientX - r.left) / r.width * 20) / 100);
}
track.addEventListener('pointerdown', function (e) { track.setPointerCapture(e.pointerId); fromPointer(e); });
track.addEventListener('pointermove', function (e) { if (e.buttons) { fromPointer(e); } });
// 화살표 1퍼센트, Shift 와 함께면 5퍼센트
track.addEventListener('keydown', function (e) {
  var step = e.shiftKey ? 0.05 : 0.01;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); setPad(pad - step); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); setPad(pad + step); }
});

src.width = 320; src.height = 200;
paintPhoto(src.getContext('2d'), src.width, src.height);
document.documentElement.style.setProperty('--photo', 'url(' + src.toDataURL() + ')');
render();
</script>
</body>
</html>
