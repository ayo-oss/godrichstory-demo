<!doctype html>
<html lang="en">
<head>

<title>A Split That Aims for Squares Instead of Long Strips — demo</title>

</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="Treemap stage: arrow keys move between cells, Enter picks, P pauses, N steps once, R restarts">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="Twelve identical values are laid out two ways: on the left, cells join a row while the worst ratio is re-measured and the row closes before it gets worse; on the right, one-direction slice strips. Cells pop in every 0.14 seconds, a mint outline sweeps each row on the left as it closes, and the corner number is the worst aspect ratio among cells shown so far. Once all have appeared, each row on the left and each strip on the right is covered with color in turn, then an outline breathes on the longest cell before everything fades and restarts"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">Treemap demo</p>
  <div class="vj__ctrl">
    <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
    <button class="vj__step" data-role="step" type="button">Step</button>
  </div>
  <p class="vj__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 끝에서 한 번 넘쳤다 돌아오는 곡선 — 칸이 자리에 튀어 나올 때
    function backOut(x) {
        const c = clamp(x, 0, 1) - 1;
        return 1 + 2.70158 * c * c * c + 1.70158 * c * c;
    }
    // 시드 고정 난수 — 선형 합동 생성기(곱 1664525, 더함 1013904223). 같은 시드면 같은 수열
    function seeded(seed) {
        let s = (seed >>> 0) || 1;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 파스텔 팔레트 — 칸은 연한 면, 글자는 늘 진한 잉크
    const BG_TOP = [248, 244, 252];
    const BG_BOT = [228, 234, 250];
    const BED = [226, 220, 242];
    const INK = [40, 36, 54];
    const INK2 = [66, 60, 90];
    const PAPER = [250, 246, 240];
    const NEUTRAL = [234, 232, 240];
    const ROSE = [244, 162, 186];
    const MINT = [148, 212, 182];
    const TILES = [
        [200, 190, 244], [168, 222, 200], [250, 228, 150], [246, 184, 200],
        [172, 208, 246], [250, 208, 170], [196, 222, 170], [222, 190, 240],
    ];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 장면 시계(초)·판 반복 번호·시간표 — 시간표는 (시각, 할 일) 목록이고 시각이 지나면 한 번씩 부른다
    let sceneT = 0;
    let lap = 0;
    let script = [];
    let evAt = 0;
    function inset(r, p) {
        return { x: r.x + p, y: r.y + p, w: Math.max(0, r.w - 2 * p), h: Math.max(0, r.h - 2 * p) };
    }
    function aspectOf(r) {
        if (r.w <= 1e-6 || r.h <= 1e-6) {
            return 99;
        }
        return r.w >= r.h ? r.w / r.h : r.h / r.w;
    }
    // 한 줄의 최악 가로세로 비 — areas 는 그 줄 칸들의 넓이, side 는 줄을 놓을 짧은 변의 길이
    function worstRow(areas, side) {
        let s = 0;
        let mx = 0;
        let mn = Infinity;
        for (const a of areas) {
            s += a;
            if (a > mx) {
                mx = a;
            }
            if (a < mn) {
                mn = a;
            }
        }
        const s2 = s * s;
        const d2 = side * side;
        return Math.max(d2 * mx / s2, s2 / (d2 * mn));
    }
    function squarify(vals, R) {
        const n = vals.length;
        const idx = [];
        let total = 0;
        for (let i = 0; i < n; i += 1) {
            idx.push(i);
            total += Math.max(vals[i], 1e-6);
        }
        idx.sort(function (a, b) { return vals[b] - vals[a] || a - b; });
        const k = R.w * R.h / total;
        const rects = [];
        const rowOf = [];
        for (let i = 0; i < n; i += 1) {
            rects.push({ x: R.x, y: R.y, w: 0, h: 0 });
            rowOf.push(0);
        }
        const rows = [];
        let rx = R.x;
        let ry = R.y;
        let rw = R.w;
        let rh = R.h;
        let at = 0;
        while (at < n) {
            const side = Math.max(Math.min(rw, rh), 1e-6);
            const row = [];
            const areas = [];
            let cur = Infinity;
            while (at < n) {
                const a = Math.max(vals[idx[at]], 1e-6) * k;
                const next = areas.slice();
                next.push(a);
                const wr = worstRow(next, side);
                if (areas.length > 0 && wr > cur) {
                    break;
                }
                areas.push(a);
                row.push(idx[at]);
                cur = wr;
                at += 1;
            }
            let s = 0;
            for (const a of areas) {
                s += a;
            }
            if (rw >= rh) {
                const cw = s / Math.max(rh, 1e-6);
                let y = ry;
                row.forEach(function (id, j) {
                    const h = areas[j] / Math.max(cw, 1e-6);
                    rects[id] = { x: rx, y: y, w: cw, h: h };
                    rowOf[id] = rows.length;
                    y += h;
                });
                rx += cw;
                rw -= cw;
            }
            else {
                const ch = s / Math.max(rw, 1e-6);
                let x = rx;
                row.forEach(function (id, j) {
                    const w = areas[j] / Math.max(ch, 1e-6);
                    rects[id] = { x: x, y: ry, w: w, h: ch };
                    rowOf[id] = rows.length;
                    x += w;
                });
                ry += ch;
                rh -= ch;
            }
            rows.push(row);
        }
        return { rects: rects, rowOf: rowOf, rows: rows };
    }
    // One direction slice — 줄을 나누지 않고 입력 순서대로 세로 띠로만 자른다
    function slice(vals, R) {
        let total = 0;
        for (const v of vals) {
            total += Math.max(v, 1e-6);
        }
        let x = R.x;
        return vals.map(function (v) {
            const w = R.w * Math.max(v, 1e-6) / total;
            const r = { x: x, y: R.y, w: w, h: R.h };
            x += w;
            return r;
        });
    }
    function worstAspect(rs) {
        let m = 1;
        for (const r of rs) {
            const a = aspectOf(r);
            if (a > m) {
                m = a;
            }
        }
        return m;
    }
    function meanAspect(rs) {
        let s = 0;
        for (const r of rs) {
            s += aspectOf(r);
        }
        return rs.length ? s / rs.length : 1;
    }
    // 스프링 — 네 변(왼·위·오른·아래)을 따로 목표로 끌어당긴다. k 는 스프링 상수, zeta 는 감쇠비
    function springStep(cur, vel, tgt, k, zeta, dt) {
        const c = 2 * zeta * Math.sqrt(k);
        const n = Math.max(1, Math.ceil(dt * 120));
        const h = dt / n;
        for (let s = 0; s < n; s += 1) {
            for (let j = 0; j < cur.length; j += 1) {
                vel[j] += (-k * (cur[j] - tgt[j]) - c * vel[j]) * h;
                cur[j] += vel[j] * h;
            }
        }
    }
    function edgesOf(r) { return [r.x, r.y, r.x + r.w, r.y + r.h]; }
    function rectOf(e) { return { x: e[0], y: e[1], w: e[2] - e[0], h: e[3] - e[1] }; }
    // ── 자체 가상 데이터 ──────────────────────────────────────
    const NAMES = [
        'Video', 'Photos', 'Music', 'Docs', 'Games', 'Apps', 'Backup', 'Mail', 'Cache', 'Logs', 'Tools', 'Config',
        'Fonts', 'Books', 'Maps', 'Translate', 'Sketch', 'Audio', 'Templates', 'Zips', 'Temp', 'Shared', 'Archive', 'Other',
    ];
    // 큰 순서로 놓인 값 24개
    const BASE = [34, 27, 22, 19, 16, 14, 12, 10, 9, 8, 7, 6, 5.5, 5, 4.4, 4, 3.4, 3, 2.6, 2.3, 2, 1.7, 1.5, 1.3];
    function leafOf(name, v) { return { name: name, v: v, kids: [] }; }
    function groupOf(name, kids) {
        let s = 0;
        for (const k of kids) {
            s += k.v;
        }
        return { name: name, v: s, kids: kids };
    }
    function sumOf(vals) { let s = 0; for (const v of vals) {
        s += v;
    } return s; }
    function pct(v, total) { return String(Math.round(v / total * 1000) / 10); }
    // ── 라벨 맞춤 ─────────────────────────────────────────────
    // 글자 너비는 문자 수 × 글자 크기 × CHAR_W 로 어림 — 한글 한 자가 글자 크기만큼 차지하니 CHAR_W 는 1
    const CHAR_W = 1;
    const FONT_MAX = 15;
    const FONT_STEP = 2;
    const HIDE_MIN = 8;
    function estW(s, px) { return s.length * px * CHAR_W; }
    // 칸 안쪽(양쪽 3px 여백)에 들어가는 가장 큰 글자 크기 — 최소 크기에서도 넘치면 0(감춤)
    function fitPx(s, r) {
        for (let px = FONT_MAX; px >= HIDE_MIN; px -= FONT_STEP) {
            if (estW(s, px) <= r.w - 6 && px * 1.3 <= r.h - 4) {
                return px;
            }
        }
        return 0;
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const stepEl = root.querySelector('[data-role="step"]');
    const doneEl = root.querySelector('[data-role="done"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !stepEl || !doneEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const stepBtn = stepEl;
    const doneP = doneEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 Fonts 목록만
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function skyFill(top, bot) {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bot, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function outline(x, y, w, h, r, width, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 글자 이름표 — 바탕 알약 위에 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    // 판 자리 — 왼쪽 판·오른쪽 판(대비판)·한 판짜리 히어로. 위쪽은 상태 줄·버튼 자리
    const PANEL_L = { x: 12, y: 78, w: 222, h: 208 };
    const PANEL_R = { x: 246, y: 78, w: 222, h: 208 };
    const PANEL_ONE = { x: 12, y: 60, w: 456, h: 228 };
    // 판 바닥 — 칸 사이 틈으로 비치는 연보라
    function bed(R) {
        box(R.x - 3, R.y - 3, R.w + 6, R.h + 6, 10, BED, 1);
    }
    function panelTags(a, b) {
        tag(a, PANEL_L.x + PANEL_L.w / 2, 66, INK, PAPER, 10, 'center');
        tag(b, PANEL_R.x + PANEL_R.w / 2, 66, PAPER, INK, 10, 'center');
    }
    // 칸 한 장 — 둥근 면과 윗면 하이라이트. pop 은 자리에 튀어 나오는 배율(1 이면 그대로)
    function tile(r, c, a, pop) {
        if (a <= 0 || pop <= 0) {
            return;
        }
        const cx = r.x + r.w / 2;
        const cy = r.y + r.h / 2;
        const w = Math.max(0, (r.w - 2) * pop);
        const h = Math.max(0, (r.h - 2) * pop);
        box(cx - w / 2, cy - h / 2, w, h, 5, c, a);
        if (h > 12 && w > 8) {
            box(cx - w / 2 + 2, cy - h / 2 + 1.5, w - 4, 2, 1, [255, 255, 255], 0.5 * a);
        }
    }
    // 칸 안 글자 — 맞는 크기가 있으면 이름(과 자리가 되면 아래 줄 부제), 없으면 감춘다
    function cellText(r, name, sub, a) {
        const px = fitPx(name, r);
        if (px === 0 || a <= 0) {
            return;
        }
        const cx = r.x + r.w / 2;
        const cy = r.y + r.h / 2;
        const two = sub !== '' && r.h >= px * 2.6 && estW(sub, px - 3) <= r.w - 6;
        text(name, cx, cy - (two ? px * 0.55 : 0), INK, a, px, 700, 'center');
        if (two) {
            text(sub, cx, cy + px * 0.75, INK2, a, px - 3, 600, 'center');
        }
    }
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    // 사람이 직접 하는 중이면 시간표는 멈추고 애니메이션만 흐른다
    let manual = false;
    // curOn 이면 키보드 칸 고르기가 켜진 것 — ki 가 hits() 안 번호
    let curOn = false;
    let ki = 0;
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    function takeOver() {
        if (manual) {
            return;
        }
        manual = true;
        onTake();
        wake();
        if (!curOn) {
            curOn = true;
            ki = 0;
        }
    }
    // 한 판 시연이 끝났음을 스크린리더에 한 번만 알린다 — 판이 되풀이돼도 다시 읽지 않는다
    let doneSaid = false;
    function checkDone() {
        if (!manual && !doneSaid && sceneT >= LAP_S - 0.6) {
            doneSaid = true;
            doneP.textContent = statusText();
        }
    }
    function advance(dt) {
        sceneT += dt;
        if (!manual) {
            while (evAt < script.length && script[evAt].t <= sceneT) {
                const ev = script[evAt];
                evAt += 1;
                ev.f();
            }
            if (sceneT >= LAP_S) {
                lap += 1;
                begin();
                return;
            }
        }
        update(dt);
    }
    // 첫 판은 START_S 만큼 앞서 시작한다 — 칸이 이미 움직이는 중인 장면에서 보인다
    function runTo(t) {
        while (sceneT < t - 1e-6) {
            advance(Math.min(1 / 30, t - sceneT));
        }
    }
    function begin() {
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        if (lap === 0 && !still) {
            runTo(START_S);
        }
    }
    const DT_MAX = 0.05;
    const SETTLE_FRAMES = 8;
    const SETTLE_DT = 0.04;
    function drawCursor() {
        if (!curOn) {
            return;
        }
        const hs = hits();
        if (hs.length === 0) {
            return;
        }
        const h = hs[clamp(ki, 0, hs.length - 1)];
        outline(h.x + 1, h.y + 1, h.w - 2, h.h - 2, 5, 3, INK, 1);
        outline(h.x - 1, h.y - 1, h.w + 2, h.h + 2, 6, 1.5, PAPER, 0.9);
    }
    function cursorLabel() {
        const hs = hits();
        return hs.length === 0 ? statusText() : hs[clamp(ki, 0, hs.length - 1)].label;
    }
    function showNow() {
        draw();
        drawCursor();
        pushStatus(curOn ? cursorLabel() : statusText());
        checkDone();
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        showNow();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 배치가 끝난 정지 장면 한 장
    function showRest() {
        stopLoop();
        lap = 0;
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        runTo(REST_S);
        showNow();
    }
    // 움직임 줄이기이거나 멈춘 채 입력이 들어오면 트윈 없이 곧바로 끝 배치로 — 시간을 3초 흘려 스프링·애니메이션을 다 끝낸다
    function settleStill() {
        for (let k = 0; k < 90; k += 1) {
            sceneT += 1 / 30;
            update(1 / 30);
        }
    }
    function play() {
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    function restart() {
        manual = false;
        curOn = false;
        doneSaid = false;
        lap += 1;
        begin();
        for (let k = 0; k < SETTLE_FRAMES; k += 1) {
            update(SETTLE_DT);
        }
        showNow();
    }
    // Step — 멈춘 채 시간표의 다음 일 하나를 부른다. 더 부를 일이 없거나 직접 하던 중이면 다음 판을 연다
    function stepOnce() {
        wake();
        if (!paused) {
            paused = true;
            pauseBtn.setAttribute('aria-pressed', 'true');
            stopLoop();
        }
        if (manual || evAt >= script.length) {
            restart();
            return;
        }
        sceneT = Math.max(sceneT, script[evAt].t);
        advance(0);
        for (let k = 0; k < SETTLE_FRAMES; k += 1) {
            sceneT += SETTLE_DT;
            update(SETTLE_DT);
        }
        showNow();
    }
    function moveCur(d) {
        const n = hits().length;
        if (n === 0) {
            return;
        }
        ki = (ki + d + n) % n;
    }
    function actCur(i) {
        onAct(i);
        // 멈춘 채·움직임 줄이기에서도 입력이 화면에 바로 반영되게 한다
        if (still || paused) {
            settleStill();
        }
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    stepBtn.addEventListener('click', stepOnce, { signal: off.signal });
    // 키보드 — 무대에 포커스가 있을 때만. 방향키는 칸 이동, Enter·Space 는 칸 고르기, P 는 Pause, N 은 Step, R 은 다시
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        const k = e.key;
        if (k === 'ArrowLeft' || k === 'ArrowUp') {
            e.preventDefault();
            takeOver();
            moveCur(-1);
            showNow();
        }
        else if (k === 'ArrowRight' || k === 'ArrowDown') {
            e.preventDefault();
            takeOver();
            moveCur(1);
            showNow();
        }
        else if (k === 'Enter' || k === ' ') {
            e.preventDefault();
            takeOver();
            actCur(ki);
            showNow();
        }
        else if (k === 'p' || k === 'P') {
            togglePause();
        }
        else if (k === 'n' || k === 'N') {
            stepOnce();
        }
        else if (k === 'r' || k === 'R') {
            restart();
        }
    }, { signal: off.signal });
    // 마우스·터치 — 누른 자리의 칸을 고른다
    pad.addEventListener('click', function (e) {
        const rect = cv.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width * W;
        const py = (e.clientY - rect.top) / rect.height * H;
        const hs = hits();
        let at = -1;
        for (let i = 0; i < hs.length; i += 1) {
            if (px >= hs[i].x && px <= hs[i].x + hs[i].w && py >= hs[i].y && py <= hs[i].y + hs[i].h) {
                at = i;
            }
        }
        if (at < 0) {
            return;
        }
        takeOver();
        ki = at;
        actCur(at);
        showNow();
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 배치가 끝난 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            lap = 0;
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        showNow();
    }, { signal: off.signal });
    // 01 — 줄을 닫는 배치(왼쪽)와 One direction slice(오른쪽)를 같은 값으로 나란히 놓고, 가장 길쭉한 칸의 가로세로 비를 센다
    const CELL_N = 12;
    const REVEAL_T0 = 0.25;
    const REVEAL_GAP = 0.14;
    const LAP_S = 9.6;
    const START_S = 1.7;
    const REST_S = 6.5;
    // 모두 나타난 뒤 줄을 하나씩(왼쪽 0.35초, 오른쪽 띠 0.2초) 다시 훑는 시각과 간격
    const SWEEP_T0 = 2.0;
    const ROW_SWEEP = 0.35;
    const STRIP_SWEEP = 0.2;
    const RING_T0 = 4.6;
    let vals = [];
    let lay = { rects: [], rowOf: [], rows: [] };
    let strips = [];
    let pinned = -1;
    function revealT(i) { return REVEAL_T0 + i * REVEAL_GAP; }
    function build() {
        vals = BASE.slice(0, CELL_N);
        lay = squarify(vals, PANEL_L);
        strips = slice(vals, PANEL_R);
        pinned = -1;
    }
    function update(dt) { if (dt < 0) {
        return;
    } }
    // 이미 나타난 칸만 모아 가장 길쭉한 비를 잰다
    function worstShown(rs) {
        const shown = [];
        for (let i = 0; i < rs.length; i += 1) {
            if (sceneT >= revealT(i)) {
                shown.push(rs[i]);
            }
        }
        return shown.length ? worstAspect(shown) : 1;
    }
    function fadeAll() { return 1 - clamp((sceneT - 8.4) / 1.0, 0, 1); }
    function drawSide(R, rs, worstAt) {
        bed(R);
        const fa = fadeAll();
        for (let i = 0; i < rs.length; i += 1) {
            const p = clamp((sceneT - revealT(i)) / 0.4, 0, 1);
            if (p <= 0) {
                continue;
            }
            tile(rs[i], TILES[i % 8], fa, 0.55 + 0.45 * backOut(p));
            if (p >= 1) {
                cellText(rs[i], NAMES[i], pct(vals[i], sumOf(vals)) + '%', fa);
            }
        }
        // 가장 길쭉한 칸 — 줄 훑기가 끝난 RING_T0 뒤부터 고리가 숨 쉰다
        if (sceneT > RING_T0 && worstAt >= 0) {
            const k = 0.5 + 0.5 * Math.sin((sceneT - RING_T0) * 5);
            const r = rs[worstAt];
            outline(r.x + 1, r.y + 1, r.w - 2, r.h - 2, 5, 2.5, INK, (0.45 + 0.55 * k) * fa);
        }
    }
    function argWorst(rs) {
        let at = 0;
        for (let i = 1; i < rs.length; i += 1) {
            if (aspectOf(rs[i]) > aspectOf(rs[at])) {
                at = i;
            }
        }
        return at;
    }
    // 줄에 든 칸들을 감싸는 사각형
    function rowBox(row) {
        let x0 = Infinity;
        let y0 = Infinity;
        let x1 = -Infinity;
        let y1 = -Infinity;
        for (const id of row) {
            const r = lay.rects[id];
            x0 = Math.min(x0, r.x);
            y0 = Math.min(y0, r.y);
            x1 = Math.max(x1, r.x + r.w);
            y1 = Math.max(y1, r.y + r.h);
        }
        return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
    }
    function draw() {
        skyFill(BG_TOP, BG_BOT);
        panelTags('Aiming for squares', 'One direction slice');
        drawSide(PANEL_L, lay.rects, argWorst(lay.rects));
        drawSide(PANEL_R, strips, argWorst(strips));
        // 줄을 닫는 순간 그 줄 위로 한 번 빛이 지난다
        const fa = fadeAll();
        lay.rows.forEach(function (row) {
            // 줄에서 가장 늦게 나타나는 칸이 나타난 직후가 줄을 닫는 순간
            const age = sceneT - revealT(Math.max(...row)) - 0.2;
            if (age < 0 || age > 0.5) {
                return;
            }
            const bb = rowBox(row);
            outline(bb.x + 1, bb.y + 1, bb.w - 2, bb.h - 2, 6, 3, MINT, (1 - age / 0.5) * fa);
        });
        // 줄 훑기 — 줄 하나의 칸 전체를 민트로, 오른쪽은 띠 하나를 장미색으로 차례로 덮는다
        const rowAt = Math.floor((sceneT - SWEEP_T0) / ROW_SWEEP);
        if (sceneT >= SWEEP_T0 && rowAt < lay.rows.length) {
            const bb = rowBox(lay.rows[rowAt]);
            box(bb.x + 1, bb.y + 1, bb.w - 2, bb.h - 2, 6, MINT, 0.5 * fa);
            outline(bb.x + 1, bb.y + 1, bb.w - 2, bb.h - 2, 6, 3, INK, fa);
        }
        const stripAt = Math.floor((sceneT - SWEEP_T0) / STRIP_SWEEP);
        if (sceneT >= SWEEP_T0 && stripAt < strips.length) {
            const sr = strips[stripAt];
            box(sr.x + 1, sr.y + 1, sr.w - 2, sr.h - 2, 4, ROSE, 0.5 * fa);
            outline(sr.x + 1, sr.y + 1, sr.w - 2, sr.h - 2, 4, 3, INK, fa);
        }
        tag(worstShown(lay.rects).toFixed(1) + ' : 1', PANEL_L.x + PANEL_L.w - 6, PANEL_L.y + PANEL_L.h - 12, INK, PAPER, 10, 'right');
        tag(worstShown(strips).toFixed(1) + ' : 1', PANEL_R.x + PANEL_R.w - 6, PANEL_R.y + PANEL_R.h - 12, PAPER, INK, 10, 'right');
        if (pinned >= 0) {
            const r = lay.rects[pinned];
            outline(r.x + 2, r.y + 2, r.w - 4, r.h - 4, 4, 3, ROSE, 1);
        }
    }
    function statusText() {
        return 'Worst ratio {a} vs {b}'.replace('{a}', worstAspect(lay.rects).toFixed(1)).replace('{b}', worstAspect(strips).toFixed(1));
    }
    function hits() {
        return lay.rects.map(function (r, i) {
            return { x: r.x, y: r.y, w: r.w, h: r.h, label: '{n} value {v} - aspect ratio {a}'.replace('{n}', NAMES[i]).replace('{v}', String(vals[i])).replace('{a}', aspectOf(r).toFixed(1)) };
        });
    }
    function onAct(i) { pinned = pinned === i ? -1 : i; }
    function onTake() { return; }
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
