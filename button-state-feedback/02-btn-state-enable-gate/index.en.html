<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enable gate button — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="eg is-demo">
    <div class="eg__field">
      <input class="eg__input" id="eg-mail" type="email" required placeholder="you@example.com" aria-label="Email address">
      <span class="eg__ghost" aria-hidden="true">you@example.com</span>
    </div>
    <div class="eg__wrap">
      <button class="eg__btn" id="eg-btn" type="button" aria-disabled="true" aria-describedby="eg-why">Sign up</button>
      <p class="eg__tip" id="eg-why" role="note">Needs a valid email</p>
    </div>
  </div>
</main>
<script>
// 실제 동작: disabled 대신 aria-disabled 를 쓴다. 초점은 받되 동작만 막아, 왜 못 누르는지 읽힐 수 있다
var root = document.querySelector('.eg');
var mail = document.getElementById('eg-mail');
var btn = document.getElementById('eg-btn');
function validate() {
  var ok = mail.checkValidity() && mail.value.length > 0;
  btn.setAttribute('aria-disabled', String(!ok));
  return ok;
}
mail.addEventListener('input', function () {
  root.classList.remove('is-demo');
  validate();
});
btn.addEventListener('click', function () {
  root.classList.remove('is-demo');
  if (!validate()) {
    btn.setAttribute('data-why', '1');           // 잠긴 이유를 한 번 흔들어 보여 준다
    setTimeout(function () { btn.removeAttribute('data-why'); }, 1400);
    return;
  }
  btn.setAttribute('data-sent', '1');
});
</script>
</body>
</html>
