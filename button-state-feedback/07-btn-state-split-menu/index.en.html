<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split button with menu — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sp is-demo">
    <div class="sp__wrap">
      <div class="sp__group" role="group" aria-label="Send options">
        <button class="sp__main" id="sp-main" type="button">
          <span class="sp__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="18" height="18"><g fill="currentColor"><path d="m223.69 42.18l-58.22 192a8 8 0 0 1-14.92 1.25L108 148l-87.42-42.55a8 8 0 0 1 1.25-14.92l192-58.22a8 8 0 0 1 9.86 9.87" opacity=".2"/><path d="M227.32 28.68a16 16 0 0 0-15.66-4.08h-.15L19.57 82.84a16 16 0 0 0-2.49 29.8L102 154l41.3 84.87a15.86 15.86 0 0 0 14.44 9.13q.69 0 1.38-.06a15.88 15.88 0 0 0 14-11.51l58.2-191.94v-.15a16 16 0 0 0-4-15.66m-69.49 203.17l-.05.14v-.07l-40.06-82.3l48-48a8 8 0 0 0-11.31-11.31l-48 48l-82.33-40.06h-.07h.14L216 40Z"/></g></svg></span>
          <span class="sp__t">Send now</span>
        </button>
        <button class="sp__more" id="sp-more" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="sp-menu" aria-label="More ways to send">
          <span class="sp__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="18" height="18"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></span>
        </button>
      </div>
      <ul class="sp__menu" id="sp-menu" role="menu" aria-labelledby="sp-more">
        <li role="none"><button class="sp__item" type="button" role="menuitem">Schedule send</button></li>
        <li role="none"><button class="sp__item" type="button" role="menuitem">Save to drafts</button></li>
        <li role="none"><button class="sp__item" type="button" role="menuitem">Preview first</button></li>
      </ul>
    </div>
  </div>
</main>
<script>
// 실제 동작: 왼쪽 칸은 목록을 열지 않는다. 오른쪽 화살표 칸만 aria-expanded 를 뒤집는다
var root = document.querySelector('.sp');
var more = document.getElementById('sp-more');
var main = document.getElementById('sp-main');
function setOpen(on) {
  more.setAttribute('aria-expanded', String(on));
  root.setAttribute('data-open', on ? '1' : '0');
}
more.addEventListener('click', function () {
  root.classList.remove('is-demo');
  setOpen(more.getAttribute('aria-expanded') !== 'true');
});
main.addEventListener('click', function () {
  root.classList.remove('is-demo');
  setOpen(false);
  main.setAttribute('data-sent', '1');
});
root.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { setOpen(false); more.focus({ preventScroll: true }); }
});
</script>
</body>
</html>
