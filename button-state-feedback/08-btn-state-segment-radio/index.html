<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segmented radio group — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sg is-demo">
    <div class="sg__bar" role="radiogroup" aria-label="결제 주기 고르기" data-at="0">
      <span class="sg__pill" aria-hidden="true"></span>
      <button class="sg__seg" type="button" role="radio" aria-checked="true" data-at="0">월간</button>
      <button class="sg__seg" type="button" role="radio" aria-checked="false" data-at="1">연간</button>
      <button class="sg__seg" type="button" role="radio" aria-checked="false" data-at="2">평생</button>
    </div>
    <p class="sg__note">칸 폭을 못 박아야 알약이 어긋나지 않습니다</p>
  </div>
</main>
<script>
// 실제 동작: 고른 칸은 aria-checked 로 적고, 알약은 칸 번호 × 칸 폭만큼만 옮긴다
var root = document.querySelector('.sg');
var bar = root.querySelector('.sg__bar');
var segs = [].slice.call(root.querySelectorAll('.sg__seg'));
function select(i) {
  bar.setAttribute('data-at', String(i));
  segs.forEach(function (b, k) { b.setAttribute('aria-checked', String(k === i)); });
}
segs.forEach(function (b, i) {
  b.addEventListener('click', function () { root.classList.remove('is-demo'); select(i); });
});
bar.addEventListener('keydown', function (e) {
  var i = segs.indexOf(document.activeElement);
  if (i < 0 || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
  e.preventDefault();
  root.classList.remove('is-demo');
  var n = (i + (e.key === 'ArrowRight' ? 1 : 2)) % 3;
  select(n);
  segs[n].focus({ preventScroll: true });   // iframe 안에서 부모 페이지가 끌려가지 않게
});
</script>
</body>
</html>
