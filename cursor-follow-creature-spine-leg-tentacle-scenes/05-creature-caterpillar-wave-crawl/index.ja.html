<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体を縮めては伸ばして這う芋虫 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cf is-demo" id="cf">
  <canvas class="cf__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="体を縮めては伸ばす波で這いながら目標を追う芋虫。"></canvas>
  <button class="cf__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("cf");
    if (!root) return;
    // 판 좌표 — 캔버스 안은 늘 480×300. 화면에 보이는 크기와 상관없이 계산은 이 좌표로 한다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 각을 -π~π 로 접는다 — 두 방향의 차이를 잴 때 한 바퀴 넘어간 값을 되돌린다
    function wrapAngle(a) {
        let r = a;
        while (r > Math.PI) {
            r -= TAU;
        }
        while (r < -Math.PI) {
            r += TAU;
        }
        return r;
    }
    // 따라가기 비율 — 1 − e^(−rate·dt). 프레임 시간이 달라도 1초에 같은 만큼 다가간다
    function follow(rate, dt) { return 1 - Math.exp(-rate * dt); }
    // 시드 고정 난수 — 같은 시드면 같은 흔들림·배치가 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 1차원 값 노이즈 — 정수 자리마다 시드로 정한 값(-1~1)을 두고 사이는 부드러운 보간. 흔들림·배회 방향에 쓴다
    const NOISE_TABLE = new Float32Array(256);
    const noiseRng = makeRng(480);
    for (let i = 0; i < 256; i += 1) {
        NOISE_TABLE[i] = noiseRng() * 2 - 1;
    }
    function smoothNoise(x) {
        const i = Math.floor(x);
        const f = x - i;
        const u = f * f * (3 - 2 * f);
        return lerp(NOISE_TABLE[i & 255], NOISE_TABLE[(i + 1) & 255], u);
    }
    // 8자 길 — 가로로 한 번(sin θ), 세로로 두 번(sin 2θ) 흔들리는 점. 판 가운데를 지나는 두 고리를 period 초에 한 바퀴
    function figureEight(t, ax, ay, period) {
        const a = TAU * t / period;
        return [W / 2 + ax * Math.sin(a), H / 2 + ay * Math.sin(2 * a)];
    }
    // 마디 사슬 — xs[0], ys[0] 이 머리. 머리를 옮긴 뒤 부르면 뒤 마디마다 「앞 마디에서 지금 자기 쪽으로 향한 방향 × gap」 자리로 끌어온다.
    // 간격만 지키므로 마디는 늘지도 줄지도 않고, 몸은 머리가 지나간 길을 대충 따라 눕는다.
    // maxBend 가 π 보다 작으면 이웃 두 토막이 꺾이는 각을 ±maxBend(라디안)로 자른다 — π 이상(예: Math.PI)이면 각 한계 없음.
    // backAngle 은 머리 뒤쪽 방향(머리 진행 방향 + π). 숫자면 첫 토막도 그 방향을 기준으로 자른다, NaN 이면 첫 토막은 자유
    function followChain(xs, ys, gap, maxBend, backAngle) {
        const n = xs.length;
        let prevAng = backAngle;
        for (let i = 1; i < n; i += 1) {
            let ang = Math.atan2(ys[i] - ys[i - 1], xs[i] - xs[i - 1]);
            if (maxBend < Math.PI && !isNaN(prevAng)) {
                const d = wrapAngle(ang - prevAng);
                if (d > maxBend) {
                    ang = prevAng + maxBend;
                }
                else if (d < -maxBend) {
                    ang = prevAng - maxBend;
                }
            }
            xs[i] = xs[i - 1] + Math.cos(ang) * gap;
            ys[i] = ys[i - 1] + Math.sin(ang) * gap;
            prevAng = ang;
        }
    }
    // 마디 i 에서 머리 쪽을 향한 방향(라디안) — 양 끝은 이웃 한 토막, 가운데는 앞뒤 마디를 이은 방향
    function jointAngle(xs, ys, i) {
        const n = xs.length;
        if (i <= 0) {
            return Math.atan2(ys[0] - ys[1], xs[0] - xs[1]);
        }
        if (i >= n - 1) {
            return Math.atan2(ys[n - 2] - ys[n - 1], xs[n - 2] - xs[n - 1]);
        }
        return Math.atan2(ys[i - 1] - ys[i + 1], xs[i - 1] - xs[i + 1]);
    }
    // 이웃 두 토막 사이 꺾인 각(라디안, 부호 있음) — 마디 i 앞 토막과 뒤 토막의 방향 차
    function bendAt(xs, ys, i) {
        const a = Math.atan2(ys[i] - ys[i - 1], xs[i] - xs[i - 1]);
        const b = Math.atan2(ys[i + 1] - ys[i], xs[i + 1] - xs[i]);
        return wrapAngle(b - a);
    }
    // 몸 윤곽 — 마디마다 방향의 법선(직각) 쪽으로 radii[i] 만큼 좌우로 민 점을 잇는다.
    // 순서: 머리 왼쪽 → 왼쪽 옆구리를 따라 꼬리 → 꼬리 끝 → 오른쪽 옆구리를 따라 머리 → 머리 앞쪽 반원(HEAD_CAP_STEPS 조각). 닫힌 다각형, 점마다 x 와 y 를 차례로 넣은 한 줄 배열
    const HEAD_CAP_STEPS = 6;
    function bodyOutline(xs, ys, radii) {
        const n = xs.length;
        const pts = [];
        for (let i = 0; i < n; i += 1) {
            const a = jointAngle(xs, ys, i) + Math.PI / 2;
            pts.push(xs[i] + Math.cos(a) * radii[i], ys[i] + Math.sin(a) * radii[i]);
        }
        const tailA = jointAngle(xs, ys, n - 1) + Math.PI;
        pts.push(xs[n - 1] + Math.cos(tailA) * radii[n - 1], ys[n - 1] + Math.sin(tailA) * radii[n - 1]);
        for (let i = n - 1; i >= 0; i -= 1) {
            const a = jointAngle(xs, ys, i) - Math.PI / 2;
            pts.push(xs[i] + Math.cos(a) * radii[i], ys[i] + Math.sin(a) * radii[i]);
        }
        const a0 = jointAngle(xs, ys, 0);
        for (let k = 1; k < HEAD_CAP_STEPS; k += 1) {
            const a = a0 - Math.PI / 2 + Math.PI * k / HEAD_CAP_STEPS;
            pts.push(xs[0] + Math.cos(a) * radii[0], ys[0] + Math.sin(a) * radii[0]);
        }
        return pts;
    }
    // 몸이 스스로 겹친 정도 — 사슬에서 3칸 이상 떨어진 두 마디가 두 반지름 합보다 가까운 쌍의 수와 가장 가까운 거리
    function selfOverlap(xs, ys, radii) {
        const n = xs.length;
        let count = 0;
        let nearest = Infinity;
        for (let i = 0; i < n; i += 1) {
            for (let j = i + 3; j < n; j += 1) {
                const d = Math.hypot(xs[i] - xs[j], ys[i] - ys[j]);
                if (d < nearest) {
                    nearest = d;
                }
                if (d < radii[i] + radii[j]) {
                    count += 1;
                }
            }
        }
        return [count, nearest];
    }
    // 파스텔 팔레트 — 크림·옅은 민트 바탕 위에 파스텔 생물, 윤곽선과 그림자는 진한 잉크색으로 명도 차를 둔다
    const PAPER = [251, 247, 238];
    const PAPER_LOW = [222, 242, 234];
    const INK = [58, 50, 74];
    const CREAM = [255, 251, 242];
    const CORAL = [244, 162, 144];
    const LAVENDER = [188, 170, 236];
    const BUTTER = [246, 222, 140];
    const SAGE = [156, 204, 164];
    const PINK = [244, 176, 200];
    const SKY = [156, 204, 236];
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function shade(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    // 목표점(판 좌표)과 그 속도(px/초) — 8자 길 또는 포인터. 그리기에서 눈동자 방향·목표 표시에 쓴다
    let tx = W / 2;
    let ty = H / 2;
    let tvx = 0;
    let tvy = 0;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function clearStage(top, bottom) {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bottom, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    // 점들을 지나는 매끈한 닫힌 곡선 — 이웃 두 점의 가운데를 잇고 점 자체는 2차 곡선의 조절점으로 쓴다
    function smoothClosed(pts) {
        const n = pts.length / 2;
        ctx.beginPath();
        ctx.moveTo((pts[2 * (n - 1)] + pts[0]) / 2, (pts[2 * (n - 1) + 1] + pts[1]) / 2);
        for (let i = 0; i < n; i += 1) {
            const j = (i + 1) % n;
            ctx.quadraticCurveTo(pts[2 * i], pts[2 * i + 1], (pts[2 * i] + pts[2 * j]) / 2, (pts[2 * i + 1] + pts[2 * j + 1]) / 2);
        }
        ctx.closePath();
    }
    function fillShape(pts, fill, line) {
        smoothClosed(pts);
        ctx.fillStyle = rgba(fill, 1);
        ctx.fill();
        if (line > 0) {
            ctx.lineWidth = line;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = rgba(INK, 1);
            ctx.stroke();
        }
    }
    // 바닥 그림자 — 같은 윤곽을 (ox, oy) 만큼 밀어 옅은 잉크색으로
    function dropShadow(pts, ox, oy, alpha) {
        ctx.save();
        ctx.translate(ox, oy);
        smoothClosed(pts);
        ctx.fillStyle = rgba(INK, alpha);
        ctx.fill();
        ctx.restore();
    }
    // 눈 — 흰자 위 눈동자를 (lookX, lookY) 쪽으로 반지름의 0.4 만큼 민다. open 0~1 은 위 눈꺼풀이 덮는 정도의 반대
    function drawEye(x, y, r, lookX, lookY, open) {
        const a = Math.atan2(lookY - y, lookX - x);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(CREAM, 1);
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = rgba(INK, 1);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + Math.cos(a) * r * 0.4, y + Math.sin(a) * r * 0.4, r * 0.55, 0, TAU);
        ctx.fillStyle = rgba(INK, 1);
        ctx.fill();
        if (open < 1) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, r + 0.5, 0, TAU);
            ctx.clip();
            ctx.fillStyle = rgba(INK, 0.85);
            ctx.fillRect(x - r - 1, y - r - 1, 2 * r + 2, (2 * r + 2) * (1 - open));
            ctx.restore();
        }
    }
    // 목표 표시 — 잉크색 고리와 점. 생물이 무엇을 쫓는지 보이게
    function drawTarget(x, y) {
        // 동작 줄이기의 쉬는 자세에서는 포인터가 올라왔을 때만 보인다
        if (still && !ptrOn) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, 7, 0, TAU);
        ctx.lineWidth = 2;
        ctx.strokeStyle = rgba(INK, 0.55);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, 2.5, 0, TAU);
        ctx.fillStyle = rgba(INK, 0.7);
        ctx.fill();
    }
    // 05 애벌레 — 마디는 머리가 지나간 자취 위에 늘어서고, 자취를 따라 잰 자리 s[i](px)와 그 속도 u[i](px/초)만 계산한다.
    // 토막 i(마디 i 와 i+1 사이)의 목표 간격이 꼬리에서 머리로 흐르는 사인 물결로 줄었다 늘고, 스프링(SPRING_K)이 간격을 그쪽으로 당긴다.
    // 바닥 마찰은 앞으로 갈 때 FRICTION_FWD, 뒤로 밀릴 때 FRICTION_BACK(1/초) — 둘이 다르기 때문에 제자리 꿈틀거림이 전진이 된다
    const CAT_JOINTS = 14;
    const REST_GAP = 13;
    // 물결 — 간격을 최대 WAVE_DEPTH 비율만큼 오므린다. 1초에 WAVE_SPEED 라디안, 이웃 토막 사이 위상차 WAVE_K 라디안
    const WAVE_DEPTH = 0.5;
    const WAVE_SPEED = 11;
    const WAVE_K = 0.6;
    // 토막 스프링 — 세기 SPRING_K(1/초²), 이웃 마디 속도 차에 거는 몸속 감쇠 SEG_DAMP(1/초)
    const SPRING_K = 600;
    const SEG_DAMP = 10;
    const CRAWL_HZ = 120;
    const FRICTION_FWD = 1.2;
    const FRICTION_BACK = 28;
    // 머리가 1초에 도는 각(라디안)
    const CAT_TURN = 2.2;
    // 굵기(px) — 간격이 줄면 부피를 지키듯 굵어진다: 반지름 = CAT_RADIUS × √(REST_GAP / 지금 간격)
    const CAT_RADIUS = 16;
    const PREWARM = 3;
    function pathAt(t) { return figureEight(t, 160, 88, 12); }
    const catS = new Float64Array(CAT_JOINTS);
    const catU = new Float64Array(CAT_JOINTS);
    const catF = new Float64Array(CAT_JOINTS);
    const catX = new Float64Array(CAT_JOINTS);
    const catY = new Float64Array(CAT_JOINTS);
    const catR = new Float64Array(CAT_JOINTS);
    // 자취 — 머리가 지나간 점(x, y)과 자취 시작부터 잰 길이. 꼬리 뒤로 한참 지난 점은 버린다
    let trailX = [];
    let trailY = [];
    let trailS = [];
    let catHeading = 0;
    let wavePhase = 0;
    let frictionBack = FRICTION_BACK;
    // 기어갈 힘 0~1 — 머리가 목표에 ARRIVE_GAP(px) 안이면 물결을 줄여 멈춘다: clamp((거리 − ARRIVE_GAP) / 60, 0, 1)
    const ARRIVE_GAP = 25;
    let crawlDrive = 1;
    // 자취 위 길이 s 자리를 마디 i 에 놓는다 — 두 자취 점 사이를 직선으로 보간
    function trailAt(s, i) {
        const n = trailS.length;
        let lo = 0;
        let hi = n - 1;
        const v = clamp(s, trailS[0], trailS[n - 1]);
        while (hi - lo > 1) {
            const mid = (lo + hi) >> 1;
            if (trailS[mid] <= v) {
                lo = mid;
            }
            else {
                hi = mid;
            }
        }
        const span = trailS[hi] - trailS[lo] || 1;
        const k = (v - trailS[lo]) / span;
        catX[i] = lerp(trailX[lo], trailX[hi], k);
        catY[i] = lerp(trailY[lo], trailY[hi], k);
    }
    function placeJoints() {
        for (let i = 0; i < CAT_JOINTS; i += 1) {
            trailAt(catS[i], i);
        }
        for (let i = 0; i < CAT_JOINTS; i += 1) {
            const g = i < CAT_JOINTS - 1 ? catS[i] - catS[i + 1] : catS[i - 1] - catS[i];
            catR[i] = CAT_RADIUS * clamp(Math.sqrt(REST_GAP / Math.max(1, g)), 0.85, 1.4) * (i === 0 ? 1.12 : 1);
        }
    }
    function reset() {
        const p = pathAt(0);
        catHeading = 0;
        wavePhase = 0;
        trailX = [];
        trailY = [];
        trailS = [];
        const len = (CAT_JOINTS + 4) * REST_GAP;
        for (let s = 0; s <= len; s += 4) {
            trailX.push(p[0] - 40 - len + s);
            trailY.push(p[1]);
            trailS.push(s);
        }
        for (let i = 0; i < CAT_JOINTS; i += 1) {
            catS[i] = len - i * REST_GAP;
            catU[i] = 0;
        }
        placeJoints();
    }
    // 토막 i 의 목표 간격 — 위상 = wavePhase − (꼬리에서 센 토막 번호) × WAVE_K. 꼬리 토막이 먼저 오므리고 물결이 머리로 간다
    function targetGap(i) {
        const fromTail = CAT_JOINTS - 2 - i;
        return REST_GAP * (1 - WAVE_DEPTH * crawlDrive * Math.max(0, Math.sin(wavePhase - fromTail * WAVE_K)));
    }
    function crawl(dt) {
        wavePhase += WAVE_SPEED * dt;
        for (let i = 0; i < CAT_JOINTS; i += 1) {
            catF[i] = 0;
        }
        for (let i = 0; i < CAT_JOINTS - 1; i += 1) {
            const pull = SPRING_K * ((catS[i] - catS[i + 1]) - targetGap(i)) + SEG_DAMP * (catU[i] - catU[i + 1]);
            catF[i] -= pull;
            catF[i + 1] += pull;
        }
        for (let i = 0; i < CAT_JOINTS; i += 1) {
            catU[i] += catF[i] * dt;
            catU[i] *= Math.exp(-(catU[i] >= 0 ? FRICTION_FWD : frictionBack) * dt);
            catS[i] += catU[i] * dt;
        }
    }
    function update(dt, tx, ty, tvx, tvy) {
        const n = trailS.length;
        const hx = trailX[n - 1];
        const hy = trailY[n - 1];
        catHeading = wrapAngle(catHeading + clamp(wrapAngle(Math.atan2(ty - hy, tx - hx) - catHeading), -CAT_TURN * dt, CAT_TURN * dt));
        crawlDrive = clamp((Math.hypot(tx - hx, ty - hy) - ARRIVE_GAP) / 60, 0, 1);
        // 스프링이 단단해 한 번에 큰 dt 를 넣으면 튄다 — 1/CRAWL_HZ 초 이하 조각으로 나눠 계산한다
        const pieces = Math.ceil(dt * CRAWL_HZ);
        for (let p = 0; p < pieces; p += 1) {
            crawl(dt / pieces);
        }
        // 머리가 자취 끝보다 앞섰으면 지금 머리 방향으로 자취를 늘린다
        const ahead = catS[0] - trailS[n - 1];
        if (ahead > 0) {
            trailX.push(hx + Math.cos(catHeading) * ahead);
            trailY.push(hy + Math.sin(catHeading) * ahead);
            trailS.push(catS[0]);
        }
        while (trailS.length > 4 && trailS[1] < catS[CAT_JOINTS - 1] - 30) {
            trailX.shift();
            trailY.shift();
            trailS.shift();
        }
        placeJoints();
    }
    // 쉬는 자세 — 자취를 완만한 S 자로 깔고 마디를 쉬는 간격으로 늘어놓는다
    function restPose() {
        trailX = [];
        trailY = [];
        trailS = [];
        const len = (CAT_JOINTS - 1) * REST_GAP;
        let s = 0;
        let px = W / 2 - len * 0.5;
        let py = H / 2;
        for (let k = 0; k <= 80; k += 1) {
            const x = W / 2 - len * 0.5 + len * 1.05 * k / 80;
            const y = H / 2 + Math.sin(k / 80 * TAU) * 22;
            if (k > 0) {
                s += Math.hypot(x - px, y - py);
            }
            trailX.push(x);
            trailY.push(y);
            trailS.push(s);
            px = x;
            py = y;
        }
        for (let i = 0; i < CAT_JOINTS; i += 1) {
            catS[i] = s - i * REST_GAP;
            catU[i] = 0;
        }
        catHeading = 0;
        placeJoints();
    }
    function draw() {
        clearStage(PAPER, PAPER_LOW);
        // 그림자 — 마디 원마다 오른쪽 아래로 민 옅은 원
        ctx.fillStyle = rgba(INK, 0.12);
        for (let i = 0; i < CAT_JOINTS; i += 1) {
            ctx.beginPath();
            ctx.arc(catX[i] + 4, catY[i] + 7, catR[i], 0, TAU);
            ctx.fill();
        }
        // 다리 — 마디 양옆의 짧은 잉크 막대. 토막이 오므라든 만큼(쉬는 간격 대비) 바깥으로 더 뻗는다
        ctx.lineCap = 'round';
        ctx.lineWidth = 3;
        ctx.strokeStyle = rgba(INK, 1);
        for (let i = 1; i < CAT_JOINTS; i += 1) {
            const a = jointAngle(catX, catY, i);
            const g = i < CAT_JOINTS - 1 ? catS[i] - catS[i + 1] : REST_GAP;
            const reach = catR[i] + 3 + 4 * clamp(1 - g / REST_GAP, 0, 1) / WAVE_DEPTH;
            for (let s = -1; s <= 1; s += 2) {
                const n = a + s * Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(catX[i] + Math.cos(n) * catR[i] * 0.6, catY[i] + Math.sin(n) * catR[i] * 0.6);
                ctx.lineTo(catX[i] + Math.cos(n) * reach, catY[i] + Math.sin(n) * reach);
                ctx.stroke();
            }
        }
        // 마디 — 꼬리부터 그려 머리 쪽 마디가 위에 오게. 세이지와 버터색 번갈아
        for (let i = CAT_JOINTS - 1; i >= 0; i -= 1) {
            ctx.beginPath();
            ctx.arc(catX[i], catY[i], catR[i], 0, TAU);
            ctx.fillStyle = rgba(i === 0 ? CORAL : (i % 2 === 0 ? SAGE : BUTTER), 1);
            ctx.fill();
            ctx.lineWidth = 2.2;
            ctx.strokeStyle = rgba(INK, 1);
            ctx.stroke();
        }
        // 더듬이 — 머리 앞쪽으로 두 가닥, 끝에 작은 공
        const a0 = jointAngle(catX, catY, 0);
        ctx.lineWidth = 2;
        for (let s = -1; s <= 1; s += 2) {
            const ax = catX[0] + Math.cos(a0 + s * 0.5) * (catR[0] + 9);
            const ay = catY[0] + Math.sin(a0 + s * 0.5) * (catR[0] + 9);
            ctx.beginPath();
            ctx.moveTo(catX[0] + Math.cos(a0 + s * 0.4) * catR[0] * 0.8, catY[0] + Math.sin(a0 + s * 0.4) * catR[0] * 0.8);
            ctx.lineTo(ax, ay);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(ax, ay, 2.6, 0, TAU);
            ctx.fillStyle = rgba(INK, 1);
            ctx.fill();
            drawEye(catX[0] + Math.cos(a0 + s * 0.75) * catR[0] * 0.5, catY[0] + Math.sin(a0 + s * 0.75) * catR[0] * 0.5, 4, tx, ty, 1);
        }
        drawTarget(tx, ty);
    }
    // 한 프레임에 넘기는 시간 상한(초) — 탭을 오래 숨겼다 돌아온 첫 프레임에도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    // 미리 돌리기 — 첫 장면을 그리기 전에 PREWARM 초를 1/60초 걸음으로 계산해 생물이 길 위에 자리 잡은 채 시작한다
    const PREWARM_STEP = 1 / 60;
    // 시연 시계(초) — 8자 길 위의 자리를 정한다
    let simTime = 0;
    // 포인터(판 좌표) — 판 위에 있으면 목표를 포인터 쪽으로 옮긴다. 떠나면 다시 8자 길로 서서히 돌아간다
    let ptrX = W / 2;
    let ptrY = H / 2;
    let ptrOn = false;
    let ptrBlend = 0;
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 손대면 시연 표시를 떼고 알림 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    // 리스너는 한 묶음으로 달고 정리할 때 한 번에 뗀다
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        const live = root.querySelector('[aria-live]');
        if (live) {
            live.setAttribute('aria-live', 'polite');
        }
    }
    // 목표 옮기기 — 8자 길 자리와 포인터 자리를 ptrBlend 비율로 섞고, 그 변화로 목표 속도를 잰다
    function moveTarget(dt) {
        const p = pathAt(simTime);
        ptrBlend = lerp(ptrBlend, ptrOn ? 1 : 0, follow(4, dt));
        const nx = lerp(p[0], ptrX, ptrBlend);
        const ny = lerp(p[1], ptrY, ptrBlend);
        if (dt > 0) {
            tvx = lerp(tvx, (nx - tx) / dt, follow(12, dt));
            tvy = lerp(tvy, (ny - ty) / dt, follow(12, dt));
        }
        tx = nx;
        ty = ny;
    }
    function advance(dt) {
        simTime += dt;
        moveTarget(dt);
        update(dt, tx, ty, tvx, tvy);
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 시계 다시 맞추기 — 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 동작 줄이기 — 루프를 돌리지 않고 쉬는 자세 한 장면만 그린다
    function showRest() {
        stopLoop();
        reset();
        restPose();
        draw();
    }
    function play() {
        reset();
        simTime = 0;
        const p = pathAt(0);
        tx = p[0];
        ty = p[1];
        tvx = 0;
        tvy = 0;
        for (let t = 0; t < PREWARM; t += PREWARM_STEP) {
            advance(PREWARM_STEP);
        }
        draw();
        if (!paused) {
            startLoop();
        }
    }
    function setPointer(ev) {
        const r = cv.getBoundingClientRect();
        ptrX = (ev.clientX - r.left) * W / Math.max(1, r.width);
        ptrY = (ev.clientY - r.top) * H / Math.max(1, r.height);
        ptrOn = true;
        wake();
        // 동작 줄이기에서도 입력은 화면에 남는다 — 쉬는 자세 그대로 눈과 목표 표시만 포인터 쪽으로 다시 그린다
        if (still) {
            tx = ptrX;
            ty = ptrY;
            draw();
        }
    }
    cv.addEventListener('pointermove', setPointer, { signal: off.signal });
    cv.addEventListener('pointerdown', setPointer, { signal: off.signal });
    function leavePointer() { ptrOn = false; }
    cv.addEventListener('pointerleave', leavePointer, { signal: off.signal });
    cv.addEventListener('pointercancel', leavePointer, { signal: off.signal });
    pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 루프를 멈추고, 돌아오면 시계를 다시 맞춰 시작한다 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 페이지를 연 채 바뀌면 — 켜지면 쉬는 자세로 멈추고, 꺼지면 시연을 처음부터
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw();
    }, { signal: off.signal });
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
