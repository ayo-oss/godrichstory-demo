<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끝을 목표에 닿게 뻗는 문어 촉수 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cf is-demo" id="cf">
  <canvas class="cf__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="일곱 개의 촉수 끝을 목표점 쪽으로 뻗는 라벤더색 문어."></canvas>
  <button class="cf__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("cf");
    if (!root) return;
    // 판 좌표 — 캔버스 안은 늘 480×300. 화면에 보이는 크기와 상관없이 계산은 이 좌표로 한다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 각을 -π~π 로 접는다 — 두 방향의 차이를 잴 때 한 바퀴 넘어간 값을 되돌린다
    function wrapAngle(a) {
        let r = a;
        while (r > Math.PI) {
            r -= TAU;
        }
        while (r < -Math.PI) {
            r += TAU;
        }
        return r;
    }
    // 따라가기 비율 — 1 − e^(−rate·dt). 프레임 시간이 달라도 1초에 같은 만큼 다가간다
    function follow(rate, dt) { return 1 - Math.exp(-rate * dt); }
    // 시드 고정 난수 — 같은 시드면 같은 흔들림·배치가 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 1차원 값 노이즈 — 정수 자리마다 시드로 정한 값(-1~1)을 두고 사이는 부드러운 보간. 흔들림·배회 방향에 쓴다
    const NOISE_TABLE = new Float32Array(256);
    const noiseRng = makeRng(480);
    for (let i = 0; i < 256; i += 1) {
        NOISE_TABLE[i] = noiseRng() * 2 - 1;
    }
    function smoothNoise(x) {
        const i = Math.floor(x);
        const f = x - i;
        const u = f * f * (3 - 2 * f);
        return lerp(NOISE_TABLE[i & 255], NOISE_TABLE[(i + 1) & 255], u);
    }
    // 8자 길 — 가로로 한 번(sin θ), 세로로 두 번(sin 2θ) 흔들리는 점. 판 가운데를 지나는 두 고리를 period 초에 한 바퀴
    function figureEight(t, ax, ay, period) {
        const a = TAU * t / period;
        return [W / 2 + ax * Math.sin(a), H / 2 + ay * Math.sin(2 * a)];
    }
    // 끝 당기고 뿌리 되당기기 — 마디 사슬(xs[0] = 뿌리, 마지막 = 끝)의 끝을 목표(tx, ty)에 닿게 한다.
    // 한 번 = ① 끝을 목표에 놓고 끝에서 뿌리 쪽으로 마디마다 간격 gap 자리로 당긴다 ② 뿌리를 제자리(rx, ry)에 되돌려 놓고 뿌리에서 끝 쪽으로 다시 당긴다.
    // 뿌리에서 목표까지가 사슬 전체 길이보다 멀면 되풀이하지 않고 그 방향으로 곧게 편다. 돌려주는 값 = 끝과 목표 사이 거리(px)
    function reachChain(xs, ys, gap, rx, ry, tx, ty, iterations) {
        const n = xs.length;
        const total = gap * (n - 1);
        const far = Math.hypot(tx - rx, ty - ry);
        if (far >= total) {
            const ux = (tx - rx) / far;
            const uy = (ty - ry) / far;
            for (let i = 0; i < n; i += 1) {
                xs[i] = rx + ux * gap * i;
                ys[i] = ry + uy * gap * i;
            }
            return far - total;
        }
        for (let it = 0; it < iterations; it += 1) {
            xs[n - 1] = tx;
            ys[n - 1] = ty;
            for (let i = n - 2; i >= 0; i -= 1) {
                const d = Math.hypot(xs[i] - xs[i + 1], ys[i] - ys[i + 1]) || 1;
                xs[i] = xs[i + 1] + (xs[i] - xs[i + 1]) / d * gap;
                ys[i] = ys[i + 1] + (ys[i] - ys[i + 1]) / d * gap;
            }
            xs[0] = rx;
            ys[0] = ry;
            for (let i = 1; i < n; i += 1) {
                const d = Math.hypot(xs[i] - xs[i - 1], ys[i] - ys[i - 1]) || 1;
                xs[i] = xs[i - 1] + (xs[i] - xs[i - 1]) / d * gap;
                ys[i] = ys[i - 1] + (ys[i] - ys[i - 1]) / d * gap;
            }
        }
        return Math.hypot(xs[n - 1] - tx, ys[n - 1] - ty);
    }
    // 파스텔 팔레트 — 크림·옅은 민트 바탕 위에 파스텔 생물, 윤곽선과 그림자는 진한 잉크색으로 명도 차를 둔다
    const PAPER = [251, 247, 238];
    const PAPER_LOW = [222, 242, 234];
    const INK = [58, 50, 74];
    const CREAM = [255, 251, 242];
    const CORAL = [244, 162, 144];
    const LAVENDER = [188, 170, 236];
    const BUTTER = [246, 222, 140];
    const SAGE = [156, 204, 164];
    const PINK = [244, 176, 200];
    const SKY = [156, 204, 236];
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function shade(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    // 목표점(판 좌표)과 그 속도(px/초) — 8자 길 또는 포인터. 그리기에서 눈동자 방향·목표 표시에 쓴다
    let tx = W / 2;
    let ty = H / 2;
    let tvx = 0;
    let tvy = 0;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function clearStage(top, bottom) {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bottom, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    // 점들을 지나는 매끈한 닫힌 곡선 — 이웃 두 점의 가운데를 잇고 점 자체는 2차 곡선의 조절점으로 쓴다
    function smoothClosed(pts) {
        const n = pts.length / 2;
        ctx.beginPath();
        ctx.moveTo((pts[2 * (n - 1)] + pts[0]) / 2, (pts[2 * (n - 1) + 1] + pts[1]) / 2);
        for (let i = 0; i < n; i += 1) {
            const j = (i + 1) % n;
            ctx.quadraticCurveTo(pts[2 * i], pts[2 * i + 1], (pts[2 * i] + pts[2 * j]) / 2, (pts[2 * i + 1] + pts[2 * j + 1]) / 2);
        }
        ctx.closePath();
    }
    function fillShape(pts, fill, line) {
        smoothClosed(pts);
        ctx.fillStyle = rgba(fill, 1);
        ctx.fill();
        if (line > 0) {
            ctx.lineWidth = line;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = rgba(INK, 1);
            ctx.stroke();
        }
    }
    // 바닥 그림자 — 같은 윤곽을 (ox, oy) 만큼 밀어 옅은 잉크색으로
    function dropShadow(pts, ox, oy, alpha) {
        ctx.save();
        ctx.translate(ox, oy);
        smoothClosed(pts);
        ctx.fillStyle = rgba(INK, alpha);
        ctx.fill();
        ctx.restore();
    }
    // 눈 — 흰자 위 눈동자를 (lookX, lookY) 쪽으로 반지름의 0.4 만큼 민다. open 0~1 은 위 눈꺼풀이 덮는 정도의 반대
    function drawEye(x, y, r, lookX, lookY, open) {
        const a = Math.atan2(lookY - y, lookX - x);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(CREAM, 1);
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = rgba(INK, 1);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + Math.cos(a) * r * 0.4, y + Math.sin(a) * r * 0.4, r * 0.55, 0, TAU);
        ctx.fillStyle = rgba(INK, 1);
        ctx.fill();
        if (open < 1) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, r + 0.5, 0, TAU);
            ctx.clip();
            ctx.fillStyle = rgba(INK, 0.85);
            ctx.fillRect(x - r - 1, y - r - 1, 2 * r + 2, (2 * r + 2) * (1 - open));
            ctx.restore();
        }
    }
    // 목표 표시 — 잉크색 고리와 점. 생물이 무엇을 쫓는지 보이게
    function drawTarget(x, y) {
        // 동작 줄이기의 쉬는 자세에서는 포인터가 올라왔을 때만 보인다
        if (still && !ptrOn) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, 7, 0, TAU);
        ctx.lineWidth = 2;
        ctx.strokeStyle = rgba(INK, 0.55);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, 2.5, 0, TAU);
        ctx.fillStyle = rgba(INK, 0.7);
        ctx.fill();
    }
    // 04 문어 — 몸통은 목표를 느리게 쫓고, 촉수 일곱 개는 끝을 목표 근처로 뻗는다(끝 당기고 뿌리 되당기기 반복)
    const TENTACLES = 7;
    const TENTACLE_JOINTS = 12;
    // 촉수 마디 간격(px) — 촉수 길이 = (TENTACLE_JOINTS − 1) × TENTACLE_GAP
    const TENTACLE_GAP = 10;
    // 한 프레임에 되풀이하는 횟수 — 끝 당기기 + 뿌리 되당기기 한 쌍이 한 번
    const REACH_ITER = 4;
    // 촉수마다 목표를 흔드는 폭(px)과 빠르기 — 1차원 값 노이즈를 촉수마다 다른 자리에서 읽는다
    const SWAY_AMP = 30;
    const SWAY_SPEED = 0.9;
    // 촉수 끝이 목표 둘레에 퍼지는 간격(px) — 가로로 TIP_SPREAD 씩, 가운데 촉수일수록 아래로(부채꼴)
    const TIP_SPREAD = 24;
    // 몸통 — 목표에서 MANTLE_KEEP(px) 떨어진 자리(지금 몸통 쪽 방향에 위쪽 MANTLE_LIFT 를 더한 방향)를 따라가기 비율 MANTLE_FOLLOW(1/초)로 쫓는다. 반지름 MANTLE_R
    const MANTLE_FOLLOW = 3;
    const MANTLE_LIFT = 40;
    const MANTLE_KEEP = 85;
    const MANTLE_R = 30;
    const PREWARM = 3;
    function pathAt(t) { return figureEight(t, 165, 80, 8); }
    const arms = [];
    for (let k = 0; k < TENTACLES; k += 1) {
        arms.push({ xs: new Float64Array(TENTACLE_JOINTS), ys: new Float64Array(TENTACLE_JOINTS), rootA: Math.PI / 2 + (k - (TENTACLES - 1) / 2) * 0.36, err: 0 });
    }
    let mx = W / 2;
    let my = H / 2;
    let octoClock = 0;
    // 이번 프레임에 끝이 목표에 닿은(오차 1px 미만) 촉수 수
    let reached = 0;
    function rootOf(a) {
        return [mx + Math.cos(a.rootA) * MANTLE_R * 0.8, my + Math.sin(a.rootA) * MANTLE_R * 0.75];
    }
    function hangArms() {
        for (let k = 0; k < TENTACLES; k += 1) {
            const r = rootOf(arms[k]);
            for (let i = 0; i < TENTACLE_JOINTS; i += 1) {
                arms[k].xs[i] = r[0] + Math.cos(arms[k].rootA) * TENTACLE_GAP * i * 0.6;
                arms[k].ys[i] = r[1] + Math.sin(arms[k].rootA) * TENTACLE_GAP * i * 0.6 + i * i * 0.4;
            }
        }
    }
    function reset() {
        const p = pathAt(0);
        mx = p[0];
        my = p[1] - MANTLE_LIFT;
        octoClock = 0;
        hangArms();
    }
    function update(dt, tx, ty, tvx, tvy) {
        octoClock += dt;
        const k0 = follow(MANTLE_FOLLOW, dt);
        const ax = mx - tx;
        const ay = my - ty - MANTLE_LIFT;
        const al = Math.hypot(ax, ay) || 1;
        mx = lerp(mx, clamp(tx + ax / al * MANTLE_KEEP, 50, W - 50), k0);
        my = lerp(my, clamp(ty + ay / al * MANTLE_KEEP, 40, H - 60), k0);
        reached = 0;
        for (let k = 0; k < TENTACLES; k += 1) {
            const a = arms[k];
            const r = rootOf(a);
            const gx = tx + (k - (TENTACLES - 1) / 2) * TIP_SPREAD + smoothNoise(octoClock * SWAY_SPEED + k * 7.3) * SWAY_AMP;
            const gy = ty - Math.abs(k - (TENTACLES - 1) / 2) * TIP_SPREAD * 0.5 + smoothNoise(octoClock * SWAY_SPEED + k * 7.3 + 61) * SWAY_AMP;
            a.err = reachChain(a.xs, a.ys, TENTACLE_GAP, r[0], r[1], gx, gy, REACH_ITER);
            if (a.err < 1) {
                reached += 1;
            }
        }
    }
    // 쉬는 자세 — 몸통을 가운데 위에 두고 촉수를 아래로 늘어뜨린다(끝은 S 자로 휘게)
    function restPose() {
        mx = W / 2;
        my = H / 2 - 50;
        hangArms();
        for (let k = 0; k < TENTACLES; k += 1) {
            const a = arms[k];
            const r = rootOf(a);
            const tipX = r[0] + Math.cos(a.rootA) * 70 + Math.sin(k * 1.7) * 18;
            const tipY = r[1] + 95;
            reachChain(a.xs, a.ys, TENTACLE_GAP, r[0], r[1], tipX, tipY, 12);
        }
    }
    // 촉수 굵기(px) — 뿌리 13 에서 끝 3 까지 마디마다 고르게 가늘어진다
    function armWidth(i) { return 13 - 10 * i / (TENTACLE_JOINTS - 1); }
    function drawArm(a) {
        ctx.lineCap = 'round';
        for (let pass = 0; pass < 2; pass += 1) {
            for (let i = 0; i < TENTACLE_JOINTS - 1; i += 1) {
                ctx.beginPath();
                ctx.moveTo(a.xs[i], a.ys[i]);
                ctx.lineTo(a.xs[i + 1], a.ys[i + 1]);
                ctx.lineWidth = armWidth(i) + (pass === 0 ? 4 : 0);
                ctx.strokeStyle = pass === 0 ? rgba(INK, 1) : rgba(LAVENDER, 1);
                ctx.stroke();
            }
        }
        // 빨판 — 둘째 마디마다 한쪽 옆에 크림색 점
        ctx.fillStyle = rgba(CREAM, 1);
        for (let i = 2; i < TENTACLE_JOINTS - 1; i += 2) {
            const ang = Math.atan2(a.ys[i + 1] - a.ys[i], a.xs[i + 1] - a.xs[i]) + Math.PI / 2;
            const off = armWidth(i) * 0.28;
            ctx.beginPath();
            ctx.arc(a.xs[i] + Math.cos(ang) * off, a.ys[i] + Math.sin(ang) * off, Math.max(1.2, armWidth(i) * 0.2), 0, TAU);
            ctx.fill();
        }
    }
    function draw() {
        clearStage(PAPER, PAPER_LOW);
        // 그림자 — 몸통 아래 바닥에 타원 하나
        ctx.beginPath();
        ctx.ellipse(mx + 6, my + 70, MANTLE_R * 1.3, 9, 0, 0, TAU);
        ctx.fillStyle = rgba(INK, 0.1);
        ctx.fill();
        for (let k = 0; k < TENTACLES; k += 1) {
            drawArm(arms[k]);
        }
        // 몸통 — 목표 쪽으로 살짝 기운 둥근 머리
        const tilt = clamp((tx - mx) / 300, -0.35, 0.35);
        ctx.save();
        ctx.translate(mx, my);
        ctx.rotate(tilt);
        ctx.beginPath();
        ctx.ellipse(0, -8, MANTLE_R * 1.05, MANTLE_R * 1.2, 0, 0, TAU);
        ctx.fillStyle = rgba(LAVENDER, 1);
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = rgba(INK, 1);
        ctx.stroke();
        ctx.fillStyle = rgba(PINK, 1);
        // 점무늬 — (x, y, 반지름) 세 개씩
        const dots = [-12, -24, 4, 6, -30, 5, 14, -12, 4, -18, -6, 3];
        for (let d = 0; d < dots.length; d += 3) {
            ctx.beginPath();
            ctx.arc(dots[d], dots[d + 1], dots[d + 2], 0, TAU);
            ctx.fill();
        }
        ctx.restore();
        for (let s = -1; s <= 1; s += 2) {
            drawEye(mx + s * 11 + tilt * 10, my + 6, 6, tx, ty, 1);
        }
        drawTarget(tx, ty);
    }
    // 한 프레임에 넘기는 시간 상한(초) — 탭을 오래 숨겼다 돌아온 첫 프레임에도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    // 미리 돌리기 — 첫 장면을 그리기 전에 PREWARM 초를 1/60초 걸음으로 계산해 생물이 길 위에 자리 잡은 채 시작한다
    const PREWARM_STEP = 1 / 60;
    // 시연 시계(초) — 8자 길 위의 자리를 정한다
    let simTime = 0;
    // 포인터(판 좌표) — 판 위에 있으면 목표를 포인터 쪽으로 옮긴다. 떠나면 다시 8자 길로 서서히 돌아간다
    let ptrX = W / 2;
    let ptrY = H / 2;
    let ptrOn = false;
    let ptrBlend = 0;
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 손대면 시연 표시를 떼고 알림 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    // 리스너는 한 묶음으로 달고 정리할 때 한 번에 뗀다
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        const live = root.querySelector('[aria-live]');
        if (live) {
            live.setAttribute('aria-live', 'polite');
        }
    }
    // 목표 옮기기 — 8자 길 자리와 포인터 자리를 ptrBlend 비율로 섞고, 그 변화로 목표 속도를 잰다
    function moveTarget(dt) {
        const p = pathAt(simTime);
        ptrBlend = lerp(ptrBlend, ptrOn ? 1 : 0, follow(4, dt));
        const nx = lerp(p[0], ptrX, ptrBlend);
        const ny = lerp(p[1], ptrY, ptrBlend);
        if (dt > 0) {
            tvx = lerp(tvx, (nx - tx) / dt, follow(12, dt));
            tvy = lerp(tvy, (ny - ty) / dt, follow(12, dt));
        }
        tx = nx;
        ty = ny;
    }
    function advance(dt) {
        simTime += dt;
        moveTarget(dt);
        update(dt, tx, ty, tvx, tvy);
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 시계 다시 맞추기 — 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 동작 줄이기 — 루프를 돌리지 않고 쉬는 자세 한 장면만 그린다
    function showRest() {
        stopLoop();
        reset();
        restPose();
        draw();
    }
    function play() {
        reset();
        simTime = 0;
        const p = pathAt(0);
        tx = p[0];
        ty = p[1];
        tvx = 0;
        tvy = 0;
        for (let t = 0; t < PREWARM; t += PREWARM_STEP) {
            advance(PREWARM_STEP);
        }
        draw();
        if (!paused) {
            startLoop();
        }
    }
    function setPointer(ev) {
        const r = cv.getBoundingClientRect();
        ptrX = (ev.clientX - r.left) * W / Math.max(1, r.width);
        ptrY = (ev.clientY - r.top) * H / Math.max(1, r.height);
        ptrOn = true;
        wake();
        // 동작 줄이기에서도 입력은 화면에 남는다 — 쉬는 자세 그대로 눈과 목표 표시만 포인터 쪽으로 다시 그린다
        if (still) {
            tx = ptrX;
            ty = ptrY;
            draw();
        }
    }
    cv.addEventListener('pointermove', setPointer, { signal: off.signal });
    cv.addEventListener('pointerdown', setPointer, { signal: off.signal });
    function leavePointer() { ptrOn = false; }
    cv.addEventListener('pointerleave', leavePointer, { signal: off.signal });
    cv.addEventListener('pointercancel', leavePointer, { signal: off.signal });
    pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 루프를 멈추고, 돌아오면 시계를 다시 맞춰 시작한다 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 페이지를 연 채 바뀌면 — 켜지면 쉬는 자세로 멈추고, 꺼지면 시연을 처음부터
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw();
    }, { signal: off.signal });
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
