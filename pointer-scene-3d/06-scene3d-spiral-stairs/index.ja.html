<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나선 계단 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ss is-demo" id="ssRoot">
  <p class="ss__hint">
    <svg class="ss__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path opacity=".2" d="M52 40h152v28H52zM70 84h116v28H70zM88 128h80v28H88z"/><path d="M128 8a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 46a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 44a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 44a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 44a10 10 0 1 1 0 20 10 10 0 0 1 0-20Z"/></g></svg>
    <span>26段の蹴上げが黄金角で回りながら登ります — ポインターで回転し、上下で視点を上げ下げします。低い段が大きく見えます</span>
  </p>
  <div class="ss__field" id="ssField" role="application" aria-label="螺旋階段遠近実験盤" tabindex="0">
    <canvas class="ss__cv" id="ssCv"></canvas>
  </div>
  <div class="ss__bar">
    <label class="ss__dial">段差
      <input type="range" id="ssRise" min="8" max="26" step="1" value="15" aria-label="段差">
      <b class="ss__val" id="ssRiseVal">15px</b>
    </label>
  </div>
</div>
</main>
<script>
// 나선 계단 — 참 26개. 각 참의 각도는 황금각(2.39996…) 근처 누적, 높이는 i·段差.
// 참은 사다리꼴 채움: 앞변(안쪽 반지름 작음)·뒷변(바깥 반지름 큼)을 원근 스케일로 그린다.
// 카메라는 아래에서 올려다본다 — 높이가 낮은 참이 가깝고 크다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형 3종을 만든다 ──
  var STEPS = 26;          // 참 개수
  var GOLD = 2.39996;      // 황금각(라디안) 근처 — 참마다 돌아가는 각
  var RIN = 40, ROUT = 108; // 참 안쪽·바깥쪽 반지름(px)
  var RISE_K = 0.38;       // 다이얼 段差 → 월드 높이 감쇠(26칸을 패널 안에 다 담는다)
  var BACK = 60;           // 카메라 후퇴 — 위 참의 원근 소실을 완만하게
  var LOOP_MS = 2400;      // 미리보기 가상 포인터의 주기
  // ────────────────────────────────────────────────────

  var root = document.getElementById('ssRoot');
  var field = document.getElementById('ssField');
  var cv = document.getElementById('ssCv');
  var ctx = cv.getContext('2d');
  var riseIn = document.getElementById('ssRise');
  var riseOut = document.getElementById('ssRiseVal');

  var css = getComputedStyle(root);
  function tok(name) { return css.getPropertyValue(name).trim(); }
  var PAL = [tok('--ss-pink'), tok('--ss-mint'), tok('--ss-lilac'), tok('--ss-sky')];   // 참 색 순환
  var INK = tok('--ss-ink');
  var CREAM = tok('--ss-cream');
  var RAIL = tok('--ss-rail');
  var SHADOW = tok('--ss-shadow');

  var TAU = Math.PI * 2;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, dpr = 1;
  var FOCAL = 300;
  var yaw = 0;
  var pitch = -0.46;                 // 올려다보기 — 음수 x축 회전(완만하게 두어 꼭대기까지 보이게)
  var spin = 0;
  var px01 = 0.5, py01 = 0.5;
  var manual = false;
  var last = 0, raf = 0, t0 = -1;

  function fit() {
    var r = field.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // 카메라 — yaw(y축) 뒤 pitch(x축). pitch 가 음수면 위를 올려다본다
  function camRot(p) {
    var ca = Math.cos(yaw), sa = Math.sin(yaw);
    var x1 = p.x * ca + p.z * sa, z1 = -p.x * sa + p.z * ca;
    var cb = Math.cos(pitch), sb = Math.sin(pitch);
    return { x: x1, y: p.y * cb - z1 * sb, z: p.y * sb + z1 * cb };
  }

  function project(p) { var s = FOCAL / (FOCAL + p.z + BACK); return { sx: W * 0.5 + p.x * s, sy: H * 0.76 - p.y * s, s: s }; }

  // 참 네 모서리(월드) — 사다리꼴의 폭이 두께·원근으로 벌어진다
  function treadCorners(i, rise) {
    var ang = i * GOLD + spin;
    var y = i * rise * RISE_K;
    var wide = 0.9 - i / STEPS * 0.42;    // 낮은 참일수록 시야를 넓게 차지하는 각폭
    var a0 = ang - wide, a1 = ang + wide;
    return {
      inA: { x: Math.cos(a0) * RIN, y: y, z: Math.sin(a0) * RIN },
      inB: { x: Math.cos(a1) * RIN, y: y, z: Math.sin(a1) * RIN },
      outA: { x: Math.cos(a0) * ROUT, y: y, z: Math.sin(a0) * ROUT },
      outB: { x: Math.cos(a1) * ROUT, y: y, z: Math.sin(a1) * ROUT }
    };
  }

  function step(dt, now) {
    spin += (0.12 + 1.5 * px01) * dt;              // 포인터 좌우 = 회전
    var aim = -0.28 - (py01 - 0.5) * 0.72;         // 포인터 상하 = 올려보는 각도
    pitch += (aim - pitch) * 0.08;
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    var rise = Number(riseIn.value);
    var scale = Math.min(W / 480, H / 300);

    // 바닥 원 — 계단이 시작하는 자리
    var floor = [];
    for (var g = 0; g <= 36; g++) {
      var ga = g / 36 * TAU;
      floor.push(project(camRot({ x: Math.cos(ga) * (ROUT + 58) * scale, y: 0, z: Math.sin(ga) * (ROUT + 58) * scale })));
    }
    ctx.beginPath();
    ctx.moveTo(floor[0].sx, floor[0].sy);
    for (var gi = 1; gi < floor.length; gi++) ctx.lineTo(floor[gi].sx, floor[gi].sy);
    ctx.closePath();
    ctx.fillStyle = SHADOW;
    ctx.fill();

    // 중심 기둥 — 얇은 잉크 원통(위로 갈수록 가늘어 보이는 투영)
    var axis = [];
    for (var h = 0; h <= 10; h++) {
      axis.push(project(camRot({ x: 0, y: h / 10 * STEPS * rise * RISE_K, z: 0 })));
    }
    ctx.strokeStyle = RAIL;
    ctx.lineWidth = 7 * scale;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(axis[0].sx, axis[0].sy);
    for (var ai = 1; ai < axis.length; ai++) ctx.lineTo(axis[ai].sx, axis[ai].sy);
    ctx.stroke();
    ctx.lineCap = 'butt';

    // 참 — z 내림차순 화가 알고리즘. 사다리꼴 윗면 + 앞단면(두께) 채움
    var items = [];
    for (var i = 0; i < STEPS; i++) {
      (function (idx) {
        var c = treadCorners(idx, rise);
        var pc = camRot({ x: (c.inA.x + c.outB.x) / 2, y: idx * rise * RISE_K, z: (c.inA.z + c.outB.z) / 2 });
        var thick = (4.5 + idx * 0.34) * scale;   // 위 참일수록 두껍게 — 올려다보는 각도에서 밑면이 드러난다
        var col = PAL[idx % 4];
        items.push({ z: pc.z, fn: function () {
          var A = project(camRot(c.inA)), B = project(camRot(c.inB));
          var C = project(camRot(c.outB)), D = project(camRot(c.outA));
          // 앞단면(두께) — 참 아래쪽 어두운 사다리꼴
          ctx.beginPath();
          ctx.moveTo(A.sx, A.sy + thick); ctx.lineTo(B.sx, B.sy + thick);
          ctx.lineTo(C.sx, C.sy + thick); ctx.lineTo(D.sx, D.sy + thick);
          ctx.closePath();
          ctx.fillStyle = 'rgba(23,20,26,0.30)';
          ctx.fill();
          // 윗면 — 파스텔 사다리꼴 채움
          ctx.beginPath();
          ctx.moveTo(A.sx, A.sy); ctx.lineTo(B.sx, B.sy);
          ctx.lineTo(C.sx, C.sy); ctx.lineTo(D.sx, D.sy);
          ctx.closePath();
          ctx.fillStyle = col;
          ctx.fill();
          // 안쪽 가장자리 하이라이트
          ctx.strokeStyle = 'rgba(255,255,255,0.55)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(A.sx, A.sy); ctx.lineTo(B.sx, B.sy);
          ctx.stroke();
        }});
      })(i);
    }
    items.sort(function (a, b2) { return b2.z - a.z; });
    for (var q = 0; q < items.length; q++) items[q].fn();

    // 꼭대기 랜턴 — 마지막 참 위 크림 등불(은은한 빛)
    var top = project(camRot({ x: 0, y: STEPS * rise * RISE_K, z: 0 }));
    var lr = 13 * top.s * scale;
    var lampGlow = ctx.createRadialGradient(top.sx, top.sy, 0, top.sx, top.sy, lr * 2.4);
    lampGlow.addColorStop(0, 'rgba(255,247,230,0.34)');
    lampGlow.addColorStop(1, 'rgba(255,247,230,0)');
    ctx.fillStyle = lampGlow;
    ctx.beginPath(); ctx.arc(top.sx, top.sy, lr * 2.4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(top.sx, top.sy, lr, 0, TAU);
    ctx.fillStyle = CREAM;
    ctx.fill();
    ctx.beginPath(); ctx.arc(top.sx - lr * 0.3, top.sy - lr * 0.3, lr * 0.32, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fill();
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
    last = now;
    if (!manual) {
      var ph = ((now - t0) % LOOP_MS) / LOOP_MS * TAU;
      px01 = 0.5 + 0.38 * Math.sin(ph);
      py01 = 0.5 + 0.32 * Math.sin(2 * ph + 1.05);
    }
    step(dt, now);
    draw(now);
    raf = requestAnimationFrame(frame);
  }

  function setRise(v) { riseOut.textContent = v + 'px'; if (reduce) draw(last); }

  riseIn.addEventListener('input', function () { setRise(riseIn.value); });
  field.addEventListener('pointermove', function (e) {
    var r = field.getBoundingClientRect();
    px01 = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    py01 = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    if (!manual) { manual = true; root.classList.remove('is-demo'); }
    if (reduce) { step(0, last); draw(last); }
  });
  field.addEventListener('pointerleave', function () {
    if (manual) { px01 = 0.5; py01 = 0.5; }
  });
  field.addEventListener('keydown', function (e) {
    var d = { ArrowLeft: [-0.08, 0], ArrowRight: [0.08, 0], ArrowUp: [0, -0.08], ArrowDown: [0, 0.08] }[e.key];
    if (!d) return;
    e.preventDefault();
    if (!manual) { manual = true; root.classList.remove('is-demo'); }
    px01 = Math.max(0, Math.min(1, px01 + d[0]));
    py01 = Math.max(0, Math.min(1, py01 + d[1]));
    if (reduce) { step(0, last); draw(last); }
  });
  window.addEventListener('resize', function () { fit(); if (reduce) draw(last); });

  fit();
  if (reduce) {
    // reduce — 루프 없이 계단이 다 놓인 한 장만 남는다
    px01 = 0.55; py01 = 0.4;
    step(0, 0);
    draw(0);
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
