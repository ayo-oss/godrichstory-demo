<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポインター距離の値で集まって広がるリキッドメタルボタン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lm is-demo" id="root">
  <canvas class="lm__cv" id="cv" width="480" height="300"></canvas>
  <button class="lm__btn" id="btn" type="button">送信</button>
  <p class="lm__hint">ボタンの上でカーソルを動かすと雫が一つに集まります</p>
</div>
</main>
<script>
(function () {
  'use strict';

  function makeLcg(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  var W = 480, H = 300;
  var SEED = 40404;
  var rnd = makeLcg(SEED);

  var GRID_STEP = 4;
  var GRID_W = Math.floor(W / GRID_STEP);
  var GRID_H = Math.floor(H / GRID_STEP);

  var BLOB_COUNT = 7;
  var R_BASE = 32;
  var POINTER_BOOST = 1.5;   // 포인터 거리 값 → 세기 값으로 바뀔 때의 최대 배수
  var POINTER_FALLOFF = 112; // px — 이 거리만큼 멀어지면 세기 값이 절반 아래로 줄어든다
  var BURST_BOOST = 1.7;     // 클릭 시 전체 방울에 한 번에 더해지는 세기 값
  var BURST_MS = 520;
  var THRESH = 1.0;          // 세기 값을 합친 장(場)이 이 문턱을 넘으면 하나로 뭉쳐 보인다
  var EDGE = 0.42;
  var HILITE_SPAN = 1.15;

  var METAL_DARK = [10, 79, 232];
  var METAL_LIGHT = [186, 209, 255];
  var PAPER_BG = [255, 255, 255];

  var root = document.getElementById('root');
  var cv = document.getElementById('cv');
  var btn = document.getElementById('btn');
  var ctx = cv.getContext('2d');
  var reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

  var small = document.createElement('canvas');
  small.width = GRID_W; small.height = GRID_H;
  var sctx = small.getContext('2d');
  var img = sctx.createImageData(GRID_W, GRID_H);

  var blobs = [];
  (function buildBlobs() {
    var cx0 = W / 2, cy0 = H / 2;
    var rx = 152, ry = 66;
    for (var i = 0; i < BLOB_COUNT; i++) {
      var ang = rnd() * Math.PI * 2;
      var rad = 0.32 + rnd() * 0.68;
      blobs.push({
        x: cx0 + Math.cos(ang) * rx * rad,
        y: cy0 + Math.sin(ang) * ry * rad,
        r: R_BASE * (0.72 + rnd() * 0.56)
      });
    }
  })();

  var pointer = null;   // 실제 포인터 좌표 {x,y}
  var burstUntil = 0;   // 클릭 버스트가 끝나는 시각
  var burstFrom = 0;

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  function fieldAt(px, py, now) {
    var burstT = now < burstUntil ? clamp01((burstUntil - now) / BURST_MS) : 0;
    var burstBoost = burstT * BURST_BOOST;
    var sum = 0;
    for (var i = 0; i < blobs.length; i++) {
      var b = blobs[i];
      var boost = burstBoost;
      if (pointer) {
        var dpx = pointer.x - b.x, dpy = pointer.y - b.y;
        var distToPointer = Math.sqrt(dpx * dpx + dpy * dpy);
        boost += POINTER_BOOST * Math.exp(-distToPointer / POINTER_FALLOFF);
      }
      var effR = b.r * (1 + boost);
      var dx = px - b.x, dy = py - b.y;
      var dist2 = dx * dx + dy * dy + 1;
      sum += (effR * effR) / dist2;
    }
    return sum;
  }

  function render(now) {
    var data = img.data;
    var p = 0;
    for (var gy = 0; gy < GRID_H; gy++) {
      var py = gy * GRID_STEP + GRID_STEP / 2;
      for (var gx = 0; gx < GRID_W; gx++) {
        var px = gx * GRID_STEP + GRID_STEP / 2;
        var f = fieldAt(px, py, now);
        var alpha = clamp01((f - (THRESH - EDGE)) / (2 * EDGE));
        var hi = clamp01((f - THRESH) / HILITE_SPAN);
        var r = METAL_DARK[0] + (METAL_LIGHT[0] - METAL_DARK[0]) * hi;
        var g = METAL_DARK[1] + (METAL_LIGHT[1] - METAL_DARK[1]) * hi;
        var b2 = METAL_DARK[2] + (METAL_LIGHT[2] - METAL_DARK[2]) * hi;
        data[p] = r | 0; data[p + 1] = g | 0; data[p + 2] = b2 | 0; data[p + 3] = (alpha * 255) | 0;
        p += 4;
      }
    }
    sctx.putImageData(img, 0, 0);
    ctx.fillStyle = 'rgb(' + PAPER_BG[0] + ',' + PAPER_BG[1] + ',' + PAPER_BG[2] + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(small, 0, 0, GRID_W, GRID_H, 0, 0, W, H);
  }

  function pointFromEvent(e) {
    var r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height)];
  }
  function buttonCenter() {
    var r = btn.getBoundingClientRect(), c = cv.getBoundingClientRect();
    return [(r.left + r.width / 2 - c.left) * (W / c.width), (r.top + r.height / 2 - c.top) * (H / c.height)];
  }

  function press() {
    root.classList.remove('is-demo');
    burstFrom = performance.now();
    burstUntil = burstFrom + BURST_MS;
    if (reduceMQ.matches) render(burstFrom);
  }

  btn.addEventListener('click', press);
  btn.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    press();
  });
  cv.addEventListener('pointerdown', function (e) {
    root.classList.remove('is-demo');
    var p = pointFromEvent(e);
    pointer = { x: p[0], y: p[1] };
    if (reduceMQ.matches) render(performance.now());
  });
  cv.addEventListener('pointermove', function (e) {
    if (root.classList.contains('is-demo')) return;
    var p = pointFromEvent(e);
    pointer = { x: p[0], y: p[1] };
    if (reduceMQ.matches) render(performance.now());
  });
  cv.addEventListener('pointerleave', function () {
    pointer = null;
    if (reduceMQ.matches) render(performance.now());
  });
  window.addEventListener('resize', function () { render(performance.now()); });

  function pathPoint(t) {
    var cx = W / 2, cy = H / 2;
    return {
      x: cx + Math.sin(t * 0.0031) * 168 + Math.sin(t * 0.021) * 10,
      y: cy + Math.sin(t * 0.0052 + 1) * 74 + Math.cos(t * 0.017) * 8
    };
  }

  var autoStart = null;
  function frame(now) {
    if (!reduceMQ.matches) {
      if (autoStart === null) autoStart = now;
      if (root.classList.contains('is-demo')) {
        var t = now - autoStart;
        pointer = pathPoint(t);
      }
      render(now);
      requestAnimationFrame(frame);
    }
  }

  if (reduceMQ.matches) {
    pointer = pathPoint(180);
    render(performance.now());
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
