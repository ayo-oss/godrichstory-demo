<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クリック座標からインクが広がるボタン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ik is-demo" id="root">
  <canvas class="ik__cv" id="cv" width="480" height="300"></canvas>
  <button class="ik__btn" id="btn" type="button">送信する</button>
  <p class="ik__hint">ボタンを押してみてください — 押した場所からインクが広がります</p>
</div>
</main>
<script>
(function () {
  'use strict';

  function makeLcg(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  var W = 480, H = 300;
  var COLS = 60, ROWS = 38;
  var CELL_W = W / COLS, CELL_H = H / ROWS;
  var SEED = 10102;
  var rnd = makeLcg(SEED);

  var DIFFUSE_RATE = 0.46;   // 이웃 평균으로 끌려가는 비율 — 클수록 빨리 번진다
  var DECAY_PER_FRAME = 0.978; // 프레임마다 농도가 줄어드는 비율
  var INK_COLOR = [91, 140, 248]; // $subject-blue-light

  var root = document.getElementById('root');
  var cv = document.getElementById('cv');
  var btn = document.getElementById('btn');
  var ctx = cv.getContext('2d');
  var reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

  var field = new Float32Array(COLS * ROWS);
  var next = new Float32Array(COLS * ROWS);

  function idx(gx, gy) { return gy * COLS + gx; }

  function injectAt(px, py, rIn) {
    var gx = Math.max(0, Math.min(COLS - 1, Math.round(px / CELL_W)));
    var gy = Math.max(0, Math.min(ROWS - 1, Math.round(py / CELL_H)));
    var r = rIn || 4;
    for (var dy = -r; dy <= r; dy++) {
      for (var dx = -r; dx <= r; dx++) {
        var x = gx + dx, y = gy + dy;
        if (x < 0 || x >= COLS || y < 0 || y >= ROWS) continue;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d > r) continue;
        var v = 1 - d / (r + 1);
        var i = idx(x, y);
        field[i] = Math.max(field[i], v);
      }
    }
  }

  function diffuseStep() {
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var i = idx(x, y);
        var sum = 0, n = 0;
        if (x > 0) { sum += field[idx(x - 1, y)]; n++; }
        if (x < COLS - 1) { sum += field[idx(x + 1, y)]; n++; }
        if (y > 0) { sum += field[idx(x, y - 1)]; n++; }
        if (y < ROWS - 1) { sum += field[idx(x, y + 1)]; n++; }
        var avg = n ? sum / n : field[i];
        var v = field[i] + (avg - field[i]) * DIFFUSE_RATE;
        next[i] = v * DECAY_PER_FRAME;
      }
    }
    var tmp = field; field = next; next = tmp;
  }

  function render() {
    ctx.fillStyle = '#17141a';
    ctx.fillRect(0, 0, W, H);
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var v = field[idx(x, y)];
        if (v < 0.02) continue;
        var a = Math.min(1, v);
        ctx.fillStyle = 'rgba(' + INK_COLOR[0] + ',' + INK_COLOR[1] + ',' + INK_COLOR[2] + ',' + a.toFixed(3) + ')';
        ctx.fillRect(x * CELL_W, y * CELL_H, CELL_W + 1, CELL_H + 1);
      }
    }
  }

  function press(px, py) {
    root.classList.remove('is-demo');
    injectAt(px, py, 5);
    injectAt(px + 70, py - 40, 3);
    injectAt(px - 80, py + 30, 3);
    if (reduceMQ.matches) { render(); }
  }

  function pointFromEvent(e) {
    var r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height)];
  }

  btn.addEventListener('click', function () {
    var r = btn.getBoundingClientRect(), c = cv.getBoundingClientRect();
    var cx = (r.left + r.width / 2 - c.left) * (W / c.width);
    var cy = (r.top + r.height / 2 - c.top) * (H / c.height);
    press(cx, cy);
  });
  btn.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    var r = btn.getBoundingClientRect(), c = cv.getBoundingClientRect();
    press((r.left + r.width / 2 - c.left) * (W / c.width), (r.top + r.height / 2 - c.top) * (H / c.height));
  });
  cv.addEventListener('pointerdown', function (e) {
    var p = pointFromEvent(e);
    press(p[0], p[1]);
  });
  window.addEventListener('resize', function () { render(); });

  var autoStart = null;
  var nextAutoAt = 0;
  function syntheticPoint(k) {
    var a = rnd() * Math.PI * 2, r2 = 40 + rnd() * 170;
    return [W / 2 + Math.cos(a) * r2, H / 2 + Math.sin(a) * r2 - k * 0];
  }

  function frame(now) {
    if (!reduceMQ.matches) {
      if (autoStart === null) autoStart = now;
      var t = now - autoStart;
      if (root.classList.contains('is-demo') && t >= nextAutoAt) {
        var p = syntheticPoint(t);
        injectAt(p[0], p[1], 4);
        nextAutoAt = t + 260;
      }
      diffuseStep();
      render();
      requestAnimationFrame(frame);
    }
  }

  if (reduceMQ.matches) {
    injectAt(W / 2, H / 2, 5);
    render();
  } else {
    injectAt(W / 2, H / 2, 6);
    injectAt(W / 2 - 130, H / 2 + 60, 4);
    injectAt(W / 2 + 140, H / 2 - 55, 4);
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
