<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>進行値の分だけ砂のように積もるプログレスボタン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sf is-demo" id="root">
  <canvas class="sf__cv" id="cv" width="480" height="300"></canvas>
  <button class="sf__btn" id="btn" type="button">ダウンロード</button>
  <p class="sf__hint">押すと進行値が上がり、砂粒が積もっていきます</p>
</div>
</main>
<script>
(function () {
  'use strict';

  function makeLcg(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  function hashNoise(x, y, seed) {
    var v = Math.sin(x * 12.9898 + y * 78.233 + seed * 0.0013) * 43758.5453;
    return v - Math.floor(v);
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  var W = 480, H = 300;
  var SEED = 70722;
  var rnd = makeLcg(SEED);

  var BW = 300, BH = 140;
  var BX = (W - BW) / 2, BY = (H - BH) / 2;

  var COLS = 36;
  var COL_W = BW / COLS;
  var GRAVITY = 560;             // px/s^2 — 알갱이가 떨어지는 가속
  var SPAWN_Y = 12;              // 캔버스 위쪽 빈 공간에서부터 떨어뜨린다
  var SPAWN_INTERVAL_MS = 30;
  var EASE_RATE = 5.5;           // 진행 값 → 쌓인 높이 값이 따라붙는 속도

  var root = document.getElementById('root');
  var cv = document.getElementById('cv');
  var btn = document.getElementById('btn');
  var ctx = cv.getContext('2d');
  var reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

  var colJitter = [];
  for (var ci = 0; ci < COLS; ci++) colJitter.push((hashNoise(ci, 7, SEED) - 0.5) * 10);

  var pileHeights = new Float32Array(COLS);
  var grains = [];
  var targetFill = 0;
  var lastSpawn = 0;

  function spawnGrain() {
    var col = Math.floor(rnd() * COLS);
    var size = 3 + rnd() * 3;
    grains.push({ x: BX + col * COL_W + COL_W / 2, y: SPAWN_Y, vy: 40 + rnd() * 30, size: size, col: col });
  }

  function updateGrains(dt) {
    if (grains.length > 90) grains.length = 90;
    for (var i = grains.length - 1; i >= 0; i--) {
      var g = grains[i];
      g.vy += GRAVITY * dt;
      g.y += g.vy * dt;
      var floorY = BY + BH - pileHeights[g.col];
      if (g.y + g.size / 2 >= floorY) grains.splice(i, 1);
    }
  }

  function updatePile(dt) {
    var targetHeight = targetFill * BH;
    for (var c = 0; c < COLS; c++) {
      var t = Math.max(0, Math.min(BH, targetHeight + colJitter[c]));
      pileHeights[c] += (t - pileHeights[c]) * Math.min(1, dt * EASE_RATE);
    }
  }

  function render(now, dt) {
    updateGrains(dt);
    updatePile(dt);

    if (now - lastSpawn >= SPAWN_INTERVAL_MS) {
      lastSpawn = now;
      spawnGrain();
    }

    ctx.clearRect(0, 0, W, H);

    ctx.save();
    roundRect(ctx, BX, BY, BW, BH, 14);
    ctx.clip();
    ctx.fillStyle = '#17141a';
    ctx.fillRect(BX, BY, BW, BH);

    for (var c1 = 0; c1 < COLS; c1++) {
      var h = pileHeights[c1];
      if (h <= 0) continue;
      var x = BX + c1 * COL_W;
      var y = BY + BH - h;
      var grad = ctx.createLinearGradient(0, y, 0, BY + BH);
      grad.addColorStop(0, '#e3c48a');
      grad.addColorStop(1, '#b8925c');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, COL_W + 1, h + 2);
    }

    var speckleCell = 4;
    for (var sy = 0; sy < BH; sy += speckleCell) {
      for (var sx = 0; sx < BW; sx += speckleCell) {
        var col = Math.min(COLS - 1, Math.floor(sx / COL_W));
        var topY = BH - pileHeights[col];
        if (sy < topY) continue;
        var n = hashNoise(sx, sy, SEED);
        if (n > 0.74) {
          ctx.fillStyle = 'rgba(120,90,50,' + (0.25 + n * 0.3).toFixed(3) + ')';
          ctx.fillRect(BX + sx, BY + sy, speckleCell - 1, speckleCell - 1);
        }
      }
    }

    ctx.fillStyle = '#fff7e6';
    ctx.font = '700 18px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('ダウンロード', BW / 2 + BX, BY + 20);

    ctx.restore();

    for (var i2 = 0; i2 < grains.length; i2++) {
      var gr = grains[i2];
      ctx.beginPath();
      ctx.arc(gr.x, gr.y, gr.size / 2, 0, Math.PI * 2);
      ctx.fillStyle = '#d9b171';
      ctx.fill();
    }
  }

  function trigger() {
    root.classList.remove('is-demo');
    targetFill = targetFill > 0.5 ? 0 : 1;
    if (reduceMQ.matches) render(performance.now(), 0.05);
  }

  btn.addEventListener('click', trigger);
  btn.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    trigger();
  });
  cv.addEventListener('pointerdown', function () { trigger(); });
  window.addEventListener('resize', function () { render(performance.now(), 0.016); });

  var lastT = null;
  function frame(now) {
    if (!reduceMQ.matches) {
      var dt = lastT === null ? 0.016 : Math.min(0.05, (now - lastT) / 1000);
      lastT = now;
      if (root.classList.contains('is-demo')) {
        var t = now % 900;
        if (t < 500) targetFill = t / 500;
        else if (t < 600) targetFill = 1;
        else targetFill = Math.max(0, 1 - (t - 600) / 300);
      }
      render(now, dt);
      requestAnimationFrame(frame);
    }
  }

  if (reduceMQ.matches) {
    targetFill = 0.55;
    var th = targetFill * BH;
    for (var c2 = 0; c2 < COLS; c2++) {
      pileHeights[c2] = Math.max(0, Math.min(BH, th + colJitter[c2]));
    }
    render(performance.now(), 0.05);
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
