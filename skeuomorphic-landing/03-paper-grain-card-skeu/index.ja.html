<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper grain card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="paperstack" aria-label="紙目のカード3枚">
    <article class="paperstack__sheet paperstack__sheet--3" aria-hidden="true">
      <span class="paperstack__line"></span><span class="paperstack__line"></span>
    </article>
    <article class="paperstack__sheet paperstack__sheet--2" aria-hidden="true">
      <span class="paperstack__tag">2番目</span>
      <span class="paperstack__line"></span>
    </article>
    <article class="paperstack__sheet paperstack__sheet--1">
      <p class="paperstack__eyebrow">機能カード</p>
      <h2 class="paperstack__title">スムーズな決済</h2>
      <p class="paperstack__desc">目の見える紙のカード</p>
    </article>
  </section>
</main>
</body>
</html>
