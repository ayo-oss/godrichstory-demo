<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper grain card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="paperstack" aria-label="Three grained paper cards">
    <article class="paperstack__sheet paperstack__sheet--3" aria-hidden="true">
      <span class="paperstack__line"></span><span class="paperstack__line"></span>
    </article>
    <article class="paperstack__sheet paperstack__sheet--2" aria-hidden="true">
      <span class="paperstack__tag">Second</span>
      <span class="paperstack__line"></span>
    </article>
    <article class="paperstack__sheet paperstack__sheet--1">
      <p class="paperstack__eyebrow">Feature card</p>
      <h2 class="paperstack__title">Fast checkout</h2>
      <p class="paperstack__desc">A paper card with visible grain</p>
    </article>
  </section>
</main>
</body>
</html>
