<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physically pressable button</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="physkey">
    <div class="physkey__well">
      <span class="physkey__wall" aria-hidden="true"></span>
      <button class="physkey__cap" type="button">
        <span class="physkey__label">Get started</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g></svg>
      </button>
    </div>
    <p class="physkey__caption">Sinks 8px and the wall shrinks</p>
  </section>
</main>
</body>
</html>
