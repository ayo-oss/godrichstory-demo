<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wood grain sliding panels</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="wooddoors" aria-label="Wood grain sliding panels">
    <div class="wooddoors__frame">
      <div class="wooddoors__slot">
        <p class="wooddoors__slot-title">The second story</p>
        <p class="wooddoors__slot-desc">Bright content behind the wood</p>
      </div>
      <div class="wooddoors__leaf wooddoors__leaf--l" aria-hidden="true">
        <span class="wooddoors__knot"></span>
        <span class="wooddoors__handle"></span>
      </div>
      <div class="wooddoors__leaf wooddoors__leaf--r" aria-hidden="true">
        <span class="wooddoors__knot wooddoors__knot--low"></span>
        <span class="wooddoors__handle"></span>
      </div>
    </div>
  </section>
</main>
</body>
</html>
