<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volume knob widget</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="volknob" aria-label="ボリュームノブ">
    <span class="volknob__icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M80 88v80H32a8 8 0 0 1-8-8V96a8 8 0 0 1 8-8Z" opacity=".2"/><path d="M155.51 24.81a8 8 0 0 0-8.42.88L77.25 80H32a16 16 0 0 0-16 16v64a16 16 0 0 0 16 16h45.25l69.84 54.31A8 8 0 0 0 160 224V32a8 8 0 0 0-4.49-7.19M32 96h40v64H32Zm112 111.64l-56-43.55V91.91l56-43.55Zm54-106.08a40 40 0 0 1 0 52.88a8 8 0 0 1-12-10.58a24 24 0 0 0 0-31.72a8 8 0 0 1 12-10.58M248 128a79.9 79.9 0 0 1-20.37 53.34a8 8 0 0 1-11.92-10.67a64 64 0 0 0 0-85.33a8 8 0 1 1 11.92-10.67A79.83 79.83 0 0 1 248 128"/></g></svg>
    </span>
    <div class="volknob__panel">
      <span class="volknob__tick volknob__tick--1" aria-hidden="true"></span>
      <span class="volknob__tick volknob__tick--2" aria-hidden="true"></span>
      <span class="volknob__tick volknob__tick--3" aria-hidden="true"></span>
      <span class="volknob__tick volknob__tick--4" aria-hidden="true"></span>
      <span class="volknob__tick volknob__tick--5" aria-hidden="true"></span>
      <div class="volknob__knob">
        <span class="volknob__needle" aria-hidden="true"></span>
      </div>
    </div>
    <p class="volknob__label">音量調整</p>
  </section>
</main>
</body>
</html>
