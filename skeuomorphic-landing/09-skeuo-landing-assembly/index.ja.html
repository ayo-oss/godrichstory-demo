<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeuomorphic one page preview</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="minipage" aria-label="質感3か所だけのミニLP">
    <div class="minipage__frame">
      <div class="minipage__track">
        <header class="minipage__nav">
          <span class="minipage__navdot"></span>
          <span class="minipage__navlink"></span>
          <span class="minipage__navlink"></span>
        </header>
        <section class="minipage__hero">
          <p class="minipage__hero-eyebrow">質感ランディング</p>
          <span class="minipage__hero-bar"></span>
          <span class="minipage__hero-bar minipage__hero-bar--short"></span>
          <span class="minipage__hero-btn">始める</span>
        </section>
        <section class="minipage__features">
          <article class="minipage__fcard"><span class="minipage__fdot"></span><span class="minipage__fline"></span></article>
          <article class="minipage__fcard"><span class="minipage__fdot minipage__fdot--b"></span><span class="minipage__fline"></span></article>
          <article class="minipage__fcard"><span class="minipage__fdot minipage__fdot--c"></span><span class="minipage__fline"></span></article>
        </section>
        <section class="minipage__cta">
          <span class="minipage__dial" aria-hidden="true"><span class="minipage__dial-cap"></span></span>
          <span class="minipage__cta-btn">無料で始める</span>
        </section>
        <section class="minipage__pricing">
          <p class="minipage__plan">Proメンバーシップ</p>
          <p class="minipage__price">月額₩24,000</p>
          <span class="minipage__stitch" aria-hidden="true"></span>
        </section>
        <section class="minipage__quote">
          <span class="minipage__avatar"></span>
          <span class="minipage__qline"></span>
          <span class="minipage__qline minipage__qline--short"></span>
        </section>
        <section class="minipage__faq">
          <span class="minipage__qrow"></span>
          <span class="minipage__qrow minipage__qrow--open">
            <span class="minipage__qbody"></span>
          </span>
          <span class="minipage__qrow"></span>
        </section>
        <footer class="minipage__foot">
          <span class="minipage__footdot"></span>
          <span class="minipage__footdot"></span>
          <span class="minipage__footdot"></span>
        </footer>
      </div>
    </div>
    <div class="minipage__notes">
      <p class="minipage__note minipage__note--tex">質感3か所 — 木目ナビ・メタルダイヤル・レザーカード</p>
      <p class="minipage__note">残りの区間は明るいフラットで対比</p>
      <p class="minipage__note">スクロールが質感の場所を教える</p>
    </div>
  </section>
</main>
</body>
</html>
