<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metal dial CTA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="metaldial">
    <p class="metaldial__label">무료로 시작</p>
    <button class="metaldial__dial" type="button" aria-label="무료로 시작">
      <span class="metaldial__rim" aria-hidden="true"></span>
      <span class="metaldial__face" aria-hidden="true"></span>
      <span class="metaldial__cap" aria-hidden="true"></span>
      <span class="metaldial__pointer" aria-hidden="true"></span>
    </button>
    <p class="metaldial__hint">다이얼을 돌려 살펴 보세요</p>
  </section>
</main>
</body>
</html>
