<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mouse-move parallax — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <div class="mousepar">
    <div class="mousepar__layer mousepar__layer--a" style="--depth:.3" aria-hidden="true"></div>
    <div class="mousepar__layer mousepar__layer--b" style="--depth:.6" aria-hidden="true"></div>
    <div class="mousepar__layer mousepar__layer--c" style="--depth:1" aria-hidden="true"></div>
    <p class="mousepar__label">Bám theo con trỏ</p>
  </div>
</main>
<script>
// 실제 사용: 커서 위치를 -0.5~0.5 로 정규화해 CSS 변수로 넘긴다. 레이어는 --depth 로 배율만 다르게 받는다.
var el = document.querySelector('.mousepar');
el.addEventListener('pointermove', function (e) {
  var r = el.getBoundingClientRect();
  el.style.setProperty('--mx', ((e.clientX - r.left) / r.width - 0.5).toFixed(3));
  el.style.setProperty('--my', ((e.clientY - r.top) / r.height - 0.5).toFixed(3));
});
</script>
</body>
</html>
