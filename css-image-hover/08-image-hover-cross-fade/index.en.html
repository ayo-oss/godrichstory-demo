<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image hover — two-image cross-fade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="photo is-demo" tabindex="0">
    <span class="photo__frame" aria-hidden="true">
      <span class="photo__a">
        <span class="photo__sun"></span>
        <span class="photo__hill"></span>
      </span>
      <span class="photo__b">
        <span class="photo__sun photo__sun--b"></span>
        <span class="photo__hill photo__hill--b"></span>
      </span>
    </span>
    <figcaption class="photo__cap">Color options</figcaption>
  </figure>
</main>
</body>
</html>
