<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowing wait — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ctaskm is-demo" id="ctaskm">
  <div class="ctaskm__panel">
    <button class="ctaskm__btn ctaskm__btn--loading" id="ctaskmBtn" type="button">
      <span class="ctaskm__sweep" id="ctaskmSweep"></span>
      <span class="ctaskm__label" id="ctaskmLabel">Submit the form</span>
    </button>
    <span class="ctaskm__hint">Click and it switches to a submission-pending state</span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('ctaskm');
  var btn = document.getElementById('ctaskmBtn');
  var sweep = document.getElementById('ctaskmSweep');
  var label = document.getElementById('ctaskmLabel');

  // 계산 겹: sweep 의 가로 위치 값을 ease-in-out(사인 곡선)으로 매 프레임 계산해
  // 한쪽 끝(-BAND)에서 반대쪽 끝(100+BAND)까지 흐르게 한다 — 등속 CSS keyframe 이 아니라
  // 위치 자체를 sin() 로 가감속시킨다.
  var BAND = 34, CYCLE = 1100;
  var raf = null, startT = 0, loading = false;

  function easeInOutSine(t) { return -(Math.cos(Math.PI * t) - 1) / 2; }

  function frame(now) {
    var t = ((now - startT) % CYCLE) / CYCLE;
    var e = easeInOutSine(t);
    var pos = -BAND + e * (100 + BAND * 2);
    sweep.style.transform = 'translateX(' + pos.toFixed(1) + '%)';
    if (loading) { raf = requestAnimationFrame(frame); } else { raf = null; }
  }
  function startLoading() {
    if (loading) { return; }
    loading = true;
    btn.classList.add('ctaskm__btn--loading');
    label.style.opacity = '0';
    startT = performance.now();
    raf = requestAnimationFrame(frame);
    setTimeout(function () {
      loading = false;
      btn.classList.remove('ctaskm__btn--loading');
      label.style.opacity = '1';
      label.textContent = 'Submission complete';
      setTimeout(function () { label.textContent = 'Submit the form'; }, 500);
    }, 1400);
  }

  function wireReal() {
    btn.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); startLoading(); });
  }
  wireReal();

  var autoplayTimer = null;
  function stopAutoplay() { if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { startLoading(); autoplayTimer = setInterval(startLoading, 2000); }
})();
</script>
</main>
</body>
</html>
