<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perimeter countdown — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ctaprc is-demo" id="ctaprc">
  <div class="ctaprc__panel">
    <div class="ctaprc__wrap">
      <svg class="ctaprc__ring" viewBox="0 0 84 84" id="ctaprcSvg">
        <circle class="ctaprc__track" cx="42" cy="42" r="38"></circle>
        <circle class="ctaprc__bar" id="ctaprcBar" cx="42" cy="42" r="38"></circle>
      </svg>
      <button class="ctaprc__btn" id="ctaprcBtn" type="button">Next step</button>
    </div>
    <span class="ctaprc__hint">Click and it automatically moves to the next step after 1.5 seconds</span>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('ctaprc');
  var btn = document.getElementById('ctaprcBtn');
  var bar = document.getElementById('ctaprcBar');

  // 계산 겹: 반지름(r)으로 둘레(circumference = 2*PI*r)를 구하고, 남은 시간 비율(progress)을
  // stroke-dashoffset = circumference * (1 - progress) 산술로 매 프레임 다시 그린다.
  var R = 38;
  var CIRC = 2 * Math.PI * R;
  bar.style.strokeDasharray = CIRC.toFixed(2);
  var DURATION = 1500;
  var raf = null, startT = 0, running = false;

  function frame(now) {
    var t = now - startT;
    var progress = Math.min(1, t / DURATION);
    var offset = CIRC * (1 - progress);
    bar.style.strokeDashoffset = offset.toFixed(2);
    if (progress < 1) {
      raf = requestAnimationFrame(frame);
    } else {
      running = false; raf = null;
      btn.textContent = 'Completed';
      setTimeout(function () { btn.textContent = 'Next step'; bar.style.strokeDashoffset = CIRC.toFixed(2); }, 500);
    }
  }
  function startCountdown() {
    if (running) { return; }
    running = true;
    startT = performance.now();
    raf = requestAnimationFrame(frame);
  }

  function wireReal() {
    btn.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); startCountdown(); });
  }
  wireReal();
  bar.style.strokeDashoffset = CIRC.toFixed(2);

  var autoplayTimer = null;
  function stopAutoplay() { if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { startCountdown(); autoplayTimer = setInterval(startCountdown, 2000); }
})();
</script>
</body>
</html>
