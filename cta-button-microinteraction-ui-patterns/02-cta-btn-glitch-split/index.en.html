<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split offset — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ctagls is-demo" id="ctagls">
  <div class="ctagls__panel">
    <button class="ctagls__btn" id="ctaglsBtn" type="button">
      <span class="ctagls__layer ctagls__layer--a" id="ctaglsA">Buy limited edition</span>
      <span class="ctagls__layer ctagls__layer--b" id="ctaglsB" aria-hidden="true">Buy limited edition</span>
    </button>
    <span class="ctagls__hint">Hover to briefly offset the text layers</span>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('ctagls');
  var btn = document.getElementById('ctaglsBtn');
  var layerA = document.getElementById('ctaglsA');
  var layerB = document.getElementById('ctaglsB');

  // 계산 겹: mulberry32 시드 난수로 어긋남 폭을 매 틱 정하고, 정해진 시간(320ms) 동안
  // TICK 간격으로 흔들다가 마지막엔 반드시 0 으로 되돌린다 — 재생마다 같은 시드로 같은 패턴.
  var SEED = 20260920;
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(SEED);
  var DURATION = 320, TICK = 40;
  var glitchTimer = null;

  function runGlitch() {
    if (glitchTimer) { return; }
    var elapsed = 0;
    glitchTimer = setInterval(function () {
      elapsed += TICK;
      if (elapsed >= DURATION) {
        clearInterval(glitchTimer); glitchTimer = null;
        layerA.style.transform = 'translate(0px,0px)';
        layerB.style.transform = 'translate(0px,0px)';
        return;
      }
      var ax = (rng() - 0.5) * 10;
      var ay = (rng() - 0.5) * 4;
      var bx = (rng() - 0.5) * 10;
      var by = (rng() - 0.5) * 4;
      layerA.style.transform = 'translate(' + ax.toFixed(1) + 'px,' + ay.toFixed(1) + 'px)';
      layerB.style.transform = 'translate(' + bx.toFixed(1) + 'px,' + by.toFixed(1) + 'px)';
    }, TICK);
  }

  function wireReal() {
    btn.addEventListener('mouseenter', function () { root.classList.remove('is-demo'); stopAutoplay(); runGlitch(); });
    btn.addEventListener('focus', function () { root.classList.remove('is-demo'); stopAutoplay(); runGlitch(); });
    btn.addEventListener('click', function () { runGlitch(); });
  }
  wireReal();

  var autoplayTimer = null;
  function stopAutoplay() { if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoplayTimer = setInterval(runGlitch, 900); }
})();
</script>
</body>
</html>
