<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar response — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ctavum is-demo" id="ctavum">
  <div class="ctavum__panel">
    <button class="ctavum__btn" id="ctavumBtn" type="button">
      <span class="ctavum__bars" id="ctavumBars"></span>
      <span class="ctavum__label">Turn on notification sound</span>
    </button>
    <span class="ctavum__hint">Each click makes the bars jump then settle</span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('ctavum');
  var btn = document.getElementById('ctavumBtn');
  var barsWrap = document.getElementById('ctavumBars');
  var N = 5;
  var bars = [];
  for (var i = 0; i < N; i++) {
    var el = document.createElement('span');
    el.className = 'ctavum__bar';
    barsWrap.appendChild(el);
    bars.push({ el: el, h: 0.14 });
  }

  // 계산 겹: 클릭마다 막대별 목표 높이 값을 서로 다른 난수로 정하고, 매 프레임
  // 현재 높이에서 목표까지 감쇠(DECAY)시켜 실제 VU 미터의 피크-감쇠 곡선을 흉내낸다.
  var DECAY = 0.14, MIN_H = 0.14;
  var raf = null;

  function render() {
    for (var i = 0; i < N; i++) {
      bars[i].el.style.height = (bars[i].h * 100).toFixed(1) + '%';
    }
  }
  function tick() {
    var moving = false;
    for (var i = 0; i < N; i++) {
      var b = bars[i];
      var diff = MIN_H - b.h;
      if (b.h > MIN_H) {
        b.h += diff * DECAY;
        if (b.h - MIN_H > 0.004) { moving = true; } else { b.h = MIN_H; }
      }
    }
    render();
    if (moving) { raf = requestAnimationFrame(tick); } else { raf = null; }
  }
  function hit() {
    for (var i = 0; i < N; i++) {
      bars[i].h = Math.max(bars[i].h, MIN_H + Math.random() * 0.82);
    }
    render();
    if (!raf) { raf = requestAnimationFrame(tick); }
  }

  function wireReal() {
    btn.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); hit(); });
  }
  wireReal();
  render();

  var autoplayTimer = null;
  function stopAutoplay() { if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { hit(); autoplayTimer = setInterval(hit, 420); }
})();
</script>
</main>
</body>
</html>
