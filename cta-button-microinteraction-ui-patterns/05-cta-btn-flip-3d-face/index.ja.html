<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>立体反転 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ctaflp is-demo" id="ctaflp">
  <div class="ctaflp__panel">
    <div class="ctaflp__scene">
      <button class="ctaflp__btn" id="ctaflpBtn" type="button">
        <span class="ctaflp__face ctaflp__face--front">この商品</span>
        <span class="ctaflp__face ctaflp__face--back">あの商品</span>
      </button>
    </div>
    <span class="ctaflp__hint">クリックするたびに反対の面に反転します</span>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('ctaflp');
  var btn = document.getElementById('ctaflpBtn');

  // 계산 겹: 회전 값이 목표(180도 배수)를 향해 감쇠 진동식으로 접근한다 —
  // 매 프레임 목표를 살짝 넘었다가(오버슈트) 스프링 곡선으로 제자리에 앉는다.
  var current = 0, base = 0, raf = null, startT = 0;
  var OVERSHOOT_DEG = 18, FREQ = 14, DECAY = 9, DUR = 500;

  function ease(tSec) {
    if (tSec <= 0) { return 0; }
    var settle = 1 - Math.exp(-DECAY * tSec);
    var wobble = Math.sin(tSec * FREQ) * Math.exp(-DECAY * tSec) * (OVERSHOOT_DEG / 180);
    return settle + wobble;
  }
  function frame(now) {
    var t = (now - startT) / 1000;
    var p = Math.min(1, ease(t));
    current = base + p * 180;
    btn.style.transform = 'rotateY(' + current.toFixed(2) + 'deg)';
    if (t < DUR / 1000) {
      raf = requestAnimationFrame(frame);
    } else {
      base = base + 180;
      current = base;
      btn.style.transform = 'rotateY(' + current.toFixed(2) + 'deg)';
      raf = null;
    }
  }
  function flip() {
    if (raf) { return; }
    startT = performance.now();
    raf = requestAnimationFrame(frame);
  }

  function wireReal() {
    btn.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); flip(); });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { root.classList.remove('is-demo'); stopAutoplay(); flip(); }
    });
  }
  wireReal();

  var autoplayTimer = null;
  function stopAutoplay() { if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoplayTimer = setInterval(flip, 700); }
})();
</script>
</body>
</html>
