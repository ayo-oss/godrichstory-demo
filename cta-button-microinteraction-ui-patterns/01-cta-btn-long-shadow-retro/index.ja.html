<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロングシャドウ・レトロ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ctalsr is-demo" id="ctalsr">
  <div class="ctalsr__panel">
    <button class="ctalsr__btn" id="ctalsrBtn" type="button">今すぐ始める</button>
    <span class="ctalsr__hint">ホバーすると影の長さが伸びます</span>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('ctalsr');
  var btn = document.getElementById('ctalsrBtn');

  // 계산 겹: 그림자 길이 값을 매 프레임 목표로 선형 보간(0.28)해 부드럽게 좇고,
  // 그 길이만큼 45도 방향(dx=dy=1px)으로 레이어를 쌓아 box-shadow 문자열을 만든다.
  // 레이어마다 색을 옅은 파랑에서 짙은 잉크색으로 선형 보간해 원근감을 준다.
  var MAXLEN = 22;
  var C_NEAR = [47, 109, 246];   // $subject-blue
  var C_FAR = [23, 20, 26];      // $subject-ink
  var len = 0, target = 0, raf = null;

  function lerp(a, b, t) { return a + (b - a) * t; }

  function buildShadow(l) {
    var n = Math.round(l);
    if (n <= 0) { return 'none'; }
    var parts = [];
    for (var i = 1; i <= n; i++) {
      var t = i / n;
      var r = Math.round(lerp(C_NEAR[0], C_FAR[0], t));
      var g = Math.round(lerp(C_NEAR[1], C_FAR[1], t));
      var b = Math.round(lerp(C_NEAR[2], C_FAR[2], t));
      parts.push(i + 'px ' + i + 'px 0 rgb(' + r + ',' + g + ',' + b + ')');
    }
    return parts.join(',');
  }

  function step() {
    var diff = target - len;
    len += diff * 0.28;
    if (Math.abs(diff) < 0.05) { len = target; }
    btn.style.boxShadow = buildShadow(len);
    if (Math.abs(target - len) > 0.05) {
      raf = requestAnimationFrame(step);
    } else {
      raf = null;
    }
  }
  function go(to) {
    target = to;
    if (raf === null) { raf = requestAnimationFrame(step); }
  }

  function wireReal() {
    btn.addEventListener('mouseenter', function () { root.classList.remove('is-demo'); stopAutoplay(); go(MAXLEN); });
    btn.addEventListener('mouseleave', function () { go(0); });
    btn.addEventListener('focus', function () { root.classList.remove('is-demo'); stopAutoplay(); go(MAXLEN); });
    btn.addEventListener('blur', function () { go(0); });
  }
  wireReal();

  var hovered = false;
  var autoplayTimer = null;
  function autoplayTick() { hovered = !hovered; go(hovered ? MAXLEN : 0); }
  function stopAutoplay() { if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoplayTimer = setInterval(autoplayTick, 700); }
  btn.style.boxShadow = 'none';
})();
</script>
</body>
</html>
