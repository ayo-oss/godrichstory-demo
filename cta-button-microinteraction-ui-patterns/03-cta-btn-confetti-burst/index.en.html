<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burst scatter — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ctacfb is-demo" id="ctacfb">
  <div class="ctacfb__panel">
    <div class="ctacfb__wrap">
      <canvas class="ctacfb__canvas" id="ctacfbCanvas" width="220" height="120"></canvas>
      <button class="ctacfb__btn" id="ctacfbBtn" type="button">Complete purchase</button>
    </div>
    <span class="ctacfb__hint">Click to scatter pieces in every direction</span>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('ctacfb');
  var btn = document.getElementById('ctacfbBtn');
  var canvas = document.getElementById('ctacfbCanvas');
  var ctx = canvas.getContext('2d');
  var COLORS = ['#5b8cf8', '#ff9ebb', '#4cd4a6', '#b9a0ff'];

  // 계산 겹: 조각마다 각도·속도 값을 난수로 부여하고, 매 프레임 중력(GRAVITY)을 속도에
  // 더하고 속도에 감쇠(DRAG)를 곱해 궤적을 계산한다. 회전 값도 각자 다른 속도로 누적하고
  // 투명도 값은 남은 수명 비율로 계산해 사라진다.
  var GRAVITY = 420, DRAG = 0.985, LIFE = 900;
  var particles = [];
  var raf = null, lastT = 0;

  function burst() {
    var cx = canvas.width / 2, cy = canvas.height * 0.35;
    particles = [];
    for (var i = 0; i < 18; i++) {
      var angle = (Math.PI * 2 * i) / 18 + (Math.random() - 0.5) * 0.5;
      var speed = 90 + Math.random() * 110;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 60,
        rot: Math.random() * Math.PI,
        vrot: (Math.random() - 0.5) * 10,
        color: COLORS[i % COLORS.length],
        age: 0
      });
    }
    if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(tick); }
  }

  function tick(now) {
    var dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var alive = false;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.age += dt * 1000;
      if (p.age >= LIFE) { continue; }
      alive = true;
      p.vy += GRAVITY * dt;
      p.vx *= DRAG; p.vy *= DRAG;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vrot * dt;
      var op = Math.max(0, 1 - p.age / LIFE);
      ctx.save();
      ctx.globalAlpha = op;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-4, -3, 8, 6);
      ctx.restore();
    }
    if (alive) {
      raf = requestAnimationFrame(tick);
    } else {
      raf = null;
    }
  }

  function wireReal() {
    btn.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); burst(); });
  }
  wireReal();

  var autoplayTimer = null;
  function stopAutoplay() { if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoplayTimer = setInterval(burst, 1100); }
})();
</script>
</body>
</html>
