<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequential reveal — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ctatwr is-demo" id="ctatwr">
  <div class="ctatwr__panel">
    <button class="ctatwr__btn" id="ctatwrBtn" type="button">
      <span class="ctatwr__phrase ctatwr__phrase--first" id="ctatwrFirst">Learn more</span>
      <span class="ctatwr__phrase ctatwr__phrase--second" id="ctatwrSecond" aria-hidden="true"></span>
    </button>
    <span class="ctatwr__hint">Hover and the second phrase appears character by character</span>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('ctatwr');
  var btn = document.getElementById('ctatwrBtn');
  var first = document.getElementById('ctatwrFirst');
  var second = document.getElementById('ctatwrSecond');
  var TEXT = '30% off right now';

  // 계산 겹: 각 글자의 등장 지연 값을 순서(i) 의 0.82제곱에 비례하게 계산해
  // 뒤로 갈수록 지연 간격이 좁아지는(가속하는) 타자기 리듬을 만든다.
  var BASE = 70;
  TEXT.split('').forEach(function (ch, i) {
    var span = document.createElement('span');
    span.textContent = ch === ' ' ? ' ' : ch;
    span.style.transitionDelay = (Math.pow(i, 0.82) * BASE).toFixed(0) + 'ms';
    second.appendChild(span);
  });
  var maxDelay = Math.pow(TEXT.length - 1, 0.82) * BASE + 260;

  function reveal() {
    second.classList.add('is-shown');
    first.classList.add('is-hidden');
  }
  function hide() {
    second.classList.remove('is-shown');
    first.classList.remove('is-hidden');
  }

  function wireReal() {
    btn.addEventListener('mouseenter', function () { root.classList.remove('is-demo'); stopAutoplay(); reveal(); });
    btn.addEventListener('mouseleave', hide);
    btn.addEventListener('focus', function () { root.classList.remove('is-demo'); stopAutoplay(); reveal(); });
    btn.addEventListener('blur', hide);
  }
  wireReal();

  var shown = false, autoplayTimer = null;
  function autoplayTick() { shown = !shown; if (shown) { reveal(); } else { hide(); } }
  function stopAutoplay() { if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoplayTimer = setInterval(autoplayTick, maxDelay + 500); }
})();
</script>
</body>
</html>
