<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封筒に変わってふたが折れ、封をされるメール送信ボタン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sb is-demo" id="sb">
  <div class="sb__scene" data-role="scene">
    <canvas class="sb__canvas" data-role="canvas" width="480" height="300" aria-hidden="true"></canvas>
    <button class="ev__send" data-role="send" type="button"><span class="ev__label" data-role="label">メールを送る</span></button>
    <p class="sb__status" data-role="status" aria-live="off">送信の準備ができました</p>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("sb");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    // 파스텔 팔레트 — 캔버스와 스크립트가 칠하는 색은 여기서만 고른다 (scss 쪽 색은 demo-tokens)
    const INK = [38, 33, 52];
    const PAPER = [255, 252, 246];
    const CREAM = [255, 243, 224];
    const SKY = [158, 208, 255];
    const LILAC = [200, 184, 255];
    const MINT = [156, 228, 204];
    const PINK = [255, 182, 204];
    const PEACH = [255, 214, 184];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeOut(x) { const c = clamp(x, 0, 1); return 1 - Math.pow(1 - c, 3); }
    function easeInOut(x) {
        const c = clamp(x, 0, 1);
        return c < 0.5 ? 4 * c * c * c : 1 - Math.pow(-2 * c + 2, 3) / 2;
    }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
    // 시드 고정 난수 — 같은 시드면 같은 값이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    const sceneEl = root.querySelector('[data-role="scene"]');
    const statusEl = root.querySelector('[data-role="status"]');
    if (!sceneEl || !statusEl) {
        return;
    }
    const scene = sceneEl;
    const status = statusEl;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    const still = reduceQuery.matches;
    const resizeHooks = [];
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 처음 상태로 돌린 뒤 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
        resetIdle();
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    // 장면 배율 — 480×300 좌표로 짠 판을 상자 폭에 맞춰 통째로 줄인다
    let k = 1;
    function fitScene() {
        const w = root.clientWidth;
        k = w > 0 ? w / W : 1;
        scene.style.transform = 'scale(' + k.toFixed(4) + ')';
    }
    // 화면 좌표(CSS px) → 장면 좌표(480×300). 줄인 배율 k 로 나눠야 판 안의 위치가 된다
    function toScene(clientX, clientY) {
        const r = root.getBoundingClientRect();
        return [(clientX - r.left) / k, (clientY - r.top) / k];
    }
    // 캡처 단계에서 듣는다 — 버튼 자신의 pointerdown 보다 먼저 시연을 끝내야 사람의 첫 누름이 처음 상태에서 시작한다
    root.addEventListener('pointerdown', wake, true);
    root.addEventListener('keydown', wake, true);
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    let dprNow = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        dprNow = dpr;
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    fitCanvas();
    resizeHooks.push(fitCanvas);
    // 감쇠 스프링 한 걸음 — 질량 1, 강성 stiff, 감쇠비 zeta. 속도를 먼저 바꾸고 그 속도로 위치를 옮긴다(반암시적 오일러)
    function springStep(s, stiff, zeta, dtMs) {
        const dt = dtMs / 1000;
        const c = 2 * zeta * Math.sqrt(stiff);
        const a = -stiff * (s.x - s.target) - c * s.v;
        s.v += a * dt;
        s.x += s.v * dt;
    }
    // 봉투(장면 px) — 버튼 180×56 이 같은 너비의 봉투 180×112 로 늘어난다
    const EX = 150;
    const EY = 104;
    const EW = 180;
    const EH = 112;
    const BTN_H = 56;
    const ECX = EX + EW / 2;
    const ECY = EY + EH / 2;
    // 덮개 회전 각 — 180° 는 위로 활짝 열린 자리, 0° 는 앞면에 닫힌 자리. 윗변이 회전축이다
    const FLAP_DEG = 180;
    // 덮개가 180° 에서 0° 까지 닫히는 시간
    const FLAP_MS = 480;
    // 봉인 스티커 스프링에 처음 주는 속도(1/s) — 클수록 크기 1 을 더 넘었다 돌아온다
    const SEAL_POP = 12;
    const SEAL_K = 420;
    const SEAL_ZETA = 0.32;
    const FLAP_H = 66;
    const FOCAL = 500;
    const MORPH_MS = 160;
    const LETTER_MS = 360;
    const SEAL_MS = 360;
    const AWAY_MS = 420;
    const BACK_MS = 280;
    const DEMO_CYCLE = 3000;
    const TXT_IDLE = 'メールを送る';
    const TXT_SENT = '送信済み';
    const TXT_READY = '送信の準備ができました';
    const TXT_FOLD = '封筒に入れてふたを閉じています';
    const TXT_DONE = '送信しました — メールを受け取りました';
    const sendEl = root.querySelector('[data-role="send"]');
    const labelEl = root.querySelector('[data-role="label"]');
    if (!sendEl || !labelEl) {
        return;
    }
    const send = sendEl;
    const label = labelEl;
    const seal = { x: 0, v: 0, target: 1 };
    let phase = 'idle';
    let pt = 0;
    let demoNext = 200;
    function project(p) {
        const s = FOCAL / (FOCAL + p[2]);
        return [ECX + (p[0] - ECX) * s, ECY + (p[1] - ECY) * s];
    }
    // 덮개 끝점 — 윗변(y = EY)을 축으로 deg 만큼 세운다. 90° 에서 화면 쪽(z 음수)으로 가장 튀어나온다
    function flapTip(deg) {
        const a = deg * Math.PI / 180;
        return [ECX, EY + FLAP_H * Math.cos(a), -FLAP_H * Math.sin(a)];
    }
    // 90° 를 넘었는가 — 넘으면 덮개의 안쪽 면이 보이고 몸통 뒤에 그린다
    function flapInsideVisible(deg) { return deg > 90; }
    function flapDegAt(t) { return FLAP_DEG * (1 - easeInOut(t / FLAP_MS)); }
    function poly(pts, fill, line) {
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i += 1) {
            ctx.lineTo(pts[i][0], pts[i][1]);
        }
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.strokeStyle = line;
        ctx.lineWidth = 1;
        ctx.lineJoin = 'round';
        ctx.stroke();
    }
    function drawFlap(deg) {
        const tip = project(flapTip(deg));
        const shade = 0.78 + 0.22 * Math.abs(Math.cos(deg * Math.PI / 180));
        const base = flapInsideVisible(deg) ? mix(PEACH, INK, 0.16) : PEACH;
        poly([[EX, EY], [EX + EW, EY], tip], rgba(mix(mix(base, INK, 0.3), base, shade), 1), rgba(INK, 0.2));
    }
    function drawLetter(top) {
        ctx.fillStyle = rgba(PAPER, 1);
        ctx.fillRect(EX + 12, top, EW - 24, 92);
        ctx.fillStyle = rgba(LILAC, 0.9);
        ctx.fillRect(EX + 26, top + 16, 72, 6);
        ctx.fillStyle = rgba(INK, 0.16);
        ctx.fillRect(EX + 26, top + 30, 124, 4);
        ctx.fillRect(EX + 26, top + 40, 104, 4);
    }
    function drawEnvelope(h, letterTop, deg, sealScale) {
        const top = ECY - h / 2;
        const bottom = ECY + h / 2;
        if (flapInsideVisible(deg)) {
            drawFlap(deg);
        }
        poly([[EX, top], [EX + EW, top], [EX + EW, bottom], [EX, bottom]], rgba(mix(PEACH, INK, 0.1), 1), rgba(INK, 0.2));
        if (letterTop < 900) {
            drawLetter(letterTop);
        }
        // 앞 주머니 — 양옆 삼각형 두 장 + 아래 삼각형 한 장
        const mid = top + h * 0.58;
        poly([[EX, top + 2], [ECX - 6, mid], [EX, bottom]], rgba(mix(PEACH, PAPER, 0.35), 1), rgba(INK, 0.14));
        poly([[EX + EW, top + 2], [ECX + 6, mid], [EX + EW, bottom]], rgba(mix(PEACH, PAPER, 0.35), 1), rgba(INK, 0.14));
        poly([[EX, bottom], [ECX, top + h * 0.46], [EX + EW, bottom]], rgba(mix(PEACH, PAPER, 0.15), 1), rgba(INK, 0.16));
        if (!flapInsideVisible(deg)) {
            drawFlap(deg);
        }
        if (sealScale > 0.01) {
            const tip = flapTip(0);
            ctx.save();
            ctx.translate(tip[0], tip[1]);
            ctx.scale(sealScale, sealScale);
            ctx.fillStyle = rgba(PINK, 1);
            ctx.beginPath();
            ctx.arc(0, 0, 13, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = rgba(PAPER, 0.95);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 7.5, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    }
    // 자리표시 — 버튼 자리(150, 132, 180×56)를 送信済み 색(scss 의 #b4ecd9)으로 옅게
    const SENT = [180, 236, 217];
    const GHOST_ALPHA = 0.5;
    function drawGhost(a) {
        if (a <= 0.01) {
            return;
        }
        ctx.fillStyle = rgba(SENT, a);
        ctx.beginPath();
        ctx.roundRect(EX, ECY - BTN_H / 2, EW, BTN_H, 8);
        ctx.fill();
    }
    function setButton(scale, alpha) {
        send.style.transform = scale === 1 ? '' : 'scale(' + scale.toFixed(3) + ')';
        send.style.opacity = alpha === 1 ? '' : alpha.toFixed(3);
    }
    function resetIdle() {
        phase = 'idle';
        pt = 0;
        seal.x = 0;
        seal.v = 0;
        label.textContent = TXT_IDLE;
        send.classList.remove('is-sent');
        setButton(1, 1);
        say(TXT_READY);
    }
    function finish() {
        phase = 'done';
        pt = 0;
        label.textContent = TXT_SENT;
        send.classList.add('is-sent');
        setButton(1, 1);
        say(TXT_DONE);
    }
    function settle() { finish(); }
    function press() {
        if (phase !== 'idle' && phase !== 'done') {
            return;
        }
        if (still) {
            finish();
            return;
        }
        resetIdle();
        phase = 'morph';
        say(TXT_FOLD);
    }
    function step() {
        if (phase === 'idle' || phase === 'done') {
            return;
        }
        pt += FIXED_DT;
        if (phase === 'morph' && pt >= MORPH_MS) {
            phase = 'letter';
            pt = 0;
        }
        else if (phase === 'letter' && pt >= LETTER_MS) {
            phase = 'flap';
            pt = 0;
        }
        else if (phase === 'flap' && pt >= FLAP_MS) {
            phase = 'seal';
            pt = 0;
            seal.x = 0;
            seal.v = SEAL_POP;
        }
        else if (phase === 'seal') {
            springStep(seal, SEAL_K, SEAL_ZETA, FIXED_DT);
            if (pt >= SEAL_MS) {
                phase = 'away';
                pt = 0;
            }
        }
        else if (phase === 'away' && pt >= AWAY_MS) {
            phase = 'back';
            pt = 0;
            label.textContent = TXT_SENT;
            send.classList.add('is-sent');
        }
        else if (phase === 'back' && pt >= BACK_MS) {
            finish();
        }
    }
    function demoTick(t) {
        if (t < demoNext) {
            return;
        }
        demoNext += DEMO_CYCLE;
        resetIdle();
        press();
    }
    function draw() {
        ctx.clearRect(0, 0, W, H);
        if (phase === 'idle' || phase === 'done') {
            return;
        }
        if (phase === 'back') {
            const p = clamp(pt / BACK_MS, 0, 1);
            drawGhost(GHOST_ALPHA * (1 - p));
            setButton(lerp(0.94, 1, easeOut(p)), lerp(GHOST_ALPHA, 1, p));
            return;
        }
        // 봉투가 떠나는 동안 버튼 자리를 送信済み 색 자리표시로 채운다 — 떠난 뒤 프레임이 빈 구멍이 아니다
        if (phase === 'away') {
            drawGhost(GHOST_ALPHA * easeOut(pt / AWAY_MS));
        }
        setButton(1, phase === 'morph' ? 1 - pt / MORPH_MS : 0);
        let h = EH;
        let letterTop = EY + 12;
        let deg = 0;
        let sealScale = 1;
        if (phase === 'morph') {
            h = lerp(BTN_H, EH, easeOut(pt / MORPH_MS));
            letterTop = 1000;
            deg = FLAP_DEG;
            sealScale = 0;
        }
        else if (phase === 'letter') {
            // 편지가 봉투 위 바깥에서 내려와 주머니 안으로 들어간다
            letterTop = lerp(EY - 96, EY + 12, easeInOut(pt / LETTER_MS));
            deg = FLAP_DEG;
            sealScale = 0;
        }
        else if (phase === 'flap') {
            deg = flapDegAt(pt);
            sealScale = 0;
        }
        else if (phase === 'seal') {
            sealScale = Math.max(0, seal.x);
        }
        if (phase === 'away') {
            const p = pt / AWAY_MS;
            const e = p * p;
            ctx.save();
            ctx.translate(ECX + 300 * e, ECY - 70 * e);
            ctx.rotate(-0.16 * e);
            ctx.scale(1 - 0.35 * e, 1 - 0.35 * e);
            ctx.translate(-ECX, -ECY);
            drawEnvelope(h, letterTop, deg, sealScale);
            ctx.restore();
        }
        else {
            drawEnvelope(h, letterTop, deg, sealScale);
        }
    }
    send.addEventListener('click', function () { press(); });
    resetIdle();
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    let clock = 0;
    function onResize() {
        fitScene();
        for (const f of resizeHooks) {
            f();
        }
        draw();
    }
    fitScene();
    window.addEventListener('resize', onResize);
    function frame(ts) {
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 순간이동 대신 이어서 움직인다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            clock += FIXED_DT;
            if (demo) {
                demoTick(clock);
            }
            step();
            acc -= FIXED_DT;
            n += 1;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    if (still) {
        settle();
        draw();
    }
    else {
        rafId = window.requestAnimationFrame(frame);
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
    };
})();
</script>
</body>
</html>
