<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>채팅 전송 버튼에서 말풍선이 포물선을 그리며 대화창에 내려앉는 장면 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sb is-demo" id="sb">
  <div class="sb__scene" data-role="scene">
    <div class="ch__panel">
      <div class="ch__thread" data-role="thread" data-bubble="ch__bubble ch__bubble--me">
        <p class="ch__bubble">내일 몇 시에 볼까요?</p>
        <p class="ch__bubble ch__bubble--me">3시 어때요?</p>
      </div>
      <div class="ch__composer">
        <span class="ch__draft" data-role="draft">좋아요, 3시에 봐요</span>
        <button class="ch__send" data-role="send" type="button" aria-label="보내기: 좋아요, 3시에 봐요"><svg xmlns="http://www.w3.org/2000/svg" class="ch__icon" aria-hidden="true" focusable="false" viewBox="0 0 256 256"><g fill="currentColor"><path d="M227.91 134.86L59.93 231a8 8 0 0 1-11.44-9.67L80 128L48.49 34.72a8 8 0 0 1 11.44-9.67l168 95.85a8 8 0 0 1-.02 13.96" opacity=".2"/><path d="m231.87 114l-168-95.89a16 16 0 0 0-22.95 19.23L71.55 128l-30.63 90.67A16 16 0 0 0 56 240a16.15 16.15 0 0 0 7.93-2.1l167.92-96.05a16 16 0 0 0 .05-27.89ZM56 224a.6.6 0 0 0 0-.12L85.74 136H144a8 8 0 0 0 0-16H85.74L56.06 32.16A.5.5 0 0 0 56 32l168 95.83Z"/></g></svg></button>
      </div>
    </div>
    <p class="sb__status sb__status--side" data-role="status" aria-live="off">보낼 준비 됨</p>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("sb");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    // 파스텔 팔레트 — 캔버스와 스크립트가 칠하는 색은 여기서만 고른다 (scss 쪽 색은 demo-tokens)
    const INK = [38, 33, 52];
    const PAPER = [255, 252, 246];
    const CREAM = [255, 243, 224];
    const SKY = [158, 208, 255];
    const LILAC = [200, 184, 255];
    const MINT = [156, 228, 204];
    const PINK = [255, 182, 204];
    const PEACH = [255, 214, 184];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeOut(x) { const c = clamp(x, 0, 1); return 1 - Math.pow(1 - c, 3); }
    function easeInOut(x) {
        const c = clamp(x, 0, 1);
        return c < 0.5 ? 4 * c * c * c : 1 - Math.pow(-2 * c + 2, 3) / 2;
    }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
    // 시드 고정 난수 — 같은 시드면 같은 값이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    const sceneEl = root.querySelector('[data-role="scene"]');
    const statusEl = root.querySelector('[data-role="status"]');
    if (!sceneEl || !statusEl) {
        return;
    }
    const scene = sceneEl;
    const status = statusEl;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    const still = reduceQuery.matches;
    const resizeHooks = [];
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 처음 상태로 돌린 뒤 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
        resetIdle();
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    // 장면 배율 — 480×300 좌표로 짠 판을 상자 폭에 맞춰 통째로 줄인다
    let k = 1;
    function fitScene() {
        const w = root.clientWidth;
        k = w > 0 ? w / W : 1;
        scene.style.transform = 'scale(' + k.toFixed(4) + ')';
    }
    // 화면 좌표(CSS px) → 장면 좌표(480×300). 줄인 배율 k 로 나눠야 판 안의 위치가 된다
    function toScene(clientX, clientY) {
        const r = root.getBoundingClientRect();
        return [(clientX - r.left) / k, (clientY - r.top) / k];
    }
    // 캡처 단계에서 듣는다 — 버튼 자신의 pointerdown 보다 먼저 시연을 끝내야 사람의 첫 누름이 처음 상태에서 시작한다
    root.addEventListener('pointerdown', wake, true);
    root.addEventListener('keydown', wake, true);
    // 포물선 꼭대기가 직선 경로보다 위로 솟는 높이(px)
    const ARC_HEIGHT = 80;
    // 입력창에서 대화창 도착 자리까지 날아가는 시간
    const FLIP_MS = 560;
    // 착지 납작함 — 내려앉는 순간 세로 비율이 1 − LAND_SQUASH, 가로는 넓이를 지키게 1/(1 − LAND_SQUASH)
    const LAND_SQUASH = 0.22;
    const SQUASH_MS = 300;
    const SHIFT_MS = 260;
    const MAX_MINE = 3;
    const DEMO_CYCLE = 1250;
    const MESSAGES = ['좋아요, 3시에 봐요', '자료도 같이 보낼게요', '도착하면 연락할게요'];
    const TXT_READY = '보낼 준비 됨';
    const TXT_FLY = '말풍선이 대화창으로 날아가는 중';
    const TXT_DONE = '보냄 — 대화창에 올라갔어요';
    const threadEl = root.querySelector('[data-role="thread"]');
    const draftEl = root.querySelector('[data-role="draft"]');
    const sendEl = root.querySelector('[data-role="send"]');
    if (!threadEl || !draftEl || !sendEl) {
        return;
    }
    const thread = threadEl;
    const draft = draftEl;
    const send = sendEl;
    const bubbleClass = thread.getAttribute('data-bubble') || '';
    let flights = [];
    let shifts = [];
    let mine = [];
    let msgIndex = 0;
    let draftT = 9999;
    let demoNext = 200;
    // 날아가는 동안의 자리 — 가로는 시간에 정비례, 세로는 직선 위에 4h·p(1−p) 를 더해 포물선이 된다
    function arcOffset(dx, dy, p) {
        return [dx * (1 - p), dy * (1 - p) - ARC_HEIGHT * 4 * p * (1 - p)];
    }
    // 착지 뒤 tau(ms) 의 납작함 — 감쇠 코사인. 처음엔 납작, 1/3 지점에서 살짝 길쭉, 끝에 0
    function squashAt(tau) {
        if (tau < 0 || tau >= SQUASH_MS) {
            return 0;
        }
        return LAND_SQUASH * Math.exp(-5 * tau / SQUASH_MS) * Math.cos(3 * Math.PI * tau / SQUASH_MS);
    }
    function centerOf(el) {
        const r = el.getBoundingClientRect();
        return [(r.left + r.width / 2) / k, (r.top + r.height / 2) / k];
    }
    function setDraft(text) {
        draft.textContent = text;
        send.setAttribute('aria-label', '보내기: ' + text);
    }
    function sendNow() {
        const text = draft.textContent || '';
        if (!text) {
            return;
        }
        // 오래된 내 말풍선은 측정 전에 뺀다 — 빼고 나서 재야 남은 말풍선의 위치 변화가 한 번에 잡힌다
        if (mine.length >= MAX_MINE) {
            const old = mine.shift();
            if (old && old.parentNode) {
                old.parentNode.removeChild(old);
            }
            flights = flights.filter(function (f) { return f.el !== old; });
            shifts = shifts.filter(function (s) { return s.el !== old; });
        }
        // First — 입력창 글자 자리와 지금 말풍선들의 세로 위치
        const first = centerOf(draft);
        const before = [];
        const kids = thread.children;
        for (let i = 0; i < kids.length; i += 1) {
            const el = kids[i];
            before.push([el, centerOf(el)[1]]);
        }
        const b = document.createElement('p');
        b.className = bubbleClass;
        b.textContent = text;
        thread.appendChild(b);
        mine.push(b);
        // Last — 대화창에 들어간 자리. Invert — 그 차이만큼 거꾸로 옮겨 두고, Play — 0 으로 풀어 준다
        const last = centerOf(b);
        for (const pair of before) {
            const dy = pair[1] - centerOf(pair[0])[1];
            if (Math.abs(dy) > 0.5) {
                shifts = shifts.filter(function (s) { return s.el !== pair[0]; });
                shifts.push({ el: pair[0], dy: dy, t: still ? SHIFT_MS : 0 });
            }
        }
        flights.push({ el: b, dx: first[0] - last[0], dy: first[1] - last[1], t: still ? FLIP_MS + SQUASH_MS : 0 });
        msgIndex = (msgIndex + 1) % MESSAGES.length;
        setDraft(MESSAGES[msgIndex]);
        draftT = still ? 9999 : 0;
        say(still ? TXT_DONE : TXT_FLY);
    }
    function clearMine() {
        for (const el of mine) {
            if (el.parentNode) {
                el.parentNode.removeChild(el);
            }
        }
        mine = [];
        flights = [];
        shifts = [];
    }
    function resetIdle() {
        clearMine();
        msgIndex = 0;
        draftT = 9999;
        setDraft(MESSAGES[0]);
        draft.style.opacity = '';
        say(TXT_READY);
    }
    function settle() {
        resetIdle();
        sendNow();
        draw();
    }
    function step() {
        for (const f of flights) {
            f.t += FIXED_DT;
        }
        for (const s of shifts) {
            s.t += FIXED_DT;
        }
        draftT += FIXED_DT;
        const before = flights.length;
        flights = flights.filter(function (f) {
            if (f.t < FLIP_MS + SQUASH_MS) {
                return true;
            }
            f.el.style.transform = '';
            return false;
        });
        shifts = shifts.filter(function (s) {
            if (s.t < SHIFT_MS) {
                return true;
            }
            s.el.style.transform = '';
            return false;
        });
        if (before > 0 && flights.length === 0) {
            say(TXT_DONE);
        }
    }
    function demoTick(t) {
        if (t < demoNext) {
            return;
        }
        demoNext += DEMO_CYCLE;
        if (mine.length >= MAX_MINE) {
            resetIdle();
        }
        sendNow();
    }
    function draw() {
        for (const s of shifts) {
            const e = 1 - easeOut(s.t / SHIFT_MS);
            s.el.style.transform = 'translateY(' + (s.dy * e).toFixed(2) + 'px)';
        }
        for (const f of flights) {
            if (f.t < FLIP_MS) {
                const p = f.t / FLIP_MS;
                const o = arcOffset(f.dx, f.dy, p);
                f.el.style.transform = 'translate(' + o[0].toFixed(2) + 'px,' + o[1].toFixed(2) + 'px) scale(' + lerp(0.86, 1, p).toFixed(3) + ')';
            }
            else {
                const s = squashAt(f.t - FLIP_MS);
                f.el.style.transform = 'scale(' + (1 / (1 - s)).toFixed(4) + ',' + (1 - s).toFixed(4) + ')';
            }
        }
        if (draftT < 300) {
            draft.style.opacity = clamp(draftT / 300, 0, 1).toFixed(3);
        }
        else if (draft.style.opacity !== '') {
            draft.style.opacity = '';
        }
    }
    send.addEventListener('click', function () { sendNow(); });
    resetIdle();
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    let clock = 0;
    function onResize() {
        fitScene();
        for (const f of resizeHooks) {
            f();
        }
        draw();
    }
    fitScene();
    window.addEventListener('resize', onResize);
    function frame(ts) {
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 순간이동 대신 이어서 움직인다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            clock += FIXED_DT;
            if (demo) {
                demoTick(clock);
            }
            step();
            acc -= FIXED_DT;
            n += 1;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    if (still) {
        settle();
        draw();
    }
    else {
        rafId = window.requestAnimationFrame(frame);
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
    };
})();
</script>
</body>
</html>
