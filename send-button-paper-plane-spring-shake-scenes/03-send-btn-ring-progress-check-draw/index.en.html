<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Button That Shrinks to a Circle, Runs a Progress Ring and Ends in a Check — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sb is-demo" id="sb">
  <div class="sb__scene" data-role="scene">
    <span class="rg__area" aria-hidden="true"></span>
    <button class="rg__send" data-role="send" type="button">
      <svg class="rg__svg" viewBox="0 0 240 100" aria-hidden="true" focusable="false">
        <circle class="rg__halo" data-role="halo" cx="120" cy="50" r="40" fill="#e6dfff"/>
        <rect class="rg__body" data-role="body" x="24" y="22" width="192" height="56" rx="28" fill="#c8b8ff"/>
        <circle class="rg__track" data-role="track" cx="120" cy="50" r="36" fill="none" stroke-width="4"/>
        <circle class="rg__ring" data-role="ring" cx="120" cy="50" r="36" fill="none" stroke-width="4" stroke-linecap="round" transform="rotate(-90 120 50)"/>
        <polyline class="rg__check" data-role="check" points="106,51 116,61 135,40" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="rg__label" data-role="label">Submit</span>
    </button>
    <p class="sb__status" data-role="status" aria-live="off">Ready to submit</p>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("sb");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    // 파스텔 팔레트 — 캔버스와 스크립트가 칠하는 색은 여기서만 고른다 (scss 쪽 색은 demo-tokens)
    const INK = [38, 33, 52];
    const PAPER = [255, 252, 246];
    const CREAM = [255, 243, 224];
    const SKY = [158, 208, 255];
    const LILAC = [200, 184, 255];
    const MINT = [156, 228, 204];
    const PINK = [255, 182, 204];
    const PEACH = [255, 214, 184];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeOut(x) { const c = clamp(x, 0, 1); return 1 - Math.pow(1 - c, 3); }
    function easeInOut(x) {
        const c = clamp(x, 0, 1);
        return c < 0.5 ? 4 * c * c * c : 1 - Math.pow(-2 * c + 2, 3) / 2;
    }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
    // 시드 고정 난수 — 같은 시드면 같은 값이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    const sceneEl = root.querySelector('[data-role="scene"]');
    const statusEl = root.querySelector('[data-role="status"]');
    if (!sceneEl || !statusEl) {
        return;
    }
    const scene = sceneEl;
    const status = statusEl;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    const still = reduceQuery.matches;
    const resizeHooks = [];
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 처음 상태로 돌린 뒤 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
        resetIdle();
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    // 장면 배율 — 480×300 좌표로 짠 판을 상자 폭에 맞춰 통째로 줄인다
    let k = 1;
    function fitScene() {
        const w = root.clientWidth;
        k = w > 0 ? w / W : 1;
        scene.style.transform = 'scale(' + k.toFixed(4) + ')';
    }
    // 화면 좌표(CSS px) → 장면 좌표(480×300). 줄인 배율 k 로 나눠야 판 안의 위치가 된다
    function toScene(clientX, clientY) {
        const r = root.getBoundingClientRect();
        return [(clientX - r.left) / k, (clientY - r.top) / k];
    }
    // 캡처 단계에서 듣는다 — 버튼 자신의 pointerdown 보다 먼저 시연을 끝내야 사람의 첫 누름이 처음 상태에서 시작한다
    root.addEventListener('pointerdown', wake, true);
    root.addEventListener('keydown', wake, true);
    // 알약 버튼 크기(px) — svg 안 좌표. 원으로 줄면 너비가 높이와 같아진다
    const PILL_W = 192;
    const PILL_H = 56;
    const SVG_CX = 120;
    const SVG_CY = 50;
    // 알약 너비가 높이(원)까지 줄어드는 시간
    const SHRINK_MS = 360;
    // 진행 링 선 두께(px). 링 반지름 = 원 반지름 28 + 틈 6 + 두께의 절반
    const RING_STROKE = 4;
    const RING_R = PILL_H / 2 + 6 + RING_STROKE / 2;
    // 둘레 길이 = 2πr. 진행률만큼만 선을 드러내려면 dasharray 를 둘레로, dashoffset 을 둘레 × (1 − 진행률)로 둔다
    const RING_C = 2 * Math.PI * RING_R;
    // 체크 표시를 다 긋는 시간 — 경로 길이에 정비례로 펜이 움직여 두 획의 길이 비율대로 시간이 나뉜다
    const CHECK_DRAW_MS = 300;
    const PROGRESS_MS = 1000;
    const FILL_MS = 160;
    const DEMO_CYCLE = 2400;
    const TXT_IDLE = 'Submit';
    const TXT_DONE = 'Submitted';
    const TXT_READY = 'Ready to submit';
    const TXT_LOAD = 'Shrinking to a circle and filling the ring';
    const TXT_FINISH = 'Submitted — we emailed your reference number';
    const sendEl = root.querySelector('[data-role="send"]');
    const labelEl = root.querySelector('[data-role="label"]');
    const bodyEl = root.querySelector('[data-role="body"]');
    const trackEl = root.querySelector('[data-role="track"]');
    const ringEl = root.querySelector('[data-role="ring"]');
    const checkEl = root.querySelector('[data-role="check"]');
    const haloEl = root.querySelector('[data-role="halo"]');
    if (!sendEl || !labelEl || !bodyEl || !trackEl || !ringEl || !checkEl || !haloEl) {
        return;
    }
    const halo = haloEl;
    const send = sendEl;
    const label = labelEl;
    const body = bodyEl;
    const track = trackEl;
    const ring = ringEl;
    const check = checkEl;
    // 체크 경로 길이 — 브라우저가 재 준 값(getTotalLength)을 쓰고, 못 재면 두 획 길이의 합으로
    const CHECK_PTS = [[106, 51], [116, 61], [135, 40]];
    function pathLength(pts) {
        let s = 0;
        for (let i = 1; i < pts.length; i += 1) {
            s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
        }
        return s;
    }
    const checkLen = typeof check.getTotalLength === 'function' ? check.getTotalLength() : pathLength(CHECK_PTS);
    const rng = makeRng(466);
    let phase = 'idle';
    let pt = 0;
    let progress = 0;
    let shown = 0;
    let demoNext = 200;
    function setNum(el, name, v) { el.setAttribute(name, v.toFixed(2)); }
    // 알약 너비 w 로 몸통을 다시 그린다 — 가운데를 지키려면 x 도 함께 옮긴다
    function setPill(w) {
        setNum(body, 'x', SVG_CX - w / 2);
        setNum(body, 'width', w);
    }
    function setRing(p) { setNum(ring, 'stroke-dashoffset', RING_C * (1 - clamp(p, 0, 1))); }
    function setCheck(p) {
        setNum(check, 'stroke-dashoffset', checkLen * (1 - clamp(p, 0, 1)));
        // 길이 0 인 대시에도 둥근 끝(round cap)이 점 하나로 찍힌다 — 긋기 전에는 아예 숨긴다
        check.style.opacity = p <= 0 ? '0' : '';
    }
    function setFill(t) { body.setAttribute('fill', rgba(mix(LILAC, MINT, clamp(t, 0, 1)), 1)); }
    function setRingAlpha(a) {
        ring.style.opacity = a.toFixed(3);
        track.style.opacity = a.toFixed(3);
    }
    // 후광 — 링이 보여 주는 진행률 하나로 반지름(RING_R + 4 → + 38)과 진하기를 같이 정한다. 진행이 원 밖 넓은 면까지 번진다
    function setHalo(p, a) {
        setNum(halo, 'r', RING_R + 4 + 34 * clamp(p, 0, 1));
        halo.style.opacity = clamp(a, 0, 1).toFixed(3);
    }
    function resetIdle() {
        phase = 'idle';
        pt = 0;
        progress = 0;
        shown = 0;
        setPill(PILL_W);
        setFill(0);
        setRing(0);
        setRingAlpha(0);
        setHalo(0, 0);
        setCheck(0);
        label.textContent = TXT_IDLE;
        label.style.opacity = '';
        say(TXT_READY);
    }
    function finish() {
        phase = 'done';
        pt = 0;
        setPill(PILL_H);
        setFill(1);
        setRingAlpha(0);
        setHalo(1, 0);
        setCheck(1);
        label.textContent = TXT_DONE;
        label.style.opacity = '0';
        say(TXT_FINISH);
    }
    function settle() { finish(); }
    function press() {
        if (phase !== 'idle' && phase !== 'done') {
            return;
        }
        if (still) {
            finish();
            return;
        }
        resetIdle();
        phase = 'shrink';
        say(TXT_LOAD);
    }
    function step() {
        if (phase === 'idle' || phase === 'done') {
            return;
        }
        pt += FIXED_DT;
        if (phase === 'shrink' && pt >= SHRINK_MS) {
            phase = 'load';
            pt = 0;
        }
        else if (phase === 'load') {
            // 업로드는 고르게 차지 않는다 — 걸음마다 평균 속도의 0.35~1.65 배로 더해 덩어리지게 찬다
            progress = Math.min(1, progress + (FIXED_DT / PROGRESS_MS) * (0.35 + 1.3 * rng()));
            // 링은 진행률로 바로 튀지 않고 남은 차이의 30% 씩 다가간다
            shown += (progress - shown) * 0.3;
            if (progress >= 1 && shown > 0.995) {
                shown = 1;
                phase = 'fill';
                pt = 0;
            }
        }
        else if (phase === 'fill' && pt >= FILL_MS) {
            phase = 'check';
            pt = 0;
            label.textContent = TXT_DONE;
        }
        else if (phase === 'check' && pt >= CHECK_DRAW_MS) {
            finish();
        }
    }
    function demoTick(t) {
        if (t < demoNext) {
            return;
        }
        demoNext += DEMO_CYCLE;
        resetIdle();
        press();
    }
    function draw() {
        if (phase === 'shrink') {
            const p = easeInOut(pt / SHRINK_MS);
            setPill(lerp(PILL_W, PILL_H, p));
            label.style.opacity = clamp(1 - p * 2, 0, 1).toFixed(3);
            setRingAlpha(p);
            setHalo(0, p * 0.9);
        }
        else if (phase === 'load') {
            setRing(shown);
            setHalo(shown, 0.9 - 0.3 * shown);
        }
        else if (phase === 'fill') {
            const p = pt / FILL_MS;
            setRing(1);
            setFill(p);
            setRingAlpha(1 - p);
            setHalo(1, 0.6 * (1 - p));
        }
        else if (phase === 'check') {
            setRingAlpha(0);
            setHalo(1, 0);
            setFill(1);
            setCheck(pt / CHECK_DRAW_MS);
        }
    }
    setNum(ring, 'r', RING_R);
    setNum(track, 'r', RING_R);
    setNum(ring, 'stroke-width', RING_STROKE);
    setNum(track, 'stroke-width', RING_STROKE);
    ring.setAttribute('stroke-dasharray', RING_C.toFixed(2));
    check.setAttribute('stroke-dasharray', checkLen.toFixed(2));
    send.addEventListener('click', function () { press(); });
    resetIdle();
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    let clock = 0;
    function onResize() {
        fitScene();
        for (const f of resizeHooks) {
            f();
        }
        draw();
    }
    fitScene();
    window.addEventListener('resize', onResize);
    function frame(ts) {
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 순간이동 대신 이어서 움직인다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            clock += FIXED_DT;
            if (demo) {
                demoTick(clock);
            }
            step();
            acc -= FIXED_DT;
            n += 1;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    if (still) {
        settle();
        draw();
    }
    else {
        rafId = window.requestAnimationFrame(frame);
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
    };
})();
</script>
</body>
</html>
