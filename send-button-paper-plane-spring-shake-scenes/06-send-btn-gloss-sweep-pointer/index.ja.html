<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>送信中に光沢の帯が通り、ポインターの傾きに沿って反射光が動くボタン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sb is-demo" id="sb">
  <div class="sb__scene" data-role="scene">
    <span class="gl__glow" data-role="glow" aria-hidden="true"></span>
    <span class="gl__shadow" data-role="shadow" aria-hidden="true"></span>
    <button class="gl__send" data-role="send" type="button">
      <span class="gl__spot" data-role="spot" aria-hidden="true"></span>
      <span class="gl__gloss" data-role="gloss" aria-hidden="true"></span>
      <span class="gl__label" data-role="label">支払う</span>
    </button>
    <p class="sb__status" data-role="status" aria-live="off">支払いの準備ができました</p>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("sb");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    // 파스텔 팔레트 — 캔버스와 스크립트가 칠하는 색은 여기서만 고른다 (scss 쪽 색은 demo-tokens)
    const INK = [38, 33, 52];
    const PAPER = [255, 252, 246];
    const CREAM = [255, 243, 224];
    const SKY = [158, 208, 255];
    const LILAC = [200, 184, 255];
    const MINT = [156, 228, 204];
    const PINK = [255, 182, 204];
    const PEACH = [255, 214, 184];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeOut(x) { const c = clamp(x, 0, 1); return 1 - Math.pow(1 - c, 3); }
    function easeInOut(x) {
        const c = clamp(x, 0, 1);
        return c < 0.5 ? 4 * c * c * c : 1 - Math.pow(-2 * c + 2, 3) / 2;
    }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
    // 시드 고정 난수 — 같은 시드면 같은 값이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    const sceneEl = root.querySelector('[data-role="scene"]');
    const statusEl = root.querySelector('[data-role="status"]');
    if (!sceneEl || !statusEl) {
        return;
    }
    const scene = sceneEl;
    const status = statusEl;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    const still = reduceQuery.matches;
    const resizeHooks = [];
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 처음 상태로 돌린 뒤 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
        resetIdle();
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    // 장면 배율 — 480×300 좌표로 짠 판을 상자 폭에 맞춰 통째로 줄인다
    let k = 1;
    function fitScene() {
        const w = root.clientWidth;
        k = w > 0 ? w / W : 1;
        scene.style.transform = 'scale(' + k.toFixed(4) + ')';
    }
    // 화면 좌표(CSS px) → 장면 좌표(480×300). 줄인 배율 k 로 나눠야 판 안의 위치가 된다
    function toScene(clientX, clientY) {
        const r = root.getBoundingClientRect();
        return [(clientX - r.left) / k, (clientY - r.top) / k];
    }
    // 캡처 단계에서 듣는다 — 버튼 자신의 pointerdown 보다 먼저 시연을 끝내야 사람의 첫 누름이 처음 상태에서 시작한다
    root.addEventListener('pointerdown', wake, true);
    root.addEventListener('keydown', wake, true);
    // 버튼 자리(장면 px) — scss 의 .gl__send 위치·크기와 같은 값
    const BTN_CX = 240;
    const BTN_CY = 140;
    const BTN_W = 232;
    const BTN_H = 64;
    // 광택 띠가 버튼을 한 번 가로지르는 시간
    const SWEEP_MS = 820;
    // 광택 띠 너비(px) — 대각으로 기울여(skewX −22°) 지나간다
    const GLOSS_WIDTH = 46;
    // 기울기가 포인터 쪽으로 다가가는 비율 — 16ms 한 걸음마다 남은 거리의 12% 만큼 간다(관성 lerp)
    const TILT_LERP = 0.12;
    const TILT_MAX_DEG = 14;
    const SPOT = 140;
    const SEND_MS = 1700;
    const DEMO_CYCLE = 3000;
    const TXT_IDLE = '支払う';
    const TXT_SENDING = '送信中';
    const TXT_SENT = '支払い完了';
    const TXT_READY = '支払いの準備ができました';
    const TXT_SEND = '支払いリクエストを送信中';
    const TXT_DONE = '支払い完了 — 領収書をメールで送りました';
    const sendEl = root.querySelector('[data-role="send"]');
    const labelEl = root.querySelector('[data-role="label"]');
    const glossEl = root.querySelector('[data-role="gloss"]');
    const spotEl = root.querySelector('[data-role="spot"]');
    const shadowEl = root.querySelector('[data-role="shadow"]');
    const glowEl = root.querySelector('[data-role="glow"]');
    if (!sendEl || !labelEl || !glossEl || !spotEl || !shadowEl || !glowEl) {
        return;
    }
    const glow = glowEl;
    const send = sendEl;
    const label = labelEl;
    const gloss = glossEl;
    const spot = spotEl;
    const shadow = shadowEl;
    let phase = 'idle';
    let pt = 0;
    let tx = 0;
    let ty = 0;
    let gx = 0;
    let gy = 0;
    let demoNext = 200;
    // 관성 lerp 한 걸음 — 목표로 곧장 가지 않고 남은 거리의 TILT_LERP 만큼만 간다
    function follow(cur, goal) { return cur + (goal - cur) * TILT_LERP; }
    // 광택 띠의 x — 한 번 지나가는 동안 왼쪽 밖(−2×너비)에서 오른쪽 밖(버튼 너비 + 너비)까지
    function glossX(t) {
        const p = (t % SWEEP_MS) / SWEEP_MS;
        return lerp(-GLOSS_WIDTH * 2, BTN_W + GLOSS_WIDTH, easeInOut(p));
    }
    // 하이라이트 중심 — 포인터가 아니라 지금의 기울기(tx, ty)에서 다시 계산한다. 그래서 반사광도 늦게 따라온다
    function spotCenter() { return [BTN_W / 2 + tx * BTN_W * 0.38, BTN_H / 2 + ty * BTN_H * 0.5]; }
    function resetIdle() {
        phase = 'idle';
        pt = 0;
        label.textContent = TXT_IDLE;
        say(TXT_READY);
    }
    function finish() {
        phase = 'done';
        pt = 0;
        label.textContent = TXT_SENT;
        say(TXT_DONE);
    }
    function settle() { finish(); }
    function press() {
        if (phase === 'sending') {
            return;
        }
        if (still) {
            finish();
            return;
        }
        phase = 'sending';
        pt = 0;
        label.textContent = TXT_SENDING;
        say(TXT_SEND);
    }
    function aim(clientX, clientY) {
        const p = toScene(clientX, clientY);
        gx = clamp((p[0] - BTN_CX) / (BTN_W / 2 + 40), -1, 1);
        gy = clamp((p[1] - BTN_CY) / (BTN_H / 2 + 60), -1, 1);
    }
    function step() {
        if (still) {
            tx = gx;
            ty = gy;
            return;
        }
        tx = follow(tx, gx);
        ty = follow(ty, gy);
        if (phase !== 'sending') {
            return;
        }
        pt += FIXED_DT;
        if (pt >= SEND_MS) {
            finish();
        }
    }
    function demoTick(t) {
        // 시연 포인터 — 버튼 둘레를 리사주 곡선으로 돈다
        gx = 0.85 * Math.cos(t * 0.0021);
        gy = 0.7 * Math.sin(t * 0.0033);
        if (t < demoNext) {
            return;
        }
        demoNext += DEMO_CYCLE;
        resetIdle();
        press();
    }
    function draw() {
        send.style.transform = 'perspective(520px) rotateX(' + (-ty * TILT_MAX_DEG).toFixed(2) + 'deg) rotateY(' + (tx * TILT_MAX_DEG).toFixed(2) + 'deg)';
        const c = spotCenter();
        spot.style.transform = 'translate(' + (c[0] - SPOT / 2).toFixed(1) + 'px,' + (c[1] - SPOT / 2).toFixed(1) + 'px)';
        spot.style.opacity = (0.45 + 0.4 * Math.min(1, Math.hypot(tx, ty))).toFixed(3);
        // 그림자는 기울기 반대쪽으로 크게(가로 22px·세로 14px) 밀린다 — 같은 tx·ty 가 버튼 밖 넓은 바닥까지 전파된다
        shadow.style.transform = 'translate(' + (-tx * 22).toFixed(1) + 'px,' + (14 - ty * 14).toFixed(1) + 'px) scale(' + (1 - Math.hypot(tx, ty) * 0.05).toFixed(3) + ')';
        // 바닥 반사 — 광택 띠가 버튼 가운데를 지날 때 가장 밝다(띠 진행률의 사인). 위치는 기울기 쪽으로
        let band = 0;
        if (phase === 'sending') {
            band = Math.sin(Math.PI * ((pt % SWEEP_MS) / SWEEP_MS));
        }
        glow.style.transform = 'translate(' + (tx * 24).toFixed(1) + 'px,' + (ty * 10).toFixed(1) + 'px)';
        glow.style.opacity = (0.2 + 0.6 * band).toFixed(3);
        if (phase === 'sending') {
            gloss.style.opacity = '';
            gloss.style.transform = 'translateX(' + glossX(pt).toFixed(1) + 'px) skewX(-22deg)';
        }
        else {
            gloss.style.opacity = '0';
        }
    }
    gloss.style.width = GLOSS_WIDTH + 'px';
    root.addEventListener('pointermove', function (ev) { wake(); aim(ev.clientX, ev.clientY); });
    root.addEventListener('pointerleave', function () { gx = 0; gy = 0; });
    send.addEventListener('click', function () { press(); });
    resetIdle();
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    let clock = 0;
    function onResize() {
        fitScene();
        for (const f of resizeHooks) {
            f();
        }
        draw();
    }
    fitScene();
    window.addEventListener('resize', onResize);
    function frame(ts) {
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 순간이동 대신 이어서 움직인다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            clock += FIXED_DT;
            if (demo) {
                demoTick(clock);
            }
            step();
            acc -= FIXED_DT;
            n += 1;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    if (still) {
        settle();
        draw();
    }
    else {
        rafId = window.requestAnimationFrame(frame);
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
    };
})();
</script>
</body>
</html>
