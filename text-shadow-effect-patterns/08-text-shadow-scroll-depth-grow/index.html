<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크롤 값만큼 그림자가 자라나는 글자 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sc is-demo" id="sc">
  <p class="sc__badge"><span class="sc__badgeLabel">스크롤 진행</span> <span class="sc__badgeValue" id="scValue">0%</span></p>
  <div class="sc__viewport" id="scViewport" tabindex="0">
    <div class="sc__track" id="scTrack">
      <h1 class="sc__word" id="scWord">깊이</h1>
      <div class="sc__spacer" aria-hidden="true"></div>
    </div>
  </div>
  <p class="sc__hint">휠·방향키로 내려 본다</p>
</div>
</main>
<script>
(function () {
  var SCROLL_MAX_PX = 26;
  var PERIOD_MS = 1000;

  var viewport = document.getElementById('scViewport');
  var word = document.getElementById('scWord');
  var value = document.getElementById('scValue');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hasUser = false;

  // 스크롤 진행 값(ratio 0~1) 하나를 그림자 거리 값에 그대로 이어, 내려갈수록 그림자가 자란다
  function buildScrollShadow(ratio) {
    var d = (ratio * SCROLL_MAX_PX).toFixed(2);
    return [
      (d * 0.4).toFixed(2) + 'px ' + d + 'px 0 rgba(10,79,232,.5)',
      (d * 0.4).toFixed(2) + 'px ' + (d * 2).toFixed(2) + 'px ' + (4 + ratio * 10).toFixed(1) + 'px rgba(10,79,232,' + (0.28 + ratio * 0.3).toFixed(2) + ')'
    ].join(', ');
  }

  function renderScroll(ratio) {
    word.style.textShadow = buildScrollShadow(ratio);
    value.textContent = Math.round(ratio * 100) + '%';
  }

  function ratioFromScroll() {
    var max = viewport.scrollHeight - viewport.clientHeight;
    return max > 0 ? Math.max(0, Math.min(1, viewport.scrollTop / max)) : 0;
  }

  viewport.addEventListener('scroll', function () {
    renderScroll(ratioFromScroll());
  });
  ['wheel', 'touchstart', 'keydown'].forEach(function (ev) {
    viewport.addEventListener(ev, function () { hasUser = true; }, { passive: true });
  });

  var startTime = null;
  function loop(now) {
    if (startTime === null) startTime = now;
    if (!hasUser) {
      var t = (now - startTime) % PERIOD_MS;
      var phase = (Math.sin((t / PERIOD_MS) * Math.PI * 2 - Math.PI / 2) + 1) / 2;
      var max = viewport.scrollHeight - viewport.clientHeight;
      viewport.scrollTop = phase * max;
    }
    requestAnimationFrame(loop);
  }

  renderScroll(0);
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
