<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>八方向の値が重なり輪郭線になる文字 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ol is-demo" id="ol">
  <p class="ol__badge"><span class="ol__badgeLabel">輪郭の太さ</span> <span class="ol__badgeValue" id="olValue">0.5px</span></p>
  <h1 class="ol__word" id="olWord">輪郭</h1>
</div>
</main>
<script>
(function () {
  var OUTLINE_MAX_PX = 15;
  var PERIOD_MS = 1000;
  var DIRS = [
    [1, 0], [-1, 0], [0, 1], [0, -1],
    [0.7071, 0.7071], [-0.7071, 0.7071], [0.7071, -0.7071], [-0.7071, -0.7071]
  ];

  var word = document.getElementById('olWord');
  var value = document.getElementById('olValue');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 값(d) 하나를 여덟 방향에 같은 거리만큼 겹쳐 채움 없이도 윤곽선만 남긴다
  function buildOutlineShadow(d) {
    var parts = [];
    for (var i = 0; i < DIRS.length; i++) {
      var x = (DIRS[i][0] * d).toFixed(2);
      var y = (DIRS[i][1] * d).toFixed(2);
      parts.push(x + 'px ' + y + 'px 0 rgba(23,20,26,.92)');
    }
    return parts.join(', ');
  }

  function renderOutline(d) {
    word.style.textShadow = buildOutlineShadow(d);
    value.textContent = d.toFixed(1) + 'px';
  }

  var startTime = null;
  function loop(now) {
    if (startTime === null) startTime = now;
    var t = (now - startTime) % PERIOD_MS;
    var phase = (Math.sin((t / PERIOD_MS) * Math.PI * 2 - Math.PI / 2) + 1) / 2;
    renderOutline(0.4 + (OUTLINE_MAX_PX - 0.4) * phase);
    requestAnimationFrame(loop);
  }

  if (reduce) {
    renderOutline(OUTLINE_MAX_PX);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
