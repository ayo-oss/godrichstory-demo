<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커서가 오르면 깊이 값이 밀려 올라오는 글자 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="hv is-demo" id="hv">
  <p class="hv__badge"><span class="hv__badgeLabel">떠오름 값</span> <span class="hv__badgeValue" id="hvValue">0.0px</span></p>
  <div class="hv__scene" id="hvScene">
    <h1 class="hv__word" id="hvWord" tabindex="0">부상</h1>
  </div>
</div>
</main>
<script>
(function () {
  var HOVER_LIFT_PX = 4;
  var LIFT_MULTIPLIER = 5;
  var LERP = 0.18;
  var PERIOD_MS = 1000;

  var scene = document.getElementById('hvScene');
  var word = document.getElementById('hvWord');
  var value = document.getElementById('hvValue');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var targetP = 0;
  var curP = 0;
  var hasPointer = false;

  // 근접도 값(p 0~1) 하나로 그림자 오프셋·번짐 값을 함께 밀어 올려, 글자가 배경에서
  // 떠오르는 것처럼 보인다. 깊이 기본 단위는 HOVER_LIFT_PX
  function buildLiftShadow(p) {
    var y = (p * HOVER_LIFT_PX * 1.6).toFixed(2);
    var y2 = (p * HOVER_LIFT_PX * LIFT_MULTIPLIER).toFixed(2);
    var blur = (4 + p * HOVER_LIFT_PX * 6.5).toFixed(1);
    return [
      '0px ' + y + 'px 0 rgba(10,79,232,' + (0.55 + p * 0.3).toFixed(2) + ')',
      '0px ' + y2 + 'px ' + blur + 'px rgba(10,79,232,' + (0.22 + p * 0.36).toFixed(2) + ')'
    ].join(', ');
  }

  function renderLift(p) {
    word.style.textShadow = buildLiftShadow(p);
    word.style.transform = 'translateY(' + (-(p * HOVER_LIFT_PX * 1.2)).toFixed(2) + 'px)';
    value.textContent = (p * HOVER_LIFT_PX).toFixed(1) + 'px';
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  var startTime = null;
  function loop(now) {
    if (startTime === null) startTime = now;
    if (!hasPointer && !reduce) {
      var t = (now - startTime) % PERIOD_MS;
      var phase = (Math.sin((t / PERIOD_MS) * Math.PI * 2 - Math.PI / 2) + 1) / 2;
      targetP = phase;
    }
    curP += (targetP - curP) * LERP;
    renderLift(curP);
    requestAnimationFrame(loop);
  }

  scene.addEventListener('pointerenter', function () {
    hasPointer = true;
    targetP = 1;
    if (reduce) { curP = 1; renderLift(1); }
  });
  scene.addEventListener('pointerleave', function () {
    hasPointer = false;
    targetP = 0;
    if (reduce) { curP = 0; renderLift(0); }
  });
  word.addEventListener('focus', function () {
    hasPointer = true;
    targetP = 1;
    if (reduce) { curP = 1; renderLift(1); }
  });
  word.addEventListener('blur', function () {
    hasPointer = false;
    targetP = 0;
    if (reduce) { curP = 0; renderLift(0); }
  });

  if (reduce) {
    renderLift(0);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
