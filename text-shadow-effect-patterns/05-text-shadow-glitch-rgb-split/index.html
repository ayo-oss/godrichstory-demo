<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>색 분리 값만큼 어긋나며 깨지는 글리치 글자 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gl is-demo" id="gl">
  <p class="gl__badge"><span class="gl__badgeLabel">분리 거리</span> <span class="gl__badgeValue" id="glValue">0.0px</span></p>
  <button type="button" class="gl__word" id="glWord">글리치</button>
  <p class="gl__hint">클릭하면 다시 깨진다</p>
</div>
</main>
<script>
(function () {
  var GLITCH_SPLIT_PX = 2;
  var BURST_PX = GLITCH_SPLIT_PX * 14;
  var PULSE_MS = 480;

  var word = document.getElementById('glWord');
  var value = document.getElementById('glValue');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var seed = 11;

  // 고정 시드 PRNG — Math.random 대신 프레임마다 같은 규칙으로 다음 값을 만든다
  function seedRand(s) {
    return function () {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  }
  var rnd = seedRand(seed);

  // 값(mag) 하나를 시드 노이즈로 흔들어 빨강·파랑 그림자를 반대 방향으로 어긋나게 한다
  function buildGlitchShadow(mag) {
    var rx = (mag * (rnd() * 2 - 1)).toFixed(2);
    var ry = (mag * 0.28 * (rnd() * 2 - 1)).toFixed(2);
    var bx = (-mag * (rnd() * 2 - 1)).toFixed(2);
    var by = (-mag * 0.28 * (rnd() * 2 - 1)).toFixed(2);
    return [
      rx + 'px ' + ry + 'px 0 rgba(255,54,96,.88)',
      bx + 'px ' + by + 'px 0 rgba(58,164,255,.88)'
    ].join(', ');
  }

  function renderGlitch(mag) {
    word.style.textShadow = buildGlitchShadow(mag);
    value.textContent = mag.toFixed(1) + 'px';
  }

  var burstUntil = 0;
  var startTime = null;
  function loop(now) {
    if (startTime === null) startTime = now;
    var t = (now - startTime) % PULSE_MS;
    var tri = Math.abs((t / PULSE_MS) * 2 - 1);
    var mag = GLITCH_SPLIT_PX * (0.3 + tri * 9.5);
    if (now < burstUntil) mag = BURST_PX;
    renderGlitch(mag);
    requestAnimationFrame(loop);
  }

  word.addEventListener('click', function () {
    seed = (seed * 977 + 313) & 0x7fffffff;
    rnd = seedRand(seed || 1);
    burstUntil = performance.now() + 220;
    if (reduce) renderGlitch(BURST_PX);
  });

  if (reduce) {
    renderGlitch(GLITCH_SPLIT_PX);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
