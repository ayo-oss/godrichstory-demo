<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>層の値ごとに紙を一枚ずつ重ねたような文字 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pp is-demo" id="pp">
  <p class="pp__badge"><span class="pp__badgeLabel">紙の層</span> <span class="pp__badgeValue" id="ppValue">1</span></p>
  <h1 class="pp__word" id="ppWord">紙</h1>
</div>
</main>
<script>
(function () {
  var PAPER_LAYER_COUNT = 6;
  var OFFSET_STEP_PX = 12;
  var PERIOD_MS = 1000;

  var word = document.getElementById('ppWord');
  var value = document.getElementById('ppValue');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 층 값(n) 하나로 색·거리 값이 다른 紙 층을 n 장 쌓는다 — n 이 늘수록 종이가
  // 여러 장 겹친 것처럼 보인다
  function buildPaperShadow(n) {
    var parts = [];
    for (var i = 1; i <= n; i++) {
      var d = (i * OFFSET_STEP_PX).toFixed(2);
      var warm = i % 2 === 0;
      var sheet = warm ? 'rgba(255,247,230,.92)' : 'rgba(246,238,222,.92)';
      parts.push(d + 'px ' + d + 'px 0 ' + sheet);
      parts.push(d + 'px ' + (Number(d) + 1.4).toFixed(2) + 'px 2px rgba(23,20,26,' + (0.22 - i * 0.02).toFixed(2) + ')');
    }
    return parts.join(', ');
  }

  function renderPaper(n) {
    word.style.textShadow = buildPaperShadow(n);
    value.textContent = String(n);
  }

  var startTime = null;
  function loop(now) {
    if (startTime === null) startTime = now;
    var t = (now - startTime) % PERIOD_MS;
    var phase = (Math.sin((t / PERIOD_MS) * Math.PI * 2 - Math.PI / 2) + 1) / 2;
    var n = 1 + Math.round(phase * (PAPER_LAYER_COUNT - 1));
    renderPaper(n);
    requestAnimationFrame(loop);
  }

  if (reduce) {
    renderPaper(PAPER_LAYER_COUNT);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
