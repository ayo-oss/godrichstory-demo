<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>層の値が積み重なり立体になる押し出し文字 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ex is-demo" id="ex">
  <p class="ex__badge"><span class="ex__badgeLabel">押し出し深さ</span> <span class="ex__badgeValue" id="exValue">1.0px</span></p>
  <h1 class="ex__word" id="exWord">押出</h1>
</div>
</main>
<script>
(function () {
  var SHADOW_LAYER_COUNT = 6;
  var STEP_MIN_PX = 1;
  var STEP_MAX_PX = 15;
  var PERIOD_MS = 1000;

  var word = document.getElementById('exWord');
  var value = document.getElementById('exValue');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 계산 레이어: 층 번호(i)가 깊어질수록 명도를 낮춰 아래로 갈수록 어두워지는 입체감을 만든다
  function extrudeColor(i, n) {
    var t = i / n;
    var l = Math.max(6, Math.round(24 - t * 16));
    return 'hsl(232 14% ' + l + '%)';
  }

  // 값(step) 하나로 SHADOW_LAYER_COUNT 개의 그림자를 문자열로 조립한다
  function buildExtrudeShadow(step) {
    var parts = [];
    for (var i = 1; i <= SHADOW_LAYER_COUNT; i++) {
      var d = (i * step).toFixed(2);
      parts.push(d + 'px ' + d + 'px 0 ' + extrudeColor(i, SHADOW_LAYER_COUNT));
    }
    return parts.join(', ');
  }

  function renderExtrude(step) {
    word.style.textShadow = buildExtrudeShadow(step);
    value.textContent = step.toFixed(1) + 'px';
  }

  var startTime = null;
  function loop(now) {
    if (startTime === null) startTime = now;
    var t = (now - startTime) % PERIOD_MS;
    var phase = (Math.sin((t / PERIOD_MS) * Math.PI * 2 - Math.PI / 2) + 1) / 2;
    renderExtrude(STEP_MIN_PX + (STEP_MAX_PX - STEP_MIN_PX) * phase);
    requestAnimationFrame(loop);
  }

  if (reduce) {
    renderExtrude(STEP_MAX_PX);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
