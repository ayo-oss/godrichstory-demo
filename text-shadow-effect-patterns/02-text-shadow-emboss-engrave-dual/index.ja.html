<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>明るい値と暗い値が逆に重なり浮き出る文字 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="em is-demo" id="em">
  <p class="em__badge"><span class="em__badgeLabel">光の角度</span> <span class="em__badgeValue" id="emValue">0deg</span></p>
  <h1 class="em__word" id="emWord">凹凸</h1>
</div>
</main>
<script>
(function () {
  var EMBOSS_DEPTH_PX = 12.5;
  var PERIOD_MS = 1000;

  var word = document.getElementById('emWord');
  var value = document.getElementById('emValue');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 값(angleDeg) 하나로 밝은 그림자·어두운 그림자를 서로 반대 방향에 배치한다
  function buildEmbossShadow(angleDeg) {
    var rad = (angleDeg * Math.PI) / 180;
    var lx = (Math.cos(rad) * EMBOSS_DEPTH_PX).toFixed(2);
    var ly = (Math.sin(rad) * EMBOSS_DEPTH_PX).toFixed(2);
    var dx = (-Math.cos(rad) * EMBOSS_DEPTH_PX).toFixed(2);
    var dy = (-Math.sin(rad) * EMBOSS_DEPTH_PX).toFixed(2);
    return [
      lx + 'px ' + ly + 'px 0 rgba(255,255,255,.85)',
      dx + 'px ' + dy + 'px 1px rgba(10,10,14,.75)'
    ].join(', ');
  }

  function renderEmboss(angleDeg) {
    word.style.textShadow = buildEmbossShadow(angleDeg);
    value.textContent = Math.round(angleDeg % 360) + 'deg';
  }

  var startTime = null;
  function loop(now) {
    if (startTime === null) startTime = now;
    var t = (now - startTime) % PERIOD_MS;
    var angle = (t / PERIOD_MS) * 360;
    renderEmboss(angle);
    requestAnimationFrame(loop);
  }

  if (reduce) {
    renderEmboss(45);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
