<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대각선 길이 값만큼 길게 늘어지는 복고풍 글자 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rt is-demo" id="rt">
  <p class="rt__badge"><span class="rt__badgeLabel">그림자 길이</span> <span class="rt__badgeValue" id="rtValue">4px</span></p>
  <h1 class="rt__word" id="rtWord">레트로</h1>
</div>
</main>
<script>
(function () {
  var RETRO_MAX_LEN = 34;
  var RETRO_MIN_LEN = 4;
  var PERIOD_MS = 1000;

  var word = document.getElementById('rtWord');
  var value = document.getElementById('rtValue');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 값(len) 하나를 대각선 방향으로 한 칸(1px)씩 반복해 길이만큼 길게 늘어뜨린다
  function buildRetroShadow(len) {
    var parts = [];
    var n = Math.round(len);
    for (var i = 1; i <= n; i++) {
      parts.push(i + 'px ' + i + 'px 0 rgba(10,79,232,' + (0.9 - (i / n) * 0.35).toFixed(2) + ')');
    }
    return parts.join(', ');
  }

  function renderRetro(len) {
    word.style.textShadow = buildRetroShadow(len);
    value.textContent = Math.round(len) + 'px';
  }

  var startTime = null;
  function loop(now) {
    if (startTime === null) startTime = now;
    var t = (now - startTime) % PERIOD_MS;
    var phase = (Math.sin((t / PERIOD_MS) * Math.PI * 2 - Math.PI / 2) + 1) / 2;
    renderRetro(RETRO_MIN_LEN + (RETRO_MAX_LEN - RETRO_MIN_LEN) * phase);
    requestAnimationFrame(loop);
  }

  if (reduce) {
    renderRetro(RETRO_MAX_LEN);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
