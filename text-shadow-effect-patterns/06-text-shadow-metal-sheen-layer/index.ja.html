<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>層ごとに明るさの値が変わり光沢が乗る金属文字 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mt is-demo" id="mt">
  <p class="mt__badge"><span class="mt__badgeLabel">光沢角度</span> <span class="mt__badgeValue" id="mtValue">0deg</span></p>
  <h1 class="mt__word" id="mtWord">金属</h1>
</div>
</main>
<script>
(function () {
  var SHEEN_LAYER_COUNT = 7;
  var PERIOD_MS = 900;

  var word = document.getElementById('mtWord');
  var value = document.getElementById('mtValue');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 각도 값 하나로 층마다 밝기를 사인 곡선을 따라 다르게 겹쳐, 위·아래가 서로 다르게 빛나는
  // 金属 광택을 만든다. 층 위상(phase)이 갈릴수록 밝은 띠가 층을 타고 흐른다
  function buildSheenShadow(angleDeg) {
    var rad = (angleDeg * Math.PI) / 180;
    var parts = [];
    for (var i = 1; i <= SHEEN_LAYER_COUNT; i++) {
      var phase = rad + (i / SHEEN_LAYER_COUNT) * Math.PI * 1.4;
      var bright = (Math.sin(phase) + 1) / 2;
      var l = Math.round(22 + bright * 58);
      var y = (i * 6.8).toFixed(2);
      parts.push('0px ' + y + 'px 0 hsl(220 10% ' + l + '%)');
    }
    return parts.join(', ');
  }

  function renderSheen(angleDeg) {
    word.style.textShadow = buildSheenShadow(angleDeg);
    value.textContent = Math.round(angleDeg % 360) + 'deg';
  }

  var startTime = null;
  function loop(now) {
    if (startTime === null) startTime = now;
    var t = (now - startTime) % PERIOD_MS;
    var angle = (t / PERIOD_MS) * 360;
    renderSheen(angle);
    requestAnimationFrame(loop);
  }

  if (reduce) {
    renderSheen(90);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
