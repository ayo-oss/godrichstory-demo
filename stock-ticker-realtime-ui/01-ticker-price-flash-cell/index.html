<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플래시 시세 셀 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pf is-demo" id="pf">
  <div class="pf__board">
    <div class="pf__head">
      <p class="pf__title">관심 종목</p>
      <span class="pf__live">실시간</span>
    </div>
    <ul class="pf__rows">
      <!-- 행마다 이전값·현재값 두 장을 같은 칸에 겹친다 — steps(1, end) 컷이라 반투명 유령이 안 생긴다 -->
      <li class="pf__row" data-row="0">
        <span class="pf__sym">NOVA</span>
        <span class="pf__priceWrap">
          <span class="pf__price pf__price--prev" data-prev>0</span>
          <span class="pf__price pf__price--next" data-next>0</span>
        </span>
        <span class="pf__chgWrap">
          <span class="pf__chg pf__chg--prev" data-chgprev>0</span>
          <span class="pf__chg pf__chg--next" data-chgnext>0</span>
        </span>
      </li>
      <li class="pf__row" data-row="1">
        <span class="pf__sym">ORBIT</span>
        <span class="pf__priceWrap">
          <span class="pf__price pf__price--prev" data-prev>0</span>
          <span class="pf__price pf__price--next" data-next>0</span>
        </span>
        <span class="pf__chgWrap">
          <span class="pf__chg pf__chg--prev" data-chgprev>0</span>
          <span class="pf__chg pf__chg--next" data-chgnext>0</span>
        </span>
      </li>
      <li class="pf__row" data-row="2">
        <span class="pf__sym">LUMEN</span>
        <span class="pf__priceWrap">
          <span class="pf__price pf__price--prev" data-prev>0</span>
          <span class="pf__price pf__price--next" data-next>0</span>
        </span>
        <span class="pf__chgWrap">
          <span class="pf__chg pf__chg--prev" data-chgprev>0</span>
          <span class="pf__chg pf__chg--next" data-chgnext>0</span>
        </span>
      </li>
      <li class="pf__row" data-row="3">
        <span class="pf__sym">KEEL</span>
        <span class="pf__priceWrap">
          <span class="pf__price pf__price--prev" data-prev>0</span>
          <span class="pf__price pf__price--next" data-next>0</span>
        </span>
        <span class="pf__chgWrap">
          <span class="pf__chg pf__chg--prev" data-chgprev>0</span>
          <span class="pf__chg pf__chg--next" data-chgnext>0</span>
        </span>
      </li>
    </ul>
  </div>
</div>
</main>
<script>
// 가짜 시세는 시드 PRNG 로 만든다 — 같은 시드면 누가 열어도 같은 흐름이 재현된다.
// 외부 API·키가 필요 없고, 심볼도 실존 종목이 아니다.
var SEED = 296;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(SEED);
var BASE = [64200, 18450, 7320, 132900];   // 전일 종가 4종 — 등락률의 기준
// 전일 대비 등락을 먼저 한 번 굴려 오늘 가격을 만든다. 그래야 첫 화면부터 등락률이 0 이 아니다
var state = BASE.map(function (p) {
  var day = (rand() - 0.55) * 0.055;
  var now = Math.round(p * (1 + day));
  return { price: now, chg: (now - p) / p * 100 };
});
var pf = document.getElementById('pf');
var rows = [].slice.call(pf.querySelectorAll('.pf__row'));

// 숫자는 자리가 흔들리면 읽기 어렵다 — 천 단위 구분자까지 넣어 고정 폭으로 그린다
function money(n) { return n.toLocaleString('en-US'); }
function pct(v) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + '%'; }
function arrow(v) { return v >= 0 ? '▲' : '▼'; }

// 방향은 색만으로 전하지 않는다 — 화살표와 부호를 같이 적는다
function paint(i) {
  var s = state[i], row = rows[i];
  row.querySelector('[data-next]').textContent = money(s.price);
  row.querySelector('[data-chgnext]').textContent = arrow(s.chg) + ' ' + pct(s.chg);
  row.querySelector('[data-chgnext]').className = 'pf__chg pf__chg--next ' + (s.chg >= 0 ? 'is-up' : 'is-down');
}

function tick(i, flash) {
  var s = state[i], row = rows[i];
  var prevPrice = s.price, prevChg = s.chg;
  var step = Math.round((rand() - 0.48) * s.price * 0.004);
  if (step === 0) { step = rand() < 0.5 ? -1 : 1; }
  s.price = prevPrice + step;
  s.chg = (s.price - BASE[i]) / BASE[i] * 100;
  // 직전 값을 뒤 장에 남겨 둔다 — 사람이 "얼마에서 얼마로" 를 한 눈에 본다
  row.querySelector('[data-prev]').textContent = money(prevPrice);
  var cp = row.querySelector('[data-chgprev]');
  cp.textContent = arrow(prevChg) + ' ' + pct(prevChg);
  cp.className = 'pf__chg pf__chg--prev ' + (prevChg >= 0 ? 'is-up' : 'is-down');
  paint(i);
  if (!flash) { return; }
  // 플래시는 한 프레임에 켜고 스스로 꺼진다. 클래스를 떼었다 붙여야 같은 행이 연속으로 깜빡인다
  row.classList.remove('is-up', 'is-down');
  void row.offsetWidth;
  row.classList.add(step >= 0 ? 'is-up' : 'is-down');
}

// 첫 화면부터 "직전 값 → 현재 값" 이 서로 다르게 서 있어야 미리보기 컷이 뜻을 갖는다.
// 그래서 시작가에서 한 번씩만 값을 굴려 두고(플래시 없이) 시작한다
state.forEach(function (s, i) { tick(i, false); });

// 격자 미리보기(.is-demo) 동안에는 CSS 키프레임만 돌고 JS 는 값을 안 건드린다 — 프레임이 같은 순간에 고정돼야
// 렌더 측정이 흔들리지 않는다. 사람이 포인터를 올리거나 키보드로 들어오면 그때부터 시드 시세가 실제로 갱신된다.
function live() { if (pf.classList.contains('is-demo')) { pf.classList.remove('is-demo'); } }
['pointerdown', 'pointermove', 'focusin'].forEach(function (ev) { pf.addEventListener(ev, live); });

// 한 번에 한 행만 바꾼다 — WCAG 2.3.1 은 초당 3회 미만을 요구하고, 900ms 간격이면 1.1회다
var cursor = 0;
var timer = setInterval(function () {
  if (pf.classList.contains('is-demo')) { return; }
  if (document.visibilityState === 'hidden') { return; }
  tick(cursor);
  cursor = (cursor + 1) % rows.length;
}, 900);

// 탭을 다시 보면 현재 상태를 그대로 다시 그린다 — 안 보이는 동안 쌓아 두지 않는다
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { state.forEach(function (s, i) { paint(i); }); }
});
window.addEventListener('pagehide', function () { clearInterval(timer); });
</script>
</body>
</html>
