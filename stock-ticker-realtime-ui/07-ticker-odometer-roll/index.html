<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오도미터 숫자판 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="od is-demo" id="od">
  <div class="od__board">
    <p class="od__label">평가손익</p>
    <!-- 자릿수 칸 개수는 고정이다 — 값이 커지거나 작아져도 판이 좌우로 안 튄다.
         구분자(,)와 소수점(.)은 굴리지 않고 제자리에 박혀 있고, 부호 칸만 따로 컷으로 바뀐다. -->
    <p class="od__value">
      <span class="od__sign">
        <span class="od__glyph od__glyph--a" data-signa>−</span>
        <span class="od__glyph od__glyph--b" data-signb>+</span>
      </span>
      <span class="od__digit"><span class="od__strip" data-d="0" style="--d: 1"><span class="od__n">0</span><span class="od__n">1</span><span class="od__n">2</span><span class="od__n">3</span><span class="od__n">4</span><span class="od__n">5</span><span class="od__n">6</span><span class="od__n">7</span><span class="od__n">8</span><span class="od__n">9</span></span></span>
      <span class="od__fixed" data-lead-mark>,</span>
      <span class="od__digit"><span class="od__strip" data-d="1" style="--d: 3"><span class="od__n">0</span><span class="od__n">1</span><span class="od__n">2</span><span class="od__n">3</span><span class="od__n">4</span><span class="od__n">5</span><span class="od__n">6</span><span class="od__n">7</span><span class="od__n">8</span><span class="od__n">9</span></span></span>
      <span class="od__digit"><span class="od__strip" data-d="2" style="--d: 6"><span class="od__n">0</span><span class="od__n">1</span><span class="od__n">2</span><span class="od__n">3</span><span class="od__n">4</span><span class="od__n">5</span><span class="od__n">6</span><span class="od__n">7</span><span class="od__n">8</span><span class="od__n">9</span></span></span>
      <span class="od__digit"><span class="od__strip" data-d="3" style="--d: 9"><span class="od__n">0</span><span class="od__n">1</span><span class="od__n">2</span><span class="od__n">3</span><span class="od__n">4</span><span class="od__n">5</span><span class="od__n">6</span><span class="od__n">7</span><span class="od__n">8</span><span class="od__n">9</span></span></span>
      <span class="od__fixed">.</span>
      <span class="od__digit"><span class="od__strip" data-d="4" style="--d: 2"><span class="od__n">0</span><span class="od__n">1</span><span class="od__n">2</span><span class="od__n">3</span><span class="od__n">4</span><span class="od__n">5</span><span class="od__n">6</span><span class="od__n">7</span><span class="od__n">8</span><span class="od__n">9</span></span></span>
      <span class="od__digit"><span class="od__strip" data-d="5" style="--d: 5"><span class="od__n">0</span><span class="od__n">1</span><span class="od__n">2</span><span class="od__n">3</span><span class="od__n">4</span><span class="od__n">5</span><span class="od__n">6</span><span class="od__n">7</span><span class="od__n">8</span><span class="od__n">9</span></span></span>
      <span class="od__unit">원</span>
    </p>
    <p class="od__delta">
      <span class="od__deltaLabel">전일 대비</span>
      <span class="od__deltaWrap">
        <span class="od__deltaText od__deltaText--a" data-dela>▼ −949.15</span>
        <span class="od__deltaText od__deltaText--b" data-delb>▲ +3,196.75</span>
      </span>
      <span class="od__unit">원</span>
    </p>
  </div>
</div>
</main>
<script>
// 가짜 손익은 시드 PRNG 로 만든다 — 같은 시드면 누가 열어도 같은 흐름이 재현된다.
// 외부 API·키가 필요 없다.
var SEED = 2967;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(SEED);
var PREV_CLOSE = -420.10;      // 전일 손익 — 아래 줄의 「전일 대비」는 이 값과의 차다
var LIMIT = 9999.99;           // 자릿수 칸이 4+2 개라 여기까지만 걷는다
var od = document.getElementById('od');
var strips = [].slice.call(od.querySelectorAll('.od__strip'));
var signA = od.querySelector('[data-signa]');
var deltaA = od.querySelector('[data-dela]');
var leadMark = od.querySelector('[data-lead-mark]');
var value = -1369.25;          // HTML 의 첫 화면과 같은 값에서 출발한다

// 278-07 의 카운터와 갈리는 지점: 여기는 소수점 두 자리까지 굴리고, 음수가 되면 부호 칸이 바뀌고,
// 구분자와 소수점은 굴리지 않고 제자리에 있고, 오르내림이 색 방향까지 바꾼다.
function digitsOf(v) {
  var s = Math.abs(v).toFixed(2);          // 예: 1369.25
  var dot = s.indexOf('.');
  var whole = s.slice(0, dot);
  while (whole.length < 4) { whole = '0' + whole; }
  return (whole + s.slice(dot + 1)).split('');
}

// 굴림 위치는 자릿수 칸 자신에 올린다. @property 를 inherits: false 로 등록했으므로
// 부모에 걸면 칸이 못 읽는다 — 262-08 에서 같은 함정을 실측했다
function paint(dir) {
  var d = digitsOf(value);
  strips.forEach(function (s, i) { s.style.setProperty('--d', d[i]); });
  signA.textContent = value < 0 ? '−' : '+';
  // 앞자리 0 은 흐리게 — 칸 개수는 그대로 두고 읽는 자리만 또렷하게 남긴다.
  // 정수 네 자리 중 마지막 자리는 값이 0 이어도 항상 또렷하게 둔다
  var leading = true;
  for (var i = 0; i < 3; i++) {
    leading = leading && d[i] === '0';
    strips[i].parentNode.classList.toggle('is-lead', leading);
  }
  // 천 단위 구분자는 앞 묶음이 비었을 때만 함께 흐려진다
  leadMark.classList.toggle('is-lead', d[0] === '0');
  var gap = value - PREV_CLOSE;
  var whole = Math.floor(Math.abs(gap)).toLocaleString('en-US');
  var frac = Math.abs(gap).toFixed(2).slice(-2);
  deltaA.textContent = (gap >= 0 ? '▲ +' : '▼ −') + whole + '.' + frac;
  deltaA.className = 'od__deltaText od__deltaText--a ' + (gap >= 0 ? 'is-plus' : 'is-minus');
  // 방향이 없는 다시 그리기(탭 복귀)에서는 색을 건드리지 않는다 — 없던 오름·내림을 지어내지 않는다
  if (dir === 0) { return; }
  od.classList.remove('is-up', 'is-down');
  od.classList.add(dir > 0 ? 'is-up' : 'is-down');
}

// 손익은 0 을 가운데 두고 걷는다 — 되돌리는 힘이 있어 한쪽 끝에 붙어 살지 않고 부호가 실제로 뒤집힌다
function step() {
  var before = value;
  var next = value + (rand() - 0.5) * 3400 - value * 0.22;
  if (next > LIMIT) { next = LIMIT; }
  if (next < -LIMIT) { next = -LIMIT; }
  value = next;
  paint(next - before);
}

// 격자 미리보기(.is-demo) 동안에는 CSS 키프레임만 돌고 JS 는 DOM 을 안 건드린다 — 24프레임이 같은
// 순간을 재현해야 측정이 안 흔들린다. 포인터가 닿거나 키보드로 들어오면 그때부터 실제로 굴러간다
function live() { if (od.classList.contains('is-demo')) { od.classList.remove('is-demo'); } }
['pointerdown', 'pointermove', 'focusin'].forEach(function (ev) { od.addEventListener(ev, live); });

// 700ms 간격이면 색 방향이 초당 1.4회 바뀐다 — WCAG 2.3.1(초당 3회 미만) 아래다
var timer = setInterval(function () {
  if (od.classList.contains('is-demo')) { return; }
  if (document.visibilityState === 'hidden') { return; }
  step();
}, 700);

// 탭을 다시 보면 현재 상태를 그대로 다시 그린다 — 안 보이는 동안 갱신을 쌓아 두지 않는다
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { paint(0); }
});
window.addEventListener('pagehide', function () { clearInterval(timer); });
</script>
</body>
</html>
