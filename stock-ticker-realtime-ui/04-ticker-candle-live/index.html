<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마지막 봉이 자라는 캔들 차트 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cl is-demo" id="cl">
  <div class="cl__board">
    <div class="cl__head">
      <p class="cl__name"><span class="cl__sym">NOVA</span><span class="cl__unit">분봉</span></p>
      <span class="cl__now" data-now>0</span>
    </div>
    <div class="cl__plot" id="clPlot">
      <!-- 칸 13개 = 화면에 12개 + 오른쪽에 대기 1개. 대기 칸은 확정 컷 뒤에 밀려 들어온다 -->
      <div class="cl__track" id="clTrack" data-label="{n}번째 봉">
        <button type="button" class="cl__slot" data-i="0"><span class="cl__wick cl__wick--up" data-wu></span><span class="cl__wick cl__wick--dn" data-wd></span><span class="cl__body" data-bd></span></button>
        <button type="button" class="cl__slot" data-i="1"><span class="cl__wick cl__wick--up" data-wu></span><span class="cl__wick cl__wick--dn" data-wd></span><span class="cl__body" data-bd></span></button>
        <button type="button" class="cl__slot" data-i="2"><span class="cl__wick cl__wick--up" data-wu></span><span class="cl__wick cl__wick--dn" data-wd></span><span class="cl__body" data-bd></span></button>
        <button type="button" class="cl__slot" data-i="3"><span class="cl__wick cl__wick--up" data-wu></span><span class="cl__wick cl__wick--dn" data-wd></span><span class="cl__body" data-bd></span></button>
        <button type="button" class="cl__slot" data-i="4"><span class="cl__wick cl__wick--up" data-wu></span><span class="cl__wick cl__wick--dn" data-wd></span><span class="cl__body" data-bd></span></button>
        <button type="button" class="cl__slot" data-i="5"><span class="cl__wick cl__wick--up" data-wu></span><span class="cl__wick cl__wick--dn" data-wd></span><span class="cl__body" data-bd></span></button>
        <button type="button" class="cl__slot" data-i="6"><span class="cl__wick cl__wick--up" data-wu></span><span class="cl__wick cl__wick--dn" data-wd></span><span class="cl__body" data-bd></span></button>
        <button type="button" class="cl__slot" data-i="7"><span class="cl__wick cl__wick--up" data-wu></span><span class="cl__wick cl__wick--dn" data-wd></span><span class="cl__body" data-bd></span></button>
        <button type="button" class="cl__slot" data-i="8"><span class="cl__wick cl__wick--up" data-wu></span><span class="cl__wick cl__wick--dn" data-wd></span><span class="cl__body" data-bd></span></button>
        <button type="button" class="cl__slot" data-i="9"><span class="cl__wick cl__wick--up" data-wu></span><span class="cl__wick cl__wick--dn" data-wd></span><span class="cl__body" data-bd></span></button>
        <button type="button" class="cl__slot" data-i="10"><span class="cl__wick cl__wick--up" data-wu></span><span class="cl__wick cl__wick--dn" data-wd></span><span class="cl__body" data-bd></span></button>
        <!-- 11 = 아직 안 끝난 봉. 이 하나만 자란다 -->
        <button type="button" class="cl__slot cl__slot--live" data-i="11"><span class="cl__tag" aria-hidden="true">▲</span><span class="cl__wick cl__wick--up" data-wu></span><span class="cl__wick cl__wick--dn" data-wd></span><span class="cl__body" data-bd></span></button>
        <!-- 12 = 확정 컷 뒤 오른쪽에 서는 새 봉. 실사용에서는 자리만 지킨다(opacity 0) -->
        <button type="button" class="cl__slot cl__slot--next" data-i="12"><span class="cl__tag" aria-hidden="true">▲</span><span class="cl__wick cl__wick--up" data-wu></span><span class="cl__wick cl__wick--dn" data-wd></span><span class="cl__body" data-bd></span></button>
      </div>
    </div>
  </div>
  <div class="cl__tip" data-tip>
    <span class="cl__tipRow"><span class="cl__tipK">시가</span><span class="cl__tipV" data-v0>0</span></span>
    <span class="cl__tipRow"><span class="cl__tipK">고가</span><span class="cl__tipV" data-v1>0</span></span>
    <span class="cl__tipRow"><span class="cl__tipK">저가</span><span class="cl__tipV" data-v2>0</span></span>
    <span class="cl__tipRow"><span class="cl__tipK">종가</span><span class="cl__tipV" data-v3>0</span></span>
  </div>
</div>
</main>
<script>
// 가짜 시세는 시드 PRNG 로 만든다 — 같은 시드면 누가 열어도 같은 흐름이 재현되고 외부 API·키가 필요 없다.
// 심볼도 실존 종목이 아니다.
var SEED = 296;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(SEED);

var VISIBLE = 12;        // 화면에 서 있는 봉 수 (마지막 하나가 아직 안 끝난 봉)
var TICKS = 10;          // 한 봉이 끝날 때까지의 갱신 횟수
var STEP_MS = 260;       // 갱신 간격 — 2초에 7.7회, 값만 바뀌고 깜빡이지 않는다
var LIVE = VISIBLE - 1;

var root = document.getElementById('cl');
var plot = document.getElementById('clPlot');
var slots = [].slice.call(root.querySelectorAll('.cl__slot'));
var tip = root.querySelector('[data-tip]');
var tipV = [
  root.querySelector('[data-v0]'), root.querySelector('[data-v1]'),
  root.querySelector('[data-v2]'), root.querySelector('[data-v3]')
];
var nowEl = root.querySelector('[data-now]');
var labelTpl = document.getElementById('clTrack').getAttribute('data-label');

// 한 봉은 네 값을 쥔다: 여는 값 o, 그 주기의 최고 h, 최저 l, 닫는 값 c
function newBar(open) { return { o: open, h: open, l: open, c: open }; }
function grow(b) {
  var step = Math.round((rand() - 0.47) * b.o * 0.0018);
  if (step === 0) { step = rand() < 0.5 ? -1 : 1; }
  b.c += step;
  if (b.c > b.h) { b.h = b.c; }
  if (b.c < b.l) { b.l = b.c; }
}

var bars = [];
var seedPrice = 64200;
for (var i = 0; i < VISIBLE; i++) {
  var b = newBar(seedPrice);
  for (var s = 0; s < TICKS; s++) { grow(b); }
  bars.push(b);
  seedPrice = b.c;
}
// 미리보기 첫 장면은 오르는 봉이어야 "어느 쪽으로 자라는가" 가 한눈에 읽힌다 — 마지막 봉만 위로 맞춰 둔다
var last = bars[LIVE];
if (last.c <= last.o) { last.c = last.o + Math.max(2, Math.round(last.o * 0.0018)); }
if (last.h < last.c) { last.h = last.c + Math.round(last.o * 0.0006); }
if (last.l > last.o) { last.l = last.o - Math.round(last.o * 0.0005); }
// 13번째 칸 — 확정 컷 뒤에 오른쪽에서 서는 새 봉
function makePending() {
  var p = bars[LIVE].c;
  return { o: p, h: p + Math.round(p * 0.0008), l: p - Math.round(p * 0.0004), c: p + Math.round(p * 0.0006) };
}
var pending = makePending();

function money(n) { return n.toLocaleString('en-US'); }
function arrow(v) { return v >= 0 ? '▲' : '▼'; }

// 값 → 판 위에서 위에서부터의 % (판은 위가 비쌀수록 위). 0~100 안에 들도록 위아래로 여유를 둔다
var hi = 0, lo = 0;
function scale() {
  var all = bars.concat([pending]);
  hi = -Infinity; lo = Infinity;
  all.forEach(function (b) { if (b.h > hi) { hi = b.h; } if (b.l < lo) { lo = b.l; } });
  var pad = (hi - lo) * 0.12 || 1;
  hi += pad; lo -= pad;
}
function y(p) { return (hi - p) / (hi - lo) * 100; }

// 몸통도 심지도 **여는 값 쪽 변**을 기준점으로 늘린다. 가운데가 아니라 변을 origin 으로 잡는 이유는
// 봉이 커질 때 여는 값 자리가 그대로 있어야 하기 때문이다 — 가운데를 기준으로 늘리면 이미 확정된
// 여는 값까지 같이 움직여 차트가 거짓말을 한다.
function drawBar(el, b) {
  var up = b.c >= b.o;
  var wu = el.querySelector('[data-wu]'), wd = el.querySelector('[data-wd]'), bd = el.querySelector('[data-bd]');
  wu.style.top = y(b.h) + '%';
  wu.style.height = Math.max(0, y(b.o) - y(b.h)) + '%';
  wd.style.top = y(b.o) + '%';
  wd.style.height = Math.max(0, y(b.l) - y(b.o)) + '%';
  bd.style.top = (up ? y(b.c) : y(b.o)) + '%';
  bd.style.height = Math.max(1.4, up ? y(b.o) - y(b.c) : y(b.c) - y(b.o)) + '%';
  bd.className = 'cl__body ' + (up ? 'is-up' : 'is-down');
}

function draw() {
  scale();
  for (var i = 0; i < VISIBLE; i++) { drawBar(slots[i], bars[i]); }
  drawBar(slots[VISIBLE], pending);
  var live = bars[LIVE];
  nowEl.textContent = arrow(live.c - live.o) + ' ' + money(live.c);
  nowEl.className = 'cl__now ' + (live.c >= live.o ? 'is-up' : 'is-down');
}

// 툴팁은 절대 배치라 판의 높이 계산에서 빠진다 — 뿌리(.cl)에 padding-bottom 으로 자리를 미리 비워 둬야
// 320px 에서 세로가 넘치지 않는다(BD8·BD9).
var tipIdx = LIVE;
function showTip(i) {
  tipIdx = i;
  var b = i >= VISIBLE ? pending : bars[i];
  tipV[0].textContent = money(b.o);
  tipV[1].textContent = money(b.h);
  tipV[2].textContent = money(b.l);
  tipV[3].textContent = money(b.c);
  var r = slots[i].getBoundingClientRect(), rr = root.getBoundingClientRect();
  var half = tip.offsetWidth / 2;
  var x = r.left - rr.left + r.width / 2;
  tip.style.left = Math.min(Math.max(x, half), rr.width - half) + 'px';
}
slots.forEach(function (el, i) {
  el.setAttribute('aria-label', labelTpl.replace('{n}', i + 1));
  el.addEventListener('pointerenter', function () { showTip(i); });
  el.addEventListener('focus', function () { showTip(i); });
});
plot.addEventListener('pointerleave', function () { showTip(LIVE); });
// 툴팁 left 는 px 로 박히므로 폭이 바뀌면 다시 재야 한다 — 안 하면 폰 폭에서 판 밖으로 삐져나간다
window.addEventListener('resize', function () { showTip(tipIdx); });

draw();
showTip(LIVE);

// 격자 미리보기(.is-demo) 동안에는 CSS 키프레임만 돌고 JS 는 값을 안 건드린다 — 렌더 24프레임이 같은
// 순간을 재현해야 측정이 안 흔들린다. 포인터를 올리거나 키보드로 들어오면 그때부터 시드 시세가 갱신된다.
function live() { if (root.classList.contains('is-demo')) { root.classList.remove('is-demo'); } }
['pointerdown', 'pointermove', 'focusin'].forEach(function (ev) { root.addEventListener(ev, live); });

var left = TICKS;
var timer = setInterval(function () {
  if (root.classList.contains('is-demo')) { return; }
  if (document.visibilityState === 'hidden') { return; }
  grow(bars[LIVE]);
  left -= 1;
  if (left <= 0) {
    // 주기가 끝났다 — 맨 왼쪽 봉을 버리고 한 칸 밀린 자리에 새 봉을 세운다. 실사용에서도 이 교체는
    // 중간 장면 없이 한 번에 바뀐다(미리보기의 steps(1, end) 컷과 같은 순간)
    bars.shift();
    bars.push(pending);
    pending = makePending();
    left = TICKS;
  }
  draw();
}, STEP_MS);

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { draw(); }
});
window.addEventListener('pagehide', function () { clearInterval(timer); });
</script>
</body>
</html>
