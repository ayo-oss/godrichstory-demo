<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>しきい値バッジ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="at is-demo" id="at">
  <div class="at__card">
    <div class="at__head">
      <span class="at__sym">NOVA</span>
      <span class="at__cap">現在値</span>
    </div>

    <p class="at__priceRow">
      <!-- 이전값·현재값을 같은 칸에 겹친다 — steps(1, end) 컷이라 반투명 유령이 안 생긴다 -->
      <span class="at__priceWrap">
        <span class="at__price at__price--prev">66,940</span>
        <span class="at__price at__price--next" data-price>68,420</span>
      </span>
      <span class="at__dirWrap">
        <span class="at__dir at__dir--prev is-down">▼ −0.39%</span>
        <span class="at__dir at__dir--next is-up" data-dir>▲ +1.82%</span>
      </span>
      <!-- 방향을 색만으로 전하지 않는다 — ▲▼ 와 부호에 더해 "超過 / 未満" 를 글자로도 적는다 -->
      <span class="at__chipWrap">
        <span class="at__chip at__chip--under">未満</span>
        <span class="at__chip at__chip--over">超過</span>
      </span>
    </p>

    <div class="at__track">
      <span class="at__rail" aria-hidden="true"></span>
      <span class="at__lineHolder" data-line aria-hidden="true"><span class="at__line"></span></span>
      <span class="at__dotHolder" data-dot aria-hidden="true"><span class="at__dot"></span></span>
    </div>

    <div class="at__ctrl">
      <span class="at__ctrlLabel">しきい値</span>
      <button class="at__btn" type="button" data-step="-1" aria-label="しきい値を下げる">−</button>
      <input class="at__range" type="range" min="64000" max="72000" step="200" value="68000"
             aria-label="しきい値の設定" data-range>
      <button class="at__btn" type="button" data-step="1" aria-label="しきい値を上げる">+</button>
      <span class="at__ctrlVal" data-threshold>68,000</span>
    </div>

    <!-- aria-live 는 이 アラート 한 줄에만 붙인다 — 갱신되는 가격 칸에 붙이면 시세 전체가 계속 읽혀 스크린리더로 못 쓴다 -->
    <p class="at__alert" aria-live="polite">設定した線 <b class="at__alertVal" data-alertval>68,000</b> <span class="at__msgWrap"><span class="at__msg at__msg--under">に届いていません</span><span class="at__msg at__msg--over">を超えました</span></span></p>

    <span class="at__alertBox">
      <span class="at__pulse" aria-hidden="true"></span>
      <span class="at__badge"><svg class="at__bell" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M208 192H48a8 8 0 0 1-6.88-12C47.71 168.6 56 139.81 56 104a72 72 0 0 1 144 0c0 35.82 8.3 64.6 14.9 76a8 8 0 0 1-6.9 12" opacity=".2"/><path d="M221.8 175.94c-5.55-9.56-13.8-36.61-13.8-71.94a80 80 0 1 0-160 0c0 35.34-8.26 62.38-13.81 71.94A16 16 0 0 0 48 200h40.81a40 40 0 0 0 78.38 0H208a16 16 0 0 0 13.8-24.06M128 216a24 24 0 0 1-22.62-16h45.24A24 24 0 0 1 128 216m-80-32c7.7-13.24 16-43.92 16-80a64 64 0 1 1 128 0c0 36.05 8.28 66.73 16 80Z"/></g></svg>アラート</span>
    </span>
  </div>
</div>
</main>
<script>
// 가짜 시세는 시드 PRNG 로 만든다 — 같은 시드면 누가 열어도 같은 흐름이 재현되고 외부 API·키가 필요 없다.
// 심볼도 실존 종목이 아니다.
var SEED = 296;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(SEED);

var LOW = 64000, HIGH = 72000;   // 트랙(=슬라이더)의 양 끝. 가격도 임계선도 이 자를 공유한다
var BASE = 67200;                // 전일 終値 — 등락률의 기준
var price = 68420;               // 미리보기 컷의 "현재값" 과 같은 값에서 실사용이 이어진다
var wasOver = null;              // 아직 한 번도 재지 않았다는 뜻

var root = document.getElementById('at');
var rangeEl = root.querySelector('[data-range]');
var priceEl = root.querySelector('[data-price]');
var dirEl = root.querySelector('[data-dir]');
var thEl = root.querySelector('[data-threshold]');
var alertValEl = root.querySelector('[data-alertval]');
var dotEl = root.querySelector('[data-dot]');
var lineEl = root.querySelector('[data-line]');

// 숫자는 자리가 흔들리면 읽기 어렵다 — 천 단위 구분자까지 넣어 고정 폭으로 그린다
function money(n) { return n.toLocaleString('en-US'); }
function pct(v) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + '%'; }
function arrow(v) { return v >= 0 ? '▲' : '▼'; }
// 값 하나를 트랙 위 백분율로. 양 끝에 점이 반쯤 잘리지 않게 2~98% 로 가둔다
function posOf(v) { return Math.max(2, Math.min(98, (v - LOW) / (HIGH - LOW) * 100)); }

// 펄스는 소리가 없다. 같은 클래스를 다시 붙여도 처음부터 돌게 한 번 떼었다 붙인다
function fire() {
  root.classList.remove('is-fired');
  void root.offsetWidth;
  root.classList.add('is-fired');
}

function paint() {
  var th = Number(rangeEl.value);
  var chg = (price - BASE) / BASE * 100;
  priceEl.textContent = money(price);
  dirEl.textContent = arrow(chg) + ' ' + pct(chg);
  dirEl.className = 'at__dir at__dir--next ' + (chg >= 0 ? 'is-up' : 'is-down');
  thEl.textContent = money(th);
  alertValEl.textContent = money(th);
  // 홀더는 트랙 폭과 같아서 translateX 의 % 가 곧 트랙 위 위치다 (점 자신의 폭이 기준이 되지 않는다)
  dotEl.style.transform = 'translateX(' + posOf(price).toFixed(1) + '%)';
  lineEl.style.transform = 'translateX(' + posOf(th).toFixed(1) + '%)';
  // 임계 통과는 "이전 상태와 지금 상태가 선을 사이에 두고 갈릴 때" 만 한 번 발동한다.
  // 같은 쪽에 머무는 동안에는 값이 아무리 움직여도 다시 울리지 않는다
  var over = price >= th;
  if (wasOver === false && over) { fire(); }
  wasOver = over;
  root.classList.toggle('is-over', over);
}

function tick() {
  var step = Math.round((rand() - 0.46) * price * 0.006);
  if (step === 0) { step = rand() < 0.5 ? -1 : 1; }
  price = Math.max(LOW + 400, Math.min(HIGH - 400, price + step));
  paint();
}

// 임계선은 슬라이더로도 버튼으로도 키보드로도 움직인다. 움직이는 즉시 선 위치와 "넘었는가" 판정이 바뀐다
rangeEl.addEventListener('input', paint);
[].slice.call(root.querySelectorAll('[data-step]')).forEach(function (b) {
  b.addEventListener('click', function () {
    var d = Number(b.getAttribute('data-step')) * Number(rangeEl.step);
    var v = Number(rangeEl.value) + d;
    rangeEl.value = String(Math.max(Number(rangeEl.min), Math.min(Number(rangeEl.max), v)));
    paint();
  });
});

// 격자 미리보기(.is-demo) 동안에는 CSS 키프레임만 돌고 JS 는 화면을 안 건드린다 — 24프레임이 같은 순간을
// 재현해야 렌더 측정이 흔들리지 않는다. 포인터를 올리거나 키보드로 들어오면 그때부터 시드 시세가 갱신된다
function live() {
  if (root.classList.contains('is-demo')) { root.classList.remove('is-demo'); paint(); }
}
['pointerdown', 'pointermove', 'focusin'].forEach(function (ev) { root.addEventListener(ev, live); });

paint();

var timer = setInterval(function () {
  if (root.classList.contains('is-demo')) { return; }
  if (document.visibilityState === 'hidden') { return; }
  tick();
}, 700);

// 탭을 다시 보면 현재 상태를 그대로 다시 그린다 — 안 보이는 동안 밀린 갱신을 쌓아 두지 않는다
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { paint(); }
});
window.addEventListener('pagehide', function () { clearInterval(timer); });
</script>
</body>
</html>
