<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connection status — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cs is-demo is-live" id="cs">
  <div class="cs__board">
    <div class="cs__bar">
      <span class="cs__left">
        <svg class="cs__ic" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m96 40l33.52 88H56Zm104 88h-70.48L160 208Z" opacity=".2"/><path d="M240 128a8 8 0 0 1-8 8h-27.06l-37.78 75.58A8 8 0 0 1 160 216h-.4a8 8 0 0 1-7.08-5.14L95.35 60.76l-32.07 70.55A8 8 0 0 1 56 136H24a8 8 0 0 1 0-16h26.85l37.87-83.31a8 8 0 0 1 14.76.46l57.51 151l31.85-63.71A8 8 0 0 1 200 120h32a8 8 0 0 1 8 8"/></g></svg>
        <span class="cs__dotWrap" aria-hidden="true">
          <span class="cs__halo"></span>
          <span class="cs__dot"></span>
        </span>
        <!-- 상태는 점 색·움직임만으로 전하지 않는다 — 세 상태의 글자를 늘 같은 자리에 겹쳐 두고 한 장만 보인다 -->
        <span class="cs__stateWrap">
          <span class="cs__state cs__state--live">LIVE</span>
          <span class="cs__state cs__state--lost">Disconnected</span>
          <span class="cs__state cs__state--retry">Reconnecting<span class="cs__dots" aria-hidden="true"><i></i><i></i><i></i></span></span>
        </span>
      </span>
      <span class="cs__right">
        <svg class="cs__ic" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m238.2 87.69l-104 125.43a8 8 0 0 1-12.3 0L17.8 87.69a7.79 7.79 0 0 1 1.31-11.21a180.75 180.75 0 0 1 217.78 0a7.79 7.79 0 0 1 1.31 11.21" opacity=".2"/><path d="M247.89 80.91a15.93 15.93 0 0 0-6.17-10.81A186.67 186.67 0 0 0 128 32A186.67 186.67 0 0 0 14.28 70.1a15.93 15.93 0 0 0-6.17 10.81a15.65 15.65 0 0 0 3.54 11.89l104 125.43A15.93 15.93 0 0 0 128 224a15.93 15.93 0 0 0 12.31-5.77l104-125.43a15.65 15.65 0 0 0 3.58-11.89M128 208L24.09 82.74A170.76 170.76 0 0 1 128 48a170.76 170.76 0 0 1 103.91 34.74Z"/></g></svg>
        <!-- 지연 숫자만 칸을 겹쳐 컷 교체한다. 단위 글자는 HTML 에 두고 JS 는 숫자만 갈아 끼운다 -->
        <span class="cs__lagText"><span class="cs__lagWrap">
          <span class="cs__lag cs__lag--now" data-lag>0</span>
          <span class="cs__lag cs__lag--d0" aria-hidden="true">0</span>
          <span class="cs__lag cs__lag--d1" aria-hidden="true">1</span>
          <span class="cs__lag cs__lag--d2" aria-hidden="true">2</span>
          <span class="cs__lag cs__lag--d3" aria-hidden="true">3</span>
        </span>s ago</span>
      </span>
    </div>

    <p class="cs__cap">Prices</p>
    <ul class="cs__rows">
      <li class="cs__row">
        <span class="cs__sym">NOVA</span>
        <span class="cs__price" data-price0>64,280</span>
        <span class="cs__chg is-up" data-chg0>▲ +0.82%</span>
      </li>
      <li class="cs__row">
        <span class="cs__sym">ORBIT</span>
        <span class="cs__price" data-price1>18,120</span>
        <span class="cs__chg is-down" data-chg1>▼ −0.44%</span>
      </li>
    </ul>
  </div>
</div>
</main>
<script>
// 가짜 시세는 시드 PRNG 로 만든다 — 외부 API·키·네트워크가 없어도 같은 흐름이 재현된다
var SEED = 296;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(SEED);

var BASE = [63760, 18200];
var price = [64280, 18120];
var root = document.getElementById('cs');
var lagEl = root.querySelector('[data-lag]');
var cells = [
  { p: root.querySelector('[data-price0]'), c: root.querySelector('[data-chg0]') },
  { p: root.querySelector('[data-price1]'), c: root.querySelector('[data-chg1]') }
];

function money(n) { return n.toLocaleString('en-US'); }
function pct(v) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + '%'; }
function arrow(v) { return v >= 0 ? '▲' : '▼'; }

// 상태 이름은 클래스로만 다룬다 — 화면 글자는 HTML 에 세 장 다 있고 CSS 가 한 장만 보여 준다
var LIVE = 'is-live', LOST = 'is-lost', RETRY = 'is-retry';
function setState(name) {
  root.classList.remove(LIVE, LOST, RETRY);
  root.classList.add(name);
}

var lastAt = Date.now();   // 마지막으로 값이 들어온 시각
var ticks = 0;             // 몇 번 받았는지 — 일정 횟수마다 끊김을 흉내 낸다
var phase = LIVE;

function paint(i) {
  var chg = (price[i] - BASE[i]) / BASE[i] * 100;
  cells[i].p.textContent = money(price[i]);
  // 방향은 색만으로 전하지 않는다 — 화살표와 부호를 같이 적는다
  cells[i].c.textContent = arrow(chg) + ' ' + pct(chg);
  cells[i].c.className = 'cs__chg ' + (chg >= 0 ? 'is-up' : 'is-down');
}

function feed() {
  for (var i = 0; i < price.length; i++) {
    var step = Math.round((rand() - 0.48) * price[i] * 0.004);
    if (step === 0) { step = rand() < 0.5 ? -1 : 1; }
    price[i] = price[i] + step;
    paint(i);
  }
  lastAt = Date.now();
  ticks += 1;
}

// 지연 표시는 "마지막 갱신이 몇 초 전인가" 다. 값이 안 들어오는 동안에는 숫자가 계속 커진다
function showLag() {
  lagEl.textContent = String(Math.floor((Date.now() - lastAt) / 1000));
}

function step() {
  if (root.classList.contains('is-demo')) { return; }
  // 탭이 안 보이면 세지 않는다 — 안 보이는 화면의 지연 숫자는 뜻이 없고, 돌아왔을 때
  // 밀린 갱신이 한꺼번에 터지지도 않게 한다 (document.visibilityState)
  if (document.visibilityState === 'hidden') { return; }
  var since = Date.now() - lastAt;
  if (phase === LIVE) {
    // 다섯 번 받고 나면 값이 안 오는 상황을 흉내 낸다 — 지연이 쌓이면 상태가 스스로 넘어간다
    if (ticks > 0 && ticks % 5 === 0) {
      if (since > 2600) { phase = LOST; setState(LOST); }
    } else if (since > 1400) { feed(); }
  } else if (phase === LOST) {
    if (since > 4200) { phase = RETRY; setState(RETRY); }
  } else if (since > 6000) {
    phase = LIVE; setState(LIVE); feed();
  }
  showLag();
}

// 격자 미리보기(.is-demo) 동안에는 CSS 키프레임만 돌고 JS 는 화면을 안 건드린다 — 24프레임이 같은
// 순간을 재현해야 렌더 측정이 흔들리지 않는다. 사람이 닿으면 그때부터 실제 갱신이 시작된다
function live() {
  if (root.classList.contains('is-demo')) {
    root.classList.remove('is-demo');
    lastAt = Date.now();
    showLag();
  }
}
['pointerdown', 'pointermove', 'focusin'].forEach(function (ev) { root.addEventListener(ev, live); });

var timer = setInterval(step, 250);

// 탭이 다시 보이면 지연을 지금부터 새로 센다 — 안 보던 동안의 초를 몰아서 보여 주지 않는다
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { lastAt = Date.now(); showLag(); }
});
window.addEventListener('pagehide', function () { clearInterval(timer); });
</script>
</body>
</html>
