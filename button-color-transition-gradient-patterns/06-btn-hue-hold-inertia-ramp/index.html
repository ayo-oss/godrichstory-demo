<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>누르고 있는 동안 색상이 가속하며 도는 버튼 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bc is-demo" id="bcRoot">
  <button class="bc__btn" id="bcBtn" type="button">꾹 누르기</button>
  <p class="bc__meta"><span class="bc__tag">HUE</span> <b id="bcHue">270</b><span>deg</span> <span class="bc__tag">SPEED</span> <b id="bcSpeed">0</b></p>
</div>
</main>
<script>
(function () {
  // 기법: 누르는 동안 색상 각속도가 ACCEL 로 커지고(상한 MAX_SPEED), 떼면 FRICTION 으로 줄어 멈춘다.
  // 색상 각도는 속도를 매 프레임 쌓아 얻는다. 시간은 rAF 타임스탬프 간격(dt)만 쓴다.
  var ACCEL = 600;
  var MAX_SPEED = 720;
  var FRICTION = 2.4;
  var HUE_START = 270;
  var HUE_STEP = 60;
  var START_MS = 200;
  var HOLD_MS = 900;
  var CYCLE_MS = 2000;

  var root = document.getElementById('bcRoot');
  var btn = document.getElementById('bcBtn');
  var hueEl = document.getElementById('bcHue');
  var speedEl = document.getElementById('bcSpeed');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var hue = HUE_START;
  var speed = 0;
  var pressed = false;
  var t0 = null;
  var lastTs = null;

  function paint() {
    btn.style.setProperty('--hue', hue.toFixed(1));
    hueEl.textContent = String(Math.round(hue));
    speedEl.textContent = String(Math.round(speed));
  }
  function stopDemo() { root.classList.remove('is-demo'); }
  function press() {
    stopDemo();
    pressed = true;
    if (reduce) { hue = (hue + HUE_STEP) % 360; paint(); }
  }
  function release() { pressed = false; }

  btn.addEventListener('pointerdown', function (e) {
    try { btn.setPointerCapture(e.pointerId); } catch (err) { /* 캡처를 못 걸어도 누름은 동작한다 */ }
    press();
  });
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('blur', release);
  btn.addEventListener('keydown', function (e) {
    if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) press();
  });
  btn.addEventListener('keyup', function (e) {
    if (e.key === ' ' || e.key === 'Enter') release();
  });

  function demoPressed(now) {
    return root.classList.contains('is-demo') && now >= START_MS && (now - START_MS) % CYCLE_MS < HOLD_MS;
  }

  function tick(ts) {
    if (t0 === null) t0 = ts;
    var now = ts - t0;
    var dt = lastTs === null ? 0.016 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if (demoPressed(now) || pressed) {
      speed = Math.min(MAX_SPEED, speed + ACCEL * dt);
    } else {
      speed *= Math.exp(-FRICTION * dt);
      if (speed < 0.5) speed = 0;
    }
    hue = (hue + speed * dt) % 360;
    paint();
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    paint();
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
