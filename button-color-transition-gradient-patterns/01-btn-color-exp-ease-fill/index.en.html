<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base Hover That Pulls the Color Toward Its Target — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bc is-demo" id="bcRoot">
  <button class="bc__btn" id="bcBtn" type="button">Save</button>
  <p class="bc__meta"><span class="bc__tag">GAP</span> <b id="bcGap">0</b> <span class="bc__hex" id="bcHex">#b9a0ff</span></p>
</div>
</main>
<script>
(function () {
  // 기법: 매 프레임 현재 색이 목표 색까지 남은 거리의 일정 비율만큼 다가간다 (시간 곡선 없음).
  // 비율은 프레임 간격(dt)으로 보정해 60Hz 든 120Hz 든 같은 속도로 도착한다.
  var PULL_RATE = 7;
  var SETTLE_GAP = 0.5;
  var START_MS = 200;
  var ON_MS = 900;
  var CYCLE_MS = 2000;

  var root = document.getElementById('bcRoot');
  var btn = document.getElementById('bcBtn');
  var gapEl = document.getElementById('bcGap');
  var hexEl = document.getElementById('bcHex');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function readRgb(name) {
    var v = getComputedStyle(btn).getPropertyValue(name).trim().replace('#', '');
    if (v.length === 3) v = v.split('').map(function (c) { return c + c; }).join('');
    return [parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16)];
  }
  function toHex(rgb) {
    return '#' + rgb.map(function (c) { return ('0' + Math.round(c).toString(16)).slice(-2); }).join('');
  }

  var from = readRgb('--c-from');
  var to = readRgb('--c-to');
  var cur = from.slice();
  var pointerIn = false;
  var kbFocus = false;
  var t0 = null;
  var lastTs = null;

  function demoOn(now) {
    return root.classList.contains('is-demo') && now >= START_MS && (now - START_MS) % CYCLE_MS < ON_MS;
  }
  function target(now) { return demoOn(now) || pointerIn || kbFocus ? to : from; }

  function gapOf(goal) {
    return Math.abs(goal[0] - cur[0]) + Math.abs(goal[1] - cur[1]) + Math.abs(goal[2] - cur[2]);
  }
  function paint(goal) {
    btn.style.background = toHex(cur);
    gapEl.textContent = String(Math.round(gapOf(goal)));
    hexEl.textContent = toHex(cur);
  }
  function stopDemo() { root.classList.remove('is-demo'); }
  function jump() { cur = (pointerIn || kbFocus ? to : from).slice(); paint(pointerIn || kbFocus ? to : from); }

  btn.addEventListener('pointerenter', function () { stopDemo(); pointerIn = true; if (reduce) jump(); });
  btn.addEventListener('pointerleave', function () { pointerIn = false; if (reduce) jump(); });
  btn.addEventListener('focus', function () { kbFocus = btn.matches(':focus-visible'); if (kbFocus) stopDemo(); if (reduce) jump(); });
  btn.addEventListener('blur', function () { kbFocus = false; if (reduce) jump(); });

  function tick(ts) {
    if (t0 === null) t0 = ts;
    var now = ts - t0;
    var dt = lastTs === null ? 0.016 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    var goal = target(now);
    var k = 1 - Math.exp(-dt * PULL_RATE);
    for (var i = 0; i < 3; i += 1) cur[i] += (goal[i] - cur[i]) * k;
    if (gapOf(goal) < SETTLE_GAP) cur = goal.slice();
    paint(goal);
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    paint(from);
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
