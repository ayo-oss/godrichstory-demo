<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>색 경계가 스프링으로 밀려가는 그라데이션 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bc is-demo" id="bcRoot">
  <button class="bc__btn" id="bcBtn" type="button">다음 단계</button>
  <p class="bc__meta"><span class="bc__tag">STOP</span> <b id="bcPos">20</b><span>%</span></p>
</div>
</main>
<script>
(function () {
  // 기법: 그라데이션 색 경계의 위치(--stop, 퍼센트)를 스프링 방정식으로 푼다.
  // 가속도 = 강성 x (목표 - 위치) - 감쇠 x 속도. 고정 간격으로 쪼개 적분하므로 프레임 속도와 상관없이 같은 흔들림이 나온다.
  var STIFFNESS = 170;
  var DAMPING = 11;
  var STOP_REST = 20;
  var STOP_HOVER = 70;
  var STEP = 1 / 120;
  var START_MS = 200;
  var ON_MS = 800;
  var CYCLE_MS = 2000;

  var root = document.getElementById('bcRoot');
  var btn = document.getElementById('bcBtn');
  var posEl = document.getElementById('bcPos');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var pos = STOP_REST;
  var vel = 0;
  var acc = 0;
  var pointerIn = false;
  var kbFocus = false;
  var t0 = null;
  var lastTs = null;

  function demoOn(now) {
    return root.classList.contains('is-demo') && now >= START_MS && (now - START_MS) % CYCLE_MS < ON_MS;
  }
  function goal(now) { return demoOn(now) || pointerIn || kbFocus ? STOP_HOVER : STOP_REST; }
  function paint() {
    btn.style.setProperty('--stop', pos.toFixed(2));
    posEl.textContent = String(Math.round(pos));
  }
  function stopDemo() { root.classList.remove('is-demo'); }
  function jump() { pos = pointerIn || kbFocus ? STOP_HOVER : STOP_REST; vel = 0; paint(); }

  btn.addEventListener('pointerenter', function () { stopDemo(); pointerIn = true; if (reduce) jump(); });
  btn.addEventListener('pointerleave', function () { pointerIn = false; if (reduce) jump(); });
  btn.addEventListener('focus', function () { kbFocus = btn.matches(':focus-visible'); if (kbFocus) stopDemo(); if (reduce) jump(); });
  btn.addEventListener('blur', function () { kbFocus = false; if (reduce) jump(); });

  function tick(ts) {
    if (t0 === null) t0 = ts;
    var now = ts - t0;
    var dt = lastTs === null ? 0.016 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    var g = goal(now);
    acc += dt;
    while (acc >= STEP) {
      vel += (STIFFNESS * (g - pos) - DAMPING * vel) * STEP;
      pos += vel * STEP;
      acc -= STEP;
    }
    paint();
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    paint();
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
