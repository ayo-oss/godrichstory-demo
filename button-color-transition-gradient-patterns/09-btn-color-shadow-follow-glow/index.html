<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바탕색을 따라 그림자 색이 번지는 버튼 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bc is-demo" id="bcRoot">
  <button class="bc__btn" id="bcBtn" type="button">구매하기</button>
  <p class="bc__meta"><span class="bc__tag">SHADOW</span> <span id="bcHex">#6f6099</span> <span class="bc__tag">Y</span> <b id="bcY">4</b></p>
</div>
</main>
<script>
(function () {
  // 기법: 진행도 p 하나가 바탕색·그림자 색·그림자 높이를 함께 정한다. 바탕색은 from→to 로 섞고,
  // 그림자 색은 지금 바탕색의 각 채널에 SHADOW_DARKEN 을 곱해 만든다. p 는 목표로 일정 비율씩 끌린다.
  var SHADOW_DARKEN = 0.6;
  var SHADOW_ALPHA = 0.55;
  var LIFT_REST = 4;
  var LIFT_HOVER = 14;
  var BLUR_REST = 10;
  var BLUR_HOVER = 28;
  var GLOW_RATE = 6;
  var START_MS = 200;
  var ON_MS = 1000;
  var CYCLE_MS = 2000;

  var root = document.getElementById('bcRoot');
  var btn = document.getElementById('bcBtn');
  var hexEl = document.getElementById('bcHex');
  var yEl = document.getElementById('bcY');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function readRgb(name) {
    var v = getComputedStyle(btn).getPropertyValue(name).trim().replace('#', '');
    if (v.length === 3) v = v.split('').map(function (c) { return c + c; }).join('');
    return [parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16)];
  }
  function toHex(rgb) {
    return '#' + rgb.map(function (c) { return ('0' + Math.round(c).toString(16)).slice(-2); }).join('');
  }

  var from = readRgb('--c-from');
  var to = readRgb('--c-to');
  var p = 0;
  var pointerIn = false;
  var kbFocus = false;
  var t0 = null;
  var lastTs = null;

  function demoOn(now) {
    return root.classList.contains('is-demo') && now >= START_MS && (now - START_MS) % CYCLE_MS < ON_MS;
  }
  function paint() {
    var fill = from.map(function (v, i) { return v + (to[i] - v) * p; });
    var shade = fill.map(function (v) { return v * SHADOW_DARKEN; });
    var lift = LIFT_REST + (LIFT_HOVER - LIFT_REST) * p;
    var blur = BLUR_REST + (BLUR_HOVER - BLUR_REST) * p;
    btn.style.background = toHex(fill);
    btn.style.boxShadow = '0 ' + lift.toFixed(1) + 'px ' + blur.toFixed(1) + 'px rgba(' +
      Math.round(shade[0]) + ', ' + Math.round(shade[1]) + ', ' + Math.round(shade[2]) + ', ' + SHADOW_ALPHA + ')';
    hexEl.textContent = toHex(shade);
    yEl.textContent = String(Math.round(lift));
  }
  function stopDemo() { root.classList.remove('is-demo'); }
  function jump() { p = pointerIn || kbFocus ? 1 : 0; paint(); }

  btn.addEventListener('pointerenter', function () { stopDemo(); pointerIn = true; if (reduce) jump(); });
  btn.addEventListener('pointerleave', function () { pointerIn = false; if (reduce) jump(); });
  btn.addEventListener('focus', function () { kbFocus = btn.matches(':focus-visible'); if (kbFocus) stopDemo(); if (reduce) jump(); });
  btn.addEventListener('blur', function () { kbFocus = false; if (reduce) jump(); });

  function tick(ts) {
    if (t0 === null) t0 = ts;
    var now = ts - t0;
    var dt = lastTs === null ? 0.016 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    var g = demoOn(now) || pointerIn || kbFocus ? 1 : 0;
    p += (g - p) * (1 - Math.exp(-dt * GLOW_RATE));
    if (Math.abs(g - p) < 0.002) p = g;
    paint();
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    paint();
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
