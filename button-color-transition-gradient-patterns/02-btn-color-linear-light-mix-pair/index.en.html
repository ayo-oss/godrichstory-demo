<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gamma-Corrected Mix Beside a Plain Mix — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bc is-demo" id="bcRoot">
  <div class="bc__pair" id="bcPair">
    <div class="bc__cell">
      <button class="bc__btn" id="bcRaw" type="button">Subscribe</button>
      <p class="bc__meta"><span class="bc__tag">SRGB</span> <span class="bc__hex" id="bcRawHex">#ff9ebb</span></p>
      <p class="bc__meta"><span class="bc__tag">50%</span> <span class="bc__swatch" id="bcRawMid"></span> <span class="bc__hex" id="bcRawMidHex">#a6b9b0</span></p>
    </div>
    <div class="bc__cell">
      <button class="bc__btn" id="bcLin" type="button">Subscribe</button>
      <p class="bc__meta"><span class="bc__tag">LINEAR</span> <span class="bc__hex" id="bcLinHex">#ff9ebb</span></p>
      <p class="bc__meta"><span class="bc__tag">50%</span> <span class="bc__swatch" id="bcLinMid"></span> <span class="bc__hex" id="bcLinMidHex">#c1bcb1</span></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  // 기법: 같은 두 색을 같은 진행도 t 로 섞는다. 왼쪽은 sRGB 값을 그대로, 오른쪽은 선형 밝기로 되돌려 섞은 뒤 다시 감마를 씌운다.
  // 진행도 t 는 두 버튼이 함께 쓰고 매 프레임 목표로 일정 비율 끌린다. 두 중간 색의 차이만 눈에 남는다.
  var MIX_RATE = 5;
  var START_MS = 200;
  var ON_MS = 1000;
  var RAMP_MS = 800;
  var HOLD_MS = 100;
  var CYCLE_MS = 2000;

  var root = document.getElementById('bcRoot');
  var rawBtn = document.getElementById('bcRaw');
  var linBtn = document.getElementById('bcLin');
  var rawHex = document.getElementById('bcRawHex');
  var linHex = document.getElementById('bcLinHex');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function readRgb(name) {
    var v = getComputedStyle(rawBtn).getPropertyValue(name).trim().replace('#', '');
    if (v.length === 3) v = v.split('').map(function (c) { return c + c; }).join('');
    return [parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16)];
  }
  function toHex(rgb) {
    return '#' + rgb.map(function (c) { return ('0' + Math.round(c).toString(16)).slice(-2); }).join('');
  }
  function toLinear(c) {
    var s = c / 255;
    return s <= 0.04045 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  }
  function toGamma(l) {
    var s = l <= 0.0031308 ? l * 12.92 : 1.055 * Math.pow(l, 1 / 2.4) - 0.055;
    return Math.max(0, Math.min(255, s * 255));
  }
  function mixRaw(a, b, t) { return a.map(function (v, i) { return v + (b[i] - v) * t; }); }
  function mixLinear(a, b, t) {
    return a.map(function (v, i) {
      var la = toLinear(v);
      return toGamma(la + (toLinear(b[i]) - la) * t);
    });
  }

  var from = readRgb('--c-from');
  var to = readRgb('--c-to');
  var mix = 0;
  var rawMid = toHex(mixRaw(from, to, 0.5));
  var linMid = toHex(mixLinear(from, to, 0.5));
  document.getElementById('bcRawMid').style.background = rawMid;
  document.getElementById('bcLinMid').style.background = linMid;
  document.getElementById('bcRawMidHex').textContent = rawMid;
  document.getElementById('bcLinMidHex').textContent = linMid;
  var pointerIn = false;
  var kbFocus = false;
  var t0 = null;
  var lastTs = null;

  function demoOn(now) {
    return root.classList.contains('is-demo') && now >= START_MS && (now - START_MS) % CYCLE_MS < ON_MS;
  }
  // 시연 전용: 진행도를 smoothstep 으로 오르내려 변화가 가장 큰 순간이 두 중간 색이 벌어진 한가운데에 오게 한다.
  function demoMix(now) {
    if (now < START_MS) return 0;
    var c = (now - START_MS) % CYCLE_MS;
    var s;
    if (c < RAMP_MS) { s = c / RAMP_MS; return s * s * (3 - 2 * s); }
    if (c < RAMP_MS + HOLD_MS) return 1;
    if (c < 2 * RAMP_MS + HOLD_MS) { s = (c - RAMP_MS - HOLD_MS) / RAMP_MS; return 1 - s * s * (3 - 2 * s); }
    return 0;
  }
  function paint() {
    var a = mixRaw(from, to, mix);
    var b = mixLinear(from, to, mix);
    rawBtn.style.background = toHex(a);
    linBtn.style.background = toHex(b);
    rawHex.textContent = toHex(a);
    linHex.textContent = toHex(b);
  }
  function stopDemo() { root.classList.remove('is-demo'); }
  function goal(now) { return demoOn(now) || pointerIn || kbFocus ? 1 : 0; }
  function jump() { mix = pointerIn || kbFocus ? 1 : 0; paint(); }

  [rawBtn, linBtn].forEach(function (b) {
    b.addEventListener('pointerenter', function () { stopDemo(); pointerIn = true; if (reduce) jump(); });
    b.addEventListener('pointerleave', function () { pointerIn = false; if (reduce) jump(); });
    b.addEventListener('focus', function () { kbFocus = b.matches(':focus-visible'); if (kbFocus) stopDemo(); if (reduce) jump(); });
    b.addEventListener('blur', function () { kbFocus = false; if (reduce) jump(); });
  });

  function tick(ts) {
    if (t0 === null) t0 = ts;
    var now = ts - t0;
    var dt = lastTs === null ? 0.016 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if (root.classList.contains('is-demo')) {
      mix = demoMix(now);
    } else {
      var g = goal(now);
      mix += (g - mix) * (1 - Math.exp(-dt * MIX_RATE));
      if (Math.abs(g - mix) < 0.002) mix = g;
    }
    paint();
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    paint();
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
