<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두 겹을 포개 그라데이션을 바꾸는 크로스페이드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bc is-demo" id="bcRoot">
  <div class="bc__pair">
    <div class="bc__cell">
      <button class="bc__btn" id="bcSwap" type="button"><span class="bc__label">그냥 교체</span></button>
      <p class="bc__meta"><span class="bc__tag">SWAP</span> <b id="bcSwapVal">0</b></p>
    </div>
    <div class="bc__cell">
      <button class="bc__btn" id="bcFade" type="button"><span class="bc__layer" id="bcLayer"></span><span class="bc__label">두 겹</span></button>
      <p class="bc__meta"><span class="bc__tag">OPACITY</span> <b id="bcFadeVal">0.00</b></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  // 기법: background 의 그라데이션은 transition 으로 보간되지 않는다 (왼쪽처럼 한 번에 바뀐다).
  // 그래서 아래 겹에 첫 그라데이션, 위 겹에 두 번째 그라데이션을 깔고 위 겹의 opacity 만 움직인다 (오른쪽).
  // opacity 는 JS 가 목표로 일정 비율씩 끌어 옮긴다.
  var FADE_RATE = 6;
  var START_MS = 200;
  var ON_MS = 1000;
  var CYCLE_MS = 2000;

  var root = document.getElementById('bcRoot');
  var swapBtn = document.getElementById('bcSwap');
  var fadeBtn = document.getElementById('bcFade');
  var layer = document.getElementById('bcLayer');
  var swapVal = document.getElementById('bcSwapVal');
  var fadeVal = document.getElementById('bcFadeVal');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var amount = 0;
  var pointerIn = false;
  var kbFocus = false;
  var t0 = null;
  var lastTs = null;

  function demoOn(now) {
    return root.classList.contains('is-demo') && now >= START_MS && (now - START_MS) % CYCLE_MS < ON_MS;
  }
  function goal(now) { return demoOn(now) || pointerIn || kbFocus ? 1 : 0; }
  function paint() {
    layer.style.opacity = amount.toFixed(3);
    fadeVal.textContent = amount.toFixed(2);
    var on = amount >= 0.5;
    swapBtn.classList.toggle('bc__on', on);
    swapVal.textContent = on ? '1' : '0';
  }
  function stopDemo() { root.classList.remove('is-demo'); }
  function jump() { amount = pointerIn || kbFocus ? 1 : 0; paint(); }

  [swapBtn, fadeBtn].forEach(function (b) {
    b.addEventListener('pointerenter', function () { stopDemo(); pointerIn = true; if (reduce) jump(); });
    b.addEventListener('pointerleave', function () { pointerIn = false; if (reduce) jump(); });
    b.addEventListener('focus', function () { kbFocus = b.matches(':focus-visible'); if (kbFocus) stopDemo(); if (reduce) jump(); });
    b.addEventListener('blur', function () { kbFocus = false; if (reduce) jump(); });
  });

  function tick(ts) {
    if (t0 === null) t0 = ts;
    var now = ts - t0;
    var dt = lastTs === null ? 0.016 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    var g = goal(now);
    amount += (g - amount) * (1 - Math.exp(-dt * FADE_RATE));
    if (Math.abs(g - amount) < 0.004) amount = g;
    paint();
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    paint();
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
