<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>斜めの光の帯が色の上をなでる光沢 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bc is-demo" id="bcRoot">
  <button class="bc__btn" id="bcBtn" type="button">始める</button>
  <p class="bc__meta"><span class="bc__tag">BAND</span> <b id="bcX">-30</b><span>%</span> <span class="bc__tag">GLOW</span> <b id="bcA">0.00</b></p>
</div>
</main>
<script>
(function () {
  // 기법: 기울어진 밝은 띠의 위치(--x)와 세기(--glow)를 JS 가 계산한다. hover 가 시작되면 SWEEP_MS 동안 띠가 한 번 지나간다.
  // 위치는 smoothstep 곡선, 세기는 사인 반 주기라서 띠가 들어올 때 서서히 밝아지고 나갈 때 서서히 사라진다.
  var SWEEP_MS = 700;
  var BAND_FROM = -30;
  var BAND_TO = 130;
  var PEAK_GLOW = 0.7;
  var START_MS = 200;
  var ON_MS = 900;
  var CYCLE_MS = 2000;

  var root = document.getElementById('bcRoot');
  var btn = document.getElementById('bcBtn');
  var xEl = document.getElementById('bcX');
  var aEl = document.getElementById('bcA');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var pointerIn = false;
  var kbFocus = false;
  var wasOn = false;
  var sweepAt = -1;
  var t0 = null;

  function demoOn(now) {
    return root.classList.contains('is-demo') && now >= START_MS && (now - START_MS) % CYCLE_MS < ON_MS;
  }
  function paint(x, glow) {
    btn.style.setProperty('--x', x.toFixed(1));
    btn.style.setProperty('--glow', glow.toFixed(3));
    xEl.textContent = String(Math.round(x));
    aEl.textContent = glow.toFixed(2);
  }
  function stopDemo() { root.classList.remove('is-demo'); }
  function staticState() {
    if (pointerIn || kbFocus) paint(50, 0.5); else paint(BAND_FROM, 0);
  }

  btn.addEventListener('pointerenter', function () { stopDemo(); pointerIn = true; if (reduce) staticState(); });
  btn.addEventListener('pointerleave', function () { pointerIn = false; if (reduce) staticState(); });
  btn.addEventListener('focus', function () { kbFocus = btn.matches(':focus-visible'); if (kbFocus) stopDemo(); if (reduce) staticState(); });
  btn.addEventListener('blur', function () { kbFocus = false; if (reduce) staticState(); });

  function tick(ts) {
    if (t0 === null) t0 = ts;
    var now = ts - t0;
    var on = demoOn(now) || pointerIn || kbFocus;
    if (on && !wasOn) sweepAt = now;
    wasOn = on;
    var p = sweepAt < 0 ? 1 : Math.min(1, (now - sweepAt) / SWEEP_MS);
    var eased = p * p * (3 - 2 * p);
    if (p >= 1) paint(BAND_FROM, 0);
    else paint(BAND_FROM + (BAND_TO - BAND_FROM) * eased, PEAK_GLOW * Math.sin(Math.PI * p));
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    staticState();
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
