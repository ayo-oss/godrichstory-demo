<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角度がポインターの方へゆっくり向くグラデーション — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bc is-demo" id="bcRoot">
  <button class="bc__btn" id="bcBtn" type="button">向きを追う</button>
  <p class="bc__meta"><span class="bc__tag">ANGLE</span> <b id="bcAng">135</b><span>deg</span></p>
</div>
</main>
<script>
(function () {
  // 기법: 포인터가 버튼 중심에서 향한 방향을 각도로 바꿔 목표로 삼고, 현재 각도가 그쪽으로 일정 비율씩 돈다.
  // 각도는 0/360 경계가 있어 차이를 -180~180 으로 접어 가까운 쪽으로 돌린다. 포인터가 나가면 REST_ANGLE 로 돌아온다.
  var FOLLOW_RATE = 6;
  var REST_ANGLE = 135;
  var START_MS = 200;
  var ORBIT_MS = 1300;
  var CYCLE_MS = 2000;
  var ORBIT_SPAN = 300;

  var root = document.getElementById('bcRoot');
  var btn = document.getElementById('bcBtn');
  var angEl = document.getElementById('bcAng');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var angle = REST_ANGLE;
  var goalAngle = REST_ANGLE;
  var pointerIn = false;
  var t0 = null;
  var lastTs = null;

  function wrap(a) { return ((a % 360) + 360) % 360; }
  function fromPoint(x, y) {
    var r = btn.getBoundingClientRect();
    var dx = x - (r.left + r.width / 2);
    var dy = y - (r.top + r.height / 2);
    return wrap(Math.atan2(dx, -dy) * 180 / Math.PI);
  }
  function paint() {
    btn.style.setProperty('--ang', angle.toFixed(2));
    angEl.textContent = String(Math.round(wrap(angle)));
  }
  function stopDemo() { root.classList.remove('is-demo'); }

  btn.addEventListener('pointermove', function (e) {
    stopDemo();
    pointerIn = true;
    goalAngle = fromPoint(e.clientX, e.clientY);
    if (reduce) { angle = goalAngle; paint(); }
  });
  btn.addEventListener('pointerleave', function () {
    pointerIn = false;
    goalAngle = REST_ANGLE;
    if (reduce) { angle = goalAngle; paint(); }
  });

  function demoGoal(now) {
    if (now < START_MS) return REST_ANGLE;
    var c = (now - START_MS) % CYCLE_MS;
    if (c >= ORBIT_MS) return REST_ANGLE;
    return wrap(60 + (c / ORBIT_MS) * ORBIT_SPAN);
  }

  function tick(ts) {
    if (t0 === null) t0 = ts;
    var now = ts - t0;
    var dt = lastTs === null ? 0.016 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    var g = root.classList.contains('is-demo') ? demoGoal(now) : goalAngle;
    var diff = ((g - angle + 540) % 360) - 180;
    angle = wrap(angle + diff * (1 - Math.exp(-dt * FOLLOW_RATE)));
    paint();
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    paint();
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
