<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottom sheet palette — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ph is-demo is-open">
    <div class="ph__page" aria-hidden="true">
      <span class="ph__ln" style="width: 56%"></span>
      <span class="ph__ln" style="width: 84%"></span>
      <span class="ph__ln" style="width: 72%"></span>
      <span class="ph__ln" style="width: 40%"></span>
    </div>
    <span class="ph__dim" aria-hidden="true"></span>
    <div class="ph__sheet" role="dialog" aria-modal="true" aria-label="Command palette">
      <button class="ph__grab" id="grab" type="button" aria-label="Close palette"></button>
      <div class="ph__bar">
        <span class="ph__mag" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M192 112a80 80 0 1 1-80-80a80 80 0 0 1 80 80" opacity=".2"/><path d="m229.66 218.34l-50.06-50.06a88.21 88.21 0 1 0-11.32 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></g></svg></span>
        <input class="ph__input" id="q" type="text" role="combobox" aria-expanded="true" aria-controls="list" aria-label="Search commands" placeholder="Search commands" autocomplete="off">
      </div>
      <div class="ph__list" id="list" role="listbox" aria-label="Command palette">
        <div class="ph__opt" id="o1" role="option" aria-selected="false" tabindex="-1">Create document</div>
        <div class="ph__opt" id="o2" role="option" aria-selected="false" tabindex="-1">Invite member</div>
        <div class="ph__opt" id="o3" role="option" aria-selected="false" tabindex="-1">Open settings</div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: ⌘K(Ctrl+K)로 시트를 올리고 내린다. 손잡이를 누르거나 Escape 를 쳐도 같은 길로 내려간다.
var ph = document.querySelector('.ph');
var input = document.getElementById('q');
var grab = document.getElementById('grab');
var opts = [].slice.call(document.querySelectorAll('.ph__opt'));
var at = -1;

function open(on) {
  ph.classList.remove('is-demo');
  ph.classList.toggle('is-open', on);
  if (on) input.focus({ preventScroll: true });
  else { opts.forEach(function (o) { o.classList.remove('is-at'); }); at = -1; }
}
grab.addEventListener('click', function () { open(false); });
document.addEventListener('keydown', function (e) {
  var k = e.key.toLowerCase();
  if ((e.metaKey || e.ctrlKey) && k === 'k') {
    open(!ph.classList.contains('is-open')); e.preventDefault(); return;
  }
  if (!ph.classList.contains('is-open')) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    ph.classList.remove('is-demo');
    at = Math.max(0, Math.min(at + (e.key === 'ArrowDown' ? 1 : -1), opts.length - 1));
    opts.forEach(function (o, i) { o.classList.toggle('is-at', i === at); });
    input.setAttribute('aria-activedescendant', opts[at].id);
    e.preventDefault();
  } else if (e.key === 'Enter' && opts[at]) {
    opts.forEach(function (o) { o.setAttribute('aria-selected', String(o === opts[at])); });
    e.preventDefault();
  } else if (e.key === 'Escape') {
    open(false);
  }
});
opts.forEach(function (o, i) {
  o.addEventListener('mousemove', function () {
    ph.classList.remove('is-demo');
    at = i; opts.forEach(function (x, k) { x.classList.toggle('is-at', k === i); });
  });
});
</script>
</body>
</html>
