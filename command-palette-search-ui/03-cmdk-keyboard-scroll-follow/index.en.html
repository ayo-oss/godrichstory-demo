<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll that follows the cursor — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pal is-demo" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="pal__bar">
      <span class="pal__mag" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M192 112a80 80 0 1 1-80-80a80 80 0 0 1 80 80" opacity=".2"/><path d="m229.66 218.34l-50.06-50.06a88.21 88.21 0 1 0-11.32 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></g></svg></span>
      <input class="pal__input" id="q" type="text" role="combobox" aria-expanded="true" aria-controls="list" aria-label="Search commands" placeholder="Search commands" autocomplete="off">
      <kbd class="pal__kbd">↓</kbd>
    </div>
    <div class="pal__box" id="box">
      <span class="pal__cursor" aria-hidden="true"></span>
      <div class="pal__track" id="list" role="listbox" aria-label="Command palette">
        <div class="pal__opt" id="o1" role="option" aria-selected="false" tabindex="-1">Create document</div>
        <div class="pal__opt" id="o2" role="option" aria-selected="false" tabindex="-1">Create folder</div>
        <div class="pal__opt" id="o3" role="option" aria-selected="false" tabindex="-1">Invite member</div>
        <div class="pal__opt" id="o4" role="option" aria-selected="false" tabindex="-1">Mute notifications</div>
        <div class="pal__opt" id="o5" role="option" aria-selected="false" tabindex="-1">Change theme</div>
        <div class="pal__opt" id="o6" role="option" aria-selected="false" tabindex="-1">Export</div>
        <div class="pal__opt" id="o7" role="option" aria-selected="false" tabindex="-1">Sign out</div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: ↑↓ 로 커서를 옮기고, 커서가 상자 밖으로 나가려는 순간 scrollIntoView 가 목록만 밀어 올린다.
var pal = document.querySelector('.pal');
var input = document.getElementById('q');
var opts = [].slice.call(document.querySelectorAll('.pal__opt'));
var at = -1;

function move(i) {
  pal.classList.remove('is-demo');
  at = Math.max(0, Math.min(i, opts.length - 1));
  opts.forEach(function (o, k) { o.classList.toggle('is-at', k === at); });
  input.setAttribute('aria-activedescendant', opts[at].id);
  // block: 'nearest' 라서 이미 보이는 줄이면 스크롤이 아예 일어나지 않는다
  opts[at].scrollIntoView({ block: 'nearest' });
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    move(at + (e.key === 'ArrowDown' ? 1 : -1)); e.preventDefault();
  } else if (e.key === 'Home' || e.key === 'End') {
    move(e.key === 'Home' ? 0 : opts.length - 1); e.preventDefault();
  } else if (e.key === 'Enter' && opts[at]) {
    opts.forEach(function (o) { o.setAttribute('aria-selected', String(o === opts[at])); });
    e.preventDefault();
  } else if (e.key === 'Escape') {
    opts.forEach(function (o) { o.classList.remove('is-at'); });
    at = -1; input.focus({ preventScroll: true });
  }
});
opts.forEach(function (o, i) { o.addEventListener('mousemove', function () { move(i); }); });
</script>
</body>
</html>
