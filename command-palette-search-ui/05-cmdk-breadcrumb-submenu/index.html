<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breadcrumb into a submenu — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pal is-demo" role="dialog" aria-modal="true" aria-label="명령 팔레트">
    <div class="pal__bar">
      <span class="pal__chip" id="chip">
        <span class="pal__chipic" aria-hidden="true"><svg viewBox="0 0 256 256" width="11" height="11"><g fill="currentColor"><path d="M168 100a60 60 0 1 1-60-60a60 60 0 0 1 60 60" opacity=".2"/><path d="M256 136a8 8 0 0 1-8 8h-16v16a8 8 0 0 1-16 0v-16h-16a8 8 0 0 1 0-16h16v-16a8 8 0 0 1 16 0v16h16a8 8 0 0 1 8 8m-57.87 58.85a8 8 0 0 1-12.26 10.3C165.75 181.19 138.09 168 108 168s-57.75 13.19-77.87 37.15a8 8 0 0 1-12.25-10.3c14.94-17.78 33.52-30.41 54.17-37.17a68 68 0 1 1 71.9 0c20.65 6.76 39.23 19.39 54.18 37.17M108 152a52 52 0 1 0-52-52a52.06 52.06 0 0 0 52 52"/></g></svg></span>
        팀에 초대
      </span>
      <input class="pal__input" id="q" type="text" role="combobox" aria-expanded="true" aria-controls="list-a" aria-label="명령 검색" placeholder="명령 검색" autocomplete="off">
    </div>
    <p class="pal__live" id="live" aria-live="polite"></p>
    <div class="pal__box">
      <div class="pal__list pal__list--a" id="list-a" role="listbox" aria-label="명령 팔레트">
        <div class="pal__opt" id="a1" role="option" aria-selected="false" tabindex="-1">팀에 초대</div>
        <div class="pal__opt" id="a2" role="option" aria-selected="false" tabindex="-1">문서 공유</div>
        <div class="pal__opt" id="a3" role="option" aria-selected="false" tabindex="-1">링크 복사</div>
        <div class="pal__opt" id="a4" role="option" aria-selected="false" tabindex="-1">보관함으로 옮기기</div>
      </div>
      <div class="pal__list pal__list--b" id="list-b" role="listbox" aria-label="팀에 초대" hidden>
        <div class="pal__opt" id="b1" role="option" aria-selected="false" tabindex="-1">디자인 팀</div>
        <div class="pal__opt" id="b2" role="option" aria-selected="false" tabindex="-1">개발 팀</div>
        <div class="pal__opt" id="b3" role="option" aria-selected="false" tabindex="-1">마케팅 팀</div>
        <div class="pal__opt" id="b4" role="option" aria-selected="false" tabindex="-1">경영지원 팀</div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 첫 줄을 고르면 입력칸 앞에 칩이 생기며 하위 목록으로 갈리고, 빈 입력칸에서 Backspace 를 치면 되돌아온다.
var pal = document.querySelector('.pal');
var input = document.getElementById('q');
var chip = document.getElementById('chip');
var live = document.getElementById('live');
var A = document.getElementById('list-a');
var B = document.getElementById('list-b');
var deep = false, at = -1;

function rows() { return [].slice.call((deep ? B : A).querySelectorAll('.pal__opt')); }
function paint() {
  pal.classList.remove('is-demo');
  pal.classList.toggle('is-deep', deep);
  A.hidden = deep; B.hidden = !deep;
  input.setAttribute('aria-controls', deep ? 'list-b' : 'list-a');
  live.textContent = deep ? '팀에 초대' : '';
  at = -1;
}
function move(i) {
  var r = rows();
  at = Math.max(0, Math.min(i, r.length - 1));
  r.forEach(function (o, k) { o.classList.toggle('is-at', k === at); });
  input.setAttribute('aria-activedescendant', r[at].id);
}
document.addEventListener('keydown', function (e) {
  var r = rows();
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    pal.classList.remove('is-demo'); move(at + (e.key === 'ArrowDown' ? 1 : -1)); e.preventDefault();
  } else if (e.key === 'Enter' && r[at]) {
    if (!deep && at === 0) { deep = true; paint(); } else { r[at].setAttribute('aria-selected', 'true'); }
    e.preventDefault();
  } else if (e.key === 'Backspace' && deep && !input.value) {
    deep = false; paint(); input.focus({ preventScroll: true }); e.preventDefault();
  } else if (e.key === 'Escape') {
    deep = false; paint(); input.value = ''; input.focus({ preventScroll: true });
  }
});
A.querySelectorAll('.pal__opt')[0].addEventListener('click', function () { deep = true; paint(); });
chip.addEventListener('click', function () { deep = false; paint(); });
</script>
</body>
</html>
