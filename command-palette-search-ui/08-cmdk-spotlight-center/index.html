<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotlight-style center field — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sp is-demo is-open" role="dialog" aria-modal="true" aria-label="전체 검색">
    <div class="sp__field">
      <span class="sp__mag" aria-hidden="true"><svg viewBox="0 0 256 256" width="18" height="18"><g fill="currentColor"><path d="M192 112a80 80 0 1 1-80-80a80 80 0 0 1 80 80" opacity=".2"/><path d="m229.66 218.34l-50.06-50.06a88.21 88.21 0 1 0-11.32 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></g></svg></span>
      <input class="sp__input" id="q" type="text" role="combobox" aria-expanded="true" aria-controls="list" aria-label="전체 검색" placeholder="전체 검색" autocomplete="off">
      <span class="sp__ghost" aria-hidden="true">보고서</span>
    </div>
    <div class="sp__panel">
      <span class="sp__sheet" aria-hidden="true"></span>
      <div class="sp__rows" id="list" role="listbox" aria-label="검색 결과">
        <div class="sp__opt" id="o1" role="option" aria-selected="false" tabindex="-1">주간 보고서</div>
        <div class="sp__opt" id="o2" role="option" aria-selected="false" tabindex="-1">분기 보고서</div>
        <div class="sp__opt" id="o3" role="option" aria-selected="false" tabindex="-1">보고서 서식</div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 글자를 치면 결과 패널이 위 모서리를 축으로 펼쳐지고, 지우거나 Escape 를 치면 같은 축으로 접힌다.
var sp = document.querySelector('.sp');
var input = document.getElementById('q');
var opts = [].slice.call(document.querySelectorAll('.sp__opt'));
var at = -1;

function open(on) {
  sp.classList.remove('is-demo');
  sp.classList.toggle('is-open', on);
  input.setAttribute('aria-expanded', String(on));
  if (!on) { opts.forEach(function (o) { o.classList.remove('is-at'); }); at = -1; }
}
input.addEventListener('input', function () { open(input.value.trim().length > 0); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!sp.classList.contains('is-open')) return;
    sp.classList.remove('is-demo');
    at = Math.max(0, Math.min(at + (e.key === 'ArrowDown' ? 1 : -1), opts.length - 1));
    opts.forEach(function (o, k) { o.classList.toggle('is-at', k === at); });
    input.setAttribute('aria-activedescendant', opts[at].id);
    e.preventDefault();
  } else if (e.key === 'Enter' && opts[at]) {
    opts.forEach(function (o) { o.setAttribute('aria-selected', String(o === opts[at])); });
    e.preventDefault();
  } else if (e.key === 'Escape') {
    input.value = ''; open(false); input.focus({ preventScroll: true });
  }
});
opts.forEach(function (o, i) {
  o.addEventListener('mousemove', function () {
    sp.classList.remove('is-demo');
    at = i; opts.forEach(function (x, k) { x.classList.toggle('is-at', k === i); });
  });
});
</script>
</body>
</html>
