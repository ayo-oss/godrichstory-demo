<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Right-aligned shortcut badges — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pal is-demo" role="dialog" aria-modal="true" aria-label="명령 팔레트">
    <div class="pal__bar">
      <span class="pal__mag" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M224 56v144a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V56a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8" opacity=".2"/><path d="M128 128a8 8 0 0 1-3 6.25l-40 32a8 8 0 1 1-10-12.5L107.19 128L75 102.25a8 8 0 1 1 10-12.5l40 32a8 8 0 0 1 3 6.25m48 24h-40a8 8 0 0 0 0 16h40a8 8 0 0 0 0-16m56-96v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16m-16 144V56H40v144z"/></g></svg></span>
      <input class="pal__input" id="q" type="text" role="combobox" aria-expanded="true" aria-controls="list" aria-label="명령 검색" placeholder="명령 검색" autocomplete="off">
    </div>
    <div class="pal__box">
      <span class="pal__cursor" aria-hidden="true"></span>
      <div class="pal__list" id="list" role="listbox" aria-label="명령 팔레트">
        <div class="pal__opt" id="o1" role="option" aria-selected="false" tabindex="-1">
          <span class="pal__name">새 문서</span>
          <span class="pal__keys"><kbd class="pal__kbd">⌘</kbd><kbd class="pal__kbd">N</kbd></span>
        </div>
        <div class="pal__opt" id="o2" role="option" aria-selected="false" tabindex="-1">
          <span class="pal__name">검색</span>
          <span class="pal__keys"><kbd class="pal__kbd">⌘</kbd><kbd class="pal__kbd">F</kbd></span>
        </div>
        <div class="pal__opt" id="o3" role="option" aria-selected="false" tabindex="-1">
          <span class="pal__name">저장</span>
          <span class="pal__keys"><kbd class="pal__kbd">⌘</kbd><kbd class="pal__kbd">S</kbd></span>
        </div>
        <div class="pal__opt" id="o4" role="option" aria-selected="false" tabindex="-1">
          <span class="pal__name">설정 열기</span>
          <span class="pal__keys"><kbd class="pal__kbd">⌘</kbd><kbd class="pal__kbd">,</kbd></span>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: ↑↓ 로 줄을 옮기면 그 줄의 키캡만 눌린 모양이 되고, 실제 ⌘/Ctrl 조합을 치면 그 줄이 실행된다.
var pal = document.querySelector('.pal');
var input = document.getElementById('q');
var opts = [].slice.call(document.querySelectorAll('.pal__opt'));
var keys = ['n', 'f', 's', ','];
var at = -1;

function move(i) {
  pal.classList.remove('is-demo');
  at = Math.max(0, Math.min(i, opts.length - 1));
  opts.forEach(function (o, k) { o.classList.toggle('is-at', k === at); });
  input.setAttribute('aria-activedescendant', opts[at].id);
}
function run(i) {
  opts.forEach(function (o, k) { o.setAttribute('aria-selected', String(k === i)); });
  opts[i].classList.add('is-run');
}
document.addEventListener('keydown', function (e) {
  var k = e.key.toLowerCase();
  if (e.metaKey || e.ctrlKey) {
    var i = keys.indexOf(k);
    if (i >= 0) { pal.classList.remove('is-demo'); move(i); run(i); e.preventDefault(); }
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    move(at + (e.key === 'ArrowDown' ? 1 : -1)); e.preventDefault();
  } else if (e.key === 'Enter' && at >= 0) {
    run(at); e.preventDefault();
  } else if (e.key === 'Escape') {
    opts.forEach(function (o) { o.classList.remove('is-at', 'is-run'); });
    at = -1; input.focus({ preventScroll: true });
  }
});
opts.forEach(function (o, i) { o.addEventListener('mousemove', function () { move(i); }); });
</script>
</body>
</html>
