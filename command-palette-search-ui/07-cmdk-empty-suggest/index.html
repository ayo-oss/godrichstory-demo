<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empty state that still suggests — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pal is-demo" role="dialog" aria-modal="true" aria-label="명령 팔레트">
    <div class="pal__bar">
      <span class="pal__mag" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M192 112a80 80 0 1 1-80-80a80 80 0 0 1 80 80" opacity=".2"/><path d="m229.66 218.34l-50.06-50.06a88.21 88.21 0 1 0-11.32 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></g></svg></span>
      <input class="pal__input" id="q" type="text" role="combobox" aria-expanded="true" aria-controls="list" aria-label="명령 검색" placeholder="명령 검색" autocomplete="off">
      <span class="pal__ghost" aria-hidden="true">월간 리포트</span>
    </div>
    <div class="pal__box">
      <div class="pal__list" id="list" role="listbox" aria-label="명령 팔레트">
        <div class="pal__opt pal__opt--out" id="o1" role="option" aria-selected="false" tabindex="-1">문서 만들기</div>
        <div class="pal__opt pal__opt--out" id="o2" role="option" aria-selected="false" tabindex="-1">팀원 초대</div>
        <div class="pal__opt pal__opt--out" id="o3" role="option" aria-selected="false" tabindex="-1">설정 열기</div>
        <div class="pal__empty" id="empty" hidden>
          <p class="pal__note">검색 결과 없음</p>
          <div class="pal__opt pal__opt--sug" id="s1" role="option" aria-selected="false" tabindex="-1">
            <span class="pal__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88m48-88a8 8 0 0 1-8 8h-32v32a8 8 0 0 1-16 0v-32H88a8 8 0 0 1 0-16h32V88a8 8 0 0 1 16 0v32h32a8 8 0 0 1 8 8"/></g></svg></span>
            <span class="pal__act">새로 만들기</span><span class="pal__q">월간 리포트</span>
          </div>
          <div class="pal__opt pal__opt--sug" id="s2" role="option" aria-selected="false" tabindex="-1">
            <span class="pal__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M192 112a80 80 0 1 1-80-80a80 80 0 0 1 80 80" opacity=".2"/><path d="m229.66 218.34l-50.06-50.06a88.21 88.21 0 1 0-11.32 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></g></svg></span>
            <span class="pal__act">전체 검색</span><span class="pal__q">월간 리포트</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 맞는 줄이 하나도 없으면 안내만 남기지 않고, 친 글자를 그대로 담은 실행 가능한 줄 두 개를 대신 올린다.
var pal = document.querySelector('.pal');
var input = document.getElementById('q');
var empty = document.getElementById('empty');
var rows = [].slice.call(document.querySelectorAll('.pal__opt--out'));
var sugs = [].slice.call(document.querySelectorAll('.pal__opt--sug'));
var names = rows.map(function (o) { return o.textContent.trim(); });
var at = -1;

function render(q) {
  pal.classList.remove('is-demo');
  var shown = 0;
  rows.forEach(function (o, i) {
    var hit = !q || names[i].indexOf(q) >= 0;
    o.hidden = !hit;
    if (hit) shown++;
  });
  empty.hidden = !(q && shown === 0);
  // 제안 줄에 방금 친 글자를 그대로 넣는다 — "그 이름으로" 가 이 상태의 값이다
  document.querySelectorAll('.pal__q').forEach(function (s) { s.textContent = q; });
  at = -1;
}
function live() { return sugs.filter(function (o) { return !empty.hidden; }).concat(rows.filter(function (o) { return !o.hidden; })); }
input.addEventListener('input', function () { render(input.value.trim()); });
document.addEventListener('keydown', function (e) {
  var vis = live();
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    pal.classList.remove('is-demo');
    at = Math.max(0, Math.min(at + (e.key === 'ArrowDown' ? 1 : -1), vis.length - 1));
    vis.forEach(function (o, i) { o.classList.toggle('is-at', i === at); });
    if (vis[at]) input.setAttribute('aria-activedescendant', vis[at].id);
    e.preventDefault();
  } else if (e.key === 'Enter' && vis[at]) {
    vis.forEach(function (o) { o.setAttribute('aria-selected', String(o === vis[at])); });
    e.preventDefault();
  } else if (e.key === 'Escape') {
    input.value = ''; render(''); input.focus({ preventScroll: true });
  }
});
</script>
</body>
</html>
