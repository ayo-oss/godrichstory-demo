<script>
// 실제 동작: 클릭 → --idx 값 교체. 알약은 translateX(var(--idx) * 56px) 로 이동(항목 폭 48 + gap 8).
var root = document.getElementById('pl');
var btns = Array.prototype.slice.call(root.querySelectorAll('.pl__btn'));
btns.forEach(function (b, i) {
  if (i === 0) b.setAttribute('aria-current', 'page');
  b.addEventListener('pointerdown', function () { root.classList.remove('is-demo'); });
  b.addEventListener('click', function () {
    root.style.setProperty('--idx', i);
    btns.forEach(function (x) { x.removeAttribute('aria-current'); });
    b.setAttribute('aria-current', 'page');
  });
});
</script>
