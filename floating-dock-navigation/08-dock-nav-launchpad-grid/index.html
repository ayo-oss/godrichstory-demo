    </div>
    <button class="lp__toggle" type="button" id="lp-toggle" aria-expanded="false" aria-controls="lp-grid">전체 메뉴</button>
  </div>
</main>
<script>
// 실제 동작: 버튼 누름 → .open 토글. 격자 열 수와 숨은 넷의 표시를 CSS 가 바꾼다.
var root = document.getElementById('lp');
var btn = document.getElementById('lp-toggle');
btn.addEventListener('click', function () {
  root.classList.remove('is-demo');
  var on = root.classList.toggle('open');
  btn.setAttribute('aria-expanded', String(on));
});
</script>
</body>
</html>
