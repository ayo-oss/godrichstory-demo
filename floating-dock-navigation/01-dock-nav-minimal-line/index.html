  </div>
</main>
<script>
// 실제 동작: 클릭 → 활성 항목 교체(aria-current). 밑줄은 transform scaleX 전환.
var root = document.getElementById('mn');
var btns = Array.prototype.slice.call(root.querySelectorAll('.mn__btn'));
function pick(i) {
  btns.forEach(function (b, j) {
    b.classList.toggle('on', i === j);
    if (i === j) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
}
pick(0);
btns.forEach(function (b, i) {
  b.addEventListener('pointerdown', function () { root.classList.remove('is-demo'); });
  b.addEventListener('click', function () { pick(i); });
});
</script>
