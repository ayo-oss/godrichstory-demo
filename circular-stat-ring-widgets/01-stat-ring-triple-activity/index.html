<title>Triple activity rings — demo</title>

<main class="stage">

        <circle cx="60" cy="60" r="40"/>
        <circle cx="60" cy="60" r="28"/>

      <g class="ar__vals">
        <circle class="ar__ring ar__ring--move" cx="60" cy="60" r="52"/>
        <circle class="ar__ring ar__ring--burn" cx="60" cy="60" r="40"/>
        <circle class="ar__ring ar__ring--rest" cx="60" cy="60" r="28"/>
      </g>
    </svg>
    <div class="ar__side">

          <span class="ar__name">운동</span>
          <b class="ar__pct ar__pct--burn"></b>
        </li>
        <li class="ar__item ar__item--rest">
          <span class="ar__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="M210.69 158.18A88 88 0 1 1 97.82 45.31A96.08 96.08 0 0 0 192 160a97 97 0 0 0 18.69-1.82" opacity=".2"/><path d="M240 96a8 8 0 0 1-8 8h-16v16a8 8 0 0 1-16 0v-16h-16a8 8 0 0 1 0-16h16V72a8 8 0 0 1 16 0v16h16a8 8 0 0 1 8 8m-96-40h8v8a8 8 0 0 0 16 0v-8h8a8 8 0 0 0 0-16h-8v-8a8 8 0 0 0-16 0v8h-8a8 8 0 0 0 0 16m72.77 97a8 8 0 0 1 1.43 8A96 96 0 1 1 95.07 37.8a8 8 0 0 1 10.6 9.06a88.07 88.07 0 0 0 103.47 103.47a8 8 0 0 1 7.63 2.67m-19.39 14.88c-1.79.09-3.59.14-5.38.14A104.11 104.11 0 0 1 88 64c0-1.79 0-3.59.14-5.38a80 80 0 1 0 109.24 109.24Z"/></g></svg></span>
          <span class="ar__name">수면</span>
          <b class="ar__pct ar__pct--rest"></b>
        </li>
      </ul>
      <button class="ar__btn" type="button">다시 채우기</button>
    </div>
  </div>
</main>
<script>
// 실제 동작: 세 값을 새로 뽑아 --p1 --p2 --p3 을 바꾼다. 링과 숫자가 같은 변수를 읽으므로 둘이 어긋나지 않는다.
var ar = document.querySelector('.ar');
ar.querySelector('.ar__btn').addEventListener('click', function () {
  ar.classList.remove('is-demo');
  for (var i = 1; i <= 3; i++) {
    ar.style.setProperty('--p' + i, String(25 + Math.floor(Math.random() * 74)));
  }
});
</script>
</body>
</html>
