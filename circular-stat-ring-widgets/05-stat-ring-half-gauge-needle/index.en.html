<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Half gauge with needle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="hg is-demo">
    <div class="hg__dial">
      <svg class="hg__svg" viewBox="0 0 152 112" width="152" height="112" aria-hidden="true">
        <path class="hg__track" d="M14 76A62 62 0 0 1 138 76"/>
        <path class="hg__arc" d="M14 76A62 62 0 0 1 138 76"/>
        <g class="hg__needle">
          <line x1="76" y1="76" x2="76" y2="28"/>
          <circle cx="76" cy="76" r="6"/>
        </g>
      </svg>
      <div class="hg__read">
        <span class="hg__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="m96 240l16-80l-64-24L160 16l-16 80l64 24Z" opacity=".2"/><path d="M215.79 118.17a8 8 0 0 0-5-5.66L153.18 90.9l14.66-73.33a8 8 0 0 0-13.69-7l-112 120a8 8 0 0 0 3 13l57.63 21.61l-14.62 73.25a8 8 0 0 0 13.69 7l112-120a8 8 0 0 0 1.94-7.26M109.37 214l10.47-52.38a8 8 0 0 0-5-9.06L62 132.71l84.62-90.66l-10.46 52.38a8 8 0 0 0 5 9.06l52.8 19.8Z"/></g></svg></span>
        <span class="hg__num" role="status" aria-label="CPU usage"></span>
      </div>
    </div>
    <div class="hg__ctrl">
      <button class="hg__btn" type="button" data-step="-10" aria-label="Decrease by 10">−</button>
      <span class="hg__cap">CPU usage</span>
      <button class="hg__btn" type="button" data-step="10" aria-label="Increase by 10">+</button>
    </div>
  </div>
</main>
<script>
// 실제 동작: --num 하나로 호의 dashoffset 과 바늘의 rotate 를 같이 몬다. 0~100 밖으로는 안 나간다.
var hg = document.querySelector('.hg');
var num = 62;
hg.querySelectorAll('.hg__btn').forEach(function (b) {
  b.addEventListener('click', function () {
    hg.classList.remove('is-demo');
    num = Math.min(100, Math.max(0, num + Number(b.dataset.step)));
    hg.style.setProperty('--num', String(num));
  });
});
</script>
</body>
</html>
