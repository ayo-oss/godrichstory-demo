<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare ring pair — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="bp is-demo">
    <div class="bp__pair">
      <figure class="bp__cell bp__cell--now">
        <div class="bp__dial">
          <svg class="bp__svg" viewBox="0 0 88 88" width="88" height="88" aria-hidden="true">
            <circle class="bp__track" cx="44" cy="44" r="36"/>
            <circle class="bp__ring" cx="44" cy="44" r="36"/>
          </svg>
          <span class="bp__num" role="status" aria-label="This week's rate"></span>
        </div>
        <figcaption class="bp__cap">This week</figcaption>
      </figure>
      <span class="bp__delta">
        <span class="bp__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M232 56v64l-64-64Z" opacity=".2"/><path d="M232 48h-64a8 8 0 0 0-5.66 13.66L188.69 88L136 140.69l-34.34-34.35a8 8 0 0 0-11.32 0l-72 72a8 8 0 0 0 11.32 11.32L96 123.31l34.34 34.35a8 8 0 0 0 11.32 0L200 99.31l26.34 26.35A8 8 0 0 0 240 120V56a8 8 0 0 0-8-8m-8 52.69L187.31 64H224Z"/></g></svg></span>
      </span>
      <figure class="bp__cell bp__cell--prev">
        <div class="bp__dial">
          <svg class="bp__svg" viewBox="0 0 88 88" width="88" height="88" aria-hidden="true">
            <circle class="bp__track" cx="44" cy="44" r="36"/>
            <circle class="bp__ring" cx="44" cy="44" r="36"/>
          </svg>
          <span class="bp__num" aria-hidden="true"></span>
        </div>
        <figcaption class="bp__cap">Last week</figcaption>
      </figure>
    </div>
    <button class="bp__btn" type="button">Next week</button>
  </div>
</main>
<script>
// 실제 동작: This week 값이 Last week 자리로 밀려가고 새 값이 들어온다. 차이의 부호는 is-down 이 맡는다.
var bp = document.querySelector('.bp');
var now = 72, prev = 58;
bp.querySelector('.bp__btn').addEventListener('click', function () {
  bp.classList.remove('is-demo');
  prev = now;
  now = 20 + Math.floor(Math.random() * 80);
  bp.style.setProperty('--a', String(now));
  bp.style.setProperty('--b', String(prev));
  bp.style.setProperty('--d', String(Math.abs(now - prev)));
  bp.classList.toggle('is-down', now < prev);
});
</script>
</body>
</html>
