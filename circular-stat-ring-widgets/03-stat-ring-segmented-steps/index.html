<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segmented step ring — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sg is-demo">
    <div class="sg__dial">
      <svg class="sg__svg" viewBox="0 0 104 104" width="104" height="104" aria-hidden="true">
        <g class="sg__segs">
          <circle class="sg__seg" style="--i:0" cx="52" cy="52" r="44"/>
          <circle class="sg__seg" style="--i:1" cx="52" cy="52" r="44"/>
          <circle class="sg__seg" style="--i:2" cx="52" cy="52" r="44"/>
          <circle class="sg__seg" style="--i:3" cx="52" cy="52" r="44"/>
          <circle class="sg__seg" style="--i:4" cx="52" cy="52" r="44"/>
          <circle class="sg__seg" style="--i:5" cx="52" cy="52" r="44"/>
          <circle class="sg__seg" style="--i:6" cx="52" cy="52" r="44"/>
          <circle class="sg__seg" style="--i:7" cx="52" cy="52" r="44"/>
        </g>
      </svg>
      <div class="sg__center">
        <span class="sg__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="m96 240l16-80l-64-24L160 16l-16 80l64 24Z" opacity=".2"/><path d="M215.79 118.17a8 8 0 0 0-5-5.66L153.18 90.9l14.66-73.33a8 8 0 0 0-13.69-7l-112 120a8 8 0 0 0 3 13l57.63 21.61l-14.62 73.25a8 8 0 0 0 13.69 7l112-120a8 8 0 0 0 1.94-7.26M109.37 214l10.47-52.38a8 8 0 0 0-5-9.06L62 132.71l84.62-90.66l-10.46 52.38a8 8 0 0 0 5 9.06l52.8 19.8Z"/></g></svg></span>
        <span class="sg__frac" role="status" aria-label="완료한 단계"></span>
        <span class="sg__cap">단계</span>
      </div>
    </div>
    <button class="sg__btn" type="button">다음 단계</button>
  </div>
</main>
<script>
// 실제 동작: 누를 때마다 칸 하나를 더 켜고 가운데 분수를 바꾼다. 8칸을 다 채우면 처음으로 되돌린다.
var sg = document.querySelector('.sg');
var segs = sg.querySelectorAll('.sg__seg');
var n = 0;
sg.querySelector('.sg__btn').addEventListener('click', function () {
  sg.classList.remove('is-demo');
  n = n >= segs.length ? 0 : n + 1;
  for (var i = 0; i < segs.length; i++) segs[i].classList.toggle('is-on', i < n);
  sg.style.setProperty('--n', String(n));
});
</script>
</body>
</html>
