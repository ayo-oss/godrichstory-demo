<head>

<body>

    <li class="pl__row" style="--v:78">

        </span>
        <span class="pl__name">디자인 시스템</span>
        <span class="pl__pct" role="status"></span>
      </button>
    </li>
    <li class="pl__row" style="--v:52">
      <button class="pl__hit" type="button">
        <span class="pl__dial">
          <svg class="pl__svg" viewBox="0 0 36 36" width="36" height="36" aria-hidden="true">
            <circle class="pl__track" cx="18" cy="18" r="14"/>
            <circle class="pl__ring" cx="18" cy="18" r="14"/>
          </svg>

        <span class="pl__pct" role="status"></span>
      </button>
    </li>
    <li class="pl__row" style="--v:34">
      <button class="pl__hit" type="button">
        <span class="pl__dial">
          <svg class="pl__svg" viewBox="0 0 36 36" width="36" height="36" aria-hidden="true">
            <circle class="pl__track" cx="18" cy="18" r="14"/>
            <circle class="pl__ring" cx="18" cy="18" r="14"/>

        <span class="pl__name">온보딩 영상</span>
        <span class="pl__pct" role="status"></span>
      </button>
    </li>
  </ul>
</main>
<script>
// 실제 동작: 줄을 누르면 그 줄의 --v 만 10 올라간다. 링과 퍼센트가 같은 값을 읽으므로 둘이 어긋나지 않는다.
var pl = document.querySelector('.pl');
pl.querySelectorAll('.pl__row').forEach(function (row) {
  row.querySelector('.pl__hit').addEventListener('click', function () {
    pl.classList.remove('is-demo');
    var v = Number(getComputedStyle(row).getPropertyValue('--v')) || 0;
    row.style.setProperty('--v', String(v >= 100 ? 0 : Math.min(100, v + 10)));
  });
});
</script>
</body>
</html>
