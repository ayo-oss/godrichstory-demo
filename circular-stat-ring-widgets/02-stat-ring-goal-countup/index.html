<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goal ring with count-up — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="gr is-demo">
    <div class="gr__dial">
      <svg class="gr__svg" viewBox="0 0 128 128" width="128" height="128" aria-hidden="true">
        <circle class="gr__track" cx="64" cy="64" r="52"/>
        <circle class="gr__ring" cx="64" cy="64" r="52"/>
      </svg>
      <div class="gr__center">
        <span class="gr__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="15" height="15"><g fill="currentColor"><path d="M176 128a48 48 0 1 1-48-48a48 48 0 0 1 48 48" opacity=".2"/><path d="M221.87 83.16A104.1 104.1 0 1 1 195.67 49l22.67-22.68a8 8 0 0 1 11.32 11.32l-96 96a8 8 0 0 1-11.32-11.32l27.72-27.72a40 40 0 1 0 17.87 31.09a8 8 0 1 1 16-.9a56 56 0 1 1-22.38-41.65l22.75-22.75a87.88 87.88 0 1 0 23.13 29.67a8 8 0 0 1 14.44-6.9"/></g></svg></span>
        <span class="gr__num" role="status" aria-label="목표 달성률"></span>
        <span class="gr__cap">월 목표</span>
      </div>
    </div>
    <button class="gr__btn" type="button">새 목표 넣기</button>
  </div>
</main>
<script>
// 실제 동작: --num 하나만 바꾸면 숫자와 링이 같이 움직인다. 링의 dashoffset 이 --num 을 읽어 쓴다.
var gr = document.querySelector('.gr');
gr.querySelector('.gr__btn').addEventListener('click', function () {
  gr.classList.remove('is-demo');
  var v = 20 + Math.floor(Math.random() * 80);
  gr.style.setProperty('--num', String(v));
});
</script>
</body>
</html>
