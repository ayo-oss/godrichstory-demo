<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ring with inner sparkline — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sp is-demo">
    <div class="sp__dial">
      <svg class="sp__svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="이번 달 진행률 링과 7일 꺾은선">
        <g class="sp__rings">
          <circle class="sp__track" cx="64" cy="64" r="52"/>
          <circle class="sp__ring" cx="64" cy="64" r="52"/>
        </g>
        <!-- pathLength="100" 을 주면 실제 좌표가 어떻든 길이를 100 으로 셀 수 있다 -->
        <polyline class="sp__line" pathLength="100" points="28,76 40,66 52,80 64,58 76,68 88,50 100,60"/>
      </svg>
      <span class="sp__badge" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M232 56v64l-64-64Z" opacity=".2"/><path d="M232 48h-64a8 8 0 0 0-5.66 13.66L188.69 88L136 140.69l-34.34-34.35a8 8 0 0 0-11.32 0l-72 72a8 8 0 0 0 11.32 11.32L96 123.31l34.34 34.35a8 8 0 0 0 11.32 0L200 99.31l26.34 26.35A8 8 0 0 0 240 120V56a8 8 0 0 0-8-8m-8 52.69L187.31 64H224Z"/></g></svg></span>
    </div>
    <div class="sp__row">
      <span class="sp__cap">이번 달 68% · 최근 7일</span>
      <button class="sp__btn" type="button">새 데이터</button>
    </div>
  </div>
</main>
<script>
// 실제 동작: 7일치 y 값을 새로 뽑아 polyline 의 points 를 다시 쓴다. 선이 실제로 다른 모양이 된다.
var sp = document.querySelector('.sp');
var line = sp.querySelector('.sp__line');
sp.querySelector('.sp__btn').addEventListener('click', function () {
  sp.classList.remove('is-demo');
  var pts = [];
  for (var i = 0; i < 7; i++) {
    pts.push((28 + i * 12).toFixed(1) + ',' + (50 + Math.random() * 30).toFixed(1));
  }
  line.setAttribute('points', pts.join(' '));
});
</script>
</body>
</html>
