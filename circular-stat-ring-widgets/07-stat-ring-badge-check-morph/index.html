<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ring badge with check morph — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="bg is-demo">
    <div class="bg__dial">
      <svg class="bg__svg" viewBox="0 0 104 104" width="104" height="104" aria-hidden="true">
        <g class="bg__rings">
          <circle class="bg__track" cx="52" cy="52" r="44"/>
          <circle class="bg__ring" cx="52" cy="52" r="44"/>
        </g>
        <!-- 체크는 아이콘 폰트가 아니라 선 하나짜리 polyline — 그래야 dashoffset 으로 그려진다 -->
        <polyline class="bg__check" pathLength="100" points="36,53 47,64 69,40"/>
      </svg>
      <span class="bg__num" role="status" aria-label="진행률"></span>
    </div>
    <button class="bg__btn" type="button">완료 처리</button>
  </div>
</main>
<script>
// 실제 동작: 누르면 is-done 이 붙어 링이 끝까지 감기고 퍼센트가 빠진 자리에 체크가 그려진다. 다시 누르면 되돌아온다.
var bg = document.querySelector('.bg');
bg.querySelector('.bg__btn').addEventListener('click', function () {
  bg.classList.remove('is-demo');
  var done = bg.classList.toggle('is-done');
  bg.style.setProperty('--num', done ? '100' : '64');
});
</script>
</body>
</html>
