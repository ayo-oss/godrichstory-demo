<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient stroke ring — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="gd is-demo">
    <div class="gd__dial">
      <svg class="gd__svg" viewBox="0 0 128 128" width="128" height="128" aria-hidden="true">
        <defs>
          <linearGradient id="gdStroke" gradientUnits="userSpaceOnUse" x1="12" y1="12" x2="116" y2="116">
            <stop class="gd__stop-a" offset="0"/>
            <stop class="gd__stop-b" offset="1"/>
          </linearGradient>
        </defs>
        <circle class="gd__track" cx="64" cy="64" r="52"/>
        <circle class="gd__ring" cx="64" cy="64" r="52"/>
      </svg>
      <div class="gd__center">
        <span class="gd__num" role="status" aria-label="現在の値"></span>
        <span class="gd__cap">転換率</span>
      </div>
    </div>
    <label class="gd__slider">
      <span class="gd__slider-label">値を調整</span>
      <input class="gd__range" type="range" min="0" max="100" value="74">
    </label>
  </div>
</main>
<script>
// 실제 동작: 슬라이더가 --num 하나를 바꾸고, 링의 dashoffset 과 가운데 숫자가 둘 다 그 값을 읽는다.
var gd = document.querySelector('.gd');
var range = gd.querySelector('.gd__range');
range.addEventListener('input', function () {
  gd.classList.remove('is-demo');
  gd.style.setProperty('--num', range.value);
});
</script>
</body>
</html>
