<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글리프 ASCII 밀도 판 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ga" id="ga">
  <p class="ga__hint">
    <svg class="ga__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"><path d="M64 48h72M64 96h128M64 144h96M64 192h128" opacity=".9"/><path d="M40 48h8M40 96h8M40 144h8M40 192h8" opacity=".55"/></g></svg>
    <span>단어를 바꾸면 글자판이 다시 짜입니다</span>
  </p>
  <div class="ga__field" id="field" role="application" aria-label="ASCII 밀도 실험판" tabindex="0">
    <canvas class="ga__cv" id="cv"></canvas>
    <b class="ga__badge" aria-hidden="true" id="badge">0 pts</b>
  </div>
  <div class="ga__bar">
    <label class="ga__dial">단어
      <input type="text" id="word" value="ASCII" maxlength="12" spellcheck="false" aria-label="단어">
    </label>
    <label class="ga__dial">시드
      <input type="number" id="seed" min="1" max="9999" value="7" aria-label="시드">
    </label>
  </div>
</div>
</main>
<script>
// ASCII 밀도 — 글자를 픽셀로 뜯어 밝기가 글자를 고르는 판으로 짠다.
// 1) 오프스크린 캔버스에 fillText 로 단어를 그려 getImageData 로 알파 마스크를 뽑는다
// 2) 격자 칸(CELL px) 안 알파를 평균해 밀도(0..1) 로 읽는다 — 칸마다 하나의 값
// 3) 밀도 → 문자 계단 " .:-=+*#%@" 에서 한 글자를 골라 fillText 로 찍는다.
//    계단 기준을 시간에 따라 밀면 같은 밀도가 다른 글자로 바뀌어 판 전체가 살아 움직인다.
// 시드(mulberry32) 가 칸마다 색·주사 위상을 정하므로 같은 시드는 같은 그림이 나온다.
var root = document.getElementById('ga');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var wordIn = document.getElementById('word');
var seedIn = document.getElementById('seed');
var badge = document.getElementById('badge');

var SW = 252, SH = 108;          // 샘플 해상도 — 판 비율과 같다
var CELL = 5;                    // 격자 칸(px) — 칸이 작을수록 판이 조밀해진다
var LADDER = ' .:-=+*#%@';       // 밀도 계단 — 옅은 것부터 짙은 것 순서
var CYCLE = 0.30;                // 계단 슬라이드 주기(초) — 프레임 사이 83ms 에 계단이 확 걸린다
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0;
var cells = [];
var t0 = 0, raf = 0;

// 색 — scss 가 파스텔 커스텀 프로퍼티(--g0..--g3)로 내려준 넉 색을 읽어 쓴다
var css = getComputedStyle(root);
function hexOf(name) {
  var v = css.getPropertyValue(name).trim().replace('#', '');
  if (v.length === 3) v = v.charAt(0) + v.charAt(0) + v.charAt(1) + v.charAt(1) + v.charAt(2) + v.charAt(2);
  return '#' + v;
}
var cols = [hexOf('--g0'), hexOf('--g1'), hexOf('--g2'), hexOf('--g3')];

// 결정적 난수 — 시드 하나가 칸의 색·위상을 정한다
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ── 1) 글자 → 알파 마스크 ────────────────────────────────────────
function buildMask(word) {
  var off = document.createElement('canvas');
  off.width = SW; off.height = SH;
  var oc = off.getContext('2d', { willReadFrequently: true });
  oc.textAlign = 'center'; oc.textBaseline = 'middle';
  var fs = 200;
  oc.font = '900 ' + fs + 'px Arial';
  var w = oc.measureText(word).width || 1;
  fs = Math.min(fs * ((SW - 8) / w), SH - 6);       // 폭·높이 안에서 제일 큰 글자
  oc.font = '900 ' + Math.round(fs) + 'px Arial';
  oc.fillStyle = '#fff';
  oc.fillText(word, SW / 2, SH / 2);
  return oc.getImageData(0, 0, SW, SH).data;
}

// ── 2) 마스크 → 칸 밀도 격자 ────────────────────────────────────
// 칸 안 픽셀 알파를 전부 더해 평균 — 두께·가장자리 반쯤 걸친 칸까지 값으로 읽는다
function buildCells(word) {
  var data = buildMask(word);
  var cw = Math.floor(SW / CELL), ch = Math.floor(SH / CELL);
  var rnd = mulberry32(seed);
  var out = [];
  for (var cy = 0; cy < ch; cy++) {
    for (var cx = 0; cx < cw; cx++) {
      var sum = 0, n = 0;
      for (var py = cy * CELL; py < (cy + 1) * CELL; py++) {
        for (var px = cx * CELL; px < (cx + 1) * CELL; px++) {
          sum += data[(py * SW + px) * 4 + 3]; n++;
        }
      }
      var d = sum / (n * 255);                     // 0..1 밀도
      var r1 = rnd(), r2 = rnd();
      out.push({
        cx: cx, cy: cy,
        d: d,
        ci: d > 0.02 ? (r1 < 0.6 ? 0 : r1 < 0.78 ? 1 : r1 < 0.9 ? 2 : 3) : 0,
        ph: r2 * 6.2832                            // 주사 위상 — 시드가 정한다
      });
    }
  }
  return out;
}

function pickColor(r) {
  if (r < 0.55) return 0;   // 잉크 다수
  if (r < 0.73) return 1;   // 하늘
  if (r < 0.88) return 2;   // 민트
  return 3;                 // 복숭아
}

// ── 3) 단어·시드가 바뀌면 칸 격자가 다시 계산된다 ─────────────────
var word = 'ASCII', seed = 7;
function resample(nextWord, nextSeed) {
  var w = String(nextWord == null ? word : nextWord).trim().toUpperCase();
  if (w) word = w;                                   // 빈 문자열이면 직전 값을 유지
  var s = Math.floor(Number(nextSeed));
  if (s >= 1) seed = s;
  cells = buildCells(word);
  var inMask = 0;
  for (var i = 0; i < cells.length; i++) if (cells[i].d > 0.02) inMask++;
  window.__sampleInfo = { targets: inMask, particles: cells.length };
  badge.textContent = inMask + ' pts';
  if (reduce) {
    paint(0);                                         // t=0 계단 포즈 한 장
  } else {
    t0 = performance.now();
  }
}

function fit() {
  var r = field.getBoundingClientRect();
  var d = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
}

function paint(t) {
  ctx.clearRect(0, 0, W, H);
  var sx = W / SW, sy = H / SH;
  var fs = CELL * 1.5 * sx;                          // 칸보다 반 큰 활자 — 판이 성기지 않게
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  // 계단 슬라이드 — 밀도→글자 대응이 시간에 따라 밀린다(등장 시퀀스: 판이 차오르는 결).
  // 슬라이드 항은 잠시 등장에만 쓰고(0.28 계수로 완만) 상시 운동은 아래 사인 주사가 맡는다
  var slide = (t / CYCLE) * LADDER.length;
  var bgA = 0.46 + 0.36 * Math.sin(t * 5.3 * 0.5 + 1.1);   // 바탕 주사 — 마스크 밖 칸의 명멸 알파
  // 바탕 계단 위치 — 주사 사인의 절반 위상으로 마스크 밖 칸이 0..2 계단을 오간다.
  // 마스크 안(글릿)과 위상이 어긋나므로 두 층이 번갈아 살아 움직인다
  var slBg = Math.sin(t * 5.3 + 2.2) * 5.0 - 0.6;
  for (var i = 0; i < cells.length; i++) {
    var c = cells[i];
    var bg = c.d <= 0.02;                            // 마스크 밖 칸 — 바탕 주사가 담당
    if (bg && slBg <= 0) continue;                   // 이 프레임에 바탕이 꺼져 있으면 쉰다
    // 주사 위상 — 칸마다 시드 위상으로 계단 슬라이드가 물린다. 위상이 퍼져 판 전체가 반짝인다.
    // 진폭은 계단 전체 폭(LADDER.length) 을 넘게 — 마스크 안 모든 칸이 프레임마다
    // 최소 한 계단 이상 오르내려 빈 칸(' ')과 짙은 글자를 오간다(면적 하선).
    // 슬라이드 등장항은 사인 반주기(π/5.3≈0.59s) 안에 끝나도록 코사인 창으로 감쇠한다 —
    // 창이 닫히면(≈1.2s 뒤) 순수 주사만 남아 2초 내내 계단이 계속 움직인다
    var win = Math.max(0, Math.cos(Math.min(t * 2.6, Math.PI)));   // 등장 창 — 1.2초 뒤 0
    var sl = slide * 0.28 * win + Math.sin(t * 5.3 + c.ph) * (LADDER.length + 1.5) + Math.sin(t * 2.6 + c.ph * 2.7) * 2.2;
    var lv = (bg ? 0 : c.d) * (LADDER.length - 1) + (bg ? slBg : sl);
    var idx = Math.max(0, Math.min(LADDER.length - 1, Math.round(lv)));
    var ch = LADDER.charAt(idx);
    if (ch === ' ') continue;                        // 계단 아래로 떨어진 칸은 이 프레임에 쉰다
    if (bg) ctx.globalAlpha = bgA;                   // 바탕 글자는 옅게 — 글릿보다 한 단계 뒤에 있다
    ctx.fillStyle = cols[c.ci];
    ctx.font = '700 ' + fs.toFixed(1) + 'px monospace';
    ctx.fillText(ch, (c.cx + 0.5) * CELL * sx, (c.cy + 0.5) * CELL * sy);
    if (bg) ctx.globalAlpha = 1;
  }
}

function frame(now) {
  paint((now - t0) / 1000);
  raf = requestAnimationFrame(frame);
}

wordIn.addEventListener('input', function () { resample(wordIn.value, seedIn.value); });
seedIn.addEventListener('input', function () { resample(wordIn.value, seedIn.value); });
window.addEventListener('resize', function () { fit(); if (reduce) paint(0); });

fit();
resample(wordIn.value, seedIn.value);
if (reduce) {
  root.classList.add('is-still');                    // 루프 없이 t=0 한 장
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
