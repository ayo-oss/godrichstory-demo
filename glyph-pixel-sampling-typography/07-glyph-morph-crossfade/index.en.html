<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글리프 모핑 크로스페이드 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gm" id="gm">
  <p class="gm__hint">
    <svg class="gm__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round"><path d="M48 208V64l64 96 64-96v144"/></g></svg>
    <span>Change the word and the second word flows in anew</span>
  </p>
  <div class="gm__field" id="field" role="application" aria-label="Morph crossfade playground" tabindex="0">
    <canvas class="gm__cv" id="cv"></canvas>
    <b class="gm__badge" aria-hidden="true" id="badge">0 pts</b>
  </div>
  <div class="gm__bar">
    <label class="gm__dial">Word
      <input type="text" id="word" value="WAVE" maxlength="12" spellcheck="false" aria-label="Word">
    </label>
    <label class="gm__dial">Seed
      <input type="number" id="seed" min="1" max="9999" value="7" aria-label="Seed">
    </label>
  </div>
</div>
</main>
<script>
// 모핑 크로스페이드 — 글자를 픽셀로 뜯어 두 Word 사이를 흐르듯 오간다.
// 1) 오프스크린 캔버스에 fillText 로 단어를 그려 getImageData 로 알파 마스크를 뽑는다
// 2) 격자 간격 STEP 로 걸어 알파>128 인 칸의 (x,y) 를 목표점 목록으로 만든다 — 두 Word 각각
// 3) 입자 수는 많은 쪽에 맞추고 목표 인덱스 i → setA[i % lenA] · setB[i % lenB] 로 짝짓는다.
//    매 프레임 사인 믹스(0..1) 로 두 목표 사이를 좌표 보간 — 부드러운 교차가 아니라
//    좌표가 흘러가므로 유령 프레임이 없다. 추가로 호흡 진폭(원 궤도)을 얹어 멈추는 프레임이 없다.
// Seed(mulberry32) 가 입자의 반경·궤도 위상·색을 정하므로 같은 시드는 같은 그림이 나온다.
var root = document.getElementById('gm');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var wordIn = document.getElementById('word');
var seedIn = document.getElementById('seed');
var badge = document.getElementById('badge');

var SW = 252, SH = 108;          // 샘플 해상도 — 판 비율과 같다
var STEP = 2;                    // 샘플 간격(px) — 좁힐수록 입자 수가 늘어난다
var CYCLE = 1.0;                 // 모핑 왕복 주기(초) — 2초 gif 안에 두 바퀴 돈다
var ORBIT = 3.6;                 // 호흡 진폭(px) — 정지 상태에서도 입자가 원 궤도로 살아 움직인다
var LERP = 0.12;                 // 목표 추적 계수 — 느린 추적이 흐름의 밴드를 넓힌다
var WORD_A = 'HELLO';            // 첫 Word — 고정
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0;
var parts = [];
var t0 = 0, raf = 0;

// 색 — scss 가 파스텔 커스텀 프로퍼티(--g0..--g3)로 내려준 넉 색을 읽어 쓴다
var css = getComputedStyle(root);
function hexOf(name) {
  var v = css.getPropertyValue(name).trim().replace('#', '');
  if (v.length === 3) v = v.charAt(0) + v.charAt(0) + v.charAt(1) + v.charAt(1) + v.charAt(2) + v.charAt(2);
  return '#' + v;
}
var cols = [hexOf('--g0'), hexOf('--g1'), hexOf('--g2'), hexOf('--g3')];

// 결정적 난수 — Seed 하나가 입자의 크기·궤도·색 전부를 정한다
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ── 1) 글자 → 알파 마스크 ────────────────────────────────────────
function buildMask(word) {
  var off = document.createElement('canvas');
  off.width = SW; off.height = SH;
  var oc = off.getContext('2d', { willReadFrequently: true });
  oc.textAlign = 'center'; oc.textBaseline = 'middle';
  var fs = 200;
  oc.font = '900 ' + fs + 'px Arial';
  var w = oc.measureText(word).width || 1;
  fs = Math.min(fs * ((SW - 8) / w), SH - 6);       // 폭·높이 안에서 제일 큰 글자
  oc.font = '900 ' + Math.round(fs) + 'px Arial';
  oc.fillStyle = '#fff';
  oc.fillText(word, SW / 2, SH / 2);
  return oc.getImageData(0, 0, SW, SH).data;
}

// ── 2) 마스크 → 목표점 목록 ─────────────────────────────────────
function samplePoints(data) {
  var pts = [];
  for (var y = 0; y < SH; y += STEP) {
    for (var x = 0; x < SW; x += STEP) {
      if (data[(y * SW + x) * 4 + 3] > 128) pts.push({ x: x, y: y });
    }
  }
  return pts;
}

function pickColor(r) {
  if (r < 0.55) return 0;   // 잉크 다수
  if (r < 0.73) return 1;   // 하늘
  if (r < 0.88) return 2;   // 민트
  return 3;                 // 복숭아
}

// ── 3) 두 단어를 샘플링해 입자 수는 많은 쪽에 맞춘다 ─────────────
var wordB = 'WAVE', seed = 7;
function resample(nextWord, nextSeed) {
  var w = String(nextWord == null ? wordB : nextWord).trim().toUpperCase();
  if (w) wordB = w;                                   // 빈 문자열이면 직전 값을 유지
  var s = Math.floor(Number(nextSeed));
  if (s >= 1) seed = s;
  var setA = samplePoints(buildMask(WORD_A));
  var setB = samplePoints(buildMask(wordB));
  var n = Math.max(setA.length, setB.length);         // 입자 수 = 많은 쪽 (나머지는 % 로 재사용)
  var rnd = mulberry32(seed);
  parts = [];
  for (var i = 0; i < n; i++) {
    var a = setA[i % setA.length];
    var b = setB[i % setB.length];
    var r1 = rnd(), r2 = rnd(), r3 = rnd(), r4 = rnd();
    parts.push({
      x: a.x, y: a.y,                                 // 시작 = 첫 Word 모양
      ax: a.x, ay: a.y,                               // 목표 A — HELLO 쪽 좌표
      bx: b.x, by: b.y,                               // 목표 B — 입력 Word 쪽 좌표
      sz: 2.9 + r1 * 2.2,                             // 반경 — 시드가 정한다
      ph: r2 * 6.2832,                                // 호흡 궤도 위상 — 시드가 정한다
      ci: pickColor(r3),
      bl: (r4 - 0.5) * 26                             // 활꼴 휨(px) — 이동 경로를 직선이 아니라 활으로 벌린다
    });
  }
  window.__sampleInfo = { targets: setB.length, particles: parts.length };
  badge.textContent = n + ' pts';
  if (reduce) {
    paint(0);                                         // t=0 = HELLO 포즈 한 장
  } else {
    t0 = performance.now();
  }
}

function fit() {
  var r = field.getBoundingClientRect();
  var d = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
}

function paint(t) {
  ctx.clearRect(0, 0, W, H);
  var sx = W / SW, sy = H / SH;
  // 모핑 믹스 — 사인으로 0..1..0 왕복. 2초 gif 안에 두 바퀴 돈다
  var mix = 0.5 - 0.5 * Math.cos(t / CYCLE * 6.2832);
  var ease = mix * mix * (3 - 2 * mix);               // smoothstep — 흐름이 급발진하지 않게
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    // 좌표 보간 — 두 목표 사이를 흐른다. 직선 대신 활꼴(사인 벌림)로 벌려
    // 이동 경로가 입자마다 달라져 sweep 면적이 크게 벌어진다
    var dx = p.bx - p.ax, dy = p.by - p.ay;
    var tx = p.ax + dx * ease;
    var ty = p.ay + dy * ease;
    var bow = Math.sin(ease * Math.PI);               // 출발·도착에서 0, 중간에서 최대인 활의 결
    tx += -dy * 0.35 * bow + p.bl * bow;              // 직교 방향 벌림 + Seed 활 개량
    ty +=  dx * 0.35 * bow + p.bl * 0.6 * bow;
    // 느린 대굴곡 — 행·열마다 위상이 어긋난 큰 사인. 판 전체가 흔들린다(면적의 주된 원천)
    tx += Math.sin(t * 0.95 + p.ay * 0.028) * 12;
    ty += Math.cos(t * 0.75 + p.ax * 0.031) * 9;
    // 호흡 — 정지 상태에서도 입자마다 원 궤도로 움직여 프레임이 죽지 않는다
    var ob = 0.55 + 0.45 * Math.sin(t * 1.9 + p.ph * 3.1);   // 궤도 크기도 느리게 부풀었다 가라앉는다
    tx += Math.cos(t * 1.35 + p.ph) * ORBIT * ob;
    ty += Math.sin(t * 1.15 + p.ph * 1.7) * ORBIT * ob * 0.8;
    p.x += (tx - p.x) * LERP;                         // lerp 추적 — 잔상이 흐름을 키운다
    p.y += (ty - p.y) * LERP;
    ctx.fillStyle = cols[p.ci];
    ctx.beginPath();
    ctx.arc(p.x * sx, p.y * sy, p.sz * sx * 0.85, 0, 6.2832);
    ctx.fill();
  }
}

function frame(now) {
  paint((now - t0) / 1000);
  raf = requestAnimationFrame(frame);
}

wordIn.addEventListener('input', function () { resample(wordIn.value, seedIn.value); });
seedIn.addEventListener('input', function () { resample(wordIn.value, seedIn.value); });
window.addEventListener('resize', function () { fit(); if (reduce) paint(0); });

fit();
resample(wordIn.value, seedIn.value);
if (reduce) {
  root.classList.add('is-still');                    // 루프 없이 t=0 한 장
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
