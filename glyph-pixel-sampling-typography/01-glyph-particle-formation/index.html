<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글리프 입자 재구성 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gp" id="gp">
  <p class="gp__hint">
    <svg class="gp__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><circle cx="64" cy="72" r="18"/><circle cx="112" cy="48" r="12"/><circle cx="96" cy="112" r="9"/><circle cx="160" cy="80" r="14"/><circle cx="208" cy="64" r="8"/><circle cx="184" cy="128" r="11"/><circle cx="136" cy="152" r="7"/><path d="M56 184h144a8 8 0 0 1 0 16H56a8 8 0 0 1 0-16m28 28h88a8 8 0 0 1 0 16H84a8 8 0 0 1 0-16" opacity=".45"/></g></svg>
    <span>단어를 바꾸면 먼지가 다시 뭉칩니다</span>
  </p>
  <div class="gp__field" id="field" role="application" aria-label="입자 재구성 실험판" tabindex="0">
    <canvas class="gp__cv" id="cv"></canvas>
    <b class="gp__badge" aria-hidden="true" id="badge">0 pts</b>
  </div>
  <div class="gp__bar">
    <label class="gp__dial">단어
      <input type="text" id="word" value="GLYPH" maxlength="12" spellcheck="false" aria-label="단어">
    </label>
    <label class="gp__dial">시드
      <input type="number" id="seed" min="1" max="9999" value="7" aria-label="시드">
    </label>
  </div>
</div>
</main>
<script>
// 입자 재구성 — 글자를 통째로 옮기지 않고 픽셀로 뜯어 다시 짓는다.
// 1) 오프스크린 캔버스에 fillText 로 단어를 그려 getImageData 로 알파 마스크를 뽑는다
// 2) 격자 간격 STEP 로 걸어 알파>128 인 칸의 (x,y) 를 목표점 목록으로 만든다
// 3) 시드로 뿌린 입자들이 스프링(복원 0.012 · 감쇠 0.86)으로 제 목표 픽셀을 찾아간다
// 무작위는 전부 mulberry32(시드) — 같은 시드는 같은 그림. Math.random 은 쓰지 않는다.
var root = document.getElementById('gp');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var wordIn = document.getElementById('word');
var seedIn = document.getElementById('seed');
var badge = document.getElementById('badge');

var SW = 252, SH = 108;          // 샘플 해상도 — 판 비율과 같아 늘려 뭉개지지 않는다
var STEP = 2;                    // 샘플 간격(px) — 좁힐수록 입자 수가 늘어난다
var BASE = 0.28;                 // 산란 비율 — 매 주기 시작을 목표가 아니라 판에 뿌린 먼지에서 시작한다
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0;
var parts = [];
var t0 = 0, raf = 0;

// 색 — scss 가 파스텔 커스텀 프로퍼티(--g0..--g3)로 내려준 넉 색을 읽어 쓴다
var css = getComputedStyle(root);
function hexOf(name) {
  var v = css.getPropertyValue(name).trim().replace('#', '');
  if (v.length === 3) v = v.charAt(0) + v.charAt(0) + v.charAt(1) + v.charAt(1) + v.charAt(2) + v.charAt(2);
  return '#' + v;
}
var cols = [hexOf('--g0'), hexOf('--g1'), hexOf('--g2'), hexOf('--g3')];

// 결정적 난수 — 시드 하나가 입자의 시작 위치·위상·크기·색 전부를 정한다
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ── 1) 글자 → 알파 마스크 ────────────────────────────────────────
function buildMask(word) {
  var off = document.createElement('canvas');
  off.width = SW; off.height = SH;
  var oc = off.getContext('2d', { willReadFrequently: true });
  oc.textAlign = 'center'; oc.textBaseline = 'middle';
  var fs = 200;
  oc.font = '900 ' + fs + 'px Arial';
  var w = oc.measureText(word).width || 1;
  fs = Math.min(fs * ((SW - 8) / w), SH - 6);       // 폭·높이 안에서 제일 큰 글자
  oc.font = '900 ' + Math.round(fs) + 'px Arial';
  oc.fillStyle = '#fff';
  oc.fillText(word, SW / 2, SH / 2);
  return oc.getImageData(0, 0, SW, SH).data;
}

// ── 2) 마스크 → 목표점 목록 ─────────────────────────────────────
function samplePoints(data) {
  var pts = [];
  for (var y = 0; y < SH; y += STEP) {
    for (var x = 0; x < SW; x += STEP) {
      if (data[(y * SW + x) * 4 + 3] > 128) pts.push({ x: x, y: y });
    }
  }
  return pts;
}

function pickColor(r) {
  if (r < 0.55) return 0;   // 잉크 다수
  if (r < 0.73) return 1;   // 하늘
  if (r < 0.88) return 2;   // 민트
  return 3;                 // 복숭아
}

// ── 3) 입자 재구성 — 단어·시드가 바뀌면 목표와 입자 수가 다시 계산된다 ──
var word = 'GLYPH', seed = 7;
function resample(nextWord, nextSeed) {
  var w = String(nextWord == null ? word : nextWord).trim().toUpperCase();
  if (w) word = w;                                  // 빈 문자열이면 직전 값을 유지
  var s = Math.floor(Number(nextSeed));
  if (s >= 1) seed = s;
  var pts = samplePoints(buildMask(word));
  var rnd = mulberry32(seed);
  parts = [];
  for (var i = 0; i < pts.length; i++) {
    var r1 = rnd(), r2 = rnd(), r3 = rnd(), r4 = rnd(), r5 = rnd();
    parts.push({
      x: r1 * SW, y: r2 * SH, vx: 0, vy: 0,         // 시작은 판 전체에 흩뿌린 먼지
      tx: pts[i].x, ty: pts[i].y,
      ph: r3 * 6.2832, sz: 1.7 + r4 * 1.7, ci: pickColor(r5)
    });
  }
  window.__sampleInfo = { targets: pts.length, particles: parts.length };
  badge.textContent = pts.length + ' pts';
  if (reduce) {
    // 정지 한 장 — 입자를 목표에 붙인 상태로 그린다(시드 위상만큼 비껴 있다)
    for (var k = 0; k < parts.length; k++) {
      var q = parts[k];
      q.x = q.tx + Math.cos(q.ph) * 1.3;
      q.y = q.ty + Math.sin(q.ph * 1.3) * 1.3;
    }
    paint(0);
  } else {
    t0 = performance.now();                          // 모임 연기를 처음부터 다시
  }
}

function fit() {
  var r = field.getBoundingClientRect();
  var d = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
}

function paint(t) {
  ctx.clearRect(0, 0, W, H);
  var sx = W / SW, sy = H / SH;
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    var wx = Math.sin(t * 3.4 + p.ph) * 10.5;        // 정착 뒤에도 입자가 숨쉰다
    var wy = Math.cos(t * 2.9 + p.ph * 1.7) * 9.5;
    ctx.fillStyle = cols[p.ci];
    ctx.beginPath();
    ctx.arc((p.x + wx) * sx, (p.y + wy) * sy, p.sz * sx * 0.85, 0, 6.2832);
    ctx.fill();
  }
}

function frame(now) {
  var t = (now - t0) / 1000;
  var cyc = Math.floor(t / 2) * 2;                 // 2초마다 —
  var u = t - cyc;                                 // 주기 안 진행(초)
  var k;
  if (u < 0.5) {
    var q = u / 0.5;
    k = q * q;                                     // 도입부: 먼지 → 글자로 가속해 뭉친다
  } else {
    var s = (u - 0.5) / 1.5;                       // 정착부: 숨쉬듯 모였다 퍼졌다
    k = 0.68 + 0.34 * Math.sin(s * 6.2832);
  }
  var br = BASE + (1 - BASE) * k;                  // 산란 ↔ 뭉침 사이를 오간다
  var cx = SW / 2, cy = SH / 2;
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    var tx = cx + (p.tx - cx) * br, ty = cy + (p.ty - cy) * br;
    p.vx = (p.vx + (tx - p.x) * 0.014) * 0.86;
    p.vy = (p.vy + (ty - p.y) * 0.014) * 0.86;
    p.x += p.vx; p.y += p.vy;
  }
  paint(t);
  raf = requestAnimationFrame(frame);
}

wordIn.addEventListener('input', function () { resample(wordIn.value, seedIn.value); });
seedIn.addEventListener('input', function () { resample(wordIn.value, seedIn.value); });
window.addEventListener('resize', function () { fit(); if (reduce) paint(0); });

fit();
resample(wordIn.value, seedIn.value);
if (reduce) {
  root.classList.add('is-still');                    // 루프 없이 정지 한 장
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
