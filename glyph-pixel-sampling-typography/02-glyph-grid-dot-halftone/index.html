<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글리프 격자 점 하프톤 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gh" id="gh">
  <p class="gh__hint">
    <svg class="gh__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><circle cx="48" cy="48" r="8"/><circle cx="88" cy="48" r="5"/><circle cx="120" cy="48" r="3"/><circle cx="152" cy="48" r="2"/><circle cx="48" cy="88" r="5"/><circle cx="88" cy="88" r="8"/><circle cx="120" cy="88" r="5"/><circle cx="152" cy="88" r="3"/><circle cx="48" cy="128" r="3"/><circle cx="88" cy="128" r="5"/><circle cx="120" cy="128" r="8"/><circle cx="152" cy="128" r="5"/><circle cx="48" cy="168" r="2"/><circle cx="88" cy="168" r="3"/><circle cx="120" cy="168" r="5"/><circle cx="152" cy="168" r="8"/><circle cx="200" cy="200" r="10" opacity=".35"/></g></svg>
    <span>단어를 바꾸면 하프톤 점 판이 다시 짜입니다</span>
  </p>
  <div class="gh__field" id="field" role="application" aria-label="격자 점 하프톤 실험판" tabindex="0">
    <canvas class="gh__cv" id="cv"></canvas>
    <b class="gh__badge" aria-hidden="true" id="badge">0 pts</b>
  </div>
  <div class="gh__bar">
    <label class="gh__dial">단어
      <input type="text" id="word" value="HALFTONE" maxlength="12" spellcheck="false" aria-label="단어">
    </label>
    <label class="gh__dial">시드
      <input type="number" id="seed" min="1" max="9999" value="7" aria-label="시드">
    </label>
  </div>
</div>
</main>
<script>
// 격자 점 하프톤 — 글자를 픽셀로 샘플링해 격자점마다 점 크기로 옮겨 적는다(인쇄 하프톤의 원리).
// 1) 오프스크린 캔버스에 fillText 로 단어를 그려 getImageData 로 알파 마스크를 뽑는다
// 2) 격자점 (x,y) 에서 알파를 읽어 0..1 값으로 정규화한다
// 3) 점 반경 = 값 비례. 격자 간격 자체를 사인으로 6↔10px 오가며 조밀↔성김 — 판 전체가 호흡한다
// 무작위 요소는 격자점 위상 흔들림뿐이고 전부 mulberry32(시드) 로 돌린다.
var root = document.getElementById('gh');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var wordIn = document.getElementById('word');
var seedIn = document.getElementById('seed');
var badge = document.getElementById('badge');

var SW = 252, SH = 108;          // 샘플 해상도
var MSZ = 1.4;                   // 확대 배율 — 글자를 판보다 크게 키워 잉크 면적을 늘린다
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0;
var mask = null;                 // 현재 단어의 알파 마스크(ImageData.data)
var phas = [];                   // 격자점마다의 시드 위상 — 점마다 반짝이는 타이밍이 다르다
var seed = 7, word = 'HALFTONE';
var t0 = 0, raf = 0;

var css = getComputedStyle(root);
function hexOf(name) {
  var v = css.getPropertyValue(name).trim().replace('#', '');
  if (v.length === 3) v = v.charAt(0) + v.charAt(0) + v.charAt(1) + v.charAt(1) + v.charAt(2) + v.charAt(2);
  return '#' + v;
}
var cols = [hexOf('--g0'), hexOf('--g1'), hexOf('--g2'), hexOf('--g3')];

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ── 1) 글자 → 알파 마스크 ────────────────────────────────────────
function buildMask(text) {
  var off = document.createElement('canvas');
  off.width = SW; off.height = SH;
  var oc = off.getContext('2d', { willReadFrequently: true });
  oc.textAlign = 'center'; oc.textBaseline = 'middle';
  var fs = 200 * MSZ;
  oc.font = '900 ' + fs + 'px Arial';
  var w = oc.measureText(text).width || 1;
  fs = Math.min(fs * ((SW - 4) / w), SH * 1.05);
  oc.font = '900 ' + Math.round(fs) + 'px Arial';
  oc.fillStyle = '#fff';
  // 두 줄 겹인쇄(overprint) — 글자 중앙을 두 번 찍어 잉크 면적을 늘리고 명암 단계를 만든다
  oc.fillText(text, SW / 2, SH / 2);
  oc.globalAlpha = 1;
  return oc.getImageData(0, 0, SW, SH).data;
}

// 샘플 간격이 시간에 따라 4.2↔7.8px — 주기 2초. 판이 조밀해졌다 성겨진다
function stepAt(t) { return 6 + 1.8 * Math.sin(t * Math.PI); }

// ── 2)+(3) 매 프레임 격자를 다시 걸어 점을 찍는다 ─────────────────
// 간격이 매끈하게 미끄러지면 점이 격자 위를 떠다닌다 — 마이크로 흔들림(jitter)을 더해
// 점 하나 하나가 프레임마다 살짝 비껴 그려지게 한다. 판 등록 흔들림도 함께.
function paint(t) {
  ctx.clearRect(0, 0, W, H);
  var sx = W / SW, sy = H / SH;
  var s = stepAt(t);
  var ox = Math.sin(t * 1.2) * 4.0, oy = Math.cos(t * 0.9) * 3.2;
  var rows = Math.ceil((SH + 8) / s) + 2, colsN = Math.ceil((SW + 8) / s) + 2;
  var idx = 0;
  for (var gy = -2; gy < rows; gy++) {
    var y = gy * s + oy;
    for (var gx = -2; gx < colsN; gx++) {
      var x = gx * s + ((gy & 1) ? s * 0.5 : 0) + ox;  // 한 줄 걸러 반 칸 엇갈림 — 하프톤 결
      idx = ((gy + 8) * 131 + (gx + 8)) % phas.length; // 격자점 고유 위상(시드로 결정)
      var jx = x + Math.sin(t * 5.1 + phas[idx]) * 0.9;  // 점마다 마이크로 흔들림
      var jy = y + Math.cos(t * 4.7 + phas[idx] * 1.3) * 0.9;
      var xi = Math.round(jx), yi = Math.round(jy);
      if (xi < 0 || yi < 0 || xi >= SW || yi >= SH) continue;
      var a = mask[(yi * SW + xi) * 4 + 3] / 255;  // 이 칸의 잉크 농도
      var fl = 0.80 + 0.20 * Math.sin(t * 4.4 + phas[idx]);  // 점마다 다른 반짝임
      // 인쇄판 하프톤 — 빈 칸도 희미한 바탕점을 받는다. 글자는 점이 커지는 곳에서 떠오른다
      var r = (0.17 + Math.pow(a, 1.2) * 0.86) * s * 0.52 * fl;
      ctx.globalAlpha = 0.30 + a * 0.70;
      ctx.fillStyle = cols[a > 0.66 ? 0 : (a > 0.4 ? 1 : 2)];
      ctx.beginPath();
      ctx.arc(jx * sx, jy * sy, r * sx, 0, 6.2832);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function countTargets() {
  // probe 계약 — 현재 간격(정지 시각 기준)에서 잉크 칸 수
  var s = stepAt(0), n = 0;
  for (var y = 0; y < SH; y += s) {
    for (var x = 0; x < SW; x += s) {
      if (mask[(Math.round(y) * SW + Math.round(x)) * 4 + 3] > 128) n++;
    }
  }
  return n;
}

function resample(nextWord, nextSeed) {
  var w = String(nextWord == null ? word : nextWord).trim().toUpperCase();
  if (w) word = w;
  var sv = Math.floor(Number(nextSeed));
  if (sv >= 1) seed = sv;
  mask = buildMask(word);
  var rnd = mulberry32(seed);
  phas = [];
  for (var i = 0; i < 617; i++) phas.push(rnd() * 6.2832);
  var n = countTargets();
  window.__sampleInfo = { targets: n, particles: n };
  badge.textContent = n + ' pts';
  if (reduce) paint(0);
  else t0 = performance.now();
}

function fit() {
  var r = field.getBoundingClientRect();
  var d = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
}

function frame(now) {
  paint((now - t0) / 1000);
  raf = requestAnimationFrame(frame);
}

wordIn.addEventListener('input', function () { resample(wordIn.value, seedIn.value); });
seedIn.addEventListener('input', function () { resample(wordIn.value, seedIn.value); });
window.addEventListener('resize', function () { fit(); if (reduce) paint(0); });

fit();
resample(wordIn.value, seedIn.value);
if (reduce) {
  root.classList.add('is-still');                  // 루프 없이 정지 한 장
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
