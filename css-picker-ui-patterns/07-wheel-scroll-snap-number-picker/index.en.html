<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll snap wheel picker — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="wheel is-demo">
    <div class="wheel__mask">
      <div class="wheel__track" id="track" tabindex="0" role="listbox" aria-label="Select hour">
        <div class="wheel__pad" aria-hidden="true"></div>
      </div>
      <div class="wheel__hl" aria-hidden="true"></div>
    </div>
    <div class="wheel__label">hr</div>
  </div>
</main>
<script>
(function () {
  var wheel = document.querySelector('.wheel'), track = document.getElementById('track');
  var H = 40, N = 12;
  for (var i = 1; i <= N; i++) {
    var it = document.createElement('div');
    it.className = 'wheel__item'; it.id = 'w-' + i; it.setAttribute('role', 'option'); it.textContent = i;
    track.appendChild(it);
  }
  var pad2 = document.createElement('div'); pad2.className = 'wheel__pad'; pad2.setAttribute('aria-hidden', 'true');
  track.appendChild(pad2);
  var items = track.querySelectorAll('.wheel__item');
  var centered = 0;
  function mark() {
    var idx = Math.round(track.scrollTop / H);
    idx = Math.max(0, Math.min(N - 1, idx));
    if (idx === centered) return;
    centered = idx;
    items.forEach(function (el, i) { el.classList.toggle('is-center', i === idx); });
    track.setAttribute('aria-activedescendant', items[idx].id);
  }
  track.addEventListener('scroll', mark, { passive: true });
  track.addEventListener('pointerdown', stop);
  track.addEventListener('wheel', stop, { passive: true });
  track.addEventListener('keydown', function (e) {
    stop();
    if (e.key === 'ArrowDown') { e.preventDefault(); track.scrollBy({ top: H, behavior: 'smooth' }); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); track.scrollBy({ top: -H, behavior: 'smooth' }); }
  });

  var di = 0;
  var t = setInterval(function () {
    di = (di + 1) % N;
    track.scrollTo({ top: di * H, behavior: 'smooth' });
  }, 520);
  function stop() { wheel.classList.remove('is-demo'); clearInterval(t); }
  items[0].classList.add('is-center');
}());
</script>
</body>
</html>
