<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dual thumb range slider — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="rng is-demo">
    <div class="rng__track" id="track">
      <div class="rng__fill" id="fill"></div>
      <button type="button" class="rng__thumb" id="thumbLo" role="slider"
        aria-label="最低価格" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20" tabindex="0"></button>
      <button type="button" class="rng__thumb" id="thumbHi" role="slider"
        aria-label="最高価格" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" tabindex="0"></button>
    </div>
    <div class="rng__labels"><span id="loLabel">2</span>万円 –  <span id="hiLabel">7</span>万円</div>
  </div>
</main>
<script>
(function () {
  var rng = document.querySelector('.rng'), track = document.getElementById('track'),
      fill = document.getElementById('fill'), lo = document.getElementById('thumbLo'),
      hi = document.getElementById('thumbHi'), loLabel = document.getElementById('loLabel'),
      hiLabel = document.getElementById('hiLabel');
  var v = { lo: 20, hi: 70 };
  function paint() {
    lo.style.left = v.lo + '%'; hi.style.left = v.hi + '%';
    fill.style.left = v.lo + '%'; fill.style.width = (v.hi - v.lo) + '%';
    lo.setAttribute('aria-valuenow', v.lo); hi.setAttribute('aria-valuenow', v.hi);
    loLabel.textContent = Math.round(v.lo / 10); hiLabel.textContent = Math.round(v.hi / 10);
  }
  function setLo(n) { v.lo = Math.max(0, Math.min(n, v.hi - 5)); paint(); }
  function setHi(n) { v.hi = Math.min(100, Math.max(n, v.lo + 5)); paint(); }
  function pctFromX(x) {
    var r = track.getBoundingClientRect();
    return Math.round(Math.max(0, Math.min(100, ((x - r.left) / r.width) * 100)));
  }
  function drag(thumb, setter) {
    thumb.addEventListener('pointerdown', function (e) {
      stop(); thumb.setPointerCapture(e.pointerId);
      function move(ev) { setter(pctFromX(ev.clientX)); }
      function up() { thumb.removeEventListener('pointermove', move); thumb.removeEventListener('pointerup', up); }
      thumb.addEventListener('pointermove', move); thumb.addEventListener('pointerup', up);
    });
    thumb.addEventListener('keydown', function (e) {
      var step = { ArrowRight: 1, ArrowLeft: -1, ArrowUp: 1, ArrowDown: -1 }[e.key];
      if (step !== undefined) { e.preventDefault(); stop(); setter((thumb === lo ? v.lo : v.hi) + step); }
      else if (e.key === 'Home') { e.preventDefault(); stop(); setter(thumb === lo ? 0 : v.lo + 5); }
      else if (e.key === 'End') { e.preventDefault(); stop(); setter(thumb === lo ? v.hi - 5 : 100); }
    });
  }
  drag(lo, setLo); drag(hi, setHi);

  var presets = [[20, 70], [5, 40], [45, 90], [10, 55]], pi = 0;
  var t = setInterval(function () {
    var p = presets[pi % presets.length]; v.lo = p[0]; v.hi = p[1]; paint(); pi++;
  }, 480);
  function stop() { rng.classList.remove('is-demo'); clearInterval(t); }
  paint();
}());
</script>
</body>
</html>
