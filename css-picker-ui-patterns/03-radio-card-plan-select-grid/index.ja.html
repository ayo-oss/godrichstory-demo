<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>radio card plan select — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <fieldset class="plans is-demo">
    <legend class="sr-only">プランを選択</legend>
    <label class="plan">
      <input type="radio" name="plan" class="plan__radio" checked>
      <span class="plan__icon" aria-hidden="true">🪶</span>
      <span class="plan__name">ベーシック</span>
      <span class="plan__price">₩0</span>
      <svg class="plan__badge" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10"/><path d="M5.5 10.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </label>
    <label class="plan">
      <input type="radio" name="plan" class="plan__radio">
      <span class="plan__icon" aria-hidden="true">🚀</span>
      <span class="plan__name">プロ</span>
      <span class="plan__price">₩9,900</span>
      <svg class="plan__badge" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10"/><path d="M5.5 10.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </label>
    <label class="plan">
      <input type="radio" name="plan" class="plan__radio">
      <span class="plan__icon" aria-hidden="true">👥</span>
      <span class="plan__name">チーム</span>
      <span class="plan__price">₩29,900</span>
      <svg class="plan__badge" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10"/><path d="M5.5 10.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </label>
  </fieldset>
</main>
<script>
(function () {
  var box = document.querySelector('.plans');
  var radios = box.querySelectorAll('.plan__radio');
  var i = 0;
  var t = setInterval(function () { radios[i % radios.length].checked = true; i++; }, 700);
  function stop() { box.classList.remove('is-demo'); clearInterval(t); }
  box.addEventListener('pointerdown', stop);
  box.addEventListener('keydown', stop);
}());
</script>
</body>
</html>
