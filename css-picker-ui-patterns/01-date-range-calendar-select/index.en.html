<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>calendar date range select — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cal is-demo">
    <div class="cal__head">Sep</div>
    <div class="cal__grid" role="grid" aria-label="Select date range">
      <div class="cal__dow" aria-hidden="true">Sun</div>
      <div class="cal__dow" aria-hidden="true">Mon</div>
      <div class="cal__dow" aria-hidden="true">Tue</div>
      <div class="cal__dow" aria-hidden="true">Wed</div>
      <div class="cal__dow" aria-hidden="true">Thu</div>
      <div class="cal__dow" aria-hidden="true">Fri</div>
      <div class="cal__dow" aria-hidden="true">Sat</div>
    </div>
    <div class="cal__days" role="rowgroup"></div>
  </div>
</main>
<script>
(function () {
  var cal = document.querySelector('.cal');
  var days = document.createElement('div');
  days.className = 'cal__row';
  var cells = [];
  for (var d = 1; d <= 21; d++) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'cal__day'; b.textContent = d;
    b.setAttribute('role', 'gridcell');
    b.setAttribute('aria-selected', 'false');
    b.tabIndex = d === 1 ? 0 : -1;
    b.dataset.day = d;
    days.appendChild(b); cells.push(b);
  }
  cal.querySelector('.cal__days').appendChild(days);

  var start = null, end = null;
  function paint() {
    cells.forEach(function (c) {
      var n = +c.dataset.day;
      var inRange = start && end && n >= start && n <= end;
      var isEdge = n === start || n === end;
      c.classList.toggle('is-range', !!inRange);
      c.classList.toggle('is-edge', isEdge);
      c.setAttribute('aria-selected', isEdge ? 'true' : 'false');
    });
  }
  function pick(n) {
    if (start === null || (start !== null && end !== null)) { start = n; end = null; }
    else { if (n < start) { end = start; start = n; } else { end = n; } }
    paint();
  }
  cells.forEach(function (c, i) {
    c.addEventListener('click', function () { stop(); pick(+c.dataset.day); });
    c.addEventListener('keydown', function (e) {
      var map = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 7, ArrowUp: -7 };
      if (map[e.key] !== undefined) {
        e.preventDefault(); stop();
        var next = cells[Math.min(cells.length - 1, Math.max(0, i + map[e.key]))];
        cells.forEach(function (x) { x.tabIndex = -1; });
        next.tabIndex = 0; next.focus({ preventScroll: true });
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault(); stop(); pick(+c.dataset.day);
      }
    });
  });

  var demoPairs = [[3, 8], [10, 15], [5, 6], [13, 19]];
  var pi = 0;
  function tick() { var pr = demoPairs[pi % demoPairs.length]; start = pr[0]; end = pr[1]; paint(); pi++; }
  var t = setInterval(tick, 500); tick();
  function stop() { cal.classList.remove('is-demo'); clearInterval(t); }
}());
</script>
</body>
</html>
