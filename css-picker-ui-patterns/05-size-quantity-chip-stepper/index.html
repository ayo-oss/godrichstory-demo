<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>size quantity chip stepper — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sq is-demo">
    <div class="sq__sizes" role="radiogroup" aria-label="사이즈 선택">
      <label class="sq__chip"><input type="radio" name="size" value="S" class="sq__radio" data-price="19000"><span>S</span></label>
      <label class="sq__chip"><input type="radio" name="size" value="M" class="sq__radio" data-price="19000" checked><span>M</span></label>
      <label class="sq__chip"><input type="radio" name="size" value="L" class="sq__radio" data-price="20000"><span>L</span></label>
      <label class="sq__chip"><input type="radio" name="size" value="XL" class="sq__radio" data-price="21000"><span>XL</span></label>
    </div>
    <div class="sq__qty">
      <button type="button" class="sq__btn" id="dec" aria-label="수량 줄이기">−</button>
      <span class="sq__num" id="num" aria-live="polite">1</span>
      <button type="button" class="sq__btn" id="inc" aria-label="수량 늘리기">+</button>
    </div>
    <div class="sq__total">소계 <strong id="total">19,000원</strong></div>
  </div>
</main>
<script>
(function () {
  var sq = document.querySelector('.sq');
  var radios = Array.prototype.slice.call(sq.querySelectorAll('.sq__radio'));
  var dec = document.getElementById('dec'), inc = document.getElementById('inc'),
      num = document.getElementById('num'), total = document.getElementById('total');
  var qty = 1;
  function price() { return +(radios.filter(function (r) { return r.checked; })[0] || radios[0]).dataset.price; }
  function paint() {
    num.textContent = qty;
    dec.disabled = qty <= 1; inc.disabled = qty >= 9;
    total.textContent = (price() * qty).toLocaleString('ko-KR') + '원';
  }
  radios.forEach(function (r) { r.addEventListener('change', function () { stop(); paint(); }); });
  dec.addEventListener('click', function () { stop(); qty = Math.max(1, qty - 1); paint(); });
  inc.addEventListener('click', function () { stop(); qty = Math.min(9, qty + 1); paint(); });

  var seq = [[1, 1], [3, 1], [3, 3], [0, 2], [2, 4]], si = 0;
  var t = setInterval(function () {
    var s = seq[si % seq.length];
    radios[s[0]].checked = true; qty = s[1]; paint(); si++;
  }, 600);
  function stop() { sq.classList.remove('is-demo'); clearInterval(t); }
  paint();
}());
</script>
</body>
</html>
