<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>search combobox listbox — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cb is-demo">
    <label class="sr-only" for="cbInput">Search country</label>
    <input id="cbInput" class="cb__input" type="text" role="combobox" aria-expanded="false"
      aria-controls="cbList" aria-autocomplete="list" autocomplete="off" placeholder="Search country">
    <ul class="cb__list" id="cbList" role="listbox" aria-label="Country list"></ul>
  </div>
</main>
<script>
(function () {
  var cb = document.querySelector('.cb'), input = document.getElementById('cbInput'), list = document.getElementById('cbList');
  var all = ['South Korea', 'Japan', 'United States', 'Canada', 'France', 'Germany', 'Vietnam', 'Thailand', 'Australia', 'United Kingdom'];
  var active = -1, shown = [];
  function render(q) {
    shown = all.filter(function (c) { return c.indexOf(q) === 0 || !q; }).slice(0, 3);
    list.innerHTML = '';
    shown.forEach(function (c, i) {
      var li = document.createElement('li');
      li.id = 'opt-' + i; li.className = 'cb__opt'; li.setAttribute('role', 'option'); li.textContent = c;
      li.setAttribute('aria-selected', i === active ? 'true' : 'false');
      if (i === active) li.classList.add('is-active');
      li.addEventListener('click', function () { choose(i); });
      list.appendChild(li);
    });
  }
  function open() { cb.classList.add('is-open'); input.setAttribute('aria-expanded', 'true'); }
  function close() { cb.classList.remove('is-open'); input.setAttribute('aria-expanded', 'false'); active = -1; }
  function choose(i) { input.value = shown[i]; close(); }
  input.addEventListener('input', function () { stop(); active = 0; render(input.value); open(); });
  input.addEventListener('focus', function () { stop(); render(input.value); open(); });
  input.addEventListener('keydown', function (e) {
    stop();
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(shown.length - 1, active + 1); render(input.value); open(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); render(input.value); }
    else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); choose(active); }
    else if (e.key === 'Escape') { close(); }
  });
  document.addEventListener('pointerdown', function (e) { if (!cb.contains(e.target)) close(); });

  var demoQ = ['Fr', 'Fran', 'Canada', ''], qi = 0, phase = 0;
  var t = setInterval(function () {
    phase = (phase + 1) % 2;
    if (phase === 1) { active = 0; render(demoQ[qi % demoQ.length]); open(); }
    else { close(); qi++; }
  }, 650);
  function stop() { cb.classList.remove('is-demo'); clearInterval(t); }
  render('');
}());
</script>
</body>
</html>
