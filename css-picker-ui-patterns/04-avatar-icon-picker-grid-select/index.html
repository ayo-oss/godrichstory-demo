<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>avatar icon picker grid — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ava is-demo">
    <div class="ava__preview"><span id="pvEmoji">🐱</span><span id="pvName">코코</span></div>
    <div class="ava__grid" role="radiogroup" aria-label="아바타 선택">
      <button type="button" class="ava__item" role="radio" aria-checked="true" tabindex="0" data-emoji="🐱" data-name="코코" data-c="pink"></button>
      <button type="button" class="ava__item" role="radio" aria-checked="false" tabindex="-1" data-emoji="🐰" data-name="토리" data-c="lilac"></button>
      <button type="button" class="ava__item" role="radio" aria-checked="false" tabindex="-1" data-emoji="🐻" data-name="보리" data-c="mint"></button>
      <button type="button" class="ava__item" role="radio" aria-checked="false" tabindex="-1" data-emoji="🦊" data-name="여울" data-c="sky"></button>
      <button type="button" class="ava__item" role="radio" aria-checked="false" tabindex="-1" data-emoji="🐼" data-name="판다" data-c="pink"></button>
      <button type="button" class="ava__item" role="radio" aria-checked="false" tabindex="-1" data-emoji="🐨" data-name="코알" data-c="lilac"></button>
    </div>
  </div>
</main>
<script>
(function () {
  var ava = document.querySelector('.ava');
  var items = Array.prototype.slice.call(ava.querySelectorAll('.ava__item'));
  items.forEach(function (b) { b.textContent = b.dataset.emoji; b.style.setProperty('--c', 'var(--sub-' + b.dataset.c + ')'); });
  var pvEmoji = document.getElementById('pvEmoji'), pvName = document.getElementById('pvName');
  var cur = 0;
  function select(idx) {
    cur = idx;
    items.forEach(function (b, i) {
      var on = i === idx;
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
      b.classList.toggle('is-on', on);
    });
    pvEmoji.textContent = items[idx].dataset.emoji;
    pvName.textContent = items[idx].dataset.name;
  }
  items.forEach(function (b, i) {
    b.addEventListener('click', function () { stop(); select(i); });
    b.addEventListener('keydown', function (e) {
      var d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (d !== undefined) { e.preventDefault(); stop(); var n = (i + d + items.length) % items.length; select(n); items[n].focus({ preventScroll: true }); }
    });
  });
  var t = setInterval(function () { select((cur + 1) % items.length); }, 650);
  function stop() { ava.classList.remove('is-demo'); clearInterval(t); }
}());
</script>
</body>
</html>
