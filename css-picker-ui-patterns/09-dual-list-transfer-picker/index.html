<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dual list transfer picker — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="tf is-demo">
    <div class="tf__col">
      <div class="tf__h">사용 가능</div>
      <ul class="tf__list" id="avail" role="listbox" aria-label="사용 가능 항목" aria-multiselectable="true"></ul>
    </div>
    <div class="tf__mid">
      <button type="button" class="tf__btn" id="toRight" aria-label="선택함으로 이동">→</button>
      <button type="button" class="tf__btn" id="toLeft" aria-label="사용 가능으로 이동">←</button>
    </div>
    <div class="tf__col">
      <div class="tf__h">선택됨</div>
      <ul class="tf__list" id="chosen" role="listbox" aria-label="선택된 항목" aria-multiselectable="true"></ul>
    </div>
  </div>
</main>
<script>
(function () {
  var tf = document.querySelector('.tf');
  var availEl = document.getElementById('avail'), chosenEl = document.getElementById('chosen');
  var avail = ['CSS', 'JS', 'HTML', 'SCSS', 'React'], chosen = [];
  var selA = {}, selC = {};
  function row(name, sel, i) {
    var li = document.createElement('li');
    li.className = 'tf__item'; li.setAttribute('role', 'option'); li.textContent = name;
    li.tabIndex = i === 0 ? 0 : -1;
    li.setAttribute('aria-selected', sel[name] ? 'true' : 'false');
    li.classList.toggle('is-sel', !!sel[name]);
    return li;
  }
  function render() {
    availEl.innerHTML = ''; chosenEl.innerHTML = '';
    avail.forEach(function (n, i) { availEl.appendChild(bind(row(n, selA, i), n, selA, availEl)); });
    chosen.forEach(function (n, i) { chosenEl.appendChild(bind(row(n, selC, i), n, selC, chosenEl)); });
  }
  function bind(li, name, sel, list) {
    li.addEventListener('click', function () { stop(); sel[name] = !sel[name]; render(); });
    li.addEventListener('keydown', function (e) {
      stop();
      var items = Array.prototype.slice.call(list.children);
      var i = items.indexOf(li);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        var n = items[Math.max(0, Math.min(items.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
        items.forEach(function (x) { x.tabIndex = -1; }); n.tabIndex = 0; n.focus({ preventScroll: true });
      } else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); sel[name] = !sel[name]; render(); }
    });
    return li;
  }
  function move(from, to, sel) {
    var keep = [], moved = [];
    from.forEach(function (n) { (sel[n] ? moved : keep).push(n); });
    from.length = 0; Array.prototype.push.apply(from, keep);
    Array.prototype.push.apply(to, moved);
    Object.keys(sel).forEach(function (k) { delete sel[k]; });
    render();
  }
  document.getElementById('toRight').addEventListener('click', function () { stop(); move(avail, chosen, selA); });
  document.getElementById('toLeft').addEventListener('click', function () { stop(); move(chosen, avail, selC); });

  var t = setInterval(function () {
    if (avail.length) { selA[avail[0]] = true; move(avail, chosen, selA); }
    else { selC[chosen[0]] = true; move(chosen, avail, selC); }
  }, 380);
  function stop() { tf.classList.remove('is-demo'); clearInterval(t); }
  render();
}());
</script>
</body>
</html>
