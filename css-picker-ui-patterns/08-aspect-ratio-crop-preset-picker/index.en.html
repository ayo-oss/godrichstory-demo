<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aspect ratio crop preset picker — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ar is-demo">
    <div class="ar__preview"><div class="ar__box" id="box"></div></div>
    <div class="ar__chips" role="radiogroup" aria-label="Select aspect ratio">
      <label class="ar__chip"><input type="radio" name="ar" class="ar__radio" value="1/1" checked><span>1:1</span></label>
      <label class="ar__chip"><input type="radio" name="ar" class="ar__radio" value="4/5"><span>4:5</span></label>
      <label class="ar__chip"><input type="radio" name="ar" class="ar__radio" value="16/9"><span>16:9</span></label>
      <label class="ar__chip"><input type="radio" name="ar" class="ar__radio" value="9/16"><span>9:16</span></label>
    </div>
  </div>
</main>
<script>
(function () {
  var ar = document.querySelector('.ar'), box = document.getElementById('box');
  var radios = Array.prototype.slice.call(ar.querySelectorAll('.ar__radio'));
  function apply(v) { box.style.aspectRatio = v; }
  radios.forEach(function (r) { r.addEventListener('change', function () { stop(); apply(r.value); }); });

  var seq = ['1/1', '4/5', '16/9', '9/16'], si = 0;
  var t = setInterval(function () {
    si = (si + 1) % seq.length;
    radios[si].checked = true; apply(seq[si]);
  }, 700);
  function stop() { ar.classList.remove('is-demo'); clearInterval(t); }
  apply('1/1');
}());
</script>
</body>
</html>
