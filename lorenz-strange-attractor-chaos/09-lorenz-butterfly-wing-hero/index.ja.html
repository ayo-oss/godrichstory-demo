<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나비 히어로 씬 — 로렌츠 어트랙터 카오스 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lz is-demo" id="lzRoot">
  <p class="lz__hint">
    <span>密度の雲を背景に敷き、ビネット・文字・ゆっくりした回転を重ねるとサイエンスサービスの表紙が完成します</span>
  </p>
  <div class="lz__field" role="application" aria-label="蝶のヒーローシーンの実験盤" tabindex="0">
    <canvas class="lz__cv" id="lzCv"></canvas>
  </div>
  <div class="lz__bar">
    <span class="lz__meta">銀河腕軌道 12秒 · 観察角 30秒</span>
    <span class="lz__meta lz__meta--dim">canvas · 銀河の軌跡 · 常に動く</span>
  </div>
</div>
</main>
<script>
// 나비 히어로 씬(09) — 밀도 구름 위에 타이포를 얹는 대문 장면.
// 2,400점을 동시 적분해 xz 히스토그램 밀도 구름(감마 램프)을 쌓고,
// 관찰각을 30초 주기(SPIN_L)로 아주 느리게 돌린다. 밝은 궤적 한 줄이 구름 위를 12초 주기로
// 흐르며 은하 팔처럼 보이게 하고, 비네팅과 세 줄 글자로 서비스 대문을 완성한다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var NPTS  = 2400;    // 동시 점 수 — 밀도 구름 결
  var DT    = 0.016;   // 오일러 걸음 — 프레임당 2회
  var SPIN_L = 30.0;   // 관찰각 회전 주기(초) — 설정 30초와 같다
  // ────────────────────────────────────────────────────
  var SIG = 10, RHO = 28, BETA = 8 / 3;

  var root = document.getElementById('lzRoot');
  var cvEl = document.getElementById('lzCv');
  if (!root || !cvEl) return;
  var fieldEl = cvEl.parentElement;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C0    = tokRGB('--lz-c0');    // 밀도 낮은 쪽 — 얼음
  var C1    = tokRGB('--lz-c1');    // 밀도 높은 쪽 — 복숭아
  var HEAD  = tokRGB('--lz-head');  // 글자·헤드 — 크림(토큰)
  var PANEL = tokRGB('--lz-panel');
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function rgba(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0;
  var RES = 150;                        // 밀도 히스토그램 해상도
  var hist = new Float32Array(RES * RES);
  var px = new Float32Array(NPTS), py = new Float32Array(NPTS), pz = new Float32Array(NPTS);

  function fit() {
    var r = fieldEl.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = W; cvEl.height = H;
  }

  function rng(seed) {
    var t = seed;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = rng(99);
  function seedPoints() {
    var i;
    for (i = 0; i < NPTS; i++) {
      px[i] = 0.6 + (rand() - 0.5) * 0.02;
      py[i] = 0.7 + (rand() - 0.5) * 0.02;
      pz[i] = 21 + (rand() - 0.5) * 0.02;
    }
  }

  function stepAll() {
    var i, k, dx, dy, dz;
    for (k = 0; k < 2; k++) {
      for (i = 0; i < NPTS; i++) {
        var x = px[i], y = py[i], z = pz[i];
        dx = SIG * (y - x); dy = x * (RHO - z) - y; dz = x * y - BETA * z;
        px[i] = x + dx * DT; py[i] = y + dy * DT; pz[i] = z + dz * DT;
      }
    }
  }

  // 회전 각도에 맞춰 xz 히스토그램에 누적 — 회전은 x/y 축 섞기로 표현
  function accumulate(a) {
    var ca = Math.cos(a), sa = Math.sin(a);
    var i, u, v, gx, gy;
    for (i = 0; i < NPTS; i++) {
      u = px[i] * ca - py[i] * sa;
      v = px[i] * sa + py[i] * ca;
      gx = (u / 22 + 0.5) * (RES - 1);
      gy = (1 - (pz[i] - 1) / 47) * (RES - 1);
      if (gx >= 0 && gx < RES && gy >= 0 && gy < RES) {
        hist[(gy | 0) * RES + (gx | 0)] += 1;
      }
    }
  }

  function blit(tSec) {
    var maxA = 0, i;
    for (i = 0; i < hist.length; i++) if (hist[i] > maxA) maxA = hist[i];
    if (maxA <= 0) maxA = 1;

    ctx.fillStyle = rgba(PANEL, 1);
    ctx.fillRect(0, 0, W, H);
    var side = Math.min(W, H) * 0.96;
    var ox = (W - side) / 2, oy = (H - side) / 2;
    var cell = side / RES;
    ctx.save();
    ctx.translate(ox, oy);
    var j, k2, v, g, col, alpha;
    for (j = 0; j < RES; j++) {
      for (k2 = 0; k2 < RES; k2++) {
        v = hist[j * RES + k2];
        if (v <= 0) continue;
        g = Math.pow(v / maxA, 0.38);
        col = mix(C0, C1, g);
        alpha = Math.min(1, 0.08 + g * 0.80);
        ctx.fillStyle = 'rgba(' + (col[0] | 0) + ',' + (col[1] | 0) + ',' + (col[2] | 0) + ',' + alpha + ')';
        ctx.fillRect(k2 * cell, j * cell, cell + 0.5, cell + 0.5);
      }
    }
    ctx.restore();

    // 은하 팔 — 밝은 단일 궤적이 구름 위를 크리프한다
    // (사전 적분 궤적에서 phase 로 읽는 게 아니라, tSec 에 τ 크리프를 태워 머리를 끌고 다닌다)
    var armT = (tSec % 12) / 12;
    var armN = 700;
    var ai = Math.floor(armT * armN);
    var s2 = Math.min(W, H) / 52;
    var ca2 = Math.cos(tSec / SPIN_L * 6.2832), sa2 = Math.sin(tSec / SPIN_L * 6.2832);
    ctx.lineCap = 'round';
    ctx.strokeStyle = rgba(HEAD, 0.5);
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    var a0 = Math.max(0, ai - 160), hx2, hy2, p2, u2, v2;
    for (i = a0; i <= ai; i++) {
      p2 = armXZ(i);
      u2 = p2[0] * ca2 - p2[1] * sa2;
      hx2 = ox + (u2 / 22 + 0.5) * side;
      hy2 = oy + (1 - (p2[2] - 1) / 47) * side;
      if (i === a0) ctx.moveTo(hx2, hy2); else ctx.lineTo(hx2, hy2);
    }
    ctx.stroke();
    // 팔 머리 — 크림 점
    if (ai >= 0) {
      p2 = armXZ(ai);
      u2 = p2[0] * ca2 - p2[1] * sa2;
      hx2 = ox + (u2 / 22 + 0.5) * side;
      hy2 = oy + (1 - (p2[2] - 1) / 47) * side;
      ctx.fillStyle = rgba(HEAD, 0.25);
      ctx.beginPath(); ctx.arc(hx2, hy2, 6, 0, 6.2832); ctx.fill();
      ctx.fillStyle = rgba(HEAD, 1);
      ctx.beginPath(); ctx.arc(hx2, hy2, 2.2, 0, 6.2832); ctx.fill();
    }

    // 비네팅 — 가장자리를 어둡게 눌러 글자가 뜨게 한다
    var vg = ctx.createRadialGradient(W / 2, H * 0.46, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(4,9,16,0.62)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // 타이포 — 대문 세 줄
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(HEAD, 0.94);
    ctx.font = '700 15px -apple-system, "Segoe UI", sans-serif';
    ctx.fillText('CHAOS BUTTERFLY', W / 2, H * 0.40);
    ctx.fillStyle = rgba(HEAD, 0.62);
    ctx.font = '500 10px -apple-system, "Segoe UI", sans-serif';
    ctx.fillText('ローレンツアトラクター シミュレーター', W / 2, H * 0.40 + 18);
    ctx.fillStyle = rgba(HEAD, 0.40);
    ctx.font = '500 10px -apple-system, "Segoe UI", sans-serif';
    ctx.fillText('dz/dt = xy − βz', W / 2, H * 0.40 + 33);
  }

  // 은하 팔용 사전 적분 궤적 (x, y, z)
  var armPts = [];
  (function () {
    var x = 0.6, y = 0.7, z = 21, i;
    var adt = 0.012;
    for (i = 0; i < 300; i++) {
      var dx = SIG * (y - x), dy = x * (RHO - z) - y, dz = x * y - BETA * z;
      x += dx * adt; y += dy * adt; z += dz * adt;
    }
    for (i = 0; i < 700; i++) {
      armPts.push([x, y, z]);
      var dx2 = SIG * (y - x), dy2 = x * (RHO - z) - y, dz2 = x * y - BETA * z;
      x += dx2 * adt; y += dy2 * adt; z += dz2 * adt;
    }
  })();
  function armXZ(i) { return armPts[Math.max(0, Math.min(armPts.length - 1, i))]; }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1, lastT = 0;
  function frame(now) {
    if (t0 < 0) t0 = now;
    var tSec = (now - t0) / 1000;
    stepAll();
    accumulate(tSec / SPIN_L * 6.2832);
    blit(tSec);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) blit(3);
  });
  fit();
  seedPoints();
  if (reduce) {
    var i;
    for (i = 0; i < 120; i++) { stepAll(); accumulate(0.3); }  // reduce — 쌓인 한 장
    blit(3);
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
