<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어트랙터 지도책 — 로렌츠 어트랙터 카오스 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lz is-demo" id="lzRoot">
  <p class="lz__hint">
    <span>클리포드·드용 점화식에 수만 번의 반복을 흘려보내 방문 밝기를 쌓으면 계수 조합마다 다른 문양이 펼쳐집니다</span>
  </p>
  <div class="lz__field" role="application" aria-label="어트랙터 지도책 실험판" tabindex="0">
    <canvas class="lz__cv" id="lzCv"></canvas>
  </div>
  <div class="lz__bar">
    <span class="lz__meta">2차원 점화식 · 채널당 2만 번</span>
    <span class="lz__meta lz__meta--dim">canvas · 명암 산포 · 주기 2초</span>
  </div>
</div>
</main>
<script>
// 어트랙터 지도책(04) — 로렌츠와 같은 '어트랙터' 개념을 2차원 점화식으로 보여준다.
// 클리포드 x' = sin(a·y) + c·cos(a·x), y' = sin(b·x) + d·cos(b·y)
// 드용   x' = sin(a·y) − b·cos(x),   y' = sin(c·x) − d·cos(y)
// 한 점을 식에 반복 통과시키며 ImageData 채널에 방문 횟수를 누적한다.
// 하나의 궤적이 채널을 채우면 다음 채널로 넘어가고, 셋이 다 채워지면 색으로 합성된다.
// 무작위 시드가 루프마다 같은 결정론 궤도를 그리므로 화면은 매 루프 재현 가능하다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var ITERS  = 20000;  // 채널당 반복 수 — 늘리면 문양이 더 촘촘해진다
  var CYCLE  = 2.0;    // 완성 주기(초) — 설정 초(2s)와 같다
  // ────────────────────────────────────────────────────

  var root = document.getElementById('lzRoot');
  var cvEl = document.getElementById('lzCv');
  if (!root || !cvEl) return;
  var fieldEl = cvEl.parentElement;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var COLS  = ['--lz-k0', '--lz-k1', '--lz-k2'].map(tokRGB); // 채널 3색 — 파스텔 트리오
  var PANEL = tokRGB('--lz-panel');

  function rgba(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }

  // 계수 목록 — 클리포드 a,b,c,d / 드용 a,b,c,d (뒤의 3개는 드용)
  var SETS = [
    { kind: 0, p: [-1.4, 1.6, 1.0, 0.7] },
    { kind: 0, p: [-1.7, 1.3, 0.5, 1.21] },
    { kind: 0, p: [1.5, -1.8, 1.6, 0.9] },
    { kind: 1, p: [2.01, -2.53, 1.61, -0.33] },
    { kind: 1, p: [-2.7, -0.09, -0.86, -2.2] },
    { kind: 1, p: [-2.24, 0.43, -0.65, -2.43] }
  ];

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0;
  var RES = 150;                         // 내부 누적 해상도(정사각) — 성능 노브
  var acc;                               // 방문 카운트 Float32Array(RES*RES)
  function fit() {
    var r = fieldEl.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = W; cvEl.height = H;
    acc = new Float32Array(RES * RES);
  }

  // 결정론 난수 — 매 루프 같은 그림이 쌓이게 하는 시드 고정 mulberry32
  function rng(seed) {
    var t = seed;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 한 채널 누적 — kind 0=클리포드, 1=드용. 걸음 수 비율 upto 까지.
  function accumulate(set, upto) {
    var rand = rng(set.kind * 1000 + 7);
    var x = rand() * 2 - 1, y = rand() * 2 - 1;
    var n = Math.floor(ITERS * upto);
    var a = set.p[0], b = set.p[1], c = set.p[2], d = set.p[3];
    var i, px, py;
    for (i = 0; i < n + 400; i++) {
      if (set.kind === 0) {
        var nx = Math.sin(a * y) + c * Math.cos(a * x);
        y = Math.sin(b * x) + d * Math.cos(b * y);
        x = nx;
      } else {
        var nx2 = Math.sin(a * y) - b * Math.cos(x);
        y = Math.sin(c * x) - d * Math.cos(y);
        x = nx2;
      }
      if (i < 400) continue;              // 과도기 버림
      px = (x + 3) / 6 * (RES - 1);
      py = (y + 3) / 6 * (RES - 1);
      if (px >= 0 && px < RES && py >= 0 && py < RES) {
        acc[(py | 0) * RES + (px | 0)] += 1;
      }
    }
  }

  // 누적 카운트 → 명암 산포(반비례 감마)로 그리기 — 채널색 3장 합성
  function blit(phase) {
    var maxA = 0, i;
    for (i = 0; i < acc.length; i++) if (acc[i] > maxA) maxA = acc[i];
    if (maxA <= 0) maxA = 1;
    // 채널 진행 — 셋으로 나눠 순차 등장
    var seg = phase * 3;
    var chAmt = [Math.max(0, Math.min(1, seg)), Math.max(0, Math.min(1, seg - 1)), Math.max(0, Math.min(1, seg - 2))];

    ctx.fillStyle = rgba(PANEL, 1);
    ctx.fillRect(0, 0, W, H);
    var side = Math.min(W, H) * 0.92;
    var ox = (W - side) / 2, oy = (H - side) / 2;
    var cell = side / RES;

    var g, alpha, cx, cy;
    ctx.save();
    ctx.translate(ox, oy);
    for (var j = 0; j < RES; j++) {
      cy = j * cell;
      for (var k2 = 0; k2 < RES; k2++) {
        var v = acc[j * RES + k2];
        if (v <= 0) continue;
        g = Math.pow(v / maxA, 0.32);     // 감마 — 옅은 방문도 살린다
        // 채널 3개를 합성 — ch0 파스텔 라벤더, ch1 아이스, ch2 피치
        var r0 = 0, g0 = 0, b0 = 0, kk;
        for (kk = 0; kk < 3; kk++) {
          if (chAmt[kk] <= 0) continue;
          var w = g * chAmt[kk] / 3;
          r0 += COLS[kk][0] * w; g0 += COLS[kk][1] * w; b0 += COLS[kk][2] * w;
        }
        alpha = Math.min(1, 0.16 + g * 0.9);
        ctx.fillStyle = 'rgba(' + (r0 | 0) + ',' + (g0 | 0) + ',' + (b0 | 0) + ',' + alpha + ')';
        cx = k2 * cell;
        ctx.fillRect(cx, cy, cell + 0.5, cell + 0.5);
      }
    }
    ctx.restore();
  }

  // 채널 0..2 = 지도책 서로 다른 계수 — 세 채널이 같은 판에 겹쳐 합성된다
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1, lastSeg = -1;
  function frame(now) {
    if (t0 < 0) t0 = now;
    var phase = (((now - t0) / 1000) % CYCLE) / CYCLE;
    var seg = Math.floor(phase * 3);
    if (seg !== lastSeg) {                // 채널이 넘어갈 때만 누적을 다시 쌓는다
      lastSeg = seg;
      acc = new Float32Array(RES * RES);
      accumulate(SETS[seg], 1);
      accumulate(SETS[seg + 3], 1);
    }
    blit(phase);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) blit(0.9);
  });
  fit();
  if (reduce) {
    lastSeg = 0;
    accumulate(SETS[0], 1); accumulate(SETS[3], 1);
    blit(0.9);                            // reduce — 완성 문양 한 장
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
