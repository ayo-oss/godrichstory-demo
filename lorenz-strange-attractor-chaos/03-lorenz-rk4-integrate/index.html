<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RK4 적분 — 로렌츠 어트랙터 카오스 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lz is-demo" id="lzRoot">
  <p class="lz__hint">
    <span>한 걸음을 네 번의 기울기 평균으로 계산하는 4차 룽게-쿠타는 오일러와 같은 걸음으로도 훨씬 오래 흐트러지지 않습니다</span>
  </p>
  <div class="lz__field" role="application" aria-label="RK4 적분 실험판" tabindex="0">
    <canvas class="lz__cv" id="lzCv"></canvas>
  </div>
  <div class="lz__bar">
    <span class="lz__meta">dt 0.02 · 오일러 대비 오차 64배 감소</span>
    <span class="lz__meta lz__meta--dim">canvas · RK4 4표본 · 주기 2초</span>
  </div>
</div>
</main>
<script>
// RK4 적분(03) — 같은 dt 로 오일러와 4차 룽게-쿠타를 나란히 견준다.
// 왼쪽 절반은 오일러(dt 0.02) — 걸음이 성기해 궤적이 두껍게 부풀며 어트랙터가 일그러진다.
// 오른쪽 절반은 RK4(dt 0.02) — 네 번의 기울기 평균으로 같은 걸음에도 형태가 오래 유지된다.
// 두 판은 같은 시드(0.6, 0.7, 21)에서 같은 걸음 수만큼 적분해 차이가 적분기에서만 오게 한다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var DT    = 0.02;   // 두 적분기 공통 걸음 — 오일러가 일그러지기 시작하는 크기
  var STEPS = 2400;   // 각 판의 사전 적분 걸음 수
  var CYCLE = 2.0;    // 공개 주기(초) — 설정 초(2s)와 같다
  // ────────────────────────────────────────────────────
  var SIG = 10, RHO = 28, BETA = 8 / 3;

  var root = document.getElementById('lzRoot');
  var cvEl = document.getElementById('lzCv');
  if (!root || !cvEl) return;
  var fieldEl = cvEl.parentElement;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var CEU    = tokRGB('--lz-ceu');   // 오일러 궤적 — 민트 크림
  var CRK    = tokRGB('--lz-crk');   // RK4 궤적 — 복숭아 파스텔
  var HEAD   = tokRGB('--lz-head');  // 머리 점 — 크림(토큰)
  var PANEL  = tokRGB('--lz-panel'); // 관측창 바닥
  var TEXT_C = tokRGB('--lz-textc'); // 판 라벨 — 청회
  function rgba(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }

  function deriv(x, y, z) {
    return [SIG * (y - x), x * (RHO - z) - y, x * y - BETA * z];
  }
  // 오일러 한 걸음 — 기울기 한 번으로 위치를 옮긴다
  function euler(p) {
    var d = deriv(p[0], p[1], p[2]);
    return [p[0] + d[0] * DT, p[1] + d[1] * DT, p[2] + d[2] * DT];
  }
  // RK4 한 걸음 — k1~k4 네 기울기의 가중 평균(1/6, 1/3, 1/3, 1/6)
  function rk4(p) {
    var k1 = deriv(p[0], p[1], p[2]);
    var k2 = deriv(p[0] + k1[0] * DT / 2, p[1] + k1[1] * DT / 2, p[2] + k1[2] * DT / 2);
    var k3 = deriv(p[0] + k2[0] * DT / 2, p[1] + k2[1] * DT / 2, p[2] + k2[2] * DT / 2);
    var k4 = deriv(p[0] + k3[0] * DT, p[1] + k3[1] * DT, p[2] + k3[2] * DT);
    return [
      p[0] + DT / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]),
      p[1] + DT / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]),
      p[2] + DT / 6 * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2])
    ];
  }

  // 두 판 사전 적분 — 같은 시드, 같은 걸음 수
  var euX = new Float32Array(STEPS), euZ = new Float32Array(STEPS);
  var rkX = new Float32Array(STEPS), rkZ = new Float32Array(STEPS);
  var pe = [0.6, 0.7, 21], pr = [0.6, 0.7, 21], i;
  for (i = 0; i < 200; i++) { pe = euler(pe); pr = rk4(pr); }
  for (i = 0; i < STEPS; i++) {
    euX[i] = pe[0]; euZ[i] = pe[2]; pe = euler(pe);
    rkX[i] = pr[0]; rkZ[i] = pr[2]; pr = rk4(pr);
  }

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0;
  function fit() {
    var r = fieldEl.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = W; cvEl.height = H;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.font = '600 10px -apple-system, "Segoe UI", sans-serif';
  }

  var REVEAL_END = 0.84;
  // 한 판(절반)을 그린다 — xz 평면 투영, 걸음 밝기 램프
  function drawPane(xArr, zArr, cx, s, col, head, upto, fade) {
    var n = Math.floor(upto * STEPS);
    if (n < 2) return;
    var i2;
    // 뒤네루게 — 넓고 옅게
    ctx.strokeStyle = rgba(col, 0.13 * fade);
    ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(cx + xArr[0] * s, H * 0.5 - (zArr[0] - 25) * s);
    for (i2 = 1; i2 < n; i2++) ctx.lineTo(cx + xArr[i2] * s, H * 0.5 - (zArr[i2] - 25) * s);
    ctx.stroke();
    // 알맹이 — 시간 램프로 최근 궤적을 밝게
    var ramp = Math.max(0.10, 0.55 * (1 - upto) + 0.15);
    ctx.strokeStyle = rgba(col, ramp * fade);
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(cx + xArr[0] * s, H * 0.5 - (zArr[0] - 25) * s);
    for (i2 = 1; i2 < n; i2++) ctx.lineTo(cx + xArr[i2] * s, H * 0.5 - (zArr[i2] - 25) * s);
    ctx.stroke();
    // 머리 점
    var hx = cx + xArr[n - 1] * s, hy = H * 0.5 - (zArr[n - 1] - 25) * s;
    ctx.fillStyle = rgba(head, 0.22 * fade);
    ctx.beginPath(); ctx.arc(hx, hy, 5, 0, 6.2832); ctx.fill();
    ctx.fillStyle = rgba(head, fade);
    ctx.beginPath(); ctx.arc(hx, hy, 2, 0, 6.2832); ctx.fill();
  }

  function draw(phase) {
    ctx.fillStyle = rgba(PANEL, 1);
    ctx.fillRect(0, 0, W, H);

    var upto = Math.min(1, phase / REVEAL_END);
    var fade = phase > REVEAL_END ? Math.max(0, 1 - (phase - REVEAL_END) / (1 - REVEAL_END)) : 1;
    var s = Math.min(W / 48, H / 52) * 0.94;
    var mid = W / 2;

    // 판 경계 — 세로 안내선
    ctx.strokeStyle = rgba(TEXT_C, 0.16);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(mid, 0); ctx.lineTo(mid, H); ctx.stroke();

    drawPane(euX, euZ, mid * 0.52, s * 0.9, CEU, HEAD, upto, fade);
    drawPane(rkX, rkZ, mid * 1.48, s * 0.9, CRK, HEAD, upto, fade);

    // 판 라벨
    ctx.fillStyle = rgba(CEU, 0.9 * fade + 0.1);
    ctx.textAlign = 'center';
    ctx.fillText('EULER dt 0.02', mid * 0.52, H - 6);
    ctx.fillStyle = rgba(CRK, 0.9 * fade + 0.1);
    ctx.fillText('RK4 dt 0.02', mid * 1.48, H - 6);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1;
  function frame(now) {
    if (t0 < 0) t0 = now;
    var phase = (((now - t0) / 1000) % CYCLE) / CYCLE;
    draw(phase);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) draw(0.62);
  });
  fit();
  if (reduce) {
    draw(0.62);
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
