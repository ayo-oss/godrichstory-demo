<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>푸앵카레 단면 — 로렌츠 어트랙터 카오스 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lz is-demo" id="lzRoot">
  <p class="lz__hint">
    <span>Stamp a dot only where the orbit pierces a reference plane and each wing grows a band of dots</span>
  </p>
  <div class="lz__field" role="application" aria-label="Poincare section playground" tabindex="0">
    <canvas class="lz__cv" id="lzCv"></canvas>
  </div>
  <div class="lz__bar">
    <span class="lz__meta">section z = 27 · collecting both crossings</span>
    <span class="lz__meta lz__meta--dim">canvas · section map · 2s cycle</span>
  </div>
</div>
</main>
<script>
// 푸앵카레 단면(07) — 3차원 궤적을 2차원 지도로 압축한다.
// RK4 로 긴 궤적을 사전 적분해 두고, z 가 기준값 27 을 건너는 순간만 선형 보간으로
// (x, y) 를 찍는다. 상승 통과는 얼음, 하강 통과는 복숭아 — 두 방향이 각 날개에 띠를 만든다.
// 점은 저해상도 히스토그램에 3x3 스플랏으로 누적해 감마 램프로 뿌린다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var DT     = 0.005;   // RK4 걸음 — 작게 잡아 통과 순간을 정밀하게 잡는다
  var STEPS  = 14000;   // 사전 적분 걸음 수 (총 70 시간단위)
  var CYCLE  = 2.0;     // 리셋 주기(초) — 설정 초(2s)와 같다
  // ────────────────────────────────────────────────────
  var SIG = 10, RHO = 28, BETA = 8 / 3;
  var Z_PLANE = 27;                     // 기준 단면 — z = 27

  var root = document.getElementById('lzRoot');
  var cvEl = document.getElementById('lzCv');
  if (!root || !cvEl) return;
  var fieldEl = cvEl.parentElement;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var CU    = tokRGB('--lz-cu');    // 상승 통과 — 얼음 파스텔
  var CD    = tokRGB('--lz-cd');    // 하강 통과 — 복숭아 파스텔
  var PANEL = tokRGB('--lz-panel');
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function rgba(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }

  function deriv(x, y, z) {
    return [SIG * (y - x), x * (RHO - z) - y, x * y - BETA * z];
  }
  function rk4(p) {
    var k1 = deriv(p[0], p[1], p[2]);
    var k2 = deriv(p[0] + k1[0] * DT / 2, p[1] + k1[1] * DT / 2, p[2] + k1[2] * DT / 2);
    var k3 = deriv(p[0] + k2[0] * DT / 2, p[1] + k2[1] * DT / 2, p[2] + k2[2] * DT / 2);
    var k4 = deriv(p[0] + k3[0] * DT, p[1] + k3[1] * DT, p[2] + k3[2] * DT);
    return [
      p[0] + DT / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]),
      p[1] + DT / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]),
      p[2] + DT / 6 * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2])
    ];
  }

  // 사전 적분 — 과도기 400걸음 버림
  var xs = new Float32Array(STEPS), ys = new Float32Array(STEPS), zs = new Float32Array(STEPS);
  var p = [0.6, 0.7, 21], i;
  for (i = 0; i < 400; i++) p = rk4(p);
  for (i = 0; i < STEPS; i++) {
    xs[i] = p[0]; ys[i] = p[1]; zs[i] = p[2];
    p = rk4(p);
  }

  // 통과 목록 — z 가 27 을 건너는 순간의 보간 (x, y) 와 방향(1 상승 / 0 하강)
  var crX = [], crY = [], crUp = [];
  for (i = 1; i < STEPS; i++) {
    var za = zs[i - 1] - Z_PLANE, zb = zs[i] - Z_PLANE;
    if ((za < 0 && zb >= 0) || (za >= 0 && zb < 0)) {
      var t2 = za / (za - zb);
      crX.push(xs[i - 1] + (xs[i] - xs[i - 1]) * t2);
      crY.push(ys[i - 1] + (ys[i] - ys[i - 1]) * t2);
      crUp.push(zb > za ? 1 : 0);
    }
  }

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0;
  var RES = 150;                        // 단면 지도 해상도(정사각)
  var histU = new Float32Array(RES * RES);
  var histD = new Float32Array(RES * RES);
  function fit() {
    var r = fieldEl.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = W; cvEl.height = H;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  }

  // 통과 하나를 3x3 가우시안 근사 스플랏으로 누적
  var W9 = [0.30, 0.55, 0.30, 0.55, 1.0, 0.55, 0.30, 0.55, 0.30];
  function splat(cx2, cy2, up) {
    var gx = (cx2 / 24 + 0.5) * (RES - 1);
    var gy = (1 - (cy2 + 28) / 56) * (RES - 1);
    var gx0 = Math.round(gx), gy0 = Math.round(gy), j, k2, w;
    var dst = up ? histU : histD;
    for (j = -1; j <= 1; j++) {
      for (k2 = -1; k2 <= 1; k2++) {
        var ix = gx0 + k2, iy = gy0 + j;
        if (ix < 0 || ix >= RES || iy < 0 || iy >= RES) continue;
        w = W9[(j + 1) * 3 + (k2 + 1)];
        dst[iy * RES + ix] += w;
      }
    }
  }

  var REVEAL_END = 0.84;
  function splatUpTo(count) {
    var i2;
    for (i2 = 0; i2 < count; i2++) splat(crX[i2], crY[i2], crUp[i2]);
  }

  function draw(phase) {
    ctx.fillStyle = rgba(PANEL, 1);
    ctx.fillRect(0, 0, W, H);

    var upto = Math.min(1, phase / REVEAL_END);
    var fade = phase > REVEAL_END ? Math.max(0, 1 - (phase - REVEAL_END) / (1 - REVEAL_END)) : 1;

    // 배경 — xy 투영 전체 궤적이 순차 공개되며 단면의 맥락을 깐다
    var s = Math.min(W / 50, H / 58);
    var n = Math.floor(upto * STEPS);
    if (n > 2) {
      ctx.strokeStyle = rgba(CU, 0.09 * fade);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W / 2 + xs[0] * s, H / 2 - ys[0] * s);
      for (i = 1; i < n; i++) ctx.lineTo(W / 2 + xs[i] * s, H / 2 - ys[i] * s);
      ctx.stroke();
    }

    // 단면 지도 — 두 방향 히스토그램을 감마 램프로 합성
    var maxU = 0, maxD = 0, i3;
    for (i3 = 0; i3 < histU.length; i3++) {
      if (histU[i3] > maxU) maxU = histU[i3];
      if (histD[i3] > maxD) maxD = histD[i3];
    }
    if (maxU <= 0) maxU = 1;
    if (maxD <= 0) maxD = 1;
    var sideW = W * 0.44, sideH = H * 0.9;
    var cellW = sideW / RES, cellH = sideH / RES;
    ctx.save();
    ctx.translate((W - sideW) / 2, (H - sideH) / 2);
    var j, k2, su, sd, tot, col, alpha;
    for (j = 0; j < RES; j++) {
      for (k2 = 0; k2 < RES; k2++) {
        su = Math.pow(histU[j * RES + k2] / maxU, 0.34);
        sd = Math.pow(histD[j * RES + k2] / maxD, 0.34);
        tot = su + sd;
        if (tot <= 0.003) continue;
        col = mix(CU, CD, sd / tot);
        alpha = Math.min(1, 0.12 + tot * 0.85) * fade;
        ctx.fillStyle = 'rgba(' + (col[0] | 0) + ',' + (col[1] | 0) + ',' + (col[2] | 0) + ',' + alpha + ')';
        ctx.fillRect(k2 * cellW, j * cellH, cellW + 0.5, cellH + 0.5);
      }
    }
    ctx.restore();
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1, splatted = -1;
  function frame(now) {
    if (t0 < 0) t0 = now;
    var phase = (((now - t0) / 1000) % CYCLE) / CYCLE;
    var want = Math.floor(Math.min(1, phase / REVEAL_END) * crX.length);
    if (want !== splatted) {                  // 통과 수가 변할 때만 다시 스플랏
      histU = new Float32Array(RES * RES);
      histD = new Float32Array(RES * RES);
      splatUpTo(want);
      splatted = want;
    }
    draw(phase);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) draw(0.8);
  });
  fit();
  if (reduce) {
    splatUpTo(crX.length);                    // reduce — 다 찬 단면 지도 한 장
    draw(0.8);
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
