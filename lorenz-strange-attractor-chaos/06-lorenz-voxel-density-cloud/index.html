<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밀도 구름 — 로렌츠 어트랙터 카오스 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lz is-demo" id="lzRoot">
  <p class="lz__hint">
    <span>한 점 대신 수천 점을 동시에 풀어 픽셀의 통과 횟수를 밝기로 더하면 궤적이 안개 같은 밀도 장이 됩니다</span>
  </p>
  <div class="lz__field" role="application" aria-label="밀도 구름 실험판" tabindex="0">
    <canvas class="lz__cv" id="lzCv"></canvas>
  </div>
  <div class="lz__bar">
    <span class="lz__meta">동시 점 2,000 · 오일러 dt 0.016</span>
    <span class="lz__meta lz__meta--dim">canvas · 히스토그램 · 주기 2초</span>
  </div>
</div>
</main>
<script>
// 밀도 구름(06) — 로렌츠 세 식을 통계로 읽는다.
// 2,000개 점을 아주 작은 섭동(±0.01)을 준 같은 시작 영역에서 동시에 적분하고
// 저해상도 히스토그램 버퍼에 방문 횟수를 쌓는다. 매 프레임 버퍼를 감마 램프로
// 뿌리면 날개 내부 구조가 은하처럼 밝아지는 밀도 장이 된다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var NPTS  = 2000;    // 동시 점 수 — 8,000 으로 올리면 안개가 짙어진다(변형 3)
  var DT    = 0.016;   // 오일러 걸음 — 프레임당 2회 적분
  var CYCLE = 2.0;     // 리셋 주기(초) — 설정 초(2s)와 같다
  // ────────────────────────────────────────────────────
  var SIG = 10, RHO = 28, BETA = 8 / 3;

  var root = document.getElementById('lzRoot');
  var cvEl = document.getElementById('lzCv');
  if (!root || !cvEl) return;
  var fieldEl = cvEl.parentElement;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var CL     = tokRGB('--lz-cl');    // 밀도 낮은 쪽 — 얼음 파스텔
  var CH2    = tokRGB('--lz-ch');    // 밀도 높은 쪽 — 복숭아 파스텔
  var PANEL  = tokRGB('--lz-panel');
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

  var RES = 150;                     // 히스토그램 해상도(정사각)
  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0;
  var hist = new Float32Array(RES * RES);
  var px = new Float32Array(NPTS), py = new Float32Array(NPTS), pz = new Float32Array(NPTS);

  function fit() {
    var r = fieldEl.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = W; cvEl.height = H;
  }

  // 결정론 난수 — 리셋마다 같은 시작 뭉치가 되게 하는 시드 고정
  function rng(seed) {
    var t = seed;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  var rand = rng(42);
  function seedPoints() {
    var i;
    for (i = 0; i < NPTS; i++) {
      px[i] = 0.6 + (rand() - 0.5) * 0.02;
      py[i] = 0.7 + (rand() - 0.5) * 0.02;
      pz[i] = 21 + (rand() - 0.5) * 0.02;
    }
  }

  // 오일러 적분 — 프레임당 2걸음씩 진행
  function stepAll() {
    var i, k, dx, dy, dz;
    for (k = 0; k < 2; k++) {
      for (i = 0; i < NPTS; i++) {
        var x = px[i], y = py[i], z = pz[i];
        dx = SIG * (y - x); dy = x * (RHO - z) - y; dz = x * y - BETA * z;
        px[i] = x + dx * DT; py[i] = y + dy * DT; pz[i] = z + dz * DT;
      }
    }
  }

  // 히스토그램 버퍼에 방문 누적 — xz 투영
  function accumulate() {
    var i, gx, gy;
    for (i = 0; i < NPTS; i++) {
      gx = (px[i] / 22 + 0.5) * (RES - 1);
      gy = (1 - (pz[i] - 1) / 47) * (RES - 1);
      if (gx >= 0 && gx < RES && gy >= 0 && gy < RES) {
        hist[(gy | 0) * RES + (gx | 0)] += 1;
      }
    }
  }

  // 버퍼 → 화면 — 감마 램프로 낮은 밀도도 살리고 최대 밀도를 복숭아로
  function blit(fade) {
    var maxA = 0, i;
    for (i = 0; i < hist.length; i++) if (hist[i] > maxA) maxA = hist[i];
    if (maxA <= 0) maxA = 1;

    var ctx2 = cvEl.getContext('2d');
    ctx2.fillStyle = 'rgb(' + PANEL[0] + ',' + PANEL[1] + ',' + PANEL[2] + ')';
    ctx2.fillRect(0, 0, W, H);
    var side = Math.min(W, H) * 0.94;
    var ox = (W - side) / 2, oy = (H - side) / 2;
    var cell = side / RES;
    ctx2.save();
    ctx2.translate(ox, oy);
    var j, k2, v, g, col, alpha;
    for (j = 0; j < RES; j++) {
      for (k2 = 0; k2 < RES; k2++) {
        v = hist[j * RES + k2];
        if (v <= 0) continue;
        g = Math.pow(v / maxA, 0.38);
        col = mix(CL, CH2, g);
        alpha = Math.min(1, 0.10 + g * 0.85) * fade;
        ctx2.fillStyle = 'rgba(' + (col[0] | 0) + ',' + (col[1] | 0) + ',' + (col[2] | 0) + ',' + alpha + ')';
        ctx2.fillRect(k2 * cell, j * cell, cell + 0.5, cell + 0.5);
      }
    }
    ctx2.restore();
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1;
  function frame(now) {
    if (t0 < 0) t0 = now;
    var phase = (((now - t0) / 1000) % CYCLE) / CYCLE;
    if (phase < 0.02 && hist[0] + hist[RES * RES - 1] >= 0 && (now - t0) > 60 && phaseResetDone === false) {
      hist = new Float32Array(RES * RES);
      seedPoints();
      phaseResetDone = true;
    }
    if (phase > 0.05) phaseResetDone = false;
    stepAll();
    accumulate();
    var fade = phase > 0.9 ? Math.max(0, 1 - (phase - 0.9) / 0.1) : 1;
    blit(fade);
    requestAnimationFrame(frame);
  }
  var phaseResetDone = false;

  window.addEventListener('resize', function () {
    fit();
    if (reduce) blit(1);
  });
  fit();
  seedPoints();
  if (reduce) {
    var i;
    for (i = 0; i < 90; i++) { stepAll(); accumulate(); }  // reduce — 쌓인 한 장
    blit(1);
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
