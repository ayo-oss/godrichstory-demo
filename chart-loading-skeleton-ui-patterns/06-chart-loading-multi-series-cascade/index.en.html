<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart Loading Whose Series Draw In With Damped Cascading Delay — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cm is-demo" id="cm">
  <svg class="cm__svg" id="cmSvg" viewBox="0 0 200 100" role="img" aria-label="Three-series trend chart" aria-busy="true">
    <line class="cm__axis" x1="4" y1="92" x2="196" y2="92" />
    <path class="cm__flat" d="M4,60 L196,60" />
    <path class="cm__series" id="cmSeries0" data-i="0" d="M4,70 L44,52 L84,64 L124,34 L164,46 L196,26" />
    <path class="cm__series" id="cmSeries1" data-i="1" d="M4,50 L44,66 L84,40 L124,58 L164,30 L196,44" />
    <path class="cm__series" id="cmSeries2" data-i="2" d="M4,30 L44,38 L84,20 L124,42 L164,18 L196,32" />
  </svg>
  <button type="button" class="cm__reload" id="cmReload">Reload chart</button>
</div>
<script>
(function () {
  var STEP_MS = 220;
  var DAMPING = 0.55;
  var root = document.getElementById('cm');
  var reload = document.getElementById('cmReload');
  var series = [0, 1, 2].map(function (i) { return document.getElementById('cmSeries' + i); });

  // 계산 겹: 계열 지연을 감쇠(등비) 누적으로 계산한다 — 뒤 계열일수록 늘어나는 간격이 줄어들며 안정된다
  function seriesDelay(i) {
    var total = 0;
    for (var k = 1; k <= i; k += 1) { total += STEP_MS * Math.pow(DAMPING, k - 1); }
    return Math.round(total);
  }

  series.forEach(function (path, i) {
    var len = Math.round(path.getTotalLength());
    path.style.setProperty('--len', String(len));
    path.style.strokeDasharray = String(len);
    path.style.strokeDashoffset = String(len);
    path.style.animationDelay = seriesDelay(i) + 'ms';
  });

  function human() {
    root.classList.remove('is-demo');
    root.querySelector('#cmSvg').setAttribute('aria-busy', 'true');
    var lastDelay = 0;
    series.forEach(function (path, i) {
      var len = parseInt(path.style.getPropertyValue('--len'), 10);
      path.getAnimations().forEach(function (a) { a.cancel(); });
      path.style.animation = 'none';
      path.style.strokeDashoffset = String(len);
      var delayMs = seriesDelay(i);
      lastDelay = delayMs;
      window.setTimeout(function () {
        path.animate(
          [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
          { duration: 420, easing: 'ease-out', fill: 'forwards' }
        );
      }, 200 + delayMs);
    });
    window.setTimeout(function () { root.querySelector('#cmSvg').setAttribute('aria-busy', 'false'); }, 200 + lastDelay + 500);
  }

  reload.addEventListener('click', human);
  reload.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); }
  });
}());
</script>
</main>
</body>
</html>
