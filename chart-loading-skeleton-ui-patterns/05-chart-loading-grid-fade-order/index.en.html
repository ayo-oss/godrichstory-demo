<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Chart Loading Whose Cell Order Is Computed — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cg is-demo" id="cg" role="img" aria-label="Quarterly metrics grid" aria-busy="true">
  <div class="cg__cell" data-row="0" data-col="0"><div class="cg__sk"></div><div class="cg__real" data-v="A"></div></div>
  <div class="cg__cell" data-row="0" data-col="1"><div class="cg__sk"></div><div class="cg__real" data-v="B"></div></div>
  <div class="cg__cell" data-row="0" data-col="2"><div class="cg__sk"></div><div class="cg__real" data-v="C"></div></div>
  <div class="cg__cell" data-row="0" data-col="3"><div class="cg__sk"></div><div class="cg__real" data-v="D"></div></div>
  <div class="cg__cell" data-row="1" data-col="0"><div class="cg__sk"></div><div class="cg__real" data-v="E"></div></div>
  <div class="cg__cell" data-row="1" data-col="1"><div class="cg__sk"></div><div class="cg__real" data-v="F"></div></div>
  <div class="cg__cell" data-row="1" data-col="2"><div class="cg__sk"></div><div class="cg__real" data-v="G"></div></div>
  <div class="cg__cell" data-row="1" data-col="3"><div class="cg__sk"></div><div class="cg__real" data-v="H"></div></div>
  <div class="cg__cell" data-row="2" data-col="0"><div class="cg__sk"></div><div class="cg__real" data-v="I"></div></div>
  <div class="cg__cell" data-row="2" data-col="1"><div class="cg__sk"></div><div class="cg__real" data-v="J"></div></div>
  <div class="cg__cell" data-row="2" data-col="2"><div class="cg__sk"></div><div class="cg__real" data-v="K"></div></div>
  <div class="cg__cell" data-row="2" data-col="3"><div class="cg__sk"></div><div class="cg__real" data-v="L"></div></div>
</div>
<button type="button" class="cg__reload" id="cgReload">Reload grid</button>
</main>
<script>
(function () {
  var STEP_MS = 55;
  var grid = document.getElementById('cg');
  var reload = document.getElementById('cgReload');
  var cells = Array.prototype.slice.call(grid.querySelectorAll('.cg__cell'));

  // 계산 겹: 칸의 (행+열) 대각 거리로 순서를 매긴다 — 왼쪽 위부터 대각선으로 번져 나간다
  function cellOrder(row, col) { return row + col; }

  cells.forEach(function (cell) {
    var row = Number(cell.getAttribute('data-row'));
    var col = Number(cell.getAttribute('data-col'));
    var delay = cellOrder(row, col) * STEP_MS;
    cell.style.setProperty('--delay', delay + 'ms');
  });

  function human() {
    grid.classList.remove('is-demo');
    grid.setAttribute('aria-busy', 'true');
    cells.forEach(function (cell) {
      var sk = cell.querySelector('.cg__sk');
      var real = cell.querySelector('.cg__real');
      sk.style.transition = 'none';
      real.style.transition = 'none';
      sk.style.opacity = '1';
      real.style.opacity = '0';
      real.style.transform = 'scale(.92)';
    });
    var row = 0, col = 0, maxOrder = 0;
    cells.forEach(function (cell) {
      row = Number(cell.getAttribute('data-row'));
      col = Number(cell.getAttribute('data-col'));
      var order = cellOrder(row, col);
      if (order > maxOrder) { maxOrder = order; }
      var delayMs = order * STEP_MS;
      window.setTimeout(function () {
        var sk = cell.querySelector('.cg__sk');
        var real = cell.querySelector('.cg__real');
        sk.style.transition = 'opacity 220ms ease-out';
        real.style.transition = 'opacity 220ms ease-out, transform 220ms ease-out';
        sk.style.opacity = '0';
        real.style.opacity = '1';
        real.style.transform = 'scale(1)';
      }, 200 + delayMs);
    });
    window.setTimeout(function () { grid.setAttribute('aria-busy', 'false'); }, 200 + maxOrder * STEP_MS + 260);
  }

  reload.addEventListener('click', human);
  reload.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); }
  });
}());
</script>
</body>
</html>
