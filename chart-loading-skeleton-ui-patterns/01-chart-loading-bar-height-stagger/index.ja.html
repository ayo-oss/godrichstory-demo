<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遅延が棒ごとに計算されるバーチャートのロード用スケルトン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cb is-demo" id="cb">
  <div class="cb__chart" id="cbChart" role="img" aria-label="月次訪問者数の棒グラフ" aria-busy="true">
    <div class="cb__col" data-i="0"><div class="cb__bar" id="cbBar0"></div></div>
    <div class="cb__col" data-i="1"><div class="cb__bar" id="cbBar1"></div></div>
    <div class="cb__col" data-i="2"><div class="cb__bar" id="cbBar2"></div></div>
    <div class="cb__col" data-i="3"><div class="cb__bar" id="cbBar3"></div></div>
    <div class="cb__col" data-i="4"><div class="cb__bar" id="cbBar4"></div></div>
    <div class="cb__col" data-i="5"><div class="cb__bar" id="cbBar5"></div></div>
  </div>
  <button type="button" class="cb__reload" id="cbReload">再読み込み</button>
</div>
<script>
(function () {
  var VALUES = [38, 82, 55, 96, 29, 68];
  var STAGGER_MS = 70;
  var SKELETON_SCALE = 0.16;
  var root = document.getElementById('cb');
  var chart = document.getElementById('cbChart');
  var reload = document.getElementById('cbReload');
  var bars = VALUES.map(function (v, i) { return document.getElementById('cbBar' + i); });

  // 계산 겹: 막대 등장 지연을 열 번호(i)로 계산한다 — 열이 오른쪽일수록 늦게 실제 높이로 펴진다
  function barDelay(i) { return i * STAGGER_MS; }

  bars.forEach(function (bar, i) {
    bar.style.setProperty('--real', String(VALUES[i] / 100));
    bar.style.setProperty('--phase', barDelay(i) + 'ms');
  });

  function paintNow(i, value) {
    bars[i].style.transform = 'scaleY(' + (value / 100) + ')';
    bars[i].style.opacity = '1';
  }
  function skeletonNow(i) {
    bars[i].style.transform = 'scaleY(' + SKELETON_SCALE + ')';
    bars[i].style.opacity = '.32';
  }

  function human() {
    root.classList.remove('is-demo');
    bars.forEach(function (bar, i) { skeletonNow(i); });
    chart.setAttribute('aria-busy', 'true');
    bars.forEach(function (bar, i) {
      window.setTimeout(function () { paintNow(i, VALUES[i]); }, 260 + barDelay(i));
    });
    window.setTimeout(function () { chart.setAttribute('aria-busy', 'false'); }, 260 + barDelay(VALUES.length - 1) + 200);
  }

  reload.addEventListener('click', human);
  reload.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); }
  });
}());
</script>
</main>
</body>
</html>
