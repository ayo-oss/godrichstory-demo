<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待機リングが実際の区間に変わるドーナツチャートのロード — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cd is-demo" id="cd">
  <svg class="cd__svg" id="cdSvg" viewBox="0 0 120 120" role="img" aria-label="達成率のドーナツグラフ" aria-busy="true">
    <circle class="cd__track" cx="60" cy="60" r="45" />
    <circle class="cd__spin" cx="60" cy="60" r="45" />
    <circle class="cd__seg" id="cdSeg0" cx="60" cy="60" r="45" data-i="0" />
    <circle class="cd__seg" id="cdSeg1" cx="60" cy="60" r="45" data-i="1" />
    <circle class="cd__seg" id="cdSeg2" cx="60" cy="60" r="45" data-i="2" />
    <circle class="cd__seg" id="cdSeg3" cx="60" cy="60" r="45" data-i="3" />
  </svg>
  <button type="button" class="cd__reload" id="cdReload">達成率を再集計</button>
</div>
<script>
(function () {
  var VALUES = [35, 25, 22, 18];
  var R = 45;
  var CIRC = 2 * Math.PI * R;
  var root = document.getElementById('cd');
  var svg = document.getElementById('cdSvg');
  var reload = document.getElementById('cdReload');
  var segs = [0, 1, 2, 3].map(function (i) { return document.getElementById('cdSeg' + i); });

  // 계산 겹: 각 구간의 비율을 원둘레 길이로 바꾸고, 시작 각도(누적 비율)로 순서를 정한다
  function layout() {
    var cum = 0;
    VALUES.forEach(function (v, i) {
      var frac = v / 100;
      var segLen = CIRC * frac;
      segs[i].style.strokeDasharray = segLen.toFixed(2) + ' ' + (CIRC - segLen).toFixed(2);
      segs[i].style.strokeDashoffset = (-cum).toFixed(2);
      segs[i].style.setProperty('--delay', (cum / CIRC * 60) + '%');
      cum += segLen;
    });
  }
  layout();

  function human() {
    root.classList.remove('is-demo');
    segs.forEach(function (s) { s.style.opacity = '0'; s.style.transform = 'scale(.9)'; });
    svg.setAttribute('aria-busy', 'true');
    var cum = 0;
    VALUES.forEach(function (v, i) {
      var frac = v / 100;
      var delayMs = (cum / CIRC) * 900;
      cum += CIRC * frac;
      window.setTimeout(function () {
        segs[i].style.transition = 'opacity 260ms ease-out, transform 260ms ease-out';
        segs[i].style.opacity = '1';
        segs[i].style.transform = 'scale(1)';
      }, 220 + delayMs);
    });
    window.setTimeout(function () { svg.setAttribute('aria-busy', 'false'); }, 220 + 900);
  }

  reload.addEventListener('click', human);
  reload.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); }
  });
}());
</script>
</main>
</body>
</html>
