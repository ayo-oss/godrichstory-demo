<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平らな線が実際の経路にほどける折れ線チャートのロード — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cl is-demo" id="cl">
  <svg class="cl__svg" id="clSvg" viewBox="0 0 260 110" role="img" aria-label="週間訪問者推移の折れ線グラフ" aria-busy="true">
    <path class="cl__flat" id="clFlat" d="M10,66 L250,66" />
    <path class="cl__real" id="clReal" d="M10,88 L52,50 L94,70 L136,26 L178,54 L220,16 L250,34" />
  </svg>
  <button type="button" class="cl__reload" id="clReload">別の週のデータ</button>
</div>
<script>
(function () {
  var SETS = [
    'M10,88 L52,50 L94,70 L136,26 L178,54 L220,16 L250,34',
    'M10,40 L52,74 L94,30 L136,58 L178,20 L220,48 L250,12'
  ];
  var PX_PER_PCT = 6; // 계산 상수: 길이 6px 마다 그리기 구간 1% 를 배정한다
  var root = document.getElementById('cl');
  var svg = document.getElementById('clSvg');
  var flat = document.getElementById('clFlat');
  var real = document.getElementById('clReal');
  var reload = document.getElementById('clReload');
  var setIndex = 0;
  var styleTag = document.createElement('style');
  document.head.appendChild(styleTag);

  // 계산 겹: 선의 전체 길이(getTotalLength)로 그려지는 데 필요한 구간(%)을 정한다 — 길수록 오래 그려진다
  function drawPercent(len) { return Math.max(20, Math.min(48, Math.round(len / PX_PER_PCT))); }

  function prepare() {
    var len = Math.round(real.getTotalLength());
    var pct = drawPercent(len);
    real.style.strokeDasharray = String(len);
    real.style.strokeDashoffset = String(len);
    styleTag.textContent =
      '@keyframes clDraw {' +
      '0%{stroke-dashoffset:' + len + ';}' +
      '14%{stroke-dashoffset:' + len + ';}' +
      pct + '%{stroke-dashoffset:0;}' +
      '86%{stroke-dashoffset:0;}' +
      '100%{stroke-dashoffset:' + len + ';}}';
    real.style.animation = 'clDraw 2000ms ease-in-out infinite';
    return { len: len, pct: pct };
  }

  var info = prepare();

  function human() {
    root.classList.remove('is-demo');
    setIndex = (setIndex + 1) % SETS.length;
    real.setAttribute('d', SETS[setIndex]);
    real.getAnimations().forEach(function (a) { a.cancel(); });
    var meta = prepare();
    real.style.animation = 'none';
    svg.setAttribute('aria-busy', 'true');
    real.animate(
      [{ strokeDashoffset: meta.len }, { strokeDashoffset: 0 }],
      { duration: 260 + meta.len * 4, easing: 'ease-in-out', fill: 'forwards' }
    ).finished.then(function () { svg.setAttribute('aria-busy', 'false'); });
  }

  reload.addEventListener('click', human);
  reload.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); }
  });

  // 실제 브라우저 재생에서는 주기마다 aria-busy 를 실제로 오르내린다 (렌더 캡처는 실시간을 다 안 쓴다)
  window.setInterval(function () {
    if (!root.classList.contains('is-demo')) return;
    svg.setAttribute('aria-busy', 'true');
    window.setTimeout(function () { svg.setAttribute('aria-busy', 'false'); }, 300);
  }, 2000);
}());
</script>
</main>
</body>
</html>
