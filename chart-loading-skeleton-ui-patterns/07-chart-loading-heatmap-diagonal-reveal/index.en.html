<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heatmap Loading Whose Cells Fill in a Diagonal Wave — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ch is-demo" id="ch" role="img" aria-label="Activity-by-weekday heatmap" aria-busy="true"></div>
<button type="button" class="ch__reload" id="chReload">Reload heatmap</button>
<script>
(function () {
  var COLS = 4;
  var ROWS = 4;
  var WAVE_SPEED = 6; // 칸 단위 / 초 — 값이 클수록 파동이 격자를 빨리 훑는다
  var VALUES = [
    12, 38, 61, 90,
    27, 55, 82, 34,
    70, 20, 46, 65,
    88, 63, 18, 41
  ];
  var grid = document.getElementById('ch');
  var reload = document.getElementById('chReload');
  var cells = [];

  function bucket(v) { return Math.min(3, Math.floor(v / 25)); }

  // 계산 겹: 오른쪽 위 모서리를 파원으로 두고 유클리드 거리를 파동 속도로 나눠 지연을 구한다
  function waveDelayMs(row, col) {
    var dx = (COLS - 1 - col);
    var dy = row;
    var distance = Math.sqrt(dx * dx + dy * dy);
    return Math.round((distance / WAVE_SPEED) * 1000);
  }

  for (var r = 0; r < ROWS; r += 1) {
    for (var c = 0; c < COLS; c += 1) {
      var idx = r * COLS + c;
      var cell = document.createElement('div');
      cell.className = 'ch__cell';
      cell.setAttribute('data-row', String(r));
      cell.setAttribute('data-col', String(c));
      var sk = document.createElement('div');
      sk.className = 'ch__sk';
      var real = document.createElement('div');
      real.className = 'ch__real ch__real--b' + bucket(VALUES[idx]);
      cell.appendChild(sk);
      cell.appendChild(real);
      grid.appendChild(cell);
      cells.push(cell);
      var delay = waveDelayMs(r, c);
      sk.style.animationDelay = delay + 'ms';
      real.style.animationDelay = delay + 'ms';
    }
  }

  function human() {
    grid.classList.remove('is-demo');
    grid.setAttribute('aria-busy', 'true');
    var maxDelay = 0;
    cells.forEach(function (cell) {
      var sk = cell.querySelector('.ch__sk');
      var real = cell.querySelector('.ch__real');
      sk.getAnimations().forEach(function (a) { a.cancel(); });
      real.getAnimations().forEach(function (a) { a.cancel(); });
      sk.style.animation = 'none';
      real.style.animation = 'none';
      sk.style.opacity = '1';
      real.style.opacity = '0';
      real.style.transform = 'scale(.9)';
      var row = Number(cell.getAttribute('data-row'));
      var col = Number(cell.getAttribute('data-col'));
      var delay = waveDelayMs(row, col);
      if (delay > maxDelay) { maxDelay = delay; }
      window.setTimeout(function () {
        sk.style.transition = 'opacity 200ms ease-out';
        real.style.transition = 'opacity 200ms ease-out, transform 200ms ease-out';
        sk.style.opacity = '0';
        real.style.opacity = '1';
        real.style.transform = 'scale(1)';
      }, 200 + delay);
    });
    window.setTimeout(function () { grid.setAttribute('aria-busy', 'false'); }, 200 + maxDelay + 260);
  }

  reload.addEventListener('click', human);
  reload.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); }
  });
}());
</script>
</main>
</body>
</html>
