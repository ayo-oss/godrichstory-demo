<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart Loading That Skips Computation and Swaps Instantly Under Reduced Motion — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cr is-demo" id="cr">
  <p class="cr__status" id="crStatus" aria-live="polite">Setting: Normal animation</p>
  <div class="cr__row">
    <div class="cr__col">
      <span class="cr__label">Normal transition</span>
      <div class="cr__chart" role="img" aria-label="Normal transition bar chart" aria-busy="true">
        <div class="cr__bar cr__bar--normal" id="crN0"></div>
        <div class="cr__bar cr__bar--normal" id="crN1"></div>
        <div class="cr__bar cr__bar--normal" id="crN2"></div>
        <div class="cr__bar cr__bar--normal" id="crN3"></div>
      </div>
    </div>
    <div class="cr__col">
      <span class="cr__label">Reduced motion (reference)</span>
      <div class="cr__chart" role="img" aria-label="Reduced motion bar chart" aria-busy="true">
        <div class="cr__bar cr__bar--reduced" id="crR0"></div>
        <div class="cr__bar cr__bar--reduced" id="crR1"></div>
        <div class="cr__bar cr__bar--reduced" id="crR2"></div>
        <div class="cr__bar cr__bar--reduced" id="crR3"></div>
      </div>
    </div>
  </div>
  <button type="button" class="cr__toggle" id="crToggle" aria-pressed="false">Preview accessibility mode</button>
</div>
<script>
(function () {
  var VALUES = [64, 88, 42, 76];
  var STAGGER_MS = 80;
  var root = document.getElementById('cr');
  var status = document.getElementById('crStatus');
  var toggle = document.getElementById('crToggle');
  var normalBars = [0, 1, 2, 3].map(function (i) { return document.getElementById('crN' + i); });
  var reducedBars = [0, 1, 2, 3].map(function (i) { return document.getElementById('crR' + i); });

  // 계산 겹: 같은 공식에 감쇠 계수(reduced)를 곱한다 — 줄인 모션이면 지연이 전부 0 으로 접힌다
  function barDelay(i, reduced) { return reduced ? 0 : i * STAGGER_MS; }

  normalBars.forEach(function (bar, i) {
    bar.style.setProperty('--real', String(VALUES[i] / 100));
    bar.style.setProperty('--phase', barDelay(i, false) + 'ms');
  });
  reducedBars.forEach(function (bar, i) {
    bar.style.setProperty('--real', String(VALUES[i] / 100));
    bar.style.setProperty('--phase', barDelay(i, true) + 'ms');
  });

  // 실사용 경로: 브라우저의 실제 설정을 읽는다(시뮬레이션이 아니다)
  var mql = window.matchMedia('(prefers-reduced-motion: reduce)');

  function updateStatus() {
    var real = mql.matches;
    var sim = root.classList.contains('cr--reduced-sim');
    var forced = real || sim;
    root.classList.toggle('cr--force-instant', forced);
    if (real) {
      status.textContent = 'Setting: Your browser has reduced motion turned on';
    } else if (sim) {
      status.textContent = 'Setting: Previewing accessibility mode (simulated)';
    } else {
      status.textContent = 'Setting: Normal animation';
    }
  }

  if (mql.addEventListener) {
    mql.addEventListener('change', updateStatus);
  } else if (mql.addListener) {
    mql.addListener(updateStatus);
  }
  updateStatus();

  // 데모용 시뮬레이션 토글: 실제 OS 설정을 바꾸지 않고도 차이를 미리 보여준다
  function human() {
    root.classList.remove('is-demo');
    var next = !root.classList.contains('cr--reduced-sim');
    root.classList.toggle('cr--reduced-sim', next);
    toggle.setAttribute('aria-pressed', String(next));
    updateStatus();
  }

  toggle.addEventListener('click', human);
  toggle.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); }
  });
}());
</script>
</main>
</body>
</html>
