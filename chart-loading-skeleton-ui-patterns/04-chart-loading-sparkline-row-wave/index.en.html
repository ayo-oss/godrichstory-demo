<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkline Loading Whose Rows Pulse in a Wave — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<ul class="cw is-demo" id="cw" aria-busy="true">
  <li class="cw__row" data-i="0">
    <span class="cw__label">Stock A</span>
    <svg class="cw__spark" viewBox="0 0 100 28" role="img" aria-label="Stock A trend">
      <path class="cw__flat" d="M4,14 L96,14" />
      <path class="cw__real" id="cwReal0" d="M4,22 L26,16 L48,20 L70,8 L96,12" />
    </svg>
  </li>
  <li class="cw__row" data-i="1">
    <span class="cw__label">Stock B</span>
    <svg class="cw__spark" viewBox="0 0 100 28" role="img" aria-label="Stock B trend">
      <path class="cw__flat" d="M4,14 L96,14" />
      <path class="cw__real" id="cwReal1" d="M4,10 L26,18 L48,6 L70,16 L96,4" />
    </svg>
  </li>
  <li class="cw__row" data-i="2">
    <span class="cw__label">Stock C</span>
    <svg class="cw__spark" viewBox="0 0 100 28" role="img" aria-label="Stock C trend">
      <path class="cw__flat" d="M4,14 L96,14" />
      <path class="cw__real" id="cwReal2" d="M4,6 L26,12 L48,10 L70,20 L96,18" />
    </svg>
  </li>
  <li class="cw__row" data-i="3">
    <span class="cw__label">Stock D</span>
    <svg class="cw__spark" viewBox="0 0 100 28" role="img" aria-label="Stock D trend">
      <path class="cw__flat" d="M4,14 L96,14" />
      <path class="cw__real" id="cwReal3" d="M4,20 L26,8 L48,14 L70,10 L96,22" />
    </svg>
  </li>
</ul>
<script>
(function () {
  var ROW_WAVE_MS = 90;
  var list = document.getElementById('cw');
  var reals = [0, 1, 2, 3].map(function (i) { return document.getElementById('cwReal' + i); });

  // 계산 겹: 행 번호(i)로 물결 지연을 계산한다 — 위에서 아래로 갈수록 늦게 실제 선이 드러난다
  function rowDelay(i) { return i * ROW_WAVE_MS; }

  reals.forEach(function (real, i) {
    var len = Math.round(real.getTotalLength());
    var row = real.closest('.cw__row');
    var flat = row.querySelector('.cw__flat');
    real.style.setProperty('--len', String(len));
    real.style.strokeDasharray = String(len);
    real.style.strokeDashoffset = String(len);
    real.style.animationDelay = rowDelay(i) + 'ms';
    flat.style.animationDelay = rowDelay(i) + 'ms';
    row.style.animationDelay = rowDelay(i) + 'ms';
  });

  function human() {
    list.classList.remove('is-demo');
    list.setAttribute('aria-busy', 'true');
    reals.forEach(function (real, i) {
      var len = parseInt(real.style.getPropertyValue('--len'), 10);
      real.getAnimations().forEach(function (a) { a.cancel(); });
      real.style.animation = 'none';
      real.style.strokeDashoffset = String(len);
      window.setTimeout(function () {
        real.animate(
          [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
          { duration: 340, easing: 'ease-out', fill: 'forwards' }
        );
      }, rowDelay(i));
    });
    window.setTimeout(function () { list.setAttribute('aria-busy', 'false'); }, rowDelay(reals.length - 1) + 400);
  }

  list.addEventListener('click', human);
  list.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); }
  });
  list.setAttribute('tabindex', '0');
  list.setAttribute('role', 'button');
  list.setAttribute('aria-label', 'Reload sparklines');
}());
</script>
</main>
</body>
</html>
