<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-path panel wiped from the clicked-point ratio — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cw is-demo" id="cw">
  <div class="cw__tabs" id="cwTabs" role="tablist" aria-label="Plan tabs">
    <button type="button" class="cw__tab is-active" role="tab" id="cw-tab-0" aria-selected="true" aria-controls="cw-panel-0" data-idx="0">Basic</button>
    <button type="button" class="cw__tab" role="tab" id="cw-tab-1" aria-selected="false" aria-controls="cw-panel-1" data-idx="1" tabindex="-1">Standard</button>
    <button type="button" class="cw__tab" role="tab" id="cw-tab-2" aria-selected="false" aria-controls="cw-panel-2" data-idx="2" tabindex="-1">Pro</button>
  </div>
  <div class="cw__wrap" id="cwWrap">
    <div class="cw__panel is-visible" id="cw-panel-0" role="tabpanel" aria-labelledby="cw-tab-0" tabindex="0">
      <span class="cw__num">9,900</span><p class="cw__line">For personal projects</p>
    </div>
    <div class="cw__panel" id="cw-panel-1" role="tabpanel" aria-labelledby="cw-tab-1" tabindex="0" hidden>
      <span class="cw__num">29,900</span><p class="cw__line">For small teams</p>
    </div>
    <div class="cw__panel" id="cw-panel-2" role="tabpanel" aria-labelledby="cw-tab-2" tabindex="0" hidden>
      <span class="cw__num">79,900</span><p class="cw__line">All features</p>
    </div>
  </div>
  <p class="cw__meta">Wipe start point <b id="cwR">0</b>%</p>
</div>
<script>
(function () {
  var HOLD_MS = 720; // 전환(css $dur-enter) 뒤 자동 순환이 머무는 시간
  var COUNT = 3;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('cw');
  var tabsBar = document.getElementById('cwTabs');
  var wrap = document.getElementById('cwWrap');
  var rEl = document.getElementById('cwR');
  var tabs = [0, 1, 2].map(function (i) { return document.getElementById('cw-tab-' + i); });
  var panels = [0, 1, 2].map(function (i) { return document.getElementById('cw-panel-' + i); });

  var isDemo = true;
  var active = 0;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function select(idx, originX) {
    if (idx === active) return;
    var barRect = tabsBar.getBoundingClientRect();
    var x = (typeof originX === 'number') ? originX : (tabs[idx].getBoundingClientRect().left + tabs[idx].getBoundingClientRect().width / 2);
    var r = barRect.width > 0 ? Math.min(1, Math.max(0, (x - barRect.left) / barRect.width)) : 0.5; // 계산 겹: 클릭 x 좌표 → 탭바 폭 대비 비율(0~1)
    var pct = (r * 100).toFixed(1) + '%';

    tabs[active].classList.remove('is-active');
    tabs[active].setAttribute('aria-selected', 'false');
    tabs[active].setAttribute('tabindex', '-1');
    panels[active].classList.remove('is-visible');
    panels[active].setAttribute('hidden', '');

    var next = panels[idx];
    next.style.transition = 'none';
    next.style.clipPath = 'inset(0 calc(100% - ' + pct + ') 0 ' + pct + ')'; // 계산 겹: 비율 지점에서 폭 0 인 슬릿으로 시작
    next.removeAttribute('hidden');
    next.getBoundingClientRect();
    next.style.transition = '';
    requestAnimationFrame(function () {
      next.style.clipPath = 'inset(0 0 0 0)'; // 다음 프레임에 전체 노출로 전환 → transition 이 닦아내는 모양을 그린다
      next.classList.add('is-visible');
    });

    tabs[idx].classList.add('is-active');
    tabs[idx].setAttribute('aria-selected', 'true');
    tabs[idx].setAttribute('tabindex', '0');

    rEl.textContent = (r * 100).toFixed(0);
    active = idx;
  }

  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () {
      human();
      var rect = t.getBoundingClientRect();
      select(i, rect.left + rect.width / 2);
    });
  });

  root.addEventListener('keydown', function (e) {
    var idx = tabs.indexOf(document.activeElement);
    if (idx === -1) return;
    var next = null;
    if (e.key === 'ArrowRight') next = (idx + 1) % COUNT;
    else if (e.key === 'ArrowLeft') next = (idx - 1 + COUNT) % COUNT;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = COUNT - 1;
    if (next === null) return;
    e.preventDefault();
    human();
    tabs[next].focus({ preventScroll: true });
    var rect = tabs[next].getBoundingClientRect();
    select(next, rect.left + rect.width / 2);
  });

  function loop() {
    if (!isDemo) return;
    var next = (active + 1) % COUNT;
    var rect = tabs[next].getBoundingClientRect();
    select(next, rect.left + rect.width / 2);
    window.setTimeout(loop, HOLD_MS);
  }

  if (!reduce) {
    window.setTimeout(loop, HOLD_MS);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</main>
</body>
</html>
