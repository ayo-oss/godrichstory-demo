<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radial mask transition panel that spreads from the tab coordinate — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mr is-demo" id="mr">
  <div class="mr__tabs" role="tablist" aria-label="Feature tabs">
    <button type="button" class="mr__tab is-active" role="tab" id="mr-tab-0" aria-selected="true" aria-controls="mr-panel-0" data-idx="0">Speed</button>
    <button type="button" class="mr__tab" role="tab" id="mr-tab-1" aria-selected="false" aria-controls="mr-panel-1" data-idx="1" tabindex="-1">Security</button>
    <button type="button" class="mr__tab" role="tab" id="mr-tab-2" aria-selected="false" aria-controls="mr-panel-2" data-idx="2" tabindex="-1">Collaboration</button>
  </div>
  <div class="mr__wrap" id="mrWrap">
    <div class="mr__panel is-active" id="mr-panel-0" role="tabpanel" aria-labelledby="mr-tab-0" tabindex="0"><span class="mr__num">01</span><p class="mr__line">Response speed 120ms</p></div>
    <div class="mr__panel" id="mr-panel-1" role="tabpanel" aria-labelledby="mr-tab-1" tabindex="0" hidden><span class="mr__num">02</span><p class="mr__line">Two-factor authentication support</p></div>
    <div class="mr__panel" id="mr-panel-2" role="tabpanel" aria-labelledby="mr-tab-2" tabindex="0" hidden><span class="mr__num">03</span><p class="mr__line">Real-time collaborative editing</p></div>
  </div>
  <p class="mr__meta">Radius <b id="mrR">0</b>px</p>
</div>
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COUNT = 3;
  var HOLD_MS = 900;

  var root = document.getElementById('mr');
  var wrap = document.getElementById('mrWrap');
  var rEl = document.getElementById('mrR');
  var tabs = [0, 1, 2].map(function (i) { return document.getElementById('mr-tab-' + i); });
  var panels = [0, 1, 2].map(function (i) { return document.getElementById('mr-panel-' + i); });

  var isDemo = true;
  var active = 0;
  var busy = false;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function select(idx) {
    if (idx === active || busy) return;
    busy = true;
    var tabRect = tabs[idx].getBoundingClientRect();
    var wrapRect = wrap.getBoundingClientRect();
    var cx = tabRect.left + tabRect.width / 2 - wrapRect.left; // 계산 겹: 탭 라벨 중심 좌표 → 마스크 중심
    var cy = tabRect.top + tabRect.height / 2 - wrapRect.top;
    var r = Math.hypot(wrapRect.width, wrapRect.height); // 계산 겹: 패널 대각선 길이 = Radius 목표값

    var incoming = panels[idx];
    var outgoing = panels[active];

    incoming.style.transition = 'none';
    incoming.style.clipPath = 'circle(0px at ' + cx.toFixed(1) + 'px ' + cy.toFixed(1) + 'px)';
    incoming.removeAttribute('hidden');
    incoming.classList.add('is-front');
    incoming.getBoundingClientRect();
    incoming.style.transition = '';
    rEl.textContent = '0';

    tabs[active].classList.remove('is-active');
    tabs[active].setAttribute('aria-selected', 'false');
    tabs[active].setAttribute('tabindex', '-1');
    tabs[idx].classList.add('is-active');
    tabs[idx].setAttribute('aria-selected', 'true');
    tabs[idx].setAttribute('tabindex', '0');

    requestAnimationFrame(function () {
      incoming.style.clipPath = 'circle(' + r.toFixed(1) + 'px at ' + cx.toFixed(1) + 'px ' + cy.toFixed(1) + 'px)';
      rEl.textContent = String(Math.round(r));
    });

    function onEnd(e) {
      if (e.propertyName !== 'clip-path') return;
      incoming.removeEventListener('transitionend', onEnd);
      incoming.classList.add('is-active');
      incoming.classList.remove('is-front');
      incoming.style.clipPath = 'none';
      outgoing.classList.remove('is-active');
      outgoing.setAttribute('hidden', '');
      active = idx;
      busy = false;
    }
    incoming.addEventListener('transitionend', onEnd);
  }

  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { human(); select(i); });
  });

  root.addEventListener('keydown', function (e) {
    var idx = tabs.indexOf(document.activeElement);
    if (idx === -1) return;
    var next = null;
    if (e.key === 'ArrowRight') next = (idx + 1) % COUNT;
    else if (e.key === 'ArrowLeft') next = (idx - 1 + COUNT) % COUNT;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = COUNT - 1;
    if (next === null) return;
    e.preventDefault();
    human();
    tabs[next].focus({ preventScroll: true });
    select(next);
  });

  function loop() {
    if (!isDemo) return;
    select((active + 1) % COUNT);
    window.setTimeout(loop, HOLD_MS);
  }

  if (!reduce) {
    window.setTimeout(loop, HOLD_MS);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</main>
</body>
</html>
