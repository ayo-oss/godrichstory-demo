<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>実測の高さで折りたたまれて広がる縦アコーディオンパネル — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="va is-demo" id="va">
  <div class="va__tabs" role="tablist" aria-label="FAQタブ">
    <button type="button" class="va__tab is-active" role="tab" id="va-tab-0" aria-selected="true" aria-controls="va-panel-0" data-idx="0">配送</button>
    <button type="button" class="va__tab" role="tab" id="va-tab-1" aria-selected="false" aria-controls="va-panel-1" data-idx="1" tabindex="-1">返金</button>
    <button type="button" class="va__tab" role="tab" id="va-tab-2" aria-selected="false" aria-controls="va-panel-2" data-idx="2" tabindex="-1">お問い合わせ</button>
  </div>
  <div class="va__list" id="vaList">
    <div class="va__panel" id="va-panel-0" role="tabpanel" aria-labelledby="va-tab-0" tabindex="0">
      <div class="va__inner">
        <p class="va__q">配送にはどれくらいかかりますか?</p>
        <p class="va__a">注文確認後1〜2営業日以内に出荷され、到着まで平均2〜4日かかります。出荷後は送り状番号をSMSでお知らせします。</p>
      </div>
    </div>
    <div class="va__panel" id="va-panel-1" role="tabpanel" aria-labelledby="va-tab-1" tabindex="0" hidden>
      <div class="va__inner">
        <p class="va__q">返金はどうすればいいですか?</p>
        <p class="va__a">受け取り日から7日以内にお申し込みください。未開封の場合は往復送料なしで全額返金され、開封済みの場合も不良確認後に一部返金が可能です。お申し込み後、処理まで平均3日かかります。</p>
      </div>
    </div>
    <div class="va__panel" id="va-panel-2" role="tabpanel" aria-labelledby="va-tab-2" tabindex="0" hidden>
      <div class="va__inner">
        <p class="va__q">お問い合わせはどこに送ればいいですか?</p>
        <p class="va__a">カスタマーセンターのチャットにご記入ください。平日午前9時から午後6時まで順番に返信します。</p>
      </div>
    </div>
  </div>
  <p class="va__meta">実測の高さ <b id="vaH">0</b>px</p>
</div>
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COUNT = 3;
  var HOLD_MS = 900;

  var root = document.getElementById('va');
  var hEl = document.getElementById('vaH');
  var tabs = [0, 1, 2].map(function (i) { return document.getElementById('va-tab-' + i); });
  var panels = [0, 1, 2].map(function (i) { return document.getElementById('va-panel-' + i); });

  var isDemo = true;
  var active = 0;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function measure(el) {
    return el.firstElementChild.scrollHeight; // 계산 겹: 콘텐츠 実測の高さ(px) — max-height 목표값
  }

  function openPanel(el, instant) {
    el.removeAttribute('hidden');
    var h = measure(el);
    if (instant) { el.style.transition = 'none'; }
    el.style.maxHeight = h + 'px';
    if (instant) { el.getBoundingClientRect(); el.style.transition = ''; }
    hEl.textContent = String(h);
  }

  function onCollapseEnd(e) {
    if (e.propertyName !== 'max-height') return;
    var el = e.currentTarget;
    if (el.style.maxHeight === '0px') el.setAttribute('hidden', '');
  }

  function closePanel(el, instant) {
    if (instant) { el.style.transition = 'none'; }
    el.style.maxHeight = '0px';
    if (instant) { el.getBoundingClientRect(); el.style.transition = ''; el.setAttribute('hidden', ''); }
  }

  function select(idx) {
    if (idx === active) return;
    closePanel(panels[active]);
    openPanel(panels[idx]);
    tabs[active].classList.remove('is-active');
    tabs[active].setAttribute('aria-selected', 'false');
    tabs[active].setAttribute('tabindex', '-1');
    tabs[idx].classList.add('is-active');
    tabs[idx].setAttribute('aria-selected', 'true');
    tabs[idx].setAttribute('tabindex', '0');
    active = idx;
  }

  panels.forEach(function (p) { p.addEventListener('transitionend', onCollapseEnd); });

  // 초기: panel 0 만 실측 높이로 즉시 펼침(전환 억제) — 나머지는 접힌 채 hidden 유지
  openPanel(panels[0], true);

  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { human(); select(i); });
  });

  root.addEventListener('keydown', function (e) {
    var idx = tabs.indexOf(document.activeElement);
    if (idx === -1) return;
    var next = null;
    if (e.key === 'ArrowRight') next = (idx + 1) % COUNT;
    else if (e.key === 'ArrowLeft') next = (idx - 1 + COUNT) % COUNT;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = COUNT - 1;
    if (next === null) return;
    e.preventDefault();
    human();
    tabs[next].focus({ preventScroll: true });
    select(next);
  });

  window.addEventListener('resize', function () {
    // 계산 겹: 폭이 바뀌면 텍스트 줄바꿈이 바뀌어 실측 높이도 바뀐다 — 열린 패널만 재측정해 반영
    var h = measure(panels[active]);
    panels[active].style.maxHeight = h + 'px';
    hEl.textContent = String(h);
  });

  function loop() {
    if (!isDemo) return;
    select((active + 1) % COUNT);
    window.setTimeout(loop, HOLD_MS);
  }

  if (!reduce) {
    window.setTimeout(loop, HOLD_MS);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</main>
</body>
</html>
