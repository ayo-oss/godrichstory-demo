<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진행률 t 가 블러를 맞바꾸는 초점 전환 패널 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bf is-demo" id="bf">
  <div class="bf__tabs" role="tablist" aria-label="카테고리 탭">
    <button type="button" class="bf__tab is-active" role="tab" id="bf-tab-0" aria-selected="true" aria-controls="bf-panel-0" data-idx="0">공지</button>
    <button type="button" class="bf__tab" role="tab" id="bf-tab-1" aria-selected="false" aria-controls="bf-panel-1" data-idx="1" tabindex="-1">리뷰</button>
    <button type="button" class="bf__tab" role="tab" id="bf-tab-2" aria-selected="false" aria-controls="bf-panel-2" data-idx="2" tabindex="-1">기록</button>
  </div>
  <div class="bf__wrap" id="bfWrap">
    <div class="bf__panel is-front" id="bf-panel-0" role="tabpanel" aria-labelledby="bf-tab-0" tabindex="0"><span class="bf__num">03</span><p class="bf__line">이번 주 공지 3건</p></div>
    <div class="bf__panel" id="bf-panel-1" role="tabpanel" aria-labelledby="bf-tab-1" tabindex="0" hidden><span class="bf__num">128</span><p class="bf__line">누적 리뷰 128건</p></div>
    <div class="bf__panel" id="bf-panel-2" role="tabpanel" aria-labelledby="bf-tab-2" tabindex="0" hidden><span class="bf__num">47</span><p class="bf__line">최근 기록 47건</p></div>
  </div>
  <p class="bf__meta">전환 진행률 t=<b id="bfT">0.00</b></p>
</div>
<script>
(function () {
  var BLUR_MAX = 10; // 계산 겹 상수: 진행률 t=1 에서 나가는 패널이 도달하는 최대 블러(px)
  var DUR_MS = 460;
  var HOLD_MS = 760;
  var COUNT = 3;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('bf');
  var tEl = document.getElementById('bfT');
  var tabs = [0, 1, 2].map(function (i) { return document.getElementById('bf-tab-' + i); });
  var panels = [0, 1, 2].map(function (i) { return document.getElementById('bf-panel-' + i); });

  var isDemo = true;
  var active = 0;
  var raf = 0;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function setT(el, t, incoming) {
    // 계산 겹: 나가는 패널은 t 에 비례해 블러·투명도가 늘고, 들어오는 패널은 (1-t) 에 비례해 블러가 준다
    var blur = incoming ? (1 - t) * BLUR_MAX : t * BLUR_MAX;
    var opacity = incoming ? t : 1 - t;
    el.style.filter = 'blur(' + blur.toFixed(2) + 'px)';
    el.style.opacity = String(opacity);
  }

  function select(idx) {
    if (idx === active || raf) return;
    var prevIdx = active;
    var outEl = panels[prevIdx];
    var inEl = panels[idx];

    tabs[prevIdx].classList.remove('is-active');
    tabs[prevIdx].setAttribute('aria-selected', 'false');
    tabs[prevIdx].setAttribute('tabindex', '-1');
    tabs[idx].classList.add('is-active');
    tabs[idx].setAttribute('aria-selected', 'true');
    tabs[idx].setAttribute('tabindex', '0');

    inEl.removeAttribute('hidden');
    inEl.classList.add('is-front');
    setT(outEl, 0, false);
    setT(inEl, 0, true);

    var start = 0;
    function frame(ts) {
      if (!start) start = ts;
      var t = Math.min(1, (ts - start) / DUR_MS); // 계산 겹: 실측 경과시간 / 총 시간 = 진행률 t(0~1)
      setT(outEl, t, false);
      setT(inEl, t, true);
      tEl.textContent = t.toFixed(2);
      if (t < 1) {
        raf = requestAnimationFrame(frame);
      } else {
        raf = 0;
        outEl.setAttribute('hidden', '');
        outEl.classList.remove('is-front');
        active = idx;
      }
    }
    raf = requestAnimationFrame(frame);
  }

  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { human(); select(i); });
  });

  root.addEventListener('keydown', function (e) {
    var idx = tabs.indexOf(document.activeElement);
    if (idx === -1) return;
    var next = null;
    if (e.key === 'ArrowRight') next = (idx + 1) % COUNT;
    else if (e.key === 'ArrowLeft') next = (idx - 1 + COUNT) % COUNT;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = COUNT - 1;
    if (next === null) return;
    e.preventDefault();
    human();
    tabs[next].focus({ preventScroll: true });
    select(next);
  });

  function loop() {
    if (!isDemo) return;
    select((active + 1) % COUNT);
    window.setTimeout(loop, HOLD_MS);
  }

  if (!reduce) {
    window.setTimeout(loop, HOLD_MS);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</main>
</body>
</html>
