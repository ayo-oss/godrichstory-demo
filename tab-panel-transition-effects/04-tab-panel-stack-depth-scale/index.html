<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인덱스 거리가 쌓아 넘기는 스택 패널 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sd is-demo" id="sd">
  <div class="sd__tabs" role="tablist" aria-label="카테고리 탭">
    <button type="button" class="sd__tab is-active" role="tab" id="sd-tab-0" aria-selected="true" aria-controls="sd-panel-0" data-idx="0">풍경</button>
    <button type="button" class="sd__tab" role="tab" id="sd-tab-1" aria-selected="false" aria-controls="sd-panel-1" data-idx="1" tabindex="-1">인물</button>
    <button type="button" class="sd__tab" role="tab" id="sd-tab-2" aria-selected="false" aria-controls="sd-panel-2" data-idx="2" tabindex="-1">정물</button>
  </div>
  <div class="sd__wrap" id="sdWrap">
    <div class="sd__panel" id="sd-panel-0" role="tabpanel" aria-labelledby="sd-tab-0" tabindex="0" style="--d:0"><span class="sd__num">01</span><p class="sd__line">풍경 12장</p></div>
    <div class="sd__panel" id="sd-panel-1" role="tabpanel" aria-labelledby="sd-tab-1" tabindex="0" aria-hidden="true" style="--d:1"><span class="sd__num">02</span><p class="sd__line">인물 8장</p></div>
    <div class="sd__panel" id="sd-panel-2" role="tabpanel" aria-labelledby="sd-tab-2" tabindex="0" aria-hidden="true" style="--d:2"><span class="sd__num">03</span><p class="sd__line">정물 5장</p></div>
  </div>
  <p class="sd__meta">거리 <b id="sdDist">0</b>칸 · scale <b id="sdScale">1.00</b></p>
</div>
<script>
(function () {
  var SCALE_STEP = 0.08; // 계산 겹 상수: 인덱스 거리 1칸마다 scale 이 이만큼 줄어든다
  var HOLD_MS = 780;
  var COUNT = 3;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('sd');
  var distEl = document.getElementById('sdDist');
  var scaleEl = document.getElementById('sdScale');
  var tabs = [0, 1, 2].map(function (i) { return document.getElementById('sd-tab-' + i); });
  var panels = [0, 1, 2].map(function (i) { return document.getElementById('sd-panel-' + i); });

  var isDemo = true;
  var active = 0;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function apply() {
    panels.forEach(function (p, i) {
      var d = Math.abs(i - active); // 계산 겹: 활성 탭과의 정수 인덱스 거리
      p.style.setProperty('--d', String(d));
      p.setAttribute('aria-hidden', d === 0 ? 'false' : 'true');
    });
    var scale = (1 - SCALE_STEP).toFixed(2); // 바로 다음 겹(거리1)의 scale 값을 대표로 표시
    distEl.textContent = '1';
    scaleEl.textContent = scale;
  }

  function select(idx) {
    if (idx === active) return;
    tabs[active].classList.remove('is-active');
    tabs[active].setAttribute('aria-selected', 'false');
    tabs[active].setAttribute('tabindex', '-1');
    tabs[idx].classList.add('is-active');
    tabs[idx].setAttribute('aria-selected', 'true');
    tabs[idx].setAttribute('tabindex', '0');
    active = idx;
    apply();
  }

  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { human(); select(i); });
  });

  root.addEventListener('keydown', function (e) {
    var idx = tabs.indexOf(document.activeElement);
    if (idx === -1) return;
    var next = null;
    if (e.key === 'ArrowRight') next = (idx + 1) % COUNT;
    else if (e.key === 'ArrowLeft') next = (idx - 1 + COUNT) % COUNT;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = COUNT - 1;
    if (next === null) return;
    e.preventDefault();
    human();
    tabs[next].focus({ preventScroll: true });
    select(next);
  });

  function loop() {
    if (!isDemo) return;
    select((active + 1) % COUNT);
    window.setTimeout(loop, HOLD_MS);
  }

  if (!reduce) {
    window.setTimeout(loop, HOLD_MS);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</main>
</body>
</html>
