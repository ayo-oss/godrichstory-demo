<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도형 스냅 드로잉 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ss is-demo" id="ss">
  <div class="ss__card">
    <div class="ss__bar">
      <div class="ss__tools" role="group" aria-label="Shape tools">
        <button type="button" class="ss__tool ss__tool--rect" data-value="rect" aria-pressed="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="ss__ico" aria-hidden="true"><path d="M224,56V200a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V56a8,8,0,0,1,8-8H216A8,8,0,0,1,224,56Z" opacity="0.2"/><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,160H40V56H216V200Z"/></svg>
          <span>Rectangle</span><span class="ss__mark" aria-hidden="true"></span>
        </button>
        <button type="button" class="ss__tool ss__tool--circle" data-value="circle" aria-pressed="false">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="ss__ico" aria-hidden="true"><path d="M224,128a96,96,0,1,1-96-96A96,96,0,0,1,224,128Z" opacity="0.2"/><path d="M96.26,37A8,8,0,0,1,102,27.29a104.11,104.11,0,0,1,52,0,8,8,0,0,1-2,15.75,8.15,8.15,0,0,1-2-.26,88.09,88.09,0,0,0-44,0A8,8,0,0,1,96.26,37ZM53.79,55.14a104,104,0,0,0-26,45,8,8,0,1,0,15.42,4.26,87.91,87.91,0,0,1,22-38.08A8,8,0,0,0,53.79,55.14ZM43.21,151.55a8,8,0,1,0-15.42,4.28,104,104,0,0,0,26,45,8,8,0,1,0,11.41-11.21A88.14,88.14,0,0,1,43.21,151.55ZM150,213.22a88,88,0,0,1-44,0,8,8,0,1,0-4,15.49,104.11,104.11,0,0,0,52,0,8,8,0,0,0-4-15.49ZM222.65,146a8,8,0,0,0-9.85,5.57,87.88,87.88,0,0,1-22,38.09,8,8,0,1,0,11.42,11.21,104.05,104.05,0,0,0,26-45A8,8,0,0,0,222.65,146Zm-9.86-41.54a8,8,0,0,0,15.42-4.28,104,104,0,0,0-26-45,8,8,0,1,0-11.41,11.21A88.14,88.14,0,0,1,212.79,104.45Z"/></svg>
          <span>Circle</span><span class="ss__mark" aria-hidden="true"></span>
        </button>
        <button type="button" class="ss__tool ss__tool--line" data-value="line" aria-pressed="false">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="ss__ico" aria-hidden="true"><path d="M81,175A24,24,0,1,1,47,175,24,24,0,0,1,81,175ZM209,47A24,24,0,1,0,209,81,24,24,0,0,0,209,47Z" opacity="0.2"/><path d="M214.64,41.36a32,32,0,0,0-50.2,38.89L80.25,164.44a32.06,32.06,0,0,0-38.89,4.94h0a32,32,0,1,0,50.2,6.37l84.19-84.19a32,32,0,0,0,38.89-50.2Zm-139.33,162a16,16,0,0,1-22.64-22.64h0a16,16,0,0,1,22.63,0h0A16,16,0,0,1,75.31,203.33Zm128-128a16,16,0,1,1,0-22.63A16,16,0,0,1,203.33,75.3Z"/></svg>
          <span>Line</span><span class="ss__mark" aria-hidden="true"></span>
        </button>
      </div>
      <div class="ss__acts">
        <span class="ss__count"><span class="ss__countReal" id="count" aria-live="polite">0 shapes</span><span class="ss__countDemo ss__countDemo--zero" aria-hidden="true">0 shapes</span><span class="ss__countDemo ss__countDemo--one" aria-hidden="true">1 shape</span><span class="ss__countDemo ss__countDemo--two" aria-hidden="true">2 shapes</span><span class="ss__countDemo ss__countDemo--three" aria-hidden="true">3 shapes</span></span>
        <button type="button" class="ss__btn" id="undoBtn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="ss__ico" aria-hidden="true"><path d="M216,128a88,88,0,1,1-88-88A88,88,0,0,1,216,128Z" opacity="0.2"/><path d="M224,128a96,96,0,0,1-94.71,96H128A95.38,95.38,0,0,1,62.1,197.8a8,8,0,0,1,11-11.63A80,80,0,1,0,71.43,71.39a3.07,3.07,0,0,1-.26.25L44.59,96H72a8,8,0,0,1,0,16H24a8,8,0,0,1-8-8V56a8,8,0,0,1,16,0V85.8L60.25,60A96,96,0,0,1,224,128Z"/></svg>
          <span>Undo shape</span>
        </button>
        <button type="button" class="ss__btn ss__btn--wipe" id="wipeBtn">Clear board</button>
      </div>
    </div>
    <div class="ss__board" id="board">
      <canvas class="ss__ink" id="ink" role="img" aria-label="Shape board, 0 committed shapes"></canvas>
      <svg class="ss__ghost" viewBox="0 0 300 108" aria-hidden="true">
        <path class="ss__draft ss__draft--rect" vector-effect="non-scaling-stroke" d="M24,16 L136,16 L136,68 L24,68 Z"/>
        <path class="ss__firm ss__firm--rect" vector-effect="non-scaling-stroke" d="M24,16 L136,16 L136,68 L24,68 Z"/>
        <path class="ss__draft ss__draft--circle" vector-effect="non-scaling-stroke" d="M238,42 A26,26 0 1 1 186,42 A26,26 0 1 1 238,42"/>
        <path class="ss__firm ss__firm--circle" vector-effect="non-scaling-stroke" d="M238,42 A26,26 0 1 1 186,42 A26,26 0 1 1 238,42"/>
        <path class="ss__draft ss__draft--line" vector-effect="non-scaling-stroke" d="M26,94 L274,80"/>
        <path class="ss__firm ss__firm--line" vector-effect="non-scaling-stroke" d="M26,94 L274,80"/>
      </svg>
    </div>
  </div>
</div>
</main>
<script>
var ss = document.getElementById('ss');
var board = document.getElementById('board');
var ink = document.getElementById('ink');
var count = document.getElementById('count');
var ctx = ink.getContext('2d');
var COUNT_LABEL = '%d shapes';
var BOARD_LABEL = 'Shape board, %d committed shapes';
var SNAP = 8;                       // 판 배경 격자와 같은 눈금 — 끝점이 여기에 달라붙는다
var shapes = [], kind = 'rect', origin = null, draft = null;

// 고DPI 대응 — 배킹 스토어를 devicePixelRatio 배로 키우고 좌표계는 CSS 픽셀 그대로 쓴다
function resize() {
  var r = board.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  ink.width = Math.round(r.width * dpr);
  ink.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  repaint();
}

function trace(s) {
  if (s.kind === 'rect') {
    // strokeRect 는 경로를 따로 열지 않고 Rectangle 테두리를 한 번에 긋는다
    ctx.strokeRect(s.x, s.y, s.w, s.h);
    return;
  }
  ctx.beginPath();
  if (s.kind === 'circle') {
    // arc 는 중심·반지름·시작각·끝각 — 0 에서 2파이까지면 Circle 한 바퀴다
    ctx.arc(s.x + s.w / 2, s.y + s.h / 2, Math.max(Math.abs(s.w), Math.abs(s.h)) / 2, 0, Math.PI * 2);
  } else {
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + s.w, s.y + s.h);
  }
  ctx.stroke();
}

function repaint() {
  // clearRect 로 판을 통째로 비우고 확정된 도형을 다시 그린 뒤, 끌고 있는 도형만 맨 위에 점선으로 얹는다
  ctx.clearRect(0, 0, ink.width, ink.height);
  ctx.lineCap = 'round';
  ctx.lineWidth = 3;
  ctx.setLineDash([]);
  ctx.strokeStyle = '#17141a';
  for (var i = 0; i < shapes.length; i++) { trace(shapes[i]); }
  if (draft) {
    ctx.setLineDash([6, 5]);
    ctx.strokeStyle = '#2f6df6';
    trace(draft);
    ctx.setLineDash([]);
  }
  count.textContent = COUNT_LABEL.replace('%d', shapes.length);
  ink.setAttribute('aria-label', BOARD_LABEL.replace('%d', shapes.length));
}

function toLocal(e) {
  var r = ink.getBoundingClientRect();
  return { x: Math.round((e.clientX - r.left) / SNAP) * SNAP, y: Math.round((e.clientY - r.top) / SNAP) * SNAP };
}

board.addEventListener('pointerdown', function (e) {
  ss.classList.remove('is-demo');
  origin = toLocal(e);
  draft = { kind: kind, x: origin.x, y: origin.y, w: 0, h: 0 };
  board.setPointerCapture(e.pointerId);
  repaint();
});
board.addEventListener('pointermove', function (e) {
  if (!draft) { return; }
  var p = toLocal(e);
  draft.w = p.x - origin.x;
  draft.h = p.y - origin.y;
  repaint();
});
window.addEventListener('pointerup', function () {
  if (draft && (Math.abs(draft.w) >= SNAP || Math.abs(draft.h) >= SNAP)) { shapes.push(draft); }
  draft = null;
  repaint();
});
var tools = document.querySelectorAll('.ss__tool');
for (var t = 0; t < tools.length; t++) {
  tools[t].addEventListener('click', function (e) {
    var btn = e.currentTarget;
    ss.classList.remove('is-demo');
    kind = btn.getAttribute('data-value');
    for (var i = 0; i < tools.length; i++) { tools[i].setAttribute('aria-pressed', String(tools[i] === btn)); }
  });
}
document.getElementById('undoBtn').addEventListener('click', function () { ss.classList.remove('is-demo'); shapes.pop(); repaint(); });
document.getElementById('wipeBtn').addEventListener('click', function () { ss.classList.remove('is-demo'); shapes = []; repaint(); });
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
