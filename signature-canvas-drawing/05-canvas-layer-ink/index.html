<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밑그림·잉크 2레이어 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="li is-demo" id="li">
  <div class="li__card">
    <div class="li__layers">
      <div class="li__row">
        <button type="button" class="li__layer" id="sketchBtn" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="li__ico" aria-hidden="true"><path d="M224,128a96,96,0,1,1-96-96A96,96,0,0,1,224,128Z" opacity="0.2"/><path d="M96.26,37A8,8,0,0,1,102,27.29a104.11,104.11,0,0,1,52,0,8,8,0,0,1-2,15.75,8.15,8.15,0,0,1-2-.26,88.09,88.09,0,0,0-44,0A8,8,0,0,1,96.26,37ZM53.79,55.14a104,104,0,0,0-26,45,8,8,0,1,0,15.42,4.26,87.91,87.91,0,0,1,22-38.08A8,8,0,0,0,53.79,55.14ZM43.21,151.55a8,8,0,1,0-15.42,4.28,104,104,0,0,0,26,45,8,8,0,1,0,11.41-11.21A88.14,88.14,0,0,1,43.21,151.55ZM150,213.22a88,88,0,0,1-44,0,8,8,0,1,0-4,15.49,104.11,104.11,0,0,0,52,0,8,8,0,0,0-4-15.49ZM222.65,146a8,8,0,0,0-9.85,5.57,87.88,87.88,0,0,1-22,38.09,8,8,0,1,0,11.42,11.21,104.05,104.05,0,0,0,26-45A8,8,0,0,0,222.65,146Zm-9.86-41.54a8,8,0,0,0,15.42-4.28,104,104,0,0,0-26-45,8,8,0,1,0-11.41,11.21A88.14,88.14,0,0,1,212.79,104.45Z"/></svg><span>밑그림</span></button>
        <span class="li__slot">
          <input class="li__range" id="fade" type="range" min="0" max="100" value="34" aria-label="밑그림 불투명도">
          <span class="li__fake" aria-hidden="true"><span class="li__fakeFill"></span><span class="li__fakeKnob"></span></span>
        </span>
      </div>
      <div class="li__row">
        <button type="button" class="li__layer" id="inkBtn" aria-pressed="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="li__ico" aria-hidden="true"><path d="M221.66,90.34,192,120,136,64l29.66-29.66a8,8,0,0,1,11.31,0L221.66,79A8,8,0,0,1,221.66,90.34Z" opacity="0.2"/><path d="M227.32,73.37,182.63,28.69a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31l83.67-83.66,3.48,13.9-36.8,36.79a8,8,0,0,0,11.31,11.32l40-40a8,8,0,0,0,2.11-7.6l-6.9-27.61L227.32,96A16,16,0,0,0,227.32,73.37ZM48,208V179.31L76.69,208Zm48-3.31L51.31,160,136,75.31,180.69,120Zm96-96L147.32,64l24-24L216,84.69Z"/></svg><span>잉크</span></button>
        <button type="button" class="li__merge" id="mergeBtn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="li__ico" aria-hidden="true"><path d="M224,80l-96,56L32,80l96-56Z" opacity="0.2"/><path d="M230.91,172A8,8,0,0,1,228,182.91l-96,56a8,8,0,0,1-8.06,0l-96-56A8,8,0,0,1,36,169.09l92,53.65,92-53.65A8,8,0,0,1,230.91,172ZM220,121.09l-92,53.65L36,121.09A8,8,0,0,0,28,134.91l96,56a8,8,0,0,0,8.06,0l96-56A8,8,0,1,0,220,121.09ZM24,80a8,8,0,0,1,4-6.91l96-56a8,8,0,0,1,8.06,0l96,56a8,8,0,0,1,0,13.82l-96,56a8,8,0,0,1-8.06,0l-96-56A8,8,0,0,1,24,80Zm23.88,0L128,126.74,208.12,80,128,33.26Z"/></svg><span>두 장 합치기</span></button>
      </div>
    </div>
    <div class="li__board" id="board">
      <canvas class="li__sketch" id="sketch" role="img" aria-label="밑그림 판"></canvas>
      <canvas class="li__ink" id="ink" role="img" aria-label="잉크 판"></canvas>
      <svg class="li__ghost" viewBox="0 0 300 88" preserveAspectRatio="none" aria-hidden="true">
        <g class="li__guide">
          <path class="li__guideCurve" d="M40,70 C60,18 110,14 130,46 C150,78 190,80 210,54 C226,33 250,26 268,36"/>
          <circle class="li__guideRing" cx="130" cy="46" r="26"/>
          <line class="li__guideBase" x1="36" y1="78" x2="264" y2="78"/>
        </g>
        <path class="li__trace" pathLength="100" d="M40,70 C60,18 110,14 130,46 C150,78 190,80 210,54 C226,33 250,26 268,36"/>
        <line class="li__finish" pathLength="100" x1="36" y1="78" x2="264" y2="78"/>
      </svg>
    </div>
  </div>
</div>
</main>
<script>
var li = document.getElementById('li');
var board = document.getElementById('board');
var sketch = document.getElementById('sketch');
var ink = document.getElementById('ink');
var range = document.getElementById('fade');
var sketchBtn = document.getElementById('sketchBtn');
var inkBtn = document.getElementById('inkBtn');
var sketchCtx = sketch.getContext('2d');
var inkCtx = ink.getContext('2d');
var active = 'ink';                 // 기본 활성 레이어는 잉크 판
var drawing = false;

// 고DPI 대응 — 두 판 다 배킹 스토어를 devicePixelRatio 배로 키우고 좌표계는 CSS 픽셀 그대로 쓴다
function resize() {
  var r = board.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  [sketch, ink].forEach(function (c) {
    c.width = Math.round(r.width * dpr);
    c.height = Math.round(r.height * dpr);
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  });
  drawGuide(r.width);
}

// 밑그림 판은 마운트 때 연한 안내선을 깔아 둔다 — globalAlpha 로 낮춘 잉크라 판 자체의 opacity 와 겹쳐 작동한다
function drawGuide(width) {
  var s = width / 300;              // 미리보기 SVG 와 같은 300×88 좌표계로 그린다
  sketchCtx.clearRect(0, 0, sketch.width, sketch.height);
  sketchCtx.save();
  sketchCtx.scale(s, s);
  sketchCtx.globalAlpha = 0.55;
  sketchCtx.strokeStyle = '#17141a';
  sketchCtx.lineCap = 'round';
  sketchCtx.lineWidth = 5;
  sketchCtx.beginPath();
  sketchCtx.moveTo(40, 70);
  sketchCtx.bezierCurveTo(60, 18, 110, 14, 130, 46);
  sketchCtx.bezierCurveTo(150, 78, 190, 80, 210, 54);
  sketchCtx.bezierCurveTo(226, 33, 250, 26, 268, 36);
  sketchCtx.stroke();
  sketchCtx.lineWidth = 3;
  sketchCtx.setLineDash([6, 5]);
  sketchCtx.beginPath();
  sketchCtx.arc(130, 46, 26, 0, Math.PI * 2);
  sketchCtx.stroke();
  sketchCtx.beginPath();
  sketchCtx.moveTo(36, 78);
  sketchCtx.lineTo(264, 78);
  sketchCtx.stroke();
  sketchCtx.restore();
}

function activeCtx() { return active === 'sketch' ? sketchCtx : inkCtx; }

function setActive(name) {
  active = name;
  sketchBtn.setAttribute('aria-pressed', name === 'sketch' ? 'true' : 'false');
  inkBtn.setAttribute('aria-pressed', name === 'ink' ? 'true' : 'false');
}

function toLocal(e) {
  var r = ink.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

board.addEventListener('pointerdown', function (e) {
  li.classList.remove('is-demo');
  var c = activeCtx(), p = toLocal(e);
  drawing = true;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.globalAlpha = active === 'sketch' ? 0.55 : 1;
  c.strokeStyle = '#17141a';
  c.lineWidth = active === 'sketch' ? 4 : 3;
  c.beginPath();
  c.moveTo(p.x, p.y);
  board.setPointerCapture(e.pointerId);
});
board.addEventListener('pointermove', function (e) {
  if (!drawing) { return; }
  var p = toLocal(e);
  activeCtx().lineTo(p.x, p.y);
  activeCtx().stroke();
});
window.addEventListener('pointerup', function () { drawing = false; });

// 슬라이더는 밑그림 판의 CSS opacity 만 바꾼다 — 그린 것은 그대로 있고 보이기만 옅어진다
range.addEventListener('input', function () {
  li.classList.remove('is-demo');
  sketch.style.opacity = String(range.value / 100);
});
// 두 장 합치기 — 밑그림 판을 지금 보이는 진하기 그대로 잉크 판에 눌러 담고 밑그림 판을 비운다
document.getElementById('mergeBtn').addEventListener('click', function () {
  li.classList.remove('is-demo');
  inkCtx.save();
  inkCtx.setTransform(1, 0, 0, 1, 0, 0);
  inkCtx.globalAlpha = Number(sketch.style.opacity || 0.34);
  inkCtx.drawImage(sketch, 0, 0);
  inkCtx.restore();
  sketchCtx.clearRect(0, 0, sketch.width, sketch.height);
});
sketchBtn.addEventListener('click', function () { li.classList.remove('is-demo'); setActive('sketch'); });
inkBtn.addEventListener('click', function () { li.classList.remove('is-demo'); setActive('ink'); });
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
