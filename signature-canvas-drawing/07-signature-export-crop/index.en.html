<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여백 자동 크롭 내보내기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ex is-demo" id="ex">
  <div class="ex__card">
    <div class="ex__bar">
      <p class="ex__label"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="ex__ico" aria-hidden="true"><path d="M67.41,142.56C35.71,129.52,45.41,32.07,78,32,111.82,32.05,92,90.26,67.41,142.56Z" opacity="0.2"/><path d="M232,168H63.86c2.66-5.24,5.33-10.63,8-16.11,14.94,1.65,32.58-8.78,52.66-31.14,5,13.46,14.45,30.93,30.58,31.25,9.09.18,18.11-5.2,27.42-16.37C189.31,143.75,203.3,152,232,152a8,8,0,0,0,0-16c-30.43,0-39.43-10.45-40-16.11a7.67,7.67,0,0,0-5.46-7.75,8.14,8.14,0,0,0-9.25,3.49C165.23,134.17,158,136.06,155.38,136c-8.26-.16-16.66-19.52-19.54-33.42a8,8,0,0,0-14.09-3.37C101.54,124.55,88,133.08,79.57,135.29,88.06,116.42,94.4,99.85,98.46,85.9c6.82-23.44,7.32-39.83,1.51-50.1-3-5.38-9.34-11.8-22.06-11.8C61.85,24,49.18,39.18,43.14,65.65c-3.59,15.71-4.18,33.21-1.62,48s7.87,25.55,15.59,31.94c-3.73,7.72-7.53,15.26-11.23,22.41H24a8,8,0,0,0,0,16H37.41c-11.32,21-20.12,35.64-20.26,35.88a8,8,0,1,0,13.71,8.24c.15-.26,11.27-18.79,24.7-44.12H232a8,8,0,0,0,0-16ZM58.74,69.21C62.72,51.74,70.43,40,77.91,40c5.33,0,7.1,1.86,8.13,3.67,3,5.33,6.52,24.19-21.66,86.39C56.12,118.78,53.31,93,58.74,69.21Z"/></svg><span>Export signature</span></p>
      <button type="button" class="ex__btn" id="exportBtn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="ex__ico" aria-hidden="true"><path d="M216,48V208H40V48A16,16,0,0,1,56,32H200A16,16,0,0,1,216,48Z" opacity="0.2"/><path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z"/></svg><span>Export as PNG</span></button>
    </div>
    <div class="ex__body">
      <div class="ex__pad" id="pad">
        <canvas class="ex__ink" id="ink" role="img" aria-label="Signature box"></canvas>
        <!-- 미리보기용 Signature — canvas 에 그려지는 SAMPLE 과 같은 좌표를 중점 2차 곡선으로 옮긴 것 -->
        <svg class="ex__ghost" viewBox="0 0 200 100" preserveAspectRatio="none" aria-hidden="true">
          <path class="ex__stroke" d="M30,56 Q30,56 33,46 Q36,36 41,31 Q46,26 50,31 Q54,36 52,44 Q50,52 47,56 Q44,60 48,59 Q52,58 59,52 Q66,46 72,39 Q78,32 82,30 Q86,28 88,34 Q90,40 93,46 Q96,52 100,53"/>
          <path class="ex__stroke" d="M112,50 Q112,50 117,42 Q122,34 127,30 Q132,26 136,29 Q140,32 138,39 Q136,46 140,47 Q144,48 150,43 Q156,38 160,33"/>
          <path class="ex__stroke" d="M36,70 Q36,70 53,72 Q70,74 90,75 Q110,76 130,74 Q150,72 161,68"/>
        </svg>
        <span class="ex__crop" id="crop" aria-hidden="true"></span>
      </div>
      <div class="ex__out">
        <span class="ex__outLabel">Preview</span>
        <div class="ex__frame">
          <span class="ex__hint">The result appears here</span>
          <img class="ex__img" id="out" alt="Signature preview with margin trimmed">
          <!-- Preview 루프에서만 보이는 결과 사본 — viewBox 가 Ink 바깥선이라 잘린 그림이 된다 -->
          <svg class="ex__thumb" viewBox="21 19 149 65" aria-hidden="true">
            <path class="ex__stroke" d="M30,56 Q30,56 33,46 Q36,36 41,31 Q46,26 50,31 Q54,36 52,44 Q50,52 47,56 Q44,60 48,59 Q52,58 59,52 Q66,46 72,39 Q78,32 82,30 Q86,28 88,34 Q90,40 93,46 Q96,52 100,53"/>
            <path class="ex__stroke" d="M112,50 Q112,50 117,42 Q122,34 127,30 Q132,26 136,29 Q140,32 138,39 Q136,46 140,47 Q144,48 150,43 Q156,38 160,33"/>
            <path class="ex__stroke" d="M36,70 Q36,70 53,72 Q70,74 90,75 Q110,76 130,74 Q150,72 161,68"/>
          </svg>
        </div>
      </div>
    </div>
    <p class="ex__live">
      <span class="ex__liveReal" id="live" aria-live="polite">Press export to trim the outer margin</span>
      <span class="ex__liveDemo ex__liveDemo--before" aria-hidden="true">Press export to trim the outer margin</span>
      <span class="ex__liveDemo ex__liveDemo--after" aria-hidden="true">Preview with the outer margin trimmed</span>
    </p>
  </div>
</div>
</main>
<script>
var ex = document.getElementById('ex');
var pad = document.getElementById('pad');
var ink = document.getElementById('ink');
var out = document.getElementById('out');
var crop = document.getElementById('crop');
var live = document.getElementById('live');
var ctx = ink.getContext('2d');
var strokes = [], current = null;
var TRIM_LABEL = 'Preview with %wpx by %hpx of margin trimmed';
var EMPTY_LABEL = 'The signature is empty, nothing to trim';
// 마운트 때 깔아 두는 예시 Signature — 200×100 칸 기준 좌표. 판 크기에 맞춰 늘려 그린다
var SAMPLE = [
  [[30, 56], [36, 36], [46, 26], [54, 36], [50, 52], [44, 60], [52, 58], [66, 46], [78, 32], [86, 28], [90, 40], [96, 52], [104, 54]],
  [[112, 50], [122, 34], [132, 26], [140, 32], [136, 46], [144, 48], [156, 38], [164, 28]],
  [[36, 70], [70, 74], [110, 76], [150, 72], [172, 64]]
];

// 고DPI 대응 — 배킹 스토어를 devicePixelRatio 배로 키우고 좌표계는 CSS 픽셀 그대로 쓴다
function resize() {
  var r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  ink.width = Math.round(r.width * dpr);
  ink.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  repaint();
}

function drawPoints(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) {
    // 두 점의 중점을 제어점으로 삼아 꺾임을 둥글게 잇는다
    ctx.quadraticCurveTo(pts[i - 1][0], pts[i - 1][1], (pts[i][0] + pts[i - 1][0]) / 2, (pts[i][1] + pts[i - 1][1]) / 2);
  }
  ctx.stroke();
}

function repaint() {
  var r = pad.getBoundingClientRect();
  ctx.clearRect(0, 0, ink.width, ink.height);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#17141a';
  for (var s = 0; s < SAMPLE.length; s++) {
    var scaled = [];
    for (var i = 0; i < SAMPLE[s].length; i++) {
      scaled.push([SAMPLE[s][i][0] * r.width / 200, SAMPLE[s][i][1] * r.height / 100]);
    }
    drawPoints(scaled);
  }
  for (var u = 0; u < strokes.length; u++) { drawPoints(strokes[u]); }
}

function exportCrop() {
  ex.classList.remove('is-demo');
  var pixels = ctx.getImageData(0, 0, ink.width, ink.height);
  var data = pixels.data;
  var minX = ink.width, minY = ink.height, maxX = -1, maxY = -1;
  for (var y = 0; y < ink.height; y++) {
    for (var x = 0; x < ink.width; x++) {
      // 배경을 칠하지 않았으므로 잉크가 없는 자리는 알파가 0 이다 — 알파 채널만 훑으면 바운딩 박스가 나온다
      if (data[(y * ink.width + x) * 4 + 3] > 8) {
        if (x < minX) { minX = x; }
        if (x > maxX) { maxX = x; }
        if (y < minY) { minY = y; }
        if (y > maxY) { maxY = y; }
      }
    }
  }
  if (maxX < 0) { live.textContent = EMPTY_LABEL; return; }
  var dpr = window.devicePixelRatio || 1;
  var edge = Math.round(6 * dpr);
  minX = Math.max(0, minX - edge);
  minY = Math.max(0, minY - edge);
  maxX = Math.min(ink.width - 1, maxX + edge);
  maxY = Math.min(ink.height - 1, maxY + edge);
  var sw = maxX - minX + 1, sh = maxY - minY + 1;
  // 잰 바운딩 박스를 퍼센트로 바꿔 크롭 테두리를 그 자리로 조인다 — 무엇이 잘렸는지 눈에 보인다
  crop.style.inset = (minY / ink.height * 100).toFixed(1) + '% ' +
    ((ink.width - maxX - 1) / ink.width * 100).toFixed(1) + '% ' +
    ((ink.height - maxY - 1) / ink.height * 100).toFixed(1) + '% ' +
    (minX / ink.width * 100).toFixed(1) + '%';
  var cropped = document.createElement('canvas');
  cropped.width = sw;
  cropped.height = sh;
  // 배경을 칠하지 않고 잘린 자리만 옮기므로 알파가 그대로 남는다 — 투명 배경 PNG 가 된다
  cropped.getContext('2d').drawImage(ink, minX, minY, sw, sh, 0, 0, sw, sh);
  // 데모는 iframe 안에서 도니 <a download> 는 동작하지 않는다. 결과는 Preview <img> 까지만 보여 준다
  out.src = cropped.toDataURL('image/png');
  ex.classList.add('has-out');
  live.textContent = TRIM_LABEL
    .replace('%w', String(Math.round((ink.width - sw) / dpr)))
    .replace('%h', String(Math.round((ink.height - sh) / dpr)));
}

function toLocal(e) {
  var r = ink.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

pad.addEventListener('pointerdown', function (e) {
  ex.classList.remove('is-demo');
  crop.style.inset = '';
  current = [toLocal(e)];
  strokes.push(current);
  pad.setPointerCapture(e.pointerId);
});
pad.addEventListener('pointermove', function (e) {
  if (!current) { return; }
  current.push(toLocal(e));
  repaint();
});
window.addEventListener('pointerup', function () { current = null; });
document.getElementById('exportBtn').addEventListener('click', exportCrop);
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
