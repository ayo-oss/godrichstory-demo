<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stroke order 리플레이 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sr is-demo" id="sr">
  <div class="sr__card">
    <div class="sr__bar">
      <div class="sr__order">
        <span class="sr__orderLabel">Stroke order</span>
        <div class="sr__steps" id="steps">
          <span class="sr__step sr__step--a">1</span>
          <span class="sr__step sr__step--b">2</span>
          <span class="sr__step sr__step--c">3</span>
        </div>
      </div>
      <button type="button" class="sr__btn" id="replayBtn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="sr__ico" aria-hidden="true"><path d="M216,128a88,88,0,1,1-88-88A88,88,0,0,1,216,128Z" opacity="0.2"/><path d="M224,128a96,96,0,0,1-94.71,96H128A95.38,95.38,0,0,1,62.1,197.8a8,8,0,0,1,11-11.63A80,80,0,1,0,71.43,71.39a3.07,3.07,0,0,1-.26.25L44.59,96H72a8,8,0,0,1,0,16H24a8,8,0,0,1-8-8V56a8,8,0,0,1,16,0V85.8L60.25,60A96,96,0,0,1,224,128Z"/></svg><span>Replay</span></button>
    </div>
    <div class="sr__pad" id="pad">
      <canvas class="sr__ink" id="ink" role="img" aria-label="Signature box, 0 strokes"></canvas>
      <svg class="sr__play" id="play" viewBox="0 0 300 96" aria-hidden="true"></svg>
      <svg class="sr__ghost" viewBox="0 0 300 96" preserveAspectRatio="none" aria-hidden="true">
        <path class="sr__stroke sr__stroke--a" pathLength="100" d="M24,70 C30,34 44,18 56,26 C68,34 52,62 44,70 C36,78 60,74 76,58 C92,42 96,26 108,30 C120,34 106,66 120,70"/>
        <path class="sr__stroke sr__stroke--b" pathLength="100" d="M126,66 C140,44 152,32 164,40 C176,48 160,70 172,72 C184,74 196,58 204,44"/>
        <path class="sr__stroke sr__stroke--c" pathLength="100" d="M212,34 C244,36 268,52 272,64 C276,76 240,84 176,82 C112,80 52,78 30,84"/>
      </svg>
      <span class="sr__rule" aria-hidden="true"></span>
    </div>
    <p class="sr__live">
      <span class="sr__liveReal" id="live" aria-live="polite">0 strokes</span>
      <span class="sr__liveDemo" aria-hidden="true">Redraws in the order you drew</span>
    </p>
  </div>
</div>
</main>
<script>
var sr = document.getElementById('sr');
var pad = document.getElementById('pad');
var ink = document.getElementById('ink');
var play = document.getElementById('play');
var steps = document.getElementById('steps');
var live = document.getElementById('live');
var ctx = ink.getContext('2d');
var SVG_NS = 'http://www.w3.org/2000/svg';
var strokes = [], current = null, timers = [];
var PAD_LABEL = 'Signature box, %d strokes';
var COUNT_LABEL = '%d strokes';
var REPLAY_LABEL = 'Redraws from stroke 1';

// 고DPI 대응 — 배킹 스토어를 devicePixelRatio 배로 키우고 좌표계는 CSS 픽셀 그대로 쓴다
function resize() {
  var r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  ink.width = Math.round(r.width * dpr);
  ink.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  play.setAttribute('viewBox', '0 0 ' + Math.round(r.width) + ' ' + Math.round(r.height));
  repaint();
}

function repaint() {
  ctx.clearRect(0, 0, ink.width, ink.height);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#17141a';
  for (var s = 0; s < strokes.length; s++) {
    var pts = strokes[s];
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) {
      // 두 점의 중점을 제어점으로 삼아 꺾임을 둥글게 잇는다 — SVG 로 옮길 때도 같은 식이다
      ctx.quadraticCurveTo(pts[i - 1].x, pts[i - 1].y, (pts[i].x + pts[i - 1].x) / 2, (pts[i].y + pts[i - 1].y) / 2);
    }
    ctx.stroke();
  }
  ink.setAttribute('aria-label', PAD_LABEL.replace('%d', strokes.length));
  live.textContent = COUNT_LABEL.replace('%d', strokes.length);
}

// 좌표 배열을 SVG path 의 d 로 — canvas 가 그린 곡선과 같은 모양이 된다
function toPathData(pts) {
  var d = 'M' + pts[0].x.toFixed(1) + ',' + pts[0].y.toFixed(1);
  for (var i = 1; i < pts.length; i++) {
    d += ' Q' + pts[i - 1].x.toFixed(1) + ',' + pts[i - 1].y.toFixed(1) +
         ' ' + ((pts[i].x + pts[i - 1].x) / 2).toFixed(1) + ',' + ((pts[i].y + pts[i - 1].y) / 2).toFixed(1);
  }
  return d;
}

function renderSteps() {
  steps.textContent = '';
  for (var i = 0; i < strokes.length && i < 8; i++) {
    var badge = document.createElement('span');
    badge.className = 'sr__step is-on';
    badge.textContent = String(i + 1);
    steps.appendChild(badge);
  }
}

function lightStep(index) {
  var badge = steps.children[index];
  if (badge) { badge.classList.add('is-on'); }
}

function finishReplay() {
  ink.style.visibility = '';
  play.textContent = '';
  live.textContent = COUNT_LABEL.replace('%d', strokes.length);
}

function replay() {
  if (!strokes.length || current) { return; }
  for (var t = 0; t < timers.length; t++) { window.clearTimeout(timers[t]); }
  timers = [];
  play.textContent = '';
  ink.style.visibility = 'hidden';
  for (var b = 0; b < steps.children.length; b++) { steps.children[b].classList.remove('is-on'); }
  var delay = 0, paths = [];
  for (var s = 0; s < strokes.length; s++) {
    var path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('class', 'sr__trace');
    path.setAttribute('d', toPathData(strokes[s]));
    play.appendChild(path);
    // 길이를 재서 그 길이만큼의 점선 한 칸을 만들고 칸을 통째로 밀어 두면 선이 사라진다
    var len = path.getTotalLength();
    var ms = Math.max(240, Math.round(len * 2.4));
    path.style.setProperty('stroke-dasharray', len + 'px');
    path.style.setProperty('stroke-dashoffset', len + 'px');
    path.style.setProperty('transition', 'stroke-dashoffset ' + ms + 'ms linear ' + delay + 'ms');
    paths.push(path);
    timers.push(window.setTimeout(lightStep.bind(null, s), delay));
    delay += ms + 120;
  }
  // 방금 붙인 값으로 레이아웃을 한 번 계산시킨다 — 그래야 transition 이 처음 값부터 출발한다
  play.getBoundingClientRect();
  for (var p = 0; p < paths.length; p++) { paths[p].style.setProperty('stroke-dashoffset', '0px'); }
  live.textContent = REPLAY_LABEL;
  timers.push(window.setTimeout(finishReplay, delay + 200));
}

function toLocal(e) {
  var r = ink.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

pad.addEventListener('pointerdown', function (e) {
  sr.classList.remove('is-demo');
  finishReplay();
  current = [toLocal(e)];
  strokes.push(current);
  renderSteps();
  pad.setPointerCapture(e.pointerId);
});
pad.addEventListener('pointermove', function (e) {
  if (!current) { return; }
  current.push(toLocal(e));
  repaint();
});
window.addEventListener('pointerup', function () {
  if (!current) { return; }
  current = null;
  renderSteps();
});
document.getElementById('replayBtn').addEventListener('click', function () {
  sr.classList.remove('is-demo');
  replay();
});
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
