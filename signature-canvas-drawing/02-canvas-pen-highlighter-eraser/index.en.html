<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pen·Highlighter·Eraser 도구바 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pt is-demo" id="pt">
  <div class="pt__card">
    <div class="pt__bar">
      <div class="pt__tools" role="group" aria-label="Drawing tools">
        <button type="button" class="pt__tool pt__tool--pen" data-group="tool" data-value="pen" aria-pressed="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="pt__ico" aria-hidden="true"><path d="M221.66,90.34,192,120,136,64l29.66-29.66a8,8,0,0,1,11.31,0L221.66,79A8,8,0,0,1,221.66,90.34Z" opacity="0.2"/><path d="M227.32,73.37,182.63,28.69a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31l83.67-83.66,3.48,13.9-36.8,36.79a8,8,0,0,0,11.31,11.32l40-40a8,8,0,0,0,2.11-7.6l-6.9-27.61L227.32,96A16,16,0,0,0,227.32,73.37ZM48,208V179.31L76.69,208Zm48-3.31L51.31,160,136,75.31,180.69,120Zm96-96L147.32,64l24-24L216,84.69Z"/></svg>
          <span>Pen</span><span class="pt__mark" aria-hidden="true"></span>
        </button>
        <button type="button" class="pt__tool pt__tool--hl" data-group="tool" data-value="highlighter" aria-pressed="false">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="pt__ico" aria-hidden="true"><path d="M136,176,96,216,24,192l64-64Z" opacity="0.2"/><path d="M253.66,106.34a8,8,0,0,0-11.32,0L192,156.69,109.66,74.34h0L107.31,72l50.35-50.34a8,8,0,1,0-11.32-11.32L96,60.69A16,16,0,0,0,93.18,79.5L72,100.69a16,16,0,0,0,0,22.62L76.69,128,18.34,186.34a8,8,0,0,0,3.13,13.25l72,24A7.88,7.88,0,0,0,96,224a8,8,0,0,0,5.66-2.34L136,187.31l4.69,4.69a16,16,0,0,0,22.62,0l21.18-21.18A16,16,0,0,0,203.31,168l50.35-50.34A8,8,0,0,0,253.66,106.34ZM93.84,206.85l-55-18.35L88,139.31,124.69,176ZM152,180.69l-10.34-10.35h0l-48-48h0L83.31,112,104,91.31,172.69,160Z"/></svg>
          <span>Highlighter</span><span class="pt__mark" aria-hidden="true"></span>
        </button>
        <button type="button" class="pt__tool pt__tool--er" data-group="tool" data-value="eraser" aria-pressed="false">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="pt__ico" aria-hidden="true"><path d="M160,168l-48,48H66.75L36.69,185.94a16,16,0,0,1,0-22.63L96,104Z" opacity="0.2"/><path d="M225,80.4,183.6,39a24,24,0,0,0-33.94,0L31,157.66a24,24,0,0,0,0,33.94l30.06,30.06A8,8,0,0,0,66.74,224H216a8,8,0,0,0,0-16h-84.7L225,114.34A24,24,0,0,0,225,80.4ZM108.68,208H70.05L42.33,180.28a8,8,0,0,1,0-11.31L96,115.31,148.69,168Zm105-105L160,156.69,107.31,104,161,50.34a8,8,0,0,1,11.32,0l41.38,41.38a8,8,0,0,1,0,11.31Z"/></svg>
          <span>Eraser</span><span class="pt__mark" aria-hidden="true"></span>
        </button>
      </div>
      <div class="pt__opts">
        <div class="pt__swatches" role="group" aria-label="Pen color">
          <button type="button" class="pt__swatch pt__swatch--ink" data-group="color" data-value="#17141a" aria-pressed="true" aria-label="Black ink"></button>
          <button type="button" class="pt__swatch pt__swatch--blue" data-group="color" data-value="#2f6df6" aria-pressed="false" aria-label="Blue ink"></button>
          <button type="button" class="pt__swatch pt__swatch--red" data-group="color" data-value="#c2361a" aria-pressed="false" aria-label="Red ink"></button>
        </div>
        <div class="pt__widths" role="group" aria-label="Line width">
          <button type="button" class="pt__width" data-group="width" data-value="2" aria-pressed="false" aria-label="Thin line"><span class="pt__dot pt__dot--s"></span></button>
          <button type="button" class="pt__width" data-group="width" data-value="4" aria-pressed="true" aria-label="Medium line"><span class="pt__dot pt__dot--m"></span></button>
          <button type="button" class="pt__width" data-group="width" data-value="8" aria-pressed="false" aria-label="Thick line"><span class="pt__dot pt__dot--l"></span></button>
        </div>
        <button type="button" class="pt__wipe" id="wipeBtn">Clear board</button>
      </div>
    </div>
    <div class="pt__pad" id="pad">
      <p class="pt__sample">Try highlighting here</p>
      <canvas class="pt__ink" id="ink" role="img" aria-label="Notes board, 0 strokes"></canvas>
      <span class="pt__band" aria-hidden="true"></span>
      <svg class="pt__ghost" viewBox="0 0 300 104" preserveAspectRatio="none" aria-hidden="true">
        <path class="pt__stroke" pathLength="100" d="M26,84 C70,60 114,96 156,70 C194,46 234,78 274,52"/>
        <rect class="pt__rub" x="-10" y="-7" width="20" height="14" rx="4"/>
      </svg>
    </div>
  </div>
</div>
</main>
<script>
var pt = document.getElementById('pt');
var pad = document.getElementById('pad');
var ink = document.getElementById('ink');
var ctx = ink.getContext('2d');
var PAD_LABEL = 'Notes board, %d strokes';
// 도구마다 다른 것은 합성 방식(globalCompositeOperation) 하나다.
// pen         source-over     — 있던 그림 위에 그대로 얹는다
// highlighter multiply        — 덮지 않고 곱해서 어둡게 한다. 그래서 아래 글자와 Pen 획이 형광 띠를 통해 비친다
// eraser      destination-out — 칠하는 대신 이미 그려진 픽셀의 알파를 깎아낸다
var TOOLS = {
  pen: { mode: 'source-over', color: null, width: null },
  highlighter: { mode: 'multiply', color: '#ffd23f', width: 16 },
  eraser: { mode: 'destination-out', color: '#000000', width: 20 }
};
var strokes = [], current = null, tool = 'pen', color = '#17141a', width = 4;

// 고DPI 대응 — 배킹 스토어를 devicePixelRatio 배로 키우고 좌표계는 CSS 픽셀 그대로 쓴다
function resize() {
  var r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  ink.width = Math.round(r.width * dpr);
  ink.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  repaint();
}

function repaint() {
  // canvas 크기를 바꾸면 문맥 상태가 초기화되므로 획 목록을 매번 처음부터 다시 긋는다
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, ink.width, ink.height);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var s = 0; s < strokes.length; s++) {
    var st = strokes[s], pts = st.points;
    ctx.globalCompositeOperation = st.mode;
    ctx.strokeStyle = st.color;
    ctx.lineWidth = st.width;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) { ctx.lineTo(pts[i].x, pts[i].y); }
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  ink.setAttribute('aria-label', PAD_LABEL.replace('%d', strokes.length));
}

function toLocal(e) {
  var r = ink.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

document.addEventListener('click', function (e) {
  var btn = e.target.closest('[data-group]');
  if (!btn) { return; }
  pt.classList.remove('is-demo');
  var group = btn.getAttribute('data-group'), value = btn.getAttribute('data-value');
  var peers = document.querySelectorAll('[data-group="' + group + '"]');
  for (var i = 0; i < peers.length; i++) { peers[i].setAttribute('aria-pressed', String(peers[i] === btn)); }
  if (group === 'tool') { tool = value; } else if (group === 'color') { color = value; } else { width = Number(value); }
});
document.getElementById('wipeBtn').addEventListener('click', function () {
  pt.classList.remove('is-demo');
  strokes = [];
  repaint();
});
pad.addEventListener('pointerdown', function (e) {
  pt.classList.remove('is-demo');
  var spec = TOOLS[tool];
  current = { mode: spec.mode, color: spec.color || color, width: spec.width || width, points: [toLocal(e)] };
  strokes.push(current);
  pad.setPointerCapture(e.pointerId);
  repaint();
});
pad.addEventListener('pointermove', function (e) {
  if (!current) { return; }
  current.points.push(toLocal(e));
  repaint();
});
window.addEventListener('pointerup', function () { current = null; });
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
