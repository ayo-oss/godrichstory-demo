<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contract signature field 잠금 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cl is-demo" id="lock">
  <div class="cl__card">
    <div class="cl__doc">
      <p class="cl__docTitle">Article 3 Use of service</p>
      <p class="cl__docLine">The user may use the service during the contract term.</p>
      <p class="cl__docNote">(Sample text for the demo, not a real clause)</p>
    </div>
    <div class="cl__pad" id="pad">
      <p class="cl__hint">Sign here</p>
      <canvas class="cl__ink" id="ink" role="img" aria-label="Contract signature field"></canvas>
      <svg class="cl__ghost" viewBox="0 0 300 56" preserveAspectRatio="none" aria-hidden="true">
        <path class="cl__stroke cl__stroke--a" pathLength="100" d="M26,36 C40,10 58,6 64,18 C70,31 54,42 47,36 C40,29 62,13 86,15 C108,16 100,36 116,36 C132,36 134,17 148,17 C162,17 154,37 170,34"/>
        <path class="cl__stroke cl__stroke--b" pathLength="100" d="M162,37 C190,33 216,25 242,13"/>
        <path class="cl__stroke cl__stroke--c" pathLength="100" d="M246,16 C210,40 152,48 92,43"/>
      </svg>
      <span class="cl__rule" aria-hidden="true"></span>
      <div class="cl__cover" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="cl__lock"><path d="M216,96V208a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V96a8,8,0,0,1,8-8H208A8,8,0,0,1,216,96Z" opacity="0.2"/><path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM208,208H48V96H208V208Z"/></svg>
        <span class="cl__stamp">
          <span class="cl__stampWord">Confirm</span>
          <span class="cl__stampReal" id="stampTime"></span>
          <span class="cl__stampDemo">14:32:07</span>
        </span>
      </div>
    </div>
    <div class="cl__foot">
      <p class="cl__live">
        <span class="cl__liveReal" id="live" aria-live="polite">Sign, then press confirm</span>
        <span class="cl__liveDemo cl__liveDemo--ask" aria-hidden="true">Sign, then press confirm</span>
        <span class="cl__liveDemo cl__liveDemo--done" aria-hidden="true">The signature is confirmed</span>
      </p>
      <div class="cl__acts">
        <button type="button" class="cl__btn cl__btn--confirm" id="confirmBtn">Confirm signature</button>
        <button type="button" class="cl__btn cl__btn--again" id="againBtn">Sign again</button>
      </div>
    </div>
  </div>
</div>
</main>
<script>
var root = document.getElementById('lock');
var pad = document.getElementById('pad');
var canvas = document.getElementById('ink');
var live = document.getElementById('live');
var stampTime = document.getElementById('stampTime');
var ctx = canvas.getContext('2d');
var strokes = [], current = null, signState = 'open';
var ASK = 'Sign, then press confirm';
var NEED = 'Please sign first';
var DONE = 'The signature is confirmed';

// 고DPI 대응 — 배킹 스토어를 devicePixelRatio 배로 키우고 좌표계는 CSS 픽셀 그대로 쓴다
function resize() {
  var r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr);
  canvas.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  repaint();
}

function repaint() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#17141a';
  ctx.lineWidth = 3.2;
  for (var s = 0; s < strokes.length; s++) {
    var pts = strokes[s];
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) {
      // 두 점의 중점을 제어점으로 삼아 꺾임을 둥글게 잇는다
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x + pts[i - 1].x) / 2, (pts[i].y + pts[i - 1].y) / 2);
    }
    ctx.stroke();
  }
}

function toLocal(e) {
  var r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function confirmSign() {
  if (!strokes.length) { live.textContent = NEED; return; }
  signState = 'locked';
  // 잠금은 클래스 하나 — 서명란이 pointer-events: none 이 되어 그 위에 더 못 그린다
  root.classList.add('is-locked');
  // 시각 문자열만 화면에 쓴다. 앞뒤 설명은 문구 사전이 바꿀 수 있는 한국어 문장으로 둔다
  stampTime.textContent = new Date().toLocaleTimeString();
  live.textContent = DONE;
}

function signAgain() {
  signState = 'open';
  root.classList.remove('is-locked');
  stampTime.textContent = '';
  strokes = [];
  repaint();
  live.textContent = ASK;
}

pad.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  if (signState === 'locked') { return; }
  current = [toLocal(e)];
  strokes.push(current);
  pad.setPointerCapture(e.pointerId);
});
pad.addEventListener('pointermove', function (e) {
  if (!current) { return; }
  current.push(toLocal(e));
  repaint();
});
window.addEventListener('pointerup', function () { current = null; });
document.getElementById('confirmBtn').addEventListener('click', function () { root.classList.remove('is-demo'); confirmSign(); });
document.getElementById('againBtn').addEventListener('click', function () { root.classList.remove('is-demo'); signAgain(); });
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
