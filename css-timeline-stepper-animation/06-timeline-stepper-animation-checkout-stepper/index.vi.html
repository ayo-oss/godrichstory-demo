<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout stepper — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ts06-steps is-demo">
    <div class="ts06-step">
      <span class="ts06-circle" aria-label="Hoàn tất">
        <svg class="ts06-check" viewBox="0 0 16 16" fill="none" aria-hidden="true"><polyline points="3,8 7,12 13,4" /></svg>
        <span class="ts06-num">1</span>
      </span>
      <span class="ts06-label">Giỏ hàng</span>
    </div>
    <span class="ts06-bar"><span class="ts06-fill"></span></span>
    <div class="ts06-step">
      <span class="ts06-circle" aria-label="Hoàn tất">
        <svg class="ts06-check" viewBox="0 0 16 16" fill="none" aria-hidden="true"><polyline points="3,8 7,12 13,4" /></svg>
        <span class="ts06-num">2</span>
      </span>
      <span class="ts06-label">Giao hàng</span>
    </div>
    <span class="ts06-bar"><span class="ts06-fill"></span></span>
    <div class="ts06-step ts06-step--active">
      <span class="ts06-circle"><span class="ts06-num">3</span></span>
      <span class="ts06-label">Thanh toán</span>
    </div>
    <span class="ts06-bar"></span>
    <div class="ts06-step">
      <span class="ts06-circle"><span class="ts06-num">4</span></span>
      <span class="ts06-label">Hoàn tất</span>
    </div>
  </div>
</main>
</body>
</html>
