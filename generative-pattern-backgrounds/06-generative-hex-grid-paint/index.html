<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>육각 격자 색칠 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="hx is-demo" id="root">
  <svg class="hx__art" id="art" viewBox="0 0 240 150" role="img" data-label="벌집처럼 깔린 육각형을 자리와 난수로 칠한 격자, 시드 {n}"></svg>
  <div class="hx__bar">
    <p class="hx__seed">
      <svg xmlns="http://www.w3.org/2000/svg" class="hx__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 64v128a24 24 0 0 1-24 24H64a24 24 0 0 1-24-24V64a24 24 0 0 1 24-24h128a24 24 0 0 1 24 24" opacity=".2"/><path d="M192 32H64a32 32 0 0 0-32 32v128a32 32 0 0 0 32 32h128a32 32 0 0 0 32-32V64a32 32 0 0 0-32-32m16 160a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V64a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16ZM104 92a12 12 0 1 1-12-12a12 12 0 0 1 12 12m72 0a12 12 0 1 1-12-12a12 12 0 0 1 12 12m-72 72a12 12 0 1 1-12-12a12 12 0 0 1 12 12m36-36a12 12 0 1 1-12-12a12 12 0 0 1 12 12m36 36a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></svg>
      시드 <b id="num">7</b>
    </p>
    <button class="hx__btn" type="button" id="again">
      <svg xmlns="http://www.w3.org/2000/svg" class="hx__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M107.14 98.8L128 128l-20.86 29.2A64 64 0 0 1 55.06 184H32V72h23.06a64 64 0 0 1 52.08 26.8m93.8-26.8a64 64 0 0 0-52.08 26.8L128 128l20.86 29.2a64 64 0 0 0 52.08 26.8H232V72Z" opacity=".2"/><path d="M237.66 178.34a8 8 0 0 1 0 11.32l-24 24a8 8 0 0 1-11.32-11.32L212.69 192h-11.75a72.12 72.12 0 0 1-58.59-30.15l-41.72-58.4A56.1 56.1 0 0 0 55.06 80H32a8 8 0 0 1 0-16h23.06a72.12 72.12 0 0 1 58.59 30.15l41.72 58.4A56.1 56.1 0 0 0 200.94 176h11.75l-10.35-10.34a8 8 0 0 1 11.32-11.32ZM143 107a8 8 0 0 0 11.16-1.86l1.2-1.67A56.1 56.1 0 0 1 200.94 80h11.75l-10.35 10.34a8 8 0 0 0 11.32 11.32l24-24a8 8 0 0 0 0-11.32l-24-24a8 8 0 0 0-11.32 11.32L212.69 64h-11.75a72.12 72.12 0 0 0-58.59 30.15l-1.2 1.67A8 8 0 0 0 143 107m-30 42a8 8 0 0 0-11.16 1.86l-1.2 1.67A56.1 56.1 0 0 1 55.06 176H32a8 8 0 0 0 0 16h23.06a72.12 72.12 0 0 0 58.59-30.15l1.2-1.67A8 8 0 0 0 113 149"/></g></svg>
      <span class="hx__label">다시 생성</span>
    </button>
    <button class="hx__btn" type="button" id="copy" data-done="복사됨">
      <svg xmlns="http://www.w3.org/2000/svg" class="hx__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 40v128h-48V88H88V40Z" opacity=".2"/><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></g></svg>
      <span class="hx__label">SVG 복사</span>
    </button>
  </div>
</div>
</main>
<script>
var root = document.getElementById('root');
var art = document.getElementById('art');
var num = document.getElementById('num');
var R = 15, COLS = 11, ROWS = 7;
var HSTEP = R * 1.5, VSTEP = R * Math.sqrt(3);
var TONES = ['a', 'b', 'c', 'd'];
var seed = 7;

// mulberry32 — 32비트 정수 시드 하나로 언제나 같은 난수열을 돌려준다. 재현 가능한 생성의 뿌리
function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 납작한 육각형 여섯 꼭짓점 — 0도부터 60도씩
function hexPoints(cx, cy) {
  var pts = [], k;
  for (k = 0; k < 6; k++) {
    var a = k * Math.PI / 3;
    pts.push((cx + R * Math.cos(a)).toFixed(1) + ',' + (cy + R * Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
}

function build() {
  var rand = mulberry32(seed), parts = [], col, row;
  for (col = 0; col < COLS; col++) {
    for (row = 0; row < ROWS; row++) {
      var cx = col * HSTEP, cy = row * VSTEP + (col % 2 ? VSTEP / 2 : 0) - VSTEP / 2;
      // 색 단계는 왼쪽에서 오른쪽으로 기운 확률에 난수를 섞어 고른다 — 자리가 결과에 남는다
      var bias = col / (COLS - 1) * 1.6 + rand() * 2.4;
      var tone = TONES[Math.max(0, Math.min(3, Math.floor(bias)))];
      parts.push('<polygon class="hx__cell hx__cell--' + tone + '" style="--i:' + (col + row) +
        '" points="' + hexPoints(cx, cy) + '"/>');
    }
  }
  art.innerHTML = parts.join('');
  art.setAttribute('aria-label', art.getAttribute('data-label').replace('{n}', seed));
  num.textContent = seed;
}

document.getElementById('again').addEventListener('click', function () {
  seed = (seed * 7 + 13) % 991 + 1;
  build();
  root.classList.remove('is-demo');
  root.classList.remove('is-draw');
  void art.getBoundingClientRect().width;   // 한 번 읽어 리플로를 일으켜야 같은 애니메이션이 처음부터 다시 돈다
  root.classList.add('is-draw');
});

var copyBtn = document.getElementById('copy');
copyBtn.addEventListener('click', function () {
  var label = copyBtn.querySelector('.hx__label');
  var before = label.textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(art.outerHTML).catch(function () {});
  }
  label.textContent = copyBtn.getAttribute('data-done');
  setTimeout(function () { label.textContent = before; }, 1200);
});

build();
</script>
</body>
</html>
