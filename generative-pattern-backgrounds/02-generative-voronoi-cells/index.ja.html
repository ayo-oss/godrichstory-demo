<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボロノイセルのタイル — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vo is-demo" id="root">
  <svg class="vo__art" id="art" viewBox="0 0 240 150" role="img" data-label="散らした点ごとに最も近い領域を塗ったセルタイル、シード {n}"></svg>
  <div class="vo__bar">
    <p class="vo__seed">
      <svg xmlns="http://www.w3.org/2000/svg" class="vo__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 64v128a24 24 0 0 1-24 24H64a24 24 0 0 1-24-24V64a24 24 0 0 1 24-24h128a24 24 0 0 1 24 24" opacity=".2"/><path d="M192 32H64a32 32 0 0 0-32 32v128a32 32 0 0 0 32 32h128a32 32 0 0 0 32-32V64a32 32 0 0 0-32-32m16 160a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V64a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16ZM104 92a12 12 0 1 1-12-12a12 12 0 0 1 12 12m72 0a12 12 0 1 1-12-12a12 12 0 0 1 12 12m-72 72a12 12 0 1 1-12-12a12 12 0 0 1 12 12m36-36a12 12 0 1 1-12-12a12 12 0 0 1 12 12m36 36a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></svg>
      シード <b id="num">7</b>
    </p>
    <button class="vo__btn" type="button" id="again">
      <svg xmlns="http://www.w3.org/2000/svg" class="vo__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M107.14 98.8L128 128l-20.86 29.2A64 64 0 0 1 55.06 184H32V72h23.06a64 64 0 0 1 52.08 26.8m93.8-26.8a64 64 0 0 0-52.08 26.8L128 128l20.86 29.2a64 64 0 0 0 52.08 26.8H232V72Z" opacity=".2"/><path d="M237.66 178.34a8 8 0 0 1 0 11.32l-24 24a8 8 0 0 1-11.32-11.32L212.69 192h-11.75a72.12 72.12 0 0 1-58.59-30.15l-41.72-58.4A56.1 56.1 0 0 0 55.06 80H32a8 8 0 0 1 0-16h23.06a72.12 72.12 0 0 1 58.59 30.15l41.72 58.4A56.1 56.1 0 0 0 200.94 176h11.75l-10.35-10.34a8 8 0 0 1 11.32-11.32ZM143 107a8 8 0 0 0 11.16-1.86l1.2-1.67A56.1 56.1 0 0 1 200.94 80h11.75l-10.35 10.34a8 8 0 0 0 11.32 11.32l24-24a8 8 0 0 0 0-11.32l-24-24a8 8 0 0 0-11.32 11.32L212.69 64h-11.75a72.12 72.12 0 0 0-58.59 30.15l-1.2 1.67A8 8 0 0 0 143 107m-30 42a8 8 0 0 0-11.16 1.86l-1.2 1.67A56.1 56.1 0 0 1 55.06 176H32a8 8 0 0 0 0 16h23.06a72.12 72.12 0 0 0 58.59-30.15l1.2-1.67A8 8 0 0 0 113 149"/></g></svg>
      <span class="vo__label">再生成</span>
    </button>
    <button class="vo__btn" type="button" id="copy" data-done="コピーしました">
      <svg xmlns="http://www.w3.org/2000/svg" class="vo__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 40v128h-48V88H88V40Z" opacity=".2"/><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></g></svg>
      <span class="vo__label">SVGをコピー</span>
    </button>
  </div>
</div>
</main>
<script>
var root = document.getElementById('root');
var art = document.getElementById('art');
var num = document.getElementById('num');
var W = 240, H = 150, SITES = 26;
var seed = 7;

// mulberry32 — 32비트 정수 シード 하나로 언제나 같은 난수열을 돌려준다. 재현 가능한 생성의 뿌리
function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 두 점의 수직이등분선으로 다각형을 잘라 a 쪽 반평면만 남긴다 (서덜랜드-호지먼 클리핑)
function clip(poly, a, b) {
  var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  var dx = b[0] - a[0], dy = b[1] - a[1], out = [], i;
  function side(p) { return (p[0] - mx) * dx + (p[1] - my) * dy; }
  for (i = 0; i < poly.length; i++) {
    var p = poly[i], q = poly[(i + 1) % poly.length], sp = side(p), sq = side(q);
    if (sp <= 0) { out.push(p); }
    if ((sp < 0 && sq > 0) || (sp > 0 && sq < 0)) {
      var t = sp / (sp - sq);
      out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]);
    }
  }
  return out;
}

var TONES = ['a', 'b', 'c', 'd'];

function build() {
  var rand = mulberry32(seed), pts = [], parts = [], i, j;
  for (i = 0; i < SITES; i++) { pts.push([10 + rand() * (W - 20), 8 + rand() * (H - 16)]); }
  for (i = 0; i < SITES; i++) {
    var poly = [[0, 0], [W, 0], [W, H], [0, H]];
    for (j = 0; j < SITES && poly.length; j++) { if (j !== i) { poly = clip(poly, pts[i], pts[j]); } }
    if (poly.length < 3) { continue; }
    var tone = TONES[Math.min(3, Math.floor(rand() * 4))];
    var d = poly.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
    parts.push('<polygon class="vo__cell vo__cell--' + tone + '" style="--i:' + i + '" points="' + d + '"/>');
  }
  art.innerHTML = parts.join('');
  art.setAttribute('aria-label', art.getAttribute('data-label').replace('{n}', seed));
  num.textContent = seed;
}

document.getElementById('again').addEventListener('click', function () {
  seed = (seed * 7 + 13) % 991 + 1;
  build();
  root.classList.remove('is-demo');
  root.classList.remove('is-draw');
  void art.getBoundingClientRect().width;   // 한 번 읽어 리플로를 일으켜야 같은 애니메이션이 처음부터 다시 돈다
  root.classList.add('is-draw');
});

var copyBtn = document.getElementById('copy');
copyBtn.addEventListener('click', function () {
  var label = copyBtn.querySelector('.vo__label');
  var before = label.textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(art.outerHTML).catch(function () {});
  }
  label.textContent = copyBtn.getAttribute('data-done');
  setTimeout(function () { label.textContent = before; }, 1200);
});

build();
</script>
</body>
</html>
