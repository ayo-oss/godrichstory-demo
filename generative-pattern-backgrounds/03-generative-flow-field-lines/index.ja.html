<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フローフィールドの線画 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ff is-demo" id="root">
  <svg class="ff__art" id="art" viewBox="0 0 240 150" role="img" data-label="方向の場に沿って流れる線で描いた絵、シード {n}"></svg>
  <div class="ff__bar">
    <p class="ff__seed">
      <svg xmlns="http://www.w3.org/2000/svg" class="ff__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 64v128a24 24 0 0 1-24 24H64a24 24 0 0 1-24-24V64a24 24 0 0 1 24-24h128a24 24 0 0 1 24 24" opacity=".2"/><path d="M192 32H64a32 32 0 0 0-32 32v128a32 32 0 0 0 32 32h128a32 32 0 0 0 32-32V64a32 32 0 0 0-32-32m16 160a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V64a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16ZM104 92a12 12 0 1 1-12-12a12 12 0 0 1 12 12m72 0a12 12 0 1 1-12-12a12 12 0 0 1 12 12m-72 72a12 12 0 1 1-12-12a12 12 0 0 1 12 12m36-36a12 12 0 1 1-12-12a12 12 0 0 1 12 12m36 36a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></svg>
      シード <b id="num">7</b>
    </p>
    <button class="ff__btn" type="button" id="again">
      <svg xmlns="http://www.w3.org/2000/svg" class="ff__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M107.14 98.8L128 128l-20.86 29.2A64 64 0 0 1 55.06 184H32V72h23.06a64 64 0 0 1 52.08 26.8m93.8-26.8a64 64 0 0 0-52.08 26.8L128 128l20.86 29.2a64 64 0 0 0 52.08 26.8H232V72Z" opacity=".2"/><path d="M237.66 178.34a8 8 0 0 1 0 11.32l-24 24a8 8 0 0 1-11.32-11.32L212.69 192h-11.75a72.12 72.12 0 0 1-58.59-30.15l-41.72-58.4A56.1 56.1 0 0 0 55.06 80H32a8 8 0 0 1 0-16h23.06a72.12 72.12 0 0 1 58.59 30.15l41.72 58.4A56.1 56.1 0 0 0 200.94 176h11.75l-10.35-10.34a8 8 0 0 1 11.32-11.32ZM143 107a8 8 0 0 0 11.16-1.86l1.2-1.67A56.1 56.1 0 0 1 200.94 80h11.75l-10.35 10.34a8 8 0 0 0 11.32 11.32l24-24a8 8 0 0 0 0-11.32l-24-24a8 8 0 0 0-11.32 11.32L212.69 64h-11.75a72.12 72.12 0 0 0-58.59 30.15l-1.2 1.67A8 8 0 0 0 143 107m-30 42a8 8 0 0 0-11.16 1.86l-1.2 1.67A56.1 56.1 0 0 1 55.06 176H32a8 8 0 0 0 0 16h23.06a72.12 72.12 0 0 0 58.59-30.15l1.2-1.67A8 8 0 0 0 113 149"/></g></svg>
      <span class="ff__label">再生成</span>
    </button>
    <button class="ff__btn" type="button" id="copy" data-done="コピーしました">
      <svg xmlns="http://www.w3.org/2000/svg" class="ff__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 40v128h-48V88H88V40Z" opacity=".2"/><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></g></svg>
      <span class="ff__label">SVGをコピー</span>
    </button>
  </div>
</div>
</main>
<script>
var root = document.getElementById('root');
var art = document.getElementById('art');
var num = document.getElementById('num');
var W = 240, H = 150, COLS = 5, ROWS = 3, GX = 9, GY = 6, STEPS = 30, STEP = 4.4;
var seed = 7;

// mulberry32 — 32비트 정수 シード 하나로 언제나 같은 난수열을 돌려준다. 재현 가능한 생성의 뿌리
function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 성긴 격자에 난수를 놓고 사이를 smoothstep 으로 이어 자리마다 하나의 각도를 준다 = 방향장
function makeAngles(s) {
  var rand = mulberry32(s), lat = [], r, c;
  for (r = 0; r <= ROWS; r++) { lat.push([]); for (c = 0; c <= COLS; c++) { lat[r].push(rand()); } }
  return function (x, y) {
    var gx = Math.max(0, Math.min(COLS - 0.001, x / W * COLS));
    var gy = Math.max(0, Math.min(ROWS - 0.001, y / H * ROWS));
    var ix = Math.floor(gx), iy = Math.floor(gy), fx = gx - ix, fy = gy - iy;
    var sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    var top = lat[iy][ix] + (lat[iy][ix + 1] - lat[iy][ix]) * sx;
    var bot = lat[iy + 1][ix] + (lat[iy + 1][ix + 1] - lat[iy + 1][ix]) * sx;
    return (top + (bot - top) * sy) * Math.PI * 3;
  };
}

// 한 점에서 시작해 그 자리의 각도로 한 걸음씩 옮기며 좌표를 이어 붙인다
function walk(angleAt, x, y) {
  var d = 'M' + x.toFixed(1) + ' ' + y.toFixed(1), i;
  for (i = 0; i < STEPS; i++) {
    var a = angleAt(x, y);
    x += Math.cos(a) * STEP;
    y += Math.sin(a) * STEP;
    if (x < -8 || x > W + 8 || y < -8 || y > H + 8) { break; }
    d += 'L' + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  return d;
}

function build() {
  var angleAt = makeAngles(seed), rand = mulberry32(seed + 991), parts = [], gx, gy;
  // 시작점을 흔들린 격자에서 뽑아 화면 전체에 고르게 깔리게 한다 (순수 난수면 한쪽에 뭉친다)
  for (gy = 0; gy < GY; gy++) {
    for (gx = 0; gx < GX; gx++) {
      var x = (gx + 0.15 + rand() * 0.7) / GX * W, y = (gy + 0.15 + rand() * 0.7) / GY * H;
      var tone = rand() < 0.34 ? 'b' : 'a';
      parts.push('<path class="ff__line ff__line--' + tone + '" style="--i:' + ((gx + gy) % 11) + '" pathLength="1" d="' + walk(angleAt, x, y) + '"/>');
    }
  }
  art.innerHTML = parts.join('');
  art.setAttribute('aria-label', art.getAttribute('data-label').replace('{n}', seed));
  num.textContent = seed;
}

document.getElementById('again').addEventListener('click', function () {
  seed = (seed * 7 + 13) % 991 + 1;
  build();
  root.classList.remove('is-demo');
  root.classList.remove('is-draw');
  void art.getBoundingClientRect().width;   // 한 번 읽어 리플로를 일으켜야 같은 애니메이션이 처음부터 다시 돈다
  root.classList.add('is-draw');
});

var copyBtn = document.getElementById('copy');
copyBtn.addEventListener('click', function () {
  var label = copyBtn.querySelector('.ff__label');
  var before = label.textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(art.outerHTML).catch(function () {});
  }
  label.textContent = copyBtn.getAttribute('data-done');
  setTimeout(function () { label.textContent = before; }, 1200);
});

build();
</script>
</body>
</html>
