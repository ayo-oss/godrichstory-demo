<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eight-Way Tile Walk with Sticky Sector Borders — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="Virtual joystick stage: click it, then tilt with the arrow keys">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="While the thumb trembles near a border on the eight sectors around the stick, the character with a margin angle walks one way and the one without it walks in a zigzag"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">Direction center · strength 0%</p>
  <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 따라가기 몫 — 1 − e^(−rate·dt). 프레임 시간이 달라도 1초 동안 다가가는 양이 같다
    function follow(rate, dt) { return 1 - Math.exp(-rate * dt); }
    // 시드 고정 난수 — 같은 시드면 같은 시연 (32비트 xorshift 에 곱셈 섞기 한 번)
    function seeded(seed) {
        let s = (seed * 2654435761) >>> 0 || 1;
        return function () {
            s ^= s << 13;
            s >>>= 0;
            s ^= s >>> 17;
            s ^= s << 5;
            s >>>= 0;
            return (Math.imul(s, 0x9e3779b1) >>> 0) / 4294967296;
        };
    }
    // 각도 차를 −π~π 로 감는다 — 350° 와 10° 의 차는 −340° 가 아니라 20°
    function wrapAngle(a) {
        let r = (a + Math.PI) % TAU;
        if (r < 0) {
            r += TAU;
        }
        return r - Math.PI;
    }
    function toDeg(rad) { return rad * 180 / Math.PI; }
    function makeStick(bx, by, R) {
        return { bx: bx, by: by, R: R, tx: bx, ty: by, down: false, rx: 0, ry: 0, kx: 0, ky: 0, hx: bx, hy: by, hdown: false };
    }
    function readRaw(s) {
        if (!s.down) {
            s.rx = 0;
            s.ry = 0;
            return;
        }
        let x = (s.tx - s.bx) / s.R;
        let y = (s.ty - s.by) / s.R;
        const m = Math.hypot(x, y);
        if (m > 1) {
            x /= m;
            y /= m;
        }
        s.rx = x;
        s.ry = y;
    }
    // Round deadzone — 길이 m 이 dz 안이면 0, 밖이면 (m − dz)/(1 − dz) 로 0~1 을 다시 펴고 방향은 그대로
    function radialDeadzone(x, y, dz) {
        const m = Math.hypot(x, y);
        if (m <= dz || m === 0) {
            return [0, 0];
        }
        const k = clamp((m - dz) / (1 - dz), 0, 1) / m;
        return [x * k, y * k];
    }
    // 화면에 보이는 손잡이(kx, ky) — raw 를 빠르게 따라간다(02 는 스프링으로 따로)
    const KNOB_FOLLOW_RATE = 28;
    function followKnob(s, dt) {
        const f = follow(KNOB_FOLLOW_RATE, dt);
        s.kx += (s.rx - s.kx) * f;
        s.ky += (s.ry - s.ky) * f;
    }
    function snapKnob(s) { s.kx = s.rx; s.ky = s.ry; }
    // ── 방향 이름 ────────────────────────────────────────────────
    // 0 = right, 화면 시계 방향(아래가 +y)으로 45° 씩
    const DIR_NAMES = ['right', 'down-right', 'down', 'down-left', 'left', 'up-left', 'up', 'up-right'];
    const CENTER_NAME = 'center';
    function sectorOf(x, y) {
        const k = Math.round(Math.atan2(y, x) / (Math.PI / 4));
        return ((k % 8) + 8) % 8;
    }
    // 상태 줄 한 마디 — 세기는 5% 단위로 반올림해 글자가 매 프레임 바뀌지 않게
    function dirText(x, y) {
        const m = Math.hypot(x, y);
        const pct = Math.round(clamp(m, 0, 1) * 20) * 5;
        if (pct === 0) {
            return 'Direction {d} · strength {s}%'.replace('{d}', CENTER_NAME).replace('{s}', '0');
        }
        return 'Direction {d} · strength {s}%'.replace('{d}', DIR_NAMES[sectorOf(x, y)]).replace('{s}', String(pct));
    }
    function pathAt(keys, t) {
        if (t <= keys[0][0]) {
            return { x: keys[0][1], y: keys[0][2], down: keys[0][3] > 0 };
        }
        for (let k = 0; k < keys.length - 1; k += 1) {
            const a = keys[k];
            const b = keys[k + 1];
            if (t < b[0]) {
                const u = ease((t - a[0]) / (b[0] - a[0]));
                return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), down: a[3] > 0 };
            }
        }
        const z = keys[keys.length - 1];
        return { x: z[1], y: z[2], down: z[3] > 0 };
    }
    // 손떨림 — 시드로 뽑은 주파수·위상의 사인 셋을 더한 값(크기 amp 안팎). 같은 시드면 같은 떨림
    function makeTremor(seed) {
        const r = seeded(seed);
        const f = [];
        const p = [];
        for (let k = 0; k < 6; k += 1) {
            f.push(5 + r() * 9);
            p.push(r() * TAU);
        }
        return function (t, amp) {
            const x = Math.sin(t * f[0] + p[0]) * 0.5 + Math.sin(t * f[1] + p[1]) * 0.3 + Math.sin(t * f[2] + p[2]) * 0.2;
            const y = Math.sin(t * f[3] + p[3]) * 0.5 + Math.sin(t * f[4] + p[4]) * 0.3 + Math.sin(t * f[5] + p[5]) * 0.2;
            return [x * amp, y * amp];
        };
    }
    // 장면 시계(초) — 장면 계산이 고치고 화면 쪽이 읽는다
    let sceneT = 0;
    // 자동 시연이 스틱을 움직이는가 — 사람이 무대에서 처음 손대면 꺼진다
    let autoOn = true;
    // 방향키 스틱 값(스틱마다) — 화면 쪽이 눌린 키로 고친다
    const keyX = [0, 0];
    const keyY = [0, 0];
    const keyOn = [false, false];
    // 스틱 입력원 고르기 — 자동 시연 → 방향키 → 포인터 순
    function driveSticks(list, auto) {
        for (let i = 0; i < list.length; i += 1) {
            const s = list[i];
            if (autoOn) {
                const p = auto(i, sceneT);
                s.tx = p.x;
                s.ty = p.y;
                s.down = p.down;
            }
            else if (keyOn[i]) {
                s.tx = s.bx + keyX[i] * s.R;
                s.ty = s.by + keyY[i] * s.R;
                s.down = true;
            }
            else {
                s.tx = s.hx;
                s.ty = s.hy;
                s.down = s.hdown;
            }
            readRaw(s);
        }
    }
    // 파스텔 팔레트 — 글자·선은 진한 쪽으로 명도 차를 둔다
    const PAPER = [250, 246, 240];
    const PAPER_DIM = [234, 228, 220];
    const INK = [40, 36, 54];
    const INK_SOFT = [110, 102, 124];
    const LAVENDER = [196, 184, 240];
    const MINT = [166, 220, 200];
    const BUTTER = [247, 226, 156];
    const CORAL = [244, 174, 158];
    const SKY = [180, 212, 240];
    const PINK = [244, 196, 214];
    const VIOLET_DEEP = [86, 62, 160];
    const MINT_DEEP = [32, 110, 86];
    const CORAL_DEEP = [176, 66, 54];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function fillAll(c) {
        ctx.fillStyle = rgba(c, 1);
        ctx.fillRect(0, 0, W, H);
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function seg(x1, y1, x2, y2, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 글자 이름표 — 바탕 알약 위에 진한 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    // 화살표 — 끝에 작은 머리
    function arrow(x1, y1, x2, y2, width, c, a) {
        const len = Math.hypot(x2 - x1, y2 - y1);
        if (len < 2) {
            return;
        }
        seg(x1, y1, x2, y2, width, c, a);
        const ang = Math.atan2(y2 - y1, x2 - x1);
        const hl = Math.min(10, len * 0.5);
        seg(x2, y2, x2 - Math.cos(ang - 0.5) * hl, y2 - Math.sin(ang - 0.5) * hl, width, c, a);
        seg(x2, y2, x2 - Math.cos(ang + 0.5) * hl, y2 - Math.sin(ang + 0.5) * hl, width, c, a);
    }
    // 받침 — 옅은 원판과 테두리
    function drawBase(x, y, R, a) {
        disc(x, y, R, PAPER_DIM, 0.78 * a);
        ring(x, y, R, 2, INK, 0.28 * a);
        seg(x - R * 0.2, y, x + R * 0.2, y, 1, INK, 0.2 * a);
        seg(x, y - R * 0.2, x, y + R * 0.2, 1, INK, 0.2 * a);
    }
    // 손잡이 — 받침 가운데에서 (kx, ky)·R 만큼 떨어진 자리
    function drawKnob(s, c, a) {
        const x = s.bx + s.kx * s.R;
        const y = s.by + s.ky * s.R;
        const r = s.R * 0.44;
        disc(x + 2, y + 4, r, INK, 0.16 * a);
        disc(x, y, r, c, a);
        ring(x, y, r, 2, INK, 0.45 * a);
        disc(x - r * 0.3, y - r * 0.32, r * 0.32, PAPER, 0.5 * a);
    }
    // 가상 엄지 — 닿아 있는 동안 반투명 원
    function drawThumb(x, y, on) {
        if (!on) {
            return;
        }
        disc(x, y, 17, INK, 0.16);
        ring(x, y, 17, 2, INK, 0.38);
    }
    // 상태 줄 — 글자가 바뀔 때만 고친다
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    // ── 04 경계가 끈끈한 8방향 타일 걷기 ──────────────────────────
    // 각도 θ 를 45° 칸 여덟 개로: 칸 = round(θ / 45°). 지금 칸이 있으면 그 칸 가운데에서 22.5° + HYSTERESIS_DEG 안까지는 바꾸지 않는다
    const HYSTERESIS_DEG = 8;
    // 세기가 이보다 작으면 방향 없음(제자리)
    const WALK_DEADZONE = 0.3;
    // 한 칸 걷는 데 드는 시간(초)
    const TILE_STEP_S = 0.2;
    const LOOP_S = 4.8;
    const TILE = 26;
    const GRID_X = 160;
    const GRID_Y = 42;
    const COLS = 12;
    const ROWS = 9;
    const STEP_C = [1, 1, 0, -1, -1, -1, 0, 1];
    const STEP_R = [0, 1, 1, 1, 0, -1, -1, -1];
    const sticks = [makeStick(80, 160, 58)];
    // 가상 엄지 — 열쇠는 [시각, 각도(도), 세기, 닿음]. right/down-right 경계(22.5°) 근처에서 떨다가, left 아래로, 다시 up/up-left 경계(247.5°) 근처로
    const PATH_04 = [
        [0, 22.5, 0, 0], [0.22, 22.5, 0, 1], [0.42, 22.5, 0.86, 1], [2.3, 23.5, 0.86, 1], [2.55, 135, 0.86, 1], [3.1, 135, 0.86, 1],
        [3.35, 247.5, 0.86, 1], [4.4, 246.5, 0.86, 1], [4.6, 246.5, 0, 1], [4.8, 246.5, 0, 0]
    ];
    const tremor04 = makeTremor(404);
    // 손떨림 크기(도) — 경계를 이만큼 넘나든다
    const TREMOR_DEG = 6;
    function autoPose(i, t) {
        const s = sticks[i];
        const p = pathAt(PATH_04, t);
        const a = (p.x + tremor04(t, TREMOR_DEG)[0]) * Math.PI / 180;
        return { x: s.bx + Math.cos(a) * p.y * s.R, y: s.by + Math.sin(a) * p.y * s.R, down: p.down };
    }
    // 칸 판정 — 여유 각 hyst(도)를 둔 판(sticky)과 0 인 판(bare)
    function pickSector(x, y, cur, hyst) {
        if (Math.hypot(x, y) < WALK_DEADZONE) {
            return -1;
        }
        const th = Math.atan2(y, x);
        if (cur >= 0 && Math.abs(toDeg(wrapAngle(th - cur * Math.PI / 4))) <= 22.5 + hyst) {
            return cur;
        }
        return sectorOf(x, y);
    }
    function makeWalker(c, r) { return { c: c, r: r, tc: c, tr: r, t: 0, moving: false, dir: -1, changes: 0, trail: [], face: 0 }; }
    const sticky = makeWalker(2, 2);
    const bare = makeWalker(2, 6);
    function decide(w, hyst) {
        const s = sticks[0];
        const d = pickSector(s.rx, s.ry, w.dir, hyst);
        if (d >= 0 && w.dir >= 0 && d !== w.dir) {
            w.changes += 1;
        }
        w.dir = d;
    }
    function stepWalker(w, dt) {
        if (w.moving) {
            w.t += dt / TILE_STEP_S;
            if (w.t >= 1) {
                w.c = ((w.tc % COLS) + COLS) % COLS;
                w.r = ((w.tr % ROWS) + ROWS) % ROWS;
                w.moving = false;
                w.t = 0;
                w.trail.push(w.c, w.r);
                while (w.trail.length > 28) {
                    w.trail.splice(0, 2);
                }
            }
        }
        if (!w.moving && w.dir >= 0) {
            w.tc = w.c + STEP_C[w.dir];
            w.tr = w.r + STEP_R[w.dir];
            w.face = w.dir;
            w.moving = true;
            w.t = 0;
        }
    }
    function resetWalker(w, c, r) {
        w.c = c;
        w.r = r;
        w.tc = c;
        w.tr = r;
        w.t = 0;
        w.moving = false;
        w.dir = -1;
        w.changes = 0;
        w.trail.length = 0;
        w.face = 0;
    }
    function reset() {
        const s = sticks[0];
        s.kx = 0;
        s.ky = 0;
        s.rx = 0;
        s.ry = 0;
        s.down = false;
        resetWalker(sticky, 2, 2);
        resetWalker(bare, 2, 6);
    }
    function update(dt) {
        driveSticks(sticks, autoPose);
        followKnob(sticks[0], dt);
        decide(sticky, HYSTERESIS_DEG);
        decide(bare, 0);
        stepWalker(sticky, dt);
        stepWalker(bare, dt);
    }
    function restPose() {
        const s = sticks[0];
        s.down = true;
        s.tx = s.bx + Math.cos(0.3) * 0.86 * s.R;
        s.ty = s.by + Math.sin(0.3) * 0.86 * s.R;
        readRaw(s);
        snapKnob(s);
        decide(sticky, HYSTERESIS_DEG);
        decide(bare, 0);
        sticky.c = 6;
        sticky.face = sticky.dir;
        bare.c = 6;
        bare.face = bare.dir;
    }
    // 멈춘 화면 — 지금 방향으로 한 칸을 걸은 자리에 바로 놓는다
    function settle() {
        driveSticks(sticks, autoPose);
        snapKnob(sticks[0]);
        for (const w of [sticky, bare]) {
            decide(w, w === sticky ? HYSTERESIS_DEG : 0);
            if (w.moving) {
                w.c = ((w.tc % COLS) + COLS) % COLS;
                w.r = ((w.tr % ROWS) + ROWS) % ROWS;
                w.moving = false;
                w.t = 0;
            }
            if (w.dir >= 0) {
                w.c = (((w.c + STEP_C[w.dir]) % COLS) + COLS) % COLS;
                w.r = (((w.r + STEP_R[w.dir]) % ROWS) + ROWS) % ROWS;
                w.face = w.dir;
            }
        }
    }
    function mapPointer(x, y) { return x < GRID_X ? [0, x, y] : [-1, x, y]; }
    function statusText() {
        const s = sticks[0];
        const pct = Math.round(clamp(Math.hypot(s.rx, s.ry), 0, 1) * 20) * 5;
        return 'Direction {d} · strength {s}%'.replace('{d}', sticky.dir < 0 ? CENTER_NAME : DIR_NAMES[sticky.dir]).replace('{s}', String(pct));
    }
    function wedge(x, y, r0, r1, a0, a1) {
        ctx.beginPath();
        ctx.arc(x, y, r1, a0, a1);
        ctx.arc(x, y, r0, a1, a0, true);
        ctx.closePath();
    }
    function walkerPos(w) {
        const u = ease(w.t);
        const c = w.moving ? lerp(w.c, w.tc, u) : w.c;
        const r = w.moving ? lerp(w.r, w.tr, u) : w.r;
        const hop = w.moving ? Math.sin(Math.PI * w.t) : 0;
        return [GRID_X + (((c % COLS) + COLS) % COLS + 0.5) * TILE, GRID_Y + (((r % ROWS) + ROWS) % ROWS + 0.5) * TILE, hop];
    }
    function drawWalker(w, body, deep) {
        for (let k = 0; k < w.trail.length / 2; k += 1) {
            const a = 0.12 + 0.4 * k / (w.trail.length / 2);
            box(GRID_X + w.trail[k * 2] * TILE + 3, GRID_Y + w.trail[k * 2 + 1] * TILE + 3, TILE - 6, TILE - 6, 6, body, a);
        }
        const p = walkerPos(w);
        const x = p[0];
        const y = p[1] - p[2] * 7;
        disc(p[0], p[1] + 9, 9 - p[2] * 3, INK, 0.16);
        ctx.beginPath();
        ctx.ellipse(x, y, 11 * (1 + 0.08 * p[2]), 11 * (1 - 0.08 * p[2]), 0, 0, TAU);
        ctx.fillStyle = rgba(body, 1);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = rgba(deep, 0.9);
        ctx.stroke();
        const fa = w.face * Math.PI / 4;
        const ex = Math.cos(fa) * 4;
        const ey = Math.sin(fa) * 4;
        disc(x + ex - Math.sin(fa) * 4, y + ey + Math.cos(fa) * 4 - 1, 2.2, INK, 1);
        disc(x + ex + Math.sin(fa) * 4, y + ey - Math.cos(fa) * 4 - 1, 2.2, INK, 1);
    }
    function draw() {
        fillAll(PAPER);
        for (let r = 0; r < ROWS; r += 1) {
            for (let c = 0; c < COLS; c += 1) {
                box(GRID_X + c * TILE + 1, GRID_Y + r * TILE + 1, TILE - 2, TILE - 2, 4, (r + c) % 2 ? PAPER_DIM : mix(PAPER_DIM, SKY, 0.25), 1);
            }
        }
        drawWalker(bare, CORAL, CORAL_DEEP);
        drawWalker(sticky, MINT, MINT_DEEP);
        // 스틱 둘레 여덟 칸
        const s = sticks[0];
        const R = s.R;
        for (let k = 0; k < 8; k += 1) {
            const a0 = (k * 45 - 22.5) * Math.PI / 180;
            const a1 = (k * 45 + 22.5) * Math.PI / 180;
            wedge(s.bx, s.by, R * WALK_DEADZONE, R + 10, a0 + 0.02, a1 - 0.02);
            ctx.fillStyle = rgba(k === sticky.dir ? MINT : PAPER_DIM, k === sticky.dir ? 0.9 : 0.8);
            ctx.fill();
            if (k === bare.dir) {
                ctx.lineWidth = 3;
                ctx.strokeStyle = rgba(CORAL_DEEP, 0.9);
                ctx.stroke();
            }
        }
        // 지금 칸의 여유 각 — 경계를 HYSTERESIS_DEG 만큼 바깥으로 밀어 둔 범위
        if (sticky.dir >= 0) {
            const a0 = (sticky.dir * 45 - 22.5 - HYSTERESIS_DEG) * Math.PI / 180;
            const a1 = (sticky.dir * 45 + 22.5 + HYSTERESIS_DEG) * Math.PI / 180;
            ctx.setLineDash([4, 3]);
            wedge(s.bx, s.by, R + 12, R + 18, a0, a1);
            ctx.fillStyle = rgba(MINT_DEEP, 0.55);
            ctx.fill();
            ctx.setLineDash([]);
        }
        ring(s.bx, s.by, R * WALK_DEADZONE, 1.5, INK, 0.35);
        drawKnob(s, LAVENDER, 1);
        drawThumb(s.tx, s.ty, s.down);
        tag('Margin {h}° · changes {n}'.replace('{h}', String(HYSTERESIS_DEG)).replace('{n}', String(sticky.changes)), 80, 252, MINT, INK, 10, 'center');
        tag('No margin · changes {n}'.replace('{n}', String(bare.changes)), 80, 276, CORAL, INK, 10, 'center');
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 사람이 스틱을 잡으면 자동 시연은 손을 뗀다
    function takeOver() {
        wake();
        autoOn = false;
    }
    // 멈춘 화면(움직임 줄이기·Pause)에서 들어온 입력은 넘침·관성 없이 결과 자리로 바로 그린다
    function showNow() {
        if (still || paused) {
            settle();
            draw();
            pushStatus(statusText());
        }
    }
    // 한 프레임에 넘기는 시간 상한(초) — 오래 숨었다 돌아온 첫 프레임도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    // 방향키를 누르고 있으면 스틱 값이 이 빠르기로 끝까지 차오른다 — 짧게 톡 치면 작은 기울기
    const KEY_RAMP_RATE = 7;
    const held = {};
    let keyStick = 0;
    function keyTarget() {
        let x = (held.ArrowRight ? 1 : 0) - (held.ArrowLeft ? 1 : 0);
        let y = (held.ArrowDown ? 1 : 0) - (held.ArrowUp ? 1 : 0);
        const m = Math.hypot(x, y);
        if (m > 0) {
            x /= m;
            y /= m;
        }
        return [x, y];
    }
    function anyHeld() { return !!(held.ArrowRight || held.ArrowLeft || held.ArrowDown || held.ArrowUp); }
    function rampKeys(dt) {
        const t = keyTarget();
        for (let i = 0; i < keyOn.length; i += 1) {
            const tx = i === keyStick ? t[0] : 0;
            const ty = i === keyStick ? t[1] : 0;
            if (dt <= 0) {
                keyX[i] = tx;
                keyY[i] = ty;
            }
            else {
                const f = follow(KEY_RAMP_RATE, dt);
                keyX[i] += (tx - keyX[i]) * f;
                keyY[i] += (ty - keyY[i]) * f;
            }
            keyOn[i] = (i === keyStick && anyHeld()) || Math.hypot(keyX[i], keyY[i]) > 0.02;
            if (!keyOn[i] && !(i === keyStick && anyHeld())) {
                keyX[i] = 0;
                keyY[i] = 0;
            }
        }
    }
    function advance(dt) {
        sceneT += dt;
        if (autoOn && sceneT >= LOOP_S) {
            sceneT -= LOOP_S;
            reset();
        }
        update(dt);
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            rampKeys(dt);
            advance(dt);
        }
        draw();
        pushStatus(statusText());
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 손잡이와 대상이 목표 자리에 놓인 정지 장면 한 장
    function showRest() {
        stopLoop();
        if (autoOn) {
            sceneT = 0;
            reset();
            restPose();
        }
        else {
            settle();
        }
        draw();
        pushStatus(statusText());
    }
    function play() {
        if (autoOn) {
            sceneT = 0;
            reset();
        }
        draw();
        pushStatus(statusText());
        if (!paused) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 방향키 — 무대에 포커스가 있을 때만. 무대 밖에서는 화살표가 원래대로 페이지를 스크롤한다.
    // Shift 를 함께 누르면 둘째 스틱(있을 때)
    const ARROWS = { ArrowLeft: true, ArrowUp: true, ArrowRight: true, ArrowDown: true };
    pad.addEventListener('keydown', function (e) {
        if (!ARROWS[e.key] || e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        e.preventDefault();
        takeOver();
        const want = e.shiftKey && sticks.length > 1 ? 1 : 0;
        if (want !== keyStick) {
            for (const k of Object.keys(held)) {
                held[k] = false;
            }
            keyStick = want;
        }
        held[e.key] = true;
        if (still || paused) {
            rampKeys(0);
        }
        showNow();
    }, { signal: off.signal });
    pad.addEventListener('keyup', function (e) {
        if (!ARROWS[e.key]) {
            return;
        }
        held[e.key] = false;
        if (still || paused) {
            rampKeys(0);
            showNow();
        }
    }, { signal: off.signal });
    pad.addEventListener('blur', function () {
        for (const k of Object.keys(held)) {
            held[k] = false;
        }
    }, { signal: off.signal });
    // 포인터 — 무대 안에서 누른 손가락만 잡는다(포인터 캡처: 무대 밖으로 나가도 그 손가락을 놓치지 않는다).
    // 스크롤 가로채기는 무대 상자에만 건 touch-action: none 으로 끝난다 — 무대 밖 터치는 페이지 스크롤 그대로
    const grabbed = {};
    function toStage(e) {
        const r = pad.getBoundingClientRect();
        return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
    }
    pad.addEventListener('pointerdown', function (e) {
        const p = toStage(e);
        const g = mapPointer(p[0], p[1]);
        if (g[0] < 0) {
            return;
        }
        const s = sticks[g[0]];
        takeOver();
        pad.setPointerCapture(e.pointerId);
        grabbed[String(e.pointerId)] = g[0];
        s.hdown = true;
        s.hx = g[1];
        s.hy = g[2];
        showNow();
    }, { signal: off.signal });
    pad.addEventListener('pointermove', function (e) {
        const i = grabbed[String(e.pointerId)];
        if (i === undefined) {
            return;
        }
        const p = toStage(e);
        const g = mapPointer(p[0], p[1]);
        sticks[i].hx = g[0] === i ? g[1] : p[0];
        sticks[i].hy = g[0] === i ? g[2] : p[1];
        showNow();
    }, { signal: off.signal });
    function release(e) {
        const i = grabbed[String(e.pointerId)];
        if (i === undefined) {
            return;
        }
        delete grabbed[String(e.pointerId)];
        sticks[i].hdown = false;
        showNow();
    }
    pad.addEventListener('pointerup', release, { signal: off.signal });
    pad.addEventListener('pointercancel', release, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 정지 장면, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw();
    }, { signal: off.signal });
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
