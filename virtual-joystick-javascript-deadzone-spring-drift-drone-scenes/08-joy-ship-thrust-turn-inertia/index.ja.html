<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>推力と回転の慣性で飛ぶ宇宙船と噴射の粒 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="バーチャルジョイスティックの舞台 — 押してから矢印キーで傾ける">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="夜空の宇宙船がスティックの向きへばねのように回って前へ押され、噴射の粒が宇宙船の速さを受けついで後ろへ散りながら薄れます"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">向き 中央・強さ 0%</p>
  <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 따라가기 몫 — 1 − e^(−rate·dt). 프레임 시간이 달라도 1초 동안 다가가는 양이 같다
    function follow(rate, dt) { return 1 - Math.exp(-rate * dt); }
    // 시드 고정 난수 — 같은 시드면 같은 시연 (32비트 xorshift 에 곱셈 섞기 한 번)
    function seeded(seed) {
        let s = (seed * 2654435761) >>> 0 || 1;
        return function () {
            s ^= s << 13;
            s >>>= 0;
            s ^= s >>> 17;
            s ^= s << 5;
            s >>>= 0;
            return (Math.imul(s, 0x9e3779b1) >>> 0) / 4294967296;
        };
    }
    // 각도 차를 −π~π 로 감는다 — 350° 와 10° 의 차는 −340° 가 아니라 20°
    function wrapAngle(a) {
        let r = (a + Math.PI) % TAU;
        if (r < 0) {
            r += TAU;
        }
        return r - Math.PI;
    }
    function toDeg(rad) { return rad * 180 / Math.PI; }
    function makeStick(bx, by, R) {
        return { bx: bx, by: by, R: R, tx: bx, ty: by, down: false, rx: 0, ry: 0, kx: 0, ky: 0, hx: bx, hy: by, hdown: false };
    }
    function readRaw(s) {
        if (!s.down) {
            s.rx = 0;
            s.ry = 0;
            return;
        }
        let x = (s.tx - s.bx) / s.R;
        let y = (s.ty - s.by) / s.R;
        const m = Math.hypot(x, y);
        if (m > 1) {
            x /= m;
            y /= m;
        }
        s.rx = x;
        s.ry = y;
    }
    // 円形デッドゾーン — 길이 m 이 dz 안이면 0, 밖이면 (m − dz)/(1 − dz) 로 0~1 을 다시 펴고 방향은 그대로
    function radialDeadzone(x, y, dz) {
        const m = Math.hypot(x, y);
        if (m <= dz || m === 0) {
            return [0, 0];
        }
        const k = clamp((m - dz) / (1 - dz), 0, 1) / m;
        return [x * k, y * k];
    }
    // 화면에 보이는 손잡이(kx, ky) — raw 를 빠르게 따라간다(02 는 스프링으로 따로)
    const KNOB_FOLLOW_RATE = 28;
    function followKnob(s, dt) {
        const f = follow(KNOB_FOLLOW_RATE, dt);
        s.kx += (s.rx - s.kx) * f;
        s.ky += (s.ry - s.ky) * f;
    }
    function snapKnob(s) { s.kx = s.rx; s.ky = s.ry; }
    // ── 방향 이름 ────────────────────────────────────────────────
    // 0 = 右, 화면 시계 방향(아래가 +y)으로 45° 씩
    const DIR_NAMES = ['右', '右下', '下', '左下', '左', '左上', '上', '右上'];
    const CENTER_NAME = '中央';
    function sectorOf(x, y) {
        const k = Math.round(Math.atan2(y, x) / (Math.PI / 4));
        return ((k % 8) + 8) % 8;
    }
    // 상태 줄 한 마디 — 세기는 5% 단위로 반올림해 글자가 매 프레임 바뀌지 않게
    function dirText(x, y) {
        const m = Math.hypot(x, y);
        const pct = Math.round(clamp(m, 0, 1) * 20) * 5;
        if (pct === 0) {
            return '向き {d}・強さ {s}%'.replace('{d}', CENTER_NAME).replace('{s}', '0');
        }
        return '向き {d}・強さ {s}%'.replace('{d}', DIR_NAMES[sectorOf(x, y)]).replace('{s}', String(pct));
    }
    function pathAt(keys, t) {
        if (t <= keys[0][0]) {
            return { x: keys[0][1], y: keys[0][2], down: keys[0][3] > 0 };
        }
        for (let k = 0; k < keys.length - 1; k += 1) {
            const a = keys[k];
            const b = keys[k + 1];
            if (t < b[0]) {
                const u = ease((t - a[0]) / (b[0] - a[0]));
                return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), down: a[3] > 0 };
            }
        }
        const z = keys[keys.length - 1];
        return { x: z[1], y: z[2], down: z[3] > 0 };
    }
    // 손떨림 — 시드로 뽑은 주파수·위상의 사인 셋을 더한 값(크기 amp 안팎). 같은 시드면 같은 떨림
    function makeTremor(seed) {
        const r = seeded(seed);
        const f = [];
        const p = [];
        for (let k = 0; k < 6; k += 1) {
            f.push(5 + r() * 9);
            p.push(r() * TAU);
        }
        return function (t, amp) {
            const x = Math.sin(t * f[0] + p[0]) * 0.5 + Math.sin(t * f[1] + p[1]) * 0.3 + Math.sin(t * f[2] + p[2]) * 0.2;
            const y = Math.sin(t * f[3] + p[3]) * 0.5 + Math.sin(t * f[4] + p[4]) * 0.3 + Math.sin(t * f[5] + p[5]) * 0.2;
            return [x * amp, y * amp];
        };
    }
    // 장면 시계(초) — 장면 계산이 고치고 화면 쪽이 읽는다
    let sceneT = 0;
    // 자동 시연이 스틱을 움직이는가 — 사람이 무대에서 처음 손대면 꺼진다
    let autoOn = true;
    // 방향키 스틱 값(스틱마다) — 화면 쪽이 눌린 키로 고친다
    const keyX = [0, 0];
    const keyY = [0, 0];
    const keyOn = [false, false];
    // 스틱 입력원 고르기 — 자동 시연 → 방향키 → 포인터 순
    function driveSticks(list, auto) {
        for (let i = 0; i < list.length; i += 1) {
            const s = list[i];
            if (autoOn) {
                const p = auto(i, sceneT);
                s.tx = p.x;
                s.ty = p.y;
                s.down = p.down;
            }
            else if (keyOn[i]) {
                s.tx = s.bx + keyX[i] * s.R;
                s.ty = s.by + keyY[i] * s.R;
                s.down = true;
            }
            else {
                s.tx = s.hx;
                s.ty = s.hy;
                s.down = s.hdown;
            }
            readRaw(s);
        }
    }
    // 파스텔 팔레트 — 글자·선은 진한 쪽으로 명도 차를 둔다
    const PAPER = [250, 246, 240];
    const PAPER_DIM = [234, 228, 220];
    const INK = [40, 36, 54];
    const INK_SOFT = [110, 102, 124];
    const LAVENDER = [196, 184, 240];
    const MINT = [166, 220, 200];
    const BUTTER = [247, 226, 156];
    const CORAL = [244, 174, 158];
    const SKY = [180, 212, 240];
    const PINK = [244, 196, 214];
    const VIOLET_DEEP = [86, 62, 160];
    const MINT_DEEP = [32, 110, 86];
    const CORAL_DEEP = [176, 66, 54];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function fillAll(c) {
        ctx.fillStyle = rgba(c, 1);
        ctx.fillRect(0, 0, W, H);
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function seg(x1, y1, x2, y2, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 글자 이름표 — 바탕 알약 위에 진한 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    // 화살표 — 끝에 작은 머리
    function arrow(x1, y1, x2, y2, width, c, a) {
        const len = Math.hypot(x2 - x1, y2 - y1);
        if (len < 2) {
            return;
        }
        seg(x1, y1, x2, y2, width, c, a);
        const ang = Math.atan2(y2 - y1, x2 - x1);
        const hl = Math.min(10, len * 0.5);
        seg(x2, y2, x2 - Math.cos(ang - 0.5) * hl, y2 - Math.sin(ang - 0.5) * hl, width, c, a);
        seg(x2, y2, x2 - Math.cos(ang + 0.5) * hl, y2 - Math.sin(ang + 0.5) * hl, width, c, a);
    }
    // 받침 — 옅은 원판과 테두리
    function drawBase(x, y, R, a) {
        disc(x, y, R, PAPER_DIM, 0.78 * a);
        ring(x, y, R, 2, INK, 0.28 * a);
        seg(x - R * 0.2, y, x + R * 0.2, y, 1, INK, 0.2 * a);
        seg(x, y - R * 0.2, x, y + R * 0.2, 1, INK, 0.2 * a);
    }
    // 손잡이 — 받침 가운데에서 (kx, ky)·R 만큼 떨어진 자리
    function drawKnob(s, c, a) {
        const x = s.bx + s.kx * s.R;
        const y = s.by + s.ky * s.R;
        const r = s.R * 0.44;
        disc(x + 2, y + 4, r, INK, 0.16 * a);
        disc(x, y, r, c, a);
        ring(x, y, r, 2, INK, 0.45 * a);
        disc(x - r * 0.3, y - r * 0.32, r * 0.32, PAPER, 0.5 * a);
    }
    // 가상 엄지 — 닿아 있는 동안 반투명 원
    function drawThumb(x, y, on) {
        if (!on) {
            return;
        }
        disc(x, y, 17, INK, 0.16);
        ring(x, y, 17, 2, INK, 0.38);
    }
    // 상태 줄 — 글자가 바뀔 때만 고친다
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    // ── 08 추력과 회전 관성으로 나는 우주선과 배기 입자 ─────────────
    // 머리 방향을 스틱 방향으로 돌리는 스프링 — 각가속도 = TURN_STIFFNESS × (−π~π 로 감은 각도 차) − TURN_DAMPING × 각속도
    const TURN_STIFFNESS = 40;
    const TURN_DAMPING = 9;
    // 추력 = 스틱 세기 × MAX_THRUST (머리 방향), 저항 = 속도 × SHIP_DRAG — 끝 속도는 MAX_THRUST / SHIP_DRAG
    const MAX_THRUST = 300;
    const SHIP_DRAG = 1.1;
    const SHIP_DEADZONE = 0.12;
    // 불꽃 입자 — 우주선 속도를 물려받고 꼬리 쪽으로 EXHAUST_SPEED 의 0.7~1.3배를 더해, 1초에 세기 × EXHAUST_RATE 개
    const EXHAUST_SPEED = 120;
    const EXHAUST_RATE = 90;
    const EXHAUST_LIFE_S = 0.9;
    const SHIP_SUBSTEP = 1 / 240;
    const LOOP_S = 6;
    const sticks = [makeStick(66, 232, 40)];
    // 가상 엄지 — 열쇠는 [시각, 각도(도), 세기, 닿음]. 170° 에서 −170°(=190°) 로 넘어가는 구간이 있어 감기 없이는 반대로 340° 를 돈다
    const PATH_08 = [
        [0, -60, 0, 0], [0.22, -60, 0.2, 1], [0.5, -60, 0.95, 1], [1.0, 20, 0.95, 1], [1.5, 170, 0.9, 1], [1.8, 190, 0.9, 1],
        [2.6, 250, 0.7, 1], [3.0, 250, 0, 1], [3.6, 60, 0.95, 1], [4.4, -30, 0.9, 1], [5.2, -120, 0.8, 1], [5.6, -120, 0, 1], [6, -60, 0, 0]
    ];
    function autoPose(i, t) {
        const s = sticks[i];
        const p = pathAt(PATH_08, t);
        const a = p.x * Math.PI / 180;
        return { x: s.bx + Math.cos(a) * p.y * s.R, y: s.by + Math.sin(a) * p.y * s.R, down: p.down };
    }
    const ship = { x: 260, y: 170, vx: 0, vy: 0, th: -Math.PI / 2, om: 0, aim: -Math.PI / 2, thrust: 0 };
    // 입자 [x, y, vx, vy, 남은 수명] 다섯 칸씩
    const sparks = [];
    const rng08 = seeded(808);
    let spawnCarry = 0;
    function shipStep(h, m, dirA) {
        if (m > 0) {
            ship.aim = dirA;
        }
        const diff = wrapAngle(ship.aim - ship.th);
        ship.om += (TURN_STIFFNESS * diff - TURN_DAMPING * ship.om) * h;
        ship.th += ship.om * h;
        ship.thrust = m;
        const fx = Math.cos(ship.th);
        const fy = Math.sin(ship.th);
        ship.vx += (fx * m * MAX_THRUST - ship.vx * SHIP_DRAG) * h;
        ship.vy += (fy * m * MAX_THRUST - ship.vy * SHIP_DRAG) * h;
        ship.x += ship.vx * h;
        ship.y += ship.vy * h;
        spawnCarry += m * EXHAUST_RATE * h;
        while (spawnCarry >= 1) {
            spawnCarry -= 1;
            const spread = (rng08() - 0.5) * 0.9;
            const sp = EXHAUST_SPEED * (0.7 + rng08() * 0.6);
            const bx = Math.cos(ship.th + Math.PI + spread);
            const by = Math.sin(ship.th + Math.PI + spread);
            sparks.push(ship.x - fx * 14, ship.y - fy * 14, ship.vx + bx * sp, ship.vy + by * sp, EXHAUST_LIFE_S * (0.6 + rng08() * 0.4));
        }
    }
    function ageSparks(dt) {
        for (let k = 0; k < sparks.length; k += 5) {
            sparks[k] += sparks[k + 2] * dt;
            sparks[k + 1] += sparks[k + 3] * dt;
            sparks[k + 4] -= dt;
        }
        let w = 0;
        for (let k = 0; k < sparks.length; k += 5) {
            if (sparks[k + 4] > 0) {
                for (let j = 0; j < 5; j += 1) {
                    sparks[w + j] = sparks[k + j];
                }
                w += 5;
            }
        }
        sparks.length = w;
    }
    function wrapShip() {
        const M = 20;
        if (ship.x < -M) {
            ship.x += W + 2 * M;
        }
        else if (ship.x > W + M) {
            ship.x -= W + 2 * M;
        }
        if (ship.y < -M) {
            ship.y += H + 2 * M;
        }
        else if (ship.y > H + M) {
            ship.y -= H + 2 * M;
        }
    }
    function reset() {
        const s = sticks[0];
        s.kx = 0;
        s.ky = 0;
        s.rx = 0;
        s.ry = 0;
        s.down = false;
        ship.x = 260;
        ship.y = 170;
        ship.vx = 0;
        ship.vy = -40;
        ship.th = -Math.PI / 2;
        ship.om = 0;
        ship.aim = -Math.PI / 2;
        ship.thrust = 0;
        sparks.length = 0;
        spawnCarry = 0;
    }
    function update(dt) {
        const s = sticks[0];
        driveSticks(sticks, autoPose);
        followKnob(s, dt);
        const o = radialDeadzone(s.rx, s.ry, SHIP_DEADZONE);
        const m = Math.hypot(o[0], o[1]);
        const a = Math.atan2(o[1], o[0]);
        let left = dt;
        while (left > 1e-9) {
            const h = Math.min(SHIP_SUBSTEP, left);
            shipStep(h, m, a);
            left -= h;
        }
        ageSparks(dt);
        wrapShip();
    }
    function restPose() {
        const s = sticks[0];
        s.down = true;
        s.tx = s.bx + Math.cos(-0.5) * 0.8 * s.R;
        s.ty = s.by + Math.sin(-0.5) * 0.8 * s.R;
        readRaw(s);
        snapKnob(s);
        ship.x = 270;
        ship.y = 150;
        ship.th = -0.5;
        ship.aim = -0.5;
        ship.om = 0;
        ship.vx = 0;
        ship.vy = 0;
        ship.thrust = 0;
        sparks.length = 0;
    }
    // 멈춘 화면 — 머리를 스틱 방향에 바로 맞추고, 세기만큼 SETTLE_MOVE px 앞으로
    const SETTLE_MOVE = 30;
    function settle() {
        const s = sticks[0];
        driveSticks(sticks, autoPose);
        snapKnob(s);
        const o = radialDeadzone(s.rx, s.ry, SHIP_DEADZONE);
        const m = Math.hypot(o[0], o[1]);
        if (m > 0) {
            ship.th = Math.atan2(o[1], o[0]);
            ship.aim = ship.th;
        }
        ship.om = 0;
        ship.vx = 0;
        ship.vy = 0;
        ship.thrust = 0;
        ship.x += Math.cos(ship.th) * m * SETTLE_MOVE;
        ship.y += Math.sin(ship.th) * m * SETTLE_MOVE;
        sparks.length = 0;
        wrapShip();
    }
    function mapPointer(x, y) {
        const s = sticks[0];
        return Math.hypot(x - s.bx, y - s.by) < s.R * 2.4 ? [0, x, y] : [-1, x, y];
    }
    function statusText() { return dirText(sticks[0].rx, sticks[0].ry); }
    const NIGHT = [54, 50, 92];
    const NIGHT_LOW = [86, 74, 128];
    // 배경 별 — 시드로 뽑은 자리, 꾸밈 한 겹(움직이지 않는다)
    const stars = [];
    (function () {
        const r = seeded(88);
        for (let k = 0; k < 70; k += 1) {
            stars.push(r() * W, r() * H, 0.6 + r() * 1.6, 0.3 + r() * 0.6);
        }
    })();
    function draw() {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(NIGHT, 1));
        g.addColorStop(1, rgba(NIGHT_LOW, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        for (let k = 0; k < stars.length; k += 4) {
            disc(stars[k], stars[k + 1], stars[k + 2], PAPER, stars[k + 3]);
        }
        // 불꽃 입자 — 남은 수명만큼 진하고, 늙을수록 커지며 버터 → 산호 → 라벤더
        for (let k = 0; k < sparks.length; k += 5) {
            const life = clamp(sparks[k + 4] / EXHAUST_LIFE_S, 0, 1);
            const c = life > 0.5 ? mix(CORAL, BUTTER, (life - 0.5) * 2) : mix(LAVENDER, CORAL, life * 2);
            disc(sparks[k], sparks[k + 1], 2 + (1 - life) * 5, c, 0.85 * life);
        }
        // 머리 → 목표 방향의 감은 각도 차를 호로
        const diff = wrapAngle(ship.aim - ship.th);
        if (Math.abs(diff) > 0.02) {
            ctx.beginPath();
            ctx.arc(ship.x, ship.y, 34, ship.th, ship.th + diff, diff < 0);
            ctx.lineWidth = 4;
            ctx.strokeStyle = rgba(BUTTER, 0.75);
            ctx.stroke();
        }
        seg(ship.x, ship.y, ship.x + Math.cos(ship.aim) * 46, ship.y + Math.sin(ship.aim) * 46, 1.5, PAPER, 0.5);
        // 우주선
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.th);
        ctx.beginPath();
        ctx.moveTo(18, 0);
        ctx.lineTo(-12, 11);
        ctx.lineTo(-6, 0);
        ctx.lineTo(-12, -11);
        ctx.closePath();
        ctx.fillStyle = rgba(LAVENDER, 1);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = rgba(PAPER, 0.9);
        ctx.stroke();
        disc(4, 0, 3.5, SKY, 1);
        ctx.restore();
        const s = sticks[0];
        drawBase(s.bx, s.by, s.R, 1);
        drawKnob(s, LAVENDER, 1);
        drawThumb(s.tx, s.ty, s.down);
        tag('角度差 {a}°・速さ {v}'.replace('{a}', toDeg(diff).toFixed(0)).replace('{v}', Math.hypot(ship.vx, ship.vy).toFixed(0)), 468, 282, PAPER, INK, 10, 'right');
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 사람이 스틱을 잡으면 자동 시연은 손을 뗀다
    function takeOver() {
        wake();
        autoOn = false;
    }
    // 멈춘 화면(움직임 줄이기·一時停止)에서 들어온 입력은 넘침·관성 없이 결과 자리로 바로 그린다
    function showNow() {
        if (still || paused) {
            settle();
            draw();
            pushStatus(statusText());
        }
    }
    // 한 프레임에 넘기는 시간 상한(초) — 오래 숨었다 돌아온 첫 프레임도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    // 방향키를 누르고 있으면 스틱 값이 이 빠르기로 끝까지 차오른다 — 짧게 톡 치면 작은 기울기
    const KEY_RAMP_RATE = 7;
    const held = {};
    let keyStick = 0;
    function keyTarget() {
        let x = (held.ArrowRight ? 1 : 0) - (held.ArrowLeft ? 1 : 0);
        let y = (held.ArrowDown ? 1 : 0) - (held.ArrowUp ? 1 : 0);
        const m = Math.hypot(x, y);
        if (m > 0) {
            x /= m;
            y /= m;
        }
        return [x, y];
    }
    function anyHeld() { return !!(held.ArrowRight || held.ArrowLeft || held.ArrowDown || held.ArrowUp); }
    function rampKeys(dt) {
        const t = keyTarget();
        for (let i = 0; i < keyOn.length; i += 1) {
            const tx = i === keyStick ? t[0] : 0;
            const ty = i === keyStick ? t[1] : 0;
            if (dt <= 0) {
                keyX[i] = tx;
                keyY[i] = ty;
            }
            else {
                const f = follow(KEY_RAMP_RATE, dt);
                keyX[i] += (tx - keyX[i]) * f;
                keyY[i] += (ty - keyY[i]) * f;
            }
            keyOn[i] = (i === keyStick && anyHeld()) || Math.hypot(keyX[i], keyY[i]) > 0.02;
            if (!keyOn[i] && !(i === keyStick && anyHeld())) {
                keyX[i] = 0;
                keyY[i] = 0;
            }
        }
    }
    function advance(dt) {
        sceneT += dt;
        if (autoOn && sceneT >= LOOP_S) {
            sceneT -= LOOP_S;
            reset();
        }
        update(dt);
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            rampKeys(dt);
            advance(dt);
        }
        draw();
        pushStatus(statusText());
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 손잡이와 대상이 목표 자리에 놓인 정지 장면 한 장
    function showRest() {
        stopLoop();
        if (autoOn) {
            sceneT = 0;
            reset();
            restPose();
        }
        else {
            settle();
        }
        draw();
        pushStatus(statusText());
    }
    function play() {
        if (autoOn) {
            sceneT = 0;
            reset();
        }
        draw();
        pushStatus(statusText());
        if (!paused) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 방향키 — 무대에 포커스가 있을 때만. 무대 밖에서는 화살표가 원래대로 페이지를 스크롤한다.
    // Shift 를 함께 누르면 둘째 스틱(있을 때)
    const ARROWS = { ArrowLeft: true, ArrowUp: true, ArrowRight: true, ArrowDown: true };
    pad.addEventListener('keydown', function (e) {
        if (!ARROWS[e.key] || e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        e.preventDefault();
        takeOver();
        const want = e.shiftKey && sticks.length > 1 ? 1 : 0;
        if (want !== keyStick) {
            for (const k of Object.keys(held)) {
                held[k] = false;
            }
            keyStick = want;
        }
        held[e.key] = true;
        if (still || paused) {
            rampKeys(0);
        }
        showNow();
    }, { signal: off.signal });
    pad.addEventListener('keyup', function (e) {
        if (!ARROWS[e.key]) {
            return;
        }
        held[e.key] = false;
        if (still || paused) {
            rampKeys(0);
            showNow();
        }
    }, { signal: off.signal });
    pad.addEventListener('blur', function () {
        for (const k of Object.keys(held)) {
            held[k] = false;
        }
    }, { signal: off.signal });
    // 포인터 — 무대 안에서 누른 손가락만 잡는다(포인터 캡처: 무대 밖으로 나가도 그 손가락을 놓치지 않는다).
    // 스크롤 가로채기는 무대 상자에만 건 touch-action: none 으로 끝난다 — 무대 밖 터치는 페이지 스크롤 그대로
    const grabbed = {};
    function toStage(e) {
        const r = pad.getBoundingClientRect();
        return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
    }
    pad.addEventListener('pointerdown', function (e) {
        const p = toStage(e);
        const g = mapPointer(p[0], p[1]);
        if (g[0] < 0) {
            return;
        }
        const s = sticks[g[0]];
        takeOver();
        pad.setPointerCapture(e.pointerId);
        grabbed[String(e.pointerId)] = g[0];
        s.hdown = true;
        s.hx = g[1];
        s.hy = g[2];
        showNow();
    }, { signal: off.signal });
    pad.addEventListener('pointermove', function (e) {
        const i = grabbed[String(e.pointerId)];
        if (i === undefined) {
            return;
        }
        const p = toStage(e);
        const g = mapPointer(p[0], p[1]);
        sticks[i].hx = g[0] === i ? g[1] : p[0];
        sticks[i].hy = g[0] === i ? g[2] : p[1];
        showNow();
    }, { signal: off.signal });
    function release(e) {
        const i = grabbed[String(e.pointerId)];
        if (i === undefined) {
            return;
        }
        delete grabbed[String(e.pointerId)];
        sticks[i].hdown = false;
        showNow();
    }
    pad.addEventListener('pointerup', release, { signal: off.signal });
    pad.addEventListener('pointercancel', release, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 정지 장면, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw();
    }, { signal: off.signal });
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
