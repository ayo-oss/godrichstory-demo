<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move a cart line into the saved-for-later group — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="mv is-demo" id="mv" aria-label="カートとあとで買う">
    <div class="mv__group">
      <p class="mv__head">
        <span class="mv__label">カート</span>
        <output class="mv__n mv__swap"><span class="mv__v">2</span><span class="mv__alt" aria-hidden="true">1</span></output>
      </p>
      <ul class="mv__list" id="mv-cart">
        <li class="mv__row" data-pair="p1">
          <div class="mv__box"><div class="mv__in">
            <span class="mv__name">ラタンのかご</span>
            <span class="mv__price">24,000ウォン</span>
            <button class="mv__b" type="button" aria-label="ラタンのかごをあとで買うへ移す"><svg viewBox="0 0 256 256" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M192,48V224l-64-40L64,224V48a8,8,0,0,1,8-8H184A8,8,0,0,1,192,48Z" opacity="0.2"/><path d="M184,32H72A16,16,0,0,0,56,48V224a8,8,0,0,0,12.24,6.78L128,193.43l59.77,37.35A8,8,0,0,0,200,224V48A16,16,0,0,0,184,32Zm0,177.57-51.77-32.35a8,8,0,0,0-8.48,0L72,209.57V48H184Z"/></svg></button>
          </div></div>
        </li>
        <li class="mv__row" data-pair="p2">
          <div class="mv__box"><div class="mv__in">
            <span class="mv__name">リネンのエプロン</span>
            <span class="mv__price">16,000ウォン</span>
            <button class="mv__b" type="button" aria-label="リネンのエプロンをあとで買うへ移す"><svg viewBox="0 0 256 256" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M192,48V224l-64-40L64,224V48a8,8,0,0,1,8-8H184A8,8,0,0,1,192,48Z" opacity="0.2"/><path d="M184,32H72A16,16,0,0,0,56,48V224a8,8,0,0,0,12.24,6.78L128,193.43l59.77,37.35A8,8,0,0,0,200,224V48A16,16,0,0,0,184,32Zm0,177.57-51.77-32.35a8,8,0,0,0-8.48,0L72,209.57V48H184Z"/></svg></button>
          </div></div>
        </li>
      </ul>
    </div>
    <div class="mv__group">
      <p class="mv__head">
        <span class="mv__label">あとで買う</span>
        <output class="mv__n mv__swap"><span class="mv__v">0</span><span class="mv__alt" aria-hidden="true">1</span></output>
      </p>
      <ul class="mv__list" id="mv-saved">
        <li class="mv__row mv__row--saved is-out" data-pair="p1">
          <div class="mv__box"><div class="mv__in">
            <span class="mv__name">ラタンのかご</span>
            <span class="mv__price">24,000ウォン</span>
            <button class="mv__b mv__b--back" type="button" aria-label="ラタンのかごをカートに戻す"><svg viewBox="0 0 256 256" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M224,64l-12.16,66.86A16,16,0,0,1,196.1,144H70.55L56,64Z" opacity="0.2"/><path d="M230.14,58.87A8,8,0,0,0,224,56H62.68L56.6,22.57A8,8,0,0,0,48.73,16H24a8,8,0,0,0,0,16h18L67.56,172.29a24,24,0,0,0,5.33,11.27,28,28,0,1,0,44.4,8.44h45.42A27.75,27.75,0,0,0,160,204a28,28,0,1,0,28-28H91.17a8,8,0,0,1-7.87-6.57L80.13,152h116a24,24,0,0,0,23.61-19.71l12.16-66.86A8,8,0,0,0,230.14,58.87ZM104,204a12,12,0,1,1-12-12A12,12,0,0,1,104,204Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,200,204Zm4-74.57A8,8,0,0,1,196.1,136H77.22L65.59,72H214.41Z"/></svg></button>
          </div></div>
        </li>
        <li class="mv__row mv__row--saved is-out" data-pair="p2">
          <div class="mv__box"><div class="mv__in">
            <span class="mv__name">リネンのエプロン</span>
            <span class="mv__price">16,000ウォン</span>
            <button class="mv__b mv__b--back" type="button" aria-label="リネンのエプロンをカートに戻す"><svg viewBox="0 0 256 256" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M224,64l-12.16,66.86A16,16,0,0,1,196.1,144H70.55L56,64Z" opacity="0.2"/><path d="M230.14,58.87A8,8,0,0,0,224,56H62.68L56.6,22.57A8,8,0,0,0,48.73,16H24a8,8,0,0,0,0,16h18L67.56,172.29a24,24,0,0,0,5.33,11.27,28,28,0,1,0,44.4,8.44h45.42A27.75,27.75,0,0,0,160,204a28,28,0,1,0,28-28H91.17a8,8,0,0,1-7.87-6.57L80.13,152h116a24,24,0,0,0,23.61-19.71l12.16-66.86A8,8,0,0,0,230.14,58.87ZM104,204a12,12,0,1,1-12-12A12,12,0,0,1,104,204Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,200,204Zm4-74.57A8,8,0,0,1,196.1,136H77.22L65.59,72H214.41Z"/></svg></button>
          </div></div>
        </li>
      </ul>
    </div>
  </section>
</main>
<script>
// 같은 상품의 줄을 두 목록에 미리 한 벌씩 두고 is-out 으로 높이(1fr↔0fr)만 주고받는다.
// 옮기는 쪽이 접히는 만큼 받는 쪽이 열리므로 カード 전체 높이는 그대로다
var mv = document.getElementById('mv');
var mvCart = document.getElementById('mv-cart');
var mvSaved = document.getElementById('mv-saved');

function mvTwin(list, pair) { return list.querySelector('[data-pair="' + pair + '"]'); }
function mvCount() {
  var lists = [mvCart, mvSaved];
  for (var i = 0; i < lists.length; i++) {
    var open = lists[i].querySelectorAll('.mv__row:not(.is-out)').length;
    lists[i].parentNode.querySelector('.mv__n .mv__v').textContent = String(open);
  }
}
function mvMove(row, to) {
  mv.classList.remove('is-demo');
  row.classList.add('is-out');
  mvTwin(to, row.getAttribute('data-pair')).classList.remove('is-out');
  mvCount();
}
mv.addEventListener('click', function (e) {
  var btn = e.target.closest('.mv__b');
  if (!btn) { return; }
  var row = btn.closest('.mv__row');
  mvMove(row, mvCart.contains(row) ? mvSaved : mvCart);
});
</script>
</body>
</html>
