<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coupon discount line wedging into the order summary — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="cp is-demo" id="cp" aria-label="쿠폰 코드와 주문 요약">
    <p class="cp__title">주문 요약</p>
    <div class="cp__sum">
      <p class="cp__line">
        <span class="cp__k">상품 금액</span>
        <span class="cp__v" id="cp-items">32,000원</span>
      </p>
      <div class="cp__disc">
        <div class="cp__box">
          <p class="cp__line cp__line--disc">
            <span class="cp__k"><svg viewBox="0 0 256 256" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M200,128a32,32,0,0,0,32,32v32a8,8,0,0,1-8,8H96V56H224a8,8,0,0,1,8,8V96A32,32,0,0,0,200,128Z" opacity="0.2"/><path d="M232,104a8,8,0,0,0,8-8V64a16,16,0,0,0-16-16H32A16,16,0,0,0,16,64V96a8,8,0,0,0,8,8,24,24,0,0,1,0,48,8,8,0,0,0-8,8v32a16,16,0,0,0,16,16H224a16,16,0,0,0,16-16V160a8,8,0,0,0-8-8,24,24,0,0,1,0-48ZM32,167.2a40,40,0,0,0,0-78.4V64H88V192H32Zm192,0V192H104V64H224V88.8a40,40,0,0,0,0,78.4Z"/></svg>쿠폰 할인</span>
            <span class="cp__v cp__v--off" id="cp-off">-3,000원</span>
          </p>
        </div>
      </div>
      <p class="cp__line cp__line--total">
        <span class="cp__k">합계</span>
        <span class="cp__v cp__v--total cp__swap"><span class="cp__t" id="cp-totalv">32,000원</span><span class="cp__alt" aria-hidden="true">29,000원</span></span>
      </p>
    </div>
    <form class="cp__form" id="cp-form">
      <span class="cp__field">
        <input class="cp__code" id="cp-code" type="text" placeholder="쿠폰 코드" aria-label="쿠폰 코드" autocomplete="off">
        <span class="cp__ghost" aria-hidden="true">SAVE3000</span>
      </span>
      <button class="cp__go" type="submit">적용</button>
    </form>
    <p class="cp__msg" aria-live="polite"><span class="cp__msg-t" id="cp-msg"></span><span class="cp__msg-d" aria-hidden="true">쿠폰이 적용됐어요</span></p>
  </section>
</main>
<script>
// 적용을 누르면 상품 금액과 합계 사이의 칸이 0fr 에서 1fr 로 펴지며 할인 줄이 끼어들고,
// 합계 숫자가 다시 계산된다. 금액 서식은 화면의 상품 금액 글자에서 뽑아 언어팩을 따라간다
var cp = document.getElementById('cp');
var cpForm = document.getElementById('cp-form');
var cpCode = document.getElementById('cp-code');
var cpMsg = document.getElementById('cp-msg');
var cpItems = document.getElementById('cp-items');
var cpOff = document.getElementById('cp-off');
var cpTotalValue = document.getElementById('cp-totalv');
var cpValidCode = 'SAVE3000';
var cpOkText = '쿠폰이 적용됐어요';
var cpEmptyText = '쿠폰 코드를 입력해 주세요';
var cpWrongText = '없는 코드예요';

function cpComma(n) { return String(n).replace(/\B(?=(\d{3})+$)/g, ','); }
function cpAmount(text) { return Number(text.replace(/[^\d]/g, '')); }
function cpMoney(n) { return cpItems.textContent.replace(/[\d,]+/, cpComma(n)); }

function cpApply() {
  cp.classList.remove('is-demo');
  var code = cpCode.value.trim().toUpperCase();
  var on = code === cpValidCode;
  cp.classList.toggle('is-on', on);
  cpTotalValue.textContent = cpMoney(cpAmount(cpItems.textContent) - (on ? cpAmount(cpOff.textContent) : 0));
  cpMsg.textContent = on ? cpOkText : (code ? cpWrongText : cpEmptyText);
  cp.classList.add('is-said');
}
cpForm.addEventListener('submit', function (e) { e.preventDefault(); cpApply(); });
</script>
</body>
</html>
