<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipping fields that fold away and fill themselves in — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="sa is-demo" id="sa" aria-label="Shipping address form">
    <div class="sa__who" data-tel="010-2345-6789">
      <p class="sa__kicker">Orderer</p>
      <p class="sa__line">
        <span class="sa__ic" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M192,96a64,64,0,1,1-64-64A64,64,0,0,1,192,96Z" opacity="0.2"/><path d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"/></svg></span>
        <b class="sa__v" id="saWhoName">Kim Doyun</b>
      </p>
      <p class="sa__line">
        <span class="sa__ic" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M216,120v96H152V152H104v64H40V120a8,8,0,0,1,2.34-5.66l80-80a8,8,0,0,1,11.32,0l80,80A8,8,0,0,1,216,120Z" opacity="0.2"/><path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z"/></svg></span>
        <span class="sa__v" id="saWhoAddr">12 Yanghwa-ro, Mapo-gu, Seoul, 3F</span>
      </p>
    </div>

    <label class="sa__same">
      <input class="sa__box" type="checkbox" id="saSame" checked>
      <span class="sa__tick" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M232,56V200a16,16,0,0,1-16,16H40a16,16,0,0,1-16-16V56A16,16,0,0,1,40,40H216A16,16,0,0,1,232,56Z" opacity="0.2"/><path d="M205.66,85.66l-96,96a8,8,0,0,1-11.32,0l-40-40a8,8,0,0,1,11.32-11.32L104,164.69l90.34-90.35a8,8,0,0,1,11.32,11.32Z"/></svg></span>
      <span class="sa__label">Same as orderer</span>
    </label>

    <!-- 접혔을 때 남는 요약 한 줄 — 값은 JS 가 Orderer 칸에서 그대로 옮겨 적는다 -->
    <div class="sa__sumfold">
      <p class="sa__sum"><b class="sa__sumtext" id="saSum">Kim Doyun · 12 Yanghwa-ro, Mapo-gu, Seoul, 3F</b></p>
    </div>

    <div class="sa__fold" id="saFold" aria-hidden="true" inert>
      <div class="sa__inner">
        <p class="sa__field">
          <label class="sa__fk" for="saName">Recipient</label>
          <input class="sa__fv" id="saName" type="text" value="Kim Doyun">
        </p>
        <p class="sa__field">
          <label class="sa__fk" for="saAddr">Address</label>
          <input class="sa__fv" id="saAddr" type="text" value="12 Yanghwa-ro, Mapo-gu, Seoul, 3F">
        </p>
        <p class="sa__field">
          <label class="sa__fk" for="saTel">Phone</label>
          <input class="sa__fv" id="saTel" type="tel" value="010-2345-6789">
        </p>
      </div>
    </div>
  </section>
</main>
<script>
// Same as orderer — 배송지 칸 묶음을 접고, 접힌 칸은 초점에서 뺀다(inert). 값 복사도 여기서
var sa = document.getElementById('sa');
var same = document.getElementById('saSame');
var fold = document.getElementById('saFold');
var who = sa.querySelector('.sa__who');
var whoName = document.getElementById('saWhoName');
var whoAddr = document.getElementById('saWhoAddr');
var sum = document.getElementById('saSum');

function syncShipping() {
  sa.classList.remove('is-demo');                 // 사람이 손대면 미리보기 루프는 끝난다
  var folded = same.checked;
  fold.setAttribute('aria-hidden', folded ? 'true' : 'false');
  fold.toggleAttribute('inert', folded);          // 접힌 칸은 탭으로도 안 들어간다
  if (folded) {
    document.getElementById('saName').value = whoName.textContent.trim();
    document.getElementById('saAddr').value = whoAddr.textContent.trim();
    document.getElementById('saTel').value = who.getAttribute('data-tel');
    sum.textContent = whoName.textContent.trim() + ' · ' + whoAddr.textContent.trim();
  }
}

same.addEventListener('change', syncShipping);
</script>
</body>
</html>
