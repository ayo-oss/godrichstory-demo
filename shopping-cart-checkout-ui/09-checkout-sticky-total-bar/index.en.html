<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottom pay bar steps aside for the summary — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="co is-demo" id="co" aria-label="Order form and bottom pay bar">
    <div class="co__view" id="co-view" tabindex="0" role="region" aria-label="Order form">
      <div class="co__pad">
        <p class="co__title">Order form</p>

        <div class="co__item">
          <span class="co__thumb" aria-hidden="true"></span>
          <span class="co__name">Mug ×2</span>
          <span class="co__price">24,000 KRW</span>
        </div>
        <div class="co__item">
          <span class="co__thumb" aria-hidden="true"></span>
          <span class="co__name">T-shirt ×1</span>
          <span class="co__price">19,000 KRW</span>
        </div>
        <div class="co__item">
          <span class="co__thumb" aria-hidden="true"></span>
          <span class="co__name">Tote bag ×1</span>
          <span class="co__price">9,000 KRW</span>
        </div>
        <div class="co__item">
          <span class="co__thumb" aria-hidden="true"></span>
          <span class="co__name">Socks ×3</span>
          <span class="co__price">6,000 KRW</span>
        </div>

        <div class="co__sum" id="co-sum">
          <p class="co__sumHead">
            <span class="co__ic" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,56V208l-32-16-32,16-32-16L96,208,64,192,32,208V56a8,8,0,0,1,8-8H216A8,8,0,0,1,224,56Z" opacity="0.2"/><path d="M72,104a8,8,0,0,1,8-8h96a8,8,0,0,1,0,16H80A8,8,0,0,1,72,104Zm8,40h96a8,8,0,0,0,0-16H80a8,8,0,0,0,0,16ZM232,56V208a8,8,0,0,1-11.58,7.15L192,200.94l-28.42,14.21a8,8,0,0,1-7.16,0L128,200.94,99.58,215.15a8,8,0,0,1-7.16,0L64,200.94,35.58,215.15A8,8,0,0,1,24,208V56A16,16,0,0,1,40,40H216A16,16,0,0,1,232,56Zm-16,0H40V195.06l20.42-10.22a8,8,0,0,1,7.16,0L96,199.06l28.42-14.22a8,8,0,0,1,7.16,0L160,199.06l28.42-14.22a8,8,0,0,1,7.16,0L216,195.06Z"/></svg></span>
            Order summary
          </p>
          <p class="co__row"><span>Item total</span><span>58,000 KRW</span></p>
          <p class="co__row"><span>Shipping</span><span>3,000 KRW</span></p>
          <p class="co__row co__row--total"><span>Total</span><span>61,000 KRW</span></p>
        </div>
      </div>
    </div>

    <div class="co__bar" id="co-bar">
      <span class="co__barTotal">61,000 KRW</span>
      <button class="co__pay" type="button">
        <span class="co__ic" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M232,96v96a8,8,0,0,1-8,8H32a8,8,0,0,1-8-8V96Z" opacity="0.2"/><path d="M224,48H32A16,16,0,0,0,16,64V192a16,16,0,0,0,16,16H224a16,16,0,0,0,16-16V64A16,16,0,0,0,224,48Zm0,16V88H32V64Zm0,128H32V104H224v88Zm-16-24a8,8,0,0,1-8,8H168a8,8,0,0,1,0-16h32A8,8,0,0,1,208,168Zm-64,0a8,8,0,0,1-8,8H120a8,8,0,0,1,0-16h16A8,8,0,0,1,144,168Z"/></svg></span>
        Pay now
      </button>
    </div>
  </section>
</main>
<script>
// 주문 요약이 시야에 들어오면 하단 결제 바가 내려가 자리를 비운다.
// 「보이는가」 는 스크롤 좌표 계산이 아니라 IntersectionObserver 가 판정한다 — root 는 Order form 스크롤 상자.
var co = document.getElementById('co');
var view = document.getElementById('co-view');
var summary = document.getElementById('co-sum');
// 관찰자는 붙자마자 한 번 알려 주므로, 미리보기 루프는 사람이 실제로 스크롤할 때만 끈다
view.addEventListener('scroll', function () {
  co.classList.remove('is-demo');
}, { passive: true });
if (window.IntersectionObserver) {
  var watcher = new IntersectionObserver(function (entries) {
    for (var i = 0; i < entries.length; i++) {
      co.classList.toggle('is-down', entries[i].isIntersecting);
    }
  }, { root: view, threshold: 0.45 });
  watcher.observe(summary);
}
</script>
</body>
</html>
