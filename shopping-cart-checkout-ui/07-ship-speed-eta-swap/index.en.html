<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipping speed swaps the arrival date — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="sp is-demo" id="sp" aria-label="Choose a shipping speed">
    <header class="sp__head">
      <span class="sp__ic" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M248,120v64a8,8,0,0,1-8,8H216a24,24,0,0,0-48,0H104a24,24,0,0,0-48,0H32a8,8,0,0,1-8-8V144H184V120Z" opacity="0.2"/><path d="M255.42,117l-14-35A15.93,15.93,0,0,0,226.58,72H192V64a8,8,0,0,0-8-8H32A16,16,0,0,0,16,72V184a16,16,0,0,0,16,16H49a32,32,0,0,0,62,0h50a32,32,0,0,0,62,0h17a16,16,0,0,0,16-16V120A7.94,7.94,0,0,0,255.42,117ZM192,88h34.58l9.6,24H192ZM32,72H176v64H32ZM80,208a16,16,0,1,1,16-16A16,16,0,0,1,80,208Zm81-24H111a32,32,0,0,0-62,0H32V152H176v12.31A32.11,32.11,0,0,0,161,184Zm31,24a16,16,0,1,1,16-16A16,16,0,0,1,192,208Zm48-24H223a32.06,32.06,0,0,0-31-24V128h48Z"/></svg></span>
      <h2 class="sp__title">Shipping speed</h2>
    </header>

    <div class="sp__opts">
      <span class="sp__thumb" id="sp-thumb" aria-hidden="true"></span>
      <label class="sp__opt"><input class="sp__radio" type="radio" name="speed" value="0" checked><span class="sp__pill">Standard</span></label>
      <label class="sp__opt"><input class="sp__radio" type="radio" name="speed" value="1"><span class="sp__pill">Express</span></label>
      <label class="sp__opt"><input class="sp__radio" type="radio" name="speed" value="2"><span class="sp__pill">Dawn</span></label>
    </div>

    <p class="sp__line sp__eta">
      <span class="sp__ic sp__ic--sm" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a96,96,0,1,1-96-96A96,96,0,0,1,224,128Z" opacity="0.2"/><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z"/></svg></span>
      <span class="sp__label">Arrives</span>
      <span class="sp__win" aria-hidden="true"><span class="sp__roll">
        <span class="sp__cell">Thu, Sep 17</span>
        <span class="sp__cell">Mon, Sep 14</span>
        <span class="sp__cell">Sun, Sep 13</span>
      </span></span>
    </p>

    <p class="sp__line sp__line--fee">
      <span class="sp__label">Shipping</span>
      <span class="sp__win sp__win--fee" aria-hidden="true"><span class="sp__roll">
        <span class="sp__cell sp__cell--fee">3,000 KRW</span>
        <span class="sp__cell sp__cell--fee">5,000 KRW</span>
        <span class="sp__cell sp__cell--fee">7,000 KRW</span>
      </span></span>
    </p>

    <p class="sp__live" id="sp-live" aria-live="polite"></p>
  </section>
</main>
<script>
// 배송 방법을 고르면 --i 하나가 바뀌고, 도착 칩과 Shipping 칸이 같은 값으로 밀려 올라간다.
// 칸 안의 글자는 aria-hidden 이라 읽히지 않는다 — 바뀐 결과는 aria-live 칸이 한 문장으로 읽어 준다.
var sp = document.getElementById('sp');
var live = document.getElementById('sp-live');
var summary = [
  'Arrives Thu, Sep 17 · shipping 3,000 KRW',
  'Arrives Mon, Sep 14 · shipping 5,000 KRW',
  'Arrives Sun, Sep 13 · shipping 7,000 KRW'
];
function pick(index) {
  sp.classList.remove('is-demo');
  sp.style.setProperty('--i', index);
  live.textContent = summary[index];
}
var radios = sp.querySelectorAll('.sp__radio');
for (var n = 0; n < radios.length; n++) {
  radios[n].addEventListener('change', function (event) {
    pick(Number(event.target.value));
  });
}
</script>
</body>
</html>
