<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantity clamped to remaining stock — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="cs is-demo" id="cs" aria-label="Quantity capped by stock">
    <p class="cs__kicker">Cart</p>
    <div class="cs__band">
      <!-- 경고 띠: 줄 위로 내려와 남은 개수를 말한다. role="alert" 라서 읽어주는 기계도 바로 말한다 -->
      <p class="cs__strip" id="csStrip" role="alert">
        <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M215.46,216H40.54C27.92,216,20,202.79,26.13,192.09L113.59,40.22c6.3-11,22.52-11,28.82,0l87.46,151.87C236,202.79,228.08,216,215.46,216Z" opacity="0.2"/><path d="M236.8,188.09,149.35,36.22h0a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM222.93,203.8a8.5,8.5,0,0,1-7.48,4.2H40.55a8.5,8.5,0,0,1-7.48-4.2,7.59,7.59,0,0,1,0-7.72L120.52,44.21a8.75,8.75,0,0,1,15,0l87.45,151.87A7.59,7.59,0,0,1,222.93,203.8ZM120,144V104a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,180Z"/></svg>
        <span>Only 4 left</span>
      </p>
      <div class="cs__row">
        <span class="cs__thumb" aria-hidden="true"></span>
        <span class="cs__info">
          <b class="cs__name">Winter knit, ivory</b>
          <span class="cs__price">64,000 KRW</span>
        </span>
      </div>
    </div>
    <div class="cs__qty">
      <span class="cs__left">4 in stock</span>
      <span class="cs__step">
        <button class="cs__btn" type="button" id="csMinus" aria-label="Decrease quantity">−</button>
        <span class="cs__num" id="csNum">
          <input class="cs__input" id="csInput" type="number" inputmode="numeric" value="4" min="1" max="4" aria-label="Quantity">
          <!-- 미리보기 전용: 재고를 넘겨 넣은 값. 손으로 쓰는 정적 상태에서는 투명하게 비켜 있고 자리만 지킨다 -->
          <b class="cs__over" id="csOver" aria-hidden="true">6</b>
        </span>
        <button class="cs__btn" type="button" id="csPlus" aria-label="Increase quantity">+</button>
      </span>
    </div>
  </section>
</main>
<script>
// 재고 한도 Quantity — 재고보다 큰 수는 최대치로 되돌리고 경고 띠를 잠시 내린다
var cs = document.getElementById('cs');
var input = document.getElementById('csInput');
var stock = 4;
var backTimer = 0;

function clampQty(wanted) {
  cs.classList.remove('is-demo');               // 사람이 손대면 미리보기 루프는 끝난다
  var over = wanted > stock;
  input.value = String(Math.max(1, Math.min(stock, wanted)));
  cs.classList.toggle('is-over', over);
  if (over) {
    clearTimeout(backTimer);
    backTimer = setTimeout(function () { cs.classList.remove('is-over'); }, 1600);
  }
}

document.getElementById('csPlus').addEventListener('click', function () {
  clampQty(Number(input.value) + 1);
});
document.getElementById('csMinus').addEventListener('click', function () {
  clampQty(Number(input.value) - 1);
});
input.addEventListener('input', function () {
  if (input.value === '') { return; }            // 지우는 중에는 되튕기지 않는다
  clampQty(Number(input.value));
});
</script>
</body>
</html>
