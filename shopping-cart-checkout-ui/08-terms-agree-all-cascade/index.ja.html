<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agree to all draws the checks in turn — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ta is-demo" id="ta" aria-label="規約同意のまとまり">
    <div class="ta__all">
      <span class="ta__ic" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M216,48V208a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V48a8,8,0,0,1,8-8H208A8,8,0,0,1,216,48Z" opacity="0.2"/><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM224,48V208a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V48A16,16,0,0,1,48,32H208A16,16,0,0,1,224,48ZM208,208V48H48V208H208Z"/></svg></span>
      <label class="ta__allText" for="ta-all">すべて同意</label>
      <input class="ta__switch" type="checkbox" id="ta-all">
    </div>

    <ul class="ta__list">
      <li class="ta__row">
        <input class="ta__box" type="checkbox" id="ta-1">
        <label class="ta__mark" for="ta-1" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline class="ta__tick" points="5 12.5 10 17 19 7" pathLength="1" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></label>
        <label class="ta__text" for="ta-1">利用規約への同意 (必須)</label>
      </li>
      <li class="ta__row">
        <input class="ta__box" type="checkbox" id="ta-2">
        <label class="ta__mark" for="ta-2" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline class="ta__tick" points="5 12.5 10 17 19 7" pathLength="1" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></label>
        <label class="ta__text" for="ta-2">個人情報の収集 (必須)</label>
      </li>
      <li class="ta__row">
        <input class="ta__box" type="checkbox" id="ta-3">
        <label class="ta__mark" for="ta-3" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline class="ta__tick" points="5 12.5 10 17 19 7" pathLength="1" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></label>
        <label class="ta__text" for="ta-3">決済代行サービス (必須)</label>
      </li>
      <li class="ta__row">
        <input class="ta__box" type="checkbox" id="ta-4">
        <label class="ta__mark" for="ta-4" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline class="ta__tick" points="5 12.5 10 17 19 7" pathLength="1" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></label>
        <label class="ta__text" for="ta-4">マーケティング情報の受信 (任意)</label>
      </li>
    </ul>
  </section>
</main>
<script>
// 전체 동의는 아래 네 칸을 한꺼번에 켜고, 한 칸만 꺼지면 자기만 조용히 풀린다.
// 「몇 개는 켜져 있다」 는 상태는 indeterminate 가 그대로 갖고 있다 — 별도 클래스가 필요 없다.
var ta = document.getElementById('ta');
var master = document.getElementById('ta-all');
var boxes = ta.querySelectorAll('.ta__box');
function sync() {
  var on = 0;
  for (var i = 0; i < boxes.length; i++) { if (boxes[i].checked) { on++; } }
  master.checked = on === boxes.length;
  master.indeterminate = on > 0 && on < boxes.length;
}
master.addEventListener('change', function () {
  ta.classList.remove('is-demo');
  for (var i = 0; i < boxes.length; i++) { boxes[i].checked = master.checked; }
  master.indeterminate = false;
});
for (var n = 0; n < boxes.length; n++) {
  boxes[n].addEventListener('change', function () {
    ta.classList.remove('is-demo');
    sync();
  });
}
</script>
</body>
</html>
