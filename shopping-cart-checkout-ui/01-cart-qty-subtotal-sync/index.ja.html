<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart quantity syncs line subtotal and grand total — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="qs is-demo" id="qs" aria-label="カートの数量と合計">
    <header class="qs__head">
      <p class="qs__title">カート</p>
      <p class="qs__hint">数量を押してみて</p>
    </header>
    <ul class="qs__list">
      <li class="qs__row" data-qty="2">
        <span class="qs__info">
          <span class="qs__name">ベーシックTシャツ</span>
          <span class="qs__unit">12,000ウォン</span>
        </span>
        <span class="qs__step">
          <button class="qs__b qs__b--down" type="button" data-step="-1" aria-label="ベーシックTシャツの数量を減らす"><svg viewBox="0 0 256 256" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M216,56V200a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V56A16,16,0,0,1,56,40H200A16,16,0,0,1,216,56Z" opacity="0.2"/><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128Z"/></svg></button>
          <output class="qs__q qs__swap"><span class="qs__v">2</span><span class="qs__alt" aria-hidden="true">3</span></output>
          <button class="qs__b qs__b--up" type="button" data-step="1" aria-label="ベーシックTシャツの数量を増やす"><svg viewBox="0 0 256 256" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M216,56V200a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V56A16,16,0,0,1,56,40H200A16,16,0,0,1,216,56Z" opacity="0.2"/><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg></button>
        </span>
        <span class="qs__sum qs__swap"><span class="qs__v qs__money">24,000ウォン</span><span class="qs__alt" aria-hidden="true">36,000ウォン</span></span>
      </li>
      <li class="qs__row" data-qty="1">
        <span class="qs__info">
          <span class="qs__name">無地の靴下</span>
          <span class="qs__unit">4,000ウォン</span>
        </span>
        <span class="qs__step">
          <button class="qs__b qs__b--down" type="button" data-step="-1" aria-label="無地の靴下の数量を減らす"><svg viewBox="0 0 256 256" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M216,56V200a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V56A16,16,0,0,1,56,40H200A16,16,0,0,1,216,56Z" opacity="0.2"/><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128Z"/></svg></button>
          <output class="qs__q"><span class="qs__v">1</span></output>
          <button class="qs__b qs__b--up" type="button" data-step="1" aria-label="無地の靴下の数量を増やす"><svg viewBox="0 0 256 256" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M216,56V200a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V56A16,16,0,0,1,56,40H200A16,16,0,0,1,216,56Z" opacity="0.2"/><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg></button>
        </span>
        <span class="qs__sum"><span class="qs__v qs__money">4,000ウォン</span></span>
      </li>
    </ul>
    <p class="qs__total">
      <span class="qs__tlabel">合計</span>
      <output class="qs__sum qs__sum--grand qs__swap" id="qs-grand"><span class="qs__v" id="qs-grandv">28,000ウォン</span><span class="qs__alt" aria-hidden="true">40,000ウォン</span></output>
    </p>
  </section>
</main>
<script>
// 수량을 바꾸면 그 줄 소계와 아래 합계를 같은 순간에 다시 계산한다.
// 금액 서식은 화면에 이미 있는 단가 글자에서 뽑는다 — 언어팩이 바꿔 둔 통화 표기를 그대로 따라간다
var qsRoot = document.getElementById('qs');
var qsRows = qsRoot.querySelectorAll('.qs__row');
var qsGrand = document.getElementById('qs-grand');
var qsGrandValue = document.getElementById('qs-grandv');

function qsComma(n) { return String(n).replace(/\B(?=(\d{3})+$)/g, ','); }
function qsUnitText(row) { return row.querySelector('.qs__unit').textContent.trim(); }
function qsAmount(text) { return Number(text.replace(/[^\d]/g, '')); }
function qsMoney(row, n) { return qsUnitText(row).replace(/[\d,]+/, qsComma(n)); }

function qsPaint(row) {
  var qty = Number(row.getAttribute('data-qty'));
  row.querySelector('.qs__q .qs__v').textContent = String(qty);
  row.querySelector('.qs__money').textContent = qsMoney(row, qty * qsAmount(qsUnitText(row)));
}
function qsTotal() {
  var sum = 0;
  for (var i = 0; i < qsRows.length; i++) {
    sum += Number(qsRows[i].getAttribute('data-qty')) * qsAmount(qsUnitText(qsRows[i]));
  }
  qsGrandValue.textContent = qsMoney(qsRows[0], sum);
}
// 물들었다 식는다 — 배경만 한 번 켜고 transition 이 되돌린다
function qsTint(cell) {
  cell.classList.add('is-hot');
  setTimeout(function () { cell.classList.remove('is-hot'); }, 80);
}
function qsBump(row, step) {
  qsRoot.classList.remove('is-demo');
  var qty = Math.min(9, Math.max(1, Number(row.getAttribute('data-qty')) + step));
  row.setAttribute('data-qty', String(qty));
  qsPaint(row);
  qsTotal();
  qsTint(row.querySelector('.qs__sum'));
  qsTint(qsGrand);
}
qsRoot.addEventListener('click', function (e) {
  var btn = e.target.closest('.qs__b');
  if (btn) { qsBump(btn.closest('.qs__row'), Number(btn.getAttribute('data-step'))); }
});
</script>
</body>
</html>
