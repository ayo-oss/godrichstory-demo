<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment method card that opens only the picked option — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <form class="pm is-demo" id="pm">
    <fieldset class="pm__set">
      <legend class="pm__legend">Payment method</legend>

      <div class="pm__item">
        <label class="pm__row" aria-expanded="true">
          <input class="pm__radio" type="radio" name="payMethod" value="card" checked>
          <span class="pm__ic" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M232,96v96a8,8,0,0,1-8,8H32a8,8,0,0,1-8-8V96Z" opacity="0.2"/><path d="M224,48H32A16,16,0,0,0,16,64V192a16,16,0,0,0,16,16H224a16,16,0,0,0,16-16V64A16,16,0,0,0,224,48Zm0,16V88H32V64Zm0,128H32V104H224v88Zm-16-24a8,8,0,0,1-8,8H168a8,8,0,0,1,0-16h32A8,8,0,0,1,208,168Zm-64,0a8,8,0,0,1-8,8H120a8,8,0,0,1,0-16h16A8,8,0,0,1,144,168Z"/></svg></span>
          <span class="pm__name">Card</span>
          <span class="pm__dot" aria-hidden="true"></span>
        </label>
        <div class="pm__fold">
          <p class="pm__detail"><span class="pm__dtext">Enter the card number and pick the installment plan here</span></p>
        </div>
      </div>

      <div class="pm__item">
        <label class="pm__row" aria-expanded="false">
          <input class="pm__radio" type="radio" name="payMethod" value="wallet">
          <span class="pm__ic" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,80V192a8,8,0,0,1-8,8H56a16,16,0,0,1-16-16V56A16,16,0,0,0,56,72H216A8,8,0,0,1,224,80Z" opacity="0.2"/><path d="M216,64H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,56V184a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V80A16,16,0,0,0,216,64Zm0,128H56a8,8,0,0,1-8-8V78.63A23.84,23.84,0,0,0,56,80H216Zm-48-60a12,12,0,1,1,12,12A12,12,0,0,1,168,132Z"/></svg></span>
          <span class="pm__name">Wallet</span>
          <span class="pm__dot" aria-hidden="true"></span>
        </label>
        <div class="pm__fold">
          <p class="pm__detail"><span class="pm__dtext">Confirm with a fingerprint in the app and you are done</span></p>
        </div>
      </div>

      <div class="pm__item">
        <label class="pm__row" aria-expanded="false">
          <input class="pm__radio" type="radio" name="payMethod" value="bank">
          <span class="pm__ic" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M232,96H24L128,32Z" opacity="0.2"/><path d="M24,104H48v64H32a8,8,0,0,0,0,16H224a8,8,0,0,0,0-16H208V104h24a8,8,0,0,0,4.19-14.81l-104-64a8,8,0,0,0-8.38,0l-104,64A8,8,0,0,0,24,104Zm40,0H96v64H64Zm80,0v64H112V104Zm48,64H160V104h32ZM128,41.39,203.74,88H52.26ZM248,208a8,8,0,0,1-8,8H16a8,8,0,0,1,0-16H240A8,8,0,0,1,248,208Z"/></svg></span>
          <span class="pm__name">Bank transfer</span>
          <span class="pm__dot" aria-hidden="true"></span>
        </label>
        <div class="pm__fold">
          <p class="pm__detail"><span class="pm__dtext">The account to pay into appears on the next screen</span></p>
        </div>
      </div>

    </fieldset>
  </form>
</main>
<script>
// 고른 수단의 상세 칸만 편다 — 여닫는 힘은 :checked 가 내고, JS 는 aria-expanded 만 맞춘다
var pm = document.getElementById('pm');
var rows = pm.querySelectorAll('.pm__row');

function syncExpanded() {
  for (var i = 0; i < rows.length; i++) {
    var picked = rows[i].querySelector('.pm__radio').checked;
    rows[i].setAttribute('aria-expanded', picked ? 'true' : 'false');
  }
}

// 라디오는 키보드 화살표로도 옮겨 다닌다 — change 하나면 마우스·키보드가 같이 걸린다
pm.addEventListener('change', function () {
  pm.classList.remove('is-demo');
  syncExpanded();
});
syncExpanded();
</script>
</body>
</html>
