<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>頂点の揺れ値でモーフィングするドロネー三角メッシュ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vd is-demo" id="vdRoot">
  <canvas class="vd__canvas" id="vdCanvas" width="480" height="300"></canvas>
  <p class="vd__caption">頂点の揺れ値でモーフィングするドロネー三角メッシュ</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('vdRoot');
  var canvas = document.getElementById('vdCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;
  var LOOP_MS = 2000;
  var VERTEX_JITTER_PX = 10;
  var JITTER_FREQ = Math.PI * 2 / LOOP_MS;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var rand = seedRand(409041);

  var meshPalette = ['#2f6df6', '#b9a0ff', '#6ec8ff', '#4cd4a6', '#ff9ebb'];

  var BASE_W = 480, BASE_H = 300;
  var points = [];
  var GRID_X = 7, GRID_Y = 5;
  for (var gy = 0; gy < GRID_Y; gy += 1) {
    for (var gx = 0; gx < GRID_X; gx += 1) {
      var jx = (rand() - 0.5) * (BASE_W / GRID_X) * 0.7;
      var jy = (rand() - 0.5) * (BASE_H / GRID_Y) * 0.7;
      points.push({
        bx: (gx + 0.5) * (BASE_W / GRID_X) + jx,
        by: (gy + 0.5) * (BASE_H / GRID_Y) + jy,
        phaseX: rand() * Math.PI * 2, phaseY: rand() * Math.PI * 2
      });
    }
  }

  function circumcircle(a, b, c) {
    var ax = a[0], ay = a[1], bx = b[0], by = b[1], cx = c[0], cy = c[1];
    var d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
    if (Math.abs(d) < 1e-6) return null;
    var ux = ((ax * ax + ay * ay) * (by - cy) + (bx * bx + by * by) * (cy - ay) + (cx * cx + cy * cy) * (ay - by)) / d;
    var uy = ((ax * ax + ay * ay) * (cx - bx) + (bx * bx + by * by) * (ax - cx) + (cx * cx + cy * cy) * (bx - ax)) / d;
    var r2 = (ux - ax) * (ux - ax) + (uy - ay) * (uy - ay);
    return { x: ux, y: uy, r2: r2 };
  }

  function delaunayTriangulate(pts) {
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    pts.forEach(function (p) {
      minX = Math.min(minX, p[0]); minY = Math.min(minY, p[1]);
      maxX = Math.max(maxX, p[0]); maxY = Math.max(maxY, p[1]);
    });
    var dx = maxX - minX, dy = maxY - minY, dmax = Math.max(dx, dy) || 1;
    var midx = (minX + maxX) / 2, midy = (minY + maxY) / 2;
    var work = pts.slice();
    var s0 = work.length, s1 = work.length + 1, s2 = work.length + 2;
    work.push([midx - 20 * dmax, midy - dmax], [midx, midy + 20 * dmax], [midx + 20 * dmax, midy - dmax]);
    var tris = [[s0, s1, s2]];
    for (var i = 0; i < pts.length; i += 1) {
      var p = work[i];
      var bad = [];
      for (var t = 0; t < tris.length; t += 1) {
        var tri = tris[t];
        var cc = circumcircle(work[tri[0]], work[tri[1]], work[tri[2]]);
        if (!cc) continue;
        var ddx = p[0] - cc.x, ddy = p[1] - cc.y;
        if (ddx * ddx + ddy * ddy <= cc.r2) bad.push(t);
      }
      var edgeCount = {};
      bad.forEach(function (t2) {
        var tri = tris[t2];
        var edges = [[tri[0], tri[1]], [tri[1], tri[2]], [tri[2], tri[0]]];
        edges.forEach(function (e) {
          var key = Math.min(e[0], e[1]) + '_' + Math.max(e[0], e[1]);
          if (!edgeCount[key]) edgeCount[key] = { e: e, n: 0 };
          edgeCount[key].n += 1;
        });
      });
      var boundary = [];
      Object.keys(edgeCount).forEach(function (k) { if (edgeCount[k].n === 1) boundary.push(edgeCount[k].e); });
      bad.sort(function (a2, b2) { return b2 - a2; }).forEach(function (t3) { tris.splice(t3, 1); });
      boundary.forEach(function (e) { tris.push([e[0], e[1], i]); });
    }
    return tris.filter(function (tri) { return tri[0] < pts.length && tri[1] < pts.length && tri[2] < pts.length; });
  }

  var cw = 480, ch = 300, scaleX = 1, scaleY = 1;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    scaleX = cw / BASE_W; scaleY = ch / BASE_H;
    draw(lastElapsed);
  }

  var lastElapsed = 0;
  function draw(elapsed) {
    lastElapsed = elapsed;
    var jittered = points.map(function (p) {
      return [
        p.bx + Math.sin(elapsed * JITTER_FREQ + p.phaseX) * VERTEX_JITTER_PX,
        p.by + Math.cos(elapsed * JITTER_FREQ * 0.85 + p.phaseY) * VERTEX_JITTER_PX
      ];
    });
    var tris = delaunayTriangulate(jittered);
    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cw, ch);
    tris.forEach(function (tri, ti) {
      var a = jittered[tri[0]], b = jittered[tri[1]], c = jittered[tri[2]];
      ctx.beginPath();
      ctx.moveTo(a[0] * scaleX, a[1] * scaleY);
      ctx.lineTo(b[0] * scaleX, b[1] * scaleY);
      ctx.lineTo(c[0] * scaleX, c[1] * scaleY);
      ctx.closePath();
      ctx.fillStyle = meshPalette[ti % meshPalette.length];
      ctx.globalAlpha = 0.55;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(23,20,26,.5)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var playing = !reduce;
  var elapsed = reduce ? LOOP_MS * 0.5 : 0;
  if (reduce) { root.classList.remove('is-demo'); }

  var lastTs = null;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = ts - lastTs;
    lastTs = ts;
    if (playing) { elapsed += dt; if (elapsed >= LOOP_MS) elapsed -= LOOP_MS; }
    draw(elapsed);
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  draw(elapsed);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
