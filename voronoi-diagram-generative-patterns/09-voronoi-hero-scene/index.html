<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여러 값이 한 화면에서 함께 반응하는 히어로 장면 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vd is-demo" id="vdRoot">
  <canvas class="vd__canvas" id="vdCanvas" width="480" height="300"></canvas>
  <p class="vd__caption">여러 값이 한 화면에서 함께 반응하는 히어로 장면</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('vdRoot');
  var canvas = document.getElementById('vdCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  var CALC_W = 160, CALC_H = 100;
  var LOOP_MS = 2000;
  var HERO_SEED_COUNT = 32;
  var DRIFT_AMP = 10;
  var DRIFT_FREQ = Math.PI * 2 / LOOP_MS;
  var RELAX_BLEND_FREQ = Math.PI * 2 / (LOOP_MS * 1.5);
  var HERO_REPEL_RADIUS_PX = 100;
  var ORBIT_FREQ = Math.PI * 2 / LOOP_MS;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var rand = seedRand(409091);

  var off = document.createElement('canvas');
  off.width = CALC_W; off.height = CALC_H;
  var octx = off.getContext('2d');
  var offImg = octx.createImageData(CALC_W, CALC_H);
  var offBuf = offImg.data;

  function hexToRgb(hex) {
    var v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }

  var NEI = -1, ND = 0, ND2 = 0;
  function nearestTwo(px, py, arr) {
    var bd = Infinity, bd2 = Infinity, bi = -1;
    for (var i = 0; i < arr.length; i += 1) {
      var dx = px - arr[i].x, dy = py - arr[i].y, d = dx * dx + dy * dy;
      if (d < bd) { bd2 = bd; bd = d; bi = i; } else if (d < bd2) { bd2 = d; }
    }
    NEI = bi; ND = Math.sqrt(bd); ND2 = Math.sqrt(bd2);
  }

  var heroPalette = ['#2f6df6', '#ff9ebb', '#4cd4a6', '#b9a0ff', '#6ec8ff', '#fff7e6'];
  var paletteRgb = {};
  heroPalette.forEach(function (h) { paletteRgb[h] = hexToRgb(h); });
  var seeds = [];
  for (var i9 = 0; i9 < HERO_SEED_COUNT; i9 += 1) {
    seeds.push({
      bx: rand() * CALC_W, by: rand() * CALC_H, x: 0, y: 0,
      phaseX: rand() * Math.PI * 2, phaseY: rand() * Math.PI * 2,
      c: heroPalette[i9 % heroPalette.length]
    });
  }

  function computeCentroids(positions) {
    var sumX = new Array(positions.length).fill(0);
    var sumY = new Array(positions.length).fill(0);
    var cnt = new Array(positions.length).fill(0);
    for (var y = 0; y < CALC_H; y += 1) {
      for (var x = 0; x < CALC_W; x += 1) {
        nearestTwo(x + 0.5, y + 0.5, positions);
        sumX[NEI] += x + 0.5; sumY[NEI] += y + 0.5; cnt[NEI] += 1;
      }
    }
    return positions.map(function (p, i) {
      if (!cnt[i]) return { x: p.x, y: p.y };
      return { x: sumX[i] / cnt[i], y: sumY[i] / cnt[i] };
    });
  }

  var baseForRelax = seeds.map(function (s) { return { x: s.bx, y: s.by }; });
  var relaxedLayout = computeCentroids(computeCentroids(baseForRelax));

  function relaxNudge(t) {
    return 0.5 + 0.5 * Math.sin(t * RELAX_BLEND_FREQ);
  }

  var pointerActive = false;
  var realPointer = { x: CALC_W / 2, y: CALC_H / 2 };
  function virtualPointerOrbit(t) {
    var cx = CALC_W / 2, cy = CALC_H / 2;
    var orbR = Math.min(CALC_W, CALC_H) * 0.44;
    return { x: cx + Math.cos(t * ORBIT_FREQ) * orbR, y: cy + Math.sin(t * ORBIT_FREQ * 1.4) * orbR * 0.75 };
  }

  function applyPointerRepel(pointerCalc) {
    var radiusCalc = HERO_REPEL_RADIUS_PX * (CALC_W / cw);
    seeds.forEach(function (s) {
      var dx = s.x - pointerCalc.x, dy = s.y - pointerCalc.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      if (dist < radiusCalc) {
        var push = (radiusCalc - dist) / radiusCalc;
        var k = push * push * 0.85;
        s.x += (dx / dist) * k * radiusCalc;
        s.y += (dy / dist) * k * radiusCalc;
      }
    });
  }

  function renderField(t) {
    var blend = relaxNudge(t);
    seeds.forEach(function (s, i) {
      var dx = s.bx + Math.sin(t * DRIFT_FREQ + s.phaseX) * DRIFT_AMP;
      var dy = s.by + Math.cos(t * DRIFT_FREQ * 0.8 + s.phaseY) * DRIFT_AMP;
      s.x = dx + (relaxedLayout[i].x - s.bx) * blend * 0.6;
      s.y = dy + (relaxedLayout[i].y - s.by) * blend * 0.6;
    });
    var pointerCalc = pointerActive ? realPointer : (reduce ? { x: -999, y: -999 } : virtualPointerOrbit(t));
    applyPointerRepel(pointerCalc);
    var idx = 0;
    for (var y = 0; y < CALC_H; y += 1) {
      for (var x = 0; x < CALC_W; x += 1) {
        nearestTwo(x + 0.5, y + 0.5, seeds);
        var rgb = paletteRgb[seeds[NEI].c];
        var edge = ND2 - ND;
        var dark = edge < 1.6 ? 0.5 + edge / 3.4 : 1;
        offBuf[idx] = rgb[0] * dark; offBuf[idx + 1] = rgb[1] * dark; offBuf[idx + 2] = rgb[2] * dark; offBuf[idx + 3] = 255;
        idx += 4;
      }
    }
  }

  var cw = 480, ch = 300;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    draw(lastElapsed);
  }

  var lastElapsed = 0;
  function draw(elapsed) {
    lastElapsed = elapsed;
    renderField(elapsed);
    octx.putImageData(offImg, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(off, 0, 0, CALC_W, CALC_H, 0, 0, cw, ch);

  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var playing = !reduce;
  var elapsed = reduce ? LOOP_MS * 0.5 : 0;
  if (reduce) { root.classList.remove('is-demo'); }

  function calcFromEvent(e) {
    var r = wrap.getBoundingClientRect();
    var t0 = (e.touches && e.touches[0]) ? e.touches[0] : e;
    var relX = (t0.clientX - r.left) / r.width * cw;
    var relY = (t0.clientY - r.top) / r.height * ch;
    realPointer.x = relX * (CALC_W / cw);
    realPointer.y = relY * (CALC_H / ch);
  }
  wrap.addEventListener('pointermove', function (e) {
    pointerActive = true;
    calcFromEvent(e);
    draw(lastElapsed);
  });
  wrap.addEventListener('pointerleave', function () {
    pointerActive = false;
    draw(lastElapsed);
  });

  var lastTs = null;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = ts - lastTs;
    lastTs = ts;
    if (playing) {
      elapsed += dt;
      if (elapsed >= LOOP_MS) elapsed -= LOOP_MS;
    }
    draw(elapsed);
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  draw(elapsed);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
