<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel That Skips the Open Animation by Detecting a Reduced-Motion Value — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rp is-demo" id="rp">
  <button class="rp__trigger" id="rpTrigger" type="button" aria-haspopup="true" aria-expanded="false">Settings</button>
  <div class="rp__panel" id="rpPanel" role="menu" hidden>
    <div class="rp__row" role="menuitem">Background pattern</div>
    <div class="rp__row" role="menuitem">Notification sound</div>
    <div class="rp__row" role="menuitem">Text size</div>
  </div>
  <p class="rp__badge" id="rpBadge">Reduced motion off</p>
  <p class="rp__sr" role="status" aria-live="polite" id="rpLive"></p>
</div>
<script>
(function () {
  var root = document.getElementById('rp');
  var trigger = document.getElementById('rpTrigger');
  var panel = document.getElementById('rpPanel');
  var badge = document.getElementById('rpBadge');
  var live = document.getElementById('rpLive');
  var synthetic = false;
  function human() { if (synthetic) return; if (root.classList.contains('is-demo')) root.classList.remove('is-demo'); }

  var REDUCE_MOTION_DURATION_MS = 0;
  var NORMAL_MOTION_DURATION_MS = 240;
  var reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
  var forcedReduce = false;

  // 계산 겹: 시스템의 Reduced motion 값(matchMedia.matches)과 데모용 강제 값(forcedReduce)을 합쳐
  // 실제로 쓸 지속시간 값을 계산해 패널에 직접 놓는다 — 미디어쿼리 블록이 있고 없고가 아니라
  // 그 값 자체를 읽어 duration 숫자를 정하고, 그 숫자를 배지·안내문에도 그대로 노출한다.
  function applyMotionPref() {
    var reduce = reduceMQ.matches || forcedReduce;
    var ms = reduce ? REDUCE_MOTION_DURATION_MS : NORMAL_MOTION_DURATION_MS;
    panel.style.transitionDuration = ms + 'ms';
    badge.textContent = 'Reduced motion ' + (reduce ? 'on' : 'off');
    return { reduce: reduce, ms: ms };
  }
  applyMotionPref();

  function openPanel() {
    var pref = applyMotionPref();
    panel.hidden = false;
    requestAnimationFrame(function () { panel.classList.add('rp__panel--open'); });
    trigger.setAttribute('aria-expanded', 'true');
    live.textContent = pref.ms + 'ms value: ' + (pref.reduce ? 'shown instantly' : 'opened');
  }
  function closePanel() {
    panel.classList.remove('rp__panel--open');
    trigger.setAttribute('aria-expanded', 'false');
    var pref = applyMotionPref();
    window.setTimeout(function () { if (!panel.classList.contains('rp__panel--open')) panel.hidden = true; }, pref.ms + 20);
  }
  trigger.addEventListener('click', function () {
    human();
    if (panel.hidden) openPanel(); else closePanel();
  });

  if (typeof reduceMQ.addEventListener === 'function') {
    reduceMQ.addEventListener('change', function () { forcedReduce = false; applyMotionPref(); });
  }

  var reduce = reduceMQ.matches;
  var phase = 0, loopTimer = 0;
  function runStep() {
    if (!root.classList.contains('is-demo')) return;
    synthetic = true;
    if (phase % 4 === 0) { forcedReduce = false; applyMotionPref(); }
    else if (phase % 4 === 2) { forcedReduce = true; applyMotionPref(); }
    trigger.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    synthetic = false;
    phase++;
    loopTimer = window.setTimeout(runStep, 350);
  }
  if (!reduce) { loopTimer = window.setTimeout(runStep, 420); }
  else { root.classList.remove('is-demo'); }
})();
</script>
</main>
</body>
</html>
