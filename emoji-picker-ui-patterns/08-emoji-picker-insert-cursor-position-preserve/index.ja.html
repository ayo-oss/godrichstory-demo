<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保存したカーソル位置の値に正確に挿入する挿入方式 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ip is-demo" id="ip">
  <textarea class="ip__field" id="ipField" rows="3" aria-label="メッセージ入力"></textarea>
  <div class="ip__panel" role="group" aria-label="絵文字挿入">
    <button class="ip__pick" type="button" aria-label="星">&#11088;</button>
    <button class="ip__pick" type="button" aria-label="風船">&#127880;</button>
    <button class="ip__pick" type="button" aria-label="画鋲">&#128204;</button>
    <button class="ip__pick" type="button" aria-label="四つ葉のクローバー">&#127808;</button>
  </div>
  <p class="ip__sr" role="status" aria-live="polite" id="ipLive"></p>
</div>
<script>
(function () {
  var root = document.getElementById('ip');
  var field = document.getElementById('ipField');
  var live = document.getElementById('ipLive');
  var synthetic = false;
  function human() { if (synthetic) return; if (root.classList.contains('is-demo')) root.classList.remove('is-demo'); }

  // 계산 겹: 입력창이 초점을 잃기 직전(blur)에 selectionStart/selectionEnd 값을 저장해 두고,
  // 이모지를 고르는 순간 그 값이 가리키던 文字 사이에 정확히 끼워 넣어 커서를 그 자리로 되돌린다.
  // (끝에 이어붙이면 값을 안 쓴 것과 같다 — 저장된 위치 값을 실제로 읽어 쓰는 것이 계산 겹이다.)
  var savedStart = 0;
  var savedEnd = 0;
  field.addEventListener('blur', function () {
    savedStart = field.selectionStart;
    savedEnd = field.selectionEnd;
  });

  field.addEventListener('input', function () {
    live.textContent = '文字 ' + field.value.length + '個、カーソル ' + field.selectionStart + '番目';
  });

  var picks = Array.prototype.slice.call(document.querySelectorAll('.ip__pick'));
  picks.forEach(function (btn) {
    btn.addEventListener('click', function () {
      human();
      var emoji = btn.textContent;
      var value = field.value;
      var before = value.slice(0, savedStart);
      var after = value.slice(savedEnd);
      field.value = before + emoji + after;
      var landAt = savedStart + emoji.length;
      field.focus({ preventScroll: true });
      field.setSelectionRange(landAt, landAt);
      savedStart = landAt;
      savedEnd = landAt;
      live.textContent = before.length + '文字目の後ろに挿入、カーソル ' + landAt + '番目へ移動';
      btn.classList.add('ip__pick--pop');
      window.setTimeout(function () { btn.classList.remove('ip__pick--pop'); }, 260);
    });
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DEMO_TEXT = 'お昼ご飯本当に美味しかった';
  var MID = 5;
  var step = 0, loopTimer = 0;
  function runStep() {
    if (!root.classList.contains('is-demo')) return;
    synthetic = true;
    if (step % 2 === 0) {
      field.value = DEMO_TEXT;
      field.focus({ preventScroll: true });
      field.setSelectionRange(MID, MID);
      field.blur();
    } else {
      var idx = (step / 2) % picks.length | 0;
      picks[idx].dispatchEvent(new MouseEvent('click', { bubbles: true }));
    }
    synthetic = false;
    step++;
    loopTimer = window.setTimeout(runStep, 620);
  }
  if (!reduce) { loopTimer = window.setTimeout(runStep, 480); }
  else { root.classList.remove('is-demo'); }
})();
</script>
</main>
</body>
</html>
