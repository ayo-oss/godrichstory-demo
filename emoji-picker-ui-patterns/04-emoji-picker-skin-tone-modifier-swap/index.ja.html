<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選んだトーン値で対象の絵文字一式が入れ替わるトーン切替 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tn is-demo" id="tn">
  <div class="tn__strip" role="radiogroup" aria-label="トーン選択" id="tnStrip"></div>
  <ul class="tn__grid" id="tnGrid"></ul>
  <p class="tn__sr" role="status" aria-live="polite" id="tnLive"></p>
</div>
<script>
(function () {
  // 계산 겹: 사람 형태 이모지의 원본 코드포인트에 톤 수정자 코드포인트(U+1F3FB~U+1F3FF)를 이어 붙여
  // 새 문자열을 만든다 — 미리 그려둔 다섯 벌을 갈아 끼우는 게 아니라 매번 코드포인트를 조합한다.
  var EMOJI_TONE_MODIFIERS = ['\u{1F3FB}', '\u{1F3FC}', '\u{1F3FD}', '\u{1F3FE}', '\u{1F3FF}'];
  var TONE_NAMES = ['既定', 'トーン1', 'トーン2', 'トーン3', 'トーン4', 'トーン5'];
  var BASES = [
    { cp: '\u{1F44B}', name: 'waving hand' }, { cp: '\u{1F44D}', name: 'thumbs up' },
    { cp: '\u{1F44F}', name: 'clapping hands' }, { cp: '\u{270B}', name: 'raised hand' },
    { cp: '\u{1F64F}', name: 'folded hands' }, { cp: '\u{1F4AA}', name: 'flexed bicep' },
    { cp: '\u{1F44C}', name: 'ok hand' }, { cp: '\u{270C}', name: 'victory hand' },
    { cp: '\u{270D}', name: 'writing hand' }, { cp: '\u{1F64B}', name: 'raising hand' }
  ];

  function combine(base, toneIndex) {
    if (toneIndex === 0) return base;
    return base + EMOJI_TONE_MODIFIERS[toneIndex - 1];
  }

  var root = document.getElementById('tn');
  var strip = document.getElementById('tnStrip');
  var grid = document.getElementById('tnGrid');
  var live = document.getElementById('tnLive');

  var synthetic = false;
  function human() { if (synthetic) return; if (root.classList.contains('is-demo')) root.classList.remove('is-demo'); }

  var mounted = false;
  var tone = 0;
  var swatchEls = [];

  function buildStrip() {
    TONE_NAMES.forEach(function (label, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'tn__swatch tn__swatch--t' + i;
      b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', i === 0 ? 'true' : 'false');
      b.setAttribute('aria-label', label);
      b.addEventListener('click', function () { human(); setTone(i); });
      strip.appendChild(b);
      swatchEls.push(b);
    });
  }

  function buildGrid() {
    BASES.forEach(function (it) {
      var li = document.createElement('li');
      li.className = 'tn__item'; li.dataset.base = it.cp;
      li.innerHTML = '<span class="tn__ch"></span>';
      grid.appendChild(li);
    });
  }

  function renderGrid() {
    Array.prototype.forEach.call(grid.children, function (li) {
      var ch = li.querySelector('.tn__ch');
      if (mounted) { ch.classList.remove('tn__ch--swap'); void ch.offsetWidth; ch.classList.add('tn__ch--swap'); }
      ch.textContent = combine(li.dataset.base, tone);
    });
  }

  function setTone(i) {
    tone = i;
    swatchEls.forEach(function (b, j) { b.setAttribute('aria-checked', j === i ? 'true' : 'false'); });
    renderGrid();
    live.textContent = TONE_NAMES[i] + ' 選択、 ' + BASES.length + '件更新';
  }

  buildStrip();
  buildGrid();
  renderGrid();
  mounted = true;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var order = [1, 3, 5, 2, 4, 0];
  var oi = 0, loopTimer = 0;
  function loop() {
    if (!root.classList.contains('is-demo')) return;
    synthetic = true; swatchEls[order[oi % order.length]].click(); synthetic = false;
    oi++;
    loopTimer = window.setTimeout(loop, 620);
  }
  if (!reduce) { loopTimer = window.setTimeout(loop, 500); }
  else { root.classList.remove('is-demo'); }
})();
</script>
</main>
</body>
</html>
