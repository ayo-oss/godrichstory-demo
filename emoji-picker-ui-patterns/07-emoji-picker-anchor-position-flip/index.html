<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>남은 공간 값을 계산해 여는 방향이 바뀌는 앵커 배치 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="af is-demo" id="af">
  <div class="af__viewport" id="afViewport">
    <div class="af__panel af__panel--below" id="afPanel" role="dialog" aria-label="이모지 패널" hidden>
      <button class="af__pick" type="button">&#128512;</button>
      <button class="af__pick" type="button">&#128077;</button>
      <button class="af__pick" type="button">&#10084;&#65039;</button>
      <button class="af__pick" type="button">&#127881;</button>
      <button class="af__pick" type="button">&#128293;</button>
      <button class="af__pick" type="button">&#128064;</button>
    </div>
    <button class="af__trigger af__trigger--low" id="afTrigger" type="button" aria-haspopup="true" aria-expanded="false">&#128512; 추가</button>
  </div>
  <p class="af__sr" role="status" aria-live="polite" id="afLive"></p>
</div>
<script>
(function () {
  var EMOJI_PANEL_FLIP_MARGIN_PX = 8;

  var root = document.getElementById('af');
  var viewport = document.getElementById('afViewport');
  var trigger = document.getElementById('afTrigger');
  var panel = document.getElementById('afPanel');
  var live = document.getElementById('afLive');

  var synthetic = false;
  function human() { if (synthetic) return; if (root.classList.contains('is-demo')) root.classList.remove('is-demo'); }

  // 계산 겹: 입력창 위·아래로 남은 화면 공간 값을 실측(getBoundingClientRect)해 비교한다. 패널
  // 높이도 짐작하지 않고 화면 밖(visibility:hidden)에서 한 번 펼쳐 실제 렌더 높이를 잰다. 아래쪽
  // 공간 값이 패널 높이보다 여유값(EMOJI_PANEL_FLIP_MARGIN_PX)만큼도 안 남을 때만 위로 연다.
  function measureAndPlace() {
    var vpRect = viewport.getBoundingClientRect();
    var trRect = trigger.getBoundingClientRect();
    var wasHidden = panel.hidden;
    panel.style.visibility = 'hidden';
    panel.hidden = false;
    var panelH = panel.offsetHeight;
    panel.hidden = wasHidden;
    panel.style.visibility = '';
    var spaceBelow = vpRect.bottom - trRect.bottom;
    var spaceAbove = trRect.top - vpRect.top;
    var openAbove = (spaceBelow - EMOJI_PANEL_FLIP_MARGIN_PX) < panelH && spaceAbove > spaceBelow;
    panel.classList.toggle('af__panel--above', openAbove);
    panel.classList.toggle('af__panel--below', !openAbove);
    if (openAbove) {
      panel.style.bottom = (vpRect.bottom - trRect.top + EMOJI_PANEL_FLIP_MARGIN_PX) + 'px';
      panel.style.top = 'auto';
    } else {
      panel.style.top = (trRect.bottom - vpRect.top + EMOJI_PANEL_FLIP_MARGIN_PX) + 'px';
      panel.style.bottom = 'auto';
    }
    panel.style.left = (trRect.left + trRect.width / 2 - vpRect.left) + 'px';
    live.textContent = '남은 공간 아래 ' + Math.round(spaceBelow) + 'px · 위 ' + Math.round(spaceAbove) + 'px, ' + (openAbove ? '위로 열림' : '아래로 열림');
    return openAbove;
  }

  function openPanel() {
    measureAndPlace();
    panel.hidden = false;
    requestAnimationFrame(function () { panel.classList.add('af__panel--open'); });
    trigger.setAttribute('aria-expanded', 'true');
  }

  function closePanel() {
    panel.classList.remove('af__panel--open');
    trigger.setAttribute('aria-expanded', 'false');
    window.setTimeout(function () { if (!panel.classList.contains('af__panel--open')) panel.hidden = true; }, 220);
  }

  trigger.addEventListener('click', function () {
    human();
    if (panel.hidden) openPanel(); else closePanel();
  });

  window.addEventListener('resize', function () {
    if (!panel.hidden) measureAndPlace();
  });

  function movePosition(low) {
    trigger.classList.toggle('af__trigger--low', low);
    trigger.classList.toggle('af__trigger--high', !low);
    if (!panel.hidden) measureAndPlace();
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lowState = true, loopTimer = 0;
  function runStep() {
    if (!root.classList.contains('is-demo')) return;
    movePosition(lowState);
    lowState = !lowState;
    synthetic = true; trigger.dispatchEvent(new MouseEvent('click', { bubbles: true })); synthetic = false;
    window.setTimeout(function () {
      synthetic = true; trigger.dispatchEvent(new MouseEvent('click', { bubbles: true })); synthetic = false;
      loopTimer = window.setTimeout(runStep, 480);
    }, 900);
  }
  if (!reduce) { loopTimer = window.setTimeout(runStep, 420); }
  else { root.classList.remove('is-demo'); }
})();
</script>
</main>
</body>
</html>
