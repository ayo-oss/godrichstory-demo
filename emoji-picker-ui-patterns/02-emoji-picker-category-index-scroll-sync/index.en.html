<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Category Switch Where Scroll Position and Tab Index Stay in Sync — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cx is-demo" id="cx">
  <div class="cx__tabs" role="tablist" aria-label="Emoji categories" id="cxTabs">
    <span class="cx__ind" id="cxInd" aria-hidden="true"></span>
  </div>
  <div class="cx__panel" id="cxPanel" tabindex="0" aria-label="Emoji panel"></div>
  <p class="cx__sr" role="status" aria-live="polite" id="cxLive"></p>
</div>
<script>
(function () {
  var CATS = [
    { id: 'smiley', name: 'Faces', emoji: ['\u{1F600}', '\u{1F603}', '\u{1F604}', '\u{1F601}'] },
    { id: 'gesture', name: 'Gestures', emoji: ['\u{1F44D}', '\u{1F44E}', '\u{1F44B}', '\u{1F91D}'] },
    { id: 'nature', name: 'Nature', emoji: ['\u{1F338}', '\u{1F319}', '\u{2B50}', '\u{1F308}'] },
    { id: 'food', name: 'Food', emoji: ['\u{1F355}', '\u{1F354}', '\u{1F369}', '\u{1F34E}'] }
  ];

  var root = document.getElementById('cx');
  var tabsEl = document.getElementById('cxTabs');
  var panelEl = document.getElementById('cxPanel');
  var indEl = document.getElementById('cxInd');
  var live = document.getElementById('cxLive');
  var tabs = [], sections = [];
  var active = 0, syncing = false;

  function human() { if (root.classList.contains('is-demo')) root.classList.remove('is-demo'); }

  CATS.forEach(function (cat, i) {
    var tab = document.createElement('button');
    tab.type = 'button'; tab.className = 'cx__tab'; tab.id = 'cxTab' + i;
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    tab.setAttribute('aria-controls', 'cxSec' + i);
    tab.textContent = cat.name;
    tab.addEventListener('click', function () { human(); goTo(i, false); });
    tabsEl.appendChild(tab);
    tabs.push(tab);

    var sec = document.createElement('section');
    sec.className = 'cx__section'; sec.id = 'cxSec' + i;
    sec.setAttribute('role', 'region'); sec.setAttribute('aria-labelledby', 'cxTab' + i);
    var h = document.createElement('h3'); h.className = 'cx__h'; h.textContent = cat.name;
    var grid = document.createElement('div'); grid.className = 'cx__grid'; grid.setAttribute('role', 'listbox'); grid.setAttribute('aria-label', cat.name);
    cat.emoji.forEach(function (ch) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'cx__ch'; b.setAttribute('role', 'option'); b.setAttribute('aria-selected', 'false');
      b.textContent = ch;
      grid.appendChild(b);
    });
    sec.appendChild(h); sec.appendChild(grid);
    panelEl.appendChild(sec);
    sections.push(sec);
  });

  // 계산 겹: 탭을 누르면 그 탭의 번호 값 × 섹션 오프셋을 읽어 패널을 그 위치로 스크롤한다.
  function goTo(i, silent) {
    active = i;
    var top = sections[i].offsetTop - panelEl.clientTop;
    syncing = true;
    panelEl.scrollTo({ top: top, behavior: reduce ? 'auto' : 'smooth' });
    setActive(i);
    window.setTimeout(function () { syncing = false; }, reduce ? 30 : 420);
    if (!silent) live.textContent = CATS[i].name + ' category selected';
  }

  function setActive(i) {
    tabs.forEach(function (t, k) { t.setAttribute('aria-selected', k === i ? 'true' : 'false'); });
    var r = tabs[i].getBoundingClientRect(), pr = tabsEl.getBoundingClientRect();
    indEl.style.width = r.width + 'px';
    indEl.style.transform = 'translateX(' + (r.left - pr.left) + 'px)';
  }

  // 계산 겹: 패널을 손으로 내리면 지나간 거리 값(scrollTop)을 각 섹션의 오프셋과 비교해
  // 지금 보이는 카테고리 번호를 역산하고, 그 번호로 탭 표시를 맞춘다.
  function onScroll() {
    if (syncing) return;
    var dist = panelEl.scrollTop, i = 0;
    for (var k = 0; k < sections.length; k++) {
      if (sections[k].offsetTop - panelEl.clientTop <= dist + 18) i = k;
    }
    if (i !== active) { active = i; setActive(i); live.textContent = CATS[i].name + ' category now in view'; }
  }
  panelEl.addEventListener('scroll', function () { human(); onScroll(); });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setActive(0);
  window.addEventListener('resize', function () { setActive(active); });

  var SEQ = [1, 2, 3, 0, 2];
  var i = 0, timer = 0;
  function loop() {
    if (!root.classList.contains('is-demo')) return;
    goTo(SEQ[i % SEQ.length], true);
    i++;
    timer = window.setTimeout(loop, 780);
  }
  if (!reduce) { timer = window.setTimeout(loop, 500); }
  else { root.classList.remove('is-demo'); }
})();
</script>
</main>
</body>
</html>
