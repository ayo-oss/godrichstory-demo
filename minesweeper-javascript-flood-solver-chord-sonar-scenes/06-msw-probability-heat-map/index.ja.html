    // 섞인 순서 뒤쪽의 빈 칸으로 옮긴다. 옮긴 목록 [원래 칸, 새 칸] 을 돌려준다

    // 코드 열기 — 열린 숫자 칸 둘레의 깃발 수가 숫자와 같을 때만 남은 닫힌 이웃 목록을 준다

            return [];
        }
        const out = [];
        for (const j of nbrs(b, i)) {
            if (b.st[j] === 0) {
                out.push(j);
            }
        }
        return out;
    }
    function countSt(b, s) {
        let n = 0;
        for (let i = 0; i < b.cols * b.rows; i += 1) {
            if (b.st[i] === s) {
                n += 1;
            }
        }
        return n;
    }
    // 눈에 열려 있는 칸 수 — 열기가 예약돼 시각이 아직 안 된 칸은 세지 않는다

        let n = 0;
        for (let i = 0; i < b.cols * b.rows; i += 1) {

                n += 1;
            }
        }
        return n;
    }
    function countEx(b, t) {
        let n = 0;
        for (let i = 0; i < b.cols * b.rows; i += 1) {
            if (b.exT[i] >= 0 && b.exT[i] <= t) {
                n += 1;
            }
        }
        return n;
    }
    function cloneBoard(b) {
        const c = newBoard(b.cols, b.rows, b.count);
        for (let i = 0; i < b.cols * b.rows; i += 1) {
            c.mine[i] = b.mine[i];
            c.num[i] = b.num[i];
            c.st[i] = b.st[i];
            c.openT[i] = b.openT[i];
        }
        c.placed = b.placed;
        return c;
    }
    function consOf(b) {

        for (let i = 0; i < b.cols * b.rows; i += 1) {
            if (b.st[i] !== 1 || b.num[i] === 0) {
                continue;
            }
            const u = [];
            for (const j of nbrs(b, i)) {
                if (b.st[j] === 0) {
                    u.push(j);
                }
            }

            }
        }
        return out;
    }
    function subsetOf(x, y) {

            }
        }
        return true;
    }

    function comb(n, k) {

    // 모든 닫힌 칸의 지뢰 확률(−1 은 닫힌 칸이 아님). 경계 칸(열린 숫자와 맞닿은 닫힌 칸)은 조건을 모두 만족하는 배치를
    // 하나씩 세고, 경계 밖 칸은 남은 지뢰를 경계 배치마다 C(바깥 칸, 残りの地雷)가지로 나눠 가진다
    const PROB_NODE_CAP = 300000;
    let probNodes = 0;
    function probMap(b) {
        const n = b.cols * b.rows;
        const out = [];
        const fi = [];
        for (let i = 0; i < n; i += 1) {
            out.push(-1);
            fi.push(-1);
        }
        const F = [];

        for (const c of cs) {
            for (const j of c.u) {

                    fi[j] = F.length;

                }
            }

        for (let k = 0; k < F.length; k += 1) {
            cc.push([]);
        }

        const left = [];
        for (const c of cs) {
            got.push(0);
            left.push(c.u.length);
        }
        const asg = [];
        for (let k = 0; k < F.length; k += 1) {
            asg.push(0);
        }
        const sol = [];
        const cm = [];
        for (let m = 0; m <= F.length; m += 1) {
            sol.push(0);
            const row = [];
            for (let k = 0; k < F.length; k += 1) {
                row.push(0);
            }
            cm.push(row);
        }
        probNodes = 0;
        function rec(k, mines) {
            probNodes += 1;
            if (probNodes > PROB_NODE_CAP) {
                return;
            }
            if (k === F.length) {
                sol[mines] += 1;
                for (let f = 0; f < F.length; f += 1) {
                    if (asg[f] === 1) {
                        cm[mines][f] += 1;
                    }
                }
                return;
            }
            for (let v = 0; v <= 1; v += 1) {
                let ok = true;
                for (const ci of cc[k]) {
                    got[ci] += v;
                    left[ci] -= 1;
                    if (got[ci] > cs[ci].r || got[ci] + left[ci] < cs[ci].r) {
                        ok = false;
                    }

                if (ok) {
                    asg[k] = v;
                    rec(k + 1, mines + v);
                }
                for (const ci of cc[k]) {
                    got[ci] -= v;
                    left[ci] += 1;
                }

        let flags = 0;
        const inner = [];
        for (let i = 0; i < n; i += 1) {
            if (b.st[i] === 0) {
                hidden += 1;
                if (fi[i] < 0) {
                    inner.push(i);

            if (b.st[i] === 2) {
                flags += 1;
            }

                continue;

        for (let i = 0; i < n; i += 1) {
            if (b.st[i] !== 0) {

            if (total <= 0 || probNodes > PROB_NODE_CAP) {

            }
            else if (fi[i] >= 0) {
                out[i] = pf[fi[i]] / total;
            }
            else {
                out[i] = innerMines / total / inner.length;
            }
        }
        return out;
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');

                const p = probMap(c);
                const q = palest(p);
                // 첫 라운드는 가장 옅은 칸도 확률이 0 이 아니어야 "확실한 칸이 없다" 가 참이다. 뒤 라운드는 0% 칸이 생길 수 있다
                if (probNodes > PROB_NODE_CAP || q < 0 || c.mine[q] || (r === 0 && p[q] < 0.05)) {
                    ok = false;
                    break;
                }
                revealFrom(c, [{ i: q, d: 0 }], -9, 0);
            }
            if (ok) {
                break;
            }
        }
        prob = [];
        heatOn = false;
        pick = -1;
        nRound = 0;
        for (let r = 0; r < ROUNDS; r += 1) {
            const t0 = 0.4 + ROUND_S * r;
            script.push({ t: t0, f: function () {
                    prob = probMap(B);
                    pick = palest(prob);
                    pickP = pick >= 0 ? prob[pick] : 0;
                    heatT = sceneT;
                    heatOn = true;
                    ringT = -9;
                } });
            script.push({ t: t0 + 1.9, f: function () { ringT = sceneT; } });
            script.push({ t: t0 + 2.7, f: function () {
                    if (pick >= 0) {
                        revealFrom(B, [{ i: pick, d: 0 }], sceneT, OPEN_DELAY);
                    }
                    heatOn = false;
                    offT = sceneT;
                    nRound = r + 1;
                } });
        }
    }
    function update(dt) { if (dt < 0) {
        return;
    } }
    function heatColor(p) { return mix([208, 238, 224], [226, 98, 138], Math.pow(clamp(p, 0, 1), 0.8)); }
    function tintOf(i) {
        if (B.st[i] !== 0 || prob.length === 0) {
            return null;
        }
        const age = sceneT - heatT;
        let k = 0;
        if (heatOn) {
            k = ease((age - (i % COLS) * 0.035) / 0.5);
        }
        else {
            k = 1 - ease((sceneT - offT) / 0.3);
        }
        if (manual) {
            k = 0;
        }
        if (k <= 0 || prob[i] < 0) {
            return null;
        }
        const c = heatColor(prob[i]);
        return [c[0], c[1], c[2], 0.9 * k];
    }
    function draw() {
        skyFill(BG_TOP, BG_BOT);
        drawCells(B, null, tintOf, true);
        if (!heatOn || manual) {
            return;
        }
        const age = sceneT - heatT;
        for (let i = 0; i < COLS * ROWS; i += 1) {
            if (!isFront(i) || prob[i] < 0) {
                continue;
            }
            const k = ease((age - (i % COLS) * 0.035 - 0.2) / 0.4);
            text(String(Math.round(prob[i] * 100)), cellCx(i), cellCy(i) + 0.5, INK, k, Math.round(gs * 0.4), 800, 'center');
        }
        const ra = sceneT - ringT;
        if (pick >= 0 && ringT >= 0 && ra >= 0) {
            const k = ease(ra / 0.25);
            ring(cellCx(pick), cellCy(pick), gs * (0.62 + 0.08 * Math.sin(ra * 9)), 3.5, INK, k);
            tag('{p}%'.replace('{p}', String(Math.round(pickP * 100))), cellCx(pick), cellCy(pick) - gs * 1.1 < 40 ? cellCy(pick) + gs * 1.1 : cellCy(pick) - gs * 1.1, MINT, INK, 11, 'center');
        }
    }
    function statusText() {
        const o = String(countOpen(B));
        if (!manual && heatOn && pick >= 0 && pickP < 0.005) {
            return '確実に安全なマスが出現 — 確率 0%';
        }
        if (!manual && heatOn && pick >= 0) {
            return '確実なマスなし — いちばん薄いマス {p}%'.replace('{p}', String(Math.round(pickP * 100)));
        }
        if (!manual && sceneT >= LAP_S - 0.6) {
            return '確率マップ完了 — 開いた {o}マス・地雷 {m}個'.replace('{o}', o).replace('{m}', String(MINES));
        }
        return '開いた {o}マス・地雷 {m}個'.replace('{o}', o).replace('{m}', String(MINES));
    }
    function onAct(i) { manualAct(B, SEED, i, OPEN_DELAY); }
    function onFlag(i) { manualFlag(B, i); }
    function onTake() { heatOn = false; }
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
