<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다가오는 자동차와 노면 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ca is-demo" id="caRoot">
  <div class="ca__scene">
    <span class="ca__lowsun"></span>
    <div class="ca__road">
      <div class="ca__marks">
        <span class="ca__dash"></span>
        <span class="ca__dash"></span>
        <span class="ca__dash"></span>
        <span class="ca__dash"></span>
        <span class="ca__dash"></span>
        <span class="ca__dash"></span>
      </div>
    </div>
    <div class="ca__car">
      <span class="ca__glow ca__glow--l"></span>
      <span class="ca__glow ca__glow--r"></span>
      <span class="ca__body"></span>
      <span class="ca__shield"></span>
      <span class="ca__grille"></span>
      <span class="ca__lamp ca__lamp--l"></span>
      <span class="ca__lamp ca__lamp--r"></span>
      <span class="ca__indi ca__indi--l"></span>
      <span class="ca__indi ca__indi--r"></span>
      <span class="ca__wheel ca__wheel--l"></span>
      <span class="ca__wheel ca__wheel--r"></span>
    </div>
  </div>
  <button class="ca__btn" id="caBtn" type="button" aria-pressed="false">하이빔</button>
</div>
</main>
<script>
// 하이빔은 .is-beam 하나. 빛 덩어리가 커지며 밝아진다.
// 손이 닿는 순간 미리보기 루프(.is-demo)를 떼고 사람이 고른 상태를 유지한다.
(function () {
  var root = document.getElementById('caRoot');
  var btn = document.getElementById('caBtn');
  var label = '하이빔';
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    var beam = root.classList.toggle('is-beam');
    btn.setAttribute('aria-pressed', beam ? 'true' : 'false');
  });
})();
</script>
</body>
</html>
