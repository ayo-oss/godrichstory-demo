<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トランク鞄の家 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tk is-demo" id="tkRoot">
  <div class="tk__trunk">
    <div class="tk__lid">
      <span class="tk__paper"></span>
      <span class="tk__wire"></span>
      <span class="tk__bulb tk__bulb--a"></span>
      <span class="tk__bulb tk__bulb--b"></span>
      <span class="tk__bulb tk__bulb--c"></span>
      <span class="tk__bulb tk__bulb--d"></span>
      <span class="tk__bulb tk__bulb--e"></span>
      <span class="tk__bulb tk__bulb--f"></span>
      <span class="tk__mirror"><span class="tk__glass"></span><span class="tk__mshine"></span></span>
      <span class="tk__frame tk__frame--a"></span>
      <span class="tk__frame tk__frame--b"></span>
      <span class="tk__frame tk__frame--c"></span>
      <span class="tk__frame tk__frame--d"></span>
      <span class="tk__frame tk__frame--e"></span>
      <span class="tk__frame tk__frame--f"></span>
      <span class="tk__shelf tk__shelf--l"><span class="tk__book"></span><span class="tk__book tk__book--lean"></span></span>
      <span class="tk__shelf tk__shelf--r"><span class="tk__book"></span></span>
      <span class="tk__pendant"></span>
    </div>
    <div class="tk__base">
      <span class="tk__wood"></span>
      <span class="tk__sofa"><span class="tk__cushion tk__cushion--a"></span><span class="tk__cushion tk__cushion--b"></span></span>
      <span class="tk__pot"><span class="tk__leaf tk__leaf--l"></span><span class="tk__leaf tk__leaf--r"></span></span>
      <span class="tk__ladder"></span>
      <button class="tk__lamp" id="tkLamp" type="button" aria-pressed="false" aria-label="ランプ">
        <span class="tk__lstand"></span>
        <span class="tk__lshade"></span>
        <span class="tk__lglow"></span>
      </button>
      <span class="tk__warm"></span>
    </div>
    <span class="tk__hinge tk__hinge--l"></span>
    <span class="tk__hinge tk__hinge--r"></span>
    <span class="tk__handle"></span>
    <span class="tk__latch tk__latch--l"></span>
    <span class="tk__latch tk__latch--r"></span>
  </div>
  <p class="tk__hint">ランプを押してみて</p>
</div>
</main>
<script>
// ランプ: .is-lamp 하나로 갓의 온기와 방의 밝기가 같이 바뀐다.
// 손이 닿는 순간 미리보기 루프(.is-demo)를 떼고 고른 상태를 유지한다.
(function () {
  var root = document.getElementById('tkRoot');
  var lamp = document.getElementById('tkLamp');
  lamp.addEventListener('click', function () {
    root.classList.remove('is-demo');
    var lit = root.classList.toggle('is-lamp');
    lamp.setAttribute('aria-pressed', lit ? 'true' : 'false');
  });
})();
</script>
</body>
</html>
