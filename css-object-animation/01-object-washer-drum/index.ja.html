<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>洗濯機 ドラム回転 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ws is-demo" id="wsRoot">
  <div class="ws__machine">
    <span class="ws__side"></span>
    <div class="ws__top">
      <span class="ws__mark"></span>
      <span class="ws__mark ws__mark--short"></span>
      <span class="ws__dial"></span>
      <span class="ws__led ws__led--run"></span>
      <span class="ws__led ws__led--pause"></span>
    </div>
    <div class="ws__door">
      <span class="ws__ring"></span>
      <div class="ws__glass">
        <div class="ws__drum">
          <span class="ws__water ws__water--a"></span>
          <span class="ws__water ws__water--b"></span>
          <span class="ws__sock"></span>
          <span class="ws__shirt"></span>
        </div>
        <span class="ws__cat">
          <span class="ws__ear ws__ear--l"></span>
          <span class="ws__ear ws__ear--r"></span>
          <span class="ws__tail"></span>
          <span class="ws__head"></span>
          <span class="ws__eye ws__eye--l"></span>
          <span class="ws__eye ws__eye--r"></span>
        </span>
        <span class="ws__shine"></span>
        <span class="ws__shine ws__shine--b"></span>
      </div>
      <span class="ws__notch"></span>
    </div>
    <span class="ws__label"></span>
  </div>
  <button class="ws__btn" id="wsBtn" type="button" aria-pressed="false">洗濯開始</button>
</div>
</main>
<script>
// 시작/정지는 .is-pause 클래스 하나로 끝난다. 손이 닿는 순간 미리보기 루프(.is-demo)를 떼고
// 사람이 누른 상태를 그대로 유지한다. 드럼 회전 자체는 사용자 조작에서도 계속 돈다.
(function () {
  var root = document.getElementById('wsRoot');
  var btn = document.getElementById('wsBtn');
  var runLabel = '洗濯開始';
  var pauseLabel = '一時停止';
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    var paused = root.classList.toggle('is-pause');
    btn.textContent = paused ? pauseLabel : runLabel;
    btn.setAttribute('aria-pressed', paused ? 'true' : 'false');
  });
})();
</script>
</body>
</html>
