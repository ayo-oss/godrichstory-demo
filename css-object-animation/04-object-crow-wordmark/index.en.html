<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crow walking across a wordmark — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cr is-demo" id="crRoot">
  <div class="cr__scene">
    <span class="cr__wordghost" aria-hidden="true">CROW</span>
    <span class="cr__word">CROW</span>
    <span class="cr__feather cr__feather--a"></span>
    <span class="cr__feather cr__feather--b"></span>
    <span class="cr__feather cr__feather--c"></span>
    <span class="cr__drop"><span class="cr__dropleaf"></span></span>
    <button class="cr__crow" id="crCrow" type="button" aria-label="CROW">
      <span class="cr__body"></span>
      <span class="cr__tail"></span>
      <span class="cr__beak"></span>
      <span class="cr__eye"></span>
      <span class="cr__leg cr__leg--l"></span>
      <span class="cr__leg cr__leg--r"></span>
    </button>
  </div>
  <p class="cr__hint">Click the crow</p>
</div>
</main>
<script>
// 까마귀를 누르면 깃털이 한 장 떨어진다(.is-drop).
// 손이 닿는 순간 미리보기 루프(.is-demo)를 떼고 걸음을 멈춘 채 결과를 보여준다.
(function () {
  var root = document.getElementById('crRoot');
  var crow = document.getElementById('crCrow');
  crow.addEventListener('click', function () {
    root.classList.remove('is-demo');
    root.classList.remove('is-drop');
    // 같은 프레임에 지웠다 붙이면 transition 이 안 걸리므로 틀을 벌린다
    window.requestAnimationFrame(function () {
      root.classList.add('is-drop');
    });
  });
})();
</script>
</body>
</html>
