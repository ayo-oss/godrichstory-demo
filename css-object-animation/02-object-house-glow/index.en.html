<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House with window glow — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="hs is-demo" id="hsRoot">
  <div class="hs__scene">
    <span class="hs__skyday"></span>
    <div class="hs__skynight">
      <span class="hs__star hs__star--a"></span>
      <span class="hs__star hs__star--b"></span>
      <span class="hs__star hs__star--c"></span>
      <span class="hs__moon"></span>
    </div>
    <span class="hs__sun"></span>
    <span class="hs__cloud hs__cloud--a"></span>
    <span class="hs__cloud hs__cloud--b"></span>
    <span class="hs__ground"></span>
    <div class="hs__house">
      <span class="hs__smoke hs__smoke--1"></span>
      <span class="hs__smoke hs__smoke--2"></span>
      <span class="hs__smoke hs__smoke--3"></span>
      <span class="hs__chimney"></span>
      <span class="hs__roof"></span>
      <span class="hs__gable"></span>
      <span class="hs__win hs__win--round"></span>
      <span class="hs__wall"></span>
      <span class="hs__win hs__win--l"></span>
      <span class="hs__win hs__win--r"></span>
      <span class="hs__door"></span>
      <span class="hs__step"></span>
      <span class="hs__bush hs__bush--l"></span>
      <span class="hs__bush hs__bush--r"></span>
    </div>
  </div>
  <button class="hs__btn" id="hsBtn" type="button" aria-pressed="false">Lights off</button>
</div>
</main>
<script>
// Lights off/켜기는 .is-night 하나. 낮 하늘과 창문 불빛이 같이 바뀐다.
// 손이 닿는 순간 미리보기 루프(.is-demo)를 떼고 사람이 고른 상태를 유지한다.
(function () {
  var root = document.getElementById('hsRoot');
  var btn = document.getElementById('hsBtn');
  var offLabel = 'Lights off';
  var onLabel = 'Lights on';
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    var night = root.classList.toggle('is-night');
    btn.textContent = night ? onLabel : offLabel;
    btn.setAttribute('aria-pressed', night ? 'true' : 'false');
  });
})();
</script>
</body>
</html>
