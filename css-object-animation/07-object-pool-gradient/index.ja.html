<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水たまりグラデーション背景 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pl is-demo" id="plRoot">
  <div class="pl__board">
    <svg class="pl__svg" viewBox="0 0 300 160" role="img" aria-label="水たまり背景">
      <defs>
        <radialGradient id="plTeal" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#86b3c3"/>
          <stop offset="55%" stop-color="#5399a8"/>
          <stop offset="100%" stop-color="#478090"/>
        </radialGradient>
        <radialGradient id="plPink" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e3c7c6"/>
          <stop offset="55%" stop-color="#c96a78"/>
          <stop offset="100%" stop-color="#8d4f66"/>
        </radialGradient>
        <radialGradient id="plViolet" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#af9cce"/>
          <stop offset="55%" stop-color="#9387c4"/>
          <stop offset="100%" stop-color="#392a7a"/>
        </radialGradient>
      </defs>
      <g class="pl__blob pl__blob--teal" id="plTealGroup">
        <ellipse cx="96" cy="84" rx="64" ry="44" fill="url(#plTeal)" opacity=".34"/>
        <ellipse cx="99" cy="81" rx="52" ry="35" fill="url(#plTeal)" opacity=".5" transform="rotate(-8 99 81)"/>
        <ellipse cx="93" cy="86" rx="40" ry="26" fill="url(#plTeal)" opacity=".7" transform="rotate(7 93 86)"/>
        <ellipse cx="98" cy="82" rx="29" ry="18" fill="url(#plTeal)" opacity=".9" transform="rotate(-4 98 82)"/>
        <ellipse cx="96" cy="84" rx="18" ry="11" fill="#7bbeb5"/>
      </g>
      <g class="pl__blob pl__blob--pink" id="plPinkGroup">
        <ellipse cx="34" cy="26" rx="44" ry="30" fill="url(#plPink)" opacity=".34"/>
        <ellipse cx="37" cy="24" rx="33" ry="22" fill="url(#plPink)" opacity=".55" transform="rotate(10 37 24)"/>
        <ellipse cx="31" cy="28" rx="22" ry="14" fill="url(#plPink)" opacity=".8" transform="rotate(-6 31 28)"/>
        <ellipse cx="34" cy="26" rx="12" ry="8" fill="#ebd8d6"/>
      </g>
      <g class="pl__blob pl__blob--violet" id="plVioletGroup">
        <ellipse cx="238" cy="128" rx="52" ry="34" fill="url(#plViolet)" opacity=".34"/>
        <ellipse cx="241" cy="125" rx="40" ry="25" fill="url(#plViolet)" opacity=".55" transform="rotate(-9 241 125)"/>
        <ellipse cx="235" cy="130" rx="28" ry="17" fill="url(#plViolet)" opacity=".8" transform="rotate(5 235 130)"/>
        <ellipse cx="238" cy="128" rx="16" ry="10" fill="#c5badd"/>
      </g>
    </svg>
  </div>
  <button class="pl__btn" id="plBtn" type="button" aria-pressed="false">色の位置を入れ替える</button>
</div>
</main>
<script>
// 色の位置を入れ替える: .is-swap 하나로 청록 웅덩이와 분홍 웅덩이의 위치를 맞바꾼다.
// SVG g 도 CSS transform/transition 을 따르므로 (transform-box: fill-box)
// 도형을 다시 그리지 않고 위치만 옮긴다.
(function () {
  var root = document.getElementById('plRoot');
  var btn = document.getElementById('plBtn');
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    var swapped = root.classList.toggle('is-swap');
    btn.setAttribute('aria-pressed', swapped ? 'true' : 'false');
  });
})();
</script>
</body>
</html>
