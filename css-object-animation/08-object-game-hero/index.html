<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 회사풍 히어로 배경 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gh is-demo" id="ghRoot">
  <div class="gh__hero">
    <span class="gh__bloom"></span>
    <span class="gh__swirl"></span>
    <span class="gh__haze"></span>
    <span class="gh__horizon"></span>
    <span class="gh__dot gh__dot--a"></span>
    <span class="gh__dot gh__dot--b"></span>
    <span class="gh__dot gh__dot--c"></span>
    <span class="gh__dot gh__dot--d"></span>
    <span class="gh__dot gh__dot--e"></span>
    <p class="gh__tag">NEW WORLD</p>
  </div>
  <button class="gh__btn" id="ghBtn" type="button" aria-pressed="false">회전 반전</button>
</div>
</main>
<script>
// 회전 반전: .is-rev 하나로 소용돌이 띠의 animation-direction 을 뒤집는다.
// 손이 닿는 순간 미리보기 루프(.is-demo)를 떼고 고른 방향을 유지한다.
(function () {
  var root = document.getElementById('ghRoot');
  var btn = document.getElementById('ghBtn');
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    var rev = root.classList.toggle('is-rev');
    btn.setAttribute('aria-pressed', rev ? 'true' : 'false');
  });
})();
</script>
</body>
</html>
