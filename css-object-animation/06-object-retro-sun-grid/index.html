<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레트로 해와 원근 그리드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rt is-demo" id="rtRoot">
  <span class="rt__star rt__star--a"></span>
  <span class="rt__star rt__star--b"></span>
  <span class="rt__star rt__star--c"></span>
  <span class="rt__star rt__star--d"></span>
  <span class="rt__comet"></span>
  <span class="rt__shot"><span class="rt__streak"></span></span>
  <div class="rt__sun">
    <span class="rt__sunball"></span>
    <span class="rt__sunlines"></span>
  </div>
  <span class="rt__mount rt__mount--l"></span>
  <span class="rt__mount rt__mount--r"></span>
  <div class="rt__floor">
    <div class="rt__grid"></div>
  </div>
  <span class="rt__palm rt__palm--big"></span>
  <span class="rt__palm rt__palm--small"></span>
  <p class="rt__title">RETRO CSS</p>
  <button class="rt__fire" id="rtFire" type="button" aria-pressed="false">유성 쏘기</button>
</div>
</main>
<script>
// 유성: 미리보기 루프와 별개로, 누를 때마다 .is-shot 을 다시 걸어
// 대각선 스트릭을 transition 으로 한 번 가로지르게 한다.
(function () {
  var root = document.getElementById('rtRoot');
  var btn = document.getElementById('rtFire');
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    root.classList.remove('is-shot');
    window.requestAnimationFrame(function () {
      root.classList.add('is-shot');
    });
  });
})();
</script>
</body>
</html>
