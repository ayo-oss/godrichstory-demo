<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote bar rises as lines settle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="qb is-demo" aria-label="Quote that opens as the side bar grows">
    <span class="qb__bar" aria-hidden="true"></span>
    <div class="qb__content">
      <blockquote class="qb__body">
        <p class="qb__l1">Good writing is written twice.</p>
        <p class="qb__l2">First for the thinking, then for the reader.</p>
      </blockquote>
      <figcaption class="qb__cite">— Editors' rule of thumb</figcaption>
    </div>
  </figure>
</main>
</body>
</html>
