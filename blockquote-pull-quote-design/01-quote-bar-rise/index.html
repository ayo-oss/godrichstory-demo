<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote bar rises as lines settle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="qb is-demo" aria-label="막대가 자라며 열리는 인용구">
    <span class="qb__bar" aria-hidden="true"></span>
    <div class="qb__content">
      <blockquote class="qb__body">
        <p class="qb__l1">좋은 글은 두 번 쓴다.</p>
        <p class="qb__l2">먼저 생각을 위해, 다음엔 독자를 위해.</p>
      </blockquote>
      <figcaption class="qb__cite">— 편집실 수칙</figcaption>
    </div>
  </figure>
</main>
</body>
</html>
