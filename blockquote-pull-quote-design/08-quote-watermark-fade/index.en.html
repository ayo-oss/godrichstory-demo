<title>Giant quote mark fades in behind — demo</title>

<body>
<main class="stage">
  <figure class="qw is-demo" aria-label="Quote with a giant mark behind">
    <span class="qw__mark" aria-hidden="true">&ldquo;</span>
    <blockquote class="qw__body">A slow sentence<br>beats a fast one.</blockquote>
