<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giant quote mark fades in behind — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="qw is-demo" aria-label="뒤에 큰 따옴표가 떠오르는 인용구">
    <span class="qw__mark" aria-hidden="true">&ldquo;</span>
    <blockquote class="qw__body">느린 문장이<br>빠른 문장을 이긴다.</blockquote>
    <figcaption class="qw__cite">— 에세이 여는 글</figcaption>
  </figure>
</main>
</body>
</html>
