<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote swaps to the next line on hover — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="qx is-demo" id="qx" aria-label="手を置くと変わる引用">
    <svg class="qx__mark" id="qx-mark" viewBox="0 0 256 256" width="20" height="20" fill="currentColor" aria-hidden="true"><g><path d="M108 72v72H40a8 8 0 0 1-8-8V72a8 8 0 0 1 8-8h60a8 8 0 0 1 8 8m108-8h-60a8 8 0 0 0-8 8v64a8 8 0 0 0 8 8h68V72a8 8 0 0 0-8-8" opacity=".2"/><path d="M100 56H40a16 16 0 0 0-16 16v64a16 16 0 0 0 16 16h60v8a32 32 0 0 1-32 32a8 8 0 0 0 0 16a48.05 48.05 0 0 0 48-48V72a16 16 0 0 0-16-16m0 80H40V72h60Zm116-80h-60a16 16 0 0 0-16 16v64a16 16 0 0 0 16 16h60v8a32 32 0 0 1-32 32a8 8 0 0 0 0 16a48.05 48.05 0 0 0 48-48V72a16 16 0 0 0-8-16m0 80h-60V72h60Z"/></g></svg>
    <div class="qx__swap" aria-live="polite">
      <p class="qx__line is-on" aria-hidden="false">コードは読まれるために書く。</p>
      <p class="qx__line" aria-hidden="true">画面は待つ人に配慮する。</p>
      <p class="qx__line" aria-hidden="true">数字は桁を守る。</p>
    </div>
    <figcaption class="qx__foot">
      <span class="qx__dots" aria-hidden="true">
        <span class="qx__dot is-on"></span>
        <span class="qx__dot"></span>
        <span class="qx__dot"></span>
      </span>
      <button class="qx__next" id="qx-next" type="button">次の引用</button>
    </figcaption>
  </figure>
</main>
<script>
// 손을 얹거나(hover) 버튼을 누르면 다음 인용으로 바뀐다 — 격자 루프의 steps 컷과 달리
// 실사용에서는 is-on 클래스가 움직이는 문장을 결정하고, 따옴표가 짧게 튀어 교체를 알린다.
var qxRoot = document.getElementById('qx');
var qxLines = qxRoot.querySelectorAll('.qx__line');
var qxDots = qxRoot.querySelectorAll('.qx__dot');
var qxMark = document.getElementById('qx-mark');
var qxIndex = 0;

function qxDraw() {
  for (var i = 0; i < qxLines.length; i++) {
    qxLines[i].classList.toggle('is-on', i === qxIndex);
    qxLines[i].setAttribute('aria-hidden', i === qxIndex ? 'false' : 'true');
    qxDots[i].classList.toggle('is-on', i === qxIndex);
  }
  qxMark.classList.remove('is-bump');
  void qxMark.offsetWidth; // 리플로우를 한 번 걸어 튕김 애니메이션을 다시 시작하게 한다
  qxMark.classList.add('is-bump');
}
function qxGo() {
  qxIndex = (qxIndex + 1) % qxLines.length;
  qxDraw();
}
// 카드에 손을 얹으면 격자 루프(.is-demo)를 뗀다 — 이때부터 클래스가 곧 상태다
qxRoot.addEventListener('mouseenter', function () {
  qxRoot.classList.remove('is-demo');
  qxGo();
});
// 버튼은 키보드 경로다 — 마우스 클릭(event.detail > 0)은 진입(hover)에서 이미 한 번
// 진행됐으므로 무시한다. 두 번 건너뛰는 것을 막는다.
document.getElementById('qx-next').addEventListener('click', function (event) {
  if (event.detail > 0) return;
  qxGo();
});
</script>
</body>
</html>
