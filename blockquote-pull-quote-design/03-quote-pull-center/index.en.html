<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">

<title>Pull quote settles mid-article — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="qp is-demo" aria-label="Pull quote settling mid-article">
    <p class="qp__ctx qp__ctx--pre">Readers come down the page one line at a time.</p>
    <blockquote class="qp__pull" >
      <span class="qp__a">Speed</span>
      <span class="qp__b">is a feature.</span>
    </blockquote>
    <p class="qp__ctx qp__ctx--post">One big line in that flow lets them breathe.</p>
  </section>
</main>
</body>
</html>
