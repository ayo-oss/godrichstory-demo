<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pull quote settles mid-article — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="qp is-demo" aria-label="本文の真ん中に降りてくる強調文">
    <p class="qp__ctx qp__ctx--pre">文書を読む人は上から下へ一行ずつ降りてくる。</p>
    <blockquote class="qp__pull" >
      <span class="qp__a">速さは</span>
      <span class="qp__b">機能である。</span>
    </blockquote>
    <p class="qp__ctx qp__ctx--post">その流れの中で大きな一文が息を整える。</p>
  </section>
</main>
</body>
</html>
