<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pull quote settles mid-article — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="qp is-demo" aria-label="본문 한가운데 내려앉는 강조 문장">
    <p class="qp__ctx qp__ctx--pre">문서를 읽는 사람은 위에서 아래로 한 줄씩 내려온다.</p>
    <blockquote class="qp__pull" >
      <span class="qp__a">속도는</span>
      <span class="qp__b">기능이다.</span>
    </blockquote>
    <p class="qp__ctx qp__ctx--post">그 흐름 속에서 큰 문장 하나가 숨을 고르게 한다.</p>
  </section>
</main>
</body>
</html>
