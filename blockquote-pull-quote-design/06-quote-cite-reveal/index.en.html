<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote source line reveals late — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="qc is-demo" aria-label="Source line revealing the speaker late">
    <blockquote class="qc__body">Understanding is subtraction, not addition.</blockquote>
    <figcaption class="qc__src">
      <span class="qc__disc" aria-hidden="true">P</span>
      <span class="qc__who">
        <span class="qc__name">Print editor</span>
        <span class="qc__role">Monthly magazine interview</span>
      </span>
    </figcaption>
  </figure>
</main>
</body>
</html>
