<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote source line reveals late — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="qc is-demo" aria-label="출처가 늦게 드러나는 인용구">
    <blockquote class="qc__body">이해는 더하기가 아니라 빼기다.</blockquote>
    <figcaption class="qc__src">
      <span class="qc__disc" aria-hidden="true">지</span>
      <span class="qc__who">
        <span class="qc__name">지면 편집자</span>
        <span class="qc__role">월간 잡지 인터뷰</span>
      </span>
    </figcaption>
  </figure>
</main>
</body>
</html>
