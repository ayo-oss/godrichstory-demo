<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote source line reveals late — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <figure class="qc is-demo" aria-label="出典が遅れて現れる引用">
    <blockquote class="qc__body">理解は足し算ではなく引き算だ。</blockquote>
    <figcaption class="qc__src">
      <span class="qc__disc" aria-hidden="true">紙</span>
      <span class="qc__who">
        <span class="qc__name">紙面編集者</span>
        <span class="qc__role">月刊誌インタビュー</span>
      </span>
    </figcaption>
  </figure>
</main>
</body>
</html>
