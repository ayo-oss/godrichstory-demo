<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>積もって崩れる雪だまり — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="雪の場面の舞台 — 押してから左右の矢印キーで風を変え、Enter で一時停止">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="文字の形の棚の上で、左は傾きの限界がなく塔のように積もる雪、右は傾きの限界を越えると低いほうへ流れてなだらかな丘になる雪を並べて見せる"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">雪の場面</p>
  <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 같은 시드면 같은 눈 (32비트 xorshift 에 곱셈 섞기 한 번)
    function seeded(seed) {
        let s = (seed * 2654435761) >>> 0 || 1;
        return function () {
            s ^= s << 13;
            s >>>= 0;
            s ^= s >>> 17;
            s ^= s << 5;
            s >>>= 0;
            return (Math.imul(s, 0x9e3779b1) >>> 0) / 4294967296;
        };
    }
    // 장면 시계(초) — 장면 계산이 고치고 화면 쪽이 읽는다
    let sceneT = 0;
    // 자동 시연이 장면을 움직이는가 — 사람이 무대에서 처음 손대면 꺼진다
    let autoOn = true;
    // 사람이 주는 바람(−1 왼쪽 ~ 1 오른쪽) — 방향키·무대 위 가로 끌기. 자동 시연 중에는 0
    let windUser = 0;
    function userWind() { return autoOn ? 0 : windUser; }
    // 파스텔 팔레트 — 눈은 흰색 계열(기능색), 하늘·땅은 낮은 채도의 해질녘 청보라
    const SNOW = [255, 255, 255];
    const SNOW_SHADE = [208, 222, 246];
    const SKY_TOP = [70, 82, 140];
    const SKY_BOT = [146, 158, 212];
    const NIGHT_TOP = [38, 44, 86];
    const NIGHT_BOT = [78, 88, 140];
    const GROUND = [196, 206, 232];
    const DUSK = [96, 104, 156];
    const DUSK_DEEP = [60, 66, 112];
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    const LAMP = [255, 232, 168];
    const BUTTER = [247, 226, 156];
    const ROSE = [232, 164, 178];
    const MINT = [166, 220, 200];
    const WATER = [190, 222, 248];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function skyFill(top, bot) {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bot, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function seg(x1, y1, x2, y2, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 글자 이름표 — 바탕 알약 위에 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    // 눈송이 한 알 — 번짐 반지름(blur)만큼 옅은 후광을 먼저 깔고 가운데를 또렷하게
    function flakeDot(x, y, r, blur, c, a) {
        if (blur > 0.3) {
            disc(x, y, r + blur, c, a * 0.3);
        }
        disc(x, y, r, c, a);
    }
    // ── 03 쌓이며 무너지는 눈더미 ─────────────────────────────────
    // 기울기 한계 — 이웃 열과의 눈 표면 높이 차를 몇 알(GRAIN 높이)까지 받아들이나. 넘은 만큼의 반을 낮은 쪽으로 흘린다
    const REPOSE = 1;
    // 눈 한 알이 한 열의 높이에 더하는 양(px)
    const ADD = 3;
    // 한 열의 폭(px)이자 높이 한 알(px)
    const GRAIN = 3;
    const FLAKES = 84;
    const LOOP_S = 6;
    const REST_STEPS = 45;
    const PANEL_W = 240;
    const COLS = PANEL_W / GRAIN;
    const GROUND_Y = 262;
    // 선반 — 글자 윗면처럼 높이가 다른 세 덩어리(px). 눈은 이 위에 쌓인다
    const BASE = [];
    for (let c = 0; c < COLS; c += 1) {
        BASE.push(c >= 8 && c < 26 ? 18 : (c >= 34 && c < 46 ? 36 : (c >= 56 && c < 72 ? 12 : 0)));
    }
    let panels = [];
    // 눈 줄기 — 바람이 눈을 모아 떨어뜨리는 세 자리(열)와 흩어진 눈
    const STREAMS = [17, 40, 64];
    function makePanel(limit) {
        const rng = seeded(303);
        const h = [];
        for (let c = 0; c < COLS; c += 1) {
            h.push(0);
        }
        const fl = [];
        for (let i = 0; i < FLAKES; i += 1) {
            fl.push({ x: 0, y: 0, v: 0, s: 0 });
        }
        const p = { h: h, fl: fl, limit: limit, rng: rng };
        for (const f of fl) {
            respawn(p, f);
            f.y = rng() * GROUND_Y;
        }
        return p;
    }
    function respawn(p, f) {
        const r = p.rng();
        const col = r < 0.65 ? STREAMS[Math.floor(p.rng() * 3)] + (p.rng() + p.rng() + p.rng() - 1.5) * 3 : p.rng() * COLS;
        f.x = clamp(col, 0, COLS - 1) * GRAIN + GRAIN * 0.5;
        f.y = -4 - p.rng() * 30;
        f.v = 95 + p.rng() * 40;
        f.s = 1.4 + p.rng() * 1.6;
    }
    // 눈 표면 높이(px) — 선반 + 쌓인 눈
    function surface(p, c) { return BASE[c] + p.h[c]; }
    // 기울기 한계 — 한 열의 표면이 오른쪽·왼쪽 이웃보다 한계 넘게 높으면 넘은 만큼의 반을 낮은 쪽으로 보낸다. 네 번 되풀이해 무너짐이 번지게
    function relax(p) {
        if (p.limit >= 1e6) {
            return;
        }
        const maxDiff = p.limit * GRAIN;
        for (let pass = 0; pass < 4; pass += 1) {
            for (let c = 0; c < COLS; c += 1) {
                for (let d = -1; d <= 1; d += 2) {
                    const n = c + d;
                    if (n < 0 || n >= COLS) {
                        continue;
                    }
                    const excess = surface(p, c) - surface(p, n) - maxDiff;
                    if (excess > 0 && p.h[c] > 0) {
                        const move = Math.min(p.h[c], excess * 0.5);
                        p.h[c] -= move;
                        p.h[n] += move;
                    }
                }
            }
        }
    }
    function stepPanel(p, dt) {
        const wind = userWind() * 30;
        for (const f of p.fl) {
            f.y += f.v * dt;
            f.x += wind * dt;
            const c = clamp(Math.floor(f.x / GRAIN), 0, COLS - 1);
            if (f.y >= GROUND_Y - surface(p, c)) {
                // 바닥에 닿은 눈은 사라지지 않고 높이 지도에 더해진 뒤 위에서 다시 내려온다
                p.h[c] += ADD;
                respawn(p, f);
            }
        }
        relax(p);
    }
    function reset() {
        panels = [makePanel(1e9), makePanel(REPOSE)];
        for (let k = 0; k < 55; k += 1) {
            for (const p of panels) {
                stepPanel(p, 1 / 30);
            }
        }
    }
    function update(dt) {
        for (const p of panels) {
            stepPanel(p, dt);
        }
    }
    function peak(p) {
        let m = 0;
        for (let c = 0; c < COLS; c += 1) {
            if (p.h[c] > m) {
                m = p.h[c];
            }
        }
        return m;
    }
    function drawPanel(p, ox) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(ox, 0, PANEL_W, H);
        ctx.clip();
        ctx.translate(ox, 0);
        // 선반
        for (let c = 0; c < COLS; c += 1) {
            if (BASE[c] > 0) {
                box(c * GRAIN, GROUND_Y - BASE[c], GRAIN + 0.6, BASE[c] + 40, 0, DUSK_DEEP, 1);
            }
        }
        box(0, GROUND_Y, PANEL_W, H - GROUND_Y, 0, DUSK_DEEP, 1);
        // 쌓인 눈 — 열마다 선반 윗면에서 눈 높이만큼만 채운다
        for (let c = 0; c < COLS; c += 1) {
            if (p.h[c] > 0) {
                box(c * GRAIN, GROUND_Y - surface(p, c), GRAIN + 0.6, p.h[c], 0, SNOW, 1);
            }
        }
        ctx.beginPath();
        for (let c = 0; c < COLS; c += 1) {
            const top = GROUND_Y - surface(p, c);
            if (c === 0) {
                ctx.moveTo(0, top + 1.5);
            }
            else {
                ctx.lineTo(c * GRAIN, top + 1.5);
            }
            ctx.lineTo((c + 1) * GRAIN, top + 1.5);
        }
        ctx.lineWidth = 2;
        ctx.strokeStyle = rgba(SNOW_SHADE, 1);
        ctx.stroke();
        for (const f of p.fl) {
            flakeDot(f.x, f.y, f.s, 0, SNOW, 0.95);
        }
        ctx.restore();
    }
    function draw() {
        skyFill(SKY_TOP, SKY_BOT);
        drawPanel(panels[0], 0);
        drawPanel(panels[1], PANEL_W);
        box(PANEL_W - 1, 0, 2, H, 0, INK, 0.55);
        tag('傾きの限界なし・いちばん高い雪 {n}px'.replace('{n}', String(Math.round(peak(panels[0])))), PANEL_W / 2, 280, PAPER, INK, 10, 'center');
        tag('傾きの限界 {r}・いちばん高い雪 {n}px'.replace('{r}', String(REPOSE)).replace('{n}', String(Math.round(peak(panels[1])))), PANEL_W * 1.5, 280, PAPER, INK, 10, 'center');
    }
    function statusText() {
        return '限界なし {a}px・限界 {r} {b}px'.replace('{a}', String(Math.round(peak(panels[0])))).replace('{r}', String(REPOSE)).replace('{b}', String(Math.round(peak(panels[1]))));
    }
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 사람이 바람을 만지면 자동 시연의 바람은 손을 뗀다
    function takeOver() {
        wake();
        autoOn = false;
    }
    // 한 프레임에 넘기는 시간 상한(초) — 오래 숨었다 돌아온 첫 프레임도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    // 방향키 한 번에 바뀌는 바람 몫
    const WIND_STEP = 0.25;
    function showNow() {
        if (still || paused) {
            draw();
            pushStatus(statusText());
        }
    }
    function advance(dt) {
        sceneT += dt;
        if (sceneT >= LOOP_S) {
            sceneT -= LOOP_S;
            reset();
        }
        update(dt);
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        draw();
        pushStatus(statusText());
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 눈이 이미 내려 쌓인 정지 장면 한 장
    function showRest() {
        stopLoop();
        sceneT = 0;
        reset();
        for (let k = 0; k < REST_STEPS; k += 1) {
            update(1 / 30);
        }
        draw();
        pushStatus(statusText());
    }
    function play() {
        sceneT = 0;
        reset();
        draw();
        pushStatus(statusText());
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    // 방향키 — 무대에 포커스가 있을 때만. 왼쪽·오른쪽은 바람, Enter·Space 는 一時停止. 무대 밖에서는 화살표가 페이지를 스크롤한다
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            e.preventDefault();
            takeOver();
            windUser = clamp(windUser + (e.key === 'ArrowRight' ? WIND_STEP : -WIND_STEP), -1, 1);
            showNow();
        }
        else if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            togglePause();
        }
    }, { signal: off.signal });
    // 포인터 — 무대 안에서 누른 채 가로로 끌면 그 위치가 바람(가운데 0, 가장자리 ±1)
    let dragging = -1;
    function windAt(e) {
        const r = pad.getBoundingClientRect();
        windUser = clamp(((e.clientX - r.left) / r.width - 0.5) * 2.4, -1, 1);
    }
    pad.addEventListener('pointerdown', function (e) {
        takeOver();
        pad.setPointerCapture(e.pointerId);
        dragging = e.pointerId;
        windAt(e);
        showNow();
    }, { signal: off.signal });
    pad.addEventListener('pointermove', function (e) {
        if (dragging !== e.pointerId) {
            return;
        }
        windAt(e);
        showNow();
    }, { signal: off.signal });
    function release(e) {
        if (dragging !== e.pointerId) {
            return;
        }
        dragging = -1;
        windUser = 0;
        showNow();
    }
    pad.addEventListener('pointerup', release, { signal: off.signal });
    pad.addEventListener('pointercancel', release, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 정지 장면, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw();
    }, { signal: off.signal });
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
