<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snow in a Lamp's Light Cone — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="Snow scene stage: click it, then change the wind with the left and right arrow keys, press Enter to pause">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="Only snow inside a lamp light cone glows white by distance and angle, edge flakes brighten by forward scattering, and a column of light sweeps side to side in the dark"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">Snowy scene</p>
  <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 같은 시드면 같은 눈 (32비트 xorshift 에 곱셈 섞기 한 번)
    function seeded(seed) {
        let s = (seed * 2654435761) >>> 0 || 1;
        return function () {
            s ^= s << 13;
            s >>>= 0;
            s ^= s >>> 17;
            s ^= s << 5;
            s >>>= 0;
            return (Math.imul(s, 0x9e3779b1) >>> 0) / 4294967296;
        };
    }
    // 장면 시계(초) — 장면 계산이 고치고 화면 쪽이 읽는다
    let sceneT = 0;
    // 자동 시연이 장면을 움직이는가 — 사람이 무대에서 처음 손대면 꺼진다
    let autoOn = true;
    // 사람이 주는 바람(−1 왼쪽 ~ 1 오른쪽) — 방향키·무대 위 가로 끌기. 자동 시연 중에는 0
    let windUser = 0;
    function userWind() { return autoOn ? 0 : windUser; }
    // 파스텔 팔레트 — 눈은 흰색 계열(기능색), 하늘·땅은 낮은 채도의 해질녘 청보라
    const SNOW = [255, 255, 255];
    const SNOW_SHADE = [208, 222, 246];
    const SKY_TOP = [70, 82, 140];
    const SKY_BOT = [146, 158, 212];
    const NIGHT_TOP = [38, 44, 86];
    const NIGHT_BOT = [78, 88, 140];
    const GROUND = [196, 206, 232];
    const DUSK = [96, 104, 156];
    const DUSK_DEEP = [60, 66, 112];
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    const LAMP = [255, 232, 168];
    const BUTTER = [247, 226, 156];
    const ROSE = [232, 164, 178];
    const MINT = [166, 220, 200];
    const WATER = [190, 222, 248];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function skyFill(top, bot) {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bot, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function seg(x1, y1, x2, y2, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 글자 이름표 — 바탕 알약 위에 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    // 눈송이 한 알 — 번짐 반지름(blur)만큼 옅은 후광을 먼저 깔고 가운데를 또렷하게
    function flakeDot(x, y, r, blur, c, a) {
        if (blur > 0.3) {
            disc(x, y, r + blur, c, a * 0.3);
        }
        disc(x, y, r, c, a);
    }
    // ── 06 가로등 빛 원뿔 속 눈 ───────────────────────────────────
    // 원뿔 반각(라디안)과 가장자리 쪽 밝기 떨어지는 차수
    const CONE_HALF = 0.62;
    const CONE_POWER = 2;
    // 거리 감쇠 — 밝기 ÷ (1 + (d ÷ LAMP_RANGE)²)
    const LAMP_RANGE = 170;
    // 원뿔 밖 눈이 가진 주변광 밝기
    const AMBIENT = 0.16;
    // 앞쪽 산란 세기와 위상 비대칭(g)
    const SCATTER = 1.1;
    const PHASE_G = 0.55;
    const FLAKES = 300;
    const LOOP_S = 6;
    const REST_STEPS = 40;
    const LAMP_X = 150;
    const LAMP_Y = 66;
    let flakes = [];
    let rng = seeded(606);
    // 가로등이 흔들리는 각 — 사인으로 오가며 원뿔이 좌우로 쓸린다
    function axisAngle(t) { return Math.PI / 2 - 0.55 + Math.sin(t * 1.05) * 0.5; }
    function reset() {
        rng = seeded(606);
        flakes = [];
        for (let i = 0; i < FLAKES; i += 1) {
            const s = 1.2 + Math.pow(rng(), 1.8) * 3.4;
            flakes.push({ x: rng() * (W + 40) - 20, y: rng() * (H + 20) - 10, z: rng(), s: s, ph: rng() * TAU, lit: 0 });
        }
    }
    // 눈 한 알의 밝기 — 원뿔 몫 × 거리 감쇠 × (1 + 앞쪽 산란), 원뿔 밖은 AMBIENT
    function brightness(f, axis) {
        const dx = f.x - LAMP_X;
        const dy = f.y - LAMP_Y;
        const d = Math.hypot(dx, dy);
        if (d < 1) {
            return 1;
        }
        let th = Math.abs(Math.atan2(dy, dx) - axis);
        if (th > Math.PI) {
            th = TAU - th;
        }
        const t = th / CONE_HALF;
        const cone = t < 1 ? Math.pow(Math.cos(t * Math.PI / 2), CONE_POWER) : 0;
        const fall = 1 / (1 + (d / LAMP_RANGE) * (d / LAMP_RANGE));
        // 앞쪽 산란 — 빛이 눈을 지나 카메라 쪽으로 가는 정도. 카메라에 가까운 눈(z 큼)일수록, 원뿔 가운데와 바깥에서는 0 이고 반각의 절반 부근에서 가장 크다
        const toward = clamp(f.z * 1.2 - 0.2, 0, 1) * Math.sin(Math.min(1, t) * Math.PI);
        const cosA = clamp(toward, 0, 1);
        const hg = (1 - PHASE_G * PHASE_G) / Math.pow(1 + PHASE_G * PHASE_G - 2 * PHASE_G * cosA, 1.5);
        const scat = SCATTER * hg * 0.14;
        return clamp(AMBIENT + cone * fall * (0.9 + scat), 0, 1.4);
    }
    function update(dt) {
        const wind = autoOn ? Math.sin(sceneT * 0.8) * 0.5 : userWind();
        for (const f of flakes) {
            f.y += (26 + 46 * f.z) * dt;
            f.x += wind * 30 * (0.4 + f.z) * dt + Math.sin(sceneT * 1.6 + f.ph) * 8 * dt;
            if (f.y > H + 8) {
                f.y -= H + 16;
            }
            if (f.x > W + 20) {
                f.x -= W + 40;
            }
            if (f.x < -20) {
                f.x += W + 40;
            }
        }
    }
    function draw() {
        skyFill(NIGHT_TOP, NIGHT_BOT);
        const axis = axisAngle(sceneT);
        // 빛 원뿔 — 어둠 속에 떠오르는 부채꼴
        ctx.beginPath();
        ctx.moveTo(LAMP_X, LAMP_Y);
        ctx.arc(LAMP_X, LAMP_Y, 330, axis - CONE_HALF, axis + CONE_HALF);
        ctx.closePath();
        const g = ctx.createRadialGradient(LAMP_X, LAMP_Y, 6, LAMP_X, LAMP_Y, 300);
        g.addColorStop(0, rgba(LAMP, 0.5));
        g.addColorStop(1, rgba(LAMP, 0));
        ctx.fillStyle = g;
        ctx.fill();
        // 땅
        box(0, 258, W, 42, 0, DUSK_DEEP, 1);
        // 가로등
        box(LAMP_X - 3, LAMP_Y, 6, 194, 2, INK, 1);
        box(LAMP_X - 12, LAMP_Y - 12, 24, 14, 6, INK, 1);
        disc(LAMP_X, LAMP_Y + 2, 7, LAMP, 1);
        disc(LAMP_X, LAMP_Y + 2, 16, LAMP, 0.3);
        let lit = 0;
        for (const f of flakes) {
            const b = brightness(f, axis);
            f.lit = b;
            if (b > 0.45) {
                lit += 1;
            }
            const tw = b > 0.45 ? 0.82 + 0.18 * Math.sin(sceneT * 9 + f.ph) : 1;
            const c = mix(SNOW_SHADE, SNOW, clamp(b, 0, 1));
            flakeDot(f.x, f.y, f.s * 0.6, b > 0.6 ? 1.8 : 0, c, clamp(0.25 + 0.75 * b, 0, 1) * tw);
        }
        litCount = lit;
    }
    let litCount = 0;
    function statusText() {
        let top = 0;
        for (const f of flakes) {
            top = Math.max(top, f.lit);
        }
        return '{n} flakes in the light · brightest {b}%'.replace('{n}', String(litCount)).replace('{b}', String(Math.round(clamp(top, 0, 1) * 100)));
    }
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 사람이 바람을 만지면 자동 시연의 바람은 손을 뗀다
    function takeOver() {
        wake();
        autoOn = false;
    }
    // 한 프레임에 넘기는 시간 상한(초) — 오래 숨었다 돌아온 첫 프레임도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    // 방향키 한 번에 바뀌는 바람 몫
    const WIND_STEP = 0.25;
    function showNow() {
        if (still || paused) {
            draw();
            pushStatus(statusText());
        }
    }
    function advance(dt) {
        sceneT += dt;
        if (sceneT >= LOOP_S) {
            sceneT -= LOOP_S;
            reset();
        }
        update(dt);
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        draw();
        pushStatus(statusText());
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 눈이 이미 내려 쌓인 정지 장면 한 장
    function showRest() {
        stopLoop();
        sceneT = 0;
        reset();
        for (let k = 0; k < REST_STEPS; k += 1) {
            update(1 / 30);
        }
        draw();
        pushStatus(statusText());
    }
    function play() {
        sceneT = 0;
        reset();
        draw();
        pushStatus(statusText());
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    // 방향키 — 무대에 포커스가 있을 때만. 왼쪽·오른쪽은 바람, Enter·Space 는 Pause. 무대 밖에서는 화살표가 페이지를 스크롤한다
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            e.preventDefault();
            takeOver();
            windUser = clamp(windUser + (e.key === 'ArrowRight' ? WIND_STEP : -WIND_STEP), -1, 1);
            showNow();
        }
        else if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            togglePause();
        }
    }, { signal: off.signal });
    // 포인터 — 무대 안에서 누른 채 가로로 끌면 그 위치가 바람(가운데 0, 가장자리 ±1)
    let dragging = -1;
    function windAt(e) {
        const r = pad.getBoundingClientRect();
        windUser = clamp(((e.clientX - r.left) / r.width - 0.5) * 2.4, -1, 1);
    }
    pad.addEventListener('pointerdown', function (e) {
        takeOver();
        pad.setPointerCapture(e.pointerId);
        dragging = e.pointerId;
        windAt(e);
        showNow();
    }, { signal: off.signal });
    pad.addEventListener('pointermove', function (e) {
        if (dragging !== e.pointerId) {
            return;
        }
        windAt(e);
        showNow();
    }, { signal: off.signal });
    function release(e) {
        if (dragging !== e.pointerId) {
            return;
        }
        dragging = -1;
        windUser = 0;
        showNow();
    }
    pad.addEventListener('pointerup', release, { signal: off.signal });
    pad.addEventListener('pointercancel', release, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 정지 장면, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw();
    }, { signal: off.signal });
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
