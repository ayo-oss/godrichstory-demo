<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snow Swirled by a Gust Field — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="Snow scene stage: click it, then change the wind with the left and right arrow keys, press Enter to pause">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="A moving gust field adds a rotating velocity at each flake so snow falls in lines then curls up and sinks again, while short lines on a grid show the field direction"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">Snowy scene</p>
  <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 같은 시드면 같은 눈 (32비트 xorshift 에 곱셈 섞기 한 번)
    function seeded(seed) {
        let s = (seed * 2654435761) >>> 0 || 1;
        return function () {
            s ^= s << 13;
            s >>>= 0;
            s ^= s >>> 17;
            s ^= s << 5;
            s >>>= 0;
            return (Math.imul(s, 0x9e3779b1) >>> 0) / 4294967296;
        };
    }
    // 장면 시계(초) — 장면 계산이 고치고 화면 쪽이 읽는다
    let sceneT = 0;
    // 자동 시연이 장면을 움직이는가 — 사람이 무대에서 처음 손대면 꺼진다
    let autoOn = true;
    // 사람이 주는 바람(−1 왼쪽 ~ 1 오른쪽) — 방향키·무대 위 가로 끌기. 자동 시연 중에는 0
    let windUser = 0;
    function userWind() { return autoOn ? 0 : windUser; }
    // 파스텔 팔레트 — 눈은 흰색 계열(기능색), 하늘·땅은 낮은 채도의 해질녘 청보라
    const SNOW = [255, 255, 255];
    const SNOW_SHADE = [208, 222, 246];
    const SKY_TOP = [70, 82, 140];
    const SKY_BOT = [146, 158, 212];
    const NIGHT_TOP = [38, 44, 86];
    const NIGHT_BOT = [78, 88, 140];
    const GROUND = [196, 206, 232];
    const DUSK = [96, 104, 156];
    const DUSK_DEEP = [60, 66, 112];
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    const LAMP = [255, 232, 168];
    const BUTTER = [247, 226, 156];
    const ROSE = [232, 164, 178];
    const MINT = [166, 220, 200];
    const WATER = [190, 222, 248];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function skyFill(top, bot) {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bot, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function seg(x1, y1, x2, y2, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 글자 이름표 — 바탕 알약 위에 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    // 눈송이 한 알 — 번짐 반지름(blur)만큼 옅은 후광을 먼저 깔고 가운데를 또렷하게
    function flakeDot(x, y, r, blur, c, a) {
        if (blur > 0.3) {
            disc(x, y, r + blur, c, a * 0.3);
        }
        disc(x, y, r, c, a);
    }
    // ── 02 돌풍 장이 휘감는 눈 ────────────────────────────────────
    // 돌풍 세기 — 장이 눈에 더하는 속도 배율
    const GUST = 0.6;
    // 돌풍 세기 1 · 봉우리 1 일 때 장 값 1 당 눈에 더하는 빠르기(px/초)
    const GUST_SPEED = 200;
    const FLAKES = 230;
    const LOOP_S = 6;
    const REST_STEPS = 60;
    // 장의 사인 셋 — [가로 파수, 세로 파수, 시간 빠르기, 위상, 진폭]
    const WAVES = [
        [0.021, 0.015, 0.9, 0.4, 1],
        [-0.013, 0.027, -0.7, 2.1, 0.8],
        [0.033, -0.011, 1.3, 4.0, 0.5]
    ];
    let flakes = [];
    let rng = seeded(202);
    // 장의 속도 — 흐름 함수 ψ = Σ a·sin(kx·x + ky·y + ω·t + φ) 의 회전(∂ψ/∂y, −∂ψ/∂x)이라 한 점으로 모이거나 퍼지지 않고 소용돌이로 돈다
    function fieldAt(x, y, t) {
        let u = 0;
        let v = 0;
        for (const w of WAVES) {
            const c = Math.cos(x * w[0] + y * w[1] + t * w[2] + w[3]) * w[4];
            u += c * w[1];
            v -= c * w[0];
        }
        return [u * 34, v * 34];
    }
    // 돌풍 봉우리 — 시간에 따라 세졌다 가라앉는 몫(0.3 ~ 1)
    function gustAmp(t) { return 0.65 + 0.35 * Math.sin(t * 1.4); }
    function dropFlake(f, top) {
        f.x = rng() * (W + 40) - 20;
        f.y = top ? -6 : rng() * H;
        f.px = f.x;
        f.py = f.y;
    }
    function reset() {
        rng = seeded(202);
        flakes = [];
        for (let i = 0; i < FLAKES; i += 1) {
            const s = 1.1 + Math.pow(rng(), 1.7) * 4.1;
            const f = { x: 0, y: 0, px: 0, py: 0, z: (s - 1.1) / 4.1, s: s };
            dropFlake(f, false);
            flakes.push(f);
        }
        flakes.sort(function (a, b) { return a.s - b.s; });
    }
    function update(dt) {
        const amp = GUST * GUST_SPEED * gustAmp(sceneT);
        const user = userWind() * 70;
        for (const f of flakes) {
            f.px = f.x;
            f.py = f.y;
            // 반 걸음 적분 — 반 걸음 앞에서 장을 읽어 그 속도로 한 걸음 간다
            const fall = 30 + 52 * f.z;
            const depthK = 0.3 + 0.7 * f.z;
            const a = fieldAt(f.x, f.y, sceneT);
            const mx = f.x + (a[0] * amp * depthK + user) * dt * 0.5;
            const my = f.y + (fall + a[1] * amp * depthK) * dt * 0.5;
            const b = fieldAt(mx, my, sceneT);
            f.x += (b[0] * amp * depthK + user) * dt;
            f.y += (fall + b[1] * amp * depthK) * dt;
            if (f.y > H + 8 || f.x > W + 30 || f.x < -30) {
                dropFlake(f, true);
            }
            if (f.y < -40) {
                f.y = -6;
                f.px = f.x;
                f.py = f.y;
            }
        }
    }
    function draw() {
        skyFill(SKY_TOP, SKY_BOT);
        // 장을 눈에 보이게 — 격자 한 칸마다 그 자리의 속도 방향 짧은 선
        const amp = GUST * gustAmp(sceneT);
        for (let gy = 20; gy < H; gy += 40) {
            for (let gx = 20; gx < W; gx += 40) {
                const a = fieldAt(gx, gy, sceneT);
                const m = Math.hypot(a[0], a[1]);
                if (m < 0.01) {
                    continue;
                }
                const len = Math.min(16, m * amp * 18);
                seg(gx - a[0] / m * len * 0.5, gy - a[1] / m * len * 0.5, gx + a[0] / m * len * 0.5, gy + a[1] / m * len * 0.5, 2, SNOW_SHADE, 0.28);
            }
        }
        for (const f of flakes) {
            const sx = f.x - f.px;
            const sy = f.y - f.py;
            seg(f.px - sx * 2.2, f.py - sy * 2.2, f.x, f.y, f.s * 0.5, SNOW, 0.2 + 0.25 * f.z);
            flakeDot(f.x, f.y, f.s * 0.62, (1 - f.z) * 1.6, mix(SNOW, SKY_BOT, (1 - f.z) * 0.3), lerp(0.55, 1, f.z));
        }
    }
    function statusText() {
        let up = 0;
        for (const f of flakes) {
            if (f.y < f.py) {
                up += 1;
            }
        }
        return 'Gust strength {g} · {n} flakes rising'.replace('{g}', (GUST * gustAmp(sceneT)).toFixed(2)).replace('{n}', String(up));
    }
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 사람이 바람을 만지면 자동 시연의 바람은 손을 뗀다
    function takeOver() {
        wake();
        autoOn = false;
    }
    // 한 프레임에 넘기는 시간 상한(초) — 오래 숨었다 돌아온 첫 프레임도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    // 방향키 한 번에 바뀌는 바람 몫
    const WIND_STEP = 0.25;
    function showNow() {
        if (still || paused) {
            draw();
            pushStatus(statusText());
        }
    }
    function advance(dt) {
        sceneT += dt;
        if (sceneT >= LOOP_S) {
            sceneT -= LOOP_S;
            reset();
        }
        update(dt);
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        draw();
        pushStatus(statusText());
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 눈이 이미 내려 쌓인 정지 장면 한 장
    function showRest() {
        stopLoop();
        sceneT = 0;
        reset();
        for (let k = 0; k < REST_STEPS; k += 1) {
            update(1 / 30);
        }
        draw();
        pushStatus(statusText());
    }
    function play() {
        sceneT = 0;
        reset();
        draw();
        pushStatus(statusText());
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    // 방향키 — 무대에 포커스가 있을 때만. 왼쪽·오른쪽은 바람, Enter·Space 는 Pause. 무대 밖에서는 화살표가 페이지를 스크롤한다
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            e.preventDefault();
            takeOver();
            windUser = clamp(windUser + (e.key === 'ArrowRight' ? WIND_STEP : -WIND_STEP), -1, 1);
            showNow();
        }
        else if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            togglePause();
        }
    }, { signal: off.signal });
    // 포인터 — 무대 안에서 누른 채 가로로 끌면 그 위치가 바람(가운데 0, 가장자리 ±1)
    let dragging = -1;
    function windAt(e) {
        const r = pad.getBoundingClientRect();
        windUser = clamp(((e.clientX - r.left) / r.width - 0.5) * 2.4, -1, 1);
    }
    pad.addEventListener('pointerdown', function (e) {
        takeOver();
        pad.setPointerCapture(e.pointerId);
        dragging = e.pointerId;
        windAt(e);
        showNow();
    }, { signal: off.signal });
    pad.addEventListener('pointermove', function (e) {
        if (dragging !== e.pointerId) {
            return;
        }
        windAt(e);
        showNow();
    }, { signal: off.signal });
    function release(e) {
        if (dragging !== e.pointerId) {
            return;
        }
        dragging = -1;
        windUser = 0;
        showNow();
    }
    pad.addEventListener('pointerup', release, { signal: off.signal });
    pad.addEventListener('pointercancel', release, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 정지 장면, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw();
    }, { signal: off.signal });
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
