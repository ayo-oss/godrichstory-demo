<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체크 선 그리기 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<label class="cbd is-demo" id="cbd">
  <input type="checkbox" class="cbd__input" id="cbdInput">
  <span class="cbd__box" id="cbdBox" aria-hidden="true">
    <svg class="cbd__svg" viewBox="0 0 20 20" width="14" height="14">
      <path id="cbdCheck" class="cbd__path" d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
  <span class="cbd__text">약관에 동의합니다</span>
</label>
<script>
(function () {
  var DRAW_MS = 460; // 계산 겹 상수: 체크 선이 0에서 끝까지 그려지는 데 걸리는 실제 시간(ms)
  var CYCLE_MS = 640; // 자동 루프가 체크·해제를 오가는 간격
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('cbd');
  var input = document.getElementById('cbdInput');
  var box = document.getElementById('cbdBox');
  var path = document.getElementById('cbdCheck');

  // 계산 겹: SVG path 의 실제 길이를 getTotalLength() 로 측정해 stroke-dasharray 를 만든다 — 짐작 px 를 쓰지 않는다
  var LEN = path.getTotalLength();
  path.style.strokeDasharray = String(LEN);

  var isDemo = true;
  var drawing = false, drawStart = 0, drawFrom = LEN, drawTo = LEN;
  path.style.setProperty('stroke-dashoffset', String(LEN));

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function currentOffset(ts) {
    if (!drawing) return drawTo;
    var t = Math.min(1, (ts - drawStart) / DRAW_MS);
    return drawFrom + (drawTo - drawFrom) * easeOutCubic(t);
  }

  function setChecked(next, ts) {
    input.checked = next;
    box.classList.toggle('cbd__box--on', next);
    drawFrom = currentOffset(ts);
    drawTo = next ? 0 : LEN;
    drawStart = ts;
    drawing = true;
  }

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  input.addEventListener('change', function () {
    human();
    setChecked(input.checked, performance.now());
  });

  var cycleStart = 0;
  var lastState = false;

  function loop(ts) {
    if (!cycleStart) cycleStart = ts;

    if (isDemo) {
      var step = Math.floor((ts - cycleStart) / CYCLE_MS) % 2 === 1;
      if (step !== lastState) { lastState = step; setChecked(step, ts); }
    }

    if (drawing) {
      var off = currentOffset(ts);
      path.style.setProperty('stroke-dashoffset', off.toFixed(2));
      if (Math.abs(off - drawTo) < 0.05) { path.style.setProperty('stroke-dashoffset', String(drawTo)); drawing = false; }
    }

    requestAnimationFrame(loop);
  }

  if (reduce) {
    // 계산 자체는 유지하되 중간 프레임 없이 목표 값으로 바로 놓는다
    DRAW_MS = 1;
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
