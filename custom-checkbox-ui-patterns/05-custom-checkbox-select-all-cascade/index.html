<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전체선택 계단 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cba is-demo" id="cba">
  <label class="cba__row cba__row--parent">
    <input type="checkbox" class="cba__input" id="cbaParent">
    <span class="cba__box" id="cbaParentBox" aria-hidden="true">
      <svg viewBox="0 0 20 20" width="14" height="14">
        <path class="cba__check" d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <line class="cba__dash" x1="5" y1="10" x2="15" y2="10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="cba__text">파일 전체 선택</span>
  </label>
  <div class="cba__children" id="cbaChildren">
    <label class="cba__row"><input type="checkbox" class="cba__input"><span class="cba__box" aria-hidden="true"><svg viewBox="0 0 20 20" width="12" height="12"><path d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="cba__text">보고서.pdf</span></label>
    <label class="cba__row"><input type="checkbox" class="cba__input"><span class="cba__box" aria-hidden="true"><svg viewBox="0 0 20 20" width="12" height="12"><path d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="cba__text">사진.jpg</span></label>
    <label class="cba__row"><input type="checkbox" class="cba__input"><span class="cba__box" aria-hidden="true"><svg viewBox="0 0 20 20" width="12" height="12"><path d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="cba__text">회의록.docx</span></label>
    <label class="cba__row"><input type="checkbox" class="cba__input"><span class="cba__box" aria-hidden="true"><svg viewBox="0 0 20 20" width="12" height="12"><path d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="cba__text">시트.xlsx</span></label>
  </div>
</div>
<script>
(function () {
  var STAGGER_MS = 90; // 계산 겹 상수: 하위 박스가 한 칸씩 늦게 바뀌는 간격
  var CYCLE_MS = 700; // 자동 루프가 전체선택을 켜고 끄는 간격
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('cba');
  var parent = document.getElementById('cbaParent');
  var parentBox = document.getElementById('cbaParentBox');
  var childrenWrap = document.getElementById('cbaChildren');
  var childInputs = Array.prototype.slice.call(childrenWrap.querySelectorAll('.cba__input'));
  var childBoxes = Array.prototype.slice.call(childrenWrap.querySelectorAll('.cba__box'));

  var isDemo = true;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  // 계산 겹: 각 자식 박스의 transition-delay 를 인덱스 × STAGGER_MS 로 만든다 — 값 자체는
  // 동시에 바뀌지만 화면에 드러나는 시점이 계단처럼 순서를 갖는다
  childBoxes.forEach(function (b, i) {
    b.style.setProperty('transition-delay', (i * STAGGER_MS) + 'ms');
  });

  function paintParent() {
    var count = childInputs.filter(function (c) { return c.checked; }).length;
    var all = count === childInputs.length, none = count === 0;
    parent.checked = all;
    parent.indeterminate = !all && !none;
    parentBox.classList.toggle('cba__box--on', all);
    parentBox.classList.toggle('cba__box--mixed', !all && !none);
  }

  function paintChildren() {
    childInputs.forEach(function (c, i) { childBoxes[i].classList.toggle('cba__box--on', c.checked); });
  }

  childInputs.forEach(function (c) {
    c.addEventListener('change', function () { human(); paintChildren(); paintParent(); });
  });

  parent.addEventListener('change', function () {
    human();
    var next = parent.checked;
    childInputs.forEach(function (c) { c.checked = next; });
    paintChildren();
    paintParent();
  });

  var cycleStart = 0;
  var lastState = false;

  function loop(ts) {
    if (!cycleStart) cycleStart = ts;

    if (isDemo) {
      var step = Math.floor((ts - cycleStart) / CYCLE_MS) % 2 === 1;
      if (step !== lastState) {
        lastState = step;
        childInputs.forEach(function (c) { c.checked = step; });
        paintChildren();
        paintParent();
      }
    }

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
