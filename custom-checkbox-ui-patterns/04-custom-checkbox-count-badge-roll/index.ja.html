<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選択件数ロール切替 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cbc is-demo" id="cbc">
  <div class="cbc__list">
    <label class="cbc__row">
      <input type="checkbox" class="cbc__input" id="cbcItem0">
      <span class="cbc__box" id="cbcBox0" aria-hidden="true">
        <svg viewBox="0 0 20 20" width="12" height="12"><path d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="cbc__text">基本配送</span>
    </label>
    <label class="cbc__row">
      <input type="checkbox" class="cbc__input" id="cbcItem1">
      <span class="cbc__box" id="cbcBox1" aria-hidden="true">
        <svg viewBox="0 0 20 20" width="12" height="12"><path d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="cbc__text">ギフト包装</span>
    </label>
    <label class="cbc__row">
      <input type="checkbox" class="cbc__input" id="cbcItem2">
      <span class="cbc__box" id="cbcBox2" aria-hidden="true">
        <svg viewBox="0 0 20 20" width="12" height="12"><path d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="cbc__text">設置サービス</span>
    </label>
  </div>
  <span class="cbc__badge">
    <span class="cbc__window">
      <span class="cbc__strip" id="cbcStrip">
        <span>0</span><span>1</span><span>2</span><span>3</span>
      </span>
    </span>
  </span>
</div>
<script>
(function () {
  var ROW_H = 18; // px, 숫자 롤 한 칸 높이
  var ROLL_MS = 260; // 계산 겹 상수: 숫자가 다음 칸으로 굴러가는 데 걸리는 실제 시간(ms)
  var CYCLE_MS = 560; // 자동 루프가 항목을 하나씩 체크하는 간격
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('cbc');
  var strip = document.getElementById('cbcStrip');
  var inputs = [document.getElementById('cbcItem0'), document.getElementById('cbcItem1'), document.getElementById('cbcItem2')];
  var boxes = [document.getElementById('cbcBox0'), document.getElementById('cbcBox1'), document.getElementById('cbcBox2')];

  var isDemo = true;
  var pos = 0, from = 0, to = 0, rollStart = 0, rolling = false;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function currentPos(ts) {
    if (!rolling) return to;
    var t = Math.min(1, (ts - rollStart) / ROLL_MS);
    return from + (to - from) * easeOutCubic(t);
  }

  function paint(ts) {
    inputs.forEach(function (inp, i) { boxes[i].classList.toggle('cbc__box--on', inp.checked); });
    var count = inputs.filter(function (i) { return i.checked; }).length;
    var target = -count * ROW_H;
    if (target !== to) {
      from = currentPos(ts);
      to = target;
      rollStart = ts;
      rolling = true;
    }
  }

  inputs.forEach(function (inp) {
    inp.addEventListener('change', function () { human(); paint(performance.now()); });
  });

  var cycleStart = 0;
  var lastN = -1;
  var SEQ = [[false, false, false], [true, false, false], [true, true, false], [true, true, true], [true, true, false], [true, false, false], [false, false, false]];

  function loop(ts) {
    if (!cycleStart) cycleStart = ts;

    if (isDemo) {
      var n = Math.floor((ts - cycleStart) / CYCLE_MS) % SEQ.length;
      if (n !== lastN) {
        lastN = n;
        var state = SEQ[n];
        inputs.forEach(function (inp, i) { inp.checked = state[i]; });
        paint(ts);
      }
    }

    pos = currentPos(ts);
    strip.style.transform = 'translateY(' + pos.toFixed(2) + 'px)';

    requestAnimationFrame(loop);
  }

  if (reduce) { ROLL_MS = 1; }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
