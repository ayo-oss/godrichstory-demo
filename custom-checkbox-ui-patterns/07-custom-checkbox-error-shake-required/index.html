<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>필수 체크 흔들림 경고 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cbe is-demo" id="cbe">
  <label class="cbe__row" id="cbeRow">
    <input type="checkbox" class="cbe__input" id="cbeInput" required>
    <span class="cbe__box" id="cbeBox" aria-hidden="true">
      <svg viewBox="0 0 20 20" width="14" height="14"><path d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="cbe__text">필수 약관에 동의합니다</span>
  </label>
  <p class="cbe__hint" id="cbeHint">체크해야 다음으로 진행됩니다</p>
  <button type="button" class="cbe__submit" id="cbeSubmit">제출</button>
</div>
<script>
(function () {
  var SHAKE_MS = 420; // 계산 겹 상수: 흔들림 감쇠가 끝나는 데 걸리는 실제 시간(ms)
  var SHAKE_FREQ = 2 * Math.PI * 5 / SHAKE_MS; // 흔들림 진동 주파수
  var SHAKE_ZETA = 4.2; // 감쇠 계수
  var SHAKE_AMP = 8; // px, 최대 흔들림 폭
  var CYCLE_MS = 480;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('cbe');
  var input = document.getElementById('cbeInput');
  var box = document.getElementById('cbeBox');
  var row = document.getElementById('cbeRow');
  var hint = document.getElementById('cbeHint');
  var submit = document.getElementById('cbeSubmit');

  var isDemo = true;
  var shaking = false, shakeStart = 0;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function shakeOffset(t) {
    // 계산 겹: 감쇠 사인 진동 — 시간이 지날수록 진폭이 줄어드는 흔들림 값을 직접 계산
    var amp = Math.exp(-SHAKE_ZETA * (t / SHAKE_MS));
    return SHAKE_AMP * amp * Math.sin(SHAKE_FREQ * t);
  }

  function triggerError() {
    row.classList.add('cbe__row--error');
    hint.classList.add('cbe__hint--error');
    shakeStart = performance.now();
    shaking = true;
  }

  function clearError() {
    row.classList.remove('cbe__row--error');
    hint.classList.remove('cbe__hint--error');
  }

  input.addEventListener('change', function () {
    human();
    if (input.checked) clearError();
  });

  submit.addEventListener('click', function () {
    human();
    if (!input.checked) { triggerError(); } else { clearError(); }
  });

  var cycleStart = 0;
  var lastStep = -1;

  function loop(ts) {
    if (!cycleStart) cycleStart = ts;

    if (isDemo) {
      var step = Math.floor((ts - cycleStart) / CYCLE_MS) % 3;
      if (step !== lastStep) {
        lastStep = step;
        if (step === 0) { input.checked = false; clearError(); }
        else if (step === 1) { triggerError(); }
        else { input.checked = true; clearError(); }
      }
    }

    if (shaking) {
      var t = ts - shakeStart;
      if (t >= SHAKE_MS) {
        shaking = false;
        row.style.transform = '';
      } else {
        row.style.transform = 'translateX(' + shakeOffset(t).toFixed(2) + 'px)';
      }
    }

    requestAnimationFrame(loop);
  }

  if (reduce) { SHAKE_MS = 1; }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
