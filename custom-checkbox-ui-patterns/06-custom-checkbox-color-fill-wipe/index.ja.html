<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>塗りワイプ切替 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<label class="cbw is-demo" id="cbw">
  <input type="checkbox" class="cbw__input" id="cbwInput">
  <span class="cbw__card" id="cbwCard">
    <span class="cbw__fill" id="cbwFill" aria-hidden="true"></span>
    <span class="cbw__box" aria-hidden="true">
      <svg viewBox="0 0 20 20" width="14" height="14"><path d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="cbw__text">通知カードを選択</span>
  </span>
</label>
<script>
(function () {
  var WIPE_MS = 420; // 계산 겹 상수: 채움이 한쪽 모서리에서 반대쪽까지 번지는 데 걸리는 실제 시간(ms)
  var CYCLE_MS = 900; // 자동 루프가 체크·해제를 오가는 간격
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('cbw');
  var input = document.getElementById('cbwInput');
  var card = document.getElementById('cbwCard');
  var fill = document.getElementById('cbwFill');

  var isDemo = true;
  var diag = 0;
  var wiping = false, wipeStart = 0, wipeDir = 1;

  function measure() {
    // 계산 겹: 카드 실측 대각선 길이 — 채움 원이 반대쪽 모서리에 정확히 닿는 반지름 값
    var r = card.getBoundingClientRect();
    diag = Math.sqrt(r.width * r.width + r.height * r.height);
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function setChecked(next, ts) {
    input.checked = next;
    wipeDir = next ? 1 : -1;
    wipeStart = ts;
    wiping = true;
  }

  input.addEventListener('change', function () {
    human();
    setChecked(input.checked, performance.now());
  });

  var cycleStart = 0;
  var lastState = false;

  function loop(ts) {
    if (!cycleStart) cycleStart = ts;
    if (!diag) measure();

    if (isDemo) {
      var step = Math.floor((ts - cycleStart) / CYCLE_MS) % 2 === 1;
      if (step !== lastState) { lastState = step; setChecked(step, ts); }
    }

    if (wiping) {
      var t = Math.min(1, (ts - wipeStart) / WIPE_MS);
      var p = easeOutCubic(t);
      var r = wipeDir === 1 ? p * diag : (1 - p) * diag;
      fill.style.clipPath = 'circle(' + r.toFixed(1) + 'px at 0% 100%)';
      if (t >= 1) wiping = false;
    }

    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', measure);
  measure();
  if (reduce) { WIPE_MS = 1; }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
