<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スプリング弾み切替 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<label class="cbs is-demo" id="cbs">
  <input type="checkbox" class="cbs__input" id="cbsInput">
  <span class="cbs__box" id="cbsBox" aria-hidden="true">
    <svg class="cbs__svg" viewBox="0 0 20 20" width="14" height="14">
      <path d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
  <span class="cbs__text">ミッション完了</span>
</label>
<script>
(function () {
  var POP_MS = 480; // 계산 겹 상수: 스프링 튐이 잦아드는 데 걸리는 실제 시간(ms)
  var SPRING_ZETA = 3.4; // 계산 겹: 감쇠 상수 — 낮을수록 더 오래 튕긴다
  var SCALE_OVERSHOOT = .34; // 계산 겹: 목표(scale 1)를 넘어서는 최대 배율
  var POP_FREQ = 2 * Math.PI * 2.1 / POP_MS; // 계산 겹: 튐 각속도
  var CYCLE_MS = 900; // 자동 루프가 체크·해제를 오가는 간격
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('cbs');
  var input = document.getElementById('cbsInput');
  var box = document.getElementById('cbsBox');

  var isDemo = true;
  var popStart = -99999;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function popScale(t) {
    // 계산 겹: 감쇠 코사인 진동 — t=0 에서 SCALE_OVERSHOOT 만큼 튀어 오른 뒤 1로 잦아든다
    if (t < 0 || t > POP_MS) return 1;
    var amp = Math.exp(-SPRING_ZETA * (t / POP_MS));
    return 1 + amp * SCALE_OVERSHOOT * Math.cos(POP_FREQ * t);
  }

  function setChecked(next, ts) {
    input.checked = next;
    box.classList.toggle('cbs__box--on', next);
    popStart = ts;
  }

  input.addEventListener('change', function () {
    human();
    setChecked(input.checked, performance.now());
  });

  var cycleStart = 0;
  var lastState = false;

  function loop(ts) {
    if (!cycleStart) cycleStart = ts;

    if (isDemo) {
      var step = Math.floor((ts - cycleStart) / CYCLE_MS) % 2 === 1;
      if (step !== lastState) { lastState = step; setChecked(step, ts); }
    }

    var s = popScale(ts - popStart);
    box.style.transform = 'scale(' + s.toFixed(3) + ')';

    requestAnimationFrame(loop);
  }

  if (reduce) { POP_MS = 1; }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
