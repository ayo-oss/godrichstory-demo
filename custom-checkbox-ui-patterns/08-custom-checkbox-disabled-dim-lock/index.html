<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잠김 흐림 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cbl is-demo" id="cbl">
  <label class="cbl__row" id="cblRow">
    <input type="checkbox" class="cbl__input" id="cblInput" disabled checked>
    <span class="cbl__box" aria-hidden="true">
      <svg viewBox="0 0 20 20" width="14" height="14"><path d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="cbl__text">관리자 전용 설정</span>
  </label>
  <button type="button" class="cbl__toggle" id="cblToggle" aria-pressed="true">
    <svg class="cbl__lock" viewBox="0 0 24 24" width="16" height="16">
      <rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/>
      <path id="cblShackle" class="cbl__shackle" d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <span id="cblToggleText">잠금 해제</span>
  </button>
</div>
<script>
(function () {
  var LOCK_MS = 360; // 계산 겹 상수: 걸쇠가 열리는 회전이 끝나는 데 걸리는 실제 시간(ms)
  var UNLOCK_ANGLE = -42; // deg, 걸쇠가 열릴 때 돌아가는 최대 각도
  var SHACKLE_PIVOT_X = 8, SHACKLE_PIVOT_Y = 11; // svg 좌표계 안의 회전 축(걸쇠 아래쪽 끝)
  var CYCLE_MS = 1300;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('cbl');
  var row = document.getElementById('cblRow');
  var input = document.getElementById('cblInput');
  var toggle = document.getElementById('cblToggle');
  var toggleText = document.getElementById('cblToggleText');
  var shackle = document.getElementById('cblShackle');

  var isDemo = true;
  var locked = true;
  var animating = false, animStart = 0, angleFrom = 0, angleTo = 0;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function currentAngle(ts) {
    if (!animating) return angleTo;
    var t = Math.min(1, (ts - animStart) / LOCK_MS);
    return angleFrom + (angleTo - angleFrom) * easeOutCubic(t);
  }

  function apply(nextLocked, ts) {
    locked = nextLocked;
    input.disabled = locked;
    row.classList.toggle('cbl__row--locked', locked);
    toggle.setAttribute('aria-pressed', String(locked));
    toggleText.textContent = locked ? '잠금 해제' : '잠금';
    angleFrom = currentAngle(ts);
    angleTo = locked ? 0 : UNLOCK_ANGLE;
    animStart = ts;
    animating = true;
  }

  toggle.addEventListener('click', function () {
    human();
    apply(!locked, performance.now());
  });

  var cycleStart = 0;
  var lastState = true;

  function loop(ts) {
    if (!cycleStart) { cycleStart = ts; apply(true, ts); }

    if (isDemo) {
      var step = Math.floor((ts - cycleStart) / CYCLE_MS) % 2 === 1;
      if (step !== lastState) { lastState = step; apply(!step, ts); }
    }

    var angle = currentAngle(ts);
    // 계산 겹: 걸쇠 회전을 고정 축(SHACKLE_PIVOT_X, Y) 기준으로 계산해 자물쇠 몸통은 그대로,
    // 걸쇠만 열리는 자연스러운 회전을 만든다
    shackle.style.transform = 'rotate(' + angle.toFixed(2) + 'deg)';
    shackle.style.transformOrigin = SHACKLE_PIVOT_X + 'px ' + SHACKLE_PIVOT_Y + 'px';
    if (animating && Math.abs(angle - angleTo) < 0.01) animating = false;

    requestAnimationFrame(loop);
  }

  if (reduce) { LOCK_MS = 1; }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
