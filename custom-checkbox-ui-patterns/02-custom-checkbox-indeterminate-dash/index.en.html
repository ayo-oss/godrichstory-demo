<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indeterminate-dash toggle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cbi is-demo" id="cbi">
  <label class="cbi__row cbi__row--parent">
    <input type="checkbox" class="cbi__input" id="cbiParent">
    <span class="cbi__box" id="cbiParentBox" aria-hidden="true">
      <svg class="cbi__svg" viewBox="0 0 20 20" width="14" height="14">
        <path class="cbi__check" d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <line class="cbi__dash" x1="5" y1="10" x2="15" y2="10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="cbi__text">Select all notifications</span>
  </label>
  <div class="cbi__children">
    <label class="cbi__row">
      <input type="checkbox" class="cbi__input" id="cbiChild0">
      <span class="cbi__box" id="cbiChildBox0" aria-hidden="true">
        <svg class="cbi__svg" viewBox="0 0 20 20" width="12" height="12">
          <path class="cbi__check" d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="cbi__text">Email notifications</span>
    </label>
    <label class="cbi__row">
      <input type="checkbox" class="cbi__input" id="cbiChild1">
      <span class="cbi__box" id="cbiChildBox1" aria-hidden="true">
        <svg class="cbi__svg" viewBox="0 0 20 20" width="12" height="12">
          <path class="cbi__check" d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="cbi__text">SMS notifications</span>
    </label>
    <label class="cbi__row">
      <input type="checkbox" class="cbi__input" id="cbiChild2">
      <span class="cbi__box" id="cbiChildBox2" aria-hidden="true">
        <svg class="cbi__svg" viewBox="0 0 20 20" width="12" height="12">
          <path class="cbi__check" d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="cbi__text">Push notifications</span>
    </label>
  </div>
</div>
<script>
(function () {
  var MIX_ALPHA = .22; // 계산 겹 상수: 자식이 0개 선택됐을 때도 남기는 최소 배경 알파
  var CYCLE_MS = 520; // 자동 루프가 자식 하나씩 상태를 바꾸는 간격
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('cbi');
  var parent = document.getElementById('cbiParent');
  var parentBox = document.getElementById('cbiParentBox');
  var children = [
    document.getElementById('cbiChild0'),
    document.getElementById('cbiChild1'),
    document.getElementById('cbiChild2')
  ];
  var childBoxes = [
    document.getElementById('cbiChildBox0'),
    document.getElementById('cbiChildBox1'),
    document.getElementById('cbiChildBox2')
  ];

  var isDemo = true;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function paintChildren() {
    children.forEach(function (c, i) { childBoxes[i].classList.toggle('cbi__box--on', c.checked); });
  }

  function paintParent() {
    paintChildren();
    var checkedCount = children.filter(function (c) { return c.checked; }).length;
    var ratio = checkedCount / children.length; // 계산 겹: 선택 비율 값
    var all = ratio === 1, none = ratio === 0;
    parent.checked = all;
    parent.indeterminate = !all && !none;
    parentBox.classList.toggle('cbi__box--on', all);
    parentBox.classList.toggle('cbi__box--mixed', !all && !none);
    // 계산 겹: 선택 비율을 배경 알파로 직접 사영한다(MIX_ALPHA 를 바닥으로 두고 남은 폭을 ratio 만큼 채움)
    var alpha = none ? 0 : (MIX_ALPHA + (1 - MIX_ALPHA) * ratio);
    parentBox.style.setProperty('--cbi-alpha', alpha.toFixed(3));
  }

  function setChild(idx, val) {
    children[idx].checked = val;
    paintParent();
  }

  children.forEach(function (c) {
    c.addEventListener('change', function () { human(); paintParent(); });
  });

  parent.addEventListener('change', function () {
    human();
    var next = parent.checked;
    children.forEach(function (c) { c.checked = next; });
    paintParent();
  });

  // 자동 루프: 자식을 하나씩 켜서 없음 → 부분 → 전체를 보여주고, 다시 하나씩 끈다
  var SEQ = [
    [false, false, false], [true, false, false], [true, true, false], [true, true, true],
    [true, true, false], [true, false, false], [false, false, false]
  ];
  var si = 0;
  var autoTimer = null;

  function autoTick() {
    var state = SEQ[si];
    children.forEach(function (c, i) { c.checked = state[i]; });
    paintParent();
    si = (si + 1) % SEQ.length;
  }

  if (!reduce) { autoTimer = setInterval(autoTick, CYCLE_MS); autoTick(); }
  else { autoTick(); }
})();
</script>
</main>
</body>
</html>
