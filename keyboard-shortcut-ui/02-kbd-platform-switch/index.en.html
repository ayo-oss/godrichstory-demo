<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플랫폼 자동 전환 키캡 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="command" viewBox="0 0 256 256" fill="currentColor"><path d="M208,76h0a28,28,0,0,1-28,28H152V76a28,28,0,0,1,28-28h0A28,28,0,0,1,208,76ZM76,48h0A28,28,0,0,0,48,76h0a28,28,0,0,0,28,28h28V76A28,28,0,0,0,76,48ZM180,152H152v28a28,28,0,0,0,28,28h0a28,28,0,0,0,28-28h0A28,28,0,0,0,180,152ZM48,180h0a28,28,0,0,0,28,28h0a28,28,0,0,0,28-28V152H76A28,28,0,0,0,48,180Z" opacity="0.2"/><path d="M180,144H160V112h20a36,36,0,1,0-36-36V96H112V76a36,36,0,1,0-36,36H96v32H76a36,36,0,1,0,36,36V160h32v20a36,36,0,1,0,36-36ZM160,76a20,20,0,1,1,20,20H160ZM56,76a20,20,0,0,1,40,0V96H76A20,20,0,0,1,56,76ZM96,180a20,20,0,1,1-20-20H96Zm16-68h32v32H112Zm68,88a20,20,0,0,1-20-20V160h20a20,20,0,0,1,0,40Z"/></symbol>
  </defs>
</svg>
<main class="stage">
<div class="pf is-demo" id="pf" data-platform="win">
  <div class="pf__head">
    <p class="pf__title"><svg class="pf__ico" aria-hidden="true"><use href="#command"/></svg><span>The label follows your OS</span></p>
    <div class="pf__switch" role="group" aria-label="Operating system to show">
      <button type="button" class="pf__opt" data-os="mac" aria-pressed="false">macOS</button>
      <button type="button" class="pf__opt" data-os="win" aria-pressed="true">Windows</button>
    </div>
  </div>
  <ul class="pf__list">
    <li class="pf__row">
      <span class="pf__act">Save file</span>
      <span class="pf__keys"><kbd class="pf__mod"><span class="pf__mac">&#8984;</span><span class="pf__win">Ctrl</span></kbd><kbd class="pf__key">S</kbd></span>
    </li>
    <li class="pf__row">
      <span class="pf__act">Undo</span>
      <span class="pf__keys"><kbd class="pf__mod"><span class="pf__mac">&#8984;</span><span class="pf__win">Ctrl</span></kbd><kbd class="pf__key">Z</kbd></span>
    </li>
    <li class="pf__row">
      <span class="pf__act">New window</span>
      <span class="pf__keys"><kbd class="pf__mod"><span class="pf__mac">&#8984;</span><span class="pf__win">Ctrl</span></kbd><kbd class="pf__key">N</kbd></span>
    </li>
  </ul>
</div>
</main>
<script>
var pf = document.getElementById('pf');
var opts = Array.prototype.slice.call(document.querySelectorAll('.pf__opt'));
function applyPlatform(os) {
  pf.setAttribute('data-platform', os);
  for (var i = 0; i < opts.length; i++) {
    opts[i].setAttribute('aria-pressed', opts[i].getAttribute('data-os') === os ? 'true' : 'false');
  }
}
// userAgentData.platform 이 있으면 그걸 먼저 보고, 없는 브라우저에서는 예전 navigator.platform 으로 내려간다
function detectPlatform() {
  var data = navigator.userAgentData;
  var name = (data && data.platform) || navigator.platform || '';
  return /mac|iphone|ipad|ipod/i.test(name) ? 'mac' : 'win';
}
opts.forEach(function (btn) {
  btn.addEventListener('click', function () {
    pf.classList.remove('is-demo');
    applyPlatform(btn.getAttribute('data-os'));
  });
});
applyPlatform(detectPlatform());
</script>
</body>
</html>
