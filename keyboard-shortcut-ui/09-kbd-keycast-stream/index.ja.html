<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>눌린 키 흘림 표시 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="kt is-demo" id="kt">
  <p class="kt__cap">たった今押したキー</p>
  <div class="kt__panel">
    <div class="kt__strip" id="strip" aria-live="polite" aria-label="直近のキー">
      <kbd class="kt__chip">Ctrl</kbd>
      <kbd class="kt__chip">S</kbd>
      <kbd class="kt__chip">J</kbd>
      <kbd class="kt__chip">G</kbd>
      <kbd class="kt__chip">?</kbd>
      <kbd class="kt__chip kt__dup" aria-hidden="true">Ctrl</kbd>
      <kbd class="kt__chip kt__dup" aria-hidden="true">S</kbd>
      <kbd class="kt__chip kt__dup" aria-hidden="true">J</kbd>
      <kbd class="kt__chip kt__dup" aria-hidden="true">G</kbd>
      <kbd class="kt__chip kt__dup" aria-hidden="true">?</kbd>
    </div>
  </div>
  <p class="kt__note">古いものから薄くなります</p>
</div>
</main>
<script>
var kt = document.getElementById('kt');
var strip = document.getElementById('strip');
var MAX = 5;
function labelFor(e) {
  if (e.key === ' ') { return 'Space'; }
  return e.key.length === 1 ? e.key.toUpperCase() : e.key;
}
function pushKey(text) {
  var chip = document.createElement('kbd');
  chip.className = 'kt__chip is-new';
  chip.textContent = text;
  strip.appendChild(chip);
  // 다섯 개를 넘으면 가장 오래된 것부터 지운다 — 화면 구석을 침범하지 않게
  while (strip.children.length > MAX) {
    strip.removeChild(strip.firstChild);
  }
}
function dropPreviewChips() {
  var dup = Array.prototype.slice.call(strip.querySelectorAll('.kt__dup'));
  dup.forEach(function (node) { strip.removeChild(node); });
}
window.addEventListener('keydown', function (e) {
  if (e.isComposing) { return; }
  if (kt.classList.contains('is-demo')) {
    kt.classList.remove('is-demo');
    dropPreviewChips();
  }
  pushKey(labelFor(e));
});
</script>
</body>
</html>
