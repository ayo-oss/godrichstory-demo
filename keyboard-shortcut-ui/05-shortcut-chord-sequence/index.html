<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두 키 연속 입력 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cs is-demo" id="cs">
  <p class="cs__cap">G 를 누르고 이어서 I</p>
  <div class="cs__keys">
    <kbd class="cs__key cs__key--first">G</kbd>
    <span class="cs__then" aria-hidden="true">&#8250;</span>
    <kbd class="cs__key cs__key--second">I</kbd>
  </div>
  <div class="cs__meter"><span class="cs__fill"></span></div>
  <p class="cs__dest">
    <span class="cs__destLabel">이동한 곳</span>
    <b class="cs__destBox"><span class="cs__destIdle">대기 중</span><span class="cs__destDone">받은 편지함</span></b>
  </p>
</div>
</main>
<script>
var cs = document.getElementById('cs');
var pending = false;
var timer = 0;
var WINDOW_MS = 1200;
function startChord() {
  pending = true;
  cs.classList.add('is-pending');
  cs.classList.remove('is-done');
  clearTimeout(timer);
  // 시간 안에 두 번째 키가 안 오면 대기를 스스로 푼다 — 쌓인 첫 키가 영영 남지 않게
  timer = setTimeout(cancelChord, WINDOW_MS);
}
function finishChord() {
  clearTimeout(timer);
  pending = false;
  cs.classList.remove('is-pending');
  cs.classList.add('is-done');
}
function cancelChord() {
  pending = false;
  cs.classList.remove('is-pending');
}
window.addEventListener('keydown', function (e) {
  if (e.isComposing || e.ctrlKey || e.metaKey || e.altKey) { return; }
  var key = String(e.key).toLowerCase();
  if (!pending && key === 'g') { cs.classList.remove('is-demo'); startChord(); return; }
  if (pending && key === 'i') { finishChord(); }
});
</script>
</body>
</html>
