<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물음표 도움말 시트 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="question" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a96,96,0,1,1-96-96A96,96,0,0,1,224,128Z" opacity="0.2"/><path d="M140,180a12,12,0,1,1-12-12A12,12,0,0,1,140,180ZM128,72c-22.06,0-40,16.15-40,36v4a8,8,0,0,0,16,0v-4c0-11,10.77-20,24-20s24,9,24,20-10.77,20-24,20a8,8,0,0,0-8,8v8a8,8,0,0,0,16,0v-.72c18.24-3.35,32-17.9,32-35.28C168,88.15,150.06,72,128,72Zm104,56A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/></symbol>
  </defs>
</svg>
<main class="stage">
<div class="hs is-demo" id="hs">
  <div class="hs__app">
    <div class="hs__bar">
      <span class="hs__appName">Document editor</span>
      <button type="button" class="hs__ask" id="ask" aria-expanded="false" aria-controls="sheet" aria-keyshortcuts="Shift+?">
        <svg class="hs__ico" aria-hidden="true"><use href="#question"/></svg>
      </button>
    </div>
    <div class="hs__paper" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="hs__sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Shortcuts on this screen">
      <input class="hs__search" id="search" type="search" placeholder="Search shortcuts" aria-label="Search shortcuts">
      <div class="hs__cols">
        <section class="hs__group">
          <p class="hs__groupName">Editing</p>
          <ul class="hs__list">
            <li class="hs__item"><span class="hs__what">Bold</span><span class="hs__keys"><kbd class="hs__key">Ctrl</kbd><kbd class="hs__key">B</kbd></span></li>
            <li class="hs__item"><span class="hs__what">Undo</span><span class="hs__keys"><kbd class="hs__key">Ctrl</kbd><kbd class="hs__key">Z</kbd></span></li>
          </ul>
        </section>
        <section class="hs__group">
          <p class="hs__groupName">Navigation</p>
          <ul class="hs__list">
            <li class="hs__item"><span class="hs__what">Next item</span><span class="hs__keys"><kbd class="hs__key">J</kbd></span></li>
            <li class="hs__item"><span class="hs__what">Back to top</span><span class="hs__keys"><kbd class="hs__key">G</kbd><kbd class="hs__key">G</kbd></span></li>
          </ul>
        </section>
      </div>
    </div>
  </div>
</div>
</main>
<script>
var hs = document.getElementById('hs');
var ask = document.getElementById('ask');
var search = document.getElementById('search');
var items = Array.prototype.slice.call(document.querySelectorAll('.hs__item'));
function applySheet(open) {
  hs.classList.remove('is-demo');
  hs.classList.toggle('is-open', open);
  ask.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) { search.focus({ preventScroll: true }); }
}
ask.addEventListener('click', function () {
  applySheet(ask.getAttribute('aria-expanded') !== 'true');
});
window.addEventListener('keydown', function (e) {
  if (e.isComposing) { return; }
  if (e.key === '?') { e.preventDefault(); applySheet(true); return; }
  if (e.key === 'Escape') { applySheet(false); }
});
search.addEventListener('input', function () {
  var want = search.value.trim().toLowerCase();
  items.forEach(function (item) {
    var text = item.textContent.toLowerCase();
    item.classList.toggle('is-hidden', want !== '' && text.indexOf(want) < 0);
  });
});
</script>
</body>
</html>
