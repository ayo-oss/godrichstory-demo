<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>衝突 감지 표 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cf is-demo" id="cf">
  <p class="cf__cap">ショートカット一覧</p>
  <div class="cf__table" role="table" aria-label="ショートカット一覧">
    <div class="cf__row" role="row">
      <span class="cf__act" role="cell">コマンド実行</span>
      <span class="cf__bind" role="cell"><kbd class="cf__key">Ctrl</kbd><kbd class="cf__key"><span class="cf__letterText">K</span></kbd></span>
      <span class="cf__state" role="cell">
        <span class="cf__warn">衝突</span>
        <span class="cf__ok">問題なし</span>
      </span>
    </div>
    <div class="cf__row" role="row">
      <span class="cf__act" role="cell">行を複製</span>
      <span class="cf__bind" role="cell"><kbd class="cf__key">Ctrl</kbd><kbd class="cf__key"><span class="cf__letterText">D</span></kbd></span>
      <span class="cf__state" role="cell">
        <span class="cf__warn">衝突</span>
        <span class="cf__ok">問題なし</span>
      </span>
    </div>
    <div class="cf__row" role="row">
      <span class="cf__act" role="cell">クイックオープン</span>
      <span class="cf__bind" role="cell"><kbd class="cf__key">Ctrl</kbd><kbd class="cf__key"><span class="cf__letterText" id="lastLetter">K</span><span class="cf__letterAlt" aria-hidden="true">J</span></kbd></span>
      <span class="cf__state" role="cell">
        <span class="cf__warn">衝突</span>
        <span class="cf__ok">問題なし</span>
      </span>
    </div>
  </div>
  <p class="cf__live" aria-live="polite">同じ組み合わせが 2 行にあります</p>
  <button type="button" class="cf__swap" id="swap">最後の行を Ctrl+J に</button>
</div>
</main>
<script>
var cf = document.getElementById('cf');
var swap = document.getElementById('swap');
var lastLetter = document.getElementById('lastLetter');
var rows = Array.prototype.slice.call(document.querySelectorAll('.cf__row'));
function bindingOf(row) {
  return 'Ctrl+' + row.querySelector('.cf__letterText').textContent;
}
// 조합마다 몇 줄이 쓰는지 세어, 두 줄 이상이면 그 줄을 충돌로 본다
function applyConflicts() {
  var counts = new Map();
  rows.forEach(function (row) {
    var key = bindingOf(row);
    counts.set(key, (counts.get(key) || 0) + 1);
  });
  var hit = 0;
  rows.forEach(function (row) {
    var dup = counts.get(bindingOf(row)) > 1;
    row.classList.toggle('is-conflict', dup);
    row.classList.toggle('is-ok', !dup);
    if (dup) { hit = hit + 1; }
  });
  cf.classList.toggle('has-conflict', hit > 0);
  swap.disabled = hit === 0;
}
swap.addEventListener('click', function () {
  cf.classList.remove('is-demo');
  lastLetter.textContent = 'J';
  applyConflicts();
});
applyConflicts();
</script>
</body>
</html>
