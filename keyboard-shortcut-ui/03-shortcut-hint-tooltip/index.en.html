<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단축키 힌트 툴팁 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="enter" viewBox="0 0 256 256" fill="currentColor"><path d="M96,128v96L48,176Z" opacity="0.2"/><path d="M192,24a8,8,0,0,0-8,8V168H104V128a8,8,0,0,0-13.66-5.66l-48,48a8,8,0,0,0,0,11.32l48,48A8,8,0,0,0,104,224V184h88a8,8,0,0,0,8-8V32A8,8,0,0,0,192,24ZM88,204.69,59.31,176,88,147.31Z"/></symbol>
  </defs>
</svg>
<main class="stage">
<div class="ht is-demo" id="ht">
  <p class="ht__cap">Hover a button</p>
  <div class="ht__bar" role="toolbar" aria-label="Editing tools">
    <button type="button" class="ht__btn" data-combo="s" aria-keyshortcuts="Control+S">
      <span class="ht__label">Save</span>
      <span class="ht__tip" role="tooltip"><kbd class="ht__cap1">Ctrl</kbd><kbd class="ht__cap1">S</kbd></span>
    </button>
    <button type="button" class="ht__btn" data-combo="f" aria-keyshortcuts="Control+F">
      <span class="ht__label">Find</span>
      <span class="ht__tip" role="tooltip"><kbd class="ht__cap1">Ctrl</kbd><kbd class="ht__cap1">F</kbd></span>
    </button>
    <button type="button" class="ht__btn" data-combo="enter" aria-keyshortcuts="Control+Enter">
      <span class="ht__label">Run</span>
      <span class="ht__tip" role="tooltip"><kbd class="ht__cap1">Ctrl</kbd><kbd class="ht__cap1"><svg class="ht__ico" aria-hidden="true"><use href="#enter"/></svg></kbd></span>
    </button>
  </div>
</div>
</main>
<script>
var ht = document.getElementById('ht');
var buttons = Array.prototype.slice.call(document.querySelectorAll('.ht__btn'));
function flash(btn) {
  btn.classList.add('is-hit');
  setTimeout(function () { btn.classList.remove('is-hit'); }, 240);
}
buttons.forEach(function (btn) {
  btn.addEventListener('pointerenter', function () { ht.classList.remove('is-demo'); });
  btn.addEventListener('focus', function () { ht.classList.remove('is-demo'); });
});
// aria-keyshortcuts 에 적어 둔 조합을 실제로 눌러도 같은 버튼이 반응한다
window.addEventListener('keydown', function (e) {
  if (!e.ctrlKey && !e.metaKey) { return; }
  var want = e.key === 'Enter' ? 'enter' : String(e.key).toLowerCase();
  for (var i = 0; i < buttons.length; i++) {
    if (buttons[i].getAttribute('data-combo') === want) {
      e.preventDefault();
      ht.classList.remove('is-demo');
      flash(buttons[i]);
      return;
    }
  }
});
</script>
</body>
</html>
