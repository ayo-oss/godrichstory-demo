<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J·K 목록 移動 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rv is-demo" id="rv">
  <p class="rv__cap">J で下・K で上・Enter で開く</p>
  <ul class="rv__list" id="list" role="listbox" aria-label="受信メール" style="--i: 0">
    <li class="rv__marker" aria-hidden="true"></li>
    <li class="rv__row" role="option" tabindex="0" aria-selected="true"><span class="rv__who">キム・ハヌル</span><span class="rv__what">決済レシート</span></li>
    <li class="rv__row" role="option" tabindex="-1" aria-selected="false"><span class="rv__who">配送のお知らせ</span><span class="rv__what">本日到着</span></li>
    <li class="rv__row" role="option" tabindex="-1" aria-selected="false"><span class="rv__who">チームノート</span><span class="rv__what">会議のまとめ</span></li>
    <li class="rv__row" role="option" tabindex="-1" aria-selected="false"><span class="rv__who">エデン</span><span class="rv__what">週末の予定</span></li>
  </ul>
</div>
</main>
<script>
var rv = document.getElementById('rv');
var list = document.getElementById('list');
var rows = Array.prototype.slice.call(document.querySelectorAll('.rv__row'));
var index = 0;
// 로빙 tabindex — 목록 전체가 아니라 한 줄만 tabindex 0 을 갖는다. Tab 한 번이면 목록을 지나간다
function applySelection(next) {
  index = Math.max(0, Math.min(rows.length - 1, next));
  list.style.setProperty('--i', String(index));
  rows.forEach(function (row, i) {
    row.setAttribute('tabindex', i === index ? '0' : '-1');
    row.setAttribute('aria-selected', i === index ? 'true' : 'false');
    row.classList.toggle('is-open', false);
  });
  // iframe 안에서 preventScroll 없이 부르면 부모 페이지가 이 줄로 끌려 내려간다 (BD18)
  rows[index].focus({ preventScroll: true });
}
list.addEventListener('keydown', function (e) {
  var key = String(e.key).toLowerCase();
  if (key !== 'j' && key !== 'k' && e.key !== 'Enter') { return; }
  e.preventDefault();
  rv.classList.remove('is-demo');
  if (key === 'j') { applySelection(index + 1); }
  if (key === 'k') { applySelection(index - 1); }
  if (e.key === 'Enter') { rows[index].classList.add('is-open'); }
});
rows.forEach(function (row, i) {
  row.addEventListener('click', function () { rv.classList.remove('is-demo'); applySelection(i); });
});
</script>
</body>
</html>
