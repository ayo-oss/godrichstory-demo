<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team activity stream — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ts is-demo" id="ts" aria-label="チームのアクティビティストリーム">
    <header class="ts__h">
      <span class="ts__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><path d="M160 216h-.4a8.1 8.1 0 0 1-7.1-5.2l-57.2-150l-32 70.5A8 8 0 0 1 56 136H24a8 8 0 0 1 0-16h26.8l37.9-83.3a8.2 8.2 0 0 1 7.6-4.7a8 8 0 0 1 7.2 5.2L161 188.1l31.8-63.7a8.2 8.2 0 0 1 7.2-4.4h32a8 8 0 0 1 0 16h-27.1l-37.7 75.6a8.2 8.2 0 0 1-7.2 4.4Z"/></svg></span>
      <h2 class="ts__t">チームの活動</h2>
      <span class="ts__n" id="ts-n" data-t="{n}件" aria-live="polite">4件</span>
    </header>
    <ul class="ts__list" role="log" aria-live="polite" id="ts-list">
      <li class="ts__row ts__row--new" data-row="new">
        <div class="ts__fold"><div class="ts__cell">
          <span class="ts__av" style="--a:#93a4ca">金</span>
          <p class="ts__line"><b>キム・ハヌル</b>が秋キャンペーンの文書を編集しました</p>
          <time class="ts__tm">たった今</time>
          <span class="ts__bar" aria-hidden="true"></span>
        </div></div>
      </li>
      <li class="ts__row" data-row="1">
        <div class="ts__fold"><div class="ts__cell">
          <span class="ts__av" style="--a:#90c8b5">朴</span>
          <p class="ts__line"><b>パク・ソア</b>が週次報告を承認しました</p>
          <time class="ts__tm">8分前</time>
        </div></div>
      </li>
      <li class="ts__row" data-row="2">
        <div class="ts__fold"><div class="ts__cell">
          <span class="ts__av" style="--a:#ff9ebb">李</span>
          <p class="ts__line"><b>イ・ジュン</b>が在庫リストにコメントを残しました</p>
          <time class="ts__tm">26分前</time>
        </div></div>
      </li>
      <li class="ts__row ts__row--old" data-row="3">
        <div class="ts__fold"><div class="ts__cell">
          <span class="ts__av" style="--a:#c3d6e2">崔</span>
          <p class="ts__line"><b>チェ・ドユン</b>が発注書をアップロードしました</p>
          <time class="ts__tm">1時間前</time>
        </div></div>
      </li>
    </ul>
    <button class="ts__add" type="button" id="ts-add">
      <span class="ts__plus" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><path d="M228 128a100 100 0 1 1-100-100a100 100 0 0 1 100 100" opacity=".2"/><path d="M208 120h-72V48a8 8 0 0 0-16 0v72H48a8 8 0 0 0 0 16h72v72a8 8 0 0 0 16 0v-72h72a8 8 0 0 0 0-16"/></svg></span>
      活動を追加
    </button>
  </section>
</main>
<template id="ts-tpl"><li class="ts__row is-in"><div class="ts__fold"><div class="ts__cell">
  <span class="ts__av" style="--a:#b9a0ff">韓</span>
  <p class="ts__line"><b>ハン・ビョル</b>が秋キャンペーンの文書を編集しました</p>
  <time class="ts__tm">たった今</time>
  <span class="ts__bar" aria-hidden="true"></span>
</div></div></li></template>
<script>
// 실제 동작: 활동 추가를 누르면 목록 맨 위에 새 줄이 자라 나타난다(등장만).
// 목록은 role="log" + aria-live="polite" 라 새 줄이 낭독기에도 전해진다.
var ts = document.getElementById('ts');
var tsList = document.getElementById('ts-list');
var tsN = document.getElementById('ts-n');
var tsCount = 4;
function tsCountUp() {
  tsCount++;
  tsN.textContent = tsN.getAttribute('data-t').replace('{n}', tsCount);
}
document.getElementById('ts-add').addEventListener('click', function () {
  ts.classList.remove('is-demo');
  var row = document.getElementById('ts-tpl').content.firstElementChild.cloneNode(true);
  row.classList.add('is-shut');
  tsList.insertBefore(row, tsList.firstChild);
  void row.offsetWidth; // 두 단계로 나눠야 grid 전환이 애니메이션으로 잡힌다
  row.classList.remove('is-shut');
  tsCountUp();
});
</script>
</body>
</html>
