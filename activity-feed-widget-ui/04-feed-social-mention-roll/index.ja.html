<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social mention roll — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="mn is-demo" id="mn" aria-label="リアルタイム言及">
    <header class="mn__h">
      <span class="mn__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M128 24a104 104 0 0 0 0 208c21.51 0 44.1-6.48 60.43-17.33a8 8 0 0 0-8.86-13.33C166 210.38 146.21 216 128 216a88 88 0 1 1 88-88c0 26.45-10.88 32-20 32s-20-5.55-20-32V88a8 8 0 0 0-16 0v4.26a48 48 0 1 0 5.93 65.1c6 12 16.35 18.64 30.07 18.64c22.54 0 36-17.94 36-48A104.11 104.11 0 0 0 128 24m0 136a32 32 0 1 1 32-32a32 32 0 0 1-32 32"/></g></svg></span>
      <h2 class="mn__t">リアルタイム言及</h2>
      <span class="mn__live"><span class="mn__pdot" aria-hidden="true"></span>配信中</span>
    </header>
    <ul class="mn__list" role="log" aria-live="polite" id="mn-list">
      <li class="mn__row mn__row--new" data-row="new">
        <div class="mn__fold"><div class="mn__card">
          <p class="mn__txt">サイドバーに入れたらチームがすぐ分かってくれました</p>
          <p class="mn__who">@sora.codes <time class="mn__tm">たった今</time></p>
        </div></div>
      </li>
      <li class="mn__row" data-row="1">
        <div class="mn__fold"><div class="mn__card">
          <p class="mn__txt">この決済画面そのまま真似してもいいですか</p>
          <p class="mn__who">@yuna.builds <time class="mn__tm">2分前</time></p>
        </div></div>
      </li>
      <li class="mn__row mn__row--old" data-row="2">
        <div class="mn__fold"><div class="mn__card">
          <p class="mn__txt">返信を待つウィジェット、本当にきれいですね</p>
          <p class="mn__who">@minho.dev <time class="mn__tm">9分前</time></p>
        </div></div>
      </li>
    </ul>
    <button class="mn__more" type="button" id="mn-more">言及を読み込む</button>
  </section>
</main>
<template id="mn-tpl"><li class="mn__row is-in"><div class="mn__fold"><div class="mn__card">
  <p class="mn__txt">アクティビティフィードの記事を保存しました</p>
  <p class="mn__who">@dali.works <time class="mn__tm">たった今</time></p>
</div></div></li></template>
<script>
// 실제 동작: 언급 불러오기를 누르면 다음 언급이 카드로 굴러 들어와 맨 위에 놓인다 (등장만).
// 목록은 role="log" + aria-live="polite" — 새 언급이 낭독기에도 전해진다.
var mn = document.getElementById('mn');
var mnList = document.getElementById('mn-list');
document.getElementById('mn-more').addEventListener('click', function () {
  mn.classList.remove('is-demo');
  var row = document.getElementById('mn-tpl').content.firstElementChild.cloneNode(true);
  mnList.insertBefore(row, mnList.firstChild);
  row.addEventListener('animationend', function () { row.classList.remove('is-in'); }, { once: true });
});
</script>
</body>
</html>
