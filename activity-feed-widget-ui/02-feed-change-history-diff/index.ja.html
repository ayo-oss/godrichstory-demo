<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change history diff — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="dh is-demo" id="dh" aria-label="見積変更履歴">
    <header class="dh__h">
      <span class="dh__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M224 128a96 96 0 0 1-94.71 96H128a95.38 95.38 0 0 1-65.9-26.2a8 8 0 0 1 11-11.63a80 80 0 1 0-1.67-114.78a3 3 0 0 1-.26.25L44.59 96H72a8 8 0 0 1 0 16H24a8 8 0 0 1-8-8V56a8 8 0 0 1 16 0v29.8L60.25 60A96 96 0 0 1 224 128"/></g></svg></span>
      <h2 class="dh__t">変更履歴</h2>
      <span class="dh__n" id="dh-n" data-t="{n}箇所を変更" aria-live="polite">3箇所を変更</span>
    </header>
    <ul class="dh__list" id="dh-list">
      <li class="dh__row" data-row="1">
        <span class="dh__f">納期</span>
        <p class="dh__diff">
          <span class="dh__a"><del>10月15日</del> → <ins>10月8日</ins></span>
          <span class="dh__b"><b>10月15日</b><i class="dh__tag">戻しました</i></span>
        </p>
        <button class="dh__undo" type="button" aria-pressed="false" data-f="納期">
          <span class="dh__u" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M224 128a96 96 0 0 1-94.71 96H128a95.38 95.38 0 0 1-65.9-26.2a8 8 0 0 1 11-11.63a80 80 0 1 0-1.67-114.78a3 3 0 0 1-.26.25L44.59 96H72a8 8 0 0 1 0 16H24a8 8 0 0 1-8-8V56a8 8 0 0 1 16 0v29.8L60.25 60A96 96 0 0 1 224 128"/></g></svg></span>
          元に戻す
        </button>
      </li>
      <li class="dh__row" data-row="2">
        <span class="dh__f">担当者</span>
        <p class="dh__diff">
          <span class="dh__a"><del>イ・ジュン</del> → <ins>パク・ソア</ins></span>
          <span class="dh__b"><b>イ・ジュン</b><i class="dh__tag">戻しました</i></span>
        </p>
        <button class="dh__undo" type="button" aria-pressed="false" data-f="担当者">
          <span class="dh__u" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M224 128a96 96 0 0 1-94.71 96H128a95.38 95.38 0 0 1-65.9-26.2a8 8 0 0 1 11-11.63a80 80 0 1 0-1.67-114.78a3 3 0 0 1-.26.25L44.59 96H72a8 8 0 0 1 0 16H24a8 8 0 0 1-8-8V56a8 8 0 0 1 16 0v29.8L60.25 60A96 96 0 0 1 224 128"/></g></svg></span>
          元に戻す
        </button>
      </li>
      <li class="dh__row" data-row="3">
        <span class="dh__f">数量</span>
        <p class="dh__diff">
          <span class="dh__a"><del>120</del> → <ins>150</ins></span>
          <span class="dh__b"><b>120</b><i class="dh__tag">戻しました</i></span>
        </p>
        <button class="dh__undo" type="button" aria-pressed="false" data-f="数量">
          <span class="dh__u" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M224 128a96 96 0 0 1-94.71 96H128a95.38 95.38 0 0 1-65.9-26.2a8 8 0 0 1 11-11.63a80 80 0 1 0-1.67-114.78a3 3 0 0 1-.26.25L44.59 96H72a8 8 0 0 1 0 16H24a8 8 0 0 1-8-8V56a8 8 0 0 1 16 0v29.8L60.25 60A96 96 0 0 1 224 128"/></g></svg></span>
          元に戻す
        </button>
      </li>
    </ul>
    <p class="dh__live" aria-live="polite" id="dh-live">項目を元に戻すとここに表示されます</p>
  </section>
</main>
<script>
// 실제 동작: 되돌리기를 누른 항목만 이전 값으로 돌아간다 (화면 표시와 aria 상태 둘 다).
var dh = document.getElementById('dh');
var dhN = document.getElementById('dh-n');
var dhLive = document.getElementById('dh-live');
var dhLeft = 3;
function dhCount() {
  dhN.textContent = dhN.getAttribute('data-t').replace('{n}', dhLeft);
}
document.querySelectorAll('.dh__undo').forEach(function (b) {
  b.addEventListener('click', function () {
    dh.classList.remove('is-demo');
    var row = b.closest('.dh__row');
    var back = row.classList.toggle('is-back');
    b.setAttribute('aria-pressed', back ? 'true' : 'false');
    dhLeft += back ? -1 : 1;
    dhCount();
    dhLive.textContent = back
      ? b.getAttribute('data-f') + 'を前の値に戻しました'
      : b.getAttribute('data-f') + 'を再び修正しました';
  });
});
</script>
</body>
</html>
