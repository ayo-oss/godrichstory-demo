<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empty feed to first activity — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ef is-demo" id="ef" aria-label="활동 피드">
    <header class="ef__h">
      <h2 class="ef__t">활동 피드</h2>
      <span class="ef__phase" id="ef-phase" data-t1="활동 {n}건" data-t2="비어 있음" aria-live="polite">비어 있음</span>
    </header>
    <div class="ef__empty" id="ef-empty">
      <span class="ef__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M216 48v112h-36.69a8 8 0 0 0-5.66 2.34l-19.31 19.32a8 8 0 0 1-5.66 2.34h-41.37a8 8 0 0 1-5.66-2.34l-19.31-19.32a8 8 0 0 0-5.66-2.34H40V48a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 32H48a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 16v104h-28.7a15.86 15.86 0 0 0-11.3 4.69L148.69 176h-41.38L88 156.68A15.9 15.9 0 0 0 76.69 152H48V48Zm0 160H48v-40h28.69L96 187.32a15.9 15.9 0 0 0 11.31 4.68h41.38a15.86 15.86 0 0 0 11.31-4.69L179.31 168H208z"/></g></svg></span>
      <p class="ef__e1">아직 활동이 없습니다</p>
      <p class="ef__e2">첫 활동이 생기면 여기에 쌓입니다</p>
    </div>
    <ul class="ef__list" role="log" aria-live="polite" id="ef-list">
      <li class="ef__row ef__row--first" data-row="first">
        <div class="ef__fold"><div class="ef__cell">
          <span class="ef__av" style="--a:#93a4ca">김</span>
          <p class="ef__line"><b>김하늘</b>이 팀에 들어왔습니다</p>
          <time class="ef__tm">방금</time>
        </div></div>
      </li>
      <li class="ef__row ef__row--second" data-row="second">
        <div class="ef__fold"><div class="ef__cell">
          <span class="ef__av" style="--a:#ff9ebb">이</span>
          <p class="ef__line"><b>이준</b>이 시작 가이드를 열었습니다</p>
          <time class="ef__tm">방금</time>
        </div></div>
      </li>
    </ul>
    <div class="ef__btns">
      <button class="ef__b ef__b--main" type="button" id="ef-add">새 활동</button>
      <button class="ef__b" type="button" id="ef-clear">비우기</button>
    </div>
  </section>
</main>
<template id="ef-tpl"><li class="ef__row is-in"><div class="ef__fold"><div class="ef__cell">
  <span class="ef__av" style="--a:#90c8b5">박</span>
  <p class="ef__line"><b>박서아</b>가 첫 문서를 만들었습니다</p>
  <time class="ef__tm">방금</time>
</div></div></li></template>
<script>
// 실제 동작: 새 활동을 누르면 빈 상태가 물러나고 첫 활동이 자라 나타난다.
// 비우기는 반대로 — 줄을 전부 치우고 빈 상태로 돌아간다. 상태 문구는 aria-live 로 읽힌다.
var ef = document.getElementById('ef');
var efEmpty = document.getElementById('ef-empty');
var efList = document.getElementById('ef-list');
var efPhase = document.getElementById('ef-phase');
var efCount = 0; // 접힌 미리보기 줄은 세지 않는다
function efSync(on) {
  ef.classList.toggle('has-act', on);
  efPhase.textContent = on
    ? efPhase.getAttribute('data-t1').replace('{n}', efCount)
    : efPhase.getAttribute('data-t2');
}
document.getElementById('ef-add').addEventListener('click', function () {
  ef.classList.remove('is-demo');
  var row = document.getElementById('ef-tpl').content.firstElementChild.cloneNode(true);
  efList.insertBefore(row, efList.firstChild);
  efCount++;
  efSync(true);
});
document.getElementById('ef-clear').addEventListener('click', function () {
  ef.classList.remove('is-demo');
  efList.innerHTML = '';
  efCount = 0;
  efSync(false);
});
efSync(false);
</script>
</body>
</html>
