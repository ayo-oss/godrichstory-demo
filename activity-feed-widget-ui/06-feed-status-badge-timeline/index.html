<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status badge timeline — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="st is-demo" id="st" aria-label="승인 진행 상태">
    <header class="st__h">
      <span class="st__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><path d="M160 216h-.4a8.1 8.1 0 0 1-7.1-5.2l-57.2-150l-32 70.5A8 8 0 0 1 56 136H24a8 8 0 0 1 0-16h26.8l37.9-83.3a8.2 8.2 0 0 1 7.6-4.7a8 8 0 0 1 7.2 5.2L161 188.1l31.8-63.7a8.2 8.2 0 0 1 7.2-4.4h32a8 8 0 0 1 0 16h-27.1l-37.7 75.6a8.2 8.2 0 0 1-7.2 4.4Z"/></svg></span>
      <h2 class="st__t">가을 캠페인 기획안</h2>
      <span class="st__phase" id="st-phase" data-at="0">
        <i class="st__p st__p--1" aria-hidden="true">제출 단계</i>
        <i class="st__p st__p--2" aria-hidden="true">검토 단계</i>
        <i class="st__p st__p--3" aria-hidden="true">승인 단계</i>
      </span>
      <span class="st__sr" id="st-live" aria-live="polite">제출 단계</span>
    </header>
    <ol class="st__tl" id="st-tl">
      <li class="st__row" data-row="1">
        <span class="st__rail" aria-hidden="true"><i class="st__fill"></i></span>
        <span class="st__dot" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="m223.69 42.18l-58.22 192a8 8 0 0 1-14.92 1.25L108 148l-87.42-42.55a8 8 0 0 1 1.25-14.92l192-58.22a8 8 0 0 1 9.86 9.87" opacity=".2"/><path d="M227.32 28.68a16 16 0 0 0-15.66-4.08h-.15L19.57 82.84a16 16 0 0 0-2.49 29.8L102 154l41.3 84.87a15.86 15.86 0 0 0 14.44 9.13q.69 0 1.38-.06a15.88 15.88 0 0 0 14-11.51l58.2-191.94v-.15a16 16 0 0 0-4-15.66m-69.49 203.17l-.05.14v-.07l-40.06-82.3l48-48a8 8 0 0 0-11.31-11.31l-48 48l-82.33-40.06h-.07h.14L216 40Z"/></g></svg></span>
        <span class="st__lb">제출<time class="st__tm">09:12</time></span>
      </li>
      <li class="st__row" data-row="2">
        <span class="st__rail" aria-hidden="true"><i class="st__fill"></i></span>
        <span class="st__dot" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M192 112a80 80 0 1 1-80-80a80 80 0 0 1 80 80" opacity=".2"/><path d="m229.66 218.34l-50.06-50.06a88.21 88.21 0 1 0-11.32 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></g></svg></span>
        <span class="st__lb">검토<time class="st__tm">10:05</time></span>
      </li>
      <li class="st__row" data-row="3">
        <span class="st__rail st__rail--end" aria-hidden="true"><i class="st__fill"></i></span>
        <span class="st__dot" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M174 47.75a254.19 254.19 0 0 0-41.45-38.3a8 8 0 0 0-9.18 0A254.36 254.36 0 0 0 82 47.75C54.51 79.32 40 112.6 40 144a88 88 0 0 0 176 0c0-31.4-14.51-64.68-42-96.25M128 216a72.08 72.08 0 0 1-72-72c0-57.23 55.47-99.58 72-110.93c16.53 11.35 72 53.7 72 110.93a72.08 72.08 0 0 1-72 72"/></g></svg></span>
        <span class="st__lb">승인<time class="st__tm">대기 중</time></span>
      </li>
    </ol>
    <button class="st__next" type="button" id="st-next">다음 단계</button>
  </section>
</main>
<script>
// 실제 동작: 다음 단계를 누르면 진행 단계가 실제로 넘어간다 —
// 지금 단계에만 aria-current="step" 이 붙고 안내 문구도 같이 바뀐다.
var st = document.getElementById('st');
var stRows = [].slice.call(document.querySelectorAll('.st__row'));
var stPhase = document.getElementById('st-phase');
var stLive = document.getElementById('st-live');
var stNames = ['제출', '검토', '승인'];
var stAt = 0;
function stGo(i) {
  stAt = (i + stRows.length) % stRows.length;
  stRows.forEach(function (r, n) {
    r.classList.toggle('is-now', n === stAt);
    r.classList.toggle('is-done', n < stAt);
    if (n === stAt) { r.setAttribute('aria-current', 'step'); }
    else { r.removeAttribute('aria-current'); }
  });
  stPhase.setAttribute('data-at', String(stAt));
  stLive.textContent = stNames[stAt] + ' 단계';
}
document.getElementById('st-next').addEventListener('click', function () {
  st.classList.remove('is-demo');
  stGo(stAt + 1);
});
stGo(0);
</script>
</body>
</html>
