</main>
<script>
// 실제 동작: 칩을 눌러 수준을 끄고 켠다 — 눌린 수준의 줄만 남고 나머지 줄은 hidden 로 화면에서 빠진다.
// 전부 꺼지면 아무 걸러짐이 없으므로 줄 전부를 다시 보여준다.
var lg = document.getElementById('lg');
var lgChips = [].slice.call(document.querySelectorAll('.lg__chip'));
var lgRows = [].slice.call(document.querySelectorAll('.lg__row'));
var lgLive = document.getElementById('lg-live');
function lgFilter() {
  var on = lgChips.filter(function (c) { return c.getAttribute('aria-pressed') === 'true'; })
    .map(function (c) { return c.getAttribute('data-k'); });
  var showAll = on.length === 0 || on.length === lgChips.length;
  lgRows.forEach(function (r) {
    r.hidden = !(showAll || on.indexOf(r.getAttribute('data-k')) >= 0);
  });
  lgLive.textContent = showAll ? 'Showing every line' : on.length + ' levels only';
}
lgChips.forEach(function (c) {
  c.addEventListener('click', function () {
    lg.classList.remove('is-demo');
    var now = c.getAttribute('aria-pressed') === 'true';
    c.setAttribute('aria-pressed', now ? 'false' : 'true');
    c.classList.toggle('is-off', now);
    lgFilter();
  });
});
lgFilter();
</script>
</body>
</html>
