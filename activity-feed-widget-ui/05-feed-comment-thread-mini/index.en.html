<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini comment thread — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ct is-demo" id="ct" aria-label="Comment thread">
    <article class="ct__top">
      <span class="ct__av" style="--a:#90c8b5">P</span>
      <div class="ct__body">
        <p class="ct__txt"><b>Park Seo-a</b>  Where can I see the new release schedule?</p>
        <time class="ct__tm">1h ago</time>
      </div>
    </article>
    <button class="ct__tg" type="button" id="ct-tg" aria-expanded="false" aria-controls="ct-re">
      <span class="ct__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></span>
      2 replies
    </button>
    <div class="ct__fold" id="ct-re">
      <div class="ct__inner">
        <ul class="ct__list" role="log" aria-live="polite" id="ct-list">
          <li class="ct__rep" data-row="1">
            <span class="ct__av ct__av--s" style="--a:#ff9ebb">L</span>
            <p class="ct__txt"><b>Lee Jun</b>  It's at the bottom of the release notes</p>
            <time class="ct__tm">50m ago</time>
          </li>
          <li class="ct__rep ct__rep--old" data-row="2">
            <span class="ct__av ct__av--s" style="--a:#c3d6e2">C</span>
            <p class="ct__txt"><b>Choi Do-yun</b>  It's on the dashboard notice too</p>
            <time class="ct__tm">42m ago</time>
          </li>
          <li class="ct__rep ct__rep--new" data-row="new">
            <div class="ct__rfold"><div class="ct__rcell">
              <span class="ct__av ct__av--s" style="--a:#93a4ca">K</span>
              <p class="ct__txt"><b>Kim Haneul</b>  I'll share the schedule link too</p>
              <time class="ct__tm">now</time>
            </div></div>
          </li>
        </ul>
        <button class="ct__add" type="button" id="ct-add">Reply</button>
      </div>
    </div>
  </section>
</main>
<template id="ct-tpl"><li class="ct__rep is-in"><div class="ct__rfold"><div class="ct__rcell">
  <span class="ct__av ct__av--s" style="--a:#b9a0ff">H</span>
  <p class="ct__txt"><b>Han Byeol</b>  I'll post the deck soon too</p>
  <time class="ct__tm">now</time>
</div></div></li></template>
<script>
// 실제 동작: 2 replies 토글은 접힘·펼침을 바꾸고(aria-expanded),
// 댓글 달기는 답글 칸 맨 아래에 새 댓글을 자라나게 한다 (등장만).
var ct = document.getElementById('ct');
var ctTg = document.getElementById('ct-tg');
var ctRe = document.getElementById('ct-re');
var ctList = document.getElementById('ct-list');
function ctOpen(on) {
  ctRe.classList.toggle('is-open', on);
  ctTg.setAttribute('aria-expanded', on ? 'true' : 'false');
  ctTg.classList.toggle('is-open', on);
}
ctTg.addEventListener('click', function () {
  ct.classList.remove('is-demo');
  ctOpen(!ctRe.classList.contains('is-open'));
});
document.getElementById('ct-add').addEventListener('click', function () {
  ct.classList.remove('is-demo');
  ctOpen(true);
  var row = document.getElementById('ct-tpl').content.firstElementChild.cloneNode(true);
  ctList.appendChild(row);
  void row.offsetWidth; // 두 단계로 나눠야 grid 전환이 애니메이션으로 잡힌다
  row.classList.add('is-grow'); // is-in 은 그대로 — 새 답글 표시(테두리)로 남긴다
});
</script>
</body>
</html>
