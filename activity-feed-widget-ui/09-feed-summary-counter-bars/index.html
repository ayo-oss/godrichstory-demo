<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summary counter bars — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="sc is-demo" id="sc" aria-label="오늘의 활동 요약">
    <header class="sc__h">
      <span class="sc__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="m96 40l33.52 88H56Zm104 88h-70.48L160 208Z" opacity=".2"/><path d="M240 128a8 8 0 0 1-8 8h-27.06l-37.78 75.58A8 8 0 0 1 160 216h-.4a8 8 0 0 1-7.08-5.14L95.35 60.76l-32.07 70.55A8 8 0 0 1 56 136H24a8 8 0 0 1 0-16h26.85l37.87-83.31a8 8 0 0 1 14.76.46l57.51 151l31.85-63.71A8 8 0 0 1 200 120h32a8 8 0 0 1 8 8"/></g></svg></span>
      <h2 class="sc__t">오늘의 활동</h2>
      <button class="sc__re" type="button" id="sc-re">새로 집계</button>
    </header>
    <p class="sc__cap" aria-live="polite"><span class="sc__n" id="sc-n" data-n="12"><i class="sc__d sc__d--a" aria-hidden="true">0</i><i class="sc__d sc__d--b" aria-hidden="true">4</i><i class="sc__d sc__d--c" aria-hidden="true">12</i></span><span class="sc__unit">건의 활동</span></p>
    <div class="sc__chart" role="img" aria-label="시간대별 활동 막대 — 아홉 시부터 열네 시까지">
      <div class="sc__col"><span class="sc__barw" style="--f:.30"><i class="sc__bar"></i></span><span class="sc__hr">09</span></div>
      <div class="sc__col"><span class="sc__barw" style="--f:.55"><i class="sc__bar"></i></span><span class="sc__hr">10</span></div>
      <div class="sc__col"><span class="sc__barw" style="--f:1"><i class="sc__bar"></i></span><span class="sc__hr">11</span></div>
      <div class="sc__col"><span class="sc__barw" style="--f:.80"><i class="sc__bar"></i></span><span class="sc__hr">12</span></div>
      <div class="sc__col"><span class="sc__barw" style="--f:.45"><i class="sc__bar"></i></span><span class="sc__hr">13</span></div>
      <div class="sc__col"><span class="sc__barw" style="--f:.65"><i class="sc__bar sc__bar--last"></i></span><span class="sc__hr">14</span></div>
    </div>
  </section>
</main>
<script>
// 실제 동작: 새로 집계를 누르면 숫자가 실제로 올라가고 마지막 막대가 실제로 자란다.
// 숫자가 바뀌는 순간 aria-live 로 다시 읽힌다.
var sc = document.getElementById('sc');
var scN = document.getElementById('sc-n');
var scLast = document.querySelector('.sc__bar--last');
document.getElementById('sc-re').addEventListener('click', function () {
  sc.classList.remove('is-demo');
  var from = Number(scN.getAttribute('data-n'));
  var to = from + 1;
  var t0 = null;
  function tick(ts) {
    if (!t0) { t0 = ts; }
    var p = Math.min(1, (ts - t0) / 400);
    var v = Math.round(from + (to - from) * p);
    scN.textContent = String(v);
    if (p < 1) { requestAnimationFrame(tick); }
  }
  requestAnimationFrame(tick);
  scN.setAttribute('data-n', String(to));
  var w = scLast.parentNode;
  w.style.setProperty('--f', '.85'); // 막대 자체가 실제로 자란다
  scLast.parentNode.classList.add('is-up');
});
</script>
</body>
</html>
