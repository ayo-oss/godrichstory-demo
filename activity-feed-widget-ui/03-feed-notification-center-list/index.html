<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification center list — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="nc is-demo" id="nc" aria-label="알림 목록">
    <header class="nc__h">
      <span class="nc__bellw">
        <span class="nc__bell" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M208 192H48a8 8 0 0 1-6.88-12C47.71 168.6 56 139.81 56 104a72 72 0 0 1 144 0c0 35.82 8.3 64.6 14.9 76a8 8 0 0 1-6.9 12" opacity=".2"/><path d="M221.8 175.94c-5.55-9.56-13.8-36.61-13.8-71.94a80 80 0 1 0-160 0c0 35.34-8.26 62.38-13.81 71.94A16 16 0 0 0 48 200h40.81a40 40 0 0 0 78.38 0H208a16 16 0 0 0 13.8-24.06M128 216a24 24 0 0 1-22.62-16h45.24A24 24 0 0 1 128 216m-80-32c7.7-13.24 16-43.92 16-80a64 64 0 1 1 128 0c0 36.05 8.28 66.73 16 80Z"/></g></svg></span>
        <span class="nc__badge" id="nc-badge" data-t="안 읽은 알림 {n}건" aria-live="polite">안 읽은 알림 3건</span>
      </span>
      <button class="nc__all" type="button" id="nc-all">
        <span class="nc__ck" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg></span>
        모두 읽음
      </button>
    </header>
    <ul class="nc__list" id="nc-list">
      <li class="nc__row" data-row="1">
        <button class="nc__it" type="button">
          <span class="nc__dot" aria-hidden="true"></span>
          <span class="nc__msg">주간 보고가 승인되었습니다</span>
          <span class="nc__meta"><span class="nc__read" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg></span>5분 전</span>
        </button>
      </li>
      <li class="nc__row" data-row="2">
        <button class="nc__it" type="button">
          <span class="nc__dot" aria-hidden="true"></span>
          <span class="nc__msg">이준님이 댓글을 남겼습니다</span>
          <span class="nc__meta"><span class="nc__read" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg></span>20분 전</span>
        </button>
      </li>
      <li class="nc__row" data-row="3">
        <button class="nc__it" type="button">
          <span class="nc__dot" aria-hidden="true"></span>
          <span class="nc__msg">발주서 파일이 도착했습니다</span>
          <span class="nc__meta"><span class="nc__read" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg></span>1시간 전</span>
        </button>
      </li>
      <li class="nc__row is-read nc__row--old" data-row="4">
        <button class="nc__it" type="button">
          <span class="nc__dot" aria-hidden="true"></span>
          <span class="nc__msg">재고 목록이 갱신되었습니다</span>
          <span class="nc__meta"><span class="nc__read" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg></span>어제</span>
        </button>
      </li>
    </ul>
  </section>
</main>
<script>
// 실제 동작: 항목을 열면 그 항목만 읽음이 되고, 모두 읽음은 남은 항목 전부를 읽음으로 바꾼다.
// 남은 수는 data-t 의 {n} 자리에 실제 숫자를 넣어 갱신한다.
var nc = document.getElementById('nc');
var ncBadge = document.getElementById('nc-badge');
var ncRows = [].slice.call(nc.querySelectorAll('.nc__row'));
function ncSync() {
  var left = ncRows.filter(function (r) { return !r.classList.contains('is-read'); }).length;
  ncBadge.textContent = ncBadge.getAttribute('data-t').replace('{n}', left);
}
ncRows.forEach(function (r) {
  r.querySelector('.nc__it').addEventListener('click', function () {
    nc.classList.remove('is-demo');
    r.classList.add('is-read');
    ncSync();
  });
});
document.getElementById('nc-all').addEventListener('click', function () {
  nc.classList.remove('is-demo');
  ncRows.forEach(function (r) { r.classList.add('is-read'); });
  ncSync();
});
ncSync();
</script>
</body>
</html>
