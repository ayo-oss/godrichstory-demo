<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감소된 모션 나란히 비교 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rm is-demo" id="rm">
  <div class="rm__col">
    <span class="rm__tag">일반</span>
    <div class="rm__mini">
      <button type="button" class="rm__field" id="rmNormalField">3월 14일</button>
      <div class="rm__pop rm__pop--normal" id="rmNormalPop">
        <div class="rm__popRow">12 13 <b>14</b> 15 16</div>
      </div>
    </div>
  </div>
  <div class="rm__col">
    <span class="rm__tag">감소된 모션</span>
    <div class="rm__mini">
      <button type="button" class="rm__field" id="rmReducedField">3월 14일</button>
      <div class="rm__pop rm__pop--reduced" id="rmReducedPop">
        <div class="rm__popRow">12 13 <b>14</b> 15 16</div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var rm = document.getElementById('rm');
  var normalField = document.getElementById('rmNormalField');
  var reducedField = document.getElementById('rmReducedField');
  var normalPop = document.getElementById('rmNormalPop');
  var reducedPop = document.getElementById('rmReducedPop');

  var open = false;

  function render() {
    normalPop.classList.toggle('is-open', open);
    reducedPop.classList.toggle('is-open', open);
  }

  function human() {
    rm.classList.remove('is-demo');
    stopAutoplay();
  }

  function toggle() {
    open = !open;
    render();
  }

  normalField.addEventListener('click', function () { human(); toggle(); });
  reducedField.addEventListener('click', function () { human(); toggle(); });

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  function tick() { toggle(); }

  render();
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(tick, 620); }
})();
</script>
</main>
</body>
</html>
