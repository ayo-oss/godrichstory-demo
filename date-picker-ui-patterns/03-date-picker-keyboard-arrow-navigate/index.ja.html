<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キーボード矢印移動 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="kb is-demo" id="kb">
  <div class="kb__head"><span class="kb__label">2026年3月</span></div>
  <div class="kb__weekday" aria-hidden="true">
    <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
  </div>
  <div class="kb__gridWrap">
    <div class="kb__ring" id="kbRing"></div>
    <div class="kb__grid" id="kbGrid" role="grid" aria-label="カレンダー"></div>
  </div>
</div>
<script>
(function () {
  var BASE = { y: 2026, m: 3, d: 14 }; // 계산 겹 상수: 고정 오늘, new Date() 미사용
  var CELL_TOTAL = 42; // 6행 고정
  var FOCUS_SEQ = [14, 15, 16, 23, 22, 21, 14]; // 계산 겹: 자동재생이 훑는 日付 순서

  function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
  function daysInMonth(y, m) {
    var t = [31, isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    return t[m - 1];
  }
  function dow(y, m, d) { // Zeller 합동식 — 0=日 ~ 6=土
    var yy = y, mm = m;
    if (mm < 3) { yy -= 1; mm += 12; }
    var K = yy % 100, J = Math.floor(yy / 100);
    var h = (d + Math.floor(13 * (mm + 1) / 5) + K + Math.floor(K / 4) + Math.floor(J / 4) - 2 * J) % 7;
    h = ((h % 7) + 7) % 7;
    return (h + 6) % 7;
  }

  var kb = document.getElementById('kb');
  var grid = document.getElementById('kbGrid');
  var ring = document.getElementById('kbRing');

  var n = daysInMonth(BASE.y, BASE.m);
  var lead = dow(BASE.y, BASE.m, 1);
  var cellByDay = {};
  var i, cell;
  for (i = 0; i < lead; i++) {
    cell = document.createElement('span');
    cell.className = 'kb__cell kb__cell--out';
    grid.appendChild(cell);
  }
  for (var d = 1; d <= n; d++) {
    cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'kb__cell';
    cell.textContent = String(d);
    cell.dataset.day = String(d);
    cell.tabIndex = d === BASE.d ? 0 : -1;
    grid.appendChild(cell);
    cellByDay[d] = cell;
  }
  var trail = CELL_TOTAL - lead - n;
  for (i = 0; i < trail; i++) {
    cell = document.createElement('span');
    cell.className = 'kb__cell kb__cell--out';
    grid.appendChild(cell);
  }

  var focusedDay = BASE.d;
  var ringMeasured = false;

  function moveRingTo(cellEl) {
    // 계산 겹: 셀의 실제 렌더 좌표·크기를 실측해 링을 그 자리로 옮긴다(좌표 lerp 이동)
    var cr = cellEl.getBoundingClientRect();
    var gr = grid.getBoundingClientRect();
    if (!ringMeasured) {
      ring.style.width = cr.width + 'px';
      ring.style.height = cr.height + 'px';
      ringMeasured = true;
    }
    ring.style.transform = 'translate(' + (cr.left - gr.left) + 'px,' + (cr.top - gr.top) + 'px)';
  }

  grid.addEventListener('focusin', function (e) {
    var cellEl = e.target.closest('.kb__cell');
    if (!cellEl || !cellEl.dataset.day) return;
    moveRingTo(cellEl);
  });

  function focusDay(target) {
    if (target < 1) target = 1;
    if (target > n) target = n;
    var prev = cellByDay[focusedDay];
    if (prev) prev.tabIndex = -1;
    focusedDay = target;
    var next = cellByDay[focusedDay];
    next.tabIndex = 0;
    next.focus({ preventScroll: true });
  }

  function human() {
    kb.classList.remove('is-demo');
    stopAutoplay();
  }

  grid.addEventListener('keydown', function (e) {
    var delta = 0;
    if (e.key === 'ArrowRight') delta = 1;
    else if (e.key === 'ArrowLeft') delta = -1;
    else if (e.key === 'ArrowDown') delta = 7;
    else if (e.key === 'ArrowUp') delta = -7;
    else return;
    e.preventDefault();
    human();
    focusDay(focusedDay + delta);
  });
  grid.addEventListener('click', function (e) {
    var cellEl = e.target.closest('.kb__cell');
    if (!cellEl || !cellEl.dataset.day) return;
    human();
    focusDay(parseInt(cellEl.dataset.day, 10));
  });

  var seqIdx = 0;
  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  function tick() {
    seqIdx = (seqIdx + 1) % FOCUS_SEQ.length;
    focusDay(FOCUS_SEQ[seqIdx]);
  }

  cellByDay[BASE.d].focus({ preventScroll: true });
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(tick, 500); }
})();
</script>
</main>
</body>
</html>
