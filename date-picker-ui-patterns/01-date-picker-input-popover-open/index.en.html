<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Popover Toggle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dp is-demo" id="dp">
  <button type="button" class="dp__field" id="dpField" aria-haspopup="dialog" aria-expanded="false">
    <span class="dp__fieldLabel">Check-in date</span>
    <span class="dp__fieldValue" id="dpValue">2026-03-14</span>
  </button>
  <div class="dp__pop" id="dpPop" role="dialog" aria-label="Calendar" aria-hidden="true">
    <div class="dp__head"><span class="dp__label">March 2026</span></div>
    <div class="dp__weekday" aria-hidden="true">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div class="dp__grid" id="dpGrid"></div>
  </div>
</div>
<script>
(function () {
  var BASE = { y: 2026, m: 3, d: 14 }; // 계산 겹 상수: 고정 오늘(Mon 1~12), new Date() 미사용
  function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
  function daysInMonth(y, m) {
    var t = [31, isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    return t[m - 1];
  }
  function dow(y, m, d) { // Zeller 합동식 — 0=Sun ~ 6=Sat
    var yy = y, mm = m;
    if (mm < 3) { yy -= 1; mm += 12; }
    var K = yy % 100, J = Math.floor(yy / 100);
    var h = (d + Math.floor(13 * (mm + 1) / 5) + K + Math.floor(K / 4) + Math.floor(J / 4) - 2 * J) % 7;
    h = ((h % 7) + 7) % 7;
    return (h + 6) % 7;
  }

  var ANCHOR_GAP = 8; // 계산 겹: 필드 아래 팝오버 간격(px)
  var dp = document.getElementById('dp');
  var field = document.getElementById('dpField');
  var pop = document.getElementById('dpPop');
  var grid = document.getElementById('dpGrid');

  var n = daysInMonth(BASE.y, BASE.m);
  var lead = dow(BASE.y, BASE.m, 1);
  for (var i = 0; i < lead; i++) {
    var blank = document.createElement('span');
    blank.className = 'dp__cell dp__cell--out';
    grid.appendChild(blank);
  }
  for (var d = 1; d <= n; d++) {
    var cell = document.createElement('span');
    cell.className = 'dp__cell';
    cell.textContent = String(d);
    if (d === BASE.d) cell.classList.add('dp__cell--today');
    grid.appendChild(cell);
  }

  function measureAnchor() {
    // 계산 겹: 실측 위치 — 필드의 실제 렌더 폭·좌표를 읽어 팝오버를 그 자리에 앵커한다
    var fr = field.getBoundingClientRect();
    var pr = dp.getBoundingClientRect();
    pop.style.left = (fr.left - pr.left) + 'px';
    pop.style.top = (fr.bottom - pr.top + ANCHOR_GAP) + 'px';
    pop.style.width = fr.width + 'px';
  }

  function setOpen(v) {
    dp.classList.toggle('dp--open', v);
    field.setAttribute('aria-expanded', v ? 'true' : 'false');
    pop.setAttribute('aria-hidden', v ? 'false' : 'true');
    if (v) measureAnchor();
  }

  function human() {
    dp.classList.remove('is-demo');
    stopAutoplay();
    setOpen(!dp.classList.contains('dp--open'));
  }
  field.addEventListener('click', human);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && dp.classList.contains('dp--open')) { human(); }
  });
  document.addEventListener('click', function (e) {
    if (dp.classList.contains('dp--open') && !dp.contains(e.target)) { human(); }
  });

  var open = false;
  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setOpen(false);
  if (!reduce) {
    autoTimer = setInterval(function () {
      open = !open;
      setOpen(open);
    }, 1400);
  }
})();
</script>
</main>
</body>
</html>
