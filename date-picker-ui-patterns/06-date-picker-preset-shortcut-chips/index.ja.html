<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プリセットショートカットチップ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ps is-demo" id="ps">
  <div class="ps__chips" id="psChips"></div>
  <div class="ps__head"><span class="ps__label">2026年3月</span></div>
  <div class="ps__weekday" aria-hidden="true">
    <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
  </div>
  <div class="ps__grid" id="psGrid"></div>
</div>
<script>
(function () {
  var BASE = { y: 2026, m: 3, d: 14 }; // 계산 겹 상수: 고정 오늘, new Date() 미사용
  var CELL_TOTAL = 42;
  var STAGGER = 28; // ms, 계산 겹: 범위 시작에서 이 셀까지의 위치 x STAGGER = 전환 지연
  var PRESETS = [
    { id: 'week', label: '今週', start: 8, end: 14 },
    { id: 'next7', label: '次の7日間', start: 14, end: 20 },
    { id: 'month', label: '今月', start: 1, end: 31 }
  ];

  function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
  function daysInMonth(y, m) {
    var t = [31, isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    return t[m - 1];
  }
  function dow(y, m, d) { // Zeller 합동식 — 0=日 ~ 6=土
    var yy = y, mm = m;
    if (mm < 3) { yy -= 1; mm += 12; }
    var K = yy % 100, J = Math.floor(yy / 100);
    var h = (d + Math.floor(13 * (mm + 1) / 5) + K + Math.floor(K / 4) + Math.floor(J / 4) - 2 * J) % 7;
    h = ((h % 7) + 7) % 7;
    return (h + 6) % 7;
  }

  var ps = document.getElementById('ps');
  var chipsWrap = document.getElementById('psChips');
  var grid = document.getElementById('psGrid');
  var n = daysInMonth(BASE.y, BASE.m);
  var lead = dow(BASE.y, BASE.m, 1);
  var trail = CELL_TOTAL - lead - n;
  var cellByDay = {};
  var i, cell;

  for (i = 0; i < lead; i++) {
    cell = document.createElement('span');
    cell.className = 'ps__cell ps__cell--out';
    grid.appendChild(cell);
  }
  for (var d = 1; d <= n; d++) {
    cell = document.createElement('span');
    cell.className = 'ps__cell';
    cell.textContent = String(d);
    grid.appendChild(cell);
    cellByDay[d] = cell;
  }
  for (i = 0; i < trail; i++) {
    cell = document.createElement('span');
    cell.className = 'ps__cell ps__cell--out';
    grid.appendChild(cell);
  }

  var chipEls = PRESETS.map(function (p, idx) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'ps__chip';
    b.textContent = p.label;
    b.addEventListener('click', function () { human(); applyPreset(idx); });
    chipsWrap.appendChild(b);
    return b;
  });

  function applyPreset(idx) {
    // 계산 겹: 선택 범위 시작으로부터의 위치(pos)만큼 전환 지연을 매겨 순차 채움을 만든다
    var p = PRESETS[idx];
    for (var day = 1; day <= n; day++) {
      var c = cellByDay[day];
      var inRange = day >= p.start && day <= p.end;
      if (inRange) {
        var pos = day - p.start;
        c.style.transitionDelay = (pos * STAGGER) + 'ms';
      } else {
        c.style.transitionDelay = '0ms';
      }
      c.classList.toggle('ps__cell--on', inRange);
    }
    chipEls.forEach(function (el, i2) { el.classList.toggle('ps__chip--active', i2 === idx); });
  }

  function human() {
    ps.classList.remove('is-demo');
    stopAutoplay();
  }

  var seqIdx = -1;
  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  function tick() {
    seqIdx = (seqIdx + 1) % PRESETS.length;
    applyPreset(seqIdx);
  }

  tick();
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(tick, 650); }
})();
</script>
</main>
</body>
</html>
