<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>モバイルシート切替 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ms is-demo" id="ms">
  <div class="ms__viewport" id="msViewport">
    <button type="button" class="ms__field" id="msField">
      <span class="ms__fieldLabel">日付</span>
      <span class="ms__fieldValue">2026年3月14日</span>
    </button>
    <div class="ms__panel" id="msPanel">
      <div class="ms__panelHead">2026年3月</div>
      <div class="ms__strip">
        <span class="ms__day">12</span><span class="ms__day">13</span><span class="ms__day ms__day--today">14</span><span class="ms__day">15</span><span class="ms__day">16</span>
      </div>
    </div>
  </div>
  <button type="button" class="ms__toggle" id="msToggle">幅切替</button>
</div>
<script>
(function () {
  var THRESHOLD = 140; // px, 계산 겹: 이 폭 미만이면 바텀시트로 본다

  var ms = document.getElementById('ms');
  var viewport = document.getElementById('msViewport');
  var field = document.getElementById('msField');
  var panel = document.getElementById('msPanel');
  var toggleBtn = document.getElementById('msToggle');

  var wide = true;
  var open = false;

  function measureMode() {
    // 계산 겹: 뷰포트 요소의 실제 렌더 폭을 실측해 팝오버/시트 형태를 고른다
    var w = viewport.getBoundingClientRect().width;
    return w < THRESHOLD ? 'sheet' : 'popover';
  }

  function render() {
    var mode = measureMode();
    panel.classList.toggle('ms--open', open);
    panel.classList.toggle('ms__panel--sheet', mode === 'sheet');
    panel.classList.toggle('ms__panel--popover', mode === 'popover');
  }

  function human() {
    ms.classList.remove('is-demo');
    stopAutoplay();
  }

  field.addEventListener('click', function () {
    human();
    open = !open;
    render();
  });
  toggleBtn.addEventListener('click', function () {
    human();
    wide = !wide;
    viewport.classList.toggle('ms__viewport--narrow', !wide);
    open = true;
    render();
  });

  var steps = [
    function () { wide = true; viewport.classList.remove('ms__viewport--narrow'); open = true; },
    function () { wide = false; viewport.classList.add('ms__viewport--narrow'); open = true; },
    function () { open = false; },
    function () { wide = true; viewport.classList.remove('ms__viewport--narrow'); open = true; },
    function () { wide = false; viewport.classList.add('ms__viewport--narrow'); open = true; },
    function () { open = false; }
  ];
  var stepIdx = -1;
  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  function tick() {
    stepIdx = (stepIdx + 1) % steps.length;
    steps[stepIdx]();
    render();
  }

  render();
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(tick, 620); }
})();
</script>
</main>
</body>
</html>
