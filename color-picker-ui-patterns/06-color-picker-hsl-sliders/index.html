<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSL 슬라이더 컬러피커 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="preview" id="preview"></div>
  <div class="row">
    <span class="rowLabel">색조</span>
    <div class="track hueTrack" id="hTrack">
      <div class="thumb" id="hThumb" role="slider" aria-label="색조" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0"></div>
    </div>
  </div>
  <div class="row">
    <span class="rowLabel">채도</span>
    <div class="track" id="sTrack">
      <div class="thumb" id="sThumb" role="slider" aria-label="채도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    </div>
  </div>
  <div class="row">
    <span class="rowLabel">명도</span>
    <div class="track" id="lTrack">
      <div class="thumb" id="lThumb" role="slider" aria-label="명도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    </div>
  </div>
</section>
</main>
<script>
// HSL 슬라이더(06) — 색조 슬라이더 값이 바뀔 때마다 채도·명도 트랙의 배경 그라디언트를
// GRADIENT_STEPS 개 정지점으로 다시 계산해 그린다. 실키·실서버 요청 없음.
(function () {
  var previewEl = document.getElementById('preview');
  var hTrack = document.getElementById('hTrack');
  var sTrack = document.getElementById('sTrack');
  var lTrack = document.getElementById('lTrack');
  var hThumb = document.getElementById('hThumb');
  var sThumb = document.getElementById('sThumb');
  var lThumb = document.getElementById('lThumb');
  if (!previewEl || !hTrack || !sTrack || !lTrack || !hThumb || !sThumb || !lThumb) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var CYCLE_MS = 3000;
  var TRACK_W = 156;
  var GRADIENT_STEPS = 20;

  function buildGradient(stopFn) {
    var stops = [];
    for (var i = 0; i < GRADIENT_STEPS; i++) {
      var ratio = i / (GRADIENT_STEPS - 1);
      stops.push(stopFn(ratio) + ' ' + (ratio * 100).toFixed(1) + '%');
    }
    return 'linear-gradient(to right, ' + stops.join(', ') + ')';
  }

  function setThumb(thumbEl, ratio) {
    var x = ratio * TRACK_W;
    thumbEl.style.transform = 'translate(calc(-50% + ' + x.toFixed(2) + 'px), -50%)';
  }

  function apply(t) {
    var p = t / CYCLE_MS;
    var hue = (p * 360) % 360;
    var sat = 55 + Math.sin(p * Math.PI * 2 * 1.3) * 35;
    var light = 50 + Math.sin(p * Math.PI * 2 * .9 + 1) * 25;

    setThumb(hThumb, hue / 360);
    setThumb(sThumb, sat / 100);
    setThumb(lThumb, light / 100);

    sTrack.style.background = buildGradient(function (r) {
      return 'hsl(' + hue.toFixed(1) + 'deg ' + (r * 100).toFixed(1) + '% 50%)';
    });
    lTrack.style.background = buildGradient(function (r) {
      return 'hsl(' + hue.toFixed(1) + 'deg ' + sat.toFixed(1) + '% ' + (r * 100).toFixed(1) + '%)';
    });
    previewEl.style.background = 'hsl(' + hue.toFixed(1) + 'deg ' + sat.toFixed(1) + '% ' + light.toFixed(1) + '%)';

    hThumb.setAttribute('aria-valuenow', String(Math.round(hue)));
    sThumb.setAttribute('aria-valuenow', String(Math.round(sat)));
    lThumb.setAttribute('aria-valuenow', String(Math.round(light)));
  }

  if (reduce) {
    apply(0);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
