<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스포이드 컬러피커 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="screenWrap">
    <canvas class="screen" id="screen" width="160" height="90" aria-hidden="true"></canvas>
    <div class="loupe" id="loupe"></div>
  </div>
  <div class="preview" id="preview">
    <span class="hex" id="hex">#000000</span>
  </div>
</section>
</main>
<script>
// 스포이드(08) — 캔버스에서 커서 위치의 실제 픽셀 값을 getImageData 로 추출해
// 밝기 값을 계산하고, 그 값에 따라 プレビュー 글자색과 테두리 두께를 함께 다시 정한다.
// 브라우저 EyeDropper API 는 지원 범위가 좁아 쓰지 않는다 — 캔버스 픽셀 샘플링 시뮬레이션.
// 실키·실서버 요청 없음.
(function () {
  var screenEl = document.getElementById('screen');
  var loupeEl = document.getElementById('loupe');
  var previewEl = document.getElementById('preview');
  var hexEl = document.getElementById('hex');
  if (!screenEl || !loupeEl || !previewEl || !hexEl || !screenEl.getContext) return;
  var ctx = screenEl.getContext('2d');
  if (!ctx) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var CANVAS_W = 160;
  var CANVAS_H = 90;
  var CYCLE_MS = 2600;
  var MIN_BORDER = 1;
  var MAX_BORDER = 6;

  var BANDS = [
    { x0: 0, x1: 40, h: 10, s: 70, l: 55 },
    { x0: 40, x1: 80, h: 150, s: 50, l: 30 },
    { x0: 80, x1: 120, h: 200, s: 60, l: 70 },
    { x0: 120, x1: 160, h: 280, s: 45, l: 45 }
  ];

  BANDS.forEach(function (b) {
    ctx.fillStyle = 'hsl(' + b.h + 'deg ' + b.s + '% ' + b.l + '%)';
    ctx.fillRect(b.x0, 0, b.x1 - b.x0, CANVAS_H);
  });

  function toHex(n) {
    return n.toString(16).padStart(2, '0');
  }

  function apply(t) {
    var p = (t / CYCLE_MS) % 1;
    var triangle = p < .5 ? p * 2 : (1 - p) * 2;
    var x = 8 + triangle * (CANVAS_W - 16);
    var y = CANVAS_H / 2 + Math.sin(p * Math.PI * 4) * (CANVAS_H / 2 - 6);
    var xi = Math.max(0, Math.min(CANVAS_W - 1, Math.round(x)));
    var yi = Math.max(0, Math.min(CANVAS_H - 1, Math.round(y)));

    var pixel = ctx.getImageData(xi, yi, 1, 1).data;
    var r = pixel[0], g = pixel[1], b = pixel[2];
    var hex = '#' + toHex(r) + toHex(g) + toHex(b);
    var brightness = (r * 299 + g * 587 + b * 114) / 1000;
    var ink = brightness > 150;
    var borderPx = MIN_BORDER + (brightness / 255) * (MAX_BORDER - MIN_BORDER);

    loupeEl.style.transform = 'translate(-50%, -50%) translate(' + x.toFixed(2) + 'px, ' + y.toFixed(2) + 'px)';
    previewEl.style.background = hex;
    previewEl.style.borderWidth = borderPx.toFixed(1) + 'px';
    previewEl.classList.toggle('is-ink', ink);
    hexEl.textContent = hex;
  }

  if (reduce) {
    apply(0);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
