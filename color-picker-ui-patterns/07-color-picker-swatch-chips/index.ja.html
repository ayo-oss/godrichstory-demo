<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스와치 칩 컬러피커 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel" role="radiogroup" aria-label="カラースウォッチ">
  <span class="chip" data-i="0" role="radio" aria-checked="false" aria-label="スウォッチ1">
    <span class="check"></span>
  </span>
  <span class="chip" data-i="1" role="radio" aria-checked="false" aria-label="スウォッチ2">
    <span class="check"></span>
  </span>
  <span class="chip" data-i="2" role="radio" aria-checked="false" aria-label="スウォッチ3">
    <span class="check"></span>
  </span>
  <span class="chip" data-i="3" role="radio" aria-checked="false" aria-label="スウォッチ4">
    <span class="check"></span>
  </span>
  <span class="chip" data-i="4" role="radio" aria-checked="false" aria-label="スウォッチ5">
    <span class="check"></span>
  </span>
  <span class="chip" data-i="5" role="radio" aria-checked="false" aria-label="スウォッチ6">
    <span class="check"></span>
  </span>
</section>
<div class="readout" id="readout">
  <span class="hex" id="hex">#000000</span>
</div>
</main>
<script>
// 스와치 칩(07) — 각 칩 색의 밝기 값을 계산해, 밝은 색엔 어두운 체크 아이콘이
// 어두운 색엔 밝은 체크 아이콘이 뜨도록 대비를 매번 다시 맞춘다. 실키·실서버 요청 없음.
(function () {
  var panelEl = document.querySelector('.panel');
  var readoutEl = document.getElementById('readout');
  var hexEl = document.getElementById('hex');
  var chipEls = panelEl ? panelEl.querySelectorAll('.chip') : [];
  if (!panelEl || !readoutEl || !hexEl || chipEls.length !== 6) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var CYCLE_MS = 2400;
  var SWATCHES = [
    { h: 6, s: 78, l: 56 },
    { h: 46, s: 85, l: 62 },
    { h: 150, s: 45, l: 32 },
    { h: 200, s: 70, l: 46 },
    { h: 265, s: 40, l: 78 },
    { h: 320, s: 55, l: 22 }
  ];
  var ORDER = [0, 1, 2, 3, 4, 5, 0];
  var SEG_MS = CYCLE_MS / (ORDER.length - 1);

  function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    var k = function (n) { return (n + h / 30) % 12; };
    var a = s * Math.min(l, 1 - l);
    var f = function (n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };
    return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
  }

  function toHex(n) {
    return n.toString(16).padStart(2, '0');
  }

  var HEX = SWATCHES.map(function (c) {
    var rgb = hslToRgb(c.h, c.s, c.l);
    return { hex: '#' + toHex(rgb[0]) + toHex(rgb[1]) + toHex(rgb[2]), rgb: rgb };
  });

  SWATCHES.forEach(function (c, i) {
    chipEls[i].style.background = 'hsl(' + c.h + 'deg ' + c.s + '% ' + c.l + '%)';
  });

  function apply(t) {
    var idx = Math.min(ORDER.length - 2, Math.floor(t / SEG_MS));
    var frac = (t % SEG_MS) / SEG_MS;
    var selIndex = ORDER[frac < .5 ? idx : idx + 1];

    for (var i = 0; i < chipEls.length; i++) {
      var isSel = i === selIndex;
      var rgb = HEX[i].rgb;
      var brightness = (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000;
      var ink = brightness > 150;
      chipEls[i].classList.toggle('is-selected', isSel);
      chipEls[i].classList.toggle('is-ink', ink);
      chipEls[i].setAttribute('aria-checked', isSel ? 'true' : 'false');
    }

    hexEl.textContent = HEX[selIndex].hex;
    readoutEl.style.background = chipEls[selIndex].style.background;
    var selBrightness = (HEX[selIndex].rgb[0] * 299 + HEX[selIndex].rgb[1] * 587 + HEX[selIndex].rgb[2] * 114) / 1000;
    readoutEl.classList.toggle('is-ink', selBrightness > 150);
  }

  if (reduce) {
    apply(0);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
