<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows 스펙트럼 컬러피커 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="board">
    <div class="square" id="square" style="--hue:0" role="slider" aria-label="彩度・明度エリア" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="">
      <div class="squareMarker" id="squareMarker"></div>
    </div>
    <div class="hueStrip" id="hueStrip" role="slider" aria-label="色相" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0">
      <div class="hueMarker" id="hueMarker"></div>
    </div>
  </div>
  <div class="readout" id="readout">
    <span class="swatch" id="swatch"></span>
    <span class="hex" id="hex">#000000</span>
  </div>
</section>
</main>
<script>
// Windows 스펙트럼(03) — 사각 영역 안 지점의 가로·세로 비율을 彩度·명도로, 옆 막대 값을 색조로
// 각각 다시 구해 매 프레임 최종 색을 합성한다. 실키·실서버 요청 없음.
(function () {
  var squareEl = document.getElementById('square');
  var squareMarkerEl = document.getElementById('squareMarker');
  var hueStripEl = document.getElementById('hueStrip');
  var hueMarkerEl = document.getElementById('hueMarker');
  var readoutEl = document.getElementById('readout');
  var swatchEl = document.getElementById('swatch');
  var hexEl = document.getElementById('hex');
  if (!squareEl || !squareMarkerEl || !hueStripEl || !hueMarkerEl || !readoutEl || !swatchEl || !hexEl) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var CYCLE_MS = 2400;
  var SQUARE_W = 140;
  var SQUARE_H = 140;
  var STRIP_H = 140;

  var WAYPOINTS = [
    { x: .15, y: .85 },
    { x: .85, y: .15 },
    { x: .5, y: .5 },
    { x: .15, y: .15 },
    { x: .85, y: .85 },
    { x: .15, y: .85 }
  ];
  var SEG_MS = CYCLE_MS / (WAYPOINTS.length - 1);

  function pointAt(t) {
    var idx = Math.min(WAYPOINTS.length - 2, Math.floor(t / SEG_MS));
    var frac = (t % SEG_MS) / SEG_MS;
    var a = WAYPOINTS[idx];
    var b = WAYPOINTS[idx + 1];
    return { x: a.x + (b.x - a.x) * frac, y: a.y + (b.y - a.y) * frac };
  }

  function hsvToRgb(h, s, v) {
    s /= 100; v /= 100;
    var c = v * s;
    var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    var m = v - c;
    var r, g, b;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
  }

  function toHex(n) {
    return n.toString(16).padStart(2, '0');
  }

  function apply(t) {
    var p = (t / CYCLE_MS) % 1;
    var pt = pointAt(t);
    var hue = p * 360;
    var sat = pt.x * 100;
    var val = (1 - pt.y) * 100;

    var rgb = hsvToRgb(hue, sat, val);
    var hex = '#' + toHex(rgb[0]) + toHex(rgb[1]) + toHex(rgb[2]);
    var brightness = (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000;
    var ink = brightness > 150;

    squareEl.style.setProperty('--hue', hue.toFixed(1));
    squareMarkerEl.style.transform = 'translate(-50%, -50%) translate(' + (pt.x * SQUARE_W).toFixed(2) + 'px, ' + (pt.y * SQUARE_H).toFixed(2) + 'px)';
    hueMarkerEl.style.transform = 'translate(-50%, -50%) translateY(' + ((hue / 360) * STRIP_H).toFixed(2) + 'px)';

    swatchEl.style.background = hex;
    readoutEl.style.background = hex;
    readoutEl.classList.toggle('is-ink', ink);
    hexEl.textContent = hex;

    squareEl.setAttribute('aria-valuenow', String(Math.round(val)));
    squareEl.setAttribute('aria-valuetext', hex);
    hueStripEl.setAttribute('aria-valuenow', String(Math.round(hue)));
  }

  if (reduce) {
    apply(0);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
