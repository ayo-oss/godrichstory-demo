<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figma 패널 컬러피커 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="swatch" id="swatch"></div>
  <dl class="fields">
    <div class="field">
      <dt class="fieldLabel">HEX</dt>
      <dd class="fieldValue" id="hexField">#000000</dd>
    </div>
    <div class="field">
      <dt class="fieldLabel">RGB</dt>
      <dd class="fieldValue" id="rgbField">rgb(0, 0, 0)</dd>
    </div>
    <div class="field">
      <dt class="fieldLabel">HSL</dt>
      <dd class="fieldValue" id="hslField">hsl(0deg 0% 0%)</dd>
    </div>
  </dl>
</section>
</main>
<script>
// Figma 패널(05) — 하나의 색 값을 HEX·RGB·HSL 세 표기법으로 각각 다시 계산해,
// 세 필드가 항상 같은 색을 가리키도록 서로 맞춘다. 실키·실서버 요청 없음.
(function () {
  var swatchEl = document.getElementById('swatch');
  var hexField = document.getElementById('hexField');
  var rgbField = document.getElementById('rgbField');
  var hslField = document.getElementById('hslField');
  if (!swatchEl || !hexField || !rgbField || !hslField) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var CYCLE_MS = 2600;
  var PRESETS = [
    { h: 10, s: 72, l: 54 },
    { h: 70, s: 60, l: 48 },
    { h: 130, s: 55, l: 42 },
    { h: 190, s: 65, l: 50 },
    { h: 250, s: 60, l: 58 },
    { h: 310, s: 68, l: 52 },
    { h: 370, s: 72, l: 54 }
  ];
  var SEG_MS = CYCLE_MS / (PRESETS.length - 1);

  function hslToRgb(h, s, l) {
    h = h % 360;
    s /= 100; l /= 100;
    var k = function (n) { return (n + h / 30) % 12; };
    var a = s * Math.min(l, 1 - l);
    var f = function (n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };
    return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
  }

  function toHex(n) {
    return n.toString(16).padStart(2, '0');
  }

  function apply(t) {
    var idx = Math.min(PRESETS.length - 2, Math.floor(t / SEG_MS));
    var frac = (t % SEG_MS) / SEG_MS;
    var a = PRESETS[idx];
    var b = PRESETS[idx + 1];
    var h = a.h + (b.h - a.h) * frac;
    var s = a.s + (b.s - a.s) * frac;
    var l = a.l + (b.l - a.l) * frac;
    var hMod = h % 360;

    var rgb = hslToRgb(h, s, l);
    var hex = '#' + toHex(rgb[0]) + toHex(rgb[1]) + toHex(rgb[2]);
    var hslStr = 'hsl(' + hMod.toFixed(0) + 'deg ' + s.toFixed(0) + '% ' + l.toFixed(0) + '%)';
    var rgbStr = 'rgb(' + rgb[0] + ', ' + rgb[1] + ', ' + rgb[2] + ')';

    swatchEl.style.background = hslStr;
    hexField.textContent = hex;
    rgbField.textContent = rgbStr;
    hslField.textContent = hslStr;
  }

  if (reduce) {
    apply(0);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
