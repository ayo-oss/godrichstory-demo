<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material 슬라이더 컬러피커 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <div class="preview" id="preview">
    <span class="previewLabel">미리보기</span>
  </div>
  <div class="sliders">
    <div class="row">
      <span class="rowLabel">색상</span>
      <div class="track">
        <div class="fill fillHue" id="fillH"></div>
        <div class="thumb" id="thumbH" role="slider" aria-label="색상" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0"></div>
      </div>
    </div>
    <div class="row">
      <span class="rowLabel">채도</span>
      <div class="track">
        <div class="fill fillSat" id="fillS"></div>
        <div class="thumb" id="thumbS" role="slider" aria-label="채도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      </div>
    </div>
    <div class="row">
      <span class="rowLabel">명도</span>
      <div class="track">
        <div class="fill fillLight" id="fillL"></div>
        <div class="thumb" id="thumbL" role="slider" aria-label="명도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      </div>
    </div>
  </div>
</section>
</main>
<script>
// Material 슬라이더(02) — 색조·채도·명도 세 손잡이의 트랙 위치 비율을 각각 다시 구하고,
// 세 값을 합쳐 미리보기 색을 매 프레임 다시 계산한다. 실키·실서버 요청 없음.
(function () {
  var previewEl = document.getElementById('preview');
  var thumbH = document.getElementById('thumbH');
  var thumbS = document.getElementById('thumbS');
  var thumbL = document.getElementById('thumbL');
  var fillH = document.getElementById('fillH');
  var fillS = document.getElementById('fillS');
  var fillL = document.getElementById('fillL');
  if (!previewEl || !thumbH || !thumbS || !thumbL || !fillH || !fillS || !fillL) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var CYCLE_MS = 2000;
  var TRACK_W = 156;

  function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    var k = function (n) { return (n + h / 30) % 12; };
    var a = s * Math.min(l, 1 - l);
    var f = function (n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };
    return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
  }

  function valuesAt(t) {
    var p = t / CYCLE_MS;
    var h, s, l;
    if (p < 1 / 3) {
      var local = p / (1 / 3);
      h = local * 360; s = 60; l = 50;
    } else if (p < 2 / 3) {
      var local2 = (p - 1 / 3) / (1 / 3);
      h = 360; s = 20 + local2 * 70; l = 50;
    } else {
      var local3 = (p - 2 / 3) / (1 / 3);
      h = 360; s = 90; l = 20 + local3 * 60;
    }
    return { h: h % 360, s: s, l: l };
  }

  function setThumb(thumbEl, fillEl, ratio) {
    var x = ratio * TRACK_W;
    thumbEl.style.transform = 'translate(calc(-50% + ' + x.toFixed(2) + 'px), -50%)';
    fillEl.style.transform = 'scaleX(' + ratio.toFixed(4) + ')';
  }

  function apply(t) {
    var v = valuesAt(t);
    setThumb(thumbH, fillH, v.h / 360);
    setThumb(thumbS, fillS, v.s / 100);
    setThumb(thumbL, fillL, v.l / 100);

    var rgb = hslToRgb(v.h, v.s, v.l);
    var brightness = (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000;
    previewEl.style.background = 'hsl(' + v.h.toFixed(1) + 'deg ' + v.s.toFixed(1) + '% ' + v.l.toFixed(1) + '%)';
    previewEl.classList.toggle('is-ink', brightness > 150);

    thumbH.setAttribute('aria-valuenow', Math.round(v.h));
    thumbS.setAttribute('aria-valuenow', Math.round(v.s));
    thumbL.setAttribute('aria-valuenow', Math.round(v.l));
  }

  if (reduce) {
    apply(0);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
