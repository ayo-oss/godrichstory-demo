<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>固定シードのノイズでぎざぎざに切った破れ紙の境目 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dv is-demo" id="dvRoot">
  <div class="dv__paper" role="separator">
    <div class="dv__sheet" id="dvSheet"></div>
  </div>
  <div class="dv__bar">
  <button class="dv__btn" id="dvBtn" type="button">もう一度破る</button>
  <p class="dv__meta"><span class="dv__tag">TORN_SEED</span> <b id="dvSeed">0</b></p>
  </div>
</div>
</main>
<script>
(function () {
  // 기법: 직접 구현한 시드 난수(mulberry32)로 값 표를 한 번 만들고, 큰 굴곡(4칸마다 보간)과 칸별 잔떨림을 섞어 꼭짓점 높이를 정한다.
  // 같은 TORN_SEED 이면 새로고침해도 같은 모양이다. 찢김은 왼쪽에서 오른쪽으로 progress 만큼 진행한다.
  var TORN_SEED = 20261008;
  var TORN_STEP = 9;
  var TORN_AMP = 20;
  var BASE_Y = 48;
  var START_MS = 200;
  var TEAR_MS = 1400;
  var CYCLE_MS = 2000;

  var root = document.getElementById('dvRoot');
  var sheet = document.getElementById('dvSheet');
  var btn = document.getElementById('dvBtn');
  var seedEl = document.getElementById('dvSeed');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(TORN_SEED);
  var table = [];
  var i;
  for (i = 0; i < 256; i += 1) table.push(rand());

  function smooth(t) { return t * t * (3 - 2 * t); }
  function noiseAt(k) {
    var big = k / 4;
    var i0 = Math.floor(big);
    var f = smooth(big - i0);
    var coarse = table[i0 % 256] * (1 - f) + table[(i0 + 1) % 256] * f;
    var fine = table[(k * 7 + 3) % 256];
    return 0.65 * coarse + 0.35 * fine;
  }

  var progress = 0;
  function paint() {
    var count = Math.max(8, Math.ceil(sheet.clientWidth / TORN_STEP));
    var pts = ['0 0', '100% 0'];
    var edge = [];
    for (var k = 0; k <= count; k += 1) {
      var xr = k / count;
      var y = xr <= progress ? BASE_Y + TORN_AMP * noiseAt(k) : BASE_Y + TORN_AMP * 0.5;
      edge.push((xr * 100).toFixed(2) + '% ' + y.toFixed(1) + 'px');
    }
    edge.reverse();
    sheet.style.clipPath = 'polygon(' + pts.concat(edge).join(',') + ')';
  }
  function stopDemo() { root.classList.remove('is-demo'); }

  var restartAt = null;
  btn.addEventListener('click', function () {
    stopDemo();
    if (reduce) { progress = 1; paint(); return; }
    restartAt = -1;
  });

  var t0 = null;
  function tick(ts) {
    if (t0 === null) t0 = ts;
    var local = null;
    if (restartAt === -1) restartAt = ts;
    if (root.classList.contains('is-demo')) local = (ts - t0) % CYCLE_MS;
    else if (restartAt !== null) local = ts - restartAt;
    if (local !== null) {
      progress = Math.min(1, Math.max(0, (local - START_MS) / TEAR_MS));
      paint();
    }
    requestAnimationFrame(tick);
  }

  seedEl.textContent = String(TORN_SEED);
  if (reduce) {
    stopDemo();
    progress = 1;
    paint();
  } else {
    paint();
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
