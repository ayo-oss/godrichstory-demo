<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사인 두 겹을 더해 만든 파도 섹션 경계 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dv is-demo" id="dvRoot">
  <svg class="dv__svg" id="dvSvg" viewBox="0 0 320 110" aria-hidden="true" focusable="false">
    <rect class="dv__under" x="0" y="0" width="320" height="110"></rect>
    <path class="dv__over" id="dvPath" d="M0 0H320V55H0Z"></path>
  </svg>
  <div class="dv__bar">
  <button class="dv__btn" id="dvBtn" type="button">파도 겹 수 바꾸기</button>
  <p class="dv__meta"><span class="dv__tag">WAVE_LAYERS</span> <b id="dvLayers">2</b></p>
  </div>
</div>
</main>
<script>
(function () {
  // 기법: 경계 높이 y(x) = BASE_Y + 각 겹(진폭 * sin(2π x / 주기 + 위상 * 속도배수))의 합. 두 주기를 일부러 서로 약분되지 않게 잡아 반복이 덜 보인다.
  // 점을 STEP_PX 간격으로 찍어 SVG path 의 d 를 직접 만든다.
  var WAVE_LAYERS = 2;
  var WAVE_AMP = [16, 9, 5];
  var WAVE_PERIOD = [190, 83, 47];
  var WAVE_SPEED = [1, 1.7, 2.3];
  var BASE_Y = 62;
  var VIEW_W = 320;
  var STEP_PX = 4;
  var RATE_RAD_PER_S = 2.4;

  var root = document.getElementById('dvRoot');
  var pathEl = document.getElementById('dvPath');
  var btn = document.getElementById('dvBtn');
  var layersEl = document.getElementById('dvLayers');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var phase = 0;

  function edgeY(x) {
    var y = BASE_Y;
    for (var i = 0; i < WAVE_LAYERS; i += 1) {
      y += WAVE_AMP[i] * Math.sin(2 * Math.PI * x / WAVE_PERIOD[i] + phase * WAVE_SPEED[i]);
    }
    return y;
  }
  function draw() {
    var d = 'M0 0H' + VIEW_W + 'V' + edgeY(VIEW_W).toFixed(1);
    for (var x = VIEW_W - STEP_PX; x >= 0; x -= STEP_PX) d += 'L' + x + ' ' + edgeY(x).toFixed(1);
    d += 'L0 ' + edgeY(0).toFixed(1) + 'Z';
    pathEl.setAttribute('d', d);
    layersEl.textContent = String(WAVE_LAYERS);
  }
  function stopDemo() { root.classList.remove('is-demo'); }

  btn.addEventListener('click', function () {
    WAVE_LAYERS = WAVE_LAYERS % 3 + 1;
    draw();
  });

  var lastTs = null;
  function tick(ts) {
    var dt = lastTs === null ? 0.016 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if (root.classList.contains('is-demo')) {
      phase += RATE_RAD_PER_S * dt;
      draw();
    }
    requestAnimationFrame(tick);
  }

  draw();
  if (reduce) {
    stopDemo();
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
