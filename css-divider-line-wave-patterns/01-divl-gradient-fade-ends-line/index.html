<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>양 끝이 투명하게 사라지는 기본 구분선 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dv is-demo" id="dvRoot">
  <p class="dv__block">위 단락</p>
  <div class="dv__rail">
    <div class="dv__glow" id="dvGlow"></div>
    <div class="dv__line" id="dvLine" role="separator"></div>
  </div>
  <p class="dv__block">아래 단락</p>
  <label class="dv__ctrl">
    <span>사라지는 구간</span>
    <input type="range" id="dvRange" min="0" max="50" value="30">
  </label>
  <p class="dv__meta"><span class="dv__tag">FADE_PCT</span> <b id="dvPct">30</b>%</p>
</div>
</main>
<script>
(function () {
  // 기법: 선 색의 알파를 양 끝 FADE_PCT% 구간에서만 0 에서 1 로 올린다.
  // 직선 보간은 선이 시작하는 곳에 띠가 보여서 smoothstep(3t^2 - 2t^3) 곡선으로 8단계 정지점을 직접 만든다.
  var FADE_PCT = 30;
  var LINE_H_PX = 20;
  var STEPS = 8;
  var CYCLE_MS = 2000;
  var LOW_PCT = 6;
  var HIGH_PCT = 50;
  var RGB = '185,160,255';

  var root = document.getElementById('dvRoot');
  var line = document.getElementById('dvLine');
  var glow = document.getElementById('dvGlow');
  var range = document.getElementById('dvRange');
  var pctEl = document.getElementById('dvPct');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function gradientOf(pct) {
    var stops = [];
    var i;
    for (i = 0; i <= STEPS; i += 1) {
      var t = i / STEPS;
      var a = t * t * (3 - 2 * t);
      stops.push('rgba(' + RGB + ',' + a.toFixed(3) + ') ' + (pct * t).toFixed(2) + '%');
    }
    for (i = STEPS; i >= 0; i -= 1) {
      var u = i / STEPS;
      var b = u * u * (3 - 2 * u);
      stops.push('rgba(' + RGB + ',' + b.toFixed(3) + ') ' + (100 - pct * u).toFixed(2) + '%');
    }
    return 'linear-gradient(90deg,' + stops.join(',') + ')';
  }
  function paint(pct) {
    var g = gradientOf(pct);
    line.style.background = g;
    glow.style.background = g;
    pctEl.textContent = String(Math.round(pct));
    range.value = String(Math.round(pct));
  }
  function stopDemo() { root.classList.remove('is-demo'); }

  range.addEventListener('input', function () {
    stopDemo();
    FADE_PCT = Number(range.value);
    paint(FADE_PCT);
  });

  var t0 = null;
  function tick(ts) {
    if (t0 === null) t0 = ts;
    if (root.classList.contains('is-demo')) {
      var phase = ((ts - t0) % CYCLE_MS) / CYCLE_MS;
      var wave = 0.5 - 0.5 * Math.cos(phase * Math.PI * 2);
      paint(LOW_PCT + (HIGH_PCT - LOW_PCT) * wave);
    }
    requestAnimationFrame(tick);
  }

  line.style.height = LINE_H_PX + 'px';
  paint(FADE_PCT);
  if (reduce) {
    stopDemo();
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
