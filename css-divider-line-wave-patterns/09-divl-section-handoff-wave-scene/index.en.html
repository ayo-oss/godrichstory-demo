<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divider Scene Handing One Section to the Next Over a Wave — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dv is-demo" id="dvRoot">
  <div class="dv__scroller" id="dvScroller" tabindex="0" aria-label="Scroll area">
    <section class="dv__sec dv__sec--a">
      <p class="dv__title">First section</p>
    </section>
    <svg class="dv__wave" id="dvWave" viewBox="0 0 320 72" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <path class="dv__fill" id="dvFill" d="M0 0H320V36H0Z"></path>
      <path class="dv__edge" id="dvEdge" d="M0 36H320" pathLength="1"></path>
    </svg>
    <section class="dv__sec dv__sec--b">
      <div class="dv__bleed" id="dvBleed"></div>
      <p class="dv__title">Next section</p>
    </section>
  </div>
  <p class="dv__meta"><span class="dv__tag">PHASE</span> <b id="dvPhase">0</b><span>rad</span></p>
</div>
</main>
<script>
(function () {
  // 기법: 스크롤 위치 scrollTop 이 파도 위상(scrollTop * WAVE_PHASE_PER_PX)을 밀고, 같은 값의 비율이 경계선을 그려 나간다(stroke-dashoffset).
  // 위 섹션 색은 아래 섹션 높이의 BLEED_PCT% 까지 투명해지며 번지고, 번지는 정도도 같은 진행도(0~1)에서 나온다.
  var WAVE_PHASE_PER_PX = 0.07;
  var BLEED_PCT = 60;
  var SCROLL_SHARE = 0.62;
  var DRAW_RANGE_PX = 90;
  var WAVE_AMP = [11, 6];
  var WAVE_PERIOD = [150, 61];
  var WAVE_SPEED = [1, 1.6];
  var BASE_Y = 34;
  var VIEW_W = 320;
  var STEP_PX = 4;
  var CYCLE_MS = 2000;

  var root = document.getElementById('dvRoot');
  var scroller = document.getElementById('dvScroller');
  var wave = document.getElementById('dvWave');
  var fill = document.getElementById('dvFill');
  var edge = document.getElementById('dvEdge');
  var bleed = document.getElementById('dvBleed');
  var phaseEl = document.getElementById('dvPhase');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function edgeY(x, phase) {
    var y = BASE_Y;
    for (var i = 0; i < WAVE_AMP.length; i += 1) {
      y += WAVE_AMP[i] * Math.sin(2 * Math.PI * x / WAVE_PERIOD[i] + phase * WAVE_SPEED[i]);
    }
    return y;
  }
  function pathOf(phase) {
    var pts = [];
    for (var x = 0; x <= VIEW_W; x += STEP_PX) pts.push(x + ' ' + edgeY(x, phase).toFixed(1));
    return pts;
  }
  function update() {
    var top = scroller.scrollTop;
    var phase = top * WAVE_PHASE_PER_PX;
    var pts = pathOf(phase);
    fill.setAttribute('d', 'M0 0H' + VIEW_W + 'V' + pts[pts.length - 1].split(' ')[1] + 'L' + pts.slice().reverse().join('L') + 'Z');
    var line = 'M' + pts.join('L');
    edge.setAttribute('d', line);
    var drawn = Math.min(1, Math.max(0, top / DRAW_RANGE_PX));
    edge.style.strokeDasharray = '1';
    edge.style.strokeDashoffset = String(1 - drawn);
    bleed.style.height = (BLEED_PCT * drawn).toFixed(1) + '%';
    phaseEl.textContent = phase.toFixed(1);
  }
  function stopDemo() { root.classList.remove('is-demo'); }

  scroller.addEventListener('scroll', update);
  scroller.addEventListener('wheel', stopDemo, { passive: true });
  scroller.addEventListener('pointerdown', stopDemo);
  scroller.addEventListener('keydown', stopDemo);

  var t0 = null;
  function tick(ts) {
    if (t0 === null) t0 = ts;
    if (root.classList.contains('is-demo')) {
      var max = scroller.scrollHeight - scroller.clientHeight;
      var phase = ((ts - t0) % CYCLE_MS) / CYCLE_MS;
      var tri = phase < 0.5 ? phase * 2 : 2 - phase * 2;
      scroller.scrollTop = max * SCROLL_SHARE * tri;
    }
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    scroller.scrollTop = (scroller.scrollHeight - scroller.clientHeight) * SCROLL_SHARE / 2;
    update();
  } else {
    update();
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
