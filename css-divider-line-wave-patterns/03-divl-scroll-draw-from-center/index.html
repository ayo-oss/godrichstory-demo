<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크롤 위치에 따라 가운데에서 양쪽으로 그려지는 구분선 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dv is-demo" id="dvRoot">
  <div class="dv__scroller" id="dvScroller" tabindex="0" aria-label="스크롤 영역">
    <div class="dv__block">위 단락</div>
    <div class="dv__block dv__block--tall">위 단락</div>
    <div class="dv__line" id="dvLine" role="separator"></div>
    <div class="dv__block">아래 단락</div>
    <div class="dv__block dv__block--tall">아래 단락</div>
  </div>
  <p class="dv__meta"><span class="dv__tag">DRAW</span> <b id="dvPct">0</b>%</p>
</div>
</main>
<script>
(function () {
  // 기법: scroll 이벤트마다 선의 위치를 getBoundingClientRect 로 재서 진행도를 구하고, 그 값만큼 clip-path 를 양쪽에서 연다.
  // IntersectionObserver 는 쓰지 않는다. 진행도 = 선이 영역 바닥을 지나 올라온 거리 / DRAW_RANGE_PX 이다.
  var DRAW_RANGE_PX = 80;
  var DRAW_MIN_PCT = 0;
  var CYCLE_MS = 2000;

  var root = document.getElementById('dvRoot');
  var scroller = document.getElementById('dvScroller');
  var line = document.getElementById('dvLine');
  var pctEl = document.getElementById('dvPct');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function update() {
    var box = scroller.getBoundingClientRect();
    var lineBox = line.getBoundingClientRect();
    var risen = box.bottom - lineBox.top;
    var p = Math.min(1, Math.max(0, risen / DRAW_RANGE_PX));
    var pct = DRAW_MIN_PCT + (100 - DRAW_MIN_PCT) * p;
    var edge = (100 - pct) / 2;
    line.style.clipPath = 'inset(0 ' + edge.toFixed(2) + '% 0 ' + edge.toFixed(2) + '% round 6px)';
    pctEl.textContent = String(Math.round(pct));
  }
  function stopDemo() { root.classList.remove('is-demo'); }

  scroller.addEventListener('scroll', update);
  scroller.addEventListener('wheel', stopDemo, { passive: true });
  scroller.addEventListener('pointerdown', stopDemo);
  scroller.addEventListener('keydown', stopDemo);

  var t0 = null;
  function tick(ts) {
    if (t0 === null) t0 = ts;
    if (root.classList.contains('is-demo')) {
      var max = scroller.scrollHeight - scroller.clientHeight;
      var phase = ((ts - t0) % CYCLE_MS) / CYCLE_MS;
      var tri = phase < 0.5 ? phase * 2 : 2 - phase * 2;
      scroller.scrollTop = max * tri;
    }
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    scroller.scrollTop = (scroller.scrollHeight - scroller.clientHeight) / 2;
    update();
  } else {
    update();
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
