<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>真ん中がいちばん大きい点の区切り線と一度通る光 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dv is-demo" id="dvRoot">
  <div class="dv__card">
    <div class="dv__dots" id="dvDots" role="separator"></div>
  </div>
  <div class="dv__bar">
  <button class="dv__btn" id="dvBtn" type="button">もう一度光らせる</button>
  <p class="dv__meta"><span class="dv__tag">DOT_COUNT</span> <b id="dvCount">0</b></p>
  </div>
</div>
</main>
<script>
(function () {
  // 기법: i 번째 점 지름 = DOT_MAX_PX * exp(-(i - 중심)^2 / (2 * 시그마^2)) (가우스 곡선). 지름은 DOT_MIN_PX 밑으로 내려가지 않는다.
  // 반짝임은 위치 g 가 점 줄을 한 번 훑는 값이고, 점마다 exp(-(i - g)^2 / (2 * GLINT_WIDTH^2)) 만큼 밝아지고 커진다.
  var DOT_COUNT = 11;
  var DOT_MAX_PX = 32;
  var DOT_MIN_PX = 4;
  var GLINT_WIDTH = 1.3;
  var GLINT_MS = 1400;
  var START_MS = 200;
  var CYCLE_MS = 2000;
  var BASE = [185, 160, 255];
  var LIGHT = [255, 255, 255];

  var root = document.getElementById('dvRoot');
  var host = document.getElementById('dvDots');
  var btn = document.getElementById('dvBtn');
  var countEl = document.getElementById('dvCount');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var center = (DOT_COUNT - 1) / 2;
  var sigma = DOT_COUNT / 5;
  var dots = [];
  var sizes = [];
  var i;

  for (i = 0; i < DOT_COUNT; i += 1) {
    var d = document.createElement('span');
    d.className = 'dv__dot';
    host.appendChild(d);
    dots.push(d);
    var gauss = Math.exp(-Math.pow(i - center, 2) / (2 * sigma * sigma));
    sizes.push(Math.max(DOT_MIN_PX, DOT_MAX_PX * gauss));
  }
  countEl.textContent = String(DOT_COUNT);

  function paint(g) {
    for (var k = 0; k < DOT_COUNT; k += 1) {
      var b = g === null ? 0 : Math.exp(-Math.pow(k - g, 2) / (2 * GLINT_WIDTH * GLINT_WIDTH));
      var px = sizes[k] * (1 + 0.3 * b);
      var c = [0, 1, 2].map(function (n) { return Math.round(BASE[n] + (LIGHT[n] - BASE[n]) * b); });
      var el = dots[k];
      el.style.width = px.toFixed(1) + 'px';
      el.style.height = px.toFixed(1) + 'px';
      el.style.background = 'rgb(' + c.join(',') + ')';
    }
  }
  function glintAt(local) {
    var p = (local - START_MS) / GLINT_MS;
    if (p < 0 || p > 1) return null;
    return -2 + p * (DOT_COUNT + 3);
  }
  function stopDemo() { root.classList.remove('is-demo'); }

  var restartAt = null;
  btn.addEventListener('click', function () {
    stopDemo();
    restartAt = -1;
  });

  var t0 = null;
  function tick(ts) {
    if (t0 === null) t0 = ts;
    if (restartAt === -1) restartAt = ts;
    if (root.classList.contains('is-demo')) paint(glintAt((ts - t0) % CYCLE_MS));
    else if (restartAt !== null) paint(glintAt(ts - restartAt + START_MS));
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    paint(center);
  } else {
    paint(null);
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
