<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가운데 글자 폭에 맞춰 양쪽 선이 나뉘는 구분선 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dv is-demo" id="dvRoot">
  <div class="dv__card" id="dvCard">
    <div class="dv__row" id="dvRow" role="separator">
      <span class="dv__side" id="dvLeft"></span>
      <span class="dv__label" id="dvLabel">또는</span>
      <span class="dv__side dv__side--right" id="dvRight"></span>
    </div>
  </div>
  <div class="dv__bar">
  <button class="dv__btn" id="dvBtn" type="button">글자 바꾸기</button>
  <p class="dv__meta"><span class="dv__tag">LINE</span> <b id="dvPx">0</b><span>px</span></p>
  </div>
</div>
</main>
<script>
(function () {
  // 기법: 글자 폭을 getBoundingClientRect 로 재고, 양쪽 선 폭 = (줄 폭 - 글자 폭 - LABEL_GAP * 2) / 2 를 직접 계산해 width 로 준다.
  // 데모는 카드 폭을 시간에 따라 줄였다 늘리고 글자를 돌려 가며 매 프레임 다시 계산한다.
  var LABEL_GAP = 12;
  var LINE_H_PX = 6;
  var CYCLE_MS = 2000;
  var NARROW_PX = 180;
  var WIDE_PX = 420;
  var LABELS = ['또는', '다른 방법으로 계속', '여기까지 읽은 내용'];

  var root = document.getElementById('dvRoot');
  var card = document.getElementById('dvCard');
  var row = document.getElementById('dvRow');
  var left = document.getElementById('dvLeft');
  var right = document.getElementById('dvRight');
  var label = document.getElementById('dvLabel');
  var btn = document.getElementById('dvBtn');
  var pxEl = document.getElementById('dvPx');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var labelIndex = 0;

  function layout() {
    var rowW = row.getBoundingClientRect().width;
    var labelW = label.getBoundingClientRect().width;
    var side = Math.max(0, (rowW - labelW - LABEL_GAP * 2) / 2);
    left.style.width = side.toFixed(1) + 'px';
    right.style.width = side.toFixed(1) + 'px';
    pxEl.textContent = String(Math.round(side));
  }
  function setLabel(i) {
    labelIndex = i;
    label.textContent = LABELS[i];
  }
  function stopDemo() { root.classList.remove('is-demo'); }

  btn.addEventListener('click', function () {
    stopDemo();
    setLabel((labelIndex + 1) % LABELS.length);
    layout();
  });

  var t0 = null;
  function tick(ts) {
    if (t0 === null) t0 = ts;
    if (root.classList.contains('is-demo')) {
      var now = ts - t0;
      var phase = (now % CYCLE_MS) / CYCLE_MS;
      var wave = 0.5 - 0.5 * Math.cos(phase * Math.PI * 2);
      card.style.width = (NARROW_PX + (WIDE_PX - NARROW_PX) * wave).toFixed(1) + 'px';
      var i = Math.floor(now / CYCLE_MS * 3) % LABELS.length;
      if (i !== labelIndex) setLabel(i);
      layout();
    }
    requestAnimationFrame(tick);
  }

  left.style.height = LINE_H_PX + 'px';
  right.style.height = LINE_H_PX + 'px';
  layout();
  if (reduce) {
    stopDemo();
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
