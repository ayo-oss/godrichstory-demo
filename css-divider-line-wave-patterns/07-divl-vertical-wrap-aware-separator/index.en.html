<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertical Separator That Never Stays at a Row Start — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dv is-demo" id="dvRoot">
  <div class="dv__card" id="dvCard">
    <ul class="dv__list" id="dvList">
      <li class="dv__item">Home</li>
      <li class="dv__item">Design</li>
      <li class="dv__item">Code</li>
      <li class="dv__item">Examples</li>
      <li class="dv__item">Reviews</li>
      <li class="dv__item">Contact</li>
      <li class="dv__item">More</li>
    </ul>
  </div>
  <label class="dv__ctrl">
    <span>Width</span>
    <input type="range" id="dvRange" min="150" max="336" value="336">
    <span class="dv__meta"><span class="dv__tag">ROWS</span> <b id="dvRows">1</b></span>
  </label>
</div>
</main>
<script>
(function () {
  // 기법: 항목마다 앞에 세로 선(::before)을 두고, 줄이 바뀐 항목은 JS 가 offsetTop 을 앞 항목과 비교해 is-first 를 붙여 선을 숨긴다.
  // 폭이 바뀔 때마다 다시 판정하므로 어느 폭에서도 줄 맨 앞에 선이 남지 않는다. (CSS 만으로는 줄 시작을 알 수 없다.)
  var SEP_GAP = 12;
  var SEP_H_PX = 20;
  var CYCLE_MS = 2000;
  var NARROW_PX = 150;
  var WIDE_PX = 336;

  var root = document.getElementById('dvRoot');
  var card = document.getElementById('dvCard');
  var list = document.getElementById('dvList');
  var range = document.getElementById('dvRange');
  var rowsEl = document.getElementById('dvRows');
  var items = Array.prototype.slice.call(list.children);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function mark() {
    var rows = 0;
    var lastTop = null;
    items.forEach(function (li) {
      var top = li.offsetTop;
      var first = lastTop === null || top !== lastTop;
      if (first) rows += 1;
      li.classList.toggle('is-first', first);
      lastTop = top;
    });
    rowsEl.textContent = String(rows);
  }
  function setWidth(px) {
    card.style.width = px.toFixed(1) + 'px';
    range.value = String(Math.round(px));
    mark();
  }
  function stopDemo() { root.classList.remove('is-demo'); }

  range.addEventListener('input', function () {
    stopDemo();
    setWidth(Number(range.value));
  });

  var t0 = null;
  function tick(ts) {
    if (t0 === null) t0 = ts;
    if (root.classList.contains('is-demo')) {
      var phase = ((ts - t0) % CYCLE_MS) / CYCLE_MS;
      var wave = 0.5 + 0.5 * Math.cos(phase * Math.PI * 2);
      setWidth(NARROW_PX + (WIDE_PX - NARROW_PX) * wave);
    }
    requestAnimationFrame(tick);
  }

  card.style.setProperty('--sep-gap', SEP_GAP + 'px');
  card.style.setProperty('--sep-h', SEP_H_PX + 'px');
  setWidth(WIDE_PX);
  if (reduce) {
    stopDemo();
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
