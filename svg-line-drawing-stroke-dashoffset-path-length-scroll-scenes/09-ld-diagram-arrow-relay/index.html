<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화살표가 차례로 이어지는 다이어그램 연결 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, 왼쪽·오른쪽 방향키로 다른 값으로">
      <div class="ez__scene" data-role="scene" role="img" aria-label="다이어그램 화살표가 정방향과 역방향과 양끝 동시 시작으로 그려져 마지막에 하나로 이어지는 장면"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">장면 준비</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
    // 무대 좌표 — 안쪽 상자는 늘 480x300 이고 화면 폭에 맞춰 통째로 줄인다
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    const SVGW = 448;
    const SVGH = 156;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    // ── 무대 요소
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const SVGNS = 'http://www.w3.org/2000/svg';
    // 장면 안 요소를 만든다. 클래스는 cx 를 거쳐 CSS 모듈 이름으로 바뀐다
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    // SVG 무대 — 장면마다 이 안에 path·circle·text 를 놓는다
    function makeSvg() {
        const s = document.createElementNS(SVGNS, 'svg');
        s.setAttribute('viewBox', '0 0 ' + SVGW + ' ' + SVGH);
        s.setAttribute('class', cx('sc'));
        scWrap.appendChild(s);
        return s;
    }
    function svgEl(tag, cls, parent) {
        const e = document.createElementNS(SVGNS, tag);
        if (cls) {
            e.setAttribute('class', cx(cls));
        }
        parent.appendChild(e);
        return e;
    }
    function svgPath(parent, cls, d) {
        const p = svgEl('path', cls, parent);
        p.setAttribute('d', d);
        return p;
    }
    function svgText(parent, cls, x, y, txt) {
        const t = svgEl('text', cls, parent);
        t.setAttribute('x', String(x));
        t.setAttribute('y', String(y));
        t.textContent = txt;
        return t;
    }
    // 그리기 주역: dasharray 를 총 길이로 두고 dashoffset 을 길이 x (1 - p) 로 내린다
    function setDraw(p, total, p01) {
        p.setAttribute('stroke-dasharray', String(total));
        p.setAttribute('stroke-dashoffset', String(total * (1 - clamp(p01, 0, 1))));
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        // clkEl(시계)은 sceneEl 에 직접 붙어 있으므로 래퍼만 비운다 — 시계를 지우면 렌더 시계가 죽는다
        scWrap.textContent = '';
        chartEl.textContent = '';
        probeEl.textContent = '';
    }
    // ── 경로 길이 측정 — getTotalLength 는 화면에 붙은 뒤에만 값을 준다 (probe 는 visibility:hidden 상자)
    function measure(d) {
        const svg = document.createElementNS(SVGNS, 'svg');
        svg.setAttribute('viewBox', '0 0 ' + SVGW + ' ' + SVGH);
        svg.setAttribute('class', cx('sc'));
        probeEl.appendChild(svg);
        const p = svgPath(svg, '', d);
        const len = p.getTotalLength();
        probeEl.removeChild(svg);
        return len;
    }
    // 경로 위 at 지점의 좌표 — getPointAtLength (probe 의 임시 사본으로 잰다)
    // vb = 메인 svg 의 viewBox — 장면이 시선을 확대했으면 같은 값을 넘겨야 좌표가 어긋나지 않는다
    function pointAt(d, at, vb) {
        const svg = document.createElementNS(SVGNS, 'svg');
        svg.setAttribute('viewBox', vb || ('0 0 ' + SVGW + ' ' + SVGH));
        svg.setAttribute('class', cx('sc'));
        probeEl.appendChild(svg);
        const p = svgPath(svg, '', d);
        const pt = p.getPointAtLength(at);
        probeEl.removeChild(svg);
        return { x: pt.x, y: pt.y };
    }
    // 정점 오프셋 — 시드 해시(재생해도 같은 값). Math.random 을 쓰지 않는다
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    // ── 엔진이 푼 시간 읽기 — 모델이 아니라 getAnimations() 와 getComputedTiming() 값
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function delayOf(a) {
        const t = a.effect ? a.effect.getComputedTiming() : null;
        return t && typeof t.delay === 'number' ? t.delay : 0;
    }
    function span(a, max) {
        const t = a.effect ? a.effect.getComputedTiming() : null;
        if (!t) {
            return { s: 0, e: 0, k: 0 };
        }
        const d = typeof t.delay === 'number' ? t.delay : 0;
        const e = typeof t.endTime === 'number' && isFinite(t.endTime) ? t.endTime : max;
        return { s: d, e: Math.min(e, max), k: 0 };
    }
    function phaseStr(e) {
        const t = e ? e.getComputedTiming() : null;
        if (!t || t.localTime === null || t.localTime === undefined) {
            return 'none';
        }
        const lt = Number(t.localTime);
        const d = typeof t.delay === 'number' ? t.delay : 0;
        const end = typeof t.endTime === 'number' ? t.endTime : Infinity;
        if (lt < d) {
            return 'before';
        }
        return lt >= end ? 'after' : 'active';
    }
    function phaseOf(a) {
        return phaseStr(a.effect);
    }
    // ── 아래 차트 상자 그리기
    function bar(cls, x, y, w, h) {
        const e = make('i', cls, chartEl);
        put(e, x, y, w, h);
        return e;
    }
    // 가로 막대 줄: 한 줄 = 한 구간
    function drawRows(segs, max) {
        const n = segs.length;
        const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
        const out = [];
        for (let i = 0; i < n; i += 1) {
            const sg = segs[i];
            const x = CX0 + clamp(sg.s, 0, max) / max * CW;
            const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
            out.push(bar('bar k' + sg.k, x, 5 + i * (h + 1), w, h));
        }
        return out;
    }
    function axis(max) {
        const a = make('b', 'ax', chartEl);
        a.textContent = '0';
        put(a, CX0, 40, 0, 0);
        const b = make('b', 'ax ax--r', chartEl);
        b.textContent = f0(max) + 'ms';
        put(b, CX0 + CW - 60, 40, 60, 0);
    }
    function marker(ms, max, cls) {
        bar('mk ' + cls, CX0 + clamp(ms, 0, max) / max * CW, 2, 2, 44);
    }
    let headEl = null;
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            cycle = Math.max(2000, cfg.build(pi));
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                setPaused(true);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            // 움직임 줄이기 — 모든 애니메이션이 꺼지고 장면은 완성 상태 한 장이다 (build 마지막 프레임을 그린다)
            statusP.textContent = '움직임 줄이기 켜짐 · 완성 상태';
            readB.textContent = '그려지는 과정 대신 완성된 그림을 바로 보여 준다';
            doneP.textContent = readB.textContent;
            cfg.frame(1e9);
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }
    // 09 화살표가 차례로 이어지는 다이어그램 연결 — 정방향·역방향·양끝 동시 시작이 지연 계산으로 만나는 장면
    const NODES = [[24, 116], [150, 32], [290, 130], [416, 44]];
    const ARROWS = [
        { a: 0, b: 1, mode: 'fwd' }, // 시작점부터 정방향
        { a: 2, b: 3, mode: 'rev' }, // 끝점부터 역방향 (offset 음수 = 경로를 거꾸로 논다)
        { a: 1, b: 2, mode: 'both' }, // 양끝에서 동시에 만난다
    ];
    const NODE_R = 15;
    const bothEnds = ARROWS[2].mode; // 3번 화살표는 양끝에서 동시에 그려진다
    const DRAW_MS = 700;
    const STEP_MS = 260;
    const relayDelay = STEP_MS; // 화살표 사이 지연 — 앞 화살표가 시작하고 relayDelay 뒤 다음이 따른다 // relayDelay — 화살표 사이 지연. bothEnds: 3번은 양끝에서 동시에, arrowhead: 촉은 마지막에
    let arrowPaths = [];
    let arrowLens = [];
    let arrowModes = [];
    let nodeDots = [];
    let heads = [];
    let tipDots = [];
    let progBar = null;
    function nodeD(a, b) {
        // 경로 길이를 늘리는 S 곡선 — 제어점을 세로로 크게 벌린다
        const my = (NODES[a][1] + NODES[b][1]) / 2;
        const dip = NODES[a][1] < NODES[b][1] ? 64 : -64;
        return 'M ' + (NODES[a][0] + 16) + ' ' + NODES[a][1] + ' C ' + (NODES[a][0] + 70) + ' ' + (NODES[a][1] + dip * 0.4) + ' ' + (NODES[a][0] + 80) + ' ' + (my + dip * 0.5) + ' ' + ((NODES[a][0] + NODES[b][0]) / 2) + ' ' + (my + dip * 0.2) + ' S ' + (NODES[b][0] - 80) + ' ' + (NODES[b][1] - dip * 0.3) + ' ' + (NODES[b][0] - 16) + ' ' + NODES[b][1];
    }
    function headD(i) {
        // 화살촉 — 도착 노드 방향으로. 마지막에 그려진다
        const n = NODES[ARROWS[i].b];
        return 'M ' + (n[0] - 16) + ' ' + (n[1] - 8) + ' L ' + (n[0] - 4) + ' ' + n[1] + ' L ' + (n[0] - 16) + ' ' + (n[1] + 8);
    }
    function build(i) {
        const svg = makeSvg();
        arrowPaths = [];
        arrowLens = [];
        arrowModes = [];
        nodeDots = [];
        heads = [];
        tipDots = [];
        for (let n = 0; n < NODES.length; n += 1) {
            const c = svgEl('circle', 'dot dot--node', svg);
            c.setAttribute('cx', String(NODES[n][0]));
            c.setAttribute('cy', String(NODES[n][1]));
            c.setAttribute('r', String(NODE_R));
            nodeDots.push(c);
            svgText(svg, 'svtx', NODES[n][0] - 8, NODES[n][1] - 20, String(n + 1));
        }
        for (let a = 0; a < ARROWS.length; a += 1) {
            const d = nodeD(ARROWS[a].a, ARROWS[a].b);
            const p = svgPath(svg, 'st st--' + ['a', 'b', 'c'][a], d);
            const ln = p.getTotalLength();
            arrowLens.push(ln);
            setDraw(p, ln, 0);
            arrowPaths.push(p);
            arrowModes.push(ARROWS[a].mode);
            const h = svgPath(svg, 'st st--' + ['a', 'b', 'c'][a], headD(a));
            const hl = h.getTotalLength();
            setDraw(h, hl, 0);
            heads.push(h);
            // 화살표 진행 끝을 따라가는 점 — 같은 진행도가 점 위치를 만든다
            const dot = svgEl('circle', 'dot dot--trav', svg);
            dot.setAttribute('r', '11');
            tipDots.push(dot);
        }
        svgText(svg, 'svtx', 20, 124, '1 정방향 · 2 역방향 · 3 양끝 동시');
        // 전체 연결 진행 막대 — 이어진 화살표 수 / 3 (같은 계산 전파)
        const trk = make('i', 's9__track', scWrap);
        put(trk, 20, 136, 360, 10);
        progBar = make('i', 's9__fill', scWrap);
        put(progBar, 20, 136, 0, 10);
        const total = 3 * STEP_MS + DRAW_MS + 400;
        const segs = ARROWS.map(function (a, ix) {
            return { s: 120 + ix * STEP_MS, e: 120 + ix * STEP_MS + DRAW_MS, k: ix };
        });
        drawRows(segs, total);
        axis(total);
        setReads(fill('화살표 3 · 지연 {a}ms 간격 · 그리기 {b}ms', f0(STEP_MS), f0(DRAW_MS)), fill('역방향은 offset 을 -L -> 0 으로 올린다 — 경로를 거꾸로 논다', ''));
        return Math.max(2000, total + 100);
    }
    function frame(t) {
        let done = 0;
        for (let a = 0; a < arrowPaths.length; a += 1) {
            const st = 120 + a * relayDelay;
            const p = clamp((t - st) / DRAW_MS, 0, 1);
            const L = arrowLens[a];
            const mode = arrowModes[a];
            let off;
            if (mode === 'rev') {
                // 역방향: offset 을 -L 에서 0 으로 — 선이 끝점 쪽에서 시작점으로 자란다
                off = -L + p * L;
                arrowPaths[a].setAttribute('stroke-dasharray', String(L));
                arrowPaths[a].setAttribute('stroke-dashoffset', String(off));
            }
            else if (mode === 'both') {
                // 양끝 동시: dasharray 를 절반 간격 두 쪽으로 쪼개 양끝에서 만나게 한다
                const half = L / 2;
                const grow = p * half;
                arrowPaths[a].setAttribute('stroke-dasharray', f1(grow) + ' ' + f1(half - grow) + ' ' + f1(grow) + ' ' + f1(L));
                arrowPaths[a].removeAttribute('stroke-dashoffset');
            }
            else {
                setDraw(arrowPaths[a], L, p);
            }
            // 화살촉은 몸통이 다 그려진 뒤 짧게 이어진다
            const hp = clamp((t - st - DRAW_MS * 0.85) / (DRAW_MS * 0.15), 0, 1);
            const hl = heads[a].getTotalLength();
            setDraw(heads[a], hl, hp);
            // 진행 끝 점 — 모드마다 경로 위 지점이 다르다
            const dAttr = arrowPaths[a].getAttribute('d');
            let tipAt = 0;
            if (mode === 'rev') {
                tipAt = (1 - p) * L;
            }
            else if (mode === 'both') {
                tipAt = (p < 0.5 ? p * 2 : 1 - (p - 0.5) * 2) * L / 2;
            }
            else {
                tipAt = p * L;
            }
            if (p > 0 && p < 1) {
                const at = pointAt(dAttr, tipAt);
                tipDots[a].setAttribute('cx', f1(at.x));
                tipDots[a].setAttribute('cy', f1(at.y));
                tipDots[a].setAttribute('opacity', '1');
            }
            else {
                tipDots[a].setAttribute('opacity', '0');
            }
            if (p >= 1) {
                done += 1;
            }
        }
        if (progBar) {
            progBar.style.width = (done / 3) * 360 + 'px';
        }
        return fill('지금 {a}ms · 이어진 화살표 {b}/3', f0(t), f0(done));
    }
    return run({ count: 1, build: build, frame: frame });
}
})();
</script>
