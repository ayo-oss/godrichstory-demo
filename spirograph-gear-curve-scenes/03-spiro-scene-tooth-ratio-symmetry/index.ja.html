<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二つの歯車の歯数の最大公約数で模様の花びら数を計算し、比率が変わると対称軸の数もその値に合わせて決まり直し、曲線が閉じるまでの回転数も一緒に変わる — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sp3 is-demo" id="sp3Root" tabindex="0">
  <canvas class="sp3__canvas" id="sp3Canvas" width="480" height="300"></canvas>
  <p class="sp3__badge" id="sp3Badge"></p>
  <p class="sp3__caption">二つの歯車の歯数の最大公約数で模様の花びら数を計算し、比率が変わると対称軸の数もその値に合わせて決まり直し、曲線が閉じるまでの回転数も一緒に変わる</p>
</div>
</main>
<script>
(function () {
  // 기법: 하이포트로코이드 + 최대공약수(gcd) 계산 — 링 이빨 수와 톱니 이빨 수의 gcd 로
  // 꽃잎(対称軸) 수와 곡선이 닫히기까지 도는 바퀴 수를 구해 배지에 그대로 표시한다.
  var root = document.getElementById('sp3Root');
  var canvas = document.getElementById('sp3Canvas');
  var badge = document.getElementById('sp3Badge');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  var CALC_DIM = 200;
  var GEAR_RING_TEETH = 90;
  var GEAR_ROLL_TEETH = 24;
  var PEN_RADIUS_RATIO = 0.6;
  var TOOTH_UNIT = 0.8;
  var SEGMENTS_PER_TURN = 220;

  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a; }

  var R = GEAR_RING_TEETH * TOOTH_UNIT;
  var r = GEAR_ROLL_TEETH * TOOTH_UNIT;
  var d = r * PEN_RADIUS_RATIO;
  var g = gcd(GEAR_RING_TEETH, GEAR_ROLL_TEETH);
  var AXIS_COUNT = GEAR_RING_TEETH / g;
  var TURN_COUNT = GEAR_ROLL_TEETH / g;
  var TOTAL_T = TURN_COUNT * Math.PI * 2;
  var CYCLE_SECONDS = 6;
  var SPEED = TOTAL_T / CYCLE_SECONDS;

  badge.textContent = '対称軸' + AXIS_COUNT + '本 · ' + TURN_COUNT + '回転で閉じる';

  function point(t) {
    var k = (R - r) / r;
    return {
      x: (R - r) * Math.cos(t) + d * Math.cos(k * t),
      y: (R - r) * Math.sin(t) - d * Math.sin(k * t)
    };
  }

  var cw = 480, ch = 300, scale = 1, cx = 240, cy = 150;
  function fit() {
    var rect = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(rect.width));
    ch = Math.max(1, Math.round(rect.height));
    canvas.width = cw; canvas.height = ch;
    scale = Math.min(cw, ch) / CALC_DIM * 0.92;
    cx = cw / 2; cy = ch / 2;
  }

  function toScreen(p) { return { x: cx + p.x * scale, y: cy + p.y * scale }; }

  function drawFull(tMax) {
    ctx.clearRect(0, 0, cw, ch);
    var tipW = toScreen(point(tMax));
    var wash = ctx.createRadialGradient(tipW.x, tipW.y, 0, tipW.x, tipW.y, Math.max(cw, ch) * 0.9);
    wash.addColorStop(0, 'rgba(255,255,255,.60)');
    wash.addColorStop(0.5, 'rgba(255,225,170,.32)');
    wash.addColorStop(1, 'rgba(200,190,255,.16)');
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, cw, ch);
    var fillSteps = Math.max(2, Math.round((tMax / (Math.PI * 2)) * SEGMENTS_PER_TURN));
    ctx.beginPath();
    for (var fi = 0; fi <= fillSteps; fi += 1) {
      var fs = toScreen(point((fi / fillSteps) * tMax));
      if (fi === 0) ctx.moveTo(fs.x, fs.y); else ctx.lineTo(fs.x, fs.y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,247,230,.18)';
    ctx.fill('evenodd');
    ctx.lineWidth = Math.max(3, scale * 0.04);
    ctx.strokeStyle = 'rgba(255,247,230,.94)';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    var steps = Math.max(2, Math.round((tMax / (Math.PI * 2)) * SEGMENTS_PER_TURN));
    ctx.beginPath();
    for (var i = 0; i <= steps; i += 1) {
      var t = (i / steps) * tMax;
      var s = toScreen(point(t));
      if (i === 0) ctx.moveTo(s.x, s.y); else ctx.lineTo(s.x, s.y);
    }
    ctx.stroke();
    if (tMax > 0.001) {
      var tip = toScreen(point(tMax));
      ctx.fillStyle = 'rgba(255,247,230,1)';
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, Math.max(3, scale * 0.05), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) root.classList.remove('is-demo');
  fit();

  if (reduce) {
    drawFull(TOTAL_T);
  } else {
    var elapsed = 0.3;
    var lastTs = null;
    function tick(ts) {
      if (lastTs === null) lastTs = ts;
      var dt = Math.min(ts - lastTs, 48);
      lastTs = ts;
      elapsed += dt / 1000;
      var t = elapsed * SPEED;
      if (t > TOTAL_T) { elapsed = 0; t = 0; }
      drawFull(t);
      requestAnimationFrame(tick);
    }
    drawFull(elapsed * SPEED);
    window.addEventListener('resize', function () { fit(); drawFull(elapsed * SPEED); });
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
