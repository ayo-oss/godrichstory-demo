<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>곡선이 다 그려진 뒤 캔버스 전체를 회전 변환으로 천천히 돌려 무늬의 대칭 축을 지나가는 순간마다 겹쳐 보이는 착시가 생기고, 회전 각도 값이 그 리듬을 정한다 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sp8 is-demo" id="sp8Root" tabindex="0">
  <canvas class="sp8__canvas" id="sp8Canvas" width="480" height="300"></canvas>
  <p class="sp8__caption">곡선이 다 그려진 뒤 캔버스 전체를 회전 변환으로 천천히 돌려 무늬의 대칭 축을 지나가는 순간마다 겹쳐 보이는 착시가 생기고, 회전 각도 값이 그 리듬을 정한다</p>
</div>
</main>
<script>
(function () {
  // 기법: 완성된 무늬는 한 번만 계산해 배열에 담아두고, 매 프레임 회전 각도만 바꿔 다시
  // 그린다. 그 위에 독립된 타이머로 광택 띠를 원판 클립 안에서 쓸어 지나가게 겹친다.
  var root = document.getElementById('sp8Root');
  var canvas = document.getElementById('sp8Canvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  var CALC_DIM = 200;
  var GEAR_RING_TEETH = 48;
  var GEAR_ROLL_TEETH = 18;
  var PEN_TIP_RATIO = 0.58;
  var TOOTH_UNIT = 1.6;
  var SEGMENTS_PER_TURN = 180;
  var ROTATE_SPEED = (2 * Math.PI) / 9;
  var GLOSS_SWEEP_SECONDS = 3.4;
  var DISC_RATIO = 0.82;

  function gcd(a, b) { while (b) { var t = b; b = a % b; a = t; } return a; }
  var g = gcd(GEAR_RING_TEETH, GEAR_ROLL_TEETH);
  var TURNS = GEAR_ROLL_TEETH / g;
  var AXIS_COUNT = GEAR_RING_TEETH / g;

  var R = GEAR_RING_TEETH * TOOTH_UNIT;
  var r = GEAR_ROLL_TEETH * TOOTH_UNIT;
  var d = r * PEN_TIP_RATIO;
  var K = (R - r) / r;

  var pathData = (function () {
    var maxT = 2 * Math.PI * TURNS;
    var step = (2 * Math.PI) / SEGMENTS_PER_TURN;
    var pts = [];
    for (var t = 0; t <= maxT; t += step) {
      pts.push({
        x: (R - r) * Math.cos(t) + d * Math.cos(K * t),
        y: (R - r) * Math.sin(t) - d * Math.sin(K * t)
      });
    }
    return pts;
  })();
  var patternRadius = R + d;

  var cw = 480, ch = 300, scale = 1, cx = 240, cy = 150;
  function fit() {
    var rect = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(rect.width));
    ch = Math.max(1, Math.round(rect.height));
    canvas.width = cw; canvas.height = ch;
    var targetDiscPx = Math.min(cw, ch) / 2 * DISC_RATIO;
    scale = targetDiscPx / (patternRadius * 1.08);
    cx = cw / 2; cy = ch / 2;
  }

  function render(rot, sweepProgress) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cw, ch);

    var discR = patternRadius * scale * 1.08;

    var plate = ctx.createRadialGradient(cx, cy, discR * 0.15, cx, cy, discR);
    plate.addColorStop(0, '#fff7e6');
    plate.addColorStop(0.75, '#f4ead4');
    plate.addColorStop(1, '#e6d8ba');
    ctx.beginPath();
    ctx.arc(cx, cy, discR, 0, Math.PI * 2);
    ctx.fillStyle = plate;
    ctx.fill();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.beginPath();
    for (var i = 0; i < pathData.length; i += 1) {
      var p = pathData[i];
      var sx = p.x * scale, sy = p.y * scale;
      if (i === 0) { ctx.moveTo(sx, sy); } else { ctx.lineTo(sx, sy); }
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(10,79,232,.82)';
    ctx.lineWidth = Math.max(1.6, scale * 0.022);
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, discR, 0, Math.PI * 2);
    ctx.clip();
    var bandCenter = (sweepProgress * 2 - 0.5) * discR * 2.2;
    ctx.translate(cx, cy);
    ctx.rotate(-0.5);
    var glossGrad = ctx.createLinearGradient(bandCenter - discR * 0.35, 0, bandCenter + discR * 0.35, 0);
    glossGrad.addColorStop(0, 'rgba(255,255,255,0)');
    glossGrad.addColorStop(0.5, 'rgba(255,255,255,.32)');
    glossGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glossGrad;
    ctx.fillRect(bandCenter - discR * 0.4, -discR * 1.5, discR * 0.8, discR * 3);
    ctx.restore();
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  fit();

  if (reduce) {
    root.classList.remove('is-demo');
    render(0, 0.5);
  } else {
    var startTs = null;
    function tick(ts) {
      if (startTs === null) startTs = ts;
      var elapsed = (ts - startTs) / 1000;
      var rot = elapsed * ROTATE_SPEED;
      var sweepProgress = (elapsed % GLOSS_SWEEP_SECONDS) / GLOSS_SWEEP_SECONDS;
      render(rot, sweepProgress);
      requestAnimationFrame(tick);
    }
    window.addEventListener('resize', fit);
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
