<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draws the rolling gear and pen position together on top of the curve, continuously showing the current angle and contact point, so the relationship between the gear's turning direction and the unfolding trace can be followed at a glance — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sp6 is-demo" id="sp6Root" tabindex="0">
  <canvas class="sp6__canvas" id="sp6Canvas" width="480" height="300"></canvas>
  <p class="sp6__badge" id="sp6Badge"></p>
  <p class="sp6__caption">Draws the rolling gear and pen position together on top of the curve, continuously showing the current angle and contact point, so the relationship between the gear's turning direction and the unfolding trace can be followed at a glance</p>
</div>
</main>
<script>
(function () {
  // 기법: 링 톱니·구름 톱니 두 원과 펜 스포크를 매 프레임 현재 각도로 다시 그려,
  // 곡선이 자라나는 동안에도 "지금 어디를 굴러가는지"가 항상 화면에 남아 있게 한다.
  var root = document.getElementById('sp6Root');
  var canvas = document.getElementById('sp6Canvas');
  var badge = document.getElementById('sp6Badge');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  var CALC_DIM = 200;
  var GEAR_RING_TEETH = 60;
  var GEAR_ROLL_TEETH = 24;
  var PEN_TIP_RATIO = 0.62;
  var TOOTH_UNIT = 1.3;
  var SEGMENTS_PER_TURN = 200;
  var CYCLE_SECONDS = 6;
  var HOLD_FRACTION = 0.84;

  function gcd(a, b) { while (b) { var t = b; b = a % b; a = t; } return a; }
  var g = gcd(GEAR_RING_TEETH, GEAR_ROLL_TEETH);
  var TURNS = GEAR_ROLL_TEETH / g;
  var AXIS_COUNT = GEAR_RING_TEETH / g;

  var R = GEAR_RING_TEETH * TOOTH_UNIT;
  var r = GEAR_ROLL_TEETH * TOOTH_UNIT;
  var d = r * PEN_TIP_RATIO;
  var K = (R - r) / r;

  function penAt(t) {
    return {
      x: (R - r) * Math.cos(t) + d * Math.cos(K * t),
      y: (R - r) * Math.sin(t) - d * Math.sin(K * t)
    };
  }
  function rollCenterAt(t) {
    return { x: (R - r) * Math.cos(t), y: (R - r) * Math.sin(t) };
  }

  var cw = 480, ch = 300, scale = 1, cx = 240, cy = 150;
  function fit() {
    var rect = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(rect.width));
    ch = Math.max(1, Math.round(rect.height));
    canvas.width = cw; canvas.height = ch;
    scale = Math.min(cw, ch) / CALC_DIM * 0.82;
    cx = cw / 2; cy = ch / 2;
  }
  function toScreen(p) { return { x: cx + p.x * scale, y: cy + p.y * scale }; }

  var maxT = 2 * Math.PI * TURNS;
  var dtSample = (2 * Math.PI) / SEGMENTS_PER_TURN;

  function render(progress) {
    var t = maxT * Math.min(progress / HOLD_FRACTION, 1);

    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(0, 0, cw, ch);
    var tipW = toScreen(penAt(t));
    var wash = ctx.createRadialGradient(tipW.x, tipW.y, 0, tipW.x, tipW.y, Math.max(cw, ch) * 0.9);
    wash.addColorStop(0, 'rgba(255,255,255,.62)');
    wash.addColorStop(0.5, 'rgba(255,190,215,.32)');
    wash.addColorStop(1, 'rgba(190,225,255,.14)');
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, cw, ch);
    var rcW = toScreen(rollCenterAt(t));
    ctx.beginPath();
    ctx.arc(rcW.x, rcW.y, r * scale, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(190,225,255,.38)';
    ctx.fill();

    var ringCenter = toScreen({ x: 0, y: 0 });
    ctx.beginPath();
    ctx.arc(ringCenter.x, ringCenter.y, R * scale, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(23,20,26,.22)';
    ctx.lineWidth = Math.max(1.4, scale * 0.02);
    ctx.stroke();

    ctx.beginPath();
    var first = true;
    for (var tt = 0; tt <= t; tt += dtSample) {
      var p = toScreen(penAt(tt));
      if (first) { ctx.moveTo(p.x, p.y); first = false; } else { ctx.lineTo(p.x, p.y); }
    }
    ctx.save();
    ctx.fillStyle = 'rgba(23,20,26,.10)';
    ctx.fill('evenodd');
    ctx.restore();
    ctx.strokeStyle = 'rgba(23,20,26,.9)';
    ctx.lineWidth = Math.max(3, scale * 0.04);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.stroke();

    var rc = rollCenterAt(t);
    var rcS = toScreen(rc);
    ctx.beginPath();
    ctx.arc(rcS.x, rcS.y, r * scale, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(10,79,232,.75)';
    ctx.lineWidth = Math.max(1.6, scale * 0.024);
    ctx.stroke();

    var pen = toScreen(penAt(t));
    ctx.beginPath();
    ctx.moveTo(rcS.x, rcS.y);
    ctx.lineTo(pen.x, pen.y);
    ctx.strokeStyle = 'rgba(10,79,232,.75)';
    ctx.lineWidth = Math.max(1.4, scale * 0.018);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(pen.x, pen.y, Math.max(3, scale * 0.05), 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(23,20,26,.92)';
    ctx.fill();

    var deg = Math.round((((t * 180 / Math.PI) % 360) + 360) % 360);
    badge.textContent = 'Contact angle ' + deg + '° · ' + AXIS_COUNT + ' symmetry axes';
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  fit();
  if (reduce) {
    root.classList.remove('is-demo');
    render(HOLD_FRACTION);
  } else {
    var startTs = null;
    function tick(ts) {
      if (startTs === null) startTs = ts;
      var elapsed = (ts - startTs) / 1000;
      var progress = (elapsed % CYCLE_SECONDS) / CYCLE_SECONDS;
      render(progress);
      requestAnimationFrame(tick);
    }
    window.addEventListener('resize', function () { fit(); });
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
