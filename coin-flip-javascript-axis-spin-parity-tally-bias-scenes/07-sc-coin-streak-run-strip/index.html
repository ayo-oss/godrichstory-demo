<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>같은 면이 이어질 때 길이가 자라는 연속 띠 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="동전 던지기 시연 무대 — Enter 나 Space 나 클릭으로 던지기, P 로 일시정지, N 으로 한 걸음, R 로 다시">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="던진 수열 200칸과 사람이 지어낸 수열 200칸이 칸마다 금빛 앞면과 하늘빛 뒷면으로 칠해지고 가장 긴 연속에 굵은 테두리가 둘러진다. 던진 수열은 연속이 길게 자라고 지어낸 수열은 세 칸을 넘기지 않는다"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">동전 던지기 시연</p>
  <div class="vj__ctrl">
    <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
    <button class="vj__step" data-role="step" type="button">한 걸음</button>
  </div>
  <p class="vj__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const PI = Math.PI;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 선형 합동 생성기(곱 1664525, 더함 1013904223). 같은 시드면 같은 수열
    function seeded(seed) {
        let s = (seed >>> 0) || 1;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 파스텔 팔레트 — 앞면은 금빛, 뒷면은 하늘빛, 치우침·경고는 분홍
    const BG_TOP = [250, 246, 252];
    const BG_BOT = [228, 234, 250];
    const TABLE_TOP = [240, 226, 238];
    const TABLE_BOT = [222, 208, 236];
    const GOLD = [250, 226, 150];
    const GOLD_DEEP = [196, 150, 52];
    const SKY = [176, 210, 246];
    const SKY_DEEP = [74, 120, 176];
    const RIM_LO = [184, 156, 100];
    const RIM_HI = [255, 248, 222];
    const ROSE = [240, 150, 176];
    const ROSE_DEEP = [190, 52, 86];
    const MINT = [150, 214, 190];
    const MINT_DEEP = [22, 112, 82];
    const LAV = [188, 172, 236];
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 장면 시계(초)·판 반복 번호·시간표 — 시간표는 (시각, 할 일) 목록이고 시각이 지나면 한 번씩 부른다
    let sceneT = 0;
    let lap = 0;
    let script = [];
    let evAt = 0;
    function tossHalf(k, t) { return k.h0 + k.hr * clamp(t - k.t0, 0, k.T); }
    function landHalf(k) { return k.h0 + k.hr * k.T; }
    function tossXY(k, t) {
        const u = clamp((t - k.t0) / k.T, 0, 1);
        return [lerp(k.x0, k.x1, u), lerp(k.y0, k.y1, u) - 4 * k.peak * u * (1 - u)];
    }
    // 착지한 뒤 — 가장 가까운 평평한 각(반 바퀴 수 반올림)으로 감쇠 진동하며 눕는다
    function halfAt(k, t) {
        const q = t - (k.t0 + k.T);
        if (q <= 0) {
            return tossHalf(k, t);
        }
        const hl = landHalf(k);
        const hf = Math.round(hl);
        return hf + (hl - hf) * Math.exp(-9 * q) * Math.cos(26 * q);
    }
    function hopLift(k, t) {
        const q = t - (k.t0 + k.T);
        return q <= 0 ? 0 : 12 * Math.exp(-7 * q) * Math.abs(Math.sin(15 * q));
    }
    // 위로 온 면 — 반 바퀴 수를 반올림해 짝수면 던지기 전 면(0), 홀수면 반대 면(1)
    function upFace(h) { return Math.abs(Math.round(h)) % 2; }
    // 원하는 면이 나오도록 반 바퀴 수를 고른다 — 짝수 + 면 번호, 소수 부분은 ±0.2 안에서 흔든다
    function halfFor(face, rng, minPairs) {
        return 2 * (minPairs + Math.floor(rng() * 3)) + face + (rng() - 0.5) * 0.4;
    }
    // 같은 수열에서 앞면(0)과 뒷면(1) — 값이 p 보다 작으면 앞면
    function outcomes(seed, n, p) {
        const rng = seeded(seed);
        const out = [];
        for (let i = 0; i < n; i += 1) {
            out.push(rng() < p ? 0 : 1);
        }
        return out;
    }
    // 가장 긴 연속 길이
    function longestRun(seq) {
        let best = 0;
        let cur = 0;
        for (let i = 0; i < seq.length; i += 1) {
            cur = (i > 0 && seq[i] === seq[i - 1]) ? cur + 1 : 1;
            if (cur > best) {
                best = cur;
            }
        }
        return best;
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const stepEl = root.querySelector('[data-role="step"]');
    const doneEl = root.querySelector('[data-role="done"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !stepEl || !doneEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const stepBtn = stepEl;
    const doneP = doneEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function skyFill(top, bot) {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bot, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function oval(x, y, rx, ry, c, a) {
        if (rx <= 0.2 || ry <= 0.1 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function seg(x1, y1, x2, y2, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function outline(x, y, w, h, r, width, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 글자 이름표 — 바탕 알약 위에 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    // 탁자 — 위쪽 가장자리 높이 y 부터 아래까지
    function tableBack(y) {
        const g = ctx.createLinearGradient(0, y, 0, H);
        g.addColorStop(0, rgba(TABLE_TOP, 1));
        g.addColorStop(1, rgba(TABLE_BOT, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, y, W, H - y);
        seg(0, y + 0.5, W, y + 0.5, 1.5, [255, 255, 255], 0.7);
    }
    // ── 동전 그리기 ───────────────────────────────────────────
    // 동전은 원판이다. 가로축으로 th 만큼 돌면 위쪽 원판은 세로 반지름이 R·|cos th| 인 타원으로 보이고,
    // cos th 의 부호가 음수가 되는 순간 보이는 면이 바뀐다(앞/뒤 판정은 법선의 부호 하나).
    // 옆면은 둘레를 RIM_N 조각으로 나눠, 조각 법선과 빛 방향(lx, ly, lz)의 내적으로 밝기를 정한다
    const RIM_N = 40;
    function faceArt(face, R, a) {
        const base = face === 0 ? GOLD : SKY;
        const deep = face === 0 ? GOLD_DEEP : SKY_DEEP;
        disc(0, 0, R, base, a);
        ring(0, 0, R * 0.84, R * 0.07, deep, a);
        for (let k = 0; k < 14; k += 1) {
            disc(Math.cos(k * TAU / 14) * R * 0.93, Math.sin(k * TAU / 14) * R * 0.93, R * 0.03, deep, a * 0.8);
        }
        if (face === 0) {
            // 별 — 바깥 반지름 0.5R, 안쪽 0.2R
            ctx.beginPath();
            for (let k = 0; k < 10; k += 1) {
                const rr = (k % 2 === 0 ? 0.5 : 0.21) * R;
                const an = -PI / 2 + k * PI / 5;
                if (k === 0) {
                    ctx.moveTo(Math.cos(an) * rr, Math.sin(an) * rr);
                }
                else {
                    ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr);
                }
            }
            ctx.closePath();
            ctx.fillStyle = rgba(deep, a);
            ctx.fill();
        }
        else {
            // 초승달과 점 세 개
            disc(-R * 0.05, -R * 0.08, R * 0.44, deep, a);
            disc(R * 0.14, -R * 0.14, R * 0.38, base, a);
            for (let k = 0; k < 3; k += 1) {
                disc((k - 1) * R * 0.24, R * 0.52, R * 0.06, deep, a);
            }
        }
    }
    function coinShadow(cx, gy, R, lift, a) {
        const k = clamp(lift / 260, 0, 0.75);
        oval(cx, gy, R * (1.02 - k * 0.5), R * (1.02 - k * 0.5) * 0.26, INK, a * 0.26 * (1 - k));
    }
    function drawCoin(cx, cy, R, th, thick, lx, ly, lz, a, startFace) {
        const c = Math.cos(th);
        const s = Math.sin(th);
        const sg = c >= 0 ? 1 : -1;
        const ac = Math.max(Math.abs(c), 0.012);
        const half = thick / 2;
        const near = -sg * s * half;
        const far = -near;
        const nearFace = sg > 0 ? startFace : 1 - startFace;
        if (thick > 0) {
            oval(cx, cy + far, R, R * ac, RIM_LO, a);
            for (let k = 0; k < RIM_N; k += 1) {
                const p0 = k * TAU / RIM_N;
                const p1 = (k + 1) * TAU / RIM_N;
                const pm = (p0 + p1) / 2;
                if (Math.sin(pm) * s <= 0) {
                    continue;
                }
                const dot = Math.cos(pm) * lx + Math.sin(pm) * c * ly + Math.sin(pm) * s * lz;
                const col = mix(RIM_LO, RIM_HI, clamp(0.5 + 0.5 * dot, 0, 1));
                const x0 = cx + R * Math.cos(p0);
                const x1 = cx + R * Math.cos(p1);
                const y0 = R * Math.sin(p0) * c;
                const y1 = R * Math.sin(p1) * c;
                ctx.beginPath();
                ctx.moveTo(x0, cy + near + y0);
                ctx.lineTo(x1, cy + near + y1);
                ctx.lineTo(x1, cy + far + y1);
                ctx.lineTo(x0, cy + far + y0);
                ctx.closePath();
                ctx.fillStyle = rgba(col, a);
                ctx.fill();
                ctx.lineWidth = 0.8;
                ctx.strokeStyle = rgba(col, a);
                ctx.stroke();
            }
        }
        ctx.save();
        ctx.translate(cx, cy + near);
        ctx.scale(1, ac);
        faceArt(nearFace, R, a);
        // 빛 쪽으로 쏠린 윤기
        disc(lx * R * 0.3, -ly * R * 0.3 - R * 0.18, R * 0.3, [255, 255, 255], 0.22 * a);
        ctx.restore();
    }
    // 서 있는 동전 — 가장자리가 위를 향해 옆에서 본 모습(너비 2R, 높이 thick)
    function drawEdge(cx, cy, R, thick, a) {
        const g = ctx.createLinearGradient(0, cy - thick / 2, 0, cy + thick / 2);
        g.addColorStop(0, rgba(RIM_HI, a));
        g.addColorStop(1, rgba(RIM_LO, a));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.roundRect(cx - R, cy - thick / 2, R * 2, thick, Math.min(thick / 2, 4));
        ctx.fill();
    }
    // ── 공통 틀 ───────────────────────────────────────────────
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 한 판 시연이 끝났음을 스크린리더에 한 번만 알린다 — 판이 되풀이돼도 다시 읽지 않는다
    let doneSaid = false;
    function checkDone() {
        if (!doneSaid && sceneT >= RESULT_S) {
            doneSaid = true;
            doneP.textContent = statusText();
        }
    }
    function advance(dt) {
        sceneT += dt;
        while (evAt < script.length && script[evAt].t <= sceneT) {
            const ev = script[evAt];
            evAt += 1;
            ev.f();
        }
        if (sceneT >= LAP_S) {
            lap += 1;
            begin();
            return;
        }
        update(dt);
    }
    // 첫 판은 START_S 만큼 앞서 시작한다 — 동전이 이미 돌고 있는 장면에서 보인다
    function runTo(t) {
        while (sceneT < t - 1e-6) {
            advance(Math.min(1 / 30, t - sceneT));
        }
    }
    function begin() {
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        if (lap === 0 && !still) {
            runTo(START_S);
        }
    }
    const DT_MAX = 0.05;
    function showNow() {
        draw();
        pushStatus(statusText());
        checkDone();
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        showNow();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 던진 결과 한 장. 회전 없이 결과 면이 나온 장면에서 멈춘다
    function showRest() {
        stopLoop();
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        runTo(REST_S);
        doneSaid = false;
        showNow();
    }
    function play() {
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    // 던지기 — 새 수열로 처음부터 다시. 움직임 줄이기에서는 새 결과 한 장
    function restart() {
        lap += 1;
        doneSaid = false;
        if (still) {
            showRest();
            return;
        }
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    // 한 걸음 — 멈춘 채 시간표의 다음 일 하나까지 시계를 보낸다. 더 부를 일이 없으면 다음 던지기를 연다
    function stepOnce() {
        wake();
        if (!paused) {
            paused = true;
            pauseBtn.setAttribute('aria-pressed', 'true');
            stopLoop();
        }
        if (evAt >= script.length) {
            restart();
            return;
        }
        runTo(script[evAt].t + 0.05);
        showNow();
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    stepBtn.addEventListener('click', stepOnce, { signal: off.signal });
    // 키보드 — 무대에 포커스가 있을 때만. Enter·Space 는 던지기, P 는 일시정지, N 은 한 걸음, R 은 다시
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        const k = e.key;
        if (k === 'Enter' || k === ' ') {
            e.preventDefault();
            wake();
            restart();
        }
        else if (k === 'p' || k === 'P') {
            togglePause();
        }
        else if (k === 'n' || k === 'N') {
            stepOnce();
        }
        else if (k === 'r' || k === 'R') {
            wake();
            restart();
        }
    }, { signal: off.signal });
    // 마우스·터치 — 무대를 누르면 던진다
    pad.addEventListener('click', function () {
        wake();
        restart();
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 결과 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            lap = 0;
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        showNow();
    }, { signal: off.signal });
    // ── 07 같은 면이 이어질 때 길이가 자라는 연속 띠 ───────────────────────────────────
    // 던진 결과를 칸 하나씩 띠에 칠한다. 같은 면이 이어지는 구간의 길이 cellRun 을 세고 가장 긴 연속(RUN_MAX)에 굵은 테두리를 두른다.
    // 아래 띠는 같은 길이로 사람이 손으로 지어낸 수열 — 같은 면을 세 칸 넘게 잇지 않는다
    const STRIP_N = 200;
    const SEED = 7003;
    const CELL_GAP = 0.018;
    const T_START = 0.25;
    const COLS = 40;
    const CW = 11;
    const CH = 13;
    const LAP_S = 9.0;
    const START_S = 1.0;
    const REST_S = 5.6;
    const RESULT_S = 5.4;
    // SIM-BEGIN
    // 칸마다 그 칸에서 끝나는 연속 길이
    function cellRun(seq) {
        const out = [];
        for (let i = 0; i < seq.length; i += 1) {
            out.push(i > 0 && seq[i] === seq[i - 1] ? out[i - 1] + 1 : 1);
        }
        return out;
    }
    // 가장 긴 연속의 끝 칸 번호(앞쪽 우선)
    function runEnd(seq, upto) {
        const r = cellRun(seq);
        let best = -1;
        let bl = 0;
        for (let i = 0; i < upto; i += 1) {
            if (r[i] > bl) {
                bl = r[i];
                best = i;
            }
        }
        return best;
    }
    // 사람이 지어낸 수열 — 앞 칸과 같은 면을 고를 확률은 30% 이고, 이미 세 칸 이어졌으면 반드시 바꾼다
    function handMade(seed, n) {
        const rng = seeded(seed);
        const out = [];
        let run = 0;
        for (let i = 0; i < n; i += 1) {
            const prev = i > 0 ? out[i - 1] : 1;
            let next = rng() < 0.3 ? prev : 1 - prev;
            if (i > 0 && next === prev && run >= 3) {
                next = 1 - prev;
            }
            run = (i > 0 && next === prev) ? run + 1 : 1;
            out.push(next);
        }
        return out;
    }
    // SIM-END
    let real = [];
    let human = [];
    function build() {
        real = outcomes(SEED + lap, STRIP_N, 0.5);
        human = handMade(SEED + 77 + lap, STRIP_N);
    }
    function update(dt) { if (dt < 0) {
        return;
    } }
    function nShown() { return clamp(Math.floor((sceneT - T_START) / CELL_GAP) + 1, 0, STRIP_N); }
    function cellXY(i, y0) { return [20 + (i % COLS) * CW, y0 + Math.floor(i / COLS) * CH]; }
    function strip(seq, y0, outlineRun, label, labelBg) {
        const n = nShown();
        const runs = cellRun(seq);
        box(14, y0 - 6, COLS * CW + 12, 5 * CH + 12, 8, [255, 255, 255], 0.65);
        for (let i = 0; i < STRIP_N; i += 1) {
            const p = cellXY(i, y0);
            if (i >= n) {
                box(p[0] + 1, p[1] + 1, CW - 2, CH - 2, 3, [235, 230, 245], 0.8);
                continue;
            }
            const age = clamp((sceneT - (T_START + i * CELL_GAP)) / 0.12, 0, 1);
            const s = 0.55 + 0.45 * ease(age);
            box(p[0] + 1 + (CW - 2) * (1 - s) / 2, p[1] + 1 + (CH - 2) * (1 - s) / 2, (CW - 2) * s, (CH - 2) * s, 3, seq[i] === 0 ? GOLD : SKY, 1);
        }
        // 가장 긴 연속 — 지금까지 칠한 칸 안에서 굵은 테두리
        const e = runEnd(seq, n);
        if (e >= 0) {
            const len = runs[e];
            for (let j = e - len + 1; j <= e; j += 1) {
                const p = cellXY(j, y0);
                outline(p[0] + 0.5, p[1] + 0.5, CW - 1, CH - 1, 3, 2.2, outlineRun ? ROSE_DEEP : INK, 1);
            }
            tag(label.replace('{m}', String(len)), 20 + COLS * CW, y0 + 5 * CH + 13, labelBg, INK, 11, 'right');
        }
    }
    function statusText() {
        const n = nShown();
        const re = runEnd(real, n);
        const he = runEnd(human, n);
        return '{n}번 던짐 · 던진 수열 가장 긴 연속 {a} · 지어낸 수열 {b}'.replace('{n}', String(n)).replace('{a}', String(re >= 0 ? cellRun(real)[re] : 0)).replace('{b}', String(he >= 0 ? cellRun(human)[he] : 0));
    }
    function draw() {
        skyFill(BG_TOP, BG_BOT);
        strip(real, 66, true, '던진 수열 · 가장 긴 연속 {m}', ROSE);
        strip(human, 174, false, '지어낸 수열 · 가장 긴 연속 {m}', MINT);
    }
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
