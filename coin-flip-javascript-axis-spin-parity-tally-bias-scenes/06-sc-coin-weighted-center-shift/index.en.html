<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Weighted Coin Whose Ratio Leans Toward One Face — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="Coin flip stage: Enter, Space or a click tosses, P pauses, N steps once, R restarts">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="A fair coin and a coin with shifted weight are thrown from the same sequence. Both hop and flip every 0.1 seconds, and the bars below pile up the heads and tails shares. The fair coin gathers near 5 to 5 while the weighted coin piles up a higher heads share"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">Coin flip demo</p>
  <div class="vj__ctrl">
    <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
    <button class="vj__step" data-role="step" type="button">Step</button>
  </div>
  <p class="vj__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const PI = Math.PI;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 선형 합동 생성기(곱 1664525, 더함 1013904223). 같은 시드면 같은 수열
    function seeded(seed) {
        let s = (seed >>> 0) || 1;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 파스텔 팔레트 — 앞면은 금빛, 뒷면은 하늘빛, 치우침·경고는 분홍
    const BG_TOP = [250, 246, 252];
    const BG_BOT = [228, 234, 250];
    const TABLE_TOP = [240, 226, 238];
    const TABLE_BOT = [222, 208, 236];
    const GOLD = [250, 226, 150];
    const GOLD_DEEP = [196, 150, 52];
    const SKY = [176, 210, 246];
    const SKY_DEEP = [74, 120, 176];
    const RIM_LO = [184, 156, 100];
    const RIM_HI = [255, 248, 222];
    const ROSE = [240, 150, 176];
    const ROSE_DEEP = [190, 52, 86];
    const MINT = [150, 214, 190];
    const MINT_DEEP = [22, 112, 82];
    const LAV = [188, 172, 236];
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 장면 시계(초)·판 반복 번호·시간표 — 시간표는 (시각, 할 일) 목록이고 시각이 지나면 한 번씩 부른다
    let sceneT = 0;
    let lap = 0;
    let script = [];
    let evAt = 0;
    function tossHalf(k, t) { return k.h0 + k.hr * clamp(t - k.t0, 0, k.T); }
    function landHalf(k) { return k.h0 + k.hr * k.T; }
    function tossXY(k, t) {
        const u = clamp((t - k.t0) / k.T, 0, 1);
        return [lerp(k.x0, k.x1, u), lerp(k.y0, k.y1, u) - 4 * k.peak * u * (1 - u)];
    }
    // 착지한 뒤 — 가장 가까운 평평한 각(Half turns 반올림)으로 감쇠 진동하며 눕는다
    function halfAt(k, t) {
        const q = t - (k.t0 + k.T);
        if (q <= 0) {
            return tossHalf(k, t);
        }
        const hl = landHalf(k);
        const hf = Math.round(hl);
        return hf + (hl - hf) * Math.exp(-9 * q) * Math.cos(26 * q);
    }
    function hopLift(k, t) {
        const q = t - (k.t0 + k.T);
        return q <= 0 ? 0 : 12 * Math.exp(-7 * q) * Math.abs(Math.sin(15 * q));
    }
    // 위로 온 면 — 반 바퀴 수를 반올림해 짝수면 던지기 전 면(0), 홀수면 반대 면(1)
    function upFace(h) { return Math.abs(Math.round(h)) % 2; }
    // 원하는 면이 나오도록 반 바퀴 수를 고른다 — even + 면 번호, 소수 부분은 ±0.2 안에서 흔든다
    function halfFor(face, rng, minPairs) {
        return 2 * (minPairs + Math.floor(rng() * 3)) + face + (rng() - 0.5) * 0.4;
    }
    // 같은 수열에서 Heads(0)과 Tails(1) — 값이 p 보다 작으면 Heads
    function outcomes(seed, n, p) {
        const rng = seeded(seed);
        const out = [];
        for (let i = 0; i < n; i += 1) {
            out.push(rng() < p ? 0 : 1);
        }
        return out;
    }
    // 가장 긴 연속 길이
    function longestRun(seq) {
        let best = 0;
        let cur = 0;
        for (let i = 0; i < seq.length; i += 1) {
            cur = (i > 0 && seq[i] === seq[i - 1]) ? cur + 1 : 1;
            if (cur > best) {
                best = cur;
            }
        }
        return best;
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const stepEl = root.querySelector('[data-role="step"]');
    const doneEl = root.querySelector('[data-role="done"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !stepEl || !doneEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const stepBtn = stepEl;
    const doneP = doneEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function skyFill(top, bot) {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bot, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function oval(x, y, rx, ry, c, a) {
        if (rx <= 0.2 || ry <= 0.1 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function seg(x1, y1, x2, y2, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function outline(x, y, w, h, r, width, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 글자 이름표 — 바탕 알약 위에 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    // 탁자 — 위쪽 가장자리 높이 y 부터 아래까지
    function tableBack(y) {
        const g = ctx.createLinearGradient(0, y, 0, H);
        g.addColorStop(0, rgba(TABLE_TOP, 1));
        g.addColorStop(1, rgba(TABLE_BOT, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, y, W, H - y);
        seg(0, y + 0.5, W, y + 0.5, 1.5, [255, 255, 255], 0.7);
    }
    // ── 동전 그리기 ───────────────────────────────────────────
    // 동전은 원판이다. 가로축으로 th 만큼 돌면 위쪽 원판은 세로 반지름이 R·|cos th| 인 타원으로 보이고,
    // cos th 의 부호가 음수가 되는 순간 보이는 면이 바뀐다(앞/뒤 판정은 법선의 부호 하나).
    // 옆면은 둘레를 RIM_N 조각으로 나눠, 조각 법선과 빛 방향(lx, ly, lz)의 내적으로 밝기를 정한다
    const RIM_N = 40;
    function faceArt(face, R, a) {
        const base = face === 0 ? GOLD : SKY;
        const deep = face === 0 ? GOLD_DEEP : SKY_DEEP;
        disc(0, 0, R, base, a);
        ring(0, 0, R * 0.84, R * 0.07, deep, a);
        for (let k = 0; k < 14; k += 1) {
            disc(Math.cos(k * TAU / 14) * R * 0.93, Math.sin(k * TAU / 14) * R * 0.93, R * 0.03, deep, a * 0.8);
        }
        if (face === 0) {
            // 별 — 바깥 반지름 0.5R, 안쪽 0.2R
            ctx.beginPath();
            for (let k = 0; k < 10; k += 1) {
                const rr = (k % 2 === 0 ? 0.5 : 0.21) * R;
                const an = -PI / 2 + k * PI / 5;
                if (k === 0) {
                    ctx.moveTo(Math.cos(an) * rr, Math.sin(an) * rr);
                }
                else {
                    ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr);
                }
            }
            ctx.closePath();
            ctx.fillStyle = rgba(deep, a);
            ctx.fill();
        }
        else {
            // 초승달과 점 세 개
            disc(-R * 0.05, -R * 0.08, R * 0.44, deep, a);
            disc(R * 0.14, -R * 0.14, R * 0.38, base, a);
            for (let k = 0; k < 3; k += 1) {
                disc((k - 1) * R * 0.24, R * 0.52, R * 0.06, deep, a);
            }
        }
    }
    function coinShadow(cx, gy, R, lift, a) {
        const k = clamp(lift / 260, 0, 0.75);
        oval(cx, gy, R * (1.02 - k * 0.5), R * (1.02 - k * 0.5) * 0.26, INK, a * 0.26 * (1 - k));
    }
    function drawCoin(cx, cy, R, th, thick, lx, ly, lz, a, startFace) {
        const c = Math.cos(th);
        const s = Math.sin(th);
        const sg = c >= 0 ? 1 : -1;
        const ac = Math.max(Math.abs(c), 0.012);
        const half = thick / 2;
        const near = -sg * s * half;
        const far = -near;
        const nearFace = sg > 0 ? startFace : 1 - startFace;
        if (thick > 0) {
            oval(cx, cy + far, R, R * ac, RIM_LO, a);
            for (let k = 0; k < RIM_N; k += 1) {
                const p0 = k * TAU / RIM_N;
                const p1 = (k + 1) * TAU / RIM_N;
                const pm = (p0 + p1) / 2;
                if (Math.sin(pm) * s <= 0) {
                    continue;
                }
                const dot = Math.cos(pm) * lx + Math.sin(pm) * c * ly + Math.sin(pm) * s * lz;
                const col = mix(RIM_LO, RIM_HI, clamp(0.5 + 0.5 * dot, 0, 1));
                const x0 = cx + R * Math.cos(p0);
                const x1 = cx + R * Math.cos(p1);
                const y0 = R * Math.sin(p0) * c;
                const y1 = R * Math.sin(p1) * c;
                ctx.beginPath();
                ctx.moveTo(x0, cy + near + y0);
                ctx.lineTo(x1, cy + near + y1);
                ctx.lineTo(x1, cy + far + y1);
                ctx.lineTo(x0, cy + far + y0);
                ctx.closePath();
                ctx.fillStyle = rgba(col, a);
                ctx.fill();
                ctx.lineWidth = 0.8;
                ctx.strokeStyle = rgba(col, a);
                ctx.stroke();
            }
        }
        ctx.save();
        ctx.translate(cx, cy + near);
        ctx.scale(1, ac);
        faceArt(nearFace, R, a);
        // 빛 쪽으로 쏠린 윤기
        disc(lx * R * 0.3, -ly * R * 0.3 - R * 0.18, R * 0.3, [255, 255, 255], 0.22 * a);
        ctx.restore();
    }
    // 서 있는 동전 — 가장자리가 위를 향해 옆에서 본 모습(너비 2R, 높이 thick)
    function drawEdge(cx, cy, R, thick, a) {
        const g = ctx.createLinearGradient(0, cy - thick / 2, 0, cy + thick / 2);
        g.addColorStop(0, rgba(RIM_HI, a));
        g.addColorStop(1, rgba(RIM_LO, a));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.roundRect(cx - R, cy - thick / 2, R * 2, thick, Math.min(thick / 2, 4));
        ctx.fill();
    }
    // ── 공통 틀 ───────────────────────────────────────────────
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 한 판 시연이 끝났음을 스크린리더에 한 번만 알린다 — 판이 되풀이돼도 다시 읽지 않는다
    let doneSaid = false;
    function checkDone() {
        if (!doneSaid && sceneT >= RESULT_S) {
            doneSaid = true;
            doneP.textContent = statusText();
        }
    }
    function advance(dt) {
        sceneT += dt;
        while (evAt < script.length && script[evAt].t <= sceneT) {
            const ev = script[evAt];
            evAt += 1;
            ev.f();
        }
        if (sceneT >= LAP_S) {
            lap += 1;
            begin();
            return;
        }
        update(dt);
    }
    // 첫 판은 START_S 만큼 앞서 시작한다 — 동전이 이미 돌고 있는 장면에서 보인다
    function runTo(t) {
        while (sceneT < t - 1e-6) {
            advance(Math.min(1 / 30, t - sceneT));
        }
    }
    function begin() {
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        if (lap === 0 && !still) {
            runTo(START_S);
        }
    }
    const DT_MAX = 0.05;
    function showNow() {
        draw();
        pushStatus(statusText());
        checkDone();
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        showNow();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 던진 결과 한 장. 회전 없이 결과 면이 나온 장면에서 멈춘다
    function showRest() {
        stopLoop();
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        runTo(REST_S);
        doneSaid = false;
        showNow();
    }
    function play() {
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    // 던지기 — 새 수열로 처음부터 다시. 움직임 줄이기에서는 새 결과 한 장
    function restart() {
        lap += 1;
        doneSaid = false;
        if (still) {
            showRest();
            return;
        }
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    // Step — 멈춘 채 시간표의 다음 일 하나까지 시계를 보낸다. 더 부를 일이 없으면 다음 던지기를 연다
    function stepOnce() {
        wake();
        if (!paused) {
            paused = true;
            pauseBtn.setAttribute('aria-pressed', 'true');
            stopLoop();
        }
        if (evAt >= script.length) {
            restart();
            return;
        }
        runTo(script[evAt].t + 0.05);
        showNow();
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    stepBtn.addEventListener('click', stepOnce, { signal: off.signal });
    // 키보드 — 무대에 포커스가 있을 때만. Enter·Space 는 던지기, P 는 Pause, N 은 Step, R 은 다시
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        const k = e.key;
        if (k === 'Enter' || k === ' ') {
            e.preventDefault();
            wake();
            restart();
        }
        else if (k === 'p' || k === 'P') {
            togglePause();
        }
        else if (k === 'n' || k === 'N') {
            stepOnce();
        }
        else if (k === 'r' || k === 'R') {
            wake();
            restart();
        }
    }, { signal: off.signal });
    // 마우스·터치 — 무대를 누르면 던진다
    pad.addEventListener('click', function () {
        wake();
        restart();
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 결과 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            lap = 0;
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        showNow();
    }, { signal: off.signal });
    // ── 06 무게중심을 옮긴 동전이 한쪽으로 쏠리는 비율 ─────────────────────────────────
    // 같은 수열(값 u)로 두 동전을 던진다. 보통 동전은 u < 0.5 이면 Heads, 치우친 동전은 u < headsP(BIAS_OFFSET) 이면 Heads
    const TOSS_N = 100;
    const SEED = 6056;
    const BIAS_OFFSET = 0.1;
    const TOSS_GAP = 0.1;
    const T_START = 0.3;
    const COIN_R = 50;
    const LAP_S = 11.6;
    const START_S = 1.9;
    const REST_S = 11.0;
    const RESULT_S = 10.8;
    // SIM-BEGIN
    // 치우친 동전의 앞면이 위로 올 확률 — 무거운 뒷면이 아래로 내려앉는 각의 몫이라 5:5 에 쏠림(지름 대비)의 절반을 더한다
    function headsP(bias) { return 0.5 + bias * 0.5; }
    function pairSeq(seed, n, bias) {
        const rng = seeded(seed);
        const fair = [];
        const heavy = [];
        const p = headsP(bias);
        for (let i = 0; i < n; i += 1) {
            const u = rng();
            fair.push(u < 0.5 ? 0 : 1);
            heavy.push(u < p ? 0 : 1);
        }
        return [fair, heavy];
    }
    function headsOf(seq, n) {
        let c = 0;
        for (let i = 0; i < n; i += 1) {
            if (seq[i] === 0) {
                c += 1;
            }
        }
        return c;
    }
    // SIM-END
    let fairSeq = [];
    let heavySeq = [];
    function build() {
        const pr = pairSeq(SEED + lap, TOSS_N, BIAS_OFFSET);
        fairSeq = pr[0];
        heavySeq = pr[1];
    }
    function update(dt) { if (dt < 0) {
        return;
    } }
    function nShown() { return clamp(Math.floor((sceneT - T_START) / TOSS_GAP) + 1, 0, TOSS_N); }
    // 한 번의 작은 던지기 — 0.1초 안에 위로 튀며 Half turns 짝/홀로 면이 정해진다
    function coinHalf(seq, n) {
        // n 번째까지 쌓인 Half turns — 던질 때마다 (면이 바뀌면 odd, 같으면 even) 만큼 더한다
        let h = 0;
        for (let i = 0; i < n; i += 1) {
            const prev = i > 0 ? seq[i - 1] : 0;
            h += 2 + (seq[i] !== prev ? 1 : 0);
        }
        return h;
    }
    function drawOne(cx, seq, weighted, label) {
        const n = nShown();
        const u = n > 0 ? clamp((sceneT - (T_START + (n - 1) * TOSS_GAP)) / TOSS_GAP, 0, 1) : 1;
        const prevN = Math.max(n - 1, 0);
        const hBase = coinHalf(seq, prevN);
        const hNow = n > 0 ? hBase + (coinHalf(seq, n) - hBase) * ease(u) : 0;
        const lift = 14 * Math.sin(PI * u) * (n > 0 && n < TOSS_N + 1 ? 1 : 0);
        coinShadow(cx, 206, COIN_R, lift * 3, 1);
        drawCoin(cx, 150 - lift, COIN_R, PI * hNow, 8, 0.36, -0.46, 0.81, 1, 0);
        if (weighted) {
            // 무게중심 — 지름의 BIAS_OFFSET 배만큼 한쪽으로 쏠린 점
            disc(cx, 150 - lift + BIAS_OFFSET * 2 * COIN_R, 5, ROSE_DEEP, 1);
            ring(cx, 150 - lift + BIAS_OFFSET * 2 * COIN_R, 8, 1.5, ROSE_DEEP, 0.7);
        }
        tag(label, cx, 72, weighted ? ROSE : MINT, INK, 11, 'center');
        const h = headsOf(seq, n);
        const bw = 190;
        const bx = cx - bw / 2;
        box(bx, 222, bw, 28, 10, SKY, 1);
        const hw = n > 0 ? bw * h / n : bw / 2;
        box(bx, 222, hw, 28, 10, GOLD, 1);
        seg(cx, 218, cx, 254, 2, INK, 0.7);
        tag('Heads {r}'.replace('{r}', n > 0 ? (h / n).toFixed(2) : '0.00'), cx, 268, PAPER, INK, 12, 'center');
    }
    function draw() {
        skyFill(BG_TOP, BG_BOT);
        tableBack(200);
        drawOne(124, fairSeq, false, 'Fair coin');
        drawOne(356, heavySeq, true, 'Weighted coin');
        const n = nShown();
        tag('{n} tosses'.replace('{n}', String(n)), 240, 289, PAPER, INK, 11, 'center');
    }
    function statusText() {
        const n = nShown();
        const a = n > 0 ? headsOf(fairSeq, n) / n : 0;
        const b = n > 0 ? headsOf(heavySeq, n) / n : 0;
        return '{n} tosses - fair coin heads {a} - weighted coin heads {b}'.replace('{n}', String(n)).replace('{a}', a.toFixed(2)).replace('{b}', b.toFixed(2));
    }
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
