<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>색온도 그라디언트 슬라이더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ct" id="ct">
  <p class="ct__hint">값 비율을 HSL 색상으로 매 프레임 환산해 트랙과 썸을 차가운 파랑에서 따뜻한 주황으로 물들입니다</p>
  <div class="ct__wrap" id="ctWrap" role="img" aria-label="값에 따라 색온도가 파랑에서 주황으로 바뀌는 슬라이더 장면">
    <input class="ct__range" id="ctRange" type="range" min="0" max="100" step="1" value="50" aria-label="색온도">
  </div>
  <p class="ct__meta"><b class="ct__tag" id="ctHue">hue 122</b><span class="ct__unit">HSL 보간</span></p>
</div>
</main>
<script>
// 색온도 그라디언트(08, 아이디어형) — 값 비율(0~1)을 hue 로 선형 보간한다.
// 차가운 파랑(HUE_COLD=210) → 따뜻한 주황(HUE_WARM=28). 매 프레임 --hue·--sat
// CSS 커스텀 프로퍼티를 갱신해 트랙 채움색과 썸 배경이 값과 함께 실시간으로
// 물든다. CSS @keyframes 는 없다 — 색은 매 프레임 계산으로 나온다.
(function () {
  var root = document.getElementById('ct');
  var wrap = document.getElementById('ctWrap');
  var range = document.getElementById('ctRange');
  var hueEl = document.getElementById('ctHue');
  if (!root || !wrap || !range || !hueEl) return;

  var MIN = 0, MAX = 100;
  var HUE_COLD = 210, HUE_WARM = 28;
  var SAT_MIN = 55, SAT_MAX = 78;
  var TAU = 0.14;

  function paint(v) {
    var ratio = (v - MIN) / (MAX - MIN);
    var hue = HUE_COLD + (HUE_WARM - HUE_COLD) * ratio;
    var sat = SAT_MIN + (SAT_MAX - SAT_MIN) * ratio;
    wrap.style.setProperty('--pct', (ratio * 100).toFixed(2));
    wrap.style.setProperty('--hue', hue.toFixed(1));
    wrap.style.setProperty('--sat', sat.toFixed(1));
    hueEl.textContent = 'hue ' + Math.round(hue);
    range.setAttribute('aria-valuenow', String(Math.round(v)));
  }

  var current = 50;
  paint(current);

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var playing = true;
  function stop() { playing = false; }
  range.addEventListener('pointerdown', stop);
  range.addEventListener('keydown', stop);
  range.addEventListener('input', function () { current = Number(range.value); paint(current); });

  var targets = [50, 5, 92, 18, 78, 50];
  var seg = 0, segFrom = current;
  var SEG_MS = 400;
  var segStart = performance.now();

  if (reduce) {
    current = targets[0];
    range.value = String(current);
    paint(current);
  } else {
    (function step(now) {
      if (playing) {
        var elapsed = now - segStart;
        if (elapsed >= SEG_MS) {
          seg = (seg + 1) % targets.length;
          segStart = now; elapsed = 0; segFrom = current;
        }
        var target = targets[seg];
        var t = elapsed / 1000;
        var k = 1 - Math.exp(-t / TAU);
        current = segFrom + (target - segFrom) * k;
        range.value = String(Math.round(current));
        paint(current);
      }
      requestAnimationFrame(step);
    })(segStart);
  }
})();
</script>
</body>
</html>
