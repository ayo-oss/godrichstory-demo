<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fill gloss — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fg" id="fg">
  <p class="fg__hint">The fill is clipped to the value ratio, and background-clip confines the diagonal highlight so it only sweeps inside that fill</p>
  <div class="fg__track" id="fgTrack" role="img" aria-label="Fill-slider scene where a gloss sweep flows along the edge of the fill">
    <div class="fg__fill" id="fgFill"><div class="fg__gloss"></div></div>
    <div class="fg__thumb" id="fgThumb"></div>
    <input class="fg__range" id="fgRange" type="range" min="0" max="100" step="1" value="50" aria-label="Value slider">
  </div>
  <p class="fg__meta"><b class="fg__tag" id="fgPct">50%</b><span class="fg__unit">Fill · gloss stays inside the fill only</span></p>
</div>
</main>
<script>
// 필 광택(04) — 네이티브 input 은 투명하게 겹쳐 실제 조작만 받고, 시각은 아래 채움
// div 가 맡는다(트랙·썸 anatomy 의 경계 — pseudo-element 만으로는 background-clip 가둠과
// 사선 sweep 을 함께 표현하기 어렵다). 채움 폭은 --pct, 광택 위치는 --sweep 로 매 프레임
// 다시 계산해 background-position 에 대입한다. CSS @keyframes 는 없다.
(function () {
  var root = document.getElementById('fg');
  var track = document.getElementById('fgTrack');
  var fill = document.getElementById('fgFill');
  var thumb = document.getElementById('fgThumb');
  var range = document.getElementById('fgRange');
  var pctEl = document.getElementById('fgPct');
  if (!root || !track || !fill || !thumb || !range || !pctEl) return;

  var MIN = 0, MAX = 100;
  var TAU = 0.14;
  var SWEEP_PERIOD = 1.1; // s — 광택이 채움 안을 한 번 가로지르는 주기

  function paint(v, sweepPhase) {
    var pct = (v - MIN) / (MAX - MIN) * 100;
    track.style.setProperty('--pct', pct.toFixed(2));
    track.style.setProperty('--sweep', (sweepPhase * 100).toFixed(2));
    pctEl.textContent = Math.round(pct) + '%';
    range.setAttribute('aria-valuenow', String(Math.round(v)));
  }

  var current = 50;
  paint(current, 0);

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var playing = true;
  function stop() { playing = false; }
  range.addEventListener('pointerdown', stop);
  range.addEventListener('keydown', stop);
  range.addEventListener('input', function () {
    current = Number(range.value);
  });

  var targets = [50, 22, 78, 40, 90, 50];
  var seg = 0, segFrom = current;
  var SEG_MS = 400;
  var segStart = performance.now();
  var start = segStart;

  if (reduce) {
    current = targets[0];
    range.value = String(current);
    paint(current, 0);
  } else {
    (function step(now) {
      if (playing) {
        var elapsed = now - segStart;
        if (elapsed >= SEG_MS) {
          seg = (seg + 1) % targets.length;
          segStart = now; elapsed = 0; segFrom = current;
        }
        var target = targets[seg];
        var t = elapsed / 1000;
        var k = 1 - Math.exp(-t / TAU);
        current = segFrom + (target - segFrom) * k;
        range.value = String(Math.round(current));
      }
      var sweepT = ((now - start) / 1000) % SWEEP_PERIOD / SWEEP_PERIOD;
      paint(current, sweepT);
      requestAnimationFrame(step);
    })(start);
  }
})();
</script>
</body>
</html>
