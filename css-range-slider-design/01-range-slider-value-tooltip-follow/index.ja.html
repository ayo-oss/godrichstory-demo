<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>値ツールチップ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vt" id="vt">
  <p class="vt__hint">パーセントを計算してCSS変数に入れると、ツールチップがサムにそのまま追従します</p>
  <div class="vt__wrap" id="vtWrap" role="img" aria-label="値が変わるたびにツールチップラベルがサムと一緒に移動する場面">
    <div class="vt__bubble" id="vtBubble"><span id="vtVal">50</span></div>
    <input class="vt__range" id="vtRange" type="range" min="0" max="100" step="1" value="50" aria-label="値スライダー">
  </div>
  <p class="vt__meta"><b class="vt__tag" id="vtCalc">50.0%</b><span class="vt__unit">calcで求めたツールチップ位置</span></p>
</div>
</main>
<script>
// 값 풍선(01) — (value - min) / (max - min) * 100 을 --pct 로 내려 풍선의 left 를
// calc(var(--pct) * 1%) 로 계산한다. 풍선 폭의 절반만큼 안쪽으로 당기는 오프셋 보정을
// 넣어 0%·100% 에서도 풍선이 트랙 밖으로 삐져나가지 않게 한다. CSS @keyframes 는 없다 —
// 자동 시연은 목표값 사이를 지수 감쇠로 부드럽게 접근하는 requestAnimationFrame 루프다.
(function () {
  var root = document.getElementById('vt');
  var wrap = document.getElementById('vtWrap');
  var bubble = document.getElementById('vtBubble');
  var valEl = document.getElementById('vtVal');
  var calcEl = document.getElementById('vtCalc');
  var range = document.getElementById('vtRange');
  if (!root || !wrap || !bubble || !valEl || !calcEl || !range) return;

  var MIN = 0, MAX = 100;
  var TAU = 0.11; // 지수 감쇠 시간상수(秒) — 값 접근 속도
  var current = 50;

  function paint(v) {
    var pct = (v - MIN) / (MAX - MIN) * 100;
    wrap.style.setProperty('--pct', pct.toFixed(2));
    valEl.textContent = String(Math.round(v));
    calcEl.textContent = pct.toFixed(1) + '%';
    range.setAttribute('aria-valuenow', String(Math.round(v)));
  }
  paint(current);

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function onUserInput() {
    stop();
    current = Number(range.value);
    paint(current);
  }
  range.addEventListener('input', onUserInput);
  range.addEventListener('pointerdown', stop);
  range.addEventListener('keydown', stop);

  var targets = [50, 18, 82, 35, 92, 50]; // 마지막 = 처음, 루프가 이어 붙는다
  var seg = 0, playing = true;

  function stop() { playing = false; }

  if (reduce) {
    current = targets[0];
    range.value = String(current);
    paint(current);
  } else {
    var segStart = performance.now();
    var segFrom = current;
    var SEG_MS = 400;
    (function step(now) {
      if (playing) {
        var elapsed = now - segStart;
        if (elapsed >= SEG_MS) {
          seg = (seg + 1) % targets.length;
          segStart = now;
          segFrom = current;
          elapsed = 0;
        }
        var target = targets[seg];
        var t = elapsed / 1000;
        var k = 1 - Math.exp(-t / TAU);
        current = segFrom + (target - segFrom) * k;
        range.value = String(Math.round(current));
        paint(current);
      }
      requestAnimationFrame(step);
    })(segStart);
  }
})();
</script>
</body>
</html>
