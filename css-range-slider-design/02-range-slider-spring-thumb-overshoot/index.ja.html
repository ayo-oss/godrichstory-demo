<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スプリングオーバーシュート — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="so" id="so">
  <p class="so__hint">値が変わるたびに、スプリング減衰方程式でサムが少し弾んで落ち着きます</p>
  <div class="so__wrap" id="soWrap" role="img" aria-label="値が変わるたびにサムが弾んで落ち着くスプリングオーバーシュートの場面">
    <input class="so__range" id="soRange" type="range" min="0" max="100" step="1" value="50" aria-label="値スライダー">
  </div>
  <p class="so__meta"><b class="so__tag" id="soScale">1.000</b><span class="so__unit">スケール = -k(目標-現在) - c·速度 の積分</span></p>
</div>
</main>
<script>
// 스프링 오버슈트(02) — 값이 바뀌는 순간 썸 스케일에 속도 킥을 넣고, 매 프레임
// accel = -k*(scale-1) - c*velocity 를 적분해 감쇠 진동을 만든다. k·c 두 계수만으로
// 튕김의 세기와 빠르기가 정해진다. CSS @keyframes·transition 은 없다 — 위치와 스케일
// 둘 다 requestAnimationFrame 이 매 프레임 다시 계산해 그린다.
(function () {
  var root = document.getElementById('so');
  var wrap = document.getElementById('soWrap');
  var range = document.getElementById('soRange');
  var scaleEl = document.getElementById('soScale');
  if (!root || !wrap || !range || !scaleEl) return;

  var MIN = 0, MAX = 100;
  var K = 170, C = 14; // 스프링 상수 · 감쇠 계수 (임계감쇠비 약 0.54 — 12~14% 오버슈트)
  var KICK = 9; // 값이 바뀔 때 스케일 속도에 주는 충격량

  var pos = 50;      // 트랙 위 표시 값(0~100)
  var scale = 1;
  var vel = 0;

  function paint() {
    var pct = (pos - MIN) / (MAX - MIN) * 100;
    wrap.style.setProperty('--pct', pct.toFixed(2));
    wrap.style.setProperty('--scale', scale.toFixed(4));
    range.setAttribute('aria-valuenow', String(Math.round(pos)));
    scaleEl.textContent = scale.toFixed(3);
  }
  paint();

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var playing = true;
  function stop() { playing = false; }
  range.addEventListener('pointerdown', stop);
  range.addEventListener('keydown', stop);
  range.addEventListener('input', function () {
    pos = Number(range.value);
    vel += KICK;
    paint();
  });

  var targets = [50, 15, 85, 40, 95, 50];
  var seg = 0, posFrom = pos;
  var SEG_MS = 400;
  var segStart = performance.now();
  var last = segStart;

  if (reduce) {
    pos = targets[0];
    range.value = String(pos);
    scale = 1; vel = 0;
    paint();
  } else {
    (function step(now) {
      var dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      if (playing) {
        var elapsed = now - segStart;
        if (elapsed >= SEG_MS) {
          seg = (seg + 1) % targets.length;
          segStart = now; elapsed = 0; posFrom = pos;
          vel += KICK; // 목표가 바뀔 때마다 튕김 킥
        }
        var target = targets[seg];
        var t = elapsed / SEG_MS;
        pos = posFrom + (target - posFrom) * t;
        range.value = String(Math.round(pos));
      }
      var acc = -K * (scale - 1) - C * vel;
      vel += acc * dt;
      scale += vel * dt;
      paint();
      requestAnimationFrame(step);
    })(segStart);
  }
})();
</script>
</body>
</html>
