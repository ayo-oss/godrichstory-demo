<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drag inertia — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="di" id="di">
  <p class="di__hint">From the moment you release, velocity is multiplied by 0.90 every frame so it glides like ice and stops</p>
  <div class="di__wrap" id="diWrap" role="img" aria-label="Scene of a slider gliding on inertia, decelerating, and stopping">
    <input class="di__range" id="diRange" type="range" min="0" max="100" step="1" value="50" aria-label="Value slider">
  </div>
  <p class="di__meta"><b class="di__tag" id="diVel">0.00</b><span class="di__unit">Velocity (decay coefficient 0.90)</span></p>
</div>
</main>
<script>
// 드래그 관성(03) — 놓는 순간의 속도를 저장해 두고, 매 프레임 velocity *= 0.90 을
// 곱해 위치에 더한다. 속도가 문턱 밑으로 떨어지면 정지, 트랙 끝에서는 클램프한다.
// 실제 드래그가 없는 동안은 시드 난수(mulberry32)로 결정적인 "놓는 순간" 을 만든다.
(function () {
  var root = document.getElementById('di');
  var wrap = document.getElementById('diWrap');
  var range = document.getElementById('diRange');
  var velEl = document.getElementById('diVel');
  if (!root || !wrap || !range || !velEl) return;

  var MIN = 0, MAX = 100;
  var DECAY = 0.90;       // "매 프레임" 감쇠 계수 (변형: 0.75) — 기준 프레임률 12fps
  var BASE_FPS = 12;
  var DECAY_PER_SEC = Math.pow(DECAY, BASE_FPS); // 실제 rAF 주사율과 무관하게 같은 감쇠가 되도록 시간 기준으로 환산
  var STOP_THRESHOLD = 0.03;
  var KICK_EVERY_MS = 650;

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(42);

  var pos = 50;
  var velocity = 0;
  var lastKick = 0;

  function paint() {
    var pct = (pos - MIN) / (MAX - MIN) * 100;
    wrap.style.setProperty('--pct', pct.toFixed(2));
    range.setAttribute('aria-valuenow', String(Math.round(pos)));
    velEl.textContent = velocity.toFixed(2);
  }
  paint();

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var dragging = false, lastX = 0, lastT = 0;
  function pointerDown(e) {
    dragging = true; velocity = 0;
    lastX = e.clientX; lastT = performance.now();
  }
  function pointerMove(e) {
    if (!dragging) return;
    var now = performance.now();
    var dt = Math.max(now - lastT, 1);
    var dx = e.clientX - lastX;
    var trackW = wrap.getBoundingClientRect().width || 1;
    velocity = (dx / trackW) * 100 / (dt / 1000); // 퍼센트/s
    lastX = e.clientX; lastT = now;
  }
  function pointerUp() { dragging = false; }
  range.addEventListener('pointerdown', pointerDown);
  range.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);
  range.addEventListener('input', function () { if (dragging) pos = Number(range.value); });

  if (reduce) {
    pos = 50; velocity = 0;
    range.value = String(pos);
    paint();
  } else {
    var last = performance.now();
    (function step(now) {
      var dt = now - last; last = now;
      if (!dragging) {
        if (now - lastKick > KICK_EVERY_MS && Math.abs(velocity) < STOP_THRESHOLD) {
          velocity = (rand() - 0.5) * 160; // 결정적 "놓는 순간" 속도(퍼센트/s)
          lastKick = now;
        }
        if (Math.abs(velocity) >= STOP_THRESHOLD) {
          pos += velocity * (dt / 1000);
          velocity *= Math.pow(DECAY_PER_SEC, dt / 1000);
          if (pos < MIN) { pos = MIN; velocity = 0; }
          if (pos > MAX) { pos = MAX; velocity = 0; }
          if (Math.abs(velocity) < STOP_THRESHOLD) velocity = 0;
          range.value = String(Math.round(pos));
        }
      }
      paint();
      requestAnimationFrame(step);
    })(last);
  }
})();
</script>
</body>
</html>
