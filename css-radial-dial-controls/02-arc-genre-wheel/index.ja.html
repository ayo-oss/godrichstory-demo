<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ジャンル選択ホイール — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gw is-demo" id="gw">
  <div class="gw__wheel" id="gwWheel" tabindex="0" role="listbox" aria-label="ジャンル選択ホイール">
    <ul class="gw__ring" id="gwRing"></ul>
  </div>
  <div class="gw__pointer" aria-hidden="true"></div>
  <p class="gw__picked" id="gwPicked">選択: ポップ</p>
</div>
<script>
(function () {
  var GENRES = ['ポップ', 'ジャズ', 'ローファイ', 'ロック', 'クラシック', 'ヒップホップ', 'エレクトロニック'];
  var N = GENRES.length;
  var STEP_DEG = 360 / N;          // 장르 하나가 차지하는 각도
  var HUE_STEP_DEG = 360 / N;      // 색상 각도 매핑 — 장르 인덱스를 색상환 각도로 그대로 쓴다
  var LOOP_MS = 2000;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root = document.getElementById('gw');
  var wheel = document.getElementById('gwWheel');
  var ring = document.getElementById('gwRing');
  var picked = document.getElementById('gwPicked');
  var isDemo = true;
  var rotation = 0;      // 원판이 돌아간 각도
  var dragging = false;
  var startX = 0, startRotation = 0;

  var lis = GENRES.map(function (g, i) {
    var li = document.createElement('li');
    li.className = 'gw__slot';
    li.textContent = g;
    li.style.setProperty('--i', i);
    // 계산 겹: 색상 각도 매핑. 채도·명도는 토큰 범위 안에서 고정하고 색상각만 인덱스로 돈다.
    li.style.setProperty('--hue', i * HUE_STEP_DEG);
    ring.appendChild(li);
    return li;
  });

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  // 계산 겹: 회전각을 STEP_DEG 로 나눈 나머지로 "지금 중앙을 지나는 인덱스"를 구한다.
  function activeIndex() {
    var norm = ((-rotation % 360) + 360) % 360;
    return Math.round(norm / STEP_DEG) % N;
  }

  function apply() {
    ring.style.setProperty('--rotation', rotation);
    var idx = activeIndex();
    lis.forEach(function (li, i) { li.classList.toggle('gw__slot--active', i === idx); });
    picked.textContent = '選択: ' + GENRES[idx];
  }

  wheel.addEventListener('pointerdown', function (e) {
    human();
    dragging = true;
    startX = e.clientX;
    startRotation = rotation;
    wheel.setPointerCapture(e.pointerId);
  });
  wheel.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    rotation = startRotation + (e.clientX - startX) * 0.6;
    apply();
  });
  wheel.addEventListener('pointerup', function () {
    dragging = false;
    // 계산 겹: 놓은 각도를 가장 가까운 STEP_DEG 배수로 붙여 항상 한 장르가 정중앙에 오게 한다.
    rotation = Math.round(rotation / STEP_DEG) * STEP_DEG;
    apply();
  });
  wheel.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { human(); rotation -= STEP_DEG; apply(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { human(); rotation += STEP_DEG; apply(); e.preventDefault(); }
  });

  function loop(ts) {
    if (isDemo) {
      if (!reduce) {
        var phase = (ts % LOOP_MS) / LOOP_MS;
        rotation = -phase * 360 * 2;   // 두 바퀴를 도는 연속 회전
      } else {
        rotation = 0;
      }
      apply();
    }
    requestAnimationFrame(loop);
  }
  apply();
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
