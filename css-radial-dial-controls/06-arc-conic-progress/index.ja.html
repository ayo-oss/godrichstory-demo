<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ステップ式円形ゲージ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cp is-demo" id="cp">
  <div class="cp__ring" id="cpRing" role="img" aria-label="アップロード進行円形ゲージ">
    <div class="cp__center">
      <p class="cp__pct" id="cpPct">0%</p>
      <p class="cp__label">アップロード中</p>
    </div>
  </div>
  <div class="cp__btns">
    <button class="cp__btn" id="cpMinus" type="button" aria-label="10%減らす">−</button>
    <button class="cp__btn" id="cpPlus" type="button" aria-label="10%増やす">+</button>
  </div>
</div>
<script>
(function () {
  var GAUGE_STEP_DEG = 6;   // 고리 채움의 각도 해상도 — 값이 이 배수로만 끊겨 채워진다(매끈한 보간이 아니라 계단식)
  var STEP_PCT = 10;
  var LOOP_MS = 2000;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root = document.getElementById('cp');
  var ring = document.getElementById('cpRing');
  var pctEl = document.getElementById('cpPct');
  var minusBtn = document.getElementById('cpMinus');
  var plusBtn = document.getElementById('cpPlus');
  var isDemo = true;
  var value = 0;   // 0~100, 실제 목표값
  var shown = 0;   // 화면에 서서히 다가가는 값(서서히 메워지는 연출)

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  // 계산 겹: 퍼센트를 각도로 바꾼 뒤 GAUGE_STEP_DEG 배수로 끊어 내림한다.
  // 매끈한 360*value/100 대신 계단형으로 보여 "단계형" 게이지가 된다.
  function quantizedDeg(v) {
    var raw = Math.min(100, Math.max(0, v)) * 3.6;
    return Math.floor(raw / GAUGE_STEP_DEG) * GAUGE_STEP_DEG;
  }

  function apply() {
    ring.style.setProperty('--deg', quantizedDeg(shown));
    pctEl.textContent = Math.round(shown) + '%';
  }

  function setValue(v) { value = Math.min(100, Math.max(0, v)); }

  minusBtn.addEventListener('click', function () { human(); setValue(value - STEP_PCT); });
  plusBtn.addEventListener('click', function () { human(); setValue(value + STEP_PCT); });

  // 자동 루프: 0 → 100 을 서서히 채웠다가 다시 시작한다. 사람 조작과 같은 apply()/quantizedDeg() 를 쓴다.
  function loop(ts) {
    if (isDemo) {
      if (!reduce) {
        var phase = (ts % LOOP_MS) / LOOP_MS;
        value = phase < 0.82 ? Math.min(100, (phase / 0.82) * 100) : 100;
      } else {
        value = 62;
      }
    }
    shown += (value - shown) * (reduce ? 1 : 0.16);
    if (Math.abs(value - shown) < 0.05) shown = value;
    apply();
    requestAnimationFrame(loop);
  }
  apply();
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
