<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>放射状メニュー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rm is-demo" id="rm">
  <div class="rm__field" id="rmField">
    <ul class="rm__items" id="rmItems" role="menu" aria-hidden="true"></ul>
    <button class="rm__fab" id="rmFab" type="button" aria-haspopup="true" aria-expanded="false">メニューを開く</button>
  </div>
  <p class="rm__status" id="rmStatus">選択: なし</p>
</div>
<script>
(function () {
  var ACTIONS = ['コピー', '貼り付け', '削除', '取り消し', 'やり直し', '保存'];
  var ARC_SPAN_DEG = 200;  // 부채꼴이 펼쳐지는 총 각도
  var RADIUS = 96;         // 중심에서 항목까지 거리(px)
  var LOOP_MS = 2000;      // 블로그설정.json 데모.초 와 같다

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root = document.getElementById('rm');
  var field = document.getElementById('rmField');
  var list = document.getElementById('rmItems');
  var fab = document.getElementById('rmFab');
  var status = document.getElementById('rmStatus');
  var isDemo = true;
  var open = false;

  // 계산 겹: 극좌표 → 데카르트 좌표. 항목 i 는 위쪽(-90도)을 중심으로 ARC_SPAN_DEG 를 균등 분할한
  // 각도에서 RADIUS 만큼 떨어진 자리를 차지한다. 이 좌표는 열림 여부와 무관하게 한 번만 계산한다.
  var items = ACTIONS.map(function (label, i) {
    var li = document.createElement('li');
    li.className = 'rm__item';
    li.setAttribute('role', 'none');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'rm__itemBtn';
    btn.setAttribute('role', 'menuitem');
    btn.tabIndex = -1;
    btn.textContent = label;
    var angleDeg = -90 - ARC_SPAN_DEG / 2 + i * (ARC_SPAN_DEG / (ACTIONS.length - 1));
    var rad = angleDeg * Math.PI / 180;
    var x = Math.round(Math.cos(rad) * RADIUS);
    var y = Math.round(Math.sin(rad) * RADIUS);
    li.style.setProperty('--x', x);
    li.style.setProperty('--y', y);
    li.style.setProperty('--stagger', i);
    li.appendChild(btn);
    list.appendChild(li);
    btn.addEventListener('click', function () {
      human();
      status.textContent = '選択: ' + label;
      setOpen(false);
    });
    return { li: li, btn: btn, label: label };
  });

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  function setOpen(next) {
    open = next;
    root.classList.toggle('rm--open', open);
    fab.setAttribute('aria-expanded', String(open));
    list.setAttribute('aria-hidden', String(!open));
    items.forEach(function (it) { it.btn.tabIndex = open ? 0 : -1; });
  }

  fab.addEventListener('click', function () { human(); setOpen(!open); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && open) { human(); setOpen(false); fab.focus({ preventScroll: true }); }
  });

  // 자동 루프: 열림 구간(0.12~0.62)에서 항목마다 --stagger 만큼 늦게 열리고, 그 뒤 닫힌다
  function loop(ts) {
    if (isDemo && !reduce) {
      var phase = (ts % LOOP_MS) / LOOP_MS;
      var shouldOpen = phase > 0.12 && phase < 0.62;
      if (shouldOpen !== open) { open = shouldOpen; root.classList.toggle('rm--open', open); }
    } else if (reduce && isDemo) {
      root.classList.add('rm--open');
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
