<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segment hover ring — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sh is-demo" id="sh">
  <div class="sh__ring" id="shRing">
    <div class="sh__center">
      <b class="sh__pct" id="shPct">0%</b>
      <span class="sh__label" id="shLabel">CPU</span>
    </div>
  </div>
</div>
<script>
(function () {
  var SEGMENTS = [
    { label: 'CPU', pct: 42 },
    { label: 'GPU', pct: 68 },
    { label: 'RAM', pct: 55 },
    { label: 'Network', pct: 27 },
    { label: 'Disk', pct: 81 },
    { label: 'Power', pct: 34 }
  ];
  var N = SEGMENTS.length;
  var GAP_DEG = 3;                    // 구간 사이 틈
  var SEG_DEG = 360 / N - GAP_DEG;    // 구간 하나의 실제 폭
  var LOOP_MS = 2000;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root = document.getElementById('sh');
  var ring = document.getElementById('shRing');
  var pctEl = document.getElementById('shPct');
  var labelEl = document.getElementById('shLabel');
  var isDemo = true;

  var segs = SEGMENTS.map(function (s, i) {
    var start = i * 360 / N;
    var el = document.createElement('div');
    el.className = 'sh__seg';
    el.style.setProperty('--start', start);
    el.style.setProperty('--span', SEG_DEG);
    el.setAttribute('aria-hidden', 'true');
    ring.appendChild(el);
    return { el: el, start: start, data: s };
  });

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  // 계산 겹: 포인터 좌표를 링 중심 기준 각도로 바꾼 뒤(atan2), 어느 구간(360/N 폭)에 속하는지 판정한다.
  function angleAt(clientX, clientY) {
    var r = ring.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var deg = Math.atan2(clientY - cy, clientX - cx) * 180 / Math.PI + 90; // 12시를 0도로
    return ((deg % 360) + 360) % 360;
  }
  function segmentIndexAt(deg) {
    return Math.floor(deg / (360 / N)) % N;
  }

  function setActive(idx) {
    segs.forEach(function (s, i) { s.el.classList.toggle('sh__seg--active', i === idx); });
    var d = SEGMENTS[idx];
    pctEl.textContent = d.pct + '%';
    labelEl.textContent = d.label;
  }

  ring.addEventListener('pointermove', function (e) {
    human();
    setActive(segmentIndexAt(angleAt(e.clientX, e.clientY)));
  });
  ring.addEventListener('pointerleave', function () { human(); });

  // 자동 루프: 가상 포인터가 원을 한 바퀴 도는 것처럼 각도를 연속으로 흘려 같은 판정 함수를 태운다
  function loop(ts) {
    if (isDemo) {
      if (!reduce) {
        var phase = (ts % LOOP_MS) / LOOP_MS;
        setActive(segmentIndexAt(phase * 360));
      } else {
        setActive(0);
      }
    }
    requestAnimationFrame(loop);
  }
  setActive(0);
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
