<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キーボード円形スライダー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ka is-demo" id="ka">
  <div class="ka__ring" id="kaRing">
    <div class="ka__handle"
      id="kaHandle"
      role="slider"
      tabindex="0"
      aria-label="矢印キーで調整する再生音量"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="40"
      aria-valuetext="40%"></div>
  </div>
  <p class="ka__hint">← → で音量を調整</p>
</div>
<script>
(function () {
  var STEP_DEG = 12;   // 화살표 키 한 번에 움직이는 각도 — 100% = 300deg 범위이므로 STEP_DEG 만큼이 값 한 걸음
  var RANGE_DEG = 300; // 슬라이더가 쓰는 전체 각도(위쪽 60deg 는 비움)
  var LOOP_MS = 2000;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root = document.getElementById('ka');
  var handle = document.getElementById('kaHandle');
  var isDemo = true;
  var value = 40;   // 0~100

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  // 계산 겹: 값(%) 을 각도로 바꾼다. RANGE_DEG 범위 안에서 0%→시작각, 100%→끝각.
  function valueToDeg(v) {
    return -RANGE_DEG / 2 + (Math.min(100, Math.max(0, v)) / 100) * RANGE_DEG;
  }

  function apply() {
    handle.style.setProperty('--deg', valueToDeg(value));
    handle.setAttribute('aria-valuenow', String(Math.round(value)));
    handle.setAttribute('aria-valuetext', Math.round(value) + '%');
  }

  function setValue(v) { value = Math.min(100, Math.max(0, v)); apply(); }

  // 계산 겹: 키 입력 한 번 = STEP_DEG 만큼의 각도 = RANGE_DEG 대비 그 비율만큼의 퍼센트.
  var stepPct = (STEP_DEG / RANGE_DEG) * 100;

  handle.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); human(); setValue(value + stepPct); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); human(); setValue(value - stepPct); }
    else if (e.key === 'Home') { e.preventDefault(); human(); setValue(0); }
    else if (e.key === 'End') { e.preventDefault(); human(); setValue(100); }
  });
  handle.addEventListener('pointerdown', function () { human(); handle.focus({ preventScroll: true }); });

  // 자동 루프: 화살표 키를 누른 것과 똑같이 stepPct 만큼씩 값을 올렸다 끝에서 되돌린다.
  var dir = 1;
  var acc = 0;
  function loop(ts) {
    if (isDemo && !reduce) {
      acc += 16.7;
      if (acc >= LOOP_MS / 12) {
        acc = 0;
        value += dir * stepPct;
        if (value >= 100) { value = 100; dir = -1; }
        if (value <= 0) { value = 0; dir = 1; }
        apply();
      }
    } else if (isDemo && reduce) {
      value = 40;
      apply();
    }
    requestAnimationFrame(loop);
  }
  apply();
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
