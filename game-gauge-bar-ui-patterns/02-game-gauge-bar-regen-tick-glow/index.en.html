<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regen Tick Glow Transition — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gb is-demo" id="gb">
  <div class="gb__head">
    <span class="gb__label">MP</span>
    <span class="gb__value" id="gbValue">30 / 100</span>
  </div>
  <div class="gb__track" role="progressbar" aria-label="MP" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30" id="gbTrack">
    <div class="gb__fill" id="gbFill"></div>
    <div class="gb__edge" id="gbEdge"></div>
  </div>
  <button type="button" class="gb__hit" id="gbTick">Add Regen Tick</button>
</div>
<script>
(function () {
  var RES_MAX = 100;
  var START = 30; // 계산 겹 상수: 회복 시작값
  var TICK_INTERVAL = 340; // ms, 자동 루프의 틱 간격
  var TICK_AMOUNT = 7; // 틱마다 오르는 값
  var GLOW_TAU = 150; // ms, 글로우 감쇠 시간상수
  var PAUSE = 500; // ms, 가득 찬 뒤 다음 루프 전 대기
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var gb = document.getElementById('gb');
  var track = document.getElementById('gbTrack');
  var fill = document.getElementById('gbFill');
  var edge = document.getElementById('gbEdge');
  var valueEl = document.getElementById('gbValue');
  var tickBtn = document.getElementById('gbTick');

  var TICK_COUNT = Math.ceil((RES_MAX - START) / TICK_AMOUNT); // 계산 겹: 간격에서 파생
  var CYCLE = TICK_COUNT * TICK_INTERVAL + PAUSE;

  var isDemo = true;
  var value = START;
  var glowStart = -9999;
  var cycleStart = 0;
  var lastTickIdx = -1;

  function render(glow) {
    var v = Math.max(0, Math.min(RES_MAX, value));
    fill.style.width = v.toFixed(2) + '%';
    edge.style.left = v.toFixed(2) + '%';
    var g = glow < 0.02 ? 0 : glow;
    // 계산 겹: 글로우 값이 밝기·번짐 두 CSS 값을 동시에 구동한다
    edge.style.opacity = (0.35 + g * 0.65).toFixed(3);
    edge.style.transform = 'translate(-50%, -50%) scale(' + (1 + g * 0.9).toFixed(3) + ')';
    track.setAttribute('aria-valuenow', String(Math.round(v)));
    valueEl.textContent = Math.round(v) + ' / ' + RES_MAX;
  }

  function tick(ts) {
    value = Math.min(RES_MAX, value + TICK_AMOUNT);
    glowStart = ts;
  }

  function human() {
    if (isDemo) { gb.classList.remove('is-demo'); isDemo = false; }
  }

  tickBtn.addEventListener('click', function () {
    human();
    var now = performance.now();
    if (value >= RES_MAX) { value = START; }
    else { tick(now); }
    render(1);
  });
  tickBtn.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    ev.preventDefault();
    tickBtn.click();
  });

  function loop(ts) {
    if (!cycleStart) cycleStart = ts;
    var elapsed = ts - cycleStart;

    if (isDemo) {
      if (elapsed >= CYCLE) {
        cycleStart = ts; elapsed = 0; value = START; lastTickIdx = -1;
      }
      var idx = Math.floor(elapsed / TICK_INTERVAL);
      if (idx > lastTickIdx && idx < TICK_COUNT) {
        lastTickIdx = idx;
        tick(ts);
      }
    }

    var glow = Math.max(0, Math.exp(-(ts - glowStart) / GLOW_TAU));
    render(glow);
    requestAnimationFrame(loop);
  }

  if (!reduce) {
    requestAnimationFrame(loop);
  } else {
    render(0);
  }
})();
</script>
</main>
</body>
</html>
