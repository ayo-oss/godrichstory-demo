<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모션 감소 즉시 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gb is-demo" id="gb">
  <div class="gb__pair">
    <div class="gb__col">
      <span class="gb__colLabel">일반</span>
      <div class="gb__track" role="progressbar" aria-label="HP 일반" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" id="trackNormal">
        <div class="gb__trail" id="trailNormal"></div>
        <div class="gb__fill" id="fillNormal"></div>
      </div>
      <span class="gb__value" id="valueNormal">70</span>
    </div>
    <div class="gb__col">
      <span class="gb__colLabel">모션 감소</span>
      <div class="gb__track" role="progressbar" aria-label="HP 모션 감소" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" id="trackReduced">
        <div class="gb__fill gb__fill--instant" id="fillReduced"></div>
      </div>
      <span class="gb__value" id="valueReduced">70</span>
    </div>
  </div>
  <button type="button" class="gb__hit" id="gbReplay">피해·회복 재생</button>
</div>
<script>
(function () {
  var HP_MAX = 100;
  var START = 70;
  var EVENTS = [[300, -25], [1300, -15], [2400, 20], [3300, 15]]; // ms, 두 판에 동일하게 적용되는 값 변화
  var LERP_RATE = 0.006; // 계산 겹: '일반' 판 잔상이 본값을 따라가는 지수 평활 상수
  var systemReduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var gb = document.getElementById('gb');
  var fillNormal = document.getElementById('fillNormal');
  var trailNormal = document.getElementById('trailNormal');
  var valueNormalEl = document.getElementById('valueNormal');
  var fillReduced = document.getElementById('fillReduced');
  var valueReducedEl = document.getElementById('valueReduced');
  var trackNormal = document.getElementById('trackNormal');
  var trackReduced = document.getElementById('trackReduced');
  var replayBtn = document.getElementById('gbReplay');

  var isDemo = true;
  var value = START;
  var trailValue = START;
  var appliedIdx = 0;
  var cycleStart = 0;
  var lastTs = 0;

  function render() {
    var v = Math.max(0, Math.min(100, value));
    var tv = Math.max(0, Math.min(100, trailValue));
    fillNormal.style.width = v.toFixed(2) + '%';
    trailNormal.style.width = tv.toFixed(2) + '%';
    valueNormalEl.textContent = Math.round(v);
    trackNormal.setAttribute('aria-valuenow', String(Math.round(v)));

    // 즉시 판: 잔상·전이 없이 같은 값으로 바로 스냅 — 계산이 아니라 대입
    fillReduced.style.width = v.toFixed(2) + '%';
    valueReducedEl.textContent = Math.round(v);
    trackReduced.setAttribute('aria-valuenow', String(Math.round(v)));
  }

  function human() {
    if (isDemo) { gb.classList.remove('is-demo'); isDemo = false; }
  }

  replayBtn.addEventListener('click', function () {
    human();
    cycleStart = 0; appliedIdx = 0; value = START; trailValue = START;
  });
  replayBtn.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    ev.preventDefault();
    replayBtn.click();
  });

  function loop(ts) {
    if (!cycleStart) { cycleStart = ts; lastTs = ts; }
    var dt = ts - lastTs;
    lastTs = ts;
    var elapsed = ts - cycleStart;

    if (isDemo) {
      if (elapsed >= EVENTS[EVENTS.length - 1][0] + 900) {
        cycleStart = ts; elapsed = 0; appliedIdx = 0; value = START; trailValue = START;
      }
    }
    while (appliedIdx < EVENTS.length && elapsed >= EVENTS[appliedIdx][0]) {
      trailValue = value;
      value = Math.max(0, Math.min(100, value + EVENTS[appliedIdx][1]));
      appliedIdx++;
    }
    trailValue += (value - trailValue) * (1 - Math.exp(-LERP_RATE * dt));

    render();
    requestAnimationFrame(loop);
  }

  // 시스템 모션 감소가 켜져 있어도 이 항목은 대조를 보여주는 목적이라
  // '일반' 판의 자동 루프는 계속 돈다 — 사람이 재생 버튼을 눌러도 멈추지 않는다(BD3 요구)
  requestAnimationFrame(loop);
  if (systemReduce) {
    gb.setAttribute('data-system-reduce', 'true');
  }
})();
</script>
</main>
</body>
</html>
