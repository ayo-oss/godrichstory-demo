<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overheal Shield Cap Transition — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gb is-demo" id="gb">
  <div class="gb__head">
    <span class="gb__label">HP</span>
    <span class="gb__value" id="gbValue">55 / 100</span>
  </div>
  <div class="gb__track" role="progressbar" aria-label="HP" aria-valuemin="0" aria-valuemax="100" aria-valuenow="55" id="gbTrack">
    <div class="gb__fill" id="gbFill"></div>
    <div class="gb__shield" id="gbShield"></div>
  </div>
  <button type="button" class="gb__hit" id="gbHeal">Add Overheal</button>
</div>
<script>
(function () {
  var HP_MAX = 100; // 상한
  var OVERHEAL_CAP = 50; // 계산 겹 상수: 상한 위로 표시되는 쉴드 겹의 최대 폭 기준값
  var START = 55;
  var EVENTS = [[300, 45], [1300, 55], [2300, -25], [3200, -15]]; // ms, 값 변화(+회복/-피해)
  var DECAY_RATE = 0.00065; // 계산 겹: 상한 위 초과분이 계속 스스로 줄어드는 비율(ms 당)
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var gb = document.getElementById('gb');
  var track = document.getElementById('gbTrack');
  var fill = document.getElementById('gbFill');
  var shield = document.getElementById('gbShield');
  var valueEl = document.getElementById('gbValue');
  var healBtn = document.getElementById('gbHeal');

  var isDemo = true;
  var value = START;
  var appliedIdx = 0;
  var cycleStart = 0;
  var lastTs = 0;

  function render() {
    var base = Math.min(value, HP_MAX);
    var excess = Math.max(0, value - HP_MAX);
    var shieldRatio = Math.min(1, excess / OVERHEAL_CAP);
    fill.style.width = base.toFixed(2) + '%';
    // 계산 겹: 초과분 폭 = 상한 위 값 / 쉴드 표시 기준값 — 반투명 겹의 폭·투명도를 함께 구동
    shield.style.width = (shieldRatio * 100).toFixed(2) + '%';
    shield.style.opacity = shieldRatio < 0.02 ? '0' : (0.4 + shieldRatio * 0.5).toFixed(3);
    track.setAttribute('aria-valuenow', String(Math.round(base)));
    valueEl.textContent = Math.round(value) + ' / ' + HP_MAX;
  }

  function human() {
    if (isDemo) { gb.classList.remove('is-demo'); isDemo = false; }
  }

  healBtn.addEventListener('click', function () {
    human();
    value = Math.max(0, Math.min(HP_MAX + OVERHEAL_CAP, value + 30));
    render();
  });
  healBtn.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    ev.preventDefault();
    healBtn.click();
  });

  function loop(ts) {
    if (!cycleStart) { cycleStart = ts; lastTs = ts; }
    var dt = ts - lastTs;
    lastTs = ts;
    var elapsed = ts - cycleStart;

    if (isDemo) {
      if (elapsed >= EVENTS[EVENTS.length - 1][0] + 700) {
        cycleStart = ts; elapsed = 0; appliedIdx = 0; value = START;
      }
      while (appliedIdx < EVENTS.length && elapsed >= EVENTS[appliedIdx][0]) {
        value = Math.max(0, Math.min(HP_MAX + OVERHEAL_CAP, value + EVENTS[appliedIdx][1]));
        appliedIdx++;
      }
    }

    if (value > HP_MAX) {
      value = HP_MAX + (value - HP_MAX) * Math.exp(-DECAY_RATE * dt);
    }

    render();
    requestAnimationFrame(loop);
  }

  if (!reduce) {
    requestAnimationFrame(loop);
  } else {
    render();
  }
})();
</script>
</main>
</body>
</html>
