<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segment Pip Crack Transition — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gb is-demo" id="gb">
  <div class="gb__head">
    <span class="gb__label">Boss HP</span>
    <span class="gb__value" id="gbValue">5 / 5</span>
  </div>
  <div class="gb__track" id="gbTrack" role="progressbar" aria-label="Boss HP" aria-valuemin="0" aria-valuemax="5" aria-valuenow="5"></div>
  <button type="button" class="gb__hit" id="gbBreak">Break Segment</button>
</div>
<script>
(function () {
  var PIPS = 5; // 계산 겹 상수: 칸 개수
  var EVENT_T = [400, 1300, 2200, 3100]; // ms, 자동 루프 안에서 칸이 깨지는 시각(PIPS-1 개)
  var CRACK_DUR = 520; // ms, 한 칸이 다 깨지는 데 걸리는 시간
  var STAGGER = 150; // ms, 균열 두 줄 사이 지연 — 칸 단위 stagger
  var PAUSE = 500;
  var CYCLE = EVENT_T[EVENT_T.length - 1] + CRACK_DUR + PAUSE;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var gb = document.getElementById('gb');
  var track = document.getElementById('gbTrack');
  var valueEl = document.getElementById('gbValue');
  var breakBtn = document.getElementById('gbBreak');

  var pips = [];
  for (var i = 0; i < PIPS; i++) {
    var pip = document.createElement('div');
    pip.className = 'gb__pip';
    var fillEl = document.createElement('div');
    fillEl.className = 'gb__pipFill';
    var c1 = document.createElement('div');
    c1.className = 'gb__crack gb__crack--a';
    var c2 = document.createElement('div');
    c2.className = 'gb__crack gb__crack--b';
    pip.appendChild(fillEl);
    pip.appendChild(c1);
    pip.appendChild(c2);
    track.appendChild(pip);
    pips.push({ el: pip, fill: fillEl, c1: c1, c2: c2 });
  }

  var isDemo = true;
  var appliedIdx = 0; // 몇 칸이 깨지는 이벤트를 지났는가 (0..PIPS-1)
  var eventTs = []; // 실제 깨진 시각 기록(자동·수동 공용)
  var cycleStart = 0;

  // 칸 pipIdx 는 오른쪽부터 먼저 깨진다: eventIndex = PIPS-1-pipIdx
  function stateFor(pipIdx, ts) {
    var eventIndex = PIPS - 1 - pipIdx;
    if (eventIndex < 0 || eventIndex >= appliedIdx) {
      return { c1: 0, c2: 0, fill: 1 };
    }
    var t0 = eventTs[eventIndex];
    var dt = Math.max(0, ts - t0);
    var c1 = Math.min(1, dt / (CRACK_DUR * 0.45));
    var c2 = Math.min(1, Math.max(0, dt - STAGGER) / (CRACK_DUR * 0.45));
    var fill = 1 - Math.min(1, Math.max(0, dt - STAGGER) / (CRACK_DUR - STAGGER));
    return { c1: c1, c2: c2, fill: fill };
  }

  function render(ts) {
    for (var i = 0; i < PIPS; i++) {
      var s = stateFor(i, ts);
      pips[i].fill.style.opacity = s.fill.toFixed(3);
      pips[i].c1.style.opacity = s.c1.toFixed(3);
      pips[i].c2.style.opacity = s.c2.toFixed(3);
    }
    var remaining = PIPS - appliedIdx;
    valueEl.textContent = remaining + ' / ' + PIPS;
    track.setAttribute('aria-valuenow', String(remaining));
  }

  function breakOne(ts) {
    eventTs[appliedIdx] = ts;
    appliedIdx++;
  }

  function human() {
    if (isDemo) { gb.classList.remove('is-demo'); isDemo = false; }
  }

  breakBtn.addEventListener('click', function () {
    human();
    var now = performance.now();
    if (appliedIdx >= PIPS - 1) { appliedIdx = 0; eventTs = []; }
    else { breakOne(now); }
    render(now);
  });
  breakBtn.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    ev.preventDefault();
    breakBtn.click();
  });

  function loop(ts) {
    if (!cycleStart) cycleStart = ts;
    var elapsed = ts - cycleStart;

    if (isDemo) {
      if (elapsed >= CYCLE) {
        cycleStart = ts; elapsed = 0; appliedIdx = 0; eventTs = [];
      }
      for (var i = 0; i < EVENT_T.length; i++) {
        if (elapsed >= EVENT_T[i] && appliedIdx <= i) {
          eventTs[i] = cycleStart + EVENT_T[i];
          appliedIdx = i + 1;
        }
      }
    }

    render(ts);
    requestAnimationFrame(loop);
  }

  if (!reduce) {
    requestAnimationFrame(loop);
  } else {
    render(0);
  }
})();
</script>
</main>
</body>
</html>
