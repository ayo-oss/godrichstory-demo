<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>당김 끝 잠금 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="head">
    <span class="modeLabel" id="modeLabel">체이닝 잠금판</span>
    <button class="simToggle" id="simToggle" type="button" aria-pressed="false">폴백 흉내내기</button>
  </div>
  <div class="panelWrap">
    <ul class="panel" id="panel">
      <li>알림 규칙</li>
      <li>배지 색</li>
      <li>여백 표</li>
      <li>버튼 상태</li>
      <li>입력 검증</li>
      <li>접근성</li>
      <li>성능 측정</li>
      <li>배포 노트</li>
    </ul>
    <div class="pullCap" id="pullCap"></div>
  </div>
</div>
</main>
<script>
(function () {
  var OVERSCROLL_LOCK_PX = 24; // 경계에서 더 당길 수 있는 최대치 — 변형 목표: 24 → 48
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var panel = document.getElementById('panel');
  var pullCap = document.getElementById('pullCap');
  var simToggle = document.getElementById('simToggle');
  var modeLabel = document.getElementById('modeLabel');
  var isDemo = true;

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  var pull = 0;
  var releaseTimer = null;

  function atBottom() {
    return panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 1;
  }
  function atTop() { return panel.scrollTop <= 0; }

  function setPull(px) {
    pull = Math.max(0, Math.min(OVERSCROLL_LOCK_PX, px));
    pullCap.style.transform = 'scaleY(' + (pull / OVERSCROLL_LOCK_PX) + ')';
  }

  function release() {
    setPull(0);
  }

  // 실제 wheel 리스너 — 경계에 닿은 뒤의 남는 델타만 당김으로 흡수하고 스크롤 전파(체이닝)를 막는다
  panel.addEventListener('wheel', function (e) {
    human();
    if (e.deltaY > 0 && atBottom()) {
      e.preventDefault();
      setPull(pull + e.deltaY * 0.4);
      if (releaseTimer) clearTimeout(releaseTimer);
      releaseTimer = setTimeout(release, 220);
    } else if (e.deltaY < 0 && atTop() && pull > 0) {
      e.preventDefault();
      setPull(pull + e.deltaY * 0.4);
      if (releaseTimer) clearTimeout(releaseTimer);
      releaseTimer = setTimeout(release, 220);
    }
  }, { passive: false });

  panel.addEventListener('scroll', function () { if (pull > 0 && !atBottom()) release(); });

  var simOn = false;
  function setSim(on) {
    simOn = on;
    wrap.classList.toggle('force-fallback', on);
    simToggle.setAttribute('aria-pressed', String(on));
    modeLabel.textContent = on ? '체이닝 새는판' : '체이닝 잠금판';
  }
  simToggle.addEventListener('click', function () { human(); setSim(!simOn); });

  var last = 0;
  var STEP_MS = 70;
  var dir = 1;
  var holdUntil = 0;
  function autoAdvance(ts) {
    if (ts - last < STEP_MS) return;
    last = ts;
    if (ts < holdUntil) {
      // 경계에서 더 당기는 구간 — 실제 wheel 이 하는 것과 같은 setPull 호출
      setPull(pull + (dir > 0 ? 6 : -6));
      return;
    }
    var max = panel.scrollHeight - panel.clientHeight;
    var next = panel.scrollTop + dir * 10;
    if (next >= max) { panel.scrollTop = max; holdUntil = ts + 360; dir = -1; }
    else if (next <= 0) { panel.scrollTop = 0; holdUntil = ts + 360; dir = 1; }
    else { panel.scrollTop = next; }
  }

  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce) autoAdvance(ts);
    if (isDemo && !reduce && pull > 0 && ts > holdUntil + 40) setPull(0);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
