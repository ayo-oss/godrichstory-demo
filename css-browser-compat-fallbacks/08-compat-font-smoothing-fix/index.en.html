<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Font smoothing fix — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="compareBox" id="compareBox">
    <div class="textLayer is-raw">Aa body text</div>
    <div class="textLayer is-fixed" id="fixedLayer">Aa body text</div>
    <div class="handle" id="handle" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div>
  </div>
  <div class="foot">
    <span class="modeLabel" id="modeLabel">Corrected</span>
    <button class="simToggle" id="simToggle" type="button" aria-pressed="false">Simulate fallback</button>
  </div>
</div>
</main>
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var compareBox = document.getElementById('compareBox');
  var handle = document.getElementById('handle');
  var simToggle = document.getElementById('simToggle');
  var modeLabel = document.getElementById('modeLabel');
  var isDemo = true;

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  var split = 50;
  function setSplit(v) {
    split = Math.max(0, Math.min(100, v));
    compareBox.style.setProperty('--split', split + '%');
    handle.setAttribute('aria-valuenow', String(Math.round(split)));
  }
  setSplit(split);

  var dragging = false;
  handle.addEventListener('pointerdown', function (e) {
    human();
    dragging = true;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var rect = compareBox.getBoundingClientRect();
    setSplit(((e.clientX - rect.left) / rect.width) * 100);
  });
  handle.addEventListener('pointerup', function () { dragging = false; });
  handle.addEventListener('keydown', function (e) {
    human();
    if (e.key === 'ArrowLeft') setSplit(split - 5);
    else if (e.key === 'ArrowRight') setSplit(split + 5);
  });

  var simOn = false;
  function setSim(on) {
    simOn = on;
    wrap.classList.toggle('force-fallback', on);
    simToggle.setAttribute('aria-pressed', String(on));
    modeLabel.textContent = on ? 'Uncorrected' : 'Corrected';
  }
  simToggle.addEventListener('click', function () { human(); setSim(!simOn); });

  // 자동 재생: 삼각파(사인이 아니라 선형 왕복)로 손잡이를 오간다 — 난수 없이 결정론적
  var last = 0;
  var STEP_MS = 40;
  var dir = 1;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce && ts - last >= STEP_MS) {
      last = ts;
      var next = split + dir * 3.4;
      if (next >= 92) { next = 92; dir = -1; }
      else if (next <= 8) { next = 8; dir = 1; }
      setSplit(next);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
