<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カスタム日付入力 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="ringWrap">
    <svg class="ring" viewBox="0 0 72 72" aria-hidden="true">
      <circle class="ringTrack" cx="36" cy="36" r="30"></circle>
      <circle class="ringFill" id="ringFill" cx="36" cy="36" r="30"></circle>
    </svg>
    <span class="ringNum" id="ringNum">0</span>
  </div>
  <div class="row">
    <input class="dateInput" id="dateInput" type="date" value="2026-10-01">
    <button class="pickBtn" id="pickBtn" type="button">カレンダーを開く</button>
  </div>
  <div class="foot">
    <span class="daysLabel" id="daysLabel">D-9</span>
    <button class="simToggle" id="simToggle" type="button" aria-pressed="false">フォールバックを再現</button>
  </div>
</div>
</main>
<script>
(function () {
  var RANGE_DAYS = 30; // 링이 가득 찰 때 기준이 되는 최대 남은 일수
  var REFERENCE_DATE = new Date('2026-09-22T00:00:00');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var dateInput = document.getElementById('dateInput');
  var pickBtn = document.getElementById('pickBtn');
  var ringFill = document.getElementById('ringFill');
  var ringNum = document.getElementById('ringNum');
  var daysLabel = document.getElementById('daysLabel');
  var isDemo = true;

  var CIRC = 2 * Math.PI * 30; // 실제 반지름에서 계산한 둘레 — 하드코딩 아님
  ringFill.style.strokeDasharray = String(CIRC);

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  function daysBetween(a, b) {
    var ms = b.getTime() - a.getTime();
    return Math.round(ms / 86400000);
  }

  function render() {
    var picked = new Date(dateInput.value + 'T00:00:00');
    var days = daysBetween(REFERENCE_DATE, picked);
    var ratio = Math.max(0, Math.min(1, days / RANGE_DAYS));
    ringFill.style.strokeDashoffset = String(CIRC * (1 - ratio));
    ringNum.textContent = String(days);
    daysLabel.textContent = days >= 0 ? ('D-' + days) : ('D+' + Math.abs(days));
  }
  render();

  dateInput.addEventListener('change', function () { human(); render(); });

  // 표준 showPicker() 를 아는 환경이면 버튼이 진짜 달력을 띄우고, 모르는 환경은 입력에 초점만 준다
  var hasShowPicker = 'showPicker' in HTMLInputElement.prototype;
  pickBtn.addEventListener('click', function () {
    human();
    if (hasShowPicker && !wrap.classList.contains('force-fallback')) {
      try { dateInput.showPicker(); } catch (err) { dateInput.focus({ preventScroll: true }); }
    } else {
      dateInput.focus({ preventScroll: true });
    }
  });

  var simToggle = document.getElementById('simToggle');
  var simOn = false;
  function setSim(on) {
    simOn = on;
    wrap.classList.toggle('force-fallback', on);
    simToggle.setAttribute('aria-pressed', String(on));
    pickBtn.textContent = on ? '入力欄フォーカスのみ' : 'カレンダーを開く';
  }
  simToggle.addEventListener('click', function () { human(); setSim(!simOn); });

  var DATES = ['2026-10-01', '2026-10-08', '2026-09-25', '2026-11-05', '2026-09-23'];
  var di = 0;
  var last = 0;
  var STEP_MS = 320;
  var phase = 0;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce && ts - last >= STEP_MS) {
      last = ts;
      phase = (phase + 1) % 3;
      if (phase !== 1) {
        dateInput.value = DATES[di % DATES.length];
        di += 1;
        render();
      } else {
        setSim(!simOn);
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
