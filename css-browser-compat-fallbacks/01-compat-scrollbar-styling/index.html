<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커스텀 스크롤바 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="head">
    <span class="modeLabel" id="modeLabel">표준 지원판</span>
    <button class="simToggle" id="simToggle" type="button" aria-pressed="false">폴백 흉내내기</button>
  </div>
  <div class="body">
    <ol class="itemList" id="list">
      <li>설계 문서</li>
      <li>색상 토큰</li>
      <li>여백 규칙</li>
      <li>버튼 상태</li>
      <li>입력 검증</li>
      <li>접근성 점검</li>
      <li>성능 측정</li>
      <li>배포 노트</li>
    </ol>
    <div class="track" id="track"><div class="trackDot" id="trackDot"></div></div>
  </div>
</div>
</main>
<script>
(function () {
  var LERP_RATE = 0.22; // 트랙 점이 목표 위치를 따라붙는 비율 — 작을수록 관성이 크게 느껴진다
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var list = document.getElementById('list');
  var track = document.getElementById('track');
  var dot = document.getElementById('trackDot');
  var simToggle = document.getElementById('simToggle');
  var modeLabel = document.getElementById('modeLabel');
  var isDemo = true;

  var target = 0; // 목표 스크롤 비율 0~1 — 실제 scrollTop 에서 나온다
  var shown = 0;  // 화면에 그려지는 비율 — target 을 lerp 로 뒤따른다

  function ratio() {
    var max = list.scrollHeight - list.clientHeight;
    return max > 0 ? list.scrollTop / max : 0;
  }

  function onScroll() { target = ratio(); }
  list.addEventListener('scroll', onScroll);

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }
  list.addEventListener('pointerdown', human);
  list.addEventListener('keydown', human);

  function setSim(on) {
    wrap.classList.toggle('force-fallback', on);
    simToggle.setAttribute('aria-pressed', String(on));
    modeLabel.textContent = on ? '폴백 흉내내기' : '표준 지원판';
  }
  var simOn = false;
  simToggle.addEventListener('click', function () {
    human();
    simOn = !simOn;
    setSim(simOn);
  });

  var dir = 1;
  var last = 0;
  var STEP_MS = 520;

  function autoAdvance(ts) {
    if (ts - last < STEP_MS) return;
    last = ts;
    var max = list.scrollHeight - list.clientHeight;
    var next = list.scrollTop + dir * (max * 0.42);
    if (next >= max - 1) { next = max; dir = -1; }
    else if (next <= 1) { next = 0; dir = 1; }
    list.scrollTop = next; // 진짜 스크롤 — 위 scroll 리스너가 target 을 갱신한다
  }

  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce) autoAdvance(ts);
    var trackH = track.clientHeight - dot.offsetHeight;
    if (reduce) { shown = target; } else { shown += (target - shown) * LERP_RATE; }
    dot.style.transform = 'translateY(' + Math.max(0, Math.min(trackH, shown * trackH)) + 'px)';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
