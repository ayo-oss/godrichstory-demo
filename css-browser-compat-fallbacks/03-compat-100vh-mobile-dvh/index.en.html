<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic viewport height — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <button class="addrToggle" id="addrToggle" type="button" aria-pressed="false">Collapse bar</button>
  <div class="phones">
    <div class="phone">
      <span class="phoneLabel">Fixed 100vh</span>
      <div class="screen" id="screenFixed">
        <div class="addressBar" id="addressBarFixed"></div>
        <button class="anchor is-fixed" id="anchorFixed" type="button">Continue</button>
      </div>
    </div>
    <div class="phone">
      <span class="phoneLabel">Dynamic viewport</span>
      <div class="screen" id="screenDvh">
        <div class="addressBar" id="addressBarDvh"></div>
        <button class="anchor is-dvh" id="anchorDvh" type="button">Continue</button>
      </div>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var VH_RECALC_DEBOUNCE_MS = 150; // 주소창이 움직인 뒤 높이를 다시 계산하기까지의 지연 — 변형 목표: 150 → 50
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var addrToggle = document.getElementById('addrToggle');
  var screenDvh = document.getElementById('screenDvh');
  var anchorDvh = document.getElementById('anchorDvh');
  var isDemo = true;

  var BAR_OPEN_PX = 34; // 주소창이 펼쳐졌을 때 화면에서 차지하는 높이
  var timer = null;
  var collapsed = false;

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  function recalc() {
    var barH = collapsed ? 0 : BAR_OPEN_PX;
    // 동적 뷰포트판만 다시 잰다 — 100vh 고정판은 실제로 재계산을 안 하는 버그를 그대로 보여준다
    screenDvh.style.setProperty('--bar-h', barH + 'px');
    anchorDvh.classList.add('is-settled');
  }

  function scheduleRecalc() {
    anchorDvh.classList.remove('is-settled');
    if (timer) clearTimeout(timer);
    timer = setTimeout(recalc, VH_RECALC_DEBOUNCE_MS);
  }

  function setCollapsed(on) {
    collapsed = on;
    wrap.classList.toggle('is-collapsed', on);
    addrToggle.textContent = on ? 'Expand bar' : 'Collapse bar';
    addrToggle.setAttribute('aria-pressed', String(on));
    scheduleRecalc();
  }

  addrToggle.addEventListener('click', function () { human(); setCollapsed(!collapsed); });
  addrToggle.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') human();
  });

  recalc();

  var last = 0;
  var STEP_MS = 780;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce && ts - last >= STEP_MS) {
      last = ts;
      setCollapsed(!collapsed);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
