<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flex gap fallback — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="head">
    <input class="addInput" id="addInput" type="text" placeholder="Type a tag, press Enter" maxlength="8">
    <button class="simToggle" id="simToggle" type="button" aria-pressed="false">Simulate fallback</button>
  </div>
  <ul class="chipRow" id="chipRow">
    <li class="chip">margin</li>
    <li class="chip">token</li>
    <li class="chip">align</li>
  </ul>
  <span class="modeLabel" id="modeLabel">gap mode</span>
</div>
</main>
<script>
(function () {
  var STEP_MS = 380; // 자동 추가/삭제 gap
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var chipRow = document.getElementById('chipRow');
  var addInput = document.getElementById('addInput');
  var simToggle = document.getElementById('simToggle');
  var modeLabel = document.getElementById('modeLabel');
  var isDemo = true;

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  var seq = 0;
  function addChip(text) {
    var li = document.createElement('li');
    li.className = 'chip is-entering';
    li.textContent = text;
    li.style.setProperty('--i', String(seq % 6));
    seq += 1;
    li.addEventListener('click', function () { human(); removeChip(li); });
    chipRow.appendChild(li);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { li.classList.remove('is-entering'); });
    });
  }

  function removeChip(li) {
    if (!li || li.classList.contains('is-leaving')) return;
    li.classList.add('is-leaving');
    li.addEventListener('transitionend', function () { li.remove(); }, { once: true });
  }

  addInput.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    human();
    var value = addInput.value.trim();
    if (value) { addChip(value); addInput.value = ''; }
  });

  var simOn = false;
  function setSim(on) {
    simOn = on;
    wrap.classList.toggle('force-fallback', on);
    simToggle.setAttribute('aria-pressed', String(on));
    modeLabel.textContent = on ? 'margin fallback' : 'gap mode';
  }
  simToggle.addEventListener('click', function () { human(); setSim(!simOn); });

  var WORDS = ['align', 'gap', 'rule', 'token', 'flow'];
  var wi = 0;
  var last = 0;
  var phase = 0;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce && ts - last >= STEP_MS) {
      last = ts;
      phase = (phase + 1) % 3;
      if (phase === 0) {
        addChip(WORDS[wi % WORDS.length]);
        wi += 1;
      } else if (phase === 1 && chipRow.children.length > 2) {
        removeChip(chipRow.lastElementChild);
      } else {
        setSim(!simOn);
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
