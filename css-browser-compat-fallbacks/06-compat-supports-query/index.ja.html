<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>機能判定の分岐 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="head">
    <span class="modeLabel" id="modeLabel">実際のサポート判定</span>
    <button class="rescanBtn" id="rescanBtn" type="button">再チェック</button>
  </div>
  <ul class="checkList" id="checkList"></ul>
  <div class="bar"><div class="barFill" id="barFill"></div></div>
  <button class="simToggle" id="simToggle" type="button" aria-pressed="false">フォールバックを再現</button>
</div>
</main>
<script>
(function () {
  var STEP_MS = 620; // 자동 재검사/시뮬레이션 間隔
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var checkList = document.getElementById('checkList');
  var barFill = document.getElementById('barFill');
  var rescanBtn = document.getElementById('rescanBtn');
  var simToggle = document.getElementById('simToggle');
  var modeLabel = document.getElementById('modeLabel');
  var isDemo = true;

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  // 실제 @supports 와 같은 판정 근거 — CSS.supports() 로 지금 렌더 환경을 그대로 검사한다
  var FEATURES = [
    { label: 'Flex gap', test: function () { return CSS.supports('gap', '1px'); } },
    { label: 'アスペクト比', test: function () { return CSS.supports('aspect-ratio', '1 / 1'); } },
    { label: '背景ぼかし', test: function () { return CSS.supports('backdrop-filter', 'blur(1px)'); } },
    { label: '親セレクター', test: function () { return CSS.supports('selector(:has(a))'); } },
    { label: 'コンテナークエリー', test: function () { return CSS.supports('container-type', 'inline-size'); } }
  ];

  var simOn = false;
  var rows = [];

  function build() {
    checkList.innerHTML = '';
    rows = FEATURES.map(function (f, i) {
      var li = document.createElement('li');
      li.className = 'checkRow is-hidden';
      li.style.setProperty('--i', String(i));
      var icon = document.createElement('span');
      icon.className = 'statusIcon';
      var name = document.createElement('span');
      name.className = 'featureName';
      name.textContent = f.label;
      li.appendChild(icon);
      li.appendChild(name);
      checkList.appendChild(li);
      return { el: li, icon: icon, ok: f.test() };
    });
  }
  build();

  function scan() {
    var okCount = 0;
    rows.forEach(function (row, i) {
      // 시뮬레이션판: 실제 결과 위에 강제로 미지원을 덧씌워 폴백 문구가 보이게 한다(감지 흉내가 아니라 표시 전용 오버라이드)
      var displayOk = simOn ? (row.ok && i % 2 === 0) : row.ok;
      row.el.classList.toggle('is-ok', displayOk);
      row.el.classList.toggle('is-fallback', !displayOk);
      row.el.classList.remove('is-hidden');
      row.el.classList.add('is-revealed');
      if (displayOk) okCount += 1;
    });
    var ratio = rows.length ? okCount / rows.length : 0;
    barFill.style.transform = 'scaleX(' + ratio + ')';
    modeLabel.textContent = simOn ? 'フォールバック再現チェック' : '実際のサポート判定';
  }

  rescanBtn.addEventListener('click', function () {
    human();
    rows.forEach(function (row) { row.el.classList.add('is-hidden'); row.el.classList.remove('is-revealed'); });
    requestAnimationFrame(function () { requestAnimationFrame(scan); });
  });

  function setSim(on) {
    simOn = on;
    simToggle.setAttribute('aria-pressed', String(on));
    scan();
  }
  simToggle.addEventListener('click', function () { human(); setSim(!simOn); });

  scan();

  var last = 0;
  var phase = 0;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce && ts - last >= STEP_MS) {
      last = ts;
      phase = (phase + 1) % 3;
      if (phase === 0) {
        rows.forEach(function (row) { row.el.classList.add('is-hidden'); row.el.classList.remove('is-revealed'); });
      } else if (phase === 1) {
        scan();
      } else {
        setSim(!simOn);
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
