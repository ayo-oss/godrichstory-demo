<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배경 흐림 폴백 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="backdrop"></div>
  <button class="openBtn" id="openBtn" type="button" aria-pressed="false">카드 열기</button>
  <div class="card" id="card">
    <p class="cardText">알림 3건</p>
  </div>
  <div class="foot">
    <span class="modeLabel" id="modeLabel">흐림 지원판</span>
    <button class="simToggle" id="simToggle" type="button" aria-pressed="false">폴백 흉내내기</button>
  </div>
</div>
</main>
<script>
(function () {
  var FALLBACK_BG_ALPHA = 0.6; // 흐림이 없는 환경에서 카드 배경을 채우는 반투명 진하기 — 변형 목표: 0.6 → 0.85
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var card = document.getElementById('card');
  var openBtn = document.getElementById('openBtn');
  var simToggle = document.getElementById('simToggle');
  var modeLabel = document.getElementById('modeLabel');
  var isDemo = true;

  card.style.setProperty('--fallback-alpha', FALLBACK_BG_ALPHA);

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  var open = false;
  function setOpen(on) {
    open = on;
    card.classList.toggle('is-open', on);
    openBtn.setAttribute('aria-pressed', String(on));
  }
  openBtn.addEventListener('click', function () { human(); setOpen(!open); });

  var simOn = false;
  function setSim(on) {
    simOn = on;
    wrap.classList.toggle('force-fallback', on);
    simToggle.setAttribute('aria-pressed', String(on));
    modeLabel.textContent = on ? '흐림 폴백판' : '흐림 지원판';
  }
  simToggle.addEventListener('click', function () { human(); setSim(!simOn); });

  var last = 0;
  var STEP_MS = 620;
  var phase = 0;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce && ts - last >= STEP_MS) {
      last = ts;
      phase = (phase + 1) % 4;
      setOpen(phase === 1 || phase === 2);
      if (phase === 0) setSim(!simOn);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
