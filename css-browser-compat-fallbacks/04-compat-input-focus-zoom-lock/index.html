<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입력창 확대 잠금 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="row">
    <label class="field">
      <span class="fieldLabel">작은 글자판</span>
      <input class="input is-small" id="inputSmall" type="text" value="검색어">
    </label>
    <label class="field">
      <span class="fieldLabel">잠금 글자판</span>
      <input class="input is-lock" id="inputLock" type="text" value="검색어">
    </label>
  </div>
  <div class="foot">
    <span class="modeLabel" id="modeLabel">확대 잠금 켜짐</span>
    <button class="simToggle" id="simToggle" type="button" aria-pressed="false">폴백 흉내내기</button>
  </div>
</div>
</main>
<script>
(function () {
  var LOCK_FONT_PX = 16; // 이 값 이상이면 초점 확대가 걸리지 않는다 — 잠금판의 목표 크기
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wrap = document.getElementById('wrap');
  var inputSmall = document.getElementById('inputSmall');
  var inputLock = document.getElementById('inputLock');
  var simToggle = document.getElementById('simToggle');
  var modeLabel = document.getElementById('modeLabel');
  var isDemo = true;

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  // 실제 요소 크기에서 확대 배율을 구한다 — 하드코딩 배율이 아니라 현재 폰트 크기 기준
  function zoomScaleFor(el) {
    var css = getComputedStyle(el);
    var current = parseFloat(css.fontSize) || LOCK_FONT_PX;
    return Math.max(1, LOCK_FONT_PX / current);
  }

  function applyFocusZoom(el, on) {
    if (on) {
      var rect = el.getBoundingClientRect();
      var originX = rect.width / 2;
      var originY = rect.height / 2;
      el.style.transformOrigin = originX + 'px ' + originY + 'px';
      el.style.transform = 'scale(' + zoomScaleFor(el) + ')';
    } else {
      el.style.transform = 'scale(1)';
    }
  }

  inputSmall.addEventListener('focus', function () { human(); applyFocusZoom(inputSmall, true); });
  inputSmall.addEventListener('blur', function () { applyFocusZoom(inputSmall, false); });

  // 잠금판: 실제 font-size 가 이미 LOCK_FONT_PX 이므로 zoomScaleFor 가 1을 반환 — 확대가 걸리지 않는다
  inputLock.addEventListener('focus', function () { human(); applyFocusZoom(inputLock, true); });
  inputLock.addEventListener('blur', function () { applyFocusZoom(inputLock, false); });

  var simOn = false;
  function setSim(on) {
    simOn = on;
    wrap.classList.toggle('force-fallback', on);
    simToggle.setAttribute('aria-pressed', String(on));
    modeLabel.textContent = on ? '확대 잠금 꺼짐' : '확대 잠금 켜짐';
  }
  simToggle.addEventListener('click', function () { human(); setSim(!simOn); });

  var last = 0;
  var STEP_MS = 680;
  var phase = 0;
  function loop(ts) {
    if (!last) last = ts;
    if (isDemo && !reduce && ts - last >= STEP_MS) {
      last = ts;
      phase = (phase + 1) % 4;
      if (phase === 1) { applyFocusZoom(inputSmall, true); applyFocusZoom(inputLock, true); }
      else if (phase === 3) { applyFocusZoom(inputSmall, false); applyFocusZoom(inputLock, false); }
      else if (phase === 0) { setSim(!simOn); }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
