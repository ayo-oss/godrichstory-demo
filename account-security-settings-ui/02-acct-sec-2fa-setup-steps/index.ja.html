<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-factor setup steps — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="tf is-demo" id="tf" data-step="1">
    <h2 class="tf__title">二段階認証を入れる</h2>
    <ol class="tf__bar">
      <li class="tf__notch" data-notch="1" aria-current="step">
        <span class="tf__step">アプリ連携</span>
        <span class="tf__track"><span class="tf__fill" data-fill="1"></span></span>
      </li>
      <li class="tf__notch" data-notch="2">
        <span class="tf__step">コード確認</span>
        <span class="tf__track"><span class="tf__fill" data-fill="2"></span></span>
      </li>
      <li class="tf__notch" data-notch="3">
        <span class="tf__step">バックアップコード</span>
        <span class="tf__track"><span class="tf__fill" data-fill="3"></span></span>
      </li>
    </ol>

    <div class="tf__body">
      <div class="tf__panel" data-panel="1">
        <span class="tf__qr" aria-hidden="true">
          <span class="tf__qrdot"><svg viewBox="0 0 256 256" width="22" height="22"><g fill="currentColor"><path d="M112 56v48a8 8 0 0 1-8 8H56a8 8 0 0 1-8-8V56a8 8 0 0 1 8-8h48a8 8 0 0 1 8 8m-8 88H56a8 8 0 0 0-8 8v48a8 8 0 0 0 8 8h48a8 8 0 0 0 8-8v-48a8 8 0 0 0-8-8m96-96h-48a8 8 0 0 0-8 8v48a8 8 0 0 0 8 8h48a8 8 0 0 0 8-8V56a8 8 0 0 0-8-8" opacity=".2"/><path d="M104 40H56a16 16 0 0 0-16 16v48a16 16 0 0 0 16 16h48a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16m0 64H56V56h48zm0 32H56a16 16 0 0 0-16 16v48a16 16 0 0 0 16 16h48a16 16 0 0 0 16-16v-48a16 16 0 0 0-16-16m0 64H56v-48h48zm96-160h-48a16 16 0 0 0-16 16v48a16 16 0 0 0 16 16h48a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16m0 64h-48V56h48zm-64 72v-32a8 8 0 0 1 16 0v32a8 8 0 0 1-16 0m80-16a8 8 0 0 1-8 8h-24v40a8 8 0 0 1-8 8h-32a8 8 0 0 1 0-16h24v-56a8 8 0 0 1 16 0v8h24a8 8 0 0 1 8 8m0 32v16a8 8 0 0 1-16 0v-16a8 8 0 0 1 16 0"/></g></svg></span>
        </span>
        <div class="tf__side">
          <p class="tf__lead">
            <span class="tf__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="18" height="18"><g fill="currentColor"><path d="M208 88H48a8 8 0 0 0-8 8v112a8 8 0 0 0 8 8h160a8 8 0 0 0 8-8V96a8 8 0 0 0-8-8m-80 72a20 20 0 1 1 20-20a20 20 0 0 1-20 20" opacity=".2"/><path d="M208 80h-32V56a48 48 0 0 0-96 0v24H48a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V96a16 16 0 0 0-16-16M96 56a32 32 0 0 1 64 0v24H96Zm112 152H48V96h160zm-80-96a28 28 0 0 0-8 54.83V184a8 8 0 0 0 16 0v-17.17a28 28 0 0 0-8-54.83m0 40a12 12 0 1 1 12-12a12 12 0 0 1-12 12"/></g></svg></span>
            認証アプリでスキャン
          </p>
          <button class="tf__go" type="button" id="tf-next">次へ</button>
        </div>
      </div>

      <div class="tf__panel" data-panel="2">
        <label class="tf__label" for="tf-code">アプリに出た6桁のコード</label>
        <input class="tf__input" id="tf-code" type="text" inputmode="numeric" maxlength="6" value="482173">
        <button class="tf__go tf__go--wide" type="button" id="tf-ok">確認</button>
      </div>

      <div class="tf__panel" data-panel="3">
        <span class="tf__shield" aria-hidden="true"><svg viewBox="0 0 256 256" width="30" height="30"><g fill="currentColor"><path d="M216 56v56c0 96-88 120-88 120s-88-24-88-120V56a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 40H48a16 16 0 0 0-16 16v56c0 52.72 25.52 84.67 46.93 102.19c23.06 18.86 46 25.26 47 25.53a8 8 0 0 0 4.2 0c1-.27 23.91-6.67 47-25.53C198.48 196.67 224 164.72 224 112V56a16 16 0 0 0-16-16m0 72c0 37.07-13.66 67.16-40.6 89.42a129.3 129.3 0 0 1-39.4 22.2a128.3 128.3 0 0 1-38.92-21.81C61.82 179.51 48 149.3 48 112V56h160ZM82.34 141.66a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 11.32l-56 56a8 8 0 0 1-11.32 0Z"/></g></svg></span>
        <p class="tf__done">二段階認証が有効になりました</p>
        <ul class="tf__codes">
          <li class="tf__chip">7K4M</li>
          <li class="tf__chip">B3XR</li>
          <li class="tf__chip">9PL5</li>
          <li class="tf__chip">Z6HD</li>
          <li class="tf__chip">M2VK</li>
          <li class="tf__chip">Q8TN</li>
        </ul>
      </div>
    </div>
  </section>
</main>
<script>
// 실제 동작: 次へ → コード確認 → 완료. 걸음이 바뀌면 눈금의 aria-current 도 함께 옮긴다
var root = document.getElementById('tf');
var code = document.getElementById('tf-code');
function goStep(n) {
  root.classList.remove('is-demo');       // 사람이 만졌으니 자동 루프를 끈다
  root.setAttribute('data-step', String(n));
  var ns = root.querySelectorAll('.tf__notch');
  for (var i = 0; i < ns.length; i++) {
    if (i + 1 === n) ns[i].setAttribute('aria-current', 'step');
    else ns[i].removeAttribute('aria-current');
  }
}
document.getElementById('tf-next').addEventListener('click', function () {
  goStep(2);
  code.focus({ preventScroll: true });
});
document.getElementById('tf-ok').addEventListener('click', function () { goStep(3); });
code.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); goStep(3); }
});
</script>
</body>
</html>
