<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password change — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="pw is-demo" data-strength="0" data-msg="idle" data-bad="false">
    <div class="pw__card">

      <div class="pw__row">
        <div class="pw__box">
          <label class="pw__lab" for="pw-cur">지금 쓰는 비밀번호</label>
          <div class="pw__field">
            <input class="pw__in" id="pw-cur" type="password" autocomplete="current-password">
            <span class="pw__ghost" data-g="cur" aria-hidden="true">••••••••</span>
          </div>
        </div>
      </div>

      <div class="pw__row">
        <div class="pw__box">
          <label class="pw__lab" for="pw-new">새 비밀번호</label>
          <div class="pw__field">
            <input class="pw__in" id="pw-new" type="password" autocomplete="new-password">
            <span class="pw__ghost" data-g="new" aria-hidden="true">••••••••••••</span>
          </div>
        </div>
        <div class="pw__meter" aria-hidden="true">
          <span class="pw__cell"><i class="pw__fill" data-n="1"></i></span>
          <span class="pw__cell"><i class="pw__fill" data-n="2"></i></span>
          <span class="pw__cell"><i class="pw__fill" data-n="3"></i></span>
          <span class="pw__cell"><i class="pw__fill" data-n="4"></i></span>
        </div>
      </div>

      <div class="pw__row">
        <div class="pw__box" data-box="confirm">
          <label class="pw__lab" for="pw-confirm">새 비밀번호 확인</label>
          <div class="pw__field">
            <input class="pw__in" id="pw-confirm" type="password" autocomplete="new-password" aria-describedby="pw-hint">
            <span class="pw__ghost" data-g="confirm" aria-hidden="true">••••••••••••</span>
          </div>
        </div>
      </div>

      <p class="pw__hint" id="pw-hint" role="status" aria-live="polite">
        <span class="pw__msg" data-msg="idle">여덟 자 이상, 숫자와 기호를 섞습니다</span>
        <span class="pw__msg" data-msg="bad">확인 칸이 새 비밀번호와 다릅니다</span>
        <span class="pw__msg" data-msg="ok">두 칸이 같습니다</span>
        <span class="pw__msg" data-msg="saved">비밀번호를 바꿨습니다</span>
      </p>

      <button class="pw__save" id="pw-save" type="button" aria-disabled="true">비밀번호 바꾸기</button>
    </div>
  </section>
</main>
<script>
// 실제 동작: 세 칸이 조건을 채울 때까지 저장은 aria-disabled 로 잠겨 있고, 눌리면 이유를 읽어 준다
var root = document.querySelector('.pw');
var cur = document.getElementById('pw-cur');
var nw = document.getElementById('pw-new');
var cf = document.getElementById('pw-confirm');
var save = document.getElementById('pw-save');
function strength(v) {
  var n = 0;
  if (v.length >= 8) n++;
  if (/[0-9]/.test(v)) n++;
  if (/[^A-Za-z0-9]/.test(v)) n++;
  if (/[A-Z]/.test(v) && /[a-z]/.test(v)) n++;
  return n;
}
function refresh() {
  root.classList.remove('is-demo');   // 사람이 치기 시작했으니 자동 루프를 끈다
  var s = strength(nw.value);
  var bad = cf.value.length > 0 && cf.value !== nw.value;
  var ok = cur.value.length > 0 && s >= 3 && cf.value.length > 0 && !bad;
  root.setAttribute('data-strength', String(s));
  root.setAttribute('data-bad', String(bad));
  root.setAttribute('data-msg', bad ? 'bad' : (ok ? 'ok' : 'idle'));
  save.setAttribute('aria-disabled', String(!ok));
}
[cur, nw, cf].forEach(function (el) { el.addEventListener('input', refresh); });
save.addEventListener('click', function () {
  root.classList.remove('is-demo');
  if (save.getAttribute('aria-disabled') === 'true') {   // 진짜 disabled 가 아니라 이유를 읽어 준다
    root.setAttribute('data-msg', root.getAttribute('data-bad') === 'true' ? 'bad' : 'idle');
    cf.focus({ preventScroll: true });
    return;
  }
  root.setAttribute('data-msg', 'saved');
});
</script>
</body>
</html>
