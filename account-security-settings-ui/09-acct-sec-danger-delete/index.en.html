<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete account danger zone — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="dz is-demo" data-open="no">
    <p class="dz__head">
      <span class="dz__ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 256 256"><g fill="currentColor"><path d="M215.46 216H40.54c-12.62 0-20.54-13.21-14.41-23.91l87.46-151.87c6.3-11 22.52-11 28.82 0l87.46 151.87c6.13 10.7-1.79 23.91-14.41 23.91" opacity=".2"/><path d="M236.8 188.09L149.35 36.22a24.76 24.76 0 0 0-42.7 0L19.2 188.09a23.51 23.51 0 0 0 0 23.72A24.35 24.35 0 0 0 40.55 224h174.9a24.35 24.35 0 0 0 21.33-12.19a23.51 23.51 0 0 0 .02-23.72m-13.87 15.71a8.5 8.5 0 0 1-7.48 4.2H40.55a8.5 8.5 0 0 1-7.48-4.2a7.59 7.59 0 0 1 0-7.72l87.45-151.87a8.75 8.75 0 0 1 15 0l87.45 151.87a7.59 7.59 0 0 1-.04 7.72M120 144v-40a8 8 0 0 1 16 0v40a8 8 0 0 1-16 0m20 36a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></svg></span>
      Danger zone
    </p>
    <p class="dz__desc">Deleting the account takes your posts and files with it. Type DELETE exactly into the field.</p>
    <label class="dz__label" for="dz-input">Confirmation</label>
    <span class="dz__slot">
      <input class="dz__input" id="dz-input" type="text" autocomplete="off" spellcheck="false" placeholder="DELETE">
      <span class="dz__ghost" aria-hidden="true"><span class="dz__typed">DELETE</span></span>
    </span>
    <button class="dz__btn" id="dz-del" type="button" aria-disabled="true">
      <span class="dz__ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 256 256"><g fill="currentColor"><path d="M200 56v152a8 8 0 0 1-8 8H64a8 8 0 0 1-8-8V56Z" opacity=".2"/><path d="M216 48h-40v-8a24 24 0 0 0-24-24h-48a24 24 0 0 0-24 24v8H40a8 8 0 0 0 0 16h8v144a16 16 0 0 0 16 16h128a16 16 0 0 0 16-16V64h8a8 8 0 0 0 0-16M96 40a8 8 0 0 1 8-8h48a8 8 0 0 1 8 8v8H96Zm96 168H64V64h128Zm-80-104v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0m48 0v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0"/></g></svg></span>
      Delete account
    </button>
    <p class="dz__live" id="dz-live" role="status" aria-live="polite">
      <span class="dz__word" data-word="lock">It opens only when DELETE is typed exactly</span>
      <span class="dz__word" data-word="open">The delete button is now open</span>
    </p>
    <span class="dz__scrim" aria-hidden="true"></span>
    <div class="dz__dialog" id="dz-dialog" role="alertdialog" aria-modal="true" aria-labelledby="dz-dtitle" aria-describedby="dz-dbody">
      <p class="dz__dtitle" id="dz-dtitle">Delete for good?</p>
      <p class="dz__dbody" id="dz-dbody">It can be undone within 30 days.</p>
      <span class="dz__drow">
        <button class="dz__dbtn dz__dbtn--no" id="dz-no" type="button">Cancel</button>
        <button class="dz__dbtn dz__dbtn--yes" id="dz-yes" type="button">Delete</button>
      </span>
    </div>
  </section>
</main>
<script>
// 실제 동작: DELETE 를 정확히 쳐야 버튼이 열리고, 열린 확인창 안에 초점이 갇힌다 (Escape 로 닫는다)
var root = document.querySelector('.dz');
var input = document.getElementById('dz-input');
var delBtn = document.getElementById('dz-del');
var dialog = document.getElementById('dz-dialog');
var noBtn = document.getElementById('dz-no');
var yesBtn = document.getElementById('dz-yes');
var live = document.getElementById('dz-live');
var word = 'DELETE';
function isLocked() { return input.value !== word; }
function openDialog(on) {
  root.setAttribute('data-open', on ? 'yes' : 'no');
  (on ? noBtn : delBtn).focus({ preventScroll: true });
}
input.addEventListener('input', function () {
  root.classList.remove('is-demo');             // 사람이 만졌으니 자동 루프를 끈다
  delBtn.setAttribute('aria-disabled', String(isLocked()));
  live.textContent = isLocked() ? 'It opens only when DELETE is typed exactly' : 'The delete button is now open';
});
delBtn.addEventListener('click', function () { if (!isLocked()) openDialog(true); });
noBtn.addEventListener('click', function () { openDialog(false); });
yesBtn.addEventListener('click', function () { openDialog(false); live.textContent = 'Your delete request was sent'; });
dialog.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { openDialog(false); return; }
  if (e.key !== 'Tab') return;
  e.preventDefault();                            // 초점이 확인창 밖으로 못 나간다
  (document.activeElement === noBtn ? yesBtn : noBtn).focus({ preventScroll: true });
});
</script>
</body>
</html>
