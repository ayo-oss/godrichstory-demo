<script>
// 실제 동작: 줄을 누르면 「확인함」 표시가 켜지고 알림 영역이 그 줄을 읽어 준다. 키보드로도 된다
var root = document.querySelector('.lh');
var live = document.getElementById('lh-live');
var rows = document.querySelectorAll('.lh__row');
Array.prototype.forEach.call(rows, function (row) {
  row.addEventListener('click', function () {
    root.classList.remove('is-demo');           // 사람이 만졌으니 자동 루프를 끈다
    var isOn = row.getAttribute('aria-pressed') === 'true';
    row.setAttribute('aria-pressed', String(!isOn));
    var when = row.querySelector('.lh__when').textContent;
    live.textContent = isOn ? when + ' 기록의 확인 표시를 지웠습니다' : when + ' 기록을 확인함으로 표시했습니다';
  });
});
</script>
