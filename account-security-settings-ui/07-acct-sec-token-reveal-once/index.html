<head>

<body>
<main class="stage">

      값은 한 번만 보입니다
    </p>
    <div class="tk__field">
      <span class="tk__ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 256 256"><g fill="currentColor"><path d="M232 98.36c-1.27 38.56-33.33 69.64-71.91 69.64a71.7 71.7 0 0 1-26.92-5.17L120 176H96v24H72v24H40a8 8 0 0 1-8-8v-28.69a8 8 0 0 1 2.34-5.65l58.83-58.83A71.7 71.7 0 0 1 88 95.91c0-38.58 31.08-70.64 69.64-71.87A72 72 0 0 1 232 98.36" opacity=".2"/><path d="M216.57 39.43a80 80 0 0 0-132.66 81.35L28.69 176A15.86 15.86 0 0 0 24 187.31V216a16 16 0 0 0 16 16h32a8 8 0 0 0 8-8v-16h16a8 8 0 0 0 8-8v-16h16a8 8 0 0 0 5.66-2.34l9.56-9.57A79.7 79.7 0 0 0 160 176h.1a80 80 0 0 0 56.47-136.57M224 98.1c-1.09 34.09-29.75 61.86-63.89 61.9H160a63.7 63.7 0 0 1-23.65-4.51a8 8 0 0 0-8.84 1.68L116.69 168H96a8 8 0 0 0-8 8v16H72a8 8 0 0 0-8 8v16H40v-28.69l58.83-58.82a8 8 0 0 0 1.68-8.84A63.7 63.7 0 0 1 96 95.92c0-34.14 27.81-62.8 61.9-63.89A64 64 0 0 1 224 98.1M192 76a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></svg></span>
      <span class="tk__slot">
        <span class="tk__val" id="tk-val">q7hm-42vd-xk9r-3ptz</span>
        <span class="tk__cover" aria-hidden="true"></span>
      </span>
    </div>
    <div class="tk__row">
      <button class="tk__btn tk__btn--issue" id="tk-issue" type="button">발급</button>
      <button class="tk__btn tk__btn--copy" id="tk-copy" type="button" aria-disabled="true">
        <span class="tk__ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 40v128h-48V88H88V40Z" opacity=".2"/><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></g></svg></span>
        복사
      </button>
    </div>
    <p class="tk__live" role="status" aria-live="polite">
      <span class="tk__word" data-word="hidden">아직 발급하지 않았습니다</span>
      <span class="tk__word" data-word="shown">지금만 보입니다. 복사하면 닫힙니다</span>
      <span class="tk__word" data-word="burned">복사했습니다. 다시 볼 수 없습니다</span>
    </p>
  </section>
</main>
<script>
// 실제 동작: 발급 → 덮개가 걷히고, 복사하면 진짜로 클립보드에 넣은 뒤 같은 자리가 다시 덮인다
var root = document.querySelector('.tk');
var valueEl = document.getElementById('tk-val');
var issueBtn = document.getElementById('tk-issue');
var copyBtn = document.getElementById('tk-copy');
function setState(s) {
  root.classList.remove('is-demo');            // 사람이 만졌으니 자동 루프를 끈다
  root.setAttribute('data-state', s);
  issueBtn.disabled = s !== 'hidden';
  copyBtn.setAttribute('aria-disabled', String(s !== 'shown'));
}
issueBtn.addEventListener('click', function () { setState('shown'); });
copyBtn.addEventListener('click', function () {
  if (root.getAttribute('data-state') !== 'shown') return;   // 잠긴 버튼은 아무 일도 하지 않는다
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(valueEl.textContent).catch(function () {});
  }
  setState('burned');                                // 한 번 복사하면 다시는 안 열린다
});
</script>
</body>
</html>
