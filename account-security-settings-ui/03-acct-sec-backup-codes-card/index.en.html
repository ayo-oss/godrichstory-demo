<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup codes card — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="bc is-demo" id="bc" data-copied="0">
    <h2 class="bc__title">Backup codes</h2>
    <ul class="bc__grid">
      <li class="bc__code" data-code="1">D4K9-P2M7<span class="bc__strike" data-strike="1"></span></li>
      <li class="bc__code" data-code="2">X8R3-T6W1<span class="bc__strike" data-strike="2"></span></li>
      <li class="bc__code bc__code--used" data-code="3">Q5N8-J2H4<span class="bc__strike" data-strike="3"></span></li>
      <li class="bc__code" data-code="4">M7V2-C9L5<span class="bc__strike" data-strike="4"></span></li>
      <li class="bc__code" data-code="5">R3F6-B8K2<span class="bc__strike" data-strike="5"></span></li>
      <li class="bc__code bc__code--used" data-code="6">H9T4-N5D7<span class="bc__strike" data-strike="6"></span></li>
    </ul>
    <button class="bc__copy" type="button" id="bc-copy">
      <span class="bc__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="16" height="16"><g fill="currentColor"><path d="M216 40v128h-48V88H88V40Z" opacity=".2"/><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></g></svg></span>
      <span class="bc__labels">
        <span class="bc__label" data-label="copy">Copy all</span>
        <span class="bc__label" data-label="done">Copied</span>
      </span>
    </button>
    <p class="bc__live" role="status" aria-live="polite"><span class="bc__say">Copied 6 backup codes to the clipboard</span></p>
  </section>
</main>
<script>
// 실제 동작: 전체 복사는 navigator.clipboard.writeText 로 실제로 쓰고, 라벨이 잠깐 갈렸다 돌아오며 같은 말이 읽힌다
var root = document.getElementById('bc');
var btn = document.getElementById('bc-copy');
var live = root.querySelector('.bc__live');
var t = 0;
var fullCode = function () {
  var cs = root.querySelectorAll('.bc__code');
  var out = [];
  for (var i = 0; i < cs.length; i++) out.push(cs[i].firstChild.nodeValue);
  return out.join('\n');
};
btn.addEventListener('click', function () {
  root.classList.remove('is-demo');        // 사람이 만졌으니 자동 루프를 끈다
  clearTimeout(t);
  root.setAttribute('data-copied', '1');
  var txt = fullCode();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt);
  }
  live.textContent = 'Copied 6 backup codes to the clipboard';
  t = setTimeout(function () { root.setAttribute('data-copied', '0'); }, 1600);
});
</script>
</body>
</html>
