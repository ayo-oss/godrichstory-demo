<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursor spotlight background — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <span class="spot is-demo" aria-hidden="true"></span>
  <p class="hint">포인트 조명</p>
</main>
<script>
// 실제 페이지에서는 좌표를 pointermove 값으로 바꿔 스포트라이트가 커서를 따라가게 한다. 데모(.is-demo)는 궤도를 자동으로 돈다.
if (matchMedia('(pointer: fine)').matches) {
  var stage = document.querySelector('.stage');
  var spot = document.querySelector('.spot');
  stage.addEventListener('pointermove', function (e) {
    var r = stage.getBoundingClientRect();
    spot.classList.remove('is-demo');
    spot.style.transform = 'translate(' + (e.clientX - r.left - r.width / 2) + 'px,' + (e.clientY - r.top - r.height / 2) + 'px)';
  });
}
</script>
</body>
</html>
