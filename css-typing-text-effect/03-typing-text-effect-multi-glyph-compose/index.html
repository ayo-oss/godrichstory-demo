<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing text — multi-glyph composed typing demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <p class="glyph"><span class="glyph__text" id="gtext">안녕하세요 Godrich 🎉</span></p>
</main>
<script>
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var el = document.getElementById('gtext'), s = el.textContent, cv = document.createElement('canvas').getContext('2d');
  cv.font = getComputedStyle(el).font;
  var w = 0, cum = [0];
  for (var i = 0; i < s.length; i++) { w += cv.measureText(s[i]).width; cum.push(w); }
  var kf = cum.map(function (px) { return { clipPath: 'inset(0 ' + (100 - px / w * 70) + '% 0 0)', offset: px / w * .7 }; });
  kf.push({ clipPath: 'inset(0 0% 0 0)', offset: .88 }, { clipPath: 'inset(0 100% 0 0)', offset: 1 });
  el.animate(kf, { duration: 2000, iterations: Infinity });
})();
</script>
</body>
</html>
