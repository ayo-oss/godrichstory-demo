<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing text — multi-line typing demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="lines">
    <p class="lines__row"><span class="lines__text lines__text--1">Frontend developer</span></p>
    <p class="lines__row"><span class="lines__text lines__text--2">I love CSS animation</span></p>
    <p class="lines__row"><span class="lines__text lines__text--3">I enjoy coffee and typing</span></p>
  </div>
</main>
<script>
(function () {
  var cv = document.createElement('canvas').getContext('2d');
  document.querySelectorAll('.lines__text').forEach(function (el) {
    cv.font = getComputedStyle(el).font;
    el.style.setProperty('--full', Math.ceil(cv.measureText(el.textContent).width) + 'px');
  });
})();
</script>
</body>
</html>
