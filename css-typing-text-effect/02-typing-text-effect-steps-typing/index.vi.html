<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing text — steps() typewriter demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <p class="type"><span class="type__text">Copy dán một dòng là xong</span></p>
</main>
<script>
(function () {
  var el = document.querySelector('.type__text'), cv = document.createElement('canvas').getContext('2d');
  cv.font = getComputedStyle(el).font;
  el.style.setProperty('--full', Math.ceil(cv.measureText(el.textContent).width) + 'px');
})();
</script>
</body>
</html>
