<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing text — word swap demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <p class="swap">
    <span class="swap__prefix">이건 바로 </span><span class="swap__slot"><span class="swap__word swap__word--1">디자이너</span><span class="swap__word swap__word--2">개발자</span><span class="swap__word swap__word--3">마케터</span></span><span class="swap__suffix"> 를 위한 도구예요</span>
  </p>
</main>
<script>
(function () {
  var cv = document.createElement('canvas').getContext('2d');
  document.querySelectorAll('.swap__word').forEach(function (el) {
    cv.font = getComputedStyle(el).font;
    el.style.setProperty('--full', Math.ceil(cv.measureText(el.textContent).width) + 'px');
  });
})();
</script>
</body>
</html>
