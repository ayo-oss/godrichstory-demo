<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>親子を1つのまとまりとして一緒に動かすネストしたトランジション — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gn is-demo" id="gn">
  <button type="button" class="gn__card" id="gnCard" aria-label="カードを開く">
    <span class="gn__thumb" id="gnThumb"></span>
    <span class="gn__title" id="gnTitle">グループカード</span>
  </button>
</div>
</main>
<script>
(function () {
  var SUPPORTS_VT = 'startViewTransition' in document;

  var root = document.getElementById('gn');
  var card = document.getElementById('gnCard');
  var thumb = document.getElementById('gnThumb');
  var title = document.getElementById('gnTitle');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var open = false;
  var isDemo = true;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function render() {
    card.classList.toggle('is-open', open);
  }

  function change(fn) {
    if (SUPPORTS_VT) { document.startViewTransition(fn); }
    else { fn(); }
  }

  function toggle() {
    open = !open;
    change(render);
  }

  card.addEventListener('click', function () { human(); toggle(); });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { human(); e.preventDefault(); toggle(); }
  });

  var HOLD_MS = 1000;
  function loop() {
    if (!isDemo) return;
    toggle();
    window.setTimeout(loop, HOLD_MS);
  }

  if (!reduce) {
    window.setTimeout(loop, HOLD_MS);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</body>
</html>
