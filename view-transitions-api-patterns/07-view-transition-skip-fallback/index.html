<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지원 여부 값을 먼저 확인해 물러나는 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sf is-demo" id="sf">
  <div class="sf__card" id="sfCard">
    <p class="sf__num" id="sfNum">01</p>
  </div>
  <p class="sf__meta">
    <span class="sf__pill" id="sfSupport">지원 값 예</span>
    <span class="sf__pill sf__pill--path" id="sfPath">전환 사용</span>
  </p>
  <button type="button" class="sf__btn" id="sfBtn" aria-label="지원 여부 값을 뒤집어 경로 전환">환경 뒤집기</button>
</div>
</main>
<script>
(function () {
  var SUPPORTS_VT = 'startViewTransition' in document;

  var root = document.getElementById('sf');
  var card = document.getElementById('sfCard');
  var numEl = document.getElementById('sfNum');
  var supportEl = document.getElementById('sfSupport');
  var pathEl = document.getElementById('sfPath');
  var btn = document.getElementById('sfBtn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var STATES = ['01', '02', '03'];
  var si = 0;
  var isDemo = true;
  // 데모 전용: 실제로는 지원하는 환경이지만, 지원하지 않는 환경의 물러나는 경로를 눈에 보이도록
  // 번갈아 흉내 낸다. 판정 코드 자체는 실제 SUPPORTS_VT 값을 그대로 쓴다.
  var simulateUnsupported = false;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function renderLabels(usedTransition) {
    supportEl.textContent = simulateUnsupported ? '지원 값 아니오' : '지원 값 예';
    pathEl.textContent = usedTransition ? '전환 사용' : '즉시 전환(대체)';
    pathEl.classList.toggle('is-fallback', !usedTransition);
  }

  function applyState() {
    si = (si + 1) % STATES.length;
    numEl.textContent = STATES[si];
    card.classList.toggle('is-alt', si % 2 === 1);
  }

  // 이 함수가 규칙의 핵심이다: 지원 여부 값을 먼저 확인하고(SUPPORTS_VT), 시뮬레이션으로
  // "지원하지 않는 환경"을 흉내 낼 때는 지원 여부와 무관하게 즉시 전환(대체) 경로로 물러난다.
  function step() {
    var willUseTransition = SUPPORTS_VT && !simulateUnsupported;
    if (willUseTransition) {
      document.startViewTransition(applyState);
    } else {
      applyState();
    }
    renderLabels(willUseTransition);
  }

  btn.addEventListener('click', function () { human(); simulateUnsupported = !simulateUnsupported; step(); });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { human(); e.preventDefault(); simulateUnsupported = !simulateUnsupported; step(); }
  });
  var HOLD_MS = 600;
  function loop() {
    if (!isDemo) return;
    simulateUnsupported = !simulateUnsupported;
    step();
    window.setTimeout(loop, HOLD_MS);
  }

  renderLabels(SUPPORTS_VT);
  if (!reduce) {
    window.setTimeout(loop, HOLD_MS);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</body>
</html>
