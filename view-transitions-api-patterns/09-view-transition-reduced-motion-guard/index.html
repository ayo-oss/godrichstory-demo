<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동작 줄임 값을 감지해 전환을 끄는 안전장치 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rg is-demo" id="rg">
  <div class="rg__card" id="rgCard">
    <span class="rg__badge" id="rgBadge">켬</span>
  </div>
  <p class="rg__meta">
    <span class="rg__pill" id="rgReduce">동작 줄임 꺼짐</span>
    <span class="rg__pill" id="rgDur">지속시간 <b id="rgDurV">320</b>ms</span>
  </p>
  <button type="button" class="rg__btn" id="rgBtn" aria-label="동작 줄임 값 뒤집어 보기">값 뒤집기</button>
</div>
</main>
<script>
(function () {
  var SUPPORTS_VT = 'startViewTransition' in document;
  var REAL_REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NORMAL_MS = 300;

  var root = document.getElementById('rg');
  var card = document.getElementById('rgCard');
  var badge = document.getElementById('rgBadge');
  var reduceEl = document.getElementById('rgReduce');
  var durVEl = document.getElementById('rgDurV');
  var btn = document.getElementById('rgBtn');

  var on = true;
  var isDemo = true;
  // 데모 전용: 실제 환경 값(REAL_REDUCE)은 헤드리스 렌더에서 대개 꺼짐으로 읽히므로,
  // 값이 켜졌을 때의 전환 붕괴를 눈으로 보이도록 번갈아 흉내 낸다.
  var simulateReduce = false;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function render() {
    on = !on;
    card.classList.toggle('is-off', !on);
    badge.textContent = on ? '켬' : '끔';
  }

  // 계산 겹: 실제 동작 줄임 값과 시연용 값을 합쳐 하나의 효과값으로 만들고, 그 값에 따라
  // 지속시간을 0으로 낮출지 정상값을 쓸지 결정한다 — 접근성 판단은 항상 REAL_REDUCE 를 포함한다.
  function effectiveReduce() { return REAL_REDUCE || simulateReduce; }

  function step() {
    var reduceNow = effectiveReduce();
    var dur = reduceNow ? 0 : NORMAL_MS;
    reduceEl.textContent = reduceNow ? '동작 줄임 켜짐' : '동작 줄임 꺼짐';
    durVEl.textContent = String(dur);

    if (SUPPORTS_VT && !reduceNow) {
      document.startViewTransition(render);
    } else {
      render();
    }
  }

  btn.addEventListener('click', function () { human(); simulateReduce = !simulateReduce; step(); });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { human(); e.preventDefault(); simulateReduce = !simulateReduce; step(); }
  });

  var HOLD_MS = 480;
  function loop() {
    if (!isDemo) return;
    simulateReduce = !simulateReduce;
    step();
    window.setTimeout(loop, HOLD_MS);
  }

  reduceEl.textContent = effectiveReduce() ? '동작 줄임 켜짐' : '동작 줄임 꺼짐';
  durVEl.textContent = String(effectiveReduce() ? 0 : NORMAL_MS);
  if (!REAL_REDUCE) {
    window.setTimeout(loop, HOLD_MS);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</body>
</html>
