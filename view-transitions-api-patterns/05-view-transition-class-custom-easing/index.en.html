<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class-tagged transition that gives each element group a different easing value — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ce is-demo" id="ce">
  <div class="ce__hero" id="ceHero"></div>
  <button type="button" class="ce__btn" id="ceBtn" aria-label="Trigger transition — background slow, button fast">Transition</button>
</div>
</main>
<script>
(function () {
  var SUPPORTS_VT = 'startViewTransition' in document;

  var root = document.getElementById('ce');
  var hero = document.getElementById('ceHero');
  var btn = document.getElementById('ceBtn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wide = false;
  var isDemo = true;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function render() {
    root.classList.toggle('is-wide', wide);
  }

  function change(fn) {
    if (SUPPORTS_VT) { document.startViewTransition(fn); }
    else { fn(); }
  }

  function toggle() {
    wide = !wide;
    change(render);
  }

  btn.addEventListener('click', function () { human(); toggle(); });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { human(); e.preventDefault(); toggle(); }
  });

  var HOLD_MS = 1000;
  function loop() {
    if (!isDemo) return;
    toggle();
    window.setTimeout(loop, HOLD_MS);
  }

  if (!reduce) {
    window.setTimeout(loop, HOLD_MS);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</body>
</html>
