<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이동 방향 값을 읽어 반대로 도는 슬라이드 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ds is-demo" id="ds">
  <div class="ds__dots" id="dsDots">
    <span class="ds__dot is-active" data-i="0"></span>
    <span class="ds__dot" data-i="1"></span>
    <span class="ds__dot" data-i="2"></span>
    <span class="ds__dot" data-i="3"></span>
  </div>
  <div class="ds__panel" id="dsPanel">
    <p class="ds__num" id="dsNum">1</p>
    <p class="ds__t" id="dsT">주소 입력</p>
  </div>
  <div class="ds__nav">
    <button type="button" class="ds__navBtn" id="dsPrev" aria-label="이전 단계">이전</button>
    <button type="button" class="ds__navBtn" id="dsNext" aria-label="다음 단계">다음</button>
  </div>
</div>
</main>
<script>
(function () {
  var SUPPORTS_VT = 'startViewTransition' in document;

  var root = document.getElementById('ds');
  var panel = document.getElementById('dsPanel');
  var numEl = document.getElementById('dsNum');
  var tEl = document.getElementById('dsT');
  var dots = Array.prototype.slice.call(document.querySelectorAll('.ds__dot'));
  var prevBtn = document.getElementById('dsPrev');
  var nextBtn = document.getElementById('dsNext');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var STEPS = ['주소 입력', '결제 값 확인', '수령 방법', '완료'];
  var idx = 0;
  var isDemo = true;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function render(newIdx) {
    numEl.textContent = String(newIdx + 1);
    tEl.textContent = STEPS[newIdx];
    dots.forEach(function (d, i) { d.classList.toggle('is-active', i === newIdx); });
    idx = newIdx;
  }

  function change(fn) {
    if (SUPPORTS_VT) { document.startViewTransition(fn); }
    else { fn(); }
  }

  function goto(newIdx) {
    if (newIdx === idx || newIdx < 0 || newIdx > 3) return;
    // 계산 겹: 다음 인덱스 - 현재 인덱스의 부호만 취해 이동 방향 값을 얻는다 (+1 앞으로 · -1 뒤로)
    var dir = Math.sign(newIdx - idx) || 1;
    document.documentElement.style.setProperty('--dir', String(dir));
    change(function () { render(newIdx); });
  }

  nextBtn.addEventListener('click', function () { human(); goto(idx + 1 > 3 ? 0 : idx + 1); });
  prevBtn.addEventListener('click', function () { human(); goto(idx - 1 < 0 ? 3 : idx - 1); });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { human(); goto(idx + 1 > 3 ? 0 : idx + 1); }
    else if (e.key === 'ArrowLeft') { human(); goto(idx - 1 < 0 ? 3 : idx - 1); }
  });

  var seq = [1, 2, 3, 2, 1, 0];
  var si = 0;
  var HOLD_MS = 900;
  function loop() {
    if (!isDemo) return;
    goto(seq[si % seq.length]);
    si++;
    window.setTimeout(loop, HOLD_MS);
  }

  if (!reduce) {
    window.setTimeout(loop, HOLD_MS);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</body>
</html>
