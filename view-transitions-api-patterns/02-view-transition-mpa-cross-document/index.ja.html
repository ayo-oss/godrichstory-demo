<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>実際の文書遷移でも途切れないドキュメント間トランジション — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mp is-demo" id="mp">
  <p class="mp__bar" id="mpBar" aria-hidden="true"><span class="mp__dot"></span><span id="mpUrl">godrichstory.example/list</span></p>
  <div class="mp__view" id="mpView">
    <div class="mp__doc" id="mpList">
      <p class="mp__kicker">文書A</p>
      <p class="mp__h">記事一覧</p>
      <button type="button" class="mp__row" id="mpOpen" aria-label="記事アイテムを開く — 同一文書であるかのように再現">
        <span class="mp__chip" id="mpChipList">N</span><span class="mp__rowT">遷移アイテム</span>
      </button>
      <p class="mp__row mp__row--ghost"></p>
      <p class="mp__row mp__row--ghost"></p>
    </div>
    <div class="mp__doc mp__doc--article" id="mpArticle" hidden>
      <button type="button" class="mp__back" id="mpBack" aria-label="一覧の文書に戻る">戻る</button>
      <span class="mp__chip mp__chip--lg" id="mpChipArt">N</span>
      <p class="mp__h">遷移アイテム</p>
      <p class="mp__desc">この画面は実際に新しい文書の値を読み込んだかのように再現したものだ。</p>
    </div>
  </div>
  <p class="mp__note">同一文書内で文書遷移を再現したシミュレーション — 実際に新しい文書は読み込まない。</p>
</div>
</main>
<script>
(function () {
  var SUPPORTS_VT = 'startViewTransition' in document;

  // 시뮬레이션 안내: 실제 문서 간(MPA) 전환은 브라우저가 @view-transition { navigation: auto }
  // 규칙을 문서마다 읽어 두 문서의 스냅샷을 자동으로 잇는다. 이 데모는 같은 문서 안에서
  // 주소 표시줄 값과 文書A/B 전환만 흉내 낸 것으로, 실제 페이지 이동·불러오기는 없다.
  var root = document.getElementById('mp');
  var bar = document.getElementById('mpBar');
  var urlEl = document.getElementById('mpUrl');
  var list = document.getElementById('mpList');
  var article = document.getElementById('mpArticle');
  var openBtn = document.getElementById('mpOpen');
  var backBtn = document.getElementById('mpBack');
  var chipList = document.getElementById('mpChipList');
  var chipArt = document.getElementById('mpChipArt');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var atArticle = false;
  var isDemo = true;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function toArticleRender() {
    urlEl.textContent = 'godrichstory.example/list/item-07';
    list.hidden = true;
    article.hidden = false;
    chipArt.textContent = chipList.textContent;
    atArticle = true;
  }

  function toListRender() {
    urlEl.textContent = 'godrichstory.example/list';
    article.hidden = true;
    list.hidden = false;
    atArticle = false;
  }

  function change(fn) {
    if (SUPPORTS_VT) { document.startViewTransition(fn); }
    else { fn(); }
  }

  function toArticle() {
    if (atArticle) return;
    change(toArticleRender);
  }
  function toList() {
    if (!atArticle) return;
    change(toListRender);
  }

  openBtn.addEventListener('click', function () { human(); toArticle(); });
  backBtn.addEventListener('click', function () { human(); toList(); });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { human(); toList(); }
  });

  var HOLD_MS = 1000;
  function loop() {
    if (!isDemo) return;
    if (atArticle) toList(); else toArticle();
    window.setTimeout(loop, HOLD_MS);
  }

  if (!reduce) {
    window.setTimeout(loop, HOLD_MS);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</body>
</html>
