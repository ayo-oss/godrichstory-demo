<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transition that slides items when the sort-order value changes — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lr is-demo" id="lr">
  <button type="button" class="lr__sort" id="lrSort" aria-label="Flip price sort order">Price ascending</button>
  <ul class="lr__list" id="lrList">
    <li class="lr__item" data-id="a"><span class="lr__name">Alpha item</span><span class="lr__price" data-v="12000">12,000</span></li>
    <li class="lr__item" data-id="b"><span class="lr__name">Beta item</span><span class="lr__price" data-v="4000">4,000</span></li>
    <li class="lr__item" data-id="c"><span class="lr__name">Gamma item</span><span class="lr__price" data-v="19000">19,000</span></li>
    <li class="lr__item" data-id="d"><span class="lr__name">Delta item</span><span class="lr__price" data-v="8000">8,000</span></li>
  </ul>
</div>
</main>
<script>
(function () {
  var SUPPORTS_VT = 'startViewTransition' in document;

  var root = document.getElementById('lr');
  var sortBtn = document.getElementById('lrSort');
  var list = document.getElementById('lrList');
  var items = Array.prototype.slice.call(list.children);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 계산 겹: 카드마다 데이터 id 값으로 고유한 이름표 값을 지어 붙인다 — 순서가 바뀌어도
  // 같은 카드는 같은 이름표를 유지하니 브라우저가 "이 카드가 저 자리로 이동했다"를 알 수 있다.
  items.forEach(function (el) {
    el.style.viewTransitionName = 'lr-item-' + el.dataset.id;
  });

  var asc = true;
  var isDemo = true;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  function render() {
    var sorted = items.slice().sort(function (a, b) {
      var av = Number(a.querySelector('.lr__price').dataset.v);
      var bv = Number(b.querySelector('.lr__price').dataset.v);
      return asc ? av - bv : bv - av;
    });
    sorted.forEach(function (el) { list.appendChild(el); });
    sortBtn.textContent = asc ? 'Price ascending' : 'Price descending';
  }

  function change(fn) {
    if (SUPPORTS_VT) { document.startViewTransition(fn); }
    else { fn(); }
  }

  function toggleSort() {
    asc = !asc;
    change(render);
  }

  sortBtn.addEventListener('click', function () { human(); toggleSort(); });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { human(); e.preventDefault(); toggleSort(); }
  });

  var HOLD_MS = 1000;
  function loop() {
    if (!isDemo) return;
    toggleSort();
    window.setTimeout(loop, HOLD_MS);
  }

  if (!reduce) {
    window.setTimeout(loop, HOLD_MS);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</body>
</html>
