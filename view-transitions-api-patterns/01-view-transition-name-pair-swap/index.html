<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고유 이름표 값으로 요소를 짝지어 잇는 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="np is-demo" id="np">
  <div class="np__grid" id="npGrid">
    <button type="button" class="np__card" id="npCard0" data-id="0" aria-label="알파 열기">
      <span class="np__badge">A</span><span class="np__t">알파</span>
    </button>
    <button type="button" class="np__card" id="npCard1" data-id="1" aria-label="베타 열기">
      <span class="np__badge">B</span><span class="np__t">베타</span>
    </button>
    <button type="button" class="np__card" id="npCard2" data-id="2" aria-label="감마 열기">
      <span class="np__badge">C</span><span class="np__t">감마</span>
    </button>
  </div>
  <div class="np__detail" id="npDetail" hidden>
    <button type="button" class="np__back" id="npBack" aria-label="목록으로">뒤로</button>
    <span class="np__badge np__badge--lg" id="npDetailBadge">A</span>
    <p class="np__title" id="npDetailTitle">알파</p>
    <p class="np__desc">이름표 값 <code id="npName">card-0</code>로 짝지어졌다</p>
  </div>
</div>
</main>
<script>
(function () {
  var SUPPORTS_VT = 'startViewTransition' in document;

  var root = document.getElementById('np');
  var grid = document.getElementById('npGrid');
  var detail = document.getElementById('npDetail');
  var back = document.getElementById('npBack');
  var cards = [0, 1, 2].map(function (i) { return document.getElementById('npCard' + i); });
  var detailBadge = document.getElementById('npDetailBadge');
  var detailTitle = document.getElementById('npDetailTitle');
  var nameEl = document.getElementById('npName');
  var DATA = [{ b: 'A', t: '알파' }, { b: 'B', t: '베타' }, { b: 'C', t: '감마' }];
  var HOLD_MS = 1000;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var opened = null;
  var isDemo = true;

  function human() {
    if (isDemo) { root.classList.remove('is-demo'); isDemo = false; }
  }

  // 계산 겹: 이름표 값(view-transition-name)을 그 순간 선택된 카드 하나에만 실어 보낸다 —
  // 모든 카드에 상시 부여하면 이름이 겹쳐 매칭이 깨진다. 값은 매번 새로 계산해서 준다.
  function assignName(id, on) {
    cards[id].style.viewTransitionName = on ? 'np-shared' : '';
  }

  function openRender(id) {
    if (opened !== null) assignName(opened, false);
    assignName(id, true);
    detail.style.viewTransitionName = 'np-shared';
    grid.hidden = true;
    detail.hidden = false;
    detailBadge.textContent = DATA[id].b;
    detailTitle.textContent = DATA[id].t;
    nameEl.textContent = 'card-' + id;
    opened = id;
  }

  function closeRender() {
    detail.hidden = true;
    grid.hidden = false;
    if (opened !== null) assignName(opened, false);
    detail.style.viewTransitionName = '';
    opened = null;
  }

  function change(fn) {
    if (SUPPORTS_VT) { document.startViewTransition(fn); }
    else { fn(); }
  }

  function open(id) {
    if (opened === id) return;
    change(function () { openRender(id); });
  }

  function close() {
    if (opened === null) return;
    change(closeRender);
  }

  cards.forEach(function (c, i) {
    c.addEventListener('click', function () { human(); open(i); });
  });
  back.addEventListener('click', function () { human(); close(); });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { human(); close(); }
  });

  var seq = [0, 1, 2];
  var si = 0;
  function loop() {
    if (!isDemo) return;
    if (opened === null) { open(seq[si % seq.length]); si++; }
    else { close(); }
    window.setTimeout(loop, HOLD_MS);
  }

  if (!reduce) {
    window.setTimeout(loop, HOLD_MS);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</body>
</html>
