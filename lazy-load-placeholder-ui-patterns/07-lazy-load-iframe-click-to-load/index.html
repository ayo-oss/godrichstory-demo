<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클릭 값이 판정하는 임베드 자리 지연 로딩 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lic is-demo" id="lic">
  <div class="lic__frame" id="licFrame" tabindex="0" role="button" aria-label="지도 임베드 불러오기">
    <div class="lic__notice" id="licNotice">
      <span class="lic__pin">📍</span>
      <p class="lic__text">클릭하면 지도를 불러옵니다</p>
    </div>
    <svg class="lic__ripple" id="licRipple" aria-hidden="true">
      <circle id="licRippleCircle" cx="0" cy="0" r="0"></circle>
    </svg>
    <div class="lic__embed" id="licEmbed">
      <svg viewBox="0 0 220 140" width="100%" height="100%" preserveAspectRatio="none">
        <rect width="220" height="140" fill="#d8ead8"></rect>
        <path d="M0 90 L60 70 L120 96 L160 60 L220 84 L220 140 L0 140 Z" fill="#bfe0c4"></path>
        <path d="M0 40 L220 55" stroke="#f4d878" stroke-width="6"></path>
        <path d="M40 0 L70 140" stroke="#f4d878" stroke-width="5"></path>
        <circle cx="118" cy="66" r="7" fill="#e6564a"></circle>
        <circle cx="118" cy="66" r="3" fill="#fff"></circle>
      </svg>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('lic');
  var frame = document.getElementById('licFrame');
  var ripple = document.getElementById('licRipple');
  var rippleCircle = document.getElementById('licRippleCircle');
  var RIPPLE_DURATION_MS = 520;
  var LOAD_DELAY_MS = 340;
  var CYCLE_GAP_MS = 2400;

  var loaded = false;

  // 계산 겹: 클릭 지점에서 프레임 네 모서리까지의 최대 거리(피타고라스) 를
  // 리플 반지름 목표값으로 계산해, 실제 지점에서 시작하는 원이 프레임을 덮는다.
  function maxDistanceToCorner(x, y, w, h) {
    var dTL = Math.sqrt(x * x + y * y);
    var dTR = Math.sqrt((w - x) * (w - x) + y * y);
    var dBL = Math.sqrt(x * x + (h - y) * (h - y));
    var dBR = Math.sqrt((w - x) * (w - x) + (h - y) * (h - y));
    return Math.max(dTL, dTR, dBL, dBR);
  }

  function runRipple(x, y, onDone) {
    var rect = frame.getBoundingClientRect();
    var targetR = maxDistanceToCorner(x, y, rect.width, rect.height);
    rippleCircle.setAttribute('cx', String(x));
    rippleCircle.setAttribute('cy', String(y));
    rippleCircle.setAttribute('r', '0');
    ripple.classList.add('lic__ripple--active');
    var start = performance.now();
    function step(now) {
      var progress = Math.min((now - start) / RIPPLE_DURATION_MS, 1);
      rippleCircle.setAttribute('r', String(targetR * progress));
      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        ripple.classList.remove('lic__ripple--active');
        onDone();
      }
    }
    requestAnimationFrame(step);
  }

  function loadEmbed(x, y) {
    if (loaded) { return; }
    loaded = true;
    frame.classList.add('lic__frame--loading');
    runRipple(x, y, function () {
      setTimeout(function () {
        frame.classList.remove('lic__frame--loading');
        frame.classList.add('lic__frame--loaded');
        frame.setAttribute('aria-label', '지도 임베드 로드됨');
      }, LOAD_DELAY_MS);
    });
  }

  function resetEmbed() {
    loaded = false;
    frame.classList.remove('lic__frame--loading', 'lic__frame--loaded');
    frame.setAttribute('aria-label', '지도 임베드 불러오기');
  }

  frame.addEventListener('click', function (e) {
    root.classList.remove('is-demo');
    if (loaded) { return; }
    var rect = frame.getBoundingClientRect();
    loadEmbed(e.clientX - rect.left, e.clientY - rect.top);
  });

  frame.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      root.classList.remove('is-demo');
      if (loaded) { return; }
      var rect = frame.getBoundingClientRect();
      loadEmbed(rect.width / 2, rect.height / 2);
    }
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    root.classList.remove('is-demo');
    loaded = true;
    frame.classList.add('lic__frame--loaded');
    frame.setAttribute('aria-label', '지도 임베드 로드됨');
  } else {
    (function loop() {
      resetEmbed();
      setTimeout(function () {
        if (!root.classList.contains('is-demo')) { return; }
        loadEmbed(110, 70);
        setTimeout(function () {
          if (root.classList.contains('is-demo')) { loop(); }
        }, CYCLE_GAP_MS);
      }, 700);
    })();
  }
})();
</script>
</body>
</html>
