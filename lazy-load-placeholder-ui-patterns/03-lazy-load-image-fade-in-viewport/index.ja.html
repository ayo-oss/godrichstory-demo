<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スクロール位置の値が交差比率を計算する画像フェードイン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lfv is-demo" id="lfv">
  <div class="lfv__badge" id="lfvBadge">交差率0%</div>
  <div class="lfv__view" id="lfvView">
    <div class="lfv__track">
      <div class="lfv__card" data-card="1"><div class="lfv__placeholder"></div><div class="lfv__img lfv__img--1"></div></div>
      <div class="lfv__card" data-card="2"><div class="lfv__placeholder"></div><div class="lfv__img lfv__img--2"></div></div>
      <div class="lfv__card" data-card="3"><div class="lfv__placeholder"></div><div class="lfv__img lfv__img--3"></div></div>
      <div class="lfv__card" data-card="4"><div class="lfv__placeholder"></div><div class="lfv__img lfv__img--4"></div></div>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('lfv');
  var view = document.getElementById('lfvView');
  var badge = document.getElementById('lfvBadge');
  var cards = Array.prototype.slice.call(document.querySelectorAll('.lfv__card'));

  var INTERSECTION_THRESHOLD = 0.4;
  var STEPS = [];
  for (var s = 0; s <= 20; s += 1) { STEPS.push(s / 20); }

  // 계산 겹: 交差率 값으로 블러 반경·스케일을 매 관찰마다 다시 계산해
  // 뷰포트에 걸친 정도만큼 이미지가 또렷해진다. 비율이 기준을 넘으면 로드 완료로 고정.
  function applyRatio(card, ratio) {
    var img = card.querySelector('.lfv__img');
    var placeholder = card.querySelector('.lfv__placeholder');
    var blur = 10 * (1 - ratio);
    var scale = 0.92 + 0.08 * ratio;
    img.style.opacity = String(ratio);
    img.style.filter = 'blur(' + blur.toFixed(1) + 'px)';
    img.style.transform = 'scale(' + scale.toFixed(3) + ')';
    placeholder.style.opacity = String(Math.max(0, 1 - ratio * 1.4));
    if (ratio >= INTERSECTION_THRESHOLD) {
      card.classList.add('lfv__card--loaded');
    }
    if (card === cards[Math.min(cards.length - 1, Math.round(lastMaxIndex))]) {
      badge.textContent = '交差率 ' + Math.round(ratio * 100) + '%';
    }
  }

  var lastMaxIndex = 0;
  var io = new IntersectionObserver(function (entries) {
    var maxRatio = 0, maxIdx = 0;
    entries.forEach(function (entry) {
      var idx = cards.indexOf(entry.target);
      applyRatio(entry.target, entry.intersectionRatio);
      if (entry.intersectionRatio >= maxRatio) { maxRatio = entry.intersectionRatio; maxIdx = idx; }
    });
    lastMaxIndex = maxIdx;
    badge.textContent = '交差率 ' + Math.round(maxRatio * 100) + '%';
  }, { root: view, threshold: STEPS });

  cards.forEach(function (c) { io.observe(c); });

  var dir = 1;
  var autoplayTimer = null;
  function autoplayTick() {
    var max = view.scrollHeight - view.clientHeight;
    view.scrollTop += dir * 2.2;
    if (view.scrollTop >= max - 1) { dir = -1; }
    if (view.scrollTop <= 1) { dir = 1; }
  }

  function userTakesOver() {
    if (!root.classList.contains('is-demo')) { return; }
    root.classList.remove('is-demo');
    if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
  }
  view.addEventListener('wheel', userTakesOver, { passive: true });
  view.addEventListener('touchstart', userTakesOver, { passive: true });
  view.addEventListener('scroll', function () {
    // 스크롤 위치 값 자체가 IntersectionObserver 재계산의 입력이 된다 (root 스크롤).
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    root.classList.remove('is-demo');
    cards.forEach(function (c) { applyRatio(c, 1); });
    badge.textContent = '交差率100%';
  } else {
    autoplayTimer = setInterval(autoplayTick, 45);
  }
})();
</script>
</body>
</html>
