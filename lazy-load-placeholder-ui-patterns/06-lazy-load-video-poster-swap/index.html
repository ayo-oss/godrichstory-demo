<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재생 값이 판정하는 영상 포스터 지연 로딩 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lvp is-demo" id="lvp">
  <div class="lvp__frame" id="lvpFrame">
    <div class="lvp__poster" id="lvpPoster"></div>
    <div class="lvp__playing" id="lvpPlaying"></div>
    <div class="lvp__ring" id="lvpRing"></div>
    <button type="button" class="lvp__play" id="lvpPlay" aria-label="영상 재생">▶</button>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('lvp');
  var frame = document.getElementById('lvpFrame');
  var ring = document.getElementById('lvpRing');
  var playBtn = document.getElementById('lvpPlay');
  var BUFFER_DURATION_MS = 620;
  var PLAY_HOLD_MS = 1600;
  var CYCLE_GAP_MS = 700;

  var isPlaying = false;
  var raf = null;

  // 계산 겹: 경과 시간 값을 버퍼링 전체 시간 값으로 나눠 진행률을 구하고,
  // 그 진행률을 conic-gradient 각도 변수로 매 프레임 다시 써 링이 돈다.
  function runBuffering(onDone) {
    var start = performance.now();
    frame.classList.add('lvp__frame--buffering');
    function step(now) {
      var progress = Math.min((now - start) / BUFFER_DURATION_MS, 1);
      ring.style.background = 'conic-gradient(from -90deg, #5b8cf8 ' + (progress * 360).toFixed(1) + 'deg, rgba(255,255,255,.18) 0)';
      if (progress < 1) {
        raf = requestAnimationFrame(step);
      } else {
        frame.classList.remove('lvp__frame--buffering');
        onDone();
      }
    }
    raf = requestAnimationFrame(step);
  }

  function setPlaying(v) {
    isPlaying = v;
    frame.classList.toggle('lvp__frame--playing', v);
    playBtn.textContent = v ? '❚❚' : '▶';
    playBtn.setAttribute('aria-label', v ? '영상 정지' : '영상 재생');
  }

  function startPlay() {
    if (isPlaying) { return; }
    ring.style.background = 'conic-gradient(from -90deg, #5b8cf8 0deg, rgba(255,255,255,.18) 0)';
    runBuffering(function () { setPlaying(true); });
  }

  function resetToPoster() {
    if (raf) { cancelAnimationFrame(raf); }
    frame.classList.remove('lvp__frame--buffering');
    setPlaying(false);
  }

  playBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    if (isPlaying) { resetToPoster(); } else { startPlay(); }
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var loopTimer = null;
  if (reduce) {
    root.classList.remove('is-demo');
    setPlaying(true);
  } else {
    (function loop() {
      resetToPoster();
      loopTimer = setTimeout(function () {
        if (!root.classList.contains('is-demo')) { return; }
        startPlay();
        loopTimer = setTimeout(function () {
          if (root.classList.contains('is-demo')) { loop(); }
        }, PLAY_HOLD_MS);
      }, CYCLE_GAP_MS);
    })();
  }
})();
</script>
</body>
</html>
