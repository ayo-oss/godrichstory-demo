<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Background Chosen by a Screen-width Value via Lazy Loading — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lbs is-demo" id="lbs">
  <div class="lbs__badge" id="lbsBadge">Width 180px · low-res</div>
  <div class="lbs__frame" id="lbsFrame">
    <div class="lbs__placeholder" id="lbsPlaceholder"></div>
    <div class="lbs__bg lbs__bg--low" id="lbsBgLow"></div>
    <div class="lbs__bg lbs__bg--high" id="lbsBgHigh"></div>
  </div>
  <p class="lbs__hint">Click to change the width</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('lbs');
  var frame = document.getElementById('lbsFrame');
  var badge = document.getElementById('lbsBadge');
  var placeholder = document.getElementById('lbsPlaceholder');
  var bgLow = document.getElementById('lbsBgLow');
  var bgHigh = document.getElementById('lbsBgHigh');

  var BREAKPOINT_PX = 240;
  var WIDTH_NARROW = 180;
  var WIDTH_WIDE = 300;
  var LOAD_DELAY_MS = 480;
  var CROSSFADE_MS = 480;
  var CYCLE_MS = 2200;

  var lastTier = null;
  var raf = null;
  var loadTimer = null;

  // 계산 겹: 경과 시간 값을 전체 전환 시간 값으로 나눠 진행률을 구하고,
  // 그 진행률로 블러 반경과 불투명도를 매 프레임 다시 계산한다.
  function crossfadeIn(el, duration) {
    var start = performance.now();
    if (raf) { cancelAnimationFrame(raf); }
    function step(now) {
      var progress = Math.min((now - start) / duration, 1);
      el.style.opacity = String(progress);
      el.style.filter = 'blur(' + (6 * (1 - progress)) + 'px)';
      if (progress < 1) { raf = requestAnimationFrame(step); }
    }
    raf = requestAnimationFrame(step);
  }

  function applyTier(widthPx) {
    var tier = widthPx < BREAKPOINT_PX ? 'low' : 'high';
    badge.textContent = 'Width ' + Math.round(widthPx) + 'px · ' + (tier === 'low' ? 'low-res' : 'high-res');
    if (tier === lastTier) { return; }
    lastTier = tier;
    bgLow.style.opacity = '0';
    bgHigh.style.opacity = '0';
    placeholder.classList.remove('lbs__placeholder--hidden');
    if (loadTimer) { clearTimeout(loadTimer); }
    loadTimer = setTimeout(function () {
      var target = tier === 'low' ? bgLow : bgHigh;
      placeholder.classList.add('lbs__placeholder--hidden');
      crossfadeIn(target, CROSSFADE_MS);
    }, LOAD_DELAY_MS);
  }

  var ro = new ResizeObserver(function (entries) {
    for (var i = 0; i < entries.length; i += 1) {
      applyTier(entries[i].contentRect.width);
    }
  });
  ro.observe(frame);

  function setWide(wide) {
    frame.style.width = (wide ? WIDTH_WIDE : WIDTH_NARROW) + 'px';
  }

  var wide = false;
  function toggle() {
    wide = !wide;
    setWide(wide);
  }
  root.addEventListener('click', toggle);
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });
  root.tabIndex = 0;

  var autoplayTimer = null;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    root.classList.remove('is-demo');
    setWide(true);
    lastTier = 'high';
    placeholder.classList.add('lbs__placeholder--hidden');
    bgHigh.style.opacity = '1';
    bgHigh.style.filter = 'blur(0px)';
    badge.textContent = 'Width ' + WIDTH_WIDE + 'px · high-res';
  } else {
    setWide(false);
    autoplayTimer = setInterval(function () {
      if (!root.classList.contains('is-demo')) { clearInterval(autoplayTimer); return; }
      toggle();
    }, CYCLE_MS);
  }

  function userTakesOver() {
    root.classList.remove('is-demo');
  }
  root.addEventListener('click', userTakesOver);
})();
</script>
</body>
</html>
