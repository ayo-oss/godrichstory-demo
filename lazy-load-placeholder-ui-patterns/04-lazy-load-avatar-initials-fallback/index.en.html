<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar Where a Name Value Computes Initials Before Lazy Loading — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lai is-demo" id="lai">
  <ul class="lai__list" id="laiList"></ul>
  <button type="button" class="lai__btn" id="laiBtn">Load photos</button>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('lai');
  var list = document.getElementById('laiList');
  var btn = document.getElementById('laiBtn');
  var NAMES = ['Kim Haneul', 'Lee Doyun', 'Park Seojun'];
  var PALETTE = ['lai__row--a', 'lai__row--b', 'lai__row--c', 'lai__row--d'];
  var ROW_STAGGER_MS = 260;
  var LOAD_BASE_MS = 320;
  var CYCLE_GAP_MS = 2400;

  // 계산 겹 1: 이름 문자열에서 이니셜 두 글자를 잘라낸다.
  function getInitials(name) { return name.slice(0, 2); }

  // 계산 겹 2: 이름 글자 코드값을 모두 더한 뒤 팔레트 길이로 나눈 나머지로 배지 색을 고른다(해시).
  function colorHashClass(name) {
    var sum = 0;
    for (var i = 0; i < name.length; i += 1) { sum += name.charCodeAt(i); }
    return PALETTE[sum % PALETTE.length];
  }

  var rows = NAMES.map(function (name, i) {
    var li = document.createElement('li');
    li.className = 'lai__row';
    li.innerHTML =
      '<span class="lai__avatar ' + colorHashClass(name) + '" data-idx="' + i + '">' +
        '<span class="lai__initials">' + getInitials(name) + '</span>' +
        '<span class="lai__photo"></span>' +
      '</span>' +
      '<span class="lai__name">' + name + '</span>';
    list.appendChild(li);
    return li;
  });

  function reset() {
    rows.forEach(function (li) { li.querySelector('.lai__avatar').classList.remove('lai__avatar--loaded'); });
  }

  // 계산 겹 3: 목록 위치(행 인덱스) 값으로 등장 지연 시간을 계산해 순서대로 사진이 나타난다.
  var timers = [];
  function loadPhotos() {
    reset();
    rows.forEach(function (li, i) {
      var t = setTimeout(function () {
        li.querySelector('.lai__avatar').classList.add('lai__avatar--loaded');
      }, LOAD_BASE_MS + i * ROW_STAGGER_MS);
      timers.push(t);
    });
  }

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    clearTimers();
    loadPhotos();
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var autoplayTimer = null;
  if (reduce) {
    root.classList.remove('is-demo');
    rows.forEach(function (li) { li.querySelector('.lai__avatar').classList.add('lai__avatar--loaded'); });
  } else {
    (function loop() {
      clearTimers();
      loadPhotos();
      autoplayTimer = setTimeout(function () {
        if (!root.classList.contains('is-demo')) { return; }
        reset();
        setTimeout(function () {
          if (root.classList.contains('is-demo')) { loop(); }
        }, 500);
      }, LOAD_BASE_MS + rows.length * ROW_STAGGER_MS + CYCLE_GAP_MS);
    })();
  }
})();
</script>
</body>
</html>
