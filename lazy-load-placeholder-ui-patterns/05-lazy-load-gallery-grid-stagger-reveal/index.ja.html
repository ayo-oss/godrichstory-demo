<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>格子位置の値が順番を計算するギャラリーの遅延読み込み — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lgs is-demo" id="lgs">
  <div class="lgs__badge" id="lgsBadge">読み込み中</div>
  <div class="lgs__grid" id="lgsGrid"></div>
  <p class="lgs__hint">クリックで再読み込み</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('lgs');
  var grid = document.getElementById('lgsGrid');
  var badge = document.getElementById('lgsBadge');
  var COLS = 3;
  var ROWS = 2;
  var STAGGER_STEP_MS = 90;
  var START_DELAY_MS = 200;
  var CYCLE_GAP_MS = 1600;

  var cells = [];
  for (var i = 0; i < COLS * ROWS; i += 1) {
    var cell = document.createElement('div');
    cell.className = 'lgs__cell';
    cell.innerHTML = '<div class="lgs__placeholder"></div><div class="lgs__photo lgs__photo--' + (i % 4) + '"></div>';
    grid.appendChild(cell);
    cells.push(cell);
  }

  // 계산 겹: 격자 위치(행 값 + 열 값)로 지연 시간을 계산한다 — 맨해튼 거리 스태거.
  // 왼쪽 위(행0·열0)가 가장 먼저, 오른쪽 아래로 갈수록 늦게 실제 사진으로 바뀐다.
  function delayFor(idx) {
    var row = Math.floor(idx / COLS);
    var col = idx % COLS;
    return START_DELAY_MS + (row + col) * STAGGER_STEP_MS;
  }

  var timers = [];
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function loadAll() {
    cells.forEach(function (cell) { cell.classList.remove('lgs__cell--loaded'); });
    badge.textContent = '読み込み中';
    var maxDelay = 0;
    cells.forEach(function (cell, idx) {
      var d = delayFor(idx);
      maxDelay = Math.max(maxDelay, d);
      var t = setTimeout(function () { cell.classList.add('lgs__cell--loaded'); }, d);
      timers.push(t);
    });
    var t2 = setTimeout(function () { badge.textContent = 'すべて読み込み完了'; }, maxDelay + 120);
    timers.push(t2);
    return maxDelay + 120;
  }

  root.addEventListener('click', function () {
    root.classList.remove('is-demo');
    clearTimers();
    loadAll();
  });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); root.click(); }
  });
  root.tabIndex = 0;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    root.classList.remove('is-demo');
    cells.forEach(function (cell) { cell.classList.add('lgs__cell--loaded'); });
    badge.textContent = 'すべて読み込み完了';
  } else {
    (function loop() {
      clearTimers();
      var total = loadAll();
      setTimeout(function () {
        if (!root.classList.contains('is-demo')) { return; }
        setTimeout(function () {
          if (root.classList.contains('is-demo')) { loop(); }
        }, 500);
      }, total + CYCLE_GAP_MS);
    })();
  }
})();
</script>
</body>
</html>
