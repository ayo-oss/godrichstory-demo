<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크롤 임계치 값이 판정하는 아래 섹션 지연 로딩 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lsr is-demo" id="lsr">
  <div class="lsr__view" id="lsrView">
    <div class="lsr__pad"></div>
    <p class="lsr__mark">— 스크롤 임계선 —</p>
    <div class="lsr__section" id="lsrSection">
      <div class="lsr__empty" id="lsrEmpty">빈 자리</div>
      <div class="lsr__content" id="lsrContent">
        <div class="lsr__row"></div>
        <div class="lsr__row"></div>
        <div class="lsr__row"></div>
      </div>
    </div>
  </div>
  <p class="lsr__hint">스크롤해서 아래 섹션을 채워보세요</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('lsr');
  var view = document.getElementById('lsrView');
  var section = document.getElementById('lsrSection');
  var SCROLL_THRESHOLD_PX = 86;
  var AUTOSCROLL_STEP_PX = 2.2;
  var CYCLE_GAP_MS = 1400;

  var filled = false;
  var userActive = false;

  // 계산 겹: 스크롤 컨테이너의 scrollTop 값을 정해 둔 임계치(px)와 비교해,
  // 넘어선 순간에만 filled 상태로 바뀐다(넘기 전엔 빈 자리 유지).
  function checkThreshold() {
    var over = view.scrollTop >= SCROLL_THRESHOLD_PX;
    if (over && !filled) {
      filled = true;
      section.classList.add('lsr__section--filled');
    } else if (!over && filled) {
      filled = false;
      section.classList.remove('lsr__section--filled');
    }
  }

  view.addEventListener('scroll', checkThreshold);

  function takeover() {
    if (userActive) { return; }
    userActive = true;
    root.classList.remove('is-demo');
  }
  view.addEventListener('wheel', takeover, { passive: true });
  view.addEventListener('touchstart', takeover, { passive: true });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf = null;
  var loopTimer = null;

  function autoScrollTo(target, onDone) {
    function step() {
      if (userActive) { return; }
      var cur = view.scrollTop;
      var next = cur + (target > cur ? AUTOSCROLL_STEP_PX : -AUTOSCROLL_STEP_PX);
      if ((target > cur && next >= target) || (target < cur && next <= target)) {
        view.scrollTop = target;
        checkThreshold();
        onDone();
        return;
      }
      view.scrollTop = next;
      checkThreshold();
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }

  if (reduce) {
    root.classList.remove('is-demo');
    view.scrollTop = SCROLL_THRESHOLD_PX + 20;
    checkThreshold();
  } else {
    (function loop() {
      if (userActive) { return; }
      view.scrollTop = 0;
      checkThreshold();
      loopTimer = setTimeout(function () {
        if (userActive) { return; }
        autoScrollTo(140, function () {
          loopTimer = setTimeout(function () {
            if (!userActive && root.classList.contains('is-demo')) { loop(); }
          }, CYCLE_GAP_MS);
        });
      }, 500);
    })();
  }
})();
</script>
</body>
</html>
