<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text That Swaps a Fallback Font for the Real One via Lazy Loading — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lff is-demo" id="lff">
  <div class="lff__badge" id="lffBadge">Showing fallback font</div>
  <h2 class="lff__head" id="lffHead" aria-label="Lazy-load headline"></h2>
  <p class="lff__hint">Click to replay</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('lff');
  var badge = document.getElementById('lffBadge');
  var head = document.getElementById('lffHead');
  var TEXT = 'Lazy-load headline';
  var STAGGER_STEP_MS = 45;
  var FOUT_DELAY_MS = 700;
  var HOLD_MS = 1800;
  var RESET_DELAY_MS = 900;
  var timer = null;

  // 계산 겹: 글자 인덱스 값으로 전환 지연 시간을 계산해 순서대로 스프링 오버슛이 번진다.
  var chars = [];
  for (var i = 0; i < TEXT.length; i += 1) {
    var span = document.createElement('span');
    span.className = 'lff__char';
    span.textContent = TEXT[i] === ' ' ? ' ' : TEXT[i];
    span.style.transitionDelay = (i * STAGGER_STEP_MS) + 'ms';
    head.appendChild(span);
    chars.push(span);
  }

  function resetState() {
    root.classList.remove('lff--loaded');
    for (var i = 0; i < chars.length; i += 1) { chars[i].classList.remove('lff__char--loaded'); }
    badge.textContent = 'Showing fallback font';
  }

  function swapToLoaded() {
    root.classList.add('lff--loaded');
    for (var i = 0; i < chars.length; i += 1) { chars[i].classList.add('lff__char--loaded'); }
    badge.textContent = 'Real font loaded';
  }

  function playOnce(loop) {
    resetState();
    timer = setTimeout(function () {
      swapToLoaded();
      if (loop) {
        timer = setTimeout(function () { playOnce(true); }, HOLD_MS + RESET_DELAY_MS);
      }
    }, FOUT_DELAY_MS);
  }

  function replay() {
    if (timer) { clearTimeout(timer); }
    root.classList.remove('is-demo');
    playOnce(false);
  }
  root.addEventListener('click', replay);
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); replay(); }
  });
  root.tabIndex = 0;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    root.classList.remove('is-demo');
    swapToLoaded();
  } else {
    playOnce(true);
  }
})();
</script>
</body>
</html>
