                    ty = TILT_MAX * Math.sin(clock / 410);
                }
                if (reduce) {
                    tx = 0;
                    ty = 0;
                }
                ax = lerp(ax, tx, LERP_K);
                ay = lerp(ay, ty, LERP_K);
                const dt = FIXED_DT / 1000;
                for (let i = 0; i < 9; i += 1) {
                    if (who[i] === 0) {
                        continue;
                    }
                    if (zb[i] > 0 || vz[i] !== 0) {
                        vz[i] -= GRAVITY * dt;
                        zb[i] += vz[i] * dt;
                        if (zb[i] <= 0) {
                            zb[i] = 0;
                            vz[i] = Math.abs(vz[i]) > 60 ? -vz[i] * BOUNCE : 0;
                        }
                    }
                }
            },
            draw(ctx) {
                ctx.fillStyle = rgba(BG, 1);
                ctx.fillRect(0, 0, W, H);
                // 판 받침
                const hb = CELL * 1.5 + 8;
                const base = [proj(-hb, -hb, -6), proj(hb, -hb, -6), proj(hb, hb, -6), proj(-hb, hb, -6)];
                ctx.fillStyle = rgba(mix(BG, LILAC, 0.16), 1);
                ctx.beginPath();
                for (let k = 0; k < 4; k += 1) {
                    if (k === 0) {
                        ctx.moveTo(base[k][0], base[k][1]);
                    }
                    else {
                        ctx.lineTo(base[k][0], base[k][1]);
                    }
                }
                ctx.closePath();
                ctx.fill();
                const wl = m.g.line >= 0 ? LINES[m.g.line] : [];
                for (let i = 0; i < 9; i += 1) {
                    const q = quad(i);
                    let col = TILE;
                    if (wl.indexOf(i) >= 0) {
                        col = mix(TILE, MINT, 0.4);
                    }
                    if (hov === i && who[i] === 0 && !m.g.over) {
                        col = mix(TILE, CREAM, 0.16);
                    }
                    ctx.fillStyle = rgba(col, 1);
                    ctx.beginPath();
                    for (let k = 0; k < 4; k += 1) {
                        // Cell 사이 틈 — 중심 쪽으로 6% 당긴다
                        const c = proj(center(i)[0], center(i)[1], 0);
                        const x = lerp(q[k][0], c[0], 0.07);
                        const y = lerp(q[k][1], c[1], 0.07);
                        if (k === 0) {
                            ctx.moveTo(x, y);
                        }
                        else {
                            ctx.lineTo(x, y);
                        }
                    }
                    ctx.closePath();
                    ctx.fill();
                }
                // 그림자 — 높이(받침 위 떠 있는 높이 + 두께)에 비례해 멀리, 더 번지게
                for (let i = 0; i < 9; i += 1) {
                    if (who[i] === 0) {
                        continue;
                    }
                    const hgt = zb[i] + DEPTH_PX;
                    const off = hgt * SHADOW_LEN;
                    const blur = 1 + hgt * 0.16;
                    const alpha = clamp(0.5 - hgt * 0.0016, 0.18, 0.5);
                    for (let pass = 3; pass >= 0; pass -= 1) {
                        strokeMark(ctx, who[i], i, 0.5, 'rgba(10,8,22,' + (alpha / 4).toFixed(3) + ')', 7 + blur * pass * 0.9, off * 0.5, off * 0.8);
                    }
                }
                // 말 — 뒤쪽 줄부터 그린다. 두께는 높이를 여러 층으로 쌓아 표현
                const order = [0, 1, 2, 3, 4, 5, 6, 7, 8].sort(function (a, b) { return center(a)[1] - center(b)[1]; });
                for (let o = 0; o < 9; o += 1) {
                    const i = order[o];
                    if (who[i] === 0) {
                        continue;
                    }
                    const base0 = who[i] === 1 ? SKY : PINK;
                    const layers = 6;
                    for (let s = 0; s < layers; s += 1) {
                        const z = zb[i] + (DEPTH_PX * s) / (layers - 1);
                        const top = s === layers - 1;
                        const col = top ? mix(base0, CREAM, 0.25) : mix(BG, base0, 0.35 + 0.4 * (s / layers));
                        strokeMark(ctx, who[i], i, z, rgba(col, 1), top ? 8 : 9, 0, 0);
                    }
                }
            },
            label() { return gameLabel(m.g); },
            hit(x, y) {
                for (let i = 0; i < 9; i += 1) {
                    const q = quad(i);
                    let pos = 0;
                    let neg = 0;
                    for (let k = 0; k < 4; k += 1) {
                        const a = q[k];
                        const b = q[(k + 1) % 4];
                        const cr = (b[0] - a[0]) * (y - a[1]) - (b[1] - a[1]) * (x - a[0]);
                        if (cr > 0) {
                            pos += 1;
                        }
                        else {
                            neg += 1;
                        }
                    }
                    if (pos === 4 || neg === 4) {
                        return i;
                    }
                }
                return -1;
            },
            hover(i) { hov = i; },
            tap(i) { m.tap(i); },
            auto() { m.auto(); },
            rect(i) {
                const q = quad(i);
                const xs = q.map(function (p) { return p[0]; });
                const ys = q.map(function (p) { return p[1]; });
                const x0 = Math.min(xs[0], xs[1], xs[2], xs[3]);
                const y0 = Math.min(ys[0], ys[1], ys[2], ys[3]);
                return [x0, y0, Math.max(xs[0], xs[1], xs[2], xs[3]) - x0, Math.max(ys[0], ys[1], ys[2], ys[3]) - y0];
            },
            n() { return 3; },
        };
    };
    return mount(root, make);
})();
</script>
</body>
</html>
