<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">

<title>盤の中に盤があり、置いたマスが次の盤を指定して、画面がその盤へバネで拡大される入れ子の盤 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tt is-demo" id="tt">
  <canvas class="tt__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="盤の中に盤があり、置いたマスが次の盤を指定して、画面がその盤へバネで拡大される入れ子の盤"></canvas>
  <p class="tt__status" data-role="status" aria-live="polite">Xの番</p>
  <button class="tt__btn" data-role="btn" type="button">一時停止</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("tt");
    if (!root) return;
    const W = 480;
    const H = 300;
    const PI2 = Math.PI * 2;
    const FIXED_DT = 16;
    const REDUCE_STEP_MS = 900;
    const IDLE_TICKS = 150;
    const BTN_PAUSE = '一時停止';
    const BTN_PLAY = '再生';
    const BTN_NEXT = '次の場面';
    const TXT_CELL = 'マス';
    // 파스텔 팔레트 — 어두운 판 위에 밝은 색을 얹어 명도 차로 읽힌다
    const BG = [29, 26, 44];
    const TILE = [40, 36, 62];
    const MINT = [126, 226, 192];
    const SKY = [124, 196, 255];
    const LILAC = [190, 164, 255];
    const PINK = [255, 160, 190];
    const PEACH = [255, 208, 168];
    const CREAM = [255, 244, 224];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) {
        return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
    }
    // 시드 고정 난수 — 같은 시드면 언제나 같은 수열 (선형 합동 방식)
    function lcg(seed) {
        let s = seed >>> 0;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 정수 두 개로 0 이상 1 미만의 값을 만드는 해시 (같은 입력은 늘 같은 값)
    function hash2(x, y, seed) {
        let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(seed | 0, 1442695041)) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
    }
    // 값 노이즈 — 격자점 해시 네 개를 부드럽게 섞는다
    function noise2(x, y, seed) {
        const xi = Math.floor(x);
        const yi = Math.floor(y);
        const fx = smooth(x - xi);
        const fy = smooth(y - yi);
        const a = hash2(xi, yi, seed);
        const b = hash2(xi + 1, yi, seed);
        const c = hash2(xi, yi + 1, seed);
        const d = hash2(xi + 1, yi + 1, seed);
        return lerp(lerp(a, b, fx), lerp(c, d, fx), fy);
    }
    function rrect(ctx, x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.arcTo(x + w, y, x + w, y + rr, rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
        ctx.lineTo(x + rr, y + h);
        ctx.arcTo(x, y + h, x, y + h - rr, rr);
        ctx.lineTo(x, y + rr);
        ctx.arcTo(x, y, x + rr, y, rr);
        ctx.closePath();

    // 말 하나를 (cx, cy) 에 그린다. p(0~1) 만큼 대시 오프셋으로 획을 긋는다 — who 1 은 X(두 획), 2 는 O(원)
    function drawMark(ctx, who, cx, cy, r, p, w, col) {
        ctx.save();
        ctx.lineWidth = w;
        ctx.lineCap = 'round';
        ctx.strokeStyle = col;
        if (who === 1) {
            const d = r * 2 * Math.SQRT2;
            for (let k = 0; k < 2; k += 1) {
                const pk = clamp(p * 2 - k, 0, 1);
                if (pk <= 0.001) {
                    continue;
                }
                ctx.setLineDash([d, d]);
                ctx.lineDashOffset = d * (1 - pk);
                ctx.beginPath();
                if (k === 0) {
                    ctx.moveTo(cx - r, cy - r);
                    ctx.lineTo(cx + r, cy + r);
                }
                else {
                    ctx.moveTo(cx + r, cy - r);
                    ctx.lineTo(cx - r, cy + r);
                }
                ctx.stroke();
            }
        }
        else {
            const L = PI2 * r;
            if (p > 0.001) {
                ctx.setLineDash([L, L]);
                ctx.lineDashOffset = L * (1 - clamp(p, 0, 1));

                ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + PI2);
                ctx.stroke();

    function mount(root, make) {

            return function () { return; };

        const ctx0 = canvas.getContext('2d');

            return function () { return; };

        const ctx = ctx0;

        const inp = { x: -1, y: -1, cur: -1, key: false, idle: 99999 };

            cleaners.push(function () { target.removeEventListener(type, fn); });

                ctx.strokeStyle = 'rgba(255,255,255,0.92)';

                ctx.stroke();

            if (inp.key && inp.cur >= 0) {
                const n = scene.n();
                t += ' · ' + TXT_CELL + ' ' + (Math.floor(inp.cur / n) + 1) + '-' + ((inp.cur % n) + 1);
            }

                lastLabel = t;
                statusEl.textContent = t;
            }
        }
        function localPoint(e) {
            const r = canvas.getBoundingClientRect();
            inp.x = clamp((e.clientX - r.left) * W / r.width, 0, W);
            inp.y = clamp((e.clientY - r.top) * H / r.height, 0, H);
            inp.idle = 0;
            inp.key = false;
        }
        function tick(ts) {
            if (lastTs < 0) {
                lastTs = ts;
            }
            const frameDt = Math.min(ts - lastTs, 160);
            lastTs = ts;
            if (!paused) {
                accMs += frameDt;
                while (accMs >= FIXED_DT) {
                    inp.idle += 1;
                    scene.step();
                    accMs -= FIXED_DT;
                }
                show();
            }
            rafId = requestAnimationFrame(tick);
        }
        btnEl.textContent = reduce ? BTN_NEXT : BTN_PAUSE;
        if (reduce) {
            root.classList.remove('is-demo');
            scene.auto();
            scene.auto();
            scene.auto();
            show();
        }
        listen(btnEl, 'click', function () {
            if (reduce) {
                scene.auto();
                show();
                return;
            }
            paused = !paused;
            if (paused) {
                root.classList.remove('is-demo');
            }
            else {
                root.classList.add('is-demo');
            }
            btnEl.textContent = paused ? BTN_PLAY : BTN_PAUSE;
        });
        listen(canvas, 'focus', function () { focused = true; });
        listen(canvas, 'blur', function () { focused = false; if (reduce) {
            show();
        } });
        listen(canvas, 'pointermove', function (e) {
            localPoint(e);
            scene.hover(scene.hit(inp.x, inp.y));
            if (reduce) {
                show();
            }
        });
        listen(canvas, 'pointerleave', function () { scene.hover(-1); if (reduce) {
            show();
        } });
        listen(canvas, 'pointerdown', function (e) {
            localPoint(e);
            const i = scene.hit(inp.x, inp.y);
            if (i >= 0) {
                scene.tap(i);
            }
            if (reduce) {
                show();
            }
        });
        listen(canvas, 'keydown', function (e) {
            const ev = e;
            const k = ev.key;
            const n = scene.n();
            const mid = Math.floor((n * n) / 2);
            if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') {
                ev.preventDefault();
                if (inp.cur < 0) {
                    inp.cur = mid;
                }
                else {
                    let r = Math.floor(inp.cur / n);
                    let c = inp.cur % n;
                    if (k === 'ArrowLeft') {
                        c = Math.max(0, c - 1);
                    }
                    if (k === 'ArrowRight') {
                        c = Math.min(n - 1, c + 1);
                    }
                    if (k === 'ArrowUp') {
                        r = Math.max(0, r - 1);
                    }
                    if (k === 'ArrowDown') {
                        r = Math.min(n - 1, r + 1);
                    }
                    inp.cur = r * n + c;
                }
                inp.key = true;
                inp.idle = 0;
                scene.hover(inp.cur);
                if (reduce) {
                    show();
                }
                return;
            }
            if (k === 'Enter' || k === ' ') {
                ev.preventDefault();
                if (inp.cur < 0) {
                    inp.cur = mid;
                }
                inp.key = true;
                inp.idle = 0;
                scene.tap(inp.cur);
                if (reduce) {
                    show();
                }
            }
        });
        if (!reduce) {
            rafId = requestAnimationFrame(tick);
        }

            cancelAnimationFrame(rafId);
            for (let i = 0; i < cleaners.length; i += 1) {
                cleaners[i]();
            }

    }
    const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
    const SCORE_WIN = 10;
    const TXT_X_TURN = 'Xの番';
    const TXT_O_TURN = 'Oの番';
    const TXT_X_WIN = 'Xの勝ち';
    const TXT_O_WIN = 'Oの勝ち';
    const TXT_DRAW = '引き分け';
    function newGame() { return { b: [0, 0, 0, 0, 0, 0, 0, 0, 0], turn: 1, over: false, line: -1 }; }
    // 완성된 줄의 번호(LINES 안의 위치). 없으면 -1
    function lineOf(b) {
        for (let k = 0; k < LINES.length; k += 1) {
            const l = LINES[k];
            if (b[l[0]] !== 0 && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) {
                return k;
            }
        }
        return -1;
    }
    function emptyCells(b) {
        const out = [];
        for (let i = 0; i < 9; i += 1) {
            if (b[i] === 0) {
                out.push(i);
            }
        }
        return out;
    }
    function place(g, i) {
        if (g.over || g.b[i] !== 0) {
            return false;
        }
        g.b[i] = g.turn;
        g.line = lineOf(g.b);
        if (g.line >= 0 || emptyCells(g.b).length === 0) {
            g.over = true;
        }
        else {
            g.turn = 3 - g.turn;
        }
        return true;
    }
    function gameLabel(g) {
        if (g.over) {
            return g.line >= 0 ? (g.b[LINES[g.line][0]] === 1 ? TXT_X_WIN : TXT_O_WIN) : TXT_DRAW;
        }
        return g.turn === 1 ? TXT_X_TURN : TXT_O_TURN;
    }
    // 전수 탐색 — X 시점 점수. depth 가 0 이 되면 더 보지 않고 0 으로 친다. cnt.n 은 방문한 국면 수
    function solve(b, turn, ply, depth, cnt) {
        cnt.n += 1;
        const w = lineOf(b);
        if (w >= 0) {
            const s = SCORE_WIN - ply;
            if (b[LINES[w][0]] === 1) {
                cnt.x += 1;
                return s;
            }
            cnt.o += 1;
            return -s;
        }
        if (depth <= 0) {
            return 0;
        }
        let best = turn === 1 ? -1000 : 1000;
        let any = false;
        for (let i = 0; i < 9; i += 1) {
            if (b[i] !== 0) {
                continue;
            }
            b[i] = turn;
            const v = solve(b, 3 - turn, ply + 1, depth - 1, cnt);
            b[i] = 0;
            any = true;
            if (turn === 1 ? v > best : v < best) {
                best = v;
            }
        }
        return any ? best : 0;
    }
    // 둘 곳마다 점수. 이미 찬 칸은 NaN. 둔 사람(turn) 시점이 아니라 X 시점 값이다
    function cellScores(b, turn, depth, cnt, per) {
        const out = [];
        for (let i = 0; i < 9; i += 1) {
            if (b[i] !== 0) {
                out.push(NaN);
                if (per) {
                    per.push({ n: 0, x: 0, o: 0 });
                }
                continue;
            }
            b[i] = turn;
            const c = { n: 0, x: 0, o: 0 };
            out.push(solve(b, 3 - turn, 1, depth - 1, c));
            b[i] = 0;
            cnt.n += c.n;
            cnt.x += c.x;
            cnt.o += c.o;
            if (per) {
                per.push(c);
            }
        }
        return out;
    }
    function bestCell(b, turn, depth) {
        const cnt = { n: 0, x: 0, o: 0 };
        const sc = cellScores(b, turn, depth, cnt);
        let best = -1;
        for (let i = 0; i < 9; i += 1) {
            if (isNaN(sc[i])) {
                continue;

            if (best < 0 || (turn === 1 ? sc[i] > sc[best] : sc[i] < sc[best])) {
                best = i;

        return best;
    }
    function gridRect(i, ox, oy, cs) {
        return [ox + (i % 3) * cs, oy + Math.floor(i / 3) * cs, cs, cs];
    }
    function gridHit(x, y, ox, oy, cs) {
        const c = Math.floor((x - ox) / cs);

    const MATCH_DEPTH = 9;
    const REPLY_MS = 420;
    // 한 판 진행기 — 사람은 X, 컴퓨터는 O. 사람이 가만히 있으면(idle) 둘 다 컴퓨터가 두어 루프를 만든다.

    }
    const ZOOM_K = 2.6;
    const FOCUS_MS = 640;
    const DIM_ALPHA = 0.32;
    const SPRING_ZETA = 0.6;
    const TURN_MS = 620;
    const HOLD_MS = 1800;
    const BIG = 270;
    const SMALL = 90;
    const UNIT = 30;

    const make = function (inp, reduce) {

                over = true;
                winner = bigVals[LINES[winLine][0]];

                over = true;

                const b = boardOf(i);
                const c = cellOf(i);
                let s = rng() * 8;
                if (completes(b, c, turn)) {
                    s += 100;
                }
                else if (completes(b, c, 3 - turn)) {
                    s += 40;
                }
                if (c === 4) {
                    s += 6;
                }
                // 상대를 보낼 판에서 상대가 바로 이기면 감점
                if (sw[c] === 0) {
                    for (let q = 0; q < 9; q += 1) {
                        if (cells[gidx(c, q)] === 0 && completes(c, q, 3 - turn)) {
                            s -= 30;
                            break;
                        }
                    }
                }
                if (s > bs) {
                    bs = s;
                    best = i;
                }
            }
            return best;
        }
        function resetAll() {
            for (let i = 0; i < 81; i += 1) {
                cells[i] = 0;
                age[i] = -1;
            }
            for (let b = 0; b < 9; b += 1) {
                sw[b] = 0;
                swAge[b] = 0;
            }
            turn = 1;
            fb = -1;
            over = false;
            winLine = -1;
            winner = 0;
            hold = 0;
            t = 0;
            reply = -1;
            snap();
        }
        // 카메라 목표 — 정해진 판이 있으면 그 판으로 줌, 없으면 전체
        function goal() {
            if (fb >= 0) {
                return [(fb % 3) * SMALL + SMALL / 2, Math.floor(fb / 3) * SMALL + SMALL / 2, ZOOM_K];
            }
            return [BIG / 2, BIG / 2, 1];
        }
        function snap() {
            if (!reduce) {
                return;
            }
            const g = goal();
            cx = g[0];
            cy = g[1];
            sc = g[2];
        }
        function toScreen(wx, wy) { return [W / 2 + (wx - cx) * sc, H / 2 + (wy - cy) * sc]; }
        function cellRect(i) {
            const p = toScreen((i % 9) * UNIT, Math.floor(i / 9) * UNIT);
            return [p[0], p[1], UNIT * sc, UNIT * sc];
        }
        snap();
        return {
            step() {
                clock += FIXED_DT;
                const dt = FIXED_DT / 1000;
                const g = goal();
                const k = omega * omega;
                const c2 = 2 * SPRING_ZETA * omega;
                vx += (-k * (cx - g[0]) - c2 * vx) * dt;
                vy += (-k * (cy - g[1]) - c2 * vy) * dt;
                vs += (-k * (sc - g[2]) - c2 * vs) * dt;
                cx += vx * dt;
                cy += vy * dt;
                sc += vs * dt;
                for (let i = 0; i < 81; i += 1) {
                    if (age[i] >= 0) {
                        age[i] += FIXED_DT;
                    }
                }
                for (let b = 0; b < 9; b += 1) {
                    if (sw[b] !== 0) {
                        swAge[b] += FIXED_DT;
                    }
                }
                if (over) {
                    hold += FIXED_DT;
                    if (hold >= HOLD_MS) {
                        resetAll();
                    }
                    return;
                }
                if (reply >= 0) {
                    reply -= FIXED_DT;
                    if (reply < 0) {
                        place6(chooseMove());
                    }
                    return;
                }
                if (inp.idle > IDLE_TICKS) {
                    t += FIXED_DT;
                    if (t >= TURN_MS) {
                        t = 0;
                        place6(chooseMove());
                    }
                }
            },
            draw(ctx) {
                ctx.fillStyle = rgba(BG, 1);
                ctx.fillRect(0, 0, W, H);
                ctx.save();
                ctx.translate(W / 2, H / 2);
                ctx.scale(sc, sc);
                ctx.translate(-cx, -cy);
                const bigWin = winLine >= 0 ? LINES[winLine] : [];
                for (let b = 0; b < 9; b += 1) {
                    const bx = (b % 3) * SMALL;
                    const by = Math.floor(b / 3) * SMALL;
                    const active = !over && sw[b] === 0 && (fb < 0 || fb === b);
                    const a = active ? 1 : DIM_ALPHA;
                    ctx.globalAlpha = a;
                    let col = mix(TILE, CREAM, active && fb === b ? 0.1 : 0.02);
                    if (bigWin.indexOf(b) >= 0) {
                        col = mix(TILE, MINT, 0.35);
                    }
                    ctx.fillStyle = rgba(col, 1);
                    rrect(ctx, bx + 2, by + 2, SMALL - 4, SMALL - 4, 6);
                    ctx.fill();
                    // 소판 격자선
                    ctx.strokeStyle = rgba(CREAM, 0.22);
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    for (let q = 1; q < 3; q += 1) {
                        ctx.moveTo(bx + 8 + q * 24.67, by + 8);
                        ctx.lineTo(bx + 8 + q * 24.67, by + SMALL - 8);
                        ctx.moveTo(bx + 8, by + 8 + q * 24.67);
                        ctx.lineTo(bx + SMALL - 8, by + 8 + q * 24.67);
                    }
                    ctx.stroke();
                    for (let c = 0; c < 9; c += 1) {
                        const i = gidx(b, c);
                        if (cells[i] === 0) {
                            continue;
                        }
                        const mx = (i % 9) * UNIT + UNIT / 2;
                        const my = Math.floor(i / 9) * UNIT + UNIT / 2;
                        drawMark(ctx, cells[i], mx, my, 7.5, clamp(age[i] / MARK_MS, 0, 1), 2.6, rgba(cells[i] === 1 ? SKY : PINK, 1));
                    }
                    if (hov >= 0 && boardOf(hov) === b && legal(hov)) {
                        const hx = (hov % 9) * UNIT;
                        const hy = Math.floor(hov / 9) * UNIT;
                        ctx.fillStyle = rgba(CREAM, 0.14);
                        rrect(ctx, hx + 3, hy + 3, UNIT - 6, UNIT - 6, 4);
                        ctx.fill();
                    }
                    if (sw[b] === 1 || sw[b] === 2) {
                        const q = clamp(swAge[b] / 320, 0, 1);
                        ctx.globalAlpha = a * smooth(q) * 0.92;
                        ctx.fillStyle = rgba(BG, 0.55);
                        rrect(ctx, bx + 2, by + 2, SMALL - 4, SMALL - 4, 6);
                        ctx.fill();
                        ctx.globalAlpha = 1;
                        drawMark(ctx, sw[b], bx + SMALL / 2, by + SMALL / 2, 26, q, 7, rgba(sw[b] === 1 ? SKY : PINK, smooth(q)));
                    }
                    ctx.globalAlpha = 1;
                }
                if (winLine >= 0) {
                    const l = LINES[winLine];
                    const ax = (l[0] % 3) * SMALL + SMALL / 2;
                    const ay = Math.floor(l[0] / 3) * SMALL + SMALL / 2;
                    const bx2 = (l[2] % 3) * SMALL + SMALL / 2;
                    const by2 = Math.floor(l[2] / 3) * SMALL + SMALL / 2;
                    ctx.strokeStyle = rgba(CREAM, 0.9);
                    ctx.lineWidth = 5;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(ax, ay);
                    ctx.lineTo(bx2, by2);
                    ctx.stroke();
                }
                ctx.restore();
            },
            label() {
                if (over) {
                    return winner === 1 ? TXT_X_WIN : (winner === 2 ? TXT_O_WIN : TXT_DRAW);
                }
                return turn === 1 ? TXT_X_TURN : TXT_O_TURN;
            },
            hit(x, y) {
                const wx = (x - W / 2) / sc + cx;
                const wy = (y - H / 2) / sc + cy;
                const c = Math.floor(wx / UNIT);
                const r = Math.floor(wy / UNIT);
                return c >= 0 && c < 9 && r >= 0 && r < 9 ? r * 9 + c : -1;
            },
            hover(i) { hov = i; },
            tap(i) {
                if (over) {
                    resetAll();
                    return;
                }
                if (turn !== 1 || !legal(i)) {
                    return;
                }
                place6(i);
                if (!over) {
                    if (reduce) {
                        place6(chooseMove());
                    }
                    else {
                        reply = REPLY_MS;
                    }
                }
            },
            auto() {
                if (over) {
                    resetAll();
                }
                else {
                    place6(chooseMove());
                }
            },
            rect(i) { return cellRect(i); },
            n() { return 9; },
        };
    };
    return mount(root, make);
})();
</script>
</body>
</html>
