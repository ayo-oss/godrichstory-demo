<script>
(function () {
    const root = document.getElementById("tt");

    const PI2 = Math.PI * 2;
    const FIXED_DT = 16;
    const REDUCE_STEP_MS = 900;

    const BTN_PLAY = 'Play';

    const BG = [29, 26, 44];
    const TILE = [40, 36, 62];
    const MINT = [126, 226, 192];
    const SKY = [124, 196, 255];

    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

    function mix(a, b, k) {

    function lcg(seed) {

    // 정수 두 개로 0 이상 1 미만의 값을 만드는 해시 (같은 입력은 늘 같은 값)
    function hash2(x, y, seed) {

        return (h >>> 0) / 4294967296;

    // 값 노이즈 — 격자점 해시 네 개를 부드럽게 섞는다
    function noise2(x, y, seed) {

        const yi = Math.floor(y);
        const fx = smooth(x - xi);
        const fy = smooth(y - yi);
        const a = hash2(xi, yi, seed);
        const b = hash2(xi + 1, yi, seed);
        const c = hash2(xi, yi + 1, seed);

    function rrect(ctx, x, y, w, h, r) {

        ctx.lineTo(x + w - rr, y);
        ctx.arcTo(x + w, y, x + w, y + rr, rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
        ctx.lineTo(x + rr, y + h);
        ctx.arcTo(x, y + h, x, y + h - rr, rr);

        ctx.arcTo(x, y, x + rr, y, rr);
        ctx.closePath();

    // 말 하나를 (cx, cy) 에 그린다. p(0~1) 만큼 대시 오프셋으로 획을 긋는다 — who 1 은 X(두 획), 2 는 O(원)

                ctx.lineDashOffset = d * (1 - pk);

                if (k === 0) {
                    ctx.moveTo(cx - r, cy - r);
                    ctx.lineTo(cx + r, cy + r);

                else {
                    ctx.moveTo(cx + r, cy - r);
                    ctx.lineTo(cx - r, cy + r);

                ctx.stroke();

        let lastLabel = '';

            cleaners.push(function () { target.removeEventListener(type, fn); });

                ctx.strokeStyle = 'rgba(255,255,255,0.92)';

            }

                statusEl.textContent = t;

            inp.key = false;
        }

                lastTs = ts;
            }
            const frameDt = Math.min(ts - lastTs, 160);
            lastTs = ts;
            if (!paused) {
                accMs += frameDt;
                while (accMs >= FIXED_DT) {
                    inp.idle += 1;
                    scene.step();
                    accMs -= FIXED_DT;
                }
                show();

            rafId = requestAnimationFrame(tick);
        }
        btnEl.textContent = reduce ? BTN_NEXT : BTN_PAUSE;
        if (reduce) {
            root.classList.remove('is-demo');
            scene.auto();
            scene.auto();
            scene.auto();
            show();
        }
        listen(btnEl, 'click', function () {
            if (reduce) {
                scene.auto();
                show();
                return;
            }
            paused = !paused;
            if (paused) {
                root.classList.remove('is-demo');
            }
            else {
                root.classList.add('is-demo');
            }
            btnEl.textContent = paused ? BTN_PLAY : BTN_PAUSE;
        });
        listen(canvas, 'focus', function () { focused = true; });
        listen(canvas, 'blur', function () { focused = false; if (reduce) {
            show();
        } });
        listen(canvas, 'pointermove', function (e) {
            localPoint(e);
            scene.hover(scene.hit(inp.x, inp.y));
            if (reduce) {
                show();
            }
        });
        listen(canvas, 'pointerleave', function () { scene.hover(-1); if (reduce) {
            show();
        } });

            localPoint(e);
            const i = scene.hit(inp.x, inp.y);
            if (i >= 0) {
                scene.tap(i);
            }
            if (reduce) {
                show();
            }
        });
        listen(canvas, 'keydown', function (e) {
            const ev = e;
            const k = ev.key;
            const n = scene.n();
            const mid = Math.floor((n * n) / 2);
            if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') {
                ev.preventDefault();
                if (inp.cur < 0) {
                    inp.cur = mid;
                }
                else {
                    let r = Math.floor(inp.cur / n);
                    let c = inp.cur % n;
                    if (k === 'ArrowLeft') {
                        c = Math.max(0, c - 1);
                    }
                    if (k === 'ArrowRight') {
                        c = Math.min(n - 1, c + 1);
                    }
                    if (k === 'ArrowUp') {
                        r = Math.max(0, r - 1);
                    }
                    if (k === 'ArrowDown') {
                        r = Math.min(n - 1, r + 1);
                    }
                    inp.cur = r * n + c;

                inp.key = true;
                inp.idle = 0;
                scene.hover(inp.cur);
                if (reduce) {
                    show();
                }
                return;
            }
            if (k === 'Enter' || k === ' ') {
                ev.preventDefault();
                if (inp.cur < 0) {
                    inp.cur = mid;
                }
                inp.key = true;
                inp.idle = 0;
                scene.tap(inp.cur);
                if (reduce) {
                    show();
                }

            rafId = requestAnimationFrame(tick);

            cancelAnimationFrame(rafId);
            for (let i = 0; i < cleaners.length; i += 1) {

    const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
    const SCORE_WIN = 10;
    const TXT_X_TURN = 'X to move';
    const TXT_O_TURN = 'O to move';
    const TXT_X_WIN = 'X wins';
    const TXT_O_WIN = 'O wins';
    const TXT_DRAW = 'Draw';
    function newGame() { return { b: [0, 0, 0, 0, 0, 0, 0, 0, 0], turn: 1, over: false, line: -1 }; }

    function lineOf(b) {
        for (let k = 0; k < LINES.length; k += 1) {
            const l = LINES[k];
            if (b[l[0]] !== 0 && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) {
                return k;
            }
        }
        return -1;
    }
    function emptyCells(b) {
        const out = [];
        for (let i = 0; i < 9; i += 1) {
            if (b[i] === 0) {
                out.push(i);
            }

        return out;
    }
    function place(g, i) {
        if (g.over || g.b[i] !== 0) {
            return false;

        g.b[i] = g.turn;
        g.line = lineOf(g.b);
        if (g.line >= 0 || emptyCells(g.b).length === 0) {
            g.over = true;
        }
        else {
            g.turn = 3 - g.turn;
        }
        return true;
    }
    function gameLabel(g) {
        if (g.over) {
            return g.line >= 0 ? (g.b[LINES[g.line][0]] === 1 ? TXT_X_WIN : TXT_O_WIN) : TXT_DRAW;
        }
        return g.turn === 1 ? TXT_X_TURN : TXT_O_TURN;
    }
    // 전수 탐색 — X 시점 점수. depth 가 0 이 되면 더 보지 않고 0 으로 친다. cnt.n 은 방문한 국면 수

        cnt.n += 1;
        const w = lineOf(b);
        if (w >= 0) {
            const s = SCORE_WIN - ply;
            if (b[LINES[w][0]] === 1) {
                cnt.x += 1;
                return s;
            }
            cnt.o += 1;
            return -s;
        }
        if (depth <= 0) {
            return 0;
        }
        let best = turn === 1 ? -1000 : 1000;
        let any = false;
        for (let i = 0; i < 9; i += 1) {
            if (b[i] !== 0) {
                continue;
            }
            b[i] = turn;
            const v = solve(b, 3 - turn, ply + 1, depth - 1, cnt);
            b[i] = 0;
            any = true;
            if (turn === 1 ? v > best : v < best) {
                best = v;
            }

        return any ? best : 0;
    }
    // 둘 곳마다 점수. 이미 찬 칸은 NaN. 둔 사람(turn) 시점이 아니라 X 시점 값이다
    function cellScores(b, turn, depth, cnt, per) {
        const out = [];
        for (let i = 0; i < 9; i += 1) {
            if (b[i] !== 0) {
                out.push(NaN);
                if (per) {
                    per.push({ n: 0, x: 0, o: 0 });
                }
                continue;
            }
            b[i] = turn;
            const c = { n: 0, x: 0, o: 0 };
            out.push(solve(b, 3 - turn, 1, depth - 1, c));
            b[i] = 0;
            cnt.n += c.n;
            cnt.x += c.x;
            cnt.o += c.o;
            if (per) {
                per.push(c);
            }
        }
        return out;
    }
    function bestCell(b, turn, depth) {
        const cnt = { n: 0, x: 0, o: 0 };
        const sc = cellScores(b, turn, depth, cnt);

            if (isNaN(sc[i])) {

    function gridRect(i, ox, oy, cs) {

    const RING_R = 70;

    const HOLD_MS = 1500;
    const OUTER_R = 120;
    const ROOT_SIZE = 54;

    // 이 국면에서 이어질 수 있는 끝판의 수

        }
        rebuild();
        m.move(emptyCells(m.g.b)[4]);
        m.move(bestCell(m.g.b, 2, MATCH_DEPTH));
        return {
            step() {
                expandT += FIXED_DT;
                m.step();
            },
            draw(ctx) {
                ctx.fillStyle = rgba(BG, 1);
                ctx.fillRect(0, 0, W, H);
                const n = kids.length;
                const cxr = W / 2;
                const cyr = H / 2;
                for (let k = 0; k < n; k += 1) {
                    const kp = kidPos(k);
                    const pk = smooth((expandT - k * 55) / EXPAND_MS);
                    const hot = hov === kids[k].cell;
                    branch(ctx, cxr, cyr, kp[0], kp[1], kids[k].leaves, maxK, pk, valCol(kids[k].val), hot);
                    const nk = kids[k].kids.length;
                    const spread = Math.min((PI2 / n) * 0.86, 1.05);
                    for (let g = 0; g < nk; g += 1) {
                        const pg = smooth((expandT - 160 - k * 55 - g * 18) / EXPAND_MS);
                        if (pg <= 0) {
                            continue;
                        }
                        const ga = angles[k] + (nk > 1 ? (g / (nk - 1) - 0.5) * spread : 0);
                        const rr = OUTER_R + (g % 2) * 7;
                        const gx = cxr + Math.cos(ga) * rr;
                        const gy = cyr + Math.sin(ga) * rr;
                        const gc = valCol(kids[k].kids[g].val);
                        branch(ctx, kp[0], kp[1], gx, gy, kids[k].kids[g].leaves, maxG, pg, gc, hot);
                        ctx.fillStyle = rgba(gc, 0.9 * pg);
                        ctx.beginPath();
                        ctx.arc(lerp(kp[0], gx, pg), lerp(kp[1], gy, pg), NODE_R * pg, 0, PI2);
                        ctx.fill();
                    }
                }
                drawMini(ctx, m.g.b, cxr, cyr, ROOT_SIZE, -1, mix(LILAC, CREAM, 0.3), 1);
                for (let k = 0; k < n; k += 1) {
                    const kp = kidPos(k);
                    const pk = smooth((expandT - k * 55) / EXPAND_MS);
                    if (pk <= 0) {
                        continue;
                    }
                    const x = lerp(cxr, kp[0], pk);
                    const y = lerp(cyr, kp[1], pk);
                    const hot = hov === kids[k].cell;
                    drawMini(ctx, kids[k].b, x, y, hot ? KID_SIZE + 6 : KID_SIZE, kids[k].cell, valCol(kids[k].val), pk);
                }
            },
            label() { return gameLabel(m.g); },
            hit(x, y) {
                for (let k = 0; k < kids.length; k += 1) {
                    const kp = kidPos(k);
                    if (Math.abs(x - kp[0]) <= KID_SIZE / 2 + 3 && Math.abs(y - kp[1]) <= KID_SIZE / 2 + 3) {
                        return kids[k].cell;
                    }
                }
                return -1;
            },
            hover(i) { hov = i; },
            tap(i) { m.tap(i); },
            auto() { m.auto(); },
            rect(i) {
                for (let k = 0; k < kids.length; k += 1) {
                    if (kids[k].cell === i) {
                        const kp = kidPos(k);
                        return [kp[0] - KID_SIZE / 2, kp[1] - KID_SIZE / 2, KID_SIZE, KID_SIZE];
                    }
                }
                return gridRect(i, W / 2 - ROOT_SIZE / 2, H / 2 - ROOT_SIZE / 2, ROOT_SIZE / 3);
            },
            n() { return 3; },
        };
    };
    return mount(root, make);
})();
</script>
