<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポインターや矢印キーで二本の腕を好きな角度まで動かすと計算が止まり、手を放した瞬間にその角度から速度0で再び動き出す。 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bp is-demo" id="bpRoot">
  <canvas class="bp__canvas" id="bpCanvas" width="480" height="300" tabindex="0" aria-label="ポインターや矢印キーで二本の腕を好きな角度まで動かすと計算が止まり、手を放した瞬間にその角度から速度0で再び動き出す。"></canvas>
  <p class="bp__status" id="bpStatus" aria-live="polite">デモ実行中</p>
  <button class="bp__btn" id="bpBtn" type="button">最初の姿勢</button>
  <p class="bp__caption">ポインターや矢印キーで二本の腕を好きな角度まで動かすと計算が止まり、手を放した瞬間にその角度から速度0で再び動き出す。</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('bpRoot');
  var canvas = document.getElementById('bpCanvas');
  var statusEl = document.getElementById('bpStatus');
  var btnEl = document.getElementById('bpBtn');
  "use strict";
  function main(root, canvas, statusEl, btnEl) {
      var ctx0 = canvas.getContext('2d');
      if (!ctx0) {
          return function () { return; };
      }
      var ctx = ctx0;
      var wrap = canvas.parentElement ? canvas.parentElement : root;
      var CALC_W = 320, CALC_H = 200;
      var FIXED_DT = 16;
      var REDUCE_STEP_FRAMES = 40;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var demo = !reduce;
      if (!demo)
          root.classList.remove('is-demo');
      function stopDemo() { demo = false; root.classList.remove('is-demo'); }
      var paused = false;
      var ownInput = false;
      var cw = 480, ch = 300, sc = 1.5, elapsed = 0, rafId = 0;
      var cleaners = [];
      function listen(target, type, fn) {
          target.addEventListener(type, fn);
          cleaners.push(function () { target.removeEventListener(type, fn); });
      }
      function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
      function setStatus(msg) { statusEl.textContent = msg; }
      function hsl(h, s, l, a) {
          return 'hsla(' + (h % 360) + ',' + s + '%,' + l + '%,' + a + ')';
      }
      function canvasPoint(e) {
          var r = canvas.getBoundingClientRect();
          return { x: (e.clientX - r.left) / r.width * CALC_W, y: (e.clientY - r.top) / r.height * CALC_H };
      }
      // 배경 — 어두운 잉크색 위에 방사형 빛무리를 (gx, gy) 에 깐다
      function beginDraw(inner, outer, gx, gy) {
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.fillStyle = '#1d1a2b';
          ctx.fillRect(0, 0, cw, ch);
          ctx.setTransform(sc, 0, 0, sc, 0, 0);
          var g = ctx.createRadialGradient(gx, gy, 8, gx, gy, 230);
          g.addColorStop(0, inner);
          g.addColorStop(1, outer);
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, CALC_W, CALC_H);
      }
      function seg(x1, y1, x2, y2, w, col) {
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.lineCap = 'round';
          ctx.lineWidth = w;
          ctx.strokeStyle = col;
          ctx.stroke();
      }
      function disc(x, y, r, col) {
          ctx.beginPath();
          ctx.arc(x, y, r, 0, 6.2832);
          ctx.fillStyle = col;
          ctx.fill();
      }
      function glow(x, y, r, rgb, a) {
          var g = ctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')');
          g.addColorStop(1, 'rgba(' + rgb + ',0)');
          ctx.fillStyle = g;
          ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }
      function drawTrail(arr, rgb, w, alpha) {
          ctx.lineCap = 'round';
          for (var i = 1; i < arr.length; i += 1) {
              var f = i / arr.length;
              ctx.beginPath();
              ctx.moveTo(arr[i - 1].x, arr[i - 1].y);
              ctx.lineTo(arr[i].x, arr[i].y);
              ctx.strokeStyle = 'rgba(' + rgb + ',' + (alpha * f * f) + ')';
              ctx.lineWidth = w * (0.3 + 0.7 * f);
              ctx.stroke();
          }
      }
      function pushTrail(arr, x, y, max) {
          arr.push({ x: x, y: y });
          if (arr.length > max) {
              arr.shift();
          }
      }
      function defaultToggle() {
          if (reduce) {
              for (var i = 0; i < REDUCE_STEP_FRAMES; i += 1) {
                  elapsed += FIXED_DT;
                  stepFrame();
              }
              draw();
              setStatus('一場面ずつ送っています');
              return;
          }
          paused = !paused;
          btnEl.textContent = paused ? '再生' : '一時停止';
          setStatus(paused ? '一時停止中' : 'デモ実行中');
      }
      var onButton = defaultToggle;
      // 기법: 포인터 위치에서 각도를 atan2 로 거꾸로 구해 팔 각도에 넣고, 끄는 동안은 적분을 멈췄다가 놓는 순간 속도 0 에서 출발시킨다
      var DT = 0.01;
      var SUBSTEPS = 3;
      var START_T1 = 1.2;
      var START_T2 = 2.0;
      var GRAB_RADIUS = 22;
      var KEY_ANGLE_STEP = 0.12;
      var PATH_STEPS = 150;
      var TRAIL_LEN = 80;
      var DEMO_CYCLE_MS = 4800;
      var DEMO_DRAG_START_MS = 200;
      var DEMO_DRAG_END_MS = 1300;
      var DEMO_POSES = [[1.6, 2.4], [-2.0, 1.1], [2.5, -1.5], [-1.1, -2.4]];
      var L1 = 1.0;
      var L2 = 1.0;
      var M1 = 1.0;
      var M2 = 1.0;
      var G = 9.81;
      var UNIT = 34, PIVOT_X = 160, PIVOT_Y = 68;
      var PREROLL_FRAMES = 0;
      // 라그랑주 운동방정식 — 각도는 아래 방향이 0, 시계 방향이 양수
      function accTheta1(t1, t2, w1, w2) {
          var d = t1 - t2;
          var den = L1 * (2 * M1 + M2 - M2 * Math.cos(2 * d));
          return (-G * (2 * M1 + M2) * Math.sin(t1) - M2 * G * Math.sin(t1 - 2 * t2)
              - 2 * Math.sin(d) * M2 * (w2 * w2 * L2 + w1 * w1 * L1 * Math.cos(d))) / den;
      }
      function accTheta2(t1, t2, w1, w2) {
          var d = t1 - t2;
          var den = L2 * (2 * M1 + M2 - M2 * Math.cos(2 * d));
          return (2 * Math.sin(d) * (w1 * w1 * L1 * (M1 + M2) + G * (M1 + M2) * Math.cos(t1)
              + w2 * w2 * L2 * M2 * Math.cos(d))) / den;
      }
      // 룽게-쿠타 4단계 — 한 걸음을 네 번 기울기로 평균 낸다 (s = [t1, t2, w1, w2])
      function rk4Step(s, h) {
          var t1 = s[0], t2 = s[1], w1 = s[2], w2 = s[3];
          var h2 = h * 0.5;
          var k1a = w1, k1b = w2, k1c = accTheta1(t1, t2, w1, w2), k1d = accTheta2(t1, t2, w1, w2);
          var u1 = t1 + h2 * k1a, u2 = t2 + h2 * k1b, u3 = w1 + h2 * k1c, u4 = w2 + h2 * k1d;
          var k2a = u3, k2b = u4, k2c = accTheta1(u1, u2, u3, u4), k2d = accTheta2(u1, u2, u3, u4);
          u1 = t1 + h2 * k2a;
          u2 = t2 + h2 * k2b;
          u3 = w1 + h2 * k2c;
          u4 = w2 + h2 * k2d;
          var k3a = u3, k3b = u4, k3c = accTheta1(u1, u2, u3, u4), k3d = accTheta2(u1, u2, u3, u4);
          u1 = t1 + h * k3a;
          u2 = t2 + h * k3b;
          u3 = w1 + h * k3c;
          u4 = w2 + h * k3d;
          var k4a = u3, k4b = u4, k4c = accTheta1(u1, u2, u3, u4), k4d = accTheta2(u1, u2, u3, u4);
          s[0] = t1 + h / 6 * (k1a + 2 * k2a + 2 * k3a + k4a);
          s[1] = t2 + h / 6 * (k1b + 2 * k2b + 2 * k3b + k4b);
          s[2] = w1 + h / 6 * (k1c + 2 * k2c + 2 * k3c + k4c);
          s[3] = w2 + h / 6 * (k1d + 2 * k2d + 2 * k3d + k4d);
      }
      function bobOne(s, ox, oy) {
          return { x: ox + UNIT * L1 * Math.sin(s[0]), y: oy + UNIT * L1 * Math.cos(s[0]) };
      }
      function bobTwo(s, ox, oy) {
          var a = bobOne(s, ox, oy);
          return { x: a.x + UNIT * L2 * Math.sin(s[1]), y: a.y + UNIT * L2 * Math.cos(s[1]) };
      }
      function drawArms(s, ox, oy, c1, c2, w) {
          var a = bobOne(s, ox, oy), b = bobTwo(s, ox, oy);
          seg(ox, oy, a.x, a.y, w, c1);
          seg(a.x, a.y, b.x, b.y, w, c2);
      }
      ownInput = true;
      var sim = [START_T1, START_T2, 0, 0];
      var held = reduce;
      var grab = 0;
      var ringArm = 1;
      var trail = [];
      var preview = [];
      var demoFrom = [START_T1, START_T2];
      var demoCycle = -1;
      var demoDragging = false;
      var cursor = { x: PIVOT_X, y: PIVOT_Y };
      function makePreview() {
          var s = [sim[0], sim[1], 0, 0];
          preview = [];
          for (var i = 0; i < PATH_STEPS; i += 1) {
              for (var k = 0; k < SUBSTEPS; k += 1) {
                  rk4Step(s, DT);
              }
              var p = bobTwo(s, PIVOT_X, PIVOT_Y);
              preview.push({ x: p.x, y: p.y });
          }
      }
      function easeInOut(u) {
          var v = clamp(u, 0, 1);
          return v * v * (3 - 2 * v);
      }
      function setPose(t1, t2) {
          sim[0] = t1;
          sim[1] = t2;
          sim[2] = 0;
          sim[3] = 0;
          trail = [];
      }
      function releaseArm() {
          held = false;
          grab = 0;
          if (reduce) {
              makePreview();
              setStatus('放したあと先端が通る道を描いた');
          }
          else {
              setStatus('放した: この角度から出発');
          }
      }
      function stepDemo() {
          var cyc = Math.floor(elapsed / DEMO_CYCLE_MS);
          var local = elapsed - cyc * DEMO_CYCLE_MS;
          if (cyc !== demoCycle) {
              demoCycle = cyc;
              demoFrom = [sim[0], sim[1]];
              demoDragging = false;
          }
          var pose = DEMO_POSES[cyc % DEMO_POSES.length];
          if (local >= DEMO_DRAG_START_MS && local < DEMO_DRAG_END_MS) {
              if (!demoDragging) {
                  demoDragging = true;
                  held = true;
                  demoFrom = [sim[0], sim[1]];
                  setStatus('ドラッグして角度を決めています');
              }
              var mid = DEMO_DRAG_START_MS + (DEMO_DRAG_END_MS - DEMO_DRAG_START_MS) * 0.5;
              var u1 = easeInOut((local - DEMO_DRAG_START_MS) / (mid - DEMO_DRAG_START_MS));
              var u2 = easeInOut((local - mid) / (DEMO_DRAG_END_MS - mid));
              setPose(demoFrom[0] + (pose[0] - demoFrom[0]) * u1, demoFrom[1] + (pose[1] - demoFrom[1]) * u2);
              ringArm = local < mid ? 1 : 2;
              var target = local < mid ? bobOne(sim, PIVOT_X, PIVOT_Y) : bobTwo(sim, PIVOT_X, PIVOT_Y);
              cursor = { x: target.x + 5, y: target.y + 5 };
          }
          else if (demoDragging && local >= DEMO_DRAG_END_MS) {
              demoDragging = false;
              held = false;
              setStatus('放した: この角度から出発');
          }
      }
      function stepFrame() {
          if (demo) {
              stepDemo();
          }
          if (held) {
              return;
          }
          for (var i = 0; i < SUBSTEPS; i += 1) {
              rk4Step(sim, DT);
          }
          var p = bobTwo(sim, PIVOT_X, PIVOT_Y);
          pushTrail(trail, p.x, p.y, TRAIL_LEN);
      }
      function dragTo(x, y) {
          if (grab === 1) {
              sim[0] = Math.atan2(x - PIVOT_X, y - PIVOT_Y);
          }
          else if (grab === 2) {
              var a = bobOne(sim, PIVOT_X, PIVOT_Y);
              sim[1] = Math.atan2(x - a.x, y - a.y);
          }
          sim[2] = 0;
          sim[3] = 0;
          trail = [];
          if (reduce) {
              makePreview();
          }
      }
      listen(canvas, 'pointerdown', function (e) {
          var pt = canvasPoint(e);
          var a = bobOne(sim, PIVOT_X, PIVOT_Y), b = bobTwo(sim, PIVOT_X, PIVOT_Y);
          var da = Math.hypot(pt.x - a.x, pt.y - a.y), db = Math.hypot(pt.x - b.x, pt.y - b.y);
          if (Math.min(da, db) > GRAB_RADIUS * 1.6) {
              return;
          }
          stopDemo();
          grab = db <= da ? 2 : 1;
          ringArm = grab;
          held = true;
          canvas.setPointerCapture(e.pointerId);
          setStatus('ドラッグして角度を決めています');
          dragTo(pt.x, pt.y);
          draw();
      });
      listen(canvas, 'pointermove', function (e) {
          if (grab === 0) {
              return;
          }
          var pt = canvasPoint(e);
          dragTo(pt.x, pt.y);
          draw();
      });
      listen(canvas, 'pointerup', function () {
          if (grab === 0) {
              return;
          }
          releaseArm();
          draw();
      });
      listen(canvas, 'keydown', function (e) {
          var k = e.key;
          var moved = false;
          if (k === 'ArrowLeft') {
              sim[0] -= KEY_ANGLE_STEP;
              moved = true;
              ringArm = 1;
          }
          if (k === 'ArrowRight') {
              sim[0] += KEY_ANGLE_STEP;
              moved = true;
              ringArm = 1;
          }
          if (k === 'ArrowUp') {
              sim[1] += KEY_ANGLE_STEP;
              moved = true;
              ringArm = 2;
          }
          if (k === 'ArrowDown') {
              sim[1] -= KEY_ANGLE_STEP;
              moved = true;
              ringArm = 2;
          }
          if (moved) {
              e.preventDefault();
              stopDemo();
              held = true;
              sim[2] = 0;
              sim[3] = 0;
              trail = [];
              if (reduce) {
                  makePreview();
              }
              setStatus('矢印キーで角度を調整、スペースで放す');
              draw();
          }
          else if (k === 'Enter' || k === ' ') {
              e.preventDefault();
              stopDemo();
              if (held) {
                  releaseArm();
              }
              else {
                  held = true;
                  sim[2] = 0;
                  sim[3] = 0;
                  setStatus('矢印キーで角度を調整、スペースで放す');
              }
              draw();
          }
      });
      onButton = function () {
          stopDemo();
          setPose(START_T1, START_T2);
          held = true;
          releaseArm();
          if (reduce) {
              held = true;
          }
          draw();
      };
      if (reduce) {
          makePreview();
          setStatus('ドラッグして角度を決めています');
      }
      function arc(cx, cy, r, from, to, rgb) {
          ctx.beginPath();
          ctx.arc(cx, cy, r, from, to, to < from);
          ctx.strokeStyle = 'rgba(' + rgb + ',0.85)';
          ctx.lineWidth = 2;
          ctx.stroke();
      }
      function draw() {
          var a = bobOne(sim, PIVOT_X, PIVOT_Y), b = bobTwo(sim, PIVOT_X, PIVOT_Y);
          beginDraw(held ? '#4d4672' : '#463e68', '#28223f', b.x, b.y);
          glow(b.x, b.y, 90, '255,238,252', held ? 0.34 : 0.22);
          ctx.strokeStyle = 'rgba(255,255,255,0.12)';
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 5]);
          ctx.beginPath();
          ctx.arc(PIVOT_X, PIVOT_Y, UNIT * (L1 + L2), 0, 6.2832);
          ctx.stroke();
          ctx.setLineDash([]);
          if (reduce && preview.length > 0) {
              for (var i = 0; i < preview.length; i += 3) {
                  disc(preview[i].x, preview[i].y, 1.6, 'rgba(255,179,199,0.8)');
              }
          }
          drawTrail(trail, '255,179,199', 3.5, 0.8);
          ctx.setLineDash(held ? [4, 3] : []);
          drawArms(sim, PIVOT_X, PIVOT_Y, '#c9b8ff', '#9fd8ff', 4.5);
          ctx.setLineDash([]);
          if (held) {
              arc(PIVOT_X, PIVOT_Y, 20, Math.PI / 2, Math.PI / 2 - sim[0], '255,241,201');
              arc(a.x, a.y, 16, Math.PI / 2, Math.PI / 2 - sim[1], '159,216,255');
              seg(PIVOT_X, PIVOT_Y, PIVOT_X, PIVOT_Y + 28, 1, 'rgba(255,255,255,0.4)');
              seg(a.x, a.y, a.x, a.y + 24, 1, 'rgba(255,255,255,0.4)');
          }
          disc(PIVOT_X, PIVOT_Y, 5, '#fff1c9');
          glow(a.x, a.y, 20, '201,184,255', 0.5);
          disc(a.x, a.y, 8, '#c9b8ff');
          glow(b.x, b.y, 24, '255,179,199', 0.6);
          disc(b.x, b.y, 10, '#ffb3c7');
          if (held) {
              ctx.beginPath();
              ctx.arc(ringArm === 1 ? a.x : b.x, ringArm === 1 ? a.y : b.y, 15, 0, 6.2832);
              ctx.strokeStyle = 'rgba(255,255,255,0.85)';
              ctx.lineWidth = 1.5;
              ctx.stroke();
          }
          if (demoDragging) {
              ctx.beginPath();
              ctx.moveTo(cursor.x, cursor.y);
              ctx.lineTo(cursor.x + 9, cursor.y + 4);
              ctx.lineTo(cursor.x + 4, cursor.y + 9);
              ctx.closePath();
              ctx.fillStyle = '#ffffff';
              ctx.fill();
          }
      }
      function fit() {
          var r = wrap.getBoundingClientRect();
          cw = Math.max(1, Math.round(r.width));
          ch = Math.max(1, Math.round(r.height));
          canvas.width = cw;
          canvas.height = ch;
          sc = cw / CALC_W;
          draw();
      }
      var lastTs = null;
      var accMs = 0;
      function tick(ts) {
          if (lastTs === null) {
              lastTs = ts;
          }
          var frameDt = Math.min(ts - lastTs, 48);
          lastTs = ts;
          if (!paused) {
              accMs += frameDt;
              while (accMs >= FIXED_DT) {
                  elapsed += FIXED_DT;
                  stepFrame();
                  accMs -= FIXED_DT;
              }
          }
          draw();
          rafId = requestAnimationFrame(tick);
      }
      for (var w0 = 0; w0 < PREROLL_FRAMES; w0 += 1) {
          elapsed += FIXED_DT;
          stepFrame();
      }
      fit();
      listen(window, 'resize', fit);
      listen(btnEl, 'click', function () { onButton(); });
      if (!ownInput) {
          listen(canvas, 'pointerdown', function () { onButton(); });
          listen(canvas, 'keydown', function (e) {
              var k = e.key;
              if (k === 'Enter' || k === ' ') {
                  e.preventDefault();
                  onButton();
              }
          });
      }
      if (reduce) {
          if (!ownInput) {
              btnEl.textContent = '次の場面';
              setStatus('一場面ずつ送っています');
          }
      }
      else {
          rafId = requestAnimationFrame(tick);
      }
      function destroy() {
          cancelAnimationFrame(rafId);
          for (var i = 0; i < cleaners.length; i += 1) {
              cleaners[i]();
          }
      }
      return destroy;
  }
  main(root, canvas, statusEl, btnEl);
})();
</script>
</body>
</html>
