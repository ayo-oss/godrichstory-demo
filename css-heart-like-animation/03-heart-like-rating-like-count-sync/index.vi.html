<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Like count sync — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <label class="like is-demo">
    <input type="checkbox" class="like__input">
    <span class="like__heart" aria-hidden="true"></span>
    <span class="like__spark like__spark--heart"></span>
    <span class="like__spark like__spark--star"></span>
    <span class="like__spark like__spark--heart"></span>
    <span class="like__spark like__spark--star"></span>
    <span class="like__spark like__spark--heart"></span>
    <span class="like__count"><span class="like__num" aria-live="polite">12</span></span>
  </label>
</main>
<script>
// 체크 상태가 바뀔 때마다 숫자를 1 더하거나 빼고 scale 팝을 다시 튄다.
// 한 겹: 숫자가 오를 때 질량-감쇠 물리 스파크 버스트 — 미니 Trái tim·별이 Trái tim 위에서 흩어진다.
// 각 파티클은 초기 속도(방향·크기 랜덤)와 개별 질량을 갖고, 매 프레임 준암시 오일러 적분으로
// 감쇠(-k/m·v — 질량이 클수록 덜 감속)와 중력(질량 무관)을 받아 흩어졌다 멈춘다 (keyframes 아님).
(function () {
  var w = document.querySelector(".like");
  if (!w) return;
  var inp = w.querySelector(".like__input"), num = w.querySelector(".like__num");
  var sparks = [].slice.call(w.querySelectorAll(".like__spark"));
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var alive = false, raf = 0, last = 0;

  function fire() {
    if (reduce || !sparks.length) return;
    var now = performance.now();
    for (var i = 0; i < sparks.length; i++) {
      var m = .6 + Math.random() * .9;                          // 개별 질량 0.6~1.5
      var ang = -Math.PI / 2 + (Math.random() - .5) * 2.4;      // 위쪽 부채꼴 ±69°
      var v0 = (100 + Math.random() * 90) * (1.15 - m * .2);    // 무거울수록 느게 출발
      sparks[i]._p = { x: 0, y: 0, vx: Math.cos(ang) * v0, vy: Math.sin(ang) * v0,
        m: m, k: 3.6, g: 320, rot: (Math.random() - .5) * 40, spin: (Math.random() - .5) * 480,
        s: .4 + m * .3, born: now + i * 26, life: 780 + Math.random() * 420 };
    }
    if (!alive) { alive = true; last = now; raf = requestAnimationFrame(step); }
  }

  function step(t) {
    var dt = Math.min((t - last) / 1000, .05); last = t;        // 탭 복귀 시 폭주 방지 클램프
    var any = false;
    for (var i = 0; i < sparks.length; i++) {
      var el = sparks[i], p = el._p; if (!p) continue;
      var age = t - p.born;
      if (age < 0) { any = true; continue; }                     // 방출 전 지연(순차 분사)
      if (age >= p.life) { el.style.opacity = '0'; el._p = null; continue; } // 수명 끝 → 정지
      p.vx += (-p.k / p.m * p.vx) * dt;                          // 감쇠 가속도 = -k/m·v
      p.vy += (p.g - p.k / p.m * p.vy) * dt;                     // 중력 가속도 = g (질량 무관)
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
      var o = age / p.life;                                      // 수명 후반 45%에서 페이드아웃
      el.style.opacity = o < .55 ? '1' : (1 - (o - .55) / .45).toFixed(3);
      el.style.transform = 'translate(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px) rotate(' + p.rot.toFixed(1) + 'deg) scale(' + p.s.toFixed(3) + ')';
      any = true;
    }
    if (any) raf = requestAnimationFrame(step); else alive = false; // 전부 정지하면 루프 종료
  }

  function sync() {
    num.textContent = inp.checked ? "13" : "12";
    num.classList.remove("is-pop"); void num.offsetWidth; num.classList.add("is-pop");
    if (inp.checked) fire();                                    // 숫자가 오를 때만 발사
  }
  inp.addEventListener("change", function () { w.classList.remove("is-demo"); sync(); });
  setInterval(function () { if (!w.classList.contains("is-demo")) return; inp.checked = !inp.checked; sync(); }, 1400);
})();
</script>
</body>
</html>
