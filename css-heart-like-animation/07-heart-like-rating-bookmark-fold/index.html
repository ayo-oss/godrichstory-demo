<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmark fold — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <label class="bookmark is-demo">
    <input type="checkbox" class="bookmark__input">
    <span class="bookmark__icon" aria-hidden="true">
      <span class="bookmark__ribbon"></span>
      <span class="bookmark__fold"></span>
      <span class="bookmark__fx" aria-hidden="true">
        <span class="bookmark__chip"></span>
        <span class="bookmark__chip"></span>
        <span class="bookmark__chip"></span>
        <span class="bookmark__chip"></span>
        <span class="bookmark__chip"></span>
        <span class="bookmark__chip"></span>
      </span>
    </span>
    <span class="bookmark__label">저장</span>
  </label>
</main>
<script>
// 한 겹: 종이 조각(confetti) 물리 파티클 — 저장 체크 순간 접힌 귀(오른쪽 위 모서리)에서
// 다이아몬드 종잇조각이 흩어진다. 각 조각은 질량·감쇠(-k/m·v)·중력을 매 프레임 준암시 오일러
// 적분으로 받아 날아갔다 멈춘다. transform 은 JS 가 계산해 기입한다(키이프레임 아님).
(function () {
  var ps = [].slice.call(document.querySelectorAll('.bookmark__chip'));
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var alive = false, raf = 0, last = 0;

  function fire() {
    if (reduce || !ps.length) return;
    var now = performance.now();
    for (var i = 0; i < ps.length; i++) {
      var m = .7 + Math.random() * .9;                          // 개별 질량 0.7~1.6
      var ang = -Math.PI / 4 + (Math.random() - .5) * 2.8;      // 바깥쪽(위·오른쪽) 부채꼴 ±80°
      var v0 = (110 + Math.random() * 80) * (1.15 - m * .2);    // 무거울수록 느게 출발
      ps[i]._p = { x: 0, y: 0, vx: Math.cos(ang) * v0, vy: Math.sin(ang) * v0,
        m: m, k: 3.2, g: 320, rot: (Math.random() - .5) * 40, spin: (Math.random() - .5) * 960,
        s: .4 + m * .3, born: now + i * 20, life: 700 + Math.random() * 300 };
    }
    if (!alive) { alive = true; last = now; raf = requestAnimationFrame(step); }
  }

  function step(t) {
    var dt = Math.min((t - last) / 1000, .05); last = t;        // 탭 복귀 시 폭주 방지 클램프
    var any = false;
    for (var i = 0; i < ps.length; i++) {
      var el = ps[i], p = el._p; if (!p) continue;
      var age = t - p.born;
      if (age < 0) { any = true; continue; }                     // 방출 전 지연(순차 분사)
      if (age >= p.life) { el.style.opacity = '0'; el._p = null; continue; } // 수명 끝 → 그 자리에 정지
      p.vx += (-p.k / p.m * p.vx) * dt;                          // 감쇠 가속도 = -k/m·v
      p.vy += (p.g - p.k / p.m * p.vy) * dt;                     // 중력 가속도 = g (질량 무관)
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
      var o = age / p.life;                                      // 수명 후반 45%에서 페이드아웃
      el.style.opacity = o < .55 ? '1' : (1 - (o - .55) / .45).toFixed(3);
      el.style.transform = 'translate(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px) rotate(' + p.rot.toFixed(1) + 'deg) scale(' + p.s.toFixed(3) + ')';
      any = true;
    }
    if (any) raf = requestAnimationFrame(step); else alive = false; // 전부 정지하면 루프 종료
  }

  // 트리거 1: 실제 클릭 — 체크되는 순간(저장 순간) 발사
  document.querySelectorAll('.bookmark').forEach(function (b) {
    var inp = b.querySelector('.bookmark__input');
    if (inp) inp.addEventListener('change', function () { b.classList.remove('is-demo'); if (inp.checked) fire(); });
    if (inp) inp.addEventListener('pointerdown', function () { b.classList.remove('is-demo'); });
  });
  // 트리거 2: 데모 루프 — 귀 접힘(2s 루프의 40% ≈ 800ms)에 맞춰 발사
  function demoShot() {
    document.querySelectorAll('.bookmark').forEach(function (b) {
      if (b.classList.contains('is-demo')) setTimeout(fire, 800);
    });
  }
  setInterval(demoShot, 2000);
  demoShot();
})();
</script>
</body>
</html>
