<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emoji reaction — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <fieldset class="react is-demo">
    <legend class="react__legend">リアクションを選ぶ</legend>
    <div class="react__row">
      <input type="radio" name="react" id="e1" class="react__input" style="--i:0"><label for="e1" class="react__emoji" style="--i:0" aria-label="ハート">❤️<span class="react__fx" aria-hidden="true"><span class="react__spark"></span><span class="react__spark"></span><span class="react__spark"></span><span class="react__spark"></span><span class="react__spark"></span></span></label>
      <input type="radio" name="react" id="e2" class="react__input" style="--i:1"><label for="e2" class="react__emoji" style="--i:1" aria-label="笑い">😂<span class="react__fx" aria-hidden="true"><span class="react__spark"></span><span class="react__spark"></span><span class="react__spark"></span><span class="react__spark"></span><span class="react__spark"></span></span></label>
      <input type="radio" name="react" id="e3" class="react__input" style="--i:2"><label for="e3" class="react__emoji" style="--i:2" aria-label="いいね">👍<span class="react__fx" aria-hidden="true"><span class="react__spark"></span><span class="react__spark"></span><span class="react__spark"></span><span class="react__spark"></span><span class="react__spark"></span></span></label>
      <input type="radio" name="react" id="e4" class="react__input" style="--i:3"><label for="e4" class="react__emoji" style="--i:3" aria-label="驚き">😮<span class="react__fx" aria-hidden="true"><span class="react__spark"></span><span class="react__spark"></span><span class="react__spark"></span><span class="react__spark"></span><span class="react__spark"></span></span></label>
    </div>
  </fieldset>
</main>
<script>
// 한 겹: 미니 ハート 물리 파티클 — 이모지를 고르는 순간 그 이모지 라벨에서 하트가 흩어진다.
// 각 하트는 질량·감쇠(-k/m·v)·중력을 매 프레임 준암시 오일러 적분으로 받아 퍼졌다 멈춘다.
// transform 은 JS 가 계산해 기입한다(키이프레임 아님).
(function () {
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var alive = false, raf = 0, last = 0;

  function fire(fx) {
    if (reduce || !fx) return;
    var ps = [].slice.call(fx.querySelectorAll('.react__spark'));
    if (!ps.length) return;
    var now = performance.now();
    for (var i = 0; i < ps.length; i++) {
      var m = .6 + Math.random() * .8;                          // 개별 질량 0.6~1.4
      var ang = -Math.PI / 2 + (Math.random() - .5) * 3.2;      // 위쪽 부채꼴 ±92°
      var v0 = (110 + Math.random() * 70) * (1.15 - m * .2);    // 무거울수록 느게 출발
      ps[i]._p = { x: 0, y: 0, vx: Math.cos(ang) * v0, vy: Math.sin(ang) * v0,
        m: m, k: 3.5, g: 300, rot: (Math.random() - .5) * 40, spin: (Math.random() - .5) * 800,
        s: .4 + m * .3, born: now + i * 22, life: 650 + Math.random() * 350 };
    }
    if (!alive) { alive = true; last = now; raf = requestAnimationFrame(step); }
  }

  function step(t) {
    var dt = Math.min((t - last) / 1000, .05); last = t;        // 탭 복귀 시 폭주 방지 클램프
    var any = false;
    var all = document.querySelectorAll('.react__spark');
    for (var i = 0; i < all.length; i++) {
      var el = all[i], p = el._p; if (!p) continue;
      var age = t - p.born;
      if (age < 0) { any = true; continue; }                     // 방출 전 지연(순차 분사)
      if (age >= p.life) { el.style.opacity = '0'; el._p = null; continue; } // 수명 끝 → 그 자리에 정지
      p.vx += (-p.k / p.m * p.vx) * dt;                          // 감쇠 가속도 = -k/m·v
      p.vy += (p.g - p.k / p.m * p.vy) * dt;                     // 중력 가속도 = g (질량 무관)
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
      var o = age / p.life;                                      // 수명 후반 45%에서 페이드아웃
      el.style.opacity = o < .55 ? '1' : (1 - (o - .55) / .45).toFixed(3);
      el.style.transform = 'translate(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px) rotate(' + p.rot.toFixed(1) + 'deg) scale(' + p.s.toFixed(3) + ')';
      any = true;
    }
    if (any) raf = requestAnimationFrame(step); else alive = false; // 전부 정지하면 루프 종료
  }

  // 트리거 1: 실제 클릭 — 고른 라벨의 그룹만 발사
  document.querySelectorAll('.react').forEach(function (r) {
    r.querySelectorAll('.react__input').forEach(function (inp) {
      inp.addEventListener('change', function () {
        r.classList.remove('is-demo');
        var lb = document.querySelector('label[for="' + inp.id + '"]');
        if (lb && inp.checked) fire(lb.querySelector('.react__fx'));
      });
      inp.addEventListener('pointerdown', function () { r.classList.remove('is-demo'); });
    });
  });
  // 트리거 2: 데모 루프 — 이모지 i 가 자기 사이클(2s, delay i*.4s)의 12.5%(≈250ms)에 튄다
  function demoShot() {
    document.querySelectorAll('.react').forEach(function (r) {
      if (!r.classList.contains('is-demo')) return;
      var lbs = r.querySelectorAll('.react__emoji');
      for (var i = 0; i < lbs.length; i++) {
        (function (lb) { setTimeout(function () { fire(lb.querySelector('.react__fx')); }, 250 + 400 * i); })(lbs[i]);
      }
    });
  }
  setInterval(demoShot, 2000);
  demoShot();
})();
</script>
</body>
</html>
