<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heart pop — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <label class="heart is-demo">
    <input type="checkbox" class="heart__input">
    <span class="heart__icon" aria-hidden="true">
      <span class="heart__shape heart__shape--outline"></span>
      <span class="heart__shape heart__shape--fill"></span>
      <span class="heart__particle heart__particle--heart"></span>
      <span class="heart__particle heart__particle--heart"></span>
      <span class="heart__particle heart__particle--star"></span>
      <span class="heart__particle heart__particle--heart"></span>
      <span class="heart__particle heart__particle--star"></span>
      <span class="heart__particle heart__particle--heart"></span>
      <span class="heart__particle heart__particle--star"></span>
    </span>
    <span class="heart__label">좋아요</span>
  </label>
</main>
<script>
// 한 겹: 질량-감쇠 물리 파티클 버스트 — 하트가 채워질 때 미니 하트·별이 흩어진다.
// 각 파티클은 초기 속도(방향·크기 랜덤)와 개별 질량을 갖고, 매 프레임 준암시 오일러 적분으로
// 감쇠(-k/m·v — 질량이 클수록 덜 감속해 더 멀리 간다)와 중력(질량 무관)을 받아 흩어졌다 멈춘다.
// CSS keyframes 하드코딩이 아니라 requestAnimationFrame 안에서 좌표를 계산해 transform 에 쓴다.
(function () {
  var icon = document.querySelector('.heart__icon'); if (!icon) return;
  var ps = [].slice.call(icon.querySelectorAll('.heart__particle'));
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var alive = false, raf = 0, last = 0;

  function fire() {
    if (reduce || !ps.length) return;
    var now = performance.now();
    for (var i = 0; i < ps.length; i++) {
      var m = .6 + Math.random() * .9;                          // 개별 질량 0.6~1.5
      var ang = -Math.PI / 2 + (Math.random() - .5) * 2.5;      // 위쪽 부채꼴 ±72°
      var v0 = (110 + Math.random() * 100) * (1.15 - m * .2);   // 무거울수록 살짝 느게 출발
      ps[i]._p = { x: 0, y: 0, vx: Math.cos(ang) * v0, vy: Math.sin(ang) * v0,
        m: m, k: 3.4, g: 300, rot: (Math.random() - .5) * 40, spin: (Math.random() - .5) * 540,
        s: .4 + m * .3, born: now + i * 22, life: 800 + Math.random() * 450 };
    }
    if (!alive) { alive = true; last = now; raf = requestAnimationFrame(step); }
  }

  function step(t) {
    var dt = Math.min((t - last) / 1000, .05); last = t;        // 탭 복귀 시 폭주 방지 클램프
    var any = false;
    for (var i = 0; i < ps.length; i++) {
      var el = ps[i], p = el._p; if (!p) continue;
      var age = t - p.born;
      if (age < 0) { any = true; continue; }                     // 방출 전 지연(순차 분사)
      if (age >= p.life) { el.style.opacity = '0'; el._p = null; continue; } // 수명 끝 → 그 자리에 정지
      p.vx += (-p.k / p.m * p.vx) * dt;                          // 감쇠 가속도 = -k/m·v
      p.vy += (p.g - p.k / p.m * p.vy) * dt;                     // 중력 가속도 = g (질량 무관)
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
      var o = age / p.life;                                      // 수명 후반 45%에서 페이드아웃
      el.style.opacity = o < .55 ? '1' : (1 - (o - .55) / .45).toFixed(3);
      el.style.transform = 'translate(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px) rotate(' + p.rot.toFixed(1) + 'deg) scale(' + p.s.toFixed(3) + ')';
      any = true;
    }
    if (any) raf = requestAnimationFrame(step); else alive = false; // 전부 정지하면 루프 종료
  }

  // 트리거 1: 실제 클릭 — 체크되는 순간 발사
  var w = document.querySelector('.heart'), inp = w && w.querySelector('.heart__input');
  if (inp) {
    inp.addEventListener('change', function () { w.classList.remove('is-demo'); if (inp.checked) fire(); });
    inp.addEventListener('pointerdown', function () { w.classList.remove('is-demo'); });
  }
  // 트리거 2: 데모 루프 — CSS 하트 팝(2s 루프의 35% ≈ 660ms)에 맞춰 발사
  function demoShot() { if (w && w.classList.contains('is-demo')) setTimeout(fire, 660); }
  setInterval(demoShot, 2000);
  demoShot();
})();
</script>
</body>
</html>
