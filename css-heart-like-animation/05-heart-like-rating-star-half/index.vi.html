<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Half-star gradient display — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="avg" style="--rating:3.5" role="img" aria-label="3.5 trên 5 sao">
    <span class="avg__stars" aria-hidden="true">
      <span class="avg__base">★★★★★</span>
      <span class="avg__fill"><span class="avg__fill-text">★★★★★</span></span>
      <span class="avg__fx" aria-hidden="true"><span class="avg__spark"></span><span class="avg__spark"></span><span class="avg__spark"></span><span class="avg__spark"></span><span class="avg__spark"></span><span class="avg__spark"></span></span>
    </span>
    <span class="avg__num">3.5</span>
  </div>
</main>
<script>
// 한 겹: 채움 앞가장자리(--pct)에서 질량-감쇠 물리 스파크 버스트 — 미니 별이 차오르는 지점에서 흩어진다.
// 각 파티클은 초기 속도(넓은 위쪽 부채꼴·크기 랜덤)와 개별 질량을 갖고, 매 프레임 준암시 오일러 적분으로
// 감쇠(-k/m·v — 질량이 클수록 덜 감속)와 중력(질량 무관)을 받아 흩어졌다 멈춘다 (keyframes 아님).
(function () {
  var stars = document.querySelector(".avg__stars");
  if (!stars) return;
  var sparks = [].slice.call(stars.querySelectorAll(".avg__spark"));
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var alive = false, raf = 0, last = 0;

  function fire() {
    if (reduce || !sparks.length) return;
    var now = performance.now();
    for (var i = 0; i < sparks.length; i++) {
      var m = .7 + Math.random() * .8;                           // 개별 질량 0.7~1.5
      var ang = -Math.PI / 2 + (Math.random() - .5) * 3.4;       // 넓은 위쪽 부채꼴 ±97°
      var v0 = (130 + Math.random() * 80) * (1.15 - m * .2);     // 무거울수록 느게 출발
      sparks[i]._p = { x: 0, y: 0, vx: Math.cos(ang) * v0, vy: Math.sin(ang) * v0,
        m: m, k: 3.4, g: 280, rot: (Math.random() - .5) * 40, spin: (Math.random() - .5) * 920,
        s: .4 + m * .3, born: now + i * 26, life: 700 + Math.random() * 400 };
    }
    if (!alive) { alive = true; last = now; raf = requestAnimationFrame(step); }
  }

  function step(t) {
    var dt = Math.min((t - last) / 1000, .05); last = t;         // 탭 복귀 시 폭주 방지 클램프
    var any = false;
    for (var i = 0; i < sparks.length; i++) {
      var el = sparks[i], p = el._p; if (!p) continue;
      var age = t - p.born;
      if (age < 0) { any = true; continue; }                      // 방출 전 지연(순차 분사)
      if (age >= p.life) { el.style.opacity = '0'; el._p = null; continue; } // 수명 끝 → 정지
      p.vx += (-p.k / p.m * p.vx) * dt;                           // 감쇠 가속도 = -k/m·v
      p.vy += (p.g - p.k / p.m * p.vy) * dt;                      // 중력 가속도 = g (질량 무관)
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
      var o = age / p.life;                                       // 수명 후반 45%에서 페이드아웃
      el.style.opacity = o < .55 ? '1' : (1 - (o - .55) / .45).toFixed(3);
      el.style.transform = 'translate(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px) rotate(' + p.rot.toFixed(1) + 'deg) scale(' + p.s.toFixed(3) + ')';
      any = true;
    }
    if (any) raf = requestAnimationFrame(step); else alive = false; // 전부 정지하면 루프 종료
  }

  // 데모 루프: reveal-fill 이 2s 루프의 55%(=1100ms)에 --pct 에 도달 — 채움 앞가장자리가 다 차는 순간 발사
  function cycle() { setTimeout(fire, 1100); }
  setInterval(cycle, 2000);
  cycle();                                                       // 첫 사이클(t=0)부터 녹화 창 안에 잡힌다
})();
</script>
</body>
</html>
