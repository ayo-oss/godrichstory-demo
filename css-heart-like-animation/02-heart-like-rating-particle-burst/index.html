<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle burst — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <label class="burst is-demo">
    <input type="checkbox" class="burst__input">
    <span class="burst__icon" aria-hidden="true">
      <span class="burst__heart"></span>
      <span class="burst__dot" style="--i:0"></span>
      <span class="burst__dot" style="--i:1"></span>
      <span class="burst__dot" style="--i:2"></span>
      <span class="burst__dot" style="--i:3"></span>
      <span class="burst__dot" style="--i:4"></span>
      <span class="burst__dot" style="--i:5"></span>
      <span class="burst__dot" style="--i:6"></span>
      <span class="burst__dot" style="--i:7"></span>
    </span>
    <span class="burst__label">좋아요</span>
  </label>
</main>
<script>
// 질량-감쇠 물리 버스트 — 기존 45° 고정 링 keyframes 를 JS 적분으로 바꿔치기했다 (레이아웃·색 불변).
// 각 파티클은 초기 속도(방향·크기 랜덤)와 개별 질량 m(0.7~1.6)을 갖고 매 프레임 준암시 오일러 적분으로
// 감쇠(-k/m·v — 무거울수록 덜 감속해 관성으로 더 멀리 간다)와 중력 g(질량 무관)을 받아 흩어졌다 멈춘다.
// 좌표는 requestAnimationFrame 안에서 계산해 transform 에 쓴다 — 타이밍·거리를 keyframes 에 박지 않는다.
(function () {
  var icon = document.querySelector('.burst__icon'); if (!icon) return;
  var dots = [].slice.call(icon.querySelectorAll('.burst__dot'));
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var alive = false, raf = 0, last = 0;

  function fire() {
    if (reduce || !dots.length) return;
    var now = performance.now();
    for (var i = 0; i < dots.length; i++) {
      var m = .7 + Math.random() * .9;                          // 개별 질량 0.7~1.6
      var ang = (i / dots.length) * Math.PI * 2 + (Math.random() - .5) * .55; // 45° 뼈대 + 지터
      var v0 = (150 + Math.random() * 130) * m;                 // 무거울수록 세게 — 질량이 관성
      dots[i]._p = { x: 0, y: 0, vx: Math.cos(ang) * v0, vy: Math.sin(ang) * v0,
        m: m, k: 4.2, g: 260, s: .35 + m * .45,
        born: now + i * 20, life: 620 + Math.random() * 380 };  // 순차 분사(20ms) + 수명 랜덤
    }
    if (!alive) { alive = true; last = now; raf = requestAnimationFrame(step); }
  }

  function step(t) {
    var dt = Math.min((t - last) / 1000, .05); last = t;        // 탭 복귀 시 폭주 방지 클램프
    var any = false;
    for (var i = 0; i < dots.length; i++) {
      var el = dots[i], p = el._p; if (!p) continue;
      var age = t - p.born;
      if (age < 0) { any = true; continue; }                     // 방출 전 지연
      if (age >= p.life) { el.style.opacity = '0'; el._p = null; continue; } // 수명 끝 → 그 자리에 정지
      p.vx += (-p.k / p.m * p.vx) * dt;                          // 감쇠 가속도 = -k/m·v
      p.vy += (p.g - p.k / p.m * p.vy) * dt;                     // 중력 가속도 = g
      p.x += p.vx * dt; p.y += p.vy * dt;
      var o = age / p.life;                                      // 수명 후반 40%에서 페이드아웃
      el.style.opacity = o < .6 ? '1' : (1 - (o - .6) / .4).toFixed(3);
      el.style.transform = 'translate(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px) scale(' + p.s.toFixed(3) + ')';
      any = true;
    }
    if (any) raf = requestAnimationFrame(step); else alive = false; // 전부 정지하면 루프 종료
  }

  // 트리거 1: 실제 클릭 — 체크되는 순간 발사
  var w = document.querySelector('.burst'), inp = w && w.querySelector('.burst__input');
  if (inp) {
    inp.addEventListener('change', function () { w.classList.remove('is-demo'); if (inp.checked) fire(); });
    inp.addEventListener('pointerdown', function () { w.classList.remove('is-demo'); });
  }
  // 트리거 2: 데모 루프 — CSS 하트 루프(2s 의 35% ≈ 660ms)에 맞춰 발사
  function demoShot() { if (w && w.classList.contains('is-demo')) setTimeout(fire, 660); }
  setInterval(demoShot, 2000);
  demoShot();
})();
</script>
</body>
</html>
