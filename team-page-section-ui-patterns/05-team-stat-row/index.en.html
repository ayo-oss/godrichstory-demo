<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 스탯 카운트업 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="stat" id="stat">
  <p class="stat__hint" id="statHint">The numbers count up by calculating easing every frame with rAF, and when the duration changes, the same formula runs again at a different speed.</p>
  <div class="stat__row" id="statRow" role="list" aria-label="Team metrics">
    <div class="stat__cell" role="listitem"><span class="stat__num" id="stat-0" data-target="48">0</span><span class="stat__label">Members</span></div>
    <div class="stat__cell" role="listitem"><span class="stat__num" id="stat-1" data-target="126">0</span><span class="stat__label">Projects</span></div>
    <div class="stat__cell" role="listitem"><span class="stat__num" id="stat-2" data-target="9">0</span><span class="stat__label">Offices</span></div>
    <div class="stat__cell" role="listitem"><span class="stat__num" id="stat-3" data-target="97">0</span><span class="stat__label">Satisfaction%</span></div>
  </div>
  <p class="stat__meta"><span class="stat__chip" id="statChip">duration 1600ms</span></p>
</section>
</main>
<script>
// 팀 스탯 카운트업(05) — 목표값까지 매 rAF 프레임마다 진행률(t)에 easeOutCubic 을 적용해
// 그 순간의 표시값을 계산한다(계산 한 겹). duration 변형(1600ms↔800ms)은 같은 공식의
// 입력 하나만 바뀌는 것을 보여주려고 자동 시연에서 번갈아 돈다.
(function () {
  var row = document.getElementById('statRow');
  var chip = document.getElementById('statChip');
  if (!row || !chip) return;
  var nums = Array.prototype.slice.call(row.querySelectorAll('.stat__num'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var DEFAULT_MS = 1600;   // 기본 지속시간
  var DURATIONS = [1600, 800];
  var durIdx = 0;
  var raf = null;

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function runOnce(ms) {
    if (raf !== null) cancelAnimationFrame(raf);
    var start = performance.now();
    var targets = nums.map(function (el) { return parseInt(el.getAttribute('data-target'), 10) || 0; });
    function step(now) {
      var t = Math.min(1, (now - start) / ms);
      var eased = easeOutCubic(t);
      nums.forEach(function (el, i) {
        el.textContent = String(Math.round(targets[i] * eased));
      });
      if (t < 1) {
        raf = requestAnimationFrame(step);
      } else {
        raf = null;
      }
    }
    nums.forEach(function (el) { el.textContent = '0'; });
    raf = requestAnimationFrame(step);
  }

  function cycle() {
    var ms = DURATIONS[durIdx];
    chip.textContent = 'duration ' + ms + 'ms';
    runOnce(ms);
  }

  cycle();

  if (!reduce) {
    setInterval(function () {
      durIdx = (durIdx + 1) % DURATIONS.length;
      cycle();
    }, 1100);
  }
})();
</script>
</body>
</html>
