<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>역할 탭 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="tabs" id="tabsWrap">
  <p class="tabs__hint" id="tabsHint">필터 결과 인원수를 탭 라벨에 계산해 붙이고 밑줄은 선택된 탭의 실측 좌표를 따라갑니다</p>
  <div class="tabs__bar" id="tabsBar" role="tablist" aria-label="역할 필터">
    <button class="tabs__tab" id="tab-all" role="tab" aria-selected="true" type="button">전체 <span class="tabs__count" id="cnt-all">10</span></button>
    <button class="tabs__tab" id="tab-design" role="tab" aria-selected="false" type="button">디자인 <span class="tabs__count" id="cnt-design">4</span></button>
    <button class="tabs__tab" id="tab-dev" role="tab" aria-selected="false" type="button">개발 <span class="tabs__count" id="cnt-dev">4</span></button>
    <button class="tabs__tab" id="tab-ops" role="tab" aria-selected="false" type="button">운영 <span class="tabs__count" id="cnt-ops">2</span></button>
    <span class="tabs__indicator" id="tabsIndicator" aria-hidden="true"></span>
  </div>
  <div class="tabs__panel" id="tabsPanel" role="list" aria-label="필터 결과"></div>
</section>
</main>
<script>
// 역할 탭(03) — 팀원 배열을 role 값으로 filter 해 탭 라벨의 인원수를 계산하고, 선택된 탭의
// getBoundingClientRect 로 좌표·너비를 읽어 밑줄 인디케이터의 translateX·width 를 맞춘다(계산 한 겹).
(function () {
  var wrap = document.getElementById('tabsWrap');
  var bar = document.getElementById('tabsBar');
  var indicator = document.getElementById('tabsIndicator');
  var panel = document.getElementById('tabsPanel');
  if (!wrap || !bar || !indicator || !panel) return;
  var tabs = Array.prototype.slice.call(bar.querySelectorAll('.tabs__tab'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var ROLES = ['design', 'design', 'design', 'design', 'dev', 'dev', 'dev', 'dev', 'ops', 'ops'];
  var members = ROLES.map(function (role, i) { return { id: i, role: role }; });
  var KEYS = ['all', 'design', 'dev', 'ops'];

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var HEXES = ['#9fc9ec', '#93d9c0', '#b9a0ff', '#f6c6d3'];

  function drawAvatar(cv, seed, label) {
    var ctx = cv.getContext('2d');
    if (!ctx) return;
    var rnd = mulberry32(seed);
    var s = cv.width;
    ctx.save();
    ctx.beginPath(); ctx.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2); ctx.clip();
    var cell = 6;
    for (var y = 0; y < s; y += cell) {
      for (var x = 0; x < s; x += cell) {
        var v = rnd();
        ctx.fillStyle = v > .5 ? HEXES[Math.floor(rnd() * HEXES.length)] : 'rgba(23,20,26,.08)';
        ctx.fillRect(x, y, cell, cell);
      }
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(23,20,26,.55)';
    ctx.beginPath(); ctx.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff7e6';
    ctx.font = '700 ' + Math.round(s * .4) + 'px -apple-system, "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, s / 2, s / 2 + 1);
  }

  // 인원수 계산 — role 값으로 filter 한 배열의 길이를 각 탭 라벨에 붙인다
  KEYS.forEach(function (key) {
    var span = document.getElementById('cnt-' + key);
    if (!span) return;
    var n = key === 'all' ? members.length : members.filter(function (m) { return m.role === key; }).length;
    span.textContent = String(n);
  });

  function moveIndicator(tab) {
    var barRect = bar.getBoundingClientRect();
    var tabRect = tab.getBoundingClientRect();
    var ix = tabRect.left - barRect.left;
    var iw = tabRect.width;
    indicator.style.setProperty('--ix', ix.toFixed(1) + 'px');
    indicator.style.setProperty('--iw', iw.toFixed(1) + 'px');
  }

  function renderPanel(key) {
    var list = key === 'all' ? members : members.filter(function (m) { return m.role === key; });
    panel.innerHTML = '';
    list.slice(0, 6).forEach(function (m) {
      var chip = document.createElement('div');
      chip.className = 'tabs__chip';
      chip.setAttribute('role', 'listitem');
      var cv = document.createElement('canvas');
      cv.width = 22; cv.height = 22; cv.className = 'tabs__cv';
      cv.setAttribute('aria-hidden', 'true');
      chip.appendChild(cv);
      panel.appendChild(chip);
      drawAvatar(cv, 5 + m.id * 9, 'M' + (m.id + 1));
    });
    panel.classList.remove('is-in');
    void panel.offsetWidth;
    panel.classList.add('is-in');
  }

  function selectTab(key) {
    var target = document.getElementById('tab-' + key);
    if (!target) return;
    tabs.forEach(function (t) { t.setAttribute('aria-selected', t === target ? 'true' : 'false'); });
    moveIndicator(target);
    renderPanel(key);
  }

  tabs.forEach(function (t) {
    t.addEventListener('click', function () {
      var key = t.id.replace('tab-', '');
      idx = KEYS.indexOf(key);
      selectTab(key);
    });
  });

  var idx = 0;
  selectTab(KEYS[0]);
  window.addEventListener('resize', function () { selectTab(KEYS[idx]); });

  if (!reduce) {
    setInterval(function () {
      idx = (idx + 1) % KEYS.length;
      selectTab(KEYS[idx]);
    }, 340);
  }
})();
</script>
</body>
</html>
