<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로필 もっと見る — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="detail" id="detail">
  <p class="detail__hint" id="detailHint">紹介文の実際の行数を高さで測り、指定した行数より多い場合だけもっと見るボタンを表示します。</p>
  <div class="detail__card">
    <canvas class="detail__cv" width="40" height="40" aria-hidden="true"></canvas>
    <div class="detail__body">
      <p class="detail__bio" id="detailBio">自己紹介の一行がここに入ります。二行目も続きます。三行目まで長く続く紹介文です。四行目は切れて隠れます。</p>
      <button class="detail__more" id="detailMore" type="button" aria-expanded="false">もっと見る</button>
    </div>
  </div>
  <p class="detail__meta"><span class="detail__chip" id="detailChip">clamp 3行 · 実測待ち</span></p>
</section>
</main>
<script>
// 프로필 もっと見る(04) — bio 문단에 clamp(고정 줄 수)를 건 상태의 scrollHeight 와, clamp 을 풀었을 때의
// scrollHeight 를 한 프레임 안에서 비교해 실제로 넘치는 경우에만 もっと見る 버튼을 켠다(계산 한 겹).
// 넘치지 않으면 버튼을 아예 감춘다 — 항상 보이는 장식 버튼이 아니다.
(function () {
  var wrap = document.getElementById('detail');
  var bio = document.getElementById('detailBio');
  var more = document.getElementById('detailMore');
  var chip = document.getElementById('detailChip');
  var cv = document.querySelector('.detail__cv');
  if (!wrap || !bio || !more || !chip || !cv) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var HEXES = ['#9fc9ec', '#93d9c0', '#b9a0ff', '#f6c6d3'];
  (function drawAvatar() {
    var ctx = cv.getContext('2d');
    if (!ctx) return;
    var rnd = mulberry32(41);
    var s = cv.width;
    ctx.save();
    ctx.beginPath(); ctx.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2); ctx.clip();
    var cell = 7;
    for (var y = 0; y < s; y += cell) {
      for (var x = 0; x < s; x += cell) {
        var v = rnd();
        ctx.fillStyle = v > .5 ? HEXES[Math.floor(rnd() * HEXES.length)] : 'rgba(23,20,26,.08)';
        ctx.fillRect(x, y, cell, cell);
      }
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(23,20,26,.55)';
    ctx.beginPath(); ctx.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff7e6';
    ctx.font = '700 ' + Math.round(s * .4) + 'px -apple-system, "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('M1', s / 2, s / 2 + 1);
  })();

  var card = wrap.querySelector('.detail__card');
  var LINES = [3, 2];   // 변형 04: clamp 줄 수 3 → 2
  var lineIdx = 0;

  function measure(lineClamp) {
    bio.style.setProperty('--clamp', String(lineClamp));
    bio.classList.add('is-clamped');
    var clampedHeight = bio.scrollHeight;
    bio.classList.remove('is-clamped');
    var fullHeight = bio.scrollHeight;
    bio.classList.add('is-clamped');
    return fullHeight > clampedHeight + 1;
  }

  function apply(lineClamp) {
    var overflow = measure(lineClamp);
    more.style.display = overflow ? '' : 'none';
    more.setAttribute('aria-expanded', 'false');
    bio.classList.remove('is-open');
    chip.textContent = 'clamp ' + lineClamp + '行 · ' + (overflow ? 'オーバーフローO' : 'オーバーフローX');
    if (card) card.classList.toggle('is-alt');
  }

  more.addEventListener('click', function () {
    var open = bio.classList.toggle('is-open');
    more.setAttribute('aria-expanded', open ? 'true' : 'false');
    more.textContent = open ? '閉じる' : 'もっと見る';
  });

  apply(LINES[0]);

  if (!reduce) {
    setInterval(function () {
      lineIdx = (lineIdx + 1) % LINES.length;
      apply(LINES[lineIdx]);
    }, 320);
  }
})();
</script>
</body>
</html>
