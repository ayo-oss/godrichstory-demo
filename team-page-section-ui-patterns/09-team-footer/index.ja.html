<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>チームメンバーの現地時刻 푸터 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="foot" id="foot">
  <p class="foot__hint" id="footHint">固定の基準時刻に仮想の経過時間を加え、メンバーごとに異なるタイムゾーンの現地時刻を計算します。</p>
  <div class="foot__row" id="footRow" role="list" aria-label="チームメンバーの現地時刻"></div>
  <p class="foot__meta"><span class="foot__chip" id="footChip">基準 2026-01-01 09:00 UTC</span></p>
</section>
</main>
<script>
// チームメンバーの現地時刻 푸터(09) — 고정 기준시각(EPOCH)에 가상의 경과시간을 더한 시각 하나를
// Intl.DateTimeFormat 으로 팀원마다 다른 timeZone 에 맞춰 다시 읽는다(계산 한 겹).
// 그 시각의 시(hour) 가 야간대(22~6시)에 들면 조용 표시를 켠다. 실제 Date.now() 는
// 캡처 재현성을 위해 쓰지 않는다.
(function () {
  var row = document.getElementById('footRow');
  var chip = document.getElementById('footChip');
  if (!row || !chip) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var EPOCH = new Date('2026-01-01T09:00:00Z').getTime();   // 고정 기준시각
  var STEP_MIN = 95;   // 가상 経過 — 매 tick 마다 이만큼 시계를 돌린다

  var MEMBERS = [
    { tag: 'M1', zone: 'Asia/Seoul' },
    { tag: 'M2', zone: 'Europe/London' },
    { tag: 'M3', zone: 'America/New_York' },
    { tag: 'M4', zone: 'Australia/Sydney' }
  ];

  MEMBERS.forEach(function (m) {
    var cell = document.createElement('div');
    cell.className = 'foot__cell';
    cell.setAttribute('role', 'listitem');
    var tag = document.createElement('span');
    tag.className = 'foot__tag';
    tag.textContent = m.tag;
    var time = document.createElement('time');
    time.className = 'foot__time';
    var dot = document.createElement('span');
    dot.className = 'foot__dot';
    dot.setAttribute('aria-hidden', 'true');
    cell.appendChild(tag);
    cell.appendChild(time);
    cell.appendChild(dot);
    row.appendChild(cell);
    m.cell = cell;
    m.timeEl = time;
  });

  function hourIn(zone, date) {
    var s = new Intl.DateTimeFormat('en-GB', { timeZone: zone, hour: 'numeric', hourCycle: 'h23' }).format(date);
    return parseInt(s, 10);
  }

  var elapsedMin = 0;

  function render() {
    var now = new Date(EPOCH + elapsedMin * 60000);
    MEMBERS.forEach(function (m) {
      var label = new Intl.DateTimeFormat('en-GB', { timeZone: m.zone, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(now);
      m.timeEl.textContent = label;
      m.timeEl.setAttribute('datetime', now.toISOString());
      var hour = hourIn(m.zone, now);
      var quiet = hour < 7 || hour >= 22;
      m.cell.classList.toggle('is-quiet', quiet);
    });
    chip.textContent = '経過 ' + elapsedMin + '分';
  }

  render();

  if (!reduce) {
    setInterval(function () {
      elapsedMin += STEP_MIN;
      render();
    }, 550);
  }
})();
</script>
</body>
</html>
