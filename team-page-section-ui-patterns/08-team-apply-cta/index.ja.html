<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지원 마감 CTA — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="cta" id="cta">
  <p class="cta__hint" id="ctaHint">固定の基準日から締切日までの残り日数をMath.ceilで繰り上げ計算し、3日以下になると急ぎ状態に変わります。</p>
  <div class="cta__card">
    <p class="cta__role" id="ctaRole">フロントエンドエンジニア</p>
    <p class="cta__days" id="ctaDays" aria-live="polite">D-12</p>
    <button class="cta__btn" id="ctaBtn" type="button">応募する</button>
  </div>
  <p class="cta__meta"><span class="cta__chip" id="ctaChip">基準日 2026-01-01</span></p>
</section>
</main>
<script>
// 지원 마감 CTA(08) — 고정 기준시각(EPOCH, 캡처 재현성을 위해 실제 Date.now() 를 쓰지 않는다)
// 에서 마감일까지 남은 밀리초를 하루(86,400,000ms)로 나눠 Math.ceil 로 올린 값을 D-day 로
// 표시한다(계산 한 겹). 남은 일수가 URGENT_DAYS 이하로 좁혀지면 急ぎ 상태(error 색)로 바뀐다.
(function () {
  var role = document.getElementById('ctaRole');
  var daysEl = document.getElementById('ctaDays');
  var btn = document.getElementById('ctaBtn');
  var chip = document.getElementById('ctaChip');
  var card = document.querySelector('.cta__card');
  if (!role || !daysEl || !btn || !chip || !card) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var EPOCH = new Date('2026-01-01T00:00:00Z').getTime();   // 고정 기준시각
  var DAY_MS = 86400000;
  var URGENT_DAYS = 3;

  var ROLES = [
    { name: 'フロントエンドエンジニア', deadline: '2026-01-13T00:00:00Z' },
    { name: 'プロダクトデザイナー', deadline: '2026-01-03T00:00:00Z' },
    { name: 'バックエンドエンジニア', deadline: '2026-01-21T00:00:00Z' }
  ];
  var idx = 0;

  function daysLeft(deadlineIso) {
    var deadline = new Date(deadlineIso).getTime();
    return Math.ceil((deadline - EPOCH) / DAY_MS);
  }

  function apply(i) {
    var r = ROLES[i];
    var d = daysLeft(r.deadline);
    role.textContent = r.name;
    daysEl.textContent = 'D-' + d;
    var urgent = d <= URGENT_DAYS;
    card.classList.toggle('is-urgent', urgent);
    chip.textContent = '基準日 2026-01-01 · ' + (urgent ? '急ぎ' : '余裕');
  }

  apply(idx);

  if (!reduce) {
    setInterval(function () {
      idx = (idx + 1) % ROLES.length;
      apply(idx);
    }, 700);
  }
})();
</script>
</body>
</html>
