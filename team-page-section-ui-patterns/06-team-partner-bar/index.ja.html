<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파트너 로고 바 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="bar" id="bar">
  <p class="bar__hint" id="barHint">1セットの実際の幅を測り、目標速度(px/s)になるようアニメーションの持続時間を逆算します。</p>
  <div class="bar__viewport">
    <div class="bar__track" id="barTrack">
      <div class="bar__set" id="barSetA"></div>
      <div class="bar__set" id="barSetB" aria-hidden="true"></div>
    </div>
  </div>
  <p class="bar__meta"><span class="bar__chip" id="barChip">speed 60px/s</span></p>
</section>
</main>
<script>
// 파트너 로고 바(06) — 로고 세트 하나의 실측 폭(scrollWidth)을 원하는 속도(px/s)로 나눠
// 애니메이션 지속시간을 거꾸로 계산한다(계산 한 겹). 세트를 그대로 복제해 이어붙이므로
// translateX(-50%) 가 정확히 세트 하나 폭만큼만 움직인다 — 트랙에는 flex gap 을 쓰지 않고
// 로고마다 margin-right 로 간격을 준다(BD15).
(function () {
  var track = document.getElementById('barTrack');
  var setA = document.getElementById('barSetA');
  var setB = document.getElementById('barSetB');
  var chip = document.getElementById('barChip');
  if (!track || !setA || !setB || !chip) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(77);
  var SHAPES = ['circle', 'square', 'triangle', 'hexagon', 'diamond', 'pill'];

  function shapeEl(i) {
    var wrap = document.createElement('span');
    wrap.className = 'bar__logo bar__logo--' + SHAPES[i % SHAPES.length];
    wrap.setAttribute('role', 'img');
    wrap.setAttribute('aria-label', 'パートナーP' + (i + 1));
    return wrap;
  }

  var COUNT = 6;
  for (var i = 0; i < COUNT; i++) { setA.appendChild(shapeEl(i)); }
  for (var j = 0; j < COUNT; j++) { setB.appendChild(shapeEl(j)); }
  void rnd(); // 시드 고정 사용 표시 — 순서를 흔들 필요가 없어 소비만 한다

  var SPEEDS = [60, 30];   // 변형 06: px/s
  var speedIdx = 0;

  function apply(speed) {
    var setWidth = setA.getBoundingClientRect().width;
    if (setWidth <= 0) return;
    var durationS = setWidth / speed;
    track.style.setProperty('--dur', durationS.toFixed(2) + 's');
    chip.textContent = 'speed ' + speed + 'px/s · ' + durationS.toFixed(1) + 's/lap';
  }

  apply(SPEEDS[0]);
  window.addEventListener('resize', function () { apply(SPEEDS[speedIdx]); });

  if (!reduce) {
    setInterval(function () {
      speedIdx = (speedIdx + 1) % SPEEDS.length;
      apply(SPEEDS[speedIdx]);
    }, 2400);
  }
})();
</script>
</body>
</html>
