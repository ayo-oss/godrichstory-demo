<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 인용문 카드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="quote" id="quote">
  <p class="quote__hint" id="quoteHint">계산된 줄높이(line-height)를 목표 칸 높이로 나눠, 인용문 길이에 맞는 글자 크기를 거꾸로 구합니다</p>
  <blockquote class="quote__box" id="quoteBox">
    <p class="quote__text" id="quoteText"></p>
    <footer class="quote__who" id="quoteWho"></footer>
  </blockquote>
  <p class="quote__meta"><span class="quote__chip" id="quoteChip">font 16px</span></p>
</section>
</main>
<script>
// 팀 인용문 카드(07) — getComputedStyle 로 읽은 line-height(배수)와 목표 칸 높이(TARGET_H)를
// 이용해 "글자크기 × line-height ≤ TARGET_H" 를 만족하는 최대 글자크기를 거꾸로 계산한다
// (계산 한 겹). 문구가 바뀔 때 opacity 크로스페이드로 겹쳐 보이지 않도록 steps(1,end) 로
// 한 프레임에 통째로 컷 교체한다.
(function () {
  var box = document.getElementById('quoteBox');
  var textEl = document.getElementById('quoteText');
  var whoEl = document.getElementById('quoteWho');
  var chip = document.getElementById('quoteChip');
  if (!box || !textEl || !whoEl || !chip) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var QUOTES = [
    { text: '짧은 소감 한 줄.', who: 'M1 · 디자인' },
    { text: '팀 소개 페이지를 만들면서 가장 신경 쓴 건 속도와 신뢰감이었어요.', who: 'M2 · 개발' },
    { text: '보통.', who: 'M3 · 운영' }
  ];
  var idx = 0;

  var TARGET_H = 64;   // 칸 높이 목표(px) — 이 안에 인용문이 들어가야 한다
  var MIN_FONT = 12;
  var MAX_FONT = 20;

  function lineHeightRatio() {
    var cs = getComputedStyle(textEl);
    var lh = parseFloat(cs.lineHeight);
    var fs = parseFloat(cs.fontSize) || 16;
    if (!lh || isNaN(lh)) return 1.4;
    return lh / fs;
  }

  function fitFontSize(length) {
    var ratio = lineHeightRatio();
    var estLines = length > 40 ? 3 : length > 18 ? 2 : 1;
    var maxByHeight = TARGET_H / (estLines * ratio);
    var size = Math.max(MIN_FONT, Math.min(MAX_FONT, Math.floor(maxByHeight)));
    return size;
  }

  function show(i) {
    var q = QUOTES[i];
    var size = fitFontSize(q.text.length);
    textEl.style.fontSize = size + 'px';
    textEl.textContent = q.text;
    whoEl.textContent = q.who;
    chip.textContent = 'font ' + size + 'px · line ' + lineHeightRatio().toFixed(1) + 'x';
    box.classList.remove('is-swap');
    void box.offsetWidth;
    box.classList.add('is-swap');
  }

  show(idx);

  if (!reduce) {
    setInterval(function () {
      idx = (idx + 1) % QUOTES.length;
      show(idx);
    }, 420);
  }
})();
</script>
</body>
</html>
