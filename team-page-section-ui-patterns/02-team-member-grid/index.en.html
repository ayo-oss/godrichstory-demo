<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members 그리드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="grid" id="grid">
  <p class="grid__hint" id="gridHint">It calculates the leftover members on the last row and centers them so no card is left stranded alone.</p>
  <div class="grid__head" id="gridHead" role="list" aria-label="Team member list"></div>
  <div class="grid__tail" id="gridTail" role="list" aria-label="Last row"></div>
  <p class="grid__meta"><span class="grid__chip" id="gridChip">n=8 · cols 4 · remainder 0</span></p>
</section>
</main>
<script>
// Members 그리드(02) — 인원수를 열 수로 나눈 나머지로 마지막 줄에 몇 명이 남는지 계산하고,
// 나머지가 1~2명일 때만 그 인원을 별도 flex 줄로 떼어 가운데로 모은다. ResizeObserver 로
// 컨테이너 폭이 바뀌어 열 수 자체가 바뀔 때도 같은 계산을 다시 돌린다(계산 한 겹).
(function () {
  var grid = document.getElementById('grid');
  var head = document.getElementById('gridHead');
  var tail = document.getElementById('gridTail');
  var chip = document.getElementById('gridChip');
  if (!grid || !head || !tail || !chip) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var HEXES = ['#9fc9ec', '#93d9c0', '#b9a0ff', '#f6c6d3'];

  function drawAvatar(cv, seed, label) {
    var ctx = cv.getContext('2d');
    if (!ctx) return;
    var rnd = mulberry32(seed);
    var s = cv.width;
    ctx.clearRect(0, 0, s, s);
    ctx.save();
    ctx.beginPath(); ctx.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2); ctx.clip();
    var cell = 6;
    for (var y = 0; y < s; y += cell) {
      for (var x = 0; x < s; x += cell) {
        var v = rnd();
        ctx.fillStyle = v > .5 ? HEXES[Math.floor(rnd() * HEXES.length)] : 'rgba(23,20,26,.08)';
        ctx.fillRect(x, y, cell, cell);
      }
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(23,20,26,.55)';
    ctx.beginPath(); ctx.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff7e6';
    ctx.font = '700 ' + Math.round(s * .4) + 'px -apple-system, "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, s / 2, s / 2 + 1);
  }

  function card(i) {
    var el = document.createElement('div');
    el.className = 'grid__card';
    el.setAttribute('role', 'listitem');
    var cv = document.createElement('canvas');
    cv.className = 'grid__cv'; cv.width = 28; cv.height = 28;
    cv.setAttribute('aria-hidden', 'true');
    var tag = document.createElement('span');
    tag.className = 'grid__tag';
    tag.textContent = 'M' + (i + 1);
    el.appendChild(cv); el.appendChild(tag);
    drawAvatar(cv, 11 + i * 13, 'M' + (i + 1));
    return el;
  }

  var cols = 4;   // 기본값 — ResizeObserver 가 실측 폭으로 다시 계산한다
  var MIN_CARD = 76;

  function computeCols(width) {
    var c = Math.floor(width / MIN_CARD);
    return Math.max(2, Math.min(5, c || 4));
  }

  function layout(count) {
    var remainder = count % cols;
    var tailCount = (remainder === 1 || remainder === 2) ? remainder : 0;
    var headCount = count - tailCount;
    head.style.setProperty('--cols', String(cols));
    head.innerHTML = '';
    tail.innerHTML = '';
    for (var i = 0; i < headCount; i++) head.appendChild(card(i));
    for (var j = 0; j < tailCount; j++) tail.appendChild(card(headCount + j));
    tail.style.display = tailCount > 0 ? 'flex' : 'none';
    chip.textContent = 'n=' + count + ' · cols ' + cols + ' · remainder ' + tailCount;
    grid.classList.remove('is-in');
    void grid.offsetWidth;
    grid.classList.add('is-in');
  }

  var ro = new ResizeObserver(function (entries) {
    var w = entries[0] ? entries[0].contentRect.width : grid.clientWidth;
    var next = computeCols(w);
    if (next !== cols) { cols = next; layout(counts[idx]); }
  });
  ro.observe(grid);

  var counts = [7, 8, 9, 10];
  var idx = 0;
  layout(counts[0]);

  if (!reduce) {
    setInterval(function () {
      idx = (idx + 1) % counts.length;
      layout(counts[idx]);
    }, 700);
  }
})();
</script>
</body>
</html>
