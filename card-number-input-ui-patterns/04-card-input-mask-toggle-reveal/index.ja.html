<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マスク値切替 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cm is-demo" id="cm">
  <div class="cm__row" id="cmRow"></div>
  <button type="button" class="cm__toggle" id="cmToggle" aria-pressed="false">マスク値切替</button>
</div>
<script>
(function () {
  var root = document.getElementById('cm');
  var row = document.getElementById('cmRow');
  var btn = document.getElementById('cmToggle');
  var DIGITS = '9999999999999995';
  var KEEP = 4; // 앞의 몇 자리 값은 항상 그대로
  var STAGGER_MS = 45; // 계산 겹: 자릿수 값마다 이만큼씩 늦게 전환된다

  var cells = [];
  DIGITS.split('').forEach(function (ch, i) {
    var group = document.createElement('span');
    group.className = 'cm__group';
    if (i > 0 && i % 4 === 0) group.classList.add('cm__group--gap');
    if (i < KEEP) {
      group.innerHTML = '<span class="cm__digit cm__digit--fixed">' + ch + '</span>';
    } else {
      var idx = i - KEEP;
      group.style.setProperty('--i', idx);
      group.innerHTML =
        '<span class="cm__digit">' + ch + '</span>' +
        '<span class="cm__mask">•</span>';
      cells.push(group);
    }
    row.appendChild(group);
  });

  var masked = false;
  function paint() {
    root.classList.toggle('cm--masked', masked);
    btn.setAttribute('aria-pressed', String(masked));
  }

  function toggle() {
    masked = !masked;
    paint();
  }

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    toggle();
  });

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(toggle, 1500); }
  else { masked = true; paint(); }
})();
</script>
</main>
</body>
</html>
