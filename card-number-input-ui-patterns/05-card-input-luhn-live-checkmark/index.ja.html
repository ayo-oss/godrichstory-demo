<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>有効性値のリアルタイム切替 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cl is-demo" id="cl">
  <label class="cl__field">
    <input class="cl__input" id="clInput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="16" value="">
    <span class="cl__badge" id="clBadge">
      <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
        <path id="clCheck" d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
      </svg>
    </span>
  </label>
  <div class="cl__sum" id="clSum">加重合計値 0</div>
</div>
<script>
(function () {
  var root = document.getElementById('cl');
  var input = document.getElementById('clInput');
  var badge = document.getElementById('clBadge');
  var sumLabel = document.getElementById('clSum');

  // 계산 겹: 자리별 가중 합(오른쪽부터 한 자리씩 건너 2배) — 룬 체크섬을 매 입력마다 다시 계산한다.
  function luhnSum(digits) {
    var sum = 0, dbl = false;
    for (var i = digits.length - 1; i >= 0; i--) {
      var d = digits.charCodeAt(i) - 48;
      if (dbl) { d *= 2; if (d > 9) d -= 9; }
      sum += d;
      dbl = !dbl;
    }
    return sum;
  }

  function paint(digits) {
    var sum = digits.length ? luhnSum(digits) : 0;
    var valid = digits.length >= 13 && sum % 10 === 0;
    sumLabel.textContent = '加重合計値 ' + sum;
    badge.classList.toggle('cl__badge--on', valid);
  }

  input.addEventListener('input', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    var digits = input.value.replace(/\D/g, '').slice(0, 16);
    input.value = digits;
    paint(digits);
  });

  // 자동 루프: 유효 번호를 한 자리씩 채웠다가, 마지막 자리를 잘못된 값으로 바꿔 무효 상태도 보여준다.
  var VALID = '9999999999999995';
  var INVALID = '9999999999999990';
  var SEQ = [];
  for (var i = 0; i <= VALID.length; i++) SEQ.push(VALID.slice(0, i));
  SEQ.push(INVALID);
  SEQ.push(VALID);
  for (var k = VALID.length - 1; k >= 0; k--) SEQ.push(VALID.slice(0, k));
  var si = 0;
  var autoTimer = null;
  function autoTick() {
    var digits = SEQ[si];
    input.value = digits;
    paint(digits);
    si = (si + 1) % SEQ.length;
  }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 180); autoTick(); }
  else { autoTick(); }
})();
</script>
</main>
</body>
</html>
