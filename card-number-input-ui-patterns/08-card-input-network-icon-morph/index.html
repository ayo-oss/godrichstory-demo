<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>패턴 인식 값 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cn is-demo" id="cn">
  <label class="cn__field">
    <input class="cn__input" id="cnInput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="16" value="">
  </label>
  <div class="cn__shapeBox">
    <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true">
      <polygon class="cn__poly" id="cnPoly" points="20,10 28,15 28,25 20,30 12,25 12,15"/>
    </svg>
    <span class="cn__tag" id="cnTag">패턴 미인식</span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('cn');
  var input = document.getElementById('cnInput');
  var poly = document.getElementById('cnPoly');
  var tag = document.getElementById('cnTag');
  var MORPH_MS = 420; // 계산 겹: 앞자리 패턴 값이 바뀔 때 도형 점을 이만큼 동안 보간한다

  // 가상 도형 3종(A/B/C) — 실제 카드사 로고·BIN 범위와 무관한 중립 라벨.
  var SHAPES = {
    A: [[20, 4], [33.9, 12], [33.9, 28], [20, 36], [6.1, 28], [6.1, 12]],
    B: [[29, 4.4], [33, 20], [29, 35.6], [13.5, 31.3], [2, 20], [13.5, 8.7]],
    C: [[20, 1], [26.9, 16], [36.5, 29.5], [20, 28], [3.5, 29.5], [13.1, 16]],
    N: [[20, 10], [28, 15], [28, 25], [20, 30], [12, 25], [12, 15]]
  };
  var PREFIX_MAP = { '3': 'C', '4': 'A', '5': 'B' };

  var current = SHAPES.N.map(function (p) { return p.slice(); });
  var raf = null;

  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  function morphTo(key) {
    var target = SHAPES[key];
    var start = current.map(function (p) { return p.slice(); });
    var t0 = performance.now();
    if (raf) cancelAnimationFrame(raf);
    function step(now) {
      var t = Math.min((now - t0) / MORPH_MS, 1);
      var e = easeOut(t);
      var pts = start.map(function (p, i) {
        var x = p[0] + (target[i][0] - p[0]) * e;
        var y = p[1] + (target[i][1] - p[1]) * e;
        return x.toFixed(1) + ',' + y.toFixed(1);
      });
      poly.setAttribute('points', pts.join(' '));
      if (t < 1) { raf = requestAnimationFrame(step); }
      else { current = target.map(function (p) { return p.slice(); }); }
    }
    raf = requestAnimationFrame(step);
  }

  var lastKey = 'N';
  function paint(value) {
    var lead = value.charAt(0);
    var key = PREFIX_MAP[lead] || 'N';
    if (key !== lastKey) {
      morphTo(key);
      lastKey = key;
    }
    tag.textContent = key === 'N' ? '패턴 미인식' : ('패턴 ' + key);
  }

  input.addEventListener('input', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    input.value = input.value.replace(/\D/g, '').slice(0, 16);
    paint(input.value);
  });

  // 자동 루프: 앞자리 값을 바꿔가며 세 패턴을 순서대로 보여준다.
  var SEQ = ['', '9999999999999995', '5399148803436467', '3739148803436', '', '9999999999999995'];
  var si = 0;
  var autoTimer = null;
  function autoTick() {
    input.value = SEQ[si];
    paint(SEQ[si]);
    si = (si + 1) % SEQ.length;
  }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } if (raf) { cancelAnimationFrame(raf); raf = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 1100); autoTick(); }
  else { input.value = SEQ[1]; paint(SEQ[1]); }
})();
</script>
</main>
</body>
</html>
