<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>완료 값 빛남 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cg is-demo" id="cg">
  <div class="cg__field">
    <span class="cg__glow" id="cgGlow" aria-hidden="true"></span>
    <input class="cg__input" id="cgInput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="16" value="">
    <span class="cg__icon" id="cgIcon">
      <svg class="cg__open" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
        <path d="M6 9V6.5a4 4 0 0 1 7.5-1.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <rect x="4" y="9" width="9" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
      </svg>
      <svg class="cg__closed" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
        <path d="M6.5 9V6.5a3.5 3.5 0 0 1 7 0V9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <rect x="4.5" y="9" width="11" height="7.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('cg');
  var field = root.querySelector('.cg__field');
  var input = document.getElementById('cgInput');
  var glow = document.getElementById('cgGlow');
  var GLOW_MS = 900; // 계산 겹: 빛남 값이 3번 펄스로 잦아드는 데 걸리는 시간(감쇠 포락선)

  function luhnSum(digits) {
    var sum = 0, dbl = false;
    for (var i = digits.length - 1; i >= 0; i--) {
      var d = digits.charCodeAt(i) - 48;
      if (dbl) { d *= 2; if (d > 9) d -= 9; }
      sum += d;
      dbl = !dbl;
    }
    return sum;
  }

  function tryLock() {
    var digits = input.value.replace(/\D/g, '');
    if (digits.length === 16 && luhnSum(digits) % 10 === 0) {
      glow.classList.remove('cg__glow--on');
      void glow.offsetWidth;
      glow.classList.add('cg__glow--on');
      setTimeout(function () {
        field.classList.add('cg__field--locked');
        input.setAttribute('readonly', 'readonly');
      }, GLOW_MS);
    }
  }

  input.addEventListener('input', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    input.value = input.value.replace(/\D/g, '').slice(0, 16);
    tryLock();
  });

  // 자동 루프: 유효 번호를 채워 빛남 → 잠금까지 보여준 뒤 리셋한다.
  var VALID = '9999999999999995';
  var stopped = false;
  var handle = null;
  function stopAutoplay() { stopped = true; if (handle) { clearTimeout(handle); handle = null; } }

  function typeStep(i) {
    if (stopped) return;
    input.value = VALID.slice(0, i);
    if (i < VALID.length) { handle = setTimeout(function () { typeStep(i + 1); }, 90); }
    else { tryLock(); handle = setTimeout(reset, GLOW_MS + 1400); }
  }
  function reset() {
    if (stopped) return;
    field.classList.remove('cg__field--locked');
    input.removeAttribute('readonly');
    input.value = '';
    handle = setTimeout(function () { typeStep(0); }, 260);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { typeStep(0); }
  else { input.value = VALID; field.classList.add('cg__field--locked'); input.setAttribute('readonly', 'readonly'); }
})();
</script>
</main>
</body>
</html>
