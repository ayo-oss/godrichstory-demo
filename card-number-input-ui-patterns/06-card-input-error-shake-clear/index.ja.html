<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エラー値の揺れ切替 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ck is-demo" id="ck">
  <label class="ck__field">
    <input class="ck__input" id="ckInput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="16" value="">
  </label>
  <button type="button" class="ck__btn" id="ckBtn">確認</button>
  <p class="ck__msg" id="ckMsg" aria-live="polite"></p>
</div>
<script>
(function () {
  var root = document.getElementById('ck');
  var input = document.getElementById('ckInput');
  var field = input.parentElement;
  var btn = document.getElementById('ckBtn');
  var msg = document.getElementById('ckMsg');
  var AUTO_CLEAR_MS = 700; // 계산 겹: 흔들림 애니메이션이 잦아든 뒤 입력 값을 비우는 지연

  function shake() {
    field.classList.remove('ck__field--error');
    void field.offsetWidth;
    field.classList.add('ck__field--error');
  }

  function verify() {
    var digits = input.value.replace(/\D/g, '');
    if (digits.length === 16) {
      msg.textContent = '';
      return true;
    }
    msg.textContent = '16桁の値ではありません';
    shake();
    setTimeout(function () {
      input.value = '';
      msg.textContent = '';
    }, AUTO_CLEAR_MS);
    return false;
  }

  input.addEventListener('input', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    input.value = input.value.replace(/\D/g, '').slice(0, 16);
  });
  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    verify();
  });

  // 자동 루프: 16자리에 못 미치는 값을 타이핑해 確認 버튼을 누르면 흔들림 뒤 자동으로 지워진다.
  var TYPED = '9999';
  var stopped = false;
  var autoHandle = null;
  function stopAutoplay() { stopped = true; if (autoHandle) { clearTimeout(autoHandle); autoHandle = null; } }

  function typeStep(i) {
    if (stopped) return;
    input.value = TYPED.slice(0, i);
    if (i < TYPED.length) { autoHandle = setTimeout(function () { typeStep(i + 1); }, 220); }
    else { autoHandle = setTimeout(doVerify, 500); }
  }
  function doVerify() {
    if (stopped) return;
    verify();
    autoHandle = setTimeout(function () { typeStep(0); }, AUTO_CLEAR_MS + 700);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { typeStep(0); }
  else { input.value = TYPED; }
})();
</script>
</main>
</body>
</html>
