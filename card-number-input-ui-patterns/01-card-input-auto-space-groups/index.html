<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자릿수 값 그룹 전환 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ci is-demo" id="ci">
  <label class="ci__field">
    <input class="ci__input" id="ciInput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="19" value="">
  </label>
  <div class="ci__track" id="ciTrack" aria-hidden="true">
    <span class="ci__seg" data-g="0"><span class="ci__segFill"></span></span>
    <span class="ci__gap" data-gap="0"></span>
    <span class="ci__seg" data-g="1"><span class="ci__segFill"></span></span>
    <span class="ci__gap" data-gap="1"></span>
    <span class="ci__seg" data-g="2"><span class="ci__segFill"></span></span>
    <span class="ci__gap" data-gap="2"></span>
    <span class="ci__seg" data-g="3"><span class="ci__segFill"></span></span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('ci');
  var input = document.getElementById('ciInput');
  var track = document.getElementById('ciTrack');
  var segFills = track.querySelectorAll('.ci__segFill');
  var gaps = track.querySelectorAll('.ci__gap');

  // 계산 겹: 자릿수 값을 4개씩 묶어 다시 조립하고, 커서 위치 값을 digit count 로
  // 환산해 삽입된 간격 값 개수만큼 보정한다 — 그냥 재대입하면 커서가 맨 끝으로 튄다.
  function digitsBefore(str, upto) { return str.slice(0, upto).replace(/\D/g, '').length; }

  function groupsOf(rawDigits) {
    var g = rawDigits.match(/.{1,4}/g) || [];
    while (g.length < 4) g.push('');
    return g;
  }

  function paintTrack(rawDigits) {
    var g = groupsOf(rawDigits);
    for (var i = 0; i < 4; i++) {
      segFills[i].style.transform = 'scaleX(' + (g[i].length / 4) + ')';
    }
    for (var j = 0; j < 3; j++) {
      var on = rawDigits.length > (j + 1) * 4;
      gaps[j].classList.toggle('ci__gap--on', on);
    }
  }

  function reformat(prevCaret) {
    var prevDigits = digitsBefore(input.value, prevCaret);
    var rawDigits = input.value.replace(/\D/g, '').slice(0, 16);
    var groups = rawDigits.match(/.{1,4}/g) || [];
    input.value = groups.join(' ');
    // 커서 위치 보정: 앞선 자릿수 값 개수 + 그 앞에 이미 생긴 간격 값 개수(4자리마다 1개)
    var spacesBefore = Math.floor(Math.max(prevDigits - 1, 0) / 4);
    var newCaret = Math.min(prevDigits + spacesBefore, input.value.length);
    input.setSelectionRange(newCaret, newCaret);
    paintTrack(rawDigits);
  }

  input.addEventListener('input', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    reformat(input.selectionStart);
  });

  // 자동 루프: 시드 고정 자릿수 값을 한 자리씩 늘렸다 줄인다.
  var FULL = '9999999999999995';
  var SEQ = [];
  for (var i = 0; i <= FULL.length; i++) SEQ.push(FULL.slice(0, i));
  for (var k = FULL.length - 1; k >= 0; k--) SEQ.push(FULL.slice(0, k));
  var si = 0;
  var autoTimer = null;
  function autoTick() {
    var rawDigits = SEQ[si];
    var groups = rawDigits.match(/.{1,4}/g) || [];
    input.value = groups.join(' ');
    paintTrack(rawDigits);
    si = (si + 1) % SEQ.length;
  }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 160); autoTick(); }
  else { autoTick(); }
})();
</script>
</main>
</body>
</html>
