<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus and tilt values linked — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ct is-demo" id="ct">
  <div class="ct__pad" id="ctPad">
    <div class="ct__card" id="ctCard">
      <span class="ct__chip"></span>
      <span class="ct__num">9999 9999 9999 9995</span>
      <span class="ct__sheen" id="ctSheen"></span>
    </div>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('ct');
  var pad = document.getElementById('ctPad');
  var card = document.getElementById('ctCard');
  var sheen = document.getElementById('ctSheen');
  var MAX_DEG = 14;
  var LERP = 0.14; // 계산 겹: 목표 기울기 값으로 매 프레임 이 비율만큼만 다가가는 관성 보간

  var targetX = 0, targetY = 0, curX = 0, curY = 0;
  var raf = null;

  function apply() {
    curX += (targetX - curX) * LERP;
    curY += (targetY - curY) * LERP;
    card.style.transform = 'perspective(600px) rotateX(' + curX.toFixed(2) + 'deg) rotateY(' + curY.toFixed(2) + 'deg)';
    sheen.style.transform = 'translate(' + (curY * 1.4).toFixed(1) + 'px,' + (curX * -1.4).toFixed(1) + 'px)';
    raf = requestAnimationFrame(apply);
  }
  raf = requestAnimationFrame(apply);

  function setTargetFromPoint(px, py) {
    var r = pad.getBoundingClientRect();
    var nx = (px - r.left) / r.width - 0.5;
    var ny = (py - r.top) / r.height - 0.5;
    targetY = nx * MAX_DEG * 2;
    targetX = -ny * MAX_DEG * 2;
  }

  pad.addEventListener('pointermove', function (e) {
    root.classList.remove('is-demo');
    stopAutoplay();
    setTargetFromPoint(e.clientX, e.clientY);
  });
  pad.addEventListener('pointerleave', function () {
    if (autoTimer === null) { targetX = 0; targetY = 0; }
  });

  // 자동 루프: 포인터 좌표 값이 원을 그리며 도는 것을 흉내낸다.
  var t = 0;
  var autoTimer = null;
  function autoTick() {
    var r = pad.getBoundingClientRect();
    t += 0.12;
    var cx = r.left + r.width / 2 + Math.cos(t) * r.width * 0.32;
    var cy = r.top + r.height / 2 + Math.sin(t * 1.3) * r.height * 0.32;
    setTargetFromPoint(cx, cy);
  }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 60); }
})();
</script>
</main>
</body>
</html>
