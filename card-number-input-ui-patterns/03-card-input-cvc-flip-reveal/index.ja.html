<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>セキュリティコード焦点値切替 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cv is-demo" id="cv">
  <div class="cv__scene">
    <div class="cv__card" id="cvCard">
      <div class="cv__face cv__face--front">
        <span class="cv__chipIcon"></span>
        <span class="cv__num">9999 99•• •••• 9995</span>
        <span class="cv__exp">12/29</span>
      </div>
      <div class="cv__face cv__face--back">
        <span class="cv__strip"></span>
        <span class="cv__cvcRow"><span class="cv__cvcBox" id="cvBox">•••</span></span>
      </div>
    </div>
  </div>
  <label class="cv__field">
    <input class="cv__input" id="cvInput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="3" placeholder="CVC">
  </label>
</div>
<script>
(function () {
  var root = document.getElementById('cv');
  var input = document.getElementById('cvInput');
  var card = document.getElementById('cvCard');
  var box = document.getElementById('cvBox');

  // 계산 겹: 초점 값 on/off 에 따라 카드의 3D 회전 각 값이 스프링 곡선($ease-lerp-settle)을
  // 타고 180deg 를 넘겼다가 되돌아와 정착한다 — 등속 회전이 아니라 관성 있는 회전.
  function setFlipped(on) { card.classList.toggle('cv__card--flipped', on); }

  input.addEventListener('focus', function () { root.classList.remove('is-demo'); stopAutoplay(); setFlipped(true); });
  input.addEventListener('blur', function () { setFlipped(false); });
  input.addEventListener('input', function () {
    box.textContent = (input.value.replace(/\D/g, '').slice(0, 3) || '').padEnd(3, '•');
  });

  // 자동 루프: 초점 on/off 를 시드 간격으로 오간다.
  var SEQ = [true, true, false, false];
  var si = 0;
  var autoTimer = null;
  function autoTick() {
    var on = SEQ[si];
    setFlipped(on);
    input.classList.toggle('cv__input--focus', on);
    si = (si + 1) % SEQ.length;
  }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 900); autoTick(); }
})();
</script>
</main>
</body>
</html>
