<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expiry-separator value toggle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ce is-demo" id="ce">
  <label class="ce__field">
    <input class="ce__input" id="ceInput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="5" value="" placeholder="MM/YY">
  </label>
  <div class="ce__chips" id="ceChips" aria-hidden="true">
    <span class="ce__chip" id="ceMm">MM</span>
    <span class="ce__slash" id="ceSlash">/</span>
    <span class="ce__chip" id="ceYy">YY</span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('ce');
  var input = document.getElementById('ceInput');
  var mmChip = document.getElementById('ceMm');
  var yyChip = document.getElementById('ceYy');
  var slash = document.getElementById('ceSlash');

  // 계산 겹: 월 값의 범위를 01~12 로 clamp 하고, 월 자릿수 값이 2자리를 채우면
  // 구분자(슬래시) 값을 자동으로 끼운다.
  function digitsOnly(str) { return str.replace(/\D/g, '').slice(0, 4); }

  function build(rawDigits) {
    var mm = rawDigits.slice(0, 2);
    var yy = rawDigits.slice(2, 4);
    var clamped = false;
    if (mm.length === 2) {
      var n = parseInt(mm, 10);
      if (n === 0) { mm = '01'; clamped = true; }
      else if (n > 12) { mm = '12'; clamped = true; }
    }
    var slashOn = mm.length === 2;
    return { display: mm + (slashOn ? '/' : '') + yy, mm: mm, yy: yy, slashOn: slashOn, clamped: clamped };
  }

  function pulse(el) {
    el.classList.remove('ce__chip--pulse');
    void el.offsetWidth;
    el.classList.add('ce__chip--pulse');
  }

  function paint(r) {
    mmChip.textContent = r.mm || 'MM';
    mmChip.classList.toggle('ce__chip--on', r.mm.length > 0);
    yyChip.textContent = r.yy || 'YY';
    yyChip.classList.toggle('ce__chip--on', r.yy.length > 0);
    slash.classList.toggle('ce__slash--on', r.slashOn);
    if (r.clamped) pulse(mmChip);
  }

  function digitsBefore(str, upto) { return str.slice(0, upto).replace(/\D/g, '').length; }

  input.addEventListener('input', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    var prevDigits = digitsBefore(input.value, input.selectionStart);
    var rawDigits = digitsOnly(input.value);
    var r = build(rawDigits);
    input.value = r.display;
    var newCaret = Math.min(prevDigits + (r.slashOn && prevDigits >= 2 ? 1 : 0), input.value.length);
    input.setSelectionRange(newCaret, newCaret);
    paint(r);
  });

  // 자동 루프: 시드 고정 자릿수 값 — "13" 을 쳐서 월 범위 clamp("12")가 걸리는 장면 포함.
  var SEQ = ['', '1', '13', '132', '1329', '132', '13', '1', ''];
  var si = 0;
  var autoTimer = null;
  function autoTick() {
    var rawDigits = SEQ[si];
    var r = build(rawDigits);
    input.value = r.display;
    paint(r);
    si = (si + 1) % SEQ.length;
  }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 340); autoTick(); }
  else { autoTick(); }
})();
</script>
</main>
</body>
</html>
