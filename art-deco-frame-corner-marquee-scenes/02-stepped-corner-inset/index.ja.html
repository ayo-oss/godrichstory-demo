        edgeEl.style.clipPath = 'none';
        // 칸 하나가 접히는 중간 진행 (계단 사이를 부드럽게 — scaleY 로 펼쳐지는 종이 조각)
        const frac = clamp(kf * n - steps, 0, 1);
        // 종이 면이 계단으로 잘린다 (계산 cornerPath). 0 칸이면 그냥 사각형
        const clip = useN === 0 ? 'none' : clipStr(cardClip(useN));
        paperEl.style.clipPath = clip;
        // 내용물 상자 — 계단이 다 접힌 뒤 inset = n × s 만큼 사방에서 물러난 자리로 통통 튀며 앉는다.
        // 카드 크기에서 2 × inset 을 뺀 크기 (계산: translate(pad,pad) + scale(1 − 2·pad/W, 1 − 2·pad/H), origin 0 0)
        const ki = springK((t - innerAt(n)) / T_INNER_D);
        // 종이 면 — 접힌 진행(kf) 과 내용물이 앉는 진행(ki) 을 종이 명도로 전파한다. 계단이 접히고 내용물이
        // 앉으며 종이가 밝아진다 (값 → 면 명도: 카드에서 가장 넓은 면인 종이가 시연 중 실제로 바뀐다)
        paperEl.style.background = 'rgb(' + f0(251 + kf * 4) + ',' + f0(246 - kf * 6 + ki * 9) + ',' + f0(234 - kf * 20 + ki * 26) + ')';
        const pad = insetOf(n) * ki;
        boxEl.style.transform = 'translate(' + f1(pad) + 'px,' + f1(pad) + 'px) scale(' + f2(1 - (2 * pad) / CARD_W) + ',' + f2(1 - (2 * pad) / CARD_H) + ')';
        boxEl.style.opacity = '1';
        // 칩 — STEP_N·inset·cornerPath
        if (chipEls.length === 3) {
            chipEls[0].textContent = 'STEP_N ' + f0(n);
            chipEls[1].textContent = 'inset ' + f0(foldIns) + 'px = ' + f0(useN) + ' × ' + f0(STEP_S);
            chipEls[2].textContent = 'cornerPath(' + f0(useN) + ',' + f0(STEP_S) + ')';
        }
        // 수식 — 머리말·칩과 같은 접힌 깊이. 완성(모든 칸 접힘) 이면 고정식 STEP_N × s 와 같은 값이 된다
        if (eqEl) {
            eqEl.textContent = 'inset = ' + f0(useN) + ' × ' + f0(STEP_S) + ' = ' + f0(foldIns) + 'px';
        }
        return fill('角 {a}/{b}段 · STEP_N {c} · inset {d}px · 中身 {e}×{f}',
            f0(useN), f0(n), f0(n), f0(foldIns),
            f0(CARD_W - 2 * pad), f0(CARD_H - 2 * pad));
    }
    function build(i) {
        curStepN = (i === 2) ? STEP_N_VAR : STEP_N;
        clearAll();
        mkCard();
        chipEls = [];
        for (let c = 0; c < 3; c += 1) {
            const e = make('b', 'ov ovs', sceneEl);
            put(e, 264, 12 + c * 28, 0, 0);
            chipEls.push(e);
        }
        const ov = make('b', 'ov', sceneEl);
        put(ov, 264, 100, 0, 0);
        ov.textContent = 'inner = card − 2 × (STEP_N × s)';
        const ov2 = make('b', 'ov', sceneEl);
        put(ov2, 264, 116, 0, 0);
        eqEl = ov2;
        frame(0);
        drawRows([spanOf(0, T_RISE0, 0), spanOf(T_RISE0, T_RISE, 2), spanOf(T_FOLD0, curStepN * T_PER, 1), spanOf(innerAt(curStepN), T_INNER_D, 0)], 2000);
        axis(2000);
        setReads(fill('階段の角 — STEP_N {a} · inset {b}px · cornerPath', f0(curStepN), f0(insetOf(curStepN))),
            '四つの角が段数だけ階段に折れ、余白がその分広がる');
        doneP.textContent = '';
        return 2000;
    }

    return run({ count: 3, build: build, frame: frame, head: false });   // 차트 재생 헤드(검은 세로선) 는 끈다 — 538 과 같다
}
})()

</script>
