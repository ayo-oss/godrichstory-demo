<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {

    // ── 541 공통 — 아르데코 대칭 계산 장면 (539 core 계승, 시트 줄 대신 각도 분할·경로 접기·축 대칭)

    const rootEl = root;

    let headEl = null;

    // cdfInvert — 역누적분포 샘플링. r^expo: expo>1 이면 짧은 쪽(마지막 줄)으로 몰린다

    let piNow = 0;

    // ── 541-01 부챗살 프레임 — ribAngle(i) = 180×(i+1)/(RIB_N+1) 로 반원 위의 각도를 나눈다.

    //    가장자리로 갈수록 선형 보간으로 좁아진다 — 폭을 각도로 계산해 선 두께(px) 로 바꾼다.

    //    계산해 그려진다(속성 트윈 아님). 겹침은 바깥 고리 먼저. 회차 셋(변형 3): RIB_N 12 → 4
    const RIB_N = 12;         // 변형 3: 12 → 4
    const RIB_N_VAR = 4;      // 변형 3 의 값 (화살표로 넘어간 회차)
    const R_OUT = 112;        // 바깥 쪽 살의 끝 반경 (헤더 띠 아래까지)
    const R_MID = 72;         // 바깥·안쪽 고리의 경계 반경
    const R_IN = 40;          // 안쪽 쪽 살의 시작 반경
    const W_MAX = 4.2;        // 가운데 살의 각도 폭 (deg) — 선 두께로 환산된다
    const W_MIN = 1.1;        // 가장자리 살의 각도 폭 (deg)

    const FAN_CX = 134;       // 반원 원점의 x (scene 안)

    let ribs = [];            // { el, len, w, i }
    let fanSvg = null;

    let shineEl = null;
    let axisEl = null;
    let hubEl = null;
    let chipEls = [];

    // ribWidth — 살 i 의 각도 폭 (deg). 가운데((n-1)/2) 에서 W_MAX, 가장자리에서 W_MIN. 선형 보간

    function mkSvg() {

    // buildFan — curRibN 개의 살을 바깥 고리·안쪽 고리 두 겹으로 만든다.
    // 살 = 반경 r0 에서 r1 까지의 선. 선 두께 = ribWidth × 반경 × π/180 (각도 폭을 px 로 환산)

    function frame(t) {

        const kr = springK((t - T_RISE0) / T_RISE);
        const rise = kr * 8;
        posterEl.style.transform = 'translateY(' + f2(-rise) + 'px)';
        const shY = 4 + kr * 10;
        const shB = 8 + kr * 18;
        const shA = 0.16 - kr * 0.08;
        posterEl.style.boxShadow = '0 ' + f0(shY) + 'px ' + f0(shB) + 'px rgba(23, 20, 26, ' + f2(shA) + ')';
        // 살 그리기 — 넓은 살(oi 작은 것)부터 좁은 살까지. 바깥 고리 전부를 먼저, 그 다음 안쪽 고리
        let drawn = 0;
        const total = n * 2;
        const drawTotal = total * T_PER;
        for (let r = 0; r < ribs.length; r += 1) {
            const rb = ribs[r];
            const seq = rb.ring * n + rb.oi;
            const k = (t - T_DRAW0 - seq * T_PER) / T_PER;
            const kk = easeOutC(k);
            rb.el.setAttribute('stroke-dashoffset', f1(100 * (1 - kk)));

        }
        // 광택 — 다 그린 뒤 부챗살 위를 왼쪽에서 오른쪽으로 쓸고 지나간다 (translateX 만)
        const ksh = (t - T_SWEEP) / 360;
        shineEl.style.transform = 'translateX(' + f1(ksh > 0 ? (easeOutC(ksh) * (268 + 120) - 120) : -120) + 'px)';
        shineEl.style.opacity = ksh > 0 && ksh < 1 ? '1' : '0';
        // 중심축·허브 — 살이 다 그려진 만큼 축이 자라고 허브가 통통 튀며 커진다
        const ka = clamp((t - T_DRAW0) / drawTotal, 0, 1);
        axisEl.style.transform = 'scaleY(' + f2(easeOutC(ka)) + ')';
        const kh = springK((t - T_DRAW0 - drawTotal) / 260);
        hubEl.style.transform = 'scale(' + f2(kh) + ')';
        hubEl.style.opacity = kh > 0 ? '1' : '0';
        // 칩 — RIB_N·ribAngle·drawn
        if (chipEls.length === 3) {
            const di = Math.min(drawn % n, n - 1);
            chipEls[0].textContent = 'RIB_N ' + f0(n);
            chipEls[1].textContent = 'ribAngle(' + f0(di) + ') = ' + f1(ribAngle(di, n)) + '°';
            chipEls[2].textContent = 'drawn ' + f0(drawn) + ' / ' + f0(total);
        }
        return fill('부챗살 {a}/{b} · RIB_N {c} · 180°/{d}',
            f0(drawn), f0(total), f0(n), f0(n + 1));
    }
    function build(i) {
        curRibN = (i === 2) ? RIB_N_VAR : RIB_N;
        clearAll();
        mkPoster();
        buildFan();
        chipEls = [];
        for (let c = 0; c < 3; c += 1) {
            const e = make('b', 'ov ovs', sceneEl);
            put(e, 276, 12 + c * 28, 0, 0);
            chipEls.push(e);
        }
        const ov = make('b', 'ov', sceneEl);
        put(ov, 276, 108, 0, 0);
        ov.textContent = 'ribAngle(i) = 180·(i+1)/(N+1)';
        drawRows([spanOf(0, T_RISE0, 0), spanOf(T_RISE0, T_RISE, 2), spanOf(T_DRAW0, curRibN * 2 * T_PER, 1), spanOf(T_SWEEP, 360, 2)], 2000);
        axis(2000);
        setReads(fill('부챗살 프레임 — RIB_N {a} · ribAngle · drawn', f0(curRibN)),
            '반원 위를 각도로 나눠 넓은 살부터 좁은 살까지 차오른다');
        doneP.textContent = '';
        return 2000;
    }

    return run({ count: 3, build: build, frame: frame, head: false });   // 차트 재생 헤드(검은 세로선) 는 끈다 — 538 과 같다
}
})()

</script>
