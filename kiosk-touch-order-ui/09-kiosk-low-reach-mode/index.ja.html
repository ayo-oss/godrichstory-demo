<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>低い画面モード — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lr is-demo" id="lr">
  <div class="lr__frame">
    <p class="lr__title">メニューを選ぶ</p>
    <div class="lr__body">
      <ul class="lr__group" id="group">
        <li><button type="button" class="lr__btn"><span class="lr__label">注文する</span></button></li>
        <li><button type="button" class="lr__btn"><span class="lr__label">カート</span></button></li>
        <li><button type="button" class="lr__btn"><span class="lr__label">スタッフを呼ぶ</span></button></li>
      </ul>
    </div>
    <div class="lr__foot">
      <button type="button" class="lr__toggle" id="toggle" aria-pressed="false">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="lr__ico" aria-hidden="true"><path d="M128,48a24,24,0,1,1-24-24A24,24,0,0,1,128,48Z" opacity="0.2"/><path d="M255.59,189.47a8,8,0,0,0-10.12-5.06l-17.42,5.81-28.9-57.8A8,8,0,0,0,192,128H112V104h56a8,8,0,0,0,0-16H112V79a32,32,0,1,0-16,0V89.81A72,72,0,0,0,112,232c33.52,0,63.69-22.71,71.75-54a8,8,0,1,0-15.5-4C162.09,198,137.91,216,112,216A56,56,0,0,1,96,106.34V136a8,8,0,0,0,8,8h83.05l29.79,59.58a8,8,0,0,0,9.69,4l24-8A8,8,0,0,0,255.59,189.47ZM88,48a16,16,0,1,1,16,16A16,16,0,0,1,88,48Z"/></svg>
        <span class="lr__toggleLabel">低い画面</span>
      </button>
    </div>
  </div>
</div>
</main>
<script>
// 低い画面 모드 — 버튼 묶음이 화면 위쪽에서 아래쪽으로 통째로 내려앉고 글자가 한 단계 커진다.
// 앉은 눈높이에 맞추는 것이 목적이라 누르는 칸의 높이는 그대로 둔다 (글자만 커진다).
// 미리보기 루프(.is-demo)는 CSS 키프레임이고, 사람이 전환 버튼을 누르면 여기서 루프를 떼고
// is-low 클래스와 aria-pressed 를 뒤집는다 — 내려앉는 움직임은 그때부터 transition 이 맡는다.
var lr = document.getElementById('lr');
var toggle = document.getElementById('toggle');

function setLow(on) {
  lr.classList.remove('is-demo');
  lr.classList.toggle('is-low', on);
  toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
}

// <button> 은 클릭과 Enter·Space 가 모두 click 으로 온다 — 키보드 경로를 따로 둘 필요가 없다
toggle.addEventListener('click', function () {
  setLow(toggle.getAttribute('aria-pressed') !== 'true');
});
</script>
</body>
</html>
