<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세트 권유 칸 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ku is-demo" id="ku">
  <p class="ku__order" id="orderLine">아메리카노 1개</p>
  <div class="ku__sheet" id="sheet">
    <p class="ku__title">세트로 올릴까요</p>
    <div class="ku__combo">
      <span class="ku__items">아메리카노 + 감자튀김</span>
      <span class="ku__diff" aria-label="세트 차액 +1,500원">
        <span class="ku__odo" aria-hidden="true"><span class="ku__roll"><b>+300</b><b>+600</b><b>+900</b><b>+1,200</b><b>+1,500</b></span></span>
        <b class="ku__won" aria-hidden="true">원</b>
      </span>
    </div>
    <div class="ku__btns">
      <button type="button" class="ku__btn ku__btn--yes" id="yes">세트로 담기</button>
      <button type="button" class="ku__btn ku__btn--no" id="no">단품 그대로</button>
    </div>
  </div>
  <p class="ku__sum" id="sum" tabindex="-1" aria-live="polite">합계 4,500원</p>
</div>
</main>
<script>
var ku = document.getElementById('ku');
var sheet = document.getElementById('sheet');
var orderLine = document.getElementById('orderLine');
var sum = document.getElementById('sum');
var yes = document.getElementById('yes');
var no = document.getElementById('no');

// 권유 칸의 주장은 "거절 버튼을 작게 만들지 않는다" 다. 두 버튼은 같은 1fr 칸에 width:100% 로 서므로
// 어느 쪽을 고르든 손가락이 닿는 넓이가 같다. 고르고 나면 카드만 닫히고 주문 줄과 합계는 남는다.
var SUM_LABEL = '합계 {n}원';
var SINGLE_LINE = '아메리카노 1개';
var COMBO_LINE = '아메리카노 세트 1개';
var BASE = 4500;
var DIFF = 1500;

function money(n) {
  return String(n).replace(/\B(?=(\d{3})+$)/g, ',');
}

function settle(add) {
  ku.classList.remove('is-demo');
  var total = BASE + (add ? DIFF : 0);
  orderLine.textContent = add ? COMBO_LINE : SINGLE_LINE;
  sum.textContent = SUM_LABEL.replace('{n}', money(total));
  sheet.hidden = true;
  sum.focus({ preventScroll: true });
}

yes.addEventListener('click', function () { settle(true); });
no.addEventListener('click', function () { settle(false); });
</script>
</body>
</html>
