<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu tiles and the sold-out cell — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mt is-demo" id="mt">
  <ul class="mt__grid" aria-label="Pick a menu">
    <li class="mt__cell"><button type="button" class="mt__tile mt__tile--1">
      <span class="mt__name">Americano</span><span class="mt__price">4,000 won</span>
    </button></li>
    <li class="mt__cell"><button type="button" class="mt__tile mt__tile--2">
      <span class="mt__name">Caffe latte</span><span class="mt__price">4,500 won</span>
    </button></li>
    <li class="mt__cell"><button type="button" class="mt__tile mt__tile--3">
      <span class="mt__name">Vanilla latte</span><span class="mt__price">5,000 won</span>
    </button></li>
    <li class="mt__cell"><button type="button" class="mt__tile mt__tile--4">
      <span class="mt__name">Choco cookie</span><span class="mt__price">3,000 won</span>
    </button></li>
    <li class="mt__cell"><button type="button" class="mt__tile mt__tile--out" id="out" aria-disabled="true">
      <span class="mt__band" aria-hidden="true"></span>
      <span class="mt__name">Strawberry latte</span><span class="mt__price">5,500 won</span>
      <span class="mt__stamp">Sold out</span>
    </button></li>
    <li class="mt__cell"><button type="button" class="mt__tile mt__tile--6">
      <span class="mt__name">Iced tea</span><span class="mt__price">4,000 won</span>
    </button></li>
  </ul>
  <p class="mt__bag" id="bag" aria-live="polite">In cart: 0</p>
</div>
</main>
<script>
var mt = document.getElementById('mt');
var bag = document.getElementById('bag');
var tiles = [].slice.call(document.querySelectorAll('.mt__tile'));
var BAG_LABEL = 'In cart: {n}';
var picked = 0;

// Sold out 칸은 disabled 속성 대신 aria-disabled 로 표시한다. disabled 를 주면 Tab 이 그 칸을 건너뛰어
// "왜 못 누르는지" 를 읽어 줄 기회가 사라진다 — 포커스는 남기고 담기만 여기 한 줄로 막는다.
function add(tile) {
  if (tile.getAttribute('aria-disabled') === 'true') return;
  mt.classList.remove('is-demo');
  picked += 1;
  bag.textContent = BAG_LABEL.replace('{n}', picked);
  tile.classList.add('is-tapped');
  setTimeout(function () { tile.classList.remove('is-tapped'); }, 180);
}

tiles.forEach(function (tile) {
  // 버튼이라 Enter·Space 도 click 으로 들어온다 — 키보드 경로를 따로 만들지 않는다.
  tile.addEventListener('click', function () { add(tile); });
});
</script>
</body>
</html>
