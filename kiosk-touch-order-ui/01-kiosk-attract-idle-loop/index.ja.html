<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待機画面 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ka is-demo" id="ka">
  <button type="button" class="ka__attract" id="attract" aria-label="画面を押して注文を始めてください">
    <span class="ka__promo" aria-hidden="true">
      <span class="ka__slide ka__slide--a"><b class="ka__big">20%</b><i class="ka__sub">本日のコーヒー割引</i></span>
      <span class="ka__slide ka__slide--b"><b class="ka__big">NEW</b><i class="ka__sub">季節のラテが登場</i></span>
      <span class="ka__slide ka__slide--c"><b class="ka__big">TO GO</b><i class="ka__sub">テイクアウトもここで</i></span>
    </span>
    <span class="ka__bar" aria-hidden="true"><i class="ka__fill"></i></span>
    <span class="ka__cta">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="ka__ico" aria-hidden="true"><path d="M216,148v36c0,24-8,40-8,40H72L42.68,174a20,20,0,0,1,34.64-20L96,184V76a20,20,0,0,1,40,0v56a20,20,0,0,1,40,0v16a20,20,0,0,1,40,0Z" opacity="0.2"/><path d="M56,76a60,60,0,0,1,120,0,8,8,0,0,1-16,0,44,44,0,0,0-88,0,8,8,0,1,1-16,0Zm140,44a27.9,27.9,0,0,0-13.36,3.39A28,28,0,0,0,144,106.7V76a28,28,0,0,0-56,0v80l-3.82-6.13a28,28,0,0,0-48.41,28.17l29.32,50A8,8,0,1,0,78.89,220L49.6,170a12,12,0,1,1,20.78-12l.14.23,18.68,30A8,8,0,0,0,104,184V76a12,12,0,0,1,24,0v68a8,8,0,1,0,16,0V132a12,12,0,0,1,24,0v20a8,8,0,0,0,16,0v-4a12,12,0,0,1,24,0v36c0,21.61-7.1,36.3-7.16,36.42a8,8,0,0,0,3.58,10.73A7.9,7.9,0,0,0,208,232a8,8,0,0,0,7.16-4.42c.37-.73,8.85-18,8.85-43.58V148A28,28,0,0,0,196,120Z"/></svg>
      <span class="ka__ctaText">画面を押して注文を始めてください</span>
    </span>
  </button>
  <div class="ka__order" id="order" hidden>
    <p class="ka__head" id="head" tabindex="-1">何になさいますか</p>
    <ul class="ka__tiles">
      <li><button type="button" class="ka__tile">コーヒー</button></li>
      <li><button type="button" class="ka__tile">紅茶</button></li>
      <li><button type="button" class="ka__tile">デザート</button></li>
      <li><button type="button" class="ka__tile">セット</button></li>
    </ul>
    <button type="button" class="ka__back" id="back">最初の画面へ</button>
  </div>
</div>
</main>
<script>
var ka = document.getElementById('ka');
var attract = document.getElementById('attract');
var order = document.getElementById('order');
var back = document.getElementById('back');
var head = document.getElementById('head');

// 유휴 화면은 "아무도 안 만질 때 스스로 도는 화면"이다. 손이 닿는 순간 광고를 멈추고 주문 화면으로 넘긴다.
// 미리보기 루프(.is-demo)는 CSS 키프레임이 돌리고, 사람이 누르면 여기서 루프를 떼고 화면을 바꾼다.
function start() {
  ka.classList.remove('is-demo');
  attract.hidden = true;
  order.hidden = false;
  head.focus({ preventScroll: true });
}

function home() {
  order.hidden = true;
  attract.hidden = false;
  attract.focus({ preventScroll: true });
}

attract.addEventListener('click', start);
back.addEventListener('click', function (e) { e.stopPropagation(); home(); });
</script>
</body>
</html>
