<script>
var kr = document.getElementById('kr');
var krTabs = [].slice.call(document.querySelectorAll('.kr__tab'));

// 세로 카테고리 레일. 고른 칸은 data-sel 한 곳으로 표시하고, 선택 블록의 위치와 오른쪽 패널은
// 그 값 하나를 보고 CSS 가 그린다 (미리보기 루프 .is-demo 는 같은 자리를 키프레임으로 돌린다).
// 레일은 role="tablist" aria-orientation="vertical" 이라 위아래 화살표가 표준 조작이다.
function krSelect(idx, moveFocus) {
  kr.classList.remove('is-demo');
  kr.setAttribute('data-sel', String(idx + 1));
  for (var i = 0; i < krTabs.length; i++) {
    var on = i === idx;
    krTabs[i].setAttribute('aria-selected', on ? 'true' : 'false');
    // 로빙 탭인덱스 — 레일 전체가 Tab 한 번에 들어오고, 안에서는 화살표로 옮긴다
    krTabs[i].setAttribute('tabindex', on ? '0' : '-1');
  }
  if (moveFocus) { krTabs[idx].focus({ preventScroll: true }); }
}

for (var i = 0; i < krTabs.length; i++) {
  krTabs[i].addEventListener('click', function (e) {
    krSelect(krTabs.indexOf(e.currentTarget), false);
  });
}

document.getElementById('krTabs').addEventListener('keydown', function (e) {
  var at = krTabs.indexOf(e.target);
  if (at < 0) { return; }
  var to = at;
  if (e.key === 'ArrowDown') { to = (at + 1) % krTabs.length; }
  else if (e.key === 'ArrowUp') { to = (at - 1 + krTabs.length) % krTabs.length; }
  else if (e.key === 'Home') { to = 0; }
  else if (e.key === 'End') { to = krTabs.length - 1; }
  else { return; }
  e.preventDefault();
  krSelect(to, true);
});
</script>
