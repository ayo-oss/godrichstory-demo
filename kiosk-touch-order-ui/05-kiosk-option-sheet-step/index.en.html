<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stepped option sheet — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ko is-demo" id="ko">
  <p class="ko__menu">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="ko__ico" aria-hidden="true"><path d="M208,88v48a88,88,0,0,1-51.3,80H83.3A88,88,0,0,1,32,136V88Z" opacity="0.2"/><path d="M80,56V24a8,8,0,0,1,16,0V56a8,8,0,0,1-16,0Zm40,8a8,8,0,0,0,8-8V24a8,8,0,0,0-16,0V56A8,8,0,0,0,120,64Zm32,0a8,8,0,0,0,8-8V24a8,8,0,0,0-16,0V56A8,8,0,0,0,152,64Zm96,56v8a40,40,0,0,1-37.51,39.91,96.59,96.59,0,0,1-27,40.09H208a8,8,0,0,1,0,16H32a8,8,0,0,1,0-16H56.54A96.3,96.3,0,0,1,24,136V88a8,8,0,0,1,8-8H208A40,40,0,0,1,248,120ZM200,96H40v40a80.27,80.27,0,0,0,45.12,72h69.76A80.27,80.27,0,0,0,200,136Zm32,24a24,24,0,0,0-16-22.62V136a95.78,95.78,0,0,1-1.2,15A24,24,0,0,0,232,128Z"/></svg>
    <span class="ko__name">Americano</span>
    <b class="ko__price">4,200 won</b>
  </p>

  <div class="ko__sheet" id="sheet">
    <span class="ko__steps" aria-hidden="true">
      <i class="ko__seg ko__seg--1"></i>
      <i class="ko__seg ko__seg--2"></i>
    </span>

    <div class="ko__panes">
      <section class="ko__pane ko__pane--1" id="pane1">
        <h2 class="ko__title">Choose a size</h2>
        <div class="ko__opts" role="radiogroup" aria-label="Size" data-group="size">
          <button type="button" class="ko__opt" role="radio" aria-checked="false" data-v="Small">Small</button>
          <button type="button" class="ko__opt is-on" role="radio" aria-checked="true" data-v="Medium">Medium</button>
          <button type="button" class="ko__opt" role="radio" aria-checked="false" data-v="Large">Large</button>
        </div>
      </section>
      <section class="ko__pane ko__pane--2" id="pane2">
        <h2 class="ko__title">Choose hot or iced</h2>
        <div class="ko__opts" role="radiogroup" aria-label="Temperature" data-group="temp">
          <button type="button" class="ko__opt is-on" role="radio" aria-checked="true" data-v="Hot">Hot</button>
          <button type="button" class="ko__opt" role="radio" aria-checked="false" data-v="Iced">Iced</button>
        </div>
      </section>
    </div>

    <div class="ko__nav">
      <button type="button" class="ko__back" id="back">Back</button>
      <button type="button" class="ko__next" id="next">
        <span>Next</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="ko__caret" aria-hidden="true"><path d="M176,128,96,208V48Z" opacity="0.2"/><path d="M181.66,122.34l-80-80A8,8,0,0,0,88,48V208a8,8,0,0,0,13.66,5.66l80-80A8,8,0,0,0,181.66,122.34ZM104,188.69V67.31L164.69,128Z"/></svg>
      </button>
    </div>
  </div>
</div>
</main>
<script>
var ko = document.getElementById('ko');
var back = document.getElementById('back');
var next = document.getElementById('next');
var panes = [document.getElementById('pane1'), document.getElementById('pane2')];
var step = 0;

// 시트는 걸음마다 옵션 줄만 갈아 끼운다. 고른 값은 걸음을 오가도 버리지 않는다 —
// 라디오 상태를 DOM 에 그대로 두고 보이는 칸만 바꾸기 때문이다.
var picks = { size: 'Medium', temp: 'Hot' };

function paint() {
  ko.classList.toggle('is-step2', step === 1);
  for (var i = 0; i < panes.length; i++) {
    panes[i].setAttribute('aria-hidden', i === step ? 'false' : 'true');
  }
  back.disabled = step === 0;
  next.disabled = step === panes.length - 1;
}

function go(to) {
  ko.classList.remove('is-demo');
  step = Math.max(0, Math.min(panes.length - 1, to));
  paint();
  var first = panes[step].querySelector('[aria-checked="true"]') || panes[step].querySelector('.ko__opt');
  if (first) { first.focus({ preventScroll: true }); }
}

function pick(group, btn) {
  ko.classList.remove('is-demo');
  var opts = btn.parentNode.querySelectorAll('.ko__opt');
  for (var i = 0; i < opts.length; i++) {
    var on = opts[i] === btn;
    opts[i].setAttribute('aria-checked', on ? 'true' : 'false');
    opts[i].classList.toggle('is-on', on);
    opts[i].tabIndex = on ? 0 : -1;
  }
  picks[group] = btn.getAttribute('data-v');
}

var groups = ko.querySelectorAll('.ko__opts');
for (var g = 0; g < groups.length; g++) {
  (function (box) {
    var group = box.getAttribute('data-group');
    var opts = box.querySelectorAll('.ko__opt');
    for (var i = 0; i < opts.length; i++) {
      opts[i].tabIndex = opts[i].getAttribute('aria-checked') === 'true' ? 0 : -1;
      opts[i].addEventListener('click', function () { pick(group, this); });
    }
    // 라디오 묶음은 화살표로 옮겨 다닌다 — Tab 은 묶음 하나에 한 번만 들어온다
    box.addEventListener('keydown', function (e) {
      var list = Array.prototype.slice.call(opts);
      var at = list.indexOf(document.activeElement);
      var d = 0;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { d = 1; }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { d = -1; }
      else { return; }
      e.preventDefault();
      var to = list[(at + d + list.length) % list.length];
      pick(group, to);
      to.focus({ preventScroll: true });
    });
  })(groups[g]);
}

back.addEventListener('click', function () { go(step - 1); });
next.addEventListener('click', function () { go(step + 1); });
paint();
</script>
</body>
</html>
