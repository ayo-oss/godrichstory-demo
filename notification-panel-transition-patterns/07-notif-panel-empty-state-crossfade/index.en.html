<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification panel that turns into an empty state after clearing all — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="es is-demo" id="es">
    <div class="es__head">
      <span class="es__headLabel">Notifications</span>
      <button class="es__clear" id="esClear" type="button">Clear all</button>
    </div>
    <div class="es__body" id="esBody">
      <ul class="es__list" id="esList" role="list"></ul>
      <div class="es__empty" id="esEmpty" hidden>
        <svg class="es__trayIc" viewBox="0 0 256 256" aria-hidden="true" focusable="false">
          <g fill="currentColor">
            <path opacity=".2" d="M216 48v112h-36.69a8 8 0 0 0-5.66 2.34l-19.31 19.32a8 8 0 0 1-5.66 2.34h-41.37a8 8 0 0 1-5.66-2.34l-19.31-19.32a8 8 0 0 0-5.66-2.34H40V48a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8"/>
            <path d="M208 32H48a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 16v104h-28.7a15.86 15.86 0 0 0-11.3 4.69L148.69 176h-41.38L88 156.68A15.9 15.9 0 0 0 76.69 152H48V48Zm0 160H48v-40h28.69L96 187.32a15.9 15.9 0 0 0 11.31 4.68h41.38a15.86 15.86 0 0 0 11.31-4.69L179.31 168H208z"/>
          </g>
        </svg>
        <p class="es__emptyText">No notifications yet</p>
        <button class="es__refill" id="esRefill" type="button">Get a new notification</button>
      </div>
    </div>
    <p class="es__sr" id="esSr" aria-live="polite"></p>
  </div>
</main>
<script>
(function () {
  "use strict";

  var NAMES = [
    "Payment approved", "New comment added", "Meeting starts in 10 minutes", "Upload finished"
  ];

  var root = document.getElementById("es");
  var list = document.getElementById("esList");
  var empty = document.getElementById("esEmpty");
  var body = document.getElementById("esBody");
  var sr = document.getElementById("esSr");
  var clearBtn = document.getElementById("esClear");
  var refillBtn = document.getElementById("esRefill");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var synthetic = false;
  function human() {
    if (synthetic) return;
    if (root.classList.contains("is-demo")) root.classList.remove("is-demo");
  }

  function makeRow(name) {
    var li = document.createElement("li");
    li.className = "es__item";
    li.setAttribute("role", "listitem");
    li.textContent = name;
    return li;
  }

  function fill() {
    list.innerHTML = "";
    NAMES.forEach(function (name) { list.appendChild(makeRow(name)); });
  }
  fill();

  // 계산 겹: 목록 → 빈 상태 전환은 투명도만 바꾸지 않는다. 목록은 살짝 위로 이동하며
  // 사라지고 빈 상태 그림은 아래에서 올라오며 나타나도록 opacity 와 transform(translateY)
  // 을 함께 바꿔, 정지 사진 한 장만으로는 두 상태가 섞인 유령 프레임처럼 보이지 않게 한다.
  function showEmpty() {
    empty.removeAttribute("hidden");
    requestAnimationFrame(function () {
      list.classList.add("es__list--out");
      empty.classList.add("es__empty--in");
    });
    window.setTimeout(function () {
      list.setAttribute("hidden", "");
    }, reduce ? 0 : 260);
    clearBtn.disabled = true;
    sr.textContent = "No notifications yet";
  }

  function showList() {
    fill();
    list.removeAttribute("hidden");
    requestAnimationFrame(function () {
      list.classList.remove("es__list--out");
      empty.classList.remove("es__empty--in");
    });
    window.setTimeout(function () {
      empty.setAttribute("hidden", "");
    }, reduce ? 0 : 260);
    clearBtn.disabled = false;
    sr.textContent = NAMES.length + " notifications received";
  }

  clearBtn.addEventListener("click", function () {
    human();
    if (clearBtn.disabled) return;
    showEmpty();
  });
  refillBtn.addEventListener("click", function () {
    human();
    showList();
  });

  if (reduce) {
    showEmpty();
  } else {
    var phase = "clear";
    function loop() {
      if (!root.classList.contains("is-demo")) return;
      synthetic = true;
      if (phase === "clear") { showEmpty(); phase = "fill"; } else { showList(); phase = "clear"; }
      synthetic = false;
      window.setTimeout(loop, 1600);
    }
    window.setTimeout(loop, 700);
  }
})();
</script>
</body>
</html>
