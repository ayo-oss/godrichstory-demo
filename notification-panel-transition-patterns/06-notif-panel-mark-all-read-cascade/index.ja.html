<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全既読が順番に広がる通知リスト — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ma is-demo" id="ma">
    <div class="ma__head">
      <span class="ma__headLabel">通知 <span id="maCount">5</span></span>
      <button class="ma__all" id="maAllBtn" type="button">
        <svg class="ma__checkIc" viewBox="0 0 256 256" aria-hidden="true" focusable="false">
          <g fill="currentColor">
            <path opacity=".2" d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16"/>
            <path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/>
          </g>
        </svg>
        すべて既読
      </button>
    </div>
    <ul class="ma__list" id="maList" role="list"></ul>
    <p class="ma__sr" id="maSr" aria-live="polite"></p>
  </div>
</main>
<script>
(function () {
  "use strict";

  var NOTIF_MARK_ALL_STAGGER_MS = 70; // 모두 읽음을 눌렀을 때 항목 순번마다 이 값씩 늦게 번진다

  var NAMES = [
    "決済が承認されました", "新しいコメントが付きました", "会議まであと10分です",
    "アップロードが完了しました", "招待状が届きました"
  ];

  var root = document.getElementById("ma");
  var list = document.getElementById("maList");
  var sr = document.getElementById("maSr");
  var countEl = document.getElementById("maCount");
  var allBtn = document.getElementById("maAllBtn");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var synthetic = false;
  function human() {
    if (synthetic) return;
    if (root.classList.contains("is-demo")) root.classList.remove("is-demo");
  }

  var rows = [];

  NAMES.forEach(function (name, i) {
    var li = document.createElement("li");
    li.className = "ma__item";
    li.setAttribute("role", "listitem");

    var tint = document.createElement("span");
    tint.className = "ma__itemTint";
    tint.setAttribute("aria-hidden", "true");

    var dot = document.createElement("span");
    dot.className = "ma__dot";
    var fill = document.createElement("span");
    fill.className = "ma__dotFill";
    var ring = document.createElement("span");
    ring.className = "ma__dotRing";
    dot.appendChild(fill);
    dot.appendChild(ring);

    var nameEl = document.createElement("span");
    nameEl.className = "ma__name";
    nameEl.textContent = name;

    li.appendChild(tint);
    li.appendChild(dot);
    li.appendChild(nameEl);
    list.appendChild(li);
    rows.push({ li: li, tint: tint, fill: fill, ring: ring, read: false });
  });

  function updateCount() {
    var unread = rows.filter(function (r) { return !r.read; }).length;
    countEl.textContent = String(unread);
  }

  function resetAll() {
    rows.forEach(function (r) {
      r.read = false;
      r.fill.style.transitionDelay = "0ms";
      r.ring.style.transitionDelay = "0ms";
      r.tint.style.transitionDelay = "0ms";
      r.li.style.transitionDelay = "0ms";
      r.fill.style.opacity = "1";
      r.ring.style.borderWidth = "0px";
      r.tint.style.opacity = ".12";
      r.li.style.borderLeftWidth = "3px";
    });
    updateCount();
  }

  // 계산 겹: 각 항목의 순번(index)에 NOTIF_MARK_ALL_STAGGER_MS 를 곱한 값을 그 항목의
  // transitionDelay 로 걸어둔 뒤 한꺼번에 목표 상태를 바꾼다 — 항목 수가 늘면 번지는 시간도
  // 그만큼 함께 늘어난다(하드코딩된 총 시간이 아니라 항목 수 x 간격으로 계산한다). 같은 지연값을
  // 행 톤(tint)·좌측 굵기(border-left)에도 걸어 점 하나가 아니라 행 전체가 캐스케이드로 보인다.
  function markAllRead() {
    rows.forEach(function (r, i) {
      if (r.read) return;
      var delay = reduce ? 0 : i * NOTIF_MARK_ALL_STAGGER_MS;
      r.fill.style.transitionDelay = delay + "ms";
      r.ring.style.transitionDelay = delay + "ms";
      r.tint.style.transitionDelay = delay + "ms";
      r.li.style.transitionDelay = delay + "ms";
      r.read = true;
      r.fill.style.opacity = "0";
      r.ring.style.borderWidth = "2.4px";
      r.tint.style.opacity = "0";
      r.li.style.borderLeftWidth = "0px";
    });
    updateCount();
    sr.textContent = "すべて既読にしました";
  }

  allBtn.addEventListener("click", function () {
    human();
    markAllRead();
  });
  allBtn.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      human();
      markAllRead();
    }
  });

  if (reduce) {
    markAllRead();
  } else {
    var phase = "mark";
    function loop() {
      if (!root.classList.contains("is-demo")) return;
      synthetic = true;
      if (phase === "mark") {
        markAllRead();
        phase = "reset";
        window.setTimeout(loop, rows.length * NOTIF_MARK_ALL_STAGGER_MS + 550);
      } else {
        resetAll();
        phase = "mark";
        window.setTimeout(loop, 700);
      }
      synthetic = false;
    }
    window.setTimeout(loop, 350);
  }
})();
</script>
</body>
</html>
