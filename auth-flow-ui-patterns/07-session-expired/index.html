<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세션 만료 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="card" id="card">
  <p class="eyebrow">세션 안내</p>
  <span class="badgeWrap">
    <span class="badge" id="badge" role="status">세션 만료</span>
  </span>
  <p class="message">세션이 끊긴 지 <span id="elapsedSeconds">0</span>초</p>
  <button type="button" class="btn" id="reloginBtn">다시 로그인</button>
</section>
</main>
<script>
// 세션 만료(07) — 세션이 끊긴 뒤 흐른 시간을 매 프레임 다시 구해(elapsedRatio),
// 그 값을 강조 곡선(INTENSITY_POW)에 태워 배지 배경을 paper 에서 error 로 채널 보간하고
// 재로그인 버튼을 중심에서 살짝 키운다. 실키·실서버 요청 없음 — 전부 클라이언트 시뮬레이션.
(function () {
  var INTENSITY_POW = 1; // 변형: 1 → 3
  var RAMP_MS = 1800;
  var CYCLE_MS = 2000;

  var badge = document.getElementById('badge');
  var elapsedSeconds = document.getElementById('elapsedSeconds');
  var btn = document.getElementById('reloginBtn');
  if (!badge || !elapsedSeconds || !btn) return;

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function hexToRgb(hex) {
    hex = String(hex).trim().replace('#', '');
    return [
      parseInt(hex.substring(0, 2), 16),
      parseInt(hex.substring(2, 4), 16),
      parseInt(hex.substring(4, 6), 16)
    ];
  }
  function elapsedRatio(t) { return clamp(t / RAMP_MS, 0, 1); }

  var cs = getComputedStyle(badge);
  var paperRgb = hexToRgb(cs.getPropertyValue('--paper'));
  var errorRgb = hexToRgb(cs.getPropertyValue('--error'));

  function apply(t) {
    var ratio = elapsedRatio(t);
    var intensity = Math.pow(ratio, INTENSITY_POW);

    var r = Math.round(paperRgb[0] + (errorRgb[0] - paperRgb[0]) * intensity);
    var g = Math.round(paperRgb[1] + (errorRgb[1] - paperRgb[1]) * intensity);
    var b = Math.round(paperRgb[2] + (errorRgb[2] - paperRgb[2]) * intensity);
    badge.style.backgroundColor = 'rgb(' + r + ',' + g + ',' + b + ')';
    badge.classList.toggle('isHot', intensity > 0.5);

    btn.style.transform = 'scale(' + (1 + intensity * 0.04) + ')';

    elapsedSeconds.textContent = String(Math.round(ratio * (RAMP_MS / 1000)));
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    apply(RAMP_MS);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
