<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 단계 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="wrap" id="wrap">
  <div class="track" id="track" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1" aria-label="Sign-up progress steps">
    <div class="bar" id="bar"></div>
  </div>
  <ol class="steps" id="steps">
    <li class="step is-active" id="step1"><span class="dot"></span><span class="label">Info</span></li>
    <li class="step" id="step2"><span class="dot"></span><span class="label">Verify</span></li>
    <li class="step" id="step3"><span class="dot"></span><span class="label">Terms</span></li>
    <li class="step" id="step4"><span class="dot"></span><span class="label">Done</span></li>
  </ol>
</section>
</main>
<script>
// 회원가입 단계(02) — 4단계 진행률을 계산해 막대 길이(scaleX)로 표시한다.
// STEP_TOTAL*STEP_MS = 2000ms 로 캡처창과 정확히 일치시켜 4단계가 전부 보이게 한다.
(function () {
  var track = document.getElementById('track');
  var bar = document.getElementById('bar');
  var stepIds = ['step1', 'step2', 'step3', 'step4'];
  var steps = stepIds.map(function (id) { return document.getElementById(id); });
  if (!track || !bar || steps.some(function (s) { return !s; })) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var STEP_TOTAL = 4;
  var STEP_MS = 500;
  var CYCLE_MS = STEP_TOTAL * STEP_MS;

  function apply(t) {
    var tt = t % CYCLE_MS;
    var idx = Math.min(Math.max(Math.floor(tt / STEP_MS), 0), STEP_TOTAL - 1);
    var current = idx + 1;
    // 단계 경계는 정수(1~4)로 딱딱 끊어 aria·라벨에 반영하되, 막대 자체는 단계 안의 경과분(0~1)을
    // 더해 매 프레임 조금씩 자라게 한다 — 계산 한 겹(보간)으로 실제 회원가입 진행바처럼 부드럽다.
    var within = (tt % STEP_MS) / STEP_MS;
    var ratio = (idx + within) / STEP_TOTAL;
    track.style.setProperty('--ratio', ratio.toFixed(4));
    track.setAttribute('aria-valuenow', String(current));
    steps.forEach(function (el, i) {
      if (i === idx) {
        el.classList.add('is-active');
      } else {
        el.classList.remove('is-active');
      }
    });
  }

  if (reduce) {
    apply(CYCLE_MS - 1);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    apply(ts - start);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
