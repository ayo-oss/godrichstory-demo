<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captcha widget — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="wrap" id="wrap">
  <p class="eyebrow">Human check</p>
  <div class="grid" id="grid">
    <div class="tile" data-index="0"></div>
    <div class="tile" data-index="1"></div>
    <div class="tile" data-index="2"></div>
    <div class="tile" data-index="3"></div>
    <div class="tile" data-index="4"></div>
    <div class="tile" data-index="5"></div>
    <div class="tile" data-index="6"></div>
    <div class="tile" data-index="7"></div>
    <div class="tile" data-index="8"></div>
  </div>
  <p class="hint">Match rate <span id="matchPercent">0</span>%</p>
  <button type="button" class="btn" id="submitBtn" disabled>Confirm</button>
</section>
</main>
<script>
// 캡차 위젯(08, 아이디어형) — 정답 칸(ANSWER)과 시간이 흐르며 자동으로 골라지는 칸(PICK_ORDER)을
// 매 프레임 다시 비교해 Match rate(matchRatio)을 구하고, 그 값이 기준(MATCH_THRESHOLD)을
// 넘어야 Confirm 버튼을 실제로 활성화한다. 실제 클릭 리스너는 넣지 않는다 — 자동 선택 시뮬레이션만.
// 실키·실서버 요청 없음.
(function () {
  var ANSWER = [1, 3, 5, 7];
  var PICK_ORDER = [1, 4, 3, 7, 5]; // 일부러 오답 4 를 포함한 고정 순서
  var PICK_MS = 350; // 5 * 350 = 1750
  var MATCH_THRESHOLD = 1; // 100% 일치해야 활성화
  var CYCLE_MS = 2000;

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  var tiles = Array.prototype.slice.call(document.querySelectorAll('.tile'));
  var matchPercent = document.getElementById('matchPercent');
  var submitBtn = document.getElementById('submitBtn');
  if (!tiles.length || !matchPercent || !submitBtn) return;

  function selectedSoFar(t) {
    var count = clamp(Math.floor(t / PICK_MS), 0, PICK_ORDER.length);
    return PICK_ORDER.slice(0, count);
  }

  function matchRatioOf(selected) {
    var hit = 0;
    for (var i = 0; i < ANSWER.length; i++) {
      if (selected.indexOf(ANSWER[i]) !== -1) hit += 1;
    }
    return clamp(hit / ANSWER.length, 0, 1);
  }

  function apply(t) {
    var selected = selectedSoFar(t);
    tiles.forEach(function (tile) {
      var idx = Number(tile.getAttribute('data-index'));
      tile.classList.toggle('isPicked', selected.indexOf(idx) !== -1);
    });
    var ratio = matchRatioOf(selected);
    matchPercent.textContent = String(Math.round(ratio * 100));
    submitBtn.disabled = ratio < MATCH_THRESHOLD;
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    apply(PICK_ORDER.length * PICK_MS);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
