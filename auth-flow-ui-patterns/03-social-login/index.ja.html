<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소셜 ログイン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="wrap" id="wrap">
  <p class="hint" id="hint">ログイン方法5個中 <span id="hintCount">2</span>個を表示中</p>
  <div class="tick" id="tick" aria-hidden="true"><div class="tickBar" id="tickBar"></div></div>
  <div class="row" id="row" style="--cols:2">
    <button type="button" class="btn" id="btn0">
      <span class="icon iconCircle" aria-hidden="true"></span>
      <span class="label">Provider A</span>
    </button>
    <button type="button" class="btn" id="btn1">
      <span class="icon iconSquare" aria-hidden="true"></span>
      <span class="label">Provider B</span>
    </button>
    <button type="button" class="btn is-hidden" id="btn2">
      <span class="icon iconTriangle" aria-hidden="true"></span>
      <span class="label">Provider C</span>
    </button>
    <button type="button" class="btn is-hidden" id="btn3">
      <span class="icon iconDiamond" aria-hidden="true"></span>
      <span class="label">Provider D</span>
    </button>
    <button type="button" class="btn is-hidden" id="btn4">
      <span class="icon iconStar" aria-hidden="true"></span>
      <span class="label">Provider E</span>
    </button>
  </div>
</section>
</main>
<script>
// 소셜 ログイン(03) — 제공자 개수가 시나리오에 따라 바뀔 때 그리드 열 수를 재계산한다.
// 브랜드 로고·브랜드명 없이 순수 CSS 도형 아이콘 + 가상명("Provider A" 류)만 사용.
(function () {
  var row = document.getElementById('row');
  var hintCount = document.getElementById('hintCount');
  var tickBar = document.getElementById('tickBar');
  var btnIds = ['btn0', 'btn1', 'btn2', 'btn3', 'btn4'];
  var btns = btnIds.map(function (id) { return document.getElementById(id); });
  if (!row || !hintCount || !tickBar || btns.some(function (b) { return !b; })) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var COUNTS = [2, 3, 4, 5, 3];
  var STEP_MS = 400;
  var CYCLE_MS = COUNTS.length * STEP_MS;

  function colsFor(n) {
    return n <= 3 ? n : Math.ceil(n / 2);
  }

  function apply(t) {
    var tt = t % CYCLE_MS;
    var idx = Math.min(Math.max(Math.floor(tt / STEP_MS), 0), COUNTS.length - 1);
    var n = COUNTS[idx];
    var cols = colsFor(n);
    row.style.setProperty('--cols', String(cols));
    hintCount.textContent = String(n);
    btns.forEach(function (btn, i) {
      if (i < n) {
        btn.classList.remove('is-hidden');
      } else {
        btn.classList.add('is-hidden');
      }
    });
    // 다음 개수 전환까지 남은 구간을 매 프레임 다시 계산해 가는 줄(계산 한 겹) —
    // 그리드 재배치가 갑자기 튀지 않고 다음 변화가 다가옴을 예고한다.
    var within = (tt % STEP_MS) / STEP_MS;
    tickBar.style.setProperty('--within', within.toFixed(4));
  }

  if (reduce) {
    apply(0);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    apply(ts - start);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
