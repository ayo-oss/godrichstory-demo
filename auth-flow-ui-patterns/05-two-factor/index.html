<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2단계 인증 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="panel">
  <p class="title" id="tfaTitle">2단계 인증 코드 입력</p>
  <div class="digitGroup" role="group" aria-labelledby="tfaTitle">
    <span class="digitBox" data-index="0"></span>
    <span class="digitBox" data-index="1"></span>
    <span class="digitBox" data-index="2"></span>
    <span class="digitBox" data-index="3"></span>
    <span class="digitBox" data-index="4"></span>
    <span class="digitBox" data-index="5"></span>
  </div>
  <label class="srOnly" for="otpProxy">인증 코드 6자리</label>
  <input class="srOnly" type="text" id="otpProxy" inputmode="numeric" autocomplete="one-time-code" tabindex="-1" value="">
  <button class="submit" type="button" id="confirmBtn" disabled aria-disabled="true">확인</button>
  <p class="hint">코드를 모두 입력하면 확인 버튼이 활성화됩니다</p>
</section>
</main>
<script>
// 2단계 인증(05) — 여섯 자리 칸 중 채워진 자리수를 매 프레임 다시 세어 전체 대비 채움 비율을
// 직접 구하고, 그 비율이 100%에 닿아야 확인 버튼의 불투명도와 눌림 가능 여부가 함께 바뀐다.
// 코드 자체는 mulberry32 고정 시드로 만든 데모용 가짜 값이며 실제 인증 서버와 무관하다.
(function () {
  var boxes = document.querySelectorAll('.digitBox');
  var proxy = document.getElementById('otpProxy');
  var confirmBtn = document.getElementById('confirmBtn');
  if (!boxes.length || !proxy || !confirmBtn) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var DIGITS = 6;
  var DIGIT_MS = 250; // 6 * 250 = 1500, 남는 500ms 는 완료 상태 유지
  var CYCLE_MS = 2000;

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var rand = mulberry32(42);
  var code = [];
  for (var i = 0; i < DIGITS; i++) code.push(Math.floor(rand() * 10));

  function filled(t) {
    return Math.min(Math.max(Math.floor(t / DIGIT_MS), 0), DIGITS);
  }

  function apply(t) {
    var n = filled(t);
    var ratio = n / DIGITS;
    for (var i = 0; i < DIGITS; i++) {
      var box = boxes[i];
      if (i < n) {
        box.textContent = String(code[i]);
        box.classList.add('filled');
      } else {
        box.textContent = '';
        box.classList.remove('filled');
      }
    }
    proxy.value = code.slice(0, n).join('');
    var ready = ratio >= 1;
    confirmBtn.disabled = !ready;
    confirmBtn.setAttribute('aria-disabled', String(!ready));
    confirmBtn.style.opacity = ready ? '1' : '.4';
  }

  var start = null;
  function frame(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(frame);
  }

  if (reduce) {
    apply(0);
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
