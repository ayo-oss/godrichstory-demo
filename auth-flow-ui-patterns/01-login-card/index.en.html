<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in 카드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="card" id="card">
  <div class="ring" id="ring">
    <div class="ringHole"></div>
    <div class="avatar" aria-hidden="true">
      <span class="lockBody"></span>
      <span class="lockShackle"></span>
    </div>
  </div>
  <h2 class="title">Log in</h2>
  <div class="fields">
    <label class="srOnly" for="loginEmail">Email</label>
    <input class="field" type="email" id="loginEmail" name="loginEmail" autocomplete="email" readonly value="" placeholder="you@example.com">
    <label class="srOnly" for="loginPw">Password</label>
    <input class="field" type="password" id="loginPw" name="loginPw" autocomplete="current-password" readonly value="">
  </div>
</section>
</main>
<script>
// Log in 카드(01) — 가짜 Email·비밀번호를 시드 없이 고정 시나리오로 자동 타이핑하고,
// 채운 비율(Email 진행 + Password 진행의 평균)을 매 프레임 카드 진행 링(conic-gradient)에 반영한다.
// 실키·실서버 요청 없음 — 전부 클라이언트 시뮬레이션.
(function () {
  var card = document.getElementById('card');
  var ring = document.getElementById('ring');
  var emailEl = document.getElementById('loginEmail');
  var pwEl = document.getElementById('loginPw');
  if (!card || !ring || !emailEl || !pwEl) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var SAMPLE_EMAIL = 'jordan@example.com';
  var EMAIL_LEN = SAMPLE_EMAIL.length;
  var SAMPLE_PW_LEN = 10;
  var PW_DOTS = '••••••••••';
  var TYPE_MS = 70;
  var CYCLE_MS = 2000;

  function frameFor(t) {
    var emailChars = Math.min(Math.max(Math.floor(t / TYPE_MS), 0), EMAIL_LEN);
    var pwStart = EMAIL_LEN * TYPE_MS;
    var pwChars = t > pwStart
      ? Math.min(Math.max(Math.floor((t - pwStart) / TYPE_MS), 0), SAMPLE_PW_LEN)
      : 0;
    return { emailChars: emailChars, pwChars: pwChars };
  }

  function apply(t) {
    var f = frameFor(t);
    emailEl.value = SAMPLE_EMAIL.slice(0, f.emailChars);
    pwEl.value = PW_DOTS.slice(0, f.pwChars);
    var ratio = ((f.emailChars / EMAIL_LEN) + (f.pwChars / SAMPLE_PW_LEN)) / 2;
    ring.style.setProperty('--ratio', ratio.toFixed(4));
  }

  if (reduce) {
    apply(CYCLE_MS);
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
