<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매직 링크 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="card">
  <p class="eyebrow">Magic link sent</p>
  <p class="recipient">Sent to you@example.com</p>
  <div class="ringWrap">
    <svg class="ringSvg" viewBox="0 0 96 96" aria-hidden="true">
      <circle class="ringTrack" cx="48" cy="48" r="44"></circle>
      <circle class="ringProgress" id="magicRing" cx="48" cy="48" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"></circle>
    </svg>
    <p class="time" id="magicTime">Time left 300s</p>
  </div>
  <p class="hint">Request a new one if it expires</p>
</section>
</main>
<script>
// 매직 링크(04) — 발송 시각으로부터 남은 유효시간을 매 프레임 새로 구해(누적하지 않음)
// 그 비율만큼 SVG 링의 stroke-dashoffset 을 다시 그린다. CSS keyframes 없이 rAF 로만 진행해
// 캡처 창(2s) 전체가 실제 경과 시간대로 기록되게 한다.
(function () {
  var ring = document.getElementById('magicRing');
  var timeText = document.getElementById('magicTime');
  if (!ring || !timeText) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var VALID_SEC = 300; // 변형: 300 → 900
  var CIRCUMFERENCE = 276.46;
  var CYCLE_MS = 2000;

  function ratio(t) {
    return 1 - Math.min(Math.max(t / CYCLE_MS, 0), 1);
  }

  function apply(t) {
    var r = ratio(t);
    var remainingDisplaySec = Math.ceil(r * VALID_SEC);
    ring.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - r));
    timeText.textContent = 'Time left' + ' ' + remainingDisplaySec + 's';
  }

  var start = null;
  function frame(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(frame);
  }

  if (reduce) {
    apply(0);
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
