<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パスワード 재설정 요청 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="card">
  <p class="title">パスワードをお忘れですか?</p>
  <p class="desc">メールアドレスを入力するとリセットリンクをお送りします</p>
  <div class="field">
    <label class="label" for="resetEmail">メールアドレス</label>
    <input class="input" type="email" id="resetEmail" autocomplete="email" aria-describedby="resetHint" aria-invalid="true" value="">
  </div>
  <p class="hint isNeutral" id="resetHint">メール形式を入力してください</p>
  <button class="submit" type="button" id="resetSubmit" disabled aria-disabled="true">リセットリンクをリクエスト</button>
</section>
</main>
<script>
// パスワード 재설정 요청(06) — 입력된 이메일의 글자 구성과 골뱅이·도메인 포함 여부를 매 프레임
// 다시 검사해 유효성 점수를 직접 계산하고, 그 점수로 요청 버튼의 활성화 여부와 힌트 색을 정한다.
// 이메일은 example.com 가상 주소가 타이핑되는 모습을 흉내낸 것이며 실제로 전송되지 않는다.
(function () {
  var input = document.getElementById('resetEmail');
  var hint = document.getElementById('resetHint');
  var submit = document.getElementById('resetSubmit');
  if (!input || !hint || !submit) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var SAMPLE = 'jordan@example.com';
  var TYPE_MS = 90;
  var SCORE_THRESHOLD = .9;
  var CYCLE_MS = 2000;

  function currentText(t) {
    var n = Math.min(Math.max(Math.floor(t / TYPE_MS), 0), SAMPLE.length);
    return SAMPLE.slice(0, n);
  }

  function score(text) {
    var domain = text.split('@')[1] || '';
    var s = 0;
    if (text.indexOf('@') !== -1) s += .4;
    if (/\.[a-z]{2,}$/i.test(domain)) s += .4;
    s += Math.min(text.length / 12, 1) * .2;
    return s;
  }

  function apply(t) {
    var text = currentText(t);
    var sc = score(text);
    var invalid = sc < SCORE_THRESHOLD;
    input.value = text;
    input.setAttribute('aria-invalid', String(invalid));
    submit.disabled = invalid;
    submit.setAttribute('aria-disabled', String(invalid));
    hint.classList.remove('isError', 'isNeutral', 'isValid');
    if (sc < .4) {
      hint.classList.add('isError');
      hint.textContent = 'メール形式をご確認ください';
    } else if (sc < SCORE_THRESHOLD) {
      hint.classList.add('isNeutral');
      hint.textContent = 'メールアドレスを最後まで入力してください';
    } else {
      hint.classList.add('isValid');
      hint.textContent = 'メール形式は正しいです';
    }
  }

  var start = null;
  function frame(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    apply(t);
    requestAnimationFrame(frame);
  }

  if (reduce) {
    apply(0);
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
