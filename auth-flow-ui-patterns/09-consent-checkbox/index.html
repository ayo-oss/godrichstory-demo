<!doctype html>
<html lang="ko">
<head>

<meta charset="utf-8">

<title>동의 체크박스 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="wrap">
  <p class="eyebrow">약관 동의</p>
  <div class="panel" id="panel" role="region" aria-label="약관 내용" tabindex="0">
    <p>이 자리 표시 문단은 실제 약관이 아닙니다.</p>
    <p>이 자리 표시 문단은 실제 약관이 아닙니다.</p>

    <p>이 자리 표시 문단은 실제 약관이 아닙니다.</p>
    <p>이 자리 표시 문단은 실제 약관이 아닙니다.</p>
    <p>이 자리 표시 문단은 실제 약관이 아닙니다.</p>
    <p>이 자리 표시 문단은 실제 약관이 아닙니다.</p>
  </div>
  <div class="consentRow">
    <input type="checkbox" id="consent" class="checkbox" disabled aria-disabled="true">
    <label for="consent" id="consentLabel" class="label">약관을 끝까지 확인해야 동의할 수 있습니다.</label>
  </div>
</section>
</main>
<script>
// 동의 체크박스(09, 아이디어형) — 약관 패널의 실제 scroll 이벤트로 진행률(progress)을 구해
// 기준(SCROLL_THRESHOLD)을 넘으면 체크박스를 활성화한다. 자동 재생 루프는 panel.scrollTop 을
// 매 프레임 직접 대입할 뿐이고, 그 대입이 브라우저의 진짜 scroll 이벤트를 발생시키므로
// 실사용자 스크롤과 이 onScroll 하나의 경로를 그대로 통과한다 — 별도 분기 없음.
// 실키·실서버 요청 없음.
(function () {
  var SCROLL_THRESHOLD = .7; // 변형: .7 → 1
  var RAMP_MS = 1500;
  var CYCLE_MS = 2000;
  var DONE_TEXT = '약관을 끝까지 확인했습니다.';

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  var panel = document.getElementById('panel');
  var checkbox = document.getElementById('consent');
  var label = document.getElementById('consentLabel');
  if (!panel || !checkbox || !label) return;

  var lockedText = label.textContent;
  var unlocked = false;

  function onScroll() {
    var maxScroll = panel.scrollHeight - panel.clientHeight;
    var progress = maxScroll > 0 ? clamp(panel.scrollTop / maxScroll, 0, 1) : 1;
    if (progress >= SCROLL_THRESHOLD && !unlocked) {
      unlocked = true;
      checkbox.disabled = false;
      checkbox.setAttribute('aria-disabled', 'false');
      label.textContent = DONE_TEXT;
    } else if (progress < SCROLL_THRESHOLD && unlocked) {
      unlocked = false;
      checkbox.disabled = true;
      checkbox.checked = false;
      checkbox.setAttribute('aria-disabled', 'true');
      label.textContent = lockedText;
    }
  }
  panel.addEventListener('scroll', onScroll);

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    panel.scrollTop = panel.scrollHeight;
    onScroll();
    return;
  }

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) % CYCLE_MS;
    var maxScroll = panel.scrollHeight - panel.clientHeight;
    panel.scrollTop = maxScroll * clamp(t / RAMP_MS, 0, 1);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
