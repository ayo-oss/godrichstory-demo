<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightbox Navigated by Swiping Next and Previous — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="scene is-demo" id="scene">
  <ul class="grid" id="grid">
    <li><button class="thumb" id="thumb0" type="button" aria-haspopup="dialog"><span class="thumbImg thumbImg--a"></span></button></li>
    <li><button class="thumb" id="thumb1" type="button" aria-haspopup="dialog"><span class="thumbImg thumbImg--b"></span></button></li>
    <li><button class="thumb" id="thumb2" type="button" aria-haspopup="dialog"><span class="thumbImg thumbImg--c"></span></button></li>
  </ul>
  <div class="backdrop" id="backdrop"></div>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Browse photos">
    <div class="viewport" id="viewport">
      <div class="track" id="track">
        <span class="fullImg fullImg--a"></span>
        <span class="fullImg fullImg--b"></span>
        <span class="fullImg fullImg--c"></span>
      </div>
    </div>
    <button class="navBtn navBtn--prev" id="prevBtn" type="button" aria-label="Previous photo"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M160 48v160l-80-80Z" opacity=".2"/><path d="M163.06 40.61a8 8 0 0 0-8.72 1.73l-80 80a8 8 0 0 0 0 11.32l80 80A8 8 0 0 0 168 208V48a8 8 0 0 0-4.94-7.39M152 188.69L91.31 128L152 67.31Z"/></g></svg></button>
    <button class="navBtn navBtn--next" id="nextBtn" type="button" aria-label="Next photo"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></button>
    <p class="counter" id="counter" aria-live="polite">1 / 3</p>
    <button class="closeBtn" id="closeBtn" type="button">Close</button>
  </div>
</div>
</main>
<script>
(function () {
  var SWIPE_COMMIT_RATIO = 0.25; // 드래그 거리 / 뷰포트 폭 이 이 비율을 넘으면 커밋
  var SWIPE_VELOCITY_PX_MS = 0.5; // 놓는 순간 속도(px/ms) 가 이 값을 넘어도 커밋
  var SNAP_MS = 320;
  var LOOP_MS = 2000;

  var scene = document.getElementById('scene');
  var backdrop = document.getElementById('backdrop');
  var lightbox = document.getElementById('lightbox');
  var viewport = document.getElementById('viewport');
  var track = document.getElementById('track');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var counter = document.getElementById('counter');
  var closeBtn = document.getElementById('closeBtn');
  var thumbs = [].slice.call(document.querySelectorAll('.thumb'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var COUNT = 3;
  var idx = 0;
  var open = false;
  var dragging = false;
  var dragStartX = 0;
  var dragBaseX = 0;
  var lastMoveX = 0;
  var lastMoveT = 0;
  var velocity = 0;
  var timers = [];

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function viewportW() { return viewport.getBoundingClientRect().width; }

  function animate(duration, onFrame, onDone) {
    if (reduce) { onFrame(1); if (onDone) onDone(); return; }
    var start = performance.now();
    function frame(now) {
      var p = clamp((now - start) / duration, 0, 1);
      onFrame(easeOutCubic(p));
      if (p < 1) requestAnimationFrame(frame);
      else if (onDone) onDone();
    }
    requestAnimationFrame(frame);
  }

  function setTrackX(px) { track.style.transform = 'translateX(' + px.toFixed(2) + 'px)'; }
  function baseXFor(i) { return -i * viewportW(); }

  function goTo(nextIdx, onDone) {
    nextIdx = clamp(nextIdx, 0, COUNT - 1);
    var fromX = baseXFor(idx);
    var toX = baseXFor(nextIdx);
    animate(SNAP_MS, function (e) {
      setTrackX(fromX + (toX - fromX) * e);
    }, function () {
      idx = nextIdx;
      counter.textContent = (idx + 1) + ' / ' + COUNT;
      if (onDone) onDone();
    });
  }

  function openFrom(startIdx) {
    if (open) return;
    open = true;
    idx = startIdx;
    setTrackX(baseXFor(idx));
    counter.textContent = (idx + 1) + ' / ' + COUNT;
    lightbox.style.visibility = 'visible';
    lightbox.setAttribute('aria-hidden', 'false');
    backdrop.style.visibility = 'visible';
    backdrop.style.opacity = '0';
    animate(260, function (e) { backdrop.style.opacity = (e * 0.78).toFixed(3); }, function () {
      closeBtn.focus({ preventScroll: true });
    });
  }

  function closeLightbox() {
    if (!open) return;
    animate(240, function (e) { backdrop.style.opacity = (0.78 * (1 - e)).toFixed(3); }, function () {
      lightbox.style.visibility = 'hidden';
      lightbox.setAttribute('aria-hidden', 'true');
      backdrop.style.visibility = 'hidden';
      open = false;
      thumbs[idx].focus({ preventScroll: true });
    });
  }

  function human() {
    if (scene.classList.contains('is-demo')) {
      scene.classList.remove('is-demo');
      timers.forEach(function (id) { clearTimeout(id); clearInterval(id); });
      timers = [];
    }
  }

  thumbs.forEach(function (t, i) {
    t.addEventListener('click', function () { human(); openFrom(i); });
  });
  closeBtn.addEventListener('click', function () { human(); closeLightbox(); });
  backdrop.addEventListener('click', function () { human(); closeLightbox(); });
  prevBtn.addEventListener('click', function () { human(); goTo(idx - 1); });
  nextBtn.addEventListener('click', function () { human(); goTo(idx + 1); });
  document.addEventListener('keydown', function (e) {
    if (!open) return;
    if (e.key === 'Escape') { human(); closeLightbox(); }
    else if (e.key === 'ArrowLeft') { human(); goTo(idx - 1); }
    else if (e.key === 'ArrowRight') { human(); goTo(idx + 1); }
  });

  viewport.addEventListener('pointerdown', function (e) {
    human();
    dragging = true;
    dragStartX = e.clientX;
    dragBaseX = baseXFor(idx);
    lastMoveX = e.clientX;
    lastMoveT = performance.now();
    velocity = 0;
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var now = performance.now();
    var dt = now - lastMoveT;
    if (dt > 0) velocity = (e.clientX - lastMoveX) / dt;
    lastMoveX = e.clientX;
    lastMoveT = now;
    setTrackX(dragBaseX + (e.clientX - dragStartX));
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    var deltaX = e.clientX - dragStartX;
    var w = viewportW();
    var commit = Math.abs(deltaX) > w * SWIPE_COMMIT_RATIO || Math.abs(velocity) > SWIPE_VELOCITY_PX_MS;
    if (commit) {
      goTo(idx + (deltaX < 0 ? 1 : -1));
    } else {
      goTo(idx);
    }
  }
  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);

  function cycle() {
    openFrom(0);
    timers.push(setTimeout(function () { goTo(1); }, 420));
    timers.push(setTimeout(function () { goTo(2); }, 1020));
    timers.push(setTimeout(closeLightbox, 1620));
  }

  if (!reduce) {
    cycle();
    timers.push(setInterval(function () {
      if (scene.classList.contains('is-demo')) cycle();
    }, LOOP_MS));
  }
})();
</script>
</body>
</html>
