<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightbox That Closes With a Downward Fling — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="scene is-demo" id="scene">
  <ul class="grid" id="grid">
    <li><button class="thumb" id="thumb0" type="button" aria-haspopup="dialog"><span class="thumbImg"></span></button></li>
  </ul>
  <div class="backdrop" id="backdrop"></div>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Fling photo to close">
    <span class="fullImg" id="fullImg"></span>
    <p class="dragNote" id="dragNote">Drag down to close</p>
    <button class="closeBtn" id="closeBtn" type="button">Close</button>
  </div>
</div>
</main>
<script>
(function () {
  var LIGHTBOX_FLING_VELOCITY_PX_MS = 0.5; // 놓는 순간 이 속도(px/ms) 를 넘으면 던진 것으로 본다
  var DRAG_COMMIT_RATIO = 0.32; // 드래그 거리 / 무대 높이 가 이 비율을 넘어도 던진 것으로 본다
  var SPRING_BACK_MS = 380;
  var LOOP_MS = 2000;

  var scene = document.getElementById('scene');
  var backdrop = document.getElementById('backdrop');
  var lightbox = document.getElementById('lightbox');
  var fullImg = document.getElementById('fullImg');
  var dragNote = document.getElementById('dragNote');
  var closeBtn = document.getElementById('closeBtn');
  var thumb = document.getElementById('thumb0');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var open = false;
  var dragging = false;
  var dragStartY = 0;
  var dragStartX = 0;
  var curY = 0;
  var curX = 0;
  var lastMoveY = 0;
  var lastMoveT = 0;
  var velocityY = 0;
  var timers = [];

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  // 스프링 오버슛: 목표를 살짝 지나쳤다 되돌아온다
  function easeSpringBack(t) { var p = t - 1; return 1 + p * p * (2.7 * p + 1.7); }
  function stageH() { return scene.getBoundingClientRect().height; }

  function animate(duration, onFrame, onDone, easeFn) {
    var ease = easeFn || easeOutCubic;
    if (reduce) { onFrame(1); if (onDone) onDone(); return; }
    var start = performance.now();
    function frame(now) {
      var p = clamp((now - start) / duration, 0, 1);
      onFrame(ease(p));
      if (p < 1) requestAnimationFrame(frame);
      else if (onDone) onDone();
    }
    requestAnimationFrame(frame);
  }

  function setDrag(x, y, progress) {
    fullImg.style.transform = 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px) scale(' + (1 - progress * 0.22).toFixed(4) + ')';
    backdrop.style.opacity = (0.78 * (1 - progress)).toFixed(3);
    dragNote.style.opacity = (1 - progress * 2).toFixed(3);
  }

  function openFrom() {
    if (open) return;
    open = true;
    curX = 0; curY = 0;
    dragNote.style.opacity = '1';
    setDrag(0, 0, 0);
    lightbox.style.visibility = 'visible';
    lightbox.setAttribute('aria-hidden', 'false');
    backdrop.style.visibility = 'visible';
    animate(240, function (e) { backdrop.style.opacity = (e * 0.78).toFixed(3); }, function () {
      closeBtn.focus({ preventScroll: true });
    });
  }

  function closeLightbox() {
    if (!open) return;
    lightbox.style.visibility = 'hidden';
    lightbox.setAttribute('aria-hidden', 'true');
    backdrop.style.visibility = 'hidden';
    open = false;
    thumb.focus({ preventScroll: true });
  }

  // 던진 속도로 남은 거리를 마저 날아가게 한다 — 값이 클수록 짧고 빠르게 끝난다
  function flingClose(vy) {
    var h = stageH();
    var fromY = curY;
    var fromX = curX;
    var targetY = fromY + Math.sign(vy || 1) * (h * 1.4);
    var duration = clamp(220 / Math.max(Math.abs(vy), 0.35), 120, 320);
    animate(duration, function (e) {
      var y = fromY + (targetY - fromY) * e;
      var progress = clamp(Math.abs(y) / h, 0, 1);
      setDrag(fromX * (1 - e), y, progress);
    }, closeLightbox, function (t) { return t; });
  }

  function springBack() {
    var fromX = curX;
    var fromY = curY;
    animate(SPRING_BACK_MS, function (e) {
      setDrag(fromX * (1 - e), fromY * (1 - e), 0);
    }, function () {
      curX = 0; curY = 0;
      closeBtn.focus({ preventScroll: true });
    }, easeSpringBack);
  }

  function human() {
    if (scene.classList.contains('is-demo')) {
      scene.classList.remove('is-demo');
      timers.forEach(function (id) { clearTimeout(id); clearInterval(id); });
      timers = [];
    }
  }

  thumb.addEventListener('click', function () { human(); openFrom(); });
  closeBtn.addEventListener('click', function () { human(); closeLightbox(); });
  backdrop.addEventListener('click', function () { human(); closeLightbox(); });
  document.addEventListener('keydown', function (e) {
    if (open && e.key === 'Escape') { human(); closeLightbox(); }
  });

  fullImg.addEventListener('pointerdown', function (e) {
    human();
    dragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    lastMoveY = e.clientY;
    lastMoveT = performance.now();
    velocityY = 0;
    fullImg.setPointerCapture(e.pointerId);
  });
  fullImg.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var now = performance.now();
    var dt = now - lastMoveT;
    if (dt > 0) velocityY = (e.clientY - lastMoveY) / dt;
    lastMoveY = e.clientY;
    lastMoveT = now;
    curX = e.clientX - dragStartX;
    curY = Math.max(0, e.clientY - dragStartY);
    var progress = clamp(curY / (stageH() * DRAG_COMMIT_RATIO), 0, 1);
    setDrag(curX, curY, progress);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    var h = stageH();
    var commit = curY > h * DRAG_COMMIT_RATIO || Math.abs(velocityY) > LIGHTBOX_FLING_VELOCITY_PX_MS;
    if (commit) flingClose(velocityY);
    else springBack();
  }
  fullImg.addEventListener('pointerup', endDrag);
  fullImg.addEventListener('pointercancel', endDrag);

  function cycle() {
    openFrom();
    timers.push(setTimeout(function () {
      curX = 6; curY = 0;
      var h = stageH();
      var fromY = 0;
      animate(360, function (e) {
        curY = fromY + h * 0.62 * e;
        setDrag(curX * (1 - e * 0.4), curY, e * 0.7);
      }, function () {
        flingClose(LIGHTBOX_FLING_VELOCITY_PX_MS * 1.6);
      });
    }, 420));
  }

  if (!reduce) {
    cycle();
    timers.push(setInterval(function () {
      if (scene.classList.contains('is-demo')) cycle();
    }, LOOP_MS));
  }
})();
</script>
</body>
</html>
