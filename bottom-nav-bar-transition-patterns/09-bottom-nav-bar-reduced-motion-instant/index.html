<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일반 전환과 축소 모션 전환을 나란히 비교하는 바 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rm is-demo" id="rm">
  <div class="rm__panel" data-role="normal">
    <p class="rm__caption">일반 전환</p>
    <div class="rm__track" id="rmTrackA">
      <div class="rm__indicator rm__indicator--a" id="rmIndicatorA"></div>
      <button type="button" class="rm__tab is-active" data-idx="0">
        <svg class="rm__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 120v96h-64v-64h-48v64H40v-96a8 8 0 0 1 2.34-5.66l80-80a8 8 0 0 1 11.32 0l80 80A8 8 0 0 1 216 120" opacity=".2"/><path d="m219.31 108.68l-80-80a16 16 0 0 0-22.62 0l-80 80A15.87 15.87 0 0 0 32 120v96a8 8 0 0 0 8 8h64a8 8 0 0 0 8-8v-56h32v56a8 8 0 0 0 8 8h64a8 8 0 0 0 8-8v-96a15.87 15.87 0 0 0-4.69-11.32M208 208h-48v-56a8 8 0 0 0-8-8h-48a8 8 0 0 0-8 8v56H48v-88l80-80l80 80Z"/></g></svg>
        <span class="rm__label">홈</span>
      </button>
      <button type="button" class="rm__tab" data-idx="1">
        <svg class="rm__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M224 80v120a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V80a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8" opacity=".2"/><path d="M216 64h-40a48 48 0 0 0-96 0H40a16 16 0 0 0-16 16v120a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V80a16 16 0 0 0-16-16m-88-32a32 32 0 0 1 32 32H96a32 32 0 0 1 32-32m88 168H40V80h176Z"/></g></svg>
        <span class="rm__label">쇼핑</span>
      </button>
    </div>
    <p class="rm__readout" id="rmReadoutA">0 / 320ms</p>
  </div>
  <div class="rm__panel" data-role="reduced">
    <p class="rm__caption">축소 모션 전환</p>
    <div class="rm__track" id="rmTrackB">
      <div class="rm__indicator rm__indicator--b" id="rmIndicatorB"></div>
      <button type="button" class="rm__tab is-active" data-idx="0">
        <svg class="rm__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 120v96h-64v-64h-48v64H40v-96a8 8 0 0 1 2.34-5.66l80-80a8 8 0 0 1 11.32 0l80 80A8 8 0 0 1 216 120" opacity=".2"/><path d="m219.31 108.68l-80-80a16 16 0 0 0-22.62 0l-80 80A15.87 15.87 0 0 0 32 120v96a8 8 0 0 0 8 8h64a8 8 0 0 0 8-8v-56h32v56a8 8 0 0 0 8 8h64a8 8 0 0 0 8-8v-96a15.87 15.87 0 0 0-4.69-11.32M208 208h-48v-56a8 8 0 0 0-8-8h-48a8 8 0 0 0-8 8v56H48v-88l80-80l80 80Z"/></g></svg>
        <span class="rm__label">홈</span>
      </button>
      <button type="button" class="rm__tab" data-idx="1">
        <svg class="rm__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M224 80v120a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V80a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8" opacity=".2"/><path d="M216 64h-40a48 48 0 0 0-96 0H40a16 16 0 0 0-16 16v120a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V80a16 16 0 0 0-16-16m-88-32a32 32 0 0 1 32 32H96a32 32 0 0 1 32-32m88 168H40V80h176Z"/></g></svg>
        <span class="rm__label">쇼핑</span>
      </button>
    </div>
    <p class="rm__readout" id="rmReadoutB">0ms</p>
  </div>
</div>
<script>
(function () {
  var DURATION_MS = 320; // 계산 겹: 일반 패널의 전환 실제 시간(ms) — CSS transition 이 아니라 rAF 로 직접 적분
  var CYCLE_MS = 700; // 자동 루프가 좌우 탭을 오가는 간격
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var rm = document.getElementById('rm');
  var trackA = document.getElementById('rmTrackA');
  var indicatorA = document.getElementById('rmIndicatorA');
  var readoutA = document.getElementById('rmReadoutA');
  var trackB = document.getElementById('rmTrackB');
  var indicatorB = document.getElementById('rmIndicatorB');
  var readoutB = document.getElementById('rmReadoutB');
  var tabsA = Array.prototype.slice.call(trackA.querySelectorAll('.rm__tab'));
  var tabsB = Array.prototype.slice.call(trackB.querySelectorAll('.rm__tab'));

  var isDemo = true;

  function human() {
    if (isDemo) { rm.classList.remove('is-demo'); isDemo = false; }
  }

  function measure(track, tabs) {
    var trackRect = track.getBoundingClientRect();
    return tabs.map(function (t) {
      var r = t.getBoundingClientRect();
      return { left: r.left - trackRect.left, width: r.width, height: r.height };
    });
  }

  // ---- 패널 A: 일반 전환 — easeOutCubic 을 rAF 로 직접 적분해 진짜 경과시간을 잰다.
  // 실제 OS/브라우저의 prefers-reduced-motion 설정과 무관하게 항상 이 계산을 수행한다.
  var geoA = measure(trackA, tabsA);
  indicatorA.style.width = geoA[0].width + 'px';
  indicatorA.style.height = geoA[0].height + 'px';
  var activeA = 0;
  var fromXA = geoA[0].left, toXA = geoA[0].left;
  var transStartA = 0;
  var transitioningA = false;
  indicatorA.style.transform = 'translateX(' + geoA[0].left.toFixed(1) + 'px)';

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function goToA(idx, ts) {
    activeA = idx;
    tabsA.forEach(function (t, i) { t.classList.toggle('is-active', i === idx); });
    fromXA = currentXA(ts);
    toXA = geoA[idx].left;
    transStartA = ts;
    transitioningA = true;
  }
  function currentXA(ts) {
    if (!transitioningA) return toXA;
    var t = Math.min(1, (ts - transStartA) / DURATION_MS);
    return fromXA + (toXA - fromXA) * easeOutCubic(t);
  }

  // ---- 패널 B: 축소 모션 전환 — 보간 없이 즉시 위치를 놓고, 실제 지연시간(perf.now 차)만 잰다.
  // 이 패널은 늘 즉시 전환한다는 사실을 보여주는 쪽이라 실제 설정과 무관하게 동작을 고정한다.
  var geoB = measure(trackB, tabsB);
  indicatorB.style.width = geoB[0].width + 'px';
  indicatorB.style.height = geoB[0].height + 'px';
  var activeB = 0;
  var switchAtB = 0;
  var latencyMeasured = true;
  indicatorB.style.transform = 'translateX(' + geoB[0].left.toFixed(1) + 'px)';

  function goToB(idx, ts) {
    activeB = idx;
    tabsB.forEach(function (t, i) { t.classList.toggle('is-active', i === idx); });
    indicatorB.style.transform = 'translateX(' + geoB[idx].left.toFixed(1) + 'px)';
    switchAtB = ts;
    latencyMeasured = false;
  }

  tabsA.forEach(function (t, i) {
    t.addEventListener('click', function () { human(); if (i !== activeA) goToA(i, performance.now()); });
  });
  tabsB.forEach(function (t, i) {
    t.addEventListener('click', function () { human(); if (i !== activeB) goToB(i, performance.now()); });
  });

  var cycleStart = 0;
  var lastCycleIdx = 0;

  function tick(ts) {
    if (!cycleStart) cycleStart = ts;

    if (isDemo && !reduce) {
      var step = Math.floor((ts - cycleStart) / CYCLE_MS);
      var idx = step % 2;
      if (idx !== lastCycleIdx) {
        lastCycleIdx = idx;
        if (idx !== activeA) goToA(idx, ts);
        if (idx !== activeB) goToB(idx, ts);
      }
    }

    if (transitioningA) {
      var x = currentXA(ts);
      indicatorA.style.transform = 'translateX(' + x.toFixed(1) + 'px)';
      var elapsed = Math.min(DURATION_MS, ts - transStartA);
      readoutA.textContent = Math.round(elapsed) + ' / ' + DURATION_MS + 'ms';
      if (elapsed >= DURATION_MS) { transitioningA = false; }
    }

    if (!latencyMeasured) {
      var lat = ts - switchAtB;
      readoutB.textContent = Math.round(lat) + 'ms (1프레임)';
      latencyMeasured = true;
    }

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>
</main>
</body>
</html>
