<title>중앙 버튼 들림 전환 — demo</title>

<body>
<main class="stage">
<div class="cl is-demo" id="cl">
  <div class="cl__phone">

        <span class="cl__label">홈</span>
      </button>
      <button type="button" class="cl__tab" data-idx="1">
        <svg class="cl__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M192 112a80 80 0 1 1-80-80a80 80 0 0 1 80 80" opacity=".2"/><path d="m229.66 218.34l-50.06-50.06a88.21 88.21 0 1 0-11.32 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></g></svg>
        <span class="cl__label">검색</span>

      <div class="cl__centerSlot">
        <button type="button" class="cl__center" id="clCenter" data-idx="2">
          <svg class="cl__centerIcon" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M224 128a8 8 0 0 1-8 8h-80v80a8 8 0 0 1-16 0v-80H40a8 8 0 0 1 0-16h80V40a8 8 0 0 1 16 0v80h80a8 8 0 0 1 8 8"/></svg>
        </button>
      </div>
      <button type="button" class="cl__tab" data-idx="3">
        <svg class="cl__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M224 80v120a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V80a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8" opacity=".2"/><path d="M216 64h-40a48 48 0 0 0-96 0H40a16 16 0 0 0-16 16v120a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V80a16 16 0 0 0-16-16m-88-32a32 32 0 0 1 32 32H96a32 32 0 0 1 32-32m88 168H40V80h176Z"/></g></svg>
        <span class="cl__label">쇼핑</span>
      </button>
      <button type="button" class="cl__tab" data-idx="4">
        <svg class="cl__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M192 96a64 64 0 1 1-64-64a64 64 0 0 1 64 64" opacity=".2"/><path d="M230.92 212c-15.23-26.33-38.7-45.21-66.09-54.16a72 72 0 1 0-73.66 0c-27.39 8.94-50.86 27.82-66.09 54.16a8 8 0 1 0 13.85 8c18.84-32.56 52.14-52 89.07-52s70.23 19.44 89.07 52a8 8 0 1 0 13.85-8M72 96a56 56 0 1 1 56 56a56.06 56.06 0 0 1-56-56"/></g></svg>
        <span class="cl__label">프로필</span>
      </button>
    </div>
  </div>
</div>
<script>
(function () {
  var HOLD_MS = 900; // 계산 겹 상수: 자동 루프가 각 상태에 머무는 시간
  var LIFT_PX = 22; // px, 완전히 들렸을 때 위로 이동하는 거리
  var SCALE_MAX = 1.14; // 완전히 들렸을 때 배율
  var SHADOW_BLUR_BASE = 6, SHADOW_BLUR_GAIN = 20; // 계산 겹: 들림 정도(liftT)에 따라 blur 를 늘린다
  var SHADOW_Y_BASE = 2, SHADOW_Y_GAIN = 14; // 계산 겹: 들림 정도에 따라 그림자 y 오프셋을 늘린다(높이감)
  var SHADOW_ALPHA_BASE = 0.32, SHADOW_ALPHA_GAIN = -0.10; // 계산 겹: 들릴수록 그림자가 옅어진다(광원과 멀어짐)
  var SPRING_K = 190, SPRING_C = 18; // 계산 겹: liftT 스프링 상수·감쇠

  var cl = document.getElementById('cl');
  var center = document.getElementById('clCenter');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.cl__tab'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var isDemo = true;
  var lifted = false;
  var liftT = 0, liftV = 0;
  var lastTs = 0;
  var cycleStart = 0;

  function setLifted(v) {
    lifted = v;
    center.classList.toggle('is-lifted', v);
    tabs.forEach(function (t) { t.classList.toggle('is-active', false); });
  }

  function render() {
    // 계산 겹: 물리 그림자 근사 — 들린 높이(liftT)가 클수록 blur·y오프셋은 커지고 alpha는 옅어진다
    var ty = -(LIFT_PX * liftT);
    var scale = 1 + (SCALE_MAX - 1) * liftT;
    var blur = SHADOW_BLUR_BASE + SHADOW_BLUR_GAIN * liftT;
    var y = SHADOW_Y_BASE + SHADOW_Y_GAIN * liftT;
    var alpha = Math.max(0.08, SHADOW_ALPHA_BASE + SHADOW_ALPHA_GAIN * liftT);
    center.style.transform = 'translateY(' + ty.toFixed(2) + 'px) scale(' + scale.toFixed(3) + ')';
    center.style.boxShadow = '0 ' + y.toFixed(1) + 'px ' + blur.toFixed(1) + 'px rgba(10, 20, 40,' + alpha.toFixed(3) + ')';
  }

  function human() {
    if (isDemo) { cl.classList.remove('is-demo'); isDemo = false; }
  }

  center.addEventListener('click', function () { human(); setLifted(!lifted); });
  tabs.forEach(function (t) {
    t.addEventListener('click', function () { human(); setLifted(false); tabs.forEach(function (o) { o.classList.remove('is-active'); }); t.classList.add('is-active'); });
  });

  function loop(ts) {
    if (!lastTs) { lastTs = ts; cycleStart = ts; }
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;

    if (isDemo) {
      var phase = Math.floor((ts - cycleStart) / HOLD_MS) % 2;
      setLifted(phase === 1);
    }

    var target = lifted ? 1 : 0;
    var acc = (target - liftT) * SPRING_K - liftV * SPRING_C;
    liftV += acc * dt;
    liftT += liftV * dt;

    render();
    requestAnimationFrame(loop);
  }

  render();
  if (!reduce) {
    requestAnimationFrame(loop);
  }
})();
</script>
</main>
</body>
</html>
