<title>Long-press quick menu — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lp is-demo" id="lp">
  <div class="lp__phone">
    <div class="lp__menu" id="lpMenu">
      <button type="button" class="lp__action" data-i="0" aria-label="Notifications">
        <svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M208 192H48a8 8 0 0 1-6.88-12C47.71 168.6 56 139.81 56 104a72 72 0 0 1 144 0c0 35.82 8.3 64.6 14.9 76a8 8 0 0 1-6.9 12" opacity=".2"/><path d="M221.8 175.94c-5.55-9.56-13.8-36.61-13.8-71.94a80 80 0 1 0-160 0c0 35.34-8.26 62.38-13.81 71.94A16 16 0 0 0 48 200h40.81a40 40 0 0 0 78.38 0H208a16 16 0 0 0 13.8-24.06M128 216a24 24 0 0 1-22.62-16h45.24A24 24 0 0 1 128 216m-80-32c7.7-13.24 16-43.92 16-80a64 64 0 1 1 128 0c0 36.05 8.28 66.73 16 80Z"/></g></svg>
      </button>
      <button type="button" class="lp__action" data-i="1" aria-label="Messages">
        <svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M224 128a96 96 0 0 1-144.07 83.11l-37.39 12.47a8 8 0 0 1-10.12-10.12l12.47-37.39A96 96 0 1 1 224 128" opacity=".2"/><path d="M128 24a104 104 0 0 0-91.82 152.88l-11.35 34.05a16 16 0 0 0 20.24 20.24l34.05-11.35A104 104 0 1 0 128 24m0 192a87.87 87.87 0 0 1-44.06-11.81a8 8 0 0 0-6.54-.67L40 216l12.47-37.4a8 8 0 0 0-.66-6.54A88 88 0 1 1 128 216"/></g></svg>
      </button>
      <button type="button" class="lp__action" data-i="2" aria-label="Likes">
        <svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 102c0 66-104 122-104 122S24 168 24 102a54 54 0 0 1 54-54c22.59 0 41.94 12.31 50 32c8.06-19.69 27.41-32 50-32a54 54 0 0 1 54 54" opacity=".2"/><path d="M178 40c-20.65 0-38.73 8.88-50 23.89C116.73 48.88 98.65 40 78 40a62.07 62.07 0 0 0-62 62c0 70 103.79 126.66 108.21 129a8 8 0 0 0 7.58 0C136.21 228.66 240 172 240 102a62.07 62.07 0 0 0-62-62m-50 174.8c-18.26-10.64-96-59.11-96-112.8a46.06 46.06 0 0 1 46-46c19.45 0 35.78 10.36 42.6 27a8 8 0 0 0 14.8 0c6.82-16.67 23.15-27 42.6-27a46.06 46.06 0 0 1 46 46c0 53.61-77.76 102.15-96 112.8"/></g></svg>
      </button>
    </div>
    <div class="lp__track">
      <button type="button" class="lp__tab is-active" data-idx="0">
        <svg class="lp__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 120v96h-64v-64h-48v64H40v-96a8 8 0 0 1 2.34-5.66l80-80a8 8 0 0 1 11.32 0l80 80A8 8 0 0 1 216 120" opacity=".2"/><path d="m219.31 108.68l-80-80a16 16 0 0 0-22.62 0l-80 80A15.87 15.87 0 0 0 32 120v96a8 8 0 0 0 8 8h64a8 8 0 0 0 8-8v-56h32v56a8 8 0 0 0 8 8h64a8 8 0 0 0 8-8v-96a15.87 15.87 0 0 0-4.69-11.32M208 208h-48v-56a8 8 0 0 0-8-8h-48a8 8 0 0 0-8 8v56H48v-88l80-80l80 80Z"/></g></svg>
        <span class="lp__label">Home</span>
      </button>
      <button type="button" class="lp__tab" data-idx="1">
        <svg class="lp__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M224 80v120a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V80a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8" opacity=".2"/><path d="M216 64h-40a48 48 0 0 0-96 0H40a16 16 0 0 0-16 16v120a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V80a16 16 0 0 0-16-16m-88-32a32 32 0 0 1 32 32H96a32 32 0 0 1 32-32m88 168H40V80h176Z"/></g></svg>
        <span class="lp__label">Shopping</span>
      </button>
      <button type="button" class="lp__fab" id="lpFab" aria-label="Long-press for quick menu">
        <svg class="lp__ring" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="lp__ringTrack" cx="32" cy="32" r="27"/>
          <circle class="lp__ringProgress" id="lpRingProgress" cx="32" cy="32" r="27"/>
        </svg>
        <svg class="lp__fabIcon" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M228 128a12 12 0 0 1-12 12h-76v76a12 12 0 0 1-24 0v-76H40a12 12 0 0 1 0-24h76V40a12 12 0 0 1 24 0v76h76a12 12 0 0 1 12 12"/></svg>
      </button>
      <button type="button" class="lp__tab" data-idx="2">
        <svg class="lp__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M192 96a64 64 0 1 1-64-64a64 64 0 0 1 64 64" opacity=".2"/><path d="M230.92 212c-15.23-26.33-38.7-45.21-66.09-54.16a72 72 0 1 0-73.66 0c-27.39 8.94-50.86 27.82-66.09 54.16a8 8 0 1 0 13.85 8c18.84-32.56 52.14-52 89.07-52s70.23 19.44 89.07 52a8 8 0 1 0 13.85-8M72 96a56 56 0 1 1 56 56a56.06 56.06 0 0 1-56-56"/></g></svg>
        <span class="lp__label">Profile</span>
      </button>
    </div>
  </div>
</div>
<script>
(function () {
  var HOLD_MS = 650; // 계산 겹: 이 길이만큼 눌러야 링이 다 차서 메뉴가 열린다
  var OPEN_MS = 900; // 열린 채로 머무는 시간(자동 루프용)
  var CYCLE_MS = 2600; // 자동 루프 왕복 주기
  var RING_R = 27; // svg 링 반지름(px, viewBox 좌표) — 원둘레 계산의 재료
  var RING_CIRC = 2 * Math.PI * RING_R; // 계산 겹: 원둘레를 실제로 계산해 stroke-dashoffset 에 쓴다
  var SPRING_RATE = 16; // 지수 평활 상수(1/s) — 뗄 때 링이 되돌아가는 속도
  var MENU_RATE = 20; // 메뉴 등장/퇴장 지수 평활 상수(1/s)
  var FAN_R = 62; // 부채꼴 반경(px) — 액션 버튼이 FAB 로부터 떨어지는 거리
  var FAN_ANGLES = [-150, -90, -30]; // 계산 겹: 각 액션 버튼의 각도(도) — sin/cos 로 좌표를 만든다
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var lp = document.getElementById('lp');
  var fab = document.getElementById('lpFab');
  var ring = document.getElementById('lpRingProgress');
  var menu = document.getElementById('lpMenu');
  var actions = Array.prototype.slice.call(menu.querySelectorAll('.lp__action'));
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.lp__tab'));

  var isDemo = true;
  var isPressing = false;
  var pressStart = 0;
  var opened = false;
  var progress = 0; // 0..1, 링이 찬 비율
  var menuT = 0; // 0..1, 메뉴 등장 비율
  var lastTs = 0;
  var cycleStart = 0;
  var closeTimer = null;

  ring.style.strokeDasharray = RING_CIRC.toFixed(2);

  function human() {
    if (isDemo) { lp.classList.remove('is-demo'); isDemo = false; }
  }

  function placeActions() {
    // 계산 겹: FAB 중심을 기준으로 각도(FAN_ANGLES)를 실제 삼각함수로 좌표 변환한다
    var fabRect = fab.getBoundingClientRect();
    var phoneRect = fab.closest('.lp__phone').getBoundingClientRect();
    var cx = fabRect.left + fabRect.width / 2 - phoneRect.left;
    var cy = fabRect.top + fabRect.height / 2 - phoneRect.top;
    actions.forEach(function (btn, i) {
      var rad = FAN_ANGLES[i] * Math.PI / 180;
      var x = cx + FAN_R * Math.cos(rad);
      var y = cy + FAN_R * Math.sin(rad);
      btn.style.left = x.toFixed(1) + 'px';
      btn.style.top = y.toFixed(1) + 'px';
    });
  }

  function openMenu() {
    opened = true;
    placeActions();
    clearTimeout(closeTimer);
    closeTimer = setTimeout(closeMenu, OPEN_MS);
  }

  function closeMenu() {
    opened = false;
    isPressing = false;
    clearTimeout(closeTimer);
  }

  fab.addEventListener('pointerdown', function (e) {
    human();
    if (opened) { closeMenu(); return; }
    isPressing = true;
    pressStart = performance.now();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (evt) {
    fab.addEventListener(evt, function () {
      if (!opened) { isPressing = false; }
    });
  });

  actions.forEach(function (btn) {
    btn.addEventListener('click', function () { human(); closeMenu(); });
  });

  tabs.forEach(function (t) {
    t.addEventListener('click', function () {
      human();
      tabs.forEach(function (o) { o.classList.remove('is-active'); });
      t.classList.add('is-active');
    });
  });

  function demoPhase(cycleT) {
    if (cycleT < HOLD_MS) { return { pressing: true, held: cycleT, opened: false }; }
    if (cycleT < HOLD_MS + OPEN_MS) { return { pressing: false, held: HOLD_MS, opened: true }; }
    return { pressing: false, held: 0, opened: false };
  }

  function tick(ts) {
    if (!lastTs) { lastTs = ts; cycleStart = ts; }
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;

    if (isDemo && !reduce) {
      var cycleT = (ts - cycleStart) % CYCLE_MS;
      var phase = demoPhase(cycleT);
      if (phase.pressing) {
        progress = Math.min(1, phase.held / HOLD_MS);
        if (progress >= 1 && !opened) { openMenu(); }
      } else if (phase.opened) {
        if (!opened) { openMenu(); }
        progress = 1;
      } else {
        if (opened) { closeMenu(); }
        progress += (0 - progress) * (1 - Math.exp(-SPRING_RATE * dt));
      }
    } else if (isPressing) {
      var heldMs = ts - pressStart;
      progress = Math.min(1, heldMs / HOLD_MS);
      if (progress >= 1 && !opened) { openMenu(); }
    } else if (opened) {
      progress = 1;
    } else {
      progress += (0 - progress) * (1 - Math.exp(-SPRING_RATE * dt));
    }

    var menuTarget = opened ? 1 : 0;
    menuT += (menuTarget - menuT) * (1 - Math.exp(-MENU_RATE * dt));

    ring.style.strokeDashoffset = (RING_CIRC * (1 - progress)).toFixed(2);
    menu.style.opacity = menuT.toFixed(3);
    var menuScale = 0.6 + 0.4 * menuT;
    actions.forEach(function (btn) {
      btn.style.transform = 'translate(-50%, -50%) scale(' + menuScale.toFixed(3) + ')';
    });
    menu.style.pointerEvents = menuT > 0.5 ? 'auto' : 'none';

    requestAnimationFrame(tick);
  }

  placeActions();
  window.addEventListener('resize', placeActions);
  requestAnimationFrame(tick);
})();
</script>
</main>
</body>
</html>
