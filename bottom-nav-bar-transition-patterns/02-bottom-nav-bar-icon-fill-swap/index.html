          <svg class="bf__icon bf__icon--outline" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M192 112a80 80 0 1 1-80-80a80 80 0 0 1 80 80" opacity=".2"/><path d="m229.66 218.34l-50.06-50.06a88.21 88.21 0 1 0-11.32 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></g></svg>

</div>
<script>
(function () {
  var HOLD_MS = 650; // 계산 겹 상수: 자동 루프가 각 탭에 머무는 시간
  var FILL_RATE = 0.012; // 계산 겹: 채움 정도 지수 평활 상수(ms 기준)
  var PULSE_DUR = 360; // ms, 활성화 순간 스케일 펄스 지속
  var PULSE_FREQ = 2 * Math.PI * 1.6 / PULSE_DUR; // 계산 겹: 펄스 각속도
  var PULSE_ZETA = 4.4; // 계산 겹: 펄스 감쇠 상수
  var TAB_COUNT = 4;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var bf = document.getElementById('bf');
  var tabs = [0, 1, 2, 3].map(function (i) { return document.getElementById('bfTab' + i); });
  var wraps = [0, 1, 2, 3].map(function (i) { return document.getElementById('bfIcon' + i); });

  var isDemo = true;
  var activeIdx = 0;
  var fillAmt = [1, 0, 0, 0];
  var pulseStart = [-9999, -9999, -9999, -9999];
  var cycleStart = 0;
  var lastTs = 0;

  function pulseScale(t) {
    // 계산 겹: 활성화 순간의 스케일 펄스 — 감쇠 코사인 진동으로 목표를 넘어섰다 되돌아온다
    if (t < 0 || t > PULSE_DUR) return 1;
    var amp = Math.exp(-PULSE_ZETA * (t / PULSE_DUR));
    return 1 + amp * (1 - Math.cos(PULSE_FREQ * t)) * 0.16;
  }

  function setActive(idx, ts) {
    if (idx === activeIdx) return;
    activeIdx = idx;
    pulseStart[idx] = ts;
    tabs.forEach(function (t, i) {
      t.classList.toggle('is-active', i === idx);
      t.setAttribute('aria-current', i === idx ? 'true' : 'false');
    });
  }

  function render(ts) {
    wraps.forEach(function (w, i) {
      var outline = w.children[0], fill = w.children[1];
      var f = fillAmt[i];
      fill.style.opacity = f.toFixed(3);
      outline.style.opacity = (1 - f * 0.85).toFixed(3);
      var s = pulseScale(ts - pulseStart[i]);
      w.style.transform = 'scale(' + s.toFixed(3) + ')';
    });
  }

  function human() {
    if (isDemo) { bf.classList.remove('is-demo'); isDemo = false; }
  }

  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { human(); setActive(i, performance.now()); });
  });

  function loop(ts) {
    if (!lastTs) { lastTs = ts; cycleStart = ts; }
    var dt = ts - lastTs;
    lastTs = ts;

    if (isDemo) {
      var elapsed = ts - cycleStart;
      var idx = Math.floor(elapsed / HOLD_MS) % TAB_COUNT;
      if (idx !== activeIdx) setActive(idx, ts);
    }

    for (var i = 0; i < TAB_COUNT; i++) {
      var target = i === activeIdx ? 1 : 0;
      fillAmt[i] += (target - fillAmt[i]) * (1 - Math.exp(-FILL_RATE * dt));
    }

    render(ts);
    requestAnimationFrame(loop);
  }

  render(0);
  if (!reduce) {
    requestAnimationFrame(loop);
  }
})();
</script>
</main>
</body>
</html>
