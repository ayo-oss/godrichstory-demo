<head>

<title>Badge count bump transition — demo</title>

</head>
<body>
<main class="stage">
<div class="bg is-demo" id="bg">
  <div class="bg__phone">
    <div class="bg__track">
      <button type="button" class="bg__tab is-active" data-idx="0">
        <svg class="bg__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 120v96h-64v-64h-48v64H40v-96a8 8 0 0 1 2.34-5.66l80-80a8 8 0 0 1 11.32 0l80 80A8 8 0 0 1 216 120" opacity=".2"/><path d="m219.31 108.68l-80-80a16 16 0 0 0-22.62 0l-80 80A15.87 15.87 0 0 0 32 120v96a8 8 0 0 0 8 8h64a8 8 0 0 0 8-8v-56h32v56a8 8 0 0 0 8 8h64a8 8 0 0 0 8-8v-96a15.87 15.87 0 0 0-4.69-11.32M208 208h-48v-56a8 8 0 0 0-8-8h-48a8 8 0 0 0-8 8v56H48v-88l80-80l80 80Z"/></g></svg>
        <span class="bg__label">Home</span>
      </button>
      <button type="button" class="bg__tab" data-idx="1">
        <svg class="bg__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M224 80v120a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V80a8 8 0 0 1 8-8h176a8 8 0 0 1 8 8" opacity=".2"/><path d="M216 64h-40a48 48 0 0 0-96 0H40a16 16 0 0 0-16 16v120a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V80a16 16 0 0 0-16-16m-88-32a32 32 0 0 1 32 32H96a32 32 0 0 1 32-32m88 168H40V80h176Z"/></g></svg>
        <span class="bg__label">Shopping</span>
      </button>
      <button type="button" class="bg__tab" data-idx="2" id="bgAlertTab">
        <span class="bg__iconWrap">
          <svg class="bg__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M208 192H48a8 8 0 0 1-6.88-12C47.71 168.6 56 139.81 56 104a72 72 0 0 1 144 0c0 35.82 8.3 64.6 14.9 76a8 8 0 0 1-6.9 12" opacity=".2"/><path d="M221.8 175.94c-5.55-9.56-13.8-36.61-13.8-71.94a80 80 0 1 0-160 0c0 35.34-8.26 62.38-13.81 71.94A16 16 0 0 0 48 200h40.81a40 40 0 0 0 78.38 0H208a16 16 0 0 0 13.8-24.06M128 216a24 24 0 0 1-22.62-16h45.24A24 24 0 0 1 128 216m-80-32c7.7-13.24 16-43.92 16-80a64 64 0 1 1 128 0c0 36.05 8.28 66.73 16 80Z"/></g></svg>
          <span class="bg__badge" id="bgBadge">
            <span class="bg__strip" id="bgStrip">
              <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>
            </span>
          </span>
        </span>
        <span class="bg__label">Notifications</span>
      </button>
      <button type="button" class="bg__tab" data-idx="3">
        <svg class="bg__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M192 96a64 64 0 1 1-64-64a64 64 0 0 1 64 64" opacity=".2"/><path d="M230.92 212c-15.23-26.33-38.7-45.21-66.09-54.16a72 72 0 1 0-73.66 0c-27.39 8.94-50.86 27.82-66.09 54.16a8 8 0 1 0 13.85 8c18.84-32.56 52.14-52 89.07-52s70.23 19.44 89.07 52a8 8 0 1 0 13.85-8M72 96a56 56 0 1 1 56 56a56.06 56.06 0 0 1-56-56"/></g></svg>
        <span class="bg__label">Profile</span>
      </button>
    </div>
    <button type="button" class="bg__hit" id="bgAdd">Add notification</button>
  </div>
</div>
<script>
(function () {
  var ROW_H = 14; // px, 숫자 롤 한 칸 높이
  var INCR_MS = 520; // 계산 겹 상수: 자동 루프가 수량을 올리는 간격
  var SPRING_K = 260; // 계산 겹: 숫자 롤 스프링 상수
  var SPRING_C = 22; // 계산 겹: 숫자 롤 감쇠 상수
  var BUMP_DUR = 320; // ms, 배지 bump 지속
  var BUMP_FREQ = 2 * Math.PI * 1.8 / BUMP_DUR; // 계산 겹: bump 각속도
  var BUMP_ZETA = 4.8; // 계산 겹: bump 감쇠 상수
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var bg = document.getElementById('bg');
  var badge = document.getElementById('bgBadge');
  var strip = document.getElementById('bgStrip');
  var addBtn = document.getElementById('bgAdd');
  var alertTab = document.getElementById('bgAlertTab');

  var isDemo = true;
  var count = 0;
  var pos = 0, vel = 0;
  var bumpStart = -9999;
  var lastTs = 0;
  var cycleStart = 0;

  function bumpScale(t) {
    // 계산 겹: 배지 bump — 감쇠 코사인 진동
    if (t < 0 || t > BUMP_DUR) return 1;
    var amp = Math.exp(-BUMP_ZETA * (t / BUMP_DUR));
    return 1 + amp * (1 - Math.cos(BUMP_FREQ * t)) * 0.5;
  }

  function bump(ts) {
    bumpStart = ts;
  }

  function increment(ts) {
    count = (count + 1) % 10;
    badge.style.display = 'inline-flex';
    bump(ts);
  }

  function render(ts) {
    var s = bumpScale(ts - bumpStart);
    badge.style.transform = 'scale(' + s.toFixed(3) + ')';
    strip.style.transform = 'translateY(' + (-pos).toFixed(2) + 'px)';
  }

  function human() {
    if (isDemo) { bg.classList.remove('is-demo'); isDemo = false; }
  }

  addBtn.addEventListener('click', function () { human(); increment(performance.now()); });
  addBtn.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    ev.preventDefault();
    addBtn.click();
  });
  alertTab.addEventListener('click', function () { human(); });

  function loop(ts) {
    if (!lastTs) { lastTs = ts; cycleStart = ts; }
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;

    if (isDemo) {
      var n = Math.floor((ts - cycleStart) / INCR_MS);
      if (n > loop._lastN) {
        loop._lastN = n;
        increment(ts);
      }
    }

    var target = -count * ROW_H;
    var acc = (target - pos) * SPRING_K - vel * SPRING_C;
    vel += acc * dt;
    pos += vel * dt;

    render(ts);
    requestAnimationFrame(loop);
  }
  loop._lastN = -1;

  render(0);
  if (!reduce) {
    requestAnimationFrame(loop);
  }
})();
</script>
</main>
</body>
</html>
