<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tooltip bubble — rich card preview</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="wrap">
    <a class="trigger" href="#" aria-describedby="card04">Xem sản phẩm</a>
    <div class="card" id="card04" popover="manual" role="tooltip">
      <div class="card__thumb" aria-hidden="true"></div>
      <p class="card__title">Tai nghe không dây</p>
      <p class="card__desc">Chống ồn · nghe 30 giờ</p>
    </div>
  </div>
</main>
<script>
// Popover API 로 카드를 최상위 레이어에 띄운다. 미지원 브라우저는 showPopover 가 없어 조용히 넘어간다
try { document.getElementById("card04").showPopover(); } catch (e) {}
</script>
</body>
</html>
