<script>
// 아이콘 여섯 개가 각자의 주기로 움직인다 — 누르면 그 아이콘만 처음부터 다시 재생된다.
var wiRoot = document.getElementById('wi');
wiRoot.addEventListener('click', function (e) {
  var tile = e.target.closest('.wi__tile');
  if (!tile) return;
  var fxs = tile.querySelectorAll('.wi__fx');
  for (var i = 0; i < fxs.length; i++) {
    fxs[i].style.animation = 'none';
  }
  void tile.offsetWidth;
  for (var j = 0; j < fxs.length; j++) {
    fxs[j].style.animation = '';
  }
});
</script>
