<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temperature unit toggle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage stage--paper">
  <section class="ut is-demo" id="ut" aria-label="Choose temperature units">
    <header class="ut__head">
      <p class="ut__title">Seoul temperatures</p>
      <div class="ut__seg" role="group" aria-label="Temperature unit">
        <span class="ut__thumb" aria-hidden="true"></span>
        <button class="ut__u is-on" type="button" data-unit="c" aria-pressed="true">°C</button>
        <button class="ut__u" type="button" data-unit="f" aria-pressed="false">°F</button>
      </div>
    </header>
    <p class="ut__big"><output class="ut__swap"><span class="ut__v ut-c" data-c="24">24</span><span class="ut__alt" aria-hidden="true">75</span></output><span class="ut__deg ut__swap"><span class="ut__v ut-suffix">°C</span><span class="ut__alt" aria-hidden="true">°F</span></span></p>
    <ul class="ut__hours">
      <li class="ut__h"><span class="ut__hl">Now</span><span class="ut__ht ut__swap"><span class="ut__v ut-c" data-c="24">24</span><span class="ut__alt" aria-hidden="true">75</span></span><span class="ut__hs ut__swap"><span class="ut__v ut-suffix">°C</span><span class="ut__alt" aria-hidden="true">°F</span></span></li>
      <li class="ut__h"><span class="ut__hl">3 PM</span><span class="ut__ht ut__swap"><span class="ut__v ut-c" data-c="25">25</span><span class="ut__alt" aria-hidden="true">77</span></span><span class="ut__hs ut__swap"><span class="ut__v ut-suffix">°C</span><span class="ut__alt" aria-hidden="true">°F</span></span></li>
      <li class="ut__h"><span class="ut__hl">4 PM</span><span class="ut__ht ut__swap"><span class="ut__v ut-c" data-c="23">23</span><span class="ut__alt" aria-hidden="true">73</span></span><span class="ut__hs ut__swap"><span class="ut__v ut-suffix">°C</span><span class="ut__alt" aria-hidden="true">°F</span></span></li>
      <li class="ut__h"><span class="ut__hl">5 PM</span><span class="ut__ht ut__swap"><span class="ut__v ut-c" data-c="21">21</span><span class="ut__alt" aria-hidden="true">70</span></span><span class="ut__hs ut__swap"><span class="ut__v ut-suffix">°C</span><span class="ut__alt" aria-hidden="true">°F</span></span></li>
    </ul>
    <ul class="ut__days">
      <li class="ut__d"><span class="ut__dl">Today</span><span class="ut__dv ut__swap"><span class="ut__v ut-c" data-c="18">18</span><span class="ut__alt" aria-hidden="true">64</span></span><span class="ut__dd">/</span><span class="ut__dv ut__swap"><span class="ut__v ut-c" data-c="27">27</span><span class="ut__alt" aria-hidden="true">81</span></span><span class="ut__ds ut__swap"><span class="ut__v ut-suffix">°C</span><span class="ut__alt" aria-hidden="true">°F</span></span></li>
      <li class="ut__d"><span class="ut__dl">Saturday</span><span class="ut__dv ut__swap"><span class="ut__v ut-c" data-c="17">17</span><span class="ut__alt" aria-hidden="true">63</span></span><span class="ut__dd">/</span><span class="ut__dv ut__swap"><span class="ut__v ut-c" data-c="29">29</span><span class="ut__alt" aria-hidden="true">84</span></span><span class="ut__ds ut__swap"><span class="ut__v ut-suffix">°C</span><span class="ut__alt" aria-hidden="true">°F</span></span></li>
    </ul>
  </section>
</main>
<script>
// 단위를 고르면 카드 안 모든 온도가 같은 순간에 환산되고, 고른 값은 저장돼 다음에 열어도 그대로다.
var utRoot = document.getElementById('ut');
var utCells = utRoot.querySelectorAll('.ut-c');
var utSuffixes = utRoot.querySelectorAll('.ut-suffix');
var utButtons = utRoot.querySelectorAll('.ut__u');
function utShow(unit) {
  for (var i = 0; i < utCells.length; i++) {
    var c = Number(utCells[i].getAttribute('data-c'));
    utCells[i].textContent = unit === 'f' ? String(Math.round(c * 9 / 5 + 32)) : String(c);
  }
  for (var j = 0; j < utSuffixes.length; j++) {
    utSuffixes[j].textContent = unit === 'f' ? '°F' : '°C';
  }
  for (var k = 0; k < utButtons.length; k++) {
    var on = utButtons[k].getAttribute('data-unit') === unit;
    utButtons[k].classList.toggle('is-on', on);
    utButtons[k].setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  utRoot.classList.toggle('is-f', unit === 'f');
}
function utRemember(unit) {
  try { localStorage.setItem('ut-unit', unit); } catch (err) { /* 저장이 막힌 창에서는 이번 화면만 */ }
}
utRoot.addEventListener('click', function (e) {
  var btn = e.target.closest('.ut__u');
  if (!btn) return;
  utRoot.classList.remove('is-demo');
  var unit = btn.getAttribute('data-unit');
  utShow(unit);
  utRemember(unit);
});
// 저장돼 있던 단위를 되살린다 — 없으면 섭씨
var utSaved = null;
try { utSaved = localStorage.getItem('ut-unit'); } catch (err2) { utSaved = null; }
utShow(utSaved === 'f' ? 'f' : 'c');
</script>
</body>
</html>
