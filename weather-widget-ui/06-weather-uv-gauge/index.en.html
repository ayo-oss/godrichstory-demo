<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UV index gauge — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage stage--yellow">
  <section class="uv is-demo" id="uv" aria-label="UV index gauge">
    <div class="uv__dial" role="img" aria-label="UV index dial">
      <span class="uv__disc" aria-hidden="true"></span>
      <span class="uv__needle" aria-hidden="true"></span>
      <span class="uv__hub" aria-hidden="true"></span>
    </div>
    <div class="uv__panel">
      <p class="uv__value"><output id="uv-num" class="uv__swap"><span class="uv__v">6</span><span class="uv__alt" aria-hidden="true">2</span></output></p>
      <p class="uv__grade" id="uv-grade"><span class="uv__swap"><span class="uv__v">High</span><span class="uv__alt" aria-hidden="true">Low</span></span></p>
      <p class="uv__advice" id="uv-advice"><span class="uv__swap"><span class="uv__v">Wear sunscreen and a hat</span><span class="uv__alt" aria-hidden="true">Fine to stay out long</span></span></p>
      <label class="uv__lab" for="uv-range">Index</label>
      <input class="uv__range" id="uv-range" type="range" min="0" max="11" step="1" value="6" aria-label="Pick a UV index">
    </div>
  </section>
</main>
<script>
// 바늘은 0~11 을 -90도~+90도로 바꿔 돈다. 등급과 지침 문장이 값에 함께 따라온다.
var uvRoot = document.getElementById('uv');
var uvRange = document.getElementById('uv-range');
var uvNeedle = uvRoot.querySelector('.uv__needle');
var uvNum = document.getElementById('uv-num');
var uvGrade = document.getElementById('uv-grade');
var uvAdvice = document.getElementById('uv-advice');
var uvLevels = [
  { max: 2, grade: 'Low', advice: 'Fine to stay out long' },
  { max: 5, grade: 'Moderate', advice: 'Take shade breaks' },
  { max: 7, grade: 'High', advice: 'Wear sunscreen and a hat' },
  { max: 10, grade: 'Very high', advice: 'Stay indoors at midday' },
  { max: 11, grade: 'Extreme', advice: 'Limit time outside' }
];
function uvLevel(v) {
  for (var i = 0; i < uvLevels.length; i++) {
    if (v <= uvLevels[i].max) return uvLevels[i];
  }
  return uvLevels[uvLevels.length - 1];
}
function uvApply(v) {
  uvNeedle.style.transform = 'rotate(' + (v / 11 * 180 - 90) + 'deg)';
  uvNum.querySelector('.uv__v').textContent = String(v);
  var lv = uvLevel(v);
  uvGrade.querySelector('.uv__v').textContent = lv.grade;
  uvAdvice.querySelector('.uv__v').textContent = lv.advice;
  uvRange.setAttribute('aria-valuenow', String(v));
}
uvRange.addEventListener('input', function () {
  uvRoot.classList.remove('is-demo');
  uvApply(Number(uvRange.value));
});
uvApply(Number(uvRange.value));
</script>
</body>
</html>
