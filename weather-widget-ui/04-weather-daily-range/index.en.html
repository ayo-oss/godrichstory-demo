</main>
<script>
// 막대의 left/width 는 주간 전체 범위 안에서 비율로 계산한다 — 값이 바뀌어도 자리가 저절로 맞는다.
var drRoot = document.getElementById('dr');
var drRows = drRoot.querySelectorAll('.dr__row');
var drMin = Infinity;
var drMax = -Infinity;
var drDays = [];
for (var i = 0; i < drRows.length; i++) {
  var lo = Number(drRows[i].getAttribute('data-lo'));
  var hi = Number(drRows[i].getAttribute('data-hi'));
  drDays.push({ row: drRows[i], lo: lo, hi: hi });
  drMin = Math.min(drMin, lo);
  drMax = Math.max(drMax, hi);
}
var drSpan = drMax - drMin;
for (var j = 0; j < drDays.length; j++) {
  var d = drDays[j];
  var bar = d.row.querySelector('.dr__bar');
  bar.style.left = ((d.lo - drMin) / drSpan * 100) + '%';
  bar.style.width = ((d.hi - d.lo) / drSpan * 100) + '%';
}
// 상세 문장은 날짜마다 미리 써 둔 전체 문장에서 뽑는다 — 언어팩 사본에서 통째로 바뀐다
var drDetails = [
  'Today · 9° swing',
  'Tomorrow · 9° swing',
  'Friday · 8° swing',
  'Saturday · 12° swing',
  'Sunday · 8° swing'
];
function drPick(idx) {
  for (var k = 0; k < drRows.length; k++) {
    var on = k === idx;
    drRows[k].classList.toggle('is-sel', on);
    drRows[k].setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  drRoot.querySelector('.dr__detail').textContent = drDetails[idx];
}
drRoot.addEventListener('click', function (e) {
  var row = e.target.closest('.dr__row');
  if (!row) return;
  drRoot.classList.remove('is-demo');
  for (var m = 0; m < drDays.length; m++) {
    if (drDays[m].row === row) { drPick(m); break; }
  }
});
</script>
