<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live clock with time-of-day theme — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage stage--ink">
  <section class="lc is-demo" id="lc" aria-label="リアルタイム時計と一日のテーマ">
    <div class="lc__skywrap" aria-hidden="true">
      <span class="lc__band lc__band--morning"></span>
      <span class="lc__band lc__band--noon"></span>
      <span class="lc__band lc__band--evening"></span>
      <span class="lc__band lc__band--night"></span>
      <span class="lc__orb lc__orb--sun"><svg viewBox="0 0 256 256" width="22" height="22" fill="currentColor"><path d="M184,128a56,56,0,1,1-56-56A56,56,0,0,1,184,128Z" opacity="0.2"/><path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"/></svg></span>
      <span class="lc__orb lc__orb--moon"><svg viewBox="0 0 256 256" width="20" height="20" fill="currentColor"><path d="M210.69,158.18A88,88,0,1,1,97.82,45.31,96.08,96.08,0,0,0,192,160,96.78,96.78,0,0,0,210.69,158.18Z" opacity="0.2"/><path d="M240,96a8,8,0,0,1-8,8H216v16a8,8,0,0,1-16,0V104H184a8,8,0,0,1,0-16h16V72a8,8,0,0,1,16,0V88h16A8,8,0,0,1,240,96ZM144,56h8v8a8,8,0,0,0,16,0V56h8a8,8,0,0,0,0-16h-8V32a8,8,0,0,0-16,0v8h-8a8,8,0,0,0,0,16Zm72.77,97a8,8,0,0,1,1.43,8A96,96,0,1,1,95.07,37.8a8,8,0,0,1,10.6,9.06A88.07,88.07,0,0,0,209.14,150.33,8,8,0,0,1,216.77,153Zm-19.39,14.88c-1.79.09-3.59.14-5.38.14A104.11,104.11,0,0,1,88,64c0-1.79,0-3.59.14-5.38A80,80,0,1,0,197.38,167.86Z"/></svg></span>
    </div>
    <div class="lc__body">
      <p class="lc__clock" role="timer" aria-live="off" aria-label="現在の時刻"><span class="lc__swap"><span class="lc__v" id="lc-now">14:32</span><span class="lc__alt" aria-hidden="true">14:33</span></span></p>
      <p class="lc__date" id="lc-date">土・9/12</p>
      <p class="lc__hi"><span class="lc__swap"><span class="lc__v" id="lc-hi-v">こんにちは</span><span class="lc__alt" aria-hidden="true">こんばんは</span></span></p>
    </div>
  </section>
</main>
<script>
// 실제 시계 — 매초 돌되 분이 바뀔 때만 글자를 고친다.
// 낭독기가 매초 소리치지 않게 role="timer" + aria-live="off" 로 묵음한다.
// 인사말·요일은 전체 문장 배열에서 뽑는다 — 언어팩 사본에서는 배열 안 글자가 통째로 바뀐다.
var lcRoot = document.getElementById('lc');
var lcNow = document.getElementById('lc-now');
var lcDate = document.getElementById('lc-date');
var lcHi = document.getElementById('lc-hi-v');
var lcWeek = ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'];
var lcHiWords = ['おはようございます', 'こんにちは', 'こんばんは', 'おやすみなさい'];
var lcLastMinute = -1;
function lcTheme(h) {
  if (h >= 5 && h < 12) return 'is-morning';
  if (h < 18) return 'is-noon';
  if (h < 22) return 'is-evening';
  return 'is-night';
}
function lcGreeting(h) {
  if (h >= 5 && h < 12) return lcHiWords[0];
  if (h < 18) return lcHiWords[1];
  if (h < 22) return lcHiWords[2];
  return lcHiWords[3];
}
function lcPad(n) { return n < 10 ? '0' + n : String(n); }
function lcTick() {
  var d = new Date();
  if (d.getMinutes() !== lcLastMinute) {
    lcLastMinute = d.getMinutes();
    lcNow.textContent = lcPad(d.getHours()) + ':' + lcPad(d.getMinutes());
    lcDate.textContent = lcWeek[d.getDay()] + ' · ' + (d.getMonth() + 1) + '/' + d.getDate();
    lcHi.textContent = lcGreeting(d.getHours());
    lcRoot.classList.remove('is-morning', 'is-noon', 'is-evening', 'is-night');
    lcRoot.classList.add(lcTheme(d.getHours()));
    // 격자 루프에 겹쳐 둔 다음 분 글자도 진짜 시각에서 만든다 — 맞지 않는 시간이 화면에 남지 않게
    var nx = new Date(d.getTime() + 60000);
    var alt = lcRoot.querySelector('.lc__swap .lc__alt');
    if (alt) { alt.textContent = lcPad(nx.getHours()) + ':' + lcPad(nx.getMinutes()); }
  }
}
setInterval(lcTick, 1000);
lcTick();
</script>
</body>
</html>
