        <p class="wc__word wc__swap"><span class="wc__v">Sunny</span><span class="wc__alt" aria-hidden="true">Rain</span></p>
      </div>
      <p class="wc__range">
        <span class="wc__hi">High <span class="wc__swap"><span class="wc__v">27</span><span class="wc__alt" aria-hidden="true">21</span></span>°</span>
        <span class="wc__lo">Low <span class="wc__swap"><span class="wc__v">18</span><span class="wc__alt" aria-hidden="true">16</span></span>°</span>
      </p>
      <div class="wc__conds" role="group" aria-label="Choose a sky condition">
        <button class="wc__c is-on" type="button" data-cond="sunny" aria-pressed="true">Sunny</button>
        <button class="wc__c" type="button" data-cond="cloudy" aria-pressed="false">Cloudy</button>
        <button class="wc__c" type="button" data-cond="rainy" aria-pressed="false">Rain</button>
        <button class="wc__c" type="button" data-cond="snowy" aria-pressed="false">Snow</button>
      </div>

</main>
<script>
// 하늘 상태를 고르면 카드 전체(하늘·아이콘·온도·최고최저)가 한 세트로 맞바뀐다.
// 값은 데이터 속성에 들어 있고, 화면 글자는 언어팩이 바꾼 텍스트 노드만 고친다.
var wcRoot = document.getElementById('wc');
// 상태 문구도 한 세트다 — 언어팩 사본이 이 한국어 글자를 통째로 바꾼다(04 의 drDetails 와 같은 방식)
var wcData = {
  sunny:  { temp: 24, hi: 27, lo: 18, word: 'Sunny' },
  cloudy: { temp: 21, hi: 24, lo: 17, word: 'Cloudy' },
  rainy:  { temp: 19, hi: 21, lo: 16, word: 'Rain' },
  snowy:  { temp: -2, hi: 1, lo: -5, word: 'Snow' }
};
var wcSwaps = [
  { box: '.wc__temp .wc__swap', key: 'temp' },
  { box: '.wc__word', key: 'word' },
  { box: '.wc__hi .wc__swap', key: 'hi' },
  { box: '.wc__lo .wc__swap', key: 'lo' }
];
function wcApply(cond) {
  wcRoot.classList.remove('is-sunny', 'is-cloudy', 'is-rainy', 'is-snowy');
  wcRoot.classList.add('is-' + cond);
  for (var i = 0; i < wcSwaps.length; i++) {
    var box = wcRoot.querySelector(wcSwaps[i].box);
    box.querySelector('.wc__v').textContent = String(wcData[cond][wcSwaps[i].key]);
  }
  var btns = wcRoot.querySelectorAll('.wc__c');
  for (var j = 0; j < btns.length; j++) {
    var on = btns[j].getAttribute('data-cond') === cond;
    btns[j].setAttribute('aria-pressed', on ? 'true' : 'false');
    btns[j].classList.toggle('is-on', on);
  }
  // 아이콘이 한 번 솟았다 내려앉는다 — 상태가 바뀌었다는 피드백
  var art = wcRoot.querySelector('.wc__art');
  art.classList.remove('is-pop');
  void art.offsetWidth;
  art.classList.add('is-pop');
}
wcRoot.addEventListener('click', function (e) {
  var btn = e.target.closest('.wc__c');
  if (!btn) return;
  wcRoot.classList.remove('is-demo');
  wcApply(btn.getAttribute('data-cond'));
});
</script>
