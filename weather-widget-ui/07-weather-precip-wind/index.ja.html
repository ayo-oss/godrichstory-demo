<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precipitation bars and wind compass — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage stage--orange">
  <section class="pw is-demo" id="pw" aria-label="降水確率と風">
    <div class="pw__rain">
      <p class="pw__rt">降水確率</p>
      <div class="pw__cols" role="img" aria-label="時間ごとの降水確率バー">
        <div class="pw__col"><span class="pw__pct">10</span><span class="pw__barwrap"><span class="pw__bar" style="--h: 20%"></span></span><span class="pw__hr">12時</span></div>
        <div class="pw__col"><span class="pw__pct">35</span><span class="pw__barwrap"><span class="pw__bar" style="--h: 44%"></span></span><span class="pw__hr">13時</span></div>
        <div class="pw__col"><span class="pw__pct">60</span><span class="pw__barwrap"><span class="pw__bar" style="--h: 68%"></span></span><span class="pw__hr">14時</span></div>
        <div class="pw__col"><span class="pw__pct">80</span><span class="pw__barwrap"><span class="pw__bar" style="--h: 88%"></span></span><span class="pw__hr">15時</span></div>
        <div class="pw__col"><span class="pw__pct">45</span><span class="pw__barwrap"><span class="pw__bar" style="--h: 52%"></span></span><span class="pw__hr">16時</span></div>
        <div class="pw__col"><span class="pw__pct">20</span><span class="pw__barwrap"><span class="pw__bar" style="--h: 28%"></span></span><span class="pw__hr">17時</span></div>
      </div>
    </div>
    <div class="pw__wind">
      <div class="pw__compass" aria-hidden="true">
        <span class="pw__tick pw__tick--n">北</span>
        <span class="pw__tick pw__tick--e">東</span>
        <span class="pw__tick pw__tick--s">南</span>
        <span class="pw__tick pw__tick--w">西</span>
        <span class="pw__needle"></span>
        <span class="pw__hub"></span>
      </div>
      <p class="pw__wlab" aria-live="polite"><span class="pw__swap"><span class="pw__v">北西の風 3m/s</span><span class="pw__alt" aria-hidden="true">北西の風 5m/s</span></span></p>
      <button class="pw__btn" type="button" id="pw-turn"><svg viewBox="0 0 256 256" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M184,184a32,32,0,0,1-32,32c-13.7,0-26.95-8.93-31.5-21.22a8,8,0,0,1,15-5.56C137.74,195.27,145,200,152,200a16,16,0,0,0,0-32H40a8,8,0,0,1,0-16H152A32,32,0,0,1,184,184Zm-64-80a32,32,0,0,0,0-64c-13.7,0-26.95,8.93-31.5,21.22a8,8,0,0,0,15,5.56C105.74,60.73,113,56,120,56a16,16,0,0,1,0,32H24a8,8,0,0,0,0,16Zm88-32c-13.7,0-26.95,8.93-31.5,21.22a8,8,0,0,0,15,5.56C193.74,92.73,201,88,208,88a16,16,0,0,1,0,32H32a8,8,0,0,0,0,16H208a32,32,0,0,0,0-64Z" opacity="0.2"/><path d="M120,96a24,24,0,1,1,24-24A24,24,0,0,1,120,96Zm88-16a24,24,0,1,0,24,24A24,24,0,0,0,208,80Zm-56,80a24,24,0,1,0,24,24A24,24,0,0,0,152,160Z"/></svg>方向を変える</button>
    </div>
  </section>
</main>
<script>
// 강수 막대는 scaleY 로 아래에서 자라고(높이값은 --h 로 정적으로 들어 있다),
// 나침반 바늘은 풍향 각도로 돈다 — 누르면 여덟 방향을 돌아가며 바꾼다.
var pwRoot = document.getElementById('pw');
var pwDirs = [
  { deg: 0, name: '北の風', speed: 2 },
  { deg: 45, name: '北東の風', speed: 3 },
  { deg: 90, name: '東の風', speed: 4 },
  { deg: 135, name: '南東の風', speed: 3 },
  { deg: 180, name: '南の風', speed: 2 },
  { deg: 225, name: '南西の風', speed: 4 },
  { deg: 270, name: '西の風', speed: 5 },
  { deg: 315, name: '北西の風', speed: 3 }
];
var pwIdx = 7;
var pwNeedle = pwRoot.querySelector('.pw__needle');
var pwLabel = pwRoot.querySelector('.pw__wlab');
function pwApply(i) {
  var d = pwDirs[i];
  pwNeedle.style.transform = 'rotate(' + d.deg + 'deg)';
  pwLabel.querySelector('.pw__v').textContent = d.name + ' ' + d.speed + 'm/s';
}
document.getElementById('pw-turn').addEventListener('click', function () {
  pwRoot.classList.remove('is-demo');
  pwIdx = (pwIdx + 1) % pwDirs.length;
  pwApply(pwIdx);
});
pwApply(pwIdx);
</script>
</body>
</html>
