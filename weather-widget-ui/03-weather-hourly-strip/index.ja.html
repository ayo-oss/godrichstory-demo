<script>
// 실제 시각과 가장 가까운 칸을 찾아 점을 켜고 aria-current 를 붙인다.
var hsRoot = document.getElementById('hs');
var hsCells = hsRoot.querySelectorAll('.hs__cell');
var hsNow = new Date().getHours();
var hsBest = 0;
var hsGap = 99;
for (var i = 0; i < hsCells.length; i++) {
  var gap = Math.abs(Number(hsCells[i].getAttribute('data-hour')) - hsNow);
  if (gap < hsGap) { hsGap = gap; hsBest = i; }
}
var hsTarget = hsCells[hsBest];
hsTarget.classList.add('is-now');
hsTarget.setAttribute('aria-current', 'true');
// 칸을 누르면 미리보기 루프를 그만두고 진짜 스크롤로 쓰게 둔다
hsRoot.addEventListener('pointerdown', function () {
  hsRoot.classList.remove('is-demo');
}, { once: true });
</script>
