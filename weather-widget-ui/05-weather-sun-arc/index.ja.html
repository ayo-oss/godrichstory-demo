<html lang="ja">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun path arc — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage stage--ink">
  <section class="sa is-demo" id="sa" aria-label="太陽の道">
    <p class="sa__title">太陽の道</p>
    <div class="sa__skywrap">
      <span class="sa__band sa__band--morning" aria-hidden="true"></span>
      <span class="sa__band sa__band--noon" aria-hidden="true"></span>
      <span class="sa__band sa__band--evening" aria-hidden="true"></span>
      <svg class="sa__arc" viewBox="0 0 240 90" aria-hidden="true">
        <path class="sa__path" d="M 20 80 A 120 60 0 0 1 220 80" fill="none" stroke="rgba(23,20,26,.35)" stroke-width="2" stroke-dasharray="4 6"/>
        <line x1="8" y1="80" x2="232" y2="80" stroke="rgba(23,20,26,.3)" stroke-width="2"/>
      </svg>
      <span class="sa__sun" aria-hidden="true"><svg viewBox="0 0 256 256" width="18" height="18" fill="currentColor"><path d="M184,128a56,56,0,1,1-56-56A56,56,0,0,1,184,128Z" opacity="0.2"/><path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"/></svg></span>
      <span class="sa__rise" aria-hidden="true"><svg viewBox="0 0 256 256" width="14" height="14" fill="currentColor"><path d="M192,144a64.33,64.33,0,0,1-2,16H66a64,64,0,1,1,126-16Z" opacity="0.2"/><path d="M240,152H199.55a73.54,73.54,0,0,0,0-48H240a8,8,0,0,1,0,16ZM117.66,53.66,128,43.31l10.34,10.35a8,8,0,0,0,11.32-11.32l-18-18a8,8,0,0,0-11.32,0l-18,18a8,8,0,0,0,11.32,11.32ZM72,24a8,8,0,0,0-8,8V48H48a8,8,0,0,0,0,16h16v16a8,8,0,0,0,16,0V64h16a8,8,0,0,0,0-16H80V32A8,8,0,0,0,72,24ZM168,184H32a8,8,0,0,1,0-16H168a48,48,0,0,1,0,96h-4.6a8,8,0,1,1-3.2-15.68c1.28-.26,2.53-.32,3.8-.32a32,32,0,0,0,0-64ZM120,96a40,40,0,0,0-38.66,29.76A8,8,0,0,0,88.9,136a8.14,8.14,0,0,0,2.22-.31A40,40,0,1,0,120,96Zm0,64a24,24,0,0,1-8.69-1.63,56,56,0,0,1,15.06-25.74A23.94,23.94,0,0,1,120,160Z"/></svg></span>
      <span class="sa__set" aria-hidden="true"><svg viewBox="0 0 256 256" width="14" height="14" fill="currentColor"><path d="M192,144a64.33,64.33,0,0,1-2,16H66a64,64,0,1,1,126-16Z" opacity="0.2"/><path d="M240,152H199.55a73.54,73.54,0,0,0,0-48H240a8,8,0,0,1,0,16ZM117.66,53.66,128,43.31l10.34,10.35a8,8,0,0,0,11.32-11.32l-18-18a8,8,0,0,0-11.32,0l-18,18a8,8,0,0,0,11.32,11.32ZM72,24a8,8,0,0,0-8,8V48H48a8,8,0,0,0,0,16h16v16a8,8,0,0,0,16,0V64h16a8,8,0,0,0,0-16H80V32A8,8,0,0,0,72,24ZM168,184H32a8,8,0,0,1,0-16H168a48,48,0,0,1,0,96h-4.6a8,8,0,1,1-3.2-15.68c1.28-.26,2.53-.32,3.8-.32a32,32,0,0,0,0-64ZM120,96a40,40,0,0,0-38.66,29.76A8,8,0,0,0,88.9,136a8.14,8.14,0,0,0,2.22-.31A40,40,0,1,0,120,96Zm0,64a24,24,0,0,1-8.69-1.63,56,56,0,0,1,15.06-25.74A23.94,23.94,0,0,1,120,160Z"/></svg></span>
    </div>
    <div class="sa__ctrl">
      <label class="sa__lab" for="sa-hour">時刻</label>
      <input class="sa__range" id="sa-hour" type="range" min="6" max="20" step="1" value="14" aria-label="時間帯を選ぶ">
      <output class="sa__time" id="sa-time" for="sa-hour">14時</output>
    </div>
  </section>
</main>
<script>
// 해는 아치를 따라 굴러가고(offset-path), 시각을 고르면 그 높이에 멈춘다.
// 하늘색은 아침/낮/저녁 세 밴드 — 실제 조작에서는 클래스로, 루프에서는 컷으로 맞바뀐다.
var saRoot = document.getElementById('sa');
var saSun = saRoot.querySelector('.sa__sun');
var saRange = document.getElementById('sa-hour');
var saTime = document.getElementById('sa-time');
// 時刻 낱말은 배열 리터럴에서 뽑는다 — 언어팩 사본에서 배열 안 글자가 통째로 바뀐다
var saHours = ['6時', '7時', '8時', '9時', '10時', '11時', '12時', '13時', '14時', '15時', '16時', '17時', '18時', '19時', '20時'];
function saBandClass(t) {
  if (t < 0.25) return 'is-morning';
  if (t < 0.72) return 'is-noon';
  return 'is-evening';
}
function saApply(hour) {
  var t = (hour - 6) / 14;
  saSun.style.offsetDistance = (t * 100) + '%';
  saRoot.classList.remove('is-morning', 'is-noon', 'is-evening');
  saRoot.classList.add(saBandClass(t));
  saTime.textContent = saHours[hour - 6];
  saRange.setAttribute('aria-valuenow', String(hour));
}
saRange.addEventListener('input', function () {
  saRoot.classList.remove('is-demo');
  saApply(Number(saRange.value));
});
saApply(Number(saRange.value));
</script>
</body>
</html>
