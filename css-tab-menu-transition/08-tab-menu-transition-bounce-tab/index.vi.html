<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bounce tab — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="bt is-demo">
    <input type="radio" name="bt-tab" id="bt-1" class="bt__radio" checked>
    <input type="radio" name="bt-tab" id="bt-2" class="bt__radio">
    <input type="radio" name="bt-tab" id="bt-3" class="bt__radio">
    <div class="bt__nav">
      <label class="bt__tab" for="bt-1"><span class="bt__text">Tất cả</span></label>
      <label class="bt__tab" for="bt-2"><span class="bt__text">Đang xử lý</span></label>
      <label class="bt__tab" for="bt-3"><span class="bt__text">Hoàn tất</span></label>
      <span class="bt__trail" aria-hidden="true"></span>
      <span class="bt__indicator" aria-hidden="true"></span>
    </div>
  </div>
</main>
<script>
// 이동은 :checked 만으로 이미 동작한다. 실제 클릭이 오면 데모 루프(.is-demo)만 뗀다.
document.querySelectorAll('.bt__radio').forEach(function (r) {
  r.addEventListener('pointerdown', function () { document.querySelector('.bt').classList.remove('is-demo'); });
});
</script>
</body>
</html>
