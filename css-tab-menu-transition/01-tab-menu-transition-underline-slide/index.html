<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sliding underline indicator — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="us is-demo">
    <input type="radio" name="us-tab" id="us-1" class="us__radio" checked>
    <input type="radio" name="us-tab" id="us-2" class="us__radio">
    <input type="radio" name="us-tab" id="us-3" class="us__radio">
    <div class="us__nav">
      <label class="us__tab" for="us-1">개요</label>
      <label class="us__tab" for="us-2">분석</label>
      <label class="us__tab" for="us-3">설정</label>
      <span class="us__indicator" aria-hidden="true"></span>
    </div>
    <div class="us__panels">
      <p class="us__panel us__panel--1">오늘 방문자와 핵심 지표를 한눈에 봅니다.</p>
      <p class="us__panel us__panel--2">기간별 추이를 표와 그래프로 비교합니다.</p>
      <p class="us__panel us__panel--3">알림과 팀 권한을 이 탭에서 관리합니다.</p>
    </div>
  </div>
</main>
<script>
// 이동은 :checked 만으로 이미 동작한다. 실제 클릭이 오면 데모 루프(.is-demo)만 뗀다.
document.querySelectorAll('.us__radio').forEach(function (r) {
  r.addEventListener('pointerdown', function () { document.querySelector('.us').classList.remove('is-demo'); });
});
</script>
</body>
</html>
