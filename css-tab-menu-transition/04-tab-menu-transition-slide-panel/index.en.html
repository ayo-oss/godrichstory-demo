<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel slide — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sp is-demo">
    <input type="radio" name="sp-tab" id="sp-1" class="sp__radio" checked>
    <input type="radio" name="sp-tab" id="sp-2" class="sp__radio">
    <input type="radio" name="sp-tab" id="sp-3" class="sp__radio">
    <div class="sp__nav">
      <label class="sp__tab" for="sp-1">Step 1</label>
      <label class="sp__tab" for="sp-2">Step 2</label>
      <label class="sp__tab" for="sp-3">Step 3</label>
      <span class="sp__indicator" aria-hidden="true"></span>
    </div>
    <div class="sp__viewport">
      <div class="sp__track">
        <p class="sp__panel">Enter a shipping address.</p>
        <p class="sp__panel">Choose a payment method.</p>
        <p class="sp__panel">Review the order and complete it.</p>
      </div>
    </div>
  </div>
</main>
<script>
// 이동은 :checked 만으로 이미 동작한다. 실제 클릭이 오면 데모 루프(.is-demo)만 뗀다.
document.querySelectorAll('.sp__radio').forEach(function (r) {
  r.addEventListener('pointerdown', function () { document.querySelector('.sp').classList.remove('is-demo'); });
});
</script>
</body>
</html>
