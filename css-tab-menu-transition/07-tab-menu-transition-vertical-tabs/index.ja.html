<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertical tabs — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="vt is-demo">
    <input type="radio" name="vt-tab" id="vt-1" class="vt__radio" checked>
    <input type="radio" name="vt-tab" id="vt-2" class="vt__radio">
    <input type="radio" name="vt-tab" id="vt-3" class="vt__radio">
    <div class="vt__nav">
      <span class="vt__trail" aria-hidden="true"></span>
      <span class="vt__indicator" aria-hidden="true"></span>
      <label class="vt__tab" for="vt-1">アカウント</label>
      <label class="vt__tab" for="vt-2">通知</label>
      <label class="vt__tab" for="vt-3">セキュリティ</label>
    </div>
    <div class="vt__panels">
      <p class="vt__panel vt__panel--1">名前とメールアドレスを変更します。</p>
      <p class="vt__panel vt__panel--2">プッシュ・メール通知を選びます。</p>
      <p class="vt__panel vt__panel--3">パスワードと2段階認証を管理します。</p>
    </div>
  </div>
</main>
<script>
// 이동은 :checked 만으로 이미 동작한다. 실제 클릭이 오면 데모 루프(.is-demo)만 뗀다.
document.querySelectorAll('.vt__radio').forEach(function (r) {
  r.addEventListener('pointerdown', function () { document.querySelector('.vt').classList.remove('is-demo'); });
});
</script>
</body>
</html>
