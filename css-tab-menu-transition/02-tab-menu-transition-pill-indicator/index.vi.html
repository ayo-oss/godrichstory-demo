<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pill background move — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pi is-demo">
    <input type="radio" name="pi-tab" id="pi-1" class="pi__radio" checked>
    <input type="radio" name="pi-tab" id="pi-2" class="pi__radio">
    <input type="radio" name="pi-tab" id="pi-3" class="pi__radio">
    <div class="pi__nav">
      <span class="pi__pill" aria-hidden="true"></span>
      <label class="pi__tab" for="pi-1">Tất cả</label>
      <label class="pi__tab" for="pi-2">Tháng này</label>
      <label class="pi__tab" for="pi-3">Năm nay</label>
    </div>
  </div>
</main>
<script>
// 필 배경은 :checked 만으로 옮겨간다. 실제 클릭이 오면 데모 루프(.is-demo)만 뗀다.
document.querySelectorAll('.pi__radio').forEach(function (r) {
  r.addEventListener('pointerdown', function () { document.querySelector('.pi').classList.remove('is-demo'); });
});
</script>
</body>
</html>
