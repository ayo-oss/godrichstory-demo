<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel fade — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="fp is-demo">
    <input type="radio" name="fp-tab" id="fp-1" class="fp__radio" checked>
    <input type="radio" name="fp-tab" id="fp-2" class="fp__radio">
    <input type="radio" name="fp-tab" id="fp-3" class="fp__radio">
    <div class="fp__nav">
      <label class="fp__tab" for="fp-1">Details</label>
      <label class="fp__tab" for="fp-2">Reviews</label>
      <label class="fp__tab" for="fp-3">Q&A</label>
    </div>
    <div class="fp__panels">
      <p class="fp__panel fp__panel--1">Material, sizing, and care instructions at a glance.</p>
      <p class="fp__panel fp__panel--2">342 recent ratings and reviews, all in one place.</p>
      <p class="fp__panel fp__panel--3">Request an exchange or refund right here.</p>
    </div>
  </div>
</main>
<script>
// 페이드는 :checked 만으로 이미 동작한다. 실제 클릭이 오면 데모 루프(.is-demo)만 뗀다.
document.querySelectorAll('.fp__radio').forEach(function (r) {
  r.addEventListener('pointerdown', function () { document.querySelector('.fp').classList.remove('is-demo'); });
});
</script>
</body>
</html>
