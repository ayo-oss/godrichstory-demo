<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizontal scroll-snap tabs — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="st is-demo">
    <input type="radio" name="st-tab" id="st-1" class="st__radio" checked>
    <input type="radio" name="st-tab" id="st-2" class="st__radio">
    <input type="radio" name="st-tab" id="st-3" class="st__radio">
    <input type="radio" name="st-tab" id="st-4" class="st__radio">
    <input type="radio" name="st-tab" id="st-5" class="st__radio">
    <div class="st__scroller">
      <div class="st__nav">
        <label class="st__tab" for="st-1">All</label>
        <label class="st__tab" for="st-2">Clothing</label>
        <label class="st__tab" for="st-3">Shoes</label>
        <label class="st__tab" for="st-4">Bags</label>
        <label class="st__tab" for="st-5">Accessories</label>
        <span class="st__trail" aria-hidden="true"></span>
        <span class="st__indicator" aria-hidden="true"></span>
      </div>
    </div>
  </div>
</main>
<script>
// 스크롤은 브라우저 scroll-snap 이 처리한다. 이동은 :checked 만으로 동작. 실제 클릭이면 데모 루프만 뗀다.
document.querySelectorAll('.st__radio').forEach(function (r) {
  r.addEventListener('pointerdown', function () { document.querySelector('.st').classList.remove('is-demo'); });
});
</script>
</body>
</html>
