<body>
<main class="stage">
<div class="cf is-demo" id="cf">
  <div class="cf__board" data-role="board" tabindex="0" role="application" aria-label="2048 board: click it, then use the arrow keys or swipe to move">
    <canvas class="cf__canvas" data-role="canvas" width="480" height="300" aria-hidden="true"></canvas>
  </div>
  <p class="cf__sr">A 2048 board works out its next move and swipes, tiles stretch as they slide, merge, change color and throw fragments, and when it locks up it collapses and starts over</p>
  <p class="cf__status" data-role="status" aria-live="off">Setting up the board</p>
  <button class="cf__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("cf");
    if (!root) return;
    // 판 좌표 — 캔버스 안은 늘 480×300. 화면에 보이는 크기와 상관없이 계산은 이 좌표로 한다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 따라가기 비율 — 1 − e^(−rate·dt). 프레임 시간이 달라도 1초에 같은 만큼 다가간다
    function follow(rate, dt) { return 1 - Math.exp(-rate * dt); }
    // 시드 고정 난수 — 같은 시드면 같은 시연이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function deg(rad) { return rad * 180 / Math.PI; }
    function makeSpring(x) { return { x: x, v: 0, to: x }; }
    const SPRING_SUBSTEP = 1 / 240;
    function stepSpring(s, stiffness, damping, dt) {
        let left = dt;
        while (left > 1e-9) {
            const h = Math.min(SPRING_SUBSTEP, left);
            s.v += (stiffness * (s.to - s.x) - damping * s.v) * h;
            s.x += s.v * h;
            left -= h;
        }
    }
    function snapSpring(s, x) { s.x = x; s.v = 0; s.to = x; }
    function roughWidth(ch, px, weight) {
        const wide = ch.charCodeAt(0) >= 0x1100;
        const base = ch === ' ' ? 0.28 : (wide ? 0.95 : 0.6);
        return px * base * (weight >= 700 ? 1.06 : 1);
    }
    // 글꼴이 다 온 뒤 잰 폭
    let glyphWidth = roughWidth;
    // 문자열 폭 = 글자 하나씩 잰 폭의 합
    function textWidth(s, px, weight, m) {
        let w = 0;
        for (const ch of Array.from(s)) {
            w += m(ch, px, weight);
        }
        return w;
    }
    // 장면 시계(초)와 상태 줄 글자 — 장면 계산이 고치고, 화면 쪽이 읽어 그린다
    let sceneT = 0;
    let simStatus = '';
    // 자동 시연이 수를 두는가 — 사람이 판에서 방향키·쓸기(04 는 백스페이스도)로 처음 손대면 꺼지고, 그 뒤로는 사람 수만 둔다
    let autoOn = true;
    // 파스텔 팔레트 — 크림 바탕 Up 라벤더·민트·버터·산호. 글자는 진한 쪽으로 명도 차를 둔다
    const PAPER = [251, 247, 238];
    const PAPER_DIM = [236, 228, 214];
    const BOARD_BG = [214, 204, 190];
    const CELL_BG = [232, 224, 212];
    const INK = [44, 38, 58];
    const INK_SOFT = [104, 96, 118];
    const CREAM = [255, 251, 242];
    const LAVENDER = [196, 182, 238];
    const MINT = [164, 218, 196];
    const BUTTER = [246, 224, 150];
    const CORAL = [244, 170, 152];
    const SKY = [170, 206, 238];
    const PINK = [244, 190, 212];
    const MINT_DEEP = [36, 116, 90];
    const CORAL_DEEP = [178, 66, 52];
    const VIOLET_DEEP = [84, 58, 160];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // ── 판 규칙 ──────────────────────────────────────────────────
    // 판은 칸 16개. 칸 번호 = 행 × 4 + 열, 값 0 = empty
    const SIZE = 4;
    const CELLS = SIZE * SIZE;
    // 방향 번호 — 0 Left · 1 Up · 2 Right · 3 Down
    const DIR_LEFT = 0;
    const DIR_UP = 1;
    const DIR_RIGHT = 2;
    const DIR_DOWN = 3;
    const DIR_NAMES = ['Left', 'Up', 'Right', 'Down'];
    // 방향마다 판을 시계 방향으로 몇 번 돌리면 그 방향의 벽이 왼쪽에 오는가 — 위는 세 번, 오른쪽은 두 번, 아래는 한 번
    const TURNS = [0, 3, 2, 1];
    // 새 타일이 4 일 확률 — 나머지는 2
    const FOUR_CHANCE = 0.1;
    // 칸 번호 표를 시계 방향으로 한 번 돌린다 — 새 (행 r, 열 c) 자리에 원래 (행 3 − c, 열 r) 칸이 온다
    function rotateCW(g) {
        const out = [];
        for (let r = 0; r < SIZE; r += 1) {
            for (let c = 0; c < SIZE; c += 1) {
                out.push(g[(SIZE - 1 - c) * SIZE + r]);
            }
        }
        return out;
    }
    // 방향 dir 로 밀 때 읽는 순서 — order[r × 4 + k] = 돌린 판의 행 r, Left 벽에서 k 번째 자리에 오는 원래 칸 번호
    function pushOrder(dir) {
        let g = [];
        for (let i = 0; i < CELLS; i += 1) {
            g.push(i);
        }
        for (let t = 0; t < TURNS[dir]; t += 1) {
            g = rotateCW(g);
        }
        return g;
    }
    const ORDERS = [0, 1, 2, 3].map(pushOrder);
    function compressLine(line, lock) {
        const out = [];
        for (const t of line) {
            if (!t) {
                continue;
            }
            const last = out.length ? out[out.length - 1] : null;
            if (last && last.v === t.v && !(lock && last.merged)) {
                last.v *= 2;
                last.ids.push(t.id);
                last.merged = true;
            }
            else {
                out.push({ ids: [t.id], v: t.v, merged: false });
            }
        }
        return out;
    }
    function gridOf(tiles) {
        const g = [];
        for (let i = 0; i < CELLS; i += 1) {
            g.push(null);
        }
        for (const t of tiles) {
            g[t.cell] = t;
        }
        return g;
    }
    function valuesOf(tiles) {
        const v = [];
        for (let i = 0; i < CELLS; i += 1) {
            v.push(0);
        }
        for (const t of tiles) {
            v[t.cell] = t.v;
        }
        return v;
    }
    function copyTiles(tiles) { return tiles.map(function (t) { return { id: t.id, v: t.v, cell: t.cell }; }); }
    // 한 수 밀기 — 판을 돌려 그 방향을 왼쪽으로 만든 순서표로 네 줄을 읽고, 줄마다 compressLine 한 결과를 원래 칸 번호로 되돌려 적는다
    function slideBoard(g, dir, lock) {
        const cells = gridOf(g.tiles);
        const order = ORDERS[dir];
        const byId = {};
        for (const t of g.tiles) {
            byId[t.id] = t;
        }
        const slides = [];
        const merges = [];
        const after = [];
        let gain = 0;
        for (let r = 0; r < SIZE; r += 1) {
            const line = [];
            for (let k = 0; k < SIZE; k += 1) {
                line.push(cells[order[r * SIZE + k]]);
            }
            compressLine(line, lock).forEach(function (o, slot) {
                const to = order[r * SIZE + slot];
                for (const id of o.ids) {
                    slides.push({ id: id, v: byId[id].v, from: byId[id].cell, to: to });
                }
                if (o.merged) {
                    const nid = g.nextId;
                    g.nextId += 1;
                    merges.push({ id: nid, v: o.v, cell: to, parents: o.ids.slice() });
                    after.push({ id: nid, v: o.v, cell: to });
                    gain += o.v;
                }
                else {
                    after.push({ id: o.ids[0], v: o.v, cell: to });
                }
            });
        }
        const moved = merges.length > 0 || slides.some(function (s) { return s.from !== s.to; });
        return { dir: dir, moved: moved, slides: slides, merges: merges, gain: gain, before: copyTiles(g.tiles), after: after, spawn: null };
    }
    function emptyCells(tiles) {
        const used = [];
        for (let i = 0; i < CELLS; i += 1) {
            used.push(false);
        }
        for (const t of tiles) {
            used[t.cell] = true;
        }
        const out = [];
        for (let i = 0; i < CELLS; i += 1) {
            if (!used[i]) {
                out.push(i);
            }
        }
        return out;
    }
    // empty 하나를 시드 난수로 뽑아 2 또는 4 를 놓는다 — 4 는 FOUR_CHANCE 의 확률
    function spawnTile(g) {
        const empty = emptyCells(g.tiles);
        if (!empty.length) {
            return null;
        }
        const cell = empty[Math.floor(g.rng() * empty.length)];
        const v = g.rng() < FOUR_CHANCE ? 4 : 2;
        const t = { id: g.nextId, v: v, cell: cell };
        g.nextId += 1;
        g.tiles.push(t);
        return t;
    }
    // 한 수 두기 — 움직였을 때만 판을 바꾸고 새 타일을 하나 돋운다. 안 움직이는 방향은 수가 아니다(새 타일도 없음)
    function playMove(g, dir, lock) {
        const mv = slideBoard(g, dir, lock);
        if (!mv.moved) {
            return mv;
        }
        g.tiles = mv.after.map(function (t) { return { id: t.id, v: t.v, cell: t.cell }; });
        g.score += mv.gain;
        mv.spawn = spawnTile(g);
        return mv;
    }
    function makeGame(values, seed) {
        const tiles = [];
        let id = 1;
        values.forEach(function (v, cell) {
            if (v) {
                tiles.push({ id: id, v: v, cell: cell });
                id += 1;
            }
        });
        return { tiles: tiles, nextId: id, score: 0, rng: makeRng(seed) };
    }
    function equalPairs(vals) {
        const out = [];
        for (let r = 0; r < SIZE; r += 1) {
            for (let c = 0; c < SIZE; c += 1) {
                const i = r * SIZE + c;
                if (!vals[i]) {
                    continue;
                }
                if (c + 1 < SIZE && vals[i + 1] === vals[i]) {
                    out.push({ a: i, b: i + 1 });
                }
                if (r + 1 < SIZE && vals[i + SIZE] === vals[i]) {
                    out.push({ a: i, b: i + SIZE });
                }
            }
        }
        return out;
    }
    function countEmpty(vals) { let n = 0; for (const v of vals) {
        if (!v) {
            n += 1;
        }
    } return n; }
    function isStuck(vals) { return countEmpty(vals) === 0 && equalPairs(vals).length === 0; }
    function rowOf(cell) { return Math.floor(cell / SIZE); }
    function colOf(cell) { return cell % SIZE; }
    // ── 쓸기 방향 판정 ───────────────────────────────────────────
    // 시작점·끝점 차(dx, dy, 화면 px — y 는 아래로)와 걸린 시간(ms)으로 네 부채꼴 중 하나를 고르거나 버린다
    // 이 길이보다 짧은 궤적은 버린다 — 다만 FLICK_SPEED_PX_S 보다 빠르면 짧아도 받아들인다(빠른 튕김)
    const SWIPE_MIN_PX = 24;
    const FLICK_SPEED_PX_S = 450;
    // 튕김이라도 이보다 짧으면 손가락이 떨린 것으로 본다
    const FLICK_MIN_PX = 8;
    // 부채꼴 경계(45°·135°·225°·315°) 양쪽 이 각도 안은 애매한 대각선 — 버린다
    const DEAD_ZONE_DEG = 10;
    const VERDICT_OK = 'ok';
    const VERDICT_SHORT = 'short';
    const VERDICT_DIAGONAL = 'diagonal';
    const VERDICT_FLICK = 'flick';
    // 화면 각(0° Right, 90° Down)을 부채꼴로 — 가장 가까운 90° 배수가 방향
    const ANGLE_TO_DIR = [DIR_RIGHT, DIR_DOWN, DIR_LEFT, DIR_UP];
    function judgeSwipe(dx, dy, ms) {
        const length = Math.sqrt(dx * dx + dy * dy);
        const speed = length / Math.max(1, ms) * 1000;
        const angle = (deg(Math.atan2(dy, dx)) + 360) % 360;
        const base = { dir: -1, angle: angle, length: length, speed: speed, reason: VERDICT_SHORT };
        const flick = length >= FLICK_MIN_PX && speed >= FLICK_SPEED_PX_S;
        if (length < SWIPE_MIN_PX && !flick) {
            return base;
        }
        // 경계까지 남은 각 — 90° 마다 되풀이되는 자리에서 45° 와의 차
        const toBorder = Math.abs((angle % 90) - 45);
        if (toBorder < DEAD_ZONE_DEG) {
            base.reason = VERDICT_DIAGONAL;
            return base;
        }
        base.dir = ANGLE_TO_DIR[Math.round(angle / 90) % 4];
        base.reason = length < SWIPE_MIN_PX ? VERDICT_FLICK : VERDICT_OK;
        return base;
    }
    // ── 타일 색과 숫자 크기 ──────────────────────────────────────
    // 단계 = log2(값) — 2 는 1단계, 2048 은 11단계, 8192 는 13단계
    function stepOf(v) { return v > 0 ? Math.log2(v) : 0; }
    // 파스텔 기준색과 그 색이 놓이는 단계 — 사이 단계는 oklab 에서 곧게 섞는다
    const TILE_ANCHORS = [[250, 238, 218], [246, 224, 150], [244, 170, 152], [244, 190, 212], [196, 182, 238], [170, 206, 238], [164, 218, 196]];
    const ANCHOR_STEPS = [1, 3, 5, 7, 9, 11, 13];
    function toLinear(c) { const x = c / 255; return x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }
    function fromLinear(x) { const c = x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055; return clamp(c * 255, 0, 255); }
    // sRGB → oklab (지각 균등 색 공간 — 같은 거리만큼 섞으면 눈에도 비슷한 만큼 바뀐다)
    function rgbToOklab(c) {
        const r = toLinear(c[0]);
        const g = toLinear(c[1]);
        const b = toLinear(c[2]);
        const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
        const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
        const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
        return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
            1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
            0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
    }
    function oklabToRgb(c) {
        const l = Math.pow(c[0] + 0.3963377774 * c[1] + 0.2158037573 * c[2], 3);
        const m = Math.pow(c[0] - 0.1055613458 * c[1] - 0.0638541728 * c[2], 3);
        const s = Math.pow(c[0] - 0.0894841775 * c[1] - 1.2914855480 * c[2], 3);
        return [fromLinear(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s),
            fromLinear(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s),
            fromLinear(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s)];
    }
    const ANCHOR_LABS = TILE_ANCHORS.map(rgbToOklab);
    // 단계(소수 가능)의 색 — 양옆 기준 단계 사이 몫 k 로 oklab 세 값을 각각 곧게 섞는다(선형 보간). 끝 바깥은 끝 색
    function tileColor(step) {
        const last = ANCHOR_STEPS.length - 1;
        if (step <= ANCHOR_STEPS[0]) {
            return TILE_ANCHORS[0];
        }
        if (step >= ANCHOR_STEPS[last]) {
            return TILE_ANCHORS[last];
        }
        let i = 0;
        while (step > ANCHOR_STEPS[i + 1]) {
            i += 1;
        }
        const k = (step - ANCHOR_STEPS[i]) / (ANCHOR_STEPS[i + 1] - ANCHOR_STEPS[i]);
        const a = ANCHOR_LABS[i];
        const b = ANCHOR_LABS[i + 1];
        return oklabToRgb([lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]);
    }
    // 비교용 — 같은 두 색을 sRGB 값 그대로 섞은 색
    function tileColorRgb(step) {
        const last = ANCHOR_STEPS.length - 1;
        if (step <= ANCHOR_STEPS[0]) {
            return TILE_ANCHORS[0];
        }
        if (step >= ANCHOR_STEPS[last]) {
            return TILE_ANCHORS[last];
        }
        let i = 0;
        while (step > ANCHOR_STEPS[i + 1]) {
            i += 1;
        }
        const k = (step - ANCHOR_STEPS[i]) / (ANCHOR_STEPS[i + 1] - ANCHOR_STEPS[i]);
        return mix(TILE_ANCHORS[i], TILE_ANCHORS[i + 1], k);
    }
    // 숫자 크기 fitted — 칸 폭 × DIGIT_PX_RATIO 로 시작해, 잰 숫자 폭이 칸 폭 × DIGIT_FILL 을 넘으면 그 비율만큼 줄인다
    const DIGIT_PX_RATIO = 0.5;
    const DIGIT_FILL = 0.8;
    const DIGIT_WEIGHT = 800;
    function fitDigits(text, cell, m) {
        const px0 = cell * DIGIT_PX_RATIO;
        const raw = textWidth(text, px0, DIGIT_WEIGHT, m);
        const room = cell * DIGIT_FILL;
        const scale = raw > room ? room / raw : 1;
        return { px: px0 * scale, width: raw * scale, rawWidth: raw, scale: scale };
    }
    // 합친 타일 크기 스프링 — 크기 1 에서 POP_KICK(1/초)의 속도로 차올라 넘쳤다가 1 로 앉는다. 새 타일은 0 에서 자란다
    const POP_STIFFNESS = 420;
    const POP_DAMPING = 18;
    const POP_KICK = 6;
    // 새 타일은 미끄러짐이 다 끝난 뒤 이만큼 있다가 돋는다
    const SPAWN_DELAY_S = 0.04;
    // 되감기 때 새 타일이 오그라들어 사라지는 데 쓰는 시간
    const SHRINK_S = 0.22;
    // 숨는 시각이 없는 타일 — 아주 먼 뒤
    const NO_HIDE = 1e9;
    function makeSprite(t, show) {
        const c = colOf(t.cell);
        const r = rowOf(t.cell);
        return { id: t.id, v: t.v, fx: c, fy: r, tx: c, ty: r, t0: 0, dur: 0, show: show, hide: NO_HIDE, pop: makeSpring(1), squash: makeSpring(0), axis: 0, landed: true, lockUntil: -1 };
    }
    function makeView(tiles, style) {
        return { sprites: tiles.map(function (t) { return makeSprite(t, -1); }), style: style };
    }
    // 판 그대로 다시 놓기 — 움직임 줄이기·사람 수를 멈춘 화면에서 바로 보일 때
    function settleView(view, tiles) {
        view.sprites = tiles.map(function (t) { return makeSprite(t, -1); });
    }
    function slideTime(style, cells) { return cells > 0 ? style.base + style.perCell * (cells - 1) : 0; }

    // ① chooseMove(07)로 방향을 고르고 ② 그 방향으로 흉내 낸 쓸기 궤적을 그려 judgeSwipe(03)로 판정한 뒤
    // ③ 늘었다 줄며 미끄러지고(02) ④ 잠금 있는 한 줄 압축으로 합쳐(01) ⑤ 단계 색으로 그리고(05) ⑥ 조각을 튀기며 흔들린다(06).
    // 판이 막히거나(empty 0 · 짝 0) ROUND_MOVES 수를 두면 타일이 떨어져 튄 뒤(08) 처음 판으로 돌아간다 — 탐색이 막힘을 잘 피해 한참 동안 막히지 않는다
    const START_09 = [
        2, 0, 4, 2,
        8, 4, 16, 4,
        16, 64, 32, 8,
        128, 256, 64, 16
    ];
    const SEED_09 = 909;
    const SLIDE_BASE_S = 0.16;
    const SLIDE_PER_CELL_S = 0.04;
    const STYLE_09 = { base: SLIDE_BASE_S, perCell: SLIDE_PER_CELL_S, easeIn: true };
    const STRETCH_PER_SPEED = 0.012;
    const STRETCH_MAX = 1.4;
    const LAND_KICK = 0.25;
    const LAND_STIFFNESS = 600;
    const LAND_DAMPING = 16;
    const BURST_PER_STEP = 3;
    const BURST_SPEED_PER_STEP = 34;
    const BURST_GRAVITY = 520;
    const BURST_DRAG = 2.4;
    const BURST_LIFE_S = 0.8;
    const BURST_LIFT = 60;
    const SHAKE_PER_MERGE = 1.6;
    const SHAKE_DECAY = 6;
    const SHAKE_HZ = 16;
    const FALL_GRAVITY = 1600;
    const BOUNCE = 0.42;
    const REST_SPEED = 70;
    const COLLAPSE_SPREAD_S = 0.3;
    const FALL_SPREAD_VX = 220;
    // 수 사이 간격과 흉내 낸 쓸기 궤적(길이 px · 걸린 ms)
    const FIRST_MOVE_09 = 0.2;
    const MOVE_GAP_09 = 0.42;
    const SWIPE_LEN_PX = 70;
    const SWIPE_MS = 130;
    // 방향 번호(Left·Up·Right·Down)의 화면 각 — 0° Right, 90° Down
    const DIR_ANGLE_09 = [180, 270, 0, 90];
    // 판이 막힌 뒤 무너지기까지, 다 떨어진 뒤 처음 판으로 돌아가기까지
    const STUCK_HOLD_S = 0.35;
    const FALLEN_HOLD_S = 0.5;
    const SCORE_RATE = 10;
    // 한 바퀴에 두는 수 — 이만큼 두면 막히지 않아도 무너뜨리고 처음 판으로
    const ROUND_MOVES = 16;
    const LOOP_S = 600;
    // 판 자리 — 화면과 같은 값
    const F09_X = 214;
    const F09_Y = 16;
    const F09_CELL = 52;
    const F09_GAP = 6;
    const FLOOR_09 = 290;
    let hero = makePlayer(START_09, SEED_09, STYLE_09, true, 0.25);
    let fxRng = makeRng(99);
    let shards9 = [];
    let bodies9 = [];
    let pend9 = [];
    let swipeAt = -1;
    let swipeDir = -1;
    let choice9 = null;
    let nextAt09 = FIRST_MOVE_09;
    let shakeAt9 = -10;
    let shakeAmp9 = 0;
    let scoreShown = 0;
    let stuckAt9 = -1;
    let fallAt9 = -1;
    let moves9 = 0;
    function reset() {
        hero = makePlayer(START_09, SEED_09, STYLE_09, true, 0.25);
        fxRng = makeRng(99);
        shards9 = [];
        bodies9 = [];
        pend9 = [];
        swipeAt = -1;
        swipeDir = -1;
        choice9 = null;
        nextAt09 = sceneT + FIRST_MOVE_09;
        shakeAt9 = -10;
        shakeAmp9 = 0;
        scoreShown = 0;
        stuckAt9 = -1;
        fallAt9 = -1;
        moves9 = 0;
        stuckReal9 = false;
    }
    function relayout() { }
    function center09(col, row) {
        return [F09_X + F09_GAP + col * (F09_CELL + F09_GAP) + F09_CELL / 2, F09_Y + F09_GAP + row * (F09_CELL + F09_GAP) + F09_CELL / 2];
    }
    function shake9(t) { return t < shakeAt9 ? 0 : shakeAmp9 * Math.exp(-SHAKE_DECAY * (t - shakeAt9)); }
    function scales9(s, speed) {
        const along = Math.min(STRETCH_MAX, 1 + STRETCH_PER_SPEED * speed) * Math.max(0.55, 1 + s.squash.x);
        return s.axis === 0 ? [along, 1 / along] : [1 / along, along];
    }
    const STATUS_HERO = 'swipe {d} · merges {m} · score {s}';
    const STATUS_FALL = 'empty 0 · pairs 0: collapsing after {n} moves';
    const STATUS_ROUND = '{n} moves: round over, collapsing';
    let stuckReal9 = false;
    function afterMove9(mv) {
        if (!mv || !mv.moved) {
            return;
        }
        moves9 += 1;
        simStatus = STATUS_HERO.replace('{d}', DIR_NAMES[mv.dir]).replace('{m}', String(mv.merges.length)).replace('{s}', String(hero.game.score));
        let first = NO_HIDE;
        for (const s of hero.view.sprites) {
            for (const m of mv.merges) {
                if (s.id === m.id) {
                    first = Math.min(first, s.show);
                    pend9.push({ at: s.show, cell: m.cell, v: m.v });
                }
            }
        }
        if (mv.merges.length) {
            shakeAmp9 = shake9(first) + SHAKE_PER_MERGE * mv.merges.length;
            shakeAt9 = first;
        }
        stuckReal9 = isStuck(valuesOf(hero.game.tiles));
        if (stuckReal9 || moves9 >= ROUND_MOVES) {
            stuckAt9 = hero.busyUntil + STUCK_HOLD_S;
        }
    }
    function humanMove(dir) { if (stuckAt9 < 0) {
        afterMove9(pushInput(hero, dir, sceneT));
    } }
    function onSwipe(v) { if (v.dir >= 0) {
        humanMove(v.dir);
    } }
    function burst9(cell, v, t) {
        const k = stepOf(v);
        const c = center09(colOf(cell), rowOf(cell));
        for (let i = 0; i < BURST_PER_STEP * k; i += 1) {
            const a = fxRng() * TAU;
            const sp = BURST_SPEED_PER_STEP * k * (0.55 + 0.45 * fxRng());
            shards9.push({ x: c[0], y: c[1], vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - BURST_LIFT, born: t, rot: fxRng() * TAU, spin: (fxRng() - 0.5) * 14, size: 3 + 3 * fxRng(), c: tileColor(k) });
        }
    }
    function startFall9() {
        bodies9 = hero.game.tiles.map(function (t) {
            const c = center09(colOf(t.cell), rowOf(t.cell));
            return { v: t.v, x: c[0], y: c[1], vx: (fxRng() - 0.5) * FALL_SPREAD_VX, vy: 0, delay: fxRng() * COLLAPSE_SPREAD_S, resting: false, rot: 0, spin: (fxRng() - 0.5) * 3 };
        });
    }
    function stepFall9(dt, since) {
        let all = true;
        for (const b of bodies9) {
            if (b.resting) {
                continue;
            }
            all = false;
            if (since < b.delay) {
                continue;
            }
            b.vy += FALL_GRAVITY * dt;
            b.y += b.vy * dt;
            b.x = clamp(b.x + b.vx * dt, F09_CELL / 2, W - F09_CELL / 2);
            b.rot += b.spin * dt;
            const floor = FLOOR_09 - F09_CELL / 2;
            if (b.y >= floor) {
                b.y = floor;
                b.vy = -b.vy * BOUNCE;
                b.vx *= 0.6;
                b.spin *= 0.5;
                if (Math.abs(b.vy) < REST_SPEED) {
                    b.vy = 0;
                    b.resting = true;
                }
            }
        }
        return all;
    }
    let fallenAt9 = -1;
    function update(dt) {
        if (stuckAt9 >= 0) {
            if (fallAt9 < 0 && sceneT >= stuckAt9) {
                fallAt9 = sceneT;
                startFall9();
                simStatus = (stuckReal9 ? STATUS_FALL : STATUS_ROUND).replace('{n}', String(moves9));
            }
            if (fallAt9 >= 0) {
                if (stepFall9(dt, sceneT - fallAt9) && fallenAt9 < 0) {
                    fallenAt9 = sceneT;
                }
                if (fallenAt9 >= 0 && sceneT >= fallenAt9 + FALLEN_HOLD_S) {
                    fallenAt9 = -1;
                    reset();
                }
            }
        }
        else {
            // 쓸기 흉내 — 고른 방향으로 궤적을 그리고, 다 그리면 judgeSwipe 로 판정해 받은 방향으로 둔다
            if (autoOn && swipeAt < 0 && sceneT >= nextAt09) {
                choice9 = chooseMove(valuesOf(hero.game.tiles), SEARCH_DEPTH);
                if (choice9.best >= 0) {
                    swipeAt = sceneT;
                    swipeDir = choice9.best;
                }
                nextAt09 = sceneT + MOVE_GAP_09;
            }
            if (swipeAt >= 0 && sceneT >= swipeAt + SWIPE_MS / 1000) {
                const a = DIR_ANGLE_09[swipeDir] * Math.PI / 180;
                const v = judgeSwipe(Math.cos(a) * SWIPE_LEN_PX, Math.sin(a) * SWIPE_LEN_PX, SWIPE_MS);
                swipeAt = -1;
                if (v.dir >= 0) {
                    afterMove9(pushInput(hero, v.dir, sceneT));
                }
            }
            afterMove9(pumpQueue(hero, sceneT));
        }
        for (const p of pend9.filter(function (q) { return sceneT >= q.at; })) {
            burst9(p.cell, p.v, sceneT);
        }
        pend9 = pend9.filter(function (q) { return sceneT < q.at; });
        const drag = Math.exp(-BURST_DRAG * dt);
        for (const s of shards9) {
            s.vy += BURST_GRAVITY * dt;
            s.vx *= drag;
            s.vy *= drag;
            s.x += s.vx * dt;
            s.y += s.vy * dt;
            s.rot += s.spin * dt;
        }
        shards9 = shards9.filter(function (s) { return sceneT - s.born < BURST_LIFE_S; });
        scoreShown += (hero.game.score - scoreShown) * follow(SCORE_RATE, dt);
        for (const l of stepView(hero.view, sceneT, dt)) {
            l.s.squash.v = -LAND_KICK * l.speed;
        }
        for (const s of hero.view.sprites) {
            stepSpring(s.squash, LAND_STIFFNESS, LAND_DAMPING, dt);
        }
    }
    function settle() {
        settlePlayer(hero);
        shards9 = [];
        pend9 = [];
        swipeAt = -1;
        shakeAmp9 = 0;
        scoreShown = hero.game.score;
        if (stuckAt9 >= 0) {
            reset();
            settlePlayer(hero);
        }
    }
    // 정지 판 — 처음 판에서 자동 플레이가 고른 첫 수까지 둔 판
    function restPose() {
        choice9 = chooseMove(valuesOf(hero.game.tiles), SEARCH_DEPTH);
        if (choice9.best >= 0) {
            afterMove9(doMove(hero, choice9.best, 0));
        }
        settle();
    }
    // 09 화면 — Right 큰 판(흔들림만큼 밀림 · 쓸기 궤적 · 조각), Left 제목·score·largest tile·네 방향 막대
    const F09 = { x: F09_X, y: F09_Y, cell: F09_CELL, gap: F09_GAP };
    const LABEL_TITLE = '2048';
    const LABEL_TAGLINE = 'push equal numbers together';
    const LABEL_SCORE = 'score';
    const LABEL_BEST = 'largest tile';
    const LABEL_NEXT = 'next-move value';
    const HERO_BARS = [BUTTER, LAVENDER, MINT, SKY];
    function bindInput(signal) { void signal; }
    function draw() {
        clearStage(PAPER);
        label(LABEL_TITLE, 24, 44, INK, 1, 44, 800, 'left');
        label(LABEL_TAGLINE, 26, 76, INK_SOFT, 1, 11, 700, 'left');
        label(LABEL_SCORE, 26, 104, INK_SOFT, 1, 10, 700, 'left');
        label(String(Math.round(scoreShown)), 26, 126, VIOLET_DEEP, 1, 24, 800, 'left');
        label(LABEL_BEST, 26, 156, INK_SOFT, 1, 10, 700, 'left');
        const best = maxTile(hero);
        if (best) {
            drawTileAt(best, 50, 186, 44, 1, 1, 1, stepOf(best), true);
        }
        // 네 방향 기대값 막대 — 가장 낮은 방향 0.25, 가장 높은 방향 1
        label(LABEL_NEXT, 104, 156, INK_SOFT, 1, 10, 700, 'left');
        if (choice9) {
            const ok = choice9.scores.filter(function (s) { return !isNaN(s); });
            const lo = Math.min.apply(null, ok);
            const hi = Math.max.apply(null, ok);
            for (let d = 0; d < 4; d += 1) {
                const s = choice9.scores[d];
                const k = isNaN(s) ? 0 : (hi - lo < 1e-9 ? 1 : 0.25 + 0.75 * (s - lo) / (hi - lo));
                fillRound(106 + d * 21, 208 - 44 * k, 15, 44 * k, 4, HERO_BARS[d], d === choice9.best ? 1 : 0.6);
            }
        }
        const off = shake9(sceneT);
        const ph = TAU * SHAKE_HZ * (sceneT - shakeAt9);
        ctx.save();
        ctx.translate(off * Math.sin(ph), off * 0.6 * Math.cos(ph * 1.3));
        drawBoardBack(F09, 1);
        if (fallAt9 < 0) {
            drawView(hero.view, F09, sceneT, 1, scales9);
        }
        ctx.restore();
        for (const b of bodies9) {
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.rot);
            drawTileAt(b.v, 0, 0, F09.cell, 1, 1, 1, stepOf(b.v), true);
            ctx.restore();
        }
        for (const s of shards9) {
            const life = (sceneT - s.born) / BURST_LIFE_S;
            ctx.save();
            ctx.translate(s.x, s.y);
            ctx.rotate(s.rot);
            ctx.fillStyle = rgba(mix(s.c, INK, 0.18), 1 - life * life);
            ctx.fillRect(-s.size / 2, -s.size / 2, s.size, s.size);
            ctx.restore();
        }
        // 흉내 낸 쓸기 — 판 가운데에서 고른 방향으로 그려지는 궤적
        if (swipeAt >= 0) {
            const u = clamp((sceneT - swipeAt) / (SWIPE_MS / 1000), 0, 1);
            const a = DIR_ANGLE_09[swipeDir] * Math.PI / 180;
            const cx = F09.x + frameSize(F09) / 2;
            const cy = F09.y + frameSize(F09) / 2;
            const len = SWIPE_LEN_PX;
            line(cx, cy, cx + Math.cos(a) * len * u, cy + Math.sin(a) * len * u, 9, INK, 0.35);
            disc(cx + Math.cos(a) * len * u, cy + Math.sin(a) * len * u, 12, INK, 0.3);
        }
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시가 붙어 있는가 — 사람이 처음 손대면 표시를 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    // 리스너는 한 묶음으로 달고 정리할 때 한 번에 뗀다
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 사람이 한 수를 두면 자동 시연은 수를 그만 두고, 판은 그 자리에서 사람 판이 된다
    function takeOver() {
        wake();
        autoOn = false;
    }
    // 멈춘 화면(움직임 줄이기·Pause)에서 둔 수는 미끄러짐 없이 결과 판으로 바로 그린다
    function showNow() {
        if (still || paused) {
            settle();
            draw();
            pushStatus();
        }
    }
    // 한 프레임에 넘기는 시간 상한(초) — 탭을 오래 숨겼다 돌아온 첫 프레임에도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    // 장면 시계를 dt 만큼 — 자동 시연 중에는 한 바퀴(LOOP_S)를 넘으면 처음 판으로 되돌려 다시 시연한다
    function advance(dt) {
        sceneT += dt;
        if (autoOn && sceneT >= LOOP_S) {
            sceneT -= LOOP_S;
            reset();
        }
        update(dt);
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        draw();
        pushStatus();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 시계 다시 맞추기 — 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 동작 줄이기 — 루프를 돌리지 않고 정지 판 한 장만 그린다
    function showRest() {
        stopLoop();
        if (autoOn) {
            sceneT = 0;
            reset();
            restPose();
        }
        else {
            settle();
        }
        draw();
        pushStatus();
    }
    function play() {
        if (autoOn) {
            sceneT = 0;
            reset();
        }
        draw();
        pushStatus();
        if (!paused) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 방향키 — 판에 포커스가 있을 때만 받는다. 판 밖에서는 화살표가 원래대로 페이지를 스크롤한다
    const KEY_DIRS = { ArrowLeft: DIR_LEFT, ArrowUp: DIR_UP, ArrowRight: DIR_RIGHT, ArrowDown: DIR_DOWN };
    boardBox.addEventListener('keydown', function (e) {
        const dir = KEY_DIRS[e.key];
        if (dir === undefined || e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        e.preventDefault();
        takeOver();
        humanMove(dir);
        showNow();
    }, { signal: off.signal });
    // 쓸기 — 누른 자리와 뗀 자리의 차, 걸린 시간을 쓸기 판정(judgeSwipe)에 넣는다. 화면 px 그대로
    let downX = 0;
    let downY = 0;
    let downT = -1;
    boardBox.addEventListener('pointerdown', function (e) {
        downX = e.clientX;
        downY = e.clientY;
        downT = e.timeStamp;
    }, { signal: off.signal });
    boardBox.addEventListener('pointerup', function (e) {
        if (downT < 0) {
            return;
        }
        const v = judgeSwipe(e.clientX - downX, e.clientY - downY, e.timeStamp - downT);
        downT = -1;
        if (v.length < FLICK_MIN_PX) {
            return;
        }
        takeOver();
        onSwipe(v);
        showNow();
    }, { signal: off.signal });
    boardBox.addEventListener('pointercancel', function () { downT = -1; }, { signal: off.signal });
    // 탭이 숨으면 루프를 멈추고, 돌아오면 시계를 다시 맞춰 시작한다 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still && fontsReady) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 페이지를 연 채 바뀌면 — 켜지면 정지 판으로 멈추고, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw();
    }, { signal: off.signal });
    bindInput(off.signal);
    fitCanvas();
    // 숫자 폭은 글꼴이 다 온 뒤에 잰다 — 그 전에 잰 폭은 대체 글꼴의 폭이라 글꼴이 바뀌는 순간 글자 크기 맞춤이 틀어진다.
    // 나중에 다른 글꼴이 더 오면(loadingdone) 다시 잰다
    let fontsReady = false;
    document.fonts.addEventListener('loadingdone', function () {
        if (!fontsReady) {
            return;
        }
        remeasure();
        draw();
    }, { signal: off.signal });
    document.fonts.ready.then(function () {
        if (off.signal.aborted) {
            return;
        }
        fontsReady = true;
        remeasure();
        if (still) {
            showRest();
        }
        else {
            play();
        }
    });
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
