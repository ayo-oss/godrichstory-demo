<title>이동 칸 수에 맞춰 늘었다 줄어드는 미끄러짐 — demo</title>

<body>
<main class="stage">
<div class="cf is-demo" id="cf">
  <div class="cf__board" data-role="board" tabindex="0" role="application" aria-label="2048 판 — 누른 뒤 화살표 키나 쓸기로 한 수">
    <canvas class="cf__canvas" data-role="canvas" width="480" height="300" aria-hidden="true"></canvas>
  </div>
  <p class="cf__sr">먼 타일일수록 빠르게 미끄러지며 넓이를 지킨 채 늘었다가 닿는 순간 납작해지는 판과, 미끄러지는 중 들어온 입력을 버리는 작은 판을 나란히 보여 준다</p>
  <p class="cf__status" data-role="status" aria-live="off">첫 수를 기다리는 중</p>
  <button class="cf__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("cf");
    if (!root) return;
    // 판 좌표 — 캔버스 안은 늘 480×300. 화면에 보이는 크기와 상관없이 계산은 이 좌표로 한다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 따라가기 비율 — 1 − e^(−rate·dt). 프레임 시간이 달라도 1초에 같은 만큼 다가간다
    function follow(rate, dt) { return 1 - Math.exp(-rate * dt); }
    // 시드 고정 난수 — 같은 시드면 같은 시연이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function deg(rad) { return rad * 180 / Math.PI; }
    function makeSpring(x) { return { x: x, v: 0, to: x }; }
    const SPRING_SUBSTEP = 1 / 240;
    function stepSpring(s, stiffness, damping, dt) {
        let left = dt;
        while (left > 1e-9) {
            const h = Math.min(SPRING_SUBSTEP, left);
            s.v += (stiffness * (s.to - s.x) - damping * s.v) * h;
            s.x += s.v * h;
            left -= h;
        }
    }
    function snapSpring(s, x) { s.x = x; s.v = 0; s.to = x; }
    function roughWidth(ch, px, weight) {
        const wide = ch.charCodeAt(0) >= 0x1100;
        const base = ch === ' ' ? 0.28 : (wide ? 0.95 : 0.6);
        return px * base * (weight >= 700 ? 1.06 : 1);
    }
    // 글꼴이 다 온 뒤 잰 폭
    let glyphWidth = roughWidth;
    // 문자열 폭 = 글자 하나씩 잰 폭의 합
    function textWidth(s, px, weight, m) {
        let w = 0;
        for (const ch of Array.from(s)) {
            w += m(ch, px, weight);
        }
        return w;
    }
    // 장면 시계(초)와 상태 줄 글자 — 장면 계산이 고치고, 화면 쪽이 읽어 그린다
    let sceneT = 0;
    let simStatus = '';
    // 자동 시연이 수를 두는가 — 사람이 판에서 방향키·쓸기(04 는 백스페이스도)로 처음 손대면 꺼지고, 그 뒤로는 사람 수만 둔다
    let autoOn = true;
    // 파스텔 팔레트 — 크림 바탕 위 라벤더·민트·버터·산호. 글자는 진한 쪽으로 명도 차를 둔다
    const PAPER = [251, 247, 238];
    const PAPER_DIM = [236, 228, 214];
    const BOARD_BG = [214, 204, 190];
    const CELL_BG = [232, 224, 212];
    const INK = [44, 38, 58];
    const INK_SOFT = [104, 96, 118];
    const CREAM = [255, 251, 242];
    const LAVENDER = [196, 182, 238];
    const MINT = [164, 218, 196];
    const BUTTER = [246, 224, 150];
    const CORAL = [244, 170, 152];
    const SKY = [170, 206, 238];
    const PINK = [244, 190, 212];
    const MINT_DEEP = [36, 116, 90];
    const CORAL_DEEP = [178, 66, 52];
    const VIOLET_DEEP = [84, 58, 160];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // ── 판 규칙 ──────────────────────────────────────────────────
    // 판은 칸 16개. 칸 번호 = 행 × 4 + 열, 값 0 = 빈칸
    const SIZE = 4;
    const CELLS = SIZE * SIZE;
    // 방향 번호 — 0 왼쪽 · 1 위 · 2 오른쪽 · 3 아래
    const DIR_LEFT = 0;
    const DIR_UP = 1;
    const DIR_RIGHT = 2;
    const DIR_DOWN = 3;
    const DIR_NAMES = ['왼쪽', '위', '오른쪽', '아래'];
    // 방향마다 판을 시계 방향으로 몇 번 돌리면 그 방향의 벽이 왼쪽에 오는가 — 위는 세 번, 오른쪽은 두 번, 아래는 한 번
    const TURNS = [0, 3, 2, 1];
    // 새 타일이 4 일 확률 — 나머지는 2
    const FOUR_CHANCE = 0.1;
    // 칸 번호 표를 시계 방향으로 한 번 돌린다 — 새 (행 r, 열 c) 자리에 원래 (행 3 − c, 열 r) 칸이 온다
    function rotateCW(g) {
        const out = [];
        for (let r = 0; r < SIZE; r += 1) {
            for (let c = 0; c < SIZE; c += 1) {
                out.push(g[(SIZE - 1 - c) * SIZE + r]);
            }
        }
        return out;
    }
    // 방향 dir 로 밀 때 읽는 순서 — order[r × 4 + k] = 돌린 판의 행 r, 왼쪽 벽에서 k 번째 자리에 오는 원래 칸 번호
    function pushOrder(dir) {
        let g = [];
        for (let i = 0; i < CELLS; i += 1) {
            g.push(i);
        }
        for (let t = 0; t < TURNS[dir]; t += 1) {
            g = rotateCW(g);
        }
        return g;
    }
    const ORDERS = [0, 1, 2, 3].map(pushOrder);
    function compressLine(line, lock) {
        const out = [];
        for (const t of line) {
            if (!t) {
                continue;
            }
            const last = out.length ? out[out.length - 1] : null;
            if (last && last.v === t.v && !(lock && last.merged)) {
                last.v *= 2;
                last.ids.push(t.id);
                last.merged = true;
            }
            else {
                out.push({ ids: [t.id], v: t.v, merged: false });
            }
        }
        return out;
    }
    function gridOf(tiles) {
        const g = [];
        for (let i = 0; i < CELLS; i += 1) {
            g.push(null);
        }
        for (const t of tiles) {
            g[t.cell] = t;
        }
        return g;
    }
    function valuesOf(tiles) {
        const v = [];
        for (let i = 0; i < CELLS; i += 1) {
            v.push(0);
        }
        for (const t of tiles) {
            v[t.cell] = t.v;
        }
        return v;
    }
    function copyTiles(tiles) { return tiles.map(function (t) { return { id: t.id, v: t.v, cell: t.cell }; }); }
    // 한 수 밀기 — 판을 돌려 그 방향을 왼쪽으로 만든 순서표로 네 줄을 읽고, 줄마다 compressLine 한 결과를 원래 칸 번호로 되돌려 적는다
    function slideBoard(g, dir, lock) {
        const cells = gridOf(g.tiles);
        const order = ORDERS[dir];
        const byId = {};
        for (const t of g.tiles) {
            byId[t.id] = t;
        }
        const slides = [];
        const merges = [];
        const after = [];
        let gain = 0;
        for (let r = 0; r < SIZE; r += 1) {
            const line = [];
            for (let k = 0; k < SIZE; k += 1) {
                line.push(cells[order[r * SIZE + k]]);
            }
            compressLine(line, lock).forEach(function (o, slot) {
                const to = order[r * SIZE + slot];
                for (const id of o.ids) {
                    slides.push({ id: id, v: byId[id].v, from: byId[id].cell, to: to });
                }
                if (o.merged) {
                    const nid = g.nextId;
                    g.nextId += 1;
                    merges.push({ id: nid, v: o.v, cell: to, parents: o.ids.slice() });
                    after.push({ id: nid, v: o.v, cell: to });
                    gain += o.v;
                }
                else {
                    after.push({ id: o.ids[0], v: o.v, cell: to });
                }
            });
        }
        const moved = merges.length > 0 || slides.some(function (s) { return s.from !== s.to; });
        return { dir: dir, moved: moved, slides: slides, merges: merges, gain: gain, before: copyTiles(g.tiles), after: after, spawn: null };
    }
    function emptyCells(tiles) {
        const used = [];
        for (let i = 0; i < CELLS; i += 1) {
            used.push(false);
        }
        for (const t of tiles) {
            used[t.cell] = true;
        }
        const out = [];
        for (let i = 0; i < CELLS; i += 1) {
            if (!used[i]) {
                out.push(i);
            }
        }
        return out;
    }
    // 빈칸 하나를 시드 난수로 뽑아 2 또는 4 를 놓는다 — 4 는 FOUR_CHANCE 의 확률
    function spawnTile(g) {
        const empty = emptyCells(g.tiles);
        if (!empty.length) {
            return null;
        }
        const cell = empty[Math.floor(g.rng() * empty.length)];
        const v = g.rng() < FOUR_CHANCE ? 4 : 2;
        const t = { id: g.nextId, v: v, cell: cell };
        g.nextId += 1;
        g.tiles.push(t);
        return t;
    }
    // 한 수 두기 — 움직였을 때만 판을 바꾸고 새 타일을 하나 돋운다. 안 움직이는 방향은 수가 아니다(새 타일도 없음)
    function playMove(g, dir, lock) {
        const mv = slideBoard(g, dir, lock);
        if (!mv.moved) {
            return mv;
        }
        g.tiles = mv.after.map(function (t) { return { id: t.id, v: t.v, cell: t.cell }; });
        g.score += mv.gain;
        mv.spawn = spawnTile(g);
        return mv;
    }
    function makeGame(values, seed) {
        const tiles = [];
        let id = 1;
        values.forEach(function (v, cell) {
            if (v) {
                tiles.push({ id: id, v: v, cell: cell });
                id += 1;
            }
        });
        return { tiles: tiles, nextId: id, score: 0, rng: makeRng(seed) };
    }
    function equalPairs(vals) {
        const out = [];
        for (let r = 0; r < SIZE; r += 1) {
            for (let c = 0; c < SIZE; c += 1) {
                const i = r * SIZE + c;
                if (!vals[i]) {
                    continue;
                }
                if (c + 1 < SIZE && vals[i + 1] === vals[i]) {
                    out.push({ a: i, b: i + 1 });
                }
                if (r + 1 < SIZE && vals[i + SIZE] === vals[i]) {
                    out.push({ a: i, b: i + SIZE });
                }
            }
        }
        return out;
    }
    function countEmpty(vals) { let n = 0; for (const v of vals) {
        if (!v) {
            n += 1;
        }
    } return n; }
    function isStuck(vals) { return countEmpty(vals) === 0 && equalPairs(vals).length === 0; }
    function rowOf(cell) { return Math.floor(cell / SIZE); }
    function colOf(cell) { return cell % SIZE; }
    // ── 쓸기 방향 판정 ───────────────────────────────────────────
    // 시작점·끝점 차(dx, dy, 화면 px — y 는 아래로)와 걸린 시간(ms)으로 네 부채꼴 중 하나를 고르거나 버린다
    // 이 길이보다 짧은 궤적은 버린다 — 다만 FLICK_SPEED_PX_S 보다 빠르면 짧아도 받아들인다(빠른 튕김)
    const SWIPE_MIN_PX = 24;
    const FLICK_SPEED_PX_S = 450;
    // 튕김이라도 이보다 짧으면 손가락이 떨린 것으로 본다
    const FLICK_MIN_PX = 8;
    // 부채꼴 경계(45°·135°·225°·315°) 양쪽 이 각도 안은 애매한 대각선 — 버린다
    const DEAD_ZONE_DEG = 10;
    const VERDICT_OK = 'ok';
    const VERDICT_SHORT = 'short';
    const VERDICT_DIAGONAL = 'diagonal';
    const VERDICT_FLICK = 'flick';
    // 화면 각(0° 오른쪽, 90° 아래)을 부채꼴로 — 가장 가까운 90° 배수가 방향
    const ANGLE_TO_DIR = [DIR_RIGHT, DIR_DOWN, DIR_LEFT, DIR_UP];
    function judgeSwipe(dx, dy, ms) {
        const length = Math.sqrt(dx * dx + dy * dy);
        const speed = length / Math.max(1, ms) * 1000;
        const angle = (deg(Math.atan2(dy, dx)) + 360) % 360;
        const base = { dir: -1, angle: angle, length: length, speed: speed, reason: VERDICT_SHORT };
        const flick = length >= FLICK_MIN_PX && speed >= FLICK_SPEED_PX_S;
        if (length < SWIPE_MIN_PX && !flick) {
            return base;
        }
        // 경계까지 남은 각 — 90° 마다 되풀이되는 자리에서 45° 와의 차
        const toBorder = Math.abs((angle % 90) - 45);
        if (toBorder < DEAD_ZONE_DEG) {
            base.reason = VERDICT_DIAGONAL;
            return base;
        }
        base.dir = ANGLE_TO_DIR[Math.round(angle / 90) % 4];
        base.reason = length < SWIPE_MIN_PX ? VERDICT_FLICK : VERDICT_OK;
        return base;
    }
    // ── 타일 색과 숫자 크기 ──────────────────────────────────────
    // 단계 = log2(값) — 2 는 1단계, 2048 은 11단계, 8192 는 13단계
    function stepOf(v) { return v > 0 ? Math.log2(v) : 0; }
    // 파스텔 기준색과 그 색이 놓이는 단계 — 사이 단계는 oklab 에서 곧게 섞는다
    const TILE_ANCHORS = [[250, 238, 218], [246, 224, 150], [244, 170, 152], [244, 190, 212], [196, 182, 238], [170, 206, 238], [164, 218, 196]];
    const ANCHOR_STEPS = [1, 3, 5, 7, 9, 11, 13];
    function toLinear(c) { const x = c / 255; return x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }
    function fromLinear(x) { const c = x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055; return clamp(c * 255, 0, 255); }
    // sRGB → oklab (지각 균등 색 공간 — 같은 거리만큼 섞으면 눈에도 비슷한 만큼 바뀐다)
    function rgbToOklab(c) {
        const r = toLinear(c[0]);
        const g = toLinear(c[1]);
        const b = toLinear(c[2]);
        const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
        const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
        const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
        return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
            1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
            0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
    }
    function oklabToRgb(c) {
        const l = Math.pow(c[0] + 0.3963377774 * c[1] + 0.2158037573 * c[2], 3);
        const m = Math.pow(c[0] - 0.1055613458 * c[1] - 0.0638541728 * c[2], 3);
        const s = Math.pow(c[0] - 0.0894841775 * c[1] - 1.2914855480 * c[2], 3);
        return [fromLinear(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s),
            fromLinear(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s),
            fromLinear(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s)];
    }
    const ANCHOR_LABS = TILE_ANCHORS.map(rgbToOklab);
    // 단계(소수 가능)의 색 — 양옆 기준 단계 사이 몫 k 로 oklab 세 값을 각각 곧게 섞는다(선형 보간). 끝 바깥은 끝 색
    function tileColor(step) {
        const last = ANCHOR_STEPS.length - 1;
        if (step <= ANCHOR_STEPS[0]) {
            return TILE_ANCHORS[0];
        }
        if (step >= ANCHOR_STEPS[last]) {
            return TILE_ANCHORS[last];
        }
        let i = 0;
        while (step > ANCHOR_STEPS[i + 1]) {
            i += 1;
        }
        const k = (step - ANCHOR_STEPS[i]) / (ANCHOR_STEPS[i + 1] - ANCHOR_STEPS[i]);
        const a = ANCHOR_LABS[i];
        const b = ANCHOR_LABS[i + 1];
        return oklabToRgb([lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]);
    }
    // 비교용 — 같은 두 색을 sRGB 값 그대로 섞은 색
    function tileColorRgb(step) {
        const last = ANCHOR_STEPS.length - 1;
        if (step <= ANCHOR_STEPS[0]) {
            return TILE_ANCHORS[0];
        }
        if (step >= ANCHOR_STEPS[last]) {
            return TILE_ANCHORS[last];
        }
        let i = 0;
        while (step > ANCHOR_STEPS[i + 1]) {
            i += 1;
        }
        const k = (step - ANCHOR_STEPS[i]) / (ANCHOR_STEPS[i + 1] - ANCHOR_STEPS[i]);
        return mix(TILE_ANCHORS[i], TILE_ANCHORS[i + 1], k);
    }
    // 숫자 크기 맞춤 — 칸 폭 × DIGIT_PX_RATIO 로 시작해, 잰 숫자 폭이 칸 폭 × DIGIT_FILL 을 넘으면 그 비율만큼 줄인다
    const DIGIT_PX_RATIO = 0.5;
    const DIGIT_FILL = 0.8;
    const DIGIT_WEIGHT = 800;
    function fitDigits(text, cell, m) {
        const px0 = cell * DIGIT_PX_RATIO;
        const raw = textWidth(text, px0, DIGIT_WEIGHT, m);
        const room = cell * DIGIT_FILL;
        const scale = raw > room ? room / raw : 1;
        return { px: px0 * scale, width: raw * scale, rawWidth: raw, scale: scale };
    }
    // 합친 타일 크기 스프링 — 크기 1 에서 POP_KICK(1/초)의 속도로 차올라 넘쳤다가 1 로 앉는다. 새 타일은 0 에서 자란다
    const POP_STIFFNESS = 420;
    const POP_DAMPING = 18;
    const POP_KICK = 6;
    // 새 타일은 미끄러짐이 다 끝난 뒤 이만큼 있다가 돋는다
    const SPAWN_DELAY_S = 0.04;
    // 되감기 때 새 타일이 오그라들어 사라지는 데 쓰는 시간
    const SHRINK_S = 0.22;
    // 숨는 시각이 없는 타일 — 아주 먼 뒤
    const NO_HIDE = 1e9;
    function makeSprite(t, show) {
        const c = colOf(t.cell);
        const r = rowOf(t.cell);
        return { id: t.id, v: t.v, fx: c, fy: r, tx: c, ty: r, t0: 0, dur: 0, show: show, hide: NO_HIDE, pop: makeSpring(1), squash: makeSpring(0), axis: 0, landed: true, lockUntil: -1 };

    const F02 = { x: 24, y: 18, cell: 46, gap: 6 };
    const MINI_02 = { x: 300, y: 34, cell: 25, gap: 4 };
    const LABEL_DROP = '대기열 없음 — 미끄러지는 중 입력은 버림';
    const LABEL_COUNT_DROP = '대기열 없음 · 받음 {g} · 둠 {p} · 버림 {d}';
    const LABEL_COUNT_QUEUE = '대기열 1칸 · 받음 {g} · 둠 {p} · 버림 {d}';
    const LABEL_AREA = '늘임 {s}배 · 가로 × 세로 = {a}';
    function bindInput(signal) { void signal; }
    function counts(tpl, p) {
        return tpl.replace('{g}', String(p.got)).replace('{p}', String(p.played)).replace('{d}', String(p.dropped));
    }
    function draw() {
        clearStage(PAPER);
        drawBoardBack(F02, 1);
        drawView(queued02.view, F02, sceneT, 1, axisScales);
        pill(LABEL_DROP, 362, 20, CREAM, CORAL_DEEP, 1, 9);
        drawBoardBack(MINI_02, 0.9);
        drawView(dropper02.view, MINI_02, sceneT, 0.9, axisScales);
        label(counts(LABEL_COUNT_DROP, dropper02), 362, 182, CORAL_DEEP, 1, 10, 700, 'center');
        label(counts(LABEL_COUNT_QUEUE, queued02), 362, 198, VIOLET_DEEP, 1, 10, 700, 'center');
        // 입력 시간 줄 — 시연 한 바퀴를 가로로. 점 = 입력, 산호 = 작은 판이 버린 입력, 세로 막대 = 지금
        const x0 = 268;
        const x1 = 458;
        const ty = 220;
        line(x0, ty, x1, ty, 2, INK_SOFT, 0.5);
        INPUTS_02.forEach(function (inp, i) {
            const x = lerp(x0, x1, inp.t / LOOP_S);
            const seen = i < fates02.length;
            disc(x, ty, seen ? 4.5 : 3, seen ? (fates02[i] ? CORAL_DEEP : MINT_DEEP) : INK_SOFT, seen ? 1 : 0.5);
        });
        if (autoOn) {
            line(lerp(x0, x1, sceneT / LOOP_S), ty - 9, lerp(x0, x1, sceneT / LOOP_S), ty + 9, 2, INK, 0.8);
        }
        // 지금 가장 빨리 미끄러지는 타일의 늘임과 넓이 배율
        let best = 1;
        let area = 1;
        for (const s of queued02.view.sprites) {
            const at = slideAt(s, sceneT, true);
            const sc = axisScales(s, at.speed);
            const along = Math.max(sc[0], sc[1]);
            if (along > best) {
                best = along;
                area = sc[0] * sc[1];
            }
        }
        label(LABEL_AREA.replace('{s}', best.toFixed(2)).replace('{a}', area.toFixed(2)), 362, 240, INK, 1, 10, 700, 'center');
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 동작 줄이기 설정을 바꿔도 change 리스너가 이 값을 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시가 붙어 있는가 — 사람이 처음 손대면 표시를 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    // 리스너는 한 묶음으로 달고 정리할 때 한 번에 뗀다
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 사람이 한 수를 두면 자동 시연은 수를 그만 두고, 판은 그 자리에서 사람 판이 된다
    function takeOver() {
        wake();
        autoOn = false;
    }
    // 멈춘 화면(움직임 줄이기·일시정지)에서 둔 수는 미끄러짐 없이 결과 판으로 바로 그린다
    function showNow() {
        if (still || paused) {
            settle();
            draw();
            pushStatus();
        }
    }
    // 한 프레임에 넘기는 시간 상한(초) — 탭을 오래 숨겼다 돌아온 첫 프레임에도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    // 장면 시계를 dt 만큼 — 자동 시연 중에는 한 바퀴(LOOP_S)를 넘으면 처음 판으로 되돌려 다시 시연한다
    function advance(dt) {
        sceneT += dt;
        if (autoOn && sceneT >= LOOP_S) {
            sceneT -= LOOP_S;
            reset();
        }
        update(dt);
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        draw();
        pushStatus();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 시계 다시 맞추기 — 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 동작 줄이기 — 루프를 돌리지 않고 정지 판 한 장만 그린다
    function showRest() {
        stopLoop();
        if (autoOn) {
            sceneT = 0;
            reset();
            restPose();
        }
        else {
            settle();
        }
        draw();
        pushStatus();
    }
    function play() {
        if (autoOn) {
            sceneT = 0;
            reset();
        }
        draw();
        pushStatus();
        if (!paused) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 방향키 — 판에 포커스가 있을 때만 받는다. 판 밖에서는 화살표가 원래대로 페이지를 스크롤한다
    const KEY_DIRS = { ArrowLeft: DIR_LEFT, ArrowUp: DIR_UP, ArrowRight: DIR_RIGHT, ArrowDown: DIR_DOWN };
    boardBox.addEventListener('keydown', function (e) {
        const dir = KEY_DIRS[e.key];
        if (dir === undefined || e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        e.preventDefault();
        takeOver();
        humanMove(dir);
        showNow();
    }, { signal: off.signal });
    // 쓸기 — 누른 자리와 뗀 자리의 차, 걸린 시간을 쓸기 판정(judgeSwipe)에 넣는다. 화면 px 그대로
    let downX = 0;
    let downY = 0;
    let downT = -1;
    boardBox.addEventListener('pointerdown', function (e) {
        downX = e.clientX;
        downY = e.clientY;
        downT = e.timeStamp;
    }, { signal: off.signal });
    boardBox.addEventListener('pointerup', function (e) {
        if (downT < 0) {
            return;
        }
        const v = judgeSwipe(e.clientX - downX, e.clientY - downY, e.timeStamp - downT);
        downT = -1;
        if (v.length < FLICK_MIN_PX) {
            return;
        }
        takeOver();
        onSwipe(v);
        showNow();
    }, { signal: off.signal });
    boardBox.addEventListener('pointercancel', function () { downT = -1; }, { signal: off.signal });
    // 탭이 숨으면 루프를 멈추고, 돌아오면 시계를 다시 맞춰 시작한다 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still && fontsReady) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 페이지를 연 채 바뀌면 — 켜지면 정지 판으로 멈추고, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw();
    }, { signal: off.signal });
    bindInput(off.signal);
    fitCanvas();
    // 숫자 폭은 글꼴이 다 온 뒤에 잰다 — 그 전에 잰 폭은 대체 글꼴의 폭이라 글꼴이 바뀌는 순간 글자 크기 맞춤이 틀어진다.
    // 나중에 다른 글꼴이 더 오면(loadingdone) 다시 잰다
    let fontsReady = false;
    document.fonts.addEventListener('loadingdone', function () {
        if (!fontsReady) {
            return;
        }
        remeasure();
        draw();
    }, { signal: off.signal });
    document.fonts.ready.then(function () {
        if (off.signal.aborted) {
            return;
        }
        fontsReady = true;
        remeasure();
        if (still) {
            showRest();
        }
        else {
            play();
        }
    });
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
