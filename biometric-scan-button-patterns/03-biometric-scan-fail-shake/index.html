<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인증 실패 스프링 흔들림 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fail-wrap">
<button type="button" class="fail is-demo" id="fail" aria-pressed="false">
  <svg class="fail__icon" id="icon" viewBox="0 0 120 120" aria-hidden="true">
    <circle class="fail__ring" cx="60" cy="60" r="34"></circle>
    <path class="fail__mark" id="mark" d="M46,46 L74,74 M74,46 L46,74"></path>
  </svg>
  <span class="fail__label">지문 인증</span>
</button>
<p class="fail__status" id="status">다시 시도해 주세요</p>
</div>
<script>
(function () {
  // 계산 겹: 감쇠 스프링 진동 — x(t) = AMPLITUDE * e^(-t/decayMs) * cos(t*FREQ). 트윈 이징이 아니라
  // 매 프레임 이 식으로 오프셋을 계산해 아이콘을 흔든다. SHAKE_DAMP 가 클수록 decayMs 가 커져
  // 진동이 오래 남고, 작을수록 빨리 잦아든다.
  var AMPLITUDE = 14; // 최대 흔들림 폭(px)
  var FREQ = 0.028; // 각속도(rad/ms)
  var SHAKE_DAMP = 18; // 변형 03: SHAKE_DAMP 18 → 8 (댐핑 — 작을수록 빨리 잦아든다)
  var SETTLE_MS = 900; // 이 시간이 지나면 진동을 멈추고 0 으로 고정한다
  var GAP_MS = 900; // 다음 자동 실패 시연까지 대기 시간
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var decayMs = reduce ? 1 : SHAKE_DAMP * 40;

  var root = document.getElementById('fail');
  var icon = document.getElementById('icon');
  var status = document.getElementById('status');
  var STRINGS = { idle: '다시 시도해 주세요', failed: '인증 실패' };
  var isDemo = true;
  var running = false;
  var startTs = 0;

  function apply(t) {
    var offset = AMPLITUDE * Math.exp(-t / decayMs) * Math.cos(t * FREQ);
    icon.style.transform = 'translateX(' + offset.toFixed(2) + 'px)';
  }

  function runShake(ts) {
    if (!startTs) startTs = ts;
    var t = ts - startTs;
    if (t <= SETTLE_MS) {
      apply(t);
      requestAnimationFrame(runShake);
    } else {
      apply(0);
      status.textContent = STRINGS.idle;
      running = false;
      root.setAttribute('aria-pressed', 'false');
    }
  }

  function trigger() {
    if (running) return;
    running = true;
    startTs = 0;
    status.textContent = STRINGS.failed;
    root.setAttribute('aria-pressed', 'true');
    requestAnimationFrame(runShake);
  }

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  root.addEventListener('click', function () { human(); trigger(); });
  root.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { human(); }
  });

  apply(0);

  var cycleStart = 0;
  var PERIOD = SETTLE_MS + GAP_MS;
  function loop(ts) {
    if (isDemo && !reduce) {
      if (!cycleStart) cycleStart = ts;
      var phase = (ts - cycleStart) % PERIOD;
      if (phase < 16 && !running) trigger();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
