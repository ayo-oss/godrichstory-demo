<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지문 대기 호흡 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="breathe-wrap">
<button type="button" class="breathe is-demo" id="breathe" aria-pressed="true">
  <svg class="breathe__icon" id="icon" viewBox="0 0 120 130" aria-hidden="true">
    <path class="breathe__ridge" d="M10,118 A50 46 0 0 1 110,118"></path>
    <path class="breathe__ridge" d="M16,118 A44 41 0 0 1 104,118"></path>
    <path class="breathe__ridge" d="M22,118 A38 36 0 0 1 98,118"></path>
    <path class="breathe__ridge" d="M28,118 A32 31 0 0 1 92,118"></path>
    <path class="breathe__ridge" d="M34,118 A26 26 0 0 1 86,118"></path>
    <path class="breathe__ridge" d="M40,118 A20 21 0 0 1 80,118"></path>
    <path class="breathe__ridge" d="M46,118 A14 16 0 0 1 74,118"></path>
  </svg>
  <span class="breathe__label">인증 대기</span>
</button>
<p class="breathe__status" id="status">대기 중</p>
</div>
<script>
(function () {
  // 계산 겹: 사인 이징 호흡 — scale = 1 + AMPLITUDE*sin(t*OMEGA) 를 매 프레임 직접 계산해
  // 아이콘 전체에 적용한다(중심 기준 확대). 능선마다 위상차(RIDGE_PHASE_STEP)를 살짝 둬
  // 밝기가 안에서 바깥으로 번지는 파도처럼 보이게 한다 — 미리 만든 트윈이 아니라 매 프레임
  // 삼각함수로 다시 계산한다.
  var AMPLITUDE = 0.095;     // 스케일 진폭(호흡 정도)
  var OMEGA = 0.0026;        // rad/ms — 주기 약 2400ms
  var RIDGE_PHASE_STEP = 0.16;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('breathe');
  var icon = document.getElementById('icon');
  var ridges = Array.prototype.slice.call(document.querySelectorAll('.breathe__ridge'));
  var status = document.getElementById('status');
  var STRINGS = { idle: '대기 중', paused: '일시 정지됨' };
  var isDemo = true;
  var active = true;
  var rafId = 0;
  var startTs = 0;

  function render(t) {
    var s = 1 + AMPLITUDE * Math.sin(t * OMEGA);
    icon.style.transform = 'scale(' + s.toFixed(4) + ')';
    for (var i = 0; i < ridges.length; i++) {
      var phase = t * OMEGA + i * RIDGE_PHASE_STEP;
      var b = 0.5 + 0.5 * Math.sin(phase);
      ridges[i].style.opacity = b.toFixed(3);
    }
  }

  function resetIcon() {
    icon.style.transform = 'scale(1)';
    for (var i = 0; i < ridges.length; i++) ridges[i].style.opacity = '0.72';
  }

  function loop(ts) {
    if (!startTs) startTs = ts;
    render(ts - startTs);
    rafId = requestAnimationFrame(loop);
  }

  function setActive(v) {
    active = v;
    root.setAttribute('aria-pressed', String(v));
    status.textContent = v ? STRINGS.idle : STRINGS.paused;
    cancelAnimationFrame(rafId);
    if (!v) { resetIcon(); return; }
    if (reduce) { render(0); return; }
    startTs = 0;
    rafId = requestAnimationFrame(loop);
  }

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  root.addEventListener('click', function () { human(); setActive(!active); });
  root.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { human(); }
  });

  setActive(true);
})();
</script>
</main>
</body>
</html>
