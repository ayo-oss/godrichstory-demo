<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홀로그램 플리커 노이즈 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="holo-wrap">
<button type="button" class="holo is-demo" id="holo" aria-pressed="true">
  <svg class="holo__icon" viewBox="0 0 120 120" aria-hidden="true">
    <g id="glyph">
      <path class="holo__ridge" d="M20,90 A40 36 0 0 1 100,90"></path>
      <path class="holo__ridge" d="M30,90 A30 27 0 0 1 90,90"></path>
      <path class="holo__ridge" d="M40,90 A20 19 0 0 1 80,90"></path>
    </g>
    <rect class="holo__line" data-i="0" x="14" y="30" width="92" height="2"></rect>
    <rect class="holo__line" data-i="1" x="14" y="50" width="92" height="2"></rect>
    <rect class="holo__line" data-i="2" x="14" y="70" width="92" height="2"></rect>
    <rect class="holo__line" data-i="3" x="14" y="96" width="92" height="2"></rect>
  </svg>
  <span class="holo__label">홀로그램 인증표</span>
</button>
<p class="holo__status" id="status">투사 중</p>
</div>
<script>
(function () {
  // 계산 겹: 결정적 노이즈 플리커 — Math.random 없이 서로 다른 주기의 사인 3개를 가중합해
  // -1~1 노이즈 값을 만들고(노이즈 합성), 매 프레임 그 값으로 불투명도를 계산한다. 스캔 라인마다
  // 위상(phase)을 다르게 줘서 같은 순간에도 줄마다 다른 밝기로 반짝인다.
  var FREQS = [0.013, 0.031, 0.007]; // 세 사인의 각속도(rad/ms) — 서로소에 가깝게 골라 주기성이 안 보이게
  var WEIGHTS = [0.5, 0.32, 0.18];
  var PHASES = [0, 1.7, 3.4];
  var LINE_PHASE_STEP = 0.6; // 스캔 라인 인덱스마다 더하는 위상 차
  var BASE = 0.55, RANGE = 0.42;
  var WSUM = WEIGHTS[0] + WEIGHTS[1] + WEIGHTS[2];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('holo');
  var glyph = document.getElementById('glyph');
  var lines = Array.prototype.slice.call(document.querySelectorAll('.holo__line'));
  var status = document.getElementById('status');
  var STRINGS = { on: '투사 중', off: '전원 꺼짐' };
  var isDemo = true;
  var active = true;

  function noise(t, phaseOffset) {
    var v = 0;
    for (var i = 0; i < 3; i++) {
      v += WEIGHTS[i] * Math.sin(t * FREQS[i] + PHASES[i] + phaseOffset);
    }
    return v / WSUM;
  }

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  function toggle() {
    active = !active;
    root.setAttribute('aria-pressed', String(active));
    status.textContent = active ? STRINGS.on : STRINGS.off;
  }

  root.addEventListener('click', function () { human(); toggle(); });
  root.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { human(); }
  });

  function loop(ts) {
    var run = active && (isDemo ? !reduce : true);
    if (run) {
      glyph.style.opacity = (BASE + RANGE * noise(ts, 0)).toFixed(3);
      for (var i = 0; i < lines.length; i++) {
        var v = BASE + RANGE * noise(ts, i * LINE_PHASE_STEP + 1);
        lines[i].style.opacity = Math.max(0, Math.min(1, v)).toFixed(3);
      }
    } else {
      glyph.style.opacity = active ? '1' : '0.08';
      for (var j = 0; j < lines.length; j++) { lines[j].style.opacity = active ? '0.7' : '0'; }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
