<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>グリッドスキャン対角ウェーブ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="grid-wrap">
<button type="button" class="grid is-demo" id="grid" aria-pressed="true">
  <div class="grid__cells" id="cells" aria-hidden="true"></div>
  <span class="grid__label">指紋センサースキャン</span>
</button>
<p class="grid__status" id="status">スキャン中</p>
</div>
<script>
(function () {
  // 계산 겹: 격자 대각 스태거 — 셀마다 (행+열) 로 지연을 매겨 빛이 대각선으로 번져 나간다.
  // delay(row,col) = (row+col)*DIAG_STEP. 지연 목록을 미리 박아두지 않고 매 프레임 셀 좌표에서
  // 직접 계산해 삼각 펄스를 얹는다 — 한 번도 멈추지 않는 진행파라 캡처 구간 어디를 잘라도
  // 항상 움직임이 있다.
  var COLS = 6, ROWS = 6;
  var DIAG_STEP = 90;   // ms, 대각선 한 칸당 지연
  var CYCLE_MS = 1600;  // ms, 파동이 한 바퀴 도는 주기
  var PULSE_MS = 420;   // ms, 셀 하나가 빛나는 지속 시간
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('grid');
  var cellsBox = document.getElementById('cells');
  var status = document.getElementById('status');
  var STRINGS = { on: 'スキャン中', off: 'スキャン停止' };
  var isDemo = true;
  var active = true;
  var rafId = 0;
  var startTs = 0;

  var cells = [];
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var cell = document.createElement('span');
      cell.className = 'grid__cell';
      cellsBox.appendChild(cell);
      cells.push({ el: cell, diag: r + c });
    }
  }

  function pulse(local) {
    if (local < 0 || local >= PULSE_MS) return 0;
    return Math.sin((local / PULSE_MS) * Math.PI);
  }

  function render(t) {
    for (var i = 0; i < cells.length; i++) {
      var delay = cells[i].diag * DIAG_STEP;
      var local = ((t - delay) % CYCLE_MS + CYCLE_MS) % CYCLE_MS;
      var v = pulse(local);
      cells[i].el.style.opacity = (0.16 + v * 0.84).toFixed(3);
      cells[i].el.style.transform = 'scale(' + (1 + v * 0.22).toFixed(3) + ')';
    }
  }

  function resetCells() {
    for (var i = 0; i < cells.length; i++) {
      cells[i].el.style.opacity = '0.16';
      cells[i].el.style.transform = 'scale(1)';
    }
  }

  function loop(ts) {
    if (!startTs) startTs = ts;
    render(ts - startTs);
    rafId = requestAnimationFrame(loop);
  }

  function setActive(v) {
    active = v;
    root.setAttribute('aria-pressed', String(v));
    status.textContent = v ? STRINGS.on : STRINGS.off;
    cancelAnimationFrame(rafId);
    if (!v) { resetCells(); return; }
    if (reduce) { render(CYCLE_MS * 0.42); return; }
    startTs = 0;
    rafId = requestAnimationFrame(loop);
  }

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  root.addEventListener('click', function () { human(); setActive(!active); });
  root.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { human(); }
  });

  setActive(true);
})();
</script>
</main>
</body>
</html>
