<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Success shape morph — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="morph-wrap">
<button type="button" class="morph is-demo" id="morph" aria-pressed="false">
  <svg class="morph__icon" viewBox="0 0 120 120" aria-hidden="true">
    <path class="morph__shape" id="shape"></path>
  </svg>
  <span class="morph__label">Auth success</span>
</button>
<p class="morph__status" id="status">Waiting to scan</p>
</div>
<script>
(function () {
  // 계산 겹: SVG path 모핑 보간 — 원(지문 자리) 점 배열과 체크 점 배열을 같은 점 개수(N)로 두고
  // 진행값 p(0~1) 로 각 점을 선형 보간한 뒤 매 프레임 path d 를 새로 만든다. CSS 트랜지션이 아니라
  // 점 좌표 자체를 계산한다.
  var CX = 60, CY = 60, R = 30;
  var N = 10; // 점 개수 — 두 도형이 같은 개수를 공유해야 보간이 성립한다
  var MORPH_MS = 650; // 원 → 체크 보간에 걸리는 시간
  var HOLD_MS = 550; // 체크 상태 유지 시간
  var GAP_MS = 700; // 다음 자동 성공 시연까지 대기 시간
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DUR = reduce ? 1 : MORPH_MS;

  var root = document.getElementById('morph');
  var shape = document.getElementById('shape');
  var status = document.getElementById('status');
  var STRINGS = { idle: 'Waiting to scan', done: 'Auth success' };
  var isDemo = true;
  var running = false;
  var startTs = 0;

  function circlePoint(i) {
    var a = (i / N) * Math.PI * 2 - Math.PI / 2;
    return [CX + R * Math.cos(a), CY + R * Math.sin(a)];
  }

  // 체크마크 둘레를 따라 N 개 점을 손으로 배치한다 — 얇은 두 막대가 겹친 다각형
  var CHECK_PTS = [
    [40, 62], [52, 74], [50, 82], [36, 68], [30, 62], [36, 56],
    [50, 68], [82, 36], [88, 42], [58, 78]
  ];

  function lerp(a, b, t) { return a + (b - a) * t; }

  function buildPath(p) {
    var d = '';
    for (var i = 0; i < N; i++) {
      var c = circlePoint(i);
      var k = CHECK_PTS[i];
      var x = lerp(c[0], k[0], p);
      var y = lerp(c[1], k[1], p);
      d += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2) + ' ';
    }
    return d + 'Z';
  }

  function apply(p) { shape.setAttribute('d', buildPath(p)); }

  function ease(t) { return 1 - Math.pow(1 - t, 3); }

  function runMorph(ts) {
    if (!startTs) startTs = ts;
    var t = ts - startTs;
    if (t <= DUR) {
      apply(ease(t / DUR));
      status.textContent = STRINGS.idle;
      requestAnimationFrame(runMorph);
    } else if (t <= DUR + HOLD_MS) {
      apply(1);
      status.textContent = STRINGS.done;
      requestAnimationFrame(runMorph);
    } else if (t <= DUR + HOLD_MS + DUR) {
      apply(1 - ease((t - DUR - HOLD_MS) / DUR));
      status.textContent = STRINGS.idle;
      requestAnimationFrame(runMorph);
    } else {
      apply(0);
      running = false;
      root.setAttribute('aria-pressed', 'false');
    }
  }

  function trigger() {
    if (running) return;
    running = true;
    startTs = 0;
    root.setAttribute('aria-pressed', 'true');
    requestAnimationFrame(runMorph);
  }

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  root.addEventListener('click', function () { human(); trigger(); });
  root.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { human(); }
  });

  apply(0);

  var cycleStart = 0;
  var PERIOD = DUR * 2 + HOLD_MS + GAP_MS;
  function loop(ts) {
    if (isDemo && !reduce) {
      if (!cycleStart) cycleStart = ts;
      var phase = (ts - cycleStart) % PERIOD;
      if (phase < 16 && !running) trigger();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
