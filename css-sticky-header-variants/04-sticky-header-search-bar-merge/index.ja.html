<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search bar merges into header — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sbm is-demo">
    <div class="sbm__slot">
      <header class="sbm__head">
        <span class="sbm__logo">GODRICH</span>
        <nav class="sbm__nav" aria-hidden="true"><span></span><span></span></nav>
      </header>
      <div class="sbm__search">
        <span class="sbm__search-box">
          <span class="sbm__search-icon" aria-hidden="true"></span>
          <span class="sbm__search-text">検索キーワードを入力</span>
        </span>
      </div>
    </div>
    <div class="sbm__page">
      <p class="sbm__line"></p>
      <p class="sbm__line short"></p>
    </div>
  </div>
</main>
<script>
// 실제 페이지: 스크롤하면 아래 検索 줄이 위로 미끄러져 헤더 한 줄 안으로 합쳐진다 (7줄)
var el = document.querySelector('.sbm');
window.addEventListener('scroll', function () {
  el.classList.toggle('is-scrolled', window.scrollY > 20);
}, { passive: true });
</script>
</body>
</html>
