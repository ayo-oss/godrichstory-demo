<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky header — notice dot pulse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <header class="head is-demo">
    <span class="head__logo">GODRICH</span>
    <span class="head__icon" aria-hidden="true">
      <span class="head__dot"></span>
    </span>
  </header>
  <div class="page">
    <p class="page__line"></p>
    <p class="page__line"></p>
    <p class="page__line short"></p>
  </div>
</main>
<script>
// 실제 페이지: 스크롤을 80px 넘게 내리는 순간 알림 점이 튀어나오듯 나타난다 (7줄)
var head = document.querySelector('.head');
window.addEventListener('scroll', function () {
  head.classList.toggle('is-scrolled', window.scrollY > 80);
}, { passive: true });
</script>
</body>
</html>
