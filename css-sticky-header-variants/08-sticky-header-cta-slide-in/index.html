<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky header — CTA slide-in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <header class="head is-demo">
    <span class="head__logo">GODRICH</span>
    <button class="head__cta" type="button" tabindex="-1">Contact</button>
  </header>
  <div class="page">
    <p class="page__line"></p>
    <p class="page__line"></p>
    <p class="page__line short"></p>
  </div>
</main>
<script>
// 실제 페이지: 스크롤을 120px 넘게 내려야 구매·문의 버튼이 화면 밖에서 들어온다 (7줄)
var head = document.querySelector('.head');
window.addEventListener('scroll', function () {
  head.classList.toggle('is-scrolled', window.scrollY > 120);
}, { passive: true });
</script>
</body>
</html>
