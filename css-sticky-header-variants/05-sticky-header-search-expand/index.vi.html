<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search icon expands to field — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <header class="sse is-demo">
    <span class="sse__logo">GODRICH</span>
    <div class="sse__search">
      <button class="sse__toggle" type="button" aria-label="Mở tìm kiếm" aria-expanded="false" aria-controls="sseInput">
        <svg class="sse__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><line x1="20" y1="20" x2="15.7" y2="15.7"/></svg>
      </button>
      <input id="sseInput" class="sse__input" type="search" placeholder="Tìm kiếm" aria-label="Ô nhập tìm kiếm" tabindex="-1">
    </div>
  </header>
</main>
<script>
// 실제 페이지: 아이콘을 클릭하면 입력창 폭이 넓어지며 실제 검색창이 된다 (9줄)
var box = document.querySelector('.sse__search');
var input = document.querySelector('#sseInput');
document.querySelector('.sse__toggle').addEventListener('click', function (e) {
  var open = box.classList.toggle('is-open');
  e.currentTarget.setAttribute('aria-expanded', String(open));
  document.querySelector('.sse').classList.remove('is-demo');
  input.tabIndex = open ? 0 : -1;
  if (open) input.focus({ preventScroll: true }); else input.blur();
});
</script>
</body>
</html>
