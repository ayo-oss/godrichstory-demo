<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Announcement bar collapse — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ahc is-demo">
    <div class="ahc__slot">
      <div class="ahc__bar">Free shipping · today only</div>
      <header class="ahc__head">
        <span class="ahc__logo">GODRICH</span>
        <nav class="ahc__nav" aria-hidden="true"><span></span><span></span><span></span></nav>
      </header>
    </div>
    <div class="ahc__page">
      <p class="ahc__line"></p>
      <p class="ahc__line short"></p>
    </div>
  </div>
</main>
<script>
// 실제 페이지: 스크롤을 시작하는 순간 공지 배너가 위로 사라지고 헤더가 그 자리로 올라온다 (7줄)
var el = document.querySelector('.ahc');
window.addEventListener('scroll', function () {
  el.classList.toggle('is-scrolled', window.scrollY > 20);
}, { passive: true });
</script>
</body>
</html>
