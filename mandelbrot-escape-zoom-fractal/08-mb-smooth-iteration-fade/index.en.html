<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smooth iteration count — Mandelbrot escape-time fractal — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mb is-demo" id="mbRoot">
  <p class="mb__hint">
    <span>Add a log of the magnitude at escape to the iteration count and it turns fractional — staircase bands dissolve into continuous gradients. Left is the original, right is smooth</span>
  </p>
  <div class="mb__duo">
    <div class="mb__field" role="application" aria-label="integer-count original" tabindex="0">
      <canvas class="mb__cv" id="mbCvB"></canvas>
      <span class="mb__tag">integer n</span>
    </div>
    <div class="mb__field" role="application" aria-label="smooth-count processed" tabindex="0">
      <canvas class="mb__cv" id="mbCvS"></canvas>
      <span class="mb__tag mb__tag--on">smooth n</span>
    </div>
  </div>
  <div class="mb__bar">
    <span class="mb__meta">ν = n + 1 − log₂(log|z|) · period 64</span>
    <span class="mb__meta mb__meta--dim">canvas · Math.log · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 부드러운 반복수(08) — 후처리 한 겹의 차이.
// 정수 반복수 n 은 색 띠를 계단으로 만든다(링 안쪽으로 갈수록 띠가 넓어져 굵은 계단).
// 스무스 공식: ν = n + 1 − log₂(log|z|). 탈출 직후의 |z| 가 2에서 얼마나 떨어졌는지를
// 로그 두 번으로 0~1 소수로 바꿔 n 에 보간한다 — 같은 계산에 이 한 줄만 얹으면 띠가 사라진다.
// 왼쪽 캔버스 = 원본 integer n, 오른쪽 = 스무스 ν. 같은 팔레트, 같은 주기로 순환시키면
// 차이가 옆에서 바로 보인다. 뷰는 띠가 가장 두드러지는 명치-전구 사이 해안가 클로즈업.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var MAXIT  = 160;   // 최대 반복
  var PERIOD = 64;    // 색 순환 주기(반복수 단위) — 변형 "팔레트 주기"가 64 → 16
  // ────────────────────────────────────────────────────

  var root = document.getElementById('mbRoot');
  var cvB = document.getElementById('mbCvB');
  var cvS = document.getElementById('mbCvS');

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var PAL = ['--mb-c0', '--mb-c1', '--mb-c2', '--mb-c3', '--mb-c4'].map(tokRGB);
  var C_SET = tokRGB('--mb-set');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf = 0, t0 = -1;
  var WB = 0, HB = 0, WS = 0, HS = 0;
  var IRES = 150;
  var ovB, ovS, octxB, octxS, ctxB, ctxS;

  // 해안가 클로즈업 — 전구와 명치 사이 목(띠가 가장 두꺼운 지점)
  var CX = -0.65, CY = -0.42, SPAN = 0.55;

  function fit() {
    var rB = cvB.parentElement.getBoundingClientRect();
    WB = Math.round(rB.width); HB = Math.round(rB.height);
    cvB.width = WB; cvB.height = HB;
    var rS = cvS.parentElement.getBoundingClientRect();
    WS = Math.round(rS.width); HS = Math.round(rS.height);
    cvS.width = WS; cvS.height = HS;
    ovB = document.createElement('canvas');
    ovB.width = IRES; ovB.height = Math.max(2, Math.round(IRES * HB / WB));
    ovS = document.createElement('canvas');
    ovS.width = IRES; ovS.height = Math.max(2, Math.round(IRES * HS / WS));
    octxB = ovB.getContext('2d'); octxS = ovS.getContext('2d');
    ctxB = cvB.getContext('2d'); ctxS = cvS.getContext('2d');
  }

  // 색 — u(반복수/주기) 를 팔레트 고리로
  function palAt(u) {
    var seg = u - Math.floor(u / 4) * 4;
    var a = PAL[Math.floor(seg) % 4], b = PAL[(Math.floor(seg) + 1) % 4];
    var f = seg - Math.floor(seg);
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  }

  // nu 조리개 — smooth=false 면 integer n, true 면 스무스 ν
  function render(octx, iw, ih, smooth, phase) {
    var img = octx.createImageData(iw, ih);
    var px = img.data;
    var dx = SPAN / iw, dy = SPAN / iw;
    var oy0 = CY - (ih * dy) / 2;
    var k = 0;
    for (var j = 0; j < ih; j++) {
      var ci = oy0 + j * dy;
      for (var i = 0; i < iw; i++) {
        var cr = CX - SPAN / 2 + i * dx;
        var zr = 0, zi = 0, n = 0, zz = 0;
        while (n < MAXIT && (zz = zr * zr + zi * zi) <= 4) {
          var t = zr * zr - zi * zi + cr;
          zi = 2 * zr * zi + ci;
          zr = t; n++;
        }
        var c;
        if (n >= MAXIT) {
          c = C_SET;
        } else {
          var nu;
          if (smooth) {
            // ── 스무스 공식 — 탈출 직후 |z| 의 이중 로그를 보간 ──
            var mod = Math.sqrt(zz);
            nu = n + 1 - Math.log(Math.log(mod)) / Math.LN2;
          } else {
            nu = n;                       // 원본 — 계단의 원인
          }
          c = palAt((nu / PERIOD) * 4 + phase);
        }
        px[k++] = c[0]; px[k++] = c[1]; px[k++] = c[2]; px[k++] = 255;
      }
    }
    octx.putImageData(img, 0, 0);
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var loop = ((now - t0) / 1000) % 2.0;
    var phase = (loop / 2.0) * 4;         // 주기 안에 파장 한 바퀴
    render(octxB, ovB.width, ovB.height, false, phase);
    render(octxS, ovS.width, ovS.height, true, phase);
    ctxB.drawImage(ovB, 0, 0, WB, HB);
    ctxS.drawImage(ovS, 0, 0, WS, HS);
    // 스무스판 하이라이트 — 창 아래쪽 절반에 파스텔 크림 광택을 살짝(차이 돋보이게)
    var lg = ctxS.createLinearGradient(0, HS * 0.5, 0, HS);
    lg.addColorStop(0, 'rgba(239,234,255,0)');
    lg.addColorStop(1, 'rgba(239,234,255,0.05)');
    ctxS.fillStyle = lg;
    ctxS.fillRect(0, HS * 0.5, WS, HS * 0.5);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    fit();
    render(octxB, ovB.width, ovB.height, false, 0.8);
    render(octxS, ovS.width, ovS.height, true, 0.8);
    ctxB.drawImage(ovB, 0, 0, WB, HB); ctxS.drawImage(ovS, 0, 0, WS, HS);
  });

  fit();
  if (reduce) {
    render(octxB, ovB.width, ovB.height, false, 0.8);
    render(octxS, ovS.width, ovS.height, true, 0.8);
    ctxB.drawImage(ovB, 0, 0, WB, HB); ctxS.drawImage(ovS, 0, 0, WS, HS);
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
