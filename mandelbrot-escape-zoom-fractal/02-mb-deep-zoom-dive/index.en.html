<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite deep zoom — Mandelbrot escape-time fractal — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mb is-demo" id="mbRoot">
  <p class="mb__hint">
    <span>Multiply the magnification every frame toward a cusp target and mini-mandelbrots unroll endlessly — iteration depth must rise with zoom or the outlines starve</span>
  </p>
  <div class="mb__field" role="application" aria-label="Infinite deep zoom lab" tabindex="0">
    <canvas class="mb__cv" id="mbCv"></canvas>
    <span class="mb__zoom" id="mbZoom">x1</span>
  </div>
  <div class="mb__bar">
    <span class="mb__meta">x25 per 2s · iterations 96 to 500</span>
    <span class="mb__meta mb__meta--dim">canvas · z = z² + c · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 무한 딥 줌(02) — 목표점을 향한 자동 잠수.
// 매 프레임 scale 을 s = s / k 로 줄이고(=배율 k 배), 중심을 목표점 쪽으로 끌어당긴다.
// 핵심 균형: 배율이 커질수록 집합 가장자리의 구조가 가늘어지므로 maxIter 를 log(배율)에 비례해
// 올린다(변형 "최대 반복 횟수"가 500 → 2,000). 2초 루프가 끝나면 배율 1 로 되감는다 — 무한 반복 렌더.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var MAXIT0 = 96;    // 시작 최대 반복 — 배율 1 에서의 기본값
  var MAXIT1 = 500;   // 루프 끝 최대 반복 — 변형 "최대 반복 횟수"가 500 → 2,000
  var ZOOM2S = 25;    // 2초 동안의 총 배율(倍) — 잠수 깊이
  // ────────────────────────────────────────────────────

  var root = document.getElementById('mbRoot');
  var field = document.getElementById('mbCv').parentElement;
  var cv = document.getElementById('mbCv');
  var zoomEl = document.getElementById('mbZoom');

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var PAL = ['--mb-c0', '--mb-c1', '--mb-c2', '--mb-c3', '--mb-c4'].map(tokRGB);
  var C_SET = tokRGB('--mb-set');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf = 0, t0 = -1;
  var W = 0, H = 0, IRES = 260;
  var ov, octx;

  // 목표점 — 명치 끝(시클로이드 첨두) 안쪽의 나선 지대. 줌 시퀀스의 고전 좌표
  var TX = -0.743643887037, TY = 0.13182590421;

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cv.width = W; cv.height = H;
    ov = document.createElement('canvas');
    ov.width = IRES; ov.height = Math.max(2, Math.round(IRES * H / W));
  }

  function render(cx, cy, scale, maxit) {
    var iw = ov.width, ih = ov.height;
    var img = octx.createImageData(iw, ih);
    var px = img.data;
    var dx = scale / iw, dy = scale / iw;
    var oy0 = cy - (ih * dy) / 2;
    var k = 0;
    for (var j = 0; j < ih; j++) {
      var ci = oy0 + j * dy;
      for (var i = 0; i < iw; i++) {
        var cr = cx - scale / 2 + i * dx;
        var zr = 0, zi = 0, n = 0;
        while (n < maxit && zr * zr + zi * zi <= 4) {
          var t = zr * zr - zi * zi + cr;
          zi = 2 * zr * zi + ci;
          zr = t;
          n++;
        }
        var r, g, b;
        if (n >= maxit) {
          r = C_SET[0]; g = C_SET[1]; b = C_SET[2];
        } else {
          var u = (n / maxit) * 4;
          var seg = u - Math.floor(u / 4) * 4;
          var a = PAL[Math.floor(seg) % 4], bb = PAL[(Math.floor(seg) + 1) % 4];
          var f = seg - Math.floor(seg);
          r = a[0] + (bb[0] - a[0]) * f;
          g = a[1] + (bb[1] - a[1]) * f;
          b = a[2] + (bb[2] - a[2]) * f;
        }
        px[k++] = r; px[k++] = g; px[k++] = b; px[k++] = 255;
      }
    }
    octx.putImageData(img, 0, 0);
    cv.getContext('2d').drawImage(ov, 0, 0, W, H);
  }

  // t(0~1) 진행도의 줌 상태 — 지수 잠수: scale = 2.9 / k, k = 25^t.
  // k 대신 Math.log(k)/Math.log(ZOOM2S) 로 t 를 되돌릴 수도 있어(역함수) 라벨·루프 보정에 쓴다.
  // 중심은 시작 프레임(-0.75, 0)에서 목표점으로 t 에 맞춰 다가간다(화면 밖 목표가 갑자기 튀지 않게).
  function stateAt(t) {
    var k = Math.pow(ZOOM2S, t);
    var progress = Math.log(k) / Math.log(ZOOM2S);   // 배율→진행도 역변환(=t, 검산용)
    var cx = -0.75 + (TX + 0.75) * t;
    var cy = (TY) * t;
    var maxit = Math.round(MAXIT0 + (MAXIT1 - MAXIT0) * progress);
    return { cx: cx, cy: cy, scale: 2.9 / k, maxit: maxit, k: k };
  }

  function setZoomLabel(k) {
    // 배율 라벨 — x25 처럼 짧게. 1,000 넘으면 k 단위로
    zoomEl.textContent = k >= 1000 ? 'x' + Math.round(k / 100) / 10 + 'k' : 'x' + Math.round(k);
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var loop = ((now - t0) / 1000) % 2.0;   // 2초 루프 — 잠수 후 배율 1 복귀
    var t = loop / 2.0;
    var s = stateAt(t);
    render(s.cx, s.cy, s.scale, s.maxit);
    setZoomLabel(s.k);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    fit();
    var s = stateAt(reduce ? 0.55 : 0.5);
    render(s.cx, s.cy, s.scale, s.maxit);
  });

  fit();
  octx = ov.getContext('2d');
  if (reduce) {
    var s = stateAt(0.55);
    render(s.cx, s.cy, s.scale, s.maxit);
    setZoomLabel(s.k);
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
