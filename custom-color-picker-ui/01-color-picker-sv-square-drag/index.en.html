<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saturation and brightness square drag — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pk is-demo">
    <div class="pk__sv" id="svArea" role="slider" tabindex="0"
         aria-label="Pick saturation and brightness"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="20"
         aria-valuetext="Saturation 20%, brightness 100%, #CCE4FF">
      <span class="pk__dot" aria-hidden="true"></span>
    </div>
    <div class="pk__hue" id="hueBar" role="slider" tabindex="0"
         aria-label="Pick hue"
         aria-valuemin="0" aria-valuemax="360" aria-valuenow="212"
         aria-valuetext="Hue 212 degrees">
      <span class="pk__knob" aria-hidden="true"></span>
    </div>
    <div class="pk__read">
      <span class="pk__chip" aria-hidden="true"></span>
      <span class="pk__hex" aria-hidden="true"></span>
      <span class="pk__rgb" aria-hidden="true"></span>
    </div>
  </div>
</main>
<script>
(function () {
  var root = document.querySelector('.pk');
  var svArea = document.getElementById('svArea');
  var hueBar = document.getElementById('hueBar');
  var dot = root.querySelector('.pk__dot');
  var knob = root.querySelector('.pk__knob');
  var svFormat = 'Saturation %s%, brightness %v%, %x';
  var hueFormat = 'Hue %h degrees';
  var hue = 212, sat = 0.2, val = 1;

  // HSV(0~360, 0~1, 0~1) → RGB(0~255). 육각형 여섯 구간을 표로 펴서 분기 없이 고른다
  function hsvToRgb(h, s, v) {
    var c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
    var face = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][Math.floor(h / 60) % 6];
    return face.map(function (n) { return Math.round((n + m) * 255); });
  }
  function toHex(rgb) {
    return '#' + rgb.map(function (n) { return n.toString(16).padStart(2, '0'); }).join('').toUpperCase();
  }
  // 글자는 JS 가 쓰지 않는다 — --r --g --b 세 개만 넘기면 counter-set 이 HEX·RGB 를 찍는다
  function applyColor() {
    var rgb = hsvToRgb(hue, sat, val);
    root.style.setProperty('--r', rgb[0]);
    root.style.setProperty('--g', rgb[1]);
    root.style.setProperty('--b', rgb[2]);
    svArea.style.setProperty('--hue', hue);
    dot.style.transform = 'translate(' + (sat * 264).toFixed(1) + 'px, ' + ((1 - val) * 80).toFixed(1) + 'px) translate(-50%, -50%)';
    knob.style.left = (hue / 360 * 100).toFixed(1) + '%';
    svArea.setAttribute('aria-valuenow', Math.round(sat * 100));
    svArea.setAttribute('aria-valuetext', svFormat.replace('%s', Math.round(sat * 100)).replace('%v', Math.round(val * 100)).replace('%x', toHex(rgb)));
    hueBar.setAttribute('aria-valuenow', Math.round(hue));
    hueBar.setAttribute('aria-valuetext', hueFormat.replace('%h', Math.round(hue)));
  }
  function pickAt(e) {
    var box = svArea.getBoundingClientRect();
    sat = Math.min(1, Math.max(0, (e.clientX - box.left) / box.width));
    val = 1 - Math.min(1, Math.max(0, (e.clientY - box.top) / box.height));
    applyColor();
  }
  function pickHue(e) {
    var box = hueBar.getBoundingClientRect();
    hue = Math.min(360, Math.max(0, (e.clientX - box.left) / box.width * 360));
    applyColor();
  }
  function bindDrag(el, handler) {
    el.addEventListener('pointerdown', function (e) {
      root.classList.remove('is-demo');
      el.setPointerCapture(e.pointerId);   // 칸 밖으로 끌어도 이 요소가 계속 포인터를 받는다
      handler(e);
    });
    el.addEventListener('pointermove', function (e) {
      if (el.hasPointerCapture(e.pointerId)) { handler(e); }
    });
  }
  bindDrag(svArea, pickAt);
  bindDrag(hueBar, pickHue);
  svArea.addEventListener('keydown', function (e) {
    var step = e.shiftKey ? 0.1 : 0.02;
    if (e.key === 'ArrowRight') { sat = Math.min(1, sat + step); }
    else if (e.key === 'ArrowLeft') { sat = Math.max(0, sat - step); }
    else if (e.key === 'ArrowUp') { val = Math.min(1, val + step); }
    else if (e.key === 'ArrowDown') { val = Math.max(0, val - step); }
    else { return; }
    e.preventDefault();
    root.classList.remove('is-demo');
    applyColor();
  });
  hueBar.addEventListener('keydown', function (e) {
    var step = e.shiftKey ? 15 : 3;
    if (e.key === 'ArrowRight') { hue = Math.min(360, hue + step); }
    else if (e.key === 'ArrowLeft') { hue = Math.max(0, hue - step); }
    else { return; }
    e.preventDefault();
    root.classList.remove('is-demo');
    applyColor();
  });
  applyColor();
})();
</script>
</body>
</html>
