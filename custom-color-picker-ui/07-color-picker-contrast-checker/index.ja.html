<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WCAG contrast checker — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cc is-demo">
    <div class="cc__prev">
      <span class="cc__sample">本文の文字見本</span>
      <span class="cc__ratio" aria-hidden="true"></span>
    </div>
    <div class="cc__row">
      <span class="cc__badge cc__badge--aa" aria-hidden="true">
        <b class="cc__grade">AA</b>
        <span class="cc__state"><i class="cc__pass">合格</i><i class="cc__fail">不足</i></span>
      </span>
      <span class="cc__badge cc__badge--aaa" aria-hidden="true">
        <b class="cc__grade">AAA</b>
        <span class="cc__state"><i class="cc__pass">合格</i><i class="cc__fail">不足</i></span>
      </span>
      <input class="cc__input" id="ccInput" type="color" value="#2f6df6" aria-label="背景色を自分で選ぶ">
    </div>
    <div class="cc__sws">
      <button type="button" class="cc__sw" data-bg="#8aa9ff">2.28</button>
      <button type="button" class="cc__sw" data-bg="#4d8bf0">3.35</button>
      <button type="button" class="cc__sw" data-bg="#2f6df6">4.53</button>
      <button type="button" class="cc__sw" data-bg="#1f4fb8">7.32</button>
      <button type="button" class="cc__sw" data-bg="#17141a">18.24</button>
    </div>
    <span class="cc__live" aria-live="polite"></span>
  </div>
</main>
<script>
(function () {
  var root = document.querySelector('.cc');
  var input = document.getElementById('ccInput');
  var live = root.querySelector('.cc__live');
  var liveFormat = 'コントラスト比 %r 対 1、AA は %a、AAA は %b です';
  var passWord = '合格';
  var failWord = '不足';

  // WCAG 2.x 상대 휘도 — 채널마다 감마를 되돌린 뒤 사람 눈의 민감도로 가중한다
  function channel(c) { return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function luminance(hex) {
    var n = parseInt(hex.slice(1), 16);
    var r = channel(((n >> 16) & 255) / 255);
    var g = channel(((n >> 8) & 255) / 255);
    var b = channel((n & 255) / 255);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  // 글자는 흰색 고정이므로 밝은 쪽 휘도는 언제나 1 이다
  function ratioToWhite(hex) { return 1.05 / (luminance(hex) + 0.05); }
  function ratioToInk(hex) { return (luminance(hex) + 0.05) / (luminance('#17141a') + 0.05); }

  // 숫자 글자는 JS 가 쓰지 않는다 — 정수부와 소수 두 자리만 넘기면 계수기가 4.53 꼴로 찍는다
  function setBg(hex) {
    var ratio = ratioToWhite(hex);
    var whole = Math.floor(ratio);
    var frac = Math.round((ratio - whole) * 100);
    if (frac === 100) { whole += 1; frac = 0; }
    root.style.setProperty('--bg', hex);
    root.style.setProperty('--rw', whole);
    root.style.setProperty('--rf', frac);
    root.style.setProperty('--aa', ratio >= 4.5 ? 1 : 0);
    root.style.setProperty('--aaa', ratio >= 7 ? 1 : 0);
    live.textContent = liveFormat
      .replace('%r', whole + '.' + (frac < 10 ? '0' + frac : String(frac)))
      .replace('%a', ratio >= 4.5 ? passWord : failWord)
      .replace('%b', ratio >= 7 ? passWord : failWord);
  }

  [].slice.call(root.querySelectorAll('.cc__sw')).forEach(function (btn) {
    var hex = btn.getAttribute('data-bg');
    btn.style.background = hex;
    btn.style.color = ratioToWhite(hex) >= ratioToInk(hex) ? '#ffffff' : '#17141a';
    btn.addEventListener('click', function () {
      root.classList.remove('is-demo');
      input.value = hex;
      setBg(hex);
    });
  });

  input.addEventListener('input', function () {
    root.classList.remove('is-demo');
    setBg(input.value);
  });

  setBg(input.value);
})();
</script>
</body>
</html>
