<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hue harmony generator — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="hm is-demo">
    <div class="hm__top">
      <div class="hm__base" id="hmBase" role="slider" tabindex="0"
           aria-label="기준 색상값"
           aria-valuemin="0" aria-valuemax="360" aria-valuenow="262"
           aria-valuetext="기준 색상값 262도"></div>
      <span class="hm__basev" aria-hidden="true"></span>
      <span class="hm__names" aria-hidden="true">
        <b class="hm__name hm__name--1 is-on">보색 배색</b>
        <b class="hm__name hm__name--2">유사색 배색</b>
        <b class="hm__name hm__name--3">삼각 배색</b>
      </span>
    </div>
    <div class="hm__tabs" role="group" aria-label="배색 고르기">
      <button type="button" class="hm__tab" data-set="comp" aria-pressed="true">보색</button>
      <button type="button" class="hm__tab" data-set="ana" aria-pressed="false">유사색</button>
      <button type="button" class="hm__tab" data-set="tri" aria-pressed="false">삼각</button>
    </div>
    <ul class="hm__chips">
      <li class="hm__chip"><span class="hm__sw"></span><span class="hm__deg"></span></li>
      <li class="hm__chip"><span class="hm__sw"></span><span class="hm__deg"></span></li>
      <li class="hm__chip"><span class="hm__sw"></span><span class="hm__deg"></span></li>
      <li class="hm__chip"><span class="hm__sw"></span><span class="hm__deg"></span></li>
      <li class="hm__chip"><span class="hm__sw"></span><span class="hm__deg"></span></li>
    </ul>
  </div>
</main>
<script>
(function () {
  var root = document.querySelector('.hm');
  var base = document.getElementById('hmBase');
  var tabs = [].slice.call(root.querySelectorAll('.hm__tab'));
  var names = [].slice.call(root.querySelectorAll('.hm__name'));
  var baseFormat = '기준 색상값 %h도';
  // 배색 = 기준 색상값에 더할 각도 다섯 개. 칩 셋째 칸은 언제나 0 이라 기준 색 그대로다
  var sets = { comp: [0, 0, 0, 180, 180], ana: [-60, -30, 0, 30, 60], tri: [-120, -120, 0, 120, 120] };
  var hue = 262;
  var current = 'comp';

  // 글자와 색을 따로 쓰지 않는다 — 각도 다섯 개만 넘기면 hsl() 이 칩 색을, 계수기가 각도 글자를 찍는다
  function apply() {
    var offsets = sets[current];
    for (var i = 0; i < offsets.length; i++) {
      root.style.setProperty('--o' + (i + 1), offsets[i]);
    }
    root.style.setProperty('--base', hue);
    base.setAttribute('aria-valuenow', hue);
    base.setAttribute('aria-valuetext', baseFormat.replace('%h', hue));
    tabs.forEach(function (btn, i) {
      var on = btn.getAttribute('data-set') === current;
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      names[i].classList.toggle('is-on', on);
    });
  }

  tabs.forEach(function (btn) {
    btn.addEventListener('click', function () {
      current = btn.getAttribute('data-set');
      root.classList.remove('is-demo');
      apply();
    });
  });

  base.addEventListener('keydown', function (e) {
    var step = e.shiftKey ? 15 : 3;
    if (e.key === 'ArrowRight') { hue = (hue + step) % 360; }
    else if (e.key === 'ArrowLeft') { hue = (hue - step + 360) % 360; }
    else { return; }
    e.preventDefault();
    root.classList.remove('is-demo');
    apply();
  });

  apply();
})();
</script>
</body>
</html>
