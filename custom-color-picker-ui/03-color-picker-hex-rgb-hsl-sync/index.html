<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEX RGB HSL sync — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sy is-demo">
    <div class="sy__band" aria-hidden="true"></div>
    <div class="sy__row" data-kind="hex">
      <span class="sy__label" aria-hidden="true">HEX</span>
      <span class="sy__field">
        <input class="sy__input" type="text" spellcheck="false" autocomplete="off"
               aria-label="HEX 값 입력" aria-invalid="false" value="#0D78F2">
        <span class="sy__ghost sy__ghost--hex" aria-hidden="true"></span>
        <span class="sy__bad" aria-hidden="true">형식 오류</span>
      </span>
    </div>
    <div class="sy__row" data-kind="rgb">
      <span class="sy__label" aria-hidden="true">RGB</span>
      <span class="sy__field">
        <input class="sy__input" type="text" spellcheck="false" autocomplete="off"
               aria-label="RGB 값 입력" aria-invalid="false" value="rgb(13, 120, 242)">
        <span class="sy__ghost sy__ghost--rgb" aria-hidden="true"></span>
        <span class="sy__bad" aria-hidden="true">형식 오류</span>
      </span>
    </div>
    <div class="sy__row" data-kind="hsl">
      <span class="sy__label" aria-hidden="true">HSL</span>
      <span class="sy__field">
        <input class="sy__input" type="text" spellcheck="false" autocomplete="off"
               aria-label="HSL 값 입력" aria-invalid="false" value="hsl(212, 90%, 50%)">
        <span class="sy__ghost sy__ghost--hsl" aria-hidden="true"></span>
        <span class="sy__bad" aria-hidden="true">형식 오류</span>
      </span>
    </div>
  </div>
</main>
<script>
(function () {
  var root = document.querySelector('.sy');
  var rows = [].slice.call(document.querySelectorAll('.sy__row'));
  var rgb = [13, 120, 242];

  function pad(n) { return n.toString(16).padStart(2, '0'); }
  function toHex(c) { return ('#' + pad(c[0]) + pad(c[1]) + pad(c[2])).toUpperCase(); }

  // RGB(0~255) → HSL(0~360, 0~100%, 0~100%)
  function toHsl(c) {
    var r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    var l = (mx + mn) / 2;
    var s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    var h = 0;
    if (d !== 0 && mx === r) { h = 60 * (((g - b) / d) % 6); }
    else if (d !== 0 && mx === g) { h = 60 * ((b - r) / d + 2); }
    else if (d !== 0) { h = 60 * ((r - g) / d + 4); }
    return [Math.round((h + 360) % 360), Math.round(s * 100), Math.round(l * 100)];
  }
  // HSL → RGB. 육각형 여섯 구간을 표로 펴서 분기 없이 고른다
  function fromHsl(h, s, l) {
    var sf = s / 100, lf = l / 100;
    var c = (1 - Math.abs(2 * lf - 1)) * sf;
    var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    var m = lf - c / 2;
    var face = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][Math.floor(h / 60) % 6];
    return face.map(function (n) { return Math.round((n + m) * 255); });
  }
  // 세 표기 중 하나를 읽는다. 형식이 어긋나면 null 을 돌려주고 그 칸만 aria-invalid 로 남는다
  function parse(kind, raw) {
    var t = raw.trim(), m, v;
    if (kind === 'hex') {
      m = /^#?([0-9a-f]{6})$/i.exec(t);
      return m ? [0, 2, 4].map(function (i) { return parseInt(m[1].substr(i, 2), 16); }) : null;
    }
    if (kind === 'rgb') {
      m = /^rgb\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)$/i.exec(t);
      if (!m) { return null; }
      v = [1, 2, 3].map(function (i) { return parseInt(m[i], 10); });
      return v.some(function (n) { return n > 255; }) ? null : v;
    }
    m = /^hsl\(\s*(\d{1,3})\s*,\s*(\d{1,3})%\s*,\s*(\d{1,3})%\s*\)$/i.exec(t);
    if (!m) { return null; }
    v = [1, 2, 3].map(function (i) { return parseInt(m[i], 10); });
    return (v[0] > 360 || v[1] > 100 || v[2] > 100) ? null : fromHsl(v[0], v[1], v[2]);
  }
  function label(kind) {
    var hsl = toHsl(rgb);
    if (kind === 'hex') { return toHex(rgb); }
    if (kind === 'rgb') { return 'rgb(' + rgb[0] + ', ' + rgb[1] + ', ' + rgb[2] + ')'; }
    return 'hsl(' + hsl[0] + ', ' + hsl[1] + '%, ' + hsl[2] + '%)';
  }
  // 값 하나가 바뀌면 여섯 개의 등록 속성만 갱신한다 — 띠 색도 미리보기 글자도 거기서 나온다
  function paint(skip) {
    var hsl = toHsl(rgb);
    var vars = { '--r': rgb[0], '--g': rgb[1], '--b': rgb[2], '--hh': hsl[0], '--ss': hsl[1], '--ll': hsl[2] };
    Object.keys(vars).forEach(function (name) { root.style.setProperty(name, vars[name]); });
    rows.forEach(function (row) {
      var kind = row.getAttribute('data-kind');
      if (kind === skip) { return; }
      row.querySelector('.sy__input').value = label(kind);
      row.querySelector('.sy__input').setAttribute('aria-invalid', 'false');
      row.classList.remove('is-bad');
    });
  }
  rows.forEach(function (row) {
    var kind = row.getAttribute('data-kind');
    var input = row.querySelector('.sy__input');
    input.addEventListener('input', function () {
      root.classList.remove('is-demo');
      var next = parse(kind, input.value);
      input.setAttribute('aria-invalid', next ? 'false' : 'true');
      row.classList.toggle('is-bad', !next);
      if (next) { rgb = next; paint(kind); }
    });
  });
  paint(null);
})();
</script>
</body>
</html>
