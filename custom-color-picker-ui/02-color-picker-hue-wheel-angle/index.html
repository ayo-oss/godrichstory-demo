<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hue wheel angle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="hw is-demo">
    <div class="hw__ring" id="hueWheel" role="slider" tabindex="0"
         aria-label="색상환에서 각도로 고르기"
         aria-valuemin="0" aria-valuemax="360" aria-valuenow="212"
         aria-valuetext="색상환 각도 212도">
      <span class="hw__core" aria-hidden="true"></span>
      <span class="hw__arm" aria-hidden="true"></span>
    </div>
    <p class="hw__read" aria-hidden="true">
      <span class="hw__cap">색상환 각도</span><span class="hw__val"></span>
    </p>
  </div>
</main>
<script>
(function () {
  var root = document.querySelector('.hw');
  var wheel = document.getElementById('hueWheel');
  var hueFormat = '색상환 각도 %h도';
  var hue = 212;

  // 값은 --h 하나뿐이다. 손잡이 각도도, 가운데 원 색도, 아래 숫자도 전부 이 한 값에서 나온다 —
  // 글자는 CSS 계수기가 찍으므로 JS 가 숫자를 따로 쓸 일이 없고, 색과 글자가 어긋날 수가 없다
  function applyHue() {
    root.style.setProperty('--h', hue);
    wheel.setAttribute('aria-valuenow', hue);
    wheel.setAttribute('aria-valuetext', hueFormat.replace('%h', hue));
  }
  // 중심에서 포인터까지의 각도를 잰다. Math.atan2 는 3시 방향이 0 이고 시계방향으로 커지는데,
  // conic-gradient(from 90deg) 도 빨강(색상 0)을 3시에 놓는다 — 두 기준이 같아 보정 없이 그대로 색상값이다
  function pickAngle(e) {
    var box = wheel.getBoundingClientRect();
    var deg = Math.atan2(e.clientY - box.top - box.height / 2, e.clientX - box.left - box.width / 2) * 180 / Math.PI;
    hue = Math.round((deg + 360) % 360) % 360;   // 등록 속성 --h 는 정수만 받는다
    applyHue();
  }
  wheel.addEventListener('pointerdown', function (e) {
    root.classList.remove('is-demo');
    wheel.setPointerCapture(e.pointerId);   // 원 밖으로 끌어도 이 요소가 각도를 계속 받는다
    pickAngle(e);
  });
  wheel.addEventListener('pointermove', function (e) {
    if (wheel.hasPointerCapture(e.pointerId)) { pickAngle(e); }
  });
  wheel.addEventListener('keydown', function (e) {
    var step = e.shiftKey ? 15 : 3;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { hue = (hue + step) % 360; }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { hue = (hue - step + 360) % 360; }
    else { return; }
    e.preventDefault();
    root.classList.remove('is-demo');
    applyHue();
  });
  applyHue();
})();
</script>
</body>
</html>
