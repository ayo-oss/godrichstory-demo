<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient stop dragging — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="gs is-demo">
    <div class="gs__bar" id="gsBar">
      <span class="gs__stop gs__stop--a" aria-hidden="true"></span>
      <span class="gs__stop gs__stop--m" id="gsMid" role="slider" tabindex="0"
            aria-label="中央の停止点の位置"
            aria-valuemin="0" aria-valuemax="100" aria-valuenow="45"
            aria-valuetext="中央の停止点 45%"></span>
      <span class="gs__stop gs__stop--b" aria-hidden="true"></span>
    </div>
    <code class="gs__code" aria-hidden="true"></code>
    <div class="gs__foot">
      <span class="gs__pos" aria-hidden="true">中央 <b class="gs__pct"></b></span>
      <button type="button" class="gs__copy" id="gsCopy" aria-label="CSS 文字列をコピー">
        <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216,40V168H168V88H88V40Z" opacity="0.2"/><path d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z"/></svg>
      </button>
    </div>
    <span class="gs__live" aria-live="polite"></span>
  </div>
</main>
<script>
(function () {
  var root = document.querySelector('.gs');
  var bar = document.getElementById('gsBar');
  var mid = document.getElementById('gsMid');
  var copyBtn = document.getElementById('gsCopy');
  var live = root.querySelector('.gs__live');
  var midFormat = '中央の停止点 %p%';
  var copiedText = 'コピーしました';
  var pos = 45;

  // 화면에 보이는 문자열과 복사되는 문자열은 같은 pos 하나에서 나온다.
  // 막대 배경·손잡이 자리·아래 글자는 CSS 가 --p 에서 만들고, 복사본만 여기서 조립한다
  function cssText() {
    return 'linear-gradient(90deg, #ff4d1f 0%, #ffd23f ' + pos + '%, #2f6df6 100%)';
  }
  function apply() {
    root.style.setProperty('--p', pos);
    mid.setAttribute('aria-valuenow', pos);
    mid.setAttribute('aria-valuetext', midFormat.replace('%p', pos));
  }
  function pickAt(e) {
    var box = bar.getBoundingClientRect();
    pos = Math.round(Math.min(100, Math.max(0, (e.clientX - box.left) / box.width * 100)));
    apply();
  }

  bar.addEventListener('pointerdown', function (e) {
    root.classList.remove('is-demo');
    bar.setPointerCapture(e.pointerId);   // 막대 밖으로 끌어도 이 요소가 계속 포인터를 받는다
    pickAt(e);
  });
  bar.addEventListener('pointermove', function (e) {
    if (bar.hasPointerCapture(e.pointerId)) { pickAt(e); }
  });

  mid.addEventListener('keydown', function (e) {
    var step = e.shiftKey ? 10 : 1;
    if (e.key === 'ArrowRight') { pos = Math.min(100, pos + step); }
    else if (e.key === 'ArrowLeft') { pos = Math.max(0, pos - step); }
    else { return; }
    e.preventDefault();
    root.classList.remove('is-demo');
    apply();
  });

  copyBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    if (navigator.clipboard) { navigator.clipboard.writeText(cssText()); }
    live.textContent = copiedText;
  });

  apply();
})();
</script>
</body>
</html>
