<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas eyedropper — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ed is-demo">
    <div class="ed__box" id="edBox" role="slider" tabindex="0"
         aria-label="그림 위에서 색 집기"
         aria-valuemin="0" aria-valuemax="264" aria-valuenow="40"
         aria-valuetext="가로 40픽셀 지점, #FF7528">
      <canvas class="ed__canvas" id="edCanvas" width="264" height="88"
              role="img" aria-label="주황에서 노랑을 지나 파랑으로 가는 색 띠"></canvas>
      <span class="ed__loupe" id="edLoupe" aria-hidden="true"></span>
    </div>
    <div class="ed__foot">
      <span class="ed__chip" aria-hidden="true"></span>
      <span class="ed__hex" aria-hidden="true"></span>
      <button type="button" class="ed__pick" id="edPick">
        <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M207.8,87.6l-25.37,25.53,4.89,4.88a16,16,0,0,1,0,22.64l-9,9a8,8,0,0,1-11.32,0l-60.68-60.7a8,8,0,0,1,0-11.32l9-9a16,16,0,0,1,22.63,0l4.88,4.89,25-25.11c10.79-10.79,28.37-11.45,39.45-1A28,28,0,0,1,207.8,87.6Z" opacity="0.2"/><path d="M224,67.3a35.79,35.79,0,0,0-11.26-25.66c-14-13.28-36.72-12.78-50.62,1.13L142.8,62.2a24,24,0,0,0-33.14.77l-9,9a16,16,0,0,0,0,22.64l2,2.06-51,51a39.75,39.75,0,0,0-10.53,38l-8,18.41A13.68,13.68,0,0,0,36,219.3a15.92,15.92,0,0,0,17.71,3.35L71.23,215a39.89,39.89,0,0,0,37.06-10.75l51-51,2.06,2.06a16,16,0,0,0,22.62,0l9-9a24,24,0,0,0,.74-33.18l19.75-19.87A35.75,35.75,0,0,0,224,67.3ZM97,193a24,24,0,0,1-24,6,8,8,0,0,0-5.55.31l-18.1,7.91L57,189.41a8,8,0,0,0,.25-5.75A23.88,23.88,0,0,1,63,159l51-51,33.94,34ZM202.13,82l-25.37,25.52a8,8,0,0,0,0,11.3l4.89,4.89a8,8,0,0,1,0,11.32l-9,9L112,83.26l9-9a8,8,0,0,1,11.31,0l4.89,4.89a8,8,0,0,0,5.65,2.34h0a8,8,0,0,0,5.66-2.36l24.94-25.09c7.81-7.82,20.5-8.18,28.29-.81a20,20,0,0,1,.39,28.7Z"/></svg>
        <span>화면에서 집기</span>
      </button>
    </div>
    <span class="ed__live" aria-live="polite"></span>
  </div>
</main>
<script>
(function () {
  var root = document.querySelector('.ed');
  var box = document.getElementById('edBox');
  var canvas = document.getElementById('edCanvas');
  var loupe = document.getElementById('edLoupe');
  var pickBtn = document.getElementById('edPick');
  var live = root.querySelector('.ed__live');
  var spotFormat = '가로 %x픽셀 지점, %c';
  var liveFormat = '집은 색 %c';
  var ctx = canvas.getContext('2d');
  var sx = 40, sy = 28;

  // 위쪽 56px 은 가로 3색 띠 — 채널마다 1차 보간이라 x 좌표와 색이 정확히 대응한다.
  // 아래 32px 은 장식이라 미리보기 루프의 스포이드 경로가 지나가지 않는다
  function paint() {
    var band = ctx.createLinearGradient(0, 0, 264, 0);
    band.addColorStop(0, '#ff4d1f');
    band.addColorStop(0.5, '#ffd23f');
    band.addColorStop(1, '#2f6df6');
    ctx.fillStyle = band;
    ctx.fillRect(0, 0, 264, 56);
    ctx.fillStyle = '#17141a';
    ctx.fillRect(0, 56, 264, 32);
    var dots = [[34, 72, 10, '#ff9ebb'], [86, 72, 13, '#4cd4a6'], [146, 72, 9, '#b9a0ff'], [206, 72, 12, '#6ec8ff']];
    for (var i = 0; i < dots.length; i++) {
      ctx.beginPath();
      ctx.arc(dots[i][0], dots[i][1], dots[i][2], 0, Math.PI * 2);
      ctx.fillStyle = dots[i][3];
      ctx.fill();
    }
  }

  function toHex(r, g, b) {
    return '#' + [r, g, b].map(function (n) { return n.toString(16).padStart(2, '0'); }).join('').toUpperCase();
  }

  // 글자는 JS 가 쓰지 않는다 — --r --g --b 세 값만 넘기면 계수기가 HEX 를 찍고 칩·루페가 같은 색이 된다
  function setColor(r, g, b) {
    root.style.setProperty('--r', r);
    root.style.setProperty('--g', g);
    root.style.setProperty('--b', b);
    loupe.style.transform = 'translate(' + sx + 'px, ' + sy + 'px) translate(-50%, -50%)';
    var hex = toHex(r, g, b);
    box.setAttribute('aria-valuenow', sx);
    box.setAttribute('aria-valuetext', spotFormat.replace('%x', sx).replace('%c', hex));
    live.textContent = liveFormat.replace('%c', hex);
  }

  function sample() {
    var px = ctx.getImageData(sx, sy, 1, 1).data;   // 그 한 점의 RGBA
    setColor(px[0], px[1], px[2]);
  }

  function moveTo(e) {
    var rect = canvas.getBoundingClientRect();
    sx = Math.round(Math.min(263, Math.max(0, (e.clientX - rect.left) / rect.width * 264)));
    sy = Math.round(Math.min(87, Math.max(0, (e.clientY - rect.top) / rect.height * 88)));
    sample();
  }

  canvas.addEventListener('pointermove', function (e) {
    root.classList.remove('is-demo');
    moveTo(e);
  });
  canvas.addEventListener('pointerdown', function (e) {
    root.classList.remove('is-demo');
    moveTo(e);
  });

  box.addEventListener('keydown', function (e) {
    var step = e.shiftKey ? 16 : 4;
    if (e.key === 'ArrowRight') { sx = Math.min(263, sx + step); }
    else if (e.key === 'ArrowLeft') { sx = Math.max(0, sx - step); }
    else if (e.key === 'ArrowDown') { sy = Math.min(87, sy + step); }
    else if (e.key === 'ArrowUp') { sy = Math.max(0, sy - step); }
    else { return; }
    e.preventDefault();
    root.classList.remove('is-demo');
    sample();
  });

  pickBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    // 크롬 계열은 화면 어디서나 집는다. 없는 브라우저는 캔버스 위 집기로 조용히 내려간다
    if ('EyeDropper' in window) {
      new window.EyeDropper().open().then(function (res) {
        var n = parseInt(res.sRGBHex.slice(1), 16);
        setColor((n >> 16) & 255, (n >> 8) & 255, n & 255);
      }).catch(function () { sample(); });
    } else {
      sample();
    }
  });

  paint();
  sample();
})();
</script>
</body>
</html>
