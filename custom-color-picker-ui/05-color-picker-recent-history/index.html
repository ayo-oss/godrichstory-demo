<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recent colors history — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="rc is-demo">
    <div class="rc__top">
      <button class="rc__now" id="nowSwatch" type="button" aria-label="지금 색"></button>
      <button class="rc__add" id="addButton" type="button">담기</button>
    </div>
    <p class="rc__cap" aria-hidden="true">최근 고른 색</p>
    <div class="rc__hist">
      <button class="rc__cell" type="button" aria-pressed="true" aria-label="최근 색"></button>
      <button class="rc__cell" type="button" aria-pressed="false" aria-label="최근 색"></button>
      <button class="rc__cell" type="button" aria-pressed="false" aria-label="최근 색"></button>
      <button class="rc__cell" type="button" aria-pressed="false" aria-label="최근 색"></button>
      <button class="rc__cell" type="button" aria-pressed="false" aria-label="최근 색"></button>
      <button class="rc__cell" type="button" aria-pressed="false" aria-label="최근 색"></button>
      <button class="rc__cell" type="button" aria-pressed="false" aria-label="최근 색"></button>
      <button class="rc__cell" type="button" aria-pressed="false" aria-label="최근 색"></button>
    </div>
  </div>
</main>
<script>
(function () {
  var root = document.querySelector('.rc');
  var now = document.getElementById('nowSwatch');
  var addButton = document.getElementById('addButton');
  var cells = [].slice.call(document.querySelectorAll('.rc__cell'));
  var nowFormat = '지금 색 %x, 누르면 다음 색';
  var cellFormat = '최근 색 %x';
  var palette = ['#2F6DF6', '#6EC8FF', '#4CD4A6', '#FFD23F', '#FF4D1F', '#FF9EBB', '#B9A0FF', '#FFF7E6'];
  var storeKey = 'godrich-recent-colors';
  var step = 0;
  var recent = read();

  // 목록은 localStorage 에 남는다. 파일로 열면 저장소가 막힐 수 있어 실패해도 기본 팔레트로 이어간다
  function read() {
    try {
      var raw = window.localStorage.getItem(storeKey);
      var list = raw ? JSON.parse(raw) : null;
      if (list && list.length) { return list.slice(0, 8); }
    } catch (err) { /* 저장소를 못 쓰는 환경 */ }
    return palette.slice();
  }
  function save(list) {
    try { window.localStorage.setItem(storeKey, JSON.stringify(list)); } catch (err) { /* 무시 */ }
  }
  // 글자도 색도 JS 가 한 곳에서만 쓴다 — 칸 색은 --c, 라벨은 같은 HEX 값에서 나온다
  function paint() {
    now.style.setProperty('--c', palette[step]);
    now.setAttribute('aria-label', nowFormat.replace('%x', palette[step]));
    cells.forEach(function (cell, i) {
      var hex = recent[i] || palette[i];
      cell.style.setProperty('--c', hex);
      cell.setAttribute('aria-label', cellFormat.replace('%x', hex));
      cell.setAttribute('aria-pressed', hex === palette[step] ? 'true' : 'false');
    });
  }
  function stopLoop() { root.classList.remove('is-demo'); }

  now.addEventListener('click', function () {
    stopLoop();
    step = (step + 1) % palette.length;
    paint();
  });
  addButton.addEventListener('click', function () {
    stopLoop();
    // 지금 색이 맨 앞에 끼어들고 아홉 번째는 잘려 나간다. 저장한 뒤 다시 읽어 칸을 그린다
    var next = [palette[step]].concat(recent.filter(function (hex) { return hex !== palette[step]; }));
    save(next.slice(0, 8));
    recent = read();
    paint();
  });
  cells.forEach(function (cell, i) {
    cell.addEventListener('click', function () {
      stopLoop();
      var at = palette.indexOf(recent[i]);
      if (at >= 0) { step = at; }
      paint();
    });
  });
  paint();
})();
</script>
</body>
</html>
