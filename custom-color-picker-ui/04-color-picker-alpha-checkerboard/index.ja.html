<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha slider on checkerboard — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="al is-demo">
    <p class="al__head" aria-hidden="true">
      <span class="al__cap">透明度</span><span class="al__val"></span>
    </p>
    <div class="al__track" id="alphaTrack" role="slider" tabindex="0"
         aria-label="透明度を選ぶ"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"
         aria-valuetext="透明度 100%">
      <span class="al__knob" aria-hidden="true"></span>
    </div>
    <p class="al__note" aria-hidden="true">市松模様の上のプレビュー</p>
    <div class="al__preview" aria-hidden="true"><span class="al__fill"></span></div>
  </div>
</main>
<script>
(function () {
  var root = document.querySelector('.al');
  var track = document.getElementById('alphaTrack');
  var alphaFormat = '透明度 %a%';
  var alpha = 100;

  // 값은 --a 하나뿐이다. 손잡이 위치도, 미리보기 사각형의 불투명도도, 옆의 숫자도 전부 이 한 값에서 나온다
  function applyAlpha() {
    root.style.setProperty('--a', alpha);
    track.setAttribute('aria-valuenow', alpha);
    track.setAttribute('aria-valuetext', alphaFormat.replace('%a', alpha));
  }
  function pickAlpha(e) {
    var box = track.getBoundingClientRect();
    var t = Math.min(1, Math.max(0, (e.clientX - box.left) / box.width));
    alpha = Math.round(t * 100);
    applyAlpha();
  }
  track.addEventListener('pointerdown', function (e) {
    root.classList.remove('is-demo');
    track.setPointerCapture(e.pointerId);   // 띠 밖으로 끌어도 이 요소가 계속 포인터를 받는다
    pickAlpha(e);
  });
  track.addEventListener('pointermove', function (e) {
    if (track.hasPointerCapture(e.pointerId)) { pickAlpha(e); }
  });
  track.addEventListener('keydown', function (e) {
    var step = e.shiftKey ? 10 : 2;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { alpha = Math.min(100, alpha + step); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { alpha = Math.max(0, alpha - step); }
    else { return; }
    e.preventDefault();
    root.classList.remove('is-demo');
    applyAlpha();
  });
  applyAlpha();
})();
</script>
</body>
</html>
