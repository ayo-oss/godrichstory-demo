<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character count bump — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cc is-demo">
    <label class="cc__label" for="cc-bio">Tiểu sử</label>
    <textarea id="cc-bio" class="cc__input" maxlength="40" placeholder="Giới thiệu ngắn (tối đa 40 ký tự)" rows="2"></textarea>
    <span class="cc__count" aria-live="polite"><b class="cc__num">0</b>/40</span>
  </div>
</main>
<script>
// 실사용: 입력할 때마다 남은 글자 수를 세고 튕긴다. 데모(.is-demo)는 값을 흉내내 반복 (9줄)
var ta = document.querySelector('.is-demo .cc__input');
var num = document.querySelector('.is-demo .cc__num');
var texts = ['', 'Xin chào', 'Xin chào, tôi là dev'];
var i = 0;
var t = function () {
  ta.value = texts[i % texts.length]; i += 1;
  num.textContent = String(ta.value.length);
  num.parentElement.classList.remove('is-bump'); void num.offsetWidth; num.parentElement.classList.add('is-bump');
};
t(); setInterval(t, 450);
</script>
</body>
</html>
