<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>남은 용량·속도로 다시 계산하는 예상 시간 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="etaCard is-demo" id="etaCard">
  <div class="track" id="track" role="progressbar" aria-label="받은 용량" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="fill" id="fill"></div>
  </div>
  <p class="eta" id="eta" aria-live="polite">계산 중</p>
  <p class="detail" id="detail">0.0MB / 48.0MB · 0.0MB/s</p>
  <button class="pauseBtn" id="pauseBtn" type="button" aria-pressed="false">일시정지</button>
</div>
<script>
(function () {
  var TOTAL_MB = 48;
  var LOOP_MS = 7000; // 이 시간 안에 전체를 받는 기준 사이클
  var TICK_MS = 120;
  var BASE_SPEED_MBPS = TOTAL_MB / (LOOP_MS / 1000);
  var SPEED_VARIANCE = 0.55; // 속도 흔들림 비율

  var etaCard = document.getElementById('etaCard');
  var track = document.getElementById('track');
  var fill = document.getElementById('fill');
  var etaEl = document.getElementById('eta');
  var detail = document.getElementById('detail');
  var pauseBtn = document.getElementById('pauseBtn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var loadedMb = 0;
  var lastMs = 0;
  var paused = false;

  // 결정론적 합성파로 순간 전송 속도를 흉내낸다 — 매 틱 다른 속도라 ETA 가 매번 다시 계산된다
  function instSpeed(ms) {
    var w = 1 + SPEED_VARIANCE * Math.sin(ms / 480) + 0.2 * Math.sin(ms / 133);
    return Math.max(0.15, BASE_SPEED_MBPS * w);
  }

  function paint(speed) {
    var pct = Math.min(100, (loadedMb / TOTAL_MB) * 100);
    fill.style.setProperty('--fill-pct', pct.toFixed(1) + '%');
    track.setAttribute('aria-valuenow', String(Math.round(pct)));
    detail.textContent = loadedMb.toFixed(1) + 'MB / ' + TOTAL_MB.toFixed(1) + 'MB · ' + speed.toFixed(1) + 'MB/s';
    if (paused) {
      etaEl.textContent = '일시정지됨';
    } else if (loadedMb >= TOTAL_MB) {
      etaEl.textContent = '받기 완료';
    } else {
      // 남은 용량 ÷ 지금 속도 = 예상 시간 — 저장해 둔 카운트다운이 아니라 매 틱 새로 나눈 값
      var remaining = TOTAL_MB - loadedMb;
      var etaSec = remaining / speed;
      etaEl.textContent = '약 ' + Math.ceil(etaSec) + '초 남음';
    }
  }

  function tick(nowMs) {
    var dtMs = lastMs === 0 ? 0 : nowMs - lastMs;
    lastMs = nowMs;
    var speed = instSpeed(nowMs);
    if (!paused && loadedMb < TOTAL_MB) {
      loadedMb = Math.min(TOTAL_MB, loadedMb + speed * (dtMs / 1000));
    }
    if (loadedMb >= TOTAL_MB && !paused) {
      loadedMb = 0; // 데모 루프 — 완료 뒤 처음부터 다시
    }
    paint(speed);
  }

  var timer = null;
  var start = 0;
  function loop() { tick(performance.now() - start); }

  function human() {
    if (etaCard.classList.contains('is-demo')) {
      etaCard.classList.remove('is-demo');
      window.clearInterval(timer);
      timer = null;
    }
  }

  pauseBtn.addEventListener('click', function () {
    human();
    paused = !paused;
    pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
    pauseBtn.textContent = paused ? '이어받기' : '일시정지';
    paint(instSpeed(performance.now() - start));
    if (!timer) {
      lastMs = performance.now() - start;
      timer = window.setInterval(loop, TICK_MS);
    }
  });

  if (!reduce) {
    start = performance.now();
    tick(0);
    timer = window.setInterval(loop, TICK_MS);
  } else {
    // reduce: 실사용 경로 적용 — 채움 막대 전환만 멈추고 남은 시간 문구는 한 값으로 고정해 보여준다
    loadedMb = TOTAL_MB * 0.4;
    paint(BASE_SPEED_MBPS);
  }
})();
</script>
</main>
</body>
</html>
