<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waveform That Fills as It Buffers — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="waveWrap is-demo" id="waveWrap" role="progressbar" aria-label="Audio buffer progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="bars" id="bars"></div>
  <div class="film" id="film"></div>
</div>
<button class="skipBtn" id="skipBtn" type="button">Skip to buffered point</button>
<script>
(function () {
  var WAVEFORM_FILL_EASE = 'linear'; // 훅 — 변형이 cubic-bezier(.22,1,.36,1) 로 바꾸는 값
  var BAR_COUNT = 22;
  var LOOP_MS = 2000;
  var TICK_MS = 70;
  var BUMP_PX = 10; // Buffer 경계 막대가 채워지는 순간 살짝 솟는 최대 높이

  // 고정 패턴(사인 두 겹 합성) — Math.random 없이 매번 같은 파형을 만든다
  var HEIGHTS = [];
  for (var i = 0; i < BAR_COUNT; i++) {
    var v = 18 + 16 * Math.abs(Math.sin(i * 0.7)) + 8 * Math.abs(Math.sin(i * 1.9));
    HEIGHTS.push(Math.round(v));
  }

  var wrap = document.getElementById('waveWrap');
  var barsEl = document.getElementById('bars');
  var film = document.getElementById('film');
  var skipBtn = document.getElementById('skipBtn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var bars = HEIGHTS.map(function (h, i) {
    var b = document.createElement('span');
    b.className = 'bar';
    b.style.setProperty('--h', h + 'px');
    barsEl.appendChild(b);
    return b;
  });

  // 3차 베지어 이징 평가기 — WAVEFORM_FILL_EASE 값을 실제 진행률 곡선에 반영한다
  function bezier(x1, y1, x2, y2) {
    function s(a, b) { return 3 * a * (1 - 3 * b + 3 * a) + 3 * b * b * (0); }
    function bx(t) { return 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t; }
    function by(t) { return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t; }
    return function (x) {
      var t = x;
      for (var it = 0; it < 6; it++) {
        var cx = bx(t) - x;
        var d = 3 * (1 - t) * (1 - t) * x1 + 6 * (1 - t) * t * (x2 - x1) + 3 * t * t * (1 - x2);
        if (Math.abs(d) < 1e-6) break;
        t -= cx / d;
        t = Math.min(1, Math.max(0, t));
      }
      return by(t);
    };
  }

  function easeFn() {
    if (WAVEFORM_FILL_EASE === 'linear') return function (x) { return x; };
    var nums = WAVEFORM_FILL_EASE.replace('cubic-bezier(', '').replace(')', '').split(',').map(Number);
    return bezier(nums[0], nums[1], nums[2], nums[3]);
  }
  var ease = easeFn();

  function paint(pct) {
    var pctStr = (pct * 100).toFixed(1) + '%';
    film.style.setProperty('--buffer-pct', pctStr);
    wrap.setAttribute('aria-valuenow', String(Math.round(pct * 100)));
    var raw = pct * BAR_COUNT;
    var idx = Math.min(BAR_COUNT - 1, Math.floor(raw));
    var frac = raw - idx;
    bars.forEach(function (b, i) {
      var bump = i === idx ? Math.sin(frac * Math.PI) * BUMP_PX : 0;
      b.style.setProperty('--bump', bump.toFixed(1) + 'px');
    });
  }

  var manualPct = null;

  function tick(elapsedMs) {
    if (manualPct !== null) { paint(manualPct); return; }
    var t = (elapsedMs % LOOP_MS) / LOOP_MS;
    paint(ease(t));
  }

  var timer = null;
  var start = 0;
  function loop() { tick(performance.now() - start); }

  function human() {
    if (wrap.classList.contains('is-demo')) {
      wrap.classList.remove('is-demo');
      window.clearInterval(timer);
      timer = null;
    }
  }

  skipBtn.addEventListener('click', function () {
    human();
    manualPct = 1;
    paint(1);
  });

  if (!reduce) {
    start = performance.now();
    tick(0);
    timer = window.setInterval(loop, TICK_MS);
  } else {
    // reduce: 실사용 경로 — 채워지는 전환은 멈추고 Buffer 진행률을 고정된 한 장면으로만 보여준다
    paint(0.55);
  }
})();
</script>
</main>
</body>
</html>
