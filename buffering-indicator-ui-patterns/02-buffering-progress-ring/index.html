<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재생·버퍼 이중 링 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ringWrap is-demo" id="ringWrap" role="progressbar" aria-label="버퍼 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="bufferRing" id="bufferRing"></div>
  <svg class="playRing" id="playRing" viewBox="0 0 120 120" aria-hidden="true">
    <circle class="playTrack" cx="60" cy="60" r="42"></circle>
    <circle class="playValue" id="playValue" cx="60" cy="60" r="42"></circle>
  </svg>
  <div class="readout">
    <span class="pct" id="bufferPct">0%</span>
    <span class="label">버퍼</span>
  </div>
</div>
<button class="jumpBtn" id="jumpBtn" type="button">버퍼 끝으로 재생 이동</button>
<script>
(function () {
  var BUFFER_RING_STROKE_WIDTH = 6; // px — 변형이 6→14 로 바꾸는 값
  var LOOP_MS = 2000; // 캡처 창과 같은 한 사이클
  var TICK_MS = 50;
  var PLAY_R = 42;
  var CIRC = 2 * Math.PI * PLAY_R;

  var wrap = document.getElementById('ringWrap');
  var bufferRing = document.getElementById('bufferRing');
  var playValue = document.getElementById('playValue');
  var bufferPctEl = document.getElementById('bufferPct');
  var jumpBtn = document.getElementById('jumpBtn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  wrap.style.setProperty('--ring-w', BUFFER_RING_STROKE_WIDTH + 'px');
  playValue.style.strokeWidth = '4';
  playValue.setAttribute('stroke-dasharray', CIRC.toFixed(2));

  function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  var manualPlay = null;

  // 버퍼 퍼센트·재생 퍼센트를 각도(그라디언트 정지점)·둘레 길이(stroke-dashoffset)로 바꾸는 산술
  function apply(bufferFrac, playFrac) {
    var bp = Math.round(bufferFrac * 100);
    bufferRing.style.setProperty('--buffer-pct', bp + '%');
    var offset = CIRC * (1 - playFrac);
    playValue.style.strokeDashoffset = offset.toFixed(2);
    bufferPctEl.textContent = bp + '%';
    wrap.setAttribute('aria-valuenow', String(bp));
  }

  function tick(elapsedMs) {
    var t = (elapsedMs % LOOP_MS) / LOOP_MS;
    var bufferFrac = lerp(0.32, 0.95, t);
    var playFrac = manualPlay !== null ? manualPlay : lerp(0.04, 0.8, easeInOut(t));
    apply(bufferFrac, Math.min(playFrac, bufferFrac));
  }

  var timer = null;
  var start = 0;
  function loop() { tick(performance.now() - start); }

  function human() {
    if (wrap.classList.contains('is-demo')) {
      wrap.classList.remove('is-demo');
      window.clearInterval(timer);
      timer = null;
    }
  }

  jumpBtn.addEventListener('click', function () {
    human();
    var bp = parseFloat(bufferRing.style.getPropertyValue('--buffer-pct')) / 100;
    manualPlay = bp;
    apply(bp, bp);
  });

  if (!reduce) {
    start = performance.now();
    tick(0);
    timer = window.setInterval(loop, TICK_MS);
  } else {
    // reduce: 실사용 경로 — 링은 계속 진행률을 나타내야 하므로 애니메이션(전환)만 끄고 값은 정적으로 한 번 그린다
    apply(0.62, 0.4);
  }
})();
</script>
</main>
</body>
</html>
