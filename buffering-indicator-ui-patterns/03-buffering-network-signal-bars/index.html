<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신호 세기 막대 버퍼 표시 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="meter is-demo" id="meter" role="img" aria-label="네트워크 신호 세기">
  <span class="bar" data-i="0"></span>
  <span class="bar" data-i="1"></span>
  <span class="bar" data-i="2"></span>
  <span class="bar" data-i="3"></span>
  <span class="bar" data-i="4"></span>
</div>
<p class="readout" id="readout">신호 보통</p>
<button class="pinBtn" id="pinBtn" type="button" aria-pressed="false">이 세기로 고정</button>
<script>
(function () {
  var BAR_COUNT = 5;
  var TICK_MS = 90; // 신호 재측정 간격
  var CHANGE_MARGIN = 0.6; // 히스테리시스 — 표시 레벨을 바꾸려면 이만큼은 벌어져야 한다(레벨 단위)
  var HOLD_TICKS = 3; // 새 레벨이 이 틱 수만큼 계속 유지돼야 실제로 바뀐다

  var meter = document.getElementById('meter');
  var bars = Array.prototype.slice.call(meter.querySelectorAll('.bar'));
  var readout = document.getElementById('readout');
  var pinBtn = document.getElementById('pinBtn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var labels = ['신호 약함', '신호 약함', '신호 보통', '신호 양호', '신호 강함'];
  var displayLevel = 2;
  var pendingLevel = 2;
  var pendingCount = 0;
  var pinned = null;

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  // 결정론적 합성파로 "속도"를 흉내내고, 그 값을 0~5 레벨로 양자화한 뒤 히스테리시스를 거친다
  function rawSpeed(ms) {
    var w = 0.5 + 0.5 * Math.sin(ms / 700) + 0.25 * Math.sin(ms / 233) + 0.15 * Math.sin(ms / 97);
    return clamp(w, 0, 1.35);
  }

  function paint(level) {
    bars.forEach(function (b, i) {
      b.style.setProperty('--bar-level', i < level ? '1' : '.22');
    });
    readout.textContent = labels[clamp(level, 0, 4)];
    meter.setAttribute('aria-label', '네트워크 신호 세기 ' + level + ' / ' + BAR_COUNT);
  }

  function tick(ms) {
    if (pinned !== null) return;
    var raw = rawSpeed(ms) * BAR_COUNT;
    var targetLevel = clamp(Math.round(raw), 0, BAR_COUNT);
    if (targetLevel !== displayLevel && Math.abs(raw - displayLevel) > CHANGE_MARGIN) {
      if (targetLevel === pendingLevel) {
        pendingCount++;
      } else {
        pendingLevel = targetLevel;
        pendingCount = 1;
      }
      if (pendingCount >= HOLD_TICKS) {
        displayLevel = pendingLevel;
        pendingCount = 0;
      }
    } else {
      pendingCount = 0;
      pendingLevel = displayLevel;
    }
    paint(displayLevel);
  }

  var timer = null;
  var start = 0;
  function loop() { tick(performance.now() - start); }

  function human() {
    if (meter.classList.contains('is-demo')) {
      meter.classList.remove('is-demo');
      window.clearInterval(timer);
      timer = null;
    }
  }

  pinBtn.addEventListener('click', function () {
    human();
    if (pinned === null) {
      pinned = displayLevel;
      pinBtn.setAttribute('aria-pressed', 'true');
      pinBtn.textContent = '고정 풀기';
    } else {
      pinned = null;
      pinBtn.setAttribute('aria-pressed', 'false');
      pinBtn.textContent = '이 세기로 고정';
    }
  });

  if (!reduce) {
    start = performance.now();
    tick(0);
    timer = window.setInterval(loop, TICK_MS);
  } else {
    // reduce: 실사용 경로 — 막대 높이 전환은 멈추고 마지막 측정 레벨 하나로 고정해 보여준다
    paint(3);
  }
})();
</script>
</main>
</body>
</html>
