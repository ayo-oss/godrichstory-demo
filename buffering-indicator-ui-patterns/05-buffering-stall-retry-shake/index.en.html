<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retry Icon That Shakes After Stall Detection — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="stallCard is-demo" id="stallCard">
  <div class="iconWrap" id="iconWrap" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 256 256">
      <g fill="currentColor">
        <path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/>
        <path d="M240 56v48a8 8 0 0 1-8 8h-48a8 8 0 0 1 0-16h27.4l-26.59-24.36l-.25-.24a80 80 0 1 0-1.67 114.78a8 8 0 0 1 11 11.63A95.44 95.44 0 0 1 128 224h-1.32a96 96 0 1 1 69.07-164L224 85.8V56a8 8 0 1 1 16 0"/>
      </g>
    </svg>
  </div>
  <p class="status" id="status" aria-live="polite">Playing normally</p>
  <button class="retryBtn" id="retryBtn" type="button">Retry now</button>
</div>
<script>
(function () {
  var LOOP_MS = 2000;
  var TICK_MS = 30;
  var NORMAL_FRAC = 0.15; // 이 지점까지는 Playing normally
  var STALL_FRAC = 0.92; // 이 지점부터 Playback resumed
  var STALL_THRESHOLD_MS = 300; // 정지가 이만큼 지속돼야 흔들림이 시작된다
  var SHAKE_DECAY = 0.0018; // 감쇠율 — 클수록 빨리 잦아든다
  var SHAKE_FREQ = 0.05; // 각속도
  var SHAKE_AMP_PX = 9;

  var card = document.getElementById('stallCard');
  var iconWrap = document.getElementById('iconWrap');
  var status = document.getElementById('status');
  var retryBtn = document.getElementById('retryBtn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function setStatus(text) {
    if (status.textContent !== text) status.textContent = text;
  }

  // 정지 지속 시간(ms) 을 감쇠 사인파의 위상으로 바꿔 흔들림 폭을 계산한다 — CSS keyframe 이 아니라 매 틱 산술
  function shakeOffset(stallOverMs) {
    var amp = SHAKE_AMP_PX * Math.exp(-SHAKE_DECAY * stallOverMs);
    return amp * Math.sin(stallOverMs * SHAKE_FREQ);
  }

  var manualRecovered = null;

  function tick(elapsedMs) {
    if (manualRecovered !== null) return;
    var loopPos = elapsedMs % LOOP_MS;
    var normalEnd = LOOP_MS * NORMAL_FRAC;
    var stallEnd = LOOP_MS * STALL_FRAC;
    if (loopPos < normalEnd) {
      setStatus('Playing normally');
      iconWrap.style.transform = 'translateX(0px)';
      card.classList.remove('is-stalled');
    } else if (loopPos < stallEnd) {
      var stallElapsed = loopPos - normalEnd;
      card.classList.add('is-stalled');
      if (stallElapsed > STALL_THRESHOLD_MS) {
        setStatus('Connection lost, retrying');
        var offset = shakeOffset(stallElapsed - STALL_THRESHOLD_MS);
        iconWrap.style.transform = 'translateX(' + offset.toFixed(2) + 'px)';
      } else {
        setStatus('Stalled');
        iconWrap.style.transform = 'translateX(0px)';
      }
    } else {
      setStatus('Playback resumed');
      iconWrap.style.transform = 'translateX(0px)';
      card.classList.remove('is-stalled');
    }
  }

  var timer = null;
  var start = 0;
  function loop() { tick(performance.now() - start); }

  function human() {
    if (card.classList.contains('is-demo')) {
      card.classList.remove('is-demo');
      window.clearInterval(timer);
      timer = null;
    }
  }

  retryBtn.addEventListener('click', function () {
    human();
    manualRecovered = true;
    card.classList.remove('is-stalled');
    iconWrap.style.transform = 'translateX(0px)';
    setStatus('Playback resumed');
  });

  if (!reduce) {
    start = performance.now();
    tick(0);
    timer = window.setInterval(loop, TICK_MS);
  } else {
    // reduce: 실사용 경로 적용 — 흔들림(진동)만 멈추고 정지 상태·문구는 그대로 전달한다
    card.classList.add('is-stalled');
    setStatus('Stalled');
  }
})();
</script>
</main>
</body>
</html>
