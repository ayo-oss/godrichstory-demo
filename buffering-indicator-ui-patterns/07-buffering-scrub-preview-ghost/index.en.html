<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrub Bar's Ghost Buffer Preview — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="scrubWrap is-demo" id="scrubWrap">
  <div class="track" id="track" role="slider" aria-label="Scrub bar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
    <div class="bufferFill" id="bufferFill"></div>
    <div class="playFill" id="playFill"></div>
    <div class="ghost" id="ghost">
      <span class="ghostTip" id="ghostTip">0:00</span>
    </div>
    <div class="handle" id="handle"></div>
  </div>
  <p class="readout" id="readout" aria-live="polite">Playback 0:00 · Buffer 0:00</p>
</div>
<script>
(function () {
  var TOTAL_SEC = 185; // 총 길이(가상)
  var LOOP_MS = 4200;
  var TICK_MS = 60;
  var BUFFER_LEAD = 0.28; // 버퍼가 재생보다 앞서는 고정 여유(비율)

  var wrap = document.getElementById('scrubWrap');
  var track = document.getElementById('track');
  var bufferFill = document.getElementById('bufferFill');
  var playFill = document.getElementById('playFill');
  var ghost = document.getElementById('ghost');
  var ghostTip = document.getElementById('ghostTip');
  var handle = document.getElementById('handle');
  var readout = document.getElementById('readout');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fmt(sec) {
    var s = Math.max(0, Math.round(sec));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  var playFrac = 0.18;
  var manualPlayFrac = null;

  function setGhost(frac) {
    var pct = (frac * 100).toFixed(1) + '%';
    ghost.style.setProperty('--ghost-pct', pct);
    ghostTip.textContent = fmt(frac * TOTAL_SEC);
  }

  function paint(playF, ghostF) {
    var bufF = clamp(playF + BUFFER_LEAD, 0, 1);
    bufferFill.style.setProperty('--buffer-pct', (bufF * 100).toFixed(1) + '%');
    playFill.style.setProperty('--play-pct', (playF * 100).toFixed(1) + '%');
    handle.style.setProperty('--play-pct', (playF * 100).toFixed(1) + '%');
    track.setAttribute('aria-valuenow', String(Math.round(playF * 100)));
    setGhost(ghostF);
    readout.textContent = 'Playback ' + fmt(playF * TOTAL_SEC) + ' · Buffer ' + fmt(bufF * TOTAL_SEC);
  }

  function tick(elapsedMs) {
    var t = (elapsedMs % LOOP_MS) / LOOP_MS;
    playFrac = manualPlayFrac !== null ? manualPlayFrac : 0.05 + 0.55 * t;
    // 유령(미리보기) 위치는 실제 포인터 X 좌표를 트랙 폭 기준 비율로 바꾼 값 — 여기선 같은 방식을 합성파로 재현
    var pointerFrac = clamp(playFrac + 0.22 + 0.06 * Math.sin(elapsedMs / 260), 0, 1);
    paint(playFrac, pointerFrac);
  }

  var timer = null;
  var start = 0;
  function loop() { tick(performance.now() - start); }

  function human() {
    if (wrap.classList.contains('is-demo')) {
      wrap.classList.remove('is-demo');
      window.clearInterval(timer);
      timer = null;
    }
  }

  // 실제 포인터 좌표 → 트랙 안 비율로 바꾸는 계산 (getBoundingClientRect 실측)
  function fracFromPointer(clientX) {
    var rect = track.getBoundingClientRect();
    return clamp((clientX - rect.left) / rect.width, 0, 1);
  }

  var dragging = false;

  track.addEventListener('pointermove', function (ev) {
    human();
    var f = fracFromPointer(ev.clientX);
    setGhost(f);
    if (dragging) {
      manualPlayFrac = f;
      paint(f, f);
    }
  });

  track.addEventListener('pointerdown', function (ev) {
    human();
    dragging = true;
    var f = fracFromPointer(ev.clientX);
    manualPlayFrac = f;
    paint(f, f);
  });

  window.addEventListener('pointerup', function () { dragging = false; });

  track.addEventListener('keydown', function (ev) {
    human();
    var step = 0.02;
    if (ev.key === 'ArrowRight') { manualPlayFrac = clamp((manualPlayFrac !== null ? manualPlayFrac : playFrac) + step, 0, 1); paint(manualPlayFrac, manualPlayFrac); }
    else if (ev.key === 'ArrowLeft') { manualPlayFrac = clamp((manualPlayFrac !== null ? manualPlayFrac : playFrac) - step, 0, 1); paint(manualPlayFrac, manualPlayFrac); }
  });

  if (!reduce) {
    start = performance.now();
    tick(0);
    timer = window.setInterval(loop, TICK_MS);
  } else {
    // reduce: 실사용 경로 적용 — 자동 이동은 멈추고 Playback·Buffer·유령 위치를 한 장면으로 고정한다
    paint(0.3, 0.5);
  }
})();
</script>
</main>
</body>
</html>
