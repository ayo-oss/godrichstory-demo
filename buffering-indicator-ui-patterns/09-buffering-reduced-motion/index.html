<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동작 줄이기 켜짐·꺼짐 나란히 비교 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="compareWrap is-demo" id="compareWrap">
  <p class="sysStatus" id="sysStatus" aria-live="polite">시스템 설정 확인 중</p>
  <div class="panels">
    <div class="panel">
      <span class="ring ringMotion" id="ringMotion" aria-hidden="true"></span>
      <p class="panelLabel">동작 유지판</p>
    </div>
    <div class="panel">
      <span class="ring ringReduced" id="ringReduced" aria-hidden="true"></span>
      <p class="panelLabel">동작 줄임판</p>
    </div>
  </div>
  <button class="previewBtn" id="previewBtn" type="button" aria-pressed="false">두 판 나란히 미리보기</button>
</div>
<script>
(function () {
  var SPIN_MS = 1600;
  var TICK_MS = 40;
  var REDUCED_STEP_MS = 900; // 동작 줄임판은 이 간격마다 한 번씩만 상태를 바꾼다(연속 회전 없음)

  var wrap = document.getElementById('compareWrap');
  var sysStatus = document.getElementById('sysStatus');
  var ringMotion = document.getElementById('ringMotion');
  var ringReduced = document.getElementById('ringReduced');
  var previewBtn = document.getElementById('previewBtn');

  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');

  // 실사용 경로 적용 — 실제 OS 환경설정이 바뀌면 이 리스너가 즉시 문구를 다시 쓴다(새로고침 불필요)
  function updateSystemStatus() {
    sysStatus.textContent = '시스템 설정: 동작 줄이기 ' + (mq.matches ? '켜짐' : '꺼짐');
  }
  mq.addEventListener('change', updateSystemStatus);
  updateSystemStatus();

  // 왼쪽(동작 유지)은 각도를 연속으로 계산해 회전시키고, 오른쪽(동작 줄임)은 같은 시간 입력을
  // REDUCED_STEP_MS 단위로 끊어(정수 나눗셈) 계단식으로만 바꾼다 — 두 분기를 같은 시계로 비교하는 계산.
  function tickMotion(ms) {
    var deg = (ms % SPIN_MS) / SPIN_MS * 360;
    ringMotion.style.transform = 'rotate(' + deg.toFixed(1) + 'deg)';
  }

  function tickReduced(ms) {
    var step = Math.floor(ms / REDUCED_STEP_MS) % 2;
    ringReduced.style.setProperty('--dim', step === 0 ? '1' : '.45');
  }

  var timer = null;
  var start = 0;
  function loop() {
    var ms = performance.now() - start;
    tickMotion(ms);
    tickReduced(ms);
  }

  function human() {
    if (wrap.classList.contains('is-demo')) {
      wrap.classList.remove('is-demo');
      window.clearInterval(timer);
      timer = null;
    }
  }

  // 시연 게이트만 — 실제 시스템 설정과 무관하게, 이 데모 안에서만 두 판을 동시에 보여주는 비교 토글이다
  var comparing = true;
  previewBtn.addEventListener('click', function () {
    human();
    comparing = !comparing;
    previewBtn.setAttribute('aria-pressed', comparing ? 'true' : 'false');
    previewBtn.textContent = comparing ? '동작 유지판 숨기기' : '두 판 나란히 미리보기';
    wrap.classList.toggle('single-panel', !comparing);
  });

  start = performance.now();
  tickMotion(0);
  tickReduced(0);
  timer = window.setInterval(loop, TICK_MS);
})();
</script>
</main>
</body>
</html>
