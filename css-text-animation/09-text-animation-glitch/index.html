<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glitch text — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="glitch">
    <span class="glitch__base" data-split>오류 발생</span>
    <span class="glitch__r" aria-hidden="true" data-split>오류 발생</span>
    <span class="glitch__b" aria-hidden="true" data-split>오류 발생</span>
  </div>
</main>
<script>
(function(){
  function splitLetters(el){
    var text = el.textContent;
    el.textContent = "";
    Array.from(text).forEach(function(ch, i){
      var span = document.createElement("span");
      span.className = "letter";
      var seed = Math.sin((i + 1) * 12.9898) * 43758.5453;
      var noise = seed - Math.floor(seed);
      span.style.setProperty("--i", i);
      span.style.setProperty("--n", noise.toFixed(3));
      span.textContent = ch === " " ? " " : ch;
      el.appendChild(span);
    });
  }
  document.querySelectorAll("[data-split]").forEach(splitLetters);
})();
</script>
</body>
</html>
