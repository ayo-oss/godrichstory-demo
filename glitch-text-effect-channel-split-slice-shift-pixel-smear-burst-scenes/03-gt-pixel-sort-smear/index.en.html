<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Pixels Dragged Sideways Into a Smear — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="Glitch text stage: Enter or Space pauses, R restarts, the right arrow key, T or a press breaks it once">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="A word SMEAR and a dark shadow copy behind it sit on a navy background. Bright runs above the brightness cut 120 are sorted from dark to bright row by row and dragged long to the right before returning, while the shadow copy, darker than the cut, stays where it is. The gauge below shows the setting and the strength step, and under reduced motion only one clean word is drawn"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">Glitch text scene</p>
  <div class="vj__ctrl">
    <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
  </div>
  <p class="vj__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 파스텔 팔레트 — 바탕은 짙은 자두색, 글자는 연한 종이색, 눈금과 알약은 연한 색
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    const ROSE = [244, 162, 186];
    const MINT = [148, 212, 182];
    const NEU = [236, 230, 250];
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 해시 — 같은 (a, b) 에는 늘 같은 0 이상 1 미만 값. 난수 함수는 쓰지 않는다
    function hash2(a, b) {
        let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        h = h ^ (h >>> 16);
        return (h >>> 0) / 4294967296;
    }
    // 1차원 값 잡음 — 정수 칸마다 해시 값이 있고 그 사이를 부드럽게 잇는다
    function noise1(x, seed) {
        const i = Math.floor(x);
        const f = x - i;
        const u = f * f * (3 - 2 * f);
        return lerp(hash2(i, seed), hash2(i + 1, seed), u);
    }
    // 장면 시계(초)·판 반복 번호·시간표 — 시간표는 (시각, 할 일) 목록이고 시각이 지나면 한 번씩 부른다
    let sceneT = 0;
    let lap = 0;
    let script = [];
    let evAt = 0;
    // 문구 틀의 {a}·{b} 자리에 값을 끼운다 — 화면 문구는 늘 이 틀 한 줄로 두고 로케일 사전이 통째로 바꾼다
    function fill(s, a, b) { return s.replace('{a}', a).replace('{b}', b === undefined ? '' : b); }
    function r1(v) { return String(Math.round(v * 10) / 10); }
    // 세기 단계 — 장면을 누를 때마다 0 → 1 → 2 → 0 으로 돈다. 글리치의 크기에 이 배율이 곱해진다
    const LVL_MUL = [0.5, 1, 1.7];
    let lvl = 1;
    // 깨짐 세기 g 는 시간표가 정한 목표 gTgt 를 따라간다. 손으로 누르면 holdUntil 까지 목표가 서 있다가 0 으로 돌아간다
    let g = 0;
    let gTgt = 0;
    let holdUntil = 0;
    function followG(dt, rate) {
        if (manual && sceneT > holdUntil) {
            gTgt = 0;
        }
        g += (gTgt - g) * (1 - Math.exp(-rate * dt));
        if (g < 0.002 && gTgt === 0) {
            g = 0;
        }
    }
    function hitG(top) {
        gTgt = top;
        holdUntil = sceneT + 1.6;
    }
    // 움직임 줄이기에서는 글리치 없이 원문 한 장 — 세기 단계는 눈금에만 반영된다
    function gainNow() { return still ? 0 : g * LVL_MUL[lvl]; }
    const STILL_FMT = 'Reduced motion: one clean word, setting {a}';
    const SPEAK_GLITCH = 'The word {a} is breaking, strength step {b}';
    const SPEAK_CLEAN = 'The word {a} is shown clean, strength step {b}';
    const SPEAK_STILL = 'Reduced motion: one still of the word {a}, strength step {b}';
    function speakLine(word) {
        if (still) {
            return fill(SPEAK_STILL, word, String(lvl + 1));
        }
        return fill(modeId() === 1 ? SPEAK_GLITCH : SPEAK_CLEAN, word, String(lvl + 1));
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const doneEl = root.querySelector('[data-role="done"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    const wkCv = document.createElement('canvas');
    wkCv.width = W;
    wkCv.height = H;
    const wkRaw = wkCv.getContext('2d');
    const wordCv = document.createElement('canvas');
    wordCv.width = W;
    wordCv.height = H;
    const wordRaw = wordCv.getContext('2d', { willReadFrequently: true });
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !doneEl || !wkRaw || !wordRaw) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const wkCtx = wkRaw;
    const wordCtx = wordRaw;
    const pauseBtn = pauseEl;
    const doneP = doneEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 굵은 글꼴 목록만
    const WORD_FONT = '"Arial Black", "Segoe UI Black", Impact, system-ui, sans-serif';
    const UI_FONT = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 화소 계산은 늘 480×300 이고 화면 배율만 이 값
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const MAX_W = 392;
    // 글자 한 줄을 무대 한가운데에 그린다 — dx·dy 는 그림자·겹침용 어긋남
    function paintWord(c, word, px, fillStyle, dx, dy) {
        // 글꼴이 기기마다 달라도 단어가 MAX_W 안에 들도록 크기를 줄여 맞춘다
        c.font = '900 ' + px + 'px ' + WORD_FONT;
        const wide = c.measureText(word).width;
        const fit = wide > MAX_W ? px * MAX_W / wide : px;
        c.font = '900 ' + fit + 'px ' + WORD_FONT;
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillStyle = fillStyle;
        c.fillText(word, W / 2 + dx, H / 2 + 6 + dy);
    }
    // 원본 화소 버퍼 — 글자를 한 번 그려 읽어 둔 판. 모든 글리치는 이 base 를 읽어 out 에 쓴다
    let base = new Uint8ClampedArray(W * H * 4);
    let rowTop = 0;
    let rowBot = H - 1;
    const img = wkCtx.createImageData(W, H);
    const out = img.data;
    function loadWord(paint) {
        wordCtx.fillStyle = rgba(BGC, 1);
        wordCtx.fillRect(0, 0, W, H);
        paint(wordCtx);
        base = wordCtx.getImageData(0, 0, W, H).data;
        // 글자가 있는 행 범위 — 글리치 계산은 이 행만 돈다
        let top = -1;
        let bot = -1;
        for (let y = 0; y < H; y += 1) {
            let hit = false;
            for (let x = 0; x < W && !hit; x += 2) {
                const p = (y * W + x) * 4;
                if (Math.abs(base[p] - BGC[0]) + Math.abs(base[p + 1] - BGC[1]) + Math.abs(base[p + 2] - BGC[2]) > 24) {
                    hit = true;
                }
            }
            if (hit) {
                if (top < 0) {
                    top = y;
                }
                bot = y;
            }
        }
        rowTop = Math.max(0, top - 2);
        rowBot = Math.min(H - 1, bot + 2);
    }
    function present() {
        wkCtx.putImageData(img, 0, 0);
        ctx.drawImage(wkCv, 0, 0, W, H);
    }
    // 한 행을 채널마다 다른 가로 어긋남으로 읽어 tmp(길이 W×3)에 쓴다 — 어긋남이 소수여도 이웃 두 화소를 섞는다
    function rowSample(y, dR, dG, dB, tmp) {
        const o = y * W * 4;
        const d = [dR, dG, dB];
        for (let c = 0; c < 3; c += 1) {
            for (let x = 0; x < W; x += 1) {
                let sx = x - d[c];
                if (sx < 0) {
                    sx = 0;
                }
                else if (sx > W - 1.001) {
                    sx = W - 1.001;
                }
                const i0 = Math.floor(sx);
                const f = sx - i0;
                const p = o + i0 * 4 + c;
                tmp[x * 3 + c] = base[p] * (1 - f) + base[p + 4] * f;
            }
        }
    }
    const rowTmp = new Float32Array(W * 3);
    function renderRows(y0, y1, dxR, dxG, dxB) {
        for (let y = y0; y <= y1; y += 1) {
            rowSample(y, dxR[y], dxG[y], dxB[y], rowTmp);
            const o = y * W * 4;
            for (let x = 0; x < W; x += 1) {
                out[o + x * 4] = rowTmp[x * 3];
                out[o + x * 4 + 1] = rowTmp[x * 3 + 1];
                out[o + x * 4 + 2] = rowTmp[x * 3 + 2];
            }
        }
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function disc(x, y, r, c) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, 1);
        ctx.fill();
    }
    function text(s, x, y, c, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + UI_FONT;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, 1);
        ctx.fillText(s, x, y);
    }
    // 아래쪽 눈금 — 상수 이름과 지금 설정값 · 설정 크기 막대 · 세기 단계 점 셋. 값은 세기 단계가 곱해진 설정이다
    function hud(name, val, frac) {
        const label = name + ' ' + r1(val);
        ctx.font = '700 11px ' + UI_FONT;
        const w = ctx.measureText(label).width + 20;
        const x = 12;
        const y = H - 32;
        box(x, y, w, 20, 10, NEU, 0.96);
        text(label, x + w / 2, y + 10.5, INK, 11, 700, 'center');
        const mx = x + w + 10;
        box(mx, y + 6, 140, 8, 4, [78, 72, 104], 1);
        box(mx, y + 6, 140 * clamp(frac, 0, 1), 8, 4, MINT, 1);
        text(String(LVL_MUL[lvl]) + 'x', W - 70, y + 10.5, NEU, 11, 700, 'right');
        for (let i = 0; i < 3; i += 1) {
            disc(W - 52 + i * 16, y + 10, 4.5, i <= lvl ? ROSE : [92, 86, 122]);
        }
    }
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고, 그 뒤부터 모드가 바뀔 때만 낭독 문장을 쓴다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    // 사람이 직접 누르는 중이면 시간표는 멈추고 계산만 흐른다
    let manual = false;
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
    }
    function takeOver() {
        if (manual) {
            return;
        }
        manual = true;
        wake();
    }
    // 낭독 문장 — 화면 상태 줄(aria-live off)과 따로, 모드가 바뀔 때와 사람이 눌렀을 때만 role=status 에 쓴다
    let lastMode = -9;
    function say() {
        doneP.textContent = speakLine(WORD);
        lastMode = still ? -2 : modeId();
    }
    function advance(dt) {
        sceneT += dt;
        if (!manual) {
            while (evAt < script.length && script[evAt].t <= sceneT) {
                const ev = script[evAt];
                evAt += 1;
                ev.f();
            }
            if (sceneT >= LAP_S) {
                lap += 1;
                begin();
                return;
            }
        }
        update(dt);
    }
    function begin() {
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
    }
    const DT_MAX = 0.05;
    function showNow() {
        draw();
        pushStatus(statusText());
        if (!demo) {
            const m = still ? -2 : modeId();
            if (m !== lastMode) {
                say();
            }
        }
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        showNow();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 글리치 없는 원문 한 장
    function showRest() {
        stopLoop();
        lap = 0;
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        update(0);
        showNow();
    }
    function play() {
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
        say();
    }
    function restart() {
        manual = false;
        lap += 1;
        g = 0;
        gTgt = 0;
        begin();
        update(0);
        showNow();
        say();
    }
    // 누르기 — 세기 단계를 한 칸 올리고(0 → 1 → 2 → 0) 그 자리에서 한 번 깨뜨린다. 멈춘 채여도 세 걸음을 더 돌려 깨진 장면이 눈에 보이게
    function tap() {
        takeOver();
        lvl = (lvl + 1) % 3;
        if (!still) {
            onHit();
            if (paused) {
                for (let k = 0; k < 3; k += 1) {
                    sceneT += 1 / 30;
                    update(1 / 30);
                }
            }
        }
        showNow();
        say();
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    // 키보드 — 무대에 포커스가 있을 때만. Enter·Space = Pause, R = 처음부터, 오른쪽·위·T = 한 번 깨뜨리기
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        const k = e.key;
        if (k === 'Enter' || k === ' ' || k === 'p' || k === 'P') {
            e.preventDefault();
            togglePause();
        }
        else if (k === 'r' || k === 'R') {
            restart();
        }
        else if (k === 'ArrowRight' || k === 'ArrowUp' || k === 't' || k === 'T') {
            e.preventDefault();
            tap();
        }
    }, { signal: off.signal });
    // 마우스·터치 — 무대를 누르는 순간 한 번 깨뜨린다
    pad.addEventListener('pointerdown', function () { tap(); }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 원문 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            lap = 0;
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        showNow();
    }, { signal: off.signal });
    // 03 — getImageData 로 읽어 둔 글자 그림에서 밝기가 LUMA_CUT 을 넘는 구간을 행마다 찾아 어두운 쪽부터 밝은 쪽으로 정렬하고, 구간 끝의 색을 오른쪽으로 DRAG_MAX × 깨짐 세기 × 행마다 다른 해시 값(0.2 이상 1 이하) 만큼 끌어 칠한다
    const LUMA_CUT = 120;
    const DRAG_MAX = 120;
    const LAP_S = 7.4;
    const BGC = [34, 38, 66];
    const ECHO = [112, 100, 168];
    const WORD = 'SMEAR';
    // 글자 뒤에 밝기가 낮은 그림자 글자를 한 겹 깐다 — LUMA_CUT 보다 어두워서 기준을 내리기 전에는 끌리지 않는다
    loadWord(function (c) {
        paintWord(c, WORD, 150, rgba(ECHO, 1), 7, 8);
        const grad = c.createLinearGradient(0, 98, 0, 206);
        grad.addColorStop(0, rgba(PAPER, 1));
        grad.addColorStop(1, rgba([200, 180, 240], 1));
        paintWord(c, WORD, 150, grad, 0, 0);
    });
    let smearRows = 0;
    function lumaAt(p) { return 0.299 * base[p] + 0.587 * base[p + 1] + 0.114 * base[p + 2]; }
    function setting() { return LUMA_CUT; }
    function build() {
        g = 0;
        gTgt = 0;
        smearRows = 0;
        script.push({ t: 0.25, f: function () { gTgt = 1; } });
        script.push({ t: 2.2, f: function () { gTgt = 0; } });
        script.push({ t: 3.8, f: function () { gTgt = 1; } });
        script.push({ t: 5.6, f: function () { gTgt = 0; } });
    }
    function update(dt) { followG(dt, 6); }
    // 한 구간의 화소를 밝기 오름차순으로 다시 놓는다 — 어두운 화소가 왼쪽, 밝은 화소가 오른쪽
    function sortRun(o, a, b) {
        const px = [];
        for (let x = a; x < b; x += 1) {
            const p = o + x * 4;
            px.push([lumaAt(p), base[p], base[p + 1], base[p + 2]]);
        }
        px.sort(function (u, v) { return u[0] - v[0]; });
        for (let i = 0; i < px.length; i += 1) {
            const p = o + (a + i) * 4;
            out[p] = px[i][1];
            out[p + 1] = px[i][2];
            out[p + 2] = px[i][3];
        }
    }
    function smearRow(y, drag) {
        const o = y * W * 4;
        let x = 0;
        while (x < W) {
            if (lumaAt(o + x * 4) <= LUMA_CUT) {
                x += 1;
                continue;
            }
            const a = x;
            while (x < W && lumaAt(o + x * 4) > LUMA_CUT) {
                x += 1;
            }
            const b = x;
            if (b - a >= 3) {
                sortRun(o, a, b);
            }
            const last = o + (b - 1) * 4;
            const cr = out[last];
            const cg = out[last + 1];
            const cb = out[last + 2];
            for (let j = 0; j < drag && b + j < W; j += 1) {
                const p = o + (b + j) * 4;
                if (lumaAt(p) > LUMA_CUT) {
                    break;
                }
                const k = 0.9 * (1 - j / drag);
                out[p] = lerp(out[p], cr, k);
                out[p + 1] = lerp(out[p + 1], cg, k);
                out[p + 2] = lerp(out[p + 2], cb, k);
            }
        }
    }
    function draw() {
        out.set(base);
        smearRows = 0;
        const gain = Math.min(1.4, gainNow());
        if (gain > 0.02) {
            for (let y = rowTop; y <= rowBot; y += 1) {
                // 어느 행이 끌릴지, 얼마나 끌릴지는 행 쌍의 해시로 고정 — 세기가 오르내릴 때 같은 행이 같은 자리에서 길어졌다 줄어든다
                const hh = hash2(y >> 1, 3);
                if (hh > 0.62) {
                    continue;
                }
                smearRow(y, Math.round(DRAG_MAX * gain * (0.2 + 0.8 * hash2(y >> 1, 9))));
                smearRows += 1;
            }
        }
        present();
        hud('LUMA_CUT', setting(), 1);
    }
    function statusText() {
        if (still) {
            return fill(STILL_FMT, String(LUMA_CUT));
        }
        return fill('{a} rows with a bright run dragged out', String(smearRows));
    }
    function modeId() { return g > 0.3 ? 1 : 0; }
    function onHit() { hitG(1); }
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
