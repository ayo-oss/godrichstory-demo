<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>폴백 나란히 보기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="row">
    <figure class="cell">
      <div class="box native" id="nativeBox"></div>
      <figcaption class="cap" id="capNative">지원 환경</figcaption>
    </figure>
    <figure class="cell">
      <div class="box shim" id="shimBox"></div>
      <figcaption class="cap">미지원 폴백</figcaption>
    </figure>
  </div>
  <p class="readout" id="readout" aria-live="polite">지금 반경 20.0</p>
</div>
<script>
(function () {
  var R_MIN = 6; // 반경 하한(px)
  var R_MAX = 34; // 반경 상한(px)
  var SWEEP_MS = 2000; // 반경이 하한↔상한을 왕복하는 주기
  var SUPER_N = 2.6; // 슈퍼타원 지수 고정값 — 원과 사각형 사이
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SUPPORTS = CSS.supports('corner-shape', 'superellipse(1)');

  var wrap = document.getElementById('wrap');
  var nativeBox = document.getElementById('nativeBox');
  var shimBox = document.getElementById('shimBox');
  var capNative = document.getElementById('capNative');
  var readout = document.getElementById('readout');
  var isDemo = true;
  var paused = false;
  var frozenT = 0;

  // 캡션을 실제 지원 여부로 갱신 — 미지원 환경에서 열면 두 칸 다 폴백으로 표시된다
  if (!SUPPORTS) capNative.textContent = '미지원 폴백';

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  // 계산 겹: 반경을 코사인으로 왕복시킨다 — 사인이 아니라 위상을 맞춘 코사인으로 0초에 하한에서 시작한다
  function radiusAt(t) {
    var c = (1 - Math.cos(t * Math.PI * 2)) / 2;
    return R_MIN + (R_MAX - R_MIN) * c;
  }

  function applyBoth(r) {
    if (SUPPORTS) {
      nativeBox.style.cornerShape = 'superellipse(' + SUPER_N.toFixed(1) + ')';
      nativeBox.style.borderRadius = r.toFixed(2) + 'px';
    } else {
      nativeBox.style.borderRadius = r.toFixed(2) + 'px';
    }
    // 오른쪽 칸은 언제나 border-radius 근사만 쓴다 — 두 렌더링의 차이를 나란히 겨룬다
    shimBox.style.borderRadius = r.toFixed(2) + 'px';
    readout.textContent = '지금 반경 ' + r.toFixed(1);
  }

  wrap.addEventListener('click', function () {
    human();
    paused = !paused;
    if (paused) frozenT = performance.now();
  });
  wrap.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); wrap.click(); }
  });

  var start = 0;
  function loop(ts) {
    if (!start) start = ts;
    var t;
    if (reduce) {
      t = 0.5; // 상태(상한)에 고정 — 코사인 계산은 그대로 쓴다
    } else if (paused) {
      t = ((frozenT - start) % SWEEP_MS) / SWEEP_MS;
    } else {
      t = ((ts - start) % SWEEP_MS) / SWEEP_MS;
    }
    applyBoth(radiusAt(t));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
