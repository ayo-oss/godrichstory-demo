<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squircle card — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <button class="card" id="card" type="button" aria-pressed="false" aria-label="Cycle curvature preset"></button>
  <p class="readout" id="readout" aria-live="polite">Exponent value 1.00</p>
</div>
<script>
(function () {
  var SUPER_N = 4.0; // 슈퍼타원 지수 상한 — 흐름이 도달하는 사각형 쪽 끝값 (변형 01 목표)
  var SWEEP_MS = 2400; // 원 → 사각형 → 원 한 바퀴 주기 (변형 03 목표)
  var MIN_N = 1; // 슈퍼타원 지수 하한 — 원에 가장 가까운 끝값
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SUPPORTS = CSS.supports('corner-shape', 'superellipse(1)');

  var wrap = document.getElementById('wrap');
  var card = document.getElementById('card');
  var readout = document.getElementById('readout');
  var isDemo = true;

  var PRESETS = [MIN_N, (MIN_N + SUPER_N) / 2, SUPER_N];
  var presetIdx = 0;

  // 계산 겹: 스무더스텝(5차 다항식, Perlin) 으로 왕복 삼각파를 매끄러운 흐름으로 편다 — 선형 트윈이 아니다
  function smootherstep(u) { return u * u * u * (u * (u * 6 - 15) + 10); }
  function triangle(x) { var f = x - Math.floor(x); return f < 0.5 ? f * 2 : (1 - f) * 2; }

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  function setN(n) {
    if (SUPPORTS) {
      card.style.cornerShape = 'superellipse(' + n.toFixed(3) + ')';
      card.style.borderRadius = '40px';
    } else {
      // 근사 폴백: 슈퍼타원 지수가 클수록 반경을 좁혀 각진 인상을 흉내(정확한 곡선은 아니다)
      card.style.borderRadius = (40 / n).toFixed(2) + 'px';
    }
    readout.textContent = 'Exponent value ' + n.toFixed(2);
  }

  card.addEventListener('click', function () {
    human();
    presetIdx = (presetIdx + 1) % PRESETS.length;
    card.setAttribute('aria-pressed', String(presetIdx > 0));
    setN(PRESETS[presetIdx]);
  });

  var start = 0;
  function loop(ts) {
    if (!start) start = ts;
    if (isDemo) {
      if (reduce) {
        setN(SUPER_N); // 계산은 유지, 시간 축소 대신 목표 상태로 즉시 고정
      } else {
        var u = triangle((ts - start) / SWEEP_MS);
        setN(MIN_N + (SUPER_N - MIN_N) * smootherstep(u));
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
