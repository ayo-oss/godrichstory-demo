<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bevel chip — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <button class="chip" id="chip" type="button" aria-pressed="false" aria-label="Toggle bevel angle">Label</button>
  <p class="readout" id="readout" aria-live="polite">Facet width 14.0</p>
</div>
<script>
(function () {
  var BEVEL_DEG = 18; // 빗면이 도달하는 각도 상한 값 (변형 02 목표)
  var MIN_DEG = 8; // 빗면 각도 하한 값
  var BEVEL_RY = 14; // 계산 겹 상수: 세로축 Radius 고정값(px) — 각도가 커질수록 가로축만 늘어나 빗면이 넓어진다
  var BEVEL_MS = 2000; // 각도가 하한에서 상한까지 한 번 오가는 주기
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SUPPORTS = CSS.supports('corner-shape', 'bevel');

  var wrap = document.getElementById('wrap');
  var chip = document.getElementById('chip');
  var readout = document.getElementById('readout');
  var isDemo = true;
  var manualDeg = null;

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  // 계산 겹: 베벨 각도 값에서 가로축 반경을 삼각비로 역산하고, 두 반경의 빗변 길이를 빗면 넓이로 삼는다
  function applyAngle(deg) {
    var rad = deg * Math.PI / 180;
    var rx = BEVEL_RY * Math.tan(rad);
    var facetWidth = Math.hypot(rx, BEVEL_RY);
    if (SUPPORTS) {
      chip.style.borderTopRightRadius = rx.toFixed(2) + 'px ' + BEVEL_RY + 'px';
    } else {
      // 근사 폴백: 대각 빗면 대신 같은 Radius 크기의 둥근 모서리로 흉내
      chip.style.borderTopRightRadius = facetWidth.toFixed(2) + 'px';
    }
    readout.textContent = 'Facet width ' + facetWidth.toFixed(1);
  }

  chip.addEventListener('click', function () {
    human();
    manualDeg = manualDeg === BEVEL_DEG ? MIN_DEG : BEVEL_DEG;
    chip.setAttribute('aria-pressed', String(manualDeg === BEVEL_DEG));
    applyAngle(manualDeg);
  });

  var start = 0;
  function loop(ts) {
    if (!start) start = ts;
    if (isDemo) {
      if (reduce) {
        applyAngle(BEVEL_DEG);
      } else {
        var t = ((ts - start) % BEVEL_MS) / BEVEL_MS;
        var tri = t < 0.5 ? t * 2 : (1 - t) * 2;
        applyAngle(MIN_DEG + (BEVEL_DEG - MIN_DEG) * tri);
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
