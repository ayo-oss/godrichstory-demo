<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웨이브 패널 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <button class="panel" id="panel" type="button" aria-pressed="false" aria-label="네 모서리 물결 정지·재생"></button>
  <p class="readout" id="readout" aria-live="polite">위상 어긋남 0.0</p>
</div>
<script>
(function () {
  var BASE_R = 20; // 네 모서리가 공유하는 기준 반경(px)
  var AMP = 16; // 반경이 기준에서 출렁이는 폭(px)
  var WAVE_MS = 2200; // 물결이 한 바퀴 도는 주기
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SUPPORTS = CSS.supports('corner-shape', 'superellipse(1)');

  var wrap = document.getElementById('wrap');
  var panel = document.getElementById('panel');
  var readout = document.getElementById('readout');
  var isDemo = true;
  var paused = false;
  var frozenAt = 0;

  var CORNERS = ['TopLeft', 'TopRight', 'BottomRight', 'BottomLeft'];

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  // 계산 겹: 모서리마다 위상을 PI/2 씩 어긋낸 사인파 4개를 동시에 계산해 물결처럼 번갈아 부풀린다
  function corners(t) {
    var out = [];
    for (var i = 0; i < 4; i++) {
      var phase = i * (Math.PI / 2);
      var r = BASE_R + AMP * Math.sin(t * Math.PI * 2 + phase);
      out.push(Math.max(2, r));
    }
    return out;
  }

  function applyCorners(rs) {
    for (var i = 0; i < 4; i++) {
      if (SUPPORTS) panel.style.cornerShape = 'superellipse(2.2)';
      panel.style['border' + CORNERS[i] + 'Radius'] = rs[i].toFixed(2) + 'px';
    }
    readout.textContent = '위상 어긋남 ' + (rs[0] - rs[2]).toFixed(1);
  }

  panel.addEventListener('click', function () {
    human();
    paused = !paused;
    panel.setAttribute('aria-pressed', String(paused));
    if (paused) frozenAt = performance.now();
  });
  panel.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); panel.click(); }
  });

  var start = 0;
  function loop(ts) {
    if (!start) start = ts;
    var t;
    if (reduce) {
      t = 0.25;
    } else if (paused) {
      t = ((frozenAt - start) % WAVE_MS) / WAVE_MS;
    } else {
      t = ((ts - start) % WAVE_MS) / WAVE_MS;
    }
    applyCorners(corners(t));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
