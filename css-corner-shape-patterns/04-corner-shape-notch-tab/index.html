<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노치 탭 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="tabs" id="tabs" role="tablist" aria-label="노치 탭 전환">
    <button class="tab" id="tab0" role="tab" aria-selected="true" tabindex="0" type="button">하나</button>
    <button class="tab" id="tab1" role="tab" aria-selected="false" tabindex="-1" type="button">둘</button>
    <button class="tab" id="tab2" role="tab" aria-selected="false" tabindex="-1" type="button">셋</button>
  </div>
  <p class="readout" id="readout" aria-live="polite">노치 깊이 0.0</p>
</div>
<script>
(function () {
  var NOTCH_MAX = 14; // 활성 탭이 도달하는 노치 깊이 상한(px)
  var SPRING_MS = 560; // 탭이 바뀐 뒤 스프링이 안정되기까지 걸리는 시간
  var AUTO_MS = 1700; // 자동 루프에서 탭이 한 칸 넘어가는 간격
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SUPPORTS = CSS.supports('corner-shape', 'notch');

  var wrap = document.getElementById('wrap');
  var tabs = [document.getElementById('tab0'), document.getElementById('tab1'), document.getElementById('tab2')];
  var readout = document.getElementById('readout');
  var isDemo = true;
  var active = 0;
  var phaseStart = 0;

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  // 계산 겹: 탭이 바뀔 때 노치 깊이가 목표값을 살짝 넘겼다가 가라앉는 감쇠 진동(스프링 오버슛)으로 움직인다
  function springOvershoot(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    var c4 = (2 * Math.PI) / 3;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  }

  function applyDepth(tab, depth) {
    if (SUPPORTS) {
      tab.style.cornerShape = 'notch';
      tab.style.borderRadius = Math.max(0, depth).toFixed(2) + 'px';
    } else {
      // 근사 폴백: 파인 노치 대신 같은 크기의 둥근 모서리로 흉내(파임/둥긂만 다르다)
      tab.style.borderRadius = Math.max(0, depth).toFixed(2) + 'px';
    }
  }

  function setActive(i, ts) {
    if (active === i) return;
    tabs[active].setAttribute('aria-selected', 'false');
    tabs[active].tabIndex = -1;
    applyDepth(tabs[active], 0);
    active = i;
    tabs[active].setAttribute('aria-selected', 'true');
    tabs[active].tabIndex = 0;
    phaseStart = ts || performance.now();
  }

  tabs.forEach(function (tab, i) {
    tab.addEventListener('click', function () { human(); setActive(i, performance.now()); tab.focus({ preventScroll: true }); });
  });
  document.getElementById('tabs').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault();
    human();
    var next = e.key === 'ArrowRight' ? (active + 1) % tabs.length : (active + tabs.length - 1) % tabs.length;
    setActive(next, performance.now());
    tabs[next].focus({ preventScroll: true });
  });

  var start = 0;
  function loop(ts) {
    if (!start) { start = ts; phaseStart = ts; }
    if (isDemo && !reduce) {
      var cyclePos = Math.floor((ts - start) / AUTO_MS) % tabs.length;
      if (cyclePos !== active) setActive(cyclePos, ts);
    }
    var elapsed = reduce ? 1 : Math.min(1, (ts - phaseStart) / SPRING_MS);
    var depth = NOTCH_MAX * (reduce ? 1 : springOvershoot(elapsed));
    applyDepth(tabs[active], depth);
    readout.textContent = '노치 깊이 ' + Math.max(0, depth).toFixed(1);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
