<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모프 호버 카드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <button class="card" id="card" type="button" aria-pressed="false" aria-label="올려서 카드 모양 바꾸기"></button>
  <p class="readout" id="readout" aria-live="polite">보간 비율 0%</p>
</div>
<script>
(function () {
  var ROUND_R = 48; // 대기 상태(둥근 원형)의 반경 상한(px)
  var BEVEL_R = 6; // 호버 상태(각진 베벨)의 반경 하한(px)
  var LERP_K = 9; // 목표 비율로 붙는 속도 상수 — 클수록 빨리 따라붙는다
  var AUTO_MS = 2000; // 자동 루프에서 대기·호버를 오가는 주기
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SUPPORTS_ROUND = CSS.supports('corner-shape', 'round');
  var SUPPORTS_BEVEL = CSS.supports('corner-shape', 'bevel');

  var wrap = document.getElementById('wrap');
  var card = document.getElementById('card');
  var readout = document.getElementById('readout');
  var isDemo = true;
  var target = 0;
  var ratio = 0;

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  function setTarget(v) { target = v; }
  card.addEventListener('pointerenter', function () { human(); setTarget(1); });
  card.addEventListener('pointerleave', function () { human(); setTarget(0); });
  card.addEventListener('focus', function () { human(); setTarget(1); });
  card.addEventListener('blur', function () { human(); setTarget(0); });
  card.addEventListener('click', function () { human(); card.setAttribute('aria-pressed', String(target === 1)); });

  // 계산 겹: 비율 값을 목표로 순간 이동시키지 않고 지수 감쇠(dt 기반 관성 lerp)로 붙인다 — 두 모양 사이 보간 비율이다
  var last = 0;
  function stepRatio(ts) {
    var dt = last ? (ts - last) / 1000 : 0;
    last = ts;
    var follow = 1 - Math.exp(-LERP_K * dt);
    ratio += (target - ratio) * follow;
    if (Math.abs(ratio - target) < 0.001) ratio = target;
  }

  function applyMorph() {
    var r = ROUND_R + (BEVEL_R - ROUND_R) * ratio;
    var shape = ratio < 0.5 ? (SUPPORTS_ROUND ? 'round' : null) : (SUPPORTS_BEVEL ? 'bevel' : null);
    if (shape) card.style.cornerShape = shape;
    card.style.borderRadius = r.toFixed(2) + 'px';
    readout.textContent = '보간 비율 ' + Math.round(ratio * 100) + '%';
  }

  var start = 0;
  function loop(ts) {
    if (!start) start = ts;
    if (isDemo) {
      if (reduce) {
        target = 1; // 계산은 유지, 시간 축소 대신 호버 목표 상태로 즉시 고정
      } else {
        var t = ((ts - start) % AUTO_MS) / AUTO_MS;
        target = t < 0.5 ? 0 : 1;
      }
    }
    if (reduce) {
      ratio = target;
    } else {
      stepRatio(ts);
    }
    applyMorph();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
