<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프레임 인셋 카드 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <button class="frame" id="frame" type="button" aria-pressed="false" aria-label="안쪽 곡선 밀기/당기기">
    <span class="inner" id="inner">코어</span>
  </button>
  <p class="readout" id="readout" aria-live="polite">인셋 10.0</p>
</div>
<script>
(function () {
  var OUTER_R = 40; // 바깥 프레임의 고정 반경(px)
  var INSET_MIN = 6; // 안쪽 곡선이 프레임에서 떨어지는 최소 거리(px)
  var INSET_MAX = 22; // 최대 거리(px) — 커질수록 안쪽 곡선이 더 안으로 밀려든다
  var SWEEP_MS = 2400; // 인셋이 한 번 왕복하는 주기
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SUPPORTS = CSS.supports('corner-shape', 'superellipse(1)');

  var wrap = document.getElementById('wrap');
  var frame = document.getElementById('frame');
  var inner = document.getElementById('inner');
  var readout = document.getElementById('readout');
  var isDemo = true;
  var held = false;
  var heldStart = 0;

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  // 계산 겹: 인셋 산술 — 안쪽 반경 = 바깥 반경 − 인셋. 인셋이 커질수록 안쪽 곡선이 더 깎인다
  function innerRadius(inset) { return Math.max(2, OUTER_R - inset); }

  function applyInset(inset) {
    var r = innerRadius(inset);
    if (SUPPORTS) {
      frame.style.cornerShape = 'superellipse(3)';
      inner.style.cornerShape = 'superellipse(3)';
    }
    frame.style.borderRadius = OUTER_R + 'px';
    inner.style.borderRadius = r.toFixed(2) + 'px';
    readout.textContent = '인셋 ' + inset.toFixed(1);
  }

  frame.addEventListener('pointerdown', function () { human(); held = true; heldStart = performance.now(); frame.setAttribute('aria-pressed', 'true'); });
  frame.addEventListener('pointerup', function () { human(); held = false; heldStart = performance.now(); frame.setAttribute('aria-pressed', 'false'); });
  frame.addEventListener('pointerleave', function () { if (held) { held = false; heldStart = performance.now(); frame.setAttribute('aria-pressed', 'false'); } });
  frame.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); frame.dispatchEvent(new PointerEvent('pointerdown')); } });
  frame.addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); frame.dispatchEvent(new PointerEvent('pointerup')); } });

  // 계산 겹: 뗄 때 인셋이 목표로 관성(지수 감쇠)으로 되돌아간다
  var INSET_SPRING_K = 8;
  var insetNow = INSET_MIN;
  function stepInset(ts) {
    var target = held ? INSET_MAX : INSET_MIN;
    var dt = (ts - (stepInset.last || ts)) / 1000;
    stepInset.last = ts;
    var follow = 1 - Math.exp(-INSET_SPRING_K * dt);
    insetNow += (target - insetNow) * follow;
    if (Math.abs(insetNow - target) < 0.01) insetNow = target;
  }

  var start = 0;
  function loop(ts) {
    if (!start) start = ts;
    if (isDemo) {
      if (reduce) {
        insetNow = INSET_MAX;
      } else {
        var t = ((ts - start) % SWEEP_MS) / SWEEP_MS;
        var tri = t < 0.5 ? t * 2 : (1 - t) * 2;
        insetNow = INSET_MIN + (INSET_MAX - INSET_MIN) * tri;
      }
    } else if (!reduce) {
      stepInset(ts);
    }
    applyInset(insetNow);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
