<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radius ladder card — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <button class="card" id="card" type="button" aria-label="Climb the radius ladder one rung (arrow keys move it)">
    <span id="rung">1</span><span class="of">/5</span>
  </button>
  <p class="readout" id="readout" aria-live="polite">Radius 4.0</p>
</div>
<script>
(function () {
  var RUNGS = [4, 12, 20, 28, 36]; // 사다리 칸마다의 Radius 값(px) — 오름차순 고정 목록
  var STEP_MS = 380; // 한 칸 사이를 보간하는 데 걸리는 시간
  var AUTO_MS = 620; // 자동 루프에서 한 칸에 머무는 시간
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SUPPORTS = CSS.supports('corner-shape', 'squircle');

  var wrap = document.getElementById('wrap');
  var card = document.getElementById('card');
  var rungEl = document.getElementById('rung');
  var readout = document.getElementById('readout');
  var isDemo = true;
  var idx = 0;
  var fromR = RUNGS[0];
  var toR = RUNGS[0];
  var stepStart = 0;
  var dir = 1;

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  // 계산 겹: 사다리 칸 사이를 3차 ease-in-out 으로 보간한다 — 칸이 바뀌어도 값이 뚝 끊기지 않는다
  function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  function goTo(nextIdx, ts) {
    nextIdx = Math.max(0, Math.min(RUNGS.length - 1, nextIdx));
    if (nextIdx === idx) return;
    fromR = currentR(ts);
    idx = nextIdx;
    toR = RUNGS[idx];
    stepStart = ts;
    rungEl.textContent = String(idx + 1);
  }

  function currentR(ts) {
    var t = STEP_MS > 0 ? Math.min(1, (ts - stepStart) / STEP_MS) : 1;
    return fromR + (toR - fromR) * easeInOutCubic(t);
  }

  function applyRadius(r) {
    if (SUPPORTS) card.style.cornerShape = 'squircle';
    card.style.borderRadius = r.toFixed(2) + 'px';
    readout.textContent = 'Radius ' + r.toFixed(1);
  }

  card.addEventListener('click', function (e) {
    human();
    goTo(idx + 1 >= RUNGS.length ? 0 : idx + 1, performance.now());
  });
  wrap.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();
    human();
    goTo(idx + (e.key === 'ArrowUp' ? 1 : -1), performance.now());
  });

  var start = 0;
  function loop(ts) {
    if (!start) { start = ts; stepStart = ts; }
    if (isDemo) {
      if (reduce) {
        idx = RUNGS.length - 1; toR = RUNGS[idx]; fromR = toR;
        rungEl.textContent = String(idx + 1);
      } else if ((ts - stepStart) >= AUTO_MS) {
        var next = idx + dir;
        if (next >= RUNGS.length) { dir = -1; next = idx + dir; }
        if (next < 0) { dir = 1; next = idx + dir; }
        goTo(next, ts);
      }
    }
    applyRadius(currentR(ts));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
