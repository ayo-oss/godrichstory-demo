<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoop button — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <button class="btn" id="btn" type="button" aria-pressed="false" aria-label="Press to grow the scoop depth">Press</button>
  <p class="readout" id="readout" aria-live="polite">Scoop radius 4.0</p>
</div>
<script>
(function () {
  var SCOOP_MAX = 28; // 다 눌렀을 때 도달하는 Scoop radius 상한(px)
  var SCOOP_MIN = 4; // 손 뗀 상태의 Scoop radius 하한(px)
  var HOLD_MS = 700; // 하한에서 상한까지 차오르는 데 걸리는 시간
  var AUTO_MS = 1600; // 자동 루프에서 누름·뗌 한 번을 왕복하는 주기
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SUPPORTS = CSS.supports('corner-shape', 'scoop');

  var wrap = document.getElementById('wrap');
  var btn = document.getElementById('btn');
  var readout = document.getElementById('readout');
  var isDemo = true;
  var pressed = false;
  var phaseStart = 0; // 현재 누름/뗌 상태로 바뀐 시각

  function human() { if (isDemo) { wrap.classList.remove('is-demo'); isDemo = false; } }

  // 계산 겹: 누르는 시간 비율을 3차 ease-out 으로 굽혀 스쿠프 반경에 매핑한다 — 선형 증가가 아니다
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInCubic(t) { return t * t * t; }

  function applyScoop(r) {
    if (SUPPORTS) {
      btn.style.cornerShape = 'scoop';
      btn.style.borderRadius = r.toFixed(2) + 'px';
    } else {
      // 근사 폴백: 오목한 스쿠프 대신 같은 반경의 둥근 모서리로 흉내(오목/볼록만 다르다)
      btn.style.borderRadius = r.toFixed(2) + 'px';
    }
    readout.textContent = 'Scoop radius ' + r.toFixed(1);
  }

  function setPressed(next, ts) {
    if (pressed === next) return;
    pressed = next;
    phaseStart = ts || performance.now();
    btn.setAttribute('aria-pressed', String(pressed));
  }

  function press() { human(); setPressed(true); }
  function release() { human(); setPressed(false); }

  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('pointerleave', function () { if (pressed) release(); });
  btn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); press(); }
  });
  btn.addEventListener('keyup', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); release(); }
  });

  var start = 0;
  function loop(ts) {
    if (!start) start = ts;
    if (isDemo) {
      if (reduce) {
        applyScoop(SCOOP_MAX);
      } else {
        var t = ((ts - start) % AUTO_MS) / AUTO_MS;
        if (t < 0.5) { setPressed(true, ts); applyScoop(SCOOP_MIN + (SCOOP_MAX - SCOOP_MIN) * easeOutCubic(t * 2)); }
        else { setPressed(false, ts); applyScoop(SCOOP_MAX - (SCOOP_MAX - SCOOP_MIN) * easeInCubic((t - 0.5) * 2)); }
      }
    } else if (!reduce) {
      var elapsed = Math.min(1, (ts - phaseStart) / HOLD_MS);
      var r = pressed
        ? SCOOP_MIN + (SCOOP_MAX - SCOOP_MIN) * easeOutCubic(elapsed)
        : SCOOP_MAX - (SCOOP_MAX - SCOOP_MIN) * easeInCubic(elapsed);
      applyScoop(r);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</main>
</body>
</html>
