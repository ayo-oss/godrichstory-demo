<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accordion — chevron marker rotate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="accordion">
    <button class="accordion__header" type="button" aria-expanded="false">
      <span class="accordion__title">お支払い方法</span>
      <span class="accordion__chevron is-demo" aria-hidden="true"></span>
    </button>
    <div class="accordion__panel is-demo">
      <p class="accordion__body">カードと銀行振込に対応しています。</p>
    </div>
  </section>
</main>
<script>
(function () {
  var acc = document.querySelector('.accordion');
  var header = acc.querySelector('.accordion__header');
  var panel = acc.querySelector('.accordion__panel');
  var chevron = acc.querySelector('.accordion__chevron');
  header.addEventListener('click', function () {
    panel.classList.remove('is-demo');
    chevron.classList.remove('is-demo');
    var open = acc.classList.toggle('is-open');
    header.setAttribute('aria-expanded', String(open));
    chevron.style.transform = open ? 'rotate(-135deg)' : 'rotate(45deg)';
  });
})();
</script>
</body>
</html>
