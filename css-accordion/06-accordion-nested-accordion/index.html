<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accordion — nested accordion</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="accordion">
    <button class="accordion__header" type="button" aria-expanded="false">
      <span class="accordion__title">자주 묻는 질문</span>
      <span class="accordion__chevron" aria-hidden="true"></span>
    </button>
    <div class="accordion__panel is-demo">
      <div class="accordion accordion--inner">
        <button class="accordion__header accordion__header--inner" type="button" aria-expanded="false">
          <span class="accordion__title">배송 관련</span>
          <span class="accordion__chevron" aria-hidden="true"></span>
        </button>
        <div class="accordion__panel accordion__panel--inner is-demo-inner">
          <p class="accordion__body">제주도는 배송비가 추가됩니다.</p>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
(function () {
  document.querySelectorAll('.accordion').forEach(function (acc) {
    var header = acc.querySelector(':scope > .accordion__header');
    var panel = acc.querySelector(':scope > .accordion__panel');
    header.addEventListener('click', function () {
      panel.classList.remove('is-demo', 'is-demo-inner');
      var open = acc.classList.toggle('is-open');
      header.setAttribute('aria-expanded', String(open));
    });
  });
})();
</script>
</body>
</html>
