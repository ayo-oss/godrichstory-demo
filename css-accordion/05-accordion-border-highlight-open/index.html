<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accordion — open item border highlight</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="accordion is-demo-border">
    <button class="accordion__header" type="button" aria-expanded="false">
      <span class="accordion__title">회원 등급 혜택</span>
      <span class="accordion__chevron" aria-hidden="true"></span>
    </button>
    <div class="accordion__panel is-demo">
      <p class="accordion__body">등급마다 적립률이 다릅니다.</p>
    </div>
  </section>
</main>
<script>
(function () {
  var acc = document.querySelector('.accordion');
  var header = acc.querySelector('.accordion__header');
  var panel = acc.querySelector('.accordion__panel');
  header.addEventListener('click', function () {
    panel.classList.remove('is-demo');
    acc.classList.remove('is-demo-border');
    var open = acc.classList.toggle('is-open');
    header.setAttribute('aria-expanded', String(open));
  });
})();
</script>
</body>
</html>
