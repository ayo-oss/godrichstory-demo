<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accordion — exclusive open via name attribute</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="accordion-group">
    <div class="accordion accordion--a">
      <div class="accordion__header" role="button" tabindex="0" aria-expanded="false">
        <span class="accordion__title">Giao hàng mất bao lâu</span>
        <span class="accordion__chevron" aria-hidden="true"></span>
      </div>
      <div class="accordion__panel is-demo-a">
        <p class="accordion__body">Thường mất 2-3 ngày.</p>
      </div>
    </div>
    <div class="accordion accordion--b">
      <div class="accordion__header" role="button" tabindex="0" aria-expanded="false">
        <span class="accordion__title">Đổi hàng thế nào</span>
        <span class="accordion__chevron" aria-hidden="true"></span>
      </div>
      <div class="accordion__panel is-demo-b">
        <p class="accordion__body">Đăng ký đổi hàng tại trang cá nhân.</p>
      </div>
    </div>
  </section>
</main>
<script>
(function () {
  var group = document.querySelector('.accordion-group');
  var accs = Array.prototype.slice.call(group.querySelectorAll('.accordion'));
  accs.forEach(function (acc) {
    var header = acc.querySelector('.accordion__header');
    var panel = acc.querySelector('.accordion__panel');
    header.addEventListener('click', function () {
      panel.classList.remove('is-demo-a', 'is-demo-b');
      var willOpen = !acc.classList.contains('is-open');
      accs.forEach(function (other) {
        other.classList.remove('is-open');
        other.querySelector('.accordion__header').setAttribute('aria-expanded', 'false');
        other.querySelector('.accordion__panel').classList.remove('is-demo-a', 'is-demo-b');
      });
      if (willOpen) {
        acc.classList.add('is-open');
        header.setAttribute('aria-expanded', 'true');
      }
    });
  });
})();
</script>
</body>
</html>
