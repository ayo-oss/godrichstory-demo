<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accordion — calc-size() fallback pattern</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="accordion">
    <button class="accordion__header" type="button" aria-expanded="false">
      <span class="accordion__title">利用規約</span>
      <span class="accordion__chevron" aria-hidden="true"></span>
    </button>
    <div class="accordion__panel is-demo">
      <p class="accordion__body">規約は予告なく変更される場合があります。</p>
    </div>
  </section>
</main>
<script>
(function () {
  document.querySelectorAll('.accordion').forEach(function (acc) {
    var header = acc.querySelector('.accordion__header');
    var panel = acc.querySelector('.accordion__panel');
    header.addEventListener('click', function () {
      panel.classList.remove('is-demo');
      var open = acc.classList.toggle('is-open');
      header.setAttribute('aria-expanded', String(open));
    });
  });
})();
</script>
</body>
</html>
