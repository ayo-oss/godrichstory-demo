<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accordion — reused as sidebar nav</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <nav class="accordion sidebar">
    <button class="accordion__header" type="button" aria-expanded="false">
      <span class="accordion__title">設定</span>
      <span class="accordion__chevron" aria-hidden="true"></span>
    </button>
    <ul class="sidebar__list is-demo">
      <li>アカウント</li>
      <li>通知</li>
      <li>支払い方法</li>
    </ul>
  </nav>
</main>
<script>
(function () {
  var nav = document.querySelector('.sidebar');
  var header = nav.querySelector('.accordion__header');
  var list = nav.querySelector('.sidebar__list');
  header.addEventListener('click', function () {
    list.classList.remove('is-demo');
    var open = nav.classList.toggle('is-open');
    header.setAttribute('aria-expanded', String(open));
    list.style.height = open ? 'calc-size(auto, size)' : '0';
  });
})();
</script>
</body>
</html>
