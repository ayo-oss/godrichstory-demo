<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag chip input whose color is decided by its letters alone — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tc is-demo" id="tc">
  <div class="tc__row" id="tcRow">
    <input type="text" class="tc__input" id="tcInput" aria-label="Tag input, color is decided by the letters" placeholder="Type a tag, then Enter">
  </div>
  <p class="tc__meta"><b id="tcCount">0</b> · same letters always get the same color</p>
  <p class="tc__sr" role="status" aria-live="polite" id="tcLive"></p>
</div>
<script>
(function () {
  var PALETTE_LEN = 6; // 계산 겹 상수: 팔레트 색 개수 — 해시의 나머지 범위
  var WORDS = ['Cafe', 'Sunset', 'Sea', 'Cafe'];
  var TYPE_MS = 90, HOLD_MS = 600, PAUSE_MS = 900;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('tc');
  var row = document.getElementById('tcRow');
  var input = document.getElementById('tcInput');
  var countEl = document.getElementById('tcCount');
  var live = document.getElementById('tcLive');
  var seq = 0;

  function human() { if (root.classList.contains('is-demo')) root.classList.remove('is-demo'); }
  function chips() { return row.querySelectorAll('.tc__chip').length; }
  function render() { countEl.textContent = chips(); }

  // 계산 겹: 글자 코드값을 더한 합을 팔레트 개수로 나눈 나머지로 색을 고른다 — 같은 글자는 언제나 같은 나머지다
  function hashIndex(text) {
    var h = 0;
    for (var i = 0; i < text.length; i++) { h += text.charCodeAt(i) * (i + 1); }
    return h % PALETTE_LEN;
  }

  function addChip(text) {
    seq++;
    var idx = hashIndex(text);
    var chip = document.createElement('span');
    chip.className = 'tc__chip tc__chip--enter tc__chip--c' + idx;
    chip.id = 'tcChip' + seq;
    chip.innerHTML = '<span class="tc__chipText"></span><button type="button" class="tc__chipX">×</button>';
    chip.querySelector('.tc__chipText').textContent = text;
    chip.querySelector('.tc__chipX').setAttribute('aria-label', 'Remove tag: ' + text);
    chip.querySelector('.tc__chipX').addEventListener('click', function () { human(); chip.remove(); render(); });
    row.insertBefore(chip, input);
    requestAnimationFrame(function () { chip.classList.remove('tc__chip--enter'); });
    render();
    live.textContent = text + ' tag, ' + (idx + 1) + 'th color';
  }

  function addFromInput() {
    var v = input.value.trim();
    if (!v) return;
    addChip(v);
    input.value = '';
  }
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && input.value.trim()) { human(); addFromInput(); }
  });

  var timer = 0;
  function schedule(fn, ms) { timer = window.setTimeout(fn, ms); }

  function typeWord(word, i, cb) {
    if (!root.classList.contains('is-demo')) return;
    if (i <= word.length) {
      input.value = word.slice(0, i);
      schedule(function () { typeWord(word, i + 1, cb); }, TYPE_MS);
    } else {
      addFromInput();
      schedule(cb, HOLD_MS);
    }
  }

  function loop(i) {
    if (!root.classList.contains('is-demo')) return;
    if (i < WORDS.length) {
      typeWord(WORDS[i], 0, function () { loop(i + 1); });
    } else {
      row.querySelectorAll('.tc__chip').forEach(function (c) { c.remove(); });
      render();
      schedule(function () { loop(0); }, PAUSE_MS);
    }
  }

  render();
  if (!reduce) {
    schedule(function () { loop(0); }, 300);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</main>
</body>
</html>
