<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>같은 태그를 다시 넣으면 기존 칩이 깜빡이는 입력 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="td is-demo" id="td">
  <div class="td__row" id="tdRow">
    <input type="text" class="td__input" id="tdInput" aria-label="태그 입력, 이미 있으면 새로 만들지 않고 그 칩이 빛난다" placeholder="태그 입력">
    <button type="button" class="td__add" id="tdAdd" aria-label="태그 추가">+</button>
  </div>
  <p class="td__meta">태그 <b id="tdCount">0</b>개<span class="td__dup" id="tdDup" hidden> · 이미 있음</span></p>
  <p class="td__sr" role="status" aria-live="polite" id="tdLive"></p>
</div>
<script>
(function () {
  var WORDS = ['아이디어', '초안', '아이디어', '검토'];
  var ADD_MS = 620, PAUSE_MS = 900;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('td');
  var row = document.getElementById('tdRow');
  var input = document.getElementById('tdInput');
  var addBtn = document.getElementById('tdAdd');
  var countEl = document.getElementById('tdCount');
  var dupEl = document.getElementById('tdDup');
  var live = document.getElementById('tdLive');
  var seq = 0;

  function norm(text) { return text.trim().toLowerCase(); }
  function chips() { return Array.prototype.slice.call(row.querySelectorAll('.td__chip')); }
  function render() { countEl.textContent = chips().length; }
  function human() { if (root.classList.contains('is-demo')) root.classList.remove('is-demo'); }

  function findDup(text) {
    // 계산 겹: 정규화한 문자열을 기존 칩 전부와 견줘 같은 것을 찾는다 — 대소문자·앞뒤 공백은 다르게 치지 않는다
    var key = norm(text);
    var list = chips();
    for (var i = 0; i < list.length; i++) {
      if (norm(list[i].dataset.text) === key) return list[i];
    }
    return null;
  }

  function merge(chip) {
    // 계산 겹: 새 칩을 만들지 않고 이미 있는 칩에 감쇠 스프링 펄스를 다시 건다(reflow 로 재생 보장)
    chip.classList.remove('td__chip--merge');
    void chip.offsetWidth;
    chip.classList.add('td__chip--merge');
    dupEl.hidden = false;
    live.textContent = chip.dataset.text + ' 은 이미 있다';
    if (reduce) render();
  }

  function add(text) {
    if (!text) return;
    var dup = findDup(text);
    if (dup) { merge(dup); return; }
    dupEl.hidden = true;
    seq++;
    var chip = document.createElement('span');
    chip.className = 'td__chip td__chip--enter';
    chip.id = 'tdChip' + seq;
    chip.dataset.text = text;
    chip.innerHTML = '<span class="td__chipText"></span><button type="button" class="td__chipX">×</button>';
    chip.querySelector('.td__chipText').textContent = text;
    chip.querySelector('.td__chipX').setAttribute('aria-label', '태그 삭제: ' + text);
    chip.querySelector('.td__chipX').addEventListener('click', function () { human(); chip.remove(); render(); });
    row.insertBefore(chip, input);
    requestAnimationFrame(function () { chip.classList.remove('td__chip--enter'); });
    render();
    live.textContent = text + ' 추가 · 태그 ' + chips().length + '개';
  }

  addBtn.addEventListener('click', function () { human(); add(input.value.trim()); input.value = ''; });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && input.value.trim()) { human(); add(input.value.trim()); input.value = ''; }
  });

  var timer = 0;
  function schedule(fn, ms) { timer = window.setTimeout(fn, ms); }

  function loop(i) {
    if (!root.classList.contains('is-demo')) return;
    if (i < WORDS.length) {
      add(WORDS[i]);
      schedule(function () { loop(i + 1); }, ADD_MS);
    } else {
      chips().forEach(function (c) { c.remove(); });
      dupEl.hidden = true;
      render();
      schedule(function () { loop(0); }, PAUSE_MS);
    }
  }

  render();
  if (!reduce) {
    schedule(function () { loop(0); }, 260);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</main>
</body>
</html>
