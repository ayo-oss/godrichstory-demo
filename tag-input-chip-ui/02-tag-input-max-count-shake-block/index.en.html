<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag chip input that shakes to block once the count limit is hit — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tm is-demo" id="tm">
  <div class="tm__row" id="tmRow">
    <input type="text" class="tm__input" id="tmInput" aria-label="Tag input, shakes when the limit is reached" placeholder="Tag input">
    <button type="button" class="tm__add" id="tmAdd" aria-label="Add tag">+</button>
  </div>
  <p class="tm__meta">Tags <b id="tmCount">0</b> / <b id="tmMax">5</b><span class="tm__warn" id="tmWarn" hidden> · limit reached</span></p>
  <p class="tm__sr" role="alert" id="tmLive"></p>
</div>
<script>
(function () {
  var MAX_COUNT = 5; // 계산 겹 상수: 이 개수와 매번 비교해 한도를 판정한다
  var WORDS = ['To-do', 'In progress', 'Done', 'On hold', 'Urgent'];
  var OVER_WORD = 'Confirm';
  var ADD_MS = 180, PAUSE_MS = 900;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.getElementById('tm');
  var row = document.getElementById('tmRow');
  var input = document.getElementById('tmInput');
  var addBtn = document.getElementById('tmAdd');
  var countEl = document.getElementById('tmCount');
  var warnEl = document.getElementById('tmWarn');
  var live = document.getElementById('tmLive');
  var seq = 0;

  function count() { return row.querySelectorAll('.tm__chip').length; }

  function render() {
    countEl.textContent = count();
    warnEl.hidden = count() < MAX_COUNT;
  }

  function human() { if (root.classList.contains('is-demo')) root.classList.remove('is-demo'); }

  function block() {
    // 계산 겹: 개수를 MAX_COUNT 와 비교해 이미 한도라면 칩을 만들지 않고 스프링 흔들림만 재생한다
    row.classList.remove('tm__row--shake');
    void row.offsetWidth; // 리플로우 — 같은 클래스를 다시 걸어도 애니메이션이 재생되게
    row.classList.add('tm__row--shake');
    live.textContent = 'Tags ' + MAX_COUNT + ' limit reached';
    if (reduce) render();
  }

  function add(text) {
    if (!text) return;
    if (count() >= MAX_COUNT) { block(); return; }
    seq++;
    var chip = document.createElement('span');
    chip.className = 'tm__chip tm__chip--enter';
    chip.id = 'tmChip' + seq;
    chip.innerHTML = '<span class="tm__chipText"></span><button type="button" class="tm__chipX">×</button>';
    chip.querySelector('.tm__chipText').textContent = text;
    chip.querySelector('.tm__chipX').setAttribute('aria-label', 'Remove tag: ' + text);
    chip.querySelector('.tm__chipX').addEventListener('click', function () { human(); chip.remove(); render(); });
    row.insertBefore(chip, input);
    requestAnimationFrame(function () { chip.classList.remove('tm__chip--enter'); });
    render();
    live.textContent = text + ' added · tags ' + count() + ' ';
  }

  addBtn.addEventListener('click', function () { human(); add(input.value.trim()); input.value = ''; });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && input.value.trim()) { human(); add(input.value.trim()); input.value = ''; }
  });

  var timer = 0;
  function schedule(fn, ms) { timer = window.setTimeout(fn, ms); }

  function loop(i) {
    if (!root.classList.contains('is-demo')) return;
    if (i < WORDS.length) {
      add(WORDS[i]);
      schedule(function () { loop(i + 1); }, ADD_MS);
    } else if (i === WORDS.length) {
      add(OVER_WORD); // 한도에 닿아 block() 이 대신 실행된다
      schedule(function () { loop(i + 1); }, PAUSE_MS);
    } else {
      row.querySelectorAll('.tm__chip').forEach(function (c) { c.remove(); });
      render();
      schedule(function () { loop(0); }, ADD_MS);
    }
  }

  render();
  if (!reduce) {
    schedule(function () { loop(0); }, 320);
  } else {
    root.classList.remove('is-demo');
  }
})();
</script>
</main>
</body>
</html>
