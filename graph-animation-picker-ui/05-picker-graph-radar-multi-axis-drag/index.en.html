<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar picker that redraws its shape as you drag each axis point — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<figure class="rd is-demo" id="rd">
  <div class="rd__zone" id="zone">
    <svg class="rd__chart" id="chart" viewBox="0 0 480 300" role="img" aria-label="A radar chart connecting the values of five axes; adjusting axis A's value recalculates the entire polygon path.">
      <g class="rd__grid" id="grid"></g>
      <g class="rd__axes" id="axes"></g>
      <path class="rd__poly" id="poly"></path>
      <g class="rd__pts" id="pts"></g>
    </svg>
    <b class="rd__badge" aria-hidden="true">A <span id="rd-val">60</span></b>
  </div>

  <div class="rd__track" id="track">
    <span class="rd__rail" aria-hidden="true"></span>
    <button class="rd__grab" id="grab" type="button" role="slider" aria-orientation="horizontal"
            aria-label="Choose axis A's value" aria-valuemin="5" aria-valuemax="100"
            aria-valuenow="60" aria-valuetext="Axis A 60">
      <svg class="rd__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M96 64v128a8 8 0 0 1-16 0V64a8 8 0 0 1 16 0m88 0v128a8 8 0 0 1-16 0V64a8 8 0 0 1 16 0" opacity=".2"/><path d="M188 32a8 8 0 0 0-8 8v176a8 8 0 0 0 16 0V40a8 8 0 0 0-8-8M76 32a8 8 0 0 0-8 8v176a8 8 0 0 0 16 0V40a8 8 0 0 0-8-8"/></g></svg>
    </button>
  </div>

  <p class="rd__hint">Drag on the bar or press the arrow keys and the polygon redraws to match axis A's value.</p>

  <div class="sr">
    <span aria-live="polite" id="rd-live"></span>
    <table>
      <caption>Value by axis</caption>
      <thead><tr><th>Axis</th><th>Value</th></tr></thead>
      <tbody id="sr-body"></tbody>
    </table>
  </div>
</figure>
</main>
<script>
// 실제 동작: pointerdown/move/up 과 keydown 이 Axis A Value(5~100)을 바꾸면, 나머지 B~E 축은
// 각자 독립된 사인 곡선으로 계속 움직이며, 5개 Value 전부를 극좌표 점으로 바꿔 그 점들을
// 순서대로 이은 다각형 경로(path d 속성)를 매 프레임 다시 계산해 그린다.
// CSS @keyframes 없음(다섯 Axis 모두 매 프레임 실수 값으로 바뀌어 선언형으로 못 담는다,
// 398-01~04 와 같은 이유).
var root = document.getElementById('rd');
var zone = document.getElementById('zone');
var track = document.getElementById('track');
var grab = document.getElementById('grab');
var gridG = document.getElementById('grid');
var axesG = document.getElementById('axes');
var polyEl = document.getElementById('poly');
var ptsG = document.getElementById('pts');
var valEl = document.getElementById('rd-val');
var live = document.getElementById('rd-live');
var srBody = document.getElementById('sr-body');

var CX = 240, CY = 158, R = 96;         // picker-graph-radar-radius — 레이더 반지름
var AXIS_COUNT = 5;
var LABELS = ['A', 'B', 'C', 'D', 'E'];
var MIN_V = 5, MAX_V = 100;
var LERP_RATE = 0.20;
var STEP = 5;
var PERIODS = [0, 1.5, 1.2, 1.8, 1.4];
var PHASES = [0, 1.1, 2.4, 0.4, 3.3];
var BASE_V = [55, 52, 55, 50, 52];
var AMP_V = [0, 44, 42, 44, 40];

var values = BASE_V.slice();
var current = BASE_V.slice();
var manual = false;
var autoT = 0;
var lastTs = 0;
var trackRect = null;
var rafId = 0;
var pointEls = [];

function reduced() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function angleOf(i) { return -90 + (360 / AXIS_COUNT) * i; }

function polar(cx, cy, r, deg) {
  var rad = deg * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function buildStaticParts() {
  var gridHtml = '';
  [0.34, 0.68, 1].forEach(function (f) {
    var d = '';
    for (var i = 0; i < AXIS_COUNT; i++) {
      var p = polar(CX, CY, R * f, angleOf(i));
      d += (i === 0 ? 'M ' : 'L ') + p.x + ' ' + p.y;
    }
    gridHtml += '<path class="rd__ring" d="' + d + ' Z"></path>';
  });
  gridG.innerHTML = gridHtml;

  var axesHtml = '';
  for (var j = 0; j < AXIS_COUNT; j++) {
    var e = polar(CX, CY, R, angleOf(j));
    axesHtml += '<line class="rd__axis" x1="' + CX + '" y1="' + CY + '" x2="' + e.x + '" y2="' + e.y + '"></line>';
    var lp = polar(CX, CY, R + 16, angleOf(j));
    axesHtml += '<text class="rd__label" x="' + lp.x + '" y="' + lp.y + '" text-anchor="middle" dominant-baseline="central">' + LABELS[j] + '</text>';
  }
  axesG.innerHTML = axesHtml;

  var ptsHtml = '';
  for (var k = 0; k < AXIS_COUNT; k++) ptsHtml += '<circle class="rd__pt" id="pt' + k + '" r="5"></circle>';
  ptsG.innerHTML = ptsHtml;
  for (var m = 0; m < AXIS_COUNT; m++) pointEls.push(document.getElementById('pt' + m));
}

function paint() {
  var d = '';
  for (var i = 0; i < AXIS_COUNT; i++) {
    var p = polar(CX, CY, R * (current[i] / 100), angleOf(i));
    d += (i === 0 ? 'M ' : 'L ') + p.x + ' ' + p.y;
    pointEls[i].setAttribute('cx', String(p.x));
    pointEls[i].setAttribute('cy', String(p.y));
  }
  polyEl.setAttribute('d', d + ' Z');
  var rv = Math.round(current[0]);
  valEl.textContent = String(rv);
  grab.style.left = ((values[0] - MIN_V) / (MAX_V - MIN_V) * 100) + '%';
  grab.setAttribute('aria-valuenow', String(Math.round(values[0])));
  grab.setAttribute('aria-valuetext', 'Axis A ' + Math.round(values[0]));
  var rows = '';
  for (var j = 0; j < AXIS_COUNT; j++) rows += '<tr><th>' + LABELS[j] + '</th><td>' + Math.round(current[j]) + '</td></tr>';
  srBody.innerHTML = rows;
}

function announce() {
  live.textContent = 'Axis A ' + Math.round(current[0]) + ' recomputed';
}

function setValue(v, isManual) {
  values[0] = Math.max(MIN_V, Math.min(MAX_V, v));
  if (isManual) { manual = true; root.classList.remove('is-demo'); }
}

function fromPointer(clientX) {
  if (!trackRect) trackRect = track.getBoundingClientRect();
  var ratio = (clientX - trackRect.left) / trackRect.width;
  setValue(MIN_V + ratio * (MAX_V - MIN_V), true);
}

function reflectNow() {
  current[0] = values[0];
  paint();
  announce();
}

function onDown(e) {
  trackRect = track.getBoundingClientRect();
  if (grab.setPointerCapture) { try { grab.setPointerCapture(e.pointerId); } catch (err) {} }
  fromPointer(e.clientX);
  if (reduced()) reflectNow();
}
function onMove(e) { fromPointer(e.clientX); if (reduced()) reflectNow(); }
function onUp() { announce(); }
function onTrackDown(e) { trackRect = track.getBoundingClientRect(); fromPointer(e.clientX); if (reduced()) reflectNow(); }

function onKey(e) {
  var map = { ArrowLeft: -STEP, ArrowDown: -STEP, ArrowRight: STEP, ArrowUp: STEP };
  if (e.key === 'Home') { setValue(MIN_V, true); e.preventDefault(); }
  else if (e.key === 'End') { setValue(MAX_V, true); e.preventDefault(); }
  else if (map[e.key] !== undefined) { setValue(values[0] + map[e.key], true); e.preventDefault(); }
  else { return; }
  if (reduced()) reflectNow();
}

function onResize() { trackRect = track.getBoundingClientRect(); if (reduced()) paint(); }

function autoStep(dt) {
  autoT += dt;
  if (!manual) {
    var omega0 = 2 * Math.PI / 2.4;
    values[0] = 55 + 40 * Math.sin(autoT * omega0);
  }
  for (var i = 1; i < AXIS_COUNT; i++) {
    var omega = 2 * Math.PI / PERIODS[i];
    values[i] = BASE_V[i] + AMP_V[i] * Math.sin(autoT * omega + PHASES[i]);
  }
}

function frame(ts) {
  if (!lastTs) lastTs = ts;
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  autoStep(dt);
  for (var i = 0; i < AXIS_COUNT; i++) current[i] += (values[i] - current[i]) * LERP_RATE;
  paint();
  rafId = requestAnimationFrame(frame);
}

buildStaticParts();

grab.addEventListener('pointerdown', onDown);
grab.addEventListener('pointermove', onMove);
grab.addEventListener('pointerup', onUp);
grab.addEventListener('keydown', onKey);
track.addEventListener('pointerdown', onTrackDown);
window.addEventListener('resize', onResize);

if (reduced()) {
  root.classList.add('is-still');
  current = values.slice();
  paint();
} else {
  paint();
  rafId = requestAnimationFrame(frame);
}
</script>
</body>
</html>
