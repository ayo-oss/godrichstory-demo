<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waveform picker where bars fill up to the scrubbed position — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<figure class="wf is-demo" id="wf">
  <div class="wf__head">
    <span class="wf__title">Waveform playback position</span>
    <span class="wf__stat" aria-hidden="true"><b class="wf__n" id="wf-val">50</b>%</span>
  </div>

  <div class="wf__zone">
    <svg class="wf__chart" id="chart" viewBox="0 0 480 200" preserveAspectRatio="none" role="img" aria-label="A waveform drawn with 40 bars; bars before the scrubbed position repaint in a filled color and those after in a faint one.">
      <line class="wf__base" x1="0" y1="200" x2="480" y2="200"></line>
      <g id="bars"></g>
      <line class="wf__head-line" id="headline" x1="0" y1="0" x2="0" y2="200"></line>
    </svg>
  </div>

  <div class="wf__track" id="track">
    <span class="wf__rail" aria-hidden="true"></span>
    <button class="wf__grab" id="grab" type="button" role="slider" aria-orientation="horizontal"
            aria-label="Choose playback position" aria-valuemin="0" aria-valuemax="100"
            aria-valuenow="50" aria-valuetext="Playback position 50%">
      <svg class="wf__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M96 64v128a8 8 0 0 1-16 0V64a8 8 0 0 1 16 0m88 0v128a8 8 0 0 1-16 0V64a8 8 0 0 1 16 0" opacity=".2"/><path d="M188 32a8 8 0 0 0-8 8v176a8 8 0 0 0 16 0V40a8 8 0 0 0-8-8M76 32a8 8 0 0 0-8 8v176a8 8 0 0 0 16 0V40a8 8 0 0 0-8-8"/></g></svg>
    </button>
  </div>

  <p class="wf__hint">Drag on the bars or press the arrow keys and the bars repaint up to that position.</p>

  <div class="sr">
    <span aria-live="polite" id="wf-live"></span>
  </div>
</figure>
</main>
<script>
// 실제 동작: pointerdown/move/up 과 keydown 이 Playback position(0~100)를 바꾸면, 그 값을 막대
// 배열의 인덱스로 바꿔 인덱스 이전 막대(fill class)와 이후 막대(pale)를 매 프레임 다시
// 칠하고, 재생선(x 좌표) degrees 같은 값으로 다시 그린다. 위치는 관성 lerp 로 목표를 뒤따른다.
// CSS @keyframes 없음(재생 위치가 매 프레임 실수로 바뀌어 선언형으로 못 담는다,
// 398-01~05 와 같은 이유).
var root = document.getElementById('wf');
var track = document.getElementById('track');
var grab = document.getElementById('grab');
var barsG = document.getElementById('bars');
var headline = document.getElementById('headline');
var valEl = document.getElementById('wf-val');
var live = document.getElementById('wf-live');

var N = 40;                     // picker-graph-waveform-bar-count — 막대 개수
var CHART_H = 190;
var LERP_RATE = 0.24;
var AUTO_PERIOD = 2.2;
var STEP = 5;
var BAR_W = 480 / N;
var GAP = 3;

var HEIGHTS = [];
for (var hi = 0; hi < N; hi++) {
  var v = 0.30 + 0.32 * Math.abs(Math.sin(hi * 0.7)) + 0.24 * Math.abs(Math.cos(hi * 0.31 + 1.1));
  HEIGHTS.push(Math.min(0.96, v));
}

var value = 50;
var current = 50;
var manual = false;
var autoT = 0;
var lastTs = 0;
var trackRect = null;
var rafId = 0;
var barEls = [];

function reduced() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function buildBars() {
  var html = '';
  for (var i = 0; i < N; i++) {
    var h = HEIGHTS[i] * CHART_H;
    var x = i * BAR_W + GAP / 2;
    var w = Math.max(1, BAR_W - GAP);
    html += '<rect class="wf__bar" id="wb' + i + '" x="' + x + '" y="' + (CHART_H - h) + '" width="' + w + '" height="' + h + '"></rect>';
  }
  barsG.innerHTML = html;
  for (var j = 0; j < N; j++) barEls.push(document.getElementById('wb' + j));
}

function paint() {
  var activeIdx = Math.round((current / 100) * N);
  for (var i = 0; i < N; i++) barEls[i].classList.toggle('is-past', i < activeIdx);
  var x = (current / 100) * 480;
  headline.setAttribute('x1', String(x));
  headline.setAttribute('x2', String(x));
  var rv = Math.round(current);
  valEl.textContent = String(rv);
  grab.style.left = value + '%';
  grab.setAttribute('aria-valuenow', String(Math.round(value)));
  grab.setAttribute('aria-valuetext', 'Playback position ' + Math.round(value) + '%');
}

function announce() {
  live.textContent = 'Playback position ' + Math.round(current) + '% recomputed';
}

function setValue(v, isManual) {
  value = Math.max(0, Math.min(100, v));
  if (isManual) { manual = true; root.classList.remove('is-demo'); }
}

function fromPointer(clientX) {
  if (!trackRect) trackRect = track.getBoundingClientRect();
  var ratio = (clientX - trackRect.left) / trackRect.width;
  setValue(ratio * 100, true);
}

function reflectNow() { current = value; paint(); announce(); }

function onDown(e) {
  trackRect = track.getBoundingClientRect();
  if (grab.setPointerCapture) { try { grab.setPointerCapture(e.pointerId); } catch (err) {} }
  fromPointer(e.clientX);
  if (reduced()) reflectNow();
}
function onMove(e) { fromPointer(e.clientX); if (reduced()) reflectNow(); }
function onUp() { announce(); }
function onTrackDown(e) { trackRect = track.getBoundingClientRect(); fromPointer(e.clientX); if (reduced()) reflectNow(); }

function onKey(e) {
  var map = { ArrowLeft: -STEP, ArrowDown: -STEP, ArrowRight: STEP, ArrowUp: STEP };
  if (e.key === 'Home') { setValue(0, true); e.preventDefault(); }
  else if (e.key === 'End') { setValue(100, true); e.preventDefault(); }
  else if (map[e.key] !== undefined) { setValue(value + map[e.key], true); e.preventDefault(); }
  else { return; }
  if (reduced()) reflectNow();
}

function onResize() { trackRect = track.getBoundingClientRect(); if (reduced()) paint(); }

function autoStep(dt) {
  autoT += dt;
  var omega = 2 * Math.PI / AUTO_PERIOD;
  value = 50 + 48 * Math.sin(autoT * omega);
}

function frame(ts) {
  if (!lastTs) lastTs = ts;
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  if (!manual) autoStep(dt);
  current += (value - current) * LERP_RATE;
  paint();
  rafId = requestAnimationFrame(frame);
}

buildBars();

grab.addEventListener('pointerdown', onDown);
grab.addEventListener('pointermove', onMove);
grab.addEventListener('pointerup', onUp);
grab.addEventListener('keydown', onKey);
track.addEventListener('pointerdown', onTrackDown);
window.addEventListener('resize', onResize);

if (reduced()) {
  root.classList.add('is-still');
  current = value;
  paint();
} else {
  paint();
  rafId = requestAnimationFrame(frame);
}
</script>
</body>
</html>
