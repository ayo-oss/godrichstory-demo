<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드래그 궤적이 꺾은선 그래프로 남는 스파크라인 피커 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<figure class="spk is-demo" id="spk">
  <div class="spk__head">
    <span class="spk__title">지나온 값의 궤적</span>
    <span class="spk__stat" aria-hidden="true">값 <b class="spk__n" id="spk-val">50</b></span>
  </div>

  <div class="spk__zone">
    <svg class="spk__chart" id="chart" viewBox="0 0 480 160" preserveAspectRatio="none" role="img" aria-label="지나온 48개 값을 이은 꺾은선 그래프, 값이 바뀔 때마다 오래된 점은 왼쪽으로 밀려나고 새 점이 오른쪽에 더해진다">
      <line class="spk__base" x1="0" y1="150" x2="480" y2="150"></line>
      <path class="spk__area" id="area"></path>
      <path class="spk__line" id="line"></path>
      <circle class="spk__dot" id="dot" r="5"></circle>
    </svg>
  </div>

  <div class="spk__track" id="track">
    <span class="spk__rail" aria-hidden="true"></span>
    <button class="spk__grab" id="grab" type="button" role="slider" aria-orientation="horizontal"
            aria-label="값 고르기" aria-valuemin="0" aria-valuemax="100"
            aria-valuenow="50" aria-valuetext="값 50">
      <svg class="spk__ic" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M96 64v128a8 8 0 0 1-16 0V64a8 8 0 0 1 16 0m88 0v128a8 8 0 0 1-16 0V64a8 8 0 0 1 16 0" opacity=".2"/><path d="M188 32a8 8 0 0 0-8 8v176a8 8 0 0 0 16 0V40a8 8 0 0 0-8-8M76 32a8 8 0 0 0-8 8v176a8 8 0 0 0 16 0V40a8 8 0 0 0-8-8"/></g></svg>
    </button>
  </div>

  <p class="spk__hint">막대 위를 드래그하거나 화살표키를 누르면 지나온 값이 궤적으로 이어집니다</p>

  <div class="sr">
    <span aria-live="polite" id="spk-live"></span>
  </div>
</figure>
</main>
<script>
// 실제 동작: pointerdown/move/up 과 keydown(화살표·Home·End) 이 값(0~100)을 바꾸면,
// 매 프레임 현재(관성 보간) 값을 좌표 배열(trail) 끝에 쌓고 맨 앞 값은 버려
// 고정 길이를 유지한 채 그 배열 전체를 꺾은선 경로(d 속성)로 다시 그린다.
// CSS @keyframes 없음(궤적이 매 프레임 배열 연산으로 바뀌는 실수라 선언형으로 못 담는다, 398-01/02 와 같은 이유).
var root = document.getElementById('spk');
var track = document.getElementById('track');
var grab = document.getElementById('grab');
var lineEl = document.getElementById('line');
var areaEl = document.getElementById('area');
var dotEl = document.getElementById('dot');
var valEl = document.getElementById('spk-val');
var live = document.getElementById('spk-live');

var TRAIL_LENGTH = 48;          // picker-graph-sparkline-trail-length — 변형 03 의 조정 대상
var CHART_W = 480, CHART_H = 150;
var LERP_RATE = 0.24;
var AUTO_PERIOD = 1.3;
var STEP = 5;

var trail = [];
for (var i = 0; i < TRAIL_LENGTH; i++) trail.push(50);

var value = 50;
var current = 50;
var manual = false;
var autoT = 0;
var lastTs = 0;
var trackRect = null;
var rafId = 0;

function reduced() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function yOf(v) { return CHART_H - (v / 100) * CHART_H; }

function buildPoints() {
  var step = CHART_W / (TRAIL_LENGTH - 1);
  var pts = [];
  for (var i = 0; i < TRAIL_LENGTH; i++) pts.push([i * step, yOf(trail[i])]);
  return pts;
}

function paint() {
  var pts = buildPoints();
  var d = 'M ' + pts[0][0] + ' ' + pts[0][1];
  for (var i = 1; i < pts.length; i++) d += ' L ' + pts[i][0] + ' ' + pts[i][1];
  lineEl.setAttribute('d', d);
  areaEl.setAttribute('d', d + ' L ' + pts[pts.length - 1][0] + ' ' + CHART_H + ' L ' + pts[0][0] + ' ' + CHART_H + ' Z');
  var last = pts[pts.length - 1];
  dotEl.setAttribute('cx', String(last[0]));
  dotEl.setAttribute('cy', String(last[1]));
  var rv = Math.round(current);
  valEl.textContent = String(rv);
  grab.style.left = value + '%';
  grab.setAttribute('aria-valuenow', String(Math.round(value)));
  grab.setAttribute('aria-valuetext', '값 ' + Math.round(value));
}

function announce() {
  live.textContent = '값 ' + Math.round(current) + '이(가) 궤적에 더해짐';
}

function setValue(v, isManual) {
  value = Math.max(0, Math.min(100, v));
  if (isManual) { manual = true; root.classList.remove('is-demo'); }
}

function fromPointer(clientX) {
  if (!trackRect) trackRect = track.getBoundingClientRect();
  var ratio = (clientX - trackRect.left) / trackRect.width;
  setValue(ratio * 100, true);
}

function pushTrail() {
  trail.shift();
  trail.push(current);
}

function reflectNow() {
  current = value;
  pushTrail();
  paint();
  announce();
}

function onDown(e) {
  trackRect = track.getBoundingClientRect();
  if (grab.setPointerCapture) { try { grab.setPointerCapture(e.pointerId); } catch (err) {} }
  fromPointer(e.clientX);
  if (reduced()) reflectNow();
}
function onMove(e) { fromPointer(e.clientX); if (reduced()) reflectNow(); }
function onUp() { announce(); }
function onTrackDown(e) { trackRect = track.getBoundingClientRect(); fromPointer(e.clientX); if (reduced()) reflectNow(); }

function onKey(e) {
  var map = { ArrowLeft: -STEP, ArrowDown: -STEP, ArrowRight: STEP, ArrowUp: STEP };
  if (e.key === 'Home') { setValue(0, true); e.preventDefault(); }
  else if (e.key === 'End') { setValue(100, true); e.preventDefault(); }
  else if (map[e.key] !== undefined) { setValue(value + map[e.key], true); e.preventDefault(); }
  else { return; }
  if (reduced()) reflectNow();
}

function onResize() { trackRect = track.getBoundingClientRect(); if (reduced()) paint(); }

function autoStep(dt) {
  autoT += dt;
  var omega = 2 * Math.PI / AUTO_PERIOD;
  value = 50 + 42 * Math.sin(autoT * omega) + 8 * Math.sin(autoT * omega * 2.7);
}

function frame(ts) {
  if (!lastTs) lastTs = ts;
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  if (!manual) autoStep(dt);
  current += (value - current) * LERP_RATE;
  pushTrail();
  paint();
  rafId = requestAnimationFrame(frame);
}

grab.addEventListener('pointerdown', onDown);
grab.addEventListener('pointermove', onMove);
grab.addEventListener('pointerup', onUp);
grab.addEventListener('keydown', onKey);
track.addEventListener('pointerdown', onTrackDown);
window.addEventListener('resize', onResize);

if (reduced()) {
  root.classList.add('is-still');
  current = value;
  paint();
} else {
  paint();
  rafId = requestAnimationFrame(frame);
}
</script>
</body>
</html>
