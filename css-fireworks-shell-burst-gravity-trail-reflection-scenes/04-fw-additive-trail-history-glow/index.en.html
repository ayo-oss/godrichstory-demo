<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tails Drawn From Position History and a Glow That Brightens Where They Overlap — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sc is-demo" id="scRoot">
  <canvas class="sc__canvas" id="scCanvas" width="480" height="300" tabindex="0" aria-label="Tails Drawn From Position History and a Glow That Brightens Where They Overlap"></canvas>
  <p class="sc__status" id="scStatus" aria-live="polite">Trail history stacked additively — overlaps bloom white</p>
  <button class="sc__btn" id="scBtn" type="button">Pause</button>
  <p class="sc__caption">Tails Drawn From Position History and a Glow That Brightens Where They Overlap</p>
</div>
</main>
<script>
(function () {
    const W = 480;
    const H = 300;
    const PI2 = Math.PI * 2;
    const FIXED_DT = 16;
    const REDUCE_STEP_MS = 900;
    const KEY_STEP = 14;
    const IDLE_TICKS = 150;
    const BTN_PAUSE = 'Pause';
    const BTN_PLAY = 'Play';
    const BTN_NEXT = 'Next scene';
    // 파스텔 알갱이 팔레트와 밤하늘 두 끝 색
    const PINK = [255, 170, 196];
    const MINT = [150, 226, 196];
    const LILAC = [196, 176, 255];
    const SKY_BLUE = [150, 214, 255];
    const BUTTER = [255, 230, 150];
    const CREAM = [255, 247, 230];
    const PALETTE = [PINK, MINT, LILAC, SKY_BLUE, BUTTER];
    const SKY_TOP = [18, 16, 32];
    const SKY_BOT = [46, 40, 76];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 같은 시드면 언제나 같은 수열 (선형 합동 방식)
    function lcg(seed) {
        let s = seed >>> 0;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 정수 하나와 시드로 0 이상 1 미만의 값을 만드는 해시 (같은 입력은 늘 같은 값)
    function hash1(i, seed) {
        let h = (Math.imul(i | 0, 374761393) + Math.imul(seed | 0, 668265263)) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
    }
    function hash2(x, y, seed) {
        return hash1((Math.imul(x | 0, 73856093) ^ Math.imul(y | 0, 19349663)) | 0, seed);
    }
    // 1차원 값 노이즈 — 정수점 해시를 smooth 로 이어 붙인다
    function noise1(x, seed) {
        const xi = Math.floor(x);
        return lerp(hash1(xi, seed), hash1(xi + 1, seed), smooth(x - xi));
    }
    // 2차원 값 노이즈
    function vnoise(x, y, seed) {
        const xi = Math.floor(x);
        const yi = Math.floor(y);
        const fx = smooth(x - xi);
        const fy = smooth(y - yi);
        const a = lerp(hash2(xi, yi, seed), hash2(xi + 1, yi, seed), fx);
        const b = lerp(hash2(xi, yi + 1, seed), hash2(xi + 1, yi + 1, seed), fx);
        return lerp(a, b, fy);
    }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mixRGB(a, b, k) {
        return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
    }
    // 밤하늘 바탕 — 위가 어둡고 아래가 보랏빛
    function drawSky(ctx, height) {
        const g = ctx.createLinearGradient(0, 0, 0, height);
        g.addColorStop(0, rgba(SKY_TOP, 1));
        g.addColorStop(1, rgba(SKY_BOT, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, height);
    }
    function start(root, canvas, statusEl, btnEl, make) {
        const ctx0 = canvas.getContext('2d');
        if (!ctx0) {
            return function () { return; };
        }
        const ctx = ctx0;
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const inp = { x: W / 2, y: H / 2, idle: 99999, vx: 0, vy: 0, dpr: 1 };
        let lastPx = -1;
        let lastPy = -1;
        // 화면 배율이 바뀌어도 캔버스 픽셀 수를 다시 맞춘다
        function fit() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            inp.dpr = dpr;
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        fit();
        const scene = make(inp, reduce);
        let paused = false;
        let rafId = 0;
        let lastTs = -1;
        let accMs = 0;
        let lastLabel = '';
        const cleaners = [];
        function listen(target, type, fn) {
            target.addEventListener(type, fn);
            cleaners.push(function () { target.removeEventListener(type, fn); });
        }
        function show() {
            ctx.setTransform(inp.dpr, 0, 0, inp.dpr, 0, 0);
            scene.draw(ctx);
            const t = scene.label();
            if (t !== lastLabel) {
                lastLabel = t;
                statusEl.textContent = t;
            }
        }
        function tickOnce() {
            inp.idle += 1;
            inp.vx *= 0.9;
            inp.vy *= 0.9;
            scene.step();
        }
        function advance(ms) {
            const n = Math.round(ms / FIXED_DT);
            for (let i = 0; i < n; i += 1) {
                tickOnce();
            }
        }
        function refresh() {
            if (reduce) {
                advance(FIXED_DT * 6);
                show();
            }
        }
        function toLocal(e) {
            const r = canvas.getBoundingClientRect();
            const nx = clamp((e.clientX - r.left) * W / r.width, 0, W);
            const ny = clamp((e.clientY - r.top) * H / r.height, 0, H);
            if (lastPx >= 0) {
                inp.vx = lerp(inp.vx, nx - lastPx, 0.5);
                inp.vy = lerp(inp.vy, ny - lastPy, 0.5);
            }
            lastPx = nx;
            lastPy = ny;
            inp.x = nx;
            inp.y = ny;
            inp.idle = 0;
        }
        function tick(ts) {
            if (lastTs < 0) {
                lastTs = ts;
            }
            const frameDt = Math.min(ts - lastTs, 160);
            lastTs = ts;
            if (!paused) {
                accMs += frameDt;
                while (accMs >= FIXED_DT) {
                    tickOnce();
                    accMs -= FIXED_DT;
                }
                show();
            }
            rafId = requestAnimationFrame(tick);
        }
        btnEl.textContent = reduce ? BTN_NEXT : BTN_PAUSE;
        if (reduce) {
            root.classList.remove('is-demo');
        }
        show();
        listen(btnEl, 'click', function () {
            if (reduce) {
                advance(REDUCE_STEP_MS);
                show();
                return;
            }
            paused = !paused;
            if (paused) {
                root.classList.remove('is-demo');
            }
            else {
                root.classList.add('is-demo');
            }
            btnEl.textContent = paused ? BTN_PLAY : BTN_PAUSE;
        });
        listen(canvas, 'pointermove', function (e) {
            toLocal(e);
            refresh();
        });
        listen(canvas, 'pointerdown', function (e) {
            lastPx = -1;
            toLocal(e);
            scene.tap();
            refresh();
        });
        listen(canvas, 'keydown', function (e) {
            const k = e.key;
            let dx = 0;
            let dy = 0;
            if (k === 'Enter' || k === ' ') {
                e.preventDefault();
                scene.tap();
                refresh();
                return;
            }
            if (k === 'ArrowLeft') {
                dx = -KEY_STEP;
            }
            else if (k === 'ArrowRight') {
                dx = KEY_STEP;
            }
            else if (k === 'ArrowUp') {
                dy = -KEY_STEP;
            }
            else if (k === 'ArrowDown') {
                dy = KEY_STEP;
            }
            else {
                return;
            }
            e.preventDefault();
            inp.x = clamp(inp.x + dx, 0, W);
            inp.y = clamp(inp.y + dy, 0, H);
            inp.vx = dx * 0.5;
            inp.vy = dy * 0.5;
            inp.idle = 0;
            refresh();
        });
        listen(window, 'resize', function () {
            fit();
            show();
        });
        if (!reduce) {
            rafId = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(rafId);
            for (let i = 0; i < cleaners.length; i += 1) {
                cleaners[i]();
            }
        };
    }
    const TRAIL_LEN = 16;
    const GLOW_BLUR = 9;
    const FADE_ALPHA = 0.86;
    const HEAD_R = 2.1;
    const BURST_GAP = 44;
    const SPARK_N = 56;
    const SPARK_DRAG = 0.972;
    const SPARK_GRAVITY = 0.045;
    const PREWARM_STEPS = 38;
    const TXT_AUTO = 'Trail history stacked additively — overlaps bloom white';
    const TXT_TAP = 'A glow bursts where you press';
    // 위치 이력 한 줄에서 i 번째 점의 알파 — 머리에서 멀수록 FADE_ALPHA 를 거듭 곱한다
    function trailAlpha(back) {
        return Math.pow(FADE_ALPHA, back);
    }
    function makeScene(inp, reduce) {
        const rng = lcg(4004);
        let sparks = [];
        let gap = 2;
        let colorIdx = 0;
        const glows = [];
        function glowFor(idx) {
            if (glows[idx]) {
                return glows[idx];
            }
            const size = GLOW_BLUR * 4;
            const cv = document.createElement('canvas');
            cv.width = size;
            cv.height = size;
            const c = cv.getContext('2d');
            if (c) {
                const g = c.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
                g.addColorStop(0, rgba(CREAM, 0.9));
                g.addColorStop(0.25, rgba(PALETTE[idx], 0.45));
                g.addColorStop(1, rgba(PALETTE[idx], 0));
                c.fillStyle = g;
                c.fillRect(0, 0, size, size);
            }
            glows[idx] = cv;
            return cv;
        }
        function burst(x, y) {
            const hue = colorIdx % PALETTE.length;
            colorIdx += 1;
            for (let i = 0; i < SPARK_N; i += 1) {
                const a = rng() * PI2;
                const sp = 2.2 + rng() * 2.4;
                sparks.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, age: 0, life: 70 + rng() * 26, hist: [], hue: i % 4 === 0 ? (hue + 1) % PALETTE.length : hue });
            }
            if (sparks.length > 330) {
                sparks.splice(0, sparks.length - 330);
            }
        }
        const scene = {
            step() {
                gap -= 1;
                if (gap <= 0) {
                    burst(90 + rng() * 300, 80 + rng() * 70);
                    gap = BURST_GAP;
                }
                const alive = [];
                for (let i = 0; i < sparks.length; i += 1) {
                    const s = sparks[i];
                    s.age += 1;
                    s.hist.push(s.x, s.y);
                    if (s.hist.length > TRAIL_LEN * 2) {
                        s.hist.splice(0, 2);
                    }
                    s.vx *= SPARK_DRAG;
                    s.vy = s.vy * SPARK_DRAG + SPARK_GRAVITY;
                    s.x += s.vx;
                    s.y += s.vy;
                    if (s.age < s.life) {
                        alive.push(s);
                    }
                }
                sparks = alive;
            },
            draw(ctx) {
                drawSky(ctx, H);
                // 이 항목의 핵심 — 합성 방식을 가산으로 바꾸면 겹친 곳의 색이 더해져 하얗게 번진다
                ctx.globalCompositeOperation = 'lighter';
                ctx.lineCap = 'round';
                for (let i = 0; i < sparks.length; i += 1) {
                    const s = sparks[i];
                    const life = Math.pow(1 - s.age / s.life, 0.7);
                    const n = s.hist.length / 2;
                    for (let k = 1; k < n; k += 1) {
                        const a = trailAlpha(n - k) * life;
                        ctx.strokeStyle = rgba(PALETTE[s.hue], a * 0.85);
                        ctx.lineWidth = lerp(0.6, HEAD_R * 1.3, k / n);
                        ctx.beginPath();
                        ctx.moveTo(s.hist[(k - 1) * 2], s.hist[(k - 1) * 2 + 1]);
                        ctx.lineTo(s.hist[k * 2], s.hist[k * 2 + 1]);
                        ctx.stroke();
                    }
                    const r = GLOW_BLUR * (0.6 + 0.4 * life);
                    ctx.globalAlpha = life * (reduce ? 0.6 : 0.85);
                    ctx.drawImage(glowFor(s.hue), s.x - r, s.y - r, r * 2, r * 2);
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = rgba(CREAM, life);
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, HEAD_R * (0.5 + 0.5 * life), 0, PI2);
                    ctx.fill();
                }
                ctx.globalCompositeOperation = 'source-over';
            },
            label() {
                return inp.idle < IDLE_TICKS ? TXT_TAP : TXT_AUTO;
            },
            tap() {
                burst(inp.x, inp.y);
            }
        };
        for (let i = 0; i < PREWARM_STEPS; i += 1) {
            scene.step();
        }
        return scene;
    }
    start(document.getElementById('scRoot'), document.getElementById('scCanvas'), document.getElementById('scStatus'), document.getElementById('scBtn'), makeScene);
})();
</script>
</body>
</html>
