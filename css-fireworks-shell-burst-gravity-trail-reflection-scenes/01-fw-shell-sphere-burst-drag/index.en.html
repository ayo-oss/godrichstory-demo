<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Basic Burst Whose Grains Spread Evenly Over a Sphere While Air Drag Eats Their Speed — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sc is-demo" id="scRoot">
  <canvas class="sc__canvas" id="scCanvas" width="480" height="300" tabindex="0" aria-label="A Basic Burst Whose Grains Spread Evenly Over a Sphere While Air Drag Eats Their Speed"></canvas>
  <p class="sc__status" id="scStatus" aria-live="polite">Fibonacci-sphere burst — drag eats the speed</p>
  <button class="sc__btn" id="scBtn" type="button">Pause</button>
  <p class="sc__caption">A Basic Burst Whose Grains Spread Evenly Over a Sphere While Air Drag Eats Their Speed</p>
</div>
</main>
<script>
(function () {
    const W = 480;
    const H = 300;
    const PI2 = Math.PI * 2;
    const FIXED_DT = 16;
    const REDUCE_STEP_MS = 900;
    const KEY_STEP = 14;
    const IDLE_TICKS = 150;
    const BTN_PAUSE = 'Pause';
    const BTN_PLAY = 'Play';
    const BTN_NEXT = 'Next scene';
    // 파스텔 알갱이 팔레트와 밤하늘 두 끝 색
    const PINK = [255, 170, 196];
    const MINT = [150, 226, 196];
    const LILAC = [196, 176, 255];
    const SKY_BLUE = [150, 214, 255];
    const BUTTER = [255, 230, 150];
    const CREAM = [255, 247, 230];
    const PALETTE = [PINK, MINT, LILAC, SKY_BLUE, BUTTER];
    const SKY_TOP = [18, 16, 32];
    const SKY_BOT = [46, 40, 76];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 같은 시드면 언제나 같은 수열 (선형 합동 방식)
    function lcg(seed) {
        let s = seed >>> 0;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 정수 하나와 시드로 0 이상 1 미만의 값을 만드는 해시 (같은 입력은 늘 같은 값)
    function hash1(i, seed) {
        let h = (Math.imul(i | 0, 374761393) + Math.imul(seed | 0, 668265263)) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
    }
    function hash2(x, y, seed) {
        return hash1((Math.imul(x | 0, 73856093) ^ Math.imul(y | 0, 19349663)) | 0, seed);
    }
    // 1차원 값 노이즈 — 정수점 해시를 smooth 로 이어 붙인다
    function noise1(x, seed) {
        const xi = Math.floor(x);
        return lerp(hash1(xi, seed), hash1(xi + 1, seed), smooth(x - xi));
    }
    // 2차원 값 노이즈
    function vnoise(x, y, seed) {
        const xi = Math.floor(x);
        const yi = Math.floor(y);
        const fx = smooth(x - xi);
        const fy = smooth(y - yi);
        const a = lerp(hash2(xi, yi, seed), hash2(xi + 1, yi, seed), fx);
        const b = lerp(hash2(xi, yi + 1, seed), hash2(xi + 1, yi + 1, seed), fx);
        return lerp(a, b, fy);
    }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mixRGB(a, b, k) {
        return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
    }
    // 밤하늘 바탕 — 위가 어둡고 아래가 보랏빛
    function drawSky(ctx, height) {
        const g = ctx.createLinearGradient(0, 0, 0, height);
        g.addColorStop(0, rgba(SKY_TOP, 1));
        g.addColorStop(1, rgba(SKY_BOT, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, height);
    }
    function start(root, canvas, statusEl, btnEl, make) {
        const ctx0 = canvas.getContext('2d');
        if (!ctx0) {
            return function () { return; };
        }
        const ctx = ctx0;
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const inp = { x: W / 2, y: H / 2, idle: 99999, vx: 0, vy: 0, dpr: 1 };
        let lastPx = -1;
        let lastPy = -1;
        // 화면 배율이 바뀌어도 캔버스 픽셀 수를 다시 맞춘다
        function fit() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            inp.dpr = dpr;
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        fit();
        const scene = make(inp, reduce);
        let paused = false;
        let rafId = 0;
        let lastTs = -1;
        let accMs = 0;
        let lastLabel = '';
        const cleaners = [];
        function listen(target, type, fn) {
            target.addEventListener(type, fn);
            cleaners.push(function () { target.removeEventListener(type, fn); });
        }
        function show() {
            ctx.setTransform(inp.dpr, 0, 0, inp.dpr, 0, 0);
            scene.draw(ctx);
            const t = scene.label();
            if (t !== lastLabel) {
                lastLabel = t;
                statusEl.textContent = t;
            }
        }
        function tickOnce() {
            inp.idle += 1;
            inp.vx *= 0.9;
            inp.vy *= 0.9;
            scene.step();
        }
        function advance(ms) {
            const n = Math.round(ms / FIXED_DT);
            for (let i = 0; i < n; i += 1) {
                tickOnce();
            }
        }
        function refresh() {
            if (reduce) {
                advance(FIXED_DT * 6);
                show();
            }
        }
        function toLocal(e) {
            const r = canvas.getBoundingClientRect();
            const nx = clamp((e.clientX - r.left) * W / r.width, 0, W);
            const ny = clamp((e.clientY - r.top) * H / r.height, 0, H);
            if (lastPx >= 0) {
                inp.vx = lerp(inp.vx, nx - lastPx, 0.5);
                inp.vy = lerp(inp.vy, ny - lastPy, 0.5);
            }
            lastPx = nx;
            lastPy = ny;
            inp.x = nx;
            inp.y = ny;
            inp.idle = 0;
        }
        function tick(ts) {
            if (lastTs < 0) {
                lastTs = ts;
            }
            const frameDt = Math.min(ts - lastTs, 160);
            lastTs = ts;
            if (!paused) {
                accMs += frameDt;
                while (accMs >= FIXED_DT) {
                    tickOnce();
                    accMs -= FIXED_DT;
                }
                show();
            }
            rafId = requestAnimationFrame(tick);
        }
        btnEl.textContent = reduce ? BTN_NEXT : BTN_PAUSE;
        if (reduce) {
            root.classList.remove('is-demo');
        }
        show();
        listen(btnEl, 'click', function () {
            if (reduce) {
                advance(REDUCE_STEP_MS);
                show();
                return;
            }
            paused = !paused;
            if (paused) {
                root.classList.remove('is-demo');
            }
            else {
                root.classList.add('is-demo');
            }
            btnEl.textContent = paused ? BTN_PLAY : BTN_PAUSE;
        });
        listen(canvas, 'pointermove', function (e) {
            toLocal(e);
            refresh();
        });
        listen(canvas, 'pointerdown', function (e) {
            lastPx = -1;
            toLocal(e);
            scene.tap();
            refresh();
        });
        listen(canvas, 'keydown', function (e) {
            const k = e.key;
            let dx = 0;
            let dy = 0;
            if (k === 'Enter' || k === ' ') {
                e.preventDefault();
                scene.tap();
                refresh();
                return;
            }
            if (k === 'ArrowLeft') {
                dx = -KEY_STEP;
            }
            else if (k === 'ArrowRight') {
                dx = KEY_STEP;
            }
            else if (k === 'ArrowUp') {
                dy = -KEY_STEP;
            }
            else if (k === 'ArrowDown') {
                dy = KEY_STEP;
            }
            else {
                return;
            }
            e.preventDefault();
            inp.x = clamp(inp.x + dx, 0, W);
            inp.y = clamp(inp.y + dy, 0, H);
            inp.vx = dx * 0.5;
            inp.vy = dy * 0.5;
            inp.idle = 0;
            refresh();
        });
        listen(window, 'resize', function () {
            fit();
            show();
        });
        if (!reduce) {
            rafId = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(rafId);
            for (let i = 0; i < cleaners.length; i += 1) {
                cleaners[i]();
            }
        };
    }
    const BURST_N = 90;
    const GRAVITY = 0.045;
    const DRAG = 0.975;
    const FUSE_MS = 1100;
    const BURST_SPEED = 3.4;
    const GRAIN_LIFE = 96;
    const MAX_SHELLS = 5;
    const PREWARM_STEPS = 30;
    const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
    const TXT_AUTO = 'Fibonacci-sphere burst — drag eats the speed';
    const TXT_TAP = 'Bursts where you press — grains sit evenly on a sphere';
    // 피보나치 격자 — 구 표면에 같은 간격으로 n 개의 방향을 나눈다
    function sphereDirs(n) {
        const out = [];
        for (let i = 0; i < n; i += 1) {
            const y = 1 - 2 * (i + 0.5) / n;
            const r = Math.sqrt(1 - y * y);
            const a = i * GOLDEN_ANGLE;
            out.push([r * Math.cos(a), y, r * Math.sin(a)]);
        }
        return out;
    }
    // 한 프레임 — 속도에 항력 계수를 곱하고 아래 방향으로 중력을 더한다
    function moveGrain(g) {
        g.px = g.x;
        g.py = g.y;
        g.vx *= DRAG;
        g.vy = g.vy * DRAG + GRAVITY;
        g.vz *= DRAG;
        g.x += g.vx;
        g.y += g.vy;
        g.z += g.vz;
    }
    function makeShell(x, y, n, rng, hueA, hueB) {
        const dirs = sphereDirs(n);
        const tilt = rng() * PI2;
        const ct = Math.cos(tilt);
        const st = Math.sin(tilt);
        const grains = [];
        for (let i = 0; i < dirs.length; i += 1) {
            const d = dirs[i];
            // 구를 x 축 둘레로 돌려 터질 때마다 격자 무늬가 다르게 놓인다
            const dy = d[1] * ct - d[2] * st;
            const dz = d[1] * st + d[2] * ct;
            const sp = BURST_SPEED * (0.96 + rng() * 0.08);
            grains.push({ x: x, y: y, z: 0, vx: d[0] * sp, vy: dy * sp, vz: dz * sp, px: x, py: y, hue: i % 2 === 0 ? hueA : hueB });
        }
        return { grains: grains, age: 0, cx: x, cy: y };
    }
    // 측정용 — 터진 뒤 steps 프레임이 지난 알갱이들이 6px 칸을 몇 개 채우는지, 이웃과의 평균 거리
    function shellSpread(n, steps) {
        const rng = lcg(7);
        const sh = makeShell(0, 0, n, rng, PINK, MINT);
        for (let s = 0; s < steps; s += 1) {
            for (let i = 0; i < sh.grains.length; i += 1) {
                moveGrain(sh.grains[i]);
            }
        }
        const seen = {};
        let cells = 0;
        let total = 0;
        for (let i = 0; i < sh.grains.length; i += 1) {
            const a = sh.grains[i];
            const key = Math.floor(a.x / 6) + ',' + Math.floor(a.y / 6);
            if (!seen[key]) {
                seen[key] = true;
                cells += 1;
            }
            let best = 1e9;
            for (let j = 0; j < sh.grains.length; j += 1) {
                if (j !== i) {
                    const b = sh.grains[j];
                    best = Math.min(best, Math.hypot(a.x - b.x, a.y - b.y));
                }
            }
            total += best;
        }
        return { cells: cells, nearest: total / sh.grains.length };
    }
    function makeScene(inp, reduce) {
        const rng = lcg(457);
        const FUSE_STEPS = Math.round(FUSE_MS / FIXED_DT);
        let shells = [];
        let fuse = 2;
        let colorIdx = 0;
        function burst(x, y) {
            const a = PALETTE[colorIdx % PALETTE.length];
            const b = PALETTE[(colorIdx + 2) % PALETTE.length];
            colorIdx += 1;
            shells.push(makeShell(x, y, BURST_N, rng, a, b));
            if (shells.length > MAX_SHELLS) {
                shells.shift();
            }
        }
        const scene = {
            step() {
                fuse -= 1;
                if (fuse <= 0) {
                    burst(90 + rng() * 300, 70 + rng() * 80);
                    fuse = FUSE_STEPS;
                }
                const alive = [];
                for (let s = 0; s < shells.length; s += 1) {
                    const sh = shells[s];
                    sh.age += 1;
                    for (let i = 0; i < sh.grains.length; i += 1) {
                        moveGrain(sh.grains[i]);
                    }
                    if (sh.age < GRAIN_LIFE) {
                        alive.push(sh);
                    }
                }
                shells = alive;
            },
            draw(ctx) {
                drawSky(ctx, H);
                ctx.globalCompositeOperation = 'lighter';
                for (let s = 0; s < shells.length; s += 1) {
                    const sh = shells[s];
                    const life = clamp(1 - sh.age / GRAIN_LIFE, 0, 1);
                    const alpha = Math.pow(life, 0.7);
                    if (sh.age < 10) {
                        const flashK = (1 - sh.age / 10) * (reduce ? 0.35 : 0.8);
                        ctx.fillStyle = rgba(CREAM, flashK);
                        ctx.beginPath();
                        ctx.arc(sh.cx, sh.cy, 7 + sh.age * 3, 0, PI2);
                        ctx.fill();
                    }
                    for (let i = 0; i < sh.grains.length; i += 1) {
                        const g = sh.grains[i];
                        const depth = 1 + g.z * 0.0025;
                        const front = clamp(0.78 + g.z * 0.004, 0.5, 1);
                        ctx.strokeStyle = rgba(g.hue, alpha * 0.55 * front);
                        ctx.lineWidth = 1.5 * depth;
                        ctx.beginPath();
                        ctx.moveTo(g.x - g.vx * 2.5, g.y - g.vy * 2.5);
                        ctx.lineTo(g.x, g.y);
                        ctx.stroke();
                        ctx.fillStyle = rgba(g.hue, alpha * front);
                        ctx.beginPath();
                        ctx.arc(g.x, g.y, (1.4 + 1.8 * alpha) * depth, 0, PI2);
                        ctx.fill();
                    }
                }
                ctx.globalCompositeOperation = 'source-over';
            },
            label() {
                return inp.idle < IDLE_TICKS ? TXT_TAP : TXT_AUTO;
            },
            tap() {
                burst(inp.x, inp.y);
            }
        };
        for (let i = 0; i < PREWARM_STEPS; i += 1) {
            scene.step();
        }
        return scene;
    }
    start(document.getElementById('scRoot'), document.getElementById('scCanvas'), document.getElementById('scStatus'), document.getElementById('scBtn'), makeScene);
})();
</script>
</body>
</html>
