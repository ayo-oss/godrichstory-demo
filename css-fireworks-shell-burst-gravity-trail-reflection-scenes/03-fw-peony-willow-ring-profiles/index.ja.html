<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>牡丹・柳・輪が速度分布ひとつで分かれる三種類の玉 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sc is-demo" id="scRoot">
  <canvas class="sc__canvas" id="scCanvas" width="480" height="300" tabindex="0" aria-label="牡丹・柳・輪が速度分布ひとつで分かれる三種類の玉"></canvas>
  <p class="sc__status" id="scStatus" aria-live="polite">牡丹 — 速さが0から最大まで広がり詰まった球になる</p>
  <button class="sc__btn" id="scBtn" type="button">一時停止</button>
  <p class="sc__caption">牡丹・柳・輪が速度分布ひとつで分かれる三種類の玉</p>
</div>
</main>
<script>
(function () {
    const W = 480;
    const H = 300;
    const PI2 = Math.PI * 2;
    const FIXED_DT = 16;
    const REDUCE_STEP_MS = 900;
    const KEY_STEP = 14;
    const IDLE_TICKS = 150;
    const BTN_PAUSE = '一時停止';
    const BTN_PLAY = '再生';
    const BTN_NEXT = '次の場面';
    // 파스텔 알갱이 팔레트와 밤하늘 두 끝 색
    const PINK = [255, 170, 196];
    const MINT = [150, 226, 196];
    const LILAC = [196, 176, 255];
    const SKY_BLUE = [150, 214, 255];
    const BUTTER = [255, 230, 150];
    const CREAM = [255, 247, 230];
    const PALETTE = [PINK, MINT, LILAC, SKY_BLUE, BUTTER];
    const SKY_TOP = [18, 16, 32];
    const SKY_BOT = [46, 40, 76];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 같은 시드면 언제나 같은 수열 (선형 합동 방식)
    function lcg(seed) {
        let s = seed >>> 0;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 정수 하나와 시드로 0 이상 1 미만의 값을 만드는 해시 (같은 입력은 늘 같은 값)
    function hash1(i, seed) {
        let h = (Math.imul(i | 0, 374761393) + Math.imul(seed | 0, 668265263)) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
    }
    function hash2(x, y, seed) {
        return hash1((Math.imul(x | 0, 73856093) ^ Math.imul(y | 0, 19349663)) | 0, seed);
    }
    // 1차원 값 노이즈 — 정수점 해시를 smooth 로 이어 붙인다
    function noise1(x, seed) {
        const xi = Math.floor(x);
        return lerp(hash1(xi, seed), hash1(xi + 1, seed), smooth(x - xi));
    }
    // 2차원 값 노이즈
    function vnoise(x, y, seed) {
        const xi = Math.floor(x);
        const yi = Math.floor(y);
        const fx = smooth(x - xi);
        const fy = smooth(y - yi);
        const a = lerp(hash2(xi, yi, seed), hash2(xi + 1, yi, seed), fx);
        const b = lerp(hash2(xi, yi + 1, seed), hash2(xi + 1, yi + 1, seed), fx);
        return lerp(a, b, fy);
    }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mixRGB(a, b, k) {
        return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
    }
    // 밤하늘 바탕 — 위가 어둡고 아래가 보랏빛
    function drawSky(ctx, height) {
        const g = ctx.createLinearGradient(0, 0, 0, height);
        g.addColorStop(0, rgba(SKY_TOP, 1));
        g.addColorStop(1, rgba(SKY_BOT, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, height);
    }
    function start(root, canvas, statusEl, btnEl, make) {
        const ctx0 = canvas.getContext('2d');
        if (!ctx0) {
            return function () { return; };
        }
        const ctx = ctx0;
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const inp = { x: W / 2, y: H / 2, idle: 99999, vx: 0, vy: 0, dpr: 1 };
        let lastPx = -1;
        let lastPy = -1;
        // 화면 배율이 바뀌어도 캔버스 픽셀 수를 다시 맞춘다
        function fit() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            inp.dpr = dpr;
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        fit();
        const scene = make(inp, reduce);
        let paused = false;
        let rafId = 0;
        let lastTs = -1;
        let accMs = 0;
        let lastLabel = '';
        const cleaners = [];
        function listen(target, type, fn) {
            target.addEventListener(type, fn);
            cleaners.push(function () { target.removeEventListener(type, fn); });
        }
        function show() {
            ctx.setTransform(inp.dpr, 0, 0, inp.dpr, 0, 0);
            scene.draw(ctx);
            const t = scene.label();
            if (t !== lastLabel) {
                lastLabel = t;
                statusEl.textContent = t;
            }
        }
        function tickOnce() {
            inp.idle += 1;
            inp.vx *= 0.9;
            inp.vy *= 0.9;
            scene.step();
        }
        function advance(ms) {
            const n = Math.round(ms / FIXED_DT);
            for (let i = 0; i < n; i += 1) {
                tickOnce();
            }
        }
        function refresh() {
            if (reduce) {
                advance(FIXED_DT * 6);
                show();
            }
        }
        function toLocal(e) {
            const r = canvas.getBoundingClientRect();
            const nx = clamp((e.clientX - r.left) * W / r.width, 0, W);
            const ny = clamp((e.clientY - r.top) * H / r.height, 0, H);
            if (lastPx >= 0) {
                inp.vx = lerp(inp.vx, nx - lastPx, 0.5);
                inp.vy = lerp(inp.vy, ny - lastPy, 0.5);
            }
            lastPx = nx;
            lastPy = ny;
            inp.x = nx;
            inp.y = ny;
            inp.idle = 0;
        }
        function tick(ts) {
            if (lastTs < 0) {
                lastTs = ts;
            }
            const frameDt = Math.min(ts - lastTs, 160);
            lastTs = ts;
            if (!paused) {
                accMs += frameDt;
                while (accMs >= FIXED_DT) {
                    tickOnce();
                    accMs -= FIXED_DT;
                }
                show();
            }
            rafId = requestAnimationFrame(tick);
        }
        btnEl.textContent = reduce ? BTN_NEXT : BTN_PAUSE;
        if (reduce) {
            root.classList.remove('is-demo');
        }
        show();
        listen(btnEl, 'click', function () {
            if (reduce) {
                advance(REDUCE_STEP_MS);
                show();
                return;
            }
            paused = !paused;
            if (paused) {
                root.classList.remove('is-demo');
            }
            else {
                root.classList.add('is-demo');
            }
            btnEl.textContent = paused ? BTN_PLAY : BTN_PAUSE;
        });
        listen(canvas, 'pointermove', function (e) {
            toLocal(e);
            refresh();
        });
        listen(canvas, 'pointerdown', function (e) {
            lastPx = -1;
            toLocal(e);
            scene.tap();
            refresh();
        });
        listen(canvas, 'keydown', function (e) {
            const k = e.key;
            let dx = 0;
            let dy = 0;
            if (k === 'Enter' || k === ' ') {
                e.preventDefault();
                scene.tap();
                refresh();
                return;
            }
            if (k === 'ArrowLeft') {
                dx = -KEY_STEP;
            }
            else if (k === 'ArrowRight') {
                dx = KEY_STEP;
            }
            else if (k === 'ArrowUp') {
                dy = -KEY_STEP;
            }
            else if (k === 'ArrowDown') {
                dy = KEY_STEP;
            }
            else {
                return;
            }
            e.preventDefault();
            inp.x = clamp(inp.x + dx, 0, W);
            inp.y = clamp(inp.y + dy, 0, H);
            inp.vx = dx * 0.5;
            inp.vy = dy * 0.5;
            inp.idle = 0;
            refresh();
        });
        listen(window, 'resize', function () {
            fit();
            show();
        });
        if (!reduce) {
            rafId = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(rafId);
            for (let i = 0; i < cleaners.length; i += 1) {
                cleaners[i]();
            }
        };
    }
    const WILLOW_DRAG = 0.96;
    const RING_TILT = 0.9;
    const SHELL_TYPES = ['peony', 'willow', 'ring'];
    const TAIL_FADE = 0.82;
    const PEONY_DRAG = 0.94;
    const RING_DRAG = 0.955;
    const GRAIN_N = 84;
    const SHELL_GAP = 40;
    const PREWARM_STEPS = 34;
    const TXT_PEONY = '牡丹 — 速さが0から最大まで広がり詰まった球になる';
    const TXT_WILLOW = '柳 — 薄い殻に広がった粒が尾を垂らす';
    const TXT_RING = '輪 — 速さを一つに揃え面を傾けると楕円になる';
    function dragOf(kind) {
        if (kind === 'willow') {
            return WILLOW_DRAG;
        }
        return kind === 'ring' ? RING_DRAG : PEONY_DRAG;
    }
    function makeShell(kind, x, y, rng, hue) {
        const grains = [];
        for (let i = 0; i < GRAIN_N; i += 1) {
            let vx = 0;
            let vy = 0;
            let z = 0;
            if (kind === 'ring') {
                // 같은 속도로 원을 그리고, 원이 놓인 면을 RING_TILT 만큼 눕힌다
                const a = (i / GRAIN_N) * PI2;
                const sp = 3.5;
                vx = Math.cos(a) * sp;
                vy = Math.sin(a) * Math.cos(RING_TILT) * sp;
                z = Math.sin(a) * Math.sin(RING_TILT);
            }
            else {
                const a = rng() * PI2;
                // 모란은 0 에서 최대까지, 버들은 최대 근처에만 속도를 둔다
                const sp = kind === 'willow' ? 3.1 * (0.85 + 0.15 * rng()) : 5.1 * Math.sqrt(0.12 + 0.88 * rng());
                vx = Math.cos(a) * sp;
                vy = Math.sin(a) * sp;
            }
            grains.push({ x: x, y: y, vx: vx, vy: vy, z: z, hist: [] });
        }
        const tail = kind === 'willow' ? 13 : (kind === 'ring' ? 7 : 5);
        return { kind: kind, grains: grains, age: 0, life: kind === 'willow' ? 124 : 84, hue: hue, drag: dragOf(kind), gravity: kind === 'willow' ? 0.05 : (kind === 'ring' ? 0.02 : 0.03), tail: tail };
    }
    function moveShell(sh) {
        sh.age += 1;
        for (let i = 0; i < sh.grains.length; i += 1) {
            const g = sh.grains[i];
            g.hist.push(g.x, g.y);
            if (g.hist.length > sh.tail * 2) {
                g.hist.splice(0, 2);
            }
            g.vx *= sh.drag;
            g.vy = g.vy * sh.drag + sh.gravity;
            g.x += g.vx;
            g.y += g.vy;
        }
    }
    // 측정용 — 항력 계수 d 로 life 프레임을 날린 알갱이가 출발점에서 얼마나 멀리 가는가 (평균 px)
    function reachOf(d, life) {
        const rng = lcg(11);
        const sh = makeShell('willow', 0, 0, rng, PINK);
        sh.drag = d;
        for (let i = 0; i < life; i += 1) {
            moveShell(sh);
        }
        let total = 0;
        for (let i = 0; i < sh.grains.length; i += 1) {
            total += Math.hypot(sh.grains[i].x, sh.grains[i].y);
        }
        return total / sh.grains.length;
    }
    function makeScene(inp, reduce) {
        const rng = lcg(303);
        let shells = [];
        let gap = 2;
        let typeIdx = 0;
        let lastKind = SHELL_TYPES[0];
        function burst(x, y) {
            const kind = SHELL_TYPES[typeIdx % SHELL_TYPES.length];
            shells.push(makeShell(kind, x, y, rng, PALETTE[(typeIdx * 2) % PALETTE.length]));
            lastKind = kind;
            typeIdx += 1;
            if (shells.length > 5) {
                shells.shift();
            }
        }
        const scene = {
            step() {
                gap -= 1;
                if (gap <= 0) {
                    burst(110 + rng() * 260, 85 + rng() * 45);
                    gap = SHELL_GAP;
                }
                const alive = [];
                for (let i = 0; i < shells.length; i += 1) {
                    moveShell(shells[i]);
                    if (shells[i].age < shells[i].life) {
                        alive.push(shells[i]);
                    }
                }
                shells = alive;
            },
            draw(ctx) {
                drawSky(ctx, H);
                ctx.globalCompositeOperation = 'lighter';
                for (let s = 0; s < shells.length; s += 1) {
                    const sh = shells[s];
                    const a = Math.pow(clamp(1 - sh.age / sh.life, 0, 1), 0.75);
                    for (let i = 0; i < sh.grains.length; i += 1) {
                        const g = sh.grains[i];
                        const n = g.hist.length / 2;
                        // 꼬리 — 오래된 점일수록 TAIL_FADE 를 거듭 곱해 흐려진다
                        for (let k = 1; k < n; k += 1) {
                            const fade = Math.pow(TAIL_FADE, n - k);
                            ctx.strokeStyle = rgba(sh.hue, a * fade * 0.8);
                            ctx.lineWidth = 0.8 + fade * 0.9;
                            ctx.beginPath();
                            ctx.moveTo(g.hist[(k - 1) * 2], g.hist[(k - 1) * 2 + 1]);
                            ctx.lineTo(g.hist[k * 2], g.hist[k * 2 + 1]);
                            ctx.stroke();
                        }
                        ctx.fillStyle = rgba(sh.kind === 'willow' ? BUTTER : sh.hue, a * (0.7 + g.z * 0.3));
                        ctx.beginPath();
                        ctx.arc(g.x, g.y, 1.4 + 1.5 * a, 0, PI2);
                        ctx.fill();
                    }
                }
                ctx.globalCompositeOperation = 'source-over';
            },
            label() {
                if (lastKind === 'willow') {
                    return TXT_WILLOW;
                }
                return lastKind === 'ring' ? TXT_RING : TXT_PEONY;
            },
            tap() {
                burst(inp.x, inp.y);
            }
        };
        for (let i = 0; i < PREWARM_STEPS; i += 1) {
            scene.step();
        }
        return scene;
    }
    start(document.getElementById('scRoot'), document.getElementById('scCanvas'), document.getElementById('scStatus'), document.getElementById('scBtn'), makeScene);
})();
</script>
</body>
</html>
