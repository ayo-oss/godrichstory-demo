<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수면에 거꾸로 비치고 잔물결에 일그러지는 불꽃의 반사 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sc is-demo" id="scRoot">
  <canvas class="sc__canvas" id="scCanvas" width="480" height="300" tabindex="0" aria-label="수면에 거꾸로 비치고 잔물결에 일그러지는 불꽃의 반사"></canvas>
  <p class="sc__status" id="scStatus" aria-live="polite">수평선 위를 뒤집어 다시 그린다 — 줄마다 사인 파동으로 밀린다</p>
  <button class="sc__btn" id="scBtn" type="button">멈춤</button>
  <p class="sc__caption">수면에 거꾸로 비치고 잔물결에 일그러지는 불꽃의 반사</p>
</div>
</main>
<script>
(function () {
    const W = 480;
    const H = 300;
    const PI2 = Math.PI * 2;
    const FIXED_DT = 16;
    const REDUCE_STEP_MS = 900;
    const KEY_STEP = 14;
    const IDLE_TICKS = 150;
    const BTN_PAUSE = '멈춤';
    const BTN_PLAY = '재생';
    const BTN_NEXT = '다음 장면';
    // 파스텔 알갱이 팔레트와 밤하늘 두 끝 색
    const PINK = [255, 170, 196];
    const MINT = [150, 226, 196];
    const LILAC = [196, 176, 255];
    const SKY_BLUE = [150, 214, 255];
    const BUTTER = [255, 230, 150];
    const CREAM = [255, 247, 230];
    const PALETTE = [PINK, MINT, LILAC, SKY_BLUE, BUTTER];
    const SKY_TOP = [18, 16, 32];
    const SKY_BOT = [46, 40, 76];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 같은 시드면 언제나 같은 수열 (선형 합동 방식)
    function lcg(seed) {
        let s = seed >>> 0;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 정수 하나와 시드로 0 이상 1 미만의 값을 만드는 해시 (같은 입력은 늘 같은 값)
    function hash1(i, seed) {
        let h = (Math.imul(i | 0, 374761393) + Math.imul(seed | 0, 668265263)) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
    }
    function hash2(x, y, seed) {
        return hash1((Math.imul(x | 0, 73856093) ^ Math.imul(y | 0, 19349663)) | 0, seed);
    }
    // 1차원 값 노이즈 — 정수점 해시를 smooth 로 이어 붙인다
    function noise1(x, seed) {
        const xi = Math.floor(x);
        return lerp(hash1(xi, seed), hash1(xi + 1, seed), smooth(x - xi));
    }
    // 2차원 값 노이즈
    function vnoise(x, y, seed) {
        const xi = Math.floor(x);
        const yi = Math.floor(y);
        const fx = smooth(x - xi);
        const fy = smooth(y - yi);
        const a = lerp(hash2(xi, yi, seed), hash2(xi + 1, yi, seed), fx);
        const b = lerp(hash2(xi, yi + 1, seed), hash2(xi + 1, yi + 1, seed), fx);
        return lerp(a, b, fy);
    }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mixRGB(a, b, k) {
        return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
    }
    // 밤하늘 바탕 — 위가 어둡고 아래가 보랏빛
    function drawSky(ctx, height) {
        const g = ctx.createLinearGradient(0, 0, 0, height);
        g.addColorStop(0, rgba(SKY_TOP, 1));
        g.addColorStop(1, rgba(SKY_BOT, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, height);
    }
    function start(root, canvas, statusEl, btnEl, make) {
        const ctx0 = canvas.getContext('2d');
        if (!ctx0) {
            return function () { return; };
        }
        const ctx = ctx0;
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const inp = { x: W / 2, y: H / 2, idle: 99999, vx: 0, vy: 0, dpr: 1 };
        let lastPx = -1;
        let lastPy = -1;
        // 화면 배율이 바뀌어도 캔버스 픽셀 수를 다시 맞춘다
        function fit() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            inp.dpr = dpr;
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        fit();
        const scene = make(inp, reduce);
        let paused = false;
        let rafId = 0;
        let lastTs = -1;
        let accMs = 0;
        let lastLabel = '';
        const cleaners = [];
        function listen(target, type, fn) {
            target.addEventListener(type, fn);
            cleaners.push(function () { target.removeEventListener(type, fn); });
        }
        function show() {
            ctx.setTransform(inp.dpr, 0, 0, inp.dpr, 0, 0);
            scene.draw(ctx);
            const t = scene.label();
            if (t !== lastLabel) {
                lastLabel = t;
                statusEl.textContent = t;
            }
        }
        function tickOnce() {
            inp.idle += 1;
            inp.vx *= 0.9;
            inp.vy *= 0.9;
            scene.step();
        }
        function advance(ms) {
            const n = Math.round(ms / FIXED_DT);
            for (let i = 0; i < n; i += 1) {
                tickOnce();
            }
        }
        function refresh() {
            if (reduce) {
                advance(FIXED_DT * 6);
                show();
            }
        }
        function toLocal(e) {
            const r = canvas.getBoundingClientRect();
            const nx = clamp((e.clientX - r.left) * W / r.width, 0, W);
            const ny = clamp((e.clientY - r.top) * H / r.height, 0, H);
            if (lastPx >= 0) {
                inp.vx = lerp(inp.vx, nx - lastPx, 0.5);
                inp.vy = lerp(inp.vy, ny - lastPy, 0.5);
            }
            lastPx = nx;
            lastPy = ny;
            inp.x = nx;
            inp.y = ny;
            inp.idle = 0;
        }
        function tick(ts) {
            if (lastTs < 0) {
                lastTs = ts;
            }
            const frameDt = Math.min(ts - lastTs, 160);
            lastTs = ts;
            if (!paused) {
                accMs += frameDt;
                while (accMs >= FIXED_DT) {
                    tickOnce();
                    accMs -= FIXED_DT;
                }
                show();
            }
            rafId = requestAnimationFrame(tick);
        }
        btnEl.textContent = reduce ? BTN_NEXT : BTN_PAUSE;
        if (reduce) {
            root.classList.remove('is-demo');
        }
        show();
        listen(btnEl, 'click', function () {
            if (reduce) {
                advance(REDUCE_STEP_MS);
                show();
                return;
            }
            paused = !paused;
            if (paused) {
                root.classList.remove('is-demo');
            }
            else {
                root.classList.add('is-demo');
            }
            btnEl.textContent = paused ? BTN_PLAY : BTN_PAUSE;
        });
        listen(canvas, 'pointermove', function (e) {
            toLocal(e);
            refresh();
        });
        listen(canvas, 'pointerdown', function (e) {
            lastPx = -1;
            toLocal(e);
            scene.tap();
            refresh();
        });
        listen(canvas, 'keydown', function (e) {
            const k = e.key;
            let dx = 0;
            let dy = 0;
            if (k === 'Enter' || k === ' ') {
                e.preventDefault();
                scene.tap();
                refresh();
                return;
            }
            if (k === 'ArrowLeft') {
                dx = -KEY_STEP;
            }
            else if (k === 'ArrowRight') {
                dx = KEY_STEP;
            }
            else if (k === 'ArrowUp') {
                dy = -KEY_STEP;
            }
            else if (k === 'ArrowDown') {
                dy = KEY_STEP;
            }
            else {
                return;
            }
            e.preventDefault();
            inp.x = clamp(inp.x + dx, 0, W);
            inp.y = clamp(inp.y + dy, 0, H);
            inp.vx = dx * 0.5;
            inp.vy = dy * 0.5;
            inp.idle = 0;
            refresh();
        });
        listen(window, 'resize', function () {
            fit();
            show();
        });
        if (!reduce) {
            rafId = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(rafId);
            for (let i = 0; i < cleaners.length; i += 1) {
                cleaners[i]();
            }
        };
    }
    const MIRROR_ALPHA = 0.6;
    const WAVE_AMP = 3;
    const WAVE_K = 0.35;
    const HORIZON_Y = 190;
    const WAVE_SPEED = 0.1;
    const SPARK_N = 60;
    const SPARK_DRAG = 0.97;
    const SPARK_GRAVITY = 0.04;
    const BURST_GAP = 46;
    const PREWARM_STEPS = 44;
    const WATER_TOP = [30, 32, 62];
    const WATER_BOTTOM = [18, 18, 38];
    const TXT_AUTO = '수평선 위를 뒤집어 다시 그린다 — 줄마다 사인 파동으로 밀린다';
    const TXT_TAP = '누른 자리에서 터진 불꽃이 물 위에 비친다';
    // 물 위로 j 번째 줄이 가로로 밀리는 거리 — 깊을수록 크게, 사인 하나에 노이즈를 조금 섞는다
    function rowShift(j, tick) {
        const depth = 0.5 + j / (H - HORIZON_Y);
        return WAVE_AMP * depth * Math.sin(WAVE_K * j + tick * WAVE_SPEED) + WAVE_AMP * 0.35 * (noise1(j * 0.2 + tick * 0.05, 3) - 0.5);
    }
    // 측정용 — 모든 줄에서 가로 밀림의 최댓값(px)
    function maxShift() {
        let best = 0;
        for (let tick = 0; tick < 120; tick += 1) {
            for (let j = 0; j < H - HORIZON_Y; j += 1) {
                best = Math.max(best, Math.abs(rowShift(j, tick)));
            }
        }
        return best;
    }
    function makeScene(inp, reduce) {
        const rng = lcg(606);
        let sparks = [];
        let gap = 2;
        let t = 0;
        let colorIdx = 0;
        let sky = null;
        let skyDpr = 0;
        function burst(x, y) {
            const hue = PALETTE[colorIdx % PALETTE.length];
            colorIdx += 1;
            for (let i = 0; i < SPARK_N; i += 1) {
                const a = (i / SPARK_N) * PI2 + rng() * 0.1;
                const sp = 1.8 + rng() * 1.6;
                sparks.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, age: 0, life: 60 + rng() * 30, hue: i % 3 === 0 ? CREAM : hue });
            }
            if (sparks.length > 300) {
                sparks.splice(0, sparks.length - 300);
            }
        }
        function skyCanvas(dpr) {
            if (!sky || skyDpr !== dpr) {
                sky = document.createElement('canvas');
                sky.width = Math.round(W * dpr);
                sky.height = Math.round(HORIZON_Y * dpr);
                skyDpr = dpr;
            }
            return sky;
        }
        // 하늘 부분만 따로 그린다 — 이 그림이 곧 반사의 원본이다
        function paintSky(c) {
            drawSky(c, HORIZON_Y);
            c.fillStyle = rgba([24, 20, 38], 1);
            c.beginPath();
            c.moveTo(0, HORIZON_Y);
            for (let x = 0; x <= W; x += 24) {
                c.lineTo(x, HORIZON_Y - 8 - 14 * noise1(x * 0.02, 9));
            }
            c.lineTo(W, HORIZON_Y);
            c.closePath();
            c.fill();
            c.globalCompositeOperation = 'lighter';
            for (let i = 0; i < sparks.length; i += 1) {
                const s = sparks[i];
                if (s.y < HORIZON_Y) {
                    const a = Math.pow(1 - s.age / s.life, 0.8);
                    c.strokeStyle = rgba(s.hue, a * 0.5);
                    c.lineWidth = 1.4;
                    c.beginPath();
                    c.moveTo(s.x - s.vx * 1.6, s.y - s.vy * 1.6);
                    c.lineTo(s.x, s.y);
                    c.stroke();
                    c.fillStyle = rgba(s.hue, a);
                    c.beginPath();
                    c.arc(s.x, s.y, 1.3 + 1.7 * a, 0, PI2);
                    c.fill();
                }
            }
            c.globalCompositeOperation = 'source-over';
        }
        const scene = {
            step() {
                t += 1;
                gap -= 1;
                if (gap <= 0) {
                    burst(90 + rng() * 300, 95 + rng() * 40);
                    gap = BURST_GAP;
                }
                const alive = [];
                for (let i = 0; i < sparks.length; i += 1) {
                    const s = sparks[i];
                    s.age += 1;
                    s.vx *= SPARK_DRAG;
                    s.vy = s.vy * SPARK_DRAG + SPARK_GRAVITY;
                    s.x += s.vx;
                    s.y += s.vy;
                    if (s.age < s.life) {
                        alive.push(s);
                    }
                }
                sparks = alive;
            },
            draw(ctx) {
                const dpr = inp.dpr;
                const cv = skyCanvas(dpr);
                const sc = cv.getContext('2d');
                if (!sc) {
                    return;
                }
                sc.setTransform(dpr, 0, 0, dpr, 0, 0);
                paintSky(sc);
                const wg = ctx.createLinearGradient(0, HORIZON_Y, 0, H);
                wg.addColorStop(0, rgba(WATER_TOP, 1));
                wg.addColorStop(1, rgba(WATER_BOTTOM, 1));
                ctx.fillStyle = wg;
                ctx.fillRect(0, HORIZON_Y, W, H - HORIZON_Y);
                ctx.drawImage(cv, 0, 0, W, HORIZON_Y);
                const rows = H - HORIZON_Y;
                const wobble = reduce ? 0 : t;
                for (let j = 0; j < rows; j += 1) {
                    // 수평선에서 j 줄 아래의 물은 j 줄 위의 하늘을 뒤집어 보여 준다
                    const sy = (HORIZON_Y - 1 - j) * dpr;
                    ctx.globalAlpha = MIRROR_ALPHA * (1 - j / (rows * 1.5));
                    ctx.drawImage(cv, 0, sy, W * dpr, dpr, rowShift(j, wobble), HORIZON_Y + j, W, 1);
                }
                ctx.globalAlpha = 1;
                ctx.fillStyle = rgba(CREAM, 0.16);
                ctx.fillRect(0, HORIZON_Y, W, 1);
            },
            label() {
                return inp.idle < IDLE_TICKS ? TXT_TAP : TXT_AUTO;
            },
            tap() {
                burst(inp.x, clamp(inp.y, 40, HORIZON_Y - 30));
            }
        };
        for (let i = 0; i < PREWARM_STEPS; i += 1) {
            scene.step();
        }
        return scene;
    }
    start(document.getElementById('scRoot'), document.getElementById('scCanvas'), document.getElementById('scStatus'), document.getElementById('scBtn'), makeScene);
})();
</script>
</body>
</html>
