<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기울기 센서로 넘어가는 폴백 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gy is-demo" id="gy">
  <div class="gy__phone" id="phone" role="img" aria-label="A card inside a phone screen turning with the tilt">
    <span class="gy__notch" aria-hidden="true"></span>
    <div class="gy__scene">
      <div class="gy__card" id="card">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="gy__ico" aria-hidden="true"><g fill="currentColor"><path d="M176 24H80a16 16 0 0 0-16 16v176a16 16 0 0 0 16 16h96a16 16 0 0 0 16-16V40a16 16 0 0 0-16-16" opacity=".2"/><path d="M176 16H80a24 24 0 0 0-24 24v176a24 24 0 0 0 24 24h96a24 24 0 0 0 24-24V40a24 24 0 0 0-24-24m8 200a8 8 0 0 1-8 8H80a8 8 0 0 1-8-8V40a8 8 0 0 1 8-8h96a8 8 0 0 1 8 8Z"/></g></svg>
        <span class="gy__face">Tilt it</span>
      </div>
    </div>
  </div>
  <p class="gy__badge" id="badge">
    <span class="gy__mode gy__mode--mouse">Pointer is driving</span>
    <span class="gy__mode gy__mode--tilt">Tilt sensor is driving</span>
  </p>
  <p class="gy__hint">The sensor drives it when there is one; otherwise the pointer does</p>
</div>
</main>
<script>
var gy = document.getElementById('gy');
var phone = document.getElementById('phone');
var card = document.getElementById('card');
var badge = document.getElementById('badge');
var MOUSE_LABEL = 'Pointer is driving';
var TILT_LABEL = 'Tilt sensor is driving';
// iOS 13+ 는 DeviceOrientationEvent.requestPermission 을 사람이 누른 뒤에만 준다 — 그 전까지는 마우스가 맡는다
var hasSensor = typeof window.DeviceOrientationEvent !== 'undefined' && typeof window.DeviceOrientationEvent.requestPermission !== 'function';

function tilt(rx, ry, label) {
  gy.classList.remove('is-demo');
  card.style.transform = 'rotateX(' + rx.toFixed(1) + 'deg) rotateY(' + ry.toFixed(1) + 'deg)';
  badge.textContent = label;
}

if (hasSensor) {
  window.addEventListener('deviceorientation', function (e) {
    var beta = e.beta === null ? 0 : e.beta;   // 앞뒤 기울기
    var gamma = e.gamma === null ? 0 : e.gamma; // 좌우 기울기
    tilt(Math.max(-12, Math.min(12, (beta - 40) * 0.4)), Math.max(-18, Math.min(18, gamma * 0.6)), TILT_LABEL);
  });
}
phone.addEventListener('pointermove', function (e) {
  var r = phone.getBoundingClientRect();
  var nx = Math.max(-1, Math.min(1, (e.clientX - r.left) / r.width * 2 - 1));
  var ny = Math.max(-1, Math.min(1, (e.clientY - r.top) / r.height * 2 - 1));
  tilt(-ny * 12, nx * 18, MOUSE_LABEL);
});
// 키보드 경로: 화살표가 기울기를 6도씩 준다
phone.setAttribute('tabindex', '0');
var keyX = 0, keyY = 0;
phone.addEventListener('keydown', function (e) {
  var keys = { ArrowLeft: [0, -6], ArrowRight: [0, 6], ArrowUp: [6, 0], ArrowDown: [-6, 0] };
  var move = keys[e.key];
  if (!move) { return; }
  e.preventDefault();
  keyX = Math.max(-12, Math.min(12, keyX + move[0]));
  keyY = Math.max(-18, Math.min(18, keyY + move[1]));
  tilt(keyX, keyY, MOUSE_LABEL);
});
</script>
</body>
</html>
