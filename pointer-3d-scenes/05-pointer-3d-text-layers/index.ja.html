<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>층층이 뜬 3D 글자 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tx is-demo" id="tx">
  <div class="tx__scene" id="scene" role="img" aria-label="LAYERS という文字が5層に浮かび、マウスに合わせて傾くモデル">
    <div class="tx__stack" id="stack">
      <span class="tx__layer" aria-hidden="true">LAYERS</span>
      <span class="tx__layer" aria-hidden="true">LAYERS</span>
      <span class="tx__layer" aria-hidden="true">LAYERS</span>
      <span class="tx__layer" aria-hidden="true">LAYERS</span>
      <span class="tx__layer tx__layer--top">LAYERS</span>
    </div>
  </div>
  <p class="tx__hint">マウスを動かすと文字の層が開きます</p>
</div>
</main>
<script>
var tx = document.getElementById('tx');
var scene = document.getElementById('scene');
var stack = document.getElementById('stack');
var aimX = 0, aimY = 0, nowX = 0, nowY = 0, running = false;
var MAX_Y = 18, MAX_X = 10;   // 미리보기 키프레임과 같은 범위

function step() {
  nowX += (aimX - nowX) * 0.14;
  nowY += (aimY - nowY) * 0.14;
  stack.style.transform = 'rotateX(' + nowX.toFixed(2) + 'deg) rotateY(' + nowY.toFixed(2) + 'deg)';
  if (Math.abs(aimX - nowX) < 0.04 && Math.abs(aimY - nowY) < 0.04) { running = false; return; }
  requestAnimationFrame(step);
}

function start() { if (!running) { running = true; requestAnimationFrame(step); } }

scene.addEventListener('pointermove', function (e) {
  tx.classList.remove('is-demo');
  var r = scene.getBoundingClientRect();
  aimY = Math.max(-1, Math.min(1, (e.clientX - r.left) / r.width * 2 - 1)) * MAX_Y;
  aimX = Math.max(-1, Math.min(1, (e.clientY - r.top) / r.height * 2 - 1)) * -MAX_X;
  start();
});
scene.addEventListener('pointerleave', function () { aimX = 0; aimY = 0; start(); });
// 키보드 경로: 화살표로 5도씩 기울인다
scene.setAttribute('tabindex', '0');
scene.addEventListener('keydown', function (e) {
  var keys = { ArrowLeft: [0, -5], ArrowRight: [0, 5], ArrowUp: [5, 0], ArrowDown: [-5, 0] };
  var move = keys[e.key];
  if (!move) { return; }
  e.preventDefault();
  tx.classList.remove('is-demo');
  aimX = Math.max(-MAX_X, Math.min(MAX_X, aimX + move[0]));
  aimY = Math.max(-MAX_Y, Math.min(MAX_Y, aimY + move[1]));
  start();
});
</script>
</body>
</html>
