<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>깊이별로 어긋나는 카드 스택 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cs is-demo" id="cs">
  <div class="cs__scene" id="scene" role="img" aria-label="깊이가 다른 카드 석 장이 마우스를 따라 어긋나는 모형">
    <div class="cs__card cs__card--back">
      <span class="cs__tag">팀</span>
      <span class="cs__gloss" aria-hidden="true"></span>
    </div>
    <div class="cs__card cs__card--mid">
      <span class="cs__tag">프로</span>
      <span class="cs__gloss" aria-hidden="true"></span>
    </div>
    <div class="cs__card cs__card--front">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="cs__ico" aria-hidden="true"><g fill="currentColor"><path d="m224 96l-96 56l-96-56l96-56Z" opacity=".2"/><path d="M232.4 114.49L128 174.06l-104.4-59.57a8 8 0 0 0-7.94 13.88l108.36 61.85a8 8 0 0 0 7.94 0l108.4-61.85a8 8 0 0 0-8-13.88ZM24 89.9l100.36 57.28a8 8 0 0 0 7.94 0L232.4 89.9a16 16 0 0 0 0-27.79L131.94 4.87a8 8 0 0 0-7.88 0L24 62.11a16 16 0 0 0 0 27.79Zm104-69l96.06 54.85L128 130.61L31.94 75.75Z"/></g></svg>
      <span class="cs__tag cs__tag--lead">기본</span>
      <span class="cs__gloss" aria-hidden="true"></span>
    </div>
  </div>
  <p class="cs__hint">마우스를 좌우로 옮겨 보세요</p>
</div>
</main>
<script>
var cs = document.getElementById('cs');
var scene = document.getElementById('scene');
var aim = 0, now = 0, running = false;

// 깊이 계수는 CSS 가 카드마다 --shift 로 갖고 있고, JS 는 -1~1 한 값(--px)만 넘긴다
function step() {
  now += (aim - now) * 0.16;
  scene.style.setProperty('--px', now.toFixed(3));
  if (Math.abs(aim - now) < 0.002) { scene.style.setProperty('--px', aim.toFixed(3)); running = false; return; }
  requestAnimationFrame(step);
}

function start() {
  if (running) { return; }
  running = true;
  requestAnimationFrame(step);
}

function aimFrom(e) {
  var r = scene.getBoundingClientRect();
  var nx = (e.clientX - r.left) / r.width * 2 - 1;
  aim = Math.max(-1, Math.min(1, nx));
}

scene.addEventListener('pointermove', function (e) { cs.classList.remove('is-demo'); aimFrom(e); start(); });
scene.addEventListener('pointerleave', function () { aim = 0; start(); });
// 키보드 경로: 좌우 화살표로 같은 범위를 0.25씩 움직인다
scene.setAttribute('tabindex', '0');
scene.addEventListener('keydown', function (e) {
  var move = e.key === 'ArrowLeft' ? -0.25 : e.key === 'ArrowRight' ? 0.25 : 0;
  if (!move) { return; }
  e.preventDefault();
  cs.classList.remove('is-demo');
  aim = Math.max(-1, Math.min(1, aim + move));
  start();
});
</script>
</body>
</html>
