<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마우스를 따라 도는 제품 목업 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pr is-demo" id="pr">
  <div class="pr__scene" id="scene" role="img" aria-label="マウスに合わせて左右に回る箱のモデル">
    <div class="pr__model" id="model">
      <div class="pr__face pr__face--front">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="pr__ico" aria-hidden="true"><g fill="currentColor"><path d="M128 129.09V232a8 8 0 0 1-3.84-1l-88-48.16a8 8 0 0 1-4.16-7V80.2a8 8 0 0 1 .7-3.27Z" opacity=".2"/><path d="m223.68 66.15l-88-48.15a15.88 15.88 0 0 0-15.36 0l-88 48.17a16 16 0 0 0-8.32 14v95.64a16 16 0 0 0 8.32 14l88 48.17a15.88 15.88 0 0 0 15.36 0l88-48.17a16 16 0 0 0 8.32-14V80.18a16 16 0 0 0-8.32-14.03M128 32l80.34 44L128 120L47.66 76ZM40 90l80 43.78v85.79l-80-43.75Zm96 129.57v-85.75L216 90v85.78Z"/></g></svg>
        <span class="pr__name">コーヒー豆 1袋</span>
      </div>
      <div class="pr__face pr__face--side"><span class="pr__side">250 g</span></div>
      <div class="pr__face pr__face--top"></div>
    </div>
    <span class="pr__floor" aria-hidden="true"></span>
  </div>
  <p class="pr__hint">マウスを乗せて回してみてください</p>
</div>
</main>
<script>
var pr = document.getElementById('pr');
var scene = document.getElementById('scene');
var model = document.getElementById('model');
var MAX_Y = 16, MAX_X = 6;          // 미리보기 루프의 키프레임과 같은 범위
var aimX = 0, aimY = 0;             // 포인터가 요구하는 각도
var nowX = 0, nowY = 0, velX = 0, velY = 0;
var running = false, holding = false;

// 감쇠 추적: 목표로 당기는 힘(stiffness)과 마찰(damping)로 관성과 스프링 복귀를 한 식으로 처리한다
function step() {
  velX = (velX + (aimX - nowX) * 0.18) * 0.76;
  velY = (velY + (aimY - nowY) * 0.18) * 0.76;
  nowX += velX;
  nowY += velY;
  model.style.transform = 'rotateX(' + nowX.toFixed(2) + 'deg) rotateY(' + nowY.toFixed(2) + 'deg)';
  var resting = Math.abs(velX) < 0.01 && Math.abs(velY) < 0.01 && Math.abs(aimX - nowX) < 0.05 && Math.abs(aimY - nowY) < 0.05;
  if (resting && !holding) { running = false; return; }
  requestAnimationFrame(step);
}

function start() {
  if (running) { return; }
  running = true;
  requestAnimationFrame(step);
}

function aimFrom(e) {
  var r = scene.getBoundingClientRect();
  var nx = (e.clientX - r.left) / r.width * 2 - 1;
  var ny = (e.clientY - r.top) / r.height * 2 - 1;
  aimY = Math.max(-1, Math.min(1, nx)) * MAX_Y;
  aimX = Math.max(-1, Math.min(1, ny)) * -MAX_X;
}

scene.addEventListener('pointerenter', function () { pr.classList.remove('is-demo'); holding = true; });
scene.addEventListener('pointermove', function (e) { pr.classList.remove('is-demo'); holding = true; aimFrom(e); start(); });
scene.addEventListener('pointerleave', function () { holding = false; aimX = 0; aimY = 0; start(); });
// 키보드 경로: 화살표로 4도씩 돌린다 (포인터가 없는 사람도 같은 각도를 볼 수 있게)
scene.setAttribute('tabindex', '0');
scene.addEventListener('keydown', function (e) {
  var keys = { ArrowLeft: [0, -4], ArrowRight: [0, 4], ArrowUp: [4, 0], ArrowDown: [-4, 0] };
  var move = keys[e.key];
  if (!move) { return; }
  e.preventDefault();
  pr.classList.remove('is-demo');
  holding = true;
  aimX = Math.max(-MAX_X, Math.min(MAX_X, aimX + move[0]));
  aimY = Math.max(-MAX_Y, Math.min(MAX_Y, aimY + move[1]));
  start();
});
</script>
</body>
</html>
