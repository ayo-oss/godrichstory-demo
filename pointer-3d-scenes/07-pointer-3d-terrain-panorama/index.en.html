<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앞뒤로 갈라지는 풍경 파노라마 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tp is-demo" id="tp">
  <div class="tp__window" id="window" role="img" aria-label="A view where sky, hills, and field each travel a different distance with the pointer">
    <span class="tp__layer tp__layer--sky" aria-hidden="true"><span class="tp__sun"></span></span>
    <span class="tp__layer tp__layer--hill" aria-hidden="true"><i class="tp__peak tp__peak--l"></i><i class="tp__peak tp__peak--r"></i></span>
    <span class="tp__layer tp__layer--field" aria-hidden="true"></span>
    <span class="tp__caption">South Jeju hills</span>
  </div>
  <p class="tp__hint">Move the pointer sideways and the layers pull apart</p>
</div>
</main>
<script>
var tp = document.getElementById('tp');
var frame = document.getElementById('window');
var aim = 0, now = 0, running = false;

// 겹마다 다른 계수는 CSS 가 --depth 로 갖고 있고, JS 는 -1~1 한 값(--px)만 넘긴다
function step() {
  now += (aim - now) * 0.12;
  frame.style.setProperty('--px', now.toFixed(3));
  if (Math.abs(aim - now) < 0.002) { frame.style.setProperty('--px', aim.toFixed(3)); running = false; return; }
  requestAnimationFrame(step);
}

function start() { if (!running) { running = true; requestAnimationFrame(step); } }

frame.addEventListener('pointermove', function (e) {
  tp.classList.remove('is-demo');
  var r = frame.getBoundingClientRect();
  aim = Math.max(-1, Math.min(1, (e.clientX - r.left) / r.width * 2 - 1));
  start();
});
frame.addEventListener('pointerleave', function () { aim = 0; start(); });
// 키보드 경로: 좌우 화살표로 같은 범위를 0.25씩 움직인다
frame.setAttribute('tabindex', '0');
frame.addEventListener('keydown', function (e) {
  var move = e.key === 'ArrowLeft' ? -0.25 : e.key === 'ArrowRight' ? 0.25 : 0;
  if (!move) { return; }
  e.preventDefault();
  tp.classList.remove('is-demo');
  aim = Math.max(-1, Math.min(1, aim + move));
  start();
});
</script>
</body>
</html>
