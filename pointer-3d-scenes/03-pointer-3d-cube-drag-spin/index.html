<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드래그로 돌리는 여섯 면 상자 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cb is-demo" id="cb">
  <div class="cb__scene" id="scene" role="img" aria-label="여섯 면에 분류가 적힌 상자, 끌어서 돌린다">
    <div class="cb__cube" id="cube">
      <div class="cb__face cb__face--f"><span>사진</span></div>
      <div class="cb__face cb__face--r"><span>영상</span></div>
      <div class="cb__face cb__face--b"><span>글</span></div>
      <div class="cb__face cb__face--l"><span>소리</span></div>
      <div class="cb__face cb__face--u"></div>
      <div class="cb__face cb__face--d"></div>
    </div>
  </div>
  <p class="cb__hint">끌어서 돌리고 놓으면 가까운 면에서 멈춥니다</p>
</div>
</main>
<script>
var cb = document.getElementById('cb');
var scene = document.getElementById('scene');
var cube = document.getElementById('cube');
var angle = 0, spin = 0, lastX = 0, dragging = false, running = false;

function paint() { cube.style.transform = 'rotateX(-12deg) rotateY(' + angle.toFixed(2) + 'deg)'; }

// 놓은 뒤에는 남은 속도로 더 돌다가(관성) 90도 눈금 중 가장 가까운 쪽으로 당겨져 멈춘다
function step() {
  if (dragging) { running = false; return; }
  var snap = Math.round(angle / 90) * 90;
  spin = spin * 0.92 + (snap - angle) * 0.08;
  angle += spin;
  paint();
  if (Math.abs(spin) < 0.05 && Math.abs(snap - angle) < 0.3) { angle = snap; paint(); running = false; return; }
  requestAnimationFrame(step);
}

function start() { if (!running) { running = true; requestAnimationFrame(step); } }

scene.addEventListener('pointerdown', function (e) {
  cb.classList.remove('is-demo');
  dragging = true; lastX = e.clientX; spin = 0;
  scene.setPointerCapture(e.pointerId);
});
scene.addEventListener('pointermove', function (e) {
  if (!dragging) { return; }
  var dx = e.clientX - lastX;
  lastX = e.clientX;
  spin = dx * 0.55;
  angle += spin;
  paint();
});
window.addEventListener('pointerup', function () { if (dragging) { dragging = false; start(); } });
// 키보드 경로: 좌우 화살표가 한 면씩(90도) 돌린다
scene.setAttribute('tabindex', '0');
scene.addEventListener('keydown', function (e) {
  var turn = e.key === 'ArrowLeft' ? -90 : e.key === 'ArrowRight' ? 90 : 0;
  if (!turn) { return; }
  e.preventDefault();
  cb.classList.remove('is-demo');
  angle = Math.round(angle / 90) * 90 + turn;
  paint();
});
</script>
</body>
</html>
