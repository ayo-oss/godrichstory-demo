<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>눈으로 커서를 쫓는 캐릭터 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ey is-demo" id="ey">
  <div class="ey__row" id="row" role="img" aria-label="고양이와 로봇이 눈동자로 커서를 따라보는 그림">
    <div class="ey__face ey__face--cat">
      <span class="ey__ear ey__ear--l" aria-hidden="true"></span>
      <span class="ey__ear ey__ear--r" aria-hidden="true"></span>
      <span class="ey__eye"><span class="ey__pupil"></span><span class="ey__lid" aria-hidden="true"></span></span>
      <span class="ey__eye"><span class="ey__pupil"></span><span class="ey__lid" aria-hidden="true"></span></span>
      <span class="ey__mouth" aria-hidden="true"></span>
    </div>
    <div class="ey__face ey__face--bot">
      <span class="ey__ant" aria-hidden="true"></span>
      <span class="ey__eye ey__eye--wide"><span class="ey__pupil ey__pupil--bar"></span><span class="ey__lid" aria-hidden="true"></span></span>
      <span class="ey__eye ey__eye--wide"><span class="ey__pupil ey__pupil--bar"></span><span class="ey__lid" aria-hidden="true"></span></span>
      <span class="ey__grill" aria-hidden="true"></span>
    </div>
  </div>
  <p class="ey__hint">마우스를 움직이면 눈이 따라옵니다</p>
</div>
</main>
<script>
var ey = document.getElementById('ey');
var row = document.getElementById('row');
var eyes = Array.prototype.slice.call(document.querySelectorAll('.ey__eye'));

// 눈마다 자기 중심에서 커서까지의 각도를 재고, 그 방향으로 눈동자를 반지름만큼만 내보낸다
function look(clientX, clientY) {
  for (var i = 0; i < eyes.length; i++) {
    var eye = eyes[i];
    var pupil = eye.firstElementChild;
    var r = eye.getBoundingClientRect();
    var angle = Math.atan2(clientY - (r.top + r.height / 2), clientX - (r.left + r.width / 2));
    var reach = Math.min(r.width, r.height) * 0.22;
    pupil.style.transform = 'translate(' + (Math.cos(angle) * reach).toFixed(1) + 'px, ' + (Math.sin(angle) * reach).toFixed(1) + 'px)';
  }
}

window.addEventListener('pointermove', function (e) {
  ey.classList.remove('is-demo');
  look(e.clientX, e.clientY);
});
// 키보드 경로: 화살표로 시선을 네 방향으로 보낸다 (포인터가 없어도 같은 각도를 본다)
row.setAttribute('tabindex', '0');
row.addEventListener('keydown', function (e) {
  var r = row.getBoundingClientRect();
  var spots = {
    ArrowLeft: [r.left - 60, r.top + r.height / 2],
    ArrowRight: [r.right + 60, r.top + r.height / 2],
    ArrowUp: [r.left + r.width / 2, r.top - 60],
    ArrowDown: [r.left + r.width / 2, r.bottom + 60]
  };
  var spot = spots[e.key];
  if (!spot) { return; }
  e.preventDefault();
  ey.classList.remove('is-demo');
  look(spot[0], spot[1]);
});
</script>
</body>
</html>
