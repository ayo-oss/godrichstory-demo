<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포인터가 없을 때의 자동 회전 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ar is-demo" id="ar">
  <div class="ar__scene" id="scene" role="img" aria-label="포인터가 없으면 스스로 도는 상자, 움직임 최소화 설정에서는 멈춘다">
    <div class="ar__prism ar__prism--auto" id="prism">
      <span class="ar__side ar__side--a"></span>
      <span class="ar__side ar__side--b"></span>
      <span class="ar__side ar__side--c"></span>
      <span class="ar__side ar__side--d"></span>
    </div>
  </div>
  <p class="ar__state" id="state">
    <span class="ar__mode ar__mode--auto">포인터 없음 · 스스로 회전</span>
    <span class="ar__mode ar__mode--hand">마우스를 따라 회전</span>
  </p>
</div>
</main>
<script>
var ar = document.getElementById('ar');
var scene = document.getElementById('scene');
var prism = document.getElementById('prism');
var state = document.getElementById('state');
var AUTO_LABEL = '포인터 없음 · 스스로 회전';
var HAND_LABEL = '마우스를 따라 회전';
// 포인터가 아예 없는 기기인지 먼저 묻는다 — 있으면 사람이 돌리고, 없으면 스스로 돈다
var fine = window.matchMedia('(hover: hover) and (pointer: fine)');

function handOver(deg) {
  ar.classList.remove('is-demo');
  prism.classList.remove('ar__prism--auto');
  prism.style.transform = 'rotateX(-10deg) rotateY(' + deg.toFixed(1) + 'deg)';
  state.textContent = HAND_LABEL;
}

function backToAuto() {
  prism.style.transform = '';
  prism.classList.add('ar__prism--auto');
  state.textContent = AUTO_LABEL;
}

if (fine.matches) {
  scene.addEventListener('pointermove', function (e) {
    var r = scene.getBoundingClientRect();
    handOver(Math.max(-1, Math.min(1, (e.clientX - r.left) / r.width * 2 - 1)) * 42);
  });
  scene.addEventListener('pointerleave', backToAuto);
}
// 키보드 경로: 좌우 화살표가 12도씩 돌리고, Escape 가 자동 회전으로 돌려놓는다
scene.setAttribute('tabindex', '0');
var keyDeg = 0;
scene.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { backToAuto(); return; }
  var turn = e.key === 'ArrowLeft' ? -12 : e.key === 'ArrowRight' ? 12 : 0;
  if (!turn) { return; }
  e.preventDefault();
  keyDeg = Math.max(-42, Math.min(42, keyDeg + turn));
  handOver(keyDeg);
});
</script>
</body>
</html>
