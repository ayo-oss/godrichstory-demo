<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holographic card — mouse tilt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <article class="holo-card is-demo" tabindex="0">
    <div class="holo-card__shine" aria-hidden="true"></div>
    <div class="holo-card__body">
      <span class="holo-card__badge">Phiên bản giới hạn</span>
      <h3 class="holo-card__title">Midnight Aurora</h3>
    </div>
  </article>
</main>
<script>
var c=document.querySelector('.holo-card');
c.addEventListener('pointermove',function(e){
  if(c.classList.contains('is-demo'))return;
  var r=c.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*100,my=(e.clientY-r.top)/r.height*100;
  c.style.setProperty('--mx',mx+'%');c.style.setProperty('--my',my+'%');
  c.style.setProperty('--rx',((my/100)-.5)*-14+'deg');c.style.setProperty('--ry',((mx/100)-.5)*14+'deg');
});
c.addEventListener('pointerleave',function(){
  if(c.classList.contains('is-demo'))return;
  c.style.setProperty('--mx','50%');c.style.setProperty('--my','50%');
  c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg');
});
</script>
</body>
</html>
