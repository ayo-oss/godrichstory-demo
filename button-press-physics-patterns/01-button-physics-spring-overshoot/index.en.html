<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Press-value overshoot — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bso is-demo" id="bso">
  <button class="bso__btn" id="bsoBtn" type="button">Submit</button>
  <p class="bso__val"><span>Depth value</span><b id="bsoVal">0.0px</b></p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('bso');
  var btn = document.getElementById('bsoBtn');
  var val = document.getElementById('bsoVal');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 계산 겹: 스프링-감쇠 방정식 accel = -(K/MASS)*(depth-target) - (C/MASS)*vel.
  // 목표 값을 지나쳤다가 되돌아오는 오버슈트는 감쇠비(zeta = C/(2*sqrt(K*MASS)))가
  // 1보다 작은 저감쇠(underdamped) 상태라 생긴다 — zeta 를 낮출수록 반동 폭이 커진다.
  var K = 300, C = 7, MASS = 1, PRESS_DEPTH = 14;
  var depth = 0, vel = 0, target = 0, last = 0, raf = null;

  function paint() {
    var scale = 1 - depth / 340;
    btn.style.transform = 'translateY(' + depth.toFixed(2) + 'px) scale(' + scale.toFixed(4) + ')';
    val.textContent = depth.toFixed(1) + 'px';
  }
  function tick(now) {
    var dt = Math.min((now - last) / 1000, 0.032);
    last = now;
    var accel = (-K * (depth - target) - C * vel) / MASS;
    vel += accel * dt;
    depth += vel * dt;
    paint();
    raf = requestAnimationFrame(tick);
  }
  function start() {
    if (raf === null) { last = performance.now(); raf = requestAnimationFrame(tick); }
  }
  function press(p) {
    if (reduce) { depth = p; vel = 0; target = p; paint(); return; }
    target = p;
    start();
  }

  function wireReal() {
    btn.addEventListener('pointerdown', function () { root.classList.remove('is-demo'); stopAutoplay(); press(PRESS_DEPTH); });
    window.addEventListener('pointerup', function () { press(0); });
    btn.addEventListener('pointercancel', function () { press(0); });
  }
  wireReal();
  paint();

  // 자동 루프: 누름 350ms 뒤 뗌으로 같은 press() 스프링 경로를 반복 재현한다.
  var autoTimer = null, autoDown = null;
  function autoTick() { press(PRESS_DEPTH); autoDown = setTimeout(function () { press(0); }, 350); }
  function stopAutoplay() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    if (autoDown) { clearTimeout(autoDown); autoDown = null; }
  }
  if (!reduce) { autoTick(); autoTimer = setInterval(autoTick, 1500); }
})();
</script>
</body>
</html>
