<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mass-value press-speed difference — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bwm is-demo" id="bwm">
  <div class="bwm__row">
    <button class="bwm__btn" id="bwmLight" data-mass="light" type="button">Light</button>
    <button class="bwm__btn" id="bwmMedium" data-mass="medium" type="button">Medium</button>
    <button class="bwm__btn" id="bwmHeavy" data-mass="heavy" type="button">Heavy</button>
  </div>
  <p class="bwm__hint">Press each one — the larger the preset mass value, the slower it moves</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('bwm');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 계산 겹: 세 버튼은 같은 스프링 상수 K·감쇠 C 를 쓰지만 질량 값(MASS)이 다르다.
  // accel = -(K/MASS)*(depth-target) - (C/MASS)*vel — MASS 가 클수록 같은 힘에서 가속도가
  // 작아져(뉴턴 F=ma) 눌리고 돌아오는 속도가 함께 느려진다.
  var K = 320, C = 8, PRESS_DEPTH = 12;
  var MASS = { light: 0.5, medium: 1.4, heavy: 3.6 };

  function makeBtn(el, key) {
    return { el: el, mass: MASS[key], depth: 0, vel: 0, target: 0 };
  }
  var items = [
    makeBtn(document.getElementById('bwmLight'), 'light'),
    makeBtn(document.getElementById('bwmMedium'), 'medium'),
    makeBtn(document.getElementById('bwmHeavy'), 'heavy')
  ];
  var last = 0, raf = null;

  function paint(it) { it.el.style.transform = 'translateY(' + it.depth.toFixed(2) + 'px)'; }
  function tick(now) {
    var dt = Math.min((now - last) / 1000, 0.032);
    last = now;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var accel = (-K * (it.depth - it.target) - C * it.vel) / it.mass;
      it.vel += accel * dt;
      it.depth += it.vel * dt;
      paint(it);
    }
    raf = requestAnimationFrame(tick);
  }
  function start() { if (raf === null) { last = performance.now(); raf = requestAnimationFrame(tick); } }
  function press(it, p) {
    if (reduce) { it.depth = p; it.vel = 0; it.target = p; paint(it); return; }
    it.target = p;
    start();
  }

  function wireReal() {
    items.forEach(function (it) {
      it.el.addEventListener('pointerdown', function () { root.classList.remove('is-demo'); stopAutoplay(); press(it, PRESS_DEPTH); });
      it.el.addEventListener('pointerup', function () { press(it, 0); });
      it.el.addEventListener('pointercancel', function () { press(it, 0); });
    });
  }
  wireReal();
  items.forEach(paint);

  // 자동 루프: 세 버튼을 동시에 눌렀다 동시에 떼어, 같은 힘에서 질량별 속도 차이를 나란히 보여준다.
  var autoTimer = null, autoDown = null;
  function autoTick() {
    items.forEach(function (it) { press(it, PRESS_DEPTH); });
    autoDown = setTimeout(function () { items.forEach(function (it) { press(it, 0); }); }, 300);
  }
  function stopAutoplay() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    if (autoDown) { clearTimeout(autoDown); autoDown = null; }
  }
  if (!reduce) { autoTick(); autoTimer = setInterval(autoTick, 1700); }
})();
</script>
</body>
</html>
