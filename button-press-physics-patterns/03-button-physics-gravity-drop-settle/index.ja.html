<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>落下値反発定着 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bgd is-demo" id="bgd">
  <div class="bgd__field" id="bgdField">
    <button class="bgd__chip" id="bgdChip" type="button">通知 3</button>
    <span class="bgd__floor" aria-hidden="true"></span>
  </div>
  <button class="bgd__drop" id="bgdDrop" type="button">もう一度落とす</button>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('bgd');
  var field = document.getElementById('bgdField');
  var chip = document.getElementById('bgdChip');
  var dropBtn = document.getElementById('bgdDrop');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 계산 겹: vel += GRAVITY*dt, y += vel*dt 로 낙하시키다 바닥 값(FLOOR)에 닿으면
  // vel 을 -RESTITUTION 배로 뒤집어 반동시킨다. |반동 속도| 가 STOP_VEL 아래로 줄면 정착.
  var GRAVITY = 2200, RESTITUTION = 0.52, STOP_VEL = 40, CHIP_H = 34;
  var y = 0, vel = 0, last = 0, raf = null, running = false;

  function floorY() { return field.clientHeight - CHIP_H; }
  function paint() { chip.style.transform = 'translateY(' + y.toFixed(1) + 'px)'; }
  function tick(now) {
    var dt = Math.min((now - last) / 1000, 0.032);
    last = now;
    vel += GRAVITY * dt;
    y += vel * dt;
    var floor = floorY();
    if (y >= floor) {
      y = floor;
      vel = -vel * RESTITUTION;
      if (Math.abs(vel) < STOP_VEL) { vel = 0; paint(); running = false; return; }
    }
    paint();
    raf = requestAnimationFrame(tick);
  }
  function drop() {
    if (reduce) { y = floorY(); vel = 0; paint(); return; }
    y = 0; vel = 0; last = performance.now();
    if (!running) { running = true; raf = requestAnimationFrame(tick); }
  }

  function wireReal() {
    dropBtn.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); drop(); });
    chip.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); drop(); });
  }
  wireReal();
  y = floorY(); paint();

  // 자동 루프: 같은 drop() 을 주기적으로 다시 불러 낙하-반동 경로를 반복 재현한다.
  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  if (!reduce) { drop(); autoTimer = setInterval(drop, 1600); }
})();
</script>
</body>
</html>
