<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>引っ張り距離値伸び — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="brs is-demo" id="brs">
  <div class="brs__field" id="brsField">
    <span class="brs__anchor" aria-hidden="true"></span>
    <button class="brs__btn" id="brsBtn" type="button">引っ張ってみる</button>
  </div>
  <p class="brs__hint">離れた距離の値の分だけ伸び、離すと元に戻ります</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('brs');
  var field = document.getElementById('brsField');
  var btn = document.getElementById('brsBtn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 계산 겹: 당긴 거리 값(dist)이 커질수록 늘어난 배율(stretch)도 커지되, 저항 상수
  // PULL_RESISTANCE 로 나눈 뒤 1-exp(-x) 를 씌워 거리가 커질수록 증가폭이 줄어드는
  // (당길수록 뻑뻑해지는) 고무줄 저항 곡선을 만든다. 놓으면 스프링(K·C)이 1로 되돌린다.
  var PULL_RESISTANCE = 130, MAX_STRETCH = 0.9, K = 260, C = 8;
  var dist = 0, stretch = 1, vel = 0, target = 1, dragging = false, startX = 0, raf = null, last = 0;

  function stretchFromDist(d) {
    var n = Math.max(0, d) / PULL_RESISTANCE;
    return 1 + MAX_STRETCH * (1 - Math.exp(-n));
  }
  function paint() { btn.style.transform = 'scaleX(' + stretch.toFixed(3) + ')'; }
  function springTick(now) {
    var dt = Math.min((now - last) / 1000, 0.032);
    last = now;
    var accel = -K * (stretch - target) - C * vel;
    vel += accel * dt;
    stretch += vel * dt;
    paint();
    if (Math.abs(stretch - target) < 0.002 && Math.abs(vel) < 0.01) { stretch = target; vel = 0; paint(); raf = null; return; }
    raf = requestAnimationFrame(springTick);
  }
  function startSpring() { if (raf === null) { last = performance.now(); raf = requestAnimationFrame(springTick); } }

  function onDown(clientX) {
    dragging = true; startX = clientX;
    if (raf !== null) { cancelAnimationFrame(raf); raf = null; }
  }
  function onMove(clientX) {
    if (!dragging) { return; }
    dist = clientX - startX;
    stretch = stretchFromDist(dist);
    vel = 0;
    paint();
  }
  function onUp() {
    if (!dragging) { return; }
    dragging = false;
    target = 1;
    if (reduce) { stretch = 1; paint(); return; }
    startSpring();
  }

  function wireReal() {
    btn.addEventListener('pointerdown', function (e) { root.classList.remove('is-demo'); stopAutoplay(); onDown(e.clientX); });
    window.addEventListener('pointermove', function (e) { onMove(e.clientX); });
    window.addEventListener('pointerup', onUp);
  }
  wireReal();
  paint();

  // 자동 루프: 실제 드래그 대신 dist 값을 단계적으로 키웠다 놓아 같은 저항·스프링 경로를 탄다.
  var autoTimer = null, autoDist = 0, growing = true;
  function autoTick() {
    if (growing) {
      autoDist += 26;
      stretch = stretchFromDist(autoDist);
      paint();
      if (autoDist >= 170) { growing = false; target = 1; startSpring(); }
    } else {
      growing = true; autoDist = 0;
    }
  }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  if (!reduce) { autoTimer = setInterval(autoTick, 200); }
})();
</script>
</body>
</html>
