<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>따라오는 값의 지연 보간 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bil is-demo" id="bil">
  <div class="bil__field" id="bilField" role="application" aria-label="플로팅 버튼 드래그 실험판">
    <button class="bil__fab" id="bilFab" type="button" aria-label="플로팅 액션 버튼">+</button>
  </div>
  <p class="bil__hint">눌러서 옮기면 값이 뒤따라옵니다</p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('bil');
  var field = document.getElementById('bilField');
  var fab = document.getElementById('bilFab');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 계산 겹: 포인터 위치 값(targetX/Y)과 버튼 위치 값(x/y)의 차이를 매 프레임 LERP_RATIO
  // 만큼만 좁힌다 — x += (targetX-x)*LERP_RATIO. 비율이 1에 가까울수록 즉시 따라붙고,
  // 낮을수록 지연(트레일)이 길어진다.
  var LERP_RATIO = 0.14;
  var FAB_R = 26;
  var x = 0, y = 0, targetX = 0, targetY = 0, raf = null;

  function bounds() { return { w: field.clientWidth, h: field.clientHeight }; }
  function clampPos(px, py) {
    var b = bounds();
    return [Math.max(FAB_R, Math.min(b.w - FAB_R, px)), Math.max(FAB_R, Math.min(b.h - FAB_R, py))];
  }
  function paint() { fab.style.transform = 'translate(' + (x - FAB_R).toFixed(1) + 'px,' + (y - FAB_R).toFixed(1) + 'px)'; }
  function tick() {
    x += (targetX - x) * LERP_RATIO;
    y += (targetY - y) * LERP_RATIO;
    paint();
    raf = requestAnimationFrame(tick);
  }
  function start() { if (raf === null) { raf = requestAnimationFrame(tick); } }
  function setTarget(px, py) {
    var c = clampPos(px, py);
    targetX = c[0]; targetY = c[1];
    if (reduce) { x = targetX; y = targetY; paint(); return; }
    start();
  }

  function wireReal() {
    var dragging = false;
    fab.addEventListener('pointerdown', function (e) {
      root.classList.remove('is-demo'); stopAutoplay(); dragging = true;
      fab.setPointerCapture(e.pointerId);
    });
    fab.addEventListener('pointermove', function (e) {
      if (!dragging) { return; }
      var r = field.getBoundingClientRect();
      setTarget(e.clientX - r.left, e.clientY - r.top);
    });
    fab.addEventListener('pointerup', function () { dragging = false; });
  }
  wireReal();
  var b0 = bounds();
  x = targetX = b0.w / 2; y = targetY = b0.h / 2;
  paint();

  // 자동 루프: 목표 값을 좌우로 오가게 옮겨 같은 lerp 경로를 반복 재현한다.
  var autoTimer = null, phase = 0;
  function autoTick() {
    var b = bounds();
    phase += 1;
    var px = b.w / 2 + Math.sin(phase * 0.9) * (b.w / 2 - FAB_R - 6);
    var py = b.h / 2 + Math.cos(phase * 0.6) * (b.h / 2 - FAB_R - 6) * 0.5;
    setTarget(px, py);
  }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  if (!reduce) { autoTimer = setInterval(autoTick, 260); autoTick(); }
})();
</script>
</body>
</html>
