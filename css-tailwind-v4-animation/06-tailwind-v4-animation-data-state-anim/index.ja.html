<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>data-state 기반 애니메이션 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="acc">
    <button class="acc__trigger" type="button" aria-expanded="false">配送案内</button>
    <div class="acc__panel is-demo" data-state="closed">
      <p>決済後1〜2日で出荷され、離島・山間部はさらに1日かかります。</p>
    </div>
  </div>
</main>
<script>
// data-state 를 토글하는 최소 로직. CSS 가 [data-state=open] 을 보고 움직인다.
var t = document.querySelector('.acc__trigger');
var p = document.querySelector('.acc__panel');
function toggle() {
  var open = p.getAttribute('data-state') === 'open';
  p.setAttribute('data-state', open ? 'closed' : 'open');
  t.setAttribute('aria-expanded', String(!open));
}
t.addEventListener('click', toggle); // 실사용: 클릭마다 data-state 토글 (데모 루프는 .is-demo 키프레임)
</script>
</body>
</html>
