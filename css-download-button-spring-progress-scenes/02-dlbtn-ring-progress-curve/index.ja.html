<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>進捗カーブで満ちていく枠のリング — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rg is-demo" id="rgRoot">
  <div class="rg__wrap" id="rgBar" role="progressbar" aria-labelledby="rgLabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0%">
    <svg class="rg__svg" viewBox="0 0 232 96" aria-hidden="true">
      <rect class="rg__ghost" id="rgGhost" x="11" y="11" width="210" height="74" pathLength="100"/>
      <rect class="rg__ring" id="rgRing" x="3" y="3" width="226" height="90" pathLength="100"/>
    </svg>
    <button class="rg__btn" id="rgBtn" type="button"><span id="rgLabel">ダウンロード</span><b id="rgPct">0%</b></button>
  </div>
  <p class="rg__meta"><span class="rg__tag">POW</span> <b id="rgPow">2</b> <span class="rg__tag">LEAD</span> <b id="rgLead">0</b></p>
</div>
</main>
<script>
(function () {
  // 기법: 진행률을 시간에 비례시키지 않고 곡선 p = 1 - (1 - u)^CURVE_POW 로 계산한다 (u 는 시간 비율).
  // 굵은 링 = 곡선 진행률, 가는 안쪽 링 = 같은 시간의 균일 진행률. 둘의 차이(LEAD)가 곡선이 앞서는 만큼이다.
  var CURVE_POW = 2;
  var RING_R = 16;
  var RUN_MS = 1400;
  var START_MS = 200;
  var CYCLE_MS = 2000;

  var root = document.getElementById('rgRoot');
  var bar = document.getElementById('rgBar');
  var btn = document.getElementById('rgBtn');
  var ring = document.getElementById('rgRing');
  var ghost = document.getElementById('rgGhost');
  var labelEl = document.getElementById('rgLabel');
  var pctEl = document.getElementById('rgPct');
  var powEl = document.getElementById('rgPow');
  var leadEl = document.getElementById('rgLead');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var clock = 0;
  var runStart = null;
  var t0 = null;
  var lastTs = null;

  function ringCurve(u) { return 1 - Math.pow(1 - u, CURVE_POW); }
  function stopDemo() { root.classList.remove('is-demo'); }

  ring.setAttribute('rx', String(RING_R));
  ghost.setAttribute('rx', String(RING_R - 6));
  powEl.textContent = String(CURVE_POW);

  function startOf(now) {
    if (root.classList.contains('is-demo')) {
      return now < START_MS ? null : START_MS + Math.floor((now - START_MS) / CYCLE_MS) * CYCLE_MS;
    }
    return runStart === 'done' ? null : runStart;
  }

  function render(now) {
    var s = startOf(now);
    var u = s === null ? 0 : Math.max(0, Math.min(1, (now - s) / RUN_MS));
    if (reduce && runStart === 'done') u = 1;
    var p = ringCurve(u);
    var pct = Math.round(p * 100);
    ring.style.strokeDashoffset = String((100 - p * 100).toFixed(2));
    ghost.style.strokeDashoffset = String((100 - u * 100).toFixed(2));
    ring.style.opacity = p < 0.004 ? '0' : '1';
    ghost.style.opacity = u < 0.004 ? '0' : '1';
    btn.style.setProperty('--f', p.toFixed(3));
    pctEl.textContent = pct + '%';
    leadEl.textContent = String(Math.round((p - u) * 100));
    labelEl.textContent = u >= 1 ? '完了' : (u > 0 ? '受信中' : 'ダウンロード');
    bar.setAttribute('aria-valuenow', String(pct));
    bar.setAttribute('aria-valuetext', pct + '%');
  }

  function activate() {
    stopDemo();
    if (reduce) { runStart = 'done'; render(clock); return; }
    if (runStart !== null && runStart !== 'done' && clock - runStart < RUN_MS) return;
    runStart = clock;
  }
  btn.addEventListener('click', activate);

  function tick(ts) {
    if (t0 === null) t0 = ts;
    clock = ts - t0;
    lastTs = ts;
    render(clock);
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    render(0);
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
