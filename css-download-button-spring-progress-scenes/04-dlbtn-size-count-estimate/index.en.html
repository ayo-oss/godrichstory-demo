<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Chip That Counts Up the Received Size — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sz is-demo" id="szRoot">
  <button class="sz__btn" id="szBtn" type="button"><span id="szLabel">Download</span></button>
  <div class="sz__chips">
    <p class="sz__chip"><span class="sz__tag">MB</span> <b id="szGot">0.0</b><span class="sz__of">/ 48</span></p>
    <p class="sz__chip"><span class="sz__tag">ETA</span> <b id="szEta">--:--</b></p>
  </div>
  <p class="sz__sr" id="szStatus" role="status"></p>
</div>
</main>
<script>
(function () {
  // 기법: 받은 크기 = TARGET_MB x (1 - (1 - u)^COUNT_EASE) 로 감속하며 올라간다 (u 는 시간 비율).
  // 남은 시간 = 남은 양 / 지금까지의 평균 속도. 평균 속도가 시간에 따라 변하므로 ETA 는 시작 때 가장 크고 끝에서 0 이 된다.
  var TARGET_MB = 48;
  var ETA_MIN = 2;
  var COUNT_EASE = 3;
  var RUN_MS = 1500;
  var START_MS = 200;
  var CYCLE_MS = 2000;

  var root = document.getElementById('szRoot');
  var btn = document.getElementById('szBtn');
  var labelEl = document.getElementById('szLabel');
  var gotEl = document.getElementById('szGot');
  var etaEl = document.getElementById('szEta');
  var statusEl = document.getElementById('szStatus');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var clock = 0;
  var runStart = null;
  var finished = false;
  var announced = false;
  var t0 = null;

  function stopDemo() { root.classList.remove('is-demo'); }
  function two(n) { return n < 10 ? '0' + n : String(n); }

  function startOf(now) {
    if (root.classList.contains('is-demo')) {
      return now < START_MS ? null : START_MS + Math.floor((now - START_MS) / CYCLE_MS) * CYCLE_MS;
    }
    return runStart;
  }

  function render(now) {
    var s = startOf(now);
    var u = s === null ? 0 : Math.max(0, Math.min(1, (now - s) / RUN_MS));
    if (reduce && finished) u = 1;
    var got = TARGET_MB * (1 - Math.pow(1 - u, COUNT_EASE));
    var eta = '--:--';
    if (u > 0) {
      var elapsedSec = Math.max(u, 0.004) * ETA_MIN * 60;
      var avg = Math.max(got, 0.01) / elapsedSec;
      var left = Math.round((TARGET_MB - got) / avg);
      eta = Math.floor(left / 60) + ':' + two(left % 60);
    }
    root.style.setProperty('--f', (got / TARGET_MB).toFixed(3));
    gotEl.textContent = got.toFixed(1);
    etaEl.textContent = eta;
    labelEl.textContent = u >= 1 ? 'Done' : (u > 0 ? 'Receiving' : 'Download');
    if (u >= 1 && !announced) { announced = true; statusEl.textContent = 'Download complete'; }
    if (u < 1 && announced) { announced = false; statusEl.textContent = ''; }
  }

  function activate() {
    stopDemo();
    if (reduce) { finished = true; render(clock); return; }
    if (runStart !== null && clock - runStart < RUN_MS) return;
    runStart = clock;
  }
  btn.addEventListener('click', activate);

  function tick(ts) {
    if (t0 === null) t0 = ts;
    clock = ts - t0;
    render(clock);
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    render(0);
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
