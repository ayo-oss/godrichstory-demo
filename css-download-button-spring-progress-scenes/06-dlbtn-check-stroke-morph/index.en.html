<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Finish Where the Arrow Becomes a Check by Stroke Length — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ck is-demo" id="ckRoot">
  <button class="ck__btn" id="ckBtn" type="button">
    <svg class="ck__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path id="ckArrow" d="M12 4v11M6.5 10.5 12 16l5.5-5.5"/>
      <path id="ckCheck" d="M5 13l4.5 4.5L19 7"/>
    </svg>
    <span class="ck__label" id="ckLabel">Download</span>
  </button>
  <span class="ck__ruler" id="ckRulerA" aria-hidden="true">Download</span>
  <span class="ck__ruler" id="ckRulerB" aria-hidden="true">Done</span>
  <p class="ck__meta"><span class="ck__tag">P</span> <b id="ckP">0.00</b> <span class="ck__tag">W</span> <b id="ckW">0</b></p>
  <p class="ck__sr" id="ckStatus" role="status"></p>
</div>
</main>
<script>
(function () {
  // 기법: 화살표와 체크 두 경로의 stroke-dashoffset 을 같은 진행값 p 에서 계산한다.
  // p 0 to 0.5 에서 화살표 선이 줄어들고, p 0.4 to 1 에서 체크 선이 그어진다. 버튼 폭은 라벨 실측 너비로 지수 보간한다.
  var STROKE_LEN = 100;
  var CHECK_MS = 360;
  var WIDTH_LERP = 10;
  var PAD_X = 24;
  var ICON_GAP = 16;
  var ICON_W = 36;
  var START_MS = 200;
  var HOLD_MS = 1300;
  var CYCLE_MS = 2000;

  var root = document.getElementById('ckRoot');
  var btn = document.getElementById('ckBtn');
  var arrow = document.getElementById('ckArrow');
  var check = document.getElementById('ckCheck');
  var label = document.getElementById('ckLabel');
  var rulerA = document.getElementById('ckRulerA');
  var rulerB = document.getElementById('ckRulerB');
  var pEl = document.getElementById('ckP');
  var wEl = document.getElementById('ckW');
  var statusEl = document.getElementById('ckStatus');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var p = 0;
  var width = 0;
  var done = false;
  var announced = false;
  var t0 = null;
  var lastTs = null;

  arrow.setAttribute('pathLength', String(STROKE_LEN));
  check.setAttribute('pathLength', String(STROKE_LEN));
  arrow.style.strokeDasharray = STROKE_LEN + ' ' + STROKE_LEN;
  check.style.strokeDasharray = STROKE_LEN + ' ' + STROKE_LEN;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function stopDemo() { root.classList.remove('is-demo'); }
  function widthFor(isDone) { return 2 * PAD_X + ICON_W + ICON_GAP + (isDone ? rulerB : rulerA).offsetWidth; }

  function goal(now) {
    if (root.classList.contains('is-demo')) {
      return now >= START_MS && (now - START_MS) % CYCLE_MS < HOLD_MS;
    }
    return done;
  }

  function render(want) {
    var shrink = clamp(p / 0.5, 0, 1);
    var draw = clamp((p - 0.4) / 0.6, 0, 1);
    arrow.style.strokeDashoffset = String((STROKE_LEN * shrink).toFixed(2));
    check.style.strokeDashoffset = String((STROKE_LEN * (1 - draw)).toFixed(2));
    label.textContent = p >= 0.5 ? 'Done' : 'Download';
    label.style.opacity = String(Math.abs(2 * p - 1).toFixed(2));
    btn.style.setProperty('--p', p.toFixed(3));
    btn.style.width = width.toFixed(1) + 'px';
    pEl.textContent = p.toFixed(2);
    wEl.textContent = String(Math.round(width));
    if (p >= 1 && !announced) { announced = true; statusEl.textContent = 'Download complete'; }
    if (p <= 0 && announced) { announced = false; statusEl.textContent = ''; }
  }

  function toggle() {
    stopDemo();
    done = !done;
    if (reduce) { p = done ? 1 : 0; width = widthFor(done); render(done); }
  }
  btn.addEventListener('click', toggle);

  function tick(ts) {
    if (t0 === null) t0 = ts;
    var now = ts - t0;
    var dt = lastTs === null ? 0.016 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    var want = goal(now);
    var step = dt / (CHECK_MS / 1000);
    p = clamp(p + (want ? step : -step), 0, 1);
    width += (widthFor(want) - width) * (1 - Math.exp(-dt * WIDTH_LERP));
    render(want);
    requestAnimationFrame(tick);
  }

  width = widthFor(false);
  if (reduce) {
    stopDemo();
    render(false);
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
