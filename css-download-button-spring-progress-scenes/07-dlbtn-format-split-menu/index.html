<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>형식을 고르는 분리 버튼 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sp is-demo" id="spRoot">
  <div class="sp__row">
    <button class="sp__main" id="spMain" type="button">
      <span class="sp__win" aria-hidden="true"><span class="sp__fmt" id="spOld"></span><span class="sp__fmt" id="spNew">PDF</span></span>
      <span class="sp__sr" id="spFmtText">PDF</span>
      <span>내려받기</span>
    </button>
    <button class="sp__toggle" id="spToggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="spMenu" aria-label="형식 선택">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
    </button>
  </div>
  <div class="sp__menu" id="spMenu" role="menu" aria-label="형식 선택">
    <button class="sp__item" type="button" role="menuitem" data-i="0">PDF</button>
    <button class="sp__item" type="button" role="menuitem" data-i="1">PNG</button>
    <button class="sp__item" type="button" role="menuitem" data-i="2">SVG</button>
  </div>
</div>
</main>
<script>
(function () {
  // 기법: 메뉴 칸마다 시작 시각을 MENU_STAGGER 씩 늦춰 easeOutBack 으로 펼친다 (칸마다 따로 계산한 진행값).
  // 고른 형식은 라벨 창 안에서 옛 글자가 위로 나가고 새 글자가 LABEL_RISE 만큼 아래에서 올라온다.
  var MENU_STAGGER = 70;
  var FORMATS = ['PDF', 'PNG', 'SVG'];
  var LABEL_RISE = 24;
  var ITEM_MS = 280;
  var OPEN_MS = ITEM_MS + (FORMATS.length - 1) * MENU_STAGGER;
  var RISE_MS = 320;
  var START_MS = 200;
  var CYCLE_MS = 2000;

  var root = document.getElementById('spRoot');
  var toggle = document.getElementById('spToggle');
  var menu = document.getElementById('spMenu');
  var oldEl = document.getElementById('spOld');
  var newEl = document.getElementById('spNew');
  var textEl = document.getElementById('spFmtText');
  var items = Array.prototype.slice.call(menu.querySelectorAll('.sp__item'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var wantOpen = false;
  var wantFmt = 0;
  var shownFmt = 0;
  var open = 0;
  var rise = 1;
  var t0 = null;
  var lastTs = null;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function stopDemo() { root.classList.remove('is-demo'); }
  function outBack(t) { var c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  function outCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function render() {
    var s = open * OPEN_MS;
    var visible = open > 0.001 || wantOpen;
    for (var i = 0; i < items.length; i += 1) {
      var q = outBack(clamp((s - i * MENU_STAGGER) / ITEM_MS, 0, 1));
      var o = clamp(q, 0, 1);
      items[i].style.opacity = o.toFixed(3);
      items[i].style.transform = 'translateY(' + ((1 - q) * -16).toFixed(2) + 'px) scale(' + (0.8 + 0.2 * q).toFixed(3) + ')';
      items[i].style.visibility = visible ? 'visible' : 'hidden';
      items[i].setAttribute('tabindex', wantOpen ? '0' : '-1');
      items[i].classList.toggle('is-picked', i === wantFmt);
    }
    menu.setAttribute('aria-hidden', wantOpen ? 'false' : 'true');
    toggle.setAttribute('aria-expanded', wantOpen ? 'true' : 'false');
    toggle.style.setProperty('--o', open.toFixed(3));
    root.style.setProperty('--k', (1 - rise).toFixed(3));
    oldEl.style.transform = 'translateY(' + (-LABEL_RISE * outCubic(rise)).toFixed(2) + 'px)';
    newEl.style.transform = 'translateY(' + (LABEL_RISE * (1 - outBack(rise))).toFixed(2) + 'px)';
    oldEl.style.opacity = String((1 - rise).toFixed(2));
    textEl.textContent = FORMATS[wantFmt];
  }

  function pick(i) {
    if (i === wantFmt) return;
    oldEl.textContent = FORMATS[shownFmt === wantFmt ? wantFmt : shownFmt];
    wantFmt = i;
    shownFmt = i;
    newEl.textContent = FORMATS[i];
    rise = reduce ? 1 : 0;
  }
  function setOpen(v) {
    wantOpen = v;
    if (reduce) open = v ? 1 : 0;
  }

  toggle.addEventListener('click', function () {
    stopDemo();
    setOpen(!wantOpen);
    render();
    if (wantOpen) items[wantFmt].focus({ preventScroll: true });
  });
  toggle.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' && !wantOpen) { e.preventDefault(); stopDemo(); setOpen(true); render(); items[wantFmt].focus({ preventScroll: true }); }
  });
  items.forEach(function (it, i) {
    it.addEventListener('click', function () { stopDemo(); pick(i); setOpen(false); render(); toggle.focus({ preventScroll: true }); });
    it.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus({ preventScroll: true }); }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + items.length - 1) % items.length].focus({ preventScroll: true }); }
      if (e.key === 'Escape') { e.preventDefault(); setOpen(false); render(); toggle.focus({ preventScroll: true }); }
    });
  });

  function tick(ts) {
    if (t0 === null) t0 = ts;
    var now = ts - t0;
    var dt = lastTs === null ? 0.016 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if (root.classList.contains('is-demo') && now >= START_MS) {
      var ph = (now - START_MS) % CYCLE_MS;
      wantOpen = ph < 800;
      var f = ph >= 600 && ph < 1700 ? 2 : 0;
      if (f !== wantFmt) pick(f);
    }
    open = clamp(open + (wantOpen ? 1 : -1) * dt * 1000 / OPEN_MS, 0, 1);
    rise = clamp(rise + dt * 1000 / RISE_MS, 0, 1);
    render();
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    render();
  } else {
    render();
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
