<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>進捗に合わせて上がる液面 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lq is-demo" id="lqRoot">
  <button class="lq__btn" id="lqBtn" type="button">
    <svg class="lq__wave" viewBox="0 0 240 72" preserveAspectRatio="none" aria-hidden="true"><path id="lqPath" d="M0 72H240V72Z"/></svg>
    <span class="lq__text"><span id="lqLabel">ダウンロード</span> <b id="lqPct">0%</b></span>
  </button>
  <p class="lq__meta"><span class="lq__tag">LEVEL</span> <b id="lqLevel">0.00</b> <span class="lq__tag">AMP</span> <b id="lqAmp">0.0</b></p>
</div>
</main>
<script>
(function () {
  // 기법: 수위는 목표 진행률을 향해 지수 보간(LEVEL_LERP)으로 따라가고, 수면은 사인 두 개를 합성한 곡선이다.
  // 파동 진폭에 (1 - 0.7 x 수위) 를 곱해서 물이 찰수록 수면이 가라앉는다.
  var WAVE_AMP = 6;
  var WAVE_FREQ = 2;
  var LEVEL_LERP = 6;
  var RUN_MS = 1500;
  var START_MS = 200;
  var CYCLE_MS = 2000;
  var W = 240;
  var H = 72;
  var POINTS = 48;

  var root = document.getElementById('lqRoot');
  var btn = document.getElementById('lqBtn');
  var pathEl = document.getElementById('lqPath');
  var labelEl = document.getElementById('lqLabel');
  var pctEl = document.getElementById('lqPct');
  var levelEl = document.getElementById('lqLevel');
  var ampEl = document.getElementById('lqAmp');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var clock = 0;
  var runStart = null;
  var level = 0;
  var target = 0;
  var t0 = null;
  var lastTs = null;

  function stopDemo() { root.classList.remove('is-demo'); }

  function progressAt(now) {
    var s = root.classList.contains('is-demo')
      ? (now < START_MS ? null : START_MS + Math.floor((now - START_MS) / CYCLE_MS) * CYCLE_MS)
      : runStart;
    return s === null ? 0 : Math.max(0, Math.min(1, (now - s) / RUN_MS));
  }

  function draw(phase) {
    var reach = WAVE_AMP * 1.5;
    var base = -reach + (H + 2 * reach) * (1 - level);
    var amp = WAVE_AMP * (1 - 0.7 * level);
    var d = 'M0 ' + H;
    for (var i = 0; i <= POINTS; i += 1) {
      var x = (i / POINTS) * W;
      var a = 2 * Math.PI * WAVE_FREQ * (x / W);
      var y = base + amp * (Math.sin(a + phase) + 0.5 * Math.sin(2 * a - 1.3 * phase));
      d += 'L' + x.toFixed(1) + ' ' + y.toFixed(2);
    }
    d += 'L' + W + ' ' + H + 'Z';
    pathEl.setAttribute('d', d);
    var pct = Math.round(level * 100);
    pctEl.textContent = pct + '%';
    labelEl.textContent = level > 0.995 ? '完了' : (level > 0.01 ? '受信中' : 'ダウンロード');
    levelEl.textContent = level.toFixed(2);
    ampEl.textContent = amp.toFixed(1);
  }

  function activate() {
    stopDemo();
    if (reduce) { level = 1; draw(0); return; }
    if (runStart !== null && clock - runStart < RUN_MS) return;
    runStart = clock;
  }
  btn.addEventListener('click', activate);

  function tick(ts) {
    if (t0 === null) t0 = ts;
    clock = ts - t0;
    var dt = lastTs === null ? 0.016 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    target = progressAt(clock);
    level += (target - level) * (1 - Math.exp(-dt * LEVEL_LERP));
    draw(clock * 0.006);
    requestAnimationFrame(tick);
  }

  if (reduce) {
    stopDemo();
    draw(0);
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
