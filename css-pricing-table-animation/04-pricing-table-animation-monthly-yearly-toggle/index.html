<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly/yearly toggle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="mt-wrap">
    <div class="mt-toggle is-demo">
      <input type="radio" name="mt-period" id="mt-monthly" class="mt-radio mt-radio--m" checked>
      <input type="radio" name="mt-period" id="mt-yearly" class="mt-radio mt-radio--y">
      <label class="mt-option" for="mt-monthly">Monthly</label>
      <label class="mt-option" for="mt-yearly">Yearly</label>
      <span class="mt-indicator" aria-hidden="true"></span>
    </div>
    <div class="mt-price">$29<span class="mt-price__unit">/mo</span></div>
  </div>
</main>
</body>
</html>
