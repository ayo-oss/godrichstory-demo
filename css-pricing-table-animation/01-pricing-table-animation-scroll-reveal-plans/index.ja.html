<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plans reveal on scroll — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sr-grid is-demo">
    <div class="sr-card">
      <span class="sr-card__tag">Basic</span>
      <span class="sr-card__price">$9</span>
    </div>
    <div class="sr-card sr-card--mid">
      <span class="sr-card__tag">Pro</span>
      <span class="sr-card__price">$29</span>
    </div>
    <div class="sr-card">
      <span class="sr-card__tag">Team</span>
      <span class="sr-card__price">$79</span>
    </div>
  </div>
</main>
<script>
  var grid = document.querySelector('.sr-grid');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { grid.classList.add('in'); io.unobserve(grid); }
    });
  }, { threshold: 0.3 });
  io.observe(grid);
</script>
</body>
</html>
