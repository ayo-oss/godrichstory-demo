<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price swap via :has(:checked) — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="hc-card is-demo">
    <div class="hc-toggle">
      <input type="radio" name="hc-period" id="hc-monthly" class="hc-radio hc-radio--m" checked>
      <input type="radio" name="hc-period" id="hc-yearly" class="hc-radio hc-radio--y">
      <label for="hc-monthly">Monthly</label>
      <label for="hc-yearly">Yearly</label>
    </div>
    <div class="hc-price-stack">
      <div class="hc-price hc-price--monthly">$29<span>/mo</span></div>
      <div class="hc-price hc-price--yearly">$19<span>/mo</span></div>
    </div>
  </div>
</main>
</body>
</html>
