<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ガラス光沢の縦トグル 2 連 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ch is-demo" id="ch">
  <div class="ch__unit ch__unit--a">
    <input class="ch__input" id="chA" type="checkbox" role="switch" aria-label="チャンネル 1">
    <div class="ch__scale" aria-hidden="true">
      <span class="ch__num ch__num--zero">0</span>
      <span class="ch__num ch__num--one">1</span>
    </div>
    <div class="ch__track">
      <span class="ch__detent ch__detent--top" aria-hidden="true"></span>
      <span class="ch__detent ch__detent--bottom" aria-hidden="true"></span>
      <span class="ch__knob" aria-hidden="true"></span>
    </div>
  </div>
  <div class="ch__unit ch__unit--b">
    <input class="ch__input" id="chB" type="checkbox" role="switch" aria-label="チャンネル 2" checked>
    <div class="ch__scale" aria-hidden="true">
      <span class="ch__num ch__num--zero">0</span>
      <span class="ch__num ch__num--one">1</span>
    </div>
    <div class="ch__track">
      <span class="ch__detent ch__detent--top" aria-hidden="true"></span>
      <span class="ch__detent ch__detent--bottom" aria-hidden="true"></span>
      <span class="ch__knob" aria-hidden="true"></span>
    </div>
  </div>
</div>
</main>
<script>
var chRoot = document.getElementById('ch');
// 켜고 끄는 것은 체크박스 스스로 한다(role="switch" 입력은 aria-checked 를 native 로 노출한다).
// 스크립트는 손이 닿으면 미리보기 루프를 멈추는 역할만 한다.
chRoot.addEventListener('pointerdown', function () { chRoot.classList.remove('is-demo'); });
</script>
</body>
</html>
