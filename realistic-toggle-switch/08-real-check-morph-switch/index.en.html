<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toggle that sets into a check — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cm is-demo" id="cm">
  <section class="cm__panel">
    <p class="cm__label">Agree to the terms</p>
    <button class="cm__switch" id="cmSwitch" type="button" role="switch" aria-checked="false" aria-label="Terms agreement">
      <span class="cm__knob" aria-hidden="true">
        <svg class="cm__check" viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="5,12.5 10,17.5 19,7.5"></polyline>
        </svg>
      </span>
    </button>
    <p class="cm__state" role="status"><span class="cm__wordOff">Not agreed yet</span><span class="cm__wordOn">Agreed</span></p>
  </section>
</div>
</main>
<script>
var cmRoot = document.getElementById('cm');
var cmSwitch = document.getElementById('cmSwitch');

function cmSet(agreed) {
  cmSwitch.setAttribute('aria-checked', agreed ? 'true' : 'false');
  cmRoot.classList.toggle('is-agreed', agreed);
}
cmSwitch.addEventListener('pointerdown', function () { cmRoot.classList.remove('is-demo'); });
cmSwitch.addEventListener('click', function () {
  cmRoot.classList.remove('is-demo');
  cmSet(cmSwitch.getAttribute('aria-checked') !== 'true');
});
</script>
</body>
</html>
