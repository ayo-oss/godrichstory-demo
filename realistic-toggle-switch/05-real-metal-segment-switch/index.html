<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두 칸 사이를 미끄러지는 선택 알약 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sg is-demo" id="sg">
  <div class="sg__track">
    <span class="sg__knob" aria-hidden="true"></span>
    <button class="sg__cell" id="sgDay" type="button" aria-pressed="true">일간</button>
    <button class="sg__cell" id="sgWeek" type="button" aria-pressed="false">주간</button>
  </div>
</div>
</main>
<script>
var sgRoot = document.getElementById('sg');
var sgCells = sgRoot.querySelectorAll('.sg__cell');

// 두 칸 중 하나 고르기 — 이미 눌린 칸이면 그대로 두고, 아니면 알약을 옮긴다.
// 칸은 button 이라 탭과 엔터로도 전환된다(aria-pressed 로 선택 상태를 알린다).
function sgSelect(cell) {
  for (var i = 0; i < sgCells.length; i++) {
    sgCells[i].setAttribute('aria-pressed', sgCells[i] === cell ? 'true' : 'false');
  }
  sgRoot.classList.toggle('is-week', cell.id === 'sgWeek');
}
sgRoot.addEventListener('pointerdown', function () { sgRoot.classList.remove('is-demo'); });
for (var j = 0; j < sgCells.length; j++) {
  sgCells[j].addEventListener('click', function () { sgSelect(this); });
}
</script>
</body>
</html>
