<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>転がって目を開けるトグル — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tr is-demo" id="tr">
  <div class="tr__unit">
    <div class="tr__head" aria-hidden="true">
      <span class="tr__side tr__side--off"><span class="tr__dot"></span><span class="tr__word">オフ</span></span>
      <span class="tr__side tr__side--on"><span class="tr__word">オン</span><span class="tr__dot"></span></span>
    </div>
    <div class="tr__track">
      <span class="tr__rack tr__rack--top" aria-hidden="true">
        <span class="tr__tooth"></span><span class="tr__tooth"></span><span class="tr__tooth"></span><span class="tr__tooth"></span><span class="tr__tooth"></span><span class="tr__tooth"></span><span class="tr__tooth"></span><span class="tr__tooth"></span>
      </span>
      <span class="tr__rack tr__rack--bottom" aria-hidden="true">
        <span class="tr__tooth"></span><span class="tr__tooth"></span><span class="tr__tooth"></span><span class="tr__tooth"></span><span class="tr__tooth"></span><span class="tr__tooth"></span><span class="tr__tooth"></span><span class="tr__tooth"></span>
      </span>
      <span class="tr__knob" aria-hidden="true">
        <span class="tr__roll"><span class="tr__grip"></span></span>
        <span class="tr__eyes"><span class="tr__eye"></span><span class="tr__eye"></span></span>
      </span>
      <button class="tr__hit" id="trHit" type="button" role="switch" aria-checked="false" aria-label="サウンド"></button>
    </div>
    <p class="tr__state" role="status"><span class="tr__wordOn">サウンド オン</span><span class="tr__wordOff">サウンド オフ</span></p>
  </div>
</div>
</main>
<script>
var trRoot = document.getElementById('tr');
var trHit = document.getElementById('trHit');

function trSet(on) {
  trHit.setAttribute('aria-checked', on ? 'true' : 'false');
  trRoot.classList.toggle('is-on', on);
}
trHit.addEventListener('pointerdown', function () { trRoot.classList.remove('is-demo'); });
trHit.addEventListener('click', function () {
  trRoot.classList.remove('is-demo');
  trSet(trHit.getAttribute('aria-checked') !== 'true');
});
</script>
</body>
</html>
