<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끌었다 놓는 관성 토글 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dt is-demo" id="dt">
  <section class="dt__panel">
    <p class="dt__label">잠금 해제</p>
    <div class="dt__track" id="dtTrack">
      <span class="dt__fill" aria-hidden="true"></span>
      <button class="dt__knob" id="dtKnob" type="button" role="switch" aria-checked="false" aria-label="잠금 해제 스위치">
        <span class="dt__grip" aria-hidden="true"></span>
      </button>
    </div>
    <p class="dt__hint">끌어서 밀어 보세요</p>
    <p class="dt__state" role="status"><span class="dt__wordOff">잠김</span><span class="dt__wordOn">열림</span></p>
  </section>
</div>
</main>
<script>
var dtRoot = document.getElementById('dt');
var dtTrack = document.getElementById('dtTrack');
var dtKnob = document.getElementById('dtKnob');
var dragging = false;
var startX = 0;
var startOffset = 0;
var offset = 0;
var suppressClick = false; // 끌기가 일어난 뒤 따라오는 click 은 토글이 아니라 끌기의 끝이다

function travel() {
  // 노브가 갈 수 있는 최대 거리 = 트랙 안폭 - 노브 폭 (레일 여백 4px 씩)
  return dtTrack.clientWidth - dtKnob.offsetWidth - 8;
}
function place(px) {
  offset = Math.max(0, Math.min(travel(), px));
  dtKnob.style.transform = 'translateX(' + offset + 'px)';
}
function settle(open) {
  dtKnob.style.transform = '';
  dtKnob.setAttribute('aria-checked', open ? 'true' : 'false');
  dtRoot.classList.toggle('is-open', open);
  offset = open ? travel() : 0;
}
function onDown(e) {
  dtRoot.classList.remove('is-demo');
  dragging = true;
  startX = e.clientX;
  startOffset = dtRoot.classList.contains('is-open') ? travel() : 0;
  dtRoot.classList.add('is-dragging');
  dtKnob.setPointerCapture(e.pointerId);
}
function onMove(e) {
  if (!dragging) return;
  if (Math.abs(e.clientX - startX) > 6) suppressClick = true;
  place(startOffset + (e.clientX - startX));
}
function onUp() {
  if (!dragging) return;
  dragging = false;
  dtRoot.classList.remove('is-dragging');
  // 절반을 넘겼으면 남은 거리를 관성으로 마저 달리고, 못 넘겼으면 제자리로 돌아온다
  settle(offset > travel() / 2);
}
dtKnob.addEventListener('pointerdown', onDown);
dtKnob.addEventListener('pointermove', onMove);
dtKnob.addEventListener('pointerup', onUp);
dtKnob.addEventListener('pointercancel', onUp);
dtKnob.addEventListener('click', function () {
  dtRoot.classList.remove('is-demo');
  if (suppressClick) { suppressClick = false; return; } // 끌기 직후의 click 은 무시한다
  settle(dtKnob.getAttribute('aria-checked') !== 'true');
});
</script>
</body>
</html>
