<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빛이 쓸려 가는 유리 토글 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="onx is-demo" id="onx">
  <div class="onx__col">
    <button class="onx__track" id="onxSwitch" type="button" role="switch" aria-checked="false" aria-label="야간 모드">
      <span class="onx__light" aria-hidden="true"></span>
      <span class="onx__sweep" aria-hidden="true"></span>
      <span class="onx__star onx__star--1" aria-hidden="true"></span>
      <span class="onx__star onx__star--2" aria-hidden="true"></span>
      <span class="onx__star onx__star--3" aria-hidden="true"></span>
      <span class="onx__star onx__star--4" aria-hidden="true"></span>
      <span class="onx__star onx__star--5" aria-hidden="true"></span>
      <span class="onx__knob" aria-hidden="true"><span class="onx__grip" aria-hidden="true"></span></span>
    </button>
    <p class="onx__state" role="status"><span class="onx__wordOn">켜짐</span><span class="onx__wordOff">꺼짐</span></p>
  </div>
</div>
</main>
<script>
var onxRoot = document.getElementById('onx');
var onxSwitch = document.getElementById('onxSwitch');

function onxSet(on) {
  onxSwitch.setAttribute('aria-checked', on ? 'true' : 'false');
  onxRoot.classList.toggle('is-on', on);
}
onxSwitch.addEventListener('pointerdown', function () { onxRoot.classList.remove('is-demo'); });
onxSwitch.addEventListener('click', function () {
  onxRoot.classList.remove('is-demo');
  onxSet(onxSwitch.getAttribute('aria-checked') !== 'true');
});
</script>
</body>
</html>
