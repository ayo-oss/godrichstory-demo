<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スライドさせるミュートスイッチ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sm is-demo" id="sm">
  <section class="sm__panel">
    <p class="sm__label">通知</p>
    <div class="sm__rail">
      <span class="sm__band" aria-hidden="true"></span>
      <button class="sm__handle" id="smHandle" type="button" role="switch" aria-checked="false" aria-label="通知のミュート">
        <span class="sm__grip" aria-hidden="true"></span>
      </button>
    </div>
    <p class="sm__state" role="status"><span class="sm__wordOn">サウンド オン</span><span class="sm__wordOff">ミュート</span></p>
  </section>
</div>
</main>
<script>
var smRoot = document.getElementById('sm');
var smHandle = document.getElementById('smHandle');

function smSet(muted) {
  smHandle.setAttribute('aria-checked', muted ? 'true' : 'false');
  smRoot.classList.toggle('is-muted', muted);
}
smHandle.addEventListener('pointerdown', function () { smRoot.classList.remove('is-demo'); });
smHandle.addEventListener('click', function () {
  smRoot.classList.remove('is-demo');
  smSet(smHandle.getAttribute('aria-checked') !== 'true');
});
</script>
</body>
</html>
