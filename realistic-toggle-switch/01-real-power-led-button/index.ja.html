<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED リング付き電源ボタン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pw is-demo" id="pw">
  <div class="pw__col">
  <div class="pw__assembly">
    <span class="pw__bezel" aria-hidden="true"></span>
    <span class="pw__groove" aria-hidden="true"></span>
    <button class="pw__cap" id="pwCap" type="button" role="switch" aria-checked="false" aria-label="電源">
      <svg class="pw__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 3v6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"></path>
        <path d="M18.4 6.6a7.4 7.4 0 1 1-12.8 0" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"></path>
      </svg>
    </button>
    <span class="pw__led" aria-hidden="true"></span>
    <span class="pw__shade" aria-hidden="true"></span>
  </div>
  <p class="pw__state" role="status"><span class="pw__wordOn">オン</span><span class="pw__wordOff">オフ</span></p>
  </div>
</div>
</main>
<script>
var pwRoot = document.getElementById('pw');
var pwCap = document.getElementById('pwCap');

function pwSet(on) {
  pwCap.setAttribute('aria-checked', on ? 'true' : 'false');
  pwRoot.classList.toggle('is-on', on);
}
pwCap.addEventListener('pointerdown', function () { pwRoot.classList.remove('is-demo'); });
pwCap.addEventListener('click', function () {
  pwRoot.classList.remove('is-demo');
  pwSet(pwCap.getAttribute('aria-checked') !== 'true');
});
</script>
</body>
</html>
