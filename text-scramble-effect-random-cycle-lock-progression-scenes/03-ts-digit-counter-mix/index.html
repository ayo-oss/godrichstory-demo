<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숫자만 숫자셋에서 굴러가는 카운터 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, 왼쪽·오른쪽 방향키로 다른 값으로">
      <div class="ez__scene" data-role="scene" role="img" aria-label="숫자셋에서 바뀐 자릿수만 굴러가다가 값으로 잠기는 카운터 장면"></div>
      <p class="ez__status" data-role="status" aria-live="off">장면 준비</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
    // 무대 좌표 — 안쪽 상자는 늘 480x300 이고 화면 크기에 맞춰 통째로 줄인다 (왼쪽 위 모서리 기준)
    const W = 480;
    const SW = 464; // 장면 폭 (480 - 좌우 8px)
    const SH = 190; // 장면 높이
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 고정 해시 — Math.random 대신 시드로 같은 값을 되돌려 받는다
    function hash(i, s) {
        const x = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    // 문구 틀의 {a} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    // ── 무대 요소
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // 장면 안 요소를 만든다. 클래스는 cx 를 거쳐 CSS 모듈 이름으로 바뀐다
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    // 지시 텍스트 (레이블·칩 글자) — 화면 문구는 전부 문구 사전을 거친다
    function label(parent, cls, x, y, text) {
        const e = make('b', cls, parent);
        e.textContent = text;
        put(e, x, y, 0, 0);
        return e;
    }
    const scEl = make('div', 'sc', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        scEl.textContent = '';
    }
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    function mkTxt(parent, cls, text) {
        const box = make('div', 'txt ' + cls, parent);
        box.setAttribute('aria-hidden', 'true');
        const cells = [];
        for (let i = 0; i < text.length; i += 1) {
            const c = make('span', 'cell', box);
            if (text.charAt(i) === ' ') {
                c.className = cx('cell cell--sp');
            }
            c.textContent = text.charAt(i);
            cells.push(c);
        }
        const sr = make('span', 'srorg', parent);
        sr.textContent = text;
        return { box: box, cells: cells, chars: text.split(''), n: text.length };
    }
    // 칸 하나를 그린다 — on 이면 원문 글자로 잠긴 색, 아니면 문자셋에서 뽑은 글자
    function setCell(t, i, ch, on) {
        const c = t.cells[i];
        if (c.textContent !== ch) {
            c.textContent = ch;
        }
        const want = on ? '1' : '0';
        if (c.getAttribute('data-on') !== want) {
            c.setAttribute('data-on', want);
        }
    }
    // 문자셋에서 칸 i 번째 한 글자 뽑기 — k 가 바뀔 때마다 다른 글자가 나온다 (인덱스 순환)
    function pick(set, i, k) {
        return set.charAt(Math.floor(hash(i + 1, k * 0.1731 + 3.7) * set.length));
    }
    // 라틴 기본 셋 — 대소문자+숫자 62자 (01·02·06·07·09 공용)
    const SET62 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    // 문장에 한글이 있으면 음절 셋, 아니면 라틴 셋 — 자모 분해 없이 문장의 문자 체계를 따간다
    function setFor(text, syl, lat) {
        for (let i = 0; i < text.length; i += 1) {
            const c = text.charCodeAt(i);
            if (c >= 0xac00 && c <= 0xd7a3) {
                return syl;
            }
        }
        return lat;
    }
    function newCursor() {
        const c = make('i', 'cur', scEl);
        return {
            el: c,
            set(x, y) { c.style.transform = 'translate(' + (x - 4) + 'px,' + (y - 4) + 'px)'; },
            show(b) { c.style.opacity = b ? '1' : '0'; },
        };
    }
    function mkMap(parent, cls, n, x, y, size) {
        const el = make('div', 'cmap ' + cls, parent);
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        const cells = [];
        for (let i = 0; i < n; i += 1) {
            const c = make('i', 'cmap__c', el);
            c.style.width = size + 'px';
            c.style.height = size + 'px';
            cells.push(c);
        }
        return {
            el: el,
            set(states) {
                for (let i = 0; i < cells.length; i += 1) {
                    const want = states.length > i && states[i] ? '1' : '0';
                    if (cells[i].getAttribute('data-on') !== want) {
                        cells[i].setAttribute('data-on', want);
                    }
                }
            },
        };
    }
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        let lastPtrT = -9999; // 마지막 실제 포인터 입력 시각 (시연 시각 t 기준)
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            cycle = Math.max(2000, cfg.build(pi));
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function nowT() {
            const ct = clock ? Number(clock.currentTime) : 0;
            return isFinite(ct) ? ct : 0;
        }
        function tick() {
            const t = nowT();
            const overlay = lastPtrT >= 0 && t - lastPtrT < 1500 && t >= lastPtrT;
            const s = cfg.frame(paused ? nowT() : t, overlay);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            if (reduced) {
                // 줄이기 모드에서도 프리셋 전환은 즉시 한 장 다시 그린다 (입력이 화면에 반영된다)
                statusP.textContent = cfg.frame(-1, false);
            }
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        // 실제 포인터 — 장면 좌표로 바꿔 항목에 넘긴다. 터치는 pointerType 으로 갈린다
        function toScene(ev) {
            const r = sceneEl.getBoundingClientRect();
            const k = r.width / SW;
            return [(ev.clientX - r.left) / k, (ev.clientY - r.top) / k];
        }
        padEl.addEventListener('pointermove', function (ev) {
            const p = toScene(ev);
            lastPtrT = nowT();
            cfg.pointer(p[0], p[1], ev.pointerType || 'mouse', (ev.buttons & 1) === 1);
            // 줄이기 모드에서도 입력이 화면에 반영된다 — 목표 갱신 뒤 한 장 다시 그린다
            if (reduced) {
                statusP.textContent = cfg.frame(-1, true);
            }
        }, { signal: off.signal });
        padEl.addEventListener('pointerdown', function (ev) {
            const p = toScene(ev);
            lastPtrT = nowT();
            cfg.pointer(p[0], p[1], ev.pointerType || 'mouse', true);
            if (reduced) {
                statusP.textContent = cfg.frame(-1, true);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            // 탭이 숨으면 멈추고 돌아오면 이어 간다 — 시계 애니메이션이 상태를 기억한다
            if (document.hidden) {
                setPaused(true);
            }
            else if (!reduced) {
                setPaused(false);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            // 움직임 줄이기 — 섞음 없이 곧은 원문 한 장만 그린다. 입력·프리셋 전환은 frame 1회 재호출로 반영된다
            statusP.textContent = cfg.frame(-1, false);
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }
    // ── 03 숫자만 숫자셋에서 굴러가는 카운터
    // 문자셋을 0~9 로 한정하고 자릿수마다 굴러가는 속도를 자리 값에 따라 다르게 준다.
    // 바뀐 자리만 굴림 뒤 잠기고(CHANGE_ONLY) 안 바뀐 자리는 그대로 — tabular-nums 로 폭 고정.
    const DIGIT_SET = ['0123456789', '0123456789', '0123']; // 변형 — 셋을 4자로 줄이면 반복이 눈에 띈다
    const PLACE_MS = [90, 150, 60];
    const VALUES = [2489157, 5382406, 7615928, 9370482]; // 밟아 올라가는 값 4계단 — 굴림 구간을 촘촘히
    const CNT_MS = 450; // 한 값 계단 길이
    let cnt = null;
    let lab = null;
    let labP = null;
    let map3 = null; // 자릿수 7칸 지도 — 굴림 중인 자리가 사각 줄로 깜박인다
    let pi519 = 0;
    function pad7(v) {
        let s = String(v);
        while (s.length < 7) {
            s = '0' + s;
        }
        return s;
    }
    // 계단 a → b 사이, 진행 t1 ms 에서의 칸 상태. 자릿수 지도 상태를 돌려준다
    // 자리값이 큰 자리(왼쪽)일수록 PLACE_MS 가 길다 — 자리별 굴림 속도가 다르다
    function drawCount(va, vb, t1, hold) {
        const states = [];
        if (!cnt) {
            return states;
        }
        const set = DIGIT_SET[pi519];
        const k = t1 < 0 ? -1 : Math.floor(t1 / 45);
        for (let i = 0; i < cnt.n; i += 1) {
            const same = va.charAt(i) === vb.charAt(i);
            let rolling = false;
            if (same || t1 < 0) {
                setCell(cnt, i, vb.charAt(i), true); // 안 바뀌는 자리는 그대로 잠금
            }
            else if (hold) {
                setCell(cnt, i, vb.charAt(i), true);
            }
            else {
                // 자리 i 의 굴림 시간 — 왼쪽(큰 자리)일수록 길게: PLACE_MS × (7-i)/4
                const myMs = PLACE_MS[pi519] * (7 - i) / 4;
                if (t1 >= myMs) {
                    setCell(cnt, i, vb.charAt(i), true); // 굴림 끝나 잠김
                }
                else {
                    // 감기 — 문자셋에서 거꾸로 거치며 새 자리값으로 좁혀 간다 (순환 카운터)
                    const spin = pick(set, i, k + i * 3);
                    setCell(cnt, i, spin, false);
                    rolling = true;
                }
            }
            states.push(!rolling); // 지도 — 잠김 참 · 굴림 거짓
        }
        return states;
    }
    const cfg = {
        count: 3,
        build(i) {
            pi519 = i;
            cnt = mkTxt(scEl, 's3__num', pad7(VALUES[0]));
            lab = label(scEl, 'tag tag--big', 16, 168, '');
            labP = label(scEl, 'tag', 16, 12, '');
            map3 = mkMap(scEl, 's3__map', 7, 46, 120, 40);
            return 2000;
        },
        frame(t, overlay) {
            if (!cnt || !lab || !labP || !map3) {
                return '';
            }
            if (t < 0) {
                drawCount(pad7(VALUES[2]), pad7(VALUES[2]), -1, true);
                map3.set([true, true, true, true, true, true, true]);
                return fill('지금 원문 · 값 {a}', f0(VALUES[2]));
            }
            // 3계단 — 2초 안에 값이 3번 굳어 간다
            const seg = Math.max(0, t - 200) / CNT_MS;
            const step = clamp(Math.floor(seg), 0, 3);
            const tin = (seg - step) * CNT_MS;
            const va = pad7(VALUES[step]);
            const vb = pad7(VALUES[step + 1 > 3 ? 3 : step + 1]);
            const states = drawCount(va, vb, step >= 3 ? 9999 : tin, step >= 3);
            map3.set(states); // 자릿수 지도 — 굴림 중인 자리가 사각으로 깜박인다
            const diffN = va.split('').filter(function (c, j) { return c !== vb.charAt(j); }).length;
            lab.textContent = fill('바뀐 자리 {a}/{b} · 굴림 중', f0(diffN), f0(7));
            labP.textContent = 'PLACE_MS ' + f0(PLACE_MS[pi519]) + ' · tabular-nums';
            return fill('지금 {a}ms · 값 {b} · 셋 {c}자 · 자리별 굴림 {d}~{e}ms', f0(t), f0(VALUES[step]), f0(DIGIT_SET[pi519].length), f0(PLACE_MS[pi519] * 1 / 4), f0(PLACE_MS[pi519] * 7 / 4));
        },
        pointer(x, y, type, down) {
            // 이 장면은 포인터로 바꾸는 값이 없다 — 시간표가 계단을 정한다
        },
    };
    run(cfg);
    setReads(fill('DIGIT_SET {a}자 · PLACE_MS {b}', f0(DIGIT_SET[0].length), f0(PLACE_MS[0])), '바뀐 자리만 숫자셋 감기 뒤 잠김 — 안 바뀐 자리는 건드리지 않는다');
    return undefined;
}
})();
</script>
</body>
</html>
