<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One storm-outside-the-window scene layers four techniques — depth parallax, wind gusts, window droplets, and branching lightning — into a single screen. — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rn is-demo" id="rnRoot">
  <canvas class="rn__canvas" id="rnCanvas" width="480" height="300"></canvas>
  <p class="rn__caption">One storm-outside-the-window scene layers four techniques — depth parallax, wind gusts, window droplets, and branching lightning — into a single screen.</p>
</div>
</main>
<script>
(function () {
  // 히어로 장면 — 01 깊이 시차 + 02 바람 돌풍 + 03 유리창 물방울 + 06 번개 가지, 네 기법만 겹친다.
  // 상수는 전부 HERO_ 접두로 이 장면 전용값이며 각 단일 항목의 상수와는 독립이다.
  var root = document.getElementById('rnRoot');
  var canvas = document.getElementById('rnCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  var CALC_W = 160, CALC_H = 100;
  var HERO_RAIN_LAYER_COUNT = 4;
  var HERO_RAIN_NEAR_SPEED_PX_S = 150;
  var HERO_RAIN_FAR_SPEED_PX_S = 40;
  var HERO_STREAKS_PER_LAYER = 26;
  var HERO_WIND_GUST_MAX_DEG = 10;
  var HERO_WIND_CYCLE_MS = 5200;
  var HERO_DROPLET_SPAWN_PER_S = 2.2;
  var HERO_DROPLET_GRAVITY_PX_S = 54;
  var HERO_DROPLET_DRAG_COEF = 3;
  var HERO_DROPLET_MERGE_DIST_PX = 2.2;
  var HERO_GLASS_TOP = CALC_H * 0.76;
  var HERO_LIGHTNING_STRIKE_PERIOD_MS = 2600;
  var HERO_LIGHTNING_FLASH_DECAY_MS = 240;
  var HERO_LIGHTNING_BOLT_FADE_MS = 850;
  var HERO_LIGHTNING_BRANCH_DEPTH = 3;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var rRand = seedRand(431091);

  function streakDepthZ(layerIndex) {
    return layerIndex / Math.max(1, HERO_RAIN_LAYER_COUNT - 1);
  }

  var streaks = [];
  for (var li = 0; li < HERO_RAIN_LAYER_COUNT; li += 1) {
    var z = streakDepthZ(li);
    for (var i = 0; i < HERO_STREAKS_PER_LAYER; i += 1) {
      streaks.push({
        x: rRand() * CALC_W,
        y: rRand() * CALC_H,
        z: z,
        speed: HERO_RAIN_FAR_SPEED_PX_S + (HERO_RAIN_NEAR_SPEED_PX_S - HERO_RAIN_FAR_SPEED_PX_S) * z,
        thick: 0.5 + z * 1.4
      });
    }
  }

  function windGustAngle(nowMs) {
    var a = Math.sin((nowMs / HERO_WIND_CYCLE_MS) * Math.PI * 2) * 0.7;
    var b = Math.sin((nowMs / (HERO_WIND_CYCLE_MS * 0.37)) * Math.PI * 2) * 0.3;
    return (a + b) * HERO_WIND_GUST_MAX_DEG;
  }

  var droplets = [];
  var dropletSpawnAcc = 0;
  function spawnDroplet() {
    droplets.push({
      x: HERO_GLASS_X0 + rRand() * (HERO_GLASS_X1 - HERO_GLASS_X0),
      y: HERO_GLASS_TOP + rRand() * 3,
      vy: 0,
      r: 0.9 + rRand() * 1.1
    });
  }
  var HERO_GLASS_X0 = CALC_W * 0.06, HERO_GLASS_X1 = CALC_W * 0.94;

  function dropletMassMerge(a, b) {
    var ar = a.r * a.r, br = b.r * b.r;
    a.r = Math.sqrt(ar + br) * 0.86;
    a.vy = (a.vy * ar + b.vy * br) / (ar + br);
  }

  function stepDroplets(dtS) {
    dropletSpawnAcc += dtS * HERO_DROPLET_SPAWN_PER_S;
    while (dropletSpawnAcc >= 1) { spawnDroplet(); dropletSpawnAcc -= 1; }
    for (var i = 0; i < droplets.length; i += 1) {
      var d = droplets[i];
      var drag = Math.max(0.15, 1 - d.r / HERO_DROPLET_DRAG_COEF * 0.12);
      d.vy += HERO_DROPLET_GRAVITY_PX_S * dtS * drag * 0.01 * d.r;
      d.y += d.vy * dtS;
    }
    for (var a = droplets.length - 1; a >= 0; a -= 1) {
      for (var b = a - 1; b >= 0; b -= 1) {
        var da = droplets[a], db = droplets[b];
        var dx = da.x - db.x, dy = da.y - db.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < (da.r + db.r) * 0.5 + HERO_DROPLET_MERGE_DIST_PX * 0.3) {
          dropletMassMerge(db, da);
          droplets.splice(a, 1);
          break;
        }
      }
    }
    for (var k = droplets.length - 1; k >= 0; k -= 1) {
      if (droplets[k].y > CALC_H + 2 || droplets[k].r > 5.5) droplets.splice(k, 1);
    }
  }

  function branchLightning(segs, x, y, ang, len, depth) {
    if (depth <= 0 || len < 3) return;
    var steps = 3 + Math.floor(rRand() * 2);
    var cx = x, cy = y, cang = ang;
    for (var i = 0; i < steps; i += 1) {
      cang += (rRand() - 0.5) * 0.9;
      var stepLen = len / steps;
      var nx = cx + Math.sin(cang) * stepLen;
      var ny = cy + Math.cos(cang) * stepLen;
      segs.push({ x0: cx, y0: cy, x1: nx, y1: ny, depth: depth });
      if (depth > 1 && rRand() < 0.3) {
        var side = rRand() < 0.5 ? -1 : 1;
        branchLightning(segs, nx, ny, cang + side * (0.6 + rRand() * 0.5), len * 0.5, depth - 1);
      }
      cx = nx; cy = ny;
    }
  }
  function makeBolt() {
    var segs = [];
    var startX = 20 + rRand() * 120;
    branchLightning(segs, startX, 0, 0, HERO_GLASS_TOP * 0.88, HERO_LIGHTNING_BRANCH_DEPTH);
    return segs;
  }
  var bolt = [];
  var strikeAtMs = -99999;
  var lastStrikeIndex = -1;
  function updateStrike(nowMs) {
    var idx = Math.floor(nowMs / HERO_LIGHTNING_STRIKE_PERIOD_MS);
    if (idx !== lastStrikeIndex) {
      lastStrikeIndex = idx;
      bolt = makeBolt();
      strikeAtMs = nowMs;
    }
  }

  function stepSim(dtS, nowMs) {
    var gust = windGustAngle(nowMs);
    var gustRad = (gust * Math.PI) / 180;
    for (var i = 0; i < streaks.length; i += 1) {
      var s = streaks[i];
      s.y += s.speed * dtS;
      s.x += Math.sin(gustRad) * s.speed * 0.5 * dtS;
      if (s.y > CALC_H + 4) { s.y = -4 - rRand() * 8; s.x = rRand() * CALC_W; }
      if (s.x < -6) s.x = CALC_W + 6;
      if (s.x > CALC_W + 6) s.x = -6;
    }
    stepDroplets(dtS);
    updateStrike(nowMs);
  }

  var cw = 480, ch = 300;
  function draw(nowMs) {
    var sx = cw / CALC_W, sy = ch / CALC_H;
    var sinceStrike = nowMs - strikeAtMs;
    var flash = Math.exp(-Math.max(0, sinceStrike) / HERO_LIGHTNING_FLASH_DECAY_MS);
    var boltAlpha = Math.exp(-Math.max(0, sinceStrike) / HERO_LIGHTNING_BOLT_FADE_MS);
    var gust = windGustAngle(nowMs);

    ctx.fillStyle = '#12111a';
    ctx.fillRect(0, 0, cw, ch);
    if (flash > 0.02) {
      ctx.fillStyle = 'rgba(255,250,230,' + (flash * 0.5).toFixed(3) + ')';
      ctx.fillRect(0, 0, cw, ch);
    }

    for (var i = 0; i < streaks.length; i += 1) {
      var s = streaks[i];
      var alpha = 0.18 + s.z * 0.55;
      var x = s.x * sx, y0 = s.y * sy, y1 = (s.y - s.thick * 5) * sy;
      ctx.strokeStyle = 'rgba(214,228,255,' + alpha + ')';
      ctx.lineWidth = Math.max(0.5, s.thick * ((sx + sy) / 2));
      ctx.beginPath();
      ctx.moveTo(x, y0);
      ctx.lineTo(x, y1);
      ctx.stroke();
    }

    if (boltAlpha > 0.03 && bolt.length) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,252,240,' + boltAlpha.toFixed(3) + ')';
      ctx.shadowColor = 'rgba(255,246,200,' + (boltAlpha * 0.75).toFixed(3) + ')';
      ctx.shadowBlur = 7 * ((sx + sy) / 2);
      for (var b = 0; b < bolt.length; b += 1) {
        var seg = bolt[b];
        ctx.lineWidth = Math.max(0.7, seg.depth * ((sx + sy) / 2) * 0.5);
        ctx.beginPath();
        ctx.moveTo(seg.x0 * sx, seg.y0 * sy);
        ctx.lineTo(seg.x1 * sx, seg.y1 * sy);
        ctx.stroke();
      }
      ctx.restore();
    }

    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(0, HERO_GLASS_TOP * sy, cw, ch - HERO_GLASS_TOP * sy);
    for (var d = 0; d < droplets.length; d += 1) {
      var dr = droplets[d];
      var dx = dr.x * sx, dy = dr.y * sy, rr = dr.r * ((sx + sy) / 2);
      var grad = ctx.createRadialGradient(dx - rr * 0.3, dy - rr * 0.3, 0, dx, dy, rr);
      grad.addColorStop(0, 'rgba(255,255,255,0.85)');
      grad.addColorStop(0.5, 'rgba(214,228,255,0.35)');
      grad.addColorStop(1, 'rgba(214,228,255,0.05)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(dx, dy, rr, 0, Math.PI * 2);
      ctx.fill();
    }

    void gust;
  }

  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    draw(elapsed);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var elapsed = 0;
  if (reduce) root.classList.remove('is-demo');
  var warmSteps = reduce ? 30 : 45;
  for (var w = 0; w < warmSteps; w += 1) { elapsed += 20; stepSim(0.02, elapsed); }

  var lastTs = null;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min(ts - lastTs, 48);
    lastTs = ts;
    if (!reduce) {
      elapsed += dt;
      stepSim(dt / 1000, elapsed);
      draw(elapsed);
    }
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  draw(elapsed);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
