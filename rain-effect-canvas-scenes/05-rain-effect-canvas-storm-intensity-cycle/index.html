<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>느린 주기 함수 하나로 폭풍의 세기를 계속 오르내리게 하고, 그 값에 맞춰 빗줄기 개수와 바람 세기를 매 프레임 다시 계산해 장면 전체가 함께 약해지고 세진다 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rn is-demo" id="rnRoot">
  <canvas class="rn__canvas" id="rnCanvas" width="480" height="300"></canvas>
  <p class="rn__caption">느린 주기 함수 하나로 폭풍의 세기를 계속 오르내리게 하고, 그 값에 맞춰 빗줄기 개수와 바람 세기를 매 프레임 다시 계산해 장면 전체가 함께 약해지고 세진다</p>
</div>
</main>
<script>
(function () {
  // 기법: stormIntensity() 하나가 사인 주기(STORM_CYCLE_MS)로 0~1 을 오르내리고, 그 값 하나로
  // 화면에 보이는 빗줄기 수·굵기·기울기·어두운 정도를 매 프레임 다시 계산한다. RAIN_SPAWN_RATE_BASE
  // 는 가장 약한 이슬비일 때도 유지하는 최소 줄기 수 — 그 위로 세기만큼 더 얹는다.
  var root = document.getElementById('rnRoot');
  var canvas = document.getElementById('rnCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  var CALC_W = 160, CALC_H = 100;
  var STORM_CYCLE_MS = 9000;
  var RAIN_SPAWN_RATE_BASE = 18;
  var RAIN_POOL_SIZE = 110;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var rRand = seedRand(431051);

  function stormIntensity(nowMs) {
    return Math.sin((nowMs / STORM_CYCLE_MS) * Math.PI * 2 - Math.PI / 2) * 0.5 + 0.5;
  }

  var streaks = [];
  for (var i = 0; i < RAIN_POOL_SIZE; i += 1) {
    streaks.push({
      x: rRand() * CALC_W,
      y: rRand() * CALC_H,
      thresh: rRand(),
      speed: 90 + rRand() * 90,
      thick: 0.7 + rRand() * 1.3
    });
  }

  function stepSim(dtS, nowMs) {
    var inten = stormIntensity(nowMs);
    var wind = (inten - 0.5) * 20;
    for (var i = 0; i < streaks.length; i += 1) {
      var s = streaks[i];
      var visible = inten >= s.thresh * (1 - RAIN_SPAWN_RATE_BASE / 100);
      if (!visible) continue;
      s.y += s.speed * (0.6 + inten * 0.7) * dtS;
      s.x += wind * dtS;
      if (s.y > CALC_H + 6) { s.y = -6 - rRand() * 8; s.x = rRand() * CALC_W; }
      if (s.x < -6) s.x = CALC_W + 6;
      if (s.x > CALC_W + 6) s.x = -6;
    }
  }

  function draw(nowMs) {
    var sx = cw / CALC_W, sy = ch / CALC_H;
    var inten = stormIntensity(nowMs);
    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = 'rgba(6,8,20,' + (inten * 0.4).toFixed(3) + ')';
    ctx.fillRect(0, 0, cw, ch);
    for (var i = 0; i < streaks.length; i += 1) {
      var s = streaks[i];
      var visible = inten >= s.thresh * (1 - RAIN_SPAWN_RATE_BASE / 100);
      if (!visible) continue;
      var alpha = 0.35 + inten * 0.55;
      var x = s.x * sx, y0 = s.y * sy, y1 = (s.y - s.thick * 5) * sy;
      ctx.strokeStyle = 'rgba(214,228,255,' + alpha + ')';
      ctx.lineWidth = Math.max(0.6, s.thick * ((sx + sy) / 2));
      ctx.beginPath();
      ctx.moveTo(x, y0);
      ctx.lineTo(x, y1);
      ctx.stroke();
    }
  }

  var cw = 480, ch = 300;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    draw(elapsed);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var elapsed = 2200;
  if (reduce) root.classList.remove('is-demo');
  var warmSteps = reduce ? 0 : 40;
  for (var w = 0; w < warmSteps; w += 1) { elapsed += 20; stepSim(0.02, elapsed); }

  var lastTs = null;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min(ts - lastTs, 48);
    lastTs = ts;
    if (!reduce) {
      elapsed += dt;
      stepSim(dt / 1000, elapsed);
      draw(elapsed);
    }
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  draw(elapsed);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
