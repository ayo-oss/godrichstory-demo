<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雷の経路は中間点を繰り返しずらして枝分かれさせて描き、同時に画面の明るさを急に上げてゆっくり戻す曲線で計算し、光る瞬間を作る。 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rn is-demo" id="rnRoot">
  <canvas class="rn__canvas" id="rnCanvas" width="480" height="300"></canvas>
  <p class="rn__caption">雷の経路は中間点を繰り返しずらして枝分かれさせて描き、同時に画面の明るさを急に上げてゆっくり戻す曲線で計算し、光る瞬間を作る。</p>
</div>
</main>
<script>
(function () {
  // 기법: branchLightning() 이 매 낙뢰마다 재귀로 가지를 새로 뻗는다(깊이 LIGHTNING_BRANCH_DEPTH).
  // 낙뢰 순간의 흰 섬광은 LIGHTNING_FLASH_DECAY_MS 를 시상수로 하는 지수 감쇠(Math.exp)로 사그라들고,
  // 번개 선 자체는 그보다 긴 LIGHTNING_BOLT_FADE_MS 동안 잔상으로 더 남는다.
  var root = document.getElementById('rnRoot');
  var canvas = document.getElementById('rnCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  var CALC_W = 160, CALC_H = 100;
  var LIGHTNING_STRIKE_PERIOD_MS = 1500;
  var LIGHTNING_FLASH_DECAY_MS = 220;
  var LIGHTNING_BOLT_FADE_MS = 900;
  var LIGHTNING_BRANCH_DEPTH = 4;
  var RAIN_STREAK_COUNT = 50;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var rRand = seedRand(431061);

  var streaks = [];
  for (var i = 0; i < RAIN_STREAK_COUNT; i += 1) {
    streaks.push({ x: rRand() * CALC_W, y: rRand() * CALC_H, speed: 110 + rRand() * 70, thick: 0.6 + rRand() * 1 });
  }

  function branchLightning(segs, x, y, ang, len, depth) {
    if (depth <= 0 || len < 3) return;
    var steps = 3 + Math.floor(rRand() * 2);
    var cx = x, cy = y, cang = ang;
    for (var i = 0; i < steps; i += 1) {
      cang += (rRand() - 0.5) * 0.9;
      var stepLen = len / steps;
      var nx = cx + Math.sin(cang) * stepLen;
      var ny = cy + Math.cos(cang) * stepLen;
      segs.push({ x0: cx, y0: cy, x1: nx, y1: ny, depth: depth });
      if (depth > 1 && rRand() < 0.3) {
        var side = rRand() < 0.5 ? -1 : 1;
        branchLightning(segs, nx, ny, cang + side * (0.6 + rRand() * 0.5), len * 0.5, depth - 1);
      }
      cx = nx; cy = ny;
    }
  }

  function makeBolt() {
    var segs = [];
    var startX = 24 + rRand() * 112;
    branchLightning(segs, startX, 0, 0, CALC_H * 0.94, LIGHTNING_BRANCH_DEPTH);
    return segs;
  }

  var bolt = [];
  var strikeAtMs = -99999;
  var lastStrikeIndex = -1;

  function updateStrike(nowMs) {
    var idx = Math.floor(nowMs / LIGHTNING_STRIKE_PERIOD_MS);
    if (idx !== lastStrikeIndex) {
      lastStrikeIndex = idx;
      bolt = makeBolt();
      strikeAtMs = nowMs;
    }
  }

  function stepSim(dtS, nowMs) {
    for (var i = 0; i < streaks.length; i += 1) {
      var s = streaks[i];
      s.y += s.speed * dtS;
      if (s.y > CALC_H + 4) { s.y = -4 - rRand() * 6; s.x = rRand() * CALC_W; }
    }
    updateStrike(nowMs);
  }

  var cw = 480, ch = 300;
  function draw(nowMs) {
    var sx = cw / CALC_W, sy = ch / CALC_H;
    var sinceStrike = nowMs - strikeAtMs;
    var flash = Math.exp(-Math.max(0, sinceStrike) / LIGHTNING_FLASH_DECAY_MS);
    var boltAlpha = Math.exp(-Math.max(0, sinceStrike) / LIGHTNING_BOLT_FADE_MS);

    ctx.fillStyle = 'rgba(20,17,10,1)';
    ctx.fillRect(0, 0, cw, ch);

    if (flash > 0.02) {
      ctx.fillStyle = 'rgba(255,250,230,' + (flash * 0.55).toFixed(3) + ')';
      ctx.fillRect(0, 0, cw, ch);
    }

    ctx.strokeStyle = 'rgba(214,228,255,0.45)';
    ctx.lineWidth = Math.max(0.6, 0.8 * ((sx + sy) / 2));
    for (var i = 0; i < streaks.length; i += 1) {
      var s = streaks[i];
      var x = s.x * sx, y0 = s.y * sy, y1 = (s.y - s.thick * 4) * sy;
      ctx.beginPath();
      ctx.moveTo(x, y0);
      ctx.lineTo(x, y1);
      ctx.stroke();
    }

    if (boltAlpha > 0.03 && bolt.length) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,252,240,' + boltAlpha.toFixed(3) + ')';
      ctx.shadowColor = 'rgba(255,246,200,' + (boltAlpha * 0.8).toFixed(3) + ')';
      ctx.shadowBlur = 8 * ((sx + sy) / 2);
      for (var b = 0; b < bolt.length; b += 1) {
        var seg = bolt[b];
        ctx.lineWidth = Math.max(0.8, (seg.depth) * ((sx + sy) / 2) * 0.55);
        ctx.beginPath();
        ctx.moveTo(seg.x0 * sx, seg.y0 * sy);
        ctx.lineTo(seg.x1 * sx, seg.y1 * sy);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    draw(elapsed);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var elapsed = 0;
  if (reduce) root.classList.remove('is-demo');
  var warmSteps = reduce ? 30 : 40;
  for (var w = 0; w < warmSteps; w += 1) { elapsed += 20; stepSim(0.02, elapsed); }

  var lastTs = null;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min(ts - lastTs, 48);
    lastTs = ts;
    if (!reduce) {
      elapsed += dt;
      stepSim(dt / 1000, elapsed);
      draw(elapsed);
    }
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  draw(elapsed);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
