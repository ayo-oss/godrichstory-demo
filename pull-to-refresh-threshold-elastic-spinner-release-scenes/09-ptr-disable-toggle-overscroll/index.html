<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브라우저 기본 당김과 충돌을 끊고 켜고 끄는 overscroll 토글 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, 왼쪽·오른쪽 방향키로 다른 값으로">
      <div class="ez__scene" data-role="scene" role="img" aria-label="contain 이 브라우저 기본 당김을 막은 컨테이너에서 토글이 꺼지면 판정이 사라지고 기본 동작이 돌아오는 장면"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">장면 준비</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
    // ── 526 당겨서 새로고침 공통 — 무대 좌표·문구 틀·요소 조립·ptr 드래그 엔진 (524 core.ts 계승)
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    // ── 무대 요소
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // 장면 안 요소를 만든다. 클래스는 cx 를 거쳐 CSS 모듈 이름으로 바뀐다
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        // clkEl(시계)은 sceneEl 에 직접 붙어 있으므로 래퍼만 비운다 — 시계를 지우면 렌더 시계가 죽는다
        scWrap.textContent = '';
        chartEl.textContent = '';
        probeEl.textContent = '';
    }
    // 정점 오프셋 — 시드 해시(재생해도 같은 값). Math.random 을 쓰지 않는다
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    // ── 엔진이 푼 시간 읽기 — getAnimations() 값
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function spanOf(d, dur) { return { s: d, e: d + dur, k: 0 }; }
    // ── 아래 차트 상자 그리기 — 당김(파랑 k0)·실행(k1)·여파/스프링(k2)·자동닫힘(k0)
    function bar(cls, x, y, w, h) {
        const e = make('i', cls, chartEl);
        put(e, x, y, w, h);
        return e;
    }
    function drawRows(segs, max) {
        const n = segs.length;
        const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
        const out = [];
        for (let i = 0; i < n; i += 1) {
            const sg = segs[i];
            const x = CX0 + clamp(sg.s, 0, max) / max * CW;
            const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
            out.push(bar('bar k' + sg.k, x, 5 + i * (h + 1), w, h));
        }
        return out;
    }
    function axis(max) {
        const a = make('b', 'ax', chartEl);
        a.textContent = '0';
        put(a, CX0, 40, 0, 0);
        const b = make('b', 'ax ax--r', chartEl);
        b.textContent = f0(max) + 'ms';
        put(b, CX0 + CW - 60, 40, 60, 0);
    }
    let headEl = null;
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    // ── ptr 드래그 엔진 — 이 편의 주역 계산을 9종이 공유한다
    // ptrRoute(t) — 주입 시연용 결정적 당김 원시(raw) 좌표 시퀀스. 프리셋:
    //   base   진폭 130 — 잠자리(0~250) → 당김(250~1250, sin 반파) → armed 유지(1250~1750) → 놓기(1750) → 여파
    //   under  진폭 55  — 임계(70) 밑에서 놓아 미달 복귀 스프링이 주인공 (04)
    //   over   진폭 170 — 깊은 당김. 포화 곡선 대비가 크게 보인다 (02)
    // 좌표는 매 틱 연속 이동(424 규칙) · 첫 변화 t>=200ms(418 규칙)
    function ptrRoute(t, amp) {
        if (t < 250) {
            return 0;
        }
        if (t < 1250) {
            return amp * Math.sin(Math.PI * (t - 250) / 1000);
        }
        if (t < 1750) {
            return amp;
        }
        return 0;
    }
    // 변환 — raw(px) 를 표시 오프셋(px) 으로. 저항 = 발거리^k 감쇠:
    //   RESIST_START 아래는 1:1, 위에서는 진행비의 0.35 제곱에 ELASTIC_SATURATE 를 곱해 포화시킨다
    function elasticMap(raw, resPx, sat, k) {
        if (raw <= resPx) {
            return raw;
        }
        const prog = 1 - resPx / Math.max(raw, 1);
        return resPx + (raw - resPx) * sat * Math.pow(clamp(prog, 0.05, 1), k);
    }
    function springStep(sp, stiff, damp, dtms) {
        const dt = dtms / 1000;
        sp.v += (-stiff * sp.x - damp * sp.v) * dt;
        sp.x += sp.v * dt;
    }
    // 스프링 시뮬레이션(프로브 표기용 — 실제 화면은 rAF 적분): 바운스 = |v| 가 방향을 바꾼 횟수
    function springSim(x0, stiff, damp) {
        const sp = { x: x0, v: 0 };
        let t = 0;
        let bounces = 0;
        let lastV = 0;
        let settledAt = -1;
        while (t < 2000) {
            springStep(sp, stiff, damp, 1000 / 60);
            t += 1000 / 60;
            if (lastV !== 0 && sp.v * lastV < 0) {
                bounces += 1;
            }
            if (sp.v !== 0) {
                lastV = sp.v;
            }
            if (settledAt < 0 && Math.abs(sp.x) < 0.5 && Math.abs(sp.v) < 4) {
                settledAt = t;
                break;
            }
        }
        return { settleMs: settledAt < 0 ? t : settledAt, bounces: bounces };
    }
    // ── 포인터 이벤트 좌표를 무대(480x300) 좌표로 — 실제 손 조작 경로 공용
    function stagePoint(e) {
        const r = sceneEl.getBoundingClientRect();
        const k = (rootEl.clientWidth / W) || 1;
        return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k };
    }
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            cycle = Math.max(2000, cfg.build(pi));
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                setPaused(true);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            // 움직임 줄이기 — 루프를 돌리지 않고 완료 상태 한 장(frame(1e9) 1회) + 문구(393 규칙)
            cfg.frame(1e9);
            statusP.textContent = readB.textContent;
            doneP.textContent = readB.textContent;
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }
    // 09 overscroll 토글 — overscroll-behavior-y: contain 로 크롬 기본 당김을 막은 컨테이너 안에서
    //    토글을 끄면 임계 판정과 리스너를 함께 해제(removeEventListener)해 브라우저 기본이 돌아온다
    const FIRE_THRESHOLD_PX = 70;
    const RUN_MS = 420;
    let tg09 = null;
    let bar09 = null;
    let spin09 = null;
    let outer09 = null;
    let cap09 = null;
    let on09 = true;
    let mode09 = 'idle';
    let att09 = false; // 실제 리스너 부착 여부
    function pull09(raw) {
        if (bar09) {
            bar09.style.transform = 'translateY(' + f1(Math.max(0, raw) * 0.5) + 'px)';
        }
    }
    function realDown09(ev) {
        att09 = true;
        if (on09) {
            pull09(stagePoint(ev).y - 40);
            ev.preventDefault();
        }
    }
    function realMove09(ev) {
        if (on09) {
            pull09(stagePoint(ev).y - 60);
        }
    }
    function build(_i) {
        outer09 = make('i', 'ovsc', scWrap);
        put(outer09, 0, 0, 448, 156);
        bar09 = make('i', 'pullbar', scWrap);
        spin09 = make('i', 'spinner', scWrap);
        put(spin09, 16, 10, 16, 16);
        for (let k = 0; k < 4; k += 1) {
            const row = make('i', 'row row--mini', scWrap);
            put(row, 12, 84 + k * 16, 360, 12);
        }
        tg09 = document.createElement('button');
        tg09.type = 'button';
        tg09.className = cx('tg09 is-on');
        tg09.textContent = '끄기';
        tg09.setAttribute('aria-pressed', 'true');
        scWrap.appendChild(tg09);
        put(tg09, 340, 22, 64, 22);
        cap09 = make('b', 'ov ovs', sceneEl);
        put(cap09, 12, 60, 220, 12);
        drawRows([spanOf(250, 1000), spanOf(1000, 500), spanOf(1500, 500)], 2000);
        axis(2000);
        setReads('overscroll-behavior-y: contain — 켜짐. 끄면 removeEventListener 로 판정·리스너가 함께 해제된다', 'contain 이 없으면 브라우저가 먼저 당겨진다 — 토글 off 에선 커스텀 판정이 사라지고 기본 동작이 돌아온다');
        return 2000;
    }
    function toggle09() {
        on09 = !on09;
        if (tg09) {
            tg09.textContent = on09 ? '끄기' : '켜기';
            tg09.setAttribute('aria-pressed', on09 ? 'true' : 'false');
            tg09.className = cx(on09 ? 'tg09 is-on' : 'tg09 is-off');
        }
        if (cap09) {
            cap09.textContent = on09 ? '커스텀 당김 활성' : '브라우저 기본 반환';
        }
        if (!on09) {
            // off — 임계 판정·리스너 해제. touch-action 도 auto 로 돌려 브라우저 동작을 되살린다
            sceneEl.removeEventListener('pointerdown', realDown09);
            sceneEl.removeEventListener('pointermove', realMove09);
            if (bar09) {
                bar09.style.transform = 'translateY(0)';
            }
        }
        else {
            sceneEl.addEventListener('pointerdown', realDown09);
            sceneEl.addEventListener('pointermove', realMove09);
        }
        doneP.textContent = on09 ? '당겨서 새로고침 켜짐' : '당겨서 새로고침 꺼짐 — 브라우저 기본';
    }
    function frame(t) {
        // 두 주기: 1 주기(0~999) 켜짐 — 당김→발사 → 1000ms 컷으로 끔 → 2 주기 꺼짐 — 계기만 흔들리고 판정 없음
        const half = t < 1000;
        if (half && !on09) {
            toggle09();
        }
        if (!half && on09) {
            toggle09();
        }
        if (half) {
            if (t >= 250 && t < 850) {
                mode09 = 'pull';
                if (bar09) {
                    bar09.style.transform = 'translateY(' + f1(56 * Math.sin(Math.PI * (t - 250) / 600)) + 'px)';
                }
            }
            else if (t < 1000) {
                mode09 = 'run';
                if (bar09) {
                    bar09.style.transform = 'translateY(40px)';
                }
            }
            if (t >= 860 && t <= 940) {
                doneP.textContent = '새로고침 실행 — contain 이 브라우저 기본 당김을 막았다';
            }
        }
        else {
            const u = t - 1000;
            mode09 = 'dead';
            // 꺼짐 — 계기(바늘)는 흔들려도 커스텀 판정은 없다: 바가 따라오지 않는다
            if (bar09) {
                bar09.style.transform = 'translateY(' + f1(6 * Math.sin(Math.PI * clamp(u / 700, 0, 1))) + 'px)';
            }
        }
        if (spin09) {
            spin09.style.transform = 'rotate(' + f0(t * 0.45) + 'deg)';
            spin09.style.opacity = mode09 === 'run' ? '1' : '0.2';
        }
        return fill('지금 {a} · {b}', half ? '켜짐 — 커스텀 판정' : '꺼짐 — 브라우저 기본', mode09 === 'run' ? '실행' : (mode09 === 'dead' ? '반응 없음' : '당김'));
    }
    // 실제 입력 경로 — 토글 클릭(키보드 Enter·Space 포함)이 같은 toggle09 를 탄다. 초기 부착
    const tg09ref = tg09;
    if (tg09ref) {
        tg09ref.addEventListener('click', toggle09);
        tg09ref.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') {
                ev.preventDefault();
                toggle09();
            }
        });
    }
    sceneEl.addEventListener('pointerdown', realDown09);
    sceneEl.addEventListener('pointermove', realMove09);
    return run({ count: 1, build: build, frame: frame });
}
})();
</script>
</body>
</html>
