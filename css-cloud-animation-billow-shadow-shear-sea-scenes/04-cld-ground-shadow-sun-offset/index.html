<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해 높이만큼 비껴 지나는 언덕 위 구름 그림자 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cl is-demo" id="cl">
  <canvas class="cl__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="언덕 들판 위 구름층이 바람에 흐르고, 오른쪽 위 해에서 비스듬히 내려온 점선 빛줄기를 따라 구름 그림자가 구름 바로 아래가 아니라 비껴 난 자리에 떨어지며 비탈마다 길이가 다르다"></canvas>
  <p class="cl__status" data-role="status" aria-live="off">하늘을 읽는 중</p>
  <button class="cl__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("cl");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 0~1 사이를 3차로 부드럽게 — 양 끝에서 기울기 0
    function smooth01(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // edge0 에서 0, edge1 에서 1 로 부드럽게 넘어가는 문턱
    function band(edge0, edge1, x) { return smooth01((x - edge0) / (edge1 - edge0)); }
    function toRad(deg) { return deg * Math.PI / 180; }
    // 시드 고정 난수 — 같은 시드면 같은 시연 (32비트 xorshift 에 곱셈 섞기 한 번)
    function seeded(seed) {
        let s = (seed * 2654435761) >>> 0 || 1;
        return function () {
            s ^= s << 13;
            s >>>= 0;
            s ^= s >>> 17;
            s ^= s << 5;
            s >>>= 0;
            return (Math.imul(s, 0x9e3779b1) >>> 0) / 4294967296;
        };
    }
    // ── 노이즈 ──────────────────────────────────────────────────
    // 격자 꼭짓점마다 정수 해시로 0~1 값 하나 — 같은 (ix, iy, seed) 면 늘 같은 값
    function latticeValue(ix, iy, seed) {
        let h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed, 1103515245)) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
    }
    // 값 노이즈 — 둘레 네 꼭짓점 값을 3차로 부드럽게 섞는다. 결과 0~1
    function valueNoise(x, y, seed) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        const fx = x - ix;
        const fy = y - iy;
        const ux = fx * fx * (3 - 2 * fx);
        const uy = fy * fy * (3 - 2 * fy);
        const a = latticeValue(ix, iy, seed);
        const b = latticeValue(ix + 1, iy, seed);
        const c = latticeValue(ix, iy + 1, seed);
        const d = latticeValue(ix + 1, iy + 1, seed);
        return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
    }
    // 여러 겹 노이즈 합 — 겹마다 빈도 2배·세기 절반으로 octaves 겹을 더해 전체 세기 합으로 나눈다. 결과 0~1
    function layeredNoise(x, y, octaves, seed) {
        let sum = 0;
        let amp = 1;
        let norm = 0;
        let f = 1;
        for (let k = 0; k < octaves; k += 1) {
            sum += valueNoise(x * f, y * f, seed + k * 101) * amp;
            norm += amp;
            amp *= 0.5;
            f *= 2;
        }
        return sum / norm;
    }
    // 정수 나머지를 늘 0 이상으로
    function wrapIndex(i, n) { const r = i % n; return r < 0 ? r + n : r; }
    // 주기 값 노이즈 — 가로 격자 번호를 period 로 나머지 처리해, x 가 period 만큼 가면 처음과 같은 값이 된다
    function periodicNoise(x, y, period, seed) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        const fx = x - ix;
        const fy = y - iy;
        const ux = fx * fx * (3 - 2 * fx);
        const uy = fy * fy * (3 - 2 * fy);
        const x0 = wrapIndex(ix, period);
        const x1 = wrapIndex(ix + 1, period);
        const a = latticeValue(x0, iy, seed);
        const b = latticeValue(x1, iy, seed);
        const c = latticeValue(x0, iy + 1, seed);
        const d = latticeValue(x1, iy + 1, seed);
        return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
    }
    // 주기 여러 겹 노이즈 합 — 겹마다 빈도와 주기를 함께 2배로 해, 모든 겹이 같은 거리에서 한 바퀴를 돈다
    function periodicLayered(x, y, period, octaves, seed) {
        let sum = 0;
        let amp = 1;
        let norm = 0;
        let f = 1;
        for (let k = 0; k < octaves; k += 1) {
            sum += periodicNoise(x * f, y * f, period * f, seed + k * 101) * amp;
            norm += amp;
            amp *= 0.5;
            f *= 2;
        }
        return sum / norm;
    }
    function makeField(gw, gh) { return { gw: gw, gh: gh, v: new Float32Array(gw * gh) }; }
    // 칸 사이 값을 네 칸 섞어 읽는다 — 격자 밖은 0
    function sampleField(f, x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        if (ix < 0 || iy < 0 || ix >= f.gw - 1 || iy >= f.gh - 1) {
            return 0;
        }
        const fx = x - ix;
        const fy = y - iy;
        const i = iy * f.gw + ix;
        const a = f.v[i];
        const b = f.v[i + 1];
        const c = f.v[i + f.gw];
        const d = f.v[i + f.gw + 1];
        return lerp(lerp(a, b, fx), lerp(c, d, fx), fy);
    }
    // 구름 양 — 짙기가 level 을 넘는 칸의 몫(0~1)
    function coverOf(f, level) {
        let n = 0;
        for (let i = 0; i < f.v.length; i += 1) {
            if (f.v[i] > level) {
                n += 1;
            }
        }
        return n / f.v.length;
    }
    // ── 파스텔 팔레트 ────────────────────────────────────────────
    // 하늘·구름·땅은 파스텔, 구름 아랫면·그림자처럼 명도로 읽히는 것은 명도 차를 크게 둔다. 글자는 진한 INK
    const PAPER = [250, 246, 240];
    const INK = [40, 36, 54];
    const SKY_HIGH = [124, 160, 222];
    const SKY_LOW = [198, 216, 244];
    const CLOUD = [253, 251, 255];
    const CLOUD_SHADE = [142, 140, 182];
    const LAVENDER = [190, 176, 232];
    const PEACH = [250, 202, 172];
    const ROSE = [236, 168, 182];
    const BUTTER = [250, 226, 156];
    const MINT = [168, 214, 188];
    const GRASS = [160, 204, 146];
    const GRASS_SHADE = [76, 118, 98];
    const CORAL_DEEP = [176, 66, 54];
    const MINT_DEEP = [32, 110, 86];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // ── 상태 줄 낱말 ─────────────────────────────────────────────
    // 지금 하늘 — 구름 양(5% 단위)·해 높이(땅에서 잰 각, 도)·바람 방향. 숫자를 반올림해 글자가 매 프레임 바뀌지 않게
    function windName(dir) {
        if (dir > 0) {
            return '오른쪽으로';
        }
        if (dir < 0) {
            return '왼쪽으로';
        }
        return '잔잔함';
    }
    function skyText(cover, sunDeg, windDir) {
        return '구름 양 {c}% · 해 높이 {s}° · 바람 {w}'
            .replace('{c}', String(Math.round(clamp(cover, 0, 1) * 20) * 5))
            .replace('{s}', String(Math.round(sunDeg)))
            .replace('{w}', windName(windDir));
    }
    // 장면 시계(초) — 장면 계산이 고치고 화면 쪽이 읽는다
    let sceneT = 0;
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function makePix(w, h) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const x = c.getContext('2d');
        return { w: w, h: h, img: x.createImageData(w, h), c: c, x: x };
    }
    // 화소 하나 쓰기(불투명)
    function putPx(p, i, c) {
        const d = p.img.data;
        const k = i * 4;
        d[k] = c[0];
        d[k + 1] = c[1];
        d[k + 2] = c[2];
        d[k + 3] = 255;
    }
    // 판을 화면 자리 (dx, dy, dw, dh) 로 늘려 그린다 — 부드럽게 늘려 칸 경계가 보이지 않게
    function blit(p, dx, dy, dw, dh) {
        p.x.putImageData(p.img, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(p.c, dx, dy, dw, dh);
    }
    function fillAll(c) {
        ctx.fillStyle = rgba(c, 1);
        ctx.fillRect(0, 0, W, H);
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function seg(x1, y1, x2, y2, width, c, a, dash) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.setLineDash(dash > 0 ? [dash, dash] : []);
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
        ctx.setLineDash([]);
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function frameBox(x, y, w, h, r, width, c, a) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 글자 이름표 — 밝은 알약 위에 진한 글자
    function tag(s, x, y, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, PAPER, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    // 위아래 두 색 하늘 — 화면 쪽 꾸밈 한 겹
    function skyGradient(top, bottom, y0, y1) {
        const g = ctx.createLinearGradient(0, y0, 0, y1);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bottom, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, y0, W, y1 - y0);
    }
    // 상태 줄 — 글자가 바뀔 때만 고친다
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    // ── 04 해 높이만큼 비껴 지나는 언덕 위 구름 그림자 ───────────────
    // 옆에서 본 들판. 높이는 바닥 줄(BASE_Y)에서 위로 잰 px. 해는 오른쪽 위 — 빛은 오른쪽 위에서 왼쪽 아래로 내려온다
    const BASE_Y = 292;
    // 해 높이각 — 땅(수평)에서 잰 각. 작을수록 해가 낮다
    const SUN_ELEV_DEG = 50;
    // 구름층 높이(px)와 두께 절반
    const CLOUD_H = 212;
    const CLOUD_HALF = 34;
    // 바람 — 구름 노이즈를 초당 WIND_PX 만큼 오른쪽으로 민다
    const WIND_PX = 30;
    // 그림자 진하기 = SHADOW_DEPTH × (구름 기둥 짙기를 부드럽게 0~1 로)
    const SHADOW_DEPTH = 0.62;
    const GRID_W = 240;
    const GRID_H = 150;
    const CELL = W / GRID_W;
    const LOOP_S = 0;
    const START_T = 3;
    const REST_T = 3;
    const cloud04 = makeField(GRID_W, GRID_H);
    // 열마다 구름층을 세로로 평균낸 짙기(0~1)
    const column04 = new Float32Array(GRID_W);
    // 언덕 높이 h(x)(px) — 여러 겹 노이즈 합 한 줄
    function terrainH(x) { return 34 + 92 * layeredNoise(x / 120, 3.5, 3, 41); }
    // 비탈 기울기 h'(x) — 양쪽 1px 차
    function terrainSlope(x) { return (terrainH(x + 1) - terrainH(x - 1)) / 2; }
    function sunVec() { const e = toRad(SUN_ELEV_DEG); return [Math.cos(e), Math.sin(e)]; }
    // 땅 점 (x, h) 에서 해 쪽으로 구름층 높이까지 거슬러 올라간 자리 — x + (CLOUD_H − h) / tan(높이각)
    function shadowSourceX(x, h) { return x + (CLOUD_H - h) / Math.tan(toRad(SUN_ELEV_DEG)); }
    // 비탈 법선과 해 방향의 내적 — 1 이면 해를 정면으로, 0 이하면 해를 등진 비탈
    function sunFacing(x) {
        const s = terrainSlope(x);
        const v = sunVec();
        return (-s * v[0] + v[1]) / Math.hypot(s, 1);
    }
    function cloudDensity04(x, hy, t) {
        const profile = smooth01(1 - Math.abs(hy - CLOUD_H) / CLOUD_HALF);
        if (profile <= 0) {
            return 0;
        }
        const n = layeredNoise((x - t * WIND_PX) / 64, hy / 30, 4, 44);
        return clamp((n * profile - 0.25) * 3.4, 0, 1);
    }
    function buildCloud(t) {
        column04.fill(0);
        let rows = 0;
        for (let gy = 0; gy < GRID_H; gy += 1) {
            const hy = BASE_Y - (gy + 0.5) * CELL;
            const inBand = Math.abs(hy - CLOUD_H) < CLOUD_HALF;
            if (inBand) {
                rows += 1;
            }
            for (let gx = 0; gx < GRID_W; gx += 1) {
                const v = inBand ? cloudDensity04((gx + 0.5) * CELL, hy, t) : 0;
                cloud04.v[gy * GRID_W + gx] = v;
                column04[gx] += v;
            }
        }
        for (let gx = 0; gx < GRID_W; gx += 1) {
            column04[gx] /= Math.max(1, rows);
        }
    }
    // 화면 x 자리의 구름 기둥 짙기(열 사이 섞기, 화면 밖은 노이즈를 직접 읽는다)
    function columnAt(x, t) {
        const g = x / CELL - 0.5;
        if (g >= 0 && g < GRID_W - 1) {
            const i = Math.floor(g);
            return lerp(column04[i], column04[i + 1], g - i);
        }
        let s = 0;
        let n = 0;
        for (let hy = CLOUD_H - CLOUD_HALF + CELL / 2; hy < CLOUD_H + CLOUD_HALF; hy += CELL) {
            s += cloudDensity04(x, hy, t);
            n += 1;
        }
        return s / Math.max(1, n);
    }
    // 땅 점 x 의 그림자 진하기 0~SHADOW_DEPTH
    function shadowAt(x, t) {
        const src = shadowSourceX(x, terrainH(x));
        return SHADOW_DEPTH * smooth01(columnAt(src, t) * 2.4);
    }
    function reset() { }
    function update(dt) { }
    // ── 04 화면 ──────────────────────────────────────────────────
    const pix04 = makePix(GRID_W, GRID_H);
    const surf04 = new Float32Array(GRID_W);
    const face04 = new Float32Array(GRID_W);
    const shade04 = new Float32Array(GRID_W);
    // 땅 겉면 띠 두께(px) — 이 아래 단면은 해 받는 정도와 상관없는 한 톤
    const SURFACE_PX = 30;
    // 빛줄기 하나 — 구름 자리 (x, 구름층 높이) 에서 해 반대쪽(왼쪽 아래)으로 땅에 닿을 때까지
    function rayToGround(xc) {
        const v = sunVec();
        let x = xc;
        let h = CLOUD_H;
        for (let k = 0; k < 400; k += 1) {
            if (h <= terrainH(x)) {
                break;
            }
            x -= v[0] * 2;
            h -= v[1] * 2;
        }
        return [x, BASE_Y - h];
    }
    function draw() {
        buildCloud(sceneT);
        for (let gx = 0; gx < GRID_W; gx += 1) {
            const x = (gx + 0.5) * CELL;
            surf04[gx] = terrainH(x);
            face04[gx] = sunFacing(x);
            shade04[gx] = shadowAt(x, sceneT);
        }
        const v = sunVec();
        const d = pix04.img.data;
        for (let gy = 0; gy < GRID_H; gy += 1) {
            const hy = BASE_Y - (gy + 0.5) * CELL;
            const sky = mix(SKY_HIGH, SKY_LOW, gy / GRID_H);
            for (let gx = 0; gx < GRID_W; gx += 1) {
                const i = gy * GRID_W + gx;
                let c;
                if (hy < surf04[gx]) {
                    // 땅 — 겉면 띠(위 SURFACE_PX)는 해를 향한 정도로 밝기, 더 깊은 단면은 한 톤 어두운 풀빛으로 내려간다.
                    // 구름 그림자는 겉면에서 가장 진하고 깊이 들어갈수록 옅게(단면 전체가 세로 줄무늬로 보이지 않게)
                    const depth = band(0, SURFACE_PX, surf04[gx] - hy);
                    const lit = 0.3 + 0.7 * Math.max(0, face04[gx]);
                    const grass = mix(mix(GRASS_SHADE, GRASS, lit), mix(GRASS_SHADE, GRASS, 0.42), depth);
                    c = mix(grass, [52, 82, 74], shade04[gx] * (1 - 0.85 * depth));
                }
                else {
                    c = sky;
                    const cv04 = cloud04.v[i];
                    if (cv04 > 0) {
                        let s = 0;
                        for (let k = 1; k <= 5; k += 1) {
                            s += sampleField(cloud04, gx + v[0] * k * 1.5, gy - v[1] * k * 1.5);
                        }
                        const cl = mix(CLOUD_SHADE, CLOUD, Math.exp(-0.55 * s));
                        c = mix(sky, cl, 1 - Math.exp(-3 * cv04));
                    }
                }
                const k = i * 4;
                d[k] = c[0];
                d[k + 1] = c[1];
                d[k + 2] = c[2];
                d[k + 3] = 255;
            }
        }
        blit(pix04, 0, 0, W, H);
        // 해 — 높이각 방향, 들판 가운데에서 230px
        const sx = 250 + v[0] * 230;
        const sy = 270 - v[1] * 230;
        disc(sx, sy, 16, BUTTER, 1);
        // 가장 짙은 구름 기둥 두 곳에서 그림자 자리까지 점선 빛줄기
        let best = -1;
        let second = -1;
        for (let gx = 20; gx < GRID_W - 20; gx += 1) {
            if (best < 0 || column04[gx] > column04[best]) {
                best = gx;
            }
        }
        for (let gx = 20; gx < GRID_W - 20; gx += 1) {
            if (Math.abs(gx - best) > 40 && (second < 0 || column04[gx] > column04[second])) {
                second = gx;
            }
        }
        for (const g of [best, second]) {
            if (g < 0 || column04[g] < 0.15) {
                continue;
            }
            const xc = (g + 0.5) * CELL;
            const hit = rayToGround(xc);
            seg(xc, BASE_Y - CLOUD_H, hit[0], hit[1], 1.5, INK, 0.6, 4);
            disc(hit[0], hit[1], 3, INK, 0.7);
        }
        tag('해 높이 {d}°'.replace('{d}', String(SUN_ELEV_DEG)), sx, sy + 28, INK, 11, 'center');
    }
    function statusText() { return skyText(coverOf(cloud04, 0.1) * GRID_H / (2 * CLOUD_HALF / CELL), SUN_ELEV_DEG, 1); }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 버튼을 누르면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 한 프레임에 넘기는 시간 상한(초) — 오래 숨었다 돌아온 첫 프레임도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    function advance(dt) {
        sceneT += dt;
        if (LOOP_S > 0 && sceneT >= LOOP_S) {
            sceneT -= LOOP_S;
            reset();
        }
        update(dt);
    }
    // 처음부터 t 초까지 1/60초 고정 걸음으로 감아 둔다 — 첫 화면·정지 장면이 빈 하늘로 시작하지 않게
    function runTo(t) {
        sceneT = 0;
        reset();
        const h = 1 / 60;
        while (sceneT + h <= t) {
            advance(h);
        }
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        draw();
        pushStatus(statusText());
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 대표 순간(REST_T 초)의 하늘 한 장
    function showRest() {
        stopLoop();
        runTo(REST_T);
        draw();
        pushStatus(statusText());
    }
    // 자동 시연은 START_T 초 자리에서 시작한다(첫 화면에 장면 핵심이 보이게). LOOP_S 가 있는 장면은 한 바퀴를 돌면 0초부터
    function play() {
        runTo(START_T);
        draw();
        pushStatus(statusText());
        if (!paused) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 정지 장면, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw();
    }, { signal: off.signal });
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
