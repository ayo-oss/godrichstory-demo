<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto height transition — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ah is-demo" id="ah" aria-label="칸 수가 다른 단계를 잇는 신청 폼">
    <div class="ah__bar" id="ah-bar" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" aria-label="단계 진행">
      <span class="ah__seg" data-seg="1"><span class="ah__seg-f"></span></span>
      <span class="ah__seg" data-seg="2"><span class="ah__seg-f"></span></span>
      <span class="ah__seg" data-seg="3"><span class="ah__seg-f"></span></span>
    </div>
    <div class="ah__box" id="ah-box">
      <div class="ah__panel is-on" data-step="1">
        <p class="ah__t">1 / 3 · 계정</p>
        <input class="ah__f" type="text" placeholder="이메일">
        <input class="ah__f" type="text" placeholder="비밀번호">
      </div>
      <div class="ah__panel" data-step="2">
        <p class="ah__t">2 / 3 · 배송</p>
        <input class="ah__f" type="text" placeholder="받는 사람">
        <input class="ah__f" type="text" placeholder="주소">
        <input class="ah__f" type="text" placeholder="연락처">
      </div>
      <div class="ah__panel" data-step="3">
        <p class="ah__t">3 / 3 · 확인</p>
        <input class="ah__f" type="text" placeholder="쿠폰 코드">
        <p class="ah__note">보내기 전에 앞 단계에서 적은 값을 다시 확인하세요. 고칠 곳이 있으면 이전으로 돌아갑니다.</p>
      </div>
    </div>
    <div class="ah__foot">
      <button class="ah__btn" type="button" id="ah-prev">이전</button>
      <button class="ah__btn ah__btn--go" type="button" id="ah-next">다음</button>
    </div>
  </section>
</main>
<script>
// 실제 동작: 단계를 바꿀 때마다 그 패널의 실제 높이를 재서 --h 에 넣는다.
// --h 는 길이형으로 등록돼 있어 상자가 그 값까지 흐른다(짐작한 고정 높이가 아니다).
var ah = document.getElementById('ah');
var ahBox = document.getElementById('ah-box');
var ahBar = document.getElementById('ah-bar');
var ahPanels = [].slice.call(ah.querySelectorAll('.ah__panel'));
var ahSegs = [].slice.call(ah.querySelectorAll('.ah__seg'));
var ahStep = 1;
function ahGo(n) {
  ahStep = Math.max(1, Math.min(ahPanels.length, n));
  ahPanels.forEach(function (p, i) { p.classList.toggle('is-on', i + 1 === ahStep); });
  ahSegs.forEach(function (s, i) { s.classList.toggle('is-done', i + 1 <= ahStep); });
  var h = Math.ceil(ahPanels[ahStep - 1].getBoundingClientRect().height);
  ahBox.style.setProperty('--h', h + 'px');
  ahBar.setAttribute('aria-valuenow', String(ahStep));
}
function ahMove(d) { ah.classList.remove('is-demo'); ahGo(ahStep + d); }
document.getElementById('ah-next').addEventListener('click', function () { ahMove(1); });
document.getElementById('ah-prev').addEventListener('click', function () { ahMove(-1); });
ah.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') { e.preventDefault(); ahMove(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); ahMove(-1); }
});
ahGo(1);
</script>
</body>
</html>
