<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume draft banner — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="rb is-demo" id="rb" aria-label="쓰다 만 자리를 기억하는 신청서">
    <div class="rb__bar" id="rb-bar" role="status" aria-live="polite">
      <span class="rb__bar-i" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M136 80v43.47l36.12 21.67a8 8 0 0 1-8.24 13.72l-40-24A8 8 0 0 1 120 128V80a8 8 0 0 1 16 0m-8-48a95.44 95.44 0 0 0-67.92 28.15C52.81 67.51 46.35 74.59 40 82V64a8 8 0 0 0-16 0v40a8 8 0 0 0 8 8h40a8 8 0 0 0 0-16H49c7.15-8.42 14.27-16.35 22.39-24.57a80 80 0 1 1 1.66 114.75a8 8 0 1 0-11 11.64A96 96 0 1 0 128 32"/></g></svg></span>
      <p class="rb__bar-t">쓰다 만 자리가 있습니다</p>
      <span class="rb__bar-a">
        <button class="rb__b rb__b--go" type="button" id="rb-resume" data-t="{n}단계부터 이어서">3단계부터 이어서</button>
        <button class="rb__b" type="button" id="rb-fresh">새로 쓰기</button>
      </span>
    </div>
    <div class="rb__form">
      <div class="rb__head">
        <p class="rb__h">
          <span class="rb__now"><b class="rb__d" data-d="1">1</b><b class="rb__d" data-d="3">3</b></span> / 4 · 신청서
        </p>
        <p class="rb__save" id="rb-save">자동 저장됨</p>
      </div>
      <div class="rb__dots" aria-hidden="true">
        <span class="rb__dot" data-dot="1"><span class="rb__dot-f"></span></span>
        <span class="rb__dot" data-dot="2"><span class="rb__dot-f"></span></span>
        <span class="rb__dot" data-dot="3"><span class="rb__dot-f"></span></span>
        <span class="rb__dot" data-dot="4"><span class="rb__dot-f"></span></span>
      </div>
      <input class="rb__in" id="rb-in" type="text" placeholder="받는 사람 이름" aria-label="받는 사람 이름">
    </div>  </section>
</main>
<script>
// 실제 동작: 칸을 칠 때마다 단계 번호와 값을 localStorage 에 적고,
// 열 때 저장된 게 있으면 그 단계로 데려다 준다. iframe 이 저장소를 막을 수 있어 try/catch.
var rb = document.getElementById('rb');
var rbIn = document.getElementById('rb-in');
var rbGo = document.getElementById('rb-resume');
var rbMark = document.getElementById('rb-save');
var RB_KEY = 'godrich-265-04';
var rbStep = 1;
function rbRead() {
  try { return JSON.parse(localStorage.getItem(RB_KEY) || 'null'); } catch (e) { return null; }
}
function rbWrite(o) {
  try { localStorage.setItem(RB_KEY, JSON.stringify(o)); } catch (e) {}
}
function rbAt(n) { rbStep = n; rb.classList.toggle('is-at3', n >= 3); }
var rbDraft = rbRead();
if (!rbDraft) {
  // 데모라 직전 세션이 없다 — 이어쓸 거리가 있도록 예시 초안을 한 번 적어 둔다
  rbDraft = { step: 3, v: '' };
  rbWrite(rbDraft);
}
rbGo.textContent = rbGo.getAttribute('data-t').replace('{n}', rbDraft.step);
rbIn.addEventListener('input', function () {
  rb.classList.remove('is-demo');
  rbWrite({ step: rbStep, v: rbIn.value });
  rbMark.classList.add('is-on');
});
rbGo.addEventListener('click', function () {
  rb.classList.remove('is-demo');
  var d = rbRead();
  rbAt(d ? d.step : 1);
  rbIn.value = d ? d.v : '';
  rbIn.focus({ preventScroll: true });
});
document.getElementById('rb-fresh').addEventListener('click', function () {
  rb.classList.remove('is-demo');
  rbWrite({ step: 1, v: '' });
  rb.classList.add('is-fresh');
  rbAt(1);
  rbIn.value = '';
  rbIn.focus({ preventScroll: true });
});
rbAt(1);
</script>
</body>
</html>
