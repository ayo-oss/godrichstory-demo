<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incomplete step return — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ir is-demo" id="ir" aria-label="Application steps">
    <ol class="ir__steps" aria-label="Step markers">
      <li class="ir__step" data-step="1">
        <span class="ir__bar" aria-hidden="true"></span>
        <span class="ir__cap"><span class="ir__n">1</span><span class="ir__warn" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88m-8-80V80a8 8 0 0 1 16 0v56a8 8 0 0 1-16 0m20 36a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></svg></span></span>
      </li>
      <li class="ir__step" data-step="2">
        <span class="ir__bar" aria-hidden="true"></span>
        <span class="ir__cap"><span class="ir__n">2</span><span class="ir__warn" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88m-8-80V80a8 8 0 0 1 16 0v56a8 8 0 0 1-16 0m20 36a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></svg></span></span>
      </li>
      <li class="ir__step" data-step="3">
        <span class="ir__bar" aria-hidden="true"></span>
        <span class="ir__cap"><span class="ir__n">3</span><span class="ir__warn" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88m-8-80V80a8 8 0 0 1 16 0v56a8 8 0 0 1-16 0m20 36a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></svg></span></span>
      </li>
      <li class="ir__step" data-step="4">
        <span class="ir__bar" aria-hidden="true"></span>
        <span class="ir__cap"><span class="ir__n">4</span><span class="ir__warn" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88m-8-80V80a8 8 0 0 1 16 0v56a8 8 0 0 1-16 0m20 36a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></svg></span></span>
      </li>
    </ol>

    <div class="ir__view">
      <div class="ir__track" id="ir-track">
        <div class="ir__panel">
          <h3 class="ir__title" tabindex="-1">Step 1 · Name</h3>
          <div class="ir__field">
            <label class="ir__lab" for="ir-f1">Name</label>
            <input class="ir__in" id="ir-f1" type="text" value="Dana Kim" aria-invalid="false" autocomplete="off">
          </div>
        </div>
        <div class="ir__panel">
          <h3 class="ir__title" tabindex="-1">Step 2 · Contact</h3>
          <div class="ir__field">
            <label class="ir__lab" for="ir-f2">Mobile</label>
            <input class="ir__in" id="ir-f2" type="text" value="+1 555 0134" aria-invalid="false" autocomplete="off">
          </div>
        </div>
        <div class="ir__panel">
          <h3 class="ir__title" tabindex="-1">Step 3 · Delivery</h3>
          <div class="ir__field">
            <label class="ir__lab" for="ir-f3">Address</label>
            <input class="ir__in" id="ir-f3" type="text" value="" placeholder="Street address" aria-invalid="false" autocomplete="off">
          </div>
        </div>
        <div class="ir__panel">
          <h3 class="ir__title" tabindex="-1">Step 4 · Request</h3>
          <div class="ir__field">
            <label class="ir__lab" for="ir-f4">Request</label>
            <input class="ir__in" id="ir-f4" type="text" value="Leave with the front desk" aria-invalid="false" autocomplete="off">
          </div>
        </div>
      </div>
    </div>

    <div class="ir__foot">
      <p class="ir__msg">
        <span class="ir__msg-a">Submits once no field is blank</span>
        <span class="ir__msg-b">Sent back to the step with a blank</span>
      </p>
      <button class="ir__submit" type="button" id="ir-submit">
        <span class="ir__send" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="m223.69 42.18l-58.22 192a8 8 0 0 1-14.92 1.25L108 148l-87.42-42.55a8 8 0 0 1 1.25-14.92l192-58.22a8 8 0 0 1 9.86 9.87" opacity=".2"/><path d="M227.32 28.68a16 16 0 0 0-15.66-4.08h-.15L19.57 82.84a16 16 0 0 0-2.49 29.8L102 154l41.3 84.87a15.86 15.86 0 0 0 14.44 9.13q.69 0 1.38-.06a15.88 15.88 0 0 0 14-11.51l58.2-191.94v-.15a16 16 0 0 0-4-15.66m-69.49 203.17l-.05.14v-.07l-40.06-82.3l48-48a8 8 0 0 0-11.31-11.31l-48 48l-82.33-40.06h-.07h.14L216 40Z"/></g></svg></span>
        <span class="ir__submit-t">Submit</span>
      </button>
    </div>
  </section>
</main>
<script>
// 실제 동작: 제출을 누르면 단계를 앞에서부터 훑어 input.value 가 빈 첫 단계로 되돌아간다.
// 화면만 바꾸는 흉내가 아니라 값을 읽고 비교한 결과가 --i 와 aria-invalid 로 나간다.
var ir = document.getElementById('ir');
var irPanels = [].slice.call(ir.querySelectorAll('.ir__panel'));
var irSteps = [].slice.call(ir.querySelectorAll('.ir__step'));
function irGo(n, bad) {
  ir.style.setProperty('--i', n);
  irSteps.forEach(function (s, i) {
    s.classList.toggle('is-now', i === n);
    s.classList.toggle('is-bad', bad && i === n);
  });
  irPanels.forEach(function (p, i) { p.setAttribute('aria-hidden', i === n ? 'false' : 'true'); });
}
function irSubmit() {
  ir.classList.remove('is-demo');
  var first = -1;
  for (var i = 0; i < irPanels.length; i++) {          // 앞에서부터 훑는다
    var f = irPanels[i].querySelector('.ir__in');
    var blank = f.value.trim() === '';
    f.setAttribute('aria-invalid', blank ? 'true' : 'false');
    if (blank && first < 0) first = i;
  }
  ir.classList.toggle('is-bad', first >= 0);
  if (first < 0) { irGo(irPanels.length - 1, false); return; }
  irGo(first, true);
  // 되돌아간 단계의 제목이 초점을 받는다. iframe 안이라 부모를 끌지 않게 preventScroll
  irPanels[first].querySelector('.ir__title').focus({ preventScroll: true });
}
document.getElementById('ir-submit').addEventListener('click', irSubmit);
ir.addEventListener('input', function (e) {
  ir.classList.remove('is-demo', 'is-bad');
  e.target.setAttribute('aria-invalid', 'false');
  irSteps.forEach(function (s) { s.classList.remove('is-bad'); });
});
ir.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || e.target.className.indexOf('ir__in') < 0) return;
  e.preventDefault();
  irSubmit();
});
irGo(irPanels.length - 1, false);
</script>
</body>
</html>
