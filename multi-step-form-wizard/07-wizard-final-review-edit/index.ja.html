<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final review edit — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="rv is-demo" id="rv" aria-label="送信前の最終確認">
    <p class="rv__h">最終確認</p>
    <div class="rv__g" data-g="1">
      <div class="rv__top">
        <p class="rv__name">配送先</p>
        <button class="rv__pen" type="button" data-step="1" aria-label="配送先を修正" aria-pressed="false">
          <svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M221.66 90.34L192 120l-56-56l29.66-29.66a8 8 0 0 1 11.31 0L221.66 79a8 8 0 0 1 0 11.34" opacity=".2"/><path d="m227.31 73.37l-44.68-44.69a16 16 0 0 0-22.63 0L36.69 152A15.86 15.86 0 0 0 32 163.31V208a16 16 0 0 0 16 16h44.69a15.86 15.86 0 0 0 11.31-4.69L227.31 96a16 16 0 0 0 0-22.63M92.69 208H48v-44.69l88-88L180.69 120ZM192 108.68L147.31 64l24-24L216 84.68Z"/></g></svg>
        </button>
      </div>
      <dl class="rv__kv">
        <div class="rv__row">
          <dt class="rv__k">宛名</dt>
          <dd class="rv__dd" data-label="宛名"><span class="rv__val">ホン・ギルドン</span></dd>
        </div>
        <div class="rv__row">
          <dt class="rv__k">住所</dt>
          <dd class="rv__dd" data-label="住所"><span class="rv__val">ソウル市江南区駅三洞 12-34</span></dd>
        </div>
      </dl>
    </div>
    <div class="rv__g" data-g="2">
      <div class="rv__top">
        <p class="rv__name">電話番号</p>
        <button class="rv__pen" type="button" data-step="2" aria-label="連絡先を修正" aria-pressed="false">
          <svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M221.66 90.34L192 120l-56-56l29.66-29.66a8 8 0 0 1 11.31 0L221.66 79a8 8 0 0 1 0 11.34" opacity=".2"/><path d="m227.31 73.37l-44.68-44.69a16 16 0 0 0-22.63 0L36.69 152A15.86 15.86 0 0 0 32 163.31V208a16 16 0 0 0 16 16h44.69a15.86 15.86 0 0 0 11.31-4.69L227.31 96a16 16 0 0 0 0-22.63M92.69 208H48v-44.69l88-88L180.69 120ZM192 108.68L147.31 64l24-24L216 84.68Z"/></g></svg>
        </button>
      </div>
      <dl class="rv__kv">
        <div class="rv__row">
          <dt class="rv__k">電話</dt>
          <dd class="rv__dd" data-label="電話"><span class="rv__val">090-2345-6789</span></dd>
        </div>
        <div class="rv__row">
          <dt class="rv__k">メール</dt>
          <dd class="rv__dd" data-label="メール"><span class="rv__val">gildong@mail.com</span></dd>
        </div>
      </dl>
    </div>
    <div class="rv__g" data-g="3">
      <div class="rv__top">
        <p class="rv__name">支払い方法</p>
        <button class="rv__pen" type="button" data-step="3" aria-label="支払い方法を修正" aria-pressed="false">
          <svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M221.66 90.34L192 120l-56-56l29.66-29.66a8 8 0 0 1 11.31 0L221.66 79a8 8 0 0 1 0 11.34" opacity=".2"/><path d="m227.31 73.37l-44.68-44.69a16 16 0 0 0-22.63 0L36.69 152A15.86 15.86 0 0 0 32 163.31V208a16 16 0 0 0 16 16h44.69a15.86 15.86 0 0 0 11.31-4.69L227.31 96a16 16 0 0 0 0-22.63M92.69 208H48v-44.69l88-88L180.69 120ZM192 108.68L147.31 64l24-24L216 84.68Z"/></g></svg>
        </button>
      </div>
      <dl class="rv__kv">
        <div class="rv__row">
          <dt class="rv__k">決済カード</dt>
          <dd class="rv__dd" data-label="決済カード"><span class="rv__val">個人カード · 4444</span></dd>
        </div>
        <div class="rv__row">
          <dt class="rv__k">分割</dt>
          <dd class="rv__dd" data-label="分割"><span class="rv__val">一括払い</span></dd>
        </div>
      </dl>
    </div>
  </section>
</main>
<script>
// 실제 동작: 연필 단추를 누른 묶음의 값이 진짜 input 으로 바뀌고,
// 다시 누르면 고친 값을 텍스트로 되돌려 적는다(화면만 바꾸는 흉내가 아니다).
var rv = document.getElementById('rv');
var groups = [].slice.call(rv.querySelectorAll('.rv__g'));

groups.forEach(function (g) {
  var pen = g.querySelector('.rv__pen');
  pen.addEventListener('click', function () {
    rv.classList.remove('is-demo');
    var editing = g.classList.toggle('is-edit');
    pen.setAttribute('aria-pressed', editing ? 'true' : 'false');
    g.querySelectorAll('.rv__dd').forEach(function (dd) {
      var old = dd.querySelector('input');
      if (editing && !old) {
        var inp = document.createElement('input');
        inp.className = 'rv__inp';
        inp.value = dd.textContent.trim();
        inp.setAttribute('aria-label', dd.getAttribute('data-label'));
        dd.textContent = '';
        dd.appendChild(inp);
      } else if (!editing && old) {
        dd.textContent = old.value.trim() || '—';
      }
    });
    var first = g.querySelector('input');
    if (editing && first) first.focus({ preventScroll: true });
  });
  g.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && g.classList.contains('is-edit')) { e.preventDefault(); pen.click(); }
  });
});
</script>
</body>
</html>
