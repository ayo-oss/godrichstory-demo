<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live summary panel — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="sp is-demo" id="sp" aria-label="お届け情報の入力ステップ">
    <div class="sp__bar">
      <p class="sp__h">お届け情報</p>
      <p class="sp__cnt" id="sp-step">ステップ 2 / 3</p>
    </div>
    <div class="sp__cols">
      <div class="sp__form">
        <div class="sp__f" data-f="1">
          <span class="sp__num" aria-hidden="true">1</span>
          <input class="sp__inp" id="sp-i1" value="ホン・ギルドン" aria-label="宛名" placeholder="ホン・ギルドン">
        </div>
        <div class="sp__f is-current" data-f="2">
          <span class="sp__num" aria-hidden="true">2</span>
          <input class="sp__inp" id="sp-i2" value="gildong@mail.com" aria-label="メール" placeholder="gildong@mail.com">
        </div>
        <div class="sp__f" data-f="3">
          <span class="sp__num" aria-hidden="true">3</span>
          <input class="sp__inp" id="sp-i3" value="090-2345-6789" aria-label="電話番号" placeholder="090-2345-6789">
        </div>
      </div>
      <div class="sp__side" aria-live="polite">
        <ul class="sp__list">
          <li class="sp__row" data-row="1">
            <span class="sp__k">宛名</span>
            <span class="sp__v"><span class="sp__v0">—</span><span class="sp__v1">ホン・ギルドン</span></span>
            <button class="sp__fix" type="button">修正</button>
          </li>
          <li class="sp__row" data-row="2">
            <span class="sp__k">メール</span>
            <span class="sp__v"><span class="sp__v0">—</span><span class="sp__v1">gildong@mail.com</span></span>
            <button class="sp__fix" type="button">修正</button>
          </li>
          <li class="sp__row" data-row="3">
            <span class="sp__k">電話番号</span>
            <span class="sp__v"><span class="sp__v0">—</span><span class="sp__v1">090-2345-6789</span></span>
            <button class="sp__fix" type="button">修正</button>
          </li>
        </ul>
      </div>
    </div>
  </section>
</main>
<script>
// 실제 동작: 왼쪽 칸에 넣는 글자가 input 이벤트로 그 순간 오른쪽 요약 줄에 반영되고,
// 修正 단추는 그 값을 담은 단계를 현재 단계로 만들어 해당 칸에 초점을 옮긴다.
var sp = document.getElementById('sp');
var STEPS = ['ステップ 1 / 3', 'ステップ 2 / 3', 'ステップ 3 / 3'];
var fs = [].slice.call(sp.querySelectorAll('.sp__f'));
var ins = [].slice.call(sp.querySelectorAll('.sp__inp'));
var rows = [].slice.call(sp.querySelectorAll('.sp__row'));
var cnt = document.getElementById('sp-step');
function setStep(i) {
  fs.forEach(function (f, n) { f.classList.toggle('is-current', n === i); });
  cnt.textContent = STEPS[i];
}
ins.forEach(function (inp, i) {
  inp.addEventListener('input', function () {
    sp.classList.remove('is-demo');
    rows[i].querySelector('.sp__v1').textContent = inp.value.trim() || '—';
  });
  inp.addEventListener('focus', function () { sp.classList.remove('is-demo'); setStep(i); });
  inp.addEventListener('keydown', function (e) {
    var d = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
    if (d && ins[i + d]) { e.preventDefault(); ins[i + d].focus({ preventScroll: true }); }
  });
});
rows.forEach(function (row, i) {
  row.querySelector('.sp__fix').addEventListener('click', function () {
    sp.classList.remove('is-demo');
    setStep(i);
    ins[i].focus({ preventScroll: true });
  });
});
</script>
</body>
</html>
