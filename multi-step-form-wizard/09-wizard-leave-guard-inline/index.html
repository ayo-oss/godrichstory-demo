<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave guard inline — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="lgd is-demo" id="lgd" aria-label="배송 정보 입력 단계">
    <p class="lgd__h">
      <span class="lgd__h-a">2단계 · 배송 정보</span>
      <span class="lgd__h-b">1단계 · 주문 확인</span>
    </p>

    <div class="lgd__field">
      <label class="lgd__lab" for="lgd-addr">받는 주소</label>
      <input class="lgd__in" id="lgd-addr" type="text" value="서울 마포구 양화로 12" autocomplete="off">
    </div>

    <div class="lgd__guard">
      <p class="lgd__idle">쓰던 값은 아직 저장 전입니다</p>
      <div class="lgd__sheet" id="lgd-sheet" role="alertdialog" aria-labelledby="lgd-msg" aria-hidden="true">
        <span class="lgd__skin" aria-hidden="true"></span>
        <p class="lgd__msg" id="lgd-msg">
          <span class="lgd__ico" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M215.46 216H40.54c-12.62 0-20.54-13.21-14.41-23.91l87.46-151.87c6.3-11 22.52-11 28.82 0l87.46 151.87c6.13 10.7-1.79 23.91-14.41 23.91" opacity=".2"/><path d="M236.8 188.09L149.35 36.22a24.76 24.76 0 0 0-42.7 0L19.2 188.09a23.51 23.51 0 0 0 0 23.72A24.35 24.35 0 0 0 40.55 224h174.9a24.35 24.35 0 0 0 21.33-12.19a23.51 23.51 0 0 0 .02-23.72m-13.87 15.71a8.5 8.5 0 0 1-7.48 4.2H40.55a8.5 8.5 0 0 1-7.48-4.2a7.59 7.59 0 0 1 0-7.72l87.45-151.87a8.75 8.75 0 0 1 15 0l87.45 151.87a7.59 7.59 0 0 1-.04 7.72M120 144v-40a8 8 0 0 1 16 0v40a8 8 0 0 1-16 0m20 36a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></svg></span>
          <span class="lgd__msg-t">나가면 지금 쓴 값이 사라집니다</span>
        </p>
        <div class="lgd__acts">
          <button class="lgd__go" type="button" id="lgd-go" tabindex="-1">그냥 나가기</button>
          <button class="lgd__stay" type="button" id="lgd-stay" tabindex="-1">계속 쓰기</button>
        </div>
      </div>
    </div>

    <div class="lgd__foot">
      <button class="lgd__back" type="button" id="lgd-back" aria-expanded="false" aria-controls="lgd-sheet">
        <span class="lgd__arrow" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M112 56v144l-72-72Z" opacity=".2"/><path d="M216 120h-96V56a8 8 0 0 0-13.66-5.66l-72 72a8 8 0 0 0 0 11.32l72 72A8 8 0 0 0 120 200v-64h96a8 8 0 0 0 0-16m-112 60.69L51.31 128L104 75.31Z"/></g></svg></span>
        <span class="lgd__back-t">이전</span>
      </button>
      <button class="lgd__next" type="button">다음</button>
    </div>
  </section>
</main>
<script>
// 실제 동작: 입력 칸에 값이 남아 있을 때만 확인 줄이 열린다(흉내가 아니라 value 를 읽는다).
// 열려 있는 동안 Tab 은 줄 안 두 버튼 사이만 돈다 — 짧은 포커스 트랩.
var lgd = document.getElementById('lgd');
var lgdIn = document.getElementById('lgd-addr');
var lgdSheet = document.getElementById('lgd-sheet');
var lgdBack = document.getElementById('lgd-back');
var lgdBtns = [document.getElementById('lgd-go'), document.getElementById('lgd-stay')];
function lgdOpen(on) {
  lgd.classList.toggle('is-open', on);
  lgdSheet.setAttribute('aria-hidden', on ? 'false' : 'true');
  lgdBack.setAttribute('aria-expanded', on ? 'true' : 'false');
  lgdBtns.forEach(function (b) { b.tabIndex = on ? 0 : -1; });
  // iframe 안이라 부모 페이지가 끌려가지 않게 preventScroll
  (on ? lgdBtns[0] : lgdBack).focus({ preventScroll: true });
}
lgdBack.addEventListener('click', function () {
  lgd.classList.remove('is-demo');
  if (lgdIn.value.trim() === '') { lgd.classList.add('is-gone'); return; }
  lgdOpen(true);
});
lgdBtns[1].addEventListener('click', function () { lgdOpen(false); });
lgdBtns[0].addEventListener('click', function () {
  lgdIn.value = '';                       // 나가기를 고르면 쓰던 값이 실제로 사라진다
  lgdOpen(false);
  lgd.classList.add('is-gone');
});
lgdSheet.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { lgdOpen(false); return; }
  if (e.key !== 'Tab') return;
  e.preventDefault();
  var i = lgdBtns.indexOf(document.activeElement);
  lgdBtns[(i + 1) % 2].focus({ preventScroll: true });   // 둘뿐이라 Tab 과 Shift+Tab 이 같은 짝을 가리킨다
});
lgdIn.addEventListener('input', function () { lgd.classList.remove('is-demo', 'is-gone'); });
</script>
</body>
</html>
