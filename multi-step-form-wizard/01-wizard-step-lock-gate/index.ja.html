<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step lock gate — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="lg is-demo" id="lg" aria-label="登録の必須確認ステップ">
    <p class="lg__h">ステップ2 · 必須確認</p>
    <ul class="lg__list">
      <li class="lg__row" data-row="1">
        <button class="lg__box" type="button" role="checkbox" aria-checked="false">
          <span class="lg__tick" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg></span>
          <span class="lg__label">利用規約に同意</span>
        </button>
      </li>
      <li class="lg__row" data-row="2">
        <button class="lg__box" type="button" role="checkbox" aria-checked="false">
          <span class="lg__tick" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg></span>
          <span class="lg__label">個人情報の取得に同意</span>
        </button>
      </li>
      <li class="lg__row" data-row="3">
        <button class="lg__box" type="button" role="checkbox" aria-checked="false">
          <span class="lg__tick" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg></span>
          <span class="lg__label">14歳以上です</span>
        </button>
      </li>
    </ul>
    <div class="lg__foot">
      <p class="lg__why">
        <span class="lg__why-a">必須項目がまだ残っています</span>
        <span class="lg__why-b">次のステップへ進めます</span>
      </p>
      <button class="lg__next" type="button" id="lg-next" aria-disabled="true">
        <span class="lg__lock" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M216 96v112a8 8 0 0 1-8 8H48a8 8 0 0 1-8-8V96a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 80h-32V56a48 48 0 0 0-96 0v24H48a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V96a16 16 0 0 0-16-16M96 56a32 32 0 0 1 64 0v24H96Zm112 152H48V96h160z"/></g></svg></span>
        <span class="lg__next-t">次へ</span>
      </button>
    </div>
  </section>
</main>
<script>
// 실제 동작: 세 조건이 전부 켜져야 次へ 버튼의 aria-disabled 가 false 로 바뀐다.
// 잠긴 동안 눌러도 단계는 안 넘어가고 이유 문구만 그대로 남는다.
var lg = document.getElementById('lg');
var lgBoxes = [].slice.call(lg.querySelectorAll('.lg__box'));
function lgSync() {
  var done = lgBoxes.filter(function (b) { return b.getAttribute('aria-checked') === 'true'; }).length;
  var ready = done === lgBoxes.length;
  lg.classList.toggle('is-ready', ready);
  var next = document.getElementById('lg-next');
  next.setAttribute('aria-disabled', ready ? 'false' : 'true');
}
lgBoxes.forEach(function (b) {
  b.addEventListener('click', function () {
    lg.classList.remove('is-demo');
    b.setAttribute('aria-checked', b.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
    b.parentNode.classList.toggle('is-on', b.getAttribute('aria-checked') === 'true');
    lgSync();
  });
});
document.getElementById('lg-next').addEventListener('click', function () {
  lg.classList.remove('is-demo');
  if (this.getAttribute('aria-disabled') === 'true') { lg.classList.add('is-nudge'); return; }
  lg.classList.remove('is-nudge');
  lg.classList.add('is-sent');
});
lgSync();
</script>
</body>
</html>
