<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branch step path — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="bp is-demo" id="bp" aria-label="選んだ答えで分かれる登録ステップ">
    <div class="bp__pick" role="radiogroup" aria-label="登録の種別">
      <label class="bp__opt">
        <input class="bp__r" type="radio" name="bp-kind" value="personal">
        <span class="bp__opt-b" data-opt="personal">
          <span class="bp__opt-i" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M192 96a64 64 0 1 1-64-64a64 64 0 0 1 64 64" opacity=".2"/><path d="M230.92 212c-15.23-26.33-38.7-45.21-66.09-54.16a72 72 0 1 0-73.66 0c-27.39 8.94-50.86 27.82-66.09 54.16a8 8 0 1 0 13.85 8c18.84-32.56 52.14-52 89.07-52s70.23 19.44 89.07 52a8 8 0 1 0 13.85-8M72 96a56 56 0 1 1 56 56a56.06 56.06 0 0 1-56-56"/></g></svg></span>
          <span class="bp__opt-t">個人</span>
        </span>
      </label>
      <label class="bp__opt">
        <input class="bp__r" type="radio" name="bp-kind" value="business" checked>
        <span class="bp__opt-b" data-opt="business">
          <span class="bp__opt-i" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M224 118.31V200a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8v-81.69A191.14 191.14 0 0 0 128 144a191.1 191.1 0 0 0 96-25.69" opacity=".2"/><path d="M104 112a8 8 0 0 1 8-8h32a8 8 0 0 1 0 16h-32a8 8 0 0 1-8-8m128-40v128a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V72a16 16 0 0 1 16-16h40v-8a24 24 0 0 1 24-24h48a24 24 0 0 1 24 24v8h40a16 16 0 0 1 16 16M96 56h64v-8a8 8 0 0 0-8-8h-48a8 8 0 0 0-8 8ZM40 72v41.62A184.1 184.1 0 0 0 128 136a184 184 0 0 0 88-22.39V72Zm176 128v-68.37A200.25 200.25 0 0 1 128 152a200.2 200.2 0 0 1-88-20.36V200z"/></g></svg></span>
          <span class="bp__opt-t">事業者</span>
        </span>
      </label>
    </div>
    <ol class="bp__steps" id="bp-steps"></ol>
    <p class="bp__note">選んだ種別に合うステップだけが残ります</p>
  </section>
  <template id="bp-src">
    <li data-k="all">本人確認</li>
    <li data-k="all">アカウント</li>
    <li data-k="biz">事業者情報</li>
    <li data-k="all">完了</li>
  </template>
</main>
<script>
// 실제 동작: 고른 값으로 단계 배열을 다시 걸러 목록을 통째로 다시 그린다.
// 칸 수가 달라지므로 grid 트랙 수도 배열 길이로 다시 적는다. 번호는 CSS counter 가 센다.
var bp = document.getElementById('bp');
var bpSteps = document.getElementById('bp-steps');
var bpSrc = [].slice.call(document.getElementById('bp-src').content.querySelectorAll('li'));
var bpAt = 2;
function bpDraw() {
  var picked = bp.querySelector('.bp__r:checked');
  var biz = !!picked && picked.value === 'business';
  var list = bpSrc.filter(function (n) { return n.getAttribute('data-k') === 'all' || biz; });
  bpSteps.style.gridTemplateColumns = 'repeat(' + list.length + ', 1fr)';
  while (bpSteps.firstChild) { bpSteps.removeChild(bpSteps.firstChild); }
  list.forEach(function (n, i) {
    var li = document.createElement('li');
    li.className = 'bp__s';
    if (n.getAttribute('data-k') === 'biz') { li.className += ' bp__s--biz'; }
    if (i + 1 === bpAt) { li.setAttribute('aria-current', 'step'); }
    var lab = document.createElement('span');
    lab.className = 'bp__l';
    lab.textContent = n.textContent;
    li.appendChild(lab);
    bpSteps.appendChild(li);
  });
}
[].slice.call(bp.querySelectorAll('.bp__r')).forEach(function (r) {
  r.addEventListener('change', function () { bp.classList.remove('is-demo'); bpDraw(); });
});
bpDraw();
</script>
</body>
</html>
