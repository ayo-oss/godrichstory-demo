<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accordion vertical steps — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="vz is-demo" id="vz" aria-label="배송 정보 세 단계">
    <div class="vz__item is-done" data-item="1">
      <button class="vz__h" type="button" id="vz-h1" aria-expanded="false" aria-controls="vz-p1">
        <span class="vz__num" aria-hidden="true">1</span>
        <span class="vz__t">받는 사람</span>
        <span class="vz__sv">홍길동</span>
        <span class="vz__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></span>
      </button>
      <div class="vz__body" id="vz-p1" role="region" aria-labelledby="vz-h1">
        <div class="vz__inner">
          <input class="vz__inp" value="홍길동" aria-label="받는 사람" placeholder="홍길동">
          <button class="vz__next" type="button">다음</button>
        </div>
      </div>
    </div>
    <div class="vz__item is-open" data-item="2">
      <button class="vz__h" type="button" id="vz-h2" aria-expanded="true" aria-controls="vz-p2">
        <span class="vz__num" aria-hidden="true">2</span>
        <span class="vz__t">배송지</span>
        <span class="vz__sv">서울시 강남구 역삼동 12-34</span>
        <span class="vz__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></span>
      </button>
      <div class="vz__body" id="vz-p2" role="region" aria-labelledby="vz-h2">
        <div class="vz__inner">
          <input class="vz__inp" value="서울시 강남구 역삼동 12-34" aria-label="배송지" placeholder="서울시 강남구 역삼동 12-34">
          <button class="vz__next" type="button">다음</button>
        </div>
      </div>
    </div>
    <div class="vz__item" data-item="3">
      <button class="vz__h" type="button" id="vz-h3" aria-expanded="false" aria-controls="vz-p3">
        <span class="vz__num" aria-hidden="true">3</span>
        <span class="vz__t">연락처</span>
        <span class="vz__sv">010-2345-6789</span>
        <span class="vz__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></span>
      </button>
      <div class="vz__body" id="vz-p3" role="region" aria-labelledby="vz-h3">
        <div class="vz__inner">
          <input class="vz__inp" value="010-2345-6789" aria-label="연락처" placeholder="010-2345-6789">
          <button class="vz__next" type="button">완료</button>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
// 실제 동작: 머리 단추는 그 단계를 접고 펼치고, 안의 단추는 입력값을 읽어
// 머리에 한 줄 요약으로 남긴 뒤 다음 단계를 펼쳐 그 칸에 초점을 준다.
var vz = document.getElementById('vz');
var items = [].slice.call(vz.querySelectorAll('.vz__item'));

function setOpen(item, open) {
  vz.classList.remove('is-demo');
  item.classList.toggle('is-open', open);
  item.querySelector('.vz__h').setAttribute('aria-expanded', open ? 'true' : 'false');
}

items.forEach(function (item, i) {
  var inp = item.querySelector('.vz__inp');
  item.querySelector('.vz__h').addEventListener('click', function () {
    setOpen(item, !item.classList.contains('is-open'));
  });
  item.querySelector('.vz__next').addEventListener('click', function () {
    item.querySelector('.vz__sv').textContent = inp.value.trim() || '—';
    item.classList.add('is-done');
    setOpen(item, false);
    var nxt = items[i + 1];
    if (nxt) {
      setOpen(nxt, true);
      nxt.querySelector('.vz__inp').focus({ preventScroll: true });
    } else {
      vz.classList.add('is-all');
      item.querySelector('.vz__h').focus({ preventScroll: true });
    }
  });
  inp.addEventListener('input', function () { vz.classList.remove('is-demo'); });
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); item.querySelector('.vz__next').click(); }
  });
});
</script>
</body>
</html>
