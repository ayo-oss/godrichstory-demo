<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Column resize drag — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cr is-demo" id="cr">
    <div class="cr__grid" id="cr-grid" role="grid" aria-label="Product list">
      <div class="cr__row cr__row--head" role="row">
        <span class="cr__c cr__c--h" role="columnheader">Product</span>
        <span class="cr__grip" id="cr-grip" role="separator" aria-label="Resize column" tabindex="0" aria-orientation="vertical">
          <svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor" aria-hidden="true"><g><path d="m232 128l-32 32H56l-32-32l32-32h144Z" opacity=".2"/><path d="m237.66 133.66l-32 32a8 8 0 0 1-11.32-11.32L212.69 136H43.31l18.35 18.34a8 8 0 0 1-11.32 11.32l-32-32a8 8 0 0 1 0-11.32l32-32a8 8 0 0 1 11.32 11.32L43.31 120h169.38l-18.35-18.34a8 8 0 0 1 11.32-11.32l32 32a8 8 0 0 1 0 11.32"/></g></svg>
        </span>
        <span class="cr__c cr__c--h" role="columnheader">Qty</span>
      </div>
      <div class="cr__row" role="row"><span class="cr__c" role="gridcell">Cherry jam, one jar</span><i></i><span class="cr__c" role="gridcell">12</span></div>
      <div class="cr__row" role="row"><span class="cr__c" role="gridcell">Mint soap bundle</span><i></i><span class="cr__c" role="gridcell">7</span></div>
      <div class="cr__row" role="row"><span class="cr__c" role="gridcell">Lilac letter paper</span><i></i><span class="cr__c" role="gridcell">24</span></div>
    </div>
    <div class="cr__guide" id="cr-guide" aria-hidden="true"></div>
  </div>
</main>
<script>
// 실제 동작: 손잡이를 끌면 첫 열의 폭만 바뀐다. 폭은 grid-template-columns 의 첫 값 하나.
var cr = document.getElementById('cr');
var crGrid = document.getElementById('cr-grid');
var crGrip = document.getElementById('cr-grip');
var crGuide = document.getElementById('cr-guide');
var CR_MIN = 88, CR_MAX = 200;
var crW = 132, crFrom = 0, crAt = 0;
function crSet(w) {
  crW = Math.max(CR_MIN, Math.min(CR_MAX, w));
  crGrid.style.setProperty('--w1', crW + 'px');
}
function crMove(e) {
  cr.classList.remove('is-demo');
  crSet(crFrom + (e.clientX - crAt));
  crGuide.style.transform = 'translateX(' + crW + 'px)';
}
function crUp() {
  cr.classList.remove('is-drag');
  window.removeEventListener('pointermove', crMove);
  window.removeEventListener('pointerup', crUp);
}
crGrip.addEventListener('pointerdown', function (e) {
  cr.classList.remove('is-demo');
  cr.classList.add('is-drag');
  crFrom = crW; crAt = e.clientX;
  crGuide.style.transform = 'translateX(' + crW + 'px)';
  window.addEventListener('pointermove', crMove);
  window.addEventListener('pointerup', crUp);
});
// 손잡이를 두 번 누르면 가장 긴 글자에 맞춰 넓힌다
crGrip.addEventListener('dblclick', function () {
  cr.classList.remove('is-demo');
  var wide = 0;
  [].forEach.call(crGrid.querySelectorAll('.cr__row:not(.cr__row--head) .cr__c:first-child'), function (el) {
    wide = Math.max(wide, el.scrollWidth + 20);
  });
  crSet(wide);
});
crGrip.addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault(); cr.classList.remove('is-demo');
  crSet(crW + (e.key === 'ArrowRight' ? 8 : -8));
});
crSet(crW);
</script>
</body>
</html>
