<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi column sort — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ms is-demo" id="ms" role="grid" aria-label="팀 순위">
    <div class="ms__head" role="row">
      <span class="ms__h ms__h--text">팀</span>
      <button class="ms__h" type="button" id="ms-score" data-key="score" aria-sort="descending">
        <span class="ms__label">점수</span>
        <span class="ms__ord" aria-hidden="true">1</span>
        <span class="ms__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M208 160H48l80-80Z" opacity=".2"/><path d="m213.66 154.34l-80-80a8 8 0 0 0-11.32 0l-80 80A8 8 0 0 0 48 168h160a8 8 0 0 0 5.66-13.66M67.31 152L128 91.31L188.69 152Z"/></g></svg></span>
      </button>
      <button class="ms__h" type="button" id="ms-date" data-key="date" aria-sort="none">
        <span class="ms__label">날짜</span>
        <span class="ms__ord" aria-hidden="true">2</span>
        <span class="ms__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M208 160H48l80-80Z" opacity=".2"/><path d="m213.66 154.34l-80-80a8 8 0 0 0-11.32 0l-80 80A8 8 0 0 0 48 168h160a8 8 0 0 0 5.66-13.66M67.31 152L128 91.31L188.69 152Z"/></g></svg></span>
      </button>
    </div>
    <div class="ms__body" id="ms-body" role="rowgroup"></div>
  </div>
</main>
<script>
// 실제 동작: 헤더를 누르면 그 열로 정렬하고, Shift 를 누른 채 누르면 보조 열로 더한다.
// 자리 이동은 FLIP — 새 자리에 그린 뒤 옛 자리로 되돌려 놓고 0 으로 달린다.
var ms = document.getElementById('ms');
var msBody = document.getElementById('ms-body');
var MS = [
  { id: 'a', team: '노랑', score: 92, date: '03-14' },
  { id: 'b', team: '파랑', score: 92, date: '02-02' },
  { id: 'c', team: '민트', score: 88, date: '05-21' },
  { id: 'd', team: '분홍', score: 88, date: '01-09' }
];
var msKeys = [{ k: 'score', dir: -1 }];
function msRender() {
  msBody.innerHTML = MS.map(function (r) {
    return '<div class="ms__row" role="row" data-id="' + r.id + '">' +
      '<span role="gridcell">' + r.team + '</span>' +
      '<b role="gridcell">' + r.score + '</b>' +
      '<span role="gridcell">' + r.date + '</span></div>';
  }).join('');
}
function msMark() {
  [['score', 'ms-score'], ['date', 'ms-date']].forEach(function (p) {
    var i = -1;
    msKeys.forEach(function (k, n) { if (k.k === p[0]) i = n; });
    var el = document.getElementById(p[1]);
    el.setAttribute('aria-sort', i < 0 ? 'none' : (msKeys[i].dir < 0 ? 'descending' : 'ascending'));
    el.classList.toggle('is-on', i >= 0);
    var ord = el.querySelector('.ms__ord');
    if (i >= 0) { ord.textContent = String(i + 1); }   // 빠진 열의 배지에 0 을 적지 않는다
    ord.hidden = i < 0 || msKeys.length < 2;
  });
}
function msSort(key, add) {
  ms.classList.remove('is-demo');
  var was = {};
  [].forEach.call(msBody.children, function (el) { was[el.dataset.id] = el.getBoundingClientRect().top; });
  var hit = null;
  msKeys.forEach(function (k) { if (k.k === key) hit = k; });
  if (hit) hit.dir = -hit.dir;
  else msKeys = add ? msKeys.concat([{ k: key, dir: 1 }]).slice(-2) : [{ k: key, dir: -1 }];
  MS.sort(function (a, b) {
    for (var i = 0; i < msKeys.length; i++) {
      var k = msKeys[i];
      if (a[k.k] < b[k.k]) return -k.dir;
      if (a[k.k] > b[k.k]) return k.dir;
    }
    return 0;
  });
  msRender(); msMark();
  [].forEach.call(msBody.children, function (el) {
    var d = was[el.dataset.id] - el.getBoundingClientRect().top;
    if (!d) return;
    el.style.transition = 'none';
    el.style.transform = 'translateY(' + d + 'px)';
    requestAnimationFrame(function () {
      el.style.transition = 'transform 320ms cubic-bezier(.2, .8, .2, 1)';
      el.style.transform = 'translateY(0)';
    });
  });
}
['ms-score', 'ms-date'].forEach(function (id) {
  document.getElementById(id).addEventListener('click', function (e) {
    msSort(this.dataset.key, e.shiftKey);
  });
});
msRender(); msMark();
</script>
</body>
</html>
