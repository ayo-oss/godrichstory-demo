<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell range select and copy — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="rs is-demo" id="rs">
    <div class="rs__grid" id="rs-grid" role="grid" aria-label="週間売上">
      <div class="rs__row rs__row--head" role="row">
        <span role="columnheader">月</span><span role="columnheader">火</span><span role="columnheader">水</span><span role="columnheader">木</span>
      </div>
      <div class="rs__row" role="row"><b data-r="0" data-c="0" role="gridcell">12</b><b data-r="0" data-c="1" role="gridcell">18</b><b data-r="0" data-c="2" role="gridcell">9</b><b data-r="0" data-c="3" role="gridcell">24</b></div>
      <div class="rs__row" role="row"><b data-r="1" data-c="0" role="gridcell">7</b><b data-r="1" data-c="1" role="gridcell">15</b><b data-r="1" data-c="2" role="gridcell">21</b><b data-r="1" data-c="3" role="gridcell">6</b></div>
      <div class="rs__row" role="row"><b data-r="2" data-c="0" role="gridcell">30</b><b data-r="2" data-c="1" role="gridcell">11</b><b data-r="2" data-c="2" role="gridcell">3</b><b data-r="2" data-c="3" role="gridcell">17</b></div>
      <div class="rs__box" id="rs-box" aria-hidden="true"></div>
    </div>
    <p class="rs__foot" id="rs-foot" role="status">
      <span class="rs__s0">ドラッグして選択</span>
      <span class="rs__s1">1マス · 合計 12</span>
      <span class="rs__s2">4マス · 合計 52</span>
      <span class="rs__s3">9マス · 合計 126</span>
    </p>
    <span class="rs__toast" aria-hidden="true"><span class="rs__toast-in"><span class="rs__ic"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M216 40v128h-48V88H88V40Z" opacity=".2"/><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></g></svg></span>コピーしました</span></span>
  </div>
</main>
<script>
// 실제 동작: 셀에서 셀로 끌면 두 지점이 만드는 네모가 선택 범위다. 놓으면 탭으로 이어 붙여 복사한다.
var rs = document.getElementById('rs');
var rsGrid = document.getElementById('rs-grid');
var rsBox = document.getElementById('rs-box');
var rsFoot = document.getElementById('rs-foot');
var RS_W = 66, RS_H = 26;
var rsAnchor = null, rsOn = false;
function rsCells() { return [].slice.call(rsGrid.querySelectorAll('[data-r]')); }
function rsPaint(to) {
  var r0 = Math.min(rsAnchor.r, to.r), r1 = Math.max(rsAnchor.r, to.r);
  var c0 = Math.min(rsAnchor.c, to.c), c1 = Math.max(rsAnchor.c, to.c);
  var sum = 0, n = 0, text = [];
  rsCells().forEach(function (el) {
    var r = +el.dataset.r, c = +el.dataset.c;
    var inside = r >= r0 && r <= r1 && c >= c0 && c <= c1;
    el.classList.toggle('is-sel', inside);
    if (inside) { sum += +el.textContent; n++; }
  });
  rsBox.style.opacity = '1';
  rsBox.style.transform = 'translate(' + (c0 * RS_W) + 'px, ' + ((r0 + 1) * RS_H) + 'px) scale(' + (c1 - c0 + 1) + ', ' + (r1 - r0 + 1) + ')';
  rsFoot.querySelector('.rs__s0').textContent = n + 'マス · 合計 ' + sum;
  return text;
}
rsGrid.addEventListener('pointerdown', function (e) {
  var el = e.target.closest('[data-r]');
  if (!el) return;
  rs.classList.remove('is-demo');
  rsAnchor = { r: +el.dataset.r, c: +el.dataset.c };
  rsOn = true; rsPaint(rsAnchor);
});
rsGrid.addEventListener('pointermove', function (e) {
  if (!rsOn) return;
  var el = document.elementFromPoint(e.clientX, e.clientY);
  el = el && el.closest ? el.closest('[data-r]') : null;
  if (el) rsPaint({ r: +el.dataset.r, c: +el.dataset.c });
});
window.addEventListener('pointerup', function () {
  if (!rsOn) return;
  rsOn = false;
  var rows = {};
  rsCells().forEach(function (el) {
    if (!el.classList.contains('is-sel')) return;
    (rows[el.dataset.r] = rows[el.dataset.r] || []).push(el.textContent);
  });
  var text = Object.keys(rows).map(function (k) { return rows[k].join('\t'); }).join('\n');
  if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(function () {}); }
  rs.classList.add('is-copied');
  setTimeout(function () { rs.classList.remove('is-copied'); }, 1200);
});
</script>
</body>
</html>
