<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conditional cell format — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cf is-demo" id="cf">
    <div class="cf__grid" id="cf-grid" role="grid" aria-label="Attainment">
      <div class="cf__row cf__row--head" role="row">
        <span role="columnheader">Branch</span><span role="columnheader">Rate</span><span role="columnheader">Status</span>
      </div>
      <div class="cf__row" role="row">
        <span role="gridcell">Seocho</span>
        <span class="cf__num" role="gridcell" data-level="2"><span class="cf__bar" style="--v: .72" aria-hidden="true"></span><i>72</i></span>
        <span role="gridcell"><em class="cf__badge" data-level="2">Good</em></span>
      </div>
      <div class="cf__row" role="row">
        <span role="gridcell">Mapo</span>
        <span class="cf__num" role="gridcell" data-level="1"><span class="cf__bar" style="--v: .45" aria-hidden="true"></span><i>45</i></span>
        <span role="gridcell"><em class="cf__badge" data-level="1">Watch</em></span>
      </div>
      <div class="cf__row" role="row">
        <span role="gridcell">Nowon</span>
        <span class="cf__num" role="gridcell" data-level="3"><span class="cf__bar" style="--v: .91" aria-hidden="true"></span><i>91</i></span>
        <span role="gridcell"><em class="cf__badge" data-level="3">Best</em></span>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 값 하나가 구간표를 지나 등급이 되고, 등급이 배경색·막대 길이·배지를 한꺼번에 정한다.
var cf = document.getElementById('cf');
var CF_BAND = [{ min: 80, level: 3, word: 'Best' }, { min: 60, level: 2, word: 'Good' }, { min: 0, level: 1, word: 'Watch' }];
function cfGrade(v) {
  for (var i = 0; i < CF_BAND.length; i++) { if (v >= CF_BAND[i].min) return CF_BAND[i]; }
  return CF_BAND[CF_BAND.length - 1];
}
function cfPut(row, v) {
  cf.classList.remove('is-demo');
  var cell = row.querySelector('.cf__num');
  var badge = row.querySelector('.cf__badge');
  var g = cfGrade(v);
  cell.querySelector('i').textContent = String(v);
  cell.querySelector('.cf__bar').style.setProperty('--v', String(v / 100));
  cell.setAttribute('data-level', String(g.level));
  badge.setAttribute('data-level', String(g.level));
  badge.textContent = g.word;
}
// 셀을 누르면 그 줄의 값이 한 단계 올라가며 Tier 전체가 다시 계산된다
[].forEach.call(cf.querySelectorAll('.cf__num'), function (cell) {
  cell.addEventListener('click', function () {
    var now = +cell.querySelector('i').textContent;
    cfPut(cell.closest('.cf__row'), now >= 95 ? 20 : now + 15);
  });
});
</script>
</body>
</html>
