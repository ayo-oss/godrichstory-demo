<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">

<title>Column reorder drag — demo</title>

</head>
<body>
<main class="stage">
  <div class="rd is-demo" id="rd">
    <div class="rd__slot" aria-hidden="true"></div>
    <div class="rd__cols" id="rd-cols" role="grid" aria-label="회원 표">
      <div class="rd__col" role="columnheader">
        <span class="rd__h"><span class="rd__grab" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M208 32v192a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V32a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16" opacity=".2"/><path d="M104 60a12 12 0 1 1-12-12a12 12 0 0 1 12 12m60 12a12 12 0 1 0-12-12a12 12 0 0 0 12 12m-72 44a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12m-72 68a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg></span>이름</span>
        <span class="rd__c">하늘</span><span class="rd__c">가온</span><span class="rd__c">노을</span>
      </div>
      <div class="rd__col" role="columnheader">
        <span class="rd__h"><span class="rd__grab" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M208 32v192a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V32a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16" opacity=".2"/><path d="M104 60a12 12 0 1 1-12-12a12 12 0 0 1 12 12m60 12a12 12 0 1 0-12-12a12 12 0 0 0 12 12m-72 44a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12m-72 68a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg></span>등급</span>
        <span class="rd__c">금</span><span class="rd__c">은</span><span class="rd__c">동</span>
      </div>
      <div class="rd__col" role="columnheader">
        <span class="rd__h"><span class="rd__grab" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M208 32v192a16 16 0 0 1-16 16H64a16 16 0 0 1-16-16V32a16 16 0 0 1 16-16h128a16 16 0 0 1 16 16" opacity=".2"/><path d="M104 60a12 12 0 1 1-12-12a12 12 0 0 1 12 12m60 12a12 12 0 1 0-12-12a12 12 0 0 0 12 12m-72 44a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12m-72 68a12 12 0 1 0 12 12a12 12 0 0 0-12-12m72 0a12 12 0 1 0 12 12a12 12 0 0 0-12-12"/></g></svg></span>적립</span>
        <span class="rd__c">820</span><span class="rd__c">410</span><span class="rd__c">175</span>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 헤더를 잡으면 그 열이 통째로 떠오르고, 놓을 자리의 열들이 자리를 비켜 준다.
var rd = document.getElementById('rd');
var rdCols = document.getElementById('rd-cols');
var rdW = 96, rdFrom = 0, rdAt = 0, rdTo = 0, rdEl = null;
function rdList() { return [].slice.call(rdCols.children); }
function rdMove(e) {
  var dx = e.clientX - rdAt;
  rdEl.style.transform = 'translateX(' + dx + 'px)';
  rdTo = Math.max(0, Math.min(rdList().length - 1, rdFrom + Math.round(dx / rdW)));
  rdList().forEach(function (el, i) {
    if (el === rdEl) return;
    var shift = 0;
    if (rdTo > rdFrom && i > rdFrom && i <= rdTo) shift = -rdW;
    if (rdTo < rdFrom && i >= rdTo && i < rdFrom) shift = rdW;
    el.style.transform = 'translateX(' + shift + 'px)';
  });
}
function rdUp() {
  var list = rdList();
  list.forEach(function (el) { el.style.transition = 'none'; el.style.transform = ''; });
  var after = list[rdTo > rdFrom ? rdTo + 1 : rdTo];
  rdCols.insertBefore(rdEl, after || null);
  rd.classList.remove('is-drag');
  rdEl.classList.remove('is-lift');
  requestAnimationFrame(function () { list.forEach(function (el) { el.style.transition = ''; }); });
  window.removeEventListener('pointermove', rdMove);
  window.removeEventListener('pointerup', rdUp);
  rdEl = null;
}
rdList().forEach(function (col) {
  col.querySelector('.rd__h').addEventListener('pointerdown', function (e) {
    rd.classList.remove('is-demo');
    rd.classList.add('is-drag');
    rdEl = col; rdEl.classList.add('is-lift');
    rdW = col.getBoundingClientRect().width;
    rdFrom = rdList().indexOf(col); rdTo = rdFrom; rdAt = e.clientX;
    window.addEventListener('pointermove', rdMove);
    window.addEventListener('pointerup', rdUp);
  });
});
</script>
</body>
</html>
