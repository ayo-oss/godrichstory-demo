<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Per column filter chips — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="mf is-demo" id="mf">
    <div class="mf__chips" id="mf-chips">
      <span class="mf__chip mf__chip--1">
        <span class="mf__fic" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M221.9 61.38L152 136v58.65a8 8 0 0 1-3.56 6.66l-32 21.33A8 8 0 0 1 104 216v-80L34.1 61.38A8 8 0 0 1 40 48h176a8 8 0 0 1 5.9 13.38" opacity=".2"/><path d="M230.6 49.53A15.81 15.81 0 0 0 216 40H40a16 16 0 0 0-11.81 26.76l.08.09L96 139.17V216a16 16 0 0 0 24.87 13.32l32-21.34a16 16 0 0 0 7.13-13.32v-55.49l67.74-72.32l.08-.09a15.8 15.8 0 0 0 2.78-17.23m-84.42 81.05A8 8 0 0 0 144 136v58.66L112 216v-80a8 8 0 0 0-2.16-5.47L40 56h176Z"/></g></svg></span>이름 민</span>
      <span class="mf__chip mf__chip--2">
        <span class="mf__fic" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M221.9 61.38L152 136v58.65a8 8 0 0 1-3.56 6.66l-32 21.33A8 8 0 0 1 104 216v-80L34.1 61.38A8 8 0 0 1 40 48h176a8 8 0 0 1 5.9 13.38" opacity=".2"/><path d="M230.6 49.53A15.81 15.81 0 0 0 216 40H40a16 16 0 0 0-11.81 26.76l.08.09L96 139.17V216a16 16 0 0 0 24.87 13.32l32-21.34a16 16 0 0 0 7.13-13.32v-55.49l67.74-72.32l.08-.09a15.8 15.8 0 0 0 2.78-17.23m-84.42 81.05A8 8 0 0 0 144 136v58.66L112 216v-80a8 8 0 0 0-2.16-5.47L40 56h176Z"/></g></svg></span>상태 완료</span>
    </div>

    <div class="mf__grid" role="grid" aria-label="주문 목록">
      <div class="mf__row mf__row--head" role="row">
        <span role="columnheader">이름</span><span role="columnheader">상태</span><span role="columnheader">수량</span>
      </div>
      <div class="mf__row mf__row--filter" role="row">
        <span class="mf__f"><input class="mf__in" id="mf-name" data-col="0" aria-label="이름 거르기"><span class="mf__ghost mf__ghost--1" aria-hidden="true">민</span></span>
        <span class="mf__f"><input class="mf__in" id="mf-state" data-col="1" aria-label="상태 거르기"><span class="mf__ghost mf__ghost--2" aria-hidden="true">완료</span></span>
        <span class="mf__f"></span>
      </div>
      <div class="mf__body" id="mf-body" role="rowgroup">
        <div class="mf__row" role="row"><span role="gridcell">민들레</span><span role="gridcell">완료</span><span role="gridcell">12</span></div>
        <div class="mf__row" role="row"><span role="gridcell">민트</span><span role="gridcell">대기</span><span role="gridcell">7</span></div>
        <div class="mf__row" role="row"><span role="gridcell">하늘</span><span role="gridcell">완료</span><span role="gridcell">24</span></div>
        <div class="mf__row" role="row"><span role="gridcell">가온</span><span role="gridcell">대기</span><span role="gridcell">5</span></div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 열마다 따로 친 글자를 모아 한 번에 걸러 낸다. 맞지 않는 행은 높이를 0 으로 접는다.
var mf = document.getElementById('mf');
var mfBody = document.getElementById('mf-body');
var mfChips = document.getElementById('mf-chips');
var MF_H = ['이름', '상태'];
function mfApply() {
  mf.classList.remove('is-demo');
  var q = [].slice.call(mf.querySelectorAll('.mf__in')).map(function (i) { return i.value.trim().toLowerCase(); });
  [].forEach.call(mfBody.children, function (row) {
    var keep = q.every(function (v, c) {
      return !v || row.children[c].textContent.toLowerCase().indexOf(v) >= 0;
    });
    row.classList.toggle('is-out', !keep);
  });
  mfChips.innerHTML = q.map(function (v, c) {
    return v ? '<span class="mf__chip is-live">' + MF_H[c] + ' ' + v + '</span>' : '';
  }).join('');
}
[].forEach.call(mf.querySelectorAll('.mf__in'), function (i) {
  i.addEventListener('input', mfApply);
});
</script>
</body>
</html>
