<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky summary row — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sm is-demo" id="sm">
    <div class="sm__head" role="row">
      <span role="columnheader">Period</span><span role="columnheader">Amount</span>
    </div>
    <div class="sm__view" id="sm-view" role="grid" aria-label="Settlement list" tabindex="0">
      <div class="sm__track" id="sm-track" role="rowgroup">
        <button class="sm__row" type="button" role="row" data-v="42"><span role="gridcell">Mar wk 1</span><span role="gridcell">42</span></button>
        <button class="sm__row" type="button" role="row" data-v="38"><span role="gridcell">Mar wk 2</span><span role="gridcell">38</span></button>
        <button class="sm__row" type="button" role="row" data-v="51"><span role="gridcell">Mar wk 3</span><span role="gridcell">51</span></button>
        <button class="sm__row" type="button" role="row" data-v="27"><span role="gridcell">Mar wk 4</span><span role="gridcell">27</span></button>
        <button class="sm__row" type="button" role="row" data-v="60"><span role="gridcell">Apr wk 1</span><span role="gridcell">60</span></button>
      </div>
      <div class="sm__sum" id="sm-sum" role="row">
        <span class="sm__sic" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="M192 48v160H64l64-80l-64-80Z" opacity=".2"/><path d="M184 72V56H80.65l53.6 67a8 8 0 0 1 0 10l-53.6 67H184v-16a8 8 0 0 1 16 0v24a8 8 0 0 1-8 8H64a8 8 0 0 1-6.25-13l60-75l-60-75A8 8 0 0 1 64 40h128a8 8 0 0 1 8 8v24a8 8 0 0 1-16 0"/></g></svg></span>
        <span class="sm__label" role="gridcell">Total</span>
        <span class="sm__v" role="gridcell"><b class="sm__all" id="sm-all">218</b><b class="sm__sel">38</b></span>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: Total 줄은 스크롤 상자 안에서 bottom:0 에 붙어 있고, 끝까지 내려가면 그림자를 끈다.
var sm = document.getElementById('sm');
var smView = document.getElementById('sm-view');
var smAll = document.getElementById('sm-all');
function smRows() { return [].slice.call(document.querySelectorAll('.sm__row')); }
function smSum() {
  var picked = smRows().filter(function (r) { return r.classList.contains('is-pick'); });
  var list = picked.length ? picked : smRows();
  smAll.textContent = String(list.reduce(function (n, r) { return n + (+r.dataset.v); }, 0));
  document.getElementById('sm-sum').classList.toggle('is-part', picked.length > 0);
}
function smShade() {
  var left = smView.scrollHeight - smView.scrollTop - smView.clientHeight;
  sm.classList.toggle('is-more', left > 2);
}
smView.addEventListener('scroll', function () { sm.classList.remove('is-demo'); smShade(); });
smRows().forEach(function (row) {
  row.addEventListener('click', function () {
    sm.classList.remove('is-demo');
    row.classList.toggle('is-pick');
    row.setAttribute('aria-selected', row.classList.contains('is-pick') ? 'true' : 'false');
    smSum();
  });
});
smSum(); smShade();
</script>
</body>
</html>
