<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포인터 추적 낙뢰 — 커서를 잡는 번개 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cd is-demo" id="cdRoot">
  <p class="cd__hint">
    <svg class="cd__ico" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M150 14 66 146h49l-24 96 99-138h-52l28-90z"/></svg>
    <span>固定された始点からポインターまでを毎フレーム新しい中点変位で割り直します — カーソルを追いかけて捕まえる稲妻です。マウスを乗せて動かしてみてください</span>
  </p>
  <div class="cd__field" id="cdField" role="application" aria-label="ポインター追跡落雷 実験パネル" tabindex="0">
    <canvas class="cd__cv" id="cdCv"></canvas>
  </div>
  <div class="cd__bar">
    <span class="cd__meta">変位幅 <b class="cd__val" id="cdMag"></b>px・落雷間隔 <b class="cd__val" id="cdFork"></b></span>
    <span class="cd__meta cd__meta--dim">キャンバス・pointermove・requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 포인터 추적 낙뢰(06). 상단 고정 시작점에서 포인터 좌표까지 매 프레임 새 중점변위 경로를 그린다.
// pointermove 없으면(렌더 환경) 리사처 자가 천천히 움직이는 시연 경로 — 8자 리사주 — 를 따라간다(is-demo 자동 모드).
// 곁가지 2개가 줄기 중간에서 갈라지고, 끝점엔 착탄 광륜이 퍼진다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형 3종을 만든다 ──
  var MAG_PX   = 26;    // 変位幅(px) — 변형 "변위 강도" 축(26 → 60)
  var FORK_N   = 2;     // 곁가지 수 — 변형 "가지 확률" 축(2 → 5)
  var AUTOSPD  = 0.9;   // 자동 모드 리사주 속도 배율 — 변형 "추적 속도" 축(0.9 → 1.8)
  // ────────────────────────────────────────────────────

  // 잔광 拡散(04·05 와 같은 기법) — 줄기가 지나간 자리의 밝기 버퍼를 拡散·냉각해 잔상을 남긴다
  var SWARM = 0.55, DIE_OUT = 0.988;

  var root = document.getElementById('cdRoot');
  var field = document.getElementById('cdField');
  var cv = document.getElementById('cdCv');
  var ctx = cv.getContext('2d');
  document.getElementById('cdMag').textContent = String(MAG_PX);
  document.getElementById('cdFork').textContent = String(FORK_N);

  // 시드 고정 PRNG — mulberry32. 미리보기가 항상 같은 추적으로 시작한다
  var SEED = 0x3160606;
  var prngState = SEED >>> 0;
  function rand() {
    prngState = (prngState + 0x6D2B79F5) >>> 0;
    var t = prngState;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // 색은 CSS 커스텀 프로퍼티(--bolt-*)에서 getComputedStyle 로 읽는다 — 파스텔 토큰이 scss 한 곳에
  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK  = tokRGB('--bolt-ink');
  var C_CORE = tokRGB('--bolt-core');
  var C_HALO = tokRGB('--bolt-halo');
  var C_MINT = tokRGB('--bolt-mint');
  var C_PINK = tokRGB('--bolt-pink');
  var C_MIST = tokRGB('--bolt-mist');
  function rgb(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  var W = 0, H = 0;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf = 0, t0 = -1;
  var STILL_T = 1.6;   // reduce 에서 그리는 시각 — 한 번 잡은 한 장

  // ── 상태 ──
  var hasPointer = false;          // pointermove 를 한 번이라도 받았는가
  var ptrX = 0, ptrY = 0;          // 목표(실제 포인터 또는 자동 경로)
  var curX = 0, curY = 0;          // 표시 위치 — 목표를 lerp 로 쫓아 미끄럽게
  var origin = { x: 0, y: 0 };     // 고정 시작점(상단)

  // 중점변위 — 선분을 depth 번 반분하며 중점을 법선 방향으로 무작위 오프셋
  function genBolt(ax, ay, bx, by, mag, depth) {
    var pts = [{ x: ax, y: ay }, { x: bx, y: by }];
    var dx = bx - ax, dy = by - ay;
    var len = Math.hypot(dx, dy) || 1;
    var nx = -dy / len, ny = dx / len;
    var off = mag;
    for (var d = 0; d < depth; d++) {
      var next = [pts[0]];
      for (var i = 0; i < pts.length - 1; i++) {
        var p = pts[i], q = pts[i + 1];
        var r = (rand() * 2 - 1) * off;
        next.push({ x: (p.x + q.x) * 0.5 + nx * r, y: (p.y + q.y) * 0.5 + ny * r }, q);
      }
      pts = next;
      off *= 0.55;
    }
    return pts;
  }

  function strokePath(pts, width, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  // ── 잔광 버퍼(04·05 와 같은 규격) ──
  var glow = null, glow2 = null, glowCv = null, glowCtx = null, glowImg = null;
  var HALO_LUT = new Uint8ClampedArray(256);
  (function () {
    for (var i = 0; i < 256; i++) {
      var t = i / 255;
      HALO_LUT[i] = Math.round(255 * Math.pow(t, 0.78) * 0.5);
    }
  })();
  function glowFit() {
    glow = new Float32Array(W * H);
    glow2 = new Float32Array(W * H);
    glowCv = document.createElement('canvas');
    glowCv.width = W; glowCv.height = H;
    glowCtx = glowCv.getContext('2d');
    glowImg = glowCtx.createImageData(W, H);
    var d = glowImg.data;
    for (var i = 3; i < d.length; i += 4) d[i] = 255;
  }
  function glowStamp(px, py, radius) {
    var cx = Math.round(px), cy = Math.round(py);
    for (var yy = cy - radius; yy <= cy + radius; yy++) {
      if (yy < 0 || yy >= H) continue;
      for (var xx = cx - radius; xx <= cx + radius; xx++) {
        var dxx = xx - cx, dyy = yy - cy;
        var d = Math.sqrt(dxx * dxx + dyy * dyy);
        if (d > radius || xx < 0 || xx >= W) continue;
        var v = d <= 1 ? 1.2 : (1 - d / radius) * 0.6;
        var idx = yy * W + xx;
        if (v > glow[idx]) glow[idx] = v;
      }
    }
  }
  function glowStampPath(pts, radius) {
    for (var i = 0; i < pts.length - 1; i++) {
      var p = pts[i], q = pts[i + 1];
      var seg = Math.max(1, Math.ceil(Math.hypot(q.x - p.x, q.y - p.y) / 2));
      for (var s = 0; s < seg; s++) {
        var f = s / seg;
        glowStamp(p.x + (q.x - p.x) * f, p.y + (q.y - p.y) * f, radius);
      }
    }
  }
  function glowDiffuse() {
    for (var y = 0; y < H; y++) {
      var row = y * W;
      var up = (y > 0 ? y - 1 : y) * W;
      var dn = (y < H - 1 ? y + 1 : y) * W;
      for (var x = 0; x < W; x++) {
        var i = row + x;
        var l = glow[i];
        var av = (glow[row + (x > 0 ? x - 1 : x)] + glow[row + (x < W - 1 ? x + 1 : x)] +
                  glow[up + x] + glow[dn + x]) * 0.25;
        glow2[i] = (l + SWARM * (av - l)) * DIE_OUT;
      }
    }
    var tmp = glow; glow = glow2; glow2 = tmp;
  }
  function glowCompose() {
    var d = glowImg.data, n = W * H;
    for (var i = 0; i < n; i++) {
      var v = glow[i];
      var li = v >= 1 ? 255 : (v <= 0 ? 0 : (v * 255) | 0);
      var a = HALO_LUT[li];
      var j = i << 2;
      d[j] = C_HALO[0]; d[j + 1] = C_HALO[1]; d[j + 2] = C_HALO[2]; d[j + 3] = a;
    }
    glowCtx.putImageData(glowImg, 0, 0);
  }

  function draw(tSec) {
    // 무대 — 어스름 잉크
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = rgb(C_INK, 1);
    ctx.fillRect(0, 0, W, H);

    // 목표 갱신 — 포인터가 없으면 리사주 8자 자동 시연 경로. 진폭을 넓혀 화면 구석까지 쓴다
    // 위상을 당겨 2초 시연 안에 8자가 좌우를 왕복하게 시작한다
    if (!hasPointer) {
      var a = tSec * AUTOSPD;
      ptrX = W * 0.5 + Math.sin(a * 1.3 - 1.1) * W * 0.40;
      ptrY = H * 0.55 + Math.sin(a * 2.6) * H * 0.36;
    }
    // 표시 위치 lerp — 목표를 부드럽게 쫓는다
    curX += (ptrX - curX) * 0.22;
    curY += (ptrY - curY) * 0.22;
    // 시작점(구름 매듭)도 자동 모드에선 천천히 좌우로 흘러간다 — 줄기가 상단 전체를 쓴다
    if (!hasPointer) {
      origin.x = W * 0.5 + Math.sin(tSec * AUTOSPD * 0.55 - 0.6) * W * 0.32;
    }

    // 줄기 — 시작점에서 표시 위치까지 새 경로
    var main = genBolt(origin.x, origin.y, curX, curY, MAG_PX, 6);

    // 잔광 拡散 버퍼 — 줄기를 도장한 뒤 번지게 하고 무대 위에 깐다
    glowStampPath(main, 13);
    glowDiffuse();
    glowCompose();
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(glowCv, 0, 0);

    // 가산혼합 — 빛 겹침
    ctx.globalCompositeOperation = 'lighter';
    strokePath(main, 10, rgb(C_HALO, 0.14));
    strokePath(main, 3.4, rgb(C_HALO, 0.48));
    strokePath(main, 1.5, rgb(C_CORE, 0.95));

    // 곁가지 — 줄기 중간 무작위 지점에서 비스듬히 짧게
    for (var k = 0; k < FORK_N; k++) {
      var t = 0.3 + rand() * 0.5;
      var idx = Math.min(main.length - 2, Math.floor(t * (main.length - 1)));
      var p = main[idx];
      var fl = H * (0.16 + rand() * 0.18);
      var side = rand() < 0.5 ? -1 : 1;
      var fr = genBolt(p.x, p.y, p.x + side * W * 0.08, p.y + fl * 0.4, fl * 0.4, 4);
      glowStampPath(fr, 10);   // 곁가지도 잔광에 남긴다
      var fc = k % 2 === 0 ? C_MINT : C_PINK;
      strokePath(fr, 2.6, rgb(fc, 0.18));
      strokePath(fr, 0.9, rgb(fc, 0.55));
    }

    // 착탄 광륜 — 끝점에서 퍼지는 링(위상으로 반복)
    var ringPh = (tSec * 1.4) % 1;
    ctx.strokeStyle = rgb(C_MIST, 0.5 * (1 - ringPh));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(curX, curY, 4 + ringPh * 22, 0, Math.PI * 2);
    ctx.stroke();
    // 끝점 코어 광점
    var g = ctx.createRadialGradient(curX, curY, 0, curX, curY, 12);
    g.addColorStop(0, rgb(C_CORE, 0.85));
    g.addColorStop(1, rgb(C_HALO, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(curX, curY, 12, 0, Math.PI * 2); ctx.fill();

    // 시작점 — 상단 구름 매듭
    ctx.globalCompositeOperation = 'source-over';
    var hg = ctx.createRadialGradient(origin.x, origin.y, 0, origin.x, origin.y, 16);
    hg.addColorStop(0, rgb(C_HALO, 0.55));
    hg.addColorStop(1, rgb(C_HALO, 0));
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(origin.x, origin.y, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgb(C_CORE, 0.9);
    ctx.beginPath(); ctx.arc(origin.x, origin.y, 2.5, 0, Math.PI * 2); ctx.fill();

    // 자동 모드 표시 — 포인터를 아직 안 움직였으면 커서 점을 또렷이
    if (!hasPointer) {
      ctx.strokeStyle = rgb(C_MIST, 0.65);
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(curX, curY, 5, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.max(2, Math.round(r.width));
    H = Math.max(2, Math.round(r.height));
    cv.width = W; cv.height = H;
    prngState = SEED >>> 0;
    glowFit();
    origin.x = W * 0.5; origin.y = -4;
    ptrX = W * 0.5; ptrY = H * 0.62;
    curX = ptrX; curY = ptrY;
  }

  // 포인터 — 첫 이동부터 추적. field 밖으로 나가도 마지막 좌표를 유지한다
  field.addEventListener('pointermove', function (ev) {
    var r = field.getBoundingClientRect();
    ptrX = ev.clientX - r.left;
    ptrY = ev.clientY - r.top;
    if (!hasPointer) { curX = ptrX; curY = ptrY; }   // 첫 접촉은 점프 — 뒤끝김 방지
    hasPointer = true;
  });

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () { fit(); if (reduce) draw(STILL_T); });

  fit();
  if (reduce) {
    draw(STILL_T);
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
