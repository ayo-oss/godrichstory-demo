<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>폭풍 하늘 다회 낙뢰 — 지수분포 대기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cd is-demo" id="cdRoot">
  <p class="cd__hint">
    <span>Drawing the wait for the next strike from an exponential distribution makes the storm surge and pause like the real thing. Distant lightning only changes the sky's light; nearby lightning shows its stem in full</span>
  </p>
  <div class="cd__field" id="cdField" role="application" aria-label="Storm-Sky Multi-Strike test panel" tabindex="0">
    <canvas class="cd__cv" id="cdCv"></canvas>
  </div>
  <div class="cd__bar">
    <span class="cd__meta">avg <b class="cd__val" id="cdN">0.5</b>sec interval · storm burst</span>
    <span class="cd__meta cd__meta--dim">canvas · lineTo · globalCompositeOperation</span>
  </div>
</div>
</main>
<script>
// 폭풍 하늘 다회 낙뢰(03). 다음 낙뢰까지의 대기를 지수분포(-ln(u)*MEAN)로 뽑아 몰아침-고요 리듬을 만든다.
// 폭풍 강도(쿨다운)가 사인파로 천천히 오르내려 파도 치는 밤이 되고, 각 낙뢰는 거리(원근)를 가진다 —
// 먼 번개는 줄기 대신 하늘 면적이 확 밝아지는 섬광, 가까운 번개는 중점변위 줄기 + 구름 윤곽 실루엣.
// lighter 합성으로 섬광과 줄기 광이 겹쳐 쌓인다. 다크 모드 히어로 배경용.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var MEAN    = 0.5;   // 지수분포 avg 간격(초) — 작을수록 몰아침
  var STORM_A = 0.5;   // 폭풍 강도 진폭 — 몰아침-고요의 대비
  var FARMAX  = 1.0;   // 원근 최대 거리 — 1 은 먼 번개까지, 0.6 은 대부분 가까운 번개
  // ────────────────────────────────────────────────────

  var root = document.getElementById('cdRoot');
  var field = document.getElementById('cdField');
  var cv = document.getElementById('cdCv');
  var ctx = cv.getContext('2d');
  var nOut = document.getElementById('cdN');

  // 시드 고정 PRNG — mulberry32. 미리보기가 항상 같은 폭풍으로 흐른다
  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x316C03);

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK  = tokRGB('--bolt-ink');
  var C_DUSK = tokRGB('--bolt-dusk');
  var C_CORE = tokRGB('--bolt-core');
  var C_LILA = tokRGB('--bolt-lilac');
  var C_MINT = tokRGB('--bolt-mint');
  var C_PINK = tokRGB('--bolt-pink');
  var C_MIST = tokRGB('--bolt-mist');

  var TAU = Math.PI * 2;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0;
  var raf = 0, t0 = -1;

  var DEPTH = 6;
  var ROUGH = 0.4;

  // ── 중점변위 ──
  function displace(ax, ay, bx, by, depth, out) {
    if (depth === 0) { out.push([bx, by]); return; }
    var mx = (ax + bx) / 2, my = (ay + by) / 2;
    var dx = bx - ax, dy = by - ay;
    var len = Math.hypot(dx, dy) || 1;
    var nx = -dy / len, ny = dx / len;
    var off = (rand() * 2 - 1) * len * ROUGH * 0.5;
    mx += nx * off; my += ny * off;
    displace(ax, ay, mx, my, depth - 1, out);
    displace(mx, my, bx, by, depth - 1, out);
  }

  // ── 구름 — 층층이 쌓인 실루엣. 섬광에 따라 명도가 오르내리고, 느린 표류로 계속 움직인다 ──
  var clouds = [];
  function buildClouds() {
    clouds = [];
    var layers = 3;
    for (var L = 0; L < layers; L++) {
      var lobes = [];
      var count = 6 + L * 2;
      for (var i = 0; i < count; i++) {
        lobes.push({
          rx: (i + 0.5) / count + (rand() - 0.5) * 0.06,
          ry: 0.08 + L * 0.05 + (rand() - 0.5) * 0.03,
          r: 0.10 + rand() * 0.08 + (2 - L) * 0.02,
          ph: (i / count) * TAU + L * 1.7
        });
      }
      clouds.push({ lobes: lobes, depth: (L + 1) / layers, spd: 0.05 + L * 0.02 });
    }
  }

  var bolts = [];       // {pts, born, life, dist, ex, flickAt}
  var nextAt = 0.05;
  var cycle = 0;
  var ANCHORS = [0.2, 0.5, 0.82, 0.35, 0.66, 0.08, 0.92, 0.48];

  function spawn(t, storm) {
    // 거리 — 폭풍이 몰아칠 때는 가까운 번개의 비중이 커진다
    var dist = Math.pow(rand(), 1.6 - storm * 0.8) * FARMAX;
    var ax = ANCHORS[cycle % ANCHORS.length] + (rand() - 0.5) * 0.12;
    cycle++;
    var sx = (ax + (dist * 0.5 - 0.25) * 0.2) * W;   // 먼 번개는 중앙 쪽으로 몰림
    var ex = sx + (rand() - 0.5) * W * 0.2 * (1 - dist * 0.5);
    var pts = null;
    if (dist < 0.55) {
      pts = [[sx, -6]];
      displace(sx, -6, ex, H * (0.82 - dist * 0.1), DEPTH - (dist > 0.3 ? 1 : 0), pts);
    }
    bolts.push({ pts: pts, born: t, life: 0.45 + rand() * 0.25, dist: dist, ex: ex, flickAt: t, sx: sx });
  }

  function env(s, t) {
    var u = (t - s.born) / s.life;
    if (u >= 1 || u < 0) return 0;
    var b = Math.pow(1 - u, 1.6);
    if (u > 0.28 && u < 0.36) b = Math.max(b, 0.75);
    return b;
  }

  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function mix(c1, c2, k) {
    return [c1[0] + (c2[0] - c1[0]) * k, c1[1] + (c2[1] - c1[1]) * k, c1[2] + (c2[2] - c1[2]) * k];
  }

  function draw(t, sky) {
    // 하늘 — 어스름 잉크에서 지평선 슬레이트. sky(0..1) 로 전체 명도가 오르내린다
    var top = mix(C_INK, C_DUSK, 0.08 + 0.5 * sky);
    var bot = mix(C_INK, C_DUSK, 0.4 + 0.6 * sky);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgba(top, 1));
    g.addColorStop(1, rgba(bot, 1));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 별먼지 — 폭풍 밤바닥의 미세 명도 요동
    for (var i = 0; i < specks.length; i++) {
      var sp = specks[i];
      var a = 0.04 + 0.26 * (0.5 + 0.5 * Math.sin(t * sp.spd + sp.ph));
      ctx.fillStyle = rgba(C_MIST, a);
      ctx.fillRect(sp.rx * W, sp.ry * H, 1.5, 1.5);
    }

    // 구름 — 섬광(sky) 에 반응하는 실루엣. lighter 로 빛이 쌓인다(칩: globalCompositeOperation)
    ctx.globalCompositeOperation = 'lighter';
    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c];
      var clCol = mix(mix(C_INK, C_DUSK, 0.3), C_LILA, 0.10 + 0.38 * sky * (1 - cl.depth * 0.3));
      ctx.fillStyle = rgba(clCol, 0.5);
      for (var L = 0; L < cl.lobes.length; L++) {
        var lb = cl.lobes[L];
        var drift = Math.sin(t * cl.spd + lb.ph) * 0.018;   // 느린 표류 — 매 프레임 실루엣이 미세하게 흘러간다
        ctx.beginPath();
        ctx.ellipse((lb.rx + drift) * W, lb.ry * H, lb.r * W * 0.5, lb.r * H * 0.42, 0, 0, TAU);
        ctx.fill();
      }
    }

    // 줄기 — 가까운 번개만. 헤일로·중간광·코어
    for (var j = 0; j < bolts.length; j++) {
      var s = bolts[j];
      var b = env(s, t);
      if (b <= 0 || !s.pts) continue;
      var near = 1 - s.dist / FARMAX;
      var pts = s.pts;
      var k, m;
      ctx.strokeStyle = rgba(C_LILA, 0.16 * b * near);
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
      ctx.stroke();
      ctx.strokeStyle = rgba(C_LILA, 0.5 * b * near);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
      ctx.stroke();
      ctx.strokeStyle = rgba(C_CORE, b * near);
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
      ctx.stroke();
      // 지면 블룸
      var gy = H * (0.82 - s.dist * 0.1);
      var br = 8 + 26 * b * near;
      var g2 = ctx.createRadialGradient(s.ex, gy, 0, s.ex, gy, br);
      g2.addColorStop(0, rgba(C_MINT, 0.45 * b * near));
      g2.addColorStop(1, rgba(C_LILA, 0));
      ctx.fillStyle = g2;
      ctx.fillRect(s.ex - br, gy - br, br * 2, br * 2);
      // 착지 핑크 고리
      ctx.beginPath();
      ctx.arc(s.ex, gy, 4 + 18 * b * near, 0, TAU);
      ctx.strokeStyle = rgba(C_PINK, 0.28 * b * near);
      ctx.lineWidth = 1.3;
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  var specks = [];
  function buildSpecks() {
    specks = [];
    for (var i = 0; i < 18; i++) {
      specks.push({ rx: rand(), ry: rand() * 0.8, ph: rand() * TAU, spd: 1 + rand() * 1.6 });
    }
  }

  function stormLevel(t) {
    return 0.5 + STORM_A * Math.sin(t * 0.5) * Math.sin(t * 0.23 + 1.7);
  }

  var skyGlow = 0;

  function update(t, dt) {
    var storm = stormLevel(t);
    if (t >= nextAt) {
      spawn(t, storm);
      // 지수분포 대기 — 다음 낙뢰까지. 몰아칠 때는 평균이 짧아진다
      var mean = MEAN * (1.65 - storm * 1.1);
      nextAt = t + -Math.log(1 - rand()) * mean;
    }
    var target = 0;
    for (var i = 0; i < bolts.length; i++) {
      var s = bolts[i];
      var b = env(s, t);
      if (b > 0) target = Math.max(target, b * (0.25 + 0.75 * (1 - s.dist / FARMAX)));
      if (t - s.born < s.life * 0.8 && t - s.flickAt > 0.06) {
        s.flickAt = t;
        if (s.pts && s.dist < 0.4) {
          var pts = [[s.sx, -6]];
          displace(s.sx, -6, s.ex, H * (0.82 - s.dist * 0.1), DEPTH - (s.dist > 0.3 ? 1 : 0), pts);
          s.pts = pts;
        }
      }
    }
    skyGlow += (target - skyGlow) * Math.min(1, dt * 14);
    while (bolts.length && t - bolts[0].born > 1.2) bolts.shift();
    return storm;
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W); cv.height = Math.round(H);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }

  function stillFrame() {
    bolts = [];
    var pts = [[W * 0.5, -6]];
    displace(W * 0.5, -6, W * 0.56, H * 0.8, DEPTH, pts);
    bolts.push({ pts: pts, born: 0.04, life: 0.55, dist: 0.12, ex: W * 0.56, flickAt: 0, sx: W * 0.5 });
    draw(0.04, 0.8);
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    var dt = Math.min(0.05, (now - (frame.prev || now)) / 1000);
    frame.prev = now;
    update(t, dt);
    draw(t, Math.max(0, skyGlow + 0.04));
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    fit();
    if (reduce) stillFrame();
  });

  fit();
  buildClouds();
  buildSpecks();
  nOut.textContent = MEAN.toFixed(1);
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
