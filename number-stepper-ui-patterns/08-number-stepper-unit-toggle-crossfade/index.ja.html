<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>単位トグル切替 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="nsputc is-demo" id="nsputc">
  <div class="nsputc__panel">
    <span class="nsputc__label">荷物の重さ</span>
    <div class="nsputc__row">
      <button class="nsputc__btn" id="nsputcMinus" aria-label="1減らす" type="button">−</button>
      <div class="nsputc__flipBox" id="nsputcFlipBox">
        <span class="nsputc__value" id="nsputcValue">20<small id="nsputcUnit">kg</small></span>
      </div>
      <button class="nsputc__btn" id="nsputcPlus" aria-label="1増やす" type="button">+</button>
    </div>
    <button class="nsputc__toggle" id="nsputcToggle" type="button">kg ⇄ lb 単位を切り替え</button>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('nsputc');
  var btnPlus = document.getElementById('nsputcPlus');
  var btnMinus = document.getElementById('nsputcMinus');
  var btnToggle = document.getElementById('nsputcToggle');
  var flipBox = document.getElementById('nsputcFlipBox');
  var valueEl = document.getElementById('nsputcValue');
  var unitEl = document.getElementById('nsputcUnit');

  var MIN_KG = 1, MAX_KG = 200, STEP_KG = 1;
  var FACTOR = 2.20462;
  var baseKg = 20;
  var unit = 'kg';
  var flipRaf = null;

  function displayValue() {
    if (unit === 'kg') { return String(baseKg); }
    return (Math.round(baseKg * FACTOR * 10) / 10).toFixed(1);
  }
  function render() {
    valueEl.firstChild.textContent = displayValue();
    unitEl.textContent = unit;
  }

  function bump() {
    valueEl.style.transform = 'scale(1.1)';
    setTimeout(function () { valueEl.style.transform = 'scale(1)'; }, 90);
  }

  function setKg(next) {
    next = Math.max(MIN_KG, Math.min(MAX_KG, next));
    if (next === baseKg) { return; }
    baseKg = next;
    render();
    bump();
  }

  // 계산 겹: 카드가 0~180도 도는 동안 |cos(angle)| 로 세로 비율을 계산해 90도 지점에서
  // 두께가 0 이 되게 만들고, 그 순간(딱 한 프레임)에 값을 실제 환산식(factor 곱)으로 바꿔 끼운다 —
  // 겹쳐서 흐려지는 크로스페이드가 아니라 진짜로 "뒤집혀서 바뀌는" 컷이다.
  function flipToggle() {
    if (flipRaf) { cancelAnimationFrame(flipRaf); }
    var duration = 340;
    var start = performance.now();
    var swapped = false;
    function frame(now) {
      var t = Math.min(1, (now - start) / duration);
      var angle = t * Math.PI;
      var scaleY = Math.abs(Math.cos(angle));
      flipBox.style.transform = 'scaleY(' + Math.max(0.06, scaleY).toFixed(3) + ')';
      if (!swapped && t >= 0.5) {
        unit = unit === 'kg' ? 'lb' : 'kg';
        render();
        swapped = true;
      }
      if (t < 1) {
        flipRaf = requestAnimationFrame(frame);
      } else {
        flipBox.style.transform = 'scaleY(1)';
        flipRaf = null;
      }
    }
    flipRaf = requestAnimationFrame(frame);
  }

  btnPlus.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); setKg(baseKg + STEP_KG); });
  btnMinus.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); setKg(baseKg - STEP_KG); });
  btnToggle.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); flipToggle(); });

  var seq = ['bump', 'bump', 'flip', 'bump', 'flip', 'bump'];
  var idx = 0;
  var autoplayTimer = null;
  function stopAutoplay() { if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplayTimer = setInterval(function () {
      var op = seq[idx % seq.length];
      idx += 1;
      if (op === 'flip') { flipToggle(); } else { setKg(baseKg + (Math.random() > 0.5 ? 3 : -3)); }
    }, 700);
  }
  render();
})();
</script>
</body>
</html>
