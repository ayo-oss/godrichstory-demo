<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通貨のライブ表記 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="nspcf is-demo" id="nspcf">
  <div class="nspcf__panel">
    <span class="nspcf__label">コイン残高</span>
    <div class="nspcf__amount">
      <span class="nspcf__symbol">◆</span>
      <span class="nspcf__col" data-col="0"><span class="nspcf__digit nspcf__digit--old">0</span><span class="nspcf__digit nspcf__digit--new">0</span></span>
      <span class="nspcf__comma">,</span>
      <span class="nspcf__col" data-col="1"><span class="nspcf__digit nspcf__digit--old">0</span><span class="nspcf__digit nspcf__digit--new">0</span></span>
      <span class="nspcf__col" data-col="2"><span class="nspcf__digit nspcf__digit--old">0</span><span class="nspcf__digit nspcf__digit--new">0</span></span>
      <span class="nspcf__col" data-col="3"><span class="nspcf__digit nspcf__digit--old">0</span><span class="nspcf__digit nspcf__digit--new">0</span></span>
    </div>
    <div class="nspcf__row">
      <button class="nspcf__btn" id="nspcfMinus" aria-label="250減らす" type="button">−</button>
      <button class="nspcf__btn" id="nspcfPlus" aria-label="250増やす" type="button">+</button>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('nspcf');
  var btnPlus = document.getElementById('nspcfPlus');
  var btnMinus = document.getElementById('nspcfMinus');
  var cols = Array.prototype.slice.call(root.querySelectorAll('.nspcf__col'));

  var MIN = 0, MAX = 9999, STEP = 250;
  var value = 0;
  var H = 32;

  function toDigits(n) {
    var s = ('0000' + n).slice(-4);
    return [+s[0], +s[1], +s[2], +s[3]];
  }

  // 계산 겹: 자릿수(place)가 클수록 굴러가는 시작을 더 늦추고(delay) 더 오래 돈다(duration) —
  // 실제 기계식 계기판처럼 1의 자리가 먼저 넘어가고 그 여파가 왼쪽으로 번져 간다.
  var CASCADE = 60, BASE_DUR = 220;
  function startColumnRoll(colEl, oldD, newD, dir, place) {
    var oldEl = colEl.querySelector('.nspcf__digit--old');
    var newEl = colEl.querySelector('.nspcf__digit--new');
    var delay = place * CASCADE;
    var duration = BASE_DUR + place * 40;
    newEl.textContent = String(newD);
    newEl.style.transform = 'translateY(' + (dir * H) + 'px)';
    setTimeout(function () {
      var start = performance.now();
      function frame(now) {
        var t = Math.min(1, (now - start) / duration);
        var eased = 1 - Math.pow(1 - t, 3);
        oldEl.style.transform = 'translateY(' + (dir * H * eased).toFixed(1) + 'px)';
        newEl.style.transform = 'translateY(' + (dir * H * (eased - 1)).toFixed(1) + 'px)';
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          oldEl.textContent = String(newD);
          oldEl.style.transform = 'translateY(0)';
          newEl.style.transform = 'translateY(' + (dir * H) + 'px)';
        }
      }
      requestAnimationFrame(frame);
    }, delay);
  }

  function commit(next) {
    next = Math.max(MIN, Math.min(MAX, next));
    if (next === value) { return; }
    var dir = next > value ? 1 : -1;
    var oldDigits = toDigits(value);
    var newDigits = toDigits(next);
    value = next;
    for (var i = 0; i < 4; i++) {
      if (oldDigits[i] !== newDigits[i]) {
        startColumnRoll(cols[i], oldDigits[i], newDigits[i], dir, 3 - i);
      }
    }
  }

  btnPlus.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); commit(value + STEP); });
  btnMinus.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); commit(value - STEP); });

  var seq = [250, 750, 1750, 4000, 9999, 0, 3333];
  var idx = 0;
  var autoplayTimer = null;
  function stopAutoplay() { if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplayTimer = setInterval(function () {
      commit(seq[idx % seq.length]);
      idx += 1;
    }, 1000);
  }
})();
</script>
</body>
</html>
