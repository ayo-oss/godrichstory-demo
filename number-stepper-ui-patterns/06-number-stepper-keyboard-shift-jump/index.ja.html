<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キーボードジャンプ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="nspkj is-demo" id="nspkj">
  <div class="nspkj__panel">
    <span class="nspkj__label">割り当てポイント</span>
    <div class="nspkj__stage" tabindex="0" role="spinbutton" aria-valuemin="0" aria-valuemax="200" id="nspkjBox" aria-label="ポイント調整、矢印キーで1ずつ、Shift+矢印キーで10ずつ">
      <span class="nspkj__ghost" id="nspkjGhost"></span>
      <span class="nspkj__value" id="nspkjValue">40</span>
    </div>
    <span class="nspkj__hint">↑↓で1ずつ・Shiftで10ずつ・Home/Endで最小最大</span>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('nspkj');
  var box = document.getElementById('nspkjBox');
  var valueEl = document.getElementById('nspkjValue');
  var ghost = document.getElementById('nspkjGhost');

  var MIN = 0, MAX = 200;
  var value = 40;
  var raf = null;

  function render() { valueEl.textContent = String(value); }

  // 계산 겹: 점프 폭(delta)의 로그값으로 잔상 이동 거리를 계산한다 — 1씩 바뀌면 살짝,
  // Home/End 처럼 크게 뛰면 잔상이 더 멀리 더 오래 미끄러지며 사라진다(고정 키프레임이 아니다).
  function jump(oldVal, delta) {
    ghost.textContent = String(oldVal);
    var dist = Math.min(46, 12 + Math.log2(1 + Math.abs(delta)) * 13);
    var dir = delta >= 0 ? -1 : 1;
    var dur = Math.min(520, 220 + Math.abs(delta));
    var start = performance.now();
    if (raf) { cancelAnimationFrame(raf); }
    ghost.style.opacity = '1';
    function frame(now) {
      var t = Math.min(1, (now - start) / dur);
      var eased = 1 - Math.pow(1 - t, 3);
      ghost.style.transform = 'translateY(' + (dir * dist * eased).toFixed(1) + 'px)';
      ghost.style.opacity = (1 - eased).toFixed(3);
      if (t < 1) {
        raf = requestAnimationFrame(frame);
      } else {
        ghost.style.opacity = '0';
        raf = null;
      }
    }
    raf = requestAnimationFrame(frame);
    valueEl.style.transform = 'scale(1.12)';
    setTimeout(function () { valueEl.style.transform = 'scale(1)'; }, 30);
  }

  function commit(next) {
    next = Math.max(MIN, Math.min(MAX, next));
    if (next === value) { return; }
    var delta = next - value;
    var old = value;
    value = next;
    render();
    jump(old, delta);
  }

  box.addEventListener('keydown', function (e) {
    root.classList.remove('is-demo'); stopAutoplay();
    if (e.key === 'ArrowUp') { commit(value + (e.shiftKey ? 10 : 1)); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { commit(value - (e.shiftKey ? 10 : 1)); e.preventDefault(); }
    else if (e.key === 'Home') { commit(MIN); e.preventDefault(); }
    else if (e.key === 'End') { commit(MAX); e.preventDefault(); }
  });

  var seq = [1, 1, 10, -1, -200, 200, -10];
  var idx = 0;
  var autoplayTimer = null;
  function stopAutoplay() { if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplayTimer = setInterval(function () {
      var d = seq[idx % seq.length];
      idx += 1;
      commit(d <= -100 ? MIN : d >= 100 ? MAX : value + d);
    }, 620);
  }
  render();
})();
</script>
</body>
</html>
