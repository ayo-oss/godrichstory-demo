<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホイールで値を回す — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="nspwd is-demo" id="nspwd">
  <div class="nspwd__panel">
    <span class="nspwd__label">拡大倍率</span>
    <span class="nspwd__value" id="nspwdValue">100%</span>
    <div class="nspwd__track">
      <span class="nspwd__fillDown" id="nspwdFillDown"></span>
      <span class="nspwd__mid"></span>
      <span class="nspwd__fillUp" id="nspwdFillUp"></span>
    </div>
    <span class="nspwd__hint">ホイールの移動量がたまると1段ずつ変わります</span>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('nspwd');
  var panel = root.querySelector('.nspwd__panel');
  var valueEl = document.getElementById('nspwdValue');
  var fillUp = document.getElementById('nspwdFillUp');
  var fillDown = document.getElementById('nspwdFillDown');

  var MIN = 50, MAX = 200, STEP = 10, THRESH = 60;
  var value = 100;
  var residual = 0;

  function render() { valueEl.textContent = value + '%'; }
  function paintTrack() {
    var p = Math.min(1, Math.abs(residual) / THRESH);
    fillUp.style.transform = 'scaleX(' + (residual > 0 ? p : 0).toFixed(3) + ')';
    fillDown.style.transform = 'scaleX(' + (residual < 0 ? p : 0).toFixed(3) + ')';
  }

  // 계산 겹: 휠 delta 를 잔여값(residual)에 누적하다가 문턱(THRESH)을 넘을 때만 한 칸 커밋한다.
  // 커밋되지 않은 잔여값은 매 프레임 마찰(0.9배)로 감쇠시켜 손을 놓아도 서서히 0으로 가라앉는다.
  function applyDelta(dy) {
    residual += dy;
    while (residual >= THRESH) {
      value = Math.min(MAX, value + STEP);
      residual -= THRESH;
      render();
    }
    while (residual <= -THRESH) {
      value = Math.max(MIN, value - STEP);
      residual += THRESH;
      render();
    }
    paintTrack();
  }

  function decayFrame() {
    if (Math.abs(residual) > 0.5) {
      residual *= 0.90;
      paintTrack();
    } else if (residual !== 0) {
      residual = 0;
      paintTrack();
    }
    requestAnimationFrame(decayFrame);
  }
  requestAnimationFrame(decayFrame);

  panel.addEventListener('wheel', function (e) {
    root.classList.remove('is-demo'); stopAutoplay();
    e.preventDefault();
    applyDelta(e.deltaY);
  }, { passive: false });

  var seq = [16, 16, 16, 16, -16, -16, -16, -16];
  var idx = 0;
  var autoplayTimer = null;
  function stopAutoplay() { if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplayTimer = setInterval(function () {
      applyDelta(seq[idx % seq.length]);
      idx += 1;
    }, 180);
  }
  render();
})();
</script>
</body>
</html>
