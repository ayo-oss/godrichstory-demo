<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>長押し加速 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="nspla is-demo" id="nspla">
  <div class="nspla__panel">
    <span class="nspla__label">保有ポイント</span>
    <div class="nspla__row">
      <button class="nspla__btn" id="nsplaMinus" type="button" aria-label="ポイントを減らす">-</button>
      <span class="nspla__value" id="nsplaValue">80</span>
      <button class="nspla__btn" id="nsplaPlus" type="button" aria-label="ポイントを増やす">+</button>
    </div>
    <div class="nspla__meter">
      <span class="nspla__meterFill" id="nsplaMeterFill"></span>
    </div>
    <span class="nspla__hint">長く押すほど間隔が短くなります</span>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('nspla');
  var valueEl = document.getElementById('nsplaValue');
  var minusBtn = document.getElementById('nsplaMinus');
  var plusBtn = document.getElementById('nsplaPlus');
  var meterFill = document.getElementById('nsplaMeterFill');

  var MIN = 0, MAX = 500, START = 480, FLOOR = 60, DECAY = 0.82;
  var value = 80;
  var timer = null;
  var ticks = 0;

  function render() { valueEl.textContent = String(value); }

  // 계산 겹: 반복 간격을 START*DECAY^ticks 로 매 틱 다시 계산한다(지수 감쇠, 바닥은 FLOOR) —
  // setInterval 고정 주기가 아니라 재귀 setTimeout 으로 간격 자체를 갱신한다.
  function currentInterval() {
    return Math.max(FLOOR, START * Math.pow(DECAY, ticks));
  }
  function paintMeter() {
    var iv = currentInterval();
    var speed = (START - iv) / (START - FLOOR); // 0(느림) ~ 1(가장 빠름)
    meterFill.style.transform = 'scaleX(' + speed.toFixed(3) + ')';
  }

  function scheduleNext(dir) {
    timer = setTimeout(function () {
      value = Math.max(MIN, Math.min(MAX, value + dir * 5));
      render();
      ticks += 1;
      paintMeter();
      scheduleNext(dir);
    }, currentInterval());
  }

  function start(dir) {
    stop();
    ticks = 0;
    value = Math.max(MIN, Math.min(MAX, value + dir * 5));
    render();
    paintMeter();
    scheduleNext(dir);
  }
  function stop() {
    if (timer) { clearTimeout(timer); timer = null; }
    ticks = 0;
    meterFill.style.transform = 'scaleX(0)';
  }

  function wireReal(btn, dir) {
    btn.addEventListener('pointerdown', function (e) {
      root.classList.remove('is-demo'); stopAutoplay();
      e.preventDefault(); start(dir);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) {
      btn.addEventListener(ev, stop);
    });
  }
  wireReal(minusBtn, -1);
  wireReal(plusBtn, 1);

  var autoplayTimer = null;
  function autoplayCycle() {
    start(1);
    setTimeout(stop, 1900);
    setTimeout(function () { start(-1); }, 2300);
    setTimeout(stop, 4200);
  }
  function stopAutoplay() { if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplayCycle();
    autoplayTimer = setInterval(autoplayCycle, 4700);
  }
  render();
})();
</script>
</body>
</html>
