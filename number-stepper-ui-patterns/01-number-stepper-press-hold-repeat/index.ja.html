<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>長押しリピート — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="nsphr is-demo" id="nsphr">
  <div class="nsphr__panel">
    <span class="nsphr__label">在庫数量</span>
    <div class="nsphr__row">
      <button class="nsphr__btn nsphr__btn--minus" id="nsphrMinus" type="button" aria-label="数量を減らす">
        <svg class="nsphr__ring" viewBox="0 0 32 32" aria-hidden="true">
          <circle class="nsphr__ringTrack" cx="16" cy="16" r="14"></circle>
          <circle class="nsphr__ringFill" id="nsphrRingMinus" cx="16" cy="16" r="14"></circle>
        </svg>
        <span>-</span>
      </button>
      <span class="nsphr__value" id="nsphrValue">12</span>
      <button class="nsphr__btn nsphr__btn--plus" id="nsphrPlus" type="button" aria-label="数量を増やす">
        <svg class="nsphr__ring" viewBox="0 0 32 32" aria-hidden="true">
          <circle class="nsphr__ringTrack" cx="16" cy="16" r="14"></circle>
          <circle class="nsphr__ringFill" id="nsphrRingPlus" cx="16" cy="16" r="14"></circle>
        </svg>
        <span>+</span>
      </button>
    </div>
    <span class="nsphr__hint" id="nsphrHint">押し続けると220msごとに1ずつ変わります</span>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('nsphr');
  var valueEl = document.getElementById('nsphrValue');
  var minusBtn = document.getElementById('nsphrMinus');
  var plusBtn = document.getElementById('nsphrPlus');
  var ringMinus = document.getElementById('nsphrRingMinus');
  var ringPlus = document.getElementById('nsphrRingPlus');
  var CIRC = 2 * Math.PI * 14;
  [ringMinus, ringPlus].forEach(function (r) { r.style.strokeDasharray = CIRC.toFixed(2); });

  var MIN = 0, MAX = 30, DELAY = 380, INTERVAL = 220;
  var value = 12;
  var held = null;
  var lastTick = 0;
  var repeatTimer = null;
  var delayTimer = null;

  function render() { valueEl.textContent = String(value); }

  function step(dir) {
    value = Math.max(MIN, Math.min(MAX, value + dir));
    render();
    lastTick = performance.now();
  }

  // 계산 겹: 반복 간격 자체는 고정(220ms)이지만, 다음 반복까지 남은 시간을 매 프레임 다시 계산해
  // 링(stroke-dashoffset)에 대입한다 — 정적 트윈이 아니라 "다음 틱까지 몇 %"를 실시간으로 그린다.
  function ringFrame() {
    var now = performance.now();
    var p = held ? Math.min(1, (now - lastTick) / INTERVAL) : 0;
    var offset = CIRC * (1 - p);
    ringMinus.style.strokeDashoffset = (held === 'minus' ? offset : CIRC).toFixed(2);
    ringPlus.style.strokeDashoffset = (held === 'plus' ? offset : CIRC).toFixed(2);
    requestAnimationFrame(ringFrame);
  }
  requestAnimationFrame(ringFrame);

  function start(dir) {
    stop();
    held = dir > 0 ? 'plus' : 'minus';
    step(dir);
    delayTimer = setTimeout(function () {
      repeatTimer = setInterval(function () { step(dir); }, INTERVAL);
    }, DELAY);
  }
  function stop() {
    held = null;
    if (delayTimer) { clearTimeout(delayTimer); delayTimer = null; }
    if (repeatTimer) { clearInterval(repeatTimer); repeatTimer = null; }
  }

  function wireReal(btn, dir) {
    btn.addEventListener('pointerdown', function (e) {
      root.classList.remove('is-demo'); stopAutoplay();
      e.preventDefault(); start(dir);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) {
      btn.addEventListener(ev, stop);
    });
  }
  wireReal(minusBtn, -1);
  wireReal(plusBtn, 1);

  var autoplayTimer = null;
  function autoplayCycle() {
    start(1);
    setTimeout(stop, 1000);
    setTimeout(function () { start(-1); }, 1400);
    setTimeout(stop, 2400);
  }
  function stopAutoplay() { if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplayCycle();
    autoplayTimer = setInterval(autoplayCycle, 2800);
  }
  render();
})();
</script>
</body>
</html>
