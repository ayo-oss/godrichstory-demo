<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eight-handle corner radius — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gen is-demo" id="gen">
  <div class="gen__top">
    <div class="gen__preview-wrap" aria-hidden="true">
      <div class="gen__preview"></div>
      <span class="gen__dot gen__dot--tl"></span><span class="gen__dot gen__dot--tr"></span>
      <span class="gen__dot gen__dot--br"></span><span class="gen__dot gen__dot--bl"></span>
    </div>
    <div class="gen__grid">
      <label class="gen__row">
        <span class="gen__lab">Top L</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="0" max="80" step="4" value="12" data-var="--r-tl" aria-label="Top-left corner radius">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">Top R</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="0" max="80" step="4" value="48" data-var="--r-tr" aria-label="Top-right corner radius">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">Bot R</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="0" max="80" step="4" value="12" data-var="--r-br" aria-label="Bottom-right corner radius">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">Bot L</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="0" max="80" step="4" value="48" data-var="--r-bl" aria-label="Bottom-left corner radius">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">Vert radius</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="0" max="80" step="4" value="28" data-var="--r-vy" aria-label="Corner vertical radius">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
    </div>
  </div>
  <div class="gen__out">
    <code class="gen__code"><span class="gen__prop">border-radius:</span> <span class="gen__v gen__v--tl"></span>px <span class="gen__v gen__v--tr"></span>px <span class="gen__v gen__v--br"></span>px <span class="gen__v gen__v--bl"></span>px / <span class="gen__v gen__v--vy"></span>px</code>
    <button class="gen__copy" type="button" id="copy">Copy</button>
  </div>
</div>
</main>
<script>
var gen = document.getElementById('gen');
var copyBtn = document.getElementById('copy');
var ranges = Array.prototype.slice.call(gen.querySelectorAll('.gen__rng'));
var COPY_LABEL = 'Copy';
var DONE_LABEL = 'Copied';

// 네 모서리 X 반경 + 공통 Vert radius — 다섯 값이면 슬래시 문법이 성립한다
function readVar(name) {
  return parseInt(getComputedStyle(gen).getPropertyValue(name), 10) || 0;
}
function radiusText() {
  return 'border-radius: ' + readVar('--r-tl') + 'px ' + readVar('--r-tr') + 'px ' + readVar('--r-br') + 'px ' + readVar('--r-bl') + 'px / ' + readVar('--r-vy') + 'px;';
}
// 클립보드는 iframe·http 환경에서 막힐 수 있다 — 거부된 프로미스를 반드시 catch 로 받아 선택 방식으로 떨어진다
function fallbackCopy(text) {
  var area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  try { document.execCommand('copy'); } catch (err) { /* 여기까지 막히면 조용히 포기한다 */ }
  document.body.removeChild(area);
}
ranges.forEach(function (input) {
  input.addEventListener('input', function () {
    gen.classList.remove('is-demo');
    gen.style.setProperty(input.dataset.var, input.value);
  });
  input.addEventListener('pointerdown', function () { gen.classList.remove('is-demo'); });
});
copyBtn.addEventListener('click', function () {
  gen.classList.remove('is-demo');
  var text = radiusText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
  copyBtn.textContent = DONE_LABEL;
  setTimeout(function () { copyBtn.textContent = COPY_LABEL; }, 1200);
});
</script>
</body>
</html>
