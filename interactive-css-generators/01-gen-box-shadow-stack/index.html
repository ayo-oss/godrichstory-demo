<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그림자 겹쳐 쌓기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gen is-demo" id="gen">
  <div class="gen__top">
    <div class="gen__preview" aria-hidden="true"><span class="gen__chip">Card</span></div>
    <div class="gen__grid">
      <label class="gen__row">
        <span class="gen__lab">가로</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="-24" max="24" step="2" value="0" data-var="--shadow-x" aria-label="가로 거리">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">세로</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="-24" max="24" step="2" value="10" data-var="--shadow-y" aria-label="세로 거리">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">번짐</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="0" max="48" step="2" value="20" data-var="--shadow-blur" aria-label="번짐 정도">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">퍼짐</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="-12" max="12" step="2" value="-4" data-var="--shadow-spread" aria-label="퍼짐 정도">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
    </div>
  </div>
  <div class="gen__out">
    <code class="gen__code"><span class="gen__prop">box-shadow:</span> <span class="gen__v gen__v--x"></span>px <span class="gen__v gen__v--y"></span>px <span class="gen__v gen__v--blur"></span>px <span class="gen__v gen__v--spread"></span>px rgba(23,20,26,.34)</code>
    <button class="gen__copy" type="button" id="copy">복사</button>
  </div>
</div>
</main>
<script>
var gen = document.getElementById('gen');
var copyBtn = document.getElementById('copy');
var ranges = Array.prototype.slice.call(gen.querySelectorAll('.gen__rng'));
var COPY_LABEL = '복사';
var DONE_LABEL = '복사됨';

// 슬라이더 값은 전부 gen 요소의 사용자 지정 속성 네 개에 모인다. 미리보기 카드의 box-shadow 도,
// 코드 상자의 숫자(counter() 로 그린다)도, 손잡이 위치도 같은 속성을 읽는다 — 그래서 자동 재생
// 루프가 속성만 움직여도 셋이 함께 바뀐다. JS 는 조작할 때 속성을 넣고 복사용 문자열만 만든다.
function readVar(name) {
  return parseInt(getComputedStyle(gen).getPropertyValue(name), 10) || 0;
}
function shadowText() {
  var x = readVar('--shadow-x'), y = readVar('--shadow-y');
  var blur = readVar('--shadow-blur'), spread = readVar('--shadow-spread');
  // 두 겹 중 아래 겹은 절반 거리·절반 번짐으로 깔아 깊이를 만든다
  return 'box-shadow: ' + x + 'px ' + y + 'px ' + blur + 'px ' + spread + 'px rgba(23,20,26,.34),\n'
    + '            ' + Math.round(x / 2) + 'px ' + Math.round(y / 2) + 'px ' + Math.round(blur / 2) + 'px 0 rgba(23,20,26,.22);';
}
ranges.forEach(function (input) {
  input.addEventListener('input', function () {
    gen.classList.remove('is-demo');
    gen.style.setProperty(input.dataset.var, input.value);
  });
  input.addEventListener('pointerdown', function () { gen.classList.remove('is-demo'); });
});
// 클립보드는 iframe·http 환경에서 막힐 수 있다. writeText 는 **거부된 프로미스**를 돌려주므로
// try/catch 로는 못 잡는다 — 반드시 catch 를 달아 선택 방식으로 떨어뜨린다 (조작 실측에서 잡았다)
function fallbackCopy(text) {
  var area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  try { document.execCommand('copy'); } catch (err) { /* 여기까지 막히면 조용히 포기한다 */ }
  document.body.removeChild(area);
}
copyBtn.addEventListener('click', function () {
  gen.classList.remove('is-demo');
  var text = shadowText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
  copyBtn.textContent = DONE_LABEL;
  setTimeout(function () { copyBtn.textContent = COPY_LABEL; }, 1200);
});
</script>
</body>
</html>
