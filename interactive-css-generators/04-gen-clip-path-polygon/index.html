<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다각형 꼭짓점 자르기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gen is-demo" id="gen">
  <div class="gen__top">
    <div class="gen__preview-frame" aria-hidden="true"><div class="gen__preview"></div></div>
    <div class="gen__grid">
      <label class="gen__row">
        <span class="gen__lab">꼭짓점1</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="20" max="100" step="5" value="90" data-var="--v0" aria-label="첫 번째 꼭짓점 반경">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">꼭짓점2</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="20" max="100" step="5" value="60" data-var="--v1" aria-label="두 번째 꼭짓점 반경">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">꼭짓점3</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="20" max="100" step="5" value="80" data-var="--v2" aria-label="세 번째 꼭짓점 반경">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">꼭짓점4</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="20" max="100" step="5" value="60" data-var="--v3" aria-label="네 번째 꼭짓점 반경">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">꼭짓점5</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="20" max="100" step="5" value="85" data-var="--v4" aria-label="다섯 번째 꼭짓점 반경">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">꼭짓점6</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="20" max="100" step="5" value="65" data-var="--v5" aria-label="여섯 번째 꼭짓점 반경">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
    </div>
  </div>
  <div class="gen__out">
    <code class="gen__code"><span class="gen__prop">clip-path:</span> <span class="gen__v gen__v--c0"></span>% <span class="gen__v gen__v--c1"></span>% <span class="gen__v gen__v--c2"></span>% <span class="gen__v gen__v--c3"></span>% <span class="gen__v gen__v--c4"></span>% <span class="gen__v gen__v--c5"></span>%</code>
    <button class="gen__copy" type="button" id="copy">복사</button>
  </div>
</div>
</main>
<script>
var gen = document.getElementById('gen');
var copyBtn = document.getElementById('copy');
var ranges = Array.prototype.slice.call(gen.querySelectorAll('.gen__rng'));
var COPY_LABEL = '복사';
var DONE_LABEL = '복사됨';

// 여섯 꼭짓점은 60도 간격 고정. 각 꼭짓점의 (dx, dy) 계수표 — CSS 와 JS 가 같은 표를 공유한다
// (60도 간격 여섯 방향의 단위원 좌표, 소수 셋째에서 반올림). 중심 50% 에서 계수만큼 뻗는다.
var DIRS = [
  [0, -1], [0.87, -0.5], [0.87, 0.5], [0, 1], [-0.87, 0.5], [-0.87, -0.5]
];
function readVar(name) {
  return parseInt(getComputedStyle(gen).getPropertyValue(name), 10) || 0;
}
// 복사용 문자열 — 실제 polygon 전체 좌표. 미리보기는 CSS 가 같은 계수표로 그린다(주석 참조)
function clipText() {
  var pts = DIRS.map(function (d, i) {
    var r = readVar('--v' + i);
    var x = Math.round(50 + d[0] * r);
    var y = Math.round(50 + d[1] * r * 0.6);
    return x + '% ' + y + '%';
  });
  return 'clip-path: polygon(' + pts.join(', ') + ');';
}
// 클립보드는 iframe·http 환경에서 막힐 수 있다 — 거부된 프로미스를 반드시 catch 로 받아 선택 방식으로 떨어진다
function fallbackCopy(text) {
  var area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  try { document.execCommand('copy'); } catch (err) { /* 여기까지 막히면 조용히 포기한다 */ }
  document.body.removeChild(area);
}
ranges.forEach(function (input) {
  input.addEventListener('input', function () {
    gen.classList.remove('is-demo');
    gen.style.setProperty(input.dataset.var, input.value);
  });
  input.addEventListener('pointerdown', function () { gen.classList.remove('is-demo'); });
});
copyBtn.addEventListener('click', function () {
  gen.classList.remove('is-demo');
  var text = clipText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
  copyBtn.textContent = DONE_LABEL;
  setTimeout(function () { copyBtn.textContent = COPY_LABEL; }, 1200);
});
</script>
</body>
</html>
