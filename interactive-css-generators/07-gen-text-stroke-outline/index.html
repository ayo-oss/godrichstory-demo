<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글자 테두리 두께 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gen is-demo" id="gen">
  <div class="gen__top">
    <div class="gen__preview" aria-hidden="true"><span class="gen__word">GO</span></div>
    <div class="gen__grid">
      <label class="gen__row">
        <span class="gen__lab">테두리</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="0" max="8" step="1" value="3" data-var="--t-sw" aria-label="테두리 두께">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">채움</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="0" max="100" step="10" value="100" data-var="--t-fill" aria-label="채움 불투명도">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
    </div>
  </div>
  <div class="gen__out">
    <code class="gen__code"><span class="gen__prop">-webkit-text-stroke:</span> <span class="gen__v gen__v--sw"></span>px #17141a; <span class="gen__prop">color:</span> rgba(255,247,230,<span class="gen__v gen__v--fill"></span>%)</code>
    <button class="gen__copy" type="button" id="copy">복사</button>
  </div>
</div>
</main>
<script>
var gen = document.getElementById('gen');
var copyBtn = document.getElementById('copy');
var ranges = Array.prototype.slice.call(gen.querySelectorAll('.gen__rng'));
var COPY_LABEL = '복사';
var DONE_LABEL = '복사됨';

// 테두리 두께와 채움 불투명도 — 속성 둘로 글자 하나를 통째로 다룬다.
// -webkit-text-stroke 는 접두사 그대로 쓰는 게 실무 표준이고, 구형 브라우저 대체는
// 여러 겹의 text-shadow 로 같은 굵기의 테두리를 흉내 낸다(아래 fallbackText)
function readVar(name) {
  return parseInt(getComputedStyle(gen).getPropertyValue(name), 10) || 0;
}
function strokeText() {
  return '-webkit-text-stroke: ' + readVar('--t-sw') + 'px #17141a;\ncolor: rgba(255,247,230,' + readVar('--t-fill') + '%);';
}
function fallbackText() {
  var sw = readVar('--t-sw');
  // 네 방향(대각선 포함 여덟 방향) 같은 오프셋의 그림자로 테두리를 흉내 낸다
  var shades = [];
  for (var dx = -1; dx <= 1; dx++) {
    for (var dy = -1; dy <= 1; dy++) {
      if (dx === 0 && dy === 0) continue;
      shades.push((dx * sw) + 'px ' + (dy * sw) + 'px 0 #17141a');
    }
  }
  return 'text-shadow: ' + shades.join(', ') + ';';
}
// 클립보드는 iframe·http 환경에서 막힐 수 있다 — 거부된 프로미스를 반드시 catch 로 받아 선택 방식으로 떨어진다
function fallbackCopy(text) {
  var area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  try { document.execCommand('copy'); } catch (err) { /* 여기까지 막히면 조용히 포기한다 */ }
  document.body.removeChild(area);
}
ranges.forEach(function (input) {
  input.addEventListener('input', function () {
    gen.classList.remove('is-demo');
    gen.style.setProperty(input.dataset.var, input.value);
  });
  input.addEventListener('pointerdown', function () { gen.classList.remove('is-demo'); });
});
copyBtn.addEventListener('click', function () {
  gen.classList.remove('is-demo');
  var text = strokeText() + '\n' + fallbackText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
  copyBtn.textContent = DONE_LABEL;
  setTimeout(function () { copyBtn.textContent = COPY_LABEL; }, 1200);
});
</script>
</body>
</html>
