<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>격자 열과 간격 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gen is-demo" id="gen">
  <div class="gen__top">
    <div class="gen__preview" aria-hidden="true">
      <span class="gen__cell gen__cell--a"></span><span class="gen__cell gen__cell--b"></span>
      <span class="gen__cell gen__cell--b"></span><span class="gen__cell gen__cell--a"></span>
      <span class="gen__cell gen__cell--a"></span><span class="gen__cell gen__cell--b"></span>
      <span class="gen__cell gen__cell--b"></span><span class="gen__cell gen__cell--a"></span>
      <span class="gen__cell gen__cell--a"></span><span class="gen__cell gen__cell--b"></span>
      <span class="gen__cell gen__cell--b"></span><span class="gen__cell gen__cell--a"></span>
    </div>
    <div class="gen__grid">
      <label class="gen__row">
        <span class="gen__lab">최소폭</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="80" max="260" step="20" value="120" data-var="--g-min" aria-label="칸 최소 폭">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">간격</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="0" max="24" step="4" value="8" data-var="--g-gap" aria-label="칸 간격">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
    </div>
  </div>
  <div class="gen__out">
    <code class="gen__code"><span class="gen__prop">grid-template-columns:</span> repeat(auto-fit, minmax(<span class="gen__v gen__v--min"></span>px, 1fr)); <span class="gen__prop">gap:</span> <span class="gen__v gen__v--gap"></span>px</code>
    <button class="gen__copy" type="button" id="copy">복사</button>
  </div>
</div>
</main>
<script>
var gen = document.getElementById('gen');
var copyBtn = document.getElementById('copy');
var ranges = Array.prototype.slice.call(gen.querySelectorAll('.gen__rng'));
var COPY_LABEL = '복사';
var DONE_LABEL = '복사됨';

// auto-fit + minmax 는 칸 수를 직접 세지 않고 최소 폭이 정하도록 두는 반응형 격자다.
// 그래서 슬라이더는 열 개수가 아니라 최소 폭과 간격만 잡는다 — 칸 수는 화면이 결정한다
function readVar(name) {
  return parseInt(getComputedStyle(gen).getPropertyValue(name), 10) || 0;
}
function gridText() {
  return 'grid-template-columns: repeat(auto-fit, minmax(' + readVar('--g-min') + 'px, 1fr));\ngap: ' + readVar('--g-gap') + 'px;';
}
// 클립보드는 iframe·http 환경에서 막힐 수 있다 — 거부된 프로미스를 반드시 catch 로 받아 선택 방식으로 떨어진다
function fallbackCopy(text) {
  var area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  try { document.execCommand('copy'); } catch (err) { /* 여기까지 막히면 조용히 포기한다 */ }
  document.body.removeChild(area);
}
ranges.forEach(function (input) {
  input.addEventListener('input', function () {
    gen.classList.remove('is-demo');
    gen.style.setProperty(input.dataset.var, input.value);
  });
  input.addEventListener('pointerdown', function () { gen.classList.remove('is-demo'); });
});
copyBtn.addEventListener('click', function () {
  gen.classList.remove('is-demo');
  var text = gridText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
  copyBtn.textContent = DONE_LABEL;
  setTimeout(function () { copyBtn.textContent = COPY_LABEL; }, 1200);
});
</script>
</body>
</html>
