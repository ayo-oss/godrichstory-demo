<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타이포 배율 사다리 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gen is-demo" id="gen">
  <div class="gen__top">
    <div class="gen__preview" aria-hidden="true">
      <span class="gen__step gen__step--1">Step 1</span>
      <span class="gen__step gen__step--2">Step 2</span>
      <span class="gen__step gen__step--3">Step 3</span>
      <span class="gen__step gen__step--4">Step 4</span>
      <span class="gen__step gen__step--5">Step 5</span>
      <span class="gen__step gen__step--6">Step 6</span>
    </div>
    <div class="gen__grid">
      <label class="gen__row">
        <span class="gen__lab">기준</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="12" max="16" step="1" value="14" data-var="--s-base" aria-label="기준 글자 크기">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">배율</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="110" max="140" step="5" value="120" data-var="--s-ratio" aria-label="단계 배율">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
    </div>
  </div>
  <div class="gen__out">
    <code class="gen__code"><span class="gen__prop">--step-1:</span> <span class="gen__v gen__v--s1"></span>rem; <span class="gen__prop">--step-2:</span> <span class="gen__v gen__v--s2"></span>rem; <span class="gen__prop">--step-3:</span> <span class="gen__v gen__v--s3"></span>rem</code>
    <button class="gen__copy" type="button" id="copy">복사</button>
  </div>
</div>
</main>
<script>
var gen = document.getElementById('gen');
var copyBtn = document.getElementById('copy');
var ranges = Array.prototype.slice.call(gen.querySelectorAll('.gen__rng'));
var COPY_LABEL = '복사';
var DONE_LABEL = '복사됨';

// 기준 크기와 배율 — 다섯 단계 사다리가 calc 곱으로 저절로 따라온다(scss 의 calc 랑 같은 식).
// 속성은 --s-base(정수 px) 와 --s-ratio(백분율 정수) 둘뿐이다
function readVar(name) {
  return parseInt(getComputedStyle(gen).getPropertyValue(name), 10) || 0;
}
function scaleText() {
  var base = readVar('--s-base');
  var ratio = readVar('--s-ratio') / 100;
  var lines = [];
  for (var i = 1; i <= 6; i++) {
    lines.push('--step-' + i + ': ' + (Math.round(base * Math.pow(ratio, i - 1) * 100) / 100 / 16).toFixed(3) + 'rem;');
  }
  return ':root {\n  ' + lines.join('\n  ') + '\n}';
}
// 클립보드는 iframe·http 환경에서 막힐 수 있다 — 거부된 프로미스를 반드시 catch 로 받아 선택 방식으로 떨어진다
function fallbackCopy(text) {
  var area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  try { document.execCommand('copy'); } catch (err) { /* 여기까지 막히면 조용히 포기한다 */ }
  document.body.removeChild(area);
}
ranges.forEach(function (input) {
  input.addEventListener('input', function () {
    gen.classList.remove('is-demo');
    gen.style.setProperty(input.dataset.var, input.value);
  });
  input.addEventListener('pointerdown', function () { gen.classList.remove('is-demo'); });
});
copyBtn.addEventListener('click', function () {
  gen.classList.remove('is-demo');
  var text = scaleText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
  copyBtn.textContent = DONE_LABEL;
  setTimeout(function () { copyBtn.textContent = COPY_LABEL; }, 1200);
});
</script>
</body>
</html>
