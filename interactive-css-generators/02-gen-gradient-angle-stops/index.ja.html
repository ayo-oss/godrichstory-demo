<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角度と停止点のグラデーション — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gen is-demo" id="gen">
  <div class="gen__top">
    <div class="gen__preview" aria-hidden="true"><span class="gen__angle-mark"></span></div>
    <div class="gen__grid">
      <label class="gen__row">
        <span class="gen__lab">角度</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="0" max="360" step="5" value="45" data-var="--grad-angle" aria-label="グラデーションの角度">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">停止点 A</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="0" max="100" step="5" value="30" data-var="--grad-stop-a" aria-label="一色目の停止位置">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
      <label class="gen__row">
        <span class="gen__lab">停止点 B</span>
        <span class="gen__slot">
          <input class="gen__rng" type="range" min="0" max="100" step="5" value="75" data-var="--grad-stop-b" aria-label="二色目の停止位置">
          <span class="gen__thumb" aria-hidden="true"></span>
        </span>
      </label>
    </div>
  </div>
  <div class="gen__out">
    <code class="gen__code"><span class="gen__prop">linear-gradient(</span><span class="gen__v gen__v--angle"></span>deg, #2f6df6 <span class="gen__v gen__v--a"></span>%, #ff9ebb <span class="gen__v gen__v--b"></span>%)</code>
    <button class="gen__copy" type="button" id="copy">コピー</button>
  </div>
</div>
</main>
<script>
var gen = document.getElementById('gen');
var copyBtn = document.getElementById('copy');
var ranges = Array.prototype.slice.call(gen.querySelectorAll('.gen__rng'));
var COPY_LABEL = 'コピー';
var DONE_LABEL = 'コピーしました';

// 세 값 모두 gen 의 사용자 지정 속성 — 미리보기·손잡이·코드 숫자가 같은 곳을 읽는다
function readVar(name) {
  return parseInt(getComputedStyle(gen).getPropertyValue(name), 10) || 0;
}
function gradientText() {
  return 'linear-gradient(' + readVar('--grad-angle') + 'deg, #2f6df6 ' + readVar('--grad-stop-a') + '%, #ff9ebb ' + readVar('--grad-stop-b') + '%);';
}
// 클립보드는 iframe·http 환경에서 막힐 수 있다 — 거부된 프로미스를 반드시 catch 로 받아 선택 방식으로 떨어진다
function fallbackCopy(text) {
  var area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  try { document.execCommand('copy'); } catch (err) { /* 여기까지 막히면 조용히 포기한다 */ }
  document.body.removeChild(area);
}
ranges.forEach(function (input) {
  input.addEventListener('input', function () {
    gen.classList.remove('is-demo');
    gen.style.setProperty(input.dataset.var, input.value);
  });
  input.addEventListener('pointerdown', function () { gen.classList.remove('is-demo'); });
});
copyBtn.addEventListener('click', function () {
  gen.classList.remove('is-demo');
  var text = gradientText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
  copyBtn.textContent = DONE_LABEL;
  setTimeout(function () { copyBtn.textContent = COPY_LABEL; }, 1200);
});
</script>
</body>
</html>
