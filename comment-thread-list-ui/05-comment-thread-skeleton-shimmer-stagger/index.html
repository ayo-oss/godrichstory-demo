<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행 순서를 계산해 위에서 아래로 반 박자씩 밀린 시차로 반짝임이 지나가고, 실제 댓글이 도착한 행은 그 즉시 제자리에서 스켈레톤과 맞바뀐다 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="skel is-demo" id="skelRoot">
  <div class="skel__head">
    <button type="button" class="skel__replayBtn" id="skelReplay">다시 불러오기</button>
  </div>
  <ul class="skel__list" role="list" id="skelList">
    <li class="skel__item" data-row="0">
      <div class="skel__ghost">
        <span class="skel__bone skel__avatar"><i class="skel__glare"></i></span>
        <span class="skel__boneGroup">
          <span class="skel__bone skel__bone--name"><i class="skel__glare"></i></span>
          <span class="skel__bone skel__bone--text"><i class="skel__glare"></i></span>
        </span>
      </div>
      <div class="skel__real">
        <span class="skel__realAvatar" aria-hidden="true"></span>
        <div class="skel__realBody">
          <p class="skel__meta"><strong class="skel__name">은하수밤</strong><span class="skel__time">7분 전</span></p>
          <p class="skel__text">스켈레톤이 사라지는 타이밍이 매끄러워요.</p>
        </div>
      </div>
    </li>
    <li class="skel__item" data-row="1">
      <div class="skel__ghost">
        <span class="skel__bone skel__avatar"><i class="skel__glare"></i></span>
        <span class="skel__boneGroup">
          <span class="skel__bone skel__bone--name"><i class="skel__glare"></i></span>
          <span class="skel__bone skel__bone--text"><i class="skel__glare"></i></span>
        </span>
      </div>
      <div class="skel__real">
        <span class="skel__realAvatar" aria-hidden="true"></span>
        <div class="skel__realBody">
          <p class="skel__meta"><strong class="skel__name">구름조각</strong><span class="skel__time">31분 전</span></p>
          <p class="skel__text">행마다 반짝임이 한 박자씩 밀리는 게 보이네요.</p>
        </div>
      </div>
    </li>
    <li class="skel__item" data-row="2">
      <div class="skel__ghost">
        <span class="skel__bone skel__avatar"><i class="skel__glare"></i></span>
        <span class="skel__boneGroup">
          <span class="skel__bone skel__bone--name"><i class="skel__glare"></i></span>
          <span class="skel__bone skel__bone--text"><i class="skel__glare"></i></span>
        </span>
      </div>
      <div class="skel__real">
        <span class="skel__realAvatar" aria-hidden="true"></span>
        <div class="skel__realBody">
          <p class="skel__meta"><strong class="skel__name">달빛서점</strong><span class="skel__time">1시간 전</span></p>
          <p class="skel__text">로딩 상태를 이렇게 표현하면 기다림이 덜 지루해요.</p>
        </div>
      </div>
    </li>
    <li class="skel__item" data-row="3">
      <div class="skel__ghost">
        <span class="skel__bone skel__avatar"><i class="skel__glare"></i></span>
        <span class="skel__boneGroup">
          <span class="skel__bone skel__bone--name"><i class="skel__glare"></i></span>
          <span class="skel__bone skel__bone--text"><i class="skel__glare"></i></span>
        </span>
      </div>
      <div class="skel__real">
        <span class="skel__realAvatar" aria-hidden="true"></span>
        <div class="skel__realBody">
          <p class="skel__meta"><strong class="skel__name">소나기우산</strong><span class="skel__time">2시간 전</span></p>
          <p class="skel__text">다음 글에서도 이 패턴 써먹어야겠어요.</p>
        </div>
      </div>
    </li>
  </ul>
  <p class="skel__sr" id="skelStatus" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  // 기법: 행 순서(위→아래 data-row 정렬)를 계산해 각 행 반짝임(glare) 시작을
  // SHIMMER_STAGGER_STEP_MS 씩 밀어 시차를 만들고, "실제 댓글 도착"도 같은 순서로 stagger
  // 시켜 도착한 행은 그 즉시 스켈레톤과 제자리 교차 페이드한다.
  // glare 는 뼈대 안 절대위치 하이라이트 띠를 translateX 로 무한 스윕한다.
  var SHIMMER_BASE_DELAY_MS = 200;
  var SHIMMER_STAGGER_STEP_MS = 140;
  var SWAP_BASE_DELAY_MS = 760;
  var SWAP_STAGGER_STEP_MS = 170;

  var root = document.getElementById('skelRoot');
  var list = document.getElementById('skelList');
  var replay = document.getElementById('skelReplay');
  var status = document.getElementById('skelStatus');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) root.classList.remove('is-demo');

  function rowsInOrder() {
    var items = list.querySelectorAll('.skel__item');
    var rows = [];
    for (var i = 0; i < items.length; i += 1) rows.push(items[i]);
    rows.sort(function (a, b) {
      return parseInt(a.getAttribute('data-row'), 10) - parseInt(b.getAttribute('data-row'), 10);
    });
    return rows;
  }

  function resetRow(item) {
    item.getAnimations().forEach(function (a) { a.cancel(); });
    item.querySelectorAll('.skel__glare, .skel__ghost, .skel__real').forEach(function (b) {
      b.getAnimations().forEach(function (a) { a.cancel(); });
    });
    item.classList.remove('is-real');
  }

  function swapRow(item, delayMs) {
    var ghost = item.querySelector('.skel__ghost');
    var real = item.querySelector('.skel__real');
    ghost.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 170, delay: delayMs, easing: 'ease-out', fill: 'forwards' });
    var anim = real.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 170, delay: delayMs, easing: 'ease-out', fill: 'forwards' });
    anim.onfinish = function () { item.classList.add('is-real'); };
  }

  function runSequence(animate) {
    var rows = rowsInOrder();
    for (var i = 0; i < rows.length; i += 1) {
      resetRow(rows[i]);
      if (!animate || reduce) {
        rows[i].classList.add('is-real');
        continue;
      }
      // glare 무한 스윕 — 행 순서로 stagger.
      var glareDelay = SHIMMER_BASE_DELAY_MS + i * SHIMMER_STAGGER_STEP_MS;
      rows[i].querySelectorAll('.skel__glare').forEach(function (glare) {
        glare.animate(
          [{ transform: 'translateX(-220%)' }, { transform: 'translateX(340%)' }],
          { duration: 1300, delay: glareDelay, iterations: Infinity, easing: 'linear' }
        );
      });
      swapRow(rows[i], SWAP_BASE_DELAY_MS + i * SWAP_STAGGER_STEP_MS);
    }
    status.textContent = animate ? '댓글 4개를 불러왔습니다.' : '댓글 4개가 표시되었습니다.';
  }

  replay.addEventListener('click', function () {
    root.classList.remove('is-demo');
    runSequence(true);
  });
  replay.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); replay.click(); }
  });

  if (reduce) {
    runSequence(false);
  } else {
    runSequence(true);
  }
})();
</script>
</body>
</html>
