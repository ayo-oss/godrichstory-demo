<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>最後の訪問以降に書かれたコメントを見つけてその手前に新着コメントの区切り線を置き、区切り線は少し上から降りてきてその位置に収まる — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="un is-demo" id="unRoot">
  <ul class="un__list" role="list" id="unList">
    <li class="un__item" data-min-ago="180">既読コメント1 — 前回の訪問時に読みました。</li>
    <li class="un__item" data-min-ago="120">既読コメント2 — これも前回見ました。</li>
    <li class="un__item" data-min-ago="95">既読コメント3 — ここまでが前回の訪問範囲。</li>
    <li class="un__item" data-min-ago="40">新着コメント1 — 最後の訪問後に投稿されました。</li>
    <li class="un__item" data-min-ago="12">新着コメント2 — 区切り線の下はすべて新着です。</li>
  </ul>
  <p class="un__sr" id="unStatus" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  // 기법: 각 댓글의 "몇 분 전 작성" 값(가짜 상대값, Date 미사용)과 LAST_VISIT_MINUTES_AGO
  // (마지막 방문이 몇 분 전인지)를 비교해, 방문 이후 쓰인 첫 댓글의 위치를 계산한다.
  // minAgo < LAST_VISIT_MINUTES_AGO 인 첫 행 앞에 구분선을 삽입하고 위에서 살짝 내려와 멎는다.
  var LAST_VISIT_MINUTES_AGO = 90;
  var NEW_ROW_HILITE_STAGGER_MS = 90;

  var root = document.getElementById('unRoot');
  var list = document.getElementById('unList');
  var status = document.getElementById('unStatus');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) root.classList.remove('is-demo');

  function minAgoOf(item) {
    return parseInt(item.getAttribute('data-min-ago'), 10);
  }

  function findUnreadIndex() {
    var items = list.querySelectorAll('.un__item');
    for (var i = 0; i < items.length; i += 1) {
      if (minAgoOf(items[i]) < LAST_VISIT_MINUTES_AGO) return i;
    }
    return -1;
  }

  function insertDivider(animate) {
    var idx = findUnreadIndex();
    if (idx < 0) {
      status.textContent = '新着コメントはありません。';
      return;
    }
    var items = list.querySelectorAll('.un__item');
    var firstUnread = items[idx];

    var divider = document.createElement('li');
    divider.className = 'un__divider';
    divider.setAttribute('role', 'listitem');
    var dividerLabel = document.createElement('span');
    dividerLabel.className = 'un__dividerLabel';
    dividerLabel.textContent = 'ここから新着コメント';
    divider.appendChild(dividerLabel);
    list.insertBefore(divider, firstUnread);

    for (var j = idx; j < items.length; j += 1) {
      items[j].classList.add('is-new');
      if (animate && !reduce) {
        // 계산: 구분선 아래 새 댓글 행마다, 구분선 등장 이후 순서대로 옅은 하이라이트가
        // 번져나갔다 가라앉아 "ここから新着コメント" 범위를 행 전체 면적으로도 보여준다.
        items[j].animate(
          [
            { backgroundColor: 'rgba(94,234,212,0.22)' },
            { backgroundColor: 'rgba(94,234,212,0)' }
          ],
          { duration: 520, delay: 260 + (j - idx) * NEW_ROW_HILITE_STAGGER_MS, easing: 'ease-out', fill: 'forwards' }
        );
      }
    }

    if (!animate || reduce) {
      divider.style.opacity = '1';
      divider.style.transform = 'translateY(0)';
    } else {
      divider.animate(
        [
          { opacity: 0, transform: 'translateY(-14px)' },
          { opacity: 1, transform: 'translateY(3px)' },
          { opacity: 1, transform: 'translateY(0)' }
        ],
        { duration: 460, delay: 220, easing: 'ease-out', fill: 'forwards' }
      );
    }
    var newCount = items.length - idx;
    status.textContent = '前回の訪問以降の新着コメント ' + newCount + '件です。';
  }

  if (reduce) {
    insertDivider(false);
  } else {
    insertDivider(true);
  }
})();
</script>
</body>
</html>
