<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>좋아요를 누르면 이전 개수와 새 개수의 차이를 계산해 그 차이만큼 자릿수가 굴러가며 바뀌고, 버튼은 그 차이에 비례한 탄성으로 한 번 튀었다가 가라앉는다 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lk is-demo" id="lkRoot">
  <div class="lk__row" id="lkRow">
    <span class="lk__avatar" aria-hidden="true"></span>
    <div class="lk__body">
      <p class="lk__meta"><strong class="lk__name">민트파도</strong><span class="lk__time">14분 전</span></p>
      <p class="lk__text">이 방법 진짜 깔끔하네요, 바로 적용했어요.</p>
      <button type="button" class="lk__likeBtn" id="lkBtn" aria-pressed="false" aria-label="좋아요">
        <svg class="lk__heart" id="lkHeart" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 102c0 66-104 122-104 122S24 168 24 102a54 54 0 0 1 54-54c22.59 0 41.94 12.31 50 32c8.06-19.69 27.41-32 50-32a54 54 0 0 1 54 54" opacity=".2"/><path d="M178 40c-20.65 0-38.73 8.88-50 23.89C116.73 48.88 98.65 40 78 40a62.07 62.07 0 0 0-62 62c0 70 103.79 126.66 108.21 129a8 8 0 0 0 7.58 0C136.21 228.66 240 172 240 102a62.07 62.07 0 0 0-62-62m-50 174.8c-18.26-10.64-96-59.11-96-112.8a46.06 46.06 0 0 1 46-46c19.45 0 35.78 10.36 42.6 27a8 8 0 0 0 14.8 0c6.82-16.67 23.15-27 42.6-27a46.06 46.06 0 0 1 46 46c0 53.61-77.76 102.15-96 112.8"/></g></svg>
        <span class="lk__count" id="lkCount" aria-hidden="true">
          <span class="lk__digitCol"><span class="lk__digitTrack"><span class="lk__digit">2</span></span></span>
          <span class="lk__digitCol"><span class="lk__digitTrack"><span class="lk__digit">4</span></span></span>
          <span class="lk__digitCol"><span class="lk__digitTrack"><span class="lk__digit">9</span></span></span>
        </span>
      </button>
    </div>
  </div>
  <p class="lk__sr" id="lkStatus" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  // 기법: 좋아요 이전 개수와 이후 개수의 차이(diff)를 계산해, 자릿수가 바뀌는 칸만 그 방향으로
  // 슬라이드시켜 "굴러가는" 시각을 만든다(249→250 이면 1의 자리 9→0, 10의 자리 4→5 가 동시에
  // 굴러 올림수 전파를 보여준다). 버튼·하트 아이콘의 탄성 튐 폭도 diff 크기로 계산한다.
  var root = document.getElementById('lkRoot');
  var row = document.getElementById('lkRow');
  var btn = document.getElementById('lkBtn');
  var heart = document.getElementById('lkHeart');
  var countWrap = document.getElementById('lkCount');
  var status = document.getElementById('lkStatus');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) root.classList.remove('is-demo');

  var count = 249;
  var liked = false;

  function rollDigit(col, newCh, diff, animate, delayMs) {
    var track = col.querySelector('.lk__digitTrack');
    var cur = track.querySelector('.lk__digit');
    if (cur.textContent === newCh) return;
    var next = document.createElement('span');
    next.className = 'lk__digit';
    next.textContent = newCh;
    next.style.transform = 'translateY(' + (diff > 0 ? '100%' : '-100%') + ')';
    track.appendChild(next);

    if (!animate || reduce) {
      cur.remove();
      next.style.transform = 'translateY(0)';
      return;
    }
    var dur = 260 + Math.min(200, Math.abs(diff) * 80);
    cur.animate(
      [{ transform: 'translateY(0)' }, { transform: 'translateY(' + (diff > 0 ? '-100%' : '100%') + ')' }],
      { duration: dur, delay: delayMs || 0, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' }
    );
    var anim = next.animate(
      [{ transform: 'translateY(' + (diff > 0 ? '100%' : '-100%') + ')' }, { transform: 'translateY(0)' }],
      { duration: dur, delay: delayMs || 0, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' }
    );
    anim.onfinish = function () {
      if (cur.parentNode) cur.remove();
      next.style.transform = 'translateY(0)';
    };
  }

  function renderCount(newCount, animate, delayMs) {
    var diff = newCount - count;
    if (diff === 0) return;
    var oldStr = String(count).padStart(3, '0');
    var newStr = String(newCount).padStart(3, '0');
    var cols = countWrap.querySelectorAll('.lk__digitCol');
    for (var i = 0; i < cols.length; i += 1) {
      if (oldStr[i] === newStr[i]) continue;
      rollDigit(cols[i], newStr[i], diff, animate, delayMs);
    }
    count = newCount;
  }

  function pop(el, diff, animate, delayMs) {
    if (!animate || reduce) return;
    var amp = 1.14 + Math.min(0.26, Math.abs(diff) * 0.04);
    el.animate(
      [
        { transform: 'scale(1)' },
        { transform: 'scale(' + amp + ')' },
        { transform: 'scale(0.94)' },
        { transform: 'scale(1.03)' },
        { transform: 'scale(1)' }
      ],
      { duration: 420, delay: delayMs || 0, easing: 'ease-out' }
    );
  }

  function rowPulse(diff, animate, delayMs) {
    // 계산: 좋아요 차이(diff)의 크기만큼 행 전체 배경이 밝아졌다 가라앉는 폭을 넓혀
    // 버튼 주변뿐 아니라 행 전체로 값을 전파한다(넓은 면적의 근거 있는 변화).
    if (!animate || reduce) return;
    var amp = Math.min(0.22, 0.1 + Math.abs(diff) * 0.04);
    row.animate(
      [
        { backgroundColor: 'rgba(255,158,187,0)' },
        { backgroundColor: 'rgba(255,158,187,' + amp + ')' },
        { backgroundColor: 'rgba(255,158,187,0)' }
      ],
      { duration: 640, delay: delayMs || 0, easing: 'ease-out' }
    );
  }

  function setLiked(next, animate, delayMs) {
    liked = next;
    var diff = liked ? 1 : -1;
    btn.setAttribute('aria-pressed', String(liked));
    btn.classList.toggle('is-liked', liked);
    var nextCount = count + diff;
    status.textContent = liked
      ? '좋아요를 눌렀습니다. 좋아요 ' + nextCount + '개'
      : '좋아요를 취소했습니다. 좋아요 ' + nextCount + '개';
    renderCount(nextCount, animate, delayMs);
    pop(btn, diff, animate, delayMs);
    pop(heart, diff, animate, delayMs);
    rowPulse(diff, animate, delayMs);
  }

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    setLiked(!liked, true, 0);
  });
  btn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); }
  });

  if (reduce) {
    // 초기 마크업이 이미 최종 상태(249, 좋아요 전)이므로 별도 처리 없음.
  } else {
    setLiked(true, true, 220);
    window.setTimeout(function () {
      if (root.classList.contains('is-demo')) setLiked(false, true, 0);
    }, 1100);
    window.setInterval(function () {
      if (!root.classList.contains('is-demo')) return;
      setLiked(!liked, true, 0);
    }, 2200);
  }
})();
</script>
</body>
</html>
