<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ひとつのパネルで、返信のインデントガイド線が深さごとに引かれ、いいねで桁が転がりボタンが弾むように跳ね、削除で枠が折りたたまれ下の行がスプリングで押し上がる — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="hero is-demo" id="heroRoot">
  <ul class="hero__list" role="list" id="heroList">
    <li class="hero__cmt" data-depth="0" data-id="h1">
      <span class="hero__avatar" aria-hidden="true"></span>
      <div class="hero__body">
        <p class="hero__meta"><strong class="hero__name">夕焼けの船長</strong></p>
        <p class="hero__text">3つの動きがひとつのパネルに混ざっています。</p>
        <button type="button" class="hero__likeBtn" id="heroLike1" aria-pressed="false" aria-label="いいね">
          <svg class="hero__heart" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 102c0 66-104 122-104 122S24 168 24 102a54 54 0 0 1 54-54c22.59 0 41.94 12.31 50 32c8.06-19.69 27.41-32 50-32a54 54 0 0 1 54 54" opacity=".2"/><path d="M178 40c-20.65 0-38.73 8.88-50 23.89C116.73 48.88 98.65 40 78 40a62.07 62.07 0 0 0-62 62c0 70 103.79 126.66 108.21 129a8 8 0 0 0 7.58 0C136.21 228.66 240 172 240 102a62.07 62.07 0 0 0-62-62m-50 174.8c-18.26-10.64-96-59.11-96-112.8a46.06 46.06 0 0 1 46-46c19.45 0 35.78 10.36 42.6 27a8 8 0 0 0 14.8 0c6.82-16.67 23.15-27 42.6-27a46.06 46.06 0 0 1 46 46c0 53.61-77.76 102.15-96 112.8"/></g></svg>
          <span class="hero__count" id="heroCount1">187</span>
        </button>
        <button type="button" class="hero__delBtn" id="heroDel1" aria-label="コメントを削除">
          <svg class="hero__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M200 56v152a8 8 0 0 1-8 8H64a8 8 0 0 1-8-8V56Z" opacity=".2"/><path d="M216 48h-40v-8a24 24 0 0 0-24-24h-48a24 24 0 0 0-24 24v8H40a8 8 0 0 0 0 16h8v144a16 16 0 0 0 16 16h128a16 16 0 0 0 16-16V64h8a8 8 0 0 0 0-16M96 40a8 8 0 0 1 8-8h48a8 8 0 0 1 8 8v8H96Zm96 168H64V64h128Zm-80-104v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0m48 0v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0"/></g></svg>
        </button>
      </div>
    </li>
    <li class="hero__cmt" data-depth="1" data-id="h2">
      <span class="hero__guide" aria-hidden="true"></span>
      <span class="hero__avatar hero__avatar--sm" aria-hidden="true"></span>
      <div class="hero__body">
        <p class="hero__meta"><strong class="hero__name">虹の橋</strong></p>
        <p class="hero__text">返信のインデントが深さに比例してずれますね。</p>
      </div>
    </li>
    <li class="hero__cmt" data-depth="2" data-id="h3">
      <span class="hero__guide" aria-hidden="true"></span>
      <span class="hero__avatar hero__avatar--sm" aria-hidden="true"></span>
      <div class="hero__body">
        <p class="hero__meta"><strong class="hero__name">露払い</strong></p>
        <p class="hero__text">返信のガイド線は上から下に引かれます。</p>
      </div>
    </li>
    <li class="hero__cmt" data-depth="0" data-id="h4">
      <span class="hero__avatar" aria-hidden="true"></span>
      <div class="hero__body">
        <p class="hero__meta"><strong class="hero__name">岩の隙間</strong></p>
        <p class="hero__text">このコメントを削除すると下がスプリングで上がってきます。</p>
        <button type="button" class="hero__likeBtn" id="heroLike4" aria-pressed="false" aria-label="いいね">
          <svg class="hero__heart" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 102c0 66-104 122-104 122S24 168 24 102a54 54 0 0 1 54-54c22.59 0 41.94 12.31 50 32c8.06-19.69 27.41-32 50-32a54 54 0 0 1 54 54" opacity=".2"/><path d="M178 40c-20.65 0-38.73 8.88-50 23.89C116.73 48.88 98.65 40 78 40a62.07 62.07 0 0 0-62 62c0 70 103.79 126.66 108.21 129a8 8 0 0 0 7.58 0C136.21 228.66 240 172 240 102a62.07 62.07 0 0 0-62-62m-50 174.8c-18.26-10.64-96-59.11-96-112.8a46.06 46.06 0 0 1 46-46c19.45 0 35.78 10.36 42.6 27a8 8 0 0 0 14.8 0c6.82-16.67 23.15-27 42.6-27a46.06 46.06 0 0 1 46 46c0 53.61-77.76 102.15-96 112.8"/></g></svg>
          <span class="hero__count" id="heroCount4">94</span>
        </button>
        <button type="button" class="hero__delBtn" id="heroDel4" aria-label="コメントを削除">
          <svg class="hero__icon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M200 56v152a8 8 0 0 1-8 8H64a8 8 0 0 1-8-8V56Z" opacity=".2"/><path d="M216 48h-40v-8a24 24 0 0 0-24-24h-48a24 24 0 0 0-24 24v8H40a8 8 0 0 0 0 16h8v144a16 16 0 0 0 16 16h128a16 16 0 0 0 16-16V64h8a8 8 0 0 0 0-16M96 40a8 8 0 0 1 8-8h48a8 8 0 0 1 8 8v8H96Zm96 168H64V64h128Zm-80-104v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0m48 0v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0"/></g></svg>
        </button>
      </div>
    </li>
  </ul>
  <button type="button" class="hero__resetBtn" id="heroReset">元に戻す</button>
  <p class="hero__sr" id="heroStatus" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  // 기법: 하나의 패널에 세 계산이 겹친다. ① 들여쓰기 — data-depth × HERO_REPLY_INDENT_STEP_PX
  // 로 margin-left 를 계산하고 안내선은 scaleY(0→1) 로 위에서 아래로 그린다.
  // ② いいね — 이전/이후 개수 diff 로 자릿수 굴림 방향과 탄성 튐 폭을 계산한다.
  // ③ 삭제 — 행 높이를 실측해 그만큼 접고, 아래 행은 빈 거리를 HERO 스프링 강성으로 메운다.
  var HERO_REPLY_INDENT_STEP_PX = 20;
  var HERO_DELETE_SHIFT_SPRING_STIFFNESS = 220;
  var HERO_LIKE_POP_AMPLITUDE = 1.16;

  // $ease-lerp-settle 곡선(site/static/demo-tokens.scss)과 같은 샘플 — 1 을 넘겼다가(최대 1.126) 되독아온다.
  var SPRING_SETTLE_EASING = 'linear(0.0, 0.051, 0.176, 0.341, 0.518, 0.685, 0.831, 0.947, 1.032, 1.087, 1.117, 1.126, 1.121, 1.105, 1.085, 1.062, 1.041, 1.022, 1.008, 0.997, 1)';

  var root = document.getElementById('heroRoot');
  var list = document.getElementById('heroList');
  var status = document.getElementById('heroStatus');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) root.classList.remove('is-demo');

  // ① 들여쓰기 계산
  function applyIndents() {
    var rows = list.querySelectorAll('.hero__cmt');
    for (var i = 0; i < rows.length; i += 1) {
      var depth = parseInt(rows[i].getAttribute('data-depth'), 10);
      rows[i].style.marginLeft = (depth * HERO_REPLY_INDENT_STEP_PX) + 'px';
    }
  }

  function drawGuides(animate, baseDelay) {
    var guides = list.querySelectorAll('.hero__guide');
    for (var i = 0; i < guides.length; i += 1) {
      if (!animate || reduce) {
        guides[i].style.transform = 'scaleY(1)';
        continue;
      }
      guides[i].animate(
        [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }],
        { duration: 440, delay: baseDelay + i * 180, easing: 'ease-out', fill: 'forwards' }
      );
    }
  }

  // ② いいね 자릿수 굴림 + 탄성 튐
  function like(btnId, countId, animate, delayMs) {
    var btn = document.getElementById(btnId);
    var countEl = document.getElementById(countId);
    var liked = btn.getAttribute('aria-pressed') === 'true';
    var oldV = parseInt(countEl.textContent, 10);
    var newV = liked ? oldV - 1 : oldV + 1;
    var diff = newV - oldV;

    btn.setAttribute('aria-pressed', String(!liked));
    btn.classList.toggle('is-liked', !liked);
    countEl.textContent = String(newV);
    status.textContent = (!liked ? 'いいねしました。いいね ' : 'いいねを取り消しました。いいね ') + newV + '件';

    if (!animate || reduce) return;

    countEl.animate(
      [
        { transform: 'translateY(0)', opacity: 1 },
        { transform: 'translateY(' + (diff > 0 ? '-70%' : '70%') + ')', opacity: 0 },
        { transform: 'translateY(' + (diff > 0 ? '70%' : '-70%') + ')', opacity: 0, offset: 0.5 },
        { transform: 'translateY(0)', opacity: 1 }
      ],
      { duration: 340, delay: delayMs || 0, easing: 'ease-out' }
    );
    btn.animate(
      [
        { transform: 'scale(1)' },
        { transform: 'scale(' + HERO_LIKE_POP_AMPLITUDE + ')' },
        { transform: 'scale(0.95)' },
        { transform: 'scale(1)' }
      ],
      { duration: 400, delay: delayMs || 0, easing: 'ease-out' }
    );
    // 계산: いいね 행 전체에도 diff 크기만큼 옅은 배경 펄스를 얹어 버튼 주변을 넘어선
    // 면적으로 값을 전파한다(item 04 like-pop 의 rowPulse 와 같은 원리).
    var likeRow = btn.closest('.hero__cmt');
    if (likeRow) {
      var pulseAmp = Math.min(0.2, 0.08 + Math.abs(diff) * 0.04);
      likeRow.animate(
        [
          { backgroundColor: 'rgba(255,158,187,0)' },
          { backgroundColor: 'rgba(255,158,187,' + pulseAmp + ')' },
          { backgroundColor: 'rgba(255,158,187,0)' }
        ],
        { duration: 560, delay: delayMs || 0, easing: 'ease-out' }
      );
    }
  }

  // ③ 삭제 접기 + 아래 행 스프링 시프트
  function heroShiftDuration(gapPx) {
    return Math.round(60 + 100000 / HERO_DELETE_SHIFT_SPRING_STIFFNESS + Math.min(220, gapPx * 0.5));
  }

  function removeRow(id, animate, delayMs) {
    var row = list.querySelector('.hero__cmt[data-id="' + id + '"]');
    if (!row || row.getBoundingClientRect().height === 0) return;

    var all = list.querySelectorAll('.hero__cmt');
    var seen = false;
    var below = [];
    for (var i = 0; i < all.length; i += 1) {
      if (all[i] === row) { seen = true; continue; }
      if (seen && all[i].getBoundingClientRect().height > 0) below.push(all[i]);
    }

    var gap = row.offsetHeight + 6;

    if (!animate || reduce) {
      row.style.display = 'none';
      status.textContent = 'コメントを削除しました。';
      return;
    }

    var h = row.offsetHeight;
    row.style.height = h + 'px';
    row.style.overflow = 'hidden';
    row.style.boxSizing = 'border-box';
    row.animate(
      [
        { height: h + 'px', opacity: 1, backgroundColor: 'rgba(194,54,26,0)' },
        { height: h + 'px', opacity: 1, backgroundColor: 'rgba(194,54,26,.16)', offset: 0.4 },
        { height: '0px', opacity: 0, backgroundColor: 'rgba(194,54,26,0)' }
      ],
      { duration: 240, delay: delayMs || 0, easing: 'ease-in', fill: 'forwards' }
    ).onfinish = function () { row.style.display = 'none'; };

    var dur = heroShiftDuration(gap);
    below.forEach(function (el) {
      el.animate(
        [
          { transform: 'translateY(0px)' },
          { transform: 'translateY(' + gap + 'px)' },
          { transform: 'translateY(0px)' }
        ],
        { duration: dur, delay: (delayMs || 0) + 240, easing: SPRING_SETTLE_EASING, fill: 'both' }
      );
      // 계산: 스프링으로 밀려 올라오는 행에도 빈 거리(gap)에 비례한 옅은 배경 결이
      // 같은 시간 동안 함께 지나가 "채워졌다"는 느낌을 면적으로도 보여준다.
      el.animate(
        [
          { backgroundColor: 'rgba(94,234,212,0)' },
          { backgroundColor: 'rgba(94,234,212,' + Math.min(0.18, gap * 0.002) + ')' },
          { backgroundColor: 'rgba(94,234,212,0)' }
        ],
        { duration: dur, delay: (delayMs || 0) + 240, easing: 'ease-out' }
      );
    });
    status.textContent = 'コメントを削除しました。';
  }

  function restoreRows() {
    var rows = list.querySelectorAll('.hero__cmt');
    for (var i = 0; i < rows.length; i += 1) {
      rows[i].getAnimations().forEach(function (a) { a.cancel(); });
      rows[i].style.display = '';
      rows[i].style.height = '';
      rows[i].style.overflow = '';
    }
    status.textContent = '元に戻しました。';
  }

  function bindLike(btnId, countId) {
    var btn = document.getElementById(btnId);
    btn.addEventListener('click', function () {
      root.classList.remove('is-demo');
      like(btnId, countId, true, 0);
    });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); }
    });
  }

  function bindDelete(btnId, targetId) {
    var btn = document.getElementById(btnId);
    btn.addEventListener('click', function () {
      root.classList.remove('is-demo');
      removeRow(targetId, true, 0);
    });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); }
    });
  }

  bindLike('heroLike1', 'heroCount1');
  bindLike('heroLike4', 'heroCount4');
  bindDelete('heroDel1', 'h1');
  bindDelete('heroDel4', 'h4');

  var reset = document.getElementById('heroReset');
  reset.addEventListener('click', function () {
    root.classList.remove('is-demo');
    restoreRows();
  });
  reset.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reset.click(); }
  });

  applyIndents();

  if (reduce) {
    drawGuides(false, 0);
  } else {
    // 데모 시퀀스: 안내선 그리기(220ms~) → いいね 튐(900ms~) → 삭제 접힘(1150ms~, 스프링까지 2s 안에 담기게)
    drawGuides(true, 220);
    like('heroLike1', 'heroCount1', true, 900);
    removeRow('h4', true, 1150);
  }
})();
</script>
</body>
</html>
