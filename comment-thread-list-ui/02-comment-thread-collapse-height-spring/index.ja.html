<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>展開する返信の実際の高さを測定してその値を目標にスプリング減衰で伸び、少し行き過ぎてから収まり、シェブロンは展開比率ぶんだけ回転する — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ch is-demo" id="chRoot">
  <div class="ch__card">
    <div class="ch__row">
      <span class="ch__avatar" aria-hidden="true"></span>
      <div class="ch__body">
        <p class="ch__meta"><strong class="ch__name">コーラルブックス</strong></p>
        <p class="ch__text">このスレッドは返信がだいぶ溜まってますね、展開して読みます。</p>
        <button type="button" class="ch__toggle" id="chToggle" aria-expanded="false" aria-controls="chPanel">
          <svg class="ch__toggleIcon" id="chIcon" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg>
          <span class="ch__toggleLabel">返信3件を見る</span>
        </button>
      </div>
    </div>
    <div class="ch__panel" id="chPanel">
      <div class="ch__panelInner" id="chPanelInner">
        <div class="ch__reply">
          <span class="ch__avatar ch__avatar--sm" aria-hidden="true"></span>
          <p class="ch__text">保存ボタンの場所が分かりにくかったけど、これで明確になりました。</p>
        </div>
        <div class="ch__reply">
          <span class="ch__avatar ch__avatar--sm" aria-hidden="true"></span>
          <p class="ch__text">同感です、次のアップデートも楽しみにしてます。</p>
        </div>
        <div class="ch__reply">
          <span class="ch__avatar ch__avatar--sm" aria-hidden="true"></span>
          <p class="ch__text">スクリーンショットも一緒に載せてもらえるといいですね。</p>
        </div>
      </div>
    </div>
  </div>
  <p class="ch__sr" id="chStatus" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  // 기법: 패널을 height:0 으로 접어 두고 펼칠 때 height:auto 로 잠깐 바꿔 scrollHeight 를
  // 실측한 뒤(레이아웃은 그 순간 한 번만 재계산), 그 실측값을 목표로 스프링 이징(선형 샘플
  // 곡선, 100% 를 살짝 넘겼다가 되돌아오는 값들)으로 height 를 직접 움직인다. 같은 이징·같은
  // 진행률로 화살표를 0→180도 회전시켜 "펼침 비율만큼 회전"을 구현한다.
  var root = document.getElementById('chRoot');
  var toggle = document.getElementById('chToggle');
  var icon = document.getElementById('chIcon');
  var panel = document.getElementById('chPanel');
  var inner = document.getElementById('chPanelInner');
  var status = document.getElementById('chStatus');
  var label = toggle.querySelector('.ch__toggleLabel');

  // $ease-lerp-settle 곡선(site/static/demo-tokens.scss)과 같은 샘플 — 1 을 넘겼다가(최대 1.126) 되돌아온다.
  var SPRING_SETTLE_EASING = 'linear(0.0, 0.051, 0.176, 0.341, 0.518, 0.685, 0.831, 0.947, 1.032, 1.087, 1.117, 1.126, 1.121, 1.105, 1.085, 1.062, 1.041, 1.022, 1.008, 0.997, 1)';

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) root.classList.remove('is-demo');

  var open = false;
  var panelAnim = null;
  var innerAnim = null;
  var iconAnim = null;
  var bgAnim = null;

  function measure() {
    panel.style.height = 'auto';
    inner.style.opacity = '1';
    var h = panel.scrollHeight;
    return h;
  }

  function setOpen(next, animate, delayMs) {
    open = next;
    toggle.setAttribute('aria-expanded', String(open));
    label.textContent = open ? '返信を隠す' : '返信3件を見る';
    status.textContent = open ? '返信3件が展開されました。' : '返信が折りたたまれました。';
    if (panelAnim) panelAnim.cancel();
    if (innerAnim) innerAnim.cancel();
    if (iconAnim) iconAnim.cancel();
    if (bgAnim) bgAnim.cancel();

    var target = measure();
    var from = open ? 0 : target;
    var to = open ? target : 0;
    panel.style.height = from + 'px';
    inner.style.opacity = open ? '0' : '1';

    if (!animate || reduce) {
      panel.style.height = to + 'px';
      inner.style.opacity = open ? '1' : '0';
      icon.style.transform = 'rotate(' + (open ? 180 : 0) + 'deg)';
      return;
    }
    // 계산: 패널이 실측한 픽셀 높이가 클수록 늘어나는 데 걸리는 시간도 조금 더 길게 잡는다.
    var dur = Math.max(320, Math.min(680, 300 + target * 0.9));
    panelAnim = panel.animate(
      [{ height: from + 'px' }, { height: to + 'px' }],
      { duration: dur, delay: delayMs || 0, easing: SPRING_SETTLE_EASING, fill: 'forwards' }
    );
    innerAnim = inner.animate(
      [{ opacity: open ? 0 : 1 }, { opacity: open ? 1 : 0 }],
      { duration: Math.round(dur * 0.6), delay: delayMs || 0, easing: 'ease-out', fill: 'forwards' }
    );
    iconAnim = icon.animate(
      [{ transform: 'rotate(' + (open ? 0 : 180) + 'deg)' }, { transform: 'rotate(' + (open ? 180 : 0) + 'deg)' }],
      { duration: dur, delay: delayMs || 0, easing: SPRING_SETTLE_EASING, fill: 'forwards' }
    );
    // 계산: 펼침 비율이 0→1(또는 반대)로 진행되는 같은 구간 동안, 패널 전체(카드 바탕)에도
    // 옅은 색 변화를 얹어 화살표·패널 경계 바깥까지 값을 전파한다(넓은 면적의 근거 있는 변화).
    bgAnim = root.animate(
      [{ backgroundColor: '#231f28' }, { backgroundColor: '#2b3550' }, { backgroundColor: '#231f28' }],
      { duration: Math.round(dur * 1.15), delay: delayMs || 0, easing: 'ease-out' }
    );
  }

  panel.style.height = '0px';
  inner.style.opacity = '0';

  toggle.addEventListener('click', function () {
    root.classList.remove('is-demo');
    setOpen(!open, true, 0);
  });
  toggle.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle.click(); }
  });

  var seqTimer = null;
  function playSequence() {
    if (seqTimer) { window.clearTimeout(seqTimer); seqTimer = null; }
    setOpen(false, false, 0);
    setOpen(true, true, 200);
    seqTimer = window.setTimeout(function () {
      setOpen(false, true, 0);
    }, 1080);
  }

  if (reduce) {
    setOpen(true, false, 0);
  } else {
    playSequence();
    window.setInterval(function () {
      if (!root.classList.contains('is-demo')) return;
      playSequence();
    }, 2600);
  }
})();
</script>
</body>
</html>
