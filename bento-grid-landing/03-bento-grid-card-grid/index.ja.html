<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core bento card grid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="grid">
    <div class="grid__tile grid__tile--a is-demo">
      <span class="grid__dot" aria-hidden="true"></span>
      <p class="grid__label">高速検索</p>
    </div>
    <div class="grid__tile grid__tile--b is-demo">
      <span class="grid__dot" aria-hidden="true"></span>
      <p class="grid__label">自動整理</p>
    </div>
    <div class="grid__tile grid__tile--c is-demo">
      <span class="grid__dot" aria-hidden="true"></span>
      <p class="grid__label">チームチャット</p>
    </div>
    <div class="grid__tile grid__tile--d is-demo">
      <span class="grid__dot" aria-hidden="true"></span>
      <p class="grid__label">レポート</p>
    </div>
  </section>
</main>
</body>
</html>
