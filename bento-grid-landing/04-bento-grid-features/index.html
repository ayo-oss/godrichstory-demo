<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon + number feature cards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="feat">
    <div class="feat__card is-demo">
      <span class="feat__icon" aria-hidden="true"></span>
      <p class="feat__num">12,000+</p>
      <p class="feat__label">연동 앱</p>
      <span class="feat__bar" aria-hidden="true"></span>
    </div>
    <div class="feat__card feat__card--b is-demo">
      <span class="feat__icon" aria-hidden="true"></span>
      <p class="feat__num">99.9%</p>
      <p class="feat__label">가동률</p>
      <span class="feat__bar" aria-hidden="true"></span>
    </div>
  </section>
</main>
</body>
</html>
