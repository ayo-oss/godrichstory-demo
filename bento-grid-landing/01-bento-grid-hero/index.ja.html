<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bento hero (2x2)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="hero">
    <div class="hero__tile hero__tile--main is-demo">
      <p class="hero__eyebrow">Nectar</p>
      <h2 class="hero__title">仕事とチームを、ひとつの画面に</h2>
      <button class="hero__cta" type="button">無料で始める</button>
    </div>
    <div class="hero__tile hero__tile--stat is-demo">
      <span class="hero__dot" aria-hidden="true"></span>
      <span class="hero__stat-label">リアルタイム同期</span>
    </div>
    <div class="hero__tile hero__tile--visual is-demo" aria-hidden="true"></div>
  </section>
</main>
</body>
</html>
