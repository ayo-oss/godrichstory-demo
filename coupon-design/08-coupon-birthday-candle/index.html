<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생일 쿠폰 촛불 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bd is-demo" id="bd">
  <div class="bd__card" id="card">
    <div class="bd__closed">
      <p class="bd__closedTitle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="bd__ico" aria-hidden="true"><path d="M104,48c0-24,24-40,24-40s24,16,24,40a24,24,0,0,1-48,0ZM208,96H48a16,16,0,0,0-16,16v23.33c0,17.44,13.67,32.18,31.1,32.66A32,32,0,0,0,96,136a32,32,0,0,0,64,0,32,32,0,0,0,32.9,32c17.43-.48,31.1-15.22,31.1-32.66V112A16,16,0,0,0,208,96Z" opacity="0.2"/><path d="M232,112a24,24,0,0,0-24-24H136V79a32.06,32.06,0,0,0,24-31c0-28-26.44-45.91-27.56-46.66a8,8,0,0,0-8.88,0C122.44,2.09,96,20,96,48a32.06,32.06,0,0,0,24,31v9H48a24,24,0,0,0-24,24v23.33a40.84,40.84,0,0,0,8,24.24V200a24,24,0,0,0,24,24H200a24,24,0,0,0,24-24V159.57a40.84,40.84,0,0,0,8-24.24ZM112,48c0-13.57,10-24.46,16-29.79,6,5.33,16,16.22,16,29.79a16,16,0,0,1-32,0ZM40,112a8,8,0,0,1,8-8H208a8,8,0,0,1,8,8v23.33c0,13.25-10.46,24.31-23.32,24.66A24,24,0,0,1,168,136a8,8,0,0,0-16,0,24,24,0,0,1-48,0,8,8,0,0,0-16,0,24,24,0,0,1-24.68,24C50.46,159.64,40,148.58,40,135.33Zm160,96H56a8,8,0,0,1-8-8V172.56A38.77,38.77,0,0,0,62.88,176a39.69,39.69,0,0,0,29-11.31A40.36,40.36,0,0,0,96,160a40,40,0,0,0,64,0,40.36,40.36,0,0,0,4.13,4.67A39.67,39.67,0,0,0,192,176c.38,0,.76,0,1.14,0A38.77,38.77,0,0,0,208,172.56V200A8,8,0,0,1,200,208Z"/></svg><span>생일 축하해요!</span></p>
      <button type="button" class="bd__openBtn" id="openBtn">리본 풀기</button>
    </div>
    <div class="bd__open" aria-hidden="true">
      <span class="bd__room" aria-hidden="true"></span>
      <div class="bd__candle">
        <span class="bd__flame" aria-hidden="true"></span>
        <span class="bd__glow" aria-hidden="true"></span>
        <span class="bd__wax" aria-hidden="true"></span>
      </div>
      <p class="bd__say">소원을 빌고 불을 끄세요</p>
      <p class="bd__pct">생일 <b>20%</b></p>
      <button type="button" class="bd__blowBtn" id="blowBtn">불 끄기</button>
    </div>
  </div>
  <p class="bd__live" id="live" aria-live="polite"></p>
</div>
</main>
<script>
var bd = document.getElementById('bd');
var openBtn = document.getElementById('openBtn');
var blowBtn = document.getElementById('blowBtn');
var openPane = document.querySelector('.bd__open');
var live = document.getElementById('live');
openBtn.addEventListener('click', function () {
  bd.classList.remove('is-demo');
  bd.classList.add('is-open');
  openPane.setAttribute('aria-hidden', 'false');
  live.textContent = '생일 쿠폰이 열렸어요';
});
blowBtn.addEventListener('click', function () {
  bd.classList.remove('is-demo');
  bd.classList.add('is-lit-off');
  live.textContent = '불을 껐어요 — 20% 할인이 확정됐어요';
});
</script>
</body>
</html>
