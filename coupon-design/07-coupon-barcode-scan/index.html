<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바코드 스캔 쿠폰 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bc is-demo" id="bc">
  <div class="bc__card" id="card">
    <div class="bc__head">
      <p class="bc__title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="bc__ico" aria-hidden="true"><path d="M224,48V208H32V48Z" opacity="0.2"/><path d="M232,48V88a8,8,0,0,1-16,0V56H184a8,8,0,0,1,0-16h40A8,8,0,0,1,232,48ZM72,200H40V168a8,8,0,0,0-16,0v40a8,8,0,0,0,8,8H72a8,8,0,0,0,0-16Zm152-40a8,8,0,0,0-8,8v32H184a8,8,0,0,0,0,16h40a8,8,0,0,0,8-8V168A8,8,0,0,0,224,160ZM32,96a8,8,0,0,0,8-8V56H72a8,8,0,0,0,0-16H32a8,8,0,0,0-8,8V88A8,8,0,0,0,32,96ZM80,80a8,8,0,0,0-8,8v80a8,8,0,0,0,16,0V88A8,8,0,0,0,80,80Zm104,88V88a8,8,0,0,0-16,0v80a8,8,0,0,0,16,0ZM144,80a8,8,0,0,0-8,8v80a8,8,0,0,0,16,0V88A8,8,0,0,0,144,80Zm-32,0a8,8,0,0,0-8,8v80a8,8,0,0,0,16,0V88A8,8,0,0,0,112,80Z"/></svg><span>멤버십 바코드</span></p>
      <span class="bc__state" id="stateTxt">대기 중</span>
    </div>
    <div class="bc__bars" aria-hidden="true">
      <span class="bc__beam"></span>
    </div>
    <p class="bc__digits">8842 0071 3390</p>
    <div class="bc__foot">
      <button type="button" class="bc__btn" id="scanBtn">스캔</button>
      <p class="bc__done" id="done"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="bc__tick" aria-hidden="true"><path d="M232,56V200a16,16,0,0,1-16,16H40a16,16,0,0,1-16-16V56A16,16,0,0,1,40,40H216A16,16,0,0,1,232,56Z" opacity="0.2"/><path d="M205.66,85.66l-96,96a8,8,0,0,1-11.32,0l-40-40a8,8,0,0,1,11.32-11.32L104,164.69l90.34-90.35a8,8,0,0,1,11.32,11.32Z"/></svg><span>결제 완료</span></p>
    </div>
  </div>
  <p class="bc__live" id="live" aria-live="polite"></p>
</div>
</main>
<script>
var bc = document.getElementById('bc');
var scanBtn = document.getElementById('scanBtn');
var stateTxt = document.getElementById('stateTxt');
var live = document.getElementById('live');
var bars = document.querySelector('.bc__bars');
scanBtn.addEventListener('click', function () {
  bc.classList.remove('is-demo');
  if (bc.classList.contains('is-done')) { return; }
  bc.classList.add('is-scanning');
  stateTxt.textContent = '스캔 중';
  window.setTimeout(function () {
    bc.classList.remove('is-scanning');
    bc.classList.add('is-done');
    stateTxt.textContent = '결제 완료';
    live.textContent = '바코드를 읽어 결제를 끝냈어요';
  }, 800);
});
</script>
</body>
</html>
