<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기프트 카드 뒤집기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gc is-demo" id="gc">
  <div class="gc__bob">
  <div class="gc__card" id="card">
    <div class="gc__face gc__face--front">
      <p class="gc__brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="gc__ico" aria-hidden="true"><path d="M208,128v72a8,8,0,0,1-8,8H56a8,8,0,0,1-8-8V128Z" opacity="0.2"/><path d="M216,72H180.92c.39-.33.79-.65,1.17-1A29.53,29.53,0,0,0,192,49.57,32.62,32.62,0,0,0,158.44,16,29.53,29.53,0,0,0,137,25.91a54.94,54.94,0,0,0-9,14.48,54.94,54.94,0,0,0-9-14.48A29.53,29.53,0,0,0,97.56,16,32.62,32.62,0,0,0,64,49.57,29.53,29.53,0,0,0,73.91,71c.38.33.78.65,1.17,1H40A16,16,0,0,0,24,88v32a16,16,0,0,0,16,16v64a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V136a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72ZM149,36.51a13.69,13.69,0,0,1,10-4.5h.49A16.62,16.62,0,0,1,176,49.08a13.69,13.69,0,0,1-4.5,10c-9.49,8.4-25.24,11.36-35,12.4C137.7,60.89,141,45.5,149,36.51Zm-64.09.36A16.63,16.63,0,0,1,96.59,32h.49a13.69,13.69,0,0,1,10,4.5c8.39,9.48,11.35,25.2,12.39,34.92-9.72-1-25.44-4-34.92-12.39a13.69,13.69,0,0,1-4.5-10A16.6,16.6,0,0,1,84.87,36.87ZM40,88h80v32H40Zm16,48h64v64H56Zm144,64H136V136h64Zm16-80H136V88h80v32Z"/></svg><span>GIFT CARD</span></p>
      <p class="gc__amount">50,000원</p>
      <p class="gc__hint">눌러서 뒤집기</p>
    </div>
    <div class="gc__face gc__face--back" aria-hidden="true">
      <p class="gc__balLabel">남은 금액</p>
      <p class="gc__bal">48,200원</p>
      <div class="gc__pinRow">
        <span class="gc__pinDots" id="pinDots">PIN ••••</span>
        <button type="button" class="gc__pinBtn" id="pinBtn">PIN 보기</button>
      </div>
    </div>
  </div>
  </div>
  <p class="gc__live" id="live" aria-live="polite"></p>
</div>
</main>
<script>
var gc = document.getElementById('gc');
var card = document.getElementById('card');
var pinBtn = document.getElementById('pinBtn');
var pinDots = document.getElementById('pinDots');
var live = document.getElementById('live');
var pinTimer = null;
var faces = {
  front: document.querySelector('.gc__face--front'),
  back: document.querySelector('.gc__face--back')
};
card.addEventListener('click', function () {
  gc.classList.remove('is-demo');
  var flipped = gc.classList.toggle('is-flipped');
  faces.back.setAttribute('aria-hidden', flipped ? 'false' : 'true');
  live.textContent = flipped ? '카드 뒷면이에요' : '카드 앞면이에요';
});
pinBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  gc.classList.remove('is-demo');
  pinDots.textContent = 'PIN 4820';
  live.textContent = 'PIN 을 3초간 보여줘요';
  window.clearTimeout(pinTimer);
  pinTimer = window.setTimeout(function () {
    pinDots.textContent = 'PIN ••••';
  }, 3000);
});
</script>
</body>
</html>
