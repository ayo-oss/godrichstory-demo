<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>돌림판 쿠폰 룰렛 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wh is-demo" id="wh">
  <div class="wh__rig">
    <div class="wh__pointer" aria-hidden="true"></div>
    <div class="wh__disc" id="disc">
      <div class="wh__ring" aria-hidden="true"></div>
      <span class="wh__lbl" style="--k: 0"><b>10%</b></span>
      <span class="wh__lbl wh__lbl--b" style="--k: 1"><b>꽝</b></span>
      <span class="wh__lbl" style="--k: 2"><b>20%</b></span>
      <span class="wh__lbl wh__lbl--b" style="--k: 3"><b>꽝</b></span>
      <span class="wh__lbl" style="--k: 4"><b>30%</b></span>
      <span class="wh__lbl wh__lbl--b" style="--k: 5"><b>꽝</b></span>
      <span class="wh__lbl" style="--k: 6"><b>10%</b></span>
      <span class="wh__lbl wh__lbl--b" style="--k: 7"><b>꽝</b></span>
    </div>
    <button type="button" class="wh__hub" id="hub">뽑기</button>
  </div>
  <p class="wh__result" aria-live="polite"><span class="wh__msg wh__msg--idle">판을 돌려 할인을 뽑아보세요</span><span class="wh__msg wh__msg--spin" aria-hidden="true">돌리는 중</span><span class="wh__msg wh__msg--win" aria-hidden="true">30% 할인 당첨!</span></p>
</div>
</main>
<script>
var wh = document.getElementById('wh');
var disc = document.getElementById('disc');
var hub = document.getElementById('hub');
var spinning = false;
hub.addEventListener('click', function () {
  if (spinning) { return; }
  wh.classList.remove('is-demo');
  spinning = true;
  wh.classList.add('is-spinning');
  var picks = [0, 2, 4, 6];
  var idx = picks[Math.floor(Math.random() * picks.length)];
  var perSlice = 45;
  var target = 1800 + (360 - (idx * perSlice + perSlice / 2));
  disc.style.transform = 'rotate(' + target + 'deg)';
  window.setTimeout(function () {
    wh.classList.remove('is-spinning');
    wh.classList.add('is-won');
    spinning = false;
  }, 1900);
});
</script>
</body>
</html>
