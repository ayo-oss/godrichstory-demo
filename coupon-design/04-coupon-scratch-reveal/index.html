<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크래치 쿠폰 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sc is-demo" id="sc">
  <div class="sc__card">
    <div class="sc__head">
      <p class="sc__title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="sc__ico" aria-hidden="true"><path d="M232,104c0,24-40,48-104,48S24,128,24,104,64,56,128,56,232,80,232,104Z" opacity="0.2"/><path d="M207.58,63.84C186.85,53.48,159.33,48,128,48S69.15,53.48,48.42,63.84,16,88.78,16,104v48c0,15.22,11.82,29.85,32.42,40.16S96.67,208,128,208s58.85-5.48,79.58-15.84S240,167.22,240,152V104C240,88.78,228.18,74.15,207.58,63.84ZM128,64c62.64,0,96,23.23,96,40s-33.36,40-96,40-96-23.23-96-40S65.36,64,128,64Zm-8,95.86v32c-19-.62-35-3.42-48-7.49V153.05A203.43,203.43,0,0,0,120,159.86Zm16,0a203.43,203.43,0,0,0,48-6.81v31.31c-13,4.07-29,6.87-48,7.49ZM32,152V133.53a82.88,82.88,0,0,0,16.42,10.63c2.43,1.21,5,2.35,7.58,3.43V178C40.17,170.16,32,160.29,32,152Zm168,26V147.59c2.61-1.08,5.15-2.22,7.58-3.43A82.88,82.88,0,0,0,224,133.53V152C224,160.29,215.83,170.16,200,178Z"/></svg><span>긁어 보세요</span></p>
      <button type="button" class="sc__reveal" id="revealBtn">바로 보기</button>
    </div>
    <div class="sc__zone" id="zone">
      <div class="sc__prize">
        <p class="sc__pct">30<i>%</i></p>
        <p class="sc__say">숨겨진 할인</p>
      </div>
      <canvas class="sc__foil" id="foil" width="240" height="88" aria-hidden="true"></canvas>
      <div class="sc__demoFoil" aria-hidden="true"><span class="sc__demoText">은박을 긁어 주세요</span></div>
      <div class="sc__remnant" aria-hidden="true"></div>
      <div class="sc__coin" aria-hidden="true"></div>
    </div>
    <p class="sc__live" id="live" aria-live="polite"></p>
  </div>
</div>
</main>
<script>
var sc = document.getElementById('sc');
var zone = document.getElementById('zone');
var foil = document.getElementById('foil');
var ctx = foil.getContext('2d');
var revealBtn = document.getElementById('revealBtn');
var live = document.getElementById('live');
var scratched = false;

// 은박 칠 — 작은 틈 균열 무늬까지
function paintFoil() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, foil.width, foil.height);
  var grad = ctx.createLinearGradient(0, 0, foil.width, 0);
  grad.addColorStop(0, '#c9ccd6');
  grad.addColorStop(.5, '#e8eaf0');
  grad.addColorStop(1, '#b9bdc9');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, foil.width, foil.height);
  ctx.strokeStyle = 'rgba(23,20,26,.14)';
  ctx.lineWidth = 1;
  for (var i = 0; i < 26; i++) {
    ctx.beginPath();
    var x = Math.random() * foil.width, y = Math.random() * foil.height;
    ctx.moveTo(x, y);
    ctx.lineTo(x + (Math.random() * 24 - 12), y + (Math.random() * 10 - 5));
    ctx.stroke();
  }
}
paintFoil();

// 실제 긁기 — pointermove 로 destination-out 원을 계속 지운다
var drawing = false;
function scratchAt(x, y) {
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(x, y, 16, 0, Math.PI * 2);
  ctx.fill();
}
function pos(e) {
  var r = foil.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (foil.width / r.width), y: (e.clientY - r.top) * (foil.height / r.height) };
}
zone.addEventListener('pointerdown', function (e) {
  if (scratched) { return; }
  sc.classList.remove('is-demo');
  drawing = true;
  var p = pos(e);
  scratchAt(p.x, p.y);
  if (foil.setPointerCapture) { foil.setPointerCapture(e.pointerId); }
});
zone.addEventListener('pointermove', function (e) {
  if (!drawing || scratched) { return; }
  var p = pos(e);
  scratchAt(p.x, p.y);
  if (clearedRatio() > .55) { finish(); }
});
window.addEventListener('pointerup', function () { drawing = false; });

// 얼마나 벗겨졌나 — 알파 샘플로 실측
function clearedRatio() {
  var data = ctx.getImageData(0, 0, foil.width, foil.height).data;
  var clear = 0, total = data.length / 4;
  for (var i = 3; i < data.length; i += 4) { if (data[i] < 40) { clear++; } }
  return clear / total;
}
function finish() {
  scratched = true;
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillRect(0, 0, foil.width, foil.height);
  sc.classList.add('is-open');
  live.textContent = '할인율은 30%였어요';
}
revealBtn.addEventListener('click', function () { if (!scratched) { finish(); } });
</script>
</body>
</html>
