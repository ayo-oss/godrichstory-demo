<main class="stage">
<div class="sp is-demo" id="sp">
  <div class="sp__card">
    <div class="sp__head">
      <p class="sp__title"><svg class="sp__ico" aria-hidden="true"><use href="#coffee"/></svg><span>커피 적립 카드</span></p>
      <p class="sp__count"><span>적립</span> <b id="countNum">7/10</b></p>
    </div>
    <div class="sp__grid" role="progressbar" aria-label="적립 도장 진행" aria-valuemin="0" aria-valuemax="10" aria-valuenow="7" id="bar">
      
      <span class="sp__slot"><span class="sp__stamp sp__stamp--in"><svg aria-hidden="true"><use href="#seal"/></svg></span></span>
      <span class="sp__slot"><span class="sp__stamp sp__stamp--in"><svg aria-hidden="true"><use href="#seal"/></svg></span></span>
      <span class="sp__slot"><span class="sp__stamp sp__stamp--in"><svg aria-hidden="true"><use href="#seal"/></svg></span></span>
      <span class="sp__slot"><span class="sp__stamp sp__stamp--in"><svg aria-hidden="true"><use href="#seal"/></svg></span></span>
      <span class="sp__slot"><span class="sp__stamp sp__stamp--in"><svg aria-hidden="true"><use href="#seal"/></svg></span></span>
      <span class="sp__slot"><span class="sp__stamp sp__stamp--in"><svg aria-hidden="true"><use href="#seal"/></svg></span></span>
      <span class="sp__slot"><span class="sp__stamp sp__stamp--in"><svg aria-hidden="true"><use href="#seal"/></svg></span></span>
      <span class="sp__slot"><span class="sp__stamp sp__stamp--in sp__stamp--idle"><svg aria-hidden="true"><use href="#seal"/></svg></span></span>
      <span class="sp__slot"><span class="sp__stamp sp__stamp--in sp__stamp--idle"><svg aria-hidden="true"><use href="#seal"/></svg></span></span>
      <span class="sp__slot"><span class="sp__stamp sp__stamp--in sp__stamp--idle"><svg aria-hidden="true"><use href="#seal"/></svg></span></span>
    </div>
    <div class="sp__foot">
      <button type="button" class="sp__btn" id="stampBtn">도장 찍기</button>
      <p class="sp__issued" id="issued" aria-live="polite"><span class="sp__issuedChip">쿠폰 발급 완료</span></p>
    </div>
  </div>
</div>
</main>
<script>
var sp = document.getElementById('sp');
var slots = Array.prototype.slice.call(document.querySelectorAll('.sp__slot'));
var stampBtn = document.getElementById('stampBtn');
var bar = document.getElementById('bar');
var issued = document.getElementById('issued');
var countNum = document.getElementById('countNum');
var count = 7;
function render() {
  bar.setAttribute('aria-valuenow', String(count));
  countNum.textContent = count + '/10';
  var full = count >= 10;
  issued.classList.toggle('is-on', full);
  stampBtn.disabled = full;
}
stampBtn.addEventListener('click', function () {
  sp.classList.remove('is-demo');
  if (count >= 10) { return; }
  var target = slots[count].querySelector('.sp__stamp');
  target.classList.remove('sp__stamp--idle');
  target.classList.add('sp__stamp--new');
  count = count + 1;
  render();
});
render();
</script>
