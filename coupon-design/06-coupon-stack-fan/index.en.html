<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쿠폰 더미 부채꼴 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fan is-demo" id="fan">
  <div class="fan__stack" id="stack" role="group" aria-label="Three coupons in the wallet">
    <button type="button" class="fan__card fan__card--1" style="--i: 0" data-msg="First-purchase 10% lifted into checkout" aria-pressed="false">
      <span class="fan__tag">New</span>
      <span class="fan__pct">10<i>%</i></span>
      <span class="fan__name">First-purchase discount</span>
    </button>
    <button type="button" class="fan__card fan__card--2" style="--i: 1" data-msg="Brand-day 20% lifted into checkout" aria-pressed="false">
      <span class="fan__tag">Event</span>
      <span class="fan__pct">20<i>%</i></span>
      <span class="fan__name">Brand-day discount</span>
    </button>
    <button type="button" class="fan__card fan__card--3" style="--i: 2" data-msg="Free-shipping coupon lifted into checkout" aria-pressed="false">
      <span class="fan__tag">Shipping</span>
      <span class="fan__pct">FREE</span>
      <span class="fan__name">Free-shipping coupon</span>
    </button>
  </div>
  <p class="fan__live" id="live" aria-live="polite">Hover to fan out</p>
</div>
</main>
<script>
var fan = document.getElementById('fan');
var stack = document.getElementById('stack');
var live = document.getElementById('live');
var cards = Array.prototype.slice.call(document.querySelectorAll('.fan__card'));
// 호버가 없는 터치 기기에서는 겹친 뒤 카드를 영영 누를 수 없다 — 첫 탭이 더미를 펼친다
stack.addEventListener('pointerdown', function () {
  fan.classList.remove('is-demo');
  stack.classList.add('is-fanned');
});
cards.forEach(function (c) {
  c.addEventListener('click', function () {
    fan.classList.remove('is-demo');
    var on = c.getAttribute('aria-pressed') === 'true';
    cards.forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
    c.setAttribute('aria-pressed', on ? 'false' : 'true');
    live.textContent = on ? 'Selection cleared' : c.getAttribute('data-msg');
  });
});
</script>
</body>
</html>
