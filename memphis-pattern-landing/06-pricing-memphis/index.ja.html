<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern-banded pricing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="pricem">
    <article class="pricem__plan">
      <h2 class="pricem__tier">スターター</h2>
      <p class="pricem__price">₩0</p>
      <p class="pricem__per">ずっと無料</p>
    </article>
    <article class="pricem__plan pricem__plan--best">
      <span class="pricem__badge">人気</span>
      <h2 class="pricem__tier">プロ</h2>
      <p class="pricem__price">₩9,000</p>
      <p class="pricem__per">月あたり</p>
    </article>
    <article class="pricem__plan">
      <h2 class="pricem__tier">チーム</h2>
      <p class="pricem__price">₩39,000</p>
      <p class="pricem__per">月あたり</p>
    </article>
  </section>
</main>
</body>
</html>
