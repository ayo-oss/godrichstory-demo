<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern marquee strip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="marqm" aria-label="Pattern marquee strip">
    <div class="marqm__viewport">
      <div class="marqm__track">
        <span class="marqm__tok marqm__tok--dot"></span>
        <span class="marqm__tok marqm__tok--squig"></span>
        <span class="marqm__tok marqm__tok--cross"></span>
        <span class="marqm__tok marqm__tok--half"></span>
        <span class="marqm__tok marqm__tok--tri"></span>
        <span class="marqm__tok marqm__tok--dot"></span>
        <span class="marqm__tok marqm__tok--squig"></span>
        <span class="marqm__tok marqm__tok--cross"></span>
        <span class="marqm__tok marqm__tok--half"></span>
        <span class="marqm__tok marqm__tok--tri"></span>
      </div>
    </div>
    <p class="marqm__hint">A strip leading to the next section</p>
  </section>
</main>
</body>
</html>
