<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zigzag divider</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="zzm">
    <header class="zzm__sec zzm__sec--top">
      <p class="zzm__kicker">上のセクション</p>
      <h2 class="zzm__head">レモン背景が終わる場所</h2>
    </header>
    <div class="zzm__zip" aria-hidden="true">
      <span class="zzm__teeth zzm__teeth--down"></span>
      <span class="zzm__teeth zzm__teeth--up"></span>
      <span class="zzm__chip">境界</span>
    </div>
    <footer class="zzm__sec zzm__sec--bottom">
      <h2 class="zzm__head">ミント背景が始まる場所</h2>
      <p class="zzm__kicker">下のセクション</p>
    </footer>
  </section>
</main>
</body>
</html>
