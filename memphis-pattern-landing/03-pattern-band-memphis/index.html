<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repeating pattern band</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="bandm">
    <article class="bandm__panel bandm__panel--dots">
      <div class="bandm__fill bandm__fill--dots" aria-hidden="true"></div>
      <span class="bandm__name">점</span>
    </article>
    <article class="bandm__panel bandm__panel--wave">
      <div class="bandm__fill bandm__fill--wave" aria-hidden="true"></div>
      <span class="bandm__name">물결</span>
    </article>
    <article class="bandm__panel bandm__panel--cross">
      <div class="bandm__fill bandm__fill--cross" aria-hidden="true"></div>
      <span class="bandm__name">십자</span>
    </article>
  </section>
</main>
</body>
</html>
