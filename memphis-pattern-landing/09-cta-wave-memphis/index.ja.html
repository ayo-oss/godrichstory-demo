<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">

<title>Wavy CTA band</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ctam">
    <div class="ctam__crest" aria-hidden="true"><span class="ctam__wave"></span></div>
    <div class="ctam__body">
      <div class="ctam__text">
        <h2 class="ctam__head">パターンが必要な瞬間です</h2>
        <p class="ctam__sub">今すぐ貼って次のセクションへ</p>
      </div>
      <button class="ctam__btn" type="button">
        始める
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g></svg>
      </button>
    </div>
  </section>
</main>
</body>
</html>
