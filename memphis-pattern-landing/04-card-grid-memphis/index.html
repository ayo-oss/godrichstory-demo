<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bold-outline card grid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="gridm">
    <article class="gridm__card">
      <span class="gridm__sticker gridm__sticker--circle" aria-hidden="true"></span>
      <div class="gridm__band gridm__band--dots" aria-hidden="true"></div>
      <h2 class="gridm__title">패턴 만들기</h2>
      <p class="gridm__desc">점 찍듯 붙여 넣는 설계</p>
    </article>
    <article class="gridm__card">
      <span class="gridm__sticker gridm__sticker--half" aria-hidden="true"></span>
      <div class="gridm__band gridm__band--cross" aria-hidden="true"></div>
      <h2 class="gridm__title">형상 얹기</h2>
      <p class="gridm__desc">반원과 삼각으로 포인트</p>
    </article>
    <article class="gridm__card">
      <span class="gridm__sticker gridm__sticker--tri" aria-hidden="true"></span>
      <div class="gridm__band gridm__band--zig" aria-hidden="true"></div>
      <h2 class="gridm__title">경계 나누기</h2>
      <p class="gridm__desc">지그재그로 섹션을 절단</p>
    </article>
  </section>
</main>
</body>
</html>
