<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bold-outline card grid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="gridm">
    <article class="gridm__card">
      <span class="gridm__sticker gridm__sticker--circle" aria-hidden="true"></span>
      <div class="gridm__band gridm__band--dots" aria-hidden="true"></div>
      <h2 class="gridm__title">Make patterns</h2>
      <p class="gridm__desc">Design you paste like stamping dots</p>
    </article>
    <article class="gridm__card">
      <span class="gridm__sticker gridm__sticker--half" aria-hidden="true"></span>
      <div class="gridm__band gridm__band--cross" aria-hidden="true"></div>
      <h2 class="gridm__title">Add shapes</h2>
      <p class="gridm__desc">Accents from half circles and triangles</p>
    </article>
    <article class="gridm__card">
      <span class="gridm__sticker gridm__sticker--tri" aria-hidden="true"></span>
      <div class="gridm__band gridm__band--zig" aria-hidden="true"></div>
      <h2 class="gridm__title">Divide boundaries</h2>
      <p class="gridm__desc">Cut sections with zigzags</p>
    </article>
  </section>
</main>
</body>
</html>
