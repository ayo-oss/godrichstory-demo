<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Long-Press Ring to Schedule Undo — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<ul class="list is-demo" id="list">
  <li class="row" id="row-0" data-actions="false" tabindex="0" role="button" aria-haspopup="true" aria-label="Check the mailbox — long-press to see actions">
    <span class="ring" aria-hidden="true"><svg viewBox="0 0 32 32"><circle class="ringTrack" cx="16" cy="16" r="14"/><circle class="ringFill" id="ringFill-0" cx="16" cy="16" r="14"/></svg></span>
    <span class="rowText">Check the mailbox</span>
    <span class="actions" id="actions-0">
      <button class="actBtn actEdit" type="button" aria-label="Edit">Edit</button>
      <button class="actBtn actDel" type="button" aria-label="Delete">Delete</button>
    </span>
  </li>
  <li class="row" id="row-1" data-actions="false" tabindex="0" role="button" aria-haspopup="true" aria-label="Water the plant — long-press to see actions">
    <span class="ring" aria-hidden="true"><svg viewBox="0 0 32 32"><circle class="ringTrack" cx="16" cy="16" r="14"/><circle class="ringFill" id="ringFill-1" cx="16" cy="16" r="14"/></svg></span>
    <span class="rowText">Water the plant</span>
    <span class="actions" id="actions-1">
      <button class="actBtn actEdit" type="button" aria-label="Edit">Edit</button>
      <button class="actBtn actDel" type="button" aria-label="Delete">Delete</button>
    </span>
  </li>
</ul>
</main>
<script>
(function () {
  var LONGPRESS_HOLD_MS = 500; // 누른 채 버티면 이 시간에 링이 다 찬다
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var list = document.getElementById('list');
  var rows = [document.getElementById('row-0'), document.getElementById('row-1')];
  var rings = [document.getElementById('ringFill-0'), document.getElementById('ringFill-1')];
  var CIRC = 2 * Math.PI * 14;

  function human() { list.classList.remove('is-demo'); window.clearInterval(autoTimer); }

  rings.forEach(function (r) {
    r.style.strokeDasharray = CIRC.toFixed(2);
    r.style.strokeDashoffset = CIRC.toFixed(2);
  });

  // 계산 겹: 실제 경과 시간 비율(elapsed / LONGPRESS_HOLD_MS)을 원의 둘레 길이에 곱해
  // 링이 실제로 몇 초 눌렀는지를 정확히 반영하게 한다.
  function paintRing(i, ratio) {
    var offset = CIRC * (1 - Math.min(1, Math.max(0, ratio)));
    rings[i].style.strokeDashoffset = offset.toFixed(2);
  }

  function startPress(i, startTime) {
    rows[i].classList.add('pressing');
    var raf;
    function tick(now) {
      var elapsed = now - startTime;
      var ratio = elapsed / LONGPRESS_HOLD_MS;
      paintRing(i, ratio);
      if (ratio >= 1) {
        openActions(i);
        cancelPress(i);
        return;
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    rows[i]._raf = raf;
  }

  function cancelPress(i) {
    rows[i].classList.remove('pressing');
    if (rows[i]._raf) cancelAnimationFrame(rows[i]._raf);
    paintRing(i, 0);
  }

  function openActions(i) {
    rows[i].setAttribute('data-actions', 'true');
  }
  function closeActions(i) {
    rows[i].setAttribute('data-actions', 'false');
  }

  rows.forEach(function (row, i) {
    var downAt = 0;
    row.addEventListener('pointerdown', function (e) {
      human();
      downAt = performance.now();
      startPress(i, downAt);
    });
    row.addEventListener('pointerup', function () { cancelPress(i); });
    row.addEventListener('pointerleave', function () { cancelPress(i); });
    row.addEventListener('keydown', function (e) {
      human();
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openActions(i);
      } else if (e.key === 'Escape') {
        closeActions(i);
      }
    });
    var editBtn = document.getElementById('actions-' + i).querySelector('.actEdit');
    var delBtn = document.getElementById('actions-' + i).querySelector('.actDel');
    editBtn.addEventListener('click', function (e) { e.stopPropagation(); human(); closeActions(i); });
    delBtn.addEventListener('click', function (e) { e.stopPropagation(); human(); closeActions(i); });
  });

  var cursor = 0;
  function autoStep() {
    var i = cursor;
    var start = performance.now();
    startPress(i, start - LONGPRESS_HOLD_MS * 0.02);
    window.setTimeout(function () {
      window.setTimeout(function () { closeActions(i); }, 700);
    }, LONGPRESS_HOLD_MS + 60);
    cursor = (cursor + 1) % rows.length;
  }
  var autoTimer;
  if (!reduce) { autoStep(); autoTimer = window.setInterval(autoStep, 1900); }
})();
</script>
</body>
</html>
