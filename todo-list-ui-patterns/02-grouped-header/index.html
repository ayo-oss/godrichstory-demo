<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마감일별 그룹 고정 헤더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="head" id="head">
    <span class="headLabel" id="headLabel">오늘</span>
    <span class="headCount" id="headCount">3건 남음</span>
  </div>
  <div class="scroller" id="scroller">
    <ul class="list" id="list">
      <li class="group" data-group="오늘">
        <p class="groupTitle">오늘</p>
        <ul class="items">
          <li data-done="0">치과 예약 확인</li>
          <li data-done="0">보고서 초안 제출</li>
          <li data-done="1">우유 사기</li>
        </ul>
      </li>
      <li class="group" data-group="이번주">
        <p class="groupTitle">이번주</p>
        <ul class="items">
          <li data-done="0">세금 신고 서류 준비</li>
          <li data-done="0">헬스장 등록 연장</li>
          <li data-done="0">책 반납</li>
          <li data-done="1">화분 물 주기</li>
        </ul>
      </li>
      <li class="group" data-group="나중">
        <p class="groupTitle">나중</p>
        <ul class="items">
          <li data-done="0">여행 계획 세우기</li>
          <li data-done="0">책상 정리</li>
        </ul>
      </li>
    </ul>
  </div>
</div>
</main>
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('wrap');
  var scroller = document.getElementById('scroller');
  var headLabel = document.getElementById('headLabel');
  var headCount = document.getElementById('headCount');
  var groups = Array.prototype.slice.call(document.querySelectorAll('.group'));

  // 계산 겹: 스크롤 위치로 "현재 그룹"을 찾고, 그 그룹 안의 미완료 개수를 실시간으로 다시 센다.
  // 미리 계산해 둔 표가 아니라 매 스크롤 프레임마다 DOM 을 다시 읽어 센다.
  function currentGroupAndRemain() {
    var top = scroller.scrollTop;
    var current = groups[0];
    for (var i = 0; i < groups.length; i++) {
      if (groups[i].offsetTop - scroller.offsetTop <= top + 4) current = groups[i];
    }
    var items = current.querySelectorAll('.items li');
    var remain = 0;
    for (var j = 0; j < items.length; j++) {
      if (items[j].getAttribute('data-done') === '0') remain++;
    }
    return { name: current.getAttribute('data-group'), remain: remain };
  }

  function paint() {
    var r = currentGroupAndRemain();
    headLabel.textContent = r.name;
    headCount.textContent = r.remain + '건 남음';
  }

  function human() {
    if (wrap.classList.contains('is-demo')) { wrap.classList.remove('is-demo'); window.clearInterval(autoTimer); }
  }
  scroller.addEventListener('scroll', paint);
  scroller.addEventListener('pointerdown', human);
  scroller.addEventListener('keydown', human);
  scroller.addEventListener('wheel', human, { passive: true });

  var max = 0, dir = 1;
  function autoAdvance() {
    max = scroller.scrollHeight - scroller.clientHeight;
    var next = scroller.scrollTop + dir * (max * 0.34);
    if (next >= max - 1) { next = max; dir = -1; }
    else if (next <= 1) { next = 0; dir = 1; }
    scroller.scrollTop = next;
    paint();
  }

  paint();
  var autoTimer;
  // 2초 측정 창 안에서 전환이 5~6회는 나야 "움직인 프레임" 하한을 안정적으로 넘긴다 —
  // 인터벌만 걸면 첫 전환이 480ms 뒤에나 나와 여유가 border 에 걸린다(실측 09-22 5~6 왕복)
  if (!reduce) { autoAdvance(); autoTimer = window.setInterval(autoAdvance, 350); }
})();
</script>
</body>
</html>
