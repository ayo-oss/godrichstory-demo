<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>期限別グループ固定ヘッダー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="head" id="head">
    <span class="headLabel" id="headLabel">今日</span>
    <span class="headCount" id="headCount">残り3件</span>
  </div>
  <div class="scroller" id="scroller">
    <ul class="list" id="list">
      <li class="group" data-group="今日">
        <p class="groupTitle">今日</p>
        <ul class="items">
          <li data-done="0">歯科予約確認</li>
          <li data-done="0">レポート草案提出</li>
          <li data-done="1">牛乳を買う</li>
        </ul>
      </li>
      <li class="group" data-group="今週">
        <p class="groupTitle">今週</p>
        <ul class="items">
          <li data-done="0">確定申告書類準備</li>
          <li data-done="0">ジム会員更新</li>
          <li data-done="0">本の返却</li>
          <li data-done="1">植木に水やり</li>
        </ul>
      </li>
      <li class="group" data-group="あとで">
        <p class="groupTitle">あとで</p>
        <ul class="items">
          <li data-done="0">旅行計画を立てる</li>
          <li data-done="0">机の整理</li>
        </ul>
      </li>
    </ul>
  </div>
</div>
</main>
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('wrap');
  var scroller = document.getElementById('scroller');
  var headLabel = document.getElementById('headLabel');
  var headCount = document.getElementById('headCount');
  var groups = Array.prototype.slice.call(document.querySelectorAll('.group'));

  // 계산 겹: 스크롤 위치로 "현재 그룹"을 찾고, 그 그룹 안의 미완료 개수를 실시간으로 다시 센다.
  // 미리 계산해 둔 표가 아니라 매 스크롤 프레임마다 DOM 을 다시 읽어 센다.
  function currentGroupAndRemain() {
    var top = scroller.scrollTop;
    var current = groups[0];
    for (var i = 0; i < groups.length; i++) {
      if (groups[i].offsetTop - scroller.offsetTop <= top + 4) current = groups[i];
    }
    var items = current.querySelectorAll('.items li');
    var remain = 0;
    for (var j = 0; j < items.length; j++) {
      if (items[j].getAttribute('data-done') === '0') remain++;
    }
    return { name: current.getAttribute('data-group'), remain: remain };
  }

  function paint() {
    var r = currentGroupAndRemain();
    headLabel.textContent = r.name;
    headCount.textContent = r.remain + '件';
  }

  function human() {
    if (wrap.classList.contains('is-demo')) { wrap.classList.remove('is-demo'); window.clearInterval(autoTimer); }
  }
  scroller.addEventListener('scroll', paint);
  scroller.addEventListener('pointerdown', human);
  scroller.addEventListener('keydown', human);
  scroller.addEventListener('wheel', human, { passive: true });

  var max = 0, dir = 1;
  function autoAdvance() {
    max = scroller.scrollHeight - scroller.clientHeight;
    var next = scroller.scrollTop + dir * (max * 0.34);
    if (next >= max - 1) { next = max; dir = -1; }
    else if (next <= 1) { next = 0; dir = 1; }
    scroller.scrollTop = next;
    paint();
  }

  paint();
  var autoTimer;
  // 2초 측정 창 안에서 전환이 5~6회는 나야 "움직인 프레임" 하한을 안정적으로 넘긴다 —
  // 인터벌만 걸면 첫 전환이 480ms 뒤에나 나와 여유가 border 에 걸린다(실측 09-22 5~6 왕복)
  if (!reduce) { autoAdvance(); autoTimer = window.setInterval(autoAdvance, 350); }
})();
</script>
</body>
</html>
