<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List-to-Detail Card Zoom Transition — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="scene is-demo" id="scene">
  <ul class="cards" id="cards">
    <li>
      <button class="card" id="card-0" type="button" aria-haspopup="dialog">
        <span class="cardTitle">Organize grocery list</span>
        <span class="cardMeta">Today · 3 items</span>
      </button>
    </li>
    <li>
      <button class="card" id="card-1" type="button" aria-haspopup="dialog">
        <span class="cardTitle">Weekly meeting materials</span>
        <span class="cardMeta">Tomorrow · 5 items</span>
      </button>
    </li>
  </ul>
  <div class="detail" id="detail" role="dialog" aria-modal="true" aria-hidden="true">
    <button class="backBtn" id="backBtn" type="button" aria-label="Back to list">
      <svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M112 56v144l-72-72Z" opacity=".2"/><path d="M216 120h-96V56a8 8 0 0 0-13.66-5.66l-72 72a8 8 0 0 0 0 11.32l72 72A8 8 0 0 0 120 200v-64h96a8 8 0 0 0 0-16m-112 60.69L51.31 128L104 75.31Z"/></g></svg>
    </button>
    <h2 class="detailTitle" id="detailTitle">Organize grocery list</h2>
    <ul class="detailList" id="detailList">
      <li>Milk x1</li>
      <li>A tray of eggs</li>
      <li>Bread</li>
    </ul>
  </div>
</div>
</main>
<script>
(function () {
  var DUR_MS = 420;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var scene = document.getElementById('scene');
  var detail = document.getElementById('detail');
  var backBtn = document.getElementById('backBtn');
  var detailTitle = document.getElementById('detailTitle');
  var cards = [document.getElementById('card-0'), document.getElementById('card-1')];
  var data = [
    { title: 'Organize grocery list', items: ['Milk x1', 'A tray of eggs', 'Bread'] },
    { title: 'Weekly meeting materials', items: ['Organize agenda', 'Print materials', 'Book meeting room', 'Confirm attendees', 'Charge laptop'] }
  ];
  var back = null; // 닫을 때 되돌아갈 FLIP 값

  function human() { scene.classList.remove('is-demo'); window.clearInterval(autoTimer); }

  // 계산 겹: 카드의 실제 화면 좌표(First)와 상세 패널이 이미 차지한 화면 전체 좌표(Last)의
  // 차이를 실측해 translate·scale 로 변환한다 — FLIP(First-Last-Invert-Play).
  function flipFrom(cardEl) {
    var c = cardEl.getBoundingClientRect();
    var d = detail.getBoundingClientRect();
    return {
      dx: c.left - d.left,
      dy: c.top - d.top,
      sx: c.width / d.width,
      sy: c.height / d.height
    };
  }

  function openDetail(i) {
    var item = data[i];
    detailTitle.textContent = item.title;
    document.getElementById('detailList').innerHTML = item.items.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    detail.setAttribute('aria-hidden', 'false');
    detail.style.transition = 'none';
    detail.style.display = 'flex';
    back = flipFrom(cards[i]);
    detail.style.transform = 'translate(' + back.dx + 'px,' + back.dy + 'px) scale(' + back.sx + ',' + back.sy + ')';
    detail.style.opacity = '1';
    // 강제 리플로 — Invert 상태를 실제로 그린 뒤에야 Play(역전 제거) 애니메이션이 성립한다
    detail.getBoundingClientRect();
    detail.style.transition = reduce ? 'none' : 'transform ' + DUR_MS + 'ms var(--flip-ease)';
    detail.style.transform = 'translate(0,0) scale(1,1)';
  }

  function closeDetail() {
    if (!back) { detail.style.display = 'none'; detail.setAttribute('aria-hidden', 'true'); return; }
    detail.style.transition = reduce ? 'none' : 'transform ' + DUR_MS + 'ms var(--flip-ease)';
    detail.style.transform = 'translate(' + back.dx + 'px,' + back.dy + 'px) scale(' + back.sx + ',' + back.sy + ')';
    var done = function () {
      detail.style.display = 'none';
      detail.setAttribute('aria-hidden', 'true');
      detail.removeEventListener('transitionend', done);
    };
    if (reduce) { done(); } else { detail.addEventListener('transitionend', done); }
  }

  cards.forEach(function (c, i) {
    c.addEventListener('click', function () { human(); openDetail(i); });
  });
  backBtn.addEventListener('click', function () { human(); closeDetail(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && detail.getAttribute('aria-hidden') === 'false') { human(); closeDetail(); }
  });

  var cursor = 0;
  function autoStep() {
    openDetail(cursor);
    window.setTimeout(function () {
      if (scene.classList.contains('is-demo')) closeDetail();
    }, 900);
    cursor = (cursor + 1) % cards.length;
  }
  var autoTimer;
  if (!reduce) { autoStep(); autoTimer = window.setInterval(autoStep, 1400); }
})();
</script>
</body>
</html>
