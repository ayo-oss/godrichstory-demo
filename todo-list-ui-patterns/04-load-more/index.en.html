<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Load More With Doubling Batch Size — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <ul class="list" id="list"></ul>
  <button class="moreBtn" id="moreBtn" type="button">
    <span id="moreLabel">Show 4 more</span>
  </button>
  <p class="liveNote" id="liveNote" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  var BASE_BATCH = 2;
  var LOAD_MORE_MULTIPLIER = 2.0; // 클릭마다 다음 묶음 크기 = BASE_BATCH * 배수^클릭수
  var STAGGER_MS = 60;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('wrap');
  var list = document.getElementById('list');
  var moreBtn = document.getElementById('moreBtn');
  var moreLabel = document.getElementById('moreLabel');
  var liveNote = document.getElementById('liveNote');

  var ALL = [
    'Buy toothpaste', 'Take out recycling', 'Drop off blanket at laundry', 'Replace lightbulb',
    'Book car wash', 'Clean out fridge', 'Pick reading list', 'Replace shoelaces',
    'Repot plant', 'Tidy desk drawer', 'Sort receipts', 'Organize charger cables',
    'Bring out winter clothes', 'Check umbrella', 'Check battery stock', 'Replace towels',
    'Clean window screen', 'Tidy shoe rack', 'Clean laptop dust', 'Clear notepad'
  ];

  var shown = 0;   // 화면에 낸 개수
  var clicks = 0;  // 클릭 횟수 — 계산 겹의 입력값

  // 계산 겹: 다음 묶음 크기는 고정값이 아니라 클릭 횟수의 지수함수다.
  function nextBatchSize() {
    var size = Math.round(BASE_BATCH * Math.pow(LOAD_MORE_MULTIPLIER, clicks));
    var remain = ALL.length - shown;
    return Math.min(size, remain);
  }

  function renderBatch(n) {
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {
      var idx = shown + i;
      var li = document.createElement('li');
      li.className = 'row';
      li.textContent = ALL[idx];
      // 계산 겹: 묶음 안 순서(i)로 진입 지연을 실측해 매긴다 — 고정 delay 나열이 아니다.
      li.style.transitionDelay = reduce ? '0ms' : (i * STAGGER_MS) + 'ms';
      list.appendChild(li);
      frag.appendChild(li);
    }
    shown += n;
    // 강제 리플로 뒤 클래스 부여 — 방금 추가한 항목만 시작 상태에서 도착 상태로 전환된다
    list.getBoundingClientRect();
    var added = list.querySelectorAll('.row:not(.in)');
    for (var j = 0; j < added.length; j++) added[j].classList.add('in');
  }

  function paintButton() {
    var remain = ALL.length - shown;
    if (remain <= 0) {
      moreBtn.disabled = true;
      moreLabel.textContent = 'All seen';
      return;
    }
    var next = nextBatchSize();
    moreLabel.textContent = next + ' more';
  }

  function loadMore() {
    var n = nextBatchSize();
    if (n <= 0) return;
    renderBatch(n);
    clicks += 1;
    liveNote.textContent = n + ' items were added. Total ' + shown + ' items.';
    paintButton();
  }

  function human() { wrap.classList.remove('is-demo'); window.clearInterval(autoTimer); }

  moreBtn.addEventListener('click', function () { human(); loadMore(); });

  function reset() {
    list.innerHTML = '';
    shown = 0;
    clicks = 0;
    moreBtn.disabled = false;
    paintButton();
  }

  var autoTimer;
  function autoStep() {
    if (ALL.length - shown <= 0) { reset(); }
    loadMore();
  }
  reset();
  loadMore();
  if (!reduce) { autoTimer = window.setInterval(autoStep, 620); }
})();
</script>
</body>
</html>
