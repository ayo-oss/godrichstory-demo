<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inline Edit With Character Countdown — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<ul class="list is-demo" id="list">
  <li class="row" data-id="0">
    <span class="display" id="display-0" tabindex="0" role="button" aria-label="Select to edit">Buy ice cream</span>
  </li>
  <li class="row" data-id="1">
    <span class="display" id="display-1" tabindex="0" role="button" aria-label="Select to edit">Pick up laundry</span>
  </li>
  <li class="row" data-id="2">
    <span class="display" id="display-2" tabindex="0" role="button" aria-label="Select to edit">Replace study lamp</span>
  </li>
</ul>
<span class="mirror" id="mirror" aria-hidden="true"></span>
</main>
<script>
(function () {
  var MAX_LEN = 24;
  var WARN_AT = 8; // 남은 글자 수가 이 값 이하면 경고
  var MIN_W = 90, MAX_W = 220;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var list = document.getElementById('list');
  var mirror = document.getElementById('mirror');

  function human() { list.classList.remove('is-demo'); window.clearInterval(autoTimer); }

  // 계산 겹: 실제 텍스트 폭을 숨은 미러 span 으로 측정해(scrollWidth) input 너비를 그 값에 맞춘다.
  function measureWidth(text) {
    mirror.textContent = text || ' ';
    var w = mirror.getBoundingClientRect().width + 24;
    return Math.max(MIN_W, Math.min(MAX_W, w));
  }

  function enterEdit(row) {
    var display = row.querySelector('.display');
    var text = display.textContent;
    var wrap = document.createElement('span');
    wrap.className = 'editWrap';
    var input = document.createElement('input');
    input.className = 'editInput';
    input.type = 'text';
    input.value = text;
    input.maxLength = MAX_LEN;
    input.setAttribute('aria-label', 'Edit todo text');
    var badge = document.createElement('span');
    badge.className = 'countBadge';
    wrap.appendChild(input);
    wrap.appendChild(badge);
    display.replaceWith(wrap);

    function paint() {
      var remain = MAX_LEN - input.value.length;
      badge.textContent = String(remain);
      input.style.width = measureWidth(input.value) + 'px';
      var warn = remain <= WARN_AT;
      badge.classList.toggle('warn', warn);
      input.classList.toggle('warn', warn);
      if (warn && !reduce) {
        badge.classList.remove('shake');
        void badge.offsetWidth;
        badge.classList.add('shake');
      }
    }

    function save() {
      var val = input.value.trim() || text;
      var newDisplay = document.createElement('span');
      newDisplay.className = 'display';
      newDisplay.id = display.id;
      newDisplay.tabIndex = 0;
      newDisplay.setAttribute('role', 'button');
      newDisplay.setAttribute('aria-label', 'Select to edit');
      newDisplay.textContent = val;
      wrap.replaceWith(newDisplay);
      bindDisplay(newDisplay);
    }

    input.addEventListener('input', function () { human(); paint(); });
    input.addEventListener('keydown', function (e) {
      human();
      if (e.key === 'Enter') { e.preventDefault(); save(); }
      else if (e.key === 'Escape') { input.value = text; save(); }
    });
    input.addEventListener('blur', save);

    paint();
    input.focus({ preventScroll: true });
    input.setSelectionRange(input.value.length, input.value.length);
    return input;
  }

  function bindDisplay(display) {
    display.addEventListener('click', function () { human(); enterEdit(display.closest('.row')); });
    display.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); enterEdit(display.closest('.row')); }
    });
  }

  Array.prototype.forEach.call(list.querySelectorAll('.display'), bindDisplay);

  var SCRIPT = [
    { id: 0, append: ' (both convenience store and mart)' },
    { id: 1, append: ' by this evening' }
  ];
  var cursor = 0;
  function autoStep() {
    var step = SCRIPT[cursor];
    var row = list.querySelector('.row[data-id="' + step.id + '"]');
    var display = row.querySelector('.display');
    if (!display) { cursor = (cursor + 1) % SCRIPT.length; return; }
    var input = enterEdit(row);
    var base = input.value;
    var full = (base + step.append).slice(0, MAX_LEN);
    var i = base.length;
    var typeIv = setInterval(function () {
      i++;
      input.value = full.slice(0, i);
      input.dispatchEvent(new Event('input'));
      if (i >= full.length) {
        clearInterval(typeIv);
        window.setTimeout(function () {
          input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
        }, 260);
      }
    }, 70);
    cursor = (cursor + 1) % SCRIPT.length;
  }
  var autoTimer;
  if (!reduce) { autoTimer = window.setInterval(autoStep, 1700); }
})();
</script>
</body>
</html>
