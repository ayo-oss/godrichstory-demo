<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>完了タイムライン巻き戻し — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="head">
    <span class="headTitle">完了記録</span>
    <button class="rewindBtn" id="rewindBtn" type="button" aria-label="巻き戻し — 直近の記録から戻す">
      <svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M224 128a96 96 0 0 1-94.71 96H128a95.38 95.38 0 0 1-65.9-26.2a8 8 0 0 1 11-11.63a80 80 0 1 0-1.67-114.78a3 3 0 0 1-.26.25L44.59 96H72a8 8 0 0 1 0 16H24a8 8 0 0 1-8-8V56a8 8 0 0 1 16 0v29.8L60.25 60A96 96 0 0 1 224 128"/></g></svg>
    </button>
  </div>
  <ol class="timeline" id="timeline"></ol>
  <p class="liveNote" id="liveNote" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  var STAGGER_MS = 90;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('wrap');
  var timeline = document.getElementById('timeline');
  var rewindBtn = document.getElementById('rewindBtn');
  var liveNote = document.getElementById('liveNote');
  var line = document.createElement('div');
  line.className = 'timelineLine';
  line.setAttribute('aria-hidden', 'true');
  timeline.appendChild(line);

  var LOG = [
    { time: '09:12', text: '朝のストレッチ完了' },
    { time: '09:40', text: 'メール確認完了' },
    { time: '10:05', text: '週次レポート提出' },
    { time: '11:20', text: 'チームスタンドアップ参加' },
    { time: '13:00', text: '昼食記録' }
  ];
  var shown = [];

  function human() { wrap.classList.remove('is-demo'); window.clearInterval(autoTimer); }

  // 계산 겹: 첫 점과 마지막 점의 실제 화면 좌표 차이를 재서 세로선의 길이(scaleY)를 정한다 —
  // 고정 px 나열이 아니다.
  function paintLine() {
    var dots = timeline.querySelectorAll('.dot');
    if (dots.length < 2) { line.style.transform = 'scaleY(0)'; return; }
    var first = dots[0].getBoundingClientRect();
    var last = dots[dots.length - 1].getBoundingClientRect();
    var timelineRect = timeline.getBoundingClientRect();
    var top = first.top + first.height / 2 - timelineRect.top;
    var span = (last.top + last.height / 2) - (first.top + first.height / 2);
    line.style.top = top + 'px';
    line.style.height = span + 'px';
    line.style.transform = 'scaleY(1)';
  }

  function renderEntry(entry, index) {
    var li = document.createElement('li');
    li.className = 'entry';
    li.style.transitionDelay = reduce ? '0ms' : (index * STAGGER_MS) + 'ms';
    li.innerHTML =
      '<span class="dot" aria-hidden="true"></span>' +
      '<span class="entryTime">' + entry.time + '</span>' +
      '<span class="entryText">' + entry.text + '</span>';
    timeline.appendChild(li);
    return li;
  }

  function addNext() {
    if (shown.length >= LOG.length) return;
    var entry = LOG[shown.length];
    var li = renderEntry(entry, shown.length);
    shown.push(li);
    timeline.getBoundingClientRect();
    li.classList.add('in');
    paintLine();
    liveNote.textContent = entry.text + ' の記録が追加されました。';
  }

  // 계산 겹: 되감기는 최근 항목부터 지우되, 각 항목의 지연 시간을 "끝에서부터의 역순 인덱스"로
  // 계산한다 — 안쪽(오래된 항목)일수록 나중에 사라진다.
  function rewind() {
    var total = shown.length;
    if (total === 0) return;
    var toRemove = shown.slice().reverse();
    toRemove.forEach(function (li, i) {
      var reverseIndex = total - 1 - i; // 뒤에서부터 셀수록 커지는 값
      var delay = reduce ? 0 : reverseIndex * STAGGER_MS * 0.4;
      window.setTimeout(function () {
        li.classList.remove('in');
        li.classList.add('out');
        window.setTimeout(function () {
          if (li.parentNode) li.parentNode.removeChild(li);
          paintLine();
        }, reduce ? 0 : 220);
      }, delay);
    });
    shown = [];
    liveNote.textContent = total + '件の記録を巻き戻しました。';
  }

  rewindBtn.addEventListener('click', function () { human(); rewind(); });

  var cursor = 0;
  function autoStep() {
    if (shown.length >= LOG.length) {
      rewind();
      return;
    }
    addNext();
  }
  var autoTimer;
  if (!reduce) { autoTimer = window.setInterval(autoStep, 420); }
})();
</script>
</body>
</html>
