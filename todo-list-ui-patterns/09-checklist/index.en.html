<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist Ring Gauge Sync — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wrap is-demo" id="wrap">
  <div class="gauge" id="gauge" style="--fill-deg:0deg">
    <div class="gaugeHole" id="gaugeHole">
      <span class="gaugePct" id="gaugePct">0%</span>
    </div>
    <span class="shine" id="shine" aria-hidden="true"></span>
  </div>
  <ul class="list" id="list">
    <li class="row" data-id="0"><button class="check" type="button" role="checkbox" aria-checked="false" aria-label="Confirm dentist appointment"><span class="checkMark" aria-hidden="true"></span></button><span class="rowText">Confirm dentist appointment</span></li>
    <li class="row" data-id="1"><button class="check" type="button" role="checkbox" aria-checked="false" aria-label="Sort groceries"><span class="checkMark" aria-hidden="true"></span></button><span class="rowText">Sort groceries</span></li>
    <li class="row" data-id="2"><button class="check" type="button" role="checkbox" aria-checked="false" aria-label="Reply to email"><span class="checkMark" aria-hidden="true"></span></button><span class="rowText">Reply to email</span></li>
    <li class="row" data-id="3"><button class="check" type="button" role="checkbox" aria-checked="false" aria-label="30-min workout"><span class="checkMark" aria-hidden="true"></span></button><span class="rowText">30-min workout</span></li>
  </ul>
</div>
</main>
<script>
(function () {
  var GAUGE_RING_WIDTH = 6; // px — 게이지 링 두께
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('wrap');
  var gauge = document.getElementById('gauge');
  var gaugeHole = document.getElementById('gaugeHole');
  var gaugePct = document.getElementById('gaugePct');
  var shine = document.getElementById('shine');
  var list = document.getElementById('list');
  var rows = Array.prototype.slice.call(list.querySelectorAll('.row'));
  var CHECK_SVG = '<svg viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg>';

  gauge.style.setProperty('--ring-w', GAUGE_RING_WIDTH + 'px');
  rows.forEach(function (r) { r.querySelector('.checkMark').innerHTML = ''; });

  var wasFull = false;

  function human() { wrap.classList.remove('is-demo'); window.clearInterval(autoTimer); }

  // 계산 겹: 체크된 개수/전체 개수 비율을 각도(0~360deg)로 바꿔 conic-gradient 로 그린다.
  function paintGauge() {
    var total = rows.length;
    var done = rows.filter(function (r) { return r.dataset.done === '1'; }).length;
    var ratio = done / total;
    var deg = ratio * 360;
    gauge.style.setProperty('--fill-deg', deg + 'deg');
    gaugePct.textContent = Math.round(ratio * 100) + '%';
    if (ratio >= 1 && !wasFull) {
      wasFull = true;
      if (!reduce) {
        shine.classList.remove('play');
        void shine.offsetWidth;
        shine.classList.add('play');
      }
    } else if (ratio < 1) {
      wasFull = false;
    }
  }

  function toggle(row) {
    var done = row.dataset.done === '1';
    row.dataset.done = done ? '0' : '1';
    var btn = row.querySelector('.check');
    var mark = row.querySelector('.checkMark');
    btn.setAttribute('aria-checked', done ? 'false' : 'true');
    mark.innerHTML = done ? '' : CHECK_SVG;
    paintGauge();
    // 계산 겹 2: 토글된 행만 잠깐 밝아졌다가 스스로 꺼진다 — 클래스 자체가 380ms 뒤 타이머로 지워진다
    row.classList.add('justToggled');
    window.clearTimeout(row._flashTimer);
    row._flashTimer = window.setTimeout(function () { row.classList.remove('justToggled'); }, 380);
  }

  rows.forEach(function (row) {
    var btn = row.querySelector('.check');
    btn.addEventListener('click', function () { human(); toggle(row); });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); toggle(row); }
    });
  });

  paintGauge();

  var cursor = 0;
  function autoStep() {
    if (cursor >= rows.length) {
      rows.forEach(function (r) { r.dataset.done = '0'; r.querySelector('.check').setAttribute('aria-checked', 'false'); r.querySelector('.checkMark').innerHTML = ''; });
      paintGauge();
      cursor = 0;
      return;
    }
    toggle(rows[cursor]);
    cursor++;
  }
  var autoTimer;
  if (!reduce) { autoStep(); autoTimer = window.setInterval(autoStep, 480); }
})();
</script>
</body>
</html>
