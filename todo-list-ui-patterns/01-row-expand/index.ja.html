<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サブタスク展開する行 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<ul class="list is-demo" id="list">
  <li class="row" id="row-0">
    <button class="rowBtn" id="btn-0" type="button" aria-expanded="false" aria-controls="sub-0">
      <span class="badge" id="badge-0">1/3</span>
      <span class="title">週次レポート準備</span>
      <svg class="caret" id="caret-0" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg>
    </button>
    <div class="subWrap" id="sub-0" role="group" aria-label="サブタスク">
      <ul class="subList">
        <li class="done">資料集め</li>
        <li>グラフ整理</li>
        <li>レビュー依頼</li>
      </ul>
    </div>
  </li>
  <li class="row" id="row-1">
    <button class="rowBtn" id="btn-1" type="button" aria-expanded="false" aria-controls="sub-1">
      <span class="badge" id="badge-1">2/2</span>
      <span class="title">デザインシステム整理</span>
      <svg class="caret" id="caret-1" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg>
    </button>
    <div class="subWrap" id="sub-1" role="group" aria-label="サブタスク">
      <ul class="subList">
        <li class="done">トークン表作成</li>
        <li class="done">コンポーネント一覧</li>
      </ul>
    </div>
  </li>
  <li class="row" id="row-2">
    <button class="rowBtn" id="btn-2" type="button" aria-expanded="false" aria-controls="sub-2">
      <span class="badge" id="badge-2">0/4</span>
      <span class="title">顧客対応メール返信</span>
      <svg class="caret" id="caret-2" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg>
    </button>
    <div class="subWrap" id="sub-2" role="group" aria-label="サブタスク">
      <ul class="subList">
        <li>問い合わせ分類</li>
        <li>返信案作成</li>
        <li>担当者確認</li>
        <li>送信</li>
      </ul>
    </div>
  </li>
</ul>
</main>
<script>
(function () {
  var BADGE_SHRINK_MAX = 0.22; // 배지 축소폭 상한 — 완료 비율이 낮을수록(할 일이 많을수록) 더 작게 움츠러든다
  var STEP_MS = 700; // 자동 루프에서 한 행이 열려 있는 시간 — 2초 측정 창 안에 세 행이 순서대로 열린다
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var list = document.getElementById('list');
  var rows = [0, 1, 2].map(function (i) {
    return {
      btn: document.getElementById('btn-' + i),
      badge: document.getElementById('badge-' + i),
      caret: document.getElementById('caret-' + i),
      sub: document.getElementById('sub-' + i),
      open: false
    };
  });

  function ratio(i) {
    var text = rows[i].badge.textContent; // "1/3" 꼴 — done/total 을 파싱해 축소폭을 계산한다
    var parts = text.split('/');
    var done = parseInt(parts[0], 10);
    var total = parseInt(parts[1], 10);
    return total > 0 ? done / total : 0;
  }

  function measure(sub) {
    // 실제 콘텐츠 높이를 재서 CSS 변수로 넘긴다 — 고정 px 가 아니라 サブタスク 개수만큼 자란다
    sub.style.setProperty('--h', sub.firstElementChild.scrollHeight + 'px');
  }

  function setOpen(i, open) {
    var r = rows[i];
    if (r.open === open) return;
    r.open = open;
    r.btn.setAttribute('aria-expanded', String(open));
    // 배지가 먼저 줄어든다 — 축소폭은 완료 비율로 계산(할 일이 남을수록 더 움츠러들어 눈에 띈다)
    var shrink = 1 - (1 - ratio(i)) * BADGE_SHRINK_MAX;
    r.badge.style.transform = open ? 'scale(' + shrink + ')' : 'scale(1)';
    r.caret.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
    if (open) measure(r.sub);
    r.sub.classList.toggle('open', open);
  }

  function human() {
    if (list.classList.contains('is-demo')) list.classList.remove('is-demo');
    window.clearInterval(loopTimer);
  }

  rows.forEach(function (r, i) {
    r.btn.addEventListener('click', function () {
      human();
      setOpen(i, !r.open);
    });
    r.btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); human(); setOpen(i, !r.open); }
    });
  });

  var cursor = 0;
  function autoStep() {
    if (reduce) return;
    rows.forEach(function (r, i) { if (i !== cursor) setOpen(i, false); });
    setOpen(cursor, true);
    cursor = (cursor + 1) % rows.length;
  }
  var loopTimer;
  if (!reduce) {
    autoStep();
    loopTimer = window.setInterval(autoStep, STEP_MS);
  }
})();
</script>
</body>
</html>
