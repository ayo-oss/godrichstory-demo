    <symbol id="ico-rocket" viewBox="0 0 256 256" fill="currentColor"><g><path d="m94.81 192l-29.45 22.24a8 8 0 0 1-12.81-4.51L40.19 154.1a8 8 0 0 1 1.66-6.86l30.31-36.33C71 134.25 76.7 161.43 94.81 192m119.34-44.76l-30.31-36.33c1.21 23.34-4.54 50.52-22.65 81.09l29.45 22.24a8 8 0 0 0 12.81-4.51l12.36-55.63a8 8 0 0 0-1.66-6.86" opacity=".2"/><path d="M152 224a8 8 0 0 1-8 8h-32a8 8 0 0 1 0-16h32a8 8 0 0 1 8 8m-24-112a12 12 0 1 0-12-12a12 12 0 0 0 12 12m95.62 43.83l-12.36 55.63a16 16 0 0 1-25.51 9.11L158.51 200h-61l-27.26 20.57a16 16 0 0 1-25.51-9.11l-12.36-55.63a16.09 16.09 0 0 1 3.32-13.71l28.56-34.26a123 123 0 0 1 8.57-36.67c12.9-32.34 36-52.63 45.37-59.85a16 16 0 0 1 19.6 0c9.34 7.22 32.47 27.51 45.37 59.85a123 123 0 0 1 8.57 36.67l28.56 34.26a16.09 16.09 0 0 1 3.32 13.71M99.43 184h57.14c21.12-37.54 25.07-73.48 11.74-106.88C156.55 47.64 134.49 29 128 24c-6.51 5-28.57 23.64-40.33 53.12c-13.31 33.4-9.36 69.34 11.76 106.88m-15 5.85q-16.15-29.35-19.6-57.69L48 152.36L60.36 208l.18-.13ZM208 152.36l-16.83-20.2q-3.42 28.28-19.56 57.69l23.85 18l.18.13Z"/></g></symbol>

<main class="stage">
<div class="df is-demo" id="df">
  <header class="df__hud">
    <p class="df__stat">
      <svg class="df__ico" aria-hidden="true"><use href="#ico-game"/></svg>
      <span class="df__label">スコア</span><b class="df__num" id="dfScore" aria-live="polite">0</b>
    </p>
    <p class="df__lives" id="dfLives" aria-label="残機 3">
      <i class="df__life is-on"><svg aria-hidden="true"><use href="#ico-heart"/></svg></i>
      <i class="df__life is-on"><svg aria-hidden="true"><use href="#ico-heart"/></svg></i>
      <i class="df__life is-on"><svg aria-hidden="true"><use href="#ico-heart"/></svg></i>
    </p>
    <p class="df__stat">
      <svg class="df__ico" aria-hidden="true"><use href="#ico-trophy"/></svg>
      <span class="df__label">最高記録</span><b class="df__num" id="dfBest">0</b>
    </p>
  </header>
  <div class="df__field" id="dfField" tabindex="0" role="application" aria-label="落下物を避けるプレイフィールド">
    <i class="df__rock df__rock--demo" style="--x0: 16%; --y0: 22%; --d0: 0ms"></i>
    <i class="df__rock df__rock--demo" style="--x0: 40%; --y0: 34%; --d0: -500ms"></i>
    <i class="df__rock df__rock--demo" style="--x0: 62%; --y0: 58%; --d0: -1000ms"></i>
    <i class="df__rock df__rock--demo" style="--x0: 84%; --y0: 70%; --d0: -1500ms"></i>
    <span class="df__player" id="dfPlayer">
      <svg class="df__rocket" aria-hidden="true"><use href="#ico-rocket"/></svg>
    </span>
    <p class="df__hint" id="dfHint">矢印キーまたは A と D で移動して落下物を避けよう</p>
    <div class="df__over" id="dfOver" hidden>
      <div class="df__overPanel">
        <p class="df__overTitle">ゲームオーバー</p>
        <p class="df__overScore"><b id="dfOverScore">0個避けました</b></p>
        <button class="df__restart" id="dfRestart" type="button">
          <svg class="df__ico" aria-hidden="true"><use href="#ico-restart"/></svg><span>もう一度</span>
        </button>
      </div>
    </div>
  </div>
</div>
</main>
<script>
// 떨어지는 것 피하기 — 장애물 낙하는 CSS animation(transform: translateY),
// 로켓 이동은 requestAnimationFrame 의 transform: translateX,
// 충돌은 getBoundingClientRect 겹침 검사. 목숨 3, 점수는 피한 장애물 수.
var BEST_KEY = 'p301-07-best';
var OVER_SCORE_TEXT = '{n}個避けました';
var LIVES_ARIA = '残機 {n}';

var root = document.getElementById('df');
var field = document.getElementById('dfField');
var player = document.getElementById('dfPlayer');
var scoreEl = document.getElementById('dfScore');
var bestEl = document.getElementById('dfBest');
var livesWrap = document.getElementById('dfLives');
var hintEl = document.getElementById('dfHint');
var overEl = document.getElementById('dfOver');
var overScoreEl = document.getElementById('dfOverScore');
var restartBtn = document.getElementById('dfRestart');

var PLAYER_SPEED = 250; // 초당 픽셀
var START_LIVES = 3;

var running = false;
var lives = START_LIVES;
var score = 0;
var best = loadBest();
var px = 0;        // 로켓 왼쪽 끝 위치
var pointerX = null; // 포인터 조작의 목표 x
var keys = { left: false, right: false };
var rocks = [];
var spawnTimer = 0;
var invulnUntil = 0;
var rafId = 0;
var lastT = 0;

function loadBest() {
  try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { return 0; }
}
function saveBest(n) {
  try { localStorage.setItem(BEST_KEY, String(n)); } catch (e) { /* 시크릿 창에서는 저장만 건너뛴다 */ }
}
function clampPx(v) {
  var w = field.clientWidth - player.offsetWidth;
  return Math.max(0, Math.min(w, v));
}
function centerPx() {
  return Math.max(0, (field.clientWidth - player.offsetWidth) / 2);
}
function paintLives() {
  var hearts = livesWrap.children;
  for (var i = 0; i < hearts.length; i++) { hearts[i].classList.toggle('is-on', i < lives); }
  livesWrap.setAttribute('aria-label', LIVES_ARIA.replace('{n}', String(lives)));
}
function paintHud() {
  scoreEl.textContent = String(score);
  bestEl.textContent = String(best);
}
function placePlayer() {
  px = clampPx(px);
  player.style.transform = 'translateX(' + Math.round(px) + 'px)';
}
function spawnRock() {
  if (!running) { return; }
  var rock = document.createElement('i');
  rock.className = 'df__rock';
  var size = 20 + Math.floor(Math.random() * 11);
  rock.style.width = size + 'px';
  rock.style.height = size + 'px';
  rock.style.left = (4 + Math.random() * 84) + '%';
  rock.style.setProperty('--t', Math.max(820, 1500 - score * 14) + 'ms');
  rock.addEventListener('animationend', function () { dodge(rock); });
  field.appendChild(rock);
  rocks.push(rock);
  spawnTimer = setTimeout(spawnRock, Math.max(320, 720 - score * 9));
}
function dodge(rock) {
  rock.remove();
  var i = rocks.indexOf(rock);
  if (i >= 0) { rocks.splice(i, 1); }
  if (!running) { return; }
  score += 1;
  if (score > best) { best = score; saveBest(best); }
  paintHud();
}
function hitRock(rock) {
  rock.remove();
  var i = rocks.indexOf(rock);
  if (i >= 0) { rocks.splice(i, 1); }
  lives -= 1;
  paintLives();
  invulnUntil = performance.now() + 900;
  player.classList.remove('is-hit');
  void player.offsetWidth; // 피격 깜빡임 애니메이션을 처음부터 もう一度 트는 재정렬 트릭
  player.classList.add('is-hit');
  if (lives <= 0) { gameOver(); }
}
function rectsOverlap(a, b) {
  return a.left < b.right - 2 && a.right > b.left + 2 && a.top < b.bottom - 4 && a.bottom > b.top + 4;
}
function tick(now) {
  if (!running) { return; }
  var dt = Math.min(64, now - lastT) / 1000;
  lastT = now;
  var dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir !== 0) {
    pointerX = null;
    px += dir * PLAYER_SPEED * dt;
  } else if (pointerX !== null) {
    var d = pointerX - px;
    var step = PLAYER_SPEED * dt;
    px += Math.abs(d) <= step ? d : Math.sign(d) * step;
  }
  placePlayer();
  if (now >= invulnUntil) {
    var pr = player.getBoundingClientRect();
    var hit = { left: pr.left + 5, right: pr.right - 5, top: pr.top + 6, bottom: pr.bottom - 4 };
    for (var i = rocks.length - 1; i >= 0; i--) {
      if (rectsOverlap(hit, rocks[i].getBoundingClientRect())) { hitRock(rocks[i]); break; }
    }
  }
  rafId = requestAnimationFrame(tick);
}
function startRun() {
  if (running) { return; }
  running = true;
  root.classList.remove('is-demo');
  var demoRocks = field.querySelectorAll('.df__rock--demo');
  for (var i = 0; i < demoRocks.length; i++) { demoRocks[i].remove(); }
  hintEl.hidden = true;
  overEl.hidden = true;
  lastT = performance.now();
  rafId = requestAnimationFrame(tick);
  spawnTimer = setTimeout(spawnRock, 350);
  field.focus({ preventScroll: true });
}
function gameOver() {
  running = false;
  clearTimeout(spawnTimer);
  cancelAnimationFrame(rafId);
  for (var i = 0; i < rocks.length; i++) { rocks[i].remove(); }
  rocks = [];
  saveBest(best);
  overScoreEl.textContent = OVER_SCORE_TEXT.replace('{n}', String(score));
  overEl.hidden = false;
  restartBtn.focus({ preventScroll: true });
}
restartBtn.addEventListener('click', function () {
  lives = START_LIVES;
  score = 0;
  paintLives();
  paintHud();
  px = centerPx();
  placePlayer();
  startRun();
});
window.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
    keys.left = true;
    e.preventDefault();
  } else if (k === 'ArrowRight' || k === 'd' || k === 'D') {
    keys.right = true;
    e.preventDefault();
  } else {
    return;
  }
  if (!running && overEl.hidden) { startRun(); }
});
window.addEventListener('keyup', function (e) {
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = false; }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = false; }
});
function pointerTarget(e) {
  var r = field.getBoundingClientRect();
  pointerX = clampPx(e.clientX - r.left - player.offsetWidth / 2);
}
field.addEventListener('pointerdown', function (e) {
  if (!overEl.hidden || running) { return; }
  startRun();
  pointerTarget(e);
});
field.addEventListener('pointermove', function (e) {
  if (!running) { return; }
  pointerTarget(e);
});
window.addEventListener('resize', function () {
  px = clampPx(px);
  placePlayer();
});
paintLives();
paintHud();
px = centerPx();
placePlayer();
player.style.setProperty('--cx', Math.round(centerPx()) + 'px');
</script>
</body>
</html>
