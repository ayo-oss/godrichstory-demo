<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시선 피하기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="gde-eye-ico" viewBox="0 0 256 256" fill="currentColor"><g><path d="M128 56c-80 0-112 72-112 72s32 72 112 72s112-72 112-72s-32-72-112-72m0 112a40 40 0 1 1 40-40a40 40 0 0 1-40 40" opacity=".2"/><path d="M247.31 124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57 61.26 162.88 48 128 48S61.43 61.26 36.34 86.35C17.51 105.18 9 124 8.69 124.76a8 8 0 0 0 0 6.5c.35.79 8.82 19.57 27.65 38.4C61.43 194.74 93.12 208 128 208s66.57-13.26 91.66-38.34c18.83-18.83 27.3-37.61 27.65-38.4a8 8 0 0 0 0-6.5M128 192c-30.78 0-57.67-11.19-79.93-33.25A133.5 133.5 0 0 1 25 128a133.3 133.3 0 0 1 23.07-30.75C70.33 75.19 97.22 64 128 64s57.67 11.19 79.93 33.25A133.5 133.5 0 0 1 231.05 128c-7.21 13.46-38.62 64-103.05 64m0-112a48 48 0 1 0 48 48a48.05 48.05 0 0 0-48-48m0 80a32 32 0 1 1 32-32a32 32 0 0 1-32 32"/></g></symbol>
    <symbol id="gde-cursor-ico" viewBox="0 0 256 256" fill="currentColor"><g><path d="M213.66 201L201 213.66a8 8 0 0 1-11.31 0l-51.31-51.31a8 8 0 0 0-13 2.46l-17.82 46.41a8 8 0 0 1-14.85-.71L40.41 50.44a8 8 0 0 1 10-10l160.1 52.24a8 8 0 0 1 .71 14.85l-46.41 17.82a8 8 0 0 0-2.46 13l51.31 51.31a8 8 0 0 1 0 11.34" opacity=".2"/><path d="M168 132.69L214.08 115l.33-.13a16 16 0 0 0-1.41-29.8L52.92 32.8A15.95 15.95 0 0 0 32.8 52.92L85.07 213a15.82 15.82 0 0 0 14.41 11h.78a15.84 15.84 0 0 0 14.61-9.59l.13-.33L132.69 168L184 219.31a16 16 0 0 0 22.63 0l12.68-12.68a16 16 0 0 0 0-22.63ZM195.31 208L144 156.69a16 16 0 0 0-26 4.93c0 .11-.09.22-.13.32l-17.65 46L48 48l159.85 52.2l-45.95 17.64l-.32.13a16 16 0 0 0-4.93 26L208 195.31Z"/></g></symbol>
    <symbol id="gde-trophy-ico" viewBox="0 0 256 256" fill="currentColor"><g><path d="M200 48v63.1c0 39.7-31.75 72.6-71.45 72.9A72 72 0 0 1 56 112V48Z" opacity=".2"/><path d="M232 64h-24V48a8 8 0 0 0-8-8H56a8 8 0 0 0-8 8v16H24A16 16 0 0 0 8 80v16a40 40 0 0 0 40 40h3.65A80.13 80.13 0 0 0 120 191.61V216H96a8 8 0 0 0 0 16h64a8 8 0 0 0 0-16h-24v-24.42c31.94-3.23 58.44-25.64 68.08-55.58H208a40 40 0 0 0 40-40V80a16 16 0 0 0-16-16M48 120a24 24 0 0 1-24-24V80h24v32q0 4 .39 8Zm144-8.9c0 35.52-29 64.64-64 64.9a64 64 0 0 1-64-64V56h128ZM232 96a24 24 0 0 1-24 24h-.5a82 82 0 0 0 .5-8.9V80h24Z"/></g></symbol>
    <symbol id="gde-restart-ico" viewBox="0 0 256 256" fill="currentColor"><g><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M240 56v48a8 8 0 0 1-8 8h-48a8 8 0 0 1 0-16h27.4l-26.59-24.36l-.25-.24a80 80 0 1 0-1.67 114.78a8 8 0 0 1 11 11.63A95.44 95.44 0 0 1 128 224h-1.32a96 96 0 1 1 69.07-164L224 85.8V56a8 8 0 1 1 16 0"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="gde is-demo" id="gde">
  <header class="gde__bar">
    <p class="gde__title">
      <svg class="gde__ico" aria-hidden="true"><use href="#gde-eye-ico"/></svg>
      <span>시선 피하기</span>
    </p>
    <p class="gde__pill"><span class="gde__label">버틴 시간</span><b class="gde__num" id="scoreNum">0.0초</b></p>
    <p class="gde__pill gde__pill--best">
      <svg class="gde__ico gde__ico--sm" aria-hidden="true"><use href="#gde-trophy-ico"/></svg>
      <b class="gde__num" id="bestNum">0.0초</b>
    </p>
    <button class="gde__btn" id="restartBtn" type="button" aria-label="다시 시작">
      <svg class="gde__ico gde__ico--sm" aria-hidden="true"><use href="#gde-restart-ico"/></svg>
    </button>
  </header>

  <div class="gde__arena" id="arena">
    <p class="gde__dotsWrap"><span class="gde__dotsLabel">벌점</span><span class="gde__dots"><i class="gde__dot" id="dot0"></i><i class="gde__dot" id="dot1"></i><i class="gde__dot" id="dot2"></i></span></p>
    <p class="gde__warn" id="warn">눈이 가깝다</p>

    <div class="gde__eyeWrap" id="eyeWrap">
      <span class="gde__ring" aria-hidden="true"></span>
      <svg class="gde__eye" viewBox="0 0 120 120" aria-hidden="true">
        <ellipse class="gde__ball" cx="60" cy="60" rx="54" ry="36"></ellipse>
        <circle class="gde__iris" cx="60" cy="60" r="21"></circle>
        <circle class="gde__pupil" cx="60" cy="60" r="10"></circle>
        <circle class="gde__glint" cx="67" cy="53" r="5"></circle>
      </svg>
    </div>

    <div class="gde__targetWrap" id="targetWrap">
      <span class="gde__halo" aria-hidden="true"></span>
      <svg class="gde__cursor" aria-hidden="true"><use href="#gde-cursor-ico"/></svg>
    </div>

    <div class="gde__over" id="over" hidden>
      <div class="gde__overPanel">
        <p class="gde__overTitle">눈에게 잡혔다</p>
        <p class="gde__overLine" id="overLine">버틴 시간 0.0초</p>
        <button class="gde__again" id="againBtn" type="button">
          <svg class="gde__ico gde__ico--sm" aria-hidden="true"><use href="#gde-restart-ico"/></svg>
          <span>다시 시작</span>
        </button>
      </div>
    </div>
  </div>

  <p class="gde__hint">마우스를 움직여 눈을 피하세요 · 방향키로도 표적을 움직일 수 있어요 · 벌점이 3개가 되면 끝입니다</p>
</div>
</main>
<script>
var BEST_KEY = 'p301-04-best';
var TIME_FMT = '{s}초';
var CAUGHT_LINE = '버틴 시간 {s}초';
var WARN_TEXT = '눈이 가깝다';
// 눈이 표적을 쫓는 보간 계수 — 프레임당 0.055 로 부드럽게 따라온다 (너무 빠르면 피할 수 없다)
// reduce 에서는 보간을 1로 올려 눈이 즉시 따라오게 한다 (transition 을 쓰지 않는 이유와 같다)
var REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var LERP = REDUCE ? 1 : 0.055;
// 눈 중심과 표적 중심이 이 거리(px) 안이면 위험 — 벌점이 쌓인다
var DANGER_DIST = 60;
// 위험 상태가 이 시간(ms) 만큼 이어지면 벌점 1개
var DANGER_MS = 450;
var KEY_STEP = 26;

var root = document.getElementById('gde');
var arena = document.getElementById('arena');
var eyeWrap = document.getElementById('eyeWrap');
var targetWrap = document.getElementById('targetWrap');
var scoreNum = document.getElementById('scoreNum');
var bestNum = document.getElementById('bestNum');
var warn = document.getElementById('warn');
var over = document.getElementById('over');
var overLine = document.getElementById('overLine');
var dots = [document.getElementById('dot0'), document.getElementById('dot1'), document.getElementById('dot2')];

var running = false;
var dead = false;
var startT = 0;
var lastNow = 0;
var penalty = 0;
var dangerAcc = 0;
var eyePos = { x: 0, y: 0 };
var targetPos = { x: 0, y: 0 };
var best = 0;

function fmtTime(sec) { return TIME_FMT.replace('{s}', sec.toFixed(1)); }

function loadBest() {
  try { best = Number(window.localStorage.getItem(BEST_KEY)) || 0; } catch (e) { best = 0; }
  bestNum.textContent = fmtTime(best);
}
function saveBest(sec) {
  if (sec <= best) { return; }
  best = sec;
  try { window.localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* 저장이 막힌 창에서는 넘어간다 */ }
  bestNum.textContent = fmtTime(best);
}

function arenaRect() { return arena.getBoundingClientRect(); }
function placeTarget(x, y) {
  var r = arenaRect();
  targetPos.x = Math.max(8, Math.min(r.width - 8, x));
  targetPos.y = Math.max(8, Math.min(r.height - 8, y));
}
function centerOf(el) {
  var r = el.getBoundingClientRect();
  var a = arenaRect();
  return { x: r.left - a.left + r.width / 2, y: r.top - a.top + r.height / 2 };
}
// 눈과 표적은 translate3d 로만 움직인다 — left/top 을 바꾸면 매 프레임 배치이 다시 계산된다
function paint() {
  eyeWrap.style.transform = 'translate3d(' + (eyePos.x - eyeWrap.offsetWidth / 2) + 'px,' + (eyePos.y - eyeWrap.offsetHeight / 2) + 'px,0)';
  targetWrap.style.transform = 'translate3d(' + (targetPos.x - targetWrap.offsetWidth / 2) + 'px,' + (targetPos.y - targetWrap.offsetHeight / 2) + 'px,0)';
}

function resetGame(keepInput) {
  running = false;
  dead = false;
  penalty = 0;
  dangerAcc = 0;
  for (var i = 0; i < dots.length; i++) { dots[i].className = 'gde__dot'; }
  root.classList.remove('is-danger');
  over.hidden = true;
  scoreNum.textContent = fmtTime(0);
  var r = arenaRect();
  eyePos = { x: r.width / 2, y: r.height / 2 };
  if (!keepInput) { placeTarget(r.width * 0.74, r.height * 0.5); }
  paint();
}

function begin() {
  if (running || dead) { return; }
  root.classList.remove('is-demo');
  // 미리보기 키프레임이 그려 놓은 자리에서 시작한다 — 중앙으로 튀지 않게 현재 위치를 읽어 온다
  eyePos = centerOf(eyeWrap);
  penalty = 0;
  dangerAcc = 0;
  over.hidden = true;
  for (var i = 0; i < dots.length; i++) { dots[i].className = 'gde__dot'; }
  running = true;
  startT = performance.now();
  lastNow = startT;
}

function addPenalty() {
  penalty += 1;
  if (dots[penalty - 1]) { dots[penalty - 1].className = 'gde__dot is-hit'; }
  if (penalty >= 3) { endGame(); }
}

function endGame() {
  running = false;
  dead = true;
  var sec = (performance.now() - startT) / 1000;
  scoreNum.textContent = fmtTime(sec);
  overLine.textContent = CAUGHT_LINE.replace('{s}', sec.toFixed(1));
  over.hidden = false;
  saveBest(sec);
}

function tick(now) {
  var dt = now - lastNow;
  lastNow = now;
  var demo = root.classList.contains('is-demo');
  if (!demo) {
    // lerp 추적 — 눈은 표적을 향해 매 프레임 조금씩 다가온다
    eyePos.x += (targetPos.x - eyePos.x) * LERP;
    eyePos.y += (targetPos.y - eyePos.y) * LERP;
    paint();
    var ex = eyePos.x, ey = eyePos.y;
    var near = Math.hypot(targetPos.x - ex, targetPos.y - ey) < DANGER_DIST;
    root.classList.toggle('is-near', near);
    if (running) {
      var sec = (now - startT) / 1000;
      scoreNum.textContent = fmtTime(sec);
      if (near) {
        dangerAcc += dt;
        if (dangerAcc >= DANGER_MS) { dangerAcc = 0; addPenalty(); }
      } else {
        dangerAcc = Math.max(0, dangerAcc - dt * 2);
      }
    }
  }
  window.requestAnimationFrame(tick);
}

arena.addEventListener('pointermove', function (e) {
  var r = arenaRect();
  placeTarget(e.clientX - r.left, e.clientY - r.top);
  begin();
});
window.addEventListener('keydown', function (e) {
  var k = e.key;
  var dx = 0, dy = 0;
  if (k === 'ArrowLeft') { dx = -KEY_STEP; }
  else if (k === 'ArrowRight') { dx = KEY_STEP; }
  else if (k === 'ArrowUp') { dy = -KEY_STEP; }
  else if (k === 'ArrowDown') { dy = KEY_STEP; }
  else { return; }
  e.preventDefault();
  if (!running) { begin(); }
  placeTarget(targetPos.x + dx, targetPos.y + dy);
});
document.getElementById('restartBtn').addEventListener('click', function () { root.classList.remove('is-demo'); resetGame(false); });
document.getElementById('againBtn').addEventListener('click', function () { resetGame(false); });

warn.textContent = WARN_TEXT;
loadBest();
resetGame(false);
window.requestAnimationFrame(tick);
</script>
</body>
</html>
