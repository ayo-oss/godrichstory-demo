<script>
// 짝 맞추기 — 카드 12장(6쌍)은 HTML 에 정적으로 있고 JS 가 불러오자마자 자리를 섞는다.
// 상태기계: 첫 장 오픈 → 둘째 장 오픈 → 같으면 매치 고정, 다르면 700ms 뒤 복귀.
// 최고 기록은 최소 시도 수(p301-02-best)다.
(function () {
  var KEY = 'p301-02-best';
  var CLEAR_TEXT = '클리어! 시도 {n}회 · {t}초';
  var NEW_BEST = '최고 기록 갱신!';
  var root = document.getElementById('mm');
  var grid = document.getElementById('mmGrid');
  var triesEl = document.getElementById('mmTries');
  var pairsEl = document.getElementById('mmPairs');
  var bestEl = document.getElementById('mmBest');
  var clearEl = document.getElementById('mmClear');
  var clearMsgEl = document.getElementById('mmClearMsg');
  var first = null, lock = false, tries = 0, left = 6, startAt = 0;

  function loadBest() {
    try { return Number(window.localStorage.getItem(KEY)) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { window.localStorage.setItem(KEY, String(v)); } catch (e) { /* 저장소가 막힌 창은 건너뛴다 */ }
  }
  var best = loadBest();
  if (best) { bestEl.textContent = String(best); }

  function shuffle() {
    var cards = [].slice.call(grid.querySelectorAll('.mm__card'));
    for (var i = cards.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = cards[i]; cards[i] = cards[j]; cards[j] = t;
    }
    for (var k = 0; k < cards.length; k++) { grid.appendChild(cards[k]); }
  }
  function reset() {
    first = null; lock = false; tries = 0; left = 6; startAt = 0;
    triesEl.textContent = '0';
    pairsEl.textContent = '6';
    clearEl.hidden = true;
    var cards = grid.querySelectorAll('.mm__card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.remove('is-open', 'is-matched');
      cards[i].disabled = false;
      cards[i].setAttribute('aria-pressed', 'false');
    }
    shuffle();
  }
  function finish() {
    var t = Math.round((Date.now() - startAt) / 100) / 10;   // 초 단위 한 자리
    var msg = CLEAR_TEXT.replace('{n}', String(tries)).replace('{t}', String(t));
    if (!best || tries < best) {
      best = tries; saveBest(best); bestEl.textContent = String(best);
      msg = msg + ' ' + NEW_BEST;
    }
    clearMsgEl.textContent = msg;
    clearEl.hidden = false;
  }
  grid.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.mm__card') : null;
    if (!btn || btn.disabled || lock || btn.classList.contains('is-open')) { return; }
    root.classList.remove('is-demo');
    if (!startAt) { startAt = Date.now(); }
    btn.classList.add('is-open');
    btn.setAttribute('aria-pressed', 'true');
    if (!first) { first = btn; return; }
    var a = first; first = null; lock = true;
    tries++; triesEl.textContent = String(tries);
    if (a.getAttribute('data-face') === btn.getAttribute('data-face')) {
      setTimeout(function () {
        a.classList.add('is-matched'); btn.classList.add('is-matched');
        a.disabled = true; btn.disabled = true;
        left--; pairsEl.textContent = String(left);
        lock = false;
        if (left === 0) { finish(); }
      }, 350);
    } else {
      setTimeout(function () {
        a.classList.remove('is-open'); btn.classList.remove('is-open');
        a.setAttribute('aria-pressed', 'false'); btn.setAttribute('aria-pressed', 'false');
        lock = false;
      }, 700);
    }
  });
  document.getElementById('mmRestart').addEventListener('click', function () {
    root.classList.remove('is-demo');
    reset();
  });
  shuffle();
})();
</script>
