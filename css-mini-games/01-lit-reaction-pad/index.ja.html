<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点灯パッドタップ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rp is-demo" id="rp">
  <header class="rp__bar">
    <p class="rp__title">点灯パッドタップ</p>
    <button class="rp__restart" id="rpRestart" type="button" aria-label="もう一度">
      <svg viewBox="0 0 256 256" aria-hidden="true" focusable="false"><g fill="currentColor"><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M240 56v48a8 8 0 0 1-8 8h-48a8 8 0 0 1 0-16h27.4l-26.59-24.36l-.25-.24a80 80 0 1 0-1.67 114.78a8 8 0 0 1 11 11.63A95.44 95.44 0 0 1 128 224h-1.32a96 96 0 1 1 69.07-164L224 85.8V56a8 8 0 1 1 16 0"/></g></svg>
    </button>
  </header>
  <p class="rp__hint">点いているパッドだけ押せます。スペースキーでも押せます</p>
  <div class="rp__board" id="rpBoard">
    <input class="rp__check" type="checkbox" id="rpP1" aria-label="パッド1">
    <input class="rp__check" type="checkbox" id="rpP2" aria-label="パッド2">
    <input class="rp__check" type="checkbox" id="rpP3" aria-label="パッド3">
    <input class="rp__check" type="checkbox" id="rpP4" aria-label="パッド4">
    <input class="rp__check" type="checkbox" id="rpP5" aria-label="パッド5">
    <input class="rp__check" type="checkbox" id="rpP6" aria-label="パッド6">
    <input class="rp__check" type="checkbox" id="rpP7" aria-label="パッド7">
    <input class="rp__check" type="checkbox" id="rpP8" aria-label="パッド8">
    <input class="rp__check" type="checkbox" id="rpP9" aria-label="パッド9">
    <div class="rp__grid">
      <label class="rp__pad" for="rpP1" style="--i: 0"><span class="rp__no">1</span></label>
      <label class="rp__pad" for="rpP2" style="--i: 1"><span class="rp__no">2</span></label>
      <label class="rp__pad" for="rpP3" style="--i: 2"><span class="rp__no">3</span></label>
      <label class="rp__pad" for="rpP4" style="--i: 3"><span class="rp__no">4</span></label>
      <label class="rp__pad" for="rpP5" style="--i: 4"><span class="rp__no">5</span></label>
      <label class="rp__pad" for="rpP6" style="--i: 5"><span class="rp__no">6</span></label>
      <label class="rp__pad" for="rpP7" style="--i: 6"><span class="rp__no">7</span></label>
      <label class="rp__pad" for="rpP8" style="--i: 7"><span class="rp__no">8</span></label>
      <label class="rp__pad" for="rpP9" style="--i: 8"><span class="rp__no">9</span></label>
    </div>
    <p class="rp__done" role="status"><b>9枚のパッドクリア!</b></p>
  </div>
  <p class="rp__tally"><span class="rp__tallyLabel">押した数</span> <b class="rp__count"></b></p>
</div>
</main>
<script>
// 게임 판정 자체는 전부 CSS(:checked 연쇄 + counter)다. JS 는 두 가지 보조만 한다 —
// 재시작(체크 해제)과 키보드 초점이 켜진 패드를 따라가는 일.
(function () {
  var root = document.getElementById('rp');
  var checks = [].slice.call(document.querySelectorAll('.rp__check'));
  var count = checks.length;
  function litIndex() {
    for (var i = 0; i < count; i++) { if (!checks[i].checked) { return i; } }
    return -1;
  }
  function sync(focusLit) {
    var k = litIndex();
    for (var i = 0; i < count; i++) { checks[i].tabIndex = (k === i || k < 0) ? 0 : -1; }
    if (focusLit && k >= 0) { checks[k].focus({ preventScroll: true }); }
  }
  root.addEventListener('change', function () {
    root.classList.remove('is-demo');
    sync(true);
  });
  document.getElementById('rpRestart').addEventListener('click', function () {
    for (var i = 0; i < count; i++) { checks[i].checked = false; }
    root.classList.remove('is-demo');
    sync(true);
  });
  sync(false);
})();
</script>
</body>
</html>
