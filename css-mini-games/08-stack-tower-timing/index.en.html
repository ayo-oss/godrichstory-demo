<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack tower timing — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-cube" viewBox="0 0 256 256" fill="currentColor"><g><path d="M128 129.09V232a8 8 0 0 1-3.84-1l-88-48.16a8 8 0 0 1-4.16-7V80.2a8 8 0 0 1 .7-3.27Z" opacity=".2"/><path d="m223.68 66.15l-88-48.15a15.88 15.88 0 0 0-15.36 0l-88 48.17a16 16 0 0 0-8.32 14v95.64a16 16 0 0 0 8.32 14l88 48.17a15.88 15.88 0 0 0 15.36 0l88-48.17a16 16 0 0 0 8.32-14V80.18a16 16 0 0 0-8.32-14.03M128 32l80.34 44L128 120L47.66 76ZM40 90l80 43.78v85.79l-80-43.75Zm96 129.57v-85.75L216 90v85.78Z"/></g></symbol>
    <symbol id="ico-trophy" viewBox="0 0 256 256" fill="currentColor"><g><path d="M200 48v63.1c0 39.7-31.75 72.6-71.45 72.9A72 72 0 0 1 56 112V48Z" opacity=".2"/><path d="M232 64h-24V48a8 8 0 0 0-8-8H56a8 8 0 0 0-8 8v16H24A16 16 0 0 0 8 80v16a40 40 0 0 0 40 40h3.65A80.13 80.13 0 0 0 120 191.61V216H96a8 8 0 0 0 0 16h64a8 8 0 0 0 0-16h-24v-24.42c31.94-3.23 58.44-25.64 68.08-55.58H208a40 40 0 0 0 40-40V80a16 16 0 0 0-16-16M48 120a24 24 0 0 1-24-24V80h24v32q0 4 .39 8Zm144-8.9c0 35.52-29 64.64-64 64.9a64 64 0 0 1-64-64V56h128ZM232 96a24 24 0 0 1-24 24h-.5a82 82 0 0 0 .5-8.9V80h24Z"/></g></symbol>
    <symbol id="ico-restart" viewBox="0 0 256 256" fill="currentColor"><g><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M240 56v48a8 8 0 0 1-8 8h-48a8 8 0 0 1 0-16h27.4l-26.59-24.36l-.25-.24a80 80 0 1 0-1.67 114.78a8 8 0 0 1 11 11.63A95.44 95.44 0 0 1 128 224h-1.32a96 96 0 1 1 69.07-164L224 85.8V56a8 8 0 1 1 16 0"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="st is-demo" id="st">
  <header class="st__hud">
    <p class="st__stat">
      <svg class="st__ico" aria-hidden="true"><use href="#ico-cube"/></svg>
      <span class="st__label">Height</span><b class="st__num" id="stHeight" aria-live="polite">0</b>
    </p>
    <p class="st__stat">
      <span class="st__label">Combo</span><b class="st__num" id="stCombo">0</b>
    </p>
    <p class="st__stat">
      <svg class="st__ico" aria-hidden="true"><use href="#ico-trophy"/></svg>
      <span class="st__label">Best</span><b class="st__num" id="stBest">0</b>
    </p>
  </header>
  <div class="st__field" id="stField" tabindex="0" role="application" aria-label="Stack tower playfield. Stop the moving block with space or a click to stack it">
    <div class="st__tower" id="stTower">
      <div class="st__row st__row--base" id="stBase"></div>
      <div class="st__mover" id="stMover"></div>
      <i class="st__chip" id="stChip" aria-hidden="true"></i>
      <p class="st__flash" id="stFlash">Perfect!</p>
    </div>
    <p class="st__hint" id="stHint">Press space or click to stop and stack</p>
    <div class="st__over" id="stOver" hidden>
      <div class="st__overPanel">
        <p class="st__overTitle">Game over</p>
        <p class="st__overScore"><b id="stOverHeight">Stacked 0 floors</b></p>
        <button class="st__restart" id="stRestart" type="button">
          <svg class="st__ico" aria-hidden="true"><use href="#ico-restart"/></svg><span>Restart</span>
        </button>
      </div>
    </div>
  </div>
</div>
</main>
<script>
// 탑 쌓기 타이밍 — 좌우로 왕복하는 블록(requestAnimationFrame)을 스페이스·클릭으로 멈춰 쌓는다.
// 아래 칸과 겹친 폭만 남고 삐져나온 부분은 잘려 떨어진다. 블록 폭은 원소 하나를 scaleX 로
// 줄여 표현한다(변하는 건 transform 뿐). 4px 이내 일치는 Combo + 폭 원상복구 보너스.
// 쌓인 높이가 Score, 한 번도 안 겹치면 판이 끝난다.
var BEST_KEY = 'p301-08-best';
var OVER_HEIGHT_TEXT = 'Stacked {n} floors';
var PERFECT_PX = 4;

var BASE_W = 128; // 기준 블록 폭 (CSS .st__row width 와 같은 값)
var HALF = BASE_W / 2; // lx(왼쪽 오프셋)와 시각 좌표(탑 중심 0)를 잇는 보정값
var STRIDE = 22;  // 칸 한 단의 세로 간격 (Height 18 + 틈 4)
var MARGIN = 20;  // 꼭대기 칸 양옆으로 완전히 벗어나는 여유 — 이 구간에서 놓으면 미스

var root = document.getElementById('st');
var field = document.getElementById('stField');
var tower = document.getElementById('stTower');
var moverEl = document.getElementById('stMover');
var chipEl = document.getElementById('stChip');
var flashEl = document.getElementById('stFlash');
var heightEl = document.getElementById('stHeight');
var comboEl = document.getElementById('stCombo');
var bestEl = document.getElementById('stBest');
var hintEl = document.getElementById('stHint');
var overEl = document.getElementById('stOver');
var overHeightEl = document.getElementById('stOverHeight');
var restartBtn = document.getElementById('stRestart');

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var rows = [{ lx: 0, w: BASE_W }]; // lx: 기준 블록 왼쪽을 0 으로 둔 상대 오프셋
var mover = { lx: -36, w: BASE_W, dir: 1, speed: 170 };
var combo = 0;
var height = 0;
var best = loadBest();
var running = false;
var rafId = 0;
var lastT = 0;
var chipTimer = 0;

function loadBest() {
  try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { return 0; }
}
function saveBest(n) {
  try { localStorage.setItem(BEST_KEY, String(n)); } catch (e) { /* 시크릿 창에서는 저장만 건너뛴다 */ }
}
// 왕복 범위는 꼭대기 칸 기준으로 양쪽 대칭: 상자가 꼭대기 칸과 MARGIN px 만큼 완전히 어긋난 양끝까지
// 왕복한다(시각 좌표로 왼쪽 끝 t.lx-HALF-w-MARGIN, 오른쪽 끝 t.lx-HALF+t.w+MARGIN). 그래서 첫 칸(완전 폭)도
// 양끝에서 겹침이 0 이 되고, 좌우 미스 구간의 폭은 언제나 MARGIN 으로 같다.
function minLx() { var t = topRow(); return t.lx - mover.w - MARGIN; }
function maxLx() { var t = topRow(); return t.lx + t.w + MARGIN; }
// window.top 은 브라우저가 못 바꾸는 전역 이름이라 top 이라고 지으면 스크립트 전체가 죽는다 — topRow 로
function topRow() { return rows[rows.length - 1]; }
function paintHud() {
  heightEl.textContent = String(height);
  comboEl.textContent = String(combo);
  bestEl.textContent = String(best);
}
function setGeom(el, lx, w, by) {
  el.style.setProperty('--lx', lx + 'px');
  el.style.setProperty('--sx', String(w / BASE_W));
  el.style.setProperty('--by', by + 'px');
}
function paintMover() { setGeom(moverEl, mover.lx, mover.w, rows.length * STRIDE); }
function addRowEl(row) {
  var el = document.createElement('div');
  el.className = 'st__row is-new';
  setGeom(el, row.lx, row.w, (rows.length - 1) * STRIDE);
  el.addEventListener('animationend', function () { el.classList.remove('is-new'); });
  tower.appendChild(el);
}
function camera() {
  // 탑 꼭대기가 놀이판 안에 보이게 탑 전체를 transform 으로 내린다 (레이아웃 재계산 없음)
  var need = (rows.length - 1) * STRIDE + 18 + 64;
  var shift = Math.max(0, need - field.clientHeight);
  tower.style.transform = 'translateY(' + Math.round(shift) + 'px)';
}
function dropChip(lx, w, by) {
  setGeom(chipEl, lx, w, by);
  // 잘린 조각은 transition 으로 제자리에서 떨어진다: Start 상태(is-drop)를 화면에 확정한 뒤
  // 끝 상태(is-fall)를 얹으면 브라우저가 그 사이를 보간한다. reduce 에서는 transition 이 꺼져 즉시 사라진다.
  chipEl.classList.remove('is-drop', 'is-fall');
  void chipEl.offsetWidth; // transition 을 첫 프레임부터 트는 재정렬 트릭
  chipEl.classList.add('is-drop');
  void chipEl.offsetWidth;
  chipEl.classList.add('is-fall');
  clearTimeout(chipTimer);
  chipTimer = setTimeout(function () { chipEl.classList.remove('is-drop', 'is-fall'); }, 720);
}
function showFlash() {
  flashEl.style.setProperty('--fy', (rows.length * STRIDE + 6) + 'px');
  flashEl.classList.remove('is-show');
  void flashEl.offsetWidth;
  flashEl.classList.add('is-show');
  flashEl.addEventListener('animationend', function once() {
    flashEl.classList.remove('is-show');
    flashEl.removeEventListener('animationend', once);
  });
}
function nextMover() {
  var t = topRow();
  mover.w = t.w;
  mover.speed = Math.min(330, 170 + rows.length * 9);
  mover.dir = rows.length % 2 === 0 ? 1 : -1;
  mover.lx = mover.dir === 1 ? minLx() : maxLx();
  paintMover();
}
function place() {
  var t = topRow();
  var tl = t.lx - HALF, tr = tl + t.w;
  var ml = mover.lx - HALF, mr = ml + mover.w;
  var ovL = Math.max(ml, tl), ovR = Math.min(mr, tr);
  var ovW = ovR - ovL;
  if (ovW <= 0) { missPlace(ml, mr); return; }
  if (Math.abs(ml - tl) <= PERFECT_PX && Math.abs(mr - tr) <= PERFECT_PX) {
    combo += 1;
    // 완벽 일치 보너스: 폭을 기준 폭까지 되살리되, 칸은 기준 블록 범위 안에 머문다.
    var c = t.lx - HALF + t.w / 2; // 꼭대기 칸 중심(시각 좌표)
    var lo = Math.max(c - HALF, -HALF);
    var hi = Math.min(c + HALF, HALF);
    rows.push({ lx: Math.round(lo + HALF), w: Math.round(hi - lo) });
    showFlash();
  } else {
    combo = 0;
    rows.push({ lx: ovL + HALF, w: ovW });
    if (ml < ovL) { dropChip(ml + HALF, ovL - ml, (rows.length - 1) * STRIDE); }
    else if (mr > ovR) { dropChip(ovR + HALF, mr - ovR, (rows.length - 1) * STRIDE); }
  }
  addRowEl(rows[rows.length - 1]);
  height = rows.length - 1;
  if (height > best) { best = height; saveBest(best); }
  paintHud();
  camera();
  nextMover();
}
function missPlace(ml, mr) {
  dropChip(ml + HALF, mr - ml, rows.length * STRIDE);
  running = false;
  cancelAnimationFrame(rafId);
  moverEl.hidden = true;
  hintEl.hidden = true;
  saveBest(best);
  overHeightEl.textContent = OVER_HEIGHT_TEXT.replace('{n}', String(height));
  overEl.hidden = false;
  restartBtn.focus({ preventScroll: true });
}
function tick(now) {
  if (!running) { return; }
  var dt = Math.min(64, now - lastT) / 1000;
  lastT = now;
  mover.lx += mover.dir * mover.speed * dt;
  if (mover.lx >= maxLx()) { mover.lx = maxLx(); mover.dir = -1; }
  if (mover.lx <= minLx()) { mover.lx = minLx(); mover.dir = 1; }
  paintMover();
  rafId = requestAnimationFrame(tick);
}
function startRun() {
  if (running) { return; }
  running = true;
  root.classList.remove('is-demo');
  hintEl.hidden = true;
  overEl.hidden = true;
  moverEl.hidden = false;
  nextMover();
  if (!reduce) {
    lastT = performance.now();
    rafId = requestAnimationFrame(tick);
  }
  field.focus({ preventScroll: true });
}
function act() {
  if (!running) { startRun(); return; }
  if (reduce) {
    // 왕복 대신 놓을 자리를 입력마다 무작위로 정한다(reduced-motion) — 다만 겹침이 절반 이상
    // 보장되는 안쪽 범위만 쓴다. 실수로 판이 바로 끝나지 않게 하는 완화다.
    var t = topRow();
    mover.lx = t.lx + (Math.random() - 0.5) * t.w;
    paintMover();
  }
  place();
}
restartBtn.addEventListener('click', function () {
  var list = tower.querySelectorAll('.st__row');
  for (var i = 0; i < list.length; i++) {
    if (list[i].id !== 'stBase') { list[i].remove(); }
  }
  chipEl.classList.remove('is-drop', 'is-fall');
  clearTimeout(chipTimer);
  rows = [{ lx: 0, w: BASE_W }];
  combo = 0;
  height = 0;
  paintHud();
  tower.style.transform = 'translateY(0px)';
  startRun();
});
window.addEventListener('keydown', function (e) {
  if (e.key !== ' ' && e.code !== 'Space') { return; }
  if (e.target === restartBtn) { return; } // 버튼 포커스 중에는 기본 클릭에 맡긴다
  if (!overEl.hidden) { return; }
  e.preventDefault();
  act();
});
field.addEventListener('pointerdown', function (e) {
  if (!overEl.hidden || overEl.contains(e.target)) { return; }
  act();
});
paintHud();
paintMover();
camera();
</script>
</body>
</html>
