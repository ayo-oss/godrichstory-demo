      <span class="wg__window"><span class="wg__mole"><svg viewBox="0 0 256 256" aria-hidden="true" focusable="false"><g fill="currentColor"><path d="M208 188a44 44 0 0 1-80 25.3a44 44 0 1 1-63.71-59.48a64 64 0 0 1 127.42 0A43.9 43.9 0 0 1 208 188" opacity=".2"/><path d="M112 164a12 12 0 1 1-12-12a12 12 0 0 1 12 12m44-12a12 12 0 1 0 12 12a12 12 0 0 0-12-12m60 36a52 52 0 0 1-88 37.52a52 52 0 1 1-71.28-75.72A71.6 71.6 0 0 1 63 129C44 91.1 32.53 40.76 45.64 19.08A22 22 0 0 1 65.06 8c14.12 0 26 11.89 36.44 36.36c6.22 14.62 10.85 31.32 14 44.74a71.8 71.8 0 0 1 25 0c3.13-13.42 7.76-30.12 14-44.74C164.9 19.89 176.82 8 190.94 8a22 22 0 0 1 19.42 11.08C223.47 40.76 212 91.1 193 129a71.6 71.6 0 0 1 6.26 20.76A51.77 51.77 0 0 1 216 188m-60.11-94.37a71.7 71.7 0 0 1 26.88 19.64a218.5 218.5 0 0 0 14.83-46.19c3.49-18.13 3.15-33-.93-39.72a6 6 0 0 0-5.73-3.36c-6.61 0-14.52 9.7-21.72 26.62c-5.93 13.94-10.35 30.12-13.33 43.01m-82.66 19.64a71.7 71.7 0 0 1 26.88-19.64c-3-12.89-7.4-29.07-13.33-43C79.58 33.7 71.67 24 65.06 24a6 6 0 0 0-5.73 3.36C55.25 34.1 54.91 49 58.4 67.08a218.5 218.5 0 0 0 14.83 46.19M200 188a35.87 35.87 0 0 0-13.34-28a8 8 0 0 1-2.92-5.45a56 56 0 0 0-111.48 0a8 8 0 0 1-2.92 5.45a36 36 0 1 0 47.28 54.21l-9.74-8.09a8 8 0 1 1 10.24-12.3L128 202.9l10.88-9.05a8 8 0 1 1 10.24 12.3l-9.74 8.09A36 36 0 0 0 200 188"/></g></svg></span></span>
      <span class="wg__rim" aria-hidden="true"></span>
      <span class="wg__flash" aria-hidden="true"></span>
    </button>
    <div class="wg__veil" id="wgVeil">
      <p class="wg__veilMsg" id="wgVeilMsg" role="status" hidden><b id="wgEndMsg">게임 끝! 점수 {n} · 최고 {b}</b></p>
      <button class="wg__start" id="wgStart" type="button">시작</button>
    </div>
  </div>
</div>
</main>
<script>
// 두더지 잡기 — 3×3 구멍에 무작위로(700~1000ms 간격) 두더지가 솟고, 솟아 있는 동안 pointerdown 하면 점수.
// 제한 시간 20초. 놓쳐도 감점은 없다. 최고 점수는 p301-03-best.
// 실제 솟기·들기는 transition(부드럽게), 격자 미리보기(.is-demo)만 @keyframes — 두 코드가 갈라진다(252-07 계열).
(function () {
  var KEY = 'p301-03-best';
  var TIME = 20000;   // 제한 시간 20초 (ms)
  var UP_MS = 850;    // 두더지가 올라와 있는 시간 (ms)
  var END_TEXT = '게임 끝! 점수 {n} · 최고 {b}';
  var AGAIN = '다시';
  var START = '시작';
  var root = document.getElementById('wg');
  var field = document.getElementById('wgField');
  var holes = [].slice.call(field.querySelectorAll('.wg__hole'));
  var scoreEl = document.getElementById('wgScore');
  var clockEl = document.getElementById('wgClock');
  var fillEl = document.getElementById('wgFill');
  var bestEl = document.getElementById('wgBest');
  var veil = document.getElementById('wgVeil');
  var veilMsg = document.getElementById('wgVeilMsg');
  var endMsg = document.getElementById('wgEndMsg');
  var startBtn = document.getElementById('wgStart');
  var playing = false, score = 0, endAt = 0, upIndex = -1, lastHole = -1;
  var tickId = 0, spawnId = 0, downId = 0;

  function loadBest() {
    try { return Number(window.localStorage.getItem(KEY)) || 0; } catch (e) { return 0; }
  }
  var best = loadBest();
  bestEl.textContent = String(best);

  function paintTime(ms) {
    clockEl.textContent = (ms / 1000).toFixed(1);
    fillEl.style.transform = 'scaleX(' + (ms / TIME) + ')';   // 채움 막대 — 시작 변 기준
  }
  function sink() {
    clearTimeout(downId); downId = 0;
    if (upIndex >= 0) { holes[upIndex].classList.remove('is-up'); upIndex = -1; }
  }
  function spawn() {
    if (!playing) { return; }
    sink();
    var i = lastHole;
    while (i === lastHole) { i = Math.floor(Math.random() * holes.length); }   // 같은 구멍 연속 스폰은 피한다
    lastHole = i; upIndex = i;
    holes[i].classList.add('is-up');
    downId = setTimeout(sink, UP_MS);
    spawnId = setTimeout(spawn, 700 + Math.random() * 300);
  }
  function stopTimers() {
    clearInterval(tickId); clearTimeout(spawnId); clearTimeout(downId);
    tickId = 0; spawnId = 0; downId = 0;
  }
  function hit(btn) {
    if (!playing) { return; }
    var i = holes.indexOf(btn);
    if (i !== upIndex) { return; }   // 안 올라와 있는 구멍 — 중복·빈 클릭 방지
    upIndex = -1; clearTimeout(downId); downId = 0;
    score++; scoreEl.textContent = String(score);
    btn.classList.remove('is-up');
    btn.classList.add('is-hit');
    setTimeout(function () { btn.classList.remove('is-hit'); }, 380);
  }
  function tick() {
    var left = endAt - Date.now();
    if (left <= 0) { finish(); return; }
    paintTime(left);
  }
  function finish() {
    playing = false; stopTimers(); sink();
    paintTime(0);
    if (score > best) {
      best = score;
      try { window.localStorage.setItem(KEY, String(best)); } catch (e) { /* 저장 건너뛰기 */ }
      bestEl.textContent = String(best);
    }
    endMsg.textContent = END_TEXT.replace('{n}', String(score)).replace('{b}', String(best));
    veilMsg.hidden = false;
    startBtn.textContent = AGAIN;
    veil.hidden = false;
    startBtn.focus({ preventScroll: true });   // iframe 안에서 부모 스크롤 방지
  }
  function start() {
    root.classList.remove('is-demo');
    playing = true; score = 0; lastHole = -1;
    scoreEl.textContent = '0';
    veil.hidden = true; veilMsg.hidden = true;
    endAt = Date.now() + TIME;
    paintTime(TIME);
    tickId = setInterval(tick, 100);
    spawnId = setTimeout(spawn, 350);
  }
  field.addEventListener('pointerdown', function (e) {
    root.classList.remove('is-demo');
    var btn = e.target.closest ? e.target.closest('.wg__hole') : null;
    if (btn) { hit(btn); }
  });
  field.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') { return; }
    var btn = e.target.closest ? e.target.closest('.wg__hole') : null;
    if (btn) { e.preventDefault(); hit(btn); }
  });
  startBtn.addEventListener('click', start);
  document.getElementById('wgRestart').addEventListener('click', function () {
    root.classList.remove('is-demo');
    playing = false; stopTimers(); sink();
    score = 0; scoreEl.textContent = '0';
    paintTime(TIME);
    startBtn.textContent = START;
    veilMsg.hidden = true;
    veil.hidden = false;
  });
  paintTime(TIME);
})();
</script>
</body>
</html>
