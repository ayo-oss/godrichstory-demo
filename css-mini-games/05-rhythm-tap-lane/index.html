<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리듬 탭 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="rtl-note-ico" viewBox="0 0 256 256" fill="currentColor"><g><path d="M208 164a28 28 0 1 1-28-28a28 28 0 0 1 28 28m-156 4a28 28 0 1 0 28 28a28 28 0 0 0-28-28" opacity=".2"/><path d="M212.92 17.69a8 8 0 0 0-6.86-1.45l-128 32A8 8 0 0 0 72 56v110.08A36 36 0 1 0 88 196v-85.75l112-28v51.83A36 36 0 1 0 216 164V24a8 8 0 0 0-3.08-6.31M52 216a20 20 0 1 1 20-20a20 20 0 0 1-20 20M88 93.75v-31.5l112-28v31.5ZM180 184a20 20 0 1 1 20-20a20 20 0 0 1-20 20"/></g></symbol>
    <symbol id="rtl-trophy-ico" viewBox="0 0 256 256" fill="currentColor"><g><path d="M200 48v63.1c0 39.7-31.75 72.6-71.45 72.9A72 72 0 0 1 56 112V48Z" opacity=".2"/><path d="M232 64h-24V48a8 8 0 0 0-8-8H56a8 8 0 0 0-8 8v16H24A16 16 0 0 0 8 80v16a40 40 0 0 0 40 40h3.65A80.13 80.13 0 0 0 120 191.61V216H96a8 8 0 0 0 0 16h64a8 8 0 0 0 0-16h-24v-24.42c31.94-3.23 58.44-25.64 68.08-55.58H208a40 40 0 0 0 40-40V80a16 16 0 0 0-16-16M48 120a24 24 0 0 1-24-24V80h24v32q0 4 .39 8Zm144-8.9c0 35.52-29 64.64-64 64.9a64 64 0 0 1-64-64V56h128ZM232 96a24 24 0 0 1-24 24h-.5a82 82 0 0 0 .5-8.9V80h24Z"/></g></symbol>
    <symbol id="rtl-restart-ico" viewBox="0 0 256 256" fill="currentColor"><g><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M240 56v48a8 8 0 0 1-8 8h-48a8 8 0 0 1 0-16h27.4l-26.59-24.36l-.25-.24a80 80 0 1 0-1.67 114.78a8 8 0 0 1 11 11.63A95.44 95.44 0 0 1 128 224h-1.32a96 96 0 1 1 69.07-164L224 85.8V56a8 8 0 1 1 16 0"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="rtl is-demo" id="rtl">
  <header class="rtl__bar">
    <p class="rtl__title">
      <svg class="rtl__ico" aria-hidden="true"><use href="#rtl-note-ico"/></svg>
      <span>리듬 탭</span>
    </p>
    <p class="rtl__pill"><span class="rtl__label">점수</span><b class="rtl__num" id="scoreNum">0</b></p>
    <p class="rtl__pill"><span class="rtl__label">놓침</span><b class="rtl__num" id="missNum">0</b></p>
    <p class="rtl__pill rtl__pill--best">
      <svg class="rtl__ico rtl__ico--sm" aria-hidden="true"><use href="#rtl-trophy-ico"/></svg>
      <b class="rtl__num" id="bestNum">0</b>
    </p>
    <button class="rtl__btn" id="restartBtn" type="button" aria-label="다시 시작">
      <svg class="rtl__ico rtl__ico--sm" aria-hidden="true"><use href="#rtl-restart-ico"/></svg>
    </button>
  </header>

  <div class="rtl__board" id="board" aria-label="리듬 탭 놀이판">
    <div class="rtl__lane" data-lane="0" style="--k:0">
      <div class="rtl__well" id="well0">
        <span class="rtl__pv" style="--d:0ms"></span>
        <span class="rtl__pv" style="--d:-1000ms"></span>
      </div>
      <span class="rtl__key">J</span>
    </div>
    <div class="rtl__lane" data-lane="1" style="--k:1">
      <div class="rtl__well" id="well1">
        <span class="rtl__pv" style="--d:-333ms"></span>
        <span class="rtl__pv" style="--d:-1333ms"></span>
      </div>
      <span class="rtl__key">K</span>
    </div>
    <div class="rtl__lane" data-lane="2" style="--k:2">
      <div class="rtl__well" id="well2">
        <span class="rtl__pv" style="--d:-666ms"></span>
        <span class="rtl__pv" style="--d:-1666ms"></span>
      </div>
      <span class="rtl__key">L</span>
    </div>

    <span class="rtl__line" aria-hidden="true"></span>
    <p class="rtl__combo" id="combo" hidden>0 콤보</p>
    <p class="rtl__verdict" id="verdict" aria-live="polite"></p>

    <div class="rtl__start" id="startOver">
      <p class="rtl__startTitle">J K L 키로 노트를 받아요</p>
      <p class="rtl__startSub">1 2 3 으로도 받을 수 있어요 · 판정선에 노트가 닿는 순간이 퍼펙트입니다</p>
    </div>

    <div class="rtl__result" id="resultOver" hidden>
      <p class="rtl__resultTitle">곡 끝!</p>
      <p class="rtl__resultLine" id="resultLine">점수 0 · 최대 콤보 0 · 놓침 0</p>
      <button class="rtl__again" id="againBtn" type="button">
        <svg class="rtl__ico rtl__ico--sm" aria-hidden="true"><use href="#rtl-restart-ico"/></svg>
        <span>다시 시작</span>
      </button>
    </div>
  </div>

  <p class="rtl__hint">퍼펙트 100점 · 좋음 60점 · 콤보가 이어지면 보너스가 붙어요</p>
</div>
</main>
<script>
var BEST_KEY = 'p301-05-best';
var VERDICT_PERFECT = '퍼펙트';
var VERDICT_GOOD = '좋음';
var VERDICT_MISS = '놓침';
var COMBO_FMT = '{n} 콤보';
var RESULT_FMT = '점수 {s} · 최대 콤보 {c} · 놓침 {m}';
var REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// 곡 스케줄 — [박수, 레인]. 박 하나는 480ms, 첫 노트는 5박(2400ms) 뒤에 판정선에 닿는다
var BEAT = 480;
var SONG = [[5,0],[6,1],[7,2],[9,1],[10,0],[12,2],[13,1],[14,0],[16,2],[17,1],[18,2],[20,0],[21,1],[22,2],[24,1],[25,0],[27,2],[28,1]];
// 판정 창(ms) — 노트 애니메이션의 시계(currentTime)와 도착 시점(duration)의 차이로 갈린다
var WIN_PERFECT = 115, WIN_GOOD = 240, WIN_MISS = 400;
var KEY_LANE = { j: 0, k: 1, l: 2, '1': 0, '2': 1, '3': 2 };

var root = document.getElementById('rtl');
var wells = [document.getElementById('well0'), document.getElementById('well1'), document.getElementById('well2')];
var scoreNum = document.getElementById('scoreNum');
var missNum = document.getElementById('missNum');
var bestNum = document.getElementById('bestNum');
var verdictEl = document.getElementById('verdict');
var comboEl = document.getElementById('combo');
var startOver = document.getElementById('startOver');
var resultOver = document.getElementById('resultOver');
var resultLine = document.getElementById('resultLine');

var st = { playing: false, notes: [], score: 0, combo: 0, maxCombo: 0, miss: 0,
           fallMs: 2000, t0: 0, raf: 0, best: 0, demoTimer: 0 };

function loadBest() {
  try { st.best = Number(window.localStorage.getItem(BEST_KEY)) || 0; } catch (e) { st.best = 0; }
  bestNum.textContent = String(st.best);
}
function saveBest() {
  if (st.score <= st.best) { return; }
  st.best = st.score;
  try { window.localStorage.setItem(BEST_KEY, String(st.best)); } catch (e) { /* 저장이 막힌 창에서는 넘어간다 */ }
  bestNum.textContent = String(st.best);
}

// 노트를 만들어 레인에 붙인다 — 낙하 CSS 애니메이션의 지연을 스케줄로 쓴다
function makeNote(tDue, lane) {
  var n = document.createElement('span');
  n.className = 'rtl__note';
  n.setAttribute('data-lane', String(lane));
  n.setAttribute('data-due', String(tDue));
  wells[lane].appendChild(n);
  return n;
}
// 노트의 낙하 애니메이션 — getAnimations 로 직접 잡는다 (애니메이션 시계가 곧 판정 기준이다)
function fallAnim(note) {
  var anims = note.getAnimations();
  for (var i = 0; i < anims.length; i++) {
    if (anims[i].animationName === 'rtlFall') { return anims[i]; }
  }
  return anims[0] || null;
}
// 곡 시작부터 흐른 시각을 그 노트의 낙하 시간으로 환산한 벽시계 값
function wallNow(note) {
  return (performance.now() - st.t0) - Number(note.getAttribute('data-due')) + st.fallMs;
}
// 판정에 쓰는 시각 — 노트가 실제로 그려진 위치가 곧 판정 기준이므로 낙하 애니메이션의
// 시계(currentTime 에서 delay 를 뺀 값 = 낙하가 시작된 뒤 흐른 시간)를 읽는다.
// 낙하가 끝난 애니메이션은 currentTime 이 끝점에 고정되므로(판정 창을 지나친 노트)
// 그때부터는 벽시계로 넘어간다 — 그래야 놓친 노트가 제때 정리된다.
function noteNow(note) {
  if (REDUCE) { return wallNow(note); }
  var a = fallAnim(note);
  if (a && a.effect && a.playState !== 'finished') {
    var ct = a.effect.getComputedTiming();
    var delay = a.effect.getTiming().delay || 0;
    if (ct.localTime != null) { return ct.localTime - delay; }
  }
  return wallNow(note);
}

function showVerdict(kind) {
  var txt = kind === 'perfect' ? VERDICT_PERFECT : (kind === 'good' ? VERDICT_GOOD : VERDICT_MISS);
  verdictEl.textContent = txt;
  verdictEl.className = 'rtl__verdict is-' + kind;
  // 애니메이션이 다시 켜지게 한 프레임 비운 뒤 킨다 — 같은 판정이 연달아 나와도 점등이 보인다
  void verdictEl.offsetWidth;
  verdictEl.classList.add('is-show');
}
function paintCombo() {
  if (st.combo >= 2) {
    comboEl.hidden = false;
    comboEl.textContent = COMBO_FMT.replace('{n}', String(st.combo));
    comboEl.classList.remove('is-bump');
    void comboEl.offsetWidth;
    comboEl.classList.add('is-bump');
  } else {
    comboEl.hidden = true;
  }
}

function judgeHit(note, kind) {
  note.classList.add(kind === 'miss' ? 'is-miss' : 'is-hit');
  note.setAttribute('data-judged', '1');
  if (kind === 'perfect') { st.combo += 1; st.score += 100 + st.combo * 5; }
  else if (kind === 'good') { st.combo += 1; st.score += 60 + st.combo * 5; }
  else { st.combo = 0; st.miss += 1; }
  if (st.combo > st.maxCombo) { st.maxCombo = st.combo; }
  scoreNum.textContent = String(st.score);
  missNum.textContent = String(st.miss);
  paintCombo();
  showVerdict(kind);
  window.setTimeout(function () { if (note.parentNode) { note.parentNode.removeChild(note); } }, 320);
}

function pressLane(lane) {
  if (!st.playing) { start(); return; }
  var best = null, bestDiff = Infinity;
  for (var i = 0; i < st.notes.length; i++) {
    var n = st.notes[i];
    if (n.getAttribute('data-judged') || Number(n.getAttribute('data-lane')) !== lane) { continue; }
    var diff = Math.abs(noteNow(n) - st.fallMs);
    if (diff < bestDiff) { bestDiff = diff; best = n; }
  }
  if (!best || bestDiff > WIN_MISS) { return; }
  if (bestDiff <= WIN_PERFECT) { judgeHit(best, 'perfect'); }
  else if (bestDiff <= WIN_GOOD) { judgeHit(best, 'good'); }
  else { judgeHit(best, 'miss'); }
}

// 놓친 노트(판정 창을 지나친 노트)를 치우고 곡이 끝났는지 본다
function tick() {
  if (!st.playing) { return; }
  var remain = 0;
  for (var i = 0; i < st.notes.length; i++) {
    var n = st.notes[i];
    if (!n.getAttribute('data-judged')) {
      remain += 1;
      var cur = noteNow(n);
      if (REDUCE && !n.classList.contains('is-due') && Math.abs(cur - st.fallMs) <= WIN_MISS) {
        n.classList.add('is-due');
      }
      if (cur > st.fallMs + WIN_MISS) { judgeHit(n, 'miss'); remain -= 1; }
    }
  }
  var lastDue = SONG[SONG.length - 1][0] * BEAT;
  if (remain === 0 && performance.now() - st.t0 > lastDue + 900) { finish(); return; }
  st.raf = window.requestAnimationFrame(tick);
}

function start() {
  root.classList.remove('is-demo');
  window.clearInterval(st.demoTimer);
  clearNotes();
  st.score = 0; st.combo = 0; st.maxCombo = 0; st.miss = 0;
  scoreNum.textContent = '0'; missNum.textContent = '0';
  comboEl.hidden = true; verdictEl.textContent = ''; verdictEl.className = 'rtl__verdict';
  startOver.hidden = true; resultOver.hidden = true;
  // 낙하 시간을 먼저 잰다 — 노트 지연(스케줄)이 이 값으로 계산된다
  var probe = makeNote(0, 0);
  void probe.offsetWidth;
  var pa = fallAnim(probe);
  st.fallMs = (pa && pa.effect && pa.effect.getTiming().duration) || 2000;
  st.notes = [probe];
  probe.setAttribute('data-due', String(SONG[0][0] * BEAT));
  probe.style.animationDelay = String(SONG[0][0] * BEAT - st.fallMs) + 'ms';
  for (var i = 1; i < SONG.length; i++) {
    var tDue = SONG[i][0] * BEAT;
    var n = makeNote(tDue, SONG[i][1]);
    n.style.animationDelay = String(tDue - st.fallMs) + 'ms';
    st.notes.push(n);
  }
  st.t0 = performance.now();
  st.playing = true;
  st.raf = window.requestAnimationFrame(tick);
}
function clearNotes() {
  for (var i = 0; i < st.notes.length; i++) {
    if (st.notes[i].parentNode) { st.notes[i].parentNode.removeChild(st.notes[i]); }
  }
  st.notes = [];
}
function finish() {
  st.playing = false;
  window.cancelAnimationFrame(st.raf);
  saveBest();
  resultLine.textContent = RESULT_FMT.replace('{s}', String(st.score)).replace('{c}', String(st.maxCombo)).replace('{m}', String(st.miss));
  resultOver.hidden = false;
}
function toReady() {
  st.playing = false;
  window.cancelAnimationFrame(st.raf);
  root.classList.remove('is-demo');
  window.clearInterval(st.demoTimer);
  clearNotes();
  st.score = 0; st.combo = 0; st.maxCombo = 0; st.miss = 0;
  scoreNum.textContent = '0'; missNum.textContent = '0';
  comboEl.hidden = true; verdictEl.textContent = ''; verdictEl.className = 'rtl__verdict';
  resultOver.hidden = true;
  startOver.hidden = false;
}

window.addEventListener('keydown', function (e) {
  var lane = KEY_LANE[e.key.toLowerCase()];
  if (lane === undefined) { return; }
  if (e.repeat) { return; }
  pressLane(lane);
});
document.getElementById('board').addEventListener('click', function () {
  if (!st.playing && startOver.hidden === false) { start(); }
});
document.getElementById('againBtn').addEventListener('click', function () { start(); });
document.getElementById('restartBtn').addEventListener('click', function () { toReady(); });

// 격자 미리보기 — 판정 글자와 콤보가 숨 쉬는 연출만 담당한다 (채점은 .is-demo 없이만)
function demoCycle() {
  var kinds = ['perfect', 'good', 'perfect', 'miss'];
  var combos = [4, 9, 16, 7];
  var i = 0;
  function step() {
    // .is-demo 가 떼어지면(사람이 시작하면) 이 연출도 스스로 멈추고 남긴 글자를 치운다
    if (!root.classList.contains('is-demo')) {
      window.clearInterval(st.demoTimer);
      if (!st.playing) { verdictEl.textContent = ''; verdictEl.className = 'rtl__verdict'; comboEl.hidden = true; }
      return;
    }
    var k = kinds[i % 4];
    verdictEl.textContent = k === 'perfect' ? VERDICT_PERFECT : (k === 'good' ? VERDICT_GOOD : VERDICT_MISS);
    verdictEl.className = 'rtl__verdict is-show is-' + k;
    comboEl.hidden = false;
    comboEl.textContent = COMBO_FMT.replace('{n}', String(combos[i % 4]));
    i += 1;
  }
  step();
  st.demoTimer = window.setInterval(step, 700);
}

loadBest();
if (root.classList.contains('is-demo')) { demoCycle(); }
</script>
</body>
</html>
