<main class="stage">
<div class="fme is-demo" id="fme">
  <header class="fme__bar">
    <p class="fme__title">
      <svg class="fme__ico" aria-hidden="true"><use href="#fme-pad-ico"/></svg>
      <span>포커스 미로 탈출</span>
    </p>
    <p class="fme__pill"><span class="fme__label">걸음</span><b class="fme__num" id="stepNum">0</b></p>
    <p class="fme__pill fme__pill--best">
      <svg class="fme__ico fme__ico--sm" aria-hidden="true"><use href="#fme-trophy-ico"/></svg>
      <b class="fme__num" id="bestNum">-</b>
    </p>
    <button class="fme__btn" id="restartBtn" type="button" aria-label="다시 시작">
      <svg class="fme__ico fme__ico--sm" aria-hidden="true"><use href="#fme-restart-ico"/></svg>
    </button>
  </header>

  <div class="fme__mazeWrap">
    <div class="fme__maze" id="maze" role="group" aria-label="7×5 미로. 방향키로 움직이세요"></div>

    <div class="fme__done" id="done" hidden>
      <div class="fme__donePanel">
        <p class="fme__doneTitle">
          <svg class="fme__ico fme__ico--sm" aria-hidden="true"><use href="#fme-flag-ico"/></svg>
          <span>탈출!</span>
        </p>
        <p class="fme__doneLine" id="doneLine">0 걸음</p>
        <button class="fme__again" id="againBtn" type="button">
          <svg class="fme__ico fme__ico--sm" aria-hidden="true"><use href="#fme-restart-ico"/></svg>
          <span>다시 시작</span>
        </button>
      </div>
    </div>
  </div>

  <p class="fme__hint">방향키로 칸을 옮겨 깃발까지 가세요 · 벽은 포커스를 받지 않아 저절로 막힙니다</p>
</div>
</main>
<script>
var BEST_KEY = 'p301-06-best';
var STEP_FMT = '{n} 걸음';
var CELL_LABEL = '{c}열 {r}행 통로';
var START_LABEL = '출발 칸';
var GOAL_LABEL = '출구 칸';

// 7×5 미로 — . 은 통로, # 은 벽, S 는 출발, G 는 출구.
// grid-template-areas 문자와 같은 배치다 (아래 style.scss 의 격자 이름이 이 표를 따른다).
var MAZE = [
  'S.#...G',
  '.#..#.#',
  '...#..#',
  '#.##..#',
  '......#'
];
var COLS = 7, ROWS = 5;
// 미리보기가 걷는 경로 — 출발에서 출구까지의 최단 정답 한 벌 [열, 행] (10 걸음, run/301/_probe/maze_path.py 로 구했다)
var DEMO_PATH = [[0,0],[0,1],[0,2],[1,2],[2,2],[2,1],[3,1],[3,0],[4,0],[5,0],[6,0]];

var root = document.getElementById('fme');
var maze = document.getElementById('maze');
var stepNum = document.getElementById('stepNum');
var bestNum = document.getElementById('bestNum');
var doneBox = document.getElementById('done');
var doneLine = document.getElementById('doneLine');

var cells = {};
var steps = 0;
var best = 0;
var cleared = false;
var demoTimer = 0;
var demoIdx = 0;

function key(c, r) { return c + ',' + r; }
function at(c, r) { return (MAZE[r] || '')[c] || '#'; }
function isOpen(c, r) { return c >= 0 && c < COLS && r >= 0 && r < ROWS && at(c, r) !== '#'; }

function loadBest() {
  try { best = Number(window.localStorage.getItem(BEST_KEY)) || 0; } catch (e) { best = 0; }
  bestNum.textContent = best ? STEP_FMT.replace('{n}', String(best)) : '-';
}
function saveBest(n) {
  if (best && n >= best) { return; }
  best = n;
  try { window.localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* 저장이 막힌 창에서는 넘어간다 */ }
  bestNum.textContent = STEP_FMT.replace('{n}', String(best));
}

function build() {
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var ch = at(c, r);
      var el;
      if (ch === '#') {
        // 벽은 div 라 포커스를 못 받는다 — 막히는 일이 규칙이 아니라 구조로 정해진다
        el = document.createElement('div');
        el.className = 'fme__wall';
        el.setAttribute('aria-hidden', 'true');
      } else {
        el = document.createElement('button');
        el.type = 'button';
        el.className = 'fme__cell' + (ch === 'S' ? ' is-start' : '') + (ch === 'G' ? ' is-goal' : '');
        el.setAttribute('data-c', String(c));
        el.setAttribute('data-r', String(r));
        var label = CELL_LABEL.replace('{c}', String(c + 1)).replace('{r}', String(r + 1));
        if (ch === 'S') { label = START_LABEL; }
        if (ch === 'G') { label = GOAL_LABEL; }
        el.setAttribute('aria-label', label);
        // 캐릭터는 칸마다 하나씩 숨어 있다가 그 칸이 :focus 가 되면 나타난다 — 그리는 주체는 CSS 다
        el.innerHTML = '<svg class="fme__char" aria-hidden="true"><use href="#fme-char-ico"/></svg>';
        cells[key(c, r)] = el;
      }
      el.style.gridArea = 'c' + c + 'r' + r;
      maze.appendChild(el);
    }
  }
  // 미리보기에서 정답 길이 순서대로 밝아지도록 경로 칸에 차례 번호를 심는다
  for (var i = 0; i < DEMO_PATH.length; i++) {
    var pc = cells[key(DEMO_PATH[i][0], DEMO_PATH[i][1])];
    if (pc) { pc.classList.add('is-path'); pc.style.setProperty('--i', String(i)); }
  }
}

// 스크립트가 옮기는 포커스인지 사람이 짚은 포커스인지 가르는 표식 — 미리보기가 자기 포커스에 스스로 멈추면 안 된다
var autoFocus = false;
function focusCell(c, r) {
  var el = cells[key(c, r)];
  if (!el) { return false; }
  autoFocus = true;
  // iframe 안에서 무가드 focus 는 부모 페이지를 끌어당긴다 — 언제나 preventScroll
  el.focus({ preventScroll: true });
  autoFocus = false;
  return true;
}
function currentCell() {
  var a = document.activeElement;
  if (a && a.className && String(a.className).indexOf('fme__cell') >= 0) {
    return [Number(a.getAttribute('data-c')), Number(a.getAttribute('data-r'))];
  }
  return null;
}

function reach(c, r) {
  if (at(c, r) !== 'G' || cleared) { return; }
  cleared = true;
  doneLine.textContent = STEP_FMT.replace('{n}', String(steps));
  doneBox.hidden = false;
  saveBest(steps);
}

function move(dc, dr) {
  var cur = currentCell();
  if (!cur) { focusCell(0, 0); return; }
  var nc = cur[0] + dc, nr = cur[1] + dr;
  if (!isOpen(nc, nr)) { return; }
  if (!focusCell(nc, nr)) { return; }
  steps += 1;
  stepNum.textContent = String(steps);
  reach(nc, nr);
}

function reset() {
  stopDemo();
  cleared = false;
  steps = 0;
  stepNum.textContent = '0';
  doneBox.hidden = true;
  focusCell(0, 0);
}
function stopDemo() {
  root.classList.remove('is-demo');
  window.clearInterval(demoTimer);
  demoTimer = 0;
}

window.addEventListener('keydown', function (e) {
  var dc = 0, dr = 0;
  if (e.key === 'ArrowLeft') { dc = -1; }
  else if (e.key === 'ArrowRight') { dc = 1; }
  else if (e.key === 'ArrowUp') { dr = -1; }
  else if (e.key === 'ArrowDown') { dr = 1; }
  else { return; }
  e.preventDefault();
  if (root.classList.contains('is-demo')) { stopDemo(); reset(); return; }
  move(dc, dr);
});
maze.addEventListener('pointerdown', function () { if (root.classList.contains('is-demo')) { stopDemo(); reset(); } });
// 사람이 탭으로 미로에 들어오면 미리보기를 접는다 (스크립트가 옮긴 포커스는 그대로 둔다)
maze.addEventListener('focusin', function () {
  if (!autoFocus && root.classList.contains('is-demo')) { stopDemo(); reset(); }
});
document.getElementById('restartBtn').addEventListener('click', function () { reset(); });
document.getElementById('againBtn').addEventListener('click', function () { reset(); });

// 미리보기 — 타이머가 정답 경로를 따라 포커스를 옮겨 캐릭터가 미로를 걷는다.
// 스크롤은 preventScroll 로 막고, 사람이 키를 누르거나 칸을 누르면 바로 멈춘다.
function startDemo() {
  demoIdx = 0;
  demoTimer = window.setInterval(function () {
    if (!root.classList.contains('is-demo')) { window.clearInterval(demoTimer); return; }
    var p = DEMO_PATH[demoIdx % DEMO_PATH.length];
    focusCell(p[0], p[1]);
    demoIdx += 1;
  }, 133);
}

loadBest();
build();
focusCell(0, 0);
if (root.classList.contains('is-demo')) { startDemo(); }
</script>
</body>
</html>
