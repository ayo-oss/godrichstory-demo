<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반응속도 재기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-lightning" viewBox="0 0 256 256" fill="currentColor"><g><path d="m96 240l16-80l-64-24L160 16l-16 80l64 24Z" opacity=".2"/><path d="M215.79 118.17a8 8 0 0 0-5-5.66L153.18 90.9l14.66-73.33a8 8 0 0 0-13.69-7l-112 120a8 8 0 0 0 3 13l57.63 21.61l-14.62 73.25a8 8 0 0 0 13.69 7l112-120a8 8 0 0 0 1.94-7.26M109.37 214l10.47-52.38a8 8 0 0 0-5-9.06L62 132.71l84.62-90.66l-10.46 52.38a8 8 0 0 0 5 9.06l52.8 19.8Z"/></g></symbol>
    <symbol id="ico-clock" viewBox="0 0 256 256" fill="currentColor"><g><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88m64-88a8 8 0 0 1-8 8h-56a8 8 0 0 1-8-8V72a8 8 0 0 1 16 0v48h48a8 8 0 0 1 8 8"/></g></symbol>
    <symbol id="ico-trophy" viewBox="0 0 256 256" fill="currentColor"><g><path d="M200 48v63.1c0 39.7-31.75 72.6-71.45 72.9A72 72 0 0 1 56 112V48Z" opacity=".2"/><path d="M232 64h-24V48a8 8 0 0 0-8-8H56a8 8 0 0 0-8 8v16H24A16 16 0 0 0 8 80v16a40 40 0 0 0 40 40h3.65A80.13 80.13 0 0 0 120 191.61V216H96a8 8 0 0 0 0 16h64a8 8 0 0 0 0-16h-24v-24.42c31.94-3.23 58.44-25.64 68.08-55.58H208a40 40 0 0 0 40-40V80a16 16 0 0 0-16-16M48 120a24 24 0 0 1-24-24V80h24v32q0 4 .39 8Zm144-8.9c0 35.52-29 64.64-64 64.9a64 64 0 0 1-64-64V56h128ZM232 96a24 24 0 0 1-24 24h-.5a82 82 0 0 0 .5-8.9V80h24Z"/></g></symbol>
    <symbol id="ico-warning" viewBox="0 0 256 256" fill="currentColor"><g><path d="M215.46 216H40.54c-12.62 0-20.54-13.21-14.41-23.91l87.46-151.87c6.3-11 22.52-11 28.82 0l87.46 151.87c6.13 10.7-1.79 23.91-14.41 23.91" opacity=".2"/><path d="M236.8 188.09L149.35 36.22a24.76 24.76 0 0 0-42.7 0L19.2 188.09a23.51 23.51 0 0 0 0 23.72A24.35 24.35 0 0 0 40.55 224h174.9a24.35 24.35 0 0 0 21.33-12.19a23.51 23.51 0 0 0 .02-23.72m-13.87 15.71a8.5 8.5 0 0 1-7.48 4.2H40.55a8.5 8.5 0 0 1-7.48-4.2a7.59 7.59 0 0 1 0-7.72l87.45-151.87a8.75 8.75 0 0 1 15 0l87.45 151.87a7.59 7.59 0 0 1-.04 7.72M120 144v-40a8 8 0 0 1 16 0v40a8 8 0 0 1-16 0m20 36a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></symbol>
    <symbol id="ico-restart" viewBox="0 0 256 256" fill="currentColor"><g><path d="M216 128a88 88 0 1 1-88-88a88 88 0 0 1 88 88" opacity=".2"/><path d="M240 56v48a8 8 0 0 1-8 8h-48a8 8 0 0 1 0-16h27.4l-26.59-24.36l-.25-.24a80 80 0 1 0-1.67 114.78a8 8 0 0 1 11 11.63A95.44 95.44 0 0 1 128 224h-1.32a96 96 0 1 1 69.07-164L224 85.8V56a8 8 0 1 1 16 0"/></g></symbol>
  </defs>
</svg>
<main class="stage">
<div class="rt is-demo is-idle" id="rt">
  <header class="rt__hud">
    <p class="rt__stat">
      <svg class="rt__ico" aria-hidden="true"><use href="#ico-trophy"/></svg>
      <span class="rt__label">최고기록</span><b class="rt__num" id="rtBest" aria-live="polite">—</b>
    </p>
    <p class="rt__stat">
      <svg class="rt__ico" aria-hidden="true"><use href="#ico-clock"/></svg>
      <span class="rt__label">직전 기록</span><b class="rt__num" id="rtLast">—</b>
    </p>
  </header>
  <div class="rt__panel" id="rtPanel" tabindex="0" role="application" aria-label="반응속도 놀이판. 신호가 켜지면 클릭이나 스페이스로 최대한 빨리 누릅니다">
    <p class="rt__face rt__face--wait">
      <span class="rt__waitTitle" id="rtWaitTitle">클릭하면 시작합니다</span>
      <span class="rt__waitSub" id="rtWaitSub">신호가 켜진 뒤 최대한 빨리 누르세요</span>
    </p>
    <p class="rt__face rt__face--go">
      <svg class="rt__goIco" aria-hidden="true"><use href="#ico-lightning"/></svg>
      <span class="rt__goTitle">지금 누르세요!</span>
    </p>
    <p class="rt__face rt__face--result">
      <b class="rt__ms" id="rtMs">{n}ms</b>
      <span class="rt__grade rt__grade--s3" id="rtGrade">보통</span>
      <button class="rt__restart" type="button">
        <svg class="rt__ico" aria-hidden="true"><use href="#ico-restart"/></svg><span>다시 시작</span>
      </button>
    </p>
    <p class="rt__face rt__face--penalty">
      <svg class="rt__penIco" aria-hidden="true"><use href="#ico-warning"/></svg>
      <span class="rt__penTitle">너무 성급해요!</span>
      <span class="rt__penSub">신호가 켜진 뒤에 누르세요</span>
      <button class="rt__restart" type="button">
        <svg class="rt__ico" aria-hidden="true"><use href="#ico-restart"/></svg><span>다시 시작</span>
      </button>
    </p>
    <p class="rt__demoMs" id="rtDemoMs" aria-hidden="true"></p>
  </div>
  <p class="rt__hint">클릭 · 스페이스로 반응합니다</p>
</div>
</main>
<script>
// 반응속도 재기 — 대기(무작위 1.5~4초) → 신호(크림 면, transition) → 결과(ms) 상태 머신.
// 상태 전환은 classList 로 상태 클래스를 갈아 끼운다(is-idle/is-armed/is-signal/is-result/is-penalty).
// 신호가 켜진 순간(signalAt)부터 첫 클릭·Space 까지 performance.now() 로 잰다.
// 신호 전 입력은 성급 클릭 — 대기 타이머를 끄고 벌점 문구로 판을 초기화한다.
var BEST_KEY = 'p301-09-best';
var MS_TEXT = '{n}ms';
var IDLE_TITLE = '클릭하면 시작합니다';
var IDLE_SUB = '신호가 켜진 뒤 최대한 빨리 누르세요';
var ARM_TITLE = '신호를 기다리세요';
var ARM_SUB = '켜지면 바로 누르세요';
var NO_RECORD = '—';
// 평가 라벨 4단계 — 문구는 문구_09.json 이 로케일마다 바꾼다
var GRADES = [
  { max: 200, cls: 'rt__grade--s1', label: '매우 빠름' },
  { max: 260, cls: 'rt__grade--s2', label: '빠름' },
  { max: 350, cls: 'rt__grade--s3', label: '보통' },
  { max: Infinity, cls: 'rt__grade--s4', label: '느림' }
];
var WAIT_MIN = 1500; // 대기 최소 ms
var WAIT_RANGE = 2500; // 대기 폭 ms (1.5~4초)

var root = document.getElementById('rt');
var panel = document.getElementById('rtPanel');
var waitTitleEl = document.getElementById('rtWaitTitle');
var waitSubEl = document.getElementById('rtWaitSub');
var msEl = document.getElementById('rtMs');
var gradeEl = document.getElementById('rtGrade');
var bestEl = document.getElementById('rtBest');
var lastEl = document.getElementById('rtLast');
// 결과 얼굴과 벌점 얼굴에 같은 버튼이 하나씩 — 둘 다 처음 화면으로 되돌린다
var restartBtns = document.querySelectorAll('.rt__restart');

var state = 'idle';
var armTimer = 0;
var signalAt = 0;
var best = loadBest();
var last = null;

function loadBest() {
  try {
    var v = Number(localStorage.getItem(BEST_KEY));
    return v > 0 ? v : null; // 최고기록은 최소 ms — 0 이하는 기록이 아니다
  } catch (e) { return null; }
}
function saveBest() {
  try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* 시크릿 창에서는 저장만 건너뛴다 */ }
}
function setState(next) {
  state = next;
  var map = { idle: 'is-idle', armed: 'is-armed', signal: 'is-signal', result: 'is-result', penalty: 'is-penalty' };
  root.classList.remove('is-idle', 'is-armed', 'is-signal', 'is-result', 'is-penalty');
  root.classList.add(map[next]);
}
function paintHud() {
  bestEl.textContent = best === null ? NO_RECORD : best + 'ms';
  lastEl.textContent = last === null ? NO_RECORD : last + 'ms';
}
function arm() {
  root.classList.remove('is-demo'); // 격자 미리보기 연출을 떼고 실제 게임으로
  waitTitleEl.textContent = ARM_TITLE;
  waitSubEl.textContent = ARM_SUB;
  setState('armed');
  clearTimeout(armTimer);
  armTimer = setTimeout(fire, WAIT_MIN + Math.random() * WAIT_RANGE);
}
function fire() {
  signalAt = performance.now();
  setState('signal');
}
function gradeFor(ms) {
  for (var i = 0; i < GRADES.length; i++) { if (ms <= GRADES[i].max) { return GRADES[i]; } }
  return GRADES[GRADES.length - 1];
}
function settle() {
  var ms = Math.round(performance.now() - signalAt);
  last = ms;
  if (best === null || ms < best) { best = ms; saveBest(); }
  var g = gradeFor(ms);
  msEl.textContent = MS_TEXT.replace('{n}', String(ms));
  gradeEl.textContent = g.label;
  gradeEl.className = 'rt__grade ' + g.cls;
  setState('result');
  paintHud();
}
function penalize() {
  clearTimeout(armTimer); // 판 초기화 — 걸려 있던 대기 타이머를 끈다
  setState('penalty');
}
function act() {
  if (state === 'armed') { penalize(); return; }
  if (state === 'signal') { settle(); return; }
  arm(); // idle · result · penalty 에서는 다음 판 시작
}
function isRestart(el) {
  while (el && el !== panel) {
    if (el.classList && el.classList.contains('rt__restart')) { return true; }
    el = el.parentNode;
  }
  return false;
}
function resetIdle() {
  clearTimeout(armTimer); // 판 초기화 — 걸려 있던 대기 타이머를 끄고 처음 화면으로
  waitTitleEl.textContent = IDLE_TITLE;
  waitSubEl.textContent = IDLE_SUB;
  setState('idle');
  paintHud();
}
panel.addEventListener('pointerdown', function (e) {
  if (isRestart(e.target)) { return; } // 버튼 위 누름은 버튼의 click 에 맡긴다
  act();
});
window.addEventListener('keydown', function (e) {
  if (e.repeat) { return; } // 키 자동 반복으로 대기가 계속 새로 시작되지 않게 한다
  if (e.key !== ' ' && e.code !== 'Space') { return; }
  if (isRestart(e.target)) { return; } // 버튼 포커스 중에는 기본 클릭에 맡긴다
  e.preventDefault();
  act();
});
for (var bi = 0; bi < restartBtns.length; bi++) {
  restartBtns[bi].addEventListener('click', function () { resetIdle(); });
}
setState('idle');
paintHud();
</script>
</body>
</html>
