<body>
<main class="stage">
  <div class="pages is-demo">
    <p class="page__tag">RANKING</p>
    <div class="rows">
      <div class="row row--1"><span class="row__rank">1</span><span class="row__name">Price: low to high</span></div>
      <div class="row row--2"><span class="row__rank">2</span><span class="row__name">Highest rated</span></div>

  </div>
