<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>速いとにじみ遅くなるとくっきりするリール — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__scene" data-role="scene" role="img" aria-label="五つのリールは速く回る間、速さに比例して縦ににじんで薄くなり、左から順に遅くなってくっきりした抽選番号で止まります。止まる瞬間には灯りがつきます"></div>
  <button class="vj__pad" data-role="pad" type="button" aria-label="数字の場面の舞台 — 押すか Enter、右・上の矢印キーで次の値を転がす"></button>
  <p class="vj__status" data-role="status" aria-hidden="true">数字が転がる場面</p>
  <p class="vj__live" data-role="live" role="status" aria-live="off"></p>
  <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    const cls = (s) => s;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function mod(a, n) { return ((a % n) + n) % n; }
    // 감속 곡선 — 처음이 가장 빠르고 끝에서 0 으로 닿는다(3제곱)
    function easeOut3(x) { const u = 1 - clamp(x, 0, 1); return 1 - u * u * u; }
    function easeInOut(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 장면 시계(초) — 장면 계산이 고치고 화면 쪽이 읽는다
    let sceneT = 0;
    // 지금 몇 번째 값인가 — 한 바퀴(LOOP_S)가 돌 때마다 하나 올라 다음 목표 값을 고른다
    let cycle = 0;
    // 숫자띠 한 줄의 칸 수 — 0 부터 9 까지 열 칸에 0, 1 을 한 번 더 붙여 9 에서 0 으로 넘어가는 경계를 끊김 없이 잇는다
    const CELLS = 12;
    // 번짐 기준 속도(칸/초) — 이만큼 빠르면 번짐이 최대. 꼬리 한 장의 간격(칸)
    const BLUR_REF = 60;
    const BLUR_LAG = 0.55;
    function mk(tag, name, parent) {
        const e = document.createElement(tag);
        e.className = cls(name);
        if (parent) {
            parent.appendChild(e);
        }
        return e;
    }
    // 자리 하나 — 창 하나에 0~9 띠(ghosts 장의 꼬리 띠 포함)와 속도 반짝임 층
    function makeStrip(parent, extra, ghosts) {
        const win = mk('span', 'dg ' + extra, parent);
        // 속도 반짝임 층은 띠 뒤에 깐다 — 숫자 글자는 항상 그 위에서 또렷하다
        const glow = mk('span', 'dg__glow', win);
        const cols = [];
        for (let g = 0; g <= ghosts; g += 1) {
            const col = mk('span', g === 0 ? 'dg__col' : 'dg__col dg__ghost', win);
            for (let i = 0; i < CELLS; i += 1) {
                const c = mk('span', 'dg__cell', col);
                c.textContent = String(i % 10);
            }
            cols.push(col);
        }
        return { win: win, cols: cols, glow: glow };
    }
    function putCol(col, pos) {
        col.style.transform = 'translateY(' + (-mod(pos, 10) / CELLS * 100).toFixed(3) + '%)';
    }
    // pos = 지금 띠가 밀려 올라온 칸 수(소수), speed = 칸/초(방향 포함). 꼬리 띠가 있으면 속도에 비례해 번진다
    function moveStrip(s, pos, speed) {
        putCol(s.cols[0], pos);
        if (s.cols.length < 2) {
            return;
        }
        const sp = clamp(Math.abs(speed) / BLUR_REF, 0, 1);
        const dir = speed < 0 ? -1 : 1;
        s.cols[0].style.opacity = (1 - 0.5 * sp).toFixed(3);
        for (let g = 1; g < s.cols.length; g += 1) {
            putCol(s.cols[g], pos - dir * sp * BLUR_LAG * g);
            s.cols[g].style.opacity = (0.5 * sp / g).toFixed(3);
        }
    }
    function glowStrip(s, v) { s.glow.style.opacity = clamp(v, 0, 1).toFixed(3); }
    // 칸 패턴 — d 는 숫자띠 한 자리, 그 밖의 글자는 구분 기호(쉼표·점·콜론). 왼쪽부터 순서대로 돌려준다
    function buildRow(parent, pattern, extra, ghosts) {
        const row = mk('span', 'odo ' + extra, parent);
        const out = [];
        for (const ch of pattern) {
            if (ch === 'd') {
                out.push(makeStrip(row, extra, ghosts));
            }
            else {
                const sep = mk('span', 'odo__sep', row);
                sep.textContent = ch;
            }
        }
        return out;
    }
    // 정수를 len 자리 숫자 배열로(왼쪽 자리부터)
    function digitsOf(n, len) {
        const out = [];
        for (let i = 0; i < len; i += 1) {
            out.push(Math.floor(n / Math.pow(10, len - 1 - i)) % 10);
        }
        return out;
    }
    function fmtNum(n) {
        const s = String(Math.round(n));
        let out = '';
        for (let i = 0; i < s.length; i += 1) {
            if (i > 0 && (s.length - i) % 3 === 0) {
                out += ',';
            }
            out += s.charAt(i);
        }
        return out;
    }
    function q(role) {
        const e = root.querySelector('[data-role="' + role + '"]');
        if (!(e instanceof HTMLElement)) {
            throw new Error('missing ' + role);
        }
        return e;
    }
    const scene = q('scene');
    const pad = q('pad');
    const pauseBtn = q('pause');
    const statusEl = q('status');
    const liveEl = q('live');
    const LOOP_S = 3.2;
    const REST_T = 3.0;
    const START_S = 0.2;
    const REELS = 5;
    // 릴이 멈추는 시간 — 왼쪽 릴이 가장 먼저 STOP_BASE 초 뒤, 오른쪽으로 갈수록 STOP_STEP 초씩 늦게
    const STOP_BASE = 1.0;
    const STOP_STEP = 0.24;
    const VALUES = [30729, 85416, 12963, 70508];
    let strips = [];
    let fromV = VALUES[0];
    let toV = VALUES[1];
    let topSpeed = 0;
    function build() {
        scene.textContent = '';
        const stack = mk('div', 'stack', scene);
        mk('span', 'cap', stack).textContent = '速いとにじみ止まるとくっきりする抽選番号';
        // 꼬리 띠 두 장을 더 둔다 — 속도에 따라 번짐이 된다
        strips = buildRow(stack, 'ddddd', 'lg', 2);
    }
    function reset() {
        toV = VALUES[cycle % VALUES.length];
        fromV = VALUES[(cycle + VALUES.length - 1) % VALUES.length];
        topSpeed = 0;
    }
    function update(dt) {
        void dt;
    }
    function reelDur(i) { return STOP_BASE + STOP_STEP * i; }
    // 릴 i 의 총 이동 칸 수 — 오른쪽일수록 더 많이 돌고, 마지막은 목표 숫자에 정확히 닿도록 10 으로 나눈 나머지를 맞춘다
    function reelDist(i, a, b) {
        const base = 30 + 6 * i;
        return base + mod(b - a - base, 10);
    }
    function draw() {
        const a = digitsOf(fromV, REELS);
        const b = digitsOf(toV, REELS);
        let fast = 0;
        for (let i = 0; i < REELS; i += 1) {
            const u = clamp((sceneT - START_S) / reelDur(i), 0, 1);
            const dist = reelDist(i, a[i], b[i]);
            const pos = a[i] + dist * easeOut3(u);
            // 속도 = 위치의 미분 — 처음이 가장 빠르고 멈출 때 0
            const speed = u > 0 && u < 1 ? dist * 3 * (1 - u) * (1 - u) / reelDur(i) : 0;
            moveStrip(strips[i], pos, speed);
            // 멈추는 순간 켜진 옅은 하늘·라일락 불빛이 0.35초 동안 꺼진다
            const sinceStop = sceneT - START_S - reelDur(i);
            glowStrip(strips[i], sinceStop >= 0 ? 1 - sinceStop / 0.35 : 0);
            if (speed > fast) {
                fast = speed;
            }
        }
        topSpeed = fast;
    }
    function stoppedReels() {
        let n = 0;
        for (let i = 0; i < REELS; i += 1) {
            if (sceneT - START_S >= reelDur(i)) {
                n += 1;
            }
        }
        return n;
    }
    function isSettled() { return stoppedReels() >= REELS; }
    function statusText() {
        return 'いちばん速いリール {v}マス/秒・止まったリール {k}/5'.replace('{v}', String(Math.round(topSpeed))).replace('{k}', String(stoppedReels()));
    }
    function finalText() {
        return '抽選番号は {n} です'.replace('{n}', String(toV).padStart(5, '0'));
    }
    let shownStatus = '';
    function pushStatus(s) {
        if (s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    // 바뀐 최종 값은 한 번만 알린다 — 굴러가는 중간 숫자는 읽는 쪽으로 보내지 않는다
    let wasSettled = false;
    function checkSettled() {
        const s = isSettled();
        if (s && !wasSettled) {
            liveEl.textContent = finalText();
        }
        wasSettled = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 알림 영역을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        liveEl.setAttribute('aria-live', 'polite');
    }
    // 한 프레임에 넘기는 시간 상한(초) — 오래 숨었다 돌아온 첫 프레임도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    function advance(dt) {
        sceneT += dt;
        if (sceneT >= LOOP_S) {
            sceneT -= LOOP_S;
            cycle += 1;
            reset();
        }
        update(dt);
    }
    function paint() {
        draw();
        pushStatus(statusText());
        checkSettled();
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        paint();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 굴림 없이 이 값의 최종 숫자 한 장
    function showRest() {
        stopLoop();
        sceneT = 0;
        reset();
        for (let k = 0; k < Math.ceil(REST_T * 60); k += 1) {
            sceneT += 1 / 60;
            update(1 / 60);
        }
        paint();
    }
    function play() {
        sceneT = 0;
        reset();
        paint();
        if (!paused) {
            startLoop();
        }
    }
    // 다음 값 — 눌렀을 때 바로 다음 목표로 넘어가 처음부터 굴린다(움직임 줄이기에서는 즉시 최종 숫자)
    function nextNow() {
        wake();
        cycle += 1;
        wasSettled = false;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    // 무대 버튼 — 누르면(Enter·Space·클릭은 브라우저가 click 으로 준다) 다음 값. 오른쪽·위 화살표도 같다
    pad.addEventListener('click', nextNow, { signal: off.signal });
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
            e.preventDefault();
            nextNow();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 최종 숫자 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    build();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
