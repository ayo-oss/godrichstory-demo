<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마찰로 감속해 눈금에 붙는 관성 다이얼 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__scene" data-role="scene" role="img" aria-label="처음 속도를 받은 다이얼이 마찰로 점점 느려지다 가장 가까운 눈금에 끌려 들어가 멈추고, 아래 작은 숫자는 숨은 탭이 돌아온 긴 한 프레임을 그대로 받아 몰려 굴러가 다른 숫자에 선다"></div>
  <button class="vj__pad" data-role="pad" type="button" aria-label="숫자 장면 무대 — 누르거나 Enter, 오른쪽·위 화살표로 다음 값 굴리기"></button>
  <p class="vj__status" data-role="status" aria-hidden="true">숫자 롤링 장면</p>
  <p class="vj__live" data-role="live" role="status" aria-live="off"></p>
  <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    const cls = (s) => s;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function mod(a, n) { return ((a % n) + n) % n; }
    // 감속 곡선 — 처음이 가장 빠르고 끝에서 0 으로 닿는다(3제곱)
    function easeOut3(x) { const u = 1 - clamp(x, 0, 1); return 1 - u * u * u; }
    function easeInOut(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 장면 시계(초) — 장면 계산이 고치고 화면 쪽이 읽는다
    let sceneT = 0;
    // 지금 몇 번째 값인가 — 한 바퀴(LOOP_S)가 돌 때마다 하나 올라 다음 목표 값을 고른다
    let cycle = 0;
    // 숫자띠 한 줄의 칸 수 — 0 부터 9 까지 열 칸에 0, 1 을 한 번 더 붙여 9 에서 0 으로 넘어가는 경계를 끊김 없이 잇는다
    const CELLS = 12;
    // 번짐 기준 속도(칸/초) — 이만큼 빠르면 번짐이 최대. 꼬리 한 장의 간격(칸)
    const BLUR_REF = 60;
    const BLUR_LAG = 0.55;
    function mk(tag, name, parent) {
        const e = document.createElement(tag);
        e.className = cls(name);
        if (parent) {
            parent.appendChild(e);
        }
        return e;
    }
    // 자리 하나 — 창 하나에 0~9 띠(ghosts 장의 꼬리 띠 포함)와 속도 반짝임 층
    function makeStrip(parent, extra, ghosts) {
        const win = mk('span', 'dg ' + extra, parent);
        // 속도 반짝임 층은 띠 뒤에 깐다 — 숫자 글자는 항상 그 위에서 또렷하다
        const glow = mk('span', 'dg__glow', win);
        const cols = [];
        for (let g = 0; g <= ghosts; g += 1) {
            const col = mk('span', g === 0 ? 'dg__col' : 'dg__col dg__ghost', win);
            for (let i = 0; i < CELLS; i += 1) {
                const c = mk('span', 'dg__cell', col);
                c.textContent = String(i % 10);
            }
            cols.push(col);
        }
        return { win: win, cols: cols, glow: glow };
    }
    function putCol(col, pos) {
        col.style.transform = 'translateY(' + (-mod(pos, 10) / CELLS * 100).toFixed(3) + '%)';
    }
    // pos = 지금 띠가 밀려 올라온 칸 수(소수), speed = 칸/초(방향 포함). 꼬리 띠가 있으면 속도에 비례해 번진다
    function moveStrip(s, pos, speed) {
        putCol(s.cols[0], pos);
        if (s.cols.length < 2) {
            return;
        }
        const sp = clamp(Math.abs(speed) / BLUR_REF, 0, 1);
        const dir = speed < 0 ? -1 : 1;
        s.cols[0].style.opacity = (1 - 0.5 * sp).toFixed(3);
        for (let g = 1; g < s.cols.length; g += 1) {
            putCol(s.cols[g], pos - dir * sp * BLUR_LAG * g);
            s.cols[g].style.opacity = (0.5 * sp / g).toFixed(3);
        }
    }
    function glowStrip(s, v) { s.glow.style.opacity = clamp(v, 0, 1).toFixed(3); }
    // 칸 패턴 — d 는 숫자띠 한 자리, 그 밖의 글자는 구분 기호(쉼표·점·콜론). 왼쪽부터 순서대로 돌려준다
    function buildRow(parent, pattern, extra, ghosts) {
        const row = mk('span', 'odo ' + extra, parent);
        const out = [];
        for (const ch of pattern) {
            if (ch === 'd') {
                out.push(makeStrip(row, extra, ghosts));
            }
            else {
                const sep = mk('span', 'odo__sep', row);
                sep.textContent = ch;
            }
        }
        return out;
    }
    // 정수를 len 자리 숫자 배열로(왼쪽 자리부터)
    function digitsOf(n, len) {
        const out = [];
        for (let i = 0; i < len; i += 1) {
            out.push(Math.floor(n / Math.pow(10, len - 1 - i)) % 10);
        }
        return out;
    }
    function fmtNum(n) {
        const s = String(Math.round(n));
        let out = '';
        for (let i = 0; i < s.length; i += 1) {
            if (i > 0 && (s.length - i) % 3 === 0) {
                out += ',';
            }
            out += s.charAt(i);
        }
        return out;
    }
    function q(role) {
        const e = root.querySelector('[data-role="' + role + '"]');
        if (!(e instanceof HTMLElement)) {
            throw new Error('missing ' + role);
        }
        return e;
    }
    const scene = q('scene');
    const pad = q('pad');
    const pauseBtn = q('pause');
    const statusEl = q('status');
    const liveEl = q('live');
    const LOOP_S = 3.0;
    const REST_T = 2.6;
    const START_S = 0.25;
    // 마찰 — 60Hz 한 프레임마다 속도가 이 비율만 남는다. 프레임 길이가 달라도 같게 pow(FRICTION, dt*60) 으로 환산한다
    const FRICTION = 0.92;
    // 속도(칸/초)가 이 아래로 내려오면 가장 가까운 눈금으로 끌려 들어간다 · 끌려 들어가는 빠르기(1/초)
    const SNAP_V = 3;
    const SNAP_RATE = 14;
    // 처음 건 속도(칸/초)와 시작 눈금
    const FLICKS = [90, -76, 110];
    const STARTS = [2, 7, 4];
    // 잘못된 쪽 — 탭이 숨었다 돌아온 것처럼 한 프레임에 이만큼(초)의 시간이 한꺼번에 넘어온다
    const SPIKE_S = 0.5;
    const SPIKE_EXTRA = 0.4;
    const TICK_CQW = 7;
    const TICK_COUNT = 17;
    let good = { x: 0, v: 0, snapTo: 0, flicked: false, snapping: false, spiked: false };
    let bad = { x: 0, v: 0, snapTo: 0, flicked: false, snapping: false, spiked: false };
    let mainStrip;
    let badStrip;
    let ruler;
    let ticks = [];
    function freshDial(x) { return { x: x, v: 0, snapTo: x, flicked: false, snapping: false, spiked: false }; }
    function build() {
        scene.textContent = '';
        const stack = mk('div', 'stack', scene);
        mk('span', 'cap', stack).textContent = '마찰로 느려져 눈금에 붙는 다이얼';
        const row = mk('span', 'odo lg', stack);
        mainStrip = makeStrip(row, 'lg', 2);
        const rw = mk('span', 'ruler', stack);
        ruler = mk('span', 'ruler__track', rw);
        ticks = [];
        for (let i = 0; i < TICK_COUNT; i += 1) {
            const t = mk('span', 'ruler__tick', ruler);
            t.style.left = ((i - (TICK_COUNT - 1) / 2) * TICK_CQW).toFixed(1) + 'cqw';
            ticks.push(t);
        }
        mk('span', 'ruler__needle', rw);
        mk('span', 'cap cap--bad', stack).textContent = '탭이 숨었다 돌아온 뒤 몰려 굴러간 숫자';
        const row2 = mk('span', 'odo sm', stack);
        badStrip = makeStrip(row2, 'sm', 0);
    }
    function reset() {
        good = freshDial(STARTS[cycle % STARTS.length]);
        bad = freshDial(STARTS[cycle % STARTS.length]);
    }
    // 다이얼 한 걸음 — 처음 속도를 받아 미끄러지다가 속도가 SNAP_V 아래면 가장 가까운 눈금으로 끌려 들어간다
    function step(d, dt) {
        if (!d.flicked && sceneT >= START_S) {
            d.flicked = true;
            d.v = FLICKS[cycle % FLICKS.length];
        }
        if (!d.flicked) {
            return;
        }
        if (!d.snapping) {
            d.x += d.v * dt;
            d.v *= Math.pow(FRICTION, dt * 60);
            if (Math.abs(d.v) < SNAP_V) {
                d.snapping = true;
                d.snapTo = Math.round(d.x);
                d.v = 0;
            }
        }
        else {
            d.x += (d.snapTo - d.x) * (1 - Math.exp(-SNAP_RATE * dt));
            if (Math.abs(d.snapTo - d.x) < 0.002) {
                d.x = d.snapTo;
            }
        }
    }
    function update(dt) {
        step(good, dt);
        // 잘못된 쪽은 시간 상한 없이 한 번 크게 받는다
        let dtBad = dt;
        if (!bad.spiked && sceneT >= SPIKE_S) {
            bad.spiked = true;
            dtBad = dt + SPIKE_EXTRA;
        }
        step(bad, dtBad);
    }
    function drawRuler(x) {
        const fl = Math.floor(x);
        ruler.style.transform = 'translateX(' + (-(x - fl) * TICK_CQW).toFixed(3) + 'cqw)';
        const mid = (TICK_COUNT - 1) / 2;
        for (let i = 0; i < TICK_COUNT; i += 1) {
            const at = fl + i - mid;
            ticks[i].classList.toggle(cls('is-major'), mod(at, 5) === 0);
            const label = String(mod(at, 10));
            if (ticks[i].textContent !== label) {
                ticks[i].textContent = label;
            }
        }
    }
    function draw() {
        moveStrip(mainStrip, good.x, good.snapping ? 0 : good.v);
        glowStrip(mainStrip, Math.abs(good.v) / BLUR_REF);
        drawRuler(good.x);
        moveStrip(badStrip, bad.x, 0);
        glowStrip(badStrip, bad.spiked && Math.abs(bad.x - good.x) > 0.5 ? 0.9 : 0);
    }
    function isSettled() { return good.snapping && Math.abs(good.snapTo - good.x) < 0.002; }
    function statusText() {
        return '속도 {v}칸/초 · 눈금 {n}'.replace('{v}', String(Math.round(Math.abs(good.v)))).replace('{n}', String(mod(Math.round(good.x), 10)));
    }
    function finalText() {
        return '다이얼이 {n} 에 멈췄습니다'.replace('{n}', String(mod(good.snapTo, 10)));
    }
    let shownStatus = '';
    function pushStatus(s) {
        if (s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    // 바뀐 최종 값은 한 번만 알린다 — 굴러가는 중간 숫자는 읽는 쪽으로 보내지 않는다
    let wasSettled = false;
    function checkSettled() {
        const s = isSettled();
        if (s && !wasSettled) {
            liveEl.textContent = finalText();
        }
        wasSettled = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 알림 영역을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        liveEl.setAttribute('aria-live', 'polite');
    }
    // 한 프레임에 넘기는 시간 상한(초) — 오래 숨었다 돌아온 첫 프레임도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    function advance(dt) {
        sceneT += dt;
        if (sceneT >= LOOP_S) {
            sceneT -= LOOP_S;
            cycle += 1;
            reset();
        }
        update(dt);
    }
    function paint() {
        draw();
        pushStatus(statusText());
        checkSettled();
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        paint();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 굴림 없이 이 값의 최종 숫자 한 장
    function showRest() {
        stopLoop();
        sceneT = 0;
        reset();
        for (let k = 0; k < Math.ceil(REST_T * 60); k += 1) {
            sceneT += 1 / 60;
            update(1 / 60);
        }
        paint();
    }
    function play() {
        sceneT = 0;
        reset();
        paint();
        if (!paused) {
            startLoop();
        }
    }
    // 다음 값 — 눌렀을 때 바로 다음 목표로 넘어가 처음부터 굴린다(움직임 줄이기에서는 즉시 최종 숫자)
    function nextNow() {
        wake();
        cycle += 1;
        wasSettled = false;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    // 무대 버튼 — 누르면(Enter·Space·클릭은 브라우저가 click 으로 준다) 다음 값. 오른쪽·위 화살표도 같다
    pad.addEventListener('click', nextNow, { signal: off.signal });
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
            e.preventDefault();
            nextNow();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 최종 숫자 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    build();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
