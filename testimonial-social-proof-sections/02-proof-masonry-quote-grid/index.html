<script>
(function () {
  var root = document.querySelector('.qm');
  var cards = [].slice.call(root.querySelectorAll('.qm__card'));

  // 사람이 손을 대면 자동 순번은 멈추고 호버·포커스 확대(transition)만 남는다
  function stopLoop() { root.classList.remove('is-demo'); }

  cards.forEach(function (card, i) {
    card.addEventListener('keydown', function (e) {
      var to = -1;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { to = (i + 1) % cards.length; }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { to = (i - 1 + cards.length) % cards.length; }
      if (e.key === 'Home') { to = 0; }
      if (e.key === 'End') { to = cards.length - 1; }
      if (to < 0) { return; }
      e.preventDefault();
      stopLoop();
      cards[to].focus({ preventScroll: true });
    });
  });

  root.addEventListener('pointerenter', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
