<script>
(function () {
  var root = document.querySelector('.tb');
  var replay = root.querySelector('.tb__replay');

  function stopLoop() { root.classList.remove('is-demo'); }

  // 다시 세기 — 루프를 끄고 카운트업·도장을 한 번만 돌린다 (끝나면 최종값에서 멈춘다)
  replay.addEventListener('click', function () {
    stopLoop();
    root.classList.remove('is-count');
    void root.offsetWidth;            // 클래스를 다시 붙여도 애니메이션이 되감기도록 리플로를 한 번
    root.classList.add('is-count');
  });

  root.addEventListener('pointerenter', stopLoop);
  root.addEventListener('touchstart', stopLoop, { passive: true });
  root.addEventListener('focusin', stopLoop);
})();
</script>
