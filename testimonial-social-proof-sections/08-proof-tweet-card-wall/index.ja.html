<!doctype html>
<html lang="ja">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Short post card wall — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="pw is-demo" aria-label="短いレビューカードまとめ">
    <div class="pw__wall">
      <article class="pw__card pw__card--a">
        <header class="pw__top">
          <span class="pw__ini" aria-hidden="true">デ</span>
          <a class="pw__who" href="#">
            <span class="pw__name">デザインスタジオ</span>
            <span class="pw__role">ブランドデザイナー</span>
          </a>
        </header>
        <p class="pw__body">ボタン一つの修正に深夜までかからなくなった</p>
        <p class="pw__likes" role="img" aria-label="いいね128件">
          <svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true" focusable="false" fill="currentColor"><path d="M232,102c0,66-104,122-104,122S24,168,24,102A54,54,0,0,1,78,48c22.59,0,41.94,12.31,50,32,8.06-19.69,27.41-32,50-32A54,54,0,0,1,232,102Z" opacity="0.2"/><path d="M178,40c-20.65,0-38.73,8.88-50,23.89C116.73,48.88,98.65,40,78,40a62.07,62.07,0,0,0-62,62c0,70,103.79,126.66,108.21,129a8,8,0,0,0,7.58,0C136.21,228.66,240,172,240,102A62.07,62.07,0,0,0,178,40ZM128,214.8C109.74,204.16,32,155.69,32,102A46.06,46.06,0,0,1,78,56c19.45,0,35.78,10.36,42.6,27a8,8,0,0,0,14.8,0c6.82-16.67,23.15-27,42.6-27a46.06,46.06,0,0,1,46,46C224,155.61,146.24,204.15,128,214.8Z"/></svg><span class="pw__count">128</span>
        </p>
      </article>

      <article class="pw__card pw__card--b">
        <header class="pw__top">
          <span class="pw__ini" aria-hidden="true">小</span>
          <a class="pw__who" href="#">
            <span class="pw__name">小規模な開発チーム</span>
            <span class="pw__role">フロントエンド担当</span>
          </a>
        </header>
        <p class="pw__body">枠線を一本変えたら問い合わせが減った</p>
        <p class="pw__likes" role="img" aria-label="いいね86件">
          <svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true" focusable="false" fill="currentColor"><path d="M232,102c0,66-104,122-104,122S24,168,24,102A54,54,0,0,1,78,48c22.59,0,41.94,12.31,50,32,8.06-19.69,27.41-32,50-32A54,54,0,0,1,232,102Z" opacity="0.2"/><path d="M178,40c-20.65,0-38.73,8.88-50,23.89C116.73,48.88,98.65,40,78,40a62.07,62.07,0,0,0-62,62c0,70,103.79,126.66,108.21,129a8,8,0,0,0,7.58,0C136.21,228.66,240,172,240,102A62.07,62.07,0,0,0,178,40ZM128,214.8C109.74,204.16,32,155.69,32,102A46.06,46.06,0,0,1,78,56c19.45,0,35.78,10.36,42.6,27a8,8,0,0,0,14.8,0c6.82-16.67,23.15-27,42.6-27a46.06,46.06,0,0,1,46,46C224,155.61,146.24,204.15,128,214.8Z"/></svg><span class="pw__count">86</span>
        </p>
      </article>

      <article class="pw__card pw__card--c">
        <header class="pw__top">
          <span class="pw__ini" aria-hidden="true">コ</span>
          <a class="pw__who" href="#">
            <span class="pw__name">コピーライター・編集者</span>
            <span class="pw__role">コンテンツ運営</span>
          </a>
        </header>
        <p class="pw__body">説明書なしでそのまま貼って使えた</p>
        <p class="pw__likes" role="img" aria-label="いいね47件">
          <svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true" focusable="false" fill="currentColor"><path d="M232,102c0,66-104,122-104,122S24,168,24,102A54,54,0,0,1,78,48c22.59,0,41.94,12.31,50,32,8.06-19.69,27.41-32,50-32A54,54,0,0,1,232,102Z" opacity="0.2"/><path d="M178,40c-20.65,0-38.73,8.88-50,23.89C116.73,48.88,98.65,40,78,40a62.07,62.07,0,0,0-62,62c0,70,103.79,126.66,108.21,129a8,8,0,0,0,7.58,0C136.21,228.66,240,172,240,102A62.07,62.07,0,0,0,178,40ZM128,214.8C109.74,204.16,32,155.69,32,102A46.06,46.06,0,0,1,78,56c19.45,0,35.78,10.36,42.6,27a8,8,0,0,0,14.8,0c6.82-16.67,23.15-27,42.6-27a46.06,46.06,0,0,1,46,46C224,155.61,146.24,204.15,128,214.8Z"/></svg><span class="pw__count">47</span>
        </p>
      </article>
    </div>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.pw');
  var links = [].slice.call(root.querySelectorAll('.pw__who'));

  function stopLoop() { root.classList.remove('is-demo'); }

  // 카드 사이를 좌우 화살표로 옮겨 다닌다 (Home·End 는 양 끝)
  links.forEach(function (a, i) {
    a.addEventListener('keydown', function (e) {
      var to = -1;
      if (e.key === 'ArrowRight') { to = (i + 1) % links.length; }
      if (e.key === 'ArrowLeft') { to = (i - 1 + links.length) % links.length; }
      if (e.key === 'Home') { to = 0; }
      if (e.key === 'End') { to = links.length - 1; }
      if (to < 0) { return; }
      e.preventDefault();
      stopLoop();
      links[to].focus({ preventScroll: true });
    });
  });

  root.addEventListener('pointerenter', stopLoop);
  root.addEventListener('touchstart', stopLoop, { passive: true });
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
