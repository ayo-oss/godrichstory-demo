<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video testimonial thumbnail grid — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="vg is-demo" aria-label="Video testimonials">
    <div class="vg__grid">
      <button class="vg__item vg__item--1" type="button" aria-expanded="false">
        <span class="vg__thumb vg__thumb--a">
          <span class="vg__play"><svg viewBox="0 0 256 256" width="16" height="16" aria-hidden="true" focusable="false" fill="currentColor"><path d="M228.23,134.69,84.15,222.81A8,8,0,0,1,72,216.12V39.88a8,8,0,0,1,12.15-6.69l144.08,88.12A7.82,7.82,0,0,1,228.23,134.69Z" opacity="0.2"/><path d="M232.4,114.49,88.32,26.35a16,16,0,0,0-16.2-.3A15.86,15.86,0,0,0,64,39.87V216.13A15.94,15.94,0,0,0,80,232a16.07,16.07,0,0,0,8.36-2.35L232.4,141.51a15.81,15.81,0,0,0,0-27ZM80,215.94V40l143.83,88Z"/></svg></span>
          <span class="vg__time">1:12</span>
        </span>
        <span class="vg__name">Design team lead</span>
        <span class="vg__reveal"><span class="vg__quote">Our order flow came together in three days</span></span>
      </button>

      <button class="vg__item vg__item--2" type="button" aria-expanded="false">
        <span class="vg__thumb vg__thumb--b">
          <span class="vg__play"><svg viewBox="0 0 256 256" width="16" height="16" aria-hidden="true" focusable="false" fill="currentColor"><path d="M228.23,134.69,84.15,222.81A8,8,0,0,1,72,216.12V39.88a8,8,0,0,1,12.15-6.69l144.08,88.12A7.82,7.82,0,0,1,228.23,134.69Z" opacity="0.2"/><path d="M232.4,114.49,88.32,26.35a16,16,0,0,0-16.2-.3A15.86,15.86,0,0,0,64,39.87V216.13A15.94,15.94,0,0,0,80,232a16.07,16.07,0,0,0,8.36-2.35L232.4,141.51a15.81,15.81,0,0,0,0-27ZM80,215.94V40l143.83,88Z"/></svg></span>
          <span class="vg__time">0:48</span>
        </span>
        <span class="vg__name">Online bookstore founder</span>
        <span class="vg__reveal"><span class="vg__quote">I can now edit the inventory screen myself</span></span>
      </button>

      <button class="vg__item vg__item--3" type="button" aria-expanded="false">
        <span class="vg__thumb vg__thumb--c">
          <span class="vg__play"><svg viewBox="0 0 256 256" width="16" height="16" aria-hidden="true" focusable="false" fill="currentColor"><path d="M228.23,134.69,84.15,222.81A8,8,0,0,1,72,216.12V39.88a8,8,0,0,1,12.15-6.69l144.08,88.12A7.82,7.82,0,0,1,228.23,134.69Z" opacity="0.2"/><path d="M232.4,114.49,88.32,26.35a16,16,0,0,0-16.2-.3A15.86,15.86,0,0,0,64,39.87V216.13A15.94,15.94,0,0,0,80,232a16.07,16.07,0,0,0,8.36-2.35L232.4,141.51a15.81,15.81,0,0,0,0-27ZM80,215.94V40l143.83,88Z"/></svg></span>
          <span class="vg__time">2:05</span>
        </span>
        <span class="vg__name">Academy operator</span>
        <span class="vg__reveal"><span class="vg__quote">Class signups come in even at night</span></span>
      </button>

      <button class="vg__item vg__item--4" type="button" aria-expanded="false">
        <span class="vg__thumb vg__thumb--d">
          <span class="vg__play"><svg viewBox="0 0 256 256" width="16" height="16" aria-hidden="true" focusable="false" fill="currentColor"><path d="M228.23,134.69,84.15,222.81A8,8,0,0,1,72,216.12V39.88a8,8,0,0,1,12.15-6.69l144.08,88.12A7.82,7.82,0,0,1,228.23,134.69Z" opacity="0.2"/><path d="M232.4,114.49,88.32,26.35a16,16,0,0,0-16.2-.3A15.86,15.86,0,0,0,64,39.87V216.13A15.94,15.94,0,0,0,80,232a16.07,16.07,0,0,0,8.36-2.35L232.4,141.51a15.81,15.81,0,0,0,0-27ZM80,215.94V40l143.83,88Z"/></svg></span>
          <span class="vg__time">1:36</span>
        </span>
        <span class="vg__name">Neighborhood cafe owner</span>
        <span class="vg__reveal"><span class="vg__quote">Reservation calls dropped by half</span></span>
      </button>
    </div>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.vg');
  var grid = root.querySelector('.vg__grid');
  var items = [].slice.call(root.querySelectorAll('.vg__item'));

  function stopLoop() { root.classList.remove('is-demo'); }

  // 한 칸만 열린다 — 열린 칸 번호를 격자 클래스로 옮겨 grid-template-columns 를 바꾼다
  function open(i) {
    stopLoop();
    items.forEach(function (b, n) {
      b.setAttribute('aria-expanded', n === i ? 'true' : 'false');
      grid.classList.toggle('is-open-' + n, n === i);
    });
  }

  items.forEach(function (b, i) {
    b.addEventListener('click', function () {
      open(b.getAttribute('aria-expanded') === 'true' ? -1 : i);
    });
    b.addEventListener('keydown', function (e) {
      var to = -1;
      if (e.key === 'ArrowRight') { to = (i + 1) % items.length; }
      if (e.key === 'ArrowLeft') { to = (i - 1 + items.length) % items.length; }
      if (e.key === 'Home') { to = 0; }
      if (e.key === 'End') { to = items.length - 1; }
      if (to < 0) { return; }
      e.preventDefault();
      stopLoop();
      items[to].focus({ preventScroll: true });
    });
  });

  root.addEventListener('pointerenter', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
