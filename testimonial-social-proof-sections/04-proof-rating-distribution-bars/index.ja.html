<script>
(function () {
  var root = document.querySelector('.rd');
  var rows = [].slice.call(root.querySelectorAll('.rd__row'));

  // 사람이 손을 대면 미리보기 루프를 끄고 정적 상태(최종 폭·최종 숫자)로 남긴다
  function stopLoop() { root.classList.remove('is-demo'); }

  // 별점 줄을 누르면 그 점수만 골라 보는 필터 — 상점 평점 블록이 실제로 하는 동작
  rows.forEach(function (row) {
    row.addEventListener('click', function () {
      var was = row.getAttribute('aria-pressed') === 'true';
      stopLoop();
      rows.forEach(function (r) { r.setAttribute('aria-pressed', 'false'); });
      row.setAttribute('aria-pressed', was ? 'false' : 'true');
      root.classList.toggle('is-picked', !was);
    });
  });

  root.addEventListener('pointerenter', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
