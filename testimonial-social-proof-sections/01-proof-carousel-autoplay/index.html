<script>
(function () {
  var root = document.querySelector('.pc');
  var cards = [].slice.call(root.querySelectorAll('.pc__card'));
  var dots = [].slice.call(root.querySelectorAll('.pc__dot'));
  var toggle = root.querySelector('.pc__toggle');

  // 정적 경로 — .is-demo 를 떼면 .is-on 한 장만 보이고 점이 그 장을 가리킨다
  function show(i) {
    root.classList.remove('is-demo');
    cards.forEach(function (c, n) { c.classList.toggle('is-on', n === i); });
    dots.forEach(function (d, n) {
      d.classList.toggle('is-on', n === i);
      d.setAttribute('aria-current', n === i ? 'true' : 'false');
    });
  }

  dots.forEach(function (d, i) {
    d.addEventListener('click', function () { show(i); });
    d.addEventListener('keydown', function (e) {
      var to = -1;
      if (e.key === 'ArrowRight') { to = (i + 1) % dots.length; }
      if (e.key === 'ArrowLeft') { to = (i - 1 + dots.length) % dots.length; }
      if (to < 0) { return; }
      e.preventDefault();
      show(to);
      dots[to].focus({ preventScroll: true });
    });
  });

  // 정지 버튼 — 순환을 그 자리에 세운다 (animation-play-state: paused)
  toggle.addEventListener('click', function () {
    var on = toggle.getAttribute('aria-pressed') === 'true';
    toggle.setAttribute('aria-pressed', on ? 'false' : 'true');
    root.classList.toggle('is-paused', !on);
  });
})();
</script>
