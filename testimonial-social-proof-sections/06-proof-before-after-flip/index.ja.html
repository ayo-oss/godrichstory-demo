<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before-and-after flip card — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ba is-demo" aria-label="導入前後の数値比較">
    <ul class="ba__list">
      <li class="ba__item ba__item--1">
        <button class="ba__card" type="button" aria-pressed="false">
          <span class="ba__inner">
            <span class="ba__face ba__face--front">
              <span class="ba__tag">導入前</span>
              <span class="ba__val">34時間</span>
              <span class="ba__cap">初回応答時間</span>
            </span>
            <span class="ba__face ba__face--back">
              <span class="ba__tag">導入後</span>
              <span class="ba__val">2時間</span>
              <span class="ba__badge">
                <svg viewBox="0 0 256 256" width="12" height="12" fill="currentColor" aria-hidden="true" focusable="false"><path d="M216,128l-72,72V56Z" opacity="0.2"/><path d="M221.66,122.34l-72-72A8,8,0,0,0,136,56v64H40a8,8,0,0,0,0,16h96v64a8,8,0,0,0,13.66,5.66l72-72A8,8,0,0,0,221.66,122.34ZM152,180.69V75.31L204.69,128Z"/></svg>
                17倍速く
              </span>
            </span>
          </span>
          <span class="ba__bar" aria-hidden="true"><span class="ba__bar-bg"></span><span class="ba__bar-fill"></span></span>
        </button>
      </li>

      <li class="ba__item ba__item--2">
        <button class="ba__card" type="button" aria-pressed="false">
          <span class="ba__inner">
            <span class="ba__face ba__face--front">
              <span class="ba__tag">導入前</span>
              <span class="ba__val">18%</span>
              <span class="ba__cap">リピート率</span>
            </span>
            <span class="ba__face ba__face--back">
              <span class="ba__tag">導入後</span>
              <span class="ba__val">41%</span>
              <span class="ba__badge">
                <svg viewBox="0 0 256 256" width="12" height="12" fill="currentColor" aria-hidden="true" focusable="false"><path d="M232,56v64L168,56Z" opacity="0.2"/><path d="M232,48H168a8,8,0,0,0-5.66,13.66L188.69,88,136,140.69l-34.34-34.35a8,8,0,0,0-11.32,0l-72,72a8,8,0,0,0,11.32,11.32L96,123.31l34.34,34.35a8,8,0,0,0,11.32,0L200,99.31l26.34,26.35A8,8,0,0,0,240,120V56A8,8,0,0,0,232,48Zm-8,52.69L187.31,64H224Z"/></svg>
                2.3倍に増加
              </span>
            </span>
          </span>
          <span class="ba__bar" aria-hidden="true"><span class="ba__bar-bg"></span><span class="ba__bar-fill"></span></span>
        </button>
      </li>

      <li class="ba__item ba__item--3">
        <button class="ba__card" type="button" aria-pressed="false">
          <span class="ba__inner">
            <span class="ba__face ba__face--front">
              <span class="ba__tag">導入前</span>
              <span class="ba__val">3.4</span>
              <span class="ba__cap">平均評価</span>
            </span>
            <span class="ba__face ba__face--back">
              <span class="ba__tag">導入後</span>
              <span class="ba__val">4.7</span>
              <span class="ba__badge">
                <svg viewBox="0 0 256 256" width="12" height="12" fill="currentColor" aria-hidden="true" focusable="false"><path d="M232,56v64L168,56Z" opacity="0.2"/><path d="M232,48H168a8,8,0,0,0-5.66,13.66L188.69,88,136,140.69l-34.34-34.35a8,8,0,0,0-11.32,0l-72,72a8,8,0,0,0,11.32,11.32L96,123.31l34.34,34.35a8,8,0,0,0,11.32,0L200,99.31l26.34,26.35A8,8,0,0,0,240,120V56A8,8,0,0,0,232,48Zm-8,52.69L187.31,64H224Z"/></svg>
                1.3ポイント上昇
              </span>
            </span>
          </span>
          <span class="ba__bar" aria-hidden="true"><span class="ba__bar-bg"></span><span class="ba__bar-fill"></span></span>
        </button>
      </li>
    </ul>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.ba');
  var cards = [].slice.call(root.querySelectorAll('.ba__card'));

  // 사람이 손을 대면 미리보기 컷 루프를 끄고 앞면으로 돌려 둔다
  function stopLoop() { root.classList.remove('is-demo'); }

  // 진짜 <button> 이라 Enter·Space 는 브라우저가 click 으로 넘겨준다 (터치도 같은 경로)
  cards.forEach(function (card) {
    card.addEventListener('click', function () {
      var was = card.getAttribute('aria-pressed') === 'true';
      stopLoop();
      card.setAttribute('aria-pressed', was ? 'false' : 'true');
    });
  });

  root.addEventListener('pointerenter', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
