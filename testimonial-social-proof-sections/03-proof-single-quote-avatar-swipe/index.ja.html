<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big quote with avatar switcher — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="qs is-demo" aria-label="お客様の声の大型引用">

    <div class="qs__body" aria-live="polite">
      <p class="qs__quote qs__quote--1 is-on">データを初めて見る人も、どこを直すべきかすぐ分かるようになりました。</p>
      <p class="qs__quote qs__quote--2">問い合わせの電話が減り、注文は自然に入ってきます。</p>
      <p class="qs__quote qs__quote--3">会議が短くなりました。画面が代わりに説明します。</p>
      <p class="qs__quote qs__quote--4">初めて一人で作ったサイトが、今では町で一番大きく見えます。</p>

      <p class="qs__by qs__by--1 is-on">運営チーム マネージャー · オンライン書店</p>
      <p class="qs__by qs__by--2">店主 · 町のパン屋</p>
      <p class="qs__by qs__by--3">デザインチーム リーダー · 手作り家具の工房</p>
      <p class="qs__by qs__by--4">代表 · 花屋</p>
    </div>

    <div class="qs__rail" role="group" aria-label="表示するレビューの人を選ぶ">
      <span class="qs__ring" aria-hidden="true"></span>
      <span class="qs__cell">
        <button class="qs__face qs__face--1 is-on" type="button" aria-pressed="true"><span class="qs__initial" aria-hidden="true">K</span></button>
      </span>
      <span class="qs__cell">
        <button class="qs__face qs__face--2" type="button" aria-pressed="false"><span class="qs__initial" aria-hidden="true">P</span></button>
      </span>
      <span class="qs__cell">
        <button class="qs__face qs__face--3" type="button" aria-pressed="false"><span class="qs__initial" aria-hidden="true">Y</span></button>
      </span>
      <span class="qs__cell">
        <button class="qs__face qs__face--4" type="button" aria-pressed="false"><span class="qs__initial" aria-hidden="true">H</span></button>
      </span>
    </div>

  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.qs');
  var faces = [].slice.call(root.querySelectorAll('.qs__face'));
  var quotes = [].slice.call(root.querySelectorAll('.qs__quote'));
  var bys = [].slice.call(root.querySelectorAll('.qs__by'));
  var ring = root.querySelector('.qs__ring');

  // 정적 경로 — .is-demo 를 떼면 .is-on 넷 중 하나만 보인다
  function pick(i) {
    root.classList.remove('is-demo');
    faces.forEach(function (f, n) {
      f.classList.toggle('is-on', n === i);
      f.setAttribute('aria-pressed', n === i ? 'true' : 'false');
    });
    quotes.forEach(function (q, n) { q.classList.toggle('is-on', n === i); });
    bys.forEach(function (b, n) { b.classList.toggle('is-on', n === i); });
    // 링은 자기 칸 폭 기준(100%)으로 옮긴다 — 짐작한 px 를 쓰지 않는다.
    // --i 는 링 "자신"에 걸어야 먹는다 (부모·트랙이 아니라)
    ring.style.setProperty('--i', String(i));
  }

  faces.forEach(function (f, i) {
    f.addEventListener('click', function () { pick(i); });
    f.addEventListener('keydown', function (e) {
      var to = -1;
      if (e.key === 'ArrowRight') { to = (i + 1) % faces.length; }
      if (e.key === 'ArrowLeft') { to = (i - 1 + faces.length) % faces.length; }
      if (to < 0) { return; }
      e.preventDefault();
      pick(to);
      faces[to].focus({ preventScroll: true });
    });
  });
})();
</script>
</body>
</html>
