<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>軌道半径の値が縮める磁場ローダー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">
    <svg class="ld__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 56v56a8 8 0 0 1-16 0V91.3l-25.6 25.7A80 80 0 1 1 174 60a8 8 0 1 1-9 13.2A64 64 0 1 0 179.7 128H216a8 8 0 0 1 0 16h-56a8 8 0 0 1-8-8V80a8 8 0 0 1 16 0v20.7L192.7 76A80.1 80.1 0 0 0 64 128a8 8 0 0 1-16 0a96 96 0 0 1 163.6-68.3L224 71.3V56a8 8 0 0 1 8 8" opacity=".2"/><path d="M224 48a8 8 0 0 0-8 8v15.3l-11.7-11.6a96 96 0 1 0 27.6 51.6a8 8 0 0 0-15.8 2.5a80 80 0 1 1-23-43l-25.7 25.7A8 8 0 0 0 173 112h56a8 8 0 0 0 8-8V56a8 8 0 0 0-13-8"/></g></svg>
    <span>クリックするかスペースバーを押すと一時停止または再開します</span>
  </p>
  <div class="ld__field" id="field" role="application" aria-label="磁場軌道吸引テストパネル" tabindex="0">
    <canvas class="ld__cv" id="cv"></canvas>
    <b class="ld__badge" aria-hidden="true"><span class="ld__badgeNum" id="pct">0%</span><span class="ld__badgeUnit">吸引</span></b>
  </div>
</div>
</main>
<script>
// 자기장 로더 — 입자 여러 개가 코어를 돈다. 軌道 반지름은 진행률에 비례해 줄어들고
// 진행률이 1 에 닿는 순간 반지름이 정확히 0(코어에 흡수)이 되었다가 다음 루프에서 다시 퍼진다.
var root = document.getElementById('ld');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var pctEl = document.getElementById('pct');

var css = getComputedStyle(root);
var PAPER = css.getPropertyValue('--paper').trim();
var PAPER_FADE = css.getPropertyValue('--paper-fade').trim();
var CORE = css.getPropertyValue('--core').trim();
var LINE = css.getPropertyValue('--line').trim();
var P1 = css.getPropertyValue('--p1').trim();
var P2 = css.getPropertyValue('--p2').trim();
var P3 = css.getPropertyValue('--p3').trim();
var PALETTE = [P1, P2, P3];

function makeRng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (1103515245 * s + 12345) >>> 0;
    return (s >>> 8) / 16777216;
  };
}

var N = 10;
var LOOP = 2.4;
var rng = makeRng(20260925);
var parts = [];
for (var i = 0; i < N; i++) {
  parts.push({
    r0: 0.42 + rng() * 0.56,               // 軌道 반지름 비율(필드 반지름 대비) — 吸引 시작점
    phase: rng() * Math.PI * 2,
    speed: (0.55 + rng() * 0.9) * (rng() < 0.5 ? -1 : 1)
  });
}

var W = 0, H = 0, dpr = 1, cxp = 0, cyp = 0, fieldR = 0;

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cxp = W * 0.5; cyp = H * 0.5;
  fieldR = Math.min(W, H) * 0.44;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
}

function draw(sec) {
  var t = sec % LOOP;
  var p = t / LOOP;                       // 0→1 진행률
  var shrink = 1 - p;                     // 軌道 반지름 배율 — p=1 에서 정확히 0(吸引 완료)

  ctx.fillStyle = PAPER_FADE;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1.6;
  for (var i = 0; i < N; i++) {
    var q = parts[i];
    var rad = fieldR * q.r0 * shrink;
    var ang = q.phase + sec * q.speed;
    var x = cxp + Math.cos(ang) * rad;
    var y = cyp + Math.sin(ang) * rad;
    ctx.beginPath();
    ctx.moveTo(cxp, cyp);
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.beginPath();
    ctx.arc(x, y, 6.2, 0, Math.PI * 2);
    ctx.fill();
  }

  var coreR = 8 + (1 - shrink) * 14;      // 흡인이 진행될수록 코어가 커진다(자기장이 강해지는 느낌)
  var grad = ctx.createRadialGradient(cxp, cyp, 0, cxp, cyp, coreR * 2.2);
  grad.addColorStop(0, CORE);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cxp, cyp, coreR * 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = CORE;
  ctx.beginPath();
  ctx.arc(cxp, cyp, coreR, 0, Math.PI * 2);
  ctx.fill();

  pctEl.textContent = Math.round(p * 100) + '%';
}

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var paused = false;
var t0 = 0;
var raf = 0;

function togglePause() {
  paused = !paused;
  root.classList.toggle('is-paused', paused);
}
function restart() {
  t0 = performance.now();
  fit();
  draw(0);
}

field.addEventListener('click', function () { togglePause(); });
field.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restart(); }
});
window.addEventListener('resize', function () {
  fit();
  if (paused || reduce) draw(((performance.now() - t0) / 1000));
});

function frame(now) {
  if (!paused) draw((now - t0) / 1000);
  raf = requestAnimationFrame(frame);
}

t0 = performance.now();
fit();
if (reduce) {
  root.classList.add('is-still');
  draw(LOOP * 0.62);
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
