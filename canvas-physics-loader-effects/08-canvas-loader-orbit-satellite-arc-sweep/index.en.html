<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader an Arc-sweep Angle Value Sweeps Satellites Around — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">
    <svg class="ld__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 56v56a8 8 0 0 1-16 0V91.3l-25.6 25.7A80 80 0 1 1 174 60a8 8 0 1 1-9 13.2A64 64 0 1 0 179.7 128H216a8 8 0 0 1 0 16h-56a8 8 0 0 1-8-8V80a8 8 0 0 1 16 0v20.7L192.7 76A80.1 80.1 0 0 0 64 128a8 8 0 0 1-16 0a96 96 0 0 1 163.6-68.3L224 71.3V56a8 8 0 0 1 8 8" opacity=".2"/><path d="M224 48a8 8 0 0 0-8 8v15.3l-11.7-11.6a96 96 0 1 0 27.6 51.6a8 8 0 0 0-15.8 2.5a80 80 0 1 1-23-43l-25.7 25.7A8 8 0 0 0 173 112h56a8 8 0 0 0 8-8V56a8 8 0 0 0-13-8"/></g></svg>
    <span>Click or press the space bar to pause or restart</span>
  </p>
  <div class="ld__field" id="field" role="application" aria-label="Satellite orbit angle-sweep test panel" tabindex="0">
    <canvas class="ld__cv" id="cv"></canvas>
    <b class="ld__badge" aria-hidden="true"><span class="ld__badgeNum" id="pct">0%</span><span class="ld__badgeUnit">Orbit</span></b>
  </div>
</div>
</main>
<script>
// 위성 Orbit 로더 — 각도 값 하나가 0~360°를 쓸어가고, Orbit 3개의 위성이 반지름에 반비례하는
// 배속(가까운 궤도일수록 빠름 — 단순화한 케플러 감각)으로 그 각도를 따라가며 꼬리를 남긴다.
var root = document.getElementById('ld');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var pctEl = document.getElementById('pct');

var css = getComputedStyle(root);
var PAPER = css.getPropertyValue('--paper').trim();
var ORBIT = css.getPropertyValue('--orbit').trim();
var S1 = css.getPropertyValue('--s1').trim();
var S2 = css.getPropertyValue('--s2').trim();
var S3 = css.getPropertyValue('--s3').trim();
var CORE = css.getPropertyValue('--core').trim();

var RINGS = [
  { rf: 0.30, speed: 1.0,  color: S1 },
  { rf: 0.58, speed: 0.62, color: S2 },
  { rf: 0.86, speed: 0.38, color: S3 }
];
var LOOP = 3.0;
var TRAIL_SEG = 26;
var TRAIL_SPAN = 1.1;                // 꼬리가 덮는 라디안 폭

var W = 0, H = 0, dpr = 1, cxp = 0, cyp = 0, baseR = 0;

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cxp = W * 0.5; cyp = H * 0.5;
  baseR = Math.min(W, H) * 0.46;
}

function draw(sec) {
  var t = sec % LOOP;
  var p = t / LOOP;
  var sweep = p * Math.PI * 2;         // 0→2π — 전역 스윕 각도

  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  var WIDE_SEG = 30, WIDE_SPAN = 1.7;
  for (var w = WIDE_SEG; w >= 0; w--) {
    var wa0 = sweep - WIDE_SPAN * (w / WIDE_SEG);
    var wa1 = sweep - WIDE_SPAN * ((w - 1) / WIDE_SEG);
    var walpha = (1 - w / WIDE_SEG);
    ctx.fillStyle = S1;
    ctx.globalAlpha = walpha * walpha * 0.14;
    ctx.beginPath();
    ctx.moveTo(cxp, cyp);
    ctx.arc(cxp, cyp, baseR, wa0, wa1);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (var i = 0; i < RINGS.length; i++) {
    var ring = RINGS[i];
    var rad = baseR * ring.rf;
    ctx.strokeStyle = ORBIT;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cxp, cyp, rad, 0, Math.PI * 2);
    ctx.stroke();

    var ang = sweep * ring.speed;
    for (var s = TRAIL_SEG; s >= 0; s--) {
      var a0 = ang - TRAIL_SPAN * (s / TRAIL_SEG);
      var a1 = ang - TRAIL_SPAN * ((s - 1) / TRAIL_SEG);
      var alpha = 1 - s / TRAIL_SEG;
      ctx.strokeStyle = ring.color;
      ctx.globalAlpha = alpha * alpha * 0.85;
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.arc(cxp, cyp, rad, a0, a1);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    var sx = cxp + Math.cos(ang) * rad;
    var sy = cyp + Math.sin(ang) * rad;
    ctx.fillStyle = ring.color;
    ctx.beginPath();
    ctx.arc(sx, sy, 4.6, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = CORE;
  ctx.beginPath();
  ctx.arc(cxp, cyp, 7, 0, Math.PI * 2);
  ctx.fill();

  pctEl.textContent = Math.round(p * 100) + '%';
}

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var paused = false;
var t0 = 0;
var raf = 0;

function togglePause() {
  paused = !paused;
  root.classList.toggle('is-paused', paused);
}
function restart() {
  t0 = performance.now();
  draw(0);
}

field.addEventListener('click', function () { togglePause(); });
field.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restart(); }
});
window.addEventListener('resize', function () {
  fit();
  if (paused || reduce) draw(((performance.now() - t0) / 1000));
});

function frame(now) {
  if (!paused) draw((now - t0) / 1000);
  raf = requestAnimationFrame(frame);
}

t0 = performance.now();
fit();
if (reduce) {
  root.classList.add('is-still');
  draw(LOOP * 0.62);
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
