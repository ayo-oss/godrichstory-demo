<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진행률 값이 차오르는 액체 파동 로더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">
    <svg class="ld__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 56v56a8 8 0 0 1-16 0V91.3l-25.6 25.7A80 80 0 1 1 174 60a8 8 0 1 1-9 13.2A64 64 0 1 0 179.7 128H216a8 8 0 0 1 0 16h-56a8 8 0 0 1-8-8V80a8 8 0 0 1 16 0v20.7L192.7 76A80.1 80.1 0 0 0 64 128a8 8 0 0 1-16 0a96 96 0 0 1 163.6-68.3L224 71.3V56a8 8 0 0 1 8 8" opacity=".2"/><path d="M224 48a8 8 0 0 0-8 8v15.3l-11.7-11.6a96 96 0 1 0 27.6 51.6a8 8 0 0 0-15.8 2.5a80 80 0 1 1-23-43l-25.7 25.7A8 8 0 0 0 173 112h56a8 8 0 0 0 8-8V56a8 8 0 0 0-13-8"/></g></svg>
    <span>클릭하거나 스페이스바를 누르면 멈추거나 다시 갑니다</span>
  </p>
  <div class="ld__field" id="field" role="application" aria-label="액체 파동 진행 실험판" tabindex="0">
    <canvas class="ld__cv" id="cv"></canvas>
    <b class="ld__badge" aria-hidden="true"><span class="ld__badgeNum" id="pct">0%</span><span class="ld__badgeUnit">진행</span></b>
  </div>
</div>
</main>
<script>
// 액체 파동 로더 — 진행률(0~1)을 캔버스 수면 높이로 매핑하고 사인파 두 개를 겹쳐 표면을 흔든다.
// 움직임은 전부 캔버스 rAF 루프 안에 있다. CSS 는 무대·판·배지만 맡는다 — @keyframes 0개라야
// 렌더러가 시계를 고정하지 않고 실시간으로 24장을 찍어 파동이 실제로 도는 모습이 담긴다(077 선례).
var root = document.getElementById('ld');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var pctEl = document.getElementById('pct');

var css = getComputedStyle(root);
var PAPER = css.getPropertyValue('--paper').trim();
var LIQUID = css.getPropertyValue('--liquid').trim();
var LIQUID_DEEP = css.getPropertyValue('--liquid-deep').trim();
var GLOW = css.getPropertyValue('--glow').trim();

var LOOP = 1.6;               // 로더 한 바퀴(초) — 채웠다가 다시 빈다(반복 루프)
var FREQ = 0.045;             // 파동 진동수(px 당 라디안) — fluid-wave-frequency, 공간·시간 흔들림을 함께 정한다
var AMP1 = 7, AMP2 = 3.6;
var SPEED1 = 2.1, SPEED2 = -3.0;

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1;
var paused = false;
var t0 = 0;
var raf = 0;

// 고DPI 대응 — 배킹 스토어는 devicePixelRatio 배, 그리기 좌표계는 CSS 픽셀 그대로.
function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function level(p) { return H * (1 - p); }

function draw(sec) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  var t = sec % LOOP;
  var p = t / LOOP;                  // 0→1 진행률 — 사면톱니(로더는 반복 루프라 프레임이 계속 차야 정상)
  var y0 = level(p);

  function waveY(x) {
    return y0
      + AMP1 * Math.sin(x * FREQ + sec * SPEED1)
      + AMP2 * Math.sin(x * FREQ * 1.8 + sec * SPEED2);
  }

  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, waveY(0));
  var step = 4;
  for (var x = 0; x <= W; x += step) ctx.lineTo(x, waveY(x));
  ctx.lineTo(W, H);
  ctx.closePath();
  var grad = ctx.createLinearGradient(0, y0 - 24, 0, H);
  grad.addColorStop(0, LIQUID);
  grad.addColorStop(1, LIQUID_DEEP);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  for (var x2 = 0; x2 <= W; x2 += step) {
    var y2 = waveY(x2);
    if (x2 === 0) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
  }
  ctx.strokeStyle = GLOW;
  ctx.lineWidth = 2;
  ctx.stroke();

  var pct = Math.round(p * 100);
  pctEl.textContent = pct + '%';
}

function togglePause() {
  paused = !paused;
  root.classList.toggle('is-paused', paused);
}
function restart() {
  t0 = performance.now();
  draw(0);
}

field.addEventListener('click', function () { togglePause(); });
field.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restart(); }
});
window.addEventListener('resize', function () {
  fit();
  if (paused || reduce) draw(((performance.now() - t0) / 1000));
});

function frame(now) {
  if (!paused) draw((now - t0) / 1000);
  raf = requestAnimationFrame(frame);
}

t0 = performance.now();
fit();
if (reduce) {
  root.classList.add('is-still');
  draw(LOOP * 0.62);
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
