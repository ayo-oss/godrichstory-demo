<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>到着した粒子数の値が満たす群れ収束ローダー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">
    <svg class="ld__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 56v56a8 8 0 0 1-16 0V91.3l-25.6 25.7A80 80 0 1 1 174 60a8 8 0 1 1-9 13.2A64 64 0 1 0 179.7 128H216a8 8 0 0 1 0 16h-56a8 8 0 0 1-8-8V80a8 8 0 0 1 16 0v20.7L192.7 76A80.1 80.1 0 0 0 64 128a8 8 0 0 1-16 0a96 96 0 0 1 163.6-68.3L224 71.3V56a8 8 0 0 1 8 8" opacity=".2"/><path d="M224 48a8 8 0 0 0-8 8v15.3l-11.7-11.6a96 96 0 1 0 27.6 51.6a8 8 0 0 0-15.8 2.5a80 80 0 1 1-23-43l-25.7 25.7A8 8 0 0 0 173 112h56a8 8 0 0 0 8-8V56a8 8 0 0 0-13-8"/></g></svg>
    <span>クリックするかスペースバーを押すと一時停止または再開します</span>
  </p>
  <div class="ld__field" id="field" role="application" aria-label="粒子群収束テストパネル" tabindex="0">
    <canvas class="ld__cv" id="cv"></canvas>
    <b class="ld__badge" aria-hidden="true"><span class="ld__badgeNum" id="pct">0%</span><span class="ld__badgeUnit">収束</span></b>
  </div>
</div>
</main>
<script>
// 입자 군집 収束 로더 — 무작위로 흩어진 입자 중 중심에 도착한 개수를 전체 개수로 나눈 비율이 진행률이다.
// 흩어진 시작 위치·도착 순서는 고정 シード LCG 로 정해 항상 같은 그림이 나온다(Math.random 0).
var root = document.getElementById('ld');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var pctEl = document.getElementById('pct');

var css = getComputedStyle(root);
var PAPER = css.getPropertyValue('--paper').trim();
var PAPER_FADE = css.getPropertyValue('--paper-fade').trim();
var INK = css.getPropertyValue('--ink').trim();
var DOT = css.getPropertyValue('--dot').trim();
var CORE = css.getPropertyValue('--core').trim();
var LINE = css.getPropertyValue('--line').trim();

function makeRng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (1103515245 * s + 12345) >>> 0;
    return (s >>> 8) / 16777216;
  };
}

var N = 42;
var LOOP = 1.9;
var rng = makeRng(20260923);
var order = [];
for (var oi = 0; oi < N; oi++) order.push(oi);
for (var oj = N - 1; oj > 0; oj--) {           // Fisher-Yates — 도착 순서를 고정 시드로 뒤섞는다
  var ok = Math.floor(rng() * (oj + 1));
  var tmp = order[oj]; order[oj] = order[ok]; order[ok] = tmp;
}
var particles = [];
for (var i = 0; i < N; i++) {
  var ang = rng() * Math.PI * 2;
  var rad = 0.34 + rng() * 0.62;                // 정규화 반지름(0.34~0.96) — 가장자리 쪽에 흩어진다
  particles.push({
    hx: 0.5 + Math.cos(ang) * rad * 0.5,        // 흩어진 자리(정규화 0~1)
    hy: 0.5 + Math.sin(ang) * rad * 0.5,
    px: 0, py: 0,
    rank: order[i],
    jf: 0.6 + rng() * 1.1,                       // 각자 다른 흔들림 진동수
    jp: rng() * Math.PI * 2
  });
}

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1;
var paused = false;
var t0 = 0;
var raf = 0;
var inited = false;

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!inited) {
    for (var i = 0; i < N; i++) { particles[i].px = particles[i].hx * W; particles[i].py = particles[i].hy * H; }
    inited = true;
  }
}

function draw(sec) {
  // 완전히 지우지 않고 옅은 판 색을 덧칠한다 — 입자가 지나간 자리에 꼬리가 남아
  // 군집이 살아 움직이는 느낌을 준다(궤적 잔상, 매 프레임 픽셀이 크게 바뀐다).
  ctx.fillStyle = PAPER_FADE;
  ctx.fillRect(0, 0, W, H);

  var t = sec % LOOP;
  var p = t / LOOP;                              // 0→1 진행률 — 도착 입자 비율의 목표값
  var arrived = Math.floor(p * N);
  var cx = W * 0.5, cy = H * 0.5;

  for (var i = 0; i < N; i++) {
    var q = particles[i];
    var tx, ty;
    if (q.rank < arrived) {
      var orbit = 5 + 3 * Math.sin(sec * q.jf + q.jp);
      tx = cx + Math.cos(sec * 1.4 + q.jp) * orbit;
      ty = cy + Math.sin(sec * 1.4 + q.jp) * orbit;
    } else {
      tx = q.hx * W + Math.sin(sec * q.jf + q.jp) * 4;
      ty = q.hy * H + Math.cos(sec * q.jf * 0.8 + q.jp) * 4;
    }
    q.px += (tx - q.px) * 0.14;
    q.py += (ty - q.py) * 0.14;
  }

  // 도착한 입자에서 중심으로 옅은 실선
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var j = 0; j < N; j++) {
    var qj = particles[j];
    if (qj.rank < arrived) { ctx.moveTo(qj.px, qj.py); ctx.lineTo(cx, cy); }
  }
  ctx.stroke();

  // 중심 원 — 도착 비율이 밝기·반지름을 함께 키운다
  var frac = arrived / N;
  var coreR = 10 + frac * 22;
  var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 1.8);
  glow.addColorStop(0, CORE);
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.35 + frac * 0.5;
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, coreR * 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = CORE;
  ctx.beginPath();
  ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
  ctx.fill();

  // 입자
  for (var k = 0; k < N; k++) {
    var qk = particles[k];
    ctx.fillStyle = qk.rank < arrived ? CORE : DOT;
    ctx.beginPath();
    ctx.arc(qk.px, qk.py, qk.rank < arrived ? 4 : 3.2, 0, Math.PI * 2);
    ctx.fill();
  }

  var pct = Math.round(frac * 100);
  pctEl.textContent = pct + '%';
}

function togglePause() {
  paused = !paused;
  root.classList.toggle('is-paused', paused);
}
function restart() {
  t0 = performance.now();
  draw(0);
}

field.addEventListener('click', function () { togglePause(); });
field.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restart(); }
});
window.addEventListener('resize', function () {
  fit();
  if (paused || reduce) draw(((performance.now() - t0) / 1000));
});

function frame(now) {
  if (!paused) draw((now - t0) / 1000);
  raf = requestAnimationFrame(frame);
}

t0 = performance.now();
fit();
ctx.fillStyle = PAPER;
ctx.fillRect(0, 0, W, H);
if (reduce) {
  root.classList.add('is-still');
  draw(LOOP * 0.62);
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
