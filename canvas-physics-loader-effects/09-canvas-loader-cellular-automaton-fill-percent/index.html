<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생존 규칙 값이 채우는 셀룰러 오토마타 로더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">
    <svg class="ld__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 56v56a8 8 0 0 1-16 0V91.3l-25.6 25.7A80 80 0 1 1 174 60a8 8 0 1 1-9 13.2A64 64 0 1 0 179.7 128H216a8 8 0 0 1 0 16h-56a8 8 0 0 1-8-8V80a8 8 0 0 1 16 0v20.7L192.7 76A80.1 80.1 0 0 0 64 128a8 8 0 0 1-16 0a96 96 0 0 1 163.6-68.3L224 71.3V56a8 8 0 0 1 8 8" opacity=".2"/><path d="M224 48a8 8 0 0 0-8 8v15.3l-11.7-11.6a96 96 0 1 0 27.6 51.6a8 8 0 0 0-15.8 2.5a80 80 0 1 1-23-43l-25.7 25.7A8 8 0 0 0 173 112h56a8 8 0 0 0 8-8V56a8 8 0 0 0-13-8"/></g></svg>
    <span>클릭하거나 스페이스바를 누르면 멈추거나 다시 갑니다</span>
  </p>
  <div class="ld__field" id="field" role="application" aria-label="셀룰러 오토마타 채움 실험판" tabindex="0">
    <canvas class="ld__cv" id="cv"></canvas>
    <b class="ld__badge" aria-hidden="true"><span class="ld__badgeNum" id="pct">0%</span><span class="ld__badgeUnit">채움</span></b>
  </div>
</div>
</main>
<script>
// 셀룰러 오토마타 로더 — 씨앗 몇 개에서 시작해 "이웃 3개 이상이면 태어나고, 한 번 살면 계속 산다"는
// 생존 규칙 하나로 세대를 진행시킨다. 그 세대의 살아있는 칸 비율(채워진 칸/전체 칸)이 곧 진행률이다.
var root = document.getElementById('ld');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var pctEl = document.getElementById('pct');

var css = getComputedStyle(root);
var PAPER = css.getPropertyValue('--paper').trim();
var CELL1 = css.getPropertyValue('--cell1').trim();
var CELL2 = css.getPropertyValue('--cell2').trim();

function makeRng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (1103515245 * s + 12345) >>> 0;
    return (s >>> 8) / 16777216;
  };
}

var GX = 26, GY = 16;
var TOTAL = GX * GY;
var BIRTH = 3;                       // 생존(탄생) 규칙 상수(훅 고정값) — cellular-automaton-fill-percent, 이웃 수가 이 이상이면 태어난다
var INIT_SEEDS = 5;
var GENS = 16;
var STEP_INTERVAL = 0.15;
var LOOP = GENS * STEP_INTERVAL;

var rng = makeRng(20260927);
function setAlive(g, x, y) {
  if (x < 0 || y < 0 || x >= GX || y >= GY) return;
  g[y * GX + x] = 1;
}
function makeSeedGrid() {
  var g = new Uint8Array(TOTAL);
  for (var i = 0; i < INIT_SEEDS; i++) {
    var x = Math.floor(rng() * GX), y = Math.floor(rng() * GY);
    // 씨앗마다 L자 3칸 뭉치 — 홀로 떨어진 1칸은 이웃 3개 조건을 영영 못 채워 자라지 않는다
    setAlive(g, x, y);
    setAlive(g, x + 1, y);
    setAlive(g, x, y + 1);
  }
  return g;
}
function neighborCount(g, x, y) {
  var c = 0;
  for (var dy = -1; dy <= 1; dy++) {
    for (var dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      var nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= GX || ny >= GY) continue;
      if (g[ny * GX + nx]) c++;
    }
  }
  return c;
}
function stepGen(prev) {
  var next = new Uint8Array(TOTAL);
  for (var y = 0; y < GY; y++) {
    for (var x = 0; x < GX; x++) {
      var idx = y * GX + x;
      if (prev[idx]) { next[idx] = 1; continue; }
      next[idx] = neighborCount(prev, x, y) >= BIRTH ? 1 : 0;
    }
  }
  return next;
}

var generations = [makeSeedGrid()];
for (var gi = 1; gi <= GENS; gi++) generations.push(stepGen(generations[gi - 1]));

var shimF = new Float32Array(TOTAL), shimP = new Float32Array(TOTAL);
(function () {
  var srng = makeRng(778899);
  for (var i = 0; i < TOTAL; i++) { shimF[i] = 1.4 + srng() * 2.2; shimP[i] = srng() * Math.PI * 2; }
})();

var W = 0, H = 0, dpr = 1, cw = 0, ch = 0, ox = 0, oy = 0;

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cw = W / GX; ch = H / GY;
}

function draw(sec) {
  var t = sec % LOOP;
  var gen = Math.min(GENS, Math.floor(t / STEP_INTERVAL));
  var grid = generations[gen];

  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  var alive = 0;
  for (var y = 0; y < GY; y++) {
    for (var x = 0; x < GX; x++) {
      var idx = y * GX + x;
      if (!grid[idx]) continue;
      alive++;
      var shim = 0.58 + 0.42 * Math.sin(sec * shimF[idx] + shimP[idx]);
      ctx.fillStyle = (idx % 2 === 0) ? CELL1 : CELL2;
      ctx.globalAlpha = shim;
      ctx.fillRect(x * cw + 1, y * ch + 1, cw - 2, ch - 2);
    }
  }
  ctx.globalAlpha = 1;

  pctEl.textContent = Math.round(alive / TOTAL * 100) + '%';
}

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var paused = false;
var t0 = 0;
var raf = 0;

function togglePause() {
  paused = !paused;
  root.classList.toggle('is-paused', paused);
}
function restart() {
  t0 = performance.now();
  draw(0);
}

field.addEventListener('click', function () { togglePause(); });
field.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restart(); }
});
window.addEventListener('resize', function () {
  fit();
  if (paused || reduce) draw(((performance.now() - t0) / 1000));
});

function frame(now) {
  if (!paused) draw((now - t0) / 1000);
  raf = requestAnimationFrame(frame);
}

t0 = performance.now();
fit();
if (reduce) {
  root.classList.add('is-still');
  draw(LOOP * 0.62);
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
