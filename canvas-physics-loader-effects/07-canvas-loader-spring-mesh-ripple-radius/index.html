<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파동 반경 값이 번지는 스프링 격자 로더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">
    <svg class="ld__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 56v56a8 8 0 0 1-16 0V91.3l-25.6 25.7A80 80 0 1 1 174 60a8 8 0 1 1-9 13.2A64 64 0 1 0 179.7 128H216a8 8 0 0 1 0 16h-56a8 8 0 0 1-8-8V80a8 8 0 0 1 16 0v20.7L192.7 76A80.1 80.1 0 0 0 64 128a8 8 0 0 1-16 0a96 96 0 0 1 163.6-68.3L224 71.3V56a8 8 0 0 1 8 8" opacity=".2"/><path d="M224 48a8 8 0 0 0-8 8v15.3l-11.7-11.6a96 96 0 1 0 27.6 51.6a8 8 0 0 0-15.8 2.5a80 80 0 1 1-23-43l-25.7 25.7A8 8 0 0 0 173 112h56a8 8 0 0 0 8-8V56a8 8 0 0 0-13-8"/></g></svg>
    <span>클릭하거나 스페이스바를 누르면 멈추거나 다시 갑니다</span>
  </p>
  <div class="ld__field" id="field" role="application" aria-label="스프링 격자 파동 실험판" tabindex="0">
    <canvas class="ld__cv" id="cv"></canvas>
    <b class="ld__badge" aria-hidden="true"><span class="ld__badgeNum" id="pct">0%</span><span class="ld__badgeUnit">파동</span></b>
  </div>
</div>
</main>
<script>
// 스프링 격자 로더 — 파동 반경이 중심에서 바깥으로 번지고, 파동이 각 격자점에 닿는 순간
// 그 점은 감쇠 스프링(강성 상수 spring-mesh-stiffness, 닫힌해 SHM)으로 튕겼다가 가라앉는다.
var root = document.getElementById('ld');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var pctEl = document.getElementById('pct');

var css = getComputedStyle(root);
var PAPER = css.getPropertyValue('--paper').trim();
var LINE = css.getPropertyValue('--line').trim();
var NODE = css.getPropertyValue('--node').trim();
var NODE_HOT = css.getPropertyValue('--node-hot').trim();
var RING = css.getPropertyValue('--ring').trim();

var GX = 9, GY = 6;
var STIFFNESS = 9;                  // 스프링 강성 상수(훅 대상) — spring-mesh-stiffness, 값이 클수록 빨리 흔들린다
var DAMP = 3.4;                     // 감쇠 계수 — 흔들림이 잦아드는 속도
var AMP = 9;                        // 최대 변위(px)
var LOOP = 2.2;

var W = 0, H = 0, dpr = 1, cxp = 0, cyp = 0, maxR = 0, pts = [];

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cxp = W * 0.5; cyp = H * 0.5;
  maxR = Math.max(cxp, cyp) * 1.05 + Math.min(W, H) * 0.1;

  var mx = W * 0.1, my = H * 0.14;
  pts = [];
  for (var gy = 0; gy < GY; gy++) {
    for (var gx = 0; gx < GX; gx++) {
      var px = mx + (W - mx * 2) * (gx / (GX - 1));
      var py = my + (H - my * 2) * (gy / (GY - 1));
      var dx = px - cxp, dy = py - cyp;
      var dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      pts.push({ px: px, py: py, ux: dx / dist, uy: dy / dist, dist: dist });
    }
  }
}

function ripple(dt) {
  if (dt < 0) return 0;
  return AMP * Math.exp(-DAMP * dt) * Math.cos(STIFFNESS * dt);
}

function draw(sec) {
  var t = sec % LOOP;
  var p = t / LOOP;
  var frontR = p * maxR;
  var speed = maxR / LOOP;

  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = RING;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(cxp, cyp, Math.max(2, frontR), 0, Math.PI * 2);
  ctx.stroke();

  var disp = new Array(pts.length);
  for (var i = 0; i < pts.length; i++) {
    var q = pts[i];
    var dt = (t - q.dist / speed);
    disp[i] = ripple(dt);
  }

  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1.2;
  for (var gy = 0; gy < GY; gy++) {
    for (var gx = 0; gx < GX; gx++) {
      var idx = gy * GX + gx;
      var q2 = pts[idx];
      var x1 = q2.px + q2.ux * disp[idx];
      var y1 = q2.py + q2.uy * disp[idx];
      if (gx < GX - 1) {
        var idxR = idx + 1;
        var qR = pts[idxR];
        var x2 = qR.px + qR.ux * disp[idxR];
        var y2 = qR.py + qR.uy * disp[idxR];
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      if (gy < GY - 1) {
        var idxD = idx + GX;
        var qD = pts[idxD];
        var x3 = qD.px + qD.ux * disp[idxD];
        var y3 = qD.py + qD.uy * disp[idxD];
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x3, y3); ctx.stroke();
      }
    }
  }

  for (var k = 0; k < pts.length; k++) {
    var qq = pts[k];
    var x = qq.px + qq.ux * disp[k];
    var y = qq.py + qq.uy * disp[k];
    var heat = Math.min(1, Math.abs(disp[k]) / AMP);
    ctx.fillStyle = heat > 0.18 ? NODE_HOT : NODE;
    ctx.beginPath();
    ctx.arc(x, y, 2.6 + heat * 2.4, 0, Math.PI * 2);
    ctx.fill();
  }

  pctEl.textContent = Math.round(p * 100) + '%';
}

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var paused = false;
var t0 = 0;
var raf = 0;

function togglePause() {
  paused = !paused;
  root.classList.toggle('is-paused', paused);
}
function restart() {
  t0 = performance.now();
  draw(0);
}

field.addEventListener('click', function () { togglePause(); });
field.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restart(); }
});
window.addEventListener('resize', function () {
  fit();
  if (paused || reduce) draw(((performance.now() - t0) / 1000));
});

function frame(now) {
  if (!paused) draw((now - t0) / 1000);
  raf = requestAnimationFrame(frame);
}

t0 = performance.now();
fit();
if (reduce) {
  root.classList.add('is-still');
  draw(LOOP * 0.62);
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
