<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>衝突回避 — 네트워크 그래프 캔버스 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gd is-demo" id="gdRoot" role="img" aria-label="ノードが半径の分だけ押し合い重ならない実験版" tabindex="0">
  <canvas class="gd__cv" id="gdCv"></canvas>
  <p class="gd__hint">
    <span class="gd__title">衝突回避</span>
    <span class="gd__desc">半径の合計より近づくと即座に押し返し重なりを防ぎます</span>
  </p>
  <div class="gd__bar">
    <span class="gd__meta">ノード22個 · サイズ多様 · rAF</span>
    <span class="gd__meta gd__meta--dim">arc · Math.hypot · beginPath</span>
  </div>
</div>
</main>
<script>
// 衝突回避(04) — 척력만으로는 순간적으로 겹칠 수 있다. 매 프레임 위치를 적분한
// 뒤, 반지름 합보다 중심 거리가 가까운 쌍을 찾아 그 자리에서 즉시 밀어내는
// 보정 패스(하드 충돌 해소)를 한 겹 더 끼운다 — 힘이 아니라 위치 자체를 고친다.
(function () {
  // ── 변형 상수 블록 ──
  var N = 22;
  var REPEL = 420;
  var SPEED = 78;      // 자유 유영 속도(무작위 방향 힘의 크기)
  // ────────────────────────
  var DAMP = 0.965;
  var CENTER_K = 0.0016;
  var OMEGA = 0.6;
  var RMIN = 6, RMAX = 15;

  var root = document.getElementById('gdRoot');
  var cvEl = document.getElementById('gdCv');
  if (!root || !cvEl) return;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_PANEL = tokRGB('--gd-panel');
  var C_NODE  = tokRGB('--gd-node');
  var C_RING  = tokRGB('--gd-ring');

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x327004);

  var px, py, vx, vy, rad;

  function buildGraph() {
    px = new Float32Array(N); py = new Float32Array(N);
    vx = new Float32Array(N); vy = new Float32Array(N);
    rad = new Float32Array(N);
    for (var i = 0; i < N; i++) {
      px[i] = rand() * W; py[i] = rand() * H;
      rad[i] = RMIN + rand() * (RMAX - RMIN);
    }
  }

  function fit() {
    var r = root.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = Math.round(W * dpr); cvEl.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildGraph();
  }

  function step(dt) {
    var fx = new Float32Array(N), fy = new Float32Array(N);
    for (var i = 0; i < N; i++) {
      for (var j = i + 1; j < N; j++) {
        var dx = px[j] - px[i], dy = py[j] - py[i];
        var d = Math.hypot(dx, dy) || 0.001;
        var d2 = d * d; if (d2 < 4) d2 = 4;
        var f = REPEL / d2;
        var ux = dx / d, uy = dy / d;
        fx[i] -= ux * f; fy[i] -= uy * f;
        fx[j] += ux * f; fy[j] += uy * f;
      }
    }
    var cx = W / 2, cy = H / 2;
    for (var n = 0; n < N; n++) {
      fx[n] += (cx - px[n]) * CENTER_K;
      fy[n] += (cy - py[n]) * CENTER_K;
      fx[n] += (rand() - 0.5) * SPEED;
      fy[n] += (rand() - 0.5) * SPEED;
      vx[n] = (vx[n] + fx[n] * dt) * DAMP;
      vy[n] = (vy[n] + fy[n] * dt) * DAMP;
      px[n] += vx[n] * dt; py[n] += vy[n] * dt;
    }
    // 하드 충돌 해소 — 반지름 합보다 가까운 쌍을 그 자리에서 절반씩 밀어낸다
    for (var a = 0; a < N; a++) {
      for (var b = a + 1; b < N; b++) {
        var ddx = px[b] - px[a], ddy = py[b] - py[a];
        var dist = Math.hypot(ddx, ddy) || 0.001;
        var minDist = rad[a] + rad[b];
        if (dist < minDist) {
          var push = (minDist - dist) / 2;
          var nx = ddx / dist, ny = ddy / dist;
          px[a] -= nx * push; py[a] -= ny * push;
          px[b] += nx * push; py[b] += ny * push;
        }
      }
    }
  }

  function rotateAll(dtheta) {
    var cx = W / 2, cy = H / 2, cs = Math.cos(dtheta), sn = Math.sin(dtheta);
    for (var i = 0; i < N; i++) {
      var rx = px[i] - cx, ry = py[i] - cy;
      px[i] = cx + rx * cs - ry * sn;
      py[i] = cy + rx * sn + ry * cs;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgb(' + C_PANEL.join(',') + ')';
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < N; i++) {
      ctx.beginPath();
      ctx.fillStyle = 'rgb(' + C_NODE.join(',') + ')';
      ctx.arc(px[i], py[i], rad[i], 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(' + C_RING.join(',') + ',0.7)';
      ctx.stroke();
    }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1, last = -1;
  function frame(now) {
    if (t0 < 0) { t0 = now; last = now; }
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    step(dt);
    rotateAll(OMEGA * dt);
    draw();
    requestAnimationFrame(frame);
  }
  function settle() {
    for (var s = 0; s < 260; s++) step(1 / 60);
    draw();
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) settle();
  });

  fit();
  if (reduce) {
    settle();
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
