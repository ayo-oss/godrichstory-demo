<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basic force layout — 네트워크 그래프 캔버스 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ga is-demo" id="gaRoot" role="application" aria-label="Force layout network graph demo" tabindex="0">
  <canvas class="ga__cv" id="gaCv"></canvas>
  <p class="ga__hint">
    <span class="ga__title">Basic force layout</span>
    <span class="ga__desc">Repulsion and spring force alone let scattered points settle on their own</span>
  </p>
  <div class="ga__bar">
    <span class="ga__meta">18 nodes · repulsion+spring · rAF</span>
    <span class="ga__meta ga__meta--dim">arc · lineTo · Math.hypot</span>
  </div>
</div>
</main>
<script>
// Basic force layout(01) — 모든 노드 쌍의 척력(쿨롱형)과 엣지의 스프링(훅 법칙)을
// 매 프레임 합산해 좌표 자체를 다시 계산한다. 속성 트윈이 아니라 계산으로 움직인다.
// 흩어진 시작점에서 출발해 실시간으로 정돈된 그림으로 수렴하고, 수렴한 뒤에도
// 아주 약한 무작위 힘(온도)을 계속 더해 화면이 완전히 멈추지 않게 한다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var N = 18;             // 노드 개수
  var ATTRACT = 0.02;     // 스프링 강도(k) — 변형 1: 0.02 → 0.08
  var REPEL = 900;        // 척력 강도
  // ────────────────────────────────────────────────────
  var REST = 46;          // 스프링 목표 길이
  var DAMP = 0.955;       // 속도 감쇠 — 낮출수록 오래 출렁인다
  var CENTER_K = 0.0009;  // 중심으로 약하게 당기는 힘 — 그래프가 화면 밖으로 흘러가지 않게
  var JITTER = 50;        // 항상 더하는 무작위 힘(온도) — 화면 전역이 계속 출렁이게 한다
  var NR = 5;             // 노드 반지름
  var OMEGA = 0.5;        // 전체를 중심 기준 아주 천천히 돌리는 각속도(rad/s) — 화면 넓게 훑는다

  var root = document.getElementById('gaRoot');
  var cvEl = document.getElementById('gaCv');
  if (!root || !cvEl) return;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_PANEL = tokRGB('--ga-panel');
  var C_EDGE  = tokRGB('--ga-edge');
  var C_NODE  = tokRGB('--ga-node');
  var C_GLOW  = tokRGB('--ga-glow');

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x327001);

  var px, py, vx, vy, edges;

  function buildGraph() {
    px = new Float32Array(N); py = new Float32Array(N);
    vx = new Float32Array(N); vy = new Float32Array(N);
    for (var i = 0; i < N; i++) {
      px[i] = rand() * W; py[i] = rand() * H;
    }
    edges = [];
    for (var a = 1; a < N; a++) {
      edges.push([a, Math.floor(rand() * a)]);   // 스패닝 트리 — 모든 노드가 연결된다
    }
    var extra = Math.round(N * 0.5);
    for (var k = 0; k < extra; k++) {
      var u = Math.floor(rand() * N), v = Math.floor(rand() * N);
      if (u !== v) edges.push([u, v]);
    }
  }

  function fit() {
    var r = root.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = Math.round(W * dpr); cvEl.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildGraph();
  }

  function step(dt) {
    var fx = new Float32Array(N), fy = new Float32Array(N);
    for (var i = 0; i < N; i++) {
      for (var j = i + 1; j < N; j++) {
        var dx = px[j] - px[i], dy = py[j] - py[i];
        var d2 = dx * dx + dy * dy; if (d2 < 4) d2 = 4;
        var d = Math.sqrt(d2);
        var f = REPEL / d2;
        var ux = dx / d, uy = dy / d;
        fx[i] -= ux * f; fy[i] -= uy * f;
        fx[j] += ux * f; fy[j] += uy * f;
      }
    }
    for (var e = 0; e < edges.length; e++) {
      var a = edges[e][0], b = edges[e][1];
      var dx2 = px[b] - px[a], dy2 = py[b] - py[a];
      var d3 = Math.hypot(dx2, dy2) || 0.001;
      var diff = (d3 - REST) * ATTRACT;
      var ux2 = dx2 / d3, uy2 = dy2 / d3;
      fx[a] += ux2 * diff; fy[a] += uy2 * diff;
      fx[b] -= ux2 * diff; fy[b] -= uy2 * diff;
    }
    var cx = W / 2, cy = H / 2;
    for (var n = 0; n < N; n++) {
      fx[n] += (cx - px[n]) * CENTER_K;
      fy[n] += (cy - py[n]) * CENTER_K;
      fx[n] += (rand() - 0.5) * JITTER;
      fy[n] += (rand() - 0.5) * JITTER;
      vx[n] = (vx[n] + fx[n] * dt) * DAMP;
      vy[n] = (vy[n] + fy[n] * dt) * DAMP;
      px[n] += vx[n] * dt; py[n] += vy[n] * dt;
    }
  }

  function rotateAll(dtheta) {
    var cx = W / 2, cy = H / 2, cs = Math.cos(dtheta), sn = Math.sin(dtheta);
    for (var i = 0; i < N; i++) {
      var rx = px[i] - cx, ry = py[i] - cy;
      px[i] = cx + rx * cs - ry * sn;
      py[i] = cy + rx * sn + ry * cs;
    }
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgb(' + C_PANEL.join(',') + ')';
    ctx.fillRect(0, 0, W, H);

    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(' + C_EDGE.join(',') + ',0.55)';
    ctx.beginPath();
    for (var e = 0; e < edges.length; e++) {
      var a = edges[e][0], b = edges[e][1];
      ctx.moveTo(px[a], py[a]); ctx.lineTo(px[b], py[b]);
    }
    ctx.stroke();

    for (var i = 0; i < N; i++) {
      var pulse = 0.5 + 0.5 * Math.sin(t * 2.2 + i * 0.7);
      ctx.fillStyle = 'rgba(' + C_GLOW.join(',') + ',' + (0.24 + 0.2 * pulse).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(px[i], py[i], NR + 4 + pulse * 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgb(' + C_NODE.join(',') + ')';
      ctx.beginPath(); ctx.arc(px[i], py[i], NR, 0, Math.PI * 2); ctx.fill();
    }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1, last = -1;
  function frame(now) {
    if (t0 < 0) { t0 = now; last = now; }
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    var t = (now - t0) / 1000;
    step(dt);
    rotateAll(OMEGA * dt);
    draw(t);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) settle();
  });

  function settle() {
    for (var s = 0; s < 260; s++) step(1 / 60);
    draw(0);
  }

  fit();
  if (reduce) {
    settle();
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
