<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>関係の強さ — 네트워크 그래프 캔버스 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gg is-demo" id="ggRoot" role="img" aria-label="重みがリンクの長さと太さを変えるネットワーク図の実験版" tabindex="0">
  <canvas class="gg__cv" id="ggCv"></canvas>
  <p class="gg__hint">
    <span class="gg__title">関係の強さ</span>
    <span class="gg__desc">強い関係は短く太く、弱い関係は長く細く描かれます</span>
  </p>
  <div class="gg__bar">
    <span class="gg__meta">ノード16個 · 加重リンク · rAF</span>
    <span class="gg__meta gg__meta--dim">strokeStyle · globalAlpha · lineTo</span>
  </div>
</div>
</main>
<script>
// 関係の強さ(07) — 엣지마다 무작위 가중치를 매기고, 그 값에 비례해 스프링 목표
// 길이와 선 굵기·투명도를 계산한다. 강한 관계는 짧고 굵고 진하게, 약한 관계는
// 길고 얇고 흐리게 — 데이터 값이 곧 그림의 언어가 된다.
(function () {
  // ── 변형 상수 블록 ──
  var N = 16;
  var LINK_BASE = 60;      // 목표 링크 거리 기준 — 변형: 60px → 160px
  var ATTRACT = 0.03;
  // ────────────────────────
  var REPEL = 780;
  var DAMP = 0.955;
  var CENTER_K = 0.001;
  var JITTER = 40;
  var OMEGA = 0.4;
  var NR = 5;

  var root = document.getElementById('ggRoot');
  var cvEl = document.getElementById('ggCv');
  if (!root || !cvEl) return;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_PANEL = tokRGB('--gg-panel');
  var C_EDGE  = tokRGB('--gg-edge');
  var C_NODE  = tokRGB('--gg-node');

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x327007);

  var px, py, vx, vy, edges;

  function buildGraph() {
    px = new Float32Array(N); py = new Float32Array(N);
    vx = new Float32Array(N); vy = new Float32Array(N);
    for (var i = 0; i < N; i++) { px[i] = rand() * W; py[i] = rand() * H; }
    edges = [];
    for (var a = 1; a < N; a++) {
      edges.push({ a: a, b: Math.floor(rand() * a), w: 0.15 + rand() * 0.85 });
    }
    var extra = Math.round(N * 0.35);
    for (var k = 0; k < extra; k++) {
      var u = Math.floor(rand() * N), v = Math.floor(rand() * N);
      if (u !== v) edges.push({ a: u, b: v, w: 0.15 + rand() * 0.85 });
    }
  }

  function fit() {
    var r = root.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = Math.round(W * dpr); cvEl.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildGraph();
  }

  function step(dt) {
    var fx = new Float32Array(N), fy = new Float32Array(N);
    for (var i = 0; i < N; i++) {
      for (var j = i + 1; j < N; j++) {
        var dx = px[j] - px[i], dy = py[j] - py[i];
        var d2 = dx * dx + dy * dy; if (d2 < 4) d2 = 4;
        var d = Math.sqrt(d2);
        var f = REPEL / d2;
        var ux = dx / d, uy = dy / d;
        fx[i] -= ux * f; fy[i] -= uy * f;
        fx[j] += ux * f; fy[j] += uy * f;
      }
    }
    for (var e = 0; e < edges.length; e++) {
      var ed = edges[e], a = ed.a, b = ed.b;
      // 가중치가 클수록(관계가 강할수록) 목표 거리가 짧다
      var rest = LINK_BASE * (1.5 - ed.w);
      var dx2 = px[b] - px[a], dy2 = py[b] - py[a];
      var d3 = Math.hypot(dx2, dy2) || 0.001;
      var diff = (d3 - rest) * ATTRACT * (0.5 + ed.w);
      var ux2 = dx2 / d3, uy2 = dy2 / d3;
      fx[a] += ux2 * diff; fy[a] += uy2 * diff;
      fx[b] -= ux2 * diff; fy[b] -= uy2 * diff;
    }
    var cx = W / 2, cy = H / 2;
    for (var n = 0; n < N; n++) {
      fx[n] += (cx - px[n]) * CENTER_K;
      fy[n] += (cy - py[n]) * CENTER_K;
      fx[n] += (rand() - 0.5) * JITTER;
      fy[n] += (rand() - 0.5) * JITTER;
      vx[n] = (vx[n] + fx[n] * dt) * DAMP;
      vy[n] = (vy[n] + fy[n] * dt) * DAMP;
      px[n] += vx[n] * dt; py[n] += vy[n] * dt;
    }
  }

  function rotateAll(dtheta) {
    var cx = W / 2, cy = H / 2, cs = Math.cos(dtheta), sn = Math.sin(dtheta);
    for (var i = 0; i < N; i++) {
      var rx = px[i] - cx, ry = py[i] - cy;
      px[i] = cx + rx * cs - ry * sn;
      py[i] = cy + rx * sn + ry * cs;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgb(' + C_PANEL.join(',') + ')';
    ctx.fillRect(0, 0, W, H);

    for (var e = 0; e < edges.length; e++) {
      var ed = edges[e];
      ctx.lineWidth = 0.6 + ed.w * 3.2;
      ctx.strokeStyle = 'rgb(' + C_EDGE.join(',') + ')';
      ctx.globalAlpha = 0.2 + ed.w * 0.65;
      ctx.beginPath();
      ctx.moveTo(px[ed.a], py[ed.a]);
      ctx.lineTo(px[ed.b], py[ed.b]);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (var i = 0; i < N; i++) {
      ctx.fillStyle = 'rgb(' + C_NODE.join(',') + ')';
      ctx.beginPath(); ctx.arc(px[i], py[i], NR, 0, Math.PI * 2); ctx.fill();
    }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1, last = -1;
  function frame(now) {
    if (t0 < 0) { t0 = now; last = now; }
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    step(dt);
    rotateAll(OMEGA * dt);
    draw();
    requestAnimationFrame(frame);
  }
  function settle() {
    for (var s = 0; s < 260; s++) step(1 / 60);
    draw();
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) settle();
  });

  fit();
  if (reduce) {
    settle();
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
