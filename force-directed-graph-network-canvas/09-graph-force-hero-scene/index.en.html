<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero network scene — 네트워크 그래프 캔버스 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gi is-demo" id="giRoot" role="img" aria-label="Hero network scene weaving service features together by force" tabindex="0">
  <canvas class="gi__cv" id="giCv"></canvas>
  <p class="gi__hint">
    <span class="gi__title">Hero network scene</span>
    <span class="gi__desc">Springs link only related features so the structure reads at a glance</span>
  </p>
  <div class="gi__bar">
    <span class="gi__meta">10 feature nodes · hero scene · rAF</span>
    <span class="gi__meta gi__meta--dim">createRadialGradient · arc · lineTo</span>
  </div>
</div>
</main>
<script>
// Hero network scene(09) — 제품 기능 이름을 노드로 두고 관련된 것끼리만 스프링을 건다.
// 각 노드는 createRadialGradient 로 은은한 광을 두르고, 힘 계산과 회전으로
// 화면 전체가 첫 방문에 살아 움직이는 느낌을 준다.
(function () {
  // ── 변형 상수 블록 ──
  var LABELS = ['Login', 'Payment', 'Alerts', 'Search', 'Chat', 'Files', 'Settings', 'Stats', 'Dashboard', 'Integrations'];
  var ATTRACT = 0.026;
  // ────────────────────────
  var REPEL = 1500;
  var REST = 70;
  var DAMP = 0.95;
  var CENTER_K = 0.0012;
  var JITTER = 34;
  var OMEGA = 0.32;
  var NR = 6.4;

  var root = document.getElementById('giRoot');
  var cvEl = document.getElementById('giCv');
  if (!root || !cvEl) return;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_PANEL = tokRGB('--gi-panel');
  var C_EDGE  = tokRGB('--gi-edge');
  var C_NODE  = tokRGB('--gi-node');
  var C_GLOW  = tokRGB('--gi-glow');
  var C_TEXT  = tokRGB('--gi-label');

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  var N = LABELS.length;

  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x327009);

  var px, py, vx, vy, edges;

  function buildGraph() {
    px = new Float32Array(N); py = new Float32Array(N);
    vx = new Float32Array(N); vy = new Float32Array(N);
    for (var i = 0; i < N; i++) { px[i] = rand() * W; py[i] = rand() * H; }
    edges = [];
    for (var a = 1; a < N; a++) edges.push([a, Math.floor(rand() * a)]);
    var extra = Math.round(N * 0.4);
    for (var k = 0; k < extra; k++) {
      var u = Math.floor(rand() * N), v = Math.floor(rand() * N);
      if (u !== v) edges.push([u, v]);
    }
  }

  function fit() {
    var r = root.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = Math.round(W * dpr); cvEl.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildGraph();
  }

  function step(dt) {
    var fx = new Float32Array(N), fy = new Float32Array(N);
    for (var i = 0; i < N; i++) {
      for (var j = i + 1; j < N; j++) {
        var dx = px[j] - px[i], dy = py[j] - py[i];
        var d2 = dx * dx + dy * dy; if (d2 < 4) d2 = 4;
        var d = Math.sqrt(d2);
        var f = REPEL / d2;
        var ux = dx / d, uy = dy / d;
        fx[i] -= ux * f; fy[i] -= uy * f;
        fx[j] += ux * f; fy[j] += uy * f;
      }
    }
    for (var e = 0; e < edges.length; e++) {
      var a = edges[e][0], b = edges[e][1];
      var dx2 = px[b] - px[a], dy2 = py[b] - py[a];
      var d3 = Math.hypot(dx2, dy2) || 0.001;
      var diff = (d3 - REST) * ATTRACT;
      var ux2 = dx2 / d3, uy2 = dy2 / d3;
      fx[a] += ux2 * diff; fy[a] += uy2 * diff;
      fx[b] -= ux2 * diff; fy[b] -= uy2 * diff;
    }
    var cx = W / 2, cy = H / 2;
    for (var n = 0; n < N; n++) {
      fx[n] += (cx - px[n]) * CENTER_K;
      fy[n] += (cy - py[n]) * CENTER_K;
      fx[n] += (rand() - 0.5) * JITTER;
      fy[n] += (rand() - 0.5) * JITTER;
      vx[n] = (vx[n] + fx[n] * dt) * DAMP;
      vy[n] = (vy[n] + fy[n] * dt) * DAMP;
      px[n] += vx[n] * dt; py[n] += vy[n] * dt;
    }
  }

  function rotateAll(dtheta) {
    var cx = W / 2, cy = H / 2, cs = Math.cos(dtheta), sn = Math.sin(dtheta);
    for (var i = 0; i < N; i++) {
      var rx = px[i] - cx, ry = py[i] - cy;
      px[i] = cx + rx * cs - ry * sn;
      py[i] = cy + rx * sn + ry * cs;
    }
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgb(' + C_PANEL.join(',') + ')';
    ctx.fillRect(0, 0, W, H);

    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(' + C_EDGE.join(',') + ',0.55)';
    ctx.beginPath();
    for (var e = 0; e < edges.length; e++) {
      var a = edges[e][0], b = edges[e][1];
      ctx.moveTo(px[a], py[a]); ctx.lineTo(px[b], py[b]);
    }
    ctx.stroke();

    ctx.font = '600 10px sans-serif';
    ctx.textAlign = 'center';
    for (var i = 0; i < N; i++) {
      var pulse = 0.5 + 0.5 * Math.sin(t * 2 + i * 0.65);
      var glowR = NR + 10 + pulse * 8;
      var grad = ctx.createRadialGradient(px[i], py[i], 0, px[i], py[i], glowR);
      grad.addColorStop(0, 'rgba(' + C_GLOW.join(',') + ',' + (0.5 + 0.3 * pulse).toFixed(3) + ')');
      grad.addColorStop(1, 'rgba(' + C_GLOW.join(',') + ',0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(px[i], py[i], glowR, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = 'rgb(' + C_NODE.join(',') + ')';
      ctx.beginPath(); ctx.arc(px[i], py[i], NR, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = 'rgb(' + C_TEXT.join(',') + ')';
      ctx.fillText(LABELS[i], px[i], py[i] - NR - 6);
    }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1, last = -1;
  function frame(now) {
    if (t0 < 0) { t0 = now; last = now; }
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    var t = (now - t0) / 1000;
    step(dt);
    rotateAll(OMEGA * dt);
    draw(t);
    requestAnimationFrame(frame);
  }
  function settle() {
    for (var s = 0; s < 260; s++) step(1 / 60);
    draw(0);
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) settle();
  });

  fit();
  if (reduce) {
    settle();
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
