<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대규모 팬줌 — 네트워크 그래프 캔버스 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="gh is-demo" id="ghRoot" role="application" aria-label="노드 수백 개짜리 그래프를 훑는 팬줌 실험판" tabindex="0">
  <canvas class="gh__cv" id="ghCv"></canvas>
  <p class="gh__hint">
    <span class="gh__title">대규모 팬줌</span>
    <span class="gh__desc">캔버스 변환만 바꾸고 힘 계산은 원래 좌표계에서 그대로 돕니다</span>
  </p>
  <div class="gh__bar">
    <span class="gh__meta">노드 140개 · 휠·드래그 팬줌 · rAF</span>
    <span class="gh__meta gh__meta--dim">arc · lineTo · Math.hypot</span>
  </div>
</div>
</main>
<script>
// 대규모 팬줌(08) — 물리 계산은 항상 원래(월드) 좌표계에서 돈다. 화면에 보이는
// 것은 카메라 변환(이동 camX·camY, 배율 zoom)을 씌운 결과일 뿐이다. .is-demo 동안은
// 카메라가 스스로 서서히 훑고, 실제 휠·드래그가 들어오면 그 값을 그대로 이어받는다.
(function () {
  // ── 변형 상수 블록 ──
  var N = 140;
  var WORLD_W = 1400, WORLD_H = 900;
  // ────────────────────────
  var REPEL = 2600;
  var ATTRACT = 0.018;
  var REST = 42;
  var DAMP = 0.93;
  var CENTER_K = 0.0007;
  var JITTER = 30;
  var NR = 3.2;
  var ZOOM_MIN = 0.28, ZOOM_MAX = 1.6;

  var root = document.getElementById('ghRoot');
  var cvEl = document.getElementById('ghCv');
  if (!root || !cvEl) return;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_PANEL = tokRGB('--gh-panel');
  var C_EDGE  = tokRGB('--gh-edge');
  var C_NODE  = tokRGB('--gh-node');

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x327008);

  var px, py, vx, vy, edges;
  var camX = WORLD_W / 2, camY = WORLD_H / 2, zoom = 0.32;
  var userDrag = false, lastPX = 0, lastPY = 0, userActive = false;

  function buildGraph() {
    px = new Float32Array(N); py = new Float32Array(N);
    vx = new Float32Array(N); vy = new Float32Array(N);
    for (var i = 0; i < N; i++) { px[i] = rand() * WORLD_W; py[i] = rand() * WORLD_H; }
    edges = [];
    for (var a = 1; a < N; a++) edges.push([a, Math.floor(rand() * a)]);
    var extra = Math.round(N * 0.25);
    for (var k = 0; k < extra; k++) {
      var u = Math.floor(rand() * N), v = Math.floor(rand() * N);
      if (u !== v) edges.push([u, v]);
    }
  }

  function fit() {
    var r = root.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = Math.round(W * dpr); cvEl.height = Math.round(H * dpr);
    buildGraph();
  }

  function step(dt) {
    var fx = new Float32Array(N), fy = new Float32Array(N);
    for (var i = 0; i < N; i++) {
      for (var j = i + 1; j < N; j++) {
        var dx = px[j] - px[i], dy = py[j] - py[i];
        var d2 = dx * dx + dy * dy; if (d2 < 9) d2 = 9;
        if (d2 > 40000) continue;   // 먼 쌍은 생략 — 큰 그래프 성능 보호
        var d = Math.sqrt(d2);
        var f = REPEL / d2;
        var ux = dx / d, uy = dy / d;
        fx[i] -= ux * f; fy[i] -= uy * f;
        fx[j] += ux * f; fy[j] += uy * f;
      }
    }
    for (var e = 0; e < edges.length; e++) {
      var a = edges[e][0], b = edges[e][1];
      var dx2 = px[b] - px[a], dy2 = py[b] - py[a];
      var d3 = Math.hypot(dx2, dy2) || 0.001;
      var diff = (d3 - REST) * ATTRACT;
      var ux2 = dx2 / d3, uy2 = dy2 / d3;
      fx[a] += ux2 * diff; fy[a] += uy2 * diff;
      fx[b] -= ux2 * diff; fy[b] -= uy2 * diff;
    }
    var cx = WORLD_W / 2, cy = WORLD_H / 2;
    for (var n = 0; n < N; n++) {
      fx[n] += (cx - px[n]) * CENTER_K;
      fy[n] += (cy - py[n]) * CENTER_K;
      fx[n] += (rand() - 0.5) * JITTER;
      fy[n] += (rand() - 0.5) * JITTER;
      vx[n] = (vx[n] + fx[n] * dt) * DAMP;
      vy[n] = (vy[n] + fy[n] * dt) * DAMP;
      px[n] += vx[n] * dt; py[n] += vy[n] * dt;
    }
  }

  // .is-demo 자동 카메라 훑기 — 사람이 조작하지 않는 동안 서서히 팬·줌한다
  function autoCam(t) {
    camX = WORLD_W / 2 + Math.sin(t * 0.3) * WORLD_W * 0.32;
    camY = WORLD_H / 2 + Math.cos(t * 0.24) * WORLD_H * 0.28;
    zoom = 0.62 + 0.4 * Math.sin(t * 0.5);
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgb(' + C_PANEL.join(',') + ')';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(zoom, zoom);
    ctx.translate(-camX, -camY);

    ctx.lineWidth = 1 / zoom;
    ctx.strokeStyle = 'rgba(' + C_EDGE.join(',') + ',0.5)';
    ctx.beginPath();
    for (var e = 0; e < edges.length; e++) {
      var a = edges[e][0], b = edges[e][1];
      ctx.moveTo(px[a], py[a]); ctx.lineTo(px[b], py[b]);
    }
    ctx.stroke();

    ctx.fillStyle = 'rgb(' + C_NODE.join(',') + ')';
    for (var i = 0; i < N; i++) {
      ctx.beginPath(); ctx.arc(px[i], py[i], NR, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1, last = -1;
  function frame(now) {
    if (t0 < 0) { t0 = now; last = now; }
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    var t = (now - t0) / 1000;
    step(dt);
    if (!userActive && root.classList.contains('is-demo')) autoCam(t);
    draw();
    requestAnimationFrame(frame);
  }

  function worldXY(clientX, clientY) {
    var r = cvEl.getBoundingClientRect();
    var sx = (clientX - r.left) - W / 2;
    var sy = (clientY - r.top) - H / 2;
    return [camX + sx / zoom, camY + sy / zoom];
  }

  cvEl.addEventListener('pointerdown', function (e) {
    userDrag = true; userActive = true;
    lastPX = e.clientX; lastPY = e.clientY;
    cvEl.setPointerCapture(e.pointerId);
  });
  cvEl.addEventListener('pointermove', function (e) {
    if (!userDrag) return;
    camX -= (e.clientX - lastPX) / zoom;
    camY -= (e.clientY - lastPY) / zoom;
    lastPX = e.clientX; lastPY = e.clientY;
  });
  window.addEventListener('pointerup', function () { userDrag = false; });
  cvEl.addEventListener('wheel', function (e) {
    e.preventDefault();
    userActive = true;
    var before = worldXY(e.clientX, e.clientY);
    zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom * (e.deltaY < 0 ? 1.12 : 0.89)));
    var after = worldXY(e.clientX, e.clientY);
    camX += before[0] - after[0];
    camY += before[1] - after[1];
  }, { passive: false });

  function settle() {
    for (var s = 0; s < 200; s++) step(1 / 60);
    autoCam(1.4);
    draw();
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) settle();
  });

  fit();
  if (reduce) {
    settle();
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
