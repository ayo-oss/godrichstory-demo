<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포맷 재시도 경로 — 유사도 검사와 백오프 사다리 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, 왼쪽·오른쪽 방향키로 다음 시나리오로">
      <div class="ez__scene" data-role="scene" role="img" aria-label="출력 포맷 불일치마다 재시도 정책이 바뀌고 백오프 대기가 늘어나는 장면"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">장면 준비</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
// ── 534 공통 엔진 — 533 run() 시계 계승 (WAAPI 시계읽기·pause·rebuild·reduced 분기)
const W = 480;
const CX0 = 8;
const CW = 432;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, k) { return a + (b - a) * k; }
function fill(s) {
    const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
    const v = [];
    for (let i = 1; i < arguments.length; i += 1) { v.push(String(arguments[i])); }
    let o = s;
    for (let i = 0; i < keys.length; i += 1) {
        o = o.split(keys[i]).join(i < v.length ? v[i] : '');
    }
    return o;
}
function f0(v) { return String(Math.round(v)); }
function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
const rootEl = document.getElementById("ez");
const innerEl = rootEl.querySelector('[data-role="inner"]');
const sceneEl = rootEl.querySelector('[data-role="scene"]');
const chartEl = rootEl.querySelector('[data-role="chart"]');
const probeEl = rootEl.querySelector('[data-role="probe"]');
const padEl = rootEl.querySelector('[data-role="pad"]');
const statusP = rootEl.querySelector('[data-role="status"]');
const readA = rootEl.querySelector('[data-role="reada"]');
const readB = rootEl.querySelector('[data-role="readb"]');
const doneP = rootEl.querySelector('[data-role="done"]');
const pauseBtn = rootEl.querySelector('[data-role="pause"]');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function make(tag, cls, parent) {
    const e = document.createElement(tag);
    if (cls) { e.className = cx(cls); }
    parent.appendChild(e);
    return e;
}
function put(e, x, y, w, h) {
    e.style.left = x + 'px';
    e.style.top = y + 'px';
    if (w > 0) { e.style.width = w + 'px'; }
    if (h > 0) { e.style.height = h + 'px'; }
}
const sweepEl = make('i', 'sweep', sceneEl);
const scWrap = make('div', 'scwrap', sceneEl);
const clkEl = make('i', 'clk', sceneEl);
function clearAll() {
    scWrap.textContent = '';
    chartEl.textContent = '';
    probeEl.textContent = '';
}
function seedHash(i, seed) {
    const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
    return x - Math.floor(x);
}
function animsIn(host) { return host.getAnimations({ subtree: true }); }
function spanOf(d, dur) { return { s: d, e: d + dur, k: 0 }; }
function bar(cls, x, y, w, h) {
    const e = make('i', cls, chartEl);
    put(e, x, y, w, h);
    return e;
}
function drawRows(segs, max) {
    const n = segs.length;
    const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
    for (let i = 0; i < n; i += 1) {
        const sg = segs[i];
        const x = CX0 + clamp(sg.s, 0, max) / max * CW;
        const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
        bar('bar k' + sg.k, x, 5 + i * (h + 1), w, h);
    }
}
function axis(max) {
    const a = make('b', 'ax', chartEl);
    a.textContent = '0';
    put(a, CX0, 40, 0, 0);
    const b = make('b', 'ax ax--r', chartEl);
    b.textContent = f0(max) + 'ms';
    put(b, CX0 + CW - 60, 40, 60, 0);
}
let headEl = null;
function setReads(a, b) {
    readA.textContent = a;
    readB.textContent = b;
}
function demoT(t) { return t % 2000; }
let piNow = 0;
function run(cfg) {
    const off = new AbortController();
    let pi = 0;
    let cycle = 2000;
    let paused = false;
    let raf = 0;
    let clock = null;
    let lastStatus = '';
    function fit() {
        const k = rootEl.clientWidth / W;
        innerEl.style.transform = 'scale(' + k + ')';
    }
    function rebuild() {
        clearAll();
        piNow = pi;
        cycle = Math.max(2000, cfg.build(pi));
        headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
        clkEl.style.animationDuration = f0(cycle) + 'ms';
        const all = animsIn(sceneEl);
        clock = null;
        for (let i = 0; i < all.length; i += 1) {
            const an = all[i];
            if (an.animationName && an.effect && an.effect.target === clkEl) {
                clock = an;
            }
        }
    }
    function restart() {
        const all = animsIn(sceneEl);
        for (let i = 0; i < all.length; i += 1) {
            all[i].currentTime = 0;
            if (paused) { all[i].pause(); }
            else { all[i].play(); }
        }
    }
    function tick() {
        const ct = clock ? Number(clock.currentTime) : 0;
        const t = isFinite(ct) ? ct : 0;
        if (headEl) {
            headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
        }
        sweepEl.style.setProperty('--sw', String(Math.round(t / cycle * 100)));
        const s = cfg.frame(t);
        if (s !== lastStatus) {
            statusP.textContent = s;
            lastStatus = s;
        }
        if (!paused && clock && t >= cycle - 1) {
            pi = (pi + 1) % cfg.count;
            rebuild();
            restart();
        }
        raf = requestAnimationFrame(tick);
    }
    function setPaused(p) {
        paused = p;
        pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
        const all = animsIn(sceneEl);
        for (let i = 0; i < all.length; i += 1) {
            if (p) { all[i].pause(); }
            else { all[i].play(); }
        }
        doneP.textContent = readB.textContent;
    }
    function shift(d) {
        pi = (pi + d + cfg.count) % cfg.count;
        rebuild();
        restart();
        doneP.textContent = readB.textContent;
    }
    pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
    padEl.addEventListener('keydown', function (ev) {
        if (ev.target === pauseBtn) { return; }
        if (ev.key === ' ' || ev.key === 'Enter') {
            ev.preventDefault();
            setPaused(!paused);
        }
        else if (ev.key === 'r' || ev.key === 'R') { shift(-pi); }
        else if (ev.key === 'ArrowRight') { ev.preventDefault(); shift(1); }
        else if (ev.key === 'ArrowLeft') { ev.preventDefault(); shift(-1); }
    }, { signal: off.signal });
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) { setPaused(true); }
    }, { signal: off.signal });
    window.addEventListener('resize', fit, { signal: off.signal });
    fit();
    rebuild();
    if (reduced) {
        cfg.frame(1e9);
        statusP.textContent = readB.textContent;
        doneP.textContent = readB.textContent;
    }
    else {
        restart();
        raf = requestAnimationFrame(tick);
    }
    return function () {
        cancelAnimationFrame(raf);
        off.abort();
    };
}
// ── 534-08 format-retry-path — 모델 출력 JSON 이 fitCheck 스키마 격자와 겹쳐지고 어긋난 필드만 붉게.
// 유사도 = 일치 필드 / 전체 필드 ×100. 재시도 사다리: ①temp↓ ②model swap ③prompt 재구성 —
// 단계마다 유사도가 올라가다 마지막 실패는 사람 검토 경로(nd--fail)로 빠진다.
// 백오프: wait = BASE × 2^(step-1) — 400·800·1600ms.
const BASE_BACKOFF = 400;
const FIELDS = ['id', 'title', 'items', 'price', 'meta', 'tags'];
const SCENES08 = [
    { match: [1, 0, 0, 0, 1, 0], step: 0 },  // 33% — 1차: 온도 낮춤
    { match: [1, 1, 0, 0, 1, 0], step: 1 },  // 50% — 2차: 모델 교체
    { match: [1, 1, 1, 1, 1, 0], step: 2 },  // 83% — 3차: 프롬프트 재구성
    { match: [1, 1, 1, 1, 1, 0], step: 3 }   // 83% — 끝내 불일치 → 사람 검토
];
const POLICY = ['temp 0.7→0.2', 'model swap', 'prompt rebuild', 'human review'];
const STEP_MS08 = 500;
let gridCells08 = null;
let outCells08 = null;
let fitPct08 = null;
let ladder08 = null;
let backoff08 = null;
let human08 = null;
function simScore(m) {
    // 유사도 = 일치 필드 수 / 전체 × 100
    let s = 0;
    for (let k = 0; k < m.length; k += 1) { s += m[k]; }
    return s / m.length * 100;
}
function build(i) {
    // 스키마 격자 — 상단 기대 필드 6칸
    gridCells08 = [];
    outCells08 = [];
    const gx = 26;
    const gy = 24;
    const cw = 36;
    for (let k = 0; k < FIELDS.length; k += 1) {
        const gx1 = gx + k * (cw + 4);
        const sc = make('i', 'scell', scWrap);
        put(sc, gx1, gy, cw, 20);
        const st = make('b', 'scell__t', scWrap);
        st.textContent = FIELDS[k];
        put(st, gx1, gy + 24, cw, 0);
        gridCells08.push(sc);
        // 출력 행 — 겹침 비교 (아래 20px)
        const oc = make('i', 'scell ocell', scWrap);
        put(oc, gx1, gy + 40, cw, 20);
        outCells08.push(oc);
    }
    const expT = make('b', 'qlbl2', scWrap);
    expT.textContent = 'fitCheck schema';
    put(expT, 26, 8, 200, 0);
    const gotT = make('b', 'qlbl2', scWrap);
    gotT.textContent = 'model output';
    put(gotT, 26, 62, 200, 0);
    // 유사도 리드아웃
    fitPct08 = make('b', 'fittxt', scWrap);
    put(fitPct08, 300, 24, 150, 0);
    // 재시도 사다리 — 우측 3단 + 사람 검토
    ladder08 = [];
    const ys = [64, 84, 104];
    for (let k = 0; k < 3; k += 1) {
        const b = make('b', 'ladstep', scWrap);
        b.textContent = POLICY[k];
        put(b, 300, ys[k], 150, 0);
        ladder08.push(b);
    }
    human08 = make('div', 'nd nd--fail', scWrap);
    put(human08, 300, 120, 118, 20);
    const hh = make('i', 'nd__t', human08);
    hh.textContent = 'nd--fail: human';
    backoff08 = make('b', 'urltxt2', scWrap);
    put(backoff08, 26, 110, 220, 0);
    const ov = make('b', 'ov ovs', sceneEl);
    put(ov, 26, 136, 260, 0);
    ov.textContent = 'backoff = 400 × 2^(n-1) ms';
    const segs = [];
    for (let k = 0; k < SCENES08.length; k += 1) { segs.push(spanOf(k * STEP_MS08, STEP_MS08 - 40)); }
    drawRows(segs, 2000);
    axis(2000);
    setReads('fitCheck 유사도 {a}% · 재시도 {b} — 모델 교체는 2단계일 뿐', f1(simScore(SCENES08[2].match)), POLICY[2]);
    doneP.textContent = '';
    return 2000;
}
function frame(t) {
    const si = Math.min(SCENES08.length - 1, Math.floor(demoT(t) / STEP_MS08));
    const sc = SCENES08[si];
    const ph = clamp((demoT(t) - si * STEP_MS08) / (STEP_MS08 * 0.7), 0, 1);
    const fit = simScore(sc.match);
    const last = si === SCENES08.length - 1;
    // 격자 대조 — 어긋난 필드만 붉게
    for (let k = 0; k < FIELDS.length; k += 1) {
        const okF = sc.match[k] === 1;
        outCells08[k].className = cx('scell ocell' + (okF ? '' : ' ocell--bad') + (ph > 0.25 ? ' ocell--lit' : ''));
    }
    fitPct08.textContent = 'fit ' + f1(fit) + '%';
    fitPct08.className = cx('fittxt' + (fit >= 95 ? ' fittxt--ok' : ''));
    // 사다리 강조 — 현재 단계
    for (let k = 0; k < 3; k += 1) {
        ladder08[k].className = cx('ladstep' + (k === sc.step && !last ? ' ladstep--on' : ''));
    }
    human08.className = cx('nd nd--fail' + (last && ph > 0.5 ? ' deadend--on' : ''));
    // 백오프 — BASE × 2^(step)
    const wait = BASE_BACKOFF * Math.pow(2, sc.step);
    backoff08.textContent = last ? ('final fit ' + f1(fit) + '% → human review') : ('retry ' + f0(sc.step + 1) + ' · ' + POLICY[sc.step] + ' · wait ' + f0(wait) + 'ms');
    return last ? ('fit ' + f1(fit) + '% — 사람 검토로') : ('retry ' + f0(sc.step + 1) + ' (' + POLICY[sc.step] + ') — fit ' + f1(fit) + '%');
}
run({ count: 1, build: build, frame: frame, head: true });
}
})();
</script>
</body>
</html>
