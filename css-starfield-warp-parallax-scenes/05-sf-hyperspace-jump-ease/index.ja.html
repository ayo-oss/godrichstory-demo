<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>止まった状態から光速へ飛び込むジャンプ曲線 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sc is-demo" id="scRoot">
  <canvas class="sc__canvas" id="scCanvas" width="480" height="300" tabindex="0" aria-label="止まった状態から光速へ飛び込むジャンプ曲線"></canvas>
  <p class="sc__status" id="scStatus" aria-live="polite">静止 — ジャンプの準備</p>
  <button class="sc__btn" id="scBtn" type="button">一時停止</button>
  <p class="sc__caption">止まった状態から光速へ飛び込むジャンプ曲線</p>
</div>
</main>
<script>
(function () {
    const W = 480;
    const H = 300;
    const PI2 = Math.PI * 2;
    const FIXED_DT = 16;
    const REDUCE_STEP_MS = 900;
    const KEY_STEP = 14;
    const IDLE_TICKS = 150;
    const BTN_PAUSE = '一時停止';
    const BTN_PLAY = '再生';
    const BTN_NEXT = '次の場面';
    const BG = [14, 12, 32];
    const STAR_RGBS = [[226, 238, 255], [255, 222, 196], [208, 196, 255], [196, 240, 228], [255, 206, 226]];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) {
        return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
    }
    // 시드 고정 난수 — 같은 시드면 언제나 같은 수열 (선형 합동 방식)
    function lcg(seed) {
        let s = seed >>> 0;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    function glow(ctx, x, y, r, c, a) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, rgba(c, a));
        g.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    function paintBg(ctx, alpha) {
        ctx.fillStyle = rgba(BG, alpha);
        ctx.fillRect(0, 0, W, H);
    }
    function start(root, canvas, statusEl, btnEl, make) {
        const ctx0 = canvas.getContext('2d');
        if (!ctx0) {
            return function () { return; };
        }
        const ctx = ctx0;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const inp = { x: W / 2, y: H / 2, idle: 99999 };
        const scene = make(inp, reduce);
        let paused = false;
        let rafId = 0;
        let lastTs = -1;
        let accMs = 0;
        let lastLabel = '';
        const cleaners = [];
        function listen(target, type, fn) {
            target.addEventListener(type, fn);
            cleaners.push(function () { target.removeEventListener(type, fn); });
        }
        function show() {
            scene.draw(ctx);
            const t = scene.label();
            if (t !== lastLabel) {
                lastLabel = t;
                statusEl.textContent = t;
            }
        }
        function advance(ms) {
            const n = Math.round(ms / FIXED_DT);
            for (let i = 0; i < n; i += 1) {
                inp.idle += 1;
                scene.step();
            }
        }
        function refresh() {
            if (reduce) {
                advance(FIXED_DT * 6);
                show();
            }
        }
        function toLocal(e) {
            const r = canvas.getBoundingClientRect();
            inp.x = clamp((e.clientX - r.left) * W / r.width, 0, W);
            inp.y = clamp((e.clientY - r.top) * H / r.height, 0, H);
            inp.idle = 0;
        }
        function tick(ts) {
            if (lastTs < 0) {
                lastTs = ts;
            }
            const frameDt = Math.min(ts - lastTs, 160);
            lastTs = ts;
            if (!paused) {
                accMs += frameDt;
                while (accMs >= FIXED_DT) {
                    inp.idle += 1;
                    scene.step();
                    accMs -= FIXED_DT;
                }
                show();
            }
            rafId = requestAnimationFrame(tick);
        }
        btnEl.textContent = reduce ? BTN_NEXT : BTN_PAUSE;
        if (reduce) {
            root.classList.remove('is-demo');
            advance(1400);
            show();
        }
        listen(btnEl, 'click', function () {
            if (reduce) {
                advance(REDUCE_STEP_MS);
                show();
                return;
            }
            paused = !paused;
            if (paused) {
                root.classList.remove('is-demo');
            }
            else {
                root.classList.add('is-demo');
            }
            btnEl.textContent = paused ? BTN_PLAY : BTN_PAUSE;
        });
        listen(canvas, 'pointermove', function (e) {
            toLocal(e);
            refresh();
        });
        listen(canvas, 'pointerdown', function (e) {
            toLocal(e);
            scene.tap();
            refresh();
        });
        listen(canvas, 'keydown', function (e) {
            const k = e.key;
            let dx = 0;
            let dy = 0;
            if (k === 'Enter' || k === ' ') {
                e.preventDefault();
                scene.tap();
                refresh();
                return;
            }
            if (k === 'ArrowLeft') {
                dx = -KEY_STEP;
            }
            else if (k === 'ArrowRight') {
                dx = KEY_STEP;
            }
            else if (k === 'ArrowUp') {
                dy = -KEY_STEP;
            }
            else if (k === 'ArrowDown') {
                dy = KEY_STEP;
            }
            else {
                return;
            }
            e.preventDefault();
            inp.x = clamp(inp.x + dx, 0, W);
            inp.y = clamp(inp.y + dy, 0, H);
            inp.idle = 0;
            refresh();
        });
        if (!reduce) {
            rafId = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(rafId);
            for (let i = 0; i < cleaners.length; i += 1) {
                cleaners[i]();
            }
        };
    }
    const JUMP_EASE = 6;
    const MAX_SPEED = 70;
    const FLASH = 1;
    const HOLD = 18;
    const RAMP = 72;
    const FLASH_TICKS = 24;
    const SETTLE = 56;
    const BASE_SPEED = 1.6;
    const STREAK = 1.1;
    const FOV = 170;
    const STAR_COUNT = 260;
    const Z_FAR = 1000;
    const Z_NEAR = 20;
    const SPREAD = 700;
    const CYCLE = HOLD + RAMP + FLASH_TICKS + SETTLE;
    const TXT_HOLD = '静止 — ジャンプの準備';
    const TXT_RAMP = '加速 — 指数曲線で上がる';
    const TXT_FLASH = 'ジャンプ — 閃光';
    const TXT_SETTLE = '到着 — 速さが戻る';
    // t 틱 시점의 속도. 올라갈 때만 2 의 거듭제곱 곡선이고 나머지는 부드러운 복귀
    function speedAt(t) {
        if (t < HOLD) {
            return BASE_SPEED;
        }
        if (t < HOLD + RAMP) {
            const p = (t - HOLD) / RAMP;
            return BASE_SPEED + (MAX_SPEED - BASE_SPEED) * (Math.pow(2, JUMP_EASE * p) - 1) / (Math.pow(2, JUMP_EASE) - 1);
        }
        if (t < HOLD + RAMP + FLASH_TICKS) {
            const q = (t - HOLD - RAMP) / FLASH_TICKS;
            return lerp(MAX_SPEED, BASE_SPEED, smooth(q));
        }
        return BASE_SPEED;
    }
    function flashAt(t) {
        const q = (t - HOLD - RAMP) / FLASH_TICKS;
        if (q < 0 || q > 1) {
            return 0;
        }
        return FLASH * (1 - q) * (1 - q);
    }
    function makeScene(inp, reduce) {
        const rnd = lcg(450505);
        const stars = [];
        let t = 0;
        let speed = BASE_SPEED;
        let primed = false;
        function place(s, far) {
            s.x = (rnd() * 2 - 1) * SPREAD;
            s.y = (rnd() * 2 - 1) * SPREAD * 0.65;
            s.z = far ? Z_FAR : Z_NEAR + rnd() * (Z_FAR - Z_NEAR);
        }
        for (let i = 0; i < STAR_COUNT; i += 1) {
            const s = { x: 0, y: 0, z: 0, c: STAR_RGBS[i % STAR_RGBS.length] };
            place(s, false);
            stars.push(s);
        }
        const scene = {
            step() {
                t = (t + 1) % CYCLE;
                speed = speedAt(t);
                for (let i = 0; i < stars.length; i += 1) {
                    const s = stars[i];
                    s.z -= speed;
                    const sx = W / 2 + s.x * FOV / s.z;
                    const sy = H / 2 + s.y * FOV / s.z;
                    if (s.z < Z_NEAR || sx < -100 || sx > W + 100 || sy < -100 || sy > H + 100) {
                        place(s, true);
                    }
                }
            },
            draw(ctx) {
                paintBg(ctx, primed ? (speed > 12 ? 0.55 : 1) : 1);
                primed = true;
                ctx.lineCap = 'round';
                for (let i = 0; i < stars.length; i += 1) {
                    const s = stars[i];
                    const k = 1 - s.z / Z_FAR;
                    // 줄기 길이도 같은 speed 값에서 나온다
                    const zb = Math.min(s.z + speed * STREAK, Z_FAR * 1.5);
                    ctx.strokeStyle = rgba(s.c, 0.3 + 0.7 * k);
                    ctx.lineWidth = 0.7 + 2.4 * k * k;
                    ctx.beginPath();
                    ctx.moveTo(W / 2 + s.x * FOV / zb, H / 2 + s.y * FOV / zb);
                    ctx.lineTo(W / 2 + s.x * FOV / s.z, H / 2 + s.y * FOV / s.z);
                    ctx.stroke();
                }
                const f = flashAt(t);
                const ramp = clamp((speed - BASE_SPEED) / (MAX_SPEED - BASE_SPEED), 0, 1);
                if (ramp > 0.05) {
                    glow(ctx, W / 2, H / 2, 40 + 200 * ramp, [208, 196, 255], 0.45 * ramp);
                }
                if (f > 0) {
                    ctx.fillStyle = rgba([244, 240, 255], 0.9 * f);
                    ctx.fillRect(0, 0, W, H);
                    glow(ctx, W / 2, H / 2, 260, [255, 255, 255], f);
                }
            },
            label() {
                if (t < HOLD) {
                    return TXT_HOLD;
                }
                if (t < HOLD + RAMP) {
                    return TXT_RAMP;
                }
                if (t < HOLD + RAMP + FLASH_TICKS) {
                    return TXT_FLASH;
                }
                return TXT_SETTLE;
            },
            tap() {
                t = HOLD;
            }
        };
        if (reduce) {
            t = HOLD + 50;
            for (let i = 0; i < 6; i += 1) {
                scene.step();
            }
        }
        return scene;
    }
    start(document.getElementById('scRoot'), document.getElementById('scCanvas'), document.getElementById('scStatus'), document.getElementById('scBtn'), makeScene);
})();
</script>
</body>
</html>
