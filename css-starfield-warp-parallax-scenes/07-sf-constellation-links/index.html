<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가까운 별끼리 선으로 이어지는 별자리 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sc is-demo" id="scRoot">
  <canvas class="sc__canvas" id="scCanvas" width="480" height="300" tabindex="0" aria-label="가까운 별끼리 선으로 이어지는 별자리"></canvas>
  <p class="sc__status" id="scStatus" aria-live="polite">이웃 칸만 계산 — 가까운 별끼리 선</p>
  <button class="sc__btn" id="scBtn" type="button">멈춤</button>
  <p class="sc__caption">가까운 별끼리 선으로 이어지는 별자리</p>
</div>
</main>
<script>
(function () {
    const W = 480;
    const H = 300;
    const PI2 = Math.PI * 2;
    const FIXED_DT = 16;
    const REDUCE_STEP_MS = 900;
    const KEY_STEP = 14;
    const IDLE_TICKS = 150;
    const BTN_PAUSE = '멈춤';
    const BTN_PLAY = '재생';
    const BTN_NEXT = '다음 장면';
    const BG = [14, 12, 32];
    const STAR_RGBS = [[226, 238, 255], [255, 222, 196], [208, 196, 255], [196, 240, 228], [255, 206, 226]];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) {
        return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
    }
    // 시드 고정 난수 — 같은 시드면 언제나 같은 수열 (선형 합동 방식)
    function lcg(seed) {
        let s = seed >>> 0;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    function glow(ctx, x, y, r, c, a) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, rgba(c, a));
        g.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    function paintBg(ctx, alpha) {
        ctx.fillStyle = rgba(BG, alpha);
        ctx.fillRect(0, 0, W, H);
    }
    function start(root, canvas, statusEl, btnEl, make) {
        const ctx0 = canvas.getContext('2d');
        if (!ctx0) {
            return function () { return; };
        }
        const ctx = ctx0;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const inp = { x: W / 2, y: H / 2, idle: 99999 };
        const scene = make(inp, reduce);
        let paused = false;
        let rafId = 0;
        let lastTs = -1;
        let accMs = 0;
        let lastLabel = '';
        const cleaners = [];
        function listen(target, type, fn) {
            target.addEventListener(type, fn);
            cleaners.push(function () { target.removeEventListener(type, fn); });
        }
        function show() {
            scene.draw(ctx);
            const t = scene.label();
            if (t !== lastLabel) {
                lastLabel = t;
                statusEl.textContent = t;
            }
        }
        function advance(ms) {
            const n = Math.round(ms / FIXED_DT);
            for (let i = 0; i < n; i += 1) {
                inp.idle += 1;
                scene.step();
            }
        }
        function refresh() {
            if (reduce) {
                advance(FIXED_DT * 6);
                show();
            }
        }
        function toLocal(e) {
            const r = canvas.getBoundingClientRect();
            inp.x = clamp((e.clientX - r.left) * W / r.width, 0, W);
            inp.y = clamp((e.clientY - r.top) * H / r.height, 0, H);
            inp.idle = 0;
        }
        function tick(ts) {
            if (lastTs < 0) {
                lastTs = ts;
            }
            const frameDt = Math.min(ts - lastTs, 160);
            lastTs = ts;
            if (!paused) {
                accMs += frameDt;
                while (accMs >= FIXED_DT) {
                    inp.idle += 1;
                    scene.step();
                    accMs -= FIXED_DT;
                }
                show();
            }
            rafId = requestAnimationFrame(tick);
        }
        btnEl.textContent = reduce ? BTN_NEXT : BTN_PAUSE;
        if (reduce) {
            root.classList.remove('is-demo');
            advance(1400);
            show();
        }
        listen(btnEl, 'click', function () {
            if (reduce) {
                advance(REDUCE_STEP_MS);
                show();
                return;
            }
            paused = !paused;
            if (paused) {
                root.classList.remove('is-demo');
            }
            else {
                root.classList.add('is-demo');
            }
            btnEl.textContent = paused ? BTN_PLAY : BTN_PAUSE;
        });
        listen(canvas, 'pointermove', function (e) {
            toLocal(e);
            refresh();
        });
        listen(canvas, 'pointerdown', function (e) {
            toLocal(e);
            scene.tap();
            refresh();
        });
        listen(canvas, 'keydown', function (e) {
            const k = e.key;
            let dx = 0;
            let dy = 0;
            if (k === 'Enter' || k === ' ') {
                e.preventDefault();
                scene.tap();
                refresh();
                return;
            }
            if (k === 'ArrowLeft') {
                dx = -KEY_STEP;
            }
            else if (k === 'ArrowRight') {
                dx = KEY_STEP;
            }
            else if (k === 'ArrowUp') {
                dy = -KEY_STEP;
            }
            else if (k === 'ArrowDown') {
                dy = KEY_STEP;
            }
            else {
                return;
            }
            e.preventDefault();
            inp.x = clamp(inp.x + dx, 0, W);
            inp.y = clamp(inp.y + dy, 0, H);
            inp.idle = 0;
            refresh();
        });
        if (!reduce) {
            rafId = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(rafId);
            for (let i = 0; i < cleaners.length; i += 1) {
                cleaners[i]();
            }
        };
    }
    const LINK_RADIUS = 72;
    const MAX_LINKS = 3;
    const GRID_CELL = LINK_RADIUS;
    const LINE_ALPHA = 0.6;
    const NODE_COUNT = 110;
    const CURSOR_LINKS = 6;
    const TXT_GRID = '이웃 칸만 계산 — 가까운 별끼리 선';
    const TXT_CURSOR = '포인터가 별 하나가 된다';
    function makeScene(inp, reduce) {
        const rnd = lcg(450707);
        const nodes = [];
        for (let i = 0; i <= NODE_COUNT; i += 1) {
            const a = rnd() * PI2;
            const sp = 0.35 + 0.65 * rnd();
            nodes.push({ x: rnd() * W, y: rnd() * H, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, c: STAR_RGBS[i % STAR_RGBS.length], n: 0 });
        }
        // 마지막 노드는 커서 별 — 포인터가 없으면 자동 곡선을 돈다
        const cur = nodes[NODE_COUNT];
        cur.vx = 0;
        cur.vy = 0;
        let t = 0;
        const cols = Math.ceil(W / GRID_CELL);
        const rows = Math.ceil(H / GRID_CELL);
        const scene = {
            step() {
                t += 1;
                for (let i = 0; i < NODE_COUNT; i += 1) {
                    const s = nodes[i];
                    s.x += s.vx;
                    s.y += s.vy;
                    if (s.x < 0 || s.x > W) {
                        s.vx = -s.vx;
                        s.x = clamp(s.x, 0, W);
                    }
                    if (s.y < 0 || s.y > H) {
                        s.vy = -s.vy;
                        s.y = clamp(s.y, 0, H);
                    }
                }
                let tx = W / 2 + Math.cos(t * 0.021) * 170;
                let ty = H / 2 + Math.sin(t * 0.034) * 90;
                if (inp.idle < IDLE_TICKS) {
                    tx = inp.x;
                    ty = inp.y;
                }
                cur.x = lerp(cur.x, tx, 0.12);
                cur.y = lerp(cur.y, ty, 0.12);
            },
            draw(ctx) {
                paintBg(ctx, 1);
                // 격자 칸마다 별 번호를 모아 두면 이웃 3x3 칸만 보면 된다
                const cells = [];
                for (let i = 0; i < cols * rows; i += 1) {
                    cells.push([]);
                }
                for (let i = 0; i < nodes.length; i += 1) {
                    nodes[i].n = 0;
                    const cx = clamp(Math.floor(nodes[i].x / GRID_CELL), 0, cols - 1);
                    const cy = clamp(Math.floor(nodes[i].y / GRID_CELL), 0, rows - 1);
                    cells[cy * cols + cx].push(i);
                }
                ctx.lineCap = 'round';
                for (let i = 0; i < nodes.length; i += 1) {
                    const a = nodes[i];
                    const cx = clamp(Math.floor(a.x / GRID_CELL), 0, cols - 1);
                    const cy = clamp(Math.floor(a.y / GRID_CELL), 0, rows - 1);
                    const cap = i === NODE_COUNT ? CURSOR_LINKS : MAX_LINKS;
                    for (let gy = Math.max(0, cy - 1); gy <= Math.min(rows - 1, cy + 1); gy += 1) {
                        for (let gx = Math.max(0, cx - 1); gx <= Math.min(cols - 1, cx + 1); gx += 1) {
                            const list = cells[gy * cols + gx];
                            for (let q = 0; q < list.length; q += 1) {
                                const j = list[q];
                                const b = nodes[j];
                                if (j <= i || a.n >= cap) {
                                    continue;
                                }
                                const capB = j === NODE_COUNT ? CURSOR_LINKS : MAX_LINKS;
                                if (b.n >= capB) {
                                    continue;
                                }
                                const d = Math.hypot(a.x - b.x, a.y - b.y);
                                if (d >= LINK_RADIUS) {
                                    continue;
                                }
                                a.n += 1;
                                b.n += 1;
                                const k = 1 - d / LINK_RADIUS;
                                ctx.strokeStyle = rgba(mix(a.c, b.c, 0.5), LINE_ALPHA * Math.pow(k, 1.3));
                                ctx.lineWidth = 0.6 + 1.4 * k;
                                ctx.beginPath();
                                ctx.moveTo(a.x, a.y);
                                ctx.lineTo(b.x, b.y);
                                ctx.stroke();
                            }
                        }
                    }
                }
                for (let i = 0; i < nodes.length; i += 1) {
                    const s = nodes[i];
                    glow(ctx, s.x, s.y, i === NODE_COUNT ? 22 : 9, s.c, i === NODE_COUNT ? 0.6 : 0.35);
                    ctx.fillStyle = rgba(s.c, 0.95);
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, i === NODE_COUNT ? 3.4 : 1.7, 0, PI2);
                    ctx.fill();
                }
            },
            label() {
                return inp.idle < IDLE_TICKS ? TXT_CURSOR : TXT_GRID;
            },
            tap() {
                for (let i = 0; i < NODE_COUNT; i += 1) {
                    const a = rnd() * PI2;
                    const sp = 0.35 + 0.65 * rnd();
                    nodes[i].vx = Math.cos(a) * sp;
                    nodes[i].vy = Math.sin(a) * sp;
                }
            }
        };
        if (reduce) {
            for (let i = 0; i < 30; i += 1) {
                scene.step();
            }
        }
        return scene;
    }
    start(document.getElementById('scRoot'), document.getElementById('scCanvas'), document.getElementById('scStatus'), document.getElementById('scBtn'), makeScene);
})();
</script>
</body>
</html>
