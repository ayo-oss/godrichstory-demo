<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>順位が高いほど影が浮かび上がる行 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lbe is-demo" id="lbe">
  <ul class="lbe__list" id="lbeList" role="list"></ul>
  <p class="lbe__sr" id="lbeSr" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  "use strict";

  var LEADERBOARD_ELEVATION_BLUR_MAX_PX = 26;
  var LEADERBOARD_ELEVATION_OFFSET_MAX_PX = 15;
  var LEADERBOARD_ELEVATION_ALPHA_MAX = 0.34;
  var LEADERBOARD_ELEVATION_LIFT_MAX_PX = 7;
  var LEADERBOARD_ELEVATION_TICK_MS = 900;

  function seedRand(seed) {
    var s = seed % 2147483647; if (s <= 0) s += 2147483646;
    return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  }
  var rand = seedRand(418);

  var root = document.getElementById("lbe");
  var list = document.getElementById("lbeList");
  var sr = document.getElementById("lbeSr");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var players = [
    { id: "p1", name: "CORAL5", score: 910 },
    { id: "p2", name: "FABLE2", score: 872 },
    { id: "p3", name: "TALON8", score: 834 },
    { id: "p4", name: "OPAL_6", score: 796 },
    { id: "p5", name: "RUNE_1", score: 758 }
  ];

  var nodes = {};
  var rankX = {};
  var N = players.length;

  function human() {
    if (root.classList.contains("is-demo")) root.classList.remove("is-demo");
  }

  function sortedPlayers() {
    return players.slice().sort(function (a, b) { return b.score - a.score; });
  }

  function xForRank(rank) {
    return N > 1 ? (N - rank) / (N - 1) : 1;
  }

  // 계산 겹: 순위를 0~1 로 정규화한 x 값 하나로 그림자의 세 속성(blur·offset·alpha)과
  // 카드의 들뜨는 높이(lift)를 동시에 만든다 — 상수 네 개가 그 값의 상한을 정한다.
  function elevationFor(rank) {
    return elevationForX(xForRank(rank));
  }

  function elevationForX(x) {
    return {
      blur: 4 + x * LEADERBOARD_ELEVATION_BLUR_MAX_PX,
      offset: 2 + x * LEADERBOARD_ELEVATION_OFFSET_MAX_PX,
      alpha: 0.08 + x * LEADERBOARD_ELEVATION_ALPHA_MAX,
      lift: x * LEADERBOARD_ELEVATION_LIFT_MAX_PX
    };
  }

  function paintElevation(row, e) {
    row.li.style.boxShadow = "0 " + e.offset.toFixed(1) + "px " + e.blur.toFixed(1) + "px rgba(23,20,26," + e.alpha.toFixed(2) + ")";
    row.li.style.transform = "translateY(-" + e.lift.toFixed(1) + "px)";
  }

  function applyElevation(row, rank) {
    paintElevation(row, elevationFor(rank));
  }

  // x 를 직접 requestAnimationFrame 으로 보간한다 — CSS transition 은 재정렬(appendChild)과
  // 같은 동기 실행 안에서 값을 다시 쓰면 페인트 전이라 순간이동해 버릴 때가 있어(브라우저가
  // "이전 값"을 페인트한 적이 없으면 transition 이 안 걸린다), 계산 겹을 프레임마다 직접 찍는다.
  function tweenRow(row, id, toRank) {
    var fromX = rankX[id] != null ? rankX[id] : xForRank(toRank);
    var toX = xForRank(toRank);
    rankX[id] = toX;
    if (reduce || fromX === toX) { paintElevation(row, elevationForX(toX)); return; }
    var t0 = performance.now();
    (function step(now) {
      var t = Math.min(1, (now - t0) / TWEEN_MS);
      var eased = 1 - Math.pow(1 - t, 3);
      paintElevation(row, elevationForX(fromX + (toX - fromX) * eased));
      if (t < 1) requestAnimationFrame(step);
    })(t0);
  }
  function relayout(announce) {
    var order = sortedPlayers();
    order.forEach(function (p, i) {
      list.appendChild(nodes[p.id].li);
      nodes[p.id].rank.textContent = String(i + 1);
      nodes[p.id].score.textContent = String(p.score);
      tweenRow(nodes[p.id], p.id, i + 1);
    });
    if (announce) sr.textContent = order[0].name + " が1位です";
    return order;
  }

  function bump(id) {
    var p = players.filter(function (x) { return x.id === id; })[0];
    p.score += 20 + Math.floor(rand() * 25);
    relayout(true);
  }

  players.forEach(function (p) {
    var li = document.createElement("li");
    li.className = "lbe__row";
    li.setAttribute("role", "listitem");
    li.tabIndex = 0;

    var rank = document.createElement("span");
    rank.className = "lbe__rank";
    var name = document.createElement("span");
    name.className = "lbe__name";
    name.textContent = p.name;
    var score = document.createElement("span");
    score.className = "lbe__score";

    li.appendChild(rank);
    li.appendChild(name);
    li.appendChild(score);

    nodes[p.id] = { li: li, rank: rank, score: score };

    li.addEventListener("click", function () { human(); bump(p.id); });
    li.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); human(); bump(p.id); }
    });

    list.appendChild(li);
  });

  // $duration 토큰을 CSS 변수로 받아 그대로 rAF 트윈 길이로 쓴다 — 변형이 $duration 을
  // 바꾸면 여기서도 같이 바뀐다.
  var TWEEN_MS = parseFloat(getComputedStyle(nodes[players[0].id].li).getPropertyValue("--lbe-duration")) || 650;

  players.forEach(function (p, i) {
    rankX[p.id] = xForRank(i + 1);
    applyElevation(nodes[p.id], i + 1);
  });

  if (!reduce) {
    function loop() {
      if (root.classList.contains("is-demo")) {
        // 마지막 순위를 1위 점수보다 높게 올려 순위 범위를 끝까지 오가게 한다 —
        // 그래야 elevationFor() 의 x(0~1) 가 매 틱 전체 구간을 지나며 그림자가 크게 움직인다.
        var order = sortedPlayers();
        var last = order[order.length - 1];
        var top = order[0];
        last.score = top.score + 15 + Math.floor(rand() * 20);
        relayout(true);
      }
      window.setTimeout(loop, LEADERBOARD_ELEVATION_TICK_MS);
    }
    window.setTimeout(loop, LEADERBOARD_ELEVATION_TICK_MS);
  }
})();
</script>
</body>
</html>
