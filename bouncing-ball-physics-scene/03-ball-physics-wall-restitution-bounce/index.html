<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 가장자리에 닿는 순간 방향을 반대로 뒤집고 그 속도에 반발계수를 곱해 줄여, 튕길수록 공의 움직임이 조금씩 잦아든다 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bp is-demo" id="bpRoot">
  <canvas class="bp__canvas" id="bpCanvas" width="480" height="300"></canvas>
  <p class="bp__caption">화면 가장자리에 닿는 순간 방향을 반대로 뒤집고 그 속도에 반발계수를 곱해 줄여, 튕길수록 공의 움직임이 조금씩 잦아든다</p>
</div>
</main>
<script>
(function () {
  // 기법: 공이 캔버스 네 변 중 하나에 닿으면 그 축의 속도 부호를 뒤집고 WALL_RESTITUTION
  // 을 곱해 줄인다 — 반복할수록 속도 크기가 기하급수로 잦아든다. 전체 속도가 MIN_SPEED
  // 아래로 내려가면 씨드 난수로 새 방향·속도를 받아 다시 살아난다(같은 감쇠 패턴을
  // 반복해서 보여주기 위함이지 에너지가 새로 생기는 건 아니다).
  var root = document.getElementById('bpRoot');
  var canvas = document.getElementById('bpCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  var CALC_W = 320, CALC_H = 200;
  var WALL_RESTITUTION = 0.86;
  var MIN_SPEED = 46;
  var KICK_SPEED = 210;
  var STAGE_BG = '255,77,31';

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var rand = seedRand(427031);

  var COLORS = ['#b9a0ff', '#6ec8ff', '#ff9ebb'];
  var radii = [11, 15, 19];
  var balls = [];
  function kick(b) {
    var ang = rand() * Math.PI * 2;
    var spd = KICK_SPEED * (0.7 + rand() * 0.5);
    b.vx = Math.cos(ang) * spd;
    b.vy = Math.sin(ang) * spd;
    b.hits = 0;
  }
  for (var i = 0; i < radii.length; i += 1) {
    var r = radii[i];
    var b = { x: r + rand() * (CALC_W - r * 2), y: r + rand() * (CALC_H - r * 2), r: r, color: COLORS[i], squash: 0, hits: 0 };
    kick(b);
    balls.push(b);
  }

  function stepSim(dtMs) {
    var dtS = dtMs / 1000;
    for (var i = 0; i < balls.length; i += 1) {
      var b = balls[i];
      b.x += b.vx * dtS;
      b.y += b.vy * dtS;
      var hit = false;
      if (b.x - b.r < 0) { b.x = b.r; b.vx = -b.vx * WALL_RESTITUTION; hit = true; }
      if (b.x + b.r > CALC_W) { b.x = CALC_W - b.r; b.vx = -b.vx * WALL_RESTITUTION; hit = true; }
      if (b.y - b.r < 0) { b.y = b.r; b.vy = -b.vy * WALL_RESTITUTION; hit = true; }
      if (b.y + b.r > CALC_H) { b.y = CALC_H - b.r; b.vy = -b.vy * WALL_RESTITUTION; hit = true; }
      if (hit) {
        b.hits += 1;
        b.squash = Math.min(1, Math.hypot(b.vx, b.vy) / 260 + 0.25);
      }
      b.squash = Math.max(0, b.squash - dtS * 3.4);
      var speed = Math.hypot(b.vx, b.vy);
      if (speed < MIN_SPEED) kick(b);
    }
  }

  function drawBall(sx, sy, b) {
    var px = b.x * sx, py = b.y * sy, pr = b.r * ((sx + sy) / 2);
    var ang = Math.atan2(b.vy, b.vx);
    var speed = Math.hypot(b.vx, b.vy);
    var stretch = 1 + Math.min(0.4, speed / 900);
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(ang);
    ctx.scale(stretch, (1 - b.squash * 0.3) / stretch);
    ctx.beginPath();
    ctx.arc(0, 0, pr, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    var sx = cw / CALC_W, sy = ch / CALC_H;
    ctx.fillStyle = 'rgba(' + STAGE_BG + ',0.24)';
    ctx.fillRect(0, 0, cw, ch);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(2, 2, cw - 4, ch - 4);
    for (var j = 0; j < balls.length; j += 1) drawBall(sx, sy, balls[j]);
  }

  var cw = 480, ch = 300;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    ctx.fillStyle = 'rgb(' + STAGE_BG + ')';
    ctx.fillRect(0, 0, cw, ch);
    draw();
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var elapsed = 0;
  if (reduce) root.classList.remove('is-demo');
  var warmSteps = reduce ? 50 : 40;
  for (var w = 0; w < warmSteps; w += 1) { elapsed += 16; stepSim(16); }

  var lastTs = null;
  var acc = 0;
  var FIXED_DT = 16;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var frameDt = Math.min(ts - lastTs, 48);
    lastTs = ts;
    if (!reduce) {
      acc += frameDt;
      while (acc >= FIXED_DT) { elapsed += FIXED_DT; stepSim(FIXED_DT); acc -= FIXED_DT; }
      draw();
    }
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  draw();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
