<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポインターが近づくと距離に反比例する力でボールを押し出して散らし、離れると再び元の位置付近をゆっくり漂う。 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bp is-demo" id="bpRoot" tabindex="0">
  <canvas class="bp__canvas" id="bpCanvas" width="480" height="300"></canvas>
  <p class="bp__caption">ポインターが近づくと距離に反比例する力でボールを押し出して散らし、離れると再び元の位置付近をゆっくり漂う。</p>
</div>
</main>
<script>
(function () {
  // 기법: 포인터(실제 마우스/터치 또는 방향키로 움직이는 가상 포인터)와 공 사이 거리를
  // 재서 POINTER_REPEL_RADIUS 안이면 거리에 반비례하는 밀어내는 힘을 가한다(가까울수록
  // 세게). 반경 밖에서는 각 공이 자기 홈 위치 주변을 사인파로 천천히 떠돈다. 자동재생은
  // 가상 포인터가 궤도를 그리며 이 힘 함수를 그대로 호출하고, 실제 입력이 오면 같은
  // 함수를 실제 좌표로 호출하도록 전환한다.
  var root = document.getElementById('bpRoot');
  var canvas = document.getElementById('bpCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  var CALC_W = 320, CALC_H = 200;
  var POINTER_REPEL_RADIUS = 90;
  var REPEL_FORCE = 5200;
  var DRIFT_SPEED = 0.55;
  var DAMPING = 3.4;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var rand = seedRand(427051);

  var COLORS = ['#6ec8ff', '#4cd4a6', '#b9a0ff', '#ff9ebb', '#ffcf7a', '#8fd7ff'];
  var balls = [];
  for (var i = 0; i < 6; i += 1) {
    var hx = 30 + rand() * (CALC_W - 60);
    var hy = 30 + rand() * (CALC_H - 60);
    balls.push({
      hx: hx, hy: hy,
      x: hx, y: hy,
      vx: 0, vy: 0,
      r: 9 + rand() * 7,
      color: COLORS[i % COLORS.length],
      phase: rand() * Math.PI * 2,
      squash: 0
    });
  }

  var pointer = { x: CALC_W * 0.5, y: CALC_H * 0.5 };
  var pointerActive = false;

  function demoPointerPos(t) {
    var tt = t / 1000;
    return {
      x: CALC_W * 0.5 + Math.cos(tt * 1.15) * (CALC_W * 0.36),
      y: CALC_H * 0.5 + Math.sin(tt * 1.7) * (CALC_H * 0.34)
    };
  }

  function applyPointer(px, py, dtS) {
    for (var i = 0; i < balls.length; i += 1) {
      var b = balls[i];
      var dx = b.x - px, dy = b.y - py;
      var dist = Math.hypot(dx, dy) || 0.001;
      if (dist < POINTER_REPEL_RADIUS) {
        var force = REPEL_FORCE * (1 - dist / POINTER_REPEL_RADIUS) / dist;
        b.vx += dx * force * dtS;
        b.vy += dy * force * dtS;
        b.squash = Math.min(1, b.squash + (1 - dist / POINTER_REPEL_RADIUS) * 0.6);
      }
    }
  }

  function stepSim(dtMs, nowMs, px, py) {
    var dtS = dtMs / 1000;
    applyPointer(px, py, dtS);
    for (var i = 0; i < balls.length; i += 1) {
      var b = balls[i];
      var homeX = b.hx + Math.cos(nowMs / 1000 * DRIFT_SPEED + b.phase) * 10;
      var homeY = b.hy + Math.sin(nowMs / 1000 * DRIFT_SPEED * 0.8 + b.phase) * 10;
      var pull = 0.9;
      b.vx += (homeX - b.x) * pull * dtS;
      b.vy += (homeY - b.y) * pull * dtS;
      b.vx -= b.vx * Math.min(1, DAMPING * dtS);
      b.vy -= b.vy * Math.min(1, DAMPING * dtS);
      b.x += b.vx * dtS;
      b.y += b.vy * dtS;
      if (b.x < b.r) { b.x = b.r; b.vx *= -0.5; }
      if (b.x > CALC_W - b.r) { b.x = CALC_W - b.r; b.vx *= -0.5; }
      if (b.y < b.r) { b.y = b.r; b.vy *= -0.5; }
      if (b.y > CALC_H - b.r) { b.y = CALC_H - b.r; b.vy *= -0.5; }
      b.squash = Math.max(0, b.squash - dtS * 2.6);
    }
  }

  function draw(px, py) {
    var sx = cw / CALC_W, sy = ch / CALC_H;
    ctx.clearRect(0, 0, cw, ch);
    ctx.beginPath();
    ctx.arc(px * sx, py * sy, POINTER_REPEL_RADIUS * ((sx + sy) / 2), 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    for (var i = 0; i < balls.length; i += 1) {
      var b = balls[i];
      var ppx = b.x * sx, ppy = b.y * sy, pr = b.r * ((sx + sy) / 2);
      var speed = Math.hypot(b.vx, b.vy);
      var ang = Math.atan2(b.vy, b.vx);
      var stretch = 1 + Math.min(0.5, speed / 500) + b.squash * 0.2;
      ctx.save();
      ctx.translate(ppx, ppy);
      ctx.rotate(ang);
      ctx.scale(stretch, 1 / stretch);
      ctx.beginPath();
      ctx.arc(0, 0, pr, 0, Math.PI * 2);
      ctx.fillStyle = b.color;
      ctx.fill();
      ctx.restore();
    }
    ctx.beginPath();
    ctx.arc(px * sx, py * sy, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fill();
  }

  var cw = 480, ch = 300;
  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    draw(pointer.x, pointer.y);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var elapsed = 0;
  if (reduce) root.classList.remove('is-demo');

  function toCalc(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var nx = (clientX - rect.left) / rect.width;
    var ny = (clientY - rect.top) / rect.height;
    return { x: Math.max(0, Math.min(CALC_W, nx * CALC_W)), y: Math.max(0, Math.min(CALC_H, ny * CALC_H)) };
  }

  function onRealPointer(cx, cy) {
    pointerActive = true;
    root.classList.remove('is-demo');
    var p = toCalc(cx, cy);
    pointer.x = p.x; pointer.y = p.y;
    if (reduce) {
      stepSim(16, elapsed, pointer.x, pointer.y);
      draw(pointer.x, pointer.y);
    }
  }

  canvas.addEventListener('mousemove', function (e) { onRealPointer(e.clientX, e.clientY); });
  canvas.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches[0]) onRealPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  root.addEventListener('keydown', function (e) {
    var step = 14;
    var moved = true;
    if (e.key === 'ArrowLeft') pointer.x -= step;
    else if (e.key === 'ArrowRight') pointer.x += step;
    else if (e.key === 'ArrowUp') pointer.y -= step;
    else if (e.key === 'ArrowDown') pointer.y += step;
    else moved = false;
    if (moved) {
      e.preventDefault();
      pointerActive = true;
      root.classList.remove('is-demo');
      pointer.x = Math.max(0, Math.min(CALC_W, pointer.x));
      pointer.y = Math.max(0, Math.min(CALC_H, pointer.y));
      if (reduce) {
        stepSim(16, elapsed, pointer.x, pointer.y);
        draw(pointer.x, pointer.y);
      }
    }
  });

  var lastTs = null;
  var acc = 0;
  var FIXED_DT = 16;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var frameDt = Math.min(ts - lastTs, 48);
    lastTs = ts;
    if (!reduce) {
      acc += frameDt;
      while (acc >= FIXED_DT) {
        elapsed += FIXED_DT;
        var pp = pointerActive ? pointer : demoPointerPos(elapsed);
        if (!pointerActive) { pointer.x = pp.x; pointer.y = pp.y; }
        stepSim(FIXED_DT, elapsed, pointer.x, pointer.y);
        acc -= FIXED_DT;
      }
      draw(pointer.x, pointer.y);
    }
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  draw(pointer.x, pointer.y);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
