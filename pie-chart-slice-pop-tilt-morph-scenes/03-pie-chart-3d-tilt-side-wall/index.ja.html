<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>円盤を傾けて側面の厚みまで描く立体の円グラフ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pc is-demo" id="pc">
  <canvas class="pc__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="円盤を傾けて側面の厚みまで描く立体の円グラフ。ポインターの高さか ↑/↓ で傾きを変え、←/→ で扇形を選びます"></canvas>
  <p class="pc__status" data-role="status" aria-live="off">ポインターの高さで円盤を傾けています</p>
  <div class="pc__tools">
    <button class="pc__btn" data-role="top" type="button">上から見る</button>
    <button class="pc__btn" data-role="side" type="button">横から見る</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("pc");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    const TAU = Math.PI * 2;
    // 각도 원점 — 12시 방향에서 시계 방향으로 잰다 (캔버스는 y 가 아래로 커서 양의 각이 시계 방향)
    const TOP = -Math.PI / 2;
    // 파스텔 팔레트 — 어두운 무대 위에 밝은 조각을 얹어 명도 차로 경계가 읽힌다
    const BG = [29, 26, 44];
    const PANEL = [44, 39, 64];
    const PAPER = [255, 248, 234];
    const INK = [46, 38, 62];
    const PAL = [
        [124, 196, 255],
        [255, 160, 190],
        [126, 226, 192],
        [190, 164, 255],
        [255, 208, 168],
        [246, 228, 140],
        [150, 222, 236],
        [232, 182, 228],
        [196, 220, 160],
    ];
    // 가상 데이터의 이름 — 실제 항목이 아니라 순서만 뜻한다
    const LABELS = ['項目 A', '項目 B', '項目 C', '項目 D', '項目 E', '項目 F', '項目 G', '項目 H', '項目 I'];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function easeOutCubic(x) { const c = 1 - clamp(x, 0, 1); return 1 - c * c * c; }
    // 앞뒤가 대칭인 거듭제곱 이징 — p 가 클수록 가운데에서 더 빨리 지나간다
    function easeInOutPow(x, p) {
        const c = clamp(x, 0, 1);
        return c < 0.5 ? 0.5 * Math.pow(2 * c, p) : 1 - 0.5 * Math.pow(2 - 2 * c, p);
    }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !statusEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    const still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function onResize() {
        fitCanvas();
        draw();
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    // 화면 좌표(CSS px) → 장면 좌표(480x300). 리사이즈 뒤에도 늘 현재 크기로 다시 잰다
    function toScene(ev) {
        const r = cv.getBoundingClientRect();
        return [((ev.clientX - r.left) / r.width) * W, ((ev.clientY - r.top) / r.height) * H];
    }
    // 시드 고정 난수 — 같은 시드면 같은 가상 데이터가 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function seededValues(seed, n, lo, hi) {
        const rnd = makeRng(seed);
        const out = [];
        for (let i = 0; i < n; i += 1) {
            out.push(lo + Math.floor(rnd() * (hi - lo + 1)));
        }
        return out;
    }
    // 숫자 목록 → 부채꼴 — 합계로 나눈 몫을 앞에서부터 쌓아 시작 각과 끝 각을 만든다
    function layout(values) {
        let total = 0;
        for (let i = 0; i < values.length; i += 1) {
            total += values[i];
        }
        const out = [];
        let acc = 0;
        for (let i = 0; i < values.length; i += 1) {
            const a0 = (acc / total) * TAU;
            acc += values[i];
            out.push({ value: values[i], share: values[i] / total, a0: a0, a1: (acc / total) * TAU });
        }
        return out;
    }
    function dirX(a) { return Math.cos(TOP + a); }
    function dirY(a) { return Math.sin(TOP + a); }
    // 포인터가 가리키는 각 — atan2 로 구한 화면 각을 12시 기준 0 ~ 2π 로 옮긴다
    function angleAt(x, y, cx, cy) {
        let a = Math.atan2(y - cy, x - cx) - TOP;
        while (a < 0) {
            a += TAU;
        }
        while (a >= TAU) {
            a -= TAU;
        }
        return a;
    }
    function sliceAt(slices, a) {
        for (let i = 0; i < slices.length; i += 1) {
            if (a >= slices[i].a0 && a < slices[i].a1) {
                return i;
            }
        }
        return -1;
    }
    // 부채꼴 경로 — 안쪽 반지름 r0 이 0 이면 가운데 점까지, 아니면 도넛 조각
    function wedgePath(c, cx, cy, r0, r1, a0, a1) {
        c.beginPath();
        c.arc(cx, cy, r1, TOP + a0, TOP + a1, false);
        if (r0 > 0.5) {
            c.arc(cx, cy, r0, TOP + a1, TOP + a0, true);
        }
        else {
            c.lineTo(cx, cy);
        }
        c.closePath();
    }
    function pctText(share) { return (share * 100).toFixed(1) + '%'; }
    function sayPick(i, share) { say(LABELS[i] + ' · ' + pctText(share)); }
    // 세 자리마다 쉼표 — 지역 설정에 기대지 않는다
    function groupDigits(n) {
        const s = String(Math.round(Math.abs(n)));
        let out = '';
        for (let i = 0; i < s.length; i += 1) {
            if (i > 0 && (s.length - i) % 3 === 0) {
                out += ',';
            }
            out += s[i];
        }
        return (n < 0 ? '-' : '') + out;
    }
    // 왼쪽 범례 — 색 칩 + 이름 + 비율, 고른 줄은 밝게
    const LEG_X = 16;
    const LEG_Y = 100;
    const LEG_ROW = 16;
    function legendRow(row, label, value, c, on, dim) {
        const y = LEG_Y + row * LEG_ROW;
        ctx.fillStyle = rgba(c, dim ? 0.3 : 1);
        ctx.fillRect(LEG_X, y - 9, 9, 9);
        ctx.textBaseline = 'alphabetic';
        ctx.textAlign = 'left';
        ctx.font = (on ? '700' : '500') + ' 11px sans-serif';
        ctx.fillStyle = rgba(PAPER, on ? 1 : (dim ? 0.4 : 0.74));
        ctx.fillText(label, LEG_X + 15, y);
        ctx.textAlign = 'right';
        ctx.fillText(value, LEG_X + 132, y);
    }
    // 범례 아래 수치 한 줄 — 이름표 + 값
    function statRow(y, label, value) {
        ctx.textBaseline = 'alphabetic';
        ctx.textAlign = 'left';
        ctx.fillStyle = rgba(PAPER, 0.6);
        ctx.font = '500 11px sans-serif';
        ctx.fillText(label, LEG_X, y);
        ctx.fillStyle = rgba(PAPER, 0.96);
        ctx.font = '700 14px sans-serif';
        ctx.fillText(value, LEG_X, y + 17);
    }
    function clearStage() {
        ctx.fillStyle = rgba(BG, 1);
        ctx.fillRect(0, 0, W, H);
    }
    // 시연 일정 — 루프 안의 시각(ms) 표를 지날 때마다 한 번씩 부른다
    let schedCycle = -1;
    let schedIdx = 0;
    function runSchedule(t, loop, marks, fire) {
        const cyc = Math.floor(t / loop);
        const p = t - cyc * loop;
        if (cyc !== schedCycle) {
            schedCycle = cyc;
            schedIdx = 0;
        }
        while (schedIdx < marks.length && p >= marks[schedIdx]) {
            fire(schedIdx, cyc);
            schedIdx += 1;
        }
    }
    // 원판을 앞으로 눕히는 각(도) — 원 위의 점을 세로로 cos(기울기) 만큼 눌러 타원으로 투영한다
    const TILT_DEG = 55;
    // 원판 두께(px) — 화면에서는 sin(기울기) 를 곱한 만큼만 보인다 (위에서 보면 0, 옆에서 보면 전부)
    const DEPTH_PX = 26;
    // 옆면이 빛을 등질수록 어두워지는 몫 — 0 이면 옆면 밝기가 한결같다
    const SIDE_SHADE = 0.45;
    const GAP_PX = 5;
    const LIFT_PX = 10;
    const TILT_MIN = 20;
    const TILT_MAX = 75;
    // 시연 중에만 원판을 돌린다(rad/s)
    const SPIN_SPEED = 0.8;
    const SEG = (4 * Math.PI) / 180;
    const DEG = Math.PI / 180;
    // 빛은 왼쪽 앞에서 — 바깥 법선이 이쪽을 볼수록 옆면이 밝다
    const LIGHT_X = -0.55;
    const LIGHT_Y = 0.83;
    const SLICE_N = 6;
    const SEED = 467;
    const CX = 316;
    const CY = 148;
    const R = 112;
    const DEMO_LOOP = 2000;
    const TXT_IDLE = 'ポインターの高さで円盤を傾けています';
    const topBtn = root.querySelector('[data-role="top"]');
    const sideBtn = root.querySelector('[data-role="side"]');
    const slices = layout(seededValues(SEED, SLICE_N, 10, 36));
    let tilt = TILT_DEG * DEG;
    let tiltTo = tilt;
    let rot = 0;
    let rotTo = 0;
    let pick = -1;
    const lifts = slices.map(function () { return 0; });
    function report() {
        if (pick >= 0) {
            sayPick(pick, slices[pick].share);
        }
        else {
            say(TXT_IDLE);
        }
    }
    function follow(cur, to, rate) {
        return cur + (to - cur) * (1 - Math.exp(-rate * FIXED_DT / 1000));
    }
    function step() {
        tilt = follow(tilt, tiltTo, 9);
        rot = follow(rot, rotTo, 9);
        for (let i = 0; i < SLICE_N; i += 1) {
            lifts[i] = follow(lifts[i], i === pick ? LIFT_PX : 0, 10);
        }
    }
    function settle() {
        tilt = tiltTo;
        rot = rotTo;
        for (let i = 0; i < SLICE_N; i += 1) {
            lifts[i] = i === pick ? LIFT_PX : 0;
        }
    }
    function demoTick(t) {
        if (t < 200) {
            return;
        }
        const p = t - 200;
        tiltTo = (TILT_DEG + 15 * Math.sin((TAU * p) / DEMO_LOOP)) * DEG;
        rotTo = (SPIN_SPEED * p) / 1000;
    }
    // 판 위의 점(px, py, 높이 z) → 화면. 세로는 cos(기울기) 로 눌리고 높이는 sin(기울기) 만큼 위로 선다
    function proj(px, py, z) {
        return [CX + px, CY + py * Math.cos(tilt) + (DEPTH_PX / 2 - z) * Math.sin(tilt)];
    }
    function quad(p, c) {
        ctx.beginPath();
        ctx.moveTo(p[0][0], p[0][1]);
        for (let k = 1; k < p.length; k += 1) {
            ctx.lineTo(p[k][0], p[k][1]);
        }
        ctx.closePath();
        ctx.fillStyle = rgba(c, 1);
        ctx.fill();
        // 이웃 띠 사이 머리카락 틈을 같은 색 선으로 메운다
        ctx.strokeStyle = rgba(c, 1);
        ctx.lineWidth = 0.8;
        ctx.stroke();
    }
    // 옆면 밝기 — 판 위 법선(nx, ny)과 빛 방향의 내적, 등질수록 SIDE_SHADE 만큼 어두워진다
    function sideColor(i, nx, ny) {
        const f = 1 - SIDE_SHADE * (1 - Math.max(0, nx * LIGHT_X + ny * LIGHT_Y));
        const base = mix(PAL[i], BG, 0.2);
        return [base[0] * f, base[1] * f, base[2] * f];
    }
    function drawSlice(i) {
        const s = slices[i];
        const m = (s.a0 + s.a1) / 2 + rot;
        const ox = Math.cos(TOP + m) * GAP_PX;
        const oy = Math.sin(TOP + m) * GAP_PX;
        const zb = lifts[i];
        const zt = DEPTH_PX + lifts[i];
        const f0 = TOP + s.a0 + rot;
        const f1 = TOP + s.a1 + rot;
        // 자른 면 두 장 — 바깥 법선이 보는 사람 쪽(+y)일 때만 보인다
        const walls = [[f0, Math.sin(f0), -Math.cos(f0)], [f1, -Math.sin(f1), Math.cos(f1)]];
        for (let w = 0; w < 2; w += 1) {
            const f = walls[w][0];
            const nx = walls[w][1];
            const ny = walls[w][2];
            if (ny <= 0) {
                continue;
            }
            const ex = ox + Math.cos(f) * R;
            const ey = oy + Math.sin(f) * R;
            quad([proj(ox, oy, zt), proj(ex, ey, zt), proj(ex, ey, zb), proj(ox, oy, zb)], sideColor(i, nx, ny));
        }
        // 바깥 옆면 — 4° 띠마다 법선을 따로 재서 각도별로 밝기가 바뀐다
        const n = Math.max(1, Math.ceil((f1 - f0) / SEG));
        for (let k = 0; k < n; k += 1) {
            const g0 = f0 + ((f1 - f0) * k) / n;
            const g1 = f0 + ((f1 - f0) * (k + 1)) / n;
            const gm = (g0 + g1) / 2;
            if (Math.sin(gm) <= 0) {
                continue;
            }
            const x0 = ox + Math.cos(g0) * R;
            const y0 = oy + Math.sin(g0) * R;
            const x1 = ox + Math.cos(g1) * R;
            const y1 = oy + Math.sin(g1) * R;
            quad([proj(x0, y0, zt), proj(x1, y1, zt), proj(x1, y1, zb), proj(x0, y0, zb)], sideColor(i, Math.cos(gm), Math.sin(gm)));
        }
        // 윗면 — 타원 위 부채꼴
        ctx.beginPath();
        const c0 = proj(ox, oy, zt);
        ctx.moveTo(c0[0], c0[1]);
        for (let k = 0; k <= n; k += 1) {
            const g = f0 + ((f1 - f0) * k) / n;
            const q = proj(ox + Math.cos(g) * R, oy + Math.sin(g) * R, zt);
            ctx.lineTo(q[0], q[1]);
        }
        ctx.closePath();
        ctx.fillStyle = rgba(i === pick ? mix(PAL[i], PAPER, 0.25) : PAL[i], 1);
        ctx.fill();
        ctx.strokeStyle = rgba(PAPER, 0.28);
        ctx.lineWidth = 1;
        ctx.stroke();
        if (s.share >= 0.07) {
            const t = proj(ox + Math.cos(m + TOP) * R * 0.62, oy + Math.sin(m + TOP) * R * 0.62, zt);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '700 12px sans-serif';
            ctx.fillStyle = rgba(INK, 0.9);
            ctx.fillText(pctText(s.share), t[0], t[1]);
        }
    }
    function draw() {
        clearStage();
        // 바닥 그림자 — 원판 아래 타원
        const g = proj(0, 0, 0);
        ctx.fillStyle = 'rgba(8,6,16,0.35)';
        ctx.beginPath();
        ctx.ellipse(g[0] + 6, g[1] + 8, R + 10, (R + 10) * Math.cos(tilt) + 2, 0, 0, TAU);
        ctx.fill();
        // 화가 알고리즘 — 가운데 각이 화면 뒤(작은 y)인 조각부터 칠해 앞 조각이 뒤 조각의 옆면을 덮게 한다
        const order = slices.map(function (_s, i) { return i; }).sort(function (a, b) {
            const ma = (slices[a].a0 + slices[a].a1) / 2 + rot;
            const mb = (slices[b].a0 + slices[b].a1) / 2 + rot;
            return Math.sin(TOP + ma) - Math.sin(TOP + mb);
        });
        for (let k = 0; k < order.length; k += 1) {
            drawSlice(order[k]);
        }
        for (let i = 0; i < SLICE_N; i += 1) {
            legendRow(i, LABELS[i], pctText(slices[i].share), PAL[i], i === pick, false);
        }
        statRow(212, '傾き · 縦の比率', (tilt / DEG).toFixed(0) + '° · ' + Math.cos(tilt).toFixed(2));
    }
    function after() {
        if (still) {
            settle();
        }
        report();
        draw();
    }
    // 화면 → 판 위 각 — 윗면 높이에서 투영을 거꾸로 풀고 atan2 로 각을 잰다
    function hitSlice(x, y) {
        const py = (y - CY + (DEPTH_PX / 2) * Math.sin(tilt)) / Math.cos(tilt);
        const px = x - CX;
        if (Math.hypot(px, py) > R + GAP_PX) {
            return -1;
        }
        let a = angleAt(px, py, 0, 0) - rot;
        a = ((a % TAU) + TAU) % TAU;
        return sliceAt(slices, a);
    }
    function setTilt(deg) { tiltTo = clamp(deg, TILT_MIN, TILT_MAX) * DEG; }
    function movePick(d) {
        pick = pick < 0 ? (d > 0 ? 0 : SLICE_N - 1) : (pick + d + SLICE_N) % SLICE_N;
        after();
    }
    cv.addEventListener('pointermove', function (ev) {
        wake();
        const p = toScene(ev);
        setTilt(lerp(TILT_MIN, TILT_MAX, clamp((p[1] - 20) / 260, 0, 1)));
        after();
    });
    cv.addEventListener('pointerdown', function (ev) {
        wake();
        const p = toScene(ev);
        const i = hitSlice(p[0], p[1]);
        pick = i === pick ? -1 : i;
        after();
    });
    cv.addEventListener('keydown', function (ev) {
        if (ev.key === 'ArrowRight') {
            ev.preventDefault();
            wake();
            movePick(1);
        }
        else if (ev.key === 'ArrowLeft') {
            ev.preventDefault();
            wake();
            movePick(-1);
        }
        else if (ev.key === 'ArrowUp') {
            ev.preventDefault();
            wake();
            setTilt(tiltTo / DEG - 5);
            after();
        }
        else if (ev.key === 'ArrowDown') {
            ev.preventDefault();
            wake();
            setTilt(tiltTo / DEG + 5);
            after();
        }
        else if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            wake();
            pick = pick < 0 ? 0 : -1;
            after();
        }
        else if (ev.key === 'Escape') {
            ev.preventDefault();
            wake();
            pick = -1;
            after();
        }
    });
    if (topBtn) {
        topBtn.addEventListener('click', function () { wake(); setTilt(TILT_MIN); after(); });
    }
    if (sideBtn) {
        sideBtn.addEventListener('click', function () { wake(); setTilt(TILT_MAX); after(); });
    }
    report();
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    let clock = 0;
    function frame(ts) {
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 순간이동 대신 이어서 움직인다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            clock += FIXED_DT;
            if (demo) {
                demoTick(clock);
            }
            step();
            acc -= FIXED_DT;
            n += 1;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    if (still) {
        settle();
        draw();
    }
    else {
        rafId = window.requestAnimationFrame(frame);
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
    };
})();
</script>
</body>
</html>
