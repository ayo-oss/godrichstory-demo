<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Pie Chart Whose Hovered Slice Springs Out Along Its Center Line — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pc is-demo" id="pc">
  <canvas class="pc__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="A pie chart whose hovered slice springs out along its middle angle. Pick a slice with ←/→ and pin it with Enter"></canvas>
  <p class="pc__status" data-role="status" aria-live="off">Hover a slice</p>
  <div class="pc__tools">
    <button class="pc__btn" data-role="pin" type="button" aria-pressed="false">Pin the slice</button>
    <button class="pc__btn" data-role="reset" type="button">Put all back</button>
  </div>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("pc");
    if (!root) return;
    const W = 480;
    const H = 300;
    const FIXED_DT = 16;
    const TAU = Math.PI * 2;
    // 각도 원점 — 12시 방향에서 시계 방향으로 잰다 (캔버스는 y 가 아래로 커서 양의 각이 시계 방향)
    const TOP = -Math.PI / 2;
    // 파스텔 팔레트 — 어두운 무대 위에 밝은 조각을 얹어 명도 차로 경계가 읽힌다
    const BG = [29, 26, 44];
    const PANEL = [44, 39, 64];
    const PAPER = [255, 248, 234];
    const INK = [46, 38, 62];
    const PAL = [
        [124, 196, 255],
        [255, 160, 190],
        [126, 226, 192],
        [190, 164, 255],
        [255, 208, 168],
        [246, 228, 140],
        [150, 222, 236],
        [232, 182, 228],
        [196, 220, 160],
    ];
    // 가상 데이터의 이름 — 실제 항목이 아니라 순서만 뜻한다
    const LABELS = ['Item A', 'Item B', 'Item C', 'Item D', 'Item E', 'Item F', 'Item G', 'Item H', 'Item I'];
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function easeOutCubic(x) { const c = 1 - clamp(x, 0, 1); return 1 - c * c * c; }
    // 앞뒤가 대칭인 거듭제곱 이징 — p 가 클수록 가운데에서 더 빨리 지나간다
    function easeInOutPow(x, p) {
        const c = clamp(x, 0, 1);
        return c < 0.5 ? 0.5 * Math.pow(2 * c, p) : 1 - 0.5 * Math.pow(2 - 2 * c, p);
    }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !statusEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const status = statusEl;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    const still = reduceQuery.matches;
    // 자동 시연 중인가 — 사람이 처음 만지는 순간 시연을 멈추고 상태 줄을 읽어 주기 시작한다
    let demo = root.classList.contains('is-demo');
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        status.setAttribute('aria-live', 'polite');
    }
    function say(text) {
        if (status.textContent !== text) {
            status.textContent = text;
        }
    }
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘어 프레임마다 일이 그만큼 커지지 않게
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function onResize() {
        fitCanvas();
        draw();
    }
    fitCanvas();
    window.addEventListener('resize', onResize);
    // 화면 좌표(CSS px) → 장면 좌표(480x300). 리사이즈 뒤에도 늘 현재 크기로 다시 잰다
    function toScene(ev) {
        const r = cv.getBoundingClientRect();
        return [((ev.clientX - r.left) / r.width) * W, ((ev.clientY - r.top) / r.height) * H];
    }
    // 시드 고정 난수 — 같은 시드면 같은 가상 데이터가 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function seededValues(seed, n, lo, hi) {
        const rnd = makeRng(seed);
        const out = [];
        for (let i = 0; i < n; i += 1) {
            out.push(lo + Math.floor(rnd() * (hi - lo + 1)));
        }
        return out;
    }
    // 숫자 목록 → 부채꼴 — 합계로 나눈 몫을 앞에서부터 쌓아 시작 각과 끝 각을 만든다
    function layout(values) {
        let total = 0;
        for (let i = 0; i < values.length; i += 1) {
            total += values[i];
        }
        const out = [];
        let acc = 0;
        for (let i = 0; i < values.length; i += 1) {
            const a0 = (acc / total) * TAU;
            acc += values[i];
            out.push({ value: values[i], share: values[i] / total, a0: a0, a1: (acc / total) * TAU });
        }
        return out;
    }
    function dirX(a) { return Math.cos(TOP + a); }
    function dirY(a) { return Math.sin(TOP + a); }
    // 포인터가 가리키는 각 — atan2 로 구한 화면 각을 12시 기준 0 ~ 2π 로 옮긴다
    function angleAt(x, y, cx, cy) {
        let a = Math.atan2(y - cy, x - cx) - TOP;
        while (a < 0) {
            a += TAU;
        }
        while (a >= TAU) {
            a -= TAU;
        }
        return a;
    }
    function sliceAt(slices, a) {
        for (let i = 0; i < slices.length; i += 1) {
            if (a >= slices[i].a0 && a < slices[i].a1) {
                return i;
            }
        }
        return -1;
    }
    // 부채꼴 경로 — 안쪽 반지름 r0 이 0 이면 가운데 점까지, 아니면 도넛 조각
    function wedgePath(c, cx, cy, r0, r1, a0, a1) {
        c.beginPath();
        c.arc(cx, cy, r1, TOP + a0, TOP + a1, false);
        if (r0 > 0.5) {
            c.arc(cx, cy, r0, TOP + a1, TOP + a0, true);
        }
        else {
            c.lineTo(cx, cy);
        }
        c.closePath();
    }
    function pctText(share) { return (share * 100).toFixed(1) + '%'; }
    function sayPick(i, share) { say(LABELS[i] + ' · ' + pctText(share)); }
    // 세 자리마다 쉼표 — 지역 설정에 기대지 않는다
    function groupDigits(n) {
        const s = String(Math.round(Math.abs(n)));
        let out = '';
        for (let i = 0; i < s.length; i += 1) {
            if (i > 0 && (s.length - i) % 3 === 0) {
                out += ',';
            }
            out += s[i];
        }
        return (n < 0 ? '-' : '') + out;
    }
    // 왼쪽 범례 — 색 칩 + 이름 + 비율, 고른 줄은 밝게
    const LEG_X = 16;
    const LEG_Y = 100;
    const LEG_ROW = 16;
    function legendRow(row, label, value, c, on, dim) {
        const y = LEG_Y + row * LEG_ROW;
        ctx.fillStyle = rgba(c, dim ? 0.3 : 1);
        ctx.fillRect(LEG_X, y - 9, 9, 9);
        ctx.textBaseline = 'alphabetic';
        ctx.textAlign = 'left';
        ctx.font = (on ? '700' : '500') + ' 11px sans-serif';
        ctx.fillStyle = rgba(PAPER, on ? 1 : (dim ? 0.4 : 0.74));
        ctx.fillText(label, LEG_X + 15, y);
        ctx.textAlign = 'right';
        ctx.fillText(value, LEG_X + 132, y);
    }
    // 범례 아래 수치 한 줄 — 이름표 + 값
    function statRow(y, label, value) {
        ctx.textBaseline = 'alphabetic';
        ctx.textAlign = 'left';
        ctx.fillStyle = rgba(PAPER, 0.6);
        ctx.font = '500 11px sans-serif';
        ctx.fillText(label, LEG_X, y);
        ctx.fillStyle = rgba(PAPER, 0.96);
        ctx.font = '700 14px sans-serif';
        ctx.fillText(value, LEG_X, y + 17);
    }
    function clearStage() {
        ctx.fillStyle = rgba(BG, 1);
        ctx.fillRect(0, 0, W, H);
    }
    // 시연 일정 — 루프 안의 시각(ms) 표를 지날 때마다 한 번씩 부른다
    let schedCycle = -1;
    let schedIdx = 0;
    function runSchedule(t, loop, marks, fire) {
        const cyc = Math.floor(t / loop);
        const p = t - cyc * loop;
        if (cyc !== schedCycle) {
            schedCycle = cyc;
            schedIdx = 0;
        }
        while (schedIdx < marks.length && p >= marks[schedIdx]) {
            fire(schedIdx, cyc);
            schedIdx += 1;
        }
    }
    function springStep(s, k, d, dt) {
        const acc = -k * (s.x - s.to) - d * s.v;
        s.v += acc * dt;
        s.x += s.v * dt;
    }
    // 고른 조각이 가운데 각 방향(코사인·사인)으로 밀려나는 거리(px)
    const EXPLODE_DIST = 16;
    // 감쇠 스프링 — 당기는 힘(1/s²)과 끄는 힘(1/s). 감쇠비 = SPRING_DAMP / (2√SPRING_K) 이 1 보다 작아 한 번 살짝 넘쳤다 선다
    const SPRING_K = 170;
    const SPRING_DAMP = 14;
    const SLICE_N = 6;
    const SEED = 467;
    const CX = 316;
    const CY = 150;
    const R = 112;
    const DEMO_LOOP = 2000;
    const TXT_IDLE = 'Hover a slice';
    const pinBtn = root.querySelector('[data-role="pin"]');
    const resetBtn = root.querySelector('[data-role="reset"]');
    const slices = layout(seededValues(SEED, SLICE_N, 8, 36));
    const springs = [];
    for (let i = 0; i < SLICE_N; i += 1) {
        springs.push({ x: 0, v: 0, to: 0 });
    }
    // 시연은 큰 조각부터 네 개를 차례로 띄운다
    const DEMO_PICKS = slices.map(function (_s, i) { return i; })
        .sort(function (a, b) { return slices[b].share - slices[a].share; }).slice(0, 4);
    let hover = -1;
    let pinned = -1;
    function focusIdx() { return hover >= 0 ? hover : pinned; }
    function retarget() {
        for (let i = 0; i < SLICE_N; i += 1) {
            springs[i].to = i === hover || i === pinned ? EXPLODE_DIST : 0;
        }
    }
    function report() {
        const f = focusIdx();
        if (f >= 0) {
            sayPick(f, slices[f].share);
        }
        else {
            say(TXT_IDLE);
        }
    }
    function step() {
        const dt = FIXED_DT / 1000;
        for (let i = 0; i < SLICE_N; i += 1) {
            springStep(springs[i], SPRING_K, SPRING_DAMP, dt);
        }
    }
    function settle() {
        for (let i = 0; i < SLICE_N; i += 1) {
            springs[i].x = springs[i].to;
            springs[i].v = 0;
        }
    }
    function demoTick(t) {
        runSchedule(t, DEMO_LOOP, [200, 600, 1000, 1400, 1800], function (k) {
            hover = k < DEMO_PICKS.length ? DEMO_PICKS[k] : -1;
            retarget();
            report();
        });
    }
    function midOf(i) { return (slices[i].a0 + slices[i].a1) / 2; }
    function draw() {
        clearStage();
        // 덜 나온 조각부터 칠해 튀어나온 조각이 맨 위에 오게 한다
        const order = slices.map(function (_s, i) { return i; })
            .sort(function (a, b) { return springs[a].x - springs[b].x; });
        // 그림자 — 튀어나온 만큼 짙어지고 아래로 멀어진다
        for (let n = 0; n < order.length; n += 1) {
            const i = order[n];
            const x = springs[i].x;
            if (x <= 0.3) {
                continue;
            }
            const m = midOf(i);
            const k = clamp(x / EXPLODE_DIST, 0, 1.4);
            ctx.fillStyle = 'rgba(8,6,16,' + (0.42 * Math.min(k, 1)).toFixed(3) + ')';
            wedgePath(ctx, CX + dirX(m) * x + x * 0.3, CY + dirY(m) * x + x * 0.6, 0, R, slices[i].a0, slices[i].a1);
            ctx.fill();
        }
        for (let n = 0; n < order.length; n += 1) {
            const i = order[n];
            const x = springs[i].x;
            const m = midOf(i);
            // 밀려난 거리만큼 밝아진다 — 같은 값이 위치·밝기·그림자 셋에 함께 쓰인다
            const lift = clamp(x / EXPLODE_DIST, 0, 1.3);
            ctx.fillStyle = rgba(mix(PAL[i], PAPER, 0.3 * lift), 1);
            wedgePath(ctx, CX + dirX(m) * x, CY + dirY(m) * x, 0, R, slices[i].a0, slices[i].a1);
            ctx.fill();
            ctx.strokeStyle = rgba(BG, 1);
            ctx.lineWidth = 2;
            ctx.stroke();
            if (slices[i].share >= 0.07) {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = (x > 2 ? '800' : '700') + ' 12px sans-serif';
                ctx.fillStyle = rgba(INK, 0.9);
                ctx.fillText(pctText(slices[i].share), CX + dirX(m) * (R * 0.64 + x), CY + dirY(m) * (R * 0.64 + x));
            }
        }
        const f = focusIdx();
        for (let i = 0; i < SLICE_N; i += 1) {
            legendRow(i, LABELS[i], pctText(slices[i].share), PAL[i], i === f, false);
        }
        statRow(220, 'Pop-out distance', (f >= 0 ? springs[f].x : 0).toFixed(1) + ' px');
    }
    function after() {
        retarget();
        if (still) {
            settle();
        }
        report();
        draw();
        if (pinBtn) {
            pinBtn.setAttribute('aria-pressed', pinned >= 0 ? 'true' : 'false');
        }
    }
    // 포인터 자리의 조각 — 각은 atan2, 거리는 그 조각이 지금 밀려난 만큼 넉넉히 본다
    function hitSlice(x, y) {
        const i = sliceAt(slices, angleAt(x, y, CX, CY));
        if (i < 0) {
            return -1;
        }
        return Math.hypot(x - CX, y - CY) <= R + Math.max(0, springs[i].x) + 4 ? i : -1;
    }
    function togglePin(i) {
        pinned = i < 0 || pinned === i ? -1 : i;
    }
    function movePick(d) {
        const f = focusIdx();
        hover = f < 0 ? (d > 0 ? 0 : SLICE_N - 1) : (f + d + SLICE_N) % SLICE_N;
        after();
    }
    cv.addEventListener('pointermove', function (ev) {
        wake();
        const p = toScene(ev);
        const i = hitSlice(p[0], p[1]);
        if (i !== hover) {
            hover = i;
            after();
        }
    });
    cv.addEventListener('pointerleave', function () {
        if (demo) {
            return;
        }
        hover = -1;
        after();
    });
    cv.addEventListener('pointerdown', function (ev) {
        wake();
        const p = toScene(ev);
        togglePin(hitSlice(p[0], p[1]));
        after();
    });
    cv.addEventListener('keydown', function (ev) {
        if (ev.key === 'ArrowRight') {
            ev.preventDefault();
            wake();
            movePick(1);
        }
        else if (ev.key === 'ArrowLeft') {
            ev.preventDefault();
            wake();
            movePick(-1);
        }
        else if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            wake();
            togglePin(focusIdx());
            after();
        }
        else if (ev.key === 'Escape') {
            ev.preventDefault();
            wake();
            hover = -1;
            pinned = -1;
            after();
        }
    });
    if (pinBtn) {
        pinBtn.addEventListener('click', function () { wake(); togglePin(focusIdx() >= 0 ? focusIdx() : DEMO_PICKS[0]); after(); });
    }
    if (resetBtn) {
        resetBtn.addEventListener('click', function () { wake(); hover = -1; pinned = -1; after(); });
    }
    report();
    let rafId = 0;
    let lastTs = -1;
    let acc = 0;
    let clock = 0;
    function frame(ts) {
        if (lastTs < 0) {
            lastTs = ts;
        }
        // 탭이 숨었다 돌아와도 한 번에 100ms 까지만 따라잡는다 — 순간이동 대신 이어서 움직인다
        acc += Math.min(ts - lastTs, 100);
        lastTs = ts;
        let n = 0;
        while (acc >= FIXED_DT && n < 6) {
            clock += FIXED_DT;
            if (demo) {
                demoTick(clock);
            }
            step();
            acc -= FIXED_DT;
            n += 1;
        }
        draw();
        rafId = window.requestAnimationFrame(frame);
    }
    if (still) {
        settle();
        draw();
    }
    else {
        rafId = window.requestAnimationFrame(frame);
    }
    return function () {
        window.cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
    };
})();
</script>
</body>
</html>
