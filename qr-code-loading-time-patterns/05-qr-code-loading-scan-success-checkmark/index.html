<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스캔 완료를 알리는 체크마크 등장 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ssc is-demo" id="sscRoot">
  <div class="ssc__badge" id="sscBadge">스캔 대기</div>
  <button class="ssc__ctrl" id="sscCtrl" type="button">일시정지</button>
  <div class="ssc__canvas-wrap">
    <canvas class="ssc__canvas" id="sscCanvas" width="240" height="200"></canvas>
  </div>
</div>
</main>
<script>
(function () {
  // SUCCESS_CHECK_SPRING_OVERSHOOT — 변형 1: 0.18 → 0.32 로 늘리면 체크 배지가 더 크게 튕긴다.
  var SUCCESS_CHECK_SPRING_OVERSHOOT = 0.18;
  var LOOP_MS = 2000;
  var DRAW_START = 200, DRAW_END = 620;
  var POP_START = 560, POP_END = 980;

  var canvas = document.getElementById('sscCanvas');
  var ctx = canvas.getContext('2d');
  var badge = document.getElementById('sscBadge');
  var ctrl = document.getElementById('sscCtrl');
  var root = document.getElementById('sscRoot');

  // 계산 한 겹: 감쇠 스프링 근사 — overshoot 비율만큼 목표를 넘었다가 되돌아오는
  // 단일 코사인 감쇠식으로 배지 스케일을 만든다 (linear tween 아님).
  function springScale(p, overshoot) {
    if (p <= 0) return 0;
    if (p >= 1) return 1;
    var decay = Math.exp(-4.5 * p);
    return 1 + overshoot * decay * Math.cos(p * Math.PI * 2.2);
  }

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  function draw(elapsed) {
    var cw = canvas.width, ch = canvas.height;
    ctx.clearRect(0, 0, cw, ch);
    var cx = cw / 2, cy = ch / 2;

    var drawP = clamp01((elapsed - DRAW_START) / (DRAW_END - DRAW_START));
    var popP = clamp01((elapsed - POP_START) / (POP_END - POP_START));

    var box = 70;
    ctx.strokeStyle = 'rgba(255,255,255,.14)';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - box / 2, cy - box / 2, box, box);

    if (drawP > 0 && popP < 1) {
      ctx.save();
      ctx.strokeStyle = 'rgba(120,200,255,.9)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx - box / 2 + 6, cy - box / 2 + drawP * (box - 12) + 6);
      ctx.stroke();
      ctx.restore();
    }

    if (popP > 0) {
      var scale = springScale(popP, SUCCESS_CHECK_SPRING_OVERSHOOT);
      var r = 40 * scale;
      ctx.fillStyle = 'rgba(120,220,170,.92)';
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(0, r), 0, Math.PI * 2);
      ctx.fill();

      if (r > 8) {
        ctx.strokeStyle = 'rgb(20,26,38)';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(cx - 14, cy + 1);
        ctx.lineTo(cx - 4, cy + 12);
        ctx.lineTo(cx + 16, cy - 12);
        ctx.stroke();
      }
    }

    if (popP >= 1) {
      badge.textContent = '스캔 완료';
    } else if (drawP > 0) {
      badge.textContent = '확인 중 ' + Math.round(drawP * 100) + '%';
    } else {
      badge.textContent = '스캔 대기';
    }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var playing = true;
  var elapsed = reduce ? POP_END : 0;
  if (reduce) {
    playing = false;
    root.classList.remove('is-demo');
  }

  var lastTs = null;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = ts - lastTs;
    lastTs = ts;
    if (playing) {
      elapsed += dt;
      if (elapsed >= LOOP_MS) elapsed -= LOOP_MS;
    }
    draw(elapsed);
    requestAnimationFrame(tick);
  }
  draw(elapsed);
  requestAnimationFrame(tick);

  ctrl.addEventListener('click', function () {
    playing = !playing;
    ctrl.textContent = playing ? '일시정지' : '재생';
  });
  ctrl.addEventListener('keydown', function (e) {
    if ((e.key === 'r' || e.key === 'R') && !reduce) {
      elapsed = 0;
      playing = true;
      ctrl.textContent = '일시정지';
    }
  });
})();
</script>
</body>
</html>
