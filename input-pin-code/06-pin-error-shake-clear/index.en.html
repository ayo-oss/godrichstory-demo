<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIN input error shake and clear — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pin is-demo" role="group" aria-label="Verification code">
    <div class="pin__row">
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Verification code, digit 1">
        <span class="pin__ghost" aria-hidden="true">1</span>
      </span>
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Verification code, digit 2">
        <span class="pin__ghost" aria-hidden="true">2</span>
      </span>
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Verification code, digit 3">
        <span class="pin__ghost" aria-hidden="true">3</span>
      </span>
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Verification code, digit 4">
        <span class="pin__ghost" aria-hidden="true">4</span>
      </span>
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Verification code, digit 5">
        <span class="pin__ghost" aria-hidden="true">5</span>
      </span>
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Verification code, digit 6">
        <span class="pin__ghost" aria-hidden="true">6</span>
      </span>
      
    </div>
    <button type="button" class="pin__confirm">Confirm</button>
    <p class="pin__status" role="status" hidden>That code doesn't match. Try again.</p>
    <span class="pin__signal pin__signal--error" aria-hidden="true"></span>
  </div>
</main>
<script>
(function () {
  var pin = document.querySelector('.pin');
  var boxes = [].slice.call(pin.querySelectorAll('.pin__input'));
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function wake() { pin.classList.remove('is-demo'); }
  function scrambleToDigit(el, finalDigit, onSettle) {
    if (reduceMotion) { el.value = finalDigit; if (onSettle) onSettle(); return; }
    el.classList.add('is-scrambling');
    var step = 0;
    var steps = 7;
    var delay = 22;
    (function tick() {
      if (step >= steps) {
        el.value = finalDigit;
        el.classList.remove('is-scrambling');
        el.classList.add('is-settle');
        setTimeout(function () { el.classList.remove('is-settle'); }, 200);
        if (onSettle) onSettle();
        return;
      }
      el.value = String(Math.floor(Math.random() * 10));
      step++;
      delay = Math.round(delay * 1.4);
      setTimeout(tick, delay);
    })();
  }
  boxes.forEach(function (b, i) {
    b.addEventListener('focus', wake);
    b.addEventListener('input', function () {
      var digit = b.value.replace(/[^0-9]/g, '').slice(-1);
      if (!digit) { b.value = ''; return; }
      scrambleToDigit(b, digit, function () {
        if (boxes[i + 1]) boxes[i + 1].focus({ preventScroll: true });
      });
    });
    b.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !b.value && boxes[i - 1]) boxes[i - 1].focus({ preventScroll: true });
    });
    b.addEventListener('paste', function (e) {
      var t = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
      if (!t) return;
      e.preventDefault();
      t.slice(0, 6).split('').forEach(function (ch, k) { if (boxes[k]) boxes[k].value = ch; });
      (boxes[Math.min(t.length, 6) - 1] || boxes[0]).focus({ preventScroll: true });
    });
  });
  var confirmBtn = pin.querySelector('.pin__confirm');
  var status = pin.querySelector('.pin__status');
  boxes.forEach(function (b) {
    b.addEventListener('input', function () { status.hidden = true; });
  });
  confirmBtn.addEventListener('click', function () {
    var code = boxes.map(function (b) { return b.value; }).join('');
    if (code.length < 6 || code !== '123456') {
      pin.classList.add('is-error');
      status.hidden = false;
      pin.addEventListener('animationend', function clear() {
        pin.classList.remove('is-error');
        boxes.forEach(function (b) { b.value = ''; });
        boxes[0].focus({ preventScroll: true });
        pin.removeEventListener('animationend', clear);
      });
    }
  });
})();
</script>
</body>
</html>
