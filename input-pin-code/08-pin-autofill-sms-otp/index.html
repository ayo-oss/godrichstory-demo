<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIN input SMS OTP autofill — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pin is-demo" role="group" aria-label="인증번호 입력">
    <div class="pin__row">
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="인증번호 1번째 자리">
        <span class="pin__ghost" aria-hidden="true">1</span>
        <span class="pin__scramble" aria-hidden="true"></span>
      </span>
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="인증번호 2번째 자리">
        <span class="pin__ghost" aria-hidden="true">2</span>
        <span class="pin__scramble" aria-hidden="true"></span>
      </span>
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="인증번호 3번째 자리">
        <span class="pin__ghost" aria-hidden="true">3</span>
        <span class="pin__scramble" aria-hidden="true"></span>
      </span>
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="인증번호 4번째 자리">
        <span class="pin__ghost" aria-hidden="true">4</span>
        <span class="pin__scramble" aria-hidden="true"></span>
      </span>
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="인증번호 5번째 자리">
        <span class="pin__ghost" aria-hidden="true">5</span>
        <span class="pin__scramble" aria-hidden="true"></span>
      </span>
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="인증번호 6번째 자리">
        <span class="pin__ghost" aria-hidden="true">6</span>
        <span class="pin__scramble" aria-hidden="true"></span>
      </span>

    </div>
    <span class="pin__signal pin__signal--chip" aria-hidden="true"></span>
  </div>
</main>
<script>
(function () {
  var pin = document.querySelector('.pin');
  var boxes = [].slice.call(pin.querySelectorAll('.pin__input'));
  var reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  function wake() { pin.classList.remove('is-demo'); }
  function scrambleSettle(input, finalDigit, delayStart) {
    var boxEl = input.closest('.pin__box');
    var scrambleEl = boxEl.querySelector('.pin__scramble');
    if (!finalDigit || reduceMotionQuery.matches) {
      scrambleEl.textContent = '';
      boxEl.classList.remove('is-scrambling');
      return;
    }
    setTimeout(function start() {
      boxEl.classList.add('is-scrambling');
      var stepsLeft = 9;
      var delay = 24;
      (function spin() {
        if (stepsLeft > 0) {
          scrambleEl.textContent = String(Math.floor(Math.random() * 10));
          stepsLeft--;
          delay = Math.round(delay * 1.34) + 2;
          setTimeout(spin, delay);
        } else {
          scrambleEl.textContent = finalDigit;
          setTimeout(function () { boxEl.classList.remove('is-scrambling'); }, 70);
        }
      })();
    }, delayStart || 0);
  }
  boxes.forEach(function (b, i) {
    b.addEventListener('focus', wake);
    b.addEventListener('input', function () {
      b.value = b.value.replace(/[^0-9]/g, '').slice(-1);
      if (b.value) scrambleSettle(b, b.value, 0);
      if (b.value && boxes[i + 1]) boxes[i + 1].focus({ preventScroll: true });
    });
    b.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !b.value && boxes[i - 1]) boxes[i - 1].focus({ preventScroll: true });
    });
    b.addEventListener('paste', function (e) {
      var t = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
      if (!t) return;
      e.preventDefault();
      t.slice(0, 6).split('').forEach(function (ch, k) {
        if (boxes[k]) { boxes[k].value = ch; scrambleSettle(boxes[k], ch, k * 90); }
      });
      (boxes[Math.min(t.length, 6) - 1] || boxes[0]).focus({ preventScroll: true });
    });
  });
})();
</script>
</body>
</html>
