<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIN input backspace to previous box — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pin is-demo" role="group" aria-label="인증번호 입력">
    <div class="pin__row">
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="인증번호 1번째 자리">
        <span class="pin__ghost" aria-hidden="true">1</span>
        <span class="pin__scramble" aria-hidden="true"></span>
      </span>
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="인증번호 2번째 자리">
        <span class="pin__ghost" aria-hidden="true">2</span>
        <span class="pin__scramble" aria-hidden="true"></span>
      </span>
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="인증번호 3번째 자리">
        <span class="pin__ghost" aria-hidden="true">3</span>
        <span class="pin__scramble" aria-hidden="true"></span>
      </span>
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="인증번호 4번째 자리">
        <span class="pin__ghost" aria-hidden="true">4</span>
        <span class="pin__scramble" aria-hidden="true"></span>
      </span>
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="인증번호 5번째 자리">
        <span class="pin__ghost" aria-hidden="true">5</span>
        <span class="pin__scramble" aria-hidden="true"></span>
      </span>
      <span class="pin__box">
        <input class="pin__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="인증번호 6번째 자리">
        <span class="pin__ghost" aria-hidden="true">6</span>
        <span class="pin__scramble" aria-hidden="true"></span>
      </span>
      <span class="pin__caret" aria-hidden="true"></span>
    </div>
    <span class="pin__signal pin__signal--chevron" aria-hidden="true"></span>
  </div>
</main>
<script>
(function () {
  var pin = document.querySelector('.pin');
  var boxes = [].slice.call(pin.querySelectorAll('.pin__input'));
  var reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  function wake() { pin.classList.remove('is-demo'); }

  // 슬롯머신 스크램블: 최종 숫자를 바로 보여주지 않고 무작위 숫자가 지나가다 감속하며 정착한다
  function cancelScramble(box) {
    if (box._scrambleTimer) {
      clearTimeout(box._scrambleTimer);
      box._scrambleTimer = null;
    }
  }
  function scrambleDigit(box, finalDigit) {
    var display = box.querySelector('.pin__scramble');
    if (!display) return;
    cancelScramble(box);
    if (reduceMotionQuery.matches) {
      box.classList.remove('is-scrambling');
      display.textContent = '';
      return;
    }
    box.classList.add('is-scrambling');
    var startedAt = Date.now();
    var totalMs = 280;   // 스크램블 총 지속시간
    var delay = 24;      // 초기 간격(빠름)
    var growth = 1.35;   // 감속 배율
    var maxDelay = 200;  // 최대 간격(느려짐)
    function tick() {
      var elapsed = Date.now() - startedAt;
      if (elapsed >= totalMs) {
        display.textContent = finalDigit;
        box._scrambleTimer = setTimeout(function () {
          box.classList.remove('is-scrambling');
          display.textContent = '';
          box._scrambleTimer = null;
        }, 70);
        return;
      }
      display.textContent = String(Math.floor(Math.random() * 10));
      delay = Math.min(delay * growth, maxDelay);
      box._scrambleTimer = setTimeout(tick, delay);
    }
    tick();
  }

  boxes.forEach(function (b, i) {
    var box = b.closest('.pin__box');
    b.addEventListener('focus', wake);
    b.addEventListener('input', function () {
      b.value = b.value.replace(/[^0-9]/g, '').slice(-1);
      if (b.value) {
        scrambleDigit(box, b.value);
        if (boxes[i + 1]) boxes[i + 1].focus({ preventScroll: true });
      } else {
        cancelScramble(box);
        box.classList.remove('is-scrambling');
        var display = box.querySelector('.pin__scramble');
        if (display) display.textContent = '';
      }
    });
    b.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !b.value && boxes[i - 1]) boxes[i - 1].focus({ preventScroll: true });
    });
    b.addEventListener('paste', function (e) {
      var t = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
      if (!t) return;
      e.preventDefault();
      t.slice(0, 6).split('').forEach(function (ch, k) {
        if (boxes[k]) {
          boxes[k].value = ch;
          scrambleDigit(boxes[k].closest('.pin__box'), ch);
        }
      });
      (boxes[Math.min(t.length, 6) - 1] || boxes[0]).focus({ preventScroll: true });
    });
  });
})();
</script>
</body>
</html>
