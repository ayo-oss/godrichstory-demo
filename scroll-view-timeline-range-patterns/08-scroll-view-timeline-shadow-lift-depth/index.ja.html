<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>区間値の分だけ浮き上がる影のカード — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sld is-demo" id="sldRoot">
  <div class="sld__badge" id="sldBadge">通過区間 0%~100%</div>
  <button class="sld__ctrl" id="sldCtrl" type="button">一時停止</button>
  <div class="sld__view" id="sldView">
    <div class="sld__track" id="sldTrack">
      <div class="sld__spacer sld__spacer--top"></div>
      <div class="sld__card" id="sldCard">
        <span class="sld__label">カード</span>
      </div>
      <div class="sld__spacer sld__spacer--bottom"></div>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  // VIEWTL_SHADOW_SPREAD_PX — 변형 3: 24 → 48 로 늘리면 그림자가 멀리 번져 카드가 훨씬 높이 떠 보인다.
  var VIEWTL_SHADOW_SPREAD_PX = 24;
  document.documentElement.style.setProperty('--shadow-spread', VIEWTL_SHADOW_SPREAD_PX + 'px');

  var supportsVt = CSS.supports('animation-timeline: view()');
  var root = document.getElementById('sldRoot');
  var view = document.getElementById('sldView');
  var card = document.getElementById('sldCard');
  var badge = document.getElementById('sldBadge');
  var ctrl = document.getElementById('sldCtrl');
  root.classList.add(supportsVt ? 'supports-vt' : 'no-vt');

  // 계산 한 겹: 요소가 뷰포트를 통과하는 구간(cover) 진행 값을 요소 높이·뷰포트
  // 높이·스크롤 위치로 직접 계산한다.
  function coverProgress() {
    var elTop = card.offsetTop;
    var elH = card.offsetHeight;
    var viewH = view.clientHeight;
    var raw = (view.scrollTop - elTop + viewH) / (elH + viewH);
    return Math.min(1, Math.max(0, raw));
  }

  function render(cov) {
    var spread = VIEWTL_SHADOW_SPREAD_PX * cov;
    if (!supportsVt) {
      var y = (6 + spread * 0.3).toFixed(1);
      var blur = (10 + spread * 0.6).toFixed(1);
      card.style.boxShadow = '0 ' + y + 'px ' + blur + 'px ' + spread.toFixed(1) + 'px rgba(23, 20, 26, .35)';
      card.style.transform = 'translateY(' + (-14 * cov).toFixed(1) + 'px)';
    }
    badge.textContent = '通過進行 ' + Math.round(cov * 100) + '% · にじみ ' + spread.toFixed(1) + 'px';
  }

  view.addEventListener('scroll', function () {
    render(coverProgress());
  }, { passive: true });
  render(coverProgress());

  var playing = true;
  var frame = 0;
  var PERIOD = 80;
  function tick() {
    if (playing) {
      frame += 1;
      var max = view.scrollHeight - view.clientHeight;
      var t = frame % (PERIOD * 2);
      var f = t < PERIOD ? (t / PERIOD) : ((PERIOD * 2 - t) / PERIOD);
      view.scrollTop = f * max;
      render(coverProgress());
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function stopAuto() {
    if (root.classList.contains('is-demo')) { root.classList.remove('is-demo'); }
    playing = false;
    ctrl.textContent = '再生';
  }
  view.addEventListener('wheel', stopAuto, { passive: true });
  view.addEventListener('touchstart', stopAuto, { passive: true });

  ctrl.addEventListener('click', function () {
    playing = !playing;
    ctrl.textContent = playing ? '一時停止' : '再生';
    if (playing) { root.classList.add('is-demo'); }
    render(coverProgress());
  });
  ctrl.addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') {
      frame = 0;
      view.scrollTop = 0;
      playing = true;
      root.classList.add('is-demo');
      ctrl.textContent = '一時停止';
      render(coverProgress());
    }
  });

  window.addEventListener('resize', function () {
    render(coverProgress());
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    playing = false;
    root.classList.remove('is-demo');
    render(1);
    badge.textContent = '通過進行 100% · にじみ ' + VIEWTL_SHADOW_SPREAD_PX.toFixed(1) + 'px';
  }
})();
</script>
</body>
</html>
