<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>区間値が角度値に変わる3Dカード — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="r3f is-demo" id="r3fRoot">
  <div class="r3f__badge" id="r3fBadge">通過区間 0%~100%</div>
  <button class="r3f__ctrl" id="r3fCtrl" type="button">一時停止</button>
  <div class="r3f__view" id="r3fView">
    <div class="r3f__track" id="r3fTrack">
      <div class="r3f__spacer r3f__spacer--top"></div>
      <div class="r3f__flip">
        <div class="r3f__inner" id="r3fInner">
          <div class="r3f__face r3f__face--front">サービス</div>
          <div class="r3f__face r3f__face--back">詳細</div>
        </div>
      </div>
      <div class="r3f__spacer r3f__spacer--bottom"></div>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var supportsVt = CSS.supports('animation-timeline: view()');
  var root = document.getElementById('r3fRoot');
  var view = document.getElementById('r3fView');
  var inner = document.getElementById('r3fInner');
  var badge = document.getElementById('r3fBadge');
  var ctrl = document.getElementById('r3fCtrl');
  root.classList.add(supportsVt ? 'supports-vt' : 'no-vt');

  // 계산 한 겹: 요소가 뷰포트를 통과하는 구간(cover) 진행 값을 요소 높이·뷰포트
  // 높이·스크롤 위치로 계산해, 같은 값을 각도 값으로 바꾼다.
  function coverProgress() {
    var elTop = inner.parentElement.offsetTop;
    var elH = inner.parentElement.offsetHeight;
    var viewH = view.clientHeight;
    var raw = (view.scrollTop - elTop + viewH) / (elH + viewH);
    return Math.min(1, Math.max(0, raw));
  }

  function render(cov) {
    var angle = cov * 180;
    if (!supportsVt) {
      inner.style.transform = 'rotateY(' + angle.toFixed(1) + 'deg)';
    }
    badge.textContent = '通過進行 ' + Math.round(cov * 100) + '% · 角度 ' + Math.round(angle) + 'deg';
  }

  view.addEventListener('scroll', function () {
    render(coverProgress());
  }, { passive: true });
  render(coverProgress());

  // 자동 시연: rAF 로 프레임을 누적해 컨테이너를 왕복 스크롤한다.
  var playing = true;
  var frame = 0;
  var PERIOD = 80;
  function tick() {
    if (playing) {
      frame += 1;
      var max = view.scrollHeight - view.clientHeight;
      var t = frame % (PERIOD * 2);
      var f = t < PERIOD ? (t / PERIOD) : ((PERIOD * 2 - t) / PERIOD);
      view.scrollTop = f * max;
      render(coverProgress());
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function stopAuto() {
    if (root.classList.contains('is-demo')) { root.classList.remove('is-demo'); }
    playing = false;
    ctrl.textContent = '再生';
  }
  view.addEventListener('wheel', stopAuto, { passive: true });
  view.addEventListener('touchstart', stopAuto, { passive: true });

  ctrl.addEventListener('click', function () {
    playing = !playing;
    ctrl.textContent = playing ? '一時停止' : '再生';
    if (playing) { root.classList.add('is-demo'); }
    render(coverProgress());
  });
  ctrl.addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') {
      frame = 0;
      view.scrollTop = 0;
      playing = true;
      root.classList.add('is-demo');
      ctrl.textContent = '一時停止';
      render(coverProgress());
    }
  });

  window.addEventListener('resize', function () {
    render(coverProgress());
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    playing = false;
    root.classList.remove('is-demo');
    inner.style.transform = 'rotateY(0deg)';
    badge.textContent = '通過進行 0% · 角度 0deg';
  }
})();
</script>
</body>
</html>
