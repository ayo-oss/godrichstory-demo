<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>区間値に合わせて大きく鮮明になるカード — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fsc is-demo" id="fscRoot">
  <div class="fsc__badge" id="fscBadge">進入区間 0%~0%</div>
  <button class="fsc__ctrl" id="fscCtrl" type="button">一時停止</button>
  <div class="fsc__view" id="fscView">
    <div class="fsc__track" id="fscTrack">
      <div class="fsc__spacer fsc__spacer--top"></div>
      <div class="fsc__card" id="fscCard">
        <span class="fsc__label">機能カード</span>
      </div>
      <div class="fsc__spacer fsc__spacer--bottom"></div>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  // VIEWTL_FADE_SCALE_START — 변형 1: 0.8 → 0.6 로 낮추면 카드가 더 작게 쭈그러든 채 시작해 등장이 강조된다.
  var VIEWTL_FADE_SCALE_START = 0.8;
  document.documentElement.style.setProperty('--fade-scale-start', String(VIEWTL_FADE_SCALE_START));

  var supportsVt = CSS.supports('animation-timeline: view()');
  var root = document.getElementById('fscRoot');
  var view = document.getElementById('fscView');
  var card = document.getElementById('fscCard');
  var badge = document.getElementById('fscBadge');
  var ctrl = document.getElementById('fscCtrl');
  root.classList.add(supportsVt ? 'supports-vt' : 'no-vt');

  // 계산 한 겹: 요소 높이·뷰포트 높이에서 진입 구간(시작~끝 %) 값을 구해 배지에 표시한다.
  function entryRangePct() {
    var elH = card.offsetHeight;
    var viewH = view.clientHeight;
    return Math.round(Math.min(100, (elH / viewH) * 100));
  }
  var rangeEnd = entryRangePct();
  var rangeText = '進入区間 0%~' + rangeEnd + '%';

  function render(ratio) {
    if (!supportsVt) {
      var start = VIEWTL_FADE_SCALE_START;
      var scale = start + (1 - start) * ratio;
      card.style.opacity = String(ratio);
      card.style.transform = 'scale(' + scale.toFixed(3) + ')';
    }
    badge.textContent = rangeText + ' · 進行 ' + Math.round(ratio * 100) + '%';
  }

  var lastRatio = 0;
  if (!supportsVt) {
    var STEPS = [];
    for (var s = 0; s <= 50; s += 1) { STEPS.push(s / 50); }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        lastRatio = entry.intersectionRatio;
        render(lastRatio);
      });
    }, { root: view, threshold: STEPS });
    io.observe(card);
  } else {
    badge.textContent = rangeText;
  }

  view.addEventListener('scroll', function () {
    if (supportsVt) {
      var max = view.scrollHeight - view.clientHeight;
      var p = max > 0 ? Math.min(1, Math.max(0, view.scrollTop / max)) : 0;
      badge.textContent = rangeText + ' · スクロール ' + Math.round(p * 100) + '%';
    }
  }, { passive: true });

  // 자동 시연: rAF 로 프레임을 누적해 컨테이너를 왕복 스크롤한다 (실시간 setInterval 이 아니라 프레임 누적).
  var playing = true;
  var frame = 0;
  var PERIOD = 66;
  function tick() {
    if (playing) {
      frame += 1;
      var max = view.scrollHeight - view.clientHeight;
      var t = frame % (PERIOD * 2);
      var f = t < PERIOD ? (t / PERIOD) : ((PERIOD * 2 - t) / PERIOD);
      view.scrollTop = f * max;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function stopAuto() {
    if (root.classList.contains('is-demo')) { root.classList.remove('is-demo'); }
    playing = false;
    ctrl.textContent = '再生';
  }
  view.addEventListener('wheel', stopAuto, { passive: true });
  view.addEventListener('touchstart', stopAuto, { passive: true });

  ctrl.addEventListener('click', function () {
    playing = !playing;
    ctrl.textContent = playing ? '一時停止' : '再生';
    if (playing) { root.classList.add('is-demo'); }
  });
  ctrl.addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') {
      frame = 0;
      view.scrollTop = 0;
      lastRatio = 0;
      render(0);
      playing = true;
      root.classList.add('is-demo');
      ctrl.textContent = '一時停止';
    }
  });

  window.addEventListener('resize', function () {
    rangeEnd = entryRangePct();
    rangeText = '進入区間 0%~' + rangeEnd + '%';
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    playing = false;
    root.classList.remove('is-demo');
    lastRatio = 1;
    render(1);
    card.style.opacity = '1';
    card.style.transform = 'scale(1)';
    badge.textContent = rangeText + ' · 最終状態';
  }
})();
</script>
</body>
</html>
