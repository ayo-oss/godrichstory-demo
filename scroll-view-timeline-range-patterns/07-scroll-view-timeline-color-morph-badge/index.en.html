<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge Whose Range Value Becomes a Color-interpolation Point — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cmb is-demo" id="cmbRoot">
  <div class="cmb__badge" id="cmbBadge">entry range 0%~0%</div>
  <button class="cmb__ctrl" id="cmbCtrl" type="button">Pause</button>
  <div class="cmb__view" id="cmbView">
    <div class="cmb__track" id="cmbTrack">
      <div class="cmb__spacer cmb__spacer--top"></div>
      <div class="cmb__pill" id="cmbPill">
        <span class="cmb__label">New</span>
      </div>
      <div class="cmb__spacer cmb__spacer--bottom"></div>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var supportsVt = CSS.supports('animation-timeline: view()');
  var root = document.getElementById('cmbRoot');
  var view = document.getElementById('cmbView');
  var pill = document.getElementById('cmbPill');
  var badge = document.getElementById('cmbBadge');
  var ctrl = document.getElementById('cmbCtrl');
  root.classList.add(supportsVt ? 'supports-vt' : 'no-vt');

  // 색상 보간 지점의 양 끝 값(RGB) — CSS 토큰의 실제 값을 그대로 옮겨 왔다.
  var COLOR_FROM = [10, 79, 232];
  var COLOR_TO = [201, 48, 0];

  // 계산 한 겹: 요소 높이·뷰포트 높이에서 진입 구간(시작~끝 %) 값을 구해 배지에 표시한다.
  function entryRangePct() {
    var elH = pill.offsetHeight;
    var viewH = view.clientHeight;
    return Math.round(Math.min(100, (elH / viewH) * 100));
  }
  var rangeEnd = entryRangePct();
  var rangeText = 'entry range 0%~' + rangeEnd + '%';

  function lerp(a, b, t) { return Math.round(a + (b - a) * t); }

  function render(ratio) {
    if (!supportsVt) {
      var r = lerp(COLOR_FROM[0], COLOR_TO[0], ratio);
      var g = lerp(COLOR_FROM[1], COLOR_TO[1], ratio);
      var b = lerp(COLOR_FROM[2], COLOR_TO[2], ratio);
      pill.style.backgroundColor = 'rgb(' + r + ', ' + g + ', ' + b + ')';
    }
    badge.textContent = rangeText + ' · progress ' + Math.round(ratio * 100) + '%';
  }

  var lastRatio = 0;
  if (!supportsVt) {
    var STEPS = [];
    for (var s = 0; s <= 50; s += 1) { STEPS.push(s / 50); }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        lastRatio = entry.intersectionRatio;
        render(lastRatio);
      });
    }, { root: view, threshold: STEPS });
    io.observe(pill);
  } else {
    badge.textContent = rangeText;
  }

  view.addEventListener('scroll', function () {
    if (supportsVt) {
      var max = view.scrollHeight - view.clientHeight;
      var p = max > 0 ? Math.min(1, Math.max(0, view.scrollTop / max)) : 0;
      badge.textContent = rangeText + ' · scroll ' + Math.round(p * 100) + '%';
    }
  }, { passive: true });

  var playing = true;
  var frame = 0;
  var PERIOD = 66;
  function tick() {
    if (playing) {
      frame += 1;
      var max = view.scrollHeight - view.clientHeight;
      var t = frame % (PERIOD * 2);
      var f = t < PERIOD ? (t / PERIOD) : ((PERIOD * 2 - t) / PERIOD);
      view.scrollTop = f * max;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function stopAuto() {
    if (root.classList.contains('is-demo')) { root.classList.remove('is-demo'); }
    playing = false;
    ctrl.textContent = 'Play';
  }
  view.addEventListener('wheel', stopAuto, { passive: true });
  view.addEventListener('touchstart', stopAuto, { passive: true });

  ctrl.addEventListener('click', function () {
    playing = !playing;
    ctrl.textContent = playing ? 'Pause' : 'Play';
    if (playing) { root.classList.add('is-demo'); }
  });
  ctrl.addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') {
      frame = 0;
      view.scrollTop = 0;
      lastRatio = 0;
      render(0);
      playing = true;
      root.classList.add('is-demo');
      ctrl.textContent = 'Pause';
    }
  });

  window.addEventListener('resize', function () {
    rangeEnd = entryRangePct();
    rangeText = 'entry range 0%~' + rangeEnd + '%';
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    playing = false;
    root.classList.remove('is-demo');
    lastRatio = 1;
    render(1);
    pill.style.backgroundColor = 'rgb(201, 48, 0)';
    badge.textContent = rangeText + ' · final state';
  }
})();
</script>
</body>
</html>
