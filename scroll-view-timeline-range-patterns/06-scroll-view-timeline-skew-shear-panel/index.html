<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기울기 값이 끝에서 풀리는 패널 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ssp is-demo" id="sspRoot">
  <div class="ssp__badge" id="sspBadge">진입 구간 0%~0%</div>
  <button class="ssp__ctrl" id="sspCtrl" type="button">일시정지</button>
  <div class="ssp__view" id="sspView">
    <div class="ssp__track" id="sspTrack">
      <div class="ssp__spacer ssp__spacer--top"></div>
      <div class="ssp__panel" id="sspPanel">
        <span class="ssp__label">요금제</span>
      </div>
      <div class="ssp__spacer ssp__spacer--bottom"></div>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var supportsVt = CSS.supports('animation-timeline: view()');
  var root = document.getElementById('sspRoot');
  var view = document.getElementById('sspView');
  var panel = document.getElementById('sspPanel');
  var badge = document.getElementById('sspBadge');
  var ctrl = document.getElementById('sspCtrl');
  root.classList.add(supportsVt ? 'supports-vt' : 'no-vt');

  // 계산 한 겹: 요소 높이·뷰포트 높이에서 진입 구간(시작~끝 %) 값을 구해 배지에 표시한다.
  function entryRangePct() {
    var elH = panel.offsetHeight;
    var viewH = view.clientHeight;
    return Math.round(Math.min(100, (elH / viewH) * 100));
  }
  var rangeEnd = entryRangePct();
  var rangeText = '진입 구간 0%~' + rangeEnd + '%';
  var SKEW_START = -18;

  function render(ratio) {
    if (!supportsVt) {
      var skew = SKEW_START * (1 - ratio);
      panel.style.transform = 'skewX(' + skew.toFixed(1) + 'deg)';
    }
    badge.textContent = rangeText + ' · 진행 ' + Math.round(ratio * 100) + '%';
  }

  var lastRatio = 0;
  if (!supportsVt) {
    var STEPS = [];
    for (var s = 0; s <= 50; s += 1) { STEPS.push(s / 50); }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        lastRatio = entry.intersectionRatio;
        render(lastRatio);
      });
    }, { root: view, threshold: STEPS });
    io.observe(panel);
  } else {
    badge.textContent = rangeText;
  }

  view.addEventListener('scroll', function () {
    if (supportsVt) {
      var max = view.scrollHeight - view.clientHeight;
      var p = max > 0 ? Math.min(1, Math.max(0, view.scrollTop / max)) : 0;
      badge.textContent = rangeText + ' · 스크롤 ' + Math.round(p * 100) + '%';
    }
  }, { passive: true });

  var playing = true;
  var frame = 0;
  var PERIOD = 66;
  function tick() {
    if (playing) {
      frame += 1;
      var max = view.scrollHeight - view.clientHeight;
      var t = frame % (PERIOD * 2);
      var f = t < PERIOD ? (t / PERIOD) : ((PERIOD * 2 - t) / PERIOD);
      view.scrollTop = f * max;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function stopAuto() {
    if (root.classList.contains('is-demo')) { root.classList.remove('is-demo'); }
    playing = false;
    ctrl.textContent = '재생';
  }
  view.addEventListener('wheel', stopAuto, { passive: true });
  view.addEventListener('touchstart', stopAuto, { passive: true });

  ctrl.addEventListener('click', function () {
    playing = !playing;
    ctrl.textContent = playing ? '일시정지' : '재생';
    if (playing) { root.classList.add('is-demo'); }
  });
  ctrl.addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') {
      frame = 0;
      view.scrollTop = 0;
      lastRatio = 0;
      render(0);
      playing = true;
      root.classList.add('is-demo');
      ctrl.textContent = '일시정지';
    }
  });

  window.addEventListener('resize', function () {
    rangeEnd = entryRangePct();
    rangeText = '진입 구간 0%~' + rangeEnd + '%';
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    playing = false;
    root.classList.remove('is-demo');
    lastRatio = 1;
    render(1);
    panel.style.transform = 'skewX(0deg)';
    badge.textContent = rangeText + ' · 최종 상태';
  }
})();
</script>
</body>
</html>
