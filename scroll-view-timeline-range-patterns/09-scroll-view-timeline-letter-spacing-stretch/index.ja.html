<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>区間値が文字間隔値として広がる見出し — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lss is-demo" id="lssRoot">
  <div class="lss__badge" id="lssBadge">進入区間 0%~0%</div>
  <button class="lss__ctrl" id="lssCtrl" type="button">一時停止</button>
  <div class="lss__view" id="lssView">
    <div class="lss__track" id="lssTrack">
      <div class="lss__spacer lss__spacer--top"></div>
      <h2 class="lss__title" id="lssTitle">セクションタイトル</h2>
      <div class="lss__spacer lss__spacer--bottom"></div>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var supportsVt = CSS.supports('animation-timeline: view()');
  var root = document.getElementById('lssRoot');
  var view = document.getElementById('lssView');
  var title = document.getElementById('lssTitle');
  var badge = document.getElementById('lssBadge');
  var ctrl = document.getElementById('lssCtrl');
  root.classList.add(supportsVt ? 'supports-vt' : 'no-vt');

  var SPACING_START = -0.04;
  var SPACING_END = 0.4;

  // 계산 한 겹: 요소 높이·뷰포트 높이에서 진입 구간(시작~끝 %) 값을 구해 배지에 표시한다.
  function entryRangePct() {
    var elH = title.offsetHeight;
    var viewH = view.clientHeight;
    return Math.round(Math.min(100, (elH / viewH) * 100));
  }
  var rangeEnd = entryRangePct();
  var rangeText = '進入区間 0%~' + rangeEnd + '%';

  function render(ratio) {
    if (!supportsVt) {
      var spacing = SPACING_START + (SPACING_END - SPACING_START) * ratio;
      title.style.letterSpacing = spacing.toFixed(3) + 'em';
      title.style.opacity = String(0.35 + 0.65 * ratio);
    }
    badge.textContent = rangeText + ' · 進行 ' + Math.round(ratio * 100) + '%';
  }

  var lastRatio = 0;
  if (!supportsVt) {
    var STEPS = [];
    for (var s = 0; s <= 50; s += 1) { STEPS.push(s / 50); }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        lastRatio = entry.intersectionRatio;
        render(lastRatio);
      });
    }, { root: view, threshold: STEPS });
    io.observe(title);
  } else {
    badge.textContent = rangeText;
  }

  view.addEventListener('scroll', function () {
    if (supportsVt) {
      var max = view.scrollHeight - view.clientHeight;
      var p = max > 0 ? Math.min(1, Math.max(0, view.scrollTop / max)) : 0;
      badge.textContent = rangeText + ' · スクロール ' + Math.round(p * 100) + '%';
    }
  }, { passive: true });

  var playing = true;
  var frame = 0;
  var PERIOD = 66;
  function tick() {
    if (playing) {
      frame += 1;
      var max = view.scrollHeight - view.clientHeight;
      var t = frame % (PERIOD * 2);
      var f = t < PERIOD ? (t / PERIOD) : ((PERIOD * 2 - t) / PERIOD);
      view.scrollTop = f * max;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function stopAuto() {
    if (root.classList.contains('is-demo')) { root.classList.remove('is-demo'); }
    playing = false;
    ctrl.textContent = '再生';
  }
  view.addEventListener('wheel', stopAuto, { passive: true });
  view.addEventListener('touchstart', stopAuto, { passive: true });

  ctrl.addEventListener('click', function () {
    playing = !playing;
    ctrl.textContent = playing ? '一時停止' : '再生';
    if (playing) { root.classList.add('is-demo'); }
  });
  ctrl.addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') {
      frame = 0;
      view.scrollTop = 0;
      lastRatio = 0;
      render(0);
      playing = true;
      root.classList.add('is-demo');
      ctrl.textContent = '一時停止';
    }
  });

  window.addEventListener('resize', function () {
    rangeEnd = entryRangePct();
    rangeText = '進入区間 0%~' + rangeEnd + '%';
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    playing = false;
    root.classList.remove('is-demo');
    lastRatio = 1;
    render(1);
    title.style.letterSpacing = SPACING_END.toFixed(3) + 'em';
    title.style.opacity = '1';
    badge.textContent = rangeText + ' · 最終状態';
  }
})();
</script>
</body>
</html>
