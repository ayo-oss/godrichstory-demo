<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>区間値に沿ってピントが外れたり合ったりするカード — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bfs is-demo" id="bfsRoot">
  <div class="bfs__badge" id="bfsBadge">通過区間 0%~100%</div>
  <button class="bfs__ctrl" id="bfsCtrl" type="button">一時停止</button>
  <div class="bfs__view" id="bfsView">
    <div class="bfs__track" id="bfsTrack">
      <div class="bfs__spacer bfs__spacer--top"></div>
      <div class="bfs__card" id="bfsCard">
        <span class="bfs__label">製品</span>
      </div>
      <div class="bfs__spacer bfs__spacer--bottom"></div>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  // VIEWTL_BLUR_MAX_PX — 변형 2: 12 → 24 로 늘리면 들어오고 나갈 때 초점이 풀리는 정도가 더 뚜렷해진다.
  var VIEWTL_BLUR_MAX_PX = 12;
  document.documentElement.style.setProperty('--blur-max', VIEWTL_BLUR_MAX_PX + 'px');

  var supportsVt = CSS.supports('animation-timeline: view()');
  var root = document.getElementById('bfsRoot');
  var view = document.getElementById('bfsView');
  var card = document.getElementById('bfsCard');
  var badge = document.getElementById('bfsBadge');
  var ctrl = document.getElementById('bfsCtrl');
  root.classList.add(supportsVt ? 'supports-vt' : 'no-vt');

  // 계산 한 겹: 요소가 뷰포트를 완전히 통과하는 구간(cover) 진행 값을 요소 높이·뷰포트
  // 높이·스크롤 위치로 직접 계산한다 (교차 비율이 아니라 통과 위치 값).
  function coverProgress() {
    var elTop = card.offsetTop;
    var elH = card.offsetHeight;
    var viewH = view.clientHeight;
    var raw = (view.scrollTop - elTop + viewH) / (elH + viewH);
    return Math.min(1, Math.max(0, raw));
  }

  function render(cov) {
    var hump = 1 - Math.abs(cov * 2 - 1);
    var blurPx = VIEWTL_BLUR_MAX_PX * (1 - hump);
    if (!supportsVt) {
      card.style.filter = 'blur(' + blurPx.toFixed(1) + 'px)';
      card.style.opacity = String(0.55 + 0.45 * hump);
    }
    badge.textContent = '通過進行 ' + Math.round(cov * 100) + '% · ぼかし ' + blurPx.toFixed(1) + 'px';
  }

  view.addEventListener('scroll', function () {
    render(coverProgress());
  }, { passive: true });
  render(coverProgress());

  // 자동 시연: rAF 로 프레임을 누적해 컨테이너를 왕복 스크롤한다.
  var playing = true;
  var frame = 0;
  var PERIOD = 80;
  function tick() {
    if (playing) {
      frame += 1;
      var max = view.scrollHeight - view.clientHeight;
      var t = frame % (PERIOD * 2);
      var f = t < PERIOD ? (t / PERIOD) : ((PERIOD * 2 - t) / PERIOD);
      view.scrollTop = f * max;
      render(coverProgress());
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function stopAuto() {
    if (root.classList.contains('is-demo')) { root.classList.remove('is-demo'); }
    playing = false;
    ctrl.textContent = '再生';
  }
  view.addEventListener('wheel', stopAuto, { passive: true });
  view.addEventListener('touchstart', stopAuto, { passive: true });

  ctrl.addEventListener('click', function () {
    playing = !playing;
    ctrl.textContent = playing ? '一時停止' : '再生';
    if (playing) { root.classList.add('is-demo'); }
    render(coverProgress());
  });
  ctrl.addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') {
      frame = 0;
      view.scrollTop = 0;
      playing = true;
      root.classList.add('is-demo');
      ctrl.textContent = '一時停止';
      render(coverProgress());
    }
  });

  window.addEventListener('resize', function () {
    render(coverProgress());
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    playing = false;
    root.classList.remove('is-demo');
    card.style.filter = 'blur(0px)';
    card.style.opacity = '1';
    badge.textContent = '通過進行 50% · ぼかし 0.0px';
  }
})();
</script>
</body>
</html>
