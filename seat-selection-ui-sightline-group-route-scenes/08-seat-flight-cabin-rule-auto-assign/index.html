<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">

<title>창가·통로 바람과 비상구 조건을 맞추는 비행기 좌석 자동 배정 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cf is-demo" id="cf">
  <canvas class="cf__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="비행기 객실 좌석표에 일행을 차례로 앉혀 보다가 막히면 한 단계 되돌아가 다시 놓고, 비상구 줄에는 아이를 앉히지 않은 채 모두 확정한다."></canvas>
  <p class="cf__status" data-role="status" aria-live="off">자리를 놓아 보는 중</p>
  <button class="cf__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("cf");
    if (!root) return;
    // 판 좌표 — 캔버스 안은 늘 480×300. 화면에 보이는 크기와 상관없이 계산은 이 좌표로 한다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 따라가기 비율 — 1 − e^(−rate·dt). 프레임 시간이 달라도 1초에 같은 만큼 다가간다
    function follow(rate, dt) { return 1 - Math.exp(-rate * dt); }
    // 1/60초마다 ease 만큼 다가가는 비율을 dt 초로 환산 — 1 − (1 − ease)^(dt × 60)
    function easeStep(ease, dt) { return 1 - Math.pow(1 - ease, dt * 60); }
    // 시드 고정 난수 — 같은 시드면 같은 시연이 다시 나온다 (32비트 정수 섞기)
    function makeRng(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 지수 간격 — 평균 mean 인 도착 간격. u 는 0 이상 1 미만 난수
    function expGap(u, mean) { return -Math.log(1 - u) * mean; }
    function pad2(n) { return n < 10 ? '0' + n : String(n); }
    function makeSpring(x) { return { x: x, v: 0, to: x }; }
    const SPRING_SUBSTEP = 1 / 240;
    function stepSpring(s, stiffness, damping, dt) {
        let left = dt;
        while (left > 1e-9) {
            const h = Math.min(SPRING_SUBSTEP, left);
            s.v += (stiffness * (s.to - s.x) - damping * s.v) * h;
            s.x += s.v * h;
            left -= h;
        }
    }
    function snapSpring(s, x) { s.x = x; s.v = 0; s.to = x; }
    // ── 부채꼴 객석 (화면 좌표) ───────────────────────────────────
    // 무대 중심(HALL_CX, HALL_CY)에서 줄 i 의 반지름 r = ROW_R0 + i × ROW_GAP. 각도 0 = 무대에서 똑바로 아래, 왼쪽이 음수
    const HALL_CX = 240;
    const HALL_CY = 18;
    const HALL_ROWS = 10;
    const ROW_R0 = 62;
    const ROW_GAP = 18;
    const FAN_HALF = 0.98;
    // 통로 두 줄기의 각도 — 통로 폭 AISLE_W(px)는 줄마다 AISLE_W / r 라디안의 틈이 된다
    const AISLE_ANGLES = [-0.34, 0.34];
    const AISLE_W = 14;
    // 좌석 하나가 호 위에서 차지하는 길이(px)
    const SEAT_W = 16;
    const ROW_LETTERS = 'ABCDEFGHJKLMNPQRST';
    function seatLabel(row, k) { return ROW_LETTERS.charAt(row) + '-' + pad2(k + 1); }
    // 줄마다 — 부채꼴 전체 각을 통로 틈으로 끊은 구간마다 호 길이(각 × 반지름)를 좌석 폭으로 나눈 몫이 그 구간 자리 수,
    // 자리 중심은 구간 각을 자리 수로 똑같이 나눈 칸의 가운데
    function buildHall(rows, r0, gap, seatW, aisleW) {
        const seats = [];
        const rowStart = [];
        const rowCount = [];
        const segs = [];
        for (let i = 0; i < rows; i += 1) {
            const r = r0 + i * gap;
            const bounds = [-FAN_HALF];
            for (const a of AISLE_ANGLES) {
                const half = aisleW / 2 / r;
                bounds.push(a - half, a + half);
            }
            bounds.push(FAN_HALF);
            rowStart.push(seats.length);
            let k = 0;
            for (let s = 0; s + 1 < bounds.length; s += 2) {
                const a0 = bounds[s];
                const span = bounds[s + 1] - a0;
                const n = Math.floor(span * r / seatW);
                const seg = [];
                for (let j = 0; j < n; j += 1) {
                    const ang = a0 + (j + 0.5) * span / n;
                    seg.push(seats.length);
                    seats.push({ row: i, k: k, ang: ang, r: r, x: HALL_CX + r * Math.sin(ang), y: HALL_CY + r * Math.cos(ang), label: seatLabel(i, k), seg: segs.length });
                    k += 1;
                }
                segs.push(seg);
            }
            rowCount.push(k);
        }
        return { seats: seats, rowStart: rowStart, rowCount: rowCount, segs: segs };
    }
    const HALL = buildHall(HALL_ROWS, ROW_R0, ROW_GAP, SEAT_W, AISLE_W);
    // 옆 자리·앞뒤 줄로 옮기기 — 앞뒤 줄은 각도가 가장 가까운 자리
    function hallNeighbor(idx, dk, dr) {
        const s = HALL.seats[idx];
        if (dr !== 0) {
            const row = clamp(s.row + dr, 0, HALL_ROWS - 1);
            let best = HALL.rowStart[row];
            for (let j = 0; j < HALL.rowCount[row]; j += 1) {
                const c = HALL.rowStart[row] + j;
                if (Math.abs(HALL.seats[c].ang - s.ang) < Math.abs(HALL.seats[best].ang - s.ang)) {
                    best = c;
                }
            }
            return best;
        }
        const k = clamp(s.k + dk, 0, HALL.rowCount[s.row] - 1);
        return HALL.rowStart[s.row] + k;
    }
    function findSeat(label) {
        for (let i = 0; i < HALL.seats.length; i += 1) {
            if (HALL.seats[i].label === label) {
                return i;
            }
        }
        return 0;
    }
    // ── 시야 (단면, 미터) ────────────────────────────────────────
    // 줄 i 는 무대 앞끝에서 rowDist(i) 떨어져 있고 바닥이 i × rake 만큼 높다. 앉은 눈높이는 그 바닥 + EYE_H
    const FIRST_ROW_M = 2.4;
    const ROW_DEPTH_M = 0.95;
    const RAKE_STEP = 0.12;
    const EYE_H = 1.15;
    const STAGE_H = 0.95;
    const STAGE_W_M = 8;
    const STAGE_D_M = 5;
    // 앞사람 눈 위로 시선이 이만큼(미터) 지나가면 머리에 가리지 않는다고 본다
    const C_GOOD = 0.12;
    const DIST_NEAR_M = 4;
    const DIST_FAR_M = 12;
    // 무대 폭이 눈에 차지하는 각 — 이 각을 넘으면 고개를 돌려야 무대 양끝이 보인다
    const FOV_OK_DEG = 50;
    const FOV_BAD_DEG = 100;
    // 무대 앞끝을 내려다보거나 올려다보는 각
    const PITCH_OK_DEG = 8;
    const PITCH_BAD_DEG = 28;
    // 정면에서 벗어난 각(라디안)
    const SIDE_OK = 0.25;
    const SIDE_BAD = 1.0;
    // 점수 무게 — 틈 · 거리 · 무대 폭 · 높낮이 · 옆 각 (합 1)
    const SCORE_WEIGHTS = [0.3, 0.1, 0.35, 0.1, 0.15];
    function rowDist(i) { return FIRST_ROW_M + i * ROW_DEPTH_M; }
    function eyeY(i, rake) { return i * rake + EYE_H; }
    // 틈(미터) — 줄 i 의 눈에서 무대 앞끝(높이 stageH)까지 그은 직선이 앞줄 자리(거리 rowDist(i−1))를 지날 때의 높이 − 앞줄 눈높이.
    // 직선 높이 = stageH + (내 눈 − stageH) × (앞줄 거리 / 내 거리). 맨 앞줄은 앞사람이 없으므로 C_GOOD 로 친다
    function clearance(i, stageH, rake) {
        if (i <= 0) {
            return C_GOOD;
        }
        const e = eyeY(i, rake);
        const lineAt = stageH + (e - stageH) * (rowDist(i - 1) / rowDist(i));
        return lineAt - eyeY(i - 1, rake);
    }
    function viewOf(row, ang, stageH, rake) {
        const d = rowDist(row);
        const c = clearance(row, stageH, rake);
        const fov = 2 * Math.atan(STAGE_W_M / 2 / d) * 180 / Math.PI;
        const pitch = Math.atan2(eyeY(row, rake) - stageH, d) * 180 / Math.PI;
        const parts = [
            clamp(c / C_GOOD, 0, 1),
            1 - smooth((d - DIST_NEAR_M) / (DIST_FAR_M - DIST_NEAR_M)),
            1 - smooth((fov - FOV_OK_DEG) / (FOV_BAD_DEG - FOV_OK_DEG)),
            1 - smooth((Math.abs(pitch) - PITCH_OK_DEG) / (PITCH_BAD_DEG - PITCH_OK_DEG)),
            1 - smooth((Math.abs(ang) - SIDE_OK) / (SIDE_BAD - SIDE_OK))
        ];
        let score = 0;
        for (let k = 0; k < parts.length; k += 1) {
            score += SCORE_WEIGHTS[k] * parts[k];
        }
        return { clear: c, fov: fov, pitch: pitch, parts: parts, score: score };
    }
    function hallScores(stageH, rake) {
        return HALL.seats.map(function (s) { return viewOf(s.row, s.ang, stageH, rake).score; });
    }
    // ── 원근 투영 (미터) ─────────────────────────────────────────
    // 무대 앞끝 가운데가 원점. x 오른쪽, y 위, z 객석 쪽. 자리의 눈 = (ρ sin 각, 눈높이, ρ cos 각), ρ = rowDist(줄)
    function v3sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
    function v3dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    function v3cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
    function v3norm(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
    function v3lerp(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    const NEAR_M = 0.15;
    // 무대 위 이 점을 바라본다 — 배우 가슴 높이쯤
    const LOOK_AT = [0, STAGE_H + 1.1, -1.6];
    function seatEye(row, ang, rake) {
        const rho = rowDist(row);
        return [rho * Math.sin(ang), eyeY(row, rake), rho * Math.cos(ang)];
    }
    function lookAt(eye, target, focal, cx, cy) {
        const fwd = v3norm(v3sub(target, eye));
        const right = v3norm(v3cross(fwd, [0, 1, 0]));
        const up = v3cross(right, fwd);
        return { eye: eye, right: right, up: up, fwd: fwd, focal: focal, cx: cx, cy: cy };
    }
    // 투영 — 카메라 기준 깊이 z 로 나눈다: x' = cx + f·x/z, y' = cy − f·y/z. 깊이가 NEAR_M 보다 가까우면 깊이를 음수로 돌려 버리게 한다
    function project(cam, p) {
        const rel = v3sub(p, cam.eye);
        const z = v3dot(rel, cam.fwd);
        if (z < NEAR_M) {
            return [0, 0, -1];
        }
        return [cam.cx + cam.focal * v3dot(rel, cam.right) / z, cam.cy - cam.focal * v3dot(rel, cam.up) / z, z];
    }
    // 앞줄 머리 — 눈보다 HEAD_UP 위에 중심, 반지름 가로 HEAD_RX · 세로 HEAD_RY (미터)
    const HEAD_UP = 0.06;
    const HEAD_RX = 0.1;
    const HEAD_RY = 0.13;
    function headsAhead(cam, row, rake) {
        const out = [];
        for (const s of HALL.seats) {
            if (s.row >= row) {
                continue;
            }
            const e = seatEye(s.row, s.ang, rake);
            const p = project(cam, [e[0], e[1] + HEAD_UP, e[2]]);
            if (p[2] <= 0) {
                continue;
            }
            out.push({ sx: p[0], sy: p[1], rx: cam.focal * HEAD_RX / p[2], ry: cam.focal * HEAD_RY / p[2], z: p[2] });
        }
        return out;
    }
    // 무대 가림 — 무대 앞끝 선과 배우 가슴 높이 선에서 STAGE_SAMPLES 점씩 찍어, 더 가까운 머리 타원 안에 든 점의 비율
    const STAGE_SAMPLES = 41;
    function stageOcclusion(cam, heads) {
        let hidden = 0;
        let total = 0;
        const lines = [[STAGE_H, 0], [LOOK_AT[1], LOOK_AT[2]]];
        for (const ln of lines) {
            for (let k = 0; k < STAGE_SAMPLES; k += 1) {
                const x = lerp(-STAGE_W_M / 2, STAGE_W_M / 2, k / (STAGE_SAMPLES - 1));
                const p = project(cam, [x, ln[0], ln[1]]);
                if (p[2] <= 0 || p[0] < 0 || p[0] > W || p[1] < 0 || p[1] > H) {
                    continue;
                }
                total += 1;
                for (const h of heads) {
                    if (h.z >= p[2]) {
                        continue;
                    }
                    const dx = (p[0] - h.sx) / h.rx;
                    const dy = (p[1] - h.sy) / h.ry;
                    if (dx * dx + dy * dy <= 1) {
                        hidden += 1;
                        break;
                    }
                }
            }
        }
        return total ? hidden / total : 0;
    }
    // ── 영화관 격자 (04 · 05) ────────────────────────────────────
    // 줄 CIN_ROWS × 열 CIN_COLS, 통로는 CIN_AISLES 열 앞. 자리 번호 = 줄 × CIN_COLS + 열
    const CIN_ROWS = 8;
    const CIN_COLS = 14;
    const CIN_AISLES = [3, 11];
    const CELL_W = 22;
    const CELL_H = 18;
    const CELL_GAP = 4;
    const AISLE_PX = 16;
    const GRID_TOP = 62;
    // 가장 좋은 줄과 그 앞뒤로 점수가 0 이 되는 줄 수
    const BEST_ROW = 5;
    const ROW_SPREAD = 6;
    function cinX(c) {
        let aisles = 0;
        for (const a of CIN_AISLES) {
            if (c >= a) {
                aisles += 1;
            }
        }
        const total = CIN_COLS * (CELL_W + CELL_GAP) - CELL_GAP + CIN_AISLES.length * AISLE_PX;
        return (W - total) / 2 + c * (CELL_W + CELL_GAP) + aisles * AISLE_PX;
    }
    function cinY(r) { return GRID_TOP + r * (CELL_H + CELL_GAP); }
    // 격자 점수 — 줄은 BEST_ROW 에서 멀수록 제곱으로, 열은 가운데에서 멀수록 제곱으로 깎는다
    function gridScore(r, c) {
        const rowK = 1 - Math.pow((r - BEST_ROW) / ROW_SPREAD, 2);
        const mid = (CIN_COLS - 1) / 2;
        const colK = 1 - 0.7 * Math.pow((c - mid) / mid, 2);
        return clamp(rowK, 0, 1) * colK;
    }
    function gridSegments() {
        const out = [];
        for (let r = 0; r < CIN_ROWS; r += 1) {
            let seg = [];
            for (let c = 0; c < CIN_COLS; c += 1) {
                if (CIN_AISLES.indexOf(c) >= 0 && seg.length) {
                    out.push(seg);
                    seg = [];
                }
                seg.push(r * CIN_COLS + c);
            }
            out.push(seg);
        }
        return out;
    }
    function gridLabel(id) { return ROW_LETTERS.charAt(Math.floor(id / CIN_COLS)) + '-' + pad2(id % CIN_COLS + 1); }
    function findBlocks(segs, free, score, size) {
        const out = [];
        segs.forEach(function (seg, si) {
            for (let s = 0; s + size <= seg.length; s += 1) {
                const ids = seg.slice(s, s + size);
                if (!ids.every(function (id) { return free[id]; })) {
                    continue;
                }
                let sum = 0;
                for (const id of ids) {
                    sum += score[id];
                }
                let orphan = -1;
                const L = s - 1;
                if (L >= 0 && free[seg[L]] && (L - 1 < 0 || !free[seg[L - 1]])) {
                    orphan = seg[L];
                }
                const R = s + size;
                if (R < seg.length && free[seg[R]] && (R + 1 >= seg.length || !free[seg[R + 1]])) {
                    orphan = seg[R];
                }
                out.push({ seg: si, start: s, ids: ids, sum: sum, orphan: orphan });
            }
        });
        return out;
    }
    // 가장 높은 후보 — allowOrphan 이 거짓이면 외톨이 빈칸을 남기는 후보는 건너뛴다. 없으면 −1
    function bestBlock(blocks, allowOrphan) {
        let best = -1;
        blocks.forEach(function (b, i) {
            if (!allowOrphan && b.orphan >= 0) {
                return;
            }
            if (best < 0 || b.sum > blocks[best].sum + 1e-9) {
                best = i;
            }
        });
        return best;
    }
    // 좌석 상태 — 색만이 아니라 무늬로도 갈린다. 빈자리 = 연한 바탕 + 진한 테두리, 팔린 자리 = 회색 + 빗금, 잡아 둔 자리 = 버터 + 굵은 테두리, 고른 자리 = 민트 + 체크
    const SEAT_FREE = 0;
    const SEAT_SOLD = 1;
    const SEAT_HELD = 2;
    const SEAT_MINE = 3;
    // 장면 시계(초)와 상태 줄 글자 — 장면 계산이 고치고, 화면 쪽이 읽어 그린다
    let sceneT = 0;
    let simStatus = '';
    // 파스텔 팔레트 — 크림 바탕 위 라벤더·민트·버터·산호. 팔린 자리·글자는 진한 쪽으로 명도 차를 둔다
    const PAPER = [251, 247, 238];
    const PAPER_DIM = [241, 234, 220];
    const GRID = [226, 218, 204];
    const INK = [44, 38, 58];
    const INK_SOFT = [112, 104, 126];
    const CREAM = [255, 251, 242];
    const LAVENDER = [190, 174, 236];
    const MINT = [150, 212, 186];
    const BUTTER = [244, 220, 140];
    const CORAL = [242, 160, 140];
    const SKY = [160, 200, 236];
    const PINK = [242, 182, 206];
    const SOLD = [176, 168, 186];
    const MINT_DEEP = [36, 120, 92];
    const CORAL_DEEP = [186, 70, 56];
    const VIOLET_DEEP = [86, 56, 168];
    // 무대 조명 — 따뜻한 미색
    const STAGE_LIGHT = [252, 236, 204];
    const STAGE_WOOD = [214, 182, 150];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    // 점수 색 — 0 은 차가운 하늘, 0.5 는 연한 미색, 1 은 따뜻한 살구
    const SCORE_COLD = [150, 182, 228];
    const SCORE_MID = [238, 228, 204];
    const SCORE_WARM = [244, 160, 120];
    function scoreColor(v) {
        const c = clamp(v, 0, 1);
        return c < 0.5 ? mix(SCORE_COLD, SCORE_MID, c * 2) : mix(SCORE_MID, SCORE_WARM, (c - 0.5) * 2);
    }
    // 점수 0~1 을 화면 글자 0~100 으로

    // 한 프레임에 넘기는 시간 상한(초) — 탭을 오래 숨겼다 돌아온 첫 프레임에도 50ms 까지만 계산에 넣는다
    const DT_MAX = 0.05;
    // 장면 시계를 dt 만큼 — 한 바퀴(LOOP_S)를 넘으면 처음 배치로 되돌려 다시 시연한다
    function advance(dt) {
        sceneT += dt;
        if (sceneT >= LOOP_S) {
            sceneT -= LOOP_S;
            reset();
        }
        update(dt);
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        draw();
        pushStatus();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 시계 다시 맞추기 — 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 동작 줄이기 — 루프를 돌리지 않고 시연이 끝난 최종 배치 한 장만 그린다
    function showRest() {
        stopLoop();
        sceneT = 0;
        reset();
        restPose();
        draw();
        pushStatus();
    }
    function play() {
        sceneT = 0;
        reset();
        draw();
        pushStatus();
        if (!paused) {
            startLoop();
        }
    }
    pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 루프를 멈추고, 돌아오면 시계를 다시 맞춰 시작한다 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 페이지를 연 채 바뀌면 — 켜지면 최종 배치로 멈추고, 꺼지면 시연을 처음부터
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        draw();
    }, { signal: off.signal });
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
</body>
</html>
