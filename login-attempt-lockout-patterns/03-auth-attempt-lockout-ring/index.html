<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잠금까지 남은 링 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="alr is-demo" id="alr">
  <div class="alr__ringwrap">
    <svg class="alr__ring" viewBox="0 0 100 100" width="120" height="120">
      <circle class="alr__track" cx="50" cy="50" r="40"></circle>
      <circle class="alr__prog" id="alrProg" cx="50" cy="50" r="40"></circle>
    </svg>
    <div class="alr__mid">
      <span class="alr__count" id="alrCount">5</span>
      <span class="alr__label">남은 시도</span>
    </div>
  </div>
  <button class="alr__btn" id="alrBtn" type="button">로그인 시도</button>
</div>
<script>
(function () {
  var root = document.getElementById('alr');
  var btn = document.getElementById('alrBtn');
  var countEl = document.getElementById('alrCount');
  var prog = document.getElementById('alrProg');

  // 상수: 최대 시도 횟수·링 반지름(SVG viewBox 좌표)
  var MAX_TRIES = 5;
  var R = 40;
  var CIRC = 2 * Math.PI * R; // 원둘레
  prog.style.strokeDasharray = CIRC.toFixed(2);

  var remaining = MAX_TRIES;

  // 계산 겹: 링 오프셋 = 둘레 × (1 − 남은/최대) — stroke-dashoffset 산술
  function paint() {
    countEl.textContent = String(remaining);
    var offset = CIRC * (1 - remaining / MAX_TRIES);
    prog.style.strokeDashoffset = offset.toFixed(2);
    root.classList.toggle('alr--locked', remaining <= 0);
  }

  function fail() {
    if (remaining <= 0) { remaining = MAX_TRIES; paint(); return; }
    remaining -= 1;
    paint();
  }

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    fail();
  });
  paint();

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(fail, 380); }
})();
</script>
</main>
</body>
</html>
