<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>남은 시도 횟수 흔들림 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="acs is-demo" id="acs">
  <div class="acs__card">
    <div class="acs__row">
      <label class="acs__field"><input class="acs__input" id="acsUser" type="text" placeholder="아이디" autocomplete="off" spellcheck="false"></label>
      <label class="acs__field"><input class="acs__input acs__input--pw" id="acsPass" type="text" placeholder="비밀번호" autocomplete="off" spellcheck="false"></label>
    </div>
    <button class="acs__btn" id="acsBtn" type="button">로그인</button>
    <div class="acs__readout">
      <span class="acs__label">남은 시도</span>
      <span class="acs__count" id="acsCount">5</span>
    </div>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('acs');
  var btn = document.getElementById('acsBtn');
  var countEl = document.getElementById('acsCount');

  // 상수: 최대 시도 횟수·흔들림 진폭 기준값·진폭 증가폭·흔들림 지속시간·진동 횟수
  var MAX_TRIES = 5;
  var AMP_BASE = 3;   // px — 첫 실패 때 흔들림 폭
  var AMP_STEP = 2;   // px — 남은 횟수가 줄 때마다 늘어나는 폭
  var SHAKE_MS = 480;
  var SHAKE_FREQ = 4; // 진동 횟수

  var remaining = MAX_TRIES;
  var shaking = false;

  function paint() {
    countEl.textContent = String(remaining);
    countEl.classList.toggle('acs__count--low', remaining <= 1);
  }

  // 계산 겹: 진폭 = 기준값 + (최대-남은)×증가폭, 감쇠 사인 = sin(t·2π·진동수)×(1-t)
  function shake() {
    var amp = AMP_BASE + (MAX_TRIES - remaining) * AMP_STEP;
    var start = null;
    shaking = true;
    function frame(ts) {
      if (start === null) start = ts;
      var t = Math.min(1, (ts - start) / SHAKE_MS);
      var x = amp * Math.sin(t * Math.PI * 2 * SHAKE_FREQ) * (1 - t);
      countEl.style.transform = 'translateX(' + x.toFixed(2) + 'px)';
      if (t < 1) requestAnimationFrame(frame);
      else { countEl.style.transform = 'translateX(0)'; shaking = false; }
    }
    requestAnimationFrame(frame);
  }

  function fail() {
    if (shaking) return;
    remaining = remaining > 0 ? remaining - 1 : MAX_TRIES;
    paint();
    shake();
  }

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    fail();
  });
  paint();

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(fail, 420); }
})();
</script>
</main>
</body>
</html>
