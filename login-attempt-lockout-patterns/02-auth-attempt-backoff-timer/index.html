<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재시도 대기 배증 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="abt is-demo" id="abt">
  <div class="abt__card">
    <div class="abt__row">
      <span class="abt__label">실패 <b id="abtFails">0</b>회</span>
      <span class="abt__wait" id="abtWait">대기 없음</span>
    </div>
    <div class="abt__track"><div class="abt__fill" id="abtFill"></div></div>
    <button class="abt__btn" id="abtBtn" type="button">로그인 시도</button>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('abt');
  var btn = document.getElementById('abtBtn');
  var failsEl = document.getElementById('abtFails');
  var waitEl = document.getElementById('abtWait');
  var fill = document.getElementById('abtFill');

  // 상수: 지수 백오프 = BACKOFF_BASE_SEC × 2^실패횟수(초), CAP_SEC 에서 증가를 멈춘다
  var BACKOFF_BASE_SEC = 1;
  var CAP_SEC = 16;
  var DEMO_TICK_MS = 90; // 데모 안에서 "1초"를 표현하는 실제 ms(가속)

  var fails = 0;
  var locked = false;
  var rafId = null;

  function waitSecondsOf(n) {
    return Math.min(CAP_SEC, BACKOFF_BASE_SEC * Math.pow(2, n));
  }

  function countdown(totalSec) {
    locked = true;
    btn.disabled = true;
    var start = null;
    var totalMs = totalSec * DEMO_TICK_MS;
    function frame(ts) {
      if (start === null) start = ts;
      var elapsed = ts - start;
      var left = Math.max(0, totalSec - elapsed / DEMO_TICK_MS);
      waitEl.textContent = '다음 시도까지 ' + Math.ceil(left) + '초';
      fill.style.transform = 'scaleX(' + Math.max(0, left / totalSec) + ')';
      if (elapsed < totalMs) { rafId = requestAnimationFrame(frame); }
      else {
        waitEl.textContent = '대기 없음';
        fill.style.transform = 'scaleX(0)';
        locked = false;
        btn.disabled = false;
      }
    }
    rafId = requestAnimationFrame(frame);
  }

  function fail() {
    if (locked) return;
    fails += 1;
    failsEl.textContent = String(fails);
    countdown(waitSecondsOf(fails));
  }

  function reset() {
    if (rafId) cancelAnimationFrame(rafId);
    fails = 0;
    locked = false;
    btn.disabled = false;
    failsEl.textContent = '0';
    waitEl.textContent = '대기 없음';
    fill.style.transform = 'scaleX(0)';
  }

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    fail();
  });

  var autoTimer = null;
  var stage = 0;
  function autoTick() {
    if (locked) return;
    if (stage >= 4) { reset(); stage = 0; return; }
    fail();
    stage += 1;
  }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 260); }
})();
</script>
</main>
</body>
</html>
