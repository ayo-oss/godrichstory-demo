<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captcha step-up — the captcha cell-count value grows each time the failure count crosses a threshold value — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ace is-demo" id="ace">
  <div class="ace__row">
    <span class="ace__label">Fail <b id="aceFails">0</b>times</span>
    <span class="ace__stage" id="aceStage">No captcha</span>
  </div>
  <div class="ace__grid" id="aceGrid"></div>
  <button class="ace__btn" id="aceBtn" type="button">Simulate failed login</button>
</div>
<script>
(function () {
  var root = document.getElementById('ace');
  var btn = document.getElementById('aceBtn');
  var failsEl = document.getElementById('aceFails');
  var stageEl = document.getElementById('aceStage');
  var grid = document.getElementById('aceGrid');

  // 상수: Captcha 단계 승격 기준 Failure count · 단계별 칸 수(제곱수라야 격자가 맞는다) · 자동재생 리셋 주기
  var STAGE_THRESHOLD = 2;
  var CELL_STEPS = [0, 4, 9, 16]; // 단계 0=없음, 1=2x2, 2=3x3, 3(상한)=4x4
  var AUTOPLAY_RESET_TICKS = 7;

  var fails = 0;

  function render() {
    // 계산 겹: 단계 = min(상한, floor(Fail÷기준)), 칸수 = CELL_STEPS[단계]
    var stage = Math.min(CELL_STEPS.length - 1, Math.floor(fails / STAGE_THRESHOLD));
    var cells = CELL_STEPS[stage];
    var cols = Math.round(Math.sqrt(cells)) || 0;
    failsEl.textContent = String(fails);
    stageEl.textContent = stage === 0 ? 'No captcha' : ('Captcha ' + cols + '×' + cols);
    grid.style.setProperty('--cols', cols || 1);
    grid.innerHTML = '';
    for (var i = 0; i < cells; i++) {
      var c = document.createElement('div');
      c.className = 'ace__cell';
      grid.appendChild(c);
    }
  }

  function fail() {
    fails += 1;
    render();
  }

  function reset() {
    fails = 0;
    render();
  }

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    fail();
  });
  render();

  var autoTimer = null;
  var tick = 0;
  function autoTick() {
    tick += 1;
    if (tick > AUTOPLAY_RESET_TICKS) { reset(); tick = 0; return; }
    fail();
  }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 300); }
})();
</script>
</main>
</body>
</html>
