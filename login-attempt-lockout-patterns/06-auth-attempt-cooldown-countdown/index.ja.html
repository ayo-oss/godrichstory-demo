<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロック解除カウントダウン — ロック後、再試行できるまでの残り秒数の値が減っていく方式 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="acc is-demo" id="acc">
  <div class="acc__num" id="accNum">8</div>
  <div class="acc__msg" id="accMsg">ロック解除までの残り秒数</div>
  <button class="acc__btn" id="accBtn" type="button">再試行</button>
</div>
<script>
(function () {
  var root = document.getElementById('acc');
  var btn = document.getElementById('accBtn');
  var numEl = document.getElementById('accNum');
  var msgEl = document.getElementById('accMsg');

  // 상수: 잠금 유지 秒 · 데모 안 "1秒"를 표현하는 실제 ms(가속) · 초마다 펄스 스케일 크기
  var LOCK_SECONDS = 8;
  var DEMO_TICK_MS = 170;
  var PULSE_SCALE = 1.22;

  var remaining = LOCK_SECONDS;
  var timerId = null;

  function easeOutBack(t) { return 1 + 1.4 * Math.pow(t - 1, 3) + 0.6 * Math.pow(t - 1, 2); }

  // 계산 겹: 초가 바뀔 때 easing 곡선(easeOutBack)으로 스케일 값을 만들어 펄스
  function pulse() {
    var start = null;
    var dur = 160;
    function frame(ts) {
      if (start === null) start = ts;
      var t = Math.min(1, (ts - start) / dur);
      var s = 1 + (PULSE_SCALE - 1) * (1 - easeOutBack(t));
      numEl.style.transform = 'scale(' + s.toFixed(3) + ')';
      if (t < 1) requestAnimationFrame(frame);
      else numEl.style.transform = 'scale(1)';
    }
    requestAnimationFrame(frame);
  }

  function paint() {
    numEl.textContent = String(remaining);
    root.classList.toggle('acc--open', remaining <= 0);
    msgEl.textContent = remaining <= 0 ? '今すぐ再試行できます' : 'ロック解除までの残り秒数';
    btn.disabled = remaining > 0;
  }

  function start() {
    remaining = LOCK_SECONDS;
    paint();
    if (timerId) clearInterval(timerId);
    timerId = setInterval(function () {
      remaining -= 1;
      pulse();
      if (remaining <= 0) { clearInterval(timerId); timerId = null; }
      paint();
    }, DEMO_TICK_MS);
  }

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    if (remaining <= 0) start();
  });
  paint();

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    start();
    autoTimer = setInterval(function () { if (remaining <= 0) start(); }, DEMO_TICK_MS);
  }
})();
</script>
</main>
</body>
</html>
