<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성공 시 초기화 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="asr is-demo" id="asr">
  <div class="asr__readout">
    <span class="asr__label">실패 횟수</span>
    <span class="asr__count" id="asrCount">0</span>
  </div>
  <div class="asr__row">
    <button class="asr__btn asr__btn--fail" id="asrFailBtn" type="button">로그인 실패</button>
    <button class="asr__btn asr__btn--ok" id="asrOkBtn" type="button">로그인 성공</button>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('asr');
  var failBtn = document.getElementById('asrFailBtn');
  var okBtn = document.getElementById('asrOkBtn');
  var countEl = document.getElementById('asrCount');

  // 상수: 최대 표시 실패 횟수 · 리셋 스프링 물리(강성·감쇠·질량)
  var MAX_SHOWN = 6;
  var SPRING_K = 220;
  var SPRING_C = 14;
  var SPRING_M = 1;

  var fails = 0;
  var scalePos = 1;
  var scaleVel = 0;
  var scaleTarget = 1;
  var rafId = null;

  function paintCount() {
    countEl.textContent = String(fails);
    countEl.classList.toggle('asr__count--ok', fails === 0);
  }

  // 계산 겹: 리셋 순간 스케일 값을 스프링-감쇠 물리로 적분해 오버슈트 복귀를 만든다
  function scaleTick(ts, last) {
    var dt = Math.min(32, ts - last) / 1000;
    var disp = scalePos - scaleTarget;
    var acc = (-SPRING_K * disp - SPRING_C * scaleVel) / SPRING_M;
    scaleVel += acc * dt;
    scalePos += scaleVel * dt;
    countEl.style.transform = 'scale(' + scalePos.toFixed(3) + ')';
    if (Math.abs(disp) > 0.004 || Math.abs(scaleVel) > 0.01) {
      rafId = requestAnimationFrame(function (t) { scaleTick(t, ts); });
    } else {
      scalePos = scaleTarget;
      countEl.style.transform = 'scale(1)';
    }
  }

  function bounce() {
    if (rafId) cancelAnimationFrame(rafId);
    scalePos = 1.5;
    scaleVel = 0;
    scaleTarget = 1;
    rafId = requestAnimationFrame(function (ts) { scaleTick(ts, ts - 16); });
  }

  function fail() {
    fails = Math.min(MAX_SHOWN, fails + 1);
    paintCount();
  }

  function success() {
    fails = 0;
    paintCount();
    bounce();
  }

  failBtn.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); fail(); });
  okBtn.addEventListener('click', function () { root.classList.remove('is-demo'); stopAutoplay(); success(); });
  paintCount();

  var autoTimer = null;
  var tick = 0;
  function autoTick() {
    tick += 1;
    if (tick % 4 === 0) success(); else fail();
  }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 380); }
})();
</script>
</main>
</body>
</html>
