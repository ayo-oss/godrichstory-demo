<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>警告バナーのスライド — 繰り返しの失敗がしきい値を超えると、バナーの位置の値が画面上から下りてくる方式 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="abs is-demo" id="abs">
  <div class="abs__banner" id="absBanner">ログイン試行が繰り返し検出されました</div>
  <div class="abs__card">
    <span class="abs__label">繰り返しの失敗 <b id="absFails">0</b>回</span>
    <button class="abs__btn" id="absBtn" type="button">ログイン失敗を試す</button>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('abs');
  var btn = document.getElementById('absBtn');
  var failsEl = document.getElementById('absFails');
  var banner = document.getElementById('absBanner');

  // 상수: 배너가 뜨는 失敗 기준 · 스프링 물리(강성·감쇠·질량)
  var THRESHOLD = 3;
  var SPRING_K = 180;
  var SPRING_C = 18;
  var SPRING_M = 1;

  var fails = 0;
  var pos = -60;   // 배너 위치(%, 음수 = 화면 밖 위)
  var vel = 0;
  var target = -60;
  var rafId = null;

  // 계산 겹: 반암시적 오일러 스프링 적분 — 속도 += (-k·변위 − c·속도)/질량·dt, 위치 += 속도·dt
  function tick(ts, last) {
    var dt = Math.min(32, ts - last) / 1000;
    var disp = pos - target;
    var acc = (-SPRING_K * disp - SPRING_C * vel) / SPRING_M;
    vel += acc * dt;
    pos += vel * dt;
    banner.style.transform = 'translateY(' + pos.toFixed(2) + '%)';
    if (Math.abs(disp) > 0.3 || Math.abs(vel) > 0.5) {
      rafId = requestAnimationFrame(function (t) { tick(t, ts); });
    } else {
      pos = target;
      banner.style.transform = 'translateY(' + pos.toFixed(2) + '%)';
    }
  }

  function spring(to) {
    if (rafId) cancelAnimationFrame(rafId);
    target = to;
    rafId = requestAnimationFrame(function (ts) { tick(ts, ts - 16); });
  }

  function fail() {
    fails += 1;
    failsEl.textContent = String(fails);
    if (fails === THRESHOLD) spring(0);
  }

  function reset() {
    fails = 0;
    failsEl.textContent = '0';
    spring(-60);
  }

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    fail();
  });

  var autoTimer = null;
  function autoTick() {
    if (fails >= THRESHOLD) { reset(); return; }
    fail();
  }
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(autoTick, 420); }
})();
</script>
</main>
</body>
</html>
