<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모션 감소 즉시 갱신 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="arm is-demo" id="arm">
  <div class="arm__panel">
    <span class="arm__tag">일반 모션</span>
    <span class="arm__count" id="armCountA">5</span>
  </div>
  <div class="arm__panel">
    <span class="arm__tag">모션 감소</span>
    <span class="arm__count arm__count--static" id="armCountB">5</span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('arm');
  var a = document.getElementById('armCountA');
  var b = document.getElementById('armCountB');

  // 상수: 최대 시도 횟수 · 일반 모션 흔들림 진폭·지속시간
  var MAX_TRIES = 5;
  var AMP = 6;
  var SHAKE_MS = 300;

  var remaining = MAX_TRIES;

  // 계산 겹: 일반 판은 감쇠 사인으로 흔들며 값을 바꾸고, 모션 감소 판은 같은 값을 애니메이션 없이 즉시 반영한다
  function shakeA() {
    var start = null;
    function frame(ts) {
      if (start === null) start = ts;
      var t = Math.min(1, (ts - start) / SHAKE_MS);
      var x = AMP * Math.sin(t * Math.PI * 2 * 3) * (1 - t);
      a.style.transform = 'translateX(' + x.toFixed(2) + 'px)';
      if (t < 1) requestAnimationFrame(frame);
      else a.style.transform = 'translateX(0)';
    }
    requestAnimationFrame(frame);
  }

  function step() {
    remaining = remaining > 0 ? remaining - 1 : MAX_TRIES;
    a.textContent = String(remaining);
    shakeA();
    // 모션 감소 판: 같은 값이 트윈 없이 그 자리에서 바로 바뀐다
    b.textContent = String(remaining);
  }

  root.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    step();
  });

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(step, 420); }
  else { autoTimer = setInterval(function () { remaining = remaining > 0 ? remaining - 1 : MAX_TRIES; a.textContent = b.textContent = String(remaining); }, 420); }
})();
</script>
</main>
</body>
</html>
