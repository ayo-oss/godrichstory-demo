<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>試行履歴フェードリスト — 新しい試行が積まれるたびに古い記録ほど不透明度の値が下がる方式 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ahf is-demo" id="ahf">
  <button class="ahf__btn" id="ahfBtn" type="button">ログイン試行を追加</button>
  <ul class="ahf__list" id="ahfList"></ul>
</div>
<script>
(function () {
  var root = document.getElementById('ahf');
  var btn = document.getElementById('ahfBtn');
  var list = document.getElementById('ahfList');

  // 상수: 화면에 보이는 최대 기록 수 · 기록 하나마다 낮아지는 투명도 폭 · 최소 투명도
  var MAX_ENTRIES = 5;
  var OPACITY_STEP = 0.18;
  var MIN_OPACITY = 0.16;

  var SEQ = ['失敗', '失敗', '成功', '失敗', '失敗', '失敗', '成功', '失敗'];
  var seqIdx = 0;
  var entries = []; // 최신이 index 0

  function fmtTime(n) {
    var m = String(10 + n % 50).padStart(2, '0');
    return '10:' + m;
  }

  // 계산 겹: i번째(0=최신) 항목의 불투명도 = max(최소, 1 − i×STEP)
  function render() {
    list.innerHTML = '';
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var op = Math.max(MIN_OPACITY, 1 - i * OPACITY_STEP);
      var li = document.createElement('li');
      li.className = 'ahf__row' + (e.result === '失敗' ? ' ahf__row--fail' : ' ahf__row--ok');
      li.style.opacity = op.toFixed(2);
      li.innerHTML = '<span class="ahf__time">' + e.time + '</span>' +
        '<span class="ahf__result">' + e.result + '</span>';
      list.appendChild(li);
    }
  }

  function addEntry() {
    var result = SEQ[seqIdx % SEQ.length];
    seqIdx += 1;
    entries.unshift({ result: result, time: fmtTime(seqIdx) });
    if (entries.length > MAX_ENTRIES) entries.length = MAX_ENTRIES;
    render();
  }

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    addEntry();
  });
  render();

  var autoTimer = null;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { autoTimer = setInterval(addEntry, 340); }
})();
</script>
</main>
</body>
</html>
