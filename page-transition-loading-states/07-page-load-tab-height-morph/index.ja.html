<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab height morph — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="th is-demo" id="th">
    <div class="th__tabs" role="tablist" aria-label="料金プランのタブ">
      <button class="th__tab" type="button" role="tab" id="th-t1" aria-controls="th-p1" aria-selected="true">無料</button>
      <button class="th__tab" type="button" role="tab" id="th-t2" aria-controls="th-p2" aria-selected="false" tabindex="-1">プロ</button>
      <button class="th__tab" type="button" role="tab" id="th-t3" aria-controls="th-p3" aria-selected="false" tabindex="-1">チーム</button>
    </div>

    <div class="th__panels">
      <div class="th__panel is-open" role="tabpanel" id="th-p1" aria-labelledby="th-t1">
        <div class="th__clip">
          <div class="th__body">
            <p class="th__price">0円</p>
            <p class="th__desc">一人で使うならこれで十分です。</p>
          </div>
        </div>
      </div>
      <div class="th__panel" role="tabpanel" id="th-p2" aria-labelledby="th-t2" aria-hidden="true">
        <div class="th__clip">
          <div class="th__body">
            <p class="th__price">月1,200円</p>
            <p class="th__desc">作業記録を数の制限なく残し、書き出し形式を全部使えます。過去30日以内に変えたものはいつでも戻せて、返信は一日以内に届きます。</p>
          </div>
        </div>
      </div>
      <div class="th__panel" role="tabpanel" id="th-p3" aria-labelledby="th-t3" aria-hidden="true">
        <div class="th__clip">
          <div class="th__body">
            <p class="th__price">月2,900円</p>
            <p class="th__desc">五人まで同じ作業スペースを一緒に使えます。</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
// 탭 높이 모프: 고른 탭은 aria-selected 가 들고, 패널은 0fr ↔ 1fr 사이에서 높이가 보간된다.
var th = document.getElementById('th');
var thTabs = [].slice.call(th.querySelectorAll('.th__tab'));
function thSelect(i) {
  th.classList.remove('is-demo');
  thTabs.forEach(function (t, n) {
    var on = n === i;
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    t.tabIndex = on ? 0 : -1;
    var p = document.getElementById(t.getAttribute('aria-controls'));
    p.classList.toggle('is-open', on);
    p.setAttribute('aria-hidden', on ? 'false' : 'true');
  });
}
thTabs.forEach(function (t, i) {
  t.addEventListener('click', function () { thSelect(i); });
  t.addEventListener('keydown', function (e) {
    var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    var n = (i + d + thTabs.length) % thTabs.length;
    thSelect(n);
    thTabs[n].focus({ preventScroll: true });
  });
});
</script>
</body>
</html>
