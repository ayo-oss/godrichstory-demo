<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline retry status bar — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="of is-demo" id="of">
    <div class="of__bar" role="status" aria-live="polite">
      <span class="of__dot" aria-hidden="true"></span>
      <span class="of__ic" aria-hidden="true">
        <span class="of__ic-on"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="m238.2 87.69l-104 125.43a8 8 0 0 1-12.3 0L17.8 87.69a7.79 7.79 0 0 1 1.31-11.21a180.75 180.75 0 0 1 217.78 0a7.79 7.79 0 0 1 1.31 11.21" opacity=".2"/><path d="M247.89 80.91a15.93 15.93 0 0 0-6.17-10.81A186.67 186.67 0 0 0 128 32A186.67 186.67 0 0 0 14.28 70.1a15.93 15.93 0 0 0-6.17 10.81a15.65 15.65 0 0 0 3.54 11.89l104 125.43A15.93 15.93 0 0 0 128 224a15.93 15.93 0 0 0 12.31-5.77l104-125.43a15.65 15.65 0 0 0 3.58-11.89M128 208L24.09 82.74A170.76 170.76 0 0 1 128 48a170.76 170.76 0 0 1 103.91 34.74Z"/></g></svg></span>
        <span class="of__ic-off"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><g><path d="m238.2 87.69l-104 125.43a8 8 0 0 1-12.3 0L17.8 87.69a7.79 7.79 0 0 1 1.31-11.21a180.75 180.75 0 0 1 217.78 0a7.79 7.79 0 0 1 1.31 11.21" opacity=".2"/><path d="M53.92 34.62a8 8 0 1 0-11.84 10.76l4.55 5A188 188 0 0 0 14.28 70.1a15.93 15.93 0 0 0-6.17 10.81a15.65 15.65 0 0 0 3.54 11.89l104 125.43A15.93 15.93 0 0 0 128 224a15.93 15.93 0 0 0 12.31-5.77l28.1-33.88l33.67 37a8 8 0 1 0 11.84-10.76ZM128 208L24.09 82.74a171.5 171.5 0 0 1 33.82-19.95l99.63 109.6ZM244.35 92.8l-49.42 59.58a8 8 0 0 1-12.32-10.21l49.3-59.43A170.76 170.76 0 0 0 128 48a175 175 0 0 0-32.39 3a8 8 0 1 1-3-15.72A190.6 190.6 0 0 1 128 32a186.67 186.67 0 0 1 113.72 38.1a15.93 15.93 0 0 1 6.17 10.81a15.65 15.65 0 0 1-3.54 11.89"/></g></svg></span>
      </span>
      <span class="of__msg">
        <span class="of__m of__m--on">接続中</span>
        <span class="of__m of__m--off">接続が切れました</span>
        <span class="of__m of__m--back">再接続しました</span>
      </span>
      <span class="of__side">
        <span class="of__pill of__pill--wait">
          <span class="of__num" aria-hidden="true">
            <span class="of__n" data-sec="3">3</span>
            <span class="of__n" data-sec="2">2</span>
            <span class="of__n" data-sec="1">1</span>
          </span>
          <span class="of__unit">秒後に再接続</span>
        </span>
        <span class="of__pill of__pill--ok">電波良好</span>
      </span>
    </div>

    <div class="of__track" aria-hidden="true">
      <span class="of__rail"></span>
      <span class="of__fill" id="of-fill"></span>
    </div>

    <button class="of__btn" type="button" id="of-btn">接続を切る</button>
  </section>
</main>
<script>
// 상태 띠는 사라지지 않는다 — 안의 문구와 색만 바뀐다. 진짜 연결 상태는 navigator.onLine 이 알려 준다.
var of = document.getElementById('of');
var ofBtn = document.getElementById('of-btn');
var ofFill = document.getElementById('of-fill');
var ofNums = [].slice.call(of.querySelectorAll('.of__n'));
var ofTimer = 0;
function ofSec(n) {
  ofNums.forEach(function (s) { s.classList.toggle('is-now', Number(s.dataset.sec) === n); });
  ofFill.style.transform = 'scaleX(' + (n / 3) + ')';
}
function ofState(s) {
  of.classList.remove('is-demo');
  of.classList.toggle('is-off', s === 'off');
  of.classList.toggle('is-back', s === 'back');
  ofBtn.textContent = s === 'off' ? '接続を戻す' : '接続を切る';
}
function ofDrop() {
  ofState('off');
  var n = 3;
  ofSec(n);
  clearInterval(ofTimer);
  ofTimer = setInterval(function () {
    n -= 1;
    if (n > 0) { ofSec(n); return; }
    clearInterval(ofTimer);
    ofSec(0);
    ofState('back');
  }, 1000);
}
function ofUp() {
  clearInterval(ofTimer);
  ofSec(0);
  ofState('back');
}
ofBtn.addEventListener('click', function () {
  if (of.classList.contains('is-off')) ofUp(); else ofDrop();
});
if (!navigator.onLine) ofDrop();
window.addEventListener('offline', ofDrop);
window.addEventListener('online', ofUp);
</script>
</body>
</html>
