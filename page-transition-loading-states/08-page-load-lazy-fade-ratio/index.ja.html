<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazy fade with ratio box — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="lz is-demo" id="lz" aria-label="写真が後から届く一覧">
    <header class="lz__head">
      <p class="lz__title">写真3枚</p>
      <button class="lz__again" type="button" id="lz-again">最初から取得</button>
    </header>

    <ul class="lz__list">
      <li class="lz__row">
        <div class="lz__box">
          <span class="lz__ph" aria-hidden="true"></span>
          <img class="lz__img" width="160" height="90" loading="lazy" decoding="async" alt="日が沈む稜線"
               src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20160%2090'%3E%3Cdefs%3E%3ClinearGradient%20id='g1'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%232f6df6'/%3E%3Cstop%20offset='1'%20stop-color='%236ec8ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='160'%20height='90'%20fill='url%28%23g1%29'/%3E%3Ccircle%20cx='116'%20cy='28'%20r='14'%20fill='%23fff7e6'/%3E%3Cpath%20d='M0%2072%2040%2044%2074%2066%20112%2036%20160%2060%20160%2090%200%2090Z'%20fill='%2317141a'%20opacity='.38'/%3E%3C/svg%3E">
        </div>
        <div class="lz__text">
          <p class="lz__name">日が沈む稜線</p>
          <p class="lz__meta">1920 × 1080</p>
        </div>
      </li>
      <li class="lz__row">
        <div class="lz__box">
          <span class="lz__ph" aria-hidden="true"></span>
          <img class="lz__img" width="160" height="90" loading="lazy" decoding="async" alt="重ねた色の帯"
               src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20160%2090'%3E%3Cdefs%3E%3ClinearGradient%20id='g2'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%234cd4a6'/%3E%3Cstop%20offset='1'%20stop-color='%23b9a0ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='160'%20height='90'%20fill='url%28%23g2%29'/%3E%3Crect%20x='18'%20y='22'%20width='124'%20height='12'%20rx='6'%20fill='%23fff7e6'%20opacity='.92'/%3E%3Crect%20x='18'%20y='42'%20width='88'%20height='12'%20rx='6'%20fill='%2317141a'%20opacity='.32'/%3E%3Crect%20x='18'%20y='62'%20width='104'%20height='12'%20rx='6'%20fill='%23fff7e6'%20opacity='.62'/%3E%3C/svg%3E">
        </div>
        <div class="lz__text">
          <p class="lz__name">重ねた色の帯</p>
          <p class="lz__meta">1600 × 900</p>
        </div>
      </li>
      <li class="lz__row">
        <div class="lz__box">
          <span class="lz__ph" aria-hidden="true"></span>
          <img class="lz__img" width="160" height="90" loading="lazy" decoding="async" alt="浮かぶ三つの丸"
               src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20160%2090'%3E%3Cdefs%3E%3ClinearGradient%20id='g3'%20x1='0'%20y1='1'%20x2='1'%20y2='0'%3E%3Cstop%20offset='0'%20stop-color='%23ff9ebb'/%3E%3Cstop%20offset='1'%20stop-color='%23ff4d1f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='160'%20height='90'%20fill='url%28%23g3%29'/%3E%3Ccircle%20cx='44'%20cy='54'%20r='22'%20fill='%23fff7e6'%20opacity='.9'/%3E%3Ccircle%20cx='92'%20cy='36'%20r='14'%20fill='%2317141a'%20opacity='.3'/%3E%3Ccircle%20cx='124'%20cy='62'%20r='18'%20fill='%23fff7e6'%20opacity='.55'/%3E%3C/svg%3E">
        </div>
        <div class="lz__text">
          <p class="lz__name">浮かぶ三つの丸</p>
          <p class="lz__meta">1280 × 720</p>
        </div>
      </li>
    </ul>
  </section>
</main>
<script>
// 비율 상자는 늘 같은 자리를 차지하므로, 그림을 다시 받아도 아래 글이 밀리지 않는다.
var lz = document.getElementById('lz');
var lzAgain = document.getElementById('lz-again');
lzAgain.addEventListener('click', function () {
  lz.classList.remove('is-demo');
  lz.classList.add('is-waiting');
  // 다음 프레임에 클래스를 떼면 그때부터 opacity 트랜지션이 걸린다
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { lz.classList.remove('is-waiting'); });
  });
});
</script>
</body>
</html>
