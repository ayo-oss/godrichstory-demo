<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route progress bar — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="rp is-demo" id="rp" aria-label="화면 이동 진행 표시 미리보기">
    <div class="rp__bar">
      <span class="rp__fill" id="rp-fill" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="다음 화면 준비 진행률"></span>
    </div>
    <nav class="rp__tabs" aria-label="화면 이동">
      <button class="rp__tab is-current" type="button" aria-current="page">
        <span class="rp__pill" aria-hidden="true"></span><span class="rp__label">홈</span>
      </button>
      <button class="rp__tab" type="button">
        <span class="rp__pill" aria-hidden="true"></span><span class="rp__label">글 목록</span>
      </button>
      <button class="rp__tab" type="button">
        <span class="rp__pill" aria-hidden="true"></span><span class="rp__label">소개</span>
      </button>
    </nav>
    <div class="rp__view" id="rp-view" aria-busy="false">
      <p class="rp__head" id="rp-head">홈</p>
      <p class="rp__wait">다음 화면 준비 중</p>
      <p class="rp__text">지금 화면은 그대로 두고 다음 화면만 받아 옵니다.</p>
    </div>
  </section>
</main>
<script>
// 가짜 fetch 진행: 12 → 38 → 66 → 88 → 100. 그때마다 aria-valuenow 를 실제로 갱신한다.
var rp = document.getElementById('rp');
var rpFill = document.getElementById('rp-fill');
var rpView = document.getElementById('rp-view');
var rpHead = document.getElementById('rp-head');
var rpTabs = rp.querySelectorAll('.rp__tab');
var rpSteps = [12, 38, 66, 88, 100];
var rpTimer = 0;
function rpSet(v) {
  rpFill.style.transform = 'scaleX(' + v / 100 + ')';
  rpFill.setAttribute('aria-valuenow', String(v));
}
function rpGo(btn) {
  rp.classList.remove('is-demo');
  rp.classList.remove('is-done');
  clearInterval(rpTimer);
  for (var i = 0; i < rpTabs.length; i++) {
    var on = rpTabs[i] === btn;
    rpTabs[i].classList.toggle('is-current', on);
    if (on) rpTabs[i].setAttribute('aria-current', 'page');
    else rpTabs[i].removeAttribute('aria-current');
  }
  rpView.setAttribute('aria-busy', 'true');
  rpSet(0);
  var k = 0;
  rpTimer = setInterval(function () {
    rpSet(rpSteps[k]);
    k += 1;
    if (k < rpSteps.length) return;
    clearInterval(rpTimer);
    rpHead.textContent = btn.querySelector('.rp__label').textContent;
    rpView.setAttribute('aria-busy', 'false');
    // 완료 뒤 페이드는 실제 클릭 경로에서만 — 격자 루프는 재현하지 않는다
    rp.classList.add('is-done');
  }, 240);
}
for (var t = 0; t < rpTabs.length; t++) {
  rpTabs[t].addEventListener('click', function (e) { rpGo(e.currentTarget); });
}
</script>
</body>
</html>
