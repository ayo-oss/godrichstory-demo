<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo pulse splash — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="sp is-demo" id="sp" aria-label="初回起動のスプラッシュ">
    <div class="sp__mark" aria-hidden="true">
      <span class="sp__disc"></span>
      <span class="sp__box"></span>
    </div>
    <p class="sp__dots" aria-hidden="true">
      <span class="sp__dot"></span><span class="sp__dot"></span><span class="sp__dot"></span>
    </p>
    <p class="sp__msg" id="sp-msg" aria-live="polite">最初の画面を準備しています</p>
    <button class="sp__enter" type="button" id="sp-enter">待たずに入る</button>
  </section>
</main>
<script>
// 스플래시: 준비가 끝나는 순간만 사람이 만든다. 루프는 마크의 맥박과 점 셋만 보여 준다.
var sp = document.getElementById('sp');
var spMsg = document.getElementById('sp-msg');
var spEnter = document.getElementById('sp-enter');
spEnter.addEventListener('click', function () {
  sp.classList.remove('is-demo');
  sp.classList.add('is-ready');
  spMsg.textContent = '準備ができました';
  spEnter.disabled = true;
});
</script>
</body>
</html>
