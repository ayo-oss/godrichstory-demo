<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite footer loader — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="inf is-demo" id="inf" aria-label="Infinite scroll list">
    <div class="inf__box" id="inf-box" tabindex="0" aria-label="Scrollable list">
      <ol class="inf__list" id="inf-list">
        <li class="inf__card"><span class="inf__no">1</span><span class="inf__t">Today's log</span></li>
        <li class="inf__card"><span class="inf__no">2</span><span class="inf__t">A short note</span></li>
        <li class="inf__card"><span class="inf__no">3</span><span class="inf__t">Weekend plan</span></li>
        <li class="inf__card"><span class="inf__no">4</span><span class="inf__t">The book I left</span></li>
        <li class="inf__card"><span class="inf__no">5</span><span class="inf__t">Saved links</span></li>
        <li class="inf__card"><span class="inf__no">6</span><span class="inf__t">Photo cleanup</span></li>
      </ol>
      <div class="inf__loader" id="inf-loader">
        <span class="inf__pulse" aria-hidden="true"></span>
        <span class="inf__loader-t">Fetching the next page</span>
      </div>
    </div>
    <p class="inf__live" id="inf-live" aria-live="polite">Showing 6 cards</p>
  </section>
</main>
<script>
// 바닥 로더가 스크롤로 화면에 닿으면 IntersectionObserver 가 잡아 카드 3장을 붙인다.
// 미리보기(.is-demo)에서는 시계가 CSS 라 관찰을 걸지 않는다 — 사람이 손을 대는 순간 시작한다.
var inf = document.getElementById('inf');
var infBox = document.getElementById('inf-box');
var infList = document.getElementById('inf-list');
var infLoader = document.getElementById('inf-loader');
var infLive = document.getElementById('inf-live');
var infN = infList.children.length;
var infIo = null;
function infAdd() {
  for (var k = 0; k < 3; k++) {
    infN++;
    var li = document.createElement('li');
    li.className = 'inf__card inf__card--in';
    li.style.animationDelay = (k * 90) + 'ms';
    li.innerHTML = '<span class="inf__no">' + infN + '</span><span class="inf__t">Just arrived</span>';
    infList.appendChild(li);
  }
  infLive.textContent = '3 more cards arrived';
}
function infWake() {
  if (infIo) return;
  inf.classList.remove('is-demo');
  infIo = new IntersectionObserver(function (es) {
    if (es[0] && es[0].isIntersecting) infAdd();
  }, { root: infBox, threshold: 0.9 });
  infIo.observe(infLoader);
}
['wheel', 'pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
  infBox.addEventListener(ev, infWake);
});
// 미리보기에서는 바닥(로더가 있는 쪽)부터 보여 준다
if (inf.classList.contains('is-demo') && infBox.scrollHeight > infBox.clientHeight) {
  infBox.scrollTop = infBox.scrollHeight;
}
</script>
</body>
</html>
