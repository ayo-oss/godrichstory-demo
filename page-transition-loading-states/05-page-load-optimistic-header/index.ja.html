<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimistic header — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="oh is-demo" id="oh" data-tab="1" aria-label="楽観的な画面移動">
    <h2 class="oh__title">
      <span class="oh__t oh__t--1">今週のまとめ</span>
      <span class="oh__t oh__t--2">最近の動き</span>
      <span class="oh__t oh__t--3">通知の設定</span>
    </h2>
    <div class="oh__tabs" role="tablist" id="oh-tabs" aria-label="画面を選ぶ">
      <button class="oh__tab oh__tab--1" type="button" role="tab" id="oh-tab-1" aria-controls="oh-body" aria-selected="true">
        <span class="oh__pill" aria-hidden="true"></span><span class="oh__lab">まとめ</span>
      </button>
      <button class="oh__tab oh__tab--2" type="button" role="tab" id="oh-tab-2" aria-controls="oh-body" aria-selected="false">
        <span class="oh__pill" aria-hidden="true"></span><span class="oh__lab">動き</span>
      </button>
      <button class="oh__tab oh__tab--3" type="button" role="tab" id="oh-tab-3" aria-controls="oh-body" aria-selected="false">
        <span class="oh__pill" aria-hidden="true"></span><span class="oh__lab">設定</span>
      </button>
    </div>
    <div class="oh__body" id="oh-body" role="tabpanel" aria-labelledby="oh-tab-1" aria-busy="false">
      <div class="oh__panel oh__panel--1">
        <p class="oh__lead">訪問 1,284人</p>
        <p class="oh__sub">先週より12%増えました</p>
      </div>
      <div class="oh__panel oh__panel--2">
        <p class="oh__lead">新しいコメント7件</p>
        <p class="oh__sub">まだ返事していない投稿が2件</p>
      </div>
      <div class="oh__panel oh__panel--3">
        <p class="oh__lead">通知オン</p>
        <p class="oh__sub">週間まとめメールを受信中</p>
      </div>
      <div class="oh__sk" aria-hidden="true">
        <span class="oh__sk-bar"><span class="oh__shine"></span></span>
        <span class="oh__sk-bar"><span class="oh__shine"></span></span>
        <span class="oh__sk-bar"><span class="oh__shine"></span></span>
      </div>
    </div>
  </section>
</main>
<script>
// 낙관적 이동: 제목과 탭 표시는 누른 즉시 바뀌고, 본문만 aria-busy 를 켠 채 뒤따라온다.
var oh = document.getElementById('oh');
var ohBody = document.getElementById('oh-body');
var ohTabs = oh.querySelectorAll('.oh__tab');
var ohTimer = 0;
function ohGo(i) {
  oh.classList.remove('is-demo');
  oh.setAttribute('data-tab', String(i));
  oh.classList.add('is-loading');
  ohBody.setAttribute('aria-busy', 'true');
  ohBody.setAttribute('aria-labelledby', 'oh-tab-' + i);
  for (var k = 0; k < ohTabs.length; k++) {
    ohTabs[k].setAttribute('aria-selected', k === i - 1 ? 'true' : 'false');
  }
  clearTimeout(ohTimer);
  ohTimer = setTimeout(function () {
    oh.classList.remove('is-loading');
    ohBody.setAttribute('aria-busy', 'false');
  }, 600);
}
for (var i = 0; i < ohTabs.length; i++) {
  (function (n) {
    ohTabs[n].addEventListener('click', function () { ohGo(n + 1); });
  })(i);
}
oh.addEventListener('keydown', function (e) {
  var cur = Number(oh.getAttribute('data-tab'));
  var next = e.key === 'ArrowRight' ? cur % 3 : (e.key === 'ArrowLeft' ? (cur + 1) % 3 : -1);
  if (next < 0) return;
  e.preventDefault();
  ohGo(next + 1);
  ohTabs[next].focus({ preventScroll: true });
});
</script>
</body>
</html>
