<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outline fill cards — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="of is-demo" id="of" aria-label="List fill-in preview">
    <header class="of__bar">
      <p class="of__title">Today's picks</p>
      <button class="of__again" type="button" id="of-again">Reload</button>
    </header>
    <ul class="of__list" id="of-list" aria-busy="false">
      <li class="of__slot">
        <span class="of__ghost" aria-hidden="true"></span>
        <article class="of__card"><span class="of__no">01</span><span class="of__name">A weekend walking route</span></article>
      </li>
      <li class="of__slot">
        <span class="of__ghost" aria-hidden="true"></span>
        <article class="of__card"><span class="of__no">02</span><span class="of__name">Ten minute dinners</span></article>
      </li>
      <li class="of__slot">
        <span class="of__ghost" aria-hidden="true"></span>
        <article class="of__card"><span class="of__no">03</span><span class="of__name">Desk tidying tools</span></article>
      </li>
    </ul>
  </section>
</main>
<script>
// 빈 칸은 늘 자리에 있고, 카드만 한 칸씩 늦게 들어찬다. 다 차면 aria-busy 를 false 로 내린다.
var of = document.getElementById('of');
var ofList = document.getElementById('of-list');
var ofAgain = document.getElementById('of-again');
var ofSlots = ofList.querySelectorAll('.of__slot');
var ofTimers = [];
function ofReload() {
  of.classList.remove('is-demo');
  for (var i = 0; i < ofTimers.length; i++) clearTimeout(ofTimers[i]);
  ofTimers = [];
  ofList.classList.add('is-loading');
  ofList.setAttribute('aria-busy', 'true');
  for (var s = 0; s < ofSlots.length; s++) ofSlots[s].classList.remove('is-in');
  ofSlots.forEach(function (slot, k) {
    ofTimers.push(setTimeout(function () {
      slot.classList.add('is-in');
      if (k !== ofSlots.length - 1) return;
      ofList.setAttribute('aria-busy', 'false');
      ofList.classList.remove('is-loading');
    }, 240 * (k + 1)));
  });
}
ofAgain.addEventListener('click', ofReload);
</script>
</body>
</html>
