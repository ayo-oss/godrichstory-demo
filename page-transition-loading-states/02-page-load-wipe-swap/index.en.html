<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wipe swap transition — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ws is-demo" id="ws" aria-label="Wipe swap transition preview">
    <div class="ws__screen">
      <div class="ws__pages" id="ws-pages" aria-busy="false">
        <article class="ws__page ws__page--a">
          <p class="ws__eyebrow">Work</p>
          <p class="ws__head">Twelve photographs</p>
          <p class="ws__text">The band comes in from the left and covers the screen.</p>
        </article>
        <article class="ws__page ws__page--b">
          <p class="ws__eyebrow">Notes</p>
          <p class="ws__head">How it was made</p>
          <p class="ws__text">The content swaps only while it is covered.</p>
        </article>
      </div>
      <span class="ws__band" id="ws-band" aria-hidden="true"></span>
    </div>
    <button class="ws__go" type="button" id="ws-go">Next screen</button>
  </section>
</main>
<script>
// 띠가 화면을 완전히 덮은 순간(애니메이션 한가운데)에만 본문을 갈아 끼운다.
var ws = document.getElementById('ws');
var wsBand = document.getElementById('ws-band');
var wsPages = document.getElementById('ws-pages');
var wsGo = document.getElementById('ws-go');
var wsBusy = false;
function wsSweep() {
  ws.classList.remove('is-demo');
  if (wsBusy) return;
  wsBusy = true;
  wsPages.setAttribute('aria-busy', 'true');
  wsBand.classList.remove('is-run');
  void wsBand.offsetWidth;
  wsBand.classList.add('is-run');
  setTimeout(function () { wsPages.classList.toggle('is-b'); }, 360);
  setTimeout(function () {
    wsBand.classList.remove('is-run');
    wsPages.setAttribute('aria-busy', 'false');
    wsBusy = false;
  }, 740);
}
wsGo.addEventListener('click', wsSweep);
</script>
</body>
</html>
