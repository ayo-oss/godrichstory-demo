<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빗물 웅덩이 — 착수 충격파 병합 장면 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cd is-demo" id="cdRoot">
  <p class="cd__hint">
    <span>The instant a raindrop hits the pond, a circular shockwave pushes the field outward and fades — the blob ripples, splits, and merges again</span>
  </p>
  <div class="cd__field" id="cdField" role="application" aria-label="Rain-Pond Ripple test panel" tabindex="0">
    <canvas class="cd__cv" id="cdCv"></canvas>
  </div>
  <div class="cd__bar">
    <span class="cd__meta"><b class="cd__val" id="cdN">3</b>blobs · rain-pond ripple</span>
    <span class="cd__meta cd__meta--dim">canvas · getImageData · putImageData</span>
  </div>
</div>
</main>
<script>
// 빗물 웅덩이(09). 하단 웅덩이 = 스칼라 필드 위의 부력 물방울 3개(표면장력으로 밀어내며 모여 병합).
// 위에선 빗방울이 낙하하고, 물에 닿는 순간 원형 충격파(음의 가우시안 링, 살짝 지나면 양의 재융합 링)를
// 필드에 더했다 빼서 덩어리가 출렁이며 갈라진다. 필드는 저해상도 캔버스에 가산 원으로 적분하고
// getImageData 로 읽어 임계값 두 단으로 색을 매긴 뒤 putImageData 로 되돌려 화면 캔버스에 확대한다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var N_BLOB = 3;     // 웅덩이 덩어리 수 — 5 로 늘리면 잔물결 파편이 많아진다
  var RAIN_MS = 360;  // 빗방울 평균 간격(밀리초) — 줄이면 폭우
  var SHOCK = 0.9;    // 충격파 세기 — 크면 착수마다 덩어리가 크게 갈라진다
  // ────────────────────────────────────────────────────

  var root = document.getElementById('cdRoot');
  var field = document.getElementById('cdField');
  var cv = document.getElementById('cdCv');
  var ctx = cv.getContext('2d');
  var nOut = document.getElementById('cdN');
  nOut.textContent = String(N_BLOB);

  var css = getComputedStyle(root);
  function tok(name) { return css.getPropertyValue(name).trim(); }
  var C_DEEP = tok('--mb-deep');
  var C_MID = tok('--mb-mid');
  var C_TOP = tok('--mb-top');
  var C_DROP = tok('--mb-drop');
  var C_GLASS = tok('--mb-glass');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0;
  var LOWW = 0, LOWH = 0, SCALE = 4;
  var fieldCv = document.createElement('canvas');
  var fieldCtx = fieldCv.getContext('2d');
  var bandCv = document.createElement('canvas');
  var bandCtx = bandCv.getContext('2d');
  var raf = 0, t0 = -1;

  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x317A09);

  var blobs = [];
  var drops = [];
  var shocks = [];
  var nextDropAt = 0.1;

  function fit() {
    var r = field.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W); cv.height = Math.round(H);
    LOWW = Math.max(48, Math.round(W / SCALE));
    LOWH = Math.max(30, Math.round(H / SCALE));
    fieldCv.width = LOWW; fieldCv.height = LOWH;
    bandCv.width = LOWW; bandCv.height = LOWH;
    ctx.imageSmoothingEnabled = true;
  }

  function reset() {
    blobs = [];
    for (var i = 0; i < N_BLOB; i++) {
      blobs.push({
        x: (0.3 + 0.4 * i / Math.max(1, N_BLOB - 1) + (rand() - 0.5) * 0.1) * LOWW,
        y: LOWH * (0.74 + rand() * 0.1),
        vx: (rand() - 0.5) * 3, vy: (rand() - 0.5) * 1.2,
        r: LOWH * (0.26 + rand() * 0.06),
        ph: rand() * Math.PI * 2
      });
    }
    drops = [];
    shocks = [];
    nextDropAt = 0.1;
  }

  function spawnDrop(t) {
    drops.push({ x: (0.12 + rand() * 0.76) * LOWW, y: -6, vy: 60 + rand() * 40 });
  }

  // ── 시뮬레이션 ──
  function update(t, dt) {
    if (t >= nextDropAt) {
      spawnDrop(t);
      nextDropAt = t + (RAIN_MS / 1000) * (0.55 + rand() * 0.9);
    }
    // 빗방울 낙하 — 수면(웅덩이 상단 평균)에 닿으면 충격파 발생
    var surf = LOWH * 0.62;
    for (var i = drops.length - 1; i >= 0; i--) {
      var dp = drops[i];
      dp.y += dp.vy * dt;
      if (dp.y >= surf) {
        shocks.push({ x: dp.x, y: dp.y, born: t, life: 0.55, amp: SHOCK });
        drops.splice(i, 1);
      }
    }
    while (shocks.length && t - shocks[0].born > 1.2) shocks.shift();

    // 덩어리 — 표면장력(중심 당김) + 충격파 반발 + 감쇠
    var j, k;
    for (j = 0; j < blobs.length; j++) {
      var b = blobs[j];
      var hx = LOWW / 2, hy = LOWH * 0.8;
      b.vx += (hx - b.x) * 0.55 * dt;
      b.vy += (hy - b.y) * 0.55 * dt;
      b.vx += Math.sin(t * 0.8 + b.ph) * 1.1 * dt;
      for (k = 0; k < shocks.length; k++) {
        var sh = shocks[k];
        var u = (t - sh.born) / sh.life;
        if (u >= 1) continue;
        var dx = b.x - sh.x, dy = b.y - sh.y;
        var dist = Math.hypot(dx, dy) || 1;
        var ring = Math.sin(u * Math.PI) * sh.amp * Math.exp(-u * 1.6);
        var push = ring * 10 / (1 + dist * 0.16);
        b.vx += (dx / dist) * push * dt * 9;
        b.vy += (dy / dist) * push * dt * 9;
      }
      b.vx *= 0.985; b.vy *= 0.985;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.y = Math.min(b.y, LOWH * 0.92);
    }
  }

  // ── 필드 적분(가산 원) + 충격파 링 반영 ──
  function drawField(t) {
    fieldCtx.globalCompositeOperation = 'source-over';
    fieldCtx.fillStyle = '#000';
    fieldCtx.fillRect(0, 0, LOWW, LOWH);
    fieldCtx.globalCompositeOperation = 'lighter';
    var j, k;
    for (j = 0; j < blobs.length; j++) {
      var b = blobs[j];
      var wob = 1 + Math.sin(t * 1.6 + b.ph) * 0.045;
      var g = fieldCtx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * wob);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.5, 'rgba(255,255,255,0.42)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      fieldCtx.fillStyle = g;
      fieldCtx.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
    // 충격파 — 얇은 링(가우시안 테두리)을 필드에 더했다 빼고(위상 반전) 재융합 물결을 남긴다
    for (k = 0; k < shocks.length; k++) {
      var sh = shocks[k];
      var u = (t - sh.born) / sh.life;
      if (u >= 1) continue;
      var rr = 3 + u * LOWW * 0.42;
      var amp = Math.sin(u * Math.PI) * sh.amp;
      var ringW = 4.5;
      var g2 = fieldCtx.createRadialGradient(sh.x, sh.y, Math.max(0.1, rr - ringW), sh.x, sh.y, rr + ringW);
      var peak = Math.round(Math.max(0, Math.min(255, amp * 210)));
      var dip = Math.round(Math.max(0, Math.min(255, -amp * 160)));
      g2.addColorStop(0, 'rgba(' + dip + ',' + dip + ',' + dip + ',1)');
      g2.addColorStop(0.5, 'rgba(' + peak + ',' + peak + ',' + peak + ',1)');
      g2.addColorStop(1, 'rgba(0,0,0,1)');
      fieldCtx.fillStyle = g2;
      fieldCtx.fillRect(sh.x - rr - ringW, sh.y - rr - ringW, (rr + ringW) * 2, (rr + ringW) * 2);
    }
    fieldCtx.globalCompositeOperation = 'source-over';
  }

  // ── 임계값 색 매김 + putImageData ──
  var work = null;
  function classify() {
    var img = fieldCtx.getImageData(0, 0, LOWW, LOWH);
    var d = img.data;
    if (!work || work.width !== LOWW || work.height !== LOWH) {
      work = bandCtx.createImageData(LOWW, LOWH);
    }
    var wd = work.data;
    // 캔버스 색 파싱은 매 프레임 하지 않고 값 배열로 미리 계산한다 — 여기선 간단히 16진 파싱
    var deep = hexRGB(C_DEEP), mid = hexRGB(C_MID), top = hexRGB(C_TOP);
    var glass = hexRGB(C_GLASS);
    for (var y = 0; y < LOWH; y++) {
      for (var x = 0; x < LOWW; x++) {
        var idx = (y * LOWW + x) * 4;
        var v = d[idx] / 255;
        var r, g, b;
        if (v > 0.66) { r = top[0]; g = top[1]; b = top[2]; }
        else if (v > 0.3) { r = mid[0]; g = mid[1]; b = mid[2]; }
        else if (v > 0.14) { r = deep[0]; g = deep[1]; b = deep[2]; }
        else {
          // 물 밖 — 창가 배경(위쪽 유리빛 → 아래 어두움) 수직 그라디언트
          var k = y / LOWH;
          r = Math.round(glass[0] * (1 - k) + deep[0] * 0.55 * k);
          g = Math.round(glass[1] * (1 - k) + deep[1] * 0.55 * k);
          b = Math.round(glass[2] * (1 - k) + deep[2] * 0.55 * k);
        }
        wd[idx] = r; wd[idx + 1] = g; wd[idx + 2] = b; wd[idx + 3] = 255;
      }
    }
    bandCtx.putImageData(work, 0, 0);
  }

  function hexRGB(h) {
    var s = (h || '#000').replace('#', '');
    if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
    return [parseInt(s.slice(0, 2), 16) || 0, parseInt(s.slice(2, 4), 16) || 0, parseInt(s.slice(4, 6), 16) || 0];
  }

  function draw(t) {
    drawField(t);
    classify();
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(bandCv, 0, 0, LOWW, LOWH, 0, 0, W, H);
    // 낙하 중인 빗방울 — 짧은 세로 줄무늬
    ctx.strokeStyle = C_DROP;
    ctx.lineWidth = 1.6;
    ctx.globalAlpha = 0.9;
    for (var i = 0; i < drops.length; i++) {
      var dp = drops[i];
      ctx.beginPath();
      ctx.moveTo(dp.x * SCALE, dp.y * SCALE - 9);
      ctx.lineTo(dp.x * SCALE, dp.y * SCALE + 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function stillFrame() {
    reset();
    drops.push({ x: LOWW * 0.5, y: LOWH * 0.2, vy: 80 });
    shocks.push({ x: LOWW * 0.55, y: LOWH * 0.66, born: 0.1, life: 0.55, amp: SHOCK });
    draw(0.16);
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    var dt = Math.min(0.05, (now - (frame.prev || now)) / 1000);
    frame.prev = now;
    update(t, dt);
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    fit();
    reset();
    if (reduce) stillFrame();
  });

  fit();
  reset();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
