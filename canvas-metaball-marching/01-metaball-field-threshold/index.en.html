<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>필드 한 겹 — 스칼라 감쇠 임계값 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cd is-demo" id="cdRoot">
  <p class="cd__hint">
    <span>Add each ball's distance falloff (radius² ÷ distance²) into a grid to build a scalar field, then fill only the cells above threshold — a bridge grows between two balls as they draw close</span>
  </p>
  <div class="cd__field" id="cdField" role="application" aria-label="Field-Threshold Layer test panel" tabindex="0">
    <canvas class="cd__cv" id="cdCv"></canvas>
  </div>
  <div class="cd__bar">
    <span class="cd__meta"><b class="cd__val" id="cdN">5</b>balls · falloff field threshold</span>
    <span class="cd__meta cd__meta--dim">canvas · getImageData · putImageData</span>
  </div>
</div>
</main>
<script>
// 필드 한 겹(01). 오프스크린 캔버스에 ImageData 를 직접 채워(putImageData) 부드러운 radial 스프라이트를
// 한 장 굽고, 그 스프라이트의 밝기를 getImageData 로 읽어 "거리 → 감쇠" 룩업 테이블로 쓴다.
// 매 프레임 볼마다 격자 칸에 그 감쇠값(반지름² / 거리² 꼴, 스프라이트 그대로 근사)을 더해
// 스칼라 필드를 합산하고, 합이 임계값을 넘는 칸만 색을 채운다 — 마칭 스퀘어 경계 추출 없이
// 칸 단위(복셀식) 채움이라 경계가 계단 모양이다(02 가 이 경계를 매끈하게 뽑는다).
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var N_BALL = 5;      // balls 개수 — 3 은 성긴 장면, 7 은 붐비는 장면
  var THRESH = 0.92;   // 필드 임계값 — 낮추면 다리가 더 굵고 자주 이어진다
  var CELL = 6;         // 격자 셀 픽셀 크기 — 작을수록 매끈하지만 계산량 증가
  // ────────────────────────────────────────────────────

  var root = document.getElementById('cdRoot');
  var field = document.getElementById('cdField');
  var cv = document.getElementById('cdCv');
  var ctx = cv.getContext('2d');
  var nOut = document.getElementById('cdN');
  nOut.textContent = String(N_BALL);

  var css = getComputedStyle(root);
  function tok(name) { return css.getPropertyValue(name).trim(); }
  var COL = [tok('--ft-mint'), tok('--ft-sky'), tok('--ft-lilac'), tok('--ft-pink')];
  var C_CREAM = tok('--ft-cream');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, COLS = 0, ROWS = 0;
  var raf = 0, t0 = -1;

  // 스프라이트 캔버스 — putImageData 로 부드러운 radial 감쇠를 픽셀 단위로 직접 굽는다
  var SPR_R = 64;
  var sprCv = document.createElement('canvas');
  sprCv.width = SPR_R * 2; sprCv.height = SPR_R * 2;
  var sprCtx = sprCv.getContext('2d');
  var lut = new Float32Array(SPR_R + 1); // 거리 → 감쇠(0..1) 룩업

  function bakeSprite() {
    var img = sprCtx.createImageData(SPR_R * 2, SPR_R * 2);
    var d = img.data;
    for (var y = 0; y < SPR_R * 2; y++) {
      for (var x = 0; x < SPR_R * 2; x++) {
        var dx = x - SPR_R, dy = y - SPR_R;
        var dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
        // r² / d² 감쇠(메타볼 표준식) — 스프라이트 반경에서 정확히 1(=임계값 경계)
        var v = Math.min(1, (SPR_R * SPR_R) / (dist * dist));
        var idx = (y * SPR_R * 2 + x) * 4;
        var a = Math.round(v * 255);
        d[idx] = 255; d[idx + 1] = 255; d[idx + 2] = 255; d[idx + 3] = a;
      }
    }
    sprCtx.putImageData(img, 0, 0);
    // 룩업 테이블을 구운 스프라이트에서 getImageData 로 다시 읽는다 — 실사용값과 일치
    var check = sprCtx.getImageData(SPR_R, 0, SPR_R, 1).data;
    for (var i = 0; i < SPR_R; i++) lut[i] = check[i * 4 + 3] / 255;
  }

  // 시드 고정 PRNG — 미리보기가 항상 같은 balls 궤도로 흐른다
  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x317A01);

  var balls = [];
  function buildBalls() {
    balls = [];
    for (var i = 0; i < N_BALL; i++) {
      balls.push({
        fx: 0.32 + rand() * 0.5, fy: 0.26 + rand() * 0.46,
        ph: rand() * Math.PI * 2, ax: 0.3 + rand() * 0.22, ay: 0.28 + rand() * 0.22,
        cx: 0.5, cy: 0.5, rad: 52 + rand() * 26
      });
    }
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W); cv.height = Math.round(H);
    COLS = Math.max(24, Math.round(W / CELL));
    ROWS = Math.max(16, Math.round(H / CELL));
  }

  function ballPos(b, t) {
    return [
      (b.cx + Math.sin(t * b.fx + b.ph) * b.ax) * W,
      (b.cy + Math.cos(t * b.fy + b.ph * 1.4) * b.ay) * H
    ];
  }

  function fieldAt(px, py, t) {
    var sum = 0, closest = -1, closestD = 1e9;
    for (var i = 0; i < balls.length; i++) {
      var p = ballPos(balls[i], t);
      var dx = px - p[0], dy = py - p[1];
      var dist = Math.sqrt(dx * dx + dy * dy);
      // 감쇠 = 룩업 테이블(putImageData 로 구운 스프라이트에서 읽은 값)을 balls 반지름으로 스케일
      // 스프라이트 반경(64)에서 감쇠 1이므로 scaled = dist * 64 / rad 이 거리에서 정확히 경계
      var scaled = dist * (SPR_R / balls[i].rad);
      var v = scaled >= SPR_R ? 0 : lut[Math.min(SPR_R - 1, Math.round(scaled))];
      sum += v;
      if (dist < closestD) { closestD = dist; closest = i; }
    }
    return [sum, closest];
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#17141a';
    ctx.fillRect(0, 0, W, H);

    // 배경 잔광 드리프트 — 느린 안개(누적면적 확보, 077 기준 "화면이 살아 있음")
    var mist = ctx.createRadialGradient(
      W * (0.5 + Math.sin(t * 0.13) * 0.3), H * (0.5 + Math.cos(t * 0.11) * 0.3), 0,
      W * 0.5, H * 0.5, Math.max(W, H) * 0.75
    );
    mist.addColorStop(0, 'rgba(185,160,255,0.22)');
    mist.addColorStop(0.55, 'rgba(110,200,255,0.10)');
    mist.addColorStop(1, 'rgba(23,20,26,0)');
    ctx.fillStyle = mist;
    ctx.fillRect(0, 0, W, H);

    var cw = W / COLS, ch = H / ROWS;
    for (var gy = 0; gy < ROWS; gy++) {
      var py = (gy + 0.5) * ch;
      for (var gx = 0; gx < COLS; gx++) {
        var px = (gx + 0.5) * cw;
        var fc = fieldAt(px, py, t);
        if (fc[0] >= THRESH) {
          var over = Math.min(1, (fc[0] - THRESH) / THRESH);
          ctx.fillStyle = COL[fc[1] % COL.length];
          ctx.globalAlpha = 0.55 + over * 0.45;
          ctx.fillRect(gx * cw - 0.5, gy * ch - 0.5, cw + 1, ch + 1);
        }
      }
    }
    ctx.globalAlpha = 1;

    // balls 코어 — 크림 하이라이트 점(중심을 눈으로 짚을 수 있게)
    for (var i = 0; i < balls.length; i++) {
      var p = ballPos(balls[i], t);
      ctx.fillStyle = C_CREAM;
      ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.arc(p[0], p[1], 2.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function stillFrame() { draw(0.6); }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    fit();
    if (reduce) stillFrame();
  });

  bakeSprite();
  fit();
  buildBalls();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
