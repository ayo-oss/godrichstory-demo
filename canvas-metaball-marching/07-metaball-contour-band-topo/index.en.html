<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>등고 띠 — 다중 임계값 위상 지도 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cd is-demo" id="cdRoot">
  <p class="cd__hint">
    <span>Track five thresholds at once instead of one, filling each band with a different pastel — the same scalar field becomes a topo scene like a temperature or pressure map</span>
  </p>
  <div class="cd__field" id="cdField" role="application" aria-label="Contour-Band Topo Map test panel" tabindex="0">
    <canvas class="cd__cv" id="cdCv"></canvas>
  </div>
  <div class="cd__bar">
    <span class="cd__meta"><b class="cd__val" id="cdN">5</b>bands · contour topo map</span>
    <span class="cd__meta cd__meta--dim">canvas · getImageData · createLinearGradient</span>
  </div>
</div>
</main>
<script>
// 등고 띠(07). 스칼라 필드 = 이동하는 열원 5개(가우시안 낙하) + 지형 파동(사인 두 겹)의 합.
// 필드를 저해상도 오프스크린 캔버스에 가산 합성(globalCompositeOperation=lighter)으로 그린 뒤
// getImageData 로 읽어 임계값 5단으로 층을 나누고, 층마다 다른 파스텔을 저해상도 색 캔버스에 칠해
// 확대(drawImage, 이미지 스무딩)하면 등고선 대신 부드러운 등고 "띠"가 된다 — 실제 등고선(마칭 스퀘어
// 경계 폴리곤)이 아니라 필드를 직접 색칠하는 채워진 등고대 방식(기상도가 쓰는 방식)이다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var N_SRC = 5;      // 열원 개수 — 3 은 성긴 지도, 7 은 촘촘한 등고
  var BANDS = 5;       // 임계값 층 수
  var SPREAD = 0.46;   // 열원 낙하 반경 비율(필드 폭 대비) — 크면 띠가 화면을 넓게 덮는다
  // ────────────────────────────────────────────────────

  var root = document.getElementById('cdRoot');
  var field = document.getElementById('cdField');
  var cv = document.getElementById('cdCv');
  var ctx = cv.getContext('2d');
  var nOut = document.getElementById('cdN');
  nOut.textContent = String(BANDS);

  var css = getComputedStyle(root);
  function tok(name) { return css.getPropertyValue(name).trim(); }
  var BAND_COL = [tok('--mb-band-1'), tok('--mb-band-2'), tok('--mb-band-3'), tok('--mb-band-4'), tok('--mb-band-5')];
  var C_INK = tok('--mb-ink');
  var C_LINE = tok('--mb-line');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0;
  var LOWW = 0, LOWH = 0, SCALE = 5;
  var fieldCv = document.createElement('canvas');
  var fieldCtx = fieldCv.getContext('2d');
  var bandCv = document.createElement('canvas');
  var bandCtx = bandCv.getContext('2d');
  var raf = 0, t0 = -1;

  // 시드 고정 PRNG — 미리보기가 항상 같은 열원 경로로 흐른다
  function makeRand(seed) {
    var st = seed >>> 0;
    return function () {
      st = (st + 0x6D2B79F5) >>> 0;
      var t = st;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = makeRand(0x317A07);

  var sources = [];
  function buildSources() {
    sources = [];
    for (var i = 0; i < N_SRC; i++) {
      sources.push({
        fx: 0.35 + rand() * 1.6, fy: 0.28 + rand() * 1.4,
        ph: rand() * Math.PI * 2, ax: 0.22 + rand() * 0.24, ay: 0.22 + rand() * 0.24,
        cx: rand(), cy: rand()
      });
    }
  }

  function fit() {
    var r = field.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W); cv.height = Math.round(H);
    LOWW = Math.max(48, Math.round(W / SCALE));
    LOWH = Math.max(30, Math.round(H / SCALE));
    fieldCv.width = LOWW; fieldCv.height = LOWH;
    bandCv.width = LOWW; bandCv.height = LOWH;
    ctx.imageSmoothingEnabled = true;
  }

  // 열원 위치 — 리사주 곡선으로 화면을 골고루 도는 궤도(누적면적 확보)
  function srcPos(s, t) {
    return [
      (s.cx + Math.sin(t * s.fx + s.ph) * s.ax) * LOWW,
      (s.cy + Math.cos(t * s.fy + s.ph * 1.3) * s.ay) * LOWH
    ];
  }

  function drawField(t) {
    fieldCtx.clearRect(0, 0, LOWW, LOWH);
    fieldCtx.globalCompositeOperation = 'source-over';
    fieldCtx.fillStyle = '#000';
    fieldCtx.fillRect(0, 0, LOWW, LOWH);
    fieldCtx.globalCompositeOperation = 'lighter';
    var rad = Math.max(LOWW, LOWH) * SPREAD;
    for (var i = 0; i < sources.length; i++) {
      var p = srcPos(sources[i], t);
      var g = fieldCtx.createRadialGradient(p[0], p[1], 0, p[0], p[1], rad);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.55, 'rgba(255,255,255,0.38)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      fieldCtx.fillStyle = g;
      fieldCtx.fillRect(0, 0, LOWW, LOWH);
    }
    fieldCtx.globalCompositeOperation = 'source-over';
  }

  // 지형 파동 — 열원과 무관하게 화면 전체를 항상 등고대로 채우는 배경 항(기상도의 "언제나 있는" 등고)
  function terrain(nx, ny, t) {
    var a = Math.sin(nx * 5.4 + t * 0.25) * Math.cos(ny * 4.1 - t * 0.19);
    var b = Math.sin((nx + ny) * 3.1 - t * 0.31);
    return (0.5 + 0.32 * a + 0.18 * b);
  }

  function classify(t) {
    var img = fieldCtx.getImageData(0, 0, LOWW, LOWH);
    var d = img.data;
    var thr = [];
    for (var k = 1; k <= BANDS; k++) thr.push(k / (BANDS + 1));
    for (var y = 0; y < LOWH; y++) {
      for (var x = 0; x < LOWW; x++) {
        var idx = (y * LOWW + x) * 4;
        var v = d[idx] / 255;                 // 열원 필드(0..1)
        var mix = v * 0.72 + terrain(x / LOWW, y / LOWH, t) * 0.28;
        var band = 0;
        for (var k2 = 0; k2 < thr.length; k2++) if (mix >= thr[k2]) band = k2 + 1;
        bandCtx.fillStyle = band === 0 ? C_INK : BAND_COL[band - 1];
        bandCtx.fillRect(x, y, 1, 1);
      }
    }
  }

  function draw(t) {
    drawField(t);
    classify(t);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(bandCv, 0, 0, LOWW, LOWH, 0, 0, W, H);

    // 대기 하이라이트 — 위쪽에서 은은하게 밝아지는 선형 그라디언트(지도 위 유리 반사감)
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, 'rgba(255,255,255,0.22)');
    sky.addColorStop(0.4, 'rgba(255,255,255,0.04)');
    sky.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // 등고 경계선 — 저해상도 색 경계를 살짝 도드라지게(격자 라인 몇 개)
    ctx.strokeStyle = C_LINE;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.14;
    for (var gy = 0; gy < 4; gy++) {
      var yy = (gy + 0.5) / 4 * H;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function stillFrame() { draw(0.4); }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    fit();
    if (reduce) stillFrame();
  });

  fit();
  buildSources();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
