<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotspot pins — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="hs is-demo" id="hs">
    <div class="hs__view" role="img" aria-label="책상 사진">
      <div class="hs__spot hs__spot--1">
        <button class="hs__pin" type="button" aria-expanded="false" aria-controls="hs-n1" aria-label="상판 설명"><svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M144 176a8 8 0 0 1-8 8a16 16 0 0 1-16-16v-40a8 8 0 0 1 0-16a16 16 0 0 1 16 16v40a8 8 0 0 1 8 8m88-48A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88m-92-32a12 12 0 1 0-12-12a12 12 0 0 0 12 12"/></g></svg></button>
        <span class="hs__note" id="hs-n1">떡갈나무 상판</span>
      </div>
      <div class="hs__spot hs__spot--2">
        <button class="hs__pin" type="button" aria-expanded="false" aria-controls="hs-n2" aria-label="손잡이 설명"><svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M144 176a8 8 0 0 1-8 8a16 16 0 0 1-16-16v-40a8 8 0 0 1 0-16a16 16 0 0 1 16 16v40a8 8 0 0 1 8 8m88-48A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88m-92-32a12 12 0 1 0-12-12a12 12 0 0 0 12 12"/></g></svg></button>
        <span class="hs__note" id="hs-n2">황동 손잡이</span>
      </div>
      <div class="hs__spot hs__spot--3">
        <button class="hs__pin" type="button" aria-expanded="false" aria-controls="hs-n3" aria-label="다리 설명"><svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M144 176a8 8 0 0 1-8 8a16 16 0 0 1-16-16v-40a8 8 0 0 1 0-16a16 16 0 0 1 16 16v40a8 8 0 0 1 8 8m88-48A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88m-92-32a12 12 0 1 0-12-12a12 12 0 0 0 12 12"/></g></svg></button>
        <span class="hs__note" id="hs-n3">무광 검정 다리</span>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 핀은 버튼이다. 열림 여부는 색이 아니라 aria-expanded 에 적힌다.
var hs = document.getElementById('hs');
var hsPins = [].slice.call(hs.querySelectorAll('.hs__pin'));
function hsOpen(pin) {
  hs.classList.remove('is-demo');           // 사람이 누르면 자동 루프를 멈춘다
  var was = pin.getAttribute('aria-expanded') === 'true';
  hsPins.forEach(function (p) { p.setAttribute('aria-expanded', 'false'); });
  pin.setAttribute('aria-expanded', was ? 'false' : 'true');
}
hsPins.forEach(function (pin) {
  pin.addEventListener('click', function () { hsOpen(pin); });
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  hs.classList.remove('is-demo');
  hsPins.forEach(function (p) { p.setAttribute('aria-expanded', 'false'); });
});
</script>
</body>
</html>
