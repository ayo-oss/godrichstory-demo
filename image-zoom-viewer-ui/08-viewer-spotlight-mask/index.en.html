<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotlight mask — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sl is-demo" id="sl">
    <div class="sl__view" id="sl-view" tabindex="0" role="img" aria-label="Group photo. Move the spotlight with the arrow keys">
      <div class="sl__dim"></div>
      <div class="sl__lit" id="sl-lit"></div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 선명한 겹을 원형 마스크로 오려 보여 준다. 원이 가는 자리만 밝아진다.
var sl = document.getElementById('sl');
var slView = document.getElementById('sl-view');
var slLit = document.getElementById('sl-lit');
var SL_R = 64;
var slX = 76, slY = 58;
function slPaint() {
  var box = slView.getBoundingClientRect();
  slX = Math.min(Math.max(slX, 0), box.width);
  slY = Math.min(Math.max(slY, 0), box.height);
  var pos = (slX - SL_R) + 'px ' + (slY - SL_R) + 'px';
  slLit.style.maskPosition = pos;
  slLit.style.webkitMaskPosition = pos;
}
slView.addEventListener('pointermove', function (e) {
  sl.classList.remove('is-demo');           // 사람이 손대면 자동 루프를 멈춘다
  var box = slView.getBoundingClientRect();
  slX = e.clientX - box.left;
  slY = e.clientY - box.top;
  slPaint();
});
slView.addEventListener('keydown', function (e) {
  var step = { ArrowLeft: [-20, 0], ArrowRight: [20, 0], ArrowUp: [0, -20], ArrowDown: [0, 20] }[e.key];
  if (!step) return;
  e.preventDefault();
  sl.classList.remove('is-demo');
  slX += step[0]; slY += step[1];
  slPaint();
});
</script>
</body>
</html>
