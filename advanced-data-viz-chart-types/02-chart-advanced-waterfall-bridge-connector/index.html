<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>막대 하나가 끝나는 높이에서 다음 막대가 시작하도록 누적값을 계산해, 값이 오르내리는 과정이 다리처럼 이어져 보인다 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wfb is-demo" id="wfbRoot">
  <canvas class="wfb__canvas" id="wfbCanvas" width="480" height="300"></canvas>
  <p class="wfb__caption">막대 하나가 끝나는 높이에서 다음 막대가 시작하도록 누적값을 계산해, 값이 오르내리는 과정이 다리처럼 이어져 보인다</p>
</div>
</main>
<script>
(function () {
  // 기법: 시작·종료 총합과 4개 증감값에서 누적값 배열을 계산해 막대 y 위치를 실제 값에 그대로
  // 매핑하고(하드코딩 좌표 없음), 막대마다 순서대로 지연을 두어 이전 누적값에서 다음 누적값
  // 쪽으로 높이가 자라도록 그린다. 다 자란 막대 사이는 점선으로 이어 다리처럼 보이게 한다.
  var root = document.getElementById('wfbRoot');
  var canvas = document.getElementById('wfbCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;

  function seedRand(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  var rand = seedRand(425021);
  var deltas = [18 + rand() * 22, -(10 + rand() * 20), 14 + rand() * 26, -(8 + rand() * 18)];
  var startVal = 40 + rand() * 10;
  var running = [startVal];
  for (var di = 0; di < deltas.length; di += 1) running.push(running[running.length - 1] + deltas[di]);
  var endVal = running[running.length - 1];

  var BAR_GROW_MS = 260;
  var BAR_STAGGER_MS = 210;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

  // bars[0]·bars[5] 는 총합, bars[1..4] 는 증감. base/top 은 애니메이션이 자라나는 기준점(anchor)이다.
  var bars = [
    { kind: 'total', value: startVal, anchor: 0, target: startVal },
    { kind: 'delta', value: deltas[0], anchor: running[0], target: running[1] },
    { kind: 'delta', value: deltas[1], anchor: running[1], target: running[2] },
    { kind: 'delta', value: deltas[2], anchor: running[2], target: running[3] },
    { kind: 'delta', value: deltas[3], anchor: running[3], target: running[4] },
    { kind: 'total', value: endVal, anchor: 0, target: endVal }
  ];

  var COLOR_TOTAL = '#0a4fe8';
  var COLOR_UP = '#2b9d74';
  var COLOR_DOWN = '#c2361a';

  var LOOP_MS = 2000;
  var T0 = 200;
  var cw = 480, ch = 300;

  function draw(nowMs) {
    var phase = reduce ? 1500 : (nowMs % LOOP_MS);
    var t = Math.max(0, phase - T0);
    ctx.clearRect(0, 0, cw, ch);

    var fadeAlpha = 1;
    if (phase > 1650) fadeAlpha = 1 - clamp((phase - 1650) / (1950 - 1650), 0, 1);

    var maxVal = startVal;
    var i;
    for (i = 0; i < running.length; i += 1) maxVal = Math.max(maxVal, running[i]);
    maxVal *= 1.12;

    var marginX = cw * 0.06;
    var chartTop = ch * 0.12;
    var chartBottom = ch * 0.8;
    var chartH = chartBottom - chartTop;
    var scaleY = chartH / maxVal;
    function yFor(v) { return chartBottom - v * scaleY; }

    var n = bars.length;
    var slotW = (cw - marginX * 2) / n;
    var barW = slotW * 0.58;

    ctx.globalAlpha = fadeAlpha;

    // 다 자란 막대 사이 점선 연결선
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(23,20,26,.55)';
    ctx.lineWidth = 1;
    for (i = 0; i < n - 1; i += 1) {
      var p1 = easeOutCubic(clamp((t - bars[i].delay) / BAR_GROW_MS, 0, 1));
      if (p1 < 1) continue;
      var x1 = marginX + slotW * i + (slotW - barW) / 2 + barW;
      var x2 = marginX + slotW * (i + 1) + (slotW - barW) / 2;
      var boundaryVal = i === 0 ? startVal : running[i];
      var y = yFor(boundaryVal);
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    for (i = 0; i < n; i += 1) {
      var b = bars[i];
      var delay = i * BAR_STAGGER_MS;
      var progress = easeOutCubic(clamp((t - delay) / BAR_GROW_MS, 0, 1));
      var currentVal = lerp(b.anchor, b.target, progress);
      var topVal = Math.max(b.anchor, currentVal);
      var botVal = Math.min(b.anchor, currentVal);
      var x = marginX + slotW * i + (slotW - barW) / 2;
      var y1 = yFor(topVal);
      var y2 = yFor(botVal);
      var color = b.kind === 'total' ? COLOR_TOTAL : (b.value >= 0 ? COLOR_UP : COLOR_DOWN);
      ctx.fillStyle = color;
      ctx.fillRect(x, y1, barW, Math.max(1, y2 - y1));
    }

    ctx.globalAlpha = 1;
  }

  // 막대별 지연을 미리 붙여 둔다(연결선 계산에서도 재사용)
  for (var bi = 0; bi < bars.length; bi += 1) bars[bi].delay = bi * BAR_STAGGER_MS;

  function fit() {
    var r = wrap.getBoundingClientRect();
    cw = Math.max(1, Math.round(r.width));
    ch = Math.max(1, Math.round(r.height));
    canvas.width = cw; canvas.height = ch;
    draw(elapsed);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var elapsed = 0;
  if (reduce) root.classList.remove('is-demo');

  var lastTs = null;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min(ts - lastTs, 48);
    lastTs = ts;
    if (!reduce) { elapsed += dt; draw(elapsed); }
    requestAnimationFrame(tick);
  }
  fit();
  window.addEventListener('resize', fit);
  draw(elapsed);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
