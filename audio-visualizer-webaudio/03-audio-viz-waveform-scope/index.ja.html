<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파형 오실로스코프 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-waveform" viewBox="0 0 256 256" fill="currentColor"><path d="M208 96v64H48V96Z" opacity=".2"/><path d="M56 96v64a8 8 0 0 1-16 0V96a8 8 0 0 1 16 0m32-72a8 8 0 0 0-8 8v192a8 8 0 0 0 16 0V32a8 8 0 0 0-8-8m40 32a8 8 0 0 0-8 8v128a8 8 0 0 0 16 0V64a8 8 0 0 0-8-8m40 32a8 8 0 0 0-8 8v64a8 8 0 0 0 16 0V96a8 8 0 0 0-8-8m40-16a8 8 0 0 0-8 8v96a8 8 0 0 0 16 0V72a8 8 0 0 0-8-8"/></symbol>
    <symbol id="ico-play" viewBox="0 0 256 256" fill="currentColor"><path d="M228.23 134.69L84.15 222.81A8 8 0 0 1 72 216.12V39.88a8 8 0 0 1 12.15-6.69l144.08 88.12a7.82 7.82 0 0 1 0 13.38" opacity=".2"/><path d="M232.4 114.49L88.32 26.35a16 16 0 0 0-16.2-.3A15.86 15.86 0 0 0 64 39.87v176.26A15.94 15.94 0 0 0 80 232a16.07 16.07 0 0 0 8.36-2.35l144.04-88.14a15.88 15.88 0 0 0 0-27.02M80 215.94V40l143.83 88Z"/></symbol>
    <symbol id="ico-pause" viewBox="0 0 256 256" fill="currentColor"><path d="M208 48v160a8 8 0 0 1-8 8h-40a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8h40a8 8 0 0 1 8 8M96 40H56a8 8 0 0 0-8 8v160a8 8 0 0 0 8 8h40a8 8 0 0 0 8-8V48a8 8 0 0 0-8-8" opacity=".2"/><path d="M200 32h-40a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176h-40V48h40zM96 32H56a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176H56V48h40z"/></symbol>
  </defs>
</svg>
<main class="stage">
<div class="ws is-demo" id="ws">
  <p class="ws__hint"><svg class="ws__ico" aria-hidden="true"><use href="#ico-waveform"/></svg><span>再生を押すと実際の音で動きます</span></p>
  <div class="ws__scope">
    <svg class="ws__svg" viewBox="0 0 360 96" preserveAspectRatio="none" aria-hidden="true">
      <!-- 바닥 파형: 미리 계산해 둔 정적 시퀀스. 실제 재생을 시작하면 JS 가 points 를 진짜 파형으로 매 프레임 바꾼다. -->
      <polyline class="ws__base" id="baseLine" points=""/>
      <!-- 흐르는 하이라이트: 같은 파형 위를 짧은 대시가 지나간다 — 미리보기 루프의 몸통. -->
      <polyline class="ws__flow" id="flowLine" points=""/>
    </svg>
  </div>
  <div class="ws__foot">
    <button class="ws__play" id="play" type="button" aria-pressed="false">
      <svg class="ws__ico ws__ico--play" aria-hidden="true"><use href="#ico-play"/></svg>
      <svg class="ws__ico ws__ico--pause" aria-hidden="true"><use href="#ico-pause"/></svg>
      <span id="playLabel">再生</span>
    </button>
    <p class="ws__level">
      <span class="ws__levelLabel">今の波形</span>
      <b class="ws__levelBox">
        <span class="ws__levelText" id="levelText" aria-live="polite">静か</span>
        <span class="ws__loop" aria-hidden="true"><i>静か</i><i>揺れ</i><i>大きな波</i></span>
      </b>
    </p>
  </div>
</div>
</main>
<script>
var root = document.getElementById('ws');
var baseLine = document.getElementById('baseLine');
var flowLine = document.getElementById('flowLine');
var playBtn = document.getElementById('play');
var playLabel = document.getElementById('playLabel');
var levelText = document.getElementById('levelText');
var W = 360, H = 96, MID = H / 2, N = 60;
// 바닥 파형 — 사인 두 개를 더한 정적 시퀀스. 난수가 아니라 식이라 같은 그림이 항상 재현된다.
var pts = [];
for (var i = 0; i < N; i++) {
  var x = (i / (N - 1)) * W;
  var y = MID - Math.sin(i / N * Math.PI * 6) * 18 - Math.sin(i / N * Math.PI * 2) * 8;
  pts.push(x.toFixed(1) + ',' + y.toFixed(1));
}
baseLine.setAttribute('points', pts.join(' '));
flowLine.setAttribute('points', pts.join(' '));
var ctx = null, analyser = null, wave = null, timer = 0, playing = false;
var STATE_NAMES = ['静か', '揺れ', '大きな波'];
function buildAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0;
  wave = new Uint8Array(analyser.fftSize);
  var out = ctx.createGain();
  out.gain.value = 0.06;
  out.connect(analyser);
  analyser.connect(ctx.destination);
  // 외부 음원 파일 없이 코드 진행을 직접 합성한다 — 네 박자마다 화음이 바뀐다.
  [196, 246.94, 293.66, 392].forEach(function (hz, n) {
    var osc = ctx.createOscillator();
    var amp = ctx.createGain();
    osc.type = n === 3 ? 'triangle' : 'sawtooth';
    osc.frequency.value = hz;
    amp.gain.value = 0;
    for (var beat = 0; beat < 64; beat++) {
      var at = ctx.currentTime + beat * 0.5;
      amp.gain.setValueAtTime(beat % 4 === n % 4 ? 0.9 : 0.25, at);
      amp.gain.exponentialRampToValueAtTime(0.02, at + 0.45);
    }
    osc.connect(amp); amp.connect(out); osc.start();
  });
}
function draw() {
  // 시간 도메인 — 주파수가 아니라 "지금 이 순간의 진폭" 을 그대로 읽는다.
  analyser.getByteTimeDomainData(wave);
  var step = Math.floor(wave.length / N);
  var line = [];
  var peak = 0;
  for (var i = 0; i < N; i++) {
    var v = (wave[i * step] - 128) / 128;
    peak = Math.max(peak, Math.abs(v));
    line.push(((i / (N - 1)) * W).toFixed(1) + ',' + (MID - v * (H / 2 - 6)).toFixed(1));
  }
  var p = line.join(' ');
  baseLine.setAttribute('points', p);
  flowLine.setAttribute('points', p);
  var st = peak < 0.18 ? 0 : peak < 0.5 ? 1 : 2;
  if (levelText.textContent !== STATE_NAMES[st]) { levelText.textContent = STATE_NAMES[st]; }
  timer = requestAnimationFrame(draw);
}
playBtn.addEventListener('click', function () {
  root.classList.remove('is-demo');
  if (!ctx) { buildAudio(); }
  playing = !playing;
  playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  playLabel.textContent = playing ? '停止' : '再生';
  // 자동재생 정책: AudioContext 는 사용자 제스처 뒤 resume() 해야 소리가 난다.
  if (playing) { ctx.resume(); timer = requestAnimationFrame(draw); }
  else { ctx.suspend(); cancelAnimationFrame(timer); }
});
</script>
</body>
</html>
