<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>저음에 튀는 글자 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-waveform" viewBox="0 0 256 256" fill="currentColor"><path d="M208 96v64H48V96Z" opacity=".2"/><path d="M56 96v64a8 8 0 0 1-16 0V96a8 8 0 0 1 16 0m32-72a8 8 0 0 0-8 8v192a8 8 0 0 0 16 0V32a8 8 0 0 0-8-8m40 32a8 8 0 0 0-8 8v128a8 8 0 0 0 16 0V64a8 8 0 0 0-8-8m40 32a8 8 0 0 0-8 8v64a8 8 0 0 0 16 0V96a8 8 0 0 0-8-8m40-16a8 8 0 0 0-8 8v96a8 8 0 0 0 16 0V72a8 8 0 0 0-8-8"/></symbol>
    <symbol id="ico-play" viewBox="0 0 256 256" fill="currentColor"><path d="M228.23 134.69L84.15 222.81A8 8 0 0 1 72 216.12V39.88a8 8 0 0 1 12.15-6.69l144.08 88.12a7.82 7.82 0 0 1 0 13.38" opacity=".2"/><path d="M232.4 114.49L88.32 26.35a16 16 0 0 0-16.2-.3A15.86 15.86 0 0 0 64 39.87v176.26A15.94 15.94 0 0 0 80 232a16.07 16.07 0 0 0 8.36-2.35l144.04-88.14a15.88 15.88 0 0 0 0-27.02M80 215.94V40l143.83 88Z"/></symbol>
    <symbol id="ico-pause" viewBox="0 0 256 256" fill="currentColor"><path d="M208 48v160a8 8 0 0 1-8 8h-40a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8h40a8 8 0 0 1 8 8M96 40H56a8 8 0 0 0-8 8v160a8 8 0 0 0 8 8h40a8 8 0 0 0 8-8V48a8 8 0 0 0-8-8" opacity=".2"/><path d="M200 32h-40a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176h-40V48h40zM96 32H56a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176H56V48h40z"/></symbol>
  </defs>
</svg>
<main class="stage">
<div class="tb is-demo" id="tb">
  <p class="tb__hint"><svg class="tb__ico" aria-hidden="true"><use href="#ico-waveform"/></svg><span>Press play and it moves with real sound</span></p>
  <h2 class="tb__title" aria-label="GODRICH">
    <!-- 글자마다 data-band 로 대역을 나눈다: G·R 는 Bass, O·I·H 는 Mid, D·C 는 Treble. 브랜드 낱말이라 로케일을 안 탄다. -->
    <b class="tb__l" data-band="0">G</b><b class="tb__l" data-band="1">O</b><b class="tb__l" data-band="2">D</b><b class="tb__l" data-band="0">R</b><b class="tb__l" data-band="1">I</b><b class="tb__l" data-band="2">C</b><b class="tb__l" data-band="1">H</b>
  </h2>
  <ul class="tb__legend" aria-hidden="true">
    <li class="tb__band tb__band--low">Bass</li>
    <li class="tb__band tb__band--mid">Mid</li>
    <li class="tb__band tb__band--high">Treble</li>
  </ul>
  <div class="tb__foot">
    <button class="tb__play" id="play" type="button" aria-pressed="false">
      <svg class="tb__ico tb__ico--play" aria-hidden="true"><use href="#ico-play"/></svg>
      <svg class="tb__ico tb__ico--pause" aria-hidden="true"><use href="#ico-pause"/></svg>
      <span id="playLabel">Play</span>
    </button>
    <p class="tb__level">
      <span class="tb__levelLabel">Loudest band</span>
      <b class="tb__levelBox">
        <span class="tb__levelText" id="levelText" aria-live="polite">Bass</span>
        <span class="tb__loop" aria-hidden="true"><i>Bass</i><i>Mid</i><i>Treble</i></span>
      </b>
    </p>
  </div>
</div>
</main>
<script>
var root = document.getElementById('tb');
var playBtn = document.getElementById('play');
var playLabel = document.getElementById('playLabel');
var levelText = document.getElementById('levelText');
var letters = Array.prototype.slice.call(document.querySelectorAll('.tb__l'));
var ctx = null, analyser = null, freq = null, timer = 0, playing = false;
var BAND_NAMES = ['Bass', 'Mid', 'Treble'];
function buildAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ctx.createAnalyser();
  analyser.fftSize = 64;
  analyser.smoothingTimeConstant = 0.6;
  freq = new Uint8Array(analyser.frequencyBinCount);
  var out = ctx.createGain();
  out.gain.value = 0.06;
  out.connect(analyser);
  analyser.connect(ctx.destination);
  // 외부 음원 파일 없이 코드 진행을 직접 합성한다 — 네 박자마다 화음이 바뀐다.
  [196, 246.94, 293.66, 392].forEach(function (hz, n) {
    var osc = ctx.createOscillator();
    var amp = ctx.createGain();
    osc.type = n === 3 ? 'triangle' : 'sawtooth';
    osc.frequency.value = hz;
    amp.gain.value = 0;
    for (var beat = 0; beat < 64; beat++) {
      var at = ctx.currentTime + beat * 0.5;
      amp.gain.setValueAtTime(beat % 4 === n % 4 ? 0.9 : 0.25, at);
      amp.gain.exponentialRampToValueAtTime(0.02, at + 0.45);
    }
    osc.connect(amp); amp.connect(out); osc.start();
  });
}
function draw() {
  analyser.getByteFrequencyData(freq);
  // 대역 세 개의 에너지를 0~1 로 만들어 글자의 --j 로 넣는다. 대역마다 다른 글자가 튄다.
  // 경계는 Bass 1~2번 빈, Mid 3~5번, Treble 6~10번 — 톱니파 고조파는 1/n 으로 줄어 성김문제로
  // 중·고음에는 표시 게인(1.5·2.2배)을 준다. 미터 눈금 보정이지 소리를 키우는 게 아니다.
  var GAIN = [1, 1.5, 2.2];
  var bands = [0, 0, 0];
  for (var k = 1; k <= 10; k++) {
    var b = k <= 2 ? 0 : k <= 5 ? 1 : 2;
    bands[b] += freq[k] / 255 / (b === 0 ? 2 : b === 1 ? 3 : 5);
  }
  for (var j = 0; j < 3; j++) { bands[j] = Math.min(1, bands[j] * GAIN[j]); }
  for (var i = 0; i < letters.length; i++) {
    var b = Number(letters[i].getAttribute('data-band'));
    letters[i].style.setProperty('--j', bands[b].toFixed(3));
  }
  var top = bands.indexOf(Math.max(bands[0], bands[1], bands[2]));
  if (levelText.textContent !== BAND_NAMES[top]) { levelText.textContent = BAND_NAMES[top]; }
  timer = requestAnimationFrame(draw);
}
playBtn.addEventListener('click', function () {
  root.classList.remove('is-demo');
  if (!ctx) { buildAudio(); }
  playing = !playing;
  playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  playLabel.textContent = playing ? 'Stop' : 'Play';
  // 자동재생 정책: AudioContext 는 사용자 제스처 뒤 resume() 해야 소리가 난다.
  if (playing) { ctx.resume(); timer = requestAnimationFrame(draw); }
  else { ctx.suspend(); cancelAnimationFrame(timer); }
});
</script>
</body>
</html>
