<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니 플레이어 파형 막대 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-waveform" viewBox="0 0 256 256" fill="currentColor"><path d="M208 96v64H48V96Z" opacity=".2"/><path d="M56 96v64a8 8 0 0 1-16 0V96a8 8 0 0 1 16 0m32-72a8 8 0 0 0-8 8v192a8 8 0 0 0 16 0V32a8 8 0 0 0-8-8m40 32a8 8 0 0 0-8 8v128a8 8 0 0 0 16 0V64a8 8 0 0 0-8-8m40 32a8 8 0 0 0-8 8v64a8 8 0 0 0 16 0V96a8 8 0 0 0-8-8m40-16a8 8 0 0 0-8 8v96a8 8 0 0 0 16 0V72a8 8 0 0 0-8-8"/></symbol>
    <symbol id="ico-play" viewBox="0 0 256 256" fill="currentColor"><path d="M228.23 134.69L84.15 222.81A8 8 0 0 1 72 216.12V39.88a8 8 0 0 1 12.15-6.69l144.08 88.12a7.82 7.82 0 0 1 0 13.38" opacity=".2"/><path d="M232.4 114.49L88.32 26.35a16 16 0 0 0-16.2-.3A15.86 15.86 0 0 0 64 39.87v176.26A15.94 15.94 0 0 0 80 232a16.07 16.07 0 0 0 8.36-2.35l144.04-88.14a15.88 15.88 0 0 0 0-27.02M80 215.94V40l143.83 88Z"/></symbol>
    <symbol id="ico-pause" viewBox="0 0 256 256" fill="currentColor"><path d="M208 48v160a8 8 0 0 1-8 8h-40a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8h40a8 8 0 0 1 8 8M96 40H56a8 8 0 0 0-8 8v160a8 8 0 0 0 8 8h40a8 8 0 0 0 8-8V48a8 8 0 0 0-8-8" opacity=".2"/><path d="M200 32h-40a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176h-40V48h40zM96 32H56a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176H56V48h40z"/></symbol>
  </defs>
</svg>
<main class="stage">
<div class="tp is-demo" id="tp">
  <p class="tp__hint"><svg class="tp__ico" aria-hidden="true"><use href="#ico-waveform"/></svg><span>The mountain shape comes from the real track</span></p>
  <div class="tp__card">
    <p class="tp__label">Preview track</p>
    <div class="tp__wave" id="wave" role="progressbar" aria-label="Playback position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="tp__row tp__row--base" id="baseBars" aria-hidden="true"></div>
      <div class="tp__lit" id="litWrap" aria-hidden="true"><div class="tp__row tp__row--lit" id="litBars"></div></div>
      <i class="tp__head" id="head" aria-hidden="true"></i>
    </div>
    <p class="tp__time"><span class="tp__now" id="timeText">0:00</span><span class="tp__sep">/</span><span>0:04</span></p>
  </div>
  <div class="tp__foot">
    <button class="tp__play" id="play" type="button" aria-pressed="false">
      <svg class="tp__ico tp__ico--play" aria-hidden="true"><use href="#ico-play"/></svg>
      <svg class="tp__ico tp__ico--pause" aria-hidden="true"><use href="#ico-pause"/></svg>
      <span id="playLabel">Play</span>
    </button>
  </div>
</div>
</main>
<script>
var root = document.getElementById('tp');
var wave = document.getElementById('wave');
var baseBars = document.getElementById('baseBars');
var litBars = document.getElementById('litBars');
var litWrap = document.getElementById('litWrap');
var head = document.getElementById('head');
var playBtn = document.getElementById('play');
var playLabel = document.getElementById('playLabel');
var timeText = document.getElementById('timeText');
var COLS = 40, TRACK_SEC = 4;
// 파형 산 모양: 페이지가 열릴 때 OfflineAudioContext 로 합성 버퍼를 한 번 렌더해
// 구간마다 최대 진폭(피크)을 뽑아 둔다. 난수가 아니라 이 트랙의 실제 데이터다.
var offline = new OfflineAudioContext(1, 44100 * TRACK_SEC, 44100);
var oOut = offline.createGain();
oOut.gain.value = 0.5;
oOut.connect(offline.destination);
[196, 246.94, 293.66, 392].forEach(function (hz, n) {
  var osc = offline.createOscillator();
  var amp = offline.createGain();
  osc.type = n === 3 ? 'triangle' : 'sawtooth';
  osc.frequency.value = hz;
  amp.gain.value = 0;
  for (var beat = 0; beat < TRACK_SEC * 2; beat++) {
    var at = beat * 0.5;
    amp.gain.setValueAtTime(beat % 4 === n % 4 ? 0.9 : 0.25, at);
    amp.gain.exponentialRampToValueAtTime(0.02, at + 0.45);
  }
  osc.connect(amp); amp.connect(oOut); osc.start(0);
});
var peaks = [];
offline.startRendering().then(function (buf) {
  var data = buf.getChannelData(0);
  var slice = Math.floor(data.length / COLS);
  for (var c = 0; c < COLS; c++) {
    var peak = 0;
    for (var k = c * slice; k < (c + 1) * slice; k++) {
      var v = Math.abs(data[k]);
      if (v > peak) { peak = v; }
    }
    peaks.push(Math.max(.14, peak));
  }
  for (var i = 0; i < COLS; i++) {
    var a = document.createElement('i');
    a.className = 'tp__bar';
    a.style.setProperty('--h', peaks[i].toFixed(3));
    baseBars.appendChild(a);
    var b = document.createElement('i');
    b.className = 'tp__bar';
    b.style.setProperty('--h', peaks[i].toFixed(3));
    litBars.appendChild(b);
  }
});
var ctx = null, timer = 0, playing = false, startedAt = 0;
function buildAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  var out = ctx.createGain();
  out.gain.value = 0.06;
  out.connect(ctx.destination);
  // 파형을 뽑은 것과 같은 진행을 실시간으로 합성해 재생한다 — 미리 뽑은 산과 지금 소리가 같은 트랙이다.
  [196, 246.94, 293.66, 392].forEach(function (hz, n) {
    var osc = ctx.createOscillator();
    var amp = ctx.createGain();
    osc.type = n === 3 ? 'triangle' : 'sawtooth';
    osc.frequency.value = hz;
    amp.gain.value = 0;
    for (var beat = 0; beat < 64; beat++) {
      var at = ctx.currentTime + beat * 0.5;
      amp.gain.setValueAtTime(beat % 4 === n % 4 ? 0.9 : 0.25, at);
      amp.gain.exponentialRampToValueAtTime(0.02, at + 0.45);
    }
    osc.connect(amp); amp.connect(out); osc.start();
  });
}
function draw() {
  // Playback position — 트랙 길이로 나눈 나머지라 4초마다 처음으로 돌아간다.
  var t = (ctx.currentTime - startedAt) % TRACK_SEC;
  var pct = t / TRACK_SEC;
  litWrap.style.setProperty('--p', (pct * 100).toFixed(1) + '%');
  head.style.setProperty('--x', (pct * 100).toFixed(1) + '%');
  wave.setAttribute('aria-valuenow', String(Math.round(pct * 100)));
  var sec = Math.floor(t);
  var txt = '0:0' + Math.min(sec, TRACK_SEC - 1);
  if (timeText.textContent !== txt) { timeText.textContent = txt; }
  timer = requestAnimationFrame(draw);
}
playBtn.addEventListener('click', function () {
  root.classList.remove('is-demo');
  if (!ctx) { buildAudio(); }
  playing = !playing;
  playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  playLabel.textContent = playing ? 'Stop' : 'Play';
  // 자동재생 정책: AudioContext 는 사용자 제스처 뒤 resume() 해야 소리가 난다.
  if (playing) { startedAt = ctx.currentTime; ctx.resume(); timer = requestAnimationFrame(draw); }
  else { ctx.suspend(); cancelAnimationFrame(timer); }
});
</script>
</body>
</html>
