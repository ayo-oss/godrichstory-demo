<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiles reveal via stagger — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ss-grid is-demo">
    <div class="ss-tile"><span class="ss-tile__tag">Design</span></div>
    <div class="ss-tile"><span class="ss-tile__tag">Build</span></div>
    <div class="ss-tile"><span class="ss-tile__tag">Ship</span></div>
    <div class="ss-tile"><span class="ss-tile__tag">Scale</span></div>
  </div>
</main>
<script>
var tiles = document.querySelectorAll('.ss-tile');
var io = new IntersectionObserver(function (entries) {
  entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold: 0.3 });
tiles.forEach(function (t) { io.observe(t); });
</script>
</body>
</html>
