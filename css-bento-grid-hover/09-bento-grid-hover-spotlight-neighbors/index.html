<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neighboring tile glow — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sl-grid is-demo">
    <div class="sl-tile"><span class="sl-tile__tag">Product</span></div>
    <div class="sl-tile"><span class="sl-tile__tag">Design</span></div>
    <div class="sl-tile"><span class="sl-tile__tag">Growth</span></div>
    <div class="sl-tile"><span class="sl-tile__tag">Support</span></div>
  </div>
</main>
<script>
var grid = document.querySelector('.sl-grid');
grid.addEventListener('pointermove', function (e) {
  var r = grid.getBoundingClientRect();
  var x = ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%';
  var y = ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%';
  grid.style.setProperty('--mx', x);
  grid.style.setProperty('--my', y);
});
</script>
</body>
</html>
