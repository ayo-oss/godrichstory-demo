<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">

<title>Image tile zoom — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="iz-grid is-demo">
    <div class="iz-tile iz-tile--a iz-focal">
      <div class="iz-tile__media"></div>
      <span class="iz-tile__label">View</span>

      <span class="iz-tile__tag">Gallery</span>

    <div class="iz-tile iz-tile--c">
      <span class="iz-tile__tag">24 photos</span>

  </div>
