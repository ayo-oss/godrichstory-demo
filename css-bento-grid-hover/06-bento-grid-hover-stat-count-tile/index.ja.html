<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stat count tile — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sc-grid is-demo">
    <div class="sc-tile sc-tile--a sc-focal">
      <span class="sc-tile__tag">Conversion</span>
      <span class="sc-stat"><span class="sc-stat__value"></span><span class="sc-stat__unit">%</span></span>
    </div>
    <div class="sc-tile sc-tile--b">
      <span class="sc-tile__tag">Live</span>
    </div>
    <div class="sc-tile sc-tile--c">
      <span class="sc-tile__tag">+9 today</span>
    </div>
  </div>
</main>
</body>
</html>
