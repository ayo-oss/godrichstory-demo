<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map locate crosshair — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="lc is-demo">
    <div class="lc__map">
      <span class="lc__ring lc__ring--1" aria-hidden="true"></span>
      <span class="lc__ring lc__ring--2" aria-hidden="true"></span>
      <span class="lc__ring lc__ring--3" aria-hidden="true"></span>
      <span class="lc__cross" aria-hidden="true"><svg viewBox="0 0 256 256" width="36" height="36"><g fill="currentColor"><path d="M160 128a32 32 0 1 1-32-32a32 32 0 0 1 32 32" opacity=".2"/><path d="M232 120h-8.34A96.14 96.14 0 0 0 136 32.34V24a8 8 0 0 0-16 0v8.34A96.14 96.14 0 0 0 32.34 120H24a8 8 0 0 0 0 16h8.34A96.14 96.14 0 0 0 120 223.66V232a8 8 0 0 0 16 0v-8.34A96.14 96.14 0 0 0 223.66 136H232a8 8 0 0 0 0-16m-96 87.6V200a8 8 0 0 0-16 0v7.6A80.15 80.15 0 0 1 48.4 136H56a8 8 0 0 0 0-16h-7.6A80.15 80.15 0 0 1 120 48.4V56a8 8 0 0 0 16 0v-7.6a80.15 80.15 0 0 1 71.6 71.6H200a8 8 0 0 0 0 16h7.6a80.15 80.15 0 0 1-71.6 71.6M128 88a40 40 0 1 0 40 40a40 40 0 0 0-40-40m0 64a24 24 0 1 1 24-24a24 24 0 0 1-24 24"/></g></svg></span>
      <span class="lc__dot" aria-hidden="true"></span>
    </div>
    <div class="lc__bar">
      <!-- 진짜 <button> 이라 마우스 클릭과 키보드 Enter·Space 가 모두 click 으로 들어온다 -->
      <button class="lc__btn" type="button" id="lc-btn">
        <svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="M234.35 129L152 152l-23 82.35a8 8 0 0 1-15.21.27l-65.28-176a8 8 0 0 1 10.12-10.16l176 65.28a8 8 0 0 1-.28 15.26" opacity=".2"/><path d="M237.33 106.21L61.41 41l-.16-.05a16 16 0 0 0-20.35 20.3a1 1 0 0 0 .05.16l65.26 175.92A15.77 15.77 0 0 0 121.28 248h.3a15.77 15.77 0 0 0 15-11.29l.06-.2l21.84-78l78-21.84l.2-.06a16 16 0 0 0 .62-30.38Zm-87.49 38.09a8 8 0 0 0-5.54 5.54l-23 82.16l-.06-.17L56 56l175.82 65.22l.16.06Z"/></g></svg>
        <span>내 위치 찾기</span>
      </button>
      <span class="lc__read">
        <span class="lc__say" id="lc-say" role="status" aria-live="polite">위치를 찾는 중</span>
        <span class="lc__cut lc__cut--a" aria-hidden="true">위치를 찾는 중</span>
        <span class="lc__cut lc__cut--b" aria-hidden="true">현재 위치 · 12m</span>
      </span>
    </div>
  </div>
</main>
<script>
// 실제 동작: 버튼을 누르면(클릭·Enter·Space) 스캔 링이 다시 퍼지고, 1.4초 뒤 잠기며
// aria-live 영역의 문구가 바뀌어 스크린리더에도 알려진다.
var lcRoot = document.querySelector('.lc');
var lcBtn = document.getElementById('lc-btn');
var lcSay = document.getElementById('lc-say');
var lcTimer = 0;
function lcScan() {
  lcRoot.classList.remove('is-demo');   // 사람이 누르면 자동 루프를 멈춘다
  lcRoot.classList.remove('is-locked');
  lcRoot.classList.add('is-scanning');
  lcSay.textContent = '위치를 찾는 중';
  clearTimeout(lcTimer);
  lcTimer = setTimeout(function () {
    lcRoot.classList.remove('is-scanning');
    lcRoot.classList.add('is-locked');
    lcSay.textContent = '현재 위치 · 12m';
  }, 1400);
}
lcBtn.addEventListener('click', lcScan);
</script>
</body>
</html>
