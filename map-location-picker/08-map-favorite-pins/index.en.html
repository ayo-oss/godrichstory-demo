<script>
// 실제 동작: 핀의 하트를 토글하면(마우스 클릭 · Enter/Space) aria-pressed 가 바뀌고 아래 칩 목록이 실제로 늘고 준다.
var root = document.querySelector('.fp');
var pins = [].slice.call(document.querySelectorAll('.fp__pin'));
var chips = [].slice.call(document.querySelectorAll('.fp__chip'));
function sync() {
  pins.forEach(function (p, i) {
    var on = p.getAttribute('aria-pressed') === 'true';
    chips[i].classList.toggle('is-on', on);
    chips[i].setAttribute('aria-hidden', String(!on));
  });
}
pins.forEach(function (p) {
  p.addEventListener('click', function () {
    root.classList.remove('is-demo');   // 사람이 조작하면 자동 루프를 끈다 (237 선례)
    p.setAttribute('aria-pressed', p.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    sync();
  });
  p.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); p.click(); }
  });
});
sync();
</script>
