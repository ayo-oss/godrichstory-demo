<script>
// 실제 동작: 글자를 치면 후보가 열리고, ↑↓ 로 옮기고, Enter(또는 클릭)로 고르면 지도 핀이 그 좌표로 간다.
var acRoot = document.querySelector('.ac');
var acInput = document.getElementById('ac-input');
var acList = document.getElementById('ac-list');
var acPin = document.getElementById('ac-pin');
var acOpts = [].slice.call(acList.querySelectorAll('.ac__opt'));
var acActive = 0;
function acPaint() {
  acOpts.forEach(function (o, i) { o.classList.toggle('is-active', i === acActive); });
  acInput.setAttribute('aria-activedescendant', acOpts[acActive].id);
}
function acOpen(on) {
  acRoot.classList.remove('is-demo');  // 사람이 치면 자동 루프를 멈춘다
  acRoot.classList.toggle('is-open', on);
  acInput.setAttribute('aria-expanded', String(on));
  if (on) acPaint(); else acInput.removeAttribute('aria-activedescendant');
}
function acPick(i) {
  var o = acOpts[i];
  acOpts.forEach(function (x, k) { x.setAttribute('aria-selected', String(k === i)); });
  acInput.value = o.lastElementChild.textContent;
  acPin.style.left = o.getAttribute('data-x');
  acPin.style.top = o.getAttribute('data-y');
  acOpen(false);
  acInput.focus({ preventScroll: true });
}
acInput.addEventListener('input', function () { acOpen(acInput.value.length > 0); });
acInput.addEventListener('focus', function () { acOpen(acInput.value.length > 0); });
acInput.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown') { acActive = Math.min(acActive + 1, acOpts.length - 1); acOpen(true); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { acActive = Math.max(acActive - 1, 0); acOpen(true); e.preventDefault(); }
  else if (e.key === 'Enter') { acPick(acActive); e.preventDefault(); }
  else if (e.key === 'Escape') { acOpen(false); }
});
acOpts.forEach(function (o, i) {
  o.addEventListener('mousemove', function () { acActive = i; acPaint(); });
  o.addEventListener('click', function () { acPick(i); });
});
</script>
</body>
</html>
