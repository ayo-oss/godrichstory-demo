<body>

  <div class="rd is-demo">
    <div class="rd__map">

    <button class="rd__btn" type="button" id="rd-btn">
      <span class="rd__btn-ico" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M234.35 129L152 152l-23 82.35a8 8 0 0 1-15.21.27l-65.28-176a8 8 0 0 1 10.12-10.16l176 65.28a8 8 0 0 1-.28 15.26" opacity=".2"/><path d="M237.33 106.21L61.41 41l-.16-.05a16 16 0 0 0-20.35 20.3a1 1 0 0 0 .05.16l65.26 175.92A15.77 15.77 0 0 0 121.28 248h.3a15.77 15.77 0 0 0 15-11.29l.06-.2l21.84-78l78-21.84l.2-.06a16 16 0 0 0 .62-30.38Zm-87.49 38.09a8 8 0 0 0-5.54 5.54l-23 82.16l-.06-.17L56 56l175.82 65.22l.16.06Z"/></g></svg></span>

    </button>

</main>
<script>
// 실제 동작: 버튼(마우스 클릭 · Enter/Space)으로 경로선을 0 부터 다시 긋고, 다 그으면 배지를 띄운다.
var root = document.querySelector('.rd');
var btn = document.getElementById('rd-btn');
var line = document.querySelector('.rd__line--draw');
function redraw() {
  root.classList.remove('is-demo');   // 사람이 조작하면 자동 루프를 끈다 (237 선례)
  root.classList.remove('is-drawn');
  void line.getBoundingClientRect();  // 되감긴 상태를 한 프레임 확정시킨 뒤 다시 긋는다
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { root.classList.add('is-drawn'); });
  });
}
btn.addEventListener('click', redraw);
btn.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); redraw(); }
});
</script>
</body>
</html>
