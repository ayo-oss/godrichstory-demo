    <div class="rs__bar">
      <label class="rs__cap" for="rs-range">반경</label>
      <input class="rs__range" id="rs-range" type="range" min="30" max="100" step="1" value="55" aria-valuetext="1.8km">
      <span class="rs__read">
        <span class="rs__km" id="rs-km">1.8km</span>
        <span class="rs__cut rs__cut--a" aria-hidden="true">1.0km</span>
        <span class="rs__cut rs__cut--b" aria-hidden="true">2.1km</span>
        <span class="rs__cut rs__cut--c" aria-hidden="true">3.2km</span>
      </span>
    </div>
    <p class="rs__hint">밀거나 화살표 키로 반경을 바꾸세요</p>
  </div>
</main>
<script>
// 실제 동작: 슬라이더를 밀면(마우스) 또는 화살표 키를 누르면(키보드) 반경 원이 커지고,
// 핀마다 data-dist 를 슬라이더 값과 견줘 원 안에 든 핀만 진해진다.
var rsRoot = document.querySelector('.rs');
var rsRange = document.getElementById('rs-range');
var rsRing = rsRoot.querySelector('.rs__ring');
var rsKm = document.getElementById('rs-km');
var rsPins = [].slice.call(rsRoot.querySelectorAll('.rs__pin'));
var RS_MAX_KM = 3.2;
function rsPaint() {
  var v = Number(rsRange.value);
  var t = (v / 100 * RS_MAX_KM).toFixed(1) + 'km';
  rsRing.style.setProperty('--k', v / 100);
  rsKm.textContent = t;
  rsRange.setAttribute('aria-valuetext', t);
  rsPins.forEach(function (p) {
    p.classList.toggle('is-in', Number(p.getAttribute('data-dist')) <= v);
  });
}
function rsLive() {
  rsRoot.classList.remove('is-demo');  // 사람이 잡으면 자동 루프를 멈춘다
  rsPaint();
}
rsRange.addEventListener('input', rsLive);
rsRange.addEventListener('pointerdown', rsLive);
rsRange.addEventListener('keydown', function (e) {
  if (e.key.indexOf('Arrow') === 0 || e.key === 'Home' || e.key === 'End') rsLive();
});
rsPaint();
</script>
