<script>
// 실제 동작: 배지나 버튼을 누르면 핀이 부채꼴로 흩어지고 다시 누르면 배지 하나로 합쳐진다. Escape 로 접는다.
var root = document.querySelector('.cb');
var badge = document.getElementById('cb-badge');
var toggle = document.getElementById('cb-toggle');
var group = document.getElementById('cb-group');
var out = document.getElementById('cb-out');
var ON = '접기', OFF = '펼치기';
var ONMSG = '매장 6곳이 펼쳐졌습니다', OFFMSG = '매장 6곳이 한 자리에 모여 있습니다';
function set(on) {
  root.classList.remove('is-demo'); // 사람이 만졌으니 자동 루프를 멈춘다
  root.classList.toggle('is-open', on);
  badge.setAttribute('aria-expanded', String(on));
  toggle.setAttribute('aria-expanded', String(on));
  group.setAttribute('aria-hidden', String(!on));
  toggle.textContent = on ? ON : OFF;
  out.textContent = on ? ONMSG : OFFMSG;
}
function flip() { set(!root.classList.contains('is-open')); }
badge.addEventListener('click', flip);
toggle.addEventListener('click', flip);
root.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { set(false); badge.focus({ preventScroll: true }); }
});
</script>
