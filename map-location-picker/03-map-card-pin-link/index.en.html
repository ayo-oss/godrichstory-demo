<script>
// 실제 동작: 카드 ↔ 핀 양방향. 마우스는 hover, 키보드는 Tab 포커스와 화살표 이동으로 같은 id 를 켠다.
var root = document.querySelector('.cl');
var cards = [].slice.call(root.querySelectorAll('.cl__card'));
var pins = [].slice.call(root.querySelectorAll('.cl__pin'));
var out = document.getElementById('cl-out');
function light(id) {
  root.classList.remove('is-demo'); // 사람이 만졌으니 자동 루프를 멈춘다
  cards.concat(pins).forEach(function (el) {
    var on = el.getAttribute('data-id') === id;
    el.classList.toggle('is-on', on);
    el.setAttribute('aria-pressed', String(on));
  });
  var c = cards.filter(function (el) { return el.getAttribute('data-id') === id; })[0];
  if (c) out.textContent = 'Highlighted pin · ' + c.querySelector('.cl__name').textContent;
}
cards.concat(pins).forEach(function (el) {
  var id = el.getAttribute('data-id');
  el.addEventListener('mouseenter', function () { light(id); });
  el.addEventListener('focus', function () { light(id); });
  el.addEventListener('click', function () { light(id); });
});
root.addEventListener('keydown', function (e) {
  var list = e.target.classList.contains('cl__pin') ? pins : cards;
  var i = list.indexOf(e.target);
  if (i < 0) return;
  var k = e.key;
  var n = (k === 'ArrowDown' || k === 'ArrowRight') ? i + 1 : (k === 'ArrowUp' || k === 'ArrowLeft') ? i - 1 : -1;
  if (n < 0 || n >= list.length) return;
  list[n].focus({ preventScroll: true });
  e.preventDefault();
});
</script>
