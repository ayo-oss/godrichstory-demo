<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bezier threading — 스트링아트 실 감기 기하 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sd is-demo" id="sdRoot" role="application" aria-label="Bezier lab" tabindex="0">
  <canvas class="sd__cv" id="sdCv"></canvas>
  <p class="sd__hint">
    <span class="sd__title">Bezier threading</span>
    <span class="sd__desc">Drag a control pin and the thread layout rewraps in real time</span>
  </p>
  <div class="sd__bar">
    <span class="sd__meta">3 control pins · curve recomputed each 1.5s</span>
    <span class="sd__meta sd__meta--dim">pointermove · lineTo</span>
  </div>
</div>
</main>
<script>
// 스트링아트 Bezier threading(04) — 컨트롤 핀이 실 부채꼴의 뼈대가 되는 드 카스텔료 구성.
// 양끝 고정핀 A·B 와 그 사이 컨트롤 핀 3개(C1·C2·C3)를 사슬로 잇고,
// 사슬의 같은 비율 점끼리 실을 건다 — 실의 포락선이 베지어 곡선을 따라간다.
// 컨트롤 핀을 끌면(pointermove) 그 자리에서 전체 실배치가 다시 감기고,
// 놔두면 1.5초마다 핀이 스스로 다음 자리로 옮겨가며 재계산한다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var NCTRL     = 3;    // 컨트롤 핀 개수
  var RECOMPUTE = 1.5;  // 실 배치 재계산 주기(초)
  var FAN       = 128;  // 바깥 부채꼴 실 수 (A→C1 · C3→B 사이)
  var FAN2      = 96;   // 안쪽 부채꼴 실 수 (C1→C2 · C2→C3 사이)
  var FAN3      = 84;   // 옆 부채꼴 실 수 (사슬 앞쪽·뒤쪽 각 1개)
  // ────────────────────────────────────────────────────

  var root = document.getElementById('sdRoot');
  var cvEl = document.getElementById('sdCv');
  if (!root || !cvEl) return;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var COL_THRD  = tokRGB('--sd-thread');
  var COL_PIN   = tokRGB('--sd-pin');
  var COL_HOT   = tokRGB('--sd-hot');
  var COL_GUIDE = tokRGB('--sd-guide');
  var COL_PANEL = tokRGB('--sd-panel');

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

  // 양끝 고정핀(비율 좌표) — 컨트롤 핀만 움직인다
  var A = [0.05, 0.50], B = [0.95, 0.50];
  // 컨트롤 핀 목표 자리 후보 — 1.5초마다 다음 후보로 글라이드(무대 전체 폭을 쓴다)
  var PRESETS = [
    [[0.30, 0.22], [0.50, 0.82], [0.70, 0.24]],
    [[0.26, 0.78], [0.54, 0.16], [0.76, 0.70]],
    [[0.36, 0.14], [0.66, 0.86], [0.80, 0.26]],
    [[0.22, 0.46], [0.50, 0.90], [0.72, 0.42]],
    [[0.38, 0.84], [0.60, 0.14], [0.82, 0.74]],
    [[0.28, 0.28], [0.70, 0.40], [0.78, 0.82]]
  ];
  var cur = PRESETS[0].map(function (p) { return [p[0], p[1]]; });
  var tgt = PRESETS[0].map(function (p) { return [p[0], p[1]]; });

  function px(p) { return [p[0] * W, p[1] * H]; }
  function lerp(p, q, u) { return [p[0] + (q[0] - p[0]) * u, p[1] + (q[1] - p[1]) * u]; }

  function fit() {
    var r = root.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = Math.round(W * dpr); cvEl.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw(t, progress) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgb(' + COL_PANEL.join(',') + ')';
    ctx.fillRect(0, 0, W, H);

    var C1 = cur[0], C2 = cur[1], C3 = cur[2];

    // 사슬 가이드 — 실이 어느 뼈대에 걸리는지 보여주는 점선
    ctx.strokeStyle = 'rgba(' + COL_GUIDE.join(',') + ',0.55)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.moveTo(px(A)[0], px(A)[1]);
    ctx.lineTo(px(C1)[0], px(C1)[1]);
    ctx.lineTo(px(C2)[0], px(C2)[1]);
    ctx.lineTo(px(C3)[0], px(C3)[1]);
    ctx.lineTo(px(B)[0], px(B)[1]);
    ctx.stroke();
    ctx.setLineDash([]);

    // 실 — 두 부채꼴. 방금 감은 올일수록 밝고 굵다(recency)
    ctx.lineCap = 'round';
    ctx.shadowBlur = 6;
    ctx.shadowColor = 'rgba(' + COL_THRD.join(',') + ',0.35)';
    var i, u, recency, a, b, alpha;
    for (i = 0; i < FAN; i++) {
      u = i / (FAN - 1);
      if (u > progress) continue;
      a = px(lerp(A, C1, u)); b = px(lerp(C3, B, u));
      recency = Math.max(0, 1 - (progress - u));
      alpha = 0.44 + 0.5 * Math.pow(recency, 1.1);
      ctx.strokeStyle = 'rgba(' + COL_THRD.join(',') + ',' + Math.min(0.95, alpha).toFixed(3) + ')';
      ctx.lineWidth = 2.4 + recency * 1.8;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    for (i = 0; i < FAN2; i++) {
      u = i / (FAN2 - 1);
      if (u > progress) continue;
      a = px(lerp(C1, C2, u)); b = px(lerp(C2, C3, u));
      recency = Math.max(0, 1 - (progress - u));
      alpha = (0.38 + 0.5 * Math.pow(recency, 1.1)) * 0.9;
      ctx.strokeStyle = 'rgba(' + COL_THRD.join(',') + ',' + Math.min(0.9, alpha).toFixed(3) + ')';
      ctx.lineWidth = 2.1 + recency * 1.5;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    // 옆 부채꼴 2개 — 사슬 앞쪽(A·C1·C2)과 뒤쪽(C2·C3·B)을 각자 부채로 펼친다
    for (i = 0; i < FAN3; i++) {
      u = i / (FAN3 - 1);
      if (u > progress) continue;
      a = px(lerp(A, C1, u)); b = px(lerp(C1, C2, u));
      recency = Math.max(0, 1 - (progress - u));
      alpha = 0.36 + 0.48 * Math.pow(recency, 1.1);
      ctx.strokeStyle = 'rgba(' + COL_THRD.join(',') + ',' + Math.min(0.9, alpha).toFixed(3) + ')';
      ctx.lineWidth = 2.2 + recency * 1.5;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    for (i = 0; i < FAN3; i++) {
      u = i / (FAN3 - 1);
      if (u > progress) continue;
      a = px(lerp(C2, C3, u)); b = px(lerp(C3, B, u));
      recency = Math.max(0, 1 - (progress - u));
      alpha = 0.36 + 0.48 * Math.pow(recency, 1.1);
      ctx.strokeStyle = 'rgba(' + COL_THRD.join(',') + ',' + Math.min(0.9, alpha).toFixed(3) + ')';
      ctx.lineWidth = 2.2 + recency * 1.5;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // 고정핀 — 마름모
    var anchors = [px(A), px(B)];
    for (i = 0; i < 2; i++) {
      var an = anchors[i];
      ctx.fillStyle = 'rgb(' + COL_PIN.join(',') + ')';
      ctx.beginPath();
      ctx.moveTo(an[0], an[1] - 5); ctx.lineTo(an[0] + 5, an[1]);
      ctx.lineTo(an[0], an[1] + 5); ctx.lineTo(an[0] - 5, an[1]);
      ctx.closePath(); ctx.fill();
    }

    // 컨트롤 핀 — 실색 채운 원 + 광택 고리(끌고 있는 핀은 더 밝게 맥동)
    var dragBoost = 0.5 + 0.5 * Math.sin(t * 6);
    for (i = 0; i < NCTRL; i++) {
      var c = px(cur[i]);
      ctx.strokeStyle = 'rgba(' + COL_HOT.join(',') + ',' + (0.55 + (drag === i ? 0.45 * dragBoost : 0)).toFixed(3) + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(c[0], c[1], drag === i ? 10 : 8, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgb(' + COL_THRD.join(',') + ')';
      ctx.beginPath(); ctx.arc(c[0], c[1], 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgb(' + COL_PIN.join(',') + ')';
      ctx.beginPath(); ctx.arc(c[0], c[1], 1.8, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ── 포인터 — 컨트롤 핀 끌기(pointermove 로 실시간 재감기) ──
  var drag = -1;
  function evPos(e) {
    var r = cvEl.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  function hit(x, y) {
    for (var k = 0; k < NCTRL; k++) {
      var c = px(cur[k]);
      var dx = x - c[0], dy = y - c[1];
      if (dx * dx + dy * dy < 18 * 18) return k;
    }
    return -1;
  }
  cvEl.addEventListener('pointerdown', function (e) {
    var p = evPos(e);
    drag = hit(p[0], p[1]);
    if (drag >= 0) {
      try { cvEl.setPointerCapture(e.pointerId); } catch (err) { /* 캡처 실패해도 드래그는 유지 */ }
      e.preventDefault();
    }
  });
  cvEl.addEventListener('pointermove', function (e) {
    if (drag < 0) return;
    var p = evPos(e);
    var rx = Math.max(0.06, Math.min(0.94, p[0] / W));
    var ry = Math.max(0.10, Math.min(0.90, p[1] / H));
    cur[drag] = [rx, ry]; tgt[drag] = [rx, ry];
    e.preventDefault();
  });
  function drop() { drag = -1; }
  cvEl.addEventListener('pointerup', drop);
  cvEl.addEventListener('pointercancel', drop);

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1;
  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;

    // 1.5초마다 다음 자리로 목표 갱신 — 컨트롤 핀이 스스로 움직여 재계산을 보여준다
    var pi = Math.floor(t / RECOMPUTE) % PRESETS.length;
    for (var k = 0; k < NCTRL; k++) {
      if (drag !== k) tgt[k] = PRESETS[pi][k];
      cur[k][0] += (tgt[k][0] - cur[k][0]) * 0.09;
      cur[k][1] += (tgt[k][1] - cur[k][1]) * 0.09;
    }

    // 주기 안 앞 85% 에 걸쳐 다시 감고, 나머지 구간은 핀 글라이드가 계속 움직인다
    var progress = Math.min(1, (t % RECOMPUTE) / RECOMPUTE / 0.85);
    draw(t, progress);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) draw(0, 1);
  });
  fit();
  if (reduce) {
    draw(0, 1);   // reduce — 다 감긴 부채꼴 한 장만 고정
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
