<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curve illusion — 스트링아트 실 감기 기하 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sb is-demo" id="sbRoot" role="application" aria-label="Envelope wrapping board" tabindex="0">
  <canvas class="sb__cv" id="sbCv"></canvas>
  <p class="sb__hint">
    <span class="sb__title">Curve illusion</span>
    <span class="sb__desc">Weave densely between two edges of pins and an arc that exists nowhere floats up</span>
  </p>
  <div class="sb__bar">
    <span class="sb__meta">32 pin pairs · arc envelope · cycle 2s</span>
    <span class="sb__meta sb__meta--dim">lineTo · envelope</span>
  </div>
</div>
</main>
<script>
// 스트링아트 Curve illusion(02) — 직선 현만으로 곡선을 만드는 포락선 원리.
// 왼변·아래변에 핀을 나란히 박고, 왼변의 i 번 핀을 아래변의 (M-1-i) 번 핀과 이으면
// 모든 현이 한 원호에 닿는다 — 현의 집합이 원호를 포락한다.
// 곡선을 한 번도 그리지 않았는데 눈은 원호를 본다. 감기가 차오르는 과정이 애니메이션이다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var M     = 32;    // 변마다 핀 개수 — 더 올리면 호가 더 매끈해진다
  var CYCLE = 2.0;   // 감기 완료 주기(초)
  // ────────────────────────────────────────────────────

  var root = document.getElementById('sbRoot');
  var cvEl = document.getElementById('sbCv');
  if (!root || !cvEl) return;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var COL_THRD = tokRGB('--sb-thread');
  var COL_PIN  = tokRGB('--sb-pin');
  var COL_GUIDE = tokRGB('--sb-guide');
  var COL_PANEL = tokRGB('--sb-panel');
  var COL_DIM  = tokRGB('--sb-dim');

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  var pad = 0;

  function fit() {
    var r = root.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = Math.round(W * dpr); cvEl.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pad = Math.min(W, H) * 0.07;
  }

  // 왼변 핀 i (위에서 아래) — 판 세로를 전부 쓴다
  function pinL(i) { return [pad, pad + (H - 2 * pad) * i / (M - 1)]; }
  // 아래변 핀 j (왼쪽에서 오른쪽) — 판 가로를 전부 쓴다
  function pinB(j) { return [pad + (W - 2 * pad) * j / (M - 1), H - pad]; }

  function draw(progress, t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgb(' + COL_PANEL.join(',') + ')';
    ctx.fillRect(0, 0, W, H);

    // 두 변 표시 — 실이 어느 틀에 감기는지 보여주는 가이드
    ctx.strokeStyle = 'rgba(' + COL_GUIDE.join(',') + ',0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - pad); ctx.lineTo(W - pad, H - pad); ctx.stroke();

    // 실 — 왼변 i ↔ 아래변 (M-1-i). 감는 손이 지나간 자리일수록 밝다
    ctx.lineCap = 'round';
    ctx.shadowBlur = 5;
    for (var i = 0; i < M; i++) {
      if (i / M >= progress) continue;
      var a = pinL(i), b = pinB(M - 1 - i);
      var recency = (progress * M - i) / M;      // 1(방금 감은 올) → 0(처음 올)
      var alpha = 0.55 + 0.42 * Math.pow(recency, 1.4);
      ctx.strokeStyle = 'rgba(' + COL_THRD.join(',') + ',' + alpha.toFixed(3) + ')';
      ctx.shadowColor = 'rgba(' + COL_THRD.join(',') + ',' + (alpha * 0.45).toFixed(3) + ')';
      ctx.lineWidth = 1.8 + recency * 1.6;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // 핀 — 감긴 핀은 밝게 숨쉰다(유지 구간에도 순차 맥동)
    for (var p = 0; p < M; p++) {
      var la = pinL(p), ba = pinB(p);
      var doneL = p / M < progress;
      var doneB = (M - 1 - p) / M < progress;
      var pulse = 0.5 + 0.5 * Math.sin(t * 4 - p * 0.4);
      if (doneL) {
        ctx.fillStyle = 'rgba(' + COL_PIN.join(',') + ',' + (0.65 + 0.35 * pulse).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(la[0], la[1], 1.5 + 1.1 * pulse, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = 'rgb(' + COL_DIM.join(',') + ')';
        ctx.beginPath(); ctx.arc(la[0], la[1], 1.3, 0, Math.PI * 2); ctx.fill();
      }
      if (doneB) {
        ctx.fillStyle = 'rgba(' + COL_PIN.join(',') + ',' + (0.65 + 0.35 * pulse).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(ba[0], ba[1], 1.5 + 1.1 * pulse, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = 'rgb(' + COL_DIM.join(',') + ')';
        ctx.beginPath(); ctx.arc(ba[0], ba[1], 1.3, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1;
  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = ((now - t0) / 1000) % CYCLE;
    // 0→0.75 감기 · 0.75→1 유지(다 감긴 착시 원호를 볼 시간)
    var progress = Math.min(1, t / CYCLE / 0.75);
    draw(progress, t);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) draw(1, 0);
  });
  fit();
  if (reduce) {
    draw(1, 0);   // reduce — 다 감긴 포락선 한 장만 고정
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
