<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 실화 — 스트링아트 실 감기 기하 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="se is-demo" id="seRoot" role="application" aria-label="밝기 실밀도판" tabindex="0">
  <canvas class="se__cv" id="seCv"></canvas>
  <p class="se__hint">
    <span class="se__title">사진 실화</span>
    <span class="se__desc">어두운 곳에 실을 많이 감겠다 매번 고르면 얼굴이 실로 떠오른다</span>
  </p>
  <div class="se__bar">
    <span class="se__meta">프로필 사진 180핀 · 실 600올 · 주기 2초</span>
    <span class="se__meta se__meta--dim">getImageData · 밝기</span>
  </div>
</div>
</main>
<script>
// 스트링아트 사진 실화(05) — 밝기를 실 밀도로 바꾸는 명암 변환.
// 외부 이미지 없이 오프스크린 캔버스에 프로필 실루엣(머리·어깨)을 절차적으로 그리고
// getImageData 로 밝기를 읽는다. 감을 올 후보 둘 중 "지나는 길이 더 어두운 쪽"을
// 매번 골라 걸어가면(욕심 선택) 어두운 영역에만 실이 쌓여 초상이 떠오른다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var N     = 180;   // 원 둘레 핀 개수
  var STR   = 600;   // 감는 실 올 수
  var CYCLE = 2.0;   // 감기 완료 주기(초)
  var SS    = 96;    // 오프스크린 밝기 격자 크기(SS×SS)
  // ────────────────────────────────────────────────────

  var root = document.getElementById('seRoot');
  var cvEl = document.getElementById('seCv');
  if (!root || !cvEl) return;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var COL_THRD  = tokRGB('--se-thread');
  var COL_PIN   = tokRGB('--se-pin');
  var COL_PANEL = tokRGB('--se-panel');
  var COL_DIM   = tokRGB('--se-dim');

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  var R = 0, CX = 0, CY = 0;

  // ── 오프스크린 프로필 실루엣 → 밝기 격자 ──
  // 머리(원) + 목 + 어깨(둥근 사다리꼴, 판 아래까지) + 뺨 음영 + 하단 좌우 배경 칼럼 — 절차적으로만 그린다.
  var lum = new Float32Array(SS * SS);
  (function buildProfile() {
    var oc = document.createElement('canvas');
    oc.width = SS; oc.height = SS;
    var o = oc.getContext('2d');
    o.fillStyle = '#fff'; o.fillRect(0, 0, SS, SS);   // 바탕 밝게
    o.fillStyle = '#000';
    // 하단 좌우 배경 칼럼 — 사진 테두리 어둡기. 아래쪽에도 실이 감기게 하여 판이 비지 않게
    o.fillRect(0, SS * 0.80, SS * 0.20, SS * 0.20);
    o.fillRect(SS * 0.80, SS * 0.80, SS * 0.20, SS * 0.20);
    // 머리 — 중앙 위쪽 큰 원
    o.beginPath(); o.arc(SS * 0.50, SS * 0.30, SS * 0.155, 0, Math.PI * 2); o.fill();
    // 목
    o.fillRect(SS * 0.455, SS * 0.40, SS * 0.09, SS * 0.10);
    // 어깨 — 둥근 사다리꼴, 판 아래까지 이어진다
    o.beginPath();
    o.moveTo(SS * 0.16, SS * 0.94);
    o.quadraticCurveTo(SS * 0.22, SS * 0.585, SS * 0.44, SS * 0.50);
    o.lineTo(SS * 0.56, SS * 0.50);
    o.quadraticCurveTo(SS * 0.78, SS * 0.585, SS * 0.84, SS * 0.94);
    o.lineTo(SS * 0.16, SS * 0.94);
    o.closePath(); o.fill();
    // 머리카락 음영 — 위쪽 반달 더 어둡게(중첩)
    o.beginPath(); o.arc(SS * 0.50, SS * 0.325, SS * 0.158, Math.PI, Math.PI * 2); o.fill();
    // 뺨·턱 음영 — 살짝 어두운 타원 2
    o.fillStyle = '#555';
    o.beginPath(); o.ellipse(SS * 0.445, SS * 0.365, SS * 0.026, SS * 0.017, 0.3, 0, Math.PI * 2); o.fill();
    o.beginPath(); o.ellipse(SS * 0.555, SS * 0.365, SS * 0.026, SS * 0.017, -0.3, 0, Math.PI * 2); o.fill();
    var d = o.getImageData(0, 0, SS, SS).data;
    for (var i = 0; i < SS * SS; i++) {
      lum[i] = 1 - d[i * 4] / 255;   // 어두움 0..1
    }
  })();

  // 감기 순서 — 매 올을 "남은 후보 중 길이 어두움이 큰 쪽"으로 연결하는
  // 결정적 욕심 스케줄(같은 배열이라 매번 같은 그림이 나오도록 시드 고정).
  // 계산용 고정 좌표(스케줄은 판 크기와 무관하게 0..1 비율 격자 위에서 짠다)
  var SKIP = Math.round(N * 0.41);
  var PINU = [];
  for (var pi = 0; pi < N; pi++) {
    var pa = Math.PI * 2 * pi / N - Math.PI / 2;
    PINU.push([0.5 + Math.cos(pa) * 0.5, 0.5 + Math.sin(pa) * 0.5]);
  }
  function pinXY0(i) { return [PINU[i][0] * SS, PINU[i][1] * SS]; }
  function chordDark0(a, b) {
    var s = 0, n = 7;
    for (var k = 1; k <= n; k++) {
      var u = k / (n + 1);
      var x = a[0] + (b[0] - a[0]) * u, y = a[1] + (b[1] - a[1]) * u;
      var gx = Math.round(x), gy = Math.round(y);
      if (gx < 0 || gy < 0 || gx >= SS || gy >= SS) continue;
      s += lum[gy * SS + gx];
    }
    return s / n;
  }
  var schedule = [];
  (function plan() {
    var pos = 0, used = {};
    for (var s = 0; s < STR; s++) {
      var bestJ = -1, bestV = -1;
      var base = pinXY0(pos);
      for (var c = 1; c <= 4; c++) {
        var j = (pos + c * SKIP) % N;
        var key = pos + '-' + j;
        if (used[key]) continue;
        var v = chordDark0(base, pinXY0(j));
        if (v > bestV) { bestV = v; bestJ = j; }
      }
      if (bestJ < 0) bestJ = (pos + SKIP) % N;
      used[pos + '-' + bestJ] = 1;
      schedule.push([pos, bestJ, Math.min(1, bestV * 1.6)]);
      pos = bestJ;
    }
  })();

  function pinXY(i) {
    var a = Math.PI * 2 * i / N - Math.PI / 2;
    return [CX + Math.cos(a) * R, CY + Math.sin(a) * R];
  }

  function fit() {
    var r = root.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = Math.round(W * dpr); cvEl.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = Math.min(W, H) * 0.47;
    CX = W / 2; CY = H / 2 + Math.min(H, W) * 0.02;
  }

  function draw(progress, t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgb(' + COL_PANEL.join(',') + ')';
    ctx.fillRect(0, 0, W, H);

    var full = Math.floor(progress * STR);
    ctx.lineCap = 'round';
    ctx.shadowBlur = 4;
    for (var i = 0; i < full; i++) {
      var seg = schedule[i];
      var a = pinXY(seg[0]), b = pinXY(seg[1]);
      var dens = seg[2];                            // 이 올이 지나는 길의 어두움
      var recency = (full - i) / STR;
      // 어두운 길의 올은 진하게, 밝은 길의 올은 성겁게 — 밀도가 명암이 된다
      var alpha = 0.24 + 0.62 * dens + 0.2 * Math.pow(recency, 1.4);
      ctx.strokeStyle = 'rgba(' + COL_THRD.join(',') + ',' + Math.min(0.95, alpha).toFixed(3) + ')';
      ctx.shadowColor = 'rgba(' + COL_THRD.join(',') + ',' + (alpha * 0.3).toFixed(3) + ')';
      ctx.lineWidth = 1.1 + dens * 1.1 + recency * 0.9;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // 핀 — 감기가 지난 핀은 밝게 숨쉰다(유지 구간에도 순차 맥동)
    var lim = full > 0 ? schedule[full - 1][1] : 0;
    for (var p = 0; p < N; p++) {
      var xy = pinXY(p);
      if (p <= lim) {
        var pulse = 0.5 + 0.5 * Math.sin(t * 4 - p * 0.35);
        ctx.fillStyle = 'rgba(' + COL_PIN.join(',') + ',' + (0.6 + 0.35 * pulse).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(xy[0], xy[1], 1.2 + 1.0 * pulse, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = 'rgb(' + COL_DIM.join(',') + ')';
        ctx.beginPath(); ctx.arc(xy[0], xy[1], 1, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1;
  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = ((now - t0) / 1000) % CYCLE;
    // 0→0.8 감기 · 0.8→1 유지(다 감긴 초상을 볼 시간)
    var progress = Math.min(1, t / CYCLE / 0.8);
    draw(progress, t);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) draw(1, 0);
  });
  fit();
  if (reduce) {
    draw(1, 0);   // reduce — 다 감긴 실 초상 한 장만 고정
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
