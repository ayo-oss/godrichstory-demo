<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表紙の巻きシーン — 스트링아트 실 감기 기하 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="si is-demo" id="siRoot" role="application" aria-label="表紙巻きシーン実験盤" tabindex="0">
  <canvas class="si__cv" id="siCv"></canvas>
  <p class="si__hint">
    <span class="si__title">表紙の巻きシーン</span>
    <span class="si__desc">文字ピンから糸が順に巻かれ、ブランドの文が完成します</span>
  </p>
  <div class="si__bar">
    <span class="si__meta">文字ピン64個 · 糸160本 · 周期2秒</span>
    <span class="si__meta si__meta--dim">createRadialGradient · sin</span>
  </div>
</div>
</main>
<script>
// 스트링아트 表紙の巻きシーン(09) — 글자 윤곽을 핀으로 삼아 워드마크를 실로 짜는 히어로.
// 오프스크린 캔버스에 두 글자("GS" — godrichstory 머리글자)를 크게 그려 getImageData 로
// 읽고, 바깥 홍수 채우기로 **바깥 윤곽 링만** 뽑아 연결 성분(G 링·S 링)으로 나눈 뒤
// 각 링을 따라 도는 순서로 64개 핀을 정한다. 첫 바퀴는 바로 옆 핀을 이어 윤곽을 그리고
// 둘째 바퀴부터 건너뛴 올로 속을 성기게 채운다 — 실이 차오르면 글자가 떠오르고,
// 뒤편 중앙의 createRadialGradient 스포트라이트가 완성 문장을 비춘다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var NPIN  = 64;    // 글자 핀 개수
  var STR   = 160;   // 감는 실 올 수
  var CYCLE = 2.0;   // 감기 완료 주기(초)
  var SS    = 120;   // 글자 샘플 격자 크기
  // ────────────────────────────────────────────────────

  var root = document.getElementById('siRoot');
  var cvEl = document.getElementById('siCv');
  if (!root || !cvEl) return;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var COL_THRD  = tokRGB('--si-thread');
  var COL_GLOW  = tokRGB('--si-glow');
  var COL_PIN   = tokRGB('--si-pin');
  var COL_PANEL = tokRGB('--si-panel');

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

  // ── 글자 → 핀 64개(글자별 구간 기록, 0..1 비율) ──
  var PINS = [], PINC = [], RUNS = [];
  (function buildPins() {
    var oc = document.createElement('canvas');
    oc.width = SS; oc.height = SS;
    var o = oc.getContext('2d');
    o.fillStyle = '#000'; o.fillRect(0, 0, SS, SS);
    o.fillStyle = '#fff';
    o.font = '900 ' + Math.floor(SS * 0.52) + 'px sans-serif';
    o.textAlign = 'center'; o.textBaseline = 'middle';
    o.fillText('G', SS * 0.27, SS * 0.52);
    o.fillText('S', SS * 0.76, SS * 0.52);
    var d = o.getImageData(0, 0, SS, SS).data;
    // 진 글자 픽셀 중 **바깥 윤곽만** — 바깥에서 홍수 채우기(BFS)해 닿는 지점.
    // 속(글자 내부) 픽셀은 바깥과 이어지지 않으니 핀에서 제외되고, 얇은 윤곽 링만 남는다
    var ink = new Uint8Array(SS * SS);
    for (var i0 = 0; i0 < SS * SS; i0++) ink[i0] = d[i0 * 4] > 128 ? 1 : 0;
    var seen = new Uint8Array(SS * SS);
    var isIn = new Uint8Array(SS * SS);
    var stack = [0]; seen[0] = 1;
    var NX = [1, -1, 0, 0], NY = [0, 0, 1, -1];
    while (stack.length) {
      var q = stack.pop();
      var qx = q % SS, qy = (q - qx) / SS;
      for (var d4 = 0; d4 < 4; d4++) {
        var nx = qx + NX[d4], ny = qy + NY[d4];
        if (nx < 0 || ny < 0 || nx >= SS || ny >= SS) continue;
        var qi = ny * SS + nx;
        if (ink[qi]) isIn[q] = 1;   // 바깥 픽셀 옆이 글자 → 윤곽 바로 바깥 점
        else if (!seen[qi]) { seen[qi] = 1; stack.push(qi); }
      }
    }
    // 윤곽 링을 연결 성분으로 나눈다(G 링과 S 링이 따로)
    var ring = [];
    for (var r0 = 0; r0 < SS * SS; r0++) if (isIn[r0]) ring.push(r0);
    var taken = new Uint8Array(SS * SS);
    var comps = [];
    for (var r1 = 0; r1 < ring.length; r1++) {
      if (taken[ring[r1]]) continue;
      var comp = [ring[r1]], st2 = [ring[r1]];
      taken[ring[r1]] = 1;
      while (st2.length) {
        var q2 = st2.pop();
        var qx2 = q2 % SS, qy2 = (q2 - qx2) / SS;
        for (var dx = -1; dx <= 1; dx++) {
          for (var dy = -1; dy <= 1; dy++) {
            var nx2 = qx2 + dx, ny2 = qy2 + dy;
            if (nx2 < 0 || ny2 < 0 || nx2 >= SS || ny2 >= SS) continue;
            var qi2 = ny2 * SS + nx2;
            if (isIn[qi2] && !taken[qi2]) { taken[qi2] = 1; comp.push(qi2); st2.push(qi2); }
          }
        }
      }
      comps.push(comp);
    }
    // 성분을 왼쪽부터 정렬 — G 링을 다 감은 뒤 S 링으로 감기가 넘어간다
    comps.sort(function (a, b) {
      var ax = SS + 1, bx = SS + 1;
      for (var i2 = 0; i2 < a.length; i2++) { var v = a[i2] % SS; if (v < ax) ax = v; }
      for (var i3 = 0; i3 < b.length; i3++) { var w = b[i3] % SS; if (w < bx) bx = w; }
      return ax - bx;
    });
    // 각 링을 최근접 이웃 경로로 얽는다 — 링이 얇아(몇 픽셀) 경로가 윤곽을 따라 돈다.
    // pathComp 로 각 지점이 몇 번째 글자(성분)인지 함께 남긴다
    var path = [], pathComp = [];
    for (var c0 = 0; c0 < comps.length; c0++) {
      var pts = [];
      for (var c1 = 0; c1 < comps[c0].length; c1++) {
        var qq = comps[c0][c1];
        pts.push([qq % SS / SS, ((qq - qq % SS) / SS) / SS]);
      }
      var used = [], cur2 = 0;
      for (var s2 = 0; s2 < pts.length; s2++) {
        path.push(pts[cur2]); pathComp.push(c0); used[cur2] = 1;
        var bi2 = -1, bd2 = 1e9;
        for (var j2 = 0; j2 < pts.length; j2++) {
          if (used[j2]) continue;
          var ddx = pts[j2][0] - pts[cur2][0], ddy = pts[j2][1] - pts[cur2][1];
          var dd = ddx * ddx + ddy * ddy;
          if (dd < bd2) { bd2 = dd; bi2 = j2; }
        }
        if (bi2 < 0) break;
        cur2 = bi2;
      }
    }
    // 경로를 따라 균등 간격으로 NPIN개 — 윤곽 위 등 간격 핀.
    // PINC 는 핀의 글자 번호, RUNS 는 글자별 핀 구간 [시작, 끝) — 채움 올이 글자 안에서만 놀게
    for (var k = 0; k < NPIN; k++) {
      var pi = Math.floor(k * path.length / NPIN) % path.length;
      PINS.push(path[pi]);
      PINC.push(pathComp[pi]);
      if (!RUNS.length || RUNS[RUNS.length - 1][0] !== pathComp[pi]) RUNS.push([pathComp[pi], k, k + 1]);
      else RUNS[RUNS.length - 1][2] = k + 1;
    }
  })();

  var CX = 0, CY = 0;
  function pinPx(i) {
    var u = PINS[i % PINS.length];
    var s = Math.min(W, H);
    // 글자 종횡비 유지 — 늘어나지 않게, 가로만 여유 있게
    return [CX + (u[0] - 0.5) * s * 1.5, CY + (u[1] - 0.5) * s * 1.0];
  }

  function fit() {
    var r = root.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = Math.round(W * dpr); cvEl.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2; CY = H * 0.53;
  }

  function draw(progress, t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgb(' + COL_PANEL.join(',') + ')';
    ctx.fillRect(0, 0, W, H);

    // 뒤편 스포트라이트 — createRadialGradient 로 완성 문장을 비춘다
    var lit = 0.5 + 0.5 * progress;
    var sx = W / 2 + Math.sin(t * 0.9) * W * 0.06;
    var sy = H * 0.53 + Math.cos(t * 0.7) * H * 0.05;
    var rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H) * 0.42);
    rg.addColorStop(0, 'rgba(' + COL_GLOW.join(',') + ',' + (0.5 * lit).toFixed(3) + ')');
    rg.addColorStop(1, 'rgba(' + COL_GLOW.join(',') + ',0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);

    var full = Math.floor(progress * STR);
    var n = PINS.length;
    ctx.lineCap = 'round';
    ctx.shadowBlur = 7;
    ctx.shadowColor = 'rgba(' + COL_THRD.join(',') + ',0.45)';
    for (var i = 0; i < full; i++) {
      if (i < n) {
        // 첫 바퀴 — 바로 옆 핀을 이어 글자 윤곽을 진하게 그린다(G 링 → S 링).
        // 글자 사이(성분이 바뀌는 한 올)만 엷고 가늘게 건너간다
        var bridge = PINC[i] !== PINC[(i + 1) % n];
        var a1 = pinPx(i), b1 = pinPx((i + 1) % n);
        ctx.strokeStyle = 'rgba(' + COL_THRD.join(',') + ',' + (bridge ? 0.18 : 0.92) + ')';
        ctx.lineWidth = bridge ? 1.0 : 2.7;
        if (bridge) ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.moveTo(a1[0], a1[1]); ctx.lineTo(b1[0], b1[1]); ctx.stroke();
        if (bridge) ctx.shadowBlur = 7;
      } else {
        // 둘째 바퀴부터 — **같은 글자 안에서만** 5·9·13칸 건너뛴 올로 속을 성기게 채운다.
        // 글자를 넘는 긴 올이 없으니 실 다발이 글자 모양대로만 묶인다
        var f = i - n;
        var run = RUNS[f % RUNS.length];
        var m = run[2] - run[1];
        var c = Math.floor(f / RUNS.length);
        var K2 = [5, 9, 13][c % 3] % Math.max(2, m - 1);
        var q0 = run[1] + (c % m);
        var q1 = run[1] + ((c % m) + K2) % m;
        var a2 = pinPx(q0), b2 = pinPx(q1);
        var recency = (full - i) / STR;
        var alpha = 0.22 + 0.3 * Math.pow(recency, 1.1);
        ctx.strokeStyle = 'rgba(' + COL_THRD.join(',') + ',' + alpha.toFixed(3) + ')';
        ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(a2[0], a2[1]); ctx.lineTo(b2[0], b2[1]); ctx.stroke();
      }
    }
    ctx.shadowBlur = 0;

    // 글자 핀 — 감기가 지나간 핀은 밝게 숨쉰다
    for (var p = 0; p < n; p++) {
      var xy = pinPx(p);
      var pulse = 0.5 + 0.5 * Math.sin(t * 4 - p * 0.3);
      ctx.fillStyle = 'rgba(' + COL_PIN.join(',') + ',' + (0.5 + 0.45 * pulse).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(xy[0], xy[1], 1.5 + 1.2 * pulse, 0, Math.PI * 2); ctx.fill();
    }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1;
  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = ((now - t0) / 1000) % CYCLE;
    // 0→0.8 감기 · 0.8→1 유지 — 유지 구간에도 스포트라이트·핀 맥동이 계속 움직인다
    var progress = Math.min(1, t / CYCLE / 0.8);
    draw(progress, t);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) draw(1, 0);
  });
  fit();
  if (reduce) {
    draw(1, 0);   // reduce — 다 감긴 워드마크 한 장만 고정
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
