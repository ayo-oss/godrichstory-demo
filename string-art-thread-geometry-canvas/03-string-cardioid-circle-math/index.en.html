<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The cardioid — 스트링아트 실 감기 기하 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sc is-demo" id="scRoot" role="application" aria-label="Multiple-rule lab" tabindex="0">
  <canvas class="sc__cv" id="scCv"></canvas>
  <p class="sc__hint">
    <span class="sc__title">The cardioid</span>
    <span class="sc__desc">One rule — pin n to pin k·n — decides which curve you get</span>
  </p>
  <span class="sc__rule" id="scRule">rule k = 2 · curve: cardioid</span>
  <div class="sc__bar">
    <span class="sc__meta">120 pins · k cycles 2·3·4 · cycle 2s</span>
    <span class="sc__meta sc__meta--dim">sin·cos · strokeStyle</span>
  </div>
</div>
</main>
<script>
// 스트링아트 The cardioid(03) — 원 위 n번 핀에서 k·n번 핀으로 감는 배수 규칙의 수학.
// k=2 는 cardioid(The cardioid 곡선), k=3 은 nephroid, k=4 는 3꽃잎 에피사이클로이드.
// 현들이 겹쳐 밝아지는 자리가 이 곡선들을 포락한다 — 극방정식 계열의 하필(下匹) 현 밝기 계산.
// k 가 구간마다 2→3→4 로 바뀌면 곡선 전체가 다시 짜인다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var N     = 120;   // 핀 개수 — 60으로 내리면 곡선이 각져 보인다(변형 2)
  var CYCLE = 2.0;   // k 구간 주기(초)
  // ────────────────────────────────────────────────────

  var root = document.getElementById('scRoot');
  var cvEl = document.getElementById('scCv');
  var ruleEl = document.getElementById('scRule');
  if (!root || !cvEl) return;

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var COL_THRD = tokRGB('--sc-thread');
  var COL_PIN  = tokRGB('--sc-pin');
  var COL_HOT  = tokRGB('--sc-hot');
  var COL_PANEL = tokRGB('--sc-panel');

  var ctx = cvEl.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  var R = 0;
  var RULE_NAMES = ['cardioid', 'nephroid', '3-petal epicycloid'];

  function fit() {
    var r = root.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    cvEl.width = Math.round(W * dpr); cvEl.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = Math.min(W, H) * 0.54;
  }

  function pinXY(i) {
    var a = Math.PI * 2 * i / N - Math.PI / 2;
    return [W / 2 + Math.cos(a) * R, H / 2 + Math.sin(a) * R];
  }

  // k 를 구간마다 2→3→4 로 바꾼다. 감는 동안은 현재 구간의 k 로 전부 감고,
  // 구간이 바뀌는 순간 곡선 전체가 다시 짜인다(실을 다 감는 것과 같은 계산).
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgb(' + COL_PANEL.join(',') + ')';
    ctx.fillRect(0, 0, W, H);

    var phase = (t / CYCLE) % 3;            // 0..3 — 구간마다 k
    var k = 2 + Math.floor(phase);          // 2, 3, 4
    var local = phase - Math.floor(phase);  // 구간 안 진행 0..1
    var label = 'rule k = ' + k + ' · curve ' + RULE_NAMES[k - 2];

    // 감기 진행 — 구간 앞 70% 에 걸어 다 감고 뒤 30% 유지(다 감긴 곡선을 볼 시간)
    var progress = Math.min(1, local / 0.7);
    var total = N;                          // 한 번에 보이는 올 수
    var full = Math.floor(progress * total);

    ctx.lineCap = 'round';
    ctx.shadowBlur = 5;
    for (var i = 0; i < full; i++) {
      var a = pinXY(i), b = pinXY((i * k) % N);
      // 중심에 가까워지는 현(포락선 꼭짓점 쪽)을 강조 + 최근 올 강조
      var mx = (a[0] + b[0]) / 2 - W / 2, my = (a[1] + b[1]) / 2 - H / 2;
      var near = 1 - Math.min(1, Math.sqrt(mx * mx + my * my) / R);
      var recency = (full - i) / total;
      var hot = near > 0.55;
      var alpha = (hot ? 0.72 : 0.58) + 0.26 * Math.pow(recency, 1.5);
      var base = hot ? COL_HOT : COL_THRD;
      ctx.strokeStyle = 'rgba(' + base.join(',') + ',' + Math.min(0.97, alpha).toFixed(3) + ')';
      ctx.shadowColor = 'rgba(' + COL_HOT.join(',') + ',' + (alpha * 0.45).toFixed(3) + ')';
      ctx.lineWidth = (hot ? 1.6 : 1.2) + recency * 1.1;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // 핀 — 순차적으로 숨쉰다(유지 구간에도 맥동)
    for (var p = 0; p < N; p++) {
      var xy = pinXY(p);
      var pulse = 0.5 + 0.5 * Math.sin(t * 4 - p * 0.3);
      ctx.fillStyle = 'rgba(' + COL_PIN.join(',') + ',' + (0.55 + 0.4 * pulse).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(xy[0], xy[1], 1.2 + 1.1 * pulse, 0, Math.PI * 2); ctx.fill();
    }

    if (ruleEl) ruleEl.textContent = label;
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = -1;
  function frame(now) {
    if (t0 < 0) t0 = now;
    draw((now - t0) / 1000);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () {
    fit();
    if (reduce) draw(0.45);
  });
  fit();
  if (reduce) {
    draw(0.45);   // reduce — k=2 cardioid 다 감긴 한 장만 고정
    root.classList.add('is-still');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
