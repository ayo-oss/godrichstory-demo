<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>条件が整って初めて適用ボタンが生きるフィルターシート — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="デモの舞台 — SpaceかEnterで一時停止、Rで最初から、左右の矢印キーで別の値へ">
      <div class="ez__scene" data-role="scene" role="img" aria-label="最小選択数と価格の順序が入力のたびに検査され、両方が整った瞬間に初めて適用ボタンが生きてシートが閉じる場面"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">場面の準備</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">一時停止</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
    // ── 527 바텀 시트 공통 — 무대 좌표·문구 틀·요소 조립·스냅/던짐/보간 엔진 (526 core.ts 계승)
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    // ── 무대 요소
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // 장면 안 요소를 만든다. 클래스는 cx 를 거쳐 CSS 모듈 이름으로 바뀐다
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        // clkEl(시계)은 sceneEl 에 직접 붙어 있으므로 래퍼만 비운다 — 시계를 지우면 렌더 시계가 죽는다
        scWrap.textContent = '';
        chartEl.textContent = '';
        probeEl.textContent = '';
    }
    // 정점 오프셋 — 시드 해시(재생해도 같은 값). Math.random 을 쓰지 않는다
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    // ── 엔진이 푼 시간 읽기 — getAnimations() 값
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function spanOf(d, dur) { return { s: d, e: d + dur, k: 0 }; }
    // ── 아래 차트 상자 그리기 — 드래그(k0)·スナップ移動(k1)·閉じる(k2)
    function bar(cls, x, y, w, h) {
        const e = make('i', cls, chartEl);
        put(e, x, y, w, h);
        return e;
    }
    function drawRows(segs, max) {
        const n = segs.length;
        const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
        const out = [];
        for (let i = 0; i < n; i += 1) {
            const sg = segs[i];
            const x = CX0 + clamp(sg.s, 0, max) / max * CW;
            const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
            out.push(bar('bar k' + sg.k, x, 5 + i * (h + 1), w, h));
        }
        return out;
    }
    function axis(max) {
        const a = make('b', 'ax', chartEl);
        a.textContent = '0';
        put(a, CX0, 40, 0, 0);
        const b = make('b', 'ax ax--r', chartEl);
        b.textContent = f0(max) + 'ms';
        put(b, CX0 + CW - 60, 40, 60, 0);
    }
    let headEl = null;
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    // ── 바텀 시트 엔진 — 이 편의 주역 계산을 9종이 공유한다
    // 스냅 지점(px) — 閉じる 0 · 반 196 · 전체 392. 시트 높이 h(px) 는 가상 뷰포트 좌표다
    const snapPoints = [0, 196, 392]; // 스냅 지점 배열(閉じる·반·전체)
    const SNAP_POINTS_PX = snapPoints;
    // nearestSnap — 손 뗀 높이에서 각 지점까지 거리(distance)를 재 최근접 단계를 판정한다.
    //   타이(294px 지점의 98 대 98)는 위 단계가 이긴다 — 거리 판정의 동점 규칙
    function nearestSnap(h, pts) {
        let best = pts[0];
        let bestD = Infinity;
        for (let i = 0; i < pts.length; i += 1) {
            const distance = Math.abs(h - pts[i]); // 각 지점까지의 거리
            if (distance < bestD) {
                bestD = distance;
                best = pts[i];
            } // 등호 없음 = 타이면 먼 저 온(더 위의) 지점이 유지된다
        }
        return best;
    }
    // flingSnap — 놓기 속도(vMs, px/ms)가 임계를 넘으면 던진 방향의 다음 단계로 통과,
    //   아니면 최근접. 上へ投げ(vMs>0)=더 높은 단계, 아래 던짐=더 낮은 단계 — 우선순위 계산
    function flingSnap(h, vMs, pts, thr) {
        if (Math.abs(vMs) >= thr) {
            const up = vMs > 0;
            const hi = pts.filter(function (p) { return p > h; });
            const lo = pts.filter(function (p) { return p < h; });
            if (up && hi.length) {
                return hi[0];
            }
            if (!up && lo.length) {
                return lo[lo.length - 1];
            }
        }
        return nearestSnap(h, pts);
    }
    // travel — 놓기 뒤 スナップ移動(순수 t 함수, ease-out cubic). from→to 를 dur ms 에 걸쳐
    function travel(t, from, to, t0, dur) {
        const k = clamp((t - t0) / dur, 0, 1);
        const e = 1 - Math.pow(1 - k, 3);
        return from + (to - from) * e;
    }
    // vOf — 주입 경로의 놓기 속도(px/ms): (route(t) - route(t-dt)) / dt. 02 의 주인공
    function vOf(route, t, dt) {
        return (route(t) - route(Math.max(0, t - dt))) / dt;
    }
    // ── 시트 요소 조립 — .sheet(.sh-head(.sh-handle)+.sh-body) 를 만든다
    // 화면 배치: 시트는 장면(bottom:0)에 붙어 있고 높이 h(가상 px) 를 SHEET_SCALE 0.5 로 그린다
    //   h=0(閉じる) → translateY(200px)(장면 밖) · h=196(반) → translateY(102px) · h=392(전체) → translateY(0)
    const SHEET_SCALE = 0.5;
    const SHEET_MAX_SCR = 200; // 392px × 0.5 반올림 — 시트의 최대 화면 높이
    function mkSheet() {
        const el = make('div', 'sheet', scWrap);
        const head = make('div', 'sh-head', el);
        make('i', 'sh-handle', head);
        const body = make('div', 'sh-body', el);
        return { el: el, head: head, body: body };
    }
    // putSheet — 높이 h(가상 px) 를 화면 배치로. translateY 로만 움직인다(will-change: transform)
    function putSheet(sh, h) {
        const hh = clamp(h * SHEET_SCALE, 0, SHEET_MAX_SCR);
        sh.el.style.height = f1(SHEET_MAX_SCR) + 'px';
        sh.el.style.transform = 'translateY(' + f1(SHEET_MAX_SCR - hh) + 'px)';
    }
    // setDim — 백드랍 보간: ratio = h/392 를 DIM_CURVE 지수로 구부려 알파에 곱한다(04 주인공)
    function setDim(bd, h, curve, maxA) {
        if (!bd) {
            return;
        }
        const ratio = clamp(h / 392, 0, 1);
        const interp = Math.pow(ratio, curve); // 보간값 — ratio^DIM_CURVE
        const alpha = interp * maxA;
        bd.style.opacity = f2(alpha);
    }
    // ── 포인터 이벤트 좌표를 무대(480x300) 좌표로 — 실제 손 조작 경로 공용
    function stagePoint(e) {
        const r = sceneEl.getBoundingClientRect();
        const k = (rootEl.clientWidth / W) || 1;
        return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k };
    }
    // ── 실행 퀄: 프리셋 하나가 한 주기. 시계 애니메이션이 끝나면 다음 프리셋으로 다시 시작한다
    let piNow = 0; // 현재 프리셋 번호 — frame 안에서도 읽는다(run 의 pi 를 노출)
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            piNow = pi;
            cycle = Math.max(2000, cfg.build(pi));
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                setPaused(true);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            // 움직임 줄이기 — 루프를 돌리지 않고 완료 상태 한 장(frame(1e9) 1회) + 문구(393 규칙)
            cfg.frame(1e9);
            statusP.textContent = readB.textContent;
            doneP.textContent = readB.textContent;
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }
    // 07 필터 시트 — 최소 선택 수(MIN_SELECT 1)와 가격 범위 순서(min ≤ max)를 매 입력마다
    //    검사해(applyGate07) 둘 다 참일 때만 適用 버튼이 활성화(enabled)된다. 아닌 동안은
    //    시트가 닫히지 않고 붙어 있다 — 닫힘이 조건에 잠긴 게이트 판정
    const MIN_SELECT = 1;
    const minSelect = MIN_SELECT; // minSelect — 최소 선택 수
    function applyGate(n, lo, hi) { return n >= minSelect && lo <= hi; } // applyGate — 게이트 판정              // minSelect — 최소 선택 수(07 칩)
    const CLOSE_MS = 420;
    let sh07 = null;
    let bd07 = null;
    let chips07 = [];
    let lo07 = null;
    let hi07 = null;
    let btn07 = null;
    // 시연 상태 — 위반(0선택·min>max) → 수리(선택+순서) → 활성 → 適用 閉じる
    function state07(t) {
        if (t < 500) {
            return { n: 0, lo: 900, hi: 200 };
        } // 둘 다 위반
        if (t < 1000) {
            return { n: 0, lo: 100, hi: 200 };
        } // 순서 수리, 선택 부족
        if (t < 1500) {
            return { n: 2, lo: 100, hi: 200 };
        } // 둘 다 참 → 활성
        return { n: 2, lo: 100, hi: 200 };
    }
    function frame(t) {
        if (!sh07) {
            return '';
        }
        const s = state07(t);
        const ok = s.n >= MIN_SELECT && s.lo <= s.hi;
        let h = 196;
        let ph = '条件違反 — 適用は無効';
        if (t < 500) {
            ph = '条件違反 — 適用は無効';
        }
        else if (t < 1000) {
            ph = '修復中 — 条件を満たす';
        }
        else if (t < 1500) {
            ph = '修復中 — 条件を満たす';
        }
        else {
            ph = '適用 — 閉じる';
            h = travel(t, 196, 0, 1500, CLOSE_MS);
        }
        putSheet(sh07, h);
        setDim(bd07, h, 1.0, 0.44);
        if (btn07) {
            btn07.setAttribute('aria-disabled', ok ? 'false' : 'true');
            btn07.className = cx(ok ? 'applybtn is-enabled' : 'applybtn');
        }
        for (let k = 0; k < chips07.length; k += 1) {
            chips07[k].setAttribute('aria-pressed', k < s.n ? 'true' : 'false');
        }
        if (lo07) {
            lo07.textContent = f0(s.lo);
        }
        if (hi07) {
            hi07.textContent = f0(s.hi);
        }
        if (t >= 1500 + CLOSE_MS - 20) {
            doneP.textContent = fill('適用 {a}件 · {b}', f0(s.n), f0(s.hi));
        }
        return fill('今 {a} · 選択 {b} · 価格 {c}', ph, f0(s.n), s.lo + '≤' + s.hi);
    }
    function build(_i) {
        bd07 = make('i', 'bkdrop', scWrap);
        put(bd07, 0, 0, 448, 156);
        sh07 = mkSheet();
        chips07 = [];
        const lab = make('b', 'ov ovs', sh07.body);
        put(lab, 12, 6, 100, 10);
        for (let k = 0; k < 2; k += 1) {
            const chip = make('b', 'chip', sh07.body);
            chip.textContent = fill('チップ {a}', f0(k + 1));
            chip.setAttribute('role', 'button');
            chip.setAttribute('aria-pressed', 'false');
            put(chip, 12 + k * 56, 20, 48, 14);
            chips07.push(chip);
        }
        lo07 = make('b', 'pricebox', sh07.body);
        put(lo07, 12, 42, 44, 16);
        hi07 = make('b', 'pricebox', sh07.body);
        put(hi07, 64, 42, 44, 16);
        btn07 = document.createElement('button');
        btn07.type = 'button';
        btn07.className = cx('applybtn');
        btn07.textContent = '適用';
        btn07.setAttribute('aria-disabled', 'true');
        sh07.body.appendChild(btn07);
        put(btn07, 330, 40, 76, 20);
        drawRows([spanOf(500, 1000), { s: 1500, e: 1500 + CLOSE_MS, k: 2 }], 2000);
        axis(2000);
        setReads(fill('MIN_SELECT {a} · min ≤ max · 2つの条件が成り立つときだけ適用ボタンが有効', f0(MIN_SELECT)), '条件が足りない間は適用が死んでいてシートは留まる — 閉じるが条件で閉ざされる');
        doneP.textContent = '';
        return 2000;
    }
    // 실제 입력 경로 — 매 입력마다 재검사하는 게이트. 위반 중에는 적용이 눌리지 않는다
    function applyGate07() {
        const chipOn = chips07.filter(function (c) { return c.getAttribute('aria-pressed') === 'true'; }).length;
        const ok = chipOn >= MIN_SELECT;
        if (btn07) {
            btn07.setAttribute('aria-disabled', ok ? 'false' : 'true');
            btn07.className = cx(ok ? 'applybtn is-enabled' : 'applybtn');
        }
        return ok;
    }
    sceneEl.addEventListener('click', function (ev) {
        const tgt = ev.target;
        for (let k = 0; k < chips07.length; k += 1) {
            if (chips07[k] && tgt === chips07[k]) {
                chips07[k].setAttribute('aria-pressed', chips07[k].getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
                applyGate07();
                return;
            }
        }
        if (btn07 && (tgt === btn07 || btn07.contains(tgt)) && applyGate07() && sh07 && bd07) {
            putSheet(sh07, 0);
            setDim(bd07, 0, 1.0, 0.44);
            doneP.textContent = '適用 — 閉じる';
        }
    });
    return run({ count: 1, build: build, frame: frame });
}
})();
</script>
</body>
</html>
