<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손 뗀 곳에서 가장 가까운 단계로 멈추는 3단 스냅 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, 왼쪽·오른쪽 방향키로 다른 값으로">
      <div class="ez__scene" data-role="scene" role="img" aria-label="세 스냅 지점까지의 거리를 재 최근접 단계로 끌려가다 294px 지점에서는 같은 98px 거리를 이기고 전체 단계가 되는 장면"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">장면 준비</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
    // ── 527 바텀 시트 공통 — 무대 좌표·문구 틀·요소 조립·스냅/던짐/보간 엔진 (526 core.ts 계승)
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    // ── 무대 요소
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // 장면 안 요소를 만든다. 클래스는 cx 를 거쳐 CSS 모듈 이름으로 바뀐다
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        // clkEl(시계)은 sceneEl 에 직접 붙어 있으므로 래퍼만 비운다 — 시계를 지우면 렌더 시계가 죽는다
        scWrap.textContent = '';
        chartEl.textContent = '';
        probeEl.textContent = '';
    }
    // 정점 오프셋 — 시드 해시(재생해도 같은 값). Math.random 을 쓰지 않는다
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    // ── 엔진이 푼 시간 읽기 — getAnimations() 값
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function spanOf(d, dur) { return { s: d, e: d + dur, k: 0 }; }
    // ── 아래 차트 상자 그리기 — 드래그(k0)·스냅 이동(k1)·닫힘(k2)
    function bar(cls, x, y, w, h) {
        const e = make('i', cls, chartEl);
        put(e, x, y, w, h);
        return e;
    }
    function drawRows(segs, max) {
        const n = segs.length;
        const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
        const out = [];
        for (let i = 0; i < n; i += 1) {
            const sg = segs[i];
            const x = CX0 + clamp(sg.s, 0, max) / max * CW;
            const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
            out.push(bar('bar k' + sg.k, x, 5 + i * (h + 1), w, h));
        }
        return out;
    }
    function axis(max) {
        const a = make('b', 'ax', chartEl);
        a.textContent = '0';
        put(a, CX0, 40, 0, 0);
        const b = make('b', 'ax ax--r', chartEl);
        b.textContent = f0(max) + 'ms';
        put(b, CX0 + CW - 60, 40, 60, 0);
    }
    let headEl = null;
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    // ── 바텀 시트 엔진 — 이 편의 주역 계산을 9종이 공유한다
    // 스냅 지점(px) — 닫힘 0 · 반 196 · 전체 392. 시트 높이 h(px) 는 가상 뷰포트 좌표다
    const snapPoints = [0, 196, 392]; // 스냅 지점 배열(닫힘·반·전체)
    const SNAP_POINTS_PX = snapPoints;
    // nearestSnap — 손 뗀 높이에서 각 지점까지 거리(distance)를 재 최근접 단계를 판정한다.
    //   타이(294px 지점의 98 대 98)는 위 단계가 이긴다 — 거리 판정의 동점 규칙
    function nearestSnap(h, pts) {
        let best = pts[0];
        let bestD = Infinity;
        for (let i = 0; i < pts.length; i += 1) {
            const distance = Math.abs(h - pts[i]); // 각 지점까지의 거리
            if (distance < bestD) {
                bestD = distance;
                best = pts[i];
            } // 등호 없음 = 타이면 먼 저 온(더 위의) 지점이 유지된다
        }
        return best;
    }
    // flingSnap — 놓기 속도(vMs, px/ms)가 임계를 넘으면 던진 방향의 다음 단계로 통과,
    //   아니면 최근접. 위로 던짐(vMs>0)=더 높은 단계, 아래 던짐=더 낮은 단계 — 우선순위 계산
    function flingSnap(h, vMs, pts, thr) {
        if (Math.abs(vMs) >= thr) {
            const up = vMs > 0;
            const hi = pts.filter(function (p) { return p > h; });
            const lo = pts.filter(function (p) { return p < h; });
            if (up && hi.length) {
                return hi[0];
            }
            if (!up && lo.length) {
                return lo[lo.length - 1];
            }
        }
        return nearestSnap(h, pts);
    }
    // travel — 놓기 뒤 스냅 이동(순수 t 함수, ease-out cubic). from→to 를 dur ms 에 걸쳐
    function travel(t, from, to, t0, dur) {
        const k = clamp((t - t0) / dur, 0, 1);
        const e = 1 - Math.pow(1 - k, 3);
        return from + (to - from) * e;
    }
    // vOf — 주입 경로의 놓기 속도(px/ms): (route(t) - route(t-dt)) / dt. 02 의 주인공
    function vOf(route, t, dt) {
        return (route(t) - route(Math.max(0, t - dt))) / dt;
    }
    // ── 시트 요소 조립 — .sheet(.sh-head(.sh-handle)+.sh-body) 를 만든다
    // 화면 배치: 시트는 장면(bottom:0)에 붙어 있고 높이 h(가상 px) 를 SHEET_SCALE 0.5 로 그린다
    //   h=0(닫힘) → translateY(200px)(장면 밖) · h=196(반) → translateY(102px) · h=392(전체) → translateY(0)
    const SHEET_SCALE = 0.5;
    const SHEET_MAX_SCR = 200; // 392px × 0.5 반올림 — 시트의 최대 화면 높이
    function mkSheet() {
        const el = make('div', 'sheet', scWrap);
        const head = make('div', 'sh-head', el);
        make('i', 'sh-handle', head);
        const body = make('div', 'sh-body', el);
        return { el: el, head: head, body: body };
    }
    // putSheet — 높이 h(가상 px) 를 화면 배치로. translateY 로만 움직인다(will-change: transform)
    function putSheet(sh, h) {
        const hh = clamp(h * SHEET_SCALE, 0, SHEET_MAX_SCR);
        sh.el.style.height = f1(SHEET_MAX_SCR) + 'px';
        sh.el.style.transform = 'translateY(' + f1(SHEET_MAX_SCR - hh) + 'px)';
    }
    // setDim — 백드랍 보간: ratio = h/392 를 DIM_CURVE 지수로 구부려 알파에 곱한다(04 주인공)
    function setDim(bd, h, curve, maxA) {
        if (!bd) {
            return;
        }
        const ratio = clamp(h / 392, 0, 1);
        const interp = Math.pow(ratio, curve); // 보간값 — ratio^DIM_CURVE
        const alpha = interp * maxA;
        bd.style.opacity = f2(alpha);
    }
    // ── 포인터 이벤트 좌표를 무대(480x300) 좌표로 — 실제 손 조작 경로 공용
    function stagePoint(e) {
        const r = sceneEl.getBoundingClientRect();
        const k = (rootEl.clientWidth / W) || 1;
        return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k };
    }
    // ── 실행 퀄: 프리셋 하나가 한 주기. 시계 애니메이션이 끝나면 다음 프리셋으로 다시 시작한다
    let piNow = 0; // 현재 프리셋 번호 — frame 안에서도 읽는다(run 의 pi 를 노출)
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            piNow = pi;
            cycle = Math.max(2000, cfg.build(pi));
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                setPaused(true);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            // 움직임 줄이기 — 루프를 돌리지 않고 완료 상태 한 장(frame(1e9) 1회) + 문구(393 규칙)
            cfg.frame(1e9);
            statusP.textContent = readB.textContent;
            doneP.textContent = readB.textContent;
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }
    // 01 최근접 스냅 — 손을 뗀 시트 높이에서 세 지점(닫힘 0 · 반 196 · 전체 392px)까지의
    //    거리(distance)를 재 가장 가까운 지점으로 이동한다. 294px 지점은 반·전체와 같은 98px —
    //    타이는 위 단계(전체)가 이긴다(nearestSnap 의 동점 규칙)
    const DRAG_FOLLOW = 1.0; // 드래그 추적 비율 — 1.0 은 이동량을 그대로 반영한다(변형: 0.55)
    const SNAP_MS = 460; // 놓기 뒤 스냅 이동 시간
    const RELEASE1_AT = 1350; // 놓기 시각
    const RELEASE_H = [294, 120]; // 프리셋별 놓기 높이 — 294(타이) · 120(반 우세)
    let sh01 = null;
    let bd01 = null;
    let seg01 = null;
    let dA01 = 0;
    let dB01 = 0;
    function drag01(t, rh) {
        // 잠자리(0~350) → 드래그(350~1350, sin 반파) → 놓기. h 는 시작 반(196)에서 출발한다
        if (t < 350) {
            return 196;
        }
        if (t < RELEASE1_AT) {
            const w = Math.sin(Math.PI * (t - 350) / (RELEASE1_AT - 350));
            return 196 + (rh - 196) * DRAG_FOLLOW * w;
        }
        return rh;
    }
    function frame(t) {
        if (!sh01) {
            return '';
        }
        const rh = RELEASE_H[piNow];
        let h;
        let ph;
        if (t < RELEASE1_AT) {
            h = drag01(t, rh);
            ph = t < 350 ? '잠자리' : '드래그 중';
        }
        else {
            // 놓기 — 최근접 거리 판정으로 스냅 이동(travel). 판정은 놓기 순간 한 번
            h = travel(t, rh, nearestSnap(rh, SNAP_POINTS_PX), RELEASE1_AT, SNAP_MS);
            ph = t < RELEASE1_AT + SNAP_MS ? '스냅 이동' : '도착';
        }
        putSheet(sh01, h);
        setDim(bd01, h, 1.0, 0.44);
        dA01 = Math.abs(h - 196);
        dB01 = Math.abs(h - 392);
        return fill('지금 {a} · 높이 {b}px · 반까지 {c}px · 전체까지 {d}px', ph, f0(h), f0(dA01), f0(dB01));
    }
    function build(i) {
        bd01 = make('i', 'bkdrop', scWrap);
        put(bd01, 0, 0, 448, 156);
        sh01 = mkSheet();
        for (let k = 0; k < 3; k += 1) {
            const row = make('i', 'row row--mini', sh01.body);
            put(row, 10, 10 + k * 14, 300, 10);
        }
        seg01 = make('b', 'ov ovs', sceneEl);
        put(seg01, 12, 128, 250, 12);
        drawRows([spanOf(350, 1000), { s: RELEASE1_AT, e: RELEASE1_AT + SNAP_MS, k: 1 }], 2000);
        axis(2000);
        const t1 = RELEASE_H[0];
        setReads(fill('SNAP_POINTS_PX 닫힘 {a} · 반 {b} · 전체 {c}px · 놓기 높이에서 최근젝 거리 판정', f0(SNAP_POINTS_PX[0]), f0(SNAP_POINTS_PX[1]), f0(SNAP_POINTS_PX[2])), i % 2 === 0 ? '294px 놓기 — 타이(98 대 98) → 전체 승리' : '120px 놓기 — 반까지 76px 가장 가깝다');
        if (seg01) {
            seg01.textContent = i % 2 === 0 ? '294px 놓기 — 타이(98 대 98) → 전체 승리' : '120px 놓기 — 반까지 76px 가장 가깝다';
        }
        doneP.textContent = '';
        return 2000;
    }
    // 실제 입력 경로 — pointerdown/move/up 이 같은 최근접 판정을 탄다(핸들·헤드 어디서든)
    let down01 = false;
    let startH01 = 0;
    let baseY01 = 0;
    let target01 = 196;
    let rel01 = 0;
    sceneEl.addEventListener('pointerdown', function (ev) {
        if (!sh01) {
            return;
        }
        down01 = true;
        startH01 = 196;
        baseY01 = stagePoint(ev).y;
        rel01 = 0;
        ev.preventDefault();
    });
    sceneEl.addEventListener('pointermove', function (ev) {
        if (down01 && sh01) {
            const h = clamp(startH01 + (baseY01 - stagePoint(ev).y) * 2 * DRAG_FOLLOW, 0, 392);
            putSheet(sh01, h);
            setDim(bd01, h, 1.0, 0.44);
        }
    });
    function end01(ev) {
        if (!down01 || !sh01) {
            down01 = false;
            return;
        }
        down01 = false;
        const h = clamp(startH01 + (baseY01 - stagePoint(ev).y) * 2 * DRAG_FOLLOW, 0, 392);
        target01 = nearestSnap(h, SNAP_POINTS_PX);
        rel01 = performance.now();
        const step = function (now) {
            if (!sh01) {
                return;
            }
            const k = clamp((now - rel01) / SNAP_MS, 0, 1);
            const hh = h + (target01 - h) * (1 - Math.pow(1 - k, 3));
            putSheet(sh01, hh);
            setDim(bd01, hh, 1.0, 0.44);
            if (k < 1) {
                requestAnimationFrame(step);
            }
        };
        requestAnimationFrame(step);
    }
    sceneEl.addEventListener('pointerup', end01);
    sceneEl.addEventListener('pointercancel', function () { down01 = false; });
    return run({ count: 2, build: build, frame: frame });
}
})();
</script>
</body>
</html>
