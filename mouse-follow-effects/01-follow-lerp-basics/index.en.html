<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow basics — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lb is-demo" id="lb">
  <div class="lb__field" role="img" aria-label="A blue dot and three ghosts chase a small cursor ring, one beat behind">
    <span class="lb__ghost lb__ghost--3" aria-hidden="true"></span>
    <span class="lb__ghost lb__ghost--2" aria-hidden="true"></span>
    <span class="lb__ghost lb__ghost--1" aria-hidden="true"></span>
    <span class="lb__dot" id="lbDot" aria-hidden="true"></span>
    <span class="lb__cursor" id="lbCursor" aria-hidden="true"></span>
  </div>
  <p class="lb__hint">Move the mouse and the dot trails a beat behind</p>
</div>
</main>
<script>
var root = document.getElementById('lb');
var field = root.querySelector('.lb__field');
var cursorEl = document.getElementById('lbCursor');
var dotEl = document.getElementById('lbDot');
var ghosts = Array.prototype.slice.call(root.querySelectorAll('.lb__ghost')).reverse();
// ghosts[0] 이 점 바로 뒤, ghosts[2] 가 가장 느리다 (DOM 역순으로 담았다)

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// lerp: 매 프레임 남은 거리의 일부만 더 가는 선형 보간 — factor 가 작을수록 한 박자 늦게 따라온다
function lerp(a, b, k) { return a + (b - a) * k; }

var target = { x: 0, y: 0 };
var dot = { x: 0, y: 0 };
var trail = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];
var factors = [0.10, 0.065, 0.04];

function center() {
  var r = field.getBoundingClientRect();
  return { x: r.width / 2, y: r.height / 2 };
}

function setTarget(cx, cy) {
  var r = field.getBoundingClientRect();
  target.x = cx - r.left;
  target.y = cy - r.top;
}

function draw() {
  cursorEl.style.transform = 'translate3d(' + (target.x - 9) + 'px,' + (target.y - 9) + 'px,0)';
  dotEl.style.transform = 'translate3d(' + (dot.x - 7) + 'px,' + (dot.y - 7) + 'px,0)';
  for (var i = 0; i < trail.length; i++) {
    ghosts[i].style.transform = 'translate3d(' + (trail[i].x - 5) + 'px,' + (trail[i].y - 5) + 'px,0)';
  }
}

function tick() {
  dot.x = lerp(dot.x, target.x, 0.16);
  dot.y = lerp(dot.y, target.y, 0.16);
  var prev = dot;
  for (var i = 0; i < trail.length; i++) {
    trail[i].x = lerp(trail[i].x, prev.x, factors[i]);
    trail[i].y = lerp(trail[i].y, prev.y, factors[i]);
    prev = trail[i];
  }
  draw();
  requestAnimationFrame(tick);
}

function start() {
  var c = center();
  target = { x: c.x, y: c.y };
  dot = { x: c.x, y: c.y };
  trail = [{ x: c.x, y: c.y }, { x: c.x, y: c.y }, { x: c.x, y: c.y }];
}

window.addEventListener('pointermove', function (e) {
  root.classList.remove('is-demo');
  setTarget(e.clientX, e.clientY);
});
// 터치 폴백: 손가락을 대면 그 지점을 쫓게 한다
window.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  setTarget(e.clientX, e.clientY);
});

start();
if (reduce) {
  // 움직임을 줄이는 설정에서는 쫓기 없이 즉시 따라붙는다
  window.addEventListener('pointermove', function (e) { setTarget(e.clientX, e.clientY); dot = { x: target.x, y: target.y }; draw(); });
} else {
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
