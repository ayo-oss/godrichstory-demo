<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네비게이션 커서 이펙트 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="nv is-demo" id="nv">
  <nav class="nv__bar" aria-label="데모 메뉴">
    <span class="nv__logo" aria-hidden="true">
      <span class="nv__eye"><span class="nv__pupil"></span></span>
      <span class="nv__eye"><span class="nv__pupil"></span></span>
    </span>
    <span class="nv__items" id="nvItems">
      <span class="nv__pill" id="nvPill" aria-hidden="true"></span>
      <button class="nv__item" type="button">홈</button>
      <button class="nv__item" type="button">작품</button>
      <button class="nv__item" type="button">소개</button>
    </span>
  </nav>
  <p class="nv__hint">메뉴 위로 옮기면 알약이 미끄러져 따라옵니다</p>
</div>
</main>
<script>
var root = document.getElementById('nv');
var items = Array.prototype.slice.call(document.querySelectorAll('.nv__item'));
var pill = document.getElementById('nvPill');
var pupils = Array.prototype.slice.call(document.querySelectorAll('.nv__pupil'));
var wrap = document.getElementById('nvItems');

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function lerp(a, b, k) { return a + (b - a) * k; }

// 알약이 가야 할 자리 — 항목의 왼쪽 끝과 폭. getBoundingClientRect 로 잰다
var slot = { x: 0, w: 0 };
var now = { x: 0, w: 0 };
var px = 0.5;
var pxNow = 0.5;

function measure(el) {
  var r = el.getBoundingClientRect();
  var w = wrap.getBoundingClientRect();
  return { x: r.left - w.left, w: r.width };
}

// 미리보기 루프의 알약 자리 — 항목 폭은 글자·폰트·로케일마다 달라지므로 로드 시 실측해
// wrap 에 CSS 변수로 박는다. @keyframes nvSlide 는 이 변수를 읽는다
// (하드코딩 px 는 폰트가 바뀌는 순간 알약이 글자를 넘어선다 — 079-06 수리)
function injectSlots() {
  items.forEach(function (item, i) {
    var s = measure(item);
    wrap.style.setProperty('--p' + i + 'x', s.x.toFixed(1) + 'px');
    wrap.style.setProperty('--p' + i + 'w', s.w.toFixed(1) + 'px');
  });
}

function draw() {
  pill.style.transform = 'translate3d(' + now.x.toFixed(1) + 'px,0,0)';
  pill.style.width = now.w.toFixed(1) + 'px';
  var d = pxNow - 0.5;
  for (var i = 0; i < pupils.length; i++) {
    pupils[i].style.transform = 'translate3d(' + (d * 5).toFixed(1) + 'px,0,0)';
  }
}

function tick() {
  now.x = lerp(now.x, slot.x, 0.16);
  now.w = lerp(now.w, slot.w, 0.16);
  pxNow = lerp(pxNow, px, 0.1);
  draw();
  requestAnimationFrame(tick);
}

items.forEach(function (item, i) {
  item.addEventListener('pointerenter', function (e) {
    root.classList.remove('is-demo');
    slot = measure(item);
    var w = wrap.getBoundingClientRect();
    px = Math.min(1, Math.max(0, (e.clientX - w.left) / w.width));
  });
  item.addEventListener('focus', function () {
    root.classList.remove('is-demo');
    slot = measure(item);
  });
});

// 무대 안 어디서든 로고 눈동자는 커서 x 를 본다
root.addEventListener('pointermove', function (e) {
  var w = wrap.getBoundingClientRect();
  px = Math.min(1, Math.max(0, (e.clientX - w.left) / w.width));
});

function init() {
  slot = measure(items[0]);
  now = { x: slot.x, w: slot.w };
  draw();
}

injectSlots();
init();
// 폰트가 늦게 들어오거나 창이 바뀌면 슬롯이 달라진다 — 재주입 (079-06 수리)
if ('ResizeObserver' in window) new ResizeObserver(injectSlots).observe(wrap);
document.fonts && document.fonts.ready.then(injectSlots);
if (reduce) {
  // reduce 에서는 미끄러짐 없이 즉시 항목 자리에 붙는다
  items.forEach(function (item) {
    item.addEventListener('pointerenter', function () { slot = measure(item); now = { x: slot.x, w: slot.w }; draw(); });
    item.addEventListener('focus', function () { slot = measure(item); now = { x: slot.x, w: slot.w }; draw(); });
  });
} else {
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
