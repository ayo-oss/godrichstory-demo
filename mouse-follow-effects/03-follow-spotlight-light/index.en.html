<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light that follows — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sl is-demo" id="sl">
  <div class="sl__scene" role="img" aria-label="A blob of light wanders the dark stage late, lighting words and stars">
    <p class="sl__word">LIGHT FOLLOWS</p>
    <span class="sl__star" style="left:8%; top:18%" aria-hidden="true"></span>
    <span class="sl__star" style="left:16%; top:64%" aria-hidden="true"></span>
    <span class="sl__star" style="left:83%; top:22%" aria-hidden="true"></span>
    <span class="sl__star" style="left:90%; top:66%" aria-hidden="true"></span>
    <span class="sl__star" style="left:70%; top:80%" aria-hidden="true"></span>
    <span class="sl__star" style="left:28%; top:84%" aria-hidden="true"></span>
    <span class="sl__light" id="slLight" aria-hidden="true"></span>
  </div>
  <p class="sl__hint">Move the mouse and the light chases it a beat behind</p>
</div>
</main>
<script>
var root = document.getElementById('sl');
var scene = root.querySelector('.sl__scene');
var light = document.getElementById('slLight');

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function lerp(a, b, k) { return a + (b - a) * k; }

var target = { x: 0, y: 0 };
var pos = { x: 0, y: 0 };

function setTarget(cx, cy) {
  var r = scene.getBoundingClientRect();
  target.x = cx - r.left;
  target.y = cy - r.top;
}

function draw() {
  // 빛 덩어리는 자기 중심이 좌표에 오도록 절반만큼 뺀다
  light.style.transform = 'translate3d(' + (pos.x - 110) + 'px,' + (pos.y - 110) + 'px,0)';
}

function tick() {
  pos.x = lerp(pos.x, target.x, 0.09);
  pos.y = lerp(pos.y, target.y, 0.09);
  draw();
  requestAnimationFrame(tick);
}

function start() {
  var r = scene.getBoundingClientRect();
  target = { x: r.width / 2, y: r.height / 2 };
  pos = { x: r.width / 2, y: r.height / 2 };
}

window.addEventListener('pointermove', function (e) {
  root.classList.remove('is-demo');
  setTarget(e.clientX, e.clientY);
});
window.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  setTarget(e.clientX, e.clientY);
});

start();
if (reduce) {
  // reduce 에서는 빛이 한가운데에 머문다
  window.addEventListener('pointermove', function (e) { setTarget(e.clientX, e.clientY); pos = { x: target.x, y: target.y }; draw(); });
} else {
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
