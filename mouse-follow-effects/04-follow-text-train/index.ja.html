<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ついてくる文字 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tt is-demo" id="tt">
  <div class="tt__field" role="img" aria-label="「こんにちは」の文字がカーソルを追い、一拍ずつ押し寄せる図">
    <span class="tt__ch">こ</span>
    <span class="tt__ch">ん</span>
    <span class="tt__ch">に</span>
    <span class="tt__ch">ち</span>
    <span class="tt__ch">は</span>
  </div>
  <p class="tt__hint">マウスを動かすと文字が列をなして追ってきます</p>
</div>
</main>
<script>
var root = document.getElementById('tt');
var field = root.querySelector('.tt__field');
var chars = Array.prototype.slice.call(root.querySelectorAll('.tt__ch'));

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function lerp(a, b, k) { return a + (b - a) * k; }

var target = { x: 0, y: 0 };
var spots = [];

function home() {
  // 글자들은 처음에 가로로 늘어서 있다 — .is-demo 를 뗀 정적 상태의 모습
  var r = field.getBoundingClientRect();
  var gap = Math.min(44, (r.width - 60) / (chars.length - 1));
  var startX = r.width / 2 - gap * (chars.length - 1) / 2;
  target = { x: r.width / 2, y: r.height / 2 };
  spots = [];
  for (var i = 0; i < chars.length; i++) {
    spots.push({ x: startX + gap * i, y: r.height / 2 + 26 });
  }
}

function setTarget(cx, cy) {
  var r = field.getBoundingClientRect();
  target.x = cx - r.left;
  target.y = cy - r.top;
}

function draw() {
  for (var i = 0; i < chars.length; i++) {
    chars[i].style.transform = 'translate3d(' + (spots[i].x - 14) + 'px,' + (spots[i].y - 20) + 'px,0)';
  }
}

// 첫 글자는 커서를, 나머지는 앞 글자를 쫓는다 — 계수가 뒤로 갈수록 작아져 기차처럼 밀린다
var follow = [0.22, 0.16, 0.12, 0.09, 0.07];

function tick() {
  spots[0].x = lerp(spots[0].x, target.x, follow[0]);
  spots[0].y = lerp(spots[0].y, target.y - 34, follow[0]);
  for (var i = 1; i < spots.length; i++) {
    spots[i].x = lerp(spots[i].x, spots[i - 1].x, follow[i]);
    spots[i].y = lerp(spots[i].y, spots[i - 1].y + 8, follow[i]);
  }
  draw();
  requestAnimationFrame(tick);
}

window.addEventListener('pointermove', function (e) {
  root.classList.remove('is-demo');
  setTarget(e.clientX, e.clientY);
});
window.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  setTarget(e.clientX, e.clientY);
});

home();
draw();
if (!reduce) {
  requestAnimationFrame(tick);
} else {
  // reduce 에서는 글자가 늘어선 자리에 그대로 머문다
  window.addEventListener('pointermove', function (e) {
    setTarget(e.clientX, e.clientY);
    for (var i = 0; i < spots.length; i++) {
      spots[i].x = target.x - i * 34;
      spots[i].y = target.y;
    }
    draw();
  });
}
</script>
</body>
</html>
