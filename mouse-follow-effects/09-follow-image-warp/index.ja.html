<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画像の歪み追跡 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wp is-demo" id="wp">
  <div class="wp__field" role="img" aria-label="夜明けの風景がカーソル速度で伸びて戻る図">
    <div class="wp__frame">
      <div class="wp__art" id="wpArt">
        <span class="wp__sun" aria-hidden="true"></span>
        <span class="wp__ridge wp__ridge--far" aria-hidden="true"></span>
        <span class="wp__ridge wp__ridge--near" aria-hidden="true"></span>
      </div>
    </div>
  </div>
  <p class="wp__hint">マウスを速く動かすと絵が伸びて戻ります</p>
</div>
</main>
<script>
var root = document.getElementById('wp');
var art = document.getElementById('wpArt');

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function lerp(a, b, k) { return a + (b - a) * k; }

// 커서의 매 프레임 이동량(속도)을 부드럽게 쌓는다 — 멈추면 0으로 꺼진다
var vx = 0, vy = 0;
var sx = 0, sy = 0;
var last = null;

function setFromPointer(cx, cy) {
  if (last) {
    vx = cx - last.x;
    vy = cy - last.y;
  }
  last = { x: cx, y: cy };
}

function tick() {
  // 속도를 매 프레임 12%씩만 남긴다 — 커서가 멈추면 왜곡이 스르르 풀린다
  sx = lerp(sx, vx, 0.24);
  sy = lerp(sy, vy, 0.24);
  vx = lerp(vx, 0, 0.12);
  vy = lerp(vy, 0, 0.12);
  var skew = Math.max(-11, Math.min(11, sx * 0.32));
  var stretch = 1 + Math.min(0.14, Math.abs(sx) * 0.011 + Math.abs(sy) * 0.009);
  art.style.transform = 'skewX(' + skew.toFixed(2) + 'deg) scale(' + stretch.toFixed(3) + ')';
  requestAnimationFrame(tick);
}

window.addEventListener('pointermove', function (e) {
  root.classList.remove('is-demo');
  setFromPointer(e.clientX, e.clientY);
});
window.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  last = null;
  setFromPointer(e.clientX, e.clientY);
});

if (reduce) {
  // reduce 에서는 왜곡 없이 원본 비율로 보인다
  art.style.transform = 'skewX(0deg) scale(1)';
} else {
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
