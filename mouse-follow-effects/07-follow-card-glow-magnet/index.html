<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카드 오버 이펙트 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cg is-demo" id="cg">
  <div class="cg__wrap" role="img" aria-label="카드 안에서 빛 고리가 커서를 쫓고 카드가 커서 쪽으로 살짝 붙는 그림">
    <div class="cg__card" id="cgCard">
      <span class="cg__ring" id="cgRing" aria-hidden="true"></span>
      <p class="cg__title">따라오는 카드</p>
      <p class="cg__desc">빛 고리가 커서를 쫓고 카드가 붙는다</p>
      <span class="cg__dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
  </div>
  <p class="cg__hint">카드 위에서 마우스를 움직여 보세요</p>
</div>
</main>
<script>
var root = document.getElementById('cg');
var card = document.getElementById('cgCard');
var ring = document.getElementById('cgRing');

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function lerp(a, b, k) { return a + (b - a) * k; }

// 링의 목표(카드 안 좌표)와 지금 위치, 카드가 붙을 방향
var t = { x: 0, y: 0 };
var p = { x: 0, y: 0 };
var pull = { x: 0, y: 0 };
var pullNow = { x: 0, y: 0 };

function setTarget(cx, cy) {
  var r = card.getBoundingClientRect();
  t.x = Math.min(r.width, Math.max(0, cx - r.left));
  t.y = Math.min(r.height, Math.max(0, cy - r.top));
  // 카드 중심에서 커서 쪽으로 최대 7px 만 붙는다 (3D 기울임 없이 이동만)
  pull.x = Math.max(-7, Math.min(7, (t.x - r.width / 2) * 0.09));
  pull.y = Math.max(-7, Math.min(7, (t.y - r.height / 2) * 0.12));
}

function draw() {
  // --gx/--gy 는 링 '자신'에게 설정한다 (부모에 두면 상속 규칙에 걸린다)
  ring.style.setProperty('--gx', p.x.toFixed(1));
  ring.style.setProperty('--gy', p.y.toFixed(1));
  card.style.transform = 'translate3d(' + pullNow.x.toFixed(1) + 'px,' + pullNow.y.toFixed(1) + 'px,0)';
}

function tick() {
  p.x = lerp(p.x, t.x, 0.14);
  p.y = lerp(p.y, t.y, 0.14);
  pullNow.x = lerp(pullNow.x, pull.x, 0.1);
  pullNow.y = lerp(pullNow.y, pull.y, 0.1);
  draw();
  requestAnimationFrame(tick);
}

function home() {
  var r = card.getBoundingClientRect();
  t = { x: r.width * 0.5, y: r.height * 0.5 };
  p = { x: r.width * 0.5, y: r.height * 0.5 };
  pull = { x: 0, y: 0 };
  pullNow = { x: 0, y: 0 };
}

window.addEventListener('pointermove', function (e) {
  root.classList.remove('is-demo');
  setTarget(e.clientX, e.clientY);
});
window.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  setTarget(e.clientX, e.clientY);
});

home();
draw();
if (reduce) {
  // reduce 에서는 고리가 카드 한가운데에 머물고 카드는 움직이지 않는다
  window.addEventListener('pointermove', function (e) { setTarget(e.clientX, e.clientY); p = { x: t.x, y: t.y }; pull = { x: 0, y: 0 }; pullNow = { x: 0, y: 0 }; draw(); });
} else {
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
