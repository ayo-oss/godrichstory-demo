<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A background that follows — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bg is-demo" id="bg">
  <div class="bg__scene" role="img" aria-label="A sun rises over hills and grass, its eyes watching the cursor">
    <div class="bg__sky" aria-hidden="true"></div>
    <div class="bg__sun" aria-hidden="true">
      <span class="bg__eye"><span class="bg__pupil"></span></span>
      <span class="bg__eye"><span class="bg__pupil"></span></span>
      <span class="bg__mouth"></span>
    </div>
    <div class="bg__hill bg__hill--far" aria-hidden="true"></div>
    <div class="bg__hill bg__hill--mid" aria-hidden="true"></div>
    <div class="bg__grass" aria-hidden="true">
      <span class="bg__blade"></span><span class="bg__blade"></span><span class="bg__blade"></span>
      <span class="bg__blade"></span><span class="bg__blade"></span><span class="bg__blade"></span>
      <span class="bg__blade"></span><span class="bg__blade"></span><span class="bg__blade"></span>
    </div>
  </div>
  <p class="bg__hint">Move the mouse and the background and grass follow along</p>
</div>
</main>
<script>
var root = document.getElementById('bg');
var scene = root.querySelector('.bg__scene');
var far = root.querySelector('.bg__hill--far');
var mid = root.querySelector('.bg__hill--mid');
var grass = root.querySelector('.bg__grass');
var pupils = Array.prototype.slice.call(root.querySelectorAll('.bg__pupil'));

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function lerp(a, b, k) { return a + (b - a) * k; }

// --px 는 0~1 사이 커서 가로 위치. 풀잎 skewX 가 이 값 하나를 공유해 같이 눕는다
var px = 0.5;
var pxNow = 0.5;

function tick() {
  pxNow = lerp(pxNow, px, 0.08);
  scene.style.setProperty('--px', pxNow.toFixed(4));
  var dx = pxNow - 0.5;
  // 멀수록 조금, 가까울수록 많이 밀린다 — 시차
  far.style.transform  = 'translate3d(' + (dx * -10).toFixed(1) + 'px,0,0)';
  mid.style.transform  = 'translate3d(' + (dx * -22).toFixed(1) + 'px,0,0)';
  grass.style.transform = 'translate3d(' + (dx * -34).toFixed(1) + 'px,0,0)';
  for (var i = 0; i < pupils.length; i++) {
    pupils[i].style.transform = 'translate3d(' + (dx * 7).toFixed(1) + 'px,0,0)';
  }
  requestAnimationFrame(tick);
}

function setFromPointer(cx) {
  var r = scene.getBoundingClientRect();
  px = Math.min(1, Math.max(0, (cx - r.left) / r.width));
}

window.addEventListener('pointermove', function (e) {
  root.classList.remove('is-demo');
  setFromPointer(e.clientX);
});
window.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  setFromPointer(e.clientX);
});

if (reduce) {
  // reduce 에서는 시차 이동 없이 풀잎 눕음만 즉시 값으로 반영한다
  window.addEventListener('pointermove', function (e) {
    setFromPointer(e.clientX);
    scene.style.setProperty('--px', px.toFixed(4));
  });
} else {
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
