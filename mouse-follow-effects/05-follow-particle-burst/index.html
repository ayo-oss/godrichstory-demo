<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화려한 파티클 마우스 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pb is-demo" id="pb">
  <div class="pb__field" role="img" aria-label="커서를 흰 고리가 움직이고 그 뒤로 색색의 파편이 터지는 그림">
    <span class="pb__cursor" id="pbCursor" aria-hidden="true"></span>
    <span class="pb__p pb__p--dot" aria-hidden="true"></span>
    <span class="pb__p pb__p--ring" aria-hidden="true"></span>
    <span class="pb__p pb__p--dot" aria-hidden="true"></span>
    <span class="pb__p pb__p--gem" aria-hidden="true"></span>
    <span class="pb__p pb__p--dot" aria-hidden="true"></span>
    <span class="pb__p pb__p--ring" aria-hidden="true"></span>
    <span class="pb__p pb__p--gem" aria-hidden="true"></span>
    <span class="pb__p pb__p--dot" aria-hidden="true"></span>
  </div>
  <p class="pb__hint">마우스를 빠르게 움직이면 파편이 더 많이 터집니다</p>
</div>
</main>
<script>
var root = document.getElementById('pb');
var field = root.querySelector('.pb__field');
var cursorEl = document.getElementById('pbCursor');
var pool = Array.prototype.slice.call(root.querySelectorAll('.pb__p'));

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
// 오래된 브라우저에서는 파편 없이 커서 고리만 움직이게 둔다 (animate 는 인스턴스 메서드다)
var canAnimate = typeof document.body.animate === 'function';

var colors = ['#ff9ebb', '#4cd4a6', '#b9a0ff', '#6ec8ff', '#ffd23f'];
var shapes = ['pb__p--dot', 'pb__p--ring', 'pb__p--gem'];

var last = null;
var travel = 0;
var next = 0;

// 커서가 이동한 거리를 쌓아 두었다가 26px마다 파편 하나를 터뜨린다 — 속도에 비례한다
function spawn(x, y, dx, dy) {
  var element = pool[next];
  next = (next + 1) % pool.length;
  element.className = 'pb__p ' + shapes[(Math.random() * shapes.length) | 0];
  // 모양마다 --pc 를 색으로 쓴다 (점은 배경, 고리는 테두리, 마름모는 배경)
  element.style.setProperty('--pc', colors[(Math.random() * colors.length) | 0]);
  var ang = Math.atan2(dy, dx) + (Math.random() - 0.5) * 2.4;
  var dist = 34 + Math.random() * 46;
  var tx = x + Math.cos(ang) * dist;
  var ty = y + Math.sin(ang) * dist;
  element.animate([
    { transform: 'translate3d(' + (x - 5) + 'px,' + (y - 5) + 'px,0) rotate(0deg) scale(1)', opacity: 1 },
    { transform: 'translate3d(' + (tx - 5) + 'px,' + (ty - 5) + 'px,0) rotate(200deg) scale(.15)', opacity: 0 }
  ], { duration: 620 + Math.random() * 320, easing: 'cubic-bezier(.2,.8,.2,1)' });
}

function place(cx, cy) {
  var r = field.getBoundingClientRect();
  var x = cx - r.left;
  var y = cy - r.top;
  cursorEl.style.transform = 'translate3d(' + (x - 8) + 'px,' + (y - 8) + 'px,0)';
  if (last) {
    var dx = x - last.x, dy = y - last.y;
    travel += Math.sqrt(dx * dx + dy * dy);
    while (travel > 26) {
      travel -= 26;
      if (!reduce && canAnimate) { spawn(x, y, dx, dy); }
    }
  }
  last = { x: x, y: y };
}

window.addEventListener('pointermove', function (e) {
  root.classList.remove('is-demo');
  place(e.clientX, e.clientY);
});
window.addEventListener('pointerdown', function (e) {
  root.classList.remove('is-demo');
  last = null;
  place(e.clientX, e.clientY);
});
</script>
</body>
</html>
