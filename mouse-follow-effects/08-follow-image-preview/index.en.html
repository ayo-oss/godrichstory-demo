<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hover image preview — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="iv is-demo" id="iv">
  <div class="iv__scene" role="img" aria-label="The picture of the hovered row floats up and chases the cursor">
    <ul class="iv__list">
      <li><button class="iv__row" type="button" data-scene="night">Lanterns in the night sky</button></li>
      <li><button class="iv__row" type="button" data-scene="sea">An afternoon by the sea</button></li>
      <li><button class="iv__row" type="button" data-scene="forest">Morning in the forest</button></li>
    </ul>
    <div class="iv__preview" id="ivPreview" aria-hidden="true">
      <span class="iv__art iv__art--night"></span>
      <span class="iv__art iv__art--sea"></span>
      <span class="iv__art iv__art--forest"></span>
      <span class="iv__ribbon" id="ivRibbon">Lanterns in the night sky</span>
    </div>
  </div>
  <p class="iv__hint">Hover a row and its picture follows you around</p>
</div>
</main>
<script>
var root = document.getElementById('iv');
var preview = document.getElementById('ivPreview');
var ribbon = document.getElementById('ivRibbon');
var rows = Array.prototype.slice.call(document.querySelectorAll('.iv__row'));
var arts = { night: 0, sea: 1, forest: 2 };

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function lerp(a, b, k) { return a + (b - a) * k; }

var t = { x: 0, y: 0 };
var p = { x: 0, y: 0 };
var rot = 0;
var rotNow = 0;
var lastX = null;

function sceneRect() { return root.querySelector('.iv__scene').getBoundingClientRect(); }

function show(idx, label) {
  var cards = preview.querySelectorAll('.iv__art');
  for (var i = 0; i < cards.length; i++) {
    // 보여줄 장면만 opacity 1 — 나머지는 공간을 유지한 채 감춘다
    cards[i].style.opacity = i === idx ? '1' : '0';
  }
  ribbon.textContent = label;
}

function place(cx, cy) {
  var r = sceneRect();
  t.x = Math.min(r.width - 90, Math.max(90, cx - r.left));
  t.y = Math.min(r.height - 60, Math.max(60, cy - r.top));
  if (lastX !== null) {
    rot = Math.max(-7, Math.min(7, (cx - lastX) * 0.35));
  }
  lastX = cx;
}

function draw() {
  preview.style.transform = 'translate3d(' + (p.x - 75).toFixed(1) + 'px,' + (p.y - 55).toFixed(1) + 'px,0) rotate(' + rotNow.toFixed(1) + 'deg)';
}

function tick() {
  p.x = lerp(p.x, t.x, 0.13);
  p.y = lerp(p.y, t.y, 0.13);
  rotNow = lerp(rotNow, rot, 0.1);
  rot = lerp(rot, 0, 0.06);
  draw();
  requestAnimationFrame(tick);
}

function home() {
  var r = sceneRect();
  t = { x: r.width - 100, y: r.height * 0.62 };
  p = { x: t.x, y: t.y };
  rot = 0; rotNow = 0;
}

rows.forEach(function (row) {
  row.addEventListener('pointerenter', function (e) {
    root.classList.remove('is-demo');
    show(arts[row.dataset.scene], row.textContent);
    place(e.clientX, e.clientY);
  });
  row.addEventListener('focus', function () {
    root.classList.remove('is-demo');
    show(arts[row.dataset.scene], row.textContent);
  });
});

root.addEventListener('pointermove', function (e) {
  root.classList.remove('is-demo');
  place(e.clientX, e.clientY);
});

home();
show(0, rows[0].textContent);
draw();
if (reduce) {
  // reduce 에서는 그림이 줄 옆 고정 자리에 붙어 돌아다니지 않는다
  window.addEventListener('pointermove', function (e) {
    place(e.clientX, e.clientY);
    var r = sceneRect();
    p = { x: r.width - 100, y: r.height * 0.62 };
    rotNow = 0;
    draw();
  });
} else {
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
