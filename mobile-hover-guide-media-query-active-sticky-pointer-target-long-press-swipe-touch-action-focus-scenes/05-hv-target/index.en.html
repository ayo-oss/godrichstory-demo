<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touch Target Size: Press Error at 24px and 44px — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="Demo stage: Space or Enter pauses, R restarts, T toggles touch mode, Left and right arrows pick the button size to highlight">
    <canvas class="ez__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="A scene scattering finger contact samples over 24px and 44px button rows to compare neighbor mispress rates"></canvas>
  </div>
  <p class="ez__status" data-role="status" aria-live="off">Scene ready</p>
  <div class="ez__ctrl">
    <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
    <button class="ez__pause" data-role="sim" type="button" aria-pressed="false">Touch mode</button>
  </div>
  <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function main(root) {
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 파스텔 팔레트 — 바탕은 짙은 자두색, 상자는 연한 색, 글자는 연한 색 또는 짙은 잉크
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    const ROSE = [244, 162, 186];
    const MINT = [148, 212, 182];
    const SKY = [150, 192, 244];
    const SUN = [250, 218, 146];
    const LILAC = [196, 176, 244];
    const NEU = [236, 230, 250];
    const BGC = [46, 42, 68];
    const PANEL = [62, 57, 92];
    const GRID = [92, 86, 124];
    const DIM = [196, 190, 224];
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    function f3(v) { return (Math.round(v * 1000) / 1000).toFixed(3); }
    function pct(v) { return String(Math.round(v * 100)); }
    // ── 이징 계산. 모두 진행률 p(0 에서 1) 를 받아 변화량 비율을 돌려준다
    const LINEAR = function (p) { return clamp(p, 0, 1); };
    // 3차 곡선 한 점 — 제어값 두 개(a, b) 와 매개값 s 로 좌표 하나를 얻는다
    function bz(a, b, s) {
        const u = 1 - s;
        return 3 * u * u * s * a + 3 * u * s * s * b + s * s * s;
    }
    // CSS cubic-bezier(x1, y1, x2, y2) 와 같은 곡선. 시간 p 에 맞는 매개값 s 를 반으로 줄이는 반복 근사로 찾고 그 s 의 y 를 돌려준다
    function cubic(x1, y1, x2, y2) {
        return function (p) {
            if (p <= 0) {
                return 0;
            }
            if (p >= 1) {
                return 1;
            }
            let lo = 0;
            let hi = 1;
            let s = p;
            for (let i = 0; i < 32; i += 1) {
                s = (lo + hi) / 2;
                if (bz(x1, x2, s) < p) {
                    lo = s;
                }
                else {
                    hi = s;
                }
            }
            return bz(y1, y2, s);
        };
    }
    // CSS steps(n, jump-end) 와 steps(n, jump-start) — 값이 계단으로만 바뀐다
    function stepsFn(n, jumpStart) {
        return function (p) {
            if (p <= 0) {
                return 0;
            }
            if (p >= 1) {
                return 1;
            }
            return jumpStart ? Math.min(1, Math.ceil(p * n) / n) : Math.floor(p * n) / n;
        };
    }
    // CSS linear(점 목록) — 점은 같은 간격 위치에 놓이고 사이는 직선으로 잇는다
    function linearFn(pts) {
        return function (p) {
            if (p <= 0) {
                return pts[0];
            }
            if (p >= 1) {
                return pts[pts.length - 1];
            }
            const x = p * (pts.length - 1);
            const i = Math.floor(x);
            return lerp(pts[i], pts[i + 1], x - i);
        };
    }
    // 순간 속도 — 진행률 곡선의 기울기(길이 1 을 시간 1 에 가는 직선이 1 배)
    function slopeAt(fn, p) {
        const h = 0.002;
        const a = Math.max(0, p - h);
        const b = Math.min(1, p + h);
        return (fn(b) - fn(a)) / (b - a);
    }
    // 목표의 비율 q 에 처음 닿는 시간(0 에서 1) — 반으로 줄이는 반복 근사
    function reachTime(fn, q) {
        let lo = 0;
        let hi = 1;
        for (let i = 0; i < 30; i += 1) {
            const m = (lo + hi) / 2;
            if (fn(m) < q) {
                lo = m;
            }
            else {
                hi = m;
            }
        }
        return hi;
    }
    // ── 그리기 도구
    const rootEl = root;
    const canvasEl = rootEl.querySelector('[data-role="canvas"]');
    const padEl = rootEl.querySelector('[data-role="pad"]');
    const pauseEl = rootEl.querySelector('[data-role="pause"]');
    const statusEl = rootEl.querySelector('[data-role="status"]');
    const doneEl = rootEl.querySelector('[data-role="done"]');
    const simEl = rootEl.querySelector('[data-role="sim"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !doneEl || !statusEl || !simEl) {
        return function () { };
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pad = padEl;
    const pauseBtn = pauseEl;
    const doneP = doneEl;
    const statusP = statusEl;
    const simBtn = simEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const UI_FONT = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    const CODE_FONT = 'ui-monospace, "Cascadia Mono", Consolas, "Noto Sans KR", monospace';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 계산은 늘 480×300 이고 화면 배율만 이 값
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function disc(x, y, r, c, a) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function seg(x1, y1, x2, y2, c, a, w) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = w;
        ctx.lineCap = 'round';
        ctx.stroke();
    }
    // 점선 세로·가로선
    function dash(x1, y1, x2, y2, c, a) {
        ctx.setLineDash([3, 3]);
        seg(x1, y1, x2, y2, c, a, 1);
        ctx.setLineDash([]);
    }
    // 글자 — maxW 가 있으면 그 폭에 들어가도록 글자 크기를 줄인다(문구가 로케일마다 길이가 달라서)
    function text(s, x, y, c, px, weight, align, maxW, mono) {
        const face = mono ? CODE_FONT : UI_FONT;
        let size = px;
        ctx.font = weight + ' ' + size + 'px ' + face;
        if (maxW !== undefined) {
            while (size > 8 && ctx.measureText(s).width > maxW) {
                size -= 0.5;
                ctx.font = weight + ' ' + size + 'px ' + face;
            }
        }
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, 1);
        ctx.fillText(s, x, y);
    }
    function panel(x, y, w, h) { box(x, y, w, h, 10, PANEL, 1); }
    // 아래쪽 눈금 — 상수 이름과 지금 값 · 크기 막대
    function hud(name, val, frac) {
        const label = name + ' ' + val;
        ctx.font = '700 11px ' + CODE_FONT;
        const w = ctx.measureText(label).width + 20;
        const x = 12;
        const y = H - 30;
        box(x, y, w, 20, 10, NEU, 0.96);
        text(label, x + w / 2, y + 10.5, INK, 11, 700, 'center', undefined, true);
        const mx = x + w + 10;
        box(mx, y + 6, 140, 8, 4, [78, 72, 104], 1);
        box(mx, y + 6, 140 * clamp(frac, 0, 1), 8, 4, MINT, 1);
    }
    function gX(g, p) { return g.x + g.w * p; }
    function gY(g, v) { return g.y + g.h * (1 - (v - g.lo) / (g.hi - g.lo)); }
    function graphFrame(g) {
        box(g.x - 6, g.y - 6, g.w + 12, g.h + 12, 8, PANEL, 1);
        seg(g.x, gY(g, 0), g.x + g.w, gY(g, 0), GRID, 1, 1);
        seg(g.x, gY(g, 1), g.x + g.w, gY(g, 1), GRID, 1, 1);
        dash(g.x, gY(g, 0), g.x, gY(g, 1), GRID, 1);
        dash(g.x + g.w, gY(g, 0), g.x + g.w, gY(g, 1), GRID, 1);
    }
    // 곡선 한 줄 — 시간 upTo(0 에서 1) 까지 그리고, 끝에 점을 찍는다
    function plot(g, fn, c, lw, upTo, dot, wash) {
        const n = 72;
        if (wash !== undefined && wash > 0 && upTo > 0) {
            // 곡선 아래를 옅게 채워 진행이 면으로 보이게 한다
            ctx.beginPath();
            ctx.moveTo(gX(g, 0), gY(g, 0));
            for (let i = 0; i <= n; i += 1) {
                const p = (i / n) * upTo;
                ctx.lineTo(gX(g, p), gY(g, fn(p)));
            }
            ctx.lineTo(gX(g, upTo), gY(g, 0));
            ctx.closePath();
            ctx.fillStyle = rgba(c, wash);
            ctx.fill();
        }
        ctx.beginPath();
        for (let i = 0; i <= n; i += 1) {
            const p = (i / n) * upTo;
            const px = gX(g, p);
            const py = gY(g, fn(p));
            if (i === 0) {
                ctx.moveTo(px, py);
            }
            else {
                ctx.lineTo(px, py);
            }
        }
        ctx.strokeStyle = rgba(c, 1);
        ctx.lineWidth = lw;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        if (dot) {
            disc(gX(g, upTo), gY(g, fn(upTo)), lw + 1.5, c, 1);
        }
    }
    // ── 시간·상태·낭독
    let sceneT = 0;
    let lap = 0;
    let paused = false;
    let still = false;
    let lastStatus = '';
    let lastMode = -9;
    // reduce 시뮬레이션 스위치 — 운영체제 설정을 건드리지 않고 reduce 상태를 켜 본다
    let simOn = false;
    // 실제 설정이거나 시뮬레이션이 켜졌으면 이 페이지는 reduce 로 동작한다
    function reduceNow() { return still || simOn; }
    function pushStatus(s) {
        if (s === lastStatus) {
            return;
        }
        lastStatus = s;
        statusP.textContent = s;
    }
    // 화면을 한 번 그린다 — 움직임 줄이기이면 시간표 끝(REST_S)의 한 장
    function redraw() {
        const t = still ? REST_S : sceneT;
        ctx.clearRect(0, 0, W, H);
        box(0, 0, W, H, 0, BGC, 1);
        draw(t);
        pushStatus(statusText(t));
        const m = still ? -2 : modeId(t) * 2 + (simOn ? 1 : 0);
        if (m !== lastMode) {
            lastMode = m;
            doneP.textContent = speakText(t);
        }
    }
    // 프레임 간격이 튀어도 한 번에 몰리지 않게 자른다
    const DT_MAX = 0.05;
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        rafId = 0;
        if (still || paused || document.hidden) {
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        sceneT += dt;
        if (sceneT >= LAP_S) {
            sceneT -= LAP_S;
            lap += 1;
        }
        redraw();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 장면이 처음으로 돌아갈 때 해야 할 일이 있으면 이 함수를 바꿔 건다
    let onReset = function () { };
    let onSim = function () { };
    let onSetting = function (v) { void v; };
    function restart() {
        onReset();
        sceneT = 0;
        lap = 0;
        redraw();
        if (!paused && !still) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    const off = new AbortController();
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    still = reduceQuery.matches;
    function setSim(v) {
        simOn = v;
        simBtn.setAttribute('aria-pressed', v ? 'true' : 'false');
        document.documentElement.setAttribute('data-input', v ? 'touch' : 'mouse');
        onSim();
        redraw();
    }
    pauseBtn.addEventListener('click', function () { togglePause(); }, { signal: off.signal });
    simBtn.addEventListener('click', function () { setSim(!simOn); }, { signal: off.signal });
    pad.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            togglePause();
            return;
        }
        if (e.key === 't' || e.key === 'T') {
            e.preventDefault();
            setSim(!simOn);
            return;
        }
        if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            restart();
            return;
        }
        if (onKey(e)) {
            e.preventDefault();
            // 멈춘 채이거나 움직임 줄이기이면 루프가 없으니 바로 다시 그린다
            redraw();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 끝 장면 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        onSetting(still);
        if (still) {
            stopLoop();
            redraw();
        }
        else {
            restart();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        redraw();
    }, { signal: off.signal });
    // 캔버스 좌표(480×300) — 화면 크기와 상관없이 같은 좌표계
    function stageXY(e) {
        const r = cv.getBoundingClientRect();
        return [((e.clientX - r.left) / r.width) * W, ((e.clientY - r.top) / r.height) * H];
    }
    // 쓰는 곡선 두 개 — CSS 기본 키워드와 같은 제어값
    const EASE_OUT = cubic(0, 0, 0.58, 1);
    const EASE_IN_OUT = cubic(0.42, 0, 0.58, 1);
    // 화면이 1초에 60번 그려진다고 보고 값을 잰다
    const FPS = 60;
    // 모든 장면이 쓰는 줄 간격 — 위쪽 44 까지는 상태 줄과 버튼 자리
    const TOP = 44;
    function fm(v, d) { return (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d); }
    // 이름표가 붙은 한 칸. live 이면 지금 이 페이지가 따르는 판이라 색 테두리를 두른다
    function pane(x, y, w, h, title, c, live) {
        box(x, y, w, h, 10, PANEL, 1);
        if (live) {
            box(x, y, w, h, 10, c, 0.12);
            ctx.beginPath();
            ctx.roundRect(x + 1, y + 1, w - 2, h - 2, 9);
            ctx.strokeStyle = rgba(c, 1);
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        text(title, x + 10, y + 11, c, 11, 800, 'left', w - 20);
    }
    // 위치 함수 f(t) 가 t0 에서 t1 까지 가는 길이의 합 — 1/60 초 간격 표본
    function pathLen(f, t0, t1) {
        let sum = 0;
        let prev = f(t0);
        for (let t = t0 + 1 / FPS; t <= t1 + 1e-9; t += 1 / FPS) {
            const v = f(t);
            sum += Math.abs(v - prev);
            prev = v;
        }
        return sum;
    }
    // 비교 막대 한 줄 — Normal 값(ROSE)과 reduce 값(MINT)을 같은 눈금에 겹쳐 놓고 오른쪽에 숫자
    function cmpRow(y, name, a, b, maxV, unit, dec) {
        text(name, 24, y + 8, PAPER, 10.5, 700, 'left', 126);
        const bx = 156;
        const bw = 190;
        box(bx, y + 1, bw, 6, 3, [78, 72, 104], 1);
        box(bx, y + 1, Math.max(2, bw * clamp(a / maxV, 0, 1)), 6, 3, ROSE, 1);
        box(bx, y + 9, bw, 6, 3, [78, 72, 104], 1);
        box(bx, y + 9, Math.max(2, bw * clamp(b / maxV, 0, 1)), 6, 3, MINT, 1);
        text(fm(a, dec) + ' → ' + fm(b, dec) + ' ' + unit, 456, y + 8, SUN, 10.5, 800, 'right', 100, true);
    }
    // 줄어든 비율(%) — Normal 값이 0 이면 0
    function cut(a, b) { return a <= 0 ? 0 : (1 - b / a) * 100; }
    const NORMAL_T = ['Normal', ROSE];
    const REDUCE_T = ['Reduce version', MINT];
    // 칸 전체에 깔리는 옅은 색 — 알파가 지금 움직임의 세기를 따라가 칸이 얼마나 살아 있는지 한눈에 보인다
    function wash(x, a, c) { box(x, TOP, 224, 150, 10, c, clamp(a, 0, 0.5)); }
    // 순간 변화율(초당) — 앞뒤 0.02초의 차이
    function rateAt(f, t) {
        const h = 0.02;
        return Math.abs(f(t + h) - f(t - h)) / (2 * h);
    }
    // 한 프레임에서 가장 크게 바뀐 값을 1초당으로 환산 — 순간 최대 속도
    function peakRate(f, t0, t1) {
        let m = 0;
        let prev = f(t0);
        for (let t = t0 + 1 / FPS; t <= t1 + 1e-9; t += 1 / FPS) {
            const v = f(t);
            m = Math.max(m, Math.abs(v - prev));
            prev = v;
        }
        return m * FPS;
    }
    // 칸 안쪽만 그리도록 자른다 — 끝나면 clipEnd 로 푼다
    function clipPane(x, y, w, h) {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 10);
        ctx.clip();
    }
    function clipEnd() { ctx.restore(); }
    // ── 513 공통 — Mouse version·Touch version 이름표와 입력 도구
    const MOUSE_T = ['Mouse version', ROSE];
    const TOUCH_T = ['Touch version', MINT];
    // Touch mode 스위치(T 키·버튼)가 켜졌는가 — html 속성 data-input 이 같은 값을 갖는다
    function touchOn() { return simOn; }
    // 고정 씨앗 난수 — 같은 씨앗이면 늘 같은 표본
    function rng(seed) {
        let a = seed >>> 0;
        return function () {
            a = (a + 0x6D2B79F5) >>> 0;
            let t = a;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    // 표준정규 한 값 — 두 난수를 받아 한 값으로 접는다
    function gauss(r) {
        const u = Math.max(1e-9, r());
        const v = r();
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
    }
    function prog(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
    function pctOf(n, d) { return d <= 0 ? 0 : (n / d) * 100; }
    function cursor(x, y, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 11, y + 5);
        ctx.lineTo(x + 6, y + 7);
        ctx.lineTo(x + 4, y + 13);
        ctx.closePath();
        ctx.fillStyle = rgba(PAPER, a);
        ctx.fill();
        ctx.strokeStyle = rgba(INK, a);
        ctx.lineWidth = 1;
        ctx.stroke();
    }
    function finger(x, y, r, a) {
        if (a <= 0) {
            return;
        }
        disc(x, y, r, SUN, 0.3 * a);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.strokeStyle = rgba(SUN, a);
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }
    function dashBox(x, y, w, h, r, c, a) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.setLineDash([]);
    }
    // 떠오르는 Card — lift 만큼 위로, 그림자는 바닥에 남아 높이가 보인다
    function card(x, y, w, h, lift, c, sc) {
        const cx = x + w / 2;
        const cy = y + h / 2;
        box(cx - (w * sc) / 2 + 2, cy - (h * sc) / 2 + 4, w * sc, h * sc, 8, [24, 20, 40], 0.3 + 0.012 * lift);
        box(cx - (w * sc) / 2, cy - (h * sc) / 2 - lift, w * sc, h * sc, 8, c, 1);
    }
    // 표 한 칸의 참·거짓 표시
    function tf(x, y, on) {
        disc(x, y, 5, on ? MINT : ROSE, 1);
        text(on ? 'true' : 'false', x + 10, y + 0.5, PAPER, 10.5, 700, 'left', 40, true);
    }
    function sm(p) { return p * p * (3 - 2 * p); }
    // 05 — Touch 목표 크기. 같은 간격의 버튼 줄에 손가락 접촉 중심을 고정 씨앗 표본으로 뿌려 이웃을 잘못 누르는 비율을 센다
    const SIZES = [24, 44];
    let selIdx = 0;
    const TARGET_PX = SIZES[0];
    const GAP_PX = 8;
    // 손가락 접촉 지름 가정 — 접촉 중심이 정확히 어디 떨어지는지가 눌림을 정한다
    const FINGER_PX = 36;
    const SIGMA_TOUCH = 9;
    const SIGMA_MOUSE = 2;
    const SAMPLES = 300;
    const SHOWN = 120;
    // 화면에서는 1px 를 1.3칸으로 키워 그린다 — 계산은 px 그대로
    const K = 1.3;
    const LAP_S = 4.4;
    const REST_S = 3.6;
    const rg = rng(513);
    const GX = [];
    const GY = [];
    for (let i = 0; i < SAMPLES; i += 1) {
        GX.push(gauss(rg));
        GY.push(gauss(rg));
    }
    // 표본 하나가 어디에 떨어지나 — 0 이 노린 가운데 버튼, 1 이 이웃 버튼, 2 가 틈이나 줄 밖
    function outcome(size, sigma, i) {
        const dx = GX[i] * sigma;
        const dy = GY[i] * sigma;
        const pitch = size + GAP_PX;
        if (Math.abs(dy) > size / 2) {
            return 2;
        }
        const k = Math.round(dx / pitch);
        if (Math.abs(dx - k * pitch) > size / 2) {
            return 2;
        }
        if (k === 0) {
            return 0;
        }
        return Math.abs(k) === 1 ? 1 : 2;
    }
    // 크기·퍼짐별 비율 [맞게 누름, 이웃 잘못, 틈·밖] (%)
    function shares(size, sigma) {
        const c = [0, 0, 0];
        for (let i = 0; i < SAMPLES; i += 1) {
            c[outcome(size, sigma, i)] += 1;
        }
        return [pctOf(c[0], SAMPLES), pctOf(c[1], SAMPLES), pctOf(c[2], SAMPLES)];
    }
    const S24 = shares(SIZES[0], SIGMA_TOUCH);
    const S44 = shares(SIZES[1], SIGMA_TOUCH);
    const SM24 = shares(SIZES[0], SIGMA_MOUSE);
    const OCOL = [MINT, ROSE, [150, 144, 180]];
    function side(x, size, sigma, t, c) {
        const cx = x + 112;
        const cy = TOP + 84;
        const pitch = (size + GAP_PX) * K;
        for (let k = -1; k <= 1; k += 1) {
            box(cx + k * pitch - (size * K) / 2, cy - (size * K) / 2, size * K, size * K, 6, k === 0 ? SKY : NEU, k === 0 ? 1 : 0.8);
        }
        const n = Math.floor(SHOWN * sm(prog(t, 0.3, 3.2)));
        for (let i = 0; i < n; i += 1) {
            const o = outcome(size, sigma, i);
            disc(cx + GX[i] * sigma * K, cy + GY[i] * sigma * K, 2.6, OCOL[o], 0.95);
        }
        if (n > 0) {
            const j = n - 1;
            disc(cx + GX[j] * sigma * K, cy + GY[j] * sigma * K, (FINGER_PX * K) / 2, SUN, 0.16);
        }
        text(fill('Buttons {a}px, gap {b}px', String(size), String(GAP_PX)), x + 112, TOP + 28, c, 10, 700, 'center', 206);
    }
    function draw(t) {
        pane(14, TOP, 224, 150, '24px', ROSE, selIdx === 0);
        pane(242, TOP, 224, 150, '44px', MINT, selIdx === 1);
        wash(14, 0.03 + 0.05 * sm(prog(t, 0.3, 3.2)) + 0.2 * sm(prog(t, 0.3, 3.2)) * (S24[1] + S24[2]) / 100, ROSE);
        wash(242, 0.03 + 0.05 * sm(prog(t, 0.3, 3.2)) + 0.2 * sm(prog(t, 0.3, 3.2)) * (S44[1] + S44[2]) / 100, MINT);
        side(14, SIZES[0], SIGMA_TOUCH, t, ROSE);
        side(242, SIZES[1], SIGMA_TOUCH, t, MINT);
        text(fill('Hit {a}%', pct(S24[0] / 100)), 126, TOP + 138, PAPER, 11, 700, 'center', 200);
        text(fill('Hit {a}%', pct(S44[0] / 100)), 354, TOP + 138, PAPER, 11, 700, 'center', 200);
        box(14, 200, 452, 62, 10, PANEL, 1);
        cmpRow(207, 'Neighbor mispress', S24[1], S44[1], Math.max(S24[1], 1), '%', 1);
        cmpRow(225, 'Gap or outside', S24[2], S44[2], Math.max(S24[2], 1), '%', 1);
        text(fill('Mouse 24px hits {a}% (spread {b}px vs {c}px), drawn at 1.3x', fm(SM24[0], 1), String(SIGMA_MOUSE), String(SIGMA_TOUCH)), 24, 252, SUN, 10.5, 700, 'left', 430);
        hud('TARGET_PX', String(SIZES[selIdx]), SIZES[selIdx] / 48);
    }
    function statusText(t) {
        void t;
        return fill('24px hits {a}%, 44px {b}%, {c} samples', fm(S24[0], 1), fm(S44[0], 1), String(SAMPLES));
    }
    function modeId(t) { void t; return selIdx; }
    function speakText(t) {
        void t;
        return fill('Calculated with {a} samples. With 24 pixel buttons {b} percent press right and {c} percent hit a neighbor; with 44 pixels it is {d} percent and {e} percent', String(SAMPLES), fm(S24[0], 1), fm(S24[1], 1), fm(S44[0], 1), fm(S44[1], 1));
    }
    function onKey(e) {
        if (e.key === 'ArrowRight') {
            selIdx = 1;
            return true;
        }
        if (e.key === 'ArrowLeft') {
            selIdx = 0;
            return true;
        }
        return false;
    }
    function sceneInit() { }
    document.documentElement.setAttribute('data-input', 'mouse');
    sceneInit();
    fitCanvas();
    // 캔버스 설명에는 이 장면이 계산한 핵심 값이 든 문장을 쓴다
    cv.setAttribute('aria-label', speakText(REST_S));
    redraw();
    if (!still) {
        startLoop();
    }
    return function () {
        stopLoop();
        off.abort();
        document.documentElement.removeAttribute('data-input');
    };
}
})();
</script>
</body>
</html>
