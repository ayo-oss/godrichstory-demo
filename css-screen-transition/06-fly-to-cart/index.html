<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 전환 — 장바구니로 날아가는 담기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="cart is-demo" aria-label="담기를 누르면 상품 점이 포물선으로 장바구니까지 날아간다">
    <input class="cart__check" type="checkbox" id="cart-add">
    <div class="cart__bag" aria-hidden="true">
      <span class="cart__basket"></span>
      <span class="cart__badge">2</span>
    </div>
    <article class="cart__product">
      <span class="cart__swatch" aria-hidden="true"></span>
      <h2 class="cart__name">코지 머그 350ml</h2>
      <label class="cart__btn" for="cart-add">담기</label>
    </article>
    <span class="cart__fly" aria-hidden="true"><span class="cart__fly-y"></span></span>
  </section>
</main>
</body>
</html>
