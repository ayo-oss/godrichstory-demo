<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 전환 — Grid↔List 뷰 전환</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="vs is-demo" aria-label="The same three cards move between grid and list layouts">
    <input class="vs__radio" type="radio" name="vs-218" id="vs-grid" checked>
    <input class="vs__radio" type="radio" name="vs-218" id="vs-list">
    <div class="vs__toggle" aria-hidden="true"><span class="vs__knob"></span></div>
    <div class="vs__toggle-labels">
      <label class="vs__label" for="vs-grid">Grid</label>
      <label class="vs__label" for="vs-list">List</label>
    </div>
    <div class="vs__board">
      <article class="vs__card vs__card--1"><span class="vs__thumb" aria-hidden="true"></span><span class="vs__name">Summer knit</span></article>
      <article class="vs__card vs__card--2"><span class="vs__thumb" aria-hidden="true"></span><span class="vs__name">Linen shirt</span></article>
      <article class="vs__card vs__card--3"><span class="vs__thumb" aria-hidden="true"></span><span class="vs__name">Straw hat</span></article>
    </div>
  </section>
</main>
</body>
</html>
