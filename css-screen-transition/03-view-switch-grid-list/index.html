<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 전환 — 격자↔목록 뷰 전환</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="vs is-demo" aria-label="같은 카드 세 장이 격자 배치와 목록 배치 사이를 오간다">
    <input class="vs__radio" type="radio" name="vs-218" id="vs-grid" checked>
    <input class="vs__radio" type="radio" name="vs-218" id="vs-list">
    <div class="vs__toggle" aria-hidden="true"><span class="vs__knob"></span></div>
    <div class="vs__toggle-labels">
      <label class="vs__label" for="vs-grid">격자</label>
      <label class="vs__label" for="vs-list">목록</label>
    </div>
    <div class="vs__board">
      <article class="vs__card vs__card--1"><span class="vs__thumb" aria-hidden="true"></span><span class="vs__name">썸머 니트</span></article>
      <article class="vs__card vs__card--2"><span class="vs__thumb" aria-hidden="true"></span><span class="vs__name">린넨 셔츠</span></article>
      <article class="vs__card vs__card--3"><span class="vs__thumb" aria-hidden="true"></span><span class="vs__name">스트로우 햇</span></article>
    </div>
  </section>
</main>
</body>
</html>
