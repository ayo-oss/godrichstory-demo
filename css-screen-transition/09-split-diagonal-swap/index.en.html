<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 전환 — 대각선 장면 교체</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="scene is-demo" aria-label="Two diagonal panels sweep past and swap the scene">
    <input class="scene__check" type="checkbox" id="scene-swap">
    <div class="scene__frame">
      <div class="scene__inner scene__inner--a"><p class="scene__name">Spring collection</p></div>
      <div class="scene__inner scene__inner--b"><p class="scene__name">Summer collection</p></div>
      <div class="scene__wipes" aria-hidden="true">
        <span class="scene__wipe scene__wipe--1"></span>
        <span class="scene__wipe scene__wipe--2"></span>
      </div>
    </div>
    <label class="scene__btn" for="scene-swap">Swap scene</label>
  </section>
</main>
</body>
</html>
