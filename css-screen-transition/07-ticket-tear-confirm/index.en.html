<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 전환 — 티켓 찢김 Confirm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="tear is-demo" aria-label="At confirmation the ticket tears into two stubs">
    <input class="tear__check" type="checkbox" id="tear-ok">
    <div class="tear__ticket">
      <div class="tear__half tear__half--l">
        <p class="tear__title">Admission</p>
        <p class="tear__seat">Row A, 12</p>
      </div>
      <div class="tear__half tear__half--r">
        <span class="tear__barcode" aria-hidden="true"></span>
        <label class="tear__btn" for="tear-ok">Confirm</label>
      </div>
      <span class="tear__perf" aria-hidden="true"></span>
    </div>
  </section>
</main>
</body>
</html>
