<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 전환 — 큰 이미지 슬라이드 교체</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="gal is-demo" aria-label="サムネイルを選ぶとメイン画像が同じ場所で切り替わる">
    <input class="gal__radio" type="radio" name="gal-218" id="gal-1" checked>
    <input class="gal__radio" type="radio" name="gal-218" id="gal-2">
    <input class="gal__radio" type="radio" name="gal-218" id="gal-3">
    <div class="gal__frame">
      <div class="gal__scene gal__scene--1"><span class="gal__tag">正面</span></div>
      <div class="gal__scene gal__scene--2"><span class="gal__tag">側面</span></div>
      <div class="gal__scene gal__scene--3"><span class="gal__tag">ディテール</span></div>
    </div>
    <div class="gal__thumbs">
      <label class="gal__thumb gal__thumb--1" for="gal-1">正面</label>
      <label class="gal__thumb gal__thumb--2" for="gal-2">側面</label>
      <label class="gal__thumb gal__thumb--3" for="gal-3">ディテール</label>
      <span class="gal__indicator" aria-hidden="true"></span>
    </div>
  </section>
</main>
</body>
</html>
