<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 전환 — 필터 칩 슬롯 채움</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="pick is-demo" aria-label="選んだフィルターチップが上の空きスロットへ飛んで収まる">
    <input class="pick__check" type="checkbox" id="pick-1">
    <input class="pick__check" type="checkbox" id="pick-2">
    <input class="pick__check" type="checkbox" id="pick-3">
    <p class="pick__slot"><span class="pick__slot-text">色を選んでください</span></p>
    <div class="pick__row">
      <label class="pick__chip pick__chip--1" for="pick-1">ブラック</label>
      <label class="pick__chip pick__chip--2" for="pick-2">クリーム</label>
      <label class="pick__chip pick__chip--3" for="pick-3">ミント</label>
    </div>
  </section>
</main>
</body>
</html>
