<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 전환 — 필터 칩 슬롯 채움</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="pick is-demo" aria-label="고른 필터 칩이 위 빈 슬롯으로 날아가 채워진다">
    <input class="pick__check" type="checkbox" id="pick-1">
    <input class="pick__check" type="checkbox" id="pick-2">
    <input class="pick__check" type="checkbox" id="pick-3">
    <p class="pick__slot"><span class="pick__slot-text">색상을 고르세요</span></p>
    <div class="pick__row">
      <label class="pick__chip pick__chip--1" for="pick-1">블랙</label>
      <label class="pick__chip pick__chip--2" for="pick-2">크림</label>
      <label class="pick__chip pick__chip--3" for="pick-3">민트</label>
    </div>
  </section>
</main>
</body>
</html>
