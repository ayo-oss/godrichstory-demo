<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 전환 — 단계 방향 슬라이드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="wiz is-demo" aria-label="단계 패널이 진행 방향에 맞춰 슬라이드한다">
    <input class="wiz__radio" type="radio" name="wiz-218" id="wiz-1" checked>
    <input class="wiz__radio" type="radio" name="wiz-218" id="wiz-2">
    <div class="wiz__window">
      <div class="wiz__panel wiz__panel--1">
        <p class="wiz__step">1단계 · 계정</p>
        <p class="wiz__q">이름과 이메일을 적어주세요</p>
      </div>
      <div class="wiz__panel wiz__panel--2">
        <p class="wiz__step">2단계 · 배송지</p>
        <p class="wiz__q">받으실 주소를 적어주세요</p>
      </div>
    </div>
    <div class="wiz__foot">
      <div class="wiz__dots" aria-hidden="true"><span class="wiz__dot"></span><span class="wiz__dot"></span></div>
      <label class="wiz__nav" for="wiz-1">이전</label>
      <label class="wiz__nav wiz__nav--next" for="wiz-2">다음</label>
    </div>
  </section>
</main>
</body>
</html>
