<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 전환 — 단계 방향 슬라이드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="wiz is-demo" aria-label="Step panels slide in the direction you move">
    <input class="wiz__radio" type="radio" name="wiz-218" id="wiz-1" checked>
    <input class="wiz__radio" type="radio" name="wiz-218" id="wiz-2">
    <div class="wiz__window">
      <div class="wiz__panel wiz__panel--1">
        <p class="wiz__step">Step 1 · Account</p>
        <p class="wiz__q">Enter your name and email</p>
      </div>
      <div class="wiz__panel wiz__panel--2">
        <p class="wiz__step">Step 2 · Shipping</p>
        <p class="wiz__q">Enter your shipping address</p>
      </div>
    </div>
    <div class="wiz__foot">
      <div class="wiz__dots" aria-hidden="true"><span class="wiz__dot"></span><span class="wiz__dot"></span></div>
      <label class="wiz__nav" for="wiz-1">Back</label>
      <label class="wiz__nav wiz__nav--next" for="wiz-2">Next</label>
    </div>
  </section>
</main>
</body>
</html>
