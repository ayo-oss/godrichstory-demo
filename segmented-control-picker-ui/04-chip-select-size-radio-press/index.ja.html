<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Size radio chips — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <fieldset class="sz is-demo">
    <legend class="sr-only">サイズ</legend>
    <label class="sz__chip"><input type="radio" name="sz1" class="sz__input" checked><span>S</span></label>
    <label class="sz__chip"><input type="radio" name="sz1" class="sz__input"><span>M</span></label>
    <label class="sz__chip"><input type="radio" name="sz1" class="sz__input"><span>L</span></label>
    <label class="sz__chip"><input type="radio" name="sz1" class="sz__input"><span>XL</span></label>
  </fieldset>
</main>
<script>
// .is-demo 자동 순환 (실제 클릭이 오면 멈춘다, 6줄)
var sz = document.querySelector('.sz');
var inputs = sz.querySelectorAll('.sz__input'); var i = 0;
var t = setInterval(function () { inputs[i % inputs.length].checked = true; i++; }, 480);
inputs.forEach(function (el) { el.addEventListener('pointerdown', function () { sz.classList.remove('is-demo'); clearInterval(t); }); });
</script>
</body>
</html>
