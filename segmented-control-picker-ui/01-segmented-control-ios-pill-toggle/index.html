<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS pill segmented control — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <fieldset class="seg is-demo">
    <legend class="sr-only">상태 필터</legend>
    <input type="radio" name="seg1" id="seg1-1" class="seg__radio" checked>
    <input type="radio" name="seg1" id="seg1-2" class="seg__radio">
    <input type="radio" name="seg1" id="seg1-3" class="seg__radio">
    <div class="seg__track">
      <span class="seg__pill" aria-hidden="true"></span>
      <label class="seg__tab" for="seg1-1">전체</label>
      <label class="seg__tab" for="seg1-2">진행중</label>
      <label class="seg__tab" for="seg1-3">완료</label>
    </div>
  </fieldset>
</main>
<script>
// .is-demo 자동 순환 (실제 클릭이 오면 멈춘다, 7줄)
var seg = document.querySelector('.seg');
var radios = seg.querySelectorAll('.seg__radio'); var i = 0;
var t = setInterval(function () { radios[i % radios.length].checked = true; i++; }, 700);
radios.forEach(function (r) { r.addEventListener('pointerdown', function () { seg.classList.remove('is-demo'); clearInterval(t); }); });
</script>
</body>
</html>
