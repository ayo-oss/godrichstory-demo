<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emoji reaction popup picker — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="rp is-demo">
    <div class="rp__pop" role="menu" aria-label="이모지 리액션">
      <button type="button" class="rp__emoji" role="menuitem" aria-label="좋아요">👍</button>
      <button type="button" class="rp__emoji" role="menuitem" aria-label="웃김">😂</button>
      <button type="button" class="rp__emoji" role="menuitem" aria-label="최고">🎉</button>
      <button type="button" class="rp__emoji" role="menuitem" aria-label="슬픔">😢</button>
    </div>
    <button type="button" class="rp__trigger" aria-haspopup="true" aria-expanded="false">반응</button>
  </div>
</main>
<script>
// 실제 동작: 버튼을 누르면 팝업이 열리고 aria-expanded 가 바뀐다. Esc 로 닫힘 (11줄)
var rp = document.querySelector('.rp'), trigger = rp.querySelector('.rp__trigger');
function setOpen(v) { rp.classList.toggle('is-open', v); trigger.setAttribute('aria-expanded', String(v)); }
trigger.addEventListener('click', function () { rp.classList.remove('is-demo'); clearInterval(loop); setOpen(!rp.classList.contains('is-open')); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
// .is-demo 자동 순환 — 열림/닫힘을 반복한다 (실제 클릭이 오면 멈춘다)
var open = false;
var loop = setInterval(function () { open = !open; rp.classList.toggle('is-open', open); }, 900);
</script>
</body>
</html>
