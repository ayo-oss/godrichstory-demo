<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odometer time scrubber — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="tp is-demo">
    <div class="tp__col" data-target="h">
      <button type="button" class="tp__btn" data-dir="1" aria-label="시 증가">+</button>
      <div class="tp__win"><span class="tp__val is-cur">09</span><span class="tp__val is-next">10</span></div>
      <button type="button" class="tp__btn" data-dir="-1" aria-label="시 감소">−</button>
      <span class="tp__unit">시</span>
    </div>
    <span class="tp__colon" aria-hidden="true">:</span>
    <div class="tp__col" data-target="m">
      <button type="button" class="tp__btn" data-dir="1" aria-label="분 증가">+</button>
      <div class="tp__win"><span class="tp__val is-cur">05</span><span class="tp__val is-next">06</span></div>
      <button type="button" class="tp__btn" data-dir="-1" aria-label="분 감소">−</button>
      <span class="tp__unit">분</span>
    </div>
  </div>
</main>
<script>
// 실제 동작: +/- 를 누르면 현재 숫자가 밀려나가고 다음 숫자가 그 자리로 굴러 들어온다 (odometer). 23줄
var tp = document.querySelector('.tp');
function roll(col, dir) {
  var win = col.querySelector('.tp__win');
  var cur = win.querySelector('.is-cur'), next = win.querySelector('.is-next');
  var v = (parseInt(cur.textContent, 10) + dir + 60) % 60;
  next.textContent = String(v).padStart(2, '0');
  cur.classList.add('is-leaving'); next.classList.add('is-arriving');
  next.addEventListener('transitionend', function done() {
    next.removeEventListener('transitionend', done);
    cur.classList.remove('is-cur', 'is-leaving'); cur.classList.add('is-next');
    cur.style.transition = 'none'; void cur.offsetWidth; cur.style.transition = '';
    next.classList.remove('is-arriving'); next.classList.add('is-cur');
  }, { once: true });
}
tp.querySelectorAll('.tp__btn').forEach(function (btn) {
  btn.addEventListener('pointerdown', function () {
    tp.classList.remove('is-demo'); clearInterval(loop);
    roll(btn.closest('.tp__col'), parseInt(btn.dataset.dir, 10));
  });
});
// .is-demo 자동 순환 — 두 칸을 번갈아 굴린다 (실제 클릭이 오면 멈춘다)
var cols = tp.querySelectorAll('.tp__col'), j = 0;
var loop = setInterval(function () { roll(cols[j % cols.length], 1); j++; }, 900);
</script>
</body>
</html>
