<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소켓 모드 — 연결 유지와 재연결 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, 왼쪽·오른쪽 방향키로 다른 값으로">
      <div class="ez__scene" data-role="scene" role="img" aria-label="가로 시간표 위에 소켓 연결 선이 길게 이어지다 끊기고, 끊길 때마다 지수 백오프 간격으로 벌어진 재연결 점이 찍혀 복구까지 걸린 시간이 누적되는 장면"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">장면 준비</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function fill(s) {
        const v = [];
        for (let i = 1; i < arguments.length; i += 1) { v.push(arguments[i]); }
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? String(v[i]) : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        scWrap.textContent = '';
        chartEl.textContent = '';
        probeEl.textContent = '';
    }
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function spanOf(d, dur, k) { return { s: d, e: d + dur, k: k === undefined ? 0 : k }; }
    function bar(cls, x, y, w, h) {
        const e = make('i', cls, chartEl);
        put(e, x, y, w, h);
        return e;
    }
    function drawRows(segs, max) {
        const n = segs.length;
        const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
        for (let i = 0; i < segs.length; i += 1) {
            const sg = segs[i];
            const x = CX0 + clamp(sg.s, 0, max) / max * CW;
            const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
            bar(sg.k === 2 ? 'bar k2' : (sg.k === 1 ? 'bar k1' : 'bar'), x, 4 + i * (h + 1), w, h);
        }
    }
    function axis(max) {
        const a = make('b', 'ax', chartEl);
        put(a, CX0, 40, 0, 0);
        a.textContent = '0ms';
        const b = make('b', 'ax ax--r', chartEl);
        put(b, CX0, 40, CW, 0);
        b.textContent = f0(max) + 'ms';
    }
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    function run(cfg) {
        const off = new AbortController();
        if (cfg.bind) { cfg.bind(off); }
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        let headEl = null;
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            cycle = Math.max(2000, cfg.build(pi));
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                setPaused(true);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            cfg.frame(1e9);
            statusP.textContent = readB.textContent;
            doneP.textContent = readB.textContent;
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }


    // ── 537-02 소켓 모드 — 연결 선이 가로 시간표 위에 길게 이어지다 끊기고, 끊길 때마다
    //    지수 백오프 간격으로 재연결 점이 찍혀 복구까지 걸린 시간이 누적된다. 계산 두 줄이 핵심이다.
    //      n번째 대기 backoff(n) = BASE × 2^(n-1)
    //      복구 시각 recoveredAt = 끊긴 시각 + backoff(1) 부터 backoff(MAX_RETRY) 까지의 합
    //    선의 길이·점의 x·괄호 폭은 모두 이 식에서 나오므로 MAX_RETRY 를 바꾸면 시간표가 길어진다.
    //    소켓 모드의 실제 재연결 간격은 라이브러리마다 다르다 — 여기서는 지수 백오프의 모양만 보인다
    //    (n8n Slack Trigger 문서에는 재연결 간격 값이 없다 — 사실.md §3).
    const BASE = 120;      // 첫 대기 (무대 시간 ms)
    const MAX_RETRY = 3;   // 변형 s02: 3 → 7 (재연결 시도 상한)
    const HOLD_MS = 420;   // 연결이 유지되는 구간 (무대 시간 ms)
    const TAIL_MS = 160;   // 마지막 점 뒤 복구 선 (무대 시간 ms)
    const TL_X = 4;        // 시간표 안쪽 시작 x
    const TL_W = 440;      // 시간표 안쪽 폭
    const FIRST_MS = 200;  // 첫 시각 변화는 150ms 뒤
    const SPAN_MS = 1600;  // 총 무대 시간을 2초 창의 이 길이에 압축한다 (비율은 식 그대로)
    const BOUNCE_MS = 240; // 복구 지점이 맺히며 한 번 출렁이는 무대 시간
    // 세로 층 (씬 448x156 안) — put() 이 인라인 top 을 덮어쓰므로 y 는 이 상수로만 정한다
    const Y_LINE = 62;     // 연결 선 위쪽 (선 h 16 · 점 h 20 → 중심 70)
    const Y_WAIT = 38;     // 대기 괄호 위쪽 (h 12)
    const Y_TICK = 100;    // 눈금
    const Y_AXIS = 116;    // 축 라벨
    let ttlEl = null;
    let sumEl = null;
    let holdEl = null;
    let cutEl = null;
    let okEl = null;
    let elapsedEl = null;
    let dotEls = [];
    let waitEls = [];
    let waitLblEls = [];
    let tailEls = [];
    // 지수 백오프 — n 은 1 부터
    function backoff(n) { return BASE * Math.pow(2, n - 1); }
    // n번째 재연결 시도의 시각 = 끊긴 시각 + backoff(1) 부터 backoff(n) 까지의 합
    function attemptAt(n) {
        let a = HOLD_MS;
        for (let k = 1; k <= n; k += 1) { a += backoff(k); }
        return a;
    }
    // 무대 총 시간 = 유지 구간 + 모든 대기 + 복구 꼬리
    function totalMs() { return attemptAt(MAX_RETRY) + TAIL_MS; }
    // 시각 → x (px). 시간표 폭에 선형 대응
    function xAt(ms) { return TL_X + clamp(ms / totalMs(), 0, 1) * (TL_W - 8); }
    function build(i) {
        dotEls = []; waitEls = []; waitLblEls = []; tailEls = [];
        make('div', 'tl', scWrap);
        // 경과 밴드 — 틀 안쪽, 연결 선·점보다 아래 층
        elapsedEl = make('i', 'sk-elapsed', scWrap);
        put(elapsedEl, TL_X - 2, 4, TL_W + 4, 140);
        ttlEl = make('p', 'sk__ttl', scWrap);
        ttlEl.textContent = 'socketMode · reconnect backoff';
        sumEl = make('p', 'sk__sum', scWrap);
        sumEl.textContent = '복구 0ms';
        // 눈금 — 시간표를 8 칸으로
        for (let k = 1; k < 8; k += 1) {
            const tk = make('i', 'tl-tick', scWrap);
            tk.style.left = f0(TL_X + k / 8 * (TL_W - 8)) + 'px';
            tk.style.top = Y_TICK + 'px';
        }
        // 연결 선 — 유지 구간 (끊기면 그 길이에서 멈춘다)
        holdEl = make('i', 'sk-line', scWrap);
        put(holdEl, TL_X, Y_LINE, xAt(HOLD_MS) - TL_X, 0);
        // 끊김 표시 — 유지 구간 끝에 세로 외곽선 (선이 끊기는 순간 자라난다)
        cutEl = make('i', 'sk-cut', scWrap);
        put(cutEl, xAt(HOLD_MS) - 1, Y_LINE - 10, 0, 0);
        // 재연결 시도마다 점·대기 괄호·라벨·꼬리 선
        for (let n = 1; n <= MAX_RETRY; n += 1) {
            const x = xAt(attemptAt(n));
            const d = make('i', 'sk-dot', scWrap);
            put(d, x - 10, Y_LINE - 2, 0, 0);
            dotEls.push(d);
            const x0 = n === 1 ? xAt(HOLD_MS) : xAt(attemptAt(n - 1));
            const w = make('i', 'sk-wait', scWrap);
            put(w, x0, Y_WAIT, x - x0, 0);
            waitEls.push(w);
            const lb = make('p', 'sk-waitlbl', scWrap);
            lb.textContent = '×2^' + f0(n - 1);
            put(lb, x0, Y_WAIT - 12, 0, 0);
            waitLblEls.push(lb);
            const tl = make('i', 'sk-line sk-line--tail', scWrap);
            put(tl, x, Y_LINE, n === MAX_RETRY ? xAt(totalMs()) - x : xAt(attemptAt(n + 1)) - x, 0);
            tailEls.push(tl);
        }
        // 복구 지점 — 마지막 점
        okEl = make('i', 'sk-ok', scWrap);
        put(okEl, xAt(attemptAt(MAX_RETRY)) - 6, Y_LINE + 2, 0, 0);
        // 축 라벨
        // 축 라벨 — 눈금 바로 아래 한 줄 (0ms 왼쪽 · 총 시간 오른쪽)
        const a0 = make('p', 'sk__axis', scWrap);
        a0.textContent = '0ms';
        a0.style.left = TL_X + 'px';
        a0.style.top = Y_AXIS + 'px';
        const a1 = make('p', 'sk__axis', scWrap);
        a1.textContent = f0(totalMs()) + 'ms';
        a1.style.right = '4px';
        a1.style.top = Y_AXIS + 'px';
        const ov = make('b', 'ov ovs', sceneEl);
        put(ov, 204, 4, 0, 0);
        ov.textContent = 'backoff(n) = BASE × 2^(n-1)';
        // 시간표 한 줄 — 유지 구간(파랑) · 대기마다 각각 한 칸(민트) · 복구 꼬리(라일락). MAX_RETRY 에 비례해 늘어난다
        const segs = [spanOf(0, HOLD_MS, 0)];
        for (let n = 1; n <= MAX_RETRY; n += 1) {
            segs.push(spanOf(attemptAt(n) - backoff(n), backoff(n), 1));
        }
        segs.push(spanOf(attemptAt(MAX_RETRY), TAIL_MS, 2));
        drawRows(segs, totalMs());
        axis(totalMs());
        setReads(fill('socketMode · reconnect · BASE {a} · MAX_RETRY {b} · backoff(n) = BASE × 2^(n-1)', f0(BASE), f0(MAX_RETRY)),
            i === 0 ? 'the socket line holds, then breaks' : 'each break waits twice as long before the next attempt');
        doneP.textContent = '';
        return 2000;
    }
    function frame(t) {
        // build() 가 요소를 전부 만든 뒤에만 그린다 — build 전 프레임은 건너뛴다 (null 안전)
        if (!ttlEl || !sumEl || !holdEl || !cutEl || !okEl || !elapsedEl) {
            return '';
        }
        const el = Math.max(0, t - FIRST_MS);
        const ms = clamp(el / SPAN_MS, 0, 1) * totalMs();     // 지금의 무대 시간
        // 경과 밴드 — 지나온 시간 비율만큼 (첫 150ms 는 0 으로 둔다)
        elapsedEl.style.transform = 'scaleX(' + f2(clamp(el / SPAN_MS, 0, 1)) + ')';
        // 연결 선 — 유지 구간 동안 자라고, 끊기면 그 길이에서 멈춘다
        holdEl.style.transform = 'scaleX(' + f2(clamp(ms / HOLD_MS, 0, 1)) + ')';
        cutEl.style.transform = 'scaleY(' + f2(clamp((ms - HOLD_MS) / 80, 0, 1)) + ')';
        let waited = 0;
        let attempts = 0;
        for (let n = 1; n <= MAX_RETRY; n += 1) {
            const at = attemptAt(n);
            const start = at - backoff(n);
            const w = waitEls[n - 1];
            w.style.transform = 'scaleX(' + f2(clamp((ms - start) / backoff(n), 0, 1)) + ')';
            const on = ms >= at;
            dotEls[n - 1].style.transform = 'scale(' + (on ? '1' : '0') + ')';
            waitLblEls[n - 1].style.opacity = ms >= start ? '1' : '0';
            const end = n === MAX_RETRY ? totalMs() : attemptAt(n + 1);
            tailEls[n - 1].style.transform = 'scaleX(' + f2(clamp((ms - at) / (end - at), 0, 1)) + ')';
            if (on) {
                waited += backoff(n);
                attempts = n;
            }
        }
        // 복구 — 마지막 시도가 성공한 뒤 꼬리 선이 다 자라면 복구
        // 복구 시각 = 마지막 재연결 시도 시각. 그 뒤 꼬리 선이 다 자라면 복구다
        const recoverAt = attemptAt(MAX_RETRY);
        const recovered = ms >= totalMs();
        // 복구 지점의 등장 — 마지막 재연결 시도 시각부터 BOUNCE_MS 동안 감쇠 사인으로 커졌다 작아지며 1 에 안착한다
        // (계산 — 속성 트윈이 아니다). ms 는 totalMs() 에서 멈추므로 흐른 시간은 무대 시간으로 직접 잰다
        if (okEl) {
            const since = clamp((el / SPAN_MS * totalMs() - recoverAt) / BOUNCE_MS, 0, 1);
            const pop = since <= 0 ? 0 : (1 + Math.sin(since * Math.PI * 2) * Math.exp(-since * 3) * 0.45 * (1 - since));
            okEl.style.transform = 'scale(' + f2(clamp(pop, 0, 1.5)) + ')';
        }
        sumEl.textContent = recovered ? fill('복구 {a}ms', f0(recoverAt)) : fill('대기 {a}ms', f0(waited));
        return fill('socketMode · 경과 {a}ms · 재연결 {b}회 · 누적 대기 {c}ms',
            f0(ms), f0(attempts), f0(waited));
    }

    return run({ count: 3, build: build, frame: frame });
}
})();

</script>
</body>
</html>
