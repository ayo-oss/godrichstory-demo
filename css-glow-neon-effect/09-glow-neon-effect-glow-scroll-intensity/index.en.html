<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glow intensity tied to scroll — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <div class="row" aria-hidden="true">
    <span class="track"><span class="dot"></span></span>
    <div class="card">
      <span class="bar bar--lg"></span>
      <span class="bar bar--sm"></span>
    </div>
  </div>
</main>
<script>
// 실제 스크롤에서는 IntersectionObserver 가 뷰포트 교차 비율로 --intensity 를 정한다(8줄).
// 이 아이프레임은 너무 작아 실스크롤이 안 나므로, 데모 루프(.is-demo)가 같은 변수를 대신 돌린다.
(function () {
  var card = document.querySelector('.card');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      card.style.setProperty('--intensity', en.intersectionRatio.toFixed(2));
      card.classList.add('is-live');
    });
  }, { threshold: [0, .25, .5, .75, 1] });
  io.observe(card);
})();
</script>
</body>
</html>
