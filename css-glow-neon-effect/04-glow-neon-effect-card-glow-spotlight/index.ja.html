<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card spotlight glow — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <div class="card">
    <span class="thumb" aria-hidden="true"></span>
    <span class="bar bar--lg" aria-hidden="true"></span>
    <span class="bar bar--sm" aria-hidden="true"></span>
  </div>
</main>
<script>
// 실제 커서가 카드 위를 지나가면 --x·--y 를 좌표로 갱신하고 데모 루프를 뗀다 (8줄).
(function () {
  var card = document.querySelector('.card');
  card.addEventListener('pointermove', function (e) {
    var r = card.getBoundingClientRect();
    card.style.setProperty('--x', ((e.clientX - r.left) / r.width * 100) + '%');
    card.style.setProperty('--y', ((e.clientY - r.top) / r.height * 100) + '%');
    document.querySelector('.stage').classList.remove('is-demo');
  });
})();
</script>
</body>
</html>
