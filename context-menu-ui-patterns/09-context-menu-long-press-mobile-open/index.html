<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>길게 눌러 모바일 메뉴 열기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cm is-demo" id="cm">
  <div class="cm__field" id="cmField">
    <span class="cm__hint">길게 누르기</span>
    <svg class="cm__ring" id="cmRing" viewBox="0 0 40 40">
      <circle class="cm__ring-bg" cx="20" cy="20" r="16"></circle>
      <circle class="cm__ring-fg" id="cmRingFg" cx="20" cy="20" r="16" stroke-dasharray="100.5" stroke-dashoffset="100.5"></circle>
    </svg>
  </div>
  <div class="cm__menu" id="cmMenu" role="menu">
    <button class="cm__item" type="button" role="menuitem">
      <span class="cm__ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 40v128h-48V88H88V40Z" opacity=".2"/><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></g></svg></span>
      <span>복사</span>
    </button>
    <button class="cm__item" type="button" role="menuitem">
      <span class="cm__ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><g fill="currentColor"><path d="M208 48v168a8 8 0 0 1-8 8H56a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8h40a39.83 39.83 0 0 0-8 24v8h80v-8a39.83 39.83 0 0 0-8-24h40a8 8 0 0 1 8 8" opacity=".2"/><path d="M200 32h-36.26a47.92 47.92 0 0 0-71.48 0H56a16 16 0 0 0-16 16v168a16 16 0 0 0 16 16h144a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m-72 0a32 32 0 0 1 32 32H96a32 32 0 0 1 32-32m72 184H56V48h26.75A47.9 47.9 0 0 0 80 64v8a8 8 0 0 0 8 8h80a8 8 0 0 0 8-8v-8a47.9 47.9 0 0 0-2.75-16H200Z"/></g></svg></span>
      <span>붙여넣기</span>
    </button>
    <button class="cm__item" type="button" role="menuitem">
      <span class="cm__ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><g fill="currentColor"><path d="m221.66 90.34l-56 56l-40-40l56-56l29.66-29.66a8 8 0 0 1 11.31 0L221.66 79a8 8 0 0 1 0 11.34" opacity=".2"/><path d="m227.31 73.37l-44.68-44.69a16 16 0 0 0-22.63 0L36.69 152A15.86 15.86 0 0 0 32 163.31V208a16 16 0 0 0 16 16h44.69a15.86 15.86 0 0 0 11.31-4.69L227.31 96a16 16 0 0 0 0-22.63M92.69 208H48v-44.69l88-88L180.69 120ZM192 108.68L147.31 64l24-24L216 84.68Z"/></g></svg></span>
      <span>이름 바꾸기</span>
    </button>
    <button class="cm__item cm__item--danger" type="button" role="menuitem">
      <span class="cm__ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><g fill="currentColor"><path d="M200 56v152a8 8 0 0 1-8 8H64a8 8 0 0 1-8-8V56Z" opacity=".2"/><path d="M216 48h-40v-8a24 24 0 0 0-24-24h-48a24 24 0 0 0-24 24v8H40a8 8 0 0 0 0 16h8v144a16 16 0 0 0 16 16h128a16 16 0 0 0 16-16V64h8a8 8 0 0 0 0-16M96 40a8 8 0 0 1 8-8h48a8 8 0 0 1 8 8v8H96Zm96 168H64V64h128Zm-80-104v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0m48 0v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0"/></g></svg></span>
      <span>삭제</span>
    </button>
  </div>
</div>
</main>
<script>
(function () {
  var field = document.getElementById('cmField');
  var menu = document.getElementById('cmMenu');
  var ring = document.getElementById('cmRing');
  var ringFg = document.getElementById('cmRingFg');
  var root = document.getElementById('cm');
  var GAP = 6;
  var HOLD_MS = 620;
  var CIRC = 100.5;

  function positionAt(x, y) {
    var mw = menu.offsetWidth, mh = menu.offsetHeight;
    var vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    var px = Math.max(GAP, Math.min(x, vw - mw - GAP));
    var py = Math.max(GAP, Math.min(y, vh - mh - GAP));
    menu.style.left = px.toFixed(0) + 'px';
    menu.style.top = py.toFixed(0) + 'px';
  }
  function open(x, y) { positionAt(x, y); menu.classList.add('is-open'); }
  function close() { menu.classList.remove('is-open'); }

  var pressStart = 0, rafId = null, pressX = 0, pressY = 0;

  // 계산 겹: (경과시간 / HOLD_MS) 를 0~1 로 clamp 한 진행률을 원둘레(CIRC)에 곱해
  // stroke-dashoffset 값을 매 프레임 다시 계산한다 — 시간이 곧 링이 채워지는 양이 된다.
  function tickPress(ts) {
    var elapsed = performance.now() - pressStart;
    var prog = Math.max(0, Math.min(1, elapsed / HOLD_MS));
    ringFg.setAttribute('stroke-dashoffset', (CIRC * (1 - prog)).toFixed(1));
    if (prog >= 1) { finishPress(); return; }
    rafId = requestAnimationFrame(tickPress);
  }
  function startPress(x, y) {
    pressX = x; pressY = y;
    pressStart = performance.now();
    ring.classList.add('is-active');
    ringFg.setAttribute('stroke-dashoffset', CIRC.toFixed(1));
    rafId = requestAnimationFrame(tickPress);
  }
  function cancelPress() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    ring.classList.remove('is-active');
    ringFg.setAttribute('stroke-dashoffset', CIRC.toFixed(1));
  }
  function finishPress() {
    cancelPress();
    open(pressX, pressY);
  }

  field.addEventListener('pointerdown', function (e) {
    root.classList.remove('is-demo'); stopAutoplay();
    startPress(e.clientX, e.clientY);
  });
  field.addEventListener('pointerup', cancelPress);
  field.addEventListener('pointerleave', cancelPress);
  field.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('pointerdown', function (e) {
    if (menu.classList.contains('is-open') && !menu.contains(e.target) && e.target !== field) close();
  });
  menu.addEventListener('click', close);

  // 자동 루프: 필드 중앙을 누른 채 HOLD_MS 만큼 링이 차오르는 것을 흉내내고, 다 차면 메뉴를 연 뒤
  // 잠시 후 닫는다.
  var phase = 0, autoTimer = null, simStart = 0;
  function autoTick() {
    var r = field.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (phase === 0) { simStart = performance.now(); pressStart = simStart; pressX = cx; pressY = cy; ring.classList.add('is-active'); phase = 1; }
    else if (phase === 1) {
      var elapsed = performance.now() - simStart;
      var prog = Math.max(0, Math.min(1, elapsed / HOLD_MS));
      ringFg.setAttribute('stroke-dashoffset', (CIRC * (1 - prog)).toFixed(1));
      if (prog >= 1) { ring.classList.remove('is-active'); open(cx, cy); phase = 2; }
    } else if (phase === 2) {
      phase = 3;
    } else { close(); ringFg.setAttribute('stroke-dashoffset', CIRC.toFixed(1)); phase = 0; }
  }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
  if (!reduce) { autoTimer = setInterval(autoTick, 130); autoTick(); }
})();
</script>
</body>
</html>
