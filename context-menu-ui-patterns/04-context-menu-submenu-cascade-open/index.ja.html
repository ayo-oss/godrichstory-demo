<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サブメニュー段階開閉 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cm is-demo" id="cm">
  <div class="cm__field" id="cmField">
    <span class="cm__hint">右クリック → 「並び替え」に留まる</span>
  </div>
  <div class="cm__menu" id="cmMenu" role="menu">
    <button class="cm__item" type="button" role="menuitem">
      <span class="cm__ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 40v128h-48V88H88V40Z" opacity=".2"/><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></g></svg></span>
      <span>コピー</span>
    </button>
    <button class="cm__item" type="button" role="menuitem">
      <span class="cm__ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><g fill="currentColor"><path d="M208 48v168a8 8 0 0 1-8 8H56a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8h40a39.83 39.83 0 0 0-8 24v8h80v-8a39.83 39.83 0 0 0-8-24h40a8 8 0 0 1 8 8" opacity=".2"/><path d="M200 32h-36.26a47.92 47.92 0 0 0-71.48 0H56a16 16 0 0 0-16 16v168a16 16 0 0 0 16 16h144a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m-72 0a32 32 0 0 1 32 32H96a32 32 0 0 1 32-32m72 184H56V48h26.75A47.9 47.9 0 0 0 80 64v8a8 8 0 0 0 8 8h80a8 8 0 0 0 8-8v-8a47.9 47.9 0 0 0-2.75-16H200Z"/></g></svg></span>
      <span>貼り付け</span>
    </button>
    <button class="cm__item cm__item--active" type="button" role="menuitem" id="cmSortTrigger">
      <span class="cm__ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><g fill="currentColor"><path d="M184 88v104a8 8 0 0 1-13.66 5.66l-32-32a8 8 0 0 1 0-11.32L170.34 122A8 8 0 0 1 184 88M72 88v104a8 8 0 0 0 13.66 5.66l32-32a8 8 0 0 0 0-11.32L85.66 122A8 8 0 0 0 72 88" opacity=".2"/><path d="M226.83 82.34a8 8 0 0 0-8.72 1.73l-32 32a8 8 0 0 0 0 11.32l32 32A8 8 0 0 0 232 154V90a8 8 0 0 0-5.17-7.66M216 134.69L197.31 116L216 97.31ZM37.86 116l32-32a8 8 0 0 1 13.66 5.66v64A8 8 0 0 1 69.86 159l-32-32a8 8 0 0 1 0-11m14.28 5.66L59.86 130V102Z"/></g></svg></span>
      <span>並び替え</span>
      <span class="cm__caret"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path fill="currentColor" d="M181.66 133.66l-80 80a8 8 0 0 1-11.32-11.32L164.69 128L90.34 53.66a8 8 0 0 1 11.32-11.32l80 80a8 8 0 0 1 0 11.32"/></svg></span>
    </button>
    <button class="cm__item cm__item--danger" type="button" role="menuitem">
      <span class="cm__ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><g fill="currentColor"><path d="M200 56v152a8 8 0 0 1-8 8H64a8 8 0 0 1-8-8V56Z" opacity=".2"/><path d="M216 48h-40v-8a24 24 0 0 0-24-24h-48a24 24 0 0 0-24 24v8H40a8 8 0 0 0 0 16h8v144a16 16 0 0 0 16 16h128a16 16 0 0 0 16-16V64h8a8 8 0 0 0 0-16M96 40a8 8 0 0 1 8-8h48a8 8 0 0 1 8 8v8H96Zm96 168H64V64h128Zm-80-104v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0m48 0v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0"/></g></svg></span>
      <span>削除</span>
    </button>
  </div>
  <div class="cm__sub" id="cmSub" role="menu">
    <button class="cm__item" type="button" role="menuitem"><span>名前順</span></button>
    <button class="cm__item" type="button" role="menuitem"><span>日付順</span></button>
    <button class="cm__item" type="button" role="menuitem"><span>サイズ順</span></button>
  </div>
</div>
</main>
<script>
(function () {
  var field = document.getElementById('cmField');
  var menu = document.getElementById('cmMenu');
  var sub = document.getElementById('cmSub');
  var trigger = document.getElementById('cmSortTrigger');
  var root = document.getElementById('cm');
  var GAP = 6;
  var CASCADE_MS = 260;

  function place(el, x, y) {
    var w = el.offsetWidth, h = el.offsetHeight;
    var vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    var px = Math.max(GAP, Math.min(x, vw - w - GAP));
    var py = Math.max(GAP, Math.min(y, vh - h - GAP));
    el.style.left = px.toFixed(0) + 'px';
    el.style.top = py.toFixed(0) + 'px';
    return { left: px, top: py, right: px + w, width: w };
  }

  var hoverTimer = null;
  function openMenu(x, y) {
    menu.style.left = '0px'; menu.style.top = '0px';
    var box = place(menu, x, y);
    menu.classList.add('is-open');
  }
  function closeAll() {
    menu.classList.remove('is-open');
    sub.classList.remove('is-open');
    clearHover();
  }
  function clearHover() { if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; } }

  function scheduleSub() {
    clearHover();
    // 계산 겹: 並び替え 항목 위에 머무른 시간을 CASCADE_MS 로 재고, 그 시간을 넘겨야만 서브메뉴를 연다
    // (즉시 열지 않음 — 지나가는 커서에 반응하지 않게).
    hoverTimer = setTimeout(function () {
      var mr = menu.getBoundingClientRect();
      var tr = trigger.getBoundingClientRect();
      place(sub, mr.right - 2, tr.top - 4);
      sub.classList.add('is-open');
    }, CASCADE_MS);
  }

  trigger.addEventListener('pointerenter', scheduleSub);
  trigger.addEventListener('pointerleave', function () { clearHover(); });

  field.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    root.classList.remove('is-demo'); stopAutoplay();
    closeAll();
    openMenu(e.clientX, e.clientY);
  });
  document.addEventListener('pointerdown', function (e) {
    if (menu.classList.contains('is-open') && !menu.contains(e.target) && !sub.contains(e.target) && e.target !== field) {
      closeAll();
    }
  });

  // 자동 루프: 메뉴를 연 뒤 並び替え 항목 위에 CASCADE_MS 이상 머물러 서브메뉴가 계단식으로 이어 붙는
  // 것을 보여주고, 잠시 뒤 닫는다.
  var step = 0, autoTimer = null;
  function autoTick() {
    var phase = step % 4;
    if (phase === 0) {
      var r = field.getBoundingClientRect();
      openMenu(r.left + r.width * 0.5, r.top + r.height * 0.6);
    } else if (phase === 1) {
      scheduleSub();
    } else if (phase === 3) {
      closeAll();
    }
    step++;
  }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } clearHover(); }
  if (!reduce) { autoTimer = setInterval(autoTick, CASCADE_MS + 140); autoTick(); }
})();
</script>
</body>
</html>
