<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入れ子の深さスライド — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cm is-demo" id="cm">
  <div class="cm__field" id="cmField">
    <span class="cm__hint">右クリック → 共有 → もっと見る</span>
  </div>
  <div class="cm__menu" id="cmMenu" role="menu">
    <div class="cm__track" id="cmTrack">
      <div class="cm__panel" data-depth="0">
        <button class="cm__item" type="button" role="menuitem"><span class="cm__ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 40v128h-48V88H88V40Z" opacity=".2"/><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"/></g></svg></span><span>コピー</span></button>
        <button class="cm__item" type="button" role="menuitem" data-open="1"><span class="cm__ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><g fill="currentColor"><path d="M225.32 68.12L157.62 28a15.93 15.93 0 0 0-16.17.09l-67.7 40.72A16 16 0 0 0 66 82.55v78.06L30.68 181.79A16 16 0 0 0 30.6 209l67.7 40.72a15.93 15.93 0 0 0 16.17.08l67.7-40.72A16 16 0 0 0 190 195.36v-77.9l35.4-21.29a16 16 0 0 0 .08-27.19Z" opacity=".2"/><path d="M232.94 65a24 24 0 0 0-11.36-14.5L153.87 10.4a24 24 0 0 0-24.28.13L61.9 51.25A23.86 23.86 0 0 0 50 72.61v75.19l-9.94 6a24 24 0 0 0-2.62 39.29a1.4 1.4 0 0 0 .16.13l67.71 40.7a24 24 0 0 0 24.28-.13l67.7-40.72A23.85 23.85 0 0 0 209 174.6V99.34Z" opacity="0"/><path d="M136 128a8 8 0 0 1-8 8h-8v8a8 8 0 0 1-16 0v-8h-8a8 8 0 0 1 0-16h8v-8a8 8 0 0 1 16 0v8h8a8 8 0 0 1 8 8m84.72-49.14L128 24 35.28 78.86A8 8 0 0 0 32 85.42V170.6a8 8 0 0 0 3.28 6.46L128 232l92.72-54.94a8 8 0 0 0 3.28-6.46V85.42a8 8 0 0 0-3.28-6.56"/></g></svg></span><span>共有</span><span class="cm__caret"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path fill="currentColor" d="M181.66 133.66l-80 80a8 8 0 0 1-11.32-11.32L164.69 128L90.34 53.66a8 8 0 0 1 11.32-11.32l80 80a8 8 0 0 1 0 11.32"/></svg></span></button>
        <button class="cm__item" type="button" role="menuitem" data-open="2"><span class="cm__ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><g fill="currentColor"><circle cx="128" cy="64" r="16" opacity=".2"/><circle cx="128" cy="192" r="16" opacity=".2"/><path d="M128 48a16 16 0 1 0 16 16a16 16 0 0 0-16-16m0 112a16 16 0 1 0 16 16a16 16 0 0 0-16-16m0-56a16 16 0 1 0 16 16a16 16 0 0 0-16-16"/></g></svg></span><span>もっと見る</span><span class="cm__caret"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path fill="currentColor" d="M181.66 133.66l-80 80a8 8 0 0 1-11.32-11.32L164.69 128L90.34 53.66a8 8 0 0 1 11.32-11.32l80 80a8 8 0 0 1 0 11.32"/></svg></span></button>
      </div>
      <div class="cm__panel" data-depth="1">
        <button class="cm__item cm__item--back" type="button" data-back="1">‹ 共有</button>
        <button class="cm__item" type="button" role="menuitem"><span>メッセンジャー</span></button>
        <button class="cm__item" type="button" role="menuitem"><span>リンクをコピー</span></button>
      </div>
      <div class="cm__panel" data-depth="2">
        <button class="cm__item cm__item--back" type="button" data-back="1">‹ もっと見る</button>
        <button class="cm__item cm__item--danger" type="button" role="menuitem"><span>削除</span></button>
        <button class="cm__item" type="button" role="menuitem"><span>プロパティ</span></button>
      </div>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var field = document.getElementById('cmField');
  var menu = document.getElementById('cmMenu');
  var track = document.getElementById('cmTrack');
  var root = document.getElementById('cm');
  var GAP = 6, PANEL_W = 168, depth = 0;

  function positionAt(x, y) {
    var mw = menu.offsetWidth;
    var vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    var mh = menu.offsetHeight || 160;
    var px = Math.max(GAP, Math.min(x, vw - mw - GAP));
    var py = Math.max(GAP, Math.min(y, vh - mh - GAP));
    menu.style.left = px.toFixed(0) + 'px';
    menu.style.top = py.toFixed(0) + 'px';
  }

  // 계산 겹: 깊이(depth) 값에 패널 폭(PANEL_W)을 곱해 트랙을 옆으로 밀어, 깊이가 1 늘 때마다
  // 정확히 패널 하나만큼 다음 화면이 이어 들어오게 한다.
  function goTo(d) {
    depth = d;
    track.style.transform = 'translateX(' + (-depth * PANEL_W) + 'px)';
  }

  function open(x, y) { positionAt(x, y); goTo(0); menu.classList.add('is-open'); }
  function close() { menu.classList.remove('is-open'); goTo(0); }

  menu.addEventListener('click', function (e) {
    var openBtn = e.target.closest('[data-open]');
    var backBtn = e.target.closest('[data-back]');
    if (openBtn) goTo(parseInt(openBtn.getAttribute('data-open'), 10));
    else if (backBtn) goTo(0);
  });

  field.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    root.classList.remove('is-demo'); stopAutoplay();
    open(e.clientX, e.clientY);
  });
  document.addEventListener('pointerdown', function (e) {
    if (menu.classList.contains('is-open') && !menu.contains(e.target) && e.target !== field) close();
  });

  // 자동 루프: 메뉴를 연 뒤 depth 0 → 1(共有) → 0 → 2(もっと見る) 순으로 이동해 트랙이 패널 폭만큼
  // 밀렸다가 되돌아오는 것을 보여준다.
  var seq = [0, 1, 0, 2, 0];
  var si = 0, autoTimer = null, opened = false;
  function autoTick() {
    if (!opened) { var r = field.getBoundingClientRect(); open(r.left + 16, r.top + 16); opened = true; return; }
    goTo(seq[si % seq.length]);
    si++;
    if (si > seq.length + 1) { close(); opened = false; si = 0; }
  }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function stopAutoplay() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  if (!reduce) { autoTimer = setInterval(autoTick, 340); autoTick(); }
})();
</script>
</body>
</html>
