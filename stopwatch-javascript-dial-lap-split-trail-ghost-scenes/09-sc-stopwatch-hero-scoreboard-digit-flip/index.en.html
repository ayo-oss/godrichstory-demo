<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Scoreboard Hero With Big Digits and a Lap Feed — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="Stopwatch stage: Enter, Space, R or a click restarts, P pauses, N steps once">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="The big minute, second and centisecond digit board changes digit by digit as the top half folds down and the bottom half unfolds, and a lap list stacks up beside it. In both lists a new lap enters at the top and the rest step down one row. The left list keeps at most five rows so the oldest row leaves downward, while the right list has no row limit, so it pushes the digit board down and out of the panel"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">Stopwatch demo</p>
  <div class="vj__ctrl">
    <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
    <button class="vj__step" data-role="step" type="button">Step</button>
  </div>
  <p class="vj__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const PI = Math.PI;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 시드 고정 난수 — 선형 합동 생성기(곱 1664525, 더함 1013904223). 같은 시드면 같은 수열
    function seeded(seed) {
        let s = (seed >>> 0) || 1;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 파스텔 팔레트 — 글자는 늘 INK, 면은 연한 색. 앞섬은 민트, 뒤처짐은 분홍, 바늘은 라벤더·잉크
    const BG_TOP = [250, 246, 252];
    const BG_BOT = [228, 234, 250];
    const FACE = [255, 253, 248];
    const FACE_EDGE = [206, 198, 226];
    const SKY = [176, 210, 246];
    const SKY_DEEP = [74, 120, 176];
    const GOLD = [250, 226, 150];
    const GOLD_DEEP = [196, 150, 52];
    const ROSE = [240, 150, 176];
    const ROSE_DEEP = [190, 52, 86];
    const MINT = [150, 214, 190];
    const MINT_DEEP = [22, 112, 82];
    const LAV = [188, 172, 236];
    const LAV_DEEP = [104, 82, 176];
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 장면 시계(Seconds)·판 반복 번호·시간표 — 시간표는 (시각, 할 일) 목록이고 시각이 지나면 한 번씩 부른다
    // sceneT 는 rAF 타임스탬프 차이(dt, 한 프레임 0.05Seconds 상한)를 쌓은 값 하나뿐이다 — 이 장면의 시간 원천은 이것 하나
    let sceneT = 0;
    let lap = 0;
    let script = [];
    let evAt = 0;
    // ── 스톱워치 계산 ─────────────────────────────────────────
    // 경과 시간은 센티초 정수 하나다. 숫자판의 분·Seconds·센티초도, 문자반의 각도도 이 정수 하나에서만 나온다
    const CS_PER_SEC = 100;
    const CS_PER_MIN = 6000;
    let swStart = 0;
    let swStop = -1;
    // 장면 시각 t 에서의 경과 센티초 — 시작 전이면 0, 정지 뒤에는 정지 순간 값에 멈춘다
    function swCs(t) {
        const e = Math.min(t, swStop >= 0 ? swStop : 1e9) - swStart;
        return e <= 0 ? 0 : Math.floor(e * CS_PER_SEC + 1e-6);
    }
    // Lap — 누른 순간의 Total 센티초 목록. 값은 장면 시각 t 로 계산하므로 프레임 길이와 상관없다
    let marks = [];
    function pressLap(t) { marks.push(swCs(t)); }
    // Lap Segment = this total - previous total
    function lapSpan(i) { return marks[i] - (i > 0 ? marks[i - 1] : 0); }
    function pad2(n) { return n < 10 ? '0' + n : String(n); }
    // 센티초 → [분, Seconds, 센티초] — 정수 나눗셈만 쓴다
    function splitCs(cs) {
        const m = Math.floor(cs / CS_PER_MIN);
        const r = cs - m * CS_PER_MIN;
        const s = Math.floor(r / CS_PER_SEC);
        return [m, s, r - s * CS_PER_SEC];
    }
    function fmtCs(cs) {
        const p = splitCs(cs);
        return pad2(p[0]) + ':' + pad2(p[1]) + '.' + pad2(p[2]);
    }
    // 문자반 각도(라디안, 12시가 -π/2) — turnCs 센티초에 한 바퀴
    function dialAng(cs, turnCs) { return ((cs % turnCs) / turnCs) * TAU - PI / 2; }
    // 스톱워치 장면의 시작 상태 — 매 판 build() 맨 앞에서 부른다
    function swReset() {
        swStart = 0;
        swStop = -1;
        marks = [];
    }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const stepEl = root.querySelector('[data-role="step"]');
    const doneEl = root.querySelector('[data-role="done"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !stepEl || !doneEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const stepBtn = stepEl;
    const doneP = doneEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const VIEW_S = 0.88;
    function skyFill(top, bot) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bot, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        // 위쪽 Pause·상태 알약이 덮는 띠를 비우려고 장면 전체를 VIEW_S 배로 줄여 아래 가운데에 붙인다 — 이 줄 뒤에 그리는 것은 모두 줄어든 좌표계
        ctx.translate(W / 2, H - 3);
        ctx.scale(VIEW_S, VIEW_S);
        ctx.translate(-W / 2, -(H - 3));
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function oval(x, y, rx, ry, c, a) {
        if (rx <= 0.2 || ry <= 0.1 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function seg(x1, y1, x2, y2, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function outline(x, y, w, h, r, width, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 글자 이름표 — 바탕 알약 위에 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    // ── 공통 틀 ───────────────────────────────────────────────
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    // 한 판 시연이 끝났음을 스크린리더에 한 번만 알린다 — 판이 되풀이돼도 다시 읽지 않는다
    let doneSaid = false;
    function checkDone() {
        if (!doneSaid && sceneT >= RESULT_S) {
            doneSaid = true;
            doneP.textContent = statusText();
        }
    }
    function advance(dt) {
        sceneT += dt;
        while (evAt < script.length && script[evAt].t <= sceneT) {
            const ev = script[evAt];
            evAt += 1;
            ev.f();
        }
        if (sceneT >= LAP_S) {
            lap += 1;
            begin();
            return;
        }
        update(dt);
    }
    // 첫 판은 START_S 만큼 앞서 시작한다 — 바늘이 이미 도는 장면에서 보인다
    function runTo(t) {
        while (sceneT < t - 1e-6) {
            advance(Math.min(1 / 30, t - sceneT));
        }
    }
    function begin() {
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        if (lap === 0 && !still) {
            runTo(START_S);
        }
    }
    const DT_MAX = 0.05;
    function showNow() {
        draw();
        pushStatus(statusText());
        checkDone();
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        showNow();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 한 판의 멈춘 한 장. 시간표의 REST_S Seconds 장면에서 멈춘다
    function showRest() {
        stopLoop();
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        runTo(REST_S);
        doneSaid = false;
        showNow();
    }
    function play() {
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    // 다시 — 시간표를 처음부터 다시. 움직임 줄이기에서는 멈춘 한 장
    function restart() {
        lap += 1;
        doneSaid = false;
        if (still) {
            showRest();
            return;
        }
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    // Step — 멈춘 채 시간표의 다음 일 하나까지 시계를 보낸다. 더 부를 일이 없으면 판을 다시 연다
    function stepOnce() {
        wake();
        if (!paused) {
            paused = true;
            pauseBtn.setAttribute('aria-pressed', 'true');
            stopLoop();
        }
        if (evAt >= script.length) {
            restart();
            return;
        }
        runTo(script[evAt].t + 0.05);
        showNow();
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    stepBtn.addEventListener('click', stepOnce, { signal: off.signal });
    // 키보드 — 무대에 포커스가 있을 때만. Enter·Space·R 은 처음부터 다시, P 는 Pause, N 은 Step
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        const k = e.key;
        if (k === 'Enter' || k === ' ') {
            e.preventDefault();
            wake();
            restart();
        }
        else if (k === 'p' || k === 'P') {
            togglePause();
        }
        else if (k === 'n' || k === 'N') {
            stepOnce();
        }
        else if (k === 'r' || k === 'R') {
            wake();
            restart();
        }
    }, { signal: off.signal });
    // 마우스·터치 — 무대를 누르면 처음부터 다시
    pad.addEventListener('click', function () {
        wake();
        restart();
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 결과 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            lap = 0;
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        showNow();
    }, { signal: off.signal });
    // ── 문자반·숫자판 도구 ─────────────────────────────────────
    const PEACH = [250, 204, 170];
    const PEACH_DEEP = [176, 92, 40];
    // 안쪽에서 바깥쪽으로 — 눈금 ticks 개, majorEvery 번째마다 굵게, labelEvery 번째마다 숫자
    function dialFace(cx, cy, R, ticks, majorEvery, labels, labelEvery) {
        disc(cx, cy + 3, R + 3, INK, 0.1);
        disc(cx, cy, R + 3, FACE_EDGE, 1);
        disc(cx, cy, R, FACE, 1);
        for (let i = 0; i < ticks; i += 1) {
            const a = (i / ticks) * TAU - PI / 2;
            const major = i % majorEvery === 0;
            const r0 = R * (major ? 0.82 : 0.9);
            const r1 = R * 0.96;
            seg(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, cx + Math.cos(a) * r1, cy + Math.sin(a) * r1, major ? 2.4 : 1.2, INK, major ? 0.85 : 0.45);
            if (labels.length > 0 && i % labelEvery === 0) {
                const k = Math.floor(i / labelEvery);
                if (k < labels.length) {
                    text(labels[k], cx + Math.cos(a) * R * 0.66, cy + Math.sin(a) * R * 0.66, INK, 0.9, Math.max(9, Math.round(R * 0.15)), 700, 'center');
                }
            }
        }
    }
    function handAt(cx, cy, ang, len, tail, width, c, a) {
        seg(cx - Math.cos(ang) * tail, cy - Math.sin(ang) * tail, cx + Math.cos(ang) * len, cy + Math.sin(ang) * len, width, c, a);
    }
    function hub(cx, cy, r, c) {
        disc(cx, cy, r, c, 1);
        disc(cx, cy, r * 0.4, FACE, 1);
    }
    // 12시에서 ang 까지 칠하는 부채꼴
    function wedge(cx, cy, r, ang, c, a) {
        if (ang <= -PI / 2 + 0.002) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, -PI / 2, ang);
        ctx.closePath();
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function arcBand(cx, cy, r, a0, a1, width, c, a) {
        if (a1 - a0 < 0.0005 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(cx, cy, r, a0, a1);
        ctx.lineWidth = width;
        ctx.lineCap = 'butt';
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function panel(x, y, w, h, c, a) {
        box(x, y, w, h, 12, c, a);
        outline(x, y, w, h, 12, 1.5, FACE_EDGE, 0.9);
    }
    // 한 글자씩 같은 칸에 가운데 맞춰 찍는다 — 숫자 폭이 달라도 자릿수가 흔들리지 않는다(tabular)
    function digitsRow(s, cx, y, cellW, px, c, a) {
        let total = 0;
        for (let i = 0; i < s.length; i += 1) {
            total += (s[i] === ':' || s[i] === '.') ? cellW * 0.55 : cellW;
        }
        let x = cx - total / 2;
        for (let i = 0; i < s.length; i += 1) {
            const w = (s[i] === ':' || s[i] === '.') ? cellW * 0.55 : cellW;
            text(s[i], x + w / 2, y, c, a, px, 800, 'center');
            x += w;
        }
    }
    // ── 09 큰 숫자판과 Lap 목록이 어우러진 전광판 ─────────────────────
    // 숫자판 여섯 자리 중 앞 다섯 자리는 값이 바뀔 때 FLIP_S 동안 위 반쪽이 접히고 아래 반쪽이 펴진다(맨 끝 센티초 자리는 너무 빨리 바뀌어 그냥 바꾼다)
    // 두 목록 모두 새 랩이 맨 위로 들어오고 나머지가 한 줄씩 내려간다. 왼쪽은 LIST_MAX 줄을 넘으면 가장 오래된 줄이 아래로 사라지고, 오른쪽은 줄 수 제한이 없어 목록이 숫자판을 아래로 밀어낸다
    const LIST_MAX = 5;
    const FLIP_S = 0.07;
    const SLIDE_S = 0.25;
    const ROW_H = 24;
    const PRESS_FIRST = 1.0;
    const PRESS_GAP = 1.15;
    const PRESS_N = 14;
    const LAP_S = 18.5;
    const START_S = 14.2;
    const REST_S = 14.2;
    const RESULT_S = 16.5;
    let pressT = [];
    let curCh = [];
    let prevCh = [];
    let chAt = [];
    function build() {
        swReset();
        pressT = [];
        curCh = fmtCs(0).split('');
        prevCh = fmtCs(0).split('');
        chAt = [];
        for (let i = 0; i < curCh.length; i += 1) {
            chAt.push(-9);
        }
        for (let i = 0; i < PRESS_N; i += 1) {
            const t = PRESS_FIRST + i * PRESS_GAP + ((lap * 3 + i * 7) % 5) * 0.03;
            pressT.push(t);
            script.push({ t: t, f: function () { pressLap(t); } });
        }
    }
    function update(dt) {
        if (dt < 0) {
            return;
        }
        const s = fmtCs(swCs(sceneT));
        for (let i = 0; i < s.length; i += 1) {
            if (s[i] !== curCh[i]) {
                prevCh[i] = curCh[i];
                curCh[i] = s[i];
                chAt[i] = sceneT;
            }
        }
    }
    // 위 반쪽(half 0) 또는 아래 반쪽(half 1) 한 장 — 가운데 줄을 축으로 sy 배로 눌러 그린다
    function halfCard(ch, x, y, w, h, half, sy) {
        if (sy <= 0.01) {
            return;
        }
        const mid = y + h / 2;
        ctx.save();
        ctx.translate(0, mid);
        ctx.scale(1, sy);
        ctx.translate(0, -mid);
        ctx.beginPath();
        ctx.rect(x, half === 0 ? y : mid, w, h / 2);
        ctx.clip();
        box(x, y, w, h, 7, half === 0 ? [255, 255, 255] : [244, 240, 250], 1);
        text(ch, x + w / 2, mid + 1, INK, 1, Math.round(h * 0.7), 800, 'center');
        ctx.restore();
    }
    function flipCell(i, x, y, w, h) {
        const p = clamp((sceneT - chAt[i]) / FLIP_S, 0, 1);
        const mid = y + h / 2;
        if (i === curCh.length - 1 || p >= 1) {
            halfCard(curCh[i], x, y, w, h, 0, 1);
            halfCard(curCh[i], x, y, w, h, 1, 1);
        }
        else {
            halfCard(curCh[i], x, y, w, h, 0, 1);
            halfCard(prevCh[i], x, y, w, h, 1, 1);
            if (p < 0.5) {
                halfCard(prevCh[i], x, y, w, h, 0, 1 - 2 * p);
            }
            else {
                halfCard(curCh[i], x, y, w, h, 1, 2 * p - 1);
            }
        }
        seg(x, mid, x + w, mid, 1.2, INK, 0.35);
    }
    function digitsBoard(px, y) {
        const w = 26;
        const h = 54;
        let x = px + 17;
        for (let i = 0; i < curCh.length; i += 1) {
            if (curCh[i] === ':' || curCh[i] === '.') {
                text(curCh[i], x + 7, y + h / 2 + 2, INK, 1, 28, 800, 'center');
                x += 14;
            }
            else {
                flipCell(i, x, y, w, h);
                x += w + 3;
            }
        }
    }
    function rowAt(px, i, y, a) {
        box(px + 10, y, 206, ROW_H - 3, 7, LAV, 0.35 * a);
        text('Lap {n}'.replace('{n}', String(i + 1)), px + 20, y + (ROW_H - 3) / 2, INK, a, 12, 800, 'left');
        digitsRow(fmtCs(lapSpan(i)), px + 150, y + (ROW_H - 3) / 2, 8, 13, INK, a);
    }
    function draw() {
        skyFill(BG_TOP, BG_BOT);
        panel(10, 40, 226, 252, [255, 255, 255], 0.5);
        panel(244, 40, 226, 252, [255, 255, 255], 0.5);
        tag('Keeps five rows at most', 123, 26, MINT, INK, 11, 'center');
        tag('No row limit', 357, 26, ROSE, INK, 11, 'center');
        const n = marks.length;
        const s = n > 0 ? 1 - ease((sceneT - pressT[n - 1]) / SLIDE_S) : 0;
        // 왼쪽 — 숫자판은 위에 고정, 목록은 LIST_MAX 줄
        digitsBoard(10, 50);
        ctx.save();
        ctx.beginPath();
        ctx.rect(10, 116, 226, LIST_MAX * ROW_H + 4);
        ctx.clip();
        for (let j = 0; j <= LIST_MAX && j < n; j += 1) {
            // j 는 새 랩부터 센 순번 — 새 랩이 맨 위로 들어오면 나머지가 한 줄씩 내려가고 LIST_MAX 번째 줄은 아래로 사라진다
            rowAt(10, n - 1 - j, 118 + (j - s) * ROW_H, j === LIST_MAX ? s : (j === 0 ? 1 - s : 1));
        }
        ctx.restore();
        // 오른쪽 — 목록이 먼저 쌓이고 숫자판은 그 아래로 밀려난다
        ctx.save();
        ctx.beginPath();
        ctx.rect(244, 40, 226, 252);
        ctx.clip();
        const top = 50;
        for (let j = 0; j < n; j += 1) {
            rowAt(244, n - 1 - j, top + (j - s) * ROW_H, j === 0 ? 1 - s : 1);
        }
        digitsBoard(244, top + (n - s) * ROW_H + 4);
        ctx.restore();
    }
    function statusText() {
        const n = marks.length;
        return 'Elapsed {t} - lap {n} - list of {k} rows vs {n} rows'.replace('{t}', fmtCs(swCs(sceneT))).replace('{k}', String(Math.min(n, LIST_MAX))).replace('{n}', String(n)).replace('{n}', String(n));
    }
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
