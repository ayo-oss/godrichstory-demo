<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integrity check: size and hash — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="Space or Enter pauses, R restarts, left and right arrows pick another file bundle">
      <div class="ez__scene" data-role="scene" role="img" aria-label="Each file shows the recorded size and hash beside the freshly read pair; either one differing is classed damaged and that count accumulates"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">Scene ready</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {
    // ── 540 공통 — n8n 워크플로 백업 3종 엔진 (539 base 계승)
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function fill(s) {
        const v = [];
        for (let _i = 1; _i < arguments.length; _i += 1) {
            v[_i - 1] = arguments[_i];
        }
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? String(v[i]) : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        scWrap.textContent = '';
        chartEl.textContent = '';
        probeEl.textContent = '';
        // 씬 바로 아래 두는 집계 오버레이(.ov) 도 다시 만든다 — 지우지 않으면 묶음을 바꿀 때 옛 칩이 쌓인다
        const ovs = sceneEl.querySelectorAll('.ov');
        for (let i = 0; i < ovs.length; i += 1) {
            sceneEl.removeChild(ovs[i]);
        }
    }
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function spanOf(d, dur, k) { return { s: d, e: d + dur, k: k === undefined ? 0 : k }; }
    function bar(cls, x, y, w, h) {
        const e = make('i', cls, chartEl);
        put(e, x, y, w, h);
        return e;
    }
    function drawRows(segs, max) {
        const n = segs.length;
        const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
        for (let i = 0; i < n; i += 1) {
            const sg = segs[i];
            const x = CX0 + clamp(sg.s, 0, max) / max * CW;
            const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
            bar('bar k' + sg.k, x, 5 + i * (h + 1), w, h);
        }
    }
    function axis(max) {
        const a = make('b', 'ax', chartEl);
        a.textContent = '0';
        put(a, CX0, 40, 0, 0);
        const b = make('b', 'ax ax--r', chartEl);
        b.textContent = f0(max) + 'ms';
        put(b, CX0 + CW - 60, 40, 0, 0);
    }
    let headEl = null;
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    function ema(prev, x, k) {
        return prev + (x - prev) * k;
    }
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            piNow = pi;
            cycle = Math.max(2000, cfg.build(pi));
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            // 움직임 줄이기에서는 애니메이션이 꺼져 있어 tick 이 상태를 다시 그리지 않는다 — 입력(다른 묶음) 을 바로 그린다
            if (reduced) {
                statusP.textContent = cfg.frame(1e9);
            }
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                setPaused(true);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            // 마지막 상태를 보여 준다 — 상태 줄은 계산 최종값, 낭독 문장(done) 은 요약 문장
            statusP.textContent = cfg.frame(1e9);
            doneP.textContent = readB.textContent;
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }


    // ── 540-03 무결성 대조 — 파일마다 "기록된 크기·해시" 와 "지금 읽은 크기·해시" 쌍이 나란히 놓이는 대조표.
    //    리퀴드 글래스 — 반투명 면·가장자리 하이라이트. 두 쌍이 모두 같으면 정상, 하나라도 어긋나면 훼손.
    //    계산: 크기 차 sizeDiff = |bytes 기록 − bytes 실측|, 훼손 damaged = (sizeDiff > SIZE_TOL) OR (해시 다름)
    //    바퀴 1 은 전부 정상, T_WAVE 에 두 파일이 상한다 — 하나는 내용이 바뀌고(해시·크기 모두 다름),
    //    하나는 끝에 32바이트가 붙는다(크기만 다름 — SIZE_TOL 64 로 올리면 이 판이 검증을 통과해 버린다)
    const SIZE_TOL = 0;        // 변형 3: 0 → 64 (bytes. 데모 상수 — n8n 의 기본값이 아니다)
    const MOD = 9973;
    const BASE = 31;
    const FILE_N = 5;          // 대조표 파일 수
    const PAD_BYTES = 32;      // 크기만 어긋나는 파일에 붙은 바이트 수
    const T_SCAN0 = 200;       // 첫 변화는 150ms 뒤
    const T_ROW = 120;         // 한 파일을 대조하는 시간
    const T_SCAN = FILE_N * T_ROW;   // 5 파일 = 600ms
    const T_WAVE = 900;        // 두 파일이 상하는 순간
    const T_RES = 1040;        // 재대조 시작
    const ROW_H = 25;
    const ROW_Y0 = 22;
    let rows = [];             // { el, recEl, readEl, statEl, rec, good, bad, pad, hurt: 'content'|'pad'|null }
    let beamEl = null;         // 대조 빔 — 지금 읽는 행을 비추는 스펙큘러 띠
    let glassEl = null;
    let ov3 = {};
    // foldHash — 31 진 가중합 mod 9973. 가중치는 매 글자 (p×31) mod 9973 로 누적한다 (배정밀도 초과 방지)
    function foldHash(s) {
        let h = 0;
        let p = 1;
        for (let i = 0; i < s.length; i += 1) {
            h = (h + s.charCodeAt(i) * p) % MOD;
            p = (p * BASE) % MOD;
        }
        return h;
    }
    // 파일 내용 — 시드가 정하는 노드 이름 나열. bytes = 문자 수
    function fileBody(k, seed, variant) {
        const names = ['webhook', 'set', 'if', 'http', 'merge', 'code', 'split', 'sheets'];
        const n = 4 + Math.floor(seedHash(k * 5 + 3, seed) * 4);   // 4 에서 7 개 노드
        const parts = [];
        for (let j = 0; j < n; j += 1) {
            parts.push(names[Math.floor(seedHash(k * 13 + j * 3 + 1, seed) * names.length)]);
        }
        if (variant === 'content') {
            // 내용 훼손 — 마지막 노드가 다른 이름으로 바뀐다 (같은 이름이 걸리면 한 칸 민다 — 반드시 달라진다).
            // 바뀐 이름의 길이가 다르면 bytes 도 달라지고, 길이가 같아도 해시는 달라진다
            let id = (names.indexOf(parts[parts.length - 1]) + 1 + (k % 3)) % names.length;
            if (names[id] === parts[parts.length - 1]) {
                id = (id + 1) % names.length;
            }
            parts[parts.length - 1] = names[id];
        }
        return 'wf-' + f0(k + 1) + ':' + parts.join('|');
    }
    // check — 한 파일의 판정. sizeDiff = |bytes 기록 − bytes 실측|, damaged = sizeDiff > SIZE_TOL OR 해시 다름
    function check(rec, read) {
        const sizeDiff = Math.abs(rec.bytes - read.bytes);
        const hashDiff = rec.h !== read.h;
        return { sizeDiff: sizeDiff, hashDiff: hashDiff, damaged: (sizeDiff > SIZE_TOL) || hashDiff };
    }
    function build(i) {
        const seeds = [3.1, 5.9, 8.3];
        const seed = seeds[i];
        rows = [];
        glassEl = make('div', 'glass', scWrap);
        put(glassEl, 4, 4, 316, 148);
        const hd = make('b', 'glass__hd', glassEl);
        put(hd, 88, 4, 0, 0);
        hd.textContent = 'recorded';
        const hd2 = make('b', 'glass__hd glass__hd--r', glassEl);
        put(hd2, 176, 4, 0, 0);
        hd2.textContent = 'read now';
        // 상한 파일 두 개 — 시드가 정한다. content 는 해시·크기 모두, pad 는 크기만 어긋난다
        const contentK = Math.floor(seedHash(21, seed) * FILE_N);
        let padK = Math.floor(seedHash(23, seed) * FILE_N);
        if (padK === contentK) {
            padK = (padK + 2) % FILE_N;
        }
        for (let k = 0; k < FILE_N; k += 1) {
            const r = make('div', 'row', glassEl);
            put(r, 4, ROW_Y0 + k * ROW_H, 308, ROW_H - 2);
            const nm = make('b', 'row__nm', r);
            nm.textContent = 'wf-' + f0(k + 1) + '.json';
            const rec = make('b', 'row__pair', r);
            const rd = make('b', 'row__pair row__pair--read', r);
            rd.textContent = '';
            const st = make('b', 'row__stat', r);
            st.textContent = '';
            const bodyGood = fileBody(k, seed, 'good');
            const bodyBad = fileBody(k, seed, 'content');
            const g = { bytes: bodyGood.length, h: foldHash(bodyGood) };
            rows.push({
                el: r, recEl: rec, readEl: rd, statEl: st,
                rec: g, good: g,
                bad: { bytes: bodyBad.length, h: foldHash(bodyBad) },
                pad: { bytes: bodyGood.length + PAD_BYTES, h: g.h },
                hurt: k === contentK ? 'content' : (k === padK ? 'pad' : null)
            });
            rec.textContent = g.bytes + 'B · ' + f0(g.h);
        }
        beamEl = make('i', 'beam', glassEl);
        put(beamEl, 176, ROW_Y0, 84, ROW_H - 2);    // read 열(x 176~260) 만 비춘다 — 기록된 쌍을 덮지 않는다
        ov3 = {};
        const keys = ['ok', 'sz', 'hs'];
        const ys = [32, 56, 80];
        for (let n = 0; n < 3; n += 1) {
            const o = make('b', 'ov ovs', sceneEl);
            put(o, 328, ys[n], 0, 0);
            ov3[keys[n]] = o;
        }
        const f1e = make('b', 'ov ov--s', sceneEl);
        put(f1e, 328, 108, 0, 0);
        f1e.textContent = 'sizeDiff = |rec − read|';
        const f2e = make('b', 'ov ov--s', sceneEl);
        put(f2e, 328, 124, 0, 0);
        f2e.textContent = 'damaged = tol OR hash ≠';
        setReads('verify(bytes, hash) — SIZE_TOL ' + f0(SIZE_TOL) + ' bytes · FILE_N ' + f0(FILE_N),
            'recorded pair beside the freshly read pair, any mismatch is damaged');
        drawRows([spanOf(0, T_SCAN0, 0), spanOf(T_SCAN0, T_SCAN, 1), spanOf(T_SCAN0 + T_SCAN, T_WAVE - T_SCAN0 - T_SCAN, 0), spanOf(T_WAVE, T_RES - T_WAVE, 2), spanOf(T_RES, 2000 - T_RES, 1)], 2000);
        axis(2000);
        doneP.textContent = '';
        return 2000;
    }
    function frame(t) {
        if (rows.length === 0) {
            return '';
        }
        // 바퀴 — 1 은 T_SCAN0 부터, 2 는 T_RES 부터 (상한 뒤). readK = 이번 바퀴에서 읽은 파일 수, acc = 지금 읽는 파일의 진행
        const second = t >= T_RES;
        const t0 = second ? T_RES : T_SCAN0;
        const raw = clamp((t - t0) / T_ROW, 0, FILE_N);
        const readK = Math.floor(raw);
        const acc = raw - readK;
        const hurt = t >= T_WAVE;
        let damagedN = 0;
        let okN = 0;
        let lastDiff = 0;
        let lastHashDiff = false;
        let padDiff = 0;
        let padPassed = false;
        for (let k = 0; k < FILE_N; k += 1) {
            const r = rows[k];
            const readDone = k < readK;
            const reading = k === readK && acc > 0;
            // 지금 읽은 값 — 1 바퀴는 전부 기록과 같다. 2 바퀴(T_RES 부터)부터 hurt 파일이 bad/pad 값을 가진다.
            // 상한은 T_WAVE 에 일어나지만 읽은 쌍은 다시 읽기 전까지 옛 값을 유지한다 (재대조 전엔 훼손이 안 보인다)
            let now = r.good;
            if (second && r.hurt === 'content') {
                now = r.bad;
            }
            else if (second && r.hurt === 'pad') {
                now = r.pad;
            }
            const c = check(r.rec, now);
            if (readDone) {
                if (c.damaged) {
                    damagedN += 1;
                }
                else {
                    okN += 1;
                }
            }
            if (r.hurt === 'pad') {
                padDiff = c.sizeDiff;
                padPassed = readDone && second && !c.damaged;
            }
            r.el.setAttribute('data-read', readDone ? '1' : '0');
            r.el.setAttribute('data-reading', reading ? '1' : '0');
            r.el.setAttribute('data-damaged', readDone && c.damaged ? '1' : '0');
            r.el.setAttribute('data-hurt', hurt && r.hurt ? '1' : '0');
            // 읽은 쌍 — 읽는 진행만큼 자릿수가 차오른다 (계산: 값 × acc). 다 읽으면 확정값
            if (readDone) {
                r.readEl.textContent = now.bytes + 'B · ' + f0(now.h);
                r.statEl.textContent = c.damaged ? 'DAMAGED' : 'ok';
            }
            else if (reading) {
                r.readEl.textContent = Math.floor(now.bytes * acc) + 'B · ' + f0(Math.floor(now.h * acc));
                r.statEl.textContent = '';
            }
            else {
                r.readEl.textContent = '';
                r.statEl.textContent = '';
            }
            if (readDone || reading) {
                lastDiff = c.sizeDiff;
                lastHashDiff = c.hashDiff;
            }
        }
        // 빔 — 지금 읽는 행을 따라가는 스펙큘러 띠. 계산: raw → y
        if (readK < FILE_N && t >= t0) {
            beamEl.style.opacity = '1';
            beamEl.style.transform = 'translateY(' + f1(raw * ROW_H) + 'px)';
        }
        else {
            beamEl.style.opacity = '0';
        }
        // 유리 하이라이트 — 읽은 비율만큼 가장자리 광택이 도는 각도가 정해진다 (계산: raw/FILE_N → --hl)
        glassEl.style.setProperty('--hl', f2(clamp((t - t0) / T_SCAN, 0, 1)));
        if (ov3.ok) {
            ov3.ok.textContent = 'damaged ' + f0(damagedN) + ' · ok ' + f0(okN);
            ov3.sz.textContent = 'sizeDiff ' + f0(lastDiff) + 'B';
            ov3.hs.textContent = 'hash ≠ ' + (lastHashDiff ? 'true' : 'false') + (padPassed ? ' · pad passed' : '');
        }
        return fill('read {a}/{b} · damaged {c} · intact {d} · size diff now {e}B', f0(readK), f0(FILE_N), f0(damagedN), f0(okN), f0(lastDiff));
    }


    return run({ count: 3, build: build, frame: frame });
}
})()

</script>
</body>
</html>
