<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>決済バーのスクロール反応 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cscr is-demo" id="cscr">
  <div class="cscr__panel">
    <div class="cscr__scroll" id="cscrScroll">
      <ul class="cscr__list">
        <li class="cscr__row"><span>タンブラー</span><b>$16</b></li>
        <li class="cscr__row"><span>ノート</span><b>$8</b></li>
        <li class="cscr__row"><span>ポーチ</span><b>$14</b></li>
        <li class="cscr__row"><span>キーリング</span><b>$6</b></li>
        <li class="cscr__row"><span>キャンドル</span><b>$18</b></li>
      </ul>
    </div>
    <footer class="cscr__bar" id="cscrBar">
      <span>合計</span>
      <b id="cscrTotal">$62</b>
    </footer>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('cscr');
  var scrollEl = document.getElementById('cscrScroll');
  var bar = document.getElementById('cscrBar');

  // 계산 겹: 스크롤 진행률(0~1)을 매 프레임 lerp() 로 그림자 강도·bar 높이 값에 보간한다 —
  // 스크롤 위치를 그대로 쓰지 않고 목표 값 쪽으로 매 프레임 조금씩 다가가는 관성 보간이다.
  function lerp(a, b, t) { return a + (b - a) * t; }

  var maxScroll = 1;
  function computeMax() {
    maxScroll = Math.max(1, scrollEl.scrollHeight - scrollEl.clientHeight);
  }

  var shadow = 0;
  var raf = null;
  function tick() {
    var target = Math.min(1, scrollEl.scrollTop / maxScroll);
    shadow = lerp(shadow, target, 0.18);
    bar.style.setProperty('--shadow-op', shadow.toFixed(3));
    bar.style.transform = 'translateY(' + (-shadow * 2).toFixed(2) + 'px)';
    if (Math.abs(target - shadow) > 0.002) {
      raf = requestAnimationFrame(tick);
    } else {
      raf = null;
    }
  }
  function kick() {
    if (!raf) { raf = requestAnimationFrame(tick); }
  }

  function stopOnRealInput() {
    root.classList.remove('is-demo');
    stopAutoplay();
  }
  scrollEl.addEventListener('wheel', stopOnRealInput, { passive: true });
  scrollEl.addEventListener('pointerdown', stopOnRealInput);
  scrollEl.addEventListener('scroll', kick);

  var autoplayRaf = null;
  function stopAutoplay() {
    if (autoplayRaf) { cancelAnimationFrame(autoplayRaf); autoplayRaf = null; }
  }

  computeMax();
  window.addEventListener('resize', computeMax);

  var CYCLE_MS = 1600;
  function autoLoop(now) {
    var p = (now % CYCLE_MS) / CYCLE_MS;
    var tri = p < 0.5 ? p * 2 : 2 - p * 2;
    scrollEl.scrollTop = tri * maxScroll;
    var target = Math.min(1, scrollEl.scrollTop / maxScroll);
    shadow = lerp(shadow, target, 0.18);
    bar.style.setProperty('--shadow-op', shadow.toFixed(3));
    bar.style.transform = 'translateY(' + (-shadow * 2).toFixed(2) + 'px)';
    autoplayRaf = requestAnimationFrame(autoLoop);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplayRaf = requestAnimationFrame(autoLoop);
  }
})();
</script>
</body>
</html>
