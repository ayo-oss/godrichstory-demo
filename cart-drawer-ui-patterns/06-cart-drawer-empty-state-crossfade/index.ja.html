<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空の状態のクロスフェード — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cesc is-demo" id="cesc">
  <div class="cesc__panel">
    <header class="cesc__head">カート</header>
    <div class="cesc__body">
      <div class="cesc__empty" id="cescEmpty">
        <span class="cesc__icon" aria-hidden="true">
          <svg viewBox="0 0 256 256" width="34" height="34"><g fill="currentColor" opacity=".6"><path d="M216 48h-40v-8a24 24 0 0 0-24-24h-48a24 24 0 0 0-24 24v8H40a8 8 0 0 0 0 16h8v144a16 16 0 0 0 16 16h128a16 16 0 0 0 16-16V64h8a8 8 0 0 0 0-16ZM96 40a8 8 0 0 1 8-8h48a8 8 0 0 1 8 8v8H96Zm96 168H64V64h128Z"/></g></svg>
        </span>
        <p class="cesc__msg">カートは空です</p>
      </div>
      <ul class="cesc__list" id="cescList">
        <li class="cesc__row"><span>レザーウォレット</span><b>$36</b></li>
        <li class="cesc__row"><span>サングラス</span><b>$29</b></li>
      </ul>
    </div>
    <button class="cesc__toggle" id="cescToggle" type="button">入れる／空にする</button>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('cesc');
  var emptyEl = document.getElementById('cescEmpty');
  var listEl = document.getElementById('cescList');
  var toggleBtn = document.getElementById('cescToggle');

  // 계산 겹: 하나의 진행값(p, 0~1)을 이징해 두 상태의 opacity 를 서로 반대 방향으로 동시에
  // 계산한다(crossfadeApply()) — 두 애니메이션을 따로 걸지 않고 한 값에서 상보적으로 도출한다.
  function easeInOutCubic(p) {
    return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  }
  var DUR_MS = 420;
  var hasItems = false;
  var raf = null;

  function crossfadeApply(p, toItems) {
    var eased = easeInOutCubic(p);
    var itemsOpacity = toItems ? eased : 1 - eased;
    var emptyOpacity = 1 - itemsOpacity;
    listEl.style.opacity = itemsOpacity.toFixed(3);
    listEl.style.transform = 'scale(' + (0.96 + itemsOpacity * 0.04).toFixed(3) + ')';
    emptyEl.style.opacity = emptyOpacity.toFixed(3);
    emptyEl.style.transform = 'scale(' + (0.96 + emptyOpacity * 0.04).toFixed(3) + ')';
  }

  function run(toItems) {
    if (raf) { cancelAnimationFrame(raf); }
    var start = performance.now();
    function frame(now) {
      var p = Math.min(1, (now - start) / DUR_MS);
      crossfadeApply(p, toItems);
      if (p < 1) {
        raf = requestAnimationFrame(frame);
      } else {
        raf = null;
        hasItems = toItems;
      }
    }
    raf = requestAnimationFrame(frame);
  }

  toggleBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    run(!hasItems);
  });

  var autoplayTimer = null;
  function stopAutoplay() {
    if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
  }

  crossfadeApply(0, false);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplayTimer = setInterval(function () { run(!hasItems); }, 1300);
  }
})();
</script>
</body>
</html>
