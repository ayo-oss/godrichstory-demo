<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スワイプのラバーバンド — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cswr is-demo" id="cswr">
  <ul class="cswr__list">
    <li class="cswr__row" id="cswrRow">
      <span class="cswr__trash" aria-hidden="true">
        <svg viewBox="0 0 256 256" width="18" height="18"><g fill="currentColor"><path d="M216 48h-40v-8a24 24 0 0 0-24-24h-48a24 24 0 0 0-24 24v8H40a8 8 0 0 0 0 16h8v144a16 16 0 0 0 16 16h128a16 16 0 0 0 16-16V64h8a8 8 0 0 0 0-16ZM96 40a8 8 0 0 1 8-8h48a8 8 0 0 1 8 8v8H96Zm96 168H64V64h128Zm-80-104v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0Zm48 0v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0Z"/></g></svg>
      </span>
      <span class="cswr__card" id="cswrCard">
        <span class="cswr__name">ランニングシューズ</span>
        <span class="cswr__price">$41</span>
      </span>
    </li>
  </ul>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('cswr');
  var card = document.getElementById('cswrCard');
  var row = document.getElementById('cswrRow');

  // 계산 겹: 드래그 거리가 임계값을 넘으면 저항 함수(rubberband())로 이동량을 압축한다 —
  // 당길수록 화면에 반영되는 비율이 줄어드는 진짜 고무줄 공식(iOS 오버스크롤과 같은 계열),
  // 단순 clamp 가 아니다.
  var THRESHOLD = 90;
  var MAX_PULL = 140;
  function rubberband(dx) {
    var sign = dx < 0 ? -1 : 1;
    var abs = Math.abs(dx);
    if (abs <= THRESHOLD) { return dx; }
    var over = abs - THRESHOLD;
    var compressed = MAX_PULL * (1 - Math.exp(-over / MAX_PULL));
    return sign * (THRESHOLD + compressed);
  }

  var dragging = false;
  var startX = 0;
  var current = 0;

  function apply(dx) {
    var x = rubberband(dx);
    card.style.transform = 'translateX(' + x.toFixed(2) + 'px)';
    var trashOpacity = Math.min(1, Math.abs(x) / THRESHOLD);
    row.style.setProperty('--trash-opacity', trashOpacity.toFixed(3));
  }

  function onDown(clientX) {
    dragging = true;
    startX = clientX - current;
    root.classList.remove('is-demo');
    stopAutoplay();
  }
  function onMove(clientX) {
    if (!dragging) { return; }
    current = clientX - startX;
    apply(current);
  }
  function onUp() {
    if (!dragging) { return; }
    dragging = false;
    if (Math.abs(current) > THRESHOLD * 1.3) {
      dismiss(current < 0 ? -1 : 1);
    } else {
      current = 0;
      card.style.transition = 'transform ' + DUR + 'ms';
      apply(0);
      setTimeout(function () { card.style.transition = ''; }, DUR);
    }
  }
  var DUR = 260;

  function dismiss(dir) {
    card.style.transition = 'transform 320ms ease-in, opacity 320ms ease-in';
    card.style.transform = 'translateX(' + (dir * 420) + 'px)';
    card.style.opacity = '0';
    setTimeout(function () {
      card.style.transition = '';
      card.style.transform = 'translateX(0)';
      card.style.opacity = '1';
      current = 0;
      row.style.setProperty('--trash-opacity', '0');
    }, 420);
  }

  card.addEventListener('pointerdown', function (e) { onDown(e.clientX); });
  window.addEventListener('pointermove', function (e) { onMove(e.clientX); });
  window.addEventListener('pointerup', onUp);

  var autoplayTimer = null;
  function stopAutoplay() {
    if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
  }

  function autoStep() {
    var t0 = performance.now();
    var DUR_MS = 900;
    function anim(now) {
      var p = Math.min(1, (now - t0) / DUR_MS);
      var dx = p < 0.7 ? (p / 0.7) * 270 : 270 * (1 - (p - 0.7) / 0.3);
      apply(dx);
      if (p < 1) { requestAnimationFrame(anim); } else { apply(0); }
    }
    requestAnimationFrame(anim);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoStep();
    autoplayTimer = setInterval(autoStep, 1500);
  }
})();
</script>
</body>
</html>
