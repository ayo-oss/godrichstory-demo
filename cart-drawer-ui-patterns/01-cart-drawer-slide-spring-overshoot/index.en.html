<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide Overshoot — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cdso is-demo" id="cdso">
  <div class="cdso__page">
    <div class="cdso__card"></div>
    <div class="cdso__card"></div>
    <div class="cdso__card"></div>
    <button class="cdso__toggle" id="cdsoToggle" type="button">Open cart</button>
  </div>
  <div class="cdso__backdrop" id="cdsoBackdrop"></div>
  <aside class="cdso__panel" id="cdsoPanel">
    <header class="cdso__head">
      <span class="cdso__title">Cart</span>
      <button class="cdso__close" id="cdsoClose" type="button" aria-label="Close">
        <svg viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg>
      </button>
    </header>
    <ul class="cdso__list">
      <li class="cdso__row"><span>Cotton Tee</span><b>$24</b></li>
      <li class="cdso__row"><span>Canvas Tote</span><b>$18</b></li>
      <li class="cdso__row"><span>Ceramic Mug</span><b>$12</b></li>
    </ul>
    <footer class="cdso__foot"><span>Total</span><b>$54</b></footer>
  </aside>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('cdso');
  var panel = document.getElementById('cdsoPanel');
  var backdrop = document.getElementById('cdsoBackdrop');
  var toggle = document.getElementById('cdsoToggle');
  var closeBtn = document.getElementById('cdsoClose');

  // 계산 겹: 감쇠 조화진동자(스프링) 방정식을 매 프레임 직접 풀어 위치 값을 만든다 — easing 곡선을
  // 빌려 쓰는 게 아니라 감쇠비(ZETA)·고유진동수(OMEGA) 로 목표를 넘었다가(오버슛) 되돌아오는 값을 계산한다.
  var ZETA = 0.42;
  var OMEGA = 9.5;
  var OMEGA_D = OMEGA * Math.sqrt(1 - ZETA * ZETA);
  function springProgress(tSec) {
    if (tSec <= 0) { return 0; }
    var env = Math.exp(-ZETA * OMEGA * tSec);
    return 1 - env * (Math.cos(OMEGA_D * tSec) + (ZETA * OMEGA / OMEGA_D) * Math.sin(OMEGA_D * tSec));
  }

  var DURATION_S = 0.85;
  var isOpen = false;
  var raf = null;

  function apply(v) {
    var pct = (1 - v) * 100;
    panel.style.transform = 'translateX(' + pct.toFixed(2) + '%)';
    backdrop.style.opacity = Math.min(1, Math.max(0, v)).toFixed(3);
  }

  function run(closing) {
    if (raf) { cancelAnimationFrame(raf); }
    var start = performance.now();
    function frame(now) {
      var t = (now - start) / 1000;
      var raw = springProgress(Math.min(t, DURATION_S));
      var v = closing ? (1 - raw) : raw;
      apply(v);
      if (t < DURATION_S) {
        raf = requestAnimationFrame(frame);
      } else {
        apply(closing ? 0 : 1);
        raf = null;
        isOpen = !closing;
      }
    }
    raf = requestAnimationFrame(frame);
  }

  function stopAutoplay() {
    if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
  }

  toggle.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    run(isOpen);
  });
  closeBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    run(true);
  });
  backdrop.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    run(true);
  });

  var autoplayTimer = null;
  function autoplayTick() {
    run(isOpen);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    apply(1);
  } else {
    run(false);
    autoplayTimer = setInterval(autoplayTick, 1050);
  }
})();
</script>
</body>
</html>
