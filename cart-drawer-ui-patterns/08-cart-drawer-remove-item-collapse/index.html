<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삭제 접힘 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cric is-demo" id="cric">
  <ul class="cric__list" id="cricList">
    <li class="cric__row" data-name="스니커즈"><span>스니커즈</span><b>$52</b>
      <button class="cric__x" type="button" aria-label="삭제">×</button>
    </li>
    <li class="cric__row" data-name="양말"><span>양말</span><b>$9</b>
      <button class="cric__x" type="button" aria-label="삭제">×</button>
    </li>
    <li class="cric__row" data-name="깔창"><span>깔창</span><b>$7</b>
      <button class="cric__x" type="button" aria-label="삭제">×</button>
    </li>
  </ul>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('cric');
  var list = document.getElementById('cricList');

  // 계산 겹: 삭제된 행의 실제 높이(px)를 시작값으로 두고 매 프레임 지수 감쇠로 0에 다가가게
  // 계산한다(collapseTo0()) — max-height 전환 곡선이 아니라 실측 높이에서 시작하는 보간이다.
  var DUR_MS = 320;
  function easeInCubic(p) { return p * p * p; }

  function collapseRow(row) {
    var h = row.getBoundingClientRect().height;
    row.style.overflow = 'hidden';
    row.style.height = h + 'px';
    row.style.willChange = 'height, opacity, transform';
    var start = performance.now();
    function frame(now) {
      var p = Math.min(1, (now - start) / DUR_MS);
      var eased = easeInCubic(p);
      row.style.height = (h * (1 - eased)) + 'px';
      row.style.opacity = String(1 - eased);
      row.style.transform = 'translateX(' + (-eased * 24) + 'px)';
      if (p < 1) {
        requestAnimationFrame(frame);
      } else {
        row.remove();
        refillIfEmpty();
      }
    }
    requestAnimationFrame(frame);
  }

  var STOCK = [
    ['에코백', '$11'], ['머그컵', '$13'], ['카드지갑', '$22'],
    ['우산', '$17'], ['볼캡', '$19']
  ];
  var stockIndex = 0;

  function addRow() {
    var item = STOCK[stockIndex % STOCK.length];
    stockIndex += 1;
    var li = document.createElement('li');
    li.className = 'cric__row';
    li.innerHTML = '<span>' + item[0] + '</span><b>' + item[1] + '</b><button class="cric__x" type="button" aria-label="삭제">×</button>';
    list.appendChild(li);
    bindRow(li);
  }

  function refillIfEmpty() {
    if (list.children.length < 2) {
      addRow();
    }
  }

  function bindRow(row) {
    var btn = row.querySelector('.cric__x');
    btn.addEventListener('click', function () {
      root.classList.remove('is-demo');
      stopAutoplay();
      collapseRow(row);
    });
  }

  Array.prototype.forEach.call(list.querySelectorAll('.cric__row'), bindRow);

  var autoplayTimer = null;
  function stopAutoplay() {
    if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
  }
  function autoTick() {
    var rows = list.querySelectorAll('.cric__row');
    if (rows.length) {
      collapseRow(rows[0]);
    }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplayTimer = setInterval(autoTick, 1100);
  }
})();
</script>
</body>
</html>
