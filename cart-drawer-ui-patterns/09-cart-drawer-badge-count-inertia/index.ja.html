<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バッジ数字の慣性 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cbci is-demo" id="cbci">
  <button class="cbci__fab" id="cbciAdd" type="button" aria-label="追加">
    <svg viewBox="0 0 256 256" width="26" height="26" aria-hidden="true"><g fill="currentColor"><path d="M222.14 58.87A8 8 0 0 0 216 56H62.68L56.16 22.35A8 8 0 0 0 48 16H16a8 8 0 0 0 0 16h25.6l32 165.4A24 24 0 1 0 105.14 224a23.94 23.94 0 0 0 15.5-8h34.72a23.94 23.94 0 1 0 22.32-32h-51a8 8 0 0 1-7.86-6.43L114.68 160H188a24 24 0 0 0 23.53-19.24l16.29-75.63A8 8 0 0 0 222.14 58.87Z"/></g></svg>
    <span class="cbci__badge" id="cbciBadge">0</span>
  </button>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('cbci');
  var addBtn = document.getElementById('cbciAdd');
  var badge = document.getElementById('cbciBadge');

  // 계산 겹: 표시 숫자(displayed)가 목표 숫자(target)를 매 프레임 향해 관성 lerp() 로
  // 따라잡는다 — 값이 바뀔 때마다 다시 세지 않고, 두 값의 차이를 매 프레임 조금씩 줄인다.
  function lerp(a, b, t) { return a + (b - a) * t; }

  var target = 0;
  var displayed = 0;
  var raf = null;

  function tick() {
    displayed = lerp(displayed, target, 0.16);
    var shown = Math.round(displayed);
    badge.textContent = String(shown);
    var pulse = 1 + Math.min(0.3, Math.abs(target - displayed) / (target + 1) * 0.6);
    badge.style.transform = 'scale(' + pulse.toFixed(3) + ')';
    if (Math.abs(target - displayed) > 0.03) {
      raf = requestAnimationFrame(tick);
    } else {
      displayed = target;
      badge.textContent = String(target);
      badge.style.transform = 'scale(1)';
      raf = null;
    }
  }
  function kick() {
    if (!raf) { raf = requestAnimationFrame(tick); }
  }

  function addOne() {
    target += 1;
    if (target > 9) { target = 0; displayed = 0; badge.textContent = '0'; }
    kick();
  }

  addBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    addOne();
  });

  var autoplayTimer = null;
  function stopAutoplay() {
    if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplayTimer = setInterval(addOne, 380);
  }
})();
</script>
</body>
</html>
