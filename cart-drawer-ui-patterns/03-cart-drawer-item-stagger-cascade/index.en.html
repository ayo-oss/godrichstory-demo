<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item Stagger Cascade — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cdis is-demo" id="cdis">
  <header class="cdis__head"><span>Cart</span>
    <button class="cdis__shuffle" id="cdisShuffle" type="button">Restock</button>
  </header>
  <ul class="cdis__list" id="cdisList"></ul>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('cdis');
  var list = document.getElementById('cdisList');
  var shuffleBtn = document.getElementById('cdisShuffle');
  var NAMES = ['Puffer Vest', 'Knit Gloves', 'Check Scarf', 'Winter Boots'];

  // 계산 겹: 총 등장 시간(TOTAL_SPREAD_MS)을 현재 항목 수로 나눠 항목마다 지연 값을 다시 구한다
  // (computeDelay()) — 순서가 바뀌면 같은 규칙으로 각 자리의 지연 값이 새로 계산된다.
  var BASE_MS = 40;
  var TOTAL_SPREAD_MS = 480;

  function computeDelay(indexInOrder, total) {
    var steps = Math.max(1, total - 1);
    var perStep = TOTAL_SPREAD_MS / steps;
    return BASE_MS + indexInOrder * perStep;
  }

  var order = NAMES.map(function (_, i) { return i; });

  function render() {
    list.textContent = '';
    order.forEach(function (nameIndex, pos) {
      var li = document.createElement('li');
      li.className = 'cdis__row';
      li.style.setProperty('--delay', computeDelay(pos, order.length) + 'ms');
      li.textContent = NAMES[nameIndex];
      list.appendChild(li);
    });
  }

  function shuffle() {
    for (var i = order.length - 1; i > 0; i -= 1) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    render();
  }

  shuffleBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    shuffle();
  });

  var autoplayTimer = null;
  function stopAutoplay() {
    if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
  }

  render();
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplayTimer = setInterval(shuffle, 1800);
  }
})();
</script>
</body>
</html>
