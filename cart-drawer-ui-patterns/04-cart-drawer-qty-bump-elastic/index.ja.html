<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数量の弾性バンプ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cqbe is-demo" id="cqbe">
  <div class="cqbe__row">
    <span class="cqbe__name">キャンバストート</span>
    <div class="cqbe__stepper">
      <button class="cqbe__btn" id="cqbeMinus" type="button" aria-label="数量を減らす">-</button>
      <span class="cqbe__badge">
        <span class="cqbe__ripple" id="cqbeRipple"></span>
        <span class="cqbe__qty" id="cqbeQty">1</span>
      </span>
      <button class="cqbe__btn" id="cqbePlus" type="button" aria-label="数量を増やす">+</button>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('cqbe');
  var qtyEl = document.getElementById('cqbeQty');
  var minusBtn = document.getElementById('cqbeMinus');
  var plusBtn = document.getElementById('cqbePlus');

  // 계산 겹: 값이 바뀐 순간부터 지난 시간(t)에 감쇠 사인파(elasticPulse())를 매 프레임 계산해
  // scale 에 대입한다 — CSS keyframes 의 고정 퍼센트 곡선이 아니라 값 변경 시각을 기준으로 다시 푼다.
  var AMPLITUDE = 0.3;
  var FREQ = 18;
  var DECAY = 9;
  function elasticPulse(tSec) {
    if (tSec <= 0) { return 1; }
    return 1 + AMPLITUDE * Math.sin(tSec * FREQ) * Math.exp(-DECAY * tSec);
  }

  // 계산 겹 2: 범프와 별도로, 배지 둘레의 번짐(ripple)은 ease-out 곡선으로 반지름을 키우고
  // 동시에 옅어지게 계산한다 — 하나의 진행값(p)에서 scale·opacity 둘을 같이 뽑는다(depth-scale 항목과 같은 패턴, 다른 대상).
  function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }
  var rippleEl = document.getElementById('cqbeRipple');
  function applyRipple(tSec) {
    var p = Math.min(1, Math.max(0, tSec / 0.5));
    var eased = easeOutCubic(p);
    var s = 0.4 + eased * 2.1;
    var op = (1 - eased) * 0.4;
    rippleEl.style.transform = 'translate(-50%, -50%) scale(' + s.toFixed(3) + ')';
    rippleEl.style.opacity = op.toFixed(3);
  }

  var qty = 1;
  var pulseStart = null;
  var raf = null;

  var rowEl = root.querySelector('.cqbe__row');

  function frame(now) {
    var t = (now - pulseStart) / 1000;
    var scale = elasticPulse(t);
    rowEl.style.transform = 'scale(' + scale.toFixed(4) + ')';
    qtyEl.style.transform = 'scale(' + scale.toFixed(4) + ')';
    applyRipple(t);
    if (t < 0.5) {
      raf = requestAnimationFrame(frame);
    } else {
      rowEl.style.transform = 'scale(1)';
      qtyEl.style.transform = 'scale(1)';
      rippleEl.style.opacity = '0';
      raf = null;
    }
  }

  function bump() {
    if (raf) { cancelAnimationFrame(raf); }
    pulseStart = performance.now();
    raf = requestAnimationFrame(frame);
  }

  function setQty(n) {
    qty = Math.max(1, Math.min(9, n));
    qtyEl.textContent = String(qty);
    bump();
  }

  minusBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    setQty(qty - 1);
  });
  plusBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    setQty(qty + 1);
  });

  var autoplayTimer = null;
  var dir = 1;
  function stopAutoplay() {
    if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
  }
  function autoplayTick() {
    if (qty >= 5) { dir = -1; }
    if (qty <= 1) { dir = 1; }
    setQty(qty + dir);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    autoplayTimer = setInterval(autoplayTick, 700);
  }
})();
</script>
</body>
</html>
