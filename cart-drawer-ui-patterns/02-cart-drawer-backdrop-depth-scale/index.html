<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배경 축소 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cdbd is-demo" id="cdbd">
  <div class="cdbd__page" id="cdbdPage">
    <div class="cdbd__bar"></div>
    <div class="cdbd__card"></div>
    <div class="cdbd__card"></div>
    <button class="cdbd__toggle" id="cdbdToggle" type="button">장바구니</button>
  </div>
  <aside class="cdbd__panel" id="cdbdPanel">
    <header class="cdbd__head"><span>장바구니</span><b>3</b></header>
    <ul class="cdbd__list">
      <li>운동화</li>
      <li>양말 세트</li>
      <li>물병</li>
    </ul>
  </aside>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('cdbd');
  var page = document.getElementById('cdbdPage');
  var panel = document.getElementById('cdbdPanel');
  var toggle = document.getElementById('cdbdToggle');

  // 계산 겹: 패널의 열림 진행 값(progress, 0~1)을 이징 함수로 보간해 뒤 화면의 크기 값과
  // 어둡기 값을 같은 비율로 계산한다 — scale·filter 를 각자 애니메이션하지 않고 한 값에서 둘을 도출한다.
  function easeInOutCubic(p) {
    return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  }

  var DURATION_S = 0.5;
  var MIN_SCALE = 0.86;
  var MAX_DIM = 0.5;
  var isOpen = false;
  var raf = null;

  function apply(progress) {
    var eased = easeInOutCubic(Math.min(1, Math.max(0, progress)));
    var scale = 1 - eased * (1 - MIN_SCALE);
    var dim = eased * MAX_DIM;
    page.style.transform = 'scale(' + scale.toFixed(4) + ')';
    page.style.filter = 'brightness(' + (1 - dim).toFixed(3) + ')';
    panel.style.transform = 'translateX(' + ((1 - eased) * 100).toFixed(2) + '%)';
  }

  function run(closing) {
    if (raf) { cancelAnimationFrame(raf); }
    var start = performance.now();
    var from = closing ? 1 : 0;
    var to = closing ? 0 : 1;
    function frame(now) {
      var t = Math.min(1, (now - start) / (DURATION_S * 1000));
      apply(from + (to - from) * t);
      if (t < 1) {
        raf = requestAnimationFrame(frame);
      } else {
        raf = null;
        isOpen = !closing;
      }
    }
    raf = requestAnimationFrame(frame);
  }

  function stopAutoplay() {
    if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
  }

  toggle.addEventListener('click', function () {
    root.classList.remove('is-demo');
    stopAutoplay();
    run(isOpen);
  });

  var autoplayTimer = null;
  function autoplayTick() { run(isOpen); }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    apply(1);
  } else {
    run(false);
    autoplayTimer = setInterval(autoplayTick, 900);
  }
})();
</script>
</body>
</html>
