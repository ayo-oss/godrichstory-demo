<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading depth badges — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="db is-demo" id="db" aria-label="読了の深さバッジ">
    <header class="db__head">
      <p class="db__title">イベントのお知らせ</p>
      <p class="db__live" id="db-live" aria-live="polite">読み始め</p>
    </header>
    <div class="db__view" id="db-view" tabindex="0" role="region" aria-label="お知らせ本文">
      <div class="db__pad">
        <p class="db__lede">ここを最後まで読むとクーポンを差し上げます。</p>
        <p class="db__line"></p>
        <p class="db__line"></p>
        <p class="db__line"></p>
        <p class="db__line"></p>
        <p class="db__line"></p>
        <p class="db__line"></p>
        <p class="db__tail">すべて読み終えました。右上のバッジをご確認ください。</p>
      </div>
    </div>
    <footer class="db__foot">
      <div class="db__row" role="progressbar" aria-label="読んだ深さ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="db-bar-role">
        <span class="db__cell"><b class="db__chip" data-milestone="25">25</b></span>
        <span class="db__cell"><b class="db__chip" data-milestone="50">50</b></span>
        <span class="db__cell"><b class="db__chip" data-milestone="75">75</b></span>
        <span class="db__cell"><b class="db__chip" data-milestone="100">100</b></span>
      </div>
      <span class="db__fill" id="db-fill" aria-hidden="true"></span>
    </footer>
  </section>
</main>
<script>
// 読了の深さバッジ — 25·50·75·100 에 닿으면 배지가 켜지고 한 번 튀어오른다
var db = document.getElementById('db');
var view = document.getElementById('db-view');
var live = document.getElementById('db-live');
var fill = document.getElementById('db-fill');
var role = document.getElementById('db-bar-role');
var chips = document.querySelectorAll('.db__chip');
var lit = 0;
view.addEventListener('scroll', function () {
  db.classList.remove('is-demo');
  var max = view.scrollHeight - view.clientHeight;
  var pct = max > 0 ? Math.round(view.scrollTop / max * 100) : 0;
  fill.style.transform = 'scaleX(' + (pct / 100) + ')';
  role.setAttribute('aria-valuenow', pct);
  var told = [ '4分の1を読みました', '半分を読みました', '4分の3を読みました', 'すべて読みました' ];
  chips.forEach(function (c) {
    var m = Number(c.dataset.milestone);
    var on = pct >= m;
    if (on && !c.classList.contains('is-on') && m > lit * 25) {
      lit = m / 25;
      live.textContent = told[m / 25 - 1];
    }
    c.classList.toggle('is-on', on);
  });
});
</script>
</body>
</html>
