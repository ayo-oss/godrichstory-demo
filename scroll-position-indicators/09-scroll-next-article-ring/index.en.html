<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next article pull ring — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="nx is-demo" id="nx" aria-label="Ring that pulls in the next article">
    <header class="nx__head">
      <p class="nx__title">The article you just read · Indicators by demo</p>
      <p class="nx__state" id="nx-state">The end!</p>
    </header>
    <div class="nx__view" id="nx-view" tabindex="0" role="region" aria-label="Article end and the pull area">
      <div class="nx__pad">
        <p class="nx__p">The article ends here. You can still keep scrolling.</p>
        <div class="nx__pull" role="progressbar" aria-label="Pull for the next article" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="nx-role">
          <span class="nx__ring" aria-hidden="true">
            <svg viewBox="0 0 96 96">
              <circle class="nx__track" cx="48" cy="48" r="42"></circle>
              <circle class="nx__fill" cx="48" cy="48" r="42" id="nx-fill"></circle>
            </svg>
          </span>
          <span class="nx__labels">
            <b class="nx__l nx__l--0">Pull down</b>
            <b class="nx__l nx__l--1"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M216,128l-72,72V56Z" opacity="0.2"/><path d="M221.66,122.34l-72-72A8,8,0,0,0,136,56v64H40a8,8,0,0,0,0,16h96v64a8,8,0,0,0,13.66,5.66l72-72A8,8,0,0,0,221.66,122.34ZM152,180.69V75.31L204.69,128Z"/></svg> Next article</b>
          </span>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
// 끝에서 다음 글을 당겨 오는 진행 링 — 끝머리 여백을 스크롤한 비율로 stroke-dashoffset 을 줄인다
var nx = document.getElementById('nx');
var view = document.getElementById('nx-view');
var fill = document.getElementById('nx-fill');
var role = document.getElementById('nx-role');
var state = document.getElementById('nx-state');
var circumference = 2 * Math.PI * 42;
fill.style.strokeDasharray = circumference;
view.addEventListener('scroll', function () {
  nx.classList.remove('is-demo');
  var max = view.scrollHeight - view.clientHeight;
  var r = max > 0 ? view.scrollTop / max : 0;
  // 글 본문(패드 위쪽)을 지나고 나서부터 링이 차오른다
  var p = Math.max(0, Math.min(1, (r - 0.55) / 0.45));
  fill.style.strokeDashoffset = circumference * (1 - p);
  role.setAttribute('aria-valuenow', Math.round(p * 100));
  var isNext = p >= 0.95;
  nx.classList.toggle('nx--next', isNext);
  state.textContent = isNext ? 'Let go for the next!' : 'The end!';
});
</script>
</body>
</html>
