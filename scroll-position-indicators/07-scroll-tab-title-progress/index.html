<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab title progress — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="tt is-demo" id="tt" aria-label="탭 이름에 적히는 진행률">
    <div class="tt__bar" role="progressbar" aria-label="읽기 진행" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="tt-role">
      <span class="tt__tab">
        <span class="tt__ring" id="tt-ring" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor"><path d="M224,56V200a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V56a8,8,0,0,1,8-8H216A8,8,0,0,1,224,56Z" opacity="0.2"/><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,160H40V56H216V200ZM184,96a8,8,0,0,1-8,8H80a8,8,0,0,1,0-16h96A8,8,0,0,1,184,96Zm0,32a8,8,0,0,1-8,8H80a8,8,0,0,1,0-16h96A8,8,0,0,1,184,128Zm0,32a8,8,0,0,1-8,8H80a8,8,0,0,1,0-16h96A8,8,0,0,1,184,160Z"/></svg></span>
        <span class="tt__titles">
          <b class="tt__t tt__t--0">주말에 읽는 긴 글</b>
          <b class="tt__t tt__t--1">34% · 주말에 읽는 긴 글</b>
          <b class="tt__t tt__t--2">78% · 주말에 읽는 긴 글</b>
          <b class="tt__t tt__t--3">100% · 주말에 읽는 긴 글</b>
        </span>
        <span class="tt__x" aria-hidden="true"></span>
      </span>
    </div>
    <div class="tt__view" id="tt-view" tabindex="0" role="region" aria-label="긴 글 본문">
      <div class="tt__pad">
        <p class="tt__lede">탭을 여러 개 열어 두고 읽는 글이에요.</p>
        <p class="tt__line"></p>
        <p class="tt__line"></p>
        <p class="tt__line"></p>
        <p class="tt__line"></p>
        <p class="tt__line"></p>
        <p class="tt__line"></p>
        <p class="tt__tail">브라우저 탭 이름이 지금 몇 % 인지 따라 바뀌어요.</p>
      </div>
    </div>
  </section>
</main>
<script>
// 탭 이름에 적히는 진행률 — document.title 앞에 숫자를 붙이고 고리는 --p 로 채운다
var tt = document.getElementById('tt');
var view = document.getElementById('tt-view');
var ring = document.getElementById('tt-ring');
var role = document.getElementById('tt-role');
var tabLabel = document.querySelector('.tt__t--0');
var baseTitle = document.title;
var tabName = tabLabel.textContent;
view.addEventListener('scroll', function () {
  tt.classList.remove('is-demo');
  var max = view.scrollHeight - view.clientHeight;
  var r = max > 0 ? view.scrollTop / max : 0;
  var now = Math.round(r * 100);
  // @property 로 등록한 --p 는 inherits:false — 링 요소 자신에 얹는다 (262 실측)
  ring.style.setProperty('--p', r.toFixed(3));
  role.setAttribute('aria-valuenow', now);
  document.title = now > 0 ? now + '% · ' + baseTitle : baseTitle;
  // 데모 안의 가짜 탭도 같은 규칙으로 — 루프를 뗀 정적 경로에서 빈 칸이 되지 않게
  tabLabel.textContent = now > 0 ? now + '% · ' + tabName : tabName;
});
</script>
</body>
</html>
