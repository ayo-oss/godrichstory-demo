<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section counter with keyboard — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="sc is-demo" id="sc" aria-label="区間カウンター">
    <header class="sc__head">
      <p class="sc__title">製品紹介資料</p>
      <p class="sc__count">
        <b class="sc__now" id="sc-now">1</b>
        <span class="sc__num sc__num--1" aria-hidden="true">1</span>
        <span class="sc__num sc__num--3" aria-hidden="true">3</span>
        <span class="sc__num sc__num--6" aria-hidden="true">6</span>
        <span class="sc__num sc__num--9" aria-hidden="true">9</span>
        <span class="sc__slash"> / 9</span>
      </p>
    </header>
    <div class="sc__view" id="sc-view" tabindex="0" role="region" aria-label="場面の一覧 — 上下の矢印キーで移動">
      <div class="sc__track" id="sc-track">
        <article class="sc__sec" data-i="0"><b>01</b><span>最初に見る画面</span></article>
        <article class="sc__sec" data-i="1"><b>02</b><span>何を作りましょうか</span></article>
        <article class="sc__sec" data-i="2"><b>03</b><span>材料を選びましょう</span></article>
        <article class="sc__sec" data-i="3"><b>04</b><span>組み立てが始まります</span></article>
        <article class="sc__sec" data-i="4"><b>05</b><span>色を塗ります</span></article>
        <article class="sc__sec" data-i="5"><b>06</b><span>動きを付けます</span></article>
        <article class="sc__sec" data-i="6"><b>07</b><span>検査を通ります</span></article>
        <article class="sc__sec" data-i="7"><b>08</b><span>梱包する場面</span></article>
        <article class="sc__sec" data-i="8"><b>09</b><span>次の話へ</span></article>
      </div>
    </div>
    <footer class="sc__keys">
      <button class="sc__key" type="button" id="sc-up" aria-label="前の場面"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M208,160H48l80-80Z" opacity="0.2"/><path d="M213.66,154.34l-80-80a8,8,0,0,0-11.32,0l-80,80A8,8,0,0,0,48,168H208a8,8,0,0,0,5.66-13.66ZM67.31,152,128,91.31,188.69,152Z"/></svg></button>
      <span class="sc__hint">矢印キーでも移動できます</span>
      <button class="sc__key" type="button" id="sc-down" aria-label="次の場面"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M208,96l-80,80L48,96Z" opacity="0.2"/><path d="M215.39,92.94A8,8,0,0,0,208,88H48a8,8,0,0,0-5.66,13.66l80,80a8,8,0,0,0,11.32,0l80-80A8,8,0,0,0,215.39,92.94ZM128,164.69,67.31,104H188.69Z"/></svg></button>
    </footer>
  </section>
</main>
<script>
// 区間カウンター — 스크롤로 지나간 장면을 세고, keydown 화살표로도 앞뒤 장면을 부른다
var sc = document.getElementById('sc');
var view = document.getElementById('sc-view');
var now = document.getElementById('sc-now');
var secs = Array.prototype.slice.call(document.querySelectorAll('.sc__sec'));
function currentIndex() {
  var mid = view.scrollTop + view.clientHeight / 2;
  var best = 0, dist = 1e9;
  secs.forEach(function (s, i) {
    var d = Math.abs(s.offsetTop + s.offsetHeight / 2 - mid);
    if (d < dist) { dist = d; best = i; }
  });
  return best;
}
function paint() {
  var i = currentIndex();
  now.textContent = i + 1;
  secs.forEach(function (s, j) {
    if (j === i) s.setAttribute('aria-current', 'true');
    else s.removeAttribute('aria-current');
  });
}
function goTo(i) {
  sc.classList.remove('is-demo');
  i = Math.max(0, Math.min(secs.length - 1, i));
  view.scrollTo({ top: secs[i].offsetTop, behavior: 'smooth' });
}
view.addEventListener('scroll', function () { sc.classList.remove('is-demo'); paint(); }, { passive: true });
view.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); goTo(currentIndex() + 1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goTo(currentIndex() - 1); }
});
document.getElementById('sc-up').addEventListener('click', function () { goTo(currentIndex() - 1); });
document.getElementById('sc-down').addEventListener('click', function () { goTo(currentIndex() + 1); });
</script>
</body>
</html>
