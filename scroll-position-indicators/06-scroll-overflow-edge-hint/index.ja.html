<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overflow edge hint — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ot is-demo" id="ot" aria-label="横にまだ続くと知らせる端の合図">
    <header class="ot__head">
      <p class="ot__title">料金比較表</p>
      <p class="ot__state" id="ot-state">横にまだ続きます</p>
    </header>
    <div class="ot__view" id="ot-view" tabindex="0" role="region" aria-label="料金表 — 左右に見ていく">
      <div class="ot__track" id="ot-track">
        <div class="ot__card"><b>無料</b><span>0円</span><i>1人向け</i></div>
        <div class="ot__card"><b>ベーシック</b><span>9,000円</span><i>5人向け</i></div>
        <div class="ot__card"><b>チーム</b><span>19,000円</span><i>10人向け</i></div>
        <div class="ot__card"><b>団体</b><span>39,000円</span><i>制限なし</i></div>
      </div>
    </div>
    <div class="ot__shade ot__shade--l" id="ot-l" aria-hidden="true"></div>
    <div class="ot__shade ot__shade--r" id="ot-r" aria-hidden="true">
      <span class="ot__nudge"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M176,128,96,208V48Z" opacity="0.2"/><path d="M181.66,122.34l-80-80A8,8,0,0,0,88,48V208a8,8,0,0,0,13.66,5.66l80-80A8,8,0,0,0,181.66,122.34ZM104,188.69V67.31L164.69,128Z"/></svg></span>
    </div>
    <p class="ot__note" aria-hidden="true">両端がぼやけているところが、まだ見ていない部分です</p>
  </section>
</main>
<script>
// 옆으로 더 있다고 알려 주는 가장자리 그늘 — scrollLeft/scrollWidth 로 양 끝을 각각 지운다
var ot = document.getElementById('ot');
var view = document.getElementById('ot-view');
var l = document.getElementById('ot-l');
var r = document.getElementById('ot-r');
var state = document.getElementById('ot-state');
view.addEventListener('scroll', function () {
  ot.classList.remove('is-demo');
  var max = view.scrollWidth - view.clientWidth;
  var atLeft = view.scrollLeft <= 4;
  var atRight = view.scrollLeft >= max - 4;
  l.classList.toggle('is-off', atLeft);
  r.classList.toggle('is-off', atRight);
  state.textContent = atRight ? '端まで来ました' : '横にまだ続きます';
});
</script>
</body>
</html>
