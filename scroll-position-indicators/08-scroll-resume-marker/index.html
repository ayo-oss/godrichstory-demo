<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume marker — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="rs is-demo" id="rs" aria-label="읽던 자리 이어읽기">
    <header class="rs__head">
      <p class="rs__title">도움말 · 자주 묻는 질문</p>
      <p class="rs__state" id="rs-state">처음부터 읽는 중</p>
    </header>
    <div class="rs__view" id="rs-view" tabindex="0" role="region" aria-label="도움말 본문">
      <div class="rs__pad" id="rs-pad">
        <p class="rs__p">이 문서는 중간에 두고 나갔다 돌아오는 사람을 위한 문서예요.</p>
        <p class="rs__p">읽던 깊이가 점선으로 남고, 그 줄이 화면 위로 밀려나면 알약이 올라와요.</p>
        <p class="rs__p">세 번째 문단쯤에서 잠깐 나갔다 왔다고 상상해 보세요.</p>
        <p class="rs__p">네 번째 문단은 환불 규칙에 대한 이야기입니다.</p>
        <p class="rs__p">다섯 번째 문단은 문의처와 운영 시간을 안내합니다.</p>
        <p class="rs__p">여기까지 내려오면 거의 다 읽은 거예요.</p>
        <span class="rs__mark" id="rs-mark" aria-hidden="true"></span>
      </div>
    </div>
    <button class="rs__pill" type="button" id="rs-pill">
      <svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M192,176v48l-64-40L64,224V176l64-40Z" opacity="0.2"/><path d="M184,32H72A16,16,0,0,0,56,48V224a8,8,0,0,0,12.24,6.78L128,193.43l59.77,37.35A8,8,0,0,0,200,224V48A16,16,0,0,0,184,32Zm0,16V161.57l-51.77-32.35a8,8,0,0,0-8.48,0L72,161.56V48ZM132.23,177.22a8,8,0,0,0-8.48,0L72,209.57V180.43l56-35,56,35v29.14Z"/></svg>
      <span class="rs__say" id="rs-say">읽던 자리로 돌아갈까요?</span>
    </button>
    <p class="rs__live" id="rs-live" aria-live="polite">읽기 시작</p>
  </section>
</main>
<script>
// 읽던 자리를 남겨 두는 이어읽기 표시 — 가장 깊이 내려갔던 scrollTop 자리에 점선이 남는다
var rs = document.getElementById('rs');
var view = document.getElementById('rs-view');
var mark = document.getElementById('rs-mark');
var pill = document.getElementById('rs-pill');
var say = document.getElementById('rs-say');
var live = document.getElementById('rs-live');
var state = document.getElementById('rs-state');
var deepest = 0;
function paint() {
  var max = view.scrollHeight - view.clientHeight;
  var pct = max > 0 ? Math.round(view.scrollTop / max * 100) : 0;
  // 점선은 가장 깊이 갔던 자리에 — 위로 올려 쓰지 않는다
  mark.style.top = (Math.max(deepest, view.scrollTop)) + 'px';
  deepest = Math.max(deepest, view.scrollTop);
  // 점선이 창 아래로 벗어났을 때만 — 「한 번이라도 깊이 갔다」 가 아니라 「지금 안 보인다」 가 조건이다
  var pushedOut = view.scrollTop + view.clientHeight < deepest + 8 && view.scrollTop < deepest - 8;
  var showPill = pushedOut && deepest > 24;
  pill.classList.toggle('is-up', showPill);
  rs.classList.toggle('rs--deep', showPill);
  // 머리말도 정적 경로에서 같이 움직인다 — 루프를 뗀 뒤 「처음부터」 로 굳지 않게
  state.textContent = showPill ? '읽던 자리가 남아 있어요' : '처음부터 읽는 중';
  if (showPill) {
    var phrase = '읽던 자리로 돌아갈까요?';
    if (say.textContent !== phrase) { say.textContent = phrase; live.textContent = '읽던 자리가 ' + pct + '% 지점에 남아 있어요'; }
  } else {
    live.textContent = pct > 8 ? '읽는 중 · ' + pct + '%' : '읽기 시작';
  }
}
view.addEventListener('scroll', function () { rs.classList.remove('is-demo'); paint(); }, { passive: true });
pill.addEventListener('click', function () {
  rs.classList.remove('is-demo');
  view.scrollTo({ top: deepest, behavior: 'smooth' });
});
</script>
</body>
</html>
