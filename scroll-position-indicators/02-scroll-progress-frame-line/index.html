<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame drawing reading progress — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pv" id="pv">
    <div class="pv__scroller" id="pv-scroller" tabindex="0" role="region" aria-label="긴 글 본문">
      <div class="pv__tall">
        <article class="pv__frame" id="pv-frame" role="progressbar" aria-label="읽기 진행" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span class="pv__bar pv__bar--top"></span>
          <span class="pv__bar pv__bar--right"></span>
          <span class="pv__bar pv__bar--bottom"></span>
          <span class="pv__bar pv__bar--left"></span>
          <h2 class="pv__title">주말에 읽는 긴 글</h2>
          <p class="pv__row pv__row--w1"></p>
          <p class="pv__row pv__row--w2"></p>
          <p class="pv__row pv__row--w3"></p>
          <p class="pv__pct" id="pv-pct" aria-hidden="true"></p>
        </article>
      </div>
    </div>
    <p class="pv__note" aria-hidden="true">테두리가 시계 방향으로 그어져요</p>
  </div>
</main>
<script>
// 테두리를 도는 읽기 진행선 — 스크롤포트에 scroll-timeline-name 을 붙여 네 변이 사분면을 나눠 가진다
// 보이는 숫자와 네 변은 CSS 가 타임라인에서 직접 그린다 — JS 는 스크린 리더가 읽을 값만 맞춘다
var scroller = document.getElementById('pv-scroller');
var frame = document.getElementById('pv-frame');
scroller.addEventListener('scroll', function () {
  var max = scroller.scrollHeight - scroller.clientHeight;
  var r = max > 0 ? scroller.scrollTop / max : 0;
  frame.setAttribute('aria-valuenow', Math.round(r * 100));
}, { passive: true });
</script>
</body>
</html>
