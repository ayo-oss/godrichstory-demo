<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading focus paragraph — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="rf is-demo" id="rf" aria-label="읽는 문단 초점">
    <header class="rf__head">
      <p class="rf__title">서비스 이용약관</p>
      <p class="rf__state" id="rf-state">지금: 문단 1</p>
    </header>
    <div class="rf__body">
      <div class="rf__rail" aria-hidden="true"><span class="rf__dot" id="rf-dot"></span></div>
      <div class="rf__view" id="rf-view" tabindex="0" role="region" aria-label="약관 본문">
        <div class="rf__pad">
          <p class="rf__p">첫 문단은 서비스가 무엇인지 설명합니다. 지나치면 흐려지고 가운데 오면 또렷해져요.</p>
          <p class="rf__p">두 번째 문단은 계정과 회원가입에 관한 이야기를 담습니다.</p>
          <p class="rf__p">세 번째 문단은 이용 중 지켜야 할 규칙을 적는 자리입니다.</p>
          <p class="rf__p">네 번째 문단은 환불과 철회에 관한 안내를 담습니다.</p>
          <p class="rf__p">마지막 문단은 문의처와 언제든 되돌아올 수 있다는 말로 끝나요.</p>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
// 지금 읽는 문단만 또렷해지는 초점 — IntersectionObserver 가 가운데 띠를 지나는 문단 하나만 고른다
var rf = document.getElementById('rf');
var view = document.getElementById('rf-view');
var dot = document.getElementById('rf-dot');
var state = document.getElementById('rf-state');
var ps = Array.prototype.slice.call(document.querySelectorAll('.rf__p'));
var io = new IntersectionObserver(function (entries) {
  entries.forEach(function (e) {
    if (!e.isIntersecting) return;
    var i = ps.indexOf(e.target);
    ps.forEach(function (p, j) {
      p.classList.toggle('is-cur', i === j);
      if (i === j) p.setAttribute('aria-current', 'true'); else p.removeAttribute('aria-current');
    });
    dot.style.transform = 'translateY(' + (i * 20) + 'px)';
    state.textContent = '지금: 문단 ' + (i + 1);
  });
}, { root: view, rootMargin: '-45% 0px -45% 0px', threshold: 0 });
ps.forEach(function (p) { io.observe(p); });
// 격자 루프는 사람이 손댄 순간에만 끝난다 — IO 는 페이지 열자마자도 뛰므로 여기서 끄지 않는다
['wheel', 'pointerdown', 'touchstart', 'keydown'].forEach(function (ev) {
  view.addEventListener(ev, function () { rf.classList.remove('is-demo'); }, { passive: true, once: true });
});
</script>
</body>
</html>
