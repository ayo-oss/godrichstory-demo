<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading focus paragraph — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="rf is-demo" id="rf" aria-label="読んでいる段落の焦点">
    <header class="rf__head">
      <p class="rf__title">サービス利用規約</p>
      <p class="rf__state" id="rf-state">現在: 段落 1</p>
    </header>
    <div class="rf__body">
      <div class="rf__rail" aria-hidden="true"><span class="rf__dot" id="rf-dot"></span></div>
      <div class="rf__view" id="rf-view" tabindex="0" role="region" aria-label="規約本文">
        <div class="rf__pad">
          <p class="rf__p">最初の段落はサービスが何かを説明します。通り過ぎると薄れ、中央に来るとはっきりします。</p>
          <p class="rf__p">2番目の段落はアカウントと会員登録についての話を収めます。</p>
          <p class="rf__p">3番目の段落は利用中に守るべき規則を記す場所です。</p>
          <p class="rf__p">4番目の段落は返金と撤回に関する案内を収めます。</p>
          <p class="rf__p">最後の段落は問い合わせ先と、いつでも戻ってこられるという言葉で終わります。</p>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
// 지금 읽는 문단만 또렷해지는 초점 — IntersectionObserver 가 가운데 띠를 지나는 문단 하나만 고른다
var rf = document.getElementById('rf');
var view = document.getElementById('rf-view');
var dot = document.getElementById('rf-dot');
var state = document.getElementById('rf-state');
var ps = Array.prototype.slice.call(document.querySelectorAll('.rf__p'));
var io = new IntersectionObserver(function (entries) {
  entries.forEach(function (e) {
    if (!e.isIntersecting) return;
    var i = ps.indexOf(e.target);
    ps.forEach(function (p, j) {
      p.classList.toggle('is-cur', i === j);
      if (i === j) p.setAttribute('aria-current', 'true'); else p.removeAttribute('aria-current');
    });
    dot.style.transform = 'translateY(' + (i * 20) + 'px)';
    state.textContent = '現在: 段落 ' + (i + 1);
  });
}, { root: view, rootMargin: '-45% 0px -45% 0px', threshold: 0 });
ps.forEach(function (p) { io.observe(p); });
// 격자 루프는 사람이 손댄 순간에만 끝난다 — IO 는 페이지 열자마자도 뛰므로 여기서 끄지 않는다
['wheel', 'pointerdown', 'touchstart', 'keydown'].forEach(function (ev) {
  view.addEventListener(ev, function () { rf.classList.remove('is-demo'); }, { passive: true, once: true });
});
</script>
</body>
</html>
