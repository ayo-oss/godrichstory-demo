<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll hint on the first screen — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="sh is-demo" id="sh" aria-label="最初の画面のスクロールヒント">
    <header class="sh__head">
      <p class="sh__kicker">春のニュースレター</p>
      <p class="sh__state"><span class="sh__s sh__s--top" id="sh-state">先頭 · ヒント表示中</span><span class="sh__s sh__s--gone" aria-hidden="true">読書中 · ヒントは後退</span></p>
    </header>
    <div class="sh__view" id="sh-view" tabindex="0" role="region" aria-label="ニュースレター本文">
      <div class="sh__pad">
        <p class="sh__lede">画面は埋まって見えますが、下にもっと続きます。</p>
        <p class="sh__line"></p>
        <p class="sh__line"></p>
        <p class="sh__line"></p>
        <p class="sh__line"></p>
        <p class="sh__line"></p>
        <p class="sh__tail">最後まで下りると、ここが最終行です。</p>
      </div>
    </div>
    <div class="sh__hint" id="sh-hint" aria-hidden="true">
      <span class="sh__pill"><svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><path d="M200,144l-72,72L56,144Z" opacity="0.2"/><path d="M207.39,140.94A8,8,0,0,0,200,136H136V40a8,8,0,0,0-16,0v96H56a8,8,0,0,0-5.66,13.66l72,72a8,8,0,0,0,11.32,0l72-72A8,8,0,0,0,207.39,140.94ZM128,204.69,75.31,152H180.69Z"/></svg></span>
      <span class="sh__bob"><svg viewBox="0 0 256 256" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M200,144l-72,72L56,144Z" opacity="0.2"/><path d="M207.39,140.94A8,8,0,0,0,200,136H136V40a8,8,0,0,0-16,0v96H56a8,8,0,0,0-5.66,13.66l72,72a8,8,0,0,0,11.32,0l72-72A8,8,0,0,0,207.39,140.94ZM128,204.69,75.31,152H180.69Z"/></svg></span>
      <span class="sh__note">下にスクロール</span>
    </div>
  </section>
</main>
<script>
// 첫 화면에서만 흔들리는 아래로 힌트 — scrollTop 8px 기준으로 보였다 물러난다
var sh = document.getElementById('sh');
var view = document.getElementById('sh-view');
var state = document.getElementById('sh-state');
view.addEventListener('scroll', function () {
  sh.classList.remove('is-demo');
  var gone = view.scrollTop > 8;
  sh.classList.toggle('is-gone', gone);
  state.textContent = gone ? '読書中 · ヒントは後退' : '先頭 · ヒント表示中';
});
</script>
</body>
</html>
