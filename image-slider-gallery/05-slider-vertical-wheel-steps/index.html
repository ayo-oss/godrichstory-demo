<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>휠을 한 칸씩 받는 세로 슬라이더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vw is-demo" id="vw">
  <div class="vw__row">
    <div class="vw__view" id="view" role="region" aria-roledescription="carousel" aria-orientation="vertical" aria-label="휠로 한 장씩 넘기는 세로 슬라이더" tabindex="0">
      <div class="vw__track" id="track">
        <div class="vw__shot" role="group" aria-roledescription="slide" aria-label="4장 중 1장">
          <span class="vw__photo vw__photo--stair" role="img" aria-label="낡은 벽 사이로 층층이 이어진 좁은 계단"></span>
          <span class="vw__cap">오래된 계단</span>
        </div>
        <div class="vw__shot" role="group" aria-roledescription="slide" aria-label="4장 중 2장">
          <span class="vw__photo vw__photo--curtain" role="img" aria-label="아침 햇살이 비치는 창가에 드리운 얇은 커튼"></span>
          <span class="vw__cap">창가 커튼</span>
        </div>
        <div class="vw__shot" role="group" aria-roledescription="slide" aria-label="4장 중 3장">
          <span class="vw__photo vw__photo--sign" role="img" aria-label="비 내린 밤거리에 줄지어 켜진 간판 불빛"></span>
          <span class="vw__cap">밤거리 간판</span>
        </div>
        <div class="vw__shot" role="group" aria-roledescription="slide" aria-label="4장 중 4장">
          <span class="vw__photo vw__photo--path" role="img" aria-label="키 큰 나무 사이로 난 좁은 숲속 오솔길"></span>
          <span class="vw__cap">숲속 오솔길</span>
        </div>
      </div>
    </div>
    <span class="vw__steps" role="group" aria-label="장 고르기">
      <button class="vw__step" type="button" data-go="0" aria-label="1번째 장" aria-current="true"></button>
      <button class="vw__step" type="button" data-go="1" aria-label="2번째 장" aria-current="false"></button>
      <button class="vw__step" type="button" data-go="2" aria-label="3번째 장" aria-current="false"></button>
      <button class="vw__step" type="button" data-go="3" aria-label="4번째 장" aria-current="false"></button>
    </span>
  </div>
  <div class="vw__bar">
    <button class="vw__nav" type="button" data-step="-1" aria-label="이전 장"><svg viewBox="0 0 256 256" width="1em" height="1em" aria-hidden="true" focusable="false"><g fill="currentColor"><path d="M208,160H48l80-80Z" opacity="0.2"/><path d="M213.66,154.34l-80-80a8,8,0,0,0-11.32,0l-80,80A8,8,0,0,0,48,168H208a8,8,0,0,0,5.66-13.66ZM67.31,152,128,91.31,188.69,152Z"/></g></svg></button>
    <button class="vw__nav" type="button" data-step="1" aria-label="다음 장"><svg viewBox="0 0 256 256" width="1em" height="1em" aria-hidden="true" focusable="false"><g fill="currentColor"><path d="M208,96l-80,80L48,96Z" opacity="0.2"/><path d="M215.39,92.94A8,8,0,0,0,208,88H48a8,8,0,0,0-5.66,13.66l80,80a8,8,0,0,0,11.32,0l80-80A8,8,0,0,0,215.39,92.94ZM128,164.69,67.31,104H188.69Z"/></g></svg></button>
    <span class="vw__hint">휠을 한 번 굴리면 한 장만 넘어갑니다</span>
  </div>
</div>
</main>
<script>
var root = document.getElementById('vw');
var view = document.getElementById('view');
var track = document.getElementById('track');
var shots = Array.prototype.slice.call(root.querySelectorAll('.vw__shot'));
var steps = Array.prototype.slice.call(root.querySelectorAll('.vw__step'));
var LOCK = 420;
var index = 0;
var locked = false;
var timer = 0;
// 트랙 높이는 무대 높이와 같다. 슬라이드가 각각 flex-basis 100% 라서
// translateY(-100%) 한 번이 정확히 한 장이다 — 트랙 전체 높이로 계산하지 않는다
function show(next) {
  index = (next + shots.length) % shots.length;
  track.style.setProperty('--i', index);
  steps.forEach(function (step, i) {
    step.setAttribute('aria-current', i === index ? 'true' : 'false');
  });
}
function stopPreview() {
  root.classList.remove('is-demo');
  if (timer) { clearInterval(timer); timer = 0; }
}
// 잠금 시간 동안 뒤따라 오는 wheel 이벤트를 삼킨다. 관성 스크롤은 한 번 굴려도
// 수십 개가 이어서 날아오므로, 이 문이 없으면 한 번에 끝까지 지나간다
view.addEventListener('wheel', function (e) {
  e.preventDefault();
  if (locked) { return; }
  locked = true;
  setTimeout(function () { locked = false; }, LOCK);
  stopPreview();
  show(index + (e.deltaY > 0 ? 1 : -1));
}, { passive: false });
root.addEventListener('click', function (e) {
  var nav = e.target.closest('[data-step]');
  var step = e.target.closest('[data-go]');
  if (!nav && !step) { return; }
  stopPreview();
  show(nav ? index + Number(nav.getAttribute('data-step')) : Number(step.getAttribute('data-go')));
});
view.addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') { return; }
  e.preventDefault();
  stopPreview();
  show(index + (e.key === 'ArrowDown' ? 1 : -1));
});
if (root.classList.contains('is-demo')) {
  timer = setInterval(function () { show(index + 1); }, 620);
}
</script>
</body>
</html>
