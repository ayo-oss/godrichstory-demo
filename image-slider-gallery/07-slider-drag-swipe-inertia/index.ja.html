<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指を離した速度で送るドラッグスライダー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="dg is-demo" id="dg" role="region" aria-roledescription="carousel" aria-label="ドラッグで送る写真スライダー" tabindex="0">
  <header class="dg__bar">
    <span class="dg__title">ドラッグで送る</span>
    <span class="dg__speed" id="speed">0.00 px/ms</span>
  </header>
  <div class="dg__frame" id="frame">
    <div class="dg__track" id="track">
      <article class="dg__slide" role="group" aria-roledescription="slide" aria-label="4枚中1枚目">
        <span class="dg__ph dg__ph--a" role="img" aria-label="夜明けの埠頭のコンテナ"></span>
        <span class="dg__cap" aria-hidden="true">夜明けの埠頭のコンテナ</span>
      </article>
      <article class="dg__slide" role="group" aria-roledescription="slide" aria-label="4枚中2枚目">
        <span class="dg__ph dg__ph--e" role="img" aria-label="真昼のプールの水面"></span>
        <span class="dg__cap" aria-hidden="true">真昼のプールの水面</span>
      </article>
      <article class="dg__slide" role="group" aria-roledescription="slide" aria-label="4枚中3枚目">
        <span class="dg__ph dg__ph--c" role="img" aria-label="雨上がりの街の路地"></span>
        <span class="dg__cap" aria-hidden="true">雨上がりの街の路地</span>
      </article>
      <article class="dg__slide" role="group" aria-roledescription="slide" aria-label="4枚中4枚目">
        <span class="dg__ph dg__ph--d" role="img" aria-label="雪をかぶった白樺林"></span>
        <span class="dg__cap" aria-hidden="true">雪をかぶった白樺林</span>
      </article>
    </div>
  </div>
  <nav class="dg__dots" aria-label="写真を選ぶ">
    <button class="dg__dot" type="button" aria-current="true" aria-label="1枚目の写真を表示"></button>
    <button class="dg__dot" type="button" aria-current="false" aria-label="2枚目の写真を表示"></button>
    <button class="dg__dot" type="button" aria-current="false" aria-label="3枚目の写真を表示"></button>
    <button class="dg__dot" type="button" aria-current="false" aria-label="4枚目の写真を表示"></button>
  </nav>
</section>
</main>
<script>
var root = document.getElementById('dg');
var frame = document.getElementById('frame');
var track = document.getElementById('track');
var speed = document.getElementById('speed');
var slides = [].slice.call(track.children);
var dots = [].slice.call(document.querySelectorAll('.dg__dot'));
var index = 0, dragging = false, startX = 0, lastX = 0, lastT = 0, velocity = 0, width = 0, timer = 0;
function measure() { width = frame.clientWidth; }
// 한 칸 = 프레임 폭. 끄는 동안은 transition 을 꺼서 손가락이 곧 트랙 위치가 된다
function place(offset, animate) {
  track.style.transition = animate ? '' : 'none';
  track.style.transform = 'translate3d(' + (offset - index * width) + 'px, 0, 0)';
}
function show(next, animate) {
  index = Math.max(0, Math.min(slides.length - 1, next));
  place(0, animate);
  dots.forEach(function (dot, i) { dot.setAttribute('aria-current', i === index ? 'true' : 'false'); });
}
function stopDemo() { root.classList.remove('is-demo'); clearInterval(timer); }
function onDown(e) {
  stopDemo(); measure();
  dragging = true; startX = e.clientX; lastX = e.clientX; lastT = e.timeStamp; velocity = 0;
  track.setPointerCapture(e.pointerId);
}
function onMove(e) {
  if (!dragging) { return; }
  var dt = e.timeStamp - lastT;
  if (dt > 0) { velocity = (e.clientX - lastX) / dt; }
  lastX = e.clientX; lastT = e.timeStamp;
  speed.textContent = Math.abs(velocity).toFixed(2) + ' px/ms';
  place(e.clientX - startX, false);
}
// 놓는 순간의 속도(px/ms)가 먼저고, 느리게 끌었을 땐 이동 거리(28%)가 두 번째 기준이다
function onUp(e) {
  if (!dragging) { return; }
  dragging = false;
  if (track.hasPointerCapture(e.pointerId)) { track.releasePointerCapture(e.pointerId); }
  var moved = e.clientX - startX;
  var carry = Math.abs(velocity) > 0.4 || Math.abs(moved) > width * 0.28;
  show(index + (carry && moved < 0 ? 1 : 0) - (carry && moved > 0 ? 1 : 0), true);
}
track.addEventListener('pointerdown', onDown);
track.addEventListener('pointermove', onMove);
track.addEventListener('pointerup', onUp); track.addEventListener('pointercancel', onUp);
dots.forEach(function (dot, i) { dot.addEventListener('click', function () { stopDemo(); measure(); show(i, true); }); });
root.addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') { return; }
  stopDemo(); measure(); show(index + (e.key === 'ArrowRight' ? 1 : -1), true);
});
window.addEventListener('resize', function () { measure(); place(0, false); });
measure(); show(0, false);
if (root.classList.contains('is-demo')) {
  timer = setInterval(function () {
    measure();
    var last = index === slides.length - 1;
    speed.textContent = (last ? 0.52 : 0.84).toFixed(2) + ' px/ms';
    place(last ? 64 : -64, true);
    setTimeout(function () { show(last ? 0 : index + 1, true); }, 180);
  }, 760);
}
</script>
</body>
</html>
