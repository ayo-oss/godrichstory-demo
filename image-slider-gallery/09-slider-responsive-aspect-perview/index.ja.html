<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幅に応じて見える枚数が変わるスライダー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="rp is-demo" id="rp" role="region" aria-roledescription="carousel" aria-label="幅に応じて枚数が変わる写真スライダー" tabindex="0">
  <header class="rp__bar">
    <span class="rp__title">1画面の枚数</span>
    <span class="rp__chip" id="chip">perView 2</span>
  </header>
  <div class="rp__frame" id="frame">
    <ul class="rp__track" id="track">
      <li class="rp__slide" role="group" aria-roledescription="slide" aria-label="6枚中1枚目"><span class="rp__ph rp__ph--a" role="img" aria-label="夜明けの埠頭のコンテナ"></span></li>
      <li class="rp__slide" role="group" aria-roledescription="slide" aria-label="6枚中2枚目"><span class="rp__ph rp__ph--b" role="img" aria-label="夕焼けの砂漠の稜線"></span></li>
      <li class="rp__slide" role="group" aria-roledescription="slide" aria-label="6枚中3枚目"><span class="rp__ph rp__ph--c" role="img" aria-label="雨上がりの街の路地"></span></li>
      <li class="rp__slide" role="group" aria-roledescription="slide" aria-label="6枚中4枚目"><span class="rp__ph rp__ph--d" role="img" aria-label="雪をかぶった白樺林"></span></li>
      <li class="rp__slide" role="group" aria-roledescription="slide" aria-label="6枚中5枚目"><span class="rp__ph rp__ph--e" role="img" aria-label="真昼のプールの水面"></span></li>
      <li class="rp__slide" role="group" aria-roledescription="slide" aria-label="6枚中6枚目"><span class="rp__ph rp__ph--f" role="img" aria-label="夜行列車の窓明かり"></span></li>
    </ul>
  </div>
  <nav class="rp__dots" aria-label="区間を選ぶ">
    <button class="rp__dot" type="button" aria-current="true" aria-label="1番目の区間を表示"></button>
    <button class="rp__dot" type="button" aria-current="false" aria-label="2番目の区間を表示"></button>
    <button class="rp__dot" type="button" aria-current="false" aria-label="3番目の区間を表示"></button>
    <button class="rp__dot" type="button" aria-current="false" aria-label="4番目の区間を表示"></button>
    <button class="rp__dot" type="button" aria-current="false" aria-label="5番目の区間を表示"></button>
    <button class="rp__dot" type="button" aria-current="false" aria-label="6番目の区間を表示"></button>
  </nav>
</section>
</main>
<script>
var root = document.getElementById('rp');
var track = document.getElementById('track');
var chip = document.getElementById('chip');
var dots = [].slice.call(document.querySelectorAll('.rp__dot'));
var total = track.children.length;
var index = 0, per = 1, timer = 0;
// 폭은 matchMedia 가 읽는다. resize 마다 재는 것과 달리 경계를 넘을 때만 한 번 불린다
var wide = window.matchMedia('(min-width: 640px)');
var mid = window.matchMedia('(min-width: 420px)');
function maxIndex() { return Math.max(0, total - per); }
function paint() {
  root.style.setProperty('--per', per);
  chip.textContent = 'perView ' + per;
  index = Math.min(index, maxIndex());
  track.style.transform = 'translate3d(' + (-index * (100 / per)) + '%, 0, 0)';
  dots.forEach(function (dot, i) {
    dot.hidden = i > maxIndex();
    dot.setAttribute('aria-current', i === index ? 'true' : 'false');
  });
  [].slice.call(track.children).forEach(function (slide, i) {
    slide.setAttribute('aria-hidden', (i >= index && i < index + per) ? 'false' : 'true');
  });
}
function measure() {
  per = wide.matches ? 3 : (mid.matches ? 2 : 1);
  paint();
}
function show(next) { index = Math.max(0, Math.min(maxIndex(), next)); paint(); }
function stopDemo() { root.classList.remove('is-demo'); clearInterval(timer); }
wide.addEventListener('change', measure);
mid.addEventListener('change', measure);
dots.forEach(function (dot, i) { dot.addEventListener('click', function () { stopDemo(); show(i); }); });
root.addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') { return; }
  stopDemo(); show(index + (e.key === 'ArrowRight' ? 1 : -1));
});
measure();
if (root.classList.contains('is-demo')) {
  timer = setInterval(function () {
    show(index >= maxIndex() ? 0 : index + 1);
  }, 620);
}
</script>
</body>
</html>
