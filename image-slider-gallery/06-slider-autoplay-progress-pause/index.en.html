<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autoplay slideshow with a progress bar and pause — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ap" id="ap">
  <div class="ap__view" id="view" role="region" aria-roledescription="carousel" aria-label="In-store info autoplay slideshow" tabindex="0">
    <div class="ap__track" id="track">
      <div class="ap__shot" role="group" aria-roledescription="slide" aria-label="Slide 1 of 4">
        <span class="ap__photo ap__photo--bread" role="img" aria-label="Loaves fresh from the oven lined up on a shelf"></span>
        <span class="ap__cap">Fresh bread</span>
      </div>
      <div class="ap__shot" role="group" aria-roledescription="slide" aria-label="Slide 2 of 4">
        <span class="ap__photo ap__photo--window" role="img" aria-label="A sunlit window seat with a wooden table"></span>
        <span class="ap__cap">Window seat</span>
      </div>
      <div class="ap__shot" role="group" aria-roledescription="slide" aria-label="Slide 3 of 4">
        <span class="ap__photo ap__photo--drink" role="img" aria-label="Two summer drinks with ice and fruit"></span>
        <span class="ap__cap">Summer drinks</span>
      </div>
      <div class="ap__shot" role="group" aria-roledescription="slide" aria-label="Slide 4 of 4">
        <span class="ap__photo ap__photo--plant" role="img" aria-label="Green potted plants lined up by the shop door"></span>
        <span class="ap__cap">Pots by the door</span>
      </div>
    </div>
  </div>
  <div class="ap__bar">
    <button class="ap__toggle" type="button" id="toggle" aria-label="Pause autoplay">
      <span class="ap__ico ap__ico--pause"><svg viewBox="0 0 256 256" width="1em" height="1em" aria-hidden="true" focusable="false"><path d="M200,32H160a16,16,0,0,0-16,16V208a16,16,0,0,0,16,16h40a16,16,0,0,0,16-16V48A16,16,0,0,0,200,32Zm0,176H160V48h40ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Zm0,176H56V48H96Z" fill="currentColor"/></svg></span>
      <span class="ap__ico ap__ico--play"><svg viewBox="0 0 256 256" width="1em" height="1em" aria-hidden="true" focusable="false"><path d="M232.4,114.49,88.32,26.35a16,16,0,0,0-16.2-.3A15.86,15.86,0,0,0,64,39.87V216.13A15.94,15.94,0,0,0,80,232a16.07,16.07,0,0,0,8.36-2.35L232.4,141.51a15.81,15.81,0,0,0,0-27ZM80,215.94V40l143.83,88Z" fill="currentColor"/></svg></span>
    </button>
    <span class="ap__meter"><span class="ap__fill" id="fill"></span></span>
    <span class="ap__count" id="count" aria-hidden="true">1 / 4</span>
  </div>
  <span class="ap__dots" role="group" aria-label="Choose a slide">
    <button class="ap__dot" type="button" data-go="0" aria-label="Slide 1" aria-current="true"></button>
    <button class="ap__dot" type="button" data-go="1" aria-label="Slide 2" aria-current="false"></button>
    <button class="ap__dot" type="button" data-go="2" aria-label="Slide 3" aria-current="false"></button>
    <button class="ap__dot" type="button" data-go="3" aria-label="Slide 4" aria-current="false"></button>
  </span>
</div>
</main>
<script>
var root = document.getElementById('ap');
var track = document.getElementById('track');
var fill = document.getElementById('fill');
var toggle = document.getElementById('toggle');
var count = document.getElementById('count');
var dots = Array.prototype.slice.call(root.querySelectorAll('.ap__dot'));
var PAUSE_LABEL = 'Pause autoplay';
var PLAY_LABEL = 'Start autoplay';
var HOLD = 1200;
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var index = 0, playing = false, wanted = !reduce, startAt = 0, remain = HOLD, raf = 0;
function show(next) {
  index = (next + dots.length) % dots.length;
  track.style.setProperty('--i', index);
  count.textContent = (index + 1) + ' / ' + dots.length;
  dots.forEach(function (dot, i) { dot.setAttribute('aria-current', i === index ? 'true' : 'false'); });
}
// 남은 시간은 막대 하나의 scaleX 로만 나타난다 — 폭을 줄이면 매 프레임 레이아웃을 다시 잰다
function frame(now) {
  var passed = Math.min(1, (now - startAt) / HOLD);
  fill.style.setProperty('--p', (1 - passed).toFixed(3));
  if (passed >= 1) { startAt = now; show(index + 1); }
  raf = requestAnimationFrame(frame);
}
function play() {
  if (playing) { return; }
  playing = true;
  startAt = performance.now() - (HOLD - remain);
  root.classList.remove('is-paused');
  toggle.setAttribute('aria-label', PAUSE_LABEL);
  raf = requestAnimationFrame(frame);
}
function pause() {
  if (!playing) { return; }
  playing = false;
  remain = Math.max(0, HOLD - (performance.now() - startAt));
  cancelAnimationFrame(raf);
  root.classList.add('is-paused');
  toggle.setAttribute('aria-label', PLAY_LABEL);
}
toggle.addEventListener('click', function () {
  wanted = !wanted;
  if (wanted) { remain = HOLD; play(); } else { pause(); }
});
root.addEventListener('click', function (e) {
  var dot = e.target.closest('[data-go]');
  if (!dot) { return; }
  show(Number(dot.getAttribute('data-go')));
  remain = HOLD;
  startAt = performance.now();
  fill.style.setProperty('--p', '1');
});
// 탭을 떠나 있는 동안 사진이 혼자 넘어가면 돌아왔을 때 어디였는지 알 수 없다
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { pause(); } else if (wanted) { play(); }
});
// 움직임을 줄이라는 설정이면 자동재생을 아예 시작하지 않는다 (WCAG 2.2.2)
if (wanted) { play(); } else {
  root.classList.add('is-paused');
  toggle.setAttribute('aria-label', PLAY_LABEL);
}
</script>
</body>
</html>
