<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>썸네일 줄과 서로 맞추는 슬라이더 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="gal is-demo" id="gal" tabindex="0" role="region" aria-roledescription="carousel" aria-label="객실 사진 슬라이더">
  <div class="gal__main">
    <div class="gal__track" id="track" style="--i:0">
      <article class="gal__slide" aria-roledescription="slide">
        <div class="gal__shot gal__shot--a" role="img" aria-label="아침 햇빛이 길게 드는 창가 침대와 흰 침구"></div>
        <p class="gal__cap">창가 침대</p>
      </article>
      <article class="gal__slide" aria-roledescription="slide">
        <div class="gal__shot gal__shot--b" role="img" aria-label="스탠드 불빛이 동그랗게 떨어지는 원목 책상"></div>
        <p class="gal__cap">원목 책상</p>
      </article>
      <article class="gal__slide" aria-roledescription="slide">
        <div class="gal__shot gal__shot--c" role="img" aria-label="청록 타일을 두른 욕실과 둥근 거울"></div>
        <p class="gal__cap">청록 욕실</p>
      </article>
      <article class="gal__slide" aria-roledescription="slide">
        <div class="gal__shot gal__shot--d" role="img" aria-label="나무 선반에 컵이 줄지어 놓인 작은 주방"></div>
        <p class="gal__cap">주방 선반</p>
      </article>
      <article class="gal__slide" aria-roledescription="slide">
        <div class="gal__shot gal__shot--e" role="img" aria-label="화분을 둔 좁은 발코니와 난간 너머 골목"></div>
        <p class="gal__cap">좁은 발코니</p>
      </article>
      <article class="gal__slide" aria-roledescription="slide">
        <div class="gal__shot gal__shot--f" role="img" aria-label="간접등만 켠 밤의 거실과 낮은 소파"></div>
        <p class="gal__cap">밤의 거실</p>
      </article>
    </div>
    <button class="gal__nav gal__nav--prev" id="prev" type="button" aria-label="이전 사진"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M160 48v160l-80-80Z" opacity=".2"/><path d="M163.06 40.61a8 8 0 0 0-8.72 1.73l-80 80a8 8 0 0 0 0 11.32l80 80A8 8 0 0 0 168 208V48a8 8 0 0 0-4.94-7.39M152 188.69L91.31 128L152 67.31Z"/></g></svg></button>
    <button class="gal__nav gal__nav--next" id="next" type="button" aria-label="다음 사진"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></button>
  </div>
  <div class="gal__strip" id="strip" role="group" aria-label="썸네일 줄">
    <button class="gal__thumb" type="button" aria-selected="false"><span class="gal__thumbArt gal__shot--a" role="img" aria-label="창가 침대"></span></button>
    <button class="gal__thumb" type="button" aria-selected="false"><span class="gal__thumbArt gal__shot--b" role="img" aria-label="원목 책상"></span></button>
    <button class="gal__thumb" type="button" aria-selected="false"><span class="gal__thumbArt gal__shot--c" role="img" aria-label="청록 욕실"></span></button>
    <button class="gal__thumb" type="button" aria-selected="false"><span class="gal__thumbArt gal__shot--d" role="img" aria-label="주방 선반"></span></button>
    <button class="gal__thumb" type="button" aria-selected="false"><span class="gal__thumbArt gal__shot--e" role="img" aria-label="좁은 발코니"></span></button>
    <button class="gal__thumb" type="button" aria-selected="false"><span class="gal__thumbArt gal__shot--f" role="img" aria-label="밤의 거실"></span></button>
  </div>
</section>
</main>
<script>
// 큰 사진과 썸네일 줄이 인덱스 하나를 같이 쓴다.
// 썸네일 클릭 → go(n) 으로 본문이 움직이고, 본문이 움직이면 scrollIntoView 가 활성 칸을 줄 가운데로 끌어온다.
var gal = document.getElementById('gal');
var track = document.getElementById('track');
var strip = document.getElementById('strip');
var slides = track.querySelectorAll('.gal__slide');
var thumbs = strip.querySelectorAll('.gal__thumb');
var SLIDE_LABEL = '{total}장 중 {n}장';
var total = slides.length;
var index = 0;
var timer = 0;
var soft = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function label(form, n) { return form.replace('{n}', n).replace('{total}', total); }
function picker(n) { return function () { stop(); go(n); }; }
function go(n) {
  index = (n + total) % total;
  track.style.setProperty('--i', index);
  for (var k = 0; k < total; k++) {
    slides[k].setAttribute('aria-hidden', k === index ? 'false' : 'true');
    thumbs[k].setAttribute('aria-selected', k === index ? 'true' : 'false');
  }
  // 본문 → 썸네일 방향. block:'nearest' 라 줄만 움직이고 페이지는 그대로 있다
  thumbs[index].scrollIntoView({ block: 'nearest', inline: 'center', behavior: soft ? 'smooth' : 'auto' });
}
function stop() {
  gal.classList.remove('is-demo');
  if (timer) { clearInterval(timer); timer = 0; }
}
for (var i = 0; i < total; i++) {
  slides[i].setAttribute('aria-label', label(SLIDE_LABEL, i + 1));
  thumbs[i].addEventListener('click', picker(i));
}
document.getElementById('prev').addEventListener('click', function () { stop(); go(index - 1); });
document.getElementById('next').addEventListener('click', function () { stop(); go(index + 1); });
gal.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowLeft') { stop(); go(index - 1); }
  if (e.key === 'ArrowRight') { stop(); go(index + 1); }
});
gal.addEventListener('pointerdown', stop);
go(0);
// 격자 미리보기: .is-demo 가 붙어 있는 동안만 혼자 넘어간다
timer = setInterval(function () { if (gal.classList.contains('is-demo')) { go(index + 1); } }, 480);
</script>
</body>
</html>
