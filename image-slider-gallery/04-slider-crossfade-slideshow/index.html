<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>겹쳐 두고 서로 녹는 페이드 슬라이드쇼 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="xf is-demo" id="xf">
  <div class="xf__view" id="view" role="region" aria-roledescription="carousel" aria-label="배경 사진이 천천히 바뀌는 슬라이드쇼" tabindex="0">
    <div class="xf__shot is-on" role="group" aria-roledescription="slide" aria-label="4장 중 1장" aria-hidden="false">
      <span class="xf__photo xf__photo--rain" role="img" aria-label="비 온 뒤 젖은 골목 바닥에 간판 불빛이 번진 풍경"></span>
      <span class="xf__cap">비 온 뒤 골목</span>
    </div>
    <div class="xf__shot" role="group" aria-roledescription="slide" aria-label="4장 중 2장" aria-hidden="true">
      <span class="xf__photo xf__photo--dusk" role="img" aria-label="해 질 녘 옥상에서 내려다본 주황빛 하늘"></span>
      <span class="xf__cap">해 질 녘 옥상</span>
    </div>
    <div class="xf__shot" role="group" aria-roledescription="slide" aria-label="4장 중 3장" aria-hidden="true">
      <span class="xf__photo xf__photo--fog" role="img" aria-label="새벽 안개가 낮게 깔린 호수와 갈대밭"></span>
      <span class="xf__cap">안개 낀 호수</span>
    </div>
    <div class="xf__shot" role="group" aria-roledescription="slide" aria-label="4장 중 4장" aria-hidden="true">
      <span class="xf__photo xf__photo--snow" role="img" aria-label="눈이 소복이 쌓인 마당과 낮은 담장"></span>
      <span class="xf__cap">눈 덮인 마당</span>
    </div>
  </div>
  <div class="xf__bar">
    <button class="xf__nav" type="button" data-step="-1" aria-label="이전 장"><svg viewBox="0 0 256 256" width="1em" height="1em" aria-hidden="true" focusable="false"><g fill="currentColor"><path d="M160 48v160l-80-80Z" opacity=".2"/><path d="M163.06 40.61a8 8 0 0 0-8.72 1.73l-80 80a8 8 0 0 0 0 11.32l80 80A8 8 0 0 0 168 208V48a8 8 0 0 0-4.94-7.39M152 188.69L91.31 128L152 67.31Z"/></g></svg></button>
    <span class="xf__dots" role="group" aria-label="장 고르기">
      <button class="xf__dot" type="button" data-go="0" aria-label="1번째 장" aria-current="true"></button>
      <button class="xf__dot" type="button" data-go="1" aria-label="2번째 장" aria-current="false"></button>
      <button class="xf__dot" type="button" data-go="2" aria-label="3번째 장" aria-current="false"></button>
      <button class="xf__dot" type="button" data-go="3" aria-label="4번째 장" aria-current="false"></button>
    </span>
    <button class="xf__nav" type="button" data-step="1" aria-label="다음 장"><svg viewBox="0 0 256 256" width="1em" height="1em" aria-hidden="true" focusable="false"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></button>
  </div>
</div>
</main>
<script>
var root = document.getElementById('xf');
var view = document.getElementById('view');
var shots = Array.prototype.slice.call(root.querySelectorAll('.xf__shot'));
var dots = Array.prototype.slice.call(root.querySelectorAll('.xf__dot'));
var index = 0;
var timer = 0;
// 트랙이 없다. 장은 한자리에 포개져 있고 바뀌는 값은 opacity 하나뿐이라 이동 거리가 0 이다
function show(next) {
  index = (next + shots.length) % shots.length;
  shots.forEach(function (shot, i) {
    var on = i === index;
    shot.classList.toggle('is-on', on);
    shot.setAttribute('aria-hidden', on ? 'false' : 'true');
  });
  dots.forEach(function (dot, i) {
    dot.setAttribute('aria-current', i === index ? 'true' : 'false');
  });
}
function stopPreview() {
  root.classList.remove('is-demo');
  if (timer) { clearInterval(timer); timer = 0; }
}
root.addEventListener('click', function (e) {
  var nav = e.target.closest('[data-step]');
  var dot = e.target.closest('[data-go]');
  if (!nav && !dot) { return; }
  stopPreview();
  show(nav ? index + Number(nav.getAttribute('data-step')) : Number(dot.getAttribute('data-go')));
});
view.addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') { return; }
  e.preventDefault();
  stopPreview();
  show(index + (e.key === 'ArrowRight' ? 1 : -1));
});
if (root.classList.contains('is-demo')) {
  timer = setInterval(function () { show(index + 1); }, 720);
}
</script>
</body>
</html>
