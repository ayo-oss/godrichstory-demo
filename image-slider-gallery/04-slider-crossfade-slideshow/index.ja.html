<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重ねて溶け合うフェードスライドショー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="xf is-demo" id="xf">
  <div class="xf__view" id="view" role="region" aria-roledescription="carousel" aria-label="背景写真がゆっくり変わるスライドショー" tabindex="0">
    <div class="xf__shot is-on" role="group" aria-roledescription="slide" aria-label="4枚中1枚目" aria-hidden="false">
      <span class="xf__photo xf__photo--rain" role="img" aria-label="雨上がりの濡れた路地に看板の灯りがにじむ風景"></span>
      <span class="xf__cap">雨上がりの路地</span>
    </div>
    <div class="xf__shot" role="group" aria-roledescription="slide" aria-label="4枚中2枚目" aria-hidden="true">
      <span class="xf__photo xf__photo--dusk" role="img" aria-label="夕暮れの屋上から見下ろすオレンジ色の空"></span>
      <span class="xf__cap">夕暮れの屋上</span>
    </div>
    <div class="xf__shot" role="group" aria-roledescription="slide" aria-label="4枚中3枚目" aria-hidden="true">
      <span class="xf__photo xf__photo--fog" role="img" aria-label="朝霧が低く垂れこめる湖と葦原"></span>
      <span class="xf__cap">霧の湖</span>
    </div>
    <div class="xf__shot" role="group" aria-roledescription="slide" aria-label="4枚中4枚目" aria-hidden="true">
      <span class="xf__photo xf__photo--snow" role="img" aria-label="雪が積もった庭と低い塀"></span>
      <span class="xf__cap">雪の庭</span>
    </div>
  </div>
  <div class="xf__bar">
    <button class="xf__nav" type="button" data-step="-1" aria-label="前のスライド"><svg viewBox="0 0 256 256" width="1em" height="1em" aria-hidden="true" focusable="false"><g fill="currentColor"><path d="M160 48v160l-80-80Z" opacity=".2"/><path d="M163.06 40.61a8 8 0 0 0-8.72 1.73l-80 80a8 8 0 0 0 0 11.32l80 80A8 8 0 0 0 168 208V48a8 8 0 0 0-4.94-7.39M152 188.69L91.31 128L152 67.31Z"/></g></svg></button>
    <span class="xf__dots" role="group" aria-label="スライドを選ぶ">
      <button class="xf__dot" type="button" data-go="0" aria-label="1枚目" aria-current="true"></button>
      <button class="xf__dot" type="button" data-go="1" aria-label="2枚目" aria-current="false"></button>
      <button class="xf__dot" type="button" data-go="2" aria-label="3枚目" aria-current="false"></button>
      <button class="xf__dot" type="button" data-go="3" aria-label="4枚目" aria-current="false"></button>
    </span>
    <button class="xf__nav" type="button" data-step="1" aria-label="次のスライド"><svg viewBox="0 0 256 256" width="1em" height="1em" aria-hidden="true" focusable="false"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></button>
  </div>
</div>
</main>
<script>
var root = document.getElementById('xf');
var view = document.getElementById('view');
var shots = Array.prototype.slice.call(root.querySelectorAll('.xf__shot'));
var dots = Array.prototype.slice.call(root.querySelectorAll('.xf__dot'));
var index = 0;
var timer = 0;
// 트랙이 없다. 장은 한자리에 포개져 있고 바뀌는 값은 opacity 하나뿐이라 이동 거리가 0 이다
function show(next) {
  index = (next + shots.length) % shots.length;
  shots.forEach(function (shot, i) {
    var on = i === index;
    shot.classList.toggle('is-on', on);
    shot.setAttribute('aria-hidden', on ? 'false' : 'true');
  });
  dots.forEach(function (dot, i) {
    dot.setAttribute('aria-current', i === index ? 'true' : 'false');
  });
}
function stopPreview() {
  root.classList.remove('is-demo');
  if (timer) { clearInterval(timer); timer = 0; }
}
root.addEventListener('click', function (e) {
  var nav = e.target.closest('[data-step]');
  var dot = e.target.closest('[data-go]');
  if (!nav && !dot) { return; }
  stopPreview();
  show(nav ? index + Number(nav.getAttribute('data-step')) : Number(dot.getAttribute('data-go')));
});
view.addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') { return; }
  e.preventDefault();
  stopPreview();
  show(index + (e.key === 'ArrowRight' ? 1 : -1));
});
if (root.classList.contains('is-demo')) {
  timer = setInterval(function () { show(index + 1); }, 720);
}
</script>
</body>
</html>
