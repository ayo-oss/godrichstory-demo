<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アルバム格子から開くライトボックススライダー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="ab is-demo" id="ab">
  <header class="ab__bar">
    <span class="ab__title">アルバム格子</span>
    <span class="ab__hint">閉じずに次の1枚へ</span>
  </header>
  <ul class="ab__grid" id="grid">
    <li class="ab__cell"><button class="ab__btn" type="button" aria-label="夜明けの埠頭のコンテナを拡大"><span class="ab__ph ab__ph--a" role="img" aria-label="夜明けの埠頭のコンテナ"></span></button></li>
    <li class="ab__cell"><button class="ab__btn" type="button" aria-label="夕焼けの砂漠の稜線を拡大"><span class="ab__ph ab__ph--b" role="img" aria-label="夕焼けの砂漠の稜線"></span></button></li>
    <li class="ab__cell"><button class="ab__btn" type="button" aria-label="雨上がりの街の路地を拡大"><span class="ab__ph ab__ph--c" role="img" aria-label="雨上がりの街の路地"></span></button></li>
    <li class="ab__cell"><button class="ab__btn" type="button" aria-label="雪をかぶった白樺林を拡大"><span class="ab__ph ab__ph--d" role="img" aria-label="雪をかぶった白樺林"></span></button></li>
    <li class="ab__cell"><button class="ab__btn" type="button" aria-label="真昼のプールの水面を拡大"><span class="ab__ph ab__ph--e" role="img" aria-label="真昼のプールの水面"></span></button></li>
    <li class="ab__cell"><button class="ab__btn" type="button" aria-label="夜行列車の窓明かりを拡大"><span class="ab__ph ab__ph--f" role="img" aria-label="夜行列車の窓明かり"></span></button></li>
  </ul>
</section>
<dialog class="lb" id="lb" aria-label="写真を拡大表示">
  <div class="lb__box" role="region" aria-roledescription="carousel" aria-label="ライトボックスの写真スライダー">
    <div class="lb__frame">
      <div class="lb__track" id="lbtrack">
        <span class="lb__slide" role="group" aria-roledescription="slide" aria-label="6枚中1枚目"><span class="ab__ph ab__ph--a" role="img" aria-label="夜明けの埠頭のコンテナ"></span></span>
        <span class="lb__slide" role="group" aria-roledescription="slide" aria-label="6枚中2枚目"><span class="ab__ph ab__ph--b" role="img" aria-label="夕焼けの砂漠の稜線"></span></span>
        <span class="lb__slide" role="group" aria-roledescription="slide" aria-label="6枚中3枚目"><span class="ab__ph ab__ph--c" role="img" aria-label="雨上がりの街の路地"></span></span>
        <span class="lb__slide" role="group" aria-roledescription="slide" aria-label="6枚中4枚目"><span class="ab__ph ab__ph--d" role="img" aria-label="雪をかぶった白樺林"></span></span>
        <span class="lb__slide" role="group" aria-roledescription="slide" aria-label="6枚中5枚目"><span class="ab__ph ab__ph--e" role="img" aria-label="真昼のプールの水面"></span></span>
        <span class="lb__slide" role="group" aria-roledescription="slide" aria-label="6枚中6枚目"><span class="ab__ph ab__ph--f" role="img" aria-label="夜行列車の窓明かり"></span></span>
      </div>
    </div>
    <div class="lb__bar">
      <button class="lb__nav" id="prev" type="button" aria-label="前の写真"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M160 48v160l-80-80Z" opacity=".2"/><path d="M163.06 40.61a8 8 0 0 0-8.72 1.73l-80 80a8 8 0 0 0 0 11.32l80 80A8 8 0 0 0 168 208V48a8 8 0 0 0-4.94-7.39M152 188.69L91.31 128L152 67.31Z"/></g></svg></button>
      <span class="lb__count" id="count">1 / 6</span>
      <button class="lb__nav" id="next" type="button" aria-label="次の写真"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></button>
      <button class="lb__close" id="close" type="button" aria-label="閉じる"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M216 56v144a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h144a16 16 0 0 1 16 16" opacity=".2"/><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg></button>
    </div>
  </div>
</dialog>
</main>
<script>
var ab = document.getElementById('ab');
var lb = document.getElementById('lb');
var lbtrack = document.getElementById('lbtrack');
var count = document.getElementById('count');
var cells = [].slice.call(document.querySelectorAll('.ab__btn'));
var total = lbtrack.children.length;
var index = 0, opener = null, timer = 0;
function show(next) {
  index = (next + total) % total;
  lbtrack.style.transform = 'translateX(' + (-index * 100) + '%)';
  count.textContent = (index + 1) + ' / ' + total;
  [].slice.call(lbtrack.children).forEach(function (slide, i) {
    slide.setAttribute('aria-hidden', i === index ? 'false' : 'true');
  });
}
// 격자 칸이 dialog 를 연다. 열린 뒤에도 창은 그대로 두고 트랙만 움직이는 것이 이 항목의 축이다
function open(at, from) {
  opener = from || cells[at];
  show(at);
  if (!lb.open) { lb.showModal(); }
}
function stopDemo() { ab.classList.remove('is-demo'); clearInterval(timer); }
cells.forEach(function (cell, i) {
  cell.addEventListener('click', function () { stopDemo(); open(i, cell); });
});
document.getElementById('prev').addEventListener('click', function () { stopDemo(); show(index - 1); });
document.getElementById('next').addEventListener('click', function () { stopDemo(); show(index + 1); });
document.getElementById('close').addEventListener('click', function () { stopDemo(); lb.close(); });
lb.addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') { return; }
  e.preventDefault(); stopDemo(); show(index + (e.key === 'ArrowRight' ? 1 : -1));
});
// Esc 로 닫아도 close 이벤트는 온다 — 초점은 항상 눌렀던 격자 칸으로 돌아간다
lb.addEventListener('close', function () {
  if (opener) { opener.focus({ preventScroll: true }); }
});
show(0);
if (ab.classList.contains('is-demo')) {
  timer = setInterval(function () {
    if (!lb.open) { open(0, cells[0]); }
    else if (index < total - 1) { show(index + 1); }
    else { lb.close(); }
  }, 460);
}
</script>
</body>
</html>
