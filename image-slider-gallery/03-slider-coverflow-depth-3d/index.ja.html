<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中央が手前に出る奥行きスライダー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="cf is-demo" id="cf" tabindex="0" role="region" aria-roledescription="carousel" aria-label="アルバムジャケットの奥行きスライダー">
  <div class="cf__box">
    <div class="cf__track" id="track">
      <button class="cf__card" type="button" aria-roledescription="slide">
        <span class="cf__art cf__art--a" role="img" aria-label="水霧が低く覆う静かな湖のジャケット"></span>
        <span class="cf__name">夜明けの湖</span>
      </button>
      <button class="cf__card" type="button" aria-roledescription="slide">
        <span class="cf__art cf__art--b" role="img" aria-label="夕暮れに赤く染まる砂漠の岩のジャケット"></span>
        <span class="cf__name">赤い砂漠</span>
      </button>
      <button class="cf__card" type="button" aria-roledescription="slide">
        <span class="cf__art cf__art--c" role="img" aria-label="明かりのついたホームが並ぶ夜の駅のジャケット"></span>
        <span class="cf__name">夜の停車場</span>
      </button>
      <button class="cf__card" type="button" aria-roledescription="slide">
        <span class="cf__art cf__art--d" role="img" aria-label="雨上がりの濡れた緑の丘と低い雲のジャケット"></span>
        <span class="cf__name">緑の丘</span>
      </button>
      <button class="cf__card" type="button" aria-roledescription="slide">
        <span class="cf__art cf__art--e" role="img" aria-label="青い氷が浮かぶ冬の海のジャケット"></span>
        <span class="cf__name">氷の海</span>
      </button>
    </div>
  </div>
  <div class="cf__bar">
    <button class="cf__nav" id="prev" type="button" aria-label="前のジャケット"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M160 48v160l-80-80Z" opacity=".2"/><path d="M163.06 40.61a8 8 0 0 0-8.72 1.73l-80 80a8 8 0 0 0 0 11.32l80 80A8 8 0 0 0 168 208V48a8 8 0 0 0-4.94-7.39M152 188.69L91.31 128L152 67.31Z"/></g></svg></button>
    <div class="cf__dots" id="dots"></div>
    <button class="cf__nav" id="next" type="button" aria-label="次のジャケット"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></button>
  </div>
</section>
</main>
<script>
// 스크롤 위치가 아니라 "활성 장에서 몇 칸 떨어졌는가" 가 모양을 정한다.
// JS 는 카드마다 거리 d 와 |d| 만 CSS 변수로 얹고, rotateY·translateZ·축소는 CSS 가 계산한다.
var cf = document.getElementById('cf');
var track = document.getElementById('track');
var dotsBox = document.getElementById('dots');
var cards = track.querySelectorAll('.cf__card');
var SLIDE_LABEL = '{total}枚中{n}枚目 · {name}';
var DOT_LABEL = '{n}枚目のジャケットを表示';
var total = cards.length;
var index = 0;
var timer = 0;
var dots = [];
function picker(n) { return function () { stop(); go(n); }; }
function go(n) {
  index = (n + total) % total;
  for (var k = 0; k < total; k++) {
    var d = k - index;
    var far = Math.abs(d);
    cards[k].style.setProperty('--d', d);
    cards[k].style.setProperty('--ad', far);
    cards[k].style.zIndex = String(total - far);
    cards[k].style.pointerEvents = far > 2 ? 'none' : 'auto';
    cards[k].setAttribute('aria-current', d === 0 ? 'true' : 'false');
    dots[k].setAttribute('aria-current', d === 0 ? 'true' : 'false');
  }
}
function stop() {
  cf.classList.remove('is-demo');
  if (timer) { clearInterval(timer); timer = 0; }
}
for (var i = 0; i < total; i++) {
  var name = cards[i].querySelector('.cf__name').textContent;
  cards[i].setAttribute('aria-label', SLIDE_LABEL.replace('{n}', i + 1).replace('{total}', total).replace('{name}', name));
  cards[i].addEventListener('click', picker(i));
  var dot = document.createElement('button');
  dot.type = 'button';
  dot.className = 'cf__dot';
  dot.setAttribute('aria-label', DOT_LABEL.replace('{n}', i + 1));
  dot.addEventListener('click', picker(i));
  dotsBox.appendChild(dot);
  dots.push(dot);
}
document.getElementById('prev').addEventListener('click', function () { stop(); go(index - 1); });
document.getElementById('next').addEventListener('click', function () { stop(); go(index + 1); });
cf.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowLeft') { stop(); go(index - 1); }
  if (e.key === 'ArrowRight') { stop(); go(index + 1); }
});
cf.addEventListener('pointerdown', stop);
go(0);
// 격자 미리보기: .is-demo 가 붙어 있는 동안만 혼자 넘어간다
timer = setInterval(function () { if (cf.classList.contains('is-demo')) { go(index + 1); } }, 440);
</script>
</body>
</html>
