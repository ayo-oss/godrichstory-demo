<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画面いっぱいのヒーロースライダー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="hero is-demo" id="hero" tabindex="0" role="region" aria-roledescription="carousel" aria-label="旅の写真ヒーロースライダー">
  <div class="hero__view">
    <div class="hero__track" id="track" style="--i:0">
      <article class="hero__slide" aria-roledescription="slide">
        <div class="hero__shot hero__shot--a" role="img" aria-label="夕焼けが広がる空の下、海沿いを曲がっていく海岸道路"></div>
        <p class="hero__cap">海岸道路</p>
      </article>
      <article class="hero__slide" aria-roledescription="slide">
        <div class="hero__shot hero__shot--b" role="img" aria-label="夜明けの水霧が低く漂う静かな湖と対岸の森"></div>
        <p class="hero__cap">夜明けの湖</p>
      </article>
      <article class="hero__slide" aria-roledescription="slide">
        <div class="hero__shot hero__shot--c" role="img" aria-label="雪に覆われた山の稜線と、その上に開けた冷たい空"></div>
        <p class="hero__cap">雪の稜線</p>
      </article>
      <article class="hero__slide" aria-roledescription="slide">
        <div class="hero__shot hero__shot--d" role="img" aria-label="夜の街の屋上から見下ろす窓明かりと遠い地平線"></div>
        <p class="hero__cap">夜の屋上</p>
      </article>
    </div>
  </div>
  <button class="hero__nav hero__nav--prev" id="prev" type="button" aria-label="前の写真"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M160 48v160l-80-80Z" opacity=".2"/><path d="M163.06 40.61a8 8 0 0 0-8.72 1.73l-80 80a8 8 0 0 0 0 11.32l80 80A8 8 0 0 0 168 208V48a8 8 0 0 0-4.94-7.39M152 188.69L91.31 128L152 67.31Z"/></g></svg></button>
  <button class="hero__nav hero__nav--next" id="next" type="button" aria-label="次の写真"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></button>
  <div class="hero__dots" id="dots"></div>
</section>
</main>
<script>
// 인덱스 하나가 전부다. 트랙의 --i 를 바꾸면 CSS 가 translate3d 로 옮기고,
// 점과 화살표는 같은 index 를 읽는다 (라이브러리 0 · 스크롤 컨테이너 아님).
var hero = document.getElementById('hero');
var track = document.getElementById('track');
var dotsBox = document.getElementById('dots');
var slides = track.querySelectorAll('.hero__slide');
var SLIDE_LABEL = '{total}枚中{n}枚目';
var DOT_LABEL = '{n}枚目を表示';
var total = slides.length;
var index = 0;
var timer = 0;
var dots = [];
function label(form, n) { return form.replace('{n}', n).replace('{total}', total); }
function picker(n) { return function () { stop(); go(n); }; }
function go(n) {
  index = (n + total) % total;
  track.style.setProperty('--i', index);
  for (var k = 0; k < total; k++) {
    slides[k].setAttribute('aria-hidden', k === index ? 'false' : 'true');
    dots[k].setAttribute('aria-current', k === index ? 'true' : 'false');
  }
}
function stop() {
  hero.classList.remove('is-demo');
  if (timer) { clearInterval(timer); timer = 0; }
}
for (var i = 0; i < total; i++) {
  slides[i].setAttribute('aria-label', label(SLIDE_LABEL, i + 1));
  var dot = document.createElement('button');
  dot.type = 'button';
  dot.className = 'hero__dot';
  dot.setAttribute('aria-label', label(DOT_LABEL, i + 1));
  dot.addEventListener('click', picker(i));
  dotsBox.appendChild(dot);
  dots.push(dot);
}
document.getElementById('prev').addEventListener('click', function () { stop(); go(index - 1); });
document.getElementById('next').addEventListener('click', function () { stop(); go(index + 1); });
hero.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowLeft') { stop(); go(index - 1); }
  if (e.key === 'ArrowRight') { stop(); go(index + 1); }
});
hero.addEventListener('pointerdown', stop);
go(0);
// 격자 미리보기: .is-demo 가 붙어 있는 동안만 혼자 넘어간다. 손이 닿으면 stop() 이 뗀다
timer = setInterval(function () { if (hero.classList.contains('is-demo')) { go(index + 1); } }, 560);
</script>
</body>
</html>
