<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marquee static fallback for reduced motion — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="panel is-demo">
    <div class="panel__row">
      <div class="marquee">
        <div class="marquee__track">
          <span class="marquee__chip">お知らせ</span>
          <span class="marquee__chip">アップデート</span>
          <span class="marquee__chip">イベント</span>
          <span class="marquee__chip" aria-hidden="true">お知らせ</span>
          <span class="marquee__chip" aria-hidden="true">アップデート</span>
          <span class="marquee__chip" aria-hidden="true">イベント</span>
        </div>
      </div>
      <span class="panel__state">
        <span class="panel__state-text panel__state-text--play">再生中</span>
        <span class="panel__state-text panel__state-text--pause">停止中</span>
      </span>
    </div>
    <label class="panel__toggle" aria-hidden="true">
      <span class="panel__toggle-track"><span class="panel__toggle-knob"></span></span>
      <span class="panel__toggle-label">モーションを減らす</span>
    </label>
  </div>
</main>
</body>
</html>
