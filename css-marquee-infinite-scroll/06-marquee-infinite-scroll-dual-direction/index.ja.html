<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dual direction marquee rows — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="marquee">
    <div class="marquee__row marquee__row--fwd">
      <div class="marquee__track">
        <span class="marquee__chip">DESIGN</span>
        <span class="marquee__chip">MOTION</span>
        <span class="marquee__chip">LAYOUT</span>
        <span class="marquee__chip" aria-hidden="true">DESIGN</span>
        <span class="marquee__chip" aria-hidden="true">MOTION</span>
        <span class="marquee__chip" aria-hidden="true">LAYOUT</span>
      </div>
    </div>
    <div class="marquee__row marquee__row--rev">
      <div class="marquee__track">
        <span class="marquee__chip">CSS</span>
        <span class="marquee__chip">SCSS</span>
        <span class="marquee__chip">REACT</span>
        <span class="marquee__chip" aria-hidden="true">CSS</span>
        <span class="marquee__chip" aria-hidden="true">SCSS</span>
        <span class="marquee__chip" aria-hidden="true">REACT</span>
      </div>
    </div>
  </div>
</main>
</body>
</html>
