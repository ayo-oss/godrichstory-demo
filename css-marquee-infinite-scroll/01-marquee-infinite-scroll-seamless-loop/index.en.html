<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seamless marquee loop — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="marquee">
    <div class="marquee__track">
      <span class="marquee__chip">A</span>
      <span class="marquee__chip">B</span>
      <span class="marquee__chip">C</span>
      <span class="marquee__chip">D</span>
      <span class="marquee__chip">E</span>
      <span class="marquee__chip">F</span>
      <span class="marquee__chip" aria-hidden="true">A</span>
      <span class="marquee__chip" aria-hidden="true">B</span>
      <span class="marquee__chip" aria-hidden="true">C</span>
      <span class="marquee__chip" aria-hidden="true">D</span>
      <span class="marquee__chip" aria-hidden="true">E</span>
      <span class="marquee__chip" aria-hidden="true">F</span>
    </div>
  </div>
</main>
</body>
</html>
