<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite logo marquee — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="marquee">
    <p class="marquee__label">パートナー各社</p>
    <div class="marquee__row">
      <div class="marquee__track">
        <span class="marquee__logo">NORTH</span>
        <span class="marquee__logo">ACME</span>
        <span class="marquee__logo">ORBIT</span>
        <span class="marquee__logo">VELA</span>
        <span class="marquee__logo">KADE</span>
        <span class="marquee__logo" aria-hidden="true">NORTH</span>
        <span class="marquee__logo" aria-hidden="true">ACME</span>
        <span class="marquee__logo" aria-hidden="true">ORBIT</span>
        <span class="marquee__logo" aria-hidden="true">VELA</span>
        <span class="marquee__logo" aria-hidden="true">KADE</span>
      </div>
    </div>
  </div>
</main>
</body>
</html>
