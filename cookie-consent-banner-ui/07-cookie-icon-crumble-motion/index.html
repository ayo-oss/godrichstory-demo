<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cookie crumble icon — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ck is-demo">
    <div class="ck__art">
      <span class="ck__icon" aria-hidden="true"><svg viewBox="0 0 256 256" width="120" height="120"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a48 48 0 0 0 48 48a48 48 0 0 0 48 48" opacity=".2"/><path d="M164.49 163.51a12 12 0 1 1-17 0a12 12 0 0 1 17 0m-81-8a12 12 0 1 0 17 0a12 12 0 0 0-16.98 0Zm9-39a12 12 0 1 0-17 0a12 12 0 0 0 17-.02Zm48-1a12 12 0 1 0 0 17a12 12 0 0 0 0-17M232 128A104 104 0 1 1 128 24a8 8 0 0 1 8 8a40 40 0 0 0 40 40a8 8 0 0 1 8 8a40 40 0 0 0 40 40a8 8 0 0 1 8 8m-16.31 7.39A56.13 56.13 0 0 1 168.5 87.5a56.13 56.13 0 0 1-47.89-47.19a88 88 0 1 0 95.08 95.08"/></g></svg></span>
      <i class="ck__crumb ck__crumb--a" aria-hidden="true"></i>
      <i class="ck__crumb ck__crumb--b" aria-hidden="true"></i>
      <i class="ck__crumb ck__crumb--c" aria-hidden="true"></i>
    </div>
    <p class="ck__label">동의 완료<b class="ck__count">0</b></p>
    <button class="ck__btn" type="button">다시 보기</button>
  </div>
</main>
<script>
// 실제 동작: 버튼을 누르면 자동 루프를 끄고 한 번만 부서졌다 붙는다. 누른 횟수는 localStorage 에 남는다.
var ck = document.querySelector('.ck');
var ckIcon = ck.querySelector('.ck__icon');
var ckCount = ck.querySelector('.ck__count');
var ckN = 0;
try { ckN = parseInt(localStorage.getItem('gd-consent-07'), 10) || 0; } catch (e) {}
ckCount.textContent = String(ckN);

ckIcon.addEventListener('animationend', function () {
  ck.classList.remove('is-burst');
});

ck.querySelector('.ck__btn').addEventListener('click', function () {
  ck.classList.remove('is-demo');
  ck.classList.remove('is-burst');
  void ck.offsetWidth;            // 연타해도 다시 재생되게 리플로를 강제한다
  ck.classList.add('is-burst');
  ckN = ckN + 1;
  ckCount.textContent = String(ckN);
  try { localStorage.setItem('gd-consent-07', String(ckN)); } catch (e) {}
});
</script>
</body>
</html>
