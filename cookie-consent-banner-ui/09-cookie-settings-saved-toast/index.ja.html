<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings saved toast — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ts is-demo">
    <div class="ts__page" aria-hidden="true">
      <div class="ts__topbar"><i class="ts__dot"></i><i class="ts__slug"></i></div>
      <div class="ts__lines"><i></i><i></i><i></i></div>
    </div>
    <button class="ts__save" type="button">設定を保存</button>
    <div class="ts__toast" role="status" aria-live="polite">
      <span class="ts__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="18" height="18"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0M232 128A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></svg></span>
      <span class="ts__txt">
        <b class="ts__title">設定を保存しました</b>
        <span class="ts__sub">統計クッキーのみ許可</span>
      </span>
      <i class="ts__timer" aria-hidden="true"></i>
    </div>
  </div>
</main>
<script>
// 실제 동작: 保存 버튼이 토스트를 한 번 재생한다. 保存 횟수·마지막 시각은 localStorage 에 남아 둘째 줄에 붙는다.
var ts = document.querySelector('.ts');
var tsToast = ts.querySelector('.ts__toast');
var tsSub = ts.querySelector('.ts__sub');
var TS_TPL = '統計クッキーのみ許可 · {n}回 · {t}';
var tsN = 0;

try {
  var saved = JSON.parse(localStorage.getItem('gd-consent-09') || '{}');
  tsN = parseInt(saved.n, 10) || 0;
  if (tsN > 0 && saved.t) { tsSub.textContent = TS_TPL.replace('{n}', String(tsN)).replace('{t}', String(saved.t)); }
} catch (e) {}

tsToast.addEventListener('animationend', function (ev) {
  if (ev.target === tsToast) { tsToast.classList.remove('is-shot'); }
});

ts.querySelector('.ts__save').addEventListener('click', function () {
  ts.classList.remove('is-demo');
  tsN = tsN + 1;
  var now = new Date().toTimeString().slice(0, 5);
  tsSub.textContent = TS_TPL.replace('{n}', String(tsN)).replace('{t}', now);
  try { localStorage.setItem('gd-consent-09', JSON.stringify({ n: tsN, t: now })); } catch (e) {}
  tsToast.classList.remove('is-shot');
  void tsToast.offsetWidth;       // 연타해도 다시 재생되게 리플로를 강제한다
  tsToast.classList.add('is-shot');
});
</script>
</body>
</html>
