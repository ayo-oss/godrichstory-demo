<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equal pair buttons — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ep is-demo">
    <div class="ep__main">
      <b class="ep__title">쿠키를 사용할까요?</b>
      <p class="ep__desc">거부해도 사이트 이용에는 문제가 없습니다.</p>

      <div class="ep__pair">
        <button class="ep__btn ep__btn--reject" type="button">모두 거부</button>
        <button class="ep__btn ep__btn--accept" type="button">모두 허용</button>
      </div>

      <ul class="ep__items" hidden>
        <li><label class="ep__item"><input class="ep__check" type="checkbox" checked disabled><span class="ep__label">필수 기능</span></label></li>
        <li><label class="ep__item"><input class="ep__check" type="checkbox" checked><span class="ep__label">방문 통계</span></label></li>
        <li><label class="ep__item"><input class="ep__check" type="checkbox"><span class="ep__label">맞춤 광고</span></label></li>
      </ul>

      <button class="ep__link" type="button" aria-pressed="false">항목별로 고르기</button>
    </div>

    <p class="ep__done ep__done--reject" hidden>모두 거부를 저장했어요</p>
    <p class="ep__done ep__done--accept" hidden>모두 허용을 저장했어요</p>
  </div>
</main>
<script>
// 실제 동작: 거부·허용 어느 쪽이든 한 번에 끝난다. 결과 한 줄만 남기고 선택을 저장한다
var ep = document.querySelector('.ep');
var main = ep.querySelector('.ep__main');
var items = ep.querySelector('.ep__items');
var link = ep.querySelector('.ep__link');

function stop() {
  ep.classList.remove('is-demo');
}
function decide(v) {
  stop();
  main.hidden = true;
  ep.querySelector('.ep__done--' + v).hidden = false;
  try { localStorage.setItem('gd-consent-06', v); } catch (e) {}
}

ep.querySelector('.ep__btn--reject').addEventListener('click', function () { decide('reject'); });
ep.querySelector('.ep__btn--accept').addEventListener('click', function () { decide('accept'); });

link.addEventListener('click', function () {
  stop();
  var open = items.hidden;
  items.hidden = !open;
  link.setAttribute('aria-pressed', open ? 'true' : 'false');
});
</script>
</body>
</html>
