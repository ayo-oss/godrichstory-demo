<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll consent gate — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sg is-demo">
    <div class="sg__bar" aria-hidden="true"><i class="sg__fill"></i></div>
    <div class="sg__box">
      <div class="sg__track">
        <p>当サイトはサービスの提供に必要な必須クッキーを使用します。</p>
        <p>統計クッキーは訪問数と滞在時間を匿名で収集します。</p>
        <p>広告クッキーは使用せず、第三者に情報を販売することもありません。</p>
        <p>保存されたクッキーはブラウザの設定でいつでも削除できます。</p>
        <p>同意は12か月間有効で、フッターのリンクからいつでも変更できます。</p>
        <p>最後までスクロールすると下の同意ボタンが有効になります。</p>
      </div>
    </div>
    <button class="sg__btn" type="button" disabled>
      <span class="sg__face sg__face--off">同意して続ける</span>
      <span class="sg__face sg__face--on" aria-hidden="true">同意して続ける</span>
    </button>
  </div>
</main>
<script>
// 실제 동작: 약관 상자의 진짜 scrollTop 으로 진행률을 갱신하고, 끝에 닿아야 버튼이 켜진다.
var sg = document.querySelector('.sg');
var sgBox = sg.querySelector('.sg__box');
var sgBtn = sg.querySelector('.sg__btn');
var sgFaces = sg.querySelectorAll('.sg__face');
var SG_DONE = '同意済み';

function sgSetLabel(t) {
  for (var i = 0; i < sgFaces.length; i++) { sgFaces[i].textContent = t; }
}
function sgReady() {
  if (!sgBtn.disabled) { return; }
  sgBtn.disabled = false;
  sg.classList.add('is-ready');
}
sgBox.addEventListener('scroll', function () {
  sg.classList.remove('is-demo');          // 사람이 스크롤하면 자동 루프를 끈다
  var max = sgBox.scrollHeight - sgBox.clientHeight;
  var p = max > 0 ? sgBox.scrollTop / max : 1;
  sg.style.setProperty('--p', String(p < 1 ? p : 1));
  if (sgBox.scrollTop + sgBox.clientHeight >= sgBox.scrollHeight - 4) { sgReady(); }
});

sgBtn.addEventListener('click', function () {
  sg.classList.remove('is-demo');
  sgSetLabel(SG_DONE);
  try { localStorage.setItem('gd-consent-08', '1'); } catch (e) {}
});
</script>
</body>
</html>
