<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll consent gate — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sg is-demo">
    <div class="sg__bar" aria-hidden="true"><i class="sg__fill"></i></div>
    <div class="sg__box">
      <div class="sg__track">
        <p>이 사이트는 서비스에 꼭 필요한 필수 쿠키를 사용합니다.</p>
        <p>통계 쿠키는 방문 수와 머문 시간을 익명으로 모읍니다.</p>
        <p>광고 쿠키는 쓰지 않으며, 어떤 정보도 제3자에게 팔지 않습니다.</p>
        <p>저장된 쿠키는 브라우저 설정에서 언제든 지울 수 있습니다.</p>
        <p>동의는 12개월 동안 유지되고, 화면 아래 링크에서 다시 바꿉니다.</p>
        <p>여기까지 내려 읽으면 아래 동의 버튼이 켜집니다.</p>
      </div>
    </div>
    <button class="sg__btn" type="button" disabled>
      <span class="sg__face sg__face--off">동의하고 계속</span>
      <span class="sg__face sg__face--on" aria-hidden="true">동의하고 계속</span>
    </button>
  </div>
</main>
<script>
// 실제 동작: 약관 상자의 진짜 scrollTop 으로 진행률을 갱신하고, 끝에 닿아야 버튼이 켜진다.
var sg = document.querySelector('.sg');
var sgBox = sg.querySelector('.sg__box');
var sgBtn = sg.querySelector('.sg__btn');
var sgFaces = sg.querySelectorAll('.sg__face');
var SG_DONE = '동의함';

function sgSetLabel(t) {
  for (var i = 0; i < sgFaces.length; i++) { sgFaces[i].textContent = t; }
}
function sgReady() {
  if (!sgBtn.disabled) { return; }
  sgBtn.disabled = false;
  sg.classList.add('is-ready');
}
sgBox.addEventListener('scroll', function () {
  sg.classList.remove('is-demo');          // 사람이 스크롤하면 자동 루프를 끈다
  var max = sgBox.scrollHeight - sgBox.clientHeight;
  var p = max > 0 ? sgBox.scrollTop / max : 1;
  sg.style.setProperty('--p', String(p < 1 ? p : 1));
  if (sgBox.scrollTop + sgBox.clientHeight >= sgBox.scrollHeight - 4) { sgReady(); }
});

sgBtn.addEventListener('click', function () {
  sg.classList.remove('is-demo');
  sgSetLabel(SG_DONE);
  try { localStorage.setItem('gd-consent-08', '1'); } catch (e) {}
});
</script>
</body>
</html>
