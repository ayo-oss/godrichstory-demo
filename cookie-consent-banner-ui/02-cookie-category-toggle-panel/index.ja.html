<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Category toggle panel — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ct is-demo">
    <h2 class="ct__head">Cookie設定</h2>

    <div class="ct__row" data-k="need">
      <span class="ct__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="16" height="16"><g fill="currentColor"><path d="M216 56v56c0 96-88 120-88 120s-88-24-88-120V56a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 40H48a16 16 0 0 0-16 16v56c0 52.72 25.52 84.67 46.93 102.19c23.06 18.86 46 25.26 47 25.53a8 8 0 0 0 4.2 0c1-.27 23.91-6.67 47-25.53C198.48 196.67 224 164.72 224 112V56a16 16 0 0 0-16-16m0 72c0 37.07-13.66 67.16-40.6 89.42a129.3 129.3 0 0 1-39.4 22.2a128.3 128.3 0 0 1-38.92-21.81C61.82 179.51 48 149.3 48 112V56h160ZM82.34 141.66a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 11.32l-56 56a8 8 0 0 1-11.32 0Z"/></g></svg></span>
      <button class="ct__name" type="button" aria-expanded="false" aria-controls="ct-p1">
        <span class="ct__label">必須</span>
        <span class="ct__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></span>
      </button>
      <button class="ct__sw ct__sw--fixed is-on" type="button" role="switch" aria-checked="true" aria-disabled="true" aria-label="必須Cookie"><span class="ct__knob"></span></button>
      <div class="ct__panel" id="ct-p1"><div class="ct__inner"><p class="ct__desc">サイトの表示に必ず必要です。</p></div></div>
    </div>

    <div class="ct__row ct__row--stats" data-k="stats">
      <span class="ct__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="16" height="16"><g fill="currentColor"><path d="M208 40v168h-56V40Z" opacity=".2"/><path d="M224 200h-8V40a8 8 0 0 0-8-8h-56a8 8 0 0 0-8 8v40H96a8 8 0 0 0-8 8v40H48a8 8 0 0 0-8 8v64h-8a8 8 0 0 0 0 16h192a8 8 0 0 0 0-16M160 48h40v152h-40Zm-56 48h40v104h-40Zm-48 48h32v56H56Z"/></g></svg></span>
      <button class="ct__name" type="button" aria-expanded="false" aria-controls="ct-p2">
        <span class="ct__label">分析</span>
        <span class="ct__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></span>
      </button>
      <button class="ct__sw is-on" type="button" role="switch" aria-checked="true" aria-label="分析Cookie"><span class="ct__knob"></span></button>
      <div class="ct__panel" id="ct-p2"><div class="ct__inner"><p class="ct__desc">どの記事をどこまで読んだかを集計します。</p></div></div>
    </div>

    <div class="ct__row ct__row--ads" data-k="ads">
      <span class="ct__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="16" height="16"><g fill="currentColor"><path d="M240 120a40 40 0 0 1-40 40h-40V80h40a40 40 0 0 1 40 40" opacity=".2"/><path d="M248 120a48.05 48.05 0 0 0-48-48h-39.8c-2.91-.17-53.62-3.74-101.91-44.24A16 16 0 0 0 32 40v160a16 16 0 0 0 26.29 12.25c37.77-31.68 77-40.76 93.71-43.3v31.72a16 16 0 0 0 7.12 13.33l11 7.33A16 16 0 0 0 194.5 212l11.77-44.36A48.07 48.07 0 0 0 248 120M48 199.93V40c42.81 35.91 86.63 45 104 47.24v65.48c-17.35 2.28-61.16 11.35-104 47.21m131 8v.11l-11-7.33V168h21.6ZM200 152h-32V88h32a32 32 0 1 1 0 64"/></g></svg></span>
      <button class="ct__name" type="button" aria-expanded="false" aria-controls="ct-p3">
        <span class="ct__label">広告</span>
        <span class="ct__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></span>
      </button>
      <button class="ct__sw" type="button" role="switch" aria-checked="false" aria-label="広告Cookie"><span class="ct__knob"></span></button>
      <div class="ct__panel" id="ct-p3"><div class="ct__inner"><p class="ct__desc">興味に合わせた広告を表示します。</p></div></div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 스위치는 role="switch" 로 진짜 토글되고, 행 제목은 aria-expanded 로 설명을 편다.
// 필수는 항상 켬이라 눌러도 바뀌지 않는다. 선택은 localStorage 에 남는다.
var ct = document.querySelector('.ct');
var KEY = 'gd-consent-02';
var state = { stats: true, ads: false };

function read() {
  try { var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function write() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
function paint() {
  var rows = ct.querySelectorAll('.ct__row');
  for (var i = 0; i < rows.length; i++) {
    var k = rows[i].getAttribute('data-k');
    if (k === 'need') continue;
    var on = !!state[k];
    var sw = rows[i].querySelector('.ct__sw');
    sw.setAttribute('aria-checked', on ? 'true' : 'false');
    sw.classList.toggle('is-on', on);
  }
}
function stop() { ct.classList.remove('is-demo'); }

var sws = ct.querySelectorAll('.ct__sw');
for (var i = 0; i < sws.length; i++) {
  sws[i].addEventListener('click', function (e) {
    stop();
    var k = e.currentTarget.closest('.ct__row').getAttribute('data-k');
    if (k === 'need') return;
    state[k] = !state[k];
    paint();
    write();
  });
}

var names = ct.querySelectorAll('.ct__name');
for (var j = 0; j < names.length; j++) {
  names[j].addEventListener('click', function (e) {
    stop();
    var b = e.currentTarget;
    var open = b.getAttribute('aria-expanded') === 'true';
    b.setAttribute('aria-expanded', open ? 'false' : 'true');
    b.closest('.ct__row').classList.toggle('is-open', !open);
  });
}

var saved = read();
if (saved) { state.stats = !!saved.stats; state.ads = !!saved.ads; }
paint();
</script>
</body>
</html>
