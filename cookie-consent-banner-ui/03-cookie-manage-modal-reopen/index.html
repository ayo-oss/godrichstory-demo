<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage modal reopen — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="mo is-demo">
    <div class="mo__page" aria-hidden="true">
      <div class="mo__topbar">
        <span class="mo__brand"></span>
        <span class="mo__nav"></span>
        <span class="mo__nav"></span>
      </div>
      <div class="mo__lines">
        <span class="mo__line mo__line--head"></span>
        <span class="mo__line"></span>
        <span class="mo__line"></span>
        <span class="mo__line mo__line--short"></span>
      </div>
    </div>

    <button class="mo__reopen" type="button" aria-label="쿠키 설정 열기"><svg viewBox="0 0 256 256" width="20" height="20"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a48 48 0 0 0 48 48a48 48 0 0 0 48 48" opacity=".2"/><path d="M164.49 163.51a12 12 0 1 1-17 0a12 12 0 0 1 17 0m-81-8a12 12 0 1 0 17 0a12 12 0 0 0-16.98 0Zm9-39a12 12 0 1 0-17 0a12 12 0 0 0 17-.02Zm48-1a12 12 0 1 0 0 17a12 12 0 0 0 0-17M232 128A104 104 0 1 1 128 24a8 8 0 0 1 8 8a40 40 0 0 0 40 40a8 8 0 0 1 8 8a40 40 0 0 0 40 40a8 8 0 0 1 8 8m-16.31 7.39A56.13 56.13 0 0 1 168.5 87.5a56.13 56.13 0 0 1-47.89-47.19a88 88 0 1 0 95.08 95.08"/></g></svg></button>

    <div class="mo__backdrop"></div>

    <div class="mo__wrap">
      <div class="mo__modal" role="dialog" aria-modal="true" aria-label="쿠키 설정 관리">
        <button class="mo__x" type="button" data-a="close" aria-label="닫기"><svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="M216 56v144a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h144a16 16 0 0 1 16 16" opacity=".2"/><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg></button>
        <h2 class="mo__title">쿠키 설정 관리</h2>
        <p class="mo__desc">언제든 다시 열어 바꿀 수 있습니다</p>
        <div class="mo__acts">
          <button class="mo__btn mo__btn--ok" type="button" data-a="save">저장</button>
          <button class="mo__btn" type="button" data-a="close">닫기</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 재열기 버튼으로 모달을 열고, x·닫기·백드롭·Esc 로 닫는다.
// 열 때는 모달 안 첫 버튼으로, 닫을 때는 재열기 버튼으로 포커스를 돌려준다.
var mo = document.querySelector('.mo');
var modal = mo.querySelector('.mo__modal');
var reopen = mo.querySelector('.mo__reopen');
var KEY = 'gd-consent-03';

function stop() { mo.classList.remove('is-demo'); }
function show() {
  stop();
  mo.classList.add('is-open');
  var first = modal.querySelector('button');
  if (first) first.focus({ preventScroll: true });
}
function hide() {
  stop();
  mo.classList.remove('is-open');
  reopen.focus({ preventScroll: true });
}
function keep() {
  try { localStorage.setItem(KEY, new Date().toISOString()); } catch (e) {}
  hide();
}

reopen.addEventListener('click', show);
mo.querySelector('.mo__backdrop').addEventListener('click', hide);

var acts = mo.querySelectorAll('[data-a]');
for (var i = 0; i < acts.length; i++) {
  acts[i].addEventListener('click', function (e) {
    if (e.currentTarget.getAttribute('data-a') === 'save') { keep(); } else { hide(); }
  });
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && mo.classList.contains('is-open')) hide();
});
</script>
</body>
</html>
