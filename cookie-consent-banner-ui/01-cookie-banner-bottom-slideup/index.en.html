<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottom bar slide up — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cb is-demo">
    <div class="cb__page" aria-hidden="true">
      <div class="cb__topbar">
        <span class="cb__brand"></span>
        <span class="cb__nav"></span>
        <span class="cb__nav"></span>
      </div>
      <div class="cb__lines">
        <span class="cb__line cb__line--head"></span>
        <span class="cb__line"></span>
        <span class="cb__line"></span>
        <span class="cb__line cb__line--short"></span>
      </div>
    </div>

    <p class="cb__chip" hidden><span class="cb__chip-k">Saved</span><b class="cb__chip-v"></b></p>

    <section class="cb__banner" aria-label="Cookie consent">
      <span class="cb__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="20" height="20"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a48 48 0 0 0 48 48a48 48 0 0 0 48 48" opacity=".2"/><path d="M164.49 163.51a12 12 0 1 1-17 0a12 12 0 0 1 17 0m-81-8a12 12 0 1 0 17 0a12 12 0 0 0-16.98 0Zm9-39a12 12 0 1 0-17 0a12 12 0 0 0 17-.02Zm48-1a12 12 0 1 0 0 17a12 12 0 0 0 0-17M232 128A104 104 0 1 1 128 24a8 8 0 0 1 8 8a40 40 0 0 0 40 40a8 8 0 0 1 8 8a40 40 0 0 0 40 40a8 8 0 0 1 8 8m-16.31 7.39A56.13 56.13 0 0 1 168.5 87.5a56.13 56.13 0 0 1-47.89-47.19a88 88 0 1 0 95.08 95.08"/></g></svg></span>
      <div class="cb__text">
        <strong class="cb__title">This site uses cookies</strong>
        <span class="cb__desc">Analytics and personalization</span>
      </div>
      <div class="cb__acts">
        <button class="cb__btn" type="button" data-v="min">Necessary only</button>
        <button class="cb__btn cb__btn--ok" type="button" data-v="all">Accept all</button>
      </div>
    </section>
  </div>
</main>
<script>
// 실제 동작: 버튼을 누르면 배너가 아래로 빠지고 고른 값이 localStorage 에 남는다.
// 칩 글자는 누른 버튼의 라벨을 그대로 복사한다 — 스크립트 안에 문구를 두 번 적지 않는다.
var cb = document.querySelector('.cb');
var chip = cb.querySelector('.cb__chip');
var chipV = cb.querySelector('.cb__chip-v');
var banner = cb.querySelector('.cb__banner');
var KEY = 'gd-consent-01';

function load() {
  try { return localStorage.getItem(KEY); } catch (e) { return null; }
}
function save(v) {
  try { localStorage.setItem(KEY, v); } catch (e) {}
}
function mark(v) {
  var b = cb.querySelector('.cb__btn[data-v="' + v + '"]');
  if (!b) return;
  chipV.textContent = b.textContent;
  chip.hidden = false;
}
function pick(e) {
  var v = e.currentTarget.getAttribute('data-v');
  save(v);
  cb.classList.remove('is-demo');
  banner.classList.add('is-out');
  mark(v);
}

var btns = cb.querySelectorAll('.cb__btn');
for (var i = 0; i < btns.length; i++) btns[i].addEventListener('click', pick);

// 저장값이 있어도 배너는 다시 띄운다(루프가 필요하다) — 대신 이전 선택을 칩으로 보여준다
var saved = load();
if (saved) mark(saved);
</script>
</body>
</html>
