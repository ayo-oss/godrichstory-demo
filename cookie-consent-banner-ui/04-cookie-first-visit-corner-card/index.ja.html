<html lang="ja">

<body>
<main class="stage">

      <i class="fv__line"></i>

        <b class="fv__title">プライバシーとCookie</b>
      </div>

      <ul class="fv__list">
        <li class="fv__row fv__row--a">
          <span class="fv__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="12" height="12"><g fill="currentColor"><path d="m230.1 108.76l-31.85-18.14c-.64-1.16-1.31-2.29-2-3.41l-.12-36A104.6 104.6 0 0 0 162 32l-32 17.89h-4L94 32a104.6 104.6 0 0 0-34.11 19.25l-.16 36c-.7 1.12-1.37 2.26-2 3.41l-31.84 18.1a99.2 99.2 0 0 0 0 38.46l31.85 18.14c.64 1.16 1.31 2.29 2 3.41l.12 36A104.6 104.6 0 0 0 94 224l32-17.87h4L162 224a104.6 104.6 0 0 0 34.08-19.25l.16-36c.7-1.12 1.37-2.26 2-3.41l31.84-18.1a99.2 99.2 0 0 0 .02-38.48M128 168a40 40 0 1 1 40-40a40 40 0 0 1-40 40" opacity=".2"/><path d="M128 80a48 48 0 1 0 48 48a48.05 48.05 0 0 0-48-48m0 80a32 32 0 1 1 32-32a32 32 0 0 1-32 32m109.94-52.79a8 8 0 0 0-3.89-5.4l-29.83-17l-.12-33.62a8 8 0 0 0-2.83-6.08a111.9 111.9 0 0 0-36.72-20.67a8 8 0 0 0-6.46.59L128 41.85L97.88 25a8 8 0 0 0-6.47-.6a111.9 111.9 0 0 0-36.68 20.75a8 8 0 0 0-2.83 6.07l-.15 33.65l-29.83 17a8 8 0 0 0-3.89 5.4a106.5 106.5 0 0 0 0 41.56a8 8 0 0 0 3.89 5.4l29.83 17l.12 33.63a8 8 0 0 0 2.83 6.08a111.9 111.9 0 0 0 36.72 20.67a8 8 0 0 0 6.46-.59L128 214.15L158.12 231a7.9 7.9 0 0 0 3.9 1a8.1 8.1 0 0 0 2.57-.42a112.1 112.1 0 0 0 36.68-20.73a8 8 0 0 0 2.83-6.07l.15-33.65l29.83-17a8 8 0 0 0 3.89-5.4a106.5 106.5 0 0 0-.03-41.52m-15 34.91l-28.57 16.25a8 8 0 0 0-3 3c-.58 1-1.19 2.06-1.81 3.06a7.94 7.94 0 0 0-1.22 4.21l-.15 32.25a95.9 95.9 0 0 1-25.37 14.3L134 199.13a8 8 0 0 0-3.91-1h-3.83a8.1 8.1 0 0 0-4.1 1l-28.84 16.1A96 96 0 0 1 67.88 201l-.11-32.2a8 8 0 0 0-1.22-4.22c-.62-1-1.23-2-1.8-3.06a8.1 8.1 0 0 0-3-3.06l-28.6-16.29a90.5 90.5 0 0 1 0-28.26l28.52-16.28a8 8 0 0 0 3-3c.58-1 1.19-2.06 1.81-3.06a7.94 7.94 0 0 0 1.22-4.21l.15-32.25a95.9 95.9 0 0 1 25.37-14.3L122 56.87a8 8 0 0 0 4.1 1h3.64a8 8 0 0 0 4.1-1l28.84-16.1A96 96 0 0 1 188.12 55l.11 32.2a8 8 0 0 0 1.22 4.22c.62 1 1.23 2 1.8 3.06a8.1 8.1 0 0 0 3 3.06l28.6 16.29a90.5 90.5 0 0 1 .05 28.29Z"/></g></svg></span>
          <span class="fv__label">サイト機能の維持</span>
        </li>
        <li class="fv__row fv__row--b">
          <span class="fv__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="12" height="12"><g fill="currentColor"><path d="M208 40v168h-56V40Z" opacity=".2"/><path d="M224 200h-8V40a8 8 0 0 0-8-8h-56a8 8 0 0 0-8 8v40H96a8 8 0 0 0-8 8v40H48a8 8 0 0 0-8 8v64h-8a8 8 0 0 0 0 16h192a8 8 0 0 0 0-16M160 48h40v152h-40Zm-56 48h40v104h-40Zm-48 48h32v56H56Z"/></g></svg></span>
          <span class="fv__label">アクセス解析</span>
        </li>
        <li class="fv__row fv__row--c">
          <span class="fv__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="12" height="12"><g fill="currentColor"><path d="M240 120a40 40 0 0 1-40 40h-40V80h40a40 40 0 0 1 40 40" opacity=".2"/><path d="M248 120a48.05 48.05 0 0 0-48-48h-39.8c-2.91-.17-53.62-3.74-101.91-44.24A16 16 0 0 0 32 40v160a16 16 0 0 0 26.29 12.25c37.77-31.68 77-40.76 93.71-43.3v31.72a16 16 0 0 0 7.12 13.33l11 7.33A16 16 0 0 0 194.5 212l11.77-44.36A48.07 48.07 0 0 0 248 120M48 199.93V40c42.81 35.91 86.63 45 104 47.24v65.48c-17.35 2.28-61.16 11.35-104 47.21m131 8v.11l-11-7.33V168h21.6ZM200 152h-32V88h32a32 32 0 1 1 0 64"/></g></svg></span>
          <span class="fv__label">パーソナライズ広告</span>
        </li>
      </ul>

      <ul class="fv__prefs" hidden>
        <li><label class="fv__row"><input class="fv__check" type="checkbox" checked disabled><span class="fv__label">サイト機能の維持</span></label></li>
        <li><label class="fv__row"><input class="fv__check" type="checkbox" checked><span class="fv__label">アクセス解析</span></label></li>
        <li><label class="fv__row"><input class="fv__check" type="checkbox"><span class="fv__label">パーソナライズ広告</span></label></li>
      </ul>

      <div class="fv__btns">
        <button class="fv__btn fv__more" type="button" aria-expanded="false">設定</button>
        <button class="fv__btn fv__btn--primary fv__accept" type="button">同意する</button>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 동의하면 카드가 같은 경로로 빠져나가고, 설정은 같은 카드 안에서 목적 줄을 체크박스 줄로 바꾼다
var card = document.querySelector('.fv__card');
var list = document.querySelector('.fv__list');
var prefs = document.querySelector('.fv__prefs');
var more = document.querySelector('.fv__more');

function save(v) {
  try { localStorage.setItem('gd-consent-04', v); } catch (e) {}
}
function stop() {
  card.classList.remove('is-demo');
}

document.querySelector('.fv__accept').addEventListener('click', function () {
  stop();
  card.classList.add('is-gone');
  save(prefs.hidden ? 'all' : 'custom');
});

more.addEventListener('click', function () {
  stop();
  var open = prefs.hidden;
  prefs.hidden = !open;
  list.hidden = open;
  more.setAttribute('aria-expanded', open ? 'true' : 'false');
});
</script>
</body>
</html>
