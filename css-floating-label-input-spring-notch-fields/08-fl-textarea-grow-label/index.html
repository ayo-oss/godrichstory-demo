<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>줄 수에 따라 부드럽게 자라고 라벨은 칸 위쪽에 떠 있는 텍스트 영역 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="fl is-demo" id="fl" data-demo="1">
    <div class="fl__field">
      <div class="fl__box" data-r="box">
        <input class="fl__input" id="f1" data-r="input" type="text" autocomplete="name">
        <label class="fl__label" for="f1" data-r="label">이름</label>
      </div>
    </div>
    <div class="fl__field">
      <div class="fl__box" data-r="box">
        <textarea class="fl__input fl__area" id="f2" data-r="input" rows="1" autocomplete="off"></textarea>
        <label class="fl__label" for="f2" data-r="label">메시지</label>
      </div>
    </div>
  </div>
</main>
<script>
(function () {
    const root = document.getElementById("fl");
    const CLS = {};
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let demo = !reduce;
    let raf = 0;
    let last = -1;
    const offs = [];
    function q(sel) {
        return root.querySelector(sel);
    }
    function qa(sel) {
        const list = Array.prototype.slice.call(root.querySelectorAll(sel));
        return list;
    }
    function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
    }
    function on(el, type, fn) {
        el.addEventListener(type, fn);
        offs.push(function () {
            el.removeEventListener(type, fn);
        });
    }
    // 좌표 해시: 같은 입력이면 같은 값 0~1. 난수 함수를 쓰지 않고 사인의 소수부만 쓴다.
    function hash(x) {
        const s = Math.sin(x * 127.1 + 311.7) * 43758.5453;
        return s - Math.floor(s);
    }
    // 지수 접근: 프레임당 비율 per 만큼 목표에 다가간다. f 는 60fps 기준 프레임 수(dt * 60)라 프레임률이 달라도 같은 속도다.
    function approach(x, target, per, f) {
        return x + (target - x) * (1 - Math.pow(1 - per, f));
    }
    // 스프링 한 칸: 가속도 = -k (x - 목표) - c v. 반암시적 오일러를 1/120초 이하 부분 스텝으로 쪼갠다.
    function springStep(s, target, k, c, dt) {
        let left = dt;
        while (left > 0) {
            const h = Math.min(left, 1 / 120);
            s.v += (-k * (s.x - target) - c * s.v) * h;
            s.x += s.v * h;
            left -= h;
        }
    }
    // 값이 있으면 라벨은 올라가 있어야 한다. 브라우저 자동완성이 값을 채우면 input 이벤트가 없을 수 있어 :autofill 도 함께 본다.
    function isFilled(el) {
        if (el.value !== "") return true;
        try {
            return el.matches(":-webkit-autofill");
        } catch (err) {
            return false;
        }
    }
    let leaveHook = null;
    function stopDemo() {
        if (!demo) return;
        demo = false;
        root.removeAttribute("data-demo");
        root.classList.remove("is-demo");
        resetFields();
    }
    function frame(ts) {
        const dt = last < 0 ? 0.016 : Math.min(0.05, (ts - last) / 1000);
        last = ts;
        if (demo) script(ts);
        step(dt, ts);
        render();
        raf = requestAnimationFrame(frame);
    }
    const ro = new ResizeObserver(function () {
        relayout();
    });
    ro.observe(root);
    if (document.fonts) {
        document.fonts.ready.then(function () {
            relayout();
        });
    }

    // 시연 계획: 칸마다 포커스 구간(a~b), 타이핑 시작(s)·글자당 ms(rate)·글. 2초 주기로 되풀이하고 주기 첫머리엔 모두 비운다.
    function runPlan(ts) {
        const t = ts % 2000;
        let changed = false;
        for (let i = 0; i < PLAN.length; i += 1) {
            const p = PLAN[i];
            const f = fields[i];
            const isOn = t >= p.a && t < p.b;
            const n = t < p.s ? 0 : Math.min(p.text.length, Math.floor((t - p.s) / p.rate) + 1);
            const v = p.text.slice(0, n);
            if (f.input.value !== v) {
                f.input.value = v;
                changed = true;
            }
            if (f.focus !== isOn) {
                f.focus = isOn;
                changed = true;
                if (!isOn && leaveHook) leaveHook(i);
            }
        }
        if (changed) retarget();
    }
    function resetFields() {
        for (let i = 0; i < fields.length; i += 1) {
            fields[i].input.value = "";
            fields[i].focus = false;
        }
        retarget();
    }
    function wire() {
        fields.forEach(function (f, i) {
            on(f.input, "focus", function () {
                stopDemo();
                f.focus = true;
                retarget();
            });
            on(f.input, "blur", function () {
                f.focus = false;
                if (leaveHook) leaveHook(i);
                retarget();
            });
            on(f.input, "input", function () {
                retarget();
            });
        });
    }

    // 기법: scrollHeight 로 글이 차지할 목표 높이를 재고, 칸의 실제 높이가 그 값으로 지수 접근한다. 줄이 늘 때 한 번에 튀지 않는다.
    const MAX_ROWS = 4;
    const GROW_LERP = 0.16;
    const LINE_H = 24;
    const PAD_TOP = 24;
    const PAD_BOTTOM = 4;
    const MIN_H = 52;
    const RISE_PX = 15;
    const LABEL_SCALE = 0.74;
    const fields = qa("[data-r=box]").map(function (box) {
        const input = box.querySelector("textarea") || box.querySelector("input");
        const grow = input !== null && input.tagName === "TEXTAREA";
        if (input === null) throw new Error("input missing");
        if (grow) {
            input.style.lineHeight = LINE_H + "px";
            input.style.paddingTop = PAD_TOP + "px";
            input.style.paddingBottom = PAD_BOTTOM + "px";
        }
        return {
            box: box,
            input: input,
            label: box.querySelector("label"),
            focus: false, up: false, p: 0, h: MIN_H, th: MIN_H, grow: grow
        };
    });
    const PLAN = [
        { a: 200, b: 560, s: 250, rate: 60, text: "Mina" },
        { a: 560, b: 1990, s: 640, rate: 26, text: "Hi! Could we move\nthe call to Friday\nafternoon? Thanks\nMina" }
    ];
    // 글을 끝까지 담는 데 필요한 높이: 높이를 0 으로 눌러 scrollHeight 를 읽는다. 입력이 있을 때와 칸 폭이 바뀔 때만 부른다.
    function wanted(f) {
        if (!f.grow) return MIN_H;
        const ta = f.input;
        ta.style.height = "0px";
        const need = ta.scrollHeight;
        ta.style.height = "";
        const cap = PAD_TOP + PAD_BOTTOM + MAX_ROWS * LINE_H;
        ta.style.overflowY = need > cap ? "auto" : "hidden";
        return clamp(need, MIN_H, cap);
    }
    function retarget() {
        fields.forEach(function (f) {
            f.up = f.focus || isFilled(f.input);
            if (f.up) f.box.setAttribute("data-up", "");
            else f.box.removeAttribute("data-up");
            f.th = wanted(f);
            if (reduce) {
                f.p = f.up ? 1 : 0;
                f.h = f.th;
            }
        });
        if (reduce) render();
    }
    function relayout() {
        retarget();
    }
    function script(ts) {
        runPlan(ts);
    }
    function step(dt, ts) {
        const fr = dt * 60;
        fields.forEach(function (f) {
            f.p = approach(f.p, f.up ? 1 : 0, 0.22, fr);
            f.h = approach(f.h, f.th, GROW_LERP, fr);
        });
    }
    function render() {
        fields.forEach(function (f) {
            const s = 1 - (1 - LABEL_SCALE) * f.p;
            f.label.style.transform = "translate3d(0," + (-RISE_PX * f.p).toFixed(2) + "px,0) scale(" + s.toFixed(3) + ")";
            f.box.style.setProperty("--p", f.p.toFixed(3));
            if (f.grow) f.box.style.height = f.h.toFixed(1) + "px";
        });
    }
    wire();

    relayout();
    if (reduce) {
        render();
    } else {
        raf = requestAnimationFrame(frame);
    }

})();
</script>
</body>
</html>
