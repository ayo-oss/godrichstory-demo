<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>셰브런이 스프링으로 돌고 선택하면 라벨이 올라가는 셀렉트 칸 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="fl is-demo" id="fl" data-demo="1">
    <div class="fl__field">
      <div class="fl__box" data-r="box">
        <button class="fl__input fl__select" id="c1" data-r="btn" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="m1">
          <span class="fl__val" data-r="val"></span>
        </button>
        <label class="fl__label" for="c1" id="l1" data-r="label">도시</label>
        <svg class="fl__chev" data-r="chev" aria-hidden="true" width="24" height="24" viewBox="0 0 256 256"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg>
        <ul class="fl__menu" id="m1" role="listbox" aria-labelledby="l1" data-r="menu">
          <li class="fl__opt" role="option" id="m1o0" data-r="opt" aria-selected="false">서울</li>
          <li class="fl__opt" role="option" id="m1o1" data-r="opt" aria-selected="false">부산</li>
          <li class="fl__opt" role="option" id="m1o2" data-r="opt" aria-selected="false">제주</li>
        </ul>
      </div>
    </div>
    <div class="fl__field">
      <div class="fl__box" data-r="box">
        <button class="fl__input fl__select" id="c2" data-r="btn" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="m2">
          <span class="fl__val" data-r="val"></span>
        </button>
        <label class="fl__label" for="c2" id="l2" data-r="label">요일</label>
        <svg class="fl__chev" data-r="chev" aria-hidden="true" width="24" height="24" viewBox="0 0 256 256"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg>
        <ul class="fl__menu fl__menu--up" id="m2" role="listbox" aria-labelledby="l2" data-r="menu">
          <li class="fl__opt" role="option" id="m2o0" data-r="opt" aria-selected="false">월요일</li>
          <li class="fl__opt" role="option" id="m2o1" data-r="opt" aria-selected="false">수요일</li>
          <li class="fl__opt" role="option" id="m2o2" data-r="opt" aria-selected="false">금요일</li>
        </ul>
      </div>
    </div>
  </div>
</main>
<script>
(function () {
    const root = document.getElementById("fl");
    const CLS = {};
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let demo = !reduce;
    let raf = 0;
    let last = -1;
    const offs = [];
    function q(sel) {
        return root.querySelector(sel);
    }
    function qa(sel) {
        const list = Array.prototype.slice.call(root.querySelectorAll(sel));
        return list;
    }
    function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
    }
    function on(el, type, fn) {
        el.addEventListener(type, fn);
        offs.push(function () {
            el.removeEventListener(type, fn);
        });
    }
    // 좌표 해시: 같은 입력이면 같은 값 0~1. 난수 함수를 쓰지 않고 사인의 소수부만 쓴다.
    function hash(x) {
        const s = Math.sin(x * 127.1 + 311.7) * 43758.5453;
        return s - Math.floor(s);
    }
    // 지수 접근: 프레임당 비율 per 만큼 목표에 다가간다. f 는 60fps 기준 프레임 수(dt * 60)라 프레임률이 달라도 같은 속도다.
    function approach(x, target, per, f) {
        return x + (target - x) * (1 - Math.pow(1 - per, f));
    }
    // 스프링 한 칸: 가속도 = -k (x - 목표) - c v. 반암시적 오일러를 1/120초 이하 부분 스텝으로 쪼갠다.
    function springStep(s, target, k, c, dt) {
        let left = dt;
        while (left > 0) {
            const h = Math.min(left, 1 / 120);
            s.v += (-k * (s.x - target) - c * s.v) * h;
            s.x += s.v * h;
            left -= h;
        }
    }
    // 값이 있으면 라벨은 올라가 있어야 한다. 브라우저 자동완성이 값을 채우면 input 이벤트가 없을 수 있어 :autofill 도 함께 본다.
    function isFilled(el) {
        if (el.value !== "") return true;
        try {
            return el.matches(":-webkit-autofill");
        } catch (err) {
            return false;
        }
    }
    let leaveHook = null;
    function stopDemo() {
        if (!demo) return;
        demo = false;
        root.removeAttribute("data-demo");
        root.classList.remove("is-demo");
        resetFields();
    }
    function frame(ts) {
        const dt = last < 0 ? 0.016 : Math.min(0.05, (ts - last) / 1000);
        last = ts;
        if (demo) script(ts);
        step(dt, ts);
        render();
        raf = requestAnimationFrame(frame);
    }
    const ro = new ResizeObserver(function () {
        relayout();
    });
    ro.observe(root);
    if (document.fonts) {
        document.fonts.ready.then(function () {
            relayout();
        });
    }

    // 기법: 열림 정도 x 하나를 스프링으로 돌리고, 쉐브론 각도·목록 높이·라벨 상승을 전부 그 x 에서 파생한다. 값이 하나라 셋이 어긋날 수 없다.
    const CHEV_STIFF = 160;
    const CHEV_DAMP = 13;
    const OPEN_DEG = 180;
    const PICK_DELAY = 220;
    const OPT_H = 36;
    const MENU_PAD = 4;
    const RISE_PX = 15;
    const LABEL_SCALE = 0.74;
    const fields = qa("[data-r=box]").map(function (box) {
        const menu = box.querySelector("[data-r=menu]");
        const opts = Array.prototype.slice.call(menu.querySelectorAll("[data-r=opt]"));
        return {
            box: box,
            btn: box.querySelector("[data-r=btn]"),
            val: box.querySelector("[data-r=val]"),
            label: box.querySelector("[data-r=label]"),
            chev: box.querySelector("[data-r=chev]"),
            menu: menu, opts: opts,
            open: false, hi: 0, sel: -1, sp: { x: 0, v: 0 }, closeIn: 0
        };
    });
    // 이벤트 표: [시각(ms), 칸, 동작, 값]. 2초 주기로 되풀이한다.
    const EVENTS = [
        [200, 0, "open", 0],
        [480, 0, "hi", 1],
        [720, 0, "hi", 2],
        [980, 0, "pick", 2],
        [1250, 1, "open", 0],
        [1500, 1, "hi", 1],
        [1720, 1, "pick", 1]
    ];
    let lastT = -1;
    function syncAria(f) {
        f.btn.setAttribute("aria-expanded", String(f.open));
        if (f.open) {
            f.btn.setAttribute("aria-activedescendant", f.opts[f.hi].id);
            f.box.setAttribute("data-open", "");
        } else {
            f.btn.removeAttribute("aria-activedescendant");
            f.box.removeAttribute("data-open");
        }
        f.opts.forEach(function (o, i) {
            if (i === f.hi && f.open) o.setAttribute("data-hi", "");
            else o.removeAttribute("data-hi");
            o.setAttribute("aria-selected", String(i === f.sel));
        });
        f.val.textContent = f.sel >= 0 ? f.opts[f.sel].textContent : "";
        if (reduce) {
            f.sp.x = f.open ? 1 : 0;
            f.sp.v = 0;
            render();
        }
    }
    function setOpen(f, v) {
        f.open = v;
        f.closeIn = 0;
        if (v && f.sel >= 0) f.hi = f.sel;
        syncAria(f);
    }
    function pick(f, idx) {
        f.sel = idx;
        f.hi = idx;
        if (reduce) setOpen(f, false);
        else {
            f.closeIn = PICK_DELAY / 1000;
            syncAria(f);
        }
    }
    function move(f, to) {
        f.hi = clamp(to, 0, f.opts.length - 1);
        syncAria(f);
    }
    function resetFields() {
        fields.forEach(function (f) {
            f.sel = -1;
            f.hi = 0;
            setOpen(f, false);
        });
    }
    function relayout() {
        fields.forEach(syncAria);
    }
    function script(ts) {
        const t = ts % 2000;
        if (lastT < 0) lastT = t;
        if (t < lastT) resetFields();
        EVENTS.forEach(function (e) {
            if (e[0] <= lastT || e[0] > t) return;
            const f = fields[e[1]];
            if (e[2] === "open") setOpen(f, true);
            else if (e[2] === "hi") move(f, e[3]);
            else pick(f, e[3]);
        });
        lastT = t;
    }
    function step(dt, ts) {
        fields.forEach(function (f) {
            springStep(f.sp, f.open ? 1 : 0, CHEV_STIFF, CHEV_DAMP, dt);
            if (f.closeIn > 0) {
                f.closeIn -= dt;
                if (f.closeIn <= 0) setOpen(f, false);
            }
        });
    }
    function render() {
        fields.forEach(function (f) {
            const x = f.sp.x;
            const o = clamp(x, 0, 1);
            const r = f.sel >= 0 ? Math.max(1, clamp(x, 0, 1.25)) : clamp(x, 0, 1.25);
            const s = 1 - (1 - LABEL_SCALE) * r;
            f.label.style.transform = "translate3d(0," + (-RISE_PX * r).toFixed(2) + "px,0) scale(" + s.toFixed(3) + ")";
            f.chev.style.transform = "rotate(" + (OPEN_DEG * x).toFixed(1) + "deg)";
            f.box.style.setProperty("--p", clamp(r, 0, 1).toFixed(3));
            const h = (OPT_H * f.opts.length + 2 * MENU_PAD) * o;
            f.menu.style.height = h.toFixed(1) + "px";
            f.menu.style.opacity = clamp(o * 1.6, 0, 1).toFixed(3);
            f.menu.style.visibility = h < 1 ? "hidden" : "visible";
        });
    }
    fields.forEach(function (f) {
        f.opts.forEach(function (o, k) {
            on(o, "pointerenter", function () {
                if (f.open) move(f, k);
            });
            on(o, "click", function () {
                stopDemo();
                pick(f, k);
            });
        });
        // 목록을 누를 때 버튼이 포커스를 잃어 닫히지 않게 한다.
        on(f.menu, "mousedown", function (e) {
            e.preventDefault();
        });
        on(f.btn, "click", function (e) {
            stopDemo();
            if (e.detail === 0 && f.open) pick(f, f.hi);
            else setOpen(f, !f.open);
        });
        on(f.btn, "keydown", function (e) {
            if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                e.preventDefault();
                stopDemo();
                if (!f.open) setOpen(f, true);
                else move(f, f.hi + (e.key === "ArrowDown" ? 1 : -1));
            } else if (e.key === "Escape" && f.open) {
                setOpen(f, false);
            }
        });
        on(f.btn, "blur", function () {
            if (f.open) setOpen(f, false);
        });
    });
    on(document, "pointerdown", function (e) {
        fields.forEach(function (f) {
            if (f.open && !f.box.contains(e.target)) setOpen(f, false);
        });
    });

    relayout();
    if (reduce) {
        render();
    } else {
        raf = requestAnimationFrame(frame);
    }

})();
</script>
</body>
</html>
