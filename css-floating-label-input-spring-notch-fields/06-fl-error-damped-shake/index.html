<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오류가 나면 감쇠 사인으로 흔들리고 라벨이 안내 색으로 바뀌는 칸 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="fl is-demo" id="fl" data-demo="1">
    <div class="fl__field">
      <div class="fl__box" data-r="box">
        <input class="fl__input" id="f1" data-r="input" type="email" autocomplete="email">
        <label class="fl__label" for="f1" data-r="label">이메일 주소</label>
      </div>
      <p class="fl__msg" id="m1" data-r="msg">이메일 형식으로 적어 주세요</p>
    </div>
    <div class="fl__field">
      <div class="fl__box" data-r="box">
        <input class="fl__input" id="f2" data-r="input" type="text" autocomplete="name">
        <label class="fl__label" for="f2" data-r="label">이름</label>
      </div>
    </div>
  </div>
</main>
<script>
(function () {
    const root = document.getElementById("fl");
    const CLS = {};
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let demo = !reduce;
    let raf = 0;
    let last = -1;
    const offs = [];
    function q(sel) {
        return root.querySelector(sel);
    }
    function qa(sel) {
        const list = Array.prototype.slice.call(root.querySelectorAll(sel));
        return list;
    }
    function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
    }
    function on(el, type, fn) {
        el.addEventListener(type, fn);
        offs.push(function () {
            el.removeEventListener(type, fn);
        });
    }
    // 좌표 해시: 같은 입력이면 같은 값 0~1. 난수 함수를 쓰지 않고 사인의 소수부만 쓴다.
    function hash(x) {
        const s = Math.sin(x * 127.1 + 311.7) * 43758.5453;
        return s - Math.floor(s);
    }
    // 지수 접근: 프레임당 비율 per 만큼 목표에 다가간다. f 는 60fps 기준 프레임 수(dt * 60)라 프레임률이 달라도 같은 속도다.
    function approach(x, target, per, f) {
        return x + (target - x) * (1 - Math.pow(1 - per, f));
    }
    // 스프링 한 칸: 가속도 = -k (x - 목표) - c v. 반암시적 오일러를 1/120초 이하 부분 스텝으로 쪼갠다.
    function springStep(s, target, k, c, dt) {
        let left = dt;
        while (left > 0) {
            const h = Math.min(left, 1 / 120);
            s.v += (-k * (s.x - target) - c * s.v) * h;
            s.x += s.v * h;
            left -= h;
        }
    }
    // 값이 있으면 라벨은 올라가 있어야 한다. 브라우저 자동완성이 값을 채우면 input 이벤트가 없을 수 있어 :autofill 도 함께 본다.
    function isFilled(el) {
        if (el.value !== "") return true;
        try {
            return el.matches(":-webkit-autofill");
        } catch (err) {
            return false;
        }
    }
    let leaveHook = null;
    function stopDemo() {
        if (!demo) return;
        demo = false;
        root.removeAttribute("data-demo");
        root.classList.remove("is-demo");
        resetFields();
    }
    function frame(ts) {
        const dt = last < 0 ? 0.016 : Math.min(0.05, (ts - last) / 1000);
        last = ts;
        if (demo) script(ts);
        step(dt, ts);
        render();
        raf = requestAnimationFrame(frame);
    }
    const ro = new ResizeObserver(function () {
        relayout();
    });
    ro.observe(root);
    if (document.fonts) {
        document.fonts.ready.then(function () {
            relayout();
        });
    }

    // 시연 계획: 칸마다 포커스 구간(a~b), 타이핑 시작(s)·글자당 ms(rate)·글. 2초 주기로 되풀이하고 주기 첫머리엔 모두 비운다.
    function runPlan(ts) {
        const t = ts % 2000;
        let changed = false;
        for (let i = 0; i < PLAN.length; i += 1) {
            const p = PLAN[i];
            const f = fields[i];
            const isOn = t >= p.a && t < p.b;
            const n = t < p.s ? 0 : Math.min(p.text.length, Math.floor((t - p.s) / p.rate) + 1);
            const v = p.text.slice(0, n);
            if (f.input.value !== v) {
                f.input.value = v;
                changed = true;
            }
            if (f.focus !== isOn) {
                f.focus = isOn;
                changed = true;
                if (!isOn && leaveHook) leaveHook(i);
            }
        }
        if (changed) retarget();
    }
    function resetFields() {
        for (let i = 0; i < fields.length; i += 1) {
            fields[i].input.value = "";
            fields[i].focus = false;
        }
        retarget();
    }
    function wire() {
        fields.forEach(function (f, i) {
            on(f.input, "focus", function () {
                stopDemo();
                f.focus = true;
                retarget();
            });
            on(f.input, "blur", function () {
                f.focus = false;
                if (leaveHook) leaveHook(i);
                retarget();
            });
            on(f.input, "input", function () {
                retarget();
            });
        });
    }

    // 기법: 흔들림 진폭에 프레임마다 SHAKE_DECAY 를 곱해 지수로 줄이고, 사인 위상을 SHAKE_FREQ 로 돌린다. 감쇠 사인 하나가 흔들림의 전부다.
    const SHAKE_AMP = 9;
    const SHAKE_DECAY = 0.9;
    const SHAKE_FREQ = 52;
    const ERR_HOLD = 0.9;
    const RISE_PX = 15;
    const LABEL_SCALE = 0.74;
    const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const fields = qa("[data-r=box]").map(function (box) {
        return {
            box: box,
            input: box.querySelector("input"),
            label: box.querySelector("label"),
            msg: box.parentElement ? box.parentElement.querySelector("[data-r=msg]") : null,
            focus: false, up: false, err: false, p: 0, amp: 0, phase: 0, x: 0, flash: 0
        };
    });
    const PLAN = [
        { a: 200, b: 800, s: 260, rate: 60, text: "mina@mail" },
        { a: 1000, b: 1750, s: 1100, rate: 70, text: "Mina Seo" }
    ];
    // 한 프레임의 흔들림: 진폭을 줄이고 위상을 돌려 가로 오프셋을 돌려준다. dt 는 초 단위 간격이다.
    function shakeStep(s, dt) {
        s.amp *= Math.pow(SHAKE_DECAY, dt * 60);
        s.phase += SHAKE_FREQ * dt;
        return s.amp * Math.sin(s.phase);
    }
    function setErr(f, bad) {
        if (f.err === bad) return;
        f.err = bad;
        if (bad) {
            f.amp = SHAKE_AMP;
            f.phase = 0;
            f.flash = 1;
            f.box.setAttribute("data-err", "");
            f.input.setAttribute("aria-invalid", "true");
            if (f.msg) f.input.setAttribute("aria-describedby", f.msg.id);
        } else {
            f.box.removeAttribute("data-err");
            f.input.removeAttribute("aria-invalid");
            f.input.removeAttribute("aria-describedby");
            f.flash = 0;
        }
        if (reduce) render();
    }
    // 칸을 떠날 때 값이 비어 있지 않고 이메일 모양이 아니면 오류. 입력 중에는 올바르게 고쳐진 순간 오류를 거둔다.
    leaveHook = function (i) {
        const f = fields[i];
        if (i === 0 && f.input.value !== "") setErr(f, !EMAIL.test(f.input.value));
    };
    function retarget() {
        fields.forEach(function (f, i) {
            f.up = f.focus || isFilled(f.input);
            if (f.up) f.box.setAttribute("data-up", "");
            else f.box.removeAttribute("data-up");
            if (f.err && (i !== 0 || f.input.value === "" || EMAIL.test(f.input.value))) setErr(f, false);
            if (reduce) f.p = f.up ? 1 : 0;
        });
        if (reduce) render();
    }
    function relayout() {
        retarget();
    }
    function script(ts) {
        runPlan(ts);
    }
    function step(dt, ts) {
        const fr = dt * 60;
        fields.forEach(function (f) {
            f.p = approach(f.p, f.up ? 1 : 0, 0.22, fr);
            f.x = f.err ? shakeStep(f, dt) : approach(f.x, 0, 0.3, fr);
            f.flash = Math.max(0, f.flash - dt / ERR_HOLD);
        });
    }
    function render() {
        fields.forEach(function (f) {
            const s = 1 - (1 - LABEL_SCALE) * f.p;
            f.label.style.transform = "translate3d(0," + (-RISE_PX * f.p).toFixed(2) + "px,0) scale(" + s.toFixed(3) + ")";
            f.box.style.setProperty("--p", f.p.toFixed(3));
            f.box.style.setProperty("--e", f.flash.toFixed(3));
            f.box.style.transform = "translate3d(" + (reduce ? 0 : f.x).toFixed(2) + "px,0,0)";
        });
    }
    wire();

    relayout();
    if (reduce) {
        render();
    } else {
        raf = requestAnimationFrame(frame);
    }

})();
</script>
</body>
</html>
