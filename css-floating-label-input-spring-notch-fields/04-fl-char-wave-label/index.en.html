<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Wave Label Whose Letters Rise One by One on Hashed Delays — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="fl is-demo" id="fl" data-demo="1">
    <div class="fl__field">
      <div class="fl__box" data-r="box">
        <input class="fl__input" id="f1" data-r="input" type="text" autocomplete="name">
        <label class="fl__label" for="f1" data-r="label">Name</label>
      </div>
    </div>
    <div class="fl__field">
      <div class="fl__box" data-r="box">
        <input class="fl__input" id="f2" data-r="input" type="email" autocomplete="email">
        <label class="fl__label" for="f2" data-r="label">Email address</label>
      </div>
    </div>
  </div>
</main>
<script>
(function () {
    const root = document.getElementById("fl");
    const CLS = { ch: "fl__ch" };
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let demo = !reduce;
    let raf = 0;
    let last = -1;
    const offs = [];
    function q(sel) {
        return root.querySelector(sel);
    }
    function qa(sel) {
        const list = Array.prototype.slice.call(root.querySelectorAll(sel));
        return list;
    }
    function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
    }
    function on(el, type, fn) {
        el.addEventListener(type, fn);
        offs.push(function () {
            el.removeEventListener(type, fn);
        });
    }
    // 좌표 해시: 같은 입력이면 같은 값 0~1. 난수 함수를 쓰지 않고 사인의 소수부만 쓴다.
    function hash(x) {
        const s = Math.sin(x * 127.1 + 311.7) * 43758.5453;
        return s - Math.floor(s);
    }
    // 지수 접근: 프레임당 비율 per 만큼 목표에 다가간다. f 는 60fps 기준 프레임 수(dt * 60)라 프레임률이 달라도 같은 속도다.
    function approach(x, target, per, f) {
        return x + (target - x) * (1 - Math.pow(1 - per, f));
    }
    // 스프링 한 칸: 가속도 = -k (x - 목표) - c v. 반암시적 오일러를 1/120초 이하 부분 스텝으로 쪼갠다.
    function springStep(s, target, k, c, dt) {
        let left = dt;
        while (left > 0) {
            const h = Math.min(left, 1 / 120);
            s.v += (-k * (s.x - target) - c * s.v) * h;
            s.x += s.v * h;
            left -= h;
        }
    }
    // 값이 있으면 라벨은 올라가 있어야 한다. 브라우저 자동완성이 값을 채우면 input 이벤트가 없을 수 있어 :autofill 도 함께 본다.
    function isFilled(el) {
        if (el.value !== "") return true;
        try {
            return el.matches(":-webkit-autofill");
        } catch (err) {
            return false;
        }
    }
    let leaveHook = null;
    function stopDemo() {
        if (!demo) return;
        demo = false;
        root.removeAttribute("data-demo");
        root.classList.remove("is-demo");
        resetFields();
    }
    function frame(ts) {
        const dt = last < 0 ? 0.016 : Math.min(0.05, (ts - last) / 1000);
        last = ts;
        if (demo) script(ts);
        step(dt, ts);
        render();
        raf = requestAnimationFrame(frame);
    }
    const ro = new ResizeObserver(function () {
        relayout();
    });
    ro.observe(root);
    if (document.fonts) {
        document.fonts.ready.then(function () {
            relayout();
        });
    }

    // 시연 계획: 칸마다 포커스 구간(a~b), 타이핑 시작(s)·글자당 ms(rate)·글. 2초 주기로 되풀이하고 주기 첫머리엔 모두 비운다.
    function runPlan(ts) {
        const t = ts % 2000;
        let changed = false;
        for (let i = 0; i < PLAN.length; i += 1) {
            const p = PLAN[i];
            const f = fields[i];
            const isOn = t >= p.a && t < p.b;
            const n = t < p.s ? 0 : Math.min(p.text.length, Math.floor((t - p.s) / p.rate) + 1);
            const v = p.text.slice(0, n);
            if (f.input.value !== v) {
                f.input.value = v;
                changed = true;
            }
            if (f.focus !== isOn) {
                f.focus = isOn;
                changed = true;
                if (!isOn && leaveHook) leaveHook(i);
            }
        }
        if (changed) retarget();
    }
    function resetFields() {
        for (let i = 0; i < fields.length; i += 1) {
            fields[i].input.value = "";
            fields[i].focus = false;
        }
        retarget();
    }
    function wire() {
        fields.forEach(function (f, i) {
            on(f.input, "focus", function () {
                stopDemo();
                f.focus = true;
                retarget();
            });
            on(f.input, "blur", function () {
                f.focus = false;
                if (leaveHook) leaveHook(i);
                retarget();
            });
            on(f.input, "input", function () {
                retarget();
            });
        });
    }

    // 기법: 글자마다 좌표 해시로 출발 지연을 주고, 각자 스프링으로 올라간다. 라벨 전체가 아니라 글자 하나하나가 물결처럼 일어난다.
    const STAGGER_MS = 260;
    const WAVE_AMP = 90;
    const NOISE_SEED = 7;
    const SETTLE = 150;
    const DAMP = 11;
    const RISE_PX = 15;
    const LABEL_SCALE = 0.74;
    const fields = qa("[data-r=box]").map(function (box) {
        const label = box.querySelector("label");
        const text = label.textContent || "";
        label.textContent = "";
        const chars = [];
        for (let i = 0; i < text.length; i += 1) {
            const el = document.createElement("span");
            el.className = CLS.ch;
            el.textContent = text.charAt(i);
            label.appendChild(el);
            chars.push({ el: el, sp: { x: 0, v: 0 }, wait: 0, t: 0, fired: true, goal: 0 });
        }
        return { box: box, input: box.querySelector("input"), label: label, chars: chars, focus: false, up: false, dir: -1 };
    });
    const PLAN = [
        { a: 200, b: 950, s: 420, rate: 60, text: "Mina Seo" },
        { a: 950, b: 1700, s: 1050, rate: 60, text: "mina@mail.dev" }
    ];
    // 글자 i 의 출발 지연(초) = 좌표 해시 × STAGGER_MS. 같은 칸·같은 자리면 항상 같은 지연이라 되풀이해도 같은 물결이다.
    function delayOf(fi, i) {
        return hash(i * 17.3 + fi * 91.7 + NOISE_SEED) * STAGGER_MS / 1000;
    }
    function retarget() {
        fields.forEach(function (f, fi) {
            f.up = f.focus || isFilled(f.input);
            if (f.up) f.box.setAttribute("data-up", "");
            else f.box.removeAttribute("data-up");
            const dir = f.up ? 1 : -1;
            if (dir === f.dir) return;
            f.dir = dir;
            f.chars.forEach(function (c, i) {
                c.wait = delayOf(fi, i);
                c.t = 0;
                c.fired = false;
                if (reduce) {
                    c.sp.x = f.up ? -RISE_PX : 0;
                    c.sp.v = 0;
                    c.goal = c.sp.x;
                    c.fired = true;
                }
            });
        });
        if (reduce) render();
    }
    function relayout() {
        retarget();
    }
    function script(ts) {
        runPlan(ts);
    }
    function step(dt, ts) {
        fields.forEach(function (f) {
            f.chars.forEach(function (c) {
                c.t += dt;
                if (!c.fired && c.t >= c.wait) {
                    c.fired = true;
                    c.goal = f.up ? -RISE_PX : 0;
                    c.sp.v += (f.up ? -1 : 1) * WAVE_AMP;
                }
                springStep(c.sp, c.goal, SETTLE, DAMP, dt);
            });
        });
    }
    function render() {
        fields.forEach(function (f) {
            let mean = 0;
            f.chars.forEach(function (c) {
                c.el.style.transform = "translate3d(0," + c.sp.x.toFixed(2) + "px,0)";
                mean += clamp(c.sp.x / -RISE_PX, 0, 1);
            });
            const r = mean / f.chars.length;
            const s = 1 - (1 - LABEL_SCALE) * r;
            f.label.style.transform = "scale(" + s.toFixed(3) + ")";
            f.box.style.setProperty("--p", r.toFixed(3));
        });
    }
    wire();

    relayout();
    if (reduce) {
        render();
    } else {
        raf = requestAnimationFrame(frame);
    }

})();
</script>
</body>
</html>
