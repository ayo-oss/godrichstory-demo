<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入力の長さに応じて枠線が一周分埋まる進行リング欄 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="fl is-demo" id="fl" data-demo="1">
    <div class="fl__field">
      <div class="fl__box" data-r="box">
        <input class="fl__input" id="f1" data-r="input" type="email" autocomplete="email">
        <label class="fl__label" for="f1" data-r="label">メールアドレス</label>
        <svg class="fl__ring" data-r="ring" aria-hidden="true">
          <rect data-r="rect" />
        </svg>
        <span class="fl__count" data-r="count" aria-hidden="true">0 / 24</span>
      </div>
    </div>
    <div class="fl__field">
      <div class="fl__box" data-r="box">
        <input class="fl__input" id="f2" data-r="input" type="text" autocomplete="name">
        <label class="fl__label" for="f2" data-r="label">お名前</label>
        <svg class="fl__ring" data-r="ring" aria-hidden="true">
          <rect data-r="rect" />
        </svg>
        <span class="fl__count" data-r="count" aria-hidden="true">0 / 24</span>
      </div>
    </div>
    <div class="fl__field">
      <div class="fl__box" data-r="box">
        <input class="fl__input" id="f3" data-r="input" type="text" autocomplete="off">
        <label class="fl__label" for="f3" data-r="label">市区町村</label>
        <svg class="fl__ring" data-r="ring" aria-hidden="true">
          <rect data-r="rect" />
        </svg>
        <span class="fl__count" data-r="count" aria-hidden="true">0 / 24</span>
      </div>
    </div>
  </div>
</main>
<script>
(function () {
    const root = document.getElementById("fl");
    const CLS = {};
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let demo = !reduce;
    let raf = 0;
    let last = -1;
    const offs = [];
    function q(sel) {
        return root.querySelector(sel);
    }
    function qa(sel) {
        const list = Array.prototype.slice.call(root.querySelectorAll(sel));
        return list;
    }
    function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
    }
    function on(el, type, fn) {
        el.addEventListener(type, fn);
        offs.push(function () {
            el.removeEventListener(type, fn);
        });
    }
    // 좌표 해시: 같은 입력이면 같은 값 0~1. 난수 함수를 쓰지 않고 사인의 소수부만 쓴다.
    function hash(x) {
        const s = Math.sin(x * 127.1 + 311.7) * 43758.5453;
        return s - Math.floor(s);
    }
    // 지수 접근: 프레임당 비율 per 만큼 목표에 다가간다. f 는 60fps 기준 프레임 수(dt * 60)라 프레임률이 달라도 같은 속도다.
    function approach(x, target, per, f) {
        return x + (target - x) * (1 - Math.pow(1 - per, f));
    }
    // 스프링 한 칸: 가속도 = -k (x - 목표) - c v. 반암시적 오일러를 1/120초 이하 부분 스텝으로 쪼갠다.
    function springStep(s, target, k, c, dt) {
        let left = dt;
        while (left > 0) {
            const h = Math.min(left, 1 / 120);
            s.v += (-k * (s.x - target) - c * s.v) * h;
            s.x += s.v * h;
            left -= h;
        }
    }
    // 값이 있으면 라벨은 올라가 있어야 한다. 브라우저 자동완성이 값을 채우면 input 이벤트가 없을 수 있어 :autofill 도 함께 본다.
    function isFilled(el) {
        if (el.value !== "") return true;
        try {
            return el.matches(":-webkit-autofill");
        } catch (err) {
            return false;
        }
    }
    let leaveHook = null;
    function stopDemo() {
        if (!demo) return;
        demo = false;
        root.removeAttribute("data-demo");
        root.classList.remove("is-demo");
        resetFields();
    }
    function frame(ts) {
        const dt = last < 0 ? 0.016 : Math.min(0.05, (ts - last) / 1000);
        last = ts;
        if (demo) script(ts);
        step(dt, ts);
        render();
        raf = requestAnimationFrame(frame);
    }
    const ro = new ResizeObserver(function () {
        relayout();
    });
    ro.observe(root);
    if (document.fonts) {
        document.fonts.ready.then(function () {
            relayout();
        });
    }

    // 시연 계획: 칸마다 포커스 구간(a~b), 타이핑 시작(s)·글자당 ms(rate)·글. 2초 주기로 되풀이하고 주기 첫머리엔 모두 비운다.
    function runPlan(ts) {
        const t = ts % 2000;
        let changed = false;
        for (let i = 0; i < PLAN.length; i += 1) {
            const p = PLAN[i];
            const f = fields[i];
            const isOn = t >= p.a && t < p.b;
            const n = t < p.s ? 0 : Math.min(p.text.length, Math.floor((t - p.s) / p.rate) + 1);
            const v = p.text.slice(0, n);
            if (f.input.value !== v) {
                f.input.value = v;
                changed = true;
            }
            if (f.focus !== isOn) {
                f.focus = isOn;
                changed = true;
                if (!isOn && leaveHook) leaveHook(i);
            }
        }
        if (changed) retarget();
    }
    function resetFields() {
        for (let i = 0; i < fields.length; i += 1) {
            fields[i].input.value = "";
            fields[i].focus = false;
        }
        retarget();
    }
    function wire() {
        fields.forEach(function (f, i) {
            on(f.input, "focus", function () {
                stopDemo();
                f.focus = true;
                retarget();
            });
            on(f.input, "blur", function () {
                f.focus = false;
                if (leaveHook) leaveHook(i);
                retarget();
            });
            on(f.input, "input", function () {
                retarget();
            });
        });
    }

    // 기법: 테두리 사각형의 둘레를 getTotalLength 로 재서 stroke-dashoffset 을 글자 수 비율만큼 보간한다.
    const MAX_LEN = 24;
    const RING_LERP = 0.14;
    const STROKE_W = 3;
    const START_FILL = 0.06;
    const RISE_PX = 15;
    const LABEL_SCALE = 0.74;
    const fields = qa("[data-r=box]").map(function (box) {
        const input = box.querySelector("input");
        input.maxLength = MAX_LEN;
        return {
            box: box, input: input,
            label: box.querySelector("label"),
            count: box.querySelector("[data-r=count]"),
            rect: box.querySelector("[data-r=rect]"),
            focus: false, up: false, p: 0, fill: 0, perimeter: 1
        };
    });
    const PLAN = [
        { a: 200, b: 1000, s: 300, rate: 38, text: "mina.sk.kr@mail-demo.dev" },
        { a: 1000, b: 1700, s: 1100, rate: 55, text: "Mina Seo" },
        { a: 1700, b: 1990, s: 1750, rate: 60, text: "seoul" }
    ];
    function fillTarget(f) {
        const len = f.input.value.length;
        if (len > 0) return clamp(len / MAX_LEN, START_FILL, 1);
        return f.focus ? START_FILL : 0;
    }
    function retarget() {
        fields.forEach(function (f) {
            f.up = f.focus || isFilled(f.input);
            if (f.up) f.box.setAttribute("data-up", "");
            else f.box.removeAttribute("data-up");
            f.count.textContent = f.input.value.length + " / " + MAX_LEN;
            if (reduce) {
                f.p = f.up ? 1 : 0;
                f.fill = fillTarget(f);
            }
        });
        if (reduce) render();
    }
    // 둘레는 테두리 사각형의 실제 크기에서 다시 잰다. 칸 폭이 바뀌면 dasharray 도 새 둘레로 간다.
    function relayout() {
        fields.forEach(function (f) {
            const w = f.box.clientWidth;
            const h = f.box.clientHeight;
            const inset = STROKE_W / 2;
            f.rect.setAttribute("x", String(inset));
            f.rect.setAttribute("y", String(inset));
            f.rect.setAttribute("width", String(Math.max(1, w - STROKE_W)));
            f.rect.setAttribute("height", String(Math.max(1, h - STROKE_W)));
            f.rect.setAttribute("rx", String(8 - inset));
            f.rect.setAttribute("stroke-width", String(STROKE_W));
            f.perimeter = f.rect.getTotalLength();
            f.rect.style.strokeDasharray = f.perimeter.toFixed(2);
        });
        retarget();
    }
    function script(ts) {
        runPlan(ts);
    }
    function step(dt, ts) {
        const fr = dt * 60;
        fields.forEach(function (f) {
            f.p = approach(f.p, f.up ? 1 : 0, 0.22, fr);
            f.fill = approach(f.fill, fillTarget(f), RING_LERP, fr);
        });
    }
    function render() {
        fields.forEach(function (f) {
            const s = 1 - (1 - LABEL_SCALE) * f.p;
            f.label.style.transform = "translate3d(0," + (-RISE_PX * f.p).toFixed(2) + "px,0) scale(" + s.toFixed(3) + ")";
            f.box.style.setProperty("--p", f.p.toFixed(3));
            f.rect.style.strokeDashoffset = (f.perimeter * (1 - f.fill)).toFixed(2);
            if (f.fill > 0.995) f.box.setAttribute("data-full", "");
            else f.box.removeAttribute("data-full");
        });
    }
    wire();

    relayout();
    if (reduce) {
        render();
    } else {
        raf = requestAnimationFrame(frame);
    }

})();
</script>
</body>
</html>
