<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pressing an arrow key calculates the remaining distance to the top of the next page, then moves there by splitting that distance across several decelerating frames so it never snaps in one jump — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pvk is-demo" id="pvkRoot" tabindex="0" aria-label="Document view — move pages with arrow keys or Page Up/Down">
  <div class="pvk__doc" id="pvkDoc"></div>
  <p class="pvk__badge" id="pvkBadge">1 / 5</p>
</div>
</main>
<script>
(function () {
  // 기법: 현재 스크롤 위치에서 목표 Page 상단까지 남은 거리를 구하고, 그 거리를
  // 이징(ease-out) 곡선에 따라 여러 프레임으로 나눠 옮긴다. jump 나 scrollIntoView 처럼
  // 한 번에 끊기지 않고, 감속하며 도착한다.
  var root = document.getElementById('pvkRoot');
  var doc = document.getElementById('pvkDoc');
  var badge = document.getElementById('pvkBadge');

  var LOOP_MS = 2000;
  var N = 5;

  function seedRand(seed) { var s = seed >>> 0; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  var rnd = seedRand(430071);
  var pageTops = [];
  for (var i = 0; i < N; i += 1) {
    var page = document.createElement('div');
    page.className = 'pvk__page';
    var html = '<div class="pvk__title" style="width:' + (44 + rnd() * 18) + '%"></div>';
    for (var j = 0; j < 5; j += 1) html += '<div class="pvk__line" style="width:' + (36 + rnd() * 56) + '%"></div>';
    if (rnd() > 0.4) html += '<div class="pvk__fig"></div>';
    page.innerHTML = html;
    doc.appendChild(page);
  }
  Array.prototype.forEach.call(doc.children, function (el) { pageTops.push(el.offsetTop); });

  var currentIndex = 0, scrollAnim = null;
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function easeScrollTo(target, dur, nowT) { scrollAnim = { from: doc.scrollTop, to: target, start: nowT, dur: dur }; }
  function navigate(dir, nowT) {
    var idx = Math.max(0, Math.min(N - 1, currentIndex + dir));
    if (idx === currentIndex) return;
    currentIndex = idx;
    easeScrollTo(pageTops[idx], 520, nowT);
    badge.textContent = (idx + 1) + ' / ' + N;
  }

  var userActive = false;
  function markActive() { if (!userActive) { userActive = true; root.classList.remove('is-demo'); } }
  root.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); markActive(); navigate(1, lastTs || 0); }
    else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); markActive(); navigate(-1, lastTs || 0); }
  });
  doc.addEventListener('wheel', function () { markActive(); }, { passive: true });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { root.classList.remove('is-demo'); userActive = true; }

  var fired = {};
  var SCHEDULE = [
    { t: 150, run: function (t) { navigate(1, t); } },
    { t: 650, run: function (t) { navigate(1, t); } },
    { t: 1150, run: function (t) { navigate(-1, t); } },
    { t: 1650, run: function (t) { navigate(-1, t); } }
  ];

  var lastTs = null, originTs = null;
  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    lastTs = ts;
    if (!userActive) {
      if (originTs === null) originTs = ts;
      var elapsed = ts - originTs;
      var loopIdx = Math.floor(elapsed / LOOP_MS);
      var phase = elapsed % LOOP_MS;
      SCHEDULE.forEach(function (a, i) {
        var key = loopIdx + ':' + i;
        if (phase >= a.t && !fired[key]) { fired[key] = true; a.run(ts); }
      });
    }
    if (scrollAnim) {
      var p = Math.max(0, Math.min(1, (ts - scrollAnim.start) / scrollAnim.dur));
      doc.scrollTop = scrollAnim.from + (scrollAnim.to - scrollAnim.from) * easeOutCubic(p);
      if (p >= 1) scrollAnim = null;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
