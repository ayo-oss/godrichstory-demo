<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll-Linked: Turn Progress Into State Changes — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="Demo stage: Space or Enter pauses, R restarts, S toggles the reduce simulation, Left and right arrows change the segment count">
    <canvas class="ez__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="A value that changes continuously with scroll beside one that changes once per segment"></canvas>
  </div>
  <p class="ez__status" data-role="status" aria-live="off">Scene ready</p>
  <div class="ez__ctrl">
    <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
    <button class="ez__pause" data-role="sim" type="button" aria-pressed="false">Sim reduce</button>
  </div>
  <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function main(root) {
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    // 파스텔 팔레트 — 바탕은 짙은 자두색, 상자는 연한 색, 글자는 연한 색 또는 짙은 잉크
    const INK = [40, 36, 54];
    const PAPER = [250, 246, 240];
    const ROSE = [244, 162, 186];
    const MINT = [148, 212, 182];
    const SKY = [150, 192, 244];
    const SUN = [250, 218, 146];
    const LILAC = [196, 176, 244];
    const NEU = [236, 230, 250];
    const BGC = [46, 42, 68];
    const PANEL = [62, 57, 92];
    const GRID = [92, 86, 124];
    const DIM = [196, 190, 224];
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 문구 틀의 {a}·{b}·{c} 자리에 값을 끼운다 — 화면 문구는 늘 틀 한 줄이고 로케일 사전이 통째로 바꾼다
    function fill(s, ...v) {
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? v[i] : '');
        }
        return o;
    }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    function f3(v) { return (Math.round(v * 1000) / 1000).toFixed(3); }
    function pct(v) { return String(Math.round(v * 100)); }
    // ── 이징 계산. 모두 진행률 p(0 에서 1) 를 받아 변화량 비율을 돌려준다
    const LINEAR = function (p) { return clamp(p, 0, 1); };
    // 3차 곡선 한 점 — 제어값 두 개(a, b) 와 매개값 s 로 좌표 하나를 얻는다
    function bz(a, b, s) {
        const u = 1 - s;
        return 3 * u * u * s * a + 3 * u * s * s * b + s * s * s;
    }
    // CSS cubic-bezier(x1, y1, x2, y2) 와 같은 곡선. 시간 p 에 맞는 매개값 s 를 반으로 줄이는 반복 근사로 찾고 그 s 의 y 를 돌려준다
    function cubic(x1, y1, x2, y2) {
        return function (p) {
            if (p <= 0) {
                return 0;
            }
            if (p >= 1) {
                return 1;
            }
            let lo = 0;
            let hi = 1;
            let s = p;
            for (let i = 0; i < 32; i += 1) {
                s = (lo + hi) / 2;
                if (bz(x1, x2, s) < p) {
                    lo = s;
                }
                else {
                    hi = s;
                }
            }
            return bz(y1, y2, s);
        };
    }
    // CSS steps(n, jump-end) 와 steps(n, jump-start) — 값이 계단으로만 바뀐다
    function stepsFn(n, jumpStart) {
        return function (p) {
            if (p <= 0) {
                return 0;
            }
            if (p >= 1) {
                return 1;
            }
            return jumpStart ? Math.min(1, Math.ceil(p * n) / n) : Math.floor(p * n) / n;
        };
    }
    // CSS linear(점 목록) — 점은 같은 간격 위치에 놓이고 사이는 직선으로 잇는다
    function linearFn(pts) {
        return function (p) {
            if (p <= 0) {
                return pts[0];
            }
            if (p >= 1) {
                return pts[pts.length - 1];
            }
            const x = p * (pts.length - 1);
            const i = Math.floor(x);
            return lerp(pts[i], pts[i + 1], x - i);
        };
    }
    // 순간 속도 — 진행률 곡선의 기울기(길이 1 을 시간 1 에 가는 직선이 1 배)
    function slopeAt(fn, p) {
        const h = 0.002;
        const a = Math.max(0, p - h);
        const b = Math.min(1, p + h);
        return (fn(b) - fn(a)) / (b - a);
    }
    // 목표의 비율 q 에 처음 닿는 시간(0 에서 1) — 반으로 줄이는 반복 근사
    function reachTime(fn, q) {
        let lo = 0;
        let hi = 1;
        for (let i = 0; i < 30; i += 1) {
            const m = (lo + hi) / 2;
            if (fn(m) < q) {
                lo = m;
            }
            else {
                hi = m;
            }
        }
        return hi;
    }
    // ── 그리기 도구
    const rootEl = root;
    const canvasEl = rootEl.querySelector('[data-role="canvas"]');
    const padEl = rootEl.querySelector('[data-role="pad"]');
    const pauseEl = rootEl.querySelector('[data-role="pause"]');
    const statusEl = rootEl.querySelector('[data-role="status"]');
    const doneEl = rootEl.querySelector('[data-role="done"]');
    const simEl = rootEl.querySelector('[data-role="sim"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !doneEl || !statusEl || !simEl) {
        return function () { };
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pad = padEl;
    const pauseBtn = pauseEl;
    const doneP = doneEl;
    const statusP = statusEl;
    const simBtn = simEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const UI_FONT = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    const CODE_FONT = 'ui-monospace, "Cascadia Mono", Consolas, "Noto Sans KR", monospace';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 계산은 늘 480×300 이고 화면 배율만 이 값
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function disc(x, y, r, c, a) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function seg(x1, y1, x2, y2, c, a, w) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = rgba(c, a);
        ctx.lineWidth = w;
        ctx.lineCap = 'round';
        ctx.stroke();
    }
    // 점선 세로·가로선
    function dash(x1, y1, x2, y2, c, a) {
        ctx.setLineDash([3, 3]);
        seg(x1, y1, x2, y2, c, a, 1);
        ctx.setLineDash([]);
    }
    // 글자 — maxW 가 있으면 그 폭에 들어가도록 글자 크기를 줄인다(문구가 로케일마다 길이가 달라서)
    function text(s, x, y, c, px, weight, align, maxW, mono) {
        const face = mono ? CODE_FONT : UI_FONT;
        let size = px;
        ctx.font = weight + ' ' + size + 'px ' + face;
        if (maxW !== undefined) {
            while (size > 8 && ctx.measureText(s).width > maxW) {
                size -= 0.5;
                ctx.font = weight + ' ' + size + 'px ' + face;
            }
        }
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, 1);
        ctx.fillText(s, x, y);
    }
    function panel(x, y, w, h) { box(x, y, w, h, 10, PANEL, 1); }
    // 아래쪽 눈금 — 상수 이름과 지금 값 · 크기 막대
    function hud(name, val, frac) {
        const label = name + ' ' + val;
        ctx.font = '700 11px ' + CODE_FONT;
        const w = ctx.measureText(label).width + 20;
        const x = 12;
        const y = H - 30;
        box(x, y, w, 20, 10, NEU, 0.96);
        text(label, x + w / 2, y + 10.5, INK, 11, 700, 'center', undefined, true);
        const mx = x + w + 10;
        box(mx, y + 6, 140, 8, 4, [78, 72, 104], 1);
        box(mx, y + 6, 140 * clamp(frac, 0, 1), 8, 4, MINT, 1);
    }
    function gX(g, p) { return g.x + g.w * p; }
    function gY(g, v) { return g.y + g.h * (1 - (v - g.lo) / (g.hi - g.lo)); }
    function graphFrame(g) {
        box(g.x - 6, g.y - 6, g.w + 12, g.h + 12, 8, PANEL, 1);
        seg(g.x, gY(g, 0), g.x + g.w, gY(g, 0), GRID, 1, 1);
        seg(g.x, gY(g, 1), g.x + g.w, gY(g, 1), GRID, 1, 1);
        dash(g.x, gY(g, 0), g.x, gY(g, 1), GRID, 1);
        dash(g.x + g.w, gY(g, 0), g.x + g.w, gY(g, 1), GRID, 1);
    }
    // 곡선 한 줄 — 시간 upTo(0 에서 1) 까지 그리고, 끝에 점을 찍는다
    function plot(g, fn, c, lw, upTo, dot, wash) {
        const n = 72;
        if (wash !== undefined && wash > 0 && upTo > 0) {
            // 곡선 아래를 옅게 채워 진행이 면으로 보이게 한다
            ctx.beginPath();
            ctx.moveTo(gX(g, 0), gY(g, 0));
            for (let i = 0; i <= n; i += 1) {
                const p = (i / n) * upTo;
                ctx.lineTo(gX(g, p), gY(g, fn(p)));
            }
            ctx.lineTo(gX(g, upTo), gY(g, 0));
            ctx.closePath();
            ctx.fillStyle = rgba(c, wash);
            ctx.fill();
        }
        ctx.beginPath();
        for (let i = 0; i <= n; i += 1) {
            const p = (i / n) * upTo;
            const px = gX(g, p);
            const py = gY(g, fn(p));
            if (i === 0) {
                ctx.moveTo(px, py);
            }
            else {
                ctx.lineTo(px, py);
            }
        }
        ctx.strokeStyle = rgba(c, 1);
        ctx.lineWidth = lw;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        if (dot) {
            disc(gX(g, upTo), gY(g, fn(upTo)), lw + 1.5, c, 1);
        }
    }
    // ── 시간·상태·낭독
    let sceneT = 0;
    let lap = 0;
    let paused = false;
    let still = false;
    let lastStatus = '';
    let lastMode = -9;
    // reduce 시뮬레이션 스위치 — 운영체제 설정을 건드리지 않고 reduce 상태를 켜 본다
    let simOn = false;
    // 실제 설정이거나 시뮬레이션이 켜졌으면 이 페이지는 reduce 로 동작한다
    function reduceNow() { return still || simOn; }
    function pushStatus(s) {
        if (s === lastStatus) {
            return;
        }
        lastStatus = s;
        statusP.textContent = s;
    }
    // 화면을 한 번 그린다 — Moves 줄이기이면 시간표 끝(REST_S)의 한 장
    function redraw() {
        const t = still ? REST_S : sceneT;
        ctx.clearRect(0, 0, W, H);
        box(0, 0, W, H, 0, BGC, 1);
        draw(t);
        pushStatus(statusText(t));
        const m = still ? -2 : modeId(t) * 2 + (simOn ? 1 : 0);
        if (m !== lastMode) {
            lastMode = m;
            doneP.textContent = speakText(t);
        }
    }
    // 프레임 간격이 튀어도 한 번에 몰리지 않게 자른다
    const DT_MAX = 0.05;
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        rafId = 0;
        if (still || paused || document.hidden) {
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        sceneT += dt;
        if (sceneT >= LAP_S) {
            sceneT -= LAP_S;
            lap += 1;
        }
        redraw();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 장면이 처음으로 돌아갈 때 해야 할 일이 있으면 이 함수를 바꿔 건다
    let onReset = function () { };
    let onSim = function () { };
    let onSetting = function (v) { void v; };
    function restart() {
        onReset();
        sceneT = 0;
        lap = 0;
        redraw();
        if (!paused && !still) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    const off = new AbortController();
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 Moves 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    still = reduceQuery.matches;
    function setSim(v) {
        simOn = v;
        simBtn.setAttribute('aria-pressed', v ? 'true' : 'false');
        onSim();
        redraw();
    }
    pauseBtn.addEventListener('click', function () { togglePause(); }, { signal: off.signal });
    simBtn.addEventListener('click', function () { setSim(!simOn); }, { signal: off.signal });
    pad.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            togglePause();
            return;
        }
        if (e.key === 's' || e.key === 'S') {
            e.preventDefault();
            setSim(!simOn);
            return;
        }
        if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            restart();
            return;
        }
        if (onKey(e)) {
            e.preventDefault();
            // 멈춘 채이거나 Moves 줄이기이면 루프가 없으니 바로 다시 그린다
            redraw();
        }
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 끝 장면 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        onSetting(still);
        if (still) {
            stopLoop();
            redraw();
        }
        else {
            restart();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        redraw();
    }, { signal: off.signal });
    // 캔버스 좌표(480×300) — 화면 크기와 상관없이 같은 좌표계
    function stageXY(e) {
        const r = cv.getBoundingClientRect();
        return [((e.clientX - r.left) / r.width) * W, ((e.clientY - r.top) / r.height) * H];
    }
    // 쓰는 곡선 두 개 — CSS 기본 키워드와 같은 제어값
    const EASE_OUT = cubic(0, 0, 0.58, 1);
    const EASE_IN_OUT = cubic(0.42, 0, 0.58, 1);
    // 화면이 1초에 60번 그려진다고 보고 값을 잰다
    const FPS = 60;
    // 모든 장면이 쓰는 줄 간격 — 위쪽 44 까지는 상태 줄과 버튼 자리
    const TOP = 44;
    function fm(v, d) { return (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d); }
    // 이름표가 붙은 한 칸. live 이면 지금 이 페이지가 따르는 판이라 색 테두리를 두른다
    function pane(x, y, w, h, title, c, live) {
        box(x, y, w, h, 10, PANEL, 1);
        if (live) {
            box(x, y, w, h, 10, c, 0.12);
            ctx.beginPath();
            ctx.roundRect(x + 1, y + 1, w - 2, h - 2, 9);
            ctx.strokeStyle = rgba(c, 1);
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        text(title, x + 10, y + 11, c, 11, 800, 'left', w - 20);
    }
    // 위치 함수 f(t) 가 t0 에서 t1 까지 가는 길이의 합 — 1/60 초 간격 표본
    function pathLen(f, t0, t1) {
        let sum = 0;
        let prev = f(t0);
        for (let t = t0 + 1 / FPS; t <= t1 + 1e-9; t += 1 / FPS) {
            const v = f(t);
            sum += Math.abs(v - prev);
            prev = v;
        }
        return sum;
    }
    // 비교 막대 한 줄 — Normal 값(ROSE)과 reduce 값(MINT)을 같은 눈금에 겹쳐 놓고 오른쪽에 숫자
    function cmpRow(y, name, a, b, maxV, unit, dec) {
        text(name, 24, y + 8, PAPER, 10.5, 700, 'left', 126);
        const bx = 156;
        const bw = 190;
        box(bx, y + 1, bw, 6, 3, [78, 72, 104], 1);
        box(bx, y + 1, Math.max(2, bw * clamp(a / maxV, 0, 1)), 6, 3, ROSE, 1);
        box(bx, y + 9, bw, 6, 3, [78, 72, 104], 1);
        box(bx, y + 9, Math.max(2, bw * clamp(b / maxV, 0, 1)), 6, 3, MINT, 1);
        text(fm(a, dec) + ' → ' + fm(b, dec) + ' ' + unit, 456, y + 8, SUN, 10.5, 800, 'right', 100, true);
    }
    // 줄어든 비율(%) — Normal 값이 0 이면 0
    function cut(a, b) { return a <= 0 ? 0 : (1 - b / a) * 100; }
    const NORMAL_T = ['Normal', ROSE];
    const REDUCE_T = ['Reduce version', MINT];
    // 칸 전체에 깔리는 옅은 색 — 알파가 지금 움직임의 세기를 따라가 칸이 얼마나 살아 있는지 한눈에 보인다
    function wash(x, a, c) { box(x, TOP, 224, 150, 10, c, clamp(a, 0, 0.5)); }
    // 순간 변화율(초당) — 앞뒤 0.02초의 차이
    function rateAt(f, t) {
        const h = 0.02;
        return Math.abs(f(t + h) - f(t - h)) / (2 * h);
    }
    // 한 프레임에서 가장 크게 바뀐 값을 1초당으로 환산 — 순간 Peak speed
    function peakRate(f, t0, t1) {
        let m = 0;
        let prev = f(t0);
        for (let t = t0 + 1 / FPS; t <= t1 + 1e-9; t += 1 / FPS) {
            const v = f(t);
            m = Math.max(m, Math.abs(v - prev));
            prev = v;
        }
        return m * FPS;
    }
    // 칸 안쪽만 그리도록 자른다 — 끝나면 clipEnd 로 푼다
    function clipPane(x, y, w, h) {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 10);
        ctx.clip();
    }
    function clipEnd() { ctx.restore(); }
    // 09 — 스크롤 진행률 p 에 묶인 값. 일반판은 p 에 따라 연속으로 바뀌고 reduce 판은 SEGMENTS 개 구간의 경계에서만 한 번에 바뀐다
    const SEGMENTS = 3;
    const UP_FROM = 0.3;
    const UP_TO = 2.3;
    const DOWN_FROM = 2.6;
    const DOWN_TO = 4.6;
    const LAP_S = 4.9;
    const REST_S = 2.4;
    let segs = SEGMENTS;
    // 스크롤 진행률 — 올라갔다 내려오는 한 바퀴(선형으로 두어 계단 경계가 시간에 비례한다)
    function progAt(t) {
        if (t < UP_TO) {
            return clamp((t - UP_FROM) / (UP_TO - UP_FROM), 0, 1);
        }
        return 1 - clamp((t - DOWN_FROM) / (DOWN_TO - DOWN_FROM), 0, 1);
    }
    // 연속값과 계단값 — 계단값은 구간 번호를 구간 수에서 1 뺀 값으로 나눠 마지막 구간이 1 이 되게 한다
    function contV(p) { return p; }
    function stepV(p) { return Math.floor(Math.min(p, 0.9999) * segs) / (segs - 1); }
    let changedN = 0;
    let changedR = 0;
    let stepPct = 0;
    let maxGap = 0;
    let frameN = 0;
    function calc() {
        changedN = 0;
        changedR = 0;
        maxGap = 0;
        const n = Math.round((UP_TO - UP_FROM) * FPS);
        frameN = n;
        let pc = contV(0);
        let ps = stepV(0);
        for (let i = 1; i <= n; i += 1) {
            const p = i / n;
            if (Math.abs(contV(p) - pc) > 1e-9) {
                changedN += 1;
            }
            if (Math.abs(stepV(p) - ps) > 1e-9) {
                changedR += 1;
            }
            pc = contV(p);
            ps = stepV(p);
        }
        for (let i = 0; i <= 2000; i += 1) {
            maxGap = Math.max(maxGap, Math.abs(stepV(i / 2000) - contV(i / 2000)));
        }
        stepPct = 100 / (segs - 1);
    }
    function graph(x, p, stepped, c) {
        const g = { x: x + 128, y: TOP + 38, w: 80, h: 80, lo: 0, hi: 1 };
        box(g.x - 4, g.y - 4, g.w + 8, g.h + 8, 6, [78, 72, 104], 0.6);
        // 곡선 — 계단판이면 구간마다 수평선
        ctx.beginPath();
        for (let i = 0; i <= 80; i += 1) {
            const q = i / 80;
            const v = stepped ? stepV(q) : contV(q);
            const px = gX(g, q);
            const py = gY(g, v);
            if (i === 0) {
                ctx.moveTo(px, py);
            }
            else {
                ctx.lineTo(px, py);
            }
        }
        ctx.strokeStyle = rgba(c, 1);
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.stroke();
        const v = stepped ? stepV(p) : contV(p);
        disc(gX(g, p), gY(g, v), 4, PAPER, 1);
    }
    function side(x, p, stepped, c) {
        const v = stepped ? stepV(p) : contV(p);
        // 왼쪽 길 — 카드가 아래에서 위로 올라오고 투명도가 짙어진다. 구간 경계에 눈금
        const tx = x + 26;
        box(tx, TOP + 26, 6, 92, 3, [78, 72, 104], 1);
        box(tx, TOP + 26 + 92 * (1 - p), 6, 92 * p, 3, DIM, 0.6);
        if (stepped) {
            for (let i = 1; i < segs; i += 1) {
                seg(tx - 4, TOP + 26 + 92 * (1 - i / segs), tx + 10, TOP + 26 + 92 * (1 - i / segs), SUN, 1, 1.5);
            }
        }
        const cy = TOP + 100 - v * 66;
        box(x + 44, cy - 14, 64, 30, 8, c, 0.35 + 0.65 * v);
        box(x + 52, cy - 6, 38, 5, 2.5, INK, 0.55);
        box(x + 52, cy + 4, 24, 5, 2.5, INK, 0.3);
        graph(x, p, stepped, c);
    }
    function draw(t) {
        const live = reduceNow();
        pane(14, TOP, 224, 150, NORMAL_T[0], NORMAL_T[1], !live);
        pane(242, TOP, 224, 150, REDUCE_T[0], REDUCE_T[1], live);
        const p = progAt(t);
        wash(14, 0.04 + 0.2 * contV(p), ROSE);
        wash(242, 0.04 + 0.2 * stepV(p), MINT);
        side(14, p, false, ROSE);
        side(242, p, true, MINT);
        text(fill('Progress {a}% · value {b}', fm(p * 100, 0), fm(contV(p), 2)), 126, TOP + 139, PAPER, 10.5, 700, 'center', 204, true);
        text(fill('Progress {a}% · value {b}', fm(p * 100, 0), fm(stepV(p), 2)), 354, TOP + 139, PAPER, 10.5, 700, 'center', 204, true);
        box(14, 200, 452, 62, 10, PANEL, 1);
        cmpRow(207, 'Frames with a change', changedN, changedR, frameN, '', 0);
        cmpRow(231, 'Largest change in one frame', 100 / frameN, stepPct, stepPct, '%', 1);
        hud('SEGMENTS', String(segs), segs / 8);
    }
    function statusText(t) {
        void t;
        return fill('{a} segments · changes {b} to {c} · gap {d}%', String(segs), String(changedN), String(changedR), fm(maxGap * 100, 0));
    }
    function modeId(t) { return segs * 10 + (t < UP_FROM ? 0 : (t < UP_TO ? 1 : (t < DOWN_FROM ? 2 : 3))); }
    function speakText(t) {
        void t;
        return fill('With {a} segments the reduce version changes its value only {b} times during one scroll up, {c} percent at a time. The normal version changes on all {d} frames, and the largest gap from the continuous value is {e} percent', String(segs), String(changedR), fm(stepPct, 1), String(changedN), fm(maxGap * 100, 0));
    }
    function onKey(e) {
        if (e.key === 'ArrowLeft') {
            segs = Math.max(2, segs - 1);
            calc();
            return true;
        }
        if (e.key === 'ArrowRight') {
            segs = Math.min(8, segs + 1);
            calc();
            return true;
        }
        return false;
    }
    function sceneInit() { calc(); }
    sceneInit();
    fitCanvas();
    // 캔버스 설명에는 이 장면이 계산한 핵심 값이 든 문장을 쓴다
    cv.setAttribute('aria-label', speakText(REST_S));
    redraw();
    if (!still) {
        startLoop();
    }
    return function () {
        stopLoop();
        off.abort();
    };
}
})();
</script>
</body>
</html>
