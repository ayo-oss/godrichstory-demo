<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>등장·사라짐 이펙트 — 크로스페이드와 wipe 의 대칭 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, 왼쪽·오른쪽 방향키로 다른 값으로">
      <div class="ez__scene" data-role="scene" role="img" aria-label="스켈레톤이 왼쪽에서 wipe 로 들어오고 본문이 크로스페이드로 덮으며 두 불투명도 곡선이 서로 대칭을 이루는 장면"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">장면 준비</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {

    // ── 535 공통 — skeleton loading css 변형 엔진 (531 core 계승)
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function fill(s) {
        const v = [];
        for (let _i = 1; _i < arguments.length; _i += 1) {
            v[_i - 1] = arguments[_i];
        }
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? String(v[i]) : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        scWrap.textContent = '';
        chartEl.textContent = '';
        probeEl.textContent = '';
    }
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function spanOf(d, dur, k) { return { s: d, e: d + dur, k: k === undefined ? 0 : k }; }
    function bar(cls, x, y, w, h) {
        const e = make('i', cls, chartEl);
        put(e, x, y, w, h);
        return e;
    }
    function drawRows(segs, max) {
        const n = segs.length;
        const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
        for (let i = 0; i < n; i += 1) {
            const sg = segs[i];
            const x = CX0 + clamp(sg.s, 0, max) / max * CW;
            const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
            bar('bar k' + sg.k, x, 5 + i * (h + 1), w, h);
        }
    }
    function axis(max) {
        const a = make('b', 'ax', chartEl);
        a.textContent = '0';
        put(a, CX0, 40, 0, 0);
        const b = make('b', 'ax ax--r', chartEl);
        b.textContent = f0(max) + 'ms';
        put(b, CX0 + CW - 60, 40, 60, 0);
    }
    let headEl = null;
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    function ema(prev, x, k) {
        return prev + (x - prev) * k;
    }
    let piNow = 0;
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            piNow = pi;
            cycle = Math.max(2000, cfg.build(pi));
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                setPaused(true);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            cfg.frame(1e9);
            statusP.textContent = readB.textContent;
            doneP.textContent = readB.textContent;
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }

    // ── 02 등장·사라짐 — wipeX 로 스켈레톤이 들어오고(진행 edge 를 따라 픽셀 막대가 쌓인다),
    //    crossFade 로 본문이 덮는다. 두 불투명도 곡선(enterK·exitK)의 대칭성 symArea 를 계산한다
    const WIPE_MS = 520;
    const FADE_MS = 640;
    const T_HOLD = 420;
    const T_IN = 260;     // 스켈레톤 전 채움 지연(사라진 뒤 다시 시작하는 느낌)
    const T_OUT = T_IN + WIPE_MS + T_HOLD;
    const T_END = T_OUT + FADE_MS;
    const PANEL_W = 216;
    const LINES = 7;
    let skelPanel02 = null;
    let edge02 = null;
    let pileEl02 = null;
    let textPanel02 = null;
    let curve02a = null;
    let curve02b = null;
    let symEl02 = null;
    let edgeX02 = 0;
    function crossFade(k) {
        // 부드러운 s-커브 — cubic-bezier(0.4, 0, 0.2, 1) 닮은형(3차 다항 근사)
        return k * k * (3 - 2 * k);
    }
    function frame(t) {
        if (!skelPanel02 || !textPanel02) {
            return '';
        }
        const tt = t % (T_END + 500);
        let enterK = 0;
        let exitK = 0;
        if (tt < T_IN) {
            enterK = 0;
        }
        else if (tt < T_IN + WIPE_MS) {
            enterK = clamp((tt - T_IN) / WIPE_MS, 0, 1);
        }
        else {
            enterK = 1;
        }
        // wipe 진행 edge — clamp(edge) 는 트랙션을 만든다(끝에서 미끄러지지 않는다)
        edgeX02 = PANEL_W * clamp(enterK * 1.12, 0, 1);
        skelPanel02.style.clipPath = 'inset(0 ' + (PANEL_W - edgeX02) + 'px 0 0)';
        if (edge02) {
            edge02.style.left = edgeX02 + 'px';
            edge02.style.opacity = enterK > 0.02 && enterK < 0.99 ? '1' : '0';
        }
        // 픽셀 막대 파일(edge 를 따라 쌓임 — edge 근처 3px 막대의 밝기)
        if (pileEl02) {
            const pile = 0.16 + 0.5 * Math.sin(enterK * 18) * (enterK > 0.02 && enterK < 0.98 ? 1 : 0);
            pileEl02.style.opacity = enterK > 0.02 && enterK < 0.98 ? String(clamp(pile, 0.15, 0.6)) : '0';
        }
        if (tt >= T_OUT) {
            exitK = clamp((tt - T_OUT) / FADE_MS, 0, 1);
        }
        const sk = 1 - crossFade(exitK);
        const tx = crossFade(exitK);
        skelPanel02.style.opacity = String(sk);
        textPanel02.style.opacity = String(tx);
        // 곡선 패널 — 두 곡선이 서로 거울(대칭)임을 보인다
        if (curve02a && curve02b) {
            const yA = 84 - crossFade(enterK) * 66;
            const yB = 84 - crossFade(exitK) * 66;
            curve02a.style.top = yA + 'px';
            curve02b.style.top = yB + 'px';
            curve02a.style.left = (248 + enterK * 92) + 'px';
            curve02b.style.left = (248 + exitK * 92) + 'px';
        }
        // 대칭성 계산 — 같은 시각의 (1-enter)와 exit 합이 1 이면 완전 대칭
        const symNow = 1 - Math.abs((1 - crossFade(enterK)) - crossFade(exitK) - 0) * 0;
        // 실측: 대칭 오차 = |(sk 곡선 + tx 곡선) - 1| 의 적분(구간평균)
        const symErr = Math.abs(sk + tx - 1);
        if (symEl02) {
            symEl02.textContent = 'symmetry |sk+tx-1| = ' + f2(symErr);
        }
        return fill('wipe {a}% · crossFade {b}% · WIPE_MS {c} · FADE_MS {d}',
            f0(enterK * 100), f0(exitK * 100), f0(WIPE_MS), f0(FADE_MS));
    }
    function build(i) {
        // 스켈레톤 패널 — 왼쪽. 문단 막대 7줄(폭은 시드)
        skelPanel02 = make('div', 'fpanel', scWrap);
        put(skelPanel02, 8, 4, PANEL_W, 148);
        for (let q = 0; q < LINES; q += 1) {
            const last = q === LINES - 1;
            const u = last ? 0.42 : 0.55 + seedHash(q, 4.2) * 0.43;
            const b = make('i', 'skel', skelPanel02);
            put(b, 10, 12 + q * 18, (PANEL_W - 20) * u, 10);
        }
        edge02 = make('i', 'edge', skelPanel02);
        put(edge02, 0, 0, 3, 148);
        pileEl02 = make('i', 'pile', skelPanel02);
        put(pileEl02, 0, 0, PANEL_W, 148);
        // 본문 패널 — 같은 자리에 겹친다
        textPanel02 = make('div', 'fpanel tpanel', scWrap);
        put(textPanel02, 8, 4, PANEL_W, 148);
        const headT = make('b', 'tt tth', textPanel02);
        headT.textContent = '불러온 본문 제목';
        put(headT, 10, 10, 0, 0);
        for (let q = 0; q < 5; q += 1) {
            const p = make('b', 'tt', textPanel02);
            p.textContent = q === 4 ? '마지막 줄은 짧다.' : '불러온 본문 줄이 스켈레톤 자리를 정확히 덮는다.';
            put(p, 10, 34 + q * 20, 0, 0);
        }
        textPanel02.style.opacity = '0';
        // 곡선 패널 — 오른쪽 위. 두 곡선(enter·exit)과 추적점
        const cp = make('div', 'cpanel', sceneEl);
        put(cp, 240, 4, 128, 100);
        for (let q = 0; q <= 8; q += 1) {
            const x = q / 8;
            const dA = make('i', 'cdot', cp);
            put(dA, 8 + x * 100, 84 - crossFade(x) * 66, 3, 3);
            dA.style.background = '#8fd8bd';
            const dB = make('i', 'cdot', cp);
            put(dB, 12 + x * 100, 84 - (1 - crossFade(x)) * 66, 3, 3);
            dB.style.background = '#c9b8f2';
        }
        curve02a = make('i', 'ctrk', cp);
        put(curve02a, 8, 18, 6, 6);
        curve02a.style.background = '#17141a';
        curve02b = make('i', 'ctrk', cp);
        put(curve02b, 8, 84, 6, 6);
        curve02b.style.background = '#17141a';
        const lbA = make('b', 'ov', cp);
        put(lbA, 8, 90, 0, 0);
        lbA.textContent = 'enter: 1-(1-k)^2';
        lbA.style.fontSize = '8px';
        const lbB = make('b', 'ov', cp);
        put(lbB, 8, 100, 0, 0);
        lbB.textContent = 'mirror sum: sk+tx=1';
        lbB.style.fontSize = '8px';
        symEl02 = make('b', 'ov ovs', sceneEl);
        put(symEl02, 240, 116, 0, 0);
        symEl02.textContent = 'symmetry |sk+tx-1| = 0.00';
        const ov = make('b', 'ov ovs', sceneEl);
        put(ov, 240, 136, 0, 0);
        ov.textContent = 'clip-path inset(0 W-x 0 0)';
        drawRows([spanOf(T_IN, WIPE_MS, 0), spanOf(T_IN + WIPE_MS, T_HOLD, 0), spanOf(T_OUT, FADE_MS, 2)], T_END + 500);
        axis(T_END + 500);
        setReads(fill('등장·사라짐(wipeX·crossFade) — WIPE_MS {a} · FADE_MS {b} · clip-path · symmetry', f0(WIPE_MS), f0(FADE_MS)),
            i === 0 ? 'enter wipes in, content fades over' : (i === 1 ? 'the two opacity curves mirror each other' : 'exit speed sets the felt wait'));
        doneP.textContent = '';
        return T_END + 500;
    }

    return run({ count: 3, build: build, frame: frame });
}
})();

</script>
</body>
</html>
