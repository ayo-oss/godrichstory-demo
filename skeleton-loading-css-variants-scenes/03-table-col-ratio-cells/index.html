<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>표형 스켈레톤 — 열 비율과 행 높이 배분 계산 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, 왼쪽·오른쪽 방향키로 다른 값으로">
      <div class="ez__scene" data-role="scene" role="img" aria-label="실측 내용 폭이 열 비율로 정규화되어 표 트랙이 되고 셀이 대각선 순서로 앉는 장면"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">장면 준비</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {

    // ── 535 공통 — skeleton loading css 변형 엔진 (531 core 계승)
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function fill(s) {
        const v = [];
        for (let _i = 1; _i < arguments.length; _i += 1) {
            v[_i - 1] = arguments[_i];
        }
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? String(v[i]) : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        scWrap.textContent = '';
        chartEl.textContent = '';
        probeEl.textContent = '';
    }
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function spanOf(d, dur, k) { return { s: d, e: d + dur, k: k === undefined ? 0 : k }; }
    function bar(cls, x, y, w, h) {
        const e = make('i', cls, chartEl);
        put(e, x, y, w, h);
        return e;
    }
    function drawRows(segs, max) {
        const n = segs.length;
        const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
        for (let i = 0; i < n; i += 1) {
            const sg = segs[i];
            const x = CX0 + clamp(sg.s, 0, max) / max * CW;
            const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
            bar('bar k' + sg.k, x, 5 + i * (h + 1), w, h);
        }
    }
    function axis(max) {
        const a = make('b', 'ax', chartEl);
        a.textContent = '0';
        put(a, CX0, 40, 0, 0);
        const b = make('b', 'ax ax--r', chartEl);
        b.textContent = f0(max) + 'ms';
        put(b, CX0 + CW - 60, 40, 60, 0);
    }
    let headEl = null;
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    function gammaSample(shape, scale, seed, i) {
        const d = shape - 1 / 3;
        const c = 1 / Math.sqrt(9 * d);
        let guard = 0;
        while (guard < 64) {
            guard += 1;
            const u1 = seedHash(i * 7 + guard, seed);
            const u2 = seedHash(i * 13 + guard * 5, seed);
            const rr = Math.sqrt(-2 * Math.log(Math.max(u1, 1e-9))) * Math.cos(6.28318 * u2);
            const v = Math.pow(1 + c * rr, 3);
            if (v <= 0) { continue; }
            const u3 = seedHash(i * 29 + guard * 11, seed);
            if (Math.log(Math.max(u3, 1e-9)) < 0.5 * rr * rr + d - d * v + d * Math.log(v)) {
                return d * v * scale;
            }
        }
        return shape * scale;
    }
    let piNow = 0;
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            piNow = pi;
            cycle = Math.max(2000, cfg.build(pi));
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                setPaused(true);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            cfg.frame(1e9);
            statusP.textContent = readB.textContent;
            doneP.textContent = readB.textContent;
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }

    // ── 03 표형 스켈레톤 — colRatio 가 실측 내용 폭을 열 트랙 비율로 정규화하고 autoFit 이
    //    표 폭(404px)에 트랙 px 를 배분한다. 셀은 staggerZ 대각 순서로 앉는다(앉는 순서 =
    //    지그 순번 k = row + col). 행 높이 배분 fitRows 도 같은 주기에 계산해 보여준다
    const COLS = [
        { name: '이름', px: 72 },
        { name: '상태', px: 48 },
        { name: '금액', px: 88 },
        { name: '날짜', px: 96 },
        { name: '관리', px: 40 }
    ];
    const ROWS = 6;
    const TABLE_X = 8;
    const TABLE_Y = 6;
    const TABLE_W = 404;
    let cells03 = [];
    let headCells03 = [];
    let ratioBars03 = [];
    let shim03 = null;
    let tableEl03 = null;
    let errEl03 = null;
    function colRatio() {
        let sum = 0;
        for (let i = 0; i < COLS.length; i += 1) {
            sum += COLS[i].px;
        }
        const out = [];
        for (let i = 0; i < COLS.length; i += 1) {
            out.push(COLS[i].px / sum);
        }
        return out;
    }
    function autoFit(ratios, total) {
        const out = [];
        let used = 0;
        for (let i = 0; i < ratios.length; i += 1) {
            if (i === ratios.length - 1) {
                out.push(total - used); // 마지막 트랙은 반올림 오차를 흡수한다
            }
            else {
                const w = Math.round(ratios[i] * total);
                out.push(w);
                used += w;
            }
        }
        return out;
    }
    function staggerZ(row, col) {
        return row + col;
    }
    function frame(t) {
        if (cells03.length === 0) {
            return '';
        }
        if (shim03 && tableEl03) {
            shimAt03(shim03, TABLE_W, t, 1400);
        }
        // 잔여 비율 오차 — autoFit 반올림이 트랙을 얼마나 어긋나게 했는지
        if (errEl03) {
            const rat = colRatio();
            const fit = autoFit(rat, TABLE_W);
            let e = 0;
            for (let i = 0; i < rat.length; i += 1) {
                e += Math.abs(fit[i] / TABLE_W - rat[i]);
            }
            errEl03.textContent = 'fitErr Σ|px/W-ratio| = ' + f2(e);
        }
        return fill('열 {a}개 비율 합 {b} · autoFit {c}px · staggerZ 최대 {d}',
            f0(COLS.length), f2(colRatio().reduce(function (a, b) { return a + b; }, 0)), f0(TABLE_W), f0(ROWS + COLS.length - 2));
    }
    function shimAt03(s, hostW, t, period) {
        const k = (((t % period) + period) % period) / period;
        s.style.transform = 'translateX(' + ((k * 1.6 - 0.3) * hostW) + 'px)';
        s.style.opacity = k > 0.94 ? '0' : '1';
    }
    function build(i) {
        const rat = colRatio();
        const fit = autoFit(rat, TABLE_W);
        // 비율 막대 패널 (맨 위) — 실측 px → 비율 → px 배분의 여정
        const rb = make('div', 'rbar', scWrap);
        put(rb, TABLE_X, TABLE_Y, TABLE_W, 16);
        let rx = 0;
        ratioBars03 = [];
        for (let c = 0; c < fit.length; c += 1) {
            const b = make('i', 'rseg k' + (c % 3), rb);
            put(b, rx, 0, fit[c] - 2, 14);
            rx += fit[c];
            ratioBars03.push(b);
        }
        // 표 골격
        tableEl03 = make('div', 'tbl', scWrap);
        put(tableEl03, TABLE_X, TABLE_Y + 22, TABLE_W, 0);
        headCells03 = [];
        cells03 = [];
        let x = 0;
        const headH = 22;
        for (let c = 0; c < COLS.length; c += 1) {
            const h = make('i', 'tcell thead', tableEl03);
            put(h, x, 0, fit[c] - 4, headH - 4);
            h.style.animationDelay = (staggerZ(0, c) * 60) + 'ms';
            headCells03.push(h);
            x += fit[c];
        }
        const rowH = 17;
        for (let r = 0; r < ROWS; r += 1) {
            let xx = 0;
            for (let c = 0; c < COLS.length; c += 1) {
                const cell = make('i', 'tcell', tableEl03);
                put(cell, xx, headH + r * rowH, fit[c] - 4, rowH - 4);
                cell.style.animationDelay = (staggerZ(r, c) * 60 + 80) + 'ms';
                // 셀 안 막대 — 열 비율의 감마 샘플(짧은 셀도 있다)
                const inner = make('i', 'tbar', cell);
                const u = clamp(gammaSample(2.4, 0.34, 2.2 + i, r * COLS.length + c), 0.3, 0.94);
                put(inner, 2, 5, (fit[c] - 8) * u, 6);
                cells03.push(cell);
                xx += fit[c];
            }
        }
        shim03 = make('i', 'shim', tableEl03);
        put(shim03, 0, 0, TABLE_W * 0.3, headH + ROWS * rowH);
        errEl03 = make('b', 'ov ovs', sceneEl);
        put(errEl03, 8, 152, 0, 0);
        errEl03.textContent = 'fitErr …';
        const ov = make('b', 'ov ovs', sceneEl);
        put(ov, 238, 152, 0, 0);
        ov.textContent = 'colRatio → autoFit(' + f0(TABLE_W) + 'px)';
        drawRows([spanOf(0, 600, 0), spanOf(600, 400, 1), spanOf(1000, 900, 2)], 2000);
        axis(2000);
        setReads(fill('표형 스켈레톤(colRatio·autoFit·staggerZ) — 열 {a} · 행 {b} · 비율합 {c}', f0(COLS.length), f0(ROWS), f2(rat.reduce(function (a, b) { return a + b; }, 0))),
            i === 0 ? 'measured content widths become track ratios' : (i === 1 ? 'autoFit absorbs rounding in the last track' : 'cells seat on the row+col diagonal'));
        doneP.textContent = '';
        return 2000;
    }

    return run({ count: 3, build: build, frame: frame });
}
})();

</script>
</body>
</html>
