<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마크업 구조형 스켈레톤 — 시맨틱 골격과 aria-busy — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, 왼쪽·오른쪽 방향키로 다른 값으로">
      <div class="ez__scene" data-role="scene" role="img" aria-label="시맨틱 애노테이션이 붙은 아티클 골격이 조립되고 문단 막대 폭이 실측 분포 샘플로 정해진 뒤 본문 실측 폭과 겹쳐지는 장면"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">장면 준비</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {

    // ── 535 공통 — skeleton loading css 변형 엔진 (531 core 계승, 채팅 버블 대신 아티클 골격·CSS 조판 판)
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function fill(s) {
        const v = [];
        for (let _i = 1; _i < arguments.length; _i += 1) {
            v[_i - 1] = arguments[_i];
        }
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? String(v[i]) : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        scWrap.textContent = '';
        chartEl.textContent = '';
        probeEl.textContent = '';
    }
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function spanOf(d, dur, k) { return { s: d, e: d + dur, k: k === undefined ? 0 : k }; }
    function bar(cls, x, y, w, h) {
        const e = make('i', cls, chartEl);
        put(e, x, y, w, h);
        return e;
    }
    function drawRows(segs, max) {
        const n = segs.length;
        const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
        for (let i = 0; i < n; i += 1) {
            const sg = segs[i];
            const x = CX0 + clamp(sg.s, 0, max) / max * CW;
            const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
            bar('bar k' + sg.k, x, 5 + i * (h + 1), w, h);
        }
    }
    function axis(max) {
        const a = make('b', 'ax', chartEl);
        a.textContent = '0';
        put(a, CX0, 40, 0, 0);
        const b = make('b', 'ax ax--r', chartEl);
        b.textContent = f0(max) + 'ms';
        put(b, CX0 + CW - 60, 40, 60, 0);
    }
    let headEl = null;
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    function ema(prev, x, k) {
        return prev + (x - prev) * k;
    }
    // cdfInvert — 역누적분포 샘플링. r^expo: expo>1 이면 짧은 쪽(마지막 줄)으로 몰린다
    function cdfInvert(r, expo, lo, hi) {
        return lo + (hi - lo) * Math.pow(r, expo);
    }
    function gammaSample(shape, scale, seed, i) {
        const d = shape - 1 / 3;
        const c = 1 / Math.sqrt(9 * d);
        let guard = 0;
        while (guard < 64) {
            guard += 1;
            const u1 = seedHash(i * 7 + guard, seed);
            const u2 = seedHash(i * 13 + guard * 5, seed);
            const rr = Math.sqrt(-2 * Math.log(Math.max(u1, 1e-9))) * Math.cos(6.28318 * u2);
            const v = Math.pow(1 + c * rr, 3);
            if (v <= 0) { continue; }
            const u3 = seedHash(i * 29 + guard * 11, seed);
            if (Math.log(Math.max(u3, 1e-9)) < 0.5 * rr * rr + d - d * v + d * Math.log(v)) {
                return d * v * scale;
            }
        }
        return shape * scale;
    }
    // 스켈레톤 막대 — CSS 클래스 .skel 이 자리를 잡는다 (폭은 계산이 정한다)
    function skelBar(parent, x, y, w, h, delay) {
        const e = make('i', 'skel', parent);
        put(e, x, y, Math.max(12, w), h);
        e.style.animationDelay = (delay || 0) + 'ms';
        return e;
    }
    function mkShim(host) {
        return make('i', 'shim', host);
    }
    function shimAt(s, hostW, t, period) {
        const k = (((t % period) + period) % period) / period;
        s.style.transform = 'translateX(' + ((k * 1.6 - 0.3) * hostW) + 'px)';
        s.style.opacity = k > 0.94 ? '0' : '1';
    }
    let piNow = 0;
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            piNow = pi;
            cycle = Math.max(2000, cfg.build(pi));
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                setPaused(true);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            cfg.frame(1e9);
            statusP.textContent = readB.textContent;
            doneP.textContent = readB.textContent;
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }

    // ── 01 마크업 구조형 — mkBones 가 시맨틱 트리(head/thumb/lines)를 3단계로 조립하고,
    //    문단 막대 폭은 cdfInvert(실측 문단 길이 분포 닮은형)에서 뽑는다. 본문 도착 후 골격 폭과
    //    실측 폭을 겹쳐 errArea(절대 어긋남 면적)와 hitRate(±8% 이내 적중률)로 채점한다
    const LIN_BINS = 22;
    const LIN_EXPO = 2.0;
    const LIN_MIN = 0.16;
    const LIN_TOP = 0.95;
    const PARA_N = 6;
    const T_ASSEMBLE = 780; // 골격 조립 구간
    const T_SETTLE = 300;   // 어긋남 밴드 안착
    const CARD_X = 8;
    const CARD_Y = 4;
    const CARD_W = 268;
    let bars01 = [];
    let true01 = [];   // 실측 정규화 폭 — 본문 도착 후 공개
    let shim01 = null;
    let ariaEl = null;
    let errEl = null;
    let hitEl = null;
    let bandEls = [];    function mkBones(stage, seed) {
        // 아티클 카드 골격 — head(아바타+제목) / thumb / lines(문단). 시맨틱 애노테이션은
        // CSS 클래스가 아니라 data-bone 속성으로도 새겨 마크업 구조를 그대로 드러낸다
        const card = make('div', 'acard', scWrap);
        card.setAttribute('data-bone', 'article');
        put(card, CARD_X, CARD_Y, CARD_W, 148);
        const head = make('div', 'ahead', card);
        head.setAttribute('data-bone', 'head');
        put(head, 12, 12, 0, 0);
        const av = make('i', 'skel aav', head);
        put(av, 0, 0, 44, 44);
        const ttl = make('i', 'skel attl', head);
        put(ttl, 54, 4, 128, 14);
        const sub = make('i', 'skel asub', head);
        put(sub, 54, 26, 76, 8);
        const thumb = make('i', 'skel athumb', card);
        thumb.setAttribute('data-bone', 'thumb');
        put(thumb, 12, 64, 244, 34);
        bars01 = [];
        const lines = make('div', 'alines', card);
        lines.setAttribute('data-bone', 'lines');
        put(lines, 12, 104, 244, 0);
        for (let i = 0; i < PARA_N; i += 1) {
            const last = i === PARA_N - 1;
            const u = last ? 1 : cdfInvert(seedHash(i * 3 + 1, seed), LIN_EXPO, LIN_MIN, LIN_TOP);
            const w = 244 * u;
            const b = skelBar(lines, 0, i * 14, w, 8, stage * 260 + i * 45);
            b.setAttribute('data-bone', 'p');
            bars01.push(b);
        }
        return { card: card, av: av, ttl: ttl, sub: sub, thumb: thumb, lines: lines };
    }
    function frame(t) {
        if (bars01.length === 0) {
            return '';
        }
        const tt = t % 2600;
        if (shim01) {
            shimAt(shim01, CARD_W, t, 1500);
        }
        let err = 0;
        let hits = 0;
        if (tt >= T_ASSEMBLE + 160) {
            // 실측 폭 공개 — 감마 샘플(실측 문단이 아니라 '다음 문단'이라 시드만 다르다)
            if (bandEls.length === 0) {
                for (let i = 0; i < PARA_N; i += 1) {
                    const last = i === PARA_N - 1;
                    const u = last ? 1 : clamp(gammaSample(2.2, 0.38, 7.7, i), LIN_MIN, LIN_TOP);
                    true01[i] = u;
                    const band = make('i', 'band', scWrap);
                    const x = CARD_X + 12;
                    const y = CARD_Y + 104 + i * 14;
                    band.style.left = (x + 244 * u - 4) + 'px';
                    band.style.top = y + 'px';
                    band.style.height = '8px';
                    bandEls.push(band);
                }
            }
            for (let i = 0; i < PARA_N; i += 1) {
                const sk = bars01[i].offsetWidth / 244;
                const u = true01[i];
                err += Math.abs(sk - u);
                if (Math.abs(sk - u) <= 0.08) {
                    hits += 1;
                }
            }
            err = err / PARA_N;
            if (errEl) {
                errEl.textContent = 'errArea Σ|skel-real| = ' + f2(err);
            }
            if (hitEl) {
                hitEl.textContent = 'hitRate ±8% = ' + f0(hits / PARA_N * 100) + '%';
            }
        }
        else if (bandEls.length > 0) {
            bandEls = [];
            true01 = [];
        }
        if (ariaEl) {
            const busy = tt < T_ASSEMBLE + 160 ? 'true' : 'false';
            if (ariaEl.getAttribute('aria-busy') !== busy) {
                ariaEl.setAttribute('aria-busy', busy);
            }
        }
        return fill('골격 {a}단계 · cdfInvert 폭 {b}개 · errArea {c} · hit {d}%',
            tt < 260 ? '1' : (tt < 520 ? '2' : '3'),
            f0(bars01.length), f2(err), f0(hits / PARA_N * 100));
    }
    function build(i) {
        const seeds = [3.1, 5.9, 8.3];
        const bones = mkBones(Math.min(i, 2), seeds[i]);
        ariaEl = bones.card;
        shim01 = mkShim(bones.card);
        true01 = [];
        bandEls = [];
        errEl = make('b', 'ov ovs', sceneEl);
        put(errEl, 288, 16, 0, 0);
        errEl.textContent = 'errArea Σ|skel-real| = …';
        hitEl = make('b', 'ov ovs ovs--m', sceneEl);
        put(hitEl, 288, 40, 0, 0);
        hitEl.textContent = 'hitRate ±8% = …';
        const ov = make('b', 'ov ovs', sceneEl);
        put(ov, 288, 64, 0, 0);
        ov.textContent = 'mkBones: article>head+thumb+lines';
        const ov2 = make('b', 'ov ovs', sceneEl);
        put(ov2, 288, 88, 0, 0);
        ov2.textContent = 'aria-busy=true → false';
        const ttl2 = make('b', 'ov', sceneEl);
        put(ttl2, 288, 112, 0, 0);
        ttl2.textContent = 'LIN_BINS ' + f0(LIN_BINS) + ' · LIN_EXPO ' + f1(LIN_EXPO);
        ttl2.style.color = 'inherit';
        drawRows([spanOf(0, 260, 0), spanOf(260, 260, 0), spanOf(520, 260, 0), spanOf(T_ASSEMBLE + 160, T_SETTLE, 2), spanOf(T_ASSEMBLE + 460, 1000, 1)], 2600);
        axis(2600);
        setReads(fill('마크업 구조형(mkBones) — LIN_BINS {a} · LIN_EXPO {b} · cdfInvert · errArea · hitRate', f0(LIN_BINS), f1(LIN_EXPO)),
            i === 0 ? 'semantic bones assemble in three stages' : (i === 1 ? 'widths sampled from a measured distribution' : 'arrival reveals the mismatch band'));
        doneP.textContent = '';
        return 2600;
    }

    return run({ count: 3, build: build, frame: frame });
}
})();

</script>
</body>
</html>
