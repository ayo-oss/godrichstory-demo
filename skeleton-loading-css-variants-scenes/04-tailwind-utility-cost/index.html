<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tailwind 유틸리티 — animate-pulse 구성의 득실 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ez is-demo" id="ez">
  <div class="ez__in" data-role="inner">
    <div class="ez__pad" data-role="pad" tabindex="0" role="application" aria-label="시연 무대 — Space 또는 Enter 로 일시정지, R 로 처음부터, 왼쪽·오른쪽 방향키로 다른 값으로">
      <div class="ez__scene" data-role="scene" role="img" aria-label="같은 카드 골격이 왼쪽은 Tailwind 유틸리티 문자열로 오른쪽은 토큰 클래스로 조립되고 두 판의 선언 수·색 수·클래스 길이가 막대로 겹쳐지는 장면"></div>
      <div class="ez__probe" data-role="probe" aria-hidden="true"></div>
      <div class="ez__chart" data-role="chart" aria-hidden="true"></div>
      <p class="ez__status" data-role="status" aria-live="off">장면 준비</p>
      <p class="ez__reada" data-role="reada" aria-hidden="true"></p>
      <p class="ez__readb" data-role="readb" aria-hidden="true"></p>
      <div class="ez__ctrl">
        <button class="ez__pause" data-role="pause" type="button" aria-pressed="false">일시정지</button>
      </div>
      <p class="ez__done" data-role="done" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
    const rootEl = document.getElementById("ez");
    if (!rootEl) return;
    main(rootEl);
function cx(s) { return s; }
function main(root) {

    // ── 535 공통 — skeleton loading css 변형 엔진 (531 core 계승)
    const W = 480;
    const CX0 = 8;
    const CW = 432;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function fill(s) {
        const v = [];
        for (let _i = 1; _i < arguments.length; _i += 1) {
            v[_i - 1] = arguments[_i];
        }
        const keys = ['{a}', '{b}', '{c}', '{d}', '{e}', '{f}', '{g}', '{h}'];
        let o = s;
        for (let i = 0; i < keys.length; i += 1) {
            o = o.split(keys[i]).join(i < v.length ? String(v[i]) : '');
        }
        return o;
    }
    function f0(v) { return String(Math.round(v)); }
    function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    const rootEl = root;
    const innerQ = rootEl.querySelector('[data-role="inner"]');
    const sceneQ = rootEl.querySelector('[data-role="scene"]');
    const chartQ = rootEl.querySelector('[data-role="chart"]');
    const probeQ = rootEl.querySelector('[data-role="probe"]');
    const padQ = rootEl.querySelector('[data-role="pad"]');
    const pauseQ = rootEl.querySelector('[data-role="pause"]');
    const statusQ = rootEl.querySelector('[data-role="status"]');
    const readAQ = rootEl.querySelector('[data-role="reada"]');
    const readBQ = rootEl.querySelector('[data-role="readb"]');
    const doneQ = rootEl.querySelector('[data-role="done"]');
    if (!innerQ || !sceneQ || !chartQ || !probeQ || !padQ || !pauseQ || !statusQ || !readAQ || !readBQ || !doneQ) {
        return function () { };
    }
    const innerEl = innerQ;
    const sceneEl = sceneQ;
    const chartEl = chartQ;
    const probeEl = probeQ;
    const padEl = padQ;
    const pauseBtn = pauseQ;
    const statusP = statusQ;
    const readA = readAQ;
    const readB = readBQ;
    const doneP = doneQ;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function make(tag, cls, parent) {
        const e = document.createElement(tag);
        if (cls) {
            e.className = cx(cls);
        }
        parent.appendChild(e);
        return e;
    }
    function put(e, x, y, w, h) {
        e.style.left = x + 'px';
        e.style.top = y + 'px';
        if (w > 0) {
            e.style.width = w + 'px';
        }
        if (h > 0) {
            e.style.height = h + 'px';
        }
    }
    const scWrap = make('div', 'scwrap', sceneEl);
    const clkEl = make('i', 'clk', sceneEl);
    function clearAll() {
        scWrap.textContent = '';
        chartEl.textContent = '';
        probeEl.textContent = '';
    }
    function seedHash(i, seed) {
        const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }
    function animsIn(host) {
        return host.getAnimations({ subtree: true });
    }
    function spanOf(d, dur, k) { return { s: d, e: d + dur, k: k === undefined ? 0 : k }; }
    function bar(cls, x, y, w, h) {
        const e = make('i', cls, chartEl);
        put(e, x, y, w, h);
        return e;
    }
    function drawRows(segs, max) {
        const n = segs.length;
        const h = clamp(Math.floor((34 - (n - 1)) / n), 2, 7);
        for (let i = 0; i < n; i += 1) {
            const sg = segs[i];
            const x = CX0 + clamp(sg.s, 0, max) / max * CW;
            const w = Math.max(2, (clamp(sg.e, 0, max) - clamp(sg.s, 0, max)) / max * CW);
            bar('bar k' + sg.k, x, 5 + i * (h + 1), w, h);
        }
    }
    function axis(max) {
        const a = make('b', 'ax', chartEl);
        a.textContent = '0';
        put(a, CX0, 40, 0, 0);
        const b = make('b', 'ax ax--r', chartEl);
        b.textContent = f0(max) + 'ms';
        put(b, CX0 + CW - 60, 40, 60, 0);
    }
    let headEl = null;
    function setReads(a, b) {
        readA.textContent = a;
        readB.textContent = b;
    }
    let piNow = 0;
    function run(cfg) {
        const off = new AbortController();
        let pi = 0;
        let cycle = 2000;
        let paused = false;
        let raf = 0;
        let clock = null;
        let lastStatus = '';
        function fit() {
            const k = rootEl.clientWidth / W;
            innerEl.style.transform = 'scale(' + k + ')';
        }
        function rebuild() {
            clearAll();
            piNow = pi;
            cycle = Math.max(2000, cfg.build(pi));
            headEl = cfg.head === false ? null : make('i', 'ph', chartEl);
            clkEl.style.animationDuration = f0(cycle) + 'ms';
            const all = animsIn(sceneEl);
            clock = null;
            for (let i = 0; i < all.length; i += 1) {
                const an = all[i];
                if (an.animationName && an.effect && an.effect.target === clkEl) {
                    clock = an;
                }
            }
        }
        function restart() {
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                all[i].currentTime = 0;
                if (paused) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
        }
        function tick() {
            const ct = clock ? Number(clock.currentTime) : 0;
            const t = isFinite(ct) ? ct : 0;
            if (headEl) {
                headEl.style.transform = 'translateX(' + (CX0 + clamp(t / cycle, 0, 1) * CW) + 'px)';
            }
            const s = cfg.frame(t);
            if (s !== lastStatus) {
                statusP.textContent = s;
                lastStatus = s;
            }
            if (!paused && clock && t >= cycle - 1) {
                pi = (pi + 1) % cfg.count;
                rebuild();
                restart();
            }
            raf = requestAnimationFrame(tick);
        }
        function setPaused(p) {
            paused = p;
            pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
            const all = animsIn(sceneEl);
            for (let i = 0; i < all.length; i += 1) {
                if (p) {
                    all[i].pause();
                }
                else {
                    all[i].play();
                }
            }
            doneP.textContent = readB.textContent;
        }
        function shift(d) {
            pi = (pi + d + cfg.count) % cfg.count;
            rebuild();
            restart();
            doneP.textContent = readB.textContent;
        }
        pauseBtn.addEventListener('click', function () { setPaused(!paused); }, { signal: off.signal });
        padEl.addEventListener('keydown', function (ev) {
            if (ev.target === pauseBtn) {
                return;
            }
            if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                setPaused(!paused);
            }
            else if (ev.key === 'r' || ev.key === 'R') {
                shift(-pi);
            }
            else if (ev.key === 'ArrowRight') {
                ev.preventDefault();
                shift(1);
            }
            else if (ev.key === 'ArrowLeft') {
                ev.preventDefault();
                shift(-1);
            }
        }, { signal: off.signal });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                setPaused(true);
            }
        }, { signal: off.signal });
        window.addEventListener('resize', fit, { signal: off.signal });
        fit();
        rebuild();
        if (reduced) {
            cfg.frame(1e9);
            statusP.textContent = readB.textContent;
            doneP.textContent = readB.textContent;
        }
        else {
            restart();
            raf = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(raf);
            off.abort();
        };
    }

    // ── 04 Tailwind 유틸리티 — twStack(유틸리티 문자열)과 bemMatch(토큰 클래스)가 같은 카드
    //    골격을 각자 조립한다. tokDiff 계기가 두 판의 선언 수·고유 색 수·클래스 문자열 길이를
    //    세어 겹친 막대로 저울질한다
    const TW_LINES = [
        'animate-pulse flex gap-3',
        'h-11 w-11 rounded-full bg-neutral-200',
        'h-4 w-32 rounded bg-neutral-200',
        'h-3 w-20 rounded bg-neutral-200',
        'h-24 w-full rounded-lg bg-neutral-200',
        'h-3 w-full rounded bg-neutral-200',
        'h-3 w-2/3 rounded bg-neutral-200'
    ];
    const BEM_LINES = [
        'skel-card',
        'skel-av',
        'skel-line skel-line--title',
        'skel-line skel-line--sub',
        'skel-thumb',
        'skel-line',
        'skel-line skel-line--last'
    ];
    let meterEls04 = [];
    let meterLabels04 = [];
    let pulseEls04 = [];
    function countDecls(strs) {
        // 유틸리티 토큰 하나 ≈ 선언 1개 — twStack 문자열의 공백 단위 토큰 수
        let n = 0;
        for (let i = 0; i < strs.length; i += 1) {
            const parts = strs[i].split(' ');
            for (let q = 0; q < parts.length; q += 1) {
                if (parts[q].length > 0) {
                    n += 1;
                }
            }
        }
        return n;
    }
    function classLen(strs) {
        let n = 0;
        for (let i = 0; i < strs.length; i += 1) {
            n += strs[i].length;
        }
        return n;
    }
    function distinctColors(strs) {
        // 색 지정 유틸리티/선언 수 — bg-*·text-*·border-* 토큰 세기
        const set = {};
        for (let i = 0; i < strs.length; i += 1) {
            const m = strs[i].match(/(bg|text|border)-[a-z0-9-]+/g);
            if (m) {
                for (let q = 0; q < m.length; q += 1) {
                    set[m[q]] = 1;
                }
            }
        }
        return Object.keys(set).length;
    }
    function frame(t) {
        // 계기 막대 — 두 판의 실측값 비율이 주기 안에 차오른다
        const tt = t % 2000;
        const k = clamp(tt / 900, 0, 1);
        const twDecl = countDecls(TW_LINES);
        const bemDecl = TW_LINES.length + 4; // 카드+아바타+타이틀+섬네일(스타일 시트가 선언을 대신)
        const twLen = classLen(TW_LINES);
        const bemLen = classLen(BEM_LINES);
        const twCol = Math.max(1, distinctColors(TW_LINES));
        const vals = [
            [twDecl, bemDecl, 'decls'],
            [twLen, bemLen, 'class chars'],
            [twCol, 1, 'colors']
        ];
        for (let m = 0; m < meterEls04.length && m < vals.length; m += 1) {
            const mx = Math.max(vals[m][0], vals[m][1]) * 1.15;
            const wa = vals[m][0] / mx * 100 * k;
            const wb = vals[m][1] / mx * 100 * k;
            meterEls04[m][0].style.width = wa.toFixed(1) + '%';
            meterEls04[m][1].style.width = wb.toFixed(1) + '%';
            if (meterLabels04[m]) {
                meterLabels04[m].textContent = vals[m][2] + '  tw ' + f0(vals[m][0]) + ' / tok ' + f0(vals[m][1]);
            }
        }
        return fill('tw 토큰 {a} · tok 선언 {b} · 글자 {c}/{d} · 색 {e}/1',
            f0(twDecl), f0(bemDecl), f0(twLen), f0(bemLen), f0(twCol));
    }
    function build(i) {
        pulseEls04 = [];
        // 왼쪽 — twStack 판(유틸리티 클래스를 그대로 className 에)
        const cardA = make('div', 'cmp cmp--tw', scWrap);
        put(cardA, 8, 4, 214, 112);
        const labA = make('b', 'cmplab', cardA);
        labA.textContent = 'tailwind';
        put(labA, 8, 4, 0, 0);
        const avA = make('i', 'tw-el', cardA);
        avA.className = cx('tw-el') + ' animate-pulse';
        put(avA, 10, 18, 44, 44);
        avA.style.borderRadius = '50%';
        const tA = make('i', 'tw-el', cardA);
        put(tA, 60, 24, 120, 12);
        const sA = make('i', 'tw-el', cardA);
        put(sA, 60, 42, 72, 8);
        const thA = make('i', 'tw-el', cardA);
        put(thA, 10, 68, 194, 22);
        const lA = make('i', 'tw-el', cardA);
        put(lA, 10, 94, 194, 8);
        // 오른쪽 — bemMatch 판(토큰 클래스)
        const cardB = make('div', 'cmp cmp--tok', scWrap);
        put(cardB, 228, 4, 214, 112);
        const labB = make('b', 'cmplab', cardB);
        labB.textContent = 'token css';
        put(labB, 8, 4, 0, 0);
        const avB = make('i', 'tok-el', cardB);
        put(avB, 10, 18, 44, 44);
        avB.style.borderRadius = '50%';
        const tB = make('i', 'tok-el tok-el--t', cardB);
        put(tB, 60, 24, 120, 12);
        const sB = make('i', 'tok-el', cardB);
        put(sB, 60, 42, 72, 8);
        const thB = make('i', 'tok-el', cardB);
        put(thB, 10, 68, 194, 22);
        const lB = make('i', 'tok-el tok-el--last', cardB);
        put(lB, 10, 94, 194, 8);
        pulseEls04 = [avA, tA, sA, thB, avB, tB, lB];
        // tokDiff 계기 — 3줄 겹침 막대
        meterEls04 = [];
        meterLabels04 = [];
        for (let m = 0; m < 3; m += 1) {
            const row = make('div', 'mrow', scWrap);
            put(row, 8, 122 + m * 16, 432, 12);
            const bg = make('i', 'mtrack', row);
            put(bg, 0, 0, 432, 5);
            const b1 = make('i', 'mbar mbar--tw', row);
            put(b1, 0, 0, 0, 5);
            const b2 = make('i', 'mbar mbar--tok', row);
            put(b2, 0, 5, 0, 5);
            const lb = make('b', 'mlab', row);
            lb.textContent = '…';
            put(lb, 0, 0, 0, 0);
            meterEls04.push([b1, b2]);
            meterLabels04.push(lb);
        }
        const ov = make('b', 'ov ovs', sceneEl);
        put(ov, 240, 0, 0, 0);
        ov.textContent = 'tokDiff — tw vs token';
        drawRows([spanOf(0, 900, 0), spanOf(900, 1100, 2)], 2000);
        axis(2000);
        setReads(fill('Tailwind 대 토큰(twStack·bemMatch·tokDiff) — animate-pulse · h-4 · rounded'),
            i === 0 ? 'utilities compose fast, strings run long' : (i === 1 ? 'token classes stay short, styles live in scss' : 'both pulse in the same rhythm'));
        doneP.textContent = '';
        return 2000;
    }

    return run({ count: 3, build: build, frame: frame });
}
})();

</script>
</body>
</html>
