<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行が実際に位置を入れ替えて並び替わる表 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="srt is-demo" id="srt">
  <table class="srt__table" id="srtTable">
    <thead>
      <tr>
        <th scope="col" class="srt__th" data-key="name" aria-sort="none">
          <button type="button" class="srt__headerBtn">品目名</button>
        </th>
        <th scope="col" class="srt__th srt__th--num" data-key="qty" aria-sort="none">
          <button type="button" class="srt__headerBtn">数量</button>
        </th>
      </tr>
    </thead>
    <tbody id="srtBody">
      <tr data-id="1" data-name="りんご" data-qty="12"><td>りんご</td><td class="srt__num">12</td></tr>
      <tr data-id="2" data-name="バナナ" data-qty="27"><td>バナナ</td><td class="srt__num">27</td></tr>
      <tr data-id="3" data-name="チェリー" data-qty="8"><td>チェリー</td><td class="srt__num">8</td></tr>
      <tr data-id="4" data-name="なつめ" data-qty="19"><td>なつめ</td><td class="srt__num">19</td></tr>
      <tr data-id="5" data-name="ぶどう" data-qty="33"><td>ぶどう</td><td class="srt__num">33</td></tr>
    </tbody>
  </table>
</div>
</main>
<script>
(function () {
  var SORT_REORDER_MS = 250; // 변형 대상 — 정렬로 행이 이동하는 애니메이션 길이
  var AUTO_STEP_MS = 900;
  var AUTO_KEYS = ['name', 'qty'];

  var root = document.getElementById('srt');
  var table = document.getElementById('srtTable');
  var tbody = document.getElementById('srtBody');
  var headerCells = Array.prototype.slice.call(table.querySelectorAll('th[data-key]'));

  table.style.setProperty('--reorder-ms', SORT_REORDER_MS + 'ms');

  var currentKey = null;
  var currentDir = 'asc';

  function getRows() {
    return Array.prototype.slice.call(tbody.querySelectorAll('tr'));
  }

  function comparator(key, dir) {
    return function (a, b) {
      var av = a.dataset[key];
      var bv = b.dataset[key];
      if (key === 'qty') { av = Number(av); bv = Number(bv); }
      var cmp = av < bv ? -1 : (av > bv ? 1 : 0);
      return dir === 'asc' ? cmp : -cmp;
    };
  }

  function updateHeaders() {
    headerCells.forEach(function (th) {
      if (th.dataset.key === currentKey) {
        th.setAttribute('aria-sort', currentDir === 'asc' ? 'ascending' : 'descending');
      } else {
        th.setAttribute('aria-sort', 'none');
      }
    });
  }

  // 계산 겹: FLIP — 정렬 전 각 행의 화면 위치(First)를 재고, DOM 순서를 실제로 바꾼 뒤(Last)
  // 그 차이(Invert)만큼 transform 으로 되돌려 놓았다가 트랜지션으로 제자리로 흘려보낸다(Play).
  function sortBy(key) {
    var dir = (key === currentKey) ? (currentDir === 'asc' ? 'desc' : 'asc') : 'asc';
    currentKey = key;
    currentDir = dir;

    var rows = getRows();
    var first = {};
    rows.forEach(function (row) { first[row.dataset.id] = row.getBoundingClientRect().top; });

    rows.sort(comparator(key, dir));
    rows.forEach(function (row) { tbody.appendChild(row); });

    rows.forEach(function (row) {
      var last = row.getBoundingClientRect().top;
      var delta = first[row.dataset.id] - last;
      if (delta) {
        row.style.transition = 'none';
        row.style.transform = 'translateY(' + delta + 'px)';
        void row.offsetHeight;
        row.style.transition = '';
        row.style.transform = 'translateY(0)';
      }
    });

    updateHeaders();
  }

  function human() {
    if (root.classList.contains('is-demo')) {
      root.classList.remove('is-demo');
      if (timer) { window.clearInterval(timer); timer = null; }
    }
  }

  headerCells.forEach(function (th) {
    var btn = th.querySelector('button');
    btn.addEventListener('click', function () {
      human();
      sortBy(th.dataset.key);
    });
  });

  var timer = null;
  var seqPos = 0;

  function autoTick() {
    sortBy(AUTO_KEYS[seqPos % AUTO_KEYS.length]);
    seqPos += 1;
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    timer = window.setInterval(autoTick, AUTO_STEP_MS);
  } else {
    // reduce: 실사용 경로 적용 — 자동 정렬 루프를 멈춘다. 헤더 클릭 정렬·FLIP 계산은 그대로 동작(트랜지션만 scss 에서 제거)
  }
})();
</script>
</body>
</html>
