<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初回読み込み用リストスケルトン — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="skl is-demo" id="skl">
  <ul class="skl__list" id="sklList" aria-busy="true">
    <li class="skl__row" data-row="0">
      <span class="skl__bar" data-bar></span>
      <span class="skl__content" data-content hidden></span>
    </li>
    <li class="skl__row" data-row="1">
      <span class="skl__bar" data-bar></span>
      <span class="skl__content" data-content hidden></span>
    </li>
    <li class="skl__row" data-row="2">
      <span class="skl__bar" data-bar></span>
      <span class="skl__content" data-content hidden></span>
    </li>
    <li class="skl__row" data-row="3">
      <span class="skl__bar" data-bar></span>
      <span class="skl__content" data-content hidden></span>
    </li>
    <li class="skl__row" data-row="4">
      <span class="skl__bar" data-bar></span>
      <span class="skl__content" data-content hidden></span>
    </li>
  </ul>
  <button class="skl__reload" id="sklReload" type="button">再読み込み</button>
</div>
</main>
<script>
(function () {
  var ROWS = [
    '上半期成長レポート要約',
    '新規登録者推移グラフ',
    '今四半期の売上上位商品',
    '顧客満足度調査結果',
    '在庫切れ間近の品目通知'
  ];
  var CYCLE_MS = 2000; // 캡처 창(2초)의 배수 — 스켈레톤/로딩완료 상태를 오가는 한 사이클
  var LOAD_POINT = 0.45; // 사이클 중 로딩 완료로 전환되는 지점
  var RESET_POINT = 0.96; // 이 지점부터 다시 스켈레톤으로
  var ENTER_STAGGER_MS = 70; // 행마다 등장 지연 간격
  var MIN_BAR_PCT = 32; // 막대 폭 하한(%)
  var TICK_MS = 50;

  var root = document.getElementById('skl');
  var list = document.getElementById('sklList');
  var reloadBtn = document.getElementById('sklReload');
  var rows = Array.prototype.slice.call(list.querySelectorAll('.skl__row'));

  // 계산 겹: 각 행이 로딩 완료 후 실제로 보여줄 글자의 캔버스 실측 폭을 재서
  // 스켈레톤 막대 폭을 그 비율로 정한다 — 고정폭이 아니라 내용 길이를 미리 반영한다.
  function measureBarWidths() {
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');
    ctx.font = '600 13px -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    var widths = ROWS.map(function (text) { return ctx.measureText(text).width; });
    var maxW = Math.max.apply(null, widths);
    return widths.map(function (w) {
      var pct = (w / maxW) * 100;
      return Math.max(MIN_BAR_PCT, Math.round(pct));
    });
  }

  var barPct = measureBarWidths();
  rows.forEach(function (row, i) {
    var bar = row.querySelector('[data-bar]');
    var content = row.querySelector('[data-content]');
    bar.style.setProperty('--bar-w', barPct[i] + '%');
    content.textContent = ROWS[i];
  });

  function setLoaded(loaded) {
    rows.forEach(function (row, i) {
      var content = row.querySelector('[data-content]');
      if (loaded) {
        row.classList.add('is-loaded');
        content.hidden = false;
        row.style.animationDelay = (i * ENTER_STAGGER_MS) + 'ms';
      } else {
        row.classList.remove('is-loaded');
        content.hidden = true;
        row.style.animationDelay = '';
      }
    });
    list.setAttribute('aria-busy', loaded ? 'false' : 'true');
  }

  function human() {
    if (root.classList.contains('is-demo')) {
      root.classList.remove('is-demo');
      if (timer) { window.clearInterval(timer); timer = null; }
    }
  }

  reloadBtn.addEventListener('click', function () {
    human();
    setLoaded(false);
    window.setTimeout(function () { setLoaded(true); }, 650);
  });

  var timer = null;
  var start = 0;
  var loadedState = false;

  function tick(elapsedMs) {
    var phase = (elapsedMs % CYCLE_MS) / CYCLE_MS;
    var wantLoaded = phase >= LOAD_POINT && phase < RESET_POINT;
    if (wantLoaded !== loadedState) {
      loadedState = wantLoaded;
      setLoaded(loadedState);
    }
  }

  function loop() {
    tick(performance.now() - start);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    setLoaded(false);
    start = performance.now();
    timer = window.setInterval(loop, TICK_MS);
  } else {
    // reduce: 실사용 경로 적용 — 스켈레톤 스침·등장 트윈 없이 로딩 완료 상태를 바로 보여준다
    setLoaded(true);
  }
})();
</script>
</body>
</html>
