<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A sticky column that carries its shadow through horizontal scroll — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="stc is-demo" id="stc">
  <div class="stc__view" id="stcView">
    <table class="stc__table">
      <thead>
        <tr>
          <th class="stc__frozen" scope="col">Item</th>
          <th scope="col">Jan</th>
          <th scope="col">Feb</th>
          <th scope="col">Mar</th>
          <th scope="col">Apr</th>
          <th scope="col">May</th>
          <th scope="col">Jun</th>
        </tr>
      </thead>
      <tbody>
        <tr><th class="stc__frozen" scope="row">Apple</th><td>12</td><td>15</td><td>9</td><td>18</td><td>22</td><td>14</td></tr>
        <tr><th class="stc__frozen" scope="row">Banana</th><td>8</td><td>11</td><td>13</td><td>10</td><td>17</td><td>9</td></tr>
        <tr><th class="stc__frozen" scope="row">Cherry</th><td>21</td><td>19</td><td>25</td><td>16</td><td>20</td><td>23</td></tr>
        <tr><th class="stc__frozen" scope="row">Grape</th><td>6</td><td>9</td><td>7</td><td>12</td><td>10</td><td>8</td></tr>
      </tbody>
    </table>
  </div>
</div>
</main>
<script>
(function () {
  var STICKY_COL_SHADOW_ALPHA = 0.35; // 변형 대상 — 완전히 스크롤됐을 때 그림자 알파 상한
  var SHADOW_RAMP_PX = 40; // 이 픽셀만큼 스크롤되면 그림자가 상한에 도달
  var AUTO_TICK_MS = 45;
  var AUTO_STEP_PX = 5;

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  var root = document.getElementById('stc');
  var view = document.getElementById('stcView');

  // 계산 겹: 가로 스크롤량(scrollLeft)을 SHADOW_RAMP_PX 로 정규화해 그림자 알파를 산술로 만든다 —
  // 스크롤이 없으면 그림자가 없고, 조금만 밀려도 곧바로 상한 근처까지 진해진다.
  function updateShadow() {
    var raw = clamp(view.scrollLeft / SHADOW_RAMP_PX, 0, 1);
    var alpha = raw * STICKY_COL_SHADOW_ALPHA;
    view.style.setProperty('--shadow-alpha', alpha.toFixed(3));
  }
  view.addEventListener('scroll', updateShadow, { passive: true });
  updateShadow();

  var timer = null;

  function human() {
    if (root.classList.contains('is-demo')) {
      root.classList.remove('is-demo');
      if (timer) { window.clearInterval(timer); timer = null; }
    }
  }
  view.addEventListener('wheel', human, { passive: true });
  view.addEventListener('touchstart', human, { passive: true });
  view.addEventListener('pointerdown', human, { passive: true });

  var dir = 1;
  function autoTick() {
    var max = view.scrollWidth - view.clientWidth;
    var next = clamp(view.scrollLeft + dir * AUTO_STEP_PX, 0, max);
    view.scrollLeft = next;
    if (next <= 0 || next >= max) { dir *= -1; }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    timer = window.setInterval(autoTick, AUTO_TICK_MS);
  } else {
    // reduce: 실사용 경로 적용 — 자동 가로 스크롤 루프를 멈춘다. 사람이 스크롤하면 그림자 계산은 그대로 동작
  }
})();
</script>
</body>
</html>
