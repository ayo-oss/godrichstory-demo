<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagination where a single dot slides, no numbers — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pgn is-demo" id="pgn">
  <div class="pgn__panel" id="pgnPanel" aria-live="polite">Light info card 1</div>
  <nav class="pgn__nav" aria-label="Pagination">
    <button type="button" class="pgn__navBtn" id="pgnPrev" aria-label="Previous page" disabled>
      <span aria-hidden="true">‹</span>
    </button>
    <div class="pgn__dots" id="pgnDots">
      <span class="pgn__track" id="pgnTrack" aria-hidden="true"></span>
      <button type="button" class="pgn__dot" aria-current="page" aria-label="Go to page 1" data-page="0"></button>
      <button type="button" class="pgn__dot" aria-label="Go to page 2" data-page="1"></button>
      <button type="button" class="pgn__dot" aria-label="Go to page 3" data-page="2"></button>
      <button type="button" class="pgn__dot" aria-label="Go to page 4" data-page="3"></button>
      <button type="button" class="pgn__dot" aria-label="Go to page 5" data-page="4"></button>
    </div>
    <button type="button" class="pgn__navBtn" id="pgnNext" aria-label="Next page">
      <span aria-hidden="true">›</span>
    </button>
  </nav>
</div>
</main>
<script>
(function () {
  var PANEL_TEXTS = [
    'Light info card 1',
    'Light info card 2',
    'Light info card 3',
    'Light info card 4',
    'Light info card 5'
  ];
  var AUTO_STEP_MS = 460;

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  var root = document.getElementById('pgn');
  var panel = document.getElementById('pgnPanel');
  var dotsWrap = document.getElementById('pgnDots');
  var track = document.getElementById('pgnTrack');
  var prevBtn = document.getElementById('pgnPrev');
  var nextBtn = document.getElementById('pgnNext');
  var dots = Array.prototype.slice.call(dotsWrap.querySelectorAll('.pgn__dot'));
  var total = dots.length;
  var current = 0;

  // 계산 겹: 점마다 고정 간격을 가정하지 않고, 실제 렌더된 좌표(offsetLeft)를 그대로 재서
  // 슬라이딩 표시자를 그 좌표로 옮긴다 — transform 이동만 쓰고 폭은 바꾸지 않는다.
  function measureAndMove(index) {
    var dot = dots[index];
    track.style.setProperty('--track-x', dot.offsetLeft + 'px');
  }

  function goTo(index) {
    index = clamp(index, 0, total - 1);
    if (index === current) { return; }
    current = index;
    dots.forEach(function (dot, i) {
      if (i === current) { dot.setAttribute('aria-current', 'page'); } else { dot.removeAttribute('aria-current'); }
    });
    measureAndMove(current);
    panel.textContent = PANEL_TEXTS[current];
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === total - 1;
  }

  function human() {
    if (root.classList.contains('is-demo')) {
      root.classList.remove('is-demo');
      if (timer) { window.clearInterval(timer); timer = null; }
    }
  }

  dots.forEach(function (dot, i) {
    dot.addEventListener('click', function () { human(); goTo(i); });
  });
  prevBtn.addEventListener('click', function () { human(); goTo(current - 1); });
  nextBtn.addEventListener('click', function () { human(); goTo(current + 1); });
  dotsWrap.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { human(); goTo(current + 1); }
    else if (e.key === 'ArrowLeft') { human(); goTo(current - 1); }
  });
  window.addEventListener('resize', function () { measureAndMove(current); });

  // 초기 배치는 트랜지션 없이 — 그대로 두면 CSS 기본값(0px)에서 실측 offsetLeft 로 바뀌는
  // 자체가 트랜지션 하나를 만들어, 렌더러가 그 트랜지션을 "재생 중인 애니메이션"으로 오인해
  // 실시간 대신 결정론(시계 직접 이동) 모드로 들어간다. 그러면 setInterval 자동 넘김이 실제
  // 경과 시간을 못 받아 프레임마다 거의 안 움직인다 — 최초 1회만 트랜지션을 꺼서 막는다.
  track.style.transition = 'none';
  measureAndMove(0);
  void track.offsetHeight;
  track.style.transition = '';

  var timer = null;

  function autoTick() {
    goTo((current + 1) % total);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    timer = window.setInterval(autoTick, AUTO_STEP_MS);
  } else {
    // reduce: 실사용 경로 적용 — 자동 Pagination 루프를 멈춘다. 클릭·화살표 키 이동과 위치 계산은 그대로 동작
  }
})();
</script>
</body>
</html>
