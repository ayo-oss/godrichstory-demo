<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ツールバーなしでバッジだけが数える複数選択 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bks is-demo" id="bks">
  <div class="bks__header">
    <span class="bks__title">文書箱</span>
    <span class="bks__badge" id="bksBadge" aria-live="polite" hidden>0件選択</span>
  </div>
  <ul class="bks__list" id="bksList">
    <li class="bks__row">
      <input type="checkbox" id="bksCb0" class="bks__checkbox" aria-checked="false">
      <label for="bksCb0" class="bks__label">レポート草案</label>
    </li>
    <li class="bks__row">
      <input type="checkbox" id="bksCb1" class="bks__checkbox" aria-checked="false">
      <label for="bksCb1" class="bks__label">議事録整理</label>
    </li>
    <li class="bks__row">
      <input type="checkbox" id="bksCb2" class="bks__checkbox" aria-checked="false">
      <label for="bksCb2" class="bks__label">予算案の確認</label>
    </li>
    <li class="bks__row">
      <input type="checkbox" id="bksCb3" class="bks__checkbox" aria-checked="false">
      <label for="bksCb3" class="bks__label">デザイン草案</label>
    </li>
    <li class="bks__row">
      <input type="checkbox" id="bksCb4" class="bks__checkbox" aria-checked="false">
      <label for="bksCb4" class="bks__label">契約書の確認</label>
    </li>
  </ul>
</div>
</main>
<script>
(function () {
  var AUTO_STEP_MS = 550;
  var AUTO_RESET_DELAY_MS = 900;
  var AUTO_SEQ = [
    { idx: 0, shift: false },
    { idx: 3, shift: true },
    { idx: 1, shift: false }
  ];

  var root = document.getElementById('bks');
  var list = document.getElementById('bksList');
  var badge = document.getElementById('bksBadge');
  var rows = Array.prototype.slice.call(list.querySelectorAll('.bks__row'));
  var checkboxes = rows.map(function (row) { return row.querySelector('input'); });
  var lastIndex = null;

  function setChecked(cb, checked) {
    cb.checked = checked;
    cb.setAttribute('aria-checked', checked ? 'true' : 'false');
  }

  function updateBadge() {
    var n = checkboxes.filter(function (cb) { return cb.checked; }).length;
    badge.hidden = n === 0;
    badge.textContent = n + '件選択';
    badge.classList.remove('is-pop');
    void badge.offsetWidth;
    badge.classList.add('is-pop');
  }

  // 계산 겹: 마지막으로 다룬 인덱스와 이번 인덱스 사이 범위를 산술로 구해
  // 그 구간 전체를 한 번에 같은 상태로 맞춘다 — 하나씩 누르지 않아도 된다.
  function applyRange(fromIdx, toIdx, checked) {
    var lo = Math.min(fromIdx, toIdx);
    var hi = Math.max(fromIdx, toIdx);
    for (var i = lo; i <= hi; i += 1) {
      setChecked(checkboxes[i], checked);
    }
  }

  function clearAll() {
    checkboxes.forEach(function (cb) { setChecked(cb, false); });
    lastIndex = null;
    updateBadge();
  }

  function human() {
    if (root.classList.contains('is-demo')) {
      root.classList.remove('is-demo');
      if (timer) { window.clearInterval(timer); timer = null; }
    }
  }

  checkboxes.forEach(function (cb, idx) {
    cb.addEventListener('click', function (e) {
      human();
      if (e.shiftKey && lastIndex !== null) {
        applyRange(lastIndex, idx, cb.checked);
      }
      lastIndex = idx;
      updateBadge();
    });
  });

  var timer = null;
  var seqPos = 0;

  function autoTick() {
    if (seqPos >= AUTO_SEQ.length) {
      window.clearInterval(timer);
      timer = null;
      window.setTimeout(function () {
        clearAll();
        seqPos = 0;
        timer = window.setInterval(autoTick, AUTO_STEP_MS);
      }, AUTO_RESET_DELAY_MS);
      return;
    }
    var step = AUTO_SEQ[seqPos];
    var cb = checkboxes[step.idx];
    var nextChecked = !cb.checked;
    if (step.shift && lastIndex !== null) {
      applyRange(lastIndex, step.idx, nextChecked);
    } else {
      setChecked(cb, nextChecked);
    }
    lastIndex = step.idx;
    updateBadge();
    seqPos += 1;
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    timer = window.setInterval(autoTick, AUTO_STEP_MS);
  } else {
    // reduce: 실사용 경로 적용 — 자동 선택 루프와 배지 팝 트윈을 멈춘다. 클릭·범위 선택 계산은 그대로 동작
  }
})();
</script>
</body>
</html>
