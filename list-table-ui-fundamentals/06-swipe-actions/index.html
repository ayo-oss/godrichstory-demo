<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 방향으로만 밀리는 기본 스와이프 액션 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="swa is-demo" id="swa">
  <ul class="swa__list" id="swaList">
    <li class="swa__row">
      <div class="swa__actions"><button type="button" class="swa__actionBtn" data-del>삭제</button></div>
      <div class="swa__content" tabindex="0">받은편지함 안내 1</div>
    </li>
    <li class="swa__row">
      <div class="swa__actions"><button type="button" class="swa__actionBtn" data-del>삭제</button></div>
      <div class="swa__content" tabindex="0">받은편지함 안내 2</div>
    </li>
    <li class="swa__row">
      <div class="swa__actions"><button type="button" class="swa__actionBtn" data-del>삭제</button></div>
      <div class="swa__content" tabindex="0">받은편지함 안내 3</div>
    </li>
  </ul>
</div>
</main>
<script>
(function () {
  var ACTION_WIDTH = 72; // 열렸을 때 드러나는 버튼 폭
  var VELOCITY_OPEN_THRESHOLD = 0.5; // px/ms — 이 속도를 넘기면 위치와 무관하게 방향이 결정된다
  var AUTO_CYCLE_MS = 2000;

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  var root = document.getElementById('swa');
  var list = document.getElementById('swaList');
  var rows = Array.prototype.slice.call(list.querySelectorAll('.swa__row'));
  var rowApis = [];

  rows.forEach(function (row, idx) {
    var content = row.querySelector('.swa__content');
    var delBtn = row.querySelector('[data-del]');
    var dragging = false;
    var startX = 0;
    var baseX = 0;
    var lastX = 0;
    var lastT = 0;
    var velocity = 0;
    var isOpen = false;

    function setX(x, animate) {
      content.style.setProperty('--swipe-x', x.toFixed(1) + 'px');
      content.classList.toggle('is-dragging', !animate);
    }

    function openRow(animate) {
      setX(-ACTION_WIDTH, animate !== false);
      isOpen = true;
      delBtn.tabIndex = 0;
    }

    function closeRow(animate) {
      setX(0, animate !== false);
      isOpen = false;
      delBtn.tabIndex = -1;
    }
    closeRow(false);

    function currentX() {
      var v = content.style.getPropertyValue('--swipe-x');
      return v ? parseFloat(v) : 0;
    }

    content.addEventListener('pointerdown', function (e) {
      human();
      rowApis.forEach(function (api, otherIdx) { if (otherIdx !== idx) { api.close(true); } });
      dragging = true;
      startX = e.clientX;
      baseX = currentX();
      lastX = e.clientX;
      lastT = performance.now();
      velocity = 0;
      content.setPointerCapture(e.pointerId);
    });

    content.addEventListener('pointermove', function (e) {
      if (!dragging) { return; }
      var now = performance.now();
      var dt = Math.max(now - lastT, 1);
      velocity = (e.clientX - lastX) / dt; // px/ms, 음수 = 왼쪽으로 밀리는 중
      lastX = e.clientX;
      lastT = now;
      var raw = baseX + (e.clientX - startX);
      setX(clamp(raw, -ACTION_WIDTH, 0), false);
    });

    content.addEventListener('pointerup', function () {
      if (!dragging) { return; }
      dragging = false;
      // 계산 겹: 손을 뗄 때의 속도가 임계값을 넘으면, 멈춘 위치와 무관하게
      // 속도의 방향이 열림/닫힘을 결정한다. 느리면 위치 절반 기준으로 결정한다.
      var openDecision;
      if (velocity < -VELOCITY_OPEN_THRESHOLD) {
        openDecision = true;
      } else if (velocity > VELOCITY_OPEN_THRESHOLD) {
        openDecision = false;
      } else {
        openDecision = currentX() < -ACTION_WIDTH / 2;
      }
      if (openDecision) { openRow(); } else { closeRow(); }
    });

    delBtn.tabIndex = -1;
    delBtn.addEventListener('click', function () {
      human();
      row.classList.add('is-deleted');
    });

    rowApis.push({ open: openRow, close: closeRow });
  });

  function human() {
    if (root.classList.contains('is-demo')) {
      root.classList.remove('is-demo');
      if (timer) { window.clearInterval(timer); timer = null; }
    }
  }

  var timer = null;
  var start = 0;

  function autoApply() {
    var elapsed = performance.now() - start;
    var phase = (elapsed % AUTO_CYCLE_MS) / AUTO_CYCLE_MS;
    var x;
    if (phase < 0.35) {
      x = -ACTION_WIDTH * (phase / 0.35);
    } else if (phase < 0.65) {
      x = -ACTION_WIDTH;
    } else if (phase < 0.85) {
      x = -ACTION_WIDTH * (1 - (phase - 0.65) / 0.2);
    } else {
      x = 0;
    }
    var content = rows[0].querySelector('.swa__content');
    content.classList.add('is-dragging');
    content.style.setProperty('--swipe-x', x.toFixed(1) + 'px');
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    start = performance.now();
    timer = window.setInterval(autoApply, 40);
  } else {
    // reduce: 실사용 경로 적용 — 자동 스와이프 루프를 멈추고 닫힌 상태를 고정으로 보여준다
  }
})();
</script>
</body>
</html>
