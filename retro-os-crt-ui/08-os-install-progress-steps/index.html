<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설치 진행 막대와 단계 문구 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ip is-demo" id="ip">
  <div class="ip__title">
    <span class="ip__tico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 152v48a8 8 0 0 1-8 8H48a8 8 0 0 1-8-8v-48a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8m-8-104H48a8 8 0 0 0-8 8v48a8 8 0 0 0 8 8h160a8 8 0 0 0 8-8V56a8 8 0 0 0-8-8" opacity=".2"/><path d="M208 136H48a16 16 0 0 0-16 16v48a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16v-48a16 16 0 0 0-16-16m0 64H48v-48h160zm0-160H48a16 16 0 0 0-16 16v48a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16m0 64H48V56h160zm-16-24a12 12 0 1 1-12-12a12 12 0 0 1 12 12m0 96a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></svg></span>
    <span class="ip__tname">설치 마법사</span>
    <span class="ip__tbtns" aria-hidden="true"><span class="ip__gb ip__gb--min"></span><span class="ip__gb"></span></span>
  </div>
  <div class="ip__body">
    <div class="ip__track">
      <span class="ip__fill" aria-hidden="true"></span>
      <span class="ip__cover" aria-hidden="true"></span>
      <span class="ip__done" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 256 256"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0M232 128A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></svg></span>
    </div>
    <div class="ip__meta">
      <span class="ip__phrases" aria-hidden="true">
        <span class="ip__sv ip__sv--1">파일 준비</span>
        <span class="ip__sv ip__sv--2">복사 중</span>
        <span class="ip__sv ip__sv--3">설정 저장</span>
        <span class="ip__sv ip__sv--4">마무리 중</span>
        <span class="ip__sv ip__sv--5">설치 완료</span>
      </span>
      <span class="ip__nums" aria-hidden="true">
        <span class="ip__nm ip__nm--1">812 MB</span>
        <span class="ip__nm ip__nm--2">744 MB</span>
        <span class="ip__nm ip__nm--3">663 MB</span>
        <span class="ip__nm ip__nm--4">581 MB</span>
        <span class="ip__nm ip__nm--5">502 MB</span>
        <span class="ip__nm ip__nm--6">421 MB</span>
        <span class="ip__nm ip__nm--7">340 MB</span>
        <span class="ip__nm ip__nm--8">262 MB</span>
        <span class="ip__nm ip__nm--9">183 MB</span>
        <span class="ip__nm ip__nm--10">102 MB</span>
        <span class="ip__nm ip__nm--11">47 MB</span>
        <span class="ip__nm ip__nm--12">0 MB</span>
      </span>
    </div>
    <div class="ip__actions">
      <button type="button" class="ip__btn" id="retry">다시 설치</button>
    </div>
  </div>
</div>
</main>
<script>
var root = document.getElementById('ip');
var retry = document.getElementById('retry');
// 사람 손이 닿으면 격자 미리보기 루프를 끊고 완료 상태(정적 기본값)로 돌아간다
root.addEventListener('pointerdown', function () { root.classList.remove('is-demo'); });
// 다시 설치 — 같은 2초 루프를 한 바퀴 돌게 했다가 95% 지점(막대가 다 찬 뒤)에 뗀다
retry.addEventListener('click', function () {
  root.classList.add('is-demo');
  clearTimeout(retry.timer);
  retry.timer = setTimeout(function () { root.classList.remove('is-demo'); }, 1900);
});
</script>
</body>
</html>
