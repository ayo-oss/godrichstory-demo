<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>픽셀 커서 세 종류 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pxc is-demo" id="pxc">
  <div class="pxc__slot" id="slot" data-cur="arrow" aria-label="커서 미리보기">
    <span class="px pxc__cur pxc__cur--arrow" aria-hidden="true"></span>
    <span class="px pxc__cur pxc__cur--hour" aria-hidden="true"></span>
    <span class="px pxc__cur pxc__cur--hand" aria-hidden="true"></span>
    <span class="pxc__grid" aria-hidden="true"></span>
  </div>
  <div class="pxc__row" role="group" aria-label="커서 고르기">
    <button class="pxc__pick is-on" type="button" data-set="arrow" aria-pressed="true">
      <span class="px pxc__mini pxc__mini--arrow" aria-hidden="true"></span>
      <span class="pxc__lbl">화살표</span>
    </button>
    <button class="pxc__pick" type="button" data-set="hour" aria-pressed="false">
      <span class="px pxc__mini pxc__mini--hour" aria-hidden="true"></span>
      <span class="pxc__lbl">모래시계</span>
    </button>
    <button class="pxc__pick" type="button" data-set="hand" aria-pressed="false">
      <span class="px pxc__mini pxc__mini--hand" aria-hidden="true"></span>
      <span class="pxc__lbl">손가락</span>
    </button>
  </div>
</div>
</main>
<script>
var pxc = document.getElementById('pxc');
var slot = document.getElementById('slot');
var picks = [].slice.call(document.querySelectorAll('.pxc__pick'));
picks.forEach(function (btn) {
  btn.addEventListener('click', function () {
    pxc.classList.remove('is-demo');
    slot.dataset.cur = btn.dataset.set;
    picks.forEach(function (other) {
      var on = other === btn;
      other.classList.toggle('is-on', on);
      other.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  });
});
</script>
</body>
</html>
