<script>
var sm = document.getElementById('sm');
var btn = document.getElementById('start');
var menu = document.getElementById('menu');
var rows = [].slice.call(document.querySelectorAll('.sm__row'));
var subs = [].slice.call(document.querySelectorAll('.sm__sub'));

function hideSubs() {
  subs.forEach(function (s) { s.classList.remove('is-on', 'is-flip'); });
}
function setOpen(on) {
  menu.classList.toggle('is-open', on);
  btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  if (!on) hideSubs();
}
// 하위 메뉴를 펼친 뒤 실측해 오른쪽이 화면 밖으로 나가면 왼쪽으로 접어 넣는다.
// 왼쪽마저 잘리면 원래 방향을 지킨다(양쪽 다 못 채우는 좁이는 없다고 본다)
function showSub(sub) {
  hideSubs();
  sub.classList.add('is-on');
  var r = sub.getBoundingClientRect();
  if (r.right > window.innerWidth - 8) {
    sub.classList.add('is-flip');
    if (sub.getBoundingClientRect().left < 8) sub.classList.remove('is-flip');
  }
}
function touch() { sm.classList.remove('is-demo'); }
btn.addEventListener('click', function () { touch(); setOpen(!menu.classList.contains('is-open')); });
rows.forEach(function (row) {
  var idx = row.getAttribute('data-sub');
  var sub = idx ? subs[+idx] : null;
  function activate() {
    if (!menu.classList.contains('is-open')) return;
    if (sub) showSub(sub); else hideSubs();
  }
  row.addEventListener('pointerenter', activate);
  row.addEventListener('focus', activate);
  row.addEventListener('click', function (e) {
    touch();
    if (!menu.classList.contains('is-open')) setOpen(true);
    activate();
    e.stopPropagation();
  });
});
menu.addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  var k = 0;
  rows.forEach(function (r, i) { if (document.activeElement === r) k = i; });
  var n = (k + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length;
  rows[n].focus({ preventScroll: true });
});
document.addEventListener('click', function (e) { if (!sm.contains(e.target)) setOpen(false); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
</script>
