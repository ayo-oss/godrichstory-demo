      <span class="dt__label">설정</span>

  <section class="dt__win" id="win" aria-hidden="true">
    <header class="dt__tbar">
      <span class="dt__tico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M128 80H32V56a8 8 0 0 1 8-8h52.69a8 8 0 0 1 5.65 2.34Z" opacity=".2"/><path d="M216 72h-84.69L104 44.69A15.86 15.86 0 0 0 92.69 40H40a16 16 0 0 0-16 16v144.62A15.4 15.4 0 0 0 39.38 216h177.51A15.13 15.13 0 0 0 232 200.89V88a16 16 0 0 0-16-16M92.69 56l16 16H40V56ZM216 200H40V88h176Z"/></g></svg></span>
      <span class="dt__ttl" id="ttl">내 문서</span>
      <button type="button" class="dt__x" id="x" aria-label="창 닫기"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 56v144a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h144a16 16 0 0 1 16 16" opacity=".2"/><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg></button>
    </header>
    <p class="dt__body" id="wbody">문서 아이콘을 두 번 눌러 연 창입니다</p>
  </section>
  <p class="dt__hint">한 번 누르면 선택, 빠르게 두 번 누르면 열립니다. 방향키로도 옮깁니다</p>

</main>
<script>
var dt = document.getElementById('dt');
var list = document.getElementById('list');
var icons = [].slice.call(document.querySelectorAll('.dt__ico'));
var win = document.getElementById('win');
var ttl = document.getElementById('ttl');
var wbody = document.getElementById('wbody');
var lastTap = 0;
var lastIdx = -1;
var META = [
  { t: '내 문서', b: '문서 아이콘을 두 번 눌러 연 창입니다' },
  { t: '사진첩', b: '사진첩 아이콘을 두 번 눌러 연 창입니다' },
  { t: '설정', b: '설정 아이콘을 두 번 눌러 연 창입니다' }
];
function select(i, grab) {
  icons.forEach(function (b, k) { b.setAttribute('aria-selected', k === i ? 'true' : 'false'); });
  if (grab && icons[i]) icons[i].focus({ preventScroll: true });
}
function openWin(i) {
  ttl.textContent = META[i].t;
  wbody.textContent = META[i].b;
  win.classList.add('is-open');
  win.setAttribute('aria-hidden', 'false');
  icons[i].classList.remove('is-pop');
  void icons[i].offsetWidth;
  icons[i].classList.add('is-pop');
}
function closeWin() {
  win.classList.remove('is-open');
  win.setAttribute('aria-hidden', 'true');
}
icons.forEach(function (b, i) {
  b.addEventListener('click', function (e) {
    dt.classList.remove('is-demo');
    select(i, false);
    // e.detail 은 같은 자리에서 연달아 누른 횟수 — 2 이상이면 두 번 누르기다.
    // 터치는 detail 이 항상 1 이라 시간차(400ms)로 판정한다
    if (e.detail >= 2 || (i === lastIdx && Date.now() - lastTap < 400)) openWin(i);
    lastTap = Date.now();
    lastIdx = i;
  });
});
list.addEventListener('keydown', function (e) {
  dt.classList.remove('is-demo');
  var k = e.key;
  var cur = -1;
  icons.forEach(function (b, i) { if (b.getAttribute('aria-selected') === 'true') cur = i; });
  if (k === 'ArrowDown' || k === 'ArrowRight') { e.preventDefault(); select((cur + 1) % icons.length, true); }
  else if (k === 'ArrowUp' || k === 'ArrowLeft') { e.preventDefault(); select((cur - 1 + icons.length) % icons.length, true); }
  else if (k === 'Enter' || k === ' ') { e.preventDefault(); if (cur < 0) cur = 0; select(cur, false); openWin(cur); }
  else if (k === 'Escape') closeWin();
});
document.getElementById('x').addEventListener('click', closeWin);
dt.addEventListener('pointerdown', function (e) {
  if (e.target === dt) { dt.classList.remove('is-demo'); select(-1, false); closeWin(); }
});
</script>
</body>
</html>
