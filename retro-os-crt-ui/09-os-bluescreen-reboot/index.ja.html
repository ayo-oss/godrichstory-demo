<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>青いエラー画面と再起動 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bs is-demo" id="bs">
  <div class="bs__win">
    <div class="bs__title">
      <span class="bs__tico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 256 256"><g fill="currentColor"><path d="M128 144h80v72l-80-14.55Zm-96 40l64 11.64V144H32Zm96-129.45V112h80V40ZM32 112h64V60.36L32 72Z" opacity=".2"/><path d="M208 136h-80a8 8 0 0 0-8 8v57.45a8 8 0 0 0 6.57 7.88l80 14.54a7.6 7.6 0 0 0 1.43.13a8 8 0 0 0 8-8v-72a8 8 0 0 0-8-8m-8 70.41l-64-11.63V152h64ZM96 136H32a8 8 0 0 0-8 8v40a8 8 0 0 0 6.57 7.87l64 11.64a8.5 8.5 0 0 0 1.43.13a8 8 0 0 0 8-8V144a8 8 0 0 0-8-8m-8 50.05l-48-8.73V152h48ZM213.13 33.86a8 8 0 0 0-6.56-1.73l-80 14.55a8 8 0 0 0-6.57 7.87V112a8 8 0 0 0 8 8h80a8 8 0 0 0 8-8V40a8 8 0 0 0-2.87-6.14M200 104h-64V61.22l64-11.63Zm-98.87-49.78a8 8 0 0 0-6.56-1.73l-64 11.64A8 8 0 0 0 24 72v40a8 8 0 0 0 8 8h64a8 8 0 0 0 8-8V60.36a8 8 0 0 0-2.87-6.14M88 104H40V78.68L88 70Z"/></g></svg></span>
      <span class="bs__tname">システム情報</span>
      <span class="bs__tbtns" aria-hidden="true"><span class="bs__gb bs__gb--min"></span><span class="bs__gb"></span></span>
    </div>
    <div class="bs__body">
      <p class="bs__row"><span class="bs__k">プロセッサ</span><span class="bs__v">486DX2 66MHz</span></p>
      <p class="bs__row"><span class="bs__k">メモリ</span><span class="bs__v">16 MB</span></p>
      <p class="bs__row"><span class="bs__k">ディスク</span><span class="bs__v">540 MB</span></p>
      <div class="bs__actions">
        <button type="button" class="bs__btn" id="crash">システムエラー</button>
      </div>
    </div>
  </div>
  <div class="bs__screen" id="screen">
    <div class="bs__err">
      <p class="bs__eline">致命的エラー 0E : 016F : BFF9B3D4</p>
      <p class="bs__eline">VXD VMM(01) の処理中に問題が発生しました</p>
      <p class="bs__eline">作業を保存してシステムを再起動します</p>
    </div>
    <div class="bs__guide">
      <span class="bs__gtext">状態を保存中</span>
      <span class="bs__dots" aria-hidden="true"><span class="bs__dot"></span><span class="bs__dot"></span><span class="bs__dot"></span></span>
    </div>
    <div class="bs__sact">
      <button type="button" class="bs__btn bs__btn--s" id="restart">再起動</button>
    </div>
  </div>
</div>
</main>
<script>
var root = document.getElementById('bs');
var screen = document.getElementById('screen');
var crash = document.getElementById('crash');
var restart = document.getElementById('restart');
// 사람 손이 닿으면 격자 미리보기 루프를 끊고 실제 조작 경로로 돌아간다
root.addEventListener('pointerdown', function () { root.classList.remove('is-demo'); });
// システムエラー — 파란 화면이 한 프레임에 통째로 뜬다(전환이라 트랜지션 없이 클래스만)
crash.addEventListener('click', function () {
  screen.classList.remove('is-wiped');
  screen.classList.add('is-crash');
  restart.focus({ preventScroll: true });
});
// 再起動 — 화면이 위에서 아래로 쓸려 사라지고 원래 창이 드러난다
restart.addEventListener('click', function () { screen.classList.add('is-wiped'); });
screen.addEventListener('transitionend', function (e) {
  if (e.propertyName !== 'clip-path') return;
  screen.classList.remove('is-crash', 'is-wiped');
});
</script>
</body>
</html>
