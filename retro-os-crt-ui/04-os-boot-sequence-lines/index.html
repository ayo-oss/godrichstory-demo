<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부팅 점검 줄 출력 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="bl is-demo" id="bl">
  <div class="bl__bar">
    <span class="bl__ico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M200 48H56a8 8 0 0 0-8 8v144a8 8 0 0 0 8 8h144a8 8 0 0 0 8-8V56a8 8 0 0 0-8-8m-48 104h-48v-48h48Z" opacity=".2"/><path d="M152 96h-48a8 8 0 0 0-8 8v48a8 8 0 0 0 8 8h48a8 8 0 0 0 8-8v-48a8 8 0 0 0-8-8m-8 48h-32v-32h32Zm88 0h-16v-32h16a8 8 0 0 0 0-16h-16V56a16 16 0 0 0-16-16h-40V24a8 8 0 0 0-16 0v16h-32V24a8 8 0 0 0-16 0v16H56a16 16 0 0 0-16 16v40H24a8 8 0 0 0 0 16h16v32H24a8 8 0 0 0 0 16h16v40a16 16 0 0 0 16 16h40v16a8 8 0 0 0 16 0v-16h32v16a8 8 0 0 0 16 0v-16h40a16 16 0 0 0 16-16v-40h16a8 8 0 0 0 0-16m-32 56H56V56h144z"/></g></svg></span>
    <span class="bl__name">GODRICH BIOS</span>
    <span class="bl__rev">REV 2.4</span>
  </div>
  <div class="bl__scr" id="scr" tabindex="0" role="button" aria-label="부팅 점검 다시 시작">
    <div class="bl__logo" aria-hidden="true">
      <span class="bl__lg1">GODRICH</span>
      <span class="bl__lg2">부팅 점검</span>
    </div>
    <ul class="bl__lines">
      <li class="bl__row bl__row--1"><span class="bl__lab">메모리 검사</span><span class="bl__res">65,536 KB</span></li>
      <li class="bl__row bl__row--2"><span class="bl__lab">주 디스크</span><span class="bl__res">준비</span></li>
      <li class="bl__row bl__row--3"><span class="bl__lab">키보드 연결</span><span class="bl__res">확인</span></li>
      <li class="bl__row bl__row--4"><span class="bl__lab">디스플레이</span><span class="bl__res">640×480</span></li>
      <li class="bl__row bl__row--5"><span class="bl__lab">부팅 장치</span><span class="bl__res">OK</span></li>
    </ul>
  </div>
  <p class="bl__note">점검 줄이 한 줄씩 쌓이고 한 박자 늦게 결과가 붙습니다. 화면을 누르면 처음부터 다시 셉니다</p>
</div>
</main>
<script>
var bl = document.getElementById('bl');
var scr = document.getElementById('scr');
// 화면을 누르면(또는 Enter·Space) 루프를 처음부터 다시 돌린다 — 클래스를 떼었다 붙이며 재시작
function restart() {
  bl.classList.remove('is-demo');
  void bl.offsetWidth;
  bl.classList.add('is-demo');
}
scr.addEventListener('click', restart);
scr.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); restart(); }
});
</script>
</body>
</html>
