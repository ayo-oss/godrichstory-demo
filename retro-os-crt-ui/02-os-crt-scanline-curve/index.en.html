<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRT scanlines and curved vignette — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<figure class="crt">
  <div class="crt__bezel">
    <div class="crt__screen">
      <div class="crt__content">
        <p class="crt__title">Retro OS</p>
        <p class="crt__sub">CRT monitor effect — CSS only</p>
      </div>
      <span class="crt__band" aria-hidden="true"></span>
      <span class="crt__lines" aria-hidden="true"></span>
      <span class="crt__vig" aria-hidden="true"></span>
    </div>
  </div>
  <figcaption class="crt__cap">One stripe tile and an elliptical vignette fake a CRT tube</figcaption>
</figure>
</main>
</body>
</html>
