<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRT 스캔라인과 곡면 비네트 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<figure class="crt">
  <div class="crt__bezel">
    <div class="crt__screen">
      <div class="crt__content">
        <p class="crt__title">레트로 OS</p>
        <p class="crt__sub">crt 모니터 효과 — css 만으로</p>
      </div>
      <span class="crt__band" aria-hidden="true"></span>
      <span class="crt__lines" aria-hidden="true"></span>
      <span class="crt__vig" aria-hidden="true"></span>
    </div>
  </div>
  <figcaption class="crt__cap">줄무늬 타일 하나와 타원 비네트로 브라운관을 흉내 냈습니다</figcaption>
</figure>
</main>
</body>
</html>
