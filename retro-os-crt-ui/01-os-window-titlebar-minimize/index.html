<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끌어 옮기는 창과 최소화 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dt is-demo" id="dt">
  <div class="dt__area" id="area">
    <section class="win" id="win" aria-label="예제 창">
      <header class="win__bar" id="bar" tabindex="0" aria-label="창 이동 — 잡아 끌거나 방향키로 옮기세요">
        <span class="win__ico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M224 64v112a16 16 0 0 1-16 16H48a16 16 0 0 1-16-16V64a16 16 0 0 1 16-16h160a16 16 0 0 1 16 16" opacity=".2"/><path d="M208 40H48a24 24 0 0 0-24 24v112a24 24 0 0 0 24 24h160a24 24 0 0 0 24-24V64a24 24 0 0 0-24-24m8 136a8 8 0 0 1-8 8H48a8 8 0 0 1-8-8V64a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8Zm-48 48a8 8 0 0 1-8 8H96a8 8 0 0 1 0-16h64a8 8 0 0 1 8 8"/></g></svg></span>
        <span class="win__title">godrich.exe</span>
        <button class="win__min" id="minBtn" type="button" aria-label="최소화"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 56v144a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h144a16 16 0 0 1 16 16" opacity=".2"/><path d="M224 128a8 8 0 0 1-8 8H40a8 8 0 0 1 0-16h176a8 8 0 0 1 8 8"/></g></svg></button>
      </header>
      <div class="win__panel">
        <p class="win__line">타이틀바를 잡아 끌면 창이 따라옵니다</p>
        <p class="win__line win__line--dim">최소화하면 작업표시줄 칸으로 접힙니다</p>
      </div>
      <p class="win__status" aria-hidden="true">준비</p>
    </section>
  </div>
  <nav class="dt__bar" aria-label="작업표시줄">
    <button class="dt__slot" id="slot" type="button" aria-label="창 다시 펼치기">
      <span class="dt__slotIco" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="M128 144h80v72l-80-14.55Zm-96 40l64 11.64V144H32Zm96-129.45V112h80V40ZM32 112h64V60.36L32 72Z" opacity=".2"/><path d="M208 136h-80a8 8 0 0 0-8 8v57.45a8 8 0 0 0 6.57 7.88l80 14.54a7.6 7.6 0 0 0 1.43.13a8 8 0 0 0 8-8v-72a8 8 0 0 0-8-8m-8 70.41l-64-11.63V152h64ZM96 136H32a8 8 0 0 0-8 8v40a8 8 0 0 0 6.57 7.87l64 11.64a8.5 8.5 0 0 0 1.43.13a8 8 0 0 0 8-8V144a8 8 0 0 0-8-8m-8 50.05l-48-8.73V152h48ZM213.13 33.86a8 8 0 0 0-6.56-1.73l-80 14.55a8 8 0 0 0-6.57 7.87V112a8 8 0 0 0 8 8h80a8 8 0 0 0 8-8V40a8 8 0 0 0-2.87-6.14M200 104h-64V61.22l64-11.63Zm-98.87-49.78a8 8 0 0 0-6.56-1.73l-64 11.64A8 8 0 0 0 24 72v40a8 8 0 0 0 8 8h64a8 8 0 0 0 8-8V60.36a8 8 0 0 0-2.87-6.14M88 104H40V78.68L88 70Z"/></g></svg></span>
      <span class="dt__slotTitle">godrich.exe</span>
    </button>
    <span class="dt__clock" aria-hidden="true">09:41</span>
  </nav>
</div>
</main>
<script>
var dt = document.getElementById('dt');
var area = document.getElementById('area');
var win = document.getElementById('win');
var bar = document.getElementById('bar');
var minBtn = document.getElementById('minBtn');
var slot = document.getElementById('slot');
var px = 0, py = 0, savedX = 0, savedY = 0, min = false;

function place() { win.style.translate = px + 'px ' + py + 'px'; }
function clampNum(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dragBounds() {
  return {
    x: Math.max(0, (area.clientWidth - win.offsetWidth) / 2),
    y: Math.max(0, (area.clientHeight - win.offsetHeight) / 2)
  };
}
// 접기/펴기 — 접힐 때 칸 중심으로 translate 를 옮기고 scale 을 줄인다. 원래 자리는 saved 에 둔다
function setMin(on) {
  min = on;
  win.classList.toggle('is-min', on);
  slot.classList.toggle('is-min', on);
  win.classList.add('is-flying');
  if (on) {
    savedX = px; savedY = py;
    var wr = win.getBoundingClientRect(), sr = slot.getBoundingClientRect();
    px += (sr.left + sr.width / 2) - (wr.left + wr.width / 2);
    py += (sr.top + sr.height / 2) - (wr.top + wr.height / 2);
  } else {
    px = savedX; py = savedY;
  }
  place();
  window.setTimeout(function () { win.classList.remove('is-flying'); }, 320);
}
dt.addEventListener('pointerdown', function () { dt.classList.remove('is-demo'); });
bar.addEventListener('pointerdown', function (e) {
  if (min || e.target.closest('.win__min')) return;
  e.preventDefault();
  bar.setPointerCapture(e.pointerId);
  var ox = px - e.clientX, oy = py - e.clientY;
  function mv(ev) {
    var b = dragBounds();
    px = clampNum(ev.clientX + ox, -b.x, b.x);
    py = clampNum(ev.clientY + oy, -b.y, b.y);
    place();
  }
  bar.addEventListener('pointermove', mv);
  bar.addEventListener('pointerup', function () { bar.removeEventListener('pointermove', mv); }, { once: true });
  bar.addEventListener('pointercancel', function () { bar.removeEventListener('pointermove', mv); }, { once: true });
});
bar.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { dt.classList.remove('is-demo'); setMin(true); return; }
  if (min || e.key.indexOf('Arrow') !== 0) return;
  e.preventDefault();
  dt.classList.remove('is-demo');
  var b = dragBounds(), d = e.shiftKey ? 16 : 4;
  if (e.key === 'ArrowLeft') px = clampNum(px - d, -b.x, b.x);
  if (e.key === 'ArrowRight') px = clampNum(px + d, -b.x, b.x);
  if (e.key === 'ArrowUp') py = clampNum(py - d, -b.y, b.y);
  if (e.key === 'ArrowDown') py = clampNum(py + d, -b.y, b.y);
  place();
});
minBtn.addEventListener('click', function () { dt.classList.remove('is-demo'); setMin(true); });
slot.addEventListener('click', function () { dt.classList.remove('is-demo'); setMin(false); });
</script>
</body>
</html>
