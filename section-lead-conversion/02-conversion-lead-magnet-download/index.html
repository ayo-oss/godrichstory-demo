<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead magnet download — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <form class="lm" id="lm" novalidate>
    <p class="lm__title">시작 가이드 무료로 받기</p>
    <p class="lm__file">
      <span class="lm__file-ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="16" height="16"><g fill="currentColor"><path d="M208 88h-56V32Z" opacity=".2"/><path d="M224 152a8 8 0 0 1-8 8h-24v16h16a8 8 0 0 1 0 16h-16v16a8 8 0 0 1-16 0v-56a8 8 0 0 1 8-8h32a8 8 0 0 1 8 8M92 172a28 28 0 0 1-28 28h-8v8a8 8 0 0 1-16 0v-56a8 8 0 0 1 8-8h16a28 28 0 0 1 28 28m-16 0a12 12 0 0 0-12-12h-8v24h8a12 12 0 0 0 12-12m88 8a36 36 0 0 1-36 36h-16a8 8 0 0 1-8-8v-56a8 8 0 0 1 8-8h16a36 36 0 0 1 36 36m-16 0a20 20 0 0 0-20-20h-8v40h8a20 20 0 0 0 20-20M40 112V40a16 16 0 0 1 16-16h96a8 8 0 0 1 5.66 2.34l56 56A8 8 0 0 1 216 88v24a8 8 0 0 1-16 0V96h-48a8 8 0 0 1-8-8V40H56v72a8 8 0 0 1-16 0m120-32h28.69L160 51.31Z"/></g></svg></span>
      vibe-start-guide.pdf · 2.4MB
    </p>
    <label class="lm__lab" for="lm-email">이메일 주소</label>
    <input class="lm__in" id="lm-email" type="email" placeholder="you@example.com" autocomplete="email">
    <label class="lm__agree" for="lm-ok">
      <input class="lm__cb" id="lm-ok" type="checkbox">
      <span>업데이트 소식도 받을게요 (언제든 해지)</span>
    </label>
    <button class="lm__btn" id="lm-btn" type="submit">
      <span class="lm__prog" aria-hidden="true"></span>
      <span class="lm__btn-t">
        <span class="lm__btn-ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="16" height="16"><g fill="currentColor"><path d="M216 48v160H40V48a16 16 0 0 1 16-16h144a16 16 0 0 1 16 16" opacity=".2"/><path d="M224 144v64a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8v-64a8 8 0 0 1 16 0v56h160v-56a8 8 0 0 1 16 0m-101.66 5.66a8 8 0 0 0 11.32 0l40-40a8 8 0 0 0-11.32-11.32L136 124.69V32a8 8 0 0 0-16 0v92.69L93.66 98.34a8 8 0 0 0-11.32 11.32Z"/></g></svg></span>
        자료 받기
      </span>
    </button>
    <p class="lm__msg" id="lm-msg" role="status" aria-live="polite">이메일만 넣으면 바로 받을 수 있어요</p>
    <a class="lm__chip" id="lm-chip" href="data:text/plain,vibe-start-guide%20sample" download="vibe-start-guide.txt">
      <span class="lm__chip-ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="16" height="16"><g fill="currentColor"><path d="M216 96v112a8 8 0 0 1-8 8H48a8 8 0 0 1-8-8V96a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 80H96V56a32 32 0 0 1 32-32c15.37 0 29.2 11 32.16 25.59a8 8 0 0 0 15.68-3.18C171.32 24.15 151.2 8 128 8a48.05 48.05 0 0 0-48 48v24H48a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V96a16 16 0 0 0-16-16m0 128H48V96h160z"/></g></svg></span>
      다운로드 준비됨 — 눌러서 받기
    </a>
  </form>
</main>
<script>
// 실제 동작: 이메일 정규식과 동의 칸을 함께 보고, 통과하면 버튼을 aria-busy 로 잠근 뒤 진행 막대를 900ms 채우고
// 다운로드 칩을 띄운다. 한 번 받은 사람은 localStorage 에 남겨 다음 방문에 곧장 완료 상태로 연다.
var stage = document.querySelector('.stage');
var form = document.getElementById('lm');
var input = document.getElementById('lm-email');
var agree = document.getElementById('lm-ok');
var btn = document.getElementById('lm-btn');
var msg = document.getElementById('lm-msg');
var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function human() { stage.classList.remove('is-demo'); }
function finish() {
  form.classList.add('is-done');
  msg.textContent = '자료가 준비됐어요. 아래에서 받으세요';
}
try { if (localStorage.getItem('lead271')) finish(); } catch (e) { /* iframe 이 저장소를 막으면 처음 받는 사람과 똑같이 논다 */ }
form.addEventListener('submit', function (e) {
  e.preventDefault();
  human();
  if (!EMAIL_RE.test(input.value) || !agree.checked) {
    input.classList.remove('is-shake');
    void input.offsetWidth;
    input.classList.add('is-shake');
    msg.textContent = '이메일과 동의 칸을 확인해 주세요';
    return;
  }
  btn.disabled = true;
  btn.setAttribute('aria-busy', 'true');
  form.classList.add('is-busy');
  msg.textContent = '파일을 준비하고 있어요';
  setTimeout(function () {
    form.classList.remove('is-busy');
    btn.disabled = false;
    btn.removeAttribute('aria-busy');
    try { localStorage.setItem('lead271', '1'); } catch (e2) { /* 저장 실패해도 이번 화면은 완료로 간다 */ }
    finish();
  }, 900);
});
stage.addEventListener('pointerdown', human, { once: true });
window.addEventListener('keydown', human, { once: true });
</script>
</body>
</html>
