<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이의 해소 FAQ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <section class="ob">
    <p class="ob__title">
      <span class="ob__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="18" height="18"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M140 180a12 12 0 1 1-12-12a12 12 0 0 1 12 12M128 72c-22.06 0-40 16.15-40 36v4a8 8 0 0 0 16 0v-4c0-11 10.77-20 24-20s24 9 24 20s-10.77 20-24 20a8 8 0 0 0-8 8v8a8 8 0 0 0 16 0v-.72c18.24-3.35 32-17.9 32-35.28c0-19.85-17.94-36-40-36m104 56A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></svg></span>
      아직 망설이는 부분
    </p>
    <ul class="ob__list">
      <li class="ob__item" style="--i:0">
        <button type="button" class="ob__q" aria-expanded="false" aria-controls="ob-a1">
          <span class="ob__q-t">가격이 부담돼요</span>
          <span class="ob__done">
            <svg class="ob__check" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/><polyline points="7 12.5 10.5 16 17 8.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="ob__done-t">해소됨</span>
          </span>
        </button>
        <div class="ob__a" id="ob-a1"><div class="ob__a-in"><p>첫 달 ₩0, 이후엔 쓴 만큼만 냅니다.</p></div></div>
      </li>
      <li class="ob__item" style="--i:1">
        <button type="button" class="ob__q" aria-expanded="false" aria-controls="ob-a2">
          <span class="ob__q-t">써보지 않고 믿기 어려워요</span>
          <span class="ob__done">
            <svg class="ob__check" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/><polyline points="7 12.5 10.5 16 17 8.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="ob__done-t">해소됨</span>
          </span>
        </button>
        <div class="ob__a" id="ob-a2"><div class="ob__a-in"><p>카드 없이 14일 동안 전체 기능을 씁니다.</p></div></div>
      </li>
      <li class="ob__item" style="--i:2">
        <button type="button" class="ob__q" aria-expanded="false" aria-controls="ob-a3">
          <span class="ob__q-t">해지가 번거로울까 봐요</span>
          <span class="ob__done">
            <svg class="ob__check" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/><polyline points="7 12.5 10.5 16 17 8.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="ob__done-t">해소됨</span>
          </span>
        </button>
        <div class="ob__a" id="ob-a3"><div class="ob__a-in"><p>설정에서 버튼 한 번이면 끝납니다.</p></div></div>
      </li>
    </ul>
    <button type="button" class="ob__cta">
      <span class="ob__cta-t">자유롭게 시작하기</span>
      <span class="ob__cta-t ob__cta-t--ready" aria-hidden="true">준비됐어요, 눌러주세요</span>
    </button>
    <p class="ob__status" role="status"></p>
  </section>
</main>
<script>
// 실제 동작: 질문 줄을 누르면 답이 grid 0fr→1fr 로 펼쳐지고 그 줄에 체크가 그려진다.
// 세 줄을 모두 한 번씩 열면 CTA 글자가 바뀌고 펄스가 시작된다.
var stage = document.querySelector('.stage');
var ob = document.querySelector('.ob');
var items = [].slice.call(document.querySelectorAll('.ob__item'));
var status = document.querySelector('.ob__status');
var label = document.querySelector('.ob__cta-t');
var labelReady = document.querySelector('.ob__cta-t--ready');
var opened = [];
['pointerdown', 'keydown'].forEach(function (t) {
  window.addEventListener(t, function () { stage.classList.remove('is-demo'); }, { once: true });
});
items.forEach(function (item, idx) {
  var q = item.querySelector('.ob__q');
  q.addEventListener('click', function () {
    var open = item.classList.toggle('is-open');
    q.setAttribute('aria-expanded', String(open));
    if (open && opened.indexOf(idx) < 0) opened.push(idx);
    if (opened.length === items.length && !ob.classList.contains('is-ready')) {
      ob.classList.add('is-ready');
      label.setAttribute('aria-hidden', 'true');
      labelReady.removeAttribute('aria-hidden');
      status.textContent = '모든 걸림돌이 풀렸어요';
    }
  });
});
</script>
</body>
</html>
