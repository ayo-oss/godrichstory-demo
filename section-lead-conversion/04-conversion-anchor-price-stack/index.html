<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가격 앵커 스택 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <section class="ap">
    <header class="ap__head">
      <span class="ap__ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="20" height="20"><g fill="currentColor"><path d="M237.66 153L153 237.66a8 8 0 0 1-11.31 0l-99.35-99.32a8 8 0 0 1-2.34-5.65V40h92.69a8 8 0 0 1 5.65 2.34l99.32 99.32a8 8 0 0 1 0 11.34" opacity=".2"/><path d="M243.31 136L144 36.69A15.86 15.86 0 0 0 132.69 32H40a8 8 0 0 0-8 8v92.69A15.86 15.86 0 0 0 36.69 144L136 243.31a16 16 0 0 0 22.63 0l84.68-84.68a16 16 0 0 0 0-22.63m-96 96L48 132.69V48h84.69L232 147.31ZM96 84a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></svg></span>
      <div class="ap__tt">
        <p class="ap__plan">스타터 플랜</p>
        <p class="ap__sub">첫 달 요금 알아보기</p>
      </div>
    </header>
    <button type="button" class="ap__toggle" aria-expanded="false" aria-controls="ap-panel">
      <span class="ap__toggle-t">가격 구성 보기</span>
      <svg class="ap__chev" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="ap__panel" id="ap-panel">
      <div class="ap__panel-in">
        <ul class="ap__stack">
          <li class="ap__row" style="--i:0">
            <span class="ap__label">정가</span>
            <span class="ap__orig">₩59,000<span class="ap__strike" aria-hidden="true"></span></span>
          </li>
          <li class="ap__row" style="--i:1">
            <span class="ap__label">첫 달 할인가</span>
            <b class="ap__deal">₩29,000</b>
          </li>
          <li class="ap__row" style="--i:2">
            <span class="ap__label">쿠폰 적용가</span>
            <span class="ap__final">₩20,300</span>
          </li>
          <li class="ap__row ap__row--save" style="--i:3">
            <span class="ap__save">₩38,700 절약</span>
          </li>
        </ul>
      </div>
    </div>
  </section>
</main>
<script>
// 실제 동작: 토글 버튼을 누르면 패널이 grid 0fr→1fr 로 펼쳐지고 네 줄이 시차 등장한다.
// 처음 조작(pointerdown·keydown 1회)에서 측정용 루프 is-demo 를 뗀다.
var stage = document.querySelector('.stage');
var ap = document.querySelector('.ap');
var btn = document.querySelector('.ap__toggle');
['pointerdown', 'keydown'].forEach(function (t) {
  window.addEventListener(t, function () { stage.classList.remove('is-demo'); }, { once: true });
});
btn.addEventListener('click', function () {
  var open = ap.classList.toggle('is-open');
  btn.setAttribute('aria-expanded', String(open));
});
</script>
</body>
</html>
