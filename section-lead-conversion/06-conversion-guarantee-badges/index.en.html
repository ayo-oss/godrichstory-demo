<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보증 배지 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <section class="gb">
    <p class="gb__title">Start with confidence</p>
    <ul class="gb__grid">
      <li class="gb__cell" style="--i:0; --r:-6deg">
        <button type="button" class="gb__badge" aria-expanded="false" aria-controls="gb-m1">
          <span class="gb__stamp">
            <svg class="gb__ic" viewBox="0 0 256 256" width="20" height="20" aria-hidden="true"><g fill="currentColor"><path d="M216 56v56c0 96-88 120-88 120s-88-24-88-120V56a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 40H48a16 16 0 0 0-16 16v56c0 52.72 25.52 84.67 46.93 102.19c23.06 18.86 46 25.26 47 25.53a8 8 0 0 0 4.2 0c1-.27 23.91-6.67 47-25.53C198.48 196.67 224 164.72 224 112V56a16 16 0 0 0-16-16m0 72c0 37.07-13.66 67.16-40.6 89.42a129.3 129.3 0 0 1-39.4 22.2a128.3 128.3 0 0 1-38.92-21.81C61.82 179.51 48 149.3 48 112V56h160ZM82.34 141.66a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 11.32l-56 56a8 8 0 0 1-11.32 0Z"/></g></svg>
            <svg class="gb__draw" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><polyline points="6 12.6 10 16.6 18 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="gb__label">14-day refund</span>
        </button>
        <div class="gb__more" id="gb-m1"><div class="gb__more-in"><p>Full refund within 14 days, no questions asked.</p></div></div>
      </li>
      <li class="gb__cell" style="--i:1; --r:6deg">
        <button type="button" class="gb__badge" aria-expanded="false" aria-controls="gb-m2">
          <span class="gb__stamp">
            <svg class="gb__ic" viewBox="0 0 256 256" width="20" height="20" aria-hidden="true"><g fill="currentColor"><path d="M208 88H48a8 8 0 0 0-8 8v112a8 8 0 0 0 8 8h160a8 8 0 0 0 8-8V96a8 8 0 0 0-8-8m-80 72a20 20 0 1 1 20-20a20 20 0 0 1-20 20" opacity=".2"/><path d="M208 80h-32V56a48 48 0 0 0-96 0v24H48a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V96a16 16 0 0 0-16-16M96 56a32 32 0 0 1 64 0v24H96Zm112 152H48V96h160zm-80-96a28 28 0 0 0-8 54.83V184a8 8 0 0 0 16 0v-17.17a28 28 0 0 0-8-54.83m0 40a12 12 0 1 1 12-12a12 12 0 0 1-12 12"/></g></svg>
          </span>
          <span class="gb__label">Secure checkout</span>
        </button>
        <div class="gb__more" id="gb-m2"><div class="gb__more-in"><p>We never store your payment details on our servers.</p></div></div>
      </li>
      <li class="gb__cell" style="--i:2; --r:-6deg">
        <button type="button" class="gb__badge" aria-expanded="false" aria-controls="gb-m3">
          <span class="gb__stamp">
            <svg class="gb__ic" viewBox="0 0 256 256" width="20" height="20" aria-hidden="true"><g fill="currentColor"><path d="M232 80v96a8 8 0 0 1-8 8H32a8 8 0 0 1-8-8V80a8 8 0 0 1 8-8h192a8 8 0 0 1 8 8" opacity=".2"/><path d="M224 64H32a16 16 0 0 0-16 16v96a16 16 0 0 0 16 16h192a16 16 0 0 0 16-16V80a16 16 0 0 0-16-16m0 112H32V80h192zm-24-48a12 12 0 1 1-12-12a12 12 0 0 1 12 12"/></g></svg>
          </span>
          <span class="gb__label">Your data, protected</span>
        </button>
        <div class="gb__more" id="gb-m3"><div class="gb__more-in"><p>Export or delete your data whenever you want.</p></div></div>
      </li>
      <li class="gb__cell" style="--i:3; --r:6deg">
        <button type="button" class="gb__badge" aria-expanded="false" aria-controls="gb-m4">
          <span class="gb__stamp">
            <svg class="gb__ic" viewBox="0 0 256 256" width="20" height="20" aria-hidden="true"><g fill="currentColor"><path d="M216 48v40H40V48a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 32h-24v-8a8 8 0 0 0-16 0v8H88v-8a8 8 0 0 0-16 0v8H48a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16M72 48v8a8 8 0 0 0 16 0v-8h80v8a8 8 0 0 0 16 0v-8h24v32H48V48Zm136 160H48V96h160zm-50.34-74.34L139.31 152l18.35 18.34a8 8 0 0 1-11.32 11.32L128 163.31l-18.34 18.35a8 8 0 0 1-11.32-11.32L116.69 152l-18.35-18.34a8 8 0 0 1 11.32-11.32L128 140.69l18.34-18.35a8 8 0 0 1 11.32 11.32"/></g></svg>
          </span>
          <span class="gb__label">Cancel anytime</span>
        </button>
        <div class="gb__more" id="gb-m4"><div class="gb__more-in"><p>One tap to cancel — no charge next month.</p></div></div>
      </li>
    </ul>
  </section>
</main>
<script>
// 실제 동작: 배지를 누르면(마우스·Enter·Space) 그 배지 설명만 grid 0fr→1fr 로 펼쳐지고 나머지는 닫힌다.
var stage = document.querySelector('.stage');
var cells = [].slice.call(document.querySelectorAll('.gb__cell'));
['pointerdown', 'keydown'].forEach(function (t) {
  window.addEventListener(t, function () { stage.classList.remove('is-demo'); }, { once: true });
});
cells.forEach(function (cell) {
  var badge = cell.querySelector('.gb__badge');
  badge.addEventListener('click', function () {
    var willOpen = !cell.classList.contains('is-open');
    cells.forEach(function (other) {
      other.classList.remove('is-open');
      other.querySelector('.gb__badge').setAttribute('aria-expanded', 'false');
    });
    if (willOpen) {
      cell.classList.add('is-open');
      badge.setAttribute('aria-expanded', 'true');
    }
  });
});
</script>
</body>
</html>
