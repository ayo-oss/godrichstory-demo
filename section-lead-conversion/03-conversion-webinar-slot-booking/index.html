<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webinar slot booking — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <section class="wb">
    <p class="wb__title">
      <span class="wb__title-ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="16" height="16"><g fill="currentColor"><path d="M216 48v40H40V48a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"/><path d="M208 32h-24v-8a8 8 0 0 0-16 0v8H88v-8a8 8 0 0 0-16 0v8H48a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16M72 48v8a8 8 0 0 0 16 0v-8h80v8a8 8 0 0 0 16 0v-8h24v32H48V48Zm136 160H48V96h160z"/></g></svg></span>
      웨비나 회차 고르기
    </p>
    <div class="wb__slots" id="wb-slots" role="radiogroup" aria-label="웨비나 회차">
      <button class="wb__slot" type="button" role="radio" aria-checked="true" tabindex="0" data-t="목 20:00">
        <span class="wb__ring" aria-hidden="true"></span>
        <span class="wb__day">목 20:00</span>
        <span class="wb__seat">8석 남음</span>
        <span class="wb__ok" aria-hidden="true"><svg class="wb__ok-ic" viewBox="0 0 24 24" width="10" height="10"><polyline points="4 12 9 17 20 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>확정됨</span>
      </button>
      <button class="wb__slot" type="button" role="radio" aria-checked="false" tabindex="-1" data-t="금 11:00">
        <span class="wb__ring" aria-hidden="true"></span>
        <span class="wb__day">금 11:00</span>
        <span class="wb__seat">24석</span>
        <span class="wb__ok" aria-hidden="true"><svg class="wb__ok-ic" viewBox="0 0 24 24" width="10" height="10"><polyline points="4 12 9 17 20 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>확정됨</span>
      </button>
      <button class="wb__slot" type="button" role="radio" aria-checked="false" tabindex="-1" data-t="금 20:00" disabled>
        <span class="wb__ring" aria-hidden="true"></span>
        <span class="wb__day">금 20:00</span>
        <span class="wb__seat wb__seat--closed">마감</span>
        <span class="wb__ok" aria-hidden="true"><svg class="wb__ok-ic" viewBox="0 0 24 24" width="10" height="10"><polyline points="4 12 9 17 20 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>확정됨</span>
      </button>
    </div>
    <p class="wb__cd" role="timer" aria-live="off">
      <span class="wb__cd-ic" aria-hidden="true"><svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88m64-88a8 8 0 0 1-8 8h-56a8 8 0 0 1-8-8V72a8 8 0 0 1 16 0v48h48a8 8 0 0 1 8 8"/></g></svg></span>
      선택 회차 마감까지
      <span class="wb__clock" aria-hidden="true"><b class="wb__mm" id="wb-mm">14</b>:<span class="wb__d" id="wb-d1" style="--d:3"><span class="wb__strip"><b>0</b><b>1</b><b>2</b><b>3</b><b>4</b><b>5</b><b>6</b><b>7</b><b>8</b><b>9</b></span></span><span class="wb__d wb__d--s1" id="wb-d0" style="--d:2"><span class="wb__strip"><b>0</b><b>1</b><b>2</b><b>3</b><b>4</b><b>5</b><b>6</b><b>7</b><b>8</b><b>9</b></span></span></span>
      <span class="sr-only" id="wb-cdt">14분 32초 남음</span>
    </p>
    <button class="wb__go" id="wb-go" type="button">이 회차로 예약하기</button>
    <p class="wb__msg" id="wb-msg" role="status" aria-live="polite">회차를 고르면 자리를 잡아 둬요</p>
  </section>
</main>
<script>
// 실제 동작: 회차는 radiogroup 이라 클릭·좌우 방향키로 고른다(aria-checked 로 상태를 알린다). setInterval 이 1초마다
// 남은 시간을 줄여 숫자 띠를 --d 만큼 올리고, 예약 버튼은 고른 회차에 확정 배지를 내려앉힌다.
var stage = document.querySelector('.stage');
var slots = [].slice.call(document.querySelectorAll('.wb__slot'));
var book = document.getElementById('wb-go');
var msg = document.getElementById('wb-msg');
var srText = document.getElementById('wb-cdt');
var mm = document.getElementById('wb-mm'), d1 = document.getElementById('wb-d1'), d0 = document.getElementById('wb-d0');
var left = 14 * 60 + 32, picked = 0, booked = -1;
function human() { stage.classList.remove('is-demo'); }
function tick() {
  var m = Math.floor(left / 60), s = left % 60;
  mm.textContent = m < 10 ? '0' + m : '' + m;
  d1.style.setProperty('--d', Math.floor(s / 10));
  d0.style.setProperty('--d', s % 10);
  srText.textContent = m + '분 ' + s + '초 남음';
}
function pick(i) {
  picked = i;
  slots.forEach(function (b, j) {
    b.setAttribute('aria-checked', j === i ? 'true' : 'false');
    b.tabIndex = j === i ? 0 : -1;
  });
  slots[i].focus({ preventScroll: true });
}
slots.forEach(function (b, i) { b.addEventListener('click', function () { human(); pick(i); }); });
document.getElementById('wb-slots').addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  e.preventDefault(); human();
  var n = picked, step = e.key === 'ArrowRight' ? 1 : slots.length - 1;
  do { n = (n + step) % slots.length; } while (slots[n].disabled && n !== picked);
  pick(n);
});
book.addEventListener('click', function () {
  human();
  if (booked === picked) { msg.textContent = '이미 예약한 회차예요'; return; }
  booked = picked;
  slots.forEach(function (b) { b.classList.remove('is-ok'); });
  slots[picked].classList.add('is-ok');
  msg.textContent = slots[picked].dataset.t + ' 회차로 예약했습니다. 확인 메일을 보냈어요';
});
setInterval(function () { if (left > 0) { left--; tick(); } }, 1000);
tick();
stage.addEventListener('pointerdown', human, { once: true });
window.addEventListener('keydown', human, { once: true });
</script>
</body>
</html>
