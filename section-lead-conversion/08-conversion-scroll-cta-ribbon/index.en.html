<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll CTA ribbon — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo" id="stage">
  <div class="sr">
    <div class="sr__vp" id="sr-vp">
      <div class="sr__track" id="sr-track">
        <p class="sr__h">How to pick a weekly plan</p>
        <p class="sr__p">Start with the smallest plan first.</p>
        <p class="sr__p">It takes about two weeks to see how much you actually use.</p>
        <p class="sr__p">Upgrading then is soon enough, and you can downgrade in the same place.</p>
        <p class="sr__p sr__p--mark" data-mark>You can start here for $0 a month<span class="sr__hl" aria-hidden="true"></span></p>
        <p class="sr__p">More details follow in the guide below.</p>
      </div>
    </div>

    <div class="sr__ribbon" id="sr-ribbon">
      <span class="sr__ribbon-t">Start from $0/mo</span>
      <span class="sr__arrow" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g></svg>
      </span>
      <button type="button" class="sr__close" id="sr-close" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="12" height="12" aria-hidden="true"><g fill="currentColor"><path d="M216 56v144a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h144a16 16 0 0 1 16 16" opacity=".2"/><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg>
      </button>
    </div>

    <button type="button" class="sr__again" id="sr-again" hidden>Show again</button>
  </div>
  <p class="sr__msg" role="status" id="sr-msg"></p>
</main>
<script>
// 실제 동작: IntersectionObserver 가 스크롤 상자 안 표시 단락(data-mark)을 감시해 60% 이상 보이면 리본이 올라온다. 닫으면 "Show again" 알약이 뜨고, 닫은 사실은 sessionStorage(ribbon271)에 남아 새로 고쳐도 닫힌 채로 시작한다.
var stage = document.getElementById('stage');
var vp = document.getElementById('sr-vp');
var ribbon = document.getElementById('sr-ribbon');
var closeBtn = document.getElementById('sr-close');
var again = document.getElementById('sr-again');
var msg = document.getElementById('sr-msg');
var mark = document.querySelector('[data-mark]');
var closed = false;
try { closed = sessionStorage.getItem('ribbon271') === 'closed'; } catch (err) {}
if (closed) { again.hidden = false; msg.textContent = 'The banner is dismissed'; }

var io = new IntersectionObserver(function (entries) {
  if (entries[0].isIntersecting && !closed) {
    ribbon.classList.add('is-up');
    msg.textContent = 'The start banner slid up';
  }
}, { root: vp, threshold: 0.6 });
io.observe(mark);

closeBtn.addEventListener('click', function () {
  closed = true;
  ribbon.classList.remove('is-up');
  again.hidden = false;
  again.focus({preventScroll:true});
  msg.textContent = 'The banner is dismissed';
  try { sessionStorage.setItem('ribbon271', 'closed'); } catch (err) {}
});
again.addEventListener('click', function () {
  closed = false;
  ribbon.classList.add('is-up');
  again.hidden = true;
  msg.textContent = 'The start banner is back';
  try { sessionStorage.removeItem('ribbon271'); } catch (err) {}
});
function human() { stage.classList.remove('is-demo'); }
document.addEventListener('pointerdown', human, { once: true });
document.addEventListener('keydown', human, { once: true });
</script>
</body>
</html>
