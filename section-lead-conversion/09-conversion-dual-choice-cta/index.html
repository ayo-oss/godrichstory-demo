<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dual choice CTA — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo" id="stage">
  <div class="dc">
    <p class="dc__title">어떻게 시작할까요?</p>

    <div class="dc__cards" role="radiogroup" aria-label="시작 방법" id="dc-group">
      <div class="dc__cell">
        <input class="dc__radio" type="radio" id="dc-a" name="dc271" value="free" checked>
        <label class="dc__label" for="dc-a">
          <span class="dc__ring" aria-hidden="true"></span>
          <span class="dc__ic" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="22" height="22"><g fill="currentColor"><path d="M184 120v61.65a8 8 0 0 1-2.34 5.65l-34.35 34.35a8 8 0 0 1-13.57-4.53L128 176Zm-48-48H74.35a8 8 0 0 0-5.65 2.34l-34.35 34.35a8 8 0 0 0 4.53 13.57L80 128ZM40 216c37.65 0 50.69-19.69 54.56-28.18l-26.38-26.38C59.69 165.31 40 178.35 40 216" opacity=".2"/><path d="M223.85 47.12a16 16 0 0 0-15-15c-12.58-.75-44.73.4-71.41 27.07L132.69 64H74.36A15.9 15.9 0 0 0 63 68.68L28.7 103a16 16 0 0 0 9.07 27.16l38.47 5.37l44.21 44.21l5.37 38.49a15.94 15.94 0 0 0 10.78 12.92a16.1 16.1 0 0 0 5.1.83a15.9 15.9 0 0 0 11.3-4.68l34.32-34.3a15.9 15.9 0 0 0 4.68-11.36v-58.33l4.77-4.77c26.68-26.68 27.83-58.83 27.08-71.42M74.36 80h42.33l-39.53 39.52L40 114.34Zm74.41-9.45a76.65 76.65 0 0 1 59.11-22.47a76.46 76.46 0 0 1-22.42 59.16L128 164.68L91.32 128ZM176 181.64L141.67 216l-5.19-37.17L176 139.31Zm-74.16 9.5C97.34 201 82.29 224 40 224a8 8 0 0 1-8-8c0-42.29 23-57.34 32.86-61.85a8 8 0 0 1 6.64 14.56c-6.43 2.93-20.62 12.36-23.12 38.91c26.55-2.5 36-16.69 38.91-23.12a8 8 0 1 1 14.56 6.64Z"/></g></svg>
          </span>
          <span class="dc__name">무료로 시작하기</span>
          <span class="dc__sub">가입 없이 30초</span>
          <span class="dc__arrow" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g></svg>
          </span>
        </label>
      </div>

      <div class="dc__cell">
        <input class="dc__radio" type="radio" id="dc-b" name="dc271" value="demo">
        <label class="dc__label" for="dc-b">
          <span class="dc__ring" aria-hidden="true"></span>
          <span class="dc__ic" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="22" height="22"><g fill="currentColor"><path d="M80 144v40a16 16 0 0 1-16 16H48a16 16 0 0 1-16-16v-56h32a16 16 0 0 1 16 16m112-16a16 16 0 0 0-16 16v40a16 16 0 0 0 16 16h32v-72Z" opacity=".2"/><path d="M201.89 54.66A104.08 104.08 0 0 0 24 128v56a24 24 0 0 0 24 24h16a24 24 0 0 0 24-24v-40a24 24 0 0 0-24-24H40.36a88.12 88.12 0 0 1 150.18-54.07A87.4 87.4 0 0 1 215.65 120H192a24 24 0 0 0-24 24v40a24 24 0 0 0 24 24h24a24 24 0 0 1-24 24h-56a8 8 0 0 0 0 16h56a40 40 0 0 0 40-40v-80a103.4 103.4 0 0 0-30.11-73.34M64 136a8 8 0 0 1 8 8v40a8 8 0 0 1-8 8H48a8 8 0 0 1-8-8v-48Zm128 56a8 8 0 0 1-8-8v-40a8 8 0 0 1 8-8h24v56Z"/></g></svg>
          </span>
          <span class="dc__name">데모 상담 잡기</span>
          <span class="dc__sub">20분 화상 미팅</span>
          <span class="dc__arrow" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g></svg>
          </span>
        </label>
      </div>
    </div>

    <button type="button" class="dc__pv" id="dc-pv">
      <span class="dc__pv-t dc__pv-t--a" id="dc-pv-a">다음: 템플릿 골라 첫 화면 만들기</span>
      <span class="dc__pv-t dc__pv-t--b" id="dc-pv-b" aria-hidden="true">다음: 편한 시간 골라 20분 잡기</span>
      <span class="dc__pv-t dc__pv-t--go" id="dc-pv-go" aria-hidden="true">시작하기 »</span>
    </button>
    <p class="dc__msg" role="status" id="dc-msg">
      <span class="dc__msg-t dc__msg-t--a" id="dc-msg-a">무료 시작을 골랐어요</span>
      <span class="dc__msg-t dc__msg-t--b" id="dc-msg-b" aria-hidden="true">상담 예약을 골랐어요</span>
    </p>
  </div>
</main>
<script>
// 실제 동작: 진짜 radio 라 클릭도 좌우 방향키도 그대로 먹는다. 고른 쪽이 앞으로 나오고 아래 미리보기 줄이 바뀌며, Enter 나 더블클릭이면 미리보기 줄이 시작 버튼으로 바뀐다.
var stage = document.getElementById('stage');
var group = document.getElementById('dc-group');
var a = document.getElementById('dc-a');
var b = document.getElementById('dc-b');
var pv = document.getElementById('dc-pv');
var pvA = document.getElementById('dc-pv-a');
var pvB = document.getElementById('dc-pv-b');
var pvGo = document.getElementById('dc-pv-go');
var msg = document.getElementById('dc-msg');
var msgA = document.getElementById('dc-msg-a');
var msgB = document.getElementById('dc-msg-b');
var armed = false;

function paint() {
  a.setAttribute('aria-checked', String(a.checked));
  b.setAttribute('aria-checked', String(b.checked));
  pv.classList.toggle('is-b', b.checked);
  pv.classList.toggle('is-armed', armed);
  pvA.setAttribute('aria-hidden', String(armed || b.checked));
  pvB.setAttribute('aria-hidden', String(armed || a.checked));
  pvGo.setAttribute('aria-hidden', String(!armed));
  // 안내 문장도 선택과 같은 시계로 갈린다 — 루프에서는 CSS 가 같은 컷으로 바꾼다
  msg.classList.toggle('is-b', b.checked);
  msgA.setAttribute('aria-hidden', String(b.checked));
  msgB.setAttribute('aria-hidden', String(a.checked));
}
paint();
group.addEventListener('change', function () { armed = false; paint(); });
group.addEventListener('dblclick', function () { armed = true; paint(); });
group.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { armed = true; paint(); pv.focus({preventScroll:true}); }
});
pv.addEventListener('click', function () {
  msgA.textContent = '무료 시작으로 넘어갑니다';
  msgB.textContent = '상담 예약으로 넘어갑니다';
});
function human() { stage.classList.remove('is-demo'); }
document.addEventListener('pointerdown', human, { once: true });
document.addEventListener('keydown', human, { once: true });
</script>
</body>
</html>
