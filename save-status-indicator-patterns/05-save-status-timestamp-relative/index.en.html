<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last-saved timestamp refresh — the elapsed-time-since-save value recalculates every second and turns into a changing phrase — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="str is-demo" id="str">
  <span class="str__dot" id="strDot"></span>
  <span class="str__label" id="strLabel">Saved just now</span>
  <button class="str__btn" id="strBtn" type="button">Save now</button>
</div>
<script>
(function () {
  var root = document.getElementById('str');
  var btn = document.getElementById('strBtn');
  var dot = document.getElementById('strDot');
  var label = document.getElementById('strLabel');

  // 상수: 데모 안에서 "1초"를 표현하는 실제 ms(가속) · 분으로 넘어가는 기준 초 · 리셋되는 기준 초
  var DEMO_SEC_MS = 90;
  var MIN_THRESHOLD_SEC = 60;
  var RESET_AFTER_SEC = 150;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var savedAt = performance.now();

  // 계산 겹: 경과 초 = (지금 − 저장시각)÷가속ms, 초·분 환산으로 문구를 만들고 신선도(투명도)는 1 − min(1, 경과÷기준)
  function raf(ts) {
    var elapsedSec = Math.floor((ts - savedAt) / DEMO_SEC_MS);
    if (elapsedSec >= RESET_AFTER_SEC) { savedAt = ts; elapsedSec = 0; }
    var phrase;
    if (elapsedSec < 5) phrase = 'Saved just now';
    else if (elapsedSec < MIN_THRESHOLD_SEC) phrase = elapsedSec + 'sec ago';
    else phrase = Math.floor(elapsedSec / 60) + 'min ago';
    label.textContent = phrase;
    var fresh = 1 - Math.min(1, elapsedSec / RESET_AFTER_SEC);
    dot.style.opacity = reduce ? '1' : (0.35 + 0.65 * fresh).toFixed(3);
    requestAnimationFrame(raf);
  }
  requestAnimationFrame(raf);

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    savedAt = performance.now();
    label.textContent = 'Saved just now';
    dot.style.opacity = '1';
  });
})();
</script>
</main>
</body>
</html>
