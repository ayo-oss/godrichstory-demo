<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved-flag flash — the completion value flips to one the instant a save finishes, then falls back to zero and disappears — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ssc is-demo" id="ssc">
  <div class="ssc__badge" id="sscBadge">
    <svg class="ssc__ring" viewBox="0 0 40 40" width="40" height="40">
      <circle class="ssc__circle" cx="20" cy="20" r="17"></circle>
      <polyline class="ssc__check" id="sscCheck" points="12,21 17,26 28,13"></polyline>
    </svg>
  </div>
  <span class="ssc__label" id="sscLabel">Save complete</span>
  <button class="ssc__btn" id="sscBtn" type="button">Save changes</button>
</div>
<script>
(function () {
  var root = document.getElementById('ssc');
  var btn = document.getElementById('sscBtn');
  var badge = document.getElementById('sscBadge');
  var check = document.getElementById('sscCheck');

  // 상수: 체크 선이 그려지는 시간 · 다 그려진 뒤 머무는 시간 · 사라지는 시간 · 다음 저장까지 간격
  var DRAW_MS = 300;
  var HOLD_MS = 380;
  var FADE_MS = 200;
  var GAP_MS = 260;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 계산 겹: getTotalLength() 로 실제 경로 길이를 재고, stroke-dashoffset = 길이×(1−t) 로 그려 나간다
  var len = check.getTotalLength();
  check.style.strokeDasharray = String(len);
  check.style.strokeDashoffset = String(len);

  var timer = null;

  function draw(cb) {
    if (reduce) { check.style.strokeDashoffset = '0'; cb(); return; }
    var start = null;
    function frame(ts) {
      if (start === null) start = ts;
      var t = Math.min(1, (ts - start) / DRAW_MS);
      check.style.strokeDashoffset = (len * (1 - t)).toFixed(2);
      if (t < 1) requestAnimationFrame(frame); else cb();
    }
    requestAnimationFrame(frame);
  }

  function cycle() {
    badge.classList.add('ssc__badge--show');
    draw(function () {
      timer = setTimeout(function () {
        badge.classList.remove('ssc__badge--show');
        timer = setTimeout(function () {
          check.style.strokeDashoffset = String(len);
          timer = setTimeout(cycle, GAP_MS);
        }, reduce ? 0 : FADE_MS);
      }, HOLD_MS);
    });
  }
  cycle();

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    if (timer) clearTimeout(timer);
    check.style.strokeDashoffset = String(len);
    badge.classList.remove('ssc__badge--show');
    requestAnimationFrame(cycle);
  });
})();
</script>
</main>
</body>
</html>
