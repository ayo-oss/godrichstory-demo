<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>저장 충돌 안내 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="scb is-demo" id="scb">
  <div class="scb__banner" id="scbBanner">
    <span class="scb__msg">다른 곳에서 먼저 저장되었습니다</span>
    <div class="scb__actions">
      <button class="scb__choice" id="scbKeep" type="button">내 변경 유지</button>
      <button class="scb__choice scb__choice--ghost" id="scbReload" type="button">새로고침</button>
    </div>
  </div>
  <div class="scb__idle">저장됨</div>
</div>
<script>
(function () {
  var root = document.getElementById('scb');
  var banner = document.getElementById('scbBanner');
  var keepBtn = document.getElementById('scbKeep');
  var reloadBtn = document.getElementById('scbReload');

  // 상수: 스프링 강성·감쇠(질량 1) · 저절로 충돌이 나타나는 간격 · 선택 없을 때 자동 해소까지 대기
  var SPRING_K = 200;
  var SPRING_C = 19;
  var APPEAR_MS = 1400;
  var AUTO_RESOLVE_MS = 850;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pos = -60;
  var vel = 0;
  var target = -60;
  var rafId = null;
  var timer = null;

  // 계산 겹: 배너 위치를 스프링-감쇠 물리로 적분 — 속도 += (−K×변위 − C×속도)×dt, 위치 += 속도×dt
  function tick(ts, last) {
    var dt = Math.min(32, ts - last) / 1000;
    var disp = pos - target;
    var acc = -SPRING_K * disp - SPRING_C * vel;
    vel += acc * dt;
    pos += vel * dt;
    banner.style.transform = 'translateY(' + pos.toFixed(2) + '%)';
    if (Math.abs(disp) > 0.3 || Math.abs(vel) > 0.5) {
      rafId = requestAnimationFrame(function (t) { tick(t, ts); });
    } else {
      pos = target;
      banner.style.transform = 'translateY(' + pos.toFixed(2) + '%)';
    }
  }

  function spring(to) {
    target = to;
    if (reduce) { pos = to; vel = 0; banner.style.transform = 'translateY(' + pos + '%)'; return; }
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(function (ts) { tick(ts, ts - 16); });
  }

  function showConflict() {
    root.classList.add('scb--conflict');
    spring(0);
    timer = setTimeout(resolve, AUTO_RESOLVE_MS);
  }

  function resolve() {
    root.classList.remove('scb--conflict');
    spring(-60);
    timer = setTimeout(showConflict, APPEAR_MS);
  }

  timer = setTimeout(showConflict, APPEAR_MS);

  function choose() {
    root.classList.remove('is-demo');
    if (timer) clearTimeout(timer);
    resolve();
  }
  keepBtn.addEventListener('click', choose);
  reloadBtn.addEventListener('click', choose);
})();
</script>
</main>
</body>
</html>
