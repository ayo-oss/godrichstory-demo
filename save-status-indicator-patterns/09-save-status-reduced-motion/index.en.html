<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reduced-motion static save notice — with reduced motion, only the label's text value changes instead of animating — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="srm is-demo" id="srm">
  <div class="srm__panel">
    <span class="srm__tag">Normal motion</span>
    <span class="srm__badge" id="srmBadgeA"><span class="srm__dot"></span><span id="srmLabelA">Saving</span></span>
  </div>
  <div class="srm__panel">
    <span class="srm__tag">Reduced motion</span>
    <span class="srm__badge srm__badge--static" id="srmBadgeB"><span class="srm__dot"></span><span id="srmLabelB">Saving</span></span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('srm');
  var badgeA = document.getElementById('srmBadgeA');
  var labelA = document.getElementById('srmLabelA');
  var badgeB = document.getElementById('srmBadgeB');
  var labelB = document.getElementById('srmLabelB');

  // 상수: Saving 유지시간 · Saved 유지시간 · 일반 판 펄스 한 주기
  var SAVING_MS = 900;
  var IDLE_MS = 700;
  var PULSE_PERIOD_MS = 500;

  var phase = 'saving';
  var phaseStart = null;

  // 계산 겹: 일반 판은 경과시간 기반 sin 진폭으로 서서히 밝기가 바뀌고, Reduced motion 판은 같은 상태 값을 트윈 없이 즉시 반영한다
  function raf(ts) {
    if (phaseStart === null) phaseStart = ts;
    var el = ts - phaseStart;
    if (phase === 'saving') {
      var t = (el % PULSE_PERIOD_MS) / PULSE_PERIOD_MS;
      badgeA.style.opacity = (0.5 + 0.5 * (0.5 + 0.5 * Math.sin(t * Math.PI * 2))).toFixed(3);
      if (el > SAVING_MS) {
        phase = 'idle'; phaseStart = ts;
        labelA.textContent = labelB.textContent = 'Saved';
        badgeA.style.opacity = '1';
        badgeA.classList.add('srm__badge--done'); badgeB.classList.add('srm__badge--done');
      }
    } else {
      if (el > IDLE_MS) {
        phase = 'saving'; phaseStart = ts;
        labelA.textContent = labelB.textContent = 'Saving';
        badgeA.classList.remove('srm__badge--done'); badgeB.classList.remove('srm__badge--done');
      }
    }
    requestAnimationFrame(raf);
  }

  root.addEventListener('click', function () {
    root.classList.remove('is-demo');
    phase = 'saving';
    phaseStart = null;
    labelA.textContent = labelB.textContent = 'Saving';
    badgeA.classList.remove('srm__badge--done'); badgeB.classList.remove('srm__badge--done');
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) { requestAnimationFrame(raf); }
  else {
    // Reduced motion 설정에서는 일반 판도 펄스 계산 없이 상태만 값으로 바뀐다
    setInterval(function () {
      phase = phase === 'saving' ? 'idle' : 'saving';
      var text = phase === 'saving' ? 'Saving' : 'Saved';
      labelA.textContent = labelB.textContent = text;
      badgeA.style.opacity = '1';
      badgeA.classList.toggle('srm__badge--done', phase === 'idle');
      badgeB.classList.toggle('srm__badge--done', phase === 'idle');
    }, SAVING_MS);
  }
})();
</script>
</main>
</body>
</html>
