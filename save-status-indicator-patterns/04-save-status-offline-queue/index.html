<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오프라인 대기 건수 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="soq is-demo" id="soq">
  <div class="soq__row">
    <span class="soq__label" id="soqLabel">오프라인</span>
    <span class="soq__count" id="soqCount">0건 대기</span>
  </div>
  <div class="soq__track"><div class="soq__fill" id="soqFill"></div></div>
  <button class="soq__btn" id="soqBtn" type="button">연결 전환</button>
</div>
<script>
(function () {
  var root = document.getElementById('soq');
  var btn = document.getElementById('soqBtn');
  var label = document.getElementById('soqLabel');
  var countEl = document.getElementById('soqCount');
  var fill = document.getElementById('soqFill');

  // 상수: 대기 칸 최대 값 · 쌓이는 간격(가속 ms) · 줄어드는 간격(가속 ms)
  var MAX_QUEUE = 6;
  var ADD_MS = 260;
  var DRAIN_MS = 150;

  var online = false;
  var count = 0;
  var timer = null;

  // 계산 겹: 막대 채움 값 = 대기 건수 ÷ 최대 건수 — scaleX 산술
  function paint() {
    countEl.textContent = count + '건 대기';
    fill.style.transform = 'scaleX(' + (count / MAX_QUEUE).toFixed(3) + ')';
    label.textContent = online ? '온라인' : '오프라인';
    root.classList.toggle('soq--online', online);
  }

  function tick() {
    if (!online) {
      count = Math.min(MAX_QUEUE, count + 1);
      paint();
      if (count >= MAX_QUEUE) { online = true; paint(); timer = setTimeout(tick, DRAIN_MS); return; }
      timer = setTimeout(tick, ADD_MS);
    } else {
      count = Math.max(0, count - 1);
      paint();
      if (count <= 0) { timer = setTimeout(function () { online = false; paint(); timer = setTimeout(tick, ADD_MS); }, 500); return; }
      timer = setTimeout(tick, DRAIN_MS);
    }
  }
  timer = setTimeout(tick, ADD_MS);
  paint();

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    if (timer) clearTimeout(timer);
    online = !online;
    paint();
    timer = setTimeout(tick, online ? DRAIN_MS : ADD_MS);
  });
})();
</script>
</main>
</body>
</html>
