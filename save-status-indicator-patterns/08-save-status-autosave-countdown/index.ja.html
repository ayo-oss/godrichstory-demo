<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>次回自動保存カウントダウン — 次の保存までの残り時間の値が0に向かって減っていくリング方式 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sac is-demo" id="sac">
  <div class="sac__ringwrap">
    <svg class="sac__ring" viewBox="0 0 100 100" width="120" height="120">
      <circle class="sac__track" cx="50" cy="50" r="40"></circle>
      <circle class="sac__prog" id="sacProg" cx="50" cy="50" r="40"></circle>
    </svg>
    <div class="sac__mid">
      <span class="sac__num" id="sacNum">10</span>
      <span class="sac__unit">秒後に保存</span>
    </div>
  </div>
  <button class="sac__btn" id="sacBtn" type="button">今すぐ保存</button>
</div>
<script>
(function () {
  var root = document.getElementById('sac');
  var btn = document.getElementById('sacBtn');
  var numEl = document.getElementById('sacNum');
  var prog = document.getElementById('sacProg');

  // 상수: 다음 저장까지 초 · 링 반지름(SVG 좌표) · 데모 안 "1초"의 실제 ms(가속)
  var CYCLE_SEC = 10;
  var R = 40;
  var DEMO_TICK_MS = 130;
  var CIRC = 2 * Math.PI * R;
  prog.style.strokeDasharray = CIRC.toFixed(2);

  var remaining = CYCLE_SEC;
  var timerId = null;

  // 계산 겹: 링 오프셋 = 둘레 × (1 − 남은초/전체초) — stroke-dashoffset 산술
  function paint() {
    numEl.textContent = String(remaining);
    var offset = CIRC * (1 - remaining / CYCLE_SEC);
    prog.style.strokeDashoffset = offset.toFixed(2);
    root.classList.toggle('sac--saving', remaining <= 0);
  }

  function start() {
    remaining = CYCLE_SEC;
    root.classList.remove('sac--saving');
    paint();
    if (timerId) clearInterval(timerId);
    timerId = setInterval(function () {
      remaining -= 1;
      if (remaining <= 0) {
        remaining = 0;
        paint();
        clearInterval(timerId);
        timerId = setTimeout(start, 500);
        return;
      }
      paint();
    }, DEMO_TICK_MS);
  }
  start();

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    if (timerId) { clearInterval(timerId); clearTimeout(timerId); }
    remaining = 0;
    paint();
    timerId = setTimeout(start, 500);
  });
})();
</script>
</main>
</body>
</html>
