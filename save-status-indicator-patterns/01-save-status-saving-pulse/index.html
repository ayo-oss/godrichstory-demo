<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>저장 중 문구 펄스 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ssp is-demo" id="ssp">
  <div class="ssp__card">
    <span class="ssp__dot" id="sspDot"></span>
    <span class="ssp__label" id="sspLabel">저장 중</span>
    <span class="ssp__dots" aria-hidden="true">
      <span class="ssp__d" id="sspD0"></span><span class="ssp__d" id="sspD1"></span><span class="ssp__d" id="sspD2"></span>
    </span>
  </div>
  <button class="ssp__btn" id="sspBtn" type="button">지금 저장</button>
</div>
<script>
(function () {
  var root = document.getElementById('ssp');
  var btn = document.getElementById('sspBtn');
  var label = document.getElementById('sspLabel');
  var dot = document.getElementById('sspDot');
  var dots = [document.getElementById('sspD0'), document.getElementById('sspD1'), document.getElementById('sspD2')];

  // 상수: 펄스 한 주기 · 점 세 개의 위상 차 · 저장 중 유지시간 · 저장됨 유지시간
  var PULSE_PERIOD_MS = 900;
  var DOT_STAGGER_MS = 160;
  var SAVING_MS = 2400;
  var IDLE_MS = 1000;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var phase = 'saving';
  var phaseStart = null;

  // 계산 겹: 문구 밝기 값 = 경과시간을 주기로 나눈 위상의 sin 진폭, 점마다 위상을 어긋내 순차로 밝아진다
  function raf(ts) {
    if (phaseStart === null) phaseStart = ts;
    var el = ts - phaseStart;
    if (phase === 'saving') {
      if (reduce) {
        label.style.opacity = '1';
        dots.forEach(function (d) { d.style.opacity = '.6'; });
      } else {
        var t = (el % PULSE_PERIOD_MS) / PULSE_PERIOD_MS;
        var op = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * Math.PI * 2));
        label.style.opacity = op.toFixed(3);
        dots.forEach(function (d, i) {
          var dop = 0.2 + 0.8 * Math.abs(Math.sin((el - i * DOT_STAGGER_MS) / PULSE_PERIOD_MS * Math.PI));
          d.style.opacity = dop.toFixed(3);
        });
      }
      if (el > SAVING_MS) {
        phase = 'idle';
        phaseStart = ts;
        label.textContent = '저장됨';
        label.style.opacity = '1';
        dots.forEach(function (d) { d.style.opacity = '0'; });
        root.classList.add('ssp--done');
      }
    } else {
      if (el > IDLE_MS) {
        phase = 'saving';
        phaseStart = ts;
        label.textContent = '저장 중';
        root.classList.remove('ssp--done');
      }
    }
    requestAnimationFrame(raf);
  }
  requestAnimationFrame(raf);

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    phase = 'saving';
    phaseStart = null;
    label.textContent = '저장 중';
    root.classList.remove('ssp--done');
  });
})();
</script>
</main>
</body>
</html>
