<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status-dot color cycle — the dot's color value changes in sequence across idle, in-progress, and done stages — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sdc is-demo" id="sdc">
  <div class="sdc__dots">
    <span class="sdc__dot" id="sdcDot0"></span>
    <span class="sdc__dot" id="sdcDot1"></span>
    <span class="sdc__dot" id="sdcDot2"></span>
  </div>
  <span class="sdc__label" id="sdcLabel">Idle</span>
  <button class="sdc__btn" id="sdcBtn" type="button">Next stage</button>
</div>
<script>
(function () {
  var root = document.getElementById('sdc');
  var btn = document.getElementById('sdcBtn');
  var dots = [document.getElementById('sdcDot0'), document.getElementById('sdcDot1'), document.getElementById('sdcDot2')];
  var label = document.getElementById('sdcLabel');

  // 상수: 단계 수(Idle·In progress·Done) · 단계가 넘어가는 간격(가속 ms)
  var STAGE_COUNT = 3;
  var STEP_MS = 480;
  var NAMES = ['Idle', 'In progress', 'Done'];
  var CLASSES = ['sdc__dot--idle', 'sdc__dot--busy', 'sdc__dot--done'];

  var stageIndex = 0;
  var timer = null;

  // 계산 겹: i번째 점의 표시 단계 = (현재 단계 − i + 단계수) mod 단계수 — 값이 점마다 어긋나며 뒤따라간다
  function paint() {
    label.textContent = NAMES[stageIndex];
    dots.forEach(function (d, i) {
      var s = ((stageIndex - i) % STAGE_COUNT + STAGE_COUNT) % STAGE_COUNT;
      d.className = 'sdc__dot ' + CLASSES[s];
    });
  }
  paint();

  function step() {
    stageIndex = (stageIndex + 1) % STAGE_COUNT;
    paint();
    timer = setTimeout(step, STEP_MS);
  }
  timer = setTimeout(step, STEP_MS);

  btn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    if (timer) clearTimeout(timer);
    stageIndex = (stageIndex + 1) % STAGE_COUNT;
    paint();
    timer = setTimeout(step, STEP_MS);
  });
})();
</script>
</main>
</body>
</html>
