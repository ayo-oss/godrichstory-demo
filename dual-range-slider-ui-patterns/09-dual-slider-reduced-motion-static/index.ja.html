<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>モーション削減と通常モーションを並べて比較する範囲スライダー — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cmp">
  <div class="cmp__panel">
    <p class="cmp__label">通常モーション</p>
    <div class="ds is-demo" id="dsA">
      <div class="ds__track" id="trackA">
        <div class="ds__fill" id="fillA"></div>
        <button type="button" class="ds__thumb ds__thumb--lo" id="thumbLoA" role="slider"
          aria-label="最小値" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25" aria-valuetext="25" tabindex="0"></button>
        <button type="button" class="ds__thumb ds__thumb--hi" id="thumbHiA" role="slider"
          aria-label="最大値" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" aria-valuetext="70" tabindex="0"></button>
      </div>
      <p class="ds__readout"><span id="loOutA">25</span> – <span id="hiOutA">70</span></p>
    </div>
  </div>
  <div class="cmp__panel">
    <p class="cmp__label">縮小モーションのプレビュー</p>
    <div class="ds ds--mirror" id="dsB" aria-hidden="true">
      <div class="ds__track">
        <div class="ds__fill" id="fillB"></div>
        <span class="ds__thumb ds__thumb--lo" id="thumbLoB"></span>
        <span class="ds__thumb ds__thumb--hi" id="thumbHiB"></span>
      </div>
      <p class="ds__readout"><span id="loOutB">25</span> – <span id="hiOutB">70</span></p>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var MIN = 0, MAX = 100;
  var root = document.getElementById('dsA');
  var track = document.getElementById('trackA');
  var fillA = document.getElementById('fillA');
  var fillB = document.getElementById('fillB');
  var lo = document.getElementById('thumbLoA');
  var hi = document.getElementById('thumbHiA');
  var loB = document.getElementById('thumbLoB');
  var hiB = document.getElementById('thumbHiB');
  var loOutA = document.getElementById('loOutA'); var hiOutA = document.getElementById('hiOutA');
  var loOutB = document.getElementById('loOutB'); var hiOutB = document.getElementById('hiOutB');
  var v = { lo: 25, hi: 70 };

  // 계산 겹: 같은 상태값 하나를 두 패널에 동시에 그리되, 오른쪽 미리보기는 transition 을 원천적으로 갖지 않아
  // "모션 줄임" 사용자가 보는 즉시-이동 결과를 항상 함께 보여준다 (실제 OS 설정과 무관한 비교용).
  function paint() {
    lo.style.left = v.lo + '%'; hi.style.left = v.hi + '%';
    fillA.style.left = v.lo + '%'; fillA.style.width = (v.hi - v.lo) + '%';
    loB.style.left = v.lo + '%'; hiB.style.left = v.hi + '%';
    fillB.style.left = v.lo + '%'; fillB.style.width = (v.hi - v.lo) + '%';
    lo.setAttribute('aria-valuenow', String(v.lo)); hi.setAttribute('aria-valuenow', String(v.hi));
    lo.setAttribute('aria-valuetext', String(v.lo)); hi.setAttribute('aria-valuetext', String(v.hi));
    loOutA.textContent = String(v.lo); hiOutA.textContent = String(v.hi);
    loOutB.textContent = String(v.lo); hiOutB.textContent = String(v.hi);
  }
  function setLo(n) { v.lo = Math.max(MIN, Math.min(n, v.hi)); paint(); }
  function setHi(n) { v.hi = Math.min(MAX, Math.max(n, v.lo)); paint(); }
  function pctFromX(x) {
    var r = track.getBoundingClientRect();
    return Math.round(Math.max(0, Math.min(100, ((x - r.left) / r.width) * 100)));
  }
  function human() { root.classList.remove('is-demo'); clearInterval(timer); }
  function drag(thumb, setter, isLo) {
    thumb.addEventListener('pointerdown', function (e) {
      human(); thumb.setPointerCapture(e.pointerId);
      function move(ev) { setter(pctFromX(ev.clientX)); }
      function up() { thumb.removeEventListener('pointermove', move); thumb.removeEventListener('pointerup', up); }
      thumb.addEventListener('pointermove', move); thumb.addEventListener('pointerup', up);
    });
    thumb.addEventListener('keydown', function (e) {
      var step = { ArrowRight: 1, ArrowLeft: -1, ArrowUp: 1, ArrowDown: -1 }[e.key];
      if (step !== undefined) { e.preventDefault(); human(); setter((isLo ? v.lo : v.hi) + step); }
      else if (e.key === 'Home') { e.preventDefault(); human(); setter(isLo ? MIN : v.lo); }
      else if (e.key === 'End') { e.preventDefault(); human(); setter(isLo ? v.hi : MAX); }
    });
  }
  drag(lo, setLo, true); drag(hi, setHi, false);

  var presets = [[10, 40], [55, 95], [20, 30], [5, 85], [45, 60]];
  var pi = 0;
  function tick() {
    var p = presets[pi % presets.length]; pi++;
    v.lo = p[0]; v.hi = p[1]; paint();
  }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timer = reduce ? null : setInterval(tick, 480);
  paint();
}());
</script>
</body>
</html>
