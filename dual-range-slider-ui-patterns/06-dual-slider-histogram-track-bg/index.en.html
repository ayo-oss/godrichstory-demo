<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Range Slider That Picks a Span Over a Histogram Background — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ds is-demo" id="ds">
  <div class="ds__hist" id="hist" aria-hidden="true"></div>
  <div class="ds__track" id="track">
    <div class="ds__fill" id="fill"></div>
    <button type="button" class="ds__thumb ds__thumb--lo" id="thumbLo" role="slider"
      aria-label="Minimum value" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30" aria-valuetext="30" tabindex="0"></button>
    <button type="button" class="ds__thumb ds__thumb--hi" id="thumbHi" role="slider"
      aria-label="Maximum value" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72" aria-valuetext="72" tabindex="0"></button>
  </div>
  <p class="ds__readout"><span id="loOut">30</span> – <span id="hiOut">72</span></p>
  <p class="ds__caption">Highlights only the chosen span over the bar distribution</p>
</div>
</main>
<script>
(function () {
  var MIN = 0, MAX = 100;
  // 결정론적 분포 — Math.random 없이 고정 배열로 막대 높이를 정한다 (%, 0~100)
  var HEIGHTS = [22, 40, 65, 38, 52, 70, 45, 60, 33, 48, 80, 55, 42, 66, 30, 58, 44, 72, 50, 36, 62, 48, 54, 40];
  var root = document.getElementById('ds');
  var hist = document.getElementById('hist');
  var track = document.getElementById('track');
  var fill = document.getElementById('fill');
  var lo = document.getElementById('thumbLo');
  var hi = document.getElementById('thumbHi');
  var loOut = document.getElementById('loOut');
  var hiOut = document.getElementById('hiOut');
  var v = { lo: 30, hi: 72 };
  var bars = [];

  HEIGHTS.forEach(function (h, i) {
    var bar = document.createElement('div');
    bar.className = 'ds__bar';
    bar.style.left = (i / HEIGHTS.length * 100) + '%';
    bar.style.width = (100 / HEIGHTS.length * 0.7) + '%';
    bar.style.height = h + '%';
    hist.appendChild(bar);
    bars.push({ el: bar, center: (i + 0.5) / HEIGHTS.length * 100 });
  });

  // 계산 겹: 막대의 실제 중심 위치(%)가 [lo, hi] 구간 안에 들어오는지로 강조 여부를 결정한다.
  function paintBars() {
    bars.forEach(function (b) {
      b.el.classList.toggle('is-in', b.center >= v.lo && b.center <= v.hi);
    });
  }
  function paint() {
    lo.style.left = v.lo + '%'; hi.style.left = v.hi + '%';
    fill.style.left = v.lo + '%'; fill.style.width = (v.hi - v.lo) + '%';
    lo.setAttribute('aria-valuenow', String(v.lo)); hi.setAttribute('aria-valuenow', String(v.hi));
    lo.setAttribute('aria-valuetext', String(v.lo)); hi.setAttribute('aria-valuetext', String(v.hi));
    loOut.textContent = String(v.lo); hiOut.textContent = String(v.hi);
    paintBars();
  }
  function setLo(n) { v.lo = Math.max(MIN, Math.min(n, v.hi)); paint(); }
  function setHi(n) { v.hi = Math.min(MAX, Math.max(n, v.lo)); paint(); }
  function pctFromX(x) {
    var r = track.getBoundingClientRect();
    return Math.round(Math.max(0, Math.min(100, ((x - r.left) / r.width) * 100)));
  }
  function human() { root.classList.remove('is-demo'); clearInterval(timer); }
  function drag(thumb, setter, isLo) {
    thumb.addEventListener('pointerdown', function (e) {
      human(); thumb.setPointerCapture(e.pointerId);
      function move(ev) { setter(pctFromX(ev.clientX)); }
      function up() { thumb.removeEventListener('pointermove', move); thumb.removeEventListener('pointerup', up); }
      thumb.addEventListener('pointermove', move); thumb.addEventListener('pointerup', up);
    });
    thumb.addEventListener('keydown', function (e) {
      var step = { ArrowRight: 1, ArrowLeft: -1, ArrowUp: 1, ArrowDown: -1 }[e.key];
      if (step !== undefined) { e.preventDefault(); human(); setter((isLo ? v.lo : v.hi) + step); }
      else if (e.key === 'Home') { e.preventDefault(); human(); setter(isLo ? MIN : v.lo); }
      else if (e.key === 'End') { e.preventDefault(); human(); setter(isLo ? v.hi : MAX); }
    });
  }
  drag(lo, setLo, true); drag(hi, setHi, false);

  var presets = [[10, 35], [55, 90], [0, 100], [42, 48], [20, 65]];
  var pi = 0;
  function tick() {
    var p = presets[pi % presets.length]; pi++;
    v.lo = p[0]; v.hi = p[1]; paint();
  }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timer = reduce ? null : setInterval(tick, 480);
  paint();
}());
</script>
</body>
</html>
