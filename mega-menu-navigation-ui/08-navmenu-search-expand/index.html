<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search expand — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="frame is-demo" id="sch" aria-label="자료 창고">
    <div class="page">
      <header class="bar">
        <p class="brand">자료 창고</p>
        <div class="search" id="sch-box">
          <button class="glass" id="sch-btn" type="button" aria-label="검색 열기" aria-controls="sch-box">
            <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M192 112a80 80 0 1 1-80-80a80 80 0 0 1 80 80" opacity=".2"/><path d="m229.66 218.34l-50.06-50.06a88.21 88.21 0 1 0-11.32 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></g></svg>
          </button>
          <input class="input" id="sch-in" type="text" placeholder="무엇을 찾으세요" autocomplete="off">
        </div>
      </header>
      <div class="body">
        <p class="skeleton" aria-hidden="true"></p>
        <p class="skeleton skeleton--short" aria-hidden="true"></p>
      </div>
    </div>
    <ul class="skips" id="sch-skips" aria-hidden="true">
      <li><button type="button"><span>템플릿 모음</span><svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M192 64v104L88 64Z" opacity=".2"/><path d="M192 56H88a8 8 0 0 0-5.66 13.66L128.69 116l-70.35 70.34a8 8 0 0 0 11.32 11.32L140 127.31l46.34 46.35A8 8 0 0 0 200 168V64a8 8 0 0 0-8-8m-8 92.69l-38.34-38.34L107.31 72H184Z"/></g></svg></button></li>
      <li><button type="button"><span>아이콘 세트</span><svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M192 64v104L88 64Z" opacity=".2"/><path d="M192 56H88a8 8 0 0 0-5.66 13.66L128.69 116l-70.35 70.34a8 8 0 0 0 11.32 11.32L140 127.31l46.34 46.35A8 8 0 0 0 200 168V64a8 8 0 0 0-8-8m-8 92.69l-38.34-38.34L107.31 72H184Z"/></g></svg></button></li>
      <li><button type="button"><span>시작 가이드</span><svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M192 64v104L88 64Z" opacity=".2"/><path d="M192 56H88a8 8 0 0 0-5.66 13.66L128.69 116l-70.35 70.34a8 8 0 0 0 11.32 11.32L140 127.31l46.34 46.35A8 8 0 0 0 200 168V64a8 8 0 0 0-8-8m-8 92.69l-38.34-38.34L107.31 72H184Z"/></g></svg></button></li>
    </ul>
  </section>
</main>
<script>
// 실제 동작: 버튼으로 펼치고 input 에 치면 목록이 includes 필터로 걸러진다. Escape 로 닫는다.
var root = document.getElementById('sch');
var btn = document.getElementById('sch-btn');
var input = document.getElementById('sch-in');
var skips = document.getElementById('sch-skips');
var items = Array.prototype.slice.call(skips.querySelectorAll('button'));
btn.setAttribute('aria-haspopup', 'true');
btn.setAttribute('aria-expanded', 'false');
input.tabIndex = -1;                                  // 닫힌 동안 input 은 탭 순서에서 빠진다
function hits() {
  var q = input.value.trim();
  if (q === '') return [];
  return items.filter(function (b) { return b.textContent.includes(q); });
}
function render() {
  var hit = hits();
  root.classList.toggle('is-listing', hit.length > 0);
  skips.setAttribute('aria-hidden', hit.length ? 'false' : 'true');
  items.forEach(function (b) { b.parentElement.hidden = hit.indexOf(b) < 0; });
}
function setOpen(on) {
  root.classList.remove('is-demo');                   // 첫 조작에서 격자 루프를 끈다
  root.classList.toggle('is-open', on);
  btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  input.tabIndex = on ? 0 : -1;
  if (on) { input.focus({ preventScroll: true }); render(); return; }
  root.classList.remove('is-listing');
  skips.setAttribute('aria-hidden', 'true');
  btn.focus({ preventScroll: true });
}
btn.addEventListener('click', function () { setOpen(!root.classList.contains('is-open')); });
input.addEventListener('input', function () { root.classList.remove('is-demo'); render(); });
items.forEach(function (b) { b.addEventListener('click', function () { setOpen(false); }); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && root.classList.contains('is-open')) setOpen(false);
});
</script>
</body>
</html>
