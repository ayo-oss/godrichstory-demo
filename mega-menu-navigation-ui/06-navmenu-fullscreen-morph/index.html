<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fullscreen menu morph from burger — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="fm is-demo">
    <div class="fm__page" aria-hidden="true">
      <i class="fm__block fm__block--a"></i>
      <i class="fm__block fm__block--b"></i>
      <i class="fm__rule"></i>
      <i class="fm__rule fm__rule--s"></i>
      <i class="fm__rule fm__rule--m"></i>
    </div>
    <header class="fm__bar">
      <span class="fm__brand">공방</span>
      <button class="fm__btn" type="button" aria-controls="fm-menu">
        <span class="fm__burger" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
    </header>
    <div class="fm__overlay" id="fm-menu" role="dialog" aria-modal="true" aria-label="주 메뉴">
      <a class="fm__link" style="--i: 0" href="#">작업
        <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M192 64v104L88 64Z" opacity=".2"/><path d="M192 56H88a8 8 0 0 0-5.66 13.66L128.69 116l-70.35 70.34a8 8 0 0 0 11.32 11.32L140 127.31l46.34 46.35A8 8 0 0 0 200 168V64a8 8 0 0 0-8-8m-8 92.69l-38.34-38.34L107.31 72H184Z"/></g></svg>
      </a>
      <a class="fm__link" style="--i: 1" href="#">소개
        <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M192 64v104L88 64Z" opacity=".2"/><path d="M192 56H88a8 8 0 0 0-5.66 13.66L128.69 116l-70.35 70.34a8 8 0 0 0 11.32 11.32L140 127.31l46.34 46.35A8 8 0 0 0 200 168V64a8 8 0 0 0-8-8m-8 92.69l-38.34-38.34L107.31 72H184Z"/></g></svg>
      </a>
      <a class="fm__link" style="--i: 2" href="#">기록
        <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M192 64v104L88 64Z" opacity=".2"/><path d="M192 56H88a8 8 0 0 0-5.66 13.66L128.69 116l-70.35 70.34a8 8 0 0 0 11.32 11.32L140 127.31l46.34 46.35A8 8 0 0 0 200 168V64a8 8 0 0 0-8-8m-8 92.69l-38.34-38.34L107.31 72H184Z"/></g></svg>
      </a>
      <a class="fm__link" style="--i: 3" href="#">문의
        <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M192 64v104L88 64Z" opacity=".2"/><path d="M192 56H88a8 8 0 0 0-5.66 13.66L128.69 116l-70.35 70.34a8 8 0 0 0 11.32 11.32L140 127.31l46.34 46.35A8 8 0 0 0 200 168V64a8 8 0 0 0-8-8m-8 92.69l-38.34-38.34L107.31 72H184Z"/></g></svg>
      </a>
    </div>
  </div>
</main>
<script>
// 실제 동작: 버튼 하나가 열기/닫기를 겸한다 — 햄버거 막대가 X 로 모프한다.
var fm = document.querySelector('.fm');
var btn = fm.querySelector('.fm__btn');
var ov = fm.querySelector('.fm__overlay');
var links = Array.prototype.slice.call(ov.querySelectorAll('.fm__link'));
btn.setAttribute('aria-haspopup', 'true');
btn.setAttribute('aria-expanded', 'false');
ov.setAttribute('inert', '');
function stopDemo() { fm.classList.remove('is-demo'); }  // 사람이 만졌으니 자동 루프를 끈다
fm.addEventListener('pointerdown', stopDemo);
function open() {
  fm.classList.add('is-open');
  btn.setAttribute('aria-expanded', 'true');
  ov.removeAttribute('inert');
  btn.focus({ preventScroll: true });   // 같은 버튼이 X 닫기가 된다 — 초점 유지
}
function close() {
  fm.classList.remove('is-open');
  btn.setAttribute('aria-expanded', 'false');
  ov.setAttribute('inert', '');
  btn.focus({ preventScroll: true });
}
btn.addEventListener('click', function () {
  fm.classList.contains('is-open') ? close() : open();
});
// Tab 이 오버레이 밖으로 나가면 다시 안으로 돌린다(포커스 트랩)
ov.addEventListener('keydown', function (e) {
  if (e.key !== 'Tab' || links.length === 0) return;
  var first = links[0], last = links[links.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault(); last.focus({ preventScroll: true });
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault(); first.focus({ preventScroll: true });
  }
});
// Escape 닫기 — 초점은 버튼으로
fm.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && fm.classList.contains('is-open')) close();
});
</script>
</body>
</html>
