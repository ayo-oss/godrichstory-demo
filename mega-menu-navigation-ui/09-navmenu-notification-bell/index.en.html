<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification bell — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="frame is-demo" id="nbf" aria-label="Club">
    <div class="page">
      <header class="bar">
        <p class="brand">Club</p>
        <button class="bell" id="nbf-bell" type="button" aria-label="Alerts" aria-controls="nbf-panel">
          <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M208 192H48a8 8 0 0 1-6.88-12C47.71 168.6 56 139.81 56 104a72 72 0 0 1 144 0c0 35.82 8.3 64.6 14.9 76a8 8 0 0 1-6.9 12" opacity=".2"/><path d="M221.8 175.94c-5.55-9.56-13.8-36.61-13.8-71.94a80 80 0 1 0-160 0c0 35.34-8.26 62.38-13.81 71.94A16 16 0 0 0 48 200h40.81a40 40 0 0 0 78.38 0H208a16 16 0 0 0 13.8-24.06M128 216a24 24 0 0 1-22.62-16h45.24A24 24 0 0 1 128 216m-80-32c7.7-13.24 16-43.92 16-80a64 64 0 1 1 128 0c0 36.05 8.28 66.73 16 80Z"/></g></svg>
          <span class="badge" id="nbf-badge" data-n="3" aria-hidden="true"><span class="n3">3</span><span class="n2">2</span><span class="n1">1</span></span>
        </button>
      </header>
      <div class="body">
        <p class="skeleton" aria-hidden="true"></p>
        <p class="skeleton skeleton--short" aria-hidden="true"></p>
      </div>
    </div>
    <aside class="panel" id="nbf-panel" aria-label="Alerts" aria-hidden="true">
      <header class="phead">
        <p class="ptitle">Alerts</p>
        <button class="allbtn" id="nbf-all" type="button">
          <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M232 56v144a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16" opacity=".2"/><path d="m205.66 85.66l-96 96a8 8 0 0 1-11.32 0l-40-40a8 8 0 0 1 11.32-11.32L104 164.69l90.34-90.35a8 8 0 0 1 11.32 11.32"/></g></svg>
          <span>Mark all as read</span>
        </button>
      </header>
      <ul class="rows">
        <li><button class="row" type="button"><span class="dot" aria-hidden="true"></span><span class="rt">Your order started shipping</span><span class="rtime">just now</span></button></li>
        <li><button class="row" type="button"><span class="dot" aria-hidden="true"></span><span class="rt">2 coupons expiring soon</span><span class="rtime">2 hours ago</span></button></li>
        <li><button class="row" type="button"><span class="dot" aria-hidden="true"></span><span class="rt">New comment posted</span><span class="rtime">yesterday</span></button></li>
      </ul>
    </aside>
    <p class="sr" id="nbf-live" aria-live="polite" data-fmt="{n} unread notifications">3 unread notifications</p>
  </section>
</main>
<script>
// 실제 동작: 줄을 누르면 그 줄만 읽음이 되고 배지 숫자가 줄어든다. 화면 밖 aria-live 영역이 수를 갱신한다.
var root = document.getElementById('nbf');
var bell = document.getElementById('nbf-bell');
var panel = document.getElementById('nbf-panel');
var live = document.getElementById('nbf-live');
var badge = document.getElementById('nbf-badge');
var allBtn = document.getElementById('nbf-all');
var rows = Array.prototype.slice.call(root.querySelectorAll('.row'));
bell.setAttribute('aria-haspopup', 'true');
bell.setAttribute('aria-expanded', 'false');
panel.inert = true;                                   // 닫힌 동안 패널 안 버튼은 탭 순서에서 빠진다
function unread() {
  return rows.filter(function (r) { return !r.classList.contains('is-read'); });
}
function sync() {
  root.classList.remove('is-demo');                   // 첫 조작에서 격자 루프를 끈다
  var n = unread().length;
  root.classList.toggle('is-clear', n === 0);
  badge.setAttribute('data-n', String(n));
  live.textContent = live.dataset.fmt.replace('{n}', String(n));  // 문구는 data-fmt 템플릿에서 — JS 에 하드코딩하면 언어팩을 못 탄다
}
function setOpen(on) {
  root.classList.remove('is-demo');
  root.classList.toggle('is-open', on);
  bell.setAttribute('aria-expanded', on ? 'true' : 'false');
  panel.setAttribute('aria-hidden', on ? 'false' : 'true');
  panel.inert = !on;
  var hit = unread();
  (on ? (hit.length ? hit[0] : rows[0]) : bell).focus({ preventScroll: true });
}
bell.addEventListener('click', function () { setOpen(!root.classList.contains('is-open')); });
allBtn.addEventListener('click', function () {
  rows.forEach(function (r) { r.classList.add('is-read'); });
  sync();
});
rows.forEach(function (r) {
  r.addEventListener('click', function () { r.classList.add('is-read'); sync(); });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && root.classList.contains('is-open')) setOpen(false);
});
</script>
</body>
</html>
