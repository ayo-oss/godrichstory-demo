<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side drawer — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="frame is-demo" id="sdr" aria-label="서랍">
    <div class="page" id="sdr-page">
      <header class="bar">
        <p class="brand">서랍</p>
        <button class="burger" id="sdr-open" type="button" aria-label="메뉴 열기" aria-controls="sdr-drawer">
          <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M216 64v128H40V64Z" opacity=".2"/><path d="M224 128a8 8 0 0 1-8 8H40a8 8 0 0 1 0-16h176a8 8 0 0 1 8 8M40 72h176a8 8 0 0 0 0-16H40a8 8 0 0 0 0 16m176 112H40a8 8 0 0 0 0 16h176a8 8 0 0 0 0-16"/></g></svg>
        </button>
      </header>
      <div class="body">
        <p class="skeleton" aria-hidden="true"></p>
        <ul class="cards">
          <li class="card"><span class="sw sw--a" aria-hidden="true"></span><span class="nm">모자 12,000원</span></li>
          <li class="card"><span class="sw sw--b" aria-hidden="true"></span><span class="nm">양말 세트 8,000원</span></li>
          <li class="card"><span class="sw sw--c" aria-hidden="true"></span><span class="nm">머그컵 6,500원</span></li>
        </ul>
      </div>
    </div>
    <div class="veil" id="sdr-veil"></div>
    <aside class="drawer" id="sdr-drawer" aria-label="내 서랍" aria-hidden="true">
      <header class="head">
        <p class="title">내 서랍</p>
        <button class="xbtn" id="sdr-close" type="button" aria-label="닫기">
          <svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="M216 56v144a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h144a16 16 0 0 1 16 16" opacity=".2"/><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg>
        </button>
      </header>
      <ul class="menu">
        <li><button type="button"><span>주문 내역</span><svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></button></li>
        <li><button type="button"><span>찜해 둔 상품</span><svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></button></li>
        <li><button type="button"><span>배송지</span><svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></button></li>
        <li><button type="button"><span>쿠폰</span><svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></button></li>
        <li><button type="button"><span>설정</span><svg viewBox="0 0 256 256" width="18" height="18" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg></button></li>
      </ul>
    </aside>
  </section>
</main>
<script>
// 실제 동작: 햄버거를 누르면 본문이 inert 로 잠기고 드로어가 열린다. 닫기는 x · Escape · 오버레이 클릭.
var root = document.getElementById('sdr');
var page = document.getElementById('sdr-page');
var drawer = document.getElementById('sdr-drawer');
var openBtn = document.getElementById('sdr-open');
var closeBtn = document.getElementById('sdr-close');
var veil = document.getElementById('sdr-veil');
var stops = [closeBtn].concat(Array.prototype.slice.call(drawer.querySelectorAll('.menu button')));
openBtn.setAttribute('aria-haspopup', 'true');
openBtn.setAttribute('aria-expanded', 'false');
drawer.inert = true;                                  // 닫힌 동안 드로어 안 버튼은 탭 순서에서 빠진다
drawer.setAttribute('aria-hidden', 'true');
function setOpen(on) {
  root.classList.remove('is-demo');                   // 첫 조작에서 격자 루프를 끈다
  root.classList.toggle('is-open', on);
  page.inert = on;                                    // 열린 동안 본문은 포커스를 잃는다
  page.setAttribute('aria-hidden', on ? 'true' : 'false');
  drawer.inert = !on;
  drawer.setAttribute('aria-hidden', on ? 'false' : 'true');
  openBtn.setAttribute('aria-expanded', on ? 'true' : 'false');
  (on ? closeBtn : openBtn).focus({ preventScroll: true });
}
openBtn.addEventListener('click', function () { setOpen(true); });
closeBtn.addEventListener('click', function () { setOpen(false); });
veil.addEventListener('click', function () { setOpen(false); });
drawer.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { setOpen(false); return; }
  if (e.key !== 'Tab') return;
  e.preventDefault();                                 // 드로어 안에서만 Tab 이 돈다 — 짧은 포커스 트랩
  var i = stops.indexOf(document.activeElement);
  var d = e.shiftKey ? -1 : 1;
  stops[(i + d + stops.length) % stops.length].focus({ preventScroll: true });
});
</script>
</body>
</html>
