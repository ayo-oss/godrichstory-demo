<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fullwide hover mega panel — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="fwp is-demo" id="root">
    <header class="fwp__bar">
      <span class="fwp__brand">ギフト箱</span>
      <nav class="fwp__nav" aria-label="メインメニュー">
        <a class="fwp__link" href="#">すべて</a>
        <button class="fwp__trigger" id="trigger" type="button" aria-controls="panel">ギフト
          <svg class="fwp__caret" viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg>
        </button>
        <a class="fwp__link" href="#">家具</a>
        <a class="fwp__link" href="#">ヘルプ</a>
      </nav>
    </header>
    <div class="fwp__hints" aria-hidden="true"><span></span><span></span></div>
    <div class="fwp__panel" id="panel">
      <div class="fwp__grid">
        <section class="fwp__col">
          <h3>季節のギフト</h3>
          <ul><li>新年セット</li><li>夏の保冷</li><li>冬のブランケット</li></ul>
        </section>
        <section class="fwp__col">
          <h3>価格帯</h3>
          <ul><li>2万円台</li><li>5万円台</li><li>10万円以上</li></ul>
        </section>
        <section class="fwp__col">
          <h3>贈り相手</h3>
          <ul><li>家族</li><li>職場の同僚</li><li>友だち</li></ul>
        </section>
        <aside class="fwp__promo">
          <span class="fwp__promo-label">今週のおすすめ</span>
          <strong class="fwp__promo-title">夏の保冷セット</strong>
          <a class="fwp__promo-link" href="#">詳しく見る
            <svg viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="M192 64v104L88 64Z" opacity=".2"/><path d="M192 56H88a8 8 0 0 0-5.66 13.66L128.69 116l-70.35 70.34a8 8 0 0 0 11.32 11.32L140 127.31l46.34 46.35A8 8 0 0 0 200 168V64a8 8 0 0 0-8-8m-8 92.69l-38.34-38.34L107.31 72H184Z"/></g></svg>
          </a>
        </aside>
      </div>
    </div>
  </div>
</main>
<script>
var root = document.getElementById('root');
var trigger = document.getElementById('trigger');

trigger.setAttribute('aria-haspopup', 'true');
trigger.setAttribute('aria-expanded', 'false');

function stopDemo() { root.classList.remove('is-demo'); }
function open() { stopDemo(); root.classList.add('is-open'); trigger.setAttribute('aria-expanded', 'true'); }
function close() { stopDemo(); root.classList.remove('is-open'); trigger.setAttribute('aria-expanded', 'false'); }

trigger.addEventListener('mouseenter', open);
trigger.addEventListener('focus', open);
trigger.addEventListener('click', function () { root.classList.contains('is-open') ? close() : open(); });
root.addEventListener('mouseleave', close);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
document.addEventListener('pointerdown', stopDemo, { once: true });
document.addEventListener('keydown', stopDemo, { once: true });
</script>
</body>
</html>
