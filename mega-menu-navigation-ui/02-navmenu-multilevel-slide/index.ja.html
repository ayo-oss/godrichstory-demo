<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multilevel slide menu — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="mls is-demo" id="root">
    <button class="mls__trigger" id="trigger" type="button" aria-controls="l1">ライブラリ
      <svg class="mls__caret" viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg>
    </button>
    <nav class="mls__l1" id="l1" aria-label="ライブラリメニュー">
      <ul class="mls__u">
        <li class="mls__i"><a class="mls__a" href="#">はじめる</a></li>
        <li class="mls__i mls__i--parent mls__i--feat">
          <button class="mls__b" type="button" aria-controls="l2">機能
            <svg class="mls__sub-caret" viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg>
          </button>
          <ul class="mls__l2" id="l2">
            <li class="mls__i"><a class="mls__a" href="#">リストを作る</a></li>
            <li class="mls__i mls__i--parent mls__i--share">
              <button class="mls__b" type="button" aria-controls="l3">共有
                <svg class="mls__sub-caret" viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="m176 128l-80 80V48Z" opacity=".2"/><path d="m181.66 122.34l-80-80A8 8 0 0 0 88 48v160a8 8 0 0 0 13.66 5.66l80-80a8 8 0 0 0 0-11.32M104 188.69V67.31L164.69 128Z"/></g></svg>
              </button>
              <ul class="mls__l3" id="l3">
                <li class="mls__i"><a class="mls__a" href="#">リンクをコピー</a></li>
                <li class="mls__i"><a class="mls__a" href="#">コードを埋め込む</a></li>
              </ul>
            </li>
            <li class="mls__i"><a class="mls__a" href="#">インポート</a></li>
          </ul>
        </li>
        <li class="mls__i"><a class="mls__a" href="#">料金</a></li>
        <li class="mls__i"><a class="mls__a" href="#">お問い合わせ</a></li>
      </ul>
    </nav>
  </div>
</main>
<script>
var root = document.getElementById('root');
var trigger = document.getElementById('trigger');
var parents = Array.prototype.slice.call(root.querySelectorAll('.mls__i--parent'));

trigger.setAttribute('aria-haspopup', 'true');
trigger.setAttribute('aria-expanded', 'false');
parents.forEach(function (li) {
  var btn = li.querySelector('button');
  btn.setAttribute('aria-haspopup', 'true');
  btn.setAttribute('aria-expanded', 'false');
  ['mouseenter', 'focusin'].forEach(function (on) {
    li.addEventListener(on, function () { btn.setAttribute('aria-expanded', 'true'); });
  });
  ['mouseleave', 'focusout'].forEach(function (off) {
    li.addEventListener(off, function () { btn.setAttribute('aria-expanded', 'false'); });
  });
});

function stopDemo() { root.classList.remove('is-demo'); }
function setL1(on) {
  stopDemo();
  root.classList.toggle('is-open', on);
  trigger.setAttribute('aria-expanded', String(on));
}
function closeAll() {
  setL1(false);
  parents.forEach(function (li) { li.querySelector('button').setAttribute('aria-expanded', 'false'); });
}
trigger.addEventListener('click', function () { setL1(!root.classList.contains('is-open')); });
trigger.addEventListener('focus', function () { setL1(true); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });
document.addEventListener('pointerdown', function (e) { if (!root.contains(e.target)) closeAll(); });
document.addEventListener('pointerdown', stopDemo, { once: true });
document.addEventListener('keydown', stopDemo, { once: true });
</script>
</body>
</html>
