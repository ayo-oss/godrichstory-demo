<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky sub-navigation with section highlight — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ss is-demo">
    <div class="ss__win">
      <div class="ss__doc">
        <div class="ss__docHead">
          <h2 class="ss__title">マニュアル</h2>
        </div>
        <nav class="ss__bar">
          <a class="ss__chip" href="#sec-1">はじめに</a>
          <a class="ss__chip" href="#sec-2">設定</a>
          <a class="ss__chip" href="#sec-3">通知</a>
          <a class="ss__chip" href="#sec-4">共有</a>
          <a class="ss__chip" href="#sec-5">拡張</a>
        </nav>
        <div class="ss__track">
          <section class="ss__sec" id="sec-1">
            <h3 class="ss__h">はじめに</h3>
            <i class="ss__line"></i><i class="ss__line ss__line--a"></i><i class="ss__line ss__line--b"></i><i class="ss__line ss__line--c"></i>
          </section>
          <section class="ss__sec" id="sec-2">
            <h3 class="ss__h">設定</h3>
            <i class="ss__line"></i><i class="ss__line ss__line--a"></i><i class="ss__line ss__line--b"></i><i class="ss__line ss__line--c"></i>
          </section>
          <section class="ss__sec" id="sec-3">
            <h3 class="ss__h">通知</h3>
            <i class="ss__line"></i><i class="ss__line ss__line--a"></i><i class="ss__line ss__line--b"></i><i class="ss__line ss__line--c"></i>
          </section>
          <section class="ss__sec" id="sec-4">
            <h3 class="ss__h">共有</h3>
            <i class="ss__line"></i><i class="ss__line ss__line--a"></i><i class="ss__line ss__line--b"></i><i class="ss__line ss__line--c"></i>
          </section>
          <section class="ss__sec" id="sec-5">
            <h3 class="ss__h">拡張</h3>
            <i class="ss__line"></i><i class="ss__line ss__line--a"></i><i class="ss__line ss__line--b"></i><i class="ss__line ss__line--c"></i>
          </section>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 화면(스크롤 상자) 중앙에 가장 가까운 섹션이 현재 칩이 된다.
var ss = document.querySelector('.ss');
var win = ss.querySelector('.ss__win');
var chips = Array.prototype.slice.call(ss.querySelectorAll('.ss__chip'));
var secs = Array.prototype.slice.call(ss.querySelectorAll('.ss__sec'));
function stopDemo() { ss.classList.remove('is-demo'); }  // 사람이 만졌으니 자동 루프를 끈다
ss.addEventListener('pointerdown', stopDemo);
win.addEventListener('scroll', stopDemo, { passive: true });
function mark(el) {
  chips.forEach(function (c) {
    c.setAttribute('aria-current', c.getAttribute('href') === '#' + el.id ? 'true' : 'false');
  });
}
var io = new IntersectionObserver(function (entries) {
  var w = win.getBoundingClientRect();
  var mid = w.top + w.height / 2;
  var best = null, gap = Infinity;
  entries.forEach(function (e) {
    if (!e.isIntersecting) return;
    var r = e.boundingClientRect;
    var d = Math.abs((r.top + r.bottom) / 2 - mid);
    if (d < gap) { gap = d; best = e.target; }
  });
  if (best) mark(best);
}, { root: win, threshold: 0.5 });
secs.forEach(function (s) { io.observe(s); });
mark(secs[0]);
</script>
</body>
</html>
