<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabbed mega panel — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="tmp is-demo" id="root">
    <header class="tmp__bar">
      <span class="tmp__brand">生活雑貨</span>
      <button class="tmp__trigger" id="trigger" type="button" aria-controls="panel">ショップ
        <svg class="tmp__caret" viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg>
      </button>
    </header>
    <div class="tmp__panel" id="panel">
      <div class="tmp__tabs" role="tablist" aria-label="ショップメニュー" id="tablist">
        <button class="tmp__tab" id="tab0" type="button" role="tab" aria-controls="set0" data-i="0">人気</button>
        <button class="tmp__tab" id="tab1" type="button" role="tab" aria-controls="set1" data-i="1">新着</button>
        <button class="tmp__tab" id="tab2" type="button" role="tab" aria-controls="set2" data-i="2">セール</button>
      </div>
      <div class="tmp__body">
        <ul class="tmp__set" id="set0" role="tabpanel" aria-labelledby="tab0">
          <li class="tmp__card">
            <span class="tmp__block tmp__block--0"></span>
            <strong class="tmp__name">壁掛けシェルフ</strong>
            <span class="tmp__price">24,000円</span>
          </li>
          <li class="tmp__card">
            <span class="tmp__block tmp__block--1"></span>
            <strong class="tmp__name">ミニ鉢</strong>
            <span class="tmp__price">9,800円</span>
          </li>
          <li class="tmp__card">
            <span class="tmp__block tmp__block--2"></span>
            <strong class="tmp__name">ムードライト</strong>
            <span class="tmp__price">16,500円</span>
          </li>
        </ul>
        <ul class="tmp__set" id="set1" role="tabpanel" aria-labelledby="tab1">
          <li class="tmp__card">
            <span class="tmp__block tmp__block--0"></span>
            <strong class="tmp__name">竹のデスク</strong>
            <span class="tmp__price">89,000円</span>
          </li>
          <li class="tmp__card">
            <span class="tmp__block tmp__block--1"></span>
            <strong class="tmp__name">グラスセット</strong>
            <span class="tmp__price">19,900円</span>
          </li>
          <li class="tmp__card">
            <span class="tmp__block tmp__block--2"></span>
            <strong class="tmp__name">チェスト</strong>
            <span class="tmp__price">42,000円</span>
          </li>
        </ul>
        <ul class="tmp__set" id="set2" role="tabpanel" aria-labelledby="tab2">
          <li class="tmp__card">
            <span class="tmp__block tmp__block--0"><span class="tmp__badge">30%オフ</span></span>
            <strong class="tmp__name">ラグ</strong>
            <span class="tmp__price">27,300円</span>
          </li>
          <li class="tmp__card">
            <span class="tmp__block tmp__block--1"><span class="tmp__badge">20%オフ</span></span>
            <strong class="tmp__name">ハンガーラック</strong>
            <span class="tmp__price">31,200円</span>
          </li>
          <li class="tmp__card">
            <span class="tmp__block tmp__block--2"><span class="tmp__badge">45%オフ</span></span>
            <strong class="tmp__name">ミラー</strong>
            <span class="tmp__price">15,400円</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</main>
<script>
var root = document.getElementById('root');
var trigger = document.getElementById('trigger');
var tablist = document.getElementById('tablist');
var tabs = [0, 1, 2].map(function (i) { return document.getElementById('tab' + i); });
var sets = [0, 1, 2].map(function (i) { return document.getElementById('set' + i); });

trigger.setAttribute('aria-haspopup', 'true');
trigger.setAttribute('aria-expanded', 'false');

function stopDemo() { root.classList.remove('is-demo'); }
function open() { stopDemo(); root.classList.add('is-open'); trigger.setAttribute('aria-expanded', 'true'); }
function close() { stopDemo(); root.classList.remove('is-open'); trigger.setAttribute('aria-expanded', 'false'); }
function select(i) {
  tabs.forEach(function (t, k) {
    t.setAttribute('aria-selected', k === i ? 'true' : 'false');
    t.tabIndex = k === i ? 0 : -1;
    sets[k].hidden = k !== i;
    if (k === i && !root.classList.contains('is-demo')) {
      sets[k].classList.remove('is-pop');
      void sets[k].offsetWidth;
      sets[k].classList.add('is-pop');
    }
  });
}
trigger.addEventListener('click', function () { root.classList.contains('is-open') ? close() : open(); });
tablist.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('button') : null;
  if (t) { stopDemo(); select(tabs.indexOf(t)); }
});
tablist.addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  e.preventDefault();
  var i = tabs.indexOf(tablist.querySelector('[aria-selected="true"]'));
  var n = e.key === 'ArrowRight' ? (i + 1) % 3 : (i + 2) % 3;
  stopDemo();
  select(n);
  tabs[n].focus({ preventScroll: true });
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
document.addEventListener('pointerdown', stopDemo, { once: true });
document.addEventListener('keydown', stopDemo, { once: true });
select(0);
</script>
</body>
</html>
