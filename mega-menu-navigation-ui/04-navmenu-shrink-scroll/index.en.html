<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shrink-on-scroll news header — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ns is-demo">
    <header class="ns__head">
      <div class="ns__inner">
        <p class="ns__brand">Newsroom</p>
        <nav class="ns__nav">
          <a class="ns__link" href="#">Home</a>
          <a class="ns__link" href="#">Business</a>
          <a class="ns__link" href="#">Culture</a>
          <a class="ns__link" href="#">Sports</a>
        </nav>
      </div>
    </header>
    <div class="ns__main">
      <div class="ns__feed" tabindex="0">
        <div class="ns__sentinel" aria-hidden="true"></div>
        <div class="ns__track">
          <article class="ns__card">
            <h3 class="ns__t">Morning brief</h3>
            <i class="ns__bar"></i><i class="ns__bar ns__bar--s"></i>
          </article>
          <article class="ns__card">
            <h3 class="ns__t">Weekend weather</h3>
            <i class="ns__bar"></i><i class="ns__bar ns__bar--s"></i>
          </article>
          <article class="ns__card">
            <h3 class="ns__t">New books shelf</h3>
            <i class="ns__bar"></i><i class="ns__bar ns__bar--s"></i>
          </article>
          <article class="ns__card">
            <h3 class="ns__t">Local football</h3>
            <i class="ns__bar"></i><i class="ns__bar ns__bar--s"></i>
          </article>
          <article class="ns__card">
            <h3 class="ns__t">Metro delays</h3>
            <i class="ns__bar"></i><i class="ns__bar ns__bar--s"></i>
          </article>
          <article class="ns__card">
            <h3 class="ns__t">Night opening</h3>
            <i class="ns__bar"></i><i class="ns__bar ns__bar--s"></i>
          </article>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 스크롤 상자 맨 위의 센티넬이 화면에서 벗어나는 순간이 축소 신호다.
// 축소는 전부 transform 이라 리플로우가 0이다.
var ns = document.querySelector('.ns');
var feed = ns.querySelector('.ns__feed');
var head = ns.querySelector('.ns__head');
function stopDemo() { ns.classList.remove('is-demo'); }  // 사람이 만졌으니 자동 루프를 끈다
ns.addEventListener('pointerdown', stopDemo);
feed.addEventListener('scroll', stopDemo, { passive: true });
new IntersectionObserver(function (entries) {
  head.classList.toggle('is-compact', !entries[0].isIntersecting);
}, { root: feed }).observe(ns.querySelector('.ns__sentinel'));
</script>
</body>
</html>
