<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<title>角速度の値が螺旋で消す軌道ワイプ遷移 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="rv is-demo" tabindex="0" role="button" aria-label="リスト画面 — クリックまたはスペースキーでグリッド画面に切り替え">
    <canvas class="rv__cv" width="480" height="300"></canvas>
    <p class="rv__hint">クリックまたはスペースキーで切り替え</p>
  </div>
</main>
<script>
(function(){
  'use strict';

  function makeLcg(seed){
    let s = seed >>> 0;
    return function(){
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  const W = 480, H = 300;
  const CENTER_X = W / 2, CENTER_Y = H / 2;
  const COLS = 56, ROWS = 35;
  const SEED = 39606;
  const rnd = makeLcg(SEED);
  const PANEL_BG = '#fff7e6';
  const INK = '#17141a';
  const ACCENT = '#c89a8f';

  function clampN(v, a, b){ return v < a ? a : (v > b ? b : v); }
  function easeInOut(t){ return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  function roundRectPath(g, x, y, w, h, r){
    const rr = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + rr, y);
    g.arcTo(x + w, y, x + w, y + h, rr);
    g.arcTo(x + w, y + h, x, y + h, rr);
    g.arcTo(x, y + h, x, y, rr);
    g.arcTo(x, y, x + w, y, rr);
    g.closePath();
  }

  function paintList(g){
    g.fillStyle = PANEL_BG;
    g.fillRect(0, 0, W, H);
    const rows = 6, padX = 22, padY = 18;
    const rowH = (H - padY * 2) / rows;
    for (let i = 0; i < rows; i++){
      const y = padY + i * rowH + rowH * 0.12;
      const h = rowH * 0.76;
      g.fillStyle = ACCENT;
      roundRectPath(g, padX, y, W - padX * 2, h, 10);
      g.fill();
      g.fillStyle = INK;
      g.globalAlpha = 0.85;
      g.beginPath();
      g.arc(padX + h / 2, y + h / 2, h * 0.32, 0, Math.PI * 2);
      g.fill();
      g.globalAlpha = 1;
      const barX = padX + h + 14;
      const barW = W - padX * 2 - h - 14;
      g.fillStyle = PANEL_BG;
      g.globalAlpha = 0.9;
      roundRectPath(g, barX, y + h * 0.22, barW * 0.78, h * 0.2, 4);
      g.fill();
      roundRectPath(g, barX, y + h * 0.56, barW * 0.5, h * 0.16, 4);
      g.fill();
      g.globalAlpha = 1;
    }
  }

  function paintGrid(g){
    g.fillStyle = PANEL_BG;
    g.fillRect(0, 0, W, H);
    const cols = 3, rows = 2, pad = 20, gap = 14;
    const tileW = (W - pad * 2 - gap * (cols - 1)) / cols;
    const tileH = (H - pad * 2 - gap * (rows - 1)) / rows;
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < cols; c++){
        const x = pad + c * (tileW + gap), y = pad + r * (tileH + gap);
        g.fillStyle = ACCENT;
        roundRectPath(g, x, y, tileW, tileH, 12);
        g.fill();
        g.fillStyle = INK;
        g.globalAlpha = 0.85;
        g.beginPath();
        g.arc(x + tileW - 14, y + 14, 7, 0, Math.PI * 2);
        g.fill();
        g.globalAlpha = 1;
        g.fillStyle = PANEL_BG;
        g.globalAlpha = 0.9;
        roundRectPath(g, x + 10, y + tileH - 20, tileW - 20, 10, 4);
        g.fill();
        g.globalAlpha = 1;
      }
    }
  }

  function drawParticleRect(g, x, y, w, h, rgb, alpha){
    if (alpha <= 0.01) return;
    g.globalAlpha = alpha;
    g.fillStyle = 'rgb(' + (rgb[0] | 0) + ',' + (rgb[1] | 0) + ',' + (rgb[2] | 0) + ')';
    g.fillRect(x, y, w, h);
    g.globalAlpha = 1;
  }

  const ANGULAR_SPEED = 4.0; // 변형 06 전값(후 8.0) — 회전 각속도. 클수록 노출 문턱(threshold)에 더 빨리 도달해 와이프가 짧게 끝난다
  const REVEAL_SPAN = 3.0; // 반지름 0~최대에 걸쳐 배분하는 회전각 예산(고정)

  let particles = [];
  let sceneBCanvas = null;
  let MAX_R = 0;

  function sampleCanvas(cv){
    return cv.getContext('2d').getImageData(0, 0, W, H).data;
  }

  function PRECOMPUTE(){
    const a = document.createElement('canvas'); a.width = W; a.height = H;
    const b = document.createElement('canvas'); b.width = W; b.height = H;
    paintList(a.getContext('2d'));
    paintGrid(b.getContext('2d'));
    const da = sampleCanvas(a);
    const db = sampleCanvas(b);
    sceneBCanvas = b;
    const cellW = W / COLS, cellH = H / ROWS;
    const pts = [];
    MAX_R = 0;
    for (let j = 0; j < ROWS; j++){
      for (let i = 0; i < COLS; i++){
        const cx = (i + 0.5) * cellW, cy = (j + 0.5) * cellH;
        const px = clampN(Math.round(cx), 0, W - 1);
        const py = clampN(Math.round(cy), 0, H - 1);
        const idx = (py * W + px) * 4;
        const ca = [da[idx], da[idx + 1], da[idx + 2]];
        const cb = [db[idx], db[idx + 1], db[idx + 2]];
        const dx = cx - CENTER_X, dy = cy - CENTER_Y;
        const r0 = Math.sqrt(dx * dx + dy * dy);
        const ang0 = Math.atan2(dy, dx);
        if (r0 > MAX_R) MAX_R = r0;
        pts.push({ gx: i, gy: j, cx, cy, cellW, cellH, ca, cb, r0, ang0, seed: rnd(), seed2: rnd() });
      }
    }
    particles = pts;
  }

  function RENDER(p){
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(sceneBCanvas, 0, 0);
    const gap = 1;
    const spanP = clampN(REVEAL_SPAN / ANGULAR_SPEED, 0.2, 0.8);
    const fadeWidth = 0.15;
    for (let k = 0; k < particles.length; k++){
      const q = particles[k];
      const ang = q.ang0 + ANGULAR_SPEED * p;
      const x = CENTER_X + q.r0 * Math.cos(ang);
      const y = CENTER_Y + q.r0 * Math.sin(ang);
      const threshold = (q.r0 / (MAX_R || 1)) * spanP;
      const lp = clampN((p - threshold) / fadeWidth, 0, 1);
      const alpha = clampN(1 - lp * 1.05, 0, 1);
      const w = q.cellW + gap, h = q.cellH + gap;
      drawParticleRect(ctx, x - w / 2, y - h / 2, w, h, q.ca, alpha);
    }
  }

  const rootEl = document.querySelector('.rv');
  const cvEl = document.querySelector('.rv__cv');
  const ctx = cvEl.getContext('2d');

  const ARIA_LIST = 'リスト画面 — クリックまたはスペースキーでグリッド画面に切り替え';
  const ARIA_GRID = 'グリッド画面 — クリックまたはスペースキーでリスト画面に切り替え';

  function updateAria(prog){
    rootEl.setAttribute('aria-label', prog < 0.5 ? ARIA_LIST : ARIA_GRID);
  }

  let progress = 0;
  let playing = false, playStart = 0, playFrom = 0, playTo = 0;
  const PLAY_MS = 600;

  function human(){ rootEl.classList.remove('is-demo'); }

  function play(target){
    playing = true; playFrom = progress; playTo = target; playStart = performance.now();
  }

  function stepPlay(now){
    const t = clampN((now - playStart) / PLAY_MS, 0, 1);
    progress = playFrom + (playTo - playFrom) * easeInOut(t);
    RENDER(progress);
    updateAria(progress);
    if (t >= 1){ playing = false; progress = playTo; }
  }

  const DRIVE_PERIOD_MS = 2000;
  const driveStart = performance.now();
  function triangle(t){
    const u = (t % DRIVE_PERIOD_MS) / DRIVE_PERIOD_MS;
    return u < 0.5 ? u * 2 : 2 - u * 2;
  }

  const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

  function onActivate(e){
    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
    if (e.type === 'keydown') e.preventDefault();
    human();
    const target = progress < 0.5 ? 1 : 0;
    if (reduceMQ.matches){
      progress = target;
      RENDER(progress);
      updateAria(progress);
    } else {
      play(target);
    }
  }

  function frame(now){
    if (!reduceMQ.matches){
      if (playing){
        stepPlay(now);
      } else if (rootEl.classList.contains('is-demo')){
        progress = triangle(now - driveStart);
        RENDER(progress);
        updateAria(progress);
      }
      requestAnimationFrame(frame);
    }
  }

  function onResize(){ RENDER(progress); }

  rootEl.addEventListener('click', onActivate);
  rootEl.addEventListener('keydown', onActivate);
  window.addEventListener('resize', onResize);

  PRECOMPUTE();
  updateAria(progress);
  if (reduceMQ.matches){
    RENDER(progress);
  } else {
    requestAnimationFrame(frame);
  }

})();
</script>
</body>
</html>
