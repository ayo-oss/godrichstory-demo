<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product zoom hotspot hero</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="hz is-demo">
    <div class="hz__copy">
      <h1 class="hz__title">기능은 짚어서 보여 준다</h1>
      <p class="hz__sub">점을 누르면 그 자리에 설명 쪽지가 뜹니다.</p>
    </div>

    <div class="hz__frame">
      <!-- 제품 그림은 사진이 아니라 도형 조합 — transform-origin 을 호출점 쪽에 두고 천천히 확대된다 -->
      <div class="hz__art" aria-hidden="true">
        <span class="hz__screen">
          <i class="hz__bar hz__bar--head"></i>
          <i class="hz__bar hz__bar--a"></i>
          <span class="hz__row">
            <i class="hz__tile hz__tile--v"></i>
            <i class="hz__tile hz__tile--g"></i>
          </span>
        </span>
      </div>

      <div class="hz__spot hz__spot--1">
        <button class="hz__dot" type="button" aria-expanded="false" aria-controls="hz-note-1" aria-label="지표 설명 열기">
          <span class="hz__ring" aria-hidden="true"></span>
          <svg viewBox="0 0 256 256" width="11" height="11" aria-hidden="true" focusable="false" fill="currentColor"><path d="M160,128a32,32,0,1,1-32-32A32,32,0,0,1,160,128Z" opacity="0.2"/><path d="M232,120h-8.34A96.14,96.14,0,0,0,136,32.34V24a8,8,0,0,0-16,0v8.34A96.14,96.14,0,0,0,32.34,120H24a8,8,0,0,0,0,16h8.34A96.14,96.14,0,0,0,120,223.66V232a8,8,0,0,0,16,0v-8.34A96.14,96.14,0,0,0,223.66,136H232a8,8,0,0,0,0-16Zm-96,87.6V200a8,8,0,0,0-16,0v7.6A80.15,80.15,0,0,1,48.4,136H56a8,8,0,0,0,0-16H48.4A80.15,80.15,0,0,1,120,48.4V56a8,8,0,0,0,16,0V48.4A80.15,80.15,0,0,1,207.6,120H200a8,8,0,0,0,0,16h7.6A80.15,80.15,0,0,1,136,207.6ZM128,88a40,40,0,1,0,40,40A40,40,0,0,0,128,88Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,128,152Z"/></svg>
        </button>
        <p class="hz__note" id="hz-note-1">지표를 한눈에</p>
      </div>

      <div class="hz__spot hz__spot--2">
        <button class="hz__dot" type="button" aria-expanded="false" aria-controls="hz-note-2" aria-label="알림 설명 열기">
          <span class="hz__ring" aria-hidden="true"></span>
          <svg viewBox="0 0 256 256" width="11" height="11" aria-hidden="true" focusable="false" fill="currentColor"><path d="M160,128a32,32,0,1,1-32-32A32,32,0,0,1,160,128Z" opacity="0.2"/><path d="M232,120h-8.34A96.14,96.14,0,0,0,136,32.34V24a8,8,0,0,0-16,0v8.34A96.14,96.14,0,0,0,32.34,120H24a8,8,0,0,0,0,16h8.34A96.14,96.14,0,0,0,120,223.66V232a8,8,0,0,0,16,0v-8.34A96.14,96.14,0,0,0,223.66,136H232a8,8,0,0,0,0-16Zm-96,87.6V200a8,8,0,0,0-16,0v7.6A80.15,80.15,0,0,1,48.4,136H56a8,8,0,0,0,0-16H48.4A80.15,80.15,0,0,1,120,48.4V56a8,8,0,0,0,16,0V48.4A80.15,80.15,0,0,1,207.6,120H200a8,8,0,0,0,0,16h7.6A80.15,80.15,0,0,1,136,207.6ZM128,88a40,40,0,1,0,40,40A40,40,0,0,0,128,88Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,128,152Z"/></svg>
        </button>
        <p class="hz__note" id="hz-note-2">알림만 골라서</p>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.hz');
  var spots = [].slice.call(root.querySelectorAll('.hz__spot'));

  // 격자 미리보기용 자동 루프 — 사람이 손을 대면 뗀다
  function stopLoop() { root.classList.remove('is-demo'); }

  spots.forEach(function (spot) {
    var dot = spot.querySelector('.hz__dot');
    dot.addEventListener('click', function () {
      stopLoop();
      var isOpen = dot.getAttribute('aria-expanded') === 'true';
      dot.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
      spot.classList.toggle('is-open', !isOpen);
    });
  });

  root.addEventListener('pointerenter', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
