<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal logo hero — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="hm is-demo" aria-label="Coming soon notice">
    <div class="hm__mark">
      <!-- 고리 두 겹이 시차를 두고 퍼진다. 주인공(로고 표시)은 루프 내내 제자리에 남는다 -->
      <span class="hm__ring hm__ring--a" aria-hidden="true"></span>
      <span class="hm__ring hm__ring--b" aria-hidden="true"></span>
      <span class="hm__badge">
        <svg viewBox="0 0 256 256" width="30" height="30" aria-hidden="true" focusable="false" fill="currentColor"><path d="M128,112a36,36,0,1,1,36-36A36,36,0,0,1,128,112Zm60,24a36,36,0,1,0,36,36A36,36,0,0,0,188,136ZM68,136a36,36,0,1,0,36,36A36,36,0,0,0,68,136Z" opacity="0.2"/><path d="M172,76a44,44,0,1,0-44,44A44.05,44.05,0,0,0,172,76Zm-44,28a28,28,0,1,1,28-28A28,28,0,0,1,128,104Zm60,24a44,44,0,1,0,44,44A44.05,44.05,0,0,0,188,128Zm0,72a28,28,0,1,1,28-28A28,28,0,0,1,188,200ZM68,128a44,44,0,1,0,44,44A44.05,44.05,0,0,0,68,128Zm0,72a28,28,0,1,1,28-28A28,28,0,0,1,68,200Z"/></svg>
      </span>
    </div>

    <p class="hm__copy">Opening soon</p>

    <button class="hm__btn" type="button" aria-pressed="false">Tell me when it opens</button>

    <p class="hm__live" role="status" aria-live="polite">Kept on this screen only, no email</p>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.hm');
  var btn = root.querySelector('.hm__btn');
  var live = root.querySelector('.hm__live');
  var waiting = false;

  // 버튼을 누르면 aria-live 한 줄이 바뀐다 (실제 등록이 아니라 이 화면 안의 표시)
  btn.addEventListener('click', function () {
    waiting = !waiting;
    live.textContent = waiting ? 'Marked as waiting for the notice' : 'Kept on this screen only, no email';
    btn.textContent = waiting ? 'Cancel the notice' : 'Tell me when it opens';
    btn.setAttribute('aria-pressed', waiting ? 'true' : 'false');
  });

  // 사람이 손을 대면 미리보기 루프를 뗀다
  function stopLoop() { root.classList.remove('is-demo'); }
  root.addEventListener('pointerdown', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
