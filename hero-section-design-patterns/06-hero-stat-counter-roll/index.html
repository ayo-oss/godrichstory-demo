<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stat counter hero</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="hc is-demo">
    <h1 class="hc__title">숫자가 먼저 말하는 회사 소개</h1>

    <div class="hc__row">
      <div class="hc__cell hc__cell--1">
        <!-- 자릿수 스트립: 세로로 쌓은 숫자 열을 창 안에서 굴려 올린다. 읽히는 값은 aria-label 하나 -->
        <p class="hc__value" role="img" aria-label="98퍼센트">
          <span class="hc__win" aria-hidden="true"><span class="hc__strip"><span class="hc__digit">3</span><span class="hc__digit">4</span><span class="hc__digit">5</span><span class="hc__digit">6</span><span class="hc__digit">7</span><span class="hc__digit">8</span><span class="hc__digit">9</span></span></span>
          <span class="hc__win" aria-hidden="true"><span class="hc__strip"><span class="hc__digit">2</span><span class="hc__digit">3</span><span class="hc__digit">4</span><span class="hc__digit">5</span><span class="hc__digit">6</span><span class="hc__digit">7</span><span class="hc__digit">8</span></span></span>
          <span class="hc__unit" aria-hidden="true">%</span>
        </p>
        <span class="hc__rule" aria-hidden="true"></span>
        <p class="hc__label">가동 안정성</p>
      </div>

      <div class="hc__cell hc__cell--2">
        <p class="hc__value" role="img" aria-label="12배">
          <span class="hc__win" aria-hidden="true"><span class="hc__strip"><span class="hc__digit">5</span><span class="hc__digit">6</span><span class="hc__digit">7</span><span class="hc__digit">8</span><span class="hc__digit">9</span><span class="hc__digit">0</span><span class="hc__digit">1</span></span></span>
          <span class="hc__win" aria-hidden="true"><span class="hc__strip"><span class="hc__digit">6</span><span class="hc__digit">7</span><span class="hc__digit">8</span><span class="hc__digit">9</span><span class="hc__digit">0</span><span class="hc__digit">1</span><span class="hc__digit">2</span></span></span>
          <span class="hc__unit" aria-hidden="true">×</span>
        </p>
        <span class="hc__rule" aria-hidden="true"></span>
        <p class="hc__label">배포 속도</p>
      </div>

      <div class="hc__cell hc__cell--3">
        <p class="hc__value" role="img" aria-label="24시간">
          <span class="hc__win" aria-hidden="true"><span class="hc__strip"><span class="hc__digit">6</span><span class="hc__digit">7</span><span class="hc__digit">8</span><span class="hc__digit">9</span><span class="hc__digit">0</span><span class="hc__digit">1</span><span class="hc__digit">2</span></span></span>
          <span class="hc__win" aria-hidden="true"><span class="hc__strip"><span class="hc__digit">8</span><span class="hc__digit">9</span><span class="hc__digit">0</span><span class="hc__digit">1</span><span class="hc__digit">2</span><span class="hc__digit">3</span><span class="hc__digit">4</span></span></span>
          <span class="hc__unit" aria-hidden="true">h</span>
        </p>
        <span class="hc__rule" aria-hidden="true"></span>
        <p class="hc__label">평균 응답</p>
      </div>
    </div>

    <button class="hc__again" type="button">다시 세기</button>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.hc');
  var row = root.querySelector('.hc__row');
  var again = root.querySelector('.hc__again');

  // 격자 미리보기용 자동 루프 — 숫자 칸에 손이 닿으면 뗀다 (버튼은 예외라 눌러서 다시 셀 수 있다)
  function stopLoop() { root.classList.remove('is-demo'); }

  again.addEventListener('click', function () {
    root.classList.remove('is-demo');
    void root.offsetWidth;            // 리플로우 — 같은 애니메이션을 처음부터 다시 건다
    root.classList.add('is-demo');
  });

  row.addEventListener('pointerenter', stopLoop);
  root.addEventListener('focusin', function (e) {
    if (e.target !== again) { stopLoop(); }
  });
})();
</script>
</body>
</html>
