<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll-folding hero — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="hf">
    <!-- 자체 스크롤 상자. 이 상자가 스크롤포트이자 타임라인(--hfscroll)의 주인이다.
         html·body 는 절대 스크롤되지 않는다 -->
    <div class="hf__scroller" tabindex="0" role="region" aria-label="첫 화면 스크롤 상자">
      <section class="hf__hero">
        <div class="hf__inner">
          <h1 class="hf__title">스크롤 한 번으로 본문까지</h1>
          <p class="hf__sub">첫 화면은 제자리에 붙어 접힙니다</p>
          <button class="hf__btn" type="button">
            본문으로 이동
            <svg viewBox="0 0 256 256" width="16" height="16" aria-hidden="true" focusable="false" fill="currentColor"><path d="M200,144l-72,72L56,144Z" opacity="0.2"/><path d="M207.39,140.94A8,8,0,0,0,200,136H136V40a8,8,0,0,0-16,0v96H56a8,8,0,0,0-5.66,13.66l72,72a8,8,0,0,0,11.32,0l72-72A8,8,0,0,0,207.39,140.94ZM128,204.69,75.31,152H180.69Z"/></svg>
          </button>
        </div>
        <div class="hf__dim" aria-hidden="true"></div>
      </section>

      <article class="hf__doc">
        <h2 class="hf__h2">본문 시작</h2>
        <p class="hf__p">접힌 첫 화면 위로 이 카드가 올라와 덮습니다.</p>
        <p class="hf__p hf__p--soft">방향키로도 같은 자리를 지납니다.</p>
      </article>
    </div>
  </div>
</main>

<script>
(function () {
  var box = document.querySelector('.hf__scroller');
  var doc = document.querySelector('.hf__doc');
  var btn = document.querySelector('.hf__btn');

  // 접근성: 움직임을 줄이겠다고 한 사람에게는 부드러운 스크롤 대신 즉시 이동
  function prefersInstant() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  // 상자 안 본문 카드 자리로 옮긴다. offsetTop 은 position: relative 인 상자 기준이고
  // 스크롤 양과 무관한 값이라 누를 때마다 같은 자리로 간다
  btn.addEventListener('click', function () {
    box.scrollTo({ top: doc.offsetTop, behavior: prefersInstant() ? 'auto' : 'smooth' });
  });

  // 상자가 tabindex="0" 이라 Tab 으로 잡히고, 잡힌 뒤엔 방향키·PageDown 으로 브라우저가 스크롤한다.
  // Home·End 만 따로 받아 양 끝으로 보낸다
  box.addEventListener('keydown', function (e) {
    if (e.key !== 'Home' && e.key !== 'End') { return; }
    e.preventDefault();
    box.scrollTo({ top: e.key === 'Home' ? 0 : box.scrollHeight, behavior: prefersInstant() ? 'auto' : 'smooth' });
  });
})();
</script>
</body>
</html>
