<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split product hero</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="hs is-demo" aria-label="Product intro first screen">
    <div class="hs__copy">
      <span class="hs__eyebrow">New version is out</span>
      <h1 class="hs__title">One screen for the whole team day</h1>
      <p class="hs__lead">See scattered schedules and notes in one place.</p>
      <div class="hs__actions">
        <a class="hs__btn hs__btn--primary" href="#">Start for free</a>
        <a class="hs__btn hs__btn--ghost" href="#">Take a tour</a>
      </div>
    </div>

    <!-- 제품 도형 스택 — 뒤에서부터 겹쳐진 둥근 사각형 세 장. 맨 앞 장만 화면을 흉내 낸다 -->
    <div class="hs__art" aria-hidden="true">
      <span class="hs__card hs__card--c"></span>
      <span class="hs__card hs__card--b"></span>
      <span class="hs__card hs__card--a">
        <span class="hs__bar hs__bar--t"></span>
        <span class="hs__bar hs__bar--m"></span>
        <span class="hs__bar hs__bar--k"></span>
      </span>
    </div>

    <button class="hs__cue" type="button">
      <svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true" focusable="false" fill="currentColor"><path d="M208,96l-80,80L48,96Z" opacity="0.2"/><path d="M215.39,92.94A8,8,0,0,0,208,88H48a8,8,0,0,0-5.66,13.66l80,80a8,8,0,0,0,11.32,0l80-80A8,8,0,0,0,215.39,92.94ZM128,164.69,67.31,104H188.69Z"/></svg>
      <span>Scroll down</span>
    </button>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.hs');
  var cue = root.querySelector('.hs__cue');
  var front = root.querySelector('.hs__card--a');

  function stopLoop() { root.classList.remove('is-demo'); }

  // 스크롤 안내를 누르면 스택 등장만 한 번 다시 재생한다.
  // 클래스를 뗐다 붙이는 사이에 리플로를 한 번 일으켜야 애니메이션이 다시 걸린다.
  function replay() {
    root.classList.remove('is-replay');
    void root.offsetWidth;
    root.classList.add('is-replay');
  }

  cue.addEventListener('click', function () {
    stopLoop();
    replay();
  });

  // 맨 앞 장이 가장 늦게 도착하므로 그 끝에서 일회성 클래스를 뗀다
  front.addEventListener('animationend', function () {
    root.classList.remove('is-replay');
  });

  root.addEventListener('pointerenter', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
