<script>
(function () {
  var root = document.querySelector('.hb');
  var btns = [].slice.call(root.querySelectorAll('.hb__btn'));

  function stopLoop() { root.classList.remove('is-demo'); }

  // 버튼 쌍은 좌우 화살표로 오간다 (Home·End 는 양 끝).
  // preventScroll 이 없으면 iframe 안 포커스가 부모 홈 페이지를 아래로 끌어당긴다
  btns.forEach(function (btn, i) {
    btn.addEventListener('keydown', function (e) {
      var to = -1;
      if (e.key === 'ArrowRight') { to = (i + 1) % btns.length; }
      if (e.key === 'ArrowLeft') { to = (i - 1 + btns.length) % btns.length; }
      if (e.key === 'Home') { to = 0; }
      if (e.key === 'End') { to = btns.length - 1; }
      if (to < 0) { return; }
      e.preventDefault();
      stopLoop();
      btns[to].focus({ preventScroll: true });
    });
  });

  root.addEventListener('pointerenter', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
