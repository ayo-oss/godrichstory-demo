<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word-by-word headline hero</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="hk is-demo" aria-label="Brand first screen">
    <!-- 낱말마다 span — 각 낱말이 제 상자 안에서 아래로부터 올라온다 -->
    <h1 class="hk__title">
      <span class="hk__word hk__word--1"><span class="hk__wi">Light</span></span>
      <span class="hk__word hk__word--2"><span class="hk__wi">Fast</span></span>
      <span class="hk__key">
        <span class="hk__band" aria-hidden="true"></span>
        <span class="hk__word hk__word--3"><span class="hk__wi">Sure</span></span>
      </span>
    </h1>

    <p class="hk__lead">A brand line that ends in three words.</p>

    <div class="hk__actions">
      <a class="hk__btn" href="#">
        <span>See the brand</span>
        <svg viewBox="0 0 256 256" width="13" height="13" aria-hidden="true" focusable="false" fill="currentColor"><path d="M216,128l-72,72V56Z" opacity="0.2"/><path d="M221.66,122.34l-72-72A8,8,0,0,0,136,56v64H40a8,8,0,0,0,0,16h96v64a8,8,0,0,0,13.66,5.66l72-72A8,8,0,0,0,221.66,122.34ZM152,180.69V75.31L204.69,128Z"/></svg>
      </a>
      <button class="hk__again" type="button">
        <svg viewBox="0 0 256 256" width="11" height="11" aria-hidden="true" focusable="false" fill="currentColor"><path d="M228.23,134.69,84.15,222.81A8,8,0,0,1,72,216.12V39.88a8,8,0,0,1,12.15-6.69l144.08,88.12A7.82,7.82,0,0,1,228.23,134.69Z" opacity="0.2"/><path d="M232.4,114.49,88.32,26.35a16,16,0,0,0-16.2-.3A15.86,15.86,0,0,0,64,39.87V216.13A15.94,15.94,0,0,0,80,232a16.07,16.07,0,0,0,8.36-2.35L232.4,141.51a15.81,15.81,0,0,0,0-27ZM80,215.94V40l143.83,88Z"/></svg>
        <span>Play again</span>
      </button>
    </div>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.hk');
  var again = root.querySelector('.hk__again');
  var band = root.querySelector('.hk__band');

  function stopLoop() { root.classList.remove('is-demo'); }

  // "Play again" 는 등장만 한 번 되풀이한다.
  // 클래스를 뗐다 붙이는 사이에 리플로를 한 번 일으켜야 애니메이션이 다시 걸린다
  function replay() {
    root.classList.remove('is-replay');
    void root.offsetWidth;
    root.classList.add('is-replay');
  }

  again.addEventListener('click', function () {
    stopLoop();
    replay();
  });

  // 형광 띠가 가장 늦게 끝나므로 그 끝에서 일회성 클래스를 뗀다
  band.addEventListener('animationend', function () {
    root.classList.remove('is-replay');
  });

  root.addEventListener('pointerenter', stopLoop);
  root.addEventListener('focusin', stopLoop);
})();
</script>
</body>
</html>
