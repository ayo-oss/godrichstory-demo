<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient glass hero</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="hg is-demo">
    <!-- 배경: 사진이 아니라 radial-gradient 색 덩어리 세 개. 서로 다른 위상으로 느리게 흐른다 -->
    <div class="hg__bg" aria-hidden="true">
      <span class="hg__blob hg__blob--a"></span>
      <span class="hg__blob hg__blob--b"></span>
      <span class="hg__blob hg__blob--c"></span>
    </div>

    <div class="hg__card">
      <!-- 빛줄기는 clip-path 로 카드 모양 안에 갇힌다 -->
      <span class="hg__sheen" aria-hidden="true"><i class="hg__beam"></i></span>
      <h1 class="hg__title">Striking first screens, no photos</h1>
      <p class="hg__sub">Three color blobs and one glass pane replace the background image.</p>
      <a class="hg__cta" href="#">Start for free
        <svg viewBox="0 0 256 256" width="16" height="16" aria-hidden="true" focusable="false" fill="currentColor"><path d="M216,128l-72,72V56Z" opacity="0.2"/><path d="M221.66,122.34l-72-72A8,8,0,0,0,136,56v64H40a8,8,0,0,0,0,16h96v64a8,8,0,0,0,13.66,5.66l72-72A8,8,0,0,0,221.66,122.34ZM152,180.69V75.31L204.69,128Z"/></svg>
      </a>
    </div>

    <button class="hg__switch" type="button" aria-pressed="false">Pause the light</button>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.hg');
  var card = root.querySelector('.hg__card');
  var sw = root.querySelector('.hg__switch');

  // 격자 미리보기용 자동 루프 — 카드에 손이 닿으면 뗀다 (스위치는 예외라 눌러서 다시 켤 수 있다)
  function stopLoop() { root.classList.remove('is-demo'); }

  sw.addEventListener('click', function () {
    var paused = sw.getAttribute('aria-pressed') === 'true';
    sw.setAttribute('aria-pressed', paused ? 'false' : 'true');
    // animation-play-state 만 바꾼다 — 덩어리도 빛줄기도 있던 자리에 그대로 선다
    root.classList.toggle('is-paused', !paused);
    if (paused) { root.classList.add('is-demo'); }
  });

  card.addEventListener('pointerenter', stopLoop);
  root.addEventListener('focusin', function (e) {
    if (e.target !== sw) { stopLoop(); }
  });
})();
</script>
</body>
</html>
