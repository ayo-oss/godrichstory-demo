            봄 갈피
          </p>
          <h2 class="hl__title">가벼운 겉옷 한 벌</h2>
          <p class="hl__sub">아침저녁 바람막이로</p>
        </div>
        <div class="hl__pane hl__pane--art hl__pane--art1" aria-hidden="true">
          <span class="hl__shape hl__shape--disc"></span>
          <span class="hl__shape hl__shape--bar"></span>
        </div>
      </article>

      <article class="hl__slide hl__slide--2">
        <div class="hl__pane hl__pane--copy">
          <p class="hl__kicker">
            <svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true" focusable="false" fill="currentColor"><path d="M194.82,151.43l-55.09,20.3-20.3,55.09a7.92,7.92,0,0,1-14.86,0l-20.3-55.09-55.09-20.3a7.92,7.92,0,0,1,0-14.86l55.09-20.3,20.3-55.09a7.92,7.92,0,0,1,14.86,0l20.3,55.09,55.09,20.3A7.92,7.92,0,0,1,194.82,151.43Z" opacity="0.2"/><path d="M197.58,129.06,146,110l-19-51.62a15.92,15.92,0,0,0-29.88,0L78,110l-51.62,19a15.92,15.92,0,0,0,0,29.88L78,178l19,51.62a15.92,15.92,0,0,0,29.88,0L146,178l51.62-19a15.92,15.92,0,0,0,0-29.88ZM137,164.22a8,8,0,0,0-4.74,4.74L112,223.85,91.78,169A8,8,0,0,0,87,164.22L32.15,144,87,123.78A8,8,0,0,0,91.78,119L112,64.15,132.22,119a8,8,0,0,0,4.74,4.74L191.85,144ZM144,40a8,8,0,0,1,8-8h16V16a8,8,0,0,1,16,0V32h16a8,8,0,0,1,0,16H184V64a8,8,0,0,1-16,0V48H152A8,8,0,0,1,144,40ZM248,88a8,8,0,0,1-8,8h-8v8a8,8,0,0,1-16,0V96h-8a8,8,0,0,1,0-16h8V72a8,8,0,0,1,16,0v8h8A8,8,0,0,1,248,88Z"/></svg>
            여름 갈피
          </p>
          <h2 class="hl__title">그늘까지 챙기는 모자</h2>
          <p class="hl__sub">접어서 가방에 넣습니다</p>
        </div>
        <div class="hl__pane hl__pane--art hl__pane--art2" aria-hidden="true">
          <span class="hl__shape hl__shape--arch"></span>
          <span class="hl__shape hl__shape--dot"></span>
        </div>
      </article>

      <article class="hl__slide hl__slide--3">
        <div class="hl__pane hl__pane--copy">
          <p class="hl__kicker">
            <svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true" focusable="false" fill="currentColor"><path d="M194.82,151.43l-55.09,20.3-20.3,55.09a7.92,7.92,0,0,1-14.86,0l-20.3-55.09-55.09-20.3a7.92,7.92,0,0,1,0-14.86l55.09-20.3,20.3-55.09a7.92,7.92,0,0,1,14.86,0l20.3,55.09,55.09,20.3A7.92,7.92,0,0,1,194.82,151.43Z" opacity="0.2"/><path d="M197.58,129.06,146,110l-19-51.62a15.92,15.92,0,0,0-29.88,0L78,110l-51.62,19a15.92,15.92,0,0,0,0,29.88L78,178l19,51.62a15.92,15.92,0,0,0,29.88,0L146,178l51.62-19a15.92,15.92,0,0,0,0-29.88ZM137,164.22a8,8,0,0,0-4.74,4.74L112,223.85,91.78,169A8,8,0,0,0,87,164.22L32.15,144,87,123.78A8,8,0,0,0,91.78,119L112,64.15,132.22,119a8,8,0,0,0,4.74,4.74L191.85,144ZM144,40a8,8,0,0,1,8-8h16V16a8,8,0,0,1,16,0V32h16a8,8,0,0,1,0,16H184V64a8,8,0,0,1-16,0V48H152A8,8,0,0,1,144,40ZM248,88a8,8,0,0,1-8,8h-8v8a8,8,0,0,1-16,0V96h-8a8,8,0,0,1,0-16h8V72a8,8,0,0,1,16,0v8h8A8,8,0,0,1,248,88Z"/></svg>
            가을 갈피
          </p>
          <h2 class="hl__title">두 겹으로 짠 담요</h2>
          <p class="hl__sub">무릎 위에 딱 맞는 크기</p>
        </div>
        <div class="hl__pane hl__pane--art hl__pane--art3" aria-hidden="true">
          <span class="hl__shape hl__shape--wedge"></span>
          <span class="hl__shape hl__shape--ring"></span>
        </div>
      </article>
    </div>

    <div class="hl__dots" role="group" aria-label="슬라이드 고르기">
      <button class="hl__dot hl__dot--1" type="button" aria-current="true" aria-label="첫째 장으로"><span class="hl__fill"></span></button>
      <button class="hl__dot hl__dot--2" type="button" aria-label="둘째 장으로"><span class="hl__fill"></span></button>
      <button class="hl__dot hl__dot--3" type="button" aria-label="셋째 장으로"><span class="hl__fill"></span></button>
    </div>
  </section>
</main>

<script>
(function () {
  var root = document.querySelector('.hl');
  var slides = [].slice.call(root.querySelectorAll('.hl__slide'));
  var dots = [].slice.call(root.querySelectorAll('.hl__dot'));
  var cur = 0;

  // 점을 누르면 CSS 루프를 끄고 그 장으로 간다. 이때부터는 transition 위프가 맡는다.
  // 직전 장은 is-prev 로 한 층 아래에 남겨 둔다 — 새 장이 덮는 동안 바닥이 비지 않게
  function showSlide(i) {
    root.classList.remove('is-demo');
    var prev = cur;
    cur = (i + slides.length) % slides.length;
    slides.forEach(function (s, n) {
      s.classList.toggle('is-prev', n === prev && n !== cur);
      s.classList.toggle('is-on', n === cur);
    });
    dots.forEach(function (d, n) {
      if (n === cur) { d.setAttribute('aria-current', 'true'); } else { d.removeAttribute('aria-current'); }
    });
  }

  dots.forEach(function (d, i) {
    d.addEventListener('click', function () { showSlide(i); });
    // 좌우 화살표로도 옮겨 다닌다 — iframe 안에서 부모가 끌려가지 않게 preventScroll
    d.addEventListener('keydown', function (e) {
      var to = null;
      if (e.key === 'ArrowRight') { to = i + 1; }
      if (e.key === 'ArrowLeft') { to = i - 1; }
      if (e.key === 'Home') { to = 0; }
      if (e.key === 'End') { to = dots.length - 1; }
      if (to === null) { return; }
      e.preventDefault();
      showSlide(to);
      dots[cur].focus({ preventScroll: true });
    });
  });

  root.addEventListener('pointerdown', function () { root.classList.remove('is-demo'); });
})();
</script>
</body>
</html>
