<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Measuring Whether a Label Fits Inside — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="vj is-demo" id="vj">
  <div class="vj__pad" data-role="pad" tabindex="0" role="application" aria-label="Bubble chart stage: arrow keys move between bubbles, Enter picks, P pauses, N steps once, R restarts">
    <canvas class="vj__canvas" data-role="canvas" width="480" height="300" role="img" aria-label="The size of a board of twelve bubbles shrinks and grows. On the left the glyph width is estimated: a label goes inside the bubble if it fits, otherwise only its first few letters, and if even that fails a line leads outside where it is written, and outside labels step aside up and down. On the right the width is not measured and the label always sits at the bubble center, so letters spill out. The corner numbers count labels inside, cut and outside, and the overflowing ones"></canvas>
  </div>
  <p class="vj__status" data-role="status" aria-live="off">Bubble chart demo</p>
  <div class="vj__ctrl">
    <button class="vj__pause" data-role="pause" type="button" aria-pressed="false">Pause</button>
    <button class="vj__step" data-role="step" type="button">Step</button>
  </div>
  <p class="vj__done" data-role="done" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("vj");
    if (!root) return;
    // 무대 좌표 — 캔버스 안 계산은 늘 480×300. 화면에 보이는 크기와 상관없다
    const W = 480;
    const H = 300;
    const TAU = Math.PI * 2;
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    // 끝에서 한 번 넘쳤다 돌아오는 곡선 — 거품이 자리에 튀어 나올 때
    function backOut(x) {
        const c = clamp(x, 0, 1) - 1;
        return 1 + 2.70158 * c * c * c + 1.70158 * c * c;
    }
    // 시드 고정 난수 — 선형 합동 생성기(곱 1664525, 더함 1013904223). 같은 시드면 같은 수열
    function seeded(seed) {
        let s = (seed >>> 0) || 1;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 파스텔 팔레트 — 거품은 연한 면, 글자는 늘 진한 잉크
    const BG_TOP = [248, 244, 252];
    const BG_BOT = [228, 234, 250];
    const BED = [226, 220, 242];
    const INK = [40, 36, 54];
    const INK2 = [66, 60, 90];
    const PAPER = [250, 246, 240];
    const ROSE = [244, 162, 186];
    const MINT = [148, 212, 182];
    const TILES = [
        [200, 190, 244], [168, 222, 200], [250, 228, 150], [246, 184, 200],
        [172, 208, 246], [250, 208, 170], [196, 222, 170], [222, 190, 240],
    ];
    function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
    function rgba(c, a) {
        return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    // 장면 시계(초)·판 반복 번호·시간표 — 시간표는 (시각, 할 일) 목록이고 시각이 지나면 한 번씩 부른다
    let sceneT = 0;
    let lap = 0;
    let script = [];
    let evAt = 0;
    // 겹침 한 번 풀기 — 두 원의 중심 거리 d 가 반지름 합에 gap 을 더한 값보다 작으면 모자란 만큼(o)을 두 원의 Size 비율로 나눠 서로 밀어낸다(작은 원이 더 많이 움직인다)
    function relaxPass(bs, gap) {
        for (let i = 0; i < bs.length; i += 1) {
            for (let j = i + 1; j < bs.length; j += 1) {
                const a = bs[i];
                const b = bs[j];
                let dx = b.x - a.x;
                let dy = b.y - a.y;
                let d = Math.sqrt(dx * dx + dy * dy);
                const need = a.r + b.r + gap;
                if (d >= need) {
                    continue;
                }
                if (d < 1e-6) {
                    dx = Math.cos(i * 2.399 + j * 1.131);
                    dy = Math.sin(i * 2.399 + j * 1.131);
                    d = 1;
                }
                const o = need - d;
                const ux = dx / d;
                const uy = dy / d;
                const sa = b.r / (a.r + b.r);
                const sb = a.r / (a.r + b.r);
                a.x -= ux * o * sa;
                a.y -= uy * o * sa;
                b.x += ux * o * sb;
                b.y += uy * o * sb;
            }
        }
    }
    // 판 안에 가두기 — 원 전체가 사각형 안에 있게 중심을 자른다
    function keepIn(bs, R) {
        for (const b of bs) {
            b.x = clamp(b.x, R.x + b.r, R.x + R.w - b.r);
            b.y = clamp(b.y, R.y + b.r, R.y + R.h - b.r);
        }
    }
    // 겹침 합 — 모든 원 쌍에서 (반지름 합 - 중심 거리) 가 양수인 만큼을 더한 값. 0 이면 겹침이 없다
    function overlapOf(bs) {
        let s = 0;
        for (let i = 0; i < bs.length; i += 1) {
            for (let j = i + 1; j < bs.length; j += 1) {
                const d = Math.hypot(bs[j].x - bs[i].x, bs[j].y - bs[i].y);
                const o = bs[i].r + bs[j].r - d;
                if (o > 0) {
                    s += o;
                }
            }
        }
        return s;
    }
    // 반복해서 풀기 — passes 번 겹침을 밀고, 매번 판 중심으로 pull 만큼 끌어당긴 뒤 판 안으로 자른다. 끝난 뒤 남은 겹침 합을 돌려준다
    function relax(bs, R, passes, gap, pull) {
        const cx = R.x + R.w / 2;
        const cy = R.y + R.h / 2;
        for (let p = 0; p < passes; p += 1) {
            relaxPass(bs, gap);
            if (pull > 0) {
                for (const b of bs) {
                    b.x += (cx - b.x) * pull;
                    b.y += (cy - b.y) * pull;
                }
            }
            keepIn(bs, R);
        }
        return overlapOf(bs);
    }
    function sumOf(vals) { let s = 0; for (const v of vals) {
        s += v;
    } return s; }
    function r1(v) { return String(Math.round(v * 10) / 10); }
    // ── 자체 가상 데이터 ──────────────────────────────────────
    const NAMES = [
        'Butter', 'Cookie', 'Milk', 'Tea', 'Honey', 'Jam', 'Bread', 'Noodle', 'Rice', 'Nori', 'Bean', 'Citrus',
        'Pear', 'Chestnut', 'Sesame', 'Adzuki', 'Grain', 'Salt', 'Vinegar', 'Tofu', 'Kelp', 'Squash', 'Persimmon', 'Mugwort',
    ];
    // ── 글자 폭 어림 ──────────────────────────────────────────
    // 한글·한자·가나는 글자 크기만큼, 로마자는 0.56 배로 어림한다 — 실제 폭을 재지 않고 문자 수에서 곧바로 구한다
    function glyphW(s, px) {
        let w = 0;
        for (let i = 0; i < s.length; i += 1) {
            w += (s.charCodeAt(i) >= 0x2e80 ? 1 : 0.56) * px;
        }
        return w;
    }
    // 문구 틀의 {a}·{b} 자리에 값을 끼운다 — 화면 문구는 늘 이 틀 한 줄로 두고 로케일 사전이 통째로 바꾼다
    function fill(s, a, b) { return s.replace('{a}', a).replace('{b}', b === undefined ? '' : b); }
    const canvasEl = root.querySelector('[data-role="canvas"]');
    const padEl = root.querySelector('[data-role="pad"]');
    const pauseEl = root.querySelector('[data-role="pause"]');
    const statusEl = root.querySelector('[data-role="status"]');
    const stepEl = root.querySelector('[data-role="step"]');
    const doneEl = root.querySelector('[data-role="done"]');
    const ctxRaw = canvasEl ? canvasEl.getContext('2d') : null;
    if (!canvasEl || !ctxRaw || !pauseEl || !padEl || !stepEl || !doneEl) {
        return;
    }
    const cv = canvasEl;
    const ctx = ctxRaw;
    const pauseBtn = pauseEl;
    const stepBtn = stepEl;
    const doneP = doneEl;
    const pad = padEl;
    // 외부 웹폰트는 부르지 않는다 — 기기에 있는 글꼴 목록만
    const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif';
    let dpr = 1;
    function fitCanvas() {
        // 배율은 2 에서 자른다 — 배율 3 기기에서 화소가 2.25배로 늘지 않게
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function skyFill(top, bot) {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, rgba(top, 1));
        g.addColorStop(1, rgba(bot, 1));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
    function disc(x, y, r, c, a) {
        if (r <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function box(x, y, w, h, r, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.fillStyle = rgba(c, a);
        ctx.fill();
    }
    function outline(x, y, w, h, r, width, c, a) {
        if (w <= 0.2 || h <= 0.2 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function text(s, x, y, c, a, px, weight, align) {
        ctx.font = weight + ' ' + px + 'px ' + FONT_STACK;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(c, a);
        ctx.fillText(s, x, y);
    }
    // 글자 이름표 — 바탕 알약 위에 글자
    function tag(s, x, y, bg, fg, px, align) {
        ctx.font = '700 ' + px + 'px ' + FONT_STACK;
        const w = ctx.measureText(s).width + px * 1.1;
        const left = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
        box(left, y - px * 0.82, w, px * 1.64, px * 0.82, bg, 0.92);
        text(s, left + w / 2, y + 0.5, fg, 1, px, 700, 'center');
    }
    // 판 자리 — 왼쪽 판·오른쪽 판(대비판)·한 판짜리 히어로. 위쪽은 상태 줄·버튼 자리
    const PANEL_L = { x: 12, y: 78, w: 222, h: 208 };
    const PANEL_R = { x: 246, y: 78, w: 222, h: 208 };
    const PANEL_ONE = { x: 12, y: 60, w: 456, h: 228 };
    // 판 바닥 — 칸 사이 틈으로 비치는 연보라
    function bed(R) {
        box(R.x - 3, R.y - 3, R.w + 6, R.h + 6, 10, BED, 1);
    }
    function panelTags(a, b) {
        tag(a, PANEL_L.x + PANEL_L.w / 2, 66, INK, PAPER, 10, 'center');
        tag(b, PANEL_R.x + PANEL_R.w / 2, 66, PAPER, INK, 10, 'center');
    }
    // 거품 한 개 — 면, 왼쪽 위 하이라이트, 옅은 윤곽
    function orb(x, y, r, c, a) {
        if (r <= 0.3 || a <= 0) {
            return;
        }
        disc(x, y, r, c, a);
        if (r > 5) {
            disc(x - r * 0.28, y - r * 0.32, r * 0.42, [255, 255, 255], 0.3 * a);
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = 1;
        ctx.strokeStyle = rgba(mix(c, INK, 0.28), 0.55 * a);
        ctx.stroke();
    }
    function line(x0, y0, x1, y1, width, c, a) {
        if (a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function ring(x, y, r, width, c, a) {
        if (r <= 0.3 || a <= 0) {
            return;
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.lineWidth = width;
        ctx.strokeStyle = rgba(c, a);
        ctx.stroke();
    }
    function ballHit(b, label) {
        return { x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2, label: label };
    }
    let shownStatus = '';
    function pushStatus(s) {
        if (!statusEl || s === shownStatus) {
            return;
        }
        shownStatus = s;
        statusEl.textContent = s;
    }
    let paused = false;
    const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    // 페이지를 연 채 움직임 줄이기 설정을 바꿔도 change 리스너가 다시 읽는다
    let still = reduceQuery.matches;
    // 자동 시연 표시 — 사람이 처음 손대면 떼고 상태 줄을 polite 로 켠다
    let demo = root.classList.contains('is-demo');
    const off = new AbortController();
    // 사람이 직접 하는 중이면 시간표는 멈추고 애니메이션만 흐른다
    let manual = false;
    // curOn 이면 키보드 칸 고르기가 켜진 것 — ki 가 hits() 안 번호
    let curOn = false;
    let ki = 0;
    function wake() {
        if (!demo) {
            return;
        }
        demo = false;
        root.classList.remove('is-demo');
        if (statusEl) {
            statusEl.setAttribute('aria-live', 'polite');
        }
    }
    function takeOver() {
        if (manual) {
            return;
        }
        manual = true;
        onTake();
        wake();
        if (!curOn) {
            curOn = true;
            ki = 0;
        }
    }
    // 한 판 시연이 끝났음을 스크린리더에 한 번만 알린다 — 판이 되풀이돼도 다시 읽지 않는다
    let doneSaid = false;
    function checkDone() {
        if (!manual && !doneSaid && sceneT >= LAP_S - 0.6) {
            doneSaid = true;
            doneP.textContent = statusText();
        }
    }
    function advance(dt) {
        sceneT += dt;
        if (!manual) {
            while (evAt < script.length && script[evAt].t <= sceneT) {
                const ev = script[evAt];
                evAt += 1;
                ev.f();
            }
            if (sceneT >= LAP_S) {
                lap += 1;
                begin();
                return;
            }
        }
        update(dt);
    }
    // 첫 판은 START_S 만큼 앞서 시작한다 — 칸이 이미 움직이는 중인 장면에서 보인다
    function runTo(t) {
        while (sceneT < t - 1e-6) {
            advance(Math.min(1 / 30, t - sceneT));
        }
    }
    function begin() {
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        if (lap === 0 && !still) {
            runTo(START_S);
        }
    }
    const DT_MAX = 0.05;
    const SETTLE_FRAMES = 8;
    const SETTLE_DT = 0.04;
    function drawCursor() {
        if (!curOn) {
            return;
        }
        const hs = hits();
        if (hs.length === 0) {
            return;
        }
        const h = hs[clamp(ki, 0, hs.length - 1)];
        outline(h.x + 1, h.y + 1, h.w - 2, h.h - 2, 5, 3, INK, 1);
        outline(h.x - 1, h.y - 1, h.w + 2, h.h + 2, 6, 1.5, PAPER, 0.9);
    }
    function cursorLabel() {
        const hs = hits();
        return hs.length === 0 ? statusText() : hs[clamp(ki, 0, hs.length - 1)].label;
    }
    function showNow() {
        draw();
        drawCursor();
        pushStatus(curOn ? cursorLabel() : statusText());
        checkDone();
    }
    let rafId = 0;
    let lastTs = -1;
    function frame(ts) {
        if (still || paused) {
            rafId = 0;
            return;
        }
        if (lastTs < 0) {
            lastTs = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000, DT_MAX);
        lastTs = ts;
        if (dt > 0) {
            advance(dt);
        }
        showNow();
        rafId = window.requestAnimationFrame(frame);
    }
    function startLoop() {
        if (rafId) {
            return;
        }
        // 멈췄던 사이의 시간을 첫 프레임 dt 로 넘기지 않는다
        lastTs = -1;
        rafId = window.requestAnimationFrame(frame);
    }
    function stopLoop() {
        if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
        }
    }
    // 움직임 줄이기 — 루프 없이 배치가 끝난 정지 장면 한 장
    function showRest() {
        stopLoop();
        lap = 0;
        sceneT = 0;
        evAt = 0;
        script = [];
        build();
        runTo(REST_S);
        showNow();
    }
    // 움직임 줄이기이거나 멈춘 채 입력이 들어오면 트윈 없이 곧바로 끝 배치로 — 시간을 3초 흘려 스프링·애니메이션을 다 끝낸다
    function settleStill() {
        for (let k = 0; k < 90; k += 1) {
            sceneT += 1 / 30;
            update(1 / 30);
        }
    }
    function play() {
        begin();
        showNow();
        if (!paused) {
            startLoop();
        }
    }
    function togglePause() {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        wake();
        if (paused) {
            stopLoop();
        }
        else if (!still) {
            startLoop();
        }
    }
    function restart() {
        manual = false;
        curOn = false;
        doneSaid = false;
        lap += 1;
        begin();
        for (let k = 0; k < SETTLE_FRAMES; k += 1) {
            update(SETTLE_DT);
        }
        showNow();
    }
    // Step — 멈춘 채 시간표의 다음 일 하나를 부른다. 더 부를 일이 없거나 직접 하던 중이면 다음 판을 연다
    function stepOnce() {
        wake();
        if (!paused) {
            paused = true;
            pauseBtn.setAttribute('aria-pressed', 'true');
            stopLoop();
        }
        if (manual || evAt >= script.length) {
            restart();
            return;
        }
        sceneT = Math.max(sceneT, script[evAt].t);
        advance(0);
        for (let k = 0; k < SETTLE_FRAMES; k += 1) {
            sceneT += SETTLE_DT;
            update(SETTLE_DT);
        }
        showNow();
    }
    function moveCur(d) {
        const n = hits().length;
        if (n === 0) {
            return;
        }
        ki = (ki + d + n) % n;
    }
    function actCur(i) {
        onAct(i);
        // 멈춘 채·움직임 줄이기에서도 입력이 화면에 바로 반영되게 한다
        if (still || paused) {
            settleStill();
        }
    }
    pauseBtn.addEventListener('click', togglePause, { signal: off.signal });
    stepBtn.addEventListener('click', stepOnce, { signal: off.signal });
    // 키보드 — 무대에 포커스가 있을 때만. 방향키는 칸 이동, Enter·Space 는 칸 고르기, P 는 Pause, N 은 Step, R 은 다시
    pad.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) {
            return;
        }
        const k = e.key;
        if (k === 'ArrowLeft' || k === 'ArrowUp') {
            e.preventDefault();
            takeOver();
            moveCur(-1);
            showNow();
        }
        else if (k === 'ArrowRight' || k === 'ArrowDown') {
            e.preventDefault();
            takeOver();
            moveCur(1);
            showNow();
        }
        else if (k === 'Enter' || k === ' ') {
            e.preventDefault();
            takeOver();
            actCur(ki);
            showNow();
        }
        else if (k === 'p' || k === 'P') {
            togglePause();
        }
        else if (k === 'n' || k === 'N') {
            stepOnce();
        }
        else if (k === 'r' || k === 'R') {
            restart();
        }
    }, { signal: off.signal });
    // 마우스·터치 — 누른 자리의 칸을 고른다
    pad.addEventListener('click', function (e) {
        const rect = cv.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width * W;
        const py = (e.clientY - rect.top) / rect.height * H;
        const hs = hits();
        let at = -1;
        for (let i = 0; i < hs.length; i += 1) {
            if (px >= hs[i].x && px <= hs[i].x + hs[i].w && py >= hs[i].y && py <= hs[i].y + hs[i].h) {
                at = i;
            }
        }
        if (at < 0) {
            return;
        }
        takeOver();
        ki = at;
        actCur(at);
        showNow();
    }, { signal: off.signal });
    // 탭이 숨으면 멈추고, 돌아오면 시계를 다시 맞춰 시작 — 숨은 동안의 몇 초가 한 프레임에 몰리지 않게
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            stopLoop();
        }
        else if (!paused && !still) {
            startLoop();
        }
    }, { signal: off.signal });
    // 설정이 바뀌면 — 켜지면 배치가 끝난 한 장, 꺼지면 다시 움직인다
    reduceQuery.addEventListener('change', function () {
        still = reduceQuery.matches;
        if (still) {
            showRest();
        }
        else {
            lap = 0;
            play();
        }
    }, { signal: off.signal });
    window.addEventListener('resize', function () {
        fitCanvas();
        showNow();
    }, { signal: off.signal });
    // 06 — 글자 폭을 문자 수로 어림해(glyphW) 거품 안쪽 폭에 들어가면 안에, 안 되면 앞 몇 자만(말줄임 없이), 그래도 안 되면 바깥으로 선을 빼서 적는다(왼쪽). 바깥 라벨끼리 겹치면 위아래로 민다. 오른쪽은 재지 않고 늘 거품 가운데에 적는다
    const LABEL_PAD = 3;
    const FONT_BIG = 11;
    const FONT_SMALL = 9;
    const FONT_FIXED = 10;
    const LABEL_GAP = 12;
    const N = 12;
    const LAP_S = 9.8;
    const START_S = 0.9;
    const REST_S = 2.6;
    const VALS = [30, 24, 20, 17, 14, 12, 10, 9, 8, 7, 6, 5];
    const LNAMES = ['Butter', 'Cookie', 'Milk tea', 'Honey jar', 'Berry jam', 'Toast', 'Banquet noodles', 'Fried rice', 'Nori chips', 'Sprouts', 'Peel tea', 'Pumpkin porridge'];
    let home = [];
    let kNow = 1;
    let kTgt = 1;
    let overflowR = 0;
    let counts = [0, 0, 0];
    // 거품 안쪽 폭 — 글자 높이 절반만큼 아래위로 벗어난 현의 길이에서 좌우 여백을 뺀다
    function chordW(r, px) { return 2 * Math.sqrt(Math.max(0, r * r - (px * 0.55) * (px * 0.55))) - 2 * LABEL_PAD; }
    function planOf(name, r) {
        for (const px of [FONT_BIG, FONT_SMALL]) {
            if (glyphW(name, px) <= chordW(r, px)) {
                return { mode: 0, px: px, s: name };
            }
        }
        // 앞 몇 자만 — 들어가는 가장 긴 접두(2자 이상)
        for (let n = name.length - 1; n >= 2; n -= 1) {
            const s = name.slice(0, n);
            if (glyphW(s, FONT_SMALL) <= chordW(r, FONT_SMALL)) {
                return { mode: 1, px: FONT_SMALL, s: s };
            }
        }
        return { mode: 2, px: FONT_SMALL, s: name };
    }
    function build() {
        const rnd = seeded(83 + (lap % 3) * 29);
        const R = { x: PANEL_L.x + 52, y: PANEL_L.y + 8, w: PANEL_L.w - 104, h: PANEL_L.h - 16 };
        home = VALS.map(function (v, i) {
            return { x: R.x + R.w * rnd(), y: R.y + R.h * rnd(), r: 3.4 * Math.sqrt(v), v: v, g: i };
        });
        relax(home, R, 90, 2, 0.02);
        kNow = 1;
        kTgt = 1;
        const seq = [[0.4, 0.55], [3.2, 1.25], [6.0, 0.8], [8.2, 1]];
        seq.forEach(function (e) { script.push({ t: e[0], f: function () { kTgt = e[1]; } }); });
    }
    function update(dt) {
        if (dt > 0) {
            kNow += (kTgt - kNow) * (1 - Math.exp(-2.6 * dt));
        }
    }
    // 판 중심에서 k 배로 — 거품 위치도 반지름도 같은 배율
    function scaled(R, k) {
        const cx = R.x + R.w / 2;
        const cy = R.y + R.h / 2;
        return home.map(function (b) {
            return { x: cx + (b.x - PANEL_L.x - PANEL_L.w / 2) * k, y: cy + (b.y - PANEL_L.y - PANEL_L.h / 2) * k, r: b.r * k, v: b.v, g: b.g };
        });
    }
    function drawFit() {
        const R = PANEL_L;
        bed(R);
        const bs = scaled(R, kNow);
        const order = bs.map(function (_b, i) { return i; }).sort(function (a, b) { return bs[b].r - bs[a].r; });
        for (const i of order) {
            orb(bs[i].x, bs[i].y, bs[i].r, TILES[i % 8], 1);
        }
        counts = [0, 0, 0];
        const outs = [];
        for (let i = 0; i < N; i += 1) {
            const p = planOf(LNAMES[i], bs[i].r);
            counts[p.mode] += 1;
            if (p.mode < 2) {
                text(p.s, bs[i].x, bs[i].y + 0.5, INK, 1, p.px, 700, 'center');
            }
            else {
                outs.push({ i: i, side: bs[i].x < R.x + R.w / 2 ? 0 : 1, y: bs[i].y });
            }
        }
        // 바깥 라벨 — 같은 쪽 라벨을 위에서 아래로 세워 LABEL_GAP 보다 가까우면 아래로 민다
        for (const side of [0, 1]) {
            const col = outs.filter(function (o) { return o.side === side; }).sort(function (a, b) { return a.y - b.y; });
            let prev = R.y + 4;
            for (const o of col) {
                o.y = Math.max(o.y, prev + LABEL_GAP);
                prev = o.y;
            }
            let over = prev - (R.y + R.h - 8);
            for (let k = col.length - 1; k >= 0 && over > 0; k -= 1) {
                col[k].y -= over;
                over = 0;
            }
            for (const o of col) {
                const b = bs[o.i];
                const tx = side === 0 ? R.x + 4 : R.x + R.w - 4;
                const w = glyphW(LNAMES[o.i], FONT_SMALL);
                const ex = side === 0 ? tx + w + 3 : tx - w - 3;
                const dx = ex - b.x;
                const dy = o.y - b.y;
                const dl = Math.max(Math.hypot(dx, dy), 1e-6);
                line(b.x + dx / dl * b.r, b.y + dy / dl * b.r, ex, o.y, 1.2, INK2, 0.8);
                text(LNAMES[o.i], tx, o.y, INK, 1, FONT_SMALL, 700, side === 0 ? 'left' : 'right');
            }
        }
    }
    function drawNaive() {
        const R = PANEL_R;
        bed(R);
        const bs = scaled(R, kNow);
        const order = bs.map(function (_b, i) { return i; }).sort(function (a, b) { return bs[b].r - bs[a].r; });
        for (const i of order) {
            orb(bs[i].x, bs[i].y, bs[i].r, TILES[i % 8], 1);
        }
        overflowR = 0;
        for (let i = 0; i < N; i += 1) {
            text(LNAMES[i], bs[i].x, bs[i].y + 0.5, INK, 1, FONT_FIXED, 700, 'center');
            if (glyphW(LNAMES[i], FONT_FIXED) > chordW(bs[i].r, FONT_FIXED)) {
                overflowR += 1;
            }
        }
        tag(fill('Overflow {a}', String(overflowR)), R.x + R.w - 6, R.y + 14, ROSE, INK, 10, 'right');
    }
    function draw() {
        skyFill(BG_TOP, BG_BOT);
        panelTags('Measured and split', 'Not measured');
        drawFit();
        drawNaive();
        tag(fill('In {a} · cut {b}', String(counts[0]), String(counts[1])), PANEL_L.x + PANEL_L.w - 6, PANEL_L.y + 14, INK, PAPER, 10, 'right');
    }
    function statusText() {
        return 'In {a} · cut {b} · out {c}'.replace('{a}', String(counts[0])).replace('{b}', String(counts[1])).replace('{c}', String(counts[2]));
    }
    function hits() {
        return scaled(PANEL_L, kNow).map(function (b, i) {
            return ballHit(b, '{n} value {v}'.replace('{n}', LNAMES[i]).replace('{v}', String(VALS[i])));
        });
    }
    // 직접 고르면 거품 Size 배율을 돌아가며 바꾼다 — 작게, 크게, 원래대로
    function onAct(_i) { kTgt = kTgt < 0.8 ? 1.25 : (kTgt > 1.1 ? 1 : 0.55); }
    function onTake() { return; }
    fitCanvas();
    if (still) {
        showRest();
    }
    else {
        play();
    }
    return function () {
        stopLoop();
        off.abort();
    };
})();
</script>
