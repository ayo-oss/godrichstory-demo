<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader a Processing Badge Switches Instantly When Reduced-motion Is Detected — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">
    <svg class="ld__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 56v56a8 8 0 0 1-16 0V91.3l-25.6 25.7A80 80 0 1 1 174 60a8 8 0 1 1-9 13.2A64 64 0 1 0 179.7 128H216a8 8 0 0 1 0 16h-56a8 8 0 0 1-8-8V80a8 8 0 0 1 16 0v20.7L192.7 76A80.1 80.1 0 0 0 64 128a8 8 0 0 1-16 0a96 96 0 0 1 163.6-68.3L224 71.3V56a8 8 0 0 1 8 8" opacity=".2"/><path d="M224 48a8 8 0 0 0-8 8v15.3l-11.7-11.6a96 96 0 1 0 27.6 51.6a8 8 0 0 0-15.8 2.5a80 80 0 1 1-23-43l-25.7 25.7A8 8 0 0 0 173 112h56a8 8 0 0 0 8-8V56a8 8 0 0 0-13-8"/></g></svg>
    <span>Click or press the space bar to pause or restart</span>
  </p>
  <div class="ld__field" id="field" role="application" aria-label="Reduced-motion badge-switch test panel" tabindex="0">
    <div class="ld__scene">
      <div class="ld__dots" id="dots" aria-hidden="true">
        <i></i><i></i><i></i>
      </div>
      <div class="ld__badge" id="badge">
        <b class="ld__badgeDot" aria-hidden="true"></b>
        <span id="badgeText">Processing</span>
      </div>
    </div>
    <p class="ld__state" id="state">Reduced motion: off · moving</p>
  </div>
</div>
</main>
<script>
(function () {
  var LOOP = 2.0;
  var SWITCH_AT = LOOP * 0.5;   // 동작 줄임 값이 켜졌다고 보는 시각
  var SPRING_MS = 0.36;         // 배지가 나타날 때 스프링 오버슛 시간
  var BOUNCE_HZ = 2.4;          // 점 세 개 바운스 진동수

  var root = document.getElementById('ld');
  var field = document.getElementById('field');
  var dots = document.getElementById('dots').children;
  var badge = document.getElementById('badge');
  var stateEl = document.getElementById('state');
  var paused = false;
  var t0 = performance.now();
  var raf = 0;

  function reduced() { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  // 임계 감쇠 스프링 근사(오버슛 포함): t=0 에서 0, t=1 부근에서 1을 살짝 넘겼다 정착
  function spring(t) {
    var x = clamp01(t);
    return 1 - Math.exp(-6 * x) * Math.cos(7 * x);
  }

  function draw(sec) {
    var t = sec % LOOP;
    var on = t >= SWITCH_AT;   // 동작 줄임 값(시뮬레이션)

    if (on) {
      var localT = (t - SWITCH_AT) / SPRING_MS;
      var s = spring(localT);
      badge.style.opacity = '1';
      badge.style.transform = 'scale(' + (0.7 + 0.3 * s).toFixed(3) + ')';
      dots.length && (root.querySelector('.ld__dots').style.opacity = '0');
      stateEl.textContent = 'Reduced motion: on · processing badge';
    } else {
      badge.style.opacity = '0';
      badge.style.transform = 'scale(.7)';
      root.querySelector('.ld__dots').style.opacity = '1';
      for (var i = 0; i < dots.length; i++) {
        var phase = i * (Math.PI * 2 / 3);
        var y = Math.sin(t * BOUNCE_HZ * Math.PI * 2 + phase);
        dots[i].style.transform = 'translateY(' + (y * 7).toFixed(1) + 'px)';
        dots[i].style.opacity = (0.55 + 0.45 * (0.5 + 0.5 * y)).toFixed(2);
      }
      stateEl.textContent = 'Reduced motion: off · moving';
    }
  }

  function togglePause() { paused = !paused; root.classList.toggle('is-paused', paused); }
  function restart() { t0 = performance.now(); draw(0); }
  function onKey(e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePause(); }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restart(); }
  }
  field.addEventListener('click', togglePause);
  field.addEventListener('keydown', onKey);

  function onResize() {
    if (paused || reduced()) draw((performance.now() - t0) / 1000 % LOOP);
  }
  window.addEventListener('resize', onResize);

  function frame(now) {
    if (!paused) draw((now - t0) / 1000);
    raf = requestAnimationFrame(frame);
  }

  if (reduced()) {
    root.classList.add('is-still');
    draw(SWITCH_AT + SPRING_MS);   // 배지가 이미 자리 잡은 정지 프레임
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
