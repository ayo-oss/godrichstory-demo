<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遅延の値に沿ってノードを渡る神経網パルス — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">
    <svg class="ld__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 56v56a8 8 0 0 1-16 0V91.3l-25.6 25.7A80 80 0 1 1 174 60a8 8 0 1 1-9 13.2A64 64 0 1 0 179.7 128H216a8 8 0 0 1 0 16h-56a8 8 0 0 1-8-8V80a8 8 0 0 1 16 0v20.7L192.7 76A80.1 80.1 0 0 0 64 128a8 8 0 0 1-16 0a96 96 0 0 1 163.6-68.3L224 71.3V56a8 8 0 0 1 8 8" opacity=".2"/><path d="M224 48a8 8 0 0 0-8 8v15.3l-11.7-11.6a96 96 0 1 0 27.6 51.6a8 8 0 0 0-15.8 2.5a80 80 0 1 1-23-43l-25.7 25.7A8 8 0 0 0 173 112h56a8 8 0 0 0 8-8V56a8 8 0 0 0-13-8"/></g></svg>
    <span>クリックするかスペースバーを押すと一時停止または再開します</span>
  </p>
  <div class="ld__field" id="field" role="application" aria-label="ニューラルノードパルステストパネル" tabindex="0">
    <canvas class="ld__cv" id="cv"></canvas>
    <b class="ld__badge" aria-hidden="true"><span class="ld__badgeNum" id="pct">0%</span><span class="ld__badgeUnit">伝播</span></b>
  </div>
</div>
</main>
<script>
(function () {
  var LOOP = 2.0;
  var COLS = 4, ROWS = 3;
  var STEP = 0.22;          // 마디 지연(delay) 값 1칸 간격(초)
  var EDGE_MS = 0.34;       // 선 하나가 밝아지는 데 걸리는 시간(초)
  var PULSE_W = 0.30;       // 마디 펄스 폭(초)

  var root = document.getElementById('ld');
  var field = document.getElementById('field');
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var pctEl = document.getElementById('pct');
  var paused = false;
  var t0 = performance.now();
  var raf = 0;
  var W = 0, H = 0, DPR = 1;

  function reduced() { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function seeded(i) { var v = Math.sin(i * 12.9898) * 43758.5453; return v - Math.floor(v); }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  var nodes = [];
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var dist = r + c;                              // 원점에서 이 마디까지 격자 거리
      nodes.push({ r: r, c: c, delay: dist * STEP + seeded(r * COLS + c) * 0.04 });
    }
  }
  function idx(r, c) { return r * COLS + c; }
  var edges = [];
  for (var r2 = 0; r2 < ROWS; r2++) {
    for (var c2 = 0; c2 < COLS; c2++) {
      if (c2 < COLS - 1) edges.push({ a: idx(r2, c2), b: idx(r2, c2 + 1) });
      if (r2 < ROWS - 1) edges.push({ a: idx(r2, c2), b: idx(r2 + 1, c2) });
    }
  }
  for (var e = 0; e < edges.length; e++) {
    var ea = nodes[edges[e].a], eb = nodes[edges[e].b];
    edges[e].delay = Math.min(ea.delay, eb.delay);
  }
  var maxDelay = 0;
  for (var m = 0; m < nodes.length; m++) if (nodes[m].delay > maxDelay) maxDelay = nodes[m].delay;

  function fit() {
    var r = field.getBoundingClientRect();
    DPR = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  function pos(n) {
    var padX = W * 0.14, padY = H * 0.18;
    return {
      x: padX + (W - padX * 2) * (n.c / (COLS - 1)),
      y: padY + (H - padY * 2) * (n.r / (ROWS - 1))
    };
  }

  var cs = getComputedStyle(root);
  var PAPER = cs.getPropertyValue('--paper').trim();
  var LINE_DIM = cs.getPropertyValue('--line-dim').trim();
  var LINE_LIT = cs.getPropertyValue('--line-lit').trim();
  var NODE_DIM = cs.getPropertyValue('--node-dim').trim();
  var NODE_LIT = cs.getPropertyValue('--node-lit').trim();

  function draw(sec) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    var t = sec % LOOP;

    for (var i = 0; i < edges.length; i++) {
      var ed = edges[i];
      var pa = pos(nodes[ed.a]), pb = pos(nodes[ed.b]);
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.strokeStyle = LINE_DIM;
      ctx.lineWidth = 2;
      ctx.stroke();

      var local = t - ed.delay;
      if (local > 0) {
        var frac = clamp01(local / EDGE_MS);
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pa.x + (pb.x - pa.x) * frac, pa.y + (pb.y - pa.y) * frac);
        ctx.strokeStyle = LINE_LIT;
        ctx.lineWidth = 3;
        ctx.stroke();
      }
    }

    for (var j = 0; j < nodes.length; j++) {
      var n = nodes[j];
      var p = pos(n);
      var localN = t - n.delay;
      var glow = 0;
      if (localN >= 0) {
        glow = localN < PULSE_W ? (localN / PULSE_W) : Math.max(0.32, 1 - (localN - PULSE_W) / 0.7);
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5 + glow * 5, 0, Math.PI * 2);
      ctx.fillStyle = glow > 0 ? NODE_LIT : NODE_DIM;
      if (glow > 0) { ctx.shadowColor = NODE_LIT; ctx.shadowBlur = 14 * glow; }
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    var pct = Math.round(clamp01(t / (maxDelay + EDGE_MS)) * 100);
    pctEl.textContent = pct + '%';
  }

  function togglePause() { paused = !paused; root.classList.toggle('is-paused', paused); }
  function restart() { t0 = performance.now(); draw(0); }
  function onKey(ev) {
    if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); togglePause(); }
    else if (ev.key === 'r' || ev.key === 'R') { ev.preventDefault(); restart(); }
  }
  field.addEventListener('click', togglePause);
  field.addEventListener('keydown', onKey);

  function onResize() {
    fit();
    if (paused || reduced()) draw((performance.now() - t0) / 1000);
  }
  window.addEventListener('resize', onResize);

  function frame(now) {
    if (!paused) draw((now - t0) / 1000);
    raf = requestAnimationFrame(frame);
  }

  fit();
  if (reduced()) {
    root.classList.add('is-still');
    draw(LOOP * 0.62);
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
