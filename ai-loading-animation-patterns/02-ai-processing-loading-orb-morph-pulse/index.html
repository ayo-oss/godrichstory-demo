<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대기 시간 값이 늘어날수록 숨쉬듯 커지는 오브 펄스 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ld" id="ld">
  <p class="ld__hint">
    <svg class="ld__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M232 56v56a8 8 0 0 1-16 0V91.3l-25.6 25.7A80 80 0 1 1 174 60a8 8 0 1 1-9 13.2A64 64 0 1 0 179.7 128H216a8 8 0 0 1 0 16h-56a8 8 0 0 1-8-8V80a8 8 0 0 1 16 0v20.7L192.7 76A80.1 80.1 0 0 0 64 128a8 8 0 0 1-16 0a96 96 0 0 1 163.6-68.3L224 71.3V56a8 8 0 0 1 8 8" opacity=".2"/><path d="M224 48a8 8 0 0 0-8 8v15.3l-11.7-11.6a96 96 0 1 0 27.6 51.6a8 8 0 0 0-15.8 2.5a80 80 0 1 1-23-43l-25.7 25.7A8 8 0 0 0 173 112h56a8 8 0 0 0 8-8V56a8 8 0 0 0-13-8"/></g></svg>
    <span>클릭하거나 스페이스바를 누르면 멈추거나 다시 갑니다</span>
  </p>
  <div class="ld__field" id="field" role="application" aria-label="오브 숨쉬기 펄스 실험판" tabindex="0">
    <div class="ld__orb" id="orb"></div>
    <b class="ld__badge" aria-hidden="true"><span class="ld__badgeNum" id="pct">0%</span><span class="ld__badgeUnit">대기</span></b>
  </div>
</div>
</main>
<script>
(function () {
  var LOOP = 2.0;
  var BREATH_HZ = 0.9;       // 숨쉬기 사인 진동수
  var AMP_BASE = 0.10;       // 숨쉬는 폭 시작 값
  var AMP_GROW = 0.09;       // 대기 시간 값이 쌓이며 늘어나는 폭
  var root = document.getElementById('ld');
  var field = document.getElementById('field');
  var orb = document.getElementById('orb');
  var pctEl = document.getElementById('pct');
  var paused = false;
  var t0 = performance.now();
  var raf = 0;

  function reduced() {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }
  function easeSine(t) { return 0.5 - 0.5 * Math.cos(t * Math.PI); }

  function draw(sec) {
    var t = sec % LOOP;
    var accum = Math.min(sec, LOOP) / LOOP;      // 대기 시간 값이 쌓인 정도(0~1)
    var amp = AMP_BASE + AMP_GROW * easeSine(accum);
    var wave = Math.sin(t * Math.PI * 2 * BREATH_HZ);
    var scale = 1 + amp * wave;
    var blur = 12 + 9 * Math.max(0, wave);
    var glow = 0.35 + 0.25 * Math.max(0, wave);

    orb.style.setProperty('--scale', scale.toFixed(4));
    orb.style.setProperty('--blur', blur.toFixed(1) + 'px');
    orb.style.setProperty('--glow', glow.toFixed(3));

    var pct = Math.round((t / LOOP) * 100);
    pctEl.textContent = pct + '%';
  }

  function togglePause() {
    paused = !paused;
    root.classList.toggle('is-paused', paused);
  }
  function restart() { t0 = performance.now(); draw(0); }
  function onKey(e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePause(); }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restart(); }
  }
  field.addEventListener('click', togglePause);
  field.addEventListener('keydown', onKey);

  function onResize() {
    if (paused || reduced()) draw((performance.now() - t0) / 1000);
  }
  window.addEventListener('resize', onResize);

  function frame(now) {
    if (!paused) draw((now - t0) / 1000);
    raf = requestAnimationFrame(frame);
  }

  if (reduced()) {
    root.classList.add('is-still');
    draw(LOOP * 0.62);
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
