<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chip toggle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="chips is-demo">
    <label class="chip">
      <input type="checkbox" class="sr-input" checked>
      <span class="chip__fill" aria-hidden="true"></span>
      <span class="chip__label">무료배송</span>
    </label>
    <label class="chip">
      <input type="checkbox" class="sr-input">
      <span class="chip__fill" aria-hidden="true"></span>
      <span class="chip__label">당일출고</span>
    </label>
    <label class="chip">
      <input type="checkbox" class="sr-input">
      <span class="chip__fill" aria-hidden="true"></span>
      <span class="chip__label">베스트</span>
    </label>
  </div>
</main>
<script>
// .is-demo 데모용 자동 토글. 실제로는 클릭이 :checked 를 바꾼다 (4줄)
document.querySelectorAll('.is-demo .sr-input').forEach(function (el) {
  var t = function () { el.checked = !el.checked; };
  t(); setInterval(t, 600);
});
</script></body>
</html>
