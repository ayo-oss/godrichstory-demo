<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card-select style — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <fieldset class="cards is-demo">
    <legend class="sr-only">プランを選択</legend>
    <label class="card">
      <input type="radio" name="plan" class="sr-input" checked>
      <span class="card__badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7" /></svg></span>
      <span class="card__title">ベーシック</span>
    </label>
    <label class="card">
      <input type="radio" name="plan" class="sr-input">
      <span class="card__badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7" /></svg></span>
      <span class="card__title">プロ</span>
    </label>
    <label class="card">
      <input type="radio" name="plan" class="sr-input">
      <span class="card__badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7" /></svg></span>
      <span class="card__title">チーム</span>
    </label>
  </fieldset>
</main>
<script>
// .is-demo 데모용 자동 순환. 실제로는 클릭이 :checked 를 바꾼다 (6줄)
document.querySelectorAll('.is-demo').forEach(function (grp) {
  var inputs = grp.querySelectorAll('.sr-input'); var i = 0;
  var t = function () { inputs[i % inputs.length].checked = true; i++; };
  t(); setInterval(t, 500);
});
</script></body>
</html>
