<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color swatch pick — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <fieldset class="swatches is-demo">
    <legend class="sr-only">Choose a color</legend>
    <label class="swatch"><input type="radio" name="color" class="sr-input" checked aria-label="Color 1"><span class="swatch__chip swatch__chip--1" aria-hidden="true"></span></label>
    <label class="swatch"><input type="radio" name="color" class="sr-input" aria-label="Color 2"><span class="swatch__chip swatch__chip--2" aria-hidden="true"></span></label>
    <label class="swatch"><input type="radio" name="color" class="sr-input" aria-label="Color 3"><span class="swatch__chip swatch__chip--3" aria-hidden="true"></span></label>
    <label class="swatch"><input type="radio" name="color" class="sr-input" aria-label="Color 4"><span class="swatch__chip swatch__chip--4" aria-hidden="true"></span></label>
  </fieldset>
</main>
<script>
// .is-demo 데모용 자동 순환. 실제로는 클릭이 :checked 를 바꾼다 (6줄)
document.querySelectorAll('.is-demo').forEach(function (grp) {
  var inputs = grp.querySelectorAll('.sr-input'); var i = 0;
  var t = function () { inputs[i % inputs.length].checked = true; i++; };
  t(); setInterval(t, 500);
});
</script></body>
</html>
