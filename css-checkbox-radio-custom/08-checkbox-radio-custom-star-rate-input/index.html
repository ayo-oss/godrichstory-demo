<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star-rate input — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <fieldset class="stars is-demo">
    <legend class="sr-only">평점 선택</legend>
    <input type="radio" id="s5" name="rate" class="sr-input" value="5">
    <label for="s5" class="star" aria-label="5점"><span class="star__icon" aria-hidden="true"></span></label>
    <input type="radio" id="s4" name="rate" class="sr-input" value="4">
    <label for="s4" class="star" aria-label="4점"><span class="star__icon" aria-hidden="true"></span></label>
    <input type="radio" id="s3" name="rate" class="sr-input" value="3" checked>
    <label for="s3" class="star" aria-label="3점"><span class="star__icon" aria-hidden="true"></span></label>
    <input type="radio" id="s2" name="rate" class="sr-input" value="2">
    <label for="s2" class="star" aria-label="2점"><span class="star__icon" aria-hidden="true"></span></label>
    <input type="radio" id="s1" name="rate" class="sr-input" value="1">
    <label for="s1" class="star" aria-label="1점"><span class="star__icon" aria-hidden="true"></span></label>
  </fieldset>
</main>
<script>
// .is-demo 데모용 자동 순환. 실제로는 클릭이 :checked 를 바꾼다 (6줄)
document.querySelectorAll('.is-demo').forEach(function (grp) {
  var inputs = grp.querySelectorAll('.sr-input'); var i = 0;
  var t = function () { inputs[i % inputs.length].checked = true; i++; };
  t(); setInterval(t, 500);
});
</script></body>
</html>
