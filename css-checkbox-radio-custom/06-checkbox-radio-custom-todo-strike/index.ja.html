<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo strikethrough — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <label class="todo is-demo">
    <input type="checkbox" class="sr-input">
    <span class="todo__box" aria-hidden="true">
      <svg viewBox="0 0 24 24" class="todo__svg"><path d="M5 12.5 L10 17.5 L19 7" /></svg>
    </span>
    <span class="todo__text">
      <span class="todo__label">レポート提出</span>
      <span class="todo__strike" aria-hidden="true"></span>
    </span>
  </label>
</main>
<script>
// .is-demo 데모용 자동 토글. 실제로는 클릭이 :checked 를 바꾼다 (4줄)
document.querySelectorAll('.is-demo .sr-input').forEach(function (el) {
  var t = function () { el.checked = !el.checked; };
  t(); setInterval(t, 600);
});
</script></body>
</html>
