<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User avatar dropdown — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="um">
    <button class="um__avatar is-demo" type="button" aria-haspopup="menu" aria-expanded="true" aria-label="アカウントメニュー">
      <span class="um__ring" aria-hidden="true"></span>
      <span class="um__initial" aria-hidden="true">D</span>
    </button>
    <div class="um__menu is-open" role="menu">
      <div class="um__who">
        <strong>ドユン</strong>
        <span>dohyun@studio.app</span>
      </div>
      <button class="um__item" type="button" role="menuitem"><span class="um__ic" aria-hidden="true"></span>プロフィール</button>
      <button class="um__item" type="button" role="menuitem"><span class="um__ic" aria-hidden="true"></span>設定</button>
      <button class="um__item um__item--danger" type="button" role="menuitem"><span class="um__ic" aria-hidden="true"></span>ログアウト</button>
    </div>
  </div>
</main>
<script>
// 실제 동작: 아바타를 누르면 메뉴가 실제로 열리고, 바깥을 클릭하거나 Esc를 누르면 실제로 닫힌다.
var avatar = document.querySelector('.um__avatar');
var menu = document.querySelector('.um__menu');
function close() {
  avatar.setAttribute('aria-expanded', 'false');
  menu.classList.remove('is-open');
}
function open() {
  avatar.setAttribute('aria-expanded', 'true');
  menu.classList.add('is-open');
}
avatar.addEventListener('click', function () {
  avatar.classList.remove('is-demo');
  var expanded = avatar.getAttribute('aria-expanded') === 'true';
  expanded ? close() : open();
});
document.addEventListener('click', function (e) {
  if (!e.target.closest('.um')) close();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') close();
});
</script>
</body>
</html>
