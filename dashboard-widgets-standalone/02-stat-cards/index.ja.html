<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stat card row — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sc" role="group" aria-label="主要指標">
    <div class="sc__head">
      <span class="sc__title">今週</span>
      <div class="sc__switch" role="group" aria-label="期間">
        <button class="sc__period is-active" type="button" data-period="week">週間</button>
        <button class="sc__period" type="button" data-period="month">月間</button>
      </div>
    </div>
    <div class="sc__row">
      <div class="sc__card is-demo">
        <span class="sc__label">訪問者</span>
        <span class="sc__value" data-week="4,210" data-month="16,940">4,210</span>
        <svg class="sc__spark" viewBox="0 0 60 24" aria-hidden="true">
          <path class="sc__spark-path" pathLength="100" d="M2 18 L12 14 L22 16 L32 8 L42 10 L50 4 L58 6" />
        </svg>
      </div>
      <div class="sc__card is-demo">
        <span class="sc__label">コンバージョン率</span>
        <span class="sc__value" data-week="3.2%" data-month="3.6%">3.2%</span>
        <svg class="sc__spark" viewBox="0 0 60 24" aria-hidden="true">
          <path class="sc__spark-path" pathLength="100" d="M2 8 L12 10 L22 6 L32 12 L42 9 L50 14 L58 11" />
        </svg>
      </div>
      <div class="sc__card is-demo">
        <span class="sc__label">売上</span>
        <span class="sc__value" data-week="84.2万円" data-month="₩3,180만">84.2万円</span>
        <svg class="sc__spark" viewBox="0 0 60 24" aria-hidden="true">
          <path class="sc__spark-path" pathLength="100" d="M2 20 L12 16 L22 17 L32 11 L42 7 L50 9 L58 3" />
        </svg>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 週間/月間 버튼을 누르면 세 카드 숫자가 실제로 교체된다(크로스페이드). 첫 클릭에 자동 루프를 멈춘다.
var buttons = document.querySelectorAll('.sc__period');
var cards = document.querySelectorAll('.sc__card');
buttons.forEach(function (b) {
  b.addEventListener('click', function () {
    cards.forEach(function (c) { c.classList.remove('is-demo'); });
    buttons.forEach(function (o) { o.classList.remove('is-active'); });
    b.classList.add('is-active');
    var period = b.dataset.period;
    cards.forEach(function (c) {
      var v = c.querySelector('.sc__value');
      v.classList.add('is-swap');
      setTimeout(function () {
        v.textContent = v.dataset[period];
        v.classList.remove('is-swap');
      }, 140);
    });
  });
});
</script>
</body>
</html>
