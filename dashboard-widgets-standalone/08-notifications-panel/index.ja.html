<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications dropdown panel — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="np">
    <button class="np__bell is-demo" type="button" aria-label="通知" aria-expanded="true">
      <span class="np__bell-ic" aria-hidden="true"></span>
      <span class="np__badge">2</span>
    </button>
    <div class="np__panel is-open" role="menu" aria-label="通知リスト">
      <p class="np__panel-title">通知</p>
      <button class="np__item is-unread" type="button" role="menuitem">
        <span class="np__dot" aria-hidden="true"></span>
        <span class="np__item-body"><strong>新しいコメント</strong><span>パク・ハウンさんがコメントを残しました</span></span>
      </button>
      <button class="np__item is-unread" type="button" role="menuitem">
        <span class="np__dot" aria-hidden="true"></span>
        <span class="np__item-body"><strong>決済完了</strong><span>今月のサブスクが更新されました</span></span>
      </button>
      <button class="np__item" type="button" role="menuitem">
        <span class="np__dot" aria-hidden="true"></span>
        <span class="np__item-body"><strong>チーム招待</strong><span>チョン・ユナさんがチームに参加しました</span></span>
      </button>
    </div>
  </div>
</main>
<script>
// 실제 동작: 종을 누르면 패널이 실제로 열리고, 알림을 누르면 그 항목만 읽음 처리되며 배지 숫자가 실제로 줄어든다.
var bell = document.querySelector('.np__bell');
var panel = document.querySelector('.np__panel');
var badge = document.querySelector('.np__badge');
function unreadCount() { return document.querySelectorAll('.np__item.is-unread').length; }
function syncBadge() {
  var n = unreadCount();
  badge.textContent = String(n);
  badge.style.display = n > 0 ? '' : 'none';
}
bell.addEventListener('click', function () {
  bell.classList.remove('is-demo');
  var open = bell.getAttribute('aria-expanded') === 'true';
  bell.setAttribute('aria-expanded', String(!open));
  panel.classList.toggle('is-open', !open);
});
document.querySelectorAll('.np__item').forEach(function (it) {
  it.addEventListener('click', function () {
    it.classList.remove('is-unread');
    syncBadge();
  });
});
document.addEventListener('click', function (e) {
  if (!e.target.closest('.np')) { bell.setAttribute('aria-expanded', 'false'); panel.classList.remove('is-open'); }
});
syncBadge();
</script>
</body>
</html>
