<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chip filter bar — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="fl">
    <div class="fl__row">
      <button class="fl__chip is-demo" type="button" aria-pressed="false">진행중</button>
      <button class="fl__chip is-demo" type="button" aria-pressed="false">완료</button>
      <button class="fl__chip is-demo" type="button" aria-pressed="false">보류</button>
      <button class="fl__chip is-demo" type="button" aria-pressed="false">긴급</button>
      <button class="fl__clear" type="button" hidden>전체 해제 ✕</button>
    </div>
    <p class="fl__count"><span class="fl__count-num">0</span>개 선택됨</p>
  </div>
</main>
<script>
// 실제 동작: 칩을 누르면 실제로 눌린 상태로 바뀌고 개수가 갱신되며, 하나 이상이면 '전체 해제'가 나타난다.
var chips = document.querySelectorAll('.fl__chip');
var clearBtn = document.querySelector('.fl__clear');
var countEl = document.querySelector('.fl__count-num');
function refresh() {
  var n = document.querySelectorAll('.fl__chip[aria-pressed="true"]').length;
  countEl.textContent = String(n);
  clearBtn.hidden = n === 0;
}
chips.forEach(function (c) {
  c.addEventListener('click', function () {
    c.classList.remove('is-demo');
    var on = c.getAttribute('aria-pressed') === 'true';
    c.setAttribute('aria-pressed', String(!on));
    refresh();
  });
});
clearBtn.addEventListener('click', function () {
  chips.forEach(function (c) { c.setAttribute('aria-pressed', 'false'); });
  refresh();
});
</script>
</body>
</html>
