<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donut chart card — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cc is-demo">
    <div class="cc__ring-wrap">
      <div class="cc__ring" aria-hidden="true"></div>
      <div class="cc__center">
        <span class="cc__num">0</span><span class="cc__unit">%</span>
        <span class="cc__ghost" aria-hidden="true"></span>
      </div>
    </div>
    <ul class="cc__legend">
      <li><button class="cc__legend-btn is-on" type="button" data-seg="a"><span class="cc__dot cc__dot--a" aria-hidden="true"></span>완료 48%</button></li>
      <li><button class="cc__legend-btn is-on" type="button" data-seg="b"><span class="cc__dot cc__dot--b" aria-hidden="true"></span>진행 24%</button></li>
    </ul>
  </div>
</main>
<script>
// 실제 동작: 범례를 누르면 그 구간이 실제로 링에서 빠지고 가운데 합계 숫자가 다시 계산된다.
var card = document.querySelector('.cc');
var ring = document.querySelector('.cc__ring');
var num = document.querySelector('.cc__num');
var segs = { a: 48, b: 24 };
var active = { a: true, b: true };
function paint() {
  var a = active.a ? segs.a : 0;
  var b = active.b ? segs.b : 0;
  ring.style.setProperty('--pct-a', a + '%');
  ring.style.setProperty('--pct-b', (a + b) + '%');
  return a + b;
}
function countTo(target) {
  var from = Number(num.textContent) || 0;
  var start = null;
  function step(ts) {
    if (!start) start = ts;
    var p = Math.min(1, (ts - start) / 300);
    num.textContent = Math.round(from + (target - from) * p);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
document.querySelectorAll('.cc__legend-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    card.classList.remove('is-demo');
    var seg = btn.dataset.seg;
    active[seg] = !active[seg];
    btn.classList.toggle('is-on', active[seg]);
    countTo(paint());
  });
});
</script>
</body>
</html>
