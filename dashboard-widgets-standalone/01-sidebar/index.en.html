<script>
// 실제 동작: 버튼을 누르면 사이드바 폭이 실제로 줄어들고 라벨이 사라진다. 첫 클릭에 자동 루프(is-demo)를 멈춘다.
var nav = document.querySelector('.sd');
var btn = document.querySelector('.sd__toggle');
btn.addEventListener('click', function () {
  nav.classList.remove('is-demo');
  var collapsed = nav.classList.toggle('is-collapsed');
  btn.setAttribute('aria-pressed', String(collapsed));
});
</script>
