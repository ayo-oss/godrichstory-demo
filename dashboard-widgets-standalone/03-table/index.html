<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sortable mini table — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="tb-wrap is-demo">
  <span class="tb__scan" aria-hidden="true"></span>
  <table class="tb">
    <thead>
      <tr>
        <th><button class="tb__sort" type="button" data-key="name" aria-sort="none">이름 <span class="tb__arrow" aria-hidden="true"></span></button></th>
        <th><button class="tb__sort" type="button" data-key="amount" aria-sort="none">금액 <span class="tb__arrow" aria-hidden="true"></span></button></th>
        <th>상태</th>
      </tr>
    </thead>
    <tbody class="tb__body">
      <tr data-name="김도윤" data-amount="128000"><td>김도윤</td><td>₩128,000</td><td><span class="tb__pill tb__pill--ok">완료</span></td></tr>
      <tr data-name="이서준" data-amount="54000"><td>이서준</td><td>₩54,000</td><td><span class="tb__pill tb__pill--wait">대기</span></td></tr>
      <tr data-name="박하은" data-amount="212000"><td>박하은</td><td>₩212,000</td><td><span class="tb__pill tb__pill--ok">완료</span></td></tr>
      <tr data-name="정유나" data-amount="98000"><td>정유나</td><td>₩98,000</td><td><span class="tb__pill tb__pill--err">실패</span></td></tr>
    </tbody>
  </table>
  </div>
</main>
<script>
// 실제 동작: 열 제목을 누르면 행이 실제로 그 값 기준으로 다시 정렬된다(asc/desc 토글).
var wrap = document.querySelector('.tb-wrap');
var tbody = document.querySelector('.tb__body');
var buttons = document.querySelectorAll('.tb__sort');
buttons.forEach(function (btn) {
  var dir = 1;
  btn.addEventListener('click', function () {
    wrap.classList.remove('is-demo');
    buttons.forEach(function (o) { if (o !== btn) o.setAttribute('aria-sort', 'none'); });
    dir = btn.getAttribute('aria-sort') === 'ascending' ? -1 : 1;
    btn.setAttribute('aria-sort', dir === 1 ? 'ascending' : 'descending');
    var key = btn.dataset.key;
    var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
    rows.sort(function (a, b) {
      var av = a.dataset[key], bv = b.dataset[key];
      if (key === 'amount') { av = Number(av); bv = Number(bv); return (av - bv) * dir; }
      return av.localeCompare(bv) * dir;
    });
    rows.forEach(function (r) { tbody.appendChild(r); });
  });
});
</script>
</body>
</html>
