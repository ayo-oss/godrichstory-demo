<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings form section — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <form class="sf" novalidate>
    <h2 class="sf__title">알림</h2>
    <label class="sf__row">
      <span>이메일 알림</span>
      <span class="sf__switch is-demo" role="switch" aria-checked="true" tabindex="0"><span class="sf__knob" aria-hidden="true"></span></span>
    </label>
    <label class="sf__row">
      <span>주간 리포트</span>
      <span class="sf__switch" role="switch" aria-checked="false" tabindex="0"><span class="sf__knob" aria-hidden="true"></span></span>
    </label>
    <button class="sf__save" type="submit">
      <span class="sf__save-label">저장</span>
    </button>
  </form>
</main>
<script>
// 실제 동작: 스위치를 누르면 실제로 켜짐/꺼짐이 바뀌고, 저장을 누르면 버튼이 저장중 → 저장됨으로 실제 상태 전이를 한다.
document.querySelectorAll('.sf__switch').forEach(function (sw) {
  function toggle() {
    sw.classList.remove('is-demo');
    var on = sw.getAttribute('aria-checked') === 'true';
    sw.setAttribute('aria-checked', String(!on));
  }
  sw.addEventListener('click', toggle);
  sw.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
});
var form = document.querySelector('.sf');
var save = document.querySelector('.sf__save');
var label = document.querySelector('.sf__save-label');
form.addEventListener('submit', function (e) {
  e.preventDefault();
  if (save.classList.contains('is-busy')) return;
  save.classList.add('is-busy');
  label.textContent = '저장 중';
  setTimeout(function () {
    save.classList.remove('is-busy');
    save.classList.add('is-done');
    label.textContent = '저장됨';
    setTimeout(function () {
      save.classList.remove('is-done');
      label.textContent = '저장';
    }, 1600);
  }, 700);
});
</script>
</body>
</html>
