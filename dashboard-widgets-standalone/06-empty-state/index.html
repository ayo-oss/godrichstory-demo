<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empty state with add-morph — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="es is-demo">
    <div class="es__stack">
      <div class="es__empty">
        <div class="es__box">
          <span class="es__shape es__shape--a" aria-hidden="true"></span>
          <span class="es__shape es__shape--b" aria-hidden="true"></span>
          <span class="es__shape es__shape--c" aria-hidden="true"></span>
        </div>
        <p class="es__title">아직 항목이 없어요</p>
        <p class="es__desc">첫 항목을 추가하면 여기에 카드로 나타납니다.</p>
      </div>
      <div class="es__item" aria-hidden="true">
        <span class="es__item-dot" aria-hidden="true"></span>
        <div class="es__item-body">
          <strong>새 프로젝트</strong>
          <span>방금 추가됨</span>
        </div>
      </div>
    </div>
    <button class="es__add" type="button">+ 첫 항목 추가</button>
  </div>
</main>
<script>
// 실제 동작: 버튼을 누르면 빈 상태 일러스트가 실제로 카드 한 장으로 바뀐다(되돌리기도 가능).
var wrap = document.querySelector('.es');
var addBtn = document.querySelector('.es__add');
var item = document.querySelector('.es__item');
addBtn.addEventListener('click', function () {
  wrap.classList.remove('is-demo');
  var added = wrap.classList.toggle('is-added');
  item.setAttribute('aria-hidden', String(!added));
  addBtn.textContent = added ? '항목 되돌리기' : '+ 첫 항목 추가';
});
</script>
</body>
</html>
