<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu icon morph — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <button class="iconbtn is-demo" type="button" aria-expanded="false" aria-labelledby="t6">
    <span class="iconbtn__stack">
      <svg class="ic ic--dots" viewBox="0 0 24 24" width="24" height="24">
        <title id="t6">메뉴 열기</title>
        <circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>
      </svg>
      <svg class="ic ic--x" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <svg class="fx" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <circle class="fx__halo" cx="12" cy="12" r="6"/>
        <circle class="fx__spark" r=".9" cx="12" cy="12"/>
        <circle class="fx__bit" r=".5" cx="5" cy="12" style="--dx:-2.6px;--dy:0px"/>
        <circle class="fx__bit" r=".5" cx="12" cy="12" style="--dx:0px;--dy:-2.6px"/>
        <circle class="fx__bit" r=".5" cx="19" cy="12" style="--dx:2.6px;--dy:0px"/>
        <circle class="fx__bit" r=".45" cx="7" cy="7" style="--dx:-2px;--dy:-2px"/>
        <circle class="fx__bit" r=".45" cx="17" cy="17" style="--dx:2px;--dy:2px"/>
        <circle class="fx__bit" r=".45" cx="17" cy="7" style="--dx:2px;--dy:-2px"/>
      </svg>
    </span>
  </button>
</main>
<script>
document.querySelectorAll(".iconbtn").forEach(function (b) {
  var t = b.querySelector("title");
  b.addEventListener("click", function () {
    b.classList.remove("is-demo");
    var open = b.getAttribute("aria-expanded") === "true";
    b.setAttribute("aria-expanded", String(!open));
    t.textContent = open ? "메뉴 열기" : "메뉴 닫기";
  });
});

// ── 한 겹: 전환 순간 링 파동 + 스파크 입자 ─────────────────
// 점↔X 크로스페이드는 짧은 사건(spike)이다 — 01 처럼 펜 끝을 쫓는 대신, 전환 프레임을
// getComputedStyle opacity 실측으로 감지해 그 순간 중앙에서 링(halo)과 입자를 터뜨린다.
(function () {
  var btn = document.querySelector('.iconbtn');
  if (!btn) return;
  var fx = btn.querySelector('.fx');
  if (!fx) return;
  var dots = btn.querySelector('.ic--dots');
  var x = btn.querySelector('.ic--x');
  var halo = fx.querySelector('.fx__halo');
  var spark = fx.querySelector('.fx__spark');
  var bits = [].slice.call(fx.querySelectorAll('.fx__bit'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { fx.style.display = 'none'; return; }
  if (!halo || !spark || !dots || !x) return;

  var prevO = null, prevX = null, lastBurst = 0;
  function burst(t) {
    // 링 파동 — 스타일 재시작으로 다시 퍼진다
    halo.style.animation = 'none';
    void halo.getBoundingClientRect();
    halo.style.animation = '';
    halo.style.animationName = 'halo-ring';
    // 중앙 스파크 점멸
    spark.style.animation = 'none';
    void spark.getBoundingClientRect();
    spark.style.animation = '';
    spark.style.animationName = 'spark-pop';
    // 입자 6개 — 각자 지정된 방향으로 흩어진다
    bits.forEach(function (b, i) {
      b.style.animationDelay = (i % 3) * 18 + 'ms';
      b.style.animation = 'none';
      void b.getBoundingClientRect();
      b.style.animation = '';
      b.style.animationName = 'bit-fly';
    });
    lastBurst = t;
  }
  function frame(t) {
    // 전환 = 두 아이콘 opacity 의 교차. 어느 한쪽이 움직이는 프레임을 실측으로 잡는다
    // (데모 루프의 교차는 500ms 에 걸쳐 일어나 프레임당 Δ≈.03 — 문턱은 그 아래로)
    // 데모 루프의 교차 페이드는 500ms — 문턱을 그보다 길게 잡아 한 전환에 한 번만 터진다
    var od = parseFloat(getComputedStyle(dots).opacity);
    var ox = parseFloat(getComputedStyle(x).opacity);
    if (prevO !== null) {
      var dD = Math.abs(od - prevO), dX = Math.abs(ox - prevX);
      if ((dD > .02 || dX > .02) && t - lastBurst > 700) burst(t);
    }
    prevO = od; prevX = ox;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
