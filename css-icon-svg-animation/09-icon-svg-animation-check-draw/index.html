<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check draw — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <p class="confirm">
    <svg class="confirm__icon" viewBox="0 0 24 24" width="64" height="64" aria-hidden="true">
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/>
      <polyline class="confirm__trail" points="7 12.5 10.5 16 17 8.5" pathLength="100" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline class="confirm__check" points="7 12.5 10.5 16 17 8.5" pathLength="100" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="confirm__spark" r="1" cx="7" cy="12.5"/>
      <circle class="confirm__bit" r=".6" cx="7" cy="12.5" style="--dx:-1.8px;--dy:1.4px"/>
      <circle class="confirm__bit" r=".5" cx="7" cy="12.5" style="--dx:-1.2px;--dy:-1.8px"/>
      <circle class="confirm__bit" r=".5" cx="7" cy="12.5" style="--dx:1.4px;--dy:-1.6px"/>
    </svg>
    저장 완료
  </p>
</main>
<script>
// 체크 드로잉 한 겹 — 그려지는 동안 펜 끝을 추적해 스파크를 옮기고 찌꺼기를 뿌린다.
// getTotalLength 실측 + getPointAtLength 계산. 지워지는 구간(offset<0)은 시작점 쪽 경계를 따른다.
(function () {
  var svg = document.querySelector('.confirm__icon');
  if (!svg) return;
  var check = svg.querySelector('.confirm__check');
  var spark = svg.querySelector('.confirm__spark');
  var bits = [].slice.call(svg.querySelectorAll('.confirm__bit'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !spark || !check.getTotalLength) { if (spark) spark.style.display = 'none'; return; }

  var L = check.getTotalLength();
  var prev = null, lastEmit = 0, emitIdx = 0;
  function frame(t) {
    var off = parseFloat(getComputedStyle(check).strokeDashoffset) || 0;
    var at = off >= 0 ? 100 - off : -off;
    var p = check.getPointAtLength(Math.max(0, Math.min(100, at)) / 100 * L);
    if (prev && (Math.abs(p.x - prev.x) + Math.abs(p.y - prev.y)) > .05) {
      spark.setAttribute('cx', p.x);
      spark.setAttribute('cy', p.y);
      spark.style.opacity = 1;
      if (t - lastEmit > 40) {   // 체크는 짧아서 방출 간격도 짧게
        lastEmit = t;
        var ang = Math.atan2(p.y - prev.y, p.x - prev.x) + Math.PI;
        var sp = .4 + Math.random() * .5;
        var b = bits[emitIdx++ % bits.length];
        b.setAttribute('cx', p.x);
        b.setAttribute('cy', p.y);
        b.style.setProperty('--dx', (Math.cos(ang) * sp * 4).toFixed(2) + 'px');
        b.style.setProperty('--dy', (Math.sin(ang) * sp * 4).toFixed(2) + 'px');
        b.style.animation = 'none';
        void b.getBBox;
        b.style.animation = '';
        b.style.animationName = 'bit-fly';
      }
      prev = p;
    } else {
      if (prev) spark.style.opacity = 0;
      if (!prev) prev = p;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
