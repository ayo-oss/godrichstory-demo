<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heart pulse — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <button class="iconbtn is-demo" type="button" aria-pressed="false" aria-label="Like">
    <span class="iconbtn__stack">
      <svg class="ic ic--outline" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <path d="M12 20.2s-7.3-4.5-9.5-8.9C.9 7.9 2.6 4.6 5.9 4.1c2-.3 3.8.6 4.9 2.2 1-1.6 2.9-2.5 4.9-2.2 3.3.5 5 3.8 3.4 7.2-2.2 4.4-9.1 8.9-9.1 8.9z" fill="none" stroke="currentColor" stroke-width="1.7"/>
      </svg>
      <svg class="ic ic--fill" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <path d="M12 20.2s-7.3-4.5-9.5-8.9C.9 7.9 2.6 4.6 5.9 4.1c2-.3 3.8.6 4.9 2.2 1-1.6 2.9-2.5 4.9-2.2 3.3.5 5 3.8 3.4 7.2-2.2 4.4-9.1 8.9-9.1 8.9z"/>
      </svg>
      <svg class="fx" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <circle class="fx__spark" r=".9" cx="12" cy="12"/>
        <circle class="fx__bit" r=".5" cx="12" cy="6" style="--dx:0px;--dy:-2.6px"/>
        <circle class="fx__bit" r=".5" cx="12" cy="6" style="--dx:2.4px;--dy:-1.2px"/>
        <circle class="fx__bit" r=".5" cx="12" cy="6" style="--dx:-2.4px;--dy:-1.2px"/>
        <circle class="fx__bit" r=".45" cx="4" cy="8" style="--dx:-2.6px;--dy:-1px"/>
        <circle class="fx__bit" r=".45" cx="20" cy="8" style="--dx:2.6px;--dy:-1px"/>
        <circle class="fx__bit" r=".45" cx="12" cy="20" style="--dx:0px;--dy:2.6px"/>
      </svg>
    </span>
  </button>
</main>
<script>
document.querySelectorAll(".iconbtn").forEach(function (b) {
  b.addEventListener("click", function () {
    b.classList.remove("is-demo");
    var on = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", String(!on));
  });
});

// ── 한 겹: 하트 채워지는 순간 가장자리 입자 폭발 + 중앙 스파크 ──────
// 펄스는 짧은 사건이다 — 01 처럼 펜 끝을 쫓는 대신, '채움 하트가 나타나는 프레임'을
// getComputedStyle opacity 실측으로 감지해 그 순간 하트 가장자리에서 입자를 터뜨린다.
// 입자 좌표는 fill 하트 path 를 getTotalLength/getPointAtLength 로 6 점 샘플링해 얻고,
// 방향은 도심(12,12)에서 바깥으로 — 하트가 '탁' 차오르는 물성을 흉내 낸다.
(function () {
  var btn = document.querySelector('.iconbtn');
  if (!btn) return;
  var fx = btn.querySelector('.fx');
  var fill = btn.querySelector('.ic--fill path');
  if (!fx || !fill || !fill.getTotalLength) return;
  var spark = fx.querySelector('.fx__spark');
  var bits = [].slice.call(fx.querySelectorAll('.fx__bit'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !spark) { fx.style.display = 'none'; return; }

  var L = fill.getTotalLength();
  var CX = 12, CY = 12;
  // 입자 하나를 하트 가장자리 임의 점에 재배치하고 바깥 방향으로 흩어지게 한다
  function seed(b) {
    var p = fill.getPointAtLength(Math.random() * L);
    b.setAttribute('cx', p.x);
    b.setAttribute('cy', p.y);
    var dx = p.x - CX, dy = p.y - CY;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var sp = .45 + Math.random() * .55;
    b.style.setProperty('--dx', (dx / len * sp * 6.5).toFixed(2) + 'px');
    b.style.setProperty('--dy', (dy / len * sp * 6.5).toFixed(2) + 'px');
    b.style.animation = 'none';
    void b.getBoundingClientRect();
    b.style.animation = '';
    b.style.animationName = 'bit-fly';
  }
  function burst() {
    spark.style.animation = 'none';
    void spark.getBoundingClientRect();
    spark.style.animation = '';
    spark.style.animationName = 'spark-pop';
    bits.forEach(function (b) { seed(b); });
  }

  var prevO = null, lastBurst = 0;
  function frame(t) {
    // 채움 하트가 나타나는 프레임 = opacity 가 0→1 로 오르는 중.
    // 데모 루프의 상승 구간은 500ms — 문턱을 그보다 길게 잡아 한 번만 터진다
    var o = parseFloat(getComputedStyle(fill.closest('.ic--fill')).opacity);
    if (prevO !== null && o - prevO > .02 && t - lastBurst > 600) {
      lastBurst = t;
      burst();
    }
    prevO = o;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
