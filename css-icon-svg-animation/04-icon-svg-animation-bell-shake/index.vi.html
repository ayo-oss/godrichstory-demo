<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bell shake — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <button class="iconbtn is-demo" type="button" aria-label="3 thông báo">
    <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
      <g class="bell">
        <path d="M12 3a5 5 0 0 0-5 5v3.2c0 1-.4 2-1.1 2.7L4 16h16l-1.9-2.1c-.7-.7-1.1-1.7-1.1-2.7V8a5 5 0 0 0-5-5z"/>
        <path class="bell__clap" d="M9.5 19a2.5 2.5 0 0 0 5 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </g>
      <circle class="badge-dot" cx="18.5" cy="5.5" r="3"/>
      <g class="ring">
        <path class="ring__orbit" pathLength="100" fill="none" d="M4 16h16"/>
        <circle class="ring__spark" r=".9" cx="4" cy="16"/>
        <circle class="ring__bit" r=".4" cx="4" cy="16" style="--dx:0px;--dy:-2.2px"/>
        <circle class="ring__bit" r=".35" cx="4" cy="16" style="--dx:2px;--dy:0px"/>
        <circle class="ring__bit" r=".35" cx="4" cy="16" style="--dx:-2px;--dy:0px"/>
      </g>
    </svg>
  </button>
</main>
<script>
// 벨 흔들림 한 겹 — 종이 흔들리는 동안 밑단(받침 라인)을 따라 스파크가 좌우로 내닫는다.
// 01 과 같은 원리(getPointAtLength 좌표 계산)지만 타이밍은 하드코딩하지 않는다:
// 종의 실제 회전각(getComputedStyle transform 행렬)을 매 프레임 읽어
// 회전각 ±8° 를 받침 라인 0..1 진행도로 사상한다 — CSS 애니메이션과 물리적으로 동기.
(function () {
  var btn = document.querySelector('.iconbtn');
  if (!btn) return;
  var bell = btn.querySelector('.bell');
  var orbit = btn.querySelector('.ring__orbit');
  var spark = btn.querySelector('.ring__spark');
  var bits = [].slice.call(btn.querySelectorAll('.ring__bit'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !bell || !orbit || !spark || !orbit.getTotalLength) return;

  var L = orbit.getTotalLength();
  var prevA = null, prevP = null, lastEmit = 0, emitIdx = 0;
  function angle() {   // 종의 현재 회전각(도) — transform 이 none 이면 0
    var tr = getComputedStyle(bell).transform;
    if (!tr || tr === 'none') return 0;
    var m = tr.match(/matrix\(([^)]+)\)/);
    if (!m) return 0;
    var v = m[1].split(',').map(parseFloat);
    return Math.atan2(v[1], v[0]) * 180 / Math.PI;
  }
  function frame(t) {
    var a = angle();
    if (prevA !== null) {
      if (Math.abs(a - prevA) > .05) {          // 종이 움직이는 동안만
        orbit.style.opacity = '.4';             // 잔상 켬 (transition 이 부드럽게)
        var u = Math.max(0, Math.min(1, .5 + a / 16));   // ±8° → 0..1
        var p = orbit.getPointAtLength(u * L);
        spark.setAttribute('cx', p.x);
        spark.setAttribute('cy', p.y);
        spark.style.opacity = 1;
        if (prevP && (Math.abs(p.x - prevP.x) + Math.abs(p.y - prevP.y)) > .01 && t - lastEmit > 55) {
          lastEmit = t;
          var ang = Math.atan2(p.y - prevP.y, p.x - prevP.x) + Math.PI;  // 진행 반대 = 잔상 쪽
          var sp = .35 + Math.random() * .45;
          var b = bits[emitIdx++ % bits.length];
          b.setAttribute('cx', p.x);
          b.setAttribute('cy', p.y);
          b.style.setProperty('--dx', (Math.cos(ang) * sp * 5).toFixed(2) + 'px');
          b.style.setProperty('--dy', (Math.sin(ang) * sp * 5).toFixed(2) + 'px');
          b.style.animation = 'none';
          void b.getBoundingClientRect();
          b.style.animation = '';
          b.style.animationName = 'bit-fly';
        }
        prevP = p;
      } else {                                   // 멈춤 — 스파크·잔상 끔
        spark.style.opacity = 0;
        orbit.style.opacity = '';
        prevP = null;
      }
    }
    prevA = a;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
