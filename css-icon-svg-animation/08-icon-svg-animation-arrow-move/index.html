<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrow move — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <p class="cue">
    더 보기
    <span class="cue__wrap">
      <svg class="cue__arrow" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg class="cue__fx" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path class="cue__trail" d="M6 9l6 6 6-6" pathLength="100" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="cue__spark" r="1" cx="18" cy="9"/>
        <circle class="cue__bit" r=".5" cx="18" cy="9" style="--dx:2.4px;--dy:-1.4px"/>
        <circle class="cue__bit" r=".45" cx="18" cy="9" style="--dx:1.8px;--dy:.8px"/>
        <circle class="cue__bit" r=".45" cx="18" cy="9" style="--dx:2.6px;--dy:-.4px"/>
        <circle class="cue__bit" r=".45" cx="18" cy="9" style="--dx:1.2px;--dy:1.8px"/>
      </svg>
    </span>
  </p>
</main>
<script>
// 화살표 이동 한 겹 — bob 애니메이션의 현재 위치를 getComputedStyle transform 실측으로
// 읽어(01 과 같은 원리: 타이밍 하드코딩 없음) 화살표 끝점을 따라다니는 스파크 + 진행 반대
// 방향으로 튀는 찌꺼기 + 이동이 끝난 뒤 잠깐 남는 미광 잔상.
(function () {
  var arrow = document.querySelector('.cue__arrow');
  var fx = document.querySelector('.cue__fx');
  if (!arrow || !fx) return;
  var spark = fx.querySelector('.cue__spark');
  var trail = fx.querySelector('.cue__trail');
  var bits = [].slice.call(fx.querySelectorAll('.cue__bit'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !spark) { fx.style.display = 'none'; return; }

  // 화살표 경로 — 꼭짓점(12,15)이 아니라 '펜 끝'(18,9)을 추적한다
  var END = { x: 18, y: 9 };
  // bob 과 같은 리듬으로 잔상이 차오랐다 비운다 — 그려진 길이를 transform 위치에서 역산
  var prev = null, lastEmit = 0, emitIdx = 0;

  function arrowY() {
    // translateY 실측(px) → 0..1 진행도. bob 은 8px ($sp-2) 오간다
    var m = /matrix\(([^)]+)\)/.exec(getComputedStyle(arrow).transform);
    if (!m) return 0;
    var dy = parseFloat(m[1].split(', ')[5]) || 0;
    return Math.max(0, Math.min(1, dy / 8));
  }

  function frame(t) {
    var prog = arrowY();
    // 잔상 — 아래로 이동 중(그리기) 차오르고 올라가는 동안 비운다. 진행도 그대로 dashoffset
    if (prev !== null) {
      var dirDown = prog >= prev;
      var off = dirDown ? 100 - prog * 100 : -(prog * 100);
      trail.style.strokeDashoffset = off.toFixed(2);
      trail.style.opacity = dirDown ? .45 : (1 - prog) * .45;
    }

    // 스파크 — 화살표 끝점이 이동 중일 때만 켠다
    var p = { x: END.x, y: END.y + prog * 8 };
    if (prev !== null && Math.abs(prog - prev) > .004) {
      spark.setAttribute('cx', p.x);
      spark.setAttribute('cy', p.y);
      spark.style.opacity = 1;
      if (t - lastEmit > 60) {
        lastEmit = t;
        // 진행 반대(이동 방향 뒤쪽)로 찌꺼기 — 수직 이동이라 각도는 위/아래로 갈린다
        var ang = (prog > prev ? Math.PI / 2 : -Math.PI / 2) + (Math.random() - .5) * 1.2 + Math.PI;
        var sp = .4 + Math.random() * .5;
        var b = bits[emitIdx++ % bits.length];
        b.setAttribute('cx', p.x);
        b.setAttribute('cy', p.y);
        b.style.setProperty('--dx', (Math.cos(ang) * sp * 5).toFixed(2) + 'px');
        b.style.setProperty('--dy', (Math.sin(ang) * sp * 5).toFixed(2) + 'px');
        b.style.animation = 'none';
        void b.getBoundingClientRect();
        b.style.animation = '';
        b.style.animationName = 'bit-fly';
      }
      prev = prog;
    } else {
      if (prev !== null && Math.abs(prog - prev) < .0005) spark.style.opacity = 0;
      if (prev === null) prev = prog;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
