<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo reveal — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <p class="mark">
    <svg viewBox="0 0 24 24" width="56" height="56" aria-hidden="true">
      <path class="mark__fill" d="M12 3L21 12L12 21L3 12Z"/>
      <path class="mark__trail" pathLength="100" d="M12 3L21 12L12 21L3 12Z"/>
      <path class="mark__line" pathLength="100" d="M12 3L21 12L12 21L3 12Z"/>
      <circle class="mark__spark" r="1" cx="12" cy="3"/>
      <circle class="mark__bit" r=".5" cx="12" cy="3" style="--dx:0px;--dy:-2.4px"/>
      <circle class="mark__bit" r=".45" cx="12" cy="3" style="--dx:2px;--dy:0px"/>
      <circle class="mark__bit" r=".45" cx="12" cy="3" style="--dx:-2px;--dy:0px"/>
    </svg>
    GODRICH
  </p>
</main>
<script>
// 로고 리빌 한 겹 — 선 그리기 단계(0~55%)에서만 펜 끝을 추적해 스파크를 옮기고 찌꺼기를 뿌린다.
// 계산 방식은 01 과 같다: getTotalLength 로 실측한 경로 위를 getPointAtLength 로 훑는다.
(function () {
  var svg = document.querySelector('.mark svg');
  if (!svg) return;
  var line = svg.querySelector('.mark__line');
  var spark = svg.querySelector('.mark__spark');
  var bits = [].slice.call(svg.querySelectorAll('.mark__bit'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !spark || !line.getTotalLength) { if (spark) spark.style.display = 'none'; return; }

  var L = line.getTotalLength();
  var prev = null, lastEmit = 0, emitIdx = 0;
  function frame(t) {
    var off = parseFloat(getComputedStyle(line).strokeDashoffset) || 0;
    var at = Math.max(0, Math.min(100, 100 - off));
    var p = line.getPointAtLength(at / 100 * L);
    if (prev && (Math.abs(p.x - prev.x) + Math.abs(p.y - prev.y)) > .05) {
      spark.setAttribute('cx', p.x);
      spark.setAttribute('cy', p.y);
      spark.style.opacity = 1;
      if (t - lastEmit > 60) {
        lastEmit = t;
        var ang = Math.atan2(p.y - prev.y, p.x - prev.x) + Math.PI;
        var sp = .4 + Math.random() * .5;
        var b = bits[emitIdx++ % bits.length];
        b.setAttribute('cx', p.x);
        b.setAttribute('cy', p.y);
        b.style.setProperty('--dx', (Math.cos(ang) * sp * 5).toFixed(2) + 'px');
        b.style.setProperty('--dy', (Math.sin(ang) * sp * 5).toFixed(2) + 'px');
        b.style.animation = 'none';
        void b.getBBox;
        b.style.animation = '';
        b.style.animationName = 'bit-fly';
      }
      prev = p;
    } else {
      if (prev) spark.style.opacity = 0;
      if (!prev) prev = p;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
