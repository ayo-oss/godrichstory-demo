<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empty cart that rolls in — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ct is-demo" aria-labelledby="ct-t">
    <div class="ct__track">
      <span class="ct__cart" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em"><g fill="currentColor"><path d="m232 72l-25.63 92.28A16 16 0 0 1 191 176H92.16a16 16 0 0 1-15.41-11.72L51.11 72Z" opacity=".2"/><path d="M104 216a16 16 0 1 1-16-16a16 16 0 0 1 16 16m88-16a16 16 0 1 0 16 16a16 16 0 0 0-16-16m47.71-125.86l-25.64 92.28A24.06 24.06 0 0 1 191 184H92.16A24.06 24.06 0 0 1 69 166.42L33.92 40H16a8 8 0 0 1 0-16h24a8 8 0 0 1 7.71 5.86L57.19 64H232a8 8 0 0 1 7.71 10.14M221.47 80H61.64l22.81 82.14a8 8 0 0 0 7.71 5.86H191a8 8 0 0 0 7.71-5.86Z"/></g></svg></span>
    </div>
    <h2 class="ct__title" id="ct-t">장바구니가 비었습니다</h2>
    <p class="ct__sub" id="ct-s" data-fmt="담은 상품 {n}개 · {won}원" aria-live="polite">담은 상품 0개 · 0원</p>
    <button class="ct__btn" type="button" id="ct-b" data-more="하나 더 담기">쇼핑 계속하기</button>
  </section>
</main>
<script>
// 실제 동작: 버튼을 누를 때마다 상품 하나가 실제로 담기고 합계가 다시 계산된다.
var card = document.querySelector('.ct');
var btn = document.getElementById('ct-b');
var sub = document.getElementById('ct-s');
var items = 0;
btn.addEventListener('click', function () {
  card.classList.remove('is-demo');
  items += 1;
  card.classList.toggle('is-filled', items > 0);
  sub.textContent = sub.dataset.fmt.replace('{n}', items).replace('{won}', (items * 12000).toLocaleString());
  btn.textContent = btn.dataset.more;
});
</script>
</body>
</html>
