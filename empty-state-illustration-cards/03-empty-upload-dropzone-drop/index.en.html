<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashed dropzone with a falling file — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="dz is-demo">
    <div class="dz__zone" id="dz-zone" role="button" tabindex="0" aria-describedby="dz-msg">
      <span class="dz__file" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em"><g fill="currentColor"><path d="M208 88h-56V32Z" opacity=".2"/><path d="m213.66 82.34l-56-56A8 8 0 0 0 152 24H56a16 16 0 0 0-16 16v176a16 16 0 0 0 16 16h144a16 16 0 0 0 16-16V88a8 8 0 0 0-2.34-5.66M160 51.31L188.69 80H160ZM200 216H56V40h88v48a8 8 0 0 0 8 8h48zm-32-80a8 8 0 0 1-8 8H96a8 8 0 0 1 0-16h64a8 8 0 0 1 8 8m0 32a8 8 0 0 1-8 8H96a8 8 0 0 1 0-16h64a8 8 0 0 1 8 8"/></g></svg></span>
      <span class="dz__cloud" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em"><g fill="currentColor"><path d="M240 128a80 80 0 0 1-80 80H72A56 56 0 1 1 85.92 97.74v.1A80 80 0 0 1 240 128" opacity=".2"/><path d="M178.34 165.66L160 147.31V208a8 8 0 0 1-16 0v-60.69l-18.34 18.35a8 8 0 0 1-11.32-11.32l32-32a8 8 0 0 1 11.32 0l32 32a8 8 0 0 1-11.32 11.32M160 40a88.08 88.08 0 0 0-78.71 48.68A64 64 0 1 0 72 216h40a8 8 0 0 0 0-16H72a48 48 0 0 1 0-96c1.1 0 2.2 0 3.29.12A88 88 0 0 0 72 128a8 8 0 0 0 16 0a72 72 0 1 1 100.8 66a8 8 0 0 0 3.2 15.34a7.9 7.9 0 0 0 3.2-.68A88 88 0 0 0 160 40"/></g></svg></span>
    </div>
    <p class="dz__msg" id="dz-msg" data-got="Got {f}" aria-live="polite">Drop a file here, or click to choose one</p>
    <input class="dz__input" id="dz-input" type="file" hidden>
  </section>
</main>
<script>
// 실제 동작: 끌어다 놓기와 누르기 둘 다 받는다. 파일이 들어오면 이름이 안내 줄을 대신한다.
var card = document.querySelector('.dz');
var zone = document.getElementById('dz-zone');
var input = document.getElementById('dz-input');
var msg = document.getElementById('dz-msg');
var IDLE = msg.textContent;
function took(name) {
  card.classList.remove('is-demo');
  zone.classList.remove('is-over');
  msg.textContent = name ? msg.dataset.got.replace('{f}', name) : IDLE;
}
zone.addEventListener('click', function () { input.click(); });
zone.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.key === ' ') { input.click(); e.preventDefault(); }
});
zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('is-over'); });
zone.addEventListener('dragleave', function () { zone.classList.remove('is-over'); });
zone.addEventListener('drop', function (e) {
  e.preventDefault();
  took(e.dataTransfer && e.dataTransfer.files[0] ? e.dataTransfer.files[0].name : '');
});
input.addEventListener('change', function () { took(input.files[0] ? input.files[0].name : ''); });
</script>
</body>
</html>
