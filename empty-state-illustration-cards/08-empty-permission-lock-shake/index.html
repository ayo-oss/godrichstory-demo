<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permission lock with a padlock that bounces once — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="pm is-demo">
    <div class="pm__panel">
      <ul class="pm__rows" aria-hidden="true">
        <li class="pm__row"></li>
        <li class="pm__row"></li>
        <li class="pm__row"></li>
      </ul>
      <div class="pm__gate">
        <span class="pm__lock" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em"><g fill="currentColor"><path d="M208 88H48a8 8 0 0 0-8 8v112a8 8 0 0 0 8 8h160a8 8 0 0 0 8-8V96a8 8 0 0 0-8-8m-80 72a20 20 0 1 1 20-20a20 20 0 0 1-20 20" opacity=".2"/><path d="M208 80h-32V56a48 48 0 0 0-96 0v24H48a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V96a16 16 0 0 0-16-16M96 56a32 32 0 0 1 64 0v24H96Zm112 152H48V96h160zm-80-96a28 28 0 0 0-8 54.83V184a8 8 0 0 0 16 0v-17.17a28 28 0 0 0-8-54.83m0 40a12 12 0 1 1 12-12a12 12 0 0 1-12 12"/></g></svg></span>
        <p class="pm__msg" id="pm-msg" data-wait="관리자 승인을 기다리는 중" aria-live="polite">볼 권한이 없습니다</p>
      </div>
    </div>
    <button class="pm__btn" type="button" id="pm-b" data-sent="요청을 보냈습니다">접근 권한 요청</button>
  </section>
</main>
<script>
// 실제 동작: 요청을 보내면 버튼이 잠기고 안내 줄이 대기 상태로 바뀐다. 한 번 더 누를 수 없다.
var card = document.querySelector('.pm');
var btn = document.getElementById('pm-b');
var msg = document.getElementById('pm-msg');
btn.addEventListener('click', function () {
  card.classList.remove('is-demo');
  btn.disabled = true;
  btn.textContent = btn.dataset.sent;
  msg.textContent = msg.dataset.wait;
  card.classList.add('is-asked');
});
</script>
</body>
</html>
