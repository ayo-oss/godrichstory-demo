<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweeping no-results lens — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="sw is-demo">
    <label class="sw__label" for="sw-q">ドキュメント検索</label>
    <input class="sw__input" id="sw-q" type="search" value="返品規定" autocomplete="off">
    <div class="sw__panel">
      <ul class="sw__rows" id="sw-rows">
        <li class="sw__row" data-name="配送ポリシー">配送ポリシー</li>
        <li class="sw__row" data-name="交換のご案内">交換のご案内</li>
        <li class="sw__row" data-name="支払い方法">支払い方法</li>
      </ul>
      <div class="sw__empty" id="sw-empty">
        <span class="sw__lens" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em"><g fill="currentColor"><path d="M192 112a80 80 0 1 1-80-80a80 80 0 0 1 80 80" opacity=".2"/><path d="m229.66 218.34l-50.06-50.06a88.21 88.21 0 1 0-11.32 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></g></svg></span>
        <p class="sw__msg" id="sw-msg" data-hit="{q} に一致する文書がありません" aria-live="polite">該当する文書がありません</p>
      </div>
    </div>
  </section>
</main>
<script>
// 실제 동작: 입력한 글자로 세 줄을 거른다. 남는 줄이 없으면 빈 상태 카드가 대신 나온다.
var card = document.querySelector('.sw');
var q = document.getElementById('sw-q');
var rows = [].slice.call(document.querySelectorAll('.sw__row'));
var empty = document.getElementById('sw-empty');
var msg = document.getElementById('sw-msg');
var NONE = msg.textContent;
function render() {
  var v = q.value.trim();
  var hit = 0;
  rows.forEach(function (r) {
    var on = !v || r.dataset.name.indexOf(v) >= 0;
    r.hidden = !on;
    if (on) hit += 1;
  });
  empty.hidden = hit > 0;
  msg.textContent = v ? msg.dataset.hit.replace('{q}', v) : NONE;
}
q.addEventListener('input', function () { card.classList.remove('is-demo'); render(); });
render();
</script>
</body>
</html>
