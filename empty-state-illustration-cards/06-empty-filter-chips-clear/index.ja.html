<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filter chips clearing one by one — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="fc is-demo">
    <ul class="fc__chips" id="fc-chips">
      <li><button class="fc__chip" type="button" data-chip="1">送料無料<span class="fc__x" aria-hidden="true">×</span><span class="fc__sr">フィルタを外す</span></button></li>
      <li><button class="fc__chip" type="button" data-chip="2">5万ウォン以下<span class="fc__x" aria-hidden="true">×</span><span class="fc__sr">フィルタを外す</span></button></li>
      <li><button class="fc__chip" type="button" data-chip="3">当日出荷<span class="fc__x" aria-hidden="true">×</span><span class="fc__sr">フィルタを外す</span></button></li>
    </ul>
    <div class="fc__panel">
      <ul class="fc__rows" id="fc-rows" hidden>
        <li class="fc__row">キャンドルホルダー</li>
        <li class="fc__row">リネンカーテン</li>
        <li class="fc__row">木製トレー</li>
      </ul>
      <div class="fc__empty" id="fc-empty">
        <span class="fc__icon" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em"><g fill="currentColor"><path d="M221.9 61.38L152 136v58.65a8 8 0 0 1-3.56 6.66l-32 21.33A8 8 0 0 1 104 216v-80L34.1 61.38A8 8 0 0 1 40 48h176a8 8 0 0 1 5.9 13.38" opacity=".2"/><path d="M230.6 49.53A15.81 15.81 0 0 0 216 40H40a16 16 0 0 0-11.81 26.76l.08.09L96 139.17V216a16 16 0 0 0 24.87 13.32l32-21.34a16 16 0 0 0 7.13-13.32v-55.49l67.74-72.32l.08-.09a15.8 15.8 0 0 0 2.78-17.23m-84.42 81.05A8 8 0 0 0 144 136v58.66L112 216v-80a8 8 0 0 0-2.16-5.47L40 56h176Z"/></g></svg></span>
        <p class="fc__msg" id="fc-msg" data-fmt="条件{n}件・該当商品0件" aria-live="polite">条件に合う商品0件</p>
        <button class="fc__clear" type="button" id="fc-clear">フィルタを消す</button>
      </div>
    </div>
  </section>
</main>
<script>
// 실제 동작: 칩의 x 로 조건을 하나씩 뗀다. 셋 다 떼면 목록이 돌아오고, 남아 있으면 0건 카드가 나온다.
var card = document.querySelector('.fc');
var chips = [].slice.call(document.querySelectorAll('.fc__chip'));
var rows = document.getElementById('fc-rows');
var empty = document.getElementById('fc-empty');
var msg = document.getElementById('fc-msg');
var clear = document.getElementById('fc-clear');
function paint() {
  var left = chips.filter(function (c) { return !c.parentElement.hidden; }).length;
  rows.hidden = left > 0;
  empty.hidden = left === 0;
  msg.textContent = msg.dataset.fmt.replace('{n}', left);
}
chips.forEach(function (c) {
  c.addEventListener('click', function () {
    card.classList.remove('is-demo');
    c.parentElement.hidden = true;
    paint();
  });
});
clear.addEventListener('click', function () {
  card.classList.remove('is-demo');
  chips.forEach(function (c) { c.parentElement.hidden = false; });
  paint();
});
</script>
</body>
</html>
