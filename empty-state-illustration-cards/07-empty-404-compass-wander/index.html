<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 card with a wandering needle — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="nf is-demo" aria-labelledby="nf-t">
    <span class="nf__icon" aria-hidden="true"><svg viewBox="0 0 256 256" width="1em" height="1em"><g fill="currentColor"><path d="M128 32a96 96 0 1 0 96 96a96 96 0 0 0-96-96m16 112l-64 32l32-64l64-32Z" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88m44.42-143.16l-64 32a8.05 8.05 0 0 0-3.58 3.58l-32 64A8 8 0 0 0 80 184a8.1 8.1 0 0 0 3.58-.84l64-32a8.05 8.05 0 0 0 3.58-3.58l32-64a8 8 0 0 0-10.74-10.74M138 138l-40.11 20.11L118 118l40.15-20.07Z"/></g></svg></span>
    <h2 class="nf__title" id="nf-t">여기엔 아무것도 없습니다</h2>
    <ol class="nf__path" id="nf-path" aria-live="polite">
      <li class="nf__seg">홈</li>
      <li class="nf__seg">자료실</li>
      <li class="nf__seg is-gone">?</li>
    </ol>
    <button class="nf__btn" type="button" id="nf-b" data-home="여기가 홈입니다">한 단계 위로</button>
  </section>
</main>
<script>
// 실제 동작: 한 단계 위로를 누를 때마다 주소 조각이 실제로 하나씩 지워지고, 홈만 남으면 버튼이 잠긴다.
var card = document.querySelector('.nf');
var path = document.getElementById('nf-path');
var btn = document.getElementById('nf-b');
btn.addEventListener('click', function () {
  card.classList.remove('is-demo');
  var segs = [].slice.call(path.querySelectorAll('.nf__seg'));
  if (segs.length > 1) path.removeChild(segs[segs.length - 1]);
  if (path.querySelectorAll('.nf__seg').length <= 1) {
    btn.disabled = true;
    btn.textContent = btn.dataset.home;
  }
});
</script>
</body>
</html>
