<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글자 이미지가 열마다 사인파로 밀려 휘어 보이는 왜곡 글자판 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="cp is-demo" id="cp">
  <canvas class="cp__canvas" data-role="canvas" width="480" height="300" tabindex="0" aria-label="글자 이미지가 열마다 사인파로 밀려 휘어 보이는 왜곡 글자판"></canvas>
  <p class="cp__status" data-role="status" aria-live="polite">시연 준비 중</p>
  <button class="cp__btn" data-role="btn" type="button">멈춤</button>
</div>
</main>
<script>
(function () {
    const root = document.getElementById("cp");
    if (!root)
        return;
    const W = 480;
    const H = 300;
    const PI2 = Math.PI * 2;
    const FIXED_DT = 16;
    const IDLE_TICKS = 150;
    const BTN_PAUSE = '멈춤';
    const BTN_PLAY = '재생';
    const BTN_NEXT = '다음 장면';
    // 파스텔 팔레트 - 어두운 판 위에 밝은 색을 얹어 명도 차로 읽힌다
    const BG = [29, 26, 44];
    const PANEL = [44, 40, 68];
    const MINT = [126, 226, 192];
    const SKY = [124, 196, 255];
    const LILAC = [190, 164, 255];
    const PINK = [255, 160, 190];
    const PEACH = [255, 208, 168];
    const CREAM = [255, 244, 224];
    const CHARSET = 'ABCDEFGHJKLMNPQRSTUVWXYZabdefghmnqrt23456789';
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    function smooth(x) { const c = clamp(x, 0, 1); return c * c * (3 - 2 * c); }
    function easeOutBack(x) { const c = clamp(x, 0, 1) - 1; return 1 + c * c * (2.7 * c + 1.7); }
    function rgba(c, a) {
        return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
    }
    function mix(a, b, k) {
        return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
    }
    // 시드 고정 난수 - 같은 시드면 언제나 같은 수열 (선형 합동 방식)
    function lcg(seed) {
        let s = seed >>> 0;
        return function () {
            s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }
    // 정수 두 개와 시드로 0 이상 1 미만의 값을 만드는 해시 (같은 입력은 늘 같은 값)
    function hash2(x, y, seed) {
        let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(seed | 0, 1442695041)) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
    }
    // 시드로 뜻 없는 글자열을 만든다
    function glyphStr(seed, n) {
        const r = lcg(seed * 7919 + 13);
        let s = '';
        for (let i = 0; i < n; i += 1) {
            s += CHARSET.charAt(Math.floor(r() * CHARSET.length));
        }
        return s;
    }
    function rrect(ctx, x, y, w, h, r) {
        const rr = Math.max(0, Math.min(r, w / 2, h / 2));
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.arcTo(x + w, y, x + w, y + rr, rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
        ctx.lineTo(x + rr, y + h);
        ctx.arcTo(x, y + h, x, y + h - rr, rr);
        ctx.lineTo(x, y + rr);
        ctx.arcTo(x, y, x + rr, y, rr);
        ctx.closePath();
    }
    function mount(root, make) {
        const canvas = root.querySelector('[data-role="canvas"]');
        const statusEl = root.querySelector('[data-role="status"]');
        const btnEl = root.querySelector('[data-role="btn"]');
        if (!canvas || !statusEl || !btnEl) {
            return function () { return; };
        }
        const ctx = canvas.getContext('2d');
        if (!ctx) {
            return function () { return; };
        }
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const inp = { idle: 99999, focus: false, key: false };
        const scene = make(inp, reduce);
        let paused = false;
        let rafId = 0;
        let lastTs = -1;
        let accMs = 0;
        let lastLabel = '';
        let lastLabelTick = -999;
        let lastLive = 'polite';
        let tickN = 0;
        let clk = 0;
        let wasAuto = true;
        const cleaners = [];
        function listen(target, type, fn) {
            target.addEventListener(type, fn);
            cleaners.push(function () { target.removeEventListener(type, fn); });
        }
        function show() {
            scene.draw(ctx);
            // 시연이 혼자 돌 때는 낭독을 끄고, 사람이 만지는 동안은 값이 바뀌어도 0.7초에 한 번만 갱신한다
            const live = (reduce || inp.idle <= IDLE_TICKS) ? 'polite' : 'off';
            if (live !== lastLive) {
                lastLive = live;
                statusEl.setAttribute('aria-live', live);
            }
            const t = scene.label();
            if (t !== lastLabel && (reduce || live === 'off' || tickN - lastLabelTick >= 44)) {
                lastLabel = t;
                lastLabelTick = tickN;
                statusEl.textContent = t;
            }
        }
        // 고정 간격 한 틱 - 입력이 없으면 시연 스크립트가 같은 입구로 입력을 대신 넣는다
        function advance() {
            inp.idle += 1;
            tickN += 1;
            const a = inp.idle > IDLE_TICKS;
            if (a && !wasAuto) {
                scene.reset();
                clk = 0;
            }
            wasAuto = a;
            if (a) {
                clk += 1;
                scene.auto(clk);
                if (clk >= scene.CYCLE) {
                    clk = 0;
                    scene.reset();
                }
            }
            scene.step();
        }
        // 움직임 줄이기: 틱을 몰아서 돌린 뒤 한 번만 그린다 (중간 보간 장면은 화면에 나오지 않는다)
        function settle(n) {
            for (let i = 0; i < n; i += 1) {
                inp.idle = 0;
                tickN += 1;
                scene.step();
            }
            show();
        }
        function tick(ts) {
            if (lastTs < 0) {
                lastTs = ts;
            }
            const frameDt = Math.min(ts - lastTs, 160);
            lastTs = ts;
            if (!paused) {
                accMs += frameDt;
                while (accMs >= FIXED_DT) {
                    advance();
                    accMs -= FIXED_DT;
                }
                show();
            }
            rafId = requestAnimationFrame(tick);
        }
        function point(e) {
            const r = canvas.getBoundingClientRect();
            return [clamp((e.clientX - r.left) * W / r.width, 0, W), clamp((e.clientY - r.top) * H / r.height, 0, H)];
        }
        btnEl.textContent = reduce ? BTN_NEXT : BTN_PAUSE;
        if (reduce) {
            root.classList.remove('is-demo');
            for (let i = 0; i < scene.REDUCE_TICKS; i += 1) {
                advance();
            }
            show();
        }
        listen(btnEl, 'click', function () {
            if (reduce) {
                if (scene.next) {
                    scene.next();
                    show();
                    return;
                }
                const n = Math.round(scene.CYCLE / 3);
                inp.idle = 99999;
                wasAuto = true;
                for (let i = 0; i < n; i += 1) {
                    advance();
                }
                show();
                return;
            }
            paused = !paused;
            if (paused) {
                root.classList.remove('is-demo');
            }
            else {
                root.classList.add('is-demo');
            }
            btnEl.textContent = paused ? BTN_PLAY : BTN_PAUSE;
        });
        listen(canvas, 'focus', function () { inp.focus = true; if (reduce) {
            show();
        } });
        listen(canvas, 'blur', function () { inp.focus = false; inp.key = false; if (reduce) {
            show();
        } });
        listen(canvas, 'pointerdown', function (e) {
            const p = point(e);
            inp.idle = 0;
            inp.key = false;
            try {
                canvas.setPointerCapture(e.pointerId);
            }
            catch (err) { /* 캡처가 안 되는 환경은 그냥 넘어간다 */ }
            scene.down(p[0], p[1]);
            if (reduce) {
                settle(30);
            }
        });
        listen(canvas, 'pointermove', function (e) {
            const p = point(e);
            inp.idle = 0;
            inp.key = false;
            scene.move(p[0], p[1]);
            if (reduce) {
                settle(30);
            }
        });
        listen(canvas, 'pointerup', function (e) {
            const p = point(e);
            inp.idle = 0;
            scene.up(p[0], p[1]);
            if (reduce) {
                settle(30);
            }
        });
        listen(canvas, 'keydown', function (e) {
            inp.idle = 0;
            inp.key = true;
            if (scene.key(e.key)) {
                e.preventDefault();
            }
            if (reduce) {
                settle(30);
            }
        });
        if (!reduce) {
            rafId = requestAnimationFrame(tick);
        }
        return function () {
            cancelAnimationFrame(rafId);
            for (let i = 0; i < cleaners.length; i += 1) {
                cleaners[i]();
            }
        };
    }
    const WARP_AMP = 3; // 사인 변위 진폭 (저해상도 화소 단위)
    const WARP_FREQ = 0.12; // 열 하나가 지날 때 위상이 늘어나는 양 (라디안)
    const NOISE_LINES = 4; // 글자 위에 겹치는 가는 선 수
    const GLYPH_PX = 48; // 글자 크기 (저해상도 화소 단위)
    const GLYPH_N = 5;
    const LW = 240;
    const LH = 150;
    const TXT_STATUS = '왜곡 진폭 {a} · 선 {n}개';
    // PURE-BEGIN
    // 글자판 화소를 열마다 사인파로 밀어 옮긴다 (가로 변위는 세로 위치에 따른 사인, 세로 변위는 열 위치에 따른 사인)
    function warpPixels(src, out, lw, lh, amp, freq, ph) {
        for (let y = 0; y < lh; y += 1) {
            const dx = Math.round(amp * 0.6 * Math.sin(y * freq * 1.3 + ph * 1.2));
            for (let x = 0; x < lw; x += 1) {
                const dy = Math.round(amp * Math.sin(x * freq + ph));
                let sx = x + dx;
                let sy = y + dy;
                sx = sx < 0 ? 0 : (sx >= lw ? lw - 1 : sx);
                sy = sy < 0 ? 0 : (sy >= lh ? lh - 1 : sy);
                const si = (sy * lw + sx) * 4;
                const di = (y * lw + x) * 4;
                out[di] = src[si];
                out[di + 1] = src[si + 1];
                out[di + 2] = src[si + 2];
                out[di + 3] = 255;
            }
        }
    }
    // 가장 크게 밀린 화소 거리 (진폭 그대로 올림)
    function maxShift(amp) { return Math.ceil(amp); }
    const make = (inp, reduce) => {
        const src = document.createElement('canvas');
        src.width = LW;
        src.height = LH;
        const sctx = src.getContext('2d', { willReadFrequently: true });
        const dst = document.createElement('canvas');
        dst.width = LW;
        dst.height = LH;
        const dctx = dst.getContext('2d');
        if (!sctx || !dctx) {
            return { CYCLE: 1, REDUCE_TICKS: 0, reset() { return; }, auto() { return; }, step() { return; }, draw() { return; }, label() { return ''; }, down() { return; }, move() { return; }, up() { return; }, key() { return false; } };
        }
        const out = dctx.createImageData(LW, LH);
        let seed = 7;
        let text = '';
        let srcData = new Uint8ClampedArray(LW * LH * 4);
        let lines = [];
        let ph = 0;
        let manual = false;
        let scale = 1;
        let ampNow = WARP_AMP;
        function bake() {
            text = glyphStr(seed, GLYPH_N);
            const r = lcg(seed * 31 + 5);
            const g = sctx.createLinearGradient(0, 0, LW, LH);
            g.addColorStop(0, rgba(PANEL, 1));
            g.addColorStop(1, rgba(BG, 1));
            sctx.fillStyle = g;
            sctx.fillRect(0, 0, LW, LH);
            // 바탕 결 - 비스듬한 줄무늬가 같이 휘어야 왜곡이 눈에 들어온다
            sctx.strokeStyle = rgba(LILAC, 0.22);
            sctx.lineWidth = 2;
            for (let i = -LH; i < LW; i += 14) {
                sctx.beginPath();
                sctx.moveTo(i, 0);
                sctx.lineTo(i + LH, LH);
                sctx.stroke();
            }
            sctx.font = 'bold ' + GLYPH_PX + 'px "Segoe UI", "Noto Sans KR", sans-serif';
            sctx.textBaseline = 'middle';
            sctx.textAlign = 'center';
            const cols = [MINT, SKY, PINK, PEACH, CREAM];
            const step = (LW - 40) / GLYPH_N;
            for (let i = 0; i < GLYPH_N; i += 1) {
                sctx.save();
                sctx.translate(24 + step * (i + 0.5), LH / 2 + (r() - 0.5) * 12);
                sctx.rotate((r() - 0.5) * 0.4);
                sctx.fillStyle = rgba(cols[(i + seed) % cols.length], 1);
                sctx.fillText(text.charAt(i), 0, 0);
                sctx.restore();
            }
            srcData = sctx.getImageData(0, 0, LW, LH).data;
            lines = [];
            for (let i = 0; i < NOISE_LINES; i += 1) {
                lines.push({ y0: 20 + r() * (H - 40), y1: 20 + r() * (H - 40), bend: (r() - 0.5) * 120, c: i % 2 === 0 ? CREAM : MINT, w: 1.5 + r() * 1.2 });
            }
        }
        bake();
        function curAmp() { return manual ? WARP_AMP * scale : ampNow; }
        const scene = {
            CYCLE: 110,
            REDUCE_TICKS: 55,
            reset() { seed += 1; bake(); ph = 0; manual = false; },
            auto(clk) {
                // 진폭이 작게 시작해 한 번 크게 부풀었다가 가라앉는다
                const k = 0.5 - 0.5 * Math.cos((clk / scene.CYCLE) * PI2);
                ampNow = WARP_AMP * (0.25 + 0.75 * k);
            },
            step() { ph += 0.11; },
            draw(ctx) {
                warpPixels(srcData, out.data, LW, LH, curAmp(), WARP_FREQ, ph);
                dctx.putImageData(out, 0, 0);
                ctx.imageSmoothingEnabled = true;
                ctx.drawImage(dst, 0, 0, W, H);
                // 가는 선 - 변위된 위치로 함께 흔들린다
                for (let i = 0; i < lines.length; i += 1) {
                    const l = lines[i];
                    const wob = Math.sin(ph * 0.9 + i * 1.7) * 14;
                    ctx.strokeStyle = rgba(l.c, 0.8);
                    ctx.lineWidth = l.w;
                    ctx.beginPath();
                    ctx.moveTo(0, l.y0 + wob);
                    ctx.bezierCurveTo(W * 0.3, l.y0 + l.bend - wob, W * 0.65, l.y1 - l.bend + wob, W, l.y1 - wob);
                    ctx.stroke();
                }
                // 원본 축소판 - 밀리기 전 모양
                ctx.save();
                ctx.globalAlpha = 0.95;
                ctx.drawImage(src, 352, 12, 116, 72);
                ctx.globalAlpha = 1;
                ctx.strokeStyle = rgba(CREAM, 0.9);
                ctx.lineWidth = 2;
                ctx.strokeRect(352, 12, 116, 72);
                ctx.restore();
                // 진폭 눈금 - 8칸 중 지금 값이 차지하는 만큼
                const level = clamp(curAmp() / (WARP_AMP * 2.5), 0, 1);
                for (let i = 0; i < 8; i += 1) {
                    ctx.fillStyle = (i + 0.5) / 8 <= level ? rgba(MINT, 1) : rgba(CREAM, 0.28);
                    rrect(ctx, 16 + i * 14, H - 28, 10, 14, 3);
                    ctx.fill();
                }
                if (inp.key && inp.focus) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
                    ctx.lineWidth = 2.5;
                    ctx.strokeRect(6, 6, W - 12, H - 12);
                }
            },
            label() { return TXT_STATUS.replace('{a}', String(Math.round(curAmp() * 10) / 10)).replace('{n}', String(NOISE_LINES)); },
            down() { manual = true; },
            move(x) { manual = true; scale = clamp(x / W * 2.5, 0.1, 2.5); },
            up() { return; },
            key(k) {
                if (k === 'ArrowRight' || k === 'ArrowUp') {
                    manual = true;
                    scale = clamp(scale + 0.25, 0.1, 2.5);
                    return true;
                }
                if (k === 'ArrowLeft' || k === 'ArrowDown') {
                    manual = true;
                    scale = clamp(scale - 0.25, 0.1, 2.5);
                    return true;
                }
                if (k === 'Enter' || k === ' ') {
                    seed += 1;
                    bake();
                    return true;
                }
                return false;
            },
        };
        return scene;
    };
    return mount(root, make);
})();
</script>
</body>
</html>
