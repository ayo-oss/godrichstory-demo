<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom cursor — ring grows on hover</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <a class="link link--a" href="#">Tính năng</a>
  <a class="link link--b" href="#">Bảng giá</a>
  <div class="cursor-pos is-demo" aria-hidden="true"><div class="ring"></div></div>
</main>
<script>
// 실제 포인터가 움직이면 링이 좌표를 따라가고, 링크 위에서는 :has() 로 링이 커진다.
if (matchMedia('(pointer: fine)').matches) {
  var stage = document.querySelector('.stage'), pos = document.querySelector('.cursor-pos');
  stage.addEventListener('pointermove', function (e) {
    pos.classList.remove('is-demo');
    var r = stage.getBoundingClientRect();
    pos.style.transform = 'translate(' + (e.clientX - r.left) + 'px,' + (e.clientY - r.top) + 'px)';
  });
}
</script>
</body>
</html>
