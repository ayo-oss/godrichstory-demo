<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom cursor — url() image</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="board">
    <span class="chip">CSS</span>
    <span class="chip">SVG</span>
    <span class="chip">cursor</span>
  </div>
  <div class="cursor is-demo" aria-hidden="true"></div>
</main>
<script>
// 실제 포인터가 움직이면 커스텀 커서가 그 좌표를 따라간다. 터치 기기는 pointer:coarse 로 건너뛴다.
if (matchMedia('(pointer: fine)').matches) {
  var stage = document.querySelector('.stage');
  var cur = document.querySelector('.cursor');
  stage.addEventListener('pointermove', function (e) {
    var r = stage.getBoundingClientRect();
    cur.classList.remove('is-demo');
    cur.style.setProperty('--x', (e.clientX - r.left) + 'px');
    cur.style.setProperty('--y', (e.clientY - r.top) + 'px');
  });
}
</script>
</body>
</html>
