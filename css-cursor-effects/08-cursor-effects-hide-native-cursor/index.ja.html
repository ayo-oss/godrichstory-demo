<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom cursor — hide native cursor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="zone zone--default"><span>デフォルト</span></div>
  <div class="zone zone--custom">
    <span>カスタム</span>
    <div class="cursor is-demo" aria-hidden="true"></div>
  </div>
</main>
<script>
// 오른쪽 영역 안에서만 カスタム 점이 실제 포인터를 따라간다. 왼쪽은 デフォルト 화살표 그대로.
if (matchMedia('(pointer: fine)').matches) {
  var stage = document.querySelector('.stage'), dot = document.querySelector('.cursor'), zone = document.querySelector('.zone--custom');
  stage.addEventListener('pointermove', function (e) {
    var zr = zone.getBoundingClientRect();
    var inside = e.clientX >= zr.left && e.clientX <= zr.right && e.clientY >= zr.top && e.clientY <= zr.bottom;
    dot.style.opacity = inside ? 1 : 0;
    if (inside) { dot.classList.remove('is-demo'); dot.style.transform = 'translate(' + (e.clientX - zr.left) + 'px,' + (e.clientY - zr.top) + 'px)'; }
  });
}
</script>
</body>
</html>
