<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom cursor — text label on hover</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="card"></div>
  <span class="label is-demo" aria-hidden="true">View</span>
</main>
<script>
// 카드 위에서만 라벨이 보이고, 실제 포인터 좌표를 그대로 따라간다.
if (matchMedia('(pointer: fine)').matches) {
  var stage = document.querySelector('.stage'), card = document.querySelector('.card'), label = document.querySelector('.label');
  stage.addEventListener('pointermove', function (e) {
    label.classList.remove('is-demo');
    var r = stage.getBoundingClientRect();
    label.style.transform = 'translate(' + (e.clientX - r.left) + 'px,' + (e.clientY - r.top) + 'px)';
    label.style.opacity = card.contains(e.target) ? 1 : 0;
  });
}
</script>
</body>
</html>
