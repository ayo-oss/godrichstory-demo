<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom cursor — touch-device fallback</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="panel panel--mouse is-demo">
    <div class="cursor" aria-hidden="true"></div>
    <span class="label">Phát hiện chuột</span>
  </div>
  <div class="panel panel--touch is-demo">
    <button class="tap" type="button">Chạm vào đây</button>
    <span class="label">Phát hiện chạm</span>
  </div>
</main>
<script>
// pointer:fine 인 실제 기기에서만 점이 포인터를 따라간다. 나머지는 @media (pointer: coarse) 가 CSS로 대체한다.
if (matchMedia('(pointer: fine)').matches) {
  var stage = document.querySelector('.stage'), dot = document.querySelector('.cursor');
  stage.addEventListener('pointermove', function (e) {
    var r = stage.getBoundingClientRect();
    dot.style.transform = 'translate(' + (e.clientX - r.left) + 'px,' + (e.clientY - r.top) + 'px)';
  });
}
</script>
</body>
</html>
