<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom cursor — ring follows cursor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <p class="hint">포트폴리오</p>
  <div class="dot is-demo" aria-hidden="true"></div>
  <div class="ring is-demo" aria-hidden="true"></div>
</main>
<script>
// 실제 포인터가 움직이면 점과 링이 같은 좌표를 따라가되 링에는 transition 지연이 있어 뒤처져 보인다.
if (matchMedia('(pointer: fine)').matches) {
  var stage = document.querySelector('.stage');
  var dot = document.querySelector('.dot');
  var ring = document.querySelector('.ring');
  stage.addEventListener('pointermove', function (e) {
    var r = stage.getBoundingClientRect();
    dot.classList.remove('is-demo'); ring.classList.remove('is-demo');
    var v = 'translate(' + (e.clientX - r.left) + 'px,' + (e.clientY - r.top) + 'px)';
    dot.style.transform = v; ring.style.transform = v;
  });
}
</script>
</body>
</html>
