<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom cursor — mix-blend-mode cursor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="half half--left"></div>
  <div class="half half--right"></div>
  <p class="banner">반전</p>
  <div class="cursor is-demo" aria-hidden="true"></div>
</main>
<script>
// 실제 포인터가 움직이면 블렌드 원이 그 좌표를 따라가며 지나는 배경 색을 반전시킨다.
if (matchMedia('(pointer: fine)').matches) {
  var stage = document.querySelector('.stage'), cur = document.querySelector('.cursor');
  stage.addEventListener('pointermove', function (e) {
    cur.classList.remove('is-demo');
    var r = stage.getBoundingClientRect();
    cur.style.transform = 'translate(' + (e.clientX - r.left) + 'px,' + (e.clientY - r.top) + 'px)';
  });
}
</script>
</body>
</html>
