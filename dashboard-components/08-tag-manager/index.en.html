<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag manager input widget — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="tg">
    <div class="tg__row">
      <input class="tg__input" type="text" placeholder="Type a tag, press Enter" aria-label="New tag">
      <button class="tg__add" type="button" aria-label="Add tag">
        <svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88m48-88a8 8 0 0 1-8 8h-32v32a8 8 0 0 1-16 0v-32H88a8 8 0 0 1 0-16h32V88a8 8 0 0 1 16 0v32h32a8 8 0 0 1 8 8"/></g></svg>
      </button>
    </div>
    <ul class="tg__list">
      <li class="tg__chip" data-tag="Design">Design<button class="tg__remove" type="button" aria-label="Remove Design">×</button></li>
      <li class="tg__chip" data-tag="Urgent">Urgent<button class="tg__remove" type="button" aria-label="Remove Urgent">×</button></li>
      <li class="tg__chip tg__chip--demo is-demo" aria-hidden="true">Needs review<button class="tg__remove" type="button" tabindex="-1" aria-hidden="true">×</button></li>
    </ul>
  </div>
</main>
<script>
// 실제 동작: 입력하고 추가를 누르면(또는 Enter) New tag 칩이 실제로 생기고, ×를 누르면 그 태그만 실제로 사라진다.
var list = document.querySelector('.tg__list');
var input = document.querySelector('.tg__input');
var addBtn = document.querySelector('.tg__add');
function wireRemove(li) {
  li.querySelector('.tg__remove').addEventListener('click', function () {
    li.classList.add('tg__chip--out');
    setTimeout(function () { li.remove(); }, 180);
  });
}
function addTag() {
  var v = input.value.trim();
  if (!v) return;
  var li = document.createElement('li');
  li.className = 'tg__chip';
  li.dataset.tag = v;
  li.textContent = v;
  var rm = document.createElement('button');
  rm.type = 'button'; rm.className = 'tg__remove'; rm.textContent = '×';
  rm.setAttribute('aria-label', v + ' Delete');
  li.appendChild(rm);
  wireRemove(li);
  list.appendChild(li);
  input.value = '';
  input.focus({ preventScroll: true });
}
addBtn.addEventListener('click', addTag);
input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addTag(); } });
document.querySelectorAll('.tg__chip:not(.tg__chip--demo)').forEach(wireRemove);
</script>
</body>
</html>
