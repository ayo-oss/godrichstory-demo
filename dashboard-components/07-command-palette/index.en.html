<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command palette (Ctrl+K) — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cp">
    <button class="cp__trigger" type="button">
      <svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M116 40a76 76 0 1 0 76 76a76 76 0 0 0-76-76" opacity=".2"/><path d="m228.24 219.76l-51.38-51.38a92.12 92.12 0 1 0-8.48 8.48l51.38 51.38a6 6 0 0 0 8.48-8.48M36 116a80 80 0 1 1 80 80a80.09 80.09 0 0 1-80-80"/></g></svg>
      Quick jump <kbd class="cp__kbd">Ctrl K</kbd>
    </button>
    <div class="cp__overlay is-demo">
      <div class="cp__backdrop"></div>
      <div class="cp__panel" role="dialog" aria-modal="true" aria-label="Command palette">
        <div class="cp__search-row">
          <svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M116 40a76 76 0 1 0 76 76a76 76 0 0 0-76-76" opacity=".2"/><path d="m228.24 219.76l-51.38-51.38a92.12 92.12 0 1 0-8.48 8.48l51.38 51.38a6 6 0 0 0 8.48-8.48M36 116a80 80 0 1 1 80 80a80.09 80.09 0 0 1-80-80"/></g></svg>
          <input class="cp__input" type="text" placeholder="Search commands…" aria-label="Command search">
        </div>
        <ul class="cp__list" role="listbox">
          <li class="cp__item is-active" role="option" tabindex="-1" data-kw="event schedule calendar add">
            <span class="cp__ic"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M208 32h-24v-8a8 8 0 0 0-16 0v8H88v-8a8 8 0 0 0-16 0v8H48a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16m0 176H48V96h160Z"/></g></svg></span>
            Add new event
          </li>
          <li class="cp__item" role="option" tabindex="-1" data-kw="tag label manage">
            <span class="cp__ic"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M243.31 136L144 36.69A15.86 15.86 0 0 0 132.69 32H40a8 8 0 0 0-8 8v92.69A15.86 15.86 0 0 0 36.69 144L136 243.31a16 16 0 0 0 22.63 0l84.68-84.68a16 16 0 0 0 0-22.63M96 84a12 12 0 1 1 12-12a12 12 0 0 1-12 12"/></g></svg></span>
            Manage tags
          </li>
          <li class="cp__item" role="option" tabindex="-1" data-kw="profile account settings">
            <span class="cp__ic"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a87.7 87.7 0 0 1-56.61-20.68a72 72 0 0 1 113.22 0A87.7 87.7 0 0 1 128 216"/></g></svg></span>
            Profile settings
          </li>
          <li class="cp__item" role="option" tabindex="-1" data-kw="export download csv">
            <span class="cp__ic"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M224 144v64a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8v-64a8 8 0 0 1 16 0v56h160v-56a8 8 0 0 1 16 0M93.66 77.66L120 51.31V144a8 8 0 0 0 16 0V51.31l26.34 26.35a8 8 0 0 0 11.32-11.32l-40-40a8 8 0 0 0-11.32 0l-40 40a8 8 0 0 0 11.32 11.32"/></g></svg></span>
            Export file
          </li>
        </ul>
        <p class="cp__empty" hidden>No matching commands</p>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 버튼이나 Ctrl(⌘)+K로 열리고, 입력하면 실제로 그 글자가 든 명령만 남으며, 방향키·Enter로 고른다.
var trigger = document.querySelector('.cp__trigger');
var overlay = document.querySelector('.cp__overlay');
var input = document.querySelector('.cp__input');
var items = document.querySelectorAll('.cp__item');
var empty = document.querySelector('.cp__empty');
var activeIndex = 0;
function visibleItems() { return Array.prototype.filter.call(items, function (it) { return !it.hidden; }); }
function setActive(i, vis) {
  vis = vis || visibleItems();
  items.forEach(function (it) { it.classList.remove('is-active'); });
  if (vis[i]) vis[i].classList.add('is-active');
  activeIndex = i;
}
function filter() {
  var q = input.value.trim().toLowerCase();
  items.forEach(function (it) { it.hidden = q !== '' && it.dataset.kw.toLowerCase().indexOf(q) === -1; });
  var vis = visibleItems();
  empty.hidden = vis.length !== 0;
  setActive(0, vis);
}
function open() {
  overlay.classList.remove('is-demo');
  overlay.classList.add('is-open');
  input.value = '';
  filter();
  input.focus({ preventScroll: true });
}
function close() {
  overlay.classList.remove('is-open');
  trigger.focus({ preventScroll: true });
}
trigger.addEventListener('click', open);
document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); open(); }
  else if (e.key === 'Escape' && overlay.classList.contains('is-open')) close();
});
overlay.addEventListener('click', function (e) {
  if (e.target === overlay || e.target.classList.contains('cp__backdrop')) close();
});
input.addEventListener('input', filter);
input.addEventListener('keydown', function (e) {
  var vis = visibleItems();
  if (e.key === 'ArrowDown') { e.preventDefault(); setActive(Math.min(activeIndex + 1, vis.length - 1), vis); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(activeIndex - 1, 0), vis); }
  else if (e.key === 'Enter') { var cur = vis[activeIndex]; if (cur) close(); }
});
items.forEach(function (it) { it.addEventListener('click', close); });
</script>
</body>
</html>
