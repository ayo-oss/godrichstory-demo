<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity feed timeline — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="af">
    <div class="af__head">
      <strong class="af__title">最近のアクティビティ</strong>
      <button class="af__more" type="button">新しい活動を見る</button>
    </div>
    <ul class="af__list">
      <li class="af__item">
        <span class="af__ic af__ic--check"><svg viewBox="0 0 256 256" width="12" height="12"><g fill="currentColor"><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0"/></g></svg></span>
        <div class="af__body"><p class="af__text">デプロイが完了しました</p><time class="af__time">3分前</time></div>
      </li>
      <li class="af__item">
        <span class="af__ic af__ic--chat"><svg viewBox="0 0 256 256" width="12" height="12"><g fill="currentColor"><path d="M128 24a104 104 0 0 0-91.82 152.88l-11.35 34.05a16 16 0 0 0 20.24 20.24l34.05-11.35A104 104 0 1 0 128 24"/></g></svg></span>
        <div class="af__body"><p class="af__text">ミンジさんがコメントしました</p><time class="af__time">18分前</time></div>
      </li>
      <li class="af__item af__item--new is-demo">
        <span class="af__ic af__ic--upload"><svg viewBox="0 0 256 256" width="12" height="12"><g fill="currentColor"><path d="M224 144v64a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8v-64a8 8 0 0 1 16 0v56h160v-56a8 8 0 0 1 16 0M93.66 77.66L120 51.31V144a8 8 0 0 0 16 0V51.31l26.34 26.35a8 8 0 0 0 11.32-11.32l-40-40a8 8 0 0 0-11.32 0l-40 40a8 8 0 0 0 11.32 11.32"/></g></svg></span>
        <div class="af__body"><p class="af__text">新しいファイルがアップロードされました</p><time class="af__time">たった今</time></div>
      </li>
    </ul>
  </div>
</main>
<script>
// 실제 동작: 버튼을 누르면 숨어 있던 새 활동 항목이 실제로 나타나고, 버튼은 다 쓰면 사라진다.
var btn = document.querySelector('.af__more');
var last = document.querySelector('.af__item--new');
btn.addEventListener('click', function () {
  last.classList.remove('is-demo');
  last.classList.add('af__item--shown');
  btn.disabled = true;
  btn.textContent = 'すべて確認済み';
});
</script>
</body>
</html>
