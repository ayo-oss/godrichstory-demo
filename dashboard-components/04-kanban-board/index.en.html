<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini kanban board widget — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="kb">
    <div class="kb__ghost is-demo" aria-hidden="true">Design review</div>
    <div class="kb__col" data-col="0">
      <p class="kb__head">To do <span class="kb__count">1</span></p>
      <div class="kb__cards">
        <div class="kb__card">
          <span class="kb__dot kb__dot--warn"></span>
          <span class="kb__label">Write landing copy</span>
          <button class="kb__move" type="button" aria-label="Move to next column">
            <svg viewBox="0 0 256 256" width="12" height="12"><g fill="currentColor"><path d="M221.66 133.66l-72 72a8 8 0 0 1-11.32-11.32L196.69 136H40a8 8 0 0 1 0-16h156.69l-58.35-58.34a8 8 0 0 1 11.32-11.32l72 72a8 8 0 0 1 0 11.32"/></g></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="kb__col" data-col="1">
      <p class="kb__head">In progress <span class="kb__count">1</span></p>
      <div class="kb__cards">
        <div class="kb__card">
          <span class="kb__dot kb__dot--info"></span>
          <span class="kb__label">Organize icon set</span>
          <button class="kb__move" type="button" aria-label="Move to next column">
            <svg viewBox="0 0 256 256" width="12" height="12"><g fill="currentColor"><path d="M221.66 133.66l-72 72a8 8 0 0 1-11.32-11.32L196.69 136H40a8 8 0 0 1 0-16h156.69l-58.35-58.34a8 8 0 0 1 11.32-11.32l72 72a8 8 0 0 1 0 11.32"/></g></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="kb__col kb__col--done" data-col="2">
      <p class="kb__head">Done <span class="kb__count">1</span></p>
      <div class="kb__cards">
        <div class="kb__card kb__card--done">
          <span class="kb__ic">
            <svg viewBox="0 0 256 256" width="11" height="11"><g fill="currentColor"><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0"/></g></svg>
          </span>
          <span class="kb__label">Clean up copy.json</span>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 화살표를 누르면 그 카드가 실제로 다음 칸(DOM)으로 옮겨간다. 마지막 칸에서는 화살표 대신 체크로 바뀐다.
var cols = document.querySelectorAll('.kb__col');
function refreshCounts() {
  cols.forEach(function (c) {
    c.querySelector('.kb__count').textContent = String(c.querySelectorAll('.kb__card').length);
  });
}
function wire(card) {
  var btn = card.querySelector('.kb__move');
  if (!btn) return;
  btn.addEventListener('click', function () {
    document.querySelector('.kb__ghost').classList.remove('is-demo');
    var col = card.closest('.kb__col');
    var next = cols[Array.prototype.indexOf.call(cols, col) + 1];
    if (!next) return;
    card.classList.add('kb__card--moving');
    setTimeout(function () {
      card.classList.remove('kb__card--moving');
      if (next.classList.contains('kb__col--done')) {
        card.classList.add('kb__card--done');
        btn.remove();
        var ic = document.createElement('span');
        ic.className = 'kb__ic';
        ic.innerHTML = '<svg viewBox="0 0 256 256" width="11" height="11"><g fill="currentColor"><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0"/></g></svg>';
        card.prepend(ic);
      }
      next.querySelector('.kb__cards').appendChild(card);
      refreshCounts();
    }, 160);
  });
}
document.querySelectorAll('.kb__card').forEach(wire);
</script>
</body>
</html>
