<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly calendar widget — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cal">
    <div class="cal__head">
      <button class="cal__nav" type="button" data-dir="-1" aria-label="Previous month">
        <svg viewBox="0 0 256 256" width="12" height="12"><g fill="currentColor"><path d="m165.66 202.34l-72-72a8 8 0 0 1 0-11.32l72-72a8 8 0 0 1 11.32 11.32L109.31 122H208a8 8 0 0 1 0 16h-98.69l67.67 63.66a8 8 0 0 1-11.32 11.32Z"/></g></svg>
      </button>
      <strong class="cal__month">September 2026</strong>
      <button class="cal__nav" type="button" data-dir="1" aria-label="Next month">
        <svg viewBox="0 0 256 256" width="12" height="12"><g fill="currentColor"><path d="M181.66 133.66l-72 72a8 8 0 0 1-11.32-11.32L165.31 138H56a8 8 0 0 1 0-16h109.31l-67-63.66a8 8 0 0 1 11.32-11.32l72 72a8 8 0 0 1 .03 11.32Z"/></g></svg>
      </button>
    </div>
    <div class="cal__dows">
      <span class="cal__dow">Su</span><span class="cal__dow">Mo</span><span class="cal__dow">Tu</span><span class="cal__dow">We</span><span class="cal__dow">Th</span><span class="cal__dow">Fr</span><span class="cal__dow">Sa</span>
    </div>
    <div class="cal__grid is-demo"></div>
  </div>
</main>
<script>
// 실제 동작: 화살표를 누르면 달이 실제로 바뀌며 날짜 칸이 다시 그려지고, 날짜를 누르면 그 칸만 선택된다.
var EVENTS = [4, 11, 22];
var MONTH_LABEL = '{m}/{y}';
var grid = document.querySelector('.cal__grid');
var label = document.querySelector('.cal__month');
var cur = { y: 2026, m: 8 };
function build() {
  grid.classList.remove('is-demo');
  grid.innerHTML = '';
  var first = new Date(cur.y, cur.m, 1).getDay();
  var days = new Date(cur.y, cur.m + 1, 0).getDate();
  for (var i = 0; i < first; i++) grid.appendChild(document.createElement('span'));
  for (var d = 1; d <= days; d++) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'cal__day'; b.textContent = String(d);
    b.setAttribute('aria-pressed', 'false');
    if (cur.y === 2026 && cur.m === 8 && d === 11) b.classList.add('cal__day--today');
    if (cur.y === 2026 && cur.m === 8 && EVENTS.indexOf(d) !== -1) b.classList.add('cal__day--event');
    b.addEventListener('click', function () {
      grid.querySelectorAll('[aria-pressed="true"]').forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
      this.setAttribute('aria-pressed', 'true');
    });
    grid.appendChild(b);
  }
  label.textContent = MONTH_LABEL.replace('{y}', cur.y).replace('{m}', cur.m + 1);
}
document.querySelectorAll('.cal__nav').forEach(function (btn) {
  btn.addEventListener('click', function () {
    cur.m += Number(btn.dataset.dir);
    if (cur.m < 0) { cur.m = 11; cur.y--; }
    if (cur.m > 11) { cur.m = 0; cur.y++; }
    build();
  });
});
build();
grid.classList.add('is-demo');
</script>
</body>
</html>
