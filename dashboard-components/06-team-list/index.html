<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team member list with search — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="tl">
    <div class="tl__head">
      <input class="tl__search" type="text" placeholder="이름으로 검색" aria-label="멤버 검색">
      <button class="tl__invite" type="button" aria-label="초대">
        <svg viewBox="0 0 256 256" width="14" height="14"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m0 192a88 88 0 1 1 88-88a88.1 88.1 0 0 1-88 88m48-88a8 8 0 0 1-8 8h-32v32a8 8 0 0 1-16 0v-32H88a8 8 0 0 1 0-16h32V88a8 8 0 0 1 16 0v32h32a8 8 0 0 1 8 8"/></g></svg>
      </button>
    </div>
    <ul class="tl__list">
      <li class="tl__row" data-name="김도윤">
        <span class="tl__avatar">김<span class="tl__status tl__status--on"></span></span>
        <span class="tl__name">김도윤</span>
      </li>
      <li class="tl__row" data-name="이서준">
        <span class="tl__avatar">이<span class="tl__status tl__status--away"></span></span>
        <span class="tl__name">이서준</span>
      </li>
      <li class="tl__row" data-name="박하은">
        <span class="tl__avatar">박<span class="tl__status tl__status--on"></span></span>
        <span class="tl__name">박하은</span>
      </li>
      <li class="tl__row tl__row--new is-demo" data-name="최유진">
        <span class="tl__avatar">최<span class="tl__status tl__status--on"></span></span>
        <span class="tl__name">최유진</span>
      </li>
    </ul>
    <p class="tl__empty" hidden>일치하는 멤버가 없습니다</p>
  </div>
</main>
<script>
// 실제 동작: 이름을 입력하면 일치하는 멤버만 실제로 남고 나머지는 실제로 숨겨진다.
var input = document.querySelector('.tl__search');
var rows = document.querySelectorAll('.tl__row');
var empty = document.querySelector('.tl__empty');
input.addEventListener('input', function () {
  var q = input.value.trim().toLowerCase();
  var shown = 0;
  rows.forEach(function (r) {
    var hit = r.dataset.name.toLowerCase().indexOf(q) !== -1;
    r.hidden = !hit;
    if (hit) shown++;
  });
  empty.hidden = shown !== 0;
});
</script>
</body>
</html>
