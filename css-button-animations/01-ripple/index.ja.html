<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple button — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <button class="btn is-demo" type="button">購入する</button>
</main>
<script>
// 클릭한 자리에서 물결이 시작되게 좌표를 CSS 변수로 넘긴다. 데모(.is-demo)는 가운데서 자동 반복.
document.querySelectorAll('.btn').forEach(function (b) {
  b.addEventListener('pointerdown', function (e) {
    var r = b.getBoundingClientRect();
    var d = Math.max(r.width, r.height) * 2;
    b.style.setProperty('--x', (e.clientX - r.left) + 'px');
    b.style.setProperty('--y', (e.clientY - r.top) + 'px');
    b.style.setProperty('--d', d + 'px');
    b.classList.remove('is-demo');
    b.classList.remove('is-rippling');
    void b.offsetWidth;           // 애니메이션 재시작
    b.classList.add('is-rippling');
  });
  b.addEventListener('animationend', function () { b.classList.remove('is-rippling'); });
});
</script>
</body>
</html>
