<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Loading state — demo</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="stage">
  <button class="btn is-demo" type="button"><span class="btn__label">저장하기</span><span class="btn__spin" aria-hidden="true"></span></button>
</main>
<script>
// 누르면 로딩 → 1.5초 뒤 원래대로. 실제로는 fetch 가 끝났을 때 is-loading 을 뺀다.
var b = document.querySelector('.btn');
b.addEventListener('click', function () {
  b.classList.remove('is-demo'); b.classList.add('is-loading'); b.disabled = true;
  setTimeout(function () { b.classList.remove('is-loading'); b.disabled = false; }, 1500);
});
</script>
</body>
</html>
