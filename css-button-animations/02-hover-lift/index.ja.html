<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hover lift — demo</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="stage"><button class="btn is-demo" type="button">カートに入れる</button></main>
<script>
// 데모(.is-demo)는 자동 반복. 사람이 올리면 진짜 호버로 넘어간다.
document.querySelectorAll('.btn').forEach(function (b) {
  b.addEventListener('pointerenter', function () { b.classList.remove('is-demo'); });
});
</script>
</body>
</html>
