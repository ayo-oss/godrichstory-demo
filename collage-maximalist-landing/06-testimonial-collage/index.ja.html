<!doctype html>
<html lang="ja">
<head>

<title>Hand-drawn underline quote</title>

<body>
<main class="stage">
  <figure class="tcol">
    <span class="tcol__tape" aria-hidden="true"></span>
    <span class="tcol__quote" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256" fill="currentColor"><path d="M108,72v72H40a8,8,0,0,1-8-8V72a8,8,0,0,1,8-8h60A8,8,0,0,1,108,72Zm108-8H156a8,8,0,0,0-8,8v64a8,8,0,0,0,8,8h68V72A8,8,0,0,0,216,64Z" opacity="0.2"/><path d="M100,56H40A16,16,0,0,0,24,72v64a16,16,0,0,0,16,16h60v8a32,32,0,0,1-32,32,8,8,0,0,0,0,16,48.05,48.05,0,0,0,48-48V72A16,16,0,0,0,100,56Zm0,80H40V72h60ZM216,56H156a16,16,0,0,0-16,16v64a16,16,0,0,0,16,16h60v8a32,32,0,0,1-32,32,8,8,0,0,0,0,16,48.05,48.05,0,0,0,48-48V72A16,16,0,0,0,216,56Zm0,80H156V72h60Z"/></svg>
    </span>
    <blockquote class="tcol__text">
      切り貼りの画面なのに<br>
      <span class="tcol__mark">読む順番は揺れない</span>
      <svg class="tcol__line" viewBox="0 0 200 12" aria-hidden="true" preserveAspectRatio="none">
        <path d="M3 8 C 28 2, 52 11, 78 6 S 132 2, 158 8 S 186 4, 197 6" />
      </svg>
    </blockquote>
    <figcaption class="tcol__by">
      <span class="tcol__dot" aria-hidden="true">ジ</span>
      <span class="tcol__who">ジョン・雑誌エディター</span>
    </figcaption>
  </figure>
</main>
</body>
</html>
