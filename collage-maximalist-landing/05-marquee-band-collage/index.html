<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marquee text band</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="mcol">
    <div class="mcol__band mcol__band--coral">
      <div class="mcol__track">
        <span class="mcol__bit">COLLAGE</span>
        <span class="mcol__bit">MAXIMAL</span>
        <span class="mcol__bit">PASTE</span>
        <span class="mcol__bit">CUT</span>
        <span class="mcol__bit" aria-hidden="true">COLLAGE</span>
        <span class="mcol__bit" aria-hidden="true">MAXIMAL</span>
        <span class="mcol__bit" aria-hidden="true">PASTE</span>
        <span class="mcol__bit" aria-hidden="true">CUT</span>
      </div>
    </div>
    <div class="mcol__band mcol__band--lemon">
      <div class="mcol__track mcol__track--back">
        <span class="mcol__bit">겹치기</span>
        <span class="mcol__bit">기울이기</span>
        <span class="mcol__bit">오리기</span>
        <span class="mcol__bit" aria-hidden="true">겹치기</span>
        <span class="mcol__bit" aria-hidden="true">기울이기</span>
        <span class="mcol__bit" aria-hidden="true">오리기</span>
      </div>
    </div>
  </section>
</main>
</body>
</html>
