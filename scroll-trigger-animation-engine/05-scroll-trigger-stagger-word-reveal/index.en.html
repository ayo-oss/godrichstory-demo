<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stagger word reveal — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="sw is-demo" id="sw" aria-label="Timeline stagger demo">
    <header class="sw__head">
      <p class="sw__title">Timeline stagger</p>
      <p class="sw__attr"><code>data-stagger="90"</code></p>
    </header>
    <div class="sw__view" id="sw-view" tabindex="0" role="region" aria-label="Headline preview — scroll and words appear in order">
      <div class="sw__track">
        <p class="sw__hint">Scroll down</p>
        <article class="sw__card" id="sw-card" data-stagger="90">
          <h2 class="sw__line">One scroll turns a sentence into a timeline</h2>
          <p class="sw__meta">Magazine headline reveal</p>
        </article>
        <p class="sw__filler" aria-hidden="true">Next section</p>
      </div>
    </div>
    <footer class="sw__foot">
      <span class="sw__dot" aria-hidden="true"></span>
      <span class="sw__state">Six words flow in order</span>
    </footer>
  </section>
</main>
<script>
// Timeline stagger — 문장을 단어로 쪼개 각 조각에 순번(--i) 을 물려준다
// 딜레이는 CSS 의 transition-delay calc(var(--i) * var(--stagger)) 가 계산하고 시점은 관찰자가 is-visible 로 연다
var root = document.getElementById('sw');
var view = document.getElementById('sw-view');
var card = document.getElementById('sw-card');
var line = card.querySelector('.sw__line');
var stag = parseInt(card.getAttribute('data-stagger'), 10) || 90;
card.style.setProperty('--stagger', stag + 'ms');
var words = line.textContent.trim().split(/\s+/);
line.textContent = '';
words.forEach(function (word, i) {
  var span = document.createElement('span');
  span.className = 'sw__word';
  span.textContent = word;
  span.style.setProperty('--i', i);
  line.appendChild(span);
  if (i < words.length - 1) line.appendChild(document.createTextNode(' '));
});
var started = false;
function start() {
  root.classList.remove('is-demo');
  if (started) return;
  started = true;
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) entry.target.classList.add('is-visible');
      else entry.target.classList.remove('is-visible');
    });
  }, { root: view, threshold: 0.35 });
  io.observe(card);
}
view.addEventListener('scroll', start, { passive: true });
view.addEventListener('pointerdown', start);
view.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') start();
});
</script>
</body>
</html>
