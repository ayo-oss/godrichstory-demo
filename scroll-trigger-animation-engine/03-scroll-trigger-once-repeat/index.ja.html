<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Once vs every pass — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="or is-demo" id="or" aria-label="一度だけと毎回の再生の比較">
    <header class="or__head">
      <p class="or__title">一度だけ vs 毎回</p>
      <p class="or__attr"><code>data-once="true"</code></p>
    </header>
    <div class="or__cols">
      <div class="or__col" data-once="true">
        <p class="or__label">左 — 一度だけ再生</p>
        <p class="or__plays"><span>再生回数</span><span class="or__dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
        <div class="or__view" tabindex="0" role="region" aria-label="左ビューポート — スクロールしてみてください">
          <div class="or__track">
            <p class="or__lead">実績カードは下にあります</p>
            <article class="or__card or__card--stat">
              <b>248</b>
              <span>完了したプロジェクト</span>
            </article>
            <p class="or__more">下にはこれ以上ありません</p>
          </div>
        </div>
      </div>
      <div class="or__col" data-once="false">
        <p class="or__label">右 — 通るたびに再生</p>
        <p class="or__plays"><span>再生回数</span><span class="or__dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
        <div class="or__view" tabindex="0" role="region" aria-label="右ビューポート — スクロールしてみてください">
          <div class="or__track">
            <p class="or__lead">案内バナーは下にあります</p>
            <article class="or__card or__card--note">
              <svg viewBox="0 0 256 256" aria-hidden="true" focusable="false"><g fill="currentColor"><path d="M240 120a40 40 0 0 1-40 40h-40V80h40a40 40 0 0 1 40 40" opacity=".2"/><path d="M248 120a48.05 48.05 0 0 0-48-48h-39.8c-2.91-.17-53.62-3.74-101.91-44.24A16 16 0 0 0 32 40v160a16 16 0 0 0 26.29 12.25c37.77-31.68 77-40.76 93.71-43.3v31.72a16 16 0 0 0 7.12 13.33l11 7.33A16 16 0 0 0 194.5 212l11.77-44.36A48.07 48.07 0 0 0 248 120M48 199.93V40c42.81 35.91 86.63 45 104 47.24v65.48c-17.35 2.28-61.16 11.35-104 47.21m131 8v.11l-11-7.33V168h21.6ZM200 152h-32V88h32a32 32 0 1 1 0 64"/></g></svg>
              <div class="or__notetext">
                <b>新着</b>
                <span>今週のリリース案内</span>
              </div>
            </article>
            <p class="or__more">下にはこれ以上ありません</p>
          </div>
        </div>
      </div>
    </div>
    <footer class="or__foot">左は一度だけ、右は通るたびに再点火します</footer>
  </section>
</main>
<script>
// 一度だけ vs 毎回 — data-once 속성이 unobserve 여부를 결정한다
// 오른쪽처럼 반복하려면 끝난 등장 애니메이션을 리플로 트릭으로 되살려야 한다
var root = document.getElementById('or');
var cols = Array.prototype.slice.call(document.querySelectorAll('.or__col'));
var started = false;

function start() {
  if (started) return;
  started = true;
  root.classList.remove('is-demo');
  cols.forEach(setup);
}
function setup(col) {
  var once = col.getAttribute('data-once') === 'true';
  var view = col.querySelector('.or__view');
  var card = col.querySelector('.or__card');
  var dots = Array.prototype.slice.call(col.querySelectorAll('.or__dots i'));
  var plays = 0;
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        card.classList.remove('is-in');
        void card.offsetWidth; // 리플로 트릭 — 여기서 강제 재계산이 일어나야 클래스를 다시 붙일 때 애니메이션이 처음부터 돈다
        card.classList.add('is-in');
        plays += 1;
        dots.forEach(function (d, i) { d.classList.toggle('is-lit', i < Math.min(plays, 3)); });
        if (once) io.unobserve(card); // 왼쪽 — 딱 한 번 재생하고 관찰을 멈춘다
      } else if (!once) {
        card.classList.remove('is-in'); // 오른쪽 — 벗어나면 초기화, 다음 진입 때 다시 재생된다
      }
    });
  }, { root: view, threshold: 0.5 });
  io.observe(card);
}
cols.forEach(function (col) {
  var view = col.querySelector('.or__view');
  view.addEventListener('scroll', start, { passive: true });
  view.addEventListener('pointerdown', start);
  view.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') start();
  });
});
</script>
</body>
</html>
