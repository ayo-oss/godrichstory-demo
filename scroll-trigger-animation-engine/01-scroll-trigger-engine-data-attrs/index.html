<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trigger engine core — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="te is-demo" id="te" aria-label="스크롤 트리거 엔진">
    <header class="te__head">
      <p class="te__title">트리거 엔진</p>
      <p class="te__attr"><code>data-scroll="up"</code></p>
    </header>
    <div class="te__view" id="te-view" tabindex="0" role="region" aria-label="섹션 목록 — 스크롤하면 순서대로 등장합니다">
      <div class="te__track">
        <article class="te__card" data-scroll="up" data-threshold="0.4" data-once="true"><b>01</b><span>아래에서 올라오며</span></article>
        <article class="te__card" data-scroll="left" data-threshold="0.4" data-once="true"><b>02</b><span>왼쪽에서 밀려오며</span></article>
        <article class="te__card" data-scroll="right" data-threshold="0.4" data-once="true"><b>03</b><span>오른쪽에서 밀려오며</span></article>
        <article class="te__card" data-scroll="zoom" data-threshold="0.4" data-once="true"><b>04</b><span>작게 있다 커지며</span></article>
      </div>
    </div>
    <footer class="te__foot">
      <span class="te__dot" aria-hidden="true"></span>
      <span class="te__state">화면에 들어오면 <b>is-visible</b></span>
    </footer>
  </section>
</main>
<script>
// 트리거 엔진 코어 — data-scroll 속성으로 방향·임계값·한 번만 여부를 HTML 에서 정한다
var root = document.getElementById('te');
var view = document.getElementById('te-view');
var cards = Array.prototype.slice.call(document.querySelectorAll('.te__card'));
var observers = [];
function attach(card) {
  var threshold = parseFloat(card.getAttribute('data-threshold')) || 0;
  var once = card.getAttribute('data-once') === 'true';
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        if (once) io.unobserve(entry.target);
      } else if (!once) {
        entry.target.classList.remove('is-visible');
      }
    });
  }, { root: view, rootMargin: '0px 0px -8px 0px', threshold: threshold });
  io.observe(card);
  observers.push(io);
}
function start() {
  root.classList.remove('is-demo');
  if (observers.length === 0) cards.forEach(attach);
}
view.addEventListener('scroll', start, { passive: true });
view.addEventListener('pointerdown', start);
view.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') start();
});
</script>
</body>
</html>
