<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threshold gauge — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="tg is-demo" id="tg" aria-label="Threshold gauge">
    <header class="tg__head">
      <p class="tg__title">Threshold gauge</p>
      <p class="tg__attr"><code>threshold: [0, 0.25, 0.5, 1]</code></p>
    </header>
    <div class="tg__body">
      <div class="tg__view" id="tg-view" tabindex="0" role="region" aria-label="Target viewport — try scrolling">
        <div class="tg__track" id="tg-track">
          <p class="tg__lead">The target rises from below</p>
          <div class="tg__target" id="tg-target">
            <b>Target element</b>
            <span>How much of its height is in view</span>
          </div>
        </div>
      </div>
      <div class="tg__panel">
        <p class="tg__read" aria-live="polite">
          <b class="tg__numcur" id="tg-num">0.00</b>
          <span class="tg__nums" aria-hidden="true"><b>0.00</b><b>0.25</b><b>0.50</b><b>1.00</b></span>
        </p>
        <div class="tg__gauge" aria-hidden="true">
          <i class="tg__fill" id="tg-fill"></i>
          <i class="tg__tick tg__tick--0"></i>
          <i class="tg__tick tg__tick--25"></i>
          <i class="tg__tick tg__tick--50"></i>
          <i class="tg__tick tg__tick--100"></i>
        </div>
        <p class="tg__scale" aria-hidden="true"><span class="tg__s0">0</span><span class="tg__s25">0.25</span><span class="tg__s50">0.5</span><span class="tg__s100">1</span></p>
        <p class="tg__candt">Threshold candidates</p>
        <div class="tg__cands" id="tg-cands">
          <button type="button" class="tg__cand" data-th="0" aria-pressed="false">0</button>
          <button type="button" class="tg__cand is-on" data-th="0.25" aria-pressed="true">0.25</button>
          <button type="button" class="tg__cand" data-th="0.5" aria-pressed="false">0.5</button>
          <button type="button" class="tg__cand" data-th="1" aria-pressed="false">1</button>
        </div>
        <p class="tg__lightline">
          <span class="tg__led" id="tg-led" aria-hidden="true"></span>
          <span class="tg__state">
            <b class="tg__stcur" id="tg-state">Waiting</b>
            <span class="tg__sts" aria-hidden="true"><b>Waiting</b><b>Threshold reached</b></span>
          </span>
        </p>
      </div>
    </div>
    <footer class="tg__foot">The observer reports only when a threshold is crossed</footer>
  </section>
</main>
<script>
// Threshold gauge — 관찰자는 임계값 후보를 지날 때만 값을 보고한다
// 그래서 숫자와 게이지는 연속이 아니라 계단으로 갱신된다 (이것이 이 데모의 주제다)
var root = document.getElementById('tg');
var view = document.getElementById('tg-view');
var target = document.getElementById('tg-target');
var numEl = document.getElementById('tg-num');
var fill = document.getElementById('tg-fill');
var led = document.getElementById('tg-led');
var stateEl = document.getElementById('tg-state');
var cands = document.getElementById('tg-cands');
var selected = 0.25;
var lastRatio = 0;
var lastIn = false;
var started = false;

function paint(ratio, isIn) {
  numEl.textContent = ratio.toFixed(2);
  fill.style.transform = 'scaleX(' + ratio + ')';
  var on = isIn && ratio >= selected - 0.01;
  led.classList.toggle('is-on', on);
  stateEl.textContent = on ? 'Threshold reached' : 'Waiting';
  stateEl.classList.toggle('is-on', on);
}
function start() {
  if (started) return;
  started = true;
  root.classList.remove('is-demo');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      lastRatio = entry.intersectionRatio;
      lastIn = entry.isIntersecting;
      paint(lastRatio, lastIn);
    });
  }, { root: view, threshold: [0, 0.25, 0.5, 1] });
  io.observe(target);
}
view.addEventListener('scroll', start, { passive: true });
view.addEventListener('pointerdown', start);
view.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === ' ') start();
});
cands.addEventListener('click', function (e) {
  var btn = e.target.closest('.tg__cand');
  if (!btn) return;
  start();
  selected = parseFloat(btn.getAttribute('data-th'));
  var all = cands.querySelectorAll('.tg__cand');
  for (var i = 0; i < all.length; i++) {
    var on = all[i] === btn;
    all[i].classList.toggle('is-on', on);
    all[i].setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  paint(lastRatio, lastIn);
});
</script>
</body>
</html>
