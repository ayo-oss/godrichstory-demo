<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snap section switch — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="ss is-demo" id="ss" aria-label="Snap section switch demo">
    <header class="ss__head">
      <p class="ss__title">Snap section switch</p>
      <p class="ss__attr"><code>scroll-snap-type: y mandatory</code></p>
    </header>
    <div class="ss__view" id="ss-view" tabindex="0" role="region" aria-label="Three feature sections — scroll and each one snaps into the frame">
      <div class="ss__track" id="ss-track">
        <article class="ss__panel" aria-current="true">
          <b>01</b>
          <h3>One screen, one idea</h3>
          <p>Each section stops flat against the frame</p>
        </article>
        <article class="ss__panel">
          <b>02</b>
          <h3>Center detection</h3>
          <p>The observer picks the centered section</p>
        </article>
        <article class="ss__panel">
          <b>03</b>
          <h3>State handoff</h3>
          <p>The chosen section gets aria-current</p>
        </article>
      </div>
    </div>
    <footer class="ss__foot">
      <nav class="ss__dots" aria-label="Section navigation">
        <button class="ss__dot" type="button" aria-current="true" aria-label="Go to first section"></button>
        <button class="ss__dot" type="button" aria-label="Go to second section"></button>
        <button class="ss__dot" type="button" aria-label="Go to third section"></button>
      </nav>
      <span class="ss__state">The centered section gets <b>aria-current</b></span>
    </footer>
  </section>
</main>
<script>
// Snap section switch — CSS 의 scroll-snap-type 이 붙이고, 관찰자가 중앙에 온 섹션을 골라 aria-current 로 알린다
var root = document.getElementById('ss');
var view = document.getElementById('ss-view');
var panels = Array.prototype.slice.call(document.querySelectorAll('.ss__panel'));
var dots = Array.prototype.slice.call(document.querySelectorAll('.ss__dot'));
var started = false;

function pick(entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    var i = panels.indexOf(entry.target);
    if (i < 0) return;
    panels.forEach(function (panel, j) {
      if (j === i) { panel.setAttribute('aria-current', 'true'); }
      else { panel.removeAttribute('aria-current'); }
    });
    dots.forEach(function (dot, j) {
      if (j === i) { dot.setAttribute('aria-current', 'true'); }
      else { dot.removeAttribute('aria-current'); }
    });
  });
}

function goTo(i) {
  var target = panels[i];
  if (!target) return;
  // scroll-snap-align: center 기준 붙는 위치 = 패널 중심을 상자 중심에 맞춘 값
  var top = target.offsetTop - (view.clientHeight - target.offsetHeight) / 2;
  view.scrollTo({ top: top, behavior: 'smooth' });
}

function start() {
  root.classList.remove('is-demo');
  if (started) return;
  started = true;
  // 화면 가운데 10퍼센트 띠에 걸친 패널이 중앙 패널이다
  var io = new IntersectionObserver(pick, { root: view, rootMargin: '-45% 0px -45% 0px', threshold: 0 });
  panels.forEach(function (panel) { io.observe(panel); });
}
view.addEventListener('scroll', start, { passive: true });
view.addEventListener('pointerdown', start);
view.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'PageDown' || e.key === 'PageUp' || e.key === ' ') start();
});
dots.forEach(function (dot, i) {
  dot.addEventListener('click', function () { start(); goTo(i); });
});
</script>
</body>
</html>
