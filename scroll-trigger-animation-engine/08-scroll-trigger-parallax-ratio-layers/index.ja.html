<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three-layer parallax — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="px is-demo" id="px" aria-label="3層パララックスのデモ">
    <header class="px__head">
      <p class="px__title">3層パララックス</p>
      <p class="px__attr"><code>lerp(cur, tgt, 0.12)</code></p>
    </header>
    <div class="px__view" id="px-view" tabindex="0" role="region" aria-label="星と丘と文字のシーン — スクロールすると層ごとに違う距離で動きます">
      <div class="px__scene">
        <div class="px__layer px__layer--stars" data-rate="0.12" aria-hidden="true"></div>
        <div class="px__layer px__layer--hills" data-rate="0.3" aria-hidden="true">
          <svg class="px__hills" viewBox="0 0 320 130" preserveAspectRatio="none">
            <path class="px__hill px__hill--back" d="M0 130 L0 72 C 34 30, 84 16, 128 46 C 168 74, 206 78, 244 62 C 276 48, 302 52, 320 60 L320 130 Z"></path>
            <path class="px__hill px__hill--front" d="M0 130 L0 100 C 50 62, 100 68, 148 88 C 198 110, 250 92, 320 70 L320 130 Z"></path>
          </svg>
        </div>
        <div class="px__layer px__layer--type" data-rate="0.55">
          <p class="px__word">SCROLL</p>
        </div>
      </div>
      <div class="px__spacer" aria-hidden="true"></div>
    </div>
    <footer class="px__foot">
      <span class="px__dot" aria-hidden="true"></span>
      <span class="px__state">3つの層がそれぞれ違う係数で <b>translate3d</b></span>
    </footer>
  </section>
</main>
<script>
// 3層パララックス — 스크롤 위치를 매 프레임 lerp 로 좇아 층마다 다른 계수로 translate3d 를 건다
var root = document.getElementById('px');
var view = document.getElementById('px-view');
var layers = Array.prototype.slice.call(document.querySelectorAll('.px__layer'));
var current = 0;
var started = false;

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function frame() {
  var target = view.scrollTop;
  // 매 프레임 목표의 12 퍼센트씩 다가가므로 빠른 스크롤에도 끊기지 않고, 0.1px 안으로 좁혀지면 딱 맞춘다
  current = Math.abs(target - current) < 0.1 ? target : lerp(current, target, 0.12);
  for (var i = 0; i < layers.length; i++) {
    var rate = parseFloat(layers[i].getAttribute('data-rate')) || 0;
    layers[i].style.transform = 'translate3d(0, ' + (-current * rate).toFixed(2) + 'px, 0)';
  }
  requestAnimationFrame(frame);
}

function start() {
  root.classList.remove('is-demo');
  if (started) return;
  started = true;
  requestAnimationFrame(frame);
}
view.addEventListener('scroll', start, { passive: true });
view.addEventListener('pointerdown', start);
view.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'PageDown' || e.key === 'PageUp' || e.key === ' ') start();
});
</script>
</body>
</html>
