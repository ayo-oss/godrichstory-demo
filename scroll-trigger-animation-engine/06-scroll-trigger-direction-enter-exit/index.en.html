<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction enter exit — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="dt is-demo" id="dt" aria-label="Direction enter and exit demo">
    <header class="dt__head">
      <p class="dt__title">Direction enter and exit</p>
      <p class="dt__attr"><code>scrollTop</code></p>
    </header>
    <div class="dt__view" id="dt-view" tabindex="0" role="region" aria-label="Card list — the look changes with scroll direction">
      <div class="dt__track">
        <p class="dt__hint">Scroll down</p>
        <article class="dt__card" id="dt-card">
          <b>Work 07</b>
          <span>Tilts away as it passes downward</span>
        </article>
        <p class="dt__filler" aria-hidden="true">Next section</p>
      </div>
    </div>
    <footer class="dt__foot">
      <span class="dt__dirBox" aria-hidden="true">
        <span class="dt__dir dt__dir--down">
          <svg class="dt__ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="m200 144l-72 72l-72-72Z" opacity=".2"/><path d="M207.39 140.94A8 8 0 0 0 200 136h-64V40a8 8 0 0 0-16 0v96H56a8 8 0 0 0-5.66 13.66l72 72a8 8 0 0 0 11.32 0l72-72a8 8 0 0 0 1.73-8.72M128 204.69L75.31 152h105.38Z"/></g></svg>
          <span>Moving down</span>
        </span>
        <span class="dt__dir dt__dir--up">
          <svg class="dt__ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M200 112H56l72-72Z" opacity=".2"/><path d="m205.66 106.34l-72-72a8 8 0 0 0-11.32 0l-72 72A8 8 0 0 0 56 120h64v96a8 8 0 0 0 16 0v-96h64a8 8 0 0 0 5.66-13.66M75.31 104L128 51.31L180.69 104Z"/></g></svg>
          <span>Moving up</span>
        </span>
      </span>
      <span class="dt__phase">
        <span class="dt__phaseWait">Waiting for scroll</span>
        <span class="dt__phaseIn">Entering</span>
        <span class="dt__phaseOut">Exit detected</span>
      </span>
    </footer>
  </section>
</main>
<script>
// 방향 감지 — 직전 scrollTop 과 비교해 위로 가는지 아래로 가는지를 정하고
// 들어올 때(is-visible) 와 벗어날 때(is-exit) 모습을 다르게 쓴다
var root = document.getElementById('dt');
var view = document.getElementById('dt-view');
var card = document.getElementById('dt-card');
var lastY = view.scrollTop;
var curDir = 'down';
function readDir() {
  // 직전 스크롤 위치와 비교해 진행 방향을 정한다 — 아래로 가면 down, 위로 가면 up
  var y = view.scrollTop;
  if (y > lastY) curDir = 'down';
  else if (y < lastY) curDir = 'up';
  root.setAttribute('data-dir', curDir);
  lastY = y;
}
var met = false;
var io = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    // isIntersecting 이 바뀌는 순간마다 방향 값을 갱신한다 — 직전 비교값(curDir) 을 카드에 찍는다
    root.setAttribute('data-dir', curDir);
    card.setAttribute('data-dir', curDir);
    if (entry.isIntersecting) {
      met = true;
      card.classList.add('is-visible');
      card.classList.remove('is-exit');
      root.classList.add('is-enter');
      root.classList.remove('is-leave');
    } else if (met) {
      // 한 번이라도 들어온 뒤에만 퇴장으로 친다 — 첫 적재의 화면 밖 상태는 대기다
      card.classList.remove('is-visible');
      card.classList.add('is-exit');
      root.classList.add('is-leave');
      root.classList.remove('is-enter');
    }
  });
}, { root: view, threshold: 0.2 });
io.observe(card);
view.addEventListener('scroll', function () {
  root.classList.remove('is-demo');
  readDir();
}, { passive: true });
view.addEventListener('pointerdown', function () { root.classList.remove('is-demo'); });
view.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') root.classList.remove('is-demo');
});
</script>
</body>
</html>
