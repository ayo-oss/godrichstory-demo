<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velocity response — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="vl is-demo" id="vl" aria-label="Velocity response demo">
    <header class="vl__head">
      <p class="vl__title">Velocity response</p>
      <p class="vl__attr"><code>--vel</code></p>
    </header>
    <div class="vl__view" id="vl-view" tabindex="0" role="region" aria-label="Title preview — try scrolling fast">
      <div class="vl__track">
        <div class="vl__rule" aria-hidden="true"><span></span><span></span></div>
        <h2 class="vl__line">Scroll fast and</h2>
        <h2 class="vl__line">the type leans</h2>
        <h2 class="vl__line">and spreads</h2>
        <p class="vl__filler" aria-hidden="true">Next section</p>
      </div>
    </div>
    <footer class="vl__meter" aria-label="Scroll speed">
      <span class="vl__bar"><span class="vl__fill" id="vl-fill"></span></span>
      <b class="vl__num" id="vl-num">0.00</b>
    </footer>
  </section>
</main>
<script>
// Velocity response — 프레임 사이 이동량으로 스크롤 속도를 재고 --vel 커스텀 속성로 넘긴다
// CSS 는 그 값을 skewY 각도로 쓰고 각도는 clamp() 로 ±6deg 안에 묶인다. 속도가 0 이 되면 제자리로 돌아온다
var root = document.getElementById('vl');
var view = document.getElementById('vl-view');
var num = document.getElementById('vl-num');
var lastY = view.scrollTop;
var vel = 0;
function tick() {
  var y = view.scrollTop;
  var dy = Math.abs(y - lastY);
  lastY = y;
  // 이동량을 0~1 로 정규화해 여유있게 따라간다 — 급변하지 않고 멈추면 감쇠해 0 으로 돌아온다
  var target = Math.min(dy / 26, 1);
  vel += (target - vel) * 0.16;
  if (vel < 0.004) vel = 0;
  root.style.setProperty('--vel', vel.toFixed(4));
  // 읽는 순간의 --vel — 미리보기(.is-demo) 중에는 애니메이션 값이 인라인 값보다 우선한다
  var shown = parseFloat(getComputedStyle(root).getPropertyValue('--vel')) || 0;
  num.textContent = shown.toFixed(2);
  requestAnimationFrame(tick);
}
// reduce 에서는 속도 효과만 끈다 — 엔진을 돌리지 않아 --vel 은 0 그대로다 (기울기 0deg)
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(tick);
function start() { root.classList.remove('is-demo'); }
view.addEventListener('scroll', start, { passive: true });
view.addEventListener('pointerdown', start);
view.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') start();
});
</script>
</body>
</html>
