<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重み付き確率 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="wt" id="wt">
  <p class="wt__hint">マスの角度そのものが確率です — 重みを累積比率で分けて開始角・終了角を決めます</p>
  <div class="wt__row">
    <div class="wt__field" id="field" role="application" aria-label="重み付き確率実験盤" tabindex="0">
      <canvas class="wt__cv" id="cv"></canvas>
    </div>
    <div class="wt__side">
      <b class="wt__num" id="odds">0%</b>
      <span class="wt__unit">ポインターのマスの期待確率</span>
      <p class="wt__meta">試行 <b class="wt__count" id="tries">0</b><span class="wt__metaUnit">回</span></p>
      <p class="wt__meta">シード固定 mulberry32 — 回すたびに同じ系列の結果</p>
    </div>
  </div>
</div>
</main>
<script>
// 가중치 확률(04) — 모든 칸을 같은 각도로 그리면 マス 수만큼 균등 확률이 되지만,
// 항목마다 무게를 두면 시작각·끝각을 누적 비율로 잡아 각도 자체가 확률이 된다.
// 결과는 멈춘 뒤 각도로 판정하므로 조작 없이 눈에 보이는 확률 그대로 당첨된다.
// 난수는 mulberry32 로 시드를 고정한다 — 데모 재현성.
(function () {
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(332004);
  var root = document.getElementById('wt');
  var field = document.getElementById('field');
  var cv = document.getElementById('cv');
  var oddsEl = document.getElementById('odds');
  var triesEl = document.getElementById('tries');
  if (!root || !field || !cv || !oddsEl || !triesEl) return;
  var ctx = cv.getContext('2d');
  var css = getComputedStyle(root);
  var PAL = [];
  for (var i = 1; i <= 4; i++) PAL.push(css.getPropertyValue('--w' + i).trim());
  var INK = css.getPropertyValue('--ink').trim();
  var CREAM = css.getPropertyValue('--cream').trim();
  var TAU = Math.PI * 2;
  // 무게 — 각도 분할의 출처. 기대 비율 그대로 칸이 넓어진다
  var W = [5, 3, 2, 1, 3, 2];
  var TOT = W.reduce(function (a, b) { return a + b; }, 0);
  var bounds = [], acc = 0;
  for (var q = 0; q < W.length; q++) { bounds.push(acc / TOT); acc += W[q]; }
  bounds.push(1);

  var ang = -0.9, vel = 0, tries = 0;
  var FRICTION = 0.24, STOP = 0.5;
  var settle = -1, pulse = -1, dpr = 1, lastIdx = -1;
  var flicks = [11, -8, 13];
  var fi = 1;

  function fit() {
    var w = field.clientWidth, h = field.clientHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }

  function norm(a) { a %= TAU; return a < 0 ? a + TAU : a; }
  // 停止角度 → 부채꼴 인덱스 (12시 고정 포인터)
  function idxAt(a) {
    var u = norm(-Math.PI / 2 - a);
    for (var k = 0; k < W.length; k++) if (u >= bounds[k] && u < bounds[k + 1]) return k;
    return W.length - 1;
  }

  function draw() {
    var w = cv.width / dpr, h = cv.height / dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 10;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
    for (var k = 0; k < W.length; k++) {
      var a0 = bounds[k] * TAU, a1 = bounds[k + 1] * TAU;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, a0, a1); ctx.closePath();
      ctx.fillStyle = PAL[k % PAL.length]; ctx.fill();
      ctx.strokeStyle = 'rgba(23,20,26,.20)'; ctx.lineWidth = 1; ctx.stroke();
      // 무게 라벨 — マス 가운데 각도에 확률 % 를 적는다
      var mid = (a0 + a1) / 2;
      ctx.save(); ctx.rotate(mid);
      ctx.fillStyle = INK;
      ctx.font = '700 12px sans-serif';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(Math.round(W[k] / TOT * 100) + '%', R - 12, 0);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU);
    ctx.fillStyle = CREAM; ctx.fill(); ctx.strokeStyle = 'rgba(23,20,26,.35)'; ctx.stroke();
    if (pulse >= 0) {
      ctx.beginPath(); ctx.arc(0, 0, 13 + pulse * 22, 0, TAU);
      ctx.strokeStyle = 'rgba(23,20,26,' + (1 - pulse) * 0.5 + ')';
      ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.restore();
    ctx.beginPath();
    ctx.moveTo(cx - 7, cy - R - 8); ctx.lineTo(cx + 7, cy - R - 8); ctx.lineTo(cx, cy - R + 8);
    ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
  }

  var drag = { on: false, lastA: 0, lastT: 0, v: 0 };
  function angleAt(e) {
    var b = field.getBoundingClientRect();
    return Math.atan2(e.clientY - (b.top + b.height / 2), e.clientX - (b.left + b.width / 2));
  }
  field.addEventListener('pointerdown', function (e) {
    drag.on = true; drag.lastA = angleAt(e); drag.lastT = performance.now(); drag.v = 0;
    if (field.setPointerCapture) { try { field.setPointerCapture(e.pointerId); } catch (err) { /* 캡처 실패는 회전에 영향 없다 */ } }
  });
  field.addEventListener('pointermove', function (e) {
    if (!drag.on) return;
    var a = angleAt(e), now = performance.now();
    var dA = a - drag.lastA;
    if (dA > Math.PI) dA -= TAU;
    if (dA < -Math.PI) dA += TAU;
    ang += dA;
    var dt = Math.max(1, now - drag.lastT) / 1000;
    drag.v = 0.65 * drag.v + 0.35 * (dA / dt);
    drag.lastA = a; drag.lastT = now;
    idle = 0;
  });
  function endDrag() {
    if (!drag.on) return;
    drag.on = false;
    // 손으로 뗀 스픈은 Math.random 가감 — 자동 루프(시드 고정)와 달리 사람 손에 온도를 준다
    vel = Math.max(-24, Math.min(24, drag.v * (0.85 + Math.random() * 0.3)));
    if (Math.abs(vel) < 1) vel = flicks[0];
    settle = -1; pulse = -1;
    tries++; triesEl.textContent = String(tries);
  }
  field.addEventListener('pointerup', endDrag);
  field.addEventListener('pointercancel', endDrag);
  field.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      vel = flicks[fi++ % flicks.length];
      settle = -1; pulse = -1;
      tries++; triesEl.textContent = String(tries);
    }
  });

  var idle = 0;
  function auto(dt) {
    if (idle > 0) { idle -= dt; return; }
    if (settle >= 0) {
      settle += dt; pulse = Math.min(1, settle / 0.3);
      if (settle > 0.4) {
        vel = flicks[Math.floor(rnd() * flicks.length)] * (0.8 + rnd() * 0.5);
        fi++;
        settle = -1; pulse = -1;
        tries++; triesEl.textContent = String(tries);
      }
      return;
    }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var last = performance.now();
  function step(now) {
    var dt = Math.min(64, now - last) / 1000; last = now;
    if (!drag.on) {
      if (vel !== 0) {
        ang += vel * dt;
        vel *= Math.pow(FRICTION, dt);
        if (Math.abs(vel) < STOP) { vel = 0; settle = 0; pulse = 0; }
      } else { auto(dt); }
    }
    draw();
    var idx = idxAt(ang);
    if (idx !== lastIdx) {
      oddsEl.textContent = Math.round(W[idx] / TOT * 100) + '%';
      lastIdx = idx;
    }
    requestAnimationFrame(step);
  }

  fit();
  window.addEventListener('resize', fit);
  if (reduce) {
    // 정지 한 장 — 펄스 링이 퍼진 상태로 고정하고 루프는 돌지 않는다
    pulse = 0.4;
    draw();
    oddsEl.textContent = Math.round(W[idxAt(ang)] / TOT * 100) + '%';
    root.classList.add('is-still');
  } else {
    vel = flicks[0];
    tries = 1; triesEl.textContent = '1';
    requestAnimationFrame(step);
  }
})();
</script>
</body>
</html>
