<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elimination mode — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="el" id="el">
  <p class="el__hint">Drawn sectors drop out and angles redistribute over the rest — undo included</p>
  <div class="el__row">
    <div class="el__field" id="field" role="application" aria-label="Elimination mode lab" tabindex="0">
      <canvas class="el__cv" id="cv"></canvas>
    </div>
    <div class="el__side">
      <b class="el__num" id="left">6</b>
      <span class="el__unit">entries left — shrinks as they are drawn</span>
      <div class="el__log" id="log"></div>
      <button class="el__btn" id="btn" type="button">Undo the last draw</button>
    </div>
  </div>
</div>
</main>
<script>
// Rounds 뽑기 탈락 모드(08) — 뽑힌 항목을 목록에서 빼고 남은 항목으로 각도를 재분배하면
// 발표자 뽑기·빙고 뽑기가 된다. 당첨자는 사이드 기록 판에 옮겨 적히고 되돌리기로
// 직전 뽑기를 취소할 수 있다. 확정 전 미리보기 칸은 반투명이 아니라 채도만 낮춘다.
(function () {
  var root = document.getElementById('el');
  var field = document.getElementById('field');
  var cv = document.getElementById('cv');
  var leftEl = document.getElementById('left');
  var logEl = document.getElementById('log');
  var btnEl = document.getElementById('btn');
  if (!root || !field || !cv || !leftEl || !logEl || !btnEl) return;
  var ctx = cv.getContext('2d');
  var css = getComputedStyle(root);
  var PAL = [];
  for (var i = 1; i <= 6; i++) PAL.push(css.getPropertyValue('--w' + i).trim());
  var INK = css.getPropertyValue('--ink').trim();
  var CREAM = css.getPropertyValue('--cream').trim();
  var TAU = Math.PI * 2;
  var ALL = ['Haneul Kim', 'Junho Lee', 'Seoyeon Park', 'Doyun Choi', 'Minjun Jung', 'Sua Han'];
  var alive = [0, 1, 2, 3, 4, 5];  // 살아있는 항목 인덱스 — PAL·ALL 둘 다 이 숫자로 본다
  var log = [];                  // 뽑힌 순서 — 되돌리기의 재료

  var ang = -0.5, vel = 0;
  var FRICTION = 0.28, STOP = 0.5;
  var settle = -1, pulse = -1, dpr = 1;
  var previewIdx = -1;           // 정지 직후 확정 전 하이라이트
  var flicks = [9, -11, 7.5, 12];
  var fi = 0, idle = 0, empty = 0;

  function fit() {
    var w = field.clientWidth, h = field.clientHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  function norm(a) { a %= TAU; return a < 0 ? a + TAU : a; }
  function idxAt(a) {
    var n = alive.length;
    return n ? Math.floor(norm(-Math.PI / 2 - a) / (TAU / n)) % n : -1;
  }
  // hex 채도를 낮춘 미리보기 색 — 반투명이 아니라 채도 조절이라 유령이 안 생긴다
  function desat(hex) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    var avg = (r + g + b) / 3;
    r = Math.round(r * 0.45 + avg * 0.55);
    g = Math.round(g * 0.45 + avg * 0.55);
    b = Math.round(b * 0.45 + avg * 0.55);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function draw() {
    var w = cv.width / dpr, h = cv.height / dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var n = alive.length, seg = TAU / n;
    var cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 10;
    if (!n) {
      ctx.fillStyle = INK;
      ctx.font = '700 13px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('All drawn', cx, cy);
      return;
    }
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
    for (var k = 0; k < n; k++) {
      var a0 = k * seg;
      var base = PAL[alive[k] % PAL.length];
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, a0, a0 + seg); ctx.closePath();
      ctx.fillStyle = (settle >= 0 && k === previewIdx) ? desat(base) : base;
      ctx.fill();
      ctx.strokeStyle = 'rgba(23,20,26,.20)'; ctx.lineWidth = 1; ctx.stroke();
      var mid = a0 + seg / 2;
      ctx.save(); ctx.rotate(mid);
      ctx.fillStyle = INK;
      ctx.font = '700 11px sans-serif';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(ALL[alive[k]], R - 12, 0);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU);
    ctx.fillStyle = CREAM; ctx.fill(); ctx.strokeStyle = 'rgba(23,20,26,.35)'; ctx.stroke();
    if (pulse >= 0) {
      ctx.beginPath(); ctx.arc(0, 0, 12 + pulse * 20, 0, TAU);
      ctx.strokeStyle = 'rgba(23,20,26,' + (1 - pulse) * 0.5 + ')';
      ctx.lineWidth = 2; ctx.stroke();
    }
    // 확정 마커 — 뽑혀서 빠진 인원수만큼 허브 아래 사각 칩(fillRect)으로 쌓는다
    var done = ALL.length - alive.length;
    for (var d2 = 0; d2 < done; d2++) {
      ctx.fillStyle = PAL[d2 % PAL.length];
      ctx.fillRect(-9 + d2 * 4.4, 18, 3.4, 3.4);
    }
    ctx.restore();
    ctx.beginPath();
    ctx.moveTo(cx - 6, cy - R - 8); ctx.lineTo(cx + 6, cy - R - 8); ctx.lineTo(cx, cy - R + 7);
    ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
  }

  function renderLog() {
    logEl.textContent = '';
    for (var q = log.length - 1; q >= 0; q--) {
      var row = document.createElement('span');
      row.className = 'el__chip';
      row.textContent = (q + 1) + 'No. ' + ALL[log[q]];
      logEl.appendChild(row);
    }
    leftEl.textContent = String(alive.length);
    btnEl.disabled = !log.length;
  }

  // 확정 — 뽑힌 항목을 빼고 각도를 재분배한다
  function commit() {
    if (previewIdx < 0 || !alive.length) return;
    var winner = alive.splice(previewIdx, 1)[0];
    log.push(winner);
    previewIdx = -1; settle = -1; pulse = -1;
    renderLog();
  }

  btnEl.addEventListener('click', function () {
    if (!log.length) return;
    var back = log.pop();
    alive.push(back);
    previewIdx = -1; settle = -1; pulse = -1;
    renderLog();
    idle = 0.8;
  });

  var drag = { on: false, lastA: 0, lastT: 0, v: 0 };
  function angleAt(e) {
    var b = field.getBoundingClientRect();
    return Math.atan2(e.clientY - (b.top + b.height / 2), e.clientX - (b.left + b.width / 2));
  }
  field.addEventListener('pointerdown', function (e) {
    drag.on = true; drag.lastA = angleAt(e); drag.lastT = performance.now(); drag.v = 0;
    if (field.setPointerCapture) { try { field.setPointerCapture(e.pointerId); } catch (err) { /* 캡처 실패는 회전에 영향 없다 */ } }
  });
  field.addEventListener('pointermove', function (e) {
    if (!drag.on) return;
    var a = angleAt(e), now = performance.now();
    var dA = a - drag.lastA;
    if (dA > Math.PI) dA -= TAU;
    if (dA < -Math.PI) dA += TAU;
    ang += dA;
    var dt = Math.max(1, now - drag.lastT) / 1000;
    drag.v = 0.65 * drag.v + 0.35 * (dA / dt);
    drag.lastA = a; drag.lastT = now;
    idle = 0;
  });
  function endDrag() {
    if (!drag.on) return;
    drag.on = false;
    vel = Math.max(-20, Math.min(20, drag.v));
    if (Math.abs(vel) < 1.5) vel = flicks[0];
    settle = -1; pulse = -1;
  }
  field.addEventListener('pointerup', endDrag);
  field.addEventListener('pointercancel', endDrag);
  field.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (alive.length) { vel = flicks[fi++ % flicks.length]; settle = -1; pulse = -1; }
    }
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var last = performance.now();
  function step(now) {
    var dt = Math.min(64, now - last) / 1000; last = now;
    if (!drag.on) {
      if (vel !== 0) {
        ang += vel * dt;
        vel *= Math.pow(FRICTION, dt);
        if (Math.abs(vel) < STOP) { vel = 0; settle = 0; pulse = 0; previewIdx = idxAt(ang); }
      } else if (idle > 0) { idle -= dt; }
      else if (settle >= 0) {
        settle += dt; pulse = Math.min(1, settle / 0.3);
        if (settle > 0.62) {
          commit();                       // 확정 — 칸이 빠지고 재분배
          if (alive.length) { vel = flicks[fi++ % flicks.length]; settle = -1; pulse = -1; }
        }
      } else if (alive.length) {
        vel = flicks[fi++ % flicks.length];
      } else {
        // All drawn — 잠깐 보여 주고 처음부터 다시 시작한다
        empty += dt;
        if (empty > 0.7) {
          alive = [0, 1, 2, 3, 4, 5]; log = []; previewIdx = -1; empty = 0;
          renderLog();
          vel = flicks[fi++ % flicks.length];
        }
      }
    }
    draw();
    requestAnimationFrame(step);
  }

  fit();
  renderLog();
  window.addEventListener('resize', fit);
  if (reduce) {
    // 정지 한 장 — 두 명이 빠진 상태로 고정하고 루프는 돌지 않는다
    alive = [0, 1, 3, 5];
    log = [4, 2];
    ang = -0.5 + 2.2;
    renderLog();
    draw();
    root.classList.add('is-still');
  } else {
    vel = flicks[fi++ % flicks.length];
    requestAnimationFrame(step);
  }
})();
</script>
</body>
</html>
