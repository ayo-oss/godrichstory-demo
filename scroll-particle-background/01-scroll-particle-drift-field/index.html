<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기본 흐름장 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sp" id="sp">
  <p class="sp__hint">
    <svg class="sp__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M232 128a104 104 0 0 1-208 0c0-41 23.81-78.36 60.66-95.27a8 8 0 0 1 6.68 14.54C60.15 61.59 40 93.27 40 128a88 88 0 0 0 176 0c0-34.73-20.15-66.41-51.34-80.73a8 8 0 0 1 6.68-14.54C208.19 49.64 232 87 232 128"/></g></svg>
    <span>끌어올리면 기준 흐름 위에 바람 값이 겹쳐집니다</span>
  </p>
  <div class="sp__viewport" id="viewport" tabindex="0" role="region" aria-label="파티클 흐름 스크롤 영역">
    <canvas class="sp__cv" id="cv" aria-hidden="true"></canvas>
    <b class="sp__val" id="val" aria-hidden="true">0%</b>
    <div class="sp__track" aria-hidden="true"></div>
  </div>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('sp');
  var viewport = document.getElementById('viewport');
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var val = document.getElementById('val');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isDemo = true;

  // 결정론 난수 — 이 데모는 Math.random 을 쓰지 않는다. LCG(선형합동생성기) 하나로 파티클을 배치한다.
  function makeLcg(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  var rng = makeLcg(9001);

  var css = getComputedStyle(root);
  var PARTICLE_COLOR = css.getPropertyValue('--particle-color').trim() || '#6ec8ff';

  // 계산 겹: 속도장(velocity field) — 상승 속도는 상수, 가로 바람은 위치(y)마다 다른 위상의 사인파다.
  // 스크롤 속도 값이 이 바람의 세기를 정한다. 스크롤이 0이어도 상승은 멈추지 않는다.
  var RISE_SPEED = 26;      // 기준 상승 속도 (px/s)
  var WIND_GAIN = 1.6;      // 스크롤 속도(px/s) → 가로 바람(px/s) 변환 계수
  var FIELD_FREQ = 0.02;    // 속도장의 공간 주파수 — 높이마다 바람 방향이 달라진다
  var SWAY_AMP = 9;         // 속도장 자체의 흔들림 진폭 (px/s)
  var COUNT = 46;

  var W = 0, H = 0, dpr = 1;
  var particles = [];

  function fit() {
    var r = viewport.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawnAt(p, first) {
    p.x = rng() * W;
    p.y = first ? rng() * H : H + rng() * 24;
    p.r = 1.3 + rng() * 2.4;
    p.speedVar = 0.6 + rng() * 0.8;
    p.phase = rng() * Math.PI * 2;
    p.alpha = 0.34 + rng() * 0.5;
  }

  function initParticles() {
    particles = [];
    for (var i = 0; i < COUNT; i++) { var p = {}; spawnAt(p, true); particles.push(p); }
  }

  // ── 스크롤 표본기 — 위치·속도·방향·정지시간을 한 곳에서 잰다(9종 공통 패턴) ──────
  var scrollPos = 0, scrollVel = 0, scrollDir = 0, idleMs = 0, lastTop = 0, lastT = 0;
  function sampleScroll(now) {
    var top = viewport.scrollTop;
    var max = Math.max(1, viewport.scrollHeight - viewport.clientHeight);
    scrollPos = top / max;
    var dt = lastT ? Math.max(1, now - lastT) : 16;
    var v = (top - lastTop) / dt * 1000;
    scrollVel += (v - scrollVel) * 0.3;
    if (Math.abs(scrollVel) > 4) { scrollDir = scrollVel > 0 ? 1 : -1; idleMs = 0; } else { idleMs += dt; }
    lastTop = top; lastT = now;
  }
  viewport.addEventListener('scroll', function () {
    sampleScroll(performance.now());
    if (reduce) paintStatic();
  });

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }
  ['wheel', 'touchstart', 'pointerdown'].forEach(function (evt) {
    viewport.addEventListener(evt, human, { passive: true });
  });

  function step(dtSec) {
    var wind = scrollVel * WIND_GAIN;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.y -= RISE_SPEED * p.speedVar * dtSec;
      var sway = Math.sin(p.y * FIELD_FREQ + p.phase) * SWAY_AMP;
      p.x += (wind + sway) * dtSec;
      if (p.y < -8) spawnAt(p, false);
      if (p.x < -8) p.x = W + 8; else if (p.x > W + 8) p.x = -8;
    }
  }

  function paint() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = PARTICLE_COLOR;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = p.alpha;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function updateVal() { val.textContent = Math.round(scrollPos * 100) + '%'; }

  function paintStatic() {
    // reduce — 시간 적분을 멈추고 스크롤 위치 값만 가로 오프셋으로 반영한 정지 장면
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = PARTICLE_COLOR;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var sway = Math.sin(p.y * FIELD_FREQ + p.phase) * SWAY_AMP * 0.06;
      var x = ((p.x + sway + scrollPos * 30) % W + W) % W;
      ctx.globalAlpha = p.alpha;
      ctx.beginPath(); ctx.arc(x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    updateVal();
  }

  var lastFrameT = 0;
  function frame(now) {
    if (!lastFrameT) lastFrameT = now;
    var dtSec = Math.min(0.05, (now - lastFrameT) / 1000);
    lastFrameT = now;
    step(dtSec);
    paint();
    updateVal();
    requestAnimationFrame(frame);
  }

  var DRIVE_PERIOD_MS = 2000; // 렌더 캡처 창(설정 `초`)과 같은 주기 — 루프 한 바퀴가 캡처 안에 온전히 들어간다
  var driveStart = 0;
  function triangle(frac) { return frac < 0.5 ? frac * 2 : 2 - frac * 2; }
  function driveTick(now) {
    if (!driveStart) driveStart = now;
    if (isDemo && !reduce) {
      var frac = ((now - driveStart) % DRIVE_PERIOD_MS) / DRIVE_PERIOD_MS;
      var w = triangle(frac);
      var max = Math.max(1, viewport.scrollHeight - viewport.clientHeight);
      viewport.scrollTop = w * max;
    }
    requestAnimationFrame(driveTick);
  }

  window.addEventListener('resize', fit);
  fit();
  initParticles();

  if (reduce) {
    root.classList.add('is-still');
    sampleScroll(performance.now());
    paintStatic();
  } else {
    requestAnimationFrame(frame);
    requestAnimationFrame(driveTick);
  }
})();
</script>
</body>
</html>
