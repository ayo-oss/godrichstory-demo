<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>격자 바닥 밀고 키우기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ng is-demo" id="ng">
  <div class="ng__canvas" id="ngCanvas">
    <div class="ng__world" id="ngWorld">
      <svg class="ng__wires" viewBox="0 0 400 224" preserveAspectRatio="none" aria-hidden="true">
        <path class="ng__wire" d="M168,81 C196,81 156,134 184,134"/>
        <path class="ng__wire" d="M264,134 C292,134 252,67 280,67"/>
      </svg>
      <div class="ng__node ng__node--a">
        <span class="ng__port ng__port--in" aria-hidden="true"></span>
        <span class="ng__name">수집</span>
        <span class="ng__port ng__port--out" aria-hidden="true"></span>
      </div>
      <div class="ng__node ng__node--b">
        <span class="ng__port ng__port--in" aria-hidden="true"></span>
        <span class="ng__name">정리</span>
        <span class="ng__port ng__port--out" aria-hidden="true"></span>
      </div>
      <div class="ng__node ng__node--c">
        <span class="ng__port ng__port--in" aria-hidden="true"></span>
        <span class="ng__name">전송</span>
        <span class="ng__port ng__port--out" aria-hidden="true"></span>
      </div>
    </div>
    <span class="ng__chip">격자 바닥</span>
    <div class="ng__tools">
      <span class="ng__zoom" title="배율">
        <b class="ng__zoomNow" id="ngZoom">100%</b>
        <b class="ng__zoomAlt" aria-hidden="true">120%</b>
      </span>
      <button type="button" class="ng__btn" id="ngOut" aria-label="축소"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="ng__ico" aria-hidden="true"><path d="M192,112a80,80,0,1,1-80-80A80,80,0,0,1,192,112Z" opacity="0.2"/><path d="M229.66,218.34,179.6,168.28a88.21,88.21,0,1,0-11.32,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Zm112,0a8,8,0,0,1-8,8H80a8,8,0,0,1,0-16h64A8,8,0,0,1,152,112Z"/></svg></button>
      <button type="button" class="ng__btn" id="ngIn" aria-label="확대"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="ng__ico" aria-hidden="true"><path d="M192,112a80,80,0,1,1-80-80A80,80,0,0,1,192,112Z" opacity="0.2"/><path d="M229.66,218.34,179.6,168.28a88.21,88.21,0,1,0-11.32,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Zm112,0a8,8,0,0,1-8,8H120v24a8,8,0,0,1-16,0V120H80a8,8,0,0,1,0-16h24V80a8,8,0,0,1,16,0v24h24A8,8,0,0,1,152,112Z"/></svg></button>
      <button type="button" class="ng__btn" id="ngHome" aria-label="가운데로"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="ng__ico" aria-hidden="true"><path d="M232,128,128,232,24,128,128,24Z" opacity="0.2"/><path d="M90.34,61.66a8,8,0,0,1,0-11.32l32-32a8,8,0,0,1,11.32,0l32,32a8,8,0,0,1-11.32,11.32L136,43.31V96a8,8,0,0,1-16,0V43.31L101.66,61.66A8,8,0,0,1,90.34,61.66Zm64,132.68L136,212.69V160a8,8,0,0,0-16,0v52.69l-18.34-18.35a8,8,0,0,0-11.32,11.32l32,32a8,8,0,0,0,11.32,0l32-32a8,8,0,0,0-11.32-11.32Zm83.32-72-32-32a8,8,0,0,0-11.32,11.32L212.69,120H160a8,8,0,0,0,0,16h52.69l-18.35,18.34a8,8,0,0,0,11.32,11.32l32-32A8,8,0,0,0,237.66,122.34ZM43.31,136H96a8,8,0,0,0,0-16H43.31l18.35-18.34A8,8,0,0,0,50.34,90.34l-32,32a8,8,0,0,0,0,11.32l32,32a8,8,0,0,0,11.32-11.32Z"/></svg></button>
    </div>
  </div>
</div>
</main>
<script>
(function () {
  var ng = document.getElementById('ng');
  var canvas = document.getElementById('ngCanvas');
  var world = document.getElementById('ngWorld');
  var zoomText = document.getElementById('ngZoom');
  var panX = 0, panY = 0, zoom = 1, from = null;

  function apply() {
    // 격자와 노드 레이어에 같은 거리를 준다. 한쪽만 움직이면 바닥이 노드 밑에서 미끄러져 보인다
    canvas.style.backgroundPosition = panX + 'px ' + panY + 'px';
    world.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + zoom + ')';
    zoomText.textContent = Math.round(zoom * 100) + '%';
  }
  function stopDemo() { ng.classList.remove('is-demo'); }
  function setZoom(next) {
    stopDemo();
    zoom = Math.min(2, Math.max(0.6, Math.round(next * 10) / 10));
    apply();
  }
  canvas.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.ng__btn')) return;
    stopDemo();
    from = { x: e.clientX - panX, y: e.clientY - panY };
    canvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!from) return;
    panX = e.clientX - from.x;
    panY = e.clientY - from.y;
    apply();
  });
  function stop() { from = null; }
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);
  document.getElementById('ngIn').addEventListener('click', function () { setZoom(zoom + 0.2); });
  document.getElementById('ngOut').addEventListener('click', function () { setZoom(zoom - 0.2); });
  document.getElementById('ngHome').addEventListener('click', function () {
    stopDemo(); panX = 0; panY = 0; zoom = 1; apply();
  });
})();
</script>
</body>
</html>
