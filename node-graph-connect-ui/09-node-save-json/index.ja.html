<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그린 것을 JSON 으로 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ng is-demo" id="ng">
  <div class="ng__board" id="ngCanvas">
    <span class="ng__chip">グラフ</span>
    <svg class="ng__wires" viewBox="0 0 152 196" preserveAspectRatio="none" aria-hidden="true">
      <path class="ng__wire" d="M52,51 C52,67 94,67 94,82"/>
      <path class="ng__wire" d="M94,118 C94,132 52,132 52,145"/>
    </svg>
    <div class="ng__node ng__node--a" data-id="in">
      <span class="ng__name">入力</span>
      <span class="ng__port ng__port--out" aria-hidden="true"></span>
    </div>
    <div class="ng__node ng__node--b" data-id="map">
      <span class="ng__port ng__port--in" aria-hidden="true"></span>
      <span class="ng__name">変換</span>
      <span class="ng__port ng__port--out" aria-hidden="true"></span>
    </div>
    <div class="ng__node ng__node--c" data-id="out">
      <span class="ng__port ng__port--in" aria-hidden="true"></span>
      <span class="ng__name">出力</span>
    </div>
  </div>
  <div class="ng__panel">
    <div class="ng__head">
      <span class="ng__brace" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="ng__ico"><path d="M240,128c-64,0,0,88-64,88H80c-64,0,0-88-64-88,64,0,0-88,64-88h96C240,40,176,128,240,128Z" opacity="0.2"/><path d="M43.18,128a29.78,29.78,0,0,1,8,10.26c4.8,9.9,4.8,22,4.8,33.74,0,24.31,1,36,24,36a8,8,0,0,1,0,16c-17.48,0-29.32-6.14-35.2-18.26-4.8-9.9-4.8-22-4.8-33.74,0-24.31-1-36-24-36a8,8,0,0,1,0-16c23,0,24-11.69,24-36,0-11.72,0-23.84,4.8-33.74C50.68,38.14,62.52,32,80,32a8,8,0,0,1,0,16C57,48,56,59.69,56,84c0,11.72,0,23.84-4.8,33.74A29.78,29.78,0,0,1,43.18,128ZM240,120c-23,0-24-11.69-24-36,0-11.72,0-23.84-4.8-33.74C205.32,38.14,193.48,32,176,32a8,8,0,0,0,0,16c23,0,24,11.69,24,36,0,11.72,0,23.84,4.8,33.74a29.78,29.78,0,0,0,8,10.26,29.78,29.78,0,0,0-8,10.26c-4.8,9.9-4.8,22-4.8,33.74,0,24.31-1,36-24,36a8,8,0,0,0,0,16c17.48,0,29.32-6.14,35.2-18.26,4.8-9.9,4.8-22,4.8-33.74,0-24.31,1-36,24-36a8,8,0,0,0,0-16Z"/></svg></span>
      <span class="ng__file">graph.json</span>
      <button type="button" class="ng__copy" id="ngCopy" aria-label="JSONをコピー"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="ng__ico" aria-hidden="true"><path d="M216,40V168H168V88H88V40Z" opacity="0.2"/><path d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z"/></svg></button>
    </div>
    <pre class="ng__code" id="ngCode"></pre>
  </div>
  <p class="ng__toast" id="ngToast" aria-live="polite" data-tpl="N行コピーしました" data-fail="コピー失敗 — テキストを直接選択してください">
    <span class="ng__tick" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="ng__ico"><path d="M224,128a96,96,0,1,1-96-96A96,96,0,0,1,224,128Z" opacity="0.2"/><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/></svg></span><span class="ng__toastText" id="ngToastText">29行コピーしました</span></p>
</div>
</main>
<script>
(function () {
  var ng = document.getElementById('ng');
  var board = document.getElementById('ngCanvas');
  var code = document.getElementById('ngCode');
  var copyBtn = document.getElementById('ngCopy');
  var toast = document.getElementById('ngToast');
  var toastText = document.getElementById('ngToastText');
  var nodes = board.querySelectorAll('.ng__node');
  var hideTimer = 0;

  function build() {
    // 화면에 놓인 노드를 그대로 훑어 객체로 만든다 — 아래 글자는 전부 이 객체에서 나온 것이다
    var b = board.getBoundingClientRect();
    var graph = { nodes: [], links: [] };
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect();
      graph.nodes.push({
        id: nodes[i].getAttribute('data-id'),
        x: Math.round(r.left - b.left),
        y: Math.round(r.top - b.top)
      });
    }
    for (var j = 1; j < graph.nodes.length; j++) {
      graph.links.push({ from: graph.nodes[j - 1].id, to: graph.nodes[j].id });
    }
    return JSON.stringify(graph, null, 2);
  }
  function paint(text) {
    code.textContent = '';
    var rows = text.split('\n');
    for (var i = 0; i < rows.length; i++) {
      var row = document.createElement('span');
      row.className = 'ng__line';
      row.textContent = rows[i];
      code.appendChild(row);
    }
  }
  function say(text) {
    toastText.textContent = text;
    toast.classList.add('is-on');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { toast.classList.remove('is-on'); }, 1600);
  }
  var json = build();
  paint(json);
  copyBtn.addEventListener('click', function () {
    ng.classList.remove('is-demo');
    var count = json.split('\n').length;     // 몇 줄인지는 글자를 직접 세어 말한다
    var job = navigator.clipboard ? navigator.clipboard.writeText(json) : Promise.reject();
    job.then(function () {
      say(toast.getAttribute('data-tpl').replace('N', String(count)));
    }, function () {
      say(toast.getAttribute('data-fail'));
      var range = document.createRange();
      range.selectNodeContents(code);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });
  });
})();
</script>
</body>
</html>
