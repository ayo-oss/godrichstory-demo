<script>
const root = document.getElementById('ng');
const runButton = document.getElementById('ngRun');
const live = document.getElementById('ngLive');
const cards = Array.prototype.slice.call(document.querySelectorAll('.ng__card'));
const RESULT = ['done', 'done', 'fail'];
const LINE = { wait: '대기 중 · 3단계', run: '실행 중 · 3단계', end: '성공 2 · 실패 1' };
let timers = [];

function runPipeline() {
  root.classList.remove('is-demo');
  timers.forEach(function (id) { clearTimeout(id); });
  timers = [];
  cards.forEach(function (card) { card.setAttribute('data-state', 'wait'); });
  live.textContent = LINE.wait;
  cards.forEach(function (card, i) {
    timers.push(setTimeout(function () {
      card.setAttribute('data-state', 'run');
      if (i === 0) { live.textContent = LINE.run; }
    }, 300 + i * 600));
    timers.push(setTimeout(function () {
      card.setAttribute('data-state', RESULT[i]);
      if (i === cards.length - 1) { live.textContent = LINE.end; }
    }, 1100 + i * 600));
  });
}

runButton.addEventListener('click', runPipeline);
</script>
