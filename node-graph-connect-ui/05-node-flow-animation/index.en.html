<body>
<main class="stage">
<div class="ng is-demo" id="ng">

  <path class="ng__wire ng__wire--run" d="M122,85 C176,85 224,132 278,132"/>

  <circle class="ng__ring" cx="278" cy="132" r="6"/>

  <!-- 흐르는 점 셋. offset-path 의 좌표는 위 선의 d 와 **글자 그대로 같은 문자열**이라 좌표계가 어긋날 수 없다 -->
  <circle class="ng__dot ng__dot--1" cx="0" cy="0" r="4.5"/>

    <text class="ng__label" x="68" y="103" text-anchor="middle">Form intake</text>

    <circle class="ng__port" cx="278" cy="38" r="4.5"/>

</svg>

<div class="ng__bar">
  <button type="button" class="ng__toggle" id="ngToggle" aria-pressed="false">Pause flow</button>
</div>
</div>
</main>
<script>
var root = document.getElementById('ng');
var toggle = document.getElementById('ngToggle');

toggle.addEventListener('click', function () {
  root.classList.remove('is-demo');
  var paused = root.classList.toggle('is-paused');
  toggle.setAttribute('aria-pressed', String(paused));
  toggle.textContent = paused ? 'Play flow' : 'Pause flow';
});
</script>
</body>
</html>
