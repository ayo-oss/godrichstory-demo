<script>
var root = document.getElementById('ng');
var cutButtons = document.querySelectorAll('.ng__cut');

function toggleWire(button) {
  root.classList.remove('is-demo');
  var wrap = button.closest('.ng__wirewrap');
  var isCut = wrap.classList.toggle('is-cut');
  button.setAttribute('aria-pressed', String(isCut));
  button.setAttribute('aria-label', isCut ? '다시 잇기' : '연결 끊기');
}

for (var i = 0; i < cutButtons.length; i++) {
  cutButtons[i].addEventListener('click', function () { toggleWire(this); });
  cutButtons[i].addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggleWire(this); }
  });
}
</script>
