  </svg>

</main>
<script>
var VIEW_W = 400;                   // viewBox 가로 — 화면 px 를 이 좌표계로 되돌릴 때 쓴다
var SNAP = 28;                      // 받는 점 중심에서 이 거리 안이면 달라붙는다
var ng = document.getElementById('ng');
var svg = document.getElementById('ngSvg');
var temp = document.getElementById('ngTemp');
var wire = document.getElementById('ngWire');
var outPort = document.getElementById('ngOut');
var inPort = document.getElementById('ngIn');
var hint = document.getElementById('ngHint');

var OUT = { x: 140, y: 53 };
var IN = { x: 248, y: 123 };
var dragging = false, snapped = false, armed = false;

// 화면 좌표 → viewBox 좌표. 무대가 줄어도 배율 하나로 되돌린다
function toLocal(e) {
  var box = svg.getBoundingClientRect();
  var k = VIEW_W / box.width;
  return { x: (e.clientX - box.left) * k, y: (e.clientY - box.top) * k };
}

// 손잡이는 두 점의 가로 거리의 절반, 최소 40
function wirePath(x1, y1, x2, y2) {
  var h = Math.max(40, Math.abs(x2 - x1) * 0.5);
  return 'M' + x1 + ',' + y1 + ' C' + (x1 + h) + ',' + y1 + ' ' + (x2 - h) + ',' + y2 + ' ' + x2 + ',' + y2;
}

function wake() { ng.classList.remove('is-demo'); }

function drawTo(p) {
  var far = Math.sqrt((p.x - IN.x) * (p.x - IN.x) + (p.y - IN.y) * (p.y - IN.y));
  snapped = far < SNAP;
  var end = snapped ? IN : p;
  temp.setAttribute('d', wirePath(OUT.x, OUT.y, end.x, end.y));
  inPort.classList.toggle('is-near', snapped);
}

function commit() {
  wire.setAttribute('d', wirePath(OUT.x, OUT.y, IN.x, IN.y));
  wire.style.opacity = '1';
  hint.textContent = '이어졌습니다';
}

function stop() {
  dragging = false; armed = false;
  temp.style.opacity = '0';
  inPort.classList.remove('is-near');
  outPort.classList.remove('is-armed');
}

outPort.addEventListener('pointerdown', function (e) {
  e.preventDefault(); wake();
  outPort.setPointerCapture(e.pointerId);        // 손가락이 포트를 벗어나도 이 점이 계속 받는다
  dragging = true; snapped = false;
  temp.style.opacity = '1';
  drawTo(toLocal(e));
});
outPort.addEventListener('pointermove', function (e) { if (dragging) drawTo(toLocal(e)); });
outPort.addEventListener('pointerup', function () {
  if (!dragging) return;
  if (snapped) commit();
  stop();
});
outPort.addEventListener('pointercancel', stop);

// 키보드: 보내는 점에서 Enter → 받는 점에서 Enter
outPort.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  e.preventDefault(); wake();
  armed = true;
  outPort.classList.add('is-armed');
  inPort.classList.add('is-near');
  inPort.focus({ preventScroll: true });
});
inPort.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  e.preventDefault();
  if (armed) { commit(); stop(); }
});
outPort.addEventListener('focus', wake);
inPort.addEventListener('focus', wake);

// 미리보기 루프가 쓸 선 길이 — 점선 한 칸이 선 전체가 되게 한다
temp.style.setProperty('--len', temp.getTotalLength());
</script>
