<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끌어서 여러 개 고르기 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ng is-demo" id="ng">
  <div class="ng__bar">
    <span class="ng__title">Pick nodes</span>
    <span class="ng__badge">
      <span class="ng__num" aria-hidden="true"><span class="ng__digits" id="ngDigits"><i>0 selected</i><i>1 selected</i><i>2 selected</i><i>3 selected</i><i>4 selected</i></span></span>
    </span>
  </div>
  <div class="ng__canvas" id="ngCanvas">
    <svg class="ng__layer" viewBox="0 0 400 196" preserveAspectRatio="none" aria-hidden="true">
      <rect class="ng__marquee" id="ngMarquee" x="56" y="20" width="208" height="161"/>
    </svg>
    <div class="ng__node ng__node--a">
      <span class="ng__port ng__port--in" aria-hidden="true"></span>
      <span class="ng__name">Receive</span>
      <span class="ng__port ng__port--out" aria-hidden="true"></span>
      <span class="ng__ring" aria-hidden="true"></span>
    </div>
    <div class="ng__node ng__node--b">
      <span class="ng__port ng__port--in" aria-hidden="true"></span>
      <span class="ng__name">Filter</span>
      <span class="ng__port ng__port--out" aria-hidden="true"></span>
      <span class="ng__ring" aria-hidden="true"></span>
    </div>
    <div class="ng__node ng__node--c">
      <span class="ng__port ng__port--in" aria-hidden="true"></span>
      <span class="ng__name">Send</span>
      <span class="ng__port ng__port--out" aria-hidden="true"></span>
      <span class="ng__ring" aria-hidden="true"></span>
    </div>
    <div class="ng__node ng__node--d">
      <span class="ng__port ng__port--in" aria-hidden="true"></span>
      <span class="ng__name">Store</span>
      <span class="ng__port ng__port--out" aria-hidden="true"></span>
      <span class="ng__ring" aria-hidden="true"></span>
    </div>
  </div>
  <p class="ng__sr" id="ngLive" aria-live="polite" data-tpl="N nodes selected">0 nodes selected</p>
</div>
</main>
<script>
(function () {
  var ng = document.getElementById('ng');
  var canvas = document.getElementById('ngCanvas');
  var marquee = document.getElementById('ngMarquee');
  var digits = document.getElementById('ngDigits');
  var live = document.getElementById('ngLive');
  var nodes = canvas.querySelectorAll('.ng__node');
  var DIGIT_H = 12;                 // 숫자 한 칸 높이 — style.scss 의 .ng__digits i 높이와 같은 값
  var VIEW_W = 400, VIEW_H = 196;   // svg viewBox 단위. 화면 px 을 이 좌표로 되돌려 넣는다
  var start = null;

  function rectOf(el) {
    var r = el.getBoundingClientRect(), c = canvas.getBoundingClientRect();
    return { x: r.left - c.left, y: r.top - c.top, w: r.width, h: r.height };
  }
  function place(x, y, w, h) {
    var c = canvas.getBoundingClientRect();
    marquee.setAttribute('x', String(x / c.width * VIEW_W));
    marquee.setAttribute('y', String(y / c.height * VIEW_H));
    marquee.setAttribute('width', String(w / c.width * VIEW_W));
    marquee.setAttribute('height', String(h / c.height * VIEW_H));
  }
  function pick(x, y, w, h) {
    var n = 0;
    for (var i = 0; i < nodes.length; i++) {
      var b = rectOf(nodes[i]);
      var hit = b.x < x + w && b.x + b.w > x && b.y < y + h && b.y + b.h > y;
      nodes[i].classList.toggle('is-picked', hit);
      if (hit) n++;
    }
    digits.style.transform = 'translateY(' + (-DIGIT_H * n) + 'px)';
    live.textContent = live.getAttribute('data-tpl').replace('N', String(n));
  }
  canvas.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.ng__node')) return;   // 빈 바닥에서만 사각형이 시작한다
    ng.classList.remove('is-demo');
    var c = canvas.getBoundingClientRect();
    start = { x: e.clientX - c.left, y: e.clientY - c.top };
    canvas.setPointerCapture(e.pointerId);
    marquee.classList.add('is-on');
    place(start.x, start.y, 0, 0);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!start) return;
    var c = canvas.getBoundingClientRect();
    var cx = e.clientX - c.left, cy = e.clientY - c.top;
    // 어느 방향으로 끌어도 되게 정규화한다 — 두 점 중 작은 쪽이 좌상단,
    // 차의 절댓값이 크기다. 이 두 줄이 없으면 왼쪽·위로 끌 때 사각형이 안 그려진다
    var x = Math.min(start.x, cx), y = Math.min(start.y, cy);
    var w = Math.abs(cx - start.x), h = Math.abs(cy - start.y);
    place(x, y, w, h);
    pick(x, y, w, h);
  });
  function stop() { start = null; marquee.classList.remove('is-on'); }
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);
})();
</script>
</body>
</html>
