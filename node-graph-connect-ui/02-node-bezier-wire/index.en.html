<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두 점을 잇는 곡선 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ng is-demo" id="ng">

  <svg class="ng__svg" id="ngSvg" viewBox="0 0 400 180" role="group" aria-label="One curve joining two nodes">

    <!-- 연결선 — 노드보다 먼저 그려 상자 뒤로 깔린다 -->
    <path class="ng__wire" id="ngWire" fill="none" d="M140,46 C201,46 201,124 262,124"/>

    <!-- 앞 노드 -->
    <g class="ng__node">
      <rect x="12" y="20" width="128" height="52" rx="12"/>
      <svg x="26" y="36" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" class="ng__ico" aria-hidden="true"><path d="M216,80c0,26.51-39.4,48-88,48S40,106.51,40,80s39.4-48,88-48S216,53.49,216,80Z" opacity="0.2"/><path d="M128,24C74.17,24,32,48.6,32,80v96c0,31.4,42.17,56,96,56s96-24.6,96-56V80C224,48.6,181.83,24,128,24Zm80,104c0,9.62-7.88,19.43-21.61,26.92C170.93,163.35,150.19,168,128,168s-42.93-4.65-58.39-13.08C55.88,147.43,48,137.62,48,128V111.36c17.06,15,46.23,24.64,80,24.64s62.94-9.68,80-24.64ZM69.61,53.08C85.07,44.65,105.81,40,128,40s42.93,4.65,58.39,13.08C200.12,60.57,208,70.38,208,80s-7.88,19.43-21.61,26.92C170.93,115.35,150.19,120,128,120s-42.93-4.65-58.39-13.08C55.88,99.43,48,89.62,48,80S55.88,60.57,69.61,53.08ZM186.39,202.92C170.93,211.35,150.19,216,128,216s-42.93-4.65-58.39-13.08C55.88,195.43,48,185.62,48,176V159.36c17.06,15,46.23,24.64,80,24.64s62.94-9.68,80-24.64V176C208,185.62,200.12,195.43,186.39,202.92Z"/></svg>
      <text class="ng__nm" x="54" y="46">Customers</text>
      <circle class="ng__port ng__port--out" cx="140" cy="46" r="6"/>
    </g>

    <!-- 뒤 노드 — 통째로 밀어 두 점의 가로 거리를 바꾼다 -->
    <g class="ng__node" id="ngNodeB" transform="translate(66,0)">
      <rect x="196" y="98" width="120" height="52" rx="12"/>
      <svg x="210" y="114" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" class="ng__ico" aria-hidden="true"><path d="M223.69,42.18l-58.22,192a8,8,0,0,1-14.92,1.25L108,148,20.58,105.45a8,8,0,0,1,1.25-14.92l192-58.22A8,8,0,0,1,223.69,42.18Z" opacity="0.2"/><path d="M227.32,28.68a16,16,0,0,0-15.66-4.08l-.15,0L19.57,82.84a16,16,0,0,0-2.49,29.8L102,154l41.3,84.87A15.86,15.86,0,0,0,157.74,248q.69,0,1.38-.06a15.88,15.88,0,0,0,14-11.51l58.2-191.94c0-.05,0-.1,0-.15A16,16,0,0,0,227.32,28.68ZM157.83,231.85l-.05.14,0-.07-40.06-82.3,48-48a8,8,0,0,0-11.31-11.31l-48,48L24.08,98.25l-.07,0,.14,0L216,40Z"/></svg>
      <text class="ng__nm" x="238" y="124">Send email</text>
      <circle class="ng__port ng__port--in" cx="196" cy="124" r="6"/>
    </g>

    <text class="ng__cap" x="14" y="170"><tspan class="ng__capk">Horizontal gap</tspan><tspan class="ng__capv" id="ngDx" dx="8">122</tspan><tspan class="ng__capk" dx="14">Handle</tspan><tspan class="ng__capv" id="ngH" dx="8">61</tspan></text>
  </svg>

  <div class="ng__bar">
    <button type="button" class="ng__btn" id="ngNear" aria-pressed="false">Closer</button>
    <button type="button" class="ng__btn is-on" id="ngFar" aria-pressed="true">Farther</button>
  </div>

</div>
</main>
<script>
var ng = document.getElementById('ng');
var wire = document.getElementById('ngWire');
var nodeB = document.getElementById('ngNodeB');
var dxOut = document.getElementById('ngDx');
var handleOut = document.getElementById('ngH');
var nearBtn = document.getElementById('ngNear');
var farBtn = document.getElementById('ngFar');

var OUT = { x: 140, y: 46 };        // Output port
var BASE_IN = { x: 196, y: 124 };   // 뒤 노드가 「Closer」 자리에 있을 때의 Input port
var SHIFT = { near: 0, far: 66 };   // 뒤 노드를 오른쪽으로 미는 거리

// 3차 베지어 — 손잡이는 두 점의 가로 거리의 절반, 최소 40.
// 손잡이가 두 점에서 수평으로 뻗으므로 선은 항상 포트 옆구리로 빠진다.
function wirePath(x1, y1, x2, y2) {
  var h = Math.max(40, Math.abs(x2 - x1) * 0.5);
  return { d: 'M' + x1 + ',' + y1 + ' C' + (x1 + h) + ',' + y1 + ' ' + (x2 - h) + ',' + y2 + ' ' + x2 + ',' + y2, handle: h };
}

function layout(shift) {
  nodeB.setAttribute('transform', 'translate(' + shift + ',0)');
  var inX = BASE_IN.x + shift;
  var r = wirePath(OUT.x, OUT.y, inX, BASE_IN.y);
  wire.setAttribute('d', r.d);
  var len = wire.getTotalLength();          // 선 길이를 재서 점선 한 칸으로 만든다
  wire.style.setProperty('--len', len);   // 점선 칸 길이는 scss 가 var(--len) 으로 받는다
  dxOut.textContent = String(inX - OUT.x);
  handleOut.textContent = String(Math.round(r.handle));
}

function pick(kind) {
  ng.classList.remove('is-demo');
  layout(SHIFT[kind]);
  nearBtn.classList.toggle('is-on', kind === 'near');
  farBtn.classList.toggle('is-on', kind === 'far');
  nearBtn.setAttribute('aria-pressed', String(kind === 'near'));
  farBtn.setAttribute('aria-pressed', String(kind === 'far'));
}

nearBtn.addEventListener('click', function () { pick('near'); });
farBtn.addEventListener('click', function () { pick('far'); });
layout(SHIFT.far);
</script>
</body>
</html>
