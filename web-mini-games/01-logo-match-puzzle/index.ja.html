<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロゴ当てパズル — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="lp is-demo" id="lp">
  <header class="lp__bar">
    <p class="lp__q"><span class="lp__qLabel">問題</span><b class="lp__qNum" id="lpQNum">1</b><span class="lp__qOf">/ 5</span></p>
    <div class="lp__scoreWrap">
      <p class="lp__score" id="lpScore" aria-live="polite"><span class="lp__scoreLabel">正解</span><b class="lp__scoreNum" id="lpScoreNum">0</b></p>
      <span class="lp__plus" aria-hidden="true">+1</span>
    </div>
  </header>
  <div class="lp__body">
    <div class="lp__card">
      <span class="lp__mark lp__mark--big lp__mark--cut1" id="lpTarget" data-shape="hex" aria-hidden="true"></span>
      <span class="lp__mark lp__mark--big lp__mark--cut2" data-shape="wedge" aria-hidden="true"></span>
      <span class="lp__mark lp__mark--big lp__mark--cut3" data-shape="ring" aria-hidden="true"></span>
    </div>
    <div class="lp__tiles" id="lpTiles">
      <button class="lp__tile" type="button" aria-label="選択肢1" aria-keyshortcuts="1"><span class="lp__mark" data-shape="wedge" aria-hidden="true"></span><span class="lp__key" aria-hidden="true">1</span></button>
      <button class="lp__tile" type="button" aria-label="選択肢2" aria-keyshortcuts="2"><span class="lp__mark" data-shape="hex" aria-hidden="true"></span><span class="lp__key" aria-hidden="true">2</span></button>
      <button class="lp__tile" type="button" aria-label="選択肢3" aria-keyshortcuts="3"><span class="lp__mark" data-shape="chevron" aria-hidden="true"></span><span class="lp__key" aria-hidden="true">3</span></button>
      <button class="lp__tile" type="button" aria-label="選択肢4" aria-keyshortcuts="4"><span class="lp__mark" data-shape="ring" aria-hidden="true"></span><span class="lp__key" aria-hidden="true">4</span></button>
      <span class="lp__ring" aria-hidden="true"></span>
    </div>
  </div>
  <p class="lp__done" id="lpDone" role="status" hidden><b class="lp__doneMsg" id="lpDoneMsg">5問中{n}問正解</b><button class="lp__again" type="button" id="lpAgain">もう一度</button></p>
</div>
</main>
<script>
// 로고 퍼즐 — 진열 카드의 기하 마크와 같은 모양을 보기 넷에서 고른다.
// 마크는 전부 CSS 도형(clip-path polygon · conic-gradient 부채꼴 · 링 겹침)이라 이미지가 0이다.
// 맞으면 초록 테두리와 スコア, 틀리면 빨간 테두리와 정답 공개. 0.8초 뒤 다음 問題.
(function () {
  var NEXT_MS = 800;
  var DONE_TEXT = '5問中{n}問正解';
  var QUESTIONS = [
    { answer: 'hex', tiles: ['wedge', 'hex', 'chevron', 'ring'] },
    { answer: 'chevron', tiles: ['chevron', 'diamond', 'ring', 'tri'] },
    { answer: 'wedge', tiles: ['tri', 'ring', 'wedge', 'hex'] },
    { answer: 'diamond', tiles: ['hex', 'chevron', 'tri', 'diamond'] },
    { answer: 'ring', tiles: ['diamond', 'wedge', 'ring', 'chevron'] }
  ];
  var root = document.getElementById('lp');
  var target = document.getElementById('lpTarget');
  var qNumEl = document.getElementById('lpQNum');
  var scoreEl = document.getElementById('lpScoreNum');
  var doneEl = document.getElementById('lpDone');
  var doneMsgEl = document.getElementById('lpDoneMsg');
  var tiles = [].slice.call(document.querySelectorAll('.lp__tile'));
  var qIndex = 0, score = 0, lock = false;

  function render() {
    var q = QUESTIONS[qIndex];
    target.setAttribute('data-shape', q.answer);
    qNumEl.textContent = String(qIndex + 1);
    for (var i = 0; i < tiles.length; i++) {
      tiles[i].classList.remove('is-correct', 'is-wrong');
      tiles[i].firstElementChild.setAttribute('data-shape', q.tiles[i]);
    }
  }
  function next() {
    lock = false;
    if (qIndex + 1 >= QUESTIONS.length) {
      doneMsgEl.textContent = DONE_TEXT.replace('{n}', String(score));
      doneEl.hidden = false;
      return;
    }
    qIndex++;
    render();
  }
  function pick(i) {
    if (lock || !doneEl.hidden) { return; }
    lock = true;
    root.classList.remove('is-demo');
    var answer = QUESTIONS[qIndex].answer;
    var ok = tiles[i].firstElementChild.getAttribute('data-shape') === answer;
    tiles[i].classList.add(ok ? 'is-correct' : 'is-wrong');
    if (ok) { score++; scoreEl.textContent = String(score); }
    else {
      for (var k = 0; k < tiles.length; k++) {
        if (tiles[k].firstElementChild.getAttribute('data-shape') === answer) { tiles[k].classList.add('is-correct'); }
      }
    }
    window.setTimeout(next, NEXT_MS);
  }
  for (var t = 0; t < tiles.length; t++) {
    (function (i) { tiles[i].addEventListener('click', function () { pick(i); }); })(t);
  }
  document.addEventListener('keydown', function (e) {
    var n = '1234'.indexOf(e.key);
    if (n >= 0) { e.preventDefault(); pick(n); }
  });
  document.getElementById('lpAgain').addEventListener('click', function () {
    qIndex = 0; score = 0; lock = false;
    scoreEl.textContent = '0';
    doneEl.hidden = true;
    render();
  });
  render();
})();
</script>
</body>
</html>
