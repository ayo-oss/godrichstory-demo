<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글래스 효과 제너레이터 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="gg is-demo" id="gg">
  <div class="gg__scene">
    <span class="gg__blob gg__blob--a" aria-hidden="true"></span>
    <span class="gg__blob gg__blob--b" aria-hidden="true"></span>
    <span class="gg__blob gg__blob--c" aria-hidden="true"></span>
    <div class="gg__glass" id="ggGlass" aria-hidden="true"></div>
  </div>
  <div class="gg__panel">
    <label class="gg__row">
      <span class="gg__name">흐림</span>
      <span class="gg__track">
        <input class="gg__range" id="ggBlur" type="range" min="0" max="24" step="1" value="12" aria-label="흐림">
        <span class="gg__ghost gg__ghost--a" aria-hidden="true"><span class="gg__dot"></span></span>
      </span>
      <output class="gg__val" id="ggBlurOut">12px</output>
    </label>
    <label class="gg__row">
      <span class="gg__name">투명도</span>
      <span class="gg__track">
        <input class="gg__range" id="ggOpacity" type="range" min="4" max="48" step="1" value="18" aria-label="투명도">
        <span class="gg__ghost gg__ghost--b" aria-hidden="true"><span class="gg__dot"></span></span>
      </span>
      <output class="gg__val" id="ggOpacityOut">18%</output>
    </label>
    <label class="gg__row">
      <span class="gg__name">채도</span>
      <span class="gg__track">
        <input class="gg__range" id="ggSaturate" type="range" min="100" max="260" step="10" value="160" aria-label="채도">
        <span class="gg__ghost gg__ghost--c" aria-hidden="true"><span class="gg__dot"></span></span>
      </span>
      <output class="gg__val" id="ggSaturateOut">160%</output>
    </label>
    <label class="gg__row">
      <span class="gg__name">테두리</span>
      <span class="gg__track">
        <input class="gg__range" id="ggBorder" type="range" min="0" max="4" step="1" value="1" aria-label="테두리">
        <span class="gg__ghost gg__ghost--d" aria-hidden="true"><span class="gg__dot"></span></span>
      </span>
      <output class="gg__val" id="ggBorderOut">1px</output>
    </label>
    <pre class="gg__code"><span class="gg__mark" aria-hidden="true"></span><code class="gg__line" id="ggLine1">backdrop-filter: blur(12px) saturate(160%);</code><code class="gg__line" id="ggLine2">background: hsl(0 0% 100% / .18);</code><code class="gg__line" id="ggLine3">border: 1px solid hsl(0 0% 100% / .5);</code></pre>
    <div class="gg__foot">
      <button class="gg__copy" id="ggCopy" type="button">코드 복사</button>
      <span class="gg__toast" id="ggToast" role="status" hidden>복사했어요</span>
    </div>
  </div>
</section>
</main>
<script>
// 글래스 효과 제너레이터 — 슬라이더 네 개가 미리보기 카드의 인라인 스타일과 아래 코드 줄을 한 번에 갱신한다.
// 값 하나가 두 곳(화면·코드)에 쓰이므로 만드는 곳은 한 함수뿐이다.
(function () {
  var COPIED = '복사했어요';
  var root = document.getElementById('gg');
  var glass = document.getElementById('ggGlass');
  var toast = document.getElementById('ggToast');
  var ranges = { blur: document.getElementById('ggBlur'), opacity: document.getElementById('ggOpacity'),
                 saturate: document.getElementById('ggSaturate'), border: document.getElementById('ggBorder') };
  var outs = { blur: document.getElementById('ggBlurOut'), opacity: document.getElementById('ggOpacityOut'),
               saturate: document.getElementById('ggSaturateOut'), border: document.getElementById('ggBorderOut') };
  var lines = [document.getElementById('ggLine1'), document.getElementById('ggLine2'), document.getElementById('ggLine3')];
  var toastTimer = 0;

  function alpha() {
    return String(Math.round(Number(ranges.opacity.value)) / 100).replace('0.', '.');
  }
  function code() {
    return [
      'backdrop-filter: blur(' + ranges.blur.value + 'px) saturate(' + ranges.saturate.value + '%);',
      'background: hsl(0 0% 100% / ' + alpha() + ');',
      'border: ' + ranges.border.value + 'px solid hsl(0 0% 100% / .5);'
    ];
  }
  function render() {
    var rows = code();
    glass.style.backdropFilter = 'blur(' + ranges.blur.value + 'px) saturate(' + ranges.saturate.value + '%)';
    glass.style.backgroundColor = 'hsl(0 0% 100% / ' + alpha() + ')';
    glass.style.borderWidth = ranges.border.value + 'px';
    outs.blur.textContent = ranges.blur.value + 'px';
    outs.opacity.textContent = ranges.opacity.value + '%';
    outs.saturate.textContent = ranges.saturate.value + '%';
    outs.border.textContent = ranges.border.value + 'px';
    for (var i = 0; i < lines.length; i++) { lines[i].textContent = rows[i]; }
  }
  for (var key in ranges) {
    ranges[key].addEventListener('input', function () { root.classList.remove('is-demo'); render(); });
  }
  document.getElementById('ggCopy').addEventListener('click', function () {
    root.classList.remove('is-demo');
    var text = code().join('\n');
    var done = function () {
      toast.textContent = COPIED;
      toast.hidden = false;
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(function () { toast.hidden = true; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, done);
    } else { done(); }
  });
  render();
})();
</script>
</body>
</html>
