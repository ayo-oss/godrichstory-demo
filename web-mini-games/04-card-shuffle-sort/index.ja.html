<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カードシャッフル・整列 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="cs is-demo" id="cs">
  <header class="cs__bar">
    <p class="cs__title">カードシャッフル・整列</p>
    <p class="cs__state" id="csState" role="status">並び順のまま</p>
  </header>
  <div class="cs__rail" id="csRail" role="list">
    <span class="cs__card" role="listitem" data-value="1">1</span>
    <span class="cs__card" role="listitem" data-value="2">2</span>
    <span class="cs__card" role="listitem" data-value="3">3</span>
    <span class="cs__card" role="listitem" data-value="4">4</span>
    <span class="cs__card" role="listitem" data-value="5">5</span>
    <span class="cs__card" role="listitem" data-value="6">6</span>
  </div>
  <div class="cs__acts">
    <button class="cs__btn" id="csShuffle" type="button" aria-keyshortcuts="S">シャッフル<kbd class="cs__kbd">S</kbd></button>
    <button class="cs__btn cs__btn--ghost" id="csSort" type="button" aria-keyshortcuts="R">整列<kbd class="cs__kbd">R</kbd></button>
  </div>
</section>
</main>
<script>
// カードシャッフル・整列 — 카드의 DOM 순서는 절대 안 바뀐다. 바뀌는 건 슬롯 번호(--slot) 하나뿐이고
// 그 값이 translate 로 풀려 transition 이 자리를 이어 준다(FLIP 방식).
// 이동하는 동안 .is-moving 이 버튼의 pointer-events 를 꺼 연타를 막는다.
(function () {
  var MOVE_MS = 600;
  var SORTED = '並び順のまま';
  var SHUFFLED = 'シャッフル済み';
  var root = document.getElementById('cs');
  var rail = document.getElementById('csRail');
  var stateEl = document.getElementById('csState');
  var cards = [].slice.call(rail.querySelectorAll('.cs__card'));
  var slots = cards.map(function (card, i) { return i; });   // slots[카드 순서] = 슬롯 번호
  var moving = false, timer = 0;

  function paint() {
    for (var i = 0; i < cards.length; i++) {
      cards[i].style.setProperty('--slot', String(slots[i]));
      cards[i].setAttribute('data-slot', String(slots[i]));
    }
  }
  function lock() {
    moving = true;
    root.classList.add('is-moving');
    window.clearTimeout(timer);
    timer = window.setTimeout(function () { moving = false; root.classList.remove('is-moving'); }, MOVE_MS);
  }
  function shuffle() {
    if (moving) { return; }
    root.classList.remove('is-demo');
    var before = slots.join('');
    for (var i = slots.length - 1; i > 0; i--) {            // Fisher-Yates
      var j = Math.floor(Math.random() * (i + 1));
      var t = slots[i]; slots[i] = slots[j]; slots[j] = t;
    }
    if (slots.join('') === before) { var h = slots[0]; slots[0] = slots[5]; slots[5] = h; }
    paint(); lock();
    stateEl.textContent = SHUFFLED;
  }
  function sortBack() {
    if (moving) { return; }
    root.classList.remove('is-demo');
    for (var i = 0; i < slots.length; i++) { slots[i] = i; }
    paint(); lock();
    stateEl.textContent = SORTED;
  }
  document.getElementById('csShuffle').addEventListener('click', shuffle);
  document.getElementById('csSort').addEventListener('click', sortBack);
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    if (k === 's') { e.preventDefault(); shuffle(); }
    if (k === 'r') { e.preventDefault(); sortBack(); }
  });
  paint();
})();
</script>
</body>
</html>
