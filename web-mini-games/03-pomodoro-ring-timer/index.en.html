<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomodoro ring timer — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pt is-demo" id="pt">
  <div class="pt__ring" id="ptRing" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" aria-label="Time left">
    <span class="pt__disc" id="ptDisc" aria-hidden="true"></span>
    <span class="pt__hole">
      <span class="pt__timeWrap">
        <b class="pt__time pt__time--cut1" id="ptTime">25:00</b>
        <b class="pt__time pt__time--cut2" aria-hidden="true">12:30</b>
        <b class="pt__time pt__time--cut3" aria-hidden="true">05:00</b>
      </span>
      <span class="pt__phaseWrap">
        <span class="pt__phase pt__phase--cut1" id="ptPhase">Focus</span>
        <span class="pt__phase pt__phase--cut2" aria-hidden="true">Break</span>
      </span>
    </span>
  </div>
  <div class="pt__ctrls">
    <button class="pt__btn pt__btn--go" type="button" id="ptPlay">Start</button>
    <button class="pt__btn" type="button" id="ptReset">Reset</button>
  </div>
</div>
</main>
<script>
// 포모도로 링 타이머 — Focus 25분 · Break 5분.
// 원판은 CSS 애니메이션(ptDrain)이 각도 변수 --pt-angle 을 360deg 에서 0deg 로 깎아 그린다.
// Stop·재생은 animation-play-state 로만 한다 — JS 는 남은 초와 화면 글자·aria-valuenow 만 맡는다.
// SPEED 는 데모용 빠른 모드다: 1 초에 60 초씩 줄어 25분이 25초에 끝난다. 실제 서비스에선 1 로 둔다.
// 화면 라벨은 늘 25:00 스케일 그대로다.
(function () {
  var KEY = 'pomodoro080';
  var SPEED = 60;
  var FOCUS = 1500, BREAK = 300;
  var START = 'Start', PAUSE = 'Pause';
  var PHASE_FOCUS = 'Focus', PHASE_BREAK = 'Break';
  var root = document.getElementById('pt');
  var disc = document.getElementById('ptDisc');
  var ring = document.getElementById('ptRing');
  var timeEl = document.getElementById('ptTime');
  var phaseEl = document.getElementById('ptPhase');
  var playBtn = document.getElementById('ptPlay');
  var phase = 'focus', left = FOCUS, running = false, last = 0, tick = 0;

  function total() { return phase === 'focus' ? FOCUS : BREAK; }
  function mmss(s) {
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify({ phase: phase, left: left, running: running })); }
    catch (e) { /* 저장소가 막힌 창은 건너뛴다 */ }
  }
  function paint() {
    timeEl.textContent = mmss(left);
    phaseEl.textContent = phase === 'focus' ? PHASE_FOCUS : PHASE_BREAK;
    playBtn.textContent = running ? PAUSE : START;
    ring.setAttribute('aria-valuenow', String(Math.round(left / total() * 100)));
    root.classList.toggle('is-running', running);
    root.classList.toggle('is-break', phase === 'break');
  }
  function syncDisc() {
    disc.style.animationDuration = (total() / SPEED) + 's';
    disc.style.animationDelay = '-' + ((total() - left) / SPEED) + 's';
    disc.style.animationName = 'none';
    void disc.offsetHeight;
    disc.style.animationName = '';
  }
  function step() {
    var now = Date.now();
    left = Math.max(0, left - (now - last) / 1000 * SPEED);
    last = now;
    if (left <= 0) {
      phase = phase === 'focus' ? 'break' : 'focus';
      left = total();
      syncDisc();
    }
    paint(); save();
  }
  function run(on) {
    running = on;
    window.clearInterval(tick);
    if (on) { last = Date.now(); tick = window.setInterval(step, 200); }
    paint(); save();
  }
  playBtn.addEventListener('click', function () { root.classList.remove('is-demo'); syncDisc(); run(!running); });
  document.getElementById('ptReset').addEventListener('click', function () {
    root.classList.remove('is-demo');
    phase = 'focus'; left = FOCUS;
    run(false); syncDisc();
  });
  try {
    var saved = JSON.parse(window.localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved.left === 'number') {
      root.classList.remove('is-demo');
      phase = saved.phase === 'break' ? 'break' : 'focus';
      left = Math.min(Math.max(saved.left, 0), total());
      syncDisc();
      run(!!saved.running);
    }
  } catch (e) { /* 깨진 값은 무시하고 처음 상태로 */ }
  paint();
})();
</script>
</body>
</html>
