<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ランダムスロット抽選 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="sl is-demo" id="sl">
  <header class="sl__bar">
    <p class="sl__title">ランダムスロット抽選</p>
    <p class="sl__count"><b class="sl__countNum" id="slCount">8</b><span class="sl__countLabel">人の候補</span></p>
  </header>

  <div class="sl__body">
    <div class="sl__window">
      <div class="sl__track" id="slTrack"></div>
      <span class="sl__frame" aria-hidden="true"></span>
    </div>
    <div class="sl__side">
      <button class="sl__btn sl__btn--go" id="slGo" type="button">抽選</button>
      <button class="sl__btn" id="slDrop" type="button">当選者を外す</button>
      <button class="sl__btn" id="slReset" type="button">候補を戻す</button>
    </div>
  </div>

  <div class="sl__out">
    <p class="sl__banner" id="slBanner" aria-live="polite">「抽選」を押すと始まります</p>
    <p class="sl__ghost sl__ghost--a" aria-hidden="true">回転中</p>
    <p class="sl__ghost sl__ghost--b" aria-hidden="true">ソヨンが当選!</p>
  </div>
</div>
</main>
<script>
// 랜덤 슬롯 — 후보 이름을 네 벌 이어 붙인 세로 트랙을 칸 단위로 밀어 올린다.
// 창은 세 칸이고 가운데 칸이 당첨 자리다. 감속은 CSS transition 이 맡고 JS 는 목표 칸만 정한다.
// 멈춘 뒤 offset 을 후보 수로 나눈 나머지로 되돌려 놓아 트랙이 끝으로 밀려나지 않게 한다.
// 후보 목록은 localStorage 키 하나(p080-09)에 JSON 으로 넣는다.
(function () {
  var KEY = 'p080-09';
  var BASE = ['ジミン', 'ソヨン', 'ドユン', 'ハウン', 'ミンジュン', 'スア', 'イェジュン', 'ユナ'];
  var WIN = '{n} が当選!';
  var SPINNING = '回転中';
  var HELP = '「抽選」を押すと始まります';
  var root = document.getElementById('sl');
  var track = document.getElementById('slTrack');
  var countEl = document.getElementById('slCount');
  var banner = document.getElementById('slBanner');
  var goBtn = document.getElementById('slGo');
  var dropBtn = document.getElementById('slDrop');
  var resetBtn = document.getElementById('slReset');
  var list, offset = 0, busy = false, winner = '';

  function load() {
    try {
      var raw = JSON.parse(window.localStorage.getItem(KEY) || 'null');
      if (raw && raw.names && raw.names.length > 1) { return raw.names.slice(); }
    } catch (e) { /* 저장소가 막힌 창은 기본 후보로 */ }
    return BASE.slice();
  }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify({ names: list })); } catch (e) { /* 건너뛴다 */ }
  }
  function put(o) { track.style.transform = 'translateY(calc(var(--row) * ' + (-o) + '))'; }
  function build() {
    track.textContent = '';
    for (var c = 0; c < 4; c++) {
      for (var i = 0; i < list.length; i++) {
        var el = document.createElement('div');
        el.className = 'sl__item';
        el.textContent = list[i];
        track.appendChild(el);
      }
    }
    root.style.setProperty('--rows', String(list.length));
    countEl.textContent = String(list.length);
    offset = 0;
    put(0);
  }
  function idle() {
    banner.textContent = HELP;
    banner.classList.remove('is-win');
    winner = '';
  }
  function spin() {
    if (busy || list.length < 2) { return; }
    root.classList.remove('is-demo');
    busy = true;
    goBtn.disabled = true;
    banner.textContent = SPINNING;
    banner.classList.remove('is-win');
    offset += list.length + Math.floor(Math.random() * list.length);
    put(offset);
  }
  track.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform') { return; }
    offset = offset % list.length;
    winner = list[(offset + 1) % list.length];
    track.style.transitionProperty = 'none';
    put(offset);
    void track.offsetHeight;                    // 리플로를 한 번 강제해 되돌림이 애니메이션되지 않게
    track.style.transitionProperty = 'transform';
    banner.textContent = WIN.replace('{n}', winner);
    banner.classList.add('is-win');
    busy = false;
    goBtn.disabled = false;
  });
  goBtn.addEventListener('click', spin);
  dropBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    var i = list.indexOf(winner);
    if (busy || i < 0 || list.length < 3) { return; }
    list.splice(i, 1);
    save();
    build();
    idle();
  });
  resetBtn.addEventListener('click', function () {
    root.classList.remove('is-demo');
    if (busy) { return; }
    list = BASE.slice();
    save();
    build();
    idle();
  });
  list = load();
  build();
})();
</script>
</body>
</html>
