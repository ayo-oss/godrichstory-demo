<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OX 퀴즈 패널 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ox is-demo" id="ox">
  <header class="ox__bar">
    <p class="ox__title">OX 퀴즈</p>
    <p class="ox__score"><span class="ox__scoreLabel">점수</span> <b class="ox__scoreNum" id="oxScore">0</b><span class="ox__scoreMax">/5</span></p>
  </header>

  <div class="ox__card">
    <p class="ox__q" id="oxQ">CSS 의 transform 은 레이아웃을 다시 계산한다</p>
    <p class="ox__q ox__q--ghost" aria-hidden="true">prefers-reduced-motion 은 움직임 줄이기 요청이다</p>
  </div>

  <div class="ox__btns">
    <button class="ox__btn ox__btn--o" id="oxO" type="button" aria-pressed="false" aria-label="맞다">O</button>
    <button class="ox__btn ox__btn--x" id="oxX" type="button" aria-pressed="false" aria-label="아니다">X</button>
  </div>

  <ol class="ox__dots" id="oxDots">
    <li class="ox__dot is-now"></li>
    <li class="ox__dot"></li>
    <li class="ox__dot"></li>
    <li class="ox__dot"></li>
    <li class="ox__dot"></li>
  </ol>

  <p class="ox__msg" id="oxMsg" role="status">O 와 X 키로도 답합니다</p>
</div>
</main>
<script>
// OX 퀴즈 — 문장 5개를 O/X 로 판정한다. 정답이면 고른 쪽이 파란 면, 오답이면 붉은 면이 되고
// 오답일 때는 정답 쪽에 옅은 힌트 테두리가 함께 켜진다. 900ms 뒤 다음 문장으로 넘어간다.
// 진행 점의 번호는 CSS counter-increment 가 세므로 JS 는 색만 바꾼다.
(function () {
  var QUESTIONS = [
    { t: 'CSS 의 transform 은 레이아웃을 다시 계산한다', a: 'X' },
    { t: 'prefers-reduced-motion 은 움직임 줄이기 요청이다', a: 'O' },
    { t: 'z-index 는 position 이 static 이면 듣지 않는다', a: 'O' },
    { t: 'gap 은 flex 에서는 쓸 수 없다', a: 'X' },
    { t: 'aria-pressed 는 눌림 상태를 알려 주는 속성이다', a: 'O' }
  ];
  var HIT = '정답!';
  var MISS = '아쉬워요';
  var DONE = '끝! 5문제 중 {n}개 정답';
  var HELP = 'O 와 X 키로도 답합니다';
  var root = document.getElementById('ox');
  var qEl = document.getElementById('oxQ');
  var oBtn = document.getElementById('oxO');
  var xBtn = document.getElementById('oxX');
  var msgEl = document.getElementById('oxMsg');
  var scoreEl = document.getElementById('oxScore');
  var dots = [].slice.call(document.querySelectorAll('.ox__dot'));
  var step = 0, score = 0, lock = false;

  function paint() {
    qEl.textContent = QUESTIONS[step].t;
    for (var i = 0; i < dots.length; i++) { dots[i].classList.toggle('is-now', i === step); }
  }
  function reset() {
    step = 0; score = 0; lock = false;
    scoreEl.textContent = '0';
    msgEl.textContent = HELP;
    for (var i = 0; i < dots.length; i++) { dots[i].className = 'ox__dot'; }
    paint();
  }
  function clearBtns() {
    oBtn.className = 'ox__btn ox__btn--o';
    xBtn.className = 'ox__btn ox__btn--x';
    oBtn.setAttribute('aria-pressed', 'false');
    xBtn.setAttribute('aria-pressed', 'false');
  }
  function pick(v) {
    if (lock) { return; }
    root.classList.remove('is-demo');
    if (step >= QUESTIONS.length) { reset(); return; }
    lock = true;
    var ok = QUESTIONS[step].a === v;
    var picked = v === 'O' ? oBtn : xBtn;
    var right = QUESTIONS[step].a === 'O' ? oBtn : xBtn;
    picked.setAttribute('aria-pressed', 'true');
    picked.classList.add(ok ? 'is-hit' : 'is-miss');
    if (!ok) { right.classList.add('is-hint'); }
    if (ok) { score++; scoreEl.textContent = String(score); }
    dots[step].classList.add(ok ? 'is-hit' : 'is-miss');
    msgEl.textContent = ok ? HIT : MISS;
    window.setTimeout(function () {
      clearBtns();
      step++;
      lock = false;
      if (step >= QUESTIONS.length) {
        msgEl.textContent = DONE.replace('{n}', String(score));
        return;
      }
      msgEl.textContent = HELP;
      paint();
    }, 900);
  }
  oBtn.addEventListener('click', function () { pick('O'); });
  xBtn.addEventListener('click', function () { pick('X'); });
  document.addEventListener('keydown', function (e) {
    var k = String(e.key).toLowerCase();
    if (k !== 'o' && k !== 'x') { return; }
    e.preventDefault();
    pick(k === 'o' ? 'O' : 'X');
  });
  paint();
})();
</script>
</body>
</html>
