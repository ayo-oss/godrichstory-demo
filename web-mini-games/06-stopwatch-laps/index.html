<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랩 스톱워치 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<section class="sw is-demo" id="sw">
  <p class="sw__time" id="swTime" role="timer" aria-live="off">
    <span class="sw__main" id="swMain">00:00</span><span class="sw__sep">.</span><span class="sw__cs" id="swCs">00<span class="sw__reels" aria-hidden="true"><span class="sw__reel"><span class="sw__reelInner">0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>0</span></span><span class="sw__reel sw__reel--fast"><span class="sw__reelInner">0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>0</span></span></span></span>
  </p>
  <div class="sw__acts">
    <button class="sw__btn" id="swToggle" type="button" aria-keyshortcuts="Space">시작</button>
    <button class="sw__btn sw__btn--ghost" id="swLap" type="button" aria-keyshortcuts="L">랩</button>
    <button class="sw__btn sw__btn--ghost" id="swReset" type="button" aria-keyshortcuts="R">초기화</button>
  </div>
  <div class="sw__lapBox">
    <ul class="sw__laps" id="swLaps"></ul>
    <ul class="sw__laps sw__laps--ghost" aria-hidden="true">
      <li class="sw__lap sw__lap--g1"><b class="sw__lapNo">3번째</b><span class="sw__lapAt">00:00.62</span></li>
      <li class="sw__lap sw__lap--g2"><b class="sw__lapNo">2번째</b><span class="sw__lapAt">00:00.41</span></li>
      <li class="sw__lap sw__lap--g3"><b class="sw__lapNo">1번째</b><span class="sw__lapAt">00:00.18</span></li>
    </ul>
  </div>
</section>
</main>
<script>
// 랩 스톱워치 — 시계는 requestAnimationFrame 한 줄기로만 흐르고, 화면 글자는 그 값을 0.01초로 잘라 찍는다.
// 경과시간과 랩 배열은 키 하나(p080-06-stopwatch)에 JSON 으로 묶어 저장해 새로고침 뒤에도 이어진다.
(function () {
  var KEY = 'p080-06-stopwatch';
  var START = '시작';
  var STOP = '정지';
  var LAP_NO = '{n}번째';
  var MAX = 4;
  var root = document.getElementById('sw');
  var mainEl = document.getElementById('swMain');
  var csEl = document.getElementById('swCs');
  var listEl = document.getElementById('swLaps');
  var toggleEl = document.getElementById('swToggle');
  var running = false, elapsed = 0, startAt = 0, base = 0, count = 0, laps = [];

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(ms) {
    return pad(Math.floor(ms / 60000)) + ':' + pad(Math.floor(ms / 1000) % 60) + '.' + pad(Math.floor(ms / 10) % 100);
  }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify({ elapsed: Math.round(elapsed), count: count, laps: laps })); } catch (e) { /* 저장소가 막힌 창은 건너뛴다 */ }
  }
  function load() {
    try {
      var raw = JSON.parse(window.localStorage.getItem(KEY) || '{}');
      elapsed = Number(raw.elapsed) || 0;
      laps = [].concat(raw.laps || []).slice(0, MAX);
      count = Number(raw.count) || laps.length;
    } catch (e) { elapsed = 0; laps = []; count = 0; }
  }
  function row(item, fresh) {
    var li = document.createElement('li');
    li.className = 'sw__lap' + (fresh ? ' is-new' : '');
    var no = document.createElement('b');
    no.className = 'sw__lapNo';
    no.textContent = LAP_NO.replace('{n}', String(item.n));
    var t = document.createElement('span');
    t.className = 'sw__lapAt';
    t.textContent = item.at;
    li.appendChild(no); li.appendChild(t);
    return li;
  }
  function paint() {
    var text = fmt(elapsed);
    mainEl.textContent = text.slice(0, 5);
    csEl.firstChild.nodeValue = text.slice(6);
    toggleEl.textContent = running ? STOP : START;
  }
  function tick() {
    if (!running) { return; }
    elapsed = base + (Date.now() - startAt);
    paint();
    window.requestAnimationFrame(tick);
  }
  function toggle() {
    root.classList.remove('is-demo');
    running = !running;
    if (running) { base = elapsed; startAt = Date.now(); window.requestAnimationFrame(tick); } else { save(); }
    paint();
  }
  function lap() {
    root.classList.remove('is-demo');
    count++;
    laps.unshift({ n: count, at: fmt(elapsed) });
    laps = laps.slice(0, MAX);
    listEl.insertBefore(row(laps[0], true), listEl.firstChild);
    while (listEl.children.length > MAX) { listEl.removeChild(listEl.lastChild); }
    save();
  }
  function reset() {
    root.classList.remove('is-demo');
    running = false; elapsed = 0; base = 0; count = 0; laps = [];
    listEl.textContent = '';
    save(); paint();
  }
  toggleEl.addEventListener('click', toggle);
  document.getElementById('swLap').addEventListener('click', lap);
  document.getElementById('swReset').addEventListener('click', reset);
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); toggle(); }
    if (k === 'l') { e.preventDefault(); lap(); }
    if (k === 'r') { e.preventDefault(); reset(); }
  });
  load();
  for (var i = laps.length - 1; i >= 0; i--) { listEl.insertBefore(row(laps[i], false), listEl.firstChild); }
  paint();
})();
</script>
</body>
</html>
