<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conic roulette spin — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="rl is-demo" id="rl">
  <div class="rl__wheel">
    <div class="rl__disc" id="rlDisc">
      <span class="rl__label rl__label--1"><span class="rl__labelText">Coffee</span></span>
      <span class="rl__label rl__label--2"><span class="rl__labelText">Cookie</span></span>
      <span class="rl__label rl__label--3"><span class="rl__labelText">Coupon</span></span>
      <span class="rl__label rl__label--4"><span class="rl__labelText">Sticker</span></span>
      <span class="rl__label rl__label--5"><span class="rl__labelText">Again</span></span>
      <span class="rl__label rl__label--6"><span class="rl__labelText">Miss</span></span>
    </div>
    <span class="rl__hub" aria-hidden="true"></span>
    <span class="rl__pointer" aria-hidden="true">
      <svg viewBox="0 0 256 256" focusable="false"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg>
    </span>
  </div>

  <div class="rl__side">
    <p class="rl__title">Roulette draw</p>
    <button class="rl__spin" id="rlSpin" type="button">Spin</button>
    <div class="rl__out">
      <p class="rl__result" id="rlResult" aria-live="polite">Press the button to spin</p>
      <p class="rl__ghost rl__ghost--b" aria-hidden="true">You got Coffee!</p>
    </div>
  </div>
</div>
</main>
<script>
// 룰렛 — 원판은 conic-gradient 하나로 그리고 회전은 transform: rotate 한 줄이다.
// 감속은 CSS transition-timing-function 이 맡고 JS 는 목표 각도(--spin)만 정한다.
// --spin 하나로 원판은 그만큼 돌고 라벨 글자는 그만큼 되돌아 돌아 언제나 수평으로 읽힌다.
// 각도 규약: conic-gradient 는 위(12시)가 0deg 이고 시계 방향으로 큰다. 화살표도 위에 있으므로
// 원판을 A 만큼 돌리면 화살표가 가리키는 칸의 원래 각도는 (-A) 를 360 으로 나눈 나머지다.
(function () {
  var PRIZES = ['Coffee', 'Cookie', 'Coupon', 'Sticker', 'Again', 'Miss'];
  var RESULT = 'You got {n}!';
  var SPINNING = 'Spinning';
  var SLICE = 360 / PRIZES.length;
  var root = document.getElementById('rl');
  var disc = document.getElementById('rlDisc');
  var btn = document.getElementById('rlSpin');
  var out = document.getElementById('rlResult');
  var angle = 0, busy = false;

  function spin() {
    if (busy) { return; }
    root.classList.remove('is-demo');
    busy = true;
    btn.disabled = true;
    out.textContent = SPINNING;
    var turns = 5 + Math.floor(Math.random() * 4);                       // 5~8 바퀴
    var idx = Math.floor(Math.random() * PRIZES.length);                 // 멈출 칸
    var target = (360 - (idx * SLICE + SLICE / 2) + 360) % 360;          // 그 칸의 한가운데가 위로 오는 각도
    angle += turns * 360 + ((target - (angle % 360)) + 360) % 360;
    root.style.setProperty('--spin', angle + 'deg');
  }
  disc.addEventListener('transitionend', function (e) {
    // 라벨 글자도 같은 transition 을 쓰므로 버블링으로 올라온 것은 거른다
    if (e.target !== disc || e.propertyName !== 'transform') { return; }
    var at = ((-angle % 360) + 360) % 360;
    var i = Math.floor(at / SLICE) % PRIZES.length;
    out.textContent = RESULT.replace('{n}', PRIZES[i]);
    busy = false;
    btn.disabled = false;
  });
  btn.addEventListener('click', spin);
})();
</script>
</body>
</html>
