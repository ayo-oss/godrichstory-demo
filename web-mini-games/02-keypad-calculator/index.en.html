<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keypad calculator — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="kc is-demo" id="kc">
  <div class="kc__out">
    <span class="kc__hint" id="kcHint">Keyboard works too</span>
    <b class="kc__val kc__val--cut1" id="kcOut">0</b>
    <b class="kc__val kc__val--cut2" aria-hidden="true">7</b>
    <b class="kc__val kc__val--cut3" aria-hidden="true">8</b>
    <b class="kc__val kc__val--cut4" aria-hidden="true">56</b>
  </div>
  <div class="kc__pad" id="kcPad">
    <button class="kc__key kc__key--fn" type="button" data-k="clear" aria-label="Clear all" aria-keyshortcuts="Escape">C</button>
    <button class="kc__key kc__key--fn" type="button" data-k="back" aria-label="Delete one digit" aria-keyshortcuts="Backspace"><svg class="kc__ic" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><g fill="currentColor"><path d="M224 56v144a8 8 0 0 1-8 8H68.53a8 8 0 0 1-6.86-3.88L16 128l45.67-76.12A8 8 0 0 1 68.53 48H216a8 8 0 0 1 8 8" opacity=".2"/><path d="M216 40H68.53a16.08 16.08 0 0 0-13.72 7.77L9.14 123.88a8 8 0 0 0 0 8.24l45.67 76.11A16.08 16.08 0 0 0 68.53 216H216a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16M61.67 204.12l6.86-4.12ZM216 200H68.53l-43.2-72l43.2-72H216Zm-109.66-53.66L124.69 128l-18.35-18.34a8 8 0 0 1 11.32-11.32L136 116.69l18.34-18.35a8 8 0 0 1 11.32 11.32L147.31 128l18.35 18.34a8 8 0 0 1-11.32 11.32L136 139.31l-18.34 18.35a8 8 0 0 1-11.32-11.32"/></g></svg></button>
    <button class="kc__key kc__key--fn" type="button" data-k="pct" aria-keyshortcuts="%">%</button>
    <button class="kc__key kc__key--op" type="button" data-k="/" aria-label="Divide" aria-keyshortcuts="/">÷</button>
    <button class="kc__key" type="button" data-k="7" aria-keyshortcuts="7">7</button>
    <button class="kc__key" type="button" data-k="8" aria-keyshortcuts="8">8</button>
    <button class="kc__key" type="button" data-k="9" aria-keyshortcuts="9">9</button>
    <button class="kc__key kc__key--op" type="button" data-k="*" aria-label="Multiply" aria-keyshortcuts="*">×</button>
    <button class="kc__key" type="button" data-k="4" aria-keyshortcuts="4">4</button>
    <button class="kc__key" type="button" data-k="5" aria-keyshortcuts="5">5</button>
    <button class="kc__key" type="button" data-k="6" aria-keyshortcuts="6">6</button>
    <button class="kc__key kc__key--op" type="button" data-k="-" aria-label="Subtract" aria-keyshortcuts="-">−</button>
    <button class="kc__key" type="button" data-k="1" aria-keyshortcuts="1">1</button>
    <button class="kc__key" type="button" data-k="2" aria-keyshortcuts="2">2</button>
    <button class="kc__key" type="button" data-k="3" aria-keyshortcuts="3">3</button>
    <button class="kc__key kc__key--op" type="button" data-k="+" aria-label="Add" aria-keyshortcuts="+">+</button>
    <button class="kc__key" type="button" data-k="0" aria-keyshortcuts="0">0</button>
    <button class="kc__key" type="button" data-k="." aria-label="Decimal point" aria-keyshortcuts=".">.</button>
    <button class="kc__key kc__key--eq" type="button" data-k="=" aria-label="Equals" aria-keyshortcuts="Enter">=</button>
    <span class="kc__ghost" aria-hidden="true"></span>
  </div>
</div>
</main>
<script>
// 키패드 계산기 — 표시줄 하나와 4×5 키패드(grid-template-areas).
// 상태는 넷이다: acc(왼쪽 값) · op(대기 중인 연산자) · fresh(다음 숫자가 새 입력인가) · shown(표시 문자열).
// 연산자를 잇달아 누르면 마지막 것만 남고, 0 으로 나누면 안내 문구를 띄운 뒤 처음 상태로 돌아간다.
(function () {
  var ERR = 'Error';
  var ERR_WHY = 'Cannot divide by zero';
  var HINT = 'Keyboard works too';
  var root = document.getElementById('kc');
  var pad = document.getElementById('kcPad');
  var out = document.getElementById('kcOut');
  var hint = document.getElementById('kcHint');
  var acc = null, op = null, fresh = true, shown = '0';

  function show(v) { shown = v; out.textContent = v; }
  function fmt(n) { return String(Math.round(n * 1e10) / 1e10); }
  function calc(a, b, o) {
    if (o === '+') { return a + b; }
    if (o === '-') { return a - b; }
    if (o === '*') { return a * b; }
    return b === 0 ? null : a / b;
  }
  // 표시줄은 짧은 'Error' 만, 이유는 작은 힌트 줄에 — 26px 자리에 문장을 넣으면 패널을 넘친다
  function fail() { acc = null; op = null; fresh = true; shown = '0'; out.textContent = ERR; hint.textContent = ERR_WHY; }
  function digit(d) {
    if (fresh) { show(d === '.' ? '0.' : d); fresh = false; return; }
    if (d === '.' && shown.indexOf('.') >= 0) { return; }
    show(shown === '0' && d !== '.' ? d : shown + d);
  }
  function operator(o) {
    var v = Number(shown);
    if (op !== null && !fresh) {
      var r = calc(acc, v, op);
      if (r === null) { fail(); return; }
      acc = r; show(fmt(r));
    } else { acc = v; }
    op = o; fresh = true;
  }
  function equals() {
    if (op === null) { fresh = true; return; }
    var r = calc(acc, Number(shown), op);
    if (r === null) { fail(); return; }
    acc = r; op = null; fresh = true; show(fmt(r));
  }
  function back() {
    var s = shown.slice(0, -1);
    show(s === '' || s === '-' ? '0' : s);
    if (s === '' || s === '-') { fresh = true; }
  }
  function press(k) {
    root.classList.remove('is-demo');
    hint.textContent = HINT;
    if ('0123456789.'.indexOf(k) >= 0) { digit(k); }
    else if ('+-*/'.indexOf(k) >= 0) { operator(k); }
    else if (k === '=') { equals(); }
    else if (k === 'back') { back(); }
    else if (k === 'pct') { show(fmt(Number(shown) / 100)); fresh = true; }
    else { acc = null; op = null; fresh = true; show('0'); }
  }
  pad.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.kc__key') : null;
    if (btn) { press(btn.getAttribute('data-k')); }
  });
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'Enter' || k === '=') { k = '='; }
    else if (k === 'Backspace') { k = 'back'; }
    else if (k === 'Escape') { k = 'clear'; }
    else if (k === '%') { k = 'pct'; }
    else if ('0123456789.+-*/'.indexOf(k) < 0 || k === '') { return; }
    e.preventDefault();
    press(k);
  });
})();
</script>
</body>
</html>
