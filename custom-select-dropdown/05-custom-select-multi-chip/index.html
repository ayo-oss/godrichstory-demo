<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-select chip tokens — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="mc is-demo is-open">
    <span class="mc__label" id="mc-label">기술 스택</span>
    <div class="mc__field" id="mc-field" role="combobox" tabindex="0" aria-haspopup="listbox" aria-expanded="true" aria-controls="mc-list" aria-labelledby="mc-label">
      <span class="mc__chips" id="mc-chips">
        <span class="mc__chip" data-for="mc-o1">React<button class="mc__x" type="button" aria-label="React 빼기"><svg viewBox="0 0 256 256" width="10" height="10"><g fill="currentColor"><path d="M216 56v144a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h144a16 16 0 0 1 16 16" opacity=".2"/><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg></button></span>
        <span class="mc__chip" data-for="mc-o2">SCSS<button class="mc__x" type="button" aria-label="SCSS 빼기"><svg viewBox="0 0 256 256" width="10" height="10"><g fill="currentColor"><path d="M216 56v144a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16h144a16 16 0 0 1 16 16" opacity=".2"/><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></svg></button></span>
        <span class="mc__chip mc__chip--ghost" aria-hidden="true">Vite</span>
      </span>
      <span class="mc__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="12" height="12"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></span>
    </div>
    <ul class="mc__list" id="mc-list" role="listbox" aria-multiselectable="true" aria-labelledby="mc-label">
      <li class="mc__opt is-on" id="mc-o1" role="option" aria-selected="true">React<span class="mc__tick" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0M232 128A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></svg></span></li>
      <li class="mc__opt is-on" id="mc-o2" role="option" aria-selected="true">SCSS<span class="mc__tick" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0M232 128A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></svg></span></li>
      <li class="mc__opt mc__opt--pulse" id="mc-o3" role="option" aria-selected="false">Vite<span class="mc__tick" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0M232 128A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></svg></span></li>
    </ul>
  </div>
</main>
<script>
// 실제 동작: 항목을 누르면 칩이 실제로 늘고 줄며, Backspace 는 마지막 칩을 뺀다.
var root = document.querySelector('.mc');
var field = document.getElementById('mc-field');
var chips = document.getElementById('mc-chips');
var list = document.getElementById('mc-list');
var opts = [].slice.call(list.querySelectorAll('.mc__opt'));
var ghost = chips.querySelector('.mc__chip--ghost');
var at = 0;
function label(o) { return o.firstChild.nodeValue; }
function sync(o) {
  root.classList.remove('is-demo');
  if (ghost) { ghost.remove(); ghost = null; }
  var on = o.getAttribute('aria-selected') !== 'true';
  o.setAttribute('aria-selected', String(on));
  o.classList.toggle('is-on', on);
  var have = chips.querySelector('[data-for="' + o.id + '"]');
  if (on && !have) {
    var chip = document.createElement('span');
    chip.className = 'mc__chip';
    chip.dataset.for = o.id;
    chip.textContent = label(o);
    var x = document.createElement('button');
    x.type = 'button';
    x.className = 'mc__x';
    x.setAttribute('aria-label', label(o) + ' 빼기');
    x.textContent = '×';
    x.addEventListener('click', function (e) { e.stopPropagation(); sync(o); });
    chip.appendChild(x);
    chips.appendChild(chip);
  } else if (!on && have) { have.remove(); }
}
opts.forEach(function (o, i) {
  o.addEventListener('click', function () { at = i; sync(o); });
});
chips.querySelectorAll('.mc__x').forEach(function (x) {
  x.addEventListener('click', function (e) {
    e.stopPropagation();
    sync(document.getElementById(x.parentNode.dataset.for));
  });
});
field.addEventListener('keydown', function (e) {
  if (e.key === 'Backspace') {
    var last = chips.querySelector('.mc__chip:last-child');
    if (last && last.dataset.for) sync(document.getElementById(last.dataset.for));
    e.preventDefault();
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    at = Math.max(0, Math.min(at + (e.key === 'ArrowDown' ? 1 : -1), opts.length - 1));
    opts.forEach(function (o, k) { o.classList.toggle('is-at', k === at); });
    field.setAttribute('aria-activedescendant', opts[at].id);
    e.preventDefault();
  } else if (e.key === 'Enter' || e.key === ' ') { sync(opts[at]); e.preventDefault(); }
  else if (e.key === 'Escape') { root.classList.remove('is-open'); field.blur(); }
});
</script>
</body>
</html>
