<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Size segment picker — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="sg is-demo">
    <span class="sg__label" id="sg-label">サイズ</span>
    <div class="sg__track" id="sg-track" role="listbox" aria-labelledby="sg-label" tabindex="0" aria-activedescendant="sg-o1">
      <span class="sg__pill" aria-hidden="true"></span>
      <span class="sg__cell" id="sg-o1" role="option" aria-selected="true">S</span>
      <span class="sg__cell" id="sg-o2" role="option" aria-selected="false">M</span>
      <span class="sg__cell" id="sg-o3" role="option" aria-selected="false">L</span>
      <span class="sg__cell sg__cell--out" id="sg-o4" role="option" aria-selected="false" aria-disabled="true">XL</span>
    </div>
    <p class="sg__note">XLは売り切れ</p>
  </div>
</main>
<script>
// 실제 동작: 알약이 칸 폭(56px)만큼 옮겨 간다. 품절 칸은 aria-disabled 라 옮겨가지 않는다.
var root = document.querySelector('.sg');
var track = document.getElementById('sg-track');
var pill = root.querySelector('.sg__pill');
var cells = [].slice.call(track.querySelectorAll('.sg__cell'));
var W = 56;
var at = 0;
function pick(i) {
  if (i < 0 || i >= cells.length) return;
  if (cells[i].getAttribute('aria-disabled') === 'true') return;
  root.classList.remove('is-demo');
  at = i;
  pill.style.transform = 'translateX(' + (i * W) + 'px)';
  cells.forEach(function (c, k) { c.setAttribute('aria-selected', String(k === i)); });
  track.setAttribute('aria-activedescendant', cells[i].id);
}
cells.forEach(function (c, i) { c.addEventListener('click', function () { pick(i); }); });
track.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') { pick(at + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { pick(at - 1); e.preventDefault(); }
  else if (e.key === 'Home') { pick(0); e.preventDefault(); }
  else if (e.key === 'End') { pick(cells.length - 1); e.preventDefault(); }
});
</script>
</body>
</html>
