<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky grouped headers — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="gs is-demo is-open">
    <span class="gs__label" id="gs-label">Team</span>
    <button class="gs__btn" type="button" id="gs-btn" aria-haspopup="listbox" aria-expanded="true" aria-controls="gs-list" aria-labelledby="gs-label gs-value">
      <span id="gs-value">Frontend</span>
      <span class="gs__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="12" height="12"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></span>
    </button>
    <div class="gs__panel">
      <div class="gs__scroll" id="gs-scroll">
        <ul class="gs__track" id="gs-list" role="listbox" aria-labelledby="gs-label" tabindex="-1">
          <li class="gs__group" role="group" aria-labelledby="gs-g1">
            <p class="gs__head gs__head--a" id="gs-g1">Engineering</p>
            <ul class="gs__sub" role="presentation">
              <li class="gs__opt" id="gs-o1" role="option" aria-selected="true">Frontend</li>
              <li class="gs__opt" id="gs-o2" role="option" aria-selected="false">Backend</li>
            </ul>
          </li>
          <li class="gs__group" role="group" aria-labelledby="gs-g2">
            <p class="gs__head" id="gs-g2">Design</p>
            <ul class="gs__sub" role="presentation">
              <li class="gs__opt" id="gs-o3" role="option" aria-selected="false">UI design</li>
              <li class="gs__opt" id="gs-o4" role="option" aria-selected="false">Brand</li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작: 진짜 스크롤이라 position:sticky 로 그룹 제목이 목록 위에 붙는다. 버튼으로 열고 닫는다.
var root = document.querySelector('.gs');
var btn = document.getElementById('gs-btn');
var track = document.getElementById('gs-list');
var value = document.getElementById('gs-value');
var opts = [].slice.call(track.querySelectorAll('.gs__opt'));
var at = 0;
function open(on) {
  root.classList.remove('is-demo');
  root.classList.toggle('is-open', on);
  btn.setAttribute('aria-expanded', String(on));
  if (on) track.focus({ preventScroll: true });
}
function pick(i) {
  at = i;
  opts.forEach(function (o, k) { o.setAttribute('aria-selected', String(k === i)); });
  value.textContent = opts[i].textContent;
  open(false);
  btn.focus({ preventScroll: true });
}
btn.addEventListener('click', function () { open(!root.classList.contains('is-open')); });
opts.forEach(function (o, i) { o.addEventListener('click', function () { pick(i); }); });
track.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    at = Math.max(0, Math.min(at + (e.key === 'ArrowDown' ? 1 : -1), opts.length - 1));
    opts.forEach(function (o, k) { o.classList.toggle('is-at', k === at); });
    track.setAttribute('aria-activedescendant', opts[at].id);
    opts[at].scrollIntoView({ block: 'nearest' });
    e.preventDefault();
  } else if (e.key === 'Enter' || e.key === ' ') { pick(at); e.preventDefault(); }
  else if (e.key === 'Escape') { open(false); btn.focus({ preventScroll: true }); }
});
document.addEventListener('click', function (e) { if (!e.target.closest('.gs')) open(false); });
</script>
</body>
</html>
