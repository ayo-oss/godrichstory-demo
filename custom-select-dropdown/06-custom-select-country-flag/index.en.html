<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Country and currency select — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cf is-demo is-open">
    <span class="cf__label" id="cf-label">Ship to</span>
    <button class="cf__btn" type="button" id="cf-btn" aria-haspopup="listbox" aria-expanded="true" aria-controls="cf-list" aria-labelledby="cf-label cf-name">
      <span class="cf__swap">
        <span class="cf__flag cf__slot cf__slot--a"><svg viewBox="0 0 16 12" width="16" height="12" aria-hidden="true"><rect width="16" height="12" fill="#ffffff"/><circle cx="8" cy="6" r="3.4" fill="#a45164"/></svg></span>
        <span class="cf__flag cf__slot cf__slot--b" aria-hidden="true"><svg viewBox="0 0 16 12" width="16" height="12"><rect width="16" height="12" fill="#ffffff"/><rect width="5.33" height="12" fill="#496f93"/><rect x="10.67" width="5.33" height="12" fill="#ca9693"/></svg></span>
      </span>
      <span class="cf__name" id="cf-name">
        <span class="cf__slot cf__slot--a">Japan</span>
        <span class="cf__slot cf__slot--b" aria-hidden="true">France</span>
      </span>
      <span class="cf__cur">
        <span class="cf__slot cf__slot--a">JPY ¥</span>
        <span class="cf__slot cf__slot--b" aria-hidden="true">EUR €</span>
      </span>
      <span class="cf__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="12" height="12"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></span>
    </button>
    <span class="cf__mark" aria-hidden="true"></span>
    <ul class="cf__list" id="cf-list" role="listbox" aria-labelledby="cf-label">
      <li class="cf__opt cf__opt--a" id="cf-o1" role="option" aria-selected="true" data-cur="JPY ¥">
        <span class="cf__flag"><svg viewBox="0 0 16 12" width="16" height="12" aria-hidden="true"><rect width="16" height="12" fill="#ffffff"/><circle cx="8" cy="6" r="3.4" fill="#a45164"/></svg></span>
        <span class="cf__opt-name">Japan</span><span class="cf__code">JPY</span>
      </li>
      <li class="cf__opt cf__opt--b" id="cf-o2" role="option" aria-selected="false" data-cur="EUR €">
        <span class="cf__flag"><svg viewBox="0 0 16 12" width="16" height="12" aria-hidden="true"><rect width="16" height="12" fill="#ffffff"/><rect width="5.33" height="12" fill="#496f93"/><rect x="10.67" width="5.33" height="12" fill="#ca9693"/></svg></span>
        <span class="cf__opt-name">France</span><span class="cf__code">EUR</span>
      </li>
      <li class="cf__opt" id="cf-o3" role="option" aria-selected="false" data-cur="PLN zł">
        <span class="cf__flag"><svg viewBox="0 0 16 12" width="16" height="12" aria-hidden="true"><rect width="16" height="6" fill="#ffffff"/><rect y="6" width="16" height="6" fill="#b8707e"/></svg></span>
        <span class="cf__opt-name">Poland</span><span class="cf__code">PLN</span>
      </li>
      <li class="cf__opt" id="cf-o4" role="option" aria-selected="false" data-cur="IDR Rp">
        <span class="cf__flag"><svg viewBox="0 0 16 12" width="16" height="12" aria-hidden="true"><rect width="16" height="6" fill="#b3646d"/><rect y="6" width="16" height="6" fill="#ffffff"/></svg></span>
        <span class="cf__opt-name">Indonesia</span><span class="cf__code">IDR</span>
      </li>
    </ul>
  </div>
</main>
<script>
// 실제 동작: 국가를 고르면 버튼의 국기와 통화 표시가 함께 바뀐다.
var root = document.querySelector('.cf');
var btn = document.getElementById('cf-btn');
var list = document.getElementById('cf-list');
var name = document.getElementById('cf-name');
var swap = root.querySelector('.cf__swap');
var cur = root.querySelector('.cf__cur');
var opts = [].slice.call(list.querySelectorAll('.cf__opt'));
var at = 0;
function open(on) {
  root.classList.remove('is-demo');
  root.classList.toggle('is-open', on);
  btn.setAttribute('aria-expanded', String(on));
  if (on) list.focus({ preventScroll: true });
}
function pick(i) {
  at = i;
  root.classList.remove('is-demo');
  opts.forEach(function (o, k) { o.setAttribute('aria-selected', String(k === i)); });
  swap.innerHTML = opts[i].querySelector('.cf__flag').innerHTML;
  name.textContent = opts[i].querySelector('.cf__opt-name').textContent;
  cur.textContent = opts[i].dataset.cur;
  open(false);
  btn.focus({ preventScroll: true });
}
btn.addEventListener('click', function () { open(!root.classList.contains('is-open')); });
opts.forEach(function (o, i) { o.addEventListener('click', function () { pick(i); }); });
list.setAttribute('tabindex', '-1');
list.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    at = Math.max(0, Math.min(at + (e.key === 'ArrowDown' ? 1 : -1), opts.length - 1));
    opts.forEach(function (o, k) { o.classList.toggle('is-at', k === at); });
    list.setAttribute('aria-activedescendant', opts[at].id);
    e.preventDefault();
  } else if (e.key === 'Enter' || e.key === ' ') { pick(at); e.preventDefault(); }
  else if (e.key === 'Escape') { open(false); btn.focus({ preventScroll: true }); }
});
document.addEventListener('click', function (e) { if (!e.target.closest('.cf')) open(false); });
</script>
</body>
</html>
