<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Searchable combobox — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cb is-demo">
    <span class="cb__label" id="cb-label">City</span>
    <div class="cb__field">
      <span class="cb__mag" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M192 112a80 80 0 1 1-80-80a80 80 0 0 1 80 80" opacity=".2"/><path d="m229.66 218.34l-50.06-50.06a88.21 88.21 0 1 0-11.32 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72"/></g></svg></span>
      <input class="cb__input" id="cb-input" type="text" role="combobox" aria-expanded="true" aria-controls="cb-list" aria-autocomplete="list" aria-labelledby="cb-label" placeholder="Search city" autocomplete="off">
      <span class="cb__typed" aria-hidden="true">Dae</span>
    </div>
    <div class="cb__box">
      <ul class="cb__list" id="cb-list" role="listbox" aria-labelledby="cb-label">
        <li class="cb__opt cb__opt--out" id="cb-o1" role="option" aria-selected="false">Seoul</li>
        <li class="cb__opt cb__opt--out" id="cb-o2" role="option" aria-selected="false">Busan</li>
        <li class="cb__opt cb__opt--hit" id="cb-o3" role="option" aria-selected="false"><span class="cb__m">Dae</span>gu</li>
        <li class="cb__opt cb__opt--hit" id="cb-o4" role="option" aria-selected="false"><span class="cb__m">Dae</span>jeon</li>
      </ul>
      <p class="cb__empty" id="cb-empty" hidden>No results</p>
    </div>
  </div>
</main>
<script>
// 실제 동작: 글자를 치면 목록이 실제로 줄고, 맞은 글자만 형광으로 칠해진다.
var root = document.querySelector('.cb');
var input = document.getElementById('cb-input');
var list = document.getElementById('cb-list');
var empty = document.getElementById('cb-empty');
var opts = [].slice.call(list.querySelectorAll('.cb__opt'));
var names = opts.map(function (o) { return o.textContent; });
var at = -1;
function render(q) {
  root.classList.remove('is-demo');
  var shown = 0;
  opts.forEach(function (o, i) {
    var hit = !q || names[i].indexOf(q) >= 0;
    o.hidden = !hit;
    if (hit) {
      shown++;
      var k = names[i].indexOf(q);
      o.innerHTML = !q ? names[i]
        : names[i].slice(0, k) + '<span class="cb__m is-on">' + q + '</span>' + names[i].slice(k + q.length);
    }
  });
  empty.hidden = shown > 0;
  at = -1;
}
input.addEventListener('input', function () { render(input.value.trim()); });
input.addEventListener('keydown', function (e) {
  var vis = opts.filter(function (o) { return !o.hidden; });
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    at = Math.max(0, Math.min(at + (e.key === 'ArrowDown' ? 1 : -1), vis.length - 1));
    vis.forEach(function (o, i) { o.classList.toggle('is-at', i === at); });
    if (vis[at]) input.setAttribute('aria-activedescendant', vis[at].id);
    e.preventDefault();
  } else if (e.key === 'Enter' && vis[at]) {
    vis.forEach(function (o) { o.setAttribute('aria-selected', String(o === vis[at])); });
    input.value = vis[at].textContent;
    render('');
    e.preventDefault();
  } else if (e.key === 'Escape') {
    input.value = ''; render(''); input.focus({ preventScroll: true });
  }
});
</script>
</body>
</html>
