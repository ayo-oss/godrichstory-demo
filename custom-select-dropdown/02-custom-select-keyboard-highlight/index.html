<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyboard highlight rail — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="kb is-demo">
    <span class="kb__label" id="kb-label">정렬 기준</span>
    <div class="kb__panel">
      <div class="kb__rail" aria-hidden="true"></div>
      <ul class="kb__list" id="kb-list" role="listbox" aria-labelledby="kb-label" tabindex="0" aria-activedescendant="kb-o1">
        <li class="kb__opt" id="kb-o1" role="option" aria-selected="true">최신순</li>
        <li class="kb__opt" id="kb-o2" role="option" aria-selected="false">인기순</li>
        <li class="kb__opt" id="kb-o3" role="option" aria-selected="false">가격 낮은순</li>
        <li class="kb__opt" id="kb-o4" role="option" aria-selected="false">가격 높은순</li>
      </ul>
    </div>
    <span class="kb__hint">↑ ↓ Home End</span>
  </div>
</main>
<script>
// 실제 동작: 화살표·Home·End 로 하이라이트 막대가 옮겨 다니고, Enter 로 그 줄이 선택된다.
var root = document.querySelector('.kb');
var list = document.getElementById('kb-list');
var rail = document.querySelector('.kb__rail');
var opts = [].slice.call(list.querySelectorAll('.kb__opt'));
var ROW = 28;
var at = 0;
function move(i) {
  root.classList.remove('is-demo');
  at = Math.max(0, Math.min(i, opts.length - 1));
  rail.style.transform = 'translateY(' + (at * ROW) + 'px)';
  list.setAttribute('aria-activedescendant', opts[at].id);
  opts.forEach(function (o, k) { o.classList.toggle('is-at', k === at); });
}
function choose() {
  opts.forEach(function (o, k) {
    o.setAttribute('aria-selected', String(k === at));
    o.classList.toggle('is-sel', k === at);
  });
}
list.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown') { move(at + 1); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { move(at - 1); e.preventDefault(); }
  else if (e.key === 'Home') { move(0); e.preventDefault(); }
  else if (e.key === 'End') { move(opts.length - 1); e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === ' ') { choose(); e.preventDefault(); }
});
opts.forEach(function (o, i) {
  o.addEventListener('click', function () { move(i); choose(); });
});
</script>
</body>
</html>
