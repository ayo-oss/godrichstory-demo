<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring-open base select — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ss is-demo">
    <span class="ss__label" id="ss-label">배송 방법</span>
    <button class="ss__btn" type="button" id="ss-btn" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="ss-list" aria-labelledby="ss-label ss-value">
      <span class="ss__value" id="ss-value">일반 배송</span>
      <span class="ss__caret" aria-hidden="true"><svg viewBox="0 0 256 256" width="12" height="12"><g fill="currentColor"><path d="m208 96l-80 80l-80-80Z" opacity=".2"/><path d="M215.39 92.94A8 8 0 0 0 208 88H48a8 8 0 0 0-5.66 13.66l80 80a8 8 0 0 0 11.32 0l80-80a8 8 0 0 0 1.73-8.72M128 164.69L67.31 104h121.38Z"/></g></svg></span>
    </button>
    <ul class="ss__list" id="ss-list" role="listbox" aria-labelledby="ss-label" tabindex="-1">
      <li class="ss__opt is-sel" id="ss-o1" role="option" aria-selected="true"><span>일반 배송</span><span class="ss__tick" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0M232 128A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></svg></span></li>
      <li class="ss__opt" id="ss-o2" role="option" aria-selected="false"><span>새벽 배송</span><span class="ss__tick" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0M232 128A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></svg></span></li>
      <li class="ss__opt" id="ss-o3" role="option" aria-selected="false"><span>당일 배송</span><span class="ss__tick" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0M232 128A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></svg></span></li>
      <li class="ss__opt" id="ss-o4" role="option" aria-selected="false"><span>매장 픽업</span><span class="ss__tick" aria-hidden="true"><svg viewBox="0 0 256 256" width="13" height="13"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M173.66 98.34a8 8 0 0 1 0 11.32l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 0M232 128A104 104 0 1 1 128 24a104.11 104.11 0 0 1 104 104m-16 0a88 88 0 1 0-88 88a88.1 88.1 0 0 0 88-88"/></g></svg></span></li>
    </ul>
  </div>
</main>
<script>
// 실제 동작: 버튼으로 열고 닫고, 화살표로 옮기고, Enter 로 고르고, Escape 로 닫는다.
var root = document.querySelector('.ss');
var btn = document.getElementById('ss-btn');
var list = document.getElementById('ss-list');
var value = document.getElementById('ss-value');
var opts = [].slice.call(list.querySelectorAll('.ss__opt'));
var active = 0;
function paint() {
  opts.forEach(function (o, i) { o.classList.toggle('is-active', i === active); });
  list.setAttribute('aria-activedescendant', opts[active].id);
}
function open(on) {
  root.classList.remove('is-demo');
  root.classList.toggle('is-open', on);
  btn.setAttribute('aria-expanded', String(on));
  if (on) { paint(); list.focus({ preventScroll: true }); }
}
function pick(i) {
  opts.forEach(function (o, k) {
    o.classList.toggle('is-sel', k === i);
    o.setAttribute('aria-selected', String(k === i));
  });
  value.textContent = opts[i].firstElementChild.textContent;
  open(false);
  btn.focus({ preventScroll: true });
}
btn.addEventListener('click', function () { open(!root.classList.contains('is-open')); });
opts.forEach(function (o, i) {
  o.addEventListener('click', function () { pick(i); });
  o.addEventListener('mousemove', function () { active = i; paint(); });
});
list.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown') { active = Math.min(active + 1, opts.length - 1); paint(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); paint(); e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === ' ') { pick(active); e.preventDefault(); }
  else if (e.key === 'Escape') { open(false); btn.focus({ preventScroll: true }); }
});
document.addEventListener('click', function (e) { if (!e.target.closest('.ss')) open(false); });
</script>
</body>
</html>
