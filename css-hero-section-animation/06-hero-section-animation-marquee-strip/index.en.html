<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marquee strip — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="marquee">
    <p class="marquee__label">Integrates with</p>
    <div class="marquee__row">
      <div class="marquee__track">
        <span class="marquee__pill">STRIPE</span>
        <span class="marquee__pill">NOTION</span>
        <span class="marquee__pill">FIGMA</span>
        <span class="marquee__pill">SLACK</span>
        <span class="marquee__pill">LINEAR</span>
        <span class="marquee__pill" aria-hidden="true">STRIPE</span>
        <span class="marquee__pill" aria-hidden="true">NOTION</span>
        <span class="marquee__pill" aria-hidden="true">FIGMA</span>
        <span class="marquee__pill" aria-hidden="true">SLACK</span>
        <span class="marquee__pill" aria-hidden="true">LINEAR</span>
      </div>
    </div>
  </div>
</main>
</body>
</html>
