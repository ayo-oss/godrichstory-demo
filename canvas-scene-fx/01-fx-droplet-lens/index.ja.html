<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水滴レンズのデモ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="dl" id="dl">
  <p class="dl__hint">
    <svg class="dl__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M208 144a80 80 0 0 1-160 0c0-72 80-128 80-128s80 56 80 128" opacity=".2"/><path d="M174 47.75a254.2 254.2 0 0 0-41.45-38.3a8 8 0 0 0-9.18 0A254.2 254.2 0 0 0 82 47.75C54.51 79.32 40 112.6 40 144a88 88 0 0 0 176 0c0-31.4-14.51-64.68-42-96.25M128 216a72.08 72.08 0 0 1-72-72c0-57.23 55.47-105 72-118c16.53 13 72 60.75 72 118a72.08 72.08 0 0 1-72 72m55.89-62.66a57.6 57.6 0 0 1-46.56 46.55a9 9 0 0 1-1.33.11a8 8 0 0 1-1.32-15.89c16.57-2.79 30.63-16.85 33.44-33.45a8 8 0 0 1 15.78 2.68Z"/></g></svg>
    <span>水滴をつかんで動かすと、その下がレンズのように膨らみます</span>
  </p>
  <div class="dl__field" id="field" role="application" aria-label="屈折の実験台" tabindex="0">
    <canvas class="dl__cv" id="cv"></canvas>
    <b class="dl__badge" aria-hidden="true"><span class="dl__badgeNum">1.34</span><span class="dl__badgeUnit">屈折率</span></b>
  </div>
</div>
</main>
<script>
// 물방울 렌즈 — 배경을 한 번 그려 둔 다음, 방울이 덮은 원 안쪽 픽셀만 getImageData 로 꺼내
// 구면 屈折の式で 자리를 옮겨 putImageData 로 되돌려 놓는다.
// 요점은 "확대"가 아니라 **표본 좌표를 옮기는 것**이다 — 그릴 것은 그대로고 어디서 읽느냐만 바뀐다.
var root = document.getElementById('dl');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
// willReadFrequently — 프레임마다 getImageData 를 부르는 캔버스는 이 힌트를 줘야 GPU 왕복을 안 한다
var ctx = cv.getContext('2d', { willReadFrequently: true });

var css = getComputedStyle(root);
var PAPER = css.getPropertyValue('--paper').trim();
var INK = css.getPropertyValue('--ink').trim();
var LINE = css.getPropertyValue('--line').trim();
var RIM0 = css.getPropertyValue('--rim-0').trim();
var RIM1 = css.getPropertyValue('--rim-1').trim();
var GLOSS0 = css.getPropertyValue('--gloss-0').trim();
var GLOSS1 = css.getPropertyValue('--gloss-1').trim();
var EDGE = css.getPropertyValue('--edge').trim();
var FONT = '-apple-system, "Segoe UI", "Noto Sans KR", sans-serif';

var LINES = ['画素を取り出し', '屈折の式で', '置き直します'];
var IOR = 1.34;              // 물의 屈折率 — 공기(1.00)에서 물로 들어갈 때의 비
var GRID = 20;               // 배경 격자 한 칸(CSS px) — 렌즈가 휘는 정도를 눈으로 재는 자
var LOOP = 2;                // 방울이 8자 한 바퀴를 도는 데 걸리는 초. 캡처 창(2초)과 같아 gif 가 이어진다

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1, radius = 54;
var cx = 0, cy = 0;          // 방울 중심(CSS px)
var tx = 0, ty = 0;          // 방울이 따라가는 목표점
var manual = false;          // 사람이 잡고 있는가 — 손을 떼면 다시 8자 경로로 돌아간다
var raf = 0;

// 고DPI 대응 — 배킹 스토어는 devicePixelRatio 배, 그리기 좌표계는 CSS 픽셀 그대로.
// 굴절 계산만 배킹 스토어(장치 픽셀) 기준으로 한다. getImageData·putImageData 는 변환을 무시하기 때문이다.
function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  radius = Math.max(30, Math.min(62, Math.round(Math.min(W, H) * 0.27)));
  if (!cx) { cx = W * 0.5; cy = H * 0.5; tx = cx; ty = cy; }
}

// 배경 — 렌즈가 읽어갈 그림. 글자와 격자처럼 가늘고 곧은 것이 굴절을 가장 잘 드러낸다
function scene() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = LINE;
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var x = GRID; x < W; x += GRID) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
  for (var y = GRID; y < H; y += GRID) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
  ctx.stroke();
  ctx.globalAlpha = 1;
  // 글자는 판을 가득 채운다 — 방울이 어디로 가든 굴절시킬 것이 있어야 렌즈로 보인다(실측:
  // 세 줄만 두었더니 방울이 빈 자리를 확대해 뿌연 공으로만 보였다)
  // 100px 로 한 번 재 두고 가장 긴 줄이 판 폭의 88% 가 되도록 크기를 역산한다
  ctx.font = '700 100px ' + FONT;
  var widest = 1;
  for (var k = 0; k < LINES.length; k++) widest = Math.max(widest, ctx.measureText(LINES[k]).width);
  var size = Math.max(12, Math.round(100 * (W * 0.88) / widest));
  var rowH = Math.round(size * 1.18);
  var rows = Math.max(3, Math.round(H / rowH));
  var top = (H - (rows - 1) * rowH) * 0.5;
  ctx.fillStyle = INK;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 ' + size + 'px ' + FONT;
  for (var i = 0; i < rows; i++) {
    ctx.fillText(LINES[i % LINES.length], W * 0.5, top + i * rowH);
  }
}

// 구면 굴절 — 수직으로 들어온 빛이 반구 표면에서 스넬 법칙만큼 꺾인다.
// 중심에서의 정규화 거리 rn 이 곧 입사각의 sin 이고, 그 각도 차이가 깊이만큼 곱해져 옆으로 밀린 양이 된다.
function refract() {
  var pr = Math.round(radius * dpr);
  var px = Math.round(cx * dpr), py = Math.round(cy * dpr);
  var sx = Math.max(0, px - pr), sy = Math.max(0, py - pr);
  var ex = Math.min(cv.width, px + pr), ey = Math.min(cv.height, py + pr);
  var sw = ex - sx, sh = ey - sy;
  if (sw < 2 || sh < 2) return;
  var src = ctx.getImageData(sx, sy, sw, sh);
  var out = ctx.createImageData(sw, sh);
  var s = src.data, o = out.data;
  var ox = px - sx, oy = py - sy;      // 잘라낸 조각 안에서의 방울 중심
  var depth = pr * 0.9;                // 방울 아래 물층 두께(구 반지름의 0.9배) — 클수록 크게 부푼다.
                                       // 1.0 을 넘기면 가장자리에서 표본 좌표가 음수로 넘어가 상이 뒤집힌다
  for (var y = 0; y < sh; y++) {
    for (var x = 0; x < sw; x++) {
      var i = (y * sw + x) * 4;
      var dx = x - ox, dy = y - oy;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var rn = dist / pr;
      var j = i;
      if (rn < 1 && dist > 0) {
        var inc = Math.asin(rn);                 // 입사각
        var ref = Math.asin(rn / IOR);           // 굴절각 (스넬 법칙)
        var shift = depth * Math.tan(inc - ref); // 안쪽으로 당겨 읽을 거리
        var k = (dist - shift) / dist;
        var mx = Math.round(ox + dx * k), my = Math.round(oy + dy * k);
        if (mx < 0) mx = 0; else if (mx >= sw) mx = sw - 1;
        if (my < 0) my = 0; else if (my >= sh) my = sh - 1;
        j = (my * sw + mx) * 4;
      }
      o[i] = s[j]; o[i + 1] = s[j + 1]; o[i + 2] = s[j + 2]; o[i + 3] = 255;
    }
  }
  ctx.putImageData(out, sx, sy);
}

// 방울처럼 보이게 하는 것은 굴절이 아니라 이 세 겹이다 — 가장자리 그늘·왼쪽 위 광택·얇은 테두리
function gloss() {
  // 가장자리 그늘은 좁고 옅게 — 넓게 깔면 방울이 유리가 아니라 회색 공으로 읽힌다(실측)
  var rim = ctx.createRadialGradient(cx, cy, radius * 0.72, cx, cy, radius);
  rim.addColorStop(0, RIM0);
  rim.addColorStop(1, RIM1);
  ctx.fillStyle = rim;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();
  // 광택은 작게 — 크게 깔면 굴절로 부푼 글자가 하얗게 묻힌다(실측)
  var hx = cx - radius * 0.36, hy = cy - radius * 0.4;
  var hi = ctx.createRadialGradient(hx, hy, 1, hx, hy, radius * 0.26);
  hi.addColorStop(0, GLOSS0);
  hi.addColorStop(1, GLOSS1);
  ctx.fillStyle = hi;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = EDGE;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, cy, radius - 0.75, 0, Math.PI * 2);
  ctx.stroke();
}

function draw() {
  scene();
  refract();
  gloss();
}

// 8자 경로 — 가로는 한 바퀴, 세로는 두 바퀴 도는 리사주 곡선이 그대로 8자가 된다
function autoTarget(sec) {
  var th = (sec % LOOP) / LOOP * Math.PI * 2;
  tx = W * 0.5 + Math.sin(th) * W * 0.26;
  ty = H * 0.5 + Math.sin(th * 2) * H * 0.2;
}

function step(sec) {
  if (!manual) autoTarget(sec);
  cx += (tx - cx) * 0.16;
  cy += (ty - cy) * 0.16;
}

function frame(now) {
  step(now / 1000);
  draw();
  raf = requestAnimationFrame(frame);
}

function aim(e) {
  var r = field.getBoundingClientRect();
  tx = Math.max(0, Math.min(W, e.clientX - r.left));
  ty = Math.max(0, Math.min(H, e.clientY - r.top));
  manual = true;
}

field.addEventListener('pointermove', aim);
field.addEventListener('pointerdown', function (e) { aim(e); field.setPointerCapture(e.pointerId); });
field.addEventListener('pointerup', function (e) { field.releasePointerCapture(e.pointerId); });
field.addEventListener('pointerleave', function () { manual = false; });
field.addEventListener('keydown', function (e) {
  var d = { ArrowLeft: [-16, 0], ArrowRight: [16, 0], ArrowUp: [0, -16], ArrowDown: [0, 16] }[e.key];
  if (!d) { if (e.key === 'Escape') manual = false; return; }
  e.preventDefault();
  manual = true;
  tx = Math.max(0, Math.min(W, tx + d[0]));
  ty = Math.max(0, Math.min(H, ty + d[1]));
  if (reduce) { cx = tx; cy = ty; draw(); }
});
window.addEventListener('resize', function () { fit(); if (reduce) draw(); });

fit();
if (reduce) {
  // reduce — 루프를 시작하지 않고 방울이 글자 위에 올라선 한 장만 그린다(빈 화면이 아니다)
  root.classList.add('is-still');
  cx = W * 0.44; cy = H * 0.5; tx = cx; ty = cy;
  draw();
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
