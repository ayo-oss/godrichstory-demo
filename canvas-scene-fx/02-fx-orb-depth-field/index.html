<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 볼 필드 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="od" id="od">
  <p class="od__hint">
    <svg class="od__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M224 128a96 96 0 1 1-96-96a96 96 0 0 1 96 96" opacity=".2"/><path d="M128 24a104 104 0 1 0 104 104A104.12 104.12 0 0 0 128 24m88 104a87.6 87.6 0 0 1-3.33 24h-38.51a157.4 157.4 0 0 0 0-48h38.51a87.6 87.6 0 0 1 3.33 24m-114 40h52a115.1 115.1 0 0 1-26 45a115.3 115.3 0 0 1-26-45m-3.9-16a140.8 140.8 0 0 1 0-48h59.88a140.8 140.8 0 0 1 0 48ZM40 128a87.6 87.6 0 0 1 3.33-24h38.51a157.4 157.4 0 0 0 0 48H43.33A87.6 87.6 0 0 1 40 128m114-40h-52a115.1 115.1 0 0 1 26-45a115.3 115.3 0 0 1 26 45m52.33 0h-35.62a135.3 135.3 0 0 0-22.3-45.6A88.29 88.29 0 0 1 206.37 88Zm-98.74-45.6A135.3 135.3 0 0 0 85.29 88H49.63a88.29 88.29 0 0 1 57.96-45.6M49.63 168h35.66a135.3 135.3 0 0 0 22.3 45.6A88.29 88.29 0 0 1 49.63 168m98.78 45.6a135.3 135.3 0 0 0 22.3-45.6h35.66a88.29 88.29 0 0 1-57.96 45.6"/></g></svg>
    <span>초점거리를 줄이면 원근이 세져 앞쪽 구슬이 크게 옵니다</span>
  </p>
  <div class="od__field" id="field" role="application" aria-label="원근 실험판" tabindex="0">
    <canvas class="od__cv" id="cv"></canvas>
  </div>
  <div class="od__bar">
    <label class="od__dial">초점거리
      <input type="range" id="focal" min="120" max="640" step="20" value="280" aria-label="초점거리">
      <b class="od__val" id="focalVal">280px</b>
    </label>
  </div>
</div>
</main>
<script>
// 떠오르는 3D 볼 필드 — 구슬마다 x·y·z 를 두고 s = focal / (focal + z) 한 번으로 원근을 만든다.
// 3D 라이브러리도 행렬도 없다. 입체로 읽히는 것은 ① 먼 것부터 그리는 화가 알고리즘 ② z 를 따라
// 같이 변하는 반경·흐림·투명도, 이 둘뿐이다.
var root = document.getElementById('od');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var focalIn = document.getElementById('focal');
var focalOut = document.getElementById('focalVal');

var css = getComputedStyle(root);
function tone(name) {
  return [
    css.getPropertyValue('--orb-' + name + '-hi').trim(),
    css.getPropertyValue('--orb-' + name + '-mid').trim(),
    css.getPropertyValue('--orb-' + name + '-lo').trim()
  ];
}
var TONES = [tone('a'), tone('a'), tone('a'), tone('b'), tone('c')];
var BG0 = css.getPropertyValue('--bg-0').trim();
var BG1 = css.getPropertyValue('--bg-1').trim();

var COUNT = 40;
var Z_NEAR = 40, Z_FAR = 980;      // 구슬이 사는 깊이 구간
var RISE = 52;                     // 월드 좌표에서의 상승 속도 — 모든 구슬이 같다(등속)
var DRIFT = 26;                    // 같은 속도로 천천히 다가온다
var TAU = Math.PI * 2;
var MAX_BLUR = 7;

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1;
var spanX = 0, spanY = 0;
var focal = 280;
var camX = 0, camY = 0, aimX = 0, aimY = 0;   // 포인터가 만드는 시차(카메라 평행이동)
var orbs = [], order = [];
var last = 0, raf = 0;

for (var i = 0; i < COUNT; i++) {
  var o = {
    x: Math.random() * 2 - 1,        // 월드 폭 대비 비율 — fit() 에서 실제 좌표로 편다
    y: Math.random() * 2 - 1,
    z: Z_NEAR + Math.random() * (Z_FAR - Z_NEAR),
    r: 16 + Math.random() * 30,
    tone: i % TONES.length
  };
  orbs.push(o);
  order.push(o);
}

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  spanX = W * 0.92;                  // 화면 밖까지 조금 넉넉히 — 가장자리에서 구슬이 툭 사라지지 않게
  spanY = H * 1.15;
}

// 월드 좌표는 -1..1 비율로 들고 있다가 그릴 때만 화면 크기를 곱한다 — 창이 바뀌어도 배치가 안 흐트러진다
function step(dt) {
  var ry = RISE * dt / spanY;
  var rz = DRIFT * dt;
  for (var i = 0; i < COUNT; i++) {
    var o = orbs[i];
    o.y -= ry;
    if (o.y < -1.1) o.y += 2.2;      // 위를 벗어나면 아래에서 다시 들어온다
    o.z -= rz;
    if (o.z < Z_NEAR) o.z += (Z_FAR - Z_NEAR);
  }
  camX += (aimX - camX) * 0.12;
  camY += (aimY - camY) * 0.12;
}

function draw() {
  var bg = ctx.createRadialGradient(W * 0.5, H * 0.42, 8, W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
  bg.addColorStop(0, BG0);
  bg.addColorStop(1, BG1);
  ctx.filter = 'none';
  ctx.globalAlpha = 1;
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 화가 알고리즘 — z 내림차순으로 먼 것부터. 깊이 버퍼가 없는 2D 에서 겹침 순서를 만드는 유일한 방법이다
  order.sort(function (a, b) { return b.z - a.z; });

  var blurNow = -1;
  for (var i = 0; i < COUNT; i++) {
    var o = order[i];
    var s = focal / (focal + o.z);                 // 원근 투영 — 이 한 줄이 전부다
    var sx = W * 0.5 + (o.x * spanX * 0.5 - camX) * s;
    var sy = H * 0.5 + (o.y * spanY * 0.5 - camY) * s;
    var r = o.r * s;
    if (r < 0.8) continue;
    // 흐림은 정수 단계로 끊는다 — z 로 정렬돼 있어 ctx.filter 를 다섯 번쯤만 갈아 끼우면 된다.
    // 범위를 0~7px 로 넓혀 먼 것·가까운 것의 차이가 한눈에 벌어지게 한다(기존 4px 로는 스틸컷에서
    // 거의 안 보였다 — 실측)
    var blur = Math.round((o.z - Z_NEAR) / (Z_FAR - Z_NEAR) * MAX_BLUR * 1.2);
    if (blur > MAX_BLUR) blur = MAX_BLUR;
    if (blur !== blurNow) {
      ctx.filter = blur > 0 ? 'blur(' + blur + 'px)' : 'none';
      blurNow = blur;
    }
    ctx.globalAlpha = 0.28 + 0.72 * Math.min(1, s * 1.6);
    var t = TONES[o.tone];
    var g = ctx.createRadialGradient(sx - r * 0.36, sy - r * 0.42, r * 0.06, sx, sy, r);
    g.addColorStop(0, t[0]);
    g.addColorStop(0.52, t[1]);
    g.addColorStop(1, t[2]);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, TAU);
    ctx.fill();
  }
  ctx.filter = 'none';
  ctx.globalAlpha = 1;
}

function frame(now) {
  var dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
  last = now;
  step(dt);
  draw();
  raf = requestAnimationFrame(frame);
}

function setFocal(v) {
  focal = Number(v);
  focalOut.textContent = focal + 'px';
  if (reduce) draw();
}

focalIn.addEventListener('input', function () { setFocal(focalIn.value); });
field.addEventListener('pointermove', function (e) {
  var r = field.getBoundingClientRect();
  aimX = ((e.clientX - r.left) / r.width - 0.5) * 150;
  aimY = ((e.clientY - r.top) / r.height - 0.5) * 90;
  if (reduce) { camX = aimX; camY = aimY; draw(); }
});
field.addEventListener('pointerleave', function () { aimX = 0; aimY = 0; });
field.addEventListener('keydown', function (e) {
  var d = { ArrowLeft: [-30, 0], ArrowRight: [30, 0], ArrowUp: [0, -22], ArrowDown: [0, 22] }[e.key];
  if (!d) return;
  e.preventDefault();
  aimX = Math.max(-150, Math.min(150, aimX + d[0]));
  aimY = Math.max(-90, Math.min(90, aimY + d[1]));
  if (reduce) { camX = aimX; camY = aimY; draw(); }
});
window.addEventListener('resize', function () { fit(); if (reduce) draw(); });

fit();
setFocal(focalIn.value);
if (reduce) {
  // reduce — 루프를 시작하지 않고 구슬이 깊이별로 흩어진 한 장만 그린다(빈 화면이 아니다)
  root.classList.add('is-still');
  draw();
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
