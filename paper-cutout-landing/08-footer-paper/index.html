<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confetti strip footer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <footer class="pfoot">
    <div class="pfoot__cols">
      <div class="pfoot__col">
        <p class="pfoot__h">공작실</p>
        <p class="pfoot__l">소개</p>
        <p class="pfoot__l">기록</p>
      </div>
      <div class="pfoot__col">
        <p class="pfoot__h">재료</p>
        <p class="pfoot__l">색종이</p>
        <p class="pfoot__l">스티커</p>
      </div>
      <div class="pfoot__col">
        <p class="pfoot__h">도움말</p>
        <p class="pfoot__l">문의</p>
        <p class="pfoot__l">약관</p>
      </div>
    </div>
    <div class="pfoot__strip" aria-hidden="true">
      <div class="pfoot__track">
        <span class="pfoot__bit pfoot__bit--coral"></span>
        <span class="pfoot__bit pfoot__bit--butter"></span>
        <span class="pfoot__bit pfoot__bit--leaf"></span>
        <span class="pfoot__bit pfoot__bit--sky"></span>
        <span class="pfoot__bit pfoot__bit--coral"></span>
        <span class="pfoot__bit pfoot__bit--butter"></span>
        <span class="pfoot__bit pfoot__bit--leaf"></span>
        <span class="pfoot__bit pfoot__bit--sky"></span>
      </div>
    </div>
  </footer>
</main>
</body>
</html>
