<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper buttons and inputs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="paperui">
    <label class="paperui__field">
      <span class="paperui__ic" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256"><g fill="currentColor"><path d="m224 56l-96 88l-96-88Z" opacity=".2"/><path d="M224 48H32a8 8 0 0 0-8 8v136a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a8 8 0 0 0-8-8m-20.57 16L128 133.15L52.57 64ZM216 192H40V74.19l82.59 75.71a8 8 0 0 0 10.82 0L216 74.19z"/></g></svg>
      </span>
      <input class="paperui__input" type="email" placeholder="you@paper.kit" aria-label="이메일">
    </label>
    <div class="paperui__row">
      <button class="paperui__btn paperui__btn--solid" type="button">붙이기</button>
      <button class="paperui__btn paperui__btn--ghost" type="button">미리보기</button>
    </div>
  </section>
</main>
</body>
</html>
