<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무아레 격자 간섭 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="mo" id="mo">
  <p class="mo__hint">
    <svg class="mo__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M32 64h192v8H32zM32 96h192v8H32zM32 128h192v8H32zM32 160h192v8H32zM32 192h192v8H32z" opacity=".5"/><path d="M64 32l8 192h-8zM96 32l8 192h-8zM128 32l8 192h-8zM160 32l8 192h-8zM192 32l8 192h-8z" opacity=".5"/></g></svg>
    <span>두 각도의 줄무늬가 겹쳐 만드는 물결 같은 무아레 무늬</span>
  </p>
  <div class="mo__field" id="field" role="application" aria-label="무아레 격자 실험판">
    <canvas class="mo__cv" id="cv"></canvas>
    <b class="mo__badge" aria-hidden="true"><span class="mo__badgeNum">7°</span><span class="mo__badgeUnit">각도차</span></b>
  </div>
</div>
</main>
<script>
// 무아레 격자 간섭 — 가로 줄무늬 두 장을 서로 다른 각도·위상으로 겹쳐 getImageData 로 읽은
// 픽셀별 밝기를 곱해 무아레 줄무늬를 만든다. putImageData 로 매 프레임 위상을 Math.sin 만큼
// 밀어 움직이는 물결처럼 보이게 한다.
var root = document.getElementById('mo');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d', { willReadFrequently: true });

var css = getComputedStyle(root);
var A = css.getPropertyValue('--line-a').trim();
var B = css.getPropertyValue('--line-b').trim();

var ANGLE = 7 * Math.PI / 180;   // 두 층의 각도차 — 작을수록 무늬 간격이 넓어진다
var PITCH = 6;                    // 줄무늬 한 칸(px)
var LOOP = 2;

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1, raf = 0;
var img = null, buf = null;

function parse(c) {
  var m = c.match(/^#([0-9a-f]{6})$/i);
  if (!m) return [47, 109, 246];
  return [parseInt(m[1].slice(0, 2), 16), parseInt(m[1].slice(2, 4), 16), parseInt(m[1].slice(4, 6), 16)];
}
var CA = parse(A), CB = parse(B);

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = Math.round(r.width); H = Math.round(r.height);
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  img = ctx.createImageData(W, H);
  buf = img.data;
}

// 줄무늬 층 하나의 밝기(0..1) — 회전된 좌표축을 따라 사인 줄무늬를 만든다
function stripe(x, y, angle, phase) {
  var rx = x * Math.cos(angle) + y * Math.sin(angle);
  var v = Math.sin(rx / PITCH * Math.PI * 2 + phase) * 0.5 + 0.5;
  return v;
}

function draw(sec) {
  var phase = (sec % LOOP) / LOOP * Math.PI * 2;   // 위상을 Math.sin 인자로 밀어 물결처럼 흐르게 한다
  for (var y = 0; y < H; y++) {
    for (var x = 0; x < W; x++) {
      var a = stripe(x, y, 0, phase);
      var b = stripe(x, y, ANGLE, -phase * 0.6);
      var v = a * b;                                 // 두 층의 밝기를 곱해 겹침(무아레)을 만든다
      var i = (y * W + x) * 4;
      buf[i]     = Math.round(CA[0] + (CB[0] - CA[0]) * v);
      buf[i + 1] = Math.round(CA[1] + (CB[1] - CA[1]) * v);
      buf[i + 2] = Math.round(CA[2] + (CB[2] - CA[2]) * v);
      buf[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

function frame(now) {
  draw(now / 1000);
  raf = requestAnimationFrame(frame);
}

fit();
window.addEventListener('resize', function () { fit(); if (reduce) draw(0.35); });
if (reduce) {
  // reduce — 루프 없이 위상 0.35 의 한 장만 그린다(빈 화면이 아니다)
  root.classList.add('is-still');
  draw(0.35);
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
