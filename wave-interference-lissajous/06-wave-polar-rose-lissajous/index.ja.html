<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>극좌표 로즈 리사주 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="pr" id="pr">
  <p class="pr__hint">
    <svg class="pr__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M128 32c-24 32-24 64 0 96c24-32 24-64 0-96Zm0 96c-32 24-64 24-96 0c32-24 64-24 96 0Zm0 0c32-24 64-24 96 0c-32 24-64 24-96 0Zm0 0c-24 32-24 64 0 96c24-32 24-64 0-96Z" opacity=".7"/><circle cx="128" cy="128" r="14"/></g></svg>
    <span>同じリサージュの式が極座標では花びらの形になります</span>
  </p>
  <div class="pr__field" id="field" role="application" aria-label="極座標ローズの実験盤">
    <canvas class="pr__cv" id="cv"></canvas>
    <b class="pr__badge" aria-hidden="true"><span class="pr__badgeNum">5:4</span><span class="pr__badgeUnit">比</span></b>
  </div>
</div>
</main>
<script>
// 극좌표 로즈 리사주 — 01 번과 같은 리사주 수식(두 주파수의 사인 합)이지만
// 직교좌표 대신 각도 θ 에 주파수 비율을 넣어 Math.cos 로 반지름을 구하는 극좌표 방식이라
// 회전하는 꽃잎 모양으로 나온다. Math.sin 으로 다시 x·y 좌표로 바꿔 requestAnimationFrame 마다 찍는다.
var root = document.getElementById('pr');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

var css = getComputedStyle(root);
var PETAL = css.getPropertyValue('--petal').trim();
var CORE = css.getPropertyValue('--core').trim();

var K = 5 / 4;                // 꽃잎 개수를 정하는 주파수 比 n/d
var LOOP = 2;                 // 곡선이 회전 한 바퀴 도는 시간(초)
var TRAIL = 0.09;

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1, raf = 0;

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// 로즈 곡선 위 한 점 — r = cos(K·θ) 를 반지름으로, 회전(spin)을 더해 전체를 돌린다
function petalPoint(th, spin, R) {
  var r = Math.cos(K * th) * R;
  var a = th + spin;
  return {
    x: W * 0.5 + Math.sin(a) * r,
    y: H * 0.5 + Math.cos(a) * r
  };
}

function draw(sec) {
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,' + TRAIL + ')';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  var spin = (sec % LOOP) / LOOP * Math.PI * 2 * 0.5;
  var R = Math.min(W, H) * 0.42;
  var N = 480;                 // K 가 분수라 한 바퀴를 다 그리려면 표본이 많이 필요하다

  ctx.strokeStyle = PETAL;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (var i = 0; i <= N; i++) {
    var p = petalPoint(i / N * Math.PI * 8, spin, R);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();

  ctx.fillStyle = CORE;
  ctx.beginPath();
  ctx.arc(W * 0.5, H * 0.5, 4, 0, Math.PI * 2);
  ctx.fill();
}

function frame(now) {
  draw(now / 1000);
  raf = requestAnimationFrame(frame);
}

fit();
window.addEventListener('resize', function () { fit(); if (reduce) draw(0.4); });
if (reduce) {
  // reduce — 루프 없이 회전 0.4의 한 장만 그린다(빈 화면이 아니다)
  root.classList.add('is-still');
  draw(0.4);
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
