<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정상파 줄넘기 하모닉 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ss" id="ss">
  <p class="ss__hint">
    <svg class="ss__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M32 120h192a8 8 0 0 0 0-16H32a8 8 0 0 0 0 16Z"/><path d="M224 136H32a8 8 0 0 0 0 16h192a8 8 0 0 0 0-16Z"/><path d="M128 88a44 44 0 0 0-44 44a8 8 0 0 0 8 8h72a8 8 0 0 0 8-8a44 44 0 0 0-44-44Zm-26.91 36A28 28 0 0 1 128 104a28 28 0 0 1 26.91 20Z"/><circle cx="52" cy="60" r="12"/><circle cx="204" cy="60" r="12"/></g></svg>
    <span>固定された両端の間 — ハーモニクスが順に変わる弦の定常波</span>
  </p>
  <div class="ss__field" id="field" role="application" aria-label="定常波の弦振動の実験盤">
    <canvas class="ss__cv" id="cv"></canvas>
    <b class="ss__badge" aria-hidden="true"><span class="ss__badgeNum">3</span><span class="ss__badgeUnit">次ハーモニクス</span></b>
  </div>
</div>
</main>
<script>
// 정상파 줄넘기 하모닉 — 양 끝이 고정된 줄 위의 정상파는 sin(nπx/L) 꼴이다.
// 1차·2차·3차 하모닉을 시간이 지나며 차례로 지나가게 하고, 마디(node) 위치에 고정 점을 찍는다.
// 매 프레임 lineTo 로 줄을 다시 그린다 — 속성 트윈이 아니라 계산으로 그린다.
var root = document.getElementById('ss');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

var css = getComputedStyle(root);
var STRING = css.getPropertyValue('--string').trim();
var NODE = css.getPropertyValue('--node').trim();
var RAIL = css.getPropertyValue('--rail').trim();
var INK = css.getPropertyValue('--ink-fg').trim();

var LOOP = 2;                // 하모닉 하나가 머무는 시간 포함 전체 사이클(초)
var SEG = 120;               // 줄을 긋는 조각 수

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1, raf = 0;
var numEl = document.querySelector('.ss__badgeNum');

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// 지금 시각에 해당하는 하모닉 차수와 진폭 — 1→2→3차를 각각 머물렀다가 다음으로 넘어간다
function modeAt(sec) {
  var u = (sec % LOOP) / LOOP;         // 0..1 사이클
  var n = 1 + Math.floor(u * 3);       // 1, 2, 3차
  if (n > 3) n = 3;
  return n;
}

// 정상파 줄 모양 — sin(nπs) 를 s(0..1)를 따라 그린다. 진폭은 하모닉이 커질수록 줄어든다(에너지 보존 느낌)
function drawString(sec) {
  var n = modeAt(sec);
  var t = (sec % LOOP) / LOOP * Math.PI * 2 * 3;   // 진동 시계 — 하모닉 3개를 한 사이클로
  var x0 = W * 0.08, x1 = W * 0.92;
  var mid = H * 0.5;
  var amp = H * 0.3 / n;

  ctx.clearRect(0, 0, W, H);

  // 레일 — 줄이 얹힌 고정 지지대
  ctx.strokeStyle = RAIL;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x0 - 10, mid + 0.5); ctx.lineTo(x1 + 10, mid + 0.5);
  ctx.stroke();

  // 줄 — sin(nπs)·cos(ωt). 공간 부분과 시간 부분이 곱해진 것이 정상파의 정의다
  ctx.strokeStyle = STRING;
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (var i = 0; i <= SEG; i++) {
    var s = i / SEG;
    var x = x0 + (x1 - x0) * s;
    var y = mid - Math.sin(Math.PI * n * s) * amp * Math.cos(t);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // 마디(node) — sin(nπs)=0 인 지점 n−1 개. 줄이 흔들려도 절대 움직이지 않는 점이다
  ctx.fillStyle = NODE;
  for (var k = 1; k < n; k++) {
    var nx = x0 + (x1 - x0) * (k / n);
    ctx.beginPath();
    ctx.arc(nx, mid, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // 고정단 — 양 끝의 핀
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(x0, mid, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x1, mid, 5, 0, Math.PI * 2); ctx.fill();

  if (numEl && numEl.textContent !== String(n)) numEl.textContent = String(n);
}

function frame(now) {
  drawString(now / 1000);
  raf = requestAnimationFrame(frame);
}

fit();
window.addEventListener('resize', function () { fit(); if (reduce) drawString(0.1); });
if (reduce) {
  // reduce — 루프 없이 1次ハーモニクス 최대 진폭의 한 장만 그린다
  root.classList.add('is-still');
  drawString(0.1);
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
