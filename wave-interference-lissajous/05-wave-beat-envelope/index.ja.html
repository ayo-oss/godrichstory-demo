<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맥놀이 진폭 엔벨로프 데모</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="be" id="be">
  <p class="be__hint">
    <svg class="be__ico" viewBox="0 0 256 256" aria-hidden="true"><g fill="currentColor"><path d="M24 128c16-64 40-64 56 0s40 64 56 0s40-64 56 0s40 64 56 0" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/></g></svg>
    <span>わずかに周波数が違う2つの波が出会い、大きくなったり小さくなったりします</span>
  </p>
  <div class="be__field" id="field" role="application" aria-label="うなり波形の実験盤">
    <canvas class="be__cv" id="cv"></canvas>
    <b class="be__badge" aria-hidden="true"><span class="be__badgeNum">9·10</span><span class="be__badgeUnit">Hz</span></b>
  </div>
</div>
</main>
<script>
// 맥놀이 진폭 엔벨로프 — 주파수가 살짝 다른(9Hz·10Hz) 두 Math.sin 파를 더하면 맥놀이가 생긴다.
// requestAnimationFrame 루프에서 합성 파형을 그리고, strokeStyle 을 바꿔 가며 포락선(envelope)
// 곡선을 따로 그려 진폭이 주기적으로 커졌다 작아지는 것을 보여준다.
var root = document.getElementById('be');
var field = document.getElementById('field');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

var css = getComputedStyle(root);
var WAVE = css.getPropertyValue('--wave').trim();
var ENV = css.getPropertyValue('--env').trim();
var RAIL = css.getPropertyValue('--rail').trim();

var F1 = 9, F2 = 10;          // 두 파동의 주파수(Hz) — 차이 1Hz 가 맥놀이 주기를 만든다
var WINDOW = 1.2;             // 화면에 보이는 시간창(초)
var SCROLL = 0.6;             // 파형이 흘러가는 속도(초/초)

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W = 0, H = 0, dpr = 1, raf = 0;

function fit() {
  var r = field.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function draw(sec) {
  var mid = H * 0.5;
  var scale = H * 0.19;

  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = RAIL;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, mid + 0.5); ctx.lineTo(W, mid + 0.5);
  ctx.stroke();

  var t0 = sec * SCROLL;

  // 합성 파형 — 두 사인의 합
  ctx.strokeStyle = WAVE;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (var x = 0; x <= W; x += 2) {
    var t = t0 + (x / W) * WINDOW;
    var v = Math.sin(2 * Math.PI * F1 * t) + Math.sin(2 * Math.PI * F2 * t);
    var y = mid - v * scale;
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // 포락선 — |cos(2π·Δf/2·t)|·2 가 순간 최대 진폭이다. 위·아래로 대칭해 감싸는 곡선을 그린다
  ctx.strokeStyle = ENV;
  ctx.lineWidth = 1.6;
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  for (var xi = 0; xi <= W; xi += 2) {
    var ti = t0 + (xi / W) * WINDOW;
    var env = Math.abs(Math.cos(Math.PI * (F1 - F2) * ti)) * 2;
    var ye = mid - env * scale;
    if (xi === 0) ctx.moveTo(xi, ye); else ctx.lineTo(xi, ye);
  }
  ctx.stroke();
  ctx.beginPath();
  for (var xj = 0; xj <= W; xj += 2) {
    var tj = t0 + (xj / W) * WINDOW;
    var envb = Math.abs(Math.cos(Math.PI * (F1 - F2) * tj)) * 2;
    var yeb = mid + envb * scale;
    if (xj === 0) ctx.moveTo(xj, yeb); else ctx.lineTo(xj, yeb);
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function frame(now) {
  draw(now / 1000);
  raf = requestAnimationFrame(frame);
}

fit();
window.addEventListener('resize', function () { fit(); if (reduce) draw(0.15); });
if (reduce) {
  // reduce — 루프 없이 한 순간의 파형·엔벨로프 한 장만 그린다(빈 화면이 아니다)
  root.classList.add('is-still');
  draw(0.15);
} else {
  raf = requestAnimationFrame(frame);
}
</script>
</body>
</html>
