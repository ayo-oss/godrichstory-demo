<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnetic pull with label offset — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="mag__field">
    <button class="mag is-demo" type="button"><span class="mag__label">プロジェクトを見る</span></button>
  </div>
</main>
<script>
// 실제 동작: 커서가 감지 영역에 들어오면 버튼은 커서 쪽으로, 라벨은 그 절반만큼 반대로 움직인다.
var field = document.querySelector('.mag__field');
var btn = document.querySelector('.mag');
var label = document.querySelector('.mag__label');
field.addEventListener('pointermove', function (e) {
  var r = btn.getBoundingClientRect();
  var dx = (e.clientX - (r.left + r.width / 2)) * 0.35;
  var dy = (e.clientY - (r.top + r.height / 2)) * 0.35;
  btn.classList.remove('is-demo');
  btn.style.translate = dx + 'px ' + dy + 'px';
  label.style.translate = (-dx * 0.4) + 'px ' + (-dy * 0.4) + 'px';
});
field.addEventListener('pointerleave', function () {
  btn.style.translate = '';
  label.style.translate = '';
  btn.classList.add('is-demo');
});
</script>
</body>
</html>
