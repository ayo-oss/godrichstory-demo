<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading morph: button to spinner to check — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <button class="morph is-demo" type="button">
    <span class="morph__label">Pay now</span>
    <span class="morph__spin" aria-hidden="true"></span>
    <svg class="morph__check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="5 12.5 10 17.5 19 7.5"/></svg>
  </button>
</main>
<script>
// 실제 동작: 누르면 aria-busy 로 상태를 알리고 1.2초 뒤 체크로 끝난다. 그동안 두 번 눌리지 않는다.
var morph = document.querySelector('.morph');
morph.addEventListener('click', function () {
  if (morph.classList.contains('is-busy')) { return; }
  morph.classList.remove('is-demo');
  morph.classList.add('is-busy');
  morph.setAttribute('aria-busy', 'true');
  setTimeout(function () {
    morph.classList.remove('is-busy');
    morph.classList.add('is-done');
    morph.removeAttribute('aria-busy');
  }, 1200);
});
</script>
</body>
</html>
