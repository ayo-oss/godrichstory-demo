<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Per-letter split slide — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <button class="split is-demo" type="button" aria-label="자세히 보기"><span class="split__in" aria-hidden="true"></span></button>
</main>
<script>
// 실제 동작: aria-label 의 글자를 하나씩 이중으로 쌓고, 글자 번호(--i)를 지연 시간으로 쓴다.
var split = document.querySelector('.split');
var box = split.querySelector('.split__in');
var text = split.getAttribute('aria-label');
for (var i = 0; i < text.length; i++) {
  var cell = document.createElement('span');
  var roll = document.createElement('b');
  cell.className = 'split__ch';
  cell.style.setProperty('--i', i);
  for (var k = 0; k < 2; k++) {
    var face = document.createElement('i');
    face.textContent = text[i] === ' ' ? ' ' : text[i];
    roll.appendChild(face);
  }
  cell.appendChild(roll);
  box.appendChild(cell);
}
</script>
</body>
</html>
