<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursor spotlight — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <button class="spot is-demo" type="button"><span class="spot__label">요금제 보기</span></button>
</main>
<script>
// 실제 동작: 커서가 버튼 위에 오면 빛의 중심(--mx)이 커서를 따라가고, 손을 떼면 데모 루프로 돌아간다.
var spot = document.querySelector('.spot');
spot.addEventListener('pointermove', function (e) {
  var r = spot.getBoundingClientRect();
  spot.classList.remove('is-demo');
  spot.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
});
spot.addEventListener('pointerleave', function () {
  spot.style.removeProperty('--mx');
  spot.classList.add('is-demo');
});
</script>
</body>
</html>
