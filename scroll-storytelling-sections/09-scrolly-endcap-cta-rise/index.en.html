<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTA that rises at the end — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="ec is-demo">
    <div class="ec__scroller">
      <div class="ec__doc" aria-hidden="true">
        <span class="ec__line"></span>
        <span class="ec__line ec__line--short"></span>
        <span class="ec__line"></span>
        <span class="ec__line ec__line--mid"></span>
        <span class="ec__line"></span>
        <span class="ec__line ec__line--short"></span>
        <span class="ec__line ec__line--mid"></span>
        <span class="ec__line"></span>
      </div>
      <div class="ec__end">
        <div class="ec__bar">
          <span class="ec__txt">Start now</span>
          <span class="ec__btn">
            <span class="ec__btnlabel">Sign up</span>
            <svg viewBox="0 0 256 256" width="14" height="14" aria-hidden="true"><g fill="currentColor"><path d="m216 128l-72 72V56Z" opacity=".2"/><path d="m221.66 122.34l-72-72A8 8 0 0 0 136 56v64H40a8 8 0 0 0 0 16h96v64a8 8 0 0 0 13.66 5.66l72-72a8 8 0 0 0 0-11.32M152 180.69V75.31L204.69 128Z"/></g></svg>
          </span>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작은 CSS 만: 마지막 구간(.ec__end)이 view-timeline 을 만들고,
// 그 안에 position: sticky 로 붙은 막대가 그 진행률만큼 올라온다.
var r = document.querySelector('.ec');
var s = r.querySelector('.ec__scroller');
function stopDemo(){ r.classList.remove('is-demo'); }
r.addEventListener('pointerdown', stopDemo);
s.addEventListener('scroll', stopDemo, { passive: true });
</script>
</body>
</html>
