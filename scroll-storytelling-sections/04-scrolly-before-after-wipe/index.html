<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before and after wipe — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="bw is-demo">
    <div class="bw__scroller">
      <div class="bw__pad">
        <div class="bw__frame">
          <div class="bw__layer bw__layer--after" aria-hidden="true">
            <span class="bw__bar bw__bar--a"></span>
            <span class="bw__bar bw__bar--b"></span>
            <span class="bw__bar bw__bar--c"></span>
            <span class="bw__dot"></span>
          </div>
          <div class="bw__layer bw__layer--before" aria-hidden="true">
            <span class="bw__bar bw__bar--a"></span>
            <span class="bw__bar bw__bar--b"></span>
            <span class="bw__bar bw__bar--c"></span>
            <span class="bw__dot"></span>
          </div>
          <div class="bw__handle" aria-hidden="true">
            <svg viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><g fill="currentColor"><path d="M208 80v96H48V80Z" opacity=".2"/><path d="m213.66 181.66l-32 32a8 8 0 0 1-11.32-11.32L188.69 184H48a8 8 0 0 1 0-16h140.69l-18.35-18.34a8 8 0 0 1 11.32-11.32l32 32a8 8 0 0 1 0 11.32m-139.32-64a8 8 0 0 0 11.32-11.32L67.31 88H208a8 8 0 0 0 0-16H67.31l18.35-18.34a8 8 0 0 0-11.32-11.32l-32 32a8 8 0 0 0 0 11.32Z"/></g></svg>
          </div>
        </div>
        <p class="bw__tags"><span class="bw__tag bw__tag--old">이전</span><span class="bw__tag">이후</span></p>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작은 CSS 만: 위층의 clip-path 와 손잡이 위치를 animation-timeline: view() 가 함께 끌고 간다.
var r = document.querySelector('.bw');
var s = r.querySelector('.bw__scroller');
function stopDemo(){ r.classList.remove('is-demo'); }
r.addEventListener('pointerdown', stopDemo);
s.addEventListener('scroll', stopDemo, { passive: true });
</script>
</body>
</html>
