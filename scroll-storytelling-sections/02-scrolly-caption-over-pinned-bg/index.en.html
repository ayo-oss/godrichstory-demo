<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captions over a pinned backdrop — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="cb is-demo">
    <div class="cb__scroller">
      <div class="cb__bg">
        <div class="cb__scene" aria-hidden="true">
          <span class="cb__sun"></span>
          <svg class="cb__peaks" viewBox="0 0 256 256" width="120" height="120" aria-hidden="true"><g fill="currentColor"><path d="M144 52a20 20 0 1 1 20 20a20 20 0 0 1-20-20m49.44 55.92a8 8 0 0 0-13.77 0l-33 55.75l-21-35.67H50.35L8 200h240Z" opacity=".2"/><path d="M164 80a28 28 0 1 0-28-28a28 28 0 0 0 28 28m0-40a12 12 0 1 1-12 12a12 12 0 0 1 12-12m90.88 155.92l-54.56-92.08A15.87 15.87 0 0 0 186.55 96a15.85 15.85 0 0 0-13.76 7.84L146.63 148l-44.84-76.1a16 16 0 0 0-27.58 0L1.11 195.94A8 8 0 0 0 8 208h240a8 8 0 0 0 6.88-12.08M88 80l23.57 40H64.43ZM22 192l33-56h66l33 56Zm150.57 0l-16.66-28.28L186.55 112L234 192Z"/></g></svg>
        </div>
        <div class="cb__dim" aria-hidden="true"></div>
      </div>
      <div class="cb__caps">
        <p class="cb__cap">The first scene never moves an inch.</p>
        <p class="cb__cap">Only the cards rise and leave through the top.</p>
        <p class="cb__cap">The more it is covered, the darker the backdrop gets.</p>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작은 CSS 만: 배경은 position: sticky, 어두워지는 정도는 animation-timeline: scroll().
var r = document.querySelector('.cb');
var s = r.querySelector('.cb__scroller');
function stopDemo(){ r.classList.remove('is-demo'); }
r.addEventListener('pointerdown', stopDemo);
s.addEventListener('scroll', stopDemo, { passive: true });
</script>
</body>
</html>
