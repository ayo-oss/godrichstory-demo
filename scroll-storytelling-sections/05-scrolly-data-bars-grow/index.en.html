<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bars that grow on entry — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="db is-demo">
    <div class="db__scroller">
      <div class="db__pad">
        <p class="db__cap">Return visits</p>
        <div class="db__chart">
          <div class="db__col"><span class="db__bar"></span><span class="db__axis">Q1</span></div>
          <div class="db__col"><span class="db__bar"></span><span class="db__axis">Q2</span></div>
          <div class="db__col"><span class="db__bar"></span><span class="db__axis">Q3</span></div>
          <div class="db__col"><span class="db__bar"></span><span class="db__axis">Q4</span></div>
          <div class="db__col"><span class="db__bar"></span><span class="db__axis">Q5</span></div>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
// 실제 동작은 CSS 만: 막대마다 animation-timeline: view() 와 서로 다른 animation-range 가 걸려 있다.
var r = document.querySelector('.db');
var s = r.querySelector('.db__scroller');
function stopDemo(){ r.classList.remove('is-demo'); }
r.addEventListener('pointerdown', stopDemo);
s.addEventListener('scroll', stopDemo, { passive: true });
</script>
</body>
</html>
