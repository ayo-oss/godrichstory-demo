<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하드코딩 글자 스캔 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <div class="editor">
    <header class="editor__head"><span class="editor__dot"></span><span class="editor__name">index.html</span></header>
    <ul class="editor__rows">
      <li class="cl" style="--i:0"><span class="cl__bar"></span><span class="cl__txt" data-t="&lt;button&gt;구매하기&lt;/button&gt;"></span></li>
      <li class="cl" style="--i:1"><span class="cl__bar"></span><span class="cl__txt" data-t="&lt;button&gt;{t('buy.now')}&lt;/button&gt;"></span></li>
      <li class="cl" style="--i:2"><span class="cl__bar"></span><span class="cl__txt" data-t="&lt;h2&gt;자주 묻는 질문&lt;/h2&gt;"></span></li>
      <li class="cl" style="--i:3"><span class="cl__bar"></span><span class="cl__txt" data-t="&lt;a href=&quot;/en/&quot;&gt;{t('nav.faq')}&lt;/a&gt;"></span></li>
      <li class="cl" style="--i:4"><span class="cl__bar"></span><span class="cl__txt" data-t="&lt;p&gt;배송 안내&lt;/p&gt;"></span></li>
    </ul>
    <span class="editor__scan"></span>
    <p class="editor__badge">하드코딩 3곳</p>
  </div>
</main>
