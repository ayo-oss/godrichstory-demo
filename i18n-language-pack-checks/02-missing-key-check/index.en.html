<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">

<title>한쪽 언어에만 있는 키 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage is-demo">
  <div class="board">
    <div class="col">
      <p class="col__head">ko</p>
      <ul class="col__rows">
        <li class="pill" style="--i:0">nav.home</li>
        <li class="pill" style="--i:1">nav.about</li>
        <li class="pill" style="--i:2">nav.cart</li>
        <li class="pill" style="--i:3">nav.mypage</li>
      </ul>
    </div>
    <div class="col">
      <p class="col__head">en</p>
      <ul class="col__rows">
        <li class="pill pill--en" style="--i:0">nav.home</li>
        <li class="pill pill--en" style="--i:1">nav.about</li>
        <li class="pill pill--en" style="--i:2">nav.cart</li>
        <li class="slot" style="--i:3"><span class="slot__badge">missing</span></li>
      </ul>
    </div>
  </div>
</main>
