<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스펙트럼 막대 — 푸리에 에피사이클 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fe is-demo" id="feRoot">
  <p class="fe__hint">
    <span>エピサイクルの横に周波数ごとの係数大きさをバーで立てると、星は低い周波数わずかが働き、落書きは均一な櫛が並ぶ — 図形の指紋が現れます</span>
  </p>
  <div class="fe__field" id="feField" role="application" aria-label="スペクトラムバー 実験版" tabindex="0">
    <canvas class="fe__cv" id="feCv"></canvas>
  </div>
  <div class="fe__bar">
    <span class="fe__meta"><b class="fe__val" id="feN">0</b><span id="feUnit"> 星から落書きへ・連続変形</span></span>
    <span class="fe__meta fe__meta--dim">canvas · |c_k| spectrum · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 스펙트럼 막대(06). 주파수 영역의 시각화 — |c_k| 를 주파수 축에 세운다.
//   ① 왼쪽 절반: 에피사이클 체인(03 의 별 파이프라인 재사용)이 그림을 그린다.
//   ② 오른쪽 절반: 그 그림의 계수 크기 |c_k| 를 주파수 순(-M/2 ~ +M/2) 막대그래프로 세운다.
//   ③ 시간이 흐르며 별 → 낙서로 계수가 연속 보간되어 막대 무늬(지문)가 실시간으로 바뀐다.
//     별은 저주파 몇 개가 크고, 낙서는 고른 빗이 선다 — 이 대비가 이 항목의 주제다.
//
// 화면이 사는 장치 — 077 기준:
//  · 막대 전체가 매 프레임 다시 그려진다(높이·색이 계속 흔들린다).
//  · 밑바탕 수평 기준선·스캔 밴드가 흐른다. 체인 쪽 방사 스윕도 함께 돈다.
(function () {
  // ── 변형 상수 블록 ──
  var NBARS = 24;      // 막대 개수(표시할 주파수 슬롯, ±12)
  var MORPH = 2.6;     // 별↔낙서 보간 주기(초)
  // ──────────────────
  var TAU = Math.PI * 2;
  var N = 128;

  var root = document.getElementById('feRoot');
  var field = document.getElementById('feField');
  var cv = document.getElementById('feCv');
  var nOut = document.getElementById('feN');

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK  = tokRGB('--fe-ink');
  var C_GLOW = tokRGB('--fe-glow');
  var C_HOT  = tokRGB('--fe-hot');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf = 0, t0 = -1;
  var W = 0, H = 0, dpr = 1;

  // ── 두 그림의 경로·계수 ──
  function starPath(u) {
    var seg = u * 10;
    var i = Math.floor(seg);
    var f = seg - i;
    var a1 = i / 10 * TAU - Math.PI / 2;
    var a2 = (i + 1) / 10 * TAU - Math.PI / 2;
    var r1 = (i % 2 === 0) ? 1 : 0.42;
    var r2 = (i % 2 === 0) ? 0.42 : 1;
    var x1 = Math.cos(a1) * r1, y1 = Math.sin(a1) * r1;
    var x2 = Math.cos(a2) * r2, y2 = Math.sin(a2) * r2;
    return { x: x1 + (x2 - x1) * f, y: y1 + (y2 - y1) * f };
  }
  function doodlePath(u) {
    // 고른 스펙트럼이 나오는 낙서 — 여러 주파수가 비슷한 크기로 섞인 물결 무늬
    var t = u * TAU;
    return {
      x: Math.cos(t) * (0.32 + 0.18 * Math.sin(t * 3) + 0.1 * Math.sin(t * 7 + 1)),
      y: Math.sin(t) * (0.3 + 0.16 * Math.cos(t * 5) + 0.09 * Math.sin(t * 8 + 2))
    };
  }
  function dft(path) {
    var M = path.length;
    var out = [];
    for (var k = 0; k < M; k++) {
      var freq = (k <= M / 2) ? k : k - M;
      var re = 0, im = 0;
      for (var n = 0; n < M; n++) {
        var a = -TAU * k * n / M;
        var c = Math.cos(a), s = Math.sin(a);
        re += path[n].x * c - path[n].y * s;
        im += path[n].x * s + path[n].y * c;
      }
      re /= M; im /= M;
      out.push({ freq: freq, re: re, im: im, amp: Math.sqrt(re * re + im * im) });
    }
    out.sort(function (a, b) { return b.amp - a.amp; });
    return out;
  }

  var STAR = [], DOODLE = [];
  var STARC = [], DOODLEC = [];
  // 주파수 슬롯: freq → 두 그림의 계수 매핑(보간용)
  var slotStar = {}, slotDoodle = {};

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = '100%'; cv.style.height = '100%';
    if (!STAR.length) {
      for (var i = 0; i < N; i++) {
        STAR.push(starPath(i / N));
        DOODLE.push(doodlePath(i / N));
      }
      STARC = dft(STAR);
      DOODLEC = dft(DOODLE);
      for (var a = 0; a < STARC.length; a++) slotStar[STARC[a].freq] = STARC[a];
      for (var b = 0; b < DOODLEC.length; b++) slotDoodle[DOODLEC[b].freq] = DOODLEC[b];
    }
  }

  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  // 보간 계수 — mix 0(별)~1(낙서). 진폭은 lerp, 위상은 그대로(별의 위상 우선)
  function coefAt(mix) {
    var used = [];
    for (var fi = -NBARS / 2; fi <= NBARS / 2; fi++) {
      if (fi === 0 && mix < 0.5) continue;
      var s = slotStar[fi], d = slotDoodle[fi];
      if (!s || !d) continue;
      used.push({
        freq: fi,
        amp: s.amp + (d.amp - s.amp) * mix,
        ph: s.ph !== undefined ? s.ph + (d.ph - s.ph) * mix : 0
      });
    }
    // 위상 채우기(첫 계산 후 고정)
    for (var i = 0; i < used.length; i++) {
      var s2 = slotStar[used[i].freq], d2 = slotDoodle[used[i].freq];
      used[i].ph = Math.atan2(s2.im, s2.re) + (Math.atan2(d2.im, d2.re) - Math.atan2(s2.im, s2.re)) * mix;
    }
    return used;
  }

  var CO = [];   // 최근 보간 계수(막대 그리기에 재사용)

  function chainAt(u, co) {
    var base = Math.min(W, H) * 0.34;
    var cx = W * 0.25, cy = H * 0.5;
    var pts = [{ x: cx, y: cy }];
    co.sort(function (a, b) { return b.amp - a.amp; });
    for (var i = 0; i < co.length && i < 20; i++) {
      var c = co[i];
      var ang = c.freq * u * TAU + c.ph;
      pts.push({
        x: pts[i].x + Math.cos(ang) * c.amp * base,
        y: pts[i].y + Math.sin(ang) * c.amp * base
      });
    }
    return pts;
  }

  function draw(t) {
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = 'rgb(' + C_INK[0] + ',' + C_INK[1] + ',' + C_INK[2] + ')';
    ctx.fillRect(0, 0, W, H);

    var mix = 0.5 - 0.5 * Math.cos(t * TAU / MORPH);   // 0↔1 왕복
    CO = coefAt(mix);

    // ── 왼쪽: 체인 ──
    var cx = W * 0.25, cy = H * 0.5;
    var maxR = Math.min(W, H) * 0.52;
    var sweep = t * 0.85;
    for (var b = 0; b < 16; b++) {
      ctx.fillStyle = rgba(C_GLOW, 0.1 * (1 - b / 16));
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, maxR, sweep - (b + 1) * 0.06, sweep - b * 0.06);
      ctx.closePath();
      ctx.fill();
    }
    var spin = t * 0.3;
    for (var i = 0; i < 14; i++) {
      var a = spin + (i / 14) * TAU;
      ctx.strokeStyle = rgba(C_GLOW, i % 2 === 0 ? 0.1 : 0.06);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 10, cy + Math.sin(a) * 10);
      ctx.lineTo(cx + Math.cos(a) * maxR, cy + Math.sin(a) * maxR);
      ctx.stroke();
    }

    var u = (t * 0.5) % 1;
    var pts = chainAt(u, CO);
    var base = Math.min(W, H) * 0.34;
    for (var ci = 0; ci < pts.length - 1; ci++) {
      var r = CO[ci].amp * base;
      if (r > 2) {
        ctx.strokeStyle = rgba(C_GLOW, 0.1 + 0.01 * ci);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(pts[ci].x, pts[ci].y, r, 0, TAU);
        ctx.stroke();
      }
      ctx.strokeStyle = rgba(C_GLOW, 0.5);
      ctx.beginPath();
      ctx.moveTo(pts[ci].x, pts[ci].y);
      ctx.lineTo(pts[ci + 1].x, pts[ci + 1].y);
      ctx.stroke();
    }
    var pen = pts[pts.length - 1];
    var pulse = 0.5 + 0.5 * Math.sin(t * 8);
    ctx.fillStyle = rgba(C_HOT, 0.3);
    ctx.beginPath();
    ctx.arc(pen.x, pen.y, (2.4 + pulse * 2.2) * 2.3, 0, TAU);
    ctx.fill();
    ctx.fillStyle = rgba(C_HOT, 1);
    ctx.beginPath();
    ctx.arc(pen.x, pen.y, 2.4 + pulse * 2.2, 0, TAU);
    ctx.fill();

    // ── 오른쪽: 스펙트럼 ──
    var gx = W * 0.46, gw = W * 0.5, baseY = H * 0.78;
    // 구분선
    ctx.strokeStyle = rgba(C_GLOW, 0.16);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W * 0.43, 0); ctx.lineTo(W * 0.43, H);
    ctx.stroke();
    // 기준선(밑변·중앙) — 숨쉰다
    ctx.strokeStyle = rgba(C_GLOW, 0.1 + 0.03 * Math.sin(t * 1.6));
    ctx.beginPath();
    ctx.moveTo(gx, baseY); ctx.lineTo(gx + gw, baseY);
    ctx.moveTo(gx, H * 0.3); ctx.lineTo(gx + gw, H * 0.3);
    ctx.stroke();
    // 스캔 밴드 — 막대 영역을 흐른다(계단 12단)
    var bx = gx + ((t * 60) % (gw + 40)) - 20;
    for (var sb = 0; sb < 12; sb++) {
      ctx.fillStyle = rgba(C_GLOW, 0.09 * (1 - sb / 12));
      ctx.fillRect(bx - sb * 5, 0, 5, H);
    }
    // 막대 — freq -12~+12 를 좌우로. 현재 mix 의 진폭
    var bw = gw / (NBARS + 1);
    var maxAmp = 0.02;
    for (var q = 0; q < CO.length; q++) if (CO[q].amp > maxAmp) maxAmp = CO[q].amp;
    for (var qq = 0; qq < CO.length; qq++) {
      var c2 = CO[qq];
      var x = gx + gw / 2 + c2.freq * bw;
      var hbar = (c2.amp / maxAmp) * (H * 0.4);
      var jitter = 1 + 0.06 * Math.sin(t * 5 + c2.freq);
      ctx.fillStyle = rgba(C_GLOW, 0.4);
      ctx.fillRect(x - bw * 0.28, baseY - hbar * jitter, bw * 0.56, hbar * jitter);
      ctx.fillStyle = rgba(C_HOT, 0.9);
      ctx.fillRect(x - bw * 0.28, baseY - hbar * jitter, bw * 0.56, 2.4);
    }
    return pen;
  }

  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = (now - t0) / 1000;
    draw(t);
    if (nOut) nOut.textContent = String(NBARS);
    raf = requestAnimationFrame(frame);
  }

  function stillFrame() {
    draw(MORPH * 0.25);
  }

  window.addEventListener('resize', function () {
    fit();
    if (reduce) stillFrame();
  });

  fit();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
