<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기본 에피사이클 체인 — 푸리에 에피사이클 — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fe is-demo" id="feRoot">
  <p class="fe__hint">
    <span>Chain a few precomputed complex coefficients into circles of shrinking radius, tip to center — the endpoint traces petal-like symmetric figures across the plane: the minimal unit of Fourier resynthesis</span>
  </p>
  <div class="fe__field" id="feField" role="application" aria-label="Basic Epicycle Chain Demo" tabindex="0">
    <canvas class="fe__cv" id="feCv"></canvas>
  </div>
  <div class="fe__bar">
    <span class="fe__meta"><b class="fe__val" id="feN">0</b><span id="feUnit"> 5 terms · coefficients hand-set</span></span>
    <span class="fe__meta fe__meta--dim">canvas · complex chain · requestAnimationFrame</span>
  </div>
</div>
</main>
<script>
// 기본 에피사이클 체인(01). 푸리에 재합성의 최소 단위 —
// 계수열 coef[k] = (반지름, 시작 위상) 을 직접 정의하고 주파수 k 배로 도는 원들을
// 앞 원의 끝점을 다음 원의 중심으로 삼아 이어 붙인다. 맨 끝점(펜)의 자리가
// 원운동의 합 f(t) = Σ r_k · e^(i(k·t + φ_k)) 이다. 계수를 잘 고르면
// 꽃잎 무늬가 되고, 이 구조 그대로 경로 점의 DFT 계수로 바꾸면(03·04) 그림이 그려진다.
//
// 화면이 사는 장치 — 077 캔버스 기준의 "매 프레임 계산":
//  · 밑바탕 극격자(회전 스포크·동심원)가 매 프레임 다시 그려진다 — 푸리에의 본향인 극좌표 무늬가
//    천천히 돌며 화면 전면이 살아 움직인다(누적면적 ↑).
//  · 궤적은 투명 누적 캔버스에 쌓고 혜성 꼬리처럼 서서히 감쇠한다(절대 clear 하지 않는다).
//  · 펜 끝에 크기가 맥동하는 점을 얹어 순간 강도를 유지한다.
(function () {
  // ── 변형 상수 블록 — 아래 값 하나만 바꿔 변형을 만든다 ──
  var SPEED = 1.0;   // 회전 속도(배) — 변형 "시간 속도"가 이 값을 1→3으로 바꾼다
  var TERMS = 5;     // 체인에 얹는 계수(원) 개수
  // ────────────────────────────────────────────────────
  // 계수 5개 — 주파수 2·3·5·7·9, 위상을 어긋나게 잡아 꽃잎 대칭이 나오게 한다
  var COEF = [
    { k: 2, r: 0.34, p: 0.0 },
    { k: 3, r: 0.18, p: 1.1 },
    { k: 5, r: 0.12, p: 2.4 },
    { k: 7, r: 0.07, p: 0.6 },
    { k: 9, r: 0.05, p: 3.6 }
  ];

  var root = document.getElementById('feRoot');
  var field = document.getElementById('feField');
  var cv = document.getElementById('feCv');
  var nOut = document.getElementById('feN');

  var css = getComputedStyle(root);
  function tokRGB(name) {
    var s = css.getPropertyValue(name).trim();
    var hx = s.length === 4
      ? s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2) + s.charAt(3) + s.charAt(3)
      : s.slice(1);
    return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
  }
  var C_INK  = tokRGB('--fe-ink');
  var C_GLOW = tokRGB('--fe-glow');
  var C_HOT  = tokRGB('--fe-hot');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf = 0, t0 = -1;
  var W = 0, H = 0, dpr = 1;
  var chainCv, chainCtx;   // 누적 궤적용 투명 오프스크린 캔버스
  var ROT = 0;

  function fit() {
    var r = field.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = '100%'; cv.style.height = '100%';
    chainCv = document.createElement('canvas');
    chainCv.width = W * dpr; chainCv.height = H * dpr;
    chainCtx = chainCv.getContext('2d');
    chainCtx.scale(dpr, dpr);
  }

  // 계수 체인을 t 각도로 돌려 펜 위치까지의 중심·반지름 배열을 계산한다
  function computeChain(t) {
    var cx = W * 0.5, cy = H * 0.5;
    var base = Math.min(W, H) * 0.48;
    var pts = [{ x: cx, y: cy }];
    for (var i = 0; i < TERMS && i < COEF.length; i++) {
      var c = COEF[i];
      var a = c.k * t + c.p;
      var px = pts[i].x + Math.cos(a) * c.r * base;
      var py = pts[i].y + Math.sin(a) * c.r * base;
      pts.push({ x: px, y: py });
    }
    return pts;
  }

  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  // 밑바탕 극격자 — 매 프레임 계산해 다시 그린다(절대 누적 안 함). 천천히 도는 스포크 16개 + 동심원
  function drawGrid(t) {
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var cx = W * 0.5, cy = H * 0.5;
    var maxR = Math.sqrt(cx * cx + cy * cy);
    var spin = t * 0.09;
    // 스포크 16 — 안쪽은 진하고 바깥은 옅게(그라디언트 아님: 두 구간 알파)
    for (var i = 0; i < 16; i++) {
      var a = spin + (i / 16) * Math.PI * 2;
      ctx.strokeStyle = rgba(C_GLOW, i % 2 === 0 ? 0.075 : 0.038);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 14, cy + Math.sin(a) * 14);
      ctx.lineTo(cx + Math.cos(a) * maxR, cy + Math.sin(a) * maxR);
      ctx.stroke();
    }
    // 동심원 4 — 반지름이 살짝 숨쉰다
    for (var k = 1; k <= 4; k++) {
      var rr = (Math.min(W, H) * 0.14) * k * (1 + 0.012 * Math.sin(t * 1.3 + k));
      ctx.strokeStyle = rgba(C_GLOW, 0.05);
      ctx.beginPath();
      ctx.arc(cx, cy, rr, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawFrame(t, penPulse) {
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawGrid(t);
    ctx.drawImage(chainCv, 0, 0, W, H);

    var pts = computeChain(t);
    var base = Math.min(W, H) * 0.48;

    // 원 체인 — 링은 옅게, 링크는 주색
    ctx.lineWidth = 1;
    for (var i = 0; i < pts.length - 1; i++) {
      var r = COEF[i].r * base;
      ctx.strokeStyle = rgba(C_GLOW, 0.16 + 0.05 * i);
      ctx.beginPath();
      ctx.arc(pts[i].x, pts[i].y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = rgba(C_GLOW, 0.55);
      ctx.beginPath();
      ctx.moveTo(pts[i].x, pts[i].y);
      ctx.lineTo(pts[i + 1].x, pts[i + 1].y);
      ctx.stroke();
      ctx.fillStyle = rgba(C_GLOW, 0.8);
      ctx.beginPath();
      ctx.arc(pts[i].x, pts[i].y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }

    // 펜 — 맥동하는 절정 점
    var pen = pts[pts.length - 1];
    var pr = 2.6 + penPulse * 2.4;
    ctx.fillStyle = rgba(C_HOT, 0.28);
    ctx.beginPath();
    ctx.arc(pen.x, pen.y, pr * 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(C_HOT, 1);
    ctx.beginPath();
    ctx.arc(pen.x, pen.y, pr, 0, Math.PI * 2);
    ctx.fill();
    return pen;
  }

  function stampPen(pen, prev) {
    // 궤적 누적 — 펜이 지나간 자리를 주색으로 쌓는다(두꺼운 선 + 옅은 확장)
    chainCtx.strokeStyle = rgba(C_GLOW, 0.85);
    chainCtx.lineWidth = 1.8;
    chainCtx.lineCap = 'round';
    chainCtx.beginPath();
    chainCtx.moveTo(prev.x, prev.y);
    chainCtx.lineTo(pen.x, pen.y);
    chainCtx.stroke();
    chainCtx.strokeStyle = rgba(C_GLOW, 0.2);
    chainCtx.lineWidth = 4.4;
    chainCtx.stroke();
  }

  function decayTrail() {
    // 혜성 감쇠 — 목적지 알파를 1 로 유지하며 목적지 외 픽셀을 천천히 지운다
    chainCtx.setTransform(1, 0, 0, 1, 0, 0);
    chainCtx.globalCompositeOperation = 'destination-out';
    chainCtx.fillStyle = 'rgba(0,0,0,0.028)';
    chainCtx.fillRect(0, 0, W * dpr, H * dpr);
    chainCtx.globalCompositeOperation = 'source-over';
    chainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  var prevPen = null;

  function frame(now) {
    if (t0 < 0) { t0 = now; prevPen = null; }
    var t = ((now - t0) / 1000) * SPEED;
    var pulse = 0.5 + 0.5 * Math.sin(t * 9.0);
    decayTrail();
    var pen = drawFrame(t, pulse);
    if (prevPen) stampPen(pen, prevPen);
    prevPen = pen;
    if (nOut) nOut.textContent = String(TERMS);
    raf = requestAnimationFrame(frame);
  }

  function stillFrame() {
    // reduce — 궤적을 미리 한 바퀴 쌓은 뒤 마지막 장면을 고정한다
    var prev = computeChain(0)[TERMS];
    for (var i = 1; i <= 240; i++) {
      var tt = (i / 240) * Math.PI * 2;
      var pen = computeChain(tt)[TERMS];
      stampPen(pen, prev);
      prev = pen;
    }
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = 'rgb(' + C_INK[0] + ',' + C_INK[1] + ',' + C_INK[2] + ')';
    ctx.fillRect(0, 0, W, H);
    drawFrame(2.1, 0.5);
  }

  window.addEventListener('resize', function () {
    fit();
    if (reduce) stillFrame();
  });

  fit();
  if (reduce) {
    stillFrame();
    root.classList.add('is-still');
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
