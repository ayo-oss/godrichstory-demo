<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signup step progress</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <ol class="stepper is-demo" aria-label="Signup progress">
    <li class="stepper__step stepper__step--1"><span class="stepper__dot">1</span><span class="stepper__label">Account</span></li>
    <li class="stepper__connector"><span class="stepper__fill stepper__fill--1"></span></li>
    <li class="stepper__step stepper__step--2"><span class="stepper__dot">2</span><span class="stepper__label">Profile</span></li>
    <li class="stepper__connector"><span class="stepper__fill stepper__fill--2"></span></li>
    <li class="stepper__step stepper__step--3"><span class="stepper__dot">3</span><span class="stepper__label">Done</span></li>
  </ol>
</main>
</body>
</html>
