<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split-screen login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="split is-demo">
    <div class="split__panel split__panel--image">
      <span class="split__brand">Godrich</span>
      <p class="split__tagline">Build fast, ship faster.</p>
    </div>
    <form class="split__panel split__panel--form" autocomplete="off">
      <span class="split__line split__line--label"></span>
      <span class="split__line split__line--input"></span>
      <span class="split__line split__line--label"></span>
      <span class="split__line split__line--input"></span>
      <button class="split__btn" type="button">Sign in</button>
    </form>
  </div>
</main>
</body>
</html>
