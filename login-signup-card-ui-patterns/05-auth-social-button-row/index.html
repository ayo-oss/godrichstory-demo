<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social login button row</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="social-row is-demo">
    <button class="social-btn social-btn--a" type="button" aria-label="Continue with Google">
      <span class="social-btn__dot"></span>Google
    </button>
    <button class="social-btn social-btn--b" type="button" aria-label="Continue with Apple">
      <span class="social-btn__dot"></span>Apple
    </button>
    <button class="social-btn social-btn--c" type="button" aria-label="Continue with Kakao">
      <span class="social-btn__dot"></span>Kakao
    </button>
  </div>
</main>
</body>
</html>
