<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glassmorphic login card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="glass-scene is-demo">
    <span class="glass-scene__blob glass-scene__blob--a" aria-hidden="true"></span>
    <span class="glass-scene__blob glass-scene__blob--b" aria-hidden="true"></span>
    <form class="glass-card" autocomplete="off">
      <h2 class="glass-card__title">Welcome back</h2>
      <input class="glass-card__input" type="email" placeholder="Email">
      <input class="glass-card__input" type="password" placeholder="Password">
      <button class="glass-card__btn" type="button">Log in</button>
    </form>
  </div>
</main>
</body>
</html>
