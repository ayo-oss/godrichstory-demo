<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic-link sent card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="magic-card">
    <span class="envelope" aria-hidden="true">
      <svg class="envelope__icon" viewBox="0 0 256 256"><g fill="currentColor"><path d="m224 56l-96 88l-96-88Z" opacity=".2"/><path d="M224 48H32a8 8 0 0 0-8 8v136a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a8 8 0 0 0-8-8m-20.57 16L128 133.15L52.57 64ZM216 192H40V74.19l82.59 75.71a8 8 0 0 0 10.82 0L216 74.19z"/></g></svg>
      <span class="envelope__badge"></span>
    </span>
    <h2 class="magic-card__title">Check your email</h2>
    <p class="magic-card__desc">We sent a sign-in link to you@example.com</p>
    <button class="magic-card__resend" type="button" disabled>Resend in <span class="magic-card__count">30</span>s</button>
  </div>
</main>
<script>
var btn=document.querySelector('.magic-card__resend'),
    cnt=document.querySelector('.magic-card__count'),
    n=30,
    timer=setInterval(function(){
      n--; cnt.textContent=n;
      if(n<=0){clearInterval(timer);btn.disabled=false;btn.firstChild.textContent='Resend link';cnt.remove();}
    },1000);
btn.addEventListener('click',function(){
  if(btn.disabled)return;
  n=30; btn.disabled=true; btn.textContent='Resend in ';
  var span=document.createElement('span'); span.className='magic-card__count'; span.textContent=n;
  btn.appendChild(span); btn.appendChild(document.createTextNode('s'));
  cnt=span;
  timer=setInterval(function(){
    n--; cnt.textContent=n;
    if(n<=0){clearInterval(timer);btn.disabled=false;btn.textContent='Resend link';}
  },1000);
});
</script>
</body>
</html>
