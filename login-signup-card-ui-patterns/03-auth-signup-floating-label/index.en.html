<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floating-label signup input</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <form class="float-form is-demo" autocomplete="off">
    <div class="float-field float-field--a">
      <input class="float-field__input" id="fname" placeholder=" ">
      <label class="float-field__label" for="fname">Full name</label>
    </div>
    <div class="float-field float-field--b">
      <input class="float-field__input" id="femail" placeholder=" ">
      <label class="float-field__label" for="femail">Email</label>
    </div>
    <button class="float-form__btn" type="button">Create account</button>
  </form>
</main>
</body>
</html>
