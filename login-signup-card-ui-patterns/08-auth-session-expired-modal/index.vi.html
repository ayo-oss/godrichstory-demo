<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session-expired re-login modal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="modal-scene is-demo">
    <div class="modal-scene__page">
      <span class="modal-scene__line"></span>
      <span class="modal-scene__line modal-scene__line--short"></span>
      <span class="modal-scene__line"></span>
    </div>
    <div class="modal-scene__backdrop"></div>
    <div class="modal-scene__modal" role="alertdialog" aria-label="Session expired">
      <h2 class="modal-scene__title">Session expired</h2>
      <p class="modal-scene__desc">Please sign in again to continue.</p>
      <button class="modal-scene__btn" type="button">Log in again</button>
    </div>
  </div>
</main>
</body>
</html>
