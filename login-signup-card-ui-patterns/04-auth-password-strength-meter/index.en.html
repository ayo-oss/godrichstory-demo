<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password strength meter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="pw-card is-demo">
    <label class="pw-card__label" for="pw">Password</label>
    <input class="pw-input" id="pw" type="password" placeholder="Type a password">
    <div class="pw-meter">
      <span class="pw-meter__fill"></span>
    </div>
    <p class="pw-status" aria-live="polite">
      <span class="pw-status__text pw-status__text--weak">Weak</span>
      <span class="pw-status__text pw-status__text--medium">Medium</span>
      <span class="pw-status__text pw-status__text--strong">Strong</span>
    </p>
  </div>
</main>
<script>
var inp=document.getElementById('pw'),
    fill=document.querySelector('.pw-meter__fill'),
    card=document.querySelector('.pw-card');
inp.addEventListener('input',function(){
  card.classList.remove('is-demo');
  var v=inp.value, s=0;
  if(v.length>=6)s++;
  if(/[a-z]/.test(v)&&/[A-Z]/.test(v))s++;
  if(/[0-9]/.test(v))s++;
  if(/[^A-Za-z0-9]/.test(v))s++;
  var pct=v.length?[15,40,70,100,100][s]:0;
  var col=['#b27062','#b27062','#c8af8f','#51a474','#51a474'][s];
  fill.style.width=pct+'%'; fill.style.background=col;
});
</script>
</body>
</html>
