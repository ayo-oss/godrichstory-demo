<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">

<title>Terms consent checkbox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="consent-card is-demo">
    <label class="consent">
      <input class="consent__input" type="checkbox">
      <span class="consent__box">
        <svg class="consent__svg" viewBox="0 0 20 20" aria-hidden="true">
          <path class="consent__check" d="M4 10.5l4 4 8-9" pathLength="1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      I agree to the Terms and Privacy Policy
    </label>
  </div>
</main>
