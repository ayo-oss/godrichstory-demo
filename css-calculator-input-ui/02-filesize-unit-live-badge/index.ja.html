<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バイトの値が自ら単位を選ぶファイルサイズバッジ — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="fb is-demo" id="fb">
  <label class="fb__cap" for="fbBytes">バイトの値</label>
  <div class="fb__body">
    <input class="fb__input" id="fbBytes" type="number" inputmode="numeric" min="0" step="1" value="483" aria-label="バイトの値を入力すると桁数を計算して単位を選び、バーを満たします" aria-describedby="fbReadout">
    <div class="fb__badge" aria-hidden="true">
      <div class="fb__bar" id="fbBar"></div>
      <span class="fb__unit" id="fbUnit">B</span>
    </div>
  </div>
  <p class="fb__readout" id="fbReadout" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('fb');
  var input = document.getElementById('fbBytes');
  var bar = document.getElementById('fbBar');
  var unitEl = document.getElementById('fbUnit');
  var readout = document.getElementById('fbReadout');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isDemo = true;

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  // 계산 한 겹 — 자릿수로 단위를 고르고(digitsOf/pickUnit), 그 단위 안에서 채움 비율(fillRatio)을 구한다
  function digitsOf(n) {
    n = Math.floor(Math.abs(n));
    return n === 0 ? 1 : String(n).length;
  }
  function pickUnit(bytes) {
    var d = digitsOf(bytes);
    if (d <= 3) return { name: 'B', pow: 0 };
    if (d <= 6) return { name: 'KB', pow: 1 };
    if (d <= 9) return { name: 'MB', pow: 2 };
    return { name: 'GB', pow: 3 };
  }
  function fillRatio(bytes, unit) {
    var v = bytes / Math.pow(1024, unit.pow);
    return clamp01(v / 1024);
  }

  var SENT_PREFIX = '入力した', SENT_MID1 = 'バイトは', SENT_MID2 = '単位で', SENT_SUFFIX = 'です。';

  var targetR = 0, renderedR = 0;
  var LERP_RATE = 0.16; // 변형 02: 낮추면 막대가 값 변화를 더 천천히 뒤따라간다

  function readValue() {
    var n = parseFloat(input.value);
    return isNaN(n) || n < 0 ? 0 : n;
  }

  function applyValue(bytes) {
    var unit = pickUnit(bytes);
    var valueInUnit = bytes / Math.pow(1024, unit.pow);
    targetR = fillRatio(bytes, unit);
    unitEl.textContent = unit.name;
    readout.textContent = SENT_PREFIX + bytes + SENT_MID1 + unit.name + SENT_MID2 + valueInUnit.toFixed(2) + SENT_SUFFIX;
    if (reduce) { renderedR = targetR; paint(); }
  }

  function paint() {
    bar.style.transform = 'scaleX(' + renderedR.toFixed(4) + ')';
  }

  input.addEventListener('input', function () { human(); applyValue(readValue()); });
  input.addEventListener('change', function () { human(); applyValue(readValue()); });

  var DEMO_VALUES = [7, 320, 4821, 88320, 2748000, 91000000, 1200000000, 15000000000];
  var DRIVE_PERIOD_MS = 2000;
  var driveStart = 0, lastIdx = -1;
  function driveTick(now) {
    if (!driveStart) driveStart = now;
    if (isDemo) {
      var frac = ((now - driveStart) % DRIVE_PERIOD_MS) / DRIVE_PERIOD_MS;
      var idx = Math.floor(frac * DEMO_VALUES.length);
      if (idx !== lastIdx) { lastIdx = idx; input.value = DEMO_VALUES[idx]; applyValue(DEMO_VALUES[idx]); }
    }
    requestAnimationFrame(driveTick);
  }

  function frame() { renderedR += (targetR - renderedR) * LERP_RATE; paint(); requestAnimationFrame(frame); }

  applyValue(readValue());

  if (!reduce) { requestAnimationFrame(driveTick); requestAnimationFrame(frame); }
})();
</script>
</body>
</html>
