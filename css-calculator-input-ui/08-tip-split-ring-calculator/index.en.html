<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Tip-Split Ring Where the Headcount Value Divides the Share — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="ts is-demo" id="ts">
  <div class="ts__fields">
    <div class="ts__field">
      <span class="ts__cap">Total amount</span>
      <input class="ts__total" id="tsTotal" type="number" inputmode="numeric" min="0" step="1000" value="42000" aria-label="Entering the total amount also calculates the per-person share with the headcount and fills the ring segment" aria-describedby="tsReadout">
    </div>
    <div class="ts__field">
      <span class="ts__cap">Headcount</span>
      <input class="ts__count" id="tsCount" type="number" inputmode="numeric" min="1" max="12" step="1" value="3" aria-label="Entering the headcount also calculates the per-person share with the total amount and fills the ring segment" aria-describedby="tsReadout">
    </div>
  </div>
  <div class="ts__ring">
    <svg viewBox="0 0 72 72" aria-hidden="true">
      <circle class="ts__track" cx="36" cy="36" r="30"></circle>
      <circle class="ts__fill" id="tsFill" cx="36" cy="36" r="30"></circle>
    </svg>
    <span class="ts__share" id="tsShare" aria-hidden="true"></span>
  </div>
  <p class="ts__readout" id="tsReadout" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('ts');
  var totalInput = document.getElementById('tsTotal');
  var countInput = document.getElementById('tsCount');
  var fill = document.getElementById('tsFill');
  var shareEl = document.getElementById('tsShare');
  var readout = document.getElementById('tsReadout');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isDemo = true;

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  var RADIUS = 30;
  var CIRCUMFERENCE = 2 * Math.PI * RADIUS;
  fill.style.strokeDasharray = CIRCUMFERENCE.toFixed(2);

  // 계산 한 겹 — 1인당 분담액, 링 조각 비율(=1/Headcount)
  function perPersonShare(total, n) { return n > 0 ? total / n : 0; }
  function shareFraction(n) { return n > 0 ? 1 / n : 0; }
  function formatNumber(v) {
    var s = Math.round(v).toString();
    var out = '';
    for (var i = 0; i < s.length; i++) {
      var pos = s.length - i;
      out = s[i] + out;
      if (pos > 1 && (pos - 1) % 3 === 0) out += ',';
    }
    return out;
  }

  var SENT_PREFIX = 'Total ', SENT_MID1 = ' split among ', SENT_MID2 = ' people gives ', SENT_MID3 = ' per person, which is ', SENT_SUFFIX = '% of the total.';

  var targetF = 0, renderedF = 0;
  var LERP_RATE = 0.15;

  function applyValue(total, n) {
    var share = perPersonShare(total, n);
    var frac = shareFraction(n);
    targetF = frac;
    shareEl.textContent = '1/' + n;
    readout.textContent = SENT_PREFIX + formatNumber(total) + SENT_MID1 + n + SENT_MID2 + formatNumber(share) + SENT_MID3 + (frac * 100).toFixed(1) + SENT_SUFFIX;
    if (reduce) { renderedF = targetF; paint(); }
  }

  function paint() {
    var offset = CIRCUMFERENCE * (1 - renderedF);
    fill.style.strokeDashoffset = offset.toFixed(2);
  }

  function readValues() {
    var total = parseFloat(totalInput.value); if (isNaN(total) || total < 0) total = 0;
    var n = parseInt(countInput.value, 10); if (isNaN(n) || n < 1) n = 1;
    return { total: total, n: n };
  }

  function onInput() { human(); var v = readValues(); applyValue(v.total, v.n); }
  totalInput.addEventListener('input', onInput);
  totalInput.addEventListener('change', onInput);
  countInput.addEventListener('input', onInput);
  countInput.addEventListener('change', onInput);

  var DEMO_VALUES = [
    { total: 42000, n: 3 },
    { total: 15000, n: 2 },
    { total: 88000, n: 5 },
    { total: 120000, n: 4 },
    { total: 9600, n: 6 },
    { total: 250000, n: 8 }
  ];
  var DRIVE_PERIOD_MS = 2000;
  var driveStart = 0, lastIdx = -1;
  function driveTick(now) {
    if (!driveStart) driveStart = now;
    if (isDemo) {
      var frac = ((now - driveStart) % DRIVE_PERIOD_MS) / DRIVE_PERIOD_MS;
      var idx = Math.floor(frac * DEMO_VALUES.length);
      if (idx !== lastIdx) {
        lastIdx = idx;
        totalInput.value = DEMO_VALUES[idx].total;
        countInput.value = DEMO_VALUES[idx].n;
        applyValue(DEMO_VALUES[idx].total, DEMO_VALUES[idx].n);
      }
    }
    requestAnimationFrame(driveTick);
  }

  function frame() {
    renderedF += (targetF - renderedF) * LERP_RATE;
    paint();
    requestAnimationFrame(frame);
  }

  var init = readValues();
  applyValue(init.total, init.n);

  if (!reduce) {
    requestAnimationFrame(driveTick);
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
