<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="https://godrichstory.com/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="https://godrichstory.com/static/favicon.png"><link rel="apple-touch-icon" href="https://godrichstory.com/static/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>値が埋まっていくグラデーション温度計インプット — demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
<div class="tc is-demo" id="tc">
  <label class="tc__cap" for="tcC">摂氏の値</label>
  <div class="tc__body">
    <input class="tc__input" id="tcC" type="number" inputmode="decimal" step="0.5" min="-10" max="40" value="22" aria-label="摂氏の値を入力すると華氏も一緒に計算し、目盛りのハンドルを動かします" aria-describedby="tcReadout">
    <div class="tc__scale" aria-hidden="true">
      <div class="tc__track"></div>
      <div class="tc__handle" id="tcHandle"></div>
    </div>
  </div>
  <p class="tc__readout" id="tcReadout" role="status" aria-live="polite"></p>
</div>
</main>
<script>
(function () {
  var root = document.getElementById('tc');
  var input = document.getElementById('tcC');
  var handle = document.getElementById('tcHandle');
  var scale = handle.parentElement;
  var readout = document.getElementById('tcReadout');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isDemo = true;

  function human() { if (isDemo) { root.classList.remove('is-demo'); isDemo = false; } }

  var MIN_C = -10, MAX_C = 40;
  // 계산 한 겹 — 摂氏-> 화씨, 그리고 눈금 위 위치(0~1)
  function celsiusToFahrenheit(c) { return c * 9 / 5 + 32; }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  var SENT_PREFIX = '摂氏', SENT_MID = '度は華氏', SENT_SUFFIX = '度です。';

  var targetT = 0, renderedT = 0;
  var LERP_RATE = 0.14; // 변형 01: 낮추면 손잡이가 값 변화를 더 천천히 뒤따라간다

  function readValue() {
    var c = parseFloat(input.value);
    return isNaN(c) ? 0 : c;
  }

  function applyValue(c) {
    var f = celsiusToFahrenheit(c);
    targetT = clamp01((c - MIN_C) / (MAX_C - MIN_C));
    readout.textContent = SENT_PREFIX + c.toFixed(1) + SENT_MID + f.toFixed(1) + SENT_SUFFIX;
    if (reduce) { renderedT = targetT; paint(); }
  }

  function paint() {
    var trackH = scale.clientHeight - handle.offsetHeight;
    var y = (1 - renderedT) * trackH;
    handle.style.transform = 'translateY(' + y.toFixed(1) + 'px)';
  }

  input.addEventListener('input', function () { human(); applyValue(readValue()); });
  input.addEventListener('change', function () { human(); applyValue(readValue()); });

  var DEMO_VALUES = [-4, 8, 22, 31, 38, 14];
  var DRIVE_PERIOD_MS = 2000; // 렌더 캐처 창(설정 초=2.0)과 같은 주기 — 시연 전용
  var driveStart = 0, lastIdx = -1;
  function driveTick(now) {
    if (!driveStart) driveStart = now;
    if (isDemo) {
      var frac = ((now - driveStart) % DRIVE_PERIOD_MS) / DRIVE_PERIOD_MS;
      var idx = Math.floor(frac * DEMO_VALUES.length);
      if (idx !== lastIdx) {
        lastIdx = idx;
        input.value = DEMO_VALUES[idx];
        applyValue(DEMO_VALUES[idx]);
      }
    }
    requestAnimationFrame(driveTick);
  }

  function frame() {
    renderedT += (targetT - renderedT) * LERP_RATE;
    paint();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', paint);
  applyValue(readValue());

  if (!reduce) {
    requestAnimationFrame(driveTick);
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
